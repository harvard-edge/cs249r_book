project:
  type: website
  output-dir: _build
  pre-render: scripts/build_directory.py prepare
  post-render: scripts/build_directory.py
  render:
    - index.qmd
    - intro/index.qmd
    - scaling/index.qmd
    - physical-ai/index.qmd
    - physical-ai/eth-spring-2027/index.qmd
    - physical-ai/eth-spring-2027/syllabus.qmd
    - tinyml/index.qmd
    - edge-ai/index.qmd
  resources:
    - assets/**

website:
  title: "MLSysBook Courses"
  description: "Student-facing course websites using the MLSysBook curriculum."
  site-url: https://mlsysbook.ai/courses/
  navbar:
    title: "Machine Learning Systems"
    logo: assets/images/logo.png
    search: true
  back-to-top-navigation: true
  sidebar:
    - id: physical-ai
      title: "Physical AI"
      style: floating
      contents:
        - text: "All Courses"
          href: index.qmd
        - section: "Physical AI"
          href: physical-ai/index.qmd
          contents:
            - text: "Course Overview"
              href: physical-ai/index.qmd
            - text: "For Instructors"
              href: https://mlsysbook.ai/instructors/vol4/
            - text: "Earlier Related Courses"
              href: physical-ai/index.qmd#earlier-related-courses
            - section: "ETH Zurich · Spring 2027"
              contents:
                - text: "Offering Overview"
                  href: physical-ai/eth-spring-2027/index.qmd
                - text: "Syllabus & Schedule"
                  href: physical-ai/eth-spring-2027/syllabus.qmd
                - text: "Labs"
                  href: physical-ai/eth-spring-2027/index.qmd#labs
    - id: tinyml
      title: "TinyML"
      style: floating
      contents:
        - text: "All Courses"
          href: index.qmd
        - section: "TinyML"
          href: tinyml/index.qmd
          contents:
            - text: "Course Overview"
              href: tinyml/index.qmd#course-overview
            - text: "Syllabi & Schedules"
              href: tinyml/index.qmd#syllabi-and-schedules
            - text: "Assignments"
              href: tinyml/index.qmd#course-assignments-on-github
            - text: "Selected Projects"
              href: tinyml/index.qmd#selected-example-projects
            - text: "For Instructors"
              href: tinyml/index.qmd#for-instructors
            - text: "HarvardX Resources"
              href: tinyml/index.qmd#related-harvardx-tinyml-materials
    - id: edge-ai
      title: "Edge AI"
      style: floating
      contents:
        - text: "All Courses"
          href: index.qmd
        - section: "Edge AI"
          href: edge-ai/index.qmd
          contents:
            - text: "Overview"
              href: edge-ai/index.qmd#overview
            - text: "Read and Experiment"
              href: edge-ai/index.qmd#materials
            - text: "For Instructors"
              href: edge-ai/index.qmd#for-instructors

metadata-files:
  - ../shared/config/navbar-common.yml
  - ../shared/config/footer-common.yml

format:
  html:
    theme:
      light:
        - default
        - ../shared/styles/style-site.scss
      dark:
        - darkly
        - ../shared/styles/style-site.scss
        - ../shared/styles/dark-mode-site.scss
    respect-user-color-scheme: true
    css:
      - assets/course.css
      - assets/eth.css
    toc: true
    toc-depth: 2
    anchor-sections: true
    code-copy: true
