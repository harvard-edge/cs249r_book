project:
  type: website
  output-dir: _build
  pre-render: scripts/build_directory.py prepare
  post-render: scripts/build_directory.py
  render:
    - index.qmd
    - intro/index.qmd
    - scaling/index.qmd
    - physical-ai/index.qmd
    - physical-ai/eth-spring-2027/index.qmd
    - physical-ai/eth-spring-2027/syllabus.qmd
    - tinyml/index.qmd
    - edge-ai/index.qmd
  resources:
    - assets/**

website:
  title: "MLSysBook Courses"
  description: "Course plans, learning paths, and offerings built on the MLSysBook curriculum."
  site-url: https://mlsysbook.ai/courses/
  favicon: assets/images/logo.png
  back-to-top-navigation: true
  bread-crumbs: true

  # Shared navbar from navbar-common.yml; site-local dropdown merged by Quarto,
  # matching the Instructor Hub pattern.
  navbar:
    title: "Machine Learning Systems"
    logo: assets/images/logo.png
    search: true
    left:
      - text: "Courses"
        menu:
          - icon: grid
            text: "All Courses"
            href: index.qmd
          - text: "---"
          - text: "Introduction to ML Systems"
            href: intro/index.qmd
          - text: "Scaling ML Systems"
            href: scaling/index.qmd
          - text: "TinyML"
            href: tinyml/index.qmd
          - text: "Edge AI"
            href: edge-ai/index.qmd
          - text: "Physical AI"
            href: physical-ai/index.qmd
          - text: "---"
          - text: "Instructor Hub"
            href: https://mlsysbook.ai/instructors/
  sidebar:
    - id: courses
      title: "Courses"
      style: floating
      contents:
        - text: "All Courses"
          href: index.qmd
        - text: "Introduction to ML Systems"
          href: intro/index.qmd
        - text: "Scaling ML Systems"
          href: scaling/index.qmd
        - text: "TinyML"
          href: tinyml/index.qmd
        - text: "Edge AI"
          href: edge-ai/index.qmd
        - text: "Physical AI"
          href: physical-ai/index.qmd

metadata-files:
  - ../shared/config/navbar-common.yml
  - ../shared/config/footer-common.yml
  - config/announcement.yml

format:
  html:
    theme:
      light:
        - default
        - ../shared/styles/style-site.scss
      dark:
        - default
        - ../shared/styles/style-site.scss
        - ../shared/styles/dark-mode-site.scss
    respect-user-color-scheme: true
    css:
      - assets/eth.css
    toc: true
    toc-depth: 2
    include-in-header:
      - file: ../shared/config/site-head.html
    anchor-sections: true
    code-copy: true
