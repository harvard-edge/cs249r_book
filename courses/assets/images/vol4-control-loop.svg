<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#FFFFFF"/>

  <!-- ===== Zone labels ===== -->
  <text x="295" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#1F407A">PROPOSES · learned, best-effort timing</text>
  <text x="645" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">PERMITS · fixed rules, hard real-time</text>

  <!-- ===== Authority boundary ===== -->
  <line x1="470" y1="60" x2="470" y2="230" stroke="#475569" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="470" y="250" text-anchor="middle" font-size="12" fill="#475569">authority boundary</text>

  <!-- ===== Components ===== -->
  <rect x="40" y="90" width="120" height="100" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="100" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Camera</text>
  <text x="100" y="156" text-anchor="middle" font-size="12.5" fill="#475569">sees the scene</text>

  <rect x="200" y="90" width="190" height="100" rx="3" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.5"/>
  <text x="295" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Linux MPU</text>
  <text x="295" y="147" text-anchor="middle" font-size="12.5" fill="#475569">policy (SmolVLA / ACT)</text>
  <text x="295" y="167" text-anchor="middle" font-size="12.5" fill="#475569">proposes the next move</text>

  <rect x="550" y="90" width="190" height="100" rx="3" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="645" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">STM32 MCU</text>
  <text x="645" y="147" text-anchor="middle" font-size="12.5" fill="#475569">safety governor</text>
  <text x="645" y="167" text-anchor="middle" font-size="12.5" fill="#475569">permits, clamps, or vetoes</text>

  <rect x="800" y="90" width="120" height="100" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <text x="860" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">SO-101 arm</text>
  <text x="860" y="156" text-anchor="middle" font-size="12.5" fill="#475569">moves the world</text>

  <!-- ===== Forward path ===== -->
  <line x1="160" y1="140" x2="198" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>

  <line x1="390" y1="140" x2="548" y2="140" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <rect x="408" y="110" width="124" height="20" fill="#FFFFFF"/>
  <text x="470" y="125" text-anchor="middle" font-family="Menlo, 'Courier New', monospace" font-size="13" font-weight="700" fill="#1D4ED8">a_req → a_map</text>

  <line x1="740" y1="140" x2="798" y2="140" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="770" y="128" text-anchor="middle" font-family="Menlo, 'Courier New', monospace" font-size="13" font-weight="700" fill="#047857">a_enf</text>

  <!-- ===== Encoder readback ===== -->
  <path d="M860,190 V210 H645 V192" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="752" y="228" text-anchor="middle" font-family="Menlo, 'Courier New', monospace" font-size="13" font-weight="700" fill="#334155">a_meas</text>

  <!-- ===== Physical feedback (perimeter) ===== -->
  <path d="M900,190 V280 H100 V192" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="2,4" marker-end="url(#arr-slate)"/>
  <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#475569">the world changes; the next image shows what actually happened</text>
</svg>
