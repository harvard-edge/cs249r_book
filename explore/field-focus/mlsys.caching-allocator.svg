<g id="concept-mlsys.caching-allocator" class="node">
<title>mlsys.caching-allocator</title>
<g id="a_concept-mlsys.caching-allocator"><a xlink:title="A runtime allocator that retains and reuses freed device memory blocks to avoid costly allocation calls, at the risk of fragmentation.">
