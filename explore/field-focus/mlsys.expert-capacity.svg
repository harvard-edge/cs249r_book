<g id="concept-mlsys.mixture-of-experts" class="node">
<title>mlsys.mixture-of-experts</title>
<g id="a_concept-mlsys.mixture-of-experts"><a xlink:title="An architecture in which a learned router activates a small subset of expert subnetworks per token, decoupling total parameter count from per-token compute.">
