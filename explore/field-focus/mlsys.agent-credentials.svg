<g id="concept-mlsys.agent-credentials" class="node">
<title>mlsys.agent-credentials</title>
<g id="a_concept-mlsys.agent-credentials"><a xlink:title="Issuing tool-using agents scoped, short-lived credentials that act on a user's behalf, brokering secrets outside model context so authority stays bounded and revocable.">
