<g id="concept-mlsys.mtbf" class="node">
<title>mlsys.mtbf</title>
<g id="a_concept-mlsys.mtbf"><a xlink:title="The expected operating time between failures of a component or system; for independent components, system MTBF shrinks roughly in inverse proportion to component count.">
<path fill="#f7f7f7" stroke="#88949d" stroke-width="1.15" d="M314,-314C314,-314 152,-314 152,-314 146,-314 140,-308 140,-302 140,-302 140,-272 140,-272 140,-266 146,-260 152,-260 152,-260 314,-260 314,-260 320,-260 326,-266 326,-272 326,-272 326,-302 326,-302 326,-308 320,-314 314,-314" />
<text text-anchor="middle" x="233" y="-292.2" font-family="Helvetica Neue" font-size="16.00">Mean time between</text>
<text text-anchor="middle" x="233" y="-274.2" font-family="Helvetica Neue" font-size="16.00">failures</text>
</a>
</g>
</g>

<g id="concept-mlsys.training-goodput" class="node">
<title>mlsys.training-goodput</title>
<g id="a_concept-mlsys.training-goodput"><a xlink:title="The fraction of allocated accelerator time that produces retained training progress, after losses to scheduling, failures, restarts, and lost work.">
