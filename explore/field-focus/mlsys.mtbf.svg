</a>
</g>
</g>

<g id="concept-mlsys.checkpoint-interval" class="node">
<title>mlsys.checkpoint-interval</title>
<g id="a_concept-mlsys.checkpoint-interval"><a xlink:title="The checkpoint period that minimizes expected lost time, balancing checkpoint write cost against expected rework, approximately the square root of twice the write cost times MTBF.">
