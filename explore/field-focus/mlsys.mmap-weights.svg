<g id="concept-mlsys.mmap-weights" class="node">
<title>mlsys.mmap-weights</title>
<g id="a_concept-mlsys.mmap-weights"><a xlink:title="Mapping a weight file into virtual memory so pages load on demand and read-only weights are shared across processes, cutting load time and duplicate memory at the cost of page faults.">
