<g id="concept-mlsys.agent-harness" class="node">
<title>mlsys.agent-harness</title>
<g id="a_concept-mlsys.agent-harness"><a xlink:title="The runtime that repeatedly calls a model, dispatches its tool actions, appends observations, and decides whether the trajectory continues, pauses, or ends.">
