<g id="concept-mlsys.llm-call-tracing" class="node">
<title>mlsys.llm-call-tracing</title>
<g id="a_concept-mlsys.llm-call-tracing"><a xlink:title="Tracing model calls, retrievals, and tool invocations as spans annotated with prompts, token counts, latency, and cost, so quality and spend are attributable per step.">
