      schema_version:
        range: integer
        required: true
        equals_number: 1
        description: Integer schema version of the document (must equal 1).
      decisions:
        range: CoverageLedgerDecision
        multivalued: true
        inlined_as_list: true
        required: true
        description: Audited reconciliation decisions for chapter primary concept declarations.
  CoverageLedgerDecision:
    description: Audited reconciliation decision for a chapter primary concept declaration.
    attributes:
      chapter:
        required: true
        description: Volume and chapter folder identifier (e.g., vol2/08_fleet_orchestration).
      label:
        required: true
        description: Canonical human-readable term or heading in sentence case.
      role:
        required: true
        description: Role played by an external source or a chapter concept declaration.
      disposition:
        range: LedgerDispositionEnum
        required: true
        description: Reconciliation disposition of the chapter concept against field concepts.
      field_concepts:
        multivalued: true
        required: false
