      rationale:
        required: true
        description: Editorial placement principles or justification for a hierarchy/ledger assertion.
      evidence:
        range: LedgerEvidenceQuote
        multivalued: true
        inlined_as_list: true
        required: true
        description: Verbatim manuscript section quotes supporting the reconciliation decision.
      inventory_id:
        required: true
        description: Deterministic hash identifier of the chapter concept declaration.
      reviewer:
        required: true
        description: Human or model reviewer that audited the reconciliation decision.
      reviewer_kind:
        required: true
        description: Whether the reviewer was human or ai.
      reviewed_on:
        required: true
        description: ISO-8601 date on which the reconciliation decision was recorded.
      source_hash:
        required: true
        description: SHA-256 digest of the manuscript section text.
      field_hash:
        required: false
