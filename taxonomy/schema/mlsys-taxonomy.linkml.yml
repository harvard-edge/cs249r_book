  CoverageChecklistModel:
    description: Root document for external coverage benchmark checklists (taxonomy/coverage/*.yml).
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
        description: Integer schema version of the document (must equal 1).
      id:
        identifier: true
        required: true
        description: Permanent machine-readable identifier for this record.
      title:
        required: true
