    description: Audited reconciliation decision for a chapter primary concept declaration.
    attributes:
      chapter:
        required: true
        description: Volume and chapter folder identifier (e.g., vol2/08_fleet_orchestration).
      label:
        required: true
        description: Canonical human-readable term or heading in sentence case.
      role:
        range: ConceptRoleEnum
        required: true
        description: Role played by an external source or a chapter concept declaration.
      disposition:
        range: LedgerDispositionEnum
        required: true
        description: Reconciliation disposition of the chapter concept against field concepts.
      field_concepts:
        multivalued: true
        required: false
        pattern: ^mlsys\.[a-z0-9]+(-[a-z0-9]+)*$
        description: Field concept identifiers mapped to this chapter concept declaration.
