id: https://mlsysbook.ai/taxonomy/schema
name: mlsys_taxonomy
title: ML Systems Taxonomy Metamodel (LinkML)
description: Formal LinkML metamodel for the Machine Learning Systems Taxonomy, covering the field concept
  graph (ml-systems-field.yml), the subject classification framework (ml-systems-framework.yml), practitioner
  guides (ml-systems-guides.yml), textbook passage alignment (mlsysbook-alignment.yml), the SKOS hierarchy
  pilot (ml-systems-taxonomy.yml), external coverage checklists (taxonomy/coverage/*.yml), and the chapter
  coverage ledger (coverage-ledger.yml).
version: 0.3-draft
license: https://creativecommons.org/licenses/by/4.0/
prefixes:
  linkml: https://w3id.org/linkml/
  mlsys: https://mlsysbook.ai/taxonomy/
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  owl: http://www.w3.org/2002/07/owl#
default_prefix: mlsys
default_range: string
imports:
- linkml:types
enums:
  ModelStatusEnum:
    description: Lifecycle status of a top-level taxonomy model document.
    permissible_values:
      editorial-draft:
        description: Scoped editorial draft for community and expert review.
  DraftStatusEnum:
    description: Review status of individual concept, relationship, subject, or alignment assertions.
    permissible_values:
      draft:
        description: Authored draft assertion awaiting formal version-bound review provenance.
  GapStatusEnum:
    description: Status of a declared candidate scope gap in the framework.
    permissible_values:
      candidate:
        description: Candidate scope gap declared for investigation, not a verified absence claim.
  FrameworkVersionEnum:
    description: Supported versions of the ML Systems Taxonomy framework.
    permissible_values:
      0.1-draft:
        description: Initial area and subject row inventory.
      0.2-draft:
        description: Added top-level groups and readable hierarchical codes.
      0.3-draft:
        description: Connected concept graph with controlled relation vocabulary and practitioner guides.
  ConceptScopeEnum:
    description: Scope boundary of a concept or concept family within ML systems engineering.
    permissible_values:
      core:
        description: Core ML systems engineering concept applicable across system regimes.
      background:
        description: Foundational ML, mathematics, or computer systems concept used as background.
      model-extension:
        description: Concept specific to particular model families or architectures.
      generative-extension:
        description: Concept specific to generative models, LLMs, or diffusion pipelines.
      agent-extension:
        description: Concept specific to tool-using, planning, or multi-agent ML systems.
      physical-extension:
        description: Concept specific to embodied, robotic, or cyber-physical ML systems.
      specialist:
        description: Domain-specialist or regulatory/hardware niche concept.
  SourceKindEnum:
    description: Kind of external design reference or reading source.
    permissible_values:
      curriculum:
        description: University course syllabus or curriculum.
      documentation:
        description: Official framework, library, or platform documentation.
      engineering-guide:
        description: Practitioner engineering guide or operational handbook.
      research:
        description: Peer-reviewed research paper or technical report.
      paper:
        description: Conference or journal publication.
      standard:
        description: Formal industry, safety, or international standard.
      taxonomy:
        description: Established classification scheme or body of knowledge.
      textbook:
        description: Published textbook or monograph.
  RelationKindEnum:
    description: High-level semantic category of a controlled relationship verb.
    permissible_values:
      mechanism:
        description: How a technique operates, produces an artifact, or realizes an abstraction.
      constraint:
        description: Directional effect on a cost, bound, capacity, or system quantity.
      tradeoff:
        description: Symmetric tension or competing design alternative.
      evaluation:
        description: Measurement or detection of a system property or failure mode.
      dependency:
        description: Strict requirement or common building-block reliance.
      failure:
        description: Causal production or mitigation of a fault, hazard, or degradation.
      composition:
        description: Taxonomic specialization or structural part-whole membership.
  RelationshipBasisEnum:
    description: Epistemic basis for a relationship assertion between two concepts.
    permissible_values:
      editorial-synthesis:
        description: Authored synthesis grounded in cited reading sources under stated conditions.
  AlignmentDepthEnum:
    description: Teaching depth assessment status for a textbook passage link.
    permissible_values:
      not-assessed:
        description: Passage link identifies a related section without certifying coverage depth.
  AlignmentRelationEnum:
    description: Semantic relationship between a field concept and a textbook learner-graph node.
    permissible_values:
      related-passage:
        description: The textbook section discusses or illustrates the field concept.
  ChecklistStatusEnum:
    description: Coverage judgment for an external benchmark topic against the taxonomy.
    permissible_values:
      covered:
        description: Directly represented by one or more field concepts.
      partial:
        description: Placed under an existing subject row, with specific sub-mechanism not yet promoted
          to a distinct concept.
      missing:
        description: In scope for ML systems engineering but not yet represented.
      out-of-scope:
        description: Outside the declared scope boundary of the ML Systems Taxonomy.
  LedgerDispositionEnum:
    description: Reconciliation disposition of a chapter primary concept declaration against field concepts.
    permissible_values:
      mapped-to:
        description: Directly corresponds to one or more field concepts.
      broader-than:
        description: Chapter declaration spans multiple narrower component field concepts.
      narrower-than:
        description: Chapter declaration is a specific instance of a broader field concept.
      candidate-new:
        description: Candidate for promotion to a new field concept.
      out-of-scope:
        description: Chapter-local pedagogical construct outside field taxonomy scope.
classes:
  FieldModel:
    class_uri: skos:ConceptScheme
    description: Root document for taxonomy/ml-systems-field.yml defining the field concept inventory,
      controlled relation vocabulary, propositional edges, and views.
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
        description: Integer schema version of the document (must equal 1).
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      title:
        slot_uri: dcterms:title
        required: true
        description: Human-readable title of the document or source.
      scope:
        slot_uri: skos:scopeNote
        required: true
        description: Declared scope boundary or scope note.
      status:
        range: ModelStatusEnum
        required: true
        description: Editorial review lifecycle status of the record.
      background_boundary:
        required: false
        description: Rule distinguishing core ML systems concepts from imported background concepts.
      limitations:
        multivalued: true
        required: false
        description: Explicit caveats on what the model does and does not claim.
      learning_paths:
        required: false
        description: Policy note or ordered list of guided learning paths.
      sources:
        range: FieldSource
        multivalued: true
        inlined_as_list: true
        required: true
        description: External curricula, standards, documentation, or research sources.
      families:
        range: ConceptFamily
        multivalued: true
        inlined_as_list: true
        required: true
        description: Coarse navigation groupings of field concepts.
      concepts:
        range: Concept
        multivalued: true
        inlined_as_list: true
        required: true
        description: Technical concepts belonging to this model, subject, or view.
      relations:
        range: ControlledRelation
        multivalued: true
        inlined_as_list: true
        required: false
        description: Controlled relationship verbs with forward and inverse readings.
      retired:
        range: RetiredConcept
        multivalued: true
        inlined_as_list: true
        required: false
        description: Permanent redirect records for withdrawn or merged concept identities.
      relationships:
        range: Relationship
        multivalued: true
        inlined_as_list: true
        required: true
        description: Directed, condition-qualified technical propositions between concepts.
      views:
        range: FieldView
        multivalued: true
        inlined_as_list: true
        required: true
        description: Named subsets of field concepts rendered as diagrams.
  FieldSource:
    class_uri: dct:BibliographicResource
    description: External curriculum, standard, documentation, or research source warranting field concepts.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      title:
        slot_uri: dcterms:title
        required: true
        description: Human-readable title of the document or source.
      url:
        slot_uri: dcterms:source
        required: true
        pattern: ^https://[^\s<>"{}|\\^`]+$
        description: Canonical HTTPS URL for the external reference source.
      kind:
        range: SourceKindEnum
        required: true
        description: Category of source or semantic category of relationship.
      scope:
        required: true
        description: Declared scope boundary or scope note.
  ConceptFamily:
    class_uri: skos:Collection
    description: Coarse navigation grouping of field concepts sharing a core engineering question.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[a-z0-9-]+$
        description: Permanent machine-readable identifier for this record.
      label:
        slot_uri: skos:prefLabel
        required: true
        description: Canonical human-readable term or heading in sentence case.
      scope:
        range: ConceptScopeEnum
        required: true
        description: Declared scope boundary or scope note.
      question:
        required: true
        description: Core engineering question answered by this group, area, or family.
      references:
        range: FieldSource
        multivalued: true
        required: true
        description: Identifiers of external reading sources warranting this record.
  Concept:
    class_uri: skos:Concept
    description: A permanent, chapter-independent technical concept in machine learning systems.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^mlsys\.[a-z0-9-]+$
        description: Permanent machine-readable identifier for this record.
      label:
        slot_uri: skos:prefLabel
        required: true
        description: Canonical human-readable term or heading in sentence case.
      definition:
        slot_uri: skos:definition
        required: true
        description: Single-sentence technical definition stating what the item is and what it changes.
      family:
        range: ConceptFamily
        required: true
        description: Identifier of the owning concept family.
      status:
        range: DraftStatusEnum
        required: true
        description: Editorial review lifecycle status of the record.
      aliases:
        slot_uri: skos:altLabel
        multivalued: true
        required: false
        description: Alternative names, abbreviations, or named system exemplars that resolve to this
          concept.
      scope:
        range: ConceptScopeEnum
        required: false
        description: Declared scope boundary or scope note.
      references:
        range: FieldSource
        multivalued: true
        required: false
        description: Identifiers of external reading sources warranting this record.
  ControlledRelation:
    class_uri: owl:ObjectProperty
    description: Controlled verb in the relationship vocabulary with explicit forward and inverse readings.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[a-z0-9-]+$
        description: Permanent machine-readable identifier for this record.
      forward:
        slot_uri: skos:prefLabel
        required: true
        description: Active verb phrase read from source concept to target concept.
      inverse:
        required: true
        description: Passive verb phrase read from target concept back to source concept.
      kind:
        range: RelationKindEnum
        required: true
        description: Category of source or semantic category of relationship.
      meaning:
        slot_uri: skos:definition
        required: true
        description: Formal definition of what the controlled relationship verb asserts.
  RetiredConcept:
    description: Permanent redirect record for a retired concept identity pointing to its active replacement.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^mlsys\.[a-z0-9-]+$
        description: Permanent machine-readable identifier for this record.
      replaced_by:
        range: Concept
        required: true
        description: Active concept identifier that supersedes the retired identity.
      version:
        range: FrameworkVersionEnum
        required: true
        description: Taxonomy version in which this record or retirement took effect.
      reason:
        required: true
        description: Editorial explanation for a retirement, scope gap, or tagging disagreement.
  Relationship:
    class_uri: owl:Axiom
    description: Directed, condition-qualified technical proposition linking two field concepts.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      source:
        range: Concept
        required: true
        description: Subject concept identifier at the tail of the directed relationship.
      target:
        range: Concept
        required: true
        description: Object concept identifier at the head of the directed relationship.
      relation:
        range: ControlledRelation
        required: false
        description: Controlled relation identifier from the 17-verb vocabulary.
      kind:
        range: RelationKindEnum
        required: true
        description: Category of source or semantic category of relationship.
      predicate:
        required: true
        description: Specific verb phrase refining the controlled relation for this edge.
      conditions:
        required: true
        description: Explicit regime, workload, or assumption under which the proposition holds.
      references:
        range: FieldSource
        multivalued: true
        required: true
        description: Identifiers of external reading sources warranting this record.
      basis:
        range: RelationshipBasisEnum
        required: true
        description: Epistemic basis of the relationship assertion.
      status:
        range: DraftStatusEnum
        required: true
        description: Editorial review lifecycle status of the record.
      reference_role:
        required: false
        description: Role played by the cited reading sources for this relationship.
  FieldView:
    description: Named subset of field concepts for overview or thematic diagram generation.
    attributes:
      id:
        identifier: true
        required: true
        description: Permanent machine-readable identifier for this record.
      title:
        required: true
        description: Human-readable title of the document or source.
      concepts:
        range: Concept
        multivalued: true
        required: true
        description: Technical concepts belonging to this model, subject, or view.
  FrameworkModel:
    class_uri: skos:ConceptScheme
    description: Root document for taxonomy/ml-systems-framework.yml organizing field concepts into groups,
      areas, and subjects with multi-dimensional facets and scope notes.
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
        description: Integer schema version of the document (must equal 1).
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      title:
        slot_uri: dcterms:title
        required: true
        description: Human-readable title of the document or source.
      version:
        range: FrameworkVersionEnum
        slot_uri: owl:versionInfo
        required: true
        description: Taxonomy version in which this record or retirement took effect.
      status:
        range: ModelStatusEnum
        required: true
        description: Editorial review lifecycle status of the record.
      scope:
        slot_uri: skos:scopeNote
        required: true
        description: Declared scope boundary or scope note.
      rationale:
        multivalued: true
        required: false
        description: Editorial placement principles or justification for a hierarchy/ledger assertion.
      row_rule:
        required: false
        description: Editorial rule defining what qualifies as a subject row.
      secondary_policy:
        required: false
        description: Policy governing secondary concept links across subject rows.
      relationship_semantics:
        required: false
        description: Explanation of how subject membership differs from SKOS broader/narrower.
      context_policy:
        required: false
        description: Policy governing context lenses vs dedicated system-type areas.
      book_mapping_policy:
        required: false
        description: Policy governing chapter pointers and section-level passage links.
      warrant_policy:
        required: false
        description: Policy governing how external sources warrant subject boundaries.
      competency_policy:
        required: false
        description: Policy separating subject knowledge from observable task competency.
      tagging_rules:
        multivalued: true
        required: false
        description: Operational rules for tagging questions, chapters, slides, and labs.
      placement_examples:
        range: PlacementExample
        multivalued: true
        inlined_as_list: true
        required: false
        description: Worked examples illustrating the home rule on boundary concepts.
      sources:
        range: FrameworkSource
        multivalued: true
        inlined_as_list: true
        required: true
        description: External curricula, standards, documentation, or research sources.
      dimensions:
        range: DimensionSet
        inlined: true
        required: true
        description: Cross-cutting facet vocabularies (activities, layers, concerns, contexts).
      groups:
        range: SubjectGroup
        multivalued: true
        inlined_as_list: true
        required: false
        description: Top-level structural bands of the taxonomy.
      areas:
        range: SubjectArea
        multivalued: true
        inlined_as_list: true
        required: true
        description: Subject areas organized under the top-level groups.
      gaps:
        range: ScopeGap
        multivalued: true
        inlined_as_list: true
        required: false
        description: Declared candidate scope gaps tracked for future taxonomy versions.
  FrameworkSource:
    class_uri: dct:BibliographicResource
    description: External body of knowledge, curriculum, or benchmark warranting subject boundaries.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      title:
        slot_uri: dcterms:title
        required: true
        description: Human-readable title of the document or source.
      url:
        slot_uri: dcterms:source
        required: true
        pattern: ^https://[^\s<>"{}|\\^`]+$
        description: Canonical HTTPS URL for the external reference source.
      role:
        required: true
        description: Role played by an external source or a chapter concept declaration.
  DimensionSet:
    description: Cross-cutting facet vocabularies for classifying subject rows.
    attributes:
      activities:
        range: DimensionFacet
        multivalued: true
        inlined_as_list: true
        required: true
        description: Engineering lifecycle activities involved in this subject.
      layers:
        range: DimensionFacet
        multivalued: true
        inlined_as_list: true
        required: true
        description: System stack layers involved in this subject.
      concerns:
        range: DimensionFacet
        multivalued: true
        inlined_as_list: true
        required: true
        description: Cross-cutting system qualities and concerns addressed by this subject.
      contexts:
        range: DimensionFacet
        multivalued: true
        inlined_as_list: true
        required: false
        description: Deployment or workload context lenses applicable to this subject.
  DimensionFacet:
    description: A single facet term within an activity, layer, concern, or context dimension.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      label:
        slot_uri: skos:prefLabel
        required: true
        description: Canonical human-readable term or heading in sentence case.
  SubjectGroup:
    class_uri: skos:Collection
    description: Top-level structural band of the ML Systems Taxonomy (e.g., Foundations, Stack, Lifecycle,
      Qualities, System types).
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      code:
        slot_uri: skos:notation
        required: false
        pattern: ^[A-Z]$
        description: Short hierarchical human-readable code (e.g., P, P4, P4.5).
      label:
        slot_uri: skos:prefLabel
        required: true
        description: Canonical human-readable term or heading in sentence case.
      question:
        required: true
        description: Core engineering question answered by this group, area, or family.
  SubjectArea:
    class_uri: skos:Collection
    description: One of the 20 subject areas grouping cohesive engineering subjects under a group band.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      code:
        slot_uri: skos:notation
        required: false
        pattern: ^[A-Z]\d+$
        description: Short hierarchical human-readable code (e.g., P, P4, P4.5).
      group:
        range: SubjectGroup
        required: false
        description: Identifier of the parent top-level subject group.
      label:
        slot_uri: skos:prefLabel
        required: true
        description: Canonical human-readable term or heading in sentence case.
      display_label:
        required: false
        description: Compact label used in tight matrix cells and navigation sidebars.
      question:
        required: true
        description: Core engineering question answered by this group, area, or family.
      scope:
        slot_uri: skos:scopeNote
        required: true
        description: Declared scope boundary or scope note.
      status:
        range: DraftStatusEnum
        required: false
        description: Editorial review lifecycle status of the record.
      includes:
        multivalued: true
        required: false
        description: Topics explicitly included within this area or subject boundary.
      excludes:
        multivalued: true
        required: false
        description: Neighboring topics explicitly excluded and cross-referenced via [[id]].
      warrants:
        range: FrameworkSource
        multivalued: true
        required: false
        description: External source identifiers warranting this area or subject boundary.
      warrant_role:
        required: false
        description: Epistemic role of the cited design warrants.
      inventory_status:
        required: false
        description: Population status of the subject row concept inventory.
      rows:
        range: SubjectRow
        multivalued: true
        inlined_as_list: true
        required: true
        description: Citeable subject rows belonging to this subject area.
  SubjectRow:
    class_uri: skos:Collection
    description: A citeable subject row owning the primary home for a set of technical concepts.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      code:
        slot_uri: skos:notation
        required: false
        pattern: ^[A-Z]\d+\.\d+$
        description: Short hierarchical human-readable code (e.g., P, P4, P4.5).
      label:
        slot_uri: skos:prefLabel
        required: true
        description: Canonical human-readable term or heading in sentence case.
      display_label:
        required: false
        description: Compact label used in tight matrix cells and navigation sidebars.
      definition:
        slot_uri: skos:definition
        required: true
        description: Single-sentence technical definition stating what the item is and what it changes.
      status:
        range: DraftStatusEnum
        required: false
        description: Editorial review lifecycle status of the record.
      includes:
        multivalued: true
        required: false
        description: Topics explicitly included within this area or subject boundary.
      excludes:
        multivalued: true
        required: false
        description: Neighboring topics explicitly excluded and cross-referenced via [[id]].
      warrants:
        range: FrameworkSource
        multivalued: true
        required: false
        description: External source identifiers warranting this area or subject boundary.
      warrant_role:
        required: false
        description: Epistemic role of the cited design warrants.
      inventory_status:
        required: false
        description: Population status of the subject row concept inventory.
      concepts:
        multivalued: true
        required: true
        description: Technical concepts belonging to this model, subject, or view.
      secondary_concepts:
        multivalued: true
        required: false
        description: Concepts homed elsewhere that have strong secondary relevance here.
      book_chapters:
        multivalued: true
        required: false
        pattern: ^v(?:ol)?[1-4]/\d{2}$
        description: MLSysBook volume/chapter codes (vN/NN) teaching this subject.
      activities:
        multivalued: true
        required: true
        description: Engineering lifecycle activities involved in this subject.
      layers:
        multivalued: true
        required: true
        description: System stack layers involved in this subject.
      concerns:
        multivalued: true
        required: true
        description: Cross-cutting system qualities and concerns addressed by this subject.
      contexts:
        multivalued: true
        required: false
        description: Deployment or workload context lenses applicable to this subject.
  ScopeGap:
    description: Declared candidate topic boundary or gap tracked for future taxonomy versions.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      topic:
        required: false
        description: Name of the external benchmark topic or candidate gap topic.
      label:
        required: false
        description: Canonical human-readable term or heading in sentence case.
      subject_row:
        required: false
        description: Identifier of the subject row where a candidate gap would live.
      reason:
        required: true
        description: Editorial explanation for a retirement, scope gap, or tagging disagreement.
      status:
        range: GapStatusEnum
        required: true
        description: Editorial review lifecycle status of the record.
  PlacementExample:
    description: Worked example explaining why a concept lives in its primary subject home.
    attributes:
      concept:
        required: true
        pattern: ^mlsys\.[a-z0-9-]+$
        description: Identifier of the field concept.
      home:
        required: true
        description: Identifier of the primary home subject row.
      why:
        required: true
        description: One-sentence explanation of why this placement or step order holds.
  GuidesModel:
    description: Root document for taxonomy/ml-systems-guides.yml defining role profiles, production symptom
      triage guides, and sequential learning paths.
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
        description: Integer schema version of the document (must equal 1).
      roles_note:
        required: false
        description: Methodological note explaining how role profiles should be read.
      roles:
        range: RoleProfile
        multivalued: true
        inlined_as_list: true
        required: true
        description: Practitioner role profiles mapping core and working subjects.
      symptoms_note:
        required: false
        description: Methodological note explaining how production symptom guides work.
      symptoms:
        range: ProductionSymptom
        multivalued: true
        inlined_as_list: true
        required: true
        description: Production failure symptoms mapped to causes, checks, and levers.
      paths_note:
        required: false
        description: Methodological note explaining how learning paths work.
      learning_paths:
        range: LearningPath
        multivalued: true
        inlined_as_list: true
        required: true
        description: Policy note or ordered list of guided learning paths.
  RoleProfile:
    description: Practitioner role profile mapping core and working-knowledge subjects.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
