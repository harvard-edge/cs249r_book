id: https://mlsysbook.ai/taxonomy/schema
name: mlsys_taxonomy
title: ML Systems Taxonomy Metamodel (LinkML)
description: >-
  Formal LinkML metamodel for the Machine Learning Systems Taxonomy, covering the
  field concept graph (ml-systems-field.yml), the subject classification framework
  (ml-systems-framework.yml), practitioner guides (ml-systems-guides.yml),
  textbook passage alignment (mlsysbook-alignment.yml), the SKOS hierarchy pilot
  (ml-systems-taxonomy.yml), external coverage checklists (taxonomy/coverage/*.yml),
  and the chapter coverage ledger (coverage-ledger.yml).
version: 0.3-draft
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mlsys: https://mlsysbook.ai/taxonomy/
  skos: http://www.w3.org/2004/02/skos/core#
  dct: http://purl.org/dc/terms/
  owl: http://www.w3.org/2002/07/owl#

default_prefix: mlsys
default_range: string

imports:
  - linkml:types

enums:
  ModelStatusEnum:
    description: Lifecycle status of a top-level taxonomy model document.
    permissible_values:
      editorial-draft:
        description: Scoped editorial draft for community and expert review.

  DraftStatusEnum:
    description: Review status of individual concept, relationship, subject, or alignment assertions.
    permissible_values:
      draft:
        description: Authored draft assertion awaiting formal version-bound review provenance.

  GapStatusEnum:
    description: Status of a declared candidate scope gap in the framework.
    permissible_values:
      candidate:
        description: Candidate scope gap declared for investigation, not a verified absence claim.

  FrameworkVersionEnum:
    description: Supported versions of the ML Systems Taxonomy framework.
    permissible_values:
      0.1-draft:
        description: Initial area and subject row inventory.
      0.2-draft:
        description: Added top-level groups and readable hierarchical codes.
      0.3-draft:
        description: Connected concept graph with controlled relation vocabulary and practitioner guides.

  ConceptScopeEnum:
    description: Scope boundary of a concept or concept family within ML systems engineering.
    permissible_values:
      core:
        description: Core ML systems engineering concept applicable across system regimes.
      background:
        description: Foundational ML, mathematics, or computer systems concept used as background.
      model-extension:
        description: Concept specific to particular model families or architectures.
      generative-extension:
        description: Concept specific to generative models, LLMs, or diffusion pipelines.
      agent-extension:
        description: Concept specific to tool-using, planning, or multi-agent ML systems.
      physical-extension:
        description: Concept specific to embodied, robotic, or cyber-physical ML systems.
      specialist:
        description: Domain-specialist or regulatory/hardware niche concept.

  SourceKindEnum:
    description: Kind of external design reference or reading source.
    permissible_values:
      curriculum:
        description: University course syllabus or curriculum.
      documentation:
        description: Official framework, library, or platform documentation.
      engineering-guide:
        description: Practitioner engineering guide or operational handbook.
      research:
        description: Peer-reviewed research paper or technical report.
      paper:
        description: Conference or journal publication.
      standard:
        description: Formal industry, safety, or international standard.
      taxonomy:
        description: Established classification scheme or body of knowledge.
      textbook:
        description: Published textbook or monograph.

  RelationKindEnum:
    description: High-level semantic category of a controlled relationship verb.
    permissible_values:
      mechanism:
        description: How a technique operates, produces an artifact, or realizes an abstraction.
      constraint:
        description: Directional effect on a cost, bound, capacity, or system quantity.
      tradeoff:
        description: Symmetric tension or competing design alternative.
      evaluation:
        description: Measurement or detection of a system property or failure mode.
      dependency:
        description: Strict requirement or common building-block reliance.
      failure:
        description: Causal production or mitigation of a fault, hazard, or degradation.
      composition:
        description: Taxonomic specialization or structural part-whole membership.

  RelationshipBasisEnum:
    description: Epistemic basis for a relationship assertion between two concepts.
    permissible_values:
      editorial-synthesis:
        description: Authored synthesis grounded in cited reading sources under stated conditions.

  AlignmentDepthEnum:
    description: Teaching depth assessment status for a textbook passage link.
    permissible_values:
      not-assessed:
        description: Passage link identifies a related section without certifying coverage depth.

  AlignmentRelationEnum:
    description: Semantic relationship between a field concept and a textbook learner-graph node.
    permissible_values:
      related-passage:
        description: The textbook section discusses or illustrates the field concept.

  ChecklistStatusEnum:
    description: Coverage judgment for an external benchmark topic against the taxonomy.
    permissible_values:
      covered:
        description: Directly represented by one or more field concepts.
      partial:
        description: Placed under an existing subject row, with specific sub-mechanism not yet promoted to a distinct concept.
      missing:
        description: In scope for ML systems engineering but not yet represented.
      out-of-scope:
        description: Outside the declared scope boundary of the ML Systems Taxonomy.

  LedgerDispositionEnum:
    description: Reconciliation disposition of a chapter primary concept declaration against field concepts.
    permissible_values:
      mapped-to:
        description: Directly corresponds to one or more field concepts.
      broader-than:
        description: Chapter declaration spans multiple narrower component field concepts.
      narrower-than:
        description: Chapter declaration is a specific instance of a broader field concept.
      candidate-new:
        description: Candidate for promotion to a new field concept.
      out-of-scope:
        description: Chapter-local pedagogical construct outside field taxonomy scope.

classes:
  FieldModel:
    class_uri: skos:ConceptScheme
    description: >-
      Root document for taxonomy/ml-systems-field.yml defining the field concept
      inventory, controlled relation vocabulary, propositional edges, and views.
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      title:
        slot_uri: dct:title
        required: true
      scope:
        slot_uri: skos:scopeNote
        required: true
      status:
        range: ModelStatusEnum
        required: true
      background_boundary:
        required: false
      limitations:
        multivalued: true
        required: false
      learning_paths:
        required: false
      sources:
        range: FieldSource
        multivalued: true
        inlined_as_list: true
        required: true
      families:
        range: ConceptFamily
        multivalued: true
        inlined_as_list: true
        required: true
      concepts:
        range: Concept
        multivalued: true
        inlined_as_list: true
        required: true
      relations:
        range: ControlledRelation
        multivalued: true
        inlined_as_list: true
        required: false
      retired:
        range: RetiredConcept
        multivalued: true
        inlined_as_list: true
        required: false
      relationships:
        range: Relationship
        multivalued: true
        inlined_as_list: true
        required: true
      views:
        range: FieldView
        multivalued: true
        inlined_as_list: true
        required: true

  FieldSource:
    class_uri: dct:BibliographicResource
    description: External curriculum, standard, documentation, or research source warranting field concepts.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      title:
        slot_uri: dct:title
        required: true
      url:
        slot_uri: dct:source
        required: true
        pattern: "^https://[^\\s<>\"{}|\\\\^`]+$"
      kind:
        range: SourceKindEnum
        required: true
      scope:
        required: true

  ConceptFamily:
    class_uri: skos:Collection
    description: Coarse navigation grouping of field concepts sharing a core engineering question.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[a-z0-9-]+$"
      label:
        slot_uri: skos:prefLabel
        required: true
      scope:
        range: ConceptScopeEnum
        required: true
      question:
        required: true
      references:
        range: FieldSource
        multivalued: true
        required: true

  Concept:
    class_uri: skos:Concept
    description: A permanent, chapter-independent technical concept in machine learning systems.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^mlsys\\.[a-z0-9-]+$"
      label:
        slot_uri: skos:prefLabel
        required: true
      definition:
        slot_uri: skos:definition
        required: true
      family:
        range: ConceptFamily
        required: true
      status:
        range: DraftStatusEnum
        required: true
      aliases:
        slot_uri: skos:altLabel
        multivalued: true
        required: false
      scope:
        range: ConceptScopeEnum
        required: false
      references:
        range: FieldSource
        multivalued: true
        required: false

  ControlledRelation:
    class_uri: owl:ObjectProperty
    description: Controlled verb in the relationship vocabulary with explicit forward and inverse readings.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[a-z0-9-]+$"
      forward:
        slot_uri: skos:prefLabel
        required: true
      inverse:
        required: true
      kind:
        range: RelationKindEnum
        required: true
      meaning:
        slot_uri: skos:definition
        required: true

  RetiredConcept:
    description: Permanent redirect record for a retired concept identity pointing to its active replacement.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^mlsys\\.[a-z0-9-]+$"
      replaced_by:
        range: Concept
        required: true
      version:
        range: FrameworkVersionEnum
        required: true
      reason:
        required: true

  Relationship:
    class_uri: owl:Axiom
    description: Directed, condition-qualified technical proposition linking two field concepts.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      source:
        range: Concept
        required: true
      target:
        range: Concept
        required: true
      relation:
        range: ControlledRelation
        required: false
      kind:
        range: RelationKindEnum
        required: true
      predicate:
        required: true
      conditions:
        required: true
      references:
        range: FieldSource
        multivalued: true
        required: true
      basis:
        range: RelationshipBasisEnum
        required: true
      status:
        range: DraftStatusEnum
        required: true
      reference_role:
        required: false

  FieldView:
    description: Named subset of field concepts for overview or thematic diagram generation.
    attributes:
      id:
        identifier: true
        required: true
      title:
        required: true
      concepts:
        range: Concept
        multivalued: true
        required: true

  FrameworkModel:
    class_uri: skos:ConceptScheme
    description: >-
      Root document for taxonomy/ml-systems-framework.yml organizing field concepts
      into groups, areas, and subjects with multi-dimensional facets and scope notes.
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      title:
        slot_uri: dct:title
        required: true
      version:
        range: FrameworkVersionEnum
        slot_uri: owl:versionInfo
        required: true
      status:
        range: ModelStatusEnum
        required: true
      scope:
        slot_uri: skos:scopeNote
        required: true
      rationale:
        multivalued: true
        required: false
      row_rule:
        required: false
      secondary_policy:
        required: false
      relationship_semantics:
        required: false
      context_policy:
        required: false
      book_mapping_policy:
        required: false
      warrant_policy:
        required: false
      competency_policy:
        required: false
      tagging_rules:
        multivalued: true
        required: false
      placement_examples:
        range: PlacementExample
        multivalued: true
        inlined_as_list: true
        required: false
      sources:
        range: FrameworkSource
        multivalued: true
        inlined_as_list: true
        required: true
      dimensions:
        range: DimensionSet
        inlined: true
        required: true
      groups:
        range: SubjectGroup
        multivalued: true
        inlined_as_list: true
        required: false
      areas:
        range: SubjectArea
        multivalued: true
        inlined_as_list: true
        required: true
      gaps:
        range: ScopeGap
        multivalued: true
        inlined_as_list: true
        required: false

  FrameworkSource:
    class_uri: dct:BibliographicResource
    description: External body of knowledge, curriculum, or benchmark warranting subject boundaries.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      title:
        slot_uri: dct:title
        required: true
      url:
        slot_uri: dct:source
        required: true
        pattern: "^https://[^\\s<>\"{}|\\\\^`]+$"
      role:
        required: true

  DimensionSet:
    description: Cross-cutting facet vocabularies for classifying subject rows.
    attributes:
      activities:
        range: DimensionFacet
        multivalued: true
        inlined_as_list: true
        required: true
      layers:
        range: DimensionFacet
        multivalued: true
        inlined_as_list: true
        required: true
      concerns:
        range: DimensionFacet
        multivalued: true
        inlined_as_list: true
        required: true
      contexts:
        range: DimensionFacet
        multivalued: true
        inlined_as_list: true
        required: false

  DimensionFacet:
    description: A single facet term within an activity, layer, concern, or context dimension.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      label:
        slot_uri: skos:prefLabel
        required: true

  SubjectGroup:
    class_uri: skos:Collection
    description: Top-level structural band of the ML Systems Taxonomy (e.g., Foundations, Stack, Lifecycle, Qualities, System types).
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      code:
        slot_uri: skos:notation
        required: false
        pattern: "^[A-Z]$"
      label:
        slot_uri: skos:prefLabel
        required: true
      question:
        required: true

  SubjectArea:
    class_uri: skos:Collection
    description: One of the 20 subject areas grouping cohesive engineering subjects under a group band.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      code:
        slot_uri: skos:notation
        required: false
        pattern: "^[A-Z]\\d+$"
      group:
        range: SubjectGroup
        required: false
      label:
        slot_uri: skos:prefLabel
        required: true
      display_label:
        required: false
      question:
        required: true
      scope:
        slot_uri: skos:scopeNote
        required: true
      status:
        range: DraftStatusEnum
        required: false
      includes:
        multivalued: true
        required: false
      excludes:
        multivalued: true
        required: false
      warrants:
        range: FrameworkSource
        multivalued: true
        required: false
      warrant_role:
        required: false
      inventory_status:
        required: false
      rows:
        range: SubjectRow
        multivalued: true
        inlined_as_list: true
        required: true

  SubjectRow:
    class_uri: skos:Collection
    description: A citeable subject row owning the primary home for a set of technical concepts.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      code:
        slot_uri: skos:notation
        required: false
        pattern: "^[A-Z]\\d+\\.\\d+$"
      label:
        slot_uri: skos:prefLabel
        required: true
      display_label:
        required: false
      definition:
        slot_uri: skos:definition
        required: true
      status:
        range: DraftStatusEnum
        required: false
      includes:
        multivalued: true
        required: false
      excludes:
        multivalued: true
        required: false
      warrants:
        range: FrameworkSource
        multivalued: true
        required: false
      warrant_role:
        required: false
      inventory_status:
        required: false
      concepts:
        multivalued: true
        required: true
      secondary_concepts:
        multivalued: true
        required: false
      book_chapters:
        multivalued: true
        required: false
        pattern: "^v(?:ol)?[1-4]/\\d{2}$"
      activities:
        multivalued: true
        required: true
      layers:
        multivalued: true
        required: true
      concerns:
        multivalued: true
        required: true
      contexts:
        multivalued: true
        required: false

  ScopeGap:
    description: Declared candidate topic boundary or gap tracked for future taxonomy versions.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      topic:
        required: false
      label:
        required: false
      subject_row:
        required: false
      reason:
        required: true
      status:
        range: GapStatusEnum
        required: true

  PlacementExample:
    description: Worked example explaining why a concept lives in its primary subject home.
    attributes:
      concept:
        required: true
        pattern: "^mlsys\\.[a-z0-9-]+$"
      home:
        required: true
      why:
        required: true

  GuidesModel:
    description: >-
      Root document for taxonomy/ml-systems-guides.yml defining role profiles,
      production symptom triage guides, and sequential learning paths.
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
      roles_note:
        required: false
      roles:
        range: RoleProfile
        multivalued: true
        inlined_as_list: true
        required: true
      symptoms_note:
        required: false
      symptoms:
        range: ProductionSymptom
        multivalued: true
        inlined_as_list: true
        required: true
      paths_note:
        required: false
      learning_paths:
        range: LearningPath
        multivalued: true
        inlined_as_list: true
        required: true

  RoleProfile:
    description: Practitioner role profile mapping core and working-knowledge subjects.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      label:
        slot_uri: skos:prefLabel
        required: true
      summary:
        slot_uri: skos:definition
        required: true
      core:
        multivalued: true
        required: true
      working:
        multivalued: true
        required: false

  ProductionSymptom:
    description: Production failure symptom mapped to graph-connected root causes, diagnostic checks, and mitigation levers.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      label:
        slot_uri: skos:prefLabel
        required: true
      signal:
        slot_uri: skos:definition
        required: true
      causes:
        multivalued: true
        required: true
      checks:
        multivalued: true
        required: false
      levers:
        multivalued: true
        required: true

  LearningPath:
    description: Ordered sequence of subjects forming a study path for a target audience.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      label:
        slot_uri: skos:prefLabel
        required: true
      audience:
        required: true
      steps:
        range: LearningPathStep
        multivalued: true
        inlined_as_list: true
        required: true

  LearningPathStep:
    description: Single step in a learning path pointing to a subject row and explaining why it comes at this stage.
    attributes:
      subject:
        required: true
      why:
        required: true

  BookAlignmentModel:
    description: Root document for taxonomy/mlsysbook-alignment.yml recording candidate section links between field concepts and MLSysBook chapters.
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
      status:
        range: DraftStatusEnum
        required: false
      meaning:
        required: false
      links:
        range: BookAlignmentLink
        multivalued: true
        inlined_as_list: true
        required: true

  BookAlignmentLink:
    description: Candidate passage link from a field concept to a section-backed book concept node.
    attributes:
      concept:
        required: true
        pattern: "^mlsys\\.[a-z0-9-]+$"
      book_concept:
        required: true
      status:
        range: DraftStatusEnum
        required: true
      depth:
        range: AlignmentDepthEnum
        required: true
      relation:
        range: AlignmentRelationEnum
        required: false

  TaxonomyHierarchyModel:
    class_uri: skos:ConceptScheme
    description: Root document for taxonomy/ml-systems-taxonomy.yml (polyhierarchical SKOS broader/narrower pilot).
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
      id:
        identifier: true
        required: true
      title:
        slot_uri: dct:title
        required: true
      scope:
        slot_uri: skos:scopeNote
        required: true
      status:
        range: ModelStatusEnum
        required: true
      sources:
        range: FrameworkSource
        multivalued: true
        inlined_as_list: true
        required: true
      topics:
        range: TaxonomyTopic
        multivalued: true
        inlined_as_list: true
        required: true
      top_concepts:
        multivalued: true
        required: true
      hierarchy:
        range: HierarchyAssertion
        multivalued: true
        inlined_as_list: true
        required: true
      collections:
        range: TaxonomyCollection
        multivalued: true
        inlined_as_list: true
        required: true

  TaxonomyTopic:
    class_uri: skos:Concept
    description: Umbrella topic node in the SKOS broader/narrower hierarchy pilot.
    attributes:
      id:
        identifier: true
        required: true
      label:
        slot_uri: skos:prefLabel
        required: true
      definition:
        slot_uri: skos:definition
        required: true
      status:
        range: DraftStatusEnum
        required: true

  HierarchyAssertion:
    description: Asserted SKOS broader/narrower relationship with explicit editorial rationale.
    attributes:
      narrower:
        required: true
      broader:
        required: true
      rationale:
        required: true
      status:
        range: DraftStatusEnum
        required: true

  TaxonomyCollection:
    class_uri: skos:Collection
    description: Navigation collection derived from a field concept family.
    attributes:
      id:
        identifier: true
        required: true
      label:
        slot_uri: skos:prefLabel
        required: true
      scope_note:
        slot_uri: skos:scopeNote
        required: true
      family:
        required: true

  CoverageChecklistModel:
    description: Root document for external coverage benchmark checklists (taxonomy/coverage/*.yml).
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
      id:
        identifier: true
        required: true
      title:
        required: true
      basis:
        required: true
      held_out:
        range: boolean
        required: true
      topics:
        range: CoverageChecklistTopic
        multivalued: true
        inlined_as_list: true
        required: true

  CoverageChecklistTopic:
    description: Single benchmark topic evaluated against the taxonomy.
    attributes:
      topic:
        required: true
      sources:
        multivalued: true
        required: true
      status:
        range: ChecklistStatusEnum
        required: true
      concepts:
        multivalued: true
        required: false
      subject:
        required: false
      note:
        required: false

  CoverageLedgerModel:
    description: Root document for taxonomy/coverage-ledger.yml reconciling chapter primary declarations against field concepts.
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
      decisions:
        range: CoverageLedgerDecision
        multivalued: true
        inlined_as_list: true
        required: true

  CoverageLedgerDecision:
    description: Audited reconciliation decision for a chapter primary concept declaration.
    attributes:
      chapter:
        required: true
      label:
        required: true
      role:
        required: true
      disposition:
        range: LedgerDispositionEnum
        required: true
      field_concepts:
        multivalued: true
        required: false
      rationale:
        required: true
      evidence:
        range: LedgerEvidenceQuote
        multivalued: true
        inlined_as_list: true
        required: true
      inventory_id:
        required: true
      reviewer:
        required: true
      reviewer_kind:
        required: true
      reviewed_on:
        required: true
      source_hash:
        required: true
      field_hash:
        required: false

  LedgerEvidenceQuote:
    description: Verbatim section quote from a chapter supporting a coverage ledger decision.
    attributes:
      section:
        required: true
      quote:
        required: true
