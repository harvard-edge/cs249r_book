        slot_uri: skos:prefLabel
        required: true
        description: Human-readable area title.
      question:
        required: true
        description: Core engineering question answered by this area.
      scope:
        slot_uri: skos:scopeNote
        required: true
        description: Scope boundary of this subject area.
      subjects:
        range: ReleaseSubject
        multivalued: true
        inlined_as_list: true
        required: true
        description: Citeable subjects belonging to this area.
  ReleaseSubject:
    class_uri: skos:Collection
    description: Subject entry in the compiled taxonomy JSON release outline.
    attributes:
      code:
        slot_uri: skos:notation
        required: true
        pattern: ^[A-Z]\d+\.\d+$
        description: Hierarchical subject code (e.g., P4.3).
      id:
        identifier: true
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        description: Permanent machine-readable subject identifier.
      label:
        slot_uri: skos:prefLabel
        required: true
        description: Human-readable subject title.
      definition:
        slot_uri: skos:definition
        required: true
        description: Single-sentence definition of the subject boundary.
      includes:
        multivalued: true
        required: true
        description: Topics explicitly included in this subject.
      excludes:
        multivalued: true
        required: true
        description: Neighboring topics excluded from this subject with [[row-id]] cross-references.
      contexts:
        multivalued: true
        required: true
        description: Applicable system context lenses for this subject.
      concepts:
        multivalued: true
        required: true
        pattern: ^mlsys\.[a-z0-9]+(-[a-z0-9]+)*$
        description: Primary concepts homed in this subject.
      related_concepts:
        multivalued: true
        required: true
        pattern: ^mlsys\.[a-z0-9]+(-[a-z0-9]+)*$
        description: Secondary concepts cross-linked to this subject.
      taught_in:
        range: ReleaseChapterPointer
        multivalued: true
        inlined_as_list: true
        required: true
        description: MLSysBook chapters that teach this subject at chapter grain.
  ReleaseChapterPointer:
    description: Resolved chapter pointer in the compiled taxonomy JSON release.
    attributes:
      volume:
        required: true
        pattern: ^vol[1-4]$
        description: Book volume identifier (vol1 to vol4).
      chapter:
        required: true
        description: Human-readable chapter title.
      url:
        required: true
        pattern: ^https://[^\s<>"{}|\\^`]+$
        description: Canonical URL to the chapter or section on mlsysbook.ai.
  ReleaseConcept:
    class_uri: skos:Concept
    description: Concept record in the compiled taxonomy JSON release.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^mlsys\.[a-z0-9]+(-[a-z0-9]+)*$
        description: Permanent machine-readable concept identifier.
      label:
        slot_uri: skos:prefLabel
        required: true
        description: Canonical human-readable concept term.
      aliases:
        slot_uri: skos:altLabel
        multivalued: true
        required: true
        description: Alternative entry terms (synonyms, quasi-synonyms, acronyms, or documented upward-posted narrower terms).
      definition:
        slot_uri: skos:definition
        required: true
        description: Single-sentence technical definition.
      background:
        range: boolean
        required: true
        description: True when the concept originated outside ML systems (scope=background).
      home:
        required: true
        pattern: ^[A-Z]\d+\.\d+$
        description: Readable code of the concept's home subject.
      home_id:
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        description: Permanent identifier of the concept's home subject.
      added_in:
        required: false
        pattern: ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[a-z0-9]+)?$
        description: Release that first admitted this concept, the date-of-entry part of a Z39.19 history note (section
          6.2.3).
      warrant:
        range: ReleaseWarrant
        inlined: true
        required: true
        description: Computed Z39.19 section 5.3.5 warrant counts for this concept.
      book_passages:
        range: ReleaseChapterPointer
        multivalued: true
        inlined_as_list: true
        required: true
        description: Candidate section-level book passages discussing this concept.
  ReleaseWarrant:
    description: Warrant counts computed from recorded evidence at build time; never authored by hand.
    attributes:
      literary:
        range: integer
        required: true
        description: Covered topics citing this concept in non-book checklists (papers, courses, standards).
      corpus_chapters:
        range: integer
        required: true
        description: Book chapters whose text contains the concept's label or an alias.
      organizational:
        range: integer
        required: true
        description: Covered MLSysBook chapter topics citing this concept plus section-level book links.
      user_proxy:
        range: integer
        required: true
        description: StaffML questions tagged with this concept; term-assignment frequency, a proxy, not user search data.
  ReleaseGap:
    description: Declared scope gap entry in the compiled taxonomy JSON release.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent identifier of the declared gap.
      topic:
        required: true
        description: Name of the candidate topic left open.
      subject:
        required: true
        pattern: ^[A-Z]\d+\.\d+$
        description: Readable code of the subject row where the gap resides.
      status:
        range: GapStatusEnum
        required: true
        description: Status of the declared gap (candidate).
      reason:
        required: true
        description: Reason the topic remains a declared gap in this version.
  ReleaseRelationship:
    class_uri: owl:Axiom
    description: Relationship entry in the compiled taxonomy JSON release.
    attributes:
      source:
        required: true
        pattern: ^mlsys\.[a-z0-9]+(-[a-z0-9]+)*$
        description: Source concept identifier.
      relation:
        range: RelationIdEnum
        required: true
        description: Controlled relation verb from the 17-relation vocabulary.
      target:
        required: true
        pattern: ^mlsys\.[a-z0-9]+(-[a-z0-9]+)*$
        description: Target concept identifier.
      statement:
        required: true
        description: Specific forward predicate phrase refining the relation.
      conditions:
        required: true
        description: Explicit condition under which the relationship holds.
  StaffMLLabelsDocument:
    description: Compact StaffML consumer labels projection (staffml/app/src/data/mlsys-taxonomy.json)
      generated from the compiled framework and field models.
    attributes:
      version:
        range: FrameworkVersionEnum
        required: true
        description: Published version string of the taxonomy release.
      explorer:
        required: true
        pattern: ^https://[^\s<>"{}|\\^`]+$
        description: Canonical landing URL for the taxonomy explorer.
      areas:
        range: StaffMLLabelArea
        multivalued: true
        inlined_as_list: true
        required: true
        description: Ordered taxonomy areas with display codes, group metadata, and subject IDs.
      subjects:
        range: AnyValue
        required: true
        annotations:
          dict_key_pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          dict_value_ref: StaffMLLabelSubject
        description: Mapping from subject row identifier to StaffMLLabelSubject metadata.
      concepts:
        range: AnyValue
        required: true
        annotations:
          dict_key_pattern: ^mlsys\.[a-z0-9]+(-[a-z0-9]+)*$
          dict_value_ref: StaffMLLabelConcept
        description: Mapping from concept identifier (mlsys.*) to StaffMLLabelConcept metadata.
  StaffMLLabelArea:
    description: Area entry in the compact StaffML taxonomy labels projection.
    attributes:
      id:
        required: true
        pattern: ^[A-Z]\d+$
        description: Hierarchical area code (e.g., F1, P4).
      slug:
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        description: Permanent machine-readable area slug identifier.
      label:
        required: true
        description: Full human-readable area title.
      short:
        required: true
        description: Short display label for UI cards and sidebar navigation.
      group:
        required: true
        description: Human-readable title of the parent group.
      group_id:
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        description: Permanent machine-readable parent group slug identifier.
      group_code:
        required: true
        pattern: ^[A-Z]$
        description: Single-letter code of the parent group.
      question:
        required: true
        description: Core engineering question answered by this area.
      subjects:
        multivalued: true
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        description: Ordered subject row identifiers belonging to this area.
  StaffMLLabelSubject:
    description: Subject metadata entry in the compact StaffML taxonomy labels projection.
    attributes:
      code:
        required: true
        pattern: ^[A-Z]\d+\.\d+$
        description: Hierarchical subject code (e.g., P4.3).
      label:
        required: true
        description: Full human-readable subject title.
      short:
        required: true
        description: Short display label for UI cards.
      area:
        required: true
        description: Full human-readable parent area title.
      area_id:
        required: true
        pattern: ^[A-Z]\d+$
        description: Hierarchical parent area code.
      area_slug:
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        description: Permanent machine-readable parent area slug identifier.
      definition:
        required: true
        description: Single-sentence definition of the subject boundary.
  StaffMLLabelConcept:
    description: Concept metadata entry in the compact StaffML taxonomy labels projection.
    attributes:
      label:
        required: true
        description: Canonical human-readable concept term.
      subject:
        required: true
        pattern: ^(|[a-z0-9]+(-[a-z0-9]+)*)$
        description: Home subject row identifier (empty string for background concepts).
  UnifiedTaxonomyModel:
    class_uri: skos:ConceptScheme
    description: Canonical single-source-of-truth document (taxonomy/ml-systems-taxonomy.yml) unifying
      the subject classification framework, field concept graph, practitioner guides, and SKOS hierarchy.
    attributes:
      schema_version:
        range: integer
        required: true
        equals_number: 1
        description: Integer schema version of the document (must equal 1).
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for the subject framework.
      status:
        range: ModelStatusEnum
        required: true
        description: Editorial lifecycle status of the taxonomy.
      version:
        range: FrameworkVersionEnum
        slot_uri: owl:versionInfo
        required: true
        description: Current taxonomy release version string.
      title:
        slot_uri: dcterms:title
        required: true
        description: Human-readable title of the taxonomy.
      scope:
        slot_uri: skos:scopeNote
        required: true
        description: Declared scope boundary of the subject classification framework.
      relationship_semantics:
        required: false
        description: Explanation of how subject membership differs from SKOS broader/narrower.
      row_rule:
        required: false
        description: Editorial rule defining what qualifies as a subject row.
      secondary_policy:
        required: false
        description: Policy governing secondary concept links across subject rows.
      warrant_policy:
        required: false
        description: Policy governing how external sources warrant subject boundaries.
      context_policy:
        required: false
        description: Policy governing context lenses vs dedicated system-type areas.
      book_mapping_policy:
        required: false
        description: Policy governing chapter pointers and section-level passage links.
      competency_policy:
        required: false
        description: Policy separating subject knowledge from observable task competency.
      rationale:
        multivalued: true
        required: false
        description: Editorial placement principles for concepts and subjects.
      tagging_rules:
        multivalued: true
        required: false
        description: Operational rules for tagging questions, chapters, slides, and labs.
      placement_examples:
        range: PlacementExample
        multivalued: true
        inlined_as_list: true
        required: false
        description: Worked examples illustrating the home rule on boundary concepts.
      dimensions:
        range: DimensionSet
        inlined: true
        required: true
        description: Cross-cutting facet vocabularies (activities, layers, concerns, contexts).
      groups:
        range: SubjectGroup
        multivalued: true
        inlined_as_list: true
        required: false
        description: Top-level structural bands of the taxonomy.
      areas:
        range: SubjectArea
        multivalued: true
        inlined_as_list: true
        required: true
        description: Subject areas organized under the top-level groups.
      gaps:
        range: ScopeGap
        multivalued: true
        inlined_as_list: true
        required: false
        description: Declared candidate scope gaps tracked for future taxonomy versions.
      sources:
        range: FrameworkSource
        multivalued: true
        inlined_as_list: true
        required: true
        description: External curricula, standards, and benchmarks warranting subject boundaries.
      field_id:
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for the field concept graph.
      field_title:
        required: true
        description: Human-readable title of the field concept graph.
      field_scope:
        required: true
        description: Declared scope boundary of the field concept graph.
      background_boundary:
        required: false
        description: Rule distinguishing core ML systems concepts from imported background concepts.
      limitations:
        multivalued: true
        required: false
        description: Explicit caveats on what the model does and does not claim.
      learning_paths:
        required: false
        description: Policy note or ordered list of guided learning paths.
      field_sources:
        range: FieldSource
        multivalued: true
        inlined_as_list: true
        required: true
        description: External reading sources warranting field concepts and relationships.
      families:
        range: ConceptFamily
        multivalued: true
        inlined_as_list: true
        required: true
        description: Coarse navigation groupings of field concepts.
      concepts:
        range: UnifiedConcept
        multivalued: true
        inlined_as_list: true
        required: true
        description: Full inventory of technical concepts with required primary subject `home` pointers.
      relations:
        range: ControlledRelation
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 17
        description: Controlled 17-verb relationship vocabulary with forward and inverse readings.
      retired:
        range: RetiredConcept
        multivalued: true
        inlined_as_list: true
        required: false
        description: Permanent redirect records for withdrawn or merged concept identities.
      relationships:
        range: Relationship
        multivalued: true
        inlined_as_list: true
        required: true
        description: Directed, condition-qualified technical propositions between concepts.
      views:
        range: FieldView
        multivalued: true
        inlined_as_list: true
        required: true
        description: Named curated subsets of field concepts (`all` view is auto-derived).
      guides:
        range: GuidesModel
        inlined: true
        required: true
        description: Practitioner role profiles, production symptom triage guides, and learning paths.
      skos_hierarchy:
        range: TaxonomyHierarchyModel
        inlined: true
        required: false
        description: Explicit SKOS broader/narrower hierarchy assertions and family collections.
  UnifiedConcept:
    class_uri: skos:Concept
    description: A permanent technical concept in UnifiedTaxonomyModel with a required primary subject home.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^mlsys\.[a-z0-9]+(-[a-z0-9]+)*$
        description: Permanent machine-readable identifier for this record.
      label:
        slot_uri: skos:prefLabel
        required: true
        description: Canonical human-readable term or heading in sentence case.
      home:
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        description: Identifier of the primary candidate home subject row.
      definition:
        slot_uri: skos:definition
        required: true
        description: Single-sentence technical definition stating what the item is and what it changes.
      family:
        range: ConceptFamily
        required: true
        description: Identifier of the owning concept family.
      status:
        range: DraftStatusEnum
        required: true
        description: Editorial review lifecycle status of the record.
      aliases:
        slot_uri: skos:altLabel
        multivalued: true
        required: false
        description: Alternative terms, acronyms, or practitioner synonyms.
      scope:
        range: ConceptScopeEnum
        required: false
        description: Whether the record belongs to core ML systems or imported background knowledge.
      added_in:
        required: false
        pattern: ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[a-z0-9]+)?$
        description: Release that first admitted this concept, the date-of-entry part of a Z39.19 history note (section
          6.2.3).
      references:
        range: FieldSource
        multivalued: true
        required: false
        description: Identifiers of external reading sources warranting this record.
