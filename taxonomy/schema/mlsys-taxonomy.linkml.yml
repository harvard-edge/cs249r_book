      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: Permanent machine-readable identifier for this record.
      label:
        slot_uri: skos:prefLabel
        required: true
        description: Canonical human-readable term or heading in sentence case.
      signal:
        slot_uri: skos:definition
        required: true
        description: Observable production telemetry or failure behavior triggering triage.
      causes:
        multivalued: true
        required: true
        description: Field concepts representing likely root causes or bottlenecks.
      checks:
        multivalued: true
        required: false
        description: Field concepts representing diagnostic metrics, profilers, or tests.
      levers:
        multivalued: true
        required: true
        description: Field concepts representing architectural or operational mitigations.
  LearningPath:
    description: Ordered sequence of subjects forming a study path for a target audience.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
