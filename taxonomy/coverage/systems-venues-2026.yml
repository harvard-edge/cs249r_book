# Recorded coverage judgments; numbers come from `binder concepts coverage`.
schema_version: 1
id: systems-venues-2026
title: ML systems papers at OSDI, NSDI, EuroSys, and ASPLOS 2026
basis: '202 machine-learning-systems papers from the 2026 programs of OSDI, NSDI, EuroSys, and ASPLOS, compiled by one model
  (gpt-6.1-sol, from official program pages, in an empty directory without access to the taxonomy) after the 0.4 vocabulary
  was fixed, and judged against 0.4-draft by a second (claude-opus-5-5), with every partial and missing item re-judged by
  a third (gemini-4-argon-high; one overturn); a topic is covered only when a concept definition names its central mechanism.
  Held out: it did not inform the 0.4 design and its gaps remain open until the next refresh.'
held_out: true
