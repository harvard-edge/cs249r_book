schema_version: "1.0"
title: "Pre-Registered Evaluation Rubric for Blind ML Systems Taxonomy Construction Methods"
frozen_before_phase: "Phase 1 (Blind Method Design)"
purpose: >
  Evaluate anonymized taxonomy construction methods (Method A, Method B, Method C)
  designed without exposure to the existing vocabulary. Scored by independent read-only
  judges using a single scoring path across all arms before citation auditing and
  before any comparison with taxonomy/METHOD.md.

scoring_scale:
  min: 0
  max: 5
  anchors:
    0: "Absent or unusable; section missing or contradicts core requirements."
    1: "Vague high-level aspirations with no operational rule or testable criterion."
    2: "Partial rules present, but leaves major ambiguity in execution or omits multi-artifact tagging needs."
    3: "Operational procedure covering typical cases, with minor gaps in edge-case handling or formal verification."
    4: "Rigorous, reproducible procedure with explicit decision rules, edge-case handling, and traceable standards grounding."
    5: "Complete, low-maintenance, self-auditing specification with operational decision tests, formal invariants, and verifiable primary citations."

dimensions:
  - id: construction_steps
    name: "Construction Steps & Structural Organization"
    max_score: 5
    criteria:
      - "Specifies an ordered end-to-end workflow from scope definition and top-down facet/hierarchy design to bottom-up candidate extraction, term control, relationship assignment, and release."
      - "Addresses how multi-dimensional engineering concepts (stack layer, lifecycle stage, quality attribute, workload context) are organized for browsing and tagging without uncontrolled polyhierarchy."
      - "Includes explicit tests for hierarchical vs. associative relationships (e.g., generic all-and-some test vs. typed non-hierarchical links)."

  - id: evidence_and_warrant_rules
    name: "Evidence Rules & Concept-vs-Alias Boundary"
    max_score: 5
    criteria:
      - "Operationalizes literary, organizational, and user warrant with minimum independent source thresholds."
      - "Defines a deterministic or auditable boundary between admitting a standalone concept versus recording an entry term / alias on an existing concept."
      - "Prevents vocabulary bloat from vendor/product names, single-paper coinages, or trivial metric variants."

  - id: sampling_frame
    name: "Sampling Frame & Corpus Completeness Design"
    max_score: 5
    criteria:
      - "Defines an enumerated, stratified sampling frame across the target ecosystems: textbooks, university courses, peer-reviewed systems/ML venues, practitioner/interview corpora, and standards."
      - "Separates design/construction corpora from held-out evaluation slices so completeness metrics cannot be gamed by fitting to a fixed checklist."
      - "Specifies how the sampling frame is refreshed over time as the discipline evolves."

  - id: representation_and_identifiers
    name: "Representation, Data Model & Identifier Permanence"
    max_score: 5
    criteria:
      - "Adopts published machine-readable standards for controlled vocabularies and metadata (e.g., W3C SKOS, OWL, RDF, Dublin Core / DCAT, JSON Schema / LinkML)."
      - "Enforces permanent, opaque or slug-based concept identifiers decoupled from human-readable browsing codes."
      - "Specifies non-breaking lifecycle transitions (deprecation, replacement, concept split, concept merge, subject move) so stored tags across chapters, interview questions, slides, labs, and courses never dangle."

  - id: validation_and_agreement
    name: "Validation, Inter-Indexer Consistency & Testing"
    max_score: 5
    criteria:
      - "Specifies quantitative inter-indexer consistency metrics suited to multi-label concept assignment (e.g., Cohen's/Fleiss' kappa at subject/area grain plus set-overlap measures such as Hooper, Rolling, Jaccard, or Dice)."
      - "Requires blind held-out coverage testing and multi-judge verification of coverage claims."
      - "Separates automated structural/compiler validation from semantic and human expert validation."

  - id: governance_and_maintenance
    name: "Governance, Editorial Roles & Low-Cost Maintenance"
    max_score: 5
    criteria:
      - "Defines decision authority, domain expert review roles, and public change-request intake."
      - "Keeps routine updates cheap via a repeatable maintenance loop (batching, automated regression gates, reconciliation of review verdicts)."
      - "Guards against silent omissions or unreviewed edits during multi-reviewer or model-assisted passes."

  - id: stop_conditions_and_scope_boundaries
    name: "Stop Conditions, Granularity & Scope Boundaries"
    max_score: 5
    criteria:
      - "Draws a testable scope boundary for ML systems engineering (distinguishing systems-for-ML from pure ML theory or ML-for-systems, and handling foundational background concepts from adjacent fields)."
      - "Defines granularity stop conditions (when a candidate is too narrow to split or too broad to be useful for tagging a chapter, question, slide, or lab)."
      - "Defines release readiness and iteration stop criteria (diminishing returns on held-out coverage, agreement thresholds)."

  - id: standards_and_primary_citations
    name: "Published Standards & Primary-Source Citations"
    max_score: 5
    criteria:
      - "Grounds recommendations in named, published standards (e.g., ANSI/NISO Z39.19, ISO 25964, W3C SKOS) and established domain vocabularies (e.g., ACM CCS, CS2023, SFIA, ESCO, MITRE ATT&CK/ATLAS, MeSH)."
      - "Cites primary documents accurately without fabricating clause numbers, titles, or claims."
      - "Distinguishes direct standard conformance from project-specific extensions or adaptations."

synthesis_rules:
  - "Judges score anonymized methods (Method A, Method B, Method C) independently before any citation audit or comparison with existing project files."
  - "An independent audit team checks every citation in all three methods against primary sources; fabricated or misrepresented citations penalize standards_and_primary_citations and disqualify unsupported claims from synthesis."
  - "The synthesized method may combine components across Method A, Method B, and Method C only when each component is explicitly mapped to its source method ID, dimension score, and justification."
