- chapter: vol3/03_test_time_compute
  label: Step-level evidence
  role: primary
  disposition: candidate-new
  field_concepts: []
  rationale: 'Proposed concept: outcome versus process verification. It contrasts executed outcome checks,
    learned outcome and process reward models that only predict quality, and step-level checks that prune early
    at the cost of false rejections and prefix-rescoring cost. Test oracle and trajectory evaluation describe
    judging behavior or whole runs. Neither distinguishes executed from predicted evidence or step from outcome
    granularity.'
  evidence:
  - section: sec-vol3-test-time-compute-outcome-step-evidence
    quote: The outcome check runs the artifact and reports what happened; the reward model only predicts how
      good the artifact looks.
  - section: sec-vol3-test-time-compute-outcome-step-evidence
    quote: Choosing how often to check balances saved generation tokens against scorer cost and false rejections.
  - section: sec-vol3-test-time-compute-outcome-step-evidence
    quote: When the serving engine caches prefixes across steps, incremental scoring reads only the new $\FiniteChange
      \ScoredPrefixLength$ tokens at each step and removes the quadratic growth
