- chapter: vol2/08_fleet_orchestration
  label: Interruption economics
  role: primary
  disposition: candidate-new
  field_concepts: []
  rationale: 'Proposed concept: preemption and interruption cost. Each interruption costs the work discarded
    since the last durable checkpoint plus relaunch, reload, and warmup; preemption cascades multiply that
    cost; spot capacity is judged by effective cost over retained progress. Recovery checkpoint and cost per
    useful outcome are inputs to this accounting. Neither defines the interruption cost or cascade fan-out,
    so no mapping is supported.'
  evidence:
  - section: sec-fleet-orchestration-preemption-cascades
    quote: A successful graceful checkpoint adds the time to save and restart while preserving completed progress;
      a forced stop can instead discard work since the last durable checkpoint.
  - section: sec-fleet-orchestration-preemption-cascades
    quote: one admission interrupts $\PreemptionFanoutCount+ \PreemptionFanoutCount^2$ jobs after two levels.
  - section: sec-fleet-orchestration-spot-instances
    quote: The first is the cost of each interruption (checkpoint overhead plus restart time plus lost work
      since the last checkpoint).
  inventory_id: vol2/08_fleet_orchestration:ac1119c2d14fface
