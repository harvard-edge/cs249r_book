- chapter: vol2/08_fleet_orchestration
  label: Scheduler as allocation control plane
  role: primary
  disposition: broader-than
  field_concepts:
  - mlsys.admission
  - mlsys.placement
  - mlsys.fencing
  rationale: The declaration covers admission, placement, reconciliation, and enforcement of allocation generations
    and leases. Admission control, execution placement, and fencing describe components of that control plane;
    none alone represents the complete allocation protocol. The placement definition is broad enough to include
    node binding, with device, edge, and datacenter presented as examples. This is a broader-than correspondence
    to the component concepts, not an equivalence.
  evidence:
  - section: sec-fleet-orchestration-control-plane
    quote: A scheduler control plane avoids this ambiguity by separating three decisions.
  - section: sec-fleet-orchestration-control-plane
    quote: Node agents must enforce allocation generations and lease validity so that an old decision cannot
      revive after a newer placement has taken ownership.
  - section: sec-fleet-orchestration-distributed-scheduling
    quote: Reusing a GPU therefore requires confirmed cleanup or an enforced revocation of the old allocation.
  inventory_id: vol2/08_fleet_orchestration:64922a6ed2132584
