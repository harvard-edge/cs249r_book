- chapter: vol3/03_test_time_compute
  label: Ranking is not acceptance
  role: primary
  disposition: narrower-than
  field_concepts:
  - mlsys.selective-prediction
  rationale: 'Selective prediction is predicting on admitted cases and abstaining or deferring on the rest. Verifier-guided
    selection is a narrower case: the admission rule is a pass from a check the candidate cannot modify, applied to a candidate
    pool. When no candidate passes, the runtime abstains instead of returning the best-ranked failure.'
  evidence:
  - section: sec-vol3-test-time-compute-selection-policies
    quote: If every candidate in the pool is broken, picking the highest-ranked candidate returns the best-looking failure.
  - section: sec-vol3-test-time-compute-selection-policies
    quote: is a selection policy that returns a candidate only when a **verifier**, a check whose criteria and observations
      the candidate cannot modify, passes it, and abstains when no candidate passes.
