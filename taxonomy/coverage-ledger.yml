- chapter: vol2/08_fleet_orchestration
  label: Gang scheduling
  role: primary
  disposition: candidate-new
  field_concepts: []
  rationale: 'Proposed concept: gang scheduling, the atomic all-or-nothing co-allocation of the minimum resource
    group a rigid synchronous job needs, together with reservation and safe backfill. No field record covers
    atomic co-allocation or hold-and-wait avoidance. Admission control decides whether work enters, not whether
    its resources arrive together. Stragglers concern delayed members of an already running group.'
  evidence:
  - section: sec-fleet-orchestration-gang-scheduling
    quote: For a rigid job $\RigidGangJob$ requiring $\DeviceCount$ GPUs, the scheduler must grant all $\DeviceCount$
      GPUs atomically or leave the job queued without a partial allocation.
  - section: sec-fleet-orchestration-gang-scheduling
    quote: Protecting the reservation requires an enforced runtime bound or a preemption contract that releases
      the backfill allocation in time, including any checkpoint and cleanup delay.
  inventory_id: vol2/08_fleet_orchestration:87a6e8dcdea1ddf5
