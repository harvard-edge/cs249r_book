- chapter: vol3/03_test_time_compute
  label: Selection pressure
  role: primary
  disposition: broader-than
  field_concepts:
  - mlsys.selection-bias
  - mlsys.reward-hacking
  rationale: Model-selection optimism (overstated performance from choosing a winner on noisy evaluations) is the regressional
    part, the sigma*sqrt(2 ln N) argmax error. Reward hacking (raising a measured reward through behavior that fails the objective)
    is the exploit-crowning part. The declaration covers both, plus the requirement to re-measure check accuracy on selected
    candidates.
  evidence:
  - section: sec-vol3-test-time-compute-selection-pressure
    quote: Picking $\arg\max_i \EstimatedCandidateUtility_i$ maximizes the sum of utility and noise, so the winning candidate
      is disproportionately one that drew a large positive error.
  - section: sec-vol3-test-time-compute-selection-pressure
    quote: Checker accuracy measured on unselected outputs therefore overstates accuracy under search, and the gap widens
      as the pool grows.
