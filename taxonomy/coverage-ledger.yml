- chapter: vol3/03_test_time_compute
  label: Coverage is not selection
  role: primary
  disposition: candidate-new
  field_concepts: []
  rationale: 'Proposed concept: candidate coverage versus selection accuracy. pass@k measures whether a pool
    contains a passing candidate and caps any selector that returns an unchanged member, while realized accuracy
    depends on the selector. Evaluation metrics is a generic record for specified measurements and does not
    define this ceiling relationship. Model-selection optimism concerns overstated performance, not unrecovered
    coverage.'
  evidence:
  - section: sec-vol3-test-time-compute-pass-at-k
    quote: If the selector must return an unchanged member of the same pool, it cannot return a test-passing
      candidate when the pool contains none.
  - section: sec-vol3-test-time-compute-pass-at-k
    quote: Benchmarks therefore report candidate availability alongside selected-output performance under the
      relevant criterion, because the gap between the two can be large.
  - section: sec-vol3-test-time-compute-pass-at-k
    quote: Coverage keeps climbing for four orders of magnitude while voting flattens after a few hundred samples
  inventory_id: vol3/03_test_time_compute:b20523a56673b9cc
