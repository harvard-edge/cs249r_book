- chapter: vol2/08_fleet_orchestration
  label: Utilization tiers
  role: primary
  disposition: broader-than
  field_concepts:
  - mlsys.utilization
  rationale: Resource utilization (occupied fraction of defined capacity over an interval) corresponds to the
    allocated and active tiers once their counter definitions are fixed. The declaration adds a productive
    tier, which measures retained useful work normalized to the fault-free step rate rather than occupancy,
    and a diagnostic claim about policy-infrastructure mismatch. Both go beyond the field definition.
  evidence:
  - section: sec-fleet-orchestration-resource-accounting
    quote: Allocated capacity counts resources held by complete allocations, so devices assigned to a gang
      that still waits for its remaining members do not count.
  - section: sec-fleet-orchestration-resource-accounting
    quote: Productive utilization requires a workload-level measure of retained training progress or serving
      work that meets its objective, normalized to the job's own fault-free step rate.
  - section: sec-fleet-orchestration-policy-infrastructure-mismatch
    quote: Surface-level diagnosis often mistakes policy-infrastructure mismatches for scheduling algorithm
      bugs.
