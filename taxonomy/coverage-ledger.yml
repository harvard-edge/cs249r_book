- chapter: vol2/08_fleet_orchestration
  label: Topology-aware placement
  role: primary
  disposition: narrower-than
  field_concepts:
  - mlsys.placement
  rationale: 'Execution placement is defined generally as the choice of where system components execute. Topology-aware
    placement is a narrower case: it chooses nodes and racks for a job''s ranks by minimizing a locality cost
    over the network hierarchy. Network topology is an input constraint to that choice, not an equivalent concept,
    so it is not listed as a target.'
  evidence:
  - section: sec-fleet-orchestration-topology-hierarchy
    quote: Topology-aware placement minimizes the communication cost of the job's actual traffic pattern rather
      than applying a fixed penalty to every boundary.
  - section: sec-fleet-orchestration-placement-algorithms
    quote: This surrogate does not guarantee minimum communication time or completion time.
  inventory_id: vol2/08_fleet_orchestration:5df11ca4d5861f41
