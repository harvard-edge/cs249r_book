- chapter: vol3/03_test_time_compute
  label: Allocation axes
  role: primary
  disposition: candidate-new
  field_concepts: []
  rationale: 'Proposed concept: test-time compute allocation axes. Depth (sequential reasoning), breadth (parallel
    candidates), and feedback (observation-driven revision) spend the same output ceiling with different critical
    paths, retained state, and information gain. The field has KV cache and context working set as resource
    records, but no record for how inference-time compute is allocated across these dependency structures.'
  evidence:
  - section: sec-vol3-test-time-compute-common-output-ceiling
    quote: Capping generated tokens at a single number does not cap wall-clock latency, accelerator memory,
      or input-token billing, because depth, breadth, and feedback turn the same output ceiling into different
      resource loads.
  - section: sec-vol3-test-time-compute-feedback-axis
    quote: The feedback axis supplies that missing evidence by executing a check on a candidate and feeding
      the resulting observation into the next model request.
  inventory_id: vol3/03_test_time_compute:115d6ee6db02d34f
  reviewer: Claude Opus 5.5
  reviewer_kind: ai
  reviewed_on: '2026-10-21'
