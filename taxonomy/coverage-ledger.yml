- chapter: vol2/08_fleet_orchestration
  label: Elastic scheduling contract
  role: primary
  disposition: candidate-new
  field_concepts: []
  rationale: 'Proposed concept: an elastic job resizing contract between scheduler and training framework,
    with a declared size range, valid increments, measured transition cost, and scaling-efficiency curve, judged
    by time to target quality. mlsys.autoscaling changes provisioned service resources in response to demand.
    Here the cluster scheduler resizes a training job according to fleet availability and priority, so the
    field definition does not support a mapping.'
  evidence:
  - section: sec-fleet-orchestration-elastic-contract
    quote: 'From the scheduler''s perspective, this contract is defined by three governing parameters: the
      elastic range, the transition cost, and the scaling efficiency curve.'
  - section: sec-fleet-orchestration-elastic-contract
    quote: The scheduler must amortize this cost over the subsequent run duration, so small resize increments
      are only worthwhile if the job will run at the new scale for significantly longer than the transition
      window.
  - section: sec-fleet-orchestration-elastic-scheduler-integration
    quote: Because batch changes can affect convergence, the test of a resize is time to target model quality,
      not throughput.
  inventory_id: vol2/08_fleet_orchestration:a95c9adbaa16c4c6
