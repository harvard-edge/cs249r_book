- chapter: vol2/08_fleet_orchestration
  label: Scheduling objectives and matched signals
  role: primary
  disposition: broader-than
  field_concepts:
  - mlsys.queueing
  rationale: Queueing delay (time waiting before service) is one component, developed through the M/G/1 waiting-time relation.
    The declaration also covers the throughput/latency/fairness/cost trade-off, slowdown as a completion-delay fairness metric,
    and matching a policy's signal to its objective. None of those has a field record.
  evidence:
  - section: sec-fleet-orchestration-objectives
    quote: 'Every scheduling policy trades four competing objectives against one another: throughput, fairness, latency, and
      cost efficiency.'
  - section: sec-fleet-orchestration-objectives
    quote: A one-hour job that waits nine hours has $\JobSlowdown_j=10$, even if its team eventually receives its nominal
      GPU share.
  - section: sec-fleet-orchestration-scheduler-comparison
    quote: The common lesson is to match the policy signal to the scheduling objective.
