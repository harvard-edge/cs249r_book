- chapter: vol3/03_test_time_compute
  label: Revisable candidate plans
  role: primary
  disposition: narrower-than
  field_concepts:
  - mlsys.planning
  rationale: 'Agent planning is constructing and revising prospective actions in response to dependencies and
    observations. A revisable candidate plan is a narrower mechanism for that revision: a dependency graph
    of unexecuted artifacts with evidence provenance, so a refuting observation invalidates only its descendants.
    Data lineage records similar dependency provenance but is defined for datasets and artifacts, not plan
    revision, so it is not listed.'
  evidence:
  - section: sec-vol3-test-time-compute-planning-revision
    quote: When new evidence refutes a premise, the runtime invalidates and regenerates only the affected subgraph
      while keeping supported artifacts intact, and the replacement artifacts then go through their own checks.
  - section: sec-vol3-test-time-compute-precondition-invalidation
    quote: 'To keep reuse sound, every recorded observation must carry its full provenance: the exact source
      revision or patch digest, test suite version, compiler flags, and runtime environment.'
