  rationale: Mapped to mlsys.dominant-resource-fairness added in 0.3-draft (multi-resource fair allocation over feasible bundles
    satisfying capability, gang, topology, and packing constraints).
  evidence:
  - section: sec-fleet-orchestration-drf-worked-allocation
    quote: A production scheduler therefore applies capability, gang, and topology constraints to the feasible set, then uses
