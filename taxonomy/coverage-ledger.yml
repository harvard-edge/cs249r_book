- chapter: vol2/08_fleet_orchestration
  label: Feasibility before fairness
  role: primary
  disposition: candidate-new
  field_concepts: []
  rationale: 'Proposed concept: multi-resource fair allocation over feasible bundles. Tenants'' shares are
    compared by dominant-resource share, computed only over allocations satisfying capability, gang, topology,
    and packing constraints. mlsys.fairness is defined as how system outcomes or errors are distributed across
    affected groups (a responsible-ML sense), not tenant resource shares, so no mapping is supported. The ordering
    principle is book framing; the field-level idea is multi-resource fair sharing under feasibility constraints.'
  evidence:
  - section: sec-fleet-orchestration-drf-worked-allocation
    quote: A production scheduler therefore applies capability, gang, and topology constraints to the feasible
      set, then uses DRF\index{Dominant resource fairness!progressive filling} to choose fairly among allocations
      that can actually run.
  - section: sec-fleet-orchestration-bin-packing
    quote: Even when a cluster has dozens of free GPUs in total, a pending 8-GPU job will sit blocked if previous
      placements scattered those free GPUs in 1- and 2-GPU remnants across partially occupied nodes.
  inventory_id: vol2/08_fleet_orchestration:0e9bec7aa04558c1
