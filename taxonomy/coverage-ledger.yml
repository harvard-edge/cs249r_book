  rationale: Mapped directly to mlsys.reasoning-budget added in 0.3-draft (bounding the tokens, steps, or wall-clock time
    spent on inference-time reasoning).
  evidence:
  - section: sec-vol3-test-time-compute-computation-allocation
    quote: is the per-decision allowance of processed prompt tokens, generated tokens, model invocations, verification checks,
      and elapsed wall-clock time that a runtime may expend, with model weights fixed, before it must select a candidate,
      abstain, or escalate to a human operator.
  - section: sec-vol3-test-time-compute-computation-allocation
    quote: Additional deliberation reduces cost per accepted task when it increases the acceptance rate $\AcceptanceProbability$
      proportionally faster than it increases the expected attempt cost.
  - section: sec-vol3-test-time-compute-reasoning-models
    quote: 'Runtimes should route budgets by estimated difficulty: spend a small budget or a single call on straightforward
      tasks, use parallel search and feedback on moderately hard tasks, and escalate near-zero-yield requests to a stronger
      model or a human operator instead of burning tokens on unguided sampling.'
