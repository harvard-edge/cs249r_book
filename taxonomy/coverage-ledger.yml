  - mlsys.checkpoint-interval
  rationale: Mapped to mlsys.spot-capacity and mlsys.checkpoint-interval in 0.3-draft (running on revocable discounted capacity
    and balancing discount against checkpoint and restart loss).
  evidence:
  - section: sec-fleet-orchestration-preemption-cascades
    quote: A successful graceful checkpoint adds the time to save and restart while preserving completed progress; a forced
      stop can instead discard work since the last durable checkpoint.
  - section: sec-fleet-orchestration-preemption-cascades
    quote: one admission interrupts $\PreemptionFanoutCount+ \PreemptionFanoutCount^2$ jobs after two levels.
  - section: sec-fleet-orchestration-spot-instances
    quote: The first is the cost of each interruption (checkpoint overhead plus restart time plus lost work since the last
      checkpoint).
