- chapter: vol3/03_test_time_compute
  label: Verifier precision
  role: primary
  disposition: candidate-new
  field_concepts: []
  rationale: 'Proposed concept: verifier precision under base rates. The share of passing verdicts that are
    valid follows from the valid-candidate base rate and the check''s false-acceptance and false-rejection
    rates via Bayes'' rule, independent of pool size. A test oracle is the judging mechanism, not the reliability
    of its positive verdicts. Statistical uncertainty concerns finite-sample estimation. Neither definition
    supports a mapping.'
  evidence:
  - section: sec-vol3-test-time-compute-check-precision
    quote: Generating a passing candidate and knowing that a passing candidate is valid are different events,
      and the base rate and checker error rates, not the pool size, bound how far a pass can be trusted.
  inventory_id: vol3/03_test_time_compute:ac616991c6a17599
