- chapter: vol3/03_test_time_compute
  label: Budgeted deliberation
  role: primary
  disposition: candidate-new
  field_concepts: []
  rationale: 'Proposed concept: test-time compute budget. This is a per-decision allowance of tokens, invocations,
    checks, and wall time spent with frozen weights before the runtime must select, abstain, or escalate, and
    it is routed by estimated difficulty. Cost per useful outcome is the evaluation measure the budget feeds
    (C_eff), not the allowance or its routing, so a mapping would claim an equivalence the definitions do not
    support.'
  evidence:
  - section: sec-vol3-test-time-compute-computation-allocation
    quote: is the per-decision allowance of processed prompt tokens, generated tokens, model invocations, verification
      checks, and elapsed wall-clock time that a runtime may expend, with model weights fixed, before it must
      select a candidate, abstain, or escalate to a human operator.
  - section: sec-vol3-test-time-compute-computation-allocation
    quote: Additional deliberation reduces cost per accepted task when it increases the acceptance rate $\AcceptanceProbability$
      proportionally faster than it increases the expected attempt cost.
  - section: sec-vol3-test-time-compute-reasoning-models
    quote: 'Runtimes should route budgets by estimated difficulty: spend a small budget or a single call on
      straightforward tasks, use parallel search and feedback on moderately hard tasks, and escalate near-zero-yield
      requests to a stronger model or a human operator instead of burning tokens on unguided sampling.'
  inventory_id: vol3/03_test_time_compute:9b800077355b477e
  reviewer: Claude Opus 5.5
