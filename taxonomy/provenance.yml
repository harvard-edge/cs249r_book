    edge_impact_note: 'Checked against the baseline definition (''Predicting on admitted cases and abstaining or deferring
      the rest.'') and all 8 incident relationships on mlsys.selective-prediction (rel.calibration.selective-prediction, rel.conformal-prediction.selective-prediction,
      rel.cost-sensitive-decision.selective-prediction, rel.human-oversight.selective-prediction, rel.model-cascade.selective-prediction,
