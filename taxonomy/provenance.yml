      adds a genus and replaces label-echoing ''Predicting'' with emitting model outputs while keeping baseline ''admitted
      cases'' and abstain-or-defer semantics intact across runtime requests, cascade deferral, human escalation, and confidence-filtered
      pseudo-labeling. V1 edge queue note: rel.semi-supervised-learning.selective-prediction carries extraneous baseline references
      (''random-search'', ''hyperband'') queued for V1 relationships_update cleanup.'
