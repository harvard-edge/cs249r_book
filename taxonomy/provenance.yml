    - editorial-bed1200d4c8c09fe18e249a9c652dec0c0c56784bb4542b3c64ad2e49ef561c9
    removed_aliases:
      PCIe passthrough: Whole-device pass-through assigns a physical GPU exclusively to one VM; it is not an equivalent name
        for sharing or partitioning. The correction is editorial synthesis; retained neighboring claims remain provisional.
      device passthrough: Whole-device pass-through assigns a physical GPU exclusively to one VM; it is not an equivalent
        name for sharing or partitioning. The correction is editorial synthesis; retained neighboring claims remain provisional.
    entry_term_decisions:
      MIG:
        kind: implementation
        rationale: NVIDIA MIG implements spatial GPU partitioning; it is not the generic sharing and partitioning concept.
        sources:
        - url: https://docs.nvidia.com/datacenter/tesla/mig-user-guide/introduction.html
          locator: Introduction
          supports: MIG creates isolated GPU instances.
        - url: https://docs.kernel.org/PCI/pci-iov-howto.html
          locator: 3.1.1
          supports: SR-IOV exposes virtual functions on a physical PCIe device.
        campaign_id: editorial-bed1200d4c8c09fe18e249a9c652dec0c0c56784bb4542b3c64ad2e49ef561c9
      SR-IOV:
        kind: related
        rationale: PCIe virtual functions can support device sharing but are not equivalent to accelerator partitioning.
        sources:
        - url: https://docs.nvidia.com/datacenter/tesla/mig-user-guide/introduction.html
          locator: Introduction
          supports: MIG creates isolated GPU instances.
        - url: https://docs.kernel.org/PCI/pci-iov-howto.html
          locator: 3.1.1
          supports: SR-IOV exposes virtual functions on a physical PCIe device.
        campaign_id: editorial-bed1200d4c8c09fe18e249a9c652dec0c0c56784bb4542b3c64ad2e49ef561c9
      GPU sharing:
        kind: narrower
        rationale: GPU sharing is restricted to one accelerator class within the broader accelerator-sharing concept.
        sources:
        - url: https://docs.nvidia.com/datacenter/tesla/mig-user-guide/introduction.html
          locator: Introduction
          supports: MIG creates isolated GPU instances.
        - url: https://docs.kernel.org/PCI/pci-iov-howto.html
          locator: 3.1.1
