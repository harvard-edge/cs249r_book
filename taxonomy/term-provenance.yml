    - row: on-device-deployment
      add_secondary_concepts:
      - mlsys.memory-planning
      rationale: 'Curated dev summary P4-S2-MIT65940-01 (source stratum S2, MIT 6.5940) states that ''Deploying models on
        edge SoCs, mobile NPUs, and microcontrollers requires ... static arena memory planning to avoid heap fragmentation
        under kilobyte SRAM ceilings''. Editorial scope note: static arena memory planning is an applicable on-device deployment
        technique for predictable allocation and fragmentation avoidance—chiefly required on bare-metal microcontrollers operating
        under kilobyte SRAM ceilings rather than a universal requirement across all edge SoCs and mobile NPUs; because mlsys.memory-planning
        is homed in subject S2.4 (ml-compilers) in area S2, it is linked here as a secondary concept rather than re-homed.'
