concepts:
  mlsys.batching:
    alias_metadata:
      dynamic request batching:
        type: upward-posting
        source: MLSysBook Vol. 1 Ch. 5 (dev unit P4-S1-MLSYSBOOK-V1C05, S1, verbatim 'dynamic request batching'); Huyen, Designing
          Machine Learning Systems (O'Reilly, 2022), Ch. 7 (dev unit P4-S1-DMLS-01, S1, online dynamic batching).
        dev_lineages_requiring_separation: 1
        checked_dev_units:
        - P4-S1-MLSYSBOOK-V1C05
        - P4-S1-DMLS-01
        - P4-COV-mlsysbook-vol1-vol2-primary-168
        - P4-S3-ORCA-2022
        scope_note: Time-windowed or queue-triggered online coalescing of concurrent inference requests is posted upward to
          Request batching (Z39.19 section 8.2.4) and qualified with 'request' per Z39.19 section 6.3.2 to eliminate cross-area
          homograph collision with S2 dynamic-computation-graph autobatching. Once iteration-level mlsys.continuous-batching
          and offline mlsys.batch-inference are separated, only 1 external dev lineage (pf_huyen_dmls, < 2) treats non-continuous
          online dynamic request batching separately.
    edge_impact_note: 'Verified against all 9 incident relationships on mlsys.batching (service-capacity, tail-latency, memory-capacity,
      model-server, continuous-batching, cost-per-token, latency-throughput-curve, kv-cache-quantization, and inference-load-scenario):
      covers both offline large-batch scenarios and latency-bounded online server batching without narrowing or shifting extension.'
  mlsys.benchmark:
    removed_aliases:
      MLPerf: Removes named multi-benchmark consortium 'MLPerf' (Gate 3 product/benchmark exclusion, Z39.19 section 6.3.3)
        and multi-protocol collection 'benchmark suite' (not equivalent to a single benchmark protocol, Z39.19 section 8.2).
      benchmark suite: Removes named multi-benchmark consortium 'MLPerf' (Gate 3 product/benchmark exclusion, Z39.19 section
        6.3.3) and multi-protocol collection 'benchmark suite' (not equivalent to a single benchmark protocol, Z39.19 section
        8.2).
  mlsys.constrained-decoding:
    alias_metadata:
      grammar-constrained decoding:
        type: upward-posting
        source: 'Zheng et al., SGLang: Efficient Execution of Structured Language Model Programs, NeurIPS 2024, Sections 3-4
          (dev unit P4-S3-SGLANG-2024, S3, verbatim ''grammar-constrained decoding''); CMU 11-868 Lectures 15-17 (dev unit
          P4-S2-CMU11868-02, S2).'
        dev_lineages_requiring_separation: 0
        checked_dev_units:
        - P4-S3-SGLANG-2024
        - P4-S2-CMU11868-02
        scope_note: Context-free grammar-constrained decoding is posted upward to Constrained decoding (Z39.19 section 8.2.4)
          alongside existing alias 'grammar-guided decoding'; every grammar-constrained decoder is an instance of Constrained
          decoding, the surface phrase is verbatim-attested in external dev unit P4-S3-SGLANG-2024 with zero cross-area homographs,
          and 0 checked dev lineages require indexing grammar-constrained decoding separately from schema/automaton constrained
          decoding.
    edge_impact_note: 'Verified against all 3 incident relationships on mlsys.constrained-decoding (implements mlsys.grammar,
      post-hoc alternative-to mlsys.output-validation, and enables mlsys.function-calling): preserves automaton-aligned token
      masking and deterministic span emission without altering any edge.'
  mlsys.online-experiment:
    removed_aliases:
      preregistered analysis plan: Removes planning/governance document 'preregistered analysis plan', which is a specification
        artifact used by an experiment rather than an equivalence term for Online experimentation (Z39.19 section 8.2).
  mlsys.selective-prediction:
    alias_metadata:
      selective abstention:
        type: quasi-synonym
        source: 'Stanford CS 329T: Trustworthy Machine Learning, Modules on Certified Robustness, Input/Output Guardrails,
          and Red-Teaming (dev unit Q4-S2-STANFORD-CS329T-01, S2, verbatim ''selective abstention'').'
        checked_dev_units:
        - Q4-S2-STANFORD-CS329T-01
        scope_note: 'Near-synonym (Z39.19 section 8.2.3) naming the complementary abstention facet of the same gating mechanism
          as Selective prediction, verbatim-attested in Q4 dev unit Q4-S2-STANFORD-CS329T-01 with zero cross-area homograph
          collisions (unlike excluded ''reject-option classification'', which collides with Q5 fairness post-processing).
          Note: P3 dev-frame enumeration remains open pre-1.0 work; 0 checked Q4 dev lineages separate selective abstention
          from Selective prediction.'
    edge_impact_note: 'Verified against all 8 incident relationships on mlsys.selective-prediction (calibration, conformal-prediction,
      model-cascade, cost-sensitive-decision, ood-detection, predictive-uncertainty, semi-supervised-learning, and human-oversight):
      ''admitted cases'' preserves both runtime inference requests and confidence-filtered unlabeled training examples.'
