      definition: Generation-control mechanism that masks disallowed tokens at each step, typically via a grammar or schema
        automaton, so generated output conforms to a required syntax or schema.
      definition_change_kind: editorial-clarification
      checked_incident_relationships:
      - rel.constrained-decoding.function-calling
      - rel.constrained-decoding.grammar
      - rel.output-validation.constrained-decoding
      edge_impact_note: 'Checked against the baseline definition (''Masking disallowed tokens at each step, typically from
        a grammar or schema automaton, so output satisfies a structural constraint.'') and all 3 incident relationships (rel.constrained-decoding.function-calling,
        rel.constrained-decoding.grammar, and rel.output-validation.constrained-decoding): adds a genus, replaces label-echoing
        ''structural constraint'' with ''required syntax or schema'' in line with the structured-generation subject definition,
        and retains per-step token masking and typical grammar or schema automaton guidance without shifting extension. V1
        edge queue note: rel.constrained-decoding.function-calling (''guarantees well-formed arguments for ... when the tool
        schema is compiled to a grammar'') cannot be edited in non-structural mode without holdout evaluation and is queued
        for V1 relationships_update to qualify that per-step valid-prefix masking guarantees well-formed arguments only for
        completed, non-truncated generations under sound schema-to-grammar compilation.'
    - id: mlsys.selective-prediction
      definition: Decision-gating mechanism that emits model outputs only for admitted cases and abstains on or defers the
        remaining cases.
      definition_change_kind: editorial-clarification
      checked_incident_relationships:
      - rel.calibration.selective-prediction
      - rel.conformal-prediction.selective-prediction
      - rel.cost-sensitive-decision.selective-prediction
      - rel.human-oversight.selective-prediction
