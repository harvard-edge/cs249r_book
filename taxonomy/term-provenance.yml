      remove_aliases_rationales:
        preregistered analysis plan: Removes planning/governance document 'preregistered analysis plan', which is a specification
          artifact used by an experiment rather than an equivalence term for Online experimentation (Z39.19 section 8.2, clause
          pinpoint per Phase 2 outline pending V1 primary-text verification).
