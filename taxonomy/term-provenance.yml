concepts:
  mlsys.benchmark:
    removed_aliases:
      MLPerf: Removes named multi-benchmark suite family 'MLPerf' (maintained by MLCommons; Gate 3 product/benchmark exclusion,
        Z39.19 section 6.3.3) and multi-protocol collection 'benchmark suite' (not equivalent to a single benchmark protocol,
        Z39.19 section 8.2).
      benchmark suite: Removes named multi-benchmark suite family 'MLPerf' (maintained by MLCommons; Gate 3 product/benchmark
        exclusion, Z39.19 section 6.3.3) and multi-protocol collection 'benchmark suite' (not equivalent to a single benchmark
        protocol, Z39.19 section 8.2).
  mlsys.constrained-decoding:
    definition_change_kind: editorial-clarification
    edge_impact_note: 'Checked against the baseline definition (''Masking disallowed tokens at each step, typically from a
      grammar or schema automaton, so output satisfies a structural constraint.'') and all 3 incident relationships (constrained-decoding
      implements mlsys.grammar, mlsys.output-validation is the post-hoc alternative to constrained-decoding, and constrained-decoding
      enables mlsys.function-calling): adds a genus, replaces label-echoing ''structural constraint'' with ''required syntax
      or schema'' in line with the structured-generation subject definition, and retains token masking and typical grammar
      or schema automaton guidance without shifting extension.'
  mlsys.online-experiment:
    removed_aliases:
      preregistered analysis plan: Removes planning/governance document 'preregistered analysis plan', which is a specification
        artifact used by an experiment rather than an equivalence term for Online experimentation (Z39.19 section 8.2).
  mlsys.selective-prediction:
    definition_change_kind: editorial-clarification
    edge_impact_note: 'Checked against the baseline definition (''Predicting on admitted cases and abstaining or deferring
      the rest.'') and all 8 incident relationships on mlsys.selective-prediction (calibration, conformal-prediction, model-cascade,
      cost-sensitive-decision, ood-detection, predictive-uncertainty, semi-supervised-learning, and human-oversight): adds
      a genus and replaces label-echoing ''Predicting'' with emitting model outputs while keeping baseline ''admitted cases''
      and abstain-or-defer semantics intact across runtime requests, cascade deferral, human escalation, and confidence-filtered
      pseudo-labeling.'
subjects:
  on-device-deployment:
    secondary_concepts_rationale:
      mlsys.memory-planning: On-device deployment on edge SoCs, mobile NPUs, and microcontrollers under kilobyte SRAM ceilings
        relies on static arena memory planning to avoid heap fragmentation (dev unit P4-S2-MIT65940-01, S2), homed in Stack
        area S2 (ml-compilers).
