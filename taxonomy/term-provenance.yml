      - rel.ood-detection.selective-prediction
      - rel.predictive-uncertainty.selective-prediction
      - rel.semi-supervised-learning.selective-prediction
      edge_impact_note: 'Checked against the baseline definition (''Predicting on admitted cases and abstaining or deferring
        the rest.'') and all 8 incident relationships on mlsys.selective-prediction (rel.calibration.selective-prediction,
        rel.conformal-prediction.selective-prediction, rel.cost-sensitive-decision.selective-prediction, rel.human-oversight.selective-prediction,
        rel.model-cascade.selective-prediction, rel.ood-detection.selective-prediction, rel.predictive-uncertainty.selective-prediction,
        and rel.semi-supervised-learning.selective-prediction): adds a genus and replaces label-echoing ''Predicting'' with
        emitting model outputs while keeping baseline ''admitted cases'' and abstain-or-defer semantics intact across runtime
        requests, cascade deferral, human escalation, and confidence-filtered pseudo-labeling. V1 edge queue note: rel.semi-supervised-learning.selective-prediction
        carries extraneous baseline references (''random-search'', ''hyperband'') queued for V1 relationships_update cleanup.'
    - id: mlsys.benchmark
      remove_aliases:
