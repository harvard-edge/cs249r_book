    concepts_update:
    - id: mlsys.constrained-decoding
      definition: Generation-control mechanism that masks disallowed tokens at each step, typically via a grammar or schema
        automaton, so generated output conforms to a required syntax or schema.
      definition_change_kind: editorial-clarification
      edge_impact_note: 'Checked against the baseline definition (''Masking disallowed tokens at each step, typically from
        a grammar or schema automaton, so output satisfies a structural constraint.'') and all 3 incident relationships (constrained-decoding
        implements mlsys.grammar, mlsys.output-validation is the post-hoc alternative to constrained-decoding, and rel.constrained-decoding.function-calling):
        adds a genus, replaces label-echoing ''structural constraint'' with ''required syntax or schema'' in line with the
        structured-generation subject definition, and retains per-step token masking and typical grammar or schema automaton
        guidance without shifting extension. V1 edge queue note: rel.constrained-decoding.function-calling (''guarantees well-formed
        arguments for ... when the tool schema is compiled to a grammar'') cannot be edited in non-structural mode without
        holdout evaluation and is queued for V1 relationships_update to qualify that per-step valid-prefix masking guarantees
        well-formed arguments only for completed, non-truncated generations under sound schema-to-grammar compilation.'
    - id: mlsys.selective-prediction
      definition: Decision-gating mechanism that emits model outputs only for admitted cases and abstains on or defers the
        remaining cases.
      definition_change_kind: editorial-clarification
      edge_impact_note: 'Checked against the baseline definition (''Predicting on admitted cases and abstaining or deferring
        the rest.'') and all 8 incident relationships on mlsys.selective-prediction (calibration, conformal-prediction, model-cascade,
        cost-sensitive-decision, ood-detection, predictive-uncertainty, semi-supervised-learning, and human-oversight): adds
        a genus and replaces label-echoing ''Predicting'' with emitting model outputs while keeping baseline ''admitted cases''
        and abstain-or-defer semantics intact across runtime requests, cascade deferral, human escalation, and confidence-filtered
        pseudo-labeling. V1 edge queue note: rel.semi-supervised-learning.selective-prediction carries extraneous baseline
        references (''random-search'', ''hyperband'') queued for V1 relationships_update cleanup.'
    - id: mlsys.benchmark
      remove_aliases:
      - MLPerf
      - benchmark suite
      remove_aliases_rationales:
        MLPerf: Removes named multi-benchmark suite family 'MLPerf' (maintained by MLCommons; excluded from aliases under
          Gate 3 project scope policy inspired by Z39.19 section 6.3.3).
        benchmark suite: Removes multi-protocol collection 'benchmark suite', which denotes a collection of benchmarks rather
          than an equivalent entry term for a single reproducible benchmark protocol (Z39.19 section 8.2).
    - id: mlsys.online-experiment
      remove_aliases:
      - preregistered analysis plan
      remove_aliases_rationale: Removes planning/governance document 'preregistered analysis plan', which is a specification
        artifact used by an experiment rather than an equivalence term for Online experimentation (Z39.19 section 8.2).
    subject_updates:
    - row: on-device-deployment
      add_secondary_concepts:
      - mlsys.memory-planning
      rationale: 'Curated dev summary P4-S2-MIT65940-01 (source stratum S2, MIT 6.5940) states that ''Deploying models on
        edge SoCs, mobile NPUs, and microcontrollers requires ... static arena memory planning to avoid heap fragmentation
        under kilobyte SRAM ceilings''. Editorial scope note: static arena memory planning is an applicable on-device deployment
        technique for predictable allocation and fragmentation avoidance—chiefly required on bare-metal microcontrollers operating
        under kilobyte SRAM ceilings rather than a universal requirement across all edge SoCs and mobile NPUs; because mlsys.memory-planning
        is homed in subject S2.4 (ml-compilers) in area S2, it is linked here as a secondary concept rather than re-homed.'
