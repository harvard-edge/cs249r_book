<g id="concept-mlsys.network-oversubscription" class="node">
<title>mlsys.network-oversubscription</title>
<g id="a_concept-mlsys.network-oversubscription"><a xlink:title="Provisioning less uplink capacity at a switch tier than the downlink capacity it serves, written as a downlink-to-uplink ratio, which cuts fabric cost but makes cross-tier bandwidth contend when many endpoints communicate at once, as synchronized collectives do.">
