<g id="concept-mlsys.torus-topology" class="node">
<title>mlsys.torus-topology</title>
<g id="a_concept-mlsys.torus-topology"><a xlink:title="A fabric in which accelerator nodes form a multidimensional grid with wraparound links to fixed neighbors rather than tiers of switches, so neighbor and ring traffic can run at link rate while global exchanges are routed hop by hop with lower bisection bandwidth that depends on dimensions, routing, and contention.">
