<g id="concept-mlsys.batch-invariance" class="node">
<title>mlsys.batch-invariance</title>
<g id="a_concept-mlsys.batch-invariance"><a xlink:title="A kernel property that each request's output is bitwise independent of batch size and co-batched requests, required for deterministic serving and matching training to inference numerics.">
