<title>mlsys.predictive-uncertainty</title>
<g id="a_concept-mlsys.predictive-uncertainty"><a xlink:title="An estimate of uncertainty in an individual prediction, sometimes decomposed into data noise and model uncertainty, used to support abstention, deferral, or data acquisition.">
