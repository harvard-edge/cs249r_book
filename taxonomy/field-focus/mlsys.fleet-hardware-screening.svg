<title>mlsys.fleet-hardware-screening</title>
<g id="a_concept-mlsys.fleet-hardware-screening"><a xlink:title="Periodically running test workloads with known outputs on fleet accelerators and processors, at intake and during production, to find defective or silently miscomputing units before they corrupt jobs, at the cost of fleet time spent on tests.">
