<g id="concept-mlsys.data-movement-energy" class="node">
<title>mlsys.data-movement-energy</title>
<g id="a_concept-mlsys.data-movement-energy"><a xlink:title="The energy cost of moving operands between storage levels, which grows with distance and typically exceeds the energy of the arithmetic performed on them.">
