<title>mlsys.co-packaged-optics</title>
<g id="a_concept-mlsys.co-packaged-optics"><a xlink:title="Placing optical transceivers inside the switch or accelerator package beside the silicon, so electrical paths shrink and energy per bit falls, at the cost of field serviceability and added package heat.">
