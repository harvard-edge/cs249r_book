<g id="concept-mlsys.head-of-line-blocking" class="node">
<title>mlsys.head-of-line-blocking</title>
<g id="a_concept-mlsys.head-of-line-blocking"><a xlink:title="Delay imposed on short or ready work because a queue serves in arrival order and a long or stalled item ahead holds the service point, so an item's wait depends on what is in front of it rather than on its own cost.">
