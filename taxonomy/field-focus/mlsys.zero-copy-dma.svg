<g id="concept-mlsys.zero-copy-dma" class="node">
<title>mlsys.zero-copy-dma</title>
<g id="a_concept-mlsys.zero-copy-dma"><a xlink:title="Having sensors or peripherals write input directly into model input buffers by direct memory access, avoiding CPU copies between capture and inference.">
