<g id="concept-mlsys.device-initiated-communication" class="node">
<title>mlsys.device-initiated-communication</title>
<g id="a_concept-mlsys.device-initiated-communication"><a xlink:title="Communication in which kernels on the accelerator issue and synchronize inter-device transfers themselves, without a host call per exchange, allowing fine-grained fusion of compute and communication at the cost of explicit ordering and completion handling.">
