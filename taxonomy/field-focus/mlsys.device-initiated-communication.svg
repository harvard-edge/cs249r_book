<text text-anchor="middle" x="232" y="-184.2" font-family="Helvetica Neue" font-size="16.00">Device-initiated</text>
<text text-anchor="middle" x="232" y="-166.2" font-family="Helvetica Neue" font-size="16.00">communication</text>
</a>
</g>
