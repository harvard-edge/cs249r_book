<g id="concept-mlsys.memory-wall" class="node">
<title>mlsys.memory-wall</title>
<g id="a_concept-mlsys.memory-wall"><a xlink:title="The widening gap between processor arithmetic throughput and memory bandwidth or latency, which makes data movement the limiting factor.">
