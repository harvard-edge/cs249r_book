<g id="concept-mlsys.always-on-cascade" class="node">
<title>mlsys.always-on-cascade</title>
<g id="a_concept-mlsys.always-on-cascade"><a xlink:title="Using a low-power sensing or inference stage to wake a more expensive stage only when needed, cutting continuous-monitoring energy at the risk of missed triggers and wake latency.">
<path fill="#f7f7f7" stroke="#88949d" stroke-width="1.15" d="M401.5,-219C401.5,-219 248.5,-219 248.5,-219 242.5,-219 236.5,-213 236.5,-207 236.5,-207 236.5,-177 236.5,-177 236.5,-171 242.5,-165 248.5,-165 248.5,-165 401.5,-165 401.5,-165 407.5,-165 413.5,-171 413.5,-177 413.5,-177 413.5,-207 413.5,-207 413.5,-213 407.5,-219 401.5,-219" />
<text text-anchor="middle" x="325" y="-197.2" font-family="Helvetica Neue" font-size="16.00">Always-on sensing</text>
<text text-anchor="middle" x="325" y="-179.2" font-family="Helvetica Neue" font-size="16.00">cascade</text>
</a>
</g>
</g>

