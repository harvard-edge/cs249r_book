<text xml:space="preserve" text-anchor="middle" x="323.71" y="-203.47" font-family="Helvetica Neue" font-size="16.00">Always-on sensing</text>
<text xml:space="preserve" text-anchor="middle" x="323.71" y="-183.97" font-family="Helvetica Neue" font-size="16.00">cascade</text>
</a>
</g>
</g>

