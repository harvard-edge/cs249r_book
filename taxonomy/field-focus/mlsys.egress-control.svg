<g id="concept-mlsys.egress-control" class="node">
<title>mlsys.egress-control</title>
<g id="a_concept-mlsys.egress-control"><a xlink:title="Restricting which external network destinations a workload or sandbox may contact, typically through default-deny allowlists, to block exfiltration and unintended remote actions.">
