<g id="concept-mlsys.impedance-force-control" class="node">
<title>mlsys.impedance-force-control</title>
<g id="a_concept-mlsys.impedance-force-control"><a xlink:title="Feedback control that regulates the relationship between motion and contact force, by commanding a virtual stiffness and damping or by tracking a force setpoint, so a robot can touch, push, and insert without the force spikes that pure position control produces at contact.">
<path fill="#f7f7f7" stroke="#88949d" stroke-width="1.15" d="M426.42,-207.81C426.42,-207.81 252.75,-207.81 252.75,-207.81 246.75,-207.81 240.75,-201.81 240.75,-195.81 240.75,-195.81 240.75,-163.53 240.75,-163.53 240.75,-157.53 246.75,-151.53 252.75,-151.53 252.75,-151.53 426.42,-151.53 426.42,-151.53 432.42,-151.53 438.42,-157.53 438.42,-163.53 438.42,-163.53 438.42,-195.81 438.42,-195.81 438.42,-201.81 432.42,-207.81 426.42,-207.81" />
<text xml:space="preserve" text-anchor="middle" x="339.58" y="-183.97" font-family="Helvetica Neue" font-size="16.00">Impedance and force</text>
<text xml:space="preserve" text-anchor="middle" x="339.58" y="-164.47" font-family="Helvetica Neue" font-size="16.00">control</text>
</a>
</g>
</g>

<g id="concept-mlsys.feedback-delay" class="node">
<title>mlsys.feedback-delay</title>
<g id="a_concept-mlsys.feedback-delay"><a xlink:title="The total delay around the sense-compute-communicate-actuate loop, which erodes a controller's stability margin and adds motion before any response can begin, so it must be budgeted end to end rather than stage by stage.">
