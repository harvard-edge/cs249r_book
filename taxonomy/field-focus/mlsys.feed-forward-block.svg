<g id="concept-mlsys.feed-forward-block" class="node">
<title>mlsys.feed-forward-block</title>
<g id="a_concept-mlsys.feed-forward-block"><a xlink:title="The per-position subnetwork of learned projections and a nonlinearity paired with attention in each Transformer block, which in most architectures holds the largest share of a dense model's parameters, executes as large matrix multiplications, and is the sublayer that mixture-of-experts routing replaces.">
