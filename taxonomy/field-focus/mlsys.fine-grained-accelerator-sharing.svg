<g id="concept-mlsys.fine-grained-accelerator-sharing" class="node">
<title>mlsys.fine-grained-accelerator-sharing</title>
<g id="a_concept-mlsys.fine-grained-accelerator-sharing"><a xlink:title="Scheduling co-located workloads on one accelerator in small units of a kernel, so latency-sensitive work can preempt background work quickly and interference stays bounded.">
