</a>
</g>
</g>

<g id="concept-mlsys.expert-capacity" class="node">
<title>mlsys.expert-capacity</title>
<g id="a_concept-mlsys.expert-capacity"><a xlink:title="The maximum number of tokens an expert processes per batch, set by a capacity factor; tokens beyond it are dropped or rerouted.">
