<g id="concept-mlsys.duty-cycling" class="node">
<title>mlsys.duty-cycling</title>
<g id="a_concept-mlsys.duty-cycling"><a xlink:title="Keeping a device in a low-power sleep state most of the time and waking it briefly to sense and infer, so average power is set by the active fraction and the cost of each wake-up.">
