<text text-anchor="middle" x="195.5" y="-153.2" font-family="Helvetica Neue" font-size="16.00">Duty cycling and sleep</text>
<text text-anchor="middle" x="195.5" y="-135.2" font-family="Helvetica Neue" font-size="16.00">states</text>
</a>
</g>
