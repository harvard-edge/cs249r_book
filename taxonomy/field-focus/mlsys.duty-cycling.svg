<g id="concept-mlsys.idle-dynamic-power" class="node">
<title>mlsys.idle-dynamic-power</title>
<g id="a_concept-mlsys.idle-dynamic-power"><a xlink:title="Separating power drawn by provisioned but idle hardware from the incremental power of active work, which decides how shared energy is attributed to workloads.">
