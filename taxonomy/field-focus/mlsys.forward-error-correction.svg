<g id="concept-mlsys.forward-error-correction" class="node">
<title>mlsys.forward-error-correction</title>
<g id="a_concept-mlsys.forward-error-correction"><a xlink:title="Adding redundant bits to transmitted data so the receiver corrects supported error patterns without retransmission, at the cost of coding overhead and decoding delay.">
