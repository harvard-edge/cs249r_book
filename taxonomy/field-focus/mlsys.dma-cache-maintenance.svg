<g id="concept-mlsys.dma-cache-maintenance" class="node">
<title>mlsys.dma-cache-maintenance</title>
<g id="a_concept-mlsys.dma-cache-maintenance"><a xlink:title="Cleaning and invalidating processor caches around DMA transfers on hardware without coherent DMA, with buffers aligned to cache lines, so a device and the CPU do not read stale copies of a shared buffer; each maintenance step adds latency.">
<path fill="#f7f7f7" stroke="#88949d" stroke-width="1.15" d="M287,-36C287,-36 83,-36 83,-36 77,-36 71,-30 71,-24 71,-24 71,-12 71,-12 71,-6 77,0 83,0 83,0 287,0 287,0 293,0 299,-6 299,-12 299,-12 299,-24 299,-24 299,-30 293,-36 287,-36" />
<text text-anchor="middle" x="185" y="-14.2" font-family="Helvetica Neue" font-size="16.00">DMA cache maintenance</text>
</a>
</g>
</g>

<g id="concept-mlsys.coherent-interconnect" class="node">
<title>mlsys.coherent-interconnect</title>
<g id="a_concept-mlsys.coherent-interconnect"><a xlink:title="A link protocol that lets hosts and devices share or pool memory with hardware coherence, such as CXL over a PCIe physical layer.">
