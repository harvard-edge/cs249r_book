<g id="concept-mlsys.request-timeout" class="node">
<title>mlsys.request-timeout</title>
<g id="a_concept-mlsys.request-timeout"><a xlink:title="A caller's time limit propagated to dependencies so they can stop work after the remaining budget expires, bounding caller wait and reducing abandoned work when cancellation is enforced.">
<path fill="#f7f7f7" stroke="#88949d" stroke-width="1.15" d="M223.42,-193.56C223.42,-193.56 37,-193.56 37,-193.56 31,-193.56 25,-187.56 25,-181.56 25,-181.56 25,-149.28 25,-149.28 25,-143.28 31,-137.28 37,-137.28 37,-137.28 223.42,-137.28 223.42,-137.28 229.42,-137.28 235.42,-143.28 235.42,-149.28 235.42,-149.28 235.42,-181.56 235.42,-181.56 235.42,-187.56 229.42,-193.56 223.42,-193.56" />
<text xml:space="preserve" text-anchor="middle" x="130.21" y="-169.72" font-family="Helvetica Neue" font-size="16.00">Timeouts and deadline</text>
<text xml:space="preserve" text-anchor="middle" x="130.21" y="-150.22" font-family="Helvetica Neue" font-size="16.00">propagation</text>
</a>
</g>
</g>

<g id="concept-mlsys.retry-backoff" class="node">
<title>mlsys.retry-backoff</title>
<g id="a_concept-mlsys.retry-backoff"><a xlink:title="Reissuing a failed request after increasing, typically jittered, delays and within a retry budget, so that transient faults recover without overloading dependencies.">
