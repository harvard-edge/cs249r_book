<g id="concept-mlsys.erasure-coding" class="node">
<title>mlsys.erasure-coding</title>
<g id="a_concept-mlsys.erasure-coding"><a xlink:title="Encoding stored data into data and parity fragments so it can be reconstructed after a bounded number of fragment losses, trading storage overhead against encoding and recovery work.">
