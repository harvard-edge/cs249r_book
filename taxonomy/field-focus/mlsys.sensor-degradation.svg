<g id="concept-mlsys.functional-insufficiency" class="node">
<title>mlsys.functional-insufficiency</title>
<g id="a_concept-mlsys.functional-insufficiency"><a xlink:title="Hazardous behavior arising without any fault, from limits of a specification or of a component's performance, such as perception errors under particular triggering conditions.">
