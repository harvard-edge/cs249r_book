<g id="concept-mlsys.sensor-degradation" class="node">
<title>mlsys.sensor-degradation</title>
<g id="a_concept-mlsys.sensor-degradation"><a xlink:title="Loss of sensor measurement fidelity under environmental or operating conditions, such as glare, rain, fog, dust, or a dirty lens, that degrades perception even when the sensing hardware has not failed.">
