<g id="concept-mlsys.rdma" class="node">
<title>mlsys.rdma</title>
<g id="a_concept-mlsys.rdma"><a xlink:title="Network transfers that read or write remote memory directly through the network interface without remote CPU involvement, giving low latency and high throughput.">
