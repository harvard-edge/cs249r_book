<text xml:space="preserve" text-anchor="middle" x="196.21" y="-189.22" font-family="Helvetica Neue" font-size="16.00">Fidelity-adaptive</text>
<text xml:space="preserve" text-anchor="middle" x="196.21" y="-169.72" font-family="Helvetica Neue" font-size="16.00">serving</text>
</a>
