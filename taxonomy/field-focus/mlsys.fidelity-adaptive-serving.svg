<g id="concept-mlsys.fidelity-adaptive-serving" class="node">
<title>mlsys.fidelity-adaptive-serving</title>
<g id="a_concept-mlsys.fidelity-adaptive-serving"><a xlink:title="Meeting a latency target under rising load by switching requests to a cheaper variant of the same model, such as a lower-precision copy, a pruned subnetwork, or fewer layers, so capacity is bought with controlled quality loss instead of queueing or rejection.">
