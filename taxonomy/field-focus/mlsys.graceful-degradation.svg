<text xml:space="preserve" text-anchor="middle" x="725.96" y="-308.72" font-family="Helvetica Neue" font-size="16.00">Fidelity-adaptive</text>
<text xml:space="preserve" text-anchor="middle" x="725.96" y="-289.22" font-family="Helvetica Neue" font-size="16.00">serving</text>
