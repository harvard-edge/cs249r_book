<title>mlsys.impedance-force-control</title>
<g id="a_concept-mlsys.impedance-force-control"><a xlink:title="Feedback control that regulates the relationship between motion and contact force, by commanding a virtual stiffness and damping or by tracking a force setpoint, so a robot can touch, push, and insert without the force spikes that pure position control produces at contact.">
