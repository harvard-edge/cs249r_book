<g id="concept-mlsys.on-chip-sram" class="node">
<title>mlsys.on-chip-sram</title>
<g id="a_concept-mlsys.on-chip-sram"><a xlink:title="Small, fast on-die storage, such as caches, shared memory, and register files, used to stage reused operands near compute units.">
