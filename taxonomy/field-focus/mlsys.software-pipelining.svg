<g id="concept-mlsys.async-data-movement" class="node">
<title>mlsys.async-data-movement</title>
<g id="a_concept-mlsys.async-data-movement"><a xlink:title="Transferring data into on-chip memory while independent computation proceeds, with explicit synchronization on the transfer's completion; hardware copy engines and producer-consumer warp roles are its implementations.">
