<g id="concept-mlsys.operating-domain" class="node">
<title>mlsys.operating-domain</title>
<g id="a_concept-mlsys.operating-domain"><a xlink:title="The declared set of conditions, covering environment, inputs, actors, and system state, within which a system is designed to perform and outside which its safety claims and evidence do not apply.">
