<g id="concept-mlsys.activation-sparsity" class="node">
<title>mlsys.activation-sparsity</title>
<g id="a_concept-mlsys.activation-sparsity"><a xlink:title="Skipping neurons, heads, or channels whose activations are predicted negligible for the current input, reducing per-token compute and weight reads at inference.">
