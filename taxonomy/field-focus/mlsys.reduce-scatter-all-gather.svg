<g id="concept-mlsys.reduce-scatter-all-gather" class="node">
<title>mlsys.reduce-scatter-all-gather</title>
<g id="a_concept-mlsys.reduce-scatter-all-gather"><a xlink:title="The complementary collectives in which each participant receives one reduced shard of the group's tensors (reduce-scatter) or the concatenation of every participant's shard (all-gather), the pair that moves sharded parameters and gradients in fully sharded training and composes into a bandwidth-optimal all-reduce.">
