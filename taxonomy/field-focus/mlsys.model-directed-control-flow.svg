<g id="concept-mlsys.model-directed-control-flow" class="node">
<title>mlsys.model-directed-control-flow</title>
<g id="a_concept-mlsys.model-directed-control-flow"><a xlink:title="A control structure in which model outputs select the next step, tool call, or stopping decision within runtime-enforced limits, increasing flexibility while making cost and behavior harder to predict and test.">
