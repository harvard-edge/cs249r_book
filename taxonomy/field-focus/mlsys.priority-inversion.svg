<g id="concept-mlsys.priority-inversion" class="node">
<title>mlsys.priority-inversion</title>
<g id="a_concept-mlsys.priority-inversion"><a xlink:title="A high-priority task blocked on a resource held by a lower-priority task while a medium-priority task preempts the holder, so the high-priority task's blocking time is unbounded and can exceed its deadline unless the scheduler bounds it.">
<path fill="#f7f7f7" stroke="#88949d" stroke-width="1.15" d="M340.17,-159.81C340.17,-159.81 201.75,-159.81 201.75,-159.81 195.75,-159.81 189.75,-153.81 189.75,-147.81 189.75,-147.81 189.75,-135.03 189.75,-135.03 189.75,-129.03 195.75,-123.03 201.75,-123.03 201.75,-123.03 340.17,-123.03 340.17,-123.03 346.17,-123.03 352.17,-129.03 352.17,-135.03 352.17,-135.03 352.17,-147.81 352.17,-147.81 352.17,-153.81 346.17,-159.81 340.17,-159.81" />
<text xml:space="preserve" text-anchor="middle" x="270.96" y="-135.97" font-family="Helvetica Neue" font-size="16.00">Priority inversion</text>
</a>
</g>
</g>

<g id="concept-mlsys.feedback-delay" class="node">
<title>mlsys.feedback-delay</title>
<g id="a_concept-mlsys.feedback-delay"><a xlink:title="The total delay around the sense-compute-communicate-actuate loop, which erodes a controller's stability margin and adds motion before any response can begin, so it must be budgeted end to end rather than stage by stage.">
