<title>mlsys.in-doubt-action</title>
<g id="a_concept-mlsys.in-doubt-action"><a xlink:title="An external action whose outcome is unknown after dispatch, requiring reconciliation or retry-safe endpoint semantics before recovery chooses whether to repeat or skip it.">
