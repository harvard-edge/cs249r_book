<g id="concept-mlsys.checkpoint-interval" class="node">
<title>mlsys.checkpoint-interval</title>
<g id="a_concept-mlsys.checkpoint-interval"><a xlink:title="The checkpoint period that minimizes expected lost time, balancing checkpoint write cost against expected rework, approximately the square root of twice the write cost times MTBF.">
<path fill="#f7f7f7" stroke="#88949d" stroke-width="1.15" d="M438,-175C438,-175 278,-175 278,-175 272,-175 266,-169 266,-163 266,-163 266,-133 266,-133 266,-127 272,-121 278,-121 278,-121 438,-121 438,-121 444,-121 450,-127 450,-133 450,-133 450,-163 450,-163 450,-169 444,-175 438,-175" />
<text text-anchor="middle" x="358" y="-153.2" font-family="Helvetica Neue" font-size="16.00">Optimal checkpoint</text>
<text text-anchor="middle" x="358" y="-135.2" font-family="Helvetica Neue" font-size="16.00">interval</text>
</a>
</g>
</g>

