<g id="concept-mlsys.ephemeral-sandbox" class="node">
<title>mlsys.ephemeral-sandbox</title>
<g id="a_concept-mlsys.ephemeral-sandbox"><a xlink:title="An isolated execution environment created per task from a snapshot, often copy-on-write, and destroyed or reset afterward so no state carries across tasks or tenants.">
