<g id="concept-mlsys.analytical-performance-model" class="node">
<title>mlsys.analytical-performance-model</title>
<g id="a_concept-mlsys.analytical-performance-model"><a xlink:title="A closed-form model composing compute, memory, communication, and queueing terms to predict a workload's time, memory, and cost on a configuration without running it.">
