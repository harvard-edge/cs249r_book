<title>mlsys.semi-supervised-learning</title>
<g id="a_concept-mlsys.semi-supervised-learning"><a xlink:title="Learning from a small labeled set together with a large unlabeled one, typically by training on confident model predictions for unlabeled examples or by enforcing consistent predictions under perturbation, which lowers labeling cost but can reinforce the model's own early mistakes.">
