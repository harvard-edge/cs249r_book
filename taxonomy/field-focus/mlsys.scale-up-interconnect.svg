<g id="concept-mlsys.scale-up-interconnect" class="node">
<title>mlsys.scale-up-interconnect</title>
<g id="a_concept-mlsys.scale-up-interconnect"><a xlink:title="High-bandwidth links and switches, such as NVLink-class fabrics, joining accelerators within a node or rack into one tightly coupled domain.">
