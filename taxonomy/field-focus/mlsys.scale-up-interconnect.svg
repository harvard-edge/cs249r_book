<g id="concept-mlsys.tensor-parallel" class="node">
<title>mlsys.tensor-parallel</title>
<g id="a_concept-mlsys.tensor-parallel"><a xlink:title="Partitioning a layer's tensors and operations across devices so each computes a slice, reducing per-device state while adding communication along the partitioned dimensions, usually within a fast scale-up domain.">
