<g id="concept-mlsys.residual-connection" class="node">
<title>mlsys.residual-connection</title>
<g id="a_concept-mlsys.residual-connection"><a xlink:title="A connection that adds a block's input, or a projection of it, to the block's output, so information and gradients can bypass the block and deep stacks stay trainable.">
