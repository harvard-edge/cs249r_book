<g id="concept-mlsys.parallel-simulation" class="node">
<title>mlsys.parallel-simulation</title>
<g id="a_concept-mlsys.parallel-simulation"><a xlink:title="Running many simulated robot environments concurrently, often batched on accelerators, so policy learning and data generation gather experience faster than physical collection.">
