</g>

<g id="concept-mlsys.structured-pruning" class="node">
<title>mlsys.structured-pruning</title>
<g id="a_concept-mlsys.structured-pruning"><a xlink:title="Pruning whole channels, filters, heads, or layers so that the remaining model stays dense and runs faster without sparse-execution support.">
