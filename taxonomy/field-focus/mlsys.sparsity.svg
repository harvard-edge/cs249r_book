<g id="concept-mlsys.pruning" class="node">
<title>mlsys.pruning</title>
<g id="a_concept-mlsys.pruning"><a xlink:title="Removing weights, neurons, channels, or other structures judged unimportant from a network, usually followed by fine-tuning to recover quality.">
