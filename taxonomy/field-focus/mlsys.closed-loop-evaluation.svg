<text xml:space="preserve" text-anchor="middle" x="161.83" y="-169.72" font-family="Helvetica Neue" font-size="16.00">evaluation</text>
</a>
</g>
</g>

<g id="concept-mlsys.sim-to-real" class="node">
<title>mlsys.sim-to-real</title>
<g id="a_concept-mlsys.sim-to-real"><a xlink:title="Transferring a policy trained in simulation to physical hardware, where differences in dynamics, sensing, contact, and timing can degrade behavior and motivate randomization, system identification, or adaptation on real experience.">
