<g id="concept-mlsys.closed-loop-evaluation" class="node">
<title>mlsys.closed-loop-evaluation</title>
<g id="a_concept-mlsys.closed-loop-evaluation"><a xlink:title="Evaluating a policy by letting its own actions determine subsequent observations, in simulation or deployment, rather than scoring its predictions against logged data.">
