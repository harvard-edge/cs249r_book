<g id="concept-mlsys.retry-backoff" class="node">
<title>mlsys.retry-backoff</title>
<g id="a_concept-mlsys.retry-backoff"><a xlink:title="Reissuing a failed request after increasing, typically jittered, delays and within a retry budget, so that transient faults recover without overloading dependencies.">
