<g id="concept-mlsys.circuit-breaker" class="node">
<title>mlsys.circuit-breaker</title>
<g id="a_concept-mlsys.circuit-breaker"><a xlink:title="A client-side guard that stops sending requests to a failing dependency after an error threshold and probes it before resuming traffic.">
