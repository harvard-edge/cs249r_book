<g id="concept-mlsys.priority-inversion" class="node">
<title>mlsys.priority-inversion</title>
<g id="a_concept-mlsys.priority-inversion"><a xlink:title="A high-priority task blocked on a resource held by a lower-priority task while a medium-priority task preempts the holder, so the high-priority task's blocking time is unbounded and can exceed its deadline unless the scheduler bounds it.">
