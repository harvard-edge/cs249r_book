<g id="concept-mlsys.priority-inversion" class="node">
<title>mlsys.priority-inversion</title>
<g id="a_concept-mlsys.priority-inversion"><a xlink:title="A high-priority task waiting on a resource held by a lower-priority task, which a medium-priority task then preempts, so the high-priority task misses its deadline unless priority inheritance or ceilings are used.">
