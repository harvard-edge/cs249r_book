<g id="concept-mlsys.watchdog-timer" class="node">
<title>mlsys.watchdog-timer</title>
<g id="a_concept-mlsys.watchdog-timer"><a xlink:title="A timer that a monitored component must refresh within a deadline or window; expiry triggers a defined safe response such as reset or revoking control authority.">
