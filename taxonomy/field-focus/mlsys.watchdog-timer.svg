</a>
</g>
</g>

<g id="concept-mlsys.feedback-delay" class="node">
<title>mlsys.feedback-delay</title>
<g id="a_concept-mlsys.feedback-delay"><a xlink:title="The total delay around the sense-compute-communicate-actuate loop, which erodes a controller's stability margin and adds motion before any response can begin, so it must be budgeted end to end rather than stage by stage.">
