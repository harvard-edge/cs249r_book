</a>
</g>
</g>

<g id="concept-mlsys.tree-allreduce" class="node">
<title>mlsys.tree-allreduce</title>
<g id="a_concept-mlsys.tree-allreduce"><a xlink:title="All-reduce schedules over trees or hierarchical groups, with latency logarithmic in participants, suited to small messages and multi-level networks.">
