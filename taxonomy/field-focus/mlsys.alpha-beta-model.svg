<g id="concept-mlsys.alpha-beta-model" class="node">
<title>mlsys.alpha-beta-model</title>
<g id="a_concept-mlsys.alpha-beta-model"><a xlink:title="A cost model estimating message time as a fixed latency term plus message size times a per-byte cost, used to compare collective algorithms.">
