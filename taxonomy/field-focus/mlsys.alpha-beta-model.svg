<text text-anchor="middle" x="225.5" y="-274.2" font-family="Helvetica Neue" font-size="16.00">communication model</text>
</a>
</g>
</g>

<g id="concept-mlsys.ring-allreduce" class="node">
<title>mlsys.ring-allreduce</title>
<g id="a_concept-mlsys.ring-allreduce"><a xlink:title="An all-reduce performed as reduce-scatter then all-gather around a ring, bandwidth-optimal for large messages but with latency linear in participants.">
