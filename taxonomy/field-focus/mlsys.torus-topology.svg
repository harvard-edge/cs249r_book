<g id="concept-mlsys.torus-topology" class="node">
<title>mlsys.torus-topology</title>
<g id="a_concept-mlsys.torus-topology"><a xlink:title="A fabric in which accelerator nodes form a multidimensional grid with wraparound links to fixed neighbors rather than tiers of switches, so neighbor and ring traffic can run at link rate while global exchanges are routed hop by hop with lower bisection bandwidth that depends on dimensions, routing, and contention.">
<path fill="#f7f7f7" stroke="#88949d" stroke-width="1.15" d="M342.67,-345.09C342.67,-345.09 223,-345.09 223,-345.09 217,-345.09 211,-339.09 211,-333.09 211,-333.09 211,-320.31 211,-320.31 211,-314.31 217,-308.31 223,-308.31 223,-308.31 342.67,-308.31 342.67,-308.31 348.67,-308.31 354.67,-314.31 354.67,-320.31 354.67,-320.31 354.67,-333.09 354.67,-333.09 354.67,-339.09 348.67,-345.09 342.67,-345.09" />
<text xml:space="preserve" text-anchor="middle" x="282.83" y="-321.25" font-family="Helvetica Neue" font-size="16.00">Torus topology</text>
</a>
</g>
</g>

