</a>
</g>
</g>

<g id="concept-mlsys.cross-stack-profiling" class="node">
<title>mlsys.cross-stack-profiling</title>
<g id="a_concept-mlsys.cross-stack-profiling"><a xlink:title="Profiling that correlates timestamped events and calling contexts from model code, frameworks, native libraries, and accelerator kernels, so that device time and stalls can be attributed to the operations that launched them.">
