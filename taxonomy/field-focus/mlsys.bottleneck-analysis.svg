<text xml:space="preserve" text-anchor="middle" x="491.71" y="-331" font-family="Helvetica Neue" font-size="16.00">Cross-stack profiling</text>
</a>
</g>
</g>

<g id="concept-mlsys.hardware-performance-counters" class="node">
<title>mlsys.hardware-performance-counters</title>
<g id="a_concept-mlsys.hardware-performance-counters"><a xlink:title="On-chip event counters, such as cycles, issued instructions, cache misses, bytes moved, and active compute units, that profilers sample to compute achieved bandwidth and arithmetic rate and to attribute stalls to their cause rather than to elapsed time alone.">
