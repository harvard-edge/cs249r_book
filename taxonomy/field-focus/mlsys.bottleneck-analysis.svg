<g id="concept-mlsys.bound-regime" class="node">
<title>mlsys.bound-regime</title>
<g id="a_concept-mlsys.bound-regime"><a xlink:title="Classifying a kernel or phase by what limits it: the roofline's arithmetic ceiling, its bandwidth ceiling, or, for operations too small to approach either, fixed per-operation overhead, indicating whether more throughput, more bandwidth, or fewer and larger operations would help.">
