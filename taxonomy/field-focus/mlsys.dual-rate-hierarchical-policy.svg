<title>mlsys.dual-rate-hierarchical-policy</title>
<g id="a_concept-mlsys.dual-rate-hierarchical-policy"><a xlink:title="Splitting a robot policy into a slow high-level model that sets goals or latent commands and a fast low-level controller that tracks them at control rate, so large-model latency does not set the control loop's rate.">
