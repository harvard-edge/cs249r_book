<g id="concept-mlsys.accelerator-execution-architecture" class="node">
<title>mlsys.accelerator-execution-architecture</title>
<g id="a_concept-mlsys.accelerator-execution-architecture"><a xlink:title="Organization of arithmetic units, execution lanes or threads, scheduling resources, and local storage that determines how supported operations run. SIMD/SIMT, matrix units, and systolic arrays are distinct examples.">
