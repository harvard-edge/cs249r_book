</a>
</g>
</g>

<g id="concept-mlsys.group-relative-policy-optimization" class="node">
<title>mlsys.group-relative-policy-optimization</title>
<g id="a_concept-mlsys.group-relative-policy-optimization"><a xlink:title="A policy-gradient method that scores each sampled response against the mean reward of a group of responses to the same prompt, removing the learned critic at the cost of generating several rollouts per prompt.">
