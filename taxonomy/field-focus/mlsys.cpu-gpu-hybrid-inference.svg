<g id="concept-mlsys.cpu-gpu-hybrid-inference" class="node">
<title>mlsys.cpu-gpu-hybrid-inference</title>
<g id="a_concept-mlsys.cpu-gpu-hybrid-inference"><a xlink:title="Splitting inference so the host CPU computes some operations, such as attention or rarely active neurons, from host memory when model or KV state exceeds accelerator memory.">
