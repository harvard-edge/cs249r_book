<g id="concept-mlsys.metastable-failure" class="node">
<title>mlsys.metastable-failure</title>
<g id="a_concept-mlsys.metastable-failure"><a xlink:title="A state in which a transient trigger, such as a load spike or slowdown, starts a self-sustaining loop of retries, cache misses, or timeouts that keeps a system overloaded after the trigger is gone.">
<path fill="#f7f7f7" stroke="#88949d" stroke-width="1.15" d="M261.5,-36C261.5,-36 114.5,-36 114.5,-36 108.5,-36 102.5,-30 102.5,-24 102.5,-24 102.5,-12 102.5,-12 102.5,-6 108.5,0 114.5,0 114.5,0 261.5,0 261.5,0 267.5,0 273.5,-6 273.5,-12 273.5,-12 273.5,-24 273.5,-24 273.5,-30 267.5,-36 261.5,-36" />
<text text-anchor="middle" x="188" y="-14.2" font-family="Helvetica Neue" font-size="16.00">Metastable failure</text>
</a>
</g>
</g>

