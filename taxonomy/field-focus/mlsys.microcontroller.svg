<g id="concept-mlsys.intermittent-computing" class="node">
<title>mlsys.intermittent-computing</title>
<g id="a_concept-mlsys.intermittent-computing"><a xlink:title="Running inference on devices powered by harvested energy that lose power unpredictably, which requires checkpointing progress to nonvolatile memory so computation resumes rather than restarts.">
