<g id="concept-mlsys.microcontroller" class="node">
<title>mlsys.microcontroller</title>
<g id="a_concept-mlsys.microcontroller"><a xlink:title="A low-power processor with on-chip flash and kilobytes to a few megabytes of SRAM, typically without an operating system or virtual memory.">
