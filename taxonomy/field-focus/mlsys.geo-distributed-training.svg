<g id="concept-mlsys.geo-distributed-training" class="node">
<title>mlsys.geo-distributed-training</title>
<g id="a_concept-mlsys.geo-distributed-training"><a xlink:title="Planning one training job across accelerators in several datacenters by placing the low-communication parallelism dimension (pipeline stages, local-SGD replicas, or asynchronous hierarchies) on the long, narrow inter-site links and the bandwidth-hungry dimensions inside each site, and scheduling the WAN transfers against its latency and bandwidth.">
