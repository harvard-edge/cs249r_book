<text xml:space="preserve" text-anchor="middle" x="301.96" y="-174.97" font-family="Helvetica Neue" font-size="16.00">Weight-only</text>
<text xml:space="preserve" text-anchor="middle" x="301.96" y="-155.47" font-family="Helvetica Neue" font-size="16.00">quantization</text>
</a>
</g>
</g>

