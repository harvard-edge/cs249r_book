<g id="concept-mlsys.weight-only-quantization" class="node">
<title>mlsys.weight-only-quantization</title>
<g id="a_concept-mlsys.weight-only-quantization"><a xlink:title="Storing weights at low bit width while computing in higher-precision activations, cutting memory traffic for bandwidth-bound decoding, with error-compensating or activation-aware rounding.">
