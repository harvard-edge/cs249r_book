<title>mlsys.recovery-objectives</title>
<g id="a_concept-mlsys.recovery-objectives"><a xlink:title="Stated limits on how long restoring service may take (RTO) and how far recovered state may lag the state before the failure (RPO), which constrain checkpointing, replication, and failover design.">
