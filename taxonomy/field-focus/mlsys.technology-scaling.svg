<g id="a_concept-mlsys.technology-scaling"><a xlink:title="The historical trends by which transistor density doubled on a steady cadence while, for a long period, power density stayed constant as transistors shrank; the end of constant power density is why added transistors can no longer all be clocked at once, pushing designs toward parallelism and specialization.">
