<g id="concept-mlsys.dataset-shuffling" class="node">
<title>mlsys.dataset-shuffling</title>
<g id="a_concept-mlsys.dataset-shuffling"><a xlink:title="Randomizing the order in which training examples are visited, by a full permutation or an approximate buffered shuffle over sharded files, trading the randomness that stochastic optimization assumes against the sequential reads that storage delivers cheaply.">
