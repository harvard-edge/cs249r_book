<g id="concept-mlsys.rl-training-colocation" class="node">
<title>mlsys.rl-training-colocation</title>
<g id="a_concept-mlsys.rl-training-colocation"><a xlink:title="Whether rollout generation and policy updates share the same accelerators, alternating phases and re-sharding weights in place, or run on separate pools that exchange weights and samples, trading idle time within each phase against transfer cost and policy staleness.">
