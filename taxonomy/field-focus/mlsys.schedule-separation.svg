<g id="concept-mlsys.schedule-separation" class="node">
<title>mlsys.schedule-separation</title>
<g id="a_concept-mlsys.schedule-separation"><a xlink:title="A compiler design in which what an operator computes is written once and how it runs, meaning loop order, tiling, vectorization, unrolling, memory placement, and parallel mapping, is a separate composable schedule, so the same algorithm can be retargeted and tuned without changing its semantics.">
