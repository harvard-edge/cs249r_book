</a>
</g>
</g>

<g id="concept-mlsys.capability-based-security" class="node">
<title>mlsys.capability-based-security</title>
<g id="a_concept-mlsys.capability-based-security"><a xlink:title="Authorization in which holding an unforgeable, scoped reference grants a specific right that can be delegated with attenuated scope and later revoked.">
