<g id="concept-mlsys.confused-deputy" class="node">
<title>mlsys.confused-deputy</title>
<g id="a_concept-mlsys.confused-deputy"><a xlink:title="A security failure in which a component uses its legitimate authority for an untrusted party's purpose because it does not distinguish the requester's authority from its own.">
