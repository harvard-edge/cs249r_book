<text text-anchor="middle" x="309" y="-313.2" font-family="Helvetica Neue" font-size="16.00">delegated authority</text>
</a>
</g>
</g>

<g id="concept-mlsys.least-privilege" class="node">
<title>mlsys.least-privilege</title>
<g id="a_concept-mlsys.least-privilege"><a xlink:title="Granting each component or actor only the permissions its task requires, for only as long as it requires them.">
