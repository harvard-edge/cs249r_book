<g id="concept-mlsys.collective-algorithm-selection" class="node">
<title>mlsys.collective-algorithm-selection</title>
<g id="a_concept-mlsys.collective-algorithm-selection"><a xlink:title="Choosing, per call, among collective algorithms (ring, tree, switch-offloaded) and wire protocols by message size, participant count, and link hierarchy, to minimize latency for small messages and maximize bandwidth for large ones.">
