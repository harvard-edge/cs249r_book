<g id="concept-mlsys.communication-intensity" class="node">
<title>mlsys.communication-intensity</title>
<g id="a_concept-mlsys.communication-intensity"><a xlink:title="The bytes a parallel plan must exchange per unit of local arithmetic, which, set against link bandwidth and the accelerator's FLOP rate, says whether a stage is communication-bound in the same way arithmetic intensity says whether a kernel is memory-bound.">
