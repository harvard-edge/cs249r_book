<g id="concept-mlsys.attention-ffn-disaggregation" class="node">
<title>mlsys.attention-ffn-disaggregation</title>
<g id="a_concept-mlsys.attention-ffn-disaggregation"><a xlink:title="Running attention layers and the feed-forward or expert layers on separate accelerator pools during decode, so memory-bound attention over the KV cache and compute-bound expert matmuls are each batched and provisioned on hardware suited to them, at the cost of streaming activations between pools at every layer.">
