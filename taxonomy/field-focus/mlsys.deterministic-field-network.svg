<g id="concept-mlsys.timing-jitter" class="node">
<title>mlsys.timing-jitter</title>
<g id="a_concept-mlsys.timing-jitter"><a xlink:title="Variation in the period or completion time of a periodic sensing, inference, or control task, which degrades a controller designed for a fixed sample interval even when every deadline is met, so real-time budgets bound the spread of completion times and not only their worst case.">
