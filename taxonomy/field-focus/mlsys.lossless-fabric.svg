<g id="concept-mlsys.lossless-fabric" class="node">
<title>mlsys.lossless-fabric</title>
<g id="a_concept-mlsys.lossless-fabric"><a xlink:title="A network that avoids packet drops through credit-based or priority flow control, as RDMA transports expect, at the risk of head-of-line blocking.">
