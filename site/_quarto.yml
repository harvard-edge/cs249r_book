# =============================================================================
# UNIFIED SITE (mlsysbook.ai)
# =============================================================================
# Single Quarto project for: landing page, about, community, newsletter.
# Build:  cd site && quarto render
# Output: site/_build/  → deploy to https://mlsysbook.ai/
# =============================================================================

project:
  type: website
  output-dir: _build
  pre-render: scripts/build_stats.py
  post-render:
    - ../shared/scripts/inject_stats.py
    - scripts/build_adopters.py
    - scripts/fingerprint_assets.py
  resources:
    - "assets/**"
    - "robots.txt"

website:
  title: "Machine Learning Systems"
  description: "The definitive four-volume open textbook series on Machine Learning Systems by Prof. Vijay Janapa Reddi (Harvard University & MIT Press). Free to read online: Foundations, Distributed Scale, Agentic AI, and Physical AI."
  site-url: https://mlsysbook.ai/

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    title: "Machine Learning Systems: The AI Engineering Textbook"
    description: "Four-volume open textbook series on Machine Learning Systems: Foundations & Edge (Vol I), Distributed Scale (Vol II), Agentic Systems (Vol III), and Physical AI (Vol IV). Harvard University & MIT Press."
    image: https://mlsysbook.ai/vol1/covers/cover-hardcover-book-vol1.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    title: "Machine Learning Systems: The AI Engineering Textbook"
    description: "Four-volume open textbook series on Machine Learning Systems: Foundations, Distributed Scale, Agentic AI, and Physical AI. Harvard University & MIT Press."
    image: https://mlsysbook.ai/vol1/covers/cover-hardcover-book-vol1.png
    creator: "@profvjreddi"

  google-analytics:
    tracking-id: "G-M21L0CBCVN"
    anonymize-ip: true
    version: 4

  search:
    keyboard-shortcut: ["shift+?"]

  page-navigation: false
  back-to-top-navigation: false

  navbar:
    logo: assets/logo-seas-shield.png
    search: true
    title: "Machine Learning Systems"
    left:
      - text: "Home"
        menu:
          - icon: house
            text: "Landing Page"
            href: ./index.qmd
          - text: "---"
          - icon: bullseye
            text: "Mission"
            href: about/index.qmd
          - icon: person-lines-fill
            text: "People"
            href: about/people.qmd
          - icon: people
            text: "Contributors"
            href: about/contributors.qmd
          - text: "---"
          - icon: globe
            text: "Community"
            href: community/index.qmd
          - icon: calendar-event
            text: "Events"
            href: community/events.qmd
          - icon: envelope
            text: "Newsletter"
            href: https://mlsysbook.ai/newsletter/

  sidebar: []

metadata-files:
  - ../shared/config/navbar-common.yml
  - ../shared/config/footer-site.yml
  - config/announcement.yml

format:
  html:
    toc: false
    theme:
      light:
        - default
        - ../shared/styles/style-site.scss
      dark:
        - default
        - ../shared/styles/style-site.scss
        - ../shared/styles/dark-mode-site.scss
    respect-user-color-scheme: true
    include-in-header:
      - file: ../shared/config/site-head.html
      - text: |
          <meta name="theme-color" content="#A51C30">
          <script src="/assets/scripts/subscribe-modal.js" defer></script>
