# ============================================================================
# Where the book is taught — Machine Learning Systems
# ============================================================================
# Powers community/courses.html and the "Taught at" ticker on the landing page
# (both generated by scripts/build_adopters.py at post-render).
#
# Listing rule: every entry is verifiable. Either a public course page,
# syllabus, or course repository names the book (kind: course / workshop),
# or the instructor is named as an adopter in the Vol. I acknowledgments
# (kind: acknowledged). Leads without either stay off this file.
#
# Instructor names are left out on purpose; list them only with consent.
#
# Logos: community/assets/images/adopters/<domain>.png (the school's site icon).
# To add a school: copy a block. Instructors can also self-report through the
# "Add your course" issue template.
# ============================================================================

