    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 7
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Execution contract: graph and signatures, runtime/export identity, location, setup and repeated-work
    costs, reuse condition, required backward state, and unsupported paths.'
  student_goals:
  - Compare dispatch counts while holding arithmetic and payload fixed.
  - Compare total execution cost across reuse counts and recompilation assumptions.
  - Compare intermediate traffic and launches while preserving graph arithmetic.
  - Compare retained memory with repeated forward work, then verify required operands and exact gradient equality on the Lab 05 graph.
  - Compare native support, fallback cost, and unsupported execution for the same operator and shape.
  runtime_parts:
  - part: A
    title: Dispatch granularity
    question: Why can small operations waste the machine?
    goal: Compare dispatch counts while holding arithmetic and payload fixed.
    concept_ids:
    - v1_07_A
    coverage: implemented
    limitation: ''
    next: Next, investigate compilation reuse.
    artifact: A dispatch-count comparison with unchanged arithmetic and payload.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: B
    title: Compilation reuse
    question: When does compilation repay setup?
    goal: Compare total execution cost across reuse counts and recompilation assumptions.
    concept_ids:
    - v1_07_B
    coverage: implemented
    limitation: ''
    next: Next, investigate graph fusion.
    artifact: A reuse comparison accounting for compilation and recompilation cost.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: C
    title: Graph fusion
    question: What does fusion eliminate?
    goal: Compare intermediate traffic and launches while preserving graph arithmetic.
    concept_ids:
    - v1_07_A
    coverage: implemented
    limitation: ''
    next: Next, investigate saved activation state.
    artifact: A fusion comparison showing changed intermediate traffic and launches.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: D
    title: Saved activation state
    question: Which activations should remain stored?
    goal: Compare retained memory with repeated forward work, then verify required operands and exact gradient equality on the Lab 05 graph.
    concept_ids:
    - v1_07_C
    coverage: implemented
    limitation: ''
    next: Next, investigate runtime portability.
    artifact: A retained-state comparison with memory fit, repeated work, reverse traversal, missing-operand failure, and exact derivative equality after regeneration.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: E
    title: Runtime portability
    question: Can the runtime execute the actual graph?
    goal: Compare native support, fallback cost, and unsupported execution for the same operator and shape.
    concept_ids:
    - v1_07_D
    coverage: implemented
    limitation: ''
    next: Next, defend one decision using your saved comparisons in Synthesis.
    artifact: An operator/shape comparison with native support, fallback transfers, and unsupported states.
    scope: Controlled chapter reference; not a deployment measurement.
