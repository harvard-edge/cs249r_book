lab_concept_map:
  schema_version: 1
  lab_id: v1_07
  chapter: 7
  title: Make the graph executable
  source_notebook: labs/vol1/lab_07_ml_frameworks.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/07_frameworks/frameworks_concepts.yml
  chapter_goal: Choose an execution plan whose visibility, setup costs, backward state, and target support
    match the work.
  core_concepts:
  - id: v1_07_A
    title: Graph visibility, dispatch, and fusion
    source_concepts:
    - chapter: 7
      concept: Three framework problems
      concept_map: books/vol1/07_frameworks/frameworks_concepts.yml
    - chapter: 7
      concept: Eager, graph, and JIT execution
      concept_map: books/vol1/07_frameworks/frameworks_concepts.yml
    - chapter: 7
      concept: Dispatch overhead law
      concept_map: books/vol1/07_frameworks/frameworks_concepts.yml
    - chapter: 7
      concept: Kernel fusion
      concept_map: books/vol1/07_frameworks/frameworks_concepts.yml
    learning_claim: Fewer launches and fewer intermediate transfers are different mechanisms; neither
      proves that arithmetic disappeared.
    misconception: Fewer calls always mean fewer arithmetic operations.
    tradeoff: Graph visibility and fewer dispatches versus inspection flexibility and materialized boundaries.
    student_action: Compare eager dispatch, captured regions, and supported fusion while separating submission
      overhead from changed memory traffic.
    evidence_to_inspect: Dispatch and intermediate-traffic decomposition with held arithmetic.
    explanation_prompt: What changes when the same work is visible as a region rather than many calls?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Expose the graph
  - id: v1_07_B
    title: Compilation and the reuse horizon
    source_concepts:
    - chapter: 7
      concept: Compilation breakeven
      concept_map: books/vol1/07_frameworks/frameworks_concepts.yml
    - chapter: 7
      concept: Eager, graph, and JIT execution
      concept_map: books/vol1/07_frameworks/frameworks_concepts.yml
    learning_claim: A compiled plan can be faster per invocation and slower over the actual experiment
      or deployment horizon.
    misconception: A lower steady-state execution time repays compilation over any horizon.
    tradeoff: Upfront compilation versus repeated savings under signature changes and actual reuse.
    student_action: Vary the supported reuse horizon and signature churn for the same graph.
    evidence_to_inspect: Setup plus repeated-work totals under supported reuse and shape-signature changes.
    explanation_prompt: Will steady-state savings repay setup before the graph changes again?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Pay for compilation
  - id: v1_07_C
    title: Reverse-mode dependencies and saved state
    source_concepts:
    - chapter: 7
      concept: Reverse-mode autodiff
      concept_map: books/vol1/07_frameworks/frameworks_concepts.yml
    - chapter: 7
      concept: Saved forward state
      concept_map: books/vol1/07_frameworks/frameworks_concepts.yml
    learning_claim: Automatic differentiation manages dependencies; it does not remove them.
    misconception: Automatic differentiation removes forward-value dependencies.
    tradeoff: Retained forward state versus recomputation work and valid differentiation.
    student_action: Reuse the Lab 05 graph and inspect saved-value policies, reverse traversal, and recomputation
      consequences on the development host.
    evidence_to_inspect: Reverse traversal, required saved values, and a valid recomputation comparison.
    explanation_prompt: What must the runtime retain or regenerate for differentiation?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Automate the backward contract
  - id: v1_07_D
    title: Runtime portability and semantic integrity
    source_concepts:
    - chapter: 7
      concept: Three framework problems
      concept_map: books/vol1/07_frameworks/frameworks_concepts.yml
    learning_claim: Fallback has boundaries and costs. Deleting required preprocessing or postprocessing
      is a changed task, not a successful export.
    misconception: Successful development execution guarantees a deployable target graph.
    tradeoff: Target support or fallback versus footprint, transfer/materialization, and preserved task
      semantics.
    student_action: Compare native support, explicit partition/fallback, and rejected export on the same
      graph and shapes.
    evidence_to_inspect: Operator/shape coverage, fallback boundaries, footprint, and unavailable execution
      paths.
    explanation_prompt: Does every required operation have an executable path?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Reach the target
  primary_concept_dispositions:
  - concept: Three framework problems
    disposition: interactive
    lab_concepts:
    - v1_07_A
