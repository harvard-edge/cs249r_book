lab_concept_map:
  schema_version: 1
  lab_id: v1_02
  chapter: 2
  title: Where should the work live?
  source_notebook: labs/vol1/lab_02_system_paradigms.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/02_system_paradigms/system_paradigms_concepts.yml
  chapter_goal: Defend a conditional placement or an explicit hold by screening locality, capacity, operation,
    and partition obligations.
  core_concepts:
  - id: v1_02_A
    title: Locality lower bounds
    source_concepts:
    - chapter: 2
      concept: Data locality invariant
      concept_map: books/vol1/02_system_paradigms/system_paradigms_concepts.yml
    - chapter: 2
      concept: Physical walls set deployment tiers
      concept_map: books/vol1/02_system_paradigms/system_paradigms_concepts.yml
    learning_claim: A lower-bound failure rules a path out; a lower-bound pass does not validate the real
      path.
    misconception: More remote compute removes transmission and propagation.
    tradeoff: Additional remote or accelerator capability versus transfer, propagation where applicable,
      and interface overhead.
    student_action: Choose a supported payload, link, or host/device-transfer contrast. Compare the complete
      declared path with an ideal-processor bound; do not add WAN propagation to a same-host link.
    evidence_to_inspect: Complete-path components and an ideal-compute bound at the same declared interface.
    explanation_prompt: Can faster computation remove the transfer or propagation term that limits this
      path?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Find the locality boundary
  - id: v1_02_B
    title: Resource capacity versus throughput
    source_concepts:
    - chapter: 2
      concept: Silicon contract
      concept_map: books/vol1/02_system_paradigms/system_paradigms_concepts.yml
    - chapter: 2
      concept: Workload archetypes and lighthouses
      concept_map: books/vol1/02_system_paradigms/system_paradigms_concepts.yml
    learning_claim: A configuration that does not fit has no executable timing claim. More arithmetic
      cannot supply missing capacity.
    misconception: A faster processor repairs a capacity failure.
    tradeoff: Arithmetic, movement bandwidth, and storage/working capacity address different limits.
    student_action: Keep the task fixed and test resource-specific interventions; distinguish SRAM from
      flash on tiny endpoints and resident working state elsewhere.
    evidence_to_inspect: Separate memory pools and executable timing only for fitting configurations.
    explanation_prompt: Does the proposed resource change repair capacity, movement, or arithmetic?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Fit before speed
  - id: v1_02_C
    title: Service, energy, and sustained power
    source_concepts:
    - chapter: 2
      concept: Device energy budgets
      concept_map: books/vol1/02_system_paradigms/system_paradigms_concepts.yml
    - chapter: 2
      concept: Physical walls set deployment tiers
      concept_map: books/vol1/02_system_paradigms/system_paradigms_concepts.yml
    learning_claim: Turning the system off saves energy but can fail the mission; extra energy does not
      raise a sustained-power ceiling.
    misconception: A larger energy reserve repairs sustained-power and service failures.
    tradeoff: Reduced activity or increased allowance versus useful service and sustained-power constraints.
    student_action: Change a supported operating policy or mission allowance while displaying useful service,
      mission energy, and sustained power separately. For powered endpoints, use node operating allowances
      rather than inventing a battery.
    evidence_to_inspect: Useful-service, energy, and sustained-power outcomes with live and pinned conditions
      distinct.
    explanation_prompt: Does the energy-saving policy still provide the required service?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Keep useful operation
  - id: v1_02_D
    title: Feasibility screening and partition obligations
    source_concepts:
    - chapter: 2
      concept: Screen then cost
      concept_map: books/vol1/02_system_paradigms/system_paradigms_concepts.yml
    - chapter: 2
      concept: Hybrid partitioning
      concept_map: books/vol1/02_system_paradigms/system_paradigms_concepts.yml
    learning_claim: Filtered or partitioned paths add local work, task-retention evidence, version dependencies,
      and data-handling obligations.
    misconception: The cheapest path wins before task, privacy, and resource gates are checked.
    tradeoff: Locality and partition benefits versus data permission, task retention, synchronization,
      and complete lifecycle costs.
    student_action: Show the inherited saved conditions, vary one connection or data-permission requirement,
      then explicitly select placement or hold and a rejected alternative.
    evidence_to_inspect: Candidate gates, inherited saved operating case, retained/rejected choices, and
      unresolved costs.
    explanation_prompt: Which paths survive a changed requirement, and what new obligations do survivors
      create?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Make the placement decision
  primary_concept_dispositions:
  - concept: Silicon contract
    disposition: interactive
    lab_concepts:
    - v1_02_B
  - concept: Workload archetypes and lighthouses
    disposition: interactive
    lab_concepts:
    - v1_02_B
  - concept: Physical walls set deployment tiers
    disposition: interactive
    lab_concepts:
    - v1_02_A
    - v1_02_C
  - concept: Device energy budgets
    disposition: interactive
    lab_concepts:
    - v1_02_C
  - concept: Data locality invariant
    disposition: interactive
    lab_concepts:
    - v1_02_A
  - concept: Screen then cost
    disposition: interactive
    lab_concepts:
    - v1_02_D
  - concept: Hybrid partitioning
    disposition: interactive
    lab_concepts:
    - v1_02_D
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 2
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 2
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 2
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 2
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Placement record: saved operating case, survivors and exclusions, conditional placement or
    hold, partition dependencies, unresolved target measurements and complete-cost boundary.'
  student_goals:
  - Compare remote paths using communication and execution components.
  - Separate resource fit from execution time when evaluating a configuration.
  - Compare service, energy, and sustained-power requirements independently.
  - Defend a placement or hold using explicit gates and unresolved evidence.
  runtime_parts:
  - part: A
    title: Locality
    question: What part of a remote path can the selected change affect?
    goal: Compare a controlled path change while preserving the task and boundary.
    concept_ids:
    - v1_02_A
    coverage: implemented
    limitation: Controlled teaching study; not a measurement of the named deployment project.
    next: Investigate the local resource demands before choosing where to execute.
    artifact: Two remote-path decompositions with changed and unchanged terms.
    scope: Controlled teaching study; not a measurement of the named deployment project.
  - part: B
    title: Resources
    question: Does the configuration fit, and what determines its time?
    goal: Inspect capacity separately from the timing of executable cases.
    concept_ids:
    - v1_02_B
    coverage: implemented
    limitation: Controlled teaching study; not a measurement of the named deployment project.
    next: Check whether fitting and running also support useful operation.
    artifact: Required and available capacity, plus timing only for executable cases.
    scope: Controlled teaching study; not a measurement of the named deployment project.
  - part: C
    title: Operation
    question: Which operating choice meets the supplied service and resource requirements?
    goal: Compare live and pinned operating points against the separate gates.
    concept_ids:
    - v1_02_C
    coverage: implemented
    limitation: Controlled teaching study; not a measurement of the named deployment project.
    next: Combine the requirements into a conditional placement decision.
    artifact: Two operating points with service, energy, and sustained-power gates.
    scope: Controlled teaching study; not a measurement of the named deployment project.
  - part: D
    title: Placement
    question: Which placement survives the supplied gates, and what is still unknown?
    goal: Screen candidates before comparing matched costs and partition obligations.
    concept_ids:
    - v1_02_D
    coverage: implemented
    limitation: Controlled teaching study; not a measurement of the named deployment project.
    next: Explain the saved comparison and carry unresolved requirements into lifecycle planning.
    artifact: A saved placement contrast with excluded candidates, chosen or hold decision, and unknown
      gates.
    scope: Controlled teaching study; not a measurement of the named deployment project.
  prerequisites:
  - Read System Paradigms on locality, resources, operating budgets, and placement.
  narrative:
    previously: A supplied controlled testbench; earlier project results are not assumed valid.
    submission: One placement discussion using four saved contrasts and their attached interpretations.
      State your conditional choice or hold, rejected alternative, mechanism, missing target evidence, and
      revisit condition.
