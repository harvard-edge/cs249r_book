lab_concept_map:
  schema_version: 1
  lab_id: v1_11
  chapter: 11
  title: A faster kernel must survive the whole path
  source_notebook: labs/vol1/lab_11_hw_accel.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
  chapter_goal: Choose a legal mapping and resource intervention with counted traffic and an explained
    application-level consequence.
  core_concepts:
  - id: v1_11_A
    title: Applicable hardware ceilings
    source_concepts:
    - chapter: 11
      concept: Accelerator anatomy
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    - chapter: 11
      concept: Matching primitives to execution units
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    - chapter: 11
      concept: Roofline and ridge point
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    - chapter: 11
      concept: Operand-supply hierarchy
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    learning_claim: The limiting regime belongs to a workload and interface, not permanently to a model
      family.
    misconception: Higher peak arithmetic proportionally accelerates every kernel.
    tradeoff: Compute, supply, or reuse improvement versus the actual workload/interface bound.
    student_action: Compare arithmetic, bandwidth, and supported reuse interventions on the relevant roofline.
    evidence_to_inspect: Relevant roofline ceilings and a supported resource counterfactual.
    explanation_prompt: Which resource improvement changes this workload bound?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Move the useful ceiling
  - id: v1_11_B
    title: Dataflow, traffic, and movement energy
    source_concepts:
    - chapter: 11
      concept: Stationary dataflows
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    - chapter: 11
      concept: Energy ladder
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    learning_claim: Avoiding one category of traffic can increase another.
    misconception: Keeping one operand stationary reduces every type of movement.
    tradeoff: Reduced traffic for one operand versus increased activation or partial-sum movement and
      energy.
    student_action: Step through supported stationary schedules and count weight, activation, and partial-sum
      movement with its energy consequences.
    evidence_to_inspect: Operand-residency trace and separately counted traffic and movement energy.
    explanation_prompt: Which operand should remain resident?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Choose what stays
  - id: v1_11_C
    title: Tiling legality and effective reuse
    source_concepts:
    - chapter: 11
      concept: Tiling
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    - chapter: 11
      concept: Operand-supply hierarchy
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    learning_claim: Reuse competes with state, alignment, and fringe work; illegal configurations have
      no valid runtime.
    misconception: The largest tile always gives the best legal mapping.
    tradeoff: Tile reuse versus buffer/accumulator capacity, alignment, and fringe work.
    student_action: Grow a supported tile, cross live-buffer/accumulator capacity, and compare an off-grid
      shape or aligned alternative.
    evidence_to_inspect: Live tile buffers, wide accumulators, fringe work, and legal/no-fit cases.
    explanation_prompt: Does the largest tile fit and use the machine effectively?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Find a legal tile
  - id: v1_11_D
    title: Kernel gains and the complete path
    source_concepts:
    - chapter: 11
      concept: Amdahl's law
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    - chapter: 11
      concept: Matching primitives to execution units
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    learning_claim: An isolated kernel gain is capped by untouched work and may move the bottleneck elsewhere.
    misconception: A kernel speedup is the complete application speedup.
    tradeoff: Kernel acceleration versus untouched stages, fallback, and end-to-end benefit.
    student_action: Carry the selected legal intervention through decode, host work, transfers, kernel,
      and postprocessing; preserve fallbacks.
    evidence_to_inspect: Complete-path stage comparison preserving host/transfer/fallback and task identity.
    explanation_prompt: How much of the end-to-end path did the improvement actually change?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Return to the application
  primary_concept_dispositions:
  - concept: Accelerator anatomy
    disposition: interactive
    lab_concepts:
    - v1_11_A
  - concept: Matching primitives to execution units
    disposition: interactive
    lab_concepts:
    - v1_11_A
    - v1_11_D
  - concept: Operand-supply hierarchy
    disposition: interactive
    lab_concepts:
    - v1_11_A
    - v1_11_C
  - concept: Energy ladder
    disposition: interactive
    lab_concepts:
    - v1_11_B
  - concept: Amdahl's law
    disposition: interactive
    lab_concepts:
    - v1_11_D
  - concept: Roofline and ridge point
    disposition: interactive
    lab_concepts:
    - v1_11_A
  - concept: Stationary dataflows
    disposition: interactive
    lab_concepts:
    - v1_11_B
  - concept: Tiling
    disposition: interactive
    lab_concepts:
    - v1_11_C
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 11
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 11
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 11
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 11
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Mapping record: target/runtime assumptions, legal tile or dataflow, counted traffic, resource
    regime, full-path consequence, and remaining profiling evidence.'

  student_goals:
  - "Identify which hardware resource bounds a fixed workload."
  - "Compare reuse and fusion while checking local capacity and traffic."
  - "Check native support, padding, and fallback before claiming acceleration."
  - "Choose a feasible accelerator using complete-path consequences."
  runtime_parts:
  - part: "A"
    title: "Applicable ceilings"
    question: "When does changing arithmetic or bandwidth help?"
    goal: "Identify which ceiling a supported intervention changes for a fixed workload."
    next: "Test whether a legal tile and resident-operand choice change the traffic that constrains this workload."
    concept_ids: ["v1_11_A"]
    coverage: "implemented"
    limitation: ""
  - part: "B"
    title: "Capacity and reuse"
    question: "How much reuse fits locally?"
    goal: "Compare counted movement and reuse against local capacity."
    next: "A tile that fits still needs supported operations, precision, and alignment. Inspect the execution contract next."
    concept_ids: ["v1_11_B", "v1_11_C"]
    coverage: "implemented"
    limitation: "Stationary schedules use an explicit one-tile-resident analytical model. Energy counts DRAM transfers only; a bounded trace excerpt accompanies exact complete-schedule counters."
  - part: "C"
    title: "Executable contract"
    question: "Can the specialized unit execute this workload?"
    goal: "Check whether shape, operation, and precision satisfy the execution contract."
    next: "Carry the actual native, padded, or fallback kernel into the complete application path."
    concept_ids: ["v1_11_A", "v1_11_C"]
    coverage: "partial"
    limitation: "Operation, precision, padding, and fallback are compared here; Part B separately counts wide accumulators and tile legality. This is not a measured vendor runtime."
  - part: "D"
    title: "Complete path"
    question: "How much local speedup reaches the application?"
    goal: "Quantify how untouched application stages limit a local acceleration."
    next: "Compare feasible complete-path candidates under the stated objective and resource budgets."
    concept_ids: ["v1_11_D"]
    coverage: "implemented"
    limitation: ""
  - part: "E"
    title: "Constrained choice"
    question: "Which feasible candidate serves the chosen objective?"
    goal: "Select or reject a candidate using feasibility before the chosen objective."
    next: "Defend the accelerator choice using legal mappings, execution support, complete-path consequences, and a reversal condition."
    concept_ids: ["v1_11_D"]
    coverage: "implemented"
    limitation: ""
