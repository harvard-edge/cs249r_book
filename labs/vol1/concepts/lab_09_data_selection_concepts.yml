lab_concept_map:
  schema_version: 1
  lab_id: v1_09
  chapter: 9
  title: Make fewer examples earn their cost
  source_notebook: labs/vol1/lab_09_data_selection.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/09_data_selection/data_selection_concepts.yml
  chapter_goal: Choose a selected pool or retain the full pool using learning value, coverage, complete
    preparation cost, and realized delivery.
  core_concepts:
  - id: v1_09_A
    title: Learning value and compute allocation
    source_concepts:
    - chapter: 9
      concept: Measuring data value
      concept_map: books/vol1/09_data_selection/data_selection_concepts.yml
    - chapter: 9
      concept: Compute-optimal frontier
      concept_map: books/vol1/09_data_selection/data_selection_concepts.yml
    learning_claim: Fewer examples or a high early gain ratio does not establish reaching the final target.
    misconception: A smaller or higher-scored pool necessarily has more learning value.
    tradeoff: Learning gained per unit of work versus repeated or redundant examples and model/data allocation.
    student_action: Choose among supported allocation pilots and reveal work-matched learning observations.
    evidence_to_inspect: Work-matched pilot observations at a common evaluation protocol.
    explanation_prompt: Should the next fixed work allocation repeat data, add novel cases, or change
      model/data balance?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Buy useful learning
  - id: v1_09_B
    title: Coverage floors and selection opportunity cost
    source_concepts:
    - chapter: 9
      concept: Static pruning with coverage floors
      concept_map: books/vol1/09_data_selection/data_selection_concepts.yml
    learning_claim: Coverage has an opportunity cost; meeting counts alone does not establish adequate
      outcomes.
    misconception: Global score ranking guarantees required slice coverage.
    tradeoff: High-score retention versus justified coverage floors and scarce eligible records.
    student_action: Allocate a finite subset under justified class/slice floors and inspect an infeasible
      budget or deficient eligible pool.
    evidence_to_inspect: Selected identities, displaced examples, coverage counts, and infeasible eligible
      budgets.
    explanation_prompt: Which high-scoring examples must be displaced to preserve required conditions?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Spend the coverage budget
  - id: v1_09_C
    title: Selection preparation and breakeven
    source_concepts:
    - chapter: 9
      concept: Selection inequality
      concept_map: books/vol1/09_data_selection/data_selection_concepts.yml
    learning_claim: A ranking is not free; a changed task may invalidate its reuse.
    misconception: Reduced training work always repays selection preparation and refresh.
    tradeoff: Saved accepted training work versus scorer preparation, scans, refresh, and the valid reuse
      horizon.
    student_action: Compare complete campaign accounting for supported scorer preparation and reuse horizons
      at matched accepted quality.
    evidence_to_inspect: Preparation/scoring/refresh/training components beside matched accepted quality.
    explanation_prompt: Does saved training work repay scoring, preparation, and refresh?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Charge selection honestly
  - id: v1_09_D
    title: Realized input-path savings
    source_concepts:
    - chapter: 9
      concept: Selection engineering on the data path
      concept_map: books/vol1/09_data_selection/data_selection_concepts.yml
    learning_claim: Repacking adds work and storage. Arithmetic savings can remain unrealized when the
      loader still scans the original archive.
    misconception: Selecting fewer records necessarily reduces reads and elapsed time.
    tradeoff: Fewer arithmetic examples versus actual read/transform work, materialization storage, and
      preparation cost.
    student_action: Keep selected identities fixed and compare stream/discard, scattered reads, and materialized
      subsets.
    evidence_to_inspect: Fixed subset identities with streamed, scattered, and materialized input-path
      accounting.
    explanation_prompt: Do fewer selected records mean fewer reads or a faster critical path?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Realize the saving
  primary_concept_dispositions:
  - concept: Selection inequality
    disposition: interactive
    lab_concepts:
    - v1_09_C
  - concept: Measuring data value
    disposition: interactive
    lab_concepts:
    - v1_09_A
  - concept: Compute-optimal frontier
    disposition: interactive
    lab_concepts:
    - v1_09_A
  - concept: Selection engineering on the data path
    disposition: interactive
    lab_concepts:
    - v1_09_D
  - concept: Static pruning with coverage floors
    disposition: interactive
    lab_concepts:
    - v1_09_B
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 9
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 9
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 9
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 9
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Data-policy record: selected identities or full-pool decision, coverage and quality evidence,
    scorer/refresh provenance, materialization choice, and complete cost boundary.'

  student_goals:
  - "Compare model and token allocations at fixed training compute, and identify where fitted learning predictions lack support."
  - "Choose a subset while accounting for required coverage and eligible records."
  - "Charge preparation and reuse when judging whether selection pays."
  - "Compare realized delivery work and population changes before recommending a selection policy."
  runtime_parts:
  - part: "A"
    title: "Learning allocation"
    question: "Where should the next learning budget go?"
    goal: "Sweep model size and token allocation at fixed FLOPs using a labeled fitted language-reference loss surface; identify repeated-data cases requiring pilots."
    next: "Choose which records to keep while preserving the required coverage of activity conditions."
    concept_ids: ["v1_09_A"]
    coverage: "implemented"
    limitation: "Controlled analytical dense-language reference, not measured project quality. Chinchilla fitted projections do not predict learning from repeated tokens; those allocations remain unranked until validated."
  - part: "B"
    title: "Coverage-constrained selection"
    question: "Which examples can we remove while retaining required coverage?"
    goal: "Choose a subset using eligible-record coverage and task evidence."
    next: "The selected identities are fixed. Charge preparation and scoring before claiming a campaign saving."
    concept_ids: ["v1_09_B"]
    coverage: "implemented"
    limitation: ""
  - part: "C"
    title: "Complete selection cost"
    question: "Does the selected pool repay preparation over its reuse horizon?"
    goal: "Compare scoring and selection costs over a stated reuse horizon."
    next: "A smaller training pool is only useful if its records reach the development host efficiently. Compare delivery paths next."
    concept_ids: ["v1_09_C"]
    coverage: "implemented"
    limitation: ""
  - part: "D"
    title: "Realized input-path savings"
    question: "Do fewer selected examples actually reduce input work?"
    goal: "Compare stream, scatter, and materialization at fixed selected identities, including preparation and storage."
    next: "The path is chosen under a fixed population. Test whether changed cohort proportions reopen the subset decision."
    concept_ids: ["v1_09_D"]
    coverage: "implemented"
    limitation: "Analytical delivery paths begin after scoring and selection; materialization assumes unchanged transforms and retains the source archive."
  - part: "E"
    title: "Population shift"
    question: "Does the selected pool remain useful under changed populations?"
    goal: "Explain when changed cohort proportions invalidate a selection decision."
    next: "Use learning value, coverage, preparation, delivery, and shift evidence to defend one selection policy."
    concept_ids: ["v1_09_A", "v1_09_B"]
    coverage: "reference"
    limitation: "Transfer probe using fixed supplied cohort outcomes; not evidence of retrained quality."
