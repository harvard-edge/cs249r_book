lab_concept_map:
  schema_version: 1
  lab_id: v1_08
  chapter: 8
  title: Train to a target, not to a busy GPU
  source_notebook: labs/vol1/lab_08_model_train.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/08_training/training_concepts.yml
  chapter_goal: Choose or reject a training recipe using state fit, effective batch, numerical progress,
    and a cause-specific bottleneck diagnosis.
  core_concepts:
  - id: v1_08_A
    title: Adaptation scope and training state
    source_concepts:
    - chapter: 8
      concept: Fine-tuning scope
      concept_map: books/vol1/08_training/training_concepts.yml
    - chapter: 8
      concept: Training memory at scale
      concept_map: books/vol1/08_training/training_concepts.yml
    learning_claim: Freezing parameters need not remove all forward state or backward dependencies.
    misconception: Freezing parameters removes their weights and all backward activations.
    tradeoff: Adaptation scope versus optimizer/gradient memory, retained activations, and task progress.
    student_action: Compare supported full and restricted adaptation with weights, gradients, optimizer
      state, and activations shown separately.
    evidence_to_inspect: Separate state allocations under supported adaptation scopes.
    explanation_prompt: Which allocations disappear when adaptation scope is reduced?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Inventory training state
  - id: v1_08_B
    title: Memory versus accumulation and recomputation
    source_concepts:
    - chapter: 8
      concept: Checkpointing and accumulation
      concept_map: books/vol1/08_training/training_concepts.yml
    - chapter: 8
      concept: Training memory at scale
      concept_map: books/vol1/08_training/training_concepts.yml
    learning_claim: Lower memory has execution costs; equivalence requires an explicit recipe rather than
      a familiar batch label.
    misconception: Matching the effective batch makes memory and execution costs identical.
    tradeoff: Resident memory savings versus accumulated/recomputed execution at an explicit effective
      batch.
    student_action: Compare supported resident, micro-batch/accumulated, and checkpointed configurations
      at the same effective batch where appropriate.
    evidence_to_inspect: Legal memory and execution comparisons for matched effective batches and supported
      recipes.
    explanation_prompt: Can accumulation or recomputation preserve the target while fitting?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Recover a nonfitting run
  - id: v1_08_C
    title: Numerical execution versus time to quality
    source_concepts:
    - chapter: 8
      concept: Mixed precision
      concept_map: books/vol1/08_training/training_concepts.yml
    - chapter: 8
      concept: Training-time law
      concept_map: books/vol1/08_training/training_concepts.yml
    learning_claim: Step time and time to acceptable quality are different outcomes; never synthesize
      accuracy from a speed slider.
    misconception: A faster numerical step necessarily reaches the quality target sooner.
    tradeoff: Faster supported numerical execution versus convergence, stability, and target-reaching
      evidence.
    student_action: Reveal matched observed progress for supported numerical recipes; retain failed and
      unavailable target outcomes.
    evidence_to_inspect: Observed target-reaching trajectories, numerical failures, and missing target
      evidence.
    explanation_prompt: Can faster arithmetic take longer to reach the target or fail to reach it?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Judge useful progress
  - id: v1_08_D
    title: Critical-path diagnosis and useful progress
    source_concepts:
    - chapter: 8
      concept: Profile to find the limiting term
      concept_map: books/vol1/08_training/training_concepts.yml
    - chapter: 8
      concept: Model FLOPs utilization
      concept_map: books/vol1/08_training/training_concepts.yml
    - chapter: 8
      concept: Training-time law
      concept_map: books/vol1/08_training/training_concepts.yml
    learning_claim: Busy accelerators do not prove useful learning, and input preparation is not always
      the bottleneck.
    misconception: A busy accelerator proves useful progress and identifies the next purchase.
    tradeoff: Investment in a stage versus critical-path relief and unchanged quality requirements.
    student_action: Inspect partially revealed profiles, test an ineffective improvement, then compare
      a supported cause-specific repair.
    evidence_to_inspect: Matched model-FLOP numerator, dense precision peak, full update duration, device-stage busy fraction, MFU, and cause-specific intervention results.
    explanation_prompt: Which intervention addresses the revealed critical stage?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Diagnose before spending
  primary_concept_dispositions:
  - concept: Training-time law
    disposition: interactive
    lab_concepts:
    - v1_08_C
    - v1_08_D
  - concept: Model FLOPs utilization
    disposition: interactive
    lab_concepts:
    - v1_08_D
  - concept: Training memory at scale
    disposition: interactive
    lab_concepts:
    - v1_08_A
    - v1_08_B
  - concept: Mixed precision
    disposition: interactive
    lab_concepts:
    - v1_08_C
  - concept: Checkpointing and accumulation
    disposition: interactive
    lab_concepts:
    - v1_08_B
  - concept: Profile to find the limiting term
    disposition: interactive
    lab_concepts:
    - v1_08_D
  - concept: Fine-tuning scope
    disposition: interactive
    lab_concepts:
    - v1_08_A
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 8
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 8
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 8
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 8
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Training record: exact data/model/runtime identities, adaptation and numerical recipe, fit
    evidence, observed target progress or failure, and the next validation obligation.'

  student_goals:
  - "Account for training allocations separately from inference weights."
  - "Compare physical batch, accumulated batch, and recomputation against memory and time-to-target."
  - "Judge numerical recipes using supplied progress evidence as well as stage time."
  - "Choose a cause-specific intervention and explain its competing cost."
  runtime_parts:
  - part: "A"
    title: "Training state"
    question: "Which allocations make this training run fit?"
    goal: "Separate allocations changed by adaptation scope from retained model and activation state."
    next: "The state inventory is now explicit. Compare physical batching and accumulation at the same target before accepting a recipe."
    concept_ids: ["v1_08_A"]
    coverage: "implemented"
    limitation: "Restricted adaptation is a stated analytical recipe; matched task-progress evidence is unavailable, so memory fit does not establish acceptable adaptation."
  - part: "B"
    title: "Physical and effective batch"
    question: "Does a larger effective batch reach the same target sooner?"
    goal: "Compare physical and effective batch using memory and time to the same target."
    next: "With a batch strategy identified, inspect whether faster numerical execution still reaches the quality target."
    concept_ids: ["v1_08_B"]
    coverage: "implemented"
    limitation: ""
  - part: "C"
    title: "Numerical progress"
    question: "Does faster numerical execution produce accepted progress?"
    goal: "Judge a numerical recipe from supplied progress and failure evidence."
    next: "Now test whether recomputation can recover the memory headroom the recipe requires, and what time it costs."
    concept_ids: ["v1_08_C"]
    coverage: "implemented"
    limitation: "Arithmetic timing uses the matched dense precision peak and an explicit efficiency assumption; unsupported formats have no execution-time estimate. Numerical progress is separate supplied evidence."
  - part: "D"
    title: "Recomputation"
    question: "Can checkpointing rescue a nonfitting run at an acceptable time cost?"
    goal: "Compare checkpointing memory savings with recomputation time."
    next: "Use the stage breakdown to choose which intervention addresses the binding term."
    concept_ids: ["v1_08_B"]
    coverage: "implemented"
    limitation: ""
  - part: "E"
    title: "Busy versus useful work"
    question: "Which tested intervention changes the time to useful progress?"
    goal: "Distinguish busy device stages from useful model FLOPs, then select a cause-specific intervention."
    next: "Bring the state, batch, precision, recomputation, and bottleneck contrasts into one training recommendation."
    concept_ids: ["v1_08_D"]
    coverage: "implemented"
    limitation: ""
