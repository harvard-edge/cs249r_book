lab_concept_map:
  schema_version: 1
  lab_id: v1_06
  chapter: 6
  title: Choose structure for the task, not the label
  source_notebook: labs/vol1/lab_06_nn_arch.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/06_nn_architectures/nn_architectures_concepts.yml
  chapter_goal: Choose a task-supported architecture while explaining its information assumptions and dominant resource
    regime.
  core_concepts:
  - id: v1_06_A
    title: Inductive bias and retained information
    source_concepts:
    - chapter: 6
      concept: Inductive bias buys data and cost
      concept_map: books/vol1/06_nn_architectures/nn_architectures_concepts.yml
    - chapter: 6
      concept: Architecture selection by workload profile
      concept_map: books/vol1/06_nn_architectures/nn_architectures_concepts.yml
    learning_claim: A property useful for presence classification may be harmful when location or ordering matters.
    misconception: A fashionable family or invariance is useful for every task.
    tradeoff: Desired invariance or structural bias versus information the task must retain.
    student_action: Compare supplied task-matched candidates and transformations under the stated output requirement.
    evidence_to_inspect: Task-matched structural candidates, retained information, and supplied outcome evidence.
    explanation_prompt: Which invariance or structural bias helps this task, and which information would it discard?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism and
      competing consequence, and name a condition that could change the choice.
    scope: native mission with explicitly named reference contrasts
    investigation_title: Keep the right information
  - id: v1_06_B
    title: Architecture cost signatures
    source_concepts:
    - chapter: 6
      concept: Every family lowers onto GEMM
      concept_map: books/vol1/06_nn_architectures/nn_architectures_concepts.yml
    - chapter: 6
      concept: Architectures as cost signatures
      concept_map: books/vol1/06_nn_architectures/nn_architectures_concepts.yml
    learning_claim: Architectural structure changes movement and state as well as arithmetic.
    misconception: An architecture name fixes its bottleneck permanently.
    tradeoff: Architectural work and movement patterns versus the resource available to execute them.
    student_action: Trace dense work, shared/local operations, or embedding lookup using controlled candidate cases.
    evidence_to_inspect: Lowered operation, movement, and state profiles across supported candidate cases.
    explanation_prompt: Would arithmetic, bandwidth, or capacity be the useful intervention?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism and
      competing consequence, and name a condition that could change the choice.
    scope: native mission with explicitly named reference contrasts
    investigation_title: Map structure to resources
  - id: v1_06_C
    title: Attention state and generation phases
    source_concepts:
    - chapter: 6
      concept: Quadratic attention
      concept_map: books/vol1/06_nn_architectures/nn_architectures_concepts.yml
    - chapter: 6
      concept: Autoregressive decode and the KV cache
      concept_map: books/vol1/06_nn_architectures/nn_architectures_concepts.yml
    learning_claim: Avoiding a materialized score matrix changes storage, not the quadratic dense score work. History,
      retained state, and generation phases have different costs. These observations do not make the ring or car
      a language service.
    misconception: Removing score materialization removes dense quadratic score work, and prefill/decode have the
      same regime.
    tradeoff: Attention score storage choices versus retained state; prefill/decode phase demands remain distinct
      from dense score arithmetic.
    student_action: Use a named sequence reference. At fixed supported history, compare materialized and unmaterialized
      attention scores; inspect retained state alongside unchanged dense score arithmetic, then compare prefill
      with decode. Retain the distinction between the native mission and the reference task.
    evidence_to_inspect: Separate attention-score arithmetic and optional materialization; named prefill/decode
      reference state.
    explanation_prompt: Does longer history have the same consequence during known-input processing and generation?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism and
      competing consequence, and name a condition that could change the choice.
    scope: native mission with explicitly named reference contrasts
    investigation_title: Stress input and phase
  - id: v1_06_D
    title: Embedding capacity and task fit
    source_concepts:
    - chapter: 6
      concept: Embedding capacity wall
      concept_map: books/vol1/06_nn_architectures/nn_architectures_concepts.yml
    - chapter: 6
      concept: Architecture selection by workload profile
      concept_map: books/vol1/06_nn_architectures/nn_architectures_concepts.yml
    learning_claim: Capacity can grow while per-request access remains similar; adding IDs cannot create evidence
      for an unseen item.
    misconception: A larger embedding vocabulary proportionally increases every request or solves unseen-item behavior.
    tradeoff: Vocabulary/category capacity versus requested accesses, task evidence, and deployable structure.
    student_action: Vary a supported table/vocabulary envelope while holding requested rows fixed; compare task
      evidence separately.
    evidence_to_inspect: Requested-row access versus total table capacity and task/cold-start evidence.
    explanation_prompt: Does a larger category or embedding vocabulary necessarily mean proportionally more work
      per request?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism and
      competing consequence, and name a condition that could change the choice.
    scope: native mission with explicitly named reference contrasts
    investigation_title: Test capacity without confusing work
  primary_concept_dispositions:
  - concept: Inductive bias buys data and cost
    disposition: interactive
    lab_concepts:
    - v1_06_A
  - concept: Every family lowers onto GEMM
    disposition: interactive
    lab_concepts:
    - v1_06_B
  - concept: Architectures as cost signatures
    disposition: interactive
    lab_concepts:
    - v1_06_B
  - concept: Quadratic attention
    disposition: interactive
    lab_concepts:
    - v1_06_C
  - concept: Autoregressive decode and the KV cache
    disposition: interactive
    lab_concepts:
    - v1_06_C
  - concept: Embedding capacity wall
    disposition: interactive
    lab_concepts:
    - v1_06_D
  - concept: Architecture selection by workload profile
    disposition: interactive
    lab_concepts:
    - v1_06_A
    - v1_06_D
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 6
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 6
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 6
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 6
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation and
    reversal condition; concise concept interpretations can be reused.
  handoff: 'Architecture decision: task-matched candidate identity, required invariances/information, supported
    input and state envelope, supplied outcome evidence, and explicit reference-study limits.'
  student_goals:
  - Test whether a representation erases task-required distinctions, then compare supplied candidate outcomes at
    a fixed example count.
  - Vary compute and bandwidth independently for the same architecture and task.
  - Compare input-scale state growth, isolate attention-score storage from arithmetic, and contrast separate language
    prefill and decode.
  - Compare feasible candidates, then distinguish embedding-table capacity from fixed-request access.
  runtime_parts:
  - part: A
    title: Structural assumptions
    question: When does a structural assumption help?
    goal: Test whether a representation erases task-required distinctions, then compare supplied candidate outcomes
      at a fixed example count.
    concept_ids:
    - v1_06_A
    coverage: implemented
    limitation: The input-structure probe is an exact shared counterexample, not a project dataset or empirical
      sample-efficiency experiment. Supplied quality curves remain illustrative.
    next: Next, investigate cost signatures.
    artifact: An exact representation-collision witness beside a task-matched supplied-quality contrast at a fixed
      training-example count.
    scope: Exact shared input-structure reference plus controlled quality reference; neither validates the deployment
      project.
  - part: B
    title: Cost signatures
    question: Does more compute guarantee proportional speedup?
    goal: Vary compute and bandwidth independently for the same architecture and task.
    concept_ids:
    - v1_06_B
    coverage: implemented
    limitation: ''
    next: Next, investigate input scaling.
    artifact: A compute-versus-bandwidth intervention contrast for the same candidate.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: C
    title: Input scaling
    question: Which commitment breaks first as input grows?
    goal: Compare input-scale state growth, isolate attention-score storage from arithmetic, and contrast separate
      language prefill and decode.
    concept_ids:
    - v1_06_B
    - v1_06_C
    coverage: partial
    limitation: Unmaterialized scores exclude tile scratch. The language-phase reference is a different task and
      has no measured latency.
    next: Next, investigate architecture decision.
    artifact: An input-scale contrast naming the growing state component and the first failed requirement. Captured
      score-storage and separate language-phase reference inputs/results.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: D
    title: Architecture decision
    question: Which architecture remains defensible?
    goal: Compare feasible candidates, then distinguish embedding-table capacity from fixed-request access.
    concept_ids:
    - v1_06_A
    - v1_06_B
    - v1_06_D
    coverage: partial
    limitation: Embedding table capacity does not establish unseen-item quality or measured lookup latency.
    next: Next, defend one decision using your saved comparisons in Synthesis.
    artifact: A candidate comparison with memory, latency, quality, and the rejected alternative. Captured fixed-request
      embedding-capacity reference.
    scope: Controlled chapter reference; not a deployment measurement.
