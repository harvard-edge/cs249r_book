lab_concept_map:
  schema_version: 1
  lab_id: v1_04
  chapter: 4
  title: Make the evidence trustworthy and deliverable
  source_notebook: labs/vol1/lab_04_data_engr.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/04_data_engineering/data_engineering_concepts.yml
  chapter_goal: Create a versioned data contract that supports independent evaluation and a functioning
    input path.
  core_concepts:
  - id: v1_04_A
    title: Labels as a task contract
    source_concepts:
    - chapter: 4
      concept: Labels are the specification
      concept_map: books/vol1/04_data_engineering/data_engineering_concepts.yml
    learning_claim: Labels define which task distinctions can be expressed; finer labels cost annotation
      breadth and help only when the task requires those distinctions. Agreement identifies review candidates
      but can preserve shared errors; independent references add labor and can expose those errors.
    misconception: More detailed labels always improve the specification, or enough examples repair a label
      that merges incompatible required actions.
    tradeoff: Annotation breadth versus action-specific label detail under a fixed review budget.
    student_action: Compare coarse and condition-specific labels on the same raw pool and fixed annotation
      budget; change the task to test when the added distinctions cease to be necessary. On a separate fixed
      audit set, compare single annotation, disagreement adjudication, and independent gold checks.
    evidence_to_inspect: Retained record identities, assumed annotation cost, label-to-required-action mappings,
      ambiguous labels, missing raw evidence, the presence-only task counterexample, paired annotations,
      chance-corrected agreement, review labor, shared errors, and unresolved references.
    explanation_prompt: Which distinctions must the label preserve, and what annotation breadth do they cost?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Decide what correct means
  - id: v1_04_B
    title: Independent evaluation and transformation parity
    source_concepts:
    - chapter: 4
      concept: Training-serving consistency
      concept_map: books/vol1/04_data_engineering/data_engineering_concepts.yml
    - chapter: 4
      concept: Data leakage
      concept_map: books/vol1/04_data_engineering/data_engineering_concepts.yml
    learning_claim: Shared entities and preprocessing leakage can inflate evidence without improving behavior.
    misconception: A favorable test score is independent even when entities or fitted state cross the
      boundary.
    tradeoff: Convenient splits and refitting versus independent evaluation and stable serving semantics.
    student_action: Compare record and entity/session splits, then fit-on-train versus fit-before-split;
      replay serving with frozen versus refitted state.
    evidence_to_inspect: Split-group membership, fitted-state provenance, paired scores, and request-keyed
      transform replay.
    explanation_prompt: Does a favorable score survive a valid split and fitted-state boundary?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Protect independent evidence
  - id: v1_04_C
    title: Input-delivery bottlenecks
    source_concepts:
    - chapter: 4
      concept: The feeding problem
      concept_map: books/vol1/04_data_engineering/data_engineering_concepts.yml
    learning_claim: Smaller files can add decode work. A faster producer is wasted once the consumer becomes
      limiting.
    misconception: Smaller stored records necessarily feed training faster.
    tradeoff: Storage/traffic reduction versus decode/transform work and actual delivered supply.
    student_action: Compare representation, read/decode/transform supply, and consumer demand; improve
      the binding stage while holding data semantics fixed.
    evidence_to_inspect: Stage capacities, delivered consumer rate, bytes, and decode/transform work.
    explanation_prompt: Which pipeline intervention actually raises delivered input?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Feed the consumer
  - id: v1_04_D
    title: Semantic data contracts and drift evidence
    source_concepts:
    - chapter: 4
      concept: Data as code practice
      concept_map: books/vol1/04_data_engineering/data_engineering_concepts.yml
    - chapter: 4
      concept: Data cascades
      concept_map: books/vol1/04_data_engineering/data_engineering_concepts.yml
    - chapter: 4
      concept: Drift statistics
      concept_map: books/vol1/04_data_engineering/data_engineering_concepts.yml
    learning_claim: Schema validity does not establish semantic correctness; detection has validation
      and quarantine costs.
    misconception: A valid schema or an input-distribution alert establishes correct outcomes.
    tradeoff: Stricter validation and quarantine work versus escaped semantic defects and unjustified
      drift conclusions.
    student_action: Replay a semantic contract violation, repair it, and trace affected descendants; compare
      a counterexample where an alert alone establishes no harm.
    evidence_to_inspect: Semantic checks, escaped/quarantined records, lineage, and a non-harm counterexample.
    explanation_prompt: Is this a producer defect, a benign shift, or an unresolved outcome question?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Diagnose the changed batch
  primary_concept_dispositions:
  - concept: Data as code practice
    disposition: interactive
    lab_concepts:
    - v1_04_D
  - concept: Data cascades
    disposition: interactive
    lab_concepts:
    - v1_04_D
  - concept: Labels are the specification
    disposition: interactive
    lab_concepts:
    - v1_04_A
  - concept: Training-serving consistency
    disposition: interactive
    lab_concepts:
    - v1_04_B
  - concept: Data leakage
    disposition: interactive
    lab_concepts:
    - v1_04_B
  - concept: The feeding problem
    disposition: interactive
    lab_concepts:
    - v1_04_C
  - concept: Drift statistics
    disposition: interactive
    lab_concepts:
    - v1_04_D
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 4
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 4
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 4
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 4
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Data manifest: raw and derived identities, label rubric, split groups, fitted preprocessing
    state, producer checks, lineage, and delivered pipeline capacity.'
  student_goals:
  - Compare label detail and coverage under a fixed budget; distinguish annotation agreement from correctness
      and compare review labor on a separate fixed audit set.
  - Compare split integrity and preprocessing scope before trusting the evaluation.
  - Locate the binding pipeline stage while changing delivery and transform choices.
  - Compare age, traffic, annotation cost, and finite action mismatches; test stable conditions as a counterexample.
  - Compare a semantic contract with unchecked ingestion and inspect accepted or rejected records.
  runtime_parts:
  - part: A
    title: Define the label contract
    question: What must a label distinguish?
    goal: Compare label detail and coverage under a fixed budget; distinguish annotation agreement from correctness
      and compare review labor on a separate fixed audit set.
    concept_ids:
    - v1_04_A
    coverage: implemented
    limitation: Finite rubric and separate supplied annotation-audit reference with explicit hypothetical
      labor costs; no learned quality, population error rate, or deployment qualification is inferred.
    next: Next, investigate independent evaluation.
    artifact: A task-specific rubric and retention contrast plus a fixed-set annotation audit naming review
      labor, pair agreement, shared errors, and missing evidence.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: B
    title: Independent evaluation
    question: Can higher accuracy mean weaker evidence?
    goal: Compare split integrity and preprocessing scope before trusting the evaluation.
    concept_ids:
    - v1_04_B
    coverage: implemented
    limitation: ''
    next: Next, investigate supplying execution.
    artifact: A split/preprocessing contrast with evaluation results and leakage status.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: C
    title: Supplying execution
    question: Why is execution waiting for data?
    goal: Locate the binding pipeline stage while changing delivery and transform choices.
    concept_ids:
    - v1_04_C
    coverage: implemented
    limitation: ''
    next: Next, investigate freshness policy.
    artifact: A pipeline contrast naming the binding stage and resulting supply rate.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: D
    title: Freshness policy
    question: How fresh must the evidence be?
    goal: Compare delivery costs and decision consequences on changing and stable feature-state traces.
    concept_ids:
    - v1_04_C
    - v1_04_D
    coverage: implemented
    limitation: Conservative constant maximum-age replay of a supplied finite state/action trace, not an
      actual arrival schedule, learned-accuracy curve, drift-rate estimate, or empirical deployment result.
    next: Next, investigate producer contracts.
    artifact: A freshness-policy contrast showing age, traffic, annotation cost, exact available-state actions,
      current required actions, and a stable-state counterexample.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: E
    title: Producer contracts
    question: What happens when a producer changes?
    goal: Compare a semantic contract with unchecked ingestion and inspect accepted or rejected records.
    concept_ids:
    - v1_04_D
    coverage: implemented
    limitation: ''
    next: Next, defend one decision using your saved comparisons in Synthesis.
    artifact: A contract contrast naming rejected records, accepted evidence, and semantic risk.
    scope: Controlled chapter reference; not a deployment measurement.
