lab_concept_map:
  schema_version: 1
  lab_id: v1_12
  chapter: 12
  title: Earn the right to make a performance claim
  source_notebook: labs/vol1/lab_12_perf_bench.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/12_benchmarking/benchmarking_concepts.yml
  chapter_goal: Decide which performance and behavioral claims are supported, contradicted, or still unresolved.
  core_concepts:
  - id: v1_12_A
    title: Measurement boundaries and claim validity
    source_concepts:
    - chapter: 12
      concept: Measurement validity
      concept_map: books/vol1/12_benchmarking/benchmarking_concepts.yml
    - chapter: 12
      concept: Benchmark specification
      concept_map: books/vol1/12_benchmarking/benchmarking_concepts.yml
    - chapter: 12
      concept: Benchmark granularity
      concept_map: books/vol1/12_benchmarking/benchmarking_concepts.yml
    learning_claim: Matching a model name does not match a measurement protocol.
    misconception: Two favorable numbers support a comparison because they share a model label.
    tradeoff: A convenient narrow timer boundary versus the claim the project needs to make.
    student_action: Choose the claim, expose a protocol mismatch, repair timer endpoints or included stages,
      and rerun the supported comparison.
    evidence_to_inspect: Timer endpoints, included work, artifact/protocol identities, and repaired paired
      evidence.
    explanation_prompt: Do the two favorable numbers measure the same work?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Match the boundary
  - id: v1_12_B
    title: Independent evidence and uncertainty
    source_concepts:
    - chapter: 12
      concept: Differences beyond noise
      concept_map: books/vol1/12_benchmarking/benchmarking_concepts.yml
    learning_claim: More correlated requests need not resolve uncertainty; detectable improvement and
      useful improvement differ.
    misconception: More requests replace independent measurements.
    tradeoff: Requests per run versus independent run pairs under a fixed measurement budget.
    student_action: Allocate a fixed budget between requests and independent paired runs, retaining within-run
      and between-run variation.
    evidence_to_inspect: Within-run traces and between-run paired uncertainty relative to useful-effect
      requirements.
    explanation_prompt: Where do independent repeats buy evidence?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Spend the measurement budget
  - id: v1_12_C
    title: Operating envelopes and tail behavior
    source_concepts:
    - chapter: 12
      concept: Latency distribution and the SLO
      concept_map: books/vol1/12_benchmarking/benchmarking_concepts.yml
    - chapter: 12
      concept: Verification gap
      concept_map: books/vol1/12_benchmarking/benchmarking_concepts.yml
    learning_claim: An idle, warm, or short run supports only the corresponding operating envelope.
    misconception: A short warm run represents sustained or shared-device use.
    tradeoff: A favorable brief condition versus tails, sustained effects, contention, and complete-window
      energy.
    student_action: Replay supported workload/condition traces and inspect tails, deadline misses, or
      complete-window energy beside the headline.
    evidence_to_inspect: Supported operating traces, tails/deadline misses, and complete measurement windows.
    explanation_prompt: Does the result survive the relevant sustained or local condition?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Challenge representativeness
  - id: v1_12_D
    title: Quality, calibration, and evidence sufficiency
    source_concepts:
    - chapter: 12
      concept: Quality beyond accuracy
      concept_map: books/vol1/12_benchmarking/benchmarking_concepts.yml
    - chapter: 12
      concept: Verification gap
      concept_map: books/vol1/12_benchmarking/benchmarking_concepts.yml
    learning_claim: Calibration can change while classifications remain fixed. Untested populations remain
      untested.
    misconception: Equal aggregate quality means equal useful behavior and confidence.
    tradeoff: Aggregate quality versus slice outcomes, calibration, counts, and unmeasured populations.
    student_action: Lock quality gates, reveal paired slices and calibration, and test a supported repair
      without inventing missing coverage.
    evidence_to_inspect: Paired slice outcomes, confidence calibration, sample counts, and missing coverage.
    explanation_prompt: Can equal aggregate quality hide consequential differences?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Audit the behavior claim
  primary_concept_dispositions:
  - concept: Measurement validity
    disposition: interactive
    lab_concepts:
    - v1_12_A
  - concept: Benchmark specification
    disposition: interactive
    lab_concepts:
    - v1_12_A
  - concept: Benchmark granularity
    disposition: interactive
    lab_concepts:
    - v1_12_A
  - concept: Latency distribution and the SLO
    disposition: interactive
    lab_concepts:
    - v1_12_C
  - concept: Differences beyond noise
    disposition: interactive
    lab_concepts:
    - v1_12_B
  - concept: Quality beyond accuracy
    disposition: interactive
    lab_concepts:
    - v1_12_D
  - concept: Verification gap
    disposition: interactive
    lab_concepts:
    - v1_12_C
    - v1_12_D
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 12
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 12
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 12
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 12
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Benchmark claim card: artifact and protocol identities, timer boundary, workload/population,
    conditions, uncertainty, quality gates, supported claim, and untested scope.'

  student_goals:
  - "Define a consistent application boundary before reporting a speedup."
  - "Judge measurement amount using repeatability, warmup, and uncertainty."
  - "Test sustained tail behavior, energy, and deadline misses."
  - "Audit behavioral slices, confidence calibration, and protocol parity before choosing a reportable claim."
  runtime_parts:
  - part: "A"
    title: "Measurement boundary"
    question: "Does local speedup improve the user path?"
    goal: "Compare local and complete-path improvement at a fixed measurement boundary."
    next: "Choose a measurement protocol capable of supporting the complete-path claim."
    concept_ids: ["v1_12_A"]
    coverage: "implemented"
    limitation: ""
  - part: "B"
    title: "Measurement sufficiency"
    question: "How much measurement supports the claim?"
    goal: "Judge repeatability with warmup, run length, and independent repeat evidence."
    next: "Challenge the result under sustained operating conditions rather than a short favorable run."
    concept_ids: ["v1_12_B"]
    coverage: "implemented"
    limitation: ""
  - part: "C"
    title: "Operating envelope"
    question: "Does the winner survive sustained deployment?"
    goal: "Test sustained tails, energy, and deadline misses under declared conditions."
    next: "Test whether acceptable timing still preserves useful behavior and justified confidence."
    concept_ids: ["v1_12_C"]
    coverage: "implemented"
    limitation: ""
  - part: "D"
    title: "Behavioral evidence"
    question: "Did efficiency preserve useful behavior?"
    goal: "Check aggregate and difficult-slice behavioral floors using matched outcomes."
    next: "Audit protocol parity before admitting either a speed or behavioral result into the final comparison."
    concept_ids: ["v1_12_D"]
    coverage: "implemented"
    limitation: "Candidate slice outcomes and a separate synthetic confidence study support distinct claims. Calibration repair is fitted on a disjoint split; absent populations and deployment shift remain unobserved."
  - part: "E"
    title: "Protocol parity"
    question: "Which comparison can we honestly report?"
    goal: "Identify and repair or exclude protocol mismatches before reporting a claim."
    next: "Choose a reportable claim or hold, cite the matched evidence, and state the limitation that would reopen the decision."
    concept_ids: ["v1_12_A"]
    coverage: "implemented"
    limitation: ""
