lab_concept_map:
  schema_version: 1
  lab_id: v1_15
  chapter: 15
  title: Useful for whom, under which obligations?
  source_notebook: labs/vol1/lab_15_responsible_engr.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/15_responsible_engr/responsible_engr_concepts.yml
  chapter_goal: Recommend release, restricted use, baseline retention, mitigation, or hold using justified
    obligations and observed consequences.
  student_goals:
  - Distinguish optimized clicks from independently audited intended benefit; justify a fairness criterion
    before comparing mitigation.
  - Compare threshold error consequences under a fixed obligation.
  - Trace how selected labels shape later decisions in a finite replay, and compare independent follow-up
    work with serving exploration costs.
  - Test whether lifecycle savings compare equal service and sufficient supplied replay evidence; include
    preparation work.
  - Bound lifecycle and incident claims without transferring reference results into native-project certification.
  runtime_parts:
  - part: A
    title: Audit the intended benefit
    question: Can more clicks mean less independently audited benefit?
    goal: Compare equal-slot supplied recommendation policies, inspect independent benefit labels, and declare
      the criterion carried into Part B.
    concept_ids:
    - v1_15_A
    coverage: reference
    limitation: Fixed recommendation-policy records expose proxy-goal divergence and missing outcome evidence.
      A separate fixed-score criterion study remains available; neither certifies the native project.
    next: Hold the declared affected-population criterion fixed while comparing threshold consequences.
    explanation_prompt: Which policy does the proxy reward, which meets the intended benefit, and what becomes
      unknown when independent follow-up is withheld?
  - part: B
    title: Compare mitigation consequences
    question: Which errors change when the threshold changes?
    goal: Compare error counts and the declared criterion gate on identical audited cases.
    concept_ids:
    - v1_15_B
    coverage: partial
    limitation: Supported global thresholds form a measured reference comparison; trained and group-specific
      mitigation and their resource costs remain unmodeled.
    next: Ask whose outcomes routine feedback leaves unobserved.
  - part: C
    title: Follow the selected-label loop
    question: How do labels censored now change the next policy?
    goal: Replay supplied rounds with explicit cumulative-label updates; contrast routine feedback, independent
      observation, and serving exploration.
    concept_ids:
    - v1_15_C
    coverage: reference
    limitation: Three supplied rounds with a stated empirical-rate update illustrate censoring and intervention
      costs. They are not a geometric forecast or native-project fairness certification. Independent follow-up
      requires outcomes observable without exposure.
    next: Carry the observation obligation into the lifecycle accounting decision.
  - part: D
    title: Account over the lifetime
    question: Does lower inference energy justify the same-service lifecycle claim?
    goal: Compare preparation and operation energy, then test fixed service obligations and finite replay
      evidence.
    concept_ids:
    - v1_15_D
    coverage: partial
    limitation: Eligibility checks use fictional energy factors, fixed request/retraining/explanation obligations,
      and a finite supplied decision replay. They do not certify deployment quality, explanation fidelity,
      retraining efficacy, or safety. Currency, facility overhead, and embodied emissions are not modeled.
    next: Decide what evidence must remain available during an incident.
  - part: E
    title: Preserve an investigable system
    question: What does the team lose when records are removed?
    goal: Compare reconstructable decisions and time before containment.
    concept_ids: []
    coverage: reference
    limitation: This incident-evidence extension does not replace independent observation of censored outcomes.
    next: State the responsibility claim, the unresolved obligations, and a release or hold decision.
  core_concepts:
  - id: v1_15_A
    title: Proxy outcomes and justified fairness criteria
    source_concepts:
    - chapter: 15
      concept: Proxy misalignment
      concept_map: books/vol1/15_responsible_engr/responsible_engr_concepts.yml
    - chapter: 15
      concept: Fairness criteria for release
      concept_map: books/vol1/15_responsible_engr/responsible_engr_concepts.yml
    learning_claim: Healthy infrastructure and aggregate accuracy do not establish the intended outcome. Justified
      fairness criteria can yield different gates on the same predictions under unequal base rates; sparse
      group evidence remains insufficient.
    misconception: A healthy aggregate proxy proves the intended benefit for everyone.
    tradeoff: Convenient aggregate optimization versus the intended goal and a justified choice among group
      criteria that can conflict under unequal base rates; sparse evidence limits every claim.
    student_action: Predict whether the proxy identifies intended benefit. Compare equal-slot supplied policies
      on clicks and independently audited helpful outcomes, remove outcome evidence, and preserve the unknown
      state. Declare a criterion for the separate fixed-score mitigation study before comparing thresholds.
    evidence_to_inspect: Supplied request-level click and independently audited helpful-outcome records; equal
      slot budgets, benefit gate and follow-up work; optional criterion gates on fixed predictions.
    explanation_prompt: Does the proxy represent the intended benefit for the affected population?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Choose what must pass
  - id: v1_15_B
    title: Mitigation frontiers and consequences
    source_concepts:
    - chapter: 15
      concept: Fairness mitigation and its price
      concept_map: books/vol1/15_responsible_engr/responsible_engr_concepts.yml
    learning_claim: There is no universal fairness-versus-accuracy slider or scalar score that resolves every
      obligation.
    misconception: Every mitigation has a predictable universal fairness/accuracy exchange.
    tradeoff: Mitigation benefits versus separate error consequences, quality/resource costs, and feasible
      alternatives.
    student_action: Compare matched candidates with separate error consequences, quality/resource gates, and
      supported mitigation outcomes.
    evidence_to_inspect: Matched mitigation outcomes with error types and resource/preparation costs separate.
    explanation_prompt: Which supported intervention satisfies the obligation, and what does it cost?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Pay for mitigation
  - id: v1_15_C
    title: Selective feedback and independent observation
    source_concepts:
    - chapter: 15
      concept: Bias feedback loops
      concept_map: books/vol1/15_responsible_engr/responsible_engr_concepts.yml
    learning_claim: The observed trend may not identify the population effect; automation can reinforce a
      blind spot.
    misconception: Launch gates remain valid under selectively observed retraining feedback.
    tradeoff: Selective routine feedback versus audit/exploration costs and unresolved population effects.
    student_action: Replay one through three supplied rounds under routine labels, independent sample or complete
      follow-up, and serving exploration. Trace observed labels into cumulative estimates and next-round exposure;
      distinguish information cost from displaced ranked slots.
    evidence_to_inspect: Round-by-round estimates before and after, exposed and missing request labels, realized
      helpful exposures, independent follow-up counts and displaced ranked slots. First-round nonresponse
      and later finite reversal; no future projection.
    explanation_prompt: What remains invisible because of what the system chose to observe?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Inspect the feedback loop
  - id: v1_15_D
    title: Matched-service lifecycle energy and emissions
    source_concepts:
    - chapter: 15
      concept: Lifecycle TCO
      concept_map: books/vol1/15_responsible_engr/responsible_engr_concepts.yml
    - chapter: 15
      concept: Energy to carbon
      concept_map: books/vol1/15_responsible_engr/responsible_engr_concepts.yml
    learning_claim: A subsystem saving is not a whole-system claim. Declared exclusions and supported service
      govern the comparison.
    misconception: Lower latency or dollars proves lower lifecycle energy and emissions.
    tradeoff: Lower inference energy versus added preparation work, fixed service obligations, and sufficient
      decision-replay evidence. Currency and full lifecycle TCO remain outside this partial investigation.
    student_action: Compare reference and lower-energy execution assumptions at fixed service, then drop a
      request/retraining/explanation obligation or remove/change supplied replay evidence. Explain why a smaller
      total may be ineligible, insufficiently supported, or outweighed by preparation work.
    evidence_to_inspect: Preparation and operating energy, operational carbon under a common illustrative
      grid, fixed service checks, request-level replay mismatches or missing replay, and explicit exclusions.
    explanation_prompt: Does the lower per-decision energy become an eligible total-energy saving after preparation?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Count the whole decision
