  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Responsibility case: intended use and exclusions, affected populations, governing outcome obligations,
    evidence sufficiency, mitigation/audit policy, lifecycle boundary, and unresolved gates.'
