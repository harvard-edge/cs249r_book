lab_concept_map:
  schema_version: 1
  lab_id: v1_10
  chapter: 10
  title: The checkpoint is not the deployed artifact
  source_notebook: labs/vol1/lab_10_model_compress.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/10_model_compression/model_compression_concepts.yml
  chapter_goal: Choose a supported deployment artifact on a quality/resource frontier, or hold conversion
    when evidence is missing.
  core_concepts:
  - id: v1_10_A
    title: Stored package versus live memory
    source_concepts:
    - chapter: 10
      concept: Compression fits a deployment budget
      concept_map: books/vol1/10_model_compression/model_compression_concepts.yml
    - chapter: 10
      concept: Accuracy-efficiency frontier
      concept_map: books/vol1/10_model_compression/model_compression_concepts.yml
    learning_claim: Storage savings may leave the binding live-state allocation untouched.
    misconception: A smaller weight file repairs the live-memory budget.
    tradeoff: Package storage reduction versus live buffers, workspace, and useful behavior.
    student_action: Change a supported representation while retaining separate weight storage, working
      state, buffers, and runtime allocations.
    evidence_to_inspect: Package and live-memory allocations with exact artifact and runtime identities.
    explanation_prompt: Does a smaller stored package repair the live-memory failure?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Locate the failing allocation
  - id: v1_10_B
    title: Precision and observed quality
    source_concepts:
    - chapter: 10
      concept: Quantization regimes and the cliff
      concept_map: books/vol1/10_model_compression/model_compression_concepts.yml
    - chapter: 10
      concept: Measured deployment evidence
      concept_map: books/vol1/10_model_compression/model_compression_concepts.yml
    learning_claim: Quality recovery is supplied evidence, not guaranteed by the technique name; preparation
      has a cost.
    misconception: A named low-precision technique guarantees quality recovery.
    tradeoff: Narrower representation versus observed quality and recovery preparation cost.
    student_action: Compare supported post-training and training-aware candidates on matched calibration
      and held-out cases.
    evidence_to_inspect: Discrete calibrated/held-out outcomes, quality cliffs, and recovery preparation.
    explanation_prompt: Does additional preparation rescue a narrower representation?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Evaluate the numerical artifact
  - id: v1_10_C
    title: Representation versus executed work
    source_concepts:
    - chapter: 10
      concept: Structured vs unstructured pruning
      concept_map: books/vol1/10_model_compression/model_compression_concepts.yml
    - chapter: 10
      concept: When fewer bits run faster
      concept_map: books/vol1/10_model_compression/model_compression_concepts.yml
    learning_claim: Payload reduction, traffic reduction, and faster kernels are different claims.
    misconception: Zeros or fewer bits automatically remove executed work.
    tradeoff: Compressed payload versus metadata, conversion, executable format support, and unchanged
      work.
    student_action: Compare masked, indexed, structurally smaller, and supported precision paths with
      metadata and conversion included.
    evidence_to_inspect: Executed representation path including metadata, conversion, traffic, and unchanged
      work.
    explanation_prompt: Do zeros or fewer bits remove executed work on this runtime?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Follow representation into execution
  - id: v1_10_D
    title: Transformation composition and artifact evidence
    source_concepts:
    - chapter: 10
      concept: Combined techniques do not multiply
      concept_map: books/vol1/10_model_compression/model_compression_concepts.yml
    - chapter: 10
      concept: Measured deployment evidence
      concept_map: books/vol1/10_model_compression/model_compression_concepts.yml
    learning_claim: Independent ratios do not certify a composite artifact; fixed work remains and transformation
      order can matter.
    misconception: The benefits of individually good transformations multiply in a combined artifact.
    tradeoff: Additional transformations versus exact composite quality, runtime support, and fixed costs.
    student_action: Compare exact ordered artifacts against single transformations, preserving missing
      outcome evidence and unsupported paths.
    evidence_to_inspect: Identified ordered artifacts with actual supported outcomes and missing or failed
      gates.
    explanation_prompt: Does combining useful transformations still produce a supported candidate?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Test the composition
  primary_concept_dispositions:
  - concept: Accuracy-efficiency frontier
    disposition: interactive
    lab_concepts:
    - v1_10_A
  - concept: Compression fits a deployment budget
    disposition: interactive
    lab_concepts:
    - v1_10_A
  - concept: Structured vs unstructured pruning
    disposition: interactive
    lab_concepts:
    - v1_10_C
  - concept: Quantization regimes and the cliff
    disposition: interactive
    lab_concepts:
    - v1_10_B
  - concept: When fewer bits run faster
    disposition: interactive
    lab_concepts:
    - v1_10_C
  - concept: Combined techniques do not multiply
    disposition: interactive
    lab_concepts:
    - v1_10_D
  - concept: Measured deployment evidence
    disposition: interactive
    lab_concepts:
    - v1_10_B
    - v1_10_D
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 10
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 10
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 10
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 10
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Deployment bundle: exact task-specific model, transforms, associated state and representation,
    calibration and quality evidence, runtime identity, resource gates, rejected artifact, and open obligations.'

  student_goals:
  - "Separate deployed package, working set, and latency constraints."
  - "Judge precision using task outcomes and preparation cost."
  - "Compare stored sparsity with executed work and metadata."
  - "Evaluate distillation and ordered combinations using exact supported outcomes."
  runtime_parts:
  - part: "A"
    title: "Deployment allocations"
    question: "Which resource must compression save?"
    goal: "Locate the package, live-memory, or latency constraint that a transformation must address."
    next: "After locating the binding resource, test numerical precision against task outcomes and preparation cost."
    concept_ids: ["v1_10_A"]
    coverage: "implemented"
    limitation: ""
  - part: "B"
    title: "Precision and task evidence"
    question: "How much precision can the task lose?"
    goal: "Compare precision candidates using supplied quality outcomes and preparation effort."
    next: "Now compare sparse representations: fewer stored values need a supported execution path."
    concept_ids: ["v1_10_B"]
    coverage: "implemented"
    limitation: ""
  - part: "C"
    title: "Sparse execution"
    question: "When do fewer weights execute faster?"
    goal: "Separate stored metadata, removed values, and actually executable work."
    next: "Compare a new dense student with the sparse and precision approaches, including the preparation it must repay."
    concept_ids: ["v1_10_C"]
    coverage: "implemented"
    limitation: ""
  - part: "D"
    title: "Distillation investment"
    question: "Does the deployment lifetime repay student preparation?"
    goal: "Judge whether a dense student repays its preparation over a stated lifetime."
    next: "Test whether the useful transformations still work when applied in an explicit order."
    concept_ids: ["v1_10_C"]
    coverage: "reference"
    limitation: "Dense student comparison extends representation analysis; supplied student outcomes are not inferred from size."
  - part: "E"
    title: "Ordered composition"
    question: "Do individually useful transformations still compose?"
    goal: "Test an ordered composition using exact artifact outcomes and missing evidence."
    next: "Defend one exact release recipe, a tested alternative, and the evidence that remains missing."
    concept_ids: ["v1_10_D"]
    coverage: "implemented"
    limitation: ""
