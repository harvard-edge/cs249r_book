lab_concept_map:
  schema_version: 1
  lab_id: v1_00
  chapter: 0
  title: Welcome to your deployment project
  source_notebook: labs/vol1/lab_00_introduction.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: null
  chapter_goal: Choose a deployment project and practice predicting, comparing, and saving your work.
  core_concepts:
  - id: v1_00_A
    title: Mission and system boundary
    source_concepts: []
    learning_claim: Device categories are contexts with different obligations, not a ranking from weak
      to strong.
    misconception: The most powerful category is the best project.
    tradeoff: Project interest and mission constraints; no category is universally preferred.
    student_action: Compare two mission cards, identify their stakeholder and system boundary, then choose
      one project.
    evidence_to_inspect: Compare mission, stakeholder, boundary, and upcoming-question cards.
    explanation_prompt: What changes when the deployment category changes, and what remains the same learning
      question?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: interface orientation
    investigation_title: Meet the projects
  - id: v1_00_B
    title: Live state versus captured evidence
    source_concepts: []
    learning_claim: A prediction is not an observation; a capture does not follow later control changes.
    misconception: Moving a control also changes the saved evidence.
    tradeoff: Fast live exploration versus preserving an interpretable frozen contrast.
    student_action: 'Use labeled interface-practice cases: predict, change a case, pin a baseline, capture
      a contrast, and move the live control again.'
    evidence_to_inspect: Compare pinned/captured settings with the changed live case and original prediction.
    explanation_prompt: Which action changes the live result, and which preserves evidence?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: interface orientation
    investigation_title: Rehearse an investigation
  - id: v1_00_C
    title: Session state, storage, and recovery
    source_concepts: []
    learning_claim: Session state, a stored record, and a downloaded file have different meanings. Do
      not promise resume until it exists.
    misconception: A session capture is automatically durable or resumable.
    tradeoff: Convenient local state versus the explicit actions needed to keep and recover work.
    student_action: Try the implemented storage/readback path and download a rehearsal discussion; expose
      a storage failure and its fallback honestly.
    evidence_to_inspect: Inspect actual storage/readback state and downloaded rehearsal record; show failure
      separately.
    explanation_prompt: What survives closing this page?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: interface orientation
    investigation_title: Practice keeping work
  - id: v1_00_D
    title: Evidence handoff
    source_concepts: []
    learning_claim: The submission communicates an investigation, not a quiz score or a declaration that
      the project works.
    misconception: A submission reports the correct answer rather than the investigation.
    tradeoff: A concise handoff versus enough provenance to explain the investigation.
    student_action: Inspect a short discussion built from the actual rehearsal; distinguish the selected
      project, original prediction, saved comparison, and next question.
    evidence_to_inspect: Inspect the exported scenario identity, prediction, saved contrast, and handoff.
    explanation_prompt: What will an instructor receive?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: interface orientation
    investigation_title: Make the first handoff
  primary_concept_dispositions: []
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 0
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 0
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 0
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 0
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Project introduction: mission identity and version, stakeholder, task, endpoint/development-host
    boundary, and a successful setup rehearsal or explicit storage fallback.'
  student_goals:
  - Identify a project stakeholder, task, and deployment boundary.
  - Distinguish a prediction, a live control, and a captured comparison.
  - Check which work is saved and download your work.
  - Explain what the next lab investigates without treating setup as validation.
  runtime_parts:
  - part: A
    title: Choose your deployment project
    question: Which mission and system boundary do you want to investigate?
    goal: Compare the projects before selecting a track.
    concept_ids:
    - v1_00_A
    coverage: implemented
    limitation: Interface rehearsal only; no system feasibility is established.
    next: Rehearse how you will investigate the chosen project.
    artifact: Two project briefs with the selected stakeholder and boundary.
    scope: Interface rehearsal only; no system feasibility is established.
  - part: B
    title: Rehearse the investigation
    question: Which action changes the live case, and which retains a comparison?
    goal: Predict, change the case, capture, then change the live case again.
    concept_ids:
    - v1_00_B
    coverage: implemented
    limitation: Interface rehearsal only; no system feasibility is established.
    next: Check what survives beyond this session.
    artifact: The original prediction, changed live case, and frozen captured comparison.
    scope: Interface rehearsal only; no system feasibility is established.
  - part: C
    title: Keep your work
    question: What has actually been stored, and what can you download?
    goal: Save your progress and check that it can be restored.
    concept_ids:
    - v1_00_C
    coverage: implemented
    limitation: Interface rehearsal only; no system feasibility is established.
    next: Prepare a clear handoff to the first technical investigation.
    artifact: Confirmation of saved progress and a download of your work.
    scope: Interface rehearsal only; no system feasibility is established.
  - part: D
    title: Start the first investigation
    question: What have you practiced, and what will you investigate next?
    goal: Identify the next question and the limits of the rehearsal.
    concept_ids:
    - v1_00_D
    coverage: implemented
    limitation: Interface rehearsal only; no system feasibility is established.
    next: The introduction asks which evidence should guide your first intervention.
    artifact: A handoff naming what setup establishes and what remains untested.
    scope: Interface rehearsal only; no system feasibility is established.
  prerequisites: []
  narrative:
    situation: >-
      Welcome to a project that continues through Volume I. Choose TinyML, MobileML, EdgeML, or CloudML
      to follow a ring, a personal media assistant, an autonomous perception system, or a recommendation
      service. Your choice changes the story and the constraints you investigate; each lab explores
      the same chapter concepts. Start with the situation, predict what a choice will change, try a
      contrasting option, and explain what happened. Parts A onward guide that investigation, and the
      final discussion connects your findings to the next chapter. Today you will try that workflow
      before the technical investigations begin.
    previously: No installation or earlier lab is required for the browser route.
    submission: Your work, including your selected project and actual rehearsal comparison. Save your progress and
      check that it can be restored, or retain the download if storage is unavailable.
