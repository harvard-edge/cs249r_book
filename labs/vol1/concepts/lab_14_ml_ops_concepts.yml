lab_concept_map:
  schema_version: 1
  lab_id: v1_14
  chapter: 14
  title: An update breaks the contract without crashing
  source_notebook: labs/vol1/lab_14_ml_ops.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
  chapter_goal: Create an evidence-based incident response with replayable lineage, feasible rollout,
    and tested recovery.
  student_goals:
  - Distinguish a proxy alert from confirmed outcome failure at the time evidence is available.
  - Diagnose request-keyed parity failures and distinguish a version identity from recoverable compatible artifacts.
  - Screen rollout capacity and delayed outcome evidence; retest compatible release state and distinguish containment
    from a cause-specific recovery.
  runtime_parts:
  - part: A
    title: Observe without assuming
    question: Does an early proxy alert establish outcome failure?
    goal: Compare alerts with delayed labeled outcomes.
    concept_ids:
    - v1_14_A
    coverage: implemented
    limitation: ''
    next: Test whether the team can replay what ran, not just match aggregate values.
  - part: B
    title: Replay what ran
    question: Which requests and artifacts establish parity?
    goal: Compare request-keyed transformed values, versioned bundle identity, and compatible replay.
    concept_ids:
    - v1_14_B
    coverage: implemented
    limitation: This finite fitted-transform replay does not verify unseen inputs, a full model runtime, or external
      cached state.
    next: Keep replay evidence separate from the economics of retraining.
  - part: C
    title: Schedule retraining
    question: When should the team spend resources on an update?
    goal: Compare calendar and evidence-triggered policies on the supplied outcome trace.
    concept_ids:
    - v1_14_A
    coverage: reference
    limitation: This is a retraining-economics extension, not request-keyed parity or immutable-lineage verification.
    next: Inspect the release evidence before promoting the update.
    explanation_prompt: Which policy earns its training cost, and what delays or release evidence limit the claim?
  - part: D
    title: Limit exposure while gathering evidence
    question: Can the release fit while enough outcome evidence matures?
    goal: Screen full artifact-copy residency, then compare delayed launch, exposure and mature cohort evidence
      under a fixed deadline.
    concept_ids:
    - v1_14_C
    coverage: implemented
    limitation: Registry-backed artifact sizes with declared shared-pool/background reservations and a finite
      supplied outcome trace. Execution SRAM, compute contention, fragmentation, power and statistical significance
      remain unestablished.
    next: Retest the exact release and request state that rollback must preserve.
    explanation_prompt: Why does lowering nonzero exposure leave copy residency unchanged, and what evidence
      is lost when launch waits?
  - part: E
    title: Restore a compatible request contract
    question: Does a fast routing revert establish recovery?
    goal: Retest new and already-admitted request bundles; compare pinned drain with confirmed cancellation,
      log quarantine and a cause rollback cannot repair.
    concept_ids:
    - v1_14_D
    coverage: implemented
    limitation: Two deterministic component-version compatibility cases, with no request-output or cache-content replay, supplied response durations and assumed cancellation
      acknowledgment. This does not certify predictive quality, repair population shift, or cleanse downstream
      data.
    next: Use the saved allocation, exact-bundle retest and remaining uncertainty to justify release or hold.
    explanation_prompt: Which request or future-training obligation remains broken, which response addresses
      it, and what does that response retain or cancel?
  core_concepts:
  - id: v1_14_A
    title: Signals, outcomes, and detection delay
    source_concepts:
    - chapter: 14
      concept: Operations loop
      concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
    - chapter: 14
      concept: Layered monitoring and detection delay
      concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
    learning_claim: An alert is a request for investigation, not proof of damage or a justified retraining
      action.
    misconception: A sensitive alert confirms task damage or justifies retraining.
    tradeoff: Earlier detection versus false or unconfirmed alerts, delayed labels, and response work.
    student_action: Choose a monitor, replay early and late evidence windows, and compare alert sensitivity
      with confirmation and response cost.
    evidence_to_inspect: Signal and outcome maturity timeline with monitor detections and response cost.
    explanation_prompt: What can the team infer now, before delayed outcomes mature?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Observe without assuming
  - id: v1_14_B
    title: Request-keyed parity and reproducible lineage
    source_concepts:
    - chapter: 14
      concept: Request-keyed parity testing
      concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
    - chapter: 14
      concept: Reproducibility and the model registry
      concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
    learning_claim: Aggregate distributions can hide swapped values; replay needs artifacts, fitted state,
      and provenance.
    misconception: Matching histograms or version labels proves request-level parity.
    tradeoff: Convenient aggregate screening versus request-keyed replay and exact recoverable lineage.
    student_action: Compare request-keyed transformed values and immutable release identities; repair
      a supplied mismatch while preserving the original inputs.
    evidence_to_inspect: Request-keyed feature values, artifact lineage, and recoverable versions.
    explanation_prompt: Does distributional similarity or a version label establish parity?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Replay what ran
  - id: v1_14_C
    title: Rollout exposure and resident capacity
    source_concepts:
    - chapter: 14
      concept: Release safety costs resident memory
      concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
    - chapter: 14
      concept: Safe release and tested rollback
      concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
    learning_claim: Exposure, evidence strength, copy residency, and simultaneous execution are separate
      quantities.
    misconception: A small canary traffic share requires proportionally little resident memory.
    tradeoff: Lower exposure versus time to evidence and full candidate/baseline residency.
    student_action: Change canary exposure, inspect complete candidate/baseline reservations, and choose
      a feasible staged or held rollout.
    evidence_to_inspect: Exposure, candidate/baseline resident reservations, feasible rollout states,
      and missing outcome evidence.
    explanation_prompt: Does a small exposure share imply a small resident-memory cost?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Reserve a safe transition
  - id: v1_14_D
    title: Cause-specific recovery
    source_concepts:
    - chapter: 14
      concept: Safe release and tested rollback
      concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
    - chapter: 14
      concept: Operations loop
      concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
    learning_claim: Containment is not verified recovery, and the right response depends on the cause.
    misconception: Reverting weights repairs every incident.
    tradeoff: Rapid containment versus verified recovery of the actual contract and cause.
    student_action: Test an inadequate rollback, then recover the compatible transform/model/runtime/state
      bundle; contrast a population shift that rollback cannot repair.
    evidence_to_inspect: Affected requests before/after cause-specific recovery, including an ineffective
      rollback.
    explanation_prompt: Does reverting weights restore the system?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Recover the cause
  primary_concept_dispositions:
  - concept: Operations loop
    disposition: interactive
    lab_concepts:
