lab_concept_map:
  schema_version: 1
  lab_id: v1_03
  chapter: 3
  title: A late requirement makes earlier work conditional
  source_notebook: labs/vol1/lab_03_ml_lifecycle.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/03_ml_lifecycle/ml_lifecycle_concepts.yml
  chapter_goal: Trace a requirement through the lifecycle and plan a justified repair, retest, and return
    path.
  core_concepts:
  - id: v1_03_A
    title: Constraint propagation through artifacts
    source_concepts:
    - chapter: 3
      concept: Constraint propagation
      concept_map: books/vol1/03_ml_lifecycle/ml_lifecycle_concepts.yml
    - chapter: 3
      concept: Problem framing
      concept_map: books/vol1/03_ml_lifecycle/ml_lifecycle_concepts.yml
    - chapter: 3
      concept: Stage interface contracts
      concept_map: books/vol1/03_ml_lifecycle/ml_lifecycle_concepts.yml
    learning_claim: Neither rebuilding everything nor changing packaging alone is a general solution.
    misconception: A late change requires either rebuilding everything or changing packaging alone.
    tradeoff: Preserving valid artifacts versus paying to revise and retest affected dependencies.
    student_action: Mark revise/preserve choices on a dependency graph, then inspect the affected artifact
      versions and unsupported claims.
    evidence_to_inspect: Dependency graph showing preserved, changed, invalid, and unverified artifacts.
    explanation_prompt: Which artifacts depend on the changed requirement?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Make the requirement travel
  - id: v1_03_B
    title: Checking time and downstream rework
    source_concepts:
    - chapter: 3
      concept: Constraint propagation
      concept_map: books/vol1/03_ml_lifecycle/ml_lifecycle_concepts.yml
    learning_claim: Early checking costs time but can avoid downstream rework; effort and elapsed schedule
      are different quantities.
    misconception: Earlier checks are free, or only training time matters to the schedule.
    tradeoff: Early inspection effort versus avoided downstream rework and elapsed development opportunity.
    student_action: Move discovery of the same defect between development stages while preserving repair
      tasks and resource assumptions.
    evidence_to_inspect: Matched checking/rework schedules with effort and elapsed time shown separately.
    explanation_prompt: When does an earlier target check buy more useful development?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Choose the checking point
  - id: v1_03_C
    title: Release gates and compatible retest
    source_concepts:
    - chapter: 3
      concept: Validation as a release gate
      concept_map: books/vol1/03_ml_lifecycle/ml_lifecycle_concepts.yml
    learning_claim: Detected failure, repaired-but-unverified, missing evidence, and passing evidence
      are distinct states.
    misconception: Finding or repairing a defect establishes release readiness.
    tradeoff: More inspection evidence versus actual repair and compatible retest work.
    student_action: Select an evidence bundle, perform a supported repair, and rerun the affected gate
      on the identified package.
    evidence_to_inspect: Release-gate states before repair, after repair, and after compatible retest.
    explanation_prompt: Do comprehensive checks make the candidate ready?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Repair and retest
  - id: v1_03_D
    title: Lifecycle feedback and ownership
    source_concepts:
    - chapter: 3
      concept: The lifecycle is a loop
      concept_map: books/vol1/03_ml_lifecycle/ml_lifecycle_concepts.yml
    learning_claim: Referral-only outcomes or changed inputs cannot establish population-wide damage or
      a successful repair.
    misconception: An early alert or selectively obtained labels establish population-wide harm.
    tradeoff: Early intervention versus waiting for sufficiently representative outcomes and choosing
      the correct owner.
    student_action: Replay a fixed signal/label timeline and choose the owner and next evidence request.
    evidence_to_inspect: A fixed timeline separating early signals, selective labels, and representative
      outcomes.
    explanation_prompt: What can the team infer before representative outcomes arrive?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Route the first field signal
  primary_concept_dispositions:
  - concept: The lifecycle is a loop
    disposition: interactive
    lab_concepts:
    - v1_03_D
  - concept: Constraint propagation
    disposition: interactive
    lab_concepts:
    - v1_03_A
    - v1_03_B
  - concept: Problem framing
    disposition: interactive
    lab_concepts:
    - v1_03_A
  - concept: Stage interface contracts
    disposition: interactive
    lab_concepts:
    - v1_03_A
  - concept: Validation as a release gate
    disposition: interactive
    lab_concepts:
    - v1_03_C
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 3
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 3
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 3
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 3
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Lifecycle map: requirements and artifact dependencies, preserved and revised identities, checking/repair
    schedule, release obligations, and the owner of the next investigation.'
  student_goals:
  - Trace the selected requirement through the affected lifecycle artifacts.
  - Compare early checking effort with the downstream repair burden.
  - Compare useful target-aware iterations within the same development budget.
  - Distinguish detected defects, repaired-but-unverified artifacts, missing evidence, and compatible retest.
  - Distinguish early signals from delayed task outcomes and choose the stage to revisit.
  runtime_parts:
  - part: A
    title: Requirements across artifacts
    question: Which requirement changes the development plan?
    goal: Trace the selected requirement through the affected lifecycle artifacts.
    concept_ids:
    - v1_03_A
    coverage: implemented
    limitation: ''
    next: Next, investigate checking time.
    artifact: A requirement-to-artifact contrast with changed and preserved stages.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: B
    title: Checking time
    question: When should the team pay to check the target?
    goal: Compare early checking effort with the downstream repair burden.
    concept_ids:
    - v1_03_B
    coverage: implemented
    limitation: ''
    next: Next, investigate iteration opportunities.
    artifact: A matched comparison of checking effort and downstream rework.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: C
    title: Iteration opportunities
    question: Does a faster loop produce a releasable result?
    goal: Compare useful target-aware iterations within the same development budget.
    concept_ids:
    - v1_03_B
    coverage: implemented
    limitation: ''
    next: Next, investigate release evidence.
    artifact: A comparison of completed iterations and releasable outcomes at the same budget.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: D
    title: Release evidence
    question: What evidence supports a release decision?
    goal: Distinguish detected defects, repaired-but-unverified artifacts, missing evidence, and compatible
      retest.
    concept_ids:
    - v1_03_C
    coverage: partial
    limitation: A compatible repaired-artifact retest covers only the named seeded defects, not a real deployment
      release.
    next: Next, investigate field feedback.
    artifact: A check-coverage comparison naming detected defects and blind spots. Captured repair/retest
      action, artifact version, and per-defect gate state.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: E
    title: Field feedback
    question: What should production send backward?
    goal: Distinguish early signals from delayed task outcomes and choose the stage to revisit.
    concept_ids:
    - v1_03_D
    coverage: partial
    limitation: The supplied timeline does not establish representative population-wide harm.
    next: Next, defend one decision using your saved comparisons in Synthesis.
    artifact: A timeline comparison separating signal time, label time, and the chosen return stage.
    scope: Controlled chapter reference; not a deployment measurement.
