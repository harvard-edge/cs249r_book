lab_concept_map:
  schema_version: 1
  lab_id: v1_13
  chapter: 13
  title: Serve useful work when demand arrives
  source_notebook: labs/vol1/lab_13_model_serving.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/13_model_serving/model_serving_concepts.yml
  chapter_goal: Choose a serving policy with an explicit demand envelope, waiting behavior, state fit,
    and lost-service accounting.
  student_goals:
  - Compare complete request paths without treating a faster incompatible path as a valid improvement.
  - Explain how arrivals, batching, and live state change timely useful completions.
  - Keep native recommendation buffers separate from language KV state and first-token versus active-stream scheduling.
  - Defend a serving policy using lost service, resource cost, and its observed demand boundary.
  runtime_parts:
  - part: A
    title: Budget the whole service
    question: Which request path delivers useful work?
    goal: Compare host preparation and model execution changes on the complete latency budget, including resident-memory and preprocessing-contract costs.
    concept_ids:
    - v1_13_A
    coverage: implemented
    limitation: Hypothetical host and compiled-model alternatives declare their speed and resident-memory assumptions. CPU contention, compile/load time, and measured quality or optimizer gains are not modeled.
    next: Keep the valid path fixed and test arriving demand.
  - part: B
    title: Keep headroom honestly
    question: What happens when demand becomes bursty?
    goal: Compare queue growth, tail latency, missed deadlines, and rejected requests.
    concept_ids:
    - v1_13_B
    coverage: implemented
    limitation: ''
    next: Hold arrivals fixed and test batch formation.
  - part: C
    title: Form work deliberately
    question: When does waiting for a batch earn its cost?
    goal: Compare realized batch work and complete-path deadlines on identical arrivals.
    concept_ids:
    - v1_13_C
    coverage: implemented
    limitation: ''
    next: Check whether the live requests fit in memory.
  - part: D
    title: Fit the live workload
    question: Do model weights fitting imply concurrent requests fit?
    goal: Compare fixed residency with per-request state, concurrency limits, and static versus continuous slot admission on a bounded decode trace.
    concept_ids:
    - v1_13_D
    coverage: implemented
    limitation: Native request-state capacity and a separate chunked-prefill scheduling reference are implemented.
      Relative-history KV allocation and finite static/continuous decode-admission traces are supported. Supplied constant iteration times isolate slot refill; prefill interference, output-token cache growth, allocator overhead, context-dependent execution timing, and device calibration remain outside this study.
    next: Use the state and demand evidence to choose an operating policy.
  - part: E
    title: Choose an operating policy
    question: Which overload response preserves useful service?
    goal: Compare provisioned resource time, deadlines, and lost service.
    concept_ids:
    - v1_13_B
    - v1_13_C
    coverage: implemented
    limitation: ''
    next: Combine the saved contrasts into one bounded recommendation.
  core_concepts:
  - id: v1_13_A
    title: The complete service path
    source_concepts:
    - chapter: 13
      concept: Serving inverts training
      concept_map: books/vol1/13_model_serving/model_serving_concepts.yml
    - chapter: 13
      concept: Latency budget
      concept_map: books/vol1/13_model_serving/model_serving_concepts.yml
    learning_claim: A forward pass is only part of the service, and moving work can add transfer or preparation.
    misconception: The model forward pass is the complete service.
    tradeoff: Local compute gains versus full-path preparation, transfer, and response work.
    student_action: Compare supported host/model interventions on the same full service path.
    evidence_to_inspect: User-visible path decomposition at identical task and input contracts.
    explanation_prompt: Which stage reaches the user, and which local improvement survives?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: native mission with explicitly named reference contrasts
    investigation_title: Budget the whole service
  - id: v1_13_B
    title: Queueing headroom and admission
    source_concepts:
    - chapter: 13
      concept: Queueing sets headroom
      concept_map: books/vol1/13_model_serving/model_serving_concepts.yml
    learning_claim: Waiting can grow sharply as demand approaches service capacity. Headroom and admission
      address different parts of that problem; completed-work latency alone omits rejected service.
    misconception: A lower completed-request tail proves better service even when more work is rejected.
    tradeoff: Admission/headroom versus waiting and lost useful service on identical arrivals.
    student_action: First hold admission fixed and vary supported offered load at fixed service capacity,
      or compare supported service-capacity cases on identical arrivals. Inspect waiting as utilization
      approaches capacity. Then compare admission as a separate overload response, counting rejected or
      deferred useful work.
    evidence_to_inspect: Matched-arrival utilization, waiting, backlog, and tail traces for different
      supported headroom cases, followed by accepted/rejected work and the changed latency denominator.
    explanation_prompt: Does improved tail latency come from better service or refusing more work?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: native mission with explicitly named reference contrasts
    investigation_title: Keep headroom honestly
  - id: v1_13_C
    title: Batch formation versus useful throughput
    source_concepts:
    - chapter: 13
      concept: Batching trades latency for throughput
      concept_map: books/vol1/13_model_serving/model_serving_concepts.yml
    learning_claim: A longer batching window adds waiting even when it produces no batching benefit.
    misconception: A longer batch window necessarily reduces executed work.
    tradeoff: Formation waiting versus realized batching work savings, memory, and deadlines.
    student_action: Compare immediate and supported batch dispatch on identical traces; separate formation
      delay, realized groups, executed work, and deadline outcomes.
    evidence_to_inspect: Realized groups, formation waits, executed work, state, and deadline outcomes.
    explanation_prompt: Does waiting for a batch actually save execution?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: native mission with explicitly named reference contrasts
    investigation_title: Form work deliberately
  - id: v1_13_D
    title: Live-state capacity and language-phase references
    source_concepts:
    - chapter: 13
      concept: LLM serving phases
      concept_map: books/vol1/13_model_serving/model_serving_concepts.yml
    - chapter: 13
      concept: KV cache budget bounds concurrency
      concept_map: books/vol1/13_model_serving/model_serving_concepts.yml
    learning_claim: Model residency, per-request state, and native task requirements are different. A
      ranking embedding table is not a KV cache.
    misconception: Weights fitting establish live-work fit, and recommendation state is interchangeable
      with language KV state.
    tradeoff: Live workload/concurrency versus native state fit; language phase references trade first-token
      delay against active-stream cadence; bounded static/continuous traces separate slot waste, request latency, token throughput, and reserved memory.
    student_action: Cross and recover native buffer/concurrency capacity; keep any generative phase/KV
      comparison a separately named reference. Vary response-length mix and prepared-request arrival pressure on the same finite trace, then identify when slot refill helps or stops helping.
    evidence_to_inspect: Native model/workspace/live-state reservations; separately identified language
      phase/KV reference.
    explanation_prompt: Do the weights fitting imply the service can run its live workload?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: native mission with explicitly named reference contrasts
    investigation_title: Fit live work
