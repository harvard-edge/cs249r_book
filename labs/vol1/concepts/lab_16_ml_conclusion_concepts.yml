lab_concept_map:
  schema_version: 1
  lab_id: v1_16
  chapter: 16
  title: Defend one coherent deployment decision
  source_notebook: labs/vol1/lab_16_ml_conclusion.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/16_conclusion/conclusion_concepts.yml
  chapter_goal: Integrate earlier concepts into a release, restriction, baseline, fallback, or hold decision
    without inventing a new score.
  student_goals:
  - Audit whether saved claims are missing, incompatible, replayed, or supported for the same project.
  - Compare a complete prepared alternative across physical and supplied quality requirements.
  - Find a recommendation boundary and explain which evidence fails to transfer.
  - Diagnose a finite behavioral counterexample and compare cause-specific responses using compatible retests.
  runtime_parts:
  - part: A
    title: Audit the supporting story
    question: Which claims does the actual ledger support?
    goal: Distinguish missing, incompatible, unreplayed, and replayed evidence.
    concept_ids:
    - v1_16_A
    coverage: implemented
    limitation: ''
    next: Keep that audit separate while evaluating a prepared alternative.
  - part: B
    title: Carry an improvement through
    question: Does the alternative help the complete design?
    goal: Compare physical margins and separately supplied matched-task quality.
    concept_ids:
    - v1_16_B
    coverage: implemented
    limitation: ''
    next: Keep the design fixed and tighten one requirement.
  - part: C
    title: Find the recommendation boundary
    question: When does the same design stop meeting the requirement?
    goal: Compare unchanged consumption with a changed allowance.
    concept_ids:
    - v1_16_C
    coverage: implemented
    limitation: ''
    next: Ask which claims survive a new deployment envelope.
  - part: D
    title: Test claim transfer
    question: Which physical and behavioral claims survive a new setting?
    goal: Diagnose a changed transform or population, test a scoped response, and separate its behavioral retest from execution evidence.
    concept_ids:
    - v1_16_D
    coverage: implemented
    limitation: Exact finite rules and cases support a scoped counterexample and retest, not native-project quality or a learned repair. A replacement rule still lacks new execution measurements.
    artifact: A saved changed-setting and response comparison with matching artifact/population/protocol identity, case outcomes, review work, and independent execution-evidence state.
    explanation_prompt: Why does this response address this cause, and which evidence remains unavailable?
    reversal_probe: Switch the cause while keeping the same response. Does the compatible retest still support it?
    next: Write a bounded final recommendation and the next evidence-gathering action.
  core_concepts:
  - id: v1_16_A
    title: Evidence compatibility
    source_concepts:
    - chapter: 4
      concept: Data as code practice
      concept_map: books/vol1/04_data_engineering/data_engineering_concepts.yml
    - chapter: 14
      concept: Reproducibility and the model registry
      concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
    learning_claim: Completion counts and a shared project name do not establish compatibility.
    misconception: A full set of green earlier records establishes this release.
    tradeoff: Reusing existing results versus the compatibility work needed to support the exact proposed
      release.
    student_action: Inspect purported supporting records and replay or reject links by requirement, data,
      artifact, runtime, protocol, population, and operating identity.
    evidence_to_inspect: Compatible, expired, missing, and conflicting records for one proposed release.
    explanation_prompt: Do these earlier passes refer to the same proposed system?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: integration of prior concepts
    investigation_title: Audit the supporting story
  - id: v1_16_B
    title: Complete-path and artifact coherence
    source_concepts:
    - chapter: 1
      concept: Dual mandate
      concept_map: books/vol1/01_introduction/introduction_concepts.yml
    - chapter: 11
      concept: Amdahl's law
      concept_map: books/vol1/11_hw_acceleration/hw_acceleration_concepts.yml
    learning_claim: Local wins do not compose automatically; rejected alternatives must be compared under
      the same contract.
    misconception: Local wins compose without checking the same artifact and complete path.
    tradeoff: A selected local improvement versus simultaneous resource, quality, and service requirements.
    student_action: Reuse a supported candidate comparison and inspect joint resource, behavioral, and
      service consequences.
    evidence_to_inspect: Selected/rejected exact artifacts compared over the same complete path and obligations.
    explanation_prompt: Does the selected alternative preserve its benefit on the complete path?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: integration of prior concepts
    investigation_title: Carry one improvement through
  - id: v1_16_C
    title: Recommendation scope and reversal
    source_concepts:
    - chapter: 2
      concept: Screen then cost
      concept_map: books/vol1/02_system_paradigms/system_paradigms_concepts.yml
    - chapter: 13
      concept: Queueing sets headroom
      concept_map: books/vol1/13_model_serving/model_serving_concepts.yml
    learning_claim: A new policy limit changes acceptability, not the original measured consumption.
    misconception: A feasible design is acceptable under every operating requirement.
    tradeoff: Meeting a current allowance versus reserve, scope restrictions, or a justified alternative
      under change.
    student_action: Tighten a supported allowance or demand condition for the same candidate and test
      recovery, restricted scope, or hold.
    evidence_to_inspect: Original consumption versus a changed allowance, demand, or scope and a supported
      response.
    explanation_prompt: What changed requirement would reverse the decision?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: integration of prior concepts
    investigation_title: Find the recommendation boundary
  - id: v1_16_D
    title: Claim expiry and cause-specific response
    source_concepts:
    - chapter: 3
      concept: The lifecycle is a loop
      concept_map: books/vol1/03_ml_lifecycle/ml_lifecycle_concepts.yml
    - chapter: 14
      concept: Safe release and tested rollback
      concept_map: books/vol1/14_ml_ops/ml_ops_concepts.yml
    learning_claim: Physical feasibility and behavioral validity can expire separately. Rollback is not
      a universal answer.
    misconception: Saved behavior evidence remains valid after any deployment or population change.
    tradeoff: Keeping a deployment versus repairing the specific physical or behavioral claim that expired.
    student_action: Apply a supported path or population change, identify expired evidence, and test a
      justified response using familiar instruments.
    evidence_to_inspect: Expired claims and cause-specific retest or recovery after a supported deployment
      change.
    explanation_prompt: Which claim breaks, and which response addresses that cause?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: integration of prior concepts
    investigation_title: Respond to change
  primary_concept_dispositions: []
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 16
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 16
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 16
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 16
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Final deployment dossier and discussion: exact proposed system, supported use and demand,
    chosen/rejected options, compatible evidence references, unresolved obligations, owner, reversal trigger,
    and next decisive test.'
