lab_concept_map:
  schema_version: 1
  lab_id: v1_05
  chapter: 5
  title: Open the model and inspect its state
  source_notebook: labs/vol1/lab_05_nn_compute.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/05_nn_computation/nn_computation_concepts.yml
  chapter_goal: Explain how topology, gradient dependencies, phase, and batching change work, movement,
    and live state.
  core_concepts:
  - id: v1_05_A
    title: Topology, nonlinearity, and layer cost
    source_concepts:
    - chapter: 5
      concept: Network as linear maps and nonlinearities
      concept_map: books/vol1/05_nn_computation/nn_computation_concepts.yml
    - chapter: 5
      concept: Cost from layer shapes
      concept_map: books/vol1/05_nn_computation/nn_computation_concepts.yml
    learning_claim: Parameter count alone neither explains expressivity nor captures every computation
      cost.
    misconception: More layers or parameters provide the required expressivity and explain all costs.
    tradeoff: Topology and information capacity versus layer work, movement, and intermediate state.
    student_action: Inspect layer-level work and parameter/activation allocations after a supported topology
      change; contrast linear composition with a required nonlinear mapping.
    evidence_to_inspect: Layer shapes, work, and weight/activation allocations with a linear/nonlinear
      contrast.
    explanation_prompt: Does width or depth change every part of the computation in the same way?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Change topology
  - id: v1_05_B
    title: Derivative dependencies
    source_concepts:
    - chapter: 5
      concept: Backprop over saved activations
      concept_map: books/vol1/05_nn_computation/nn_computation_concepts.yml
    learning_claim: Missing state is not a zero gradient. The backward pass has a concrete dependency
      contract.
    misconception: Weights and final loss suffice for every weight gradient.
    tradeoff: Retaining needed forward values versus the cost or impossibility of losing required derivative
      inputs.
    student_action: Step through a small dependency graph and remove or restore the values needed by the
      derivative.
    evidence_to_inspect: Forward/backward dependency trace showing required present and missing operands.
    explanation_prompt: Can the weight gradient be computed after its required forward value is discarded?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Keep what differentiation needs
  - id: v1_05_C
    title: Phase-specific model state
    source_concepts:
    - chapter: 5
      concept: Training holds four kinds of state
      concept_map: books/vol1/05_nn_computation/nn_computation_concepts.yml
    learning_claim: Weights, saved activations, gradients, and optimizer state scale differently.
    misconception: An inference model that fits can also be trained in that memory.
    tradeoff: Phase and batch choices versus weights, activations, gradients, and optimizer allocations.
    student_action: Compare phase-specific allocations for the same model and vary the batch without silently
      changing optimizer or numerical format.
    evidence_to_inspect: Phase-specific weights, saved activations, gradients, optimizer state, and capacity.
    explanation_prompt: Does endpoint inference fit imply host training fit?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Separate training and inference
  - id: v1_05_D
    title: Batch reuse and capacity
    source_concepts:
    - chapter: 5
      concept: Batching raises dense-layer intensity
      concept_map: books/vol1/05_nn_computation/nn_computation_concepts.yml
    - chapter: 5
      concept: Cost from layer shapes
      concept_map: books/vol1/05_nn_computation/nn_computation_concepts.yml
    learning_claim: Better arithmetic intensity is valuable only inside a legal state budget; this does
      not yet design a serving scheduler.
    misconception: Better weight reuse necessarily yields a feasible batch.
    tradeoff: Amortized weight movement versus activation storage and legal batch capacity.
    student_action: Grow a supported batch and inspect weight traffic per useful example beside activation
      memory and capacity.
    evidence_to_inspect: Per-useful-example traffic or intensity beside live activations and no-fit status.
    explanation_prompt: Can batching improve reuse and still make the design infeasible?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Trade reuse for live state
  primary_concept_dispositions:
  - concept: Network as linear maps and nonlinearities
    disposition: interactive
    lab_concepts:
    - v1_05_A
  - concept: Cost from layer shapes
    disposition: interactive
    lab_concepts:
    - v1_05_A
    - v1_05_D
  - concept: Backprop over saved activations
    disposition: interactive
    lab_concepts:
    - v1_05_B
  - concept: Training holds four kinds of state
    disposition: interactive
    lab_concepts:
    - v1_05_C
  - concept: Batching raises dense-layer intensity
    disposition: interactive
    lab_concepts:
    - v1_05_D
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 5
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 5
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 5
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 5
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'Computation ledger: shapes, layer work, phase-specific state, required gradient dependencies,
    and a justified batch/state envelope.'
  student_goals:
  - Relate tensor dimensions to costs, then compare the same fixed weights with and without a nonlinearity.
  - Compare phase-specific memory and trace which backward derivatives require retained forward operands.
  - Compare batch throughput, per-batch latency, and memory feasibility.
  - Inspect a supplied precision failure alongside its storage benefit.
  - Compare candidate repairs from the same failed training baseline.
  runtime_parts:
  - part: A
    title: Tensor dimensions
    question: What becomes expensive when a dimension grows?
    goal: Relate tensor dimensions to costs, then compare the same fixed weights with and without a nonlinearity.
    concept_ids:
    - v1_05_A
    coverage: partial
    limitation: The fixed-weight nonlinear reference shows an exact mapping, not training or target quality.
    next: Next, investigate phase-specific state.
    artifact: A dimension-change contrast showing arithmetic, parameter, and activation effects. Captured
      fixed-weight mapping and activation choice.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: B
    title: Phase-specific state
    question: Why can inference fit while training fails?
    goal: Compare phase-specific memory and trace which backward derivatives require retained forward operands.
    concept_ids:
    - v1_05_B
    - v1_05_C
    coverage: implemented
    limitation: The exact scalar derivative reference excludes recomputation, timing, and optimizer behavior.
    next: Next, investigate batching.
    artifact: A phase-state contrast identifying the memory components and fit status. Captured derivative
      trace and retained-operand setting.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: C
    title: Batching
    question: Does batching make every request faster?
    goal: Compare batch throughput, per-batch latency, and memory feasibility.
    concept_ids:
    - v1_05_D
    coverage: implemented
    limitation: ''
    next: Next, investigate numerical representation.
    artifact: A batch contrast showing throughput, latency, and memory together.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: D
    title: Numerical representation
    question: Can fewer bytes produce an invalid answer?
    goal: Inspect a supplied precision failure alongside its storage benefit.
    concept_ids:
    - v1_05_A
    - v1_05_C
    coverage: reference
    limitation: The numerical case explores representation; the derivative-dependency reference is in Part
      B.
    next: Next, investigate repairing the failed case.
    artifact: A precision contrast linking changed representation to the actual numerical result.
    scope: Controlled chapter reference; not a deployment measurement.
  - part: E
    title: Repairing the failed case
    question: Which intervention fixes the observed failure?
    goal: Compare candidate repairs from the same failed training baseline.
    concept_ids:
    - v1_05_C
    - v1_05_D
    coverage: partial
    limitation: This repair case integrates state and batching; it does not validate convergence or target
      quality.
    next: Next, defend one decision using your saved comparisons in Synthesis.
    artifact: A repair decision naming the tested alternative, fit status, and remaining numerical uncertainty.
    scope: Controlled chapter reference; not a deployment measurement.
