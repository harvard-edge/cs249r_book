lab_concept_map:
  schema_version: 1
  lab_id: v1_01
  chapter: 1
  title: The system runs. Is it useful?
  source_notebook: labs/vol1/lab_01_ml_intro.py
  shared_contract: schema.yml
  status: proposed learning design
  source_chapter_concept_map: books/vol1/01_introduction/introduction_concepts.yml
  chapter_goal: Choose the next data, algorithm, or machine intervention using separate evidence of behavior
    and execution.
  core_concepts:
  - id: v1_01_A
    title: Data-dependent behavior
    source_concepts:
    - chapter: 1
      concept: Data defines behavior
      concept_map: books/vol1/01_introduction/introduction_concepts.yml
    - chapter: 1
      concept: Silent degradation
      concept_map: books/vol1/01_introduction/introduction_concepts.yml
    learning_claim: An input warning precedes confirmed outcome evidence. Healthy infrastructure cannot
      establish trustworthy behavior.
    misconception: Unchanged code and healthy runtime establish unchanged useful behavior.
    tradeoff: A favorable aggregate result versus behavior under relevant populations and delayed outcome
      evidence.
    student_action: Change the supplied operating-population mixture at fixed candidate and runtime; reveal
      labeled outcomes only when available.
    evidence_to_inspect: Paired population and labeled-outcome views beside unchanged runtime.
    explanation_prompt: Can the system become less useful while weights and execution remain unchanged?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Healthy runtime, changed behavior
  - id: v1_01_B
    title: Bottleneck diagnosis
    source_concepts:
    - chapter: 1
      concept: D·A·M diagnosis
      concept_map: books/vol1/01_introduction/introduction_concepts.yml
    - chapter: 1
      concept: Iron law of ML systems
      concept_map: books/vol1/01_introduction/introduction_concepts.yml
    learning_claim: A large local improvement can leave the dominant term untouched; the intervention
      has a scope and an unpriced cost if no cost evidence is supplied.
    misconception: Faster arithmetic accelerates every part of the path.
    tradeoff: Improvement in one execution term versus unchanged movement and overhead, with upgrade costs
      declared.
    student_action: Compare one capability counterfactual at a time against the same decomposition of
      compute, movement, and overhead.
    evidence_to_inspect: A saved complete-path decomposition before and after one supported intervention.
    explanation_prompt: Would faster arithmetic materially improve the complete path?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Improve the right part of time
  - id: v1_01_C
    title: The dual mandate
    source_concepts:
    - chapter: 1
      concept: Dual mandate
      concept_map: books/vol1/01_introduction/introduction_concepts.yml
    learning_claim: Averages or combined scores cannot compensate for a failed requirement.
    misconception: The most accurate model necessarily meets the deployment goal.
    tradeoff: Task quality versus time, memory, and energy feasibility.
    student_action: Compare task-matched candidates against distinct quality, latency, memory, and energy
      gates; retain failed and unknown candidates visibly.
    evidence_to_inspect: Task-matched candidate frontier with separate passing, failed, and unknown requirements.
    explanation_prompt: Is the best-quality candidate deployable?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Meet both requirements
  - id: v1_01_D
    title: Three efficiency levers
    source_concepts:
    - chapter: 1
      concept: Three efficiency levers
      concept_map: books/vol1/01_introduction/introduction_concepts.yml
    - chapter: 1
      concept: D·A·M diagnosis
      concept_map: books/vol1/01_introduction/introduction_concepts.yml
    learning_claim: Different routes to efficiency have different evidence requirements. Fewer samples
      do not establish equal quality.
    misconception: Any efficiency claim means the same thing and preserves quality.
    tradeoff: Less data, less work per example, or faster execution versus their distinct quality and
      preparation obligations.
    student_action: On the separate development host, compare supported changes in samples, work per sample,
      and realized time per operation while retaining the quality obligation.
    evidence_to_inspect: Host task-factor and quality-evidence comparisons with held assumptions stated.
    explanation_prompt: Which part of the training task would this intervention change?
    assessment: Use a saved contrast to identify the changed and held conditions, explain the causal mechanism
      and competing consequence, and name a condition that could change the choice.
    scope: chapter-owned investigation
    investigation_title: Name the lever
  primary_concept_dispositions:
  - concept: Dual mandate
    disposition: interactive
    lab_concepts:
    - v1_01_C
  - concept: Data defines behavior
    disposition: interactive
    lab_concepts:
    - v1_01_A
  - concept: D·A·M diagnosis
    disposition: interactive
    lab_concepts:
    - v1_01_B
    - v1_01_D
  - concept: Iron law of ML systems
    disposition: interactive
    lab_concepts:
    - v1_01_B
  - concept: Three efficiency levers
    disposition: interactive
    lab_concepts:
    - v1_01_D
  - concept: Silent degradation
    disposition: interactive
    lab_concepts:
    - v1_01_A
  scenario_bindings:
    tinyml:
      scenario_id: wearable-ring.v1
      episode: 1
      source: mlsysim/mlsysim/engine/data/deployment_learning/tinyml.json
    mobile:
      scenario_id: personal-media-assistant.v1
      episode: 1
      source: mlsysim/mlsysim/engine/data/deployment_learning/mobile.json
    edge:
      scenario_id: autonomous-perception.v1
      episode: 1
      source: mlsysim/mlsysim/engine/data/deployment_learning/edge.json
    cloud:
      scenario_id: recommendation-endpoint.v1
      episode: 1
      source: mlsysim/mlsysim/engine/data/deployment_learning/cloud.json
  discussion_contract: One evidence-backed team decision, chosen/rejected alternative, unresolved obligation
    and reversal condition; concise concept interpretations can be reused.
  handoff: 'An initial recommendation: first intervention or hold, chosen and rejected candidate, separate
    behavioral and execution evidence, and the observation that would reverse the decision.'
  student_goals:
  - Compare task outcomes and runtime evidence under a changed input population.
  - Test changes to individual terms in a complete execution budget.
  - Compare candidate models against fixed quality and resource requirements.
  - Distinguish data, algorithm, and execution changes in a separate host study.
  runtime_parts:
  - part: A
    title: Healthy runtime, changed behavior
    question: What evidence would establish whether a changed population affects the task?
    goal: Compare outcomes while the model and execution remain fixed.
    concept_ids:
    - v1_01_A
    coverage: implemented
    limitation: Controlled teaching study; not a measurement of the named deployment project.
    next: Use a separate execution study to investigate the runtime budget.
    artifact: A labeled population contrast with task quality and runtime evidence.
    scope: Controlled teaching study; not a measurement of the named deployment project.
  - part: B
    title: Improve the right part of time
    question: Which execution change is worth investigating first?
    goal: Compare two interventions against the same complete execution budget.
    concept_ids:
    - v1_01_B
    coverage: implemented
    limitation: Controlled teaching study; not a measurement of the named deployment project.
    next: Bring quality and execution constraints together in the candidate decision.
    artifact: Two pinned execution alternatives with the complete time decomposition.
    scope: Controlled teaching study; not a measurement of the named deployment project.
  - part: C
    title: Meet both requirements
    question: Which candidate can you justify advancing under the fixed requirements?
    goal: Use the saved population contrast to compare two candidate models.
    concept_ids:
    - v1_01_C
    coverage: implemented
    limitation: Controlled teaching study; not a measurement of the named deployment project.
    next: Examine which kind of intervention changes the work rather than just a candidate.
    artifact: Two candidate outcomes compared against unchanged deployment gates.
    scope: Controlled teaching study; not a measurement of the named deployment project.
  - part: D
    title: Name the efficiency lever
    question: Which task factor changes under each host-study intervention?
    goal: Compare supported data, algorithm, and machine changes in the separate study.
    concept_ids:
    - v1_01_D
    coverage: implemented
    limitation: Separate illustrative single-host study; it does not validate the deployment endpoint.
    next: Synthesize the saved comparisons before the placement investigation.
    artifact: Two separate host-study interventions with task factors and supplied outcome evidence.
    scope: Separate illustrative single-host study; it does not validate the deployment endpoint.
  prerequisites:
  - Read the introduction sections on task outcomes, the execution budget, and efficiency.
  narrative:
    previously: A supplied illustrative model and population; the host training comparison is a separate
      reference study.
    submission: 'One integrated discussion using four saved comparisons: population outcomes, two execution
      alternatives, a candidate decision, and a separate host-study decision. Explain the mechanism, rejected
      alternative, uncertainty, and revisit condition.'
