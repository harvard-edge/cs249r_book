lab_concept_map:
  schema_version: 1
  volume: vol4
  chapter: 0
  source_notebook: labs/vol4/lab_00_orientation.py
  title: Start the physical AI investigation
  status: development
  source_chapter: books/vol4/frontmatter/prerequisites.qmd
  chapter_goal: Learn how to investigate tradeoffs without confusing a model of a machine with evidence
    from a physical machine.
  student_goals:
  - Distinguish the warehouse reference calculation, a constructed trace, and a physical bench observation.
  - Find the learning goals, all investigation parts, submission, and next decision before opening instruments.
  - Distinguish live, pinned, saved, and stale evidence using one harmless interface rehearsal.
  - Export a discussion that ties a choice to specific evidence and an unresolved condition.
  narrative:
    situation: |
      A warehouse robot needs to collect a mug, open a latched door, and travel through an aisle shared with people.
      Its motors must supply the motion, its observations must stay fresh, and someone must decide when
      it should continue, slow down, or stop.

      You will follow this machine through the volume, from its physical limits and learned policy to sensing,
      planning, supervision, and deployment. Each lab advances that story through one chapter's decisions.
      Predict a consequence, compare alternatives, and explain what is gained and what is given up.
      Finish by downloading your discussion and evidence. This lab shows you the route and lets you practice.

      The browser investigates the book's reference machine. The optional supervised studio uses a separate
      SO-101 station; its measurements must come from that station, not from this simulation.
    previously: Start here. No machine has been authorized to move by completing this notebook.
    next: 'The causal boundary: what changes when a command delivers physical work?'
    submission: 'One rehearsal discussion: chosen evidence source, preserved comparison, limitation, and
      next question.'
  core_concepts:
  - id: v4_00_A
    title: Evidence identity
    source_concepts: []
    learning_claim: Distinguish the warehouse reference calculation, a constructed trace, and a physical
      bench observation.
    tradeoff: Which evidence belongs to the running machine, and which belongs to your station?
    student_action: Distinguish the warehouse reference calculation, a constructed trace, and a physical
      bench observation.
    evidence_to_inspect: A labeled evidence-source comparison.
    assessment: A labeled evidence-source comparison.
    scope: Interface rehearsal only; not physical qualification.
  - id: v4_00_B
    title: Visible route
    source_concepts: []
    learning_claim: Find the learning goals, all investigation parts, submission, and next decision before
      opening instruments.
    tradeoff: What will you decide in this lab, and what will remain open?
    student_action: Find the learning goals, all investigation parts, submission, and next decision before
      opening instruments.
    evidence_to_inspect: A named decision and the evidence it needs.
    assessment: A named decision and the evidence it needs.
    scope: Interface rehearsal only; not physical qualification.
  - id: v4_00_C
    title: Evidence state
    source_concepts: []
    learning_claim: Distinguish live, pinned, saved, and stale evidence using one harmless interface rehearsal.
    tradeoff: What changes when a control moves, and what remains pinned?
    student_action: Distinguish live, pinned, saved, and stale evidence using one harmless interface rehearsal.
    evidence_to_inspect: A preserved comparison with its original conditions.
    assessment: A preserved comparison with its original conditions.
    scope: Interface rehearsal only; not physical qualification.
  - id: v4_00_D
    title: Discussion provenance
    source_concepts: []
    learning_claim: Export a discussion that ties a choice to specific evidence and an unresolved condition.
    tradeoff: How would another person check your reasoning?
    student_action: Export a discussion that ties a choice to specific evidence and an unresolved condition.
    evidence_to_inspect: A rehearsal discussion that makes no deployment claim.
    assessment: A rehearsal discussion that makes no deployment claim.
    scope: Interface rehearsal only; not physical qualification.
