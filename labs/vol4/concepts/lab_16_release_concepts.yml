lab_concept_map:
  schema_version: 1
  lab_id: v4_16
  volume: vol4
  chapter: 16
  title: Deployment Release
  source_notebook: labs/vol4/lab_16_release.py
  source_chapter_concept_map: books/vol4/16_release/release_concepts.yml
  book_anchor: sec-release
  status: development companion; physical studio remains unverified
  chapter_goal: Which configuration and envelope, if any, does the evidence justify, and what must withdraw
    that permission?
  student_goals:
  - Distinguish conjunctive required premises from genuinely independent sufficient argument legs.
  - Apply UNCOND, COND and REFUSE to explicit evidence packets and test whether each standing condition
    remains observable.
  - Explain why hashes, calibration, hardware, domain and protective functions belong to one manifest.
  - Trace update effects beyond prediction quality and separate shadow filtering from contained qualification.
  narrative:
    situation: The team has a plausible machine and results from its fault tests. Some timing measurements
      under load and physical qualification tests are still missing. A reviewer asks whether it may
      enter service, operate under narrower conditions, or stay out until more evidence arrives.
    previously: Use the actual fault-record set and its unresolved fields; keep a separately labeled stipulated-evidence
      branch distinct from the real unqualified packet. These are the project's supplied starting assumptions;
      compatible earlier student evidence is not presumed.
    next: A technically bounded manifest still needs named decision owners, feasible oversight, fair treatment
      evidence and declared uses of people’s records.
    submission: Release manifest exercise with claim–argument–evidence links, signed simulated verdict,
      standing conditions and update impact list; not an operating permit. Submit one integrated discussion
      tying the saved comparisons to your decision or hold, rejected alternative, uncertainty, and reversal
      condition.
  core_concepts:
  - id: v4_16_A
    title: Find the weakest premise rather than count green evidence
    investigation_title: Find the weakest premise rather than count green evidence
    source_concepts:
    - chapter: 16
      concept: Safety case
      concept_map: books/vol4/16_release/release_concepts.yml
    - chapter: 16
      concept: Conjunctive premises and diverse legs
      concept_map: books/vol4/16_release/release_concepts.yml
    learning_claim: Release adjudicates physical inequalities (stop inside the clear distance, contact
      force under the assessed limit, WCET inside its deadline) through a claim-argument-evidence case
      whose warrants say why each piece of evidence supports its claim. When every child claim is required
      the case is conjunctive and its confidence falls below every premise, so an assessor looks for the
      least-supported premise, and only genuinely independent sufficient legs add confidence.
    tradeoff: Choose the warrant supporting each stopping/contact/timing claim; compare adding more correlated
      traces with resolving an unsupported premise.
    student_action: Choose the warrant supporting each stopping/contact/timing claim; compare adding more
      correlated traces with resolving an unsupported premise.
    held_fixed: Keep the top-level claim and configuration fixed; distinguish required child claims from
      alternative sufficient legs before any numerical confidence illustration.
    evidence_to_inspect: Use mlsysim.physics.calc_conjunctive_confidence and calc_multilegged_confidence
      only under their documented assumptions; show the claim graph, evidence class and independence justification
      beside any modeled confidence.
    feedback_contract: Feedback identifies a broken warrant or least-supported premise. Repeated evidence
      cannot compensate for an unmeasured brake bound, and dependent legs do not earn independent-combination
      credit.
    explanation_prompt: Which new measurement changed the argument while another pile of traces did not?
    assessment: Which new measurement changed the argument while another pile of traces did not?
    scope: Confidence arithmetic is a teaching model, not calibrated safety assurance or certification.
    mlsysim_apis: []
  - id: v4_16_B
    title: Unknown is a release outcome
    investigation_title: Unknown is a release outcome
    source_concepts:
    - chapter: 16
      concept: Three signed verdicts
      concept_map: books/vol4/16_release/release_concepts.yml
    - chapter: 16
      concept: Standing conditions
      concept_map: books/vol4/16_release/release_concepts.yml
    learning_claim: The argument resolves into a signed verdict loaded as the machine's operating permit
      (UNCOND for the assessed envelope, COND for a separately evidenced restricted limit set, REFUSE
      naming the next measurement). A verdict lives only while its premises hold, so each premise is bound
      to a detector or site procedure at a cadence set by its degradation mechanism, and an unknown premise
      refuses like a breach.
    tradeoff: Adjudicate the actual incomplete packet, then a separately labeled stipulated restricted
      packet; remove a premise detector or let a required procedure lapse.
    student_action: Adjudicate the actual incomplete packet, then a separately labeled stipulated restricted
      packet; remove a premise detector or let a required procedure lapse.
    held_fixed: 'Fix the verdict meanings: COND needs its own evidenced restricted limit set, not a promise
      to measure later.'
    evidence_to_inspect: Review stopping, contact and timing inequalities with matched records; inspect
      detector/procedure cadence, owner and expiry for each standing condition.
    feedback_contract: The actual incomplete packet refuses. A stipulated branch may support a conditional
      exercise verdict only within its supplied premises. Unknown or breached standing conditions withdraw
      permission.
    explanation_prompt: Why was a slower proposed limit still not enough without its own evidence, and
      which unknown caused refusal?
    assessment: Why was a slower proposed limit still not enough without its own evidence, and which unknown
      caused refusal?
    scope: Every verdict is a classroom adjudication; none is a real permit or safety certificate.
    mlsysim_apis: []
  - id: v4_16_C
    title: Authorize this configuration, not an abstract capability
    investigation_title: Authorize this configuration, not an abstract capability
    source_concepts:
    - chapter: 16
      concept: Release manifest
      concept_map: books/vol4/16_release/release_concepts.yml
    - chapter: 16
      concept: Certification authorizes a configuration
      concept_map: books/vol4/16_release/release_concepts.yml
    learning_claim: The release manifest binds every upstream record, the argument digest, binary hashes,
      calibration, standing conditions, wear budget, expiry, and the adjudicator's signature to one configuration
      and gates motion fail-closed. Certification follows the machinery route (risk reduction, rated functions,
      drive stops, mobile-manipulator standards) and authorizes a configuration with its evidence, not
      a capability.
    tradeoff: Try loading a manifest with a changed checkpoint, stale calibration, missing record digest
      or mismatched plant; select the exact unresolved claim.
    student_action: Try loading a manifest with a changed checkpoint, stale calibration, missing record
      digest or mismatched plant; select the exact unresolved claim.
    held_fixed: Keep the assessed envelope and record schema fixed; do not substitute component branding
      for assessed safety-function evidence.
    evidence_to_inspect: Trace-review parent digests, binary/calibration identity, expiry and formal protective-function
      scope. Map standards only as the chapter’s conceptual assessment route, without asserting current
      legal compliance.
    feedback_contract: Feedback fails closed on mismatch and explains why an impressive capability demonstration
      cannot transfer authorization to another build or station.
    explanation_prompt: Which unchanged capability hid a changed configuration, and which linked evidence
      had to be reacquired?
    assessment: Which unchanged capability hid a changed configuration, and which linked evidence had
      to be reacquired?
    scope: The exercise does not perform regulatory conformity assessment; educational kit hardware is
      not the running machine’s certified substrate.
    mlsysim_apis: []
  - id: v4_16_D
    title: A better policy can reopen a containment claim
    investigation_title: A better policy can reopen a containment claim
    source_concepts:
    - chapter: 16
      concept: Updates reopen claims
      concept_map: books/vol4/16_release/release_concepts.yml
    learning_claim: An update reopens the claims whose evidence it touches, an unchanged enforcer binary
      does not imply an unchanged containment argument, and shadow mode filters candidates while contained
      canaries qualify them.
    tradeoff: Compare a checkpoint-only update that changes memory traffic, a calibration update and a
      worn-brake case; choose affected claims and staging evidence.
    student_action: Compare a checkpoint-only update that changes memory traffic, a calibration update
      and a worn-brake case; choose affected claims and staging evidence.
    held_fixed: Hold the intended operating claim fixed; keep shadow outcomes separate from actuator-authorized
      canary outcomes and predeclare non-inferiority criteria.
    evidence_to_inspect: Inspect update dependency graph, affected records, supplied shadow divergence
      and contained-canary packet. No unsupported local sequential-test calculator; statistical test design
      remains explicit review until package-backed.
    feedback_contract: Feedback reopens timing or physical claims when their premises change even if enforcer
      bytes do not. Rolling back software does not restore brake wear or calibration.
    explanation_prompt: Which change demanded requalification outside the learning team, and why could
      shadow mode not supply it?
    assessment: Which change demanded requalification outside the learning team, and why could shadow
      mode not supply it?
    scope: No live OTA promotion, deployment or hardware permission is executed by this notebook.
    mlsysim_apis: []
