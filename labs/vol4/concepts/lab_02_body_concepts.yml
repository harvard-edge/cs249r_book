    limitation: Authoring a limit record does not establish that the value is measured; physical validation
      is separate.
    artifact: Field-completeness view and condition-match checklist for candidate limit records.
    scope: Reference calculation or constructed trace, explicitly labeled by the instrument; physical
      observations require separate bench records.
    next: The Brain chapter must choose a proposal workload that fits these installed physical limits
