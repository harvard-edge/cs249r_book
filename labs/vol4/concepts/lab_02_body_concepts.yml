lab_concept_map:
  schema_version: 1
  lab_id: v4_02
  volume: vol4
  chapter: 2
  title: The Physical Body
  source_notebook: labs/vol4/lab_02_body.py
  source_chapter_concept_map: books/vol4/02_body/body_concepts.yml
  book_anchor: sec-body
  status: development companion; physical studio remains unverified
  chapter_goal: Choose a usable operating condition by checking all physical budgets, not by trading one
    failed budget against another budget’s slack.
  student_goals:
  - Connect tolerated spatial error and clear distance to end-to-end age and operating-speed requirements.
  - Compare ideal gearing torque multiplication and reflected inertia while identifying the installed-drive
    evidence still missing.
  - Compare winding duty and initial thermal reserve with the separate voltage-rail consequence of coincident
    demand.
  - Build a limit that names conditions, uncertainty, reserve, detector, and evidence rather than copying
    a catalog maximum.
  narrative:
    situation: The proposed aisle and latch motions are plausible on screen. The team now asks whether
      the installed machine can supply them repeatedly without stale measurements, current clamping, heat
      exhaustion, or rail collapse.
    previously: The opening architecture requires independent permission but has not established the plant
      limits. These are the project's supplied starting assumptions; compatible earlier student evidence
      is not presumed.
    next: The Brain chapter must choose a proposal workload that fits these installed physical limits
      and freshness requirements.
    submission: A six-element limit record for each investigated bound, with separate uncertainty and
      reserved margin and explicit evidence category. Submit one integrated discussion tying the saved
      comparisons to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_02_A
    title: Fresh enough and slow enough
    investigation_title: Fresh enough and slow enough
    source_concepts:
    - chapter: 2
      concept: Five-budget admission
      concept_map: books/vol4/02_body/body_concepts.yml
    - chapter: 2
      concept: Measurement freshness deadline
      concept_map: books/vol4/02_body/body_concepts.yml
    - chapter: 2
      concept: Velocity ceiling
      concept_map: books/vol4/02_body/body_concepts.yml
    learning_claim: Before torque reaches a winding the permission path must find non-negative margin
      in all five physical budgets at once (observation age, stopping distance, deliverable torque, winding
      temperature, supply), because one budget's slack never pays another's deficit. An observation's
      age runs from physical transduction to actuator torque onset and must stay under the freshness deadline
      E_max / v_max set by the target's speed and the spatial tolerance, with inference only one of many
      stages. The defended stopping distance v*tau + v^2/(2a) + localization and margin allowances must
      fit the clear distance, solved on the permission path as a clearance-dependent speed ceiling whose
      credible deceleration is the minimum of independently owned ceilings.
    tradeoff: Change speed or one stage of capture-to-onset delay; then test a narrower-clearance condition
      without changing the evidenced deceleration.
    student_action: Change speed or one stage of capture-to-onset delay; then test a narrower-clearance
      condition without changing the evidenced deceleration.
    held_fixed: Installed plant limits and declared allowances; interventions are compared one at a time.
    evidence_to_inspect: Freshness budget, elementary stopping clearance, and a five-budget status panel
      whose unmeasured entries remain unknown.
    feedback_contract: Explain why a passing stopping budget cannot compensate for a failed freshness
      requirement or an unknown torque budget.
    explanation_prompt: Which budget becomes binding first and which measurement would justify the speed
      ceiling?
    assessment: Which budget becomes binding first and which measurement would justify the speed ceiling?
    scope: Uses the chapter’s elementary root; no later jerk or walking-person envelope is introduced.
    mlsysim_apis:
    - mlsysim.physics.robotics.calc_max_permitted_velocity
    - mlsysim.physics.robotics.calc_safe_stopping_distance
  - id: v4_02_B
    title: More reduction is not free torque
    investigation_title: More reduction is not free torque
    source_concepts:
    - chapter: 2
      concept: Delivered torque ceiling
      concept_map: books/vol4/02_body/body_concepts.yml
    - chapter: 2
      concept: Gear ratio trade
      concept_map: books/vol4/02_body/body_concepts.yml
    learning_claim: A torque command is a current that winding inductance and voltage headroom pace and
      the inverter current limit caps, and a drive can clamp current silently while acknowledging packets,
      so the safety path must read measured current. A reduction N multiplies torque by N but reflects
      rotor inertia by N^2, so acceleration peaks at the inertia-matching ratio and, for a fixed motor
      and gear, holding heat times reflected inertia does not depend on N.
    tradeoff: Compare supported gear ratios using the same motor, then inspect an acknowledged command
      whose measured current clamps.
    student_action: Compare supported gear ratios using the same motor, then inspect an acknowledged command
      whose measured current clamps.
    held_fixed: Motor, rotor inertia, supply and load; no change in motor capability is attributed to
      gearing.
    evidence_to_inspect: Reflected rotor inertia, ideal output torque, and a dated requested-versus-delivered current ramp under current clamping or reduced voltage headroom.
    feedback_contract: Report torque multiplication alongside inertia growth and whether measured current
      supports the requested torque; acknowledgment is not delivery.
    explanation_prompt: Why can a higher reduction make one task easier while worsening acceleration or
      impact response?
    assessment: Why can a higher reduction make one task easier while worsening acceleration or impact
      response?
    scope: Hypothetical gearing and zero-speed R-L current-step reference with an ideal current limiter.
      Installed torque, regulator dynamics, back EMF, heat, and gearbox compliance are not measured.
    mlsysim_apis:
    - mlsysim.physics.robotics.calc_reflected_inertia
    - mlsysim.labs.experiments.v4_timing.study
  - id: v4_02_C
    title: Burst now or repeat later
    investigation_title: Burst now or repeat later
    source_concepts:
    - chapter: 2
      concept: Thermal duty limits
      concept_map: books/vol4/02_body/body_concepts.yml
    - chapter: 2
      concept: Shared-rail power integrity
      concept_map: books/vol4/02_body/body_concepts.yml
    learning_claim: Copper loss grows with torque squared, so continuous torque is set by installed heat
      rejection rather than catalog peak, and a burst spends a stock of heat margin that thermal history
      has already drawn down. Compute and drives share one DC bus whose impedance turns a coincident current
      step into droop toward converter lockout while a regenerative stop pumps energy back, so the permission
      rail is isolated and held up and every unpowered state is specified.
    tradeoff: Compare hot-start and cool-start duty traces; independently compare staggered versus coincident
      compute/drive transients.
    student_action: Compare hot-start and cool-start duty traces; independently compare staggered versus
      coincident compute/drive transients.
    held_fixed: Same installed cooling, load sequence and supply configuration for each paired comparison.
    evidence_to_inspect: Winding segment temperatures, thermal reserve, rail droop, and the separate consequences
      of added recovery or staggered demand.
    feedback_contract: Show which thermal reserve was already spent and whether rail events threaten permission
      availability; missing trace calibration stays unknown.
    explanation_prompt: Would a slower cycle, staggered burst, or isolated permission supply address the
      observed failure, and what cost follows?
    assessment: Would a slower cycle, staggered burst, or isolated permission supply address the observed
      failure, and what cost follows?
    scope: Fixed-resistance winding thermal reference with hypothetical installed cooling and capacitance,
      plus DC droop. These are not measured station temperatures or qualified power-integrity limits.
    mlsysim_apis:
    - mlsysim.physics.robotics.calc_voltage_droop
    - mlsysim.physics.robotics.calc_inductive_voltage_droop
  - id: v4_02_D
    title: Turn a specification into a limit
    investigation_title: Turn a specification into a limit
    source_concepts:
    - chapter: 2
      concept: Limit record
      concept_map: books/vol4/02_body/body_concepts.yml
    learning_claim: A physical limit governs an admission decision only as a six-element record (value,
      conditions, uncertainty, margin, runtime detector, provenance with evidence category), and uncertainty
      about the measurement is distinct from margin held in reserve.
    tradeoff: Choose between a datasheet ceiling, measured installed bound, and illustrative design estimate
      for a stated admission use.
    student_action: Choose between a datasheet ceiling, measured installed bound, and illustrative design
      estimate for a stated admission use.
    held_fixed: Physical quantity and intended runtime decision; vary the evidence and its operating conditions.
    evidence_to_inspect: Field-completeness view and condition-match checklist for candidate limit records.
    feedback_contract: Reject missing detectors or mismatched conditions and distinguish an uncertain
      measurement from a deliberately reserved margin.
    explanation_prompt: What can the permission path rely on now, and what bench campaign must precede
      a stronger claim?
    assessment: What can the permission path rely on now, and what bench campaign must precede a stronger
      claim?
    scope: Authoring a limit record does not establish that the value is measured; physical validation
      is separate.
    mlsysim_apis:
    - mlsysim.embodied.datasheet.machine_card
    - mlsysim.embodied.datasheet.data_sheet_lookup
