lab_concept_map:
  schema_version: 1
  lab_id: v4_01
  volume: vol4
  chapter: 1
  title: The Causal Boundary
  source_notebook: labs/vol4/lab_01_boundary.py
  source_chapter_concept_map: books/vol4/01_boundary/boundary_concepts.yml
  book_anchor: sec-boundary
  status: development companion; physical studio remains unverified
  chapter_goal: Decide what may remain a proposal, what requires independent permission, and which delay
    reduction preserves elementary stopping clearance.
  student_goals:
  - Trace the difference between discarding an uncommitted prediction and recovering after work has entered
    the plant.
  - Identify whether delay travel or constant-deceleration braking dominates the selected operating point.
  - Distinguish learned proposal authority from the independent path allowed to admit physical work.
  - Explain how stale state, spoofed state, and missing causal telemetry obstruct the same admission decision.
  narrative:
    situation: The warehouse mobile manipulator has been asked to collect a mug, open the spring-latched
      cage door, and cross a shared aisle. A confident proposal arrives while the base continues moving.
    previously: Orientation establishes the course map, record chain, browser evidence labels, and separate
      supervised bench route. These are the project's supplied starting assumptions; compatible earlier
      student evidence is not presumed.
    next: The architecture sketch leaves its physical limits unevidenced. The Body chapter must establish
      what the permission decision may assume.
    submission: An annotated command-to-motion chain, elementary stopping comparison, and opening record-chain
      sheet with explicitly unsupported limits. Submit one integrated discussion tying the saved comparisons
      to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_01_A
    title: Locate the irreversible step
    investigation_title: Locate the irreversible step
    source_concepts:
    - chapter: 1
      concept: Causal boundary
      concept_map: books/vol4/01_boundary/boundary_concepts.yml
    - chapter: 1
      concept: Irreversibility and recovery
      concept_map: books/vol4/01_boundary/boundary_concepts.yml
    - chapter: 1
      concept: Digital privileges lost to embodiment
      concept_map: books/vol4/01_boundary/boundary_concepts.yml
    learning_claim: The causal boundary is the interface where an admitted digital command begins to drive
      current, force, or flow in the plant; upstream a tensor is a proposal that can be discarded for
      free, and downstream changing the command costs physical work against inertia over finite time.
      Work delivered across the causal boundary has no checkpoint to restore, so recovery is a new constrained
      motion limited by torque, friction, and drive limits, and the permission path must confirm that
      a feasible recovery still exists before it admits an action. Moving from advisory prediction through
      software agency to physical embodiment removes elastic virtual time, transactional rollback, and
      batchable execution, so data, compute, evaluation, and deployment each acquire physical stakes.
    tradeoff: Choose when to discard or replace a command on a dated command-to-current trace; compare
      an upstream cancellation with a command reversal after onset.
    student_action: Choose when to discard or replace a command on a dated command-to-current trace; compare
      an upstream cancellation with a command reversal after onset.
    held_fixed: Same motion request, plant state, and trace; only intervention point changes.
    evidence_to_inspect: Command, admission, current-onset, motion, and recovery timeline; separately
      labeled observed or instructional trace.
    feedback_contract: Highlight which commands never caused work and which require a new physical recovery.
      Returning coordinates does not erase heat, impact, or elapsed motion.
    explanation_prompt: Which software recovery privilege disappears at onset, and what evidence would
      establish a feasible physical recovery?
    assessment: Which software recovery privilege disappears at onset, and what evidence would establish
      a feasible physical recovery?
    scope: Trace interpretation only; no browser replay sends motor commands or predicts damage.
    mlsysim_apis: []
  - id: v4_01_B
    title: Spend stopping clearance
    investigation_title: Spend stopping clearance
    source_concepts:
    - chapter: 1
      concept: Elementary stopping budget
      concept_map: books/vol4/01_boundary/boundary_concepts.yml
    learning_claim: Stopping distance v*tau_delay + v^2/(2*a_brake) must fit the clear distance, where
      the delay sums observation age, the unexpired chunk lease, a permission tick, a bus cycle, and brake
      onset, so every millisecond of latency is travel (1.5 mm per ms at the running machine's 1.5 m/s).
    tradeoff: Compare a reduced speed with a shorter declared delay; change one at a time and then inspect
      a second operating point.
    student_action: Compare a reduced speed with a shorter declared delay; change one at a time and then
      inspect a second operating point.
    held_fixed: Clear distance and declared credible deceleration; retain the other intervention as baseline.
    evidence_to_inspect: Reaction-distance and braking-distance bars, remaining clearance, and terms changed
      by each intervention.
    feedback_contract: Recompute immediately and explain which term changed; a negative margin refuses
      the modeled action rather than hiding the failure.
    explanation_prompt: When would the preferred intervention reverse, and why does a faster inference
      not remove braking travel?
    assessment: When would the preferred intervention reverse, and why does a faster inference not remove
      braking travel?
    scope: Elementary constant-deceleration estimate, not the later jerk-limited stopping envelope or
      a physical permission certificate.
    mlsysim_apis:
    - mlsysim.Embodied
    - mlsysim.physics.robotics.calc_safe_stopping_distance
  - id: v4_01_C
    title: Separate proposal from permission
    investigation_title: Separate proposal from permission
    source_concepts:
    - chapter: 1
      concept: Physical AI scope test
      concept_map: books/vol4/01_boundary/boundary_concepts.yml
    - chapter: 1
      concept: Five-level machine
      concept_map: books/vol4/01_boundary/boundary_concepts.yml
    - chapter: 1
      concept: Proposal boundary
      concept_map: books/vol4/01_boundary/boundary_concepts.yml
    learning_claim: A system is physical AI only when it has a learned statistical model, consequential
      physical feedback, and delegated authority at once; an independent deterministic veto does not remove
      delegated authority, while per-command human approval does. The machine is ordered as Brain (learned
      proposers), Nervous System (buses, schedulers, permission path), Body (plant), Boundary (register
      writes and sensor captures), and World, with governance as a lifecycle envelope rather than a sixth
      level, so a failure is diagnosed by the level that failed. A learned model may only propose; an
      independent permission path with bounded latency, which the model cannot delay or corrupt, alone
      admits an action after checking fresh evidence, the stopping envelope, and a feasible fallback,
      and it acts on its own when the proposer stalls.
    tradeoff: Compare advisory output, human approval of every command, and delegated execution with deterministic
      veto; place the same failure on the five-level machine.
    student_action: Compare advisory output, human approval of every command, and delegated execution
      with deterministic veto; place the same failure on the five-level machine.
    held_fixed: Same task and actuator chain; authority wiring is the controlled difference.
    evidence_to_inspect: Scope-test predicate table and a supplied authority-path comparison with a documented
      rationale for every writer.
    feedback_contract: Show which scope condition changes and whether a proposer stall also disables refusal;
      a separate processor alone is not an independence proof.
    explanation_prompt: Why does adding a veto preserve delegated authority, and which component must
      still act if the Brain stalls?
    assessment: Why does adding a veto preserve delegated authority, and which component must still act
      if the Brain stalls?
    scope: Architecture reasoning, not certification of a selected topology.
    mlsysim_apis: []
  - id: v4_01_D
    title: Join the evidence at permission
    investigation_title: Join the evidence at permission
    source_concepts:
    - chapter: 1
      concept: Safety convergence at the permission path
      concept_map: books/vol4/01_boundary/boundary_concepts.yml
    learning_claim: 'Because physical authority is state-dependent, environmental change, sensor spoofing,
      and post-incident reconstruction all reduce to three demands on the permission path: fresh authenticated
      physical state, deterministic authority to intervene with a feasible fallback, and synchronized
      causal telemetry.'
    tradeoff: Inspect three versions of one incident packet and choose the missing evidence or authority
      repair before claiming the action was justified.
    student_action: Inspect three versions of one incident packet and choose the missing evidence or authority
      repair before claiming the action was justified.
    held_fixed: Same requested motion and clearance; vary only evidence provenance, refusal authority,
      or synchronized telemetry.
    evidence_to_inspect: Evidence-to-decision matrix linking physical state, admission event, and actuator
      onset, including unknown entries.
    feedback_contract: Identify the unanswered question rather than invent an outcome when timing or physical
      evidence is absent.
    explanation_prompt: Which record would make this decision reconstructable, and which fact would still
      need measurement?
    assessment: Which record would make this decision reconstructable, and which fact would still need
      measurement?
    scope: Introduces record purposes only; later chapters own authentication, fault handling, and release
      mechanisms.
    mlsysim_apis: []
