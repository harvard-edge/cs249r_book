    artifact: Three-event tentative/confirmed occupancy trace and four-state map (occupied, observed
      free, unknown, expired), plus constructed storage bytes, query-field compatibility and record reads.
    scope: Reference calculation or constructed trace, explicitly labeled by the instrument; physical
      observations require separate bench records.
    next: Which belief expires first, and what observation or site control is needed before motion can
      resume?
  - part: C
    title: Publishing does not renew evidence
    question: Which action changes supporting evidence, which changes only publication, and what
      assumption must be checked before using this expiry horizon?
    goal: Separate publication action from original evidence age and compare remaining validity under
      a declared constant-speed free-space expiry reference.
    concept_ids:
    - v4_09_C
    coverage: Bounded constant-speed reference investigation; physical growth assumptions remain unverified.
    limitation: No three-epoch event trace, frame-tree composition, general growing-error law, spatial
      erosion map or measured growth-law qualification. Hidden-speed and site assumptions require
      separate physical evidence; this reference does not grant motion permission.
    artifact: Original evidence age, scalar free-space validity horizon, remaining validity and publication
      action across old-capture, republish, prediction and new-capture cases.
    scope: Canonical constant-speed scalar calculation with stipulated inputs; actual observation quality,
      physical approach bounds and installed timing require separate records.
    next: What added observation would distinguish the alternatives, and what must remain unknown until
      it exists?
  - part: D
    title: Some ambiguity needs a different observation
    question: What added observation would distinguish the alternatives, and what must remain unknown
      until it exists?
    goal: Explain why repeated identical measurements cannot distinguish physical states that produce
      the same sensor outputs.
    concept_ids:
    - v4_09_D
    coverage: Chapter-owned controlled reference investigation; execution coverage is qualified by the
      displayed study.
    limitation: Introduces observability locally; the later frontier chapter owns the broader indistinguishability/deadline
      argument.
    artifact: Two state explanations fitting the same observations, innovation trace and proposed discriminating
      measurement.
    scope: Reference calculation or constructed trace, explicitly labeled by the instrument; physical
      observations require separate bench records.
    next: Grounded intent must consume these bounded beliefs without turning a semantic request into indefinite
      physical permission.
