lab_concept_map:
  schema_version: 1
  lab_id: v4_09
  volume: vol4
  chapter: 9
  title: Spatial Memory
  source_notebook: labs/vol4/lab_09_memory.py
  source_chapter_concept_map: books/vol4/09_memory/memory_concepts.yml
  book_anchor: sec-memory
  status: development companion; physical studio remains unverified
  chapter_goal: Choose what a stored belief can still support, when it expires, and what requires a new
    observation rather than a more confident estimate.
  student_goals:
  - Compare delayed scalar updates and distinguish reported covariance from single-trace NEES/NIS
    diagnostics and a separate calibration campaign.
  - Choose spatial representations by consumer query and prevent track-confirmation delay from hiding
    occupied space.
  - Separate publication action from original evidence age and compare remaining validity under
    a declared constant-speed free-space expiry reference.
  - Explain why repeated identical measurements cannot distinguish physical states that produce the same
    sensor outputs.
  narrative:
    situation: The robot turns around a rack and loses sight of the cross aisle. The last free-space map
      is still publishing, and the arm’s stored latch transform has an older physical epoch than its software
      timestamp.
    previously: Perception supplied qualified observations with capture epochs, clock bounds, frames and
      health. These are the project's supplied starting assumptions; compatible earlier student evidence
      is not presumed.
    next: Grounded intent must consume these bounded beliefs without turning a semantic request into indefinite
      physical permission.
    submission: Belief record preserving evidence, estimate and publication epochs, frame, query, uncertainty
      growth, validity region and invalidating conditions. Submit one integrated discussion tying the
      saved comparisons to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_09_A
    title: Update where the measurement happened
    investigation_title: Update where the measurement happened
    source_concepts:
    - chapter: 9
      concept: Recursive estimation on dated measurements
      concept_map: books/vol4/09_memory/memory_concepts.yml
    - chapter: 9
      concept: Covariance is a claim
      concept_map: books/vol4/09_memory/memory_concepts.yml
    learning_claim: A state estimator alternates a prediction that widens uncertainty with elapsed time
      and updates that narrow it below every input by inverse-variance fusion, applying each measurement
      at its capture epoch and replaying out-of-sequence ones. A filter's reported covariance is a hypothesis
      tested offline by NEES against ground truth and online by NIS on innovations, and an above-band
      mean flags the safety-critical overconfident filter.
    tradeoff: Choose capture-epoch replay versus arrival-time update on the same constructed delayed scalar trace;
      compare reported covariance with computed NEES/NIS, then understate noise or introduce shared bias.
    student_action: Choose capture-epoch replay versus arrival-time update on the same constructed delayed scalar
      trace; compare reported covariance with computed NEES/NIS, then understate noise or introduce shared bias.
    held_fixed: Same measurements, model, arrival order and ground truth where available.
    evidence_to_inspect: Capture/arrival means and variances, scalar gain and innovation, independently constructed
      truth, and single-sample NEES/NIS; missing truth leaves NEES unknown.
    feedback_contract: An apparently tighter covariance can be overconfident; expired replay history must
      reject or explicitly handle a late observation rather than invent a correct update.
    explanation_prompt: Which estimator appears confident for the wrong reason, and what can innovations
      alone fail to reveal?
    assessment: Which estimator appears confident for the wrong reason, and what can innovations alone
      fail to reveal?
    scope: Scalar independent-noise Gaussian update with known constant velocity and no intervening updates;
      constructed truth is not a measurement or a repeated-trial covariance-calibration campaign.
    mlsysim_apis:
    - mlsysim.labs.experiments.v4_estimation.scalar_update
  - id: v4_09_B
    title: Preserve occupancy before the name
    investigation_title: Preserve occupancy before the name
    source_concepts:
    - chapter: 9
      concept: Occupancy before identity
      concept_map: books/vol4/09_memory/memory_concepts.yml
    - chapter: 9
      concept: Representation follows the query
      concept_map: books/vol4/09_memory/memory_concepts.yml
    learning_claim: Tracking adds identity and velocity for planners, but a tentative track's occupied
      region must reach clearance consumers before confirmation and stays occupied while it coasts. The
      map is chosen by the query it answers inside the permission tick's read budget, so the local snapshot
      is a dense distance field with four cell states and explicit negative evidence.
    tradeoff: Compare immediate tentative occupancy with confirmed-track-only clearance; select a local
      occupancy grid or object-relation graph for a declared consumer query and record-read budget.
    student_action: Compare immediate tentative occupancy with confirmed-track-only clearance; select a local
      occupancy grid or object-relation graph for a declared consumer query and record-read budget.
    held_fixed: Same detections and consumer read budget; representation changes do not add sensing.
    evidence_to_inspect: Three-event tentative/confirmed occupancy trace and four-state map (occupied, observed
      free, unknown, expired), plus constructed storage bytes, query-field compatibility and record reads.
    feedback_contract: Unconfirmed objects still occupy space; a semantic graph cannot answer a bounded
      clearance query merely because it has richer labels.
    explanation_prompt: Which representation serves this consumer and which information must reach it
      before identity is certain?
    assessment: Which representation serves this consumer and which information must reach it before identity
      is certain?
    scope: Constructed occupancy and evidence-age trace; unsupported clear decisions are flagged.
      Declared record formats and access counts do not model distance fields, tracking/coasting, detector
      accuracy, implementation overhead or real-time query WCET.
    mlsysim_apis:
    - mlsysim.labs.experiments.v4_occupancy.calculate
  - id: v4_09_C
    title: Publishing does not renew evidence
    investigation_title: Publishing does not renew evidence
    source_concepts:
    - chapter: 9
      concept: Belief record
      concept_map: books/vol4/09_memory/memory_concepts.yml
    - chapter: 9
      concept: Frames age
      concept_map: books/vol4/09_memory/memory_concepts.yml
    - chapter: 9
      concept: Belief expiry
      concept_map: books/vol4/09_memory/memory_concepts.yml
    learning_claim: Prediction and republishing do not advance the original physical evidence epoch.
      Under a declared constant-speed hidden-entry reference, free space has a finite horizon;
      the original evidence age spends that horizon even when software publishes a fresh record.
      A genuinely new capture can restore remaining validity only under the same stated reference assumptions.
    tradeoff: Compare an old capture, republishing, prediction and a genuinely new capture under
      the same declared constant-speed hidden-entry reference.
    student_action: Compare the original evidence age and remaining validity across publication actions
      and inspect the fixed reference horizon.
    held_fixed: Clearance, fixed spatial allowances and constant-speed hidden-entry assumptions stay fixed;
      each case changes only publication action or original capture age.
    evidence_to_inspect: Original evidence age, calculated free-space validity horizon, remaining validity
      and the publication action; prediction and republishing retain the same original evidence age.
    feedback_contract: A new software publication does not renew the scalar evidence horizon. A new capture
      changes original evidence age while the declared hidden-entry horizon remains fixed.
      These calculations do not validate that the hidden-speed premise holds at a physical site.
    explanation_prompt: Which action changes supporting evidence, which changes only publication,
      and what assumption must be checked before using this expiry horizon?
    assessment: Which action changes supporting evidence, which changes only publication,
      and what assumption must be checked before using this expiry horizon?
    scope: Scalar constant-speed free-space expiry reference only. No three-epoch event trace,
      frame-tree composition, general growing-error law, spatial erosion map or measured growth-law
      qualification is implemented here. Physical speed bounds and observations require separate evidence;
      later enforcement owns the stopping/separation mechanism.
    mlsysim_apis:
    - mlsysim.physics.robotics.calc_free_space_expiry
  - id: v4_09_D
    title: Some ambiguity needs a different observation
    investigation_title: Some ambiguity needs a different observation
    source_concepts:
    - chapter: 9
      concept: Observability ceiling
      concept_map: books/vol4/09_memory/memory_concepts.yml
    learning_claim: When distinct state histories give identical measurements no estimator can separate
      them, and innovations stay near zero while the true state drifts, so observability must be designed
      in by excitation or added sensing.
    tradeoff: Inspect a supplied force-plus-bias ambiguity trace and choose safe excitation, independent
      sensing, or a narrower supported claim.
    student_action: Inspect a supplied force-plus-bias ambiguity trace and choose safe excitation, independent
      sensing, or a narrower supported claim.
    held_fixed: Same ambiguous observations and physical-task constraints; added evidence is explicitly
      identified.
    evidence_to_inspect: Two state explanations fitting the same observations, innovation trace and proposed
      discriminating measurement.
    feedback_contract: Near-zero innovation does not eliminate hidden state drift; a better optimizer
      cannot recover information the sensor never supplied.
    explanation_prompt: What added observation would distinguish the alternatives, and what must remain
      unknown until it exists?
    assessment: What added observation would distinguish the alternatives, and what must remain unknown
      until it exists?
    scope: Introduces observability locally; the later frontier chapter owns the broader indistinguishability/deadline
      argument.
    mlsysim_apis: []
  runtime_parts:
