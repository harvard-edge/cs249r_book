lab_concept_map:
  schema_version: 1
  lab_id: v4_18
  volume: vol4
  chapter: 18
  title: Engineering Physical AI
  source_notebook: labs/vol4/lab_18_frontier.py
  source_chapter_concept_map: books/vol4/18_frontier/frontier_concepts.yml
  book_anchor: sec-frontier
  status: development companion; physical studio remains unverified
  chapter_goal: Which claims transfer as reasoning, which need new evidence, and what is the next experiment
    worth performing?
  student_goals:
  - Apply the four laws in order to transport, contact and thermal consequences of a new packaging cell.
  - Distinguish a monitored unknown from a physical state the onboard channel never observes before the
    action deadline.
  - Make the residual premise operational and avoid double-counting conditional shield credit.
  - Classify the gap and compare the cost of a maintained restriction with the campaign that could retire
    it.
  narrative:
    situation: The warehouse robot is still waiting for measurements before it can enter service. A new
      team asks you to review a packaging cell. Decide which parts of your reasoning transfer, which
      need fresh evidence, and which measurement deserves the next available hour. The warehouse's
      restriction on an oily floor still stands.
    previously: Carry the complete record chain with unresolved release and approval conditions; the final
      lab must not erase refusals to manufacture a successful ending. These are the project's supplied
      starting assumptions; compatible earlier student evidence is not presumed.
    next: 'Finish with a bounded engineering recommendation: proposed next test, retained restriction,
      owner and closure criterion, ready for human review rather than automatic release.'
    submission: Residual-claims register and final decision brief connecting the four-law audit, remaining
      restrictions and next evidence campaign. Submit one integrated discussion tying the saved comparisons
      to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_18_A
    title: Transfer the questions, not the warehouse numbers
    investigation_title: Transfer the questions, not the warehouse numbers
    source_concepts:
    - chapter: 18
      concept: Four-law audit of a new machine
      concept_map: books/vol4/18_frontier/frontier_concepts.yml
    learning_claim: The method transfers to an unfamiliar machine as four ordered questions (what the
      task cannot undo and which measured bound excludes it, whether closed-loop evidence covers the enforced
      envelope, which independent path admits each proposal, and what evidence bounds the authority granted),
      not as the warehouse machine's numbers.
    tradeoff: Choose the first physical bound to establish for each task before selecting a policy or
      importing a prior speed envelope.
    student_action: Choose the first physical bound to establish for each task before selecting a policy
      or importing a prior speed envelope.
    held_fixed: Keep the unfamiliar machine’s declared task and source evidence fixed; do not reuse warehouse
      masses, clearances or certification assumptions.
    evidence_to_inspect: Inspect the packaging-cell scenario and record-chain audit. Use mlsysim.physics.calc_safe_stopping_distance
      and calc_max_permitted_velocity only for the chapter’s explicit constant-deceleration screen, with
      its declared limitations.
    feedback_contract: Feedback rejects inherited numeric permission and rewards identifying a missing
      plant limit before model evaluation. A faster proposed cell may require a stricter contact or duty
      envelope.
    explanation_prompt: Which reasoning transferred immediately, and which apparently similar parameter
      needed a new measurement?
    assessment: Which reasoning transferred immediately, and which apparently similar parameter needed
      a new measurement?
    scope: The hypothetical cell is a screen; it is not a measured or approved station configuration.
    mlsysim_apis: []
  - id: v4_18_B
    title: More training cannot reveal an unobserved premise
    investigation_title: More training cannot reveal an unobserved premise
    source_concepts:
    - chapter: 18
      concept: Residual-claims register
      concept_map: books/vol4/18_frontier/frontier_concepts.yml
    learning_claim: A premise no onboard sensor reports is not the envelope's monitored unknown, so it
      is bound to a standing restriction, an accountable owner, and a predeclared closure test, chosen
      among responses (probe, restrict, add sensing, accept by judgment) by the claim each can support.
    tradeoff: Compare dry-floor and oil-film cases with indistinguishable supplied observations; choose
      an admissible probe, added sensing, conservative action or external proof test.
    student_action: Compare dry-floor and oil-film cases with indistinguishable supplied observations;
      choose an admissible probe, added sensing, conservative action or external proof test.
    held_fixed: Hold observations and action deadline fixed when testing what the existing channel can
      distinguish; do not grant future observations retroactively.
    evidence_to_inspect: Use chapter-supported stopping and friction scenarios with calc_scurve_stop_distance/calc_scurve_max_permitted_velocity;
      inspect latest useful observation and what each proposed response could actually measure.
    feedback_contract: Feedback explains when two required responses remain observationally indistinguishable.
      A stronger model does not close the entry; each alternative must supply evidence before the same
      deadline or retain a restriction.
    explanation_prompt: Which proposed experiment could distinguish the states in time, and which only
      produced another confidence score?
    assessment: Which proposed experiment could distinguish the states in time, and which only produced
      another confidence score?
    scope: No simulated film detector establishes real sensor coverage or traction qualification.
    mlsysim_apis: []
  - id: v4_18_C
    title: A written restriction needs an owner and enforcement
    investigation_title: A written restriction needs an owner and enforcement
    source_concepts:
    - chapter: 18
      concept: Residual-claims register
      concept_map: books/vol4/18_frontier/frontier_concepts.yml
    learning_claim: A premise no onboard sensor reports is not the envelope's monitored unknown, so it
      is bound to a standing restriction, an accountable owner, and a predeclared closure test, chosen
      among responses (probe, restrict, add sensing, accept by judgment) by the claim each can support.
    tradeoff: Compare a register-only speed limit with a signed enforced limit plus inspection owner/cadence;
      compare raw versus already-shielded hazard summaries.
    student_action: Compare a register-only speed limit with a signed enforced limit plus inspection owner/cadence;
      compare raw versus already-shielded hazard summaries.
    held_fixed: Keep the unresolved premise and claimed envelope fixed; declare whether each supplied
      rate already includes the permission filter.
    evidence_to_inspect: Review register links to manifest, enforcer and site procedure; use mlsysim.physics.robotics.calc_shielded_system_hazard_rate
      only with supplied conditional coverage/common-cause assumptions and a genuinely unshielded input
      rate.
    feedback_contract: Feedback shows that an unmeasured premise remains open after documentation. Missing
      owner, inactive restriction or lapsed test keeps refusal; applying a shield multiplier twice produces
      invalid evidence.
    explanation_prompt: What prevents a later checkpoint from silently restoring normal speed, and which
      rate could the shield model legitimately act on?
    assessment: What prevents a later checkpoint from silently restoring normal speed, and which rate
      could the shield model legitimately act on?
    scope: An enforced classroom constraint and modeled coverage do not establish an operational hazard-rate
      claim.
    mlsysim_apis: []
  - id: v4_18_D
    title: Choose the next capability by its missing evidence
    investigation_title: Choose the next capability by its missing evidence
    source_concepts:
    - chapter: 18
      concept: Next capability by missing evidence
      concept_map: books/vol4/18_frontier/frontier_concepts.yml
    learning_claim: Open register entries fall into classes by the evidence they lack (an unmeasured observable,
      an evaluation deficit, a theoretical deficit) or by a scope mismatch that no evidence inside the
      present architecture repairs, and the class, not the urgency, selects the next experiment, with
      each restriction priced against the campaign that would retire it.
    tradeoff: For each supplied gap class, compare an evidence-mismatched campaign with its matching
      measurement, representative evaluation, argument/counterexample or authority redesign. Separately
      vary demand or missing economic evidence without changing the closure obligation.
    student_action: For each supplied gap class, compare an evidence-mismatched campaign with its matching
      measurement, representative evaluation, argument/counterexample or authority redesign. Separately
      vary demand or missing economic evidence without changing the closure obligation.
    held_fixed: Within each campaign pair, hold gap class, missing premise and economic assumptions fixed.
      Demand, capacities, contribution and horizon are explicit hypothetical inputs, not measured site facts.
    evidence_to_inspect: Inspect four gap classes and corresponding evidence obligations, campaign labor/equipment
      accounting, demand-limited units forgone, opportunity cost and payback conditional on successful
      separately approved closure. Missing demand or contribution leaves the cost comparison unknown.
    feedback_contract: Feedback rejects campaigns that cannot supply the missing evidence and premature removal
      of a restriction. A low price does not repair an absent authority path, and a short conditional
      payback does not establish actual closure. The final brief may conclude REFUSE plus a precise next measurement
      rather than a complete deployment.
    explanation_prompt: Why is this the next evidence-generating action, what would reverse your recommendation,
      and what remains forbidden meanwhile?
    assessment: Why is this the next evidence-generating action, what would reverse your recommendation,
      and what remains forbidden meanwhile?
    scope: Constructed gap-to-campaign decisions and hypothetical cost accounting. No campaign is
      performed, success probability estimated, proof checked, demand forecast validated or restriction
      closed. Conditional payback counts operating hours after successful separately approved closure;
      campaign downtime, full task-cycle effects and sample sizing are unmodeled.
    mlsysim_apis:
    - mlsysim.labs.experiments.v4_frontier.study
  runtime_parts:
  - part: A
    title: Transfer the questions, not the warehouse numbers
    question: Which reasoning transferred immediately, and which apparently similar parameter needed a
      new measurement?
    goal: Apply the four laws in order to transport, contact and thermal consequences of a new packaging
      cell.
    concept_ids:
    - v4_18_A
    coverage: Chapter-owned controlled reference investigation; execution coverage is qualified by the
      displayed study.
    limitation: The hypothetical cell is a screen; it is not a measured or approved station configuration.
    artifact: Inspect the packaging-cell scenario and record-chain audit. Use mlsysim.physics.calc_safe_stopping_distance
      and calc_max_permitted_velocity only for the chapter’s explicit constant-deceleration screen, with
      its declared limitations.
    scope: Reference calculation or constructed trace, explicitly labeled by the instrument; physical
      observations require separate bench records.
    next: Which proposed experiment could distinguish the states in time, and which only produced another
      confidence score?
  - part: B
    title: More training cannot reveal an unobserved premise
    question: Which proposed experiment could distinguish the states in time, and which only produced
      another confidence score?
    goal: Distinguish a monitored unknown from a physical state the onboard channel never observes before
      the action deadline.
    concept_ids:
    - v4_18_B
    coverage: Chapter-owned controlled reference investigation; execution coverage is qualified by the
      displayed study.
    limitation: No simulated film detector establishes real sensor coverage or traction qualification.
    artifact: Use chapter-supported stopping and friction scenarios with calc_scurve_stop_distance/calc_scurve_max_permitted_velocity;
      inspect latest useful observation and what each proposed response could actually measure.
    scope: Reference calculation or constructed trace, explicitly labeled by the instrument; physical
      observations require separate bench records.
    next: What prevents a later checkpoint from silently restoring normal speed, and which rate could
      the shield model legitimately act on?
  - part: C
    title: A written restriction needs an owner and enforcement
    question: What prevents a later checkpoint from silently restoring normal speed, and which rate could
      the shield model legitimately act on?
    goal: Make the residual premise operational and avoid double-counting conditional shield credit.
    concept_ids:
    - v4_18_C
    coverage: Chapter-owned controlled reference investigation; execution coverage is qualified by the
      displayed study.
    limitation: An enforced classroom constraint and modeled coverage do not establish an operational
      hazard-rate claim.
    artifact: Review register links to manifest, enforcer and site procedure; use mlsysim.physics.robotics.calc_shielded_system_hazard_rate
      only with supplied conditional coverage/common-cause assumptions and a genuinely unshielded input
      rate.
    scope: Reference calculation or constructed trace, explicitly labeled by the instrument; physical
      observations require separate bench records.
    next: Why is this the next evidence-generating action, what would reverse your recommendation, and
      what remains forbidden meanwhile?
  - part: D
    title: Choose the next capability by its missing evidence
    question: Why is this the next evidence-generating action, what would reverse your recommendation,
      and what remains forbidden meanwhile?
    goal: Match campaigns to four kinds of missing evidence and compare declared campaign cost with
      demand-limited restriction opportunity cost; retain restrictions pending actual closure.
    concept_ids:
    - v4_18_D
    coverage: Constructed four-class campaign comparison and conditional opportunity-cost accounting.
    limitation: The final product is systems judgment and a reviewable plan, not permission to operate
      or a completed safety certification.
    artifact: Four gap classes and evidence obligations, campaign cost, demand-limited forgone output,
      restriction opportunity cost and successful-closure-conditional payback; missing demand/value stays unknown.
    scope: Reference calculation or constructed trace, explicitly labeled by the instrument; physical
      observations require separate bench records.
    next: 'Finish with a bounded engineering recommendation: proposed next test, retained restriction,
      owner and closure criterion, ready for human review rather than automatic release.'
  primary_concept_dispositions:
  - concept: Four-law audit of a new machine
    disposition: core investigation
    lab_concepts:
    - v4_18_A
    reason: Investigate the chapter-owned claim under declared reference conditions; verify the actual
      study limitation before inferring coverage.
  - concept: Residual-claims register
    disposition: core investigation
    lab_concepts:
    - v4_18_B
    - v4_18_C
    reason: Investigate the chapter-owned claim under declared reference conditions; verify the actual
      study limitation before inferring coverage.
  - concept: Next capability by missing evidence
    disposition: core investigation
    lab_concepts:
    - v4_18_D
    reason: Four constructed gap classes each have matched/mismatched campaigns; hypothetical labor,
      equipment, demand and contribution support conditional cost accounting only. Actual campaign
      results, closure, sample sizing and physical approval remain absent.
  studio_bridge:
    studio: labs/vol4/labs/lab-capstone-studio.md
    relationship: A separate supervised physical studio explores related mechanisms. The browser companion
      does not issue hardware commands, validate this bench, or replace its staff sign-off.
