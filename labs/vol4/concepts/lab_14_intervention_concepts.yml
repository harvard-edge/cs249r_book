lab_concept_map:
  schema_version: 1
  lab_id: v4_14
  volume: vol4
  chapter: 14
  title: Supervisory Intervention
  source_notebook: labs/vol4/lab_14_intervention.py
  source_chapter_concept_map: books/vol4/14_intervention/intervention_concepts.yml
  book_anchor: sec-intervention
  status: development companion; physical studio remains unverified
  chapter_goal: When can a person take proposal authority on a named channel, and how does the machine
    protect itself before that person is ready?
  student_goals:
  - Distinguish transfer of proposal authority from permission, and derive the last permissible wait from
    clearance.
  - Explain how the prepare/acknowledge/commit sequence prevents dual writers and stale handover.
  - Relate bounded jerk/rate transitions to stopping-distance cost and controller initial state.
  - Connect per-channel annunciation to truthful, loss-aware authority records and reviewable recovery
    data.
  narrative:
    situation: The robot finds a blocked aisle and asks a remote assistant for help. A colleague assumes
      that requesting takeover immediately transfers responsibility and makes continued motion safe.
    previously: Use the loaded timing allocation and resident enforcement path rather than moving protection
      into the console. These are the project's supplied starting assumptions; compatible earlier student
      evidence is not presumed.
    next: Attack the timing, ownership and observation assumptions deliberately and score them against
      a precommitted oracle.
    submission: Authority manifest and per-channel takeover trace with capability, owner, presence lease,
      handshake phase, blend and fallback evidence. Submit one integrated discussion tying the saved comparisons
      to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_14_A
    title: Ask for help without spending the last stopping margin
    investigation_title: Ask for help without spending the last stopping margin
    source_concepts:
    - chapter: 14
      concept: Intervention transfers the right to propose
      concept_map: books/vol4/14_intervention/intervention_concepts.yml
    - chapter: 14
      concept: Takeover delay in the stopping budget
      concept_map: books/vol4/14_intervention/intervention_concepts.yml
    - chapter: 14
      concept: Clearance-derived fallback deadline
      concept_map: books/vol4/14_intervention/intervention_concepts.yml
    learning_claim: Supervisory intervention transfers the right to propose on named actuator channels
      from the policy to an authenticated person, committed on a control tick and bounded by a lease,
      while every human command still passes the permission check. Takeover latency (sensory, cognitive,
      motor, console) is long-tailed and must be budgeted at a design percentile as a delay before braking,
      which sets the speed a supervised machine may run. Fixing the current speed and solving the stopping
      inequality for the wait gives the latest fallback deadline, so a handover timeout is a function
      of state, and any configured ceiling is clipped to it.
    tradeoff: Compare an attentive operator and an out-of-loop monitoring case; choose immediate local
      fallback, reduced speed before request, or a supported wait window.
    student_action: Compare an attentive operator and an out-of-loop monitoring case; choose immediate
      local fallback, reduced speed before request, or a supported wait window.
    held_fixed: Hold physical clearance and stop bounds fixed; do not choose a universal human reaction
      constant or count a request as completed takeover.
    evidence_to_inspect: Use calc_scurve_stop_distance and calc_scurve_max_permitted_velocity with the
      chapter’s supported takeover-delay cases; inspect reaction, communication, handshake and brake-onset
      lanes.
    feedback_contract: Feedback identifies the remaining wait budget or its absence. A human command is
      checked by the same enforcer; a delayed reply cannot recover distance already spent.
    explanation_prompt: When did waiting for an expert cease to be defensible, and why must fallback be
      local?
    assessment: When did waiting for an expert cease to be defensible, and why must fallback be local?
    scope: Reaction distributions and staffing assumptions need evidence; model averages are not guaranteed
      response times.
    mlsysim_apis: []
  - id: v4_14_B
    title: One channel, one proposer, one bounded lease
    investigation_title: One channel, one proposer, one bounded lease
    source_concepts:
    - chapter: 14
      concept: Authority leases and physical presence
      concept_map: books/vol4/14_intervention/intervention_concepts.yml
    - chapter: 14
      concept: Single-writer handover handshake
      concept_map: books/vol4/14_intervention/intervention_concepts.yml
    learning_claim: Autonomous chunks and manual sessions hold separate leases on the safety MCU's clock,
      so a silent policy, a dropped link, or an incapacitated operator loses authority to a state-matched
      local fallback. Per channel, authority resolves every tick to exactly one state with the enforcer
      the sole actuator writer, and a four-phase request-acknowledge-commit-release handshake moves it.
    tradeoff: Replay lost, duplicated and delayed packets and an operator-presence loss; choose the admissible
      next transition and channel owner.
    student_action: Replay lost, duplicated and delayed packets and an operator-presence loss; choose
      the admissible next transition and channel owner.
    held_fixed: Fix capability matrix and hardware lease policy; retain channel identities rather than
      a single whole-machine mode.
    evidence_to_inspect: Trace-review the four-phase chapter handshake, role credential, MCU expiry and
      per-channel ownership over time; compare writer events against the independent admission path.
    feedback_contract: Feedback names ambiguous/incomplete transfers and continues the old bounded authority
      or resident fallback as specified. A console displaying manual does not establish committed ownership.
    explanation_prompt: Which packet loss left the human and robot with different beliefs, and what prevented
      both from driving?
    assessment: Which packet loss left the human and robot with different beliefs, and what prevented
      both from driving?
    scope: This reviews the state machine; it does not establish console authentication, physical presence
      detection or real network bounds.
    mlsysim_apis: []
  - id: v4_14_C
    title: Smooth transfer still has a physical price
    investigation_title: Smooth transfer still has a physical price
    source_concepts:
    - chapter: 14
      concept: Bumpless transfer
      concept_map: books/vol4/14_intervention/intervention_concepts.yml
    learning_claim: A setpoint swap at commit demands an unbounded command derivative, so the enforcer
      blends between latched endpoints with a quintic smoothstep whose duration is set by the rate limit
      and paid from stopping reserve.
    tradeoff: Compare abrupt switching and supported longer/shorter quintic blend windows; then inspect
      a matched versus uninitialized controller state.
    student_action: Compare abrupt switching and supported longer/shorter quintic blend windows; then
      inspect a matched versus uninitialized controller state.
    held_fixed: Keep last admitted command, requested human target and effort/rate ceilings fixed for
      the blend comparison.
    evidence_to_inspect: Compare exact quintic acceleration-command, jerk, speed and travel samples on
      permission ticks, including the minimum resident-stop reserve. Inspect the separate torque-channel
      duration from calc_quintic_blend_duration and the matched versus unknown controller state.
    feedback_contract: Feedback shows the lower mechanical step alongside delayed braking and remaining
      clearance. A smooth output blend cannot erase an upstream integrator mismatch.
    explanation_prompt: Which blend window met both rate and distance requirements, and when was there
      no feasible compromise?
    assessment: Which blend window met both rate and distance requirements, and when was there no feasible
      compromise?
    scope: Constructed remaining-clearance cases are distinct from the chapter’s in-loop session. The
      ramp-plus-ideal-brake tail lacks terminal smoothing and is a lower-bound comparison. Controller
      mismatch is disclosed rather than simulated; the model does not qualify physical braking or haptics.
    mlsysim_apis: []
  - id: v4_14_D
    title: Make authority visible and reconstructable
    investigation_title: Make authority visible and reconstructable
    source_concepts:
    - chapter: 14
      concept: Mode confusion and per-channel annunciation
      concept_map: books/vol4/14_intervention/intervention_concepts.yml
    - chapter: 14
      concept: Authority record
      concept_map: books/vol4/14_intervention/intervention_concepts.yml
    learning_claim: Single-writer gating resolves arbitration faults but not mode confusion, the gap between
      the mode a supervisor believes and the actual one, which only per-channel masks and annunciation
      fix. The authority record binds a sealed static authority manifest to a per-tick evidence tuple
      of time, authority state, measured state, proposed and admitted commands, so every handover is reconstructable
      and attributable.
    tradeoff: Compare a single manual-mode lamp with channel/phase annunciation and compare complete,
      gapped and replayed records; select which recovery samples can support later training.
    student_action: Compare a single manual-mode lamp with channel/phase annunciation and compare complete,
      gapped and replayed records; select which recovery samples can support later training.
    held_fixed: Use the same takeover event and actual ownership transitions; do not infer physical motion
      solely from requested commands.
    evidence_to_inspect: Inspect actor/channel/lease/phase/rung, monotonic sequence and loss markers against
      independent plant observations; preserve masked drift and synthetic blend segments distinctly from
      operator recovery.
    feedback_contract: Feedback shows what an operator could know in time and which incident questions
      remain unanswerable. A log gap stays unknown; rescue data is not automatically expert demonstration.
    explanation_prompt: What could an assistant misunderstand, and which record field would prevent an
      investigator from making that same inference?
    assessment: What could an assistant misunderstand, and which record field would prevent an investigator
      from making that same inference?
    scope: Use anonymized teaching traces; never expose real student/operator identities or repurpose
      takeover records as performance scores.
    mlsysim_apis: []
