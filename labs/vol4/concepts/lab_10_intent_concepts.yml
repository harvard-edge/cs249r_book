lab_concept_map:
  schema_version: 1
  lab_id: v4_10
  volume: vol4
  chapter: 10
  title: Grounded Intent
  source_notebook: labs/vol4/lab_10_intent.py
  source_chapter_concept_map: books/vol4/10_intent/intent_concepts.yml
  book_anchor: sec-intent
  status: development companion; physical studio remains unverified
  chapter_goal: Which target can the permission side grant, for how long, and which requests must be refused
    before trajectory planning?
  student_goals:
  - Distinguish a named object from a metric affordance and keep the task tolerance independent of the
    proposer’s confidence.
  - Separate operator success, unique referent selection and physical admission.
  - Explain why evidence expiry, administrative silence and stopping reserve jointly bound the granted
    target.
  - Balance early conflict rejection against conservatism in forward occupancy horizon.
  narrative:
    situation: The warehouse mobile manipulator has a dated belief about a red mug on a moving belt. A
      teammate wants to turn the instruction “pick the red mug” straight into a reach. The station arm
      offers a bounded tabletop analogue; it does not inherit warehouse parameters.
    previously: Carry the belief record, its evidence epoch, uncertainty growth, occupied and unknown
      regions from Spatial Memory. These are the project's supplied starting assumptions; compatible earlier
      student evidence is not presumed.
    next: A granted target still contains no executable path. Next, make a replacement trajectory that
      can join motion already underway and stop independently.
    submission: Intent lease with parent belief digest, calibrated referent status, goal set, predicates,
      effort ceilings, expiry basis and refusal reasons. Submit one integrated discussion tying the saved
      comparisons to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_10_A
    title: Specify the grasp, then fit the evidence
    investigation_title: Specify the grasp, then fit the evidence
    source_concepts:
    - chapter: 10
      concept: Grounded affordance
      concept_map: books/vol4/10_intent/intent_concepts.yml
    - chapter: 10
      concept: Goal set is a specification
      concept_map: books/vol4/10_intent/intent_concepts.yml
    learning_claim: A request names an outcome, not a motion, and a target becomes checkable only as a
      feature pose in the base frame with approach direction, jaw aperture, and contact-wrench ceiling,
      each tied to dated sensor evidence. The admissible goal set is fixed by the verified task profile
      from what the grasp can physically absorb, not estimated by the proposer, and the proposal's error
      envelope plus tracking reserve must fit inside it.
    tradeoff: Compare retaining the verified grasp specification, collecting a closer observation, or
      declining the reach when the error region does not fit. Do not offer widening the task tolerance
      as a free fix.
    student_action: Compare retaining the verified grasp specification, collecting a closer observation,
      or declining the reach when the error region does not fit. Do not offer widening the task tolerance
      as a free fix.
    held_fixed: Hold the task’s verified tolerance and contact ceiling fixed; change only the observation
      case before separately changing the viewpoint.
    evidence_to_inspect: Overlay supplied handle-error regions and tracking reserve on the verified goal
      set; compare dated camera/base frames and approach direction. Source machine/task inputs from the
      same chapter registry as the QMD; geometry containment is trace review unless the package provides
      its exact test.
    feedback_contract: Reactive feedback identifies the failing axis/frame or the reserve still available,
      and the information/latency price of a closer view. It says insufficient evidence rather than presenting
      a statistical region as a hard guarantee.
    explanation_prompt: Why did a better estimate make this same grasp admissible without changing the
      grasp’s physical requirements?
    assessment: Why did a better estimate make this same grasp admissible without changing the grasp’s
      physical requirements?
    scope: This is specification and evidence review, not force-closure or real grasp qualification.
    mlsysim_apis: []
  - id: v4_10_B
    title: A confident coordinate can name the wrong thing
    investigation_title: A confident coordinate can name the wrong thing
    source_concepts:
    - chapter: 10
      concept: Operators discharged by motion predicates
      concept_map: books/vol4/10_intent/intent_concepts.yml
    - chapter: 10
      concept: Calibrated referent refusal
      concept_map: books/vol4/10_intent/intent_concepts.yml
    - chapter: 10
      concept: Admission checks physics not meaning
      concept_map: books/vol4/10_intent/intent_concepts.yml
    learning_claim: A symbolic operator asserts preconditions and effects it cannot verify, so each fact
      must map to a measurable motion predicate before any step that depends on it is admitted. A detector
      score measures prompt match, not uniqueness, so the producer forms a conformal prediction set over
      referents and refuses with a typed reason unless exactly one candidate remains. Metric precision
      does not establish identity, so a confident wrong object yields a collision-free, torque-limited
      proposal that passes every check the safety MCU can make, and semantic errors need their own defense.
    tradeoff: Choose top-score selection, calibrated-set refusal, or a clarification request on supplied
      mug/jar/duplicate cases; then select the measured predicate needed before the next operator.
    student_action: Choose top-score selection, calibrated-set refusal, or a clarification request on
      supplied mug/jar/duplicate cases; then select the measured predicate needed before the next operator.
    held_fixed: Use the same candidate scores, held-out calibration packet and geometric scene for each
      selection rule; do not retune calibration on the evaluation case.
    evidence_to_inspect: Inspect candidate membership, label truth in the supplied review packet, operator
      preconditions and independent reach/contact predicates. This is trace review; no live language-model
      call or local invented confidence calculator.
    feedback_contract: Feedback can show a physically feasible wrong-object proposal passing physical
      checks, or ambiguity correctly refusing progress. A single candidate is an evidence-conditioned
      semantic decision, not permission to move.
    explanation_prompt: Which failure could a torque or collision checker never discover, and what evidence
      would prevent it?
    assessment: Which failure could a torque or collision checker never discover, and what evidence would
      prevent it?
    scope: Conformal coverage requires its stated calibration assumptions; a toy score ranking does not
      establish calibrated refusal.
    mlsysim_apis: []
  - id: v4_10_C
    title: A reachable target can expire before arrival
    investigation_title: A reachable target can expire before arrival
    source_concepts:
    - chapter: 10
      concept: Expiring intent lease
      concept_map: books/vol4/10_intent/intent_concepts.yml
    - chapter: 10
      concept: Dynamic reachability
      concept_map: books/vol4/10_intent/intent_concepts.yml
    learning_claim: The permission side grants a target, never a path, as a lease binding goal set, affordance
      frame, predicates, ceilings, and an MCU-selected fallback to a hardware deadline at the earliest
      of the evidence horizon, the administrative lease, and the stopping deadline. A target inside the
      static workspace is still inadmissible if the transit time at the speed ceiling exceeds the remaining
      evidence window (a handle 300 mm away needs 300 ms against a 219 ms horizon).
    tradeoff: Vary one supported tracking case or target-motion assumption; compare a direct terminal
      grasp with renewable guarded progress or refusal.
    student_action: Vary one supported tracking case or target-motion assumption; compare a direct terminal
      grasp with renewable guarded progress or refusal.
    held_fixed: Fix verified tolerance, plant speed ceiling and current clearance for the first comparison;
      retain the original capture epoch on repeated proposals.
    evidence_to_inspect: Use mlsysim.physics.robotics.calc_target_evidence_horizon and calc_tracked_evidence_horizon
      for their supported motion models; align requested and admitted lease expiry with MCU time, transit
      lower bound and supplied stop budget.
    feedback_contract: Feedback identifies the binding deadline and whether transit fits it. Reissuing
      the same capture never resets evidence age. Improving tracking can move the binding constraint to
      administrative or stop expiry.
    explanation_prompt: When did more accurate tracking stop helping, and why is a renewable target different
      from stretching one stale lease?
    assessment: When did more accurate tracking stop helping, and why is a renewable target different
      from stretching one stale lease?
    scope: Unsupported target dynamics remain unknown; these modeled horizons are not measured tracker
      bounds.
    mlsysim_apis: []
  - id: v4_10_D
    title: Screen the corridor without freezing the mission
    investigation_title: Screen the corridor without freezing the mission
    source_concepts:
    - chapter: 10
      concept: Forward occupancy screening
      concept_map: books/vol4/10_intent/intent_concepts.yml
    learning_claim: A corridor is screened early against each tracked person's forward occupancy set,
      growing from the last measurement at the walking-speed bound, and the screening horizon decides
      when the planner should stop waiting.
    tradeoff: Compare short supported forecast horizons and a longer conservative screen; select wait,
      refresh, or reject for the same corridor.
    student_action: Compare short supported forecast horizons and a longer conservative screen; select
      wait, refresh, or reject for the same corridor.
    held_fixed: Hold actor last-measurement epoch, uncertainty, speed bound and candidate corridor fixed
      before a separate refresh comparison.
    evidence_to_inspect: Inspect the chapter’s supplied forward-occupancy trace and corridor intersections
      at each horizon. This is a bounded geometric trace-review device; any new sweep calculation belongs
      in MLSysIM before use.
    feedback_contract: Feedback names the first potential conflict and shows that waiting also ages evidence.
      An all-clear screen merely permits detailed planning; a distant possible occupancy need not imply
      imminent contact.
    explanation_prompt: Which horizon rejects a useful corridor unnecessarily, and which leaves an unexamined
      conflict for the next stage?
    assessment: Which horizon rejects a useful corridor unnecessarily, and which leaves an unexamined
      conflict for the next stage?
    scope: Intent screening neither predicts a person’s actual path nor certifies a collision-free trajectory.
    mlsysim_apis: []
