lab_concept_map:
  schema_version: 1
  lab_id: v4_08
  volume: vol4
  chapter: 8
  title: Sensor Perception
  source_notebook: labs/vol4/lab_08_perception.py
  source_chapter_concept_map: books/vol4/08_perception/perception_concepts.yml
  book_anchor: sec-perception
  status: development companion; physical studio remains unverified
  chapter_goal: Choose sensing and a dated observation contract whose physical quantity, qualified error,
    age and failure behavior support the intended consumer.
  student_goals:
  - Distinguish semantic proposal support from qualified metric evidence of clearance.
  - Apply capture-time geometry and bounded clock conversion rather than dating observations at arrival.
  - Compare pipeline age and empirical residual allocations while refusing mismatched residual evidence.
  - Distinguish transport health from physical measurement validity and construct a consumer-refusable
    contract.
  narrative:
    situation: A rack-end detector delivers a confident worker label, but the frame was exposed earlier
      and its range and coordinate chain may no longer support the clearance decision.
    previously: Evaluation named the conditions supported by the frozen system and the gaps the runtime
      must detect. These are the project's supplied starting assumptions; compatible earlier student evidence
      is not presumed.
    next: Memory must retain and combine these dated measurements without renewing their evidence by prediction
      or republishing.
    submission: Observation contract with capture epoch, clock conversion bound, frame/calibration identity,
      payload, uncertainty/inset, health and integrity. Submit one integrated discussion tying the saved
      comparisons to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_08_A
    title: Measure the quantity the decision needs
    investigation_title: Measure the quantity the decision needs
    source_concepts:
    - chapter: 8
      concept: Sensor chosen by physical quantity
      concept_map: books/vol4/08_perception/perception_concepts.yml
    - chapter: 8
      concept: Metric veto
      concept_map: books/vol4/08_perception/perception_concepts.yml
    learning_claim: Each modality measures one physical quantity (bearing and appearance, metric range,
      Doppler velocity, contrast change, contact deformation) with its own environmental failures, so
      sensing is chosen by the quantity the decision needs. Learned depth and semantic confidence are
      not metric evidence, so a learned head may classify and propose but the range that enters a clearance
      check comes from qualified metric sensing, which can veto.
    tradeoff: Choose camera, metric range, velocity or contact evidence for a stated decision and compare
      agreement/conflict cases with the learned proposal.
    student_action: Choose camera, metric range, velocity or contact evidence for a stated decision and
      compare agreement/conflict cases with the learned proposal.
    held_fixed: Same scene and decision; sensor qualification conditions stay attached to each evidence
      source.
    evidence_to_inspect: Modality-to-quantity table, qualified range overlay and separate semantic confidence.
    feedback_contract: A learned label or depth confidence cannot overrule absent or contradictory qualified
      range; redundant sensors sharing a failure are not independent evidence.
    explanation_prompt: Which sensor can veto this proposed motion and what has it actually measured?
    assessment: Which sensor can veto this proposed motion and what has it actually measured?
    scope: No fused estimator here; recursive estimation belongs to Memory.
    mlsysim_apis: []
  - id: v4_08_B
    title: Date and place the measurement
    investigation_title: Date and place the measurement
    source_concepts:
    - chapter: 8
      concept: Capture epoch
      concept_map: books/vol4/08_perception/perception_concepts.yml
    - chapter: 8
      concept: Calibration chain
      concept_map: books/vol4/08_perception/perception_concepts.yml
    learning_claim: A measurement is dated at its exposure midpoint or per-point firing time, never at
      arrival, and rolling-shutter rows and LiDAR sweeps sample the scene at different instants that capture-time
      geometry must undo. Every metric claim rests on intrinsics, extrinsics, and inter-sensor time offsets
      composed along a frame tree at the capture instant, and angular and timing errors scale with range
      and turn rate.
    tradeoff: Compare exposure/per-point dating with arrival dating and a synchronized versus stale transform
      chain on a supplied turning trace.
    student_action: Compare exposure/per-point dating with arrival dating and a synchronized versus stale
      transform chain on a supplied turning trace.
    held_fixed: Same raw captures, mounting chain and observed machine motion.
    evidence_to_inspect: Capture/arrival planar frame edges, transformed landmark coordinates, geometry residual
      and the separate clock-induced spatial bound.
    feedback_contract: Explain timing-induced displacement and range/lever-arm-sensitive geometry errors;
      a valid tensor does not reveal its own epoch.
    explanation_prompt: Which calibration or clock premise must be renewed before the geometry can support
      clearance?
    assessment: Which calibration or clock premise must be renewed before the geometry can support clearance?
    scope: Constructed planar turn-in-place frame chain; no rolling-shutter compensation, installed calibration
      qualification, or physical clearance guarantee.
    mlsysim_apis: []
  - id: v4_08_C
    title: Age and error spend the same clearance
    investigation_title: Age and error spend the same clearance
    source_concepts:
    - chapter: 8
      concept: Observation age
      concept_map: books/vol4/08_perception/perception_concepts.yml
    - chapter: 8
      concept: Clearance inset from measured residuals
      concept_map: books/vol4/08_perception/perception_concepts.yml
    learning_claim: Observation age runs from the exposure midpoint to dispatch, accumulates stage by
      stage (exposure, readout, transport, DMA, ISP, backbone, dispatch), and is paid in blind travel
      that no later stage returns. Spatial error is spent from the same clearance as age, so the clearance
      inset rests on a measured high quantile of residuals against ground truth, which for stereo grows
      with range squared.
    tradeoff: Change one constructed pipeline stage; separately compare matched, mismatched or absent finite
      residual samples for near and far rack conditions.
    student_action: Change one constructed pipeline stage; separately compare matched, mismatched or absent
      finite residual samples for near and far rack conditions.
    held_fixed: Capture, speed and consumer decision; other waterfall stages and residual provenance held
      explicit.
    evidence_to_inspect: Stage durations, total age, blind travel, finite-sample absolute residual quantile and condition
      match; sensing allocation remains unknown when matching residual evidence is absent.
    feedback_contract: Only affected stages change; shrinking inference cannot reclaim prior exposure
      time, and an unqualified residual set leaves the bound unknown.
    explanation_prompt: Which intervention buys useful clearance without weakening the evidence behind
      its error bound?
    assessment: Which intervention buys useful clearance without weakening the evidence behind its error
      bound?
    scope: Constructed stage split of canonical total age and finite residual order statistics only; no measured
      pipeline profile, population error bound, detector quality, or physical sensor qualification.
    mlsysim_apis:
    - mlsysim.labs.experiments.v4_estimation.empirical_absolute_quantile
  - id: v4_08_D
    title: A complete frame can still be unusable
    investigation_title: A complete frame can still be unusable
    source_concepts:
    - chapter: 8
      concept: Silent versus detectable failure
      concept_map: books/vol4/08_perception/perception_concepts.yml
    - chapter: 8
      concept: Observation contract
      concept_map: books/vol4/08_perception/perception_concepts.yml
    learning_claim: Detectable faults raise flags and age out honestly, while silent failures (saturation,
      contamination, fog backscatter, a misdated frame) deliver valid tensors, so the design must convert
      silent modes into detectable ones. Each observation is wrapped with capture time, clock id, clock-conversion
      bound, frame, payload, covariance, clearance inset, health bits, and CRC so a consumer can refuse
      it before reading a payload byte.
    tradeoff: Inspect dropout, saturation, contamination and misdating cases; select health checks and
      reject incomplete/expired contracts before using the payload.
    student_action: Inspect dropout, saturation, contamination and misdating cases; select health checks
      and reject incomplete/expired contracts before using the payload.
    held_fixed: Same consumer requirement and contract schema; each failure retains its declared detection
      limitations.
    evidence_to_inspect: Health bits, capture clock/bound, calibration identity, integrity and qualification
      fields with observed versus unknown status.
    feedback_contract: Detectable faults age out honestly; a healthy packet or support monitor does not
      certify the transducer’s physical truth.
    explanation_prompt: Which silent failure remains and what independent evidence would convert it into
      a detectable condition?
    assessment: Which silent failure remains and what independent evidence would convert it into a detectable
      condition?
    scope: Tests can expose failures but do not certify universal sensor validity or adversarial resistance.
    mlsysim_apis: []
