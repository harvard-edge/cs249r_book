lab_concept_map:
  schema_version: 1
  lab_id: v4_06
  volume: vol4
  chapter: 6
  title: Policy Training
  source_notebook: labs/vol4/lab_06_training.py
  source_chapter_concept_map: books/vol4/06_training/training_concepts.yml
  book_anchor: sec-training
  status: development companion; physical studio remains unverified
  chapter_goal: Choose a training regime and decoder whose support and timing fit the latch task, then
    hand a versioned candidate to evaluation without granting it physical authority.
  student_goals:
  - Explain the trade between representing multiple action modes and delivering each proposal before renewal.
  - Trace a candidate’s behavior to the experience supporting it and distinguish high estimated value
    from action support.
  - Distinguish dynamics, sensing, appearance and timing mismatches and choose a probe that resolves a
    specific uncertainty.
  - Preserve checkpoint-specific evidence when fine-tuning or adding a gated residual.
  narrative:
    situation: The team has a clean nominal archive, some verified recovery, a fast simulator, and limited
      hardware time. Each training path can improve a score while hiding a different dependency.
    previously: The provenance record distinguishes supported data, recovery examples, omissions and embodiment
      conditions. These are the project's supplied starting assumptions; compatible earlier student evidence
      is not presumed.
    next: The evaluation chapter will test bounded closed-loop claims for this exact checkpoint and configuration.
    submission: Policy manifest with regime sequence, checkpoint digest, inference contract, support-minus-omissions
      claim and wear log. Submit one integrated discussion tying the saved comparisons to your decision
      or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_06_A
    title: Two good actions can average into a bad one
    investigation_title: Two good actions can average into a bad one
    source_concepts:
    - chapter: 6
      concept: Mode averaging
      concept_map: books/vol4/06_training/training_concepts.yml
    - chapter: 6
      concept: Decoder renewal slack
      concept_map: books/vol4/06_training/training_concepts.yml
    learning_claim: The squared-error optimum of a point-regression policy is the conditional mean of
      the action, so two valid evasions average to an action no demonstrator chose, and more data or capacity
      cannot fix it. A decoder chosen for multimodality must fit the proposal deadline, since latency
      is encoding plus every dependent decoder evaluation, so the head and evaluation count that training
      picks decide schedulability.
    tradeoff: Compare the conditional mean and either supplied action mode at one obstacle cross-section;
      vary dependent decoder evaluations and added delay under declared illustrative timing.
    student_action: Compare the conditional mean and either supplied action mode at one obstacle cross-section;
      vary dependent decoder evaluations and added delay under declared illustrative timing.
    held_fixed: Same ambiguous observation and demonstrated action modes; fixed hardware and encoding
      workload.
    evidence_to_inspect: Supplied lateral action coordinates, their computed mean and squared error, a single
      obstacle cross-section screen, and encoder-plus-dependent-decoder timing allocations.
    feedback_contract: Show when the mean lies outside demonstrated modes and when a richer decoder exhausts
      renewal slack; no choice gets free accuracy and free latency.
    explanation_prompt: Which representation fixes the ambiguity and which inference contract must it
      satisfy?
    assessment: Which representation fixes the ambiguity and which inference contract must it satisfy?
    scope: Finite constructed action coordinates at one cross-section, not a complete path. Declared
      decoder costs do not establish measured latency, learned quality, dynamics or closed-loop feasibility.
    mlsysim_apis:
    - mlsysim.labs.experiments.v4_training.study
  - id: v4_06_B
    title: A training score leaves out its dependency
    investigation_title: A training score leaves out its dependency
    source_concepts:
    - chapter: 6
      concept: Training-regime hidden dependency
      concept_map: books/vol4/06_training/training_concepts.yml
    - chapter: 6
      concept: Offline RL support limit
      concept_map: books/vol4/06_training/training_concepts.yml
    learning_claim: A policy's weights keep what its experience rewarded but not which experience it was,
      so each regime (demonstrations, logged rewards, simulation, trial on the machine, a pretrained base)
      leaves a characteristic dependency no training score shows. Fitting values over a fixed log and
      acting greedily inflates values at actions the log never executed, and conservative objectives reduce
      that error but cannot create support the log lacks.
    tradeoff: Choose a candidate from demonstrations, reward-labeled logs, simulation or a pretrained
      base; compare its support at the displaced strike plate.
    student_action: Choose a candidate from demonstrations, reward-labeled logs, simulation or a pretrained
      base; compare its support at the displaced strike plate.
    held_fixed: Target latch condition and complete evidence packet; scores remain within their own regime.
    evidence_to_inspect: Support map and exposure→dependency→violated-assumption→signature chain; unsupported
      actions highlighted.
    feedback_contract: Conservative values can reduce extrapolation without creating missing experience;
      a high return cannot fill an empty support region.
    explanation_prompt: What experience would justify the proposed recovery, rather than merely improve
      its training score?
    assessment: What experience would justify the proposed recovery, rather than merely improve its training
      score?
    scope: Trace review is not an offline-RL solver; no cross-regime score ranking claims physical superiority.
    mlsysim_apis: []
  - id: v4_06_C
    title: Spend trials where the simulator is wrong
    investigation_title: Spend trials where the simulator is wrong
    source_concepts:
    - chapter: 6
      concept: Physical RL exploration cost
      concept_map: books/vol4/06_training/training_concepts.yml
    - chapter: 6
      concept: Reality gap as a vector
      concept_map: books/vol4/06_training/training_concepts.yml
    learning_claim: A trial campaign's wall clock is trials times rollout plus reset over rigs (about
      93 days of execution for 10^6 latch trials before resets), and every trial spends heat and drivetrain
      life. Sim-to-real mismatch decomposes into dynamics, sensing, appearance, and timing channels, each
      sized by paired probing, and randomization covers modeled parameters but never omitted mechanisms.
    tradeoff: Allocate a bounded campaign between paired system-identification probes and additional simulator
      trials; compare a modeled randomized parameter with an omitted mechanism.
    student_action: Allocate a bounded campaign between paired system-identification probes and additional
      simulator trials; compare a modeled randomized parameter with an omitted mechanism.
    held_fixed: Same task tolerance, available rigs and supplied rollout/reset/wear records.
    evidence_to_inspect: Gap vector in native units, paired command-response traces, calendar and wear
      accounting, explicit omission log.
    feedback_contract: Randomization covers declared parameters but cannot cover missing mechanisms; trial
      parallelism does not erase per-machine wear or reset labor.
    explanation_prompt: Which probe changes the engineering decision and which simulation claim remains
      unsupported?
    assessment: Which probe changes the engineering decision and which simulation claim remains unsupported?
    scope: No locally invented contact solver or trial success distribution; physical probes belong to
      supervised studio.
    mlsysim_apis:
    - mlsysim.Embodied
  - id: v4_06_D
    title: An update creates a new candidate
    investigation_title: An update creates a new candidate
    source_concepts:
    - chapter: 6
      concept: Update is a new checkpoint
      concept_map: books/vol4/06_training/training_concepts.yml
    - chapter: 6
      concept: Policy manifest
      concept_map: books/vol4/06_training/training_concepts.yml
    learning_claim: On-machine fine-tuning absorbs a measurable local mismatch but produces new weights
      whose earlier evaluations no longer apply, and a gated residual bounds where adaptation may act.
      The policy manifest records how a checkpoint was produced (regime sequence, base digest, inference
      contract, data support, omission log, wear log) and computes the declared ODD as support minus omissions.
    tradeoff: Compare base, recovery-updated and residual-gated candidates; decide which evaluations and
      assumptions must be renewed.
    student_action: Compare base, recovery-updated and residual-gated candidates; decide which evaluations
      and assumptions must be renewed.
    held_fixed: Same manifest schema and target claim; old evaluations retain their original checkpoint
      identity.
    evidence_to_inspect: Manifest diff, residual operating region and before/after supplied behavior traces;
      omission and wear records retained.
    feedback_contract: Improvement at a displaced plate does not inherit nominal behavior evidence automatically
      or close unmeasured simulator gaps.
    explanation_prompt: What exactly can this new checkpoint claim, and what must the evaluation campaign
      test next?
    assessment: What exactly can this new checkpoint claim, and what must the evaluation campaign test
      next?
    scope: Checkpoint selection only; no browser choice changes live machine weights or permission settings.
    mlsysim_apis: []
