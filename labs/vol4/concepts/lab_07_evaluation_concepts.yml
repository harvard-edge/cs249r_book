lab_concept_map:
  schema_version: 1
  lab_id: v4_07
  volume: vol4
  chapter: 7
  title: Closed-Loop Evaluation
  source_notebook: labs/vol4/lab_07_evaluation.py
  source_chapter_concept_map: books/vol4/07_evaluation/evaluation_concepts.yml
  book_anchor: sec-evaluation
  status: development companion; physical studio remains unverified
  chapter_goal: Choose a bounded claim and evidence campaign whose population, complete denominator, outcome
    channels and statistical limits match that claim.
  student_goals:
  - State whose success probability the trial campaign estimates and prevent a post-hoc narrowing of the
    claim.
  - Explain why replay error and task completion cannot substitute for autonomous closed-loop performance.
  - Choose complementary evidence by causal feedback and physical realism rather than a single fidelity
    ranking.
  - Interpret a zero-failure record without claiming zero risk or confusing task trials with hazard exposure.
  narrative:
    situation: The candidate opens the door cleanly in a short campaign. The team wants to say it is reliable,
      but some runs used simulation, some involved takeover, and only nominal plate positions were tested.
    previously: A frozen policy manifest names the candidate, support and omissions. These are the project's
      supplied starting assumptions; compatible earlier student evidence is not presumed.
    next: Runtime perception and memory must enforce the observation conditions and unsupported gaps that
      evaluation could not eliminate.
    submission: Evaluation record binding configuration digests, target ODD, sampling weights, complete
      outcomes, exact bounds and runtime obligations. Submit one integrated discussion tying the saved
      comparisons to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_07_A
    title: Define success before watching the run
    investigation_title: Define success before watching the run
    source_concepts:
    - chapter: 7
      concept: Closed-loop estimand
      concept_map: books/vol4/07_evaluation/evaluation_concepts.yml
    - chapter: 7
      concept: Predeclared trial protocol
      concept_map: books/vol4/07_evaluation/evaluation_concepts.yml
    learning_claim: A physical success rate is the expectation of a frozen outcome predicate over a declared
      distribution of trial conditions (initial state, environment, unit, frozen policy and permission
      parameters), so it belongs to that population and to no other. A finite record supports a claim
      only if the target ODD, its weights, approximately independent draws, a frozen predicate, and the
      full denominator are fixed before the first run.
    tradeoff: Select target ODD weights, frozen outcome predicate and configuration before opening supplied
      outcomes; compare a narrower declared population separately.
    student_action: Select target ODD weights, frozen outcome predicate and configuration before opening
      supplied outcomes; compare a narrower declared population separately.
    held_fixed: Frozen checkpoint and complete trial inventory; no cherry-picking after reveal.
    evidence_to_inspect: Population/sampling card, protocol lock and scenario coverage versus outcome
      table.
    feedback_contract: Flag a mismatch between tested and claimed support; untested cells remain unknown
      even if sampled cells are clean.
    explanation_prompt: Which exact population does the result describe, and what change would require
      a new protocol?
    assessment: Which exact population does the result describe, and what change would require a new protocol?
    scope: Interactive reweighting is sensitivity analysis after reveal, not a newly valid preregistered
      physical campaign.
    mlsysim_apis: []
  - id: v4_07_B
    title: Keep completion, autonomy and burden separate
    investigation_title: Keep completion, autonomy and burden separate
    source_concepts:
    - chapter: 7
      concept: Outcome channels and censored trials
      concept_map: books/vol4/07_evaluation/evaluation_concepts.yml
    - chapter: 7
      concept: Offline evaluation illusion
      concept_map: books/vol4/07_evaluation/evaluation_concepts.yml
    learning_claim: Task completion, proposer autonomy, and supervisory burden are separate channels,
      and an intervened run is an autonomy failure, never a success that was cut short (the censored trial
      fallacy). Replay resets the input to the recorded state each step, so a heading bias with a tiny
      angular MSE can spend a 15 cm aisle clearance in seconds once the loop closes.
    tradeoff: Compare replay and supplied closed-loop behavior from the same candidate; count intervened
      runs across separate completion, autonomy and burden channels.
    student_action: Compare replay and supplied closed-loop behavior from the same candidate; count intervened
      runs across separate completion, autonomy and burden channels.
    held_fixed: Same run identifiers and frozen criteria; every aborted or intervened attempt remains
      in the full log.
    evidence_to_inspect: Divergence timeline, complete denominator and three-channel outcome matrix.
    feedback_contract: Replay resets state and hides compounding effects; a completed door opening after
      takeover remains an autonomy failure.
    explanation_prompt: Which attractive aggregate conceals the failure that matters to this claim?
    assessment: Which attractive aggregate conceals the failure that matters to this claim?
    scope: Observed feedback comes from supplied trace evidence, not simulated policy execution invented
      by the notebook.
    mlsysim_apis: []
  - id: v4_07_C
    title: Choose the distortion you can tolerate
    investigation_title: Choose the distortion you can tolerate
    source_concepts:
    - chapter: 7
      concept: Four evidence regimes
      concept_map: books/vol4/07_evaluation/evaluation_concepts.yml
    learning_claim: Replay, closed-loop simulation, shadow operation, and constrained physical testing
      sit on two axes (causal feedback, physical realism) and each trades one distortion for another,
      so they are not a fidelity ladder.
    tradeoff: Allocate a campaign among replay, closed-loop simulation, shadow and constrained physical
      runs for one stated question.
    student_action: Allocate a campaign among replay, closed-loop simulation, shadow and constrained physical
      runs for one stated question.
    held_fixed: Claim, checkpoint, resource envelope and known simulator omissions.
    evidence_to_inspect: Two-axis evidence map and question-to-regime matrix with unsupported conclusions.
    feedback_contract: Shadow has physical inputs without the candidate’s causal action loop; simulation
      closes its loop without establishing real contact fidelity.
    explanation_prompt: Which combination could refute the claim, and what would still require constrained
      physical testing?
    assessment: Which combination could refute the claim, and what would still require constrained physical
      testing?
    scope: No regime is a deployment permit; physical trial instructions and thresholds require staff
      verification.
    mlsysim_apis: []
  - id: v4_07_D
    title: Clean runs have a finite ceiling
    investigation_title: Clean runs have a finite ceiling
    source_concepts:
    - chapter: 7
      concept: Zero-failure bound
      concept_map: books/vol4/07_evaluation/evaluation_concepts.yml
    - chapter: 7
      concept: Exposure wall
      concept_map: books/vol4/07_evaluation/evaluation_concepts.yml
    - chapter: 7
      concept: Evaluation record
      concept_map: books/vol4/07_evaluation/evaluation_concepts.yml
    learning_claim: At zero failures the Wald interval collapses, so a clean record is inverted exactly
      (failure bound about 3/n), which makes twenty clean runs consistent with a one-in-seven failure
      rate and makes every added nine cost about ten times the trials. Hazards are rates per operating
      hour, and bounding a rate lambda with zero events needs about 3/lambda failure-free hours, so rare
      hazards cannot be demonstrated by sampling the proposer. The evaluation record binds a bounded claim
      to its target ODD, configuration digests, sampling protocol, complete outcome log, exact statistics,
      and the catalog of unsupported gaps, which become runtime obligations.
    tradeoff: Vary admissible campaign size and confidence for a frozen zero-failure task result; separately
      ask what operating hours a hazard-rate claim would require.
    student_action: Vary admissible campaign size and confidence for a frozen zero-failure task result;
      separately ask what operating hours a hazard-rate claim would require.
    held_fixed: Sampling assumptions and claim type; task probability and per-hour hazard remain distinct.
    evidence_to_inspect: Exact clean-run confidence bound, required sample-size/exposure views, and record
      of unsupported gaps.
    feedback_contract: Finite clean data retains a nonzero failure bound; more task successes cannot establish
      arbitrary rare-hazard performance.
    explanation_prompt: What claim can be defended now, and which gap becomes a runtime or architectural
      obligation?
    assessment: What claim can be defended now, and which gap becomes a runtime or architectural obligation?
    scope: Bounds depend on the specified sampling model; no statistical result grants physical authority.
    mlsysim_apis:
    - mlsysim.physics.robotics.calc_clopper_pearson_zero_failure_bound
    - mlsysim.physics.robotics.calc_zero_failure_sample_size
    - mlsysim.physics.robotics.calc_empirical_testing_exposure
