lab_concept_map:
  schema_version: 1
  lab_id: v4_17
  volume: vol4
  chapter: 17
  title: Responsible Physical AI
  source_notebook: labs/vol4/lab_17_responsibility.py
  source_chapter_concept_map: books/vol4/17_responsibility/responsibility_concepts.yml
  book_anchor: sec-responsibility
  status: development companion; physical studio remains unverified
  chapter_goal: Who can approve each premise, who bears the remaining exposure and work, and what evidence
    must prevent an unfair or unaccountable deployment?
  student_goals:
  - Identify the earlier choices behind an admitted command and bind each to a person with authority to
    answer for it.
  - Test time, information and authority including help queues, then leave a permission stage only on
    relevant evidence.
  - Compare declared subgroup evidence support and explain why an aggregate result cannot settle an unresolved
    exposed group.
  - Balance incident reconstruction with privacy and account for rescue, inspection and monitoring work
    shifted by automation.
  narrative:
    situation: A conditional technical argument is on the table, but one supervisor serves many robots,
      some people are detected later, and detailed traces record workers and students.
    previously: Consume the release manifest and standing conditions; keep the actual machine’s refusal
      visible rather than treating the exercise’s stipulated branch as deployed. These are the project's
      supplied starting assumptions; compatible earlier student evidence is not presumed.
    next: Transfer the method to an unfamiliar machine and decide which unresolved premise deserves the
      next measurement.
    submission: Approval record exercise with decision owners, feasible oversight, staged permission,
      group evidence, data declarations and shifted-labor account. Submit one integrated discussion tying
      the saved comparisons to your decision or hold, rejected alternative, uncertainty, and reversal
      condition.
  core_concepts:
  - id: v4_17_A
    title: An action log is not a decision owner
    investigation_title: An action log is not a decision owner
    source_concepts:
    - chapter: 17
      concept: Approval record
      concept_map: books/vol4/17_responsibility/responsibility_concepts.yml
    - chapter: 17
      concept: Decisions behind an admitted action
      concept_map: books/vol4/17_responsibility/responsibility_concepts.yml
    learning_claim: The approval record names, for each decision behind an admitted action, the person
      who approved it and answers for it, together with the human roles, permit stage, exposed groups,
      records about people, and shifted labor, and the release gate reads it as a standing condition so
      that a decision with no named owner refuses operation the way an unknown premise does. One admitted
      command rests on decisions made earlier by different parties (policy, enforcer, authority state,
      envelope, crossing rule, staffing), so each party can point to another, most of those decisions
      never appear in a runtime log, and a chain of k separately kept links is complete only with the
      product of their probabilities, so the links must be recorded on purpose.
    tradeoff: Compare a complete runtime log with a completed decision chain; assign accountable roles
      to envelope, policy, crossing rule, staffing and disclosure decisions.
    student_action: Compare a complete runtime log with a completed decision chain; assign accountable
      roles to envelope, policy, crossing rule, staffing and disclosure decisions.
    held_fixed: Use the same admitted event and technical records; keep teaching roles fictional and avoid
      collecting real student names in downloads.
    evidence_to_inspect: Inspect decision-to-owner-to-record links, mandate and review date; intentionally
      reveal an unowned staffing or reporting choice that no motor trace could contain.
    feedback_contract: Feedback distinguishes reconstructable motion from accountable decisions. An unowned
      required decision blocks the exercise approval record like any other unknown standing premise.
    explanation_prompt: Which decision was invisible in telemetry, and what authority must its owner actually
      possess?
    assessment: Which decision was invisible in telemetry, and what authority must its owner actually
      possess?
    scope: Role assignment in class is not institutional approval or a legal allocation of liability.
    mlsysim_apis: []
  - id: v4_17_B
    title: Count oversight only when a person can perform it
    investigation_title: Count oversight only when a person can perform it
    source_concepts:
    - chapter: 17
      concept: Oversight a person can perform
      concept_map: books/vol4/17_responsibility/responsibility_concepts.yml
    - chapter: 17
      concept: Staged permission
      concept_map: books/vol4/17_responsibility/responsibility_concepts.yml
    learning_claim: A human role counts as a countermeasure only if its holder has the time, information,
      and authority to act within the time the hazard leaves, including the queue one person serves, and
      a role that fails any of the three moves blame onto that person without adding protection. Permission
      to operate is granted in stages (testing with a safety driver or spotter, driverless or unattended
      testing, open deployment), each for a named configuration, domain, evidence, and reporting duties,
      left on evidence gathered at that stage and withdrawn for a configuration change, an incident, or
      a withheld record.
    tradeoff: Choose a supported machine-to-assistant ratio and role capability set; compare supervised,
      unattended-test and deployment-stage evidence packets.
    student_action: Choose a supported machine-to-assistant ratio and role capability set; compare supervised,
      unattended-test and deployment-stage evidence packets.
    held_fixed: Hold help-request/service assumptions fixed for the first queue comparison; retain local
      fallback and incident-reporting obligations in every stage.
    evidence_to_inspect: Use mlsysim.physics.calc_queue_latency_mmc only for documented queue assumptions;
      inspect delay distributions/unknowns, role information, channel authority and stage-exit records.
    feedback_contract: Feedback can show acceptable average utilization with an unacceptable response
      window or missing authority. Human interventions censor autonomous consequences; supervised exposure
      cannot be credited uncritically toward open operation.
    explanation_prompt: Which failed condition made the role ceremonial, and what evidence could justify
      leaving the current stage?
    assessment: Which failed condition made the role ceremonial, and what evidence could justify leaving
      the current stage?
    scope: Queue model assumptions must be checked; assigning a student to monitor does not create a qualified
      safety countermeasure.
    mlsysim_apis: []
  - id: v4_17_C
    title: Detection gaps become different physical exposure
    investigation_title: Detection gaps become different physical exposure
    source_concepts:
    - chapter: 17
      concept: Detection gaps become stopping gaps
      concept_map: books/vol4/17_responsibility/responsibility_concepts.yml
    learning_claim: A group of people a detector sees less often needs more frames before detection can
      be relied on, so a stop sized for the best-detected group loses distance before braking and strikes
      the other group with speed and energy that follow from the distance lost, and each group's sample
      must be large enough for its interval to resolve the gap.
    tradeoff: Compare an aggregate qualification with subgroup evidence; choose more representative observations,
      a common conservative envelope or refusal of broader exposure.
    student_action: Compare an aggregate qualification with subgroup evidence; choose more representative
      observations, a common conservative envelope or refusal of broader exposure.
    held_fixed: Keep the physical stopping model fixed; use supplied ethically collected/anonymized group
      cases and count independent people/trials rather than correlated frames.
    evidence_to_inspect: Per-group independent encounter counts, Wilson intervals and widths, separately assumed
      detection delay, blind travel, reference clearance reserve and conditional boundary speed/rigid-body energy.
    feedback_contract: Feedback exposes when equal point estimates have unequal uncertainty or aggregate
      success hides a gap. A thin group sample is unknown, not parity; a speed restriction still needs
      evidence for all exposed groups.
    explanation_prompt: Who bears the unresolved risk, and which observation contract, fault coverage
      and release condition must change together?
    assessment: Who bears the unresolved risk, and which observation contract, fault coverage and release
      condition must change together?
    scope: Fictional independent encounter samples with two-sided Wilson score intervals and a separate
      assumed detection-delay/constant-deceleration model. Rates do not determine latency; intervals
      are not simultaneous group guarantees or evidence of parity. No actual detector or plant is qualified.
    mlsysim_apis: []
  - id: v4_17_D
    title: Retain evidence without turning people into scores
    investigation_title: Retain evidence without turning people into scores
    source_concepts:
    - chapter: 17
      concept: Recorded people
      concept_map: books/vol4/17_responsibility/responsibility_concepts.yml
    - chapter: 17
      concept: Worker burden
      concept_map: books/vol4/17_responsibility/responsibility_concepts.yml
    learning_claim: Records that reconstruct an admitted action also record operators, bystanders, demonstrators,
      and coworkers, so each identifying record declares its purpose, retention period, what is removed
      before storage, and its readers, and an access and retention audit enforces the declaration as a
      standing condition. Automation moves a task's labor into rescue, sweeping, monitoring, and data
      collection, and creates records that could be used to score workers, so a deployment counts the
      labor it moves and bars uses of its safety records that were never declared.
    tradeoff: Compare continuous video with bounded event windows and purpose-limited access; choose a
      retention/access policy and staffing plan that preserves necessary reconstruction.
    student_action: Compare continuous video with bounded event windows and purpose-limited access; choose
      a retention/access policy and staffing plan that preserves necessary reconstruction.
    held_fixed: Fix the incident questions, required pre-trigger window and genuine labor requirements;
      do not reduce reported labor by omitting rescue or site inspection.
    evidence_to_inspect: Inspect the chapter’s event-retention and shifted-labor records, access audit
      and deletion evidence. Student discussion exports contain scenario decisions and anonymized traces,
      not identifiers or hidden behavioral tracking.
    feedback_contract: Feedback shows evidence lost by excessive minimization and surveillance created
      by indiscriminate retention. Reusing safety records for worker ranking is a new undeclared purpose;
      missing privacy/worker provisions keep approval incomplete.
    explanation_prompt: What must remain to reconstruct the event, what can be removed, and whose work
      increased under your selected restriction?
    assessment: What must remain to reconstruct the event, what can be removed, and whose work increased
      under your selected restriction?
    scope: This designs an evidence policy; it does not authorize real personal-data collection or employee
      monitoring.
    mlsysim_apis: []
