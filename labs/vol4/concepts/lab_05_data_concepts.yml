lab_concept_map:
  schema_version: 1
  lab_id: v4_05
  volume: vol4
  chapter: 5
  title: Physical Data
  source_notebook: labs/vol4/lab_05_data.py
  source_chapter_concept_map: books/vol4/05_data/data_concepts.yml
  book_anchor: sec-data
  status: development companion; physical studio remains unverified
  chapter_goal: Choose what to collect, label, retain and claim so that data covers the learner’s recoverable
    states without hiding physical cost or provenance.
  student_goals:
  - Explain why the learner’s own actions change the states for which it needs competent recovery.
  - Identify how tap, timing and machine geometry alter the behavior encoded by the same array shape.
  - Compare collection plans by retained supported coverage, cell time, reset burden and component use.
  - Distinguish unvisited, intercepted, taken-over and censored absence and preserve the conditions under
    which retained experience was produced.
  narrative:
    situation: The nominal cage-door demonstrations look clean, but the learned gripper reaches a displaced
      strike plate and enters states the expert archive barely contains.
    previously: Dated handoffs identify the requested, mapped, enforced and measured versions of every
      action. These are the project's supplied starting assumptions; compatible earlier student evidence
      is not presumed.
    next: Training must now choose an experience regime and produce a checkpoint whose dependencies match
      this archive.
    submission: Provenance record, ODD coverage table, action-tap/timing contract, and intervention-aware
      collection proposal. Submit one integrated discussion tying the saved comparisons to your decision
      or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_05_A
    title: More of the center does not cover the edge
    investigation_title: More of the center does not cover the edge
    source_concepts:
    - chapter: 5
      concept: Endogenous covariate shift
      concept_map: books/vol4/05_data/data_concepts.yml
    - chapter: 5
      concept: Compounding error and recoverability
      concept_map: books/vol4/05_data/data_concepts.yml
    learning_claim: Because a physical machine's own executed actions choose its next states and observations,
      the learner visits a distribution its demonstrations never sampled, so more nominal demonstrations
      only densify the region the expert already covered. Behavioral cloning's worst-case excess cost
      grows as T^2*eps because training error is weighted by the expert's occupancy, and labeling learner-visited
      states makes it linear only while a recovering action still exists.
    tradeoff: Compare additional nominal demonstrations with verified recovery labels on learner-visited
      states; inspect the same small initial deviation.
    student_action: Compare additional nominal demonstrations with verified recovery labels on learner-visited
      states; inspect the same small initial deviation.
    held_fixed: Task, learner checkpoint and starting perturbation; changes in available recovery support
      are explicit.
    evidence_to_inspect: Supplied closed-loop state-occupancy and divergence traces with recoverable and
      no-recovery regions labeled by their evidence.
    feedback_contract: Nominal density may increase while boundary coverage stays empty; labels cannot
      recover a state with no feasible action left.
    explanation_prompt: Where did the learner first leave support, and which collection change addresses
      that point?
    assessment: Where did the learner first leave support, and which collection change addresses that
      point?
    scope: Use supplied traces or canonical registered model only; do not invent trajectories from a generic
      error slider.
    mlsysim_apis: []
  - id: v4_05_B
    title: Which action did the label mean?
    investigation_title: Which action did the label mean?
    source_concepts:
    - chapter: 5
      concept: Action-label semantics
      concept_map: books/vol4/05_data/data_concepts.yml
    - chapter: 5
      concept: Embodiment contract
      concept_map: books/vol4/05_data/data_concepts.yml
    learning_claim: One command exists as four signals (requested, mapped, enforced, measured) and every
      pair must be dated at the exposure midpoint, because the tap chosen and the pairing lag decide what
      behavior the label teaches. Every trajectory encodes the sensor geometry, timing, kinematic and
      torque limits, and compliance of the machine that produced it, so range normalization is cosmetic
      and borrowed data must pass an embodiment gate.
    tradeoff: Select requested, mapped, enforced or measured labels and a capture-aligned pairing; then
      compare a donor trajectory against the target embodiment contract.
    student_action: Select requested, mapped, enforced or measured labels and a capture-aligned pairing;
      then compare a donor trajectory against the target embodiment contract.
    held_fixed: Same recorded episode and exposure epochs; donor and target differences remain visible.
    evidence_to_inspect: Four-tap action overlay, pairing offset, units/frame checks, and sensor/actuator/limit
      compatibility table.
    feedback_contract: Expose whether the label teaches a refused request, a clamp, or an actual response;
      normalized ranges do not repair timing or mechanical mismatch.
    explanation_prompt: Which tap serves the intended learning objective and what transfer evidence is
      still required?
    assessment: Which tap serves the intended learning objective and what transfer evidence is still required?
    scope: No single tap is universally correct; borrowed data is not admitted solely because its tensors
      fit.
    mlsysim_apis: []
  - id: v4_05_C
    title: Buy useful coverage, not just samples
    investigation_title: Buy useful coverage, not just samples
    source_concepts:
    - chapter: 5
      concept: Demonstration yield and wear
      concept_map: books/vol4/05_data/data_concepts.yml
    - chapter: 5
      concept: Operational design domain
      concept_map: books/vol4/05_data/data_concepts.yml
    learning_claim: Physical data is bought in cell time and component life, so less than a quarter of
      a scheduled hour survives as retained demonstration and failed attempts wear parts like successful
      ones. The operational design domain is declared before collection, and an archive's coverage is
      a join between its state-action occupancy and a scenario table derived from that domain, never a
      property the archive can measure alone.
    tradeoff: Allocate a fixed campaign to nominal and declared ODD cells using provided measured/illustrative
      yield and wear records.
    student_action: Allocate a fixed campaign to nominal and declared ODD cells using provided measured/illustrative
      yield and wear records.
    held_fixed: Campaign resources and predeclared domain table; display all retention and attempt denominators.
    evidence_to_inspect: Coverage join against the declared ODD, retained versus attempted episodes, reset
      time and wear accounting.
    feedback_contract: Dense nominal data cannot certify empty domain cells; failed attempts spend time
      and wear even if ingestion discards them.
    explanation_prompt: Which cells justify the next collection effort, and what operating claim must
      remain narrower?
    assessment: Which cells justify the next collection effort, and what operating claim must remain narrower?
    scope: Coverage labels require a declared scenario table; physical yields are never inferred from
      dataset file size.
    mlsysim_apis:
    - mlsysim.physics.robotics.calc_teleop_ingestion_budget
    - mlsysim.Embodied
  - id: v4_05_D
    title: Audit the missing episodes
    investigation_title: Audit the missing episodes
    source_concepts:
    - chapter: 5
      concept: Intervention curation
      concept_map: books/vol4/05_data/data_concepts.yml
    - chapter: 5
      concept: Provenance record
      concept_map: books/vol4/05_data/data_concepts.yml
    learning_claim: A zero-count cell can mean unvisited, intercepted, cut short by takeover, or censored,
      and takeover logs are failure-conditioned, so curation locates the divergence point in a pre-trigger
      buffer and admits only verified recovery. Schema-valid arrays can silently encode a shifted camera,
      a worn pad, a drifted operator, or a mismatched unit, so every archive is bound to an immutable
      provenance record of plant, calibration, wear, taps, timing, and denominators.
    tradeoff: Choose a pre-trigger curation window and retain only independently verified recovery, then
      repair a record with shifted calibration or mismatched timing.
    student_action: Choose a pre-trigger curation window and retain only independently verified recovery,
      then repair a record with shifted calibration or mismatched timing.
    held_fixed: Same complete attempt log and immutable raw record identifiers.
    evidence_to_inspect: Attempt funnel, intervention timeline, verification status and provenance field
      diff.
    feedback_contract: Show how deleting inconvenient attempts changes the denominator and how a schema-valid
      archive can still be physically incompatible.
    explanation_prompt: Where does divergence begin, what does the record support, and what must not be
      imitated?
    assessment: Where does divergence begin, what does the record support, and what must not be imitated?
    scope: Intervention logs are failure-conditioned; curated traces are not unbiased evidence of overall
      policy success.
    mlsysim_apis: []
