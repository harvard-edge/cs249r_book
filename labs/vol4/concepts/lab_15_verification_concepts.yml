lab_concept_map:
  schema_version: 1
  lab_id: v4_15
  volume: vol4
  chapter: 15
  title: Adversarial Verification
  source_notebook: labs/vol4/lab_15_verification.py
  source_chapter_concept_map: books/vol4/15_verification/verification_concepts.yml
  book_anchor: sec-verification
  status: development companion; physical studio remains unverified
  chapter_goal: Which fault trials can refute the containment claim, what would count as valid evidence,
    and which conclusions remain out of reach?
  student_goals:
  - Separate valid trial execution from machine outcome and include coupled internal/external envelope
    corners.
  - Explain why malformed digital messages and truthful-looking false sensor evidence need different fault
    chains.
  - Distinguish simulation falsification, processor/HIL qualification and physical validation while searching
    realistic disturbances.
  - Relate fault-population coverage, rare-event weighting and trace provenance to the claims the campaign
    can support.
  narrative:
    situation: The authority trace looks clean in normal service. The team must now discover whether its
      protective responses work when the proposer, sensor, link or power premise fails.
    previously: Invert the actual enforcement, placement and authority records, including the missing
      evidence they already disclose. These are the project's supplied starting assumptions; compatible
      earlier student evidence is not presumed.
    next: The fault-record set becomes evidence for a bounded release argument; a collection of passes
      is not that argument.
    submission: Fault-record set with bounded claim, envelope point, precommitted oracle, achieved injection,
      independent witnesses, verdict and remaining coverage. Submit one integrated discussion tying the
      saved comparisons to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_15_A
    title: Declare the oracle before seeing the stop
    investigation_title: Declare the oracle before seeing the stop
    source_concepts:
    - chapter: 15
      concept: Operating envelope and coupled corners
      concept_map: books/vol4/15_verification/verification_concepts.yml
    - chapter: 15
      concept: Precommitted oracle
      concept_map: books/vol4/15_verification/verification_concepts.yml
    learning_claim: A protective claim holds only over a declared operating envelope that couples the
      external ODD with internal execution state (load, bus voltage, saturation, temperature), and its
      danger lives at the coupled corners, not the nominal center. A fault trial counts as evidence only
      against an oracle fixed before the run that returns signed margins, scored from the event the fault
      disrupts rather than from the start of the trial.
    tradeoff: Choose the next speed/friction/payload/load corner, precommit onset and stop predicates,
      then classify supplied trials including an undelivered injection.
    student_action: Choose the next speed/friction/payload/load corner, precommit onset and stop predicates,
      then classify supplied trials including an undelivered injection.
    held_fixed: Freeze oracle and tested configuration before revealing each trace; keep harness validity
      separate from physical pass/fail.
    evidence_to_inspect: Use calc_scurve_stop_distance only for the numerical screen; review independent
      onset and distance traces, achieved injection and preconditions. Apply the chapter’s exact four-verdict
      taxonomy.
    feedback_contract: Feedback distinguishes a valid margin violation from an invalid test. A late oracle
      edit creates a new trial; one clean corner does not cover the coupled envelope.
    explanation_prompt: Which apparently passing trace did not test the claim at all, and which coupled
      corner remains unobserved?
    assessment: Which apparently passing trace did not test the claim at all, and which coupled corner
      remains unobserved?
    scope: A stipulated or simulated F1 trace remains a screen until actual loaded braking evidence exists.
    mlsysim_apis: []
  - id: v4_15_B
    title: Derive attacks from both records and physics
    investigation_title: Derive attacks from both records and physics
    source_concepts:
    - chapter: 15
      concept: Fault-list derivation
      concept_map: books/vol4/15_verification/verification_concepts.yml
    - chapter: 15
      concept: Transduction and proposer attacks
      concept_map: books/vol4/15_verification/verification_concepts.yml
    learning_claim: Faults come from inverting each recorded design guarantee at its handoff and from
      working forward from the physical machine, each built as a five-element chain from cause to violated
      claim. A transduction attack delivers a checksum-valid packet whose measurement is false, so packet
      integrity is never an oracle for perception, and a wrong action inside the envelope after prompt
      injection or a patch is a coverage deficit, never a pass.
    tradeoff: Pair a negated record premise with a forward physical hazard; compare bus replay, optical
      spoofing/glare and a proposer-origin wrong target.
    student_action: Pair a negated record premise with a forward physical hazard; compare bus replay,
      optical spoofing/glare and a proposer-origin wrong target.
    held_fixed: Hold the named claim and observable response fixed; distinguish injection points and independent
      witnesses instead of treating every attack as tensor noise.
    evidence_to_inspect: 'Build the five-element chain: negated condition, injection point, detector,
      bounded response and observable pass condition. Inspect supplied sensor-origin and packet-origin
      traces with explicit coverage omissions.'
    feedback_contract: Feedback shows a valid checksum alongside a false physical reading and a protected
      bus alongside a semantically wrong proposal. Each defense only earns the claim it observes.
    explanation_prompt: Which attack passed the integrity checks, and what independent channel could test
      its physical consequence?
    assessment: Which attack passed the integrity checks, and what independent channel could test its
      physical consequence?
    scope: Notebook attacks are synthetic trace reviews; no unsafe optical, electrical or physical fault
      injection outside approved bench procedures.
    mlsysim_apis: []
  - id: v4_15_C
    title: Search for the smallest margin before moving hardware
    investigation_title: Search for the smallest margin before moving hardware
    source_concepts:
    - chapter: 15
      concept: Qualification ladder
      concept_map: books/vol4/15_verification/verification_concepts.yml
    - chapter: 15
      concept: Falsification by signed robustness
      concept_map: books/vol4/15_verification/verification_concepts.yml
    learning_claim: Software-, processor-, and hardware-in-the-loop rigs and the physical fault rig each
      make a different part of the loop real while throughput falls by orders of magnitude, so a mechanism
      can fail only on a rung that contains it. Signed temporal-logic robustness turns testing into an
      optimization that searches for the smallest margin, and a simulated margin counts only after its
      sim-to-real transfer discount.
    tradeoff: Compare a one-variable sweep with coupled candidate cases; choose the next admissible disturbance
      or stop the search when a counterexample appears.
    student_action: Compare a one-variable sweep with coupled candidate cases; choose the next admissible
      disturbance or stop the search when a counterexample appears.
    held_fixed: Fix the precommitted property, bounded disturbance family and evidence rung; keep simulated
      and measured trajectories separate.
    evidence_to_inspect: Inspect signed onset/distance robustness and the chapter’s qualification-ladder
      packet; subtract only a supported sim-to-real discrepancy bound. General STL and search engines
      remain trace-review designs unless implemented in MLSysIM.
    feedback_contract: Negative robustness refutes the modeled claim; positive sampled robustness is not
      a proof. An impossible disturbance is invalid, and a missing transfer bound blocks promotion to
      physical evidence.
    explanation_prompt: Which counterexample was realizable, and what new evidence would be needed to
      carry a simulated margin to the bench?
    assessment: Which counterexample was realizable, and what new evidence would be needed to carry a
      simulated margin to the bench?
    scope: No simulation pass authorizes motion or proves coverage of all disturbances.
    mlsysim_apis: []
  - id: v4_15_D
    title: A campaign is not a fleet hazard rate
    investigation_title: A campaign is not a fleet hazard rate
    source_concepts:
    - chapter: 15
      concept: Rare-event rates and tails
      concept_map: books/vol4/15_verification/verification_concepts.yml
    - chapter: 15
      concept: Fault-record set
      concept_map: books/vol4/15_verification/verification_concepts.yml
    learning_claim: Failure probability cannot be read from falsification runs or naive Monte Carlo, so
      rates need importance sampling with a tuned proposal and tail magnitudes need weighted extreme value
      fits. Each fault record binds a signed header (trial, claim, envelope point, injection, oracle digest,
      latencies, margins, verdict) to the independently retained trace, carrying evidence and its gaps
      to release.
    tradeoff: Compare nominal Monte Carlo, adversarial search and supported importance-sampling summaries;
      choose what statistic may enter the release packet.
    student_action: Compare nominal Monte Carlo, adversarial search and supported importance-sampling
      summaries; choose what statistic may enter the release packet.
    held_fixed: Keep the target population explicit, freeze the likelihood model for weighted estimates
      and avoid pooling different builds or unrepresented corners.
    evidence_to_inspect: Use mlsysim.physics.calc_importance_sampling_exponential and calc_zero_failure_sample_size
      for their documented models; inspect weights, outcome denominators, independent witness coverage
      and bound record IDs. Tail fits without supported diagnostics remain review-only.
    feedback_contract: Feedback distinguishes finding a failure from estimating its operational frequency.
      Missing weights, altered populations, correlated samples or missing traces prevent a credited rate
      claim.
    explanation_prompt: Which evidence licenses only existence, which licenses a distribution-bound estimate,
      and what still makes release premature?
    assessment: Which evidence licenses only existence, which licenses a distribution-bound estimate,
      and what still makes release premature?
    scope: Observed benign hours, simulated tails and adversarial samples do not establish a safety-critical
      field rate by themselves.
    mlsysim_apis: []
