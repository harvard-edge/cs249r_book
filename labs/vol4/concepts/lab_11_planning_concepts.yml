lab_concept_map:
  schema_version: 1
  lab_id: v4_11
  volume: vol4
  chapter: 11
  title: Trajectory Planning
  source_notebook: labs/vol4/lab_11_planning.py
  source_chapter_concept_map: books/vol4/11_planning/planning_concepts.yml
  book_anchor: sec-planning
  status: development companion; physical studio remains unverified
  chapter_goal: How much executable motion should a record contain, and which seam and stop must remain
    valid when the next record never arrives?
  student_goals:
  - Distinguish capture-to-admission replacement latency, renewal cadence, executable prefix and handoff
    tail.
  - Relate configuration-dependent tool-to-joint mapping to continuous kinodynamic feasibility.
  - Connect acceleration continuity to torque steps and jerk-limited braking distance.
  - Keep a generator’s proposal subordinate to the last instant at which a resident stop still works.
  narrative:
    situation: The mug target has a valid lease, but the arm is already moving and the next inference
      pass may be late. A teammate proposes using a longer action chunk to hide every delay.
    previously: Consume the bounded target, parent belief and explicit intent expiry rather than treating
      a granted goal as a path. These are the project's supplied starting assumptions; compatible earlier
      student evidence is not presumed.
    next: A feasible admitted trajectory still needs a per-tick permission path that preserves the stopping
      reservation while the plant changes.
    submission: Trajectory record with frame/epoch/parent digest, projected seam, continuous-limit checks,
      nominal prefix, commitment cutoff and resident stop. Submit one integrated discussion tying the
      saved comparisons to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_11_A
    title: Replacement timing is not inference timing
    investigation_title: Replacement timing is not inference timing
    source_concepts:
    - chapter: 11
      concept: Trajectory record
      concept_map: books/vol4/11_planning/planning_concepts.yml
    - chapter: 11
      concept: Replacement latency and handoff tail
      concept_map: books/vol4/11_planning/planning_concepts.yml
    learning_claim: The planner hands over an immutable record naming frame, evidence epoch, seam state,
      parent intent-lease digest, and four MCU-clock deadlines in two tiers (high-rate chunk lease, hardware
      commitment cutoff) together with its latched stop. Replacement latency runs from capture to MCU
      admission (about 115 ms against a 50 ms renewal and a 60 ms lease), so renewal is sustainable only
      by overlapping requests and every record must carry its own handoff tail.
    tradeoff: Choose overlap, a longer supported prediction horizon, or earlier stopping under supplied
      normal and delayed replacement traces.
    student_action: Choose overlap, a longer supported prediction horizon, or earlier stopping under supplied
      normal and delayed replacement traces.
    held_fixed: Fix intent expiry and the actual replacement trace when comparing scheduling choices;
      keep horizon distinct from the admitted tracking lease.
    evidence_to_inspect: Inspect timestamp lanes from capture, dispatch, generation, transport and admission;
      compare each prefix and tail against the resident stopping cutoff. Supplied traces, not an invented
      latency distribution.
    feedback_contract: Feedback shows which replacement is late and whether the old record can still execute
      its matched stop. Increasing predicted horizon does not grant fresh evidence or extend authority.
    explanation_prompt: Why can overlap sustain cadence without making any single replacement faster,
      and what happens if the overlap still fails?
    assessment: Why can overlap sustain cadence without making any single replacement faster, and what
      happens if the overlap still fails?
    scope: Model trace timing is a planning screen; it does not establish board-link timing or hardware
      WCET.
    mlsysim_apis: []
  - id: v4_11_B
    title: A clear tool path can exceed joint limits
    investigation_title: A clear tool path can exceed joint limits
    source_concepts:
    - chapter: 11
      concept: Manipulator Jacobian
      concept_map: books/vol4/11_planning/planning_concepts.yml
    - chapter: 11
      concept: Kinodynamic feasibility
      concept_map: books/vol4/11_planning/planning_concepts.yml
    learning_claim: Clearance and tool limits live in tool space but drives enforce joint limits, so tool-space
      quantities pass through the configuration-dependent Jacobian, whose weak direction near a singularity
      demands unbounded joint rates unless damped least squares trades accuracy for bounded rates. A collision-free
      path is executable only if every joint's position, velocity, acceleration, jerk, torque, and current
      stay within limits along the continuous interpolant, its seams, and its stop, which time parameterization
      must check.
    tradeoff: Compare the same reach at a well-conditioned and near-singular pose; choose slower time
      parameterization, bounded damped motion or a different path.
    student_action: Compare the same reach at a well-conditioned and near-singular pose; choose slower
      time parameterization, bounded damped motion or a different path.
    held_fixed: Keep desired tool motion and plant joint/torque/current limits fixed before separately
      changing path geometry.
    evidence_to_inspect: Inspect supplied Jacobian singular-direction cases and continuous interpolant
      extrema, not only waypoint clearance. Use the actual chapter machine registry; unsupported Jacobian/trajectory
      solver remains an explicit trace-review device.
    feedback_contract: Feedback locates the joint limit or between-sample violation and the tracking-accuracy
      or cycle-time cost of the remedy. Collision-free remains necessary but insufficient.
    explanation_prompt: Which cost did damping trade for bounded rates, and why did sampling only endpoints
      miss a violation?
    assessment: Which cost did damping trade for bounded rates, and why did sampling only endpoints miss
      a violation?
    scope: A simplified arm trace is not the SO-101 calibration or a full rigid-body feasibility proof.
    mlsysim_apis: []
  - id: v4_11_C
    title: Join smoothly and reserve the real stop
    investigation_title: Join smoothly and reserve the real stop
    source_concepts:
    - chapter: 11
      concept: C2 seam
      concept_map: books/vol4/11_planning/planning_concepts.yml
    - chapter: 11
      concept: Jerk-limited stopping suffix
      concept_map: books/vol4/11_planning/planning_concepts.yml
    learning_claim: Splicing chunks that match only position or velocity leaves an acceleration step that
      reflected inertia turns into a torque step, so seams must be C2 and the replacement is planned from
      the projected seam state. A stop that keeps acceleration continuous must ramp deceleration up and
      down, so constant-deceleration braking is unexecutable and understates distance, and every admitted
      trajectory carries a jerk-limited S-curve stop.
    tradeoff: Compare position-only, velocity-matched and C2 seams; then compare the constant-deceleration
      screen with a supported S-curve stop.
    student_action: Compare position-only, velocity-matched and C2 seams; then compare the constant-deceleration
      screen with a supported S-curve stop.
    held_fixed: Hold the projected splice state and effective inertia fixed for seam comparisons; hold
      entry speed and deceleration bound fixed for the stopping comparison.
    evidence_to_inspect: Use mlsysim.physics.robotics.calc_seam_acceleration_torque_jump and calc_scurve_stop_distance/calc_scurve_stop_time
      for supported inputs; inspect position, velocity, acceleration, jerk and torque at the seam and
      suffix.
    feedback_contract: Feedback identifies discontinuity rather than labeling all smooth-looking plots
      feasible. A finite jerk limit spends more distance than an instantaneous braking model; a valid
      seam does not rescue an invalid stop.
    explanation_prompt: Which seam property removed the torque step, and where did its longer transition
      spend stopping reserve?
    assessment: Which seam property removed the torque step, and where did its longer transition spend
      stopping reserve?
    scope: The stop calculation assumes credible measured actuation; a simulator cannot supply that measurement.
    mlsysim_apis: []
  - id: v4_11_D
    title: Convergence cannot overrule commitment
    investigation_title: Convergence cannot overrule commitment
    source_concepts:
    - chapter: 11
      concept: Inevitable collision states
      concept_map: books/vol4/11_planning/planning_concepts.yml
    - chapter: 11
      concept: Generators are proposers
      concept_map: books/vol4/11_planning/planning_concepts.yml
    learning_claim: A moving mass enters a state from which every admissible control collides long before
      contact, so every record names a commitment instant at which its latched stop must begin, and admission
      closes earlier by the decision-to-onset delay. Sampling planners, trajectory optimization and MPC,
      and learned chunks differ in the work they do, not in what they must prove, and a solver's deadline,
      not its convergence, decides admission.
    tradeoff: Compare supplied sampling/optimization/learned-generator outcomes with identical admission
      deadlines; choose accept, reject and stop, or a new attempt after standstill.
    student_action: Compare supplied sampling/optimization/learned-generator outcomes with identical admission
      deadlines; choose accept, reject and stop, or a new attempt after standstill.
    held_fixed: Hold the physical corridor, initial state and stop suffix fixed; vary candidate arrival/validity
      independently of algorithm label.
    evidence_to_inspect: Inspect commitment instant, earlier admission closure, solver completion and
      stop onset. Use the same MLSysIM stop calculations as Part C; generator outputs are supplied records
      rather than a fake universal solver.
    feedback_contract: A better path arriving after closure is refused; a timely poor proposal may also
      be refused. Feedback distinguishes a recoverable fallback from an already inevitable collision state.
    explanation_prompt: At what instant did continuing to wait become unjustifiable, even if the next
      candidate would converge?
    assessment: At what instant did continuing to wait become unjustifiable, even if the next candidate
      would converge?
    scope: No algorithm family earns authority by name; the exercise does not certify a runtime planner.
    mlsysim_apis: []
