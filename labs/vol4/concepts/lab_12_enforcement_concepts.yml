lab_concept_map:
  schema_version: 1
  lab_id: v4_12
  volume: vol4
  chapter: 12
  title: Safety Enforcement
  source_notebook: labs/vol4/lab_12_enforcement.py
  source_chapter_concept_map: books/vol4/12_enforcement/enforcement_concepts.yml
  book_anchor: sec-enforcement
  status: development companion; physical studio remains unverified
  chapter_goal: Which commands can pass, which can be minimally corrected, and which state-matched fallback
    still has valid premises?
  student_goals:
  - Distinguish geometric distance from the recoverable set after delay, jerk, localization, tracking
    and protective margins.
  - Show least-change projection preserving useful action and identify premises that invalidate it.
  - Compare contact force, finite active-work allowance and series compliance; distinguish latch from
    human handover and retain independent force-channel qualification.
  - Connect direct fallback selection, the rated protective floor and the forensic record without conflating
    their claims.
  narrative:
    situation: The machine can propose feasible motion, but the base approaches a rack end while observations
      age. The team debates correcting every proposal versus stopping at every deviation.
    previously: Consume the trajectory and its continuous stop; retain the earlier limit, observation
      and belief records. These are the project's supplied starting assumptions; compatible earlier student
      evidence is not presumed.
    next: The permission loop needs a physical substrate that can complete its checks under loaded interference.
    submission: Enforcement contract plus reviewed per-tick admitted command, active margin, checked premises,
      detector and selected fallback rung. Submit one integrated discussion tying the saved comparisons
      to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_12_A
    title: Price the entire stopping envelope
    investigation_title: Price the entire stopping envelope
    source_concepts:
    - chapter: 12
      concept: Stopping envelope
      concept_map: books/vol4/12_enforcement/enforcement_concepts.yml
    - chapter: 12
      concept: Kinetic barrier
      concept_map: books/vol4/12_enforcement/enforcement_concepts.yml
    learning_claim: The stopping envelope is the set of states from which the resident stop, after every
      worst-case delay, halts before the obstacle with localization, protective, and tracking margins
      intact, and its seven priced rows run as a per-tick speed governor. A control barrier function makes
      its safe set forward invariant only if every admitted input keeps hdot >= -alpha(h), and a barrier
      on raw distance has relative degree two in torque, so the barrier must carry the cost to stop.
    tradeoff: Choose a supported speed or delay case and predict whether the state remains recoverable;
      compare a distance-only screen with the full stopping budget.
    student_action: Choose a supported speed or delay case and predict whether the state remains recoverable;
      compare a distance-only screen with the full stopping budget.
    held_fixed: Fix clearance and qualified plant bounds for each speed sweep; do not silently assume
      a walking person is a stationary wall.
    evidence_to_inspect: Use calc_scurve_stop_distance and calc_scurve_max_permitted_velocity from mlsysim.physics.robotics
      for the supported model; inspect each overhead from chapter registry inputs and barrier sign across
      supplied states.
    feedback_contract: Feedback names the row consuming reserve and marks outside-envelope states explicitly.
      A positive modeled barrier is conditional on all declared bounds and sampled-time premises.
    explanation_prompt: What did the distance-only rule admit that the kinetic rule refused, and which
      additional measurement could change that result?
    assessment: What did the distance-only rule admit that the kinetic rule refused, and which additional
      measurement could change that result?
    scope: Nominal deceleration is not a qualified lower bound; no screen grants physical release.
    mlsysim_apis: []
  - id: v4_12_B
    title: Correct the command only while the argument holds
    investigation_title: Correct the command only while the argument holds
    source_concepts:
    - chapter: 12
      concept: Minimal-intervention filter
      concept_map: books/vol4/12_enforcement/enforcement_concepts.yml
    - chapter: 12
      concept: Invariance premises and timing
      concept_map: books/vol4/12_enforcement/enforcement_concepts.yml
    learning_claim: A least-change projection passes a safe proposal untouched and projects a violating
      one onto the barrier boundary, keeping learned competence, while a structurally invalid proposal
      is vetoed rather than corrected. A barrier guarantee holds only under model fidelity, bounded disturbance,
      actuation within a qualified effort error and delay, solver completion inside its budget, and a
      sample period short enough for inter-sample drift, each watched at runtime.
    tradeoff: Compare a feasible proposal, a correctable one and a structurally invalid one; vary a supported
      timing or tracking-premise case separately.
    student_action: Compare a feasible proposal, a correctable one and a structurally invalid one; vary
      a supported timing or tracking-premise case separately.
    held_fixed: Hold plant state and barrier constraints fixed when comparing nominal inputs; do not use
      projection to repair a corrupt record.
    evidence_to_inspect: Use mlsysim.physics.robotics.calc_cbf_qp_orthogonal_projection for its supported
      simple half-space case; inspect nominal/admitted control, intervention magnitude, deadline and assumption
      flags.
    feedback_contract: A feasible proposal passes unchanged; a violating proposal projects only if the
      feasible set and monitored premises hold. Missing timing or actuation evidence produces unknown/refusal,
      not a green invariant badge.
    explanation_prompt: When did correction retain task progress, and which failed premise forced a different
      response?
    assessment: When did correction retain task progress, and which failed premise forced a different
      response?
    scope: The simple projection is not a qualified general QP solver or an inter-sample invariance proof.
    mlsysim_apis: []
  - id: v4_12_C
    title: Contact changes the margin being protected
    investigation_title: Contact changes the margin being protected
    source_concepts:
    - chapter: 12
      concept: Contact margins
      concept_map: books/vol4/12_enforcement/enforcement_concepts.yml
    - chapter: 12
      concept: Passive-compliance stiffness
      concept_map: books/vol4/12_enforcement/enforcement_concepts.yml
    learning_claim: When contact is the task the kinetic barrier admits only zero speed, so an energy-tank
      passivity barrier and a separately qualified force channel replace clearance as the margin.
    tradeoff: Faster approach raises modeled contact force. Finite active work permits reduced contact
      until its reserve binds; realized damping can replenish it. Added series compliance slows force rise
      but needs more compression travel. None replaces an independent force cap.
    student_action: First compare guarded and faster contact approaches within the appropriate contact
      regime. Then pin the finite-work case and compare an exhausted reserve or realized damping credit;
      compare rigid and series-spring cases with the same speed and delay.
    held_fixed: Keep latch force tolerance, approach speed and plant response delay fixed for the work
      and compliance comparisons. Separate latch and handover contact regimes; damping credit is a
      stipulated realized lower bound rather than a requested actuator command.
    evidence_to_inspect: Use calc_latch_contact_stopping_profile, calc_transient_impact_force and calc_transient_contact_speed_limit
      only for the chapter’s applicable models; inspect force continuing to rise after detection and the
      independent force-channel qualification fields. Inspect each interval's initial energy, realized
      damping credit, active-work debit and final reserve, then effective series stiffness and compression
      needed for the same force.
    feedback_contract: Feedback shows why zero clearance blocks motion under the free-space rule and why
      a contact claim requires a different argument. Lower modeled peak force does not fill missing sensor/actuator
      qualification.
    explanation_prompt: Which margin replaced clearance, and what would a faster force detector still
      fail to guarantee?
    assessment: Which margin replaced clearance, and what would a faster force detector still fail to
      guarantee?
    scope: Station current telemetry alone does not establish calibrated contact force or human-contact
      safety. Constant-speed scalar work intervals and linear series springs are bounded analytical
      references, not dynamic stability, actuator realization or available-travel qualification.
    mlsysim_apis: []
  - id: v4_12_D
    title: Choose the fallback from the measured state
    investigation_title: Choose the fallback from the measured state
    source_concepts:
    - chapter: 12
      concept: State-matched fallback ladder
      concept_map: books/vol4/12_enforcement/enforcement_concepts.yml
    - chapter: 12
      concept: Certified floor beneath an unrated layer
      concept_map: books/vol4/12_enforcement/enforcement_concepts.yml
    - chapter: 12
      concept: Enforcement record
      concept_map: books/vol4/12_enforcement/enforcement_concepts.yml
    learning_claim: An arbiter selects directly among project, hold, controlled stop, and torque inhibit
      by the check that failed and the measured plant state, before the admissible set empties, so one
      trigger can select different rungs in motion and at standstill. The formal protective claim rests
      on certified drive, scanner, and arm safety functions beneath the permission path, which is an unrated
      performance layer, with only the lease and heartbeat watchdog selected for a rating. The enforcement
      record joins a signed enforcement contract (tracking bound, barrier coefficients, deadlines, effort-error
      bounds, routing) to a per-tick admitted command with its margin, detector, and rung.
    tradeoff: Route the same stale-proposal fault at standstill, in powered motion and under a drive fault
      to PROJECT, HOLD, STOP or INHIBIT where prerequisites permit.
    student_action: Route the same stale-proposal fault at standstill, in powered motion and under a drive
      fault to PROJECT, HOLD, STOP or INHIBIT where prerequisites permit.
    held_fixed: Fix the fault description while changing only the measured state; keep the certified-function
      inventory distinct from the unrated teaching governor.
    evidence_to_inspect: Review supplied event traces and enforcement records for detector, margins, onset
      and final plant response. No invented certification score; identify required independently assessed
      functions and evidence gaps.
    feedback_contract: Feedback explains why torque inhibit can leave a moving base coasting and why the
      ladder is a selection, not a cascade. Each command retains its parent and its actual checked premises.
    explanation_prompt: Why does the same trigger choose different rungs, and which lower-layer claim
      remains unsupported on the classroom station?
    assessment: Why does the same trigger choose different rungs, and which lower-layer claim remains
      unsupported on the classroom station?
    scope: Simulation and student code carry no functional-safety rating; bench motion remains under the
      approved staff procedure.
    mlsysim_apis: []
