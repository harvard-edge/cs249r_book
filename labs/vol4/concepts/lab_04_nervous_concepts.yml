lab_concept_map:
  schema_version: 1
  lab_id: v4_04
  volume: vol4
  chapter: 4
  title: The Nervous System
  source_notebook: labs/vol4/lab_04_nervous.py
  source_chapter_concept_map: books/vol4/04_nervous/nervous_concepts.yml
  book_anchor: sec-nervous
  status: development companion; physical studio remains unverified
  chapter_goal: Choose transport and expiry rules whose bounded permission path remains able to stop while
    the proposer stalls or floods resources.
  student_goals:
  - Explain why current regulation, permission supervision, and neural proposal renewal require different
    cadences.
  - Compare a requested lease with the stopping budget left after nonlease delays are reserved.
  - Distinguish an analytical response-time claim from observations that can falsify it.
  - Trace every electrical route capable of energizing the plant and verify which path owns it.
  narrative:
    situation: The proposer now supplies chunks. A loaded host pauses, an old message remains readable,
      and the base continues moving. The team must preserve refusal authority even when fresh proposals
      stop.
    previously: The Brain supplied an explicit proposal interface and separate supply and evidence budgets.
      These are the project's supplied starting assumptions; compatible earlier student evidence is not
      presumed.
    next: The data chapter will use these dated handoffs and four action taps to decide what a recorded
      demonstration actually teaches.
    submission: Handoff record including event clocks, bounded path allocations, lease and earliest-expiry
      rule, plus sole-writer authority diagram. Submit one integrated discussion tying the saved comparisons
      to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_04_A
    title: Match rates to the physics
    investigation_title: Match rates to the physics
    source_concepts:
    - chapter: 4
      concept: Rate tiers from time constants
      concept_map: books/vol4/04_nervous/nervous_concepts.yml
    - chapter: 4
      concept: Delay spends phase margin
      concept_map: books/vol4/04_nervous/nervous_concepts.yml
    learning_claim: Each tier takes its rate from a different physical constant (winding L/R and the PWM
      carrier for the current loop, base travel per tick for the permission tick, weight-sweep cost for
      the chunk policy, prefill cost for the intent model), not from convenience. Sample-and-hold, compute,
      and bus transport each subtract omega_c*tau of phase at crossover, so fast loops must close inside
      the drive and the permission tick can supervise them but never sit in them.
    tradeoff: Compare placing the same feedback loop locally or across a declared compute-and-bus delay;
      change delay separately from crossover.
    student_action: Compare placing the same feedback loop locally or across a declared compute-and-bus
      delay; change delay separately from crossover.
    held_fixed: Plant time constant, loop crossover and stage durations held explicit; no inferred stability
      from mean latency.
    evidence_to_inspect: Rate-tier diagram and modeled phase-lag contributions for sample hold, computation,
      and transport.
    feedback_contract: Identify phase spent by moving a fast loop upstream; a faster neural proposer does
      not acquire drive authority.
    explanation_prompt: Which loop must close inside the drive and which work can remain supervisory?
    assessment: Which loop must close inside the drive and which work can remain supervisory?
    scope: Phase accounting is not a full stability proof.
    mlsysim_apis:
    - mlsysim.physics.robotics.calc_phase_lag_total
  - id: v4_04_B
    title: Latest complete state, not every old event
    investigation_title: Latest complete state, not every old event
    source_concepts:
    - chapter: 4
      concept: Freshest-proposal mailbox
      concept_map: books/vol4/04_nervous/nervous_concepts.yml
    - chapter: 4
      concept: Chunk lease
      concept_map: books/vol4/04_nervous/nervous_concepts.yml
    - chapter: 4
      concept: Authority-expiry timers
      concept_map: books/vol4/04_nervous/nervous_concepts.yml
    learning_claim: 'Proposals cross rate boundaries as state messages, not events, so a single-slot seqlock
      or wait-free multi-slot mailbox gives the faster reader one bounded, nonblocking attempt per tick
      that returns a complete snapshot or keeps the previous one. An admitted chunk may drive the actuators
      only for a lease counted on the permission path''s own clock, derived from the plant: longer than
      the renewal period plus jitter and short enough to fit under the pre-brake ceiling of the stopping
      budget. Authority over an admitted chunk ends at the earliest of four independent events (evidence
      freshness deadline, lease expiry, host heartbeat timeout, protective reflex), and a heartbeat proves
      only that the host is alive, never that its motion is valid.'
    tradeoff: Compare queued state messages with a bounded freshest-complete snapshot; stall renewal and
      vary lease only within the declared physical budget.
    student_action: Compare queued state messages with a bounded freshest-complete snapshot; stall renewal
      and vary lease only within the declared physical budget.
    held_fixed: Same arrival trace, observation epochs, bus delay and plant conditions.
    evidence_to_inspect: One-attempt sequence/copy/sequence trace, retained capture epoch, evidence age, independent expiry deadlines, reserved nonlease delay, and chosen lease.
    feedback_contract: Execution ends at the earliest applicable expiry even if a heartbeat continues;
      queue delivery does not renew evidence.
    explanation_prompt: Which timer fired first and why would extending a lease hide one failure while
      spending more stopping clearance?
    assessment: Which timer fired first and why would extending a lease hide one failure while spending
      more stopping clearance?
    scope: Finite single-attempt publication and expiry trace plus an ideal constant-deceleration lease ceiling.
      Concurrent firmware, memory barriers, actual host behavior, watchdog wiring, and physical timing are not validated.
    mlsysim_apis:
    - mlsysim.physics.robotics.calc_watchdog_lease_bound
    - mlsysim.labs.experiments.v4_timing.study
  - id: v4_04_C
    title: Demand a bound, then try to refute it
    investigation_title: Demand a bound, then try to refute it
    source_concepts:
    - chapter: 4
      concept: Response bound not percentile
      concept_map: books/vol4/04_nervous/nervous_concepts.yml
    - chapter: 4
      concept: Independence requirement
      concept_map: books/vol4/04_nervous/nervous_concepts.yml
    learning_claim: The tick's response time R = C + B + I <= D needs an analytical bound on each term,
      because a measured maximum or p99 can refute a declared WCET but never establish it. Under any workload
      the proposer can generate, the permission path must meet its response bound and keep its authority
      to refuse, and separate processors are one realization of that requirement, a hypothesis that loaded
      tests must still confirm.
    tradeoff: Choose shared versus bounded/isolated permission resources; inspect loaded timing traces
      and supplied execution, blocking and interference bounds.
    student_action: Choose shared versus bounded/isolated permission resources; inspect loaded timing
      traces and supplied execution, blocking and interference bounds.
    held_fixed: Same permission deadline and workload contract; every omitted shared resource is named
      unknown.
    evidence_to_inspect: Response-budget table and empirical trace maximum/percentiles displayed in separate
      roles.
    feedback_contract: A missed deadline refutes the contract; a clean trace cannot establish WCET. A
      second processor does not erase common-cause coupling.
    explanation_prompt: Which term lacks a justified bound and what adversarial workload would most directly
      challenge it?
    assessment: Which term lacks a justified bound and what adversarial workload would most directly challenge
      it?
    scope: No benchmark maximum is promoted to WCET; full scheduling analysis requires the declared system
      model.
    mlsysim_apis: []
  - id: v4_04_D
    title: Find the writer that bypasses refusal
    investigation_title: Find the writer that bypasses refusal
    source_concepts:
    - chapter: 4
      concept: Sole-writer actuation authority
      concept_map: books/vol4/04_nervous/nervous_concepts.yml
    learning_claim: The permission path must be the sole writer of every electrical path that can energize
      a winding, because one unmediated write puts proposer and drives in one failure domain, and the
      stop itself must be specified in hardware.
    tradeoff: Inspect alternative wiring/privilege diagrams containing a diagnostic bypass, shared reset,
      or independently owned drive enable; select the documented repair.
    student_action: Inspect alternative wiring/privilege diagrams containing a diagnostic bypass, shared
      reset, or independently owned drive enable; select the documented repair.
    held_fixed: Same software check and admitted command trace; authority paths alone differ.
    evidence_to_inspect: Writer inventory, power/reset dependency graph, and specified unpowered behavior.
    feedback_contract: Any unmediated energizing path defeats sole-writer authority regardless of normal-path
      timing.
    explanation_prompt: Can refusal still take effect after the host fails, and what wiring evidence is
      missing?
    assessment: Can refusal still take effect after the host fails, and what wiring evidence is missing?
    scope: Browser review is not an electrical audit or instruction to bypass installed protections.
    mlsysim_apis: []
