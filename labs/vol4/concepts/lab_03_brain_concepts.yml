lab_concept_map:
  schema_version: 1
  lab_id: v4_03
  volume: vol4
  chapter: 3
  title: The Cognitive Brain
  source_notebook: labs/vol4/lab_03_brain.py
  source_chapter_concept_map: books/vol4/03_brain/brain_concepts.yml
  book_anchor: sec-brain
  status: development companion; physical studio remains unverified
  chapter_goal: Choose a proposer split and chunk supply that fits computation and evidence validity while
    keeping model output checkable and nonauthoritative.
  student_goals:
  - Compare prefill and decode costs under supplied precision and input-length choices, and identify which
    phase the change addresses.
  - Separate number of supplied setpoints from how often the machine observes and renews its decision.
  - Choose an interface the independent path can compare against its own evidence.
  - Distinguish smooth schedulable motion from a proposal grounded in the actual scene.
  narrative:
    situation: The moving mug keeps changing position while a large learned model evaluates. The team
      wants a richer model and smoother action chunks, but the Body limits do not pause for inference.
    previously: Installed body limits and freshness requirements are available as records, not assumed
      from catalog peaks. These are the project's supplied starting assumptions; compatible earlier student
      evidence is not presumed.
    next: The Nervous System must transport, expire, and independently arbitrate the selected proposals.
    submission: A proposer interface and declared renewal/evidence budgets, with checkpoint identity and
      unsupported model-quality claims. Submit one integrated discussion tying the saved comparisons to
      your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_03_A
    title: Find the cost of a fresh proposal
    investigation_title: Find the cost of a fresh proposal
    source_concepts:
    - chapter: 3
      concept: Memory-wall renewal ceiling
      concept_map: books/vol4/03_brain/brain_concepts.yml
    - chapter: 3
      concept: Prefill-decode split
      concept_map: books/vol4/03_brain/brain_concepts.yml
    - chapter: 3
      concept: Quantized model is a new model
      concept_map: books/vol4/03_brain/brain_concepts.yml
    learning_claim: At batch size 1 a proposer streams every weight once per fresh evaluation, so its
      renewal rate is bounded by sustained bandwidth over weight bytes (14 GB at 142.8 GB/s is 98 ms per
      sweep, about 10 Hz before vision or decoding). One evaluation's prefill reuses each fetched weight
      across every input token and binds on arithmetic, while each later decode token rereads all weights
      and binds on bandwidth, so the two halves answer to different hardware limits. Weight-only quantization
      shortens the bandwidth-bound decode but not the compute-bound prefill, and a quantized checkpoint
      is a different model whose evaluation evidence must be renewed.
    tradeoff: Compare canonical precision cases at fixed workload, then isolate input-length and decode
      effects without attributing all latency to weight bytes.
    student_action: Compare canonical precision cases at fixed workload, then isolate input-length and
      decode effects without attributing all latency to weight bytes.
    held_fixed: Same checkpoint family, device, input contract and measured/assumed bandwidth efficiency
      for precision comparison.
    evidence_to_inspect: Prefill/decode timing components, weight-traffic changes, and the unchanged or
      binding phase.
    feedback_contract: Explain which component can improve under weight-only quantization; changing precision
      invalidates old behavioral evidence.
    explanation_prompt: When does reducing weight traffic cease to address the dominant latency, and what
      must be reevaluated?
    assessment: When does reducing weight traffic cease to address the dominant latency, and what must
      be reevaluated?
    scope: Analytical canonical VLA/SoC reference with declared achieved utilization. Quantization accuracy,
      complete runtime overhead, and physical model validity are not established.
    mlsysim_apis:
    - mlsysim.physics.robotics.calc_action_chunk_streaming_amortization
    - mlsysim.Models
    - mlsysim.Hardware
  - id: v4_03_B
    title: Supply is not freshness
    investigation_title: Supply is not freshness
    source_concepts:
    - chapter: 3
      concept: Chunking is a supply lever
      concept_map: books/vol4/03_brain/brain_concepts.yml
    - chapter: 3
      concept: Evidence horizon
      concept_map: books/vol4/03_brain/brain_concepts.yml
    learning_claim: Predicting H setpoints per evaluation divides weight traffic per supplied setpoint
      by H, but it leaves reaction latency at one renewal period plus one inference, so chunking supplies
      setpoints without refreshing them. Every setpoint in a chunk descends from one capture, so a chunk
      is valid only while extrapolated target drift stays inside the tolerance margin (about 219 ms for
      the tracked mug against a 60 ms untracked deadline), and supply and validity are separate budgets.
    tradeoff: Extend chunk horizon at fixed renewal; then improve renewal in a separate comparison and
      test tracked versus untracked target assumptions.
    student_action: Extend chunk horizon at fixed renewal; then improve renewal in a separate comparison
      and test tracked versus untracked target assumptions.
    held_fixed: Setpoint spacing, inference cost and target tolerance fixed within each comparison.
    evidence_to_inspect: Supply span, renewal period, worst evidence age, and target-error horizon on
      one labeled timeline.
    feedback_contract: An extended chunk can fix starvation while leaving reaction age unchanged or outliving
      its evidence; invalid schedules appear as useful failures.
    explanation_prompt: Which change repaired supply, which repaired freshness, and when should execution
      stop despite a nonempty buffer?
    assessment: Which change repaired supply, which repaired freshness, and when should execution stop
      despite a nonempty buffer?
    scope: Chapter-level evidence horizons only; lease ownership and formal stopping envelopes come later.
    mlsysim_apis:
    - mlsysim.physics.robotics.calc_chunk_renewal_schedule
    - mlsysim.physics.robotics.calc_target_evidence_horizon
    - mlsysim.physics.robotics.calc_tracked_evidence_horizon
  - id: v4_03_C
    title: Give each proposer the right job
    investigation_title: Give each proposer the right job
    source_concepts:
    - chapter: 3
      concept: Two-speed brain
      concept_map: books/vol4/03_brain/brain_concepts.yml
    - chapter: 3
      concept: Checkable proposer interface
      concept_map: books/vol4/03_brain/brain_concepts.yml
    learning_claim: Because a large backbone's prefill alone exceeds the chunk renewal period, the machine
      renews motion with a small fast chunk policy beneath a slow intent model rather than waiting for
      the large model. The permission path can refuse only claims it can compare with its own evidence,
      so an interface that passes a latent vector or a language subtask cannot be grounded or aged, while
      a geometric payload can.
    tradeoff: Compare a single large-model path with slow intent plus fast chunk proposals; select latent,
      language-only, or geometric payloads for a stated checker.
    student_action: Compare a single large-model path with slow intent plus fast chunk proposals; select
      latent, language-only, or geometric payloads for a stated checker.
    held_fixed: Same mug task, physical deadlines, and qualified measurements; keep changes in workload
      explicit.
    evidence_to_inspect: Pipeline timing and payload-field checklist showing what can be grounded, dated,
      and refused.
    feedback_contract: Flag missing frame, epoch or geometric commitments; a plausible language instruction
      cannot substitute for a checkable motion proposal.
    explanation_prompt: What is gained by the split and which additional handoff or evaluation burden
      does it create?
    assessment: What is gained by the split and which additional handoff or evaluation burden does it
      create?
    scope: No invented accuracy improvement from architecture choice; later intent and planning chapters
      own their richer records.
    mlsysim_apis: []
  - id: v4_03_D
    title: On time can still be wrong
    investigation_title: On time can still be wrong
    source_concepts:
    - chapter: 3
      concept: On-time wrong proposals
      concept_map: books/vol4/03_brain/brain_concepts.yml
    learning_claim: A smooth, in-limit chunk that meets its deadline can still target a nonexistent affordance
      or carry near-unity confidence far out of distribution, and the proposer cannot report either failure.
    tradeoff: Inspect matched traces with valid timing but nonexistent affordance or unsupported input;
      choose what independent evidence could refute the proposal.
    student_action: Inspect matched traces with valid timing but nonexistent affordance or unsupported
      input; choose what independent evidence could refute the proposal.
    held_fixed: Timing, kinematic limits and confidence display fixed; scene support differs.
    evidence_to_inspect: Proposal overlay, measurement evidence, support label, and unresolved-check list.
    feedback_contract: Show the contradiction or absent evidence instead of treating high model confidence
      as physical truth.
    explanation_prompt: Which checks can refuse this proposal, and which claim cannot be settled from
      the model’s output?
    assessment: Which checks can refuse this proposal, and which claim cannot be settled from the model’s
      output?
    scope: No classifier confidence is presented as clearance evidence; learning policy never grants permission.
    mlsysim_apis: []
