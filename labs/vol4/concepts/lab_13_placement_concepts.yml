lab_concept_map:
  schema_version: 1
  lab_id: v4_13
  volume: vol4
  chapter: 13
  title: Workload Placement
  source_notebook: labs/vol4/lab_13_placement.py
  source_chapter_concept_map: books/vol4/13_placement/placement_concepts.yml
  book_anchor: sec-placement
  status: development companion; physical studio remains unverified
  chapter_goal: Which coupling must be removed or bounded, and what loaded evidence is required before
    accepting a placement?
  student_goals:
  - Separate access isolation from bounded memory service and shared failure domains.
  - Distinguish passing the deadline from meeting the declared isolated WCET, including post-load thermal
    state.
  - Relate immutable nonblocking publication, watchdog completion evidence and dispatch-to-admission cost.
  - Price static reservation, spatial partitioning, demand reduction and physical relocation against the
    residual mechanism.
  narrative:
    situation: The enforcer meets its deadline in isolation. Under camera and neural bursts, a teammate
      sees modest average utilization and declares a separate core independent.
    previously: Use the stopping and enforcement budgets as the deadline being defended; do not alter
      them to fit the hardware. These are the project's supplied starting assumptions; compatible earlier
      student evidence is not presumed.
    next: Once the computer’s permission path is bounded, decide how an authenticated human can receive
      proposal authority without bypassing it.
    submission: Placement record with per-resource coupling inventory, declared timing allocations, loaded-test
      plan, missing fields and priced remedy. Submit one integrated discussion tying the saved comparisons
      to your decision or hold, rejected alternative, uncertainty, and reversal condition.
  core_concepts:
  - id: v4_13_A
    title: Independence is a resource-by-resource claim
    investigation_title: Independence is a resource-by-resource claim
    source_concepts:
    - chapter: 13
      concept: Per-resource independence inventory
      concept_map: books/vol4/13_placement/placement_concepts.yml
    - chapter: 13
      concept: Memory contention and miss handling
      concept_map: books/vol4/13_placement/placement_concepts.yml
    learning_claim: A separate core or chip is not independent by construction, because memory protection
      governs where a transaction may go, not when it is served, so independence is argued row by row
      over every shared resource, including supply, clock, and reset. Memory arbiters schedule bursts,
      not averages, so a safety read waits on the backlog ahead of it and the controller's policy, and
      shared-cache miss handling, not bandwidth, threatens the declared bound.
    tradeoff: Compare shared application cores, a partitioned core/island and discrete MCU placements
      against the same inventory; vary burst alignment before average load.
    student_action: Compare shared application cores, a partitioned core/island and discrete MCU placements
      against the same inventory; vary burst alignment before average load.
    held_fixed: Keep permission work and declared deadline fixed; explicitly list supply, clock, reset,
      cache miss handling and memory controller sharing.
    evidence_to_inspect: Use mlsysim.physics.robotics.calc_axi_fifo_contention for its supported FIFO
      model; inspect supplied miss-status-resource traces where that model does not apply and the shared-resource
      inventory.
    feedback_contract: Feedback may show a harmless bandwidth average beside a deadline-breaking miss-handling
      trace. A chip/core boundary removes only documented couplings.
    explanation_prompt: Which resource invalidated your original independence claim, and why did a privilege
      boundary not bound its delay?
    assessment: Which resource invalidated your original independence claim, and why did a privilege boundary
      not bound its delay?
    scope: FIFO arithmetic does not bound a different arbiter or shared-cache mechanism; unsupported board
      details stay unknown.
    mlsysim_apis: []
  - id: v4_13_B
    title: A short burst can leave a long timing hangover
    investigation_title: A short burst can leave a long timing hangover
    source_concepts:
    - chapter: 13
      concept: Thermal throttling hangover
      concept_map: books/vol4/13_placement/placement_concepts.yml
    - chapter: 13
      concept: Declared WCET as falsification threshold
      concept_map: books/vol4/13_placement/placement_concepts.yml
    learning_claim: On a shared die sustained inference drives the junction past the trip point, the governor
      cuts the clock so every tick overruns its bound, and hysteresis holds the clock down for seconds
      after the burst ends. Loaded execution is isolated execution plus shared-hardware interference,
      and the placement claims that interference is zero, so any loaded tick above the declared WCET refutes
      the placement's timing premise even when it still meets the deadline.
    tradeoff: Compare quiet, active-burst and cooling-tail supplied timing traces; choose whether the
      declared bound is refuted and which additional test is needed.
    student_action: Compare quiet, active-burst and cooling-tail supplied timing traces; choose whether
      the declared bound is refuted and which additional test is needed.
    held_fixed: Keep binary, declared isolated bound and exact measured interval fixed; change only workload
      history/thermal condition.
    evidence_to_inspect: Inspect start/end timestamps, block/interference allocation and frequency/temperature
      trace. Use package thermal/delay models only where already present; otherwise replay measured/stipulated
      traces with visible evidence class.
    feedback_contract: A loaded tick can refute the zero-interference claim while still meeting the larger
      deadline. Feedback carries that distinction and keeps unmeasured corners open.
    explanation_prompt: Why did stopping inference fail to restore timing immediately, and which claim
      did the observed overrun actually refute?
    assessment: Why did stopping inference fail to restore timing immediately, and which claim did the
      observed overrun actually refute?
    scope: Observed maxima are falsifiers, not proven WCET bounds, and supplied traces are not station
      measurements.
    mlsysim_apis: []
  - id: v4_13_C
    title: Move the checker without blocking its reader
    investigation_title: Move the checker without blocking its reader
    source_concepts:
    - chapter: 13
      concept: Boundary contract and windowed watchdog
      concept_map: books/vol4/13_placement/placement_concepts.yml
    - chapter: 13
      concept: Dispatch-to-admission allocation
      concept_map: books/vol4/13_placement/placement_concepts.yml
    learning_claim: The exchange has two separately timed obligations (board-link transport, then one
      bounded local publication read inside the WCET), and liveness needs a windowed watchdog that catches
      early feeds as well as late ones. The selected placement must allocate the interval from perception
      dispatch to admission (residual inference, serialization, validation, activation, up to one tick)
      and fit it under the stopping spare.
    tradeoff: Compare a stalled writer, torn publication, late completion and implausibly early watchdog
      feed; separately compare supported board-link transport cases.
    student_action: Compare a stalled writer, torn publication, late completion and implausibly early
      watchdog feed; separately compare supported board-link transport cases.
    held_fixed: Use the same proposal bytes and completion contract; do not let moving the checker silently
      reset evidence age or waive validation.
    evidence_to_inspect: Inspect one-attempt mailbox sequence/copy events and computed early/late watchdog feed intervals; use
      the chapter registry for serial and validation budgets, retaining capture-to-dispatch separately
      from dispatch-to-admission.
    feedback_contract: Feedback shows reject-without-waiting for an incomplete record and watchdog failure
      even when an unrelated timer still runs. A discrete checker pays transport delay that consumes physical
      reserve.
    explanation_prompt: Which nonblocking failure preserved the tick, and where did relocation spend the
      latency budget it was meant to protect?
    assessment: Which nonblocking failure preserved the tick, and where did relocation spend the latency
      budget it was meant to protect?
    scope: Finite protocol and watchdog traces with registry-backed board-link allocation. These do not validate
      physical bus behavior, memory barriers, WCET, qualified watchdog bounds, or wiring.
    mlsysim_apis:
    - mlsysim.labs.experiments.v4_timing.study
  - id: v4_13_D
    title: Buy the remedy that addresses the coupling
    investigation_title: Buy the remedy that addresses the coupling
    source_concepts:
    - chapter: 13
      concept: Priced remediation ladder
      concept_map: books/vol4/13_placement/placement_concepts.yml
    - chapter: 13
      concept: Placement record
      concept_map: books/vol4/13_placement/placement_concepts.yml
    learning_claim: A refuted placement forces a remedy matched to the coupling (static reservation, spatial
      partitioning, separate silicon), each paid in a different currency and leaving a named residual.
      The placement record binds the declared WCET and deadline to the execution domain, privilege, period,
      unloaded and loaded maxima, bus QoS, droop and thermal limits, mitigations, and the conditions left
      untested.
    tradeoff: Choose a remedy for the diagnosed resource, then decide whether to keep the placement candidate
      or require escalation and new loaded measurements.
    student_action: Choose a remedy for the diagnosed resource, then decide whether to keep the placement
      candidate or require escalation and new loaded measurements.
    held_fixed: Hold the deadline and failure model fixed; keep proposal quality/throughput costs visible
      rather than lowering requirements invisibly.
    evidence_to_inspect: Compare before/after inventory rows, admitted timing allocation, compute/energy/cost
      consequences from existing registry inputs and a bench campaign design. Unknown cost fields remain
      qualitative and explicit.
    feedback_contract: Feedback rejects a core reservation for an unchanged shared-rail fault and a cache-coloring
      remedy for an unchanged miss-status bottleneck. Empty loaded fields prevent release sign-off.
    explanation_prompt: What did your remedy actually isolate, what did it cost, and which surviving common
      cause still needs a test?
    assessment: What did your remedy actually isolate, what did it cost, and which surviving common cause
      still needs a test?
    scope: A proposed bill of materials or clean model run is not evidence that the reference station
      is electrically independent.
    mlsysim_apis: []
