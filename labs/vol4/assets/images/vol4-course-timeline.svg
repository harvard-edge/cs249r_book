<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="230" fill="#FFFFFF"/>

  <!-- ===== Week grid: 14 columns, 60 px each, from x=60 ===== -->
  <text x="40" y="44" text-anchor="end" font-size="12" font-weight="700" fill="#475569">Week</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="90" y="44">1</text><text x="150" y="44">2</text><text x="210" y="44">3</text><text x="270" y="44">4</text>
    <text x="330" y="44">5</text><text x="390" y="44">6</text><text x="450" y="44">7</text><text x="510" y="44">8</text>
    <text x="570" y="44">9</text><text x="630" y="44">10</text><text x="690" y="44">11</text><text x="750" y="44">12</text>
    <text x="810" y="44">13</text><text x="870" y="44">14</text>
  </g>
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="60" y1="54" x2="60" y2="180"/><line x1="120" y1="54" x2="120" y2="180"/><line x1="180" y1="54" x2="180" y2="180"/>
    <line x1="240" y1="54" x2="240" y2="180"/><line x1="300" y1="54" x2="300" y2="180"/><line x1="360" y1="54" x2="360" y2="180"/>
    <line x1="420" y1="54" x2="420" y2="180"/><line x1="480" y1="54" x2="480" y2="180"/><line x1="540" y1="54" x2="540" y2="180"/>
    <line x1="600" y1="54" x2="600" y2="180"/><line x1="660" y1="54" x2="660" y2="180"/><line x1="720" y1="54" x2="720" y2="180"/>
    <line x1="780" y1="54" x2="780" y2="180"/><line x1="840" y1="54" x2="840" y2="180"/><line x1="900" y1="54" x2="900" y2="180"/>
  </g>

  <!-- ===== Lab bars ===== -->
  <rect x="63" y="70" width="174" height="64" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="150" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Lab 1</text>
  <text x="150" y="116" text-anchor="middle" font-size="12" fill="#475569">the digital twin</text>

  <rect x="243" y="70" width="54" height="64" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="270" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Lab 2</text>
  <text x="270" y="116" text-anchor="middle" font-size="12" fill="#475569">real arm</text>

  <rect x="303" y="70" width="114" height="64" rx="3" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.5"/>
  <text x="360" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Lab 3</text>
  <text x="360" y="116" text-anchor="middle" font-size="12" fill="#475569">learned control</text>

  <rect x="423" y="70" width="114" height="64" rx="3" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.5"/>
  <text x="480" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Lab 4</text>
  <text x="480" y="116" text-anchor="middle" font-size="12" fill="#475569">real data</text>

  <rect x="543" y="70" width="54" height="64" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="570" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Lab 5</text>
  <text x="570" y="116" text-anchor="middle" font-size="12" fill="#475569">stress</text>

  <rect x="603" y="70" width="114" height="64" rx="3" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="660" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Lab 6</text>
  <text x="660" y="116" text-anchor="middle" font-size="12" fill="#475569">safety governor</text>

  <rect x="723" y="70" width="174" height="64" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="810" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Capstone</text>
  <text x="810" y="116" text-anchor="middle" font-size="12" fill="#475569">release defense</text>

  <!-- ===== Milestones (at end of week) ===== -->
  <text x="40" y="166" text-anchor="end" font-size="12" font-weight="700" fill="#475569">Due</text>
  <rect x="280" y="150" width="40" height="22" rx="3" fill="#A31F34"/>
  <text x="300" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M1</text>
  <rect x="520" y="150" width="40" height="22" rx="3" fill="#A31F34"/>
  <text x="540" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M2</text>
  <rect x="580" y="150" width="40" height="22" rx="3" fill="#A31F34"/>
  <text x="600" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M3</text>
  <rect x="700" y="150" width="40" height="22" rx="3" fill="#A31F34"/>
  <text x="720" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M4</text>
  <rect x="880" y="150" width="40" height="22" rx="3" fill="#A31F34"/>
  <text x="900" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M5</text>

  <!-- ===== Phase strip ===== -->
  <text x="180" y="206" text-anchor="middle" font-size="12" fill="#475569">foundations</text>
  <text x="420" y="206" text-anchor="middle" font-size="12" fill="#475569">learning from data</text>
  <text x="630" y="206" text-anchor="middle" font-size="12" fill="#475569">stress and safety</text>
  <text x="810" y="206" text-anchor="middle" font-size="12" fill="#475569">synthesis</text>
</svg>
