<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #475569; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #334155; }
      .box-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .tap-badge { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E11D48" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#F8FAFC" rx="16" />
  <rect x="16" y="16" width="1168" height="668" fill="none" stroke="#E2E8F0" stroke-width="1.5" rx="12" />

  <!-- Header -->
  <text x="50" y="52" class="title">The Physical AI Sense · Propose · Permit · Act Loop</text>
  <text x="50" y="74" class="subtitle">Arduino UNO Q (QRB2210 Linux + STM32U585 MCU) · Hugging Face LeRobot · Seeed Studio SO-101 6-DoF Arm</text>

  <!-- ==================== 1. SENSE ==================== -->
  <g transform="translate(50, 110)">
    <rect width="330" height="190" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="330" height="38" rx="12" fill="#EFF6FF" />
    <rect x="0" y="26" width="330" height="12" fill="#EFF6FF" />
    <rect x="16" y="10" width="68" height="18" rx="4" fill="#DBEAFE" />
    <text x="50" y="23" text-anchor="middle" class="box-badge" fill="#1E40AF">STAGE 1</text>
    <text x="94" y="24" class="box-title" fill="#1E3A8A">SENSE · The Eye</text>
    <text x="20" y="66" class="box-desc">• Standard UVC USB Webcam (/dev/video0)</text>
    <text x="20" y="88" class="box-desc">• Native 30 Hz capture @ 224 × 224 RGB</text>
    <text x="20" y="110" class="box-desc">• Rigid overhead mount (45° oblique view)</text>
    <text x="20" y="132" class="box-desc">• Locked exposure &amp; white balance (v4l2-ctl)</text>
    <rect x="16" y="148" width="298" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="165" y="166" text-anchor="middle" class="box-desc" font-weight="600" fill="#0F172A">Observation: o_t ∈ ℝ^(3 × 224 × 224)</text>
  </g>

  <!-- Flow 1 -> 2: Top Horizontal -->
  <path d="M 380 205 L 810 205" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)" />
  <rect x="520" y="178" width="160" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
  <text x="600" y="195" text-anchor="middle" class="flow-label" fill="#1D4ED8">RGB Video Stream (30 Hz)</text>

  <!-- ==================== 2. PROPOSE ==================== -->
  <g transform="translate(820, 110)">
    <rect width="330" height="190" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="330" height="38" rx="12" fill="#F5F3FF" />
    <rect x="0" y="26" width="330" height="12" fill="#F5F3FF" />
    <rect x="16" y="10" width="68" height="18" rx="4" fill="#EDE9FE" />
    <text x="50" y="23" text-anchor="middle" class="box-badge" fill="#5B21B6">STAGE 2</text>
    <text x="94" y="24" class="box-title" fill="#4C1D95">PROPOSE · The Brain</text>
    <text x="20" y="66" class="box-desc">• Qualcomm QRB2210 Linux Processor</text>
    <text x="20" y="88" class="box-desc">• Hugging Face LeRobot Python runtime</text>
    <text x="20" y="110" class="box-desc">• SmolVLA &amp; ACT Action-Chunking Policy</text>
    <text x="20" y="132" class="box-desc">• INT8 ONNX inference (latency &lt; 45 ms)</text>
    <rect x="16" y="148" width="298" height="28" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
    <text x="165" y="166" text-anchor="middle" class="tap-badge" fill="#4C1D95">Tap 1: a_req = π_θ(o_t) ∈ ℝ^(K × 6)</text>
  </g>

  <!-- Flow 2 -> 3: Right Vertical (Inter-Core Boundary) -->
  <path d="M 985 300 L 985 410" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)" />
  <rect x="855" y="333" width="260" height="44" rx="8" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.5" />
  <text x="985" y="352" text-anchor="middle" class="flow-label" fill="#6B21A8">Inter-Core RPC (/dev/ttyRPMSG)</text>
  <text x="985" y="368" text-anchor="middle" class="tap-badge" fill="#7C3AED">Tap 2: a_map (Mapped Joint Targets)</text>

  <!-- ==================== 3. PERMIT ==================== -->
  <g transform="translate(820, 420)">
    <rect width="330" height="225" rx="12" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="330" height="38" rx="12" fill="#FFF1F2" />
    <rect x="0" y="26" width="330" height="12" fill="#FFF1F2" />
    <rect x="16" y="10" width="68" height="18" rx="4" fill="#FFE4E6" />
    <text x="50" y="23" text-anchor="middle" class="box-badge" fill="#9F1239">STAGE 3</text>
    <text x="94" y="24" class="box-title" fill="#881337">PERMIT · The Governor</text>
    <text x="20" y="66" class="box-desc">• STM32U585 Real-Time Microcontroller</text>
    <text x="20" y="88" class="box-desc">• Deterministic kinematic limit checks</text>
    <text x="20" y="110" class="box-desc">• Table collision geofence: z_tool ≥ 15 mm</text>
    <text x="20" y="132" class="box-desc">• Joint velocity saturation: ω_i ≤ 45°/s</text>
    <text x="20" y="154" class="box-desc">• Hardware SysTick Watchdog: 150 ms cutoff</text>
    <rect x="16" y="174" width="298" height="34" rx="6" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
    <text x="165" y="195" text-anchor="middle" class="tap-badge" fill="#9F1239">Tap 3: a_enf = Clamp(a_map, Bounds) | VETO</text>
  </g>

  <!-- Flow 3 -> 4: Bottom Horizontal -->
  <path d="M 820 532 L 390 532" fill="none" stroke="#E11D48" stroke-width="3" marker-end="url(#arrow-rose)" />
  <rect x="495" y="506" width="210" height="26" rx="6" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
  <text x="600" y="523" text-anchor="middle" class="flow-label" fill="#BE123C">Half-Duplex UART Servo Bus</text>

  <!-- ==================== 4. ACT ==================== -->
  <g transform="translate(50, 420)">
    <rect width="330" height="225" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="330" height="38" rx="12" fill="#ECFDF5" />
    <rect x="0" y="26" width="330" height="12" fill="#ECFDF5" />
    <rect x="16" y="10" width="68" height="18" rx="4" fill="#D1FAE5" />
    <text x="50" y="23" text-anchor="middle" class="box-badge" fill="#065F46">STAGE 4</text>
    <text x="94" y="24" class="box-title" fill="#064E3B">ACT · The Physical Body</text>
    <text x="20" y="66" class="box-desc">• Seeed Studio SO-101 6-DoF Arm</text>
    <text x="20" y="88" class="box-desc">• 6x STS3215 Serial Bus Smart Servos</text>
    <text x="20" y="110" class="box-desc">• Isolated 7.4V/5A Power + Mushroom E-Stop</text>
    <text x="20" y="132" class="box-desc">• Absolute magnetic encoders (±1.5° readback)</text>
    <text x="20" y="154" class="box-desc">• Rigid workbench clamp (zero base rocking)</text>
    <rect x="16" y="174" width="298" height="34" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="165" y="195" text-anchor="middle" class="tap-badge" fill="#065F46">Tap 4: a_meas (Measured Physical State)</text>
  </g>

  <!-- Flow 4 -> Center/1: Left Vertical (Physical Feedback Loop) -->
  <path d="M 215 420 L 215 310" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-emerald)" />
  <rect x="95" y="333" width="240" height="44" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" />
  <text x="215" y="352" text-anchor="middle" class="flow-label" fill="#047857">Next Physical State s(t+1)</text>
  <text x="215" y="368" text-anchor="middle" class="box-desc" font-size="11px" fill="#065F46">Arm Displaces Target Object</text>

  <!-- ==================== CENTER: PHYSICAL ENVIRONMENT & DISTURBANCES ==================== -->
  <g transform="translate(420, 275)">
    <rect width="360" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#shadow)" />
    <rect x="12" y="12" width="336" height="30" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
    <text x="180" y="32" text-anchor="middle" class="box-title" font-size="14px" fill="#92400E">⚡ Physical Workspace &amp; Disturbances</text>
    <text x="22" y="66" class="box-desc">• Foam block target inside 300 × 200 mm zone</text>
    <text x="22" y="88" class="box-desc">• Hand shifts target block mid-trajectory (Lab 6)</text>
    <text x="22" y="110" class="box-desc">• Table surface / obstacle compliance (Lab 7)</text>
    <text x="22" y="132" class="box-desc">• Mushroom E-Stop drops 7.4V motor power (Lab 1, 8)</text>
  </g>
</svg>
