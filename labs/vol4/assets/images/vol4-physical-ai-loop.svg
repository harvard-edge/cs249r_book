<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 23px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; fill: #475569; font-weight: 500; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #1E293B; }
      .box-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; }
      .tap-badge { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#1D4ED8" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#7C3AED" />
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#A51C30" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#047857" />
    </marker>
  </defs>

  <!-- Technical Canvas Background -->
  <rect width="1200" height="700" fill="#FFFFFF" />
  <rect x="1" y="1" width="1198" height="698" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="0" y="0" width="1200" height="6" fill="#7D3C98" />

  <!-- Technical Header -->
  <text x="50" y="48" class="title">THE PHYSICAL AI CAUSAL LOOP: SENSE · PROPOSE · PERMIT · ACT</text>
  <text x="50" y="70" class="subtitle">Platform: Arduino UNO Q (Qualcomm QRB2210 Linux + STM32U585 MCU) · Seeed Studio SO-101 6-DoF Arm · Hugging Face LeRobot</text>
  <line x1="50" y1="84" x2="1150" y2="84" stroke="#E2E8F0" stroke-width="1" />

  <!-- ==================== 1. SENSE ==================== -->
  <g transform="translate(50, 105)">
    <!-- Box Container (Crisp Sharp Corners) -->
    <rect width="335" height="205" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="335" height="4" fill="#1D4ED8" />
    <rect x="0" y="4" width="335" height="34" fill="#EFF6FF" />
    <rect x="12" y="12" width="62" height="18" fill="#1D4ED8" />
    <text x="43" y="25" text-anchor="middle" class="box-badge" fill="#FFFFFF">STAGE 1</text>
    <text x="84" y="26" class="box-title" fill="#1E3A8A">SENSE · The Visual Eye</text>
    <line x1="0" y1="38" x2="335" y2="38" stroke="#BFDBFE" stroke-width="1" />

    <!-- Content -->
    <text x="16" y="64" class="box-desc">• Standard UVC USB Webcam (/dev/video0)</text>
    <text x="16" y="86" class="box-desc">• Native 30 Hz capture @ 224 × 224 RGB</text>
    <text x="16" y="108" class="box-desc">• Rigid overhead mount (45° oblique perspective)</text>
    <text x="16" y="130" class="box-desc">• Locked auto-exposure &amp; white balance (v4l2-ctl)</text>

    <!-- Observation Formula Box -->
    <rect x="12" y="152" width="311" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="167" y="174" text-anchor="middle" class="tap-badge" fill="#1E3A8A">Observation: o_t ∈ ℝ^(3 × 224 × 224)</text>
  </g>

  <!-- Flow 1 -> 2: Top Horizontal -->
  <path d="M 385 207 L 810 207" fill="none" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#arr-blue)" />
  <rect x="525" y="184" width="165" height="26" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1" />
  <text x="607" y="201" text-anchor="middle" class="flow-label" fill="#1D4ED8">RGB Video Stream (30 Hz)</text>

  <!-- ==================== 2. PROPOSE ==================== -->
  <g transform="translate(815, 105)">
    <!-- Box Container -->
    <rect width="335" height="205" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="335" height="4" fill="#7C3AED" />
    <rect x="0" y="4" width="335" height="34" fill="#FAF5FF" />
    <rect x="12" y="12" width="62" height="18" fill="#7C3AED" />
    <text x="43" y="25" text-anchor="middle" class="box-badge" fill="#FFFFFF">STAGE 2</text>
    <text x="84" y="26" class="box-title" fill="#5B21B6">PROPOSE · The Brain</text>
    <line x1="0" y1="38" x2="335" y2="38" stroke="#E9D5FF" stroke-width="1" />

    <!-- Content -->
    <text x="16" y="64" class="box-desc">• Qualcomm QRB2210 Linux Application MPU</text>
    <text x="16" y="86" class="box-desc">• Hugging Face LeRobot Python runtime</text>
    <text x="16" y="108" class="box-desc">• SmolVLA &amp; ACT Action-Chunking Policy</text>
    <text x="16" y="130" class="box-desc">• INT8 Quantized ONNX (latency &lt; 45 ms/chunk)</text>

    <!-- Tap 1 Formula Box -->
    <rect x="12" y="152" width="311" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="167" y="174" text-anchor="middle" class="tap-badge" fill="#6D28D9">Tap 1: a_req = π_θ(o_t) ∈ ℝ^(K × 6)</text>
  </g>

  <!-- Flow 2 -> 3: Right Vertical (Inter-Core Boundary) -->
  <path d="M 982 310 L 982 420" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)" />
  <rect x="855" y="345" width="255" height="42" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.2" />
  <text x="982" y="362" text-anchor="middle" class="flow-label" fill="#5B21B6">Inter-Core RPC (/dev/ttyRPMSG)</text>
  <text x="982" y="377" text-anchor="middle" class="tap-badge" fill="#6D28D9">Tap 2: a_map (Mapped Joint Targets)</text>

  <!-- ==================== 3. PERMIT ==================== -->
  <g transform="translate(815, 425)">
    <!-- Box Container -->
    <rect width="335" height="235" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="335" height="4" fill="#A51C30" />
    <rect x="0" y="4" width="335" height="34" fill="#FEF2F2" />
    <rect x="12" y="12" width="62" height="18" fill="#A51C30" />
    <text x="43" y="25" text-anchor="middle" class="box-badge" fill="#FFFFFF">STAGE 3</text>
    <text x="84" y="26" class="box-title" fill="#991B1B">PERMIT · Safety Governor</text>
    <line x1="0" y1="38" x2="335" y2="38" stroke="#FECDD3" stroke-width="1" />

    <!-- Content -->
    <text x="16" y="64" class="box-desc">• STM32U585 Deterministic Real-Time MCU</text>
    <text x="16" y="86" class="box-desc">• Forward Kinematics: Tool pose check</text>
    <text x="16" y="108" class="box-desc">• Table Collision Geofence: z_tool ≥ 15 mm</text>
    <text x="16" y="130" class="box-desc">• Velocity Clamping: Saturation ω_i ≤ 45°/s</text>
    <text x="16" y="152" class="box-desc">• Hardware SysTick Watchdog: 150 ms cutoff</text>

    <!-- Tap 3 Formula Box -->
    <rect x="12" y="174" width="311" height="44" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" />
    <text x="167" y="193" text-anchor="middle" class="tap-badge" fill="#991B1B">Tap 3: a_enf = Clamp(a_map, Bounds)</text>
    <text x="167" y="208" text-anchor="middle" class="flow-label" fill="#B91C1C">Autonomous Hardware VETO on Violation</text>
  </g>

  <!-- Flow 3 -> 4: Bottom Horizontal -->
  <path d="M 815 542 L 390 542" fill="none" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-crimson)" />
  <rect x="495" y="522" width="220" height="26" fill="#FEF2F2" stroke="#A51C30" stroke-width="1" />
  <text x="605" y="539" text-anchor="middle" class="flow-label" fill="#991B1B">Half-Duplex UART Bus (1 Mbps)</text>

  <!-- ==================== 4. ACT ==================== -->
  <g transform="translate(50, 425)">
    <!-- Box Container -->
    <rect width="335" height="235" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="335" height="4" fill="#047857" />
    <rect x="0" y="4" width="335" height="34" fill="#ECFDF5" />
    <rect x="12" y="12" width="62" height="18" fill="#047857" />
    <text x="43" y="25" text-anchor="middle" class="box-badge" fill="#FFFFFF">STAGE 4</text>
    <text x="84" y="26" class="box-title" fill="#065F46">ACT · The Physical Body</text>
    <line x1="0" y1="38" x2="335" y2="38" stroke="#A7F3D0" stroke-width="1" />

    <!-- Content -->
    <text x="16" y="64" class="box-desc">• Seeed Studio SO-101 6-DoF Manipulator</text>
    <text x="16" y="86" class="box-desc">• 6× Feetech STS3215 Bus Smart Servos</text>
    <text x="16" y="108" class="box-desc">• Isolated 7.4V/5A Power + Mushroom E-Stop</text>
    <text x="16" y="130" class="box-desc">• Magnetic encoder telemetry readback (±1.5°)</text>
    <text x="16" y="152" class="box-desc">• Rigid workbench clamp (zero base rocking)</text>

    <!-- Tap 4 Formula Box -->
    <rect x="12" y="174" width="311" height="44" fill="#FFFFFF" stroke="#047857" stroke-width="1" />
    <text x="167" y="193" text-anchor="middle" class="tap-badge" fill="#047857">Tap 4: a_meas (Measured Physical Angles)</text>
    <text x="167" y="208" text-anchor="middle" class="flow-label" fill="#065F46">Arm Displaces Target Object in World</text>
  </g>

  <!-- Flow 4 -> Center/1: Left Vertical (Physical Feedback Loop) -->
  <path d="M 217 425 L 217 315" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-emerald)" />
  <rect x="95" y="345" width="245" height="42" fill="#ECFDF5" stroke="#047857" stroke-width="1.2" />
  <text x="217" y="362" text-anchor="middle" class="flow-label" fill="#065F46">Next Physical State s(t+1)</text>
  <text x="217" y="377" text-anchor="middle" class="tap-badge" fill="#047857">Closed-Loop Sensory Return</text>

  <!-- ==================== CENTER: PHYSICAL ENVIRONMENT & DISTURBANCES ==================== -->
  <g transform="translate(420, 275)">
    <rect width="360" height="160" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 4" />
    <rect x="0" y="0" width="360" height="4" fill="#D97706" />
    <rect x="16" y="14" width="328" height="26" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
    <text x="180" y="31" text-anchor="middle" class="flow-label" fill="#B45309">PHYSICAL WORKSPACE &amp; DISTURBANCES</text>
    <text x="20" y="66" class="box-desc">• Foam block target inside marked 300 × 200 mm zone</text>
    <text x="20" y="88" class="box-desc">• Target displaced mid-trajectory by hand (Lab 6)</text>
    <text x="20" y="110" class="box-desc">• Surface collision / obstacle interaction (Lab 7)</text>
    <text x="20" y="132" class="box-desc">• Physical E-Stop disconnects 7.4V rail (Lab 1, 8)</text>
  </g>
</svg>
