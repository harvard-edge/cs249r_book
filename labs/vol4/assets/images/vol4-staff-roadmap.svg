<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="300" fill="#FFFFFF"/>

  <!-- ===== Week grid: 13 columns, 62 px each, from x=120 ===== -->
  <g font-size="12" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="151" y="36">W1</text><text x="213" y="36">W2</text><text x="275" y="36">W3</text><text x="337" y="36">W4</text>
    <text x="399" y="36">W5</text><text x="461" y="36">W6</text><text x="523" y="36">W7</text><text x="585" y="36">W8</text>
    <text x="647" y="36">W9</text><text x="709" y="36">W10</text><text x="771" y="36">W11</text><text x="833" y="36">W12</text>
    <text x="895" y="36">W13</text>
  </g>
  <g font-size="10.5" fill="#64748B" text-anchor="middle">
    <text x="151" y="52">Sep 21</text><text x="213" y="52">Sep 28</text><text x="275" y="52">Oct 5</text><text x="337" y="52">Oct 12</text>
    <text x="399" y="52">Oct 19</text><text x="461" y="52">Oct 26</text><text x="523" y="52">Nov 2</text><text x="585" y="52">Nov 9</text>
    <text x="647" y="52">Nov 16</text><text x="709" y="52">Nov 23</text><text x="771" y="52">Nov 30</text><text x="833" y="52">Dec 7</text>
    <text x="895" y="52">Dec 14</text>
  </g>
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="120" y1="62" x2="120" y2="250"/><line x1="182" y1="62" x2="182" y2="250"/><line x1="244" y1="62" x2="244" y2="250"/>
    <line x1="306" y1="62" x2="306" y2="250"/><line x1="368" y1="62" x2="368" y2="250"/><line x1="430" y1="62" x2="430" y2="250"/>
    <line x1="492" y1="62" x2="492" y2="250"/><line x1="554" y1="62" x2="554" y2="250"/><line x1="616" y1="62" x2="616" y2="250"/>
    <line x1="678" y1="62" x2="678" y2="250"/><line x1="740" y1="62" x2="740" y2="250"/><line x1="802" y1="62" x2="802" y2="250"/>
    <line x1="864" y1="62" x2="864" y2="250"/><line x1="926" y1="62" x2="926" y2="250"/>
  </g>

  <!-- ===== Row labels ===== -->
  <g font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="end">
    <text x="108" y="99">Bring-up</text>
    <text x="108" y="159">Student Zero</text>
    <text x="108" y="219">Release</text>
  </g>

  <!-- ===== Row 1: bring-up (W1-W4) ===== -->
  <rect x="123" y="76" width="56" height="36" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <text x="151" y="99" text-anchor="middle" font-size="12" fill="#0F172A">prep</text>
  <rect x="185" y="76" width="56" height="36" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
  <text x="213" y="99" text-anchor="middle" font-size="12" fill="#0F172A">Step 1</text>
  <rect x="247" y="76" width="56" height="36" rx="3" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
  <text x="275" y="99" text-anchor="middle" font-size="12" fill="#0F172A">Step 2</text>
  <rect x="309" y="76" width="56" height="36" rx="3" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
  <text x="337" y="99" text-anchor="middle" font-size="12" fill="#0F172A">Step 3</text>
  <rect x="557" y="76" width="56" height="36" rx="3" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.2"/>
  <text x="585" y="99" text-anchor="middle" font-size="12" fill="#0F172A">Step 4</text>

  <!-- ===== Row 2: Student Zero lab runs (W5-W11) ===== -->
  <rect x="371" y="136" width="56" height="36" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
  <text x="399" y="159" text-anchor="middle" font-size="11.5" fill="#0F172A">Labs 1–2</text>
  <rect x="433" y="136" width="118" height="36" rx="3" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.2"/>
  <text x="492" y="159" text-anchor="middle" font-size="12" fill="#0F172A">Lab 4 · data, train</text>
  <rect x="557" y="136" width="56" height="36" rx="3" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.2"/>
  <text x="585" y="152" text-anchor="middle" font-size="12" fill="#0F172A">Lab 4</text>
  <text x="585" y="166" text-anchor="middle" font-size="11" fill="#475569">run</text>
  <rect x="619" y="136" width="56" height="36" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
  <text x="647" y="159" text-anchor="middle" font-size="12" fill="#0F172A">Lab 5</text>
  <rect x="681" y="136" width="118" height="36" rx="3" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
  <text x="740" y="159" text-anchor="middle" font-size="12" fill="#0F172A">Lab 6 · build, break</text>

  <!-- ===== Row 3: release (W12-W13) ===== -->
  <rect x="805" y="196" width="56" height="36" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <text x="833" y="219" text-anchor="middle" font-size="12" fill="#0F172A">capstone</text>
  <rect x="867" y="196" width="56" height="36" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <text x="895" y="219" text-anchor="middle" font-size="12" fill="#0F172A">freeze</text>

  <!-- ===== Milestone qualification markers ===== -->
  <text x="108" y="279" text-anchor="end" font-size="12.5" font-weight="700" fill="#0F172A">Qualified</text>
  <rect x="379" y="262" width="40" height="22" rx="3" fill="#A31F34"/>
  <text x="399" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M1</text>
  <rect x="565" y="262" width="40" height="22" rx="3" fill="#A31F34"/>
  <text x="585" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M2</text>
  <rect x="627" y="262" width="40" height="22" rx="3" fill="#A31F34"/>
  <text x="647" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M3</text>
  <rect x="751" y="262" width="40" height="22" rx="3" fill="#A31F34"/>
  <text x="771" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M4</text>
  <rect x="813" y="262" width="40" height="22" rx="3" fill="#A31F34"/>
  <text x="833" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M5</text>
</svg>
