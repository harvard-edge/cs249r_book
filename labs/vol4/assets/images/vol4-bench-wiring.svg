<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#D97706"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#FFFFFF"/>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="34" x2="80" y2="34" stroke="#475569" stroke-width="2"/>
  <text x="88" y="38" font-size="12" font-weight="700" fill="#334155">data</text>
  <line x1="150" y1="34" x2="190" y2="34" stroke="#1F407A" stroke-width="2"/>
  <text x="198" y="38" font-size="12" font-weight="700" fill="#1F407A">logic power</text>
  <line x1="310" y1="34" x2="350" y2="34" stroke="#D97706" stroke-width="2"/>
  <text x="358" y="38" font-size="12" font-weight="700" fill="#B45309">motor power</text>
  <line x1="470" y1="34" x2="510" y2="34" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="518" y="38" font-size="12" font-weight="700" fill="#475569">common ground</text>

  <!-- ===== Sources on the left ===== -->
  <rect x="40" y="116" width="170" height="70" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="125" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">USB webcam</text>
  <text x="125" y="168" text-anchor="middle" font-size="12.5" fill="#475569">overhead mount</text>

  <rect x="40" y="210" width="170" height="70" rx="3" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.5"/>
  <text x="125" y="241" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">45 W USB-C PD</text>
  <text x="125" y="262" text-anchor="middle" font-size="12.5" fill="#475569">logic supply</text>

  <!-- ===== UNO Q ===== -->
  <rect x="280" y="70" width="340" height="230" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Arduino UNO Q</text>
  <rect x="300" y="116" width="140" height="70" rx="3" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.2"/>
  <text x="370" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Linux MPU</text>
  <text x="370" y="168" text-anchor="middle" font-size="12.5" fill="#475569">runs the policy</text>
  <rect x="460" y="116" width="140" height="70" rx="3" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
  <text x="530" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">STM32 MCU</text>
  <text x="530" y="168" text-anchor="middle" font-size="12.5" fill="#475569">owns the servo bus</text>
  <line x1="440" y1="151" x2="458" y2="151" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="450" y="220" text-anchor="middle" font-size="12.5" fill="#475569">the two cores talk over</text>
  <text x="450" y="240" text-anchor="middle" font-size="12.5" fill="#475569">an internal RPC bridge</text>

  <!-- ===== Servo bus ===== -->
  <rect x="720" y="80" width="200" height="200" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <text x="820" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">SO-101 servo bus</text>
  <rect x="745" y="124" width="150" height="20" rx="0" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="820" y="138" text-anchor="middle" font-size="12" fill="#334155">servo 1 · base</text>
  <rect x="745" y="148" width="150" height="20" rx="0" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="820" y="162" text-anchor="middle" font-size="12" fill="#334155">servo 2 · shoulder</text>
  <rect x="745" y="172" width="150" height="20" rx="0" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="820" y="186" text-anchor="middle" font-size="12" fill="#334155">servo 3 · elbow</text>
  <rect x="745" y="196" width="150" height="20" rx="0" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="820" y="210" text-anchor="middle" font-size="12" fill="#334155">servos 4–5 · wrist</text>
  <rect x="745" y="220" width="150" height="20" rx="0" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="820" y="234" text-anchor="middle" font-size="12" fill="#334155">servo 6 · gripper</text>
  <text x="820" y="264" text-anchor="middle" font-size="12.5" fill="#475569">daisy-chained</text>

  <!-- ===== Motor supply ===== -->
  <rect x="720" y="320" width="200" height="70" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="820" y="351" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">7.4 V motor supply</text>
  <text x="820" y="372" text-anchor="middle" font-size="12.5" fill="#475569">with its own on/off switch</text>

  <!-- ===== Wires ===== -->
  <line x1="210" y1="151" x2="298" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
  <text x="245" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">USB</text>
  <line x1="210" y1="245" x2="278" y2="245" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-navy)"/>
  <line x1="600" y1="151" x2="718" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
  <text x="660" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">UART</text>
  <text x="660" y="172" text-anchor="middle" font-size="12.5" fill="#475569">only path</text>
  <line x1="820" y1="320" x2="820" y2="282" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <path d="M720,370 H450 V300" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="585" y="362" text-anchor="middle" font-size="12.5" fill="#475569">star ground</text>

  <!-- ===== Rules ===== -->
  <text x="40" y="330" font-size="12.5" font-weight="700" fill="#991B1B">No other cable reaches the servo bus.</text>
  <text x="40" y="352" font-size="12.5" fill="#475569">Motor power never flows through the board.</text>
  <text x="40" y="374" font-size="12.5" fill="#475569">Switching it off leaves the board running and logging.</text>
</svg>
