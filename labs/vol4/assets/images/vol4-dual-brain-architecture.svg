<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; font-weight: 500; }
      .domain-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14.5px; font-weight: 800; letter-spacing: -0.2px; }
      .domain-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748B; font-weight: 600; }
      .role-banner { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .block-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; }
      .block-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; }
      .tap-badge { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; }
      .bridge-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; }
      .bridge-sub { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; }
      .matrix-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
      .matrix-cell { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #1E293B; }
      .matrix-prop { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #475569; }
    </style>
    <marker id="arr-purple-lg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#7C3AED" />
    </marker>
    <marker id="arr-green-lg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#059669" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="730" fill="#FFFFFF" />
  <rect x="1" y="1" width="1198" height="728" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="0" y="0" width="1200" height="6" fill="#A51C30" />

  <!-- Main Header -->
  <text x="45" y="44" class="title">THE DUAL-BRAIN ARCHITECTURE OF PHYSICAL AI</text>
  <text x="45" y="65" class="subtitle">Asymmetric Cognition vs. Deterministic Governance: How Embodied Systems Safely Bridge Learning and Physical Force</text>
  <line x1="45" y1="80" x2="1155" y2="80" stroke="#E2E8F0" stroke-width="1" />

  <!-- ==================== LEFT PILLAR: BRAIN 1 (COGNITIVE BRAIN) ==================== -->
  <g transform="translate(45, 95)">
    <!-- Outer Box (Sharp Corners) -->
    <rect width="490" height="430" fill="#FAF5FF" stroke="#C084FC" stroke-width="1.5" />
    <rect x="0" y="0" width="490" height="4" fill="#7C3AED" />
    
    <!-- Header Area -->
    <rect x="0" y="4" width="490" height="44" fill="#F3E8FF" />
    <rect x="12" y="15" width="170" height="20" fill="#7C3AED" />
    <text x="97" y="29" text-anchor="middle" class="badge" fill="#FFFFFF">BRAIN 1 · COGNITIVE BRAIN</text>
    <text x="194" y="24" class="domain-title" fill="#5B21B6">Qualcomm QRB2210 Linux MPU</text>
    <text x="194" y="39" class="domain-sub">Debian Linux · 4GB LPDDR4 · ARM Cortex-A53</text>
    <line x1="0" y1="48" x2="490" y2="48" stroke="#E9D5FF" stroke-width="1" />

    <!-- Role Banner -->
    <rect x="12" y="58" width="466" height="26" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1" />
    <text x="245" y="75" text-anchor="middle" class="role-banner" fill="#4C1D95">High-Level Multimodal Intent, Vision Perception &amp; Trajectory Proposal</text>

    <!-- Sub-Block 1: Sensory Grounding -->
    <g transform="translate(12, 94)">
      <rect width="466" height="78" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <rect x="0" y="0" width="4" height="78" fill="#7C3AED" />
      <text x="14" y="18" class="block-title" fill="#5B21B6">1. Sensory Grounding &amp; Perception (/dev/video0)</text>
      <text x="14" y="35" class="block-desc">• Ingests 30 Hz UVC camera frames (224 × 224 RGB via V4L2 daemon)</text>
      <text x="14" y="52" class="block-desc">• Conditions on task natural language (e.g., "pick up red block")</text>
      <text x="14" y="69" class="block-desc">• Ingests proprioceptive joint history (q_meas) from previous episode steps</text>
    </g>

    <!-- Sub-Block 2: Neural Policy Inference -->
    <g transform="translate(12, 180)">
      <rect width="466" height="78" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <rect x="0" y="0" width="4" height="78" fill="#7C3AED" />
      <text x="14" y="18" class="block-title" fill="#5B21B6">2. Neural Policy Engine (SmolVLA / ACT)</text>
      <text x="14" y="35" class="block-desc">• Hugging Face LeRobot stack running quantized ONNX INT8 engine</text>
      <text x="14" y="52" class="block-desc">• Action Chunking with Transformers: predicts K=16 future joint targets</text>
      <text x="14" y="69" class="block-desc">• Soft real-time: inference latency 30–80 ms per 16-step chunk</text>
    </g>

    <!-- Sub-Block 3: Proposal Output Tap -->
    <g transform="translate(12, 266)">
      <rect width="466" height="66" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="14" y="19" class="block-title" fill="#4C1D95">3. Action Proposal Output (Tap 1 &amp; Tap 2)</text>
      <rect x="14" y="28" width="438" height="26" fill="#F3E8FF" stroke="#DDD6FE" stroke-width="0.5" />
      <text x="233" y="45" text-anchor="middle" class="tap-badge" fill="#6B21A8">Tap 1: a_req = π_θ(I_t, L) ──▶ Tap 2: a_map (Mapped Targets)</text>
    </g>

    <!-- Sub-Block 4: The Inherent Systems Nature Box -->
    <g transform="translate(12, 340)">
      <rect width="466" height="78" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
      <rect x="0" y="0" width="4" height="78" fill="#D97706" />
      <text x="14" y="18" class="block-title" fill="#92400E">SYSTEM NATURE: Probabilistic &amp; Non-Deterministic</text>
      <text x="14" y="35" class="block-desc">• Prone to visual hallucinations, out-of-distribution drift, and OS jitter</text>
      <text x="14" y="52" class="block-desc">• Memory paging or garbage collection can induce transient timing stalls</text>
      <text x="14" y="69" class="block-desc">• Authority Level: Advisory Proposer — NEVER directly pulses motor coils</text>
    </g>
  </g>

  <!-- ==================== CENTRAL CAUSAL BOUNDARY (INTER-CORE CHASM) ==================== -->
  <g transform="translate(535, 95)">
    <!-- Central Dashed Boundary Line -->
    <line x1="65" y1="6" x2="65" y2="424" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" />
    
    <!-- Top Central Badge: Causal Boundary -->
    <rect x="10" y="14" width="110" height="24" fill="#0F172A" />
    <text x="65" y="30" text-anchor="middle" class="badge" fill="#FFFFFF">CAUSAL BOUNDARY</text>

    <!-- 1. Forward Command Connector (Y: 175) -->
    <g transform="translate(0, 160)">
      <line x1="0" y1="46" x2="122" y2="46" stroke="#7C3AED" stroke-width="3" marker-end="url(#arr-purple-lg)" />
      <rect x="8" y="0" width="114" height="36" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" />
      <text x="65" y="14" text-anchor="middle" class="bridge-title" fill="#7C3AED">INTER-CORE RPC</text>
      <text x="65" y="27" text-anchor="middle" class="bridge-sub" fill="#5B21B6">a_map (50 Hz)</text>
    </g>

    <!-- 2. Zero Host Bypass Warning (Y: 255) -->
    <g transform="translate(5, 245)">
      <rect width="120" height="42" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" />
      <text x="60" y="17" text-anchor="middle" class="badge" fill="#DC2626">ZERO BYPASS</text>
      <text x="60" y="32" text-anchor="middle" class="bridge-title" fill="#991B1B">No Direct Host USB</text>
    </g>

    <!-- 3. Return Telemetry Connector (Y: 335) -->
    <g transform="translate(0, 320)">
      <line x1="130" y1="46" x2="8" y2="46" stroke="#059669" stroke-width="3" marker-end="url(#arr-green-lg)" />
      <rect x="8" y="0" width="114" height="36" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
      <text x="65" y="14" text-anchor="middle" class="bridge-title" fill="#059669">TELEMETRY RETURN</text>
      <text x="65" y="27" text-anchor="middle" class="bridge-sub" fill="#065F46">a_meas readback</text>
    </g>
  </g>

  <!-- ==================== RIGHT PILLAR: BRAIN 2 (SAFETY GOVERNOR) ==================== -->
  <g transform="translate(665, 95)">
    <!-- Outer Box (Sharp Corners) -->
    <rect width="490" height="430" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5" />
    <rect x="0" y="0" width="490" height="4" fill="#DC2626" />

    <!-- Header Area -->
    <rect x="0" y="4" width="490" height="44" fill="#FEE2E2" />
    <rect x="12" y="15" width="170" height="20" fill="#DC2626" />
    <text x="97" y="29" text-anchor="middle" class="badge" fill="#FFFFFF">BRAIN 2 · SAFETY GOVERNOR</text>
    <text x="194" y="24" class="domain-title" fill="#991B1B">STM32U585 Real-Time MCU</text>
    <text x="194" y="39" class="domain-sub">160 MHz ARM Cortex-M33 · Bare-Metal / RTOS</text>
    <line x1="0" y1="48" x2="490" y2="48" stroke="#FECACA" stroke-width="1" />

    <!-- Role Banner -->
    <rect x="12" y="58" width="466" height="26" fill="#FEE2E2" stroke="#FECACA" stroke-width="1" />
    <text x="245" y="75" text-anchor="middle" class="role-banner" fill="#7F1D1D">Deterministic Invariant Enforcement, Bus Arbitration &amp; Hardware Veto</text>

    <!-- Sub-Block 1: Real-Time Safety Filters -->
    <g transform="translate(12, 94)">
      <rect width="466" height="78" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <rect x="0" y="0" width="4" height="78" fill="#DC2626" />
      <text x="14" y="18" class="block-title" fill="#991B1B">1. Closed-Form Safety Filters (Simplex Governor)</text>
      <text x="14" y="35" class="block-desc">• Velocity Saturation Clamping: strictly limits speed deltas (|ω_i| ≤ 45°/s)</text>
      <text x="14" y="52" class="block-desc">• Table Geofence: evaluates forward kinematics T_0^6(q); vetoes z_tool &lt; 15 mm</text>
      <text x="14" y="69" class="block-desc">• Joint Angle Limits: hard calibrated stops prevent mechanical binding</text>
    </g>

    <!-- Sub-Block 2: Hardware Watchdogs -->
    <g transform="translate(12, 180)">
      <rect width="466" height="78" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <rect x="0" y="0" width="4" height="78" fill="#DC2626" />
      <text x="14" y="18" class="block-title" fill="#991B1B">2. Watchdog Timers &amp; Queue Invariants</text>
      <text x="14" y="35" class="block-desc">• 150 ms SysTick Hardware Watchdog: disarms if Linux drops heartbeat pulses</text>
      <text x="14" y="52" class="block-desc">• Host Freeze Defense: instantly halts arm if Linux crashes or is killed</text>
      <text x="14" y="69" class="block-desc">• Zero Backlog Flush: purges stale queues on resume; rejects buffered moves</text>
    </g>

    <!-- Sub-Block 3: Enforced Output Tap -->
    <g transform="translate(12, 266)">
      <rect width="466" height="66" fill="#FEF2F2" stroke="#F87171" stroke-width="1" />
      <text x="14" y="19" class="block-title" fill="#991B1B">3. Enforced Actuation Output (Tap 3)</text>
      <rect x="14" y="28" width="438" height="26" fill="#FEE2E2" stroke="#FECACA" stroke-width="0.5" />
      <text x="233" y="45" text-anchor="middle" class="tap-badge" fill="#991B1B">Tap 3: a_enf = Clamp(a_map, Envelope) · Active Hardware VETO on Breach</text>
    </g>

    <!-- Sub-Block 4: The Inherent Systems Nature Box -->
    <g transform="translate(12, 340)">
      <rect width="466" height="78" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
      <rect x="0" y="0" width="4" height="78" fill="#166534" />
      <text x="14" y="18" class="block-title" fill="#166534">SYSTEM NATURE: Deterministic &amp; Hard Real-Time</text>
      <text x="14" y="35" class="block-desc">• Microsecond cycle determinism (&lt; 1 ms); zero garbage collection pauses</text>
      <text x="14" y="52" class="block-desc">• Exclusively commands the physical half-duplex TTL UART motor bus line</text>
      <text x="14" y="69" class="block-desc">• Authority Level: Sovereign Gatekeeper — holds total veto over physical force</text>
    </g>
  </g>

  <!-- ==================== BOTTOM CONTAINER: COMPARATIVE MATRIX & PHYSICAL PLANT ==================== -->
  <g transform="translate(45, 540)">
    <rect width="1110" height="175" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="1110" height="3" fill="#0F172A" />

    <!-- Left Sub-Panel: Systems Matrix -->
    <g transform="translate(16, 12)">
      <text x="0" y="14" class="domain-title" fill="#0F172A">ARCHITECTURAL ASYMMETRY COMPARISON MATRIX</text>
      
      <!-- Table Header -->
      <rect x="0" y="24" width="575" height="22" fill="#E2E8F0" />
      <text x="10" y="39" class="matrix-header" fill="#334155">DIMENSION</text>
      <text x="135" y="39" class="matrix-header" fill="#5B21B6">BRAIN 1: COGNITIVE LINUX MPU</text>
      <text x="365" y="39" class="matrix-header" fill="#991B1B">BRAIN 2: SAFETY GOVERNOR MCU</text>

      <!-- Row 1: Paradigm -->
      <rect x="0" y="48" width="575" height="23" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5" />
      <text x="10" y="64" class="matrix-prop">Paradigm</text>
      <text x="135" y="64" class="matrix-cell">Probabilistic / Neural / High-Dimensional</text>
      <text x="365" y="64" class="matrix-cell">Deterministic / Bounded / Closed-Form</text>

      <!-- Row 2: Timing Guarantee -->
      <rect x="0" y="73" width="575" height="23" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5" />
      <text x="10" y="89" class="matrix-prop">Timing Nature</text>
      <text x="135" y="89" class="matrix-cell">Soft Real-Time (30–80 ms per chunk)</text>
      <text x="365" y="89" class="matrix-cell">Hard Real-Time (&lt; 1 ms loop / 150 ms cutoff)</text>

      <!-- Row 3: Authority -->
      <rect x="0" y="98" width="575" height="23" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5" />
      <text x="10" y="114" class="matrix-prop">Authority Role</text>
      <text x="135" y="114" class="matrix-cell">Advisory Intent: Proposes a_req</text>
      <text x="365" y="114" class="matrix-cell">Sovereign Gatekeeper: Vetoes or Permits a_enf</text>

      <!-- Row 4: Vulnerability -->
      <rect x="0" y="123" width="575" height="23" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5" />
      <text x="10" y="139" class="matrix-prop">Failure Mode</text>
      <text x="135" y="139" class="matrix-cell">Hallucination, Out-of-Distribution Drift</text>
      <text x="365" y="139" class="matrix-cell">Watchdog Timeout, Safe Limp/Freeze State</text>
    </g>

    <!-- Vertical Panel Divider -->
    <line x1="615" y1="12" x2="615" y2="162" stroke="#CBD5E1" stroke-width="1" />

    <!-- Right Sub-Panel: Physical Plant & Actuation -->
    <g transform="translate(635, 12)">
      <text x="0" y="14" class="domain-title" fill="#065F46">THE PHYSICAL PLANT: SEEED SO-101 6-DoF ARM</text>
      
      <!-- Actuation Box -->
      <g transform="translate(0, 24)">
        <rect width="455" height="125" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1" />
        <rect x="0" y="0" width="4" height="125" fill="#059669" />
        
        <text x="14" y="20" class="block-title" fill="#065F46">6× Feetech STS3215 Daisy-Chain Smart Servos</text>
        <text x="14" y="38" class="block-desc">• Single-wire half-duplex TTL UART bus @ 1 Mbps (exclusively driven by MCU)</text>
        <text x="14" y="55" class="block-desc">• Dedicated 7.4V / 5A DC power rail with common star-ground (no brownouts)</text>
        <text x="14" y="72" class="block-desc">• 12-bit magnetic contactless encoders return ground-truth angles (Tap 4: a_meas)</text>

        <!-- Tap 4 Highlight Box -->
        <rect x="14" y="85" width="427" height="28" fill="#F0FDF4" stroke="#059669" stroke-width="1" />
        <text x="227" y="103" text-anchor="middle" class="tap-badge" fill="#065F46">Tap 4: a_meas (Measured Joint Angles &amp; Load Readback)</text>
      </g>
    </g>
  </g>
</svg>
