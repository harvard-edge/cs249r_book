<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #0F172A; letter-spacing: -0.4px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .card-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 400; fill: #334155; line-height: 1.4; }
      .wire-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; }
    </style>
    
    <!-- Marker definitions for signal and power flow -->
    <marker id="arrow-power" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <marker id="arrow-signal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-mcu" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#047857" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#FFFFFF" />

  <!-- Header Card -->
  <rect x="30" y="20" width="1140" height="66" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="30" y="20" width="1140" height="4" fill="#1D4ED8" />
  <text x="50" y="46" class="title">PHYSICAL BENCH RIGGING &amp; ELECTRICAL BUS INTERFACE</text>
  <text x="50" y="68" class="subtitle">Complete Hardware Schematic: Dual-Silicon Compute · Dedicated Servo Power Rail · Governed Half-Duplex Bus</text>

  <!-- MAIN 3 PANELS -->

  <!-- Panel 1: SENSING & COMPUTE DOMAIN (Left) -->
  <rect x="30" y="102" width="350" height="570" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
  <rect x="30" y="102" width="350" height="5" fill="#1D4ED8" />
  <text x="46" y="126" class="section-title" fill="#1D4ED8">DOMAIN 1: SENSING &amp; HIGH-LEVEL LINUX</text>
  <text x="46" y="142" class="card-sub" fill="#64748B">Qualcomm QRB2210 SoC · Debian Linux · USB Host</text>
  <line x1="46" y1="150" x2="364" y2="150" stroke="#CBD5E1" stroke-width="1" />

  <!-- Box 1A: 45W USB-PD Power -->
  <rect x="46" y="166" width="318" height="74" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <rect x="46" y="166" width="4" height="74" fill="#1D4ED8" />
  <text x="58" y="186" class="card-title">45W USB-PD Main Adapter</text>
  <text x="58" y="204" class="card-text">• Dedicated 5V/3A logic power to USB-C port</text>
  <text x="58" y="222" class="card-text">• Powers QRB2210 Linux, STM32 MCU &amp; USB bus</text>

  <!-- Box 1B: Logitech C270 USB Camera -->
  <rect x="46" y="256" width="318" height="96" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <rect x="46" y="256" width="4" height="96" fill="#1D4ED8" />
  <text x="58" y="276" class="card-title">Logitech C270 HD Webcam</text>
  <text x="58" y="294" class="card-text">• Mounted 40 cm above workspace at 45° angle</text>
  <text x="58" y="312" class="card-text">• 30 Hz RGB frames (224×224 crop) via V4L2</text>
  <text x="58" y="330" class="card-text">• AprilTag fiducial calibration &amp; visual feedback</text>

  <!-- Box 1C: Qualcomm Linux Edge Runtime -->
  <rect x="46" y="368" width="318" height="150" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <rect x="46" y="368" width="4" height="150" fill="#1D4ED8" />
  <text x="58" y="388" class="card-title">Qualcomm Linux Edge Runtime</text>
  <text x="58" y="406" class="card-text">• LeRobot v0.2+ Python Environment</text>
  <text x="58" y="424" class="card-text">• SmolVLA / ACT Policy (ONNX INT8, &lt;50 MB)</text>
  <text x="58" y="442" class="card-text">• Python UnoQMotorsBus Custom Adapter</text>
  <text x="58" y="460" class="card-text">• 30 Hz Action Proposal Loop (a_req, a_map)</text>
  <text x="58" y="478" class="card-text">• Multi-tap CSV Telemetry Logging</text>
  <text x="58" y="496" class="card-text">• Heartbeat signal emitted every 20 ms</text>

  <!-- Inter-Core Bridge Box at Bottom of Domain 1 -->
  <rect x="46" y="534" width="318" height="120" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="58" y="554" class="card-title" fill="#1D4ED8">OpenAMP RPMsg Inter-Core Channel</text>
  <text x="58" y="572" class="card-text">Shared SRAM Ring Buffers (/dev/ttyRPMSG)</text>
  <text x="58" y="590" class="card-text">• Linux proposes 6-DoF joint targets &amp; velocities</text>
  <text x="58" y="608" class="card-text">• MCU returns verified measured states (a_meas)</text>
  <text x="58" y="626" class="card-text">• Bidirectional round-trip latency &lt; 5 ms at 50 Hz</text>


  <!-- Panel 2: REAL-TIME GOVERNOR & POWER BUS (Center) -->
  <rect x="410" y="102" width="380" height="570" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5" />
  <rect x="410" y="102" width="380" height="5" fill="#D97706" />
  <text x="426" y="126" class="section-title" fill="#D97706">DOMAIN 2: REAL-TIME GOVERNANCE &amp; POWER</text>
  <text x="426" y="142" class="card-sub" fill="#64748B">STM32U585 MCU (160 MHz) · Dedicated 7.4V DC Rail</text>
  <line x1="426" y1="150" x2="774" y2="150" stroke="#CBD5E1" stroke-width="1" />

  <!-- Box 2A: Dedicated Servo Power Supply -->
  <rect x="426" y="166" width="348" height="140" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
  <rect x="426" y="166" width="6" height="140" fill="#D97706" />
  <text x="442" y="186" class="card-title" fill="#B45309">Dedicated Servo Power Supply</text>
  <text x="442" y="206" class="card-text"><b>Power Rating:</b> Regulated 7.4V / 5A DC External Power</text>
  <text x="442" y="226" class="card-text"><b>Connection:</b> Direct barrel jack / screw terminal to servo rail</text>
  <text x="442" y="246" class="card-text"><b>Ground Plane:</b> Common solid star-ground with Arduino board</text>
  <text x="442" y="266" class="card-text"><b>Isolation Benefit:</b> Prevents motor inductive current spikes</text>
  <text x="442" y="286" class="card-text">from causing brownout resets on the Qualcomm processor</text>

  <!-- Box 2B: STM32U585 Real-Time Safety Governor -->
  <rect x="426" y="322" width="348" height="196" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <rect x="426" y="322" width="6" height="196" fill="#7D3C98" />
  <text x="442" y="342" class="card-title">STM32U585 Microcontroller (160 MHz)</text>
  <text x="442" y="360" class="card-sub" fill="#7D3C98">Firmware Enforcer of Physical Safety Invariants</text>
  <text x="442" y="380" class="card-text">• <b>Joint Velocity Saturation:</b> Clamps |ω_i| ≤ 45°/s</text>
  <text x="442" y="398" class="card-text">• <b>Table Collision Geofence:</b> Evaluates forward kinematics;</text>
  <text x="442" y="414" class="card-text">  vetoes command if end-effector z_tool &lt; 15 mm</text>
  <text x="442" y="432" class="card-text">• <b>150 ms SysTick Watchdog:</b> Hardware timeout timer;</text>
  <text x="442" y="448" class="card-text">  halts motion if Linux heartbeat packet drops</text>
  <text x="442" y="466" class="card-text">• <b>Zero Backlog Recovery:</b> Flushes stale UART queues on</text>
  <text x="442" y="482" class="card-text">  process resume; zero backlog replay</text>
  <text x="442" y="500" class="card-text">• <b>Telemetry Tap:</b> Returns actual positions (a_meas)</text>

  <!-- Box 2C: Logic Level Shifter & Half-Duplex Bridge -->
  <rect x="426" y="534" width="348" height="120" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <rect x="426" y="534" width="6" height="120" fill="#047857" />
  <text x="442" y="554" class="card-title">UART Half-Duplex Bus Interface</text>
  <text x="442" y="572" class="card-text">• 3.3V CMOS (STM32 USART) ↔ 5V TTL Bus Transceiver</text>
  <text x="442" y="590" class="card-text">• Single-wire bidirectional half-duplex (STS_DATA)</text>
  <text x="442" y="608" class="card-text">• 1 Mbps serial baud rate, 8-N-1 packet protocol</text>
  <text x="442" y="626" class="card-text">• Direct connection to Servo 1 Daisy-Chain port</text>


  <!-- Panel 3: PHYSICAL ACTUATION RIG (Right) -->
  <rect x="820" y="102" width="350" height="570" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5" />
  <rect x="820" y="102" width="350" height="5" fill="#047857" />
  <text x="836" y="126" class="section-title" fill="#047857">DOMAIN 3: PHYSICAL ACTUATION RIG</text>
  <text x="836" y="142" class="card-sub" fill="#64748B">Seeed Studio SO-101 Pro · 6-DoF Arm · STS3215</text>
  <line x1="836" y1="150" x2="1154" y2="150" stroke="#CBD5E1" stroke-width="1" />

  <!-- Box 3A: Mechanical Mounting -->
  <rect x="836" y="166" width="318" height="84" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <rect x="836" y="166" width="4" height="84" fill="#047857" />
  <text x="848" y="186" class="card-title">Rigid Bench Clamping</text>
  <text x="848" y="204" class="card-text">• Arm baseplate clamped rigidly to workbench edge</text>
  <text x="848" y="222" class="card-text">• Heavy-duty C-clamps prevent tip &amp; vibration</text>
  <text x="848" y="240" class="card-text">• 300 × 200 mm taped workspace bounding box</text>

  <!-- Box 3B: Daisy-Chained Smart Servos -->
  <rect x="836" y="266" width="318" height="252" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <rect x="836" y="266" width="4" height="252" fill="#047857" />
  <text x="848" y="286" class="card-title">6-DoF Feetech STS3215 Servos</text>
  <text x="848" y="304" class="card-sub" fill="#047857">Single-Wire Half-Duplex Daisy Chain</text>
  
  <rect x="848" y="314" width="294" height="26" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="856" y="331" class="card-text"><b>Joint 1 (Base Yaw):</b> STS3215 ID 1 · Port In from MCU</text>

  <rect x="848" y="346" width="294" height="26" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="856" y="363" class="card-text"><b>Joint 2 (Shoulder):</b> STS3215 ID 2 · 19 kg·cm torque</text>

  <rect x="848" y="378" width="294" height="26" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="856" y="395" class="card-text"><b>Joint 3 (Elbow):</b> STS3215 ID 3 · Dual daisy-chain port</text>

  <rect x="848" y="410" width="294" height="26" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="856" y="427" class="card-text"><b>Joint 4 (Wrist Pitch):</b> STS3215 ID 4 · High precision</text>

  <rect x="848" y="442" width="294" height="26" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="856" y="459" class="card-text"><b>Joint 5 (Wrist Roll):</b> STS3215 ID 5 · 12-bit encoder</text>

  <rect x="848" y="474" width="294" height="26" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="856" y="491" class="card-text"><b>Joint 6 (Gripper):</b> STS3215 ID 6 · Parallel jaw grasp</text>

  <!-- Box 3C: Bus Specifications -->
  <rect x="836" y="534" width="318" height="120" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <rect x="836" y="534" width="4" height="120" fill="#047857" />
  <text x="848" y="554" class="card-title">Bus Electrical Specifications</text>
  <text x="848" y="572" class="card-text">• <b>3-Pin Harness:</b> Pin 1: GND | Pin 2: 7.4V Motor | Pin 3: DATA</text>
  <text x="848" y="590" class="card-text">• <b>Internal Sensors:</b> 12-bit magnetic angle encoder</text>
  <text x="848" y="608" class="card-text">• <b>Thermal Invariant:</b> Shoulder/Elbow casing &lt; 60°C</text>
  <text x="848" y="626" class="card-text">• <b>Repeatability:</b> ±1.5° position homing repeatability</text>

  <!-- CONNECTING ARROWS & LABELS -->
  <!-- Arrow 1: Domain 1 to Domain 2 (Inter-Core Bridge) -->
  <path d="M 364 594 L 426 594" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-signal)" />
  <text x="395" y="586" text-anchor="middle" class="wire-label" fill="#2563EB">RPMsg</text>

  <!-- Arrow 2: Power line from Domain 2 to Domain 3 -->
  <path d="M 774 236 L 836 236" stroke="#D97706" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-power)" />
  <text x="805" y="228" text-anchor="middle" class="wire-label" fill="#D97706">7.4V DC Rail</text>

  <!-- Arrow 3: Governed UART bus line from Domain 2 to Domain 3 -->
  <path d="M 774 594 L 836 594" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow-mcu)" />
  <text x="805" y="586" text-anchor="middle" class="wire-label" fill="#047857">STS_DATA</text>

</svg>
