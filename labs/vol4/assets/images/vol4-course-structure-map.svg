        <rect width="344" height="90" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
        <text x="12" y="22" class="lab-title" fill="#92400E">Week 14: 20-Trial Physical Defense</text>
        <text x="12" y="42" class="lab-desc">• 20 witnessed physical trials on held-out starts</text>
        <text x="12" y="60" class="lab-desc">• Requirement: ≥ 80% success, 0 unhandled collisions</text>
        <text x="12" y="78" class="comp-badge" font-weight="700" fill="#92400E">Final Defense: 12 Competencies Signed Off</text>
