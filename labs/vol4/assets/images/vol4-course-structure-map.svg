    <!-- Lab 4 Card -->
    <g transform="translate(275, 48)">
      <rect width="248" height="145" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#5B21B6">Lab 4: Baseline &amp; Export</text>
      <text x="12" y="38" class="lab-desc">• Deterministic reach heuristic script</text>
      <text x="12" y="55" class="lab-desc">• ACT imitation policy GPU training</text>
      <text x="12" y="72" class="lab-desc">• Train/val loss &amp; error validation</text>
      <text x="12" y="89" class="lab-desc">• ONNX INT8 edge model quantization</text>
      <rect x="8" y="110" width="232" height="26" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1" />
      <text x="124" y="127" text-anchor="middle" class="comp-badge" fill="#6D28D9">Artifact: ONNX INT8 Policy [B2, B3]</text>
