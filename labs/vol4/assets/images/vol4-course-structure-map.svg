    <rect x="12" y="12" width="52" height="18" fill="#1D4ED8" />
    <text x="38" y="25" text-anchor="middle" class="pill" fill="#FFFFFF">PART I</text>
    <text x="74" y="25" class="part-title" fill="#1E3A8A">The Machine Anatomy</text>
    <text x="240" y="25" class="part-sub">Wks 1–3 · Ch. 1–4</text>
    <rect x="385" y="10" width="138" height="22" fill="#1D4ED8" />
    <text x="454" y="25" text-anchor="middle" class="ms-badge" fill="#FFFFFF">M1: 15% · WEEK 3</text>
    <line x1="0" y1="38" x2="535" y2="38" stroke="#BFDBFE" stroke-width="1" />

    <!-- Lab 1 Card -->
    <g transform="translate(12, 48)">
      <rect width="248" height="145" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#1E3A8A">Lab 1: Causal Boundary</text>
      <text x="12" y="38" class="lab-desc">• Power harness &amp; E-Stop wiring</text>
      <text x="12" y="55" class="lab-desc">• Bus bring-up &amp; servo scan</text>
      <text x="12" y="72" class="lab-desc">• Measured safe-state verification</text>
      <text x="12" y="89" class="lab-desc">• Boot &amp; reset transient audit</text>
      <rect x="8" y="110" width="232" height="26" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="124" y="127" text-anchor="middle" class="comp-badge" fill="#1D4ED8">Artifact: Wiring &amp; Safe Trace [A1, D1]</text>
    </g>

    <!-- Lab 2 Card -->
    <g transform="translate(275, 48)">
      <rect width="248" height="145" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#1E3A8A">Lab 2: Sensing &amp; Bridge</text>
      <text x="12" y="38" class="lab-desc">• Overhead USB webcam calibration</text>
      <text x="12" y="55" class="lab-desc">• Joint homing offset repeat test</text>
      <text x="12" y="72" class="lab-desc">• Inter-core RPC round-trip test</text>
      <text x="12" y="89" class="lab-desc">• 300 × 200 mm envelope boundary</text>
