      <text x="124" y="127" text-anchor="middle" class="comp-badge" fill="#1D4ED8">Artifact: Calibration Card [A2, A3]</text>
    </g>
  </g>

  <!-- ==================== PART II ==================== -->
  <g transform="translate(615, 95)">
    <rect width="535" height="205" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
