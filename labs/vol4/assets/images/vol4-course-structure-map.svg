    <g transform="translate(12, 48)">
      <rect width="248" height="145" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#991B1B">Lab 7: MCU Safety Governor</text>
      <text x="12" y="38" class="lab-desc">• Real-time table geofence (z ≥ 15 mm)</text>
      <text x="12" y="55" class="lab-desc">• Velocity clamp (ω_max = 45°/s)</text>
      <text x="12" y="72" class="lab-desc">• Injected illegal command vetoes</text>
      <text x="12" y="89" class="lab-desc">• Zero unhandled software bypasses</text>
      <rect x="8" y="110" width="232" height="26" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1" />
      <text x="124" y="127" text-anchor="middle" class="comp-badge" fill="#991B1B">Artifact: Governor Veto Log [D1, D2]</text>
    </g>

    <!-- Lab 8 Card -->
    <g transform="translate(275, 48)">
      <rect width="248" height="145" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#991B1B">Lab 8: Faults &amp; Verification</text>
      <text x="12" y="38" class="lab-desc">• 150 ms hardware SysTick watchdog</text>
      <text x="12" y="55" class="lab-desc">• Linux process suspension (kill -STOP)</text>
      <text x="12" y="72" class="lab-desc">• Camera unplug &amp; packet corruption</text>
      <text x="12" y="89" class="lab-desc">• Zero backlogged stale action replay</text>
      <rect x="8" y="110" width="232" height="26" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1" />
      <text x="124" y="127" text-anchor="middle" class="comp-badge" fill="#991B1B">Artifact: Watchdog Cutoff [D2, D3]</text>
    </g>
