    <rect x="12" y="12" width="52" height="18" fill="#7C3AED" />
    <text x="38" y="25" text-anchor="middle" class="pill" fill="#FFFFFF">PART II</text>
    <text x="74" y="25" class="part-title" fill="#5B21B6">Teaching the Machine</text>
    <text x="240" y="25" class="part-sub">Wks 4–6 · Ch. 5–7</text>
    <rect x="385" y="10" width="138" height="22" fill="#7C3AED" />
    <text x="454" y="25" text-anchor="middle" class="ms-badge" fill="#FFFFFF">M2: 25% · WEEK 6</text>
    <line x1="0" y1="38" x2="535" y2="38" stroke="#E9D5FF" stroke-width="1" />

    <!-- Lab 3 Card -->
    <g transform="translate(12, 48)">
      <rect width="248" height="145" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#5B21B6">Lab 3: Teleop &amp; Datasets</text>
      <text x="12" y="38" class="lab-desc">• HF LeRobot teleoperation setup</text>
