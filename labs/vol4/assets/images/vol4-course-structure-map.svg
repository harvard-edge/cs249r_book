  <!-- ==================== PART III ==================== -->
  <g transform="translate(50, 315)">
    <rect width="535" height="205" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="535" height="4" fill="#047857" />
    <rect x="0" y="4" width="535" height="34" fill="#ECFDF5" />
    <rect x="12" y="12" width="56" height="18" fill="#047857" />
    <text x="40" y="25" text-anchor="middle" class="pill" fill="#FFFFFF">PART III</text>
    <text x="78" y="25" class="part-title" fill="#064E3B">Running the Machine</text>
    <text x="240" y="25" class="part-sub">Wks 7–9 · Ch. 8–13</text>
    <rect x="385" y="10" width="138" height="22" fill="#047857" />
    <text x="454" y="25" text-anchor="middle" class="ms-badge" fill="#FFFFFF">M3: 20% · WEEK 9</text>
    <line x1="0" y1="38" x2="535" y2="38" stroke="#A7F3D0" stroke-width="1" />

