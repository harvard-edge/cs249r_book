    <text x="451" y="25" text-anchor="middle" class="ms-badge" fill="#FFFFFF">M4: 15% · WEEK 11</text>
    <line x1="0" y1="38" x2="535" y2="38" stroke="#FECDD3" stroke-width="1" />

