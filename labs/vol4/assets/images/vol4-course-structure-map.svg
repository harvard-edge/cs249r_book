<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 23px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; fill: #475569; font-weight: 500; }
      .part-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14.5px; font-weight: 800; letter-spacing: -0.2px; }
      .part-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748B; font-weight: 600; }
      .lab-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .lab-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #1E293B; }
      .pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; }
      .comp-badge { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; }
      .ms-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Technical Canvas Background -->
  <rect width="1200" height="720" fill="#FFFFFF" />
  <rect x="1" y="1" width="1198" height="718" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="0" y="0" width="1200" height="6" fill="#7D3C98" />

  <!-- Header -->
  <text x="50" y="46" class="title">VOLUME IV PHYSICAL AI STUDIO: 14-WEEK CURRICULUM ARCHITECTURE</text>
  <text x="50" y="68" class="subtitle">4 Core Modules · 8 Hands-On Physical Labs · 5 Evaluated Milestones · 3-Week Dedicated Capstone Studio</text>
  <line x1="50" y1="82" x2="1150" y2="82" stroke="#E2E8F0" stroke-width="1" />

  <!-- ==================== PART I ==================== -->
  <g transform="translate(50, 95)">
