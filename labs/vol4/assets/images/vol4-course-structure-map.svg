  <!-- ==================== CAPSTONE PROJECT STUDIO ==================== -->
  <g transform="translate(50, 535)">
    <rect width="1100" height="150" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
    <rect x="0" y="0" width="1100" height="4" fill="#D97706" />
    <rect x="0" y="4" width="1100" height="34" fill="#FEF3C7" />
    <rect x="14" y="12" width="125" height="18" fill="#D97706" />
    <text x="76" y="25" text-anchor="middle" class="pill" fill="#FFFFFF">CAPSTONE STUDIO</text>
    <text x="150" y="25" class="part-title" fill="#78350F">Dedicated Capstone Project Studio</text>
    <text x="410" y="25" class="part-sub">Weeks 12–14 · Full System Synthesis &amp; Physical Defense</text>
    <rect x="890" y="10" width="195" height="22" fill="#D97706" />
    <text x="987" y="25" text-anchor="middle" class="ms-badge" fill="#FFFFFF">M5: 25% · WEEK 14 DEFENSE</text>
    <line x1="0" y1="38" x2="1100" y2="38" stroke="#FDE68A" stroke-width="1" />

    <!-- 3 Columns for Capstone -->
    <g transform="translate(14, 48)">
      <!-- Week 12 -->
      <g transform="translate(0, 0)">
        <rect width="342" height="90" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
        <text x="12" y="22" class="lab-title" fill="#78350F">Week 12: Disturbance Hardening</text>
        <text x="12" y="42" class="lab-desc">• Edge case profiling &amp; surface clutter trials</text>
        <text x="12" y="60" class="lab-desc">• Failure mode taxonomy (slip, occlusion, lag)</text>
        <text x="12" y="78" class="comp-badge" fill="#B45309">Milestone: Pre-Release System Freeze</text>
      </g>
      <!-- Week 13 -->
      <g transform="translate(364, 0)">
        <rect width="342" height="90" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
        <text x="12" y="22" class="lab-title" fill="#78350F">Week 13: Mock Defense &amp; Dossier</text>
        <text x="12" y="42" class="lab-desc">• Full 20-trial rehearsal under simulated stress</text>
        <text x="12" y="60" class="lab-desc">• Claim-Argument-Evidence (CAE) safety dossier</text>
        <text x="12" y="78" class="comp-badge" fill="#B45309">Milestone: Draft Safety Dossier Review</text>
      </g>
      <!-- Week 14 -->
