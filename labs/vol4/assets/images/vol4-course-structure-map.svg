<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #475569; }
      .part-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .part-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748B; font-weight: 500; }
      .lab-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .lab-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #334155; }
      .pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .comp-badge { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; }
      .ms-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="#F8FAFC" rx="16" />
  <rect x="16" y="16" width="1168" height="688" fill="none" stroke="#E2E8F0" stroke-width="1.5" rx="12" />

  <!-- Header -->
  <text x="50" y="48" class="title">Volume IV Physical AI Studio · 14-Week Curriculum Map</text>
  <text x="50" y="70" class="subtitle">4 Core Parts · 8 Hands-On Labs · 5 Evaluated Milestones · 3-Week Dedicated Capstone Studio</text>

  <!-- ==================== PART I ==================== -->
  <g transform="translate(50, 95)">
    <rect width="535" height="205" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Header banner -->
    <path d="M 0 12 Q 0 0 12 0 L 523 0 Q 535 0 535 12 L 535 38 L 0 38 Z" fill="#EFF6FF" />
    <rect x="14" y="10" width="56" height="18" rx="4" fill="#DBEAFE" />
    <text x="42" y="23" text-anchor="middle" class="pill" fill="#1E40AF">PART I</text>
    <text x="78" y="23" class="part-title" fill="#1E3A8A">The Machine Anatomy</text>
    <text x="246" y="23" class="part-sub">Wks 1–3 · Ch. 1–4</text>
    <!-- Milestone pill -->
    <rect x="400" y="9" width="122" height="20" rx="10" fill="#BFDBFE" />
    <text x="461" y="23" text-anchor="middle" class="ms-badge" fill="#1E3A8A">M1: 15% (Week 3)</text>

    <!-- Lab 1 Card -->
    <g transform="translate(14, 48)">
      <rect width="245" height="142" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#1E3A8A">Lab 1: Causal Boundary</text>
      <text x="12" y="38" class="lab-desc">• Power harness &amp; E-Stop wiring</text>
      <text x="12" y="55" class="lab-desc">• Bus bring-up &amp; servo scan</text>
      <text x="12" y="72" class="lab-desc">• Measured safe-state verification</text>
      <text x="12" y="89" class="lab-desc">• Boot &amp; reset transient audit</text>
      <rect x="10" y="108" width="225" height="24" rx="4" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1" />
      <text x="122" y="124" text-anchor="middle" class="comp-badge" fill="#1D4ED8">Artifact: Wiring &amp; Safe Trace [A1, D1]</text>
    </g>

    <!-- Lab 2 Card -->
    <g transform="translate(276, 48)">
      <rect width="245" height="142" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#1E3A8A">Lab 2: Sensing &amp; Bridge</text>
      <text x="12" y="38" class="lab-desc">• Overhead USB webcam calibration</text>
      <text x="12" y="55" class="lab-desc">• Joint homing offset repeat test</text>
      <text x="12" y="72" class="lab-desc">• Inter-core RPC round-trip test</text>
      <text x="12" y="89" class="lab-desc">• 300 × 200 mm envelope boundary</text>
      <rect x="10" y="108" width="225" height="24" rx="4" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1" />
      <text x="122" y="124" text-anchor="middle" class="comp-badge" fill="#1D4ED8">Artifact: Calibration Card [A2, A3]</text>
    </g>
  </g>

  <!-- ==================== PART II ==================== -->
  <g transform="translate(615, 95)">
    <rect width="535" height="205" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Header banner -->
    <path d="M 0 12 Q 0 0 12 0 L 523 0 Q 535 0 535 12 L 535 38 L 0 38 Z" fill="#F5F3FF" />
    <rect x="14" y="10" width="56" height="18" rx="4" fill="#EDE9FE" />
    <text x="42" y="23" text-anchor="middle" class="pill" fill="#5B21B6">PART II</text>
    <text x="78" y="23" class="part-title" fill="#4C1D95">Teaching the Machine</text>
    <text x="246" y="23" class="part-sub">Wks 4–6 · Ch. 5–7</text>
    <!-- Milestone pill -->
    <rect x="400" y="9" width="122" height="20" rx="10" fill="#DDD6FE" />
    <text x="461" y="23" text-anchor="middle" class="ms-badge" fill="#4C1D95">M2: 25% (Week 6)</text>

    <!-- Lab 3 Card -->
    <g transform="translate(14, 48)">
      <rect width="245" height="142" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#4C1D95">Lab 3: Teleop &amp; Datasets</text>
      <text x="12" y="38" class="lab-desc">• HF LeRobot teleoperation setup</text>
      <text x="12" y="55" class="lab-desc">• 10 pick-and-place demonstration runs</text>
      <text x="12" y="72" class="lab-desc">• LeRobot v2 schema formatting</text>
      <text x="12" y="89" class="lab-desc">• Video &amp; action stream alignment</text>
      <rect x="10" y="108" width="225" height="24" rx="4" fill="#F5F3FF" stroke="#EDE9FE" stroke-width="1" />
      <text x="122" y="124" text-anchor="middle" class="comp-badge" fill="#6D28D9">Artifact: LeRobot Dataset [B1, B2]</text>
    </g>

    <!-- Lab 4 Card -->
    <g transform="translate(276, 48)">
      <rect width="245" height="142" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#4C1D95">Lab 4: Baseline &amp; Export</text>
      <text x="12" y="38" class="lab-desc">• Deterministic reach heuristic script</text>
      <text x="12" y="55" class="lab-desc">• ACT imitation policy GPU training</text>
      <text x="12" y="72" class="lab-desc">• Train/val loss &amp; error validation</text>
      <text x="12" y="89" class="lab-desc">• ONNX INT8 edge model quantization</text>
      <rect x="10" y="108" width="225" height="24" rx="4" fill="#F5F3FF" stroke="#EDE9FE" stroke-width="1" />
      <text x="122" y="124" text-anchor="middle" class="comp-badge" fill="#6D28D9">Artifact: ONNX INT8 Policy [B2, B3]</text>
    </g>
  </g>

  <!-- ==================== PART III ==================== -->
  <g transform="translate(50, 315)">
    <rect width="535" height="205" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Header banner -->
    <path d="M 0 12 Q 0 0 12 0 L 523 0 Q 535 0 535 12 L 535 38 L 0 38 Z" fill="#ECFDF5" />
    <rect x="14" y="10" width="56" height="18" rx="4" fill="#D1FAE5" />
    <text x="42" y="23" text-anchor="middle" class="pill" fill="#065F46">PART III</text>
    <text x="78" y="23" class="part-title" fill="#064E3B">Running the Machine</text>
    <text x="242" y="23" class="part-sub">Wks 7–9 · Ch. 8–13</text>
    <!-- Milestone pill -->
    <rect x="400" y="9" width="122" height="20" rx="10" fill="#A7F3D0" />
    <text x="461" y="23" text-anchor="middle" class="ms-badge" fill="#064E3B">M3: 20% (Week 9)</text>

    <!-- Lab 5 Card -->
    <g transform="translate(14, 48)">
      <rect width="245" height="142" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#064E3B">Lab 5: Autonomous Reach</text>
      <text x="12" y="38" class="lab-desc">• Untethered runtime on Qualcomm Linux</text>
      <text x="12" y="55" class="lab-desc">• Headless V4L2 camera acquisition</text>
      <text x="12" y="72" class="lab-desc">• Full 4-tap telemetry recording</text>
      <text x="12" y="89" class="lab-desc">• End-to-end loop latency &lt; 80 ms</text>
      <rect x="10" y="108" width="225" height="24" rx="4" fill="#ECFDF5" stroke="#D1FAE5" stroke-width="1" />
      <text x="122" y="124" text-anchor="middle" class="comp-badge" fill="#047857">Artifact: Untethered Reach [C1, C2]</text>
    </g>

    <!-- Lab 6 Card -->
    <g transform="translate(276, 48)">
      <rect width="245" height="142" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#064E3B">Lab 6: Action Horizons</text>
      <text x="12" y="38" class="lab-desc">• Chunk horizons: K ∈ {1, 8, 16, 32}</text>
      <text x="12" y="55" class="lab-desc">• Mid-trajectory target perturbation</text>
      <text x="12" y="72" class="lab-desc">• Temporal ensemble smoothing</text>
      <text x="12" y="89" class="lab-desc">• SmolVLA language conditioning test</text>
      <rect x="10" y="108" width="225" height="24" rx="4" fill="#ECFDF5" stroke="#D1FAE5" stroke-width="1" />
      <text x="122" y="124" text-anchor="middle" class="comp-badge" fill="#047857">Artifact: Horizon &amp; Recovery [C2, C3]</text>
    </g>
  </g>

  <!-- ==================== PART IV ==================== -->
  <g transform="translate(615, 315)">
    <rect width="535" height="205" rx="12" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Header banner -->
    <path d="M 0 12 Q 0 0 12 0 L 523 0 Q 535 0 535 12 L 535 38 L 0 38 Z" fill="#FFF1F2" />
    <rect x="14" y="10" width="56" height="18" rx="4" fill="#FFE4E6" />
    <text x="42" y="23" text-anchor="middle" class="pill" fill="#9F1239">PART IV</text>
    <text x="78" y="23" class="part-title" fill="#881337">Governing the Machine</text>
    <text x="246" y="23" class="part-sub">Wks 10–11 · Ch. 14–17</text>
    <!-- Milestone pill -->
    <rect x="395" y="9" width="127" height="20" rx="10" fill="#FECDD3" />
    <text x="458" y="23" text-anchor="middle" class="ms-badge" fill="#881337">M4: 15% (Week 11)</text>

    <!-- Lab 7 Card -->
    <g transform="translate(14, 48)">
      <rect width="245" height="142" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#881337">Lab 7: MCU Safety Governor</text>
      <text x="12" y="38" class="lab-desc">• Real-time table geofence (z ≥ 15 mm)</text>
      <text x="12" y="55" class="lab-desc">• Velocity clamp (ω_max = 45°/s)</text>
      <text x="12" y="72" class="lab-desc">• Injected illegal command vetoes</text>
      <text x="12" y="89" class="lab-desc">• Zero unhandled software bypasses</text>
      <rect x="10" y="108" width="225" height="24" rx="4" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
      <text x="122" y="124" text-anchor="middle" class="comp-badge" fill="#BE123C">Artifact: Governor Veto Log [D1, D2]</text>
    </g>

    <!-- Lab 8 Card -->
    <g transform="translate(276, 48)">
      <rect width="245" height="142" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="lab-title" fill="#881337">Lab 8: Faults &amp; Verification</text>
      <text x="12" y="38" class="lab-desc">• 150 ms hardware SysTick watchdog</text>
      <text x="12" y="55" class="lab-desc">• Linux process suspension (kill -STOP)</text>
      <text x="12" y="72" class="lab-desc">• Camera unplug &amp; packet corruption</text>
      <text x="12" y="89" class="lab-desc">• Zero backlogged stale action replay</text>
      <rect x="10" y="108" width="225" height="24" rx="4" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
      <text x="122" y="124" text-anchor="middle" class="comp-badge" fill="#BE123C">Artifact: Watchdog Cutoff [D2, D3]</text>
    </g>
  </g>

  <!-- ==================== CAPSTONE PROJECT STUDIO ==================== -->
  <g transform="translate(50, 535)">
    <rect width="1100" height="148" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)" />
    <!-- Header banner -->
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 38 L 0 38 Z" fill="#FEF3C7" />
    <rect x="16" y="10" width="130" height="18" rx="4" fill="#FDE68A" />
    <text x="81" y="23" text-anchor="middle" class="pill" fill="#92400E">CAPSTONE STUDIO</text>
    <text x="160" y="24" class="part-title" fill="#78350F">Dedicated Capstone Project Studio</text>
    <text x="430" y="24" class="part-sub">Weeks 12–14 · Autonomous Embodied Release &amp; Defense</text>
    <!-- Milestone pill -->
    <rect x="895" y="9" width="190" height="20" rx="10" fill="#FCD34D" />
    <text x="990" y="23" text-anchor="middle" class="ms-badge" fill="#78350F">M5: 25% (Week 14 Defense)</text>

    <!-- 3 Columns for Capstone -->
    <g transform="translate(16, 48)">
      <!-- Week 12 -->
      <g transform="translate(0, 0)">
        <rect width="340" height="88" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
        <text x="14" y="22" class="lab-title" fill="#78350F">Week 12: Disturbance Hardening</text>
        <text x="14" y="42" class="lab-desc">• Edge case profiling &amp; surface clutter trials</text>
        <text x="14" y="60" class="lab-desc">• Failure mode taxonomy (slip, occlusion, lag)</text>
        <text x="14" y="78" class="comp-badge" fill="#B45309">Milestone: Pre-Release System Freeze</text>
      </g>
      <!-- Week 13 -->
      <g transform="translate(360, 0)">
        <rect width="340" height="88" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
        <text x="14" y="22" class="lab-title" fill="#78350F">Week 13: Mock Defense &amp; Dossier</text>
        <text x="14" y="42" class="lab-desc">• Full 20-trial rehearsal under simulated stress</text>
        <text x="14" y="60" class="lab-desc">• Claim-Argument-Evidence (CAE) safety dossier</text>
        <text x="14" y="78" class="comp-badge" fill="#B45309">Milestone: Draft Safety Dossier Review</text>
      </g>
      <!-- Week 14 -->
      <g transform="translate(720, 0)">
        <rect width="348" height="88" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
        <text x="14" y="22" class="lab-title" fill="#92400E">Week 14: 20-Trial Physical Defense</text>
        <text x="14" y="42" class="lab-desc">• 20 witnessed physical trials on held-out starts</text>
        <text x="14" y="60" class="lab-desc">• Requirement: ≥ 80% success, 0 unhandled collisions</text>
        <text x="14" y="78" class="comp-badge" font-weight="700" fill="#92400E">Final Defense: 12 Competencies Signed Off</text>
      </g>
    </g>
  </g>
</svg>
