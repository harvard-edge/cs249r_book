<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #475569; }
      .domain-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .domain-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #64748B; font-weight: 500; }
      .block-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .block-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #334155; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tap-text { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
      .wire-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E11D48" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#F8FAFC" rx="16" />
  <rect x="16" y="16" width="1168" height="648" fill="none" stroke="#E2E8F0" stroke-width="1.5" rx="12" />

  <!-- Header -->
  <text x="50" y="48" class="title">Arduino UNO Q Dual-Silicon Architecture &amp; Safety Boundary</text>
  <text x="50" y="70" class="subtitle">Why LeRobot Operates the Arm as a Unit While the MCU Retains Deterministic Hardware Authority</text>

  <!-- ==================== LEFT DOMAIN: QUALCOMM LINUX ==================== -->
  <g transform="translate(50, 95)">
    <!-- Outer Domain Box -->
    <rect width="345" height="545" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 333 0 Q 345 0 345 12 L 345 46 L 0 46 Z" fill="#F5F3FF" />
    <rect x="14" y="14" width="60" height="18" rx="4" fill="#EDE9FE" />
    <text x="44" y="27" text-anchor="middle" class="badge" fill="#5B21B6">LINUX MPU</text>
    <text x="82" y="24" class="domain-title" fill="#4C1D95">Qualcomm QRB2210</text>
    <text x="82" y="39" class="domain-sub">Debian Linux · 4GB LPDDR4</text>

    <!-- Sub-Block 1: Camera Ingestion -->
    <g transform="translate(14, 58)">
      <rect width="317" height="92" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#1E293B">UVC Video Stream (/dev/video0)</text>
      <text x="12" y="39" class="block-desc">• 224 × 224 RGB capture @ 30 Hz</text>
      <text x="12" y="56" class="block-desc">• Background V4L2 threaded daemon</text>
      <text x="12" y="73" class="block-desc">• Fixed exposure &amp; gain (anti-hunting)</text>
    </g>

    <!-- Sub-Block 2: HF LeRobot Runtime -->
    <g transform="translate(14, 160)">
      <rect width="317" height="128" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#4C1D95">Hugging Face LeRobot Stack</text>
      <text x="12" y="39" class="block-desc">• Treats SO-101 as unified robot entity</text>
      <text x="12" y="56" class="block-desc">• SmolVLA &amp; ACT Action-Chunking</text>
      <text x="12" y="73" class="block-desc">• ONNX Runtime ARM64 INT8 execution</text>
      <text x="12" y="90" class="block-desc">• Inference latency: &lt; 45 ms per chunk</text>
      <rect x="12" y="98" width="293" height="20" rx="4" fill="#EDE9FE" />
      <text x="158" y="112" text-anchor="middle" class="tap-text" fill="#5B21B6">Tap 1: a_req = π_θ(o_t) (Chunk of Actions)</text>
    </g>

    <!-- Sub-Block 3: Motor Bus Adapter -->
    <g transform="translate(14, 298)">
      <rect width="317" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#1E293B">UnoQMotorsBus Python Adapter</text>
      <text x="12" y="39" class="block-desc">• Custom 60-line LeRobot bus plugin</text>
      <text x="12" y="56" class="block-desc">• Maps action chunks to joint angles</text>
      <text x="12" y="73" class="block-desc">• Binary packet serialization (24 bytes)</text>
      <rect x="12" y="80" width="293" height="20" rx="4" fill="#EDE9FE" />
      <text x="158" y="94" text-anchor="middle" class="tap-text" fill="#5B21B6">Tap 2: a_map (Mapped Joint Targets)</text>
    </g>

    <!-- Power Note -->
    <g transform="translate(14, 418)">
      <rect width="317" height="112" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#1E40AF">Logic Power &amp; Logging Continuity</text>
      <text x="12" y="39" class="block-desc">• Powered via 45W USB-PD adapter</text>
      <text x="12" y="56" class="block-desc">• Fully isolated from servo motor power rail</text>
      <text x="12" y="73" class="block-desc">• Continues logging traces when E-Stop is hit</text>
      <text x="12" y="90" class="block-desc">• Zero reboot or data corruption on cutoff</text>
    </g>
  </g>

  <!-- ==================== BRIDGE ARROW: LINUX -> MCU ==================== -->
  <g transform="translate(395, 360)">
    <path d="M 0 0 L 25 0" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)" />
    <rect x="-12" y="-28" width="48" height="20" rx="4" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1" />
    <text x="12" y="-14" text-anchor="middle" class="wire-label" fill="#6B21A8">RPC</text>
  </g>

  <!-- ==================== MIDDLE DOMAIN: STM32 MCU ==================== -->
  <g transform="translate(425, 95)">
    <!-- Outer Domain Box -->
    <rect width="350" height="545" rx="12" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" filter="url(#shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 46 L 0 46 Z" fill="#FFF1F2" />
    <rect x="14" y="14" width="60" height="18" rx="4" fill="#FFE4E6" />
    <text x="44" y="27" text-anchor="middle" class="badge" fill="#9F1239">MCU CORE</text>
    <text x="82" y="24" class="domain-title" fill="#881337">STM32U585 Governor</text>
    <text x="82" y="39" class="domain-sub">ARM Cortex-M33 · Deterministic Real-Time</text>

    <!-- Sub-Block 1: Inter-Core Bridge -->
    <g transform="translate(14, 58)">
      <rect width="322" height="92" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#881337">Inter-Core Bridge Listener</text>
      <text x="12" y="39" class="block-desc">• Receives 24-byte action packet (/dev/ttyRPMSG)</text>
      <text x="12" y="56" class="block-desc">• Round-trip latency: &lt; 5 ms @ 50 Hz</text>
      <text x="12" y="73" class="block-desc">• Checks packet CRC &amp; sequence freshness</text>
    </g>

    <!-- Sub-Block 2: Deterministic Safety Engine -->
    <g transform="translate(14, 160)">
      <rect width="322" height="128" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5" />
      <text x="12" y="20" class="block-title" fill="#9F1239">Real-Time Safety Enforcement</text>
      <text x="12" y="39" class="block-desc">• Velocity Saturation: Clamps ω_i ≤ 45°/s</text>
      <text x="12" y="56" class="block-desc">• Forward Kinematics: Computes tool pose (x, y, z)</text>
      <text x="12" y="73" class="block-desc">• Table Geofence: Vetoes any move with z &lt; 15 mm</text>
      <text x="12" y="90" class="block-desc">• Boundary Hysteresis: Prevents limit chatter</text>
      <rect x="12" y="98" width="298" height="20" rx="4" fill="#FFE4E6" />
      <text x="161" y="112" text-anchor="middle" class="tap-text" fill="#9F1239">Tap 3: a_enf = Clamp(a_map) | VETO</text>
    </g>

    <!-- Sub-Block 3: Hardware Watchdog -->
    <g transform="translate(14, 298)">
      <rect width="322" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#881337">Hardware SysTick Watchdog</text>
      <text x="12" y="39" class="block-desc">• 150 ms timeout without fresh heartbeat</text>
      <text x="12" y="56" class="block-desc">• Linux freeze / crash drops arm into safe hold</text>
      <text x="12" y="73" class="block-desc">• Flushes UART buffer on resume (zero backlog)</text>
    </g>

    <!-- Sub-Block 4: Bus Master Driver -->
    <g transform="translate(14, 418)">
      <rect width="322" height="112" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#1E293B">STS3215 Bus Master (Half-Duplex)</text>
      <text x="12" y="39" class="block-desc">• Owns physical TX/RX GPIO to servo bus</text>
      <text x="12" y="56" class="block-desc">• Transmits a_enf @ 1 Mbps baud rate</text>
      <text x="12" y="73" class="block-desc">• Reads back measured joint angles (±1.5°)</text>
      <text x="12" y="90" class="block-desc">• Returns telemetry to Linux over RPC</text>
    </g>
  </g>

  <!-- ==================== BUS ARROW: MCU -> BODY ==================== -->
  <g transform="translate(775, 470)">
    <path d="M 0 0 L 25 0" fill="none" stroke="#E11D48" stroke-width="3" marker-end="url(#arrow-rose)" />
    <rect x="-12" y="-28" width="50" height="20" rx="4" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
    <text x="13" y="-14" text-anchor="middle" class="wire-label" fill="#BE123C">UART</text>
  </g>

  <!-- ==================== RIGHT DOMAIN: PHYSICAL BODY & POWER ==================== -->
  <g transform="translate(805, 95)">
    <!-- Outer Domain Box -->
    <rect width="345" height="545" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)" />
    <path d="M 0 12 Q 0 0 12 0 L 333 0 Q 345 0 345 12 L 345 46 L 0 46 Z" fill="#ECFDF5" />
    <rect x="14" y="14" width="65" height="18" rx="4" fill="#D1FAE5" />
    <text x="46" y="27" text-anchor="middle" class="badge" fill="#065F46">ACTUATORS</text>
    <text x="88" y="24" class="domain-title" fill="#064E3B">SO-101 Physical Arm</text>
    <text x="88" y="39" class="domain-sub">6-DoF Smart Bus Servos</text>

    <!-- Sub-Block 1: Servo Daisy-Chain -->
    <g transform="translate(14, 58)">
      <rect width="317" height="135" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#064E3B">6x STS3215 Smart Serial Servos</text>
      <text x="12" y="39" class="block-desc">• J1: Base Yaw (ID 1) · J2: Shoulder (ID 2)</text>
      <text x="12" y="56" class="block-desc">• J3: Elbow Pitch (ID 3) · J4: Wrist Pitch (ID 4)</text>
      <text x="12" y="73" class="block-desc">• J5: Wrist Roll (ID 5) · J6: Gripper (ID 6)</text>
      <text x="12" y="90" class="block-desc">• Magnetic encoder readback on each joint</text>
      <rect x="12" y="103" width="293" height="20" rx="4" fill="#ECFDF5" />
      <text x="158" y="117" text-anchor="middle" class="tap-text" fill="#065F46">Tap 4: a_meas (Measured Joint Angles)</text>
    </g>

    <!-- Sub-Block 2: Independent Motor Power Harness -->
    <g transform="translate(14, 203)">
      <rect width="317" height="145" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5" />
      <text x="12" y="20" class="block-title" fill="#92400E">Independent Motor Power Rail</text>
      <text x="12" y="39" class="block-desc">• External 7.4V / 5A Regulated DC Supply</text>
      <text x="12" y="56" class="block-desc">• Series Latching Mushroom E-Stop Switch</text>
      <text x="12" y="73" class="block-desc">• Direct power feed to STS3215 servo rail</text>
      <text x="12" y="90" class="block-desc">• Zero motor current through board headers</text>
      <text x="12" y="107" class="block-desc">• Cutting power drops motor torque in &lt; 5 ms</text>
      <rect x="12" y="118" width="293" height="18" rx="4" fill="#FDE68A" />
      <text x="158" y="131" text-anchor="middle" class="wire-label" fill="#78350F">Common Star Ground with UNO Q</text>
    </g>

    <!-- Sub-Block 3: Mechanical Workspace Clamping -->
    <g transform="translate(14, 358)">
      <rect width="317" height="172" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#1E293B">Bench Rigging &amp; Envelope</text>
      <text x="12" y="39" class="block-desc">• Base clamped rigidly to lab workbench</text>
      <text x="12" y="56" class="block-desc">• Zero base rocking under max payload</text>
      <text x="12" y="73" class="block-desc">• Marked 300 × 200 mm physical reach zone</text>
      <text x="12" y="90" class="block-desc">• Compliant foam block target</text>
      <text x="12" y="107" class="block-desc">• Safe backdrive compliance when unpowered</text>
      <text x="12" y="124" class="block-desc">• Visual marker tag for camera calibration</text>
    </g>
  </g>
</svg>
