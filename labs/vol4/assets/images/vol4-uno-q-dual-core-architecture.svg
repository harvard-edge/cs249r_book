<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 23px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; fill: #475569; font-weight: 500; }
      .domain-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: -0.2px; }
      .domain-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #64748B; font-weight: 600; }
      .block-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .block-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #1E293B; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; }
      .tap-text { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
      .wire-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
    </style>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#7C3AED" />
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#A51C30" />
    </marker>
  </defs>

  <!-- Technical Canvas Background -->
  <rect width="1200" height="680" fill="#FFFFFF" />
  <rect x="1" y="1" width="1198" height="678" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="0" y="0" width="1200" height="6" fill="#7D3C98" />

  <!-- Header -->
  <text x="50" y="46" class="title">ARDUINO UNO Q DUAL-SILICON ARCHITECTURE &amp; SAFETY BOUNDARY</text>
  <text x="50" y="68" class="subtitle">Unified Robot LeRobot API on Linux MPU vs. Deterministic Real-Time Safety Governance on MCU</text>
  <line x1="50" y1="82" x2="1150" y2="82" stroke="#E2E8F0" stroke-width="1" />

  <!-- ==================== LEFT DOMAIN: QUALCOMM LINUX ==================== -->
  <g transform="translate(50, 95)">
    <!-- Outer Domain Box (Sharp Corners) -->
    <rect width="345" height="555" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="345" height="4" fill="#7C3AED" />
    <rect x="0" y="4" width="345" height="44" fill="#FAF5FF" />
    <rect x="12" y="14" width="64" height="18" fill="#7C3AED" />
    <text x="44" y="27" text-anchor="middle" class="badge" fill="#FFFFFF">LINUX MPU</text>
    <text x="84" y="24" class="domain-title" fill="#5B21B6">Qualcomm QRB2210</text>
    <text x="84" y="39" class="domain-sub">Debian Linux · 4GB LPDDR4</text>
    <line x1="0" y1="48" x2="345" y2="48" stroke="#E9D5FF" stroke-width="1" />

    <!-- Sub-Block 1: Camera Ingestion -->
    <g transform="translate(12, 60)">
      <rect width="321" height="92" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#1E293B">UVC Video Stream (/dev/video0)</text>
      <text x="12" y="39" class="block-desc">• 224 × 224 RGB capture @ 30 Hz</text>
      <text x="12" y="56" class="block-desc">• Background V4L2 threaded daemon</text>
      <text x="12" y="73" class="block-desc">• Fixed exposure &amp; gain (anti-hunting)</text>
    </g>

    <!-- Sub-Block 2: HF LeRobot Runtime -->
    <g transform="translate(12, 164)">
      <rect width="321" height="130" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#5B21B6">Hugging Face LeRobot Stack</text>
      <text x="12" y="39" class="block-desc">• Treats SO-101 as unified robot entity</text>
      <text x="12" y="56" class="block-desc">• SmolVLA &amp; ACT Action-Chunking</text>
      <text x="12" y="73" class="block-desc">• ONNX Runtime ARM64 INT8 execution</text>
      <text x="12" y="90" class="block-desc">• Inference latency: &lt; 45 ms per chunk</text>
      <rect x="8" y="100" width="305" height="22" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1" />
      <text x="160" y="115" text-anchor="middle" class="tap-text" fill="#5B21B6">Tap 1: a_req = π_θ(o_t) (Chunk of Actions)</text>
    </g>

    <!-- Sub-Block 3: Motor Bus Adapter -->
    <g transform="translate(12, 306)">
      <rect width="321" height="112" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#1E293B">UnoQMotorsBus Python Adapter</text>
      <text x="12" y="39" class="block-desc">• Custom 60-line LeRobot bus plugin</text>
      <text x="12" y="56" class="block-desc">• Maps action chunks to joint angles</text>
      <text x="12" y="73" class="block-desc">• Binary packet serialization (24 bytes)</text>
      <rect x="8" y="82" width="305" height="22" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1" />
      <text x="160" y="97" text-anchor="middle" class="tap-text" fill="#5B21B6">Tap 2: a_map (Mapped Joint Targets)</text>
    </g>

    <!-- Power Note -->
    <g transform="translate(12, 430)">
      <rect width="321" height="112" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#1E40AF">Logic Power &amp; Logging Continuity</text>
      <text x="12" y="39" class="block-desc">• Powered via 45W USB-PD adapter</text>
      <text x="12" y="56" class="block-desc">• Fully isolated from servo motor power rail</text>
      <text x="12" y="73" class="block-desc">• Continues logging traces during safety stop</text>
      <text x="12" y="90" class="block-desc">• Zero reboot or data corruption on cutoff</text>
    </g>
  </g>

  <!-- ==================== BRIDGE ARROW: LINUX -> MCU ==================== -->
  <g transform="translate(395, 362)">
    <path d="M 0 0 L 25 0" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)" />
    <rect x="-12" y="-28" width="48" height="20" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1" />
    <text x="12" y="-14" text-anchor="middle" class="wire-label" fill="#5B21B6">RPC</text>
  </g>

  <!-- ==================== MIDDLE DOMAIN: STM32 MCU ==================== -->
  <g transform="translate(425, 95)">
    <!-- Outer Domain Box -->
    <rect width="350" height="555" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="4" fill="#A51C30" />
    <rect x="0" y="4" width="350" height="44" fill="#FEF2F2" />
    <rect x="12" y="14" width="64" height="18" fill="#A51C30" />
    <text x="44" y="27" text-anchor="middle" class="badge" fill="#FFFFFF">MCU CORE</text>
    <text x="84" y="24" class="domain-title" fill="#991B1B">STM32U585 Governor</text>
    <text x="84" y="39" class="domain-sub">ARM Cortex-M33 · Deterministic Real-Time</text>
    <line x1="0" y1="48" x2="350" y2="48" stroke="#FECDD3" stroke-width="1" />

    <!-- Sub-Block 1: Inter-Core Bridge -->
    <g transform="translate(12, 60)">
      <rect width="326" height="92" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#991B1B">Inter-Core Bridge Listener</text>
      <text x="12" y="39" class="block-desc">• Receives 24-byte action packet (/dev/ttyRPMSG)</text>
      <text x="12" y="56" class="block-desc">• Round-trip latency: &lt; 5 ms @ 50 Hz</text>
      <text x="12" y="73" class="block-desc">• Checks packet CRC &amp; sequence freshness</text>
    </g>

    <!-- Sub-Block 2: Deterministic Safety Engine -->
    <g transform="translate(12, 164)">
      <rect width="326" height="130" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1.5" />
      <text x="12" y="20" class="block-title" fill="#991B1B">Real-Time Safety Enforcement</text>
      <text x="12" y="39" class="block-desc">• Velocity Saturation: Clamps ω_i ≤ 45°/s</text>
      <text x="12" y="56" class="block-desc">• Forward Kinematics: Computes tool pose (x, y, z)</text>
      <text x="12" y="73" class="block-desc">• Table Geofence: Vetoes any move with z &lt; 15 mm</text>
      <text x="12" y="90" class="block-desc">• Boundary Hysteresis: Prevents limit chatter</text>
      <rect x="8" y="100" width="310" height="22" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" />
      <text x="163" y="115" text-anchor="middle" class="tap-text" fill="#991B1B">Tap 3: a_enf = Clamp(a_map) | VETO</text>
    </g>

    <!-- Sub-Block 3: Hardware Watchdog -->
    <g transform="translate(12, 306)">
      <rect width="326" height="112" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#991B1B">Hardware SysTick Watchdog</text>
      <text x="12" y="39" class="block-desc">• 150 ms timeout without fresh heartbeat</text>
      <text x="12" y="56" class="block-desc">• Linux freeze / crash drops arm into safe hold</text>
      <text x="12" y="73" class="block-desc">• Flushes UART buffer on resume (zero backlog)</text>
    </g>

    <!-- Sub-Block 4: Bus Master Driver -->
    <g transform="translate(12, 430)">
      <rect width="326" height="112" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#1E293B">STS3215 Bus Master (Half-Duplex)</text>
      <text x="12" y="39" class="block-desc">• Owns physical TX/RX GPIO to servo bus</text>
      <text x="12" y="56" class="block-desc">• Transmits a_enf @ 1 Mbps baud rate</text>
      <text x="12" y="73" class="block-desc">• Reads back measured joint angles (±1.5°)</text>
      <text x="12" y="90" class="block-desc">• Returns telemetry to Linux over RPC</text>
    </g>
  </g>

  <!-- ==================== BUS ARROW: MCU -> BODY ==================== -->
  <g transform="translate(775, 480)">
    <path d="M 0 0 L 25 0" fill="none" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-crimson)" />
    <rect x="-12" y="-28" width="50" height="20" fill="#FEF2F2" stroke="#A51C30" stroke-width="1" />
    <text x="13" y="-14" text-anchor="middle" class="wire-label" fill="#991B1B">UART</text>
  </g>

  <!-- ==================== RIGHT DOMAIN: PHYSICAL BODY & POWER ==================== -->
  <g transform="translate(805, 95)">
    <!-- Outer Domain Box -->
    <rect width="345" height="555" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="345" height="4" fill="#047857" />
    <rect x="0" y="4" width="345" height="44" fill="#ECFDF5" />
    <rect x="12" y="14" width="68" height="18" fill="#047857" />
    <text x="46" y="27" text-anchor="middle" class="badge" fill="#FFFFFF">ACTUATORS</text>
    <text x="88" y="24" class="domain-title" fill="#065F46">SO-101 Physical Arm</text>
    <text x="88" y="39" class="domain-sub">6-DoF Smart Bus Servos</text>
    <line x1="0" y1="48" x2="345" y2="48" stroke="#A7F3D0" stroke-width="1" />

    <!-- Sub-Block 1: Servo Daisy-Chain -->
    <g transform="translate(12, 60)">
      <rect width="321" height="135" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#065F46">6× Feetech STS3215 Smart Servos</text>
      <text x="12" y="39" class="block-desc">• J1: Base Yaw (ID 1) · J2: Shoulder (ID 2)</text>
      <text x="12" y="56" class="block-desc">• J3: Elbow Pitch (ID 3) · J4: Wrist Pitch (ID 4)</text>
      <text x="12" y="73" class="block-desc">• J5: Wrist Roll (ID 5) · J6: Gripper (ID 6)</text>
      <text x="12" y="90" class="block-desc">• Magnetic encoder readback on each joint</text>
      <rect x="8" y="102" width="305" height="24" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
      <text x="160" y="118" text-anchor="middle" class="tap-text" fill="#047857">Tap 4: a_meas (Measured Joint Angles)</text>
    </g>

    <!-- Sub-Block 2: Independent Motor Power Harness -->
    <g transform="translate(12, 206)">
      <rect width="321" height="150" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" />
      <text x="12" y="20" class="block-title" fill="#92400E">Independent Motor Power Rail</text>
      <text x="12" y="39" class="block-desc">• External 7.4V / 5A Regulated DC Supply</text>
      <text x="12" y="56" class="block-desc">• Dedicated Switched DC Bench Supply</text>
      <text x="12" y="73" class="block-desc">• Direct power feed to STS3215 servo rail</text>
      <text x="12" y="90" class="block-desc">• Zero motor current through board headers</text>
      <text x="12" y="107" class="block-desc">• Independent rail isolates CPU from motor noise</text>
      <rect x="8" y="118" width="305" height="22" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
      <text x="160" y="133" text-anchor="middle" class="wire-label" fill="#78350F">Common Star Ground with UNO Q</text>
    </g>

    <!-- Sub-Block 3: Mechanical Workspace Clamping -->
    <g transform="translate(12, 368)">
      <rect width="321" height="174" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="20" class="block-title" fill="#1E293B">Bench Rigging &amp; Envelope</text>
      <text x="12" y="39" class="block-desc">• Base clamped rigidly to lab workbench</text>
      <text x="12" y="56" class="block-desc">• Zero base rocking under max payload</text>
      <text x="12" y="73" class="block-desc">• Marked 300 × 200 mm physical reach zone</text>
      <text x="12" y="90" class="block-desc">• Compliant foam block target</text>
      <text x="12" y="107" class="block-desc">• Safe backdrive compliance when unpowered</text>
      <text x="12" y="124" class="block-desc">• Visual marker tag for camera calibration</text>
    </g>
  </g>
</svg>
