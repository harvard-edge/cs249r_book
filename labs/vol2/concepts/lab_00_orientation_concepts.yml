lab_concept_map:
  schema_version: 1
  lab_id: v2_00
  chapter: 0
  title: Choose a fleet project
  source_notebook: labs/vol2/lab_00_orientation.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: orientation design; not deployment validation
  source_chapter_concept_map: null
  chapter_goal: Choose a fleet track and rehearse prediction, immediate feedback, saved comparisons,
    and explicit saving before technical investigations.
  student_goals:
  - Choose or restore a fleet track and distinguish deployed service from model preparation.
  - Predict, change one briefing control, and distinguish live feedback from a captured comparison.
  - Save your progress, download your work, and identify the next investigation.
  - Describe the route from fleet infrastructure through a final project discussion without assuming
    later mechanisms.
  narrative:
    situation: |
      Your team has a working ML service and needs to bring it to more people. Across this volume, you will decide how to prepare its models, share limited infrastructure, keep the service available, and judge whether it should expand. Choose a deployment context. That choice gives the investigations a continuing project, from a fleet of tiny devices with an upstream training service to a cloud recommendation service.

      Each lab advances one decision in that story. Here, learn the rhythm: read the situation, predict what will happen, change one condition, inspect the feedback, and explain the tradeoff. The later labs introduce the technical concepts when you need them.
    previously: Start fresh or return to your saved Volume II progress. No earlier volume is required.
    next: Investigate when work must leave one machine in Lab 01.
    submission: Saved or downloaded work containing the preferred track and a captured interface
      rehearsal; no deployment claim.
