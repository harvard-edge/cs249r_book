lab_concept_map:
  schema_version: 1
  lab_id: v2_04
  chapter: 4
  title: Data Storage
  source_notebook: labs/vol2/lab_04_data_storage.py
  source_chapter_concept_map: books/vol2/04_data_storage/data_storage_concepts.yml
  chapter_goal: Place and package data so the complete input path feeds the fleet and checkpoint publication
    preserves restorable state.
  narrative:
    situation: Your project is ready for a training trial, but the accelerators pause while waiting for
      inputs. Another team proposes more storage bandwidth; an operator worries that checkpoint writes
      will delay the same reads. Follow the complete data path, test whether buffering or packaging addresses
      the delay, and decide when a checkpoint is safe to recover.
    previously: The fabric has a candidate traffic envelope; the input and checkpoint paths remain unqualified.
    next: Choose correct collective operations and price their exposed cost.
    submission: 'One integrated decision memo: saved comparisons, causal explanation, rejected alternative,
      remaining uncertainty, and reversal trigger. A supported hold is valid.'
  core_concepts:
  - id: v2_04_A
    part: A
    title: Input delivery budget
    investigation_title: How many consumers can this path feed?
    source_concepts:
    - chapter: 04_data_storage
      concept: I/O wall
      concept_map: books/vol2/04_data_storage/data_storage_concepts.yml
      source_anchor: sec-storage-pipeline-equation
    - chapter: 04_data_storage
      concept: Input delivery budget
      concept_map: books/vol2/04_data_storage/data_storage_concepts.yml
      source_anchor: sec-storage-pipeline-equation
    learning_claim: More consumers increase aggregate demand until a shared delivery stage stalls compute.
    tradeoff: Fleet compute capacity versus shared input delivery.
    student_action: Increase consumer demand with the path and local batch cadence fixed.
    evidence_to_inspect: Demand, stage service rates, bottleneck, and accelerator utilization boundary.
    explanation_prompt: Which stage becomes binding and why would faster accelerators worsen the mismatch?
    reversal_condition: Reconsider when sample size, local cadence, or stage capacity changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_04_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Evaluate a fleet input path against aggregate consumer demand.
  - id: v2_04_B
    part: B
    title: Miss timing and finite buffering
    investigation_title: Why can high hit rate still leave workers idle?
    source_concepts:
    - chapter: 04_data_storage
      concept: Input delivery budget
      concept_map: books/vol2/04_data_storage/data_storage_concepts.yml
      source_anchor: sec-storage-pipelining
    learning_claim: Equal bytes and equal hit rate can produce different stalls because misses cluster and
      prefetch is finite.
    tradeoff: Buffering capacity versus burst tolerance and input stalls.
    student_action: Change spacing of identical cold misses, then test deeper prefetch separately.
    evidence_to_inspect: Request/miss timeline, finite buffer occupancy, and idle intervals.
    explanation_prompt: Why did average hit rate fail to explain the difference?
    reversal_condition: Reconsider when miss spacing or available buffer memory changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_04_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Explain stalls using request timing and finite buffering.
  - id: v2_04_C
    part: C
    title: Metadata-bound packaging
    investigation_title: Buy bandwidth or change layout?
    source_concepts:
    - chapter: 04_data_storage
      concept: Metadata-bound shard packaging
      concept_map: books/vol2/04_data_storage/data_storage_concepts.yml
      source_anchor: sec-storage-data-formats
    learning_claim: Small objects can be limited by metadata rather than bulk bandwidth.
    tradeoff: Packed-shard efficiency versus packaging granularity and selective access.
    student_action: Compare objects per sample with packed shards; test bandwidth-only remedy.
    evidence_to_inspect: Metadata requests, bytes, service decomposition, and ineffective bandwidth case.
    explanation_prompt: Which component did packaging remove and what access cost is outside this fixture?
    reversal_condition: Reconsider when random access or sample selection makes packing costly.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_04_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Compare bandwidth and packaging remedies for a dataset path.
  - id: v2_04_D
    part: D
    title: Durable publication
    investigation_title: When is a checkpoint recoverable?
    source_concepts:
    - chapter: 04_data_storage
      concept: Checkpoint write path
      concept_map: books/vol2/04_data_storage/data_storage_concepts.yml
      source_anchor: sec-storage-distributed-checkpoint
    - chapter: 04_data_storage
      concept: Versioned artifacts and commit boundaries
      concept_map: books/vol2/04_data_storage/data_storage_concepts.yml
      source_anchor: sec-storage-distributed-checkpoint
    learning_claim: A local write is not a durable, complete checkpoint publication.
    tradeoff: Fast local progress versus durability and complete-version publication.
    student_action: Inject failure at each supplied write/publication stage for the same backend checkpoint.
    evidence_to_inspect: Local/durable states, commit visibility, and restore outcome.
    explanation_prompt: Which boundary establishes recoverability and what disappears with the failed host?
    reversal_condition: Reconsider when the failure domain includes the durable tier.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_04_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Determine recoverability at specified checkpoint publication stages.
  - id: v2_04_E
    part: E
    title: Lifecycle storage cost
    investigation_title: Which placement earns its cost?
    source_concepts:
    - chapter: 04_data_storage
      concept: Total cost of data delivery
      concept_map: books/vol2/04_data_storage/data_storage_concepts.yml
      source_anchor: sec-storage-economics
    - chapter: 04_data_storage
      concept: Scoped storage hierarchy
      concept_map: books/vol2/04_data_storage/data_storage_concepts.yml
      source_anchor: sec-storage-economics
    learning_claim: The cheapest byte tier may incur larger complete-job cost through idle compute and movement.
    tradeoff: Storage price versus delivery, request, movement, retention, and idle-compute costs.
    student_action: Compare complete plans for the same job and common accounting horizon.
    evidence_to_inspect: Cost decomposition, utilization, and tier feasibility.
    explanation_prompt: Which component reverses the raw capacity-price ranking?
    reversal_condition: Reconsider when reuse, retention, or demand changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_04_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Compare storage placements using a complete-job accounting boundary.
