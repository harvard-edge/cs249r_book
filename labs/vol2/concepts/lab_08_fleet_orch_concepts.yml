lab_concept_map:
  schema_version: 1
  lab_id: v2_08
  chapter: 8
  title: Allocate useful fleet progress under competing claims
  source_notebook: labs/vol2/lab_08_fleet_orch.py
  source_chapter_concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
  chapter_goal: Allocate useful fleet progress under competing claims
  status: bounded chapter-primary investigations implemented; production and quality assumptions remain explicit
  narrative:
    situation: An urgent experiment arrives while your project shares the fleet with long training jobs
      and live serving. There are free accelerators, but they may be in the wrong places or too few to
      start a complete job. Decide which work should run, what interruption would cost, and how much
      ready capacity the service needs before calling the allocation fair or efficient.
    previously: The recovery plan prices interruptions; supplied traces replace missing prior records explicitly.
    next: Measure whether these allocations become useful progress rather than busy capacity.
    submission: A scheduling policy defended with feasible starts, complete completion times, interruption
      costs, shares and reserve cost.
  core_concepts:
  - id: v2_08_A
    part: A
    title: Atomic allocation and exclusive ownership
    investigation_title: Why can jobs wait while resources are occupied?
    source_concepts:
    - chapter: 8
      concept: Gang scheduling
      concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
      source_anchor: sec-fleet-orchestration-gang-scheduling
    - chapter: 8
      concept: Feasibility before fairness
      concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
      source_anchor: sec-fleet-orchestration-gang-scheduling
    - chapter: 8
      concept: Scheduler as allocation control plane
      concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
      source_anchor: sec-fleet-orchestration-control-plane
    learning_claim: A complete bundle permits progress, while safe reuse after lost observation separately
      requires a versioned fence; a lease timeout does not stop the old owner.
    tradeoff: Queue-order protection versus progress from feasible later work.
    student_action: Compare gang policies, then vary reconciliation delay in the same lost-observation protocol
      fixture.
    evidence_to_inspect: Complete starts and held-idle slots; admission, placement, lease expiry, fence activation,
      and rejection of a late old-owner write.
    explanation_prompt: Which event admits a bundle and which establishes exclusive effect? What safety and
      availability change when reconciliation is delayed?
    reversal_condition: A fitting replacement is unsafe without fencing; delayed safe activation preserves
      exclusivity while increasing recovery wait.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_08_experiments
      functions:
      - gang_backfill_comparison
      - allocation_reconciliation
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Small deterministic scheduling and separate lost-observation protocol fixtures; assumes
        enforceable monotonically versioned target fencing, not a production control-plane proof.
    student_objective: Diagnose incomplete-gang deadlock, compare feasible starts, and replay lease/fencing
      reconciliation before capacity reuse.
  - id: v2_08_B
    part: B
    title: Topology-aware completion time
    investigation_title: When should a job wait for better placement?
    source_concepts:
    - chapter: 8
      concept: Topology-aware placement
      concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
      source_anchor: sec-fleet-orchestration-topology-aware
    learning_claim: A faster local execution path wins only when its saved communication repays the wait for
      placement.
    tradeoff: Immediate remote start versus delayed compact execution.
    student_action: Vary local-placement wait while holding bytes, iterations, useful compute and link assumptions
      fixed.
    evidence_to_inspect: Wait, communication and complete completion time for both placements; crossover curve.
    explanation_prompt: At which boundary does waiting cease to repay locality?
    reversal_condition: Longer wait, fewer remaining iterations or less traffic can favor immediate placement.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_08_experiments
      functions:
      - topology_wait_comparison
      - topology_wait_curve
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Analytical fixed links and communication volumes, not congestion-sensitive topology search.
    student_objective: Compare complete completion time for waiting locally versus starting remotely.
  - id: v2_08_C
    part: C
    title: Interruption economics and elastic resize contracts
    investigation_title: Who pays for preemption?
    source_concepts:
    - chapter: 8
      concept: Interruption economics
      concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
      source_anchor: sec-fleet-orchestration-preemption-cascades
    - chapter: 8
      concept: Scheduling objectives and matched signals
      concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
      source_anchor: sec-fleet-orchestration-preemption-cascades
    - chapter: 8
      concept: Elastic scheduling contract
      concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
      source_anchor: sec-fleet-orchestration-elastic-scheduler-integration
    learning_claim: Preemption transfers replay cost; elasticity offers a separate alternative only at supported
      increments, with transition cost repaid by enough remaining work under an unchanged target criterion.
    tradeoff: Urgent wait reduction versus lost progress, restart and displaced completion.
    student_action: Replay preemption, then vary elastic size, transition delay, remaining target work, and
      validation of the common target.
    evidence_to_inspect: Job waits, finishes and lost work; supported size/rate curve, transition phases, fixed-target
      times and amortization boundary; invalid-contract rejection.
    explanation_prompt: When does a supported resize repay its transition, and why is an unvalidated target
      comparison unavailable rather than merely slow?
    reversal_condition: Short remaining runs favor keeping size; invalid increments or absent common-target
      validation reject the resize.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_08_experiments
      functions:
      - preemption_comparison
      - elastic_resize
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Bounded preemption and separate synthetic retained-work scaling fixture. No learned convergence
        model; equal target quality must be externally validated. No cascade simulation.
    student_objective: Price preemption, then test supported elastic sizes against transition amortization
      and the same validated target.
  - id: v2_08_D
    part: D
    title: Feasible fairness and named utilization tiers
    investigation_title: Is equal accelerator allocation fair?
    source_concepts:
    - chapter: 8
      concept: Feasibility before fairness
      concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
      source_anchor: sec-fleet-orchestration-drf-worked-allocation
    - chapter: 8
      concept: Utilization tiers
      concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
      source_anchor: sec-fleet-orchestration-resource-accounting
    learning_claim: Fair allocations are feasible bundles; separate runtime counters distinguish held incomplete
      groups from complete allocations, activity, and retained work normalized to a fault-free baseline.
    tradeoff: Balanced dominant shares versus indivisibility and stranded capacity.
    student_action: Compare fair-share policies, then vary discarded steps in an independent fixed-allocation,
      fixed-activity record.
    evidence_to_inspect: Dominant shares and feasible bundles; complete/incomplete held slots, allocated/active/productive
      slot-minutes, retained steps, baseline rate and explicit denominators.
    explanation_prompt: Why can activity remain unchanged while productive utilization falls, and why are incomplete
      held groups excluded from allocation?
    reversal_condition: More replay lowers productive capacity with unchanged activity; a different denominator
      changes the percentage and must be named.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_08_experiments
      functions:
      - fairness_comparison
      - utilization_trace
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Declared multi-resource fairness plus an independent supplied runtime accounting record.
        Synthetic activity/step logs demonstrate counter semantics, not a production root-cause diagnosis.
    student_objective: Compare dominant shares, then separate complete allocation, hardware activity, and retained
      progress in a supplied runtime trace.
  - id: v2_08_E
    part: E
    title: Ready serving reserve
    investigation_title: How much serving capacity should stay ready?
    source_concepts:
    - chapter: 8
      concept: Scheduling objectives and matched signals
      concept_map: books/vol2/08_fleet_orchestration/fleet_orchestration_concepts.yml
      source_anchor: sec-fleet-orchestration-serving
    learning_claim: Warm reserve reduces shortage during readiness delay by consuming paid idle capacity.
    tradeoff: Serving headroom versus charged ready and loading capacity.
    student_action: Replay identical demand while varying ready reserve and holding startup delay/capacity
      fixed.
    evidence_to_inspect: Demand and ready timeline, missed requests, loading delay and charged replica-minutes/cost.
    explanation_prompt: How much unmet demand does the reserve remove, and what does that protection cost?
    reversal_condition: A flatter demand ramp or shorter startup can make idle reserve unnecessary.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_08_experiments
      functions:
      - warm_capacity_comparison
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Chapter secondary Serving envelope and accelerator sharing; does not teach later phase-aware
        inference autoscaling mechanics.
    student_objective: Defend a ready reserve against missed demand and charged capacity.
