lab_concept_map:
  schema_version: 1
  lab_id: v2_05
  chapter: 5
  title: Collective Communication
  source_notebook: labs/vol2/lab_05_collective_communication.py
  source_chapter_concept_map: books/vol2/05_collective_communication/collective_communication_concepts.yml
  chapter_goal: Choose a semantically correct collective and compare its topology, overlap, and compression
    costs at a fixed useful-work target.
  narrative:
    situation: The training trial can now receive its inputs. Its workers still wait for each other when
      they exchange updates. Your team must choose a communication schedule that delivers the required
      result without spending the saved compute time on transfers. Compare small and large exchanges,
      shared paths, overlap, and compression while keeping the correctness and quality obligations visible.
    previously: Input delivery and checkpoint publication have scoped evidence; communicating participants
      still require correct exchanges.
    next: Map a complete distributed training plan onto memory, fabric, and convergence constraints.
    submission: 'One integrated decision memo: saved comparisons, causal explanation, rejected alternative,
      remaining uncertainty, and reversal trigger. A supported hold is valid.'
  core_concepts:
  - id: v2_05_A
    part: A
    title: Collective algorithm crossover
    investigation_title: When does ring versus tree reverse?
    source_concepts:
    - chapter: 05_collective_communication
      concept: Collective cost by rounds and chunks
      concept_map: books/vol2/05_collective_communication/collective_communication_concepts.yml
      source_anchor: sec-communication-collective-operations-collective-operations-network-performance-modeling-0d8e
    - chapter: 05_collective_communication
      concept: Ring AllReduce and the bandwidth bound
      concept_map: books/vol2/05_collective_communication/collective_communication_concepts.yml
      source_anchor: sec-communication-bandwidth-lower-bound
    - chapter: 05_collective_communication
      concept: Ring-tree crossover
      concept_map: books/vol2/05_collective_communication/collective_communication_concepts.yml
      source_anchor: sec-communication-collective-operations-algorithm-crossover
    learning_claim: Algorithm preference follows startup rounds and transferred chunks, not one universal
      winner.
    tradeoff: Fewer startup rounds versus bandwidth-efficient transfer.
    student_action: Compare ring and tree for one process group; cross the supplied payload regimes.
    evidence_to_inspect: Startup and transfer bars, payload, and crossover.
    explanation_prompt: Explain the preference reversal using rounds and bytes.
    reversal_condition: Reconsider when participant count or transport latency changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_06_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Compare collective algorithms across message-size regimes.
  - id: v2_05_B
    part: B
    title: Operation contracts and routed bounds
    investigation_title: Reduce values or route records?
    source_concepts:
    - chapter: 05_collective_communication
      concept: Collective contracts
      concept_map: books/vol2/05_collective_communication/collective_communication_concepts.yml
      source_anchor: sec-communication-collective-operations-collective-operations-collective-operation-vocabulary-fdc7
    - chapter: 05_collective_communication
      concept: AllToAll active bound
      concept_map: books/vol2/05_collective_communication/collective_communication_concepts.yml
      source_anchor: sec-communication-alltoall
    learning_claim: An aggregate cannot substitute for destination-specific records; routed exchanges have
      injection, receiver, and cut bounds.
    tradeoff: Required output semantics versus skew and capacity pressure.
    student_action: Hold per-participant payload fixed; change destination skew and oversubscription.
    evidence_to_inspect: Output contracts and active routed-exchange bound.
    explanation_prompt: Why is a faster reduction semantically invalid for this routed task?
    reversal_condition: Reconsider when destination distribution changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_06_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Match operation semantics and diagnose a routed exchange bound.
  - id: v2_05_C
    part: C
    title: Topology-aware hierarchy
    investigation_title: When does topology change the schedule?
    source_concepts:
    - chapter: 05_collective_communication
      concept: Hierarchical collectives
      concept_map: books/vol2/05_collective_communication/collective_communication_concepts.yml
      source_anchor: sec-communication-collective-operations-collective-operations-hierarchical-allreduce-1338
    learning_claim: Hierarchical reduction must price each phase and be checked against a matched calibration
      fixture.
    tradeoff: Local aggregation savings versus extra phases and actual placement.
    student_action: Compare flat and hierarchical paths with matched groups and topology.
    evidence_to_inspect: Three-phase analytical cost alongside labeled illustrative calibration.
    explanation_prompt: Why could the calibrated ranking differ and what measurement is still needed?
    reversal_condition: Reconsider when group size, placement, or matched measurements change.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_06_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Evaluate a hierarchical schedule against a matched calibration case.
  - id: v2_05_D
    part: D
    title: Exposed overlap
    investigation_title: How much communication can the schedule hide?
    source_concepts:
    - chapter: 05_collective_communication
      concept: Exposed communication under overlap
      concept_map: books/vol2/05_collective_communication/collective_communication_concepts.yml
      source_anchor: sec-communication-overlap
    learning_claim: Communication can overlap only after its data is ready and the network is free.
    tradeoff: Earlier launches versus repeated startup and serialized network service.
    student_action: Change bucket policy and algorithm while keeping the supplied readiness trace.
    evidence_to_inspect: Bucket-ready/start/finish timeline, hidden portion, and final exposed tail.
    explanation_prompt: Which dependency or resource boundary limited overlap?
    reversal_condition: Reconsider when the readiness trace or network service changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_06_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Explain exposed communication using readiness and resource timelines.
  - id: v2_05_E
    part: E
    title: Compression and quality
    investigation_title: When is sending fewer bytes worthwhile?
    source_concepts:
    - chapter: 05_collective_communication
      concept: Gradient compression with error feedback
      concept_map: books/vol2/05_collective_communication/collective_communication_concepts.yml
      source_anchor: sec-communication-collective-operations-compression-tradeoffs
    learning_claim: Error feedback retains omitted updates across steps; byte savings matter only after codec overhead and evidence of reaching the quality target.
    tradeoff: Reduced communication versus codec compute and possible convergence cost.
    student_action: Evolve the chapter rounding trace with and without carried state, discard the residual, then compare a codec with an uncompressed baseline on a separate supplied outcome fixture.
    evidence_to_inspect: Per-step true, transmitted, retained and discarded gradient totals; codec and communication time, steps to target, and target failure.
    explanation_prompt: Explain what is lost when residual state is reset, then separate information conservation from evidence for faster time to a quality target.
    reversal_condition: Reconsider when bandwidth, codec overhead, or matched quality evidence changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_06_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. The exact scalar rounding trace evolves residual state and accounts for discarded information;
        it does not prove model convergence or validate the separate supplied codec-quality fixtures.
    student_objective: Evaluate compression using both execution and quality evidence.
