lab_concept_map:
  schema_version: 1
  lab_id: v2_03
  chapter: 3
  title: Network Fabrics
  source_notebook: labs/vol2/lab_03_communication.py
  source_chapter_concept_map: books/vol2/03_network_fabrics/network_fabrics_concepts.yml
  chapter_goal: Choose a fleet fabric by matching message size, shared cuts, isolation, and failure evidence
    to the traffic contract.
  narrative:
    situation: Your project has candidate machines, and the infrastructure team is choosing how to connect
      them. The proposed network looks fast between a pair of machines. During a coordinated job, however,
      many transfers will arrive together and share paths. Explore which traffic pattern exposes the
      bottleneck and what another link or a different topology would actually improve.
    previously: A candidate accelerator–node–rack envelope exists; its links do not yet establish fleet-wide
      fabric performance.
    next: Check whether storage can feed the fleet and preserve recoverable progress.
    submission: 'One integrated decision memo: saved comparisons, causal explanation, rejected alternative,
      remaining uncertainty, and reversal trigger. A supported hold is valid.'
  core_concepts:
  - id: v2_03_A
    part: A
    title: Startup and transfer
    investigation_title: When does bandwidth beat lower startup latency?
    source_concepts:
    - chapter: 03_network_fabrics
      concept: Alpha-beta model
      concept_map: books/vol2/03_network_fabrics/network_fabrics_concepts.yml
      source_anchor: sec-network-fabrics-performance-model
    learning_claim: The dominant transfer term changes with payload size.
    tradeoff: Lower startup latency versus higher sustained bandwidth.
    student_action: Compare paths at a fixed payload, then test the opposite message-size regime.
    evidence_to_inspect: Startup/transfer decomposition and crossover.
    explanation_prompt: What changed at crossover and which path improvement would be ineffective?
    reversal_condition: Reconsider when message size or frequency changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_03_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Compare startup and transfer contributions across payload regimes.
  - id: v2_03_B
    part: B
    title: Topology and traffic
    investigation_title: Why do identical links perform differently?
    source_concepts:
    - chapter: 03_network_fabrics
      concept: Bisection bandwidth and topology economics
      concept_map: books/vol2/03_network_fabrics/network_fabrics_concepts.yml
      source_anchor: sec-network-fabrics-topology
    - chapter: 03_network_fabrics
      concept: Traffic-matched topology
      concept_map: books/vol2/03_network_fabrics/network_fabrics_concepts.yml
      source_anchor: sec-network-fabrics-topology
    learning_claim: Link speed alone does not establish simultaneous fleet communication capacity.
    tradeoff: Topology resources and routing lanes versus shared-cut contention and cost.
    student_action: Keep link, participant count, payload, and traffic fixed while changing structure.
    evidence_to_inspect: Injection, receiver, and bisection bounds with resource counts.
    explanation_prompt: Which shared bound explains the difference despite identical links?
    reversal_condition: Reconsider under a different traffic pattern or placement.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_03_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Explain a topology comparison using physical shared-capacity bounds.
  - id: v2_03_C
    part: C
    title: Contention isolation
    investigation_title: When does sharing become unacceptable?
    source_concepts:
    - chapter: 03_network_fabrics
      concept: Fabric behavior under load
      concept_map: books/vol2/03_network_fabrics/network_fabrics_concepts.yml
      source_anchor: sec-network-fabrics-qos
    learning_claim: Protecting foreground traffic consumes physical capacity otherwise available to background
      work.
    tradeoff: Tail protection versus background throughput.
    student_action: Reserve lane capacity under the same foreground burst and background demand.
    evidence_to_inspect: Foreground tail, background capacity sacrificed, and stated queue assumptions.
    explanation_prompt: Why is isolation a redistribution rather than free bandwidth?
    reversal_condition: Reconsider when burst size or priority contract changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_03_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Evaluate foreground and background consequences of traffic isolation.
  - id: v2_03_D
    part: D
    title: Diagnosis and reliable delivery
    investigation_title: Which counterfactual restores bounded delivery?
    source_concepts:
    - chapter: 03_network_fabrics
      concept: Silent fabric waste
      concept_map: books/vol2/03_network_fabrics/network_fabrics_concepts.yml
      source_anchor: sec-network-fabrics-debug-workflow
    - chapter: 03_network_fabrics
      concept: RDMA reliable-delivery contract
      concept_map: books/vol2/03_network_fabrics/network_fabrics_concepts.yml
      source_anchor: sec-network-fabrics-losslessness
    - chapter: 03_network_fabrics
      concept: Lossless fabric hazards
      concept_map: books/vol2/03_network_fabrics/network_fabrics_concepts.yml
      source_anchor: sec-network-pfc-hazards
    learning_claim: A targeted counterfactual separates capacity faults from reliable-delivery failures; avoiding
      drops does not establish bounded completion.
    tradeoff: Diagnostic specificity and pause-based loss avoidance versus recovery tails, victim blocking,
      and endpoint retention.
    student_action: Test a fault remedy, then compare PFC, watchdog/Go-Back-N, and selective recovery for a
      supplied occupied cycle or draining chain. Change detection delay and isolate the victim.
    evidence_to_inspect: Fault counters plus finite transfer completion or explicit stall, pause dependency,
      dropped packets, retransmitted bytes, and recovery trace.
    explanation_prompt: Which counter supports the diagnosis? Why can a zero-drop path stall, and what cost
      restores completion? Explain a victim-isolation or draining-chain reversal.
    reversal_condition: Reconsider when occupied dependencies drain, the watchdog or loss-detection delay changes,
      or the victim has an independent priority/egress.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_03_experiments
      status: implemented bounded finite-flow diagnosis and reference-backend delivery/recovery fixture
      limitations: Illustrative serial recovery bound for one supplied event, not packet-level NIC simulation,
        automatic deadlock detection, risk probabilities, or production qualification. Compact tracks inspect
        the same backend reference; endpoints do not pretend to run RDMA.
    student_objective: Diagnose fabric faults and distinguish loss avoidance from bounded reliable completion.
  - id: v2_03_E
    part: E
    title: Traffic-matched design
    investigation_title: Which fabric plan survives a new mix?
    source_concepts:
    - chapter: 03_network_fabrics
      concept: Traffic-matched topology
      concept_map: books/vol2/03_network_fabrics/network_fabrics_concepts.yml
      source_anchor: sec-network-fabrics-cluster
    - chapter: 03_network_fabrics
      concept: ML traffic inversion
      concept_map: books/vol2/03_network_fabrics/network_fabrics_concepts.yml
      source_anchor: sec-network-fabrics-cluster
    learning_claim: A topology decision depends on traffic mix, capital bounds, and dependency-ready overlap.
    tradeoff: Fabric cost and structural capacity versus exposed communication.
    student_action: Compare plans under the same capital cap, then change traffic mix and bounded overlap.
    evidence_to_inspect: Plan feasibility, bottleneck, cost, and exposed time.
    explanation_prompt: Defend the plan with a rejected alternative and state a mix that reverses it.
    reversal_condition: Reconsider when traffic or the ready-compute window changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_03_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Defend a fabric plan against changed traffic and budget constraints.
