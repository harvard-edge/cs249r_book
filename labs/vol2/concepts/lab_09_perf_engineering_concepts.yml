lab_concept_map:
  schema_version: 1
  lab_id: v2_09
  chapter: 9
  title: Recover useful progress from a busy fleet
  source_notebook: labs/vol2/lab_09_perf_engineering.py
  source_chapter_concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
  chapter_goal: Recover useful progress from a busy fleet
  status: chapter-aligned goodput investigations implemented; native flow verified; browser packaging verification
    remains separate
  narrative:
    situation: The project dashboard says the fleet is busy, yet completed training progress and useful
      responses fall below expectations. The team has budget for one improvement. Separate time spent
      holding resources, waiting at runtime, and executing the program, then test whether the proposed
      fix removes the measured loss or moves it elsewhere.
    previously: Use compatible scheduler and recovery observations when present; this lab supplies an illustrative
      starting case when earlier results are unavailable.
    next: Test service capacity against real arrival timing, state admission and deadlines.
    submission: A recommendation supported by saved comparisons that explain where useful capacity is lost,
      a rejected alternative, the example's limits, and a condition that would change the decision.
  core_concepts:
  - id: v2_09_A
    part: A
    title: Nested useful-capacity boundaries
    investigation_title: Where does offered fleet capacity go?
    student_objective: Partition a fixed offered-capacity window into scheduling, runtime, program and useful
      shares.
    source_concepts:
    - chapter: 9
      concept: ML goodput
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-goodput-factors
    - chapter: 9
      concept: Scheduling goodput
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-goodput-factors
    - chapter: 9
      concept: Runtime goodput
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-goodput-factors
    learning_claim: The factors telescope only when each denominator is the preceding boundary numerator; lost
      capacity is charged exactly once.
    tradeoff: Complete allocations, retained execution and ideal-rate work compete with different disjoint
      losses.
    student_action: Vary declared allocation/startup/discarded intervals under a fixed offered window and inspect
      the four boundaries.
    evidence_to_inspect: Offered, all-allocated, retained productive and ideal capacity-time; factor product
      and disjoint shares.
    explanation_prompt: Which boundary loses this interval, and why is it incorrect to subtract all raw percentage
      losses from offered capacity?
    reversal_condition: An interval crossing or changing accounting boundaries requires a new compatible measurement
      contract.
    scope: chapter-owned core investigation
    implementation:
      engine: mlsysim.labs.experiments.v2_09_experiments
      functions:
      - goodput_study
      status: implemented bounded analytical or deterministic fixture; native interaction flow verified
      limitations: Synthetic explicit event ledger, not measured scheduler or failure rates.
  - id: v2_09_B
    part: B
    title: Reproducible fleet measurement
    investigation_title: Are these two results comparable?
    student_objective: Evaluate whether two goodput records share a valid artifact, window, population and
      hardware-ideal contract.
    source_concepts:
    - chapter: 9
      concept: Reproducible measurement contract
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-measurement-contract
    - chapter: 9
      concept: Fleet profiling by hierarchy and sampling
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-measurement-contract
    learning_claim: A better reported ratio does not establish an improvement if its offered window, sampling
      population or ideal changed. Fleet averaging can conceal a rank anomaly; temporal and population sampling
      omissions require distinct remedies.
    tradeoff: Lower collection/trace volume versus representative coverage and attribution.
    student_action: Inspect a matched record, then change one declared contract field and ask which comparisons
      remain valid. Predict detection, select fleet-average, healthy-rank, suspect-rank or all-rank profiling,
      and vary cadence on the explicit rank/time event ledger.
    evidence_to_inspect: Exact artifact, workload, population, format, hardware ideal, offered window, warmup,
      sampling and quality evidence fields; mismatch reasons. Detected and missed fixture events, dilution
      versus no temporal overlap versus wrong-rank omission, record count and declared collector cost.
    explanation_prompt: What must remain comparable, and what evidence would a busy-only sample omit?
    reversal_condition: Restoring the same complete sampling window and matched artifact can make a comparison
      valid again.
    scope: chapter-owned core investigation
    implementation:
      engine: mlsysim.labs.experiments.v2_09_experiments
      functions:
      - goodput_comparison_issues
      - sample_fleet_profile
      status: implemented bounded analytical or deterministic fixture; native interaction flow verified
      limitations: Deterministic synthetic eight-rank event fixture with explicit event intervals, fixed sample
        phase and threshold. Collector time is illustrative and not injected workload slowdown; no empirical
        overhead, statistical confidence, production diagnosis or continuous profiler is claimed.
  - id: v2_09_C
    part: C
    title: Term-matched program profiling
    investigation_title: Which path term should the next change attack?
    student_objective: Localize a program bottleneck and compare one intervention on the same useful work and
      format.
    source_concepts:
    - chapter: 9
      concept: Program goodput
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-profiling
    learning_claim: A program intervention matters only through the exposed complete path, with shared traffic
      and workspace recomputed.
    tradeoff: Compute/movement/dispatch savings versus state, workspace and a named ideal.
    student_action: Inspect phase paths and compare supported fusion at fixed batch and precision; use optional
      original optimization studies for deeper diagnosis.
    evidence_to_inspect: Phase compute, movement and launches, complete latency, required memory and program
      factor.
    explanation_prompt: Which term moves, which remains fixed, and why is isolated speedup insufficient?
    reversal_condition: A changed dominant term or workspace feasibility can erase the improvement.
    scope: chapter-owned core investigation
    implementation:
      engine: mlsysim.labs.experiments.v2_09_experiments
      functions:
      - evaluate
      - compare_configs
      - goodput_study
      status: implemented bounded analytical or deterministic fixture; native interaction flow verified
      limitations: Registry-backed analytical paths with supplied outcome evidence; not measured kernel traces
        or production percentiles.
  - id: v2_09_D
    part: D
    title: Runtime cost of a program gain
    investigation_title: Does the faster path repay its runtime cost?
    student_objective: Compare a program-rate gain with initialization cost over the same offered observation
      window.
    source_concepts:
    - chapter: 9
      concept: Runtime goodput
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-frontier-objective
    - chapter: 9
      concept: Program goodput
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-frontier-objective
    - chapter: 9
      concept: Trading between goodput factors
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-frontier-objective
    learning_claim: A higher program factor can yield less ideal-rate useful work when startup consumes more
      of the same held window.
    tradeoff: One-time held initialization versus repeated retained-path savings.
    student_action: For Cloud, vary the offered horizon with JIT enabled; for device tracks, report separate
      build-host AOT and vary explicitly declared endpoint startup cost.
    evidence_to_inspect: Program/runtime factors, compile or build-host setup separately, retained runs, total
      goodput and no-retained-work failure.
    explanation_prompt: Which system pays setup, and when do program savings outweigh the held-runtime loss?
    reversal_condition: A longer matching observation window or different startup burden can reverse the choice.
    scope: chapter-owned core investigation
    implementation:
      engine: mlsysim.labs.experiments.v2_09_experiments
      functions:
      - goodput_study
      - compare_goodput_study
      status: implemented bounded analytical or deterministic fixture; native interaction flow verified
      limitations: Cloud JIT is held runtime; device AOT is outside endpoint accounting. No endpoint compile
        or measured deployment delay is invented.
  - id: v2_09_E
    part: E
    title: Joint fleet-efficiency decision
    investigation_title: Which complete policy produces useful progress?
    student_objective: Defend a combined change using the total product, compatible evidence and a rejected
      alternative.
    source_concepts:
    - chapter: 9
      concept: ML goodput
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-frontier-objective
    - chapter: 9
      concept: Trading between goodput factors
      concept_map: books/vol2/09_performance_engineering/performance_engineering_concepts.yml
      source_anchor: sec-performance-engineering-frontier-objective
    learning_claim: Choosing the largest isolated factor is insufficient when a policy shifts more than one
      nested boundary.
    tradeoff: Program gain versus allocation wait, startup and discarded work over the same fixed window.
    student_action: Compare a combined policy with baseline and at least one rejected supported alternative;
      save the exact controls and result.
    evidence_to_inspect: All factors, disjoint loss waterfall, total ideal/offered share, retained work and
      contract comparability.
    explanation_prompt: Which complete policy wins under the stated contract, what did it sacrifice, and what
      would reverse the decision?
    reversal_condition: A different workload, allowed window, measured loss pattern or quality evidence requires
      reevaluation rather than transferring the ratio blindly.
    scope: chapter-owned core investigation
    implementation:
      engine: mlsysim.labs.experiments.v2_09_experiments
      functions:
      - compare_goodput_study
      status: implemented bounded analytical or deterministic fixture; native interaction flow verified
      limitations: Synthetic timing ledger establishes accounting and conditional choices, not optimum policy
        for an actual fleet.
