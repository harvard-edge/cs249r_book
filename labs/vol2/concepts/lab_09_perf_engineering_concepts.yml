  - Partition a fixed offered-capacity window into scheduling, runtime, program and useful shares.
  - Evaluate whether two goodput records share a valid artifact, window, population and hardware-ideal contract.
  - Localize a program bottleneck and compare one intervention on the same useful work and format.
  - Compare a program-rate gain with initialization cost over the same offered observation window.
  - Defend a combined change using the total product, compatible evidence and a rejected alternative.
