lab_concept_map:
  student_goals:
  - Compare conditional subgroup metrics and defend a criterion at fixed scores and labels.
  - Compare safeguard capacity and trace how exposure selection and review order change the evidence available
    to oversight.
  - Distinguish deterministic observation gaps from sampling uncertainty, and expose a disparity hidden by
    a coarse audit.
  - Compare retained evidence obligations, then test log deletion against retraining and rebuilding a shard
    in an additive toy model.
  - Separate mechanical requirement checks from a justified decision with accountable authority.
  runtime_parts:
  - part: A
    title: Which fairness claim does the evidence support?
    question: Which fairness claim does the evidence support?
    goal: Compare conditional subgroup metrics and defend a criterion at fixed scores and labels.
    concept_ids:
    - v2_16_A
    coverage: implemented_scoped_fixture
    limitation: Finite scored fixture; no universal impossibility proof or causal attribution.
    next: 'Continue to Part B: Can the fleet serve explanations and review?'
  - part: B
    title: Can the fleet serve explanations and review?
    question: Can the fleet serve explanations and review?
    goal: Compare safeguard capacity and trace how exposure selection and review order change the evidence
      available to oversight.
    concept_ids:
    - v2_16_B
    coverage: implemented_scoped_fixture
    limitation: Queue budgets and finite supplied cases; no empirical model of fatigue, automation bias, review
      effectiveness, or population behavior.
    next: 'Continue to Part C: What can delayed labels and sampling establish?'
  - part: C
    title: What can delayed labels and sampling establish?
    question: What can delayed labels and sampling establish?
    goal: Distinguish deterministic observation gaps from sampling uncertainty, and expose a disparity hidden
      by a coarse audit.
    concept_ids:
    - v2_16_C
    coverage: implemented_scoped_fixture
    limitation: Separate hypothetical independent count dossiers; conservative simultaneous bounds require
      representative independent Bernoulli trials within cells, not deterministic delayed-label samples. No
      causal attribution or adaptive repeated-testing guarantee.
    next: 'Continue to Part D: Which evidence profile meets the data obligation?'
  - part: D
    title: Which evidence profile meets the data obligation?
    question: Which evidence profile meets the data obligation?
    goal: Compare retained evidence obligations, then test log deletion against retraining and rebuilding a
      shard in an additive toy model.
    concept_ids:
    - v2_16_D
    coverage: implemented_scoped_fixture
    limitation: Exact removal comparison only for an additive toy trained state. Record-processing work is
      not deep-model training cost; real unlearning, artifact invalidation and deletion verification remain
      obligations.
    next: 'Continue to Part E: What decision follows from the evidence?'
  - part: E
    title: What decision follows from the evidence?
    question: What decision follows from the evidence?
    goal: Separate mechanical requirement checks from a justified decision with accountable authority.
    concept_ids:
    - v2_16_E
    coverage: implemented_scoped_fixture
    limitation: Recording an owner does not confer actual authority; policy choice cannot alter metrics or
      certify compliance.
    next: Carry this accountable decision and its open obligations into a cross-layer fleet synthesis; do not
      convert a policy label into physical feasibility.
  schema_version: 1
  lab_id: v2_16
  chapter: 16
  title: Responsible AI
  source_notebook: labs/vol2/lab_16_responsible_ai.py
  source_chapter_concept_map: books/vol2/16_responsible_ai/responsible_ai_concepts.yml
  chapter_goal: Make an accountable release decision from distinct fairness, observation, capacity, and data-governance
    evidence.
  narrative:
    situation: Your project is approaching a release decision. Aggregate performance looks acceptable,
      but affected users need a way to challenge outcomes and the review team has limited capacity. Compare
      subgroup evidence, explanations, monitoring, and data obligations before recommending release,
      a restricted trial, or a hold. State who can act when the evidence changes.
    previously: Security, robustness, and sustainability supplied bounded technical evidence. None alone established
      justified deployment.
    next: Carry this accountable decision and its open obligations into a cross-layer fleet synthesis; do not
      convert a policy label into physical feasibility.
    submission: One assurance-oriented release record naming criterion, evidence limits, capacity, owner, remedy,
      alternative, and invalidation trigger.
  core_concepts:
  - id: v2_16_A
    part: A
    title: Fairness criteria conflict
    investigation_title: Which fairness claim does the evidence support?
    objective: Compare conditional subgroup metrics and defend a criterion at fixed scores and labels.
    source_concepts:
    - chapter: 16
      concept: Fairness criteria conflict
      concept_map: books/vol2/16_responsible_ai/responsible_ai_concepts.yml
      source_anchor: sec-responsible-ai-fairness-machine-learning-2ba4
      role: primary
    learning_claim: Choosing a criterion changes the judgment; changing a threshold changes outcomes and competing
      error rates.
    tradeoff: Choosing a criterion changes the judgment; changing a threshold changes outcomes and competing
      error rates.
    student_action: Select and justify a criterion, then compare thresholds and inspect subgroup confusion
      counts.
    evidence_to_inspect: Selection, TPR, FPR, PPV, denominators, chosen gap, and false negatives.
    explanation_prompt: Which stakeholder obligation motivates the criterion, and which competing criterion
      or error cost remains?
    reversal_condition: Change affected population or intended use and reconsider the criterion before retuning.
    scope: Normative criteria over deterministic scored fixtures; no universal fairness score.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_16_experiments: assess_fairness'
      status: implemented_scoped_fixture
      limitations: Finite scored fixture; no universal impossibility proof or causal attribution.
  - id: v2_16_B
    part: B
    title: Safeguards as capacity
    investigation_title: Can the fleet serve explanations and review?
    objective: Compare safeguard capacity and trace how exposure selection and review order change the evidence
      available to oversight.
    source_concepts:
    - chapter: 16
      concept: Safeguards as capacity
      concept_map: books/vol2/16_responsible_ai/responsible_ai_concepts.yml
      source_anchor: sec-responsible-ai-computational-overhead-responsible-ai-techniques-79c2
      role: primary
    - chapter: 16
      concept: Sociotechnical feedback and designed oversight
      concept_map: books/vol2/16_responsible_ai/responsible_ai_concepts.yml
      source_anchor: sec-responsible-ai-humanai-collaboration-205f
      role: primary
    learning_claim: Coverage consumes capacity; deployed selection shapes future labels, and review ordering
      changes which supplied issues receive attention.
    tradeoff: Coverage consumes capacity; deployed selection shapes future labels, and review ordering changes
      which supplied issues receive attention.
    student_action: Change explanation/review coverage, reserve independent checks in the finite exposure loop,
      and compare review order at a fixed alert budget.
    evidence_to_inspect: Queue arrivals/capacity/backlog, each exposure round and cumulative labels, corroborating
      signals, reviewed alerts and missed actual issues.
    explanation_prompt: Which group is denied new evidence by winner-only deployment, and why does allocating
      a reviewer fail to guarantee that an actionable alert is reviewed?
    reversal_condition: Increase arrivals or review duration and repeat before retaining the coverage policy.
    scope: Service queues plus separate finite potential-outcome and supplied-alert traces; no invented psychological
      response law.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_16_experiments: evaluate_capacity'
      status: implemented_scoped_fixture
      limitations: Queue budgets and finite supplied cases; no empirical model of fatigue, automation bias,
        review effectiveness, or population behavior.
  - id: v2_16_C
    part: C
    title: Fleet fairness monitoring
    investigation_title: What can delayed labels and sampling establish?
    objective: Distinguish deterministic observation gaps from sampling uncertainty, and expose a disparity
      hidden by a coarse audit.
    source_concepts:
    - chapter: 16
      concept: Fleet fairness monitoring
      concept_map: books/vol2/16_responsible_ai/responsible_ai_concepts.yml
      source_anchor: sec-responsible-ai-bias-risk-detection-methods-71f8
      role: primary
    - chapter: 16
      concept: Disparity measurement uncertainty
      concept_map: books/vol2/16_responsible_ai/responsible_ai_concepts.yml
      source_anchor: sec-responsible-ai-measuring-disparity
      role: primary
    learning_claim: Observation gaps and sampling uncertainty are distinct. Larger independent audits narrow
      bounds; coarse parity can conceal an intersectional disparity.
    tradeoff: Observation gaps and sampling uncertainty are distinct. Larger independent audits narrow bounds;
      coarse parity can conceal an intersectional disparity.
    student_action: Change label delay/sampling for fixed cases, then independently compare pilot/expanded
      audit counts, coarse/intersectional slices, and simultaneous confidence.
    evidence_to_inspect: Eligible/sample cases and fixture gap; explicit success/trial denominators, per-cell
      intervals, absolute-gap bounds and stated sampling assumptions.
    explanation_prompt: When does a gap bound exclude zero, what sampling assumptions make that meaningful,
      and how can coarse parity hide a contextual gap?
    reversal_condition: Delay labels for a vulnerable group or reduce its coverage and revisit the release
      claim.
    scope: Deterministic label-observation experiment plus a clearly separate hypothetical independent count
      audit; no real-population or causal fairness claim.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_16_experiments: audit_evidence'
      status: implemented_scoped_fixture
      limitations: Separate hypothetical independent count dossiers; conservative simultaneous bounds require
        representative independent Bernoulli trials within cells, not deterministic delayed-label samples.
        No causal attribution or adaptive repeated-testing guarantee.
  - id: v2_16_D
    part: D
    title: Contestability and remedy
    investigation_title: Which evidence profile meets the data obligation?
    objective: Compare retained evidence obligations, then test log deletion against retraining and rebuilding
      a shard in an additive toy model.
    source_concepts:
    - chapter: 16
      concept: Contestability and remedy
      concept_map: books/vol2/16_responsible_ai/responsible_ai_concepts.yml
      source_anchor: sec-responsible-ai-transparency-contestability-2f2c
      role: primary
    - chapter: 16
      concept: Machine unlearning
      concept_map: books/vol2/16_responsible_ai/responsible_ai_concepts.yml
      source_anchor: sec-responsible-ai-machine-unlearning-cdf1
      role: primary
    learning_claim: Evidence retention supports contestability but creates obligations; log deletion leaves
      learned contribution intact, while a pre-sharded additive model permits cheaper exact reconstruction.
    tradeoff: Evidence retention supports contestability but creates obligations; log deletion leaves learned
      contribution intact, while a pre-sharded additive model permits cheaper exact reconstruction.
    student_action: Choose retained evidence and review obligations, then delete only a log, retrain all remaining
      contributions, or rebuild the affected shard.
    evidence_to_inspect: Retained fields/durations/review support, original and resulting trained state, retrain-without-record
      reference, residual contribution and records processed.
    explanation_prompt: What does deleting the log leave in the trained state, why does sharding reduce reconstruction
      work here, and what removal evidence would a real deployment still need?
    reversal_condition: Require case-level remedy or change retention/deletion obligation.
    scope: Governed evidence profiles plus an exact additive toy-state removal demonstration; no certificate
      for deep-model unlearning.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_16_experiments: check_privacy_profile'
      status: implemented_scoped_fixture
      limitations: Exact removal comparison only for an additive toy trained state. Record-processing work
        is not deep-model training cost; real unlearning, artifact invalidation and deletion verification remain
        obligations.
  - id: v2_16_E
    part: E
    title: Assurance case
    investigation_title: What decision follows from the evidence?
    objective: Separate mechanical requirement checks from a justified decision with accountable authority.
    source_concepts:
    - chapter: 16
      concept: Assurance case
      concept_map: books/vol2/16_responsible_ai/responsible_ai_concepts.yml
      source_anchor: sec-responsible-ai-governance-assurance-lifecycle
      role: primary
    learning_claim: Passing stated checks supports a bounded argument; missing evidence or stakeholder obligations
      may still justify restriction or deferment.
    tradeoff: Passing stated checks supports a bounded argument; missing evidence or stakeholder obligations
      may still justify restriction or deferment.
    student_action: Inspect evidence gates, choose release/restrict/defer, and name owner, remedy, and trigger.
    evidence_to_inspect: Gate status, insufficient evidence, current captures, accountable owner, and invalidation
      condition.
    explanation_prompt: What claim can this evidence support, who may block release, and what material change
      invalidates the decision?
    reversal_condition: A population, artifact, use, or review-capacity change requires revalidation.
    scope: Compact assurance-oriented decision record, not a complete legal/safety case.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_16_experiments: mechanical_gate; record_release_decision'
      status: implemented_scoped_fixture
      limitations: Recording an owner does not confer actual authority; policy choice cannot alter metrics
        or certify compliance.
