lab_concept_map:
  student_goals:
  - Compare controls at named boundaries, then test malicious worker and clean-label data writes against separate
    integrity checks.
  - Compare a bounded release guarantee and a separate matched utility observation.
  - Distinguish repeated DP releases from fixed-output queries, then bound cumulative response collection with
    persistent principal counters.
  - Compare protection scope and request latency under a common deadline.
  - Trace descendant copies and compare deletion evidence with incident retention obligations.
  runtime_parts:
  - part: A
    title: Which boundary does the defense protect?
    question: Which boundary does the defense protect?
    goal: Compare controls at named boundaries, then test malicious worker and clean-label data writes against
      separate integrity checks.
    concept_ids:
    - v2_13_A
    coverage: implemented_scoped_fixture
    limitation: Constructed scalar studies do not certify convergence, adaptive-attack resilience, or deployment
      poisoning defenses. Finite clean-label candidates are not an optimal continuous attack.
    next: 'Continue to Part B: What utility survives stronger privacy?'
  - part: B
    title: What utility survives stronger privacy?
    question: What utility survives stronger privacy?
    goal: Compare a bounded release guarantee and a separate matched utility observation.
    concept_ids:
    - v2_13_B
    coverage: implemented_scoped_fixture
    limitation: Deterministic public seed is replay-only; supplied quality is illustrative and not generated
      from epsilon. No production randomness or compliance assurance.
    next: 'Continue to Part C: Which repeated operations consume privacy budget?'
  - part: C
    title: Which repeated operations consume privacy budget?
    question: Which repeated operations consume privacy budget?
    goal: Distinguish repeated DP releases from fixed-output queries, then bound cumulative response collection
      with persistent principal counters.
    concept_ids:
    - v2_13_C
    coverage: implemented_scoped_fixture
    limitation: No DP-SGD accountant or surrogate training. Collection objective is constructed, and independent
      principal counters do not link an actor across accounts.
    next: 'Continue to Part D: Which trust mechanism meets the deadline?'
  - part: D
    title: Which trust mechanism meets the deadline?
    question: Which trust mechanism meets the deadline?
    goal: Compare protection scope, cold and steady request latency, and session-average cost under a common
      cold-request deadline.
    concept_ids:
    - v2_13_D
    coverage: implemented_scoped_fixture
    limitation: Illustrative overheads and categorical coverage; cannot infer training throughput, side-channel
      immunity, or universal protection.
    next: 'Continue to Part E: Can the lifecycle policy be defended?'
  - part: E
    title: Can the lifecycle policy be defended?
    question: Can the lifecycle policy be defended?
    goal: Trace descendant copies and compare deletion evidence with incident retention obligations.
    concept_ids:
    - v2_13_E
    coverage: implemented_scoped_fixture
    limitation: Graph completeness is assumed except explicit unknown copies; signatures and lineage cannot
      establish benign content or legal compliance.
    next: Test whether predictions remain useful under named shifts and attacks, without interpreting protected
      execution as robust behavior.
  schema_version: 1
  lab_id: v2_13
  chapter: 13
  title: Security and Privacy
  source_notebook: labs/vol2/lab_13_security_privacy.py
  source_chapter_concept_map: books/vol2/13_security_privacy/security_privacy_concepts.yml
  chapter_goal: Choose controls for an explicit fleet adversary, compare privacy and runtime costs, and bound
    a release claim with lifecycle evidence.
  narrative:
    situation: Your project is operating, and a review asks what an authorized caller or compromised
      participant could learn or change. Protecting the server does not settle what model outputs reveal,
      which updates can be trusted, or what remains after a deletion request. Compare defenses against
      named threats and inspect their utility, latency, and privacy consequences separately.
    previously: Operational monitoring and release records supplied evidence about service behavior; they did
      not establish adversarial security or training-data privacy.
    next: Test whether predictions remain useful under named shifts and attacks, without interpreting protected
      execution as robust behavior.
    submission: One release memo separating adversary coverage, privacy accounting, utility evidence, runtime
      feasibility, and lineage obligations.
  core_concepts:
  - id: v2_13_A
    part: A
    title: ML threat model
    investigation_title: Which boundary does the defense protect?
    objective: Compare controls at named boundaries, then test malicious worker and clean-label data writes
      against separate integrity checks.
    source_concepts:
    - chapter: 13
      concept: ML threat model
      concept_map: books/vol2/13_security_privacy/security_privacy_concepts.yml
      source_anchor: sec-security-privacy-security-threat-modeling-ml-systems-f60d
      role: primary
    - chapter: 13
      concept: Breakdown point of the gradient mean
      concept_map: books/vol2/13_security_privacy/security_privacy_concepts.yml
      source_anchor: sec-security-privacy-gradient-sync-integrity
      role: primary
    - chapter: 13
      concept: Poisoning as a bilevel attack
      concept_map: books/vol2/13_security_privacy/security_privacy_concepts.yml
      source_anchor: sec-security-privacy-data-poisoning-351f
      role: primary
    learning_claim: A control can exclude one observer while leaving another interface or tier exposed.
    tradeoff: A control can exclude one observer while leaving another interface or tier exposed.
    student_action: Compare protection scope, amplify a malicious gradient, exceed a trim fault budget, and
      select a correctly labeled poison through exact defender retraining.
    evidence_to_inspect: Protected tier; submitted gradients, objective change and gather traffic; selected
      poison, target error, broad-cohort accuracy and label validity.
    explanation_prompt: Why do protected execution, a clean label audit, and aggregate accuracy fail to establish
      benign training contributions or correct target behavior?
    reversal_condition: Change attacker locus, add a second compromised worker, or change the poison dose and
      outer target.
    scope: Categorical boundaries, one scalar training round, and exact finite least-squares poison selection;
      not empirical attack prevalence or a defense certificate.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_13_experiments: evaluate_threat_coverage; evaluate_gradient_integrity;
        evaluate_clean_label_poisoning'
      status: implemented_scoped_fixture
      limitations: Constructed scalar studies do not certify convergence, adaptive-attack resilience, or deployment
        poisoning defenses. Finite clean-label candidates are not an optimal continuous attack.
  - id: v2_13_B
    part: B
    title: Differential privacy
    investigation_title: What utility survives stronger privacy?
    objective: Compare a bounded release guarantee and a separate matched utility observation.
    source_concepts:
    - chapter: 13
      concept: Differential privacy
      concept_map: books/vol2/13_security_privacy/security_privacy_concepts.yml
      source_anchor: sec-security-privacy-dp-mathematical-foundations-7e4a
      role: primary
    learning_claim: Smaller privacy loss requires a different noise scale while task utility must be established
      separately.
    tradeoff: Smaller privacy loss requires a different noise scale while task utility must be established
      separately.
    student_action: Change epsilon for the same bounded mean and compare the supplied task counts.
    evidence_to_inspect: Adjacency, public bounds, sensitivity, noise scale, and separately labeled correct/evaluated
      counts.
    explanation_prompt: Which result follows from the mechanism, and which requires observed task evidence?
    reversal_condition: Change protected-unit definition, bounds, or population size; recompute before reusing
      the claim.
    scope: Fixed-size replace-one Laplace demonstration, not private model training.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_13_experiments: release_bounded_mean; evaluate_supplied_quality'
      status: implemented_scoped_fixture
      limitations: Deterministic public seed is replay-only; supplied quality is illustrative and not generated
        from epsilon. No production randomness or compliance assurance.
  - id: v2_13_C
    part: C
    title: Privacy budget account
    investigation_title: Which repeated operations consume privacy budget?
    objective: Distinguish repeated DP releases from fixed-output queries, then bound cumulative response collection
      with persistent principal counters.
    source_concepts:
    - chapter: 13
      concept: Privacy budget account
      concept_map: books/vol2/13_security_privacy/security_privacy_concepts.yml
      source_anchor: sec-security-privacy-privacy-budget-composition-edbe
      role: secondary
    - chapter: 13
      concept: Extraction budgets
      concept_map: books/vol2/13_security_privacy/security_privacy_concepts.yml
      source_anchor: sec-security-privacy-model-extraction-defenses-8f3b
      role: primary
    learning_claim: Additional accounted releases spend budget; unaccounted private access creates an evidence
      gap.
    tradeoff: Additional accounted releases spend budget; unaccounted private access creates an evidence gap.
    student_action: Vary private release count; compare daily and persistent response quotas over time and
      increase admitted principal count.
    evidence_to_inspect: Composed epsilon and guarantee completeness; day-by-day cumulative responses, denied
      queries, constructed target, and principal count.
    explanation_prompt: Why can a fixed-model query add no training privacy loss while still advancing collection,
      and why does account issuance bound a per-principal quota?
    reversal_condition: Add a private release, lengthen collection time, or let one actor obtain another independent
      identity.
    scope: Basic sequential DP composition and explicit query-admission ledger; no empirical extraction threshold
      or surrogate-fidelity inference.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_13_experiments: compose_privacy_events; evaluate_collection_budget'
      status: implemented_scoped_fixture
      limitations: No DP-SGD accountant or surrogate training. Collection objective is constructed, and independent
        principal counters do not link an actor across accounts.
  - id: v2_13_D
    part: D
    title: Security controls priced on a C3 axis
    investigation_title: Which trust mechanism meets the deadline?
    objective: Compare protection scope and request latency under a common deadline.
    source_concepts:
    - chapter: 13
      concept: Security controls priced on a C3 axis
      concept_map: books/vol2/13_security_privacy/security_privacy_concepts.yml
      source_anchor: sec-security-privacy-fleet-trust-boundaries
      role: primary
    learning_claim: Fixed-session and per-request protection costs can disqualify a covered architecture.
    tradeoff: Fixed-session and per-request protection costs can disqualify a covered architecture.
    student_action: Change mechanism and requests per protected session; retain the same base request path.
    evidence_to_inspect: Mechanism tier, protection verdict, cold-request latency, steady latency, session-average
      latency, and cold-request deadline.
    explanation_prompt: Why can a longer session reduce average cost while leaving the cold-request deadline
      failure unchanged?
    reversal_condition: Tighten deadline, establish setup before the timing boundary, or change adversary capability.
    scope: Request-path latency model; not a full collective encryption or tenant-isolation model.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_13_experiments: evaluate_trust_latency'
      status: implemented_scoped_fixture
      limitations: Illustrative overheads and categorical coverage; cannot infer training throughput, side-channel
        immunity, or universal protection.
  - id: v2_13_E
    part: E
    title: Provenance bounds trust
    investigation_title: Can the lifecycle policy be defended?
    objective: Trace descendant copies and compare deletion evidence with incident retention obligations.
    source_concepts:
    - chapter: 13
      concept: Provenance bounds trust
      concept_map: books/vol2/13_security_privacy/security_privacy_concepts.yml
      source_anchor: sec-security-privacy-secure-model-deployment-e08c
      role: primary
    learning_claim: Deleting copies and retaining incident evidence can conflict; an untracked copy makes completion
      unknown.
    tradeoff: Deleting copies and retaining incident evidence can conflict; an untracked copy makes completion
      unknown.
    student_action: Contrast complete, slow, and untracked artifact-copy paths and change retention.
    evidence_to_inspect: Per-copy completion, unknown descendants, deletion deadline, retained and expired
      incident events.
    explanation_prompt: Which missing lineage fact prevents a deletion claim, even when known copies finish?
    reversal_condition: Add an export, lengthen an archive delay, or change the evidence-retention obligation.
    scope: Explicit copy graph and retention policy, not model-state unlearning.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_13_experiments: propagate_deletion; evaluate_retention'
      status: implemented_scoped_fixture
      limitations: Graph completeness is assumed except explicit unknown copies; signatures and lineage cannot
        establish benign content or legal compliance.
