lab_concept_map:
  student_goals:
  - Identify the first fleet feasibility boundary and account for energy at fixed useful work.
  - Compare keeping and replacing hardware over a common remaining-service horizon.
  - Compare electricity, carbon, and direct water consumption under placement and seasonal water obligations.
  - Compare mitigation energy savings while checking matched quality and latency obligations.
  - Compare per-unit efficiency and absolute emissions under explicit post-change demand.
  runtime_parts:
  - part: A
    title: What limits the fleet before carbon does?
    question: What limits the fleet before carbon does?
    goal: Identify the first fleet feasibility boundary and account for energy at fixed useful work.
    concept_ids:
    - v2_15_A
    coverage: implemented_scoped_fixture
    limitation: Illustrative profiles; electrical draw, thermal rejection, energy, and carbon are distinct
      quantities.
    next: 'Continue to Part B: When should hardware be replaced?'
  - part: B
    title: When should hardware be replaced?
    question: When should hardware be replaced?
    goal: Compare keeping and replacing hardware over a common remaining-service horizon.
    concept_ids:
    - v2_15_B
    coverage: implemented_scoped_fixture
    limitation: Manufacturing values are scenario assumptions; no complete lifecycle inventory or product
      environmental declaration.
    next: 'Continue to Part C: Is the cleanest place usable?'
  - part: C
    title: Is the cleanest place usable?
    question: Is the cleanest place usable?
    goal: Compare electricity, carbon, and direct water consumption under placement and seasonal water obligations.
    concept_ids:
    - v2_15_C
    coverage: implemented_scoped_fixture
    limitation: Toy cooling and seasonal allocations are not measured region data; direct consumption excludes withdrawal, indirect water, and validated scarcity characterization. Missing WUE remains unknown.
    next: 'Continue to Part D: Which mitigation survives its side effects?'
  - part: D
    title: Which mitigation survives its side effects?
    question: Which mitigation survives its side effects?
    goal: Compare mitigation energy savings while checking matched quality and latency obligations.
    concept_ids:
    - v2_15_D
    coverage: implemented_scoped_fixture
    limitation: Quality is fixture evidence, not inferred from compression strength; no blanket accuracy/energy
      law.
    next: 'Continue to Part E: Can efficiency increase total emissions?'
  - part: E
    title: Can efficiency increase total emissions?
    question: Can efficiency increase total emissions?
    goal: Compare per-unit efficiency and absolute emissions under explicit post-change demand.
    concept_ids:
    - v2_15_E
    coverage: implemented_scoped_fixture
    limitation: Demand is chosen, not forecast or economically endogenous; report sensitivity rather than
      a predicted rebound rate.
    next: Use those resource obligations alongside fairness, review capacity, and accountable release authority.
  schema_version: 1
  lab_id: v2_15
  chapter: 15
  title: Sustainable AI
  source_notebook: labs/vol2/lab_15_sustainable_ai.py
  source_chapter_concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
  chapter_goal: Compare fleet interventions under explicit useful-work, facility, lifecycle, and demand boundaries.
  narrative:
    situation: The team wants to expand your project, but the facility has limited electrical and cooling
      capacity. Moving work or replacing equipment may change emissions while creating another constraint.
      Compare feasible ways to deliver the same useful work, then examine whether higher demand could
      consume the gains from a more efficient design.
    previously: The robustness decision supplied bounded latency and energy costs. Environmental comparisons
      still require a common workload and accounting boundary.
    next: Use those resource obligations alongside fairness, review capacity, and accountable release authority.
    submission: One sustainability decision with a feasible option, rejected alternative, accounting boundary,
      demand assumption, and revisit trigger.
  core_concepts:
  - id: v2_15_A
    part: A
    title: Power ceiling versus energy account
    investigation_title: What limits the fleet before carbon does?
    objective: Identify the first fleet feasibility boundary and account for energy at fixed useful work.
    source_concepts:
    - chapter: 15
      concept: Power ceiling versus energy account
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-energy-wall
      role: primary
    - chapter: 15
      concept: Sustainability measurement contract
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-systematic-energy-metrics-5779-5779
      role: primary
    - chapter: 15
      concept: Operational carbon chain
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-operational-carbon-calculation-4627-calculation-4627
      role: primary
    learning_claim: A low-carbon energy source cannot make an over-power or over-heat configuration executable.
    tradeoff: A low-carbon energy source cannot make an over-power or over-heat configuration executable.
    student_action: Change common fleet load while inspecting power, heat rejection, and facility energy.
    evidence_to_inspect: Work definition, interval, component energy, PUE boundary, electrical and cooling
      limits.
    explanation_prompt: Which constraint prevents execution, and why does a different carbon factor leave
      it unchanged?
    reversal_condition: Change the load profile or facility capacity while preserving the declared boundary.
    scope: Fleet and supporting facility boundary; endpoint constraints remain explicit.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_15_experiments: calculate_energy; check_facility'
      status: implemented_scoped_fixture
      limitations: Illustrative profiles; electrical draw, thermal rejection, energy, and carbon are distinct
        quantities.
  - id: v2_15_B
    part: B
    title: Embodied carbon allocation
    investigation_title: When should hardware be replaced?
    objective: Compare keeping and replacing hardware over a common remaining-service horizon.
    source_concepts:
    - chapter: 15
      concept: Embodied carbon allocation
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-embodied-carbon-assessment-9de0
      role: primary
    - chapter: 15
      concept: Dominant lifecycle carbon term
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-lifecycle-carbon-accounting-99a1
      role: primary
    learning_claim: Operational savings must repay additional manufacturing caused by replacement.
    tradeoff: Operational savings must repay additional manufacturing caused by replacement.
    student_action: Change shared horizon and compare keep versus replacement under the same useful-work demand.
    evidence_to_inspect: Operating carbon, incremental manufacturing, total lifecycle account, and break-even
      condition.
    explanation_prompt: Which emissions are sunk under this decision boundary, and which are caused by the
      proposed replacement?
    reversal_condition: Shorten horizon or change grid intensity and revisit the recommendation.
    scope: Consequential replacement comparison; not retrospective allocation of all historical embodied emissions.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_15_experiments: calculate_lifecycle; compare_replacement'
      status: implemented_scoped_fixture
      limitations: Manufacturing values are scenario assumptions; no complete lifecycle inventory or product
        environmental declaration.
  - id: v2_15_C
    part: C
    title: Carbon-aware placement and time-shifting
    investigation_title: Is the cleanest place usable?
    objective: Compare electricity, carbon, and direct water consumption under placement and seasonal water obligations.
    source_concepts:
    - chapter: 15
      concept: Carbon-aware placement and time-shifting
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-carbonaware-scheduling-c2db
      role: primary
    - chapter: 15
      concept: Water accounting
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-water-usage-caae
      role: primary
    learning_claim: Cleaner electricity or lower cooling electricity does not establish that direct water consumption meets a local seasonal obligation.
    tradeoff: Dry cooling uses more electricity but less direct water than the supplied evaporative alternative; drought tightens a separate local allowance.
    student_action: Keep useful work fixed; compare wet and drought allocations under evaporative cooling, then test dry cooling or missing WUE evidence.
    evidence_to_inspect: Electricity, carbon, direct liters, local run allowance, watershed/season context, known or unknown water evidence, and placement restrictions.
    explanation_prompt: Which change alters liters consumed, which changes their local admissibility, and why does missing WUE require more evidence?
    reversal_condition: Change cooling, season, deadline, or available clean capacity.
    scope: Supplied placement cases and explicit constraints; no assumed real-time grid forecast.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_15_experiments: evaluate_placements; select_lowest_carbon_placement'
      status: implemented_scoped_fixture
      limitations: Toy cooling and seasonal allocations are not measured region data; direct consumption excludes withdrawal, indirect water, and validated scarcity characterization. Missing WUE remains unknown.
  - id: v2_15_D
    part: D
    title: Sustainability measurement contract
    investigation_title: Which mitigation survives its side effects?
    objective: Compare mitigation energy savings while checking matched quality and latency obligations.
    source_concepts:
    - chapter: 15
      concept: Sustainability measurement contract
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-systematic-energy-metrics-5779-5779
      role: primary
    - chapter: 15
      concept: Operational carbon chain
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-operational-carbon-calculation-4627-calculation-4627
      role: primary
    learning_claim: Lower operations or moved bytes can improve energy while violating quality or time constraints.
    tradeoff: Lower operations or moved bytes can improve energy while violating quality or time constraints.
    student_action: Apply supported mitigation to a fixed workload and inspect the quality floor and latency
      deadline.
    evidence_to_inspect: Useful work, moved bytes, facility energy, supplied quality, deadline, and feasibility.
    explanation_prompt: Which proposed saving survives the same quality and latency contract as the baseline?
    reversal_condition: Raise the required quality floor or tighten deadline and repeat.
    scope: Mechanistic energy model and supplied task-quality observations.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_15_experiments: evaluate_mitigation'
      status: implemented_scoped_fixture
      limitations: Quality is fixture evidence, not inferred from compression strength; no blanket accuracy/energy
        law.
  - id: v2_15_E
    part: E
    title: Demand outruns efficiency
    investigation_title: Can efficiency increase total emissions?
    objective: Compare per-unit efficiency and absolute emissions under explicit post-change demand.
    source_concepts:
    - chapter: 15
      concept: Demand outruns efficiency
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-exponential-growth-vs-physical-constraints-0f4e
      role: primary
    learning_claim: Efficiency reduces intensity while sufficient demand growth can increase total energy
      and emissions.
    tradeoff: Efficiency reduces intensity while sufficient demand growth can increase total energy and emissions.
    student_action: Set an explicit demand multiplier and inspect both per-unit and total outcomes.
    evidence_to_inspect: Efficiency factor, useful-work demand, absolute energy/carbon, and rebound boundary.
    explanation_prompt: Which conclusion depends on the demand assumption rather than on the device efficiency
      result?
    reversal_condition: Change demand or carbon intensity while retaining the same efficiency improvement.
    scope: Explicit demand scenario; efficiency does not itself predict adoption.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_15_experiments: calculate_rebound'
      status: implemented_scoped_fixture
      limitations: Demand is chosen, not forecast or economically endogenous; report sensitivity rather than
        a predicted rebound rate.
