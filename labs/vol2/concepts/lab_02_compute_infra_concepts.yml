lab_concept_map:
  schema_version: 1
  lab_id: v2_02
  chapter: 2
  title: Compute Infrastructure
  source_notebook: labs/vol2/lab_02_compute_infra.py
  source_chapter_concept_map: books/vol2/02_compute_infrastructure/compute_infrastructure_concepts.yml
  chapter_goal: Select a workload-matched accelerator, node, and rack envelope that passes capacity, movement,
    facility, and ownership-cost constraints.
  narrative:
    situation: The team is considering a hardware purchase for your project. An impressive accelerator
      benchmark has attracted attention, but the proposed workload must also fit memory, move data through
      the node, and run within the facility budget. Test the purchase against those constraints before
      committing. A device project still needs an upstream preparation system; evaluate that infrastructure
      separately from its deployed endpoints.
    previously: The fleet introduction identified coupling and capacity risks; absent compatible evidence,
      use the supplied case.
    next: Test the shared fabric under the actual communication pattern.
    submission: 'One integrated decision memo: saved comparisons, causal explanation, rejected alternative,
      remaining uncertainty, and reversal trigger. A supported hold is valid.'
  core_concepts:
  - id: v2_02_A
    part: A
    title: Sustained compute
    investigation_title: When does a faster accelerator fail to help?
    source_concepts:
    - chapter: 02_compute_infrastructure
      concept: Plan on sustained throughput
      concept_map: books/vol2/02_compute_infrastructure/compute_infrastructure_concepts.yml
      source_anchor: sec-compute-infrastructure-peak-vs-sustained-throughput-625a
    learning_claim: Peak compute improves performance only when the workload can feed it.
    tradeoff: Compute peak versus bandwidth and workload arithmetic intensity.
    student_action: Sweep arithmetic intensity across the same candidate devices at a fixed precision.
    evidence_to_inspect: Roofline ceilings, active bound, and candidate ranking.
    explanation_prompt: Why did the ranking change or remain unchanged?
    reversal_condition: Reconsider when intensity or precision changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_02_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Compare candidate devices for a workload at fixed precision.
  - id: v2_02_B
    part: B
    title: Memory capacity and bandwidth
    investigation_title: Does the working set fit before timing it?
    source_concepts:
    - chapter: 02_compute_infrastructure
      concept: Capacity and bandwidth are separate tests
      concept_map: books/vol2/02_compute_infrastructure/compute_infrastructure_concepts.yml
      source_anchor: sec-compute-memory-wall
    - chapter: 02_compute_infrastructure
      concept: Node aggregates private memories
      concept_map: books/vol2/02_compute_infrastructure/compute_infrastructure_concepts.yml
      source_anchor: sec-compute-node-memory
    learning_claim: Capacity feasibility precedes a bandwidth latency floor; private device memory is not
      automatically pooled.
    tradeoff: Larger working set versus capacity and movement time.
    student_action: Enlarge the working set against the same device; inspect the first infeasible case.
    evidence_to_inspect: Required and available bytes, fit gate, and valid latency floor only for fitting
      cases.
    explanation_prompt: Why is extra bandwidth unable to repair this capacity failure?
    reversal_condition: Reconsider when sharding or a different capacity becomes available.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_02_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Evaluate working-set feasibility separately from movement time.
  - id: v2_02_C
    part: C
    title: Bandwidth hierarchy
    investigation_title: Where should communicating work reside?
    source_concepts:
    - chapter: 02_compute_infrastructure
      concept: Bandwidth hierarchy dictates placement
      concept_map: books/vol2/02_compute_infrastructure/compute_infrastructure_concepts.yml
      source_anchor: sec-compute-bandwidth-hierarchy
    learning_claim: The physical transfer tier changes communication time for the identical payload.
    tradeoff: Placement flexibility versus bandwidth-tier penalties.
    student_action: Move only the destination tier, preserving payload and device.
    evidence_to_inspect: Same bytes crossing each tier and transfer-time decomposition.
    explanation_prompt: Which placement boundary dominates and what would a faster compute device leave unchanged?
    reversal_condition: Reconsider when communication frequency or placement constraints change.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_02_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Compare identical transfers across placement tiers.
  - id: v2_02_D
    part: D
    title: Rack envelope
    investigation_title: Can the facility power and cool the fleet?
    source_concepts:
    - chapter: 02_compute_infrastructure
      concept: Rack power wall
      concept_map: books/vol2/02_compute_infrastructure/compute_infrastructure_concepts.yml
      source_anchor: sec-compute-power-wall
    learning_claim: Purchased compute is usable only within both electrical and cooling constraints.
    tradeoff: Installed accelerator count versus power and heat-removal headroom.
    student_action: Increase accelerator count at fixed facility limits and inspect each gate independently.
    evidence_to_inspect: IT draw, facility draw, electrical margin, cooling margin, and failure causes.
    explanation_prompt: Which constraint fails first and why does passing the other not repair it?
    reversal_condition: Reconsider when the cooling class or electrical service changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_02_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Evaluate electrical and cooling headroom independently.
  - id: v2_02_E
    part: E
    title: Infrastructure selection
    investigation_title: Which feasible system earns its cost?
    source_concepts:
    - chapter: 02_compute_infrastructure
      concept: Workload-matched hardware selection
      concept_map: books/vol2/02_compute_infrastructure/compute_infrastructure_concepts.yml
      source_anchor: sec-compute-accelerator-selection
    - chapter: 02_compute_infrastructure
      concept: Infrastructure walls cascade
      concept_map: books/vol2/02_compute_infrastructure/compute_infrastructure_concepts.yml
      source_anchor: sec-compute-accelerator-selection
    learning_claim: Economic comparison must first exclude capacity and facility failures at a common workload
      and horizon.
    tradeoff: Capital cost versus sustained useful capacity and duty-dependent operating cost.
    student_action: Compare systems at equal count and horizon, then change duty separately.
    evidence_to_inspect: Feasibility cascade and cost components under low and expected duty.
    explanation_prompt: Defend a feasible option and explain the utilization condition that reverses the ranking.
    reversal_condition: Reconsider when workload, duty, or facility constraints change.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_02_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Defend a feasible system choice under a common cost horizon.
