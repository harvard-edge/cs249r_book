  student_route: Show all goals, part questions, submission and next lab before any prediction. Each part uses
    scene, minimal briefing, controlled choice, reactive consequence feedback, explanation and handoff. Predictions
    do not hide failures or penalize an incorrect guess.
  evidence_policy: Use actual MLSysIM outputs and exact supplied fixture records; retain unsupported cases
    and failed gates. Keep live reactive results separate from explicitly saved evidence. Prior records count
    only when versions, workload and boundaries match.
  track_policy: Select one continuing fleet context. Distinguish independent endpoints, coupled development
    training and shared backend services. Hardware size is not a generic model of statistical quality; context-specific
    unsupported architectures stay unavailable.
