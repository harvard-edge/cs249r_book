lab_concept_map:
  schema_version: 1
  lab_id: v2_07
  chapter: 7
  title: Preserve valid work when failures become routine
  source_notebook: labs/vol2/lab_07_fault_tolerance.py
  source_chapter_concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
  chapter_goal: Preserve valid work when failures become routine
  status: implemented bounded investigations; distributed protocols and empirical reliability remain explicit
    limitations
  narrative:
    situation: A worker disappears during your project's long training run. Restarting is possible, but
      the team must decide which saved state is valid and how much progress it can afford to lose next
      time. Compare checkpoint frequency, recovery work, and placement across failure domains while the
      deployed service still needs capacity.
    previously: Distributed training established how workers cooperate; use compatible prior evidence or the
      supplied starting case.
    next: Choose which complete jobs can start and which interruptions a scheduler may justify.
    submission: Five captured contrasts including independent fault axes, arithmetic verification coverage,
      valid checkpoint and elastic state, placement, progress detection and recovery allocation.
  core_concepts:
  - id: v2_07_A
    part: A
    title: Fleet interruption exposure
    investigation_title: When does a rare fault become routine?
    source_concepts:
    - chapter: 7
      concept: Fleet failure rate
      concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
      source_anchor: sec-fault-tolerance-reliability-reliability-mathematics-inevitable-failure-93ef
    - chapter: 7
      concept: Fault classification by persistence, manifestation, and scope
      concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
      source_anchor: sec-fault-tolerance-reliability-reliability-failure-taxonomy-e78c
    - chapter: 7
      concept: Silent data corruption verification
      concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
      source_anchor: sec-ft-sdc-verification
    learning_claim: A synchronized job is interrupted by worker or shared-domain events; serving-device unavailability
      has a different consequence. Persistence selects retry or replacement, manifestation selects detection,
      and scope sets affected ranks; a valid transport CRC cannot establish correct arithmetic.
    tradeoff: Larger coupled jobs versus probability of uninterrupted useful execution. Additional recomputation
      versus unchecked arithmetic; limited coverage may miss the injected rank.
    student_action: Change coupled worker count while holding run duration and failure assumptions fixed; compare
      worker and domain event streams. Change persistence, manifestation and rank/rack scope independently;
      compare no, selective and all-rank arithmetic verification on exact retry traces.
    evidence_to_inspect: Interruption probability and separated worker/domain rates at baseline and changed
      size. Inspect heartbeat, valid transport CRC, expected versus reduced arithmetic, mismatches, accepted
      wrong results and recomputation count.
    explanation_prompt: Which failure stream changes with workers, and why does that interrupt this job? Why
      does a correct CRC accept a wrong producer value, and when does a successful retry fail to establish
      recovery?
    reversal_condition: A changed coupling boundary or correlated hazard makes the independent-worker comparison
      inadequate.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_07_experiments
      functions:
      - training_exposure
      - fault_verification_trace
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Constant event rates and illustrative shared-domain assumptions are not measured fleet reliability.
        The synthetic three-attempt fault trace and rank coverage demonstrate mechanisms, not empirical rates
        or detection probabilities.
    student_objective: Compare coupled-job interruption exposure, classify independent fault axes and test
      arithmetic recomputation coverage.
  - id: v2_07_B
    part: B
    title: Checkpoint interval and expected waste
    investigation_title: How often should progress be saved?
    source_concepts:
    - chapter: 7
      concept: Young-Daly checkpoint interval
      concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
      source_anchor: sec-fault-tolerance-young-daly
    learning_claim: Shorter checkpoint intervals reduce rollback exposure while increasing healthy-operation
      pause; the optimum is valid only within its approximation domain.
    tradeoff: Write pause versus expected replay, with recovery charged separately.
    student_action: Vary checkpoint interval at fixed state and bandwidth; compare total overhead and rollback
      limit.
    evidence_to_inspect: Pause fraction, rework fraction, recovery fraction, maximum rollback and approximation-domain
      flag.
    explanation_prompt: Why can the lowest expected waste still violate the rollback requirement?
    reversal_condition: A tighter rollback bound, slower writes or changed failure frequency can reverse the
      interval choice.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_07_experiments
      functions:
      - checkpoint_tradeoff
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: First-order steady-state model; the Young optimum is withheld outside its stated domain.
    student_objective: Defend a checkpoint interval against expected waste and a maximum rollback requirement.
  - id: v2_07_C
    part: C
    title: Recoverable checkpoint generation
    investigation_title: Is the newest checkpoint recoverable?
    source_concepts:
    - chapter: 7
      concept: Consistent checkpoint cut
      concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
      source_anchor: sec-fault-tolerance-reliability-checkpoint-coordination-patterns-f670
    - chapter: 7
      concept: Elastic recovery invariants
      concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
      source_anchor: sec-fault-tolerance-reliability-reliability-elastic-training-4f87
    - chapter: 7
      concept: Recovery-time budget and fencing
      concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
      source_anchor: sec-fault-tolerance-reliability-recovery-automation-pipeline
    learning_claim: 'A newer step is usable only if completion and integrity checks establish a recoverable
      generation. Surviving workers are insufficient: a resized job must preserve its batch policy, data coverage,
      all required state and fenced write authority.'
    tradeoff: Recent saved progress versus consistent and digest-valid state.
    student_action: Inject a corrupt, incomplete, mixed-step, missing-shard or unpublished newest generation
      and choose a safe restore. Repair a four-to-two-worker recovery; break batch, data cursor, shard reconstruction
      and stale-writer fencing independently.
    evidence_to_inspect: Per-generation completion, digest, consistent-cut and manifest-publication gates;
      exact shard step IDs and expected count; restore step and rollback. Inspect effective batch, duplicate/missing
      sample IDs, optimizer shard IDs and writer epochs.
    explanation_prompt: Why must recovery skip the newest record, and what progress does that sacrifice? Which
      independent invariant fails after each broken repair, and why does liveness not prove valid execution?
    reversal_condition: A fully committed valid newest generation changes which restore is safe.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_07_experiments
      functions:
      - checkpoint_fault_fixture
      - select_restore_checkpoint
      - elastic_recovery_trace
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Explicit shard-step and final-manifest flags test necessary consistent-cut conditions; finite
        resize records test batch/data/state/epoch gates. No network consensus, real distributed fencing service,
        arbitrary cross-shard communication cut, reshard implementation or convergence validation is simulated.
    student_objective: Select a valid generation and preserve batch, exactly-once data, reconstructable state
      and writer epochs during a resize.
  - id: v2_07_D
    part: D
    title: Replica placement across failure domains
    investigation_title: Does redundancy survive a shared domain?
    source_concepts:
    - chapter: 7
      concept: Fleet failure rate
      concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
      source_anchor: sec-fault-tolerance-reliability-reliability-replica-placement-failure-domains-73a7
    learning_claim: Independent serving endpoints lose capacity without stopping a coupled global job; shared
      domains can defeat colocated backend replicas.
    tradeoff: Replica count and placement cost versus service availability and correlated exposure.
    student_action: Hold replica count fixed and compare one-domain with spread placement; inspect independent
      device capacity separately.
    evidence_to_inspect: Expected active device count and backend service availability under matched domain
      assumptions.
    explanation_prompt: Which result concerns service availability, which concerns aggregate device capacity,
      and why are they different?
    reversal_condition: Correlated domains or state reconstruction delays absent from this model can invalidate
      the availability advantage.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_07_experiments
      functions:
      - serving_capacity
      - replica_availability
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Primary fleet failure reasoning extends to the chapter secondary concept Serving replication
        sized to state; no failover timeline or authoritative-state reconstruction is modeled.
    student_objective: Compare replica placements while distinguishing service availability from independent
      device capacity.
  - id: v2_07_E
    part: E
    title: Recovery pipeline resource allocation
    investigation_title: Where should recovery bandwidth go?
    source_concepts:
    - chapter: 7
      concept: Recovery-time budget and fencing
      concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
      source_anchor: sec-fault-tolerance-reliability-recovery-automation-pipeline
    - chapter: 7
      concept: Gray failure detection
      concept_map: books/vol2/07_fault_tolerance/fault_tolerance_concepts.yml
      source_anchor: sec-fault-tolerance-reliability-reliability-distinguishing-stragglers-failures-285d
    learning_claim: Improving checkpoint writes cannot remove a bottleneck in restore reads; a recovery budget
      must include detection, restart, load and warmup. Gray failures need progress monitoring and mitigation
      even when liveness stays healthy; aggressive thresholds can flag healthy work.
    tradeoff: Equal added bandwidth spent on healthy write pauses versus failure-time restoration.
    student_action: Stress state and compare equal bandwidth allocations to writes and restore reads from the
      same failing baseline. Compare heartbeat-only and progress monitors on healthy, slow and stopped traces;
      tighten the threshold until healthy ranks are falsely flagged.
    evidence_to_inspect: Write pause, each recovery phase, total recovery and its deadline gate. Inspect per-rank
      step units, barrier duration, liveness, suspect ranks, false positives and first response.
    explanation_prompt: Which phase changes, which stays fixed, and why does the rejected allocation fail the
      requirement? Why does checkpoint restore not remove slow hardware, and what does a low threshold sacrifice?
    reversal_condition: A changed bottleneck, checkpoint frequency or recovery deadline can reverse the allocation.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_07_experiments
      functions:
      - checkpoint_tradeoff
      - gray_failure_trace
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Analytical recovery budget and finite progress windows; no empirical false-alarm rate, scheduler
        mitigation implementation or distributed fencing service is estimated. Writer-epoch acceptance is tested
        separately in Part C.
    student_objective: Allocate recovery bandwidth and distinguish a stopped rank from a live straggler using
      progress evidence.
