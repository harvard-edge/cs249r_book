  - Defend a checkpoint interval against expected waste and a maximum rollback requirement.
  - Select a valid generation and preserve batch, exactly-once data, reconstructable state and writer epochs
    during a resize.
  - Compare replica placements while distinguishing service availability from independent device capacity.
  - Allocate recovery bandwidth and distinguish a stopped rank from a live straggler using progress evidence.
