lab_concept_map:
  schema_version: 1
  lab_id: v2_11
  chapter: 11
  title: Decide whether and how a heterogeneous fleet should learn
  source_notebook: labs/vol2/lab_11_edge_intelligence.py
  source_chapter_concept_map: books/vol2/11_edge_intelligence/edge_intelligence_concepts.yml
  chapter_goal: Decide whether and how a heterogeneous fleet should learn
  status: chapter-primary investigations implemented with explicit analytical and fixture boundaries
  narrative:
    situation: People using your project encounter conditions that the original model did not cover well.
      The team proposes learning from local experience without interrupting the device or service's main
      task. Decide where adaptation belongs, how much background work fits, and whose observations a
      shared update would represent. Keeping data local does not by itself establish that local training
      is worthwhile.
    previously: Serving work established latency and ready-capacity obligations that adaptation may not silently
      consume.
    next: Operate many interacting model versions and enforce compatible release evidence.
    submission: An adaptation placement decision with separate resource gates, matched replay/convergence evidence,
      participant/version/recovery trace and justified hold, promote or restore action.
  core_concepts:
  - id: v2_11_A
    part: A
    title: Placement of fleet adaptation
    investigation_title: Where should adaptation occur?
    source_concepts:
    - chapter: 11
      concept: Local training must earn its place
      concept_map: books/vol2/11_edge_intelligence/edge_intelligence_concepts.yml
      source_anchor: sec-edge-intelligence-motivations-benefits-37c3
    learning_claim: Local inference does not justify local training; adaptation placement changes raw-data
      boundaries and population learning.
    tradeoff: Local context and data locality versus device cost, shared learning and communication.
    student_action: Compare centralized, local-only and federated options with each transfer horizon stated;
      choose and reject an alternative.
    evidence_to_inspect: Raw observations versus model-update transfers, population-learning support and horizon.
    explanation_prompt: What benefit requires local adaptation, and which privacy claim remains unproven?
    reversal_condition: Insufficient local benefit, device allowance or acceptable central data movement can
      reverse placement.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_11_experiments
      functions:
      - compare_architectures
      - evaluate_architecture
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Horizons differ visibly; model-update exchange is not proof of privacy or a directly interchangeable
        transfer measurement.
    student_objective: Defend where adaptation should occur using task benefit and explicit data boundaries.
  - id: v2_11_B
    part: B
    title: Background adaptation feasibility
    investigation_title: Can adaptation fit without harming foreground work?
    source_concepts:
    - chapter: 11
      concept: Update working set within the background allowance
      concept_map: books/vol2/11_edge_intelligence/edge_intelligence_concepts.yml
      source_anchor: sec-edge-intelligence-design-constraints-c776
    - chapter: 11
      concept: Background adaptation admission
      concept_map: books/vol2/11_edge_intelligence/edge_intelligence_concepts.yml
      source_anchor: sec-edge-intelligence-design-constraints-c776
    learning_claim: Memory fit, update-window fit, energy and foreground impact are separate admission conditions.
    tradeoff: Reduced trainable state versus activation path, battery, update time and foreground slack.
    student_action: Compare full and reduced updates on the same worker, varying supported method/batch and
      foreground budget.
    evidence_to_inspect: Weights, gradients, optimizer and activations; memory, duration, energy and foreground
      gate separately.
    explanation_prompt: Which condition blocks this method even if its trainable parameters are small?
    reversal_condition: Foreground demand, energy allowance or update window can reject a previously admitted
      method.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_11_experiments
      functions:
      - evaluate_adaptation
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Physical budgets use registry-backed devices; task outcomes are supplied fixtures, not derived
        from speed or parameter count.
    student_objective: Test a background update against separate resource and foreground constraints.
  - id: v2_11_C
    part: C
    title: Replay within a finite adaptation budget
    investigation_title: How much past experience should remain?
    source_concepts:
    - chapter: 11
      concept: Update working set within the background allowance
      concept_map: books/vol2/11_edge_intelligence/edge_intelligence_concepts.yml
      source_anchor: sec-edge-intelligence-data-efficiency-c701
    learning_claim: Replay and adaptation compete for finite memory; retained history and new-task learning
      must be judged from matched evidence.
    tradeoff: Replay storage and old-task retention versus remaining update capacity and new-task outcome.
    student_action: Vary replay fraction at fixed total memory and inspect supplied old/new outcomes.
    evidence_to_inspect: Bytes for replay, retained examples, admission, old/new outcomes and weaker outcome.
    explanation_prompt: What does extra replay cost, and why does an outcome curve not follow from hardware
      alone?
    reversal_condition: Changed task or memory allowance invalidates a fixture-based replay choice.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_11_experiments
      functions:
      - evaluate_replay
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Directly deepens secondary Scarce local evidence allocation and On-device drift and forgetting;
        illustrative outcomes do not predict arbitrary streams.
    student_objective: Allocate finite replay memory using matched old- and new-task evidence.
  - id: v2_11_D
    part: D
    title: Local work to a common federated target
    investigation_title: How much local work should precede communication?
    source_concepts:
    - chapter: 11
      concept: FedAvg under sampling and non-IID data
      concept_map: books/vol2/11_edge_intelligence/edge_intelligence_concepts.yml
      source_anchor: dfn-edge-intelligence-federated-learning .callout-definition title="Federated learning"
    - chapter: 11
      concept: Federated uplink budget
      concept_map: books/vol2/11_edge_intelligence/edge_intelligence_concepts.yml
      source_anchor: dfn-edge-intelligence-federated-learning .callout-definition title="Federated learning"
    learning_claim: Fewer communication rounds are not necessarily faster to target when local work and non-IID
      drift change rounds needed.
    tradeoff: Per-round communication savings versus local work, heterogeneity and convergence trajectory.
    student_action: Vary local epochs and supplied heterogeneity fixture while keeping the target definition
      fixed.
    evidence_to_inspect: Rounds to target, slow-client local time, bidirectional bytes, coordination and total
      wall time.
    explanation_prompt: Which policy reaches the same target fastest, and why is round count insufficient?
    reversal_condition: A different non-IID trajectory or uplink bottleneck can reverse the epoch choice.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_11_experiments
      functions:
      - evaluate_federation
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Rounds-to-target are supplied illustrative convergence evidence; not a universal FedAvg
        convergence formula.
    student_objective: Compare local-work policies by time and bytes to one common target.
  - id: v2_11_E
    part: E
    title: Participation, protocol survivors and adaptive release
    investigation_title: Who contributes, and may the fleet release?
    source_concepts:
    - chapter: 11
      concept: Participation selection
      concept_map: books/vol2/11_edge_intelligence/edge_intelligence_concepts.yml
      source_anchor: sec-edge-intelligence-federated-systems
    - chapter: 11
      concept: Secure aggregation
      concept_map: books/vol2/11_edge_intelligence/edge_intelligence_concepts.yml
      source_anchor: sec-edge-intelligence-federated-privacy-a1ed
    - chapter: 11
      concept: Adaptive fleet release policy
      concept_map: books/vol2/11_edge_intelligence/edge_intelligence_concepts.yml
      source_anchor: sec-edge-intelligence-validation-strategy-adaptation-ab3d
    learning_claim: Eligibility, compatible update admission, protocol survival and release approval are separate
      gates; a completed aggregate neither proves privacy nor establishes task improvement.
    tradeoff: Participation and survivor floor versus dropout recovery, compatible state, reporting coverage
      and validated deployment evidence.
    student_action: Compare selection policies; vary survivor floor and dropout/recovery; test matched versus
      base-only release state and shadow versus validated task evidence.
    evidence_to_inspect: Selected and version-rejected IDs, surviving cohort roster, floor/recovery gates,
      release tuple, hardware/outcome/reporting evidence and hold/promote/restore decision.
    explanation_prompt: Which gate fails first, why is shadow disagreement insufficient, and which compatible
      artifact set must rollback restore?
    reversal_condition: A dropout, missing recovery shares, incompatible dependent state, missing cohort reports
      or validated task regression reverses aggregate or promotion approval.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_11_experiments
      functions:
      - evaluate_client_selection
      - evaluate_fleet_round
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Finite illustrative protocol/release records model declared threshold and recovery acceptance
        only. No cryptographic masks, privacy proof, differential-privacy accounting or real fleet validation
        is simulated.
    student_objective: Trace a roster through compatibility, protocol survival and independently justified
      adaptive release.
