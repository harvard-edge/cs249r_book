lab_concept_map:
  schema_version: 1
  lab_id: v2_01
  chapter: 1
  title: Introduction
  source_notebook: labs/vol2/lab_01_introduction.py
  source_chapter_concept_map: books/vol2/01_introduction/introduction_concepts.yml
  chapter_goal: Defend when fleet coupling is necessary and how scaling, failures, and partitions change useful
    work.
  narrative:
    situation: Demand for your project has grown beyond the first deployment. The team proposes adding
      machines, but has not agreed which work can be shared or what must advance together. Compare capacity,
      coordination, failures, and a broken connection before recommending how the service should grow.
      For a device fleet, distinguish independent endpoints from the coupled backend that prepares their
      models.
    previously: Start from the supplied fleet mission; no earlier Volume I work is required.
    next: "Choose an accelerator\u2013node\u2013rack envelope in Compute Infrastructure."
    submission: 'One integrated decision memo: saved comparisons, causal explanation, rejected alternative,
      remaining uncertainty, and reversal trigger. A supported hold is valid.'
  core_concepts:
  - id: v2_01_A
    part: A
    title: Scale moment
    investigation_title: When must work leave one machine?
    source_concepts:
    - chapter: 01_introduction
      concept: Scale moment
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-vol2-introduction-scale-moment
    learning_claim: Distributing a coupled workload may repair capacity, while adding independent endpoints
      cannot pool their private memory.
    tradeoff: Capacity and aggregate rate versus the coupling needed to share state.
    student_action: Compare original and compact state, then vary machine count under the declared coupling.
    evidence_to_inspect: Per-machine state and rate margins, feasibility, and an explicit unchanged-result
      case.
    explanation_prompt: Which constraint changed in your comparison, which stayed fixed, and why did that determine
      whether the intervention helped?
    reversal_condition: Reconsider when state ownership or the endpoint workload changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_01_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Distinguish local capacity and rate constraints from fleet aggregate capacity.
  - id: v2_01_B
    part: B
    title: Fleet Law
    investigation_title: When does another worker stop helping?
    source_concepts:
    - chapter: 01_introduction
      concept: Fleet Law
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-vol2-introduction-fleet-law
    - chapter: 01_introduction
      concept: C3 taxonomy
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-vol2-introduction-three-dimensions
    - chapter: 01_introduction
      concept: Communication intensity
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-vol2-introduction-ci-ratio
    - chapter: 01_introduction
      concept: Scaling laws as the demand curve
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-vol2-intro-scaling-law-breakdown-conditions-1f8c
    - chapter: 01_introduction
      concept: Fleet stack
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-vol2-introduction-structure
    learning_claim: "A loss target determines useful work demand; the Fleet Law determines its execution price.\
      \ C\xB3 distinguishes cost terms while the fleet stack locates interventions."
    tradeoff: Shorter local compute versus greater exposed communication and coordination.
    student_action: Predict the resource cost of two equal loss reductions; vary the normalized quality target.
      Separately hold global work fixed and compare width, bandwidth, and coordination interventions.
    evidence_to_inspect: "Increasing marginal compute above an irreducible floor; C\xB3 decomposition and scaling\
      \ efficiency; fabric versus distribution intervention effects."
    explanation_prompt: Why does another worker change execution time without changing the quality-demand curve?
      Which stack band owns the intervention that changed your binding cost?
    reversal_condition: Reconsider when workload bytes per operation or the fabric changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_01_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence. The normalized shallow power law reuses
        the chapter illustrative exponent, not a fitted quality forecast for any deployment track; task utility
        remains unmeasured. Stack localization is demonstrated through declared interventions, not inferred
        from a production trace.
    student_objective: Diagnose a scaling comparison using compute, communication, and coordination.
  - id: v2_01_C
    part: C
    title: Reliability gap
    investigation_title: Does reliable hardware make a reliable fleet?
    source_concepts:
    - chapter: 01_introduction
      concept: Reliability gap
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-vol2-introduction-reliability-gap
    - chapter: 01_introduction
      concept: Synchronous tight coupling
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-introduction-traditional-vs-ml-fleet-dynamics-c43e
    learning_claim: A node event has different consequences for tightly coupled work and independent deployments.
    tradeoff: More capacity versus more opportunities to interrupt a coupled job.
    student_action: Compare fleet size at fixed component reliability, then change repair time separately.
    evidence_to_inspect: Horizon event probability separately from stationary unavailable capacity.
    explanation_prompt: Why is probability of any event not the percentage of unavailable service?
    reversal_condition: Reconsider when failures share a domain rather than remaining independent.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_01_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence.
    student_objective: Compare failure consequences under coupled and independent execution.
  - id: v2_01_D
    part: D
    title: Partition consequences
    investigation_title: What remains available during a partition?
    source_concepts:
    - chapter: 01_introduction
      concept: Synchronous tight coupling
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-introduction-traditional-vs-ml-fleet-dynamics-c43e
    - chapter: 01_introduction
      concept: CAP choice under partition
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-introduction-cap-theorem-reality-f3b0
    learning_claim: Waiting for fresh state and serving confirmed older state incur different consequences
      without a universal winner.
    tradeoff: Freshness versus availability under a declared partition.
    student_action: Hold request rate, duration, and affected fraction fixed; compare two policies.
    evidence_to_inspect: Unavailable and stale request counts, maximum model age, and affected scope.
    explanation_prompt: Defend the acceptable consequence for this deployment without claiming a CAP proof.
    reversal_condition: Reconsider when freshness requirements or tolerated interruption changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the mechanism
      requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_01_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements or
        certification. Retain unsupported paths and unresolved evidence. This request-count comparison illustrates
        explicit policy consequences; it does not prove the CAP theorem or model divergent training state.
    student_objective: Defend a freshness and availability policy under a specified partition.
