lab_concept_map:
  schema_version: 1
  lab_id: v2_10
  chapter: 10
  title: Serve acceptable requests on time at a sustainable cost
  source_notebook: labs/vol2/lab_10_inference.py
  source_chapter_concept_map: books/vol2/10_inference/inference_concepts.yml
  chapter_goal: Serve acceptable requests on time at a sustainable cost
  status: Chapter-primary investigations implemented with explicit bounded reference scopes; not production
    or classroom validation
  narrative:
    situation: Your project's new model is ready to serve, and requests arrive in bursts rather than
      one at a time. Larger batches may lower execution cost while making people wait; admitting more
      requests may exhaust the state kept in memory. Compare admission, batching, placement, and routing
      under the same budget before deciding how much traffic the service can accept on time.
    previously: A program-path improvement supplies a candidate execution plan, not proof of serving SLO compliance.
    next: Consider whether adaptation belongs at the devices, and whose devices can contribute.
    submission: A serving placement recommendation with equal-budget alternatives, admission, batching, degraded
      service and qualified-cost limitations. Include the bounded language-service scheduling and routing contrasts
      without attributing them to the native track device.
  core_concepts:
  - id: v2_10_A
    part: A
    title: Lifetime serving cost
    investigation_title: When does serving outweigh training?
    source_concepts:
    - chapter: 10
      concept: Serving cost dominance
      concept_map: books/vol2/10_inference/inference_concepts.yml
      source_anchor: sec-inference-scale-serving-cost-dominates-training-cost-576a
    learning_claim: Recurring serving must be compared with training over the same explicit model-version lifetime.
    tradeoff: Per-request expense and traffic duration versus a one-time training investment.
    student_action: Vary the supported horizon or traffic assumptions with the same training cost and serving
      cost boundary.
    evidence_to_inspect: Training/serving totals and lifetime crossover; explicit request counts and horizon.
    explanation_prompt: Which input moves the crossover, and what accounting cost is omitted?
    reversal_condition: A shorter lifetime, lower traffic or changed cost per successful request can reverse
      the dominant cost.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_10_experiments
      functions:
      - lifetime_cost_crossover
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Illustrative cost assumptions; not an empirical commercial service bill.
    student_objective: Compare training and serving expense over one explicit lifetime.
  - id: v2_10_B
    part: B
    title: Concurrent request-state admission
    investigation_title: Why can a model fit while its service fails?
    source_concepts:
    - chapter: 10
      concept: KV cache as admission budget
      concept_map: books/vol2/10_inference/inference_concepts.yml
      source_anchor: sec-inference-scale-kv-cache-management-04ed
    learning_claim: Weights fitting does not establish that concurrent request state fits after reserves and
      fragmentation.
    tradeoff: More admitted work versus state capacity, fragmentation and rejected requests.
    student_action: Replay the same state requests with changed fragmentation/concurrency policy and inspect
      all rejected requests.
    evidence_to_inspect: Weight/reserve budget, state footprints, concurrent accepted records and rejections.
    explanation_prompt: Which state exhausts the budget and why does weight fit alone miss it?
    reversal_condition: A changed context/footprint mix, fragmentation or reserve can change admissible concurrency.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_10_experiments
      functions:
      - state_admission
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: State is KV only for a KV-using language workload; native vision/window state is not renamed
        KV. A labeled language reference is needed to assess KV-specific chapter mechanics.
    student_objective: Assess concurrent request admission under weights, state, reserves and fragmentation.
  - id: v2_10_C
    part: C
    title: Batch formation, iteration membership and prompt interference
    investigation_title: When does batching save work but miss deadlines?
    source_concepts:
    - chapter: 10
      concept: Batch formation trades waiting for reuse
      concept_map: books/vol2/10_inference/inference_concepts.yml
      source_anchor: sec-inference-scale-batching-strategies-scale-6733
    - chapter: 10
      concept: SLO goodput and the serving tax
      concept_map: books/vol2/10_inference/inference_concepts.yml
      source_anchor: sec-inference-scale-batching-strategies-scale-6733
    - chapter: 10
      concept: Iteration-level batching
      concept_map: books/vol2/10_inference/inference_concepts.yml
    - chapter: 10
      concept: Prefill-decode interference and chunked prefill
      concept_map: books/vol2/10_inference/inference_concepts.yml
    learning_claim: Batch formation reuses service work while adding collection wait; useful throughput counts
      only acceptable on-time results. Iteration admission recovers slots only with eligible waiting work and
      state capacity; chunking prefill shifts delay from active-token stalls into the new prompt first-token
      time.
    tradeoff: Execution reuse versus collection/queue wait and late or rejected outcomes. Slot reuse versus
      reserved state; active-token smoothness versus new-prompt latency.
    student_action: Replay identical arrivals and lengths under immediate and windowed batching. In separately
      labeled language references, vary reply mix, arrival spacing and history reservation; compare static/continuous
      iteration admission. Chunk one prompt and inspect TTFT versus the active stream token gap.
    evidence_to_inspect: Arrival-to-finish timeline, batch work, empirical tail, rejected requests and on-time
      denominator. Inspect iteration membership, idle slots and infeasible state, then conserved prefill work,
      prompt TTFT and maximum active-token gap.
    explanation_prompt: Which saved work is offset by waiting, and does the apparent throughput gain survive
      the deadline? Why can equal replies or sparse arrivals erase the slot-refill gain, and why is smoother
      streaming not free prefill acceleration?
    reversal_condition: A changed deadline or arrival mix can reverse the batch-window choice.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_10_experiments
      functions:
      - replay_requests
      - qualified_cost
      - language_batching_reference
      - language_scheduling_reference
      - language_scheduling_to_snapshot
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Native windowed batches remain distinct from separate language-service references. Decode-only
        iteration membership and single-stream prompt interference use shared supplied timing fixtures, not
        device calibration; no paging, output KV growth, or scheduling overhead.
    student_objective: Compare request batching, iteration membership and prefill chunking using complete timelines
      and separate language-service references.
  - id: v2_10_D
    part: D
    title: Equal-budget serving placement
    investigation_title: Replicate, shard, or split phases?
    source_concepts:
    - chapter: 10
      concept: Serving parallelism chosen by the SLO
      concept_map: books/vol2/10_inference/inference_concepts.yml
      source_anchor: sec-inference-scale-model-sharding-inference-82b3
    learning_claim: A placement must meet the same workload/format/SLO with equal devices and price its communication
      and state boundary.
    tradeoff: Replica concurrency versus pooled state, boundary transfers and phase handoff.
    student_action: Compare supported replication, sharding and phase split under equal device count; preserve
      unsupported outcomes.
    evidence_to_inspect: Complete request outcomes, transfer per request, state fit, device budget and SLO-qualified
      completions.
    explanation_prompt: Which architecture meets the contract, and which new communication or queue boundary
      does it introduce?
    reversal_condition: A larger state footprint, different arrivals or higher handoff cost can reverse placement.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_10_experiments
      functions:
      - compare_equal_budget_placements
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Compact phase model has no pipeline overlap; unsupported endpoint fabrics remain unavailable
        rather than assigned fabricated speedups.
    student_objective: Defend a supported serving placement under the same workload and device budget.
  - id: v2_10_E
    part: E
    title: Serving headroom and state-aware routing
    investigation_title: What happens when a replicated pool loses capacity?
    source_concepts:
    - chapter: 10
      concept: SLO goodput and the serving tax
      concept_map: books/vol2/10_inference/inference_concepts.yml
      source_anchor: sec-inference-scale-autoscaling-capacity-control
    - chapter: 10
      concept: State-aware request routing
      concept_map: books/vol2/10_inference/inference_concepts.yml
    learning_claim: A healthy-pool success does not establish deadline compliance after replica loss and readiness
      delay. A separate language-service replay shows that request count can hide unfinished work, while a
      favorable work signal cannot override state-capacity admission.
    tradeoff: Spare ready capacity versus normal-operation utilization and cost. Routing by request count versus
      unfinished work, constrained by per-replica KV capacity.
    student_action: In a separate supplied replicated-pool reference, hold original arrivals fixed and vary
      lost replicas and wake/provisioning delay independently of Part D's architecture decision. In a separate
      language-service reference compare request-count and remaining-work routing; increase KV allocations
      and inspect atomic candidate checks and rejections.
    evidence_to_inspect: Healthy and degraded completion counts, complete queue timeline and deadline-qualified
      fraction. Count/work signals, per-candidate KV admission, all offered requests and on-time outcomes in
      the routing reference.
    explanation_prompt: Which requests lose their budget to capacity shortage or startup, and what reserve
      would address it? Which candidate looks preferable by unfinished work but cannot reserve the arriving
      request state?
    reversal_condition: A changed failure size, burst pattern or readiness delay can invalidate the planned
      reserve.
    scope: Two explicitly separate replicated-pool and language-routing references; neither evaluates failure
      of the placement selected in Part D.
    implementation:
      engine: mlsysim.labs.experiments.v2_10_experiments
      functions:
      - replay_requests
      - language_routing_reference
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Failure replay remains separate from Part D. Language routing uses fresh observations, fixed
        KV reservations and serial work fixtures; no stale-probe race, paging, retries, dynamic autoscaler
        or production timing claim.
    student_objective: Assess replica loss and readiness, then compare count and remaining-work routing under
      atomic state admission.
