    status: bounded investigation; inspect limitations
  - concept: SLO goodput and the serving tax
    parts:
    - C
    - E
    status: bounded investigation; inspect limitations
  - concept: Batch formation trades waiting for reuse
    parts:
    - C
    status: bounded investigation; inspect limitations
  - concept: Iteration-level batching
    parts:
    - C
    status: bounded language-service reference; explicit finite traces and timing assumptions
  - concept: Prefill-decode interference and chunked prefill
    parts:
    - C
    status: bounded language-service reference; explicit finite traces and timing assumptions
  - concept: KV cache as admission budget
    parts:
    - B
    status: bounded investigation; inspect limitations
  - concept: Serving parallelism chosen by the SLO
    parts:
