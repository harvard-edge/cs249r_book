lab_concept_map:
  student_goals:
  - Compare feature and outcome monitors on labeled shift, corruption, and attack traces.
  - Compare accepted-request risk, coverage, and downstream fallback capacity.
  - Compare matched defense evidence, replay ordered poisoning gates, and trace affected artifacts without
    claiming repaired weights.
  - Qualify finite conformal coverage and separate generated-answer routing signals from support against a
    named, versioned evidence source.
  runtime_parts:
  - part: A
    title: Can a feature monitor see every silent failure?
    question: Can a feature monitor see every silent failure?
    goal: Compare feature and outcome monitors on labeled shift, corruption, and attack traces.
    concept_ids:
    - v2_14_A
    coverage: implemented_scoped_fixture
    limitation: Causal root cause is supplied by fixture; these traces do not establish all real-world shift
      classes or a production remedy.
    next: 'Continue to Part B: How much work does abstention move downstream?'
  - part: B
    title: How much work does abstention move downstream?
    question: How much work does abstention move downstream?
    goal: Compare accepted-request risk, coverage, and downstream fallback capacity.
    concept_ids:
    - v2_14_B
    coverage: implemented_scoped_fixture
    limitation: No clinical or driving safety claim; finite supplied outcomes and bounded fallback models.
    next: 'Continue to Part C: Does the defense match the threat and envelope?'
  - part: C
    title: Does the defense match the threat and envelope?
    question: Does the defense match the threat and envelope?
    goal: Compare matched defense evidence, replay ordered poisoning gates, and trace affected artifacts without
      claiming repaired weights.
    concept_ids:
    - v2_14_C
    coverage: implemented_scoped_fixture
    limitation: Finite supplied flags and clean/trigger outcomes only; training-influence review does not train
      a robust model, lineage does not repair weights, and unknown threats remain unevaluated.
    next: 'Continue to Part D: When does finite calibration force a full set?'
  - part: D
    title: When does finite calibration force a full set?
    question: When does finite calibration force a full set?
    goal: Qualify finite conformal coverage and separate generated-answer routing signals from support against
      a named, versioned evidence source.
    concept_ids:
    - v2_14_D
    coverage: implemented_scoped_fixture
    limitation: Exchangeability is declared rather than tested. Generated-answer support is supplied adjudication
      on four prompts and a fixed decode protocol; sequence/check counts are not latency, energy, or future
      factuality guarantees.
    next: Price feasible robustness and fallback choices inside an absolute power, energy, and environmental
      account.
  schema_version: 1
  lab_id: v2_14
  chapter: 14
  title: Robust AI
  source_notebook: labs/vol2/lab_14_robust_ai.py
  source_chapter_concept_map: books/vol2/14_robust_ai/robust_ai_concepts.yml
  chapter_goal: Diagnose silent failure, bound defense and fallback decisions, replay layered poisoning response,
    and distinguish label coverage from generated-claim evidence.
  narrative:
    situation: The project's uptime and response-time dashboards remain healthy, but one group of users
      reports worse outcomes. A feature monitor has not raised an alert. Explore what each signal can
      establish, when refusing a prediction transfers work to another team, and which protection matches
      the suspected failure before recommending a remedy.
    previously: The security review bounded adversary capabilities and privacy claims. It did not demonstrate
      behavioral competence under every shift.
    next: Price feasible robustness and fallback choices inside an absolute power, energy, and environmental
      account.
    submission: A bounded robustness decision with matched traces, fallback loads, named attack scope, calibration
      limits, and a reversal condition.
  core_concepts:
  - id: v2_14_A
    part: A
    title: Shift taxonomy
    investigation_title: Can a feature monitor see every silent failure?
    objective: Compare feature and outcome monitors on labeled shift, corruption, and attack traces.
    source_concepts:
    - chapter: 14
      concept: Shift taxonomy
      concept_map: books/vol2/14_robust_ai/robust_ai_concepts.yml
      source_anchor: sec-robust-ai-distribution-shift-concept-drift-55e2
      role: primary
    - chapter: 14
      concept: Drift alert to model update
      concept_map: books/vol2/14_robust_ai/robust_ai_concepts.yml
      source_anchor: sec-robust-ai-monitoring-adaptation-strategies-f305
      role: primary
    - chapter: 14
      concept: Distinguishing faults from shift
      concept_map: books/vol2/14_robust_ai/robust_ai_concepts.yml
      source_anchor: sec-robust-ai-fault-shift-diagnosis
      role: primary
    learning_claim: Faster or broader alerts require observable labels; feature movement alone does not identify
      the cause.
    tradeoff: Faster or broader alerts require observable labels; feature movement alone does not identify
      the cause.
    student_action: Select a labeled trace, vary label delay, and compare feature-only with feature-plus-label
      monitoring.
    evidence_to_inspect: Feature total variation, outcome error, event time, observation time, false alarms,
      and missed periods.
    explanation_prompt: What additional replay or release correlation would distinguish a preprocessing fault
      from environmental shift?
    reversal_condition: Change label availability or choose a trace whose inputs remain stable while outcomes
      change.
    scope: Fixture traces and detection timing; alerting does not retrain or repair the model.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_14_experiments: monitor_experiment_payload; evaluate_monitor'
      status: implemented_scoped_fixture
      limitations: Causal root cause is supplied by fixture; these traces do not establish all real-world shift
        classes or a production remedy.
  - id: v2_14_B
    part: B
    title: Per-request competence contract
    investigation_title: How much work does abstention move downstream?
    objective: Compare accepted-request risk, coverage, and downstream fallback capacity.
    source_concepts:
    - chapter: 14
      concept: Per-request competence contract
      concept_map: books/vol2/14_robust_ai/robust_ai_concepts.yml
      source_anchor: sec-robust-ai-selective-prediction
      role: primary
    learning_claim: Stricter acceptance may improve accepted-case risk while increasing fallback load and cohort
      exposure.
    tradeoff: Stricter acceptance may improve accepted-case risk while increasing fallback load and cohort
      exposure.
    student_action: Sweep confidence threshold at fixed scored cases, then change fallback capacity separately.
    evidence_to_inspect: Coverage-risk curve, fallback arrivals, cohort breakdown, capacity, and overflow.
    explanation_prompt: Which outcome changes because requests are accepted differently, and which changes
      only because fallback capacity changes?
    reversal_condition: Reduce fallback capacity or shift the cohort mix and revisit the threshold.
    scope: Deterministic labeled confidence fixture; confidence is not a universal competence certificate.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_14_experiments: selective_experiment_payload; evaluate_selective_prediction'
      status: implemented_scoped_fixture
      limitations: No clinical or driving safety claim; finite supplied outcomes and bounded fallback models.
  - id: v2_14_C
    part: C
    title: Adversarial robustness for a named threat model
    investigation_title: Does the defense match the threat and envelope?
    objective: Compare matched defense evidence, replay ordered poisoning gates, and trace affected artifacts
      without claiming repaired weights.
    source_concepts:
    - chapter: 14
      concept: Adversarial robustness for a named threat model
      concept_map: books/vol2/14_robust_ai/robust_ai_concepts.yml
      source_anchor: sec-robust-ai-adversarial-attack-defenses-1dc8
      role: primary
    - chapter: 14
      concept: Robustness per failure class
      concept_map: books/vol2/14_robust_ai/robust_ai_concepts.yml
      source_anchor: sec-robust-ai-unified-framework-robust-ai-b25d
      role: primary
    - chapter: 14
      concept: Layered poisoning defense
      concept_map: books/vol2/14_robust_ai/robust_ai_concepts.yml
      source_anchor: sec-robust-ai-data-poisoning-defenses-d070
      role: primary
    learning_claim: Scoped defense benefit carries cost; layered pipeline checks also lose legitimate data,
      while lineage bounds historical reversal without repairing weights.
    tradeoff: Scoped defense benefit carries cost; layered pipeline checks also lose legitimate data, while
      lineage bounds historical reversal without repairing weights.
    student_action: Hold the inference defense fixed; add ingress, anomaly, training-influence review, and
      post-training checks one at a time, then toggle lineage alone.
    evidence_to_inspect: Defense scope and cost; record dispositions, legitimate quarantines, fixed clean versus
      trigger probes, promotion decision, and identified descendants.
    explanation_prompt: Which layer catches each supplied incident record, which legitimate record is lost,
      and why does lineage not repair an already deployed descendant?
    reversal_condition: Use a trusted-source poison that bypasses raw anomaly screening or remove historical
      lineage.
    scope: Independent supplied defense outcomes and ordered pipeline incident; no fresh model training or
      automatic artifact repair.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_14_experiments: robustness_review_payload; poisoning_experiment_payload'
      status: implemented_scoped_fixture
      limitations: Finite supplied flags and clean/trigger outcomes only; training-influence review does not
        train a robust model, lineage does not repair weights, and unknown threats remain unevaluated.
  - id: v2_14_D
    part: D
    title: Per-request competence contract
    investigation_title: When does finite calibration force a full set?
    objective: Qualify finite conformal coverage and separate generated-answer routing signals from support
      against a named, versioned evidence source.
    source_concepts:
    - chapter: 14
      concept: Per-request competence contract
      concept_map: books/vol2/14_robust_ai/robust_ai_concepts.yml
      source_anchor: sec-robust-ai-selective-prediction
      role: primary
    - chapter: 14
      concept: Generative reliability
      concept_map: books/vol2/14_robust_ai/robust_ai_concepts.yml
      source_anchor: sec-robust-ai-robustness-generative-ai-941b
      role: primary
    learning_claim: Finite calibration can force full label sets, while low entropy and sample agreement can
      confidently repeat unsupported claims and extra routing creates review work.
    tradeoff: Finite calibration can force full label sets, while low entropy and sample agreement can confidently
      repeat unsupported claims and extra routing creates review work.
    student_action: Change conformal calibration independently; compare entropy, sample agreement, and evidence
      routing on fixed answers, then switch only the handbook version.
    evidence_to_inspect: Corrected rank and exchangeability premise; per-prompt evidence support, current-reference
      errors, diverted requests, decode sequences, and evidence-check counts.
    explanation_prompt: Why can repeated agreement miss a false answer, why can an archived source endorse
      obsolete advice, and which errors originate in retrieval versus generation?
    reversal_condition: Change the reference version or routing policy while holding the prompt set and recorded
      generations fixed.
    scope: Finite conformal label fixture and separate generated-claim adjudications; neither supplies general
      safety or factuality certification.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_14_experiments: competence_review_payload; generative_reliability_payload'
      status: implemented_scoped_fixture
      limitations: Exchangeability is declared rather than tested. Generated-answer support is supplied adjudication
        on four prompts and a fixed decode protocol; sequence/check counts are not latency, energy, or future
        factuality guarantees.
