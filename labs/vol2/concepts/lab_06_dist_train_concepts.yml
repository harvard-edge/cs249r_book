lab_concept_map:
  schema_version: 1
  lab_id: v2_06
  chapter: 6
  title: Distributed Training
  source_notebook: labs/vol2/lab_06_dist_train.py
  source_chapter_concept_map: books/vol2/06_distributed_training/distributed_training_concepts.yml
  chapter_goal: Defend a parallel training plan against memory, communication, pipeline, and time-to-target
    limits.
  narrative:
    situation: Your project needs a new model, and the training team wants to finish sooner by using
      more accelerators. One proposal replicates work; another divides model state; a third changes the
      pipeline. Explore which plan fits the available machines and links, then check whether faster steps
      really reach the same quality target sooner. For compact deployments, this investigation concerns
      the upstream training cluster.
    previously: The team has studied collective contracts and schedule costs; it must now combine them
      with memory and convergence.
    next: Make useful progress survive routine failures in Fault Tolerance.
    submission: 'One integrated decision memo: saved comparisons, causal explanation, rejected alternative,
      remaining uncertainty, and reversal trigger. A supported hold is valid.'
  core_concepts:
  - id: v2_06_A
    part: A
    title: Update equivalence and scaling
    investigation_title: When do additional workers stop helping?
    source_concepts:
    - chapter: 06_distributed_training
      concept: Data-parallel update equivalence
      concept_map: books/vol2/06_distributed_training/distributed_training_concepts.yml
      source_anchor: sec-distributed-training-systems-systems-data-parallelism-6132
    - chapter: 06_distributed_training
      concept: Scaling efficiency and the scaling wall
      concept_map: books/vol2/06_distributed_training/distributed_training_concepts.yml
      source_anchor: sec-distributed-training-scaling-math
    learning_claim: A valid-count-weighted gradient reduction preserves the global-batch update under
      unequal shards; scaling comparisons then require an explicit work denominator.
    tradeoff: More workers versus synchronization and changed global work.
    student_action: Repartition a fixed scalar-loss batch, contrast mean-of-worker-means with count-weighted
      reduction, repair the update, then compare strong and weak scaling.
    evidence_to_inspect: Worker counts and gradient sums, global versus reduced gradient, next-weight
      difference, step time, throughput, and efficiency.
    explanation_prompt: Why does equal-worker weighting fail with unequal valid-item counts, and which
      scaling gain preserves the same global work?
    reversal_condition: Reconsider when global batch or fabric capacity changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the
      mechanism requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_05_experiments
      status: implemented causal update-equivalence fixture and analytical scaling comparison
      limitations: Exact scalar squared-error SGD fixture demonstrates estimator arithmetic only. Sampling,
        optimizer-state matching, update order, convergence, and finite-precision reproducibility remain
        explicit assumptions.
    student_objective: Preserve the global-batch SGD update under unequal valid-item counts, then distinguish
      strong and weak scaling.
  - id: v2_06_B
    part: B
    title: Sharded state
    investigation_title: What does making the model fit cost?
    source_concepts:
    - chapter: 06_distributed_training
      concept: Sharded data parallelism
      concept_map: books/vol2/06_distributed_training/distributed_training_concepts.yml
      source_anchor: sec-distributed-training-systems-systems-memoryefficient-data-parallelism-zero-fsdp-0e69
    learning_claim: State sharding and activation policies relieve memory at a communication or recomputation
      cost.
    tradeoff: Capacity feasibility versus additional movement and compute.
    student_action: Compare replicated state with a ZeRO stage, then change activation policy.
    evidence_to_inspect: State categories, per-device memory, feasibility, and added communication/recompute.
    explanation_prompt: Which bytes were removed locally and what extra work replaced them?
    reversal_condition: Reconsider when state size or fast-domain bandwidth changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the
      mechanism requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_05_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements
        or certification. Retain unsupported paths and unresolved evidence.
    student_objective: Compare sharding and activation policies under a memory constraint.
  - id: v2_06_C
    part: C
    title: Parallel placement
    investigation_title: Where should each dimension run?
    source_concepts:
    - chapter: 06_distributed_training
      concept: Tensor parallelism in the fast domain
      concept_map: books/vol2/06_distributed_training/distributed_training_concepts.yml
      source_anchor: sec-distributed-training-systems-systems-hybrid-parallelism-12a0
    - chapter: 06_distributed_training
      concept: Parallelism plan as joint placement
      concept_map: books/vol2/06_distributed_training/distributed_training_concepts.yml
      source_anchor: sec-distributed-training-systems-systems-hybrid-parallelism-12a0
    learning_claim: Equal device counts can produce different costs because TP/DP/PP traffic crosses different
      tiers.
    tradeoff: Memory partitioning and concurrency versus communication locality and bubbles.
    student_action: Compare within-node TP, cross-node TP, and a pipeline factorization at equal device
      count.
    evidence_to_inspect: Factorization, memory gate, TP tier/time, DP synchronization, and pipeline overhead.
    explanation_prompt: Which dependency crosses the slower tier in the rejected layout?
    reversal_condition: Reconsider when node width or link-tier ratio changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the
      mechanism requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_05_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements
        or certification. Retain unsupported paths and unresolved evidence.
    student_objective: Defend placement of parallel dimensions across hardware tiers.
  - id: v2_06_D
    part: D
    title: Pipeline schedule
    investigation_title: Can a smaller bubble cause another failure?
    source_concepts:
    - chapter: 06_distributed_training
      concept: Pipeline parallelism bubble
      concept_map: books/vol2/06_distributed_training/distributed_training_concepts.yml
      source_anchor: sec-distributed-training-systems-systems-pipeline-parallelism-8748
    learning_claim: More microbatches can reduce bubble fraction while increasing retained activations.
    tradeoff: Pipeline utilization versus worst-stage activation memory.
    student_action: Hold microbatch size and stages fixed while increasing count.
    evidence_to_inspect: Fill/drain fraction, activation retention, and first memory failure.
    explanation_prompt: Why does a better utilization fraction not establish a feasible schedule?
    reversal_condition: Reconsider when schedule policy or memory capacity changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the
      mechanism requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_05_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements
        or certification. Retain unsupported paths and unresolved evidence.
    student_objective: Evaluate a microbatch schedule for utilization and memory feasibility.
  - id: v2_06_E
    part: E
    title: Time to quality
    investigation_title: Is the fastest step the best policy?
    source_concepts:
    - chapter: 06_distributed_training
      concept: Critical batch size
      concept_map: books/vol2/06_distributed_training/distributed_training_concepts.yml
      source_anchor: sec-distributed-training-systems-systems-critical-batch-size-parallelism-hurt-4961
    - chapter: 06_distributed_training
      concept: Synchronization models and stragglers
      concept_map: books/vol2/06_distributed_training/distributed_training_concepts.yml
      source_anchor: sec-distributed-training-systems-systems-synchronization-models-396f
    learning_claim: Training policy must compare elapsed time to a quality target rather than step time
      alone.
    tradeoff: Faster updates or less waiting versus convergence and stale-update costs.
    student_action: Compare supplied synchronization/batch policies on the same target and illustrative
      convergence fixture.
    evidence_to_inspect: Step time, straggler assumptions, steps/target, and target attainment.
    explanation_prompt: Which policy has defensible time-to-target evidence and which conclusion is fixture-dependent?
    reversal_condition: Reconsider when matched convergence or straggler evidence changes.
    scope: Fleet-level illustrative experiment; compact deployments use their stated backend when the
      mechanism requires coupled accelerators.
    implementation:
      engine: mlsysim.labs.experiments.v2_05_experiments
      status: existing analytical notebook; learning contract authored; shared opening and learning route
        integrated
      limitations: Analytical estimates and explicitly supplied fixtures are not production measurements
        or certification. Retain unsupported paths and unresolved evidence.
    student_objective: Compare training policies using elapsed time to a common quality target.
