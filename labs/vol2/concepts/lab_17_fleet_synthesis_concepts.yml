lab_concept_map:
  student_goals:
  - Audit whether inherited artifacts can support this configuration before interpreting their results.
  - Diagnose changes in compute, communication, and coordination at fixed useful work.
  - Compare throughput-related behavior with request completion and absolute facility constraints.
  - Compare independent repairs from one frozen failure under equal stated cost.
  - Test one carried repair under a disclosed new condition and bound the resulting deployment decision.
  runtime_parts:
  - part: A
    title: Which inherited evidence can we trust?
    question: Which inherited evidence can we trust?
    goal: Audit whether inherited artifacts can support this configuration before interpreting their results.
    concept_ids:
    - v2_17_A
    coverage: implemented_scoped_fixture
    limitation: Missing evidence is not failed physics. The complete prior-discussion dossier preserves governance
      conditions separately; a physical case result does not grant project deployment clearance.
    next: 'Continue to Part B: When does scale stop improving useful work?'
  - part: B
    title: When does scale stop improving useful work?
    question: When does scale stop improving useful work?
    goal: Diagnose changes in compute, communication, and coordination at fixed useful work.
    concept_ids:
    - v2_17_B
    coverage: implemented_scoped_fixture
    limitation: Illustrative instructor scenario and simple fixed-work decomposition; not measured production
      scaling.
    next: 'Continue to Part C: Can a fast fleet still violate its obligations?'
  - part: C
    title: Can a fast fleet still violate its obligations?
    question: Can a fast fleet still violate its obligations?
    goal: Compare throughput-related behavior with request completion and absolute facility constraints.
    concept_ids:
    - v2_17_C
    coverage: implemented_scoped_fixture
    limitation: Not a full fleet security, fairness, or governance evaluator; unsupported obligations must
      remain open.
    next: 'Continue to Part D: Which equal-budget repair survives the whole fleet?'
  - part: D
    title: Which equal-budget repair survives the whole fleet?
    question: Which equal-budget repair survives the whole fleet?
    goal: Compare independent repairs from one frozen failure under equal stated cost.
    concept_ids:
    - v2_17_D
    coverage: implemented_scoped_fixture
    limitation: Budget units and repair effects are scenario assumptions; equal cost does not imply production
      interchangeability. No-feasible and hold are legitimate outcomes.
    next: 'Continue to Part E: Does the repair survive a held-out condition?'
  - part: E
    title: Does the repair survive a held-out condition?
    question: Does the repair survive a held-out condition?
    goal: Test one carried repair under a disclosed new condition and bound the resulting deployment decision.
    concept_ids:
    - v2_17_E
    coverage: implemented_scoped_fixture
    limitation: Finite scenario support cannot certify all future fleet behavior or substitute for a real
      deployment pilot.
    next: Finish with a deployment dossier and a new-condition prediction, not a blanket completion or mastery
      badge.
  schema_version: 1
  lab_id: v2_17
  chapter: 17
  title: Fleet Synthesis
  source_notebook: labs/vol2/lab_17_fleet_synthesis.py
  source_chapter_concept_map: books/vol2/17_conclusion/conclusion_concepts.yml
  chapter_goal: Replay inherited evidence, diagnose a cross-layer failure, compare equal-budget repairs, and
    defend a bounded fleet decision.
  narrative:
    situation: The team brings your project's expansion proposal to a final review. Each specialist can
      point to a local improvement, but the complete service must still communicate, recover, serve requests,
      fit the facility, and meet its obligations to users. Revisit the evidence you actually have, compare
      repairs under the same budget, and test whether the recommendation survives a condition it was
      not tuned for.
    previously: Earlier chapters produced scoped evidence and decisions. Only compatible replayable records
      can support the current configuration; gaps require labeled starting cases.
    next: Finish with a deployment dossier and a new-condition prediction, not a blanket completion or mastery
      badge.
    submission: 'One fleet decision: release, restrict, or defer; cited replayed evidence, rejected equal-budget
      repair, unresolved obligation, and measurable reevaluation condition.'
  core_concepts:
  - id: v2_17_A
    part: A
    title: Evaluation contract
    investigation_title: Which inherited evidence can we trust?
    objective: Audit whether inherited artifacts can support this configuration before interpreting their
      results.
    source_concepts:
    - chapter: 12
      concept: Evaluation contract
      concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
      source_anchor: sec-ops-scale-end-to-end-evaluation-contract
      role: primary
    learning_claim: Reusing evidence saves work only when identity, units, evaluator, and conditions remain
      compatible.
    tradeoff: Reusing evidence saves work only when identity, units, evaluator, and conditions remain compatible.
    student_action: Compare student-only evidence with explicitly labeled instructor fallback, replay required physical
      records, and inspect the complete prior-discussion dossier including governance obligations.
    evidence_to_inspect: Chapter, track, evaluator, replay result, source label, immutable discussion fingerprint, saved judgment,
      reversal trigger, remaining risk, missing or incompatible status.
    explanation_prompt: Which carried claims are student evidence and which are supplied starting assumptions?
    reversal_condition: Change track, evaluator, model, or conditions and rerun compatibility checks.
    scope: Replays required physical chapter 1, 7, 10, and 15 contracts; carries all sixteen prior scoped discussions,
      their immutable fingerprints, saved recommendations, reversal triggers, and remaining risks. Governance conditions
      remain explicit handoff obligations rather than automatic physical-case approval.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_17_experiments: audit_ledger_evidence; replay_evidence'
      status: implemented_scoped_fixture
      limitations: Missing evidence is not failed physics. Security, robustness, and governance obligations
        are not automatically incorporated into the physical capstone gate.
  - id: v2_17_B
    part: B
    title: Fleet Law
    investigation_title: When does scale stop improving useful work?
    objective: Diagnose changes in compute, communication, and coordination at fixed useful work.
    source_concepts:
    - chapter: 1
      concept: Fleet Law
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: sec-vol2-introduction-fleet-law
      role: primary
    - chapter: 1
      concept: C3 taxonomy
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: dfn-introduction-c3-taxonomy
      role: primary
    learning_claim: Adding workers reduces a compute term while fabric and coordination costs can grow.
    tradeoff: Adding workers reduces a compute term while fabric and coordination costs can grow.
    student_action: Apply scale stress and compare the visible time components with baseline.
    evidence_to_inspect: Compute, communication, coordination, stated overlap, step time, and dominant term.
    explanation_prompt: Which term moved the binding constraint, and why is accelerator count insufficient
      evidence of improvement?
    reversal_condition: Change bandwidth, startup, or synchronization cost before extending the scaling claim.
    scope: Backend training cluster for device fleets; no MCU collective training.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_17_experiments: evaluate_configuration; evaluate_c3_scaling'
      status: implemented_scoped_fixture
      limitations: Illustrative instructor scenario and simple fixed-work decomposition; not measured production
        scaling.
  - id: v2_17_C
    part: C
    title: SLO goodput and the serving tax
    investigation_title: Can a fast fleet still violate its obligations?
    objective: Compare throughput-related behavior with request completion and absolute facility constraints.
    source_concepts:
    - chapter: 10
      concept: SLO goodput and the serving tax
      concept_map: books/vol2/10_inference/inference_concepts.yml
      source_anchor: sec-inference-scale-serving-tax-overhead-distribution-5ef3
      role: primary
    - chapter: 15
      concept: Power ceiling versus energy account
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-energy-wall
      role: primary
    learning_claim: Fast training or service on completed requests can coexist with rejections, latency failures,
      or energy/power limits.
    tradeoff: Fast training or service on completed requests can coexist with rejections, latency failures,
      or energy/power limits.
    student_action: Change serving condition and work demand while retaining the C3 configuration.
    evidence_to_inspect: Complete request durations, rejection/completion checks, absolute energy, facility
      limits, unknown constraints.
    explanation_prompt: Which independent obligation fails despite the favorable speed metric?
    reversal_condition: Increase offered work or change service durations while retaining the same training
      speed.
    scope: Simulated serving pool and backend energy account; independent evidence status.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_17_experiments: obligation_stress; evaluate_configuration'
      status: implemented_scoped_fixture
      limitations: Not a full fleet security, fairness, or governance evaluator; unsupported obligations must
        remain open.
  - id: v2_17_D
    part: D
    title: Fleet stack
    investigation_title: Which equal-budget repair survives the whole fleet?
    objective: Compare independent repairs from one frozen failure under equal stated cost.
    source_concepts:
    - chapter: 1
      concept: Fleet stack
      concept_map: books/vol2/01_introduction/introduction_concepts.yml
      source_anchor: fig-fleet-stack
      role: primary
    - chapter: 15
      concept: Sustainability measurement contract
      concept_map: books/vol2/15_sustainable_ai/sustainable_ai_concepts.yml
      source_anchor: sec-sustainable-ai-systematic-energy-metrics-5779-5779
      role: primary
    learning_claim: Fixing fabric or serving capacity can add power and energy; an energy remedy may leave
      communication unchanged.
    tradeoff: Fixing fabric or serving capacity can add power and energy; an energy remedy may leave communication
      unchanged.
    student_action: Choose and reject equal-budget repair plans after replaying every constraint on the same
      stressed baseline.
    evidence_to_inspect: Repair cost, changed components, step time, serving and energy checks, infeasible
      alternatives.
    explanation_prompt: What failure does the selected repair address, what cost does it add, and why is the
      rejected repair worse here?
    reversal_condition: Shift the active bottleneck or tighten a non-target constraint.
    scope: Cross-layer repair synthesis; source concept applied rather than a new optimization theory.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_17_experiments: compare_equal_budget_repairs; evaluate_configuration'
      status: implemented_scoped_fixture
      limitations: Budget units and repair effects are scenario assumptions; equal cost does not imply production
        interchangeability. No-feasible and hold are legitimate outcomes.
  - id: v2_17_E
    part: E
    title: Evaluation contract
    investigation_title: Does the repair survive a held-out condition?
    objective: Test one carried repair under a disclosed new condition and bound the resulting deployment
      decision.
    source_concepts:
    - chapter: 12
      concept: Evaluation contract
      concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
      source_anchor: sec-ops-scale-end-to-end-evaluation-contract
      role: primary
    learning_claim: A repair useful in the observed failure may not preserve other obligations under changed
      demand or capacity.
    tradeoff: A repair useful in the observed failure may not preserve other obligations under changed demand
      or capacity.
    student_action: Carry the chosen repair into an adverse condition and compare complete constraint results.
    evidence_to_inspect: Carried configuration, changed inputs, held-out results, unknowns, and decision reversal
      condition.
    explanation_prompt: Which claim survives this replay and which remains a prediction outside tested conditions?
    reversal_condition: A new condition that crosses the saved reversal threshold forces restrict, defer,
      or revalidation.
    scope: Held-out scenario replay; no new chapter primary concepts and no automatic mastery.
    implementation:
      engine: 'mlsysim.labs.experiments.v2_17_experiments: adverse_condition; evaluate_configuration; record_deployment_decision'
      status: implemented_scoped_fixture
      limitations: Finite scenario support cannot certify all future fleet behavior or substitute for a real
        deployment pilot.
  chapter_primary_coverage: []
