lab_concept_map:
  schema_version: 1
  lab_id: v2_12
  chapter: 12
  title: Operate and change a coupled model portfolio
  source_notebook: labs/vol2/lab_12_ops_scale.py
  source_chapter_concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
  chapter_goal: Operate and change a coupled model portfolio
  status: bounded chapter-primary investigations with explicit deterministic assumptions
  narrative:
    situation: Your project now depends on models and data artifacts maintained by several teams. A shared
      update is ready just as an operational incident begins. Trace who depends on the changed version,
      choose a limited rollout, and decide which alerts deserve attention. Explore whether a platform
      reduces repeated work while keeping release and recovery responsibilities clear.
    previously: Adaptation adds versions, cohorts and evidence obligations to the existing service fleet.
    next: Define threats and security/privacy boundaries for this shared operating system.
    submission: One fleet operations decision supported by adoption cost, dependency reach, canary evidence,
      incident harm and version-bound release records.
  core_concepts:
  - id: v2_12_A
    part: A
    title: Coupling, adoption and useful utilization
    investigation_title: Why does the same model count create different operating work?
    source_concepts:
    - chapter: 12
      concept: Operational load follows coupling
      concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
      source_anchor: sec-ml-operations-scale-nmodels-problem-fcff
    - chapter: 12
      concept: Utilization as the economic invariant
      concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
      source_anchor: sec-ml-operations-scale-build-vs-buy
    learning_claim: Graph density determines interface-review obligations; platform adoption and owning capacity
      have separate economic break-even conditions.
    tradeoff: Central platform cost and concentrated dependencies versus duplicated per-model toil.
    student_action: Hold model count fixed while changing topology, then vary adoption and useful utilization
      in separate same-horizon cost comparisons.
    evidence_to_inspect: Actual versus possible review pairs, marginal new-model pairs, platform cost, annualized
      owned/rental cost and useful-utilization threshold.
    explanation_prompt: Why does adding one model create different obligations in a chain and a dense graph,
      and when does low useful utilization reverse ownership economics?
    reversal_condition: Lower sustained adoption or higher shared operating burden can reverse break-even.
    scope: bounded chapter-primary investigation; explicit assumptions and transfer limitations
    implementation:
      engine: mlsysim.labs.experiments.v2_12_experiments
      functions:
      - evaluate_coupling
      - evaluate_portfolio
      - evaluate_ownership
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Counts hypothetical undirected review obligations rather than actual conflict probability
        or engineer effort. Annualized capacity scenario excludes financing, idle power, staffing and committed
        rentals; not hardware price estimates.
    student_objective: Distinguish coupling obligations, adoption savings and the useful-utilization ownership
      threshold.
  - id: v2_12_B
    part: B
    title: Dependency compatibility and feature-time consistency
    investigation_title: Which consumers does one upstream change block?
    source_concepts:
    - chapter: 12
      concept: Dependency-aware registry
      concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
      source_anchor: sec-ml-operations-scale-dependency-tracking-1d7e
    - chapter: 12
      concept: Feature consistency contract
      concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
      source_anchor: sec-ml-operations-scale-freshness-slos-6912
    learning_claim: Version-compatible inputs can still leak future-available data; historical joins must reconstruct
      what serving could access at prediction time.
    tradeoff: Shared reusable artifacts versus wider compatibility and rollback obligations.
    student_action: Trace a changed upstream version and compare event-only with availability-filtered historical
      feature joins.
    evidence_to_inspect: Changed versions, compatible and blocked consumer paths, impact set and rollback scope.
    explanation_prompt: Why can the latest event precede prediction while its feature is still unavailable,
      and why does version compatibility not prevent that leakage?
    reversal_condition: A compatible consumer release or new dependency edge changes the impact set.
    scope: bounded chapter-primary investigation; explicit assumptions and transfer limitations
    implementation:
      engine: mlsysim.labs.experiments.v2_12_experiments
      functions:
      - evaluate_dependency
      - evaluate_feature_join
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Finite dependency graph and delayed-arrival trace; no feature-store performance, quality-loss
        estimate or full streaming simulation.
    student_objective: Trace version compatibility and demonstrate availability-time training-serving consistency.
  - id: v2_12_C
    part: C
    title: Canary exposure and observable evidence
    investigation_title: When is the canary informative enough?
    source_concepts:
    - chapter: 12
      concept: Staged rollout exposure budget
      concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
      source_anchor: sec-ml-operations-scale-staged-rollout-strategies-2d1f
    learning_claim: Exposure does not equal observed labels; every required cohort must meet the predeclared
      evidence floor.
    tradeoff: Larger traffic share and longer observation versus user exposure and delayed outcomes.
    student_action: Vary canary share and duration at fixed traffic/cohort label assumptions.
    evidence_to_inspect: Exposed requests, labels available by finish, per-cohort evidence gates and label
      delay.
    explanation_prompt: Which cohort prevents promotion and why does a larger exposed count not guarantee adequate
      evidence?
    reversal_condition: A changed label delay or rare-cohort rate can require a different rollout schedule.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_12_experiments
      functions:
      - evaluate_canary
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Evidence counts are policy floors, not statistical significance, power or effect estimates.
    student_objective: Evaluate canary readiness from cohort-specific observable evidence and exposure.
  - id: v2_12_D
    part: D
    title: Fleet alert routing and separate SLO budgets
    investigation_title: Which signals deserve a page, and which budget blocks promotion?
    source_concepts:
    - chapter: 12
      concept: Hierarchical fleet alerting
      concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
      source_anchor: sec-ml-operations-scale-hierarchical-monitoring-architecture-407d
    - chapter: 12
      concept: SLO vector of budgets
      concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
      source_anchor: sec-ml-operations-scale-production-debugging-incident-response-9449
    learning_claim: Independent checks multiply raw false crossings; common-cause routing retains diagnostics
      and urgent local pages. Any exhausted service dimension blocks promotion even when availability remains
      healthy.
    tradeoff: Detection, containment and restoration investment versus affected requests before full recovery.
    student_action: Vary calibrated null false-positive rate, incident dimension and duration; compare raw
      crossings with routed shared-cause pages and separate SLO budget consumption before evaluating response-stage
      harm.
    evidence_to_inspect: Null-crossing probability and expectation, flat/grouped incident pages, preserved
      diagnostic records, per-dimension burn and budget consumption, promotion gate and response-stage harm.
    explanation_prompt: Why does grouping pages neither fix stale features nor establish statistical detection
      power, and which exhausted budget prevents promotion?
    reversal_condition: A different incident rate, stage bottleneck or coupled failure changes the best investment.
    scope: bounded chapter-primary investigation; explicit assumptions and transfer limitations
    implementation:
      engine: mlsysim.labs.experiments.v2_12_experiments
      functions:
      - evaluate_monitoring
      - evaluate_incident
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Independent calibrated null arithmetic is separate from deterministic common-cause routing;
        no false-page precision or detection power claim. Four explicit toy SLO policies start with zero prior
        consumption in one fixed window; response trace is a separate secondary model.
    student_objective: Separate statistical crossings, hierarchical routing, service-budget burn and incident
      response harm.
  - id: v2_12_E
    part: E
    title: Version-bound release evidence
    investigation_title: Which evidence must be regenerated?
    source_concepts:
    - chapter: 12
      concept: Evaluation contract
      concept_map: books/vol2/12_ops_scale/ops_scale_concepts.yml
      source_anchor: sec-ops-scale-end-to-end-evaluation-contract
    learning_claim: Evidence is reusable only while its exact artifact/version requirements remain compatible;
      a change invalidates some records rather than all or none.
    tradeoff: Evidence reuse and release speed versus unobserved compatibility and stale assurance.
    student_action: Change the candidate artifact version and inspect current versus stale records before release.
    evidence_to_inspect: Artifact requirements, exact evidence lineage, stale list, compatible evidence and
      release gate.
    explanation_prompt: Which record must be regenerated and which can be retained under the declared invalidation
      rule?
    reversal_condition: A new artifact, schema or cohort boundary can invalidate evidence that currently matches.
    scope: current notebook investigation; chapter coverage limitations are explicit
    implementation:
      engine: mlsysim.labs.experiments.v2_12_experiments
      functions:
      - evaluate_release_change
      status: implemented bounded analytical or deterministic fixture; shared opening and learning route integrated
      limitations: Finite versioned evidence fixture; does not establish that the evidence itself is statistically
        sufficient or operationally measured.
    student_objective: Determine which version-bound evidence remains reusable for a changed release.
