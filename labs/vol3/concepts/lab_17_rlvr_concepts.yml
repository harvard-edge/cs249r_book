lab_concept_map:
  schema_version: 1
  lab_id: v3_17
  chapter: 17
  title: Reinforcement Learning from Verifiable Rewards
  source_notebook: labs/vol3/lab_17_rlvr.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded controlled policy references; numerical and transfer limits explicit
  source_chapter_concept_map: books/vol3/17_rlvr/rlvr_concepts.yml
  source_chapter: books/vol3/17_rlvr/17_rlvr.qmd
  chapter_goal: Defend a verifiable-reward learning proposal against proxy rewards, credit errors, invalid
    comparisons, and rollout limits.
  student_goals:
  - Diagnose when a reward creates useful contrast and when positive scores contradict the accepted task
    contract.
  - Compare what each credit scheme can establish and inspect how coefficients weight sampled tokens.
  - Detect zero-gradient groups and reject invalid update records rather than reconstructing a tidier
    fictitious history.
  - Locate the binding rollout stage and justify a capacity change without discarding incomplete groups
    or using stale records.
  narrative:
    situation: The supervised repair policy now generates fresh repair rollouts. The team asks whether
      a check supplies useful learning contrast without rewarding exploits or losing sampling fidelity.
    previously: A residual capability gap with a reliable verifier motivates examining RL rather than
      assuming it helps.
    next: The trained policy remains one bounded controller; delegation must earn its additional boundaries.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Question the reward
    question: Does reward success mean task success?
    goal: Diagnose when a reward creates useful contrast and when positive scores contradict the accepted
      task contract.
    concept_ids:
    - v3_17_A
    coverage: Sampled reward contrast; Reward hacking; Reward as measurement
    limitation: Visible-marker exploit versus protected outcome evidence; no policy-dependent false-accept
      fraction. Fixed authored cases do not predict learned behavior or production performance.
    next: Even a valid terminal score leaves the problem of attributing credit across turns.
  - part: B
    title: Inspect the update signal
    question: What does the update signal attribute?
    goal: Compare what each credit scheme can establish and inspect how coefficients weight sampled tokens.
    concept_ids:
    - v3_17_B
    coverage: Credit assignment; GRPO coefficients
    limitation: Causal attribution versus broadcast rollout coefficients; no numerical GRPO estimator.
      Fixed authored cases do not predict learned behavior or production performance.
    next: Now choose collection groups that provide contrast while retaining faithful sampling records.
  - part: C
    title: Preserve informative groups
    question: Which sampled groups contain useful contrast?
    goal: Detect zero-gradient groups and reject invalid update records rather than reconstructing a tidier
      fictitious history.
    concept_ids:
    - v3_17_C
    coverage: Zero-contrast groups; Faithful rollout records
    limitation: Tied versus mixed outcome groups with invocation provenance; no guaranteed successful
      resampling or coefficient calculation. Fixed authored cases do not predict learned behavior or production
      performance.
    next: Valid groups still need a capacity plan for reset, action, checking, and update.
  - part: D
    title: Size the rollout loop
    question: What limits the rollout learning loop?
    goal: Locate the binding rollout stage and justify a capacity change without discarding incomplete
      groups or using stale records.
    concept_ids:
    - v3_17_D
    coverage: Rollout loop sizing
    limitation: Verification bottleneck and complete-group admission; no physical throughput prediction.
      Fixed authored cases do not predict learned behavior or production performance.
    next: The trained policy remains one bounded controller; delegation must earn its additional boundaries.
  core_concepts:
  - id: v3_17_A
    title: Question the reward
    source_concepts:
    - chapter: 17
      concept: Sampled reward contrast
      concept_map: books/vol3/17_rlvr/rlvr_concepts.yml
    - chapter: 17
      concept: Reward hacking
      concept_map: books/vol3/17_rlvr/rlvr_concepts.yml
    - chapter: 17
      concept: Reward as measurement
      concept_map: books/vol3/17_rlvr/rlvr_concepts.yml
    source_anchor: sec-vol3-rlvr-rewards
    learning_claim: RLVR scores sampled rollouts with a programmatic check, so the update learns only
      what the sampler reaches and the reward distinguishes, and a task the policy never solves gives
      zero signal. Once a check is the objective, any trajectory with proxy reward at least the intended
      solution's but lower true utility gains weight, and cheap exploits usually have high probability.
      The false-accept share of rewarded rollouts moves with the policy's current pass rate rather than
      being a fixed verifier property, so reward shaping must preserve the priority of correct outcomes.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose a reward composition and task difficulty; inspect candidate true-outcome versus proxy-score
      labels under an isolated verifier.
    student_action: Choose a reward composition and task difficulty; inspect candidate true-outcome versus
      proxy-score labels under an isolated verifier.
    evidence_to_inspect: Reached rollout outcomes, proxy/criterion disagreements, rewarded false-accept
      share, and correctness-versus-format ordering.
    explanation_prompt: Introduce a cheap test-tampering attempt or lower the policy pass rate while verifier
      errors remain fixed.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The supervised repair policy now generates fresh repair rollouts. The team asks whether a
        check supplies useful learning contrast without rewarding exploits or losing sampling fidelity.
      briefing: RL updates only reached behavior and scored distinctions. Proxy rewards can prefer an
        exploit; the share of false accepts depends on the policy pass rate.
      fixed: Task contract, verifier audit fixture, action authority, and declared reward priority.
      feedback_rule: Compute only from audited fixtures and declared assumptions. More reward need not
        mean more valid repairs; no signal on an unreachable success and no certificate from a programmatic
        check.
      next: Even a valid terminal score leaves the problem of attributing credit across turns.
    policy_options:
    - Reward test exit alone
    - Reward criterion success with protected assessment
    - Reward format bonuses even when correctness fails
  - id: v3_17_B
    title: Inspect the update signal
    source_concepts:
    - chapter: 17
      concept: Credit assignment
      concept_map: books/vol3/17_rlvr/rlvr_concepts.yml
    - chapter: 17
      concept: GRPO coefficients
      concept_map: books/vol3/17_rlvr/rlvr_concepts.yml
    source_anchor: sec-vol3-rlvr-grpo
    learning_claim: A terminal reward gives every turn the same reward-to-go, so separating a useful step
      from a faulty one is bought with a critic, more samples, or step-level signals, each at its own
      cost. GRPO replaces the learned critic with G rollouts per task and broadcasts one standardized
      coefficient to every sampled token of a rollout, and its clipping and KL estimator choices change
      how that signal is weighted.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose terminal-only, supplied critic, or assessed step-level signal; inspect group-relative
      coefficients and clipping/normalization settings on recorded rollouts.
    student_action: Choose terminal-only, supplied critic, or assessed step-level signal; inspect group-relative
      coefficients and clipping/normalization settings on recorded rollouts.
    evidence_to_inspect: Per-turn return/advantage, group mean and spread, coefficient-to-token map, ratio
      clipping, and estimator assumptions.
    explanation_prompt: Place a useful early action in a failed rollout or change reward scaling; explain
      which signal changes and why.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The supervised repair policy now generates fresh repair rollouts. The team asks whether a
        check supplies useful learning contrast without rewarding exploits or losing sampling fidelity.
      briefing: Terminal return is shared across turns. A critic, repeated samples, or process signals
        buy different information; GRPO supplies a group-relative coefficient without identifying a correct
        individual step.
      fixed: Same sampled rollout group, rewards, behavior log probabilities, target policy snapshot,
        and token mask.
      feedback_rule: Show actual computed coefficients and identify what they cannot localize. A positive
        rollout coefficient does not label every step correct; different estimators are not interchangeable.
      next: Now choose collection groups that provide contrast while retaining faithful sampling records.
    policy_options:
    - Broadcast terminal return
    - Use a supplied calibrated critic fixture
    - Use assessed step-level signals
  - id: v3_17_C
    title: Preserve informative groups
    source_concepts:
    - chapter: 17
      concept: Zero-contrast groups
      concept_map: books/vol3/17_rlvr/rlvr_concepts.yml
    - chapter: 17
      concept: Faithful rollout records
      concept_map: books/vol3/17_rlvr/rlvr_concepts.yml
    source_anchor: sec-vol3-rlvr-multi-turn
    learning_claim: A group whose rewards all tie carries no reward gradient, occurring with probability
      p^G + (1-p)^G, so the rollout cost of one informative group is G/C and difficulty targeting toward
      p near 0.5 lowers it. Ratios and gradients are valid only on per-invocation records of the delivered
      prefix token IDs, sampled token IDs, and behavior log probabilities under the actual sampling transforms.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose a task mixture/group size and validate invocation records against actual sampling
      configuration.
    student_action: Choose a task mixture/group size and validate invocation records against actual sampling
      configuration.
    evidence_to_inspect: Tied-group indicator, contrast per collection cost, per-invocation token IDs/log
      probabilities, and stopped versus completed rollout labels.
    explanation_prompt: Use very easy/hard tasks or omit one truncation notice from a stored prefix; inspect
      contrast loss and record rejection.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The supervised repair policy now generates fresh repair rollouts. The team asks whether a
        check supplies useful learning contrast without rewarding exploits or losing sampling fidelity.
      briefing: All-tied groups carry no reward contrast. Ratios require actual delivered token prefixes
        and behavior probabilities after the real sampling transforms.
      fixed: Sampling policy version, task reset, tokenizer, top-k/top-p/temperature transforms, and rollout
        completion policy.
      feedback_rule: A larger group costs more and may still tie. Missing behavior probabilities or mismatched
        prefixes invalidate ratios; censored rollouts never silently become criterion failures or valid
        training returns.
      next: Valid groups still need a capacity plan for reset, action, checking, and update.
    policy_options:
    - Collect larger groups on easy tasks
    - Target supported intermediate-difficulty tasks with faithful records
    - Reuse reconstructed prefixes and guessed behavior probabilities
  - id: v3_17_D
    title: Size the rollout loop
    source_concepts:
    - chapter: 17
      concept: Rollout loop sizing
      concept_map: books/vol3/17_rlvr/rlvr_concepts.yml
    source_anchor: sec-vol3-rlvr-infrastructure
    learning_claim: Agent RL throughput is set by the rollout loop, not the gradient step, so the serial
      slot cycle caps capacity and Amdahl's law bounds any single-stage speedup.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Vary one stage capacity or service duration in a declared planning fixture; compare group-complete
      scheduling and policy-version gates.
    student_action: Vary one stage capacity or service duration in a declared planning fixture; compare
      group-complete scheduling and policy-version gates.
    evidence_to_inspect: Slot cycle timeline, admitted and completed groups, bottleneck rate, queue/backpressure,
      and policy-version age.
    explanation_prompt: Make verification slow or delay one group member; test why faster generation or
      updates cease to help.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The supervised repair policy now generates fresh repair rollouts. The team asks whether a
        check supplies useful learning contrast without rewarding exploits or losing sampling fidelity.
      briefing: The environment slot is occupied by reset, generation, tools, verification, and cleanup.
        A faster gradient step cannot accelerate a bottleneck elsewhere.
      fixed: Task population, group contract, output ceiling, isolation, and per-stage time assumptions.
      feedback_rule: Planning rates are conditional bounds, not observed training speed or quality. Show
        which unchanged stage becomes limiting and preserve stopped-work obligations.
      next: The trained policy remains one bounded controller; delegation must earn its additional boundaries.
    policy_options:
    - Add generation capacity
    - Add bottleneck verification capacity
    - Speed up gradient update only
