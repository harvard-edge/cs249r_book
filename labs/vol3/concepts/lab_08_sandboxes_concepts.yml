lab_concept_map:
  schema_version: 1
  lab_id: v3_08
  chapter: 8
  title: Agent Sandboxes
  source_notebook: labs/vol3/lab_08_sandboxes.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded policy investigations; broader mechanisms explicitly scoped
  source_chapter_concept_map: books/vol3/08_sandboxes/sandboxes_concepts.yml
  source_chapter: books/vol3/08_sandboxes/08_sandboxes.qmd
  chapter_goal: Choose a containment and reset policy whose permitted reach and carried state match the repair
    task.
  student_goals:
  - Locate a protected resource reachable under a proposed execution arrangement and identify the enforcement
    boundary.
  - Construct and test a delegated grant that permits the intended operation while identifying rights it leaves
    elsewhere.
  - Select a compatible isolation/workspace arrangement and explain which observed costs and boundaries justify
    it.
  - Find an outbound bypass or retained-state leak in a proposed lifecycle and choose evidence that makes
    reuse admissible.
  narrative:
    situation: The patch runs through the mediated tool boundary, but its vendored README persuades it to
      execute a command that reads host credentials. The lab examines what the executing code can actually
      reach.
    previously: The supplied tool interface checks requests before dispatch. The code it starts still needs its own boundary.
    next: The sandbox can protect the host and still permit a legitimate search request that carries confidential
      bytes. The next lab governs information flow through permitted operations.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Where the command can reach
    question: Where can the admitted command reach?
    goal: Locate a protected resource reachable under a proposed execution arrangement and identify the enforcement
      boundary.
    concept_ids:
    - v3_08_A
    coverage: Containment beneath the model; In-process restriction fails — bounded supplied-case policy comparison
    limitation: This is a declared reachability model, not an exploit or evidence that a named container or
      VM is secure. Boundary reachability is supplied, not derived from executing generated code.
    next: An external boundary still needs an explicit grant for the useful work.
  - part: B
    title: Enough authority for this repair
    question: What authority does this repair need?
    goal: Construct and test a delegated grant that permits the intended operation while identifying rights
      it leaves elsewhere.
    concept_ids:
    - v3_08_B
    coverage: Capability grants; Attenuation and revocation — bounded supplied-case policy comparison
    limitation: Authenticity and revocation are supplied fixture facts; no token cryptography is implemented.
      Grant scope, expiry, delegation chain, and revocation timing are fixed; the instrument does not mint
      or cryptographically verify tokens.
    next: Choose an envelope and workspace representation that can support the permitted workload.
  - part: C
    title: An envelope for a persistent workspace
    question: Which state may survive the next run?
    goal: Select a compatible isolation/workspace arrangement and explain which observed costs and boundaries
      justify it.
    concept_ids:
    - v3_08_C
    coverage: Isolation envelopes; Copy-on-write workspace — bounded supplied-case policy comparison
    limitation: Envelope cost, kernel vulnerabilities, and copy-on-write provisioning latency are unmodeled;
      no fastest-envelope claim is made. No choice among named execution envelopes or eager-copy provisioning
      is implemented; this comparison distinguishes workspace separation from execution containment.
    next: A useful leased workspace must constrain outbound traffic and become clean before reuse.
  - part: D
    title: Release the workspace without releasing its secrets
    question: What must be removed before workspace release?
    goal: Find an outbound bypass or retained-state leak in a proposed lifecycle and choose evidence that
      makes reuse admissible.
    concept_ids:
    - v3_08_D
    coverage: Egress control; Reset contract — bounded supplied-case policy comparison
    limitation: Reset is modeled as explicit preconditions, not an implementation of a complete sandbox reset.
      Export ordering, reset of every state domain, and actual packet filtering are not executed.
    next: The next lab checks permitted operations against data provenance and task authority.
  core_concepts:
  - id: v3_08_A
    title: Where the command can reach
    source_concepts:
    - chapter: 8
      concept: Containment beneath the model
      concept_map: books/vol3/08_sandboxes/sandboxes_concepts.yml
    - chapter: 8
      concept: In-process restriction fails
      concept_map: books/vol3/08_sandboxes/sandboxes_concepts.yml
    source_anchor: sec-vol3-sandboxes-in-process-failure
    learning_claim: Admitting a well-typed call does not bound what the code it starts can reach, so the limit
      must be enforced below the executing process by a mechanism the code cannot modify. Pruning an interpreter's
      globals is an interface filter, not an execution boundary, because reachable object references, shared
      native libraries, and inherited authority leave the supervisor's full power within reach.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Choose in-process globals filtering or a declared external envelope; inspect a supplied hostile-command
      trace.
    student_action: Compare globals filtering with a host-enforced boundary on the same inherited-handle and
      permitted-read cases.
    evidence_to_inspect: Reachable-resource graph, actual deny or allow events in the fixture, trusted components,
      and unsupported assumptions.
    explanation_prompt: Add a required native dependency or inherited file descriptor. Reassess which component
      must enforce the boundary.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A README-induced command tries to read the developer credential file while the legitimate task
        only needs the repository.
      briefing: The supplied reachability graph names process identity, reachable objects, shared native code,
        files, and sockets. A filtered interpreter interface and an external boundary protect different things.
      fixed: Same command, task permissions, protected-resource set, and compatibility requirements.
      feedback_rule: Explain the witnessed reachability path or enforcement denial. An absent exploit in a
        finite fixture does not prove containment.
      next: An external boundary still needs an explicit grant for the useful work.
    policy_options: []
  - id: v3_08_B
    title: Enough authority for this repair
    source_concepts:
    - chapter: 8
      concept: Capability grants
      concept_map: books/vol3/08_sandboxes/sandboxes_concepts.yml
    - chapter: 8
      concept: Attenuation and revocation
      concept_map: books/vol3/08_sandboxes/sandboxes_concepts.yml
    source_anchor: sec-vol3-sandboxes-attenuation
    learning_claim: A capability is an unforgeable reference that designates a resource and authorizes operations
      on it, and a grant admits an access only if the reference is authentic and the operation, object, condition,
      and expiry all match. A derived grant may only narrow its parent, and chained-caveat tokens let any
      holder narrow offline but never widen, while attenuation never withdraws the parent grant it came from.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Select grant scope and expiry; delegate a child, then compare child attenuation with parent
      revocation at the supplied event boundary.
    student_action: Compare authenticity-only checks with task-scope and use-time revocation checks on fixed
      parent/child grant cases.
    evidence_to_inspect: Parent/child grant graph, decision by requested operation, expired or revoked checks,
      and legitimate work blocked.
    explanation_prompt: Extend the helper lifetime or request a write after delegation. Which policy must
      change, and which may not widen?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The worker needs to edit its task workspace, and a helper needs only to read one generated report.
      briefing: Each grant has object, operations, conditions, expiry, and issuer. Narrowing a child grant
        does not revoke its parent.
      fixed: Same task files, helper action, issuer chain, and time trace.
      feedback_rule: Name which predicate admitted or denied each request and which parent authority remains.
        Narrower is not automatically preferable if required work becomes impossible.
      next: Choose an envelope and workspace representation that can support the permitted workload.
    policy_options: []
  - id: v3_08_C
    title: An envelope for a persistent workspace
    source_concepts:
    - chapter: 8
      concept: Isolation envelopes
      concept_map: books/vol3/08_sandboxes/sandboxes_concepts.yml
    - chapter: 8
      concept: Copy-on-write workspace
      concept_map: books/vol3/08_sandboxes/sandboxes_concepts.yml
    source_anchor: sec-vol3-sandboxes-envelope-choice
    learning_claim: Shared-kernel containers, user-space kernels, microVMs, and restricted bytecode differ
      first in where a system call lands, which sets the trusted components and the per-call tax each envelope
      pays. A task workspace separates immutable baseline, private modifications, scratch, and exportable
      artifacts, and copy-on-write makes provisioning cost track what the agent writes rather than what it
      can see.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Choose among supplied container, interposed-kernel, microVM, or restricted-bytecode profiles;
      separately compare eager-copy and copy-on-write on the same write set.
    student_action: Compare directory separation with private-overlay and syscall-boundary checks on two distinct
      leak paths.
    evidence_to_inspect: Compatibility checks, trusted-boundary diagram, startup/restore reference values
      where available, copied or dirtied pages, and final exported artifact.
    explanation_prompt: Replace a small write set with broad modification, or change from a parser to native
      compilation. Reconsider both choices.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair compiles native code and carries edited files across multiple test turns; starting
        over on each call loses the working candidate.
      briefing: Envelope cards declare supported interfaces and trusted components. Workspace views separate
        immutable base, private writes, scratch, and export artifacts; copy-on-write defers copying until
        modification.
      fixed: Same compile/test requirements, resource ceiling, baseline image, write sequence, and declared
        threat model.
      feedback_rule: Reject unsupported interfaces before ranking costs; identify deferred first-write cost.
        A faster reference startup does not imply equivalent security or total trajectory cost.
      next: A useful leased workspace must constrain outbound traffic and become clean before reuse.
    policy_options: []
  - id: v3_08_D
    title: Release the workspace without releasing its secrets
    source_concepts:
    - chapter: 8
      concept: Egress control
      concept_map: books/vol3/08_sandboxes/sandboxes_concepts.yml
    - chapter: 8
      concept: Reset contract
      concept_map: books/vol3/08_sandboxes/sandboxes_concepts.yml
    source_anchor: sec-vol3-sandboxes-pooling-reset
    learning_claim: Outbound reach is enforced on the host data path with a packet filter and an operation-aware
      mediator that cover each other's blind spots, never by guest proxy settings. A used environment may
      serve a new tenant only after a reset that fences authority, quiesces owned work, exports permitted
      outputs, and clears four state domains in order.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare guest-only proxy versus host path controls; then choose a complete reset or omit one
      supplied reset stage in an isolated fixture.
    student_action: Compare deleting files with fenced authority, quiescent work, and host-egress checks before
      reuse.
    evidence_to_inspect: Host deny/allow trace, raw-socket attempt, residual process/file/network/credential
      inventory, and ready-pool eligibility.
    explanation_prompt: Permit a legitimate external package search that embeds private fixture text. Which
      remaining disclosure can the envelope not decide?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The patch task ends, but a helper process, cached credential, and writable layer remain before
        the sandbox returns to the ready pool.
      briefing: Guest proxy settings do not enforce host egress. The reset checklist fences authority, quiesces
        work, exports permitted outputs, and clears the declared state domains.
      fixed: Same outgoing requests, allowed destinations/operations, tenant transition, and required exported
        artifact.
      feedback_rule: Show the particular permitted or blocked path and residue. A command exit or cleared
        directory alone never marks the instance ready.
      next: The next lab checks permitted operations against data provenance and task authority.
    policy_options: []
  primary_concept_dispositions:
  - concept: Containment beneath the model
    part: A
    disposition: bounded supplied-case investigation; Boundary reachability is supplied, not derived from
      executing generated code.
  - concept: In-process restriction fails
    part: A
    disposition: bounded supplied-case investigation; Boundary reachability is supplied, not derived from
      executing generated code.
  - concept: Capability grants
    part: B
    disposition: bounded supplied-case investigation; Grant scope, expiry, delegation chain, and revocation
      timing are fixed; the instrument does not mint or cryptographically verify tokens.
  - concept: Attenuation and revocation
    part: B
    disposition: bounded supplied-case investigation; Grant scope, expiry, delegation chain, and revocation
      timing are fixed; the instrument does not mint or cryptographically verify tokens.
  - concept: Isolation envelopes
    part: C
    disposition: bounded supplied-case investigation; No choice among named execution envelopes or eager-copy
      provisioning is implemented; this comparison distinguishes workspace separation from execution containment.
  - concept: Copy-on-write workspace
    part: C
    disposition: bounded supplied-case investigation; No choice among named execution envelopes or eager-copy
      provisioning is implemented; this comparison distinguishes workspace separation from execution containment.
  - concept: Egress control
    part: D
    disposition: bounded supplied-case investigation; Export ordering, reset of every state domain, and actual
      packet filtering are not executed.
  - concept: Reset contract
    part: D
    disposition: bounded supplied-case investigation; Export ordering, reset of every state domain, and actual
      packet filtering are not executed.
  model_support:
    existing:
    - Agents.Coding.SWE_Bench_Runner sandbox_startup_latency, sandbox_snapshot_restore_latency, sandbox_memory_footprint
      are canonical reference profile values.
    required:
    - MLSysIM grant evaluator and bounded reachability fixtures for isolation envelope, egress, and ordered
      reset. No existing sandbox escape-rate or security-certification model.
    - Provisioning/copy-on-write event fixtures must disclose measured or illustrative source; do not derive
      security strength from startup latency.
