  model_support:
    existing:
    - Agents.Coding.SWE_Bench_Runner context_window and working_memory
    - Literature.LongContextComprehension is empirical reference data; it cannot supply repair-policy
      acceptance automatically
    missing:
    - Canonical tokenized evidence-manifest, protected-field and scope audit fixtures
    - Canonical version-dependency invalidation and context-policy replay engine
    - Shared prefix and compaction cost accounting from chapter LEGO cells
    boundary: A token-retention ratio or literature long-context curve does not predict repair success.
      Candidate decisions must come from audited fixture replay or measured model calls with fixed configuration.
