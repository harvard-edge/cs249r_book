lab_concept_map:
  schema_version: 1
  lab_id: v3_04
  chapter: 4
  title: Context Engineering
  source_notebook: labs/vol3/lab_04_context_engineering.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded reference investigations; not live-agent validation
  source_chapter_concept_map: books/vol3/04_context_engineering/context_engineering_concepts.yml
  source_chapter: books/vol3/04_context_engineering/04_context_engineering.qmd
  chapter_goal: Assemble and audit a bounded, current working set that supports the next repair decision.
  student_goals:
  - Select a bounded working set and justify it using the next decision’s evidence needs.
  - Choose a prompt layout and explain both its exact-prefix reuse and its evidential limits.
  - Compare compaction candidates and justify which record may replace active history.
  - Invalidate affected current-state claims and compare complete context policies on accepted task outcomes.
  narrative:
    situation: The repair has accumulated source excerpts, a refuted timeout hypothesis and a targeted
      test. The next request must carry the right evidence.
    previously: The supplied case includes candidate explanations and a targeted test result.
    next: 'Next: account for the physical serving state produced by that selected token prefix.'
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Pack the next decision
    question: What belongs in the next working set?
    goal: Compare recency-first and protected-field working sets under the fixed input allowance.
    concept_ids:
    - v3_04_A
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      A token-retention ratio or literature long-context curve does not predict repair success. Candidate
      decisions must come from audited fixture replay or measured model calls with fixed configuration.
    next: Arrange the chosen items to preserve scope and reusable prefix.
  - part: B
    title: Stage stable content without hiding scope
    question: Which prefix can remain stable?
    goal: Choose a prompt layout and explain both its exact-prefix reuse and its evidential limits.
    concept_ids:
    - v3_04_B
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      A token-retention ratio or literature long-context curve does not predict repair success. Candidate
      decisions must come from audited fixture replay or measured model calls with fixed configuration.
    next: The growing leaf now needs compaction that preserves its obligations.
  - part: C
    title: Compact and audit the continuation
    question: What must survive compaction?
    goal: Compare compaction candidates and justify which record may replace active history.
    concept_ids:
    - v3_04_C
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      A token-retention ratio or literature long-context curve does not predict repair success. Candidate
      decisions must come from audited fixture replay or measured model calls with fixed configuration.
    next: After the next edit, decide which of these current claims must be withdrawn.
  - part: D
    title: Refresh before the next decision
    question: Which context became stale?
    goal: Identify how a source change withdraws current-state authority while preserving historical evidence.
    concept_ids:
    - v3_04_D
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      A token-retention ratio or literature long-context curve does not predict repair success. Candidate
      decisions must come from audited fixture replay or measured model calls with fixed configuration.
    next: Carry the valid selected prefix into KV Cache Management.
  core_concepts:
  - id: v3_04_A
    title: Pack the next decision
    source_concepts:
    - chapter: 4
      concept: Working-set partition
      concept_map: books/vol3/04_context_engineering/context_engineering_concepts.yml
    - chapter: 4
      concept: Usable working context
      concept_map: books/vol3/04_context_engineering/context_engineering_concepts.yml
    source_anchor: sec-vol3-context-engineering-decision
    learning_claim: Before each call the runtime selects a bounded working set and splits the input allowance
      S_max - K_max among instructions, tool declarations, task state, and observations, and appended
      observations are the term that grows and displaces task state. Usable context is an empirical property
      of a model, configuration, representation, and workload found by decision-level evaluation, because
      attention dilutes a target key as staged keys accumulate and position matters.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose evidence items and their supplied representations, then compare with append-all under
      the same allowance.
    student_action: Choose evidence items and their supplied representations, then compare with append-all
      under the same allowance.
    evidence_to_inspect: Selected/omitted manifest, token partition, admission, required evidence coverage
      and recorded next-decision outcome where available.
    explanation_prompt: Move a required constraint into the distractor list or change its position in
      a recorded matched trial and reconsider the policy.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The full transcript fits, but repeated timeout speculation competes with the synchronization
        constraint and failed reproducer.
      briefing: Inspect input/output allowance and named material groups. Capacity is an admission fact;
        usability requires task evidence.
      fixed: Model/configuration, pending decision, tokenizer, task constraints and source snapshot.
      feedback_rule: Report missing obligations even when the request fits. Never infer semantic success
        from token count; mark it unmeasured when no matched outcome fixture exists.
      next: Arrange the chosen items to preserve scope and reusable prefix.
    policy_options:
    - id: policy_1
      label: Append full history
    - id: policy_2
      label: Select task-relevant excerpts
    - id: policy_3
      label: Select excerpts with protected constraints
  - id: v3_04_B
    title: Stage stable content without hiding scope
    source_concepts:
    - chapter: 4
      concept: Change-rate ordering
      concept_map: books/vol3/04_context_engineering/context_engineering_concepts.yml
    - chapter: 4
      concept: Scope rule
      concept_map: books/vol3/04_context_engineering/context_engineering_concepts.yml
    source_anchor: sec-vol3-context-engineering-staging
    learning_claim: Staging the request as root, trunk, and leaf by change rate keeps the longest exact
      token prefix reusable, so volatile fields belong in the leaf, although correctness always overrides
      cache economics. An observation is evidence only for the artifact versions and execution conditions
      under which it was gathered, and provenance labels on untrusted spans guide interpretation but enforce
      nothing.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Reorder the same items by change rate, then compare keeping vs removing a version/scope
      label.
    student_action: Reorder the same items by change rate, then compare keeping vs removing a version/scope
      label.
    evidence_to_inspect: Exact common prefix length, token churn, observation provenance and claims allowed
      by each scoped result.
    explanation_prompt: Put the freshest source revision ahead of a large stable prefix and decide whether
      correctness should override reuse.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A new test result arrives every turn; unchanged policy and tool declarations should not be
        restaged ahead of it.
      briefing: Read root/trunk/leaf as change-rate groups, not authority levels. Every observation has
        source, revision and execution conditions.
      fixed: Identical tokenized content except the tested ordering or label change; same model and current
        revision.
      feedback_rule: Calculate exact prefix equality, not semantic similarity. A longer prefix is not
        a reason to reuse an observation outside its scope. Labels guide interpretation but enforce no
        authority.
      next: The growing leaf now needs compaction that preserves its obligations.
    policy_options:
    - id: policy_1
      label: Volatile observations first
    - id: policy_2
      label: Stable-to-volatile ordering with scope labels
    - id: policy_3
      label: Stable ordering without provenance labels
  - id: v3_04_C
    title: Compact and audit the continuation
    source_concepts:
    - chapter: 4
      concept: Context compaction
      concept_map: books/vol3/04_context_engineering/context_engineering_concepts.yml
    - chapter: 4
      concept: Audited progress records
      concept_map: books/vol3/04_context_engineering/context_engineering_concepts.yml
    source_anchor: sec-vol3-context-engineering-summarization
    learning_claim: Every compaction is a lossy transform that can silently drop evidence a later decision
      needs, so the runtime pins a protected-field set and keeps handles to raw records. A model-written
      continuation record is an untrusted candidate that a host-side audit checks against a runtime-owned
      field inventory, the event log, and the workspace version before it replaces history.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Select tail truncation, extractive record or supplied model summary, then apply a schema-only
      or evidence-linked audit.
    student_action: Select tail truncation, extractive record or supplied model summary, then apply a
      schema-only or evidence-linked audit.
    evidence_to_inspect: Before/after manifest, retained constraints, source/test/revision links, open
      obligations, audit rejection reasons and retrieval cost for omitted raw data.
    explanation_prompt: Use a shorter summary that retains every field name but confuses r17 failure with
      r18 pass; identify why field presence is insufficient.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The targeted test passed on r18, but the broad regression suite remains open. A short summary
        says the repair is complete.
      briefing: Inspect protected fields, raw-record handles, observations vs hypotheses and the host-owned
        audit inventory.
      fixed: Same transcript, token budget, protected-field inventory, runtime event log and workspace
        version.
      feedback_rule: A schema pass alone does not establish truth. Reject unsupported completion claims,
        show lost fields and distinguish omission from deferred access behind a handle.
      next: After the next edit, decide which of these current claims must be withdrawn.
    policy_options:
    - id: policy_1
      label: Retain recent tail
    - id: policy_2
      label: Structured summary with schema-only audit
    - id: policy_3
      label: Structured record with event-linked audit
  - id: v3_04_D
    title: Refresh before the next decision
    source_concepts:
    - chapter: 4
      concept: Context invalidation
      concept_map: books/vol3/04_context_engineering/context_engineering_concepts.yml
    - chapter: 4
      concept: Context policy evaluation
      concept_map: books/vol3/04_context_engineering/context_engineering_concepts.yml
    source_anchor: sec-vol3-context-engineering-context-rot
    learning_claim: A verified write withdraws current-state authority from bound observations and flags
      dependent conclusions for reassessment, without erasing their historical truth. Context policies
      are compared as complete policies on accepted outcomes under a fixed model, tools, budget, and fixture,
      and retention or compression ratios are diagnostics with explicit denominators, not verdicts.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose append-warning, replace or withdraw/refresh for stale records, then replay identical
      fixture sequences.
    student_action: Choose append-warning, replace or withdraw/refresh for stale records, then replay
      identical fixture sequences.
    evidence_to_inspect: Current vs historical labels, affected conclusions, refresh operations, task
      outcomes, full costs and retained-token diagnostics with denominators.
    explanation_prompt: Edit an unrelated file and test whether broad invalidation wastes valid evidence
      without improving acceptance.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The source advances again. The old pass remains historical truth but no longer proves the
        modified code passes.
      briefing: Read the artifact-dependency graph and current version; complete policy comparisons hold
        model, tools, fixture and budget fixed.
      fixed: Same verified write, dependency graph, acceptance contract, model/tools and total budget.
      feedback_rule: Withdraw only current-state applicability and dependent claims; preserve history.
        Count refresh cost and unresolved obligations. Retention is a diagnostic, never a verdict.
      next: Carry the valid selected prefix into KV Cache Management.
    policy_options:
    - id: policy_1
      label: Append stale warning
    - id: policy_2
      label: Replace all history
    - id: policy_3
      label: Invalidate dependencies and selectively refresh
