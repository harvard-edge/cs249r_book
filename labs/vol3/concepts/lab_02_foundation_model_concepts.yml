lab_concept_map:
  schema_version: 1
  lab_id: v3_02
  chapter: 2
  title: The Foundation Model
  source_notebook: labs/vol3/lab_02_foundation_model.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded reference investigations; not live-agent validation
  source_chapter_concept_map: books/vol3/02_foundation_model/foundation_model_concepts.yml
  source_chapter: books/vol3/02_foundation_model/02_foundation_model.qmd
  chapter_goal: Choose an invocation and output interface that fits the request, preserves status and
    supports scoped checks.
  student_goals:
  - Determine which requests fit and identify the additional runtime decision required before any effect.
  - Choose a continuation disposition from status evidence and specify what must be recorded to reproduce
    downstream behavior.
  - Use candidate evidence to distinguish diversity from correctness and justify a gate for a named property.
  - Identify a call bottleneck and compare multi-turn interfaces without conflating work, latency and
    billing.
  narrative:
    situation: The repair agent must inspect src/pool.py. Its next model reply is an unexecuted proposal,
      possibly partial or delayed.
    previously: The supplied repair loop treats the model's reply as a proposal; the runtime controls its effects.
    next: 'Next: decide whether another candidate, deeper generation or a diagnostic observation is worth
      its budget.'
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Admit a bounded request
    question: What must a model call promise before dispatch?
    goal: Determine which requests fit and identify the additional runtime decision required before any
      effect.
    concept_ids:
    - v3_02_A
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      Do not invent a mapping from temperature to task correctness. Reuse recorded sampled candidates
      and calls with provenance; deterministic replay is a fixture operation, not a claim that temperature
      zero gives identical live outputs.
    next: An admitted request still needs an interpretable completion status.
  - part: B
    title: Separate completion from replay
    question: Did generation finish, and can it be reproduced?
    goal: Choose a continuation disposition from status evidence and specify what must be recorded to
      reproduce downstream behavior.
    concept_ids:
    - v3_02_B
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      Do not invent a mapping from temperature to task correctness. Reuse recorded sampled candidates
      and calls with provenance; deterministic replay is a fixture operation, not a claim that temperature
      zero gives identical live outputs.
    next: For completed candidates, investigate what sampling and checks actually establish.
  - part: C
    title: Choose evidence for a candidate
    question: What does this check actually establish?
    goal: Distinguish a completed schema-valid proposal from a permitted effect, without inferring a sampling
      pass rate.
    concept_ids:
    - v3_02_C
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      Do not invent a mapping from temperature to task correctness. Reuse recorded sampled candidates
      and calls with provenance; deterministic replay is a fixture operation, not a claim that temperature
      zero gives identical live outputs.
    next: Now compare the costs of interfaces that can return those candidates.
  - part: D
    title: Price the interface across turns
    question: Which interface cost grows across turns?
    goal: Separate submitted history, fresh prefill work, and unchanged output generation in an exact-prefix
      reference.
    concept_ids:
    - v3_02_D
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      Do not invent a mapping from temperature to task correctness. Reuse recorded sampled candidates
      and calls with provenance; deterministic replay is a fixture operation, not a claim that temperature
      zero gives identical live outputs.
    next: Carry the bounded call contract into Test-Time Compute.
  core_concepts:
  - id: v3_02_A
    title: Admit a bounded request
    source_concepts:
    - chapter: 2
      concept: Proposal boundary
      concept_map: books/vol3/02_foundation_model/foundation_model_concepts.yml
    - chapter: 2
      concept: Token-measured admission
      concept_map: books/vol3/02_foundation_model/foundation_model_concepts.yml
    source_anchor: sec-vol3-foundation-model-tokenization
    learning_claim: 'Model output is a proposal with zero ambient authority: the runtime validates, authorizes,
      executes, and returns the observation, so a tool request is never an effect and a model claim is
      never an observation. A request is admitted only if its fully serialized wire payload, counted with
      the target model''s own tokenizer, satisfies S <= S_max - K_max, and hidden reasoning tokens debit
      the same output headroom.'
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose one supplied request representation or output reservation and inspect whether it
      is admitted.
    student_action: Choose one supplied request representation or output reservation and inspect whether
      it is admitted.
    evidence_to_inspect: Component token counts, complete request count, output headroom, admission reason
      and proposal/actual-effect distinction.
    explanation_prompt: Use a shorter-looking representation with more tokens, or reserve more output
      and observe admission change.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: Source excerpts and tool definitions have enlarged the next read request.
      briefing: Inspect the serialized request, target-tokenizer counts and reserved output allowance.
        Separate a requested read from its execution.
      fixed: Target model/tokenizer revision, wire serializer, source fixture and tool permission policy.
      feedback_rule: Use recorded tokenizer output or the real matching tokenizer; explain the changed
        count. An admitted request only reaches model invocation, not tool execution.
      next: An admitted request still needs an interpretable completion status.
    policy_options:
    - id: policy_1
      label: Full transcript with output reserve
    - id: policy_2
      label: Selected excerpts with same reserve
    - id: policy_3
      label: Selected excerpts with larger output reserve
  - id: v3_02_B
    title: Separate completion from replay
    source_concepts:
    - chapter: 2
      concept: Recorded calls replay, served calls do not
      concept_map: books/vol3/02_foundation_model/foundation_model_concepts.yml
    - chapter: 2
      concept: Invocation contract
      concept_map: books/vol3/02_foundation_model/foundation_model_concepts.yml
    source_anchor: sec-vol3-foundation-model-status-envelope
    learning_claim: Reduction order and serving-path changes flip contested argmax choices even at temperature
      zero, so the runtime logs model revision, serving configuration, and sampling settings with every
      call and replays recorded responses when behavior must be reproduced. Every call is a request record
      plus a normalized status envelope, and only a COMPLETED reply enters the candidate path, so a truncated
      prefix that parses is quarantined and a local deadline expiry leaves the remote outcome unknown.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Select a supplied completion envelope and compare fresh repeat with exact recorded-response
      replay.
    student_action: Select a supplied completion envelope and compare fresh repeat with exact recorded-response
      replay.
    evidence_to_inspect: Request identifier, revision/configuration, normalized status, payload, recorded
      usage and remote-outcome certainty.
    explanation_prompt: Compare two parseable payloads with different stop status and explain why parsing
      is insufficient.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A reply parses as a read request, but the serving envelope says output limit. Another request
        hit a local deadline.
      briefing: Read COMPLETED, truncated and unknown remote-outcome envelopes. Replay means replaying
        recorded responses; repeat means asking the service again.
      fixed: Same requested input and dispatch policy; keep candidate text identical when testing status
        effects.
      feedback_rule: Only completed replies enter the candidate path. Mark local timeout as remote outcome
        unknown, not canceled or free; replay reproduces the supplied record only.
      next: For completed candidates, investigate what sampling and checks actually establish.
    policy_options:
    - id: policy_1
      label: Repeat live request
    - id: policy_2
      label: Replay recorded response
    - id: policy_3
      label: Continue only on completed envelope
  - id: v3_02_C
    title: Choose evidence for a candidate
    source_concepts:
    - chapter: 2
      concept: Sampling shapes candidates, not correctness
      concept_map: books/vol3/02_foundation_model/foundation_model_concepts.yml
    - chapter: 2
      concept: Checks certify named properties
      concept_map: books/vol3/02_foundation_model/foundation_model_concepts.yml
    source_anchor: sec-vol3-foundation-model-continuations
    learning_claim: Temperature, top-k, and top-p reshape which candidates appear but none makes a likely
      token a correct one, so sampling settings are chosen by measured task pass rates. Likelihood is
      not truth, schema conformance is not permission, a passing test covers only exercised behavior,
      and self-review re-samples the same distribution, so each gate is chosen for the one property it
      certifies and a fallible checker leaves a residual defect share given by Bayes.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Select a recorded sampling configuration, then choose which gate to apply to the returned
      candidates.
    student_action: Select a recorded sampling configuration, then choose which gate to apply to the returned
      candidates.
    evidence_to_inspect: Candidate variation, check dispositions, property certified, residual untested
      obligations and observed sample counts.
    explanation_prompt: Use a candidate that passes the selected check but violates a different property
      and revise the gate sequence.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: Several sampled read requests look plausible; one targets a missing path, another crosses
        the workspace boundary.
      briefing: 'Inspect recorded candidate sets and each available gate: syntax, existence, permission
        and bounded behavioral check.'
      fixed: Model revision, task fixture, candidate budget and gate definitions.
      feedback_rule: Derive all outcomes from candidate fixtures; no monotonic temperature-to-accuracy
        curve. Syntax success never implies existence, permission or repair correctness.
      next: Now compare the costs of interfaces that can return those candidates.
    policy_options:
    - id: policy_1
      label: Schema-only gate
    - id: policy_2
      label: Schema plus existence gate
    - id: policy_3
      label: Schema,existence and permission gates
  - id: v3_02_D
    title: Price the interface across turns
    source_concepts:
    - chapter: 2
      concept: Output-bound call latency
      concept_map: books/vol3/02_foundation_model/foundation_model_concepts.yml
    - chapter: 2
      concept: Quadratic resend and prefix reuse
      concept_map: books/vol3/02_foundation_model/foundation_model_concepts.yml
    source_anchor: sec-vol3-foundation-model-cost
    learning_claim: Prefill is bounded by arithmetic and unbatched decode by weight bandwidth, so one
      output token costs roughly as much time as several hundred prompt tokens and output length is the
      primary latency lever. Re-sending an append-only history submits H*S0 + Delta*H(H-1)/2 prompt tokens,
      compatible prefix reuse cuts fresh prefill to S0 + (H-1)*Delta, and latency, work, and billed dollars
      remain separate accounts.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Compare supplied whole-file and local-edit traces under the same deadline, then toggle compatible
      prefix reuse on the same history.
    student_action: Compare supplied whole-file and local-edit traces under the same deadline, then toggle
      compatible prefix reuse on the same history.
    evidence_to_inspect: Latency breakdown, input/output counts, retained compatible prefix, fresh prefill,
      bill and accepted/unfinished disposition for every trial.
    explanation_prompt: Invalidate the edit anchor or move the dominant delay to queueing and determine
      whether the preferred interface changes.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: Whole-file replacement repeats unchanged code; a localized patch is shorter but depends on
        matching current anchors.
      briefing: Separate preparation, queueing, prefill, decode and packaging; distinguish submitted tokens,
        fresh work and billed tokens.
      fixed: Same model, source revision, completed task contract, generation/timeout caps and price schedule.
      feedback_rule: Show the actual dominant phase; shorter output need not win if anchors fail or queueing
        dominates. Prefix reuse changes fresh work only when supported; billing follows the supplied tariff.
      next: Carry the bounded call contract into Test-Time Compute.
    policy_options:
    - id: policy_1
      label: Whole-file output without reuse
    - id: policy_2
      label: Localized edit without reuse
    - id: policy_3
      label: Localized edit with compatible prefix reuse
