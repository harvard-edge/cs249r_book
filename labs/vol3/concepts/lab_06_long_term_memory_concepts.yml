lab_concept_map:
  schema_version: 1
  lab_id: v3_06
  chapter: 6
  title: Long-Term Memory
  source_notebook: labs/vol3/lab_06_long_term_memory.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded reference investigations; not live-agent validation
  source_chapter_concept_map: books/vol3/06_long_term_memory/long_term_memory_concepts.yml
  source_chapter: books/vol3/06_long_term_memory/06_long_term_memory.qmd
  chapter_goal: Choose a bounded memory policy that preserves provenance, honors writes/deletions and
    supports current repair decisions.
  student_goals:
  - Determine what a retrieval result supports and distinguish missing evidence from a complete negative
    result.
  - Choose a retrieval route and justify its evidence coverage and bounded cost.
  - Choose admissible writes and trace how a withdrawn claim affects its descendants.
  - Choose an honest refresh-time response and identify what a complete cross-session policy comparison
    must account for.
  narrative:
    situation: A new repair session retrieves an earlier test failure and a confident lesson drawn from
      it. The source code has changed since that test. Decide what the agent can still use, what it
      must check again, and what it should stop treating as true.
    previously: The supplied repair resumes in a new session, with earlier evidence available to retrieve.
    next: 'Next: use the retrieved evidence to propose tool calls through an explicit action contract.'
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Read evidence with an envelope
    question: What does this retrieved record authorize?
    goal: Determine what a retrieval result supports and distinguish missing evidence from a complete
      negative result.
    concept_ids:
    - v3_06_A
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      No similarity-to-truth mapping. Retrieval relevance, policy acceptance and source freshness require
      explicit labeled records; bandwidth floors do not predict index recall or full query latency.
    next: Choose a retrieval route for the evidence the next repair step needs.
  - part: B
    title: Bound the evidence path
    question: Can useful evidence fit the retrieval budget?
    goal: Choose a retrieval route and justify its evidence coverage and bounded cost.
    concept_ids:
    - v3_06_B
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      No similarity-to-truth mapping. Retrieval relevance, policy acceptance and source freshness require
      explicit labeled records; bandwidth floors do not predict index recall or full query latency.
    next: Useful results must enter persistent storage through a controlled write policy.
  - part: C
    title: Write lessons without laundering guesses
    question: Which observation may become a durable lesson?
    goal: Choose admissible writes and trace how a withdrawn claim affects its descendants.
    concept_ids:
    - v3_06_C
    coverage: A fixed multi-session write sequence contrasts unsupported admission, later source-backed
      approval, withdrawal, and descendant exclusion. It distinguishes current retrieval exclusion from
      pending physical purge; it does not measure purge latency or live poisoning rates.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      No similarity-to-truth mapping. Retrieval relevance, policy acceptance and source freshness require
      explicit labeled records; bandwidth floors do not predict index recall or full query latency.
    next: Finally ensure the index reflects current sources and compare the full lifecycle policy.
  - part: D
    title: Serve current evidence across sessions
    question: Does the stored evidence still apply?
    goal: Choose an honest refresh-time response and identify what a complete cross-session policy comparison
      must account for.
    concept_ids:
    - v3_06_D
    coverage: A fixed cross-session source-generation trial compares stale admission, current-source fallback,
      and an honest partial response. Complete-policy accounting duties remain visible, but no measured
      maintenance cost or acceptance-rate estimate is supplied.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      No similarity-to-truth mapping. Retrieval relevance, policy acceptance and source freshness require
      explicit labeled records; bandwidth floors do not predict index recall or full query latency.
    next: Carry current, scoped evidence into Tool Calling, where proposals must meet action-time preconditions.
  core_concepts:
  - id: v3_06_A
    title: Read evidence with an envelope
    source_concepts:
    - chapter: 6
      concept: Record roles
      concept_map: books/vol3/06_long_term_memory/long_term_memory_concepts.yml
    - chapter: 6
      concept: Retrieval contract
      concept_map: books/vol3/06_long_term_memory/long_term_memory_concepts.yml
    source_anchor: sec-vol3-persistent-governance
    learning_claim: Persistent records are roles in an evidence chain (source of record, observation log,
      agent-written memory, retrieval index), not storage tiers, and any claim is validated against its
      source of record. Every read is a bounded request answered by an envelope that reports scope, snapshot,
      completeness status, and per-item provenance, and an empty result proves nonexistence only for a
      complete search of the declared scope.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose bounded scope/snapshot and inspect complete, partial or unavailable supplied responses.
    student_action: Choose bounded scope/snapshot and inspect complete, partial or unavailable supplied
      responses.
    evidence_to_inspect: Record role chain, source generation, per-item provenance, result completeness
      and excluded/unknown scope.
    explanation_prompt: Use an empty partial result and identify the additional read needed before concluding
      the file or evidence is absent.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: Search returns a prior passing test and an empty current-code lookup. The team needs to know
        what either result establishes.
      briefing: Inspect source-of-record, raw observation, agent-written lesson and index entry roles;
        read scope, snapshot, completeness and provenance on each result.
      fixed: Same source corpus, permission boundary and query intent; vary one request bound or envelope
        condition.
      feedback_rule: Only a complete search of declared scope supports a scoped nonexistence claim. A
        high-ranked derived lesson does not replace its authoritative source.
      next: Choose a retrieval route for the evidence the next repair step needs.
    policy_options:
    - id: policy_1
      label: Direct source read
    - id: policy_2
      label: Bounded index read with full envelope
    - id: policy_3
      label: Derived lesson with linked source evidence
  - id: v3_06_B
    title: Bound the evidence path
    source_concepts:
    - chapter: 6
      concept: Query formulation choice
      concept_map: books/vol3/06_long_term_memory/long_term_memory_concepts.yml
    - chapter: 6
      concept: Bounded multi-hop retrieval
      concept_map: books/vol3/06_long_term_memory/long_term_memory_concepts.yml
    source_anchor: sec-vol3-persistent-graphrag
    learning_claim: A named target gets a direct read, a predictable unnamed set gets pre-staged, and
      a chain where each item is found only from the last forces model-directed probing at one model round
      per dependent hop. Neighborhoods grow geometrically with traversal depth, so multi-hop retrieval
      bounds edge types, direction, depth, and visited nodes before ranking.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Compare direct read, pre-staged set or model-directed probing for supplied information needs;
      vary traversal bounds on the same code graph.
    student_action: Compare direct read, pre-staged set or model-directed probing for supplied information
      needs; vary traversal bounds on the same code graph.
    evidence_to_inspect: Dependent model rounds, visited nodes, edge types, returned source evidence,
      truncated paths and total staged tokens.
    explanation_prompt: Add a high-degree utility node or a cycle and choose bounds that preserve the
      needed path without treating cutoff as absence.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A named source file is available, while the failing test reaches the relevant notification
        code only through call and data dependencies.
      briefing: Read direct lookup, pre-staged predictable sets and dependent probes. Graph edges have
        types, directions, depth and visited-node limits.
      fixed: Same authorized snapshot, query intent, graph and overall retrieval/context allowance.
      feedback_rule: A bounded traversal may be incomplete; display what was cut off. Direct lookup needs
        a named target, and repeated model probes are charged as dependent rounds.
      next: Useful results must enter persistent storage through a controlled write policy.
    policy_options:
    - id: policy_1
      label: Direct named-target read
    - id: policy_2
      label: Pre-stage predictable neighborhood
    - id: policy_3
      label: Bounded model-directed dependency probes
  - id: v3_06_C
    title: Write lessons without laundering guesses
    source_concepts:
    - chapter: 6
      concept: Memory write policy
      concept_map: books/vol3/06_long_term_memory/long_term_memory_concepts.yml
    - chapter: 6
      concept: Memory poisoning
      concept_map: books/vol3/06_long_term_memory/long_term_memory_concepts.yml
    source_anchor: sec-vol3-long-term-memory-write-path
    learning_claim: 'The runtime, not the model, decides what persists: admission checks run before deduplication,
      same-scope updates supersede by compare-and-swap, and deletion (on request, on withdrawn consent,
      or at the end of a recorded retention period) is a lifecycle event the store must honor. Repeated
      retrieval or re-summarization adds no independent evidence, so preventing a withdrawn or unverified
      claim from persisting needs a provenance graph over derived records whose invalidation cascades.'
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Admit or reject supplied candidate memories, compare admission-first with similarity-first
      deduplication, then withdraw the original claim.
    student_action: Admit or reject supplied candidate memories, compare admission-first with similarity-first
      deduplication, then withdraw the original claim.
    evidence_to_inspect: Admission reasons, compare-and-swap outcomes, superseded records, derived-record
      dependency graph and deletion/invalidation completion state.
    explanation_prompt: Supply a near-duplicate authoritative update that contradicts an old lesson, or
      delete a source whose cached summary remains retrievable.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A timeout hypothesis has been refuted, but copies of it survive inside an episode summary
        and a project lesson.
      briefing: Inspect permission/consent, record role/scope, backing evidence, supersession generation
        and dependency links before deduplication.
      fixed: Same raw logs, claim provenance, write scope, source generation and retention/deletion contract.
      feedback_rule: Repeated retrieval adds no independent evidence. Cascade invalidation to supported
        descendants; distinguish current retrieval exclusion from physical purge and expose pending deletion.
      next: Finally ensure the index reflects current sources and compare the full lifecycle policy.
    policy_options:
    - id: policy_1
      label: Admit raw observation only
    - id: policy_2
      label: Admit evidence-linked scoped lesson
    - id: policy_3
      label: Defer unsupported lesson pending verification
  - id: v3_06_D
    title: Serve current evidence across sessions
    source_concepts:
    - chapter: 6
      concept: Source-generation invalidation
      concept_map: books/vol3/06_long_term_memory/long_term_memory_concepts.yml
    - chapter: 6
      concept: Memory policy evaluation
      concept_map: books/vol3/06_long_term_memory/long_term_memory_concepts.yml
    source_anchor: sec-vol3-persistent-invalidation
    learning_claim: A retrieval index is a materialized view that cannot be maintained by deltas, so each
      derived entry carries a source generation and the gateway admits it only for the generations it
      is valid in. The unit of evaluation is the whole memory policy run through isolated multi-session
      trials with lifecycle fixtures, scored by task acceptance and cost per accepted task including background
      maintenance.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Compare direct-source fallback, bounded wait or explicit partial result during refresh;
      replay lifecycle cases in separate policy stores.
    student_action: Compare direct-source fallback, bounded wait or explicit partial result during refresh;
      replay lifecycle cases in separate policy stores.
    evidence_to_inspect: Admitted/rejected generations, stale reads, refresh wait, read-your-writes result,
      supersession/deletion completion, task acceptance and background maintenance cost.
    explanation_prompt: Delay refresh or delete a source between sessions and inspect whether the apparently
      cheapest policy remains eligible.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The source commits r18 while its search index still holds r17. The next repair session must
        continue without treating old code as current.
      briefing: Read generation admission and the declared refresh policy. Compare isolated multi-session
        trials with identical initial source/memory snapshots and maintenance budget.
      fixed: Same committed source sequence, permissions, task sequence, model/tools, acceptance contract
        and total budget.
      feedback_rule: Never admit obsolete entries as current. Keep partial/unavailable outcomes visible
        and charge indexing, consolidation and deletion work; relevance alone is not task acceptance.
      next: Carry current, scoped evidence into Tool Calling, where proposals must meet action-time preconditions.
    policy_options:
    - id: policy_1
      label: Direct-source refresh fallback
    - id: policy_2
      label: Bounded wait for new index generation
    - id: policy_3
      label: Explicit partial result during refresh
