  model_support:
    existing:
    - Hardware bandwidth/capacity registry supports exact-scan lower-bound reference
    - Canonical agent workload profiles establish the repair and secondary support/research scope
    missing:
    - Source-of-record/observation/derived-memory/index fixture catalog
    - Bounded retrieval envelope and graph traversal engine
    - Admission/supersession/deletion/provenance-cascade and source-generation fixtures
    - Isolated cross-session memory-policy evaluator with full maintenance accounting
    boundary: No similarity-to-truth mapping. Retrieval relevance, policy acceptance and source freshness
      require explicit labeled records; bandwidth floors do not predict index recall or full query latency.
