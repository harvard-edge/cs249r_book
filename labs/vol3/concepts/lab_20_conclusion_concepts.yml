      concept_map: books/vol3/04_context_engineering/context_engineering_concepts.yml
      role: synthesis; prior owner
    - chapter: 7
      concept: Operation identity
      concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
      role: synthesis; prior owner
    - chapter: 7
      concept: Settlement before retry
      concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
      role: synthesis; prior owner
    - chapter: 11
      concept: Durable intent before dispatch
      concept_map: books/vol3/11_durable_execution/durable_execution_concepts.yml
      role: synthesis; prior owner
    - chapter: 12
      concept: Compensation
      concept_map: books/vol3/12_failure_recovery/failure_recovery_concepts.yml
      role: synthesis; prior owner
    source_anchor: sec-vol3-conclusion-execution
    learning_claim: Persistent records are roles in an evidence chain (source of record, observation log,
      agent-written memory, retrieval index), not storage tiers, and any claim is validated against its
      source of record. A verified write withdraws current-state authority from bound observations and
      flags dependent conclusions for reassessment, without erasing their historical truth. A logical
      operation ID names one intended effect across attempts, each attempt gets a fresh attempt ID, and
      the ID is safe only under an endpoint contract that binds it to caller, scope, and arguments. A
      timeout records that the caller stopped waiting, not that the effect failed, so a dispatched mutation
      without a reply is an uncertain outcome that blocks retry until its repeat semantics or evidence
      settle it. An admitted operation's identity, arguments, grant reference, and reservation must be
      durable under the declared failure domain before the request leaves, so no effect can exist without
      its intent on record. An external service and the runtime log share no atomic commit, so an established
      effect is remediated only by a separately committed forward operation that restores declared postconditions,
      not the past.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose status reconciliation with the original operation identity, blind fresh retry, or
      escalation; choose which stale views to rebuild.
    student_action: Choose status reconciliation with the original operation identity, blind fresh retry,
      or escalation; choose which stale views to rebuild.
    evidence_to_inspect: Intent/dispatch/settlement records, endpoint status, current source version,
      derived-view freshness, and outstanding owner.
    explanation_prompt: Remove status-query support or change the source during deliberation; explain
      safe unresolved handling.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: Synthesis of previously owned concepts
    narrative:
      scene: 'The repair-system dossier is complete. The final incident transfers its contracts to the
        existing remediation lighthouse: an approved rollback loses its acknowledgment, and recovery must
        be proven.'
      briefing: Synthesize record roles, context invalidation, action-time preconditions, durable intent,
        settlement, and recovery. A lost reply leaves the effect unknown.
      fixed: Approved payload, operation identity, endpoint recovery contract, durable intent, and service
        version.
      feedback_rule: Only authoritative effect evidence resolves the operation. Valid old KV computation
        is not fresh source evidence; stopping retains unresolved obligations.
      next: The integrated trace supports a targeted remedy, not automatic retraining.
    policy_options:
    - Reconcile the original operation identity
    - Retry the mutation under a fresh identity
    - Assume the timeout proves failure
  - id: v3_20_C
    title: Choose the remedy
    source_concepts:
    - chapter: 14
      concept: Postmortem by intervention
      concept_map: books/vol3/14_agent_operations/agent_operations_concepts.yml
      role: synthesis; prior owner
    - chapter: 15
      concept: Capability-gap triage
      concept_map: books/vol3/15_trajectory_curation/trajectory_curation_concepts.yml
      role: synthesis; prior owner
    - chapter: 16
      concept: Three homes for behavior
      concept_map: books/vol3/16_fine_tuning/fine_tuning_concepts.yml
      role: synthesis; prior owner
    source_anchor: sec-vol3-conclusion-remedy-selection
    learning_claim: An agent incident is diagnosed by keeping findings separated by boundary and testing
      each with a controlled intervention on the recorded trajectory, not by naming one culprit. A failure
      earns a weight update only if it persists with complete context, a well-formed interface, and a
      healthy runtime, so counterfactual probes run up the intervention ladder from context and schema
      to SFT and then RL. Fine-tuning changes only the proposal distribution, so stable procedure can
      move into weights, deployment-varying contracts stay in context, and enforcement stays in the runtime.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: 'Choose one controlled remedy probe: context refresh, schema repair, runtime settlement
      repair, or residual policy adaptation.'
    student_action: 'Choose one controlled remedy probe: context refresh, schema repair, runtime settlement
      repair, or residual policy adaptation.'
    evidence_to_inspect: Boundary-specific finding, controlled continuation, changed component, residual
      failure, and regression scope.
    explanation_prompt: A context repair helps one case but fails on another; decide whether more evidence
      or a different owner is required.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: Synthesis of previously owned concepts
    narrative:
      scene: 'The repair-system dossier is complete. The final incident transfers its contracts to the
        existing remediation lighthouse: an approved rollback loses its acknowledgment, and recovery must
        be proven.'
      briefing: Synthesize controlled intervention, capability-gap triage, adaptation scope, and correlated-review
        limits using the incident evidence.
      fixed: Saved prefix, task contract, permitted actions, evaluation fixture, and candidate identity.
      feedback_rule: A better continuation supports only its scoped claim. Do not train a missing state
        transition into weights or treat reviewer agreement as causal proof.
      next: The team can now submit an evidence-linked safety case and bounded release recommendation.
    policy_options:
    - Repair the attributed state/interface/runtime boundary
    - Fine-tune before testing the boundary explanation
    - Run a matched probe to resolve attribution
  - id: v3_20_D
    title: Defend the completed system
    source_concepts:
    - chapter: 14
      concept: Release gate
      concept_map: books/vol3/14_agent_operations/agent_operations_concepts.yml
      role: synthesis; prior owner
    - chapter: 14
      concept: Empirical safety case
      concept_map: books/vol3/14_agent_operations/agent_operations_concepts.yml
      role: synthesis; prior owner
    - chapter: 19
      concept: Cohort cost per accepted task
      concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
      role: synthesis; prior owner
    - chapter: 18
      concept: Correlated reviewers
      concept_map: books/vol3/18_multi_agent/multi_agent_concepts.yml
      role: synthesis; prior owner
    source_anchor: sec-vol3-conclusion-safety
    learning_claim: A release decision is a declared conjunctive rule written before data and applied
      to an evidence record that keeps verdicts, paired cohorts, and diagnostics. Release is justified
      by a scoped, inspectable safety case of claim, argument, evidence, assumptions, and residual uncertainty,
      and evidence for one claim does not establish the others. Measured cost per accepted task is the
      sum of every initiated task's account, each charge in exactly one category, divided by the distinct
      tasks accepted under one declared contract. Reviewers share each candidate's difficulty, so correlated
      errors set an irreducible floor on majority-vote false approval that adding reviewers cannot remove.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose deploy, bounded next experiment, or hold; attach exact prior comparisons and identify
      a condition that would reverse the decision.
    student_action: Choose deploy, bounded next experiment, or hold; attach exact prior comparisons and
      identify a condition that would reverse the decision.
    evidence_to_inspect: Dossier claims linked to prior lab artifacts, unresolved gaps, budget/settlement
      record, release clauses, and next measurement.
    explanation_prompt: Change a dependency, acceptance criterion, or authority grant and identify which
      evidence must be renewed.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: Synthesis of previously owned concepts
    narrative:
      scene: 'The repair-system dossier is complete. The final incident transfers its contracts to the
        existing remediation lighthouse: an approved rollback loses its acknowledgment, and recovery must
        be proven.'
      briefing: Synthesize release gates, empirical safety cases, cohort accounting, and specification
        limits. Finishing means a bounded, reviewable decision, including a justified hold.
      fixed: Adopted contract, candidate revision, evidence provenance, safety boundaries, and release
        policy.
      feedback_rule: Check every claim against its scope and evidence. Passing local checks never certifies
        all reachable states; missing evidence remains visible and can require hold.
      next: The series closes with a defended systems decision; physical action is an optional Volume
        IV boundary, not an undeclared prerequisite.
    policy_options:
    - Hold with named missing evidence
    - Authorize a bounded next experiment
    - Request deployment only if every declared release clause passes
  primary_concept_dispositions: []
  model_support:
    existing:
    - Canonical deterministic policy/evidence fixtures in MLSysIM; each part declares its supported mechanism
      and limits.
    missing:
    - Numerical learning dynamics, physical service-time predictions, and population generalization are
      outside these categorical reference instruments.
    boundary: Fixed authored policy cases; not live model execution or production performance measurements.
