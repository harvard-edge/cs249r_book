lab_concept_map:
  schema_version: 1
  lab_id: v3_20
  chapter: 20
  title: Conclusion
  source_notebook: labs/vol3/lab_20_conclusion.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded controlled policy references; numerical and transfer limits explicit
  source_chapter_concept_map: books/vol3/20_conclusion/conclusion_concepts.yml
  source_chapter: books/vol3/20_conclusion/20_conclusion.qmd
  chapter_goal: Defend a scoped agent-system dossier by combining prior evidence, unresolved obligations,
    and explicit reversal conditions.
  student_goals:
  - Translate the incident into an operating envelope and identify which earlier claim supports each bound.
  - Resolve a lost acknowledgment without inventing success or repeating an unsafe effect, and refresh
    the evidence for the next decision.
  - Match an attributed failure to its owner and cheapest justified intervention while preserving uncertainty.
  - Build a claim–argument–evidence dossier, identify residual uncertainty, and defend what may happen
    next.
  narrative:
    situation: The team has assembled its case for the repair system. Now an operations incident tests
      the same reasoning in a new setting. An approved rollback loses its acknowledgment. Did it happen,
      and what may the agent do next without repeating an effect that already occurred?
    previously: The supplied system combines model, memory, tools, supervision, and whole-task cost evidence.
    next: The series closes with a defended systems decision; physical action is an optional Volume IV
      boundary, not an undeclared prerequisite.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Declare the complete contract
    question: What contract does the final system actually meet?
    goal: Translate the incident into an operating envelope and identify which earlier claim supports
      each bound.
    concept_ids:
    - v3_20_A
    coverage: Synthesis of prior-owned claims; no new concepts.
    limitation: Adopted contract ownership and unauthorized relaxation audit. Fixed authored cases do
      not predict learned behavior or production performance.
    next: An accepted contract needs fresh state and settled execution across boundaries.
  - part: B
    title: Reconcile state and action
    question: Do retained state and effect evidence agree?
    goal: Resolve a lost acknowledgment without inventing success or repeating an unsafe effect, and refresh
      the evidence for the next decision.
    concept_ids:
    - v3_20_B
    coverage: Synthesis of prior-owned claims; no new concepts.
    limitation: Lost-acknowledgment settlement and subsequent current-state context invalidation. Fixed
      authored cases do not predict learned behavior or production performance.
    next: The integrated trace supports a targeted remedy, not automatic retraining.
  - part: C
    title: Choose the remedy
    question: What remedy does the observed failure warrant?
    goal: Match an attributed failure to its owner and cheapest justified intervention while preserving
      uncertainty.
    concept_ids:
    - v3_20_C
    coverage: Synthesis of prior-owned claims; no new concepts.
    limitation: Attributed adapter repair versus premature policy adaptation. Fixed authored cases do
      not predict learned behavior or production performance.
    next: The team can now submit an evidence-linked safety case and bounded release recommendation.
  - part: D
    title: Defend the completed system
    question: What can the final dossier support?
    goal: Build a claim–argument–evidence dossier, identify residual uncertainty, and defend what may
      happen next.
    concept_ids:
    - v3_20_D
    coverage: Synthesis of prior-owned claims; no new concepts.
    limitation: Scoped claim-evidence dossier and missing population release obligations. Fixed authored
      cases do not predict learned behavior or production performance.
    next: The series closes with a defended systems decision; physical action is an optional Volume IV
      boundary, not an undeclared prerequisite.
  core_concepts:
  - id: v3_20_A
    title: Declare the complete contract
    source_concepts:
    - chapter: 1
      concept: Task contract
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
      role: synthesis; prior owner
    - chapter: 1
      concept: H·S·A exposures
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
      role: synthesis; prior owner
    - chapter: 1
      concept: Closure evidence levels
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
      role: synthesis; prior owner
    - chapter: 19
      concept: Architecture pricing with human fallback
      concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
      role: synthesis; prior owner
    source_anchor: sec-vol3-conclusion-envelope
    learning_claim: A goal with negative scope, an environment, permitted actions, available observations,
      and completion criteria turn intent into something the runtime can enforce, and each omitted field
      produces a specific, predictable failure. A task's coordinate is its horizon H in turns, carried
      state S0 to S3, and authority A0 to A3, each level set by operational consequence rather than command
      syntax, and the coordinate names the exposure that closure must answer. Self-report, static analysis,
      visible tests, sealed tests, and formal verification form a default ordering of acceptance evidence
      that coverage can override, and every check is a bounded claim narrower than the task. Deterministic
      code, a fixed workflow, a bounded loop, and delegation are compared under one acceptance contract
      by cost per resolved task including human fallback, not by automated cost per automated acceptance.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose a bounded investigation and completion contract from supplied alternatives; preserve
      the authorized contract owner.
    student_action: Choose a bounded investigation and completion contract from supplied alternatives;
      preserve the authorized contract owner.
    evidence_to_inspect: Five-part contract, exposure bounds, record owners, acceptance evidence, and
      provenance links back to earlier labs.
    explanation_prompt: Offer a faster recovery claim obtained by weakening a threshold; identify required
      authority and new evidence.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: Synthesis of previously owned concepts
    narrative:
      scene: 'The repair-system dossier is complete. The final incident transfers its contracts to the
        existing remediation lighthouse: an approved rollback loses its acknowledgment, and recovery must
        be proven.'
      briefing: This is synthesis of the introduction task contract, exposures, closure evidence, and
        economics; the conclusion introduces no new owned concepts.
      fixed: Incident task, allowed endpoint, existing service requirements, and declared authority.
      feedback_rule: Flag unauthorized changes to recovery criteria and unknown closure evidence. A model
        may propose a contract revision but cannot adopt it.
      next: An accepted contract needs fresh state and settled execution across boundaries.
    policy_options:
    - Keep the adopted bounded incident contract
    - Let the proposer shorten the recovery window
    - Request authorized contract revision with new evidence
  - id: v3_20_B
    title: Reconcile state and action
    source_concepts:
    - chapter: 6
      concept: Record roles
      concept_map: books/vol3/06_long_term_memory/long_term_memory_concepts.yml
      role: synthesis; prior owner
    - chapter: 4
