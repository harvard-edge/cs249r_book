lab_concept_map:
  schema_version: 1
  lab_id: v3_09
  chapter: 9
  title: Agent Security
  source_notebook: labs/vol3/lab_09_security.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded policy investigations; broader mechanisms explicitly scoped
  source_chapter_concept_map: books/vol3/09_security/security_concepts.yml
  source_chapter: books/vol3/09_security/09_security.qmd
  chapter_goal: Defend how untrusted content may influence proposals without granting new authority or releasing
    protected information.
  student_goals:
  - Trace an unauthorized disclosure through a syntactically permitted operation and separate source influence
    from task authority.
  - Propagate source labels through a derived field and identify which uses need evidence or release authorization.
  - Determine whether a reviewed action remains admissible after a scope or argument change.
  - Evaluate a defense on episode-level security and usefulness while recognizing unresolved outcomes.
  narrative:
    situation: The repair environment blocks a direct credential read, yet an approved package-search call
      can still send private test fixtures to an outside service in its query. Follow that data and decide
      where the runtime must intervene while keeping useful searches available.
    previously: The supplied sandbox protects the host, but its allowed tools can still send data outside it.
    next: The task has dispatch-time policy, but a long trajectory must preserve it through pauses, approvals,
      late results, and budgets. The next lab gives continuation to the harness.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: A permitted tool can disclose the wrong data
    question: Can an allowed tool still disclose protected data?
    goal: Trace an unauthorized disclosure through a syntactically permitted operation and separate source
      influence from task authority.
    concept_ids:
    - v3_09_A
    coverage: Structural prompt injection; Callable is not permitted — bounded supplied-case policy comparison
    limitation: This fixture shows one attack path, not attack success rate or protection against every exfiltration
      channel. The injected proposal is supplied; no model attack generation or detection classifier runs.
    next: The next part carries the provenance through extraction and transformation.
  - part: B
    title: Extracted fields retain their provenance
    question: What trust survives extracting a field?
    goal: Propagate source labels through a derived field and identify which uses need evidence or release
      authorization.
    concept_ids:
    - v3_09_B
    coverage: Information-flow labels; Quarantined readers — bounded supplied-case policy comparison
    limitation: The label lattice and independent evidence are fixed fixture records; semantic truth of arbitrary
      text is not inferred. The instrument consumes fixed provenance evidence; it does not execute a quarantined
      reader or propagate a label lattice through transformations.
    next: Provenance must meet identities and approval at the actual action boundary.
  - part: C
    title: Approval for this exact action
    question: Does this approval cover the current action?
    goal: Determine whether a reviewed action remains admissible after a scope or argument change.
    concept_ids:
    - v3_09_C
    coverage: Effective permission intersection; Action-bound approval — bounded supplied-case policy comparison
    limitation: No approval UI or authentication mechanism is implemented; identities come from fixture runtime
      records, never model text. The action digest and permission intersection are supplied evidence; the
      instrument does not authenticate approvers or compute cryptographic bindings.
    next: The next part tests whether these decisions survive adaptation across turns.
  - part: D
    title: Hold the boundary across a whole episode
    question: Does the boundary hold across the full episode?
    goal: Evaluate a defense on episode-level security and usefulness while recognizing unresolved outcomes.
    concept_ids:
    - v3_09_D
    coverage: Multi-turn policy continuity; Security outcome measurement — bounded supplied-case policy comparison
    limitation: A finite deterministic episode cannot establish adversarial robustness; legitimate-task acceptance
      and defense overhead need representative evaluation. Records are independent proposals illustrating
      episode continuity, not a stateful adaptive attacker; no episode success rate or defense overhead is
      estimated.
    next: The harness must now enforce policy and continuation even when the model proposes another step.
  core_concepts:
  - id: v3_09_A
    title: A permitted tool can disclose the wrong data
    source_concepts:
    - chapter: 9
      concept: Structural prompt injection
      concept_map: books/vol3/09_security/security_concepts.yml
    - chapter: 9
      concept: Callable is not permitted
      concept_map: books/vol3/09_security/security_concepts.yml
    source_anchor: sec-vol3-security-request-authorization
    learning_claim: Instructions, tool definitions, the request, and every observation are serialized into
      one token sequence in which no position carries enforced privilege, so injection is structural and exposure
      grows with every untrusted read. Injection turns the runtime into a confused deputy with a legitimate
      identity, so authorization must judge this request within this task, not the function name, argument
      types, or endpoint allowlist.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare tool-name allowlisting with request-level authorization on public-documentation and
      fixture-bearing search proposals.
    student_action: Compare function-name allowlisting with request-purpose and permitted-sink checks on fixed
      disclosure and legitimate-response proposals.
    evidence_to_inspect: Input provenance, authorization record, actual outgoing payload, protected-sink observation,
      and useful search outcome where supplied.
    explanation_prompt: Replace the obvious attack phrase with a plausible diagnostic instruction carrying
      the same confidential bytes. Does the decision still follow policy?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A dependency README tells the repair agent to place the private fixture in a package-search query.
      briefing: The same schema-valid search operation can carry public terms or confidential bytes. The fixture
        identifies the attacker-controlled source, task request, and outbound sink.
      fixed: Same tool schema, service identity, task grant, outbound recipient, and proposals.
      feedback_rule: Judge the effect at the sink, not a refusal sentence. A failed remote lookup can still
        disclose its query; a blocked proposal is not a sent request.
      next: The next part carries the provenance through extraction and transformation.
    policy_options: []
  - id: v3_09_B
    title: Extracted fields retain their provenance
    source_concepts:
    - chapter: 9
      concept: Information-flow labels
      concept_map: books/vol3/09_security/security_concepts.yml
    - chapter: 9
      concept: Quarantined readers
      concept_map: books/vol3/09_security/security_concepts.yml
    source_anchor: sec-vol3-security-taint-tracking
    learning_claim: Confidentiality and integrity provenance vary independently, so the host attaches both
      to every record, propagates them by the lattice join, and checks release and evidence before dispatch.
      A quarantined reader keeps raw untrusted text out of the planner and typed handles keep untrusted bytes
      out of context, but a schema-valid field is still an untrusted claim, not evidence.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare raw ingestion with quarantined typed extraction; choose whether a field may serve as
      a test claim or outbound search argument under the declared labels.
    student_action: Compare schema-only acceptance with independent integrity and release-label checks on
      typed extracted fields.
    evidence_to_inspect: Planner-visible fields, joined labels and provenance, omitted useful content, extra
      reader work, and dispatch decisions.
    explanation_prompt: Make the typed field task-relevant but attacker-controlled, or mix a public value
      with a private value. Reconsider its use.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The team isolates the README reader and keeps only typed test flags, but an extracted field claims
        all required tests have passed.
      briefing: Confidentiality and integrity labels answer different questions. A reader with no execution
        authority reduces exposure, while its schema-valid output remains an untrusted assertion.
      fixed: Same README bytes, private fixture, task, extraction fields, and independently observed test
        evidence.
      feedback_rule: Show the exact source labels behind each derived value and why the selected use passes
        or fails. Extraction never upgrades a claim into test evidence.
      next: Provenance must meet identities and approval at the actual action boundary.
    policy_options: []
  - id: v3_09_C
    title: Approval for this exact action
    source_concepts:
    - chapter: 9
      concept: Effective permission intersection
      concept_map: books/vol3/09_security/security_concepts.yml
    - chapter: 9
      concept: Action-bound approval
      concept_map: books/vol3/09_security/security_concepts.yml
    source_anchor: sec-vol3-security-action-bound-approval
    learning_claim: When an agent acts for a requester, effective permission is the intersection of requester
      rights, service principal, task grant, and issuer and receiver policy, with identities taken from the
      runtime's task record, never from prompt text. Human approval binds to a digest of the canonical, host-resolved
      action, is presented out of band with the agent's explanation labeled untrusted, and is re-verified
      with its preconditions immediately before dispatch.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Select service-wide or intersected authority; compare prompt-text approval with an out-of-band
      digest-bound approval while changing target or candidate bytes.
    student_action: Compare approval-only admission with permission-intersection, exact-action, and current-precondition
      checks.
    evidence_to_inspect: Permission intersection, resolved action digest, approved digest/expiry, current
      preconditions, and actual dispatch or hold.
    explanation_prompt: Keep the action bytes fixed but revoke a permission or change the endpoint state.
      Does the old approval still suffice?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The service identity can access many repositories, but the requester authorized only the connection-pool
        repair. A held submission changes after review.
      briefing: The host task record supplies identities; effective rights intersect requester, service, task,
        and receiver policies. An approval binds canonical resolved arguments and preconditions.
      fixed: Same requester, service principal, task grant, initial proposal, approval event, and changed-action
        trace.
      feedback_rule: Identify the specific failed right or binding rather than saying approval always authorizes
        execution. A matching approval is one current precondition.
      next: The next part tests whether these decisions survive adaptation across turns.
    policy_options: []
  - id: v3_09_D
    title: Hold the boundary across a whole episode
    source_concepts:
    - chapter: 9
      concept: Multi-turn policy continuity
      concept_map: books/vol3/09_security/security_concepts.yml
    - chapter: 9
      concept: Security outcome measurement
      concept_map: books/vol3/09_security/security_concepts.yml
    source_anchor: sec-vol3-security-attack-success-utility
    learning_claim: Over a trajectory an attacker gains an adaptation oracle and conversational momentum,
      so every dispatch is re-evaluated against policy and an obfuscated retry after a block is still the
      blocked action. A defense is evaluated by system effects at the protected sink on whole eligible episodes,
      not by model text, and its overhead is priced in cost per accepted task.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare one-time screening with dispatch-time checks across the supplied adaptive episode traces;
      choose a defense under predeclared completion criteria.
    student_action: Compare session-start authorization with rechecking each supplied request, including the
      later obfuscated disclosure.
    evidence_to_inspect: Per-turn decisions, derived-record labels, final sink effects, accepted legitimate
      tasks, unresolved episodes, and recorded costs.
    explanation_prompt: Add a clean task whose useful output resembles the attack, or transfer to the research
      agent ingesting untrusted pages. Which protection remains justified?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A rejected fixture-bearing query reappears after the history is summarized as a diagnostic recommendation.
      briefing: Security observations cover entire eligible episodes, including later dispatches, useful completion,
        and overhead. Refusal text and one blocked turn are intermediate evidence.
      fixed: Same attack/task suite, eligible-episode denominator, allowed budget, and protected-sink criterion.
      feedback_rule: Report each eligible outcome and supplied denominator; preserve pending or unknown cases.
        Distinguish reduced attacks from lost useful completions.
      next: The harness must now enforce policy and continuation even when the model proposes another step.
    policy_options: []
  primary_concept_dispositions:
