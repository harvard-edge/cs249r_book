    part: A
    disposition: bounded supplied-case investigation; The injected proposal is supplied; no model attack generation
      or detection classifier runs.
  - concept: Callable is not permitted
    part: A
    disposition: bounded supplied-case investigation; The injected proposal is supplied; no model attack generation
      or detection classifier runs.
  - concept: Information-flow labels
    part: B
    disposition: bounded supplied-case investigation; The instrument consumes fixed provenance evidence; it
      does not execute a quarantined reader or propagate a label lattice through transformations.
  - concept: Quarantined readers
    part: B
    disposition: bounded supplied-case investigation; The instrument consumes fixed provenance evidence; it
      does not execute a quarantined reader or propagate a label lattice through transformations.
  - concept: Effective permission intersection
    part: C
    disposition: bounded supplied-case investigation; The action digest and permission intersection are supplied
      evidence; the instrument does not authenticate approvers or compute cryptographic bindings.
  - concept: Action-bound approval
    part: C
    disposition: bounded supplied-case investigation; The action digest and permission intersection are supplied
      evidence; the instrument does not authenticate approvers or compute cryptographic bindings.
  - concept: Multi-turn policy continuity
    part: D
    disposition: bounded supplied-case investigation; Records are independent proposals illustrating episode
      continuity, not a stateful adaptive attacker; no episode success rate or defense overhead is estimated.
  - concept: Security outcome measurement
    part: D
    disposition: bounded supplied-case investigation; Records are independent proposals illustrating episode
      continuity, not a stateful adaptive attacker; no episode success rate or defense overhead is estimated.
  model_support:
    existing:
    - Agents.Research.OrchestratorWorker, Agents.Remediation.OnCall, and Agents.Support.CustomerOps provide
      canonical untrusted-read exposure profiles used in chapter examples.
    required:
    - MLSysIM policy-lattice, permission-intersection, action-digest and multi-turn sink-observation fixtures.
      No model can infer an attack success rate from a label or an untrusted-read count.
    - Defense rates require explicit supplied eligible-episode observations; unsupported attacks are unknown,
      not prevented.
