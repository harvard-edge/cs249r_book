lab_concept_map:
  schema_version: 1
  lab_id: v3_14
  chapter: 14
  title: Operating Agents
  source_notebook: labs/vol3/lab_14_agent_operations.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded controlled policy references; numerical and transfer limits explicit
  source_chapter_concept_map: books/vol3/14_agent_operations/agent_operations_concepts.yml
  source_chapter: books/vol3/14_agent_operations/14_agent_operations.qmd
  chapter_goal: Choose what evidence to retain and whether the candidate warrants a controlled release,
    restriction, or hold.
  student_goals:
  - Identify which record establishes latency, recovery state, and task verdict, and locate missing diagnostic
    coverage.
  - Choose a retention policy that preserves a declared rare-failure investigation within privacy and
    storage limits.
  - Separate interface defect, policy behavior, and successful enforcement, then design a controlled counterfactual
    probe.
  - Apply a predeclared release gate and name the next evidence needed when the gate fails or remains
    unknown.
  narrative:
    situation: The repair team has an inconclusive offline candidate comparison and a retained failed
      connection-pool repair. The task is to learn what happened before granting live authority.
    previously: The supplied case includes an acceptance contract and an offline policy comparison; live use adds new evidence needs.
    next: Operational records now feed the question of whether a model-behavior gap deserves training.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Find the evidence boundary
    question: Which record can explain this incident?
    goal: Identify which record establishes latency, recovery state, and task verdict, and locate missing
      diagnostic coverage.
    concept_ids:
    - v3_14_A
    coverage: Trajectory traces
    limitation: Boundary coverage and record-role audit; no timed critical-path instrument. Fixed authored
      cases do not predict learned behavior or production performance.
    next: The team must decide which diagnostic details it can afford to retain.
  - part: B
    title: Keep the rare failure
    question: Which failures will the retention policy preserve?
    goal: Choose a retention policy that preserves a declared rare-failure investigation within privacy
      and storage limits.
    concept_ids:
    - v3_14_B
    coverage: Trace retention
    limitation: Head versus verdict-aware detail retention for a supplied delayed failure; no buffer sizing
      or retention-probability estimate. Fixed authored cases do not predict learned behavior or production
      performance.
    next: The retained failed prefix becomes a controlled diagnostic case.
  - part: C
    title: Test a cause
    question: What does the intervention establish?
    goal: Separate interface defect, policy behavior, and successful enforcement, then design a controlled
      counterfactual probe.
    concept_ids:
    - v3_14_C
    coverage: Postmortem by intervention
    limitation: Completeness-marker intervention on a fixed saved-prefix response table; no population
      effect estimate. Fixed authored cases do not predict learned behavior or production performance.
    next: The localized repair is a new revision requiring its own release evidence.
  - part: D
    title: Hold or expose
    question: Does the evidence justify controlled exposure?
    goal: Apply a predeclared release gate and name the next evidence needed when the gate fails or remains
      unknown.
    concept_ids:
    - v3_14_D
    coverage: Staged release; Release gate
    limitation: Inconclusive offline gate versus premature canary exposure; no sequential-monitor calculation.
      Fixed authored cases do not predict learned behavior or production performance.
    next: Operational records now feed the question of whether a model-behavior gap deserves training.
  core_concepts:
  - id: v3_14_A
    title: Find the evidence boundary
    source_concepts:
    - chapter: 14
      concept: Trajectory traces
      concept_map: books/vol3/14_agent_operations/agent_operations_concepts.yml
    source_anchor: sec-vol3-evaluation-tracing
    learning_claim: Spans bind every model call, mediated tool execution, and check to their trial and
      artifact, but a diagnostic trace may sample or drop and never replaces the durable recovery log
      or the verdict record.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose which boundaries to instrument on a supplied trace; inspect the dependency timeline
      rather than summing overlapping spans.
    student_action: Choose which boundaries to instrument on a supplied trace; inspect the dependency
      timeline rather than summing overlapping spans.
    evidence_to_inspect: Linked span graph, missing boundary markers, elapsed and unattributed intervals,
      and separate verdict/accounting records.
    explanation_prompt: Remove a model span versus a check span; determine which missing observation would
      change diagnosis.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair team has an inconclusive offline candidate comparison and a retained failed connection-pool
        repair. The task is to learn what happened before granting live authority.
      briefing: A span records an operation; the accounting record counts admitted trials; the durable
        log supports recovery. They answer different questions.
      fixed: Same candidate, task, observed intervals, verdict contract, and durable events.
      feedback_rule: Explain what the selected spans establish and explicitly mark gaps. A successful
        span is not a successful task; speed estimates require critical-path assumptions.
      next: The team must decide which diagnostic details it can afford to retain.
    policy_options:
    - Capture model calls only
    - Capture model, tool, and check boundaries
    - Use aggregate task metrics only
  - id: v3_14_B
    title: Keep the rare failure
    source_concepts:
    - chapter: 14
      concept: Trace retention
      concept_map: books/vol3/14_agent_operations/agent_operations_concepts.yml
    source_anchor: sec-vol3-evaluation-budgets
    learning_claim: Sampling may thin diagnostic detail but never the accounting record of admitted trials,
      verdicts, spend, and drops, and retention is chosen per verdict under storage and privacy budgets.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Compare uniform capture with verdict-aware retention; choose redaction and verdict-wait
      policy.
    student_action: Compare uniform capture with verdict-aware retention; choose redaction and verdict-wait
      policy.
    evidence_to_inspect: Retained classes, lost-detail flags, pending verdict windows, retained bytes,
      and fields removed by redaction.
    explanation_prompt: Delay verdicts beyond the retention window or introduce a private field needed
      for replay.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair team has an inconclusive offline candidate comparison and a retained failed connection-pool
        repair. The task is to learn what happened before granting live authority.
      briefing: Head sampling decides before outcomes; tail sampling waits for outcomes and needs enough
        temporary retention for delayed verdicts. Accounting is never sampled.
      fixed: Same admitted trials, record sizes, verdict delays, accounting denominator, and privacy restrictions.
      feedback_rule: Show actual selected records and replay limitations; privacy removal can destroy
        diagnostic fidelity. Missing details never remove a failed task from the denominator.
      next: The retained failed prefix becomes a controlled diagnostic case.
    policy_options:
    - Uniform head sample
    - Verdict-aware tail sample with control sample
    - Retain all diagnostic detail
  - id: v3_14_C
    title: Test a cause
    source_concepts:
    - chapter: 14
      concept: Postmortem by intervention
      concept_map: books/vol3/14_agent_operations/agent_operations_concepts.yml
    source_anchor: sec-vol3-postmortem-ablation
    learning_claim: An agent incident is diagnosed by keeping findings separated by boundary and testing
      each with a controlled intervention on the recorded trajectory, not by naming one culprit.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: 'Select one intervention: preserve complete observation, add typed truncation notice, or
      keep the original; compare matched saved-prefix continuations.'
    student_action: 'Select one intervention: preserve complete observation, add typed truncation notice,
      or keep the original; compare matched saved-prefix continuations.'
    evidence_to_inspect: Actual continuation artifacts and verdicts, changed boundary, unchanged controls,
      and unresolved causal alternatives.
    explanation_prompt: Repeat on another fixture or sampling realization; test whether the explanation
      survives.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair team has an inconclusive offline candidate comparison and a retained failed connection-pool
        repair. The task is to learn what happened before granting live authority.
      briefing: The trace shows a truncated tool response followed by an illegal proposal that the runtime
        correctly rejected. The trace alone cannot prove why the proposal happened.
      fixed: Saved prefix, fixture, policy revision, allowed scope, and test contract; sampling seed or
        repeated-run protocol is recorded.
      feedback_rule: Describe only what the controlled continuations support on this fixture. A local
        accepted repair does not establish population improvement.
      next: The localized repair is a new revision requiring its own release evidence.
    policy_options:
    - Keep original bounded observation
    - Supply complete observation on the same prefix
    - Supply typed truncation notice on the same prefix
  - id: v3_14_D
    title: Hold or expose
    source_concepts:
    - chapter: 14
      concept: Staged release
      concept_map: books/vol3/14_agent_operations/agent_operations_concepts.yml
    - chapter: 14
      concept: Release gate
      concept_map: books/vol3/14_agent_operations/agent_operations_concepts.yml
    source_anchor: sec-vol3-evaluation-synthesis
    learning_claim: Release exposure is staged so each stage answers its own question (offline gate, shadow
      execution, bounded canary), with sequential monitoring and hard tripwires that stop admission. A
      release decision is a declared conjunctive rule written before data and applied to an evidence record
      that keeps verdicts, paired cohorts, and diagnostics.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose the next permissible stage, canary exposure, and tripwires; evaluate the fixed gate
      without moving tolerances after seeing results.
    student_action: Choose the next permissible stage, canary exposure, and tripwires; evaluate the fixed
      gate without moving tolerances after seeing results.
    evidence_to_inspect: Paired cohort interval, diagnostic scope, pending verdicts, tripwire status,
      sequential monitor state, and gate clauses.
    explanation_prompt: Add a gate violation despite better average acceptance, or reduce canary share
      while labels are delayed.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair team has an inconclusive offline candidate comparison and a retained failed connection-pool
        repair. The task is to learn what happened before granting live authority.
      briefing: Offline, shadow, and canary stages answer distinct questions. A declared conjunctive release
        rule consumes evidence for the exact candidate revision.
      fixed: Candidate identity, task population, acceptance margin, monitoring protocol, authority limits,
        and stopping criteria.
      feedback_rule: 'Preserve the chapter outcome: candidate_v2 is inconclusive and the localized interface
        repair is not its cohort result. Fail or unknown blocks promotion; low canary share mainly changes
        calendar exposure and unmeasured harm, not required monitored samples.'
      next: Operational records now feed the question of whether a model-behavior gap deserves training.
    policy_options:
    - Hold and gather revised-candidate offline evidence
    - Authorize isolated shadow execution only
    - Request bounded canary subject to the predeclared gate
  primary_concept_dispositions:
  - concept: Trajectory traces
    part: A
    disposition: 'bounded policy reference: Boundary coverage and record-role audit; no timed critical-path
      instrument.'
  - concept: Trace retention
    part: B
    disposition: 'bounded policy reference: Head versus verdict-aware detail retention for a supplied
      delayed failure; no buffer sizing or retention-probability estimate.'
  - concept: Postmortem by intervention
    part: C
    disposition: 'bounded policy reference: Completeness-marker intervention on a fixed saved-prefix response
      table; no population effect estimate.'
  - concept: Staged release
    part: D
    disposition: 'bounded policy reference: Inconclusive offline gate versus premature canary exposure;
      no sequential-monitor calculation.'
  - concept: Release gate
    part: D
    disposition: 'bounded policy reference: Inconclusive offline gate versus premature canary exposure;
      no sequential-monitor calculation.'
  model_support:
    existing:
    - Canonical deterministic policy/evidence fixtures in MLSysIM; each part declares its supported mechanism
      and limits.
    missing:
    - Numerical learning dynamics, physical service-time predictions, and population generalization are
      outside these categorical reference instruments.
    boundary: Fixed authored policy cases; not live model execution or production performance measurements.
