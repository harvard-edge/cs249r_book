lab_concept_map:
  schema_version: 1
  lab_id: v3_11
  chapter: 11
  title: Durable Execution
  source_notebook: labs/vol3/lab_11_durable_execution.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded policy investigations; broader mechanisms explicitly scoped
  source_chapter_concept_map: books/vol3/11_durable_execution/durable_execution_concepts.yml
  source_chapter: books/vol3/11_durable_execution/11_durable_execution.qmd
  chapter_goal: Defend a restart protocol that reconciles durable intent, actual effects, and valid authority
    after interruption.
  student_goals:
  - Identify which acknowledged history survives a specified fault and reconstruct only the state supported
    by that history.
  - Classify an interrupted operation from its durable evidence and justify whether new dispatch is admissible.
  - Choose a recoverable state cut and reject a continuation whose identity, ownership, or obligations are
    inconsistent.
  - Locate the first mismatch under a declared equivalence and distinguish reconstruction, regression replay
    and fresh execution claims.
  narrative:
    situation: The worker loses power after starting a test on revision 18 of the repair workspace. Its
      replacement must recover the candidate patch, find out what the first worker requested, and
      preserve uncertainty about the test until its result is known.
    previously: The supplied harness tracks the repair while it runs. A replacement worker needs that state to survive a crash.
    next: Reconstruction restores known state and unknown outcomes. The next lab decides how to repair, compensate,
      or hold after partial external effects.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: What survived the crash
    question: What evidence survived the interruption?
    goal: Identify which acknowledged history survives a specified fault and reconstruct only the state supported
      by that history.
    concept_ids:
    - v3_11_A
    coverage: Failure-domain durability; Trajectory log — bounded supplied-case policy comparison
    limitation: The fault/storage survival matrix is declared evidence, not a real storage failure test. Storage
      tier and failure domain are fixed case evidence rather than a selectable fault injection or latency
      experiment.
    next: The ordering of intent and dispatch determines which external effects recovery must account for.
  - part: B
    title: The crash cut changes what absence proves
    question: What does an absent record actually prove?
    goal: Classify an interrupted operation from its durable evidence and justify whether new dispatch is
      admissible.
    concept_ids:
    - v3_11_B
    coverage: Durable intent before dispatch; Completeness rule — bounded supplied-case policy comparison
    limitation: The fixture does not claim atomic commit between the trajectory log and the external service.
      Crash positions and write-ahead ordering are fixed case records. Establishing non-dispatch returns the
      proposal to current admission; it does not order an automatic retry.
    next: Knowing the operation is not enough unless the workspace and control record form a consistent recovery
      boundary.
  - part: C
    title: A workspace and a record that belong together
    question: Do the workspace and durable record agree?
    goal: Choose a recoverable state cut and reject a continuation whose identity, ownership, or obligations
      are inconsistent.
    concept_ids:
    - v3_11_C
    coverage: Checkpoint binding; Resume protocol — bounded supplied-case policy comparison
    limitation: Checkpoint images and fencing checks are declared fixture facts, not distributed-storage correctness
      proofs. The instrument checks supplied checkpoint and ownership evidence, rather than acquiring a lease,
      restoring bytes, or running a resume protocol.
    next: The next part uses recorded boundaries for debugging without pretending to reproduce live external
      reality.
  - part: D
    title: Replay evidence, do not resample history
    question: What may be replayed after recovery?
    goal: Locate the first mismatch under a declared equivalence and distinguish reconstruction, regression
      replay and fresh execution claims.
    concept_ids:
    - v3_11_D
    coverage: Record and replay — bounded supplied-case policy comparison
    limitation: No model sampling is performed. Equality applies only to the recorded boundaries and declared
      reducer, not arbitrary external state. No projection fold, harness regression execution, equivalence
      comparator, or model resampling runs; this instrument checks evidence needed to call a replay historical.
    next: The next lab uses reconstructed evidence to choose recovery actions for partial effects.
  core_concepts:
  - id: v3_11_A
    title: What survived the crash
    source_concepts:
    - chapter: 11
      concept: Failure-domain durability
      concept_map: books/vol3/11_durable_execution/durable_execution_concepts.yml
    - chapter: 11
      concept: Trajectory log
      concept_map: books/vol3/11_durable_execution/durable_execution_concepts.yml
    source_anchor: sec-vol3-durable-execution-ack-failure-domain
    learning_claim: An acknowledgment is durable only against the faults its storage tier survives, so each
      write's durability is declared against a failure domain rather than assumed. Recovery state comes from
      an append-only, typed trajectory log, and the live trajectory record is a deterministic fold over that
      log.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Choose process, host, or storage-tier loss; compare local and declared replicated acknowledgment
      policies on the supplied trace.
    student_action: Compare acknowledgment-only recovery with fault-survival and complete-log-prefix checks
      on fixed storage records.
    evidence_to_inspect: Acknowledgment versus committed sequence, surviving events/artifacts, failure-domain
      contract, and reconstructed control fields.
    explanation_prompt: Change the fault from process crash to permanent host loss. Does the same acknowledged
      state remain usable?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A host is lost along with its attached disk. A replacement sees an acknowledged log on one storage
        tier and a lagging replica on another.
      briefing: Durable means surviving a declared failure domain. The current control record is reconstructed
        by folding typed events, not by trusting a conversational summary.
      fixed: Same events, checkpoint, event reducer and task; compare one fault domain per trial.
      feedback_rule: Name exactly which guarantee covers the selected fault and which evidence was lost. A
        durable label without a declared domain earns no recovery claim.
      next: The ordering of intent and dispatch determines which external effects recovery must account for.
    policy_options: []
  - id: v3_11_B
    title: The crash cut changes what absence proves
    source_concepts:
    - chapter: 11
      concept: Durable intent before dispatch
      concept_map: books/vol3/11_durable_execution/durable_execution_concepts.yml
    - chapter: 11
      concept: Completeness rule
      concept_map: books/vol3/11_durable_execution/durable_execution_concepts.yml
    source_anchor: sec-vol3-durable-execution-completeness-rule
    learning_claim: An admitted operation's identity, arguments, grant reference, and reservation must be
      durable under the declared failure domain before the request leaves, so no effect can exist without
      its intent on record. Where a crash falls in the ordering decides whether an operation is not dispatched,
      in doubt, or established, and an absent intent proves non-dispatch only in a complete authoritative
      log prefix.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Move the crash cut across the supplied ordered events; compare write-before-send with send-before-write
      and complete with lagging prefixes.
    student_action: Compare resending after absent completion with complete-prefix and absent-intent checks
      on supplied crash cuts.
    evidence_to_inspect: Durable-prefix watermark, intent and reservation, actual endpoint effect shown separately
      from recovery knowledge, and admissible next action.
    explanation_prompt: Remove completeness evidence or delay the reply after crash. Reconsider an apparently
      safe retry.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The replacement has no result for test_r18. It must decide whether the test was never sent or
        may already be running.
      briefing: The supplied event order places admission, durable intent, dispatch and outcome around a selectable
        crash cut. An absent intent proves non-dispatch only in a complete authoritative prefix.
      fixed: Same intended operation, endpoint effect schedule, failure domain and initial record.
      feedback_rule: Return not-dispatched, in-doubt, or established with the supporting event. Do not let
        omniscient endpoint truth leak into replacement-worker knowledge.
      next: Knowing the operation is not enough unless the workspace and control record form a consistent
        recovery boundary.
    policy_options: []
  - id: v3_11_C
    title: A workspace and a record that belong together
    source_concepts:
    - chapter: 11
      concept: Checkpoint binding
      concept_map: books/vol3/11_durable_execution/durable_execution_concepts.yml
    - chapter: 11
      concept: Resume protocol
      concept_map: books/vol3/11_durable_execution/durable_execution_concepts.yml
    source_anchor: sec-vol3-durable-execution-recovery-boundaries
    learning_claim: A checkpoint binds the record snapshot, workspace snapshot, artifacts, and reducer versions
      to one committed log position, captured as a consistent cut and published only after the state it references
      is durable. Resume is an authorized continuation in ordered stages (prove the prefix, acquire ownership
      with a fencing epoch, restore by fold, reconcile in-doubt operations) rather than a restart.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Select matching versus mismatched checkpoint components, then compare lease-only ownership with
      resource-checked fencing on the supplied stale-owner trace.
    student_action: Compare snapshot-only resumption with consistent-cut, fenced-owner, and reconciliation
      checks on supplied recovery records.
    evidence_to_inspect: Manifest hashes/versions, consistent-cut check, ownership epochs, restore fold, unresolved
      operation table and continuation guard.
    explanation_prompt: Make the old worker return after its lease expires, or revoke the saved grant. Which
      continuation must still be blocked?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The checkpoint names record_R_ckpt and ws_r18, but an older worker may return while the replacement
        restores it.
      briefing: A recovery manifest binds snapshot hashes, committed log position and reducer versions. Resume
        also needs exclusive ownership, current authorization and reconciliation of in-doubt work.
      fixed: Same task, checkpoint candidates, committed suffix, original and replacement workers, and current
        grants.
      feedback_rule: Identify which binding or resume stage failed; restoration never certifies an unresolved
        test outcome. Fencing is checked where the protected write lands.
      next: The next part uses recorded boundaries for debugging without pretending to reproduce live external
        reality.
    policy_options: []
  - id: v3_11_D
    title: Replay evidence, do not resample history
    source_concepts:
    - chapter: 11
      concept: Record and replay
      concept_map: books/vol3/11_durable_execution/durable_execution_concepts.yml
    source_anchor: sec-vol3-durable-execution-harness-regression-replay
    learning_claim: A sampled model reply cannot be regenerated, so reproduction substitutes recorded inputs
      at nondeterministic boundaries, and one recording serves time-travel inspection, harness regression,
      and counterfactual branching.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Choose projection reconstruction, harness regression replay, or live rerun; inspect boundary
      comparisons with strict or declared semantic equivalence.
    student_action: Compare same-prompt rerunning with recorded-boundary and artifact-binding checks on supplied
      replay cases.
    evidence_to_inspect: Boundary-by-boundary input/output differences, first mismatch, retained-artifact
      requirements and unsupported later effects.
    explanation_prompt: Delete a required recorded observation or change the equivalence rule to ignore a
      harmless trace ID. What claim remains supportable?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A revised harness stages a different test observation and later produces a different repair decision.
        The team wants the first causal divergence.
      briefing: A replay substitutes recorded model/tool inputs at nondeterministic boundaries. A fresh run
        creates new evidence; a counterfactual branch tests a changed policy under stated limits.
      fixed: Same retained event set, checkpoint and recorded inputs for replay; label any fresh external/model
        invocation separately.
      feedback_rule: Explain only what the selected replay mode establishes. Replayed output does not prove
        an unobserved remote test completed; later divergences may be consequences.
      next: The next lab uses reconstructed evidence to choose recovery actions for partial effects.
    policy_options: []
  primary_concept_dispositions:
  - concept: Failure-domain durability
    part: A
    disposition: bounded supplied-case investigation; Storage tier and failure domain are fixed case evidence
      rather than a selectable fault injection or latency experiment.
  - concept: Trajectory log
    part: A
    disposition: bounded supplied-case investigation; Storage tier and failure domain are fixed case evidence
      rather than a selectable fault injection or latency experiment.
  - concept: Durable intent before dispatch
    part: B
    disposition: bounded supplied-case investigation; Crash positions and write-ahead ordering are fixed case
      records. Establishing non-dispatch returns the proposal to current admission; it does not order an automatic
      retry.
  - concept: Completeness rule
    part: B
    disposition: bounded supplied-case investigation; Crash positions and write-ahead ordering are fixed case
      records. Establishing non-dispatch returns the proposal to current admission; it does not order an automatic
      retry.
  - concept: Checkpoint binding
    part: C
    disposition: bounded supplied-case investigation; The instrument checks supplied checkpoint and ownership
      evidence, rather than acquiring a lease, restoring bytes, or running a resume protocol.
  - concept: Resume protocol
    part: C
    disposition: bounded supplied-case investigation; The instrument checks supplied checkpoint and ownership
      evidence, rather than acquiring a lease, restoring bytes, or running a resume protocol.
  - concept: Record and replay
    part: D
    disposition: bounded supplied-case investigation; No projection fold, harness regression execution, equivalence
      comparator, or model resampling runs; this instrument checks evidence needed to call a replay historical.
  model_support:
    existing:
    - Agents.Coding.SWE_Bench_Runner.max_trajectory_steps and Agents.Remediation.OnCall, Agents.Research.OrchestratorWorker,
      Agents.Support.CustomerOps supply workload references.
    required:
    - MLSysIM append-only event-log and checkpoint fixtures with durability domains, crash cuts, complete-prefix
      proof, ownership epoch, artifact binding, and recorded nondeterministic inputs.
    - Checkpoint cost curves need canonical measured checkpoint/reconstruction inputs; do not substitute model
      resampling for replay.
