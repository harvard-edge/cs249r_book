lab_concept_map:
  schema_version: 1
  lab_id: v3_07
  chapter: 7
  title: Tool Calling
  source_notebook: labs/vol3/lab_07_tool_calling.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded policy investigations; broader mechanisms explicitly scoped
  source_chapter_concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
  source_chapter: books/vol3/07_tool_calling/07_tool_calling.qmd
  chapter_goal: Defend a tool-call policy that distinguishes structural validity, action-time permission,
    effect settlement, and bounded observation.
  student_goals:
  - Identify which check must guard the actual mutation and distinguish a rejected proposal from a committed
    edit.
  - Choose an admissible next step from evidence about an uncertain effect and explain the role of operation
    identity.
  - Distinguish job completion evidence from transport status and retain useful diagnostics under separate
    output budgets.
  - Compare staged toolkit designs without treating tool visibility as a grant or a smaller catalog as proof
    of better repair.
  narrative:
    situation: 'The connection-pool repair can now retrieve the needed context. Its next patch and test cross
      a tool boundary: who checks the file version, what did a timed-out call do, and how much output reaches
      the next turn?'
    previously: The supplied agent has retrieved relevant evidence and is ready to propose a patch and test.
    next: A carefully mediated shell call can still start code with excessive reach. The next lab contains
      the execution beneath the admitted call.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: A patch against a moving file
    question: Is this patch valid at the moment it is applied?
    goal: Identify which check must guard the actual mutation and distinguish a rejected proposal from a committed
      edit.
    concept_ids:
    - v3_07_A
    coverage: Complete mediation; Action-time preconditions — bounded supplied-case policy comparison
    limitation: The fixture assumes the endpoint checks version and effect atomically. A separate read followed
      by a write would not establish this guarantee. Check placement and concurrent-edit order are fixed in
      these supplied records; there is no selectable host-precheck branch.
    next: A valid tool call may still have an uncertain outcome when its reply disappears.
  - part: B
    title: A reply disappears
    question: What should happen after a missing reply?
    goal: Choose an admissible next step from evidence about an uncertain effect and explain the role of operation
      identity.
    concept_ids:
    - v3_07_B
    coverage: Settlement before retry; Operation identity — bounded supplied-case policy comparison
    limitation: No real endpoint is contacted; the committed-but-unacknowledged effect is a declared fixture
      fact. The endpoint is a fixed produce-another-event service with a committed original effect and an
      available bound probe. Deduplication contracts and attempt identities are discussed, not selectable.
    next: Even a settled call needs a trustworthy and bounded observation.
  - part: C
    title: The test log is not the job
    question: Did the job finish, or only the request?
    goal: Distinguish job completion evidence from transport status and retain useful diagnostics under separate
      output budgets.
    concept_ids:
    - v3_07_C
    coverage: Bounded observation; Acknowledgment is not completion — bounded supplied-case policy comparison
    limitation: No throughput or byte-budget optimum is inferred. Capture limits and context staging are separate
      interfaces. The instrument checks supplied omission and terminal-status evidence; it does not vary capture
      bytes, staging layout, or job schedules.
    next: The team can now price how much of the toolkit it needs to stage each turn.
  - part: D
    title: The catalog the model actually sees
    question: Which tool descriptions should the model see?
    goal: Compare staged toolkit designs without treating tool visibility as a grant or a smaller catalog
      as proof of better repair.
    concept_ids:
    - v3_07_D
    coverage: Discovery is not authority; Toolkit staging — bounded supplied-case policy comparison
    limitation: No model-selection accuracy or token savings are estimated from descriptor count. Toolkit
      staging is addressed as an admission boundary only; static/on-demand token costs, tool granularity,
      and repair success are not measured.
    next: Tool admission is coherent; next bound what the code can reach after admission.
  core_concepts:
  - id: v3_07_A
    title: A patch against a moving file
    source_concepts:
    - chapter: 7
      concept: Complete mediation
      concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
    - chapter: 7
      concept: Action-time preconditions
      concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
    source_anchor: sec-vol3-tool-calling-boundary-checks
    learning_claim: Every proposed call, reads included, passes a deterministic host reference monitor that
      validates, authorizes, dispatches with outcome tracking, and shapes the observation. A schema settles
      only structure, so any precondition that depends on current state (an expected version, a canonical
      path) must be enforced atomically with the effect at the endpoint.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare schema-only admission, host precheck, and endpoint-atomic version check; move the concurrent
      edit before or after the check.
    student_action: Compare schema-only admission with complete mediation on the same stale-write, denied-read,
      and valid-call records.
    evidence_to_inspect: Ordered read/check/write trace, final file hash and revision, rejection diagnostic,
      and whether a later edit was overwritten.
    explanation_prompt: Remove the concurrent edit, then introduce a path outside the workspace. Does the
      same policy still earn its benefit or need another boundary?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair agent read src/pool.py at r17. Another edit lands before its replacement reaches the
        tool.
      briefing: A schema checks field structure. The supplied event trace includes caller grant, canonical
        path, observed revision, endpoint revision, and the proposed replacement.
      fixed: Same replacement bytes, initial revision, task grant, and permitted path; change only check placement
        or event ordering in separate trials.
      feedback_rule: Tie the verdict to the exact write event; explain whether the observed check protected
        the final mutation. A schema-valid payload alone supplies no concurrency evidence.
      next: A valid tool call may still have an uncertain outcome when its reply disappears.
    policy_options: []
  - id: v3_07_B
    title: A reply disappears
    source_concepts:
    - chapter: 7
      concept: Settlement before retry
      concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
    - chapter: 7
      concept: Operation identity
      concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
    source_anchor: sec-vol3-tool-calling-operation-ids
    learning_claim: A timeout records that the caller stopped waiting, not that the effect failed, so a dispatched
      mutation without a reply is an uncertain outcome that blocks retry until its repeat semantics or evidence
      settle it. A logical operation ID names one intended effect across attempts, each attempt gets a fresh
      attempt ID, and the ID is safe only under an endpoint contract that binds it to caller, scope, and arguments.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare a fresh operation ID, another attempt under the same logical ID, and a reconciliation
      probe; select endpoint deduplication contract separately.
    student_action: Compare holding, an authorized reconciliation probe, and another event-producing request
      after the same lost reply.
    evidence_to_inspect: Endpoint effect ledger, attempt IDs, logical ID, evidence-known-at-time view, duplicate
      effects, and unresolved status.
    explanation_prompt: Change from a set-desired-state endpoint to a produce-another-event endpoint, then
      delay the first attempt beyond the retry. Reconsider the choice.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The test request leaves the worker, but the connection closes before acknowledgment. A teammate
        proposes pressing retry.
      briefing: Separate one intended operation from its attempts. The endpoint fixture declares its repeat
        behavior and whether deduplication binds identity to caller, scope, and arguments.
      fixed: Same task, intended test, workspace version, dispatch trace, and lost-reply event.
      feedback_rule: Show actual effects and what the runtime could know at each point separately; a timeout
        never becomes a proven failure. Same-ID safety is conditional on the declared endpoint contract.
      next: Even a settled call needs a trustworthy and bounded observation.
    policy_options: []
  - id: v3_07_C
    title: The test log is not the job
    source_concepts:
    - chapter: 7
      concept: Bounded observation
      concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
    - chapter: 7
      concept: Acknowledgment is not completion
      concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
    source_anchor: sec-vol3-tool-calling-async-escrow
    learning_claim: Capture and staging are separate budgets, so the adapter drains both pipes, enforces byte
      limits, and stages a head-and-tail view with a typed notice of what was omitted and a handle to the
      rest. A long-running tool returns a job handle whose acknowledgment means only that work was queued,
      so status keeps last-observed-running distinct from unavailable and from failure, and detection belongs
      to the runtime.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Choose head-only versus head-and-tail staging at matched budget, then inspect the job under
      a completed, running, or unavailable status trace.
    student_action: Compare visible-output completion with terminal-evidence and omission checks on the same
      job records.
    evidence_to_inspect: Captured versus staged bytes, omission notice, inspection handle, exit/status records,
      and missing status evidence.
    explanation_prompt: Move the decisive error into the middle of the log or make the job finish after the
      last successful status read. What further inspection is justified?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The integration test returns a job handle immediately and later produces a log larger than the
        next model request can hold.
      briefing: Capture limits bound receiving resources; staging limits bound model input. A job acknowledgment,
        last-observed-running state, unavailable status probe, and completed report are separate records.
      fixed: Same generated log, total capture allowance, job identity, and execution trace; do not equate
        staging edits with changed execution.
      feedback_rule: Feedback names omitted diagnostics and job-state evidence; missing status remains unavailable
        rather than failed. Truncation must remain visible even when staged text sounds successful.
      next: The team can now price how much of the toolkit it needs to stage each turn.
    policy_options: []
  - id: v3_07_D
    title: The catalog the model actually sees
    source_concepts:
    - chapter: 7
      concept: Discovery is not authority
      concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
    - chapter: 7
      concept: Toolkit staging
      concept_map: books/vol3/07_tool_calling/tool_calling_concepts.yml
    source_anchor: sec-vol3-tool-calling-tool-staging
    learning_claim: 'A shared tool protocol cuts integration to N_host + N_tool adapters, but listed tools
      supply only interface syntax: descriptions are untrusted input and admitted schemas must be bound to
      the server instance. Which descriptors the model sees each turn and how much work each tool does are
      design variables priced in context tokens and in cost per accepted task.'
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Choose static or on-demand descriptors, then select a coarse or fine operation bundle against
      the same supplied repair trace.
    student_action: Compare trusting discovered descriptors with server-bound, task-granted admission on the
      same catalog requests.
    evidence_to_inspect: Descriptor tokens, discovery round trips, rejected unknown or unauthorized calls,
      and task outcome only where recorded.
    explanation_prompt: Add a task that needs a rarely staged operation or swap the advertised server instance.
      State when the earlier toolkit preference reverses.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A new tool server advertises a convenient repair operation, and the growing descriptor catalog
        competes with repository evidence for context.
      briefing: Discovery supplies interface metadata. The task grant and bound server instance determine
        permission. Descriptor tokens and tool granularity are recorded per candidate toolkit.
      fixed: Same task, allowed capabilities, server identity, context ceiling, and accepted-task criteria;
        descriptor measurements come from supplied assets.
      feedback_rule: Explain measured overhead and missing task evidence independently. A listed but unauthorized
        tool stays blocked; a leaner catalog has no invented success-rate improvement.
      next: Tool admission is coherent; next bound what the code can reach after admission.
    policy_options: []
  primary_concept_dispositions:
  - concept: Complete mediation
    part: A
    disposition: bounded supplied-case investigation; Check placement and concurrent-edit order are fixed
      in these supplied records; there is no selectable host-precheck branch.
  - concept: Action-time preconditions
    part: A
    disposition: bounded supplied-case investigation; Check placement and concurrent-edit order are fixed
      in these supplied records; there is no selectable host-precheck branch.
  - concept: Discovery is not authority
    part: D
    disposition: bounded supplied-case investigation; Toolkit staging is addressed as an admission boundary
      only; static/on-demand token costs, tool granularity, and repair success are not measured.
  - concept: Settlement before retry
    part: B
    disposition: bounded supplied-case investigation; The endpoint is a fixed produce-another-event service
      with a committed original effect and an available bound probe. Deduplication contracts and attempt identities
      are discussed, not selectable.
  - concept: Operation identity
    part: B
    disposition: bounded supplied-case investigation; The endpoint is a fixed produce-another-event service
      with a committed original effect and an available bound probe. Deduplication contracts and attempt identities
      are discussed, not selectable.
  - concept: Bounded observation
    part: C
    disposition: bounded supplied-case investigation; The instrument checks supplied omission and terminal-status
      evidence; it does not vary capture bytes, staging layout, or job schedules.
  - concept: Acknowledgment is not completion
    part: C
    disposition: bounded supplied-case investigation; The instrument checks supplied omission and terminal-status
      evidence; it does not vary capture bytes, staging layout, or job schedules.
  - concept: Toolkit staging
    part: D
    disposition: bounded supplied-case investigation; Toolkit staging is addressed as an admission boundary
      only; static/on-demand token costs, tool granularity, and repair success are not measured.
  model_support:
    existing:
    - MLSysIM Agents registry supplies workload context, not endpoint correctness. Chapter quantitative cells
      currently use MLSysIM unit/format utilities rather than a tool-dispatch simulator.
    required:
    - Versioned deterministic endpoint fixtures in MLSysIM for revision races, logical-operation/attempt identity,
      delayed effect/reply events, bounded output records, and job states.
    - Until fixtures exist, use explicitly supplied immutable chapter traces with no fabricated rates or claim
      that MLSysIM simulates RPC semantics.
