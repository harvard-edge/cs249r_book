lab_concept_map:
  schema_version: 1
  lab_id: v3_05
  chapter: 5
  title: KV Cache Management
  source_notebook: labs/vol3/lab_05_kv_cache.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded reference investigations; not live-agent validation
  source_chapter_concept_map: books/vol3/05_kv_cache/kv_cache_concepts.yml
  source_chapter: books/vol3/05_kv_cache/05_kv_cache.qmd
  chapter_goal: Choose exact state allocation and waiting policies under a real pool bound, then evaluate
    any semantic approximation separately.
  student_goals:
  - Compare exact allocation policies and identify the binding resident-fit limit.
  - Trace block ownership and calculate what can actually be reused after divergence or eviction.
  - Reject stale evidence despite a valid cache match and require workload-specific evidence before choosing
    a lossy method.
  - Choose keep, move or drop for a supplied wait and defend its capacity/return-latency tradeoff.
  narrative:
    situation: The repair pauses while integration tests run. Its selected context occupies serving memory
      even when it generates no tokens.
    previously: The supplied agent has a selected working context and pauses while a tool runs.
    next: 'Next: distinguish reconstructible serving state from persistent source-linked memory.'
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Fit growing state
    question: Will the next turn fit the cache pool?
    goal: Compare exact allocation policies and identify the binding resident-fit limit.
    concept_ids:
    - v3_05_A
    coverage: Actually computes rounded blocks, unused slots, KV bytes, and cache-only fit. Does not predict
      a complete serving-node fit or throughput.
    limitation: Footprint accounting is supported; it cannot predict semantic quality or actual throughput
      by itself. Mean residence identity is not a peak guarantee; shared blocks count once and only unique
      unpinned blocks are reclaimable.
    next: Some repair candidates now share most of their initialized prefix.
  - part: B
    title: Count shared work once
    question: Which tokens can safely share state?
    goal: Trace block ownership and calculate what can actually be reused after divergence or eviction.
    concept_ids:
    - v3_05_B
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      Footprint accounting is supported; it cannot predict semantic quality or actual throughput by itself.
      Mean residence identity is not a peak guarantee; shared blocks count once and only unique unpinned
      blocks are reclaimable.
    next: A cache match still does not establish that its evidence is current.
  - part: C
    title: Keep exact reuse distinct from approximation
    question: Is this reuse exact or approximate?
    goal: Reject stale evidence despite a valid cache match and require workload-specific evidence before
      choosing a lossy method.
    concept_ids:
    - v3_05_C
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      Footprint accounting is supported; it cannot predict semantic quality or actual throughput by itself.
      Mean residence identity is not a peak guarantee; shared blocks count once and only unique unpinned
      blocks are reclaimable.
    next: Choose what exact state to keep while the test runner is waiting.
  - part: D
    title: Price the test wait
    question: What should remain resident while a tool runs?
    goal: Compare exact retain and evict policies using residency, byte-seconds, and resume prefill work.
    concept_ids:
    - v3_05_D
    coverage: Actually computes KV residency and exact-prefix recomputation work. Does not model a full
      serving scheduler or latency.
    limitation: Footprint accounting is supported; it cannot predict semantic quality or actual throughput
      by itself. Mean residence identity is not a peak guarantee; shared blocks count once and only unique
      unpinned blocks are reclaimable.
    next: Next lab stores observations and lessons across sessions; these are not interchangeable with
      KV state.
  core_concepts:
  - id: v3_05_A
    title: Fit growing state
    source_concepts:
    - chapter: 5
      concept: KV footprint and resident fit
      concept_map: books/vol3/05_kv_cache/kv_cache_concepts.yml
    - chapter: 5
      concept: Paged KV allocation
      concept_map: books/vol3/05_kv_cache/kv_cache_concepts.yml
    source_anchor: sec-vol3-kvcache-pagedattention
    learning_claim: Retained attention state costs 2 x layers x KV heads x head dim x bytes per token,
      so resident fit in the KV pool falls as 1/S with context length, and the attention design fixed
      at pretraining sets the slope. Fixed-size blocks mapped by a per-sequence block table remove the
      stranded memory of full-cap reservation and bound tail waste below one block.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Vary context length at fixed model, then compare full-cap reservation with paged allocation
      and supplied block sizes.
    student_action: Vary context length at fixed model, then compare full-cap reservation with paged allocation
      and supplied block sizes.
    evidence_to_inspect: Per-token footprint, logical used tokens, allocated blocks, tail waste, reserved
      output growth and resident-fit bound.
    explanation_prompt: Use very short sequences or a large block size and identify when tail waste dominates
      the expected saving.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The next test log extends the context; a full-cap reservation leaves much of the KV pool
        idle.
      briefing: Read model attention geometry, element size, runtime reserve, output headroom and block
        rounding.
      fixed: Same model/precision, physical pool, runtime reserve and sequence-length fixture; separate
        model changes from allocation changes.
      feedback_rule: Compute footprint through package helpers; paged allocation changes unused capacity,
        not per-token payload or model quality. Refuse admission when the declared pool cannot cover required
        reservations.
      next: Some repair candidates now share most of their initialized prefix.
    policy_options:
    - id: policy_1
      label: Reserve full context cap
    - id: policy_2
      label: Small paged blocks
    - id: policy_3
      label: Large paged blocks
  - id: v3_05_B
    title: Count shared work once
    source_concepts:
    - chapter: 5
      concept: Copy-on-write block sharing
      concept_map: books/vol3/05_kv_cache/kv_cache_concepts.yml
    - chapter: 5
      concept: Radix prefix cache
      concept_map: books/vol3/05_kv_cache/kv_cache_concepts.yml
    source_anchor: sec-vol3-kvcache-radix-tree
    learning_claim: Forked candidates share prefix blocks by reference count, so a fork costs block-table
      entries rather than a payload copy and physical demand is the count of unique blocks. A content-keyed
      radix tree finds the longest retained common prefix, leaf-first eviction keeps residency prefix-closed,
      and efficacy is the token-weighted hit rate after availability, permission, and block rounding.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Fork supplied continuations and alter one suffix; separately replay independent arrivals
      under a prefix retention policy.
    student_action: Fork supplied continuations and alter one suffix; separately replay independent arrivals
      under a prefix retention policy.
    evidence_to_inspect: Logical vs unique physical block map, reference counts, longest retained common
      prefix, rounded usable hits and evictions.
    explanation_prompt: Evict a shared prefix leaf or change an early token and show why the apparent
      reuse disappears.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: Several candidate continuations share the same source context; later turns independently
        submit that prefix again.
      briefing: Distinguish known forks from content-keyed independent-request lookup. Exact prefixes,
        block alignment and reference counts govern physical sharing.
      fixed: Model/configuration, token sequence fixture, block size, pool and permission scope.
      feedback_rule: Charge unique blocks once; a divergent write allocates private state. Prefix matches
        require compatibility, availability and permission; report token-weighted hits rather than request
        count alone.
      next: A cache match still does not establish that its evidence is current.
    policy_options:
    - id: policy_1
      label: Private copy per candidate
    - id: policy_2
      label: Copy-on-write forks only
    - id: policy_3
      label: Copy-on-write plus exact prefix cache
  - id: v3_05_C
    title: Keep exact reuse distinct from approximation
    source_concepts:
    - chapter: 5
      concept: Reusable is not applicable
      concept_map: books/vol3/05_kv_cache/kv_cache_concepts.yml
    - chapter: 5
      concept: Lossy KV approximation
      concept_map: books/vol3/05_kv_cache/kv_cache_concepts.yml
    source_anchor: sec-vol3-kv-cache-prefix-compatibility
    learning_claim: A reusable prefix must be compatible, available, and permitted, and none of the three
      says whether the evidence is current, so freshness is enforced by the harness rewriting the prompt.
      Token eviction, sliding windows, and KV quantization change the computation and must be validated
      against an agent's hard semantic dependencies, such as dormant constraints and exact identifiers,
      rather than perplexity.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: First change current source revision with identical cached tokens; then compare supplied
      exact and lossy state-policy trials on dormant constraints and exact identifiers.
    student_action: First change current source revision with identical cached tokens; then compare supplied
      exact and lossy state-policy trials on dormant constraints and exact identifiers.
    evidence_to_inspect: Reuse contract, current-source scope, prompt refresh disposition, memory reduction
      and actual hard-dependency outcomes.
    explanation_prompt: Test a dormant no-deploy constraint or rare exact identifier that matters late
      in the repair.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A cached prompt still describes the old source revision. Another proposal evicts old tokens
        to make more sessions fit.
      briefing: Read reuse eligibility separately from evidence currency. Exact reclamation preserves
        computation; token eviction and precision approximation may change it.
      fixed: Fixed reference prefix for the freshness test; fixed task/model/acceptance fixtures for the
        approximation comparison.
      feedback_rule: A reusable prefix can remain semantically obsolete; prompt assembly must change it.
        Show unknown semantic quality if no matched fixture exists, never estimate correctness from bytes
        saved or perplexity.
      next: Choose what exact state to keep while the test runner is waiting.
    policy_options:
    - id: policy_1
      label: Exact prefix with source refresh
    - id: policy_2
      label: Exact reusable prefix without freshness refresh
    - id: policy_3
      label: Lossy state approximation with dependency evaluation
  - id: v3_05_D
    title: Price the test wait
    source_concepts:
    - chapter: 5
      concept: Paused-state policy
      concept_map: books/vol3/05_kv_cache/kv_cache_concepts.yml
    - chapter: 5
      concept: Residency tax
      concept_map: books/vol3/05_kv_cache/kv_cache_concepts.yml
    source_anchor: sec-vol3-kvcache-swapping
    learning_claim: During a tool wait the engine keeps, moves, or drops only uniquely reclaimable blocks,
      and offloading pays only when the wait exceeds the transfer round trip and memory is contested.
      By Little's law a fixed pool of slots sustains a turn rate inversely proportional to residence,
      so holding state through a synchronous tool wait divides the memory-bound turn rate by 1 + T_tool/T_model.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Sweep supplied tool-wait duration or contention independently and compare keep/move/drop
      exact policies.
    student_action: Sweep supplied tool-wait duration or contention independently and compare keep/move/drop
      exact policies.
    evidence_to_inspect: Unique bytes reclaimed, transfer round trip, reload/recompute delay, competing
      request admission and residence-based mean capacity estimate.
    explanation_prompt: Shorten the wait, remove memory contention or raise shared-prefix fraction until
      offload no longer helps.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The integration test is running, while another request needs the same serving pool.
      briefing: Inspect unique reclaimable blocks, expected wait/return, transfer and recompute costs.
        Residence includes idle holding time.
      fixed: Same initialized state, shared-block refs, transfer path, recompute configuration and returning
        request contract.
      feedback_rule: Offload frees only uniquely reclaimable unpinned state. A short wait or uncongested
        pool can favor keep; mean occupancy cannot certify tail capacity. Include transfer contention
        and return uncertainty when supplied.
      next: Next lab stores observations and lessons across sessions; these are not interchangeable with
        KV state.
    policy_options:
    - id: policy_1
      label: Keep on device
    - id: policy_2
      label: Move uniquely reclaimable state
    - id: policy_3
      label: Drop unique state and recompute
