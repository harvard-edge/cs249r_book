  model_support:
    existing:
    - mlsysim.physics.agents.calc_kv_cache_bytes_per_token
    - mlsysim.physics.memory.calc_expected_paged_kv_tokens
    - Models.Language, Hardware and Systems registries; Agents.Coding.SWE_Bench_Runner
    missing:
    - Shared exact block-table/refcount/prefix compatibility and eviction fixture engine
    - Canonical keep/move/drop break-even and residency accounting helpers; chapter has local LEGO formulas
    - Semantic dependency test records for lossy KV methods
    boundary: Footprint accounting is supported; it cannot predict semantic quality or actual throughput
      by itself. Mean residence identity is not a peak guarantee; shared blocks count once and only unique
      unpinned blocks are reclaimable.
