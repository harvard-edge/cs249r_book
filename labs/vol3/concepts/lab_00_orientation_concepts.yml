lab_concept_map:
  schema_version: 1
  lab_id: v3_00
  chapter: 0
  title: Choose an agent project
  source_notebook: labs/vol3/lab_00_orientation.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: orientation design; not deployment validation
  source_chapter_concept_map: null
  chapter_goal: Choose an agent project and practice using comparisons to explain a systems decision.
  student_goals:
  - Select the repair, research, remediation, or support project and identify its
    task boundary.
  - Use a prediction, controlled comparison, and saved evidence without treating completion
    as mastery.
  - Explain the full-volume route and the evidence carried between episodes.
  narrative:
    situation: |
      A software team wants an agent that can repair a bug, test its patch, and show that the repair actually works.
      Across this volume, you will follow that agent through model choices, memory, tools, recovery,
      evaluation, and the cost of delivering accepted work.

      Choose a project below. The repair agent provides the shared experiments;
      the research, operations, and support projects ask how those decisions would change in another setting.
      Each lab adds a chapter's challenge to the same story. Its parts follow a familiar rhythm: predict,
      change a policy, inspect the consequence, and explain the tradeoff. Finish by downloading your discussion
      and evidence. This lab lets you practice before chapter 1.
    previously: Start here. No previous Volume I or II lab is required.
    next: Define the task contract and inspect a complete trajectory.
    submission: One practice discussion that distinguishes a prediction, a supplied
      trace, a chosen policy, and an unresolved target requirement.
  runtime_parts:
  - part: A
    title: Choose your project
    question: Which task and boundary will your agent serve?
    goal: Identify the canonical workload and its allowed scope.
    concept_ids: []
    coverage: Interface rehearsal; owns no textbook concept.
    limitation: A selected profile is not observed production evidence.
    next: Read the route and identify the decision due today.
  - part: B
    title: Learn the investigation cycle
    question: What changes when a policy changes?
    goal: Distinguish live evidence from a saved comparison.
    concept_ids: []
    coverage: Interface rehearsal.
    limitation: A practice capture establishes no engineering claim.
    next: Prepare a concise discussion.
  - part: C
    title: Record a reasoned decision
    question: What can the supplied comparison support?
    goal: Record a choice, uncertainty, and reversal condition.
    concept_ids: []
    coverage: Interface rehearsal.
    limitation: Text presence is not a measure of understanding.
    next: Carry the project identity into the introduction.
  - part: D
    title: See the full route
    question: How does one trajectory project connect the volume?
    goal: Describe the route from a model call through runtime evidence to learning
      and accepted-task economics.
    concept_ids: []
    coverage: Orientation preview only; later mechanisms are not prerequisites.
    limitation: The route previews future questions without teaching their answers.
    next: Begin the introduction.
  core_concepts: []
  primary_concept_dispositions: []
