lab_concept_map:
  schema_version: 1
  lab_id: v3_01
  chapter: 1
  title: Introduction
  source_notebook: labs/vol3/lab_01_introduction.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded reference investigations; not live-agent validation
  source_chapter_concept_map: books/vol3/01_introduction/introduction_concepts.yml
  source_chapter: books/vol3/01_introduction/01_introduction.qmd
  chapter_goal: Define the repair contract and defend how much autonomy its evidence can support.
  student_goals:
  - Trace responsibility through a complete turn and identify where a proposed action becomes an executed
    effect.
  - Construct a task contract and use its clauses to justify admission and acceptance decisions.
  - Classify exposure from consequences and justify a closure package against the task contract.
  - Compare alternatives on full-task reliability and cost per accepted task while stating the model assumptions.
  narrative:
    situation: The team delegates an intermittent connection-pool race repair. A convincing patch has
      arrived, but no task has yet been accepted.
    previously: Begin with the supplied connection-pool repair request. No previous volume is required.
    next: 'Next: inspect the model-call interface that supplies proposals to this loop.'
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: From proposal to a governed turn
    question: Who may turn a proposal into an effect?
    goal: Trace responsibility through a complete turn and identify where a proposed action becomes an
      executed effect.
    concept_ids:
    - v3_01_A
    coverage: The supplied trace exposes all six turn phases and contrasts unsupported closure with a
      scoped host-owned check; it does not execute a live model or tool.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      Use auditable recorded fixtures for runtime choices; analytical independent-error curves must expose
      independence and constant-error assumptions, not claim real repair reliability.
    next: Now define the task boundary across multiple turns.
  - part: B
    title: Scope the delegated repair
    question: What makes this repair request enforceable?
    goal: Construct a task contract and use its clauses to justify admission and acceptance decisions.
    concept_ids:
    - v3_01_B
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      Use auditable recorded fixtures for runtime choices; analytical independent-error curves must expose
      independence and constant-error assumptions, not claim real repair reliability.
    next: The contract now permits us to classify its exposures.
  - part: C
    title: Match closure to exposure
    question: What evidence does this exposure require?
    goal: Classify exposure from consequences and justify a closure package against the task contract.
    concept_ids:
    - v3_01_C
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      Use auditable recorded fixtures for runtime choices; analytical independent-error curves must expose
      independence and constant-error assumptions, not claim real repair reliability.
    next: Finally price how unchecked turns and checks affect the full task.
  - part: D
    title: Spend on accepted repairs
    question: What did each accepted repair actually cost?
    goal: Trace how a check-and-restore boundary changes dependent work and whole-attempt accounting in
      the supplied case.
    concept_ids:
    - v3_01_D
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      Use auditable recorded fixtures for runtime choices; analytical independent-error curves must expose
      independence and constant-error assumptions, not claim real repair reliability.
    next: Carry the contract, exposure card and priced policy into The Foundation Model.
  core_concepts:
  - id: v3_01_A
    title: From proposal to a governed turn
    source_concepts:
    - chapter: 1
      concept: Agency is a property of the closed loop
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
    - chapter: 1
      concept: Six-phase turn lifecycle
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
    source_anchor: sec-vol3-intro-execution-lifecycle
    learning_claim: A system is agentic when a runtime, not a human, closes the proposal-action-observation
      loop, so the model's output is a proposal with no standing authority and enforcement, isolation,
      persistence, and completion checks belong to the runtime. Every turn passes context assembly, model
      invocation, validate-and-authorize, tool execution, observation, and assessment against the contract,
      and only the second phase belongs to the model.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Route the same proposal through human dispatch, an unchecked automatic loop, or runtime
      validation/execution/observation.
    student_action: Route the same proposal through human dispatch, an unchecked automatic loop, or runtime
      validation/execution/observation.
    evidence_to_inspect: Phase-by-phase record showing controller, requested effect, actual disposition
      and resulting observation.
    explanation_prompt: Move authorization after execution and explain which effect has already occurred
      before the check.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The proposed patch is waiting. The team must decide which component may turn it into an effect.
      briefing: Read the six-phase strip and distinguish proposed actions from host observations. No sandbox
        implementation is required.
      fixed: Same patch proposal, workspace fixture and targeted test.
      feedback_rule: Derive the trace from the chosen route; show blocked effects as blocked and distinguish
        human closure from runtime closure. A syntactically valid proposal is never an observation.
      next: Now define the task boundary across multiple turns.
    policy_options:
    - id: policy_1
      label: Human dispatch after each proposal
    - id: policy_2
      label: Unchecked automatic dispatch
    - id: policy_3
      label: Runtime validate,execute,observe
  - id: v3_01_B
    title: Scope the delegated repair
    source_concepts:
    - chapter: 1
      concept: Trajectory as the unit of engineering
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
    - chapter: 1
      concept: Task contract
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
    source_anchor: sec-vol3-intro-five-part-contract
    learning_claim: The ordered record of states, proposals, runtime decisions, and observations from
      initial context to acceptance, termination, or escalation is the accounting boundary for cost, latency,
      state lifetime, quotas, and permissions, so resources are managed per task rather than per call.
      A goal with negative scope, an environment, permitted actions, available observations, and completion
      criteria turn intent into something the runtime can enforce, and each omitted field produces a specific,
      predictable failure.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose an explicit contract clause to add or narrow, then replay the proposed edit and completion
      claim.
    student_action: Choose an explicit contract clause to add or narrow, then replay the proposed edit
      and completion claim.
    evidence_to_inspect: Clause-to-decision trace and accumulated task costs/status across turns, including
      rejected proposals.
    explanation_prompt: Try a valid workspace edit whose output violates the public API requirement; distinguish
      allowed execution from accepted completion.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The patch touches both the pool and a public interface. The initial request said only to
        repair the race.
      briefing: Inspect goal and negative scope, environment, permitted actions, available observations
        and completion criteria, plus the full trajectory ledger.
      fixed: Same proposal and observed test record; vary only the selected contract clause.
      feedback_rule: Report the exact clause that changes admission or acceptance; absent clauses leave
        named ambiguity rather than automatically authorizing an action. Charge all recorded task work.
      next: The contract now permits us to classify its exposures.
    policy_options:
    - id: policy_1
      label: Bare repair goal
    - id: policy_2
      label: Scoped edit contract
    - id: policy_3
      label: Scoped edit plus completion criteria
  - id: v3_01_C
    title: Match closure to exposure
    source_concepts:
    - chapter: 1
      concept: H·S·A exposures
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
    - chapter: 1
      concept: Invariant closure
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
    source_anchor: sec-vol3-intro-invariant-closure
    learning_claim: 'A task''s coordinate is its horizon H in turns, carried state S0 to S3, and authority
      A0 to A3, each level set by operational consequence rather than command syntax, and the coordinate
      names the exposure that closure must answer. Constraints never rest on the model: bounds close mechanically
      below it and acceptance rests on external evidence above it, and greater exposure demands stronger
      closure.'
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Change disposable vs shared environment, then select mechanical bounds and a scoped completion
      check.
    student_action: Change disposable vs shared environment, then select mechanical bounds and a scoped
      completion check.
    evidence_to_inspect: Exposure card, actual permitted/blocked effects, check scope and uncovered obligations.
    explanation_prompt: Transfer the command to the remediation lighthouse where rollback is irreversible;
      explain why command syntax cannot determine authority class.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A teammate suggests using the same repair loop against the shared production checkout.
      briefing: Compare disposable workspace and shared-state consequences. Read the horizon, carried-state
        and authority labels and the available mechanical bounds and external checks.
      fixed: Same command text and repair goal; environment consequence is the independent change.
      feedback_rule: Show which exposure changed and whether the selected bound actually prevents the
        forbidden effect. A passing targeted check certifies only its covered property.
      next: Finally price how unchecked turns and checks affect the full task.
    policy_options:
    - id: policy_1
      label: Disposable workspace with targeted test
    - id: policy_2
      label: Shared checkout with same test
    - id: policy_3
      label: Shared checkout with explicit bound and broader check
  - id: v3_01_D
    title: Spend on accepted repairs
    source_concepts:
    - chapter: 1
      concept: Horizon compounding
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
    - chapter: 1
      concept: Cost per accepted task
      concept_map: books/vol3/01_introduction/introduction_concepts.yml
    source_anchor: sec-vol3-intro-horizon-arithmetic
    learning_claim: With independent unchecked steps Pr(success) = (1-eps)^H, so the product eps*H rather
      than step accuracy sets reliability, and a check plus restoration that shortens the unchecked segment
      is the cheaper lever. Under retry-until-accept, C_eff = E[C_attempt]/p_acc, so acceptance divides
      the whole attempt cost and any mechanism pays for its overhead only if it lowers this ratio.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Compare improved per-step accuracy with a shorter unchecked segment; separately vary check
      cost under fixed acceptance assumptions.
    student_action: Compare improved per-step accuracy with a shorter unchecked segment; separately vary
      check cost under fixed acceptance assumptions.
    evidence_to_inspect: Analytic reliability curve with assumptions, attempt-cost components, acceptance
      denominator and accepted-task cost; unresolved cases remain visible.
    explanation_prompt: Increase checking overhead or reduce its restoration effectiveness until the original
      choice loses its advantage.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The runtime is bounded, but the team can buy a more accurate step or add a check-and-restore
        boundary.
      briefing: The analytic reference assumes independent constant-error unchecked steps. Attempt cost
        includes model, tools and checks; accepted probability is a separate input or measured fixture
        result.
      fixed: Same horizon, task contract and attempt accounting boundary within each matched comparison.
      feedback_rule: Compute in MLSysIM once supported. Identify where overhead pays or does not; do not
        infer empirical acceptance from the independent-step formula or count unresolved tasks as accepted.
      next: Carry the contract, exposure card and priced policy into The Foundation Model.
    policy_options:
    - id: policy_1
      label: Spend on per-step model accuracy
    - id: policy_2
      label: Add check-and-restore boundaries
    - id: policy_3
      label: Keep baseline and escalate unresolved tasks
