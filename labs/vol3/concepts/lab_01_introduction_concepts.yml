  - concept: Six-phase turn lifecycle
    part: A
    disposition: bounded mechanism reference; The supplied trace exposes all six turn phases and contrasts
      unsupported closure with a scoped host-owned check; it does not execute a live model or tool.
  model_support:
    existing:
    - Agents.Coding.SWE_Bench_Runner supplies canonical repair workload context
    - Agents.Research.OrchestratorWorker, Agents.Remediation.OnCall and Agents.Support.CustomerOps are
      secondary lighthouse profiles; verify exported registry names before binding.
    missing:
    - Canonical task-contract and turn-disposition fixture engine
    - Canonical horizon/check-restoration and whole-attempt acceptance accounting helpers; chapter currently
      computes these in LEGO cells.
    boundary: Use auditable recorded fixtures for runtime choices; analytical independent-error curves
      must expose independence and constant-error assumptions, not claim real repair reliability.
