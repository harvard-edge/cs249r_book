lab_concept_map:
  schema_version: 1
  lab_id: v3_19
  chapter: 19
  title: Agent Economics
  source_notebook: labs/vol3/lab_19_agent_economics.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded controlled policy references; numerical and transfer limits explicit
  source_chapter_concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
  source_chapter: books/vol3/19_agent_economics/19_agent_economics.qmd
  chapter_goal: Defend an architecture using complete cohort accounting, useful throughput, conserved
    budget liabilities, and accepted outcomes.
  student_goals:
  - Reconcile cohort cost and identify when a compaction decision pays back under unchanged acceptance.
  - Compare an acceleration purchase with routing using reached-stage accounting and the same acceptance
    contract.
  - Explain why lower acceptance raises offered work and preserve budget = settled + reserved + free through
    a canceled child and late charge.
  - Select an architecture by cost per resolved task with declared latency and acceptance constraints,
    including a defensible hold decision.
  narrative:
    situation: The team has a complete repair-system design, and a cheaper model is tempting. Count the
      whole bill, including failed attempts, waiting tools, canceled work, and charges that arrive late.
      Decide which architecture delivers accepted repairs within the team's budget and deadlines.
    previously: The supplied design includes delegated work as well as a single-controller alternative.
    next: The conclusion transfers these decisions to an integrated incident with a lost external acknowledgment.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Reconcile the bill
    question: Which initiated work belongs in the bill?
    goal: Reconcile cohort cost and identify when a compaction decision pays back under unchanged acceptance.
    concept_ids:
    - v3_19_A
    coverage: Cohort cost per accepted task; Prefix-cache pricing and compaction payback
    limitation: Hypothetical full-cohort ledger arithmetic and compaction-induced evidence reacquisition;
      no provider tariff or compaction payback estimate. Fixed authored cases do not predict learned behavior
      or production performance.
    next: Savings matter only if latency and routing changes preserve accepted work.
  - part: B
    title: Price the effective lever
    question: Which intervention changes useful accepted work?
    goal: Compare an acceleration purchase with routing using reached-stage accounting and the same acceptance
      contract.
    concept_ids:
    - v3_19_B
    coverage: Critical-path acceleration ceiling; Cascade and routing pricing
    limitation: Unchanged acceptance checks and reached cascade work, with an off-path acceleration limit.
      Fixed authored cases do not predict learned behavior or production performance.
    next: The service must sustain accepted tasks without hiding queueing or spending liability.
  - part: C
    title: Conserve capacity and money
    question: What liabilities remain reserved?
    goal: Explain why lower acceptance raises offered work and preserve budget = settled + reserved +
      free through a canceled child and late charge.
    concept_ids:
    - v3_19_C
    coverage: Trajectory goodput; Queueing cost of utilization; Budget conservation
    limitation: Cancellation liability conservation with categorical queue occupancy; no queueing-rate
      or goodput estimate. Fixed authored cases do not predict learned behavior or production performance.
    next: Compare complete architectures including the people who finish unresolved tasks.
  - part: D
    title: Choose a resolved-task system
    question: Which architecture resolves the task at an acceptable cost?
    goal: Select an architecture by cost per resolved task with declared latency and acceptance constraints,
      including a defensible hold decision.
    concept_ids:
    - v3_19_D
    coverage: Architecture pricing with human fallback
    limitation: Automation plus human fallback versus direct human on one supplied hard task; no population
      architecture optimum. Fixed authored cases do not predict learned behavior or production performance.
    next: The conclusion transfers these decisions to an integrated incident with a lost external acknowledgment.
  core_concepts:
  - id: v3_19_A
    title: Reconcile the bill
    source_concepts:
    - chapter: 19
      concept: Cohort cost per accepted task
      concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
    - chapter: 19
      concept: Prefix-cache pricing and compaction payback
      concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
    source_anchor: sec-vol3-agent-economics-caching
    learning_claim: Measured cost per accepted task is the sum of every initiated task's account, each
      charge in exactly one category, divided by the distinct tasks accepted under one declared contract.
      Ideal prefix reuse bills the quadratic re-send at the cached rate, which lowers its coefficient
      without removing it, so a compaction pays back only after enough turns to recover its rewrite and
      lost cache.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose keep versus compact at a recorded turn; inspect full cohort accounts including failed
      attempts.
    student_action: Choose keep versus compact at a recorded turn; inspect full cohort accounts including
      failed attempts.
    evidence_to_inspect: Nonoverlapping charge categories, accepted distinct task denominator, cached/uncached
      input charges, rewrite cost, and cumulative break-even.
    explanation_prompt: End the task before payback or invalidate the cached prefix; explain when keeping
      context is cheaper.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: 'The team has a complete repair-system design and must price what it delivers: accepted repairs,
        conserved liabilities, and resolved obligations rather than cheap individual calls.'
      briefing: Every initiated task contributes cost exactly once. Prefix reuse reduces a coefficient,
        while compaction pays rewrite and lost-cache costs before later savings.
      fixed: Prices from canonical registry/workload, task cohort, acceptance contract, completed charges,
        prefix applicability, and future-turn assumptions.
      feedback_rule: Report undefined cost when no tasks are accepted. Cached rates do not erase history
        growth; payback is conditional on future turns and unchanged acceptance.
      next: Savings matter only if latency and routing changes preserve accepted work.
    policy_options:
    - Keep context with applicable prefix reuse
    - Compact and pay rewrite plus cache loss
    - Ignore rejected attempts when computing efficiency
  - id: v3_19_B
    title: Price the effective lever
    source_concepts:
    - chapter: 19
      concept: Critical-path acceleration ceiling
      concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
    - chapter: 19
      concept: Cascade and routing pricing
      concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
    source_anchor: sec-vol3-agent-economics-cascades
    learning_claim: A speedup g applied to a fraction f of the measured critical path gives T' = T[(1-f)
      + f/g] and a ceiling of 1/(1-f), which a baseline profile reveals before anything is bought. A cascade's
      cost and acceptance are reach-weighted sums, so savings come from the early-exit rate, every reached
      gate charges whether or not its candidate passes, and fail-through harm is priced in.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Vary one measured critical-path segment or a declared early-exit routing policy; inspect
      gate error harm separately.
    student_action: Vary one measured critical-path segment or a declared early-exit routing policy; inspect
      gate error harm separately.
    evidence_to_inspect: Critical-path fraction, conditional time reduction, reached-tier counts, accepted
      outcomes, and gate false-accept costs.
    explanation_prompt: Make the accelerated span noncritical or reduce early-exit acceptance; find the
      preference reversal.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: 'The team has a complete repair-system design and must price what it delivers: accepted repairs,
        conserved liabilities, and resolved obligations rather than cheap individual calls.'
      briefing: Only accelerated work on the critical path reduces completion time. Every reached cascade
        tier and assessment incurs cost, even when its candidate fails.
      fixed: Same task mix, gate audit, baseline span graph, tier prices, acceptance requirements, and
        fallback accounting.
      feedback_rule: Use observed counts or labeled planning assumptions. A cheap early tier saves only
        on genuine early exits; a lower bill caused by failing through the gate is not efficiency.
      next: The service must sustain accepted tasks without hiding queueing or spending liability.
    policy_options:
    - Accelerate measured critical-path work
    - Accelerate noncritical work
    - Route through assessed early-exit cascade
  - id: v3_19_C
    title: Conserve capacity and money
    source_concepts:
    - chapter: 19
      concept: Trajectory goodput
      concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
    - chapter: 19
      concept: Queueing cost of utilization
      concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
    - chapter: 19
      concept: Budget conservation
      concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
    source_anchor: sec-vol3-agent-economics-governance
    learning_claim: Accepted tasks per unit time is the platform's deliverable, so sustaining goodput
      G at acceptance alpha requires admitting G/alpha trajectories and any change that lowers acceptance
      raises offered load. Near saturation queueing wait grows like rho/(1-rho), so a modest throughput
      gain from higher utilization costs a multiple in wait that compounds across every serial step of
      a trajectory. Every budget account in the tree keeps budget = settled + reserved + free under atomic,
      logged transitions, so a delegation tree conserves spending and a stopped child keeps its reservation
      until its late bills settle.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose an admission/load policy in a stated queue model; step through reserve, dispatch,
      cancel, settle, and release events.
    student_action: Choose an admission/load policy in a stated queue model; step through reserve, dispatch,
      cancel, settle, and release events.
    evidence_to_inspect: Accepted work rate, admitted attempts, queue stability/wait, and an exact event-by-event
      ledger with outstanding liabilities.
    explanation_prompt: Lower acceptance at fixed promised goodput or inject a late bill after cancellation.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: 'The team has a complete repair-system design and must price what it delivers: accepted repairs,
        conserved liabilities, and resolved obligations rather than cheap individual calls.'
      briefing: Accepted tasks per unit time depends on attempt acceptance. Near-saturated resources add
        wait, while cancellation stops admission without settling remote bills.
      fixed: Acceptance contract, service distribution assumptions, resource scope, charge ceiling, and
        root budget.
      feedback_rule: Do not apply the cluster M/D/1 model as a general agent queue. Show instability when
        arrival exceeds service and forbid freeing a reservation before liability settles.
      next: Compare complete architectures including the people who finish unresolved tasks.
    policy_options:
    - Target high utilization and release canceled reservations immediately
    - Bound admission and retain unresolved liability
    - Promise fixed goodput without accounting for acceptance
  - id: v3_19_D
    title: Choose a resolved-task system
    source_concepts:
    - chapter: 19
      concept: Architecture pricing with human fallback
      concept_map: books/vol3/19_agent_economics/agent_economics_concepts.yml
    source_anchor: sec-vol3-agent-economics-selection
    learning_claim: Deterministic code, a fixed workflow, a bounded loop, and delegation are compared
      under one acceptance contract by cost per resolved task including human fallback, not by automated
      cost per automated acceptance.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Compare supplied matched architecture cohorts with common fallback; choose one and identify
      its payback and reversal assumptions.
    student_action: Compare supplied matched architecture cohorts with common fallback; choose one and
      identify its payback and reversal assumptions.
    evidence_to_inspect: Automated versus human-resolved counts, fallback costs, total resolved-task denominator,
      latency constraints, and uncertainty.
    explanation_prompt: Raise human fallback cost or reduce task volume before adaptation pays back; reassess.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: 'The team has a complete repair-system design and must price what it delivers: accepted repairs,
        conserved liabilities, and resolved obligations rather than cheap individual calls.'
      briefing: Deterministic code, fixed workflow, bounded loop, and delegation are alternatives under
        one contract. Human completion belongs in the system bill.
      fixed: Task population, contract, fallback quality/cost, authority, deadline, and all initiated
        task accounting.
      feedback_rule: Distinguish cost per automated acceptance from cost per resolved task. No price-only
        winner when acceptance/latency requirements fail or evidence is missing.
      next: The conclusion transfers these decisions to an integrated incident with a lost external acknowledgment.
    policy_options:
    - Deterministic or fixed workflow with fallback
    - Bounded loop with fallback
    - Delegated architecture with fallback
