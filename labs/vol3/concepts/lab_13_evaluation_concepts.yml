lab_concept_map:
  schema_version: 1
  lab_id: v3_13
  chapter: 13
  title: Agent Evaluation
  source_notebook: labs/vol3/lab_13_evaluation.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded policy investigations; broader mechanisms explicitly scoped
  source_chapter_concept_map: books/vol3/13_evaluation/evaluation_concepts.yml
  source_chapter: books/vol3/13_evaluation/13_evaluation.qmd
  chapter_goal: Defend what a matched evaluation establishes about task success, repeated reliability, and
    grader error.
  student_goals:
  - Assign a supported verdict to a candidate and name the evidence still needed for acceptance.
  - Identify contamination or grader-reach violations and design a comparable evidence boundary.
  - Interpret grader errors with the correct denominator and choose a decision threshold using declared costs
    and coverage.
  - Assess a candidate comparison using task-aware uncertainty, matched pairs and a complete resource ledger.
  narrative:
    situation: The temporary environment is released and a fresh targeted check passes on ws_r18. Before release,
      the team needs evidence that the exact submitted candidate fixes the task, respects constraints, and
      improves outcomes beyond sampling noise.
    previously: The supplied repair has recovered and produced a candidate patch. A completed run still needs an independent check.
    next: The resulting acceptance contract and comparison evidence become the operating release gate; the
      next lab observes agents after deployment.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: What counts as an accepted repair
    question: What counts as an accepted task?
    goal: Assign a supported verdict to a candidate and name the evidence still needed for acceptance.
    concept_ids:
    - v3_13_A
    coverage: Task acceptance contract — bounded supplied-case policy comparison
    limitation: The declared assertions cover only their stated properties; passing this fixture does not
      certify all task behavior. This instrument checks required evidence on fixed records; it does not expose
      all four verdicts as selectable grading outcomes.
    next: Comparable evidence requires controlled trial starts and a grader the candidate cannot modify.
  - part: B
    title: A fair trial needs protected evidence
    question: Is the evaluation evidence protected and comparable?
    goal: Identify contamination or grader-reach violations and design a comparable evidence boundary.
    concept_ids:
    - v3_13_B
    coverage: Hermetic evaluation gym; Grader isolation — bounded supplied-case policy comparison
    limitation: Isolation is an assumed fixture boundary, not a real sandbox audit; reference solutions must
      remain outside both agent and submitted artifact reach. Reset and isolation are supplied evidence rather
      than a running hermetic evaluation gym.
    next: Even a protected grader can make mistakes; the next part measures them.
  - part: C
    title: Calibrate the verdict, not the confidence of the report
    question: Which verdict errors does this grader make?
    goal: Interpret grader errors with the correct denominator and choose a decision threshold using declared
      costs and coverage.
    concept_ids:
    - v3_13_C
    coverage: Grader calibration — bounded supplied-case policy comparison
    limitation: The candidate records are hypothetical teaching inputs, not measured grader behavior. Reference
      assessment is assumed independent and correct for this exercise. No population error rate or statistical
      confidence interval is inferred from this small fixed cohort. Only the two declared thresholds are selectable;
      there is no learned or population-calibrated grader.
    next: The final comparison must preserve tasks, pair outcomes and charge every initiated trial.
  - part: D
    title: Does the candidate improve the system
    question: Does the candidate improve the declared system?
    goal: Assess a candidate comparison using task-aware uncertainty, matched pairs and a complete resource
      ledger.
    concept_ids:
    - v3_13_D
    coverage: Task sampling and score intervals; Paired comparison; Matched-budget evaluation — bounded supplied-case
      policy comparison
    limitation: No score interval or release conclusion is computed without a sampled cohort and declared
      statistical protocol. This policy fixture is not a statistical performance estimate. No task-allocation
      slider, acceptance interval, paired statistical test, repeated-run reliability estimate, or cost-accounting
      view is implemented here.
    next: Carry the pinned acceptance contract, paired evidence and unresolved risks into the Operating Agents
      release decision.
  core_concepts:
  - id: v3_13_A
    title: What counts as an accepted repair
    source_concepts:
    - chapter: 13
      concept: Task acceptance contract
      concept_map: books/vol3/13_evaluation/evaluation_concepts.yml
    source_anchor: sec-vol3-evaluation-contract-verdicts
    learning_claim: A trial is credited as an accepted task only when evidence on the exact candidate bytes
      satisfies its declared outcome, process, resource, and residual-duty criteria, and every verdict is
      pass, fail, pending, or unknown, with no default to pass.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Inspect matching versus stale artifact evidence, then select a verdict for the supplied complete,
      failed, in-flight or missing-evidence packet.
    student_action: Compare a visible-test pass with artifact-bound acceptance across process, resource, and
      residual-duty dimensions.
    evidence_to_inspect: Artifact hash per check, criterion coverage, process/resource ledger, residual owners
      and per-criterion verdict.
    explanation_prompt: Supply the missing exact-artifact regression check while leaving a prohibited action
      or unresolved duty. Does acceptance follow?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A targeted check passed on ws_r18, but the submission now contains ws_r19 and has no recorded
        regression check.
      briefing: Acceptance names outcome, process, resource and residual-duty criteria for exact artifact
        bytes. Verdicts are pass, fail, pending or unknown; each check has explicit coverage.
      fixed: Same task, mandatory criteria, candidate identity and check coverage; no relaxation of criteria
        after viewing results.
      feedback_rule: Show the particular missing or failed criterion. A passing targeted test cannot certify
        untested regressions, different artifact bytes, or closed duties.
      next: Comparable evidence requires controlled trial starts and a grader the candidate cannot modify.
    policy_options: []
  - id: v3_13_B
    title: A fair trial needs protected evidence
    source_concepts:
    - chapter: 13
      concept: Hermetic evaluation gym
      concept_map: books/vol3/13_evaluation/evaluation_concepts.yml
    - chapter: 13
      concept: Grader isolation
      concept_map: books/vol3/13_evaluation/evaluation_concepts.yml
    source_anchor: sec-vol3-evaluation-gyms-grader-isolation
    learning_claim: Comparable trials need a hermetic boundary that declares which dependencies are provisioned,
      simulated, or blocked, a versioned task fixture, and a reset that leaves no state for the next trial.
      Sealed tests protect evidence only if a trusted controller outside both the live agent's reach and the
      submitted artifact's execution keeps the reference solutions, hidden tests, and score store and binds
      each verdict to the artifact hash.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare shared mutable trials with reset versioned fixtures; choose in-workspace or isolated
      sealed grading for the same candidate.
    student_action: Compare available-fixture grading with reset, protected-grader, and exact-artifact checks
      on the same contaminated trials.
    evidence_to_inspect: Reset manifest, dependency versions, allowed interaction graph, artifact export hash,
      grader reachability and score provenance.
    explanation_prompt: Keep tests hidden but let submitted code access the score store, or change a live
      dependency between trials. Which claim remains invalid?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The baseline starts from a clean repository, but the candidate inherits a prior fix and can edit
        the tests that produce its score.
      briefing: A versioned fixture declares provisioned, simulated and blocked dependencies, variation policy
        and reset. A trusted controller outside candidate reach binds grader verdicts to exported artifact
        hashes.
      fixed: Same task distribution, initial fixture specification, candidate systems and acceptance contract.
      feedback_rule: Flag actual inequivalent starts or reachable protected evidence. Hermetic means declared
        controlled variation, not production equivalence or deterministic model replies.
      next: Even a protected grader can make mistakes; the next part measures them.
    policy_options: []
  - id: v3_13_C
    title: Calibrate the verdict, not the confidence of the report
    source_concepts:
    - chapter: 13
      concept: Grader calibration
      concept_map: books/vol3/13_evaluation/evaluation_concepts.yml
    source_anchor: sec-vol3-evaluation-grading-errors
    learning_claim: A grader is characterized only against an independent reference assessment, and its false-acceptance
      rate and the failure share among accepted results answer different questions.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Choose among supplied grader thresholds or calibrated grader configurations on a fixed reference-labeled
      cohort.
    student_action: Compare the two supplied passed-check thresholds against the same independently reference-labeled
      candidate cohort.
    evidence_to_inspect: Case-level grader/reference pairs, confusion matrix, rejected useful cases, accepted
      failures, undecidable reference cases and grading cost.
    explanation_prompt: Change the supplied prevalence mix without changing conditional grader behavior, or
      add a disputed reference case. Which summary changes?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A report-based grader accepts a fluent repair description whose code fails an independent defect
        check.
      briefing: Calibration compares grader decisions with an independent reference assessment on the same
        cases. False acceptance among truly unacceptable cases differs from the failure share among accepted
        cases.
      fixed: Same independently assessed cases, reference rubric, candidate artifacts and declared acceptance
        policy; no relabeling difficult cases.
      feedback_rule: Compute rates centrally from observed counts with named denominators; preserve unknown
        reference assessments. A lower acceptance count alone is not evidence of improved calibration.
      next: The final comparison must preserve tasks, pair outcomes and charge every initiated trial.
    policy_options: []
  - id: v3_13_D
    title: Does the candidate improve the system
    source_concepts:
    - chapter: 13
      concept: Task sampling and score intervals
      concept_map: books/vol3/13_evaluation/evaluation_concepts.yml
    - chapter: 13
      concept: Paired comparison
      concept_map: books/vol3/13_evaluation/evaluation_concepts.yml
    - chapter: 13
      concept: Matched-budget evaluation
      concept_map: books/vol3/13_evaluation/evaluation_concepts.yml
    source_anchor: sec-vol3-evaluation-matched-budgets
    learning_claim: Repeats shrink only the run-variance term while new tasks shrink both, so evaluation samples
      tasks rather than runs and reports score intervals instead of point estimates. Configurations are compared
      on the same sampled tasks with outcome pairs kept together, which cuts the variance of the difference,
      and noninferiority margins are planned before data. Policies are compared on a fixed task distribution,
      criteria, and resource envelope, and budgeted acceptance and observed cost per accepted task charge
      every initiated trial.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Allocate a fixed evaluation allowance between new task fixtures and repeat runs; compare paired
      versus broken-pair analysis and full versus success-only cost accounting as separate views.
    student_action: Compare point-estimate credit with same-task-pair, matched-budget, and representative-sampling
      checks on fixed improvement claims.
    evidence_to_inspect: Task IDs and repeat groups, per-task outcomes, paired deltas and uncertainty, resource-qualified
      acceptances, failed/halted/unknown trials and total observed cost.
    explanation_prompt: Add a supplied hard-task slice or make the two systems trade wins across the same
      pairs. Does the preferred system or uncertainty change?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The candidate passes more recorded repair trials, but most repeats are on one easy task and some
        failed attempts were omitted from its cost report.
      briefing: Tasks and repeated runs are distinct sampling units. Compare systems on the same task pairs,
        predeclared criteria and resource envelope; every initiated attempt contributes observed cost.
      fixed: Same supplied task-level outcome table, acceptance criteria, candidate configurations and predeclared
        budget/margin.
      feedback_rule: State whether the evidence supports the planned claim or remains inconclusive. Repeats
        do not become independent tasks; a smaller success-only bill is not a cost-per-accepted-task improvement.
      next: Carry the pinned acceptance contract, paired evidence and unresolved risks into the Operating
        Agents release decision.
    policy_options: []
  primary_concept_dispositions:
  - concept: Task acceptance contract
    part: A
    disposition: bounded supplied-case investigation; This instrument checks required evidence on fixed records;
      it does not expose all four verdicts as selectable grading outcomes.
  - concept: Hermetic evaluation gym
    part: B
    disposition: bounded supplied-case investigation; Reset and isolation are supplied evidence rather than
      a running hermetic evaluation gym.
  - concept: Grader isolation
    part: B
    disposition: bounded supplied-case investigation; Reset and isolation are supplied evidence rather than
      a running hermetic evaluation gym.
  - concept: Grader calibration
    part: C
    disposition: bounded supplied-case investigation; Only the two declared thresholds are selectable; there
      is no learned or population-calibrated grader.
  - concept: Task sampling and score intervals
    part: D
    disposition: bounded supplied-case investigation; No task-allocation slider, acceptance interval, paired
      statistical test, repeated-run reliability estimate, or cost-accounting view is implemented here.
  - concept: Paired comparison
    part: D
    disposition: bounded supplied-case investigation; No task-allocation slider, acceptance interval, paired
      statistical test, repeated-run reliability estimate, or cost-accounting view is implemented here.
  - concept: Matched-budget evaluation
    part: D
    disposition: bounded supplied-case investigation; No task-allocation slider, acceptance interval, paired
      statistical test, repeated-run reliability estimate, or cost-accounting view is implemented here.
  model_support:
    existing:
    - mlsysim.physics.statistics.calc_two_proportion_sample_size exists for declared sample-design inputs.
      Literature supplies cited benchmark observations; Agents.Remediation.OnCall and Agents.Support.CustomerOps
      supply workload profiles.
    required:
    - MLSysIM versioned evaluation fixtures for artifact-bound verdicts, hermetic reset, isolated grader provenance
      and reference calibration.
    - Task-cluster-aware intervals, paired outcome analysis, matched-budget ledgers and confusion-matrix summaries
      need centralized implementations or verified existing APIs before runtime generation; do not use independent-run
      intervals for repeated tasks.
