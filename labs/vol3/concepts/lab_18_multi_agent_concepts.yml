lab_concept_map:
  schema_version: 1
  lab_id: v3_18
  chapter: 18
  title: Multi-Agent Coordination
  source_notebook: labs/vol3/lab_18_multi_agent.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded controlled policy references; numerical and transfer limits explicit
  source_chapter_concept_map: books/vol3/18_multi_agent/multi_agent_concepts.yml
  source_chapter: books/vol3/18_multi_agent/18_multi_agent.qmd
  chapter_goal: Choose whether delegation improves the task relative to a capable controller under the
    same permissions and budget.
  student_goals:
  - Identify what delegation buys beyond parallel calls and find a condition where an extra worker hurts.
  - Construct a child assignment whose topology and admission bounds prevent stale assumptions and unbacked
    obligations.
  - Reject semantically stale changes and explain why more agreeing reviewers do not replace boundary
    evidence.
  - Defend delegation, single control, or an inconclusive decision under a declared objective and matched
    constraints.
  narrative:
    situation: The repair assignment grows into an authentication-interface migration. Workers can isolate
      context, but callers depend on the interface revision and integration remains accountable.
    previously: The trained policy remains one bounded controller; delegation must earn its additional
      boundaries.
    next: Agent Economics now reconciles the full architecture bill with accepted work.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Make delegation earn its keep
    question: What does delegation add over a capable controller?
    goal: Identify what delegation buys beyond parallel calls and find a condition where an extra worker
      hurts.
    concept_ids:
    - v3_18_A
    coverage: Delegation adds boundaries; Coordination overhead
    limitation: Dependent fan-out and rejected stale work; no numerical coordination speedup. Fixed authored
      cases do not predict learned behavior or production performance.
    next: Choosing workers still leaves separate dependency, communication, and supervision structures.
  - part: B
    title: Bound the child assignment
    question: What belongs in the child contract?
    goal: Construct a child assignment whose topology and admission bounds prevent stale assumptions and
      unbacked obligations.
    concept_ids:
    - v3_18_B
    coverage: Three delegation structures; Spawning as admission; Typed envelopes and receipts
    limitation: Typed child contract, admission reservation, and distinct dependency/communication/supervision
      roles. Fixed authored cases do not predict learned behavior or production performance.
    next: A returned patch must survive integration even when a textual merge is clean.
  - part: C
    title: Validate the integration
    question: Is a clean merge an accepted result?
    goal: Reject semantically stale changes and explain why more agreeing reviewers do not replace boundary
      evidence.
    concept_ids:
    - v3_18_C
    coverage: Clean merge is not a valid change; Correlated reviewers
    limitation: Textual merge versus semantic acceptance, plus shared-source reviewer error. Fixed authored
      cases do not predict learned behavior or production performance.
    next: The final decision compares the complete delegated system to the capable single-controller baseline.
  - part: D
    title: Choose the architecture
    question: Which coordination design fits the task?
    goal: Defend delegation, single control, or an inconclusive decision under a declared objective and
      matched constraints.
    concept_ids:
    - v3_18_D
    coverage: Matched single-controller baseline
    limitation: Matched accepted outcomes with extra delegation boundaries; no measured architecture speedup.
      Fixed authored cases do not predict learned behavior or production performance.
    next: Agent Economics now reconciles the full architecture bill with accepted work.
  core_concepts:
  - id: v3_18_A
    title: Make delegation earn its keep
    source_concepts:
    - chapter: 18
      concept: Delegation adds boundaries
      concept_map: books/vol3/18_multi_agent/multi_agent_concepts.yml
    - chapter: 18
      concept: Coordination overhead
      concept_map: books/vol3/18_multi_agent/multi_agent_concepts.yml
    source_anchor: sec-vol3-multiagent-need
    learning_claim: A delegated worker owns a separate child trajectory, and a capable single controller
      already runs tools and candidates concurrently, so delegation buys only separation of context, authority,
      and lifecycle, at the price of new boundaries. Under Speedup(N) = 1/((1-p) + p/N + c(N)) any gain
      requires c(N) < p(1 - 1/N), the best count sits near sqrt(p/c) for linear overhead, and the serial
      fraction caps speedup at 1/(1-p).
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Compare a single controller with selected worker counts under a declared overhead curve
      and the same resource ceiling.
    student_action: Compare a single controller with selected worker counts under a declared overhead
      curve and the same resource ceiling.
    evidence_to_inspect: Boundary inventory, measured or explicitly assumed work partition, coordination
      cost, conditional elapsed time, and all-initiated-task bill.
    explanation_prompt: Increase coupling or serial work until the additional worker reverses the preference.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair assignment grows into an authentication-interface migration. Workers can isolate
        context, but callers depend on the interface revision and integration remains accountable.
      briefing: A capable single controller already runs tools concurrently. Delegation adds child contexts,
        grants, lifecycles, and coordination cost.
      fixed: Same migration scope, admissible tools/concurrency, acceptance criteria, slot pool, and evidence
        access.
      feedback_rule: Use calc_universal_scalability_law only as its stated scaling model; never infer
        task acceptance from speedup. More workers need not be faster or cheaper.
      next: Choosing workers still leaves separate dependency, communication, and supervision structures.
    policy_options:
    - Capable single controller with parallel tools
    - Bounded delegated workers with isolated context
    - Maximum permitted worker count
  - id: v3_18_B
    title: Bound the child assignment
    source_concepts:
    - chapter: 18
      concept: Three delegation structures
      concept_map: books/vol3/18_multi_agent/multi_agent_concepts.yml
    - chapter: 18
      concept: Spawning as admission
      concept_map: books/vol3/18_multi_agent/multi_agent_concepts.yml
    - chapter: 18
      concept: Typed envelopes and receipts
      concept_map: books/vol3/18_multi_agent/multi_agent_concepts.yml
    source_anchor: sec-vol3-multiagent-contracts
    learning_claim: The dependency graph, the communication topology, and the supervision tree are separate
      structures, and conflating them hides quadratic communication cost and orphaned lifecycles. Dynamic
      spawning makes the execution graph nondeterministic, so the runtime enforces fan-out, concurrency,
      depth, and deadline bounds and reserves each child's maximum liability before it starts. A typed
      task envelope binds a child to immutable inputs, a scoped grant, a reservation, and required evidence
      that the runtime resolves, and the receipt carries runtime-populated evidence back, so a worker
      cannot widen either.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose a valid dependency/supervision arrangement, spawn limits, and task envelope; inspect
      runtime-populated receipt fields.
    student_action: Choose a valid dependency/supervision arrangement, spawn limits, and task envelope;
      inspect runtime-populated receipt fields.
    evidence_to_inspect: Three separately drawn graphs, admission decisions, reserved liability, input
      revisions, grant containment, and receipt provenance.
    explanation_prompt: A child asks to spawn after cancellation or names a wider grant; show why the
      admission gate refuses.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair assignment grows into an authentication-interface migration. Workers can isolate
        context, but callers depend on the interface revision and integration remains accountable.
      briefing: Dependency edges govern what must precede what; routing edges carry messages; supervision
        edges govern lifecycle. The runtime binds immutable inputs, grants, reservations, and evidence
        to each child.
      fixed: Root contract, allowed files, baseline snapshot, deadline, shared budget, and required evidence.
      feedback_rule: Reject worker-supplied authority widening and unreserved spawn. A supervision parent
        does not erase a data dependency; a worker claim does not become verified evidence.
      next: A returned patch must survive integration even when a textual merge is clean.
    policy_options:
    - Informal worker prompts without reservations
    - Typed task envelopes with separate dependency/supervision graphs
    - Supervisor routing treated as the dependency graph
  - id: v3_18_C
    title: Validate the integration
    source_concepts:
    - chapter: 18
      concept: Clean merge is not a valid change
      concept_map: books/vol3/18_multi_agent/multi_agent_concepts.yml
    - chapter: 18
      concept: Correlated reviewers
      concept_map: books/vol3/18_multi_agent/multi_agent_concepts.yml
    source_anchor: sec-vol3-multiagent-concurrency
    learning_claim: Shared working directories produce lost updates and torn reads, and write sets collide
      with probability 1 - exp(-N(N-1)w^2/2F), so isolation is provided per worker and a merge is validated,
      not trusted. Reviewers share each candidate's difficulty, so correlated errors set an irreducible
      floor on majority-vote false approval that adding reviewers cannot remove.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Compare shared versus isolated workspaces, revalidate dependency revisions, and inspect
      reviewer outcomes on shared-difficulty cases.
    student_action: Compare shared versus isolated workspaces, revalidate dependency revisions, and inspect
      reviewer outcomes on shared-difficulty cases.
    evidence_to_inspect: Read/write sets, base/head revisions, merge versus integration verdict, reviewer
      agreement matrix, and shared failures.
    explanation_prompt: Give every reviewer the same stale interface document or change a dependency without
      a textual collision.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair assignment grows into an authentication-interface migration. Workers can isolate
        context, but callers depend on the interface revision and integration remains accountable.
      briefing: Different files can merge cleanly while callers target an obsolete interface. Similar
        reviewers can repeat the same mistaken assumption.
      fixed: Same base snapshot, candidate patches, required interface contract, sealed integration checks,
        and reviewer evidence access.
      feedback_rule: Show concrete stale dependencies and actual checks. A clean merge or majority vote
        never establishes end-to-end acceptance; do not assume reviewer independence.
      next: The final decision compares the complete delegated system to the capable single-controller
        baseline.
    policy_options:
    - Accept every clean textual merge
    - Accept majority reviewer agreement
    - Revalidate dependency revisions and integration checks
  - id: v3_18_D
    title: Choose the architecture
    source_concepts:
    - chapter: 18
      concept: Matched single-controller baseline
      concept_map: books/vol3/18_multi_agent/multi_agent_concepts.yml
    source_anchor: sec-vol3-multiagent-evaluation
    learning_claim: Delegation is justified only if it beats a capable single controller on the same tasks,
      criteria, evidence access, concurrency, and resource ceilings, scored on end-to-end acceptance with
      every initiated task counted.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose the objective and compare supplied paired migration outcomes; select architecture
      and a reversal condition.
    student_action: Choose the objective and compare supplied paired migration outcomes; select architecture
      and a reversal condition.
    evidence_to_inspect: Acceptance, elapsed time, cost per accepted task, unresolved liabilities, and
      uncertainty for both complete systems.
    explanation_prompt: Increase interface coupling or reduce task breadth; identify where single control
      becomes preferable.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair assignment grows into an authentication-interface migration. Workers can isolate
        context, but callers depend on the interface revision and integration remains accountable.
      briefing: Any saved worker time competes with supervision, integration, rejected work, and cleanup.
        All initiated tasks count.
      fixed: Tasks, criteria, evidence access, concurrency, aggregate resources, deadlines, and fallback
        policy.
      feedback_rule: Prefer only a supported trade-off; a baseline denied parallel tools is invalid. Include
        failures and canceled work; no universal multi-agent winner.
      next: Agent Economics now reconciles the full architecture bill with accepted work.
    policy_options:
    - Single controller under matched resources
    - Delegation under matched resources
    - 'Hold: gather missing matched end-to-end evidence'
