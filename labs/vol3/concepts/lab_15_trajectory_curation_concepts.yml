  - concept: Task-group splits
    part: B
    disposition: 'bounded policy reference: Task-family split inheritance and early deterministic rejection;
      no cost-per-rejection optimum.'
  - concept: Admission cascade
    part: B
    disposition: 'bounded policy reference: Task-family split inheritance and early deterministic rejection;
      no cost-per-rejection optimum.'
  - concept: Recovery demonstrations
    part: C
    disposition: 'bounded policy reference: Recovery-prefix fidelity and categorical self-selection narrowing;
      no training gain or collection success-rate estimate.'
  - concept: Self-selection narrowing
    part: C
    disposition: 'bounded policy reference: Recovery-prefix fidelity and categorical self-selection narrowing;
      no training gain or collection success-rate estimate.'
  - concept: Bounded collection flow
    part: D
    disposition: 'bounded policy reference: Pending collection credit and descendant withdrawal audit;
