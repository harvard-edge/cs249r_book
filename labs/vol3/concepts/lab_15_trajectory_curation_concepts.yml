lab_concept_map:
  schema_version: 1
  lab_id: v3_15
  chapter: 15
  title: Trajectory Curation
  source_notebook: labs/vol3/lab_15_trajectory_curation.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded controlled policy references; numerical and transfer limits explicit
  source_chapter_concept_map: books/vol3/15_trajectory_curation/trajectory_curation_concepts.yml
  source_chapter: books/vol3/15_trajectory_curation/15_trajectory_curation.qmd
  chapter_goal: Defend which observed failures warrant intervention and which trace records may legitimately
    enter a learning dataset.
  student_goals:
  - Choose a justified intervention and route each candidate artifact to its appropriate evidence requirements.
  - Prevent task leakage and reduce verifier work without changing which records are eligible.
  - Select correction targets without erasing the state that made them meaningful, and diagnose narrowing
    coverage.
  - Maintain a bounded staging invariant and trace whether a withdrawn source invalidates published descendants.
  narrative:
    situation: The connection-pool repair includes a malformed proposal that the runtime refused and a
      later correction that worked. The team wants to learn from the run. Decide which examples belong
      in training, which tokens teach the intended behavior, and which evidence must stay out of evaluation.
    previously: Operational records now feed the question of whether a model-behavior gap deserves training.
    next: The released corpus manifest now defines exactly what fine-tuning is allowed to imitate.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Earn a learning intervention
    question: Is learning the right remedy for this failure?
    goal: Choose a justified intervention and route each candidate artifact to its appropriate evidence
      requirements.
    concept_ids:
    - v3_15_A
    coverage: Capability-gap triage; Learning artifacts from one record
    limitation: Interface-failure triage and route-specific learning-artifact admission. Fixed authored
      cases do not predict learned behavior or production performance.
    next: The chosen learning use needs uncontaminated partitions and checkable admission.
  - part: B
    title: Admit without leakage
    question: May this trajectory enter the training dataset?
    goal: Prevent task leakage and reduce verifier work without changing which records are eligible.
    concept_ids:
    - v3_15_B
    coverage: Task-group splits; Admission cascade
    limitation: Task-family split inheritance and early deterministic rejection; no cost-per-rejection
      optimum. Fixed authored cases do not predict learned behavior or production performance.
    next: An admitted record still needs a careful choice of correction targets and coverage.
  - part: C
    title: Teach recovery, preserve contrast
    question: What contrast should the learning record preserve?
    goal: Select correction targets without erasing the state that made them meaningful, and diagnose
      narrowing coverage.
    concept_ids:
    - v3_15_C
    coverage: Recovery demonstrations; Self-selection narrowing
    limitation: Recovery-prefix fidelity and categorical self-selection narrowing; no training gain or
      collection success-rate estimate. Fixed authored cases do not predict learned behavior or production
      performance.
    next: Collection must remain bounded and every transformed record traceable.
  - part: D
    title: Bound collection and lineage
    question: Can withdrawal reach every derived record?
    goal: Maintain a bounded staging invariant and trace whether a withdrawn source invalidates published
      descendants.
    concept_ids:
    - v3_15_D
    coverage: Bounded collection flow; Record lineage
    limitation: Pending collection credit and descendant withdrawal audit; no burst-buffer sizing. Fixed
      authored cases do not predict learned behavior or production performance.
    next: The released corpus manifest now defines exactly what fine-tuning is allowed to imitate.
  core_concepts:
  - id: v3_15_A
    title: Earn a learning intervention
    source_concepts:
    - chapter: 15
      concept: Capability-gap triage
      concept_map: books/vol3/15_trajectory_curation/trajectory_curation_concepts.yml
    - chapter: 15
      concept: Learning artifacts from one record
      concept_map: books/vol3/15_trajectory_curation/trajectory_curation_concepts.yml
    source_anchor: sec-vol3-flywheel-intervention-order
    learning_claim: A failure earns a weight update only if it persists with complete context, a well-formed
      interface, and a healthy runtime, so counterfactual probes run up the intervention ladder from context
      and schema to SFT and then RL. One recorded run can yield imitation material, a preference comparison,
      or a rollout fixture, and each use has its own admission conditions rather than inheriting the run's
      outcome.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Run a context/schema/runtime counterfactual probe before requesting a weight update; select
      proposed record use.
    student_action: Run a context/schema/runtime counterfactual probe before requesting a weight update;
      select proposed record use.
    evidence_to_inspect: Residual behavior after each applicable repair, route-specific admission checklist,
      and cost/reversibility notes.
    explanation_prompt: Make the context complete but retain a recurring invalid proposal; explain when
      a model update becomes defensible.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The connection-pool record contains a refused malformed proposal and a later correction.
        The team must build a lawful, informative corpus rather than train indiscriminately on accepted
        runs.
      briefing: Context, interface, and runtime failures can masquerade as model incapability. The same
        record has different admission conditions as a demonstration, preference pair, or rollout fixture.
      fixed: Same failure fixture, task goal, policy baseline, and permission record.
      feedback_rule: A resolved interface defect does not earn training. Accepted task status alone does
        not admit a demonstration or preference label; unknown permission blocks use.
      next: The chosen learning use needs uncontaminated partitions and checkable admission.
    policy_options:
    - Repair missing context before training
    - Repair the malformed interface before training
    - Request training only after residual behavioral evidence
  - id: v3_15_B
    title: Admit without leakage
    source_concepts:
    - chapter: 15
      concept: Task-group splits
      concept_map: books/vol3/15_trajectory_curation/trajectory_curation_concepts.yml
    - chapter: 15
      concept: Admission cascade
      concept_map: books/vol3/15_trajectory_curation/trajectory_curation_concepts.yml
    source_anchor: sec-vol3-flywheel-verification
    learning_claim: With k attempts per task a random trace split puts most tasks on both sides, so partitions
      are assigned to task groups that hold every attempt, paraphrase, fork, and derived record. Admission
      is a route-specific conjunction of predicate families that each resolve to pass, fail, pending,
      or unknown, a missing check never defaults to pass, and checks are ordered by cost per rejection.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose task-group versus trace split; reorder permissible checks by measured cost per rejection.
    student_action: Choose task-group versus trace split; reorder permissible checks by measured cost
      per rejection.
    evidence_to_inspect: Cross-partition task-group collisions, per-route disposition, reached checks,
      verifier occupancy, and admitted artifact counts.
    explanation_prompt: Introduce a derived trace mislabeled as a fresh task, or correlated checks whose
      rejection rates change after filtering.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The connection-pool record contains a refused malformed proposal and a later correction.
        The team must build a lawful, informative corpus rather than train indiscriminately on accepted
        runs.
      briefing: Every retry, fork, paraphrase, and derived view of a task belongs to one split group.
        Route-specific predicates have pass, fail, pending, and unknown states.
      fixed: Task families, record routes, predicate definitions, source permissions, and protected grader.
      feedback_rule: Show leakage from random trace assignment and exact check outcomes. A pending or
        unknown check never becomes pass; changing check order preserves yield only under the stated outcome
        assumptions.
      next: An admitted record still needs a careful choice of correction targets and coverage.
    policy_options:
    - Random trace split
    - Task-group split with cheap predicates first
    - Task-group split with expensive predicates first
  - id: v3_15_C
    title: Teach recovery, preserve contrast
    source_concepts:
    - chapter: 15
      concept: Recovery demonstrations
      concept_map: books/vol3/15_trajectory_curation/trajectory_curation_concepts.yml
    - chapter: 15
      concept: Self-selection narrowing
      concept_map: books/vol3/15_trajectory_curation/trajectory_curation_concepts.yml
    source_anchor: sec-vol3-trajectory-curation-self-improvement
    learning_claim: A policy trained only on clean prefixes meets off-path states it never saw, so recovery
      demonstrations keep the mistake as conditioning context and select only the assessed correction
      as the target. A generate-select-train loop carries contrast only on informative tasks, so it narrows
      toward what it already solves, and hard and trivial fixtures cost attempts without teaching.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose retained conditioning and target spans; compare collection difficulty mixtures with
      a fixed attempt budget.
    student_action: Choose retained conditioning and target spans; compare collection difficulty mixtures
      with a fixed attempt budget.
    evidence_to_inspect: Visible recovery prefixes and targets, task coverage, solved and tied groups,
      failed-attempt costs, and held-out failure classes.
    explanation_prompt: Shift collection toward nearly trivial or never-solved tasks; identify lost contrast
      and omitted recovery states.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The connection-pool record contains a refused malformed proposal and a later correction.
        The team must build a lawful, informative corpus rather than train indiscriminately on accepted
        runs.
      briefing: The mistake may be essential conditioning context even when it is not a target. Generate-select-train
        disproportionately retains tasks the current policy already solves.
      fixed: Task acceptance, original chronology, corpus permission, and collection budget; no future
        observation enters an earlier prefix.
      feedback_rule: Explain which behaviors are reinforced and which remain unsupported. More harvested
        successes can coexist with less informative task coverage; no assumed improvement from target
        count alone.
      next: Collection must remain bounded and every transformed record traceable.
    policy_options:
    - Train every assistant response in accepted runs
    - Keep the mistake as context and select the assessed correction
    - Harvest only easy successful tasks
  - id: v3_15_D
    title: Bound collection and lineage
    source_concepts:
    - chapter: 15
      concept: Bounded collection flow
      concept_map: books/vol3/15_trajectory_curation/trajectory_curation_concepts.yml
    - chapter: 15
      concept: Record lineage
      concept_map: books/vol3/15_trajectory_curation/trajectory_curation_concepts.yml
    source_anchor: sec-vol3-flywheel-pipeline
    learning_claim: Collection is an asynchronous pipeline whose staging must be sized for a verifier
      service-time collapse, not average utilization, with each run holding a collection credit at the
      record ceiling until durable disposition and cost counted per emitted artifact. Every record version
      carries a lineage envelope, and any transformation creates a derived record that inherits its source's
      split group and use permission, so withdrawal reaches every descendant.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose collection credit limit and stop-admission watermark; trace redaction, derived-example
      creation, and source withdrawal.
    student_action: Choose collection credit limit and stop-admission watermark; trace redaction, derived-example
      creation, and source withdrawal.
    evidence_to_inspect: Reserved/free credits, staging high watermark, durable dispositions, descendant
      permission states, and cost per emitted artifact including rejected attempts.
    explanation_prompt: Inject a verifier-timeout burst and a source withdrawal after corpus publication.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The connection-pool record contains a refused malformed proposal and a later correction.
        The team must build a lawful, informative corpus rather than train indiscriminately on accepted
        runs.
      briefing: A stalled verifier holds staging and credits even when generation finishes. Transformations
        inherit split group and use permission; withdrawal must reach descendants.
      fixed: Record-size ceiling, delayed-verifier fixture, service assumptions, lineage graph, and route
        permissions.
      feedback_rule: Show the exact admission bound and unresolved liabilities. Releasing credit before
        durable disposition or ignoring descendant withdrawal violates the contract even if throughput
        rises.
      next: The released corpus manifest now defines exactly what fine-tuning is allowed to imitate.
    policy_options:
    - Release collection credit on generation completion
    - Hold credit until durable disposition
    - Hold credit and propagate source withdrawal through descendants
