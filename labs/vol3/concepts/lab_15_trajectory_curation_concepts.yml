  model_support:
    existing:
    - Canonical deterministic policy/evidence fixtures in MLSysIM; each part declares its supported mechanism
      and limits.
    missing:
    - Numerical learning dynamics, physical service-time predictions, and population generalization are
      outside these categorical reference instruments.
    boundary: Fixed authored policy cases; not live model execution or production performance measurements.
