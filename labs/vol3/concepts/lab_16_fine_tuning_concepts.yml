lab_concept_map:
  schema_version: 1
  lab_id: v3_16
  chapter: 16
  title: Trajectory Fine-Tuning
  source_notebook: labs/vol3/lab_16_fine_tuning.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded controlled policy references; numerical and transfer limits explicit
  source_chapter_concept_map: books/vol3/16_fine_tuning/fine_tuning_concepts.yml
  source_chapter: books/vol3/16_fine_tuning/16_fine_tuning.qmd
  chapter_goal: Choose where a behavior belongs and construct a faithful, correctly weighted training
    record.
  student_goals:
  - Assign a rule to weights, context, or runtime and reconstruct a training example without future evidence
    or repaired history.
  - Identify exactly which tokens train the policy and predict how a normalization change redistributes
    corpus influence.
  - Distinguish reference-state error from learner-state recovery and construct a preference comparison
    without rewarding rule violations.
  - Compare distillation and adapter choices using state accounting and closed-loop evidence rather than
    training loss alone.
  narrative:
    situation: The admitted recovery corpus can now train a repair policy, but the team must preserve
      what was seen, what was selected, and what the runtime still enforces.
    previously: The released corpus manifest now defines exactly what fine-tuning is allowed to imitate.
    next: A residual capability gap with a reliable verifier motivates examining RL rather than assuming
      it helps.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Put behavior in its proper home
    question: Does this behavior belong in context, a store, or weights?
    goal: Assign a rule to weights, context, or runtime and reconstruct a training example without future
      evidence or repaired history.
    concept_ids:
    - v3_16_A
    coverage: Three homes for behavior; Delivered-prefix serialization
    limitation: Runtime enforcement versus learned preference, plus delivered-prefix fidelity. Fixed authored
      cases do not predict learned behavior or production performance.
    next: The exact prefix is ready; the loss mask decides which tokens receive credit.
  - part: B
    title: Choose what gets reinforced
    question: Which tokens should contribute to the objective?
    goal: Identify exactly which tokens train the policy and predict how a normalization change redistributes
      corpus influence.
    concept_ids:
    - v3_16_B
    coverage: Loss masking; Loss normalization
    limitation: Policy-target masking and qualitative token versus example normalization under segmentation.
      Fixed authored cases do not predict learned behavior or production performance.
    next: Faithful imitation still faces unfamiliar learner states.
  - part: C
    title: Learn useful alternatives
    question: Which alternative should receive greater weight?
    goal: Distinguish reference-state error from learner-state recovery and construct a preference comparison
      without rewarding rule violations.
    concept_ids:
    - v3_16_C
    coverage: Exposure bias; Preference training
    limitation: Teacher-prefix versus closed-loop evidence, plus preference-pair admission and contrast
      roles. Fixed authored cases do not predict learned behavior or production performance.
    next: The team can now consider cheaper procedural transfer without assuming isolation.
  - part: D
    title: Release a scoped adaptation
    question: What evidence would justify this adaptation?
    goal: Compare distillation and adapter choices using state accounting and closed-loop evidence rather
      than training loss alone.
    concept_ids:
    - v3_16_D
    coverage: Trajectory distillation; Adapter state and modularity
    limitation: Admitted sampled-teacher records and versioned adapter compatibility; no training-state
      memory estimate. Fixed authored cases do not predict learned behavior or production performance.
    next: A residual capability gap with a reliable verifier motivates examining RL rather than assuming
      it helps.
  core_concepts:
  - id: v3_16_A
    title: Put behavior in its proper home
    source_concepts:
    - chapter: 16
      concept: Three homes for behavior
      concept_map: books/vol3/16_fine_tuning/fine_tuning_concepts.yml
    - chapter: 16
      concept: Delivered-prefix serialization
      concept_map: books/vol3/16_fine_tuning/fine_tuning_concepts.yml
    source_anchor: sec-vol3-fine-tuning-serialization
    learning_claim: Fine-tuning changes only the proposal distribution, so stable procedure can move into
      weights, deployment-varying contracts stay in context, and enforcement stays in the runtime. A training
      example reconstructs each selected response's input exactly as the model received it, truncations
      and redactions included, under a recorded tokenizer and template configuration.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Place sample behaviors in the three homes; choose a delivered-prefix serialization including
      refusal, truncation, and versioned template.
    student_action: Place sample behaviors in the three homes; choose a delivered-prefix serialization
      including refusal, truncation, and versioned template.
    evidence_to_inspect: Prefix diff against invocation record, future-information flags, and behavior-placement
      rationale.
    explanation_prompt: Change an environment-specific contract after training; test which home can update
      it safely.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The admitted recovery corpus can now train a repair policy, but the team must preserve what
        was seen, what was selected, and what the runtime still enforces.
      briefing: Stable procedure may belong in weights; deployment contracts belong in context; enforcement
        remains below the model. Each target must see the exact delivered prefix.
      fixed: Original chronology, tokenizer/template version, selected target turn, and deployment contract.
      feedback_rule: Reject future test results before the action and missing refusals; a cleaner-looking
        prompt may teach a different problem. Training changes proposal probabilities, not grants.
      next: The exact prefix is ready; the loss mask decides which tokens receive credit.
    policy_options:
    - Reconstruct exact delivered prefixes
    - Remove refusals to make a clean training transcript
    - Include later successful checks as earlier context
  - id: v3_16_B
    title: Choose what gets reinforced
    source_concepts:
    - chapter: 16
      concept: Loss masking
      concept_map: books/vol3/16_fine_tuning/fine_tuning_concepts.yml
    - chapter: 16
      concept: Loss normalization
      concept_map: books/vol3/16_fine_tuning/fine_tuning_concepts.yml
    source_anchor: sec-vol3-fine-tuning-loss-masking
    learning_claim: Loss is placed only on selected policy-response positions while prompts, refused proposals,
      and observations stay as attended context with zero loss, because a trajectory has two authors and
      only one is trained. Token averaging and example averaging weight trajectories differently, so segmentation
      and microbatching silently re-weight the corpus unless the normalization rule is fixed.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Compare all-token, all-assistant, and selected-response masks; choose token or example normalization
      under a fixed batch.
    student_action: Compare all-token, all-assistant, and selected-response masks; choose token or example
      normalization under a fixed batch.
    evidence_to_inspect: Token-role mask, active target counts, normalized contribution per example, and
      refused-proposal inclusion warnings.
    explanation_prompt: Split one long example into segments without changing content; check whether weighting
      silently changes.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The admitted recovery corpus can now train a repair policy, but the team must preserve what
        was seen, what was selected, and what the runtime still enforces.
      briefing: Observations and refused proposals remain context with zero loss. Token and example averages
        assign different relative weight to long and short records.
      fixed: Same tokenized examples, selected target policy, logits fixture, and optimizer-step budget.
      feedback_rule: Compute from the supplied token/loss fixture; lower displayed loss across changed
        masks is not evidence of a better policy. Zero loss does not remove context attention.
      next: Faithful imitation still faces unfamiliar learner states.
    policy_options:
    - All-token loss
    - All-assistant loss
    - Selected-response loss with declared normalization
  - id: v3_16_C
    title: Learn useful alternatives
    source_concepts:
    - chapter: 16
      concept: Exposure bias
      concept_map: books/vol3/16_fine_tuning/fine_tuning_concepts.yml
    - chapter: 16
      concept: Preference training
      concept_map: books/vol3/16_fine_tuning/fine_tuning_concepts.yml
    source_anchor: sec-vol3-fine-tuning-exposure-bias
    learning_claim: A disagreement rate measured on reference prefixes bounds excess task cost only by
      min(H, H^2 eps), while the same rate on learner states with bounded recovery cost gives a linear
      bound, so where imitation error is measured sets the horizon penalty. When several admissible continuations
      succeed but differ in cost or risk, DPO over selected spans raises the preferred record's reference-relative
      score against the dispreferred one from an identical context.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Select recovery-state coverage; compare two accepted continuations with different verification
      cost using a frozen context and explicit preference criterion.
    student_action: Select recovery-state coverage; compare two accepted continuations with different
      verification cost using a frozen context and explicit preference criterion.
    evidence_to_inspect: Learner-state continuations, recovery costs, pair eligibility, scored spans,
      reference-relative margins, and closed-loop task verdicts.
    explanation_prompt: Provide a low-loss policy that loops after a version conflict, or change one pair
      prefix so the comparison is no longer matched.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The admitted recovery corpus can now train a repair policy, but the team must preserve what
        was seen, what was selected, and what the runtime still enforces.
      briefing: Reference-prefix accuracy need not predict behavior after the learner makes an error.
        A preference pair needs the same starting context and admissible continuations.
      fixed: Task group split, runtime guards, shared comparison prefix, acceptance contract, and evaluator.
      feedback_rule: A low reference loss cannot prove closed-loop success. A cheaper rejected trajectory
        is ineligible as a preferred accepted repair; preference signal applies only to the recorded scored
        spans.
      next: The team can now consider cheaper procedural transfer without assuming isolation.
    policy_options:
    - Train only reference-prefix successes
    - Add assessed learner-state recovery demonstrations
    - Use admissible same-prefix preference comparisons
  - id: v3_16_D
    title: Release a scoped adaptation
    source_concepts:
    - chapter: 16
      concept: Trajectory distillation
      concept_map: books/vol3/16_fine_tuning/fine_tuning_concepts.yml
    - chapter: 16
      concept: Adapter state and modularity
      concept_map: books/vol3/16_fine_tuning/fine_tuning_concepts.yml
    source_anchor: sec-vol3-fine-tuning-peft
    learning_claim: A costly teacher configuration generates trajectories that pass the same admission
      as any demonstration, so distillation from sampled tokens is imitation rather than soft-target matching.
      LoRA cuts trainable parameters but parameter state falls only by the byte ratio of trainable to
      frozen state, and adapters give modularity, not isolation.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose admitted teacher demonstrations or context-distillation records; compare supported
      adapter/state configurations and serving compatibility.
    student_action: Choose admitted teacher demonstrations or context-distillation records; compare supported
      adapter/state configurations and serving compatibility.
    evidence_to_inspect: Admission lineage, frozen/trainable parameter inventory, optimizer-state bytes,
      adapter compatibility, and matched closed-loop scorecard.
    explanation_prompt: Swap the base revision or remove a procedure prompt whose behavior did not transfer;
      test compatibility and acceptance.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The admitted recovery corpus can now train a repair policy, but the team must preserve what
        was seen, what was selected, and what the runtime still enforces.
      briefing: A teacher-generated demonstration needs ordinary admission. LoRA changes trainable state
        and modular deployment, but an adapter is not an authority boundary.
      fixed: Base revision, corpus split, task acceptance, serving prompt, tool schemas, and runtime bounds.
      feedback_rule: Report parameter-state saving from actual inventory, not trainable fraction alone.
        No fabricated accuracy from rank; no promotion without evaluation under serving conditions.
      next: A residual capability gap with a reliable verifier motivates examining RL rather than assuming
        it helps.
    policy_options:
    - Full parameter update with admitted corpus
    - Versioned low-rank adapter with admitted corpus
    - Distill admitted teacher procedures with unchanged runtime bounds
