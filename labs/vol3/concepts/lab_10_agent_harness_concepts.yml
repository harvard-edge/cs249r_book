lab_concept_map:
  schema_version: 1
  lab_id: v3_10
  chapter: 10
  title: The Agent Harness
  source_notebook: labs/vol3/lab_10_agent_harness.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded policy investigations; broader mechanisms explicitly scoped
  source_chapter_concept_map: books/vol3/10_agent_harness/agent_harness_concepts.yml
  source_chapter: books/vol3/10_agent_harness/10_agent_harness.qmd
  chapter_goal: Choose a continuation and admission policy that accounts for task budgets, pending liability,
    and approved authority.
  student_goals:
  - Determine the next admissible step using a control record rather than the agent summary.
  - Resolve a race without admitting an illegal transition or discarding an outstanding duty.
  - Predict which work can still complete after a control event and identify the conditions for dispatching
    a reviewed proposal.
  - Explain an admission or halt decision from a multi-dimensional resource record, including the duties after
    a halt.
  narrative:
    situation: The repair has a safe tool boundary and execution environment. It can still keep calling tests
      after a pause, spend a budget through individually legal calls, or forget a late job. This episode turns
      the loop into supervised continuation.
    previously: The supplied repair has rules for dispatching tools and protecting data. It still needs supervision across turns.
    next: The authoritative record only helps while it survives. The next lab crashes the worker and asks
      which evidence a replacement can trust.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Who decides to continue
    question: Who owns the decision to continue?
    goal: Determine the next admissible step using a control record rather than the agent summary.
    concept_ids:
    - v3_10_A
    coverage: Harness owns continuation; Trajectory record — bounded supplied-case policy comparison
    limitation: Turn-boundary control is modeled; interruption latency within an unbounded model stream is
      not measured. The authoritative lifecycle state is supplied; the instrument does not execute a full
      harness reducer.
    next: The next part challenges atomic transitions and outstanding obligations.
  - part: B
    title: A late result still has an owner
    question: Who owns a result that arrives late?
    goal: Resolve a race without admitting an illegal transition or discarding an outstanding duty.
    concept_ids:
    - v3_10_B
    coverage: Guarded transitions; Settlement rule — bounded supplied-case policy comparison
    limitation: The fixture distinguishes eligibility from ownership; it does not simulate a remote endpoint
      or infer that a cancellation succeeded. Observation eligibility is reported independently and never
      serves as a terminal guard. Current-version and settled/accepted-transfer evidence are supplied; no
      callback race is executed.
    next: Human controls and reviews must obey the same current-state discipline.
  - part: C
    title: Pause is a control action; approval is a held proposal
    question: What exactly is paused or approved?
    goal: Predict which work can still complete after a control event and identify the conditions for dispatching
      a reviewed proposal.
    concept_ids:
    - v3_10_C
    coverage: Turn-boundary control; Approval escrow — bounded supplied-case policy comparison
    limitation: Pause, cancellation, and kill are not equivalent; none proves that an already dispatched external
      mutation stopped. Streaming control checkpoints and interruption latency are not varied; the review
      and control states are supplied evidence.
    next: The final part reserves enough resources to honor already-admitted work and close the task.
  - part: D
    title: A budget that can actually stop work
    question: Can this admission policy enforce the task budget?
    goal: Explain an admission or halt decision from a multi-dimensional resource record, including the duties
      after a halt.
    concept_ids:
    - v3_10_D
    coverage: Bounded-liability admission; Trajectory budget vector — bounded supplied-case policy comparison
    limitation: Boolean budget-fit evidence is supplied by the fixture, not a dollar forecast. No quantitative
      ceiling optimization is claimed. Operation ceilings and finalization reserves are not adjustable in
      this instrument.
    next: The next lab asks what happens to this control record when the worker crashes.
  core_concepts:
  - id: v3_10_A
    title: Who decides to continue
    source_concepts:
    - chapter: 10
      concept: Harness owns continuation
      concept_map: books/vol3/10_agent_harness/agent_harness_concepts.yml
    - chapter: 10
      concept: Trajectory record
      concept_map: books/vol3/10_agent_harness/agent_harness_concepts.yml
    source_anchor: sec-vol3-controlplane-acb
    learning_claim: A model that honors a pause or allowance with probability p per turn holds it over H turns
      only p^H of the time, so the decision to take another step belongs to a harness that treats every reply
      as an untrusted proposal. Supervision needs one authoritative per-trajectory control record, written
      only by the harness, holding contract, lifecycle state, accounting, grants, current invocations, the
      operation table, and a live plan.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare model-managed continuation with harness-owned continuation against the same proposals
      and operation records.
    student_action: Compare model-managed continuation with harness-owned admission on paused and active trajectory
      records.
    evidence_to_inspect: Authoritative record versus model narrative, admitted calls, unresolved operation
      table, and state transitions.
    explanation_prompt: Make the model summary accurate on one turn and stale on the next. Which enforcement
      mechanism remains necessary?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair reports that it is finished while a test is still running, then proposes another edit.
      briefing: One authoritative record holds contract, lifecycle, operations, grants, budget and live plan.
        The model reply is a proposal, not permission to change that record.
      fixed: Same repair goal, model replies, grants, operation evidence and completion criteria.
      feedback_rule: Explain which record field supports each decision; do not credit claimed completion without
        contract evidence.
      next: The next part challenges atomic transitions and outstanding obligations.
    policy_options: []
  - id: v3_10_B
    title: A late result still has an owner
    source_concepts:
    - chapter: 10
      concept: Guarded transitions
      concept_map: books/vol3/10_agent_harness/agent_harness_concepts.yml
    - chapter: 10
      concept: Settlement rule
      concept_map: books/vol3/10_agent_harness/agent_harness_concepts.yml
    source_anchor: sec-vol3-agent-harness-late-results
    learning_claim: The trajectory advances only along legal state-machine edges whose guards pass on a current
      record version, and admission commits atomically under the record lock before any request leaves the
      host (register before send). Withdrawing a result's eligibility to inform the model never clears the
      operation's obligation, and no trajectory reaches a terminal state until every obligation is settled
      or explicitly transferred.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Select an event ordering; compare atomic guarded admission with stale snapshot admission, then
      choose whether a late result is eligible for observation.
    student_action: Compare closing after observation withdrawal with current-record and settlement checks
      on the same terminal-transition proposals.
    evidence_to_inspect: Event sequence, record versions, successful or rejected guard, observation eligibility,
      reservation and residual owner.
    explanation_prompt: Change a late running status to a settled result, or remove the owner transfer acknowledgment.
      Reconsider terminal eligibility.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: 'Two events race: a test completes while an operator pauses the repair. A canceled result may
        no longer be eligible for context, but its charge remains.'
      briefing: The state graph declares legal edges and current-record guards. Observation eligibility and
        operation settlement are separate fields.
      fixed: Same operation identity, callback, operator request, record version, and settlement evidence.
      feedback_rule: Identify the exact edge admitted and obligations still open. Withdrawing output never
        silently erases its effect or liability.
      next: Human controls and reviews must obey the same current-state discipline.
    policy_options: []
  - id: v3_10_C
    title: Pause is a control action; approval is a held proposal
    source_concepts:
    - chapter: 10
      concept: Turn-boundary control
      concept_map: books/vol3/10_agent_harness/agent_harness_concepts.yml
    - chapter: 10
      concept: Approval escrow
      concept_map: books/vol3/10_agent_harness/agent_harness_concepts.yml
    source_anchor: sec-vol3-agent-harness-dispatch-rechecks
    learning_claim: Operator control takes effect at turn boundaries, so a harness that checks only when a
      reply ends lets one call postpone a pause by K_max x t_dec, and pause, interrupt, cancel, kill, and
      budget stop change admission differently. A proposal that requires review is held undispatched, bound
      by digest and expiry, and a favorable decision is one precondition rather than an order, so dispatch
      re-runs the full admission check and silence expires rather than denies.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare end-of-call versus streaming control checkpoints on a supplied trace; separately choose
      current, expired, or mutated approval case.
    student_action: Compare approval-only dispatch with live escrow, active-record, and current-admission
      checks on supplied review cases.
    evidence_to_inspect: Control request/effective boundary, quarantined partial output, held proposal, expiry
      and recheck verdict, outstanding jobs.
    explanation_prompt: Shorten the model response, then change the task grant after approval. Which earlier
      preference or dispatch decision changes?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: An operator pauses a long response while a review-required submission waits for approval.
      briefing: Pause, interrupt, cancel and kill change admission differently. A held proposal is undispatched;
        its digest, expiry and present permissions must still match when approval arrives.
      fixed: Same generated token trace, outstanding jobs, operator event, action bytes and initial task grant.
      feedback_rule: Show actual boundary delay from recorded timestamps only. Approval silence expires; favorable
        approval cannot override a pause or stale precondition.
      next: The final part reserves enough resources to honor already-admitted work and close the task.
    policy_options: []
  - id: v3_10_D
    title: A budget that can actually stop work
    source_concepts:
    - chapter: 10
      concept: Bounded-liability admission
      concept_map: books/vol3/10_agent_harness/agent_harness_concepts.yml
    - chapter: 10
      concept: Trajectory budget vector
      concept_map: books/vol3/10_agent_harness/agent_harness_concepts.yml
    source_anchor: sec-vol3-agent-harness-reservation-settlement
    learning_claim: A budget is an enforceable ceiling only if each operation is admitted when actual consumption
      plus outstanding reservations plus its worst-case liability plus a protected finalization reserve fits
      the allowance in every dimension. A runaway retry loop is locally compliant at every step, so the harness
      bounds turns, tokens, wall time, and dollars as one vector, reads the largest used fraction, and escalates
      through steer, restrict, and finalize.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare consumed-only accounting with reservation-aware admission; vary one supplied operation
      ceiling or finalization reserve at a time.
    student_action: Compare charged-consumption admission with reservation and protected-finalization checks
      on fixed liability cases.
    evidence_to_inspect: Dimension-by-dimension used/reserved/proposed/finalization ledger, binding dimension,
      admitted calls and remaining cleanup.
    explanation_prompt: Settle an uncertain job or make time the binding constraint instead of dollars. When
      does admission become possible?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The repair has nearly spent its allowance, and two asynchronous jobs could each be locally affordable
        but jointly exceed the ceiling.
      briefing: Admission counts actual use, outstanding reservation, worst-case additional liability, and
        a protected finalization reserve in each declared budget dimension.
      fixed: Same operation queue, measured usage, settlement events, task criteria and total allowance.
      feedback_rule: Identify the binding constraint and legitimate work foregone. Unknown additional liability
        cannot be converted to a safe zero; a halted task is not an accepted task.
      next: The next lab asks what happens to this control record when the worker crashes.
    policy_options: []
  primary_concept_dispositions:
  - concept: Harness owns continuation
    part: A
    disposition: bounded supplied-case investigation; The authoritative lifecycle state is supplied; the instrument
      does not execute a full harness reducer.
  - concept: Trajectory record
    part: A
    disposition: bounded supplied-case investigation; The authoritative lifecycle state is supplied; the instrument
      does not execute a full harness reducer.
  - concept: Guarded transitions
    part: B
    disposition: bounded supplied-case investigation; Observation eligibility is reported independently and
      never serves as a terminal guard. Current-version and settled/accepted-transfer evidence are supplied;
      no callback race is executed.
  - concept: Settlement rule
    part: B
    disposition: bounded supplied-case investigation; Observation eligibility is reported independently and
      never serves as a terminal guard. Current-version and settled/accepted-transfer evidence are supplied;
      no callback race is executed.
  - concept: Turn-boundary control
    part: C
    disposition: bounded supplied-case investigation; Streaming control checkpoints and interruption latency
      are not varied; the review and control states are supplied evidence.
  - concept: Approval escrow
    part: C
    disposition: bounded supplied-case investigation; Streaming control checkpoints and interruption latency
      are not varied; the review and control states are supplied evidence.
  - concept: Bounded-liability admission
    part: D
    disposition: bounded supplied-case investigation; Operation ceilings and finalization reserves are not
      adjustable in this instrument.
  - concept: Trajectory budget vector
    part: D
    disposition: bounded supplied-case investigation; Operation ceilings and finalization reserves are not
      adjustable in this instrument.
  model_support:
    existing:
    - Agents.Coding.SWE_Bench_Runner.max_trajectory_steps supplies a reference horizon; Agents.Remediation.OnCall
      supplies workload context.
    required:
    - 'MLSysIM deterministic harness state-machine trace reducer: current-version guards, operation obligations,
      approval states, reservations and multi-dimensional admission.'
    - Control-latency and dollars require canonical serving/cost observations; do not invent token latency,
      liability ceilings, or success distributions.
