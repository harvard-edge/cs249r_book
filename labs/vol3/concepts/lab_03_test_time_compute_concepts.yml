  model_support:
    existing:
    - Agents.Deliberation.TreeSearch provides reference profile only
    - Agents.Coding.SWE_Bench_Runner and Literature registries provide canonical context/provenance
    missing:
    - Shared candidate-pool/selector/verifier fixture engine with actual selected-set labels
    - Canonical independent-pool coverage and Bayes verifier-precision helpers
    - Bounded search ledger and dependency-plan invalidation trace engine
    boundary: No ad hoc effective pool size or synthetic accuracy curve. Independence coverage is explicitly
      analytical; empirical selection and adaptive-search results require labeled recorded pools and tool-check
