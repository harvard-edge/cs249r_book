lab_concept_map:
  schema_version: 1
  lab_id: v3_03
  chapter: 3
  title: Test-Time Compute
  source_notebook: labs/vol3/lab_03_test_time_compute.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded reference investigations; not live-agent validation
  source_chapter_concept_map: books/vol3/03_test_time_compute/test_time_compute_concepts.yml
  source_chapter: books/vol3/03_test_time_compute/03_test_time_compute.qmd
  chapter_goal: Choose a bounded deliberation policy, explain what evidence it adds, and defend when to
    abstain.
  student_goals:
  - Compare allocations under the same ceilings and explain what each can establish.
  - Diagnose whether failure came from missing candidates or choosing/accepting the wrong one.
  - Explain a pass using the correct denominator and test whether search changes checker behavior.
  - Identify affected descendants, retain independently supported work and justify the next bounded step.
  narrative:
    situation: The first candidate blames timeouts, but a lost notification could explain the same stalled
      client. The team has a bounded budget to learn more.
    previously: The supplied model-call interface lets the team request proposals and inspect their outcomes.
    next: 'Next: preserve the resulting evidence without losing the repair’s state across turns.'
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: Buy the next kind of work
    question: Where should the next deliberation budget go?
    goal: Compare a supplied further-deliberation trace with an observation-guided revision and identify
      the added evidence.
    concept_ids:
    - v3_03_A
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      No ad hoc effective pool size or synthetic accuracy curve. Independence coverage is explicitly analytical;
      empirical selection and adaptive-search results require labeled recorded pools and tool-check observations.
    next: If the budget buys a pool, inspect how a candidate is selected.
  - part: B
    title: A good candidate is not a returned repair
    question: Will the selector return a valid candidate?
    goal: Diagnose whether failure came from missing candidates or choosing/accepting the wrong one.
    concept_ids:
    - v3_03_B
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      No ad hoc effective pool size or synthetic accuracy curve. Independence coverage is explicitly analytical;
      empirical selection and adaptive-search results require labeled recorded pools and tool-check observations.
    next: A passing checker now needs a base-rate and selection-pressure audit.
  - part: C
    title: Stress the verifier
    question: Can the verifier survive stronger selection pressure?
    goal: Explain how selected candidates expose a checker blind spot, and why this case cannot estimate
      verifier precision.
    concept_ids:
    - v3_03_C
    coverage: A deterministic policy/evidence trace investigates the named decision. It is not a complete
      numerical instrument for every grouped chapter concept.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      No ad hoc effective pool size or synthetic accuracy curve. Independence coverage is explicitly analytical;
      empirical selection and adaptive-search results require labeled recorded pools and tool-check observations.
    next: The remaining budget should revise only work whose support was lost.
  - part: D
    title: Revise from a refuting observation
    question: Which evidence must change after a refutation?
    goal: Identify affected descendants, retain independently supported work and justify the next bounded
      step.
    concept_ids:
    - v3_03_D
    coverage: Fixed dependency-graph traces contrast ignoring step-level refutation, scoped descendant
      invalidation, and blanket pruning that discards independently supported work. No learned scorer
      or pruning-rate model is supplied.
    limitation: Fixed authored counterfactual traces; no numerical parameter sweep or live execution.
      No ad hoc effective pool size or synthetic accuracy curve. Independence coverage is explicitly analytical;
      empirical selection and adaptive-search results require labeled recorded pools and tool-check observations.
    next: Carry supported facts, open hypotheses and spent budget into Context Engineering.
  core_concepts:
  - id: v3_03_A
    title: Buy the next kind of work
    source_concepts:
    - chapter: 3
      concept: Allocation axes
      concept_map: books/vol3/03_test_time_compute/test_time_compute_concepts.yml
    - chapter: 3
      concept: Budgeted deliberation
      concept_map: books/vol3/03_test_time_compute/test_time_compute_concepts.yml
    source_anchor: sec-vol3-test-time-compute-computation-allocation
    learning_claim: Depth, breadth, and feedback can spend the same output ceiling yet differ in critical
      path, retained KV state, and bill, and only feedback adds information the prompt and weights lack.
      Test-time compute is a per-decision allowance that sets the attempt cost in C_eff, so it pays only
      when it raises acceptance faster than cost, and difficulty should route the budget.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Allocate the supplied output ceiling to depth, breadth or a feedback loop and compare recorded
      task traces.
    student_action: Allocate the supplied output ceiling to depth, breadth or a feedback loop and compare
      recorded task traces.
    evidence_to_inspect: Actual tokens, check observations, critical path, peak live state, acceptance
      and attempt cost.
    explanation_prompt: Use a fixture with a costly uninformative diagnostic or a genuinely useful deeper
      derivation and reconsider allocation.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The stalled waiter admits two diagnoses. The team can extend one derivation, branch into
        candidates or run a diagnostic.
      briefing: Read depth, breadth and feedback and their critical paths. Extra generation revisits supplied
        information; a tool observation can add evidence.
      fixed: Model revision, task instances, permissions, output ceiling, check ceiling and wall-clock
        deadline.
      feedback_rule: Report complete traces, including unfinished attempts and unused budget. Do not invent
        diagnostic information for a depth/breadth-only run.
      next: If the budget buys a pool, inspect how a candidate is selected.
    policy_options:
    - id: policy_1
      label: One deeper generation
    - id: policy_2
      label: Several independent candidates
    - id: policy_3
      label: Diagnostic-feedback revision
  - id: v3_03_B
    title: A good candidate is not a returned repair
    source_concepts:
    - chapter: 3
      concept: Coverage is not selection
      concept_map: books/vol3/03_test_time_compute/test_time_compute_concepts.yml
    - chapter: 3
      concept: Ranking is not acceptance
      concept_map: books/vol3/03_test_time_compute/test_time_compute_concepts.yml
    source_anchor: sec-vol3-test-time-compute-candidate-diversity
    learning_claim: pass@k = 1-(1-p)^k caps any selector that returns an unchanged pool member, while
      realized accuracy is set by the selector, so coverage near 98 percent can coexist with a vote that
      plateaus near half. Voting and learned ranking both return the best failure from a defective pool,
      so only selection by a check the candidate cannot modify justifies returning a candidate instead
      of abstaining.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Hold the recorded pool fixed and compare vote, learned ranking and task-specific checked
      selection.
    student_action: Hold the recorded pool fixed and compare vote, learned ranking and task-specific checked
      selection.
    evidence_to_inspect: Pool has-valid indicator, selected identity, check verdict, external label, abstentions
      and selection cost.
    explanation_prompt: Replay an all-invalid pool and identify which policy still returns an unsupported
      repair.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: One candidate pool contains a good repair, but its most popular answer still extends the
        timeout.
      briefing: Distinguish pool coverage, selector output and external acceptance; abstention is an allowed
        disposition.
      fixed: Same candidate identities and independent sealed labels, same checker and resource limits.
      feedback_rule: Show whether coverage or selection failed. Ranking returns a best member even when
        all fail; a checked selection may abstain and is only as strong as its check.
      next: A passing checker now needs a base-rate and selection-pressure audit.
    policy_options:
    - id: policy_1
      label: Majority selection
    - id: policy_2
      label: Learned-score ranking
    - id: policy_3
      label: Task-specific checked selection with abstention
  - id: v3_03_C
    title: Stress the verifier
    source_concepts:
    - chapter: 3
      concept: Verifier precision
      concept_map: books/vol3/03_test_time_compute/test_time_compute_concepts.yml
    - chapter: 3
      concept: Selection pressure
      concept_map: books/vol3/03_test_time_compute/test_time_compute_concepts.yml
    source_anchor: sec-vol3-test-time-compute-verification
    learning_claim: The precision of a passing verdict depends on the valid-candidate base rate and the
      check's error rates, not on pool size, so a larger pool raises both the chance of a selection and
      the chance of a false pass. Argmax over N noisy scores selects positive error growing like sigma*sqrt(2
      ln N) and crowns any exploit present in the pool, so check accuracy must be re-measured on selected
      candidates.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: First vary the declared base rate in the analytic reference at fixed checker rates; then
      compare recorded modest and aggressive search pools.
    student_action: First vary the declared base rate in the analytic reference at fixed checker rates;
      then compare recorded modest and aggressive search pools.
    evidence_to_inspect: Analytical passing-set precision, false passes, selected candidate labels, measured
      selected-set defect rate and search cost.
    explanation_prompt: Use a low-base-rate pool or an exploit-heavy selected subset and decide whether
      to strengthen checking or abstain.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: Searching harder finds patches that exploit an incomplete regression check.
      briefing: Read valid-candidate base rate, false acceptance/rejection and the difference between
        preselection and selected-set error.
      fixed: Analytic rates fixed within the base-rate experiment; empirical checker version, hidden acceptance
        labels and task contract fixed across search policies.
      feedback_rule: Keep analytical assumptions and empirical selected-set evidence separate. Never substitute
        pool size for verifier precision or assume calibrated rates survive adaptive optimization.
      next: The remaining budget should revise only work whose support was lost.
    policy_options:
    - id: policy_1
      label: Keep current verifier and modest pool
    - id: policy_2
      label: Increase search under same verifier
    - id: policy_3
      label: Stronger independent verification with smaller pool
  - id: v3_03_D
    title: Revise from a refuting observation
    source_concepts:
    - chapter: 3
      concept: Step-level evidence
      concept_map: books/vol3/03_test_time_compute/test_time_compute_concepts.yml
    - chapter: 3
      concept: Revisable candidate plans
      concept_map: books/vol3/03_test_time_compute/test_time_compute_concepts.yml
    source_anchor: sec-vol3-test-time-compute-planning-revision
    learning_claim: Outcome checks execute a finished candidate while reward models only predict quality,
      and step checks prune failing branches early at the cost of false rejections and scorer input that
      grows quadratically without prefix reuse. Recording a candidate as a dependency graph of artifacts
      with evidence provenance lets a refuting observation invalidate exactly its descendants while retained
      branches keep their support.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not
      assumed.
    tradeoff: Choose retain-all, regenerate-all or dependency-scoped revision; compare an outcome-only
      with a step-check trace under hard limits.
    student_action: Choose retain-all, regenerate-all or dependency-scoped revision; compare an outcome-only
      with a step-check trace under hard limits.
    evidence_to_inspect: Invalidated artifacts, retained evidence, checked revision, work already spent,
      reservation ledger and accepted/unresolved stop status.
    explanation_prompt: Add a dependency from a retained artifact to the refuted diagnosis, or increase
      step false rejection, and inspect the revised decision.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A controlled notification test refutes the timeout diagnosis, but API compatibility checks
        remain valid.
      briefing: Read the candidate dependency graph and observation scope. A step check may prune early
        but may also reject a useful branch.
      fixed: Same refuting observation, candidate dependencies, scoped check definitions, workspace isolation
        and admission ceilings.
      feedback_rule: Compute invalidation from explicit edges; charge discarded work and checks. Hard
        ceiling precedes acceptance or marginal stopping; exhaustion cannot relax the acceptance threshold.
      next: Carry supported facts, open hypotheses and spent budget into Context Engineering.
    policy_options:
    - id: policy_1
      label: Retain whole plan
    - id: policy_2
      label: Regenerate whole plan
    - id: policy_3
      label: Regenerate dependency descendants
