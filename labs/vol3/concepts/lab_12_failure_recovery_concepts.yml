lab_concept_map:
  schema_version: 1
  lab_id: v3_12
  chapter: 12
  title: Failure Recovery
  source_notebook: labs/vol3/lab_12_failure_recovery.py
  shared_contract: ../../vol1/concepts/schema.yml
  status: chapter-grounded bounded policy investigations; broader mechanisms explicitly scoped
  source_chapter_concept_map: books/vol3/12_failure_recovery/failure_recovery_concepts.yml
  source_chapter: books/vol3/12_failure_recovery/12_failure_recovery.qmd
  chapter_goal: Choose a recovery route that contains partial effects and preserves a defensible task outcome.
  student_goals:
  - Identify a residual duty after an uncertain external effect and determine when its recovery contract must
    be recorded.
  - Choose a permitted recovery action and advance independent cleanup without bypassing unresolved dependencies.
  - Use supplied evidence to choose repair or fallback and identify checks that can run before an irreversible
    commitment.
  - Distinguish activity from task progress and choose a containment response that preserves required settlement.
  narrative:
    situation: The repair workspace is restored to revision 18, but the earlier test still has no known
      result. A temporary integration environment may also have been created by an outside service.
      Decide what to retry, what to investigate, and what still needs cleanup.
    previously: The supplied recovery has restored known state while keeping unresolved tool outcomes visibly unknown.
    next: A settled recovery still does not prove the patch fixes the bug. The next lab grades exact candidate
      artifacts and compares policies on controlled tasks.
    submission: One integrated decision discussion supported by scoped saved comparisons, including changed
      and held conditions, mechanism, competing consequence, unresolved evidence, and a reversal condition.
  runtime_parts:
  - part: A
    title: An external effect creates a duty
    question: What duty remains after an external effect?
    goal: Identify a residual duty after an uncertain external effect and determine when its recovery contract
      must be recorded.
    concept_ids:
    - v3_12_A
    coverage: Compensation; Trajectory saga — bounded supplied-case policy comparison
    limitation: Compensation can fail or be unavailable; no perfect rollback or global transaction is assumed.
      Registration timing and compensator outcome are supplied facts; no external compensation is executed.
    next: Multiple duties form dependencies; next choose which can progress safely.
  - part: B
    title: Evidence before recovery preference
    question: Which recovery route does the evidence permit?
    goal: Choose a permitted recovery action and advance independent cleanup without bypassing unresolved
      dependencies.
    concept_ids:
    - v3_12_B
    coverage: Cleanup graph; Recovery decision order — bounded supplied-case policy comparison
    limitation: The supplied cleanup graph is complete by assumption; hidden dependencies invalidate its concurrency
      claim. Dependency readiness is supplied Boolean evidence for these independent proposals. This instrument
      does not derive readiness by executing a cleanup DAG or discover hidden dependencies. Cleanup readiness
      is supplied for independent proposals; there is no executable DAG scheduler or selectable recovery evidence
      card.
    next: For admissible recovery choices, the next part weighs repair against rebuilding before crossing
      a commitment boundary.
  - part: C
    title: Repair before crossing the pivot
    question: Can the repair remain reversible?
    goal: Use supplied evidence to choose repair or fallback and identify checks that can run before an irreversible
      commitment.
    concept_ids:
    - v3_12_C
    coverage: Repair break-even; Commitment regions — bounded supplied-case policy comparison
    limitation: Repair probability, time, and dollar costs are unknown here; the analytical break-even comparison
      needs measured inputs and must assess time and dollars separately. This instrument identifies missing
      repair evidence; it does not compare bounded-repair and rebuild costs or move checks around a pivot.
    next: The final part detects unproductive activity and holds further work while existing duties settle.
  - part: D
    title: Busy is not progress
    question: Is continued activity making useful progress?
    goal: Distinguish activity from task progress and choose a containment response that preserves required
      settlement.
    concept_ids:
    - v3_12_D
    coverage: Semantic watchdog; Incident containment — bounded supplied-case policy comparison
    limitation: The projection and finite observation window are declared; semantic progress outside the projection
      may be missed. No optimal detection delay is inferred. The progress window and incident hold are fixed;
      no watchdog window or separate cleanup execution is selectable.
    next: The next lab tests whether the recovered exact candidate meets its task acceptance contract.
  core_concepts:
  - id: v3_12_A
    title: An external effect creates a duty
    source_concepts:
    - chapter: 12
      concept: Compensation
      concept_map: books/vol3/12_failure_recovery/failure_recovery_concepts.yml
    - chapter: 12
      concept: Trajectory saga
      concept_map: books/vol3/12_failure_recovery/failure_recovery_concepts.yml
    source_anchor: sec-vol3-failure-recovery-obligation-registration
    learning_claim: An external service and the runtime log share no atomic commit, so an established effect
      is remediated only by a separately committed forward operation that restores declared postconditions,
      not the past. A trajectory saga durably registers each effectful step's cleanup template before dispatch,
      not after the step returns, so a crash never leaves an effect without its compensator.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare registering cleanup before dispatch with registering only after acknowledgment; select
      an observed provisioned, absent, or uncertain endpoint outcome.
    student_action: Compare effect-known closure with preregistered cleanup and verified compensation postconditions
      on supplied partial-effect cases.
    evidence_to_inspect: Obligation registration order, endpoint identity or unresolved lookup, compensator
      admission, historical charges and remaining postconditions.
    explanation_prompt: Lose the resource ID reply or fail the cleanup call. Which duty survives, and who
      can own it?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: Provisioning may have created env_r18_01 even though its acknowledgment was lost. The local database
        cannot undo the remote environment.
      briefing: A compensator is a new forward operation that restores a named postcondition, not the past.
        Its template and scope must exist before a possibly effectful dispatch.
      fixed: Same provisioning request, cleanup postcondition, grant, lost-reply event and durable-intent
        policy.
      feedback_rule: Keep uncertain provisioning uncertain until evidence settles it. A successful cleanup
        can stop future billing without erasing prior cost or historical effects.
      next: Multiple duties form dependencies; next choose which can progress safely.
    policy_options: []
  - id: v3_12_B
    title: Evidence before recovery preference
    source_concepts:
    - chapter: 12
      concept: Cleanup graph
      concept_map: books/vol3/12_failure_recovery/failure_recovery_concepts.yml
    - chapter: 12
      concept: Recovery decision order
      concept_map: books/vol3/12_failure_recovery/failure_recovery_concepts.yml
    source_anchor: sec-vol3-failure-recovery-recovery-actions
    learning_claim: Recovery order is a DAG of admitted cleanup operations rather than a reverse stack, and
      an unresolved node blocks only its transitive dependents. Transport retry, fresh proposal, feedback
      repair, compensation, and hold or escalate are chosen by evidence class first, then admission, then
      expected cost.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Choose a recovery response for supplied pre-dispatch rejection, definite failure, or uncertain-effect
      cards; schedule ready cleanup nodes or hold blocked ones.
    student_action: Compare immediate preferred recovery with evidence-classification, dependency-readiness,
      and grant checks.
    evidence_to_inspect: Action eligibility, ready/blocked DAG nodes, remaining obligations, and supplied
      costs only after admission.
    explanation_prompt: Settle the uncertain effect or remove a dependency after proof. Which new actions
      become available?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: A test configuration is rejected before dispatch while another operation remains in doubt. One
        cleanup branch is blocked, but an independent branch is ready.
      briefing: Recovery distinguishes transport retry, fresh proposal, bounded feedback repair, compensation,
        and hold. Evidence class and admission precede cost; cleanup is a dependency graph.
      fixed: Same operation evidence, grants, dependency edges and declared postconditions; do not change
        evidence to justify a cheaper option.
      feedback_rule: Name the evidence that permits the response; block only transitive dependents of an unresolved
        cleanup node. Cheapest inadmissible recovery is not a candidate.
      next: For admissible recovery choices, the next part weighs repair against rebuilding before crossing
        a commitment boundary.
    policy_options: []
  - id: v3_12_C
    title: Repair before crossing the pivot
    source_concepts:
    - chapter: 12
      concept: Repair break-even
      concept_map: books/vol3/12_failure_recovery/failure_recovery_concepts.yml
    - chapter: 12
      concept: Commitment regions
      concept_map: books/vol3/12_failure_recovery/failure_recovery_concepts.yml
    source_anchor: sec-vol3-failure-recovery-repair-vs-rebuild
    learning_claim: One bounded repair attempt beats immediate unwind-and-rebuild iff its measured success
      rate exceeds p* = C_repair / C_fallback, evaluated separately in time and dollars. Reversibility is
      relative to a subsystem and a grant, so a plan is organized into compensable preparation, a single pivot,
      and owned follow-up duties, with every check that can precede the pivot hoisted ahead of it.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Select bounded repair or unwind-and-rebuild against the supplied cohort; then move a required
      validation check before or after the named pivot.
    student_action: Compare confidence-led commitment with precheck, repair-evidence, and pivot-grant checks
      on fixed proposals.
    evidence_to_inspect: Observed repair successes/eligible attempts, repair/fallback cost in each dimension,
      pre-pivot checks and owned follow-up duties.
    explanation_prompt: Raise fallback cost using a supplied alternative fixture or narrow compensation authority.
      When does the choice or commitment boundary change?
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The temporary environment is ready, but its test configuration needs a bounded repair. A later
        publication cannot be recalled by this task grant.
      briefing: Observed repair outcomes and costs support a break-even comparison separately in time and
        dollars. Preparation, pivot, and follow-up define the local commitment region.
      fixed: Same accepted outcome, repair attempt limit, measured cohort, fallback scope and current authority.
      feedback_rule: Report when time and dollars support different choices and when evidence is insufficient.
        Passing a cost threshold cannot authorize an unapproved irreversible action.
      next: The final part detects unproductive activity and holds further work while existing duties settle.
    policy_options: []
  - id: v3_12_D
    title: Busy is not progress
    source_concepts:
    - chapter: 12
      concept: Semantic watchdog
      concept_map: books/vol3/12_failure_recovery/failure_recovery_concepts.yml
    - chapter: 12
      concept: Incident containment
      concept_map: books/vol3/12_failure_recovery/failure_recovery_concepts.yml
    source_anchor: sec-vol3-failure-recovery-progress-evidence
    learning_claim: A looping trajectory is hyperactive, not dead, so a watchdog compares a declared task
      projection, verifier results, and repeated action-outcome pairs over a bounded window, and its window
      sets detection latency. On suspicion, fail-safe defaults hold the trajectory at every dispatch boundary
      without the agent's cooperation while preregistered cleanup runs under a separate narrow grant until
      residual obligations settle.
    misconception: Use the supplied contrast to test the proposed policy; the preferred policy is not assumed.
    tradeoff: Compare heartbeat-only monitoring with a projection-based watchdog; vary its supplied window,
      then choose hold-only or hold-plus-authorized-cleanup under the incident policy.
    student_action: Compare heartbeat-only health with progress-projection and dispatch-hold checks on fixed
      loop and incident cases.
    evidence_to_inspect: Repeated projections, detection point, useful work interrupted, remaining effects,
      held admissions and cleanup decisions.
    explanation_prompt: Add a productive multi-step edit that temporarily repeats a test, or keep an unresolved
      external job after the hold. Reassess false interruption and finalization.
    assessment: Explain changed and held conditions, the mechanism, the competing consequence, the evidence
      limit, and a condition that reverses your choice.
    scope: chapter-owned controlled investigation
    narrative:
      scene: The agent alternates two edits and repeats the same failing check. Later it proposes sending
        private fixture data through package search.
      briefing: A declared task projection and bounded observation window expose repeated action/outcome pairs.
        A containment hold blocks model-directed dispatch while separate narrow cleanup remains accountable.
      fixed: Same trace, progress projection, violation evidence, operation obligations and cleanup grants.
      feedback_rule: Identify actual observed lack of progress or violation, not inferred compromise. Detection
        latency uses recorded events; cleanup cannot borrow the model-directed task grant implicitly.
      next: The next lab tests whether the recovered exact candidate meets its task acceptance contract.
    policy_options: []
  primary_concept_dispositions:
  - concept: Compensation
    part: A
    disposition: bounded supplied-case investigation; Registration timing and compensator outcome are supplied
      facts; no external compensation is executed.
  - concept: Trajectory saga
    part: A
    disposition: bounded supplied-case investigation; Registration timing and compensator outcome are supplied
      facts; no external compensation is executed.
  - concept: Cleanup graph
    part: B
    disposition: bounded supplied-case investigation; Cleanup readiness is supplied for independent proposals;
      there is no executable DAG scheduler or selectable recovery evidence card.
  - concept: Recovery decision order
    part: B
    disposition: bounded supplied-case investigation; Cleanup readiness is supplied for independent proposals;
      there is no executable DAG scheduler or selectable recovery evidence card.
  - concept: Repair break-even
    part: C
    disposition: bounded supplied-case investigation; This instrument identifies missing repair evidence;
      it does not compare bounded-repair and rebuild costs or move checks around a pivot.
  - concept: Commitment regions
    part: C
    disposition: bounded supplied-case investigation; This instrument identifies missing repair evidence;
      it does not compare bounded-repair and rebuild costs or move checks around a pivot.
  - concept: Semantic watchdog
    part: D
    disposition: bounded supplied-case investigation; The progress window and incident hold are fixed; no
      watchdog window or separate cleanup execution is selectable.
  - concept: Incident containment
    part: D
    disposition: bounded supplied-case investigation; The progress window and incident hold are fixed; no
      watchdog window or separate cleanup execution is selectable.
  model_support:
    existing:
    - Agents.Remediation.OnCall and Agents.Support.CustomerOps are canonical workload profiles; chapter uses
      MLSysIM units/formatters for repair cost and loop-cost cells.
    required:
    - MLSysIM partial-effect and cleanup-DAG fixtures with pre-registered obligation templates, independent
      operation identity, postconditions and narrow cleanup grants.
    - Repair-break-even comparisons require supplied measured repair success observations and explicit fallback
      cost in time/dollars; never synthesize a success rate from a knob.
