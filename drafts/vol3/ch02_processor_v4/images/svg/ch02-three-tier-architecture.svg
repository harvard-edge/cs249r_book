<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>

  <!-- TITLE BAR -->
  <text x="480" y="32" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="-0.2">Three-Tier Machine Learning Systems Architecture</text>
  <text x="480" y="50" font-size="11" fill="#64748b" text-anchor="middle">Physical privilege boundaries and execution separation in agent runtimes</text>

  <!-- TIER 1: HOST AGENT RUNTIME -->
  <g transform="translate(40, 70)" filter="url(#cardShadow)">
    <rect width="880" height="102" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.75"/>
    <rect width="880" height="28" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.75"/>
    <rect width="880" height="10" y="18" fill="#eff6ff"/>
    
    <text x="20" y="19" font-size="12" font-weight="700" fill="#1d4ed8">TIER 1: HOST AGENT RUNTIME</text>
    <text x="220" y="19" font-size="10" font-weight="600" fill="#2563eb">[Host User Space • Authoritative Supervisor • Ring 3]</text>
    <text x="860" y="19" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="end">Privilege: Host Ambient Authority</text>

    <!-- Content Blocks inside Tier 1 -->
    <g transform="translate(20, 38)">
      <rect width="260" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#0f172a">Context &amp; Budget Manager</text>
      <text x="12" y="36" font-size="9.5" fill="#64748b">Prompt staging, S_max headroom, pruning</text>
    </g>

    <g transform="translate(310, 38)">
      <rect width="260" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#0f172a">Verification &amp; Security Monitor</text>
      <text x="12" y="36" font-size="9.5" fill="#64748b">Memory escrow, status traps, invariant checks</text>
    </g>

    <g transform="translate(600, 38)">
      <rect width="260" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#0f172a">Tool Actuation &amp; Sandbox Dispatch</text>
      <text x="12" y="36" font-size="9.5" fill="#64748b">MicroVM syscalls, MCP RPC, rollback ledger</text>
    </g>
  </g>

  <!-- INTERCONNECT BUS 1: Network / RPC Transport -->
  <g transform="translate(480, 172)">
    <!-- Down Arrow: Request -->
    <line x1="-150" y1="0" x2="-150" y2="36" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="-160" y="22" font-size="9.5" font-weight="600" fill="#0284c7" text-anchor="end">Typed RPC Request R</text>

    <!-- Up Arrow: Candidate Envelope -->
    <line x1="150" y1="36" x2="150" y2="0" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <text x="160" y="22" font-size="9.5" font-weight="600" fill="#d97706" text-anchor="start">Status Envelope &amp; Tokens</text>

    <!-- Boundary Badge -->
    <rect x="-120" y="9" width="240" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="23" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Network / IPC Boundary (HTTP/2 • gRPC)</text>
  </g>

  <!-- TIER 2: INFERENCE SERVICE DAEMON -->
  <g transform="translate(40, 208)" filter="url(#cardShadow)">
    <rect width="880" height="102" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.75"/>
    <rect width="880" height="28" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.75"/>
    <rect width="880" height="10" y="18" fill="#f0f9ff"/>
    
    <text x="20" y="19" font-size="12" font-weight="700" fill="#0369a1">TIER 2: INFERENCE SERVICE DAEMON</text>
    <text x="260" y="19" font-size="10" font-weight="600" fill="#0284c7">[vLLM / SGLang / TensorRT-LLM • System Daemon]</text>
    <text x="860" y="19" font-size="10" font-weight="700" fill="#0369a1" text-anchor="end">Privilege: Host System Service</text>

    <!-- Content Blocks inside Tier 2 -->
    <g transform="translate(20, 38)">
      <rect width="260" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#0f172a">Continuous Batching Scheduler</text>
      <text x="12" y="36" font-size="9.5" fill="#64748b">Iteration-level prefill &amp; decode queues</text>
    </g>

    <g transform="translate(310, 38)">
      <rect width="260" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#0f172a">Paged Attention Memory Manager</text>
      <text x="12" y="36" font-size="9.5" fill="#64748b">Logical-to-physical block tables &amp; radix trees</text>
    </g>

    <g transform="translate(600, 38)">
      <rect width="260" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#0f172a">Decode Logit Masking Engine</text>
      <text x="12" y="36" font-size="9.5" fill="#64748b">Byte-DFA pushdown automata validation</text>
    </g>
  </g>

  <!-- INTERCONNECT BUS 2: PCIe / NVLink Interconnect -->
  <g transform="translate(480, 310)">
    <!-- Down Arrow: Kernel Launch -->
    <line x1="-150" y1="0" x2="-150" y2="36" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="-160" y="22" font-size="9.5" font-weight="600" fill="#475569" text-anchor="end">CUDA Kernel Launch &amp; Prompt Tokens</text>

    <!-- Up Arrow: Sampled Token ID -->
    <line x1="150" y1="36" x2="150" y2="0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="160" y="22" font-size="9.5" font-weight="600" fill="#475569" text-anchor="start">Sampled Token ID y_t</text>

    <!-- Boundary Badge -->
    <rect x="-120" y="9" width="240" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="23" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">PCIe Gen5 / NVLink Interconnect</text>
  </g>

  <!-- TIER 3: NEURAL CORE (ACCELERATOR SILICON) -->
  <g transform="translate(40, 346)" filter="url(#cardShadow)">
    <rect width="880" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.75"/>
    <rect width="880" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.75"/>
    <rect width="880" height="10" y="18" fill="#1e293b"/>
    
    <text x="20" y="19" font-size="12" font-weight="700" fill="#38bdf8">TIER 3: NEURAL CORE (ACCELERATOR SILICON)</text>
    <text x="310" y="19" font-size="10" font-weight="500" fill="#94a3b8">[NVIDIA H100 / B200 / TPU v5p • Raw Silicon Compute Units]</text>
    <text x="860" y="19" font-size="10" font-weight="700" fill="#ef4444" text-anchor="end">Privilege: Zero Ambient Authority (A = 0)</text>

    <!-- Content Blocks inside Tier 3 -->
    <g transform="translate(20, 38)">
      <rect width="260" height="58" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#f8fafc">Tensor Processing Cores</text>
      <text x="12" y="36" font-size="9.5" fill="#94a3b8">GEMM (Prefill) &amp; GEMV (Decode)</text>
      <text x="12" y="50" font-size="8.5" fill="#38bdf8">Arithmetic intensity I in [1, 150] FLOPs/Byte</text>
    </g>

    <g transform="translate(310, 38)">
      <rect width="260" height="58" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#f8fafc">Static Parameter Weights Θ</text>
      <text x="12" y="36" font-size="9.5" fill="#94a3b8">High-Bandwidth Memory (HBM3 / HBM3e)</text>
      <text x="12" y="50" font-size="8.5" fill="#38bdf8">Bus bandwidth floor: β_eff ≈ 3.35 TB/s</text>
    </g>

    <g transform="translate(600, 38)">
      <rect width="260" height="58" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#f8fafc">On-Chip Sampling &amp; KV Cache</text>
      <text x="12" y="36" font-size="9.5" fill="#94a3b8">Logit softmax &amp; temperature sampling</text>
      <text x="12" y="50" font-size="8.5" fill="#38bdf8">Direct row-gather: Offset(t) = t · d_model · b</text>
    </g>
  </g>
</svg>
