<text x="318" y="213" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">memory bandwidth</text>
<circle cx="468" cy="209" r="3" fill="#1F407A"/>
<text x="478" y="213" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">network and power</text>
<circle cx="628" cy="209" r="3" fill="#581C87"/>
<text x="638" y="213" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">context and tool</text>
<text x="638" y="228" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">latency</text>
<circle cx="788" cy="209" r="3" fill="#1A4D3E"/>
<text x="798" y="213" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">physics and the</text>
<text x="798" y="228" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">control rate</text>
<line x1="40" y1="266" x2="940" y2="266" stroke="#D9DCE1" stroke-width="1"/>
<text x="40" y="298" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="start" letter-spacing="0">What moves</text>
<circle cx="308" cy="293" r="3" fill="#A51C30"/>
<text x="318" y="297" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">tensors</text>
<circle cx="468" cy="293" r="3" fill="#1F407A"/>
<text x="478" y="297" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">gradients and</text>
<text x="478" y="312" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">checkpoints</text>
<circle cx="628" cy="293" r="3" fill="#581C87"/>
<text x="638" y="297" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">trajectories</text>
<circle cx="788" cy="293" r="3" fill="#1A4D3E"/>
<text x="798" y="297" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">torque</text>
<line x1="40" y1="350" x2="940" y2="350" stroke="#D9DCE1" stroke-width="1"/>
<text x="40" y="382" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="start" letter-spacing="0">How it fails</text>
<circle cx="308" cy="377" r="3" fill="#A51C30"/>
<text x="318" y="381" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">a slow kernel</text>
<circle cx="468" cy="377" r="3" fill="#1F407A"/>
<text x="478" y="381" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">a stalled rank</text>
<circle cx="628" cy="377" r="3" fill="#581C87"/>
<text x="638" y="381" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">a wrong action taken</text>
<circle cx="788" cy="377" r="3" fill="#1A4D3E"/>
<text x="798" y="381" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">matter is damaged</text>
<line x1="40" y1="434" x2="940" y2="434" stroke="#D9DCE1" stroke-width="1"/>
<text x="40" y="466" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="start" letter-spacing="0">What it must prove</text>
<circle cx="308" cy="461" r="3" fill="#A51C30"/>
<text x="318" y="465" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">accuracy</text>
<circle cx="468" cy="461" r="3" fill="#1F407A"/>
<text x="478" y="465" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">utilisation and cost</text>
<circle cx="628" cy="461" r="3" fill="#581C87"/>
<text x="638" y="465" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">the action was</text>
<text x="638" y="480" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">permitted</text>
<circle cx="788" cy="461" r="3" fill="#1A4D3E"/>
<text x="798" y="465" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">the machine may</text>
<text x="798" y="480" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">operate</text>
</svg>
