<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img">
<rect x="0" y="0" width="980" height="560" rx="0" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="40" y="46" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="25" fill="#1A1A1A" font-weight="600" text-anchor="start" letter-spacing="0">Four volumes, one set of questions</text>
<text x="40" y="70" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="start" letter-spacing="0">The questions do not change as you move up the series. Only the answers do.</text>
<rect x="300" y="68" width="150" height="30" rx="2" fill="#A51C30" fill-opacity="0.1" stroke="none" stroke-width="0"/>
<text x="375.0" y="88" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="13" fill="#A51C30" font-weight="600" text-anchor="middle" letter-spacing="0">Volume I</text>
<rect x="460" y="68" width="150" height="30" rx="2" fill="#1F407A" fill-opacity="0.1" stroke="none" stroke-width="0"/>
<text x="535.0" y="88" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="13" fill="#1F407A" font-weight="600" text-anchor="middle" letter-spacing="0">Volume II</text>
<rect x="620" y="68" width="150" height="30" rx="2" fill="#581C87" fill-opacity="0.1" stroke="none" stroke-width="0"/>
<text x="695.0" y="88" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="13" fill="#581C87" font-weight="600" text-anchor="middle" letter-spacing="0">Volume III</text>
<rect x="780" y="68" width="150" height="30" rx="2" fill="#1A4D3E" fill-opacity="0.1" stroke="none" stroke-width="0"/>
<text x="855.0" y="88" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="13" fill="#1A4D3E" font-weight="600" text-anchor="middle" letter-spacing="0">Volume IV</text>
<line x1="40" y1="98" x2="940" y2="98" stroke="#D9DCE1" stroke-width="1"/>
<text x="40" y="130" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="start" letter-spacing="0">Where compute happens</text>
<circle cx="308" cy="125" r="3" fill="#A51C30"/>
<text x="318" y="129" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">one accelerator</text>
<circle cx="468" cy="125" r="3" fill="#1F407A"/>
<text x="478" y="129" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">a fleet of them</text>
<circle cx="628" cy="125" r="3" fill="#581C87"/>
<text x="638" y="129" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">a model plus its</text>
<text x="638" y="144" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">tools</text>
<circle cx="788" cy="125" r="3" fill="#1A4D3E"/>
<text x="798" y="129" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">silicon beside a</text>
<text x="798" y="144" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="11.5" fill="#1A1A1A" font-weight="400" text-anchor="start" letter-spacing="0">motor</text>
<line x1="40" y1="182" x2="940" y2="182" stroke="#D9DCE1" stroke-width="1"/>
<text x="40" y="214" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="14" fill="#1A1A1A" font-weight="600" text-anchor="start" letter-spacing="0">What limits it</text>
