<text x="1062" y="711" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="17" fill="#E6EDF3" font-weight="400" text-anchor="start" letter-spacing="0">the action was</text>
<text x="1062" y="735" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="17" fill="#E6EDF3" font-weight="400" text-anchor="start" letter-spacing="0">permitted</text>
<circle cx="1313" cy="706" r="4" fill="#6FB79C"/>
<text x="1330" y="711" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="17" fill="#E6EDF3" font-weight="400" text-anchor="start" letter-spacing="0">the machine may</text>
<text x="1330" y="735" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="17" fill="#E6EDF3" font-weight="400" text-anchor="start" letter-spacing="0">operate</text>
