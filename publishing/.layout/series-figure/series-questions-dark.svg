<text x="72" y="248" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="21" fill="#E6EDF3" font-weight="600" text-anchor="start" letter-spacing="0">Where compute happens</text>
