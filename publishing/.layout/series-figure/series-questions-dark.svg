<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img">
<rect x="0" y="0" width="1600" height="820" rx="0" fill="#0D1117" fill-opacity="1.0"/>
<text x="72" y="92" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="40" fill="#E6EDF3" font-weight="600" text-anchor="start" letter-spacing="0">The questions do not change. The answers do.</text>
<text x="72" y="130" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="20" fill="#8B949E" font-weight="400" text-anchor="start" letter-spacing="0">Every volume answers the same five questions about the system it covers.</text>
