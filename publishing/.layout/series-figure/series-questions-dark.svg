<text x="893.0" y="185" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="20" fill="#7FA3DC" font-weight="600" text-anchor="middle" letter-spacing="0">Volume II</text>
