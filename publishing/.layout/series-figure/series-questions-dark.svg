<text x="1161.0" y="185" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="20" fill="#C08FE0" font-weight="600" text-anchor="middle" letter-spacing="0">Volume III</text>
