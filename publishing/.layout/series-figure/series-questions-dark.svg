<line x1="72" y1="548" x2="1528" y2="548" stroke="#30363D" stroke-width="1"/>
<text x="72" y="596" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="21" fill="#E6EDF3" font-weight="600" text-anchor="start" letter-spacing="0">How it fails</text>
