<text x="1062" y="247" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="17" fill="#E6EDF3" font-weight="400" text-anchor="start" letter-spacing="0">a model plus its</text>
<text x="1062" y="271" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="17" fill="#E6EDF3" font-weight="400" text-anchor="start" letter-spacing="0">tools</text>
