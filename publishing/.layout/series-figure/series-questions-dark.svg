<text x="1330" y="363" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="17" fill="#E6EDF3" font-weight="400" text-anchor="start" letter-spacing="0">physics and the</text>
<text x="1330" y="387" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="17" fill="#E6EDF3" font-weight="400" text-anchor="start" letter-spacing="0">control rate</text>
