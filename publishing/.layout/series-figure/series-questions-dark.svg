<text x="794" y="711" font-family="ui-serif, Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif" font-size="17" fill="#E6EDF3" font-weight="400" text-anchor="start" letter-spacing="0">utilization and cost</text>
