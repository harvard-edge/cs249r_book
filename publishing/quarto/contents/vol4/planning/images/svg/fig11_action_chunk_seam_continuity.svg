<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .panel-title { font-weight: 700; font-size: 13px; fill: #1E293B; }
      .axis-label { font-size: 9.5px; fill: #64748B; font-weight: 500; }
      .axis-title { font-size: 10px; fill: #334155; font-weight: 600; }
      .curve-label { font-size: 9px; font-weight: 600; }
      .thresh-label { font-size: 8.5px; font-weight: 500; }
      .annot-text { font-size: 9px; font-weight: 500; }
    </style>

    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Clean White Background -->
  <rect x="0" y="0" width="920" height="480" fill="#FFFFFF"/>

  <!-- ************************************* -->
  <!-- PANEL (a): UNCHECKED C0 CONCATENATION -->
  <!-- ************************************* -->
  <text x="255" y="24" class="panel-title" text-anchor="middle">(a) Unchecked C⁰ Concatenation (Position Spliced Only)</text>

  <!-- Row 1: Position q(t) -->
  <g id="panel-a-pos">
    <line x1="80" y1="115" x2="430" y2="115" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="80" y1="45" x2="80" y2="115" stroke="#CBD5E1" stroke-width="1"/>
    <text x="74" y="55" class="axis-label" text-anchor="end">0.86</text>
    <text x="74" y="85" class="axis-label" text-anchor="end">0.85</text>
    <text x="74" y="115" class="axis-label" text-anchor="end">0.84</text>
    <text x="35" y="80" class="axis-title" transform="rotate(-90 35 80)" text-anchor="middle">Position q [rad]</text>

    <line x1="255" y1="45" x2="255" y2="115" stroke="#F87171" stroke-width="1" stroke-dasharray="3,3"/>

    <path d="M 80 60 Q 170 78, 255 85" fill="none" stroke="#2563EB" stroke-width="2"/>
    <path d="M 255 85 Q 340 75, 430 55" fill="none" stroke="#2563EB" stroke-width="2"/>
    <circle cx="255" cy="85" r="3.5" fill="#DC2626"/>
    
    <text x="140" y="65" class="curve-label" fill="#2563EB">Chunk A</text>
    <text x="360" y="65" class="curve-label" fill="#2563EB">Chunk B</text>
    <text x="262" y="80" class="curve-label" fill="#DC2626">Slope kink (C¹ mismatch)</text>
  </g>

  <!-- Row 2: Velocity q_dot(t) -->
  <g id="panel-a-vel">
    <line x1="80" y1="215" x2="430" y2="215" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="80" y1="145" x2="80" y2="215" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="80" y1="185" x2="430" y2="185" stroke="#F1F5F9" stroke-width="1"/>

    <text x="74" y="155" class="axis-label" text-anchor="end">+0.30</text>
    <text x="74" y="172" class="axis-label" text-anchor="end">+0.15</text>
    <text x="74" y="188" class="axis-label" text-anchor="end">0.00</text>
    <text x="74" y="210" class="axis-label" text-anchor="end">-0.45</text>
    <text x="35" y="180" class="axis-title" transform="rotate(-90 35 180)" text-anchor="middle">Velocity q̇ [rad/s]</text>

    <line x1="255" y1="145" x2="255" y2="215" stroke="#F87171" stroke-width="1" stroke-dasharray="3,3"/>

    <line x1="80" y1="205" x2="255" y2="205" stroke="#2563EB" stroke-width="2"/>
    <line x1="255" y1="205" x2="257" y2="168" stroke="#DC2626" stroke-width="2.5"/>
    <line x1="257" y1="168" x2="430" y2="155" stroke="#2563EB" stroke-width="2"/>

    <rect x="268" y="176" width="150" height="24" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="274" y="188" class="curve-label" fill="#DC2626">Δq̇ = +0.60 rad/s step</text>
    <text x="274" y="197" class="annot-text" fill="#7F1D1D">Across 1 ms servo period</text>
  </g>

  <!-- Row 3: Dynamic Torque tau(t) -->
  <g id="panel-a-torque">
    <line x1="80" y1="315" x2="430" y2="315" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="80" y1="245" x2="80" y2="315" stroke="#CBD5E1" stroke-width="1"/>

    <text x="74" y="252" class="axis-label" text-anchor="end">324</text>
    <text x="74" y="265" class="axis-label" text-anchor="end">285</text>
    <text x="74" y="285" class="axis-label" text-anchor="end">110</text>
    <text x="74" y="298" class="axis-label" text-anchor="end">45</text>
    <text x="74" y="315" class="axis-label" text-anchor="end">0</text>
    <text x="35" y="280" class="axis-title" transform="rotate(-90 35 280)" text-anchor="middle">Torque τ [N·m]</text>

    <!-- Threshold lines -->
    <line x1="80" y1="298" x2="430" y2="298" stroke="#10B981" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="428" y="295" class="thresh-label" fill="#047857" text-anchor="end">Continuous Rating (45 N·m)</text>

    <line x1="80" y1="282" x2="430" y2="282" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="428" y="279" class="thresh-label" fill="#B45309" text-anchor="end">Peak Ceiling (110 N·m)</text>

    <line x1="80" y1="262" x2="430" y2="262" stroke="#DC2626" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="428" y="259" class="thresh-label" fill="#B91C1C" text-anchor="end" font-weight="600">Pin Shear Limit (285 N·m)</text>

    <line x1="255" y1="245" x2="255" y2="315" stroke="#F87171" stroke-width="1" stroke-dasharray="3,3"/>

    <path d="M 80 306 L 253 306 L 255 248 L 257 306 L 430 306" fill="none" stroke="#DC2626" stroke-width="2.2"/>
    <circle cx="255" cy="248" r="3.5" fill="#DC2626"/>

    <rect x="266" y="244" width="145" height="26" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="0.8"/>
    <text x="272" y="255" class="curve-label" fill="#B91C1C">💥 Shear Failure (324 N·m)</text>
    <text x="272" y="266" class="annot-text" fill="#7F1D1D">q̈ = 600 rad/s² exceeds yield</text>
  </g>

  <!-- Row 4: Jerk q_triple_dot(t) -->
  <g id="panel-a-jerk">
    <line x1="80" y1="415" x2="430" y2="415" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="80" y1="345" x2="80" y2="415" stroke="#CBD5E1" stroke-width="1"/>

    <text x="74" y="355" class="axis-label" text-anchor="end">+∞</text>
    <text x="74" y="415" class="axis-label" text-anchor="end">0</text>
    <text x="35" y="380" class="axis-title" transform="rotate(-90 35 380)" text-anchor="middle">Jerk q⃛ [rad/s³]</text>

    <!-- X-axis ticks -->
    <line x1="80" y1="415" x2="80" y2="420" stroke="#64748B" stroke-width="1"/>
    <text x="80" y="430" class="axis-label" text-anchor="middle">0 ms</text>

    <line x1="167" y1="415" x2="167" y2="420" stroke="#64748B" stroke-width="1"/>
    <text x="167" y="430" class="axis-label" text-anchor="middle">25 ms</text>

    <line x1="255" y1="415" x2="255" y2="420" stroke="#DC2626" stroke-width="1.5"/>
    <text x="255" y="430" class="axis-label" text-anchor="middle" font-weight="700" fill="#DC2626">50 ms (Seam)</text>

    <line x1="342" y1="415" x2="342" y2="420" stroke="#64748B" stroke-width="1"/>
    <text x="342" y="430" class="axis-label" text-anchor="middle">75 ms</text>

    <line x1="430" y1="415" x2="430" y2="420" stroke="#64748B" stroke-width="1"/>
    <text x="430" y="430" class="axis-label" text-anchor="middle">100 ms</text>

    <line x1="255" y1="345" x2="255" y2="415" stroke="#F87171" stroke-width="1" stroke-dasharray="3,3"/>

    <line x1="80" y1="415" x2="253" y2="415" stroke="#DC2626" stroke-width="1.5"/>
    <line x1="255" y1="415" x2="255" y2="350" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
    <line x1="257" y1="415" x2="430" y2="415" stroke="#DC2626" stroke-width="1.5"/>

    <text x="265" y="362" class="curve-label" fill="#DC2626">Dirac Impulse δ(t) (Infinite Jerk)</text>
    <text x="265" y="375" class="annot-text" fill="#64748B">Causes cycloidal tooth shock &amp; brinelling</text>
  </g>

  <!-- ************************************* -->
  <!-- PANEL (b): JERK-CONTINUOUS C2 QUINTIC BLENDED SPLINE -->
  <!-- ************************************* -->
  <text x="715" y="24" class="panel-title" text-anchor="middle">(b) Jerk-Continuous C² Quintic Spline Trajectory Blend</text>

  <!-- Row 1: Position q(t) -->
  <g id="panel-b-pos">
    <line x1="540" y1="115" x2="890" y2="115" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="540" y1="45" x2="540" y2="115" stroke="#CBD5E1" stroke-width="1"/>

    <text x="534" y="55" class="axis-label" text-anchor="end">0.86</text>
    <text x="534" y="85" class="axis-label" text-anchor="end">0.85</text>
    <text x="534" y="115" class="axis-label" text-anchor="end">0.84</text>
    <text x="495" y="80" class="axis-title" transform="rotate(-90 495 80)" text-anchor="middle">Position q [rad]</text>

    <!-- Blend Interval Shading -->
    <rect x="680" y="45" width="70" height="70" fill="#F0FDF4" opacity="0.8"/>
    <line x1="715" y1="45" x2="715" y2="115" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>

    <path d="M 540 60 Q 620 75, 680 82 C 700 85, 730 83, 750 78 Q 820 66, 890 55" fill="none" stroke="#059669" stroke-width="2.2"/>

    <text x="715" y="56" class="curve-label" fill="#047857" text-anchor="middle">T_blend = 20 ms Bridge</text>
    <text x="590" y="65" class="curve-label" fill="#2563EB">Chunk A</text>
    <text x="820" y="65" class="curve-label" fill="#2563EB">Chunk B</text>
  </g>

  <!-- Row 2: Velocity q_dot(t) -->
  <g id="panel-b-vel">
    <line x1="540" y1="215" x2="890" y2="215" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="540" y1="145" x2="540" y2="215" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="540" y1="185" x2="890" y2="185" stroke="#F1F5F9" stroke-width="1"/>

    <text x="534" y="155" class="axis-label" text-anchor="end">+0.30</text>
    <text x="534" y="172" class="axis-label" text-anchor="end">+0.15</text>
    <text x="534" y="188" class="axis-label" text-anchor="end">0.00</text>
    <text x="534" y="210" class="axis-label" text-anchor="end">-0.45</text>
    <text x="495" y="180" class="axis-title" transform="rotate(-90 495 180)" text-anchor="middle">Velocity q̇ [rad/s]</text>

    <rect x="680" y="145" width="70" height="70" fill="#F0FDF4" opacity="0.8"/>
    <line x1="715" y1="145" x2="715" y2="215" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>

    <path d="M 540 205 L 680 205 C 700 205, 730 168, 750 168 L 890 155" fill="none" stroke="#059669" stroke-width="2.2"/>
    <text x="758" y="195" class="curve-label" fill="#047857">Smooth C¹ Velocity</text>
    <text x="758" y="206" class="annot-text" fill="#065F46">Zero step jump</text>
  </g>

  <!-- Row 3: Dynamic Torque tau(t) -->
  <g id="panel-b-torque">
    <line x1="540" y1="315" x2="890" y2="315" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="540" y1="245" x2="540" y2="315" stroke="#CBD5E1" stroke-width="1"/>

    <text x="534" y="252" class="axis-label" text-anchor="end">324</text>
    <text x="534" y="265" class="axis-label" text-anchor="end">285</text>
    <text x="534" y="285" class="axis-label" text-anchor="end">110</text>
    <text x="534" y="298" class="axis-label" text-anchor="end">45</text>
    <text x="534" y="315" class="axis-label" text-anchor="end">0</text>
    <text x="495" y="280" class="axis-title" transform="rotate(-90 495 280)" text-anchor="middle">Torque τ [N·m]</text>

    <!-- Thresholds -->
    <line x1="540" y1="298" x2="890" y2="298" stroke="#10B981" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="888" y="295" class="thresh-label" fill="#047857" text-anchor="end">Continuous Rating (45 N·m)</text>

    <line x1="540" y1="282" x2="890" y2="282" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="3,2"/>
    <line x1="540" y1="262" x2="890" y2="262" stroke="#DC2626" stroke-width="0.8" stroke-dasharray="4,2"/>

    <rect x="680" y="245" width="70" height="70" fill="#F0FDF4" opacity="0.8"/>
    <line x1="715" y1="245" x2="715" y2="315" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>

    <path d="M 540 306 L 680 306 C 698 306, 706 299, 715 299 C 724 299, 732 306, 750 306 L 890 306" fill="none" stroke="#059669" stroke-width="2.2"/>

    <rect x="735" y="278" width="150" height="24" rx="3" fill="#F0FDF4" stroke="#059669" stroke-width="0.8"/>
    <text x="740" y="289" class="curve-label" fill="#047857">Peak τ = 38 N·m</text>
    <text x="740" y="298" class="annot-text" fill="#065F46">Safe 15% margin under 45 N·m limit</text>
  </g>

  <!-- Row 4: Jerk q_triple_dot(t) -->
  <g id="panel-b-jerk">
    <line x1="540" y1="415" x2="890" y2="415" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="540" y1="345" x2="540" y2="415" stroke="#CBD5E1" stroke-width="1"/>

    <text x="534" y="355" class="axis-label" text-anchor="end">+4.5k</text>
    <text x="534" y="380" class="axis-label" text-anchor="end">0</text>
    <text x="534" y="405" class="axis-label" text-anchor="end">-4.5k</text>
    <text x="495" y="380" class="axis-title" transform="rotate(-90 495 380)" text-anchor="middle">Jerk q⃛ [rad/s³]</text>

    <!-- X-axis ticks -->
    <line x1="540" y1="415" x2="540" y2="420" stroke="#64748B" stroke-width="1"/>
    <text x="540" y="430" class="axis-label" text-anchor="middle">0 ms</text>

    <line x1="627" y1="415" x2="627" y2="420" stroke="#64748B" stroke-width="1"/>
    <text x="627" y="430" class="axis-label" text-anchor="middle">25 ms</text>

    <line x1="715" y1="415" x2="715" y2="420" stroke="#059669" stroke-width="1.5"/>
    <text x="715" y="430" class="axis-label" text-anchor="middle" font-weight="700" fill="#059669">50 ms (Seam)</text>

    <line x1="802" y1="415" x2="802" y2="420" stroke="#64748B" stroke-width="1"/>
    <text x="802" y="430" class="axis-label" text-anchor="middle">75 ms</text>

    <line x1="890" y1="415" x2="890" y2="420" stroke="#64748B" stroke-width="1"/>
    <text x="890" y="430" class="axis-label" text-anchor="middle">100 ms</text>

    <line x1="715" y1="345" x2="715" y2="415" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>

    <path d="M 540 380 L 680 380 C 690 360, 705 360, 715 380 C 725 400, 740 400, 750 380 L 890 380" fill="none" stroke="#059669" stroke-width="2.2"/>

    <text x="758" y="365" class="curve-label" fill="#047857">Bounded Continuous Jerk (C² Spline)</text>
    <text x="758" y="377" class="annot-text" fill="#64748B">Zero excitation of driveline resonance</text>
  </g>

  <!-- Subtle divider between Panel (a) and Panel (b) -->
  <line x1="485" y1="35" x2="485" y2="435" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Common Time Axis Label -->
  <text x="255" y="455" class="axis-title" text-anchor="middle">Time t [ms]</text>
  <text x="715" y="455" class="axis-title" text-anchor="middle">Time t [ms]</text>

</svg>
