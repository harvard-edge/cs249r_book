<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 14.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.3px; }
      .main-subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; text-anchor: middle; }
      .panel-header { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 0.3px; }
      .box-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 10.5px; }
      .body-txt { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.2px; fill: #334155; line-height: 1.35; }
      .math-txt { font-family: "STIX Two Text", "Times New Roman", serif; font-style: italic; font-size: 9.8px; }
      .code-txt { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 8.6px; font-weight: 600; }
      .badge-txt { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 8.5px; text-anchor: middle; }
    </style>

    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B45309"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="560" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="26" class="main-title">GROUNDED INTENT: FROM CROSS-MODAL ATTENTION TO EXPIRING INTENT LEASES</text>
  <text x="480" y="42" class="main-subtitle">Multi-Modal Tokenization, 3D Affordance Synthesis, Entropy-Gated Refusal, and Real-Time Lease Execution</text>

  <!-- ========================================================================= -->
  <!-- PANEL 1: MULTI-MODAL TOKENIZATION (Top-Left: x=30, y=56, w=435, h=230)    -->
  <!-- ========================================================================= -->
  <rect x="30" y="56" width="435" height="230" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="56" width="435" height="26" rx="8" fill="#E2E8F0"/>
  <rect x="30" y="74" width="435" height="8" fill="#E2E8F0"/>
  <text x="42" y="73" class="panel-header" fill="#1E293B">1. MULTI-RATE MULTIMODAL TOKENIZATION</text>
  <rect x="375" y="60" width="80" height="18" rx="9" fill="#FFFFFF"/>
  <text x="415" y="73" class="badge-txt" fill="#475569">Token Ingress</text>

  <!-- Step 1.1: Vision Stream -->
  <g transform="translate(45, 92)">
    <rect width="185" height="74" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
    <text x="10" y="16" class="box-title" fill="#1E293B">RGB-D / Multi-Camera</text>
    <text x="10" y="32" class="body-txt">ViT Patchify: P × P grid</text>
    <text x="10" y="46" class="code-txt" fill="#1E40AF">v_i ∈ ℝ^D + E_pos^{2D}</text>
    <text x="10" y="60" class="code-txt" fill="#007A87">View: [sin θ, cos θ, ...]</text>
  </g>

  <!-- Step 1.2: Language Stream -->
  <g transform="translate(260, 92)">
    <rect width="190" height="74" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
    <text x="10" y="16" class="box-title" fill="#1E293B">Natural Language Directive</text>
    <text x="10" y="32" class="body-txt">"pick up the brass valve"</text>
    <text x="10" y="46" class="code-txt" fill="#475569">BPE / WordPiece Tokenizer</text>
    <text x="10" y="60" class="code-txt" fill="#B45309">Language Tokens: l_j ∈ ℝ^D</text>
  </g>

  <!-- Step 1.3: Unified Prefix Sequence -->
  <g transform="translate(45, 176)">
    <rect width="405" height="98" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="12" y="16" class="box-title" fill="#334155">Unified Multimodal Input Prefix (VLA Backbone)</text>
    <text x="12" y="31" class="body-txt">Vision and language tokens are concatenated into a multimodal sequence:</text>
    <text x="12" y="46" class="math-txt" fill="#1F407A">Z_input = [v_1, ..., v_N, l_1, ..., l_M] ∈ ℝ^{(N + M) × D}</text>
    <text x="12" y="62" class="body-txt">Dual visual backbones: DINOv2 (geometry) + SigLIP (semantics).</text>
    <text x="12" y="78" class="code-txt" fill="#1E40AF">MLP Projector maps patch embeddings into language model space.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: CROSS-ATTENTION & AFFORDANCE (Top-Right: x=495, y=56, w=435)     -->
  <!-- ========================================================================= -->
  <rect x="495" y="56" width="435" height="230" rx="8" fill="#E8F4F8" stroke="#99F6E4" stroke-width="1.2"/>
  <rect x="495" y="56" width="435" height="26" rx="8" fill="#99F6E4"/>
  <rect x="495" y="74" width="435" height="8" fill="#99F6E4"/>
  <text x="507" y="73" class="panel-header" fill="#0F766E">2. CROSS-ATTENTION &amp; 3D AFFORDANCE FIELDS</text>
  <rect x="835" y="60" width="85" height="18" rx="9" fill="#FFFFFF"/>
  <text x="877" y="73" class="badge-txt" fill="#007A87">3D Affordance</text>

  <g transform="translate(510, 92)">
    <rect width="405" height="182" rx="6" fill="#FFFFFF" stroke="#0D9488" stroke-width="1"/>
    <text x="12" y="17" class="box-title" fill="#0F766E">Cross-Attention Grounding (Transformer Layers)</text>
    <text x="12" y="32" class="body-txt">Visual patches attend to directive keys/values:</text>
    <text x="12" y="48" class="math-txt" fill="#0F766E">A_ij = softmax( (V W_Q)(L W_K)^T / √D ) (L W_V)</text>
    <line x1="12" y1="60" x2="390" y2="60" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="76" class="box-title" fill="#0F766E">3D Potential Field Synthesis (VoxPoser Paradigm)</text>
    <text x="12" y="92" class="body-txt">Back-projects multimodal heatmaps along camera rays into 3D voxel space:</text>
    <text x="12" y="108" class="code-txt" fill="#0D9488">V_attr(x): Attractive goal potential at target coordinates</text>
    <text x="12" y="122" class="code-txt" fill="#991B1B">V_rep(x): Repulsive potential barrier at obstacles and limits</text>
    <text x="12" y="138" class="body-txt">Output: Continuous 3D cost field in SE(3) consumed by optimizer.</text>
    <text x="12" y="156" class="code-txt" fill="#1E40AF">Posterior referent distribution: p(z) = [p_1, p_2, ..., p_K]</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 3: AMBIGUITY REFUSAL GATE (Bottom-Left: x=30, y=298, w=435, h=240)  -->
  <!-- ========================================================================= -->
  <rect x="30" y="298" width="435" height="240" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.2"/>
  <rect x="30" y="298" width="435" height="26" rx="8" fill="#FDE68A"/>
  <rect x="30" y="316" width="435" height="8" fill="#FDE68A"/>
  <text x="42" y="315" class="panel-header" fill="#92400E">3. POSTERIOR AMBIGUITY REFUSAL GATE (THE VETO)</text>
  <rect x="365" y="302" width="90" height="18" rx="9" fill="#FFFFFF"/>
  <text x="410" y="315" class="badge-txt" fill="#B45309">Safety Refusal</text>

  <g transform="translate(45, 334)">
    <rect width="405" height="190" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <text x="12" y="18" class="box-title" fill="#B45309">Why Argmax Is Fatal in Physical Environments</text>
    <text x="12" y="34" class="body-txt">Standard LLMs force an argmax choice across candidate referents.</text>
    <text x="12" y="48" class="body-txt">If two identical valves exist, choosing with 51% vs 49% causes collision.</text>
    <line x1="12" y1="58" x2="390" y2="58" stroke="#FDE68A" stroke-width="1"/>
    <text x="12" y="74" class="box-title" fill="#92400E">Entropy Filter &amp; Refusal Condition</text>
    <text x="12" y="90" class="math-txt" fill="#92400E">H(z) = - Σ_{k=1}^K p_k log₂ p_k   &gt;   H_threshold   (e.g., 0.85 bits)</text>
    <text x="12" y="106" class="body-txt">OR candidate probability margin: |p_1 - p_2| &lt; δ_margin</text>
    <g transform="translate(12, 120)">
      <rect width="380" height="58" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
      <text x="10" y="16" class="box-title" fill="#991B1B">GATE REFUSAL: ERR_GROUNDING_AMBIGUITY</text>
      <text x="10" y="32" class="body-txt">Veto issued! Machine freezes actuators in place and requests clarification.</text>
      <text x="10" y="48" class="code-txt" fill="#991B1B">Action proposal rejected before reaching real-time motor inverters.</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 4: EXPIRING INTENT LEASE (Bottom-Right: x=495, y=298, w=435)        -->
  <!-- ========================================================================= -->
  <rect x="495" y="298" width="435" height="240" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
  <rect x="495" y="298" width="435" height="26" rx="8" fill="#A7F3D0"/>
  <rect x="495" y="316" width="435" height="8" fill="#A7F3D0"/>
  <text x="507" y="315" class="panel-header" fill="#065F46">4. THE EXPIRING INTENT LEASE CONTRACT (MCU)</text>
  <rect x="835" y="302" width="85" height="18" rx="9" fill="#FFFFFF"/>
  <text x="877" y="315" class="badge-txt" fill="#166534">Real-Time Lease</text>

  <g transform="translate(510, 334)">
    <rect width="405" height="190" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
    <text x="12" y="18" class="box-title" fill="#065F46">SRAM Mailbox Payload: Lease ℒ_intent</text>
    <text x="12" y="34" class="code-txt" fill="#065F46">1. Target Pose:  p_0 ∈ SE(3) [x, y, z, roll, pitch, yaw]</text>
    <text x="12" y="48" class="code-txt" fill="#065F46">2. Covariance:   (p - p_0)^T Σ^{-1} (p - p_0) ≤ χ²_{3, 0.95}</text>
    <text x="12" y="62" class="code-txt" fill="#065F46">3. Dynamic Caps: F_max ≤ 12.0 N,  v_max ≤ 0.25 m/s</text>
    <text x="12" y="76" class="code-txt" fill="#C85A17">4. Time-to-Live: τ_lease = 250 ms  (Expires at t_src + τ)</text>
    <line x1="12" y1="88" x2="390" y2="88" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="104" class="box-title" fill="#065F46">Deterministic Real-Time Microcontroller Execution (1 kHz)</text>
    <text x="12" y="120" class="body-txt">Hardware TTL watchdog timer decrements on hardware clock.</text>
    <text x="12" y="134" class="body-txt">If Linux MPU stalls: lease expires → autonomous dead-man hold.</text>
    <text x="12" y="150" class="code-txt" fill="#166534">While Valid: Quintic spline trajectory with CBF QP force boundary.</text>
    <text x="12" y="166" class="body-txt" fill="#047857">Guarantees kinetic action is bounded in space, force, and time.</text>
  </g>

  <!-- Big Connecting Arrows -->
  <path d="M 465 171 L 495 171" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-navy)"/>
  <path d="M 712 286 L 712 298" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-navy)"/>
  <path d="M 465 418 L 495 418" stroke="#166534" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
