<text x="48" y="179" font-size="9.5" font-weight="700" fill="#10B981">SUB-CLAIM C₁.₁: Tactile Reflex</text>
<text x="48" y="199" font-size="10.5" font-weight="700" fill="#1A202C">Primary Soft Tactile Slip Reflex</text>
<text x="48" y="213" font-size="8.3" fill="#475569">Optical-tactile fingertips detect contact shear &amp;</text>
<text x="48" y="224" font-size="8.3" fill="#475569">trip safety reflex within 12 ms; normal</text>
<text x="48" y="235" font-size="8.3" fill="#475569">force arrested &lt; 14 N.</text>
