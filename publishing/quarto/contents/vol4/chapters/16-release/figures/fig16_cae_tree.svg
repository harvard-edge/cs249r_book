<text x="52" y="77" font-size="10.5" font-weight="700" fill="#1F407A">TOP OPERATIONAL SAFETY CLAIM (C₁)</text>
<text x="568" y="77" font-size="9" font-weight="700" fill="#1F407A" text-anchor="end">Falsifiable Physical Boundary</text>
<text x="52" y="100" font-size="10" font-weight="600" fill="#1A202C">"Manipulator never exerts normal force F_norm &gt; 50 N or shear force F_shear &gt; 20 N on unexpected obstacle</text>
<text x="52" y="115" font-size="10" font-weight="600" fill="#1A202C">or human operator across any operational state, with emergency stopping time t_stop ≤ 40 ms."</text>
<rect x="600" y="62" width="320" height="68" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="600" y="62" width="320" height="22" rx="6" fill="#64748B" fill-opacity="0.12"/>
<text x="610" y="77" font-size="10" font-weight="700" fill="#1A202C">CONTEXT: OPERATIONAL DESIGN DOMAIN (X_ODD)</text>
<text x="610" y="98" font-size="8.5" fill="#475569">• Reach r ≤ 1.2 m · Max velocity v_max = 0.40 m/s</text>
<text x="610" y="111" font-size="8.5" fill="#475569">• Payload mass m ≤ 2.0 kg (nominal) · Dry friction μ ≥ 0.35</text>
<text x="610" y="124" font-size="8.5" fill="#475569">• Temp: 15°C–40°C · Light: 300–2000 lx · 1 co-present worker</text>
