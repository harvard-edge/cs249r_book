<text x="658" y="295" font-size="8.2" fill="#475569">preempted, starved, or bypassed by MPU vision tasks.</text>
<text x="658" y="307" font-size="8" font-weight="600" fill="#007A87">Independent permission path (Chapter 12)</text>
