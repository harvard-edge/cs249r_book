<text x="353" y="295" font-size="8.2" fill="#475569">(F_trip = 35 N). Mechanical brakes halt moving arm.</text>
<text x="353" y="307" font-size="8" font-weight="600" fill="#D97706">Unmitigated: Peak force reaches 88 N &gt; 50 N!</text>
