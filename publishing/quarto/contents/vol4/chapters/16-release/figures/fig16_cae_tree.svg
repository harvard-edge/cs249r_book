<text x="658" y="199" font-size="10.5" font-weight="700" fill="#1A202C">Hard Real-Time Enforcer (Ch 12)</text>
<text x="658" y="213" font-size="8.3" fill="#475569">1000 Hz safety loop isolates inverter</text>
<text x="658" y="224" font-size="8.3" fill="#475569">gate signals within 1 ms; real-time bus</text>
<text x="658" y="235" font-size="8.3" fill="#475569">latency bounded P99.99 ≤ 1.8 ms.</text>
