<text x="48" y="358" font-size="8.2" font-weight="600" fill="#1A202C">Machining fluid drops friction: μ = 0.85 → 0.12.</text>
<text x="48" y="371" font-size="8.2" fill="#475569">Workpiece slides freely across silicone; zero marker</text>
<text x="48" y="384" font-size="8.2" fill="#475569">strain observed. Primary tactile reflex fails silently!</text>
<text x="48" y="395" font-size="8" font-weight="700" fill="#DC2626">Result: Unmonitored rigid collision trajectory</text>
