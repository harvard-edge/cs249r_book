<text x="353" y="358" font-size="8.2" font-weight="600" fill="#1A202C">1. Derate payload mass: m ≤ 1.5 kg (m_eff = 4.0 kg)</text>
<text x="353" y="371" font-size="8.2" font-weight="600" fill="#1A202C">2. Add optical surface-dryness station at feeder</text>
<text x="353" y="384" font-size="8.2" font-weight="600" fill="#1A202C">3. Tighten torque tripwire threshold to F_trip = 18 N</text>
<text x="353" y="395" font-size="8" font-weight="700" fill="#10B981">Bound Restored: F_peak = 38 N ≤ 50 N (∫F dt = 1.1 N·s)</text>
