<text x="353" y="213" font-size="8.3" fill="#475569">Joint servo drives observe motor current</text>
<text x="353" y="224" font-size="8.3" fill="#475569">discrepancy Δτ &gt; 3.5 N·m to command</text>
<text x="353" y="235" font-size="8.3" fill="#475569">friction brakes independently.</text>
