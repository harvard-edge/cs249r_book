<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 14.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.3px; }
      .main-subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; text-anchor: middle; }
      .panel-header { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 0.3px; }
      .box-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 10.5px; }
      .body-txt { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.2px; fill: #334155; line-height: 1.35; }
      .math-txt { font-family: "STIX Two Text", "Times New Roman", serif; font-style: italic; font-size: 10px; }
      .code-txt { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 8.8px; font-weight: 600; }
      .badge-txt { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 8.5px; text-anchor: middle; }
    </style>

    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B45309"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="560" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="26" class="main-title">INCIDENT AUTOPSY: UNDERCARRIAGE SENSOR BLIND SPOT AND UNVERIFIED RECOVERY</text>
  <text x="480" y="42" class="main-subtitle">Forensic Systems Analysis of the October 2023 Cruise Robotaxi Collision (NHTSA ODI PE23-018 &amp; Exponent Root Cause Report)</text>

  <!-- ========================================================================= -->
  <!-- PANEL A: SENSOR FOV & UNDERCARRIAGE BLIND SPOT (Left: x=30, y=56, w=435)  -->
  <!-- ========================================================================= -->
  <rect x="30" y="56" width="435" height="480" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
  <rect x="30" y="56" width="435" height="26" rx="8" fill="#FCA5A5"/>
  <rect x="30" y="74" width="435" height="8" fill="#FCA5A5"/>
  <text x="42" y="73" class="panel-header" fill="#991B1B">A. SENSOR COVERAGE &amp; FLOORPAN BLIND SPOT</text>
  <rect x="365" y="60" width="90" height="18" rx="9" fill="#FFFFFF"/>
  <text x="410" y="73" class="badge-txt" fill="#991B1B">Perception Blind Spot</text>

  <!-- Schematic of Vehicle & Sensor Cones (x=45..445, y=95..280) -->
  <g transform="translate(45, 95)">
    <!-- Road surface -->
    <line x1="10" y1="175" x2="395" y2="175" stroke="#64748B" stroke-width="2"/>
    <text x="395" y="190" class="code-txt" text-anchor="end" fill="#64748B">Road Surface (Dry Asphalt)</text>

    <!-- Vehicle Body Box -->
    <rect x="90" y="75" width="220" height="75" rx="12" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
    <rect x="120" y="50" width="140" height="35" rx="8" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
    <text x="190" y="110" class="box-title" text-anchor="middle" fill="#1E293B">Cruise AV (Panini)</text>
    <text x="190" y="125" class="code-txt" text-anchor="middle" fill="#64748B">Modified Chevrolet Bolt EV</text>

    <!-- Wheels -->
    <circle cx="135" cy="160" r="22" fill="#334155"/>
    <circle cx="135" cy="160" r="10" fill="#94A3B8"/>
    <circle cx="265" cy="160" r="22" fill="#334155"/>
    <circle cx="265" cy="160" r="10" fill="#94A3B8"/>

    <!-- Roof Sensor Pod -->
    <rect x="170" y="35" width="40" height="15" rx="3" fill="#1E293B"/>
    <circle cx="190" cy="33" r="5" fill="#0284C7"/>
    <text x="190" y="27" class="code-txt" text-anchor="middle" fill="#0284C7">LiDAR / 360° Cam Pod</text>

    <!-- Sensor Cones: Look Ahead & Periphery -->
    <polygon points="190,35 380,75 380,175 320,175" fill="#38BDF8" opacity="0.25"/>
    <polygon points="190,35 20,75 20,175 80,175" fill="#38BDF8" opacity="0.25"/>

    <!-- ACUTE UNDERCARRIAGE BLIND SPOT (Beneath floorpan) -->
    <rect x="157" y="150" width="86" height="25" fill="#DC2626" opacity="0.4"/>
    <text x="200" y="166" class="box-title" text-anchor="middle" fill="#991B1B">BLIND SPOT</text>

    <!-- Entrapped Pedestrian Callout -->
    <circle cx="200" cy="168" r="6" fill="#DC2626"/>
    <line x1="200" y1="168" x2="200" y2="208" stroke="#DC2626" stroke-width="1.5"/>
    <circle cx="200" cy="208" r="3" fill="#DC2626"/>
    <text x="208" y="211" class="code-txt" fill="#991B1B">Pedestrian Trapped Under Floorpan</text>
  </g>

  <!-- Explanatory Breakdown Cards in Panel A -->
  <g transform="translate(45, 335)">
    <rect width="405" height="185" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="12" y="18" class="box-title" fill="#991B1B">Perception Architecture Blindness</text>
    
    <text x="12" y="34" class="body-txt"><tspan font-weight="700">1. Geometric Sensor Ingress Gap:</tspan> Roof LiDARs and forward/side</text>
    <text x="24" y="47" class="body-txt">optical cameras survey perimeter space at and above bumper level.</text>
    <text x="24" y="60" class="body-txt">No downward sensors surveyed the undercarriage floorpan area.</text>

    <text x="12" y="76" class="body-txt"><tspan font-weight="700">2. Truncated Limb Perception Filtering:</tspan> Side perimeter camera</text>
    <text x="24" y="89" class="body-txt">partially imaged legs, but neural detector required full torso</text>
    <text x="24" y="102" class="body-txt">geometry to instantiate an obstacle tracking bounding box.</text>

    <text x="12" y="118" class="body-txt"><tspan font-weight="700">3. Absence of Force Invariant:</tspan> Drive motors detected elevated rolling</text>
    <text x="24" y="131" class="body-txt">resistance during pull-over, but lacked torque thresholding to veto motion.</text>

    <text x="12" y="150" class="code-txt" fill="#991B1B">Systems Lesson: Never assume clear ground plane without positive sensor coverage!</text>
    <text x="12" y="165" class="body-txt" fill="#64748B">Source: Exponent Technical Root Cause Analysis &amp; NHTSA ODI PE23-018.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL B: UNVERIFIED RECOVERY MANEUVER (Right: x=495, y=56, w=435, h=480)  -->
  <!-- ========================================================================= -->
  <rect x="495" y="56" width="435" height="480" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <rect x="495" y="56" width="435" height="26" rx="8" fill="#FDE68A"/>
  <rect x="495" y="74" width="435" height="8" fill="#FDE68A"/>
  <text x="507" y="73" class="panel-header" fill="#92400E">B. COVARIATE SHIFT &amp; UNVERIFIED RECOVERY</text>
  <rect x="835" y="60" width="85" height="18" rx="9" fill="#FFFFFF"/>
  <text x="877" y="73" class="badge-txt" fill="#B45309">Recovery Fault</text>

  <!-- Three Timeline Steps -->
  <g transform="translate(510, 95)">
    <!-- Stage 1 -->
    <rect width="405" height="68" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="10" y="12" width="22" height="22" rx="11" fill="#1E40AF"/>
    <text x="21" y="27" class="badge-txt" fill="#FFFFFF">1</text>
    <text x="42" y="20" class="box-title" fill="#1E40AF">Primary Hard Braking Stop (Correct Invariant)</text>
    <text x="42" y="34" class="body-txt">Adjacent vehicle catapults pedestrian into AV path.</text>
    <text x="42" y="48" class="code-txt" fill="#166534">AV detects obstacle → Emergency stop: 1.4g, halted in 0.46 s.</text>

    <!-- Stage 2 -->
    <rect y="78" width="405" height="74" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <rect x="10" y="90" width="22" height="22" rx="11" fill="#B45309"/>
    <text x="21" y="105" class="badge-txt" fill="#FFFFFF">2</text>
    <text x="42" y="97" class="box-title" fill="#B45309">Post-Collision State Misclassification</text>
    <text x="42" y="111" class="body-txt">Onboard diagnosis misclassifies event as lateral side-swipe.</text>
    <text x="42" y="125" class="code-txt" fill="#B45309">Triggers unverified recovery primitive: "Pull over to curb".</text>
    <text x="42" y="139" class="body-txt" fill="#64748B">Intended to clear lane; failed to verify undercarriage clearance.</text>

    <!-- Stage 3 -->
    <rect y="162" width="405" height="74" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1"/>
    <rect x="10" y="174" width="22" height="22" rx="11" fill="#991B1B"/>
    <text x="21" y="189" class="badge-txt" fill="#FFFFFF">3</text>
    <text x="42" y="181" class="box-title" fill="#991B1B">Uncommanded Secondary Dragging Maneuver</text>
    <text x="42" y="195" class="body-txt">Chassis accelerates up to 7 mph (3.1 m/s), traveling 20 ft (6.1 m).</text>
    <text x="42" y="209" class="code-txt" fill="#DC2626">Victim pinned beneath rear axle dragged forward 20 feet.</text>
    <text x="42" y="223" class="body-txt" fill="#991B1B">Result: Severe bodily trauma, permit revocation, and fleet grounding.</text>
  </g>

  <!-- Explanatory Breakdown Cards in Panel B -->
  <g transform="translate(510, 345)">
    <rect width="405" height="175" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
    <text x="12" y="18" class="box-title" fill="#92400E">The Safety Enforcement Refusal Mandate</text>
    
    <text x="12" y="34" class="body-txt"><tspan font-weight="700">1. Missing Recovery Invariant:</tspan> An autonomous machine must never</text>
    <text x="24" y="47" class="body-txt">resume motion after a crash stop without positive 360° verification.</text>

    <text x="12" y="65" class="body-txt"><tspan font-weight="700">2. Fail-Silent Hardware Interlock:</tspan> When crash deceleration</text>
    <text x="24" y="78" class="body-txt">(|a| &gt; 1.0g) is registered, enforcer must lock brakes permanently.</text>

    <text x="12" y="96" class="body-txt"><tspan font-weight="700">3. Refusal Authority:</tspan> Low-level safety enforcer must possess</text>
    <text x="24" y="109" class="body-txt">unconditional veto authority over planner recovery maneuvers.</text>

    <text x="12" y="132" class="code-txt" fill="#065F46">Enforcement Rule: State uncertainty + collision == IMMOBILIZE.</text>
  </g>
</svg>
