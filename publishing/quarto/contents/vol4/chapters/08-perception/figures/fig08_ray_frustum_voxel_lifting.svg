<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 14.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.3px; }
      .main-subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; text-anchor: middle; }
      .panel-header { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 0.3px; }
      .box-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 10.5px; }
      .body-txt { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.2px; fill: #334155; line-height: 1.35; }
      .math-txt { font-family: "STIX Two Text", "Times New Roman", serif; font-style: italic; font-size: 9.8px; }
      .code-txt { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 8.6px; font-weight: 600; }
      .badge-txt { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 8.5px; text-anchor: middle; }
    </style>

    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C85A17"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="560" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="26" class="main-title">3D SPATIAL GROUNDING: FROM MIPI CSI-2 INGRESS TO VOXEL FEATURE EXTRACTION</text>
  <text x="480" y="42" class="main-subtitle">Hardware Transduction, ViT Patchification, Camera Ray Back-Projection, and 3D Metric Clearance Bounds</text>

  <!-- ========================================================================= -->
  <!-- PANEL 1: HARDWARE INGRESS & PATCHIFY (Top-Left: x=30, y=56, w=435, h=230) -->
  <!-- ========================================================================= -->
  <rect x="30" y="56" width="435" height="230" rx="8" fill="#FBF0EA" stroke="#FDBA74" stroke-width="1.2"/>
  <rect x="30" y="56" width="435" height="26" rx="8" fill="#FDBA74"/>
  <rect x="30" y="74" width="435" height="8" fill="#FDBA74"/>
  <text x="42" y="73" class="panel-header" fill="#9A3412">1. HARDWARE TRANSDUCTION &amp; PATCHIFICATION (MPU)</text>
  <rect x="375" y="60" width="80" height="18" rx="9" fill="#FFFFFF"/>
  <text x="415" y="73" class="badge-txt" fill="#C85A17">Ingress Latency</text>

  <!-- Step 1.1: CMOS & MIPI -->
  <g transform="translate(45, 92)">
    <rect width="185" height="74" rx="5" fill="#FFFFFF" stroke="#F97316" stroke-width="1"/>
    <text x="10" y="16" class="box-title" fill="#C85A17">CMOS Array &amp; Deserializer</text>
    <text x="10" y="32" class="body-txt">Global/Rolling Shutter Sensor</text>
    <text x="10" y="46" class="code-txt" fill="#475569">MIPI CSI-2 → DMA (t_exp/2)</text>
    <text x="10" y="60" class="code-txt" fill="#9A3412">Timestamp: t_0 = 120.45 ms</text>
  </g>

  <!-- Arrow to ISP -->
  <line x1="230" y1="129" x2="255" y2="129" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- Step 1.2: ISP & RGB -->
  <g transform="translate(260, 92)">
    <rect width="190" height="74" rx="5" fill="#FFFFFF" stroke="#F97316" stroke-width="1"/>
    <text x="10" y="16" class="box-title" fill="#C85A17">Hardware ISP Engine</text>
    <text x="10" y="32" class="body-txt">Debayering &amp; Undistortion</text>
    <text x="10" y="46" class="code-txt" fill="#475569">Rectified RGB: I ∈ ℝ^{H × W × 3}</text>
    <text x="10" y="60" class="code-txt" fill="#9A3412">ISP Latency: ~5–12 ms pipeline</text>
  </g>

  <!-- Step 1.3: ViT Patchify -->
  <g transform="translate(45, 176)">
    <rect width="405" height="98" rx="5" fill="#FFFFFF" stroke="#FB923C" stroke-width="1"/>
    <text x="12" y="16" class="box-title" fill="#9A3412">Vision Transformer (ViT) Patch Tokenization</text>
    <text x="12" y="31" class="body-txt">Image split into P × P patches (14×14 or 16×16 px):</text>
    <text x="12" y="46" class="math-txt" fill="#1F407A">x_p ∈ ℝ^{N × (P² C)},  N = (H · W) / P²,  z_0 = [x_p¹ E; ...; x_p^N E] + E_pos^{2D}</text>
    <text x="12" y="62" class="body-txt">Linear projection matrix E ∈ ℝ^{(P² C) × D} maps patches to D dimensions.</text>
    <text x="12" y="78" class="code-txt" fill="#C85A17">Invariant: Each token retains original timestamp t_0 to bound info age.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: PINHOLE CAMERA RAY LIFTING (Top-Right: x=495, y=56, w=435, h=230) -->
  <!-- ========================================================================= -->
  <rect x="495" y="56" width="435" height="230" rx="8" fill="#E8F4F8" stroke="#99F6E4" stroke-width="1.2"/>
  <rect x="495" y="56" width="435" height="26" rx="8" fill="#99F6E4"/>
  <rect x="495" y="74" width="435" height="8" fill="#99F6E4"/>
  <text x="507" y="73" class="panel-header" fill="#0F766E">2. 2D-TO-3D PINHOLE RAY LIFTING (LSS / BEV)</text>
  <rect x="835" y="60" width="85" height="18" rx="9" fill="#FFFFFF"/>
  <text x="877" y="73" class="badge-txt" fill="#007A87">Ray Unproject</text>

  <!-- Step 2.1: Ray Direction -->
  <g transform="translate(510, 92)">
    <rect width="195" height="74" rx="5" fill="#FFFFFF" stroke="#0D9488" stroke-width="1"/>
    <text x="10" y="16" class="box-title" fill="#0F766E">Camera Ray Vector d(u, v)</text>
    <text x="10" y="32" class="body-txt">Pinhole Camera Intrinsics K:</text>
    <text x="10" y="48" class="math-txt" fill="#0F766E">d(u, v) = K^{-1} [u, v, 1]^T</text>
    <text x="10" y="62" class="code-txt" fill="#475569">Bearing angles: θ, φ</text>
  </g>

  <!-- Arrow to Frustum -->
  <line x1="705" y1="129" x2="730" y2="129" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- Step 2.2: Categorical Depth -->
  <g transform="translate(735, 92)">
    <rect width="180" height="74" rx="5" fill="#FFFFFF" stroke="#0D9488" stroke-width="1"/>
    <text x="10" y="16" class="box-title" fill="#0F766E">Depth Distribution α</text>
    <text x="10" y="32" class="body-txt">D Discrete Depth Bins:</text>
    <text x="10" y="48" class="math-txt" fill="#0F766E">α ∈ Δ^{D-1},  d_1..d_D</text>
    <text x="10" y="62" class="code-txt" fill="#007A87">F(u, v, d) = α_d · c</text>
  </g>

  <!-- Step 2.3: Frustum Feature Cloud -->
  <g transform="translate(510, 176)">
    <rect width="405" height="98" rx="5" fill="#FFFFFF" stroke="#2DD4BF" stroke-width="1"/>
    <text x="12" y="16" class="box-title" fill="#0F766E">Frustum Feature Broadcasting (Outer Product Lift)</text>
    <text x="12" y="31" class="body-txt">Visual feature c ∈ ℝ^C lifted along optical ray d into D discrete points:</text>
    <text x="12" y="46" class="math-txt" fill="#1F407A">p_cam = d_k · K^{-1} [u, v, 1]^T,   p_body = R_cam p_cam + t_cam</text>
    <text x="12" y="62" class="body-txt">Transforms local camera frame F_sensor to rigid body datum F_body.</text>
    <text x="12" y="78" class="code-txt" fill="#0F766E">Output: C-dimensional feature points across 3D view frustum.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 3: 3D VOXEL SPLATTING (Bottom-Left: x=30, y=298, w=435, h=240)      -->
  <!-- ========================================================================= -->
  <rect x="30" y="298" width="435" height="240" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="298" width="435" height="26" rx="8" fill="#CBD5E1"/>
  <rect x="30" y="316" width="435" height="8" fill="#CBD5E1"/>
  <text x="42" y="315" class="panel-header" fill="#1E293B">3. 3D METRIC VOXEL SPLATTING &amp; BEV POOLING</text>
  <rect x="370" y="302" width="85" height="18" rx="9" fill="#FFFFFF"/>
  <text x="412" y="315" class="badge-txt" fill="#1F407A">Metric Splat</text>

  <g transform="translate(45, 334)">
    <rect width="405" height="190" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="12" y="18" class="box-title" fill="#1E40AF">Continuous Space to Metric Grid Discretization</text>
    <text x="12" y="34" class="body-txt">Frustum coordinates p_body = [x, y, z]^T mapped into voxel indices (i, j, k):</text>
    <text x="12" y="52" class="math-txt" fill="#1E40AF">i = ⌊x / Δx_v⌋,   j = ⌊y / Δy_v⌋,   k = ⌊z / Δz_v⌋</text>
    <text x="12" y="70" class="body-txt">All ray features in voxel (i, j, k) are accumulated via sum/max pooling:</text>
    <text x="12" y="88" class="math-txt" fill="#0F766E">V(i, j, k) = Pool_{p ∈ Voxel(i, j, k)} F(p) ∈ ℝ^{C × X × Y × Z}</text>
    
    <line x1="12" y1="102" x2="390" y2="102" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="12" y="118" class="box-title" fill="#334155">Collapsing to Bird's-Eye-View (BEV) Pillar Map</text>
    <text x="12" y="134" class="body-txt">Vertical pillars collapsed along z-axis to form dense 2D planning surface:</text>
    <text x="12" y="150" class="code-txt" fill="#1E40AF">V_BEV ∈ ℝ^{(C · Z) × X × Y} (BEVFusion / BEVFormer)</text>
    <text x="12" y="168" class="body-txt" fill="#64748B">Enables downstream trajectory planners to operate in metric chassis frame.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 4: UNCERTAINTY DIVERGENCE & CLEARANCE (Bottom-Right: x=495, y=298)  -->
  <!-- ========================================================================= -->
  <rect x="495" y="298" width="435" height="240" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
  <rect x="495" y="298" width="435" height="26" rx="8" fill="#A7F3D0"/>
  <rect x="495" y="316" width="435" height="8" fill="#A7F3D0"/>
  <text x="507" y="315" class="panel-header" fill="#065F46">4. PROPAGATED UNCERTAINTY &amp; CLEARANCE CONTRACT</text>
  <rect x="835" y="302" width="85" height="18" rx="9" fill="#FFFFFF"/>
  <text x="877" y="315" class="badge-txt" fill="#166534">Safety Inset</text>

  <g transform="translate(510, 334)">
    <rect width="405" height="190" rx="6" fill="#FFFFFF" stroke="#34D399" stroke-width="1"/>
    <text x="12" y="18" class="box-title" fill="#065F46">Quadratic Depth Divergence vs. Constant Time-of-Flight</text>
    <text x="12" y="34" class="body-txt">Optical triangulation error diverges quadratically with distance z:</text>
    <text x="12" y="52" class="math-txt" fill="#991B1B">δz ≈ (z² / (f · b)) · δd   vs.   LiDAR ToF: δz ≈ c · Δt / 2</text>
    <text x="12" y="70" class="body-txt">Spatial covariance ellipsoid Σ_z expands dramatically at long range:</text>
    <text x="12" y="88" class="math-txt" fill="#065F46">Σ_spatial = J_proj Σ_pixel J_proj^T + Σ_ext</text>
    
    <line x1="12" y1="102" x2="390" y2="102" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="12" y="118" class="box-title" fill="#065F46">Defended Physical Clearance Inset Equation</text>
    <text x="12" y="134" class="body-txt">Downstream safety enforcer must defend expanded physical clearance:</text>
    <text x="12" y="152" class="code-txt" fill="#065F46">C_inset = C_safe + ‖ε_spatial‖_P99 + v · (T_lag + τ_age)</text>
    <text x="12" y="170" class="body-txt" fill="#047857">Defends physical stopping clearance C_safe against sensory latency.</text>
  </g>

  <!-- Big Arrows Connecting Panels -->
  <path d="M 465 171 L 495 171" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-navy)"/>
  <path d="M 712 286 L 712 298" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-navy)"/>
  <path d="M 495 418 L 465 418" stroke="#166534" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
