<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="440" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">DYNAMIC SE(3) KINEMATIC COORDINATE FRAME TREE</text>
<text x="440.0" y="44" class="subtitle">Propagating Homogeneous Transformations T_A^B ∈ SE(3) with Proprioceptive Innovation Updates</text>
<rect x="360.0" y="53.0" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="360.0" y="53.0" width="4" height="44" rx="2" fill="#1F407A"/>
<text x="440" y="71" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">World Frame {W}</text>
<text x="440" y="87" font-size="8" fill="#475569" text-anchor="middle">Global Inertial Anchor</text>
<rect x="220.0" y="148.0" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="220.0" y="148.0" width="4" height="44" rx="2" fill="#215CAF"/>
<text x="300" y="166" font-size="9.5" font-weight="700" fill="#215CAF" text-anchor="middle">Robot Base {B}</text>
<text x="300" y="182" font-size="8" fill="#475569" text-anchor="middle">T_W^B (Odometry / VIO)</text>
<rect x="500.0" y="148.0" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="500.0" y="148.0" width="4" height="44" rx="2" fill="#475569"/>
<text x="580" y="166" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">Static Obstacle {O}</text>
<text x="580" y="182" font-size="8" fill="#475569" text-anchor="middle">T_W^O (Map Anchor)</text>
<rect x="100.0" y="253.0" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#B87333" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="100.0" y="253.0" width="4" height="44" rx="2" fill="#B87333"/>
<text x="180" y="271" font-size="9.5" font-weight="700" fill="#B87333" text-anchor="middle">Camera Sensor {C}</text>
<text x="180" y="287" font-size="8" fill="#475569" text-anchor="middle">T_B^C (Extrinsic Calibration)</text>
<rect x="340.0" y="253.0" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#007A87" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="340.0" y="253.0" width="4" height="44" rx="2" fill="#007A87"/>
<text x="420" y="271" font-size="9.5" font-weight="700" fill="#007A87" text-anchor="middle">End-Effector {EE}</text>
<text x="420" y="287" font-size="8" fill="#475569" text-anchor="middle">T_B^EE (Forward Kinematics)</text>
<rect x="100.0" y="343.0" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="100.0" y="343.0" width="4" height="44" rx="2" fill="#10B981"/>
<text x="180" y="361" font-size="9.5" font-weight="700" fill="#10B981" text-anchor="middle">Target Object {T}</text>
<text x="180" y="377" font-size="8" fill="#475569" text-anchor="middle">T_C^T (Visual Spatial Token)</text>
<rect x="340.0" y="343.0" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="340.0" y="343.0" width="4" height="44" rx="2" fill="#A51C30"/>
<text x="420" y="361" font-size="9.5" font-weight="700" fill="#A51C30" text-anchor="middle">Grasp Affordance {G}</text>
<text x="420" y="377" font-size="8" fill="#475569" text-anchor="middle">T_T^G (Metric Contact Normal)</text>
<line x1="440" y1="97" x2="300" y2="148" stroke="#215CAF" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<line x1="440" y1="97" x2="580" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<line x1="300" y1="192" x2="180" y2="253" stroke="#B87333" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<line x1="300" y1="192" x2="420" y2="253" stroke="#007A87" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<line x1="180" y1="297" x2="180" y2="343" stroke="#10B981" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<line x1="420" y1="297" x2="420" y2="343" stroke="#A51C30" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<path d="M 180 395 C 260 435, 340 435, 418 395" fill="none" stroke="#5B4B8A" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
<text x="300" y="426" font-size="8.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">T_EE^G = (T_W^EE)⁻¹ · T_W^B · T_B^C · T_C^T · T_T^G</text>
</svg>
