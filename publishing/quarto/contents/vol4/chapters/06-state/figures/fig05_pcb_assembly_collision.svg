<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">FORENSIC CASE STUDY: THE STALE FRAME TREE COLLISION</text>
<text x="440.0" y="44" class="subtitle">Autopsy of an Industrial Manipulator Joint Jam Caused by Asynchronous Coordinate Frame Desynchronization</text>
<rect x="40" y="70" width="800" height="64" rx="6" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="40" y="70" width="6" height="64" rx="3" fill="#1F407A"/>
<text x="60" y="92" font-size="10" font-weight="700" fill="#1F407A">1. CAMERA FRAME ARRIVAL (t = 0 ms)</text>
<text x="60" y="108" font-size="8.5" fill="#475569">• Vision pipeline estimates PCB socket target pose T_C^S</text>
<text x="60" y="123" font-size="8.5" fill="#475569">• Processed in user-space Linux background thread</text>
<rect x="40" y="145" width="800" height="64" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="40" y="145" width="6" height="64" rx="3" fill="#D97706"/>
<text x="60" y="167" font-size="10" font-weight="700" fill="#D97706">2. WORKCELL VIBRATION (t = 35 ms)</text>
<text x="60" y="183" font-size="8.5" fill="#475569">• Mechanical fixture shifts 4.2 mm due to pneumatic ejector</text>
<text x="60" y="198" font-size="8.5" fill="#475569">• Frame tree is not updated because camera frame is still rendering</text>
<rect x="40" y="220" width="800" height="64" rx="6" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="40" y="220" width="6" height="64" rx="3" fill="#B87333"/>
<text x="60" y="242" font-size="10" font-weight="700" fill="#B87333">3. BLIND ACTION DISPATCH (t = 60 ms)</text>
<text x="60" y="258" font-size="8.5" fill="#475569">• Action planner emits trajectory chunk targeting stale pose</text>
<text x="60" y="273" font-size="8.5" fill="#475569">• Manipulator moves at 1.2 m/s with zero compliance</text>
<rect x="40" y="295" width="800" height="64" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="40" y="295" width="6" height="64" rx="3" fill="#DC2626"/>
<text x="60" y="317" font-size="10" font-weight="700" fill="#DC2626">4. PHYSICAL JAM &amp; OVER-TORQUE (t = 78 ms)</text>
<text x="60" y="333" font-size="8.5" fill="#475569">• Pin collides with fixture edge; motor current spikes to 18 A</text>
<text x="60" y="348" font-size="8.5" fill="#475569">• Gearbox teeth stripped; emergency E-stop tripped</text>
<rect x="40" y="380" width="800" height="36" rx="5" fill="#DC2626" fill-opacity="0.08" stroke="#DC2626" stroke-width="1"/>
<text x="440.0" y="402" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">FORENSIC ROOT CAUSE: Un-timestamped coordinate frame transforms without proprioceptive compliance.</text>
</svg>
