<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 14.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.3px; }
      .main-subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; text-anchor: middle; }
      .panel-header { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 0.3px; }
      .box-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 10.5px; }
      .body-txt { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.2px; fill: #334155; line-height: 1.35; }
      .math-txt { font-family: "STIX Two Text", "Times New Roman", serif; font-style: italic; font-size: 10px; }
      .code-txt { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 8.6px; font-weight: 600; }
      .badge-txt { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 8.5px; text-anchor: middle; }
      .axis-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 8.8px; fill: #475569; font-weight: 600; }
    </style>

    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="560" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="26" class="main-title">FORENSIC TIMELINE: PERCEPTION TOGGLING AND SUPPRESSION LAG IN THE 2018 TEMPE COLLISION</text>
  <text x="480" y="42" class="main-subtitle">Reconstruction from NTSB Report NTSB/HAR-19/03 &amp; Docket HWY18MH010: State Erasure and Action Suppression Under Deadlines</text>

  <!-- ========================================================================= -->
  <!-- TOP TIMELINE CONTAINER (x=30, y=56, w=900, h=296)                         -->
  <!-- ========================================================================= -->
  <rect x="30" y="56" width="900" height="296" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="56" width="900" height="26" rx="8" fill="#E2E8F0"/>
  <rect x="30" y="74" width="900" height="8" fill="#E2E8F0"/>
  <text x="42" y="73" class="panel-header" fill="#1E293B">A. NTSB FORENSIC SENSOR &amp; TRACKING STATE SEQUENCE (T - 5.6 s TO IMPACT)</text>
  <rect x="800" y="60" width="120" height="18" rx="9" fill="#FFFFFF"/>
  <text x="860" y="73" class="badge-txt" fill="#991B1B">NTSB/HAR-19/03</text>

  <!-- Time Axis: Left is T-5.6s, Right is T=0.0s Impact (x=100..880) -->
  <g transform="translate(45, 90)">
    <!-- Time axis line -->
    <line x1="50" y1="225" x2="800" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arr-red)"/>

    <!-- T-Ticks -->
    <!-- T - 5.6 s: x=70 -->
    <line x1="70" y1="220" x2="70" y2="230" stroke="#475569" stroke-width="1.5"/>
    <text x="70" y="242" class="axis-label" text-anchor="middle">T - 5.6 s</text>
    <text x="70" y="254" class="code-txt" text-anchor="middle" fill="#1E40AF">Range: 82 m</text>

    <!-- T - 4.4 s: x=210 -->
    <line x1="210" y1="220" x2="210" y2="230" stroke="#475569" stroke-width="1.5"/>
    <text x="210" y="242" class="axis-label" text-anchor="middle">T - 4.4 s</text>
    <text x="210" y="254" class="code-txt" text-anchor="middle" fill="#475569">Range: 65 m</text>

    <!-- T - 2.6 s: x=400 -->
    <line x1="400" y1="220" x2="400" y2="230" stroke="#475569" stroke-width="1.5"/>
    <text x="400" y="242" class="axis-label" text-anchor="middle">T - 2.6 s</text>
    <text x="400" y="254" class="code-txt" text-anchor="middle" fill="#475569">Range: 38 m</text>

    <!-- T - 1.2 s: x=580 -->
    <line x1="580" y1="220" x2="580" y2="230" stroke="#DC2626" stroke-width="2"/>
    <text x="580" y="242" class="axis-label" text-anchor="middle" fill="#DC2626">T - 1.2 s</text>
    <text x="580" y="254" class="code-txt" text-anchor="middle" fill="#DC2626">Range: 18 m</text>

    <!-- T - 0.2 s: x=700 -->
    <line x1="700" y1="220" x2="700" y2="230" stroke="#DC2626" stroke-width="2"/>
    <text x="700" y="242" class="axis-label" text-anchor="middle" fill="#DC2626">T - 0.2 s</text>
    <text x="700" y="254" class="code-txt" text-anchor="middle" fill="#DC2626">Range: 3.8 m</text>

    <!-- T = 0.0 s Impact: x=785 -->
    <line x1="785" y1="220" x2="785" y2="230" stroke="#DC2626" stroke-width="2"/>
    <text x="785" y="242" class="axis-label" text-anchor="middle" fill="#DC2626">T = 0.0 s</text>
    <text x="785" y="254" class="code-txt" text-anchor="middle" fill="#DC2626">Impact</text>

    <!-- ROW 1: Sensor Detection (LiDAR & Radar) -->
    <rect x="50" y="10" width="760" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="60" y="25" class="box-title" fill="#1E40AF">Sensor Contact:</text>
    <text x="60" y="40" class="body-txt">Continuous 64-beam LiDAR &amp; 77 GHz Radar detection across entire 5.6 seconds. Obstacle constantly tracked in raw point cloud.</text>

    <!-- ROW 2: Classification Toggling Sequence -->
    <rect x="50" y="60" width="760" height="66" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="60" y="76" class="box-title" fill="#B45309">Classification Toggling &amp; State Erasure (Kalman Filters Reset):</text>

    <!-- Toggle blocks -->
    <g transform="translate(60, 84)">
      <!-- Unknown -->
      <rect x="0" y="0" width="130" height="30" rx="3" fill="#E2E8F0" stroke="#94A3B8"/>
      <text x="65" y="16" class="code-txt" text-anchor="middle" fill="#334155">"Unknown Object"</text>
      <text x="65" y="26" class="body-txt" text-anchor="middle" fill="#64748B">T-5.6s to T-4.4s</text>

      <!-- Toggle Arrow -->
      <line x1="135" y1="15" x2="150" y2="15" stroke="#B45309" stroke-width="1.5" marker-end="url(#arr-red)"/>

      <!-- Vehicle -->
      <rect x="155" y="0" width="130" height="30" rx="3" fill="#FEE2E2" stroke="#F87171"/>
      <text x="220" y="16" class="code-txt" text-anchor="middle" fill="#991B1B">"Vehicle"</text>
      <text x="220" y="26" class="body-txt" text-anchor="middle" fill="#DC2626">Track Reset! (v=0)</text>

      <!-- Toggle Arrow -->
      <line x1="290" y1="15" x2="305" y2="15" stroke="#B45309" stroke-width="1.5" marker-end="url(#arr-red)"/>

      <!-- Other -->
      <rect x="310" y="0" width="120" height="30" rx="3" fill="#E2E8F0" stroke="#94A3B8"/>
      <text x="370" y="16" class="code-txt" text-anchor="middle" fill="#334155">"Other / Static"</text>
      <text x="370" y="26" class="body-txt" text-anchor="middle" fill="#DC2626">Track Reset! (v=0)</text>

      <!-- Toggle Arrow -->
      <line x1="435" y1="15" x2="450" y2="15" stroke="#B45309" stroke-width="1.5" marker-end="url(#arr-red)"/>

      <!-- Bicycle -->
      <rect x="455" y="0" width="130" height="30" rx="3" fill="#FEF3C7" stroke="#F59E0B"/>
      <text x="520" y="16" class="code-txt" text-anchor="middle" fill="#B45309">"Bicycle"</text>
      <text x="520" y="26" class="body-txt" text-anchor="middle" fill="#B45309">Path intersects lane</text>

      <!-- Toggle Arrow -->
      <line x1="590" y1="15" x2="605" y2="15" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

      <!-- Impact inevitable -->
      <rect x="610" y="0" width="130" height="30" rx="3" fill="#FEE2E2" stroke="#EF4444"/>
      <text x="675" y="16" class="code-txt" text-anchor="middle" fill="#DC2626">Collision Imminent</text>
      <text x="675" y="26" class="body-txt" text-anchor="middle" fill="#DC2626">T-1.2s (18 m away)</text>
    </g>

    <!-- ROW 3: Action Suppression Window -->
    <rect x="50" y="136" width="760" height="66" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="60" y="152" class="box-title" fill="#991B1B">The 1.2-Second Software Action Suppression Trap:</text>
    
    <!-- Action Suppression Bracket -->
    <g transform="translate(465, 156)">
      <rect x="0" y="0" width="220" height="36" rx="3" fill="#DC2626" opacity="0.15"/>
      <rect x="0" y="0" width="220" height="36" rx="3" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="110" y="15" class="code-txt" text-anchor="middle" fill="#991B1B">1.2 s ACTION SUPPRESSION DELAY</text>
      <text x="110" y="28" class="body-txt" text-anchor="middle" fill="#7F1D1D">Emergency braking suppressed to avoid "erratic behavior"</text>
    </g>

    <g transform="translate(695, 156)">
      <rect x="0" y="0" width="95" height="36" rx="3" fill="#DC2626"/>
      <text x="47" y="15" class="code-txt" text-anchor="middle" fill="#FFFFFF">Brake at 0.2s</text>
      <text x="47" y="28" class="badge-txt" fill="#FFFFFF">Clearance: 3.8m</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM PANELS: ROOT CAUSE & ARCHITECTURAL VETO (x=30..930, y=362..535)    -->
  <!-- ========================================================================= -->
  <!-- Left Bottom Card: Root Cause Breakdown -->
  <g transform="translate(30, 362)">
    <rect width="435" height="172" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="18" class="box-title" fill="#1E293B">Forensic Systems Engineering Breakdown</text>
    
    <text x="14" y="34" class="body-txt"><tspan font-weight="700">1. Perception Toggling State Erasure:</tspan> Software bound Kalman</text>
    <text x="24" y="47" class="body-txt">velocity filters to semantic labels. Toggling classification</text>
    <text x="24" y="60" class="body-txt">reset the filter and cleared estimated velocity to zero.</text>

    <text x="14" y="76" class="body-txt"><tspan font-weight="700">2. Artificial Suppression Latency:</tspan> Developers added a 1.2 s</text>
    <text x="24" y="89" class="body-txt">delay to avoid braking jitter. Traversal lag (d_lag = v₀ · t_suppress = 23 m)</text>
    <text x="24" y="102" class="body-txt">consumed 6× the remaining stopping distance.</text>

    <text x="14" y="118" class="body-txt"><tspan font-weight="700">3. Factory AEB Deactivation:</tspan> Factory Volvo emergency braking</text>
    <text x="24" y="131" class="body-txt">was disabled to prevent CAN bus torque arbitration conflicts.</text>

    <text x="14" y="152" class="code-txt" fill="#DC2626">Outcome: Kinetic collision at 39 mph without pre-impact braking.</text>
  </g>

  <!-- Right Bottom Card: The Deterministic Safety Enforcer Invariant -->
  <g transform="translate(495, 362)">
    <rect width="435" height="172" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="14" y="18" class="box-title" fill="#065F46">The Architectural Safety Invariant: The Part That Says NO</text>
    
    <text x="14" y="34" class="body-txt"><tspan font-weight="700">1. Geometric Clearance Over Semantic Labels:</tspan> Collision avoidance</text>
    <text x="24" y="47" class="body-txt">must depend strictly on geometric occupancy and range rate,</text>
    <text x="24" y="60" class="body-txt">decoupled from stochastic neural semantic classifiers.</text>

    <text x="14" y="76" class="body-txt"><tspan font-weight="700">2. Non-Preemptible Safety Floor:</tspan> Enforcers running on real-time</text>
    <text x="24" y="89" class="body-txt">MCU silicon must defend stopping budget: d_stop = v₀ T_lag + v₀² / (2 a_max).</text>

    <text x="14" y="105" class="body-txt"><tspan font-weight="700">3. Independent Veto Authority:</tspan> If distance breaches d_stop,</text>
    <text x="24" y="118" class="body-txt">the MCU triggers emergency braking, overriding upstream planners.</text>

    <text x="14" y="152" class="code-txt" fill="#047857">Guaranteed Outcome: Complete stop at T - 2.5 s with &gt;15 m margin.</text>
  </g>
</svg>
