<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 14.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.3px; }
      .main-subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; text-anchor: middle; }
      .panel-header { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 0.3px; }
      .box-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; }
      .body-txt { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #334155; line-height: 1.35; }
      .math-txt { font-family: "STIX Two Text", "Times New Roman", serif; font-style: italic; font-size: 10px; }
      .code-txt { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 8.8px; font-weight: 600; }
      .badge-txt { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 8.5px; text-anchor: middle; }
      .axis-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9px; fill: #475569; font-weight: 600; }
    </style>

    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="560" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="26" class="main-title">ELECTRIC MOTOR TORQUE-SPEED ENVELOPE AND CYCLIC THERMAL DUTY LIMITS</text>
  <text x="480" y="42" class="main-subtitle">Continuous S1 Thermal Equilibrium, Intermittent S3 Peak Acceleration, and Heating-Cooling Dynamics</text>

  <!-- ========================================================================= -->
  <!-- PANEL A: TORQUE-SPEED OPERATING ZONES (Left: x=30, y=56, w=435, h=480)     -->
  <!-- ========================================================================= -->
  <rect x="30" y="56" width="435" height="480" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="56" width="435" height="26" rx="8" fill="#E2E8F0"/>
  <rect x="30" y="74" width="435" height="8" fill="#E2E8F0"/>
  <text x="42" y="73" class="panel-header" fill="#1E293B">A. BLDC / PMSM TORQUE-SPEED OPERATING ENVELOPE</text>
  <rect x="375" y="60" width="80" height="18" rx="9" fill="#FFFFFF"/>
  <text x="415" y="73" class="badge-txt" fill="#1E40AF">Operating Zones</text>

  <!-- Graph Axes (Shifted right to x=80 so y-axis text never clips) -->
  <g transform="translate(85, 95)">
    <!-- Intermittent Operating Zone (S3) polygon: red tint -->
    <polygon points="35,30 220,30 295,120 295,225 35,225" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Continuous Operating Zone (S1) polygon: green tint -->
    <polygon points="35,130 170,130 235,225 35,225" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1.5"/>

    <!-- Graph axes -->
    <line x1="35" y1="225" x2="340" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-navy)"/>
    <line x1="35" y1="225" x2="35" y2="15" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-navy)"/>

    <text x="345" y="229" class="axis-label">Speed omega</text>
    <text x="35" y="10" class="axis-label" text-anchor="middle">Torque tau</text>

    <!-- Ticks & Labels on Y -->
    <line x1="30" y1="30" x2="35" y2="30" stroke="#475569" stroke-width="1.2"/>
    <text x="26" y="34" class="code-txt" text-anchor="end" fill="#991B1B">tau_peak (I_max)</text>

    <line x1="30" y1="130" x2="35" y2="130" stroke="#475569" stroke-width="1.2"/>
    <text x="26" y="134" class="code-txt" text-anchor="end" fill="#166534">tau_cont (S1)</text>

    <!-- Ticks & Labels on X -->
    <line x1="170" y1="225" x2="170" y2="230" stroke="#475569" stroke-width="1.2"/>
    <text x="170" y="242" class="code-txt" text-anchor="middle">omega_base</text>

    <line x1="295" y1="225" x2="295" y2="230" stroke="#475569" stroke-width="1.2"/>
    <text x="295" y="242" class="code-txt" text-anchor="middle">omega_max</text>

    <!-- Zone Labels on Graph -->
    <text x="85" y="165" class="box-title" fill="#166534">Zone 1: Continuous S1</text>
    <text x="85" y="180" class="body-txt" fill="#065F46">Thermal equilibrium: I²R = heat out</text>
    <text x="85" y="195" class="code-txt" fill="#166534">T_ss ≤ 155°C (Class F rating)</text>

    <text x="95" y="60" class="box-title" fill="#991B1B">Zone 2: Intermittent S3 Peak Zone</text>
    <text x="95" y="75" class="body-txt" fill="#7F1D1D">High acceleration transients; adiabatic heating</text>
    <text x="95" y="90" class="code-txt" fill="#991B1B">Thermal clock limit: t_on ≤ 10–30 s</text>

    <!-- Field Weakening Label -->
    <text x="215" y="130" class="code-txt" fill="#1F407A">Back-EMF Limit</text>
    <text x="215" y="143" class="body-txt" fill="#1E40AF">V_bus saturation: P = const</text>
  </g>

  <!-- Explanatory Cards in Panel A -->
  <g transform="translate(45, 360)">
    <rect width="405" height="162" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="17" class="box-title" fill="#1E293B">Electromechanical Boundary Invariants</text>
    
    <text x="12" y="33" class="body-txt"><tspan font-weight="700" fill="#166534">1. Continuous S1 Ceiling:</tspan> Motor operates indefinitely at or below τ_cont.</text>
    <text x="24" y="46" class="body-txt">Heat rejected across casing balances I²R: ΔT_ss = I_cont² R θ_JA.</text>

    <text x="12" y="62" class="body-txt"><tspan font-weight="700" fill="#991B1B">2. Intermittent S3 Peak:</tspan> Peak torque τ_peak delivers transient acceleration</text>
    <text x="24" y="75" class="body-txt">but drives adiabatic thermal rise (dT/dt ≈ I²R / C_th), bounded by t_on.</text>

    <text x="12" y="91" class="body-txt"><tspan font-weight="700" fill="#1E40AF">3. Base Speed Boundary:</tspan> At ω_base = (V_bus - IR)/K_e, back-EMF matches</text>
    <text x="24" y="104" class="body-txt">supply bus voltage. Above ω_base, torque degrades along 1/ω envelope.</text>

    <text x="12" y="120" class="body-txt"><tspan font-weight="700" fill="#B45309">4. Policy Risk:</tspan> Unconstrained neural policies commanding sustained peak</text>
    <text x="24" y="133" class="body-txt">stall torque trigger thermal trips in seconds without firmware veto.</text>

    <text x="12" y="150" class="code-txt" fill="#991B1B">Failure Mode: Inter-turn insulation breakdown &amp; magnet demagnetization.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL B: CYCLIC THERMAL DUTY DYNAMICS (Right: x=495, y=56, w=435, h=480)   -->
  <!-- ========================================================================= -->
  <rect x="495" y="56" width="435" height="480" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <rect x="495" y="56" width="435" height="26" rx="8" fill="#FDE68A"/>
  <rect x="495" y="74" width="435" height="8" fill="#FDE68A"/>
  <text x="507" y="73" class="panel-header" fill="#92400E">B. CYCLIC HEATING-COOLING PROFILE &amp; DUTY CYCLE</text>
  <rect x="835" y="60" width="85" height="18" rx="9" fill="#FFFFFF"/>
  <text x="877" y="73" class="badge-txt" fill="#B45309">Duty Limit</text>

  <!-- Thermal Trajectory Graph (x=510..915, y=95..345) -->
  <g transform="translate(535, 95)">
    <!-- Red Danger Zone above insulation limit -->
    <rect x="25" y="20" width="345" height="40" fill="#FEE2E2" opacity="0.6"/>
    <line x1="25" y1="60" x2="370" y2="60" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="365" y="54" class="code-txt" text-anchor="end" fill="#DC2626">T_insulation (Class F: 155°C)</text>

    <!-- Graph axes -->
    <line x1="25" y1="225" x2="370" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-navy)"/>
    <line x1="25" y1="225" x2="25" y2="15" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-navy)"/>

    <text x="375" y="229" class="axis-label">Time t</text>
    <text x="25" y="10" class="axis-label" text-anchor="middle">Temp T(t)</text>

    <text x="20" y="228" class="code-txt" text-anchor="end" fill="#475569">T_amb</text>

    <!-- Cyclic Thermal Curve: Heating during t_on, Cooling during t_off -->
    <path d="M 25 215 Q 55 135 80 125 Q 120 175 150 190 Q 175 115 200 100 Q 240 155 265 170 Q 290 95 315 80 Q 350 140 370 155" 
          fill="none" stroke="#DC2626" stroke-width="2.2"/>

    <!-- Steady State Envelope lines -->
    <line x1="25" y1="80" x2="370" y2="80" stroke="#B45309" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="365" y="74" class="code-txt" text-anchor="end" fill="#B45309">T_cyclic_max ≤ 140°C (15°C margin)</text>

    <!-- Intervals markers -->
    <line x1="25" y1="225" x2="25" y2="238" stroke="#64748B" stroke-width="1"/>
    <line x1="80" y1="225" x2="80" y2="238" stroke="#64748B" stroke-width="1"/>
    <line x1="150" y1="225" x2="150" y2="238" stroke="#64748B" stroke-width="1"/>
    <text x="52" y="237" class="code-txt" text-anchor="middle" fill="#991B1B">t_on</text>
    <text x="115" y="237" class="code-txt" text-anchor="middle" fill="#166534">t_off</text>

    <text x="87" y="252" class="body-txt" text-anchor="middle" fill="#475569">Cycle Period T_cycle = t_on + t_off</text>
  </g>

  <!-- Explanatory Cards in Panel B -->
  <g transform="translate(510, 360)">
    <rect width="405" height="162" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
    <text x="12" y="17" class="box-title" fill="#92400E">First-Order Thermal Energy Balance &amp; Duty Calculation</text>
    
    <text x="12" y="33" class="body-txt">Heating trajectory during peak on-time t_on (power loss P_peak = I_peak² R):</text>
    <text x="12" y="48" class="math-txt" fill="#991B1B">T(t) = T_0 e^{-t/τ} + (T_amb + P_peak θ_JA)(1 - e^{-t/τ}),   τ = θ_JA C_th</text>
    
    <line x1="12" y1="60" x2="390" y2="60" stroke="#FEF3C7" stroke-width="1"/>
    
    <text x="12" y="76" class="box-title" fill="#1E293B">Allowable Cyclic Duty Cycle Ceiling</text>
    <text x="12" y="92" class="body-txt">To prevent thermal runaway across repeated cycles, duty cycle D is capped:</text>
    <text x="12" y="108" class="math-txt" fill="#166534">D = t_on / (t_on + t_off) ≤ (T_max - T_amb) / (P_peak θ_JA)</text>
    
    <text x="12" y="126" class="code-txt" fill="#92400E">Required cooling interval: t_off ≥ t_on · ((1 - D) / D)</text>
    <text x="12" y="142" class="body-txt" fill="#64748B">Real-time firmware observer accumulates I²t integrator to veto subsequent peaks.</text>
  </g>
</svg>
