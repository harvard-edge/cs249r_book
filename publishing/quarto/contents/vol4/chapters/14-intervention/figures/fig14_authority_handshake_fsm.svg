<rect width="920" height="525" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="460.0" y="28" class="title">THE FOUR-PHASE AUTHORITY HANDSHAKE PROTOCOL &amp; DISCRETE STATE ARBITER</text>
<text x="460.0" y="44" class="subtitle">Deterministic 1 kHz Nervous-System Handshake: Autonomous Propose ⟶ Hardware Intercept ⟶ Operator Acknowledge ⟶ Bumpless Ramp ⟶ Active Authority</text>
<rect x="25" y="60" width="870" height="120" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
<text x="40" y="76" font-size="9.5" font-weight="700" fill="#1F407A" letter-spacing="0.4px">FOUR-PHASE AUTHORITY HANDSHAKE PIPELINE (1 kHz SYNCHRONOUS BUS)</text>
<rect x="35" y="84" width="196" height="84" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="35" y="84" width="196" height="19" rx="6" fill="#215CAF" fill-opacity="0.12"/>
<text x="45" y="97" font-size="8.5" font-weight="700" fill="#215CAF">PHASE 1 · REQUEST</text>
<text x="45" y="115" font-size="9" font-weight="700" fill="#1A202C">Initiation Trigger</text>
<text x="45" y="129" font-size="7.5" fill="#475569">• Operator torque |τ| &gt; 4.0 N·m</text>
<text x="45" y="141" font-size="7.5" fill="#475569">• or Policy ODD boundary departure</text>
<text x="45" y="153" font-size="7.5" fill="#475569">• u_prop flagged with lease intent</text>
<line x1="233" y1="126.0" x2="249" y2="126.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-slate)"/>
<rect x="252" y="84" width="196" height="84" rx="6" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="252" y="84" width="196" height="19" rx="6" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="262" y="97" font-size="8.5" font-weight="700" fill="#5B4B8A">PHASE 2 · INTERCEPT &amp; AUTH</text>
<text x="262" y="115" font-size="9" font-weight="700" fill="#1A202C">Hardware Verification</text>
<text x="262" y="129" font-size="7.5" fill="#475569">• 1 kHz MCU intercepts token</text>
<text x="262" y="141" font-size="7.5" fill="#475569">• HMAC-SHA256 &amp; Nonce verified</text>
<text x="262" y="153" font-size="7.5" fill="#475569">• Freshness: Δt_transit ≤ 100 ms</text>
<line x1="450" y1="126.0" x2="466" y2="126.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-slate)"/>
<rect x="470" y="84" width="196" height="84" rx="6" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="470" y="84" width="196" height="19" rx="6" fill="#B87333" fill-opacity="0.12"/>
<text x="480" y="97" font-size="8.5" font-weight="700" fill="#B87333">PHASE 3 · COMMIT &amp; BLEND</text>
<text x="480" y="115" font-size="9" font-weight="700" fill="#1A202C">Bumpless Ramp</text>
<text x="480" y="129" font-size="7.5" fill="#475569">• Atomic swap at 1 ms tick</text>
<text x="480" y="141" font-size="7.5" fill="#475569">• C¹ blend: α(t) over τ_blend</text>
<text x="480" y="153" font-size="7.5" fill="#475569">• Integrators pre-biased to x(t)</text>
<line x1="668" y1="126.0" x2="684" y2="126.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-slate)"/>
<rect x="688" y="84" width="196" height="84" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="688" y="84" width="196" height="19" rx="6" fill="#10B981" fill-opacity="0.12"/>
<text x="698" y="97" font-size="8.5" font-weight="700" fill="#10B981">PHASE 4 · CONFIRM &amp; ACTIVE</text>
<text x="698" y="115" font-size="9" font-weight="700" fill="#1A202C">Active Authority</text>
<text x="698" y="129" font-size="7.5" fill="#475569">• Haptic confirmation alert</text>
<text x="698" y="141" font-size="7.5" fill="#475569">• Human in command (α = 1.0)</text>
<text x="698" y="153" font-size="7.5" fill="#475569">• Active lease (T_lease ≤ 100 ms)</text>
<rect x="25" y="194" width="555" height="316" rx="8" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="25" y="194" width="555" height="24" rx="8" fill="#1F407A" fill-opacity="0.10"/>
<text x="39" y="210" font-size="9.5" font-weight="700" fill="#1F407A">DISCRETE AUTHORITY STATE MACHINE (S_t ∈ &#123;Auto, Pending, Blend, Manual, Fallback&#125;)</text>
<rect x="37" y="230" width="140" height="88" rx="6" fill="#215CAF" fill-opacity="0.04" stroke="#215CAF" stroke-width="1.2"/>
<rect x="37" y="230" width="140" height="18" rx="6" fill="#215CAF" fill-opacity="0.15"/>
<text x="45" y="243" font-size="8.5" font-weight="700" fill="#215CAF">S_auto · AUTONOMOUS</text>
<text x="45" y="260" font-size="8" font-weight="600" fill="#1A202C">Authority: Policy (α = 0.0)</text>
<text x="45" y="274" font-size="7.5" fill="#475569">• Action chunks p_t</text>
<text x="45" y="288" font-size="7.5" fill="#475569">• 1 kHz Enforcer bounds</text>
<text x="45" y="302" font-size="7.5" fill="#475569">• State tracking active</text>
<rect x="232" y="230" width="140" height="88" rx="6" fill="#D97706" fill-opacity="0.05" stroke="#D97706" stroke-width="1.2"/>
<rect x="232" y="230" width="140" height="18" rx="6" fill="#D97706" fill-opacity="0.15"/>
<text x="240" y="243" font-size="8.5" font-weight="700" fill="#D97706">S_pending · PENDING</text>
<text x="240" y="260" font-size="8" font-weight="600" fill="#1A202C">Authority: Intercept</text>
<text x="240" y="274" font-size="7.5" fill="#475569">• Timer T_timeout armed</text>
<text x="240" y="288" font-size="7.5" fill="#475569">• Token &amp; nonce check</text>
<text x="240" y="302" font-size="7.5" fill="#DC2626">• Timeout: 500 ms limit</text>
<rect x="427" y="230" width="140" height="88" rx="6" fill="#B87333" fill-opacity="0.05" stroke="#B87333" stroke-width="1.2"/>
<rect x="427" y="230" width="140" height="18" rx="6" fill="#B87333" fill-opacity="0.15"/>
<text x="435" y="243" font-size="8.5" font-weight="700" fill="#B87333">S_blend · BUMPLESS</text>
<text x="435" y="260" font-size="8" font-weight="600" fill="#1A202C">Authority: Dynamic Blend</text>
<text x="435" y="274" font-size="7.5" fill="#475569">• C¹ cubic schedule α(t)</text>
<text x="435" y="288" font-size="7.5" fill="#475569">• Window τ_blend ≥ 1.5|Δu|/j</text>
<text x="435" y="302" font-size="7.5" fill="#475569">• Jerk bounded: j ≤ j_max</text>
<rect x="37" y="389" width="235" height="106" rx="6" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="1.3"/>
<rect x="37" y="389" width="235" height="18" rx="6" fill="#DC2626" fill-opacity="0.15"/>
<text x="45" y="402" font-size="8.5" font-weight="700" fill="#DC2626">S_fallback · DEGRADED FALLBACK</text>
<text x="45" y="419" font-size="8" font-weight="600" fill="#1A202C">Category 1 Controlled Deceleration</text>
<text x="45" y="434" font-size="7.5" fill="#475569">• Dynamic braking: a_brake = μ·g (6.87 m/s²)</text>
<text x="45" y="448" font-size="7.5" fill="#475569">• Monotonic lock: No upward transitions</text>
<text x="45" y="462" font-size="7.5" fill="#475569">• Forensic freeze: 10s pre/post trigger window</text>
<text x="45" y="476" font-size="7.5" fill="#10B981">• Exit: Zero velocity (v = 0) + Signed Re-init</text>
<rect x="332" y="389" width="235" height="106" rx="6" fill="#10B981" fill-opacity="0.05" stroke="#10B981" stroke-width="1.3"/>
<rect x="332" y="389" width="235" height="18" rx="6" fill="#10B981" fill-opacity="0.15"/>
<text x="340" y="402" font-size="8.5" font-weight="700" fill="#10B981">S_manual · ACTIVE HUMAN MANUAL</text>
<text x="340" y="419" font-size="8" font-weight="600" fill="#1A202C">Authority: Human Operator (α = 1.0)</text>
<text x="340" y="434" font-size="7.5" fill="#475569">• Direct steering &amp; torque dispatch</text>
<text x="340" y="448" font-size="7.5" fill="#475569">• Deadman keep-alive (T_lease ≤ 100 ms)</text>
<text x="340" y="462" font-size="7.5" fill="#007A87">• Subordinate to Tier-1 Safety Barrier h(x) ≥ 0</text>
<text x="340" y="476" font-size="7.5" fill="#64748B">• Shadow logging of background policy</text>
<line x1="177" y1="274" x2="232" y2="274" stroke="#D97706" stroke-width="1.6" marker-end="url(#arr-bronze)"/>
<rect x="180.5" y="254" width="48" height="15" rx="3" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8"/>
<text x="204.5" y="265" font-size="6.8" font-weight="700" fill="#D97706" text-anchor="middle">Override</text>
<line x1="372" y1="274" x2="427" y2="274" stroke="#B87333" stroke-width="1.6" marker-end="url(#arr-bronze)"/>
<rect x="373.5" y="254" width="52" height="15" rx="3" fill="#FFFFFF" stroke="#B87333" stroke-width="0.8"/>
<text x="399.5" y="265" font-size="6.8" font-weight="700" fill="#B87333" text-anchor="middle">Ack &amp; Auth</text>
<line x1="497.0" y1="318" x2="479.5" y2="389" stroke="#10B981" stroke-width="1.6" marker-end="url(#arr-teal)"/>
<rect x="437.0" y="364" width="115" height="15" rx="3" fill="#FFFFFF" stroke="#10B981" stroke-width="0.8"/>
<text x="495.0" y="375" font-size="6.8" font-weight="700" fill="#10B981" text-anchor="middle">Ramp Complete (α = 1.0)</text>
<line x1="302.0" y1="318" x2="174.5" y2="389" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-coral)"/>
<rect x="202" y="336" width="145" height="15" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8"/>
<text x="274" y="347" font-size="6.8" font-weight="700" fill="#DC2626" text-anchor="middle">Timeout t &gt; T_timeout (500 ms)</text>
<line x1="332" y1="442" x2="272" y2="442" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arr-coral)"/>
<rect x="267.0" y="425" width="70" height="34" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8"/>
<text x="302.0" y="438" font-size="6.5" font-weight="700" fill="#DC2626" text-anchor="middle">Lease Lost</text>
<text x="302.0" y="450" font-size="6.2" fill="#64748B" text-anchor="middle">&gt;100 ms loss</text>
<path d="M 62 389 C 62 343, 62 343, 62 318" fill="none" stroke="#215CAF" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<rect x="29" y="333" width="76" height="14" rx="3" fill="#FFFFFF" stroke="#215CAF" stroke-width="0.8"/>
<text x="67" y="343" font-size="6.5" font-weight="700" fill="#215CAF" text-anchor="middle">v = 0 &amp; Reset</text>
<rect x="590" y="194" width="305" height="316" rx="8" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="590" y="194" width="305" height="24" rx="8" fill="#5B4B8A" fill-opacity="0.10"/>
<text x="604" y="210" font-size="9.5" font-weight="700" fill="#5B4B8A">3-TIER ARBITRATION &amp; EVIDENCE AUDIT</text>
<rect x="600" y="226" width="285" height="52" rx="5" fill="#007A87" fill-opacity="0.05" stroke="#007A87" stroke-width="1"/>
<rect x="600" y="226" width="4" height="52" rx="2" fill="#007A87"/>
<text x="610" y="240" font-size="8" font-weight="700" fill="#007A87">TIER 1 · ABSOLUTE VETO (MCU REFLEX)</text>
<text x="610" y="253" font-size="7.5" font-weight="600" fill="#1A202C">1000 Hz Hard Real-Time Safety Enforcer</text>
<text x="610" y="265" font-size="7" fill="#475569">CBF Invariant: h(x) ≥ 0 · Current/thermal limits</text>
<text x="610" y="274" font-size="7" fill="#475569">Zero dynamic malloc · Rejects unsafe commands</text>
<rect x="600" y="283" width="285" height="52" rx="5" fill="#10B981" fill-opacity="0.05" stroke="#10B981" stroke-width="1"/>
<rect x="600" y="283" width="4" height="52" rx="2" fill="#10B981"/>
<text x="610" y="297" font-size="8" font-weight="700" fill="#10B981">TIER 2 · SUPERVISORY OVERRIDE</text>
<text x="610" y="310" font-size="7.5" font-weight="600" fill="#1A202C">Authenticated Human Input (α = 1.0)</text>
<text x="610" y="322" font-size="7" fill="#475569">Bounded deadman lease (T_lease ≤ 100 ms)</text>
<text x="610" y="331" font-size="7" fill="#475569">Overrides learned policy setpoints unconditionally</text>
<rect x="600" y="340" width="285" height="52" rx="5" fill="#215CAF" fill-opacity="0.05" stroke="#215CAF" stroke-width="1"/>
<rect x="600" y="340" width="4" height="52" rx="2" fill="#215CAF"/>
<text x="610" y="354" font-size="8" font-weight="700" fill="#215CAF">TIER 3 · PROPOSAL STREAM (STOCHASTIC)</text>
<text x="610" y="367" font-size="7.5" font-weight="600" fill="#1A202C">20–50 Hz Host MPU Action Chunks</text>
<text x="610" y="379" font-size="7" fill="#475569">Candidate action buffer u_prop (Diffusion / ACT)</text>
<text x="610" y="388" font-size="7" fill="#475569">Admitted only when S_t = S_auto &amp; Tier 1 clear</text>
<rect x="600" y="399" width="285" height="86" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
<text x="610" y="414" font-size="8.5" font-weight="700" fill="#1A202C">64-BYTE FORENSIC EVIDENCE TUPLE</text>
<text x="610" y="427" font-size="7.2" font-family="monospace" fill="#1F407A">⟨t_PTP, S_auth, x_state, u_prop, u_enf, u_act, ID_op⟩</text>
<text x="610" y="442" font-size="7.2" fill="#475569">• IEEE 1588 PTP hardware timestamps (&lt;100 ns uncertainty)</text>
<text x="610" y="455" font-size="7.2" fill="#475569">• SHA-256 HMAC hash chaining into write-once ring buffer</text>
<text x="610" y="468" font-size="7.2" fill="#475569">• Deterministic logging: &lt;4 µs latency (zero dynamic malloc)</text>
</svg>
