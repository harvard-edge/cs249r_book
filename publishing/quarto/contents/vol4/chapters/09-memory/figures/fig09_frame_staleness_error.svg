<text x="538" y="275" font-size="8.5" font-weight="700" fill="#10B981">✓ LOUD FAILURE: MISSING / DROPPED TRANSFORM</text>
<text x="538" y="289" font-size="7.5" fill="#475569">• Sensor link drops; frame tree records null edge.</text>
<text x="538" y="301" font-size="7.5" fill="#475569">• Matrix traversal raises FRAME_NOT_FOUND exception.</text>
<text x="538" y="313" font-size="7.5" font-weight="600" fill="#1A202C">• Result: Deterministic emergency stop / safe position hold.</text>
<rect x="530" y="331" width="340" height="70" rx="5" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-width="1"/>
<text x="538" y="347" font-size="8.5" font-weight="700" fill="#DC2626">✕ SILENT FAILURE: FROZEN / REPUBLISHED MATRIX</text>
<text x="538" y="361" font-size="7.5" fill="#475569">• Middleware republishes cached pose with fresh OS timestamp.</text>
<text x="538" y="373" font-size="7.5" fill="#475569">• Downstream linear algebra evaluates with zero exceptions.</text>
<text x="538" y="385" font-size="7.5" font-weight="600" fill="#DC2626">• Result: Trajectory planner drives tool into solid fixture.</text>
<rect x="530" y="407" width="340" height="22" rx="3" fill="#1F407A"/>
<text x="700.0" y="421" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">RULE: Transforms MUST carry immutable evidence epoch t_e.</text>
