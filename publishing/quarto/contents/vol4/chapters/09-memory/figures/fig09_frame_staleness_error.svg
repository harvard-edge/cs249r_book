<text x="270.0" y="418" font-size="7.5" fill="#475569" text-anchor="middle">Uncompensated 40 ms lag drives end-effector into solid fixture during trajectory execution.</text>
<rect x="520" y="68" width="360" height="145" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="520" y="68" width="360" height="26" rx="8 8 0 0" fill="#1F407A"/>
<text x="700.0" y="85" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">KINEMATIC LEVER-ARM ARITHMETIC</text>
<text x="532" y="110" font-size="8" font-weight="700" fill="#1A202C">• Translational Drift:</text>
<text x="540" y="121" font-size="7.5" fill="#475569">e_trans = v · Δt = 0.80 m/s × 0.040 s = 3.20 cm</text>
<text x="532" y="134" font-size="8" font-weight="700" fill="#1A202C">• Rotational Arc Deflection:</text>
<text x="540" y="145" font-size="7.5" fill="#475569">e_rot ≈ ℓ · (ω · Δt) = 0.60 m × (1.50 × 0.040) = 3.60 cm</text>
<text x="532" y="158" font-size="8" font-weight="700" fill="#1A202C">• Total Tool-Point Offset:</text>
<text x="540" y="169" font-size="7.5" fill="#475569">e_tool ≈ e_trans + e_rot = 3.20 + 3.60 = 6.80 cm (68.0 mm)</text>
<text x="532" y="182" font-size="8" font-weight="700" fill="#1A202C">• Task Safety Clearance:</text>
<text x="540" y="193" font-size="7.5" fill="#475569">ε_tol = 0.50 mm (Exceeded by 136× within 40 ms!)</text>
<rect x="520" y="225" width="360" height="211" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="520" y="225" width="360" height="26" rx="8 8 0 0" fill="#5B4B8A"/>
