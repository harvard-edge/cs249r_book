<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.2px; }
      .subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .realm-tag { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; }
      .card-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; }
      .card-body { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .math-expr { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; }
      .card-sub { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748B; font-style: italic; }
      .pill-text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 700; text-anchor: middle; }
      .port-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; fill: #475569; text-anchor: middle; font-weight: 600; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E40AF"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="570" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="28" class="title">THE CAUSAL CLOSED LOOP OF PHYSICAL AI</text>
  <text x="480" y="45" class="subtitle">Digital Policy Deliberation across the Causal Boundary to Thermodynamic Actuation and Endogenous Observation Shift</text>

  <!-- TOP CONTAINER: Untrusted Computational Realm (MPU/NPU) -->
  <rect x="42" y="62" width="876" height="142" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <path d="M 42 70 Q 42 62 50 62 L 910 62 Q 918 62 918 70 L 918 88 L 42 88 Z" fill="#EEF2F6"/>
  <text x="56" y="80" class="realm-tag" fill="#1E40AF">UNTRUSTED COMPUTATIONAL REALM · HOST LINUX MPU / EDGE NPU</text>
  <text x="904" y="80" class="realm-tag" fill="#64748B" text-anchor="end">IDEMPOTENT · REVERSIBLE · SOFTWARE ROLLBACKS</text>

  <!-- Card 1: Sensory Ingestion -->
  <g transform="translate(55, 96)">
    <rect width="250" height="96" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="14" y="20" class="card-title" fill="#1E3A8A">1. Sensory Ingestion</text>
    <text x="14" y="38" class="card-body">Multi-Camera · LiDAR · IMU · Encoders</text>
    <text x="14" y="56" class="math-expr" fill="#1E40AF">o_t ∈ ℝ^d (Observation Vector)</text>
    <text x="14" y="74" class="card-sub">Hardware PTP timestamping &amp; sync</text>
    <rect x="180" y="70" width="58" height="18" rx="9" fill="#EFF6FF"/>
    <text x="209" y="83" class="pill-text" fill="#1D4ED8">10–100 Hz</text>
  </g>

  <!-- Connection: 1 -> 2 -->
  <line x1="305" y1="144" x2="353" y2="144" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="329" y="126" class="port-label">Tokens</text>

  <!-- Card 2: Neural Policy Deliberation -->
  <g transform="translate(355, 96)">
    <rect width="250" height="96" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="14" y="20" class="card-title" fill="#1E3A8A">2. Cognitive Policy Deliberation</text>
    <text x="14" y="38" class="card-body">VLA · Diffusion Policy · World Model</text>
    <text x="14" y="56" class="math-expr" fill="#1E40AF">â_t ~ π_θ(o_t) (Action Proposal)</text>
    <text x="14" y="74" class="card-sub">Zero direct electrical actuator access</text>
    <rect x="180" y="70" width="58" height="18" rx="9" fill="#EFF6FF"/>
    <text x="209" y="83" class="pill-text" fill="#1D4ED8">10–50 Hz</text>
  </g>

  <!-- Connection: 2 -> 3 (SRAM Mailbox / IPC) -->
  <line x1="605" y1="144" x2="653" y2="144" stroke="#0F766E" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-teal)"/>
  <text x="629" y="124" class="port-label" fill="#0F766E">SRAM</text>
  <text x="629" y="136" class="port-label" fill="#0F766E" font-size="8.5px">Mailbox</text>

  <!-- Card 3: Deterministic Safety Referee -->
  <g transform="translate(655, 96)">
    <rect width="250" height="96" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
    <text x="14" y="20" class="card-title" fill="#0F766E">3. Real-Time Safety Referee</text>
    <text x="14" y="38" class="card-body">Control Barrier Function (CBF-QP)</text>
    <text x="14" y="56" class="math-expr" fill="#0F766E">ḣ(x) + γ h(x) ≥ 0 (Safe Gate)</text>
    <text x="14" y="74" class="card-sub">Zero-allocation 1 kHz hardware referee</text>
    <rect x="180" y="70" width="58" height="18" rx="9" fill="#F0FDFA"/>
    <text x="209" y="83" class="pill-text" fill="#0F766E">1000 Hz</text>
  </g>

  <!-- THE CAUSAL BOUNDARY BANNER -->
  <line x1="42" y1="230" x2="918" y2="230" stroke="#991B1B" stroke-width="1.8" stroke-dasharray="8,5"/>
  <g transform="translate(190, 216)">
    <rect width="550" height="28" rx="6" fill="#991B1B"/>
    <text x="275" y="18" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5px" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1px">THE CAUSAL BOUNDARY: MEMORY-MAPPED REGISTER WRITE (TIMx_CCR)</text>
  </g>

  <!-- Permission Gate Transition Line & Badge -->
  <line x1="780" y1="192" x2="780" y2="230" stroke="#0F766E" stroke-width="2"/>
  <line x1="780" y1="230" x2="780" y2="310" stroke="#991B1B" stroke-width="2.2" marker-end="url(#arr-crimson)"/>
  <rect x="794" y="248" width="118" height="22" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="1"/>
  <text x="853" y="263" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#991B1B" text-anchor="middle">u_t ∈ U_safe (Committed)</text>

  <!-- BOTTOM CONTAINER: Physical Reality & Actuation Realm -->
  <rect x="42" y="280" width="876" height="142" rx="8" fill="#FFFDFD" stroke="#FECACA" stroke-width="1.2"/>
  <path d="M 42 288 Q 42 280 50 280 L 910 280 Q 918 280 918 288 L 918 306 L 42 306 Z" fill="#FEE2E2"/>
  <text x="56" y="298" class="realm-tag" fill="#991B1B">PHYSICAL REALITY · ACTUATION, DYNAMICS &amp; THERMODYNAMICS</text>
  <text x="904" y="298" class="realm-tag" fill="#991B1B" text-anchor="end">NON-REVERSIBLE · THERMODYNAMIC WORK · JOULE HEAT (I²R)</text>

  <!-- Card 4: Inverter & Motor Windings -->
  <g transform="translate(55, 314)">
    <rect width="250" height="96" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
    <text x="14" y="20" class="card-title" fill="#991B1B">4. Power Inverter &amp; Windings</text>
    <text x="14" y="38" class="card-body">Gate Drivers · 3-Phase Inverter</text>
    <text x="14" y="56" class="math-expr" fill="#991B1B">Q = I² R Δt (Joule Heat)</text>
    <text x="14" y="74" class="card-sub">Lorentz force &amp; magnetic flux linkage</text>
    <rect x="175" y="70" width="65" height="18" rx="9" fill="#FEF2F2"/>
    <text x="207.5" y="83" class="pill-text" fill="#DC2626">20–100 kHz</text>
  </g>

  <!-- Connection: 4 -> 5 -->
  <line x1="305" y1="362" x2="353" y2="362" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arr-crimson)"/>
  <text x="329" y="350" class="port-label" fill="#991B1B">Torque τ</text>

  <!-- Card 5: Mechanical Plant Dynamics -->
  <g transform="translate(355, 314)">
    <rect width="250" height="96" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
    <text x="14" y="20" class="card-title" fill="#991B1B">5. Mechanical Dynamics</text>
    <text x="14" y="38" class="card-body">Inertia · Friction · Transmissions</text>
    <text x="14" y="56" class="math-expr" fill="#991B1B">τ = M(q)q̈ + C(q,q̇)q̇ + g(q)</text>
    <text x="14" y="74" class="card-sub">Reflected inertia &amp; momentum p=mv</text>
    <rect x="175" y="70" width="65" height="18" rx="9" fill="#FEF2F2"/>
    <text x="207.5" y="83" class="pill-text" fill="#DC2626">Continuous</text>
  </g>

  <!-- Connection: 5 -> 6 -->
  <line x1="605" y1="362" x2="653" y2="362" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arr-crimson)"/>
  <text x="629" y="350" class="port-label" fill="#991B1B">Work F·dx</text>

  <!-- Card 6: Physical Environment -->
  <g transform="translate(655, 314)">
    <rect width="250" height="96" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
    <text x="14" y="20" class="card-title" fill="#991B1B">6. Physical Environment</text>
    <text x="14" y="38" class="card-body">Contact Mechanics · Spatial State</text>
    <text x="14" y="56" class="math-expr" fill="#991B1B">W_{t+1} = f_env(W_t, u_t)</text>
    <text x="14" y="74" class="card-sub">Delay as displacement: Δx = ∫ v dt</text>
    <rect x="175" y="70" width="65" height="18" rx="9" fill="#FEF2F2"/>
    <text x="207.5" y="83" class="pill-text" fill="#DC2626">Irreversible</text>
  </g>

  <!-- FEEDBACK LOOP: Endogenous Observation Shift -->
  <!-- 1. From Card 6 bottom down into Banner top -->
  <line x1="780" y1="410" x2="780" y2="465" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-petrol)"/>

  <!-- Bottom Banner (Generous width to contain full equation) -->
  <g transform="translate(95, 465)">
    <rect width="770" height="34" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.4"/>
    <text x="385" y="21" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#0369A1" text-anchor="middle">
      ENDOGENOUS SENSORY FEEDBACK: <tspan font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5px">o_{t+1} ~ P(O | s_{t+1}, W_{t+1})</tspan> — Actions reshape future sensory observations
    </text>
  </g>

  <!-- 2. From left of banner around to Card 1 -->
  <line x1="95" y1="482" x2="24" y2="482" stroke="#0284C7" stroke-width="2"/>
  <line x1="24" y1="482" x2="24" y2="144" stroke="#0284C7" stroke-width="2"/>
  <line x1="24" y1="144" x2="53" y2="144" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-petrol)"/>

</svg>
