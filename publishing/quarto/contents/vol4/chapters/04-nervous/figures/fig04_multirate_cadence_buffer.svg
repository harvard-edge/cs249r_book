<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.2px; }
      .subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .realm-tag { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; }
      .card-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .card-body { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #334155; }
      .math-expr { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 600; }
      .card-sub { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #64748B; font-style: italic; }
      .pill-text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; text-anchor: middle; }
      .port-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; fill: #475569; text-anchor: middle; font-weight: 600; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E40AF"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B45309"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="570" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="28" class="title">MULTI-RATE EXECUTION CADENCE &amp; LOCK-FREE TRIPLE-BUFFER PROTOCOL</text>
  <text x="480" y="45" class="subtitle">Decoupling Slow Deliberative Planning (20–50 Hz) from Fast Real-Time Motor Control (1000 Hz) via Hardware Sequence Locks</text>

  <!-- PANEL A: Three Cadence Hierarchy (Left Box, width=420) -->
  <rect x="36" y="64" width="430" height="420" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <path d="M 36 72 Q 36 64 44 64 L 458 64 Q 466 64 466 72 L 466 90 L 36 90 Z" fill="#EEF2F6"/>
  <text x="48" y="81" class="realm-tag" fill="#1E40AF">PANEL A: HIERARCHICAL TIME CADENCES</text>

  <!-- Cadence 1: Deliberative Intent -->
  <g transform="translate(48, 100)">
    <rect width="406" height="88" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="12" y="20" class="card-title" fill="#1E3A8A">1. Deliberative Intent &amp; VLA Backbone</text>
    <text x="12" y="38" class="card-body">Substrate: Linux Host / Edge NPU (Multi-modal Transformer)</text>
    <text x="12" y="56" class="math-expr" fill="#1E40AF">Cadence: 1–5 Hz · Latency: 200–1000 ms · Non-deterministic</text>
    <text x="12" y="74" class="card-sub">Emits high-level goal leases &amp; spatial affordance bounding boxes</text>
    <rect x="330" y="58" width="64" height="18" rx="9" fill="#EFF6FF"/>
    <text x="362" y="71" class="pill-text" fill="#1D4ED8">1–5 Hz</text>
  </g>

  <!-- Cadence 2: Generative Action Chunking -->
  <g transform="translate(48, 200)">
    <rect width="406" height="88" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="12" y="20" class="card-title" fill="#B45309">2. Generative Trajectory Planner (ACT / Diffusion)</text>
    <text x="12" y="38" class="card-body">Substrate: Edge GPU / NPU Kernel (Action Chunking Horizon H=16)</text>
    <text x="12" y="56" class="math-expr" fill="#B45309">Cadence: 20–50 Hz · Chunk Period: Δt_chunk = 20–50 ms</text>
    <text x="12" y="74" class="card-sub">Writes smooth trajectory chunks p_t into shared memory mailbox</text>
    <rect x="330" y="58" width="64" height="18" rx="9" fill="#FEF3C7"/>
    <text x="362" y="71" class="pill-text" fill="#B45309">20–50 Hz</text>
  </g>

  <!-- Cadence 3: Hard Real-Time Reflex & Safety -->
  <g transform="translate(48, 300)">
    <rect width="406" height="88" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="20" class="card-title" fill="#065F46">3. Real-Time Safety Referee &amp; Motor Loop</text>
    <text x="12" y="38" class="card-body">Substrate: Lock-Step MCU / FreeRTOS (Control Barrier Functions)</text>
    <text x="12" y="56" class="math-expr" fill="#065F46">Cadence: 1000 Hz · Jitter: &lt; 5 µs · Hard Deadline: 1.0 ms</text>
    <text x="12" y="74" class="card-sub">Interpolates spline waypoints; verifies dynamic stopping clearance</text>
    <rect x="330" y="58" width="64" height="18" rx="9" fill="#D1FAE5"/>
    <text x="362" y="71" class="pill-text" fill="#065F46">1000 Hz</text>
  </g>

  <!-- Cadence 4: Inverter Switching -->
  <g transform="translate(48, 400)">
    <rect width="406" height="72" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2"/>
    <text x="12" y="20" class="card-title" fill="#991B1B">4. Field-Oriented Current Control (FOC)</text>
    <text x="12" y="38" class="math-expr" fill="#991B1B">Cadence: 20–100 kHz · Hardware PWM Timers (TIMx_CCR)</text>
    <text x="12" y="56" class="card-sub">Closes inner stator current loop; delivers phase voltage to windings</text>
    <rect x="330" y="44" width="64" height="18" rx="9" fill="#FEE2E2"/>
    <text x="362" y="57" class="pill-text" fill="#991B1B">20–100 kHz</text>
  </g>

  <!-- PANEL B: Lock-Free Triple-Buffer Mailbox (Right Box, width=446) -->
  <rect x="484" y="64" width="440" height="420" rx="8" fill="#FFFDF8" stroke="#FCD34D" stroke-width="1.2"/>
  <path d="M 484 72 Q 484 64 492 64 L 916 64 Q 924 64 924 72 L 924 90 L 484 90 Z" fill="#FEF3C7"/>
  <text x="496" y="81" class="realm-tag" fill="#B45309">PANEL B: LOCK-FREE SEQUENCE LOCK PROTOCOL</text>

  <!-- Triple-Buffer Slots -->
  <!-- Slot 0: Write Slot -->
  <g transform="translate(496, 100)">
    <rect width="416" height="74" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
    <rect x="8" y="8" width="80" height="20" rx="4" fill="#FEF3C7"/>
    <text x="48" y="22" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#B45309" text-anchor="middle">SLOT 0</text>
    <text x="96" y="22" class="card-title" fill="#B45309">Writer Active Slot (seq = 2k+1)</text>
    <text x="12" y="44" class="card-body">Generative Planner writing new Action Chunk</text>
    <text x="12" y="60" class="math-expr" fill="#475569">p_t[0..15] = {q_k, q̇_k, τ_k} · seq++ on entry/exit</text>
    <rect x="336" y="44" width="68" height="18" rx="9" fill="#FEF3C7"/>
    <text x="370" y="57" class="pill-text" fill="#B45309">Writer Locked</text>
  </g>

  <!-- Slot 1: Committed Valid Slot -->
  <g transform="translate(496, 184)">
    <rect width="416" height="74" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
    <rect x="8" y="8" width="80" height="20" rx="4" fill="#D1FAE5"/>
    <text x="48" y="22" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#065F46" text-anchor="middle">SLOT 1</text>
    <text x="96" y="22" class="card-title" fill="#065F46">Committed Valid Mailbox (seq = 2k)</text>
    <text x="12" y="44" class="card-body">Complete, consistent chunk published for consumption</text>
    <text x="12" y="60" class="math-expr" fill="#065F46">Memory Barrier: __atomic_thread_fence(memory_order_release)</text>
    <rect x="336" y="44" width="68" height="18" rx="9" fill="#D1FAE5"/>
    <text x="370" y="57" class="pill-text" fill="#065F46">Ready to Read</text>
  </g>

  <!-- Slot 2: Reader Active Slot -->
  <g transform="translate(496, 268)">
    <rect width="416" height="74" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <rect x="8" y="8" width="80" height="20" rx="4" fill="#EFF6FF"/>
    <text x="48" y="22" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#1E40AF" text-anchor="middle">SLOT 2</text>
    <text x="96" y="22" class="card-title" fill="#1E3A8A">Reader Active Snapshot</text>
    <text x="12" y="44" class="card-body">1000 Hz Real-Time Thread evaluating CBF Barrier</text>
    <text x="12" y="60" class="math-expr" fill="#1E40AF">do { s1 = seq; copy(chunk); s2 = seq; } while (s1 != s2 || s1 &amp; 1);</text>
    <rect x="336" y="44" width="68" height="18" rx="9" fill="#EFF6FF"/>
    <text x="370" y="57" class="pill-text" fill="#1D4ED8">Zero Wait</text>
  </g>

  <!-- Invariant Summary Card in Panel B -->
  <g transform="translate(496, 354)">
    <rect width="416" height="118" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="20" class="card-title" fill="#0F172A">Sequence Lock Architectural Invariant</text>
    <text x="12" y="38" class="card-body">1. Zero Blocking: 1000 Hz safety loop NEVER blocks on slow 20 Hz writer.</text>
    <text x="12" y="56" class="card-body">2. Tearing Immunity: Atomic seq counter detects in-flight writes instantly.</text>
    <text x="12" y="74" class="card-body">3. Deterministic Fallback: If writer stalls, reader smoothly decelerates to safe stop along the valid receding chunk spline.</text>
    <text x="12" y="98" class="math-expr" fill="#059669">Reader Overhead: &lt; 150 ns · Zero Mutex Contention · Zero Heap Malloc</text>
  </g>

  <!-- Bottom Synthesis Subtitle -->
  <text x="480" y="540" class="subtitle">Triple-buffering with hardware sequence locks enables asynchronous rate decoupling across cognitive and motor silicon without lock contention or memory tearing.</text>
</svg>
