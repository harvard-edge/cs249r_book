<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">THE FUNDAMENTAL SYSTEMS TENSION OF PHYSICAL AI</text>
<text x="440.0" y="44" class="subtitle">High-Capacity Learned Generative Models ⟷ Hard Real-Time Deterministic Safety Guarantees</text>
<rect x="30" y="70" width="380" height="320" rx="8" fill="#215CAF" fill-opacity="0.04" stroke="#215CAF" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="30" y="70" width="380" height="26" rx="8" fill="#215CAF" fill-opacity="0.12"/>
<text x="220.0" y="88" font-size="10" font-weight="700" fill="#215CAF" text-anchor="middle">HIGH-CAPACITY LEARNED MODELS (Cortex)</text>
<text x="46" y="120" font-size="11.5" font-weight="700" fill="#1A202C">Transformers &amp; Diffusion Policies</text>
<text x="46" y="135" font-size="9" font-weight="700" fill="#215CAF">• Generalization:</text>
<text x="54" y="149" font-size="8.5" fill="#475569">Open-world semantic reasoning, novel visual grounding</text>
<text x="46" y="181" font-size="9" font-weight="700" fill="#215CAF">• Computational Substrate:</text>
<text x="54" y="195" font-size="8.5" fill="#475569">Heterogeneous NPU / GPU with large DRAM footprint</text>
<text x="46" y="227" font-size="9" font-weight="700" fill="#215CAF">• Execution Paradigm:</text>
<text x="54" y="241" font-size="8.5" fill="#475569">Batched tensor inference, stochastic sampling</text>
<text x="46" y="273" font-size="9" font-weight="700" fill="#215CAF">• Latency Profile:</text>
<text x="54" y="287" font-size="8.5" fill="#475569">Variable 15–100 ms with long P99.9 tail spikes</text>
<text x="46" y="319" font-size="9" font-weight="700" fill="#215CAF">• Failure Characteristics:</text>
<text x="54" y="333" font-size="8.5" fill="#475569">Hallucinations, out-of-distribution drift, crashes</text>
<rect x="470" y="70" width="380" height="320" rx="8" fill="#007A87" fill-opacity="0.04" stroke="#007A87" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="470" y="70" width="380" height="26" rx="8" fill="#007A87" fill-opacity="0.12"/>
<text x="660.0" y="88" font-size="10" font-weight="700" fill="#007A87" text-anchor="middle">HARD REAL-TIME DETERMINISTIC REFLEX (Enforcer)</text>
<text x="486" y="120" font-size="11.5" font-weight="700" fill="#1A202C">Zero-Allocation Active-Set QP Barrier Solvers</text>
<text x="486" y="135" font-size="9" font-weight="700" fill="#007A87">• Safety Guarantee:</text>
<text x="494" y="149" font-size="8.5" fill="#475569">Strict forward invariance h(x) ≥ 0, zero collisions</text>
<text x="486" y="181" font-size="9" font-weight="700" fill="#007A87">• Computational Substrate:</text>
<text x="494" y="195" font-size="8.5" fill="#475569">Real-Time MCU in static SRAM (0 dynamic malloc)</text>
<text x="486" y="227" font-size="9" font-weight="700" fill="#007A87">• Execution Paradigm:</text>
<text x="494" y="241" font-size="8.5" fill="#475569">Deterministic 1000 Hz loop, bounded iterations</text>
<text x="486" y="273" font-size="9" font-weight="700" fill="#007A87">• Latency Profile:</text>
<text x="494" y="287" font-size="8.5" fill="#475569">Bounded ≤ 175 µs with microsecond jitter (&lt; 5 µs)</text>
<text x="486" y="319" font-size="9" font-weight="700" fill="#007A87">• Failure Characteristics:</text>
<text x="494" y="333" font-size="8.5" fill="#475569">Fail-safe hardware arrest, Category 0/1 stops</text>
<circle cx="440" cy="230" r="32" fill="#FFFFFF" stroke="#B87333" stroke-width="2" filter="url(#shadow)"/>
<text x="440" y="226" font-size="8" font-weight="700" fill="#B87333" text-anchor="middle">PROPOSE</text>
<text x="440" y="238" font-size="9" font-weight="700" fill="#007A87" text-anchor="middle">⟷</text>
<text x="440" y="248" font-size="8" font-weight="700" fill="#007A87" text-anchor="middle">PERMIT</text>
</svg>
