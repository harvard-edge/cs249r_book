<text x="779.0" y="382" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">Watchdog Lease τ ≤ 50 ms</text>
<rect x="30" y="390" width="820" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
<text x="440.0" y="408" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">THE CO-DESIGN AXIOM</text>
<text x="440.0" y="422" font-size="8.5" fill="#475569" text-anchor="middle">Optimizing any single row in isolation without satisfying all 5 columns guarantees physical failure in closed-loop operation.</text>
