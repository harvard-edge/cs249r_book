<rect width="1040" height="490" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="520.0" y="28" class="title">THE DUAL EPISTEMIC BOUNDARIES: DETECTOR DEADLINES &amp; EXPOSURE WALLS</text>
<text x="520.0" y="44" class="subtitle">Why Empirical Testing Alone Cannot Settle Open-World Safety, Demanding Architectural Authority Limits and Closure Tests</text>
<rect x="28.0" y="66" width="316" height="400" rx="8" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="28.0" y="66" width="316" height="26" rx="8" fill="#1F407A" fill-opacity="0.12"/>
<text x="186.0" y="83" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">1. OBSERVABILITY DEADLINE LIMIT</text>
<text x="40.0" y="110" font-size="10.5" font-weight="700" fill="#1A202C">Identical Pre-Harm Telemetry</text>
<text x="40.0" y="124" font-size="8.5" fill="#64748B">States S_A (Safe) vs S_B (Hazard) indistinguishable</text>
<rect x="40.0" y="136" width="292" height="160" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<line x1="58.0" y1="266" x2="315.0" y2="266" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
<text x="315.0" y="280" font-size="8" fill="#475569">Time t</text>
<line x1="58.0" y1="266" x2="58.0" y2="151" stroke="#475569" stroke-width="1.2"/>
<text x="62.0" y="158" font-size="8" fill="#475569">Telemetry y(t)</text>
<line x1="58.0" y1="191" x2="198.0" y2="191" stroke="#215CAF" stroke-width="2"/>
<text x="66.0" y="184" font-size="8" font-weight="700" fill="#215CAF">y_A(t) ≡ y_B(t) = y₀</text>
<line x1="133.0" y1="154" x2="133.0" y2="266" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="133.0" y="150" font-size="7.5" font-weight="700" fill="#D97706" text-anchor="middle">t_deadline</text>
<line x1="198.0" y1="154" x2="198.0" y2="266" stroke="#A51C30" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="198.0" y="150" font-size="7.5" font-weight="700" fill="#A51C30" text-anchor="middle">t_harm (38 ms)</text>
<text x="253.0" y="171" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">Fracture / Slip</text>
<path d="M 198.0 191 Q 238.0 191 288.0 178" fill="none" stroke="#DC2626" stroke-width="2"/>
<rect x="58.0" y="248" width="200" height="15" rx="2" fill="#5B4B8A" fill-opacity="0.15" stroke="#5B4B8A" stroke-width="0.8"/>
<text x="158.0" y="259" font-size="7.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">Detection Latency τ_detect = 64 ms</text>
<text x="40.0" y="314" font-size="8" font-weight="700" fill="#1A202C">• State S_A vs S_B:</text>
<text x="143.0" y="314" font-size="8" fill="#475569">Nominal surface vs oil slick / internal void</text>
<text x="40.0" y="330" font-size="8" font-weight="700" fill="#1A202C">• Pre-Contact:</text>
<text x="143.0" y="330" font-size="8" fill="#475569">Zero optical or tactile surface signature</text>
<text x="40.0" y="346" font-size="8" font-weight="700" fill="#1A202C">• Late Detection:</text>
<text x="143.0" y="346" font-size="8" fill="#475569">Harm occurs before reflex engages (38 ms &lt; 64 ms)</text>
<text x="40.0" y="362" font-size="8" font-weight="700" fill="#1A202C">• Physical Theorem:</text>
<text x="143.0" y="362" font-size="8" fill="#475569">Identical y(t) implies safe intervention cannot</text>
<text x="40.0" y="378" font-size="8" font-weight="700" fill="#1A202C">• Epistemic Result:</text>
<text x="143.0" y="378" font-size="8" fill="#475569">exceed prior without structural force clamping</text>
<rect x="362.0" y="66" width="316" height="400" rx="8" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="362.0" y="66" width="316" height="26" rx="8" fill="#215CAF" fill-opacity="0.12"/>
<text x="520.0" y="83" font-size="9.5" font-weight="700" fill="#215CAF" text-anchor="middle">2. ASTRONOMICAL EXPOSURE WALL</text>
<text x="374.0" y="110" font-size="10.5" font-weight="700" fill="#1A202C">n ≥ ln(1/α) / p at 95% Confidence</text>
<text x="374.0" y="124" font-size="8.5" fill="#64748B">Required failure-free hours grows reciprocally with 1/p</text>
<rect x="374.0" y="136" width="292" height="42" rx="4" fill="#10B981" fill-opacity="0.06" stroke="#10B981" stroke-width="1"/>
<text x="382.0" y="152" font-size="9" font-weight="700" fill="#10B981">p ≤ 10⁻²/h (Consumer App)</text>
<text x="646.0" y="152" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="end">n ≥ 300 h</text>
<text x="382.0" y="168" font-size="8" fill="#64748B">Time: 12.5 days</text>
<text x="646.0" y="168" font-size="8" font-weight="600" fill="#10B981" text-anchor="end">Tractable (Unit Test)</text>
<rect x="374.0" y="184" width="292" height="42" rx="4" fill="#215CAF" fill-opacity="0.06" stroke="#215CAF" stroke-width="1"/>
<text x="382.0" y="200" font-size="9" font-weight="700" fill="#215CAF">p ≤ 10⁻⁴/h (Industrial Cobot)</text>
<text x="646.0" y="200" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="end">n ≥ 3.0×10⁴ h</text>
<text x="382.0" y="216" font-size="8" fill="#64748B">Time: 3.4 years</text>
<text x="646.0" y="216" font-size="8" font-weight="600" fill="#215CAF" text-anchor="end">Affordable (Bench Rig)</text>
<rect x="374.0" y="232" width="292" height="42" rx="4" fill="#B87333" fill-opacity="0.06" stroke="#B87333" stroke-width="1"/>
<text x="382.0" y="248" font-size="9" font-weight="700" fill="#B87333">p ≤ 10⁻⁶/h (Autonomous Transit)</text>
<text x="646.0" y="248" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="end">n ≥ 3.0×10⁶ h</text>
<text x="382.0" y="264" font-size="8" fill="#64748B">Time: 342 years</text>
<text x="646.0" y="264" font-size="8" font-weight="600" fill="#B87333" text-anchor="end">Fleet Limit (Correlated)</text>
<rect x="374.0" y="280" width="292" height="42" rx="4" fill="#A51C30" fill-opacity="0.06" stroke="#A51C30" stroke-width="1"/>
<text x="382.0" y="296" font-size="9" font-weight="700" fill="#A51C30">p ≤ 10⁻⁹/h (SIL-4 / ASIL-D)</text>
<text x="646.0" y="296" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="end">n ≥ 3.0×10⁹ h</text>
<text x="382.0" y="312" font-size="8" fill="#64748B">Time: 342,000 yrs</text>
<text x="646.0" y="312" font-size="8" font-weight="600" fill="#A51C30" text-anchor="end">LOGICALLY INSUFFICIENT</text>
<rect x="374.0" y="336" width="292" height="84" rx="5" fill="#A51C30" fill-opacity="0.08" stroke="#A51C30" stroke-width="1.2"/>
<text x="520.0" y="354" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="middle">WHY FLEET SAMPLING FAILS AT THE TAIL:</text>
<text x="382.0" y="370" font-size="7.5" fill="#475569">1. Correlated updates &amp; identical software reset trial clock</text>
<text x="382.0" y="383" font-size="7.5" fill="#475569">2. Safety drivers censor crashes → missing counterfactuals</text>
<text x="382.0" y="396" font-size="7.5" fill="#475569">3. Simulators test only pre-programmed physics disturbances</text>
<text x="382.0" y="409" font-size="7.5" fill="#475569">4. Ultra-reliability demands structural containment!</text>
<rect x="696.0" y="66" width="316" height="400" rx="8" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="696.0" y="66" width="316" height="26" rx="8" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="854.0" y="83" font-size="9.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">3. RESIDUAL-CLAIMS REGISTER</text>
<text x="708.0" y="110" font-size="10.5" font-weight="700" fill="#1A202C">Converting Caveats to Engineering Work</text>
<text x="708.0" y="124" font-size="8.5" fill="#64748B">4 Mandatory Fields for Every Open Assumption</text>
<rect x="708.0" y="136" width="292" height="50" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1"/>
<text x="716.0" y="150" font-size="8.5" font-weight="700" fill="#1F407A">FIELD 1: UNSUPPORTED CLAIM</text>
<text x="716.0" y="163" font-size="7.5" fill="#475569">Brake distance ≤ 0.49 m on concrete</text>
<text x="716.0" y="175" font-size="7.5" fill="#475569">Missing Observable: Surface friction μ &lt; 0.15</text>
<rect x="708.0" y="192" width="292" height="50" rx="4" fill="#F8FAFC" stroke="#A51C30" stroke-width="1"/>
<text x="716.0" y="206" font-size="8.5" font-weight="700" fill="#A51C30">FIELD 2: OPERATIONAL CONTAINMENT</text>
<text x="716.0" y="219" font-size="7.5" fill="#475569">Structural velocity clamp v ≤ 0.9 m/s</text>
<text x="716.0" y="231" font-size="7.5" fill="#475569">Kinetic energy Ek reduced 83% (1089 J → 182 J)</text>
<rect x="708.0" y="248" width="292" height="50" rx="4" fill="#F8FAFC" stroke="#5B4B8A" stroke-width="1"/>
<text x="716.0" y="262" font-size="8.5" font-weight="700" fill="#5B4B8A">FIELD 3: ACCOUNTABLE OWNER</text>
<text x="716.0" y="275" font-size="7.5" fill="#475569">Lead Drivetrain Engineer owns parameter lock;</text>
<text x="716.0" y="287" font-size="7.5" fill="#475569">Accepts operational throughput penalty</text>
<rect x="708.0" y="304" width="292" height="50" rx="4" fill="#F8FAFC" stroke="#007A87" stroke-width="1"/>
<text x="716.0" y="318" font-size="8.5" font-weight="700" fill="#007A87">FIELD 4: FALSIFIABLE CLOSURE TEST</text>
<text x="716.0" y="331" font-size="7.5" fill="#475569">Integrate polarimetric sensor + 1 kHz slip reflex;</text>
<text x="716.0" y="343" font-size="7.5" fill="#475569">Validated across N=1000 wet floor trials</text>
<rect x="708.0" y="368" width="292" height="52" rx="4" fill="#5B4B8A" fill-opacity="0.08" stroke="#5B4B8A" stroke-width="1.1"/>
<text x="854.0" y="383" font-size="8.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">FALSIFICATION &amp; VERDICT GATE</text>
<text x="854.0" y="398" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">Relocated Assumption? → REJECT / STOP</text>
<text x="854.0" y="411" font-size="7.5" font-weight="700" fill="#10B981" text-anchor="middle">Independent Evidence? → RETIRE GAP &amp; LIFT CLAMP</text>
</svg>
