<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="960" height="530" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="480.0" y="28" class="title">LOCK-FREE SEQLOCK BOUNDARY CONTRACT &amp; PREEMPTION RECOVERY</text>
<text x="480.0" y="44" class="subtitle">Asynchronous Inter-Core State Exchange with Zero Wait States and Deterministic Fallback Hierarchy</text>
<rect x="24" y="62" width="460" height="450" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
<rect x="24" y="62" width="460" height="28" rx="8" fill="#215CAF" fill-opacity="0.12"/>
<text x="38" y="81" font-size="11" font-weight="700" fill="#215CAF">(a) Lock-Free Seqlock Publication Protocol</text>
<text x="470" y="81" font-size="9" font-weight="600" fill="#64748B" text-anchor="end">Atomic Barriers · Zero Mutex</text>
<rect x="38" y="98" width="205" height="240" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="38" y="98" width="205" height="22" rx="6" fill="#215CAF" fill-opacity="0.1"/>
<text x="140.5" y="113" font-size="9.5" font-weight="700" fill="#215CAF" text-anchor="middle">UNTRUSTED WRITER (NPU/MPU)</text>
<rect x="46" y="128" width="189" height="35" rx="4" fill="#DC2626" fill-opacity="0.08" stroke="#DC2626" stroke-width="0.9"/>
<text x="50" y="142" font-size="8" font-weight="700" fill="#DC2626">1. atomic_store_release(S, 2k+1)</text>
<text x="50" y="155" font-size="7.5" fill="#475569">Marks sequence counter ODD</text>
<rect x="46" y="169" width="189" height="35" rx="4" fill="#5B4B8A" fill-opacity="0.08" stroke="#5B4B8A" stroke-width="0.9"/>
<text x="50" y="183" font-size="8" font-weight="700" fill="#5B4B8A">2. Store-Release Barrier</text>
<text x="50" y="196" font-size="7.5" fill="#475569">Flushes counter visibility</text>
<rect x="46" y="210" width="189" height="35" rx="4" fill="#1A202C" fill-opacity="0.08" stroke="#1A202C" stroke-width="0.9"/>
<text x="50" y="224" font-size="8" font-weight="700" fill="#1A202C">3. Write Payload Fields</text>
<text x="50" y="237" font-size="7.5" fill="#475569">m_cmd, k, t_prod, Δt_valid, CRC</text>
<rect x="46" y="251" width="189" height="35" rx="4" fill="#5B4B8A" fill-opacity="0.08" stroke="#5B4B8A" stroke-width="0.9"/>
<text x="50" y="265" font-size="8" font-weight="700" fill="#5B4B8A">4. Store-Release Barrier</text>
<text x="50" y="278" font-size="7.5" fill="#475569">Ensures payload commits first</text>
<rect x="46" y="292" width="189" height="35" rx="4" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="0.9"/>
<text x="50" y="306" font-size="8" font-weight="700" fill="#10B981">5. atomic_store_release(S, 2k+2)</text>
<text x="50" y="319" font-size="7.5" fill="#475569">Marks sequence counter EVEN</text>
<rect x="265" y="98" width="205" height="240" rx="6" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="265" y="98" width="205" height="22" rx="6" fill="#007A87" fill-opacity="0.1"/>
<text x="367.5" y="113" font-size="9.5" font-weight="700" fill="#007A87" text-anchor="middle">SAFETY READER (Real-Time MCU)</text>
<rect x="273" y="128" width="189" height="35" rx="4" fill="#007A87" fill-opacity="0.08" stroke="#007A87" stroke-width="0.9"/>
<text x="277" y="142" font-size="8" font-weight="700" fill="#007A87">1. S1 = atomic_load_acquire(S)</text>
<text x="277" y="155" font-size="7.5" fill="#475569">Sample initial sequence</text>
<rect x="273" y="169" width="189" height="35" rx="4" fill="#DC2626" fill-opacity="0.08" stroke="#DC2626" stroke-width="0.9"/>
<text x="277" y="183" font-size="8" font-weight="700" fill="#DC2626">2. if (S1 &amp; 1) reject();</text>
<text x="277" y="196" font-size="7.5" fill="#475569">Odd → Write in progress! Zero wait</text>
<rect x="273" y="210" width="189" height="35" rx="4" fill="#1A202C" fill-opacity="0.08" stroke="#1A202C" stroke-width="0.9"/>
<text x="277" y="224" font-size="8" font-weight="700" fill="#1A202C">3. Load-Acquire &amp; Copy</text>
<text x="277" y="237" font-size="7.5" fill="#475569">Copy payload to private stack</text>
<rect x="273" y="251" width="189" height="35" rx="4" fill="#007A87" fill-opacity="0.08" stroke="#007A87" stroke-width="0.9"/>
<text x="277" y="265" font-size="8" font-weight="700" fill="#007A87">4. S2 = atomic_load_acquire(S)</text>
<text x="277" y="278" font-size="7.5" fill="#475569">Sample second sequence</text>
<rect x="273" y="292" width="189" height="35" rx="4" fill="#D97706" fill-opacity="0.08" stroke="#D97706" stroke-width="0.9"/>
<text x="277" y="306" font-size="8" font-weight="700" fill="#D97706">5. if (S1 != S2) reject_torn();</text>
<text x="277" y="319" font-size="7.5" fill="#475569">Torn write trap (zero blocking)</text>
<rect x="38" y="346" width="432" height="154" rx="6" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2" filter="url(#shadow)"/>
<text x="48" y="362" font-size="9" font-weight="700" fill="#1F407A">SELF-CONTAINED BOUNDARY CONTRACT PAYLOAD (256 bytes)</text>
<rect x="48" y="374" width="80" height="20" rx="3" fill="#1F407A" fill-opacity="0.08"/>
<text x="52" y="387" class="code-text">dot_m_cmd</text>
<text x="136" y="387" font-size="7.5" font-weight="700" fill="#5B4B8A">[float32]</text>
<text x="189" y="387" font-size="7.5" fill="#475569">Commanded mass flow target (physical limits [0, 45 kg/s])</text>
<rect x="48" y="398" width="80" height="20" rx="3" fill="#1F407A" fill-opacity="0.08"/>
<text x="52" y="411" class="code-text">seq_id (k)</text>
<text x="136" y="411" font-size="7.5" font-weight="700" fill="#5B4B8A">[uint64]</text>
<text x="189" y="411" font-size="7.5" fill="#475569">Monotonic proposal index (detects dropped/skipped frames)</text>
<rect x="48" y="422" width="80" height="20" rx="3" fill="#1F407A" fill-opacity="0.08"/>
<text x="52" y="435" class="code-text">t_prod</text>
<text x="136" y="435" font-size="7.5" font-weight="700" fill="#5B4B8A">[uint64]</text>
<text x="189" y="435" font-size="7.5" fill="#475569">Monotonic hardware timestamp of inference completion</text>
<rect x="48" y="446" width="80" height="20" rx="3" fill="#1F407A" fill-opacity="0.08"/>
<text x="52" y="459" class="code-text">Δt_valid</text>
<text x="136" y="459" font-size="7.5" font-weight="700" fill="#5B4B8A">[uint32]</text>
<text x="189" y="459" font-size="7.5" fill="#475569">Lease expiration duration (e.g. 45.0 ms maximum validity)</text>
<rect x="48" y="470" width="80" height="20" rx="3" fill="#1F407A" fill-opacity="0.08"/>
<text x="52" y="483" class="code-text">crc32_hash</text>
<text x="136" y="483" font-size="7.5" font-weight="700" fill="#5B4B8A">[uint32]</text>
<text x="189" y="483" font-size="7.5" fill="#475569">Payload integrity checksum (detects corrupted bitflips)</text>
<rect x="495" y="62" width="440" height="450" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
<rect x="495" y="62" width="440" height="28" rx="8" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="509" y="81" font-size="11" font-weight="700" fill="#5B4B8A">(b) Preemption Points &amp; Deterministic Fallbacks</text>
<text x="921" y="81" font-size="9" font-weight="600" fill="#64748B" text-anchor="end">Guaranteed Bounded Response</text>
<text x="509" y="106" font-size="9" font-weight="700" fill="#1A202C">WRITER PREEMPTION / CRASH POINT ANALYSIS</text>
<rect x="507" y="116" width="416" height="37" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-width="1.1"/>
<rect x="507" y="116" width="4" height="37" rx="2" fill="#10B981"/>
<text x="517" y="130" font-size="8.5" font-weight="700" fill="#10B981">Point A · Crash Before Step 1</text>
<text x="695" y="130" font-size="7.5" font-weight="600" fill="#64748B">[S is even (2k)]</text>
<text x="517" y="144" font-size="7.5" fill="#475569">Reader sees intact prior record (2k==2k). Zero corruption. ✓</text>
<rect x="507" y="158" width="416" height="37" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
<rect x="507" y="158" width="4" height="37" rx="2" fill="#D97706"/>
<text x="517" y="172" font-size="8.5" font-weight="700" fill="#D97706">Point B · Preempted During Write</text>
<text x="695" y="172" font-size="7.5" font-weight="600" fill="#64748B">[S is odd (2k+1)]</text>
<text x="517" y="186" font-size="7.5" fill="#475569">Reader tests (S1 &amp; 1) != 0, drops buffer in &lt;5 µs. Zero blocking. ✓</text>
<rect x="507" y="200" width="416" height="37" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
<rect x="507" y="200" width="4" height="37" rx="2" fill="#DC2626"/>
<text x="517" y="214" font-size="8.5" font-weight="700" fill="#DC2626">Point C · Crashed Mid-Publication</text>
<text x="695" y="214" font-size="7.5" font-weight="600" fill="#64748B">[S stays odd]</text>
<text x="517" y="228" font-size="7.5" fill="#475569">Reader detects persistent odd sequence, trips fallback clamp. ✓</text>
<rect x="507" y="242" width="416" height="37" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-width="1.1"/>
<rect x="507" y="242" width="4" height="37" rx="2" fill="#10B981"/>
<text x="517" y="256" font-size="8.5" font-weight="700" fill="#10B981">Point D · Write Fully Committed</text>
<text x="695" y="256" font-size="7.5" font-weight="600" fill="#64748B">[S is even (2k+2)]</text>
<text x="517" y="270" font-size="7.5" fill="#475569">Reader validates S1==S2==2k+2 and CRC. Accepts fresh packet. ✓</text>
<text x="509" y="300" font-size="9" font-weight="700" fill="#A51C30">4 BOUNDARY FAILURE CLASSES &amp; DETERMINISTIC RESPONSES</text>
<rect x="507" y="310" width="416" height="42" rx="5" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-width="1"/>
<text x="517" y="324" font-size="8.5" font-weight="700" fill="#DC2626">1. MALFORMED: <tspan font-weight="500" fill="#1A202C">CRC mismatch / Out-of-bounds dot_m_cmd</tspan></text>
<text x="517" y="337" font-size="7.5" font-weight="600" fill="#1F407A">Fallback Action: <tspan font-weight="400" fill="#475569">Clamp valve immediately to last verified safe orifice position.</tspan></text>
<rect x="507" y="358" width="416" height="42" rx="5" fill="#D97706" fill-opacity="0.06" stroke="#D97706" stroke-width="1"/>
<text x="517" y="372" font-size="8.5" font-weight="700" fill="#D97706">2. STALE: <tspan font-weight="500" fill="#1A202C">t_now > t_prod + Δt_valid (Lease expired)</tspan></text>
<text x="517" y="385" font-size="7.5" font-weight="600" fill="#1F407A">Fallback Action: <tspan font-weight="400" fill="#475569">Hold position for τ_hold = 10 ms; if persists, begin ramp-down.</tspan></text>
<rect x="507" y="406" width="416" height="42" rx="5" fill="#5B4B8A" fill-opacity="0.06" stroke="#5B4B8A" stroke-width="1"/>
<text x="517" y="420" font-size="8.5" font-weight="700" fill="#5B4B8A">3. MISSING: <tspan font-weight="500" fill="#1A202C">Sequence gap (k_new > k_prev + 1)</tspan></text>
<text x="517" y="433" font-size="7.5" font-weight="600" fill="#1F407A">Fallback Action: <tspan font-weight="400" fill="#475569">Flag queue-overrun; apply state extrapolation with rate limit.</tspan></text>
<rect x="507" y="454" width="416" height="42" rx="5" fill="#215CAF" fill-opacity="0.06" stroke="#215CAF" stroke-width="1"/>
<text x="517" y="468" font-size="8.5" font-weight="700" fill="#215CAF">4. TORN / OVERRUN: <tspan font-weight="500" fill="#1A202C">Seqlock mismatch (S1 != S2)</tspan></text>
<text x="517" y="481" font-size="7.5" font-weight="600" fill="#1F407A">Fallback Action: <tspan font-weight="400" fill="#475569">Reject torn read instantly (&lt;5 µs); continue 1 kHz control tick.</tspan></text>
</svg>
