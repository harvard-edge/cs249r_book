<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="900" height="550" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
<text x="450.0" y="26" class="title">THE PHYSICAL AI SYSTEMS SCOPE: THREE-PILLAR CONVERGENCE</text>
<text x="450.0" y="42" class="subtitle">An ML Systems Perspective: High-Capacity Learned Models · Real-Time Embedded Silicon · Physical Dynamics</text>
<circle cx="360" cy="215" r="140" fill="#215CAF" fill-opacity="0.08" stroke="#215CAF" stroke-width="1.6"/>
<circle cx="540" cy="215" r="140" fill="#A51C30" fill-opacity="0.08" stroke="#A51C30" stroke-width="1.6"/>
<circle cx="450" cy="330" r="140" fill="#007A87" fill-opacity="0.08" stroke="#007A87" stroke-width="1.6"/>
<text x="200" y="62" font-size="10.5" font-weight="700" fill="#215CAF" text-anchor="middle">MACHINE LEARNING SYSTEMS</text>
<text x="200" y="76" font-size="8.5" fill="#475569" text-anchor="middle">High-capacity stochastic policies</text>
<text x="200" y="88" font-size="8.5" fill="#64748B" text-anchor="middle">VLMs · Diffusion · MPU / NPU Proposers</text>
<text x="700" y="62" font-size="10.5" font-weight="700" fill="#A51C30" text-anchor="middle">REAL-TIME EMBEDDED SYSTEMS</text>
<text x="700" y="76" font-size="8.5" fill="#475569" text-anchor="middle">Deterministic execution &amp; WCET</text>
<text x="700" y="88" font-size="8.5" fill="#64748B" text-anchor="middle">Zero-alloc SRAM · 1 kHz MCU Referees</text>
<text x="450" y="496" font-size="10.5" font-weight="700" fill="#007A87" text-anchor="middle">PHYSICAL MECHANICS &amp; THERMODYNAMICS</text>
<text x="450" y="511" font-size="8.5" fill="#475569" text-anchor="middle">Inertia (p=mv) · Non-reversible energy (I^2 R) · Closed causal loop (s_t+1 ~ P(s|s_t,a_t))</text>
<text x="250" y="195" font-size="9" font-weight="700" fill="#215CAF" text-anchor="middle">Pure Digital ML</text>
<text x="250" y="209" font-size="8" fill="#64748B" text-anchor="middle">Cloud LLMs · Vision Classifiers</text>
<text x="250" y="221" font-size="7.5" fill="#64748B" text-anchor="middle">(Behind glass; idempotent rollback)</text>
<text x="650" y="195" font-size="9" font-weight="700" fill="#A51C30" text-anchor="middle">Discrete Embedded RTOS</text>
<text x="650" y="209" font-size="8" fill="#64748B" text-anchor="middle">PLC Timers · Avionics Relays</text>
<text x="650" y="221" font-size="7.5" fill="#64748B" text-anchor="middle">(No learned models; static logic)</text>
<text x="450" y="405" font-size="9" font-weight="700" fill="#007A87" text-anchor="middle">Passive Mechanics</text>
<text x="450" y="419" font-size="8" fill="#64748B" text-anchor="middle">Spring-Mass Dampers · Thermal Sinks</text>
<rect x="375" y="122" width="150" height="46" rx="4" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1" filter="url(#shadow)"/>
<text x="450" y="137" font-size="8.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">Edge ML / TinyML</text>
<text x="450" y="149" font-size="7.5" fill="#475569" text-anchor="middle">Keyword Spotters · Visual Wakewords</text>
<text x="450" y="159" font-size="7.5" fill="#64748B" text-anchor="middle">Advisory output; no physical loop</text>
<rect x="205" y="325" width="155" height="46" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1" filter="url(#shadow)"/>
<text x="282" y="340" font-size="8.5" font-weight="700" fill="#D97706" text-anchor="middle">Physics-Informed ML</text>
<text x="282" y="352" font-size="7.5" fill="#475569" text-anchor="middle">Offline Surrogates · Simulators</text>
<text x="282" y="362" font-size="7.5" fill="#64748B" text-anchor="middle">Synthetic telemetry; no live actuator</text>
<rect x="540" y="325" width="155" height="46" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.1" filter="url(#shadow)"/>
<text x="617" y="340" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">Classical Robotics &amp; Control</text>
<text x="617" y="352" font-size="7.5" fill="#475569" text-anchor="middle">1 kHz PID · LQR · MPC Controllers</text>
<text x="617" y="362" font-size="7.5" fill="#64748B" text-anchor="middle">Analytically specified transfer functions</text>
<rect x="360" y="220" width="180" height="70" rx="6" fill="#1F407A" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
<text x="450" y="242" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1px">PHYSICAL AI SYSTEMS</text>
<text x="450" y="258" font-size="8" font-weight="700" fill="#FDE047" text-anchor="middle">DUAL-BRAIN SILICON BRIDGE</text>
<text x="450" y="270" font-size="7.5" fill="#E2E8F0" text-anchor="middle">Linux MPU (Propose) ⟷ MCU (Permit)</text>
<text x="450" y="282" font-size="7" fill="#93C5FD" text-anchor="middle">Desktop SoC Twins · Autonomous Machines</text>
</svg>
