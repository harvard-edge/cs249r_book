parts:
  - key: "frontmatter"
    division: "frontmatter"
    type: "division"
    numbered: false
    title: "Frontmatter"
    description: >
      Opening material that establishes the scope, audience, and foundations of Physical AI.

  - key: "mainmatter"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Main Text"
    description: >
      The main content of the textbook organized into four thematic parts.

  - key: "vol4_anatomy"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Machine Anatomy"
    description: >
      This part establishes the physical and computational anatomy of physical AI systems,
      defining the Body, the Brain, and the Nervous System.

  - key: "vol4_teaching"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Teaching the Machine"
    description: >
      This part addresses learning in physical systems: sensory data collection,
      imitation and reinforcement learning, and rigorous physical evaluation.

  - key: "vol4_running"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Running the Machine"
    description: >
      This part details real-time execution: perception, memory hierarchies,
      intent parsing, motion planning, and hardware placement.

  - key: "vol4_governing"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Governing the Machine"
    description: >
      This part addresses safety and governance: human intervention, formal verification,
      safe release qualification, and the physical AI frontier.

  - key: "synthesis"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Synthesis"
    description: >
      The concluding synthesis of Physical AI systems engineering.

  - key: "backmatter"
    division: "backmatter"
    type: "division"
    numbered: false
    title: "References"
    description: >
      Reference materials and bibliography.
