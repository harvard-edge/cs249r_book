<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #1F407A; letter-spacing: 0.06em; text-transform: uppercase; }
      .stage-title { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #1F407A; }
      .stage-sub { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 600; fill: #64748B; }
      .stage-body { font-family: "STIX Two Text", Georgia, serif; font-size: 8.5px; fill: #334155; font-style: italic; }
      .artifact-pill { font-family: "Menlo", monospace; font-size: 7.5px; font-weight: 600; fill: #1E293B; }
      .boundary-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; font-weight: 700; fill: #A51C30; letter-spacing: 0.04em; }
    </style>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <filter id="subtle-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="180" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="1" y="1" width="918" height="28" fill="#F8FAFC" rx="4 4 0 0"/>
  <text x="16" y="19" class="hdr">The Cognitive Flow of Physical AI: End-to-End Left-to-Right Pipeline</text>
  <line x1="0" y1="29" x2="920" y2="29" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Left: Physical Sensor Input -->
  <rect x="14" y="44" width="90" height="115" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" filter="url(#subtle-shadow)"/>
  <text x="59" y="62" class="stage-title" text-anchor="middle">SENSORS</text>
  <text x="59" y="74" class="stage-sub" text-anchor="middle">Physical Flux</text>
  <line x1="24" y1="80" x2="94" y2="80" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="59" y="96" class="stage-body" text-anchor="middle">• Photons (RGB)</text>
  <text x="59" y="112" class="stage-body" text-anchor="middle">• Depth (ToF)</text>
  <text x="59" y="128" class="stage-body" text-anchor="middle">• IMU &amp; Current</text>
  <text x="59" y="144" class="stage-body" text-anchor="middle">• Proprioception</text>

  <!-- Arrow 1 -->
  <line x1="104" y1="101" x2="124" y2="101" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <!-- Stage 1: Ingestion -->
  <rect x="126" y="44" width="134" height="115" rx="3" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.2" filter="url(#subtle-shadow)"/>
  <rect x="126" y="44" width="134" height="3" fill="#1F407A"/>
  <text x="193" y="62" class="stage-title" text-anchor="middle">1. INGESTION</text>
  <text x="193" y="74" class="stage-sub" text-anchor="middle">Tokenization &amp; Embed</text>
  <line x1="136" y1="80" x2="250" y2="80" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="193" y="96" class="stage-body" text-anchor="middle">ViT Patch Tokens (16×16)</text>
  <text x="193" y="110" class="stage-body" text-anchor="middle">State Vector Embedding</text>
  <text x="193" y="124" class="stage-body" text-anchor="middle">Prompt Interleaving</text>
  <rect x="136" y="134" width="114" height="16" rx="2" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.7"/>
  <text x="193" y="145" class="artifact-pill" text-anchor="middle">Tokens: [T_vis, T_txt]</text>

  <!-- Arrow 2 -->
  <line x1="260" y1="101" x2="280" y2="101" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <!-- Stage 2: Perception -->
  <rect x="282" y="44" width="134" height="115" rx="3" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.2" filter="url(#subtle-shadow)"/>
  <rect x="282" y="44" width="134" height="3" fill="#1F407A"/>
  <text x="349" y="62" class="stage-title" text-anchor="middle">2. PERCEPTION</text>
  <text x="349" y="74" class="stage-sub" text-anchor="middle">Spatial Geometry (Ch 8)</text>
  <line x1="292" y1="80" x2="406" y2="80" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="349" y="96" class="stage-body" text-anchor="middle">Metric SE(3) Bounding Boxes</text>
  <text x="349" y="110" class="stage-body" text-anchor="middle">DINOv2 Dense Features</text>
  <text x="349" y="124" class="stage-body" text-anchor="middle">Contact Affordance Fields</text>
  <rect x="292" y="134" width="114" height="16" rx="2" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.7"/>
  <text x="349" y="145" class="artifact-pill" text-anchor="middle">Entities: {SE(3), BBox}</text>

  <!-- Arrow 3 -->
  <line x1="416" y1="101" x2="436" y2="101" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <!-- Stage 3: Memory -->
  <rect x="438" y="44" width="134" height="115" rx="3" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.2" filter="url(#subtle-shadow)"/>
  <rect x="438" y="44" width="134" height="3" fill="#1F407A"/>
  <text x="505" y="62" class="stage-title" text-anchor="middle">3. MEMORY</text>
  <text x="505" y="74" class="stage-sub" text-anchor="middle">Belief State (Ch 9)</text>
  <line x1="448" y1="80" x2="562" y2="80" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="505" y="96" class="stage-body" text-anchor="middle">Rolling TSDFs / 3D Gaussians</text>
  <text x="505" y="110" class="stage-body" text-anchor="middle">Occlusion Identity Tracking</text>
  <text x="505" y="124" class="stage-body" text-anchor="middle">Dynamic Velocity Inference</text>
  <rect x="448" y="134" width="114" height="16" rx="2" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.7"/>
  <text x="505" y="145" class="artifact-pill" text-anchor="middle">World Belief: B_t</text>

  <!-- Arrow 4 -->
  <line x1="572" y1="101" x2="592" y2="101" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <!-- Stage 4: Intent -->
  <rect x="594" y="44" width="134" height="115" rx="3" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.2" filter="url(#subtle-shadow)"/>
  <rect x="594" y="44" width="134" height="3" fill="#1F407A"/>
  <text x="661" y="62" class="stage-title" text-anchor="middle">4. INTENT</text>
  <text x="661" y="74" class="stage-sub" text-anchor="middle">Deliberation 1–5 Hz (Ch 10)</text>
  <line x1="604" y1="80" x2="718" y2="80" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="661" y="96" class="stage-body" text-anchor="middle">Semantic Subgoal Trees</text>
  <text x="661" y="110" class="stage-body" text-anchor="middle">SayCan / VoxPoser VLM</text>
  <text x="661" y="124" class="stage-body" text-anchor="middle">Expiring Lease Generation</text>
  <rect x="604" y="134" width="114" height="16" rx="2" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.7"/>
  <text x="661" y="145" class="artifact-pill" text-anchor="middle">Lease: L_intent (τ_valid)</text>

  <!-- Arrow 5 -->
  <line x1="728" y1="101" x2="748" y2="101" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <!-- Stage 5: Planning -->
  <rect x="750" y="44" width="134" height="115" rx="3" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.2" filter="url(#subtle-shadow)"/>
  <rect x="750" y="44" width="134" height="3" fill="#1F407A"/>
  <text x="817" y="62" class="stage-title" text-anchor="middle">5. PLANNING</text>
  <text x="817" y="74" class="stage-sub" text-anchor="middle">Trajectory 20–50 Hz (Ch 11)</text>
  <line x1="760" y1="80" x2="874" y2="80" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="817" y="96" class="stage-body" text-anchor="middle">Action Chunking (ACT/Diff)</text>
  <text x="817" y="110" class="stage-body" text-anchor="middle">Receding Horizon H=16–64</text>
  <text x="817" y="124" class="stage-body" text-anchor="middle">Unprivileged Proposal (p_t)</text>
  <rect x="760" y="134" width="114" height="16" rx="2" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="0.7"/>
  <text x="817" y="145" class="artifact-pill" text-anchor="middle">Chunk: A_{t:t+H}</text>

  <!-- Proposal-Permission Boundary Line -->
  <line x1="894" y1="36" x2="894" y2="168" stroke="#A51C30" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="906" y="95" class="boundary-text" transform="rotate(90, 906, 95)" text-anchor="middle">PROPOSAL–PERMISSION GATE</text>
</svg>