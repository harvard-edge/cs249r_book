<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.2px; }
      .subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .realm-tag { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; }
      .card-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12.5px; }
      .card-body { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #334155; }
      .math-expr { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 600; }
      .card-sub { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #64748B; font-style: italic; }
      .pill-text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; text-anchor: middle; }
      .port-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; fill: #475569; text-anchor: middle; font-weight: 600; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E40AF"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B45309"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="570" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="28" class="title">VISION-LANGUAGE-ACTION (VLA) ARCHITECTURE &amp; PROPOSAL PIPELINE</text>
  <text x="480" y="45" class="subtitle">Multimodal Sensory Ingestion · Patch Tokenization · Autoregressive Transformer · Continuous Action Chunk Proposal</text>

  <!-- CONTAINER 1: Multimodal Sensory Ingestion (Left Column) -->
  <rect x="36" y="64" width="276" height="420" rx="8" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.2"/>
  <path d="M 36 72 Q 36 64 44 64 L 304 64 Q 312 64 312 72 L 312 90 L 36 90 Z" fill="#EEF2F6"/>
  <text x="48" y="81" class="realm-tag" fill="#1E40AF">1. SENSORY INGESTION &amp; TOKENS</text>

  <!-- Item 1: Overhead RGB -->
  <g transform="translate(48, 100)">
    <rect width="252" height="78" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="18" class="card-title" fill="#1E3A8A">Overhead Context Camera</text>
    <text x="12" y="34" class="card-body">224×224 RGB · ViT Patch 14×14</text>
    <text x="12" y="50" class="math-expr" fill="#1E40AF">z_vis ∈ ℝ^(256 × d_model)</text>
    <text x="12" y="66" class="card-sub">Global workspace scene layout</text>
    <rect x="186" y="52" width="54" height="18" rx="9" fill="#EFF6FF"/>
    <text x="213" y="65" class="pill-text" fill="#1D4ED8">30 Hz</text>
  </g>

  <!-- Item 2: Wrist Camera -->
  <g transform="translate(48, 188)">
    <rect width="252" height="78" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="18" class="card-title" fill="#1E3A8A">Wrist In-Hand Camera</text>
    <text x="12" y="34" class="card-body">224×224 RGB · Gripper Viewpoint</text>
    <text x="12" y="50" class="math-expr" fill="#1E40AF">z_wrist ∈ ℝ^(256 × d_model)</text>
    <text x="12" y="66" class="card-sub">Fine-alignment &amp; contact visual cue</text>
    <rect x="186" y="52" width="54" height="18" rx="9" fill="#EFF6FF"/>
    <text x="213" y="65" class="pill-text" fill="#1D4ED8">30 Hz</text>
  </g>

  <!-- Item 3: Task Instruction Text -->
  <g transform="translate(48, 276)">
    <rect width="252" height="78" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="18" class="card-title" fill="#5B4B8A">Task Instruction (Text)</text>
    <text x="12" y="34" class="card-body">"pick red cup, place on tray"</text>
    <text x="12" y="50" class="math-expr" fill="#5B4B8A">z_text = BPE(Prompt) ∈ ℝ^(L × d)</text>
    <text x="12" y="66" class="card-sub">SentencePiece tokenization</text>
    <rect x="186" y="52" width="54" height="18" rx="9" fill="#F3F0F8"/>
    <text x="213" y="65" class="pill-text" fill="#5B4B8A">Static</text>
  </g>

  <!-- Item 4: Proprioception -->
  <g transform="translate(48, 364)">
    <rect width="252" height="78" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="18" class="card-title" fill="#0F766E">Proprioceptive State</text>
    <text x="12" y="34" class="card-body">Joint Angles q, Velocities q̇, Gripper g</text>
    <text x="12" y="50" class="math-expr" fill="#0F766E">z_prop = MLP([q, q̇, g]) ∈ ℝ^(1 × d)</text>
    <text x="12" y="66" class="card-sub">Hardware encoder telemetry</text>
    <rect x="186" y="52" width="54" height="18" rx="9" fill="#F0FDFA"/>
    <text x="213" y="65" class="pill-text" fill="#0F766E">500 Hz</text>
  </g>

  <!-- Connection: 1 -> 2 -->
  <line x1="312" y1="274" x2="352" y2="274" stroke="#1E40AF" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="332" y="264" class="port-label">Tokens</text>

  <!-- CONTAINER 2: VLA Transformer Backbone (Middle Column) -->
  <rect x="354" y="64" width="292" height="420" rx="8" fill="#FFFDF8" stroke="#FCD34D" stroke-width="1.2"/>
  <path d="M 354 72 Q 354 64 362 64 L 638 64 Q 646 64 646 72 L 646 90 L 354 90 Z" fill="#FEF3C7"/>
  <text x="366" y="81" class="realm-tag" fill="#B45309">2. VLA TRANSFORMER (7B–55B)</text>

  <!-- Backbone Card 1: Fusion & Attention -->
  <g transform="translate(366, 100)">
    <rect width="268" height="135" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="20" class="card-title" fill="#B45309">Multimodal Sequence Fusion</text>
    <text x="12" y="38" class="card-body">Input: [z_vis | z_wrist | z_text | z_prop]</text>
    <text x="12" y="56" class="math-expr" fill="#B45309">Total Sequence Length: N = 514 tokens</text>
    <text x="12" y="74" class="card-body">32–80 Transformer Layers · Multi-Head Attn</text>
    <text x="12" y="92" class="card-sub">Pretrained on web visual-text + robot trajectories</text>
    <text x="12" y="112" class="card-sub" fill="#B45309">Models: OpenVLA (7B), RT-2 (55B), PaLM-E</text>
  </g>

  <!-- Backbone Card 2: Memory Wall & Hardware Constraints -->
  <g transform="translate(366, 246)">
    <rect width="268" height="135" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="20" class="card-title" fill="#1F407A">Edge Silicon Memory Wall</text>
    <text x="12" y="38" class="card-body">Precision: FP8 / INT4 Quantized Weights</text>
    <text x="12" y="56" class="math-expr" fill="#1F407A">M_weights = 7.0 GB · DRAM Wall = 204.8 GB/s</text>
    <text x="12" y="74" class="card-body">Memory Streaming Time: t_stream ≥ 34 ms</text>
    <text x="12" y="92" class="card-sub">Inference Latency: 150–350 ms on Edge NPU</text>
    <rect x="190" y="106" width="66" height="18" rx="9" fill="#EFF6FF"/>
    <text x="223" y="119" class="pill-text" fill="#1D4ED8">3–5 Hz</text>
  </g>

  <!-- Unprivileged Warning Badge -->
  <g transform="translate(366, 392)">
    <rect width="268" height="50" rx="6" fill="#FEF2F2" stroke="#F87171" stroke-width="1"/>
    <text x="134" y="20" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#991B1B" text-anchor="middle">UNPRIVILEGED CANDIDATE PROPOSALS</text>
    <text x="134" y="36" class="card-sub" fill="#991B1B" text-anchor="middle">Zero direct actuator register access authority</text>
  </g>

  <!-- Connection: 2 -> 3 -->
  <line x1="646" y1="274" x2="686" y2="274" stroke="#B45309" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="666" y="264" class="port-label" fill="#B45309">Latent h_L</text>

  <!-- CONTAINER 3: Action Proposal & Decoding Heads (Right Column) -->
  <rect x="688" y="64" width="236" height="420" rx="8" fill="#F8FCFA" stroke="#6EE7B7" stroke-width="1.2"/>
  <path d="M 688 72 Q 688 64 696 64 L 916 64 Q 924 64 924 72 L 924 90 L 688 90 Z" fill="#D1FAE5"/>
  <text x="700" y="81" class="realm-tag" fill="#065F46">3. ACTION DECODING &amp; CHUNKS</text>

  <!-- Decoding Card 1: Discrete Bins -->
  <g transform="translate(700, 100)">
    <rect width="212" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="18" class="card-title" fill="#065F46">Discrete Action Tokens</text>
    <text x="10" y="34" class="card-body">Autoregressive Binning (256 bins)</text>
    <text x="10" y="50" class="math-expr" fill="#065F46">a_t = [Δx, Δy, Δz, Δr, Δp, Δy, g]</text>
    <text x="10" y="66" class="card-sub">Single-step rate: 1–5 Hz</text>
    <text x="10" y="82" class="card-sub" fill="#991B1B">Hazard: Step-and-wait stalling</text>
    <rect x="146" y="94" width="56" height="18" rx="9" fill="#FEE2E2"/>
    <text x="174" y="107" class="pill-text" fill="#991B1B">1–5 Hz</text>
  </g>

  <!-- Decoding Card 2: Continuous Action Chunking -->
  <g transform="translate(700, 230)">
    <rect width="212" height="145" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
    <text x="10" y="18" class="card-title" fill="#059669">Diffusion / ACT Action Chunks</text>
    <text x="10" y="34" class="card-body">Receding Spline Trajectory</text>
    <text x="10" y="50" class="math-expr" fill="#059669">p_t = [q_1, q_2, ..., q_H] ∈ ℝ^(H × D)</text>
    <text x="10" y="66" class="card-body">Horizon H = 16..64 waypoints</text>
    <text x="10" y="82" class="card-sub">Amortizes VLA compute wall</text>
    <text x="10" y="98" class="math-expr" fill="#0F766E">‖q̈‖ ≤ a_max ∧ ‖q⃛‖ ≤ j_max (C²)</text>
    <rect x="142" y="118" width="60" height="18" rx="9" fill="#D1FAE5"/>
    <text x="172" y="131" class="pill-text" fill="#065F46">20–50 Hz</text>
  </g>

  <!-- Output Handoff Arrow -->
  <line x1="806" y1="375" x2="806" y2="442" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-teal)"/>
  <rect x="716" y="442" width="180" height="26" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="806" y="458" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#166534" text-anchor="middle">Candidate Proposal p_t</text>

  <!-- BOTTOM PRIVILEGE BARRIER -->
  <line x1="36" y1="514" x2="924" y2="514" stroke="#991B1B" stroke-width="1.8" stroke-dasharray="8,5"/>
  <g transform="translate(180, 500)">
    <rect width="600" height="28" rx="6" fill="#991B1B"/>
    <text x="300" y="18" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10px" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1px">PROPOSAL–PERMISSION PRIVILEGE BOUNDARY: HANDOFF TO SYSTEM 1 SAFETY REFEREE (1 kHz)</text>
  </g>
  <text x="480" y="550" class="subtitle">Candidate trajectory chunks p_t are unprivileged proposals: downstream safety barriers evaluate stopping margins before committing to hardware registers.</text>
</svg>
