<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.2px; }
      .subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .realm-tag { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; }
      .card-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .card-body { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #334155; }
      .math-expr { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 600; }
      .card-sub { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #64748B; font-style: italic; }
      .pill-text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; text-anchor: middle; }
      .port-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; fill: #475569; text-anchor: middle; font-weight: 600; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E40AF"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="570" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="28" class="title">HARDWARE PRIVILEGE BOUNDARY &amp; EXCLUSION MOTOR DRIVE REGISTERS</text>
  <text x="480" y="45" class="subtitle">Physical Isolation Architecture: Application Linux MPU vs. Dedicated Real-Time Safety MCU with Hardware Interlock Registers</text>

  <!-- LEFT REALM: Untrusted Linux MPU / Accelerator (width=340) -->
  <rect x="36" y="64" width="340" height="420" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <path d="M 36 72 Q 36 64 44 64 L 368 64 Q 376 64 376 72 L 376 90 L 36 90 Z" fill="#EEF2F6"/>
  <text x="48" y="81" class="realm-tag" fill="#1E40AF">1. UNTRUSTED APPLICATION MPU</text>

  <!-- Card 1: User Space Policy -->
  <g transform="translate(48, 100)">
    <rect width="316" height="100" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="12" y="20" class="card-title" fill="#1E3A8A">User-Space Python / PyTorch Process</text>
    <text x="12" y="38" class="card-body">High-capacity VLA Policy / Generative Planner</text>
    <text x="12" y="56" class="card-sub" fill="#991B1B">Hazard: Memory leaks, GC pauses, OOD drift</text>
    <text x="12" y="74" class="math-expr" fill="#1E40AF">Virtual Memory: No /dev/mem direct physical access</text>
    <rect x="236" y="74" width="70" height="18" rx="9" fill="#EFF6FF"/>
    <text x="271" y="87" class="pill-text" fill="#1D4ED8">User Mode</text>
  </g>

  <!-- Card 2: Linux Kernel & MMU Boundary -->
  <g transform="translate(48, 212)">
    <rect width="316" height="110" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="20" class="card-title" fill="#0F172A">Linux Kernel &amp; Hardware MMU</text>
    <text x="12" y="38" class="card-body">Memory Management Unit page-table protection</text>
    <text x="12" y="56" class="card-body">DMA engine restricted to isolated shared RAM</text>
    <text x="12" y="74" class="card-sub" fill="#991B1B">CRITICAL INVARIANT: Actuator PWM registers are</text>
    <text x="12" y="90" class="card-sub" fill="#991B1B">PHYSICALLY UNMAPPED in Linux MMU page tables</text>
  </g>

  <!-- Proposal Output Box -->
  <g transform="translate(48, 334)">
    <rect width="316" height="136" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="12" y="20" class="card-title" fill="#B45309">Outbound Proposal Mailbox</text>
    <text x="12" y="38" class="card-body">Writes candidate trajectory chunks via IPC</text>
    <text x="12" y="56" class="math-expr" fill="#B45309">p_t = {q_k, q̇_k, τ_k} (Unprivileged)</text>
    <text x="12" y="76" class="card-sub">Transmitted across isolated PCIe/SPI bridge</text>
    <text x="12" y="94" class="math-expr" fill="#991B1B">Authority: ZERO direct motor register write</text>
    <rect x="236" y="106" width="70" height="18" rx="9" fill="#FEF3C7"/>
    <text x="271" y="119" class="pill-text" fill="#B45309">20–50 Hz</text>
  </g>

  <!-- MIDDLE PRIVILEGE BOUNDARY (width=140) -->
  <g transform="translate(390, 64)">
    <rect width="180" height="420" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <path d="M 0 8 Q 0 0 8 0 L 172 0 Q 180 0 180 8 L 180 26 L 0 26 Z" fill="#FEE2E2"/>
    <text x="90" y="17" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#991B1B" text-anchor="middle">2. PRIVILEGE BOUNDARY</text>

    <!-- Physical Isolation Bridge -->
    <rect x="12" y="40" width="156" height="100" rx="6" fill="#FFFFFF" stroke="#F87171" stroke-width="1"/>
    <text x="78" y="20" font-family="'IBM Plex Sans', sans-serif" font-size="10px" font-weight="700" fill="#991B1B" text-anchor="middle">Galvanic &amp; Bus Isolation</text>
    <text x="10" y="42" font-family="'IBM Plex Sans', sans-serif" font-size="9px" fill="#475569">• Optocoupled SPI / CAN</text>
    <text x="10" y="58" font-family="'IBM Plex Sans', sans-serif" font-size="9px" fill="#475569">• Dual-port SRAM Mailbox</text>
    <text x="10" y="74" font-family="'IBM Plex Sans', sans-serif" font-size="9px" fill="#475569">• Independent Power Rails</text>
    <text x="10" y="90" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8px" font-weight="700" fill="#991B1B">Crash Proof Isolation</text>

    <!-- Arrow Across Barrier -->
    <line x1="-14" y1="210" x2="194" y2="210" stroke="#991B1B" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-crimson)"/>
    <rect x="25" y="196" width="130" height="26" rx="4" fill="#991B1B"/>
    <text x="90" y="213" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#FFFFFF" text-anchor="middle">p_t ONLY</text>

    <!-- Watchdog Heartbeat Line -->
    <rect x="12" y="270" width="156" height="136" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="78" y="20" font-family="'IBM Plex Sans', sans-serif" font-size="10px" font-weight="700" fill="#0F172A" text-anchor="middle">Heartbeat Watchdog</text>
    <text x="10" y="42" font-family="'IBM Plex Sans', sans-serif" font-size="9px" fill="#475569">• Window: Δt_hb = 50 ms</text>
    <text x="10" y="58" font-family="'IBM Plex Sans', sans-serif" font-size="9px" fill="#475569">• If Host freezes / crashes:</text>
    <text x="10" y="76" font-family="'IBM Plex Sans', sans-serif" font-size="8.5px" font-weight="700" fill="#991B1B">Watchdog Tripped</text>
    <text x="10" y="94" font-family="'IBM Plex Sans', sans-serif" font-size="8.5px" fill="#475569">MCU asserts safe-stop</text>
    <text x="10" y="112" font-family="'IBM Plex Sans', sans-serif" font-size="8.5px" fill="#475569">Zero Host dependence</text>
  </g>

  <!-- RIGHT REALM: Trusted Real-Time Safety MCU (width=340) -->
  <rect x="584" y="64" width="340" height="420" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <path d="M 584 72 Q 584 64 592 64 L 916 64 Q 924 64 924 72 L 924 90 L 584 90 Z" fill="#DCFCE7"/>
  <text x="596" y="81" class="realm-tag" fill="#166534">3. TRUSTED REAL-TIME SAFETY MCU</text>

  <!-- Card 4: Invariant Checker -->
  <g transform="translate(596, 100)">
    <rect width="316" height="100" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="20" class="card-title" fill="#065F46">1000 Hz Invariant Checking Engine</text>
    <text x="12" y="38" class="card-body">Solves CBF Quadratic Program · Evaluates d_stop ≤ D_clear</text>
    <text x="12" y="56" class="math-expr" fill="#065F46">u_t = argmin ‖u - p_t‖² s.t. ḣ(x) + γ h(x) ≥ 0</text>
    <text x="12" y="74" class="card-sub">Bare-metal FreeRTOS · Zero Heap Malloc · Hard Deadline</text>
    <rect x="236" y="74" width="70" height="18" rx="9" fill="#D1FAE5"/>
    <text x="271" y="87" class="pill-text" fill="#065F46">1000 Hz</text>
  </g>

  <!-- Card 5: Exclusive Motor Registers -->
  <g transform="translate(596, 212)">
    <rect width="316" height="130" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
    <text x="12" y="20" class="card-title" fill="#065F46">Exclusive Hardware Register Bank</text>
    <text x="12" y="38" class="math-expr" fill="#065F46">TIM1_CCR1..3 : Phase PWM Duty Registers (0..65535)</text>
    <text x="12" y="56" class="math-expr" fill="#065F46">MOTOR_EN_REG : Hardware Safety Interlock Bit</text>
    <text x="12" y="74" class="math-expr" fill="#065F46">CURRENT_SENSE: ADC Injected Channels 1..3</text>
    <text x="12" y="96" class="card-sub" fill="#166534">SOLE physical master capable of energizing motor gates</text>
    <rect x="236" y="104" width="70" height="18" rx="9" fill="#D1FAE5"/>
    <text x="271" y="117" class="pill-text" fill="#065F46">20–100 kHz</text>
  </g>

  <!-- Card 6: Safe Torque Off (STO) -->
  <g transform="translate(596, 354)">
    <rect width="316" height="116" rx="6" fill="#FEF2F2" stroke="#F87171" stroke-width="1.2"/>
    <text x="12" y="20" class="card-title" fill="#991B1B">Hardware Safe Torque Off (STO)</text>
    <text x="12" y="38" class="card-body">Dual-channel electro-mechanical safety relay</text>
    <text x="12" y="56" class="card-body">Physically severs gate-driver high-side power in &lt; 10 µs</text>
    <text x="12" y="74" class="card-sub" fill="#991B1B">Cannot be overridden or bypassed by software</text>
    <rect x="236" y="90" width="70" height="18" rx="9" fill="#FEE2E2"/>
    <text x="271" y="103" class="pill-text" fill="#991B1B">Hardware STO</text>
  </g>

  <!-- Bottom Synthesis Subtitle -->
  <text x="480" y="540" class="subtitle">Physical exclusion ensures that even a total Linux kernel panic or compromised AI process cannot directly assert motor PWM registers.</text>
</svg>
