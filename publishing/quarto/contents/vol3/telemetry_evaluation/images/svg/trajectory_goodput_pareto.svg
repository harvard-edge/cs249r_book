<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .header-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
      .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .axis-tick { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; fill: #64748b; }
      .point-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; }
      .point-sub { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8px; fill: #475569; }
      .formula { font-family: 'Times New Roman', Times, serif; font-size: 13px; font-style: italic; }
    </style>

    <marker id="arrow-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>

    <filter id="shadow" x="-3%" y="-4%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="540" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <rect x="12" y="11" width="78" height="20" rx="4" fill="#e0e7ff"/>
    <text x="51" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#4338ca">FIGURE 14.3</text>
    <text x="100" y="22" class="title">Trajectory Goodput Pareto Frontier: Accuracy vs. Inference Compute Economics</text>
    <text x="100" y="34" class="subtitle">Benchmarking task success rate against Cost-per-Goal across dense baselines, sparse MoE cascades, and test-time search</text>
  </g>

  <!-- Main Chart Canvas (Left 580px) -->
  <g transform="translate(25, 68)">
    <rect width="580" height="448" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>

    <!-- Chart Grid & Axes Area: x: 80 to 550, y: 40 to 390 -->
    <!-- Grid Lines (Horizontal: 0%, 20%, 40%, 60%, 80%) -->
    <line x1="80" y1="390" x2="550" y2="390" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="80" y1="310" x2="550" y2="310" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="80" y1="230" x2="550" y2="230" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="80" y1="150" x2="550" y2="150" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="80" y1="70" x2="550" y2="70" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Grid Lines (Vertical: $0.05, $0.20, $1.00, $5.00, $20.00) -->
    <line x1="110" y1="50" x2="110" y2="390" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="200" y1="50" x2="200" y2="390" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="300" y1="50" x2="300" y2="390" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="410" y1="50" x2="410" y2="390" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="510" y1="50" x2="510" y2="390" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Axes -->
    <line x1="80" y1="390" x2="555" y2="390" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
    <line x1="80" y1="390" x2="80" y2="40" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-axis)"/>

    <!-- Y-Axis Labels -->
    <text x="70" y="394" text-anchor="end" class="axis-tick">0%</text>
    <text x="70" y="314" text-anchor="end" class="axis-tick">20%</text>
    <text x="70" y="234" text-anchor="end" class="axis-tick">40%</text>
    <text x="70" y="154" text-anchor="end" class="axis-tick">60%</text>
    <text x="70" y="74" text-anchor="end" class="axis-tick">80%</text>

    <text x="26" y="210" text-anchor="middle" class="axis-label" transform="rotate(-90 26 210)">Benchmark Success Rate (Pass@k %)</text>

    <!-- X-Axis Labels -->
    <text x="110" y="410" text-anchor="middle" class="axis-tick">$0.05</text>
    <text x="200" y="410" text-anchor="middle" class="axis-tick">$0.20</text>
    <text x="300" y="410" text-anchor="middle" class="axis-tick">$1.00</text>
    <text x="410" y="410" text-anchor="middle" class="axis-tick">$5.00</text>
    <text x="510" y="410" text-anchor="middle" class="axis-tick">$20.00</text>

    <text x="310" y="432" text-anchor="middle" class="axis-label">Cost per Goal ($ / Task, Logarithmic Scale)</text>

    <!-- Pareto Optimal Frontier Curve -->
    <path d="M 130 320 Q 200 240, 290 190 T 390 145 T 500 128" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M 130 320 Q 200 240, 290 190 T 390 145 T 500 128 L 500 390 L 130 390 Z" fill="#eff6ff" opacity="0.25"/>

    <!-- Diminishing Returns Shading -->
    <rect x="420" y="50" width="125" height="340" fill="#fee2e2" opacity="0.28"/>
    <text x="482" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#dc2626">DIMINISHING RETURNS ZONE</text>
    <text x="482" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">4x cost for +2.8% Pass rate</text>

    <!-- DATA POINTS -->
    <!-- Point A: Greedy Dense ($0.15, 12%) -->
    <g transform="translate(205, 348)">
      <circle r="6" fill="#64748b" stroke="#ffffff" stroke-width="2"/>
      <text x="12" y="-2" class="point-label" fill="#334155">A. Greedy Dense 70B</text>
      <text x="12" y="10" class="point-sub">$0.15 | Pass@1: 12.0%</text>
    </g>

    <!-- Point B: Sparse MoE Fast ($0.09, 18.2%) -->
    <g transform="translate(145, 317)">
      <circle r="7" fill="#059669" stroke="#ffffff" stroke-width="2"/>
      <rect x="12" y="-30" width="88" height="14" rx="3" fill="#dcfce7" stroke="#86efac"/>
      <text x="56" y="-20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#15803d">MAX GOODPUT</text>
      <text x="12" y="-5" text-anchor="start" class="point-label" fill="#047857">B. Sparse MoE Cascade</text>
      <text x="12" y="7" text-anchor="start" class="point-sub">$0.09 | Pass@1: 18.2%</text>
    </g>

    <!-- Point C: Best-of-8 Dense ($0.75, 34%) -->
    <g transform="translate(275, 254)">
      <circle r="6" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
      <text x="12" y="-2" class="point-label" fill="#1d4ed8">C. Best-of-8 Sampling</text>
      <text x="12" y="10" class="point-sub">$0.75 | Pass@8: 34.0%</text>
    </g>

    <!-- Point D: Dynamic Cascade + Verification ($1.80, 52%) -->
    <g transform="translate(340, 182)">
      <circle r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
      <text x="-12" y="-8" text-anchor="end" class="point-label" fill="#6d28d9">D. Cascade + Verifier</text>
      <text x="-12" y="4" text-anchor="end" class="point-sub">$1.80 | Pass: 52.4%</text>
    </g>

    <!-- Point E: Full MCTS Agent ($4.80, 62%) -->
    <g transform="translate(410, 140)">
      <circle r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
      <text x="-12" y="-12" text-anchor="end" class="point-label" fill="#1e40af">E. MCTS + Rollback</text>
      <text x="-12" y="0" text-anchor="end" class="point-sub">$4.80 | Pass: 62.1%</text>
    </g>

    <!-- Point F: Unbounded Swarm ($18.50, 64.9%) -->
    <g transform="translate(500, 130)">
      <circle r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <text x="-12" y="20" text-anchor="end" class="point-label" fill="#b91c1c">F. Unbounded Swarm</text>
      <text x="-12" y="32" text-anchor="end" class="point-sub">$18.50 | Pass: 64.9%</text>
    </g>
  </g>

  <!-- Right Panel (300px): Systems Models & Invariants -->
  <g transform="translate(615, 68)">
    <!-- Card 1: Trajectory Goodput Equation -->
    <rect width="300" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <rect x="0" y="0" width="300" height="28" rx="8" fill="#f8fafc"/>
    <path d="M 0 20 L 0 28 L 300 28 L 300 20 Z" fill="#f8fafc"/>
    <line x1="0" y1="28" x2="300" y2="28" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" class="header-title" fill="#0f172a">Trajectory Goodput Invariant</text>

    <g transform="translate(14, 36)">
      <rect x="0" y="4" width="272" height="32" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="136" y="25" text-anchor="middle" class="formula" fill="#1e40af">G = N_success / ( C_tokens + C_compute )</text>
      <text x="0" y="52" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">Measures productive tasks completed per economic unit.</text>
      <text x="0" y="64" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">Penalizes runaway loops, hallucinations, and dead ends.</text>
      <text x="0" y="82" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#15803d">Key Empirical Finding:</text>
      <text x="0" y="96" font-family="system-ui, sans-serif" font-size="8.5" fill="#475569">Peak Goodput occurs at Point B (Sparse MoE Cascade),</text>
      <text x="0" y="108" font-family="system-ui, sans-serif" font-size="8.5" fill="#475569">yielding 3.2x higher tasks/$ than brute sampling.</text>
    </g>

    <!-- Card 2: Cost-per-Goal Decomposition -->
    <g transform="translate(0, 164)">
      <rect width="300" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
      <rect x="0" y="0" width="300" height="28" rx="8" fill="#f8fafc"/>
      <path d="M 0 20 L 0 28 L 300 28 L 300 20 Z" fill="#f8fafc"/>
      <line x1="0" y1="28" x2="300" y2="28" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="19" class="header-title" fill="#0f172a">Cost-per-Goal Economics</text>

      <g transform="translate(14, 36)">
        <text x="0" y="12" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f172a">Dense vs. MoE Serving Footprint:</text>
        <text x="0" y="27" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• Dense 70B: Activates all 70B FLOPs every token.</text>
        <text x="0" y="41" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• MoE 8x7B (2 active): Activates ~13B FLOPs/tok.</text>
        <text x="0" y="55" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">• 5.4x compute reduction on long agent context.</text>

        <line x1="0" y1="64" x2="272" y2="64" stroke="#f1f5f9"/>
        <text x="0" y="78" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f172a">Unbiased Pass@k Estimator:</text>
        <rect x="0" y="84" width="272" height="24" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="136" y="100" text-anchor="middle" class="formula" fill="#334155">Pass@k = E[ 1 - C(n-c, k) / C(n, k) ]</text>
      </g>
    </g>

    <!-- Card 3: Production Fleet Recommendation -->
    <g transform="translate(0, 328)">
      <rect width="300" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
      <rect x="0" y="0" width="300" height="28" rx="8" fill="#f0fdf4"/>
      <path d="M 0 20 L 0 28 L 300 28 L 300 20 Z" fill="#f0fdf4"/>
      <line x1="0" y1="28" x2="300" y2="28" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="19" class="header-title" fill="#166534">Production Fleet Policy</text>

      <g transform="translate(14, 36)">
        <text x="0" y="12" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#15803d">1. Dynamic Cascade Routing:</text>
        <text x="0" y="26" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">Dispatch 80% trivial steps to small fast models.</text>
        <text x="0" y="44" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#15803d">2. Verifier-Gated Search Escalation:</text>
        <text x="0" y="58" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">Trigger expensive frontier MoE / MCTS only upon test oracle failure.</text>
        <text x="0" y="76" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#15803d">3. Strict Cost Circuit Breakers:</text>
        <text x="0" y="90" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">Terminate trajectories entering the Diminishing Returns Zone (> $3.00).</text>
      </g>
    </g>
  </g>
</svg>