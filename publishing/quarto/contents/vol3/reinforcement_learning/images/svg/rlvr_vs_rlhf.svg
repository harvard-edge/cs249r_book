<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .banner-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #E9D5FF; }
      .col-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }
      .box-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; line-height: 1.4; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 700; text-anchor: middle; }
      .token-text { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; }
      .arrow { stroke: #64748B; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-red { stroke: #DC2626; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-green { stroke: #059669; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="grad-head-rl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <marker id="arr-g5" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#059669" />
    </marker>
    <marker id="arr-r5" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#FAFAFC" rx="10" stroke="#E2E8F0" stroke-width="1" />

  <!-- Header Banner -->
  <rect x="25" y="18" width="910" height="44" rx="6" fill="url(#grad-head-rl)" />
  <text x="42" y="45" class="banner-title">Architectural Paradigm Shift: RLHF vs. RLVR</text>
  <text x="520" y="45" class="banner-sub">From Subjective Preference Modeling to Verifiable Environmental Ground Truth</text>

  <!-- Left Container: Traditional RLHF -->
  <g transform="translate(25, 75)">
    <rect width="445" height="340" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" />
    <rect width="445" height="30" rx="8" fill="#FEF2F2" />
    <rect y="22" width="445" height="8" fill="#FEF2F2" />
    <text x="16" y="20" class="col-header" fill="#991B1B">A. Reinforcement Learning from Human Feedback (RLHF)</text>

    <!-- Flow Elements -->
    <!-- Prompt -->
    <rect x="15" y="42" width="125" height="40" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
    <text x="77" y="66" class="box-title" fill="#334155" text-anchor="middle">Task Prompt x</text>

    <!-- Arrow Prompt -> Actor -->
    <path d="M 140 62 L 175 62" class="arrow" marker-end="url(#arr-r5)" />

    <!-- Actor Policy -->
    <rect x="180" y="42" width="135" height="40" rx="5" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" />
    <text x="247" y="66" class="box-title" fill="#581C87" text-anchor="middle">Actor Policy π_θ</text>

    <!-- Arrow Actor -> Generation -->
    <path d="M 315 62 L 350 62" class="arrow" marker-end="url(#arr-r5)" />

    <!-- Trajectory Rollout y -->
    <rect x="355" y="42" width="75" height="40" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
    <text x="392" y="66" class="token-text" fill="#334155" text-anchor="middle">Trace y</text>

    <!-- Arrow Down to Reward Model -->
    <path d="M 392 82 L 392 115 L 360 115" class="arrow-red" marker-end="url(#arr-r5)" />

    <!-- Neural Reward Model (RM) -->
    <g transform="translate(15, 100)">
      <rect width="340" height="65" rx="6" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.25" />
      <text x="12" y="20" class="box-title" fill="#9F1239">Neural Reward Model r_ψ(x, y)</text>
      <rect x="255" y="7" width="72" height="17" rx="3" fill="#FFE4E6" />
      <text x="291" y="19" class="badge" fill="#BE123C">Subjective</text>
      <text x="12" y="38" class="box-desc">• Trained on pairwise human preferences (y_w &gt; y_l)</text>
      <text x="12" y="52" class="box-desc">• Unbounded continuous scalar score: r in [-inf, +inf]</text>
    </g>

    <!-- Arrow RM -> Critic / PPO -->
    <path d="M 185 165 L 185 190" class="arrow-red" marker-end="url(#arr-r5)" />

    <!-- Critic & PPO Optimization Block -->
    <g transform="translate(15, 195)">
      <rect width="415" height="55" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.25" />
      <text x="12" y="20" class="box-title" fill="#1E293B">PPO Optimization (Actor + Critic V_ϕ)</text>
      <text x="12" y="36" class="box-desc">• Requires explicit Value Network V_ϕ (doubles GPU memory footprint)</text>
      <text x="12" y="49" class="box-desc">• Generalized Advantage Estimation (GAE) across dense time-steps</text>
    </g>

    <!-- Failure Vulnerabilities of RLHF in Agentic Systems -->
    <g transform="translate(15, 260)">
      <rect width="415" height="68" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1" stroke-dasharray="3 2" />
      <text x="12" y="18" class="box-title" fill="#B91C1C">Systems Failure Modes in Agent Workflows:</text>
      <text x="12" y="34" class="box-desc">• <tspan font-weight="700">Reward Hacking:</tspan> Policy exploits RM blind spots, emitting sycophantic prose.</text>
      <text x="12" y="48" class="box-desc">• <tspan font-weight="700">Human Evaluation Ceiling:</tspan> Humans cannot reliably grade 50-step bash diffs.</text>
      <text x="12" y="62" class="box-desc">• <tspan font-weight="700">No Ground Truth:</tspan> Plausible-sounding hallucinated code receives high RM reward.</text>
    </g>
  </g>

  <!-- Right Container: Modern RLVR -->
  <g transform="translate(490, 75)">
    <rect width="445" height="340" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5" />
    <rect width="445" height="30" rx="8" fill="#F0FDF4" />
    <rect y="22" width="445" height="8" fill="#F0FDF4" />
    <text x="16" y="20" class="col-header" fill="#166534">B. Reinforcement Learning with Verifiable Rewards (RLVR)</text>

    <!-- Flow Elements -->
    <!-- Prompt -->
    <rect x="15" y="42" width="125" height="40" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
    <text x="77" y="66" class="box-title" fill="#334155" text-anchor="middle">Task Prompt x</text>

    <!-- Arrow Prompt -> Actor -->
    <path d="M 140 62 L 175 62" class="arrow" marker-end="url(#arr-g5)" />

    <!-- Actor Policy -->
    <rect x="180" y="42" width="135" height="40" rx="5" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" />
    <text x="247" y="66" class="box-title" fill="#581C87" text-anchor="middle">Actor Policy π_θ</text>

    <!-- Arrow Actor -> Generation -->
    <path d="M 315 62 L 350 62" class="arrow" marker-end="url(#arr-g5)" />

    <!-- Trajectory Rollout y -->
    <rect x="355" y="42" width="75" height="40" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
    <text x="392" y="66" class="token-text" fill="#334155" text-anchor="middle">Trace y</text>

    <!-- Arrow Down to Deterministic Oracle -->
    <path d="M 392 82 L 392 115 L 365 115" class="arrow-green" marker-end="url(#arr-g5)" />

    <!-- Deterministic Verification Oracle -->
    <g transform="translate(15, 100)">
      <rect width="345" height="65" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.25" />
      <text x="12" y="20" class="box-title" fill="#15803D">Execution Oracle O(x, y)</text>
      <rect x="250" y="7" width="82" height="17" rx="3" fill="#DCFCE7" />
      <text x="291" y="19" class="badge" fill="#15803D">Deterministic</text>
      <text x="12" y="38" class="box-desc">• Sandboxed unit tests (pytest), compilers (gcc/rustc), math checkers</text>
      <text x="12" y="52" class="box-desc">• Objective verified reward: R in {0, 1}</text>
    </g>

    <!-- Arrow Oracle -> Policy Optimization -->
    <path d="M 187 165 L 187 190" class="arrow-green" marker-end="url(#arr-g5)" />

    <!-- GRPO / Critic-Free Optimization Block -->
    <g transform="translate(15, 195)">
      <rect width="415" height="55" rx="6" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.25" />
      <text x="12" y="20" class="box-title" fill="#581C87">Group Relative Policy Optimization (GRPO)</text>
      <text x="12" y="36" class="box-desc">• Samples group of G outputs; normalizes rewards without a critic</text>
      <text x="12" y="49" class="box-desc">• Cuts GPU memory overhead by ~50%, scaling rollout concurrency</text>
    </g>

    <!-- Structural Advantages of RLVR -->
    <g transform="translate(15, 260)">
      <rect width="415" height="68" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1" />
      <text x="12" y="18" class="box-title" fill="#15803D">Systems Advantages in Agent Workflows:</text>
      <text x="12" y="34" class="box-desc">• <tspan font-weight="700">Unhackable Verification:</tspan> Code either passes unit tests or fails; zero sycophancy.</text>
      <text x="12" y="48" class="box-desc">• <tspan font-weight="700">Emergent Reasoning:</tspan> Self-correction and backtracking emerge autonomously.</text>
      <text x="12" y="62" class="box-desc">• <tspan font-weight="700">Scalable Oracle:</tspan> Sandboxed execution scales linearly across parallel workers.</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(25, 425)">
    <rect width="910" height="80" rx="8" fill="#EDE9FE" stroke="#A855F7" stroke-width="1.25" />
    <text x="16" y="22" class="box-title" fill="#581C87">Fundamental Invariant: The Verifiable Reward Boundary</text>
    <text x="16" y="42" class="box-desc" fill="#3B0764">
      While conversational chatbots optimize for perceived human helpfulness, autonomous agents operate in digital state spaces (filesystems, compilers, databases).
    </text>
    <text x="16" y="57" class="box-desc" fill="#3B0764">
      Reinforcement learning on agents is mathematically grounded only when the reward oracle is an objective, deterministic transition function: R(tau) in {0, 1}.
    </text>
    <text x="16" y="72" class="box-desc" fill="#3B0764">
      Replacing fallible neural reward models with deterministic test harnesses eliminates Goodhart's law vulnerabilities in production post-training.
    </text>
  </g>
</svg>
