<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .col-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .col-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8.5px; font-weight: 700; }
      .item-header { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; fill: #1e293b; }
      .item-val { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; fill: #334155; }
      .footer-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .footer-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
    </style>

    <filter id="shadow" x="-3%" y="-4%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="540" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <rect x="12" y="11" width="78" height="20" rx="4" fill="#e0e7ff"/>
    <text x="51" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#4338ca">FIGURE 15.2</text>
    <text x="100" y="22" class="title">The Four-Volume Machine Learning Systems Arc: Invariant Evolution</text>
    <text x="100" y="34" class="subtitle">Computational abstractions, governing physics, and system boundaries across the complete MLSys curriculum</text>
  </g>

  <!-- Evolution Connector Arrows -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 235 240 L 255 240"/>
    <path d="M 460 240 L 480 240"/>
    <path d="M 685 240 L 705 240"/>
  </g>

  <!-- Volume 1 Column (Blue) -->
  <g transform="translate(25, 68)">
    <rect width="210" height="382" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="210" height="52" rx="8" fill="#eff6ff"/>
    <path d="M 0 44 L 0 52 L 210 52 L 210 44 Z" fill="#eff6ff"/>
    <line x1="0" y1="52" x2="210" y2="52" stroke="#bfdbfe" stroke-width="1"/>
    <text x="14" y="23" class="col-title" fill="#1e40af">Volume I: The Model</text>
    <text x="14" y="40" class="col-sub" fill="#3b82f6">Single-Node Systems &amp; Roofline</text>

    <!-- Content Blocks -->
    <g transform="translate(12, 64)">
      <!-- Abstraction -->
      <rect x="0" y="0" width="186" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="15" class="item-header">Primary Abstraction</text>
      <text x="8" y="30" class="item-val">Static Compute Graph (DAG)</text>
      <text x="8" y="44" class="item-val">Stateless Tensor Operators</text>

      <!-- Governing Physics -->
      <rect x="0" y="62" width="186" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="77" class="item-header">Governing Physics</text>
      <text x="8" y="92" class="item-val">Arithmetic Intensity (I = FLOP/B)</text>
      <text x="8" y="106" class="item-val">Hardware Memory Wall</text>

      <!-- Triad -->
      <rect x="0" y="124" width="186" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="139" class="item-header">Fundamental Triad</text>
      <text x="8" y="154" class="item-val">D · A · M Triad</text>
      <text x="8" y="168" class="item-val">(Data, Algorithm, Model)</text>

      <!-- Hardware Focus -->
      <rect x="0" y="186" width="186" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="201" class="item-header">Hardware &amp; Execution</text>
      <text x="8" y="216" class="item-val">GPU SRAM, HBM3e, Systolic</text>
      <text x="8" y="230" class="item-val">Kernel Fusion, FP8 Precision</text>

      <!-- Binding Bottleneck -->
      <rect x="0" y="248" width="186" height="56" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="8" y="264" class="item-header" fill="#991b1b">Binding Bottleneck</text>
      <text x="8" y="279" class="item-val" fill="#b91c1c">HBM Memory Bandwidth</text>
      <text x="8" y="294" class="item-val" fill="#b91c1c">SRAM Register Spilling</text>
    </g>
  </g>

  <!-- Volume 2 Column (Purple) -->
  <g transform="translate(250, 68)">
    <rect width="210" height="382" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="210" height="52" rx="8" fill="#f5f3ff"/>
    <path d="M 0 44 L 0 52 L 210 52 L 210 44 Z" fill="#f5f3ff"/>
    <line x1="0" y1="52" x2="210" y2="52" stroke="#ddd6fe" stroke-width="1"/>
    <text x="14" y="23" class="col-title" fill="#6b21a8">Volume II: The Fleet</text>
    <text x="14" y="40" class="col-sub" fill="#8b5cf6">Distributed Training &amp; Serving</text>

    <!-- Content Blocks -->
    <g transform="translate(12, 64)">
      <!-- Abstraction -->
      <rect x="0" y="0" width="186" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="15" class="item-header">Primary Abstraction</text>
      <text x="8" y="30" class="item-val">3D Parallel Mesh (TP/PP/DP)</text>
      <text x="8" y="44" class="item-val">PagedAttention KV-Chunks</text>

      <!-- Governing Physics -->
      <rect x="0" y="62" width="186" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="77" class="item-header">Governing Physics</text>
      <text x="8" y="92" class="item-val">Bisection Bandwidth Scaling</text>
      <text x="8" y="106" class="item-val">Pipeline Bubble F_bubble</text>

      <!-- Triad -->
      <rect x="0" y="124" width="186" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="139" class="item-header">Fundamental Invariant</text>
      <text x="8" y="154" class="item-val">C³ Distributed Tradeoff</text>
      <text x="8" y="168" class="item-val">(Compute, Comm, Capacity)</text>

      <!-- Hardware Focus -->
      <rect x="0" y="186" width="186" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="201" class="item-header">Hardware &amp; Execution</text>
      <text x="8" y="216" class="item-val">RoCEv2, InfiniBand NDR</text>
      <text x="8" y="230" class="item-val">Disaggregated Prefill/Decode</text>

      <!-- Binding Bottleneck -->
      <rect x="0" y="248" width="186" height="56" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="8" y="264" class="item-header" fill="#991b1b">Binding Bottleneck</text>
      <text x="8" y="279" class="item-val" fill="#b91c1c">Inter-Node All-Reduce Skew</text>
      <text x="8" y="294" class="item-val" fill="#b91c1c">KV-Cache Capacity Stranding</text>
    </g>
  </g>

  <!-- Volume 3 Column (Emerald - Active Volume) -->
  <g transform="translate(475, 68)">
    <rect width="210" height="382" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2.2" filter="url(#shadow)"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="210" height="52" rx="8" fill="#ecfdf5"/>
    <path d="M 0 44 L 0 52 L 210 52 L 210 44 Z" fill="#ecfdf5"/>
    <line x1="0" y1="52" x2="210" y2="52" stroke="#a7f3d0" stroke-width="1"/>
    <text x="14" y="23" class="col-title" fill="#065f46">Volume III: The Agent</text>
    <text x="14" y="40" class="col-sub" fill="#059669">Inference-Time &amp; Trajectories</text>

    <!-- Content Blocks -->
    <g transform="translate(12, 64)">
      <!-- Abstraction -->
      <rect x="0" y="0" width="186" height="54" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="15" class="item-header">Primary Abstraction</text>
      <text x="8" y="30" class="item-val">Agent Control Block (ACB)</text>
      <text x="8" y="44" class="item-val">Radix Prefix Tree + Sagas</text>

      <!-- Governing Physics -->
      <rect x="0" y="62" width="186" height="54" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="77" class="item-header">Governing Physics</text>
      <text x="8" y="92" class="item-val">Error Compounding (p^H)</text>
      <text x="8" y="106" class="item-val">Reversibility Boundary (A⁻¹)</text>

      <!-- Triad -->
      <rect x="0" y="124" width="186" height="54" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="139" class="item-header">Fundamental Triad</text>
      <text x="8" y="154" class="item-val">H · S · A Triad</text>
      <text x="8" y="168" class="item-val">(Horizon, State, Authority)</text>

      <!-- Hardware Focus -->
      <rect x="0" y="186" width="186" height="54" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="201" class="item-header">Hardware &amp; Execution</text>
      <text x="8" y="216" class="item-val">MicroVM Sandboxes, Wasm</text>
      <text x="8" y="230" class="item-val">OpenTelemetry GenAI Traces</text>

      <!-- Binding Bottleneck -->
      <rect x="0" y="248" width="186" height="56" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="8" y="264" class="item-header" fill="#991b1b">Binding Bottleneck</text>
      <text x="8" y="279" class="item-val" fill="#b91c1c">Context Window Pollution</text>
      <text x="8" y="294" class="item-val" fill="#b91c1c">Irreversible Environment Side-Fx</text>
    </g>
  </g>

  <!-- Volume 4 Column (Amber) -->
  <g transform="translate(700, 68)">
    <rect width="215" height="382" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="215" height="52" rx="8" fill="#fffbeb"/>
    <path d="M 0 44 L 0 52 L 215 52 L 215 44 Z" fill="#fffbeb"/>
    <line x1="0" y1="52" x2="215" y2="52" stroke="#fde68a" stroke-width="1"/>
    <text x="14" y="23" class="col-title" fill="#92400e">Volume IV: Physical AI</text>
    <text x="14" y="40" class="col-sub" fill="#d97706">Embodied &amp; Real-Time Systems</text>

    <!-- Content Blocks -->
    <g transform="translate(12, 64)">
      <!-- Abstraction -->
      <rect x="0" y="0" width="191" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="15" class="item-header">Primary Abstraction</text>
      <text x="8" y="30" class="item-val">Cyber-Physical Actor Loop</text>
      <text x="8" y="44" class="item-val">Sensorimotor Policy Kernel</text>

      <!-- Governing Physics -->
      <rect x="0" y="62" width="191" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="77" class="item-header">Governing Physics</text>
      <text x="8" y="92" class="item-val">Hard Real-Time Deadlines (τ)</text>
      <text x="8" y="106" class="item-val">Newtonian Dynamics &amp; Safety</text>

      <!-- Triad -->
      <rect x="0" y="124" width="191" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="139" class="item-header">Fundamental Triad</text>
      <text x="8" y="154" class="item-val">S · A · E Triad</text>
      <text x="8" y="168" class="item-val">(Sensation, Actuation, Energy)</text>

      <!-- Hardware Focus -->
      <rect x="0" y="186" width="191" height="54" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="201" class="item-header">Hardware &amp; Execution</text>
      <text x="8" y="216" class="item-val">Edge NPUs, Neuromorphic</text>
      <text x="8" y="230" class="item-val">EtherCAT, CAN Bus, RTOS</text>

      <!-- Binding Bottleneck -->
      <rect x="0" y="248" width="191" height="56" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="8" y="264" class="item-header" fill="#991b1b">Binding Bottleneck</text>
      <text x="8" y="279" class="item-val" fill="#b91c1c">Actuator Latency Jitter</text>
      <text x="8" y="294" class="item-val" fill="#b91c1c">Physical Catastrophic Damage</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(25, 460)">
    <rect width="890" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="64" rx="3" fill="#2563eb"/>
    <text x="22" y="24" class="footer-title">The Unifying MLSys Principle: The Invariant Closure across Computing Domains</text>
    <text x="22" y="44" class="footer-desc">While computational mechanisms evolve from GPU kernels (Vol I) to distributed clusters (Vol II), software trajectory runtimes (Vol III), and embodied robots (Vol IV),</text>
    <text x="22" y="56" class="footer-desc">architectural invariants—resource isolation, cache locality, fail-safe verification, and state reversibility—remain the permanent foundations of machine learning engineering.</text>
  </g>
</svg>
