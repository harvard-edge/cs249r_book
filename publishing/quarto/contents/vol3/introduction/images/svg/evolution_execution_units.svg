<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="rowShadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
  </defs>

  <rect width="840" height="480" fill="#FFFFFF"/>

  <!-- Main Title -->
  <text x="420" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Evolution of Systems Execution Units</text>
  <text x="420" y="48" text-anchor="middle" font-size="9.5" fill="#64748B">From nanosecond silicon primitives to multi-hour autonomous stateful trajectories</text>

  <!-- Row 1: Machine Instruction -->
  <g filter="url(#rowShadow)">
    <rect x="30" y="65" width="780" height="62" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="30" y="65" width="160" height="62" rx="6" fill="#F1F5F9"/>
    <rect x="180" y="65" width="10" height="62" fill="#F1F5F9"/>
    <text x="110" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">1. Machine Instruction</text>
    <text x="110" y="108" text-anchor="middle" font-size="8.5" fill="#64748B">Clock: 10⁻⁹ s (1 ns)</text>
    <text x="210" y="92" font-size="10" font-weight="600" fill="#1E293B">Execution Primitives: <tspan font-family="Courier, monospace" fill="#475569">ADD, SUB, LOAD, STORE, JMP</tspan></text>
    <text x="210" y="110" font-size="9" fill="#64748B">Hardware ALU &amp; registers • Completely deterministic • Atomic state transition</text>
    <rect x="705" y="80" width="90" height="28" rx="4" fill="#E2E8F0"/>
    <text x="750" y="98" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Hardware Core</text>
  </g>

  <!-- Row 2: POSIX Process -->
  <g filter="url(#rowShadow)">
    <rect x="30" y="140" width="780" height="62" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="30" y="140" width="160" height="62" rx="6" fill="#F1F5F9"/>
    <rect x="180" y="140" width="10" height="62" fill="#F1F5F9"/>
    <text x="110" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">2. OS Process &amp; Thread</text>
    <text x="110" y="183" text-anchor="middle" font-size="8.5" fill="#64748B">Cadence: 10⁻⁶ s (1 μs)</text>
    <text x="210" y="167" font-size="10" font-weight="600" fill="#1E293B">Kernel Abstractions: <tspan font-family="Courier, monospace" fill="#475569">fork(), exec(), context switch, mmap()</tspan></text>
    <text x="210" y="185" font-size="9" fill="#64748B">Operating system kernel &amp; MMU • Hardware page tables • POSIX protection rings</text>
    <rect x="705" y="155" width="90" height="28" rx="4" fill="#E2E8F0"/>
    <text x="750" y="173" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">OS Kernel</text>
  </g>

  <!-- Row 3: Distributed RPC / HTTP -->
  <g filter="url(#rowShadow)">
    <rect x="30" y="215" width="780" height="62" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="30" y="215" width="160" height="62" rx="6" fill="#F1F5F9"/>
    <rect x="180" y="215" width="10" height="62" fill="#F1F5F9"/>
    <text x="110" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">3. Distributed RPC / HTTP</text>
    <text x="110" y="258" text-anchor="middle" font-size="8.5" fill="#64748B">Latency: 10⁻³ s (1 ms)</text>
    <text x="210" y="242" font-size="10" font-weight="600" fill="#1E293B">Stateless Transactions: <tspan font-family="Courier, monospace" fill="#475569">POST /api/v1/resource {"payload"} -&gt; 200 OK</tspan></text>
    <text x="210" y="260" font-size="9" fill="#64748B">Network gateways &amp; REST protocols • Idempotent retries • Stateless client-server</text>
    <rect x="705" y="230" width="90" height="28" rx="4" fill="#E2E8F0"/>
    <text x="750" y="248" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Network Fabric</text>
  </g>

  <!-- Row 4: Foundation Model Oracle -->
  <g filter="url(#rowShadow)">
    <rect x="30" y="290" width="780" height="62" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="30" y="290" width="160" height="62" rx="6" fill="#F1F5F9"/>
    <rect x="180" y="290" width="10" height="62" fill="#F1F5F9"/>
    <text x="110" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">4. Model Inference Pass</text>
    <text x="110" y="333" text-anchor="middle" font-size="8.5" fill="#64748B">Latency: 10⁻¹ s (100 ms)</text>
    <text x="210" y="317" font-size="10" font-weight="600" fill="#1E293B">Stateless Neural Query: <tspan font-family="Courier, monospace" fill="#475569">f_theta(prompt) -&gt; token stream (Oracle)</tspan></text>
    <text x="210" y="335" font-size="9" fill="#64748B">GPU GEMM matrix engines • Ephemeral KV cache • Unchanged physical world</text>
    <rect x="705" y="305" width="90" height="28" rx="4" fill="#E2E8F0"/>
    <text x="750" y="323" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Inference Server</text>
  </g>

  <!-- Row 5: Autonomous Agent Trajectory (FEATURED) -->
  <g filter="url(#rowShadow)">
    <rect x="30" y="365" width="780" height="90" rx="8" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
    <rect x="30" y="365" width="160" height="90" rx="8" fill="url(#purpleGrad)"/>
    <rect x="180" y="365" width="10" height="90" fill="url(#purpleGrad)"/>
    <text x="110" y="405" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">5. Autonomous Trajectory</text>
    <text x="110" y="423" text-anchor="middle" font-size="9" fill="#E9D5FF" font-weight="600">Horizon: 10¹ – 10⁴ s (Hours)</text>
    <text x="110" y="438" text-anchor="middle" font-size="8" fill="#D8B4FE">Stateful Closed Loop</text>
    <text x="210" y="394" font-size="10.5" font-weight="700" fill="#3B0764">Closed-Loop Loop: <tspan font-family="Courier, monospace" fill="#581C87">Goal -&gt; [Act -&gt; Observe -&gt; Verify]ᴺ -&gt; Outcome</tspan></text>
    <text x="210" y="415" font-size="9" fill="#4B5563">• Non-stationary belief state updates (h_{t+1}) and compounding covariate drift</text>
    <text x="210" y="431" font-size="9" fill="#4B5563">• Side-effect mutations crossing the Reversibility Boundary (Sagas &amp; compensation)</text>
    <text x="210" y="447" font-size="9" fill="#4B5563">• Managed by Agent Control Block (ACB), tool sandboxes, and verification oracles</text>
    <rect x="695" y="395" width="105" height="32" rx="4" fill="#581C87"/>
    <text x="747" y="415" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">Agent Runtime</text>
  </g>
</svg>
