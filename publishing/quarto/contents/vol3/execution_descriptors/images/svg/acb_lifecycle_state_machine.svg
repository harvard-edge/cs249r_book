<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="640" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="470" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">The Agent Control Block (ACB) Finite State Machine</text>
  <text x="470" y="46" text-anchor="middle" font-size="9.5" fill="#64748B">Runtime lifecycle transitions, accelerator memory eviction triggers, and compensating rollback paths</text>

  <!-- STATE 1: INITIALIZED (Top Left) -->
  <g filter="url(#shadow)" transform="translate(40, 75)">
    <rect width="180" height="70" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
    <text x="90" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">INITIALIZED</text>
    <text x="90" y="42" text-anchor="middle" font-size="8" fill="#475569">• Allocate ACB &amp; Session UUID</text>
    <text x="90" y="55" text-anchor="middle" font-size="8" fill="#475569">• Validate Attenuated Leases</text>
  </g>

  <!-- Transition: INITIALIZED -> ACTIVE_PREFILL -->
  <line x1="220" y1="110" x2="300" y2="110" stroke="#581C87" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="260" y="102" text-anchor="middle" font-size="8" font-weight="600" fill="#581C87">dispatch()</text>

  <!-- STATE 2: ACTIVE_PREFILL (Center Top) -->
  <g filter="url(#shadow)" transform="translate(310, 75)">
    <rect width="220" height="70" rx="8" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
    <rect width="220" height="20" rx="8" fill="#581C87"/>
    <rect y="12" width="220" height="8" fill="#581C87"/>
    <text x="110" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">ACTIVE_PREFILL</text>
    <text x="110" y="38" text-anchor="middle" font-size="8.5" font-weight="600" fill="#3B0764">Compute-Bound (GEMM)</text>
    <text x="110" y="52" text-anchor="middle" font-size="8" fill="#581C87">• Ingest Context &amp; Tool Return</text>
    <text x="110" y="63" text-anchor="middle" font-size="8" fill="#581C87">• Populate KV Cache Blocks</text>
  </g>

  <!-- Transition: ACTIVE_PREFILL -> ACTIVE_DECODE -->
  <line x1="530" y1="110" x2="620" y2="110" stroke="#581C87" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="575" y="102" text-anchor="middle" font-size="8" font-weight="600" fill="#581C87">first_token()</text>

  <!-- STATE 3: ACTIVE_DECODE (Top Right) -->
  <g filter="url(#shadow)" transform="translate(630, 75)">
    <rect width="230" height="70" rx="8" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
    <rect width="230" height="20" rx="8" fill="#581C87"/>
    <rect y="12" width="230" height="8" fill="#581C87"/>
    <text x="115" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">ACTIVE_DECODE</text>
    <text x="115" y="38" text-anchor="middle" font-size="8.5" font-weight="600" fill="#3B0764">Memory-Bandwidth Bound (GEMV)</text>
    <text x="115" y="52" text-anchor="middle" font-size="8" fill="#581C87">• Autoregressive Token Step</text>
    <text x="115" y="63" text-anchor="middle" font-size="8" fill="#581C87">• Grammar / CFG Constraint Logits</text>
  </g>

  <!-- Transition: DECODE -> DECODE (loop) -->
  <path d="M 750,75 C 750,45 800,45 800,75" fill="none" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="775" y="40" text-anchor="middle" font-size="7.5" fill="#7E22CE">emit_thought_token()</text>

  <!-- Transition: ACTIVE_DECODE -> SUSPENDED_TOOL_WAIT -->
  <path d="M 745,145 L 745,215" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="750" y="180" font-size="8" font-weight="600" fill="#1E40AF">tool_call_emitted()</text>

  <!-- STATE 4: SUSPENDED_TOOL_WAIT (Middle Right) -->
  <g filter="url(#shadow)" transform="translate(610, 220)">
    <rect width="270" height="95" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
    <text x="135" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E40AF">SUSPENDED_TOOL_WAIT</text>
    <text x="135" y="36" text-anchor="middle" font-size="8" fill="#1E3A8A">External Sandbox / Network I/O Wait</text>
    <line x1="15" y1="44" x2="255" y2="44" stroke="#BFDBFE" stroke-width="1"/>
    <text x="135" y="58" text-anchor="middle" font-size="8" fill="#2563EB">• If T_wait &lt; tau_swap : Retain HBM blocks</text>
    <text x="135" y="72" text-anchor="middle" font-size="8" font-weight="600" fill="#DC2626">• If T_wait &gt;= tau_swap : Evict KV to Host DRAM</text>
    <text x="135" y="86" text-anchor="middle" font-size="7.5" fill="#64748B">Enforce Tool Timeout Tripwire</text>
  </g>

  <!-- Transition: TOOL_WAIT -> ACTIVE_PREFILL (on tool return) -->
  <path d="M 610,265 L 420,265 L 420,150" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowBlue)"/>
  <text x="515" y="255" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">tool_return(obs) • Prefetch KV</text>

  <!-- Transition: DECODE -> HUMAN_GATE -->
  <path d="M 670,145 L 670,185 L 160,185 L 160,215" fill="none" stroke="#D97706" stroke-width="1.6" marker-end="url(#arrowAmber)"/>
  <text x="415" y="178" text-anchor="middle" font-size="8" font-weight="600" fill="#B45309">high_blast_radius_action() • Hold for Authorization</text>

  <!-- STATE 5: SUSPENDED_HUMAN_GATE (Middle Left) -->
  <g filter="url(#shadow)" transform="translate(40, 220)">
    <rect width="250" height="95" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
    <text x="125" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">SUSPENDED_HUMAN_GATE</text>
    <text x="125" y="36" text-anchor="middle" font-size="8" fill="#78350F">Supervisory Authorization Hold (10^2 - 10^5 s)</text>
    <line x1="15" y1="44" x2="235" y2="44" stroke="#FDE68A" stroke-width="1"/>
    <text x="125" y="58" text-anchor="middle" font-size="8" fill="#92400E">• 100% KV-Cache Evicted to Cold NVMe</text>
    <text x="125" y="72" text-anchor="middle" font-size="8" fill="#92400E">• ACB Serialized to Event-Sourced DB</text>
    <text x="125" y="86" text-anchor="middle" font-size="7.5" fill="#B45309">Non-repudiation audit lease lock</text>
  </g>

  <!-- Transition: HUMAN_GATE -> ACTIVE_PREFILL -->
  <path d="M 290,265 L 360,265 L 360,150" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>
  <text x="325" y="255" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">approved()</text>

  <!-- STATE 6: CHECKPOINTING (Center Bottom) -->
  <g filter="url(#shadow)" transform="translate(310, 360)">
    <rect width="220" height="75" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">CHECKPOINTING</text>
    <text x="110" y="40" text-anchor="middle" font-size="8" fill="#475569">• WAL Append • State Snapshot</text>
    <text x="110" y="54" text-anchor="middle" font-size="8" fill="#475569">• Vector Clock Tick: V_c(e)</text>
    <text x="110" y="66" text-anchor="middle" font-size="7.5" fill="#64748B">• Token Burn Accounting</text>
  </g>

  <!-- Transition: DECODE -> CHECKPOINTING -->
  <path d="M 645,145 L 645,385 L 535,385" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="610" y="378" font-size="7.5" fill="#475569">turn_complete()</text>

  <!-- STATE 7: COMPENSATING_ROLLBACK (Bottom Left) -->
  <g filter="url(#shadow)" transform="translate(40, 360)">
    <rect width="250" height="75" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
    <text x="125" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991B1B">COMPENSATING_ROLLBACK</text>
    <text x="125" y="40" text-anchor="middle" font-size="8" fill="#B91C1C">Unwind Sagas Stack S_c in LIFO Order</text>
    <text x="125" y="54" text-anchor="middle" font-size="8" fill="#DC2626">• Execute Inverses: a_i^(-1)</text>
    <text x="125" y="66" text-anchor="middle" font-size="7.5" fill="#7F1D1D">Verification Failed or Invariant Violated</text>
  </g>

  <!-- Transition: Checkpointing -> Rollback on error -->
  <line x1="310" y1="395" x2="295" y2="395" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="302" y="388" text-anchor="middle" font-size="7.5" font-weight="600" fill="#DC2626">fail</text>

  <!-- STATE 8: TERMINATED (Bottom Right) -->
  <g filter="url(#shadow)" transform="translate(610, 360)">
    <rect width="270" height="75" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
    <text x="135" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">TERMINATED</text>
    <line x1="15" y1="30" x2="255" y2="30" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="46" text-anchor="middle" font-size="8.5" font-weight="600" fill="#059669">SUCCESS: Goal Satisfied &amp; Verified</text>
    <text x="135" y="62" text-anchor="middle" font-size="8.5" font-weight="600" fill="#DC2626">ABORT: Quota Exhausted / Deadlock</text>
  </g>

  <!-- Transition: Checkpointing -> Terminated (Success) -->
  <path d="M 530,395 L 605,395" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="568" y="388" text-anchor="middle" font-size="8" font-weight="600" fill="#059669">Psi(s) = True</text>

  <!-- Clean Route: Rollback -> Terminated (Abort) via bottom bypass -->
  <path d="M 165,435 L 165,465 L 745,465 L 745,440" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <text x="455" y="460" text-anchor="middle" font-size="8" font-weight="600" fill="#DC2626">rollback_complete() • emit_audit_trace()</text>

  <!-- INVARIANT STRIP AT BOTTOM -->
  <g filter="url(#shadow)" transform="translate(40, 500)">
    <rect width="840" height="80" rx="6" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.2"/>
    <text x="420" y="24" text-anchor="middle" font-size="10.5" font-weight="700" fill="#581C87">Architectural Invariants of the ACB Lifecycle</text>
    <text x="420" y="44" text-anchor="middle" font-size="8.5" fill="#3B0764">1. Zero Idle HBM Invariant: Suspended states exceeding tau_swap MUST relinquish GPU memory blocks to host memory pool.</text>
    <text x="420" y="60" text-anchor="middle" font-size="8.5" fill="#3B0764">2. Reversibility Boundary: Unsandboxed mutations require explicit HUMAN_GATE suspension or verified compensating Sagas.</text>
    <text x="420" y="74" text-anchor="middle" font-size="8" fill="#7E22CE">3. Termination Guarantee: Every state transition is guarded by monotonic token/time quotas to prevent non-terminating loops.</text>
  </g>
</svg>
