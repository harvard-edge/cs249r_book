<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15.5px; font-weight: 700; fill: #FFFFFF; }
      .banner-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 500; fill: #E9D5FF; }
      .sec-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1E1B4B; }
      .token-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .sub-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; }
      .math-text { font-family: ui-monospace, monospace; font-size: 11.5px; font-weight: 700; }
    </style>
    <linearGradient id="grad-head2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#FAFAFC" rx="10" stroke="#E2E8F0" stroke-width="1" />

  <!-- Header Banner -->
  <rect x="25" y="18" width="910" height="44" rx="6" fill="url(#grad-head2)" />
  <text x="42" y="45" class="banner-title">Multi-Turn Autoregressive Trajectory Loss Masking</text>
  <text x="615" y="45" class="banner-sub">Supervised Fine-Tuning Loss Boundary Architecture</text>

  <!-- Section 1: Token Sequence & Role Segmentation -->
  <g transform="translate(25, 75)">
    <rect width="910" height="165" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect width="910" height="28" rx="8" fill="#F8FAFC" />
    <rect y="20" width="910" height="8" fill="#F8FAFC" />
    <text x="16" y="19" class="sec-title">1. Trajectory Token Stream &amp; Role Segmentation</text>

    <!-- Token Blocks Row -->
    <g transform="translate(16, 38)">
      <!-- System Prompt -->
      <g transform="translate(0, 0)">
        <rect width="135" height="62" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
        <text x="10" y="18" class="label-text" fill="#334155">System Prompt</text>
        <text x="10" y="36" class="token-text" fill="#475569">&lt;|system|&gt;</text>
        <text x="10" y="50" class="token-text" fill="#64748B">"You are an agent..."</text>
      </g>

      <!-- User Instruction -->
      <g transform="translate(145, 0)">
        <rect width="135" height="62" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
        <text x="10" y="18" class="label-text" fill="#334155">User Instruction</text>
        <text x="10" y="36" class="token-text" fill="#475569">&lt;|user|&gt;</text>
        <text x="10" y="50" class="token-text" fill="#64748B">"Fix bug in auth.py"</text>
      </g>

      <!-- Assistant Thought + Tool Call -->
      <g transform="translate(290, 0)">
        <rect width="185" height="62" rx="5" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.75" />
        <text x="10" y="18" class="label-text" fill="#581C87">Agent Action 1</text>
        <rect x="110" y="5" width="68" height="15" rx="3" fill="#EDE9FE" />
        <text x="144" y="16" style="font-size: 8px; font-weight: 700; fill: #6B21A8;" text-anchor="middle">SUPERVISED</text>
        <text x="10" y="36" class="token-text" fill="#7E22CE">&lt;|thought|&gt; Inspect repo...</text>
        <text x="10" y="50" class="token-text" fill="#6B21A8">&lt;|call:run_cmd(ls)|&gt;</text>
      </g>

      <!-- Tool Execution Observation -->
      <g transform="translate(485, 0)">
        <rect width="190" height="62" rx="5" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.25" stroke-dasharray="4 2" />
        <text x="10" y="18" class="label-text" fill="#991B1B">Environment Obs</text>
        <rect x="110" y="5" width="72" height="15" rx="3" fill="#FEE2E2" />
        <text x="146" y="16" style="font-size: 8px; font-weight: 700; fill: #B91C1C;" text-anchor="middle">UNSUPERVISED</text>
        <text x="10" y="36" class="token-text" fill="#DC2626">&lt;|observation|&gt;</text>
        <text x="10" y="50" class="token-text" fill="#B91C1C">stdout: "auth.py test.py"</text>
      </g>

      <!-- Assistant Recovery / Patch -->
      <g transform="translate(685, 0)">
        <rect width="190" height="62" rx="5" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.75" />
        <text x="10" y="18" class="label-text" fill="#15803D">Agent Action 2</text>
        <rect x="122" y="5" width="62" height="15" rx="3" fill="#DCFCE7" />
        <text x="153" y="16" style="font-size: 8px; font-weight: 700; fill: #15803D;" text-anchor="middle">SUPERVISED</text>
        <text x="10" y="36" class="token-text" fill="#16A34A">&lt;|thought|&gt; Found bug...</text>
        <text x="10" y="50" class="token-text" fill="#15803D">&lt;|call:patch_file(diff)|&gt;</text>
      </g>
    </g>

    <!-- Loss Mask Indicator Row -->
    <g transform="translate(16, 115)">
      <!-- System Mask: 0 under box 1 (width 135) -->
      <rect x="20" y="4" width="95" height="22" rx="4" fill="#E2E8F0" />
      <text x="67" y="19" class="token-text" fill="#475569" style="font-weight: 700;" text-anchor="middle">M_t = 0 (Ignore)</text>

      <!-- User Mask: 0 under box 2 (width 135, offset 145) -->
      <rect x="165" y="4" width="95" height="22" rx="4" fill="#E2E8F0" />
      <text x="212" y="19" class="token-text" fill="#475569" style="font-weight: 700;" text-anchor="middle">M_t = 0 (Ignore)</text>

      <!-- Action 1 Mask: 1 under box 3 (width 185, offset 290) -->
      <rect x="335" y="4" width="95" height="22" rx="4" fill="#EDE9FE" stroke="#7E22CE" stroke-width="1.25" />
      <text x="382" y="19" class="token-text" fill="#6B21A8" style="font-weight: 700;" text-anchor="middle">M_t = 1 (Active)</text>

      <!-- Obs 1 Mask: 0 under box 4 (width 190, offset 485) -->
      <rect x="532" y="4" width="95" height="22" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 2" />
      <text x="579" y="19" class="token-text" fill="#B91C1C" style="font-weight: 700;" text-anchor="middle">M_t = 0 (Masked)</text>

      <!-- Action 2 Mask: 1 under box 5 (width 190, offset 685) -->
      <rect x="732" y="4" width="95" height="22" rx="4" fill="#DCFCE7" stroke="#15803D" stroke-width="1.25" />
      <text x="779" y="19" class="token-text" fill="#15803D" style="font-weight: 700;" text-anchor="middle">M_t = 1 (Active)</text>
    </g>
  </g>

  <!-- Section 2: Mathematical Formulation & Attention Structure -->
  <g transform="translate(25, 255)">
    <!-- Left Box: Mathematical Optimization Objective -->
    <g transform="translate(0, 0)">
      <rect width="445" height="160" rx="8" fill="#FFFFFF" stroke="#581C87" stroke-width="1.5" />
      <rect width="445" height="28" rx="8" fill="#FAF5FF" />
      <rect y="20" width="445" height="8" fill="#FAF5FF" />
      <text x="14" y="19" class="sec-title" fill="#581C87">2. Masked Trajectory Cross-Entropy Loss</text>

      <g transform="translate(16, 40)">
        <rect width="413" height="40" rx="5" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1" />
        <text x="206" y="25" class="math-text" fill="#4C1D95" text-anchor="middle">
          L(θ) = - [ 1 / Σ M_t ] · Σ [ M_t · log P_θ( x_t | x_&lt;t ) ]
        </text>
      </g>

      <text x="16" y="104" class="sub-text" style="font-weight: 600;">• Normalization Factor: Average over active policy tokens only.</text>
      <text x="16" y="122" class="sub-text">• Prevents loss dilution on long context traces with massive tool returns.</text>
      <text x="16" y="140" class="sub-text">• Gradients strictly update model reasoning and parameter generation.</text>
    </g>

    <!-- Right Box: Systems Consequences of Unmasked Environment Tokens -->
    <g transform="translate(465, 0)">
      <rect width="445" height="160" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5" />
      <rect width="445" height="28" rx="8" fill="#FFF1F2" />
      <rect y="20" width="445" height="8" fill="#FFF1F2" />
      <text x="14" y="19" class="sec-title" fill="#BE123C">3. Systems Failure Modes of Unmasked Training</text>

      <text x="16" y="48" class="label-text" fill="#9F1239">A. Hallucinated Environment Simulation</text>
      <text x="16" y="64" class="sub-text">Model memorizes arbitrary database returns instead of querying live tools.</text>

      <text x="16" y="86" class="label-text" fill="#9F1239">B. Covariate Collapse &amp; Exposure Bias</text>
      <text x="16" y="102" class="sub-text">Stochastic deviations in environment stdout trigger out-of-distribution crashes.</text>

      <text x="16" y="124" class="label-text" fill="#9F1239">C. Gradient Swamping</text>
      <text x="16" y="140" class="sub-text">Large 10k-token compiler dumps dominate backprop, zeroing out tool logic.</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(25, 430)">
    <rect width="910" height="90" rx="8" fill="#EDE9FE" stroke="#A855F7" stroke-width="1.25" />
    <text x="16" y="24" class="sec-title" fill="#581C87">Architectural Takeaway: The Reversibility and Causality Boundary</text>
    <text x="16" y="46" class="sub-text" fill="#3B0764">
      In multi-turn agent systems, the context sequence alternates between <tspan font-weight="700">agent control states</tspan> (thoughts, tool schemas, call arguments)
    </text>
    <text x="16" y="62" class="sub-text" fill="#3B0764">
      and <tspan font-weight="700">environment returns</tspan> (shell stdout, API payloads, error traces). Because external environments are non-differentiable stochastic
    </text>
    <text x="16" y="78" class="sub-text" fill="#3B0764">
      processes outside the model's parameter manifold, setting $M_t = 0$ on all environment tokens is mandatory for valid causal credit assignment.
    </text>
  </g>
</svg>
