# =============================================================================
# VOLUME IV HTML WEBSITE CONFIGURATION: Physical AI Systems
# =============================================================================
# Builds Volume IV: Physical AI Systems
# Deploys to: mlsysbook.ai/vol4/
# =============================================================================

project:
  type: website
  output-dir: _build/html-vol4
  execute-dir: project

  resources:
    - assets/images/covers/*
    - assets/downloads/*

  render:
    - index.qmd
    - contents/vol4/front-matter/author_note.qmd
    - contents/vol4/front-matter/about.qmd
    - contents/vol4/front-matter/about-author.qmd
    - contents/vol4/front-matter/prerequisites.qmd
    - contents/vol4/front-matter/syllabus.qmd
    - contents/vol4/front-matter/notation.qmd
    - contents/vol4/parts/part-i.qmd
    - contents/vol4/chapters/01-boundary/01-boundary.qmd
    - contents/vol4/chapters/02-body/02-body.qmd
    - contents/vol4/chapters/04-nervous/04-nervous.qmd
    - contents/vol4/chapters/03-brain/03-brain.qmd
    - contents/vol4/parts/part-ii.qmd
    - contents/vol4/chapters/05-data/05-data.qmd
    - contents/vol4/chapters/06-training/06-training.qmd
    - contents/vol4/chapters/07-evaluation/07-evaluation.qmd
    - contents/vol4/parts/part-iii.qmd
    - contents/vol4/chapters/08-perception/08-perception.qmd
    - contents/vol4/chapters/09-memory/09-memory.qmd
    - contents/vol4/chapters/10-intent/10-intent.qmd
    - contents/vol4/chapters/11-planning/11-planning.qmd
    - contents/vol4/chapters/12-enforcement/12-enforcement.qmd
    - contents/vol4/chapters/13-placement/13-placement.qmd
    - contents/vol4/parts/part-iv.qmd
    - contents/vol4/chapters/14-intervention/14-intervention.qmd
    - contents/vol4/chapters/15-verification/15-verification.qmd
    - contents/vol4/chapters/16-release/16-release.qmd
    - contents/vol4/chapters/17-frontier/17-frontier.qmd
    - contents/vol4/appendix/math-reference.qmd
    - contents/vol4/appendix/hardware-reference.qmd
    - contents/vol4/appendix/heterogeneous-soc-reference.qmd
    - contents/vol4/appendix/standards-and-incidents.qmd
    - contents/vol4/appendix/cross-disciplinary-lexicon.qmd
    - contents/vol4/appendix/glossary.qmd
    - contents/vol4/appendix/notebook-templates.qmd

  post-render:
    - scripts/clean_svgs.py
    - scripts/resolve_cross_references.py
    - scripts/fix_lightbox_paths.py

  preview:
    browser: false
    navigate: false

website:
  title: "Physical AI: Machine Learning Systems"
  description: "Volume IV: Physical AI: Machine Learning Systems That Sense and Act."
  site-url: https://mlsysbook.ai/vol4/

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    image: assets/images/covers/cover-hardcover-book-vol4.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: assets/images/covers/cover-hardcover-book-vol4.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    keyboard-shortcut: ["/"]

  navbar:
    logo: "assets/images/icons/logo-seas-shield.png"
    search: true
    title: "Machine Learning Systems"

  favicon: assets/images/icons/favicon.png

  sidebar:
    - id: vol4-content
      title: "Volume IV"
      style: "floating"
      background: light
      collapse-level: 2
      contents:
        - text: "Homepage"
          href: index.qmd
        - href: contents/vol4/front-matter/author_note.qmd
        - href: contents/vol4/front-matter/about.qmd
        - href: contents/vol4/front-matter/about-author.qmd
        - href: contents/vol4/front-matter/prerequisites.qmd
        - href: contents/vol4/front-matter/syllabus.qmd
        - href: contents/vol4/front-matter/notation.qmd

        - text: "---"

        - section: "Part I: The Machine Anatomy"
          id: vol4-part1
          href: contents/vol4/parts/part-i.qmd
          contents:
            - href: contents/vol4/chapters/01-boundary/01-boundary.qmd
            - href: contents/vol4/chapters/02-body/02-body.qmd
            - href: contents/vol4/chapters/04-nervous/04-nervous.qmd
            - href: contents/vol4/chapters/03-brain/03-brain.qmd

        - section: "Part II: Teaching the Machine"
          id: vol4-part2
          href: contents/vol4/parts/part-ii.qmd
          contents:
            - href: contents/vol4/chapters/05-data/05-data.qmd
            - href: contents/vol4/chapters/06-training/06-training.qmd
            - href: contents/vol4/chapters/07-evaluation/07-evaluation.qmd

        - section: "Part III: Running the Machine"
          id: vol4-part3
          href: contents/vol4/parts/part-iii.qmd
          contents:
            - href: contents/vol4/chapters/08-perception/08-perception.qmd
            - href: contents/vol4/chapters/09-memory/09-memory.qmd
            - href: contents/vol4/chapters/10-intent/10-intent.qmd
            - href: contents/vol4/chapters/11-planning/11-planning.qmd
            - href: contents/vol4/chapters/12-enforcement/12-enforcement.qmd
            - href: contents/vol4/chapters/13-placement/13-placement.qmd

        - section: "Part IV: Governing the Machine"
          id: vol4-part4
          href: contents/vol4/parts/part-iv.qmd
          contents:
            - href: contents/vol4/chapters/14-intervention/14-intervention.qmd
            - href: contents/vol4/chapters/15-verification/15-verification.qmd
            - href: contents/vol4/chapters/16-release/16-release.qmd
            - href: contents/vol4/chapters/17-frontier/17-frontier.qmd

        - section: "Appendices"
          id: vol4-appendices
          contents:
            - href: contents/vol4/appendix/math-reference.qmd
            - href: contents/vol4/appendix/hardware-reference.qmd
            - href: contents/vol4/appendix/heterogeneous-soc-reference.qmd
            - href: contents/vol4/appendix/standards-and-incidents.qmd
            - href: contents/vol4/appendix/cross-disciplinary-lexicon.qmd
            - href: contents/vol4/appendix/glossary.qmd
            - href: contents/vol4/appendix/notebook-templates.qmd

  page-footer:
    center: |
      <a href="../vol1/">Back to Volume I →</a>

bibliography:
  - contents/references-vol4.bib

format:
  html:
    lightbox: true
    mermaid:
      theme: default
    theme:
      light:
        - default
        - assets/styles/style-vol4.scss
      dark:
        - default
        - assets/styles/style-vol4.scss
        - assets/styles/dark-mode-vol4.scss
    respect-user-color-scheme: true
    title-prefix: ""
    pagetitle: "Physical AI: Machine Learning Systems"
    code-block-bg: true
    code-copy: true
    code-overflow: wrap
    language:
      title-block-author-single: "Author, Editor & Curator"
      title-block-published: "Last Updated"
    reference-location: margin
    citation-location: margin
    sidenote: true
    syntax-highlighting: assets/styles/custom-code.theme
    code-link: true
    link-external-icon: false
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: false
    citations-hover: false
    footnotes-hover: false
    fig-width: 7
    fig-height: 5
    toc: true
    toc-depth: 4
    toc-expand: true
    toc-title: "On this page"
    number-sections: false
    number-depth: 3
    include-in-header:
      - file: ../../shared/config/site-head.html
      - text: |
          <link rel="manifest" href="/site.webmanifest">
          <link rel="apple-touch-icon" href="/assets/images/icons/favicon.png">
          <meta name="theme-color" content="#065F46">
          <script src="/assets/scripts/sidebar-auto-collapse.js" defer></script>
          <script src="/assets/scripts/version-link.js" defer></script>
          <script src="/assets/scripts/subscribe-modal.js" defer></script>
    citeproc: true

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/html/filters.yml
  - config/shared/html/announcement-vol4.yml
  - ../../shared/config/navbar-common.yml
  - config/shared/html/footer-common.yml
