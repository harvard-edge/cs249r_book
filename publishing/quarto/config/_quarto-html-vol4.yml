# =============================================================================
# VOLUME IV HTML WEBSITE CONFIGURATION: Physical AI Systems
# =============================================================================
# Builds Volume IV: Physical AI Systems
# Deploys to: mlsysbook.ai/vol4/
# =============================================================================

project:
  type: website
  output-dir: _build/html-vol4
  execute-dir: project

  resources:
    - assets/images/covers/*
    - assets/downloads/*

  render:
    - index.qmd
    - contents/vol4/frontmatter/dedication.qmd
    - contents/vol4/frontmatter/author_note.qmd
    - contents/vol4/frontmatter/about.qmd
    - contents/vol4/frontmatter/about_author.qmd
    - contents/vol4/frontmatter/prerequisites.qmd
    - contents/vol4/frontmatter/syllabus.qmd
    - contents/vol4/frontmatter/acknowledgements.qmd
    - contents/vol4/frontmatter/ai_use.qmd
    - contents/vol4/frontmatter/notation.qmd
    - contents/vol4/boundary/boundary.qmd
    - contents/vol4/parts/anatomy_principles.qmd
    - contents/vol4/body/body.qmd
    - contents/vol4/nervous/nervous.qmd
    - contents/vol4/brain/brain.qmd
    - contents/vol4/parts/teaching_principles.qmd
    - contents/vol4/data/data.qmd
    - contents/vol4/training/training.qmd
    - contents/vol4/evaluation/evaluation.qmd
    - contents/vol4/parts/running_principles.qmd
    - contents/vol4/perception/perception.qmd
    - contents/vol4/memory/memory.qmd
    - contents/vol4/intent/intent.qmd
    - contents/vol4/planning/planning.qmd
    - contents/vol4/enforcement/enforcement.qmd
    - contents/vol4/placement/placement.qmd
    - contents/vol4/parts/governing_principles.qmd
    - contents/vol4/intervention/intervention.qmd
    - contents/vol4/verification/verification.qmd
    - contents/vol4/release/release.qmd
    - contents/vol4/frontier/frontier.qmd
    - contents/vol4/backmatter/references.qmd
    - contents/vol4/backmatter/appendix_math.qmd
    - contents/vol4/backmatter/appendix_hardware.qmd
    - contents/vol4/backmatter/appendix_heterogeneous_soc.qmd
    - contents/vol4/backmatter/appendix_standards.qmd
    - contents/vol4/backmatter/appendix_lexicon.qmd
    - contents/vol4/backmatter/glossary/glossary.qmd

  post-render:
    - scripts/clean_svgs.py
    - scripts/resolve_cross_references.py
    - scripts/fix_lightbox_paths.py

  preview:
    browser: false
    navigate: false

website:
  title: "Physical AI"
  description: "Volume IV: Physical AI: Machine Learning Systems That Sense and Act."
  site-url: https://mlsysbook.ai/vol4/

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    image: assets/images/covers/cover-hardcover-book-vol4.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: assets/images/covers/cover-hardcover-book-vol4.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    keyboard-shortcut: ["/"]

  navbar:
    logo: "assets/images/icons/logo-seas-shield.png"
    search: true
    title: "Machine Learning Systems"

  favicon: assets/images/icons/favicon.png

  sidebar:
    - id: vol4-content
      title: "Volume IV"
      style: "floating"
      background: light
      collapse-level: 2
      contents:
        - text: "Homepage"
          href: contents/vol4/index.qmd
        - href: contents/vol4/frontmatter/dedication.qmd
        - href: contents/vol4/frontmatter/author_note.qmd
        - href: contents/vol4/frontmatter/about.qmd
        - href: contents/vol4/frontmatter/about_author.qmd
        - href: contents/vol4/frontmatter/prerequisites.qmd
        - href: contents/vol4/frontmatter/syllabus.qmd
        - href: contents/vol4/frontmatter/acknowledgements.qmd
        - href: contents/vol4/frontmatter/ai_use.qmd
        - href: contents/vol4/frontmatter/notation.qmd

        - text: "---"

        # Introduction (frames the whole book)
        - text: "Introduction: The Causal Boundary"
          href: contents/vol4/boundary/boundary.qmd

        - section: "Part I: The Machine Anatomy"
          id: vol4-part1
          href: contents/vol4/parts/anatomy_principles.qmd
          contents:
            - href: contents/vol4/body/body.qmd
            - href: contents/vol4/nervous/nervous.qmd
            - href: contents/vol4/brain/brain.qmd

        - section: "Part II: Teaching the Machine"
          id: vol4-part2
          href: contents/vol4/parts/teaching_principles.qmd
          contents:
            - href: contents/vol4/data/data.qmd
            - href: contents/vol4/training/training.qmd
            - href: contents/vol4/evaluation/evaluation.qmd

        - section: "Part III: Running the Machine"
          id: vol4-part3
          href: contents/vol4/parts/running_principles.qmd
          contents:
            - href: contents/vol4/perception/perception.qmd
            - href: contents/vol4/memory/memory.qmd
            - href: contents/vol4/intent/intent.qmd
            - href: contents/vol4/planning/planning.qmd
            - href: contents/vol4/enforcement/enforcement.qmd
            - href: contents/vol4/placement/placement.qmd

        - section: "Part IV: Governing the Machine"
          id: vol4-part4
          href: contents/vol4/parts/governing_principles.qmd
          contents:
            - href: contents/vol4/intervention/intervention.qmd
            - href: contents/vol4/verification/verification.qmd
            - href: contents/vol4/release/release.qmd

        # Conclusion (synthesizes the whole book)
        - text: "Conclusion: The Epistemic Frontier"
          href: contents/vol4/frontier/frontier.qmd

        - section: "Appendices"
          id: vol4-appendices
          contents:
            - href: contents/vol4/backmatter/references.qmd
            - href: contents/vol4/backmatter/appendix_math.qmd
            - href: contents/vol4/backmatter/appendix_hardware.qmd
            - href: contents/vol4/backmatter/appendix_heterogeneous_soc.qmd
            - href: contents/vol4/backmatter/appendix_standards.qmd
            - href: contents/vol4/backmatter/appendix_lexicon.qmd
            - href: contents/vol4/backmatter/glossary/glossary.qmd

  page-footer:
    center: |
      <a href="../vol1/">Back to Volume I →</a>

bibliography: contents/references-vol4.bib
format:
  html:
    lightbox: true
    mermaid:
      theme: default
    theme:
      light:
        - default
        - assets/styles/style-vol4.scss
      dark:
        - default
        - assets/styles/style-vol4.scss
        - assets/styles/dark-mode-vol4.scss
    respect-user-color-scheme: true
    title-prefix: ""
    pagetitle: "Physical AI"
    code-block-bg: true
    code-copy: true
    code-overflow: wrap
    language:
      title-block-author-single: "Author, Editor & Curator"
      title-block-published: "Last Updated"
    reference-location: margin
    citation-location: margin
    sidenote: true
    syntax-highlighting: assets/styles/custom-code.theme
    code-link: true
    link-external-icon: false
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: false
    citations-hover: false
    footnotes-hover: false
    fig-width: 7
    fig-height: 5
    toc: true
    toc-depth: 4
    toc-expand: true
    toc-title: "On this page"
    number-sections: false
    number-depth: 3
    include-in-header:
      - file: ../../shared/config/site-head.html
      - text: |
          <link rel="manifest" href="/site.webmanifest">
          <link rel="apple-touch-icon" href="/assets/images/icons/favicon.png">
          <meta name="theme-color" content="#065F46">
          <script src="/assets/scripts/sidebar-auto-collapse.js" defer></script>
          <script src="/assets/scripts/version-link.js" defer></script>
          <script src="/assets/scripts/subscribe-modal.js" defer></script>
    citeproc: true

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/html/filters.yml
  - config/shared/html/filter-metadata.yml
  - config/shared/vol4/filter-metadata-paths.yml
  - config/shared/html/announcement-vol4.yml
  - ../../shared/config/navbar-common.yml
  - config/shared/html/footer-common.yml
