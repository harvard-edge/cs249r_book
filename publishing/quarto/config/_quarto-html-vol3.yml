          href: contents/vol3/02_deliberation/02_deliberation.qmd
        - text: "3. Context Working Sets"
          href: contents/vol3/03_working_sets/03_working_sets.qmd
        - text: "4. Virtual Context Memory"
          href: contents/vol3/04_virtual_memory/04_virtual_memory.qmd
        - text: "5. Episodic Memory"
          href: contents/vol3/05_episodic_memory/05_episodic_memory.qmd
        - text: "6. State Checkpointing & Reversibility"
          href: contents/vol3/06_checkpointing/06_checkpointing.qmd
        - text: "7. Execution Scheduling"
          href: contents/vol3/07_scheduling/07_scheduling.qmd
        - text: "8. The Actuation Boundary"
          href: contents/vol3/08_actuation/08_actuation.qmd
        - text: "9. Human-in-the-Loop Interrupts"
          href: contents/vol3/09_interrupts/09_interrupts.qmd
        - text: "10. Environment Virtualization"
          href: contents/vol3/10_virtualization/10_virtualization.qmd
        - text: "11. The Synthetic Data Flywheel"
          href: contents/vol3/11_data_flywheel/11_data_flywheel.qmd
        - text: "12. Trajectory Fine-Tuning"
          href: contents/vol3/12_sft/12_sft.qmd
        - text: "13. Reinforcement Learning with Verifiable Rewards"
          href: contents/vol3/13_rlvr/13_rlvr.qmd
        - text: "14. Distributed Stochastic Actors"
