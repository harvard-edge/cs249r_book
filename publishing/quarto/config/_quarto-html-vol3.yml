        - text: "App A: Reference Architecture"
          href: contents/vol3/appendices/app_a_reference_architecture.qmd
        - text: "App B: Tool Design & Typed ABIs"
          href: contents/vol3/appendices/app_b_tool_design.qmd
        - text: "App C: Taxonomy of Failures"
