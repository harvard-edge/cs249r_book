# =============================================================================
# VOLUME III HTML WEBSITE CONFIGURATION: Agentic Machine Learning Systems
# =============================================================================

project:
  type: website
  output-dir: _build/html-vol3
  execute-dir: project

  resources:
    - assets/images/covers/*
    - assets/downloads/*

  render:
    - index.qmd
    - contents/vol3/frontmatter/dedication.qmd
    - contents/vol3/frontmatter/author_note.qmd
    - contents/vol3/frontmatter/about.qmd
    - contents/vol3/frontmatter/acknowledgements.qmd
    - contents/vol3/frontmatter/ai_use.qmd
    - contents/vol3/frontmatter/notation.qmd
    - contents/vol3/introduction/introduction.qmd
    - contents/vol3/01_processor/01_processor.qmd
    - contents/vol3/02_deliberation/02_deliberation.qmd
    - contents/vol3/03_working_sets/03_working_sets.qmd
    - contents/vol3/04_virtual_memory/04_virtual_memory.qmd
    - contents/vol3/05_episodic_memory/05_episodic_memory.qmd
    - contents/vol3/06_checkpointing/06_checkpointing.qmd
    - contents/vol3/07_scheduling/07_scheduling.qmd
    - contents/vol3/08_actuation/08_actuation.qmd
    - contents/vol3/09_interrupts/09_interrupts.qmd
    - contents/vol3/10_virtualization/10_virtualization.qmd
    - contents/vol3/11_data_flywheel/11_data_flywheel.qmd
    - contents/vol3/12_sft/12_sft.qmd
    - contents/vol3/13_rlvr/13_rlvr.qmd
    - contents/vol3/14_multi_agent/14_multi_agent.qmd
    - contents/vol3/15_observability/15_observability.qmd
    - contents/vol3/16_tokenomics/16_tokenomics.qmd
    - contents/vol3/conclusion/conclusion.qmd
    - contents/vol3/appendices/app_a_reference_architecture.qmd
    - contents/vol3/appendices/app_b_tool_design.qmd
    - contents/vol3/appendices/app_c_failure_taxonomy.qmd
    - contents/vol3/backmatter/glossary/glossary.qmd

    - contents/vol3/backmatter/references.qmd
  post-render:
    - scripts/clean_svgs.py
    - scripts/resolve_cross_references.py
    - scripts/fix_lightbox_paths.py
    - scripts/verify_rendered_xrefs.py

  preview:
    browser: false
    navigate: false

website:
  title: "Agentic Machine Learning Systems"
  description: "Volume III: systems foundations for stateful trajectories, constrained action, and agentic operations."
  site-url: https://mlsysbook.ai/vol3/

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    image: assets/images/covers/cover-hardcover-book-vol3.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: assets/images/covers/cover-hardcover-book-vol3.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    keyboard-shortcut: ["/"]

  navbar:
    logo: "assets/images/icons/logo-seas-shield.png"
    search: true
    title: "Machine Learning Systems"

  favicon: assets/images/icons/favicon.png

  sidebar:
