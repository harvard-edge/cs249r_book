# =============================================================================
# VOLUME IV PDF CONFIGURATION: Physical AI Systems
# =============================================================================
project:
  output-dir: _build/pdf-vol4
  post-render:
    - scripts/save_latex_log.py
    - scripts/clean_svgs.py
    - scripts/mit_press/generate_figure_list.py

book:
  output-file: Machine-Learning-Systems-Vol4
  favicon: assets/images/icons/favicon.png
  cover-image: assets/images/covers/cover-hardcover-book-vol4.png
  cover-image-alt: "Book cover for Physical AI: Machine Learning Systems by Vijay Janapa Reddi, featuring an articulated robotic finger linkage and kinetic feedback loop."

  title: "Physical AI: Machine Learning Systems"

  date: today
  date-format: long

  author:
    name: Vijay Janapa Reddi
    email: vj@eecs.harvard.edu
    url: https://vijay.seas.harvard.edu/
    affiliations: Harvard University
    corresponding: true
    roles: "Author, editor and curator."

  abstract: |
    Physical AI systems engineering is governed by the non-negotiable laws of Newtonian physics, irreversible dynamics, and hard real-time latency. Unlike software behind glass where computation enjoys idempotency and memory rollbacks, physical autonomous machines pay for computational delay in millimeters and kinetic destruction.

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    left: |
      Written, edited and curated by Prof. Vijay Janapa Reddi (Harvard University)
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  chapters:
    - index.qmd

    # Frontmatter
    - contents/vol4/front-matter/about-author.qmd
    - contents/vol4/front-matter/prerequisites.qmd
    - contents/vol4/front-matter/syllabus.qmd
    - contents/vol4/front-matter/notation.qmd

    # Part I: The Machine Anatomy
    - contents/vol4/parts/part-i.qmd
    - contents/vol4/chapters/01-boundary/01-boundary.qmd
    - contents/vol4/chapters/02-body/02-body.qmd
    - contents/vol4/chapters/04-nervous/04-nervous.qmd
    - contents/vol4/chapters/03-brain/03-brain.qmd

    # Part II: Teaching the Machine
    - contents/vol4/parts/part-ii.qmd
    - contents/vol4/chapters/05-data/05-data.qmd
    - contents/vol4/chapters/06-training/06-training.qmd
    - contents/vol4/chapters/07-evaluation/07-evaluation.qmd

    # Part III: Running the Machine
    - contents/vol4/parts/part-iii.qmd
    - contents/vol4/chapters/08-perception/08-perception.qmd
    - contents/vol4/chapters/09-memory/09-memory.qmd
    - contents/vol4/chapters/10-intent/10-intent.qmd
    - contents/vol4/chapters/11-planning/11-planning.qmd
    - contents/vol4/chapters/12-enforcement/12-enforcement.qmd
    - contents/vol4/chapters/13-placement/13-placement.qmd

    # Part IV: Governing the Machine
    - contents/vol4/parts/part-iv.qmd
    - contents/vol4/chapters/14-intervention/14-intervention.qmd
    - contents/vol4/chapters/15-verification/15-verification.qmd
    - contents/vol4/chapters/16-release/16-release.qmd
    - contents/vol4/chapters/17-frontier/17-frontier.qmd

  appendices:
    - contents/vol4/appendix/math-reference.qmd
    - contents/vol4/appendix/hardware-reference.qmd
    - contents/vol4/appendix/heterogeneous-soc-reference.qmd
    - contents/vol4/appendix/standards-and-incidents.qmd
    - contents/vol4/appendix/cross-disciplinary-lexicon.qmd
    - contents/vol4/appendix/glossary.qmd
    - contents/vol4/appendix/notebook-templates.qmd

bibliography:
  - contents/references-vol4.bib
  - contents/references.bib

citation: true
license: CC-BY-NC-ND

language: config/shared/base/crossref-labels.yml

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/pdf/filters.yml
  - config/shared/pdf/filter-metadata.yml
  - config/shared/pdf/custom-numbered-blocks-overrides.yml
  - config/shared/pdf/titlepage-theme-common.yml
  - config/shared/pdf/titlepage-pdf-common.yml
  - config/shared/pdf/build-production-common.yml

execute:
  env:
    PYTHONPATH: "../..:../../mlsysim:../../../../..:../../../../../mlsysim"
    MPLBACKEND: "Agg"

format:
  titlepage-pdf:
    coverpage: false
    coverpage-title: "Machine Learning Systems"
    coverpage-bg-image: "assets/images/covers/cover-image-white-vol4.png"
    coverpage-author: ["Vijay Janapa Reddi"]
    coverpage-footer: "Physical AI"
    coverpage-theme:
        page-text-align: "left"
        bg-image-left: "0.15\\paperwidth"
        bg-image-bottom: 7
        bg-image-rotate: 0
        bg-image-opacity: 1.0
        header-style: "none"
        date-style: "none"

        footer-fontsize: 23.5
        footer-left: "0.08\\paperwidth"
        footer-bottom: "0.240\\paperwidth"
        footer-width: "0.9\\paperwidth"
        footer-align: "left"

        title-fontsize: 44
        title-left: "0.08\\paperwidth"
        title-bottom: "0.162\\paperwidth"
        title-width: "0.9\\paperwidth"

        author-style: "plain"
        author-sep: "newline"
        author-fontsize: 21.5
        author-align: "right"
        author-bottom: "0.078\\paperwidth"
        author-left: ".92\\paperwidth"
        author-width: 7in

    titlepage: true
    titlepage-theme:
      elements: [ "\\mlsysTitleBlock"]

    lof: false
    lot: false
    lol: false
    toc-depth: 2
    toc-title: "Contents"
    number-depth: 3
    keep-tex: true
    reference-location: document
    citation-location: document
    include-in-header:
      - file: "tex/header-includes.tex"
      - file: "tex/frontmatter-vol4.tex"
      - text: |
          \usepackage{needspace}
          \let\Needspace\needspace
    include-before-body:
      - file: "tex/before-body-includes.tex"
