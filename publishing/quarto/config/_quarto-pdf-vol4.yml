# =============================================================================
# VOLUME IV PDF CONFIGURATION: Physical AI Systems
# =============================================================================
project:
  output-dir: _build/pdf-vol4
  post-render:
    - scripts/save_latex_log.py
    - scripts/clean_svgs.py
    - scripts/mit_press/generate_figure_list.py

book:
  output-file: Machine-Learning-Systems-Vol4
  favicon: assets/images/icons/favicon.png
  cover-image: assets/images/covers/cover-hardcover-book-vol4.png
  cover-image-alt: "Book cover for Physical AI: Machine Learning Systems That Sense and Act by Vijay Janapa Reddi, featuring an articulated robotic finger linkage and kinetic feedback loop."

  title: "Physical AI"
  subtitle: "Machine Learning Systems That Sense and Act"

  date: today
  date-format: long

  author:
    name: Vijay Janapa Reddi
    email: vj@eecs.harvard.edu
    url: https://vijay.seas.harvard.edu/
    affiliations: Harvard University
    corresponding: true
    roles: "Author, editor and curator."

  abstract: |
    Physical AI systems engineering is governed by the non-negotiable laws of Newtonian physics, irreversible dynamics, and hard real-time latency. Unlike software behind glass where computation enjoys idempotency and memory rollbacks, physical autonomous machines pay for computational delay in millimeters and kinetic destruction.

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    left: |
      Written, edited and curated by Prof. Vijay Janapa Reddi (Harvard University)
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  chapters:
    - index.qmd

    # Frontmatter
    - contents/vol4/frontmatter/about_author.qmd
    - contents/vol4/frontmatter/prerequisites.qmd
    - contents/vol4/frontmatter/syllabus.qmd
    - contents/vol4/frontmatter/notation.qmd
    - contents/vol4/frontmatter/author_note.qmd

    # ==================================================
    # Introduction (frames the whole book)
    # ==================================================
    - contents/vol4/boundary/boundary.qmd

    # ==================================================
    # Part I: The Machine Anatomy
    # ==================================================
    - contents/vol4/parts/anatomy_principles.qmd
    - contents/vol4/body/body.qmd
    - contents/vol4/nervous/nervous.qmd
    - contents/vol4/brain/brain.qmd

    # ==================================================
    # Part II: Teaching the Machine
    # ==================================================
    - contents/vol4/parts/teaching_principles.qmd
    - contents/vol4/data/data.qmd
    - contents/vol4/training/training.qmd
    - contents/vol4/evaluation/evaluation.qmd

    # ==================================================
    # Part III: Running the Machine
    # ==================================================
    - contents/vol4/parts/running_principles.qmd
    - contents/vol4/perception/perception.qmd
    - contents/vol4/memory/memory.qmd
    - contents/vol4/intent/intent.qmd
    - contents/vol4/planning/planning.qmd
    - contents/vol4/enforcement/enforcement.qmd
    - contents/vol4/placement/placement.qmd

    # ==================================================
    # Part IV: Governing the Machine
    # ==================================================
    - contents/vol4/parts/governing_principles.qmd
    - contents/vol4/intervention/intervention.qmd
    - contents/vol4/verification/verification.qmd
    - contents/vol4/release/release.qmd

    # ==================================================
    # Conclusion (synthesizes the whole book)
    # ==================================================
    - contents/vol4/frontier/frontier.qmd

  appendices:
    - contents/vol4/backmatter/references.qmd
    - contents/vol4/backmatter/appendix_math.qmd
    - contents/vol4/backmatter/appendix_hardware.qmd
    - contents/vol4/backmatter/appendix_heterogeneous_soc.qmd
    - contents/vol4/backmatter/appendix_standards.qmd
    - contents/vol4/backmatter/appendix_lexicon.qmd
    - contents/vol4/backmatter/glossary/glossary.qmd

bibliography:
  - contents/references-vol4.bib
  - contents/references.bib

citation: true
license: CC-BY-NC-ND

language: config/shared/base/crossref-labels.yml

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/pdf/filters.yml
  - config/shared/pdf/filter-metadata.yml
  - config/shared/vol4/filter-metadata-paths.yml
  - config/shared/pdf/custom-numbered-blocks-overrides.yml
  - config/shared/pdf/titlepage-theme-common.yml
  - config/shared/pdf/titlepage-pdf-common.yml
  - config/shared/pdf/build-production-common.yml

execute:
  env:
    PYTHONPATH: "../..:../../mlsysim:../../../../..:../../../../../mlsysim"
    MPLBACKEND: "Agg"

format:
  titlepage-pdf:
    # The designed cover is included by default. To omit it from a build:
    # ./book/binder build pdf --vol4 --no-cover
    coverpage: true
    coverpage-title: "Machine Learning Systems"
    coverpage-bg-image: "assets/images/covers/cover-image-white-vol4.png"
    coverpage-author: ["Vijay", "Janapa Reddi"]
    coverpage-footer: "Physical AI"
    coverpage-theme:
        page-text-align: "left"
        bg-image-size: "0.74\\paperwidth"
        bg-image-left: "0.17\\paperwidth"
        bg-image-bottom: "8.7cm"
        bg-image-rotate: 0
        bg-image-opacity: 1.0
        header-style: "none"
        date-style: "none"

        footer-fontsize: 22
        footer-left: "0.075\\paperwidth"
        footer-bottom: "0.394\\paperwidth"
        footer-width: "0.9\\paperwidth"
        footer-align: "left"

        title-fontsize: 60
        title-left: "0.075\\paperwidth"
        title-bottom: "0.330\\paperwidth"
        title-width: "0.9\\paperwidth"

        author-style: "plain"
        author-sep: "newline"
        author-fontsize: 25
        author-align: "right"
        author-bottom: "0.170\\paperwidth"
        author-left: ".925\\paperwidth"
        author-width: 3in

    titlepage: true
    titlepage-theme:
      elements: [ "\\mlsysTitleBlock"]

    lof: false
    lot: false
    lol: false
    toc-depth: 2
    toc-title: "Contents"
    number-depth: 3
    keep-tex: true
    reference-location: document
    citation-location: document
    include-in-header:
      - file: "tex/theme-colors-vol4.tex"
      - file: "tex/header-includes.tex"
      - file: "tex/frontmatter-vol4.tex"
      - text: |
          \usepackage{needspace}
          \let\Needspace\needspace
    include-before-body:
      - file: "tex/before-body-includes.tex"
