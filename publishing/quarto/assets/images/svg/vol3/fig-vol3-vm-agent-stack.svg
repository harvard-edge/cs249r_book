<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1.5; rx: 6; }
      .highlight-box { fill: #FEF3C7; stroke: #D97706; stroke-width: 2; rx: 6; }
      .tier-bg { fill: none; stroke: #E5E7EB; stroke-width: 2; stroke-dasharray: 4; rx: 8; }
      .highlight-tier { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 2; stroke-dasharray: 4; rx: 8; }
      .text-title { font-size: 14px; font-weight: 600; fill: #374151; }
      .text-node { font-size: 13px; font-weight: 500; fill: #4B5563; text-anchor: middle; }
      .text-highlight { fill: #92400E; }
      .arrow { stroke: #9CA3AF; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#9CA3AF" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white" />

  <!-- Tier 1 -->
  <rect class="tier-bg" x="50" y="40" width="700" height="80" />
  <text x="60" y="65" class="text-title">Tier 1: System Topology &amp; Orchestration</text>
  <rect class="box" x="70" y="80" width="200" height="30" />
  <text x="170" y="100" class="text-node">Multi-Agent Swarms</text>
  <rect class="box" x="300" y="80" width="200" height="30" />
  <text x="400" y="100" class="text-node">Actor-Critic Loops</text>
  <rect class="box" x="530" y="80" width="200" height="30" />
  <text x="630" y="100" class="text-node">Supervisor-Worker Hierarchies</text>
  <line x1="270" y1="95" x2="300" y2="95" stroke="#9CA3AF" stroke-width="1.5" />
  <line x1="500" y1="95" x2="530" y2="95" stroke="#9CA3AF" stroke-width="1.5" />

  <!-- Arrow T1 -> T2 -->
  <line class="arrow" x1="400" y1="120" x2="400" y2="150" />

  <!-- Tier 2 -->
  <rect class="tier-bg" x="50" y="150" width="700" height="80" />
  <text x="60" y="175" class="text-title">Tier 2: Decision &amp; Deliberation Engine</text>
  <rect class="box" x="70" y="190" width="200" height="30" />
  <text x="170" y="210" class="text-node">Tree-of-Thoughts</text>
  <rect class="box" x="300" y="190" width="200" height="30" />
  <text x="400" y="210" class="text-node">MCTS Rollouts</text>
  <rect class="box" x="530" y="190" width="200" height="30" />
  <text x="630" y="210" class="text-node">Verification &amp; PRMs</text>
  <line x1="270" y1="205" x2="300" y2="205" stroke="#9CA3AF" stroke-width="1.5" />
  <line x1="500" y1="205" x2="530" y2="205" stroke="#9CA3AF" stroke-width="1.5" />

  <!-- Arrow T2 -> T3 -->
  <line class="arrow" x1="400" y1="230" x2="400" y2="260" />

  <!-- Tier 3 -->
  <rect class="tier-bg" x="50" y="260" width="700" height="80" />
  <text x="60" y="285" class="text-title">Tier 3: State Checkpointing &amp; Durability</text>
  <rect class="box" x="70" y="300" width="200" height="30" />
  <text x="170" y="320" class="text-node">Agent Control Blocks</text>
  <rect class="box" x="300" y="300" width="200" height="30" />
  <text x="400" y="320" class="text-node">WAL Logs</text>
  <rect class="box" x="530" y="300" width="200" height="30" />
  <text x="630" y="320" class="text-node">Episodic Storage</text>
  <line x1="270" y1="315" x2="300" y2="315" stroke="#9CA3AF" stroke-width="1.5" />
  <line x1="500" y1="315" x2="530" y2="315" stroke="#9CA3AF" stroke-width="1.5" />

  <!-- Arrow T3 -> T4 -->
  <line class="arrow" x1="400" y1="340" x2="400" y2="370" />

  <!-- Tier 4 -->
  <rect class="highlight-tier" x="50" y="370" width="700" height="80" />
  <text x="60" y="395" class="text-title text-highlight">Tier 4: Virtual Context Memory &amp; Execution Substrates</text>
  <rect class="highlight-box" x="70" y="410" width="200" height="30" />
  <text x="170" y="430" class="text-node text-highlight">PagedAttention Block Tables</text>
  <rect class="highlight-box" x="300" y="410" width="200" height="30" />
  <text x="400" y="430" class="text-node text-highlight">Radix Tree Prefix Cache</text>
  <rect class="highlight-box" x="530" y="410" width="200" height="30" />
  <text x="630" y="430" class="text-node text-highlight">Copy-on-Write Pages</text>
  <line x1="270" y1="425" x2="300" y2="425" stroke="#D97706" stroke-width="1.5" />
  <line x1="500" y1="425" x2="530" y2="425" stroke="#D97706" stroke-width="1.5" />

</svg>
