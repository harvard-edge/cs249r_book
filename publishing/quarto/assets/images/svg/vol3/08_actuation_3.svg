<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" font-family="Inter, sans-serif">
  <defs>
    <style>
      .root { fill: #FAF5FF; stroke: #7C3AED; stroke-width: 2; }
      .sub1 { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.5; }
      .sub2 { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1.5; }
      .leaf { fill: #FFFBEB; stroke: #D97706; stroke-width: 1.5; }
      .box { rx: 8; ry: 8; }
      .text-dark { fill: #1F2937; font-size: 14px; }
      .text-title { font-weight: bold; font-size: 16px; }
      .arrow { stroke: #6B7280; stroke-width: 2; fill: none; }
      marker { fill: #6B7280; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <rect width="1000" height="850" fill="#ffffff" />

  <!-- Root Orchestrator -->
  <rect x="250" y="50" width="500" height="150" class="root box" />
  <text x="500" y="80" class="text-title" fill="#5B21B6" text-anchor="middle">Root Orchestrator Agent (Principal: System Admin)</text>
  
  <rect x="275" y="95" width="450" height="90" fill="#ffffff" stroke="#7C3AED" rx="4" />
  <text x="290" y="115" class="text-title" font-size="14px">Broadest Capability Lease K_0:</text>
  <text x="290" y="135" class="text-dark" font-size="13px">- Target URI: /workspace/**</text>
  <text x="290" y="150" class="text-dark" font-size="13px">- Operations: {READ, WRITE, EXECUTE}</text>
  <text x="290" y="165" class="text-dark" font-size="13px">- Lifetime: Exp 12:00 | Quota: 1M Tokens</text>

  <!-- Delegation Arrows from Root -->
  <path d="M400 200 L250 280" class="arrow" marker-end="url(#arrowhead)" />
  <text x="200" y="240" class="text-dark" font-size="12px" fill="#2563EB">Attenuate &amp; Delegate (research)</text>

  <path d="M600 200 L750 280" class="arrow" marker-end="url(#arrowhead)" />
  <text x="630" y="240" class="text-dark" font-size="12px" fill="#16A34A">Attenuate &amp; Delegate (implementation)</text>

  <!-- Research Subagent -->
  <rect x="50" y="280" width="420" height="200" class="sub1 box" />
  <text x="260" y="310" class="text-title" fill="#1E40AF" text-anchor="middle">Research Subagent (Confined Blast Radius)</text>

  <rect x="70" y="325" width="380" height="90" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="85" y="345" class="text-title" font-size="14px">Attenuated Lease K_research:</text>
  <text x="85" y="365" class="text-dark" font-size="13px">- Target URI: /workspace/docs/** (Restricted)</text>
  <text x="85" y="380" class="text-dark" font-size="13px">- Operations: {READ} (Strictly Read-Only)</text>
  <text x="85" y="395" class="text-dark" font-size="13px">- Lifetime: Exp 11:30 | Quota: 100k Tokens</text>

  <rect x="70" y="425" width="380" height="40" fill="#FEF2F2" stroke="#DC2626" rx="4" />
  <text x="260" y="440" class="text-dark" font-size="12px" fill="#991B1B" text-anchor="middle">Security Invariant: Indirect prompt injection in docs</text>
  <text x="260" y="455" class="text-dark" font-size="12px" fill="#991B1B" text-anchor="middle">cannot mutate source, run bash, or leak credentials</text>

  <!-- Implementation Subagent -->
  <rect x="530" y="280" width="420" height="160" class="sub2 box" />
  <text x="740" y="310" class="text-title" fill="#166534" text-anchor="middle">Implementation Subagent</text>

  <rect x="550" y="325" width="380" height="90" fill="#ffffff" stroke="#16A34A" rx="4" />
  <text x="565" y="345" class="text-title" font-size="14px">Attenuated Lease K_impl:</text>
  <text x="565" y="365" class="text-dark" font-size="13px">- Target URI: /workspace/src/**</text>
  <text x="565" y="380" class="text-dark" font-size="13px">- Operations: {READ, WRITE}</text>
  <text x="565" y="395" class="text-dark" font-size="13px">- Lifetime: Exp 11:45 | Quota: 500k Tokens</text>

  <!-- Delegation from Implementation -->
  <path d="M740 440 L740 520" class="arrow" marker-end="url(#arrowhead)" />
  <text x="750" y="485" class="text-dark" font-size="12px" fill="#D97706">Attenuate &amp; Delegate (test)</text>

  <!-- Test Runner Subagent -->
  <rect x="530" y="520" width="420" height="150" class="leaf box" />
  <text x="740" y="550" class="text-title" fill="#92400E" text-anchor="middle">Test Runner Subagent (Ephemeral Leaf)</text>

  <rect x="550" y="565" width="380" height="90" fill="#ffffff" stroke="#D97706" rx="4" />
  <text x="565" y="585" class="text-title" font-size="14px">Attenuated Lease K_test:</text>
  <text x="565" y="605" class="text-dark" font-size="13px">- Target URI: /workspace/tests/**</text>
  <text x="565" y="620" class="text-dark" font-size="13px">- Operations: {READ, EXEC('cargo test')}</text>
  <text x="565" y="635" class="text-dark" font-size="13px">- Lifetime: Exp 11:15 | Quota: 50k Tokens</text>

  <!-- Monotonic Hierarchy Box -->
  <rect x="250" y="700" width="500" height="80" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" rx="4" stroke-dasharray="5,5" />
  <text x="500" y="725" class="text-title" font-size="14px" fill="#4B5563" text-anchor="middle">Dennis &amp; Van Horn Capability Security Model</text>
  <text x="500" y="745" class="text-dark" font-size="13px" fill="#4B5563" text-anchor="middle">Authority narrows monotonically (K_child ⊆ K_parent)</text>
  <text x="500" y="760" class="text-dark" font-size="13px" fill="#4B5563" text-anchor="middle">across operational rights, URIs, timeouts, and quotas</text>

</svg>
