[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlperf-edu"
version = "0.1.0"
description = "A runnable educational ML systems benchmark suite inspired by MLPerf."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "MLPerf EDU Contributors"},
]
keywords = [
    "benchmark",
    "education",
    "machine-learning",
    "mlperf",
    "ml-systems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "plotly>=5.15.0",
    "platformdirs>=4.0.0",
    "pandas>=2.0.0",
    "transformers>=4.0.0",
    "tflite>=2.18.0",
    "ogb>=1.3.6",
    "torch-geometric>=2.7.0",
    "sentence-transformers==5.5.1",
    "pyarrow>=17.0.0",
    "librosa==0.11.0",
    "sgf>=0.5",  # SGF parsing for the pinned MiniGo professional games
    "remotezip==0.12.3",
    "scikit-learn>=1.0.0",
]

[project.urls]
Homepage = "https://mlsysbook.ai"
Repository = "https://github.com/harvard-edge/cs249r_book"
Issues = "https://github.com/harvard-edge/cs249r_book/issues"

[project.scripts]
mlperf = "mlperf.edu_cli:main"
mlperf-edu = "mlperf.edu_cli:main"

[project.optional-dependencies]
audio = [
    "torchaudio>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=6.0.0",
    "pypdf>=6.15.0",
    "playwright==1.58.0",
    "ruff==0.15.21",
    # tools/generate_paper_figures.py renders the paper's figures, and
    # tests/test_paper_figures.py regenerates every one of them.
    "matplotlib>=3.9.4",
]
release = [
    "build>=1.2.0",
    "twine>=5.0.0",
]
tutorial = [
    "marimo>=0.10.0",
]
parity = [
    "ai-edge-litert==2.1.6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlperf*", "mlperf_edu*"]
namespaces = true

[tool.setuptools.package-data]
mlperf_edu = [
    "workloads.yaml",
    "datasets.yaml",
    "*.json",
    "conformance_results/*.json",
    "provisional_results/*.json",
    "reference_results/*.json",
    "reference_results/*/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
pythonpath = [".", "src"]
