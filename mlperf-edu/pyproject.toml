[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlperf_edu"
version = "0.1.0"
description = "A scaled-down, educational implementation of MLPerf for teaching ML Systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "plotly>=5.15.0",
    "pandas>=2.0.0",
    "transformers>=4.0.0"
]

[project.scripts]
mlperf = "mlperf.edu_cli:main"
mlperf-edu = "mlperf.edu_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mlperf*", "mlperf_edu*", "reference*"]
namespaces = true

[tool.setuptools.package-data]
mlperf_edu = ["workloads.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
pythonpath = [".", "src"]
