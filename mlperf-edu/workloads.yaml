          batch_size: 1
          n_warmup: 3
          n_iter: 20
          model_size: base
          prompt_seed: 314159
          prompt_sha256: 1d64ab92c0b6a2f941af0f26f61f41cd64fb55426b3154e69977eaebd46adfa1
          kv_cache_materialized: true
        quality:
          metric: prefill_tokens_per_sec
          metric_key: prefill_tokens_per_sec
          target: 0.0
          direction: higher
        timing_sample_counts:
          prefill_latency_samples_s: 20
      checkpoint_contract:
        source_workload: nanogpt-train
        digest: sha256
        required_artifacts:
        - training report
        - training provenance manifest
        - checkpoint
        - inference report
