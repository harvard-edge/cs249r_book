      model: NanoGPTWhiteBox(vocab=256, width=64, heads=4, layers=2) fp32 batch-16
      params: 124672
      dataset: prompt-suite-local
      dataset_source: Deterministic local token prompts embedded in the runner; no
        external evaluation dataset required.
      default_prefill_ctx: 32
      default_decode_steps: 8
      default_batch_size: 16
      functional_check:
        metric: output_tokens_per_sec
        condition: three deterministic batch-16 requests each complete eight decode
          steps, emit every token, and record positive fp32 output throughput
        reviewer_notes:
        - This random-weight systems variant has no task-quality or checkpoint-inheritance
          claim.
      scenario: single_stream
      public:
        status: systems-only
        rationale: Provides repeated synchronous fp32 batch-16 decode for architecture
          and dtype experiments. Random weights make it ineligible for task-quality
          or public performance claims.
      runner:
        min: mlperf.runners.extended:run_nanogpt_decode_fp32_min
        max: mlperf.runners.extended:run_nanogpt_decode_fp32_max
