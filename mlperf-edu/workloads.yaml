    nanogpt-train:
      model: nanogpt-12m
      params: 11.5M
      params_note: Char-level vocab=128 (TinyShakespeare uses 65 unique chars). Earlier
        README/paper figures of 85.9M and 124.4M reflected a vocab=50,257 BPE config
        that was never reachable from the char-level data; iteration 1 reconciled
        the model to its actual effective size. As built (vocab=128, n_embd=384, n_head=6,
        n_layer=6, max_seq_len=2048, tied wte/lm_head) the base model instantiates
        11,483,136 parameters; re-derive this figure if the base max_seq_len changes.
      dataset: tinyshakespeare
      dataset_source: Project Gutenberg eBook 100, generated MLPerf EDU tiny Shakespeare
        excerpt, character-level, 1.1MB
      quality_target:
        metric: cross_entropy_loss
        value: 2.3
        direction: lower
        target_basis: reference_runs
        tolerance: 0.0
        reference_runs: 5
        variance_summary:
          runs: 5
          statistic: median
          acceptance_rule: median validation loss must be <= target
          metric: cross_entropy_loss
          median: 2.0567784726619722
          min: 1.9997187912464143
          max: 2.1939003109931945
          mean: 2.0755064880847933
          sample_stdev: 0.07646388904411043
          spread_note: The clean five-seed public-candidate sweep produced validation
            cross-entropy from 1.9997187912 to 2.1939003110. Every seed passed the
            2.3 target.
        reference_protocol:
          profile: max
          backend: pytorch-cpu reference path unless the report declares a different
            backend
          machine_class: laptop-class CPU or laptop-class accelerator with full hardware
            fingerprint
          dataset_mode: fetched Project Gutenberg Shakespeare source with deterministic
            TinyShakespeare excerpt recipe, fixed tokenizer, split, and seed; no synthetic
            fallback
          seeds:
          - 0
          - 1
          - 2
          - 3
          - 4
          aggregation: median validation loss across five independent reference runs
          artifact_policy: preserve JSON, HTML, CSV, .provd.json, run fingerprint,
            dataset asset metadata, and raw metric values for each run
          rerun_policy: rerun all five references when model code, dataset preprocessing,
            optimizer schedule, PyTorch major version, or target hardware class changes
        reviewer_notes:
        - Every clean reference seed satisfied the 2.3 validation-loss target. The
