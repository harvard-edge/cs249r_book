        data_mode: synthetic-micro-shard
        quality_target_enforced: false
        fetched_assets_used: false
        declared_dataset_used: true
        scope: systems-only
        config:
          vocab_size: 256
          n_embd: 64
          n_head: 4
          n_layer: 2
          max_seq_len: 128
          batch_size: 16
          prefill_ctx: 32
          decode_steps: 8
          measured_requests: 3
          dtype: fp32
        note: The current max runner measures three synchronous FP32 batch-16 requests
          on a 124672-parameter random-init NanoGPT model and deterministic local
          token prompts. It makes no trained-model quality claim.
      provenance: Local 124672-parameter NanoGPTWhiteBox decoded at fp32 with random
        weights. This row tests execution and instrumentation only; no speedup, quality,
