        data_mode: synthetic-deterministic
        quality_target_enforced: true
        fetched_assets_used: false
        declared_dataset_used: true
        scope: systems-only
        model_config:
          dense_features: 16
          sparse_table_sizes:
          - 943
          - 1682
          - 21
          embedding_dim: 8
          bottom_mlp:
          - 16
          - 8
          - 8
          top_mlp:
          - 32
          - 16
          - 1
        run_config:
          world_size: 2
          n_steps: 4
          micro_batch: 8
          backend: gloo
          transport: localhost-loopback
        note: The current max runner uses deterministic synthetic batches to compare
