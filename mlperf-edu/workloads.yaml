    nanogpt-decode-spec:
      suite: language
      model: NanoGPTWhiteBox speculative pair (target width=64 layers=2; draft width=32
        layers=1)
      params: 149728
      target_params: 124672
      draft_params: 25056
      dataset: prompt-suite-local
      dataset_source: Deterministic local token prompts embedded in the runner; no
        external evaluation dataset required.
      gamma: 4
      default_prefill_ctx: 32
      default_decode_tokens: 8
      functional_check:
        metric: acceptance_rate
        condition: two deterministic batch-4 requests each emit eight tokens, use
          at least one verification cycle, record positive throughput, and keep acceptance
