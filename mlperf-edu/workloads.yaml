        no MovieLens records are consumed
      world_size: 2
      backend: gloo
      transport: loopback
      quality_target:
        metric: relative_loss_delta
        direction: lower
        value: 0.05
      functional_check:
        metric: relative_loss_delta
        condition: localhost DDP final loss remains within 5 percent of gradient-accumulation
          baseline
        reference_runs: 5
        reviewer_notes:
        - This validates distributed training equivalence and communication overhead,
          not recommender quality.
      scenario: training
      public:
        status: systems-only
        rationale: Standardizes a localhost DDP systems exercise for communication
          overhead studies, not a public recommendation-model score.
