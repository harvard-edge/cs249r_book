        data_mode: synthetic-micro-shard
        quality_target_enforced: false
        fetched_assets_used: false
        declared_dataset_used: true
        scope: systems-only
        note: The current max runner measures speculative-decode control flow with
          tiny random-init target and draft models on deterministic local prompts.
          It does not claim trained-model acceptance quality.
      provenance: Speculative decoding scaffold with an 11M-parameter draft, an 88M-parameter
