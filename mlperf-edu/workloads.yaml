        reference_runs: 5
        reviewer_notes:
        - This is a test-time-compute workload for draft-target verification behavior;
          task quality requires trained draft and target checkpoints.
      scenario: server
      public:
        status: systems-only
        rationale: Teaches speculative decoding mechanics and acceptance-rate tradeoffs,
