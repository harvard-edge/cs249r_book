suites:
  language:
    micro-bert-train:
      model: micro-bert
      params: 432K
      dataset: sst2
      dataset_source: Socher et al. (2013), Stanford Sentiment Treebank binary, 67K
        train / 872 val; ships in data/sst2/
      quality_target:
        metric: val_accuracy
        value: 0.78
      calibration_observation:
        evidence_status: historical-unverified-no-committed-artifact
        train_loss: 0.15
        val_accuracy: 0.77
        epochs: 15
        time_seconds: 45
        note: Character-level tokenization; 77% on real SST-2 with 0.5M-param model
      scenario: single_stream
      public:
        status: systems-only
        rationale: Provides a small NLU transformer systems workload, but the baseline
          sits below the stated quality target and needs tuning before score promotion.
      runner:
        min: mlperf.runners.extended:run_micro_bert_min
        max: mlperf.runners.extended:run_micro_bert_max
      max_execution:
        data_mode: synthetic-micro-shard
        quality_target_enforced: false
        fetched_assets_used: false
        declared_dataset_used: false
        scope: systems-only
        note: The current max runner measures bidirectional-transformer execution
          on deterministic token tensors. It does not consume SST-2 or enforce the
          candidate validation-accuracy target.
      provenance: Devlin et al. 2019 (BERT); bidirectional transformer for NLU
      regime:
        working_set:
          value: unmeasured
          note: No committed working-set measurement and reference-platform capacity
            record exists; classification is withheld.
        arithmetic_intensity:
          value: unmeasured
          note: No committed FLOP/byte measurement and reference-platform ridge-point
            record exists; classification is withheld.
        dispatch:
          value: unmeasured
          note: No committed synchronized utilization trace and reference-platform
            peak record exists; classification is withheld.
    nano-lora-finetune:
      model: nanogpt-small-86m + LoRA(rank=8, alpha=16, target=c_attn)
      base_params: 88.3M
      trainable_params: 294912
      trainable_ratio_pct: 0.334
      functional_check:
        metric: base_grad_norm
        condition: frozen base parameters keep zero gradient while LoRA adapter gradients
          are nonzero
        reference_runs: 5
        reviewer_notes:
        - This is a systems workload for PEFT overhead and memory studies, not a task-accuracy
          benchmark.
      scenario: training
      public:
        status: systems-only
        rationale: Measures PEFT systems cost with frozen-base checks; task data and
          accuracy are synthetic scaffold elements, so it is not score-bearing.
      runner:
        min: mlperf.runners.extended:run_nano_lora_min
        max: mlperf.runners.extended:run_nano_lora_max
      max_execution:
        data_mode: synthetic-micro-shard
        quality_target_enforced: false
        fetched_assets_used: false
        declared_dataset_used: false
        scope: systems-only
        note: The current max runner measures adapter injection, frozen-base gradients,
          and optimizer plumbing on deterministic tokens. It has no task dataset or
          task-quality claim.
      provenance: 'Iter-7 (Han): LoRA fine-tuning workload demonstrating PEFT. Random-init
        backbone (random training data) — measures the SYSTEMS cost of LoRA, not task
        accuracy. Base parameters genuinely frozen (smoke verifies base_grad_norm
        == 0).'
      regime:
        working_set:
          value: unmeasured
          note: No committed working-set measurement and reference-platform capacity
            record exists; classification is withheld.
        arithmetic_intensity:
          value: unmeasured
          note: No committed FLOP/byte measurement and reference-platform ridge-point
            record exists; classification is withheld.
        dispatch:
          value: unmeasured
          note: No committed synchronized utilization trace and reference-platform
            peak record exists; classification is withheld.
    nano-moe-train:
      model: nano-moe-12m
      params: 17.4M
      dataset: tinyshakespeare
      dataset_source: Project Gutenberg eBook 100, generated MLPerf EDU tiny Shakespeare
        excerpt, character-level, 1.1MB
      quality_target:
        metric: cross_entropy_loss
        value: 0.05
      calibration_observation:
        evidence_status: historical-unverified-no-committed-artifact
        train_loss: 0.042
        val_loss: 0.042
        epochs: 25
        time_seconds: 158
      scenario: single_stream
      public:
        status: systems-only
        rationale: Exercises MoE routing and conditional compute on a real local text
          corpus, but remains a research variant rather than a canonical public score.
      runner:
        min: mlperf.runners.extended:run_nano_moe_min
        max: mlperf.runners.extended:run_nano_moe_max
      max_execution:
        data_mode: synthetic-micro-shard
        quality_target_enforced: false
        fetched_assets_used: false
        declared_dataset_used: false
        scope: systems-only
        note: The current max runner measures sparse routing and one optimizer step
          on deterministic tokens. It does not consume TinyShakespeare or enforce
          the candidate loss target.
      provenance: Shazeer et al. 2017 (MoE); 8 experts, top-2 routing
      regime:
        working_set:
          value: unmeasured
          note: No committed working-set measurement and reference-platform capacity
            record exists; classification is withheld.
        arithmetic_intensity:
          value: unmeasured
          note: No committed FLOP/byte measurement and reference-platform ridge-point
            record exists; classification is withheld.
        dispatch:
          value: unmeasured
          note: No committed synchronized utilization trace and reference-platform
            peak record exists; classification is withheld.
    nanogpt-decode-fp32-b16:
      suite: language
      model: nanogpt-small-86m
      params: 88.3M
      dataset: prompt-suite-local
      dataset_source: Deterministic local token prompts embedded in the runner; no
        external evaluation dataset required.
      default_prefill_ctx: 1024
      default_decode_steps: 8
      default_batch_size: 16
      functional_check:
        metric: output_tokens_per_sec
        condition: fp32 decode completes the configured steps and records positive
          output throughput
        reference_runs: 5
        reviewer_notes:
        - This variant is for dtype, memory-bandwidth, and dispatch studies; task
          quality is inherited from the canonical inference workload.
      scenario: server
      public:
        status: systems-only
        rationale: Provides an fp32, batch-16 decode scaffold for architecture experiments.
          Random weights make it ineligible for quality or public performance claims.
      runner:
        min: mlperf.runners.extended:run_nanogpt_decode_fp32_min
        max: mlperf.runners.extended:run_nanogpt_decode_fp32_max
      max_execution:
        data_mode: synthetic-micro-shard
        quality_target_enforced: false
        fetched_assets_used: false
        declared_dataset_used: true
        scope: systems-only
        note: The current max runner measures FP32 KV-cache mechanics on a tiny random-init
          NanoGPT model and deterministic local token prompts. It does not make a
          trained-model quality claim.
      provenance: GPT-2-Small geometry decoded at fp32 with random weights. This row
        tests execution and instrumentation only; no measured taxonomy classification
        is claimed.
      regime:
        working_set:
          value: unmeasured
          note: No committed working-set measurement and reference-platform capacity
            record exists; classification is withheld.
        arithmetic_intensity:
          value: unmeasured
          note: No committed FLOP/byte measurement and reference-platform ridge-point
            record exists; classification is withheld.
        dispatch:
          value: unmeasured
          note: No committed synchronized utilization trace and reference-platform
            peak record exists; classification is withheld.
      canonical_workload: nanogpt-inference
      variant: fp32-b16
