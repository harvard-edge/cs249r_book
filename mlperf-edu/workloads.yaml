suites:
  language:
    micro-bert-train:
      model: MicroBERT(vocab=512, width=64, heads=4, layers=2)
      params: 139202
      dataset: sst2
      dataset_source: Socher et al. (2013), Stanford Sentiment Treebank binary, 67K
        train / 872 val; ships in data/sst2/
      quality_target:
        metric: val_accuracy
        value: 0.78
      calibration_observation:
        evidence_status: historical-unverified-no-committed-artifact
        train_loss: 0.15
        val_accuracy: 0.77
        epochs: 15
        time_seconds: 45
        note: Character-level tokenization; 77% on real SST-2 with 0.5M-param model
      functional_check:
        metric: parameter_delta_l2
        condition: four deterministic optimizer steps complete with finite losses,
          nonzero parameter updates, and one binary-classification logit pair per
          sample
        reviewer_notes:
        - This systems check does not evaluate SST-2 validation accuracy.
      scenario: training
      public:
        status: systems-only
        rationale: Provides a bounded multi-step bidirectional-transformer training
          workload on deterministic token tensors. SST-2 and its candidate target
          are not used by the current max path.
      runner:
        min: mlperf.runners.extended:run_micro_bert_min
        max: mlperf.runners.extended:run_micro_bert_max
      max_execution:
        data_mode: synthetic-micro-shard
        quality_target_enforced: false
        fetched_assets_used: false
        declared_dataset_used: false
        scope: systems-only
        config:
          vocab_size: 512
          d_model: 64
          n_heads: 4
          n_layers: 2
          batch_size: 8
          seq_len: 32
          train_steps: 4
          lr: 0.001
        note: The current max runner performs four optimizer steps on a 139202-parameter
          MicroBERT and deterministic token tensors. It does not consume SST-2 or
          enforce the candidate validation-accuracy target.
      provenance: Devlin et al. 2019 (BERT); bidirectional transformer for NLU
      regime:
        working_set:
          value: unmeasured
          note: No committed working-set measurement and reference-platform capacity
            record exists; classification is withheld.
        arithmetic_intensity:
          value: unmeasured
          note: No committed FLOP/byte measurement and reference-platform ridge-point
            record exists; classification is withheld.
        dispatch:
          value: unmeasured
          note: No committed synchronized utilization trace and reference-platform
            peak record exists; classification is withheld.
    nano-lora-finetune:
      model: NanoGPTWhiteBox(vocab=256, width=64, heads=4, layers=2) + LoRA(rank=8,
        alpha=16, target=c_attn)
      params: 124672
      base_params: 120576
      trainable_params: 4096
      trainable_ratio_pct: 3.2854209445585214
      functional_check:
        metric: base_grad_norm
        condition: three deterministic optimizer steps keep every base gradient and
          base parameter delta at zero, produce nonzero LoRA gradients, and update
          the adapter parameters
        reviewer_notes:
        - This is a systems workload for PEFT overhead and memory studies, not a task-accuracy
          benchmark.
      scenario: training
      public:
        status: systems-only
        rationale: Measures PEFT systems cost with frozen-base checks; task data and
          accuracy are synthetic scaffold elements, so it is not score-bearing.
      runner:
        min: mlperf.runners.extended:run_nano_lora_min
        max: mlperf.runners.extended:run_nano_lora_max
      max_execution:
        data_mode: synthetic-micro-shard
        quality_target_enforced: false
        fetched_assets_used: false
        declared_dataset_used: false
        scope: systems-only
        config:
          vocab_size: 256
          n_embd: 64
          n_head: 4
          n_layer: 2
          max_seq_len: 64
          batch_size: 4
          seq_len: 32
          rank: 8
          alpha: 16
          target_module: c_attn
          train_steps: 3
          lr: 0.001
        note: The current max runner performs three adapter-only optimizer steps with
          two LoRA modules and 4096 trainable parameters on deterministic tokens.
          It has no task dataset or task-quality claim.
      provenance: Local NanoGPTWhiteBox LoRA systems workload with a 120576-parameter
        random-init base and two rank-8 c_attn adapters. It measures adapter training
        mechanics, not task accuracy.
      regime:
        working_set:
          value: unmeasured
          note: No committed working-set measurement and reference-platform capacity
            record exists; classification is withheld.
        arithmetic_intensity:
          value: unmeasured
          note: No committed FLOP/byte measurement and reference-platform ridge-point
            record exists; classification is withheld.
        dispatch:
          value: unmeasured
          note: No committed synchronized utilization trace and reference-platform
            peak record exists; classification is withheld.
    nano-moe-train:
      model: NanoMoEWhiteBox(vocab=256, width=64, heads=4, layers=2, experts=8, top_k=2)
      params: 608384
      dataset: tinyshakespeare
      dataset_source: Project Gutenberg eBook 100, generated MLPerf EDU tiny Shakespeare
        excerpt, character-level, 1.1MB
      quality_target:
        metric: cross_entropy_loss
        value: 0.05
      calibration_observation:
        evidence_status: historical-unverified-no-committed-artifact
        protocol_compatibility: superseded
        replacement_required: true
        train_loss: 0.042
        val_loss: 0.042
        epochs: 25
        time_seconds: 158
        note: This former real-data observation used a different model and training
          protocol; it is not evidence for the current systems-only max path.
      functional_check:
        metric: parameter_delta_l2
        condition: three deterministic MoE optimizer steps complete with finite losses,
          nonzero parameter updates, and positive token throughput
        reviewer_notes:
        - This systems check uses synthetic tokens and does not evaluate TinyShakespeare
          loss.
      scenario: training
      public:
        status: systems-only
        rationale: Exercises multi-step MoE routing and conditional-compute training
          on deterministic synthetic tokens. TinyShakespeare and its candidate loss
          target are not used by the current max path.
      runner:
        min: mlperf.runners.extended:run_nano_moe_min
        max: mlperf.runners.extended:run_nano_moe_max
      max_execution:
        data_mode: synthetic-micro-shard
        quality_target_enforced: false
        fetched_assets_used: false
        declared_dataset_used: false
        scope: systems-only
        config:
          vocab_size: 256
          d_model: 64
          n_heads: 4
          n_layers: 2
          num_experts: 8
          top_k: 2
          batch_size: 4
          seq_len: 32
          train_steps: 3
          lr: 0.001
        note: The current max runner performs three optimizer steps with a 608384-parameter
          sparse MoE on deterministic tokens. It does not consume TinyShakespeare
          or enforce the candidate loss target.
      provenance: Shazeer et al. 2017 (MoE); 8 experts, top-2 routing
      regime:
        working_set:
          value: unmeasured
          note: No committed working-set measurement and reference-platform capacity
            record exists; classification is withheld.
        arithmetic_intensity:
          value: unmeasured
          note: No committed FLOP/byte measurement and reference-platform ridge-point
            record exists; classification is withheld.
        dispatch:
          value: unmeasured
          note: No committed synchronized utilization trace and reference-platform
            peak record exists; classification is withheld.
    nanogpt-decode-fp32-b16:
