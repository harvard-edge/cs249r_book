schema: mlperf-edu-experiment-plan/0.3
id: dam-algorithm-lens-retrieval
title: Algorithm lens, retrieval precision, matched pair
description: >
  Measures the retrieval precision lever with both arms inside ONE plan and one
  source tree. An earlier attempt compared an int8 run against a float32 run
  taken from a different plan; the two carried different source_tree.tree_hash
  values because the repository was edited between them, so the pair was not a
  valid comparison under the project's own provenance rules.

  The rule this enforces is broader than "do not edit during a run": do not edit
  between the arms of a comparison. Both arms belong in one plan.
profile: pro
power: false
keep_going: true
study:
  question: >
    What does dynamic INT8 quantization cost or save on a BERT cross-encoder
    reranker, in wall-clock seconds and in retrieval quality?
  hypothesis: >
    The earlier unmatched pair suggested int8 is substantially SLOWER than
    float32 on this host while holding quality. If that survives a matched
    comparison, it is a counterexample to the assumption that quantization is a
    speed optimization.
  independent_variables:
    - numeric precision
  controls:
    - single execution device (cpu; dynamic quantization is CPU-only)
    - 120 second idle settle between cells
    - pinned checkpoint, evaluation split and inherited target
    - random seed
    - one source tree across both arms
  analysis_metrics:
    - wall-clock seconds
    - mean_ndcg_at_10
    - quantized Linear module count recorded in execution_dtype
defaults:
  device: cpu
  repetitions: 1
output:
  directory: submissions/research/dam-algorithm-lens-retrieval
  open_report: false
runs:
  - name: retrieval-float32-cpu
    role: baseline
    workload: information-retrieval
    mode: inference
    device: cpu
    environment:
      MLPERF_EDU_INFORMATION_RETRIEVAL_PRECISION: float32
  - name: retrieval-int8-cpu
    role: candidate
    workload: information-retrieval
    mode: inference
    device: cpu
    environment:
      MLPERF_EDU_INFORMATION_RETRIEVAL_PRECISION: int8
