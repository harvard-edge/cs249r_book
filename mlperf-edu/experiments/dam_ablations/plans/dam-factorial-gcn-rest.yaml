schema: mlperf-edu-experiment-plan/0.3
id: dam-factorial-gcn-rest
title: D x A x M factorial on graph node classification, remaining six cells
description: >
  A complete two-level factorial across all three DAM axes on a single workload.
  Graph node classification is the only workload that carries real levers on
  every axis at once, so one 8-cell design yields every DAM cell the taxonomy
  defines: the three single-lever effects (D, A, M), the three pairwise
  intersections (D and A, A and M, D and M), and the three-way interaction.
  Every lever used here is registered in fingerprint.py, so each cell's settings
  are captured in its provenance manifest and the design is auditable.
profile: pro
power: false
keep_going: true
study:
  question: >
    Do the data, algorithm, and machine levers combine additively, or does the
    benefit of one lever depend on the setting of another? An interaction is the
    interesting case for a student, because it means a system cannot be tuned
    one axis at a time.
  hypothesis: >
    The machine lever is expected to interact with the algorithm lever: a
    narrower model has less arithmetic to amortize per sparse gather, so the
    GPU advantage should shrink as hidden width falls. If that holds, the
    speedup measured at full width will not transfer to the narrow model, which
    is exactly the kind of non-transferable result the suite exists to expose.
  independent_variables:
    - MLPERF_EDU_GRAPH_MAX_EPOCHS
    - MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS
    - execution device
  controls:
    - official OGB GCN architecture and ogbn-arxiv split
    - three message-passing layers
    - dropout 0.5 and learning rate 0.01
    - random seed 42
    - inherited test-accuracy target
  analysis_metrics:
    - training wall-clock seconds
    - test accuracy
    - CPU-to-MPS speedup ratio at each design point
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/research/dam-factorial-gcn-rest
  open_report: false
runs:
  # ---- D=full, A=narrow (isolates the algorithm lever) ----
  - name: dfull-anarrow-cpu
    role: baseline
    workload: graph-node-classification
    mode: training
    device: cpu
    environment:
      MLPERF_EDU_GRAPH_MAX_EPOCHS: 500
      MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS: 64
  - name: dfull-anarrow-mps
    role: candidate
    workload: graph-node-classification
    mode: training
    device: mps
    environment:
      MLPERF_EDU_GRAPH_MAX_EPOCHS: 500
      MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS: 64

  # ---- D=quarter, A=full (isolates the data lever) ----
  - name: dquarter-afull-cpu
    role: candidate
    workload: graph-node-classification
    mode: training
    device: cpu
    environment:
      MLPERF_EDU_GRAPH_MAX_EPOCHS: 125
      MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS: 256
  - name: dquarter-afull-mps
    role: candidate
    workload: graph-node-classification
    mode: training
    device: mps
    environment:
      MLPERF_EDU_GRAPH_MAX_EPOCHS: 125
      MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS: 256

  # ---- D=quarter, A=narrow (the three-way corner) ----
  - name: dquarter-anarrow-cpu
    role: candidate
    workload: graph-node-classification
    mode: training
    device: cpu
    environment:
      MLPERF_EDU_GRAPH_MAX_EPOCHS: 125
      MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS: 64
  - name: dquarter-anarrow-mps
    role: candidate
    workload: graph-node-classification
    mode: training
    device: mps
    environment:
      MLPERF_EDU_GRAPH_MAX_EPOCHS: 125
      MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS: 64
