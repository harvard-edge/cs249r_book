schema: mlperf-edu-experiment-plan/0.3
id: dam-machine-lens-basis
title: Machine-lens basis, MPS baselines for every remaining workload
description: >
  Completes the single-lens basis across all fourteen workloads. The strategy is
  to establish each lens one factor at a time first, then spend the remaining
  compute crossing only the configurations the basis shows are interesting.

  CPU arms are dropped here. The paired CPU-versus-MPS ratio is already measured
  on eight workloads spanning dense convolution, dense GEMM, sparse gather and
  graph training, which is enough to characterise the backend axis. Buying the
  remaining CPU arms was projected at roughly a day of wall-clock, dominated by
  PatchTST training at about thirty times its MPS cost, for ratios that would
  not change the picture. A measured MPS baseline gives every workload a real
  entry in the lens, which is what the basis needs.

  Ordered cheapest first so partial completion still banks results.
profile: pro
power: false
keep_going: true
study:
  question: >
    Does every workload in the suite have a measured Machine-lens baseline
    executed under its pinned contract?
  hypothesis: >
    Every workload completes on the accelerator backend within the single-node
    envelope, and the workloads with recorded shortfalls reproduce their
    measured-versus-published gap rather than silently passing.
  independent_variables:
    - execution backend
  controls:
    - pinned checkpoint, revision and evaluation split per workload
    - inherited quality target
    - random seed
  analysis_metrics:
    - wall-clock seconds
    - task quality against the inherited target
defaults:
  device: mps
  repetitions: 1
output:
  directory: submissions/research/dam-machine-lens-basis
  open_report: false
runs:
  - name: reinforcement-learning-mps
    role: baseline
    workload: reinforcement-learning
    mode: training
    device: mps

  - name: time-series-forecasting-mps
    role: baseline
    workload: time-series-forecasting
    mode: training
    device: mps

  - name: recommendation-mps
    role: baseline
    workload: recommendation
    mode: training
    device: mps

  - name: causal-language-modeling-mps
    role: baseline
    workload: causal-language-modeling
    mode: training
    device: mps

  - name: code-generation-mps
    role: baseline
    workload: code-generation
    mode: inference
    device: mps

  - name: function-calling-mps
    role: baseline
    workload: function-calling
    mode: inference
    device: mps

  - name: image-generation-mps
    role: baseline
    workload: image-generation
    mode: inference
    device: mps
