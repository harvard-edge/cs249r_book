schema: mlperf-edu-experiment-plan/0.3
id: dam-machine-lens-gcn
title: DAM Machine lens, CPU versus MPS on sparse graph node classification
description: >
  Test the suite's zero-speedup claim on the workload it actually rests on.
  The paper asserts that graph node classification shows near CPU-GPU parity
  because sparse gather and scatter over an irregular citation graph fragments
  cache lines and bottlenecks on DRAM latency rather than on arithmetic. That
  claim has never been measured; the value reported in the paper was produced by
  a synthesizer. This plan executes the same pinned training contract on both
  backends so the parity claim can be confirmed or refuted.
profile: pro
power: false
keep_going: true
study:
  question: >
    Does sparse gather and scatter over ogbn-arxiv actually eliminate the GPU
    advantage, or does the graph workload accelerate like the dense workloads?
  hypothesis: >
    If the paper's mechanism is correct, the CPU-to-MPS speedup will sit near
    1.0x, in sharp contrast to the 2x to 207x range measured on the dense and
    convolutional workloads. A large speedup would refute the stated mechanism.
  independent_variables:
    - execution device
  controls:
    - official OGB GCN architecture and ogbn-arxiv split
    - 500 full-batch training epochs with per-epoch evaluation
    - random seed 42
    - inherited test-accuracy target
  analysis_metrics:
    - training wall-clock seconds
    - test accuracy
    - CPU-to-MPS speedup ratio
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/research/dam-machine-lens-gcn
  open_report: false
runs:
  - name: graph-node-classification-cpu
    role: baseline
    workload: graph-node-classification
    mode: training
    device: cpu
  - name: graph-node-classification-mps
    role: candidate
    workload: graph-node-classification
    mode: training
    device: mps
