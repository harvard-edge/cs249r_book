schema: mlperf-edu-experiment-plan/0.3
id: dam-machine-lens-settled
title: Machine lens re-measured under order control
description: >
  Re-measures the seven paired workloads with an idle settle between cells and
  with device order alternated, so the reported ratios are not carrying an
  uncontrolled order term.

  The original sweep ran every pair CPU first with no settle. Repeats of
  text-classification at identical settings then came out 74 percent apart on
  CPU and 61 percent apart on MPS, against 0.5 and 2.6 percent for
  graph-node-classification. The chronology showed why: sustained load throttles
  the CPU while an accelerator gets faster as its shader and kernel caches warm,
  two opposing effects that both track position in the run order. The measured
  speedup for one workload moved 2.81x between an early and a late measurement
  of the same configuration.

  Two controls are applied. MLPERF_EDU_PLAN_SETTLE_SECONDS pauses 120 seconds
  between cells so thermal and cache state decays. Device order alternates
  between workloads: odd-numbered workloads run CPU first, even-numbered run MPS
  first. If order is still driving the result, the alternation will show it as a
  systematic difference between the two groups.
profile: pro
power: false
keep_going: true
study:
  question: >
    What are the CPU-to-accelerator ratios for these workloads once thermal and
    cache-warmup order effects are controlled?
  hypothesis: >
    The extreme ratios measured without control, 207x for visual-wake-words and
    39x for keyword-spotting, will move most, because they were measured on a
    cold accelerator early in a batch. Ratios near 2x should move least.
  independent_variables:
    - execution device
  controls:
    - 120 second idle settle between every cell
    - alternating device order across workloads
    - pinned checkpoint, evaluation split and inherited target per workload
    - random seed
  analysis_metrics:
    - wall-clock seconds per device
    - CPU-to-MPS speedup ratio
    - difference from the uncontrolled measurement
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/research/dam-machine-lens-settled
  open_report: false
runs:
  # workload 1: CPU first
  - name: anomaly-detection-cpu
    role: baseline
    workload: anomaly-detection
    mode: inference
    device: cpu
  - name: anomaly-detection-mps
    role: candidate
    workload: anomaly-detection
    mode: inference
    device: mps

  # workload 2: MPS first
  - name: visual-wake-words-mps
    role: candidate
    workload: visual-wake-words
    mode: inference
    device: mps
  - name: visual-wake-words-cpu
    role: baseline
    workload: visual-wake-words
    mode: inference
    device: cpu

  # workload 3: CPU first
  - name: image-classification-cpu
    role: baseline
    workload: image-classification
    mode: inference
    device: cpu
  - name: image-classification-mps
    role: candidate
    workload: image-classification
    mode: inference
    device: mps

  # workload 4: MPS first
  - name: text-classification-mps
    role: candidate
    workload: text-classification
    mode: inference
    device: mps
  - name: text-classification-cpu
    role: baseline
    workload: text-classification
    mode: inference
    device: cpu

  # workload 5: CPU first
  - name: keyword-spotting-cpu
    role: baseline
    workload: keyword-spotting
    mode: inference
    device: cpu
  - name: keyword-spotting-mps
    role: candidate
    workload: keyword-spotting
    mode: inference
    device: mps

  # workload 6: MPS first
  - name: information-retrieval-mps
    role: candidate
    workload: information-retrieval
    mode: inference
    device: mps
  - name: information-retrieval-cpu
    role: baseline
    workload: information-retrieval
    mode: inference
    device: cpu
