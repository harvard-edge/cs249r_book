schema: mlperf-edu-experiment-plan/0.3
id: dam-algorithm-lens-cnn
title: Algorithm lens across four convolutional workloads
description: >
  Extends the precision lever from the two transformer workloads to the four
  convolutional ones, so the Algorithm lens covers six workloads instead of two.

  The suite already holds two matched INT8 pairs with OPPOSITE signs, both on
  transformers quantizing exactly 38 Linear modules: text-classification runs
  0.90x (faster), information-retrieval 1.48x (slower). Convolutional networks
  expose almost no Linear layers to dynamic quantization, so these four should
  land near 1.0x. If they do, the suite demonstrates that the layer count the
  tooling reports does not predict the direction or the magnitude of an INT8
  result, using six workloads rather than two.

  Every arm sits in this one plan under one source tree, because a precision
  comparison whose arms carry different source_tree hashes is not a valid
  comparison and the provenance verifier will refuse it.
profile: pro
power: false
keep_going: true
study:
  question: >
    Does dynamic INT8 quantization change wall-clock time on convolutional
    workloads, and does the quantized-Linear count predict the effect?
  hypothesis: >
    Near 1.0x on all four, with a low quantized-Linear count recorded in the
    dtype tag, against 0.90x and 1.48x on the two transformer workloads that
    both report 38.
  independent_variables:
    - numeric precision
  controls:
    - single execution device (cpu; dynamic INT8 is CPU-only in PyTorch)
    - 120 second idle settle between cells
    - pinned checkpoint, evaluation split and inherited target per workload
    - random seed
    - one source tree across every arm
  analysis_metrics:
    - wall-clock seconds per precision
    - quantized Linear module count recorded in execution_dtype
    - inherited quality target met
defaults:
  device: cpu
  repetitions: 1
output:
  directory: submissions/research/dam-algorithm-lens-cnn
  open_report: false
runs:
  - name: anomaly-detection-float32
    role: baseline
    workload: anomaly-detection
    mode: inference
    device: cpu
    environment:
      MLPERF_EDU_ANOMALY_DETECTION_PRECISION: float32
  - name: anomaly-detection-int8
    role: candidate
    workload: anomaly-detection
    mode: inference
    device: cpu
    environment:
      MLPERF_EDU_ANOMALY_DETECTION_PRECISION: int8

  - name: visual-wake-words-float32
    role: baseline
    workload: visual-wake-words
    mode: inference
    device: cpu
    environment:
      MLPERF_EDU_VISUAL_WAKE_WORDS_PRECISION: float32
  - name: visual-wake-words-int8
    role: candidate
    workload: visual-wake-words
    mode: inference
    device: cpu
    environment:
      MLPERF_EDU_VISUAL_WAKE_WORDS_PRECISION: int8

  - name: keyword-spotting-float32
    role: baseline
    workload: keyword-spotting
    mode: inference
    device: cpu
    environment:
      MLPERF_EDU_KEYWORD_SPOTTING_PRECISION: float32
  - name: keyword-spotting-int8
    role: candidate
    workload: keyword-spotting
    mode: inference
    device: cpu
    environment:
      MLPERF_EDU_KEYWORD_SPOTTING_PRECISION: int8

  - name: image-classification-float32
    role: baseline
    workload: image-classification
    mode: inference
    device: cpu
    environment:
      MLPERF_EDU_IMAGE_CLASSIFICATION_PRECISION: float32
  - name: image-classification-int8
    role: candidate
    workload: image-classification
    mode: inference
    device: cpu
    environment:
      MLPERF_EDU_IMAGE_CLASSIFICATION_PRECISION: int8
