schema: mlperf-edu-experiment-plan/0.3
id: dam-machine-lens-settled-ir
title: Machine lens settled, information-retrieval completion
description: >
  Completes the two information-retrieval cells that did not execute in
  dam-machine-lens-settled. The parent sweep stopped after cell 10 of 12 and
  emitted an aggregate report declaring complete=true against a denominator of
  10, because the completeness check counts produced child reports rather than
  the runs the plan declared.

  These two cells are NOT order-matched to the parent sweep: they run from a
  cold start rather than after ten preceding cells. Treat the resulting ratio
  as a separate measurement, not as the eleventh and twelfth cells of the
  settled run.
profile: pro
power: false
keep_going: true
study:
  question: >
    Does information-retrieval execute under the settled configuration, and
    what CPU-to-MPS ratio does it produce from a cold start?
  independent_variables:
    - execution device
  controls:
    - 120 second idle settle between cells
    - pinned checkpoint, evaluation split and inherited target
    - random seed
  analysis_metrics:
    - wall-clock seconds per device
    - CPU-to-MPS speedup ratio
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/research/dam-machine-lens-settled-ir
  open_report: false
runs:
  - name: information-retrieval-mps
    role: candidate
    workload: information-retrieval
    mode: inference
    device: mps
  - name: information-retrieval-cpu
    role: baseline
    workload: information-retrieval
    mode: inference
    device: cpu
