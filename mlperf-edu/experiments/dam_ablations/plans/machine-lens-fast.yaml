schema: mlperf-edu-experiment-plan/0.3
id: dam-machine-lens-fast
title: DAM Machine lens, CPU versus MPS on the fast inference workloads
description: >
  Measure the Machine (M) axis of the DAM taxonomy by executing the same pinned
  inference contract on the CPU reference backend and on the Apple MPS backend.
  This plan covers the six workloads whose measured median wall-clock is under
  thirty seconds, so the whole sweep runs in roughly two minutes and can be used
  to validate the pipeline before committing to the long-running workloads.
profile: pro
power: false
keep_going: true
study:
  question: >
    Which workloads actually accelerate on a unified-memory GPU backend, and
    which sit at parity with the CPU because they are bound by irregular memory
    access rather than by arithmetic?
  hypothesis: >
    Dense GEMM inference will accelerate on MPS. Workloads dominated by sparse
    gather, dynamic control flow, or small-tensor dispatch will show little or
    no speedup because the bottleneck is not compute throughput.
  independent_variables:
    - execution device
  controls:
    - workload checkpoint and evaluation subset
    - quality evaluator and inherited target
    - random seed
    - batch size and all runner defaults
  analysis_metrics:
    - inference wall-clock seconds
    - task quality score
    - CPU-to-MPS speedup ratio
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/research/dam-machine-lens-fast
  open_report: false
runs:
  - name: anomaly-detection-cpu
    role: baseline
    workload: anomaly-detection
    mode: inference
    device: cpu
  - name: anomaly-detection-mps
    role: candidate
    workload: anomaly-detection
    mode: inference
    device: mps

  - name: visual-wake-words-cpu
    role: baseline
    workload: visual-wake-words
    mode: inference
    device: cpu
  - name: visual-wake-words-mps
    role: candidate
    workload: visual-wake-words
    mode: inference
    device: mps

  - name: image-classification-cpu
    role: baseline
    workload: image-classification
    mode: inference
    device: cpu
  - name: image-classification-mps
    role: candidate
    workload: image-classification
    mode: inference
    device: mps

  - name: text-classification-cpu
    role: baseline
    workload: text-classification
    mode: inference
    device: cpu
  - name: text-classification-mps
    role: candidate
    workload: text-classification
    mode: inference
    device: mps

  - name: keyword-spotting-cpu
    role: baseline
    workload: keyword-spotting
    mode: inference
    device: cpu
  - name: keyword-spotting-mps
    role: candidate
    workload: keyword-spotting
    mode: inference
    device: mps

  - name: information-retrieval-cpu
    role: baseline
    workload: information-retrieval
    mode: inference
    device: cpu
  - name: information-retrieval-mps
    role: candidate
    workload: information-retrieval
    mode: inference
    device: mps
