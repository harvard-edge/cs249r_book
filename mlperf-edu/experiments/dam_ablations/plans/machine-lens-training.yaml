schema: mlperf-edu-experiment-plan/0.3
id: dam-machine-lens-training
title: DAM Machine lens, CPU versus MPS on the training workloads
description: >
  Extend Machine-lens coverage from the inference workloads to the training
  workloads that fit in a bounded window. Time-series forecasting, recommendation,
  and reinforcement learning are all training-only contracts, so this plan
  measures how the backend choice moves training wall-clock rather than inference
  latency. Together with the completed inference sweep and the graph workload,
  this brings the Machine lens to ten of the fourteen workloads.

  keep_going is set because reinforcement learning executes inside a container
  runtime where the device selection may not apply the same way; a failure there
  should not abandon the other measurements.
profile: pro
power: false
keep_going: true
study:
  question: >
    Does the backend advantage measured on inference carry over to training, where
    the optimizer step, data loading, and per-epoch evaluation all contribute to
    wall-clock alongside the forward and backward passes?
  hypothesis: >
    The speedup will be smaller than on pure inference, because training
    interleaves host-side work that does not move to the accelerator. Sparse and
    search-coupled workloads should show the least benefit.
  independent_variables:
    - execution device
  controls:
    - pinned model architecture and dataset for each workload
    - epoch budget and evaluation schedule
    - random seed
    - inherited quality target
  analysis_metrics:
    - training wall-clock seconds
    - task quality against the inherited target
    - CPU-to-MPS speedup ratio
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/research/dam-machine-lens-training
  open_report: false
runs:
  - name: time-series-forecasting-cpu
    role: baseline
    workload: time-series-forecasting
    mode: training
    device: cpu
  - name: time-series-forecasting-mps
    role: candidate
    workload: time-series-forecasting
    mode: training
    device: mps

  - name: recommendation-cpu
    role: baseline
    workload: recommendation
    mode: training
    device: cpu
  - name: recommendation-mps
    role: candidate
    workload: recommendation
    mode: training
    device: mps

  - name: reinforcement-learning-cpu
    role: baseline
    workload: reinforcement-learning
    mode: training
    device: cpu
  - name: reinforcement-learning-mps
    role: candidate
    workload: reinforcement-learning
    mode: training
    device: mps
