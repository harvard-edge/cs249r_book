schema: mlperf-edu-experiment-plan/0.3
id: dam-machine-lens-remaining
title: DAM Machine lens, baselines for the last four workloads
description: >
  Close Machine-lens coverage to all fourteen workloads. The goal here is a
  measured baseline for every workload rather than a full ablation on each, so
  the lens has a real entry in every row instead of a synthesized one.

  Causal language modeling runs in training mode rather than through the prefill
  phase, whose recorded median is 409 minutes per arm and which would dominate
  the sweep without adding a distinct Machine-lens signal. Code generation runs
  both arms because its cost is unmeasured and worth establishing.

  Function calling and image generation carry a single MPS baseline each. Their
  recorded costs are 3.5 hours and a three-trial 150,000-image FID evaluation
  respectively, so a CPU arm would add roughly a day of wall-clock for one
  additional ratio. A measured baseline on the fast backend is the honest,
  affordable result; the missing CPU arm is recorded as a gap rather than
  estimated.

  Runs are ordered cheapest first so partial completion still banks results, and
  keep_going is set so a container or asset failure on one workload does not
  abandon the rest.
profile: pro
power: false
keep_going: true
study:
  question: >
    Does every workload in the suite have a measured Machine-lens baseline, and
    where the CPU arm is affordable, how large is the backend advantage?
  hypothesis: >
    Generative and agentic workloads dominated by autoregressive decode should
    show smaller backend advantages than dense batched inference, because decode
    is bound by weight streaming rather than by arithmetic throughput.
  independent_variables:
    - execution device
  controls:
    - pinned checkpoint, revision, and evaluation split per workload
    - inherited quality target
    - random seed
  analysis_metrics:
    - wall-clock seconds
    - task quality against the inherited target
    - CPU-to-MPS speedup ratio where both arms are measured
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/research/dam-machine-lens-remaining
  open_report: false
runs:
  # ---- causal language modeling: training mode, both arms ----
  - name: causal-language-modeling-cpu
    role: baseline
    workload: causal-language-modeling
    mode: training
    device: cpu
  - name: causal-language-modeling-mps
    role: candidate
    workload: causal-language-modeling
    mode: training
    device: mps

  # ---- code generation: cost unmeasured, establish both arms ----
  - name: code-generation-cpu
    role: baseline
    workload: code-generation
    mode: inference
    device: cpu
  - name: code-generation-mps
    role: candidate
    workload: code-generation
    mode: inference
    device: mps

  # ---- function calling: MPS baseline only, CPU arm too costly ----
  - name: function-calling-mps
    role: baseline
    workload: function-calling
    mode: inference
    device: mps

  # ---- image generation: MPS baseline only, CPU arm too costly ----
  - name: image-generation-mps
    role: baseline
    workload: image-generation
    mode: inference
    device: mps
