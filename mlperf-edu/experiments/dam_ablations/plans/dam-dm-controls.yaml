schema: mlperf-edu-experiment-plan/0.3
id: dam-dm-controls
title: Controls for the D x M contrast, linearity and run order
description: >
  The factorial found the machine advantage rising from 2.38x at 500 epochs to
  2.79x at 125 epochs, a 17 percent contrast that clears the measured noise
  floor. Two problems block claiming it as an effect.

  First, a two-point fit of T = fixed + per_epoch x E gives MPS a negative fixed
  cost, which is unphysical. A third budget level tests whether per-epoch cost
  is actually constant.

  Second, every pair so far ran CPU before MPS, so any warm-cache benefit
  accrued to MPS in every reported speedup. The contracts exclude dataset load
  and model construction from the timed region, which limits the exposure, but
  it is systematic and must be measured rather than argued away. The reversed
  pair below runs MPS first at the pinned baseline; if the speedup is unchanged,
  ordering is not driving the result.
profile: pro
power: false
keep_going: true
study:
  question: >
    Is the D x M contrast a real effect, or an artifact of a two-point
    extrapolation and a systematic CPU-before-MPS run order?
  hypothesis: >
    If per-epoch cost is constant, the 250-epoch cell will land on the line
    through the 125 and 500 epoch cells. If run order is not driving the
    contrast, the reversed baseline pair will reproduce the 2.38x speedup within
    the measured noise floor.
  independent_variables:
    - MLPERF_EDU_GRAPH_MAX_EPOCHS
    - execution device
    - device execution order within a pair
  controls:
    - official OGB GCN architecture and ogbn-arxiv split
    - hidden width 256, three layers, dropout 0.5, learning rate 0.01
    - random seed 42
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/research/dam-dm-controls
  open_report: false
runs:
  # ---- third budget level: tests linearity of per-epoch cost ----
  - name: dmid-afull-cpu
    role: baseline
    workload: graph-node-classification
    mode: training
    device: cpu
    environment:
      MLPERF_EDU_GRAPH_MAX_EPOCHS: 250
      MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS: 256
  - name: dmid-afull-mps
    role: candidate
    workload: graph-node-classification
    mode: training
    device: mps
    environment:
      MLPERF_EDU_GRAPH_MAX_EPOCHS: 250
      MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS: 256

  # ---- reversed order at the pinned baseline: MPS runs first ----
  - name: dfull-afull-mps-first
    role: candidate
    workload: graph-node-classification
    mode: training
    device: mps
    environment:
      MLPERF_EDU_GRAPH_MAX_EPOCHS: 500
      MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS: 256
  - name: dfull-afull-cpu-second
    role: candidate
    workload: graph-node-classification
    mode: training
    device: cpu
    environment:
      MLPERF_EDU_GRAPH_MAX_EPOCHS: 500
      MLPERF_EDU_GRAPH_MAX_HIDDEN_CHANNELS: 256
