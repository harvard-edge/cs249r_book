# Suite-level metadata for the MLPerf EDU registry.
#
# This file is registry source of truth, exactly like the per-workload YAML
# files under suites/. The documentation site is generated from it; never
# describe a suite in prose anywhere else.
#
# Note: this file deliberately lives NEXT TO suites/ (not inside it) because
# the registry loader treats every YAML file inside suites/<name>/ as a
# workload definition.

suites:
  graph:
    title: Graph Learning
    summary: >-
      Graph neural network training on sparse adjacency structure, exercising
      irregular memory access patterns that dense workloads never touch.
    focus: >-
      Sparse gather/scatter behavior and the memory-bound character of
      message passing.
  language:
    title: Language Modeling
    summary: >-
      Established language tasks at laptop scale, including nanoGPT training
      and phased inference, DistilBERT classification, NanoBEIR reranking,
      code generation, and structured function calling.
    focus: >-
      Attention and KV-cache mechanics, training-to-inference provenance, and
      the compute/memory regimes of transformer and structured-decoding phases.
  recommendation:
    title: Recommendation
    summary: >-
      Neural Collaborative Filtering on MovieLens-20M, training implicit-feedback
      recommendation from scratch over user and item embedding tables.
    focus: >-
      Embedding-table access, dense-sparse interaction, memory capacity, and
      irregular lookup behavior.
  reinforcement:
    title: Reinforcement Learning
    summary: >-
      Historical MLPerf MiniGo policy-value learning through self-play,
      introduced first as an experimental functional path.
    focus: >-
      Search-coupled inference, dynamic data generation, iterative training,
      and model promotion through playoff evaluation.
  timeseries:
    title: Time Series
    summary: >-
      PatchTST forecasting on the established ETTm1 split, with patch-based
      Transformer training over long multivariate sequences.
    focus: >-
      Long-context attention, patch extraction, memory traffic, and training
      throughput for multivariate forecasting.
  tiny:
    title: TinyML
    summary: >-
      Exact MLPerf Tiny keyword-spotting, machine-sound anomaly-detection, and
      visual-wake-words inference through thin PyTorch adapters for the official
      models and accuracy sets.
    focus: >-
      On-device memory budgets, small-batch latency, reconstruction scoring,
      and audio and image input pipelines.
  vision:
    title: Vision
    summary: >-
      Exact MLPerf Tiny image-classification inference through a thin PyTorch
      adapter plus experimental iterative image-generation integration.
    focus: >-
      Convolution, tensor layout, batching, iterative denoising, and accelerator
      utilization at a laptop- and classroom-friendly scale.
