# Suite-level metadata for the MLPerf EDU registry.
#
# This file is registry source of truth, exactly like the per-workload YAML
# files under suites/. The documentation site is generated from it; never
# describe a suite in prose anywhere else.
#
# Note: this file deliberately lives NEXT TO suites/ (not inside it) because
# the registry loader treats every YAML file inside suites/<name>/ as a
# workload definition.

suites:
  graph:
    title: Graph Learning
    summary: >-
      Graph neural network training on sparse adjacency structure, exercising
      irregular memory access patterns that dense workloads never touch.
    focus: >-
      Sparse gather/scatter behavior and the memory-bound character of
      message passing.
  language:
    title: Language Modeling
    summary: >-
      White-box transformer training and inference at teaching scale, from
      character-level NanoGPT pre-training through LoRA fine-tuning,
      mixture-of-experts routing, and staged prefill/decode inference.
    focus: >-
      Attention and KV-cache mechanics, training-to-inference provenance, and
      the compute/memory regimes of transformer phases.
  recommender:
    title: Recommendation
    summary: >-
      DLRM-style recommender training with large sparse embedding tables,
      including a DRAM-pressure variant that deliberately exceeds cache
      capacity.
    focus: >-
      Sparse-memory behavior, embedding-table bandwidth, and
      capacity-vs-latency trade-offs.
  timeseries:
    title: Time Series
    summary: >-
      Recurrent sequence modeling over streaming windows, exercising the
      sequential dependency chains that defeat batch parallelism.
    focus: >-
      Sequential bottlenecks and small-tensor dispatch overhead in recurrent
      training.
  tiny:
    title: TinyML
    summary: >-
      Edge and microcontroller-scale workloads (keyword spotting, visual
      wake words, and anomaly detection) aligned with MLPerf Tiny.
    focus: >-
      On-device memory budgets, small-batch latency, and sensor-style input
      pipelines.
  vision:
    title: Vision
    summary: >-
      Convolutional and diffusion vision workloads spanning edge training,
      mobile architectures, compression-composed variants, and generative
      UNet training.
    focus: >-
      Compute-bound convolution regimes, mobile efficiency trade-offs, and
      compression/quality interactions.
