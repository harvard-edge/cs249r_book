schema: mlperf-edu-workload-selection/0.1
admission_rule: >-
  Include a workload as a candidate only when an authoritative upstream source
  supplies the task, model or reference implementation, dataset and split,
  evaluator, quality contract, and credible baseline. The min profile must
  preserve the workload identity on classroom hardware. The unchanged max
  contract must remain runnable in a declared single-node classroom or research
  envelope, even when that environment is not locally available. MLPerf EDU may
  add only a thin execution adapter, measurement, provenance, verification, and
  reporting. Promotion requires complete evidence from the declared environment.

statuses:
  admitted: The complete upstream contract and declared execution envelope are verified.
  candidate: The upstream contract is complete, but quality conformance or environment-specific evidence remains pending.
  deferred: No unchanged authoritative path fits the classroom or single-node research boundary.
  rejected: The proposal requires an invented or unstable benchmark contract.

workloads:
  image-classification:
    status: candidate
    upstream:
      authority: MLCommons MLPerf Tiny
      task: Image classification
      model: MLPerf Tiny ResNet
      dataset: CIFAR-10
      split: MLPerf Tiny accuracy dataset and preprocessing
      evaluator: Top-1 accuracy
      quality_target: 0.85
      published_baseline: MLPerf Tiny reference quality contract
      provenance:
        - https://github.com/mlcommons/tiny/blob/master/benchmark/MLPerfTiny_Rules.adoc
    rationale:
      task_significance: Canonical supervised vision task with established benchmark lineage.
      benchmark_lineage: Direct MLPerf Tiny workload inheritance.
      classroom_value: Connects a canonical convolutional model, fixed accuracy set, and inherited quality gate to reproducible inference measurement.
      systems_behavior: Dense convolution, input layout, batching, and accelerator utilization.
      reason_for_model: The model is fixed by the upstream MLPerf Tiny contract.
      reason_for_dataset: CIFAR-10 is fixed by the upstream MLPerf Tiny contract.
      reason_for_metric: Top-1 accuracy and the threshold are fixed upstream.
      alternatives_rejected: ResNet-18 on Fashion-MNIST does not inherit this contract.
    laptop_evidence: Exact official float checkpoint reproduces 87.0% top-1 on the complete 200-example MLPerf Tiny accuracy set through the PyTorch adapter on both CPU and Apple Silicon. Repeating the unchanged pass 50 times produces an approximately one-second Apple Silicon measurement suitable for the outer repeatability gate; committed repeated timing evidence remains pending.
    implementation_state: exact-source-inference-adapter-implemented-promotion-pending

  keyword-spotting:
    status: candidate
    upstream:
      authority: MLCommons MLPerf Tiny
      task: Keyword spotting
      model: DS-CNN
      dataset: Speech Commands v2
      split: MLPerf Tiny accuracy dataset and preprocessing
      evaluator: Top-1 accuracy
      quality_target: 0.90
      published_baseline: MLPerf Tiny reference quality contract
      provenance:
        - https://github.com/mlcommons/tiny/blob/master/benchmark/MLPerfTiny_Rules.adoc
    rationale:
      task_significance: Established small-vocabulary audio classification task.
      benchmark_lineage: Direct MLPerf Tiny workload inheritance.
      classroom_value: Adds audio preprocessing and depthwise-separable convolution.
      systems_behavior: Small-tensor convolution, feature extraction, and latency sensitivity.
      reason_for_model: DS-CNN is fixed by the upstream MLPerf Tiny contract.
      reason_for_dataset: Speech Commands v2 is fixed by the upstream contract.
      reason_for_metric: Top-1 accuracy and the threshold are fixed upstream.
      alternatives_rejected: Project-defined audio tasks would lose MLPerf comparability.
    laptop_evidence: PyTorch adapter reproduces 90.2% top-1 on the complete 1,000-example EEMBC accuracy set with fully verified provenance. A committed full-set LiteRT 2.1.6 audit found 7 top-1 disagreements and 90.0% accuracy with XNNPACK, plus 5 disagreements and 90.5% with both builtin resolvers; all paths pass the inherited 90% gate. The result is classified as quality-preserving but nonidentical rather than assigning an invented disagreement tolerance. A repeated-timing promotion attempt at 200 repetitions passed quality but failed the 5% timing repeatability gate because the measured region lasted only about 0.8 seconds. A 2,000-pass probe remained sensitive to MPS device-state drift. The canonical protocol now establishes device state with 1,000 untimed passes before measuring 2,000 unchanged passes. A fresh performance sweep is deferred until an exact-source execution path or authoritative unquantized weights remove the conformance blocker.
    implementation_state: quality-preserving-nonidentical-adapter-promotion-blocked

  anomaly-detection:
    status: candidate
    upstream:
      authority: MLCommons MLPerf Tiny
      task: Machine-sound anomaly detection
      model: Fully connected deep autoencoder
      dataset: ToyADMOS
      split: MLPerf Tiny accuracy dataset and preprocessing
      evaluator: ROC AUC
      quality_target: 0.85
      published_baseline: MLPerf Tiny reference quality contract
      provenance:
        - https://github.com/mlcommons/tiny/blob/master/benchmark/MLPerfTiny_Rules.adoc
    rationale:
      task_significance: Canonical reconstruction-based industrial anomaly task.
      benchmark_lineage: Direct MLPerf Tiny workload inheritance.
      classroom_value: Contrasts reconstruction scoring with supervised classification.
      systems_behavior: Compact dense inference plus feature and score postprocessing.
      reason_for_model: The autoencoder architecture is fixed upstream.
      reason_for_dataset: ToyADMOS is fixed upstream.
      reason_for_metric: ROC AUC and the threshold are fixed upstream.
      alternatives_rejected: Fashion-MNIST anomaly detection is not the MLPerf workload.
    laptop_evidence: The pinned MLCommons repository contains the complete 248-recording accuracy index, float and INT8 checkpoints, feature recipe, and 0.85 AUC gate. A range-based fetch retrieves only the 69.9 MB of selected recordings from the immutable 1.816 GB Zenodo archive. The exact librosa conversion produces 48,608 sliding windows, and the fused TFLite-to-PyTorch adapter reproduces the official restricted-set ROC AUC exactly at 0.9029100529100529. Per-ID AUCs also match at 0.8941798942, 0.9449735450, 0.7904761905, and 0.9925925926.
    implementation_state: exact-source-adapter-verified-promotion-pending

  visual-wake-words:
    status: candidate
    upstream:
      authority: MLCommons MLPerf Tiny
      task: Person detection through visual wake words
      model: MobileNetV1
      dataset: Visual Wake Words derived from COCO
      split: MLPerf Tiny accuracy dataset and preprocessing
      evaluator: Top-1 binary classification accuracy
      quality_target: 0.80
      published_baseline: MLPerf Tiny reference quality contract
      provenance:
        - https://github.com/mlcommons/tiny/blob/4addd0fa08d216e20637637874e084895f289da4/benchmark/MLPerfTiny_Rules.adoc
        - https://github.com/eembc/benchmark-runner-ml/tree/cf7c2f2634608a7c0ea7458ab7cb3379f2863424/datasets/vww01
    rationale:
      task_significance: Established always-on person-detection task for edge vision.
      benchmark_lineage: Direct MLPerf Tiny workload inheritance.
      classroom_value: Connects object annotations to a compact binary vision pipeline.
      systems_behavior: Mobile convolution, image preprocessing, and single-stream latency.
      reason_for_model: MobileNetV1 is fixed by the upstream MLPerf Tiny contract.
      reason_for_dataset: The Visual Wake Words COCO derivation is fixed upstream.
      reason_for_metric: Binary top-1 accuracy and the threshold are fixed upstream.
      alternatives_rejected: Synthetic deterministic images cannot support the upstream quality claim.
    laptop_evidence: The upstream MLPerf Tiny implementation points to a directly downloadable 96-by-96 COCO-derived archive. All 1,000 pinned EEMBC label IDs resolve exactly, with 500 examples per class. The exact PyTorch adapter reproduces 85.1% top-1 accuracy on both CPU and Apple MPS against the official 80% target.
    implementation_state: exact-source-adapter-verified-promotion-pending

  text-classification:
    status: candidate
    upstream:
      authority: Hugging Face DistilBERT reference checkpoint and GLUE
      task: Binary sentiment classification
      model: distilbert-base-uncased-finetuned-sst-2-english
      dataset: GLUE SST-2
      split: SST-2 validation split
      evaluator: Classification accuracy
      quality_target: 0.9105504587155964 GLUE SST-2 validation accuracy
      published_baseline: 0.9105504587155964 verified accuracy in the pinned Hugging Face model-index metadata
      provenance:
        - https://huggingface.co/distilbert/distilbert-base-uncased-finetuned-sst-2-english
    rationale:
      task_significance: Standard Transformer encoder classification task.
      benchmark_lineage: Published DistilBERT checkpoint evaluated on GLUE SST-2.
      classroom_value: Demonstrates tokenization, padding, attention, and fine-tuning.
      systems_behavior: Encoder attention, dynamic sequence lengths, and batch padding.
      reason_for_model: Official compact checkpoint has a published accuracy baseline.
      reason_for_dataset: SST-2 is the checkpoint's named evaluation task.
      reason_for_metric: Accuracy is the standard SST-2 metric.
      alternatives_rejected: A custom micro-BERT has no equivalent upstream quality contract.
    laptop_evidence: Exact checkpoint and SST-2 development split reproduce the pinned model-index's verified 91.055% accuracy exactly with fully verified provenance on Apple Silicon in 4.19 seconds and CPU in 36.92 seconds for five repetitions; committed repeated timing remains pending.
    implementation_state: exact-source-adapter-verified-promotion-pending

  graph-node-classification:
    status: candidate
    upstream:
      authority: Open Graph Benchmark
      task: Node classification
      model: Official OGB GCN baseline
      dataset: ogbn-arxiv
      split: Official time-based OGB split
      evaluator: OGB node-property evaluator accuracy
      quality_target: derive-only-from-reproduced-official-baseline
      published_baseline: Official OGB baseline and leaderboard
      provenance:
        - https://ogb.stanford.edu/docs/nodeprop/
        - https://ogb.stanford.edu/docs/leader_nodeprop/
        - https://github.com/snap-stanford/ogb
    rationale:
      task_significance: Recognized reproducible graph-learning benchmark.
      benchmark_lineage: OGB supplies data, split, evaluator, baseline, and leaderboard.
      classroom_value: Introduces message passing and graph-specific data representation.
      systems_behavior: Sparse gather, scatter, and irregular memory access.
      reason_for_model: GCN is the official interpretable baseline.
      reason_for_dataset: ogbn-arxiv is more system-relevant than tiny citation graphs.
      reason_for_metric: The OGB evaluator fixes the accuracy computation.
      alternatives_rejected: Cora is useful pedagogically but too small for stable systems measurement.
    laptop_evidence: Two complete 500-epoch runs of the official 110,120-parameter GCN recipe reached 72.232% and 71.998% test accuracy at the best validation epoch on Apple Silicon. Both satisfy the correct official ogbn-arxiv GCN reference of 71.74% with its published 0.29-point standard deviation. The earlier 72.51% target was traced to a different OGB leaderboard section and corrected; committed repeated evidence remains pending.
    implementation_state: exact-source-adapter-verified-promotion-pending

  causal-language-modeling:
    status: candidate
    upstream:
      authority: nanoGPT upstream repository
      task: Autoregressive language modeling
      model: nanoGPT Shakespeare character configuration
      dataset: Tiny Shakespeare
      split: Upstream prepare.py train and validation split
      evaluator: Validation cross-entropy loss
      quality_target: reproduce-upstream-1.4697-before-setting-tolerance
      published_baseline: 1.4697 best validation loss
      provenance:
        - https://github.com/karpathy/nanoGPT
    rationale:
      task_significance: Transparent end-to-end decoder-only Transformer workload.
      benchmark_lineage: Upstream publishes the configuration, runtime, and validation loss.
      classroom_value: Model and training loop are small enough to inspect completely.
      systems_behavior: Attention training, autoregressive inference, and KV-cache phases.
      reason_for_model: nanoGPT is an established educational reference with an exact recipe.
      reason_for_dataset: Tiny Shakespeare is the upstream quick-start dataset.
      reason_for_metric: Validation cross-entropy is emitted by the upstream training recipe.
      alternatives_rejected: Project-defined prompt quality is not a language-model quality contract.
    laptop_evidence: Exact upstream nanoGPT Shakespeare configuration reaches 1.46131 best validation loss on Apple Silicon in 1,604.77 seconds, exceeding the published 1.4697 target; committed repeated timing and inference-phase evidence remain pending.
    implementation_state: exact-source-training-adapter-verified-promotion-pending

  information-retrieval:
    status: candidate
    upstream:
      authority: Sentence Transformers
      task: Cross-encoder information-retrieval reranking
      model: cross-encoder/ms-marco-MiniLM-L6-v2
      dataset: NanoBEIR-en NanoMSMARCO, NanoNFCorpus, and NanoNQ
      split: Fifty queries and official BM25 top-100 candidates per dataset
      evaluator: CrossEncoderNanoBEIREvaluator
      quality_target: 0.60716840988382 mean nDCG@10
      published_baseline: Exact result in the Sentence Transformers evaluator documentation
      provenance:
        - https://www.sbert.net/docs/package_reference/sentence_transformer/evaluation.html
        - https://huggingface.co/cross-encoder/ms-marco-MiniLM-L6-v2
    rationale:
      task_significance: Retrieval is foundational to search and retrieval-augmented systems.
      benchmark_lineage: Sentence Transformers packages the datasets and evaluator.
      classroom_value: Demonstrates query-document pair construction, batched cross-encoder scoring, and ranking metrics.
      systems_behavior: Variable-length tokenization, encoder attention, batched pair scoring, and ranking.
      reason_for_model: The compact MiniLM cross-encoder and exact score are the official upstream evaluator example.
      reason_for_dataset: NanoBEIR was designed for rapid established retrieval evaluation, and the documented three-dataset subset is only 150 queries.
      reason_for_metric: The upstream evaluator fixes the retrieval metrics.
      alternatives_rejected: A custom RAG pipeline would require generator and judge design.
    laptop_evidence: Exact pinned model and twelve-file NanoBEIR bundle reproduce the documented 0.60716840988382 mean nDCG@10 with fully verified provenance on Apple Silicon in 18.10 seconds and CPU in 102.91 seconds; committed repeated timing remains pending.
    implementation_state: exact-source-adapter-verified-promotion-pending

  code-generation:
    status: candidate
    upstream:
      authority: Qwen and EvalPlus
      task: Python code generation
      model: Qwen/Qwen2.5-Coder-0.5B-Instruct
      dataset: HumanEval+
      split: Complete EvalPlus HumanEval+ release
      evaluator: EvalPlus pass@1 in its pinned Docker image
      quality_target: 0.573 HumanEval+ pass@1
      published_baseline: Qwen2.5-Coder technical report Table 16
      provenance:
        - https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct
        - https://github.com/evalplus/evalplus
    rationale:
      task_significance: Functional code generation is a recognized language-model task.
      benchmark_lineage: Official Qwen model plus established execution-based EvalPlus evaluation.
      classroom_value: Demonstrates decoding, functional correctness, and sandboxed evaluation.
      systems_behavior: Autoregressive generation with variable output length and isolated execution.
      reason_for_model: It is the smallest official Qwen2.5-Coder release.
      reason_for_dataset: HumanEval+ strengthens the established HumanEval contract.
      reason_for_metric: pass@1 measures functional correctness rather than text similarity.
      alternatives_rejected: Project-defined prompts and expected strings are not a code benchmark.
    laptop_evidence: The complete HumanEval+ v0.1.10 release contains 164 tasks and has SHA-256 42526ec0e7d5f3ee0b06d6ced98f8c8bae3d76519151bfb3d36f79010645bd7f. The 0.49-billion-parameter checkpoint fits Apple Silicon memory, and the official EvalPlus images run safely under Docker Desktop amd64 emulation with networking disabled, a read-only root, all capabilities dropped, no-new-privileges, and explicit CPU, memory, and process limits. Exact ChatML greedy generation on MPS produced 100/164 base and 92/164 HumanEval+ passes with bfloat16 SDPA, 101/164 base and 92/164 HumanEval+ passes with bfloat16 eager attention, and 101/164 base and 93/164 HumanEval+ passes with float32. The published Qwen result is 101/164 base and 94/164 HumanEval+ passes. Qwen's exact EvalPlus source commit 899b2b31bbe8d6e12337b865a8aa03fcd57c1121, its evalplus==0.2.1 dependency image, EvalPlus v0.3.1, Transformers 4.43.1, and Transformers 5.13 were cross-checked; none recovered the missing HumanEval+ pass locally.
    authoritative_one_run_evidence: >-
      The 2026-07-17 max CLI run generated and evaluated all 164 tasks once with
      the pinned float32 eager-attention recipe. It passed 91 tasks
      (0.5548780487804879), below the unchanged 94-task (0.573) gate. Generation
      took 894.5666797500453 seconds for 35,547 tokens. The report SHA-256 is
      368bd0eb30568725d62c9059613f6c043f5488e5e0fd3aac927ac5872c5a40b0,
      provenance SHA-256 is
      86c26cd6c3987923a0acaad7323da301067eb7ecfca5b09e9e44487494582df2,
      samples SHA-256 is
      c04eb90a2429f384e7cfe33592621dbc6b2c199b0677d4d40cbd15c3c0270992,
      and EvalPlus results SHA-256 is
      55341b5341f8b906b17aec1f8a4b0b40a937572fe37fa4355bcfee9576d201dc.
      The provenance verifier passed every source, weight, dataset, RNG,
      hardware, measurement, Merkle-root, and integrity-digest check.
    implementation_state: authoritative-runner-integrated-quality-target-not-met
    quality_conformance_blocker: No tested laptop PyTorch execution reproduces the published 57.3% HumanEval+ pass@1 baseline. The quality-conformance spiral preserves that gap instead of inventing a lower target or tolerance.

  recommendation:
    status: candidate
    upstream:
      authority: MLCommons MLPerf Training v0.5 recommendation
      task: Implicit-feedback recommendation
      model: Neural Collaborative Filtering (GMF and MLP towers)
      dataset: MovieLens-20M
      split: Leave-one-out with 100 sampled negatives per user
      evaluator: MLPerf v0.5 HR@10 hit-rate evaluator
      quality_target: 0.635 HR@10
      published_baseline: MLPerf Training v0.5 recommendation quality target
      provenance:
        - https://mlcommons.org/en/training-normal-05/
        - https://github.com/mlcommons/training/tree/master/retired_benchmarks/recommendation
        - https://grouplens.org/datasets/movielens/20m/
    rationale:
      task_significance: Recommendation accounts for a major sparse-ML systems workload class.
      benchmark_lineage: Direct inheritance from the MLPerf Training v0.5 recommendation workload, on the same historical-MLPerf basis that retains MiniGo as the reinforcement-learning identity.
      classroom_value: Contrasts embedding tables with dense networks, and trains from scratch inside a class period.
      systems_behavior: Embedding lookup, dense interaction, and negative-sampling data pressure.
      reason_for_model: MLPerf Training v0.5 fixes the NCF architecture and its predictive-factor and MLP configuration.
      reason_for_metric: MLPerf Training v0.5 publishes 0.635 HR@10 for this model, dataset, and evaluator.
      reason_for_dataset: MovieLens-20M is the official v0.5 dataset and is roughly 190 MB, so the unchanged contract fits the declared laptop envelope.
      alternatives_rejected: DLRM on Criteo Terabyte preserves a richer sparse-memory profile but cannot execute in the declared envelope. DLRM on Criteo Kaggle would fit, but no published AUC target exists for that pairing, so adopting it would require inventing a threshold.
    laptop_evidence: MovieLens-20M is about 190 MB and the v0.5 NCF configuration trains from scratch on laptop-class hardware. The prior DLRM contract required manually licensed 1 TB data, a roughly 90 GB checkpoint, and a 256 GB-class runtime.
    implementation_state: contract-registered-runner-pending
    quality_conformance_blocker: The native PyTorch NCF runner is not yet implemented, so no HR@10 decision has been recorded against the unchanged 0.635 target.
    substitution_note: This replaces the DLRM and Criteo Terabyte contract recorded through 2026-08. The substitution narrows what the workload teaches, because MovieLens categorical cardinality is far below Criteo's and does not expose the memory-capacity wall. That limitation is recorded rather than implied to be equivalent.

  time-series-forecasting:
    status: candidate
    upstream:
      authority: PatchTST authors
      task: Long-horizon multivariate forecasting
      model: PatchTST
      dataset: ETTm1
      split: Official PatchTST ETT split and preprocessing
      evaluator: MSE and MAE
      quality_target: reproduce the published 0.290 test MSE before fixing a conformance tolerance
      published_baseline: 0.290 MSE and 0.342 MAE in the PatchTST paper
      provenance:
        - https://github.com/yuqinie98/PatchTST
        - https://openreview.net/forum?id=Jbdc0vTOcol
    rationale:
      task_significance: Forecasting is a recognized sequence-modeling domain.
      benchmark_lineage: The official implementation and paper publish ETT recipes and results.
      classroom_value: Introduces windowing, horizon selection, normalization, and regression metrics.
      systems_behavior: Long-window attention, patching, and multichannel input processing.
      reason_for_model: PatchTST is established and more system-relevant than a single linear layer.
      reason_for_dataset: ETTm1 is a standard dataset in the official evaluation.
      reason_for_metric: MSE and MAE are fixed by the upstream benchmark.
      alternatives_rejected: A custom micro-LSTM does not preserve a published forecasting contract.
    laptop_evidence: Two exact Apple Silicon reproductions produced 0.29168 and 0.29239 test MSE in 637.36 and 931.81 seconds. Neither reproduces the published 0.290 point result. No conformance tolerance is defined until an independent forecasting policy review establishes one without fitting it to local observations.
    implementation_state: exact-source-adapter-quality-target-not-met
    quality_conformance_blocker: The strongest local result is 0.29168 test MSE and misses the published 0.290 reproduction point. The functional spiral preserves that gap without borrowing an unrelated MLPerf Inference tolerance.

  image-generation:
    status: candidate
    upstream:
      authority: NVIDIA EDM reference implementation
      task: Class-conditional image generation
      model: EDM class-conditional CIFAR-10 checkpoint
      dataset: CIFAR-10
      split: Official 50,000-image EDM FID protocol and CIFAR-10 reference statistics
      evaluator: Official EDM Fréchet inception distance evaluator
      quality_target: reproduce the published 1.79 FID before fixing a conformance tolerance
      published_baseline: 1.79 FID using the official 18-step deterministic sampler and 35 network evaluations per image
      provenance:
        - https://github.com/NVlabs/edm
        - https://arxiv.org/abs/2206.00364
    rationale:
      task_significance: Diffusion is a major iterative generative-model workload class.
      benchmark_lineage: The authors publish the paper, reference code, checkpoint, sampler, reference statistics, and exact FID procedure.
      classroom_value: Exposes iterative denoising, precision behavior, scheduler design, and generative quality evaluation.
      systems_behavior: Repeated UNet execution, scheduler overhead, and precision sensitivity.
      reason_for_model: The 55.7-million-parameter official checkpoint is small enough for local inference and has a stronger published baseline than the earlier Google DDPM candidate.
      reason_for_dataset: CIFAR-10 and its reference statistics are fixed by the upstream checkpoint and evaluator.
      reason_for_metric: Upstream requires exactly 50,000 generated images for FID and rejects smaller sets.
      alternatives_rejected: A custom MNIST diffusion trainer, reduced FID set, or denoising-only metric has no equivalent quality contract.
    laptop_evidence: >-
      NVIDIA EDM revision 008a4e5316c8e3bfe61a62f874bddba254295afb
      supplies a 223,183,453-byte checkpoint with SHA-256
      b27385e4f2f8d4d1e2e2c03864c5a9574a0c58ba81eb11625ae6d15c401f4796
      and official CIFAR-10 statistics with SHA-256
      4ada108cdfd8e43409ed427f5f76631beac9b9617cdcaf416d41b1e161d85969.
      The exact Apple MPS adapter completed NVIDIA's three independent
      50,000-image trials with the official 18-step deterministic sampler and
      35 network evaluations per image. The stable-AC trials produced FIDs of
      1.813890909384895, 1.8015540749984766, and 1.8155250554012863. The
      three-trial minimum is therefore 1.8015540749984766, which reports as
      1.80 at the paper's two-decimal precision and does not reproduce the
      published 1.79. The final trial generated seeds 100,000 through 149,999
      from an empty directory in 11,176.167 seconds at 4.474 images per second;
      its verified image-set SHA-256 is
      21dbb93da4587a01f3c0406bd64088b5cadba89532131cccd9b0f0c329a21ab5 and
      its manifest SHA-256 is
      3575d50f60b2a0e1734fe430ac374ae9a875f40d69e200450ecddc968b079fa9.
      The current importer rehashed all 150,000 retained PNGs and rescored the
      three trials at 1.8138909093846503, 1.8015540749997014, and
      1.8155250554018245. The largest absolute difference from the original
      evaluator records was 1.23e-12 FID.
      The CPU/MPS evaluator cross-check differed by only
      0.00000002532324 FID. Lowering the target, adding a tolerance after the
      result, or evaluating fewer than 50,000 images would invent a new
      quality contract, so authoritative quality conformance remains blocked.
    implementation_state: authoritative-runner-integrated-quality-target-not-met
    quality_conformance_blocker: Three complete official 50,000-image trials produced a best FID of 1.8015540749984766 and did not reproduce the published 1.79 target. The functional spiral preserves that gap without changing the evaluator, sample count, target, or tolerance.

  function-calling:
    status: candidate
    upstream:
      authority: Berkeley Function Calling Leaderboard and Qwen
      task: Structured function calling
      model: Qwen/Qwen3-1.7B in function-calling mode
      dataset: BFCL V4 Non-Live AST
      split: Complete official simple Python, simple Java, simple JavaScript, multiple, parallel, and parallel-multiple categories
      evaluator: Official BFCL AST evaluator
      quality_target: 0.8292 Non-Live AST summary
      published_baseline: 0.8292 Non-Live AST summary in the current official BFCL V4 Qwen3-1.7B function-calling leaderboard entry
      provenance:
        - https://gorilla.cs.berkeley.edu/leaderboard
        - https://github.com/ShishirPatil/gorilla/tree/main/berkeley-function-call-leaderboard
        - https://huggingface.co/Qwen/Qwen3-1.7B
    rationale:
      task_significance: Structured tool selection is a bounded, recognized model task.
      benchmark_lineage: BFCL supplies data, evaluator, categories, and leaderboard.
      classroom_value: Demonstrates constrained structured generation and evaluator design.
      systems_behavior: Schema-heavy prefill and short structured decode.
      reason_for_model: Qwen3-1.7B is an official Apache-2.0 checkpoint that fits laptop memory and has a strong published BFCL category score.
      reason_for_dataset: Non-Live AST is an official bounded BFCL category that avoids web, memory, and external-service dependencies while retaining all 1,150 category examples.
      reason_for_metric: The official AST evaluator and published aggregate avoid project-defined string matching.
      alternatives_rejected: Open-ended tool agents and custom prompts are unstable scaffolds.
    laptop_evidence: >-
      BFCL revision 6ea57973c7a6097fd7c5915698c54c17c5b1b6c8 fixes
      1,150 Non-Live AST examples across the six published categories. The
      leaderboard identifies evaluation commit
      f7cf7359b7ac615a0b294831c5ba2bc95ee4a000; the six single-turn datasets,
      AST evaluator, and Qwen handler are unchanged between that commit and the
      audited revision. The official non-live CSV has SHA-256
      19eec28695654ece206b343252db836127a96f18552456c1c3cf496b2dc306d0.
      The Qwen revision 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e contains
      1,720,574,976 unique parameters because its input embedding and language
      model head are tied. It occupies 3.8 GB and loads in bfloat16 on Apple
      MPS. The complete local PyTorch audit generated and
