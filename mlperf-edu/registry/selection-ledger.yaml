  reinforcement-learning:
    status: candidate
    upstream:
      authority: Historical MLPerf Training
      task: Reinforcement learning through self-play
      model: MiniGo joint policy and value network
      dataset: Self-play games generated during the run
      split: Self-play generations plus fixed playoff evaluation
      evaluator: Professional-move prediction and model-vs-best-model playoff win rate
      quality_target: 0.40 professional-move prediction for the original 9-by-9 benchmark; 0.55 playoff gate for model promotion
      published_baseline: Original MLPerf Training v0.5 MiniGo reference workload
      provenance:
        - https://github.com/mlcommons/training/tree/v0.5/reinforcement/minigo
        - https://arxiv.org/abs/1910.01500
    rationale:
      task_significance: Canonical historical MLPerf reinforcement-learning workload.
      benchmark_lineage: Direct MLPerf Training lineage.
      classroom_value: Demonstrates self-play, search, dynamic data generation, and evaluation.
      systems_behavior: Repeated inference in tree search coupled to iterative training.
      reason_for_model: MiniGo is the MLPerf-selected RL reference.
      reason_for_dataset: Self-play is intrinsic to the canonical task.
      reason_for_metric: The original workload fixes professional-move prediction and a 100-game promotion playoff.
      alternatives_rejected: CartPole and Pendulum are substitutions without MLPerf lineage.
    laptop_evidence: Original MLPerf Training v0.5 revision 0badcd1786fcb007725ed05f1c44e9d80bbeac52 uses 9-by-9 Go, 2,000 self-play games per generation, 16 parallel self-play workers, 200 search readouts, a 100-game playoff, and a 55% promotion gate. Its own reference notes report only 34% professional-move prediction after about 60 hours on 16 CPU cores and one NVIDIA P100. The later retired 19-by-19 revision 3881aacb4b8e2f6f44c8cb2a7b05cfde0d46b649 expands to 8,192 games per iteration, 800 readouts, and eight self-play GPUs. Neither unchanged contract is laptop-practical.
    implementation_state: authoritative-runner-environment-handoff-ready
    quality_conformance_blocker: The original 9-by-9 MLPerf workload and later 19-by-19 workload both exceed the current laptop envelope. The functional spiral preserves MiniGo identity and treats the bounded runner as a setup probe rather than a quality result.

  end-to-end-rag:
    status: rejected
    reason: >-
      No single stable laptop-scale upstream tuple fixes retrieval, generation,
      prompting, and evaluation without introducing MLPerf EDU design choices.

  react-agent:
    status: rejected
    reason: >-
      ReAct is a prompting and orchestration method rather than a stable workload
      identity, and available environments require substantial scaffold choices.

  distributed-training:
    status: rejected
    reason: >-
      Distributed scaling claims are outside the v0.1 single-node product boundary.
