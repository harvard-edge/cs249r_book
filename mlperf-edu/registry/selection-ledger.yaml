schema: mlperf-edu-workload-selection/0.1
admission_rule: >-
  Admit a workload only when an authoritative upstream source supplies the task,
  model or reference implementation, dataset and split, evaluator, quality
  contract, and credible baseline, and when the unchanged contract is practical
  on laptop-class hardware. MLPerf EDU may add only a thin PyTorch adapter,
  measurement, provenance, verification, and reporting.

statuses:
  admitted: The complete upstream contract and laptop execution are verified.
  candidate: The upstream contract is complete, but local reproduction is pending.
  deferred: The canonical contract is not practical locally without changing it.
  rejected: The proposal requires an invented or unstable benchmark contract.

workloads:
  image-classification:
    status: candidate
    upstream:
      authority: MLCommons MLPerf Tiny
      task: Image classification
      model: MLPerf Tiny ResNet
      dataset: CIFAR-10
      split: MLPerf Tiny accuracy dataset and preprocessing
      evaluator: Top-1 accuracy
      quality_target: 0.85
      published_baseline: MLPerf Tiny reference quality contract
      provenance:
        - https://github.com/mlcommons/tiny/blob/master/benchmark/MLPerfTiny_Rules.adoc
    rationale:
      task_significance: Canonical supervised vision task with established benchmark lineage.
      benchmark_lineage: Direct MLPerf Tiny workload inheritance.
      classroom_value: Connects a canonical convolutional model, fixed accuracy set, and inherited quality gate to reproducible inference measurement.
      systems_behavior: Dense convolution, input layout, batching, and accelerator utilization.
      reason_for_model: The model is fixed by the upstream MLPerf Tiny contract.
      reason_for_dataset: CIFAR-10 is fixed by the upstream MLPerf Tiny contract.
      reason_for_metric: Top-1 accuracy and the threshold are fixed upstream.
      alternatives_rejected: ResNet-18 on Fashion-MNIST does not inherit this contract.
    laptop_evidence: Exact official float checkpoint reproduces 87.0% top-1 on the complete 200-example MLPerf Tiny accuracy set through the PyTorch adapter on both CPU and Apple Silicon. Repeating the unchanged pass 50 times produces an approximately one-second Apple Silicon measurement suitable for the outer repeatability gate; committed five-run timing evidence remains pending.
    implementation_state: exact-source-inference-adapter-implemented-promotion-pending

  keyword-spotting:
    status: candidate
    upstream:
      authority: MLCommons MLPerf Tiny
      task: Keyword spotting
      model: DS-CNN
      dataset: Speech Commands v2
      split: MLPerf Tiny accuracy dataset and preprocessing
      evaluator: Top-1 accuracy
      quality_target: 0.90
      published_baseline: MLPerf Tiny reference quality contract
      provenance:
        - https://github.com/mlcommons/tiny/blob/master/benchmark/MLPerfTiny_Rules.adoc
    rationale:
      task_significance: Established small-vocabulary audio classification task.
      benchmark_lineage: Direct MLPerf Tiny workload inheritance.
      classroom_value: Adds audio preprocessing and depthwise-separable convolution.
      systems_behavior: Small-tensor convolution, feature extraction, and latency sensitivity.
      reason_for_model: DS-CNN is fixed by the upstream MLPerf Tiny contract.
      reason_for_dataset: Speech Commands v2 is fixed by the upstream contract.
      reason_for_metric: Top-1 accuracy and the threshold are fixed upstream.
      alternatives_rejected: Project-defined audio tasks would lose MLPerf comparability.
    laptop_evidence: PyTorch adapter reproduces 90.2% top-1 on the complete 1,000-example EEMBC accuracy set with fully verified provenance. Repeating the unchanged pass 200 times produces an approximately 0.8-second Apple Silicon measurement suitable for the outer repeatability gate; committed five-run timing and updated CPU evidence remain pending.
    implementation_state: exact-source-adapter-implemented-promotion-pending

  anomaly-detection:
    status: deferred
    upstream:
      authority: MLCommons MLPerf Tiny
      task: Machine-sound anomaly detection
      model: Fully connected deep autoencoder
      dataset: ToyADMOS
      split: MLPerf Tiny accuracy dataset and preprocessing
      evaluator: ROC AUC
      quality_target: 0.85
      published_baseline: MLPerf Tiny reference quality contract
      provenance:
        - https://github.com/mlcommons/tiny/blob/master/benchmark/MLPerfTiny_Rules.adoc
    rationale:
      task_significance: Canonical reconstruction-based industrial anomaly task.
      benchmark_lineage: Direct MLPerf Tiny workload inheritance.
      classroom_value: Contrasts reconstruction scoring with supervised classification.
      systems_behavior: Compact dense inference plus feature and score postprocessing.
      reason_for_model: The autoencoder architecture is fixed upstream.
      reason_for_dataset: ToyADMOS is fixed upstream.
      reason_for_metric: ROC AUC and the threshold are fixed upstream.
      alternatives_rejected: Fashion-MNIST anomaly detection is not the MLPerf workload.
    laptop_evidence: The public EEMBC runner checkout does not contain the preprocessed accuracy inputs; rebuilding them requires the full ToyADMOS feature pipeline and is not a thin laptop adapter.
    implementation_state: removed-noncanonical-mnist-substitute
    deferral_reason: No authoritative directly fetchable laptop-scale PyTorch evaluation bundle currently preserves the MLPerf Tiny ToyADMOS contract.

  visual-wake-words:
    status: deferred
    upstream:
      authority: MLCommons MLPerf Tiny
      task: Person detection through visual wake words
      model: MobileNetV1
      dataset: Visual Wake Words derived from COCO
      split: MLPerf Tiny accuracy dataset and preprocessing
      evaluator: Top-1 binary classification accuracy
      quality_target: 0.80
      published_baseline: MLPerf Tiny reference quality contract
      provenance:
        - https://github.com/mlcommons/tiny/blob/master/benchmark/MLPerfTiny_Rules.adoc
    rationale:
      task_significance: Established always-on person-detection task for edge vision.
      benchmark_lineage: Direct MLPerf Tiny workload inheritance.
      classroom_value: Connects object annotations to a compact binary vision pipeline.
      systems_behavior: Mobile convolution, image preprocessing, and single-stream latency.
      reason_for_model: MobileNetV1 is fixed by the upstream MLPerf Tiny contract.
      reason_for_dataset: The Visual Wake Words COCO derivation is fixed upstream.
      reason_for_metric: Binary top-1 accuracy and the threshold are fixed upstream.
      alternatives_rejected: Synthetic deterministic images cannot support the upstream quality claim.
    laptop_evidence: The public EEMBC checkout supplies labels but not the 1,000 COCO-derived inputs; rebuilding them requires the large COCO source corpus and preprocessing pipeline.
    implementation_state: removed-synthetic-vww-substitute
    deferral_reason: The canonical accuracy bundle is not directly fetchable, and a reduced or synthetic dataset would change the benchmark.

  text-classification:
    status: candidate
    upstream:
      authority: Hugging Face DistilBERT reference checkpoint and GLUE
      task: Binary sentiment classification
      model: distilbert-base-uncased-finetuned-sst-2-english
      dataset: GLUE SST-2
      split: SST-2 validation split
      evaluator: Classification accuracy
      quality_target: 0.9105504587155964 GLUE SST-2 validation accuracy
      published_baseline: 0.9105504587155964 verified accuracy in the pinned Hugging Face model-index metadata
      provenance:
        - https://huggingface.co/distilbert/distilbert-base-uncased-finetuned-sst-2-english
    rationale:
      task_significance: Standard Transformer encoder classification task.
      benchmark_lineage: Published DistilBERT checkpoint evaluated on GLUE SST-2.
      classroom_value: Demonstrates tokenization, padding, attention, and fine-tuning.
      systems_behavior: Encoder attention, dynamic sequence lengths, and batch padding.
      reason_for_model: Official compact checkpoint has a published accuracy baseline.
      reason_for_dataset: SST-2 is the checkpoint's named evaluation task.
      reason_for_metric: Accuracy is the standard SST-2 metric.
      alternatives_rejected: A custom micro-BERT has no equivalent upstream quality contract.
    laptop_evidence: Exact checkpoint and SST-2 development split reproduce the pinned model-index's verified 91.055% accuracy exactly with fully verified provenance on Apple Silicon in 4.19 seconds and CPU in 36.92 seconds for five repetitions; committed five-run timing remains pending.
    implementation_state: exact-source-adapter-verified-promotion-pending

  graph-node-classification:
    status: candidate
    upstream:
      authority: Open Graph Benchmark
      task: Node classification
      model: Official OGB GCN baseline
      dataset: ogbn-arxiv
      split: Official time-based OGB split
      evaluator: OGB node-property evaluator accuracy
      quality_target: derive-only-from-reproduced-official-baseline
      published_baseline: Official OGB baseline and leaderboard
      provenance:
        - https://ogb.stanford.edu/docs/nodeprop/
        - https://ogb.stanford.edu/docs/leader_nodeprop/
        - https://github.com/snap-stanford/ogb
    rationale:
      task_significance: Recognized reproducible graph-learning benchmark.
      benchmark_lineage: OGB supplies data, split, evaluator, baseline, and leaderboard.
      classroom_value: Introduces message passing and graph-specific data representation.
      systems_behavior: Sparse gather, scatter, and irregular memory access.
      reason_for_model: GCN is the official interpretable baseline.
      reason_for_dataset: ogbn-arxiv is more system-relevant than tiny citation graphs.
      reason_for_metric: The OGB evaluator fixes the accuracy computation.
      alternatives_rejected: Cora is useful pedagogically but too small for stable systems measurement.
    laptop_evidence: Two complete 500-epoch runs of the official 110,120-parameter GCN recipe reached 72.232% and 71.998% test accuracy at the best validation epoch on Apple Silicon. Both satisfy the correct official ogbn-arxiv GCN reference of 71.74% with its published 0.29-point standard deviation. The earlier 72.51% target was traced to a different OGB leaderboard section and corrected; committed five-run evidence remains pending.
    implementation_state: exact-source-adapter-verified-promotion-pending

  causal-language-modeling:
    status: candidate
    upstream:
      authority: nanoGPT upstream repository
      task: Autoregressive language modeling
      model: nanoGPT Shakespeare character configuration
      dataset: Tiny Shakespeare
      split: Upstream prepare.py train and validation split
      evaluator: Validation cross-entropy loss
      quality_target: reproduce-upstream-1.4697-before-setting-tolerance
      published_baseline: 1.4697 best validation loss
      provenance:
        - https://github.com/karpathy/nanoGPT
    rationale:
      task_significance: Transparent end-to-end decoder-only Transformer workload.
      benchmark_lineage: Upstream publishes the configuration, runtime, and validation loss.
      classroom_value: Model and training loop are small enough to inspect completely.
      systems_behavior: Attention training, autoregressive inference, and KV-cache phases.
      reason_for_model: nanoGPT is an established educational reference with an exact recipe.
      reason_for_dataset: Tiny Shakespeare is the upstream quick-start dataset.
      reason_for_metric: Validation cross-entropy is emitted by the upstream training recipe.
      alternatives_rejected: Project-defined prompt quality is not a language-model quality contract.
    laptop_evidence: Exact upstream nanoGPT Shakespeare configuration reaches 1.46131 best validation loss on Apple Silicon in 1,604.77 seconds, exceeding the published 1.4697 target; committed five-run timing and inference-phase evidence remain pending.
    implementation_state: exact-source-training-adapter-verified-promotion-pending

  information-retrieval:
    status: candidate
    upstream:
      authority: Sentence Transformers
      task: Cross-encoder information-retrieval reranking
      model: cross-encoder/ms-marco-MiniLM-L6-v2
      dataset: NanoBEIR-en NanoMSMARCO, NanoNFCorpus, and NanoNQ
      split: Fifty queries and official BM25 top-100 candidates per dataset
      evaluator: CrossEncoderNanoBEIREvaluator
      quality_target: 0.60716840988382 mean nDCG@10
      published_baseline: Exact result in the Sentence Transformers evaluator documentation
      provenance:
        - https://www.sbert.net/docs/package_reference/sentence_transformer/evaluation.html
        - https://huggingface.co/cross-encoder/ms-marco-MiniLM-L6-v2
    rationale:
      task_significance: Retrieval is foundational to search and retrieval-augmented systems.
      benchmark_lineage: Sentence Transformers packages the datasets and evaluator.
      classroom_value: Demonstrates query-document pair construction, batched cross-encoder scoring, and ranking metrics.
      systems_behavior: Variable-length tokenization, encoder attention, batched pair scoring, and ranking.
      reason_for_model: The compact MiniLM cross-encoder and exact score are the official upstream evaluator example.
      reason_for_dataset: NanoBEIR was designed for rapid established retrieval evaluation, and the documented three-dataset subset is only 150 queries.
      reason_for_metric: The upstream evaluator fixes the retrieval metrics.
      alternatives_rejected: A custom RAG pipeline would require generator and judge design.
    laptop_evidence: Exact pinned model and twelve-file NanoBEIR bundle reproduce the documented 0.60716840988382 mean nDCG@10 with fully verified provenance on Apple Silicon in 18.10 seconds and CPU in 102.91 seconds; committed five-run timing remains pending.
    implementation_state: exact-source-adapter-verified-promotion-pending

  code-generation:
    status: deferred
    upstream:
      authority: Qwen and EvalPlus
      task: Python code generation
      model: Qwen/Qwen2.5-Coder-0.5B-Instruct
      dataset: HumanEval+
      split: Complete EvalPlus HumanEval+ release
      evaluator: EvalPlus pass@1 in its pinned Docker image
      quality_target: 0.573 HumanEval+ pass@1
      published_baseline: Qwen2.5-Coder technical report Table 16
      provenance:
        - https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct
        - https://github.com/evalplus/evalplus
    rationale:
      task_significance: Functional code generation is a recognized language-model task.
      benchmark_lineage: Official Qwen model plus established execution-based EvalPlus evaluation.
      classroom_value: Demonstrates decoding, functional correctness, and sandboxed evaluation.
      systems_behavior: Autoregressive generation with variable output length and isolated execution.
      reason_for_model: It is the smallest official Qwen2.5-Coder release.
      reason_for_dataset: HumanEval+ strengthens the established HumanEval contract.
      reason_for_metric: pass@1 measures functional correctness rather than text similarity.
      alternatives_rejected: Project-defined prompts and expected strings are not a code benchmark.
    laptop_evidence: The 0.5B model and 164-task generation pass fit laptop memory, but the authoritative evaluator executes untrusted generated Python and explicitly recommends its pinned Docker sandbox.
    implementation_state: deferred-until-sandbox-is-productized
    deferral_reason: Requiring Docker makes this a separate safe-execution product path rather than a thin PyTorch adapter; running EvalPlus unsandboxed would not meet the v0.1 out-of-the-box safety and robustness standard.

  recommendation:
    status: deferred
    upstream:
      authority: Meta DLRM reference implementation
      task: Click-through-rate prediction
      model: DLRM reference model
      dataset: Criteo Kaggle Display Advertising Challenge
      split: Upstream DLRM preprocessing and split
      evaluator: ROC AUC
      quality_target: derive-only-from-reproduced-upstream-recipe
      published_baseline: Upstream DLRM reference result
      provenance:
        - https://github.com/facebookresearch/dlrm
    rationale:
      task_significance: Recommendation accounts for a major sparse-ML systems workload class.
      benchmark_lineage: DLRM is the established precursor to MLPerf recommendation workloads.
      classroom_value: Contrasts embeddings and categorical features with dense networks.
      systems_behavior: Sparse embedding lookups, memory capacity, and dense-sparse interaction.
      reason_for_model: The Meta implementation is the canonical DLRM reference.
      reason_for_dataset: The Kaggle dataset is supported upstream and is smaller than Criteo Terabyte.
      reason_for_metric: ROC AUC is the established click-through-rate metric.
      alternatives_rejected: MovieLens micro-DLRM changes both task scale and upstream contract.
    laptop_evidence: The canonical Criteo Terabyte dataset and MLPerf DLRM training contract are not laptop-scale.
    implementation_state: removed-movielens-substitute
    deferral_reason: MovieLens is not a valid substitute for the MLPerf DLRM task, while the canonical Criteo contract exceeds the v0.1 single-laptop envelope.

  time-series-forecasting:
    status: candidate
    upstream:
      authority: PatchTST authors
      task: Long-horizon multivariate forecasting
      model: PatchTST
      dataset: ETTm1
      split: Official PatchTST ETT split and preprocessing
      evaluator: MSE and MAE
      quality_target: 0.29292929292929293 test MSE, derived as the published 0.290 reference divided by the MLPerf 99% quality fraction for a lower-is-better metric
      published_baseline: 0.290 MSE and 0.342 MAE in the PatchTST paper
      provenance:
        - https://github.com/yuqinie98/PatchTST
        - https://openreview.net/forum?id=Jbdc0vTOcol
        - https://github.com/mlcommons/inference_policies/blob/master/inference_rules.adoc
    rationale:
      task_significance: Forecasting is a recognized sequence-modeling domain.
      benchmark_lineage: The official implementation and paper publish ETT recipes and results.
      classroom_value: Introduces windowing, horizon selection, normalization, and regression metrics.
      systems_behavior: Long-window attention, patching, and multichannel input processing.
      reason_for_model: PatchTST is established and more system-relevant than a single linear layer.
      reason_for_dataset: ETTm1 is a standard dataset in the official evaluation.
      reason_for_metric: MSE and MAE are fixed by the upstream benchmark.
      alternatives_rejected: A custom micro-LSTM does not preserve a published forecasting contract.
    laptop_evidence: Two exact Apple Silicon reproductions produced 0.29168 and 0.29239 test MSE in 637.36 and 931.81 seconds. Both satisfy the direction-aware 99%-of-reference gate of 0.29292929292929293. Five-run promotion evidence remains pending.
    implementation_state: exact-source-adapter-quality-reproduced-five-run-evidence-pending

  unconditional-image-generation:
    status: deferred
    upstream:
      authority: Hugging Face Diffusers and Google checkpoint
      task: Unconditional image generation
      model: google/ddpm-cifar10-32
      dataset: CIFAR-10
      split: Upstream checkpoint and Diffusers evaluation protocol
      evaluator: FID and Inception Score
      quality_target: derive-only-from-reproduced-upstream-protocol
      published_baseline: DDPM CIFAR-10 reference quality
      provenance:
        - https://huggingface.co/google/ddpm-cifar10-32
        - https://huggingface.co/docs/diffusers/main/api/pipelines/ddpm
    rationale:
      task_significance: Diffusion is a major iterative generative-model workload class.
      benchmark_lineage: Official checkpoint and maintained Diffusers pipeline.
      classroom_value: Exposes iterative denoising and scheduler behavior.
      systems_behavior: Repeated UNet execution, scheduler overhead, and precision sensitivity.
      reason_for_model: The official 32-pixel checkpoint is small enough for local inference.
      reason_for_dataset: The checkpoint is trained and evaluated on CIFAR-10.
      reason_for_metric: FID and Inception Score are the upstream quantitative metrics.
      alternatives_rejected: A custom MNIST diffusion trainer has no comparable quality contract.
    laptop_evidence: The established CIFAR-10 diffusion quality contract requires a large generated sample set and FID evaluation that is not a short laptop benchmark.
    implementation_state: removed-synthetic-micro-diffusion
    deferral_reason: A reduced sample count or denoising-only metric would invent a different quality contract.

  function-calling:
    status: deferred
    upstream:
      authority: Berkeley Function Calling Leaderboard and MadeAgents
      task: Structured function calling
      model: MadeAgents/Hammer2.1-0.5b
      dataset: Pinned BFCL release
      split: Official BFCL evaluation categories
      evaluator: Official BFCL AST evaluator
      quality_target: 21.22 overall BFCL V4 score
      published_baseline: Official BFCL V4 Hammer2.1-0.5b leaderboard entry
      provenance:
        - https://gorilla.cs.berkeley.edu/leaderboard
        - https://huggingface.co/MadeAgents/Hammer2.1-0.5b
    rationale:
      task_significance: Structured tool selection is a bounded, recognized model task.
      benchmark_lineage: BFCL supplies data, evaluator, categories, and leaderboard.
      classroom_value: Demonstrates constrained structured generation and evaluator design.
      systems_behavior: Schema-heavy prefill and short structured decode.
      reason_for_model: Hammer2.1-0.5B is a published laptop-scale function-calling model.
      reason_for_dataset: BFCL is the model's established evaluation suite.
      reason_for_metric: The official AST evaluator avoids project-defined string matching.
      alternatives_rejected: Open-ended tool agents and custom prompts are unstable scaffolds.
    laptop_evidence: The model is laptop-scale, but its current BFCL V4 overall score is 21.22 with zero scores in several categories, below the credibility bar for a canonical v0.1 classroom baseline.
    implementation_state: deferred-low-quality-canonical-baseline
    deferral_reason: The off-the-shelf 0.5B tuple is technically runnable but does not provide a strong enough authoritative baseline; MLPerf EDU will not invent a reduced category set or custom evaluator to improve it.

  reinforcement-learning:
    status: deferred
    upstream:
      authority: Historical MLPerf Training
      task: Reinforcement learning through self-play
      model: MiniGo joint policy and value network
      dataset: Self-play games generated during the run
      split: Fixed target checkpoint evaluation
      evaluator: Win rate against the MLPerf target checkpoint
      quality_target: 0.50
      published_baseline: MLPerf Training MiniGo results through v2.1
      provenance:
        - https://mlcommons.org/benchmarks/training/
        - https://arxiv.org/abs/1910.01500
    rationale:
      task_significance: Canonical historical MLPerf reinforcement-learning workload.
      benchmark_lineage: Direct MLPerf Training lineage.
      classroom_value: Demonstrates self-play, search, dynamic data generation, and evaluation.
      systems_behavior: Repeated inference in tree search coupled to iterative training.
      reason_for_model: MiniGo is the MLPerf-selected RL reference.
      reason_for_dataset: Self-play is intrinsic to the canonical task.
      reason_for_metric: Checkpoint win rate is the upstream quality contract.
      alternatives_rejected: CartPole and Pendulum are substitutions without MLPerf lineage.
    laptop_evidence: Canonical run is not laptop-practical; no authoritative minified MiniGo exists.
    implementation_state: deferred-no-substitute

  end-to-end-rag:
    status: rejected
    reason: >-
      No single stable laptop-scale upstream tuple fixes retrieval, generation,
      prompting, and evaluation without introducing MLPerf EDU design choices.

  react-agent:
    status: rejected
    reason: >-
      ReAct is a prompting and orchestration method rather than a stable workload
      identity, and available environments require substantial scaffold choices.

  distributed-training:
    status: rejected
    reason: >-
      Distributed scaling claims are outside the v0.1 single-node product boundary.
