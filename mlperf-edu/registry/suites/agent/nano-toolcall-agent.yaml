id: nano-toolcall-agent
model: nano-toolcall-agent
params: 13.7M
dataset: react_traces
dataset_source: Structured multi-step reasoning traces; ReAct format
functional_check:
  metric: valid_call_rate
  condition: structured tool-call generation records valid-call rate and positive
    query throughput
  reference_runs: 5
  reviewer_notes:
  - This is a systems workload for structured-output and tool-dispatch overhead, not
    a public task-quality benchmark.
metrics:
- classification_latency_ms
- valid_call_rate
- queries_per_second
scenario: server
public:
  status: systems-only
  rationale: Exercises structured-output and tool-call dispatch behavior, but lacks
    a public quality target and remains a systems-only agent workload.
runner:
  min: mlperf.runners.agent:run_toolcall_min
  max: mlperf.runners.agent:run_toolcall_max
provenance: Schick et al. 2024 (Toolformer); measures structured output generation
regime:
  working_set:
    value: dram_bound
    peak_bytes_per_step: 60817408
    note: Bonus workload (not in core 16); structured output generation
  arithmetic_intensity:
    value: bandwidth_bound
    flops_per_byte: 0.7
    classification_rule: tool-call decode
  dispatch:
    value: dispatch_bound
    utilization: 0.1
