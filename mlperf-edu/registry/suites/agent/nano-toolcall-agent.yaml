id: nano-toolcall-agent
model: nano-toolcall-agent
params: 114,778
params_note: Exact trainable parameter count for the notebook-safe default max configuration.
dataset: synthetic-deterministic-agent-prompts
dataset_source: Project-generated seeded token tensors and deterministic in-process
  function definitions; no reasoning-trace dataset is consumed
functional_check:
  metric: valid_call_rate
  target: 1.0
  direction: higher
  condition: every requested query completes, every generated call validates and
    dispatches, and query throughput is positive
  reviewer_notes:
  - This is a systems workload for structured-output and tool-dispatch overhead, not
    a public task-quality benchmark.
metrics:
- total_generation_ms
- total_classification_ms
- total_dispatch_ms
- total_latency_ms
- valid_call_rate
- queries_per_second
scenario: single_stream
public:
  status: systems-only
  rationale: Exercises one synchronous structured-output and in-process tool-dispatch
    loop on seeded synthetic tokens. The functional gate is not a task-quality score.
runner:
  min: mlperf.runners.agent:run_toolcall_min
  max: mlperf.runners.agent:run_toolcall_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: false
  functional_check_enforced: true
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  model_config:
    vocab_size: 512
    d_model: 48
    n_heads: 4
    n_layers: 2
    max_seq_len: 128
    n_functions: 10
  run_config:
    n_queries: 8
    batch_size: 1
    seq_len: 32
  note: The default max runner executes a notebook-safe structured-call loop on deterministic
    random tensors and local mock functions. It does not consume ReAct traces or make
    a public task-quality claim.
provenance: Schick et al. 2024 (Toolformer); measures structured output generation
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
