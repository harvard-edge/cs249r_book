id: nano-toolcall-agent
model: nano-toolcall-agent
params: 13.7M
dataset: react_traces
dataset_source: Structured multi-step reasoning traces; ReAct format
functional_check:
  metric: valid_call_rate
  condition: structured tool-call generation records valid-call rate and positive
    query throughput
  reference_runs: 5
  reviewer_notes:
  - This is a systems workload for structured-output and tool-dispatch overhead, not
    a public task-quality benchmark.
metrics:
- classification_latency_ms
- valid_call_rate
- queries_per_second
scenario: server
public:
  status: systems-only
  rationale: Exercises structured-output and tool-call dispatch behavior, but lacks
    a public quality target and remains a systems-only agent workload.
runner:
  min: mlperf.runners.agent:run_toolcall_min
  max: mlperf.runners.agent:run_toolcall_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner scales deterministic local tool-dispatch and response
    handling. It does not consume the declared ReAct traces or make a public task-quality
    claim.
provenance: Schick et al. 2024 (Toolformer); measures structured output generation
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
