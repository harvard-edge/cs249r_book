id: nano-rag-agent
model: nano-rag-agent
params: 20.1M
dataset: react_traces
dataset_source: Structured multi-step reasoning traces; ReAct format
quality_target:
  metric: retrieval_accuracy
  value: 0.8
metrics:
- retrieve_latency_ms
- generate_latency_ms
- queries_per_second
scenario: server
public:
  status: systems-only
  rationale: Captures RAG orchestration and retrieval/generation bottlenecks with
    local traces, but not yet an endorsed answer-quality benchmark.
runner:
  min: mlperf.runners.agent:run_rag_min
  max: mlperf.runners.agent:run_rag_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner scales the local retrieval systems loop on deterministic
    random tensors. It does not consume the declared ReAct traces or enforce retrieval
    quality.
provenance: Lewis et al. 2020 (RAG); measures retrieval vs generation bottleneck
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
