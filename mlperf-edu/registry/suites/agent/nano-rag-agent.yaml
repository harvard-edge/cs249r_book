id: nano-rag-agent
model: nano-rag-agent
params: 20.1M
dataset: react_traces
dataset_source: Structured multi-step reasoning traces; ReAct format
quality_target:
  metric: retrieval_accuracy
  value: 0.8
metrics:
- retrieve_latency_ms
- generate_latency_ms
- queries_per_second
scenario: server
public:
  status: systems-only
  rationale: Captures RAG orchestration and retrieval/generation bottlenecks with
    local traces, but not yet an endorsed answer-quality benchmark.
runner:
  min: mlperf.runners.agent:run_rag_min
  max: mlperf.runners.agent:run_rag_max
provenance: Lewis et al. 2020 (RAG); measures retrieval vs generation bottleneck
regime:
  working_set:
    value: dram_bound
    peak_bytes_per_step: 88080384
    note: 'Generation phase: 20M-param decode (~80 MB activations + weights re-read)
      + retrieval index lookup.'
  arithmetic_intensity:
    value: bandwidth_bound
    flops_per_byte: 0.7
    classification_rule: generation is decode (bw-bound); retrieval is index gather
  dispatch:
    value: dispatch_bound
    utilization: 0.1
    observation_source: 'composite workload: decode + retrieval, both small-kernel'
