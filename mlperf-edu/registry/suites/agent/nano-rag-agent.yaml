id: nano-rag-agent
model: nano-rag-agent
params: 138,864
params_note: Exact trainable parameter count for the notebook-safe default max configuration.
dataset: synthetic-deterministic-agent-prompts
dataset_source: Project-generated seeded token tensors and an in-memory random passage
  bank; no external corpus or reasoning-trace dataset is consumed
quality_target:
  metric: retrieval_accuracy
  value: 0.8
metrics:
- retrieve_latency_ms
- generate_latency_ms
- queries_per_second
scenario: single_stream
public:
  status: systems-only
  rationale: Measures one synchronous encode, brute-force retrieval, and generation
    loop on seeded synthetic tokens. It is not a retrieval- or answer-quality benchmark.
runner:
  min: mlperf.runners.agent:run_rag_min
  max: mlperf.runners.agent:run_rag_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  model_config:
    vocab_size: 512
    d_model: 48
    n_heads: 4
    n_layers: 2
    max_seq_len: 128
    n_passages: 128
    top_k: 4
  run_config:
    batch_size: 1
    seq_len: 32
  note: The default max runner executes a notebook-safe retrieval systems loop on
    deterministic random tensors and an in-memory passage bank. It does not consume
    an external corpus or enforce retrieval quality.
provenance: Lewis et al. 2020 (RAG); measures retrieval vs generation bottleneck
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
