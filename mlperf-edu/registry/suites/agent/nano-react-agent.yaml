id: nano-react-agent
model: nano-react-agent
params: 13.7M
dataset: react_traces
dataset_source: Structured multi-step reasoning traces; ReAct format
quality_target:
  metric: trace_accuracy
  value: 0.6
metrics:
- steps_to_answer
- reasoning_latency_per_step_ms
- tool_dispatch_latency_ms
scenario: server
public:
  status: systems-only
  rationale: Measures multi-step agent/tool orchestration overhead with ReAct traces;
    kept research-facing until trace-quality scoring is standardized.
runner:
  min: mlperf.runners.agent:run_react_min
  max: mlperf.runners.agent:run_react_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner scales the local reasoning systems loop on deterministic
    random tensors. It does not consume the declared ReAct traces or enforce trace
    completion quality.
provenance: Yao et al. 2023 (ReAct); measures multi-step reasoning + tool use
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
