id: nano-react-agent
model: nano-react-agent
params: 115,972
params_note: Exact trainable parameter count for the notebook-safe default max configuration.
dataset: synthetic-deterministic-agent-prompts
dataset_source: Project-generated seeded token tensors; no local or external ReAct
  trace dataset is consumed
quality_target:
  metric: trace_accuracy
  value: 0.6
metrics:
- steps
- total_reasoning_ms
- total_tool_ms
- total_latency_ms
- final_context_length
- final_memory_bytes
scenario: single_stream
public:
  status: systems-only
  rationale: Measures a synchronous reasoning-and-tool orchestration loop on seeded
    synthetic tokens. It does not score ReAct trace completion or answer quality.
runner:
  min: mlperf.runners.agent:run_react_min
  max: mlperf.runners.agent:run_react_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  model_config:
    vocab_size: 512
    d_model: 48
    n_heads: 4
    n_layers: 2
    max_seq_len: 192
    n_tools: 4
  run_config:
    steps: 4
    batch_size: 1
    seq_len: 32
  note: The default max runner executes a notebook-safe reasoning loop on deterministic
    random tensors and deterministic in-process tools. It does not consume ReAct traces
    or enforce trace-completion quality.
provenance: Yao et al. 2023 (ReAct); measures multi-step reasoning + tool use
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
