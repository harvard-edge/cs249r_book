id: nano-react-agent
model: nano-react-agent
params: 13.7M
dataset: react_traces
dataset_source: Structured multi-step reasoning traces; ReAct format
quality_target:
  metric: trace_accuracy
  value: 0.6
metrics:
- steps_to_answer
- reasoning_latency_per_step_ms
- tool_dispatch_latency_ms
scenario: server
public:
  status: systems-only
  rationale: Measures multi-step agent/tool orchestration overhead with ReAct traces;
    kept research-facing until trace-quality scoring is standardized.
runner:
  min: mlperf.runners.agent:run_react_min
  max: mlperf.runners.agent:run_react_max
provenance: Yao et al. 2023 (ReAct); measures multi-step reasoning + tool use
regime:
  working_set:
    value: dram_bound
    peak_bytes_per_step: 60817408
    note: 13.7M-param multi-step reasoning; iter-2 found this still uses non-KV-cache
      forward — current 58 MB number assumes the (broken) recompute path; will shrink
      once iter-7 lands KV-cache.
  arithmetic_intensity:
    value: bandwidth_bound
    flops_per_byte: 0.7
    classification_rule: ReAct decode loop
  dispatch:
    value: dispatch_bound
    utilization: 0.1
    note: To be patched in iter-7 to use KV-cache path; regime values may shift
