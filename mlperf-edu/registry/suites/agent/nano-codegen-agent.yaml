id: nano-codegen-agent
model: nano-codegen-agent
params: 13.7M
dataset: mbpp
dataset_source: Austin et al. 2021 (MBPP); 20 curated Python problems with unit tests
quality_target:
  metric: pass_at_1
  value: 0.15
metrics:
- iterations_to_correct
- tokens_per_attempt
- context_growth_factor
scenario: server
public:
  status: systems-only
  rationale: Standardizes iterative code-generation systems behavior on a small MBPP
    slice, but pass@1 is not yet calibrated for public scoring.
runner:
  min: mlperf.runners.agent:run_codegen_min
  max: mlperf.runners.agent:run_codegen_max
provenance: Chen et al. 2021 (Codex); measures iterative retry cost
regime:
  working_set:
    value: dram_bound
    peak_bytes_per_step: 60817408
    note: 13.7M-param iterative regeneration; per-step working set ~55 MB exceeds
      4*LLC.
  arithmetic_intensity:
    value: bandwidth_bound
    flops_per_byte: 0.7
    classification_rule: iterative decode loop
  dispatch:
    value: dispatch_bound
    utilization: 0.1
