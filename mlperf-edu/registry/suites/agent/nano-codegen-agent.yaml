id: nano-codegen-agent
model: nano-codegen-agent
params: 13.7M
dataset: mbpp
dataset_source: Austin et al. 2021 (MBPP); 20 curated Python problems with unit tests
quality_target:
  metric: pass_at_1
  value: 0.15
metrics:
- iterations_to_correct
- tokens_per_attempt
- context_growth_factor
scenario: server
public:
  status: systems-only
  rationale: Standardizes iterative code-generation systems behavior on a small MBPP
    slice, but pass@1 is not yet calibrated for public scoring.
runner:
  min: mlperf.runners.agent:run_codegen_min
  max: mlperf.runners.agent:run_codegen_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner scales the local code-generation systems loop on
    deterministic random tensors. It does not consume MBPP or enforce pass@1.
provenance: Chen et al. 2021 (Codex); measures iterative retry cost
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
