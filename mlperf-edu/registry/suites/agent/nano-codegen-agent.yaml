id: nano-codegen-agent
model: nano-codegen-agent
params: 115,776
params_note: Exact trainable parameter count for the notebook-safe default max configuration.
dataset: synthetic-deterministic-agent-prompts
dataset_source: Project-generated seeded token tensors; MBPP tasks and tests are not
  consumed by the default runner
quality_target:
  metric: pass_at_1
  value: 0.15
metrics:
- iterations
- total_tokens_generated
- total_latency_ms
- tokens_per_second
- context_growth_factor
scenario: single_stream
public:
  status: systems-only
  rationale: Measures a synchronous generate-and-retry systems loop on seeded synthetic
    tokens. It does not execute MBPP or establish code-correctness quality.
runner:
  min: mlperf.runners.agent:run_codegen_min
  max: mlperf.runners.agent:run_codegen_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  model_config:
    vocab_size: 512
    d_model: 48
    n_heads: 4
    n_layers: 2
    max_seq_len: 192
  run_config:
    retries: 4
    batch_size: 1
    seq_len: 32
  note: The default max runner executes a notebook-safe retry loop on deterministic
    random tensors. It does not consume MBPP, run MBPP tests, or enforce pass@1.
provenance: Chen et al. 2021 (Codex); measures iterative retry cost
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
