id: micro-gnn-train
model: micro-gnn
params: 5.6K
dataset: cora
dataset_source: Sen et al. (2008), Cora citation network (2708 nodes, 7 classes, 5429
  edges); auto-download; synthetic fallback available for offline use
quality_target:
  metric: test_accuracy
  value: 0.78
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  train_loss: 0.35
  val_accuracy: 0.816
  test_accuracy: 0.816
  epochs: 50
  time_seconds: 2
  note: 81.6% matches Kipf & Welling (2017) published result on Cora
scenario: single_stream
public:
  status: systems-only
  rationale: Useful for sparse graph-kernel and dispatch studies; kept out of score-bearing
    status until the download/fallback path and quality target are hardened.
runner:
  min: mlperf.runners.extended:run_micro_gnn_min
  max: mlperf.runners.extended:run_micro_gnn_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner measures graph-convolution execution on a deterministic
    ring graph. It does not consume Cora or enforce the candidate accuracy target.
provenance: Kipf & Welling 2017 (GCN); maps to MLPerf Training GNN
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
