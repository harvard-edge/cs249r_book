id: graph-node-classification
model: ogb-gcn
params: 110K
dataset: ogbn-arxiv
dataset_source: Official OGB ogbn-arxiv v1 archive and time-based split
task: graph-node-classification
modes:
- training
implemented_modes:
- training
quality_target:
  metric: test_accuracy
  value: 0.7174
  direction: higher
  target_basis: literature
  target_kind: published_mean_with_tolerance
  tolerance: 0.0029
  reference_runs: 0
  acceptance_runs: 1
  reviewer_notes:
  - The target and tolerance are the official OGB ogbn-arxiv leaderboard GCN mean and standard deviation for the 110,120-parameter implementation.
  - The previously recorded 72.51 +/- 0.35 percent result belongs to a different leaderboard section and is not the ogbn-arxiv GCN reference.
  - MLPerf EDU reports test accuracy at the epoch with the highest official validation accuracy, matching the OGB logger.
  - Seed-sensitive verdict, retained deliberately. Measured across seeds 42, 1, and 7 the test accuracy spans 0.7115 to 0.7210, wider than the 0.0065 margin from the recorded result to the 0.7145 tolerance floor, so seed 1 misses while 42 and 7 pass. A local miss is within the expected spread and is not a setup error. This workload is the suite's clearest demonstration that one run is not a claim: rerun it with MLPERF_EDU_SEED changed and watch the verdict move.
measurement_protocol:
  primary_metric: train_and_eval_seconds
  scenario: training
  timing_scope: 500 full-batch training epochs with official train, validation, and test evaluation after every epoch
  included_phases:
  - full-graph forward and backward passes
  - optimizer steps
  - official split evaluation
  excluded_phases:
  - dataset fetching and PyG processing
  - graph symmetrization and device transfer
  - model construction
  - checkpoint serialization
  - report and provenance serialization
  device_synchronization: synchronize immediately before and after the measured training-and-evaluation region
  outer_reference_runs: 1
  outer_preconditioning_runs: 0
  outer_inter_execution_cooldown_seconds: 30
  repeatability_metric: train_and_eval_seconds
  repeatability_limit: 0.05
