quality_target:
  metric: mean_ndcg_at_10
  value: 0.60716840988382
  direction: higher
  target_basis: literature
  target_kind: published_reference_reproduction
  tolerance: 0.0
  reference_runs: 0
  acceptance_runs: 1
  reviewer_notes:
  - The target is the exact three-dataset mean nDCG@10 published in the Sentence Transformers CrossEncoderNanoBEIREvaluator documentation for this model and configuration.
  - The upstream example also publishes mean MAP 0.5531 and mean MRR@10 0.6401 as secondary metrics.
  - Promotion requires exact local reproduction and committed repeated timing.
measurement_protocol:
  primary_metric: inference_and_evaluation_seconds
  scenario: offline
  timing_scope: one complete cross-encoder scoring and official reranking evaluation for 50 queries and 100 candidate documents in each of three NanoBEIR datasets
  included_phases:
  - tokenization of query-document pairs
  - batched PyTorch cross-encoder execution
  - score sorting and MAP, MRR@10, and nDCG@10 computation
  excluded_phases:
  - dataset and model fetching
  - Parquet loading and sample construction
  - model construction and one untimed warmup for each scoring batch shape
  - report and provenance serialization
  device_synchronization: synchronize immediately before and after the measured complete inference-and-evaluation pass
  outer_reference_runs: 1
  outer_preconditioning_runs: 0
  outer_inter_execution_cooldown_seconds: 300
  repeatability_metric: inference_and_evaluation_seconds
  repeatability_limit: 0.05
