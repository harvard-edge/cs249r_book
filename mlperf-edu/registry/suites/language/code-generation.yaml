id: code-generation
model: Qwen/Qwen2.5-Coder-0.5B-Instruct
params: 0.49B
dataset: humaneval-plus
dataset_source: Complete EvalPlus HumanEval+ release
model_source:
  type: huggingface-pinned
  repo_id: Qwen/Qwen2.5-Coder-0.5B-Instruct
  revision: ea3f2471cf1b1f0db85067f1ef93848e38e88c25
  license: apache-2.0
  allow_patterns:
  - '*.json'
  - '*.safetensors'
  - tokenizer.*
  selection_rationale: Smallest official Qwen2.5-Coder instruction checkpoint with a published HumanEval+ result.
  size_rationale: The 0.49-billion-parameter model fits laptop-class unified memory.
  backend_rationale: The pinned Transformers checkpoint supports CPU, CUDA, and Apple MPS execution.
task: code-generation
modes:
- inference
implemented_modes:
- inference
promotion_scope: false
spiral:
  stage: functional
  functional_ready: true
  quality_conformant: false
  repeatability_verified: false
  promotion_ready: false
  next_gate: Complete one authoritative 164-task run and review the measured quality gap against the 94-pass target.
quality_target:
  metric: humaneval_plus_pass_at_1
  value: 0.573
  direction: higher
  target_basis: literature
  tolerance: 0.0
  reference_runs: 0
  acceptance_runs: 1
  reviewer_notes:
  - The target is the Qwen2.5-Coder technical report HumanEval+ pass@1 result.
  - The pinned EvalPlus v0.1.10 reference self-check passes 163 of 164 canonical solutions; HumanEval/32 is the single known upstream exception and remains in the denominator for published-score comparability.
  - The functional spiral does not claim to reproduce this target.
measurement_protocol:
  primary_metric: generation_seconds
  scenario: offline
  timing_scope: Complete HumanEval+ greedy generation after the pinned model and prompts are resident
  outer_reference_runs: 5
  outer_preconditioning_runs: 0
  outer_inter_execution_cooldown_seconds: 30
  repeatability_metric: generation_seconds
  repeatability_limit: 0.05
canonical_max_contract:
  result_role: score-bearing
  mode: inference
  model_id: Qwen/Qwen2.5-Coder-0.5B-Instruct
  model_revision: ea3f2471cf1b1f0db85067f1ef93848e38e88c25
  dataset: humaneval-plus
  dataset_revision: evalplus-0.1.10
  evaluator_repository: https://github.com/evalplus/evalplus
  evaluator_revision: 899b2b31bbe8d6e12337b865a8aa03fcd57c1121
  generation_recipe_repository: https://github.com/QwenLM/Qwen2.5-Coder
  generation_recipe_revision: dc5af295350a48a4dd04625d3b8f348dc3c4f218
  data_mode: real
  execution_status: pending-quality-conformance
  config:
    decoding: greedy
    prompt_format: qwen2.5-coder-official-chatml
    samples_per_task: 1
    max_new_tokens: 2048
    stop_strings:
    - <|endoftext|>
    - <|endofmask|>
    - </s>
    - "\nif __name__"
    - "\ndef main("
    - "\nprint("
    - "\n#"
    - "\n```"
    execution_dtype: float32
    attention_implementation: eager
    evaluation_tasks: 164
    minimum_passing_tasks: 94
    execution: sandboxed-evalplus
    evaluator_reference_self_check: 163-of-164-with-HumanEval-32-exception
  functional_probe:
    functional_probe_generated_tokens: 16
  quality:
    metric: humaneval_plus_pass_at_1
    metric_key: humaneval_plus_pass_at_1
    target: 0.573
    direction: higher
scenario: offline
public:
  status: experimental
  rationale: The max CLI now binds the official Qwen prompt recipe, complete HumanEval+ release, pinned model, and sandboxed EvalPlus evaluator. A complete local quality result remains the next gate.
runner:
  min: mlperf.runners.functional_setup:run_code_generation_min
  max: mlperf.runners.code_generation:run_code_generation_max
provenance:
  authority: Qwen and EvalPlus
  model: https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct
  evaluator: https://github.com/evalplus/evalplus
  adaptation: The max runner preserves Qwen's prompt and stop rules, uses pinned Transformers for laptop inference, and evaluates generated code only in a locked-down container built from the pinned EvalPlus source.
regime:
  working_set:
    value: unmeasured
    note: Classification awaits the authoritative model execution.
  arithmetic_intensity:
    value: unmeasured
    note: Classification awaits the authoritative model execution.
  dispatch:
    value: unmeasured
    note: Classification awaits a synchronized utilization trace.
