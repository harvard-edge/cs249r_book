id: nanogpt-decode-fp32-b16
suite: language
model: nanogpt-small-86m
params: 88.3M
dataset: prompt-suite-local
dataset_source: Deterministic local token prompts embedded in the runner; no external
  evaluation dataset required.
default_prefill_ctx: 1024
default_decode_steps: 8
default_batch_size: 16
functional_check:
  metric: output_tokens_per_sec
  condition: fp32 decode completes the configured steps and records positive output
    throughput
  reference_runs: 5
  reviewer_notes:
  - This variant is for dtype, memory-bandwidth, and dispatch studies; task quality
    is inherited from the canonical inference workload.
scenario: server
public:
  status: systems-only
  rationale: Provides an fp32, batch-16 decode scaffold for architecture experiments.
    Random weights make it ineligible for quality or public performance claims.
runner:
  min: mlperf.runners.extended:run_nanogpt_decode_fp32_min
  max: mlperf.runners.extended:run_nanogpt_decode_fp32_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  note: The current max runner measures FP32 KV-cache mechanics on a tiny random-init
    NanoGPT model and deterministic local token prompts. It does not make a trained-model
    quality claim.
provenance: GPT-2-Small geometry decoded at fp32 with random weights. This row tests
  execution and instrumentation only; no measured taxonomy classification is claimed.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
