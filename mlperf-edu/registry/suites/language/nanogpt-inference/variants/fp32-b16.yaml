id: nanogpt-decode-fp32-b16
suite: language
model: NanoGPTWhiteBox(vocab=256, width=64, heads=4, layers=2) fp32 batch-16
params: 124672
dataset: prompt-suite-local
dataset_source: Deterministic local token prompts embedded in the runner; no external
  evaluation dataset required.
default_prefill_ctx: 32
default_decode_steps: 8
default_batch_size: 16
functional_check:
  metric: output_tokens_per_sec
  condition: three deterministic batch-16 requests each complete eight decode steps,
    emit every token, and record positive fp32 output throughput
  reviewer_notes:
  - This random-weight systems variant has no task-quality or checkpoint-inheritance claim.
scenario: single_stream
public:
  status: systems-only
  rationale: Provides repeated synchronous fp32 batch-16 decode for architecture and
    dtype experiments. Random weights make it ineligible for task-quality or public
    performance claims.
runner:
  min: mlperf.runners.extended:run_nanogpt_decode_fp32_min
  max: mlperf.runners.extended:run_nanogpt_decode_fp32_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  config:
    vocab_size: 256
    n_embd: 64
    n_head: 4
    n_layer: 2
    max_seq_len: 128
    batch_size: 16
    prefill_ctx: 32
    decode_steps: 8
    measured_requests: 3
    dtype: fp32
  note: The current max runner measures three synchronous FP32 batch-16 requests on
    a 124672-parameter random-init NanoGPT model and deterministic local token prompts.
    It makes no trained-model quality claim.
provenance: Local 124672-parameter NanoGPTWhiteBox decoded at fp32 with random weights.
  This row tests execution and instrumentation only; no speedup, quality, or measured
  taxonomy classification is claimed.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
