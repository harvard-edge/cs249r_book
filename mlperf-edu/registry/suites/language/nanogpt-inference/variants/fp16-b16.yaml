id: nanogpt-decode-fp16-b16
suite: language
model: nanogpt-small-86m
shared_checkpoint: nanogpt-small-train
params: 88.3M
dataset: prompt-suite-local
dataset_source: Deterministic local token prompts embedded in the runner; no external
  evaluation dataset required.
dtype: float16
default_prefill_ctx: 1024
default_decode_steps: 8
default_batch_size: 16
functional_check:
  metric: output_tokens_per_sec
  condition: fp16 decode completes the configured steps and records positive output
    throughput
  reference_runs: 5
  reviewer_notes:
  - This variant is for dtype, memory-footprint, and backend studies; task quality
    is inherited from the canonical inference workload.
scenario: server
public:
  status: systems-only
  rationale: Characterizes fp16 LLM serving behavior and memory footprint with a controlled
    scaffold; reports systems evidence rather than model quality.
runner:
  min: mlperf.runners.extended:run_nanogpt_decode_fp16_min
  max: mlperf.runners.extended:run_nanogpt_decode_fp16_max
provenance: 'Iter-6 (Han): GPT-2-Small at fp16, the production default for LLM serving.
  Demonstrates the 1.2-1.5x speedup that fp16 buys on MPS without custom kernels.
  Working set halves vs fp32.'
