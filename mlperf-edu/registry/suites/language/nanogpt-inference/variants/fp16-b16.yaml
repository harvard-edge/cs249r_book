id: nanogpt-decode-fp16-b16
suite: language
model: nanogpt-small-86m
params: 88.3M
dataset: prompt-suite-local
dataset_source: Deterministic local token prompts embedded in the runner; no external
  evaluation dataset required.
dtype: float16
default_prefill_ctx: 1024
default_decode_steps: 8
default_batch_size: 16
functional_check:
  metric: output_tokens_per_sec
  condition: fp16 decode completes the configured steps and records positive output
    throughput
  reference_runs: 5
  reviewer_notes:
  - This variant is for dtype, memory-footprint, and backend studies; task quality
    is inherited from the canonical inference workload.
scenario: server
public:
  status: systems-only
  rationale: Characterizes fp16 LLM serving behavior and memory footprint with a controlled
    scaffold; reports systems evidence rather than model quality.
runner:
  min: mlperf.runners.extended:run_nanogpt_decode_fp16_min
  max: mlperf.runners.extended:run_nanogpt_decode_fp16_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  note: The current max runner measures FP16 KV-cache mechanics on a tiny random-init
    NanoGPT model and deterministic local token prompts. It does not make a trained-model
    quality claim.
provenance: GPT-2-Small geometry decoded at fp16 with random weights. This row supports
  controlled dtype experiments but makes no unverified speedup or taxonomy claim.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
