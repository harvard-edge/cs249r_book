id: nanogpt-prefill
suite: language
model: nanogpt-12m
shared_checkpoint: nanogpt-train
quality_dependency: nanogpt-train
params: 11.5M
dataset: prompt-suite-local
dataset_source: Deterministic local token prompts embedded in the runner; no external
  evaluation dataset required.
default_context_len: 1792
functional_check:
  metric: prefill_tokens_per_sec
  condition: a checkpoint-backed prefill run completes with a quality-approved NanoGPT
    training report, matching checkpoint SHA-256 provenance, and positive measured
    throughput
  reviewer_notes:
  - Quality is inherited from the nanogpt-train checkpoint; this workload reports
    serving prefill performance.
  - Review artifacts must retain the training report, training provenance manifest,
    checkpoint, checkpoint digest, per-run latency samples, and inference provenance
    manifest together.
performance_reference_protocol:
  profile: max
  reference_runs: 5
  backend: PyTorch CPU or accelerator path recorded with the complete execution and
    hardware fingerprint
  machine_class: laptop-class CPU or laptop-class accelerator
  dataset_mode: checkpoint-backed fixed-shape prompt batch using a quality-approved
    NanoGPT training checkpoint
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  aggregation: median prefill_tokens_per_sec across five independent seeded runs
  repeatability_metric: sample coefficient of variation of prefill_tokens_per_sec
    across the five reference runs
  repeatability_limit: 0.05
  repeatability_action: withhold the performance reference and rerun the complete
    protocol when the coefficient of variation exceeds 5%
  functional_acceptance: every run must pass the checkpoint, provenance, and positive-throughput
    functional gate
  artifact_policy: create a new immutable attempt directory and SHA-256 index every
    report, provenance manifest, checkpoint, export, and runner-declared artifact
  rerun_policy: if any run fails or times out, create a new attempt and rerun all
    five seeds; never replace one seed in an existing attempt
measurement_protocol:
  primary_metric: prefill_tokens_per_sec
  warmup_runs: 3
  measured_runs: 10
  latency_statistics:
  - median
  - p90
  - p99
  raw_sample_metric: prefill_latency_samples_s
  timing_scope: synchronized checkpoint-backed forward passes over one fixed-shape
    prompt batch
checkpoint_contract:
  source_workload: nanogpt-train
  digest: sha256
  required_artifacts:
  - training report
  - training provenance manifest
  - checkpoint
  - inference report
  - inference provenance manifest
