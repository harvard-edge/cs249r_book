id: nanogpt-decode-spec
suite: language
model: NanoGPTWhiteBox speculative pair (target width=64 layers=2; draft width=32
  layers=1)
params: 149728
target_params: 124672
draft_params: 25056
dataset: prompt-suite-local
dataset_source: Deterministic local token prompts embedded in the runner; no external
  evaluation dataset required.
gamma: 4
default_prefill_ctx: 32
default_decode_tokens: 8
functional_check:
  metric: acceptance_rate
  condition: two deterministic batch-4 requests each emit eight tokens, use at least
    one verification cycle, record positive throughput, and keep acceptance rate in [0, 1]
  reviewer_notes:
  - This random-weight systems variant has no task-quality or checkpoint-inheritance claim.
scenario: single_stream
public:
  status: systems-only
  rationale: Teaches speculative decoding mechanics and acceptance-rate tradeoffs,
    but uses a scaffolded target/draft pair rather than a canonical trained model.
runner:
  min: mlperf.runners.extended:run_nanogpt_decode_spec_min
  max: mlperf.runners.extended:run_nanogpt_decode_spec_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  config:
    vocab_size: 256
    target_n_embd: 64
    target_n_layer: 2
    draft_n_embd: 32
    draft_n_layer: 1
    n_head: 4
    max_seq_len: 128
    batch_size: 4
    prefill_ctx: 32
    decode_tokens: 8
    gamma: 4
    measured_requests: 2
    dtype: float32
  note: The current max runner measures two synchronous batch-4 speculative requests
    with a 124672-parameter target and 25056-parameter draft on deterministic prompts.
    It makes no trained-model acceptance-quality claim.
provenance: Speculative decoding scaffold with a 25056-parameter draft, a 124672-parameter
  target, gamma 4, and argmax verification. Random initialization makes this an
  execution lesson rather than a performance baseline.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
