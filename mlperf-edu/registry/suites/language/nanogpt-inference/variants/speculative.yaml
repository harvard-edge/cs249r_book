id: nanogpt-decode-spec
suite: language
model: nanogpt-small-86m
params: 88.3M
draft_params: 11.1M
dataset: prompt-suite-local
dataset_source: Deterministic local token prompts embedded in the runner; no external
  evaluation dataset required.
gamma: 4
default_prefill_ctx: 1024
default_decode_tokens: 16
functional_check:
  metric: acceptance_rate
  condition: speculative decode emits the configured tokens and records acceptance
    rate, cycles, and output throughput
  reference_runs: 5
  reviewer_notes:
  - This is a test-time-compute workload for draft-target verification behavior; task
    quality requires trained draft and target checkpoints.
scenario: server
public:
  status: systems-only
  rationale: Teaches speculative decoding mechanics and acceptance-rate tradeoffs,
    but uses a scaffolded target/draft pair rather than a canonical trained model.
runner:
  min: mlperf.runners.extended:run_nanogpt_decode_spec_min
  max: mlperf.runners.extended:run_nanogpt_decode_spec_max
provenance: 'Iter-6 (Han): speculative decoding with 11M draft + 88M target, gamma=4,
  lossless argmax verify. Pedagogical demonstration that speculation only helps when
  draft and target agree often (random-init scaffold here gets 0% acceptance and is
  therefore SLOWER than baseline -- the lesson is that the draft must be trained to
  mimic the target distribution).'
