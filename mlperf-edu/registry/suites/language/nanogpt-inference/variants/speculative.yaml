id: nanogpt-decode-spec
suite: language
model: nanogpt-small-86m
params: 88.3M
draft_params: 11.1M
dataset: prompt-suite-local
dataset_source: Deterministic local token prompts embedded in the runner; no external
  evaluation dataset required.
gamma: 4
default_prefill_ctx: 1024
default_decode_tokens: 16
functional_check:
  metric: acceptance_rate
  condition: speculative decode emits the configured tokens and records acceptance
    rate, cycles, and output throughput
  reference_runs: 5
  reviewer_notes:
  - This is a test-time-compute workload for draft-target verification behavior; task
    quality requires trained draft and target checkpoints.
scenario: server
public:
  status: systems-only
  rationale: Teaches speculative decoding mechanics and acceptance-rate tradeoffs,
    but uses a scaffolded target/draft pair rather than a canonical trained model.
runner:
  min: mlperf.runners.extended:run_nanogpt_decode_spec_min
  max: mlperf.runners.extended:run_nanogpt_decode_spec_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  note: The current max runner measures speculative-decode control flow with tiny
    random-init target and draft models on deterministic local prompts. It does not
    claim trained-model acceptance quality.
provenance: Speculative decoding scaffold with an 11M-parameter draft, an 88M-parameter
  target, gamma 4, and lossless argmax verification. Random initialization makes
  this an execution lesson rather than a performance baseline.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
