id: nanogpt-decode
suite: language
model: nanogpt-12m
default_variant: true
shared_checkpoint: nanogpt-train
quality_dependency: nanogpt-train
params: 11.5M
dataset: prompt-suite-local
dataset_source: Deterministic local token prompts embedded in the runner; no external
  evaluation dataset required.
default_prefill_ctx: 1792
default_decode_steps: 64
kv_bytes_per_token: 18432
functional_check:
  metric: decode_steps
  condition: a checkpoint-backed decode run completes 64 configured steps with a
    quality-approved NanoGPT training report, matching checkpoint SHA-256 provenance,
    and positive measured output throughput
  reviewer_notes:
  - Quality is inherited from the nanogpt-train checkpoint; this workload reports
    decode latency, KV-cache behavior, and throughput.
  - Review artifacts must retain request-level TTFT and per-token ITL samples together
    with the training and inference provenance chain.
performance_reference_protocol:
  profile: max
  reference_runs: 5
  backend: PyTorch CPU or accelerator path recorded with the complete execution and
    hardware fingerprint
  machine_class: laptop-class CPU or laptop-class accelerator
  dataset_mode: checkpoint-backed requests using a quality-approved NanoGPT training
    checkpoint
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  aggregation: median output_tokens_per_sec across five independent seeded runs
  repeatability_metric: sample coefficient of variation of output_tokens_per_sec
    across the five reference runs
  repeatability_limit: 0.05
  repeatability_action: withhold the performance reference and rerun the complete
    protocol when the coefficient of variation exceeds 5%
  functional_acceptance: every run must complete all configured decode steps and
    pass checkpoint, provenance, and positive-throughput gates
  artifact_policy: create a new immutable attempt directory and SHA-256 index every
    report, provenance manifest, checkpoint, export, and runner-declared artifact
  rerun_policy: if any run fails or times out, create a new attempt and rerun all
    five seeds; never replace one seed in an existing attempt
measurement_protocol:
  primary_metric: output_tokens_per_sec
  warmup_runs: 3
  measured_runs: 20
  decode_steps_per_request: 64
  latency_statistics:
  - median
  - p90
  - p99
  raw_sample_metrics:
  - request-level TTFT
  - per-token ITL
  timing_scope: synchronized checkpoint-backed requests with a separate untimed warmup
    request
checkpoint_contract:
  source_workload: nanogpt-train
  digest: sha256
  required_artifacts:
  - training report
  - training provenance manifest
  - checkpoint
  - inference report
  - inference provenance manifest
