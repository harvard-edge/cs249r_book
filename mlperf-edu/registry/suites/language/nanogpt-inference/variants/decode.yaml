id: nanogpt-decode
suite: language
model: nanogpt-12m
default_variant: true
shared_checkpoint: nanogpt-train
quality_dependency: nanogpt-train
params: 11.5M
dataset: prompt-suite-local
dataset_source: Deterministic local token prompts embedded in the runner; no external
  evaluation dataset required.
default_prefill_ctx: 1792
default_decode_steps: 64
kv_bytes_per_token: 18432
functional_check:
  metric: decode_steps
  condition: checkpoint-backed decode completes the configured number of steps and
    records positive output throughput
  reference_runs: 5
  reviewer_notes:
  - Quality is inherited from the nanogpt-train checkpoint; this workload reports
    decode latency, KV-cache behavior, and throughput.
scenario: server
public:
  status: performance-bearing
  rationale: Uses the standardized NanoGPT checkpoint path to measure autoregressive
    decode throughput, latency, and KV-cache behavior with a functional check.
runner:
  min: mlperf.runners.nanogpt:run_decode_min
  max: mlperf.runners.nanogpt:run_decode_max
provenance: GPT-2 autoregressive decode; the regime that dominates LLM serving cost
  in production (vLLM, TensorRT-LLM, TGI all built around this)
regime:
  working_set:
    value: unmeasured
    peak_bytes_per_step: 34603008
    note: 32 MB KV cache stream per step lands in the 6-48 MB grey band. Empirically
      the achieved BW (4 GB/s vs 68 GB/s peak) suggests DRAM streaming dominates,
      but per-step working set technically classifies as ambiguous on this axis. Real
      bottleneck is on Axis C.
  arithmetic_intensity:
    value: bandwidth_bound
    flops_per_byte: 0.5
    classification_rule: intensity 0.50 vs [low 13.71, high 54.84]; util 0.018 vs
      [dispatch 0.25, sat 0.5]
    evidence_sidecar: roofline/nanogpt-decode_2026-04-16T21-09-50Z_f5f554162523.json
    evidence_sha256_short: 038cbc9c6448
    measured_at: 2026-04-16T21-09-50Z
    platform_machine_class: apple-silicon
  dispatch:
    value: dispatch_bound
    utilization: 0.0175
    achieved_bw_gbps: 9.248
    observation_source: iter-3 smoke_nanogpt_phases.py on M-series MPS; the canonical
      dispatch_bound case
    classification_rule: intensity 0.50 vs [low 13.71, high 54.84]; util 0.018 vs
      [dispatch 0.25, sat 0.5]
    evidence_sidecar: roofline/nanogpt-decode_2026-04-16T21-09-50Z_f5f554162523.json
    evidence_sha256_short: 038cbc9c6448
    measured_at: 2026-04-16T21-09-50Z
    platform_machine_class: apple-silicon
