id: nanogpt-train
model: nanogpt-12m
params: 11.1M
params_note: Char-level vocab=128 (TinyShakespeare uses 65 unique chars). Earlier
  README/paper figures of 85.9M and 124.4M reflected a vocab=50,257 BPE config that
  was never reachable from the char-level data; iteration 1 reconciled the model to
  its actual effective size.
dataset: tinyshakespeare
dataset_source: Project Gutenberg eBook 100, generated MLPerf EDU tiny Shakespeare
  excerpt, character-level, 1.1MB
quality_target:
  metric: cross_entropy_loss
  value: 2.3
  direction: lower
  target_basis: reference_runs
  tolerance: 0.0
  reference_runs: 5
  variance_summary:
    runs: 5
    statistic: median
    acceptance_rule: median validation loss must be <= target
    spread_note: Reference runs were stable enough for classroom use; fresh cleaned-model
      provenance remains a release follow-up.
  reference_protocol:
    profile: max
    backend: pytorch-cpu reference path unless the report declares a different backend
    machine_class: laptop-class CPU or laptop-class accelerator with full hardware
      fingerprint
    dataset_mode: fetched Project Gutenberg Shakespeare source with deterministic
      TinyShakespeare excerpt recipe, fixed tokenizer, split, and seed; no synthetic
      fallback
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    aggregation: median validation loss across five independent reference runs
    artifact_policy: preserve JSON, HTML, CSV, .provd.json, run fingerprint, dataset
      asset metadata, and raw metric values for each run
    rerun_policy: rerun all five references when model code, dataset preprocessing,
      optimizer schedule, PyTorch major version, or target hardware class changes
  reviewer_notes:
  - Baseline satisfies the target through val_loss; cleaned 11M model still needs
    fresh reference-run provenance before release.
verified_baseline:
  train_loss: 1.958
  val_loss: 2.045
  epochs: 25
  time_seconds: 86.4
  baseline_note: Single-seed Apple MPS default run on the Project Gutenberg generated
    tiny excerpt; target remains provisional until the five-seed reference sweep.
scenario: single_stream
public:
  status: score-bearing
  rationale: Uses a deterministic TinyShakespeare excerpt generated from Project Gutenberg
    with an explicit cross-entropy target, making it suitable for classroom training
    correctness and public performance reporting.
runner:
  min: mlperf.runners.nanogpt:run_min
  max: mlperf.runners.nanogpt:run_max
provenance: Vaswani et al. 2017 (Transformer); maps to MLPerf Training GPT-3/LLaMA
regime:
  working_set:
    value: unmeasured
    peak_bytes_per_step: 67108864
    note: Per-layer activation peak ~12 MB at B=16 T=64; weights ~46 MB streamed once
      per epoch. Falls in the 6-48 MB grey band; exact classification depends on batch
      and depends on caching behavior — measure with cache-miss counters.
  arithmetic_intensity:
    value: compute_bound
    flops_per_byte: 121.747
    classification_rule: intensity 121.75 vs [low 13.71, high 54.84]; util 0.222 vs
      [dispatch 0.25, sat 0.5]
    evidence_sidecar: roofline/nanogpt-train_2026-04-16T21-02-31Z_17c2a18fb5ec.json
    evidence_sha256_short: 2be2e6231554
    measured_at: 2026-04-16T21-02-31Z
    platform_machine_class: apple-silicon
  dispatch:
    value: dispatch_bound
    note: Training-loop dispatch needs a roofline-emitter run; logged for iter 5.
    utilization: 0.2225
    achieved_bw_gbps: 26.419
    classification_rule: intensity 121.75 vs [low 13.71, high 54.84]; util 0.222 vs
