id: nano-moe-train
model: NanoMoEWhiteBox(vocab=256, width=64, heads=4, layers=2, experts=8,
  top_k=2)
params: 608384
dataset: tinyshakespeare
dataset_source: Project Gutenberg eBook 100, generated MLPerf EDU tiny Shakespeare
  excerpt, character-level, 1.1MB
quality_target:
  metric: cross_entropy_loss
  value: 0.05
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  protocol_compatibility: superseded
  replacement_required: true
  train_loss: 0.042
  val_loss: 0.042
  epochs: 25
  time_seconds: 158
  note: This former real-data observation used a different model and training protocol;
    it is not evidence for the current systems-only max path.
functional_check:
  metric: parameter_delta_l2
  condition: three deterministic MoE optimizer steps complete with finite losses,
    nonzero parameter updates, and positive token throughput
  reviewer_notes:
  - This systems check uses synthetic tokens and does not evaluate TinyShakespeare loss.
scenario: training
public:
  status: systems-only
  rationale: Exercises multi-step MoE routing and conditional-compute training on
    deterministic synthetic tokens. TinyShakespeare and its candidate loss target are
    not used by the current max path.
runner:
  min: mlperf.runners.extended:run_nano_moe_min
  max: mlperf.runners.extended:run_nano_moe_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  config:
    vocab_size: 256
    d_model: 64
    n_heads: 4
    n_layers: 2
    num_experts: 8
    top_k: 2
    batch_size: 4
    seq_len: 32
    train_steps: 3
    lr: 0.001
  note: The current max runner performs three optimizer steps with a 608384-parameter
    sparse MoE on deterministic tokens. It does not consume TinyShakespeare or enforce
    the candidate loss target.
provenance: Shazeer et al. 2017 (MoE); 8 experts, top-2 routing
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
