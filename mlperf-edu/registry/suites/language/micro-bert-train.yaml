id: micro-bert-train
model: MicroBERT(vocab=512, width=64, heads=4, layers=2)
params: 139202
dataset: sst2
dataset_source: Socher et al. (2013), Stanford Sentiment Treebank binary, 67K train
  / 872 val; ships in data/sst2/
quality_target:
  metric: val_accuracy
  value: 0.78
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  train_loss: 0.15
  val_accuracy: 0.77
  epochs: 15
  time_seconds: 45
  note: Character-level tokenization; 77% on real SST-2 with 0.5M-param model
functional_check:
  metric: parameter_delta_l2
  condition: four deterministic optimizer steps complete with finite losses, nonzero
    parameter updates, and one binary-classification logit pair per sample
  reviewer_notes:
  - This systems check does not evaluate SST-2 validation accuracy.
scenario: training
public:
  status: systems-only
  rationale: Provides a bounded multi-step bidirectional-transformer training workload
    on deterministic token tensors. SST-2 and its candidate target are not used by the
    current max path.
runner:
  min: mlperf.runners.extended:run_micro_bert_min
  max: mlperf.runners.extended:run_micro_bert_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  config:
    vocab_size: 512
    d_model: 64
    n_heads: 4
    n_layers: 2
    batch_size: 8
    seq_len: 32
    train_steps: 4
    lr: 0.001
  note: The current max runner performs four optimizer steps on a 139202-parameter
    MicroBERT and deterministic token tensors. It does not consume SST-2 or enforce
    the candidate validation-accuracy target.
provenance: Devlin et al. 2019 (BERT); bidirectional transformer for NLU
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
