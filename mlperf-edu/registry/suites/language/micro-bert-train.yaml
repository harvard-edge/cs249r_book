id: micro-bert-train
model: micro-bert
params: 432K
dataset: sst2
dataset_source: Socher et al. (2013), Stanford Sentiment Treebank binary, 67K train
  / 872 val; ships in data/sst2/
quality_target:
  metric: val_accuracy
  value: 0.78
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  train_loss: 0.15
  val_accuracy: 0.77
  epochs: 15
  time_seconds: 45
  note: Character-level tokenization; 77% on real SST-2 with 0.5M-param model
scenario: single_stream
public:
  status: systems-only
  rationale: Provides a small NLU transformer systems workload, but the baseline sits
    below the stated quality target and needs tuning before score promotion.
runner:
  min: mlperf.runners.extended:run_micro_bert_min
  max: mlperf.runners.extended:run_micro_bert_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner measures bidirectional-transformer execution on
    deterministic token tensors. It does not consume SST-2 or enforce the candidate
    validation-accuracy target.
provenance: Devlin et al. 2019 (BERT); bidirectional transformer for NLU
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
