id: nano-lora-finetune
model: nanogpt-small-86m + LoRA(rank=8, alpha=16, target=c_attn)
base_params: 88.3M
trainable_params: 294912
trainable_ratio_pct: 0.334
functional_check:
  metric: base_grad_norm
  condition: frozen base parameters keep zero gradient while LoRA adapter gradients
    are nonzero
  reference_runs: 5
  reviewer_notes:
  - This is a systems workload for PEFT overhead and memory studies, not a task-accuracy
    benchmark.
scenario: training
public:
  status: systems-only
  rationale: Measures PEFT systems cost with frozen-base checks; task data and accuracy
    are synthetic scaffold elements, so it is not score-bearing.
runner:
  min: mlperf.runners.extended:run_nano_lora_min
  max: mlperf.runners.extended:run_nano_lora_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner measures adapter injection, frozen-base gradients,
    and optimizer plumbing on deterministic tokens. It has no task dataset or
    task-quality claim.
provenance: 'Iter-7 (Han): LoRA fine-tuning workload demonstrating PEFT. Random-init
  backbone (random training data) — measures the SYSTEMS cost of LoRA, not task accuracy.
  Base parameters genuinely frozen (smoke verifies base_grad_norm == 0).'
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
