id: nano-lora-finetune
model: NanoGPTWhiteBox(vocab=256, width=64, heads=4, layers=2) + LoRA(rank=8,
  alpha=16, target=c_attn)
params: 124672
base_params: 120576
trainable_params: 4096
trainable_ratio_pct: 3.2854209445585214
functional_check:
  metric: base_grad_norm
  condition: three deterministic optimizer steps keep every base gradient and base
    parameter delta at zero, produce nonzero LoRA gradients, and update the adapter
    parameters
  reviewer_notes:
  - This is a systems workload for PEFT overhead and memory studies, not a task-accuracy
    benchmark.
scenario: training
public:
  status: systems-only
  rationale: Measures PEFT systems cost with frozen-base checks; task data and accuracy
    are synthetic scaffold elements, so it is not score-bearing.
runner:
  min: mlperf.runners.extended:run_nano_lora_min
  max: mlperf.runners.extended:run_nano_lora_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  config:
    vocab_size: 256
    n_embd: 64
    n_head: 4
    n_layer: 2
    max_seq_len: 64
    batch_size: 4
    seq_len: 32
    rank: 8
    alpha: 16
    target_module: c_attn
    train_steps: 3
    lr: 0.001
  note: The current max runner performs three adapter-only optimizer steps with
    two LoRA modules and 4096 trainable parameters on deterministic tokens. It has
    no task dataset or task-quality claim.
provenance: Local NanoGPTWhiteBox LoRA systems workload with a 120576-parameter
  random-init base and two rank-8 c_attn adapters. It measures adapter training
  mechanics, not task accuracy.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
