id: micro-dlrm-train
model: micro-dlrm-1m
params: 23K
dataset: movielens-100k
dataset_source: Harper & Konstan (2015), MovieLens-100K, 100K ratings from 943 users
  × 1682 movies; ships in data/movielens/
quality_target:
  metric: accuracy
  value: 0.7
  direction: higher
  target_basis: reference_runs
  tolerance: 0.0
  reference_runs: 5
  variance_summary:
    runs: 5
    statistic: median
    acceptance_rule: median best validation accuracy must be >= target
    spread_note: MovieLens split is fixed; seeds 0-4 reached best_accuracy in
      [0.7019, 0.7094] after the text-occupation encoding fix.
  reference_protocol:
    profile: max
    backend: pytorch-cpu reference path unless the report declares a different backend
    machine_class: laptop-class CPU or laptop-class accelerator with full hardware
      fingerprint
    dataset_mode: fetched MovieLens-100K with fixed split, preprocessing, and seed;
      no synthetic fallback
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    aggregation: median best validation accuracy across five independent reference
      runs
    artifact_policy: preserve JSON, HTML, CSV, .provd.json, run fingerprint, dataset
      asset metadata, and raw metric values for each run
    rerun_policy: rerun all five references when model code, dataset preprocessing,
      optimizer schedule, PyTorch major version, or target hardware class changes
  reviewer_notes:
  - MovieLens best-validation baseline satisfies the public target across seeds
    0-4; keep dataset/source provenance tied to fetchable MovieLens-100K.
verified_baseline:
  train_loss: 0.535
  val_loss: 0.573
  accuracy: 0.705
  five_seed_best_accuracy_median: 0.704
  five_seed_best_accuracy_min: 0.702
  five_seed_best_accuracy_max: 0.709
  epochs: 21
  time_seconds: 3
  note: 23K params; embedding tables hold 21,168 fp32 values, about 83 KiB,
    and remain cache-resident on laptop CPUs
scenario: server
public:
  status: score-bearing
  rationale: Uses MovieLens-100K with an explicit accuracy target and a small DLRM
    shape aligned with the MLPerf recommendation workload family.
runner:
  min: mlperf.runners.dlrm:run_min
  max: mlperf.runners.dlrm:run_max
provenance: Naumov et al. 2019 (DLRM); maps to MLPerf Training DLRM
regime:
  working_set:
    value: cache_resident
    peak_bytes_per_step: 84672
    note: 943x8 + 1682x8 + 21x8 = 21,168 fp32 embedding values, about
      83 KiB, so the embedding tables are cache-resident at MLPerf EDU scale.
  arithmetic_intensity:
    value: compute_bound
