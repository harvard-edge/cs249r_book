quality_target:
  metric: roc_auc
  value: 0.76
  direction: higher
  target_basis: reference_runs
  tolerance: 0.0
  reference_runs: 5
  variance_summary:
    runs: 5
    statistic: median
    acceptance_rule: median fixed-final-epoch evaluation ROC AUC must be >= target
    metric: roc_auc
    median: 0.7677678928436241
    min: 0.7671171627454848
    max: 0.7696129592578403
    mean: 0.7680442529571658
    sample_stdev: 0.0009575452177736948
    spread_note: Five calibrated seeds on the official u1.base/u1.test split produced fixed-final-epoch
      evaluation ROC AUC from 0.7671172 to 0.7696130 without label-derived aggregate features.
      Every seed passed the 0.76 target; promotion requires a fresh canonical reference sweep.
  reference_protocol:
    profile: max
    backend: pytorch-cpu reference path unless the report declares a different backend
    machine_class: laptop-class CPU or laptop-class accelerator with full hardware fingerprint
    dataset_mode: fetched MovieLens-100K with the official u1.base training and u1.test validation
      split, demographics and item-genre features only, and no synthetic fallback
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    aggregation: median fixed-final-epoch evaluation ROC AUC across five independent reference
      runs
    repeatability_metric: sample coefficient of variation of train_and_eval_seconds across
      the five reference runs
    repeatability_limit: 0.05
    repeatability_action: withhold the performance reference and rerun the complete protocol
      when the coefficient of variation exceeds 5%
    artifact_policy: preserve JSON, HTML, CSV, .provd.json, run fingerprint, dataset asset
      metadata, and raw metric values for each run
    rerun_policy: rerun all five references when model code, dataset preprocessing, optimizer
      schedule, PyTorch major version, or target hardware class changes
  reviewer_notes:
  - ROC AUC is evaluated once on the untouched official u1.test split after a fixed 21-epoch
    schedule. Evaluation labels do not select a checkpoint, and training seeds do not alter
    split membership. The feature recipe excludes rating-derived user or item aggregates.
measurement_protocol:
  primary_metric: train_and_eval_seconds
  scenario: training
  timing_scope: fixed canonical training loop plus scheduled validation
  included_phases:
  - optimizer steps
  - scheduled validation
  - learning-rate scheduler steps when configured
  excluded_phases:
  - dataset or asset fetching
  - model construction
  - checkpoint serialization
  - report and provenance serialization
  device_synchronization: synchronize immediately before and after the measured train-and-evaluation
    region
  outer_reference_runs: 5
