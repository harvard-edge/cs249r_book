id: micro-dlrm-dram-train
model: micro-dlrm-dram-1m
params: 512M
trainable_params: 23K
virtual_table_bytes: 2147483648
llc_capacity_factor: 170
dataset: movielens-100k
dataset_source: Harper & Konstan (2015) — same dataset as micro-dlrm-train
quality_target:
  metric: accuracy
  value: 0.65
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  baseline_note: Awaiting first verification run on iter-2 harness.
scenario: server
public:
  status: systems-only
  rationale: Exercises a large virtual embedding table for recommender architecture
    studies, but its memory regime and accuracy baseline lack committed evidence.
runner:
  min: mlperf.runners.dlrm:run_dram_min
  max: mlperf.runners.dlrm:run_dram_max
max_execution:
  data_mode: real
  quality_target_enforced: true
  fetched_assets_used: true
  declared_dataset_used: true
  scope: systems-only
  note: The current max runner uses MovieLens-100K and enforces its local accuracy
    target, but remains systems-only because the row isolates DRAM-heavy embedding
    behavior rather than a reviewed public result contract.
provenance: Naumov et al. 2019 (DLRM) and Weinberger et al. 2009 (hashing trick);
  uses hashed embedding lookups at laptop scale
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
