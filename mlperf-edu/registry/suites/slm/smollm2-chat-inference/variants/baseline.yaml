id: slm-decode
suite: slm
model: SmolLM2-135M-Instruct
default_variant: true
params: 135M
model_source:
  type: huggingface
  default_model_id: HuggingFaceTB/SmolLM2-135M-Instruct
  revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
  default_alias: smollm2-135m
  license: Apache-2.0
  aliases:
    smollm2-135m: HuggingFaceTB/SmolLM2-135M-Instruct
    qwen2.5-0.5b: Qwen/Qwen2.5-0.5B-Instruct
    qwen3-0.6b: Qwen/Qwen3-0.6B
  selection_rationale: SmolLM2-135M-Instruct is the default because it is Apache-2.0,
    public on Hugging Face, small enough for laptop CPU/MPS setup runs, and large
    enough to exercise Transformer decode, KV-cache, quantization, batching, and long-context
    behavior.
  size_rationale: 135M parameters keeps default downloads and local inference practical
    for coursework while still creating measurable memory, prefill, and decode behavior
    for systems studies.
  backend_rationale: The Transformers/PyTorch path works across CPU, MPS, and CUDA
    and avoids vendor-specific runtimes in the default path; optional backends can
    be compared as variants later.
  alias_rationales:
    smollm2-135m: Default local SLM for quick, permissive, laptop-friendly serving
      experiments.
    qwen2.5-0.5b: Larger permissive Qwen-family option for model-family sensitivity studies that
      allow a larger download.
    qwen3-0.6b: Newer compact Qwen-family option for optional model-family comparisons;
      its larger download keeps it out of the default laptop setup.
dataset: prompt-suite-local
dataset_source: Deterministic local prompts embedded in the runner; no external evaluation
  dataset required.
quality_target:
  metric: generated_tokens
  value: 8
functional_check:
  metric: generated_tokens
  condition: default max run requests 16 decode tokens; generated_tokens must be
    >= 8 and continuation perplexity must be <= 10 on the bundled deterministic
    quality suite
  reviewer_notes:
  - The pinned model must pass both output-length and continuation-perplexity gates
    before latency, throughput, memory, or energy results are eligible for review.
performance_reference_protocol:
  profile: max
  reference_runs: 5
  backend: Transformers and PyTorch CPU or accelerator path recorded with the complete
    execution and hardware fingerprint
  machine_class: laptop-class CPU or laptop-class accelerator
  dataset_mode: local-prompt inference with the pinned model revision and bundled
    deterministic quality suite
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  aggregation: median output_tokens_per_sec across five independent seeded runs
  repeatability_metric: sample coefficient of variation of output_tokens_per_sec
    across the five reference runs
  repeatability_limit: 0.05
  repeatability_action: withhold the performance reference and rerun the complete
    protocol when the coefficient of variation exceeds 5%
  functional_acceptance: every run must generate at least eight tokens and pass
    continuation perplexity at or below 10
  artifact_policy: create a new immutable attempt directory and SHA-256 index every
    report, provenance manifest, model metadata file, export, and runner-declared artifact
  rerun_policy: if any run fails or times out, create a new attempt and rerun all
    five seeds; never replace one seed in an existing attempt
quality_evaluation:
  suite: mlperf-edu-slm-quality/0.1
  asset: src/mlperf_edu/slm_quality_prompts.json
  asset_sha256: 5fa25872d0b7dc986b12137256b16fd6329267d1640f03e4e04f1dc4e8c8ed5f
  cases: 4
  method: mean continuation-only negative log likelihood over the deterministic suite
  metric: continuation_perplexity
  maximum: 10.0
measurement_protocol:
  primary_metric: output_tokens_per_sec
  warmup_runs: 3
  measured_runs: 20
  latency_statistics:
  - median
  - p90
  - p99
  timed_phases:
  - prefill
  - greedy generation
  timing_scope: synchronized timings over one fixed prompt and 16 requested decode
    tokens
