id: slm-decode
suite: slm
model: SmolLM2-135M-Instruct
default_variant: true
params: 135M
model_source:
  type: huggingface
  default_model_id: HuggingFaceTB/SmolLM2-135M-Instruct
  revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
  default_alias: smollm2-135m
  license: Apache-2.0
  aliases:
    smollm2-135m: HuggingFaceTB/SmolLM2-135M-Instruct
    qwen2.5-0.5b: Qwen/Qwen2.5-0.5B-Instruct
    qwen3-0.6b: Qwen/Qwen3-0.6B
  selection_rationale: SmolLM2-135M-Instruct is the default because it is Apache-2.0, public
    on Hugging Face, small enough for laptop CPU/MPS setup runs, and large enough to exercise
    Transformer decode, KV-cache, quantization, batching, and long-context behavior.
  size_rationale: 135M parameters keeps default downloads and local inference practical for
    coursework while still creating measurable memory, prefill, and decode behavior for systems
    studies.
  backend_rationale: The Transformers/PyTorch path works across CPU, MPS, and CUDA and avoids
    vendor-specific runtimes in the default path; optional backends can be compared as variants
    later.
  alias_rationales:
    smollm2-135m: Default local SLM for quick, permissive, laptop-friendly serving experiments.
    qwen2.5-0.5b: Larger permissive Qwen-family option for model-family sensitivity studies
      that allow a larger download.
    qwen3-0.6b: Newer compact Qwen-family option for optional model-family comparisons; its
      larger download keeps it out of the default laptop setup.
dataset: prompt-suite-local
dataset_source: Project-authored, CC0-1.0 continuation cases bundled with the runner; no external
  evaluation dataset is copied or fetched.
quality_target:
  metric: generated_tokens
  value: 8
functional_check:
  metric: generated_tokens
  condition: default max run requests 16 decode tokens; generated_tokens must be >= 8 and
    token-weighted continuation perplexity must be <= 7 overall and <= 24 in the weakest category
    on the bundled deterministic quality suite
  reviewer_notes:
  - The pinned model must pass both output-length and continuation-perplexity gates before
    latency, throughput, memory, or energy results are eligible for review.
performance_reference_protocol:
  profile: max
  reference_runs: 5
  backend: Transformers and PyTorch CPU or accelerator path recorded with the complete execution
    and hardware fingerprint
  machine_class: laptop-class CPU or laptop-class accelerator
  dataset_mode: local-prompt inference with the pinned model revision and bundled deterministic
    quality suite
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  aggregation: median output_tokens_per_sec across five independent seeded runs
  repeatability_metric: sample coefficient of variation of output_tokens_per_sec across the
    five reference runs
  repeatability_limit: 0.05
  repeatability_action: withhold the performance reference and rerun the complete protocol
    when the coefficient of variation exceeds 5%
  functional_acceptance: every run must generate at least eight tokens, pass token-weighted
    continuation perplexity at or below 7, and keep every category at or below 24 perplexity
  artifact_policy: create a new immutable attempt directory and SHA-256 index every report,
    provenance manifest, model metadata file, export, and runner-declared artifact
  rerun_policy: if any run fails or times out, create a new attempt and rerun all five seeds;
    never replace one seed in an existing attempt
quality_evaluation:
  suite: mlperf-edu-slm-quality/0.2
  fixture_version: 2.0.0
  asset: src/mlperf_edu/slm_quality_prompts.json
  asset_sha256: 3d6d06b99dd92f1cf86fcde10f77b4db060397003bf654cc52c3148087ede556
  attribution: MLPerf EDU contributors; project-authored fixture released as CC0-1.0
  cases: 28
  categories: 7
  aggregation: token-weighted-continuation-nll
  category_guard: maximum-category-perplexity
  method: teacher-forced continuation-only negative log likelihood; prompt and continuation
    tokens are encoded separately, prompt prefill creates one KV cache, every subsequent continuation
    token reuses that cache, and token losses are weighted by continuation-token count globally
    and within each category; every case ID, category, and continuation-token count is bound
    by the versioned fixture
  metric: continuation_perplexity
  maximum: 7.0
  worst_category_maximum: 24.0
  calibration:
    model_id: HuggingFaceTB/SmolLM2-135M-Instruct
    model_revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
    device: mps
    observed_perplexity: 5.227185511982561
    observed_worst_category: benchmarking
    observed_worst_category_perplexity: 18.94030982965928
    observed_continuation_tokens: 75
    evaluation_seconds: 2.3826990419765934
    threshold_rationale: The overall and weakest-category ceilings leave 34% and 27% perplexity
      headroom, respectively, for backend numeric variation while remaining tight enough to
      reject material degradation. This bounded run calibrates the protocol but is not a promoted
      reference packet.
measurement_protocol:
  primary_metric: output_tokens_per_sec
  warmup_runs: 3
  measured_runs: 20
  latency_statistics:
  - median
  - p90
  - p99
  timed_phases:
  - prefill
  - greedy generation
  raw_sample_metrics:
  - prefill_latency_samples_s
  - request_ttft_samples_s
  - itl_samples_s
  - request_end_to_end_samples_s
  timing_scope: one cache-reusing greedy request path per fixed prompt batch; TTFT spans prompt
    prefill through the first output token, ITL samples time only subsequent cached-token
    steps, and end-to-end latency spans the complete request
canonical_max_contract:
  model_id: HuggingFaceTB/SmolLM2-135M-Instruct
  model_revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
  model_n_params: 134515008
  dataset: prompt-suite-local
  data_mode: local-prompt
  config:
    requested_decode_tokens: 16
    target_generated_tokens: 8
    max_context_tokens: 64
    prompt_mode: single
    prompt_sha256: a311e5d2df67ef404950dd76a31424f32e685f475f95da502224ea9933c79125
    batch_size: 1
    quantization: null
    tiny_local: false
  quality:
    metric: generated_tokens
    metric_key: generated_tokens
    target: 8
    direction: higher
  quality_evaluation:
    suite: mlperf-edu-slm-quality/0.2
    fixture_version: 2.0.0
    suite_sha256: sha256:3d6d06b99dd92f1cf86fcde10f77b4db060397003bf654cc52c3148087ede556
    cases: 28
    categories: 7
    aggregation: token-weighted-continuation-nll
    category_guard: maximum-category-perplexity
    gates:
      overall_perplexity:
        metric_key: perplexity
        target: 7.0
        direction: lower
      worst_category_perplexity:
        metric_key: worst_category_perplexity
        target: 24.0
        direction: lower
    max_quantized_nll_delta: 0.1
  timing_sample_counts:
    prefill_latency_samples_s: 20
    request_ttft_samples_s: 20
    itl_samples_s: 300
    request_end_to_end_samples_s: 20
