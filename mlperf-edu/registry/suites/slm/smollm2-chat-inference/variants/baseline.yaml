  - 73.66910712629223
  - 78.26006664912396
  output_tokens_per_second_median: 74.040410374211
  output_tokens_per_second_min: 73.66910712629223
  output_tokens_per_second_max: 87.1195555372376
  output_tokens_per_second_stdev: 5.767155639346823
  wall_seconds_median: 4.034003582899459
  wall_seconds_min: 4.009392875013873
  wall_seconds_max: 4.6925652080681175
  functional_passes: 5
  generated_tokens: 16
  quality_perplexity: 7.600481673911702
  quality_mean_nll: 2.028211623430252
  baseline_note: Five independent development executions of the pinned revision;
    each execution used one warmup and five measured requests and passed the output-length
    and continuation-perplexity gates. This content-addressed local summary is not
    a review baseline until a clean-commit public-candidate packet is retained.
scenario: single_stream
public:
  status: performance-bearing
  rationale: Uses an off-the-shelf permissive SLM with a deterministic prompt set;
    reports comparable serving performance with a functional generation check rather
    than task accuracy.
runner:
  min: mlperf.runners.slm:run_decode_min
  max: mlperf.runners.slm:run_decode_max
provenance: Off-the-shelf small language model decode path for local serving, quantization,
  LoRA, KV-cache, and backend comparison studies.
regime:
