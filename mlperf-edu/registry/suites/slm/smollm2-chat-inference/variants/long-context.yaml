id: slm-long-context-decode
suite: slm
model: SmolLM2-135M-Instruct long-context
params: 135M
default_context_tokens: 512
model_source:
  type: huggingface
  default_model_id: HuggingFaceTB/SmolLM2-135M-Instruct
  default_alias: smollm2-135m
  license: Apache-2.0
  aliases:
    smollm2-135m: HuggingFaceTB/SmolLM2-135M-Instruct
    qwen2.5-0.5b: Qwen/Qwen2.5-0.5B-Instruct
    qwen3-0.6b: Qwen/Qwen3-0.6B
  selection_rationale: SmolLM2-135M-Instruct is the default because it is Apache-2.0,
    public on Hugging Face, small enough for laptop CPU/MPS setup runs, and large
    enough to exercise Transformer decode, KV-cache, quantization, batching, and long-context
    behavior.
  size_rationale: 135M parameters keeps default downloads and local inference practical
    for coursework while still creating measurable memory, prefill, and decode behavior
    for systems studies.
  backend_rationale: The Transformers/PyTorch path works across CPU, MPS, and CUDA
    and avoids vendor-specific runtimes in the default path; optional backends can
    be compared as variants later.
  alias_rationales:
    smollm2-135m: Default local SLM for quick, permissive, laptop-friendly serving
      experiments.
    qwen2.5-0.5b: Larger permissive Qwen-family option for sensitivity studies when
      the machine can tolerate slower runs and larger downloads.
    qwen3-0.6b: Newer compact Qwen-family option for optional model-family comparisons;
      not the default because it is larger and slower than SmolLM2-135M.
dataset: prompt-suite-local
dataset_source: Deterministic expanded local prompts embedded in the runner; no external
  evaluation dataset required.
quality_target:
  metric: generated_tokens
  value: 8
functional_check:
  metric: generated_tokens
  condition: default max run requests 16 decode tokens; long-context prompt must
    generate at least 8 continuation tokens
  reference_runs: 5
  reviewer_notes:
  - Long-context serving reports configured context length, measured context tokens,
    prefill latency, decode throughput, and prompt size.
verified_baseline:
  generated_tokens: 16
  baseline_note: Functional long-context serving check with an 8-token minimum; public
    comparisons use context-length scaling, prefill latency, memory footprint, and
    energy.
scenario: server
public:
  status: systems-only
  rationale: Exposes prompt-length and prefill/KV-cache scaling for local SLM serving
    studies without introducing a separate model or dataset identity.
runner:
  min: mlperf.runners.slm:run_long_context_decode_min
  max: mlperf.runners.slm:run_long_context_decode_max
provenance: Long-context SLM decode path for prefill, KV-cache, memory-footprint,
  and latency scaling studies under the SmolLM2 chat inference workload.
