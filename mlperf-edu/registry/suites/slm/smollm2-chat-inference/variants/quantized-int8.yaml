id: slm-quantized-decode
suite: slm
model: SmolLM2-135M-Instruct dynamic-int8
params: 135M
model_source:
  type: huggingface
  default_model_id: HuggingFaceTB/SmolLM2-135M-Instruct
  revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
  default_alias: smollm2-135m
  license: Apache-2.0
  aliases:
    smollm2-135m: HuggingFaceTB/SmolLM2-135M-Instruct
    qwen2.5-0.5b: Qwen/Qwen2.5-0.5B-Instruct
    qwen3-0.6b: Qwen/Qwen3-0.6B
  selection_rationale: SmolLM2-135M-Instruct is the default because it is Apache-2.0,
    public on Hugging Face, small enough for laptop CPU/MPS setup runs, and large
    enough to exercise Transformer decode, KV-cache, quantization, batching, and long-context
    behavior.
  size_rationale: 135M parameters keeps default downloads and local inference practical
    for coursework while still creating measurable memory, prefill, and decode behavior
    for systems studies.
  backend_rationale: The Transformers/PyTorch path works across CPU, MPS, and CUDA
    and avoids vendor-specific runtimes in the default path; optional backends can
    be compared as variants later.
  alias_rationales:
    smollm2-135m: Default local SLM for quick, permissive, laptop-friendly serving
      experiments.
    qwen2.5-0.5b: Larger permissive Qwen-family option for model-family sensitivity studies that
      allow a larger download.
    qwen3-0.6b: Newer compact Qwen-family option for optional model-family comparisons;
      its larger download keeps it out of the default laptop setup.
dataset: prompt-suite-local
dataset_source: Deterministic local prompts embedded in the runner; no external evaluation
  dataset required.
quality_target:
  metric: generated_tokens
  value: 8
functional_check:
  metric: generated_tokens
  condition: default max run requests 16 decode tokens; generated_tokens must be >= 8,
    token-weighted continuation perplexity must be <= 7 overall and <= 25 in the weakest
    category, and mean NLL degradation from the unquantized model must be <= 0.25 after
    dynamic int8 conversion
  reference_runs: 5
  reviewer_notes:
  - The real-model max path must pass output length, both declared v2 continuation-quality
    gates, and the quantized NLL-parity gate before latency, throughput, memory, or energy
    comparisons are interpreted. These quantized systems limits do not alter the baseline
    workload's 7, 24, and 0.1 limits.
quality_evaluation:
  suite: mlperf-edu-slm-quality/0.2
  fixture_version: 2.0.0
  aggregation: token-weighted-continuation-nll
  category_guard: maximum-category-perplexity
  metric: continuation_perplexity
  maximum: 7.0
  worst_category_maximum: 25.0
  max_quantized_nll_delta: 0.25
  threshold_rationale: The overall ceiling remains 7. The weakest-category ceiling of 25
    leaves 4.2% headroom above the observed 24.0029, and the 0.25 NLL-delta ceiling leaves
    14.4% headroom above the larger observed delta of 0.2185. A 0.25 NLL delta bounds the
    permitted perplexity ratio to exp(0.25), or about 1.284, which rejects gross dynamic-int8
    degradation while accommodating measured CPU backend variation. These are systems-only
    quantization limits and do not claim baseline equivalence.
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  calibration_scope: bounded-local-current-v2
  protocol_compatibility: current-v2
  review_eligible: false
  artifact_status: uncommitted-local-run
  observed_utc: '2026-07-11T13:57:13Z'
  model_id: HuggingFaceTB/SmolLM2-135M-Instruct
  model_revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
  reference_backend: transformers-mps
  execution_backend: transformers-cpu-dynamic-int8
  quantized_engine: qnnpack
  generated_tokens: 16
  continuation_tokens: 75
  reference_perplexity: 5.227185511982561
  reference_worst_category_perplexity: 18.94030982965928
  quantized_perplexity: 6.503655991585001
  quantized_worst_category: benchmarking
  quantized_worst_category_perplexity: 24.00291125471191
  quantized_nll_delta: 0.21849148882242542
  cpu_reference_nll_delta: 0.21700134003806548
  baseline_note: A bounded v2 default run used the Apple M5 Max MPS reference path followed by
    PyTorch 2.13.0 qnnpack execution on CPU. It passed output length and overall perplexity.
    Its weakest category and NLL delta sit just above the baseline limits, motivating the
    explicit quantized systems limits. A clean multi-seed reference package is still required
    before any promotion review.
  superseded_observation:
    fixture: former four-case unweighted suite
    quality_perplexity: 19.8108
    quality_nll_delta: 0.9580
    note: Retained only for historical traceability and not used to set the v2 contract.
scenario: single_stream
public:
  status: systems-only
  rationale: Standardized dynamic-int8 path for quantization studies with explicit v2 systems
    limits calibrated to the default CPU backend. It remains non-performance-bearing until a
    reviewed comparison contract and clean multi-seed reference package exist.
runner:
  min: mlperf.runners.slm:run_quantized_decode_min
  max: mlperf.runners.slm:run_quantized_decode_max
max_execution:
  data_mode: local-prompt
  quality_target_enforced: true
  fetched_assets_used: true
  declared_dataset_used: true
  scope: systems-only
  note: The current max runner reads this variant's declared v2 ceilings and fails closed on
    output length, overall perplexity, weakest-category perplexity, and quantized NLL parity.
    The default CPU path passes the bounded calibration but remains systems-only pending a
    clean multi-seed reference package and reviewed comparison contract.
provenance: Dynamic int8 SLM decode path for quantization, memory-footprint, and CPU
  serving comparison studies.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
