id: slm-quantized-decode
suite: slm
model: SmolLM2-135M-Instruct dynamic-int8
params: 135M
model_source:
  type: huggingface
  default_model_id: HuggingFaceTB/SmolLM2-135M-Instruct
  revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
  default_alias: smollm2-135m
  license: Apache-2.0
  aliases:
    smollm2-135m: HuggingFaceTB/SmolLM2-135M-Instruct
    qwen2.5-0.5b: Qwen/Qwen2.5-0.5B-Instruct
    qwen3-0.6b: Qwen/Qwen3-0.6B
  selection_rationale: SmolLM2-135M-Instruct is the default because it is Apache-2.0,
    public on Hugging Face, small enough for laptop CPU/MPS setup runs, and large
    enough to exercise Transformer decode, KV-cache, quantization, batching, and long-context
    behavior.
  size_rationale: 135M parameters keeps default downloads and local inference practical
    for coursework while still creating measurable memory, prefill, and decode behavior
    for systems studies.
  backend_rationale: The Transformers/PyTorch path works across CPU, MPS, and CUDA
    and avoids vendor-specific runtimes in the default path; optional backends can
    be compared as variants later.
  alias_rationales:
    smollm2-135m: Default local SLM for quick, permissive, laptop-friendly serving
      experiments.
    qwen2.5-0.5b: Larger permissive Qwen-family option for model-family sensitivity studies that
      allow a larger download.
    qwen3-0.6b: Newer compact Qwen-family option for optional model-family comparisons;
      its larger download keeps it out of the default laptop setup.
dataset: prompt-suite-local
dataset_source: Deterministic local prompts embedded in the runner; no external evaluation
  dataset required.
quality_target:
  metric: generated_tokens
  value: 8
functional_check:
  metric: generated_tokens
  condition: default max run requests 16 decode tokens; generated_tokens must be
    >= 8 on the deterministic prompt set after dynamic int8 conversion
  reference_runs: 5
  reviewer_notes:
  - Quantized path must preserve the functional generation check before latency, throughput,
    memory, or energy comparisons are interpreted.
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  generated_tokens: 16
  quality_perplexity: 19.8108
  quality_nll_delta: 0.9580
  baseline_note: Dynamic-int8 calibration completes generation but fails the current
    quality-parity gate; the row remains systems-only.
scenario: single_stream
public:
  status: systems-only
  rationale: Standardized dynamic-int8 serving path for quantization studies. The
    current PyTorch dynamic-int8 path materially changes continuation NLL on the
    bundled quality suite, so it is not performance-bearing until parity is restored.
runner:
  min: mlperf.runners.slm:run_quantized_decode_min
  max: mlperf.runners.slm:run_quantized_decode_max
max_execution:
  data_mode: local-prompt
  quality_target_enforced: true
  fetched_assets_used: true
  declared_dataset_used: true
  scope: systems-only
  note: The current max runner uses the pinned SLM and bundled prompt suite and
    enforces output length, but the dynamic-int8 continuation-quality evaluation
    fails the current perplexity and NLL-delta bounds. The variant is systems-only.
provenance: Dynamic int8 SLM decode path for quantization, memory-footprint, and CPU
  serving comparison studies.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
