id: micro-diffusion-train
model: MicroDiffusionUNet(32px, channels=3)
params: 1964355
dataset: cifar10
dataset_source: Krizhevsky (2009), auto-download via torchvision, 170MB
quality_target:
  metric: mse_loss
  value: 0.002
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  train_loss: 0.002
  val_loss: 0.0
  epochs: 20
  time_seconds: 41
functional_check:
  metric: parameter_delta_l2
  condition: three deterministic denoising optimizer steps complete with finite losses,
    nonzero parameter updates, and output shape equal to input shape
  reviewer_notes:
  - This systems check does not evaluate CIFAR-10 reconstruction or generative quality.
scenario: training
public:
  status: systems-only
  rationale: Covers diffusion-style denoising compute at laptop scale, but the toy
    MSE target is not yet a public task-quality score.
runner:
  min: mlperf.runners.extended:run_micro_diffusion_min
  max: mlperf.runners.extended:run_micro_diffusion_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  config:
    image_size: 32
    channels: 3
    batch_size: 4
    train_steps: 3
    noise_std: 0.1
    lr: 0.001
  note: The current max runner performs three U-Net denoising optimizer steps over
    twelve deterministic synthetic images. It does not consume CIFAR-10 or enforce
    the candidate reconstruction-MSE target.
provenance: Ho et al. 2020 (DDPM); U-Net denoising autoencoder
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
