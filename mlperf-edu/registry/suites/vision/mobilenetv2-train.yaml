id: mobilenetv2-train
model: mobilenetv2
params: 2.4M
dataset: fashion-mnist
dataset_source: Xiao, Rasul & Vollgraf (2017), Fashion-MNIST via torchvision; MIT
  license; cached locally after first download
quality_target:
  metric: top1_accuracy
  value: 0.7
  direction: higher
  target_basis: reference_runs
  tolerance: 0.0
  reference_runs: 5
  variance_summary:
    runs: 5
    statistic: median
    acceptance_rule: median top-1 accuracy must be >= target
    spread_note: Fashion-MNIST split and seed are fixed; target represents a fast
      out-of-box correctness bar.
  reference_protocol:
    profile: max
    backend: pytorch-cpu reference path unless the report declares a different backend
    machine_class: laptop-class CPU or laptop-class accelerator with full hardware
      fingerprint
    dataset_mode: fetched Fashion-MNIST with fixed torchvision transforms, split,
      and seed; no synthetic fallback
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    aggregation: median top-1 accuracy across five independent reference runs
    artifact_policy: preserve JSON, HTML, CSV, .provd.json, run fingerprint, dataset
      asset metadata, and raw metric values for each run
    rerun_policy: rerun all five references when model code, dataset preprocessing,
      optimizer schedule, PyTorch major version, or target hardware class changes
  reviewer_notes:
  - MobileNetV2 baseline satisfies the public target; note remains that higher tuned
    accuracy is a stretch target.
verified_baseline:
  train_loss: 0.805
  val_loss: 0.738
  accuracy: 0.727
  epochs: 5
  time_seconds: 24.2
  note: Single-seed Apple MPS calibration with 50 train batches and 50 validation
    batches per epoch at learning rate 1e-4; CPU fallback is currently much slower
    and needs runner optimization before endorsement.
scenario: single_stream
public:
  status: score-bearing
  rationale: Uses Fashion-MNIST with a local MobileNetV2 implementation and explicit
    top-1 target for edge and model-efficiency studies.
runner:
  min: mlperf.runners.vision:run_mobilenetv2_min
  max: mlperf.runners.vision:run_mobilenetv2_max
provenance: Sandler et al. 2018 (MobileNetV2); FULLY LOCAL — no torchvision.models
  dependency
regime:
  working_set:
    value: unmeasured
    peak_bytes_per_step: 10485760
    note: 2.4M params, depthwise-separable convs; 10 MB per-step in grey band — measure.
  arithmetic_intensity:
    value: bandwidth_bound
    flops_per_byte: 3.691
    classification_rule: intensity 3.69 vs [low 13.71, high 54.84]; util 0.005 vs
      [dispatch 0.25, sat 0.5]
    evidence_sidecar: roofline/mobilenetv2-train_2026-04-16T21-09-06Z_6a95ef082eee.json
    evidence_sha256_short: 71606a91b999
    measured_at: 2026-04-16T21-09-06Z
    platform_machine_class: apple-silicon
  dispatch:
    value: dispatch_bound
    note: Despite 'edge' label, MobileNetV2 is mostly memory-bound, not compute-bound
    utilization: 0.005
    achieved_bw_gbps: 2.645
    classification_rule: intensity 3.69 vs [low 13.71, high 54.84]; util 0.005 vs
      [dispatch 0.25, sat 0.5]
