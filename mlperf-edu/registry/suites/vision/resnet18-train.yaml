id: resnet18-train
model: resnet18
params: 11.2M
dataset: fashion-mnist
dataset_source: Xiao, Rasul & Vollgraf (2017), Fashion-MNIST via torchvision; MIT
  license; cached locally after first download
quality_target:
  metric: top1_accuracy
  value: 0.75
  direction: higher
  target_basis: reference_runs
  tolerance: 0.0
  reference_runs: 5
  variance_summary:
    runs: 5
    statistic: median
    acceptance_rule: median top-1 accuracy must be >= target
    spread_note: Fashion-MNIST split and seed are fixed; tuned runs can exceed this
      out-of-box target.
  reference_protocol:
    profile: max
    backend: pytorch-cpu reference path unless the report declares a different backend
    machine_class: laptop-class CPU or laptop-class accelerator with full hardware
      fingerprint
    dataset_mode: fetched Fashion-MNIST with fixed torchvision transforms, split,
      and seed; no synthetic fallback
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    aggregation: median top-1 accuracy across five independent reference runs
    artifact_policy: preserve JSON, HTML, CSV, .provd.json, run fingerprint, dataset
      asset metadata, and raw metric values for each run
    rerun_policy: rerun all five references when model code, dataset preprocessing,
      optimizer schedule, PyTorch major version, or target hardware class changes
  reviewer_notes:
  - Fashion-MNIST ResNet-18 baseline satisfies the target; target is intentionally
    reachable for laptop-class classroom runs while preserving a canonical vision
    training shape.
verified_baseline:
  train_loss: 0.638
  val_loss: 0.584
  accuracy: 0.773
  epochs: 3
  time_seconds: 7.4
  note: Single-seed Apple MPS default run with 20 train batches and 20 validation
    batches per epoch; target remains provisional until the five-seed reference sweep.
scenario: single_stream
public:
  status: score-bearing
  rationale: Uses Fashion-MNIST with a local ResNet-18 implementation and explicit
    top-1 target, suitable for public edge-training performance reports.
runner:
  min: mlperf.runners.vision:run_resnet18_min
  max: mlperf.runners.vision:run_resnet18_max
provenance: He et al. 2016 (ResNet); FULLY LOCAL implementation — no torchvision.models
  dependency
