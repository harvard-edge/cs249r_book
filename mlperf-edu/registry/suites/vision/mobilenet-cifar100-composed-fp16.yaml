id: mobilenet-cifar100-composed-fp16
model: MobileNetV2-cifar100 + 2:4 sparsity + fake-INT8 + fp16
params: 2.4M
effective_compression_ratio: 5.9
functional_check:
  metric: effective_compression_ratio
  condition: compressed inference emits logits and records compression ratio greater
    than 1
  reference_runs: 5
  reviewer_notes:
  - This workload demonstrates composed optimization accounting; score-bearing accuracy
    requires a trained checkpoint.
scenario: inference
public:
  status: systems-only
  rationale: Demonstrates compression composition and backend gaps, but the composed
    path is a research scaffold rather than a standalone accuracy benchmark.
runner:
  min: mlperf.runners.vision:run_mobilenet_composed_min
  max: mlperf.runners.vision:run_mobilenet_composed_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner measures composed precision and compression accounting
    on deterministic synthetic inputs. It has no trained checkpoint or task-accuracy
    claim.
provenance: Composition of structured sparsity, fake INT8 accounting, and fp16 execution
  on MobileNetV2. The runner reports its computed compression ratio, while runtime
  speedup remains unverified and is not claimed.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
