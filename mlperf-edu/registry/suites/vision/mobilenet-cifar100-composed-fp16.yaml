id: mobilenet-cifar100-composed-fp16
model: MobileNetV2-100class-random + fp16 execution + 2:4 sparsity + fake-INT8 accounting
params: 2351972
reference_effective_compression_ratio: 3.100770983188137
functional_check:
  metric: effective_compression_ratio
  condition: compressed inference emits logits and records compression ratio greater
    than 1
  reference_runs: 5
  reviewer_notes:
  - This workload demonstrates composed optimization accounting; score-bearing accuracy
    requires a trained checkpoint.
scenario: offline
public:
  status: systems-only
  rationale: Demonstrates actual fp16 dense execution plus 2:4 pruning and fake-int8
    packed-storage accounting. It is a systems scaffold with synthetic inputs, no
    trained checkpoint, and no task-accuracy or kernel-speedup claim.
runner:
  min: mlperf.runners.vision:run_mobilenet_composed_min
  max: mlperf.runners.vision:run_mobilenet_composed_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: false
  functional_check_enforced: true
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The max runner enforces finite fp16 logits and a packed-storage ratio above one
    on deterministic synthetic inputs. The 2:4 and int8 components are accounting
    transformations, not fused runtime kernels; no task-accuracy claim is made.
provenance: Actual fp16 CPU execution of a randomly initialized 100-class MobileNetV2
  composed with structured 2:4 pruning and fake-int8 packed-storage accounting. The
  runner reports exact dtypes and bytes; runtime speedup remains unverified and is not claimed.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
