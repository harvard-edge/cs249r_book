id: image-classification
model: mlperf-tiny-resnet8
params: 77.7K
dataset: cifar10
dataset_source: Krizhevsky CIFAR-10 from the pinned University of Toronto Hugging Face mirror, selected by the official MLPerf Tiny 200-sample accuracy index
task: image-classification
modes:
- inference
implemented_modes:
- inference
quality_target:
  metric: top1_accuracy
  value: 0.85
  direction: higher
  target_basis: mlcommons_derived
  target_kind: inherited_acceptance_gate
  tolerance: 0.0
  reference_runs: 0
  acceptance_runs: 1
  reviewer_notes:
  - The 85% gate is inherited from MLPerf Tiny; it is not inferred from a project-created calibration.
  - The exact official float checkpoint reproduces 87.0% on the 200-sample accuracy set through the PyTorch adapter; promotion still requires committed repeated timing.
  - The measured region repeats the unchanged accuracy-set pass 50 times so laptop timing is long enough for the 5% outer-run repeatability gate; quality is computed from the first pass only.
measurement_protocol:
  primary_metric: inference_and_evaluation_seconds
  scenario: offline
  timing_scope: 50 complete passes over the official 200-sample MLPerf Tiny accuracy set after model and data construction
  included_phases:
  - host-to-device transfer of raw float CIFAR-10 inputs for every pass
  - exact PyTorch execution of the fused official float ResNet8 graph for every pass
  - top-1 prediction for every pass and accuracy accumulation for the first pass
  excluded_phases:
  - dataset fetching
  - Parquet decoding and accuracy-subset construction
  - TFLite parsing and PyTorch weight loading
  - one untimed warmup for each observed batch shape
  - report and provenance serialization
  device_synchronization: synchronize immediately before and after the measured inference-and-evaluation region
  outer_reference_runs: 1
  outer_preconditioning_runs: 0
  outer_inter_execution_cooldown_seconds: 5
  repeatability_metric: inference_and_evaluation_seconds
  repeatability_limit: 0.05
