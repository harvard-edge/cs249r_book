  path: benchmark/training/image_classification
  adaptation: The official float TFLite weights, fused ResNet8 graph, raw 0..255 input convention, 200-sample accuracy index, and top-1 gate are preserved. MLPerf EDU maps the fused weights into an equivalent PyTorch graph, including TensorFlow SAME stride-two padding, and adds measurement, provenance, and reporting.
