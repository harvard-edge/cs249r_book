id: micro-dlrm-distributed
model: micro-dlrm-1m via torch.distributed (Gloo, 2 ranks, localhost)
params: 1.0M
world_size: 2
backend: gloo
transport: loopback
quality_target:
  metric: relative_loss_delta
  direction: lower
  value: 0.05
functional_check:
  metric: relative_loss_delta
  condition: localhost DDP final loss remains within 5 percent of gradient-accumulation
    baseline
  reference_runs: 5
  reviewer_notes:
  - This validates distributed training equivalence and communication overhead, not
    recommender quality.
scenario: training
public:
  status: systems-only
  rationale: Standardizes a localhost DDP systems exercise for communication overhead
    studies, not a public recommendation-model score.
runner:
  min: mlperf.runners.dlrm:run_distributed_min
  max: mlperf.runners.dlrm:run_distributed_max
provenance: 'Iter-10 (Dean): two-process DDP smoke. Demonstrates DDP-vs- gradient-accumulation
  loss equivalence (delta 0.0064 < 0.02 check). AllReduce overhead 0.6 ms/step on
  M5 Max loopback Gloo.'
regime:
  working_set:
    value: cache_resident
  arithmetic_intensity:
    value: unmeasured
  dispatch:
    value: dispatch_bound
    note: Per-step 0.6 ms AllReduce dominates micro-step compute
