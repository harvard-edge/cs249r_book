id: micro-dlrm-distributed
model: micro-dlrm-whitebox via torch.distributed (Gloo, 2 ranks, localhost)
params: 22,977
params_note: Exact trainable parameter count; fp32 gradients contain 91,908 bytes
  (~92 KB decimal, 89.8 KiB) per full-gradient synchronization.
dataset: synthetic-deterministic-ddp
dataset_source: Project-generated seeded dense, sparse, and binary-label batches;
  no MovieLens records are consumed
world_size: 2
backend: gloo
transport: loopback
quality_target:
  metric: relative_loss_delta
  direction: lower
  value: 0.05
functional_check:
  metric: relative_loss_delta
  condition: localhost DDP final loss remains within 5 percent of gradient-accumulation
    baseline
  reference_runs: 5
  reviewer_notes:
  - This validates distributed training equivalence and communication overhead, not
    recommender quality.
scenario: training
public:
  status: systems-only
  rationale: Standardizes a localhost DDP systems exercise for communication overhead
    studies, not a public recommendation-model score.
runner:
  min: mlperf.runners.dlrm:run_distributed_min
  max: mlperf.runners.dlrm:run_distributed_max
max_execution:
  data_mode: synthetic-deterministic
  quality_target_enforced: true
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  model_config:
    dense_features: 16
    sparse_table_sizes:
    - 943
    - 1682
    - 21
    embedding_dim: 8
    bottom_mlp:
    - 16
    - 8
    - 8
    top_mlp:
    - 32
    - 16
    - 1
  run_config:
    world_size: 2
    n_steps: 4
    micro_batch: 8
    backend: gloo
    transport: localhost-loopback
  note: The current max runner uses deterministic synthetic batches to compare localhost
    DDP with gradient accumulation and enforces their loss-equivalence check. It is
    not a recommender-accuracy benchmark.
provenance: Two-process localhost Gloo DDP compared with an equivalent single-process
  gradient-accumulation loop. Per-step timing covers the complete backward pass,
  including autograd and AllReduce; it is not an isolated communication measurement.
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
