id: time-series-forecasting
model: patchtst
params: 921187
dataset: ettm1
dataset_source: Exact ETTm1 CSV from the pinned ETTDataset commit, using the official PatchTST boundaries and train-split standardization
task: multivariate-time-series-forecasting
modes:
- training
implemented_modes:
- training
configurations:
  prediction_horizon:
  - 96
  - 192
