id: micro-lstm-train
model: micro-lstm
params: 51K
dataset: etth1
dataset_source: Zhou et al. (2021, AAAI Informer), ETTh1 hourly electricity transformer
  temps, 17K observations; ships in data/etth1/
quality_target:
  metric: val_mse
  value: 0.13
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  train_loss: 0.017
  val_loss: 0.17
  epochs: 30
  time_seconds: 20
  note: Classic overfitting pattern — val MSE plateaus at epoch 5 then rises
scenario: single_stream
public:
  status: systems-only
  rationale: Covers recurrent time-series behavior for systems experiments, but the
    current baseline does not satisfy the declared validation target.
runner:
  min: mlperf.runners.extended:run_micro_lstm_min
  max: mlperf.runners.extended:run_micro_lstm_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner measures recurrent forecasting execution on deterministic
    synthetic time series. It does not consume ETTh1 or enforce the candidate validation-MSE
    target.
provenance: Hochreiter & Schmidhuber 1997 (LSTM); time-series forecasting
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
