params: 0.3M
dataset: mnist
dataset_source: LeCun et al. 1998, auto-download via torchvision, 12MB
quality_target:
  metric: anomaly_auroc
  value: 0.95
  direction: higher
  target_basis: reference_runs
  tolerance: 0.0
  reference_runs: 5
  variance_summary:
    runs: 5
    statistic: median
    acceptance_rule: median anomaly AUROC must be >= target
    metric: anomaly_auroc
    median: 0.9665642110502738
    min: 0.9645168333408751
    max: 0.9701133535454093
    spread_note: Fresh development calibration computes AUROC from per-sample reconstruction
      error on the complete 10,000-example MNIST test split, with digit zero treated
      as normal and all other digits treated as anomalies. The clean committed
      public-candidate sweep and committed reference summary remain pending.
  reference_protocol:
    profile: max
    backend: pytorch-cpu reference path unless the report declares a different backend
    machine_class: laptop-class CPU or laptop-class accelerator with full hardware
      fingerprint
    dataset_mode: fetched MNIST with fixed normal/anomaly digit split, preprocessing,
      and seed; no synthetic fallback
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    aggregation: median anomaly AUROC across five independent reference runs
    artifact_policy: preserve JSON, HTML, CSV, .provd.json, run fingerprint, dataset
      asset metadata, and raw metric values for each run
    rerun_policy: rerun all five references when model code, dataset preprocessing,
      optimizer schedule, PyTorch major version, or target hardware class changes
  reviewer_notes:
  - The public quality gate measures anomaly discrimination, not autoencoder training
    loss. Reconstruction MSE remains a diagnostic metric.
