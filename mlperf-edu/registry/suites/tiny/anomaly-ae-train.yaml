public:
  status: score-bearing
  rationale: Uses a versioned hard MNIST split, classwise anomaly AUROC, and explicit no-training
    controls with a compact local autoencoder. This preserves the train-on-normal and score-by-reconstruction-error
    shape of the MLPerf Tiny anomaly-detection workload while requiring a measurable benefit
    from training.
