id: anomaly-ae-train
model: anomaly-ae
params: 0.3M
dataset: mnist
dataset_source: LeCun et al. 1998, auto-download via torchvision, 12MB
quality_target:
  metric: reconstruction_mse
  value: 0.04
  direction: lower
  target_basis: reference_runs
  tolerance: 0.0
  reference_runs: 5
  variance_summary:
    runs: 5
    statistic: median
    acceptance_rule: median reconstruction MSE must be <= target
    spread_note: MNIST split and seed are fixed; anomaly digits intentionally produce
      higher validation loss.
  reference_protocol:
    profile: max
    backend: pytorch-cpu reference path unless the report declares a different backend
    machine_class: laptop-class CPU or laptop-class accelerator with full hardware
      fingerprint
    dataset_mode: fetched MNIST with fixed normal/anomaly digit split, preprocessing,
      and seed; no synthetic fallback
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    aggregation: median reconstruction MSE across five independent reference runs
    artifact_policy: preserve JSON, HTML, CSV, .provd.json, run fingerprint, dataset
      asset metadata, and raw metric values for each run
    rerun_policy: rerun all five references when model code, dataset preprocessing,
      optimizer schedule, PyTorch major version, or target hardware class changes
  reviewer_notes:
  - Training reconstruction MSE satisfies the public target; validation loss is intentionally
    higher for anomaly-separation behavior.
verified_baseline:
  reconstruction_mse: 0.034
  train_loss: 0.034
  val_loss: 0.065
  epochs: 20
  time_seconds: 5
  note: Val loss intentionally higher — anomalous digits have high recon error
max_model_size_kb: 350  # registry metadata only; the enforced size gate is the param-count range in scripts/compliance_checker.py (anomaly-ae: 250k-350k). 350 KB tracks the 350k INT8 upper bound and clears the reference model (~303k params, input_dim=784).
scenario: offline
public:
  status: score-bearing
  rationale: Uses MNIST with an explicit reconstruction-MSE target and tiny-model
    constraint, matching an MLPerf Tiny anomaly-detection teaching shape.
runner:
  min: mlperf.runners.tiny:run_anomaly_ae_min
  max: mlperf.runners.tiny:run_anomaly_ae_max
provenance: MLPerf Tiny AD benchmark; Koizumi et al. 2019 (ToyADMOS architecture)
