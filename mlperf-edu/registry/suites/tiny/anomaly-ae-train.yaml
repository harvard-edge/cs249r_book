id: anomaly-ae-train
model: anomaly-ae
params: 0.3M
dataset: mnist
dataset_source: LeCun et al. 1998, auto-download via torchvision, 12MB
quality_target:
  metric: anomaly_auroc
  value: 0.93
  direction: higher
  target_basis: reference_runs
  tolerance: 0.0
  reference_runs: 5
  methodology:
    protocol_id: mnist-hard-curve-v1
    normal_class: 5
    anomaly_classes:
    - 3
    - 8
    - 9
    score_definition: Macro average of three classwise AUROCs. Each AUROC compares held-out
      normal digit 5 with one anomaly digit using per-sample reconstruction error.
    no_training_controls:
    - zero reconstructor
    - full normal-training-set centroid
    - seeded random-initialization autoencoder
  auxiliary_gates:
    worst_class_auroc:
      value: 0.9
      direction: higher
      acceptance_rule: The minimum AUROC across anomaly digits 3, 8, and 9 must be at least
        0.90 in every reference run.
    learned_control_margin:
      value: 0.2
      direction: higher
      acceptance_rule: For every anomaly digit, learned AUROC minus the strongest AUROC from
        the three no-training controls must be at least 0.20.
  variance_summary:
    runs: 5
    statistic: median
    acceptance_rule: Every run must pass the macro-AUROC target, worst-class gate, and learned-control
      gate. The reported five-seed median must also be >= target.
    metric: anomaly_auroc
    median: 0.9388614489261359
    min: 0.9369790049994332
    max: 0.9422428382049718
    mean: 0.9391071962241944
    sample_stdev: 0.002199850480754223
    calibration_status: bounded-local-methodology-experiment
    spread_note: A bounded seed 0-4 methodology experiment on cached MNIST produced macro
      AUROC 0.9370-0.9422, worst-class AUROC 0.9132-0.9212, and minimum learned-control margin
      0.2491-0.2570. These values set the proposed gates but do not replace a clean committed
      reference packet.
  reference_protocol:
    profile: max
    backend: pytorch-cpu reference path unless the report declares a different backend
    machine_class: laptop-class CPU or laptop-class accelerator with full hardware fingerprint
    dataset_mode: fetched MNIST hard-curve-v1 with digit 5 as normal, digits 3/8/9 as the
      fixed anomaly set, original test labels preserved for classwise scoring, and no synthetic
      fallback
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    aggregation: Median macro anomaly AUROC across five independent reference runs. Every
      run must pass the macro target, worst-class AUROC, and learned-control-margin gates.
    repeatability_metric: sample coefficient of variation of train_and_eval_seconds across
      the five reference runs
    repeatability_limit: 0.05
    repeatability_action: withhold the performance reference and rerun the complete protocol
      when the coefficient of variation exceeds 5%
    artifact_policy: preserve JSON, HTML, CSV, .provd.json, run fingerprint, dataset asset
      metadata, and raw metric values for each run
    rerun_policy: rerun all five references when model code, dataset preprocessing, optimizer
      schedule, PyTorch major version, or target hardware class changes
  reviewer_notes:
  - The primary score is a macro average, and the independent worst-class gate prevents an
    easy anomaly digit from hiding a weak one. Reconstruction MSE remains diagnostic only.
  - The learned-control gate proves that optimization added discrimination beyond a zero reconstructor,
    a normal-data centroid, and the seeded untrained architecture.
measurement_protocol:
  primary_metric: train_and_eval_seconds
  scenario: training
  timing_scope: fixed canonical training loop plus scheduled validation
  included_phases:
  - optimizer steps
  - scheduled validation
  - learning-rate scheduler steps when configured
  excluded_phases:
  - dataset or asset fetching
  - model construction
  - checkpoint serialization
  - report and provenance serialization
  device_synchronization: synchronize immediately before and after the measured train-and-evaluation
    region
  outer_reference_runs: 5
