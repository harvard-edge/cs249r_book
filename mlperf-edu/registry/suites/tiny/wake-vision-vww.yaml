id: wake-vision-vww
model: wake-vision-vww
params: 8,514
params_note: Exact trainable parameter count for the notebook-safe default max configuration;
  34,056 fp32 parameter bytes or 8,514 int8 parameter bytes before serialization overhead.
dataset: synthetic-deterministic-vww-images
dataset_source: Project-generated seeded 96x96 grayscale tensors with deterministic
  binary labels; Wake Vision images are not consumed
quality_target:
  metric: binary_accuracy
  value: 0.85
scenario: training
public:
  status: systems-only
  rationale: Exercises notebook-safe MicroNet optimizer and validation loops on seeded
    synthetic images. It does not measure Wake Vision binary accuracy.
runner:
  min: mlperf.runners.tiny:run_wake_vision_min
  max: mlperf.runners.tiny:run_wake_vision_max
max_execution:
  data_mode: synthetic-microshard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  model_config:
    input_channels: 1
    input_height: 96
    input_width: 96
    num_classes: 2
  run_config:
    batch_size: 8
    train_batches: 5
    val_batches: 2
    lr: 0.001
    optimizer: AdamW
  note: The default max runner performs repeatable multi-batch MicroNet training and
    validation on a generated image micro-shard. It does not consume Wake Vision or
    enforce the candidate binary-accuracy target.
provenance: MicroNet visual-wake-word teaching architecture aligned conceptually with
  the Wake Vision task family; the executable default uses only generated tensors
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
