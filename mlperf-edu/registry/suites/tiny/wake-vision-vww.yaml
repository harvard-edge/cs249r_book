id: wake-vision-vww
model: wake-vision-vww
params: 8.5K
dataset: wake_vision
dataset_source: Banbury et al. 2024 (CVPR), HuggingFace Harvard-Edge/Wake-Vision,
  6GB; 5K pedagogical subset with CIFAR-10 proxy fallback
quality_target:
  metric: binary_accuracy
  value: 0.85
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  train_loss: 0.31
  val_loss: 0.33
  accuracy: 0.873
  epochs: 20
  time_seconds: 10
max_model_size_kb: 16
scenario: offline
public:
  status: systems-only
  rationale: Aligns with the MLPerf Tiny VWW family, but the large Wake Vision download
    and proxy fallback make it a systems workload until the data contract is tightened.
runner:
  min: mlperf.runners.tiny:run_wake_vision_min
  max: mlperf.runners.tiny:run_wake_vision_max
max_execution:
  data_mode: synthetic-microshard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner performs repeatable multi-batch MicroNet training on
    a generated image micro-shard. It does not consume Wake Vision or enforce the
    candidate binary-accuracy target.
provenance: Banbury et al. 2024 (Wake Vision, CVPR); maps to MLPerf Tiny VWW
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
