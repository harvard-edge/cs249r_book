id: keyword-spotting
model: mlperf-tiny-ds-cnn
params: 25K
dataset: mlperf-tiny-kws-eval
dataset_source: Pinned EEMBC MLPerf Tiny runner accuracy set derived from Google Speech Commands v2
task: keyword-spotting
modes:
- inference
implemented_modes:
- inference
quality_target:
  metric: top1_accuracy
  value: 0.90
  direction: higher
  target_basis: mlcommons_derived
  target_kind: inherited_acceptance_gate
  tolerance: 0.0
  reference_runs: 0
  acceptance_runs: 1
  reviewer_notes:
  - The 90% threshold and 1,000-example MFCC evaluation contract are inherited from MLPerf Tiny.
  - A full-set LiteRT 2.1.6 audit found 7 of 1,000 top-1 disagreements against XNNPACK and 5 against the builtin kernels. PyTorch scores 90.2%, while LiteRT scores 90.0% and 90.5%, respectively; every path passes the inherited 90% gate, but strict prediction parity is not established.
  - The review decision classifies the PyTorch conversion as quality-preserving but nonidentical. It remains useful for education, but it is not promotion eligible. Promotion requires exact-source execution or authoritative unquantized weights, followed by a fresh multi-run sweep. No disagreement tolerance is implied.
  - Each execution performs 1,000 untimed accuracy-set passes to establish a repeatable device state, then measures 2,000 unchanged passes; quality is computed from the first measured pass only.
measurement_protocol:
  primary_metric: inference_seconds
  scenario: offline
  timing_scope: 2,000 repetitions of the complete 1,000-example accuracy set after model, data, and the declared 1,000-pass device warmup are complete
  included_phases:
  - batched PyTorch model execution
  excluded_phases:
  - asset fetching
  - TFLite weight parsing and PyTorch model construction
  - data-file loading and INT8 input dequantization
  - 1,000 untimed complete accuracy-set passes after one shape warmup for each observed batch shape
  - accuracy computation
  - checkpoint, report, and provenance serialization
  device_synchronization: synchronize immediately before and after the measured inference region
  outer_reference_runs: 1
  outer_preconditioning_runs: 0
  outer_inter_execution_cooldown_seconds: 5
  repeatability_metric: inference_seconds
  repeatability_limit: 0.05
canonical_max_contract:
  result_role: score-bearing
  mode: inference
  model_id: mlperf-tiny-ds-cnn
  dataset: mlperf-tiny-kws-eval
  data_mode: real-preprocessed-mlperf-tiny-accuracy-set
  upstream_commit: 1afd2c9820f795965a6134facd0b4dfae41ef23f
  upstream_model_sha256:
    float32_tflite: sha256:e5004c6f1012246e33fa068d8488325538e0444073cd361f5a7edb40c73f12d2
    int8_tflite: sha256:aeea436800704fce17b17292e4412630ad856e9d777c044c64ef748a880bd0ae
  evaluation_repository_commit: cf7c2f2634608a7c0ea7458ab7cb3379f2863424
  evaluation_archive_sha256: sha256:87e431a6b4d3f011d672180a3fb1f08856d8074310f37653d5388ec2affc5209
  config:
    batch_size: 64
    warmup_repetitions: 1000
    repetitions: 2000
    samples: 1000
    input_shape:
    - 1
    - 49
    - 10
    source_input_dtype: int8
    execution_dtype: float32
    adapter: fused-tflite-weights-to-pytorch-v1
  quality:
    metric: top1_accuracy
    metric_key: top1_accuracy
    target: 0.90
    direction: higher
adapter_conformance:
  status: quality-preserving-nonidentical
  policy: exact top-1 prediction parity and quality pass on every selected LiteRT resolver
  promotion_eligible: false
  resolution: >-
    Retain the PyTorch adapter as an inspectable educational implementation, but
    block public promotion until the canonical path executes the pinned source
    runtime or authoritative unquantized weights establish exact prediction
    parity. Do not infer a disagreement tolerance from the inherited quality gate.
  audit:
    artifact: conformance_results/tflite-adapter-parity-20260717.json
    sha256: sha256:524d183cc858cb3c7911e55f9187df40d67bd5bc546a7972ef131fc76192adb7
    schema: mlperf-edu-tflite-adapter-audit/0.2
    source_git_sha: b408be80350e248eed25c11966c4844bfccc15d8
    runtime: ai-edge-litert 2.1.6
    resolvers:
    - auto
    - builtin
    - builtin-ref
scenario: offline
public:
  status: experimental
  rationale: Direct MLPerf Tiny DS-CNN and 1,000-example accuracy-contract adaptation; claims remain withheld because the PyTorch execution is quality-preserving but nonidentical to the pinned LiteRT graph. Promotion requires an exact-source execution path or authoritative unquantized weights, then a fresh repeated-timing sweep.
runner:
  min: mlperf.runners.tiny:run_keyword_spotting_min
  max: mlperf.runners.tiny:run_keyword_spotting_max
provenance:
  authority: MLCommons MLPerf Tiny and EEMBC
  model_repository: https://github.com/mlcommons/tiny
  model_commit: 1afd2c9820f795965a6134facd0b4dfae41ef23f
  evaluation_repository: https://github.com/eembc/benchmark-runner-ml
  evaluation_commit: cf7c2f2634608a7c0ea7458ab7cb3379f2863424
  adaptation: Fused weights are read from the pinned MLCommons TFLite artifact and loaded into the equivalent PyTorch DS-CNN inference graph. The fixed EEMBC INT8 MFCC examples are dequantized with the source model input parameters. The upstream float-input TFLite graph stores convolution kernels with dynamic-range INT8 quantization, so the dequantized PyTorch execution preserves topology and passes the inherited quality gate but is not bitwise or prediction-exact with every LiteRT kernel.
regime:
  working_set:
    value: unmeasured
    note: Classification is withheld until a reference-platform measurement exists.
  arithmetic_intensity:
    value: unmeasured
    note: Classification is withheld until a reference-platform measurement exists.
  dispatch:
    value: unmeasured
    note: Classification is withheld until a synchronized utilization trace exists.
