id: keyword-spotting
model: mlperf-tiny-ds-cnn
params: 25K
dataset: mlperf-tiny-kws-eval
dataset_source: Pinned EEMBC MLPerf Tiny runner accuracy set derived from Google Speech Commands v2
task: keyword-spotting
modes:
- inference
implemented_modes:
- inference
quality_target:
  metric: top1_accuracy
  value: 0.90
  direction: higher
  target_basis: mlcommons_derived
  tolerance: 0.0
  reference_runs: 0
  reviewer_notes:
  - The 90% threshold and 1,000-example MFCC evaluation contract are inherited from MLPerf Tiny.
  - Promotion requires a committed multi-run performance sweep and independent review of the TFLite-to-PyTorch adapter.
measurement_protocol:
  primary_metric: inference_seconds
  scenario: offline
  timing_scope: five repetitions of the complete 1,000-example accuracy set after model and data are resident on the selected device
  included_phases:
  - batched PyTorch model execution
  excluded_phases:
  - asset fetching
  - TFLite weight parsing and PyTorch model construction
  - data-file loading and INT8 input dequantization
  - one untimed warmup for each observed batch shape
  - accuracy computation
  - checkpoint, report, and provenance serialization
  device_synchronization: synchronize immediately before and after the measured inference region
  outer_reference_runs: 5
  repeatability_metric: inference_seconds
  repeatability_limit: 0.05
canonical_max_contract:
  model_id: mlperf-tiny-ds-cnn
  dataset: mlperf-tiny-kws-eval
  data_mode: real-preprocessed-mlperf-tiny-accuracy-set
  upstream_commit: 1afd2c9820f795965a6134facd0b4dfae41ef23f
  upstream_model_sha256:
    float32_tflite: sha256:e5004c6f1012246e33fa068d8488325538e0444073cd361f5a7edb40c73f12d2
    int8_tflite: sha256:aeea436800704fce17b17292e4412630ad856e9d777c044c64ef748a880bd0ae
  evaluation_repository_commit: cf7c2f2634608a7c0ea7458ab7cb3379f2863424
  evaluation_archive_sha256: sha256:87e431a6b4d3f011d672180a3fb1f08856d8074310f37653d5388ec2affc5209
  config:
    batch_size: 64
    repetitions: 5
    samples: 1000
    input_shape:
    - 1
    - 49
    - 10
    source_input_dtype: int8
    execution_dtype: float32
    adapter: fused-tflite-weights-to-pytorch-v1
  quality:
    metric: top1_accuracy
    metric_key: top1_accuracy
    target: 0.90
    direction: higher
scenario: offline
public:
  status: experimental
  rationale: Direct MLPerf Tiny DS-CNN and 1,000-example accuracy-contract adaptation; claims remain withheld until adapter review and a committed five-run sweep are complete.
runner:
  min: mlperf.runners.tiny:run_keyword_spotting_min
  max: mlperf.runners.tiny:run_keyword_spotting_max
provenance:
  authority: MLCommons MLPerf Tiny and EEMBC
  model_repository: https://github.com/mlcommons/tiny
  model_commit: 1afd2c9820f795965a6134facd0b4dfae41ef23f
  evaluation_repository: https://github.com/eembc/benchmark-runner-ml
  evaluation_commit: cf7c2f2634608a7c0ea7458ab7cb3379f2863424
  adaptation: Fused weights are read from the pinned MLCommons TFLite artifact and loaded into the equivalent PyTorch DS-CNN inference graph. The fixed EEMBC INT8 MFCC examples are dequantized with the source model input parameters.
regime:
  working_set:
    value: unmeasured
    note: Classification is withheld until a reference-platform measurement exists.
  arithmetic_intensity:
    value: unmeasured
    note: Classification is withheld until a reference-platform measurement exists.
  dispatch:
    value: unmeasured
    note: Classification is withheld until a synchronized utilization trace exists.
