id: visual-wake-words
model: mlperf-tiny-mobilenet-v1-0.25-vww
params: 210.85K
dataset: mlperf-tiny-vww-eval
dataset_source: Pinned MLPerf Tiny 1,000-example accuracy set derived from the Visual Wake Words COCO 2014 corpus
task: visual-wake-words
modes:
- inference
implemented_modes:
- inference
quality_target:
  metric: top1_accuracy
  value: 0.80
  direction: higher
  target_basis: mlcommons_derived
  target_kind: inherited_acceptance_gate
  tolerance: 0.0
  reference_runs: 0
  acceptance_runs: 1
  reviewer_notes:
  - The 80% threshold, MobileNet task, and 1,000-example balanced accuracy contract are inherited from MLPerf Tiny.
  - Promotion requires committed repeated timing evidence and independent review of the TFLite-to-PyTorch adapter.
  - Each execution performs five untimed complete accuracy-set passes, then measures 50 unchanged passes; quality is computed from the first measured pass only.
measurement_protocol:
  primary_metric: inference_seconds
  scenario: offline
  timing_scope: 50 repetitions of the complete 1,000-example accuracy set after model, data, and five complete-set warmup passes are ready
  included_phases:
  - batched PyTorch model execution
  excluded_phases:
  - asset fetching and exact accuracy-set selection
  - JPEG decoding and RGB float32 normalization
  - TFLite weight parsing and PyTorch model construction
  - one shape warmup for each observed batch shape
  - five untimed complete accuracy-set passes
  - accuracy computation
  - report and provenance serialization
  device_synchronization: synchronize immediately before and after the measured inference region
  outer_reference_runs: 1
  outer_preconditioning_runs: 0
  outer_inter_execution_cooldown_seconds: 5
  repeatability_metric: inference_seconds
  repeatability_limit: 0.05
canonical_max_contract:
  result_role: score-bearing
  mode: inference
