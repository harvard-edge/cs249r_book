id: dscnn-kws-train
model: dscnn-kws
params: 20K
dataset: speech_commands_v2
dataset_source: Warden (2018), auto-download via torchaudio, ~2GB
quality_target:
  metric: top1_accuracy
  value: 0.9
verified_baseline:
  train_loss: 0.916
  val_loss: 1.026
  accuracy: 0.712
  epochs: 10
  time_seconds: 51
  note: 71.2% after 10 epochs on 12-class (10 keywords + unknown + silence)
max_model_size_kb: 100
scenario: offline
public:
  status: systems-only
  rationale: Mirrors the MLPerf Tiny KWS shape, but the current verified baseline
    does not meet the declared top-1 target and needs promotion work.
runner:
  min: mlperf.runners.tiny:run_dscnn_kws_min
  max: mlperf.runners.tiny:run_dscnn_kws_max
provenance: Zhang et al. 2017 (Hello Edge); maps to MLPerf Tiny KWS
regime:
  working_set:
    value: cache_resident
    peak_bytes_per_step: 2097152
    note: 20K params + 40x101 spectrogram inputs
  arithmetic_intensity:
    value: compute_bound
    flops_per_byte: 70
    classification_rule: moderate intensity from spectrogram convs
  dispatch:
    value: unmeasured
