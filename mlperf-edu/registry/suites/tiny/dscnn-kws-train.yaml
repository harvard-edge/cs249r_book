id: dscnn-kws-train
model: dscnn-kws
params: 20K
dataset: speech_commands_v2
dataset_source: Warden (2018), CC-BY-4.0, auto-download via torchaudio.datasets.SPEECHCOMMANDS(download=True),
  2400MB
dataset_license:
  license: Creative Commons Attribution 4.0 International
  license_spdx: CC-BY-4.0
  source: "Warden 2018, arXiv:1804.03209"
  citation_url: https://arxiv.org/abs/1804.03209
  download_url: https://download.tensorflow.org/data/speech_commands_v0.02.tar.gz
  note: License and citation recorded as documentation-of-fact in the registry; registering
    a structured speech_commands AssetDossier in mlperf.assets and any public_release_status
    promotion are separate shared-code/author decisions.
dataset_recipe:
  loader: torchaudio.datasets.SPEECHCOMMANDS(download=True)
  splits_used:
    train: training
    validation: validation
  test_split: not wired in the reference loader; the declared top-1 target is not
    yet measured on the official test split
  feature: log-mel spectrogram (natural log, 1e-9 offset)
  sample_rate_hz: 16000
  clip_seconds: 1.0
  n_fft: 480
  hop_length: 160
  n_mels: 40
  frames: 101
  num_classes: 12
quality_target:
  metric: top1_accuracy
  value: 0.9
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  train_loss: 0.916
  val_loss: 1.026
  accuracy: 0.712
  epochs: 10
  time_seconds: 51
  note: 71.2% after 10 epochs on 12-class (10 keywords + unknown + silence)
max_model_size_kb: 100
scenario: training
public:
  status: systems-only
  rationale: Mirrors the MLPerf Tiny KWS shape, but the historical calibration has
    no committed review artifact, does not meet the declared top-1 target, and needs
    promotion work.
runner:
  min: mlperf.runners.tiny:run_dscnn_kws_min
  max: mlperf.runners.tiny:run_dscnn_kws_max
max_execution:
  data_mode: synthetic-microshard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: false
  scope: systems-only
  note: The current max runner performs repeatable multi-batch DS-CNN training on
    a generated spectrogram micro-shard. It does not consume Speech Commands v2 or
    enforce the candidate top-1 target.
provenance: DS-CNN after Zhang et al. 2017 (Hello Edge); pedagogically aligned with,
  not identical to, the MLPerf Tiny KWS closed-division reference (40x101 log-mel
  front-end here vs the reference 49x10 MFCC front-end)
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
