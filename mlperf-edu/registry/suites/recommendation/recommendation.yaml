id: recommendation
model: Meta DLRM reference model
params: configuration-dependent
dataset: criteo-terabyte
dataset_source: Criteo Terabyte day 23 under the official MLPerf Inference v1.0.1 DLRM accuracy recipe
task: click-through-rate-prediction
modes:
- inference
implemented_modes:
- inference
promotion_scope: false
spiral:
  stage: quality-conformance
  functional_ready: true
  quality_conformant: false
  repeatability_verified: false
  promotion_ready: false
  next_gate: Run the pinned accuracy adapter in a 256-GB-class environment with the manually licensed Criteo data and official 40M checkpoint.
quality_target:
  metric: roc_auc
  value: 0.8025
  direction: higher
  target_basis: literature
  target_kind: inherited_acceptance_gate
  tolerance: 0.0
  reference_runs: 0
  acceptance_runs: 1
  reviewer_notes:
  - The target is the official MLPerf Inference v1.0.1 DLRM ROC AUC result, not a project-created threshold.
  - The functional spiral exercises DLRM-style dense and sparse execution without making a Criteo quality claim.
measurement_protocol:
  primary_metric: inference_seconds
  scenario: offline
  timing_scope: Canonical DLRM inference after embeddings, dense features, and weights are resident
  outer_reference_runs: 5
  outer_preconditioning_runs: 0
  outer_inter_execution_cooldown_seconds: 30
  repeatability_metric: inference_seconds
  repeatability_limit: 0.05
canonical_max_contract:
  result_role: score-bearing
  mode: inference
  model_id: mlperf-inference-v1.0.1-dlrm-40m
  model_uri: https://dlrm.s3-us-west-1.amazonaws.com/models/tb00_40M.pt
  upstream_revision: 8b58587c93af2a5ee67722064f2540a2db15d42f
  dataset: criteo-terabyte
  split: unshuffled-day-23-accuracy-set
  data_mode: real
  execution_status: environment-gated-quality-conformance
  config:
    dense_features: 13
    max_ind_range: 40000000
    model_precision: float32
    accuracy_mode: true
    evaluator: mlperf-inference-accuracy-dlrm
    scenario: offline
    samples_per_query_offline: 204800
  functional_probe:
    functional_probe_embedding_tables: 4
  quality:
    metric: roc_auc
    metric_key: roc_auc
    target: 0.8025
    direction: higher
scenario: offline
public:
  status: experimental
  rationale: The max CLI is pinned to the complete MLPerf Inference v1.0.1 accuracy contract, but execution remains gated on manually licensed Criteo data, a roughly 90-GB checkpoint, and a 256-GB-class runtime.
runner:
  min: mlperf.runners.functional_setup:run_recommendation_min
  max: mlperf.runners.recommendation:run_recommendation_max
provenance:
  authority: MLCommons MLPerf Inference v1.0.1 DLRM
  repository: https://github.com/mlcommons/inference
  commit: 8b58587c93af2a5ee67722064f2540a2db15d42f
  path: recommendation/dlrm/pytorch
  adaptation: The min profile retains a bounded plumbing probe. The max profile invokes the pinned MLPerf Inference v1.0.1 runner and its exact DLRM submodule, and fails closed until the official external assets and legacy runtime are supplied.
regime:
  working_set:
    value: unmeasured
    note: Classification awaits the canonical embedding configuration.
  arithmetic_intensity:
    value: unmeasured
    note: Classification awaits the canonical embedding configuration.
  dispatch:
    value: unmeasured
    note: Classification awaits a synchronized utilization trace.
