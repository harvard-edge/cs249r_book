id: micro-rl-train
model: REINFORCEAgent(policy+value, CartPoleLocal)
params: 17987
dataset: cartpole_local
dataset_source: Pure-Python CartPole environment; physics from OpenAI Gym spec, no
  download
quality_target:
  metric: avg_episode_reward
  value: 195
calibration_observation:
  evidence_status: historical-unverified-no-committed-artifact
  avg_reward: 9.5
  episodes: 500
  time_seconds: 1
  note: REINFORCE is high-variance by design — pedagogical value in showing RL difficulty
functional_check:
  metric: parameter_delta_l2
  condition: four seeded CartPole episodes each execute at least one step, produce
    finite losses, and update the policy/value parameters
  reviewer_notes:
  - This bounded systems check does not evaluate reward convergence.
scenario: training
public:
  status: systems-only
  rationale: Teaches RL control-flow and variance effects, but the stochastic policy-gradient
    target is not stable enough for a comparable public score.
runner:
  min: mlperf.runners.extended:run_micro_rl_min
  max: mlperf.runners.extended:run_micro_rl_max
max_execution:
  data_mode: synthetic-micro-shard
  quality_target_enforced: false
  fetched_assets_used: false
  declared_dataset_used: true
  scope: systems-only
  config:
    episodes: 4
    max_steps_per_episode: 32
    gamma: 0.99
    lr: 0.001
  note: The current max runner performs four seeded rollouts and four policy/value
    optimizer steps in the declared local CartPole environment. It does not run
    convergence training or enforce the candidate reward target.
provenance: Williams 1992 (REINFORCE); policy gradient on classic control
regime:
  working_set:
    value: unmeasured
    note: No committed working-set measurement and reference-platform capacity record exists; classification is withheld.
  arithmetic_intensity:
    value: unmeasured
    note: No committed FLOP/byte measurement and reference-platform ridge-point record exists; classification is withheld.
  dispatch:
    value: unmeasured
    note: No committed synchronized utilization trace and reference-platform peak record exists; classification is withheld.
