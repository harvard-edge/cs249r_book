id: reinforcement-learning
model: MiniGo joint policy and value network
params: configuration-dependent
dataset: minigo-self-play
dataset_source: Self-play games and fixed playoff evaluation from MLPerf Training v0.5 MiniGo
task: reinforcement-learning-through-self-play
modes:
- training
implemented_modes:
- training
promotion_scope: false
spiral:
  stage: quality-conformance
  functional_ready: true
  quality_conformant: false
  repeatability_verified: false
  promotion_ready: false
  next_gate: Execute the pinned MiniGo quality loop at or near the reference self-play budget. The adapter runs locally under a reduced budget, so what remains is compute, not runtime availability.
quality_target:
  metric: professional_move_prediction
  value: 0.4
  direction: higher
  target_basis: literature
  target_kind: inherited_acceptance_gate
  tolerance: 0.0
  reference_runs: 0
  acceptance_runs: 1
  reviewer_notes:
  - The target is the original 9-by-9 MLPerf Training MiniGo professional-move prediction gate.
  - The functional spiral performs a bounded policy-value self-play and training probe without making a MiniGo quality claim.
  - >-
    The recorded result is a reduced-configuration probe, not an attempt at the
    reference contract. It runs 16 self-play games per generation for 4
    generations against a reference of 2000 games per generation and up to
    10000 generations, so the shortfall is a property of the laptop budget
    rather than of the adapter. This is a different kind of miss from a
    workload that executes its full reference procedure and falls short, and it
    should not be read as evidence that the inherited gate is unreachable.
measurement_protocol:
  primary_metric: self_play_and_training_seconds
  scenario: training
  timing_scope: Canonical MiniGo self-play generation, policy-value training, and playoff evaluation
  outer_reference_runs: 1
  outer_preconditioning_runs: 0
  outer_inter_execution_cooldown_seconds: 300
  repeatability_metric: self_play_and_training_seconds
  repeatability_limit: 0.05
canonical_max_contract:
  execution_status: quality-audited-target-not-met
  measured_evidence:
    run_id: readiness-reinforcement-learning-20260804
    result_date: '2026-08-04'
    status: quality_failed
    metric: professional_move_prediction
    score: 0.027624309392265192
    final_generation_score: 0.022099447513812154
    target: 0.4
    backend: pytorch-mps
    device_executed: mps
    generations_completed: 4
    self_play_games: 64
    model_parameters: 472704
    self_play_and_training_seconds: 459.70492545794696
    report_sha256: c863360956764c6556182e410329980bfd9cfc81c1d50cbbc69e46fefbb28079
    provenance_sha256: 661918690cffbc4b65281552b48ec68ee2e0dade8b42d63d4e0dd1dc1421d439
    configuration_basis: laptop_games_per_generation=16, laptop_generations=4
    note: >-
      First recorded authoritative run for this workload. Previously the only
      workload in the registry with no measured result. Recorded as a miss
      against the unchanged inherited gate; neither the target nor the
      generation budget was adjusted to close the distance.
  result_role: score-bearing
  mode: training
  model_id: MLPerf-Training-v0.5-MiniGo
  upstream_revision: 0badcd1786fcb007725ed05f1c44e9d80bbeac52
  dataset: minigo-self-play
  data_mode: run-generated-self-play-plus-professional-move-evaluation
  config:
    board_size: 9
    self_play_games_per_generation: 2000
    self_play_workers: 16
    search_readouts: 200
    playoff_games: 100
    playoff_win_rate: 0.55
    laptop_games_per_generation: 16
    laptop_generations: 4
    evaluation_readouts: 64
    evaluation_tries_per_move: 1
    training_steps_per_generation: 200
    training_batch_size: 64
    learning_rate: 0.001
    laptop_budget_basis: >-
      Measured. One self-play game at the contract's 200 readouts takes about
      six seconds on an Apple-silicon laptop, so the reference budget of 2000
      games per generation is roughly three and a half hours per generation
      single-process. The reduced budget keeps a run inside a class period.
      A miss under it is a budget statement, not a reproduction failure.
      Override with MLPERF_EDU_MINIGO_GAMES_PER_GENERATION and
      MLPERF_EDU_MINIGO_GENERATIONS to approach the reference budget.
  functional_probe:
    functional_probe_readouts: 32
    functional_probe_training_steps: 1
  quality:
    metric: professional_move_prediction
    metric_key: professional_move_prediction
    target: 0.4
    direction: higher
  quality_gates:
    professional_move_prediction:
      metric_key: professional_move_prediction
      target: 0.4
      direction: higher
    model_promotion_playoff:
      metric_key: playoff_win_rate
      target: 0.55
      direction: higher
scenario: training
public:
  status: experimental
  rationale: The max CLI preserves the full historical MiniGo quality loop and professional-game evaluator, and the PyTorch adapter executes it locally against the pinned upstream reference. Quality conformance remains open because the laptop budget runs far fewer self-play games per generation than the reference contract specifies, not because the runtime is unavailable.
runner:
  min: mlperf.runners.functional_setup:run_reinforcement_learning_min
  max: mlperf.runners.minigo:run_reinforcement_learning_max
provenance:
  authority: Historical MLPerf Training MiniGo
  repository: https://github.com/mlcommons/training
  commit: 0badcd1786fcb007725ed05f1c44e9d80bbeac52
  path: reinforcement/minigo
  adaptation: The min profile retains a bounded policy-value probe. The max profile invokes the pinned MLPerf Training v0.5 phase entrypoints with resumable orchestration and fails closed until an immutable compatible GPU runtime is supplied.
regime:
