suites:
  language:
    micro-bert-train:
      model: micro-bert
      params: 432K
      dataset: sst2
      dataset_source: Socher et al. (2013), Stanford Sentiment Treebank binary, 67K
        train / 872 val; ships in data/sst2/
      quality_target:
        metric: val_accuracy
        value: 0.78
      verified_baseline:
        train_loss: 0.15
        val_accuracy: 0.77
        epochs: 15
        time_seconds: 45
        note: Character-level tokenization; 77% on real SST-2 with 0.5M-param model
      scenario: single_stream
      public:
        status: systems-only
        rationale: Provides a small NLU transformer systems workload, but the baseline
          sits below the stated quality target and needs tuning before score promotion.
      runner:
        min: mlperf.runners.extended:run_micro_bert_min
        max: mlperf.runners.extended:run_micro_bert_max
      provenance: Devlin et al. 2019 (BERT); bidirectional transformer for NLU
      regime:
        working_set:
          value: cache_resident
          peak_bytes_per_step: 4194304
          note: 432K params, short SST-2 sequences
        arithmetic_intensity:
          value: compute_bound
          flops_per_byte: 455.764
          classification_rule: intensity 455.76 vs [low 13.71, high 54.84]; util 0.066
            vs [dispatch 0.25, sat 0.5]
          evidence_sidecar: roofline/micro-bert-train_2026-04-16T21-04-51Z_12f7306a7fea.json
          evidence_sha256_short: 85c06029464a
          measured_at: 2026-04-16T21-04-51Z
          platform_machine_class: apple-silicon
        dispatch:
          value: dispatch_bound
          utilization: 0.0658
          achieved_bw_gbps: 2.089
          classification_rule: intensity 455.76 vs [low 13.71, high 54.84]; util 0.066
            vs [dispatch 0.25, sat 0.5]
          evidence_sidecar: roofline/micro-bert-train_2026-04-16T21-04-51Z_12f7306a7fea.json
          evidence_sha256_short: 85c06029464a
          measured_at: 2026-04-16T21-04-51Z
          platform_machine_class: apple-silicon
    nano-lora-finetune:
      model: nanogpt-small-86m + LoRA(rank=8, alpha=16, target=c_attn)
      base_params: 88.3M
      trainable_params: 294912
      trainable_ratio_pct: 0.334
      functional_check:
        metric: base_grad_norm
        condition: frozen base parameters keep zero gradient while LoRA adapter gradients
          are nonzero
        reference_runs: 5
        reviewer_notes:
        - This is a systems workload for PEFT overhead and memory studies, not a task-accuracy
          benchmark.
      scenario: training
      public:
        status: systems-only
        rationale: Measures PEFT systems cost with frozen-base checks; task data and
          accuracy are synthetic scaffold elements, so it is not score-bearing.
      runner:
        min: mlperf.runners.extended:run_nano_lora_min
        max: mlperf.runners.extended:run_nano_lora_max
      provenance: 'Iter-7 (Han): LoRA fine-tuning workload demonstrating PEFT. Random-init
        backbone (random training data) — measures the SYSTEMS cost of LoRA, not task
        accuracy. Base parameters genuinely frozen (smoke verifies base_grad_norm
        == 0).'
      regime:
        working_set:
          value: dram_bound
        arithmetic_intensity:
          value: unmeasured
        dispatch:
          value: unmeasured
    nano-moe-train:
      model: nano-moe-12m
      params: 17.4M
      dataset: tinyshakespeare
      dataset_source: Project Gutenberg eBook 100, generated MLPerf EDU tiny Shakespeare
        excerpt, character-level, 1.1MB
      quality_target:
