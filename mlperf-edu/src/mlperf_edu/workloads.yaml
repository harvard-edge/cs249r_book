          sweep.
      measurement_protocol:
        primary_metric: inference_and_evaluation_seconds
        scenario: offline
        timing_scope: cross-encoder scoring and official reranking evaluation for
          50 queries and 100 candidate documents in each of three NanoBEIR datasets
        included_phases:
        - tokenization of query-document pairs
        - batched PyTorch cross-encoder execution
        - score sorting and MAP, MRR@10, and nDCG@10 computation
        excluded_phases:
        - dataset and model fetching
        - Parquet loading and sample construction
        - model construction and one untimed warmup for each scoring batch shape
        - report and provenance serialization
        device_synchronization: synchronize immediately before and after the measured
          inference-and-evaluation region
        outer_reference_runs: 5
        repeatability_metric: inference_and_evaluation_seconds
        repeatability_limit: 0.05
      canonical_max_contract:
        mode: inference
        model_id: cross-encoder/ms-marco-MiniLM-L6-v2
        model_revision: c5ee24cb16019beea0893ab7796b1df96625c6b8
        dataset: sentence-transformers/NanoBEIR-en
        dataset_revision: beb106fbcfaa599c508c667041bf8c85fd78736b
        splits:
        - NanoMSMARCO
        - NanoNFCorpus
        - NanoNQ
        data_mode: real
        evaluator: CrossEncoderNanoBEIREvaluator-equivalent pinned local-data adapter
        evaluator_version: sentence-transformers-5.5.1
        config:
          queries_per_dataset: 50
          rerank_k: 100
          at_k: 10
          always_rerank_positives: true
          batch_size: 32
        quality:
          metric: mean_ndcg_at_10
          metric_key: mean_ndcg_at_10
          target: 0.60716840988382
          direction: higher
        published_secondary_metrics:
          mean_map: 0.5531
          mean_mrr_at_10: 0.6401
      scenario: offline
      public:
        status: experimental
        rationale: Official compact MS MARCO MiniLM cross-encoder, pinned three-dataset
          NanoBEIR bundle, official evaluator semantics, and published exact baseline;
          claims remain withheld until reproduction and five-run laptop evidence are
          complete.
      runner:
        min: mlperf.runners.retrieval:run_information_retrieval_min
        max: mlperf.runners.retrieval:run_information_retrieval_max
      provenance:
        authority: Sentence Transformers and BEIR
        model: https://huggingface.co/cross-encoder/ms-marco-MiniLM-L6-v2
        evaluator: https://sbert.net/docs/package_reference/cross_encoder/evaluation.html
        dataset: https://huggingface.co/datasets/sentence-transformers/NanoBEIR-en
