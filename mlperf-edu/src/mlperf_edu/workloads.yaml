suites:
  language:
    causal-language-modeling:
      model: nanogpt-shakespeare-char
      params: 10.77M
      dataset: tinyshakespeare
      dataset_source: Exact Tiny Shakespeare corpus and 90/10 character split from
        the pinned nanoGPT recipe
      task: causal-language-modeling
      modes:
      - training
      - inference
      implemented_modes:
      - training
      - inference
      default_mode: training
      phases:
        inference:
        - full
        - prefill
        - decode
      default_phase: full
      quality_target:
        metric: cross_entropy_loss
        value: 1.4697
        direction: lower
        target_basis: literature
        tolerance: 0.0
        reference_runs: 0
        reviewer_notes:
        - The target is nanoGPT's published best validation loss for the pinned Shakespeare
          character configuration.
        - Promotion requires an exact local reproduction and a committed five-run
          training sweep.
      measurement_protocol:
        primary_metric: train_and_eval_seconds
        scenario: training
        timing_scope: pinned nanoGPT 5,001-step training loop including scheduled
          train and validation loss estimation
        included_phases:
        - forward and backward passes
        - optimizer steps
        - gradient clipping
        - scheduled train and validation evaluation
        - learning-rate schedule
        excluded_phases:
        - dataset fetching and encoding
        - model construction
        - checkpoint serialization
        - report and provenance serialization
        device_synchronization: synchronize immediately before and after the measured
          training-and-evaluation region
        outer_reference_runs: 5
        repeatability_metric: train_and_eval_seconds
        repeatability_limit: 0.05
      canonical_max_contract:
        mode: training
        model_id: nanogpt-shakespeare-char
        dataset: tinyshakespeare
        dataset_source_sha256: sha256:86c4e6aa9db7c042ec79f339dcb96d42b0075e16b8fc2e86bf0ca57e2dc565ed
        data_mode: real
        upstream_repository: https://github.com/karpathy/nanoGPT
        upstream_commit: 3adf61e154c3fe3fca428ad6bc3818b27a3b8291
        upstream_files:
          config/train_shakespeare_char.py: sha256:9b41cdfb2c917259d796a8184d835221a349c23cd18a0a63b46da431d95d9c05
          model.py: sha256:7c01703240dbec5d554527dc666e35b3df8391d0b117fddc07afcf325a21d11c
          train.py: sha256:413bd97b40bb400a2a0d01230e2946f056c263ebac1b7281c2367d964a123085
          data/shakespeare_char/prepare.py: sha256:d5fbea0686d146748cf36017d6c34136a2fe9c41f065f1429529ad55a992c692
        config:
          random_seed: 1337
          vocab_size: 65
          n_layer: 6
          n_head: 6
          n_embd: 384
          dropout: 0.2
          bias: true
          batch_size: 64
          block_size: 256
          max_iters: 5000
          eval_interval: 250
          eval_iters: 200
          learning_rate: 0.001
          min_lr: 0.0001
          warmup_iters: 100
          beta2: 0.99
          weight_decay: 0.1
          grad_clip: 1.0
        quality:
          metric: cross_entropy_loss
          metric_key: cross_entropy_loss
          target: 1.4697
          direction: lower
      mode_contracts:
        inference:
          dataset: prompt-suite-local
          dataset_source: Versioned deterministic prompts maintained by MLPerf EDU
            for phase-level systems measurement
          checkpoint_source:
            workload: causal-language-modeling
            mode: training
            profile: max
            required_quality_pass: true
          phases:
            full:
              scenario: single_stream
              measurement_protocol:
                primary_metric: output_tokens_per_sec
                warmup_runs: 3
                measured_runs: 20
                outer_reference_runs: 5
                repeatability_metric: output_tokens_per_sec
                repeatability_limit: 0.05
                latency_statistics:
                - median
                - p90
                - p99
                timing_scope: complete autoregressive requests including prompt prefill,
                  first-token selection, and 63 subsequent cached-token steps
              config:
                prefill_context: 192
                decode_steps: 64
                batch_size: 1
              quality:
                metric: decode_steps
                metric_key: decode_steps
                target: 64
                direction: equal
              timing_sample_counts:
                prefill_latency_samples_s: 20
                request_ttft_samples_s: 20
                itl_samples_s: 1260
                request_end_to_end_samples_s: 20
            prefill:
              scenario: offline
              measurement_protocol:
                primary_metric: prefill_tokens_per_sec
                warmup_runs: 3
                measured_runs: 20
                outer_reference_runs: 5
                repeatability_metric: prefill_tokens_per_sec
                repeatability_limit: 0.05
                latency_statistics:
                - median
                - p90
                - p99
                timing_scope: synchronized forward passes that materialize a fresh
                  KV cache for one fixed 256-token prompt
              config:
                context_length: 256
                batch_size: 1
              quality:
                metric: prefill_tokens_per_sec
                metric_key: prefill_tokens_per_sec
                target: 0.0
                direction: higher
              timing_sample_counts:
                prefill_latency_samples_s: 20
            decode:
              scenario: single_stream
              measurement_protocol:
                primary_metric: output_tokens_per_sec
                warmup_runs: 3
                measured_runs: 20
                outer_reference_runs: 5
                repeatability_metric: output_tokens_per_sec
                repeatability_limit: 0.05
                latency_statistics:
                - median
                - p90
                - p99
                timing_scope: cached autoregressive token generation after a fixed
                  192-token prefill
              config:
                prefill_context: 192
                decode_steps: 64
                batch_size: 1
              quality:
                metric: decode_steps
                metric_key: decode_steps
                target: 64
                direction: equal
              timing_sample_counts:
                prefill_latency_samples_s: 20
                request_ttft_samples_s: 20
                itl_samples_s: 1260
                request_end_to_end_samples_s: 20
      scenario: training
      public:
        status: experimental
        rationale: Pinned nanoGPT Shakespeare character workload with training and
          inference under one identity; claims remain withheld until the exact upstream
          loss and multi-run laptop baselines are reproduced.
      runner:
        min: mlperf.runners.nanogpt:run_causal_language_modeling_min
        max: mlperf.runners.nanogpt:run_causal_language_modeling_max
      provenance:
        authority: nanoGPT upstream repository
        repository: https://github.com/karpathy/nanoGPT
        commit: 3adf61e154c3fe3fca428ad6bc3818b27a3b8291
        adaptation: The model geometry, initialization, corpus recipe, optimizer,
          learning-rate schedule, evaluation cadence, and published validation-loss
          contract are inherited from upstream. MLPerf EDU adds selectable modes and
          phases, KV-cache inference, measurement, provenance, and reporting.
      regime:
        working_set:
          value: unmeasured
          note: Classification is withheld until a reference-platform measurement
            exists.
        arithmetic_intensity:
          value: unmeasured
          note: Classification is withheld until a reference-platform measurement
            exists.
        dispatch:
          value: unmeasured
          note: Classification is withheld until a synchronized utilization trace
            exists.
