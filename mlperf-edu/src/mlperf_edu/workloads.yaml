        direction: lower
        target_basis: mlcommons_derived
        tolerance: 0.0
        reference_runs: 0
        reviewer_notes:
        - The PatchTST paper reports 0.290 MSE, with standard deviation 0.002, for
          the 336-step context and 96-step forecast horizon.
        - MLPerf inference benchmarks commonly require 99% of reference quality. For
          a lower-is-better error metric, MLPerf EDU applies the direction-aware equivalent,
          reference MSE divided by 0.99, yielding 0.29292929292929293.
        - The derivation is recorded explicitly because applying the MLPerf quality
          fraction to a lower-is-better metric is an MLPerf EDU policy inference,
          not a PatchTST-authored threshold.
        - The corresponding published MAE is 0.342; it is reported as a secondary
          metric rather than a second admission gate.
        - Promotion still requires every canonical run to meet the derived gate and
          a committed five-run timing sweep.
