      quality_target:
        metric: hit_rate_at_10
        value: 0.635
        direction: higher
        target_basis: literature
        target_kind: inherited_acceptance_gate
        tolerance: 0.0
        reference_runs: 0
        acceptance_runs: 1
        reviewer_notes:
        - The target is the MLPerf Training v0.5 recommendation quality target of
          0.635 HR@10 for Neural Collaborative Filtering on MovieLens-20M. It is inherited,
          not project-created.
        - MLPerf retired the NCF recommendation benchmark after v0.5 because MovieLens-20M
          was too small to differentiate datacenter-scale systems. That property is
          what makes it appropriate here, and it is the same historical-MLPerf basis
          on which MiniGo is retained as the reinforcement-learning identity.
        - This replaces the DLRM and Criteo Terabyte contract, which could not execute
          inside the declared laptop envelope. That contract required manually licensed
          1 TB data, a roughly 90 GB checkpoint, and a 256 GB-class runtime.
        - The substitution changes what the workload teaches. NCF exercises embedding
          lookup and dense interaction, but its categorical cardinality is far below
          Criteo's, so it does not expose the memory-capacity wall that motivated
          DLRM. Record that limitation rather than implying equivalence.
        - The parameter count is dominated by the user and item embedding tables and
          is left unverified until the runner constructs the model and reports it.
          Do not publish an estimated count.
        - ? HR@10 is evaluated leave-one-out against 999 sampled negatives per user,
            for 1000 candidates per user. The count is part of the metric, not a tuning
            knob
          : re-scoring one trained checkpoint at 100 negatives gives 0.9336 and at
            999 gives 0.5474, so a smaller candidate set makes the published target
            trivially beatable. An initial draft of this contract used 100, the convention
            from the original NCF paper on smaller datasets, and produced an implausible
            first-epoch pass. A held-out-item leakage check over 500 sampled users
            found 0 contaminated users, confirming the split itself is sound and the
            candidate count was the sole cause.
        published_reference_value: 0.635
