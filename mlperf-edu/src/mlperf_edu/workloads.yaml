    nanogpt-train:
      model: nanogpt-12m
      params: 11.5M
      params_note: Char-level vocab=128 (TinyShakespeare uses 65 unique chars). Earlier
        README/paper figures of 85.9M and 124.4M reflected a vocab=50,257 BPE config
        that was never reachable from the char-level data; iteration 1 reconciled
        the model to its actual effective size. As built (vocab=128, n_embd=384, n_head=6,
        n_layer=6, max_seq_len=2048, tied wte/lm_head) the base model instantiates
        11,483,136 parameters; re-derive this figure if the base max_seq_len changes.
      dataset: tinyshakespeare
      dataset_source: Project Gutenberg eBook 100, generated MLPerf EDU tiny Shakespeare
        excerpt, character-level, 1.1MB
      quality_target:
        metric: cross_entropy_loss
        value: 2.3
        direction: lower
        target_basis: reference_runs
        tolerance: 0.0
        reference_runs: 5
        variance_summary:
          runs: 5
          statistic: median
          acceptance_rule: median validation loss must be <= target
          spread_note: Reference runs were stable enough for classroom use; fresh
            cleaned-model provenance remains a release follow-up.
        reference_protocol:
          profile: max
          backend: pytorch-cpu reference path unless the report declares a different
            backend
          machine_class: laptop-class CPU or laptop-class accelerator with full hardware
            fingerprint
          dataset_mode: fetched Project Gutenberg Shakespeare source with deterministic
            TinyShakespeare excerpt recipe, fixed tokenizer, split, and seed; no synthetic
            fallback
          seeds:
          - 0
          - 1
          - 2
          - 3
          - 4
          aggregation: median validation loss across five independent reference runs
          artifact_policy: preserve JSON, HTML, CSV, .provd.json, run fingerprint,
            dataset asset metadata, and raw metric values for each run
          rerun_policy: rerun all five references when model code, dataset preprocessing,
            optimizer schedule, PyTorch major version, or target hardware class changes
        reviewer_notes:
        - Baseline satisfies the target through val_loss; cleaned 11M model still
          needs fresh reference-run provenance before release.
        - Seed mismatch pending resolution with the reference-sweep provenance decision;
          the runner default scoring seed is 42 (MLPERF_EDU_MAX_SEED) and produced
          the verified_baseline, while reference_protocol.seeds [0-4] describe the
          intended five-seed sweep that has not yet been run. Each run's actual seed
          is recorded in the report's top-level seed field.
      verified_baseline:
        train_loss: 1.958
        val_loss: 2.045
        epochs: 25
        time_seconds: 86.4
        baseline_note: Single-seed Apple MPS default run (runner default seed 42)
          on the Project Gutenberg generated tiny excerpt; target remains provisional
          until the five-seed reference sweep.
      scenario: single_stream
      scenario_note: single_stream is an MLPerf Inference label carried here only
        because the harness currently requires score-bearing workloads to use single_stream,
        offline, or server. This workload is a fixed-budget train-then-quality-gate
        loop and its provenance manifest records scenario "train"; relabeling it (for
        example train_to_quality) needs a harness-level scenario vocabulary change.
      public:
        status: score-bearing
        rationale: Uses a deterministic TinyShakespeare excerpt generated from Project
          Gutenberg with an explicit cross-entropy target, making it suitable for
          classroom training correctness and public performance reporting.
      runner:
        min: mlperf.runners.nanogpt:run_min
        max: mlperf.runners.nanogpt:run_max
      min_profile_note: The min profile is a plumbing-only execution smoke; it trains
        a ~17.9K-parameter toy (n_embd=32, n_head=4, n_layer=1) on synthetic random
        tokens and never instantiates the ~11.5M scored architecture or the real dataset.
        Only the max profile exercises the scored model and quality target.
      provenance: Vaswani et al. 2017 (Transformer); maps to MLPerf Training GPT-3/LLaMA
      regime:
        working_set:
          value: unmeasured
          peak_bytes_per_step: 67108864
          note: Per-layer activation peak ~12 MB at B=16 T=64. Training reads all
            ~46 MB of fp32 weights and writes gradients plus Adam moment state on
            every optimizer step (~100 steps per epoch at the defaults), so per-epoch
            weight traffic is roughly 100x the weight bytes plus optimizer-state traffic,
            not a single per-epoch stream. Per-step resident set falls in the 6-48
            MB grey band; exact classification depends on batch size and caching behavior
            — measure with cache-miss counters.
        arithmetic_intensity:
          value: compute_bound
          flops_per_byte: 121.747
          classification_rule: intensity 121.75 vs [low 13.71, high 54.84]; util 0.222
            vs [dispatch 0.25, sat 0.5]
          evidence_sidecar: roofline/nanogpt-train_2026-04-16T21-02-31Z_17c2a18fb5ec.json
          evidence_sha256_short: 2be2e6231554
          measured_at: 2026-04-16T21-02-31Z
          platform_machine_class: apple-silicon
        dispatch:
          value: dispatch_bound
          note: Training-loop dispatch needs a roofline-emitter run; logged for iter
            5.
          utilization: 0.2225
          achieved_bw_gbps: 26.419
          classification_rule: intensity 121.75 vs [low 13.71, high 54.84]; util 0.222
            vs [dispatch 0.25, sat 0.5]
          evidence_sidecar: roofline/nanogpt-train_2026-04-16T21-02-31Z_17c2a18fb5ec.json
          evidence_sha256_short: 2be2e6231554
          measured_at: 2026-04-16T21-02-31Z
          platform_machine_class: apple-silicon
  slm:
    slm-decode:
      suite: slm
      model: SmolLM2-135M-Instruct
      default_variant: true
      params: 135M
      model_source:
        type: huggingface
        default_model_id: HuggingFaceTB/SmolLM2-135M-Instruct
        default_alias: smollm2-135m
        license: Apache-2.0
        aliases:
          smollm2-135m: HuggingFaceTB/SmolLM2-135M-Instruct
          qwen2.5-0.5b: Qwen/Qwen2.5-0.5B-Instruct
          qwen3-0.6b: Qwen/Qwen3-0.6B
        selection_rationale: SmolLM2-135M-Instruct is the default because it is Apache-2.0,
          public on Hugging Face, small enough for laptop CPU/MPS setup runs, and
          large enough to exercise Transformer decode, KV-cache, quantization, batching,
          and long-context behavior.
        size_rationale: 135M parameters keeps default downloads and local inference
          practical for coursework while still creating measurable memory, prefill,
          and decode behavior for systems studies.
        backend_rationale: The Transformers/PyTorch path works across CPU, MPS, and
          CUDA and avoids vendor-specific runtimes in the default path; optional backends
          can be compared as variants later.
        alias_rationales:
          smollm2-135m: Default local SLM for quick, permissive, laptop-friendly serving
            experiments.
          qwen2.5-0.5b: Larger permissive Qwen-family option for sensitivity studies
            when the machine can tolerate slower runs and larger downloads.
          qwen3-0.6b: Newer compact Qwen-family option for optional model-family comparisons;
