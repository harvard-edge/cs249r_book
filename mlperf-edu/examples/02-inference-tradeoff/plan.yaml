schema: mlperf-edu-experiment-plan/0.3
id: classroom-inference-tradeoff
title: Classroom image-classification inference tradeoff
description: Compare one baseline and one candidate batch size on the same machine.
profile: pro
power: false
keep_going: true
study:
  question: What happens to throughput and quality when inference batch size changes?
  hypothesis: A larger batch improves throughput while preserving top-1 accuracy.
  independent_variables:
    - MLPERF_EDU_IMAGE_CLASSIFICATION_MAX_BATCH_SIZE
  controls:
    - MLPerf Tiny float ResNet8 checkpoint
    - MLPerf Tiny CIFAR-10 accuracy subset
    - quality evaluator and target
    - execution device
  analysis_metrics:
    - top-1 accuracy
    - samples per second
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/02-inference-tradeoff
  open_report: false
edit_policy:
  allowed_candidate_environment:
    candidate-batch-64:
      - MLPERF_EDU_IMAGE_CLASSIFICATION_MAX_BATCH_SIZE
runs:
  - name: baseline-batch-16
    role: baseline
    workload: image-classification
    mode: inference
    environment:
      MLPERF_EDU_IMAGE_CLASSIFICATION_MAX_BATCH_SIZE: 16
  - name: candidate-batch-64
    role: candidate
    workload: image-classification
    mode: inference
    environment:
      MLPERF_EDU_IMAGE_CLASSIFICATION_MAX_BATCH_SIZE: 64
