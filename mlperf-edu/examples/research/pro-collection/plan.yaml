schema: mlperf-edu-experiment-plan/0.3
id: image-batch-size-study
title: Image-classification batch-size study
description: Compare two controlled batch sizes under one pinned quality contract.
profile: pro
power: false
keep_going: true
study:
  question: How does inference batch size affect throughput on this system?
  hypothesis: The larger batch will improve throughput without changing accuracy.
  independent_variables:
    - MLPERF_EDU_IMAGE_CLASSIFICATION_MAX_BATCH_SIZE
  controls:
    - MLPerf Tiny float ResNet8 checkpoint
    - MLPerf Tiny CIFAR-10 accuracy subset
    - execution device
    - quality evaluator and target
  analysis_metrics:
    - accuracy
    - samples per second
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/research/image-batch-size-study
  open_report: false
runs:
  - name: batch-16
    role: baseline
    workload: image-classification
    mode: inference
    environment:
      MLPERF_EDU_IMAGE_CLASSIFICATION_MAX_BATCH_SIZE: 16
  - name: batch-64
    role: candidate
    workload: image-classification
    mode: inference
    environment:
      MLPERF_EDU_IMAGE_CLASSIFICATION_MAX_BATCH_SIZE: 64
