schema: mlperf-edu-experiment-plan/0.3
id: classroom-training-tradeoff
title: NanoGPT learning-rate study
description: Compare the pinned baseline learning rate with one candidate value.
profile: pro
power: false
keep_going: true
study:
  question: Does a lower peak learning rate preserve the published validation-loss gate?
  hypothesis: The candidate will train more conservatively but may miss the fixed gate.
  independent_variables:
    - MLPERF_EDU_MAX_LR
  controls:
    - NanoGPT base architecture
    - Tiny Shakespeare split
    - training steps and evaluation schedule
    - random seed
    - validation-loss target
  analysis_metrics:
    - best validation loss
    - training tokens per second
defaults:
  device: auto
  repetitions: 1
output:
  directory: submissions/03-training-tradeoff
  open_report: false
edit_policy:
  allowed_candidate_environment:
    candidate-lr-7e-4:
      - MLPERF_EDU_MAX_LR
runs:
  - name: baseline-lr-1e-3
    role: baseline
    workload: causal-language-modeling
    mode: training
    environment:
      MLPERF_EDU_MAX_LR: 0.001
  - name: candidate-lr-7e-4
    role: candidate
    workload: causal-language-modeling
    mode: training
    environment:
      MLPERF_EDU_MAX_LR: 0.0007
