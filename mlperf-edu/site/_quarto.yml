project:
  type: website
  output-dir: _build

website:
  title: "MLPerf EDU"
  description: "A runnable, pedagogical ML systems benchmark suite aligned with MLCommons MLPerf."
  site-url: https://mlsysbook.ai/mlperf-edu
  repo-url: https://github.com/harvard-edge/cs249r_book
  repo-subdir: mlperf-edu/site
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Getting Started"
        href: getting-started.qmd
      - text: "User Guide"
        href: guide/running.qmd
      - text: "Benchmarks"
        href: benchmarks/index.qmd
      - text: "Reference"
        href: reference/cli.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/harvard-edge/cs249r_book
        aria-label: GitHub
  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - index.qmd
      - getting-started.qmd
      - section: "User Guide"
        contents:
          - guide/running.qmd
          - guide/results.qmd
          - guide/sut-plugins.qmd
          - guide/instructors.qmd
      - section: "Benchmarks"
        contents:
          - benchmarks/index.qmd
          - section: "Agent Systems"
            contents: benchmarks/agent/*
          - section: "Distributed Training"
            contents: benchmarks/distributed/*
          - section: "Graph Learning"
            contents: benchmarks/graph/*
          - section: "Language Modeling"
            contents: benchmarks/language/*
          - section: "Recommendation"
            contents: benchmarks/recommender/*
          - section: "Reinforcement Learning"
            contents: benchmarks/rl/*
          - section: "SLM Serving"
            contents: benchmarks/slm/*
          - section: "Time Series"
            contents: benchmarks/timeseries/*
          - section: "TinyML"
            contents: benchmarks/tiny/*
          - section: "Vision"
            contents: benchmarks/vision/*
      - section: "Reference"
        contents:
          - reference/cli.qmd
          - reference/datasets.qmd
      - about.qmd
  page-footer:
    center: >-
      MLPerf EDU is developed alongside the
      [Machine Learning Systems](https://mlsysbook.ai) textbook.
      Benchmark pages are generated from the workload registry.

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    code-copy: true
    link-external-newwindow: true
