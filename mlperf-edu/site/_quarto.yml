project:
  type: website
  output-dir: _build

website:
  title: "MLPerf EDU"
  description: "An independent, runnable preview of a pedagogical ML systems benchmark suite."
  site-url: https://mlsysbook.ai/mlperf-edu
  repo-url: https://github.com/harvard-edge/cs249r_book
  repo-subdir: mlperf-edu/site
  page-navigation: true
  announcement:
    icon: exclamation-triangle
    dismissable: false
    content: "**Independent preview.** MLPerf EDU is not an official MLCommons benchmark and is not endorsed by MLCommons."
    type: warning
    position: below-navbar
  navbar:
    background: primary
    search: true
    left:
      - text: "Getting Started"
        href: getting-started.qmd
      - text: "User Guide"
        href: guide/running.qmd
      - text: "Classroom Labs"
        href: labs/index.qmd
      - text: "Benchmarks"
        href: benchmarks/index.qmd
      - text: "Readiness"
        href: readiness.qmd
      - text: "Reference"
        href: reference/cli.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/harvard-edge/cs249r_book
        aria-label: GitHub
  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - index.qmd
      - getting-started.qmd
      - readiness.qmd
      - section: "User Guide"
        contents:
          - guide/running.qmd
          - guide/results.qmd
          - text: "Lab 2 SUT Interface"
            href: guide/sut-plugins.qmd
          - guide/instructors.qmd
      - section: "Classroom Labs"
        contents:
          - labs/index.qmd
          - labs/01-health-check.qmd
          - labs/02-inference-tradeoff.qmd
          - labs/03-training-tradeoff.qmd
          - labs/04-result-comparison.qmd
          - labs/05-assignment-package.qmd
      - section: "Benchmarks"
        contents:
          - benchmarks/index.qmd
          - section: "Graph Learning"
            contents: benchmarks/graph/*
          - section: "Language Modeling"
            contents: benchmarks/language/*
          - section: "Recommendation"
            contents: benchmarks/recommendation/*
          - section: "Reinforcement Learning"
            contents: benchmarks/reinforcement/*
          - section: "Time Series"
            contents: benchmarks/timeseries/*
          - section: "TinyML"
            contents: benchmarks/tiny/*
          - section: "Vision"
            contents: benchmarks/vision/*
      - section: "Reference"
        contents:
          - reference/cli.qmd
          - reference/datasets.qmd
      - about.qmd
  page-footer:
    center: >-
      MLPerf EDU is an independent preview developed alongside the
      [Machine Learning Systems](https://mlsysbook.ai) textbook. It is not
      affiliated with or endorsed by MLCommons. Benchmark pages are generated
      from the workload registry.

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    code-copy: true
    link-external-newwindow: true
