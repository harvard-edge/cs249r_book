# MLPerf EDU dataset catalog
#
# Every entry below is referenced by at least one workload in registry/suites/.
# Public-result assets also have structured dossiers in src/mlperf/assets.py.
# Systems-only assets remain listed so their source and release-review state are
# visible, even when the current runner uses a deterministic micro-shard.

datasets:
  cartpole_local:
    display_name: MLPerf EDU CartPole environment
    description: Deterministic, pure-Python CartPole environment based on the OpenAI Gym physics specification.
    uri: mlperf-edu://bundled/cartpole
    estimated_size_mb: 0.0
    split: deterministic_rollout
    license: Project component license pending
    license_status: project-license-pending
    public_release_status: systems-only-review-pending

  cifar10:
    display_name: CIFAR-10
    description: Image-classification data used by the systems-only micro-diffusion workload.
    uri: torchvision://CIFAR10
    estimated_size_mb: 170.0
    split: train/test
    license: Official dataset page requests citation but does not state a software-style license
    license_status: source-citation-no-license
    public_release_status: systems-only-review-pending

  cora:
    display_name: Cora
    description: Citation-network data used by the systems-only graph-learning workload.
    uri: https://linqs-data.soe.ucsc.edu/public/lbc/cora.tgz
    estimated_size_mb: 0.5
    split: full_graph
    license: Release review pending
    license_status: needs-review
    public_release_status: systems-only-review-pending

  etth1:
    display_name: ETTh1
    description: Hourly electricity-transformer temperature series used by the systems-only forecasting workload.
    uri: https://raw.githubusercontent.com/zhouhaoyi/ETDataset/main/ETT-small/ETTh1.csv
    estimated_size_mb: 0.9
    split: train/validation/test
    license: Release review pending
    license_status: needs-review
    public_release_status: systems-only-review-pending

  fashion-mnist:
    display_name: Fashion-MNIST
    description: Image-classification data used by the score-bearing ResNet-18 and MobileNetV2 candidates.
    uri: torchvision://FashionMNIST
    estimated_size_mb: 31.0
    split: train/test
    license: MIT License
    license_status: mit
    public_release_status: public-ok-with-attribution

  mbpp:
    display_name: Mostly Basic Python Problems subset
    description: Curated local programming problems and unit tests used by the systems-only code-generation workload.
    uri: mlperf-edu://bundled/mbpp-subset
    estimated_size_mb: 0.1
    split: deterministic_subset
    license: Source and component license review pending
    license_status: needs-review
    public_release_status: systems-only-review-pending

  mnist:
    display_name: MNIST
    description: Handwritten-digit data used by the score-bearing anomaly-detection candidate.
    uri: torchvision://MNIST
    estimated_size_mb: 66.5
    split: train/test
    license: Creative Commons Attribution-ShareAlike 3.0
    license_status: cc-by-sa-3.0
    public_release_status: public-ok-with-attribution

  movielens-100k:
    display_name: MovieLens 100K
    description: Ratings data used by the recommender workloads.
    uri: https://files.grouplens.org/datasets/movielens/ml-100k.zip
    estimated_size_mb: 16.1
    split: train/test
    license: GroupLens dataset terms
    license_status: noncommercial-research-education
    public_release_status: restricted-needs-approval

  prompt-suite-local:
    display_name: MLPerf EDU deterministic prompt suite
    description: Bundled token and chat prompts used for inference functional checks.
    uri: mlperf-edu://bundled/prompts
    estimated_size_mb: 0.0
    split: deterministic
    license: Project component license pending
    license_status: bundled-project-asset
    public_release_status: public-ok-bundled

  react_traces:
    display_name: MLPerf EDU ReAct traces
    description: Bundled deterministic reasoning and tool-use traces for systems-only agent workloads.
    uri: mlperf-edu://bundled/react-traces
    estimated_size_mb: 0.1
    split: deterministic
    license: Project component license pending
    license_status: project-license-pending
    public_release_status: systems-only-review-pending

  speech_commands_v2:
    display_name: Speech Commands v2
    description: Keyword-spotting audio used by the systems-only DS-CNN workload.
    uri: torchaudio://SPEECHCOMMANDS
    estimated_size_mb: 2400.0
    split: train/validation/test
    license: Creative Commons Attribution 4.0
    license_status: cc-by-4.0
    public_release_status: systems-only-with-attribution

  sst2:
    display_name: Stanford Sentiment Treebank 2
    description: Binary sentiment data used by the systems-only micro-BERT workload.
    uri: mlperf-edu://checkout/data/sst2
    estimated_size_mb: 3.8
    split: train/validation
    license: Release review pending
    license_status: needs-review
    public_release_status: systems-only-review-pending

  tinyshakespeare:
    display_name: Tiny Shakespeare
    description: Deterministic tiny corpus generated from Project Gutenberg eBook 100 for NanoGPT training.
    uri: https://www.gutenberg.org/files/100/100-0.txt
    estimated_size_mb: 1.1
    split: train/validation
    license: Public domain in the United States; Project Gutenberg trademark terms apply
    license_status: public-domain-us
    public_release_status: public-ok-fetch-only

  wake_vision:
    display_name: Wake Vision
    description: Visual wake-word data used by the systems-only micro-CNN workload.
    uri: huggingface://Harvard-Edge/Wake-Vision
    estimated_size_mb: 6000.0
    split: train/validation/test
    license: Release review pending
    license_status: needs-review
    public_release_status: systems-only-review-pending
