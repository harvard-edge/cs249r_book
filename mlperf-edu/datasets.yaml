# MLPerf EDU dataset catalog
#
# Every entry below is referenced by at least one workload in registry/suites/.
# Public-result assets also have structured dossiers in src/mlperf/assets.py.
# Systems-only assets remain listed so their source and release-review state are
# visible, even when the current runner uses a deterministic micro-shard.

datasets:
  cifar10:
    display_name: CIFAR-10
    description: Pinned CIFAR-10 test split selected by the official MLPerf Tiny 200-sample ResNet8 accuracy index.
    uri: https://huggingface.co/datasets/uoft-cs/cifar10/tree/0b2714987fa478483af9968de7c934580d0bb9a2
    estimated_size_mb: 23.9
    split: mlperf_tiny_200_sample_accuracy_set
    license: Official dataset page requests citation but does not state a software-style license
    license_status: source-citation-no-license
    public_release_status: needs-release-decision

  ogbn-arxiv:
    display_name: OGB ogbn-arxiv
    description: Official paper-citation node-classification graph with the OGB time-based split and evaluator.
    uri: https://snap.stanford.edu/ogb/data/nodeproppred/arxiv.zip
    estimated_size_mb: 83.2
    split: official_time_train_validation_test
    license: OGB and Microsoft Academic Graph-derived data terms require release review
    license_status: ogb-terms-review-required
    public_release_status: needs-release-decision

  ettm1:
    display_name: ETTm1
    description: Pinned minute-level electricity-transformer temperature series used by the official PatchTST forecasting recipe.
    uri: https://raw.githubusercontent.com/zhouhaoyi/ETDataset/1d16c8f4f943005d613b5bc962e9eeb06058cf07/ETT-small/ETTm1.csv
    estimated_size_mb: 10.0
    split: official_12_month_train_4_month_validation_4_month_test
    license: ETTDataset repository is GPL-3.0; dataset-specific redistribution terms require release review
    license_status: source-license-release-review-required
    public_release_status: needs-release-decision

  prompt-suite-local:
    display_name: MLPerf EDU deterministic prompt suite
    description: Bundled token and chat prompts used for inference functional checks.
    uri: mlperf-edu://bundled/prompts
    estimated_size_mb: 0.0
    split: deterministic
    license: Project component license pending
    license_status: bundled-project-asset
    public_release_status: public-ok-bundled

  mlperf-tiny-kws-eval:
    display_name: MLPerf Tiny keyword-spotting accuracy set
    description: One thousand fixed 49 by 10 INT8 MFCC examples used by the MLPerf Tiny DS-CNN quality contract.
    uri: https://github.com/eembc/benchmark-runner-ml
    estimated_size_mb: 4.1
    split: accuracy
    license: MLCommons and EEMBC release review required; source audio is Speech Commands v2 under CC BY 4.0
    license_status: mlcommons-review-required
    public_release_status: needs-release-decision

  sst2:
    display_name: Stanford Sentiment Treebank 2
    description: Official GLUE binary-sentiment development split used by the pinned DistilBERT text-classification workload.
    uri: https://dl.fbaipublicfiles.com/glue/data/SST-2.zip
    estimated_size_mb: 24.5
    split: train/validation
    license: Source citation is established; redistribution terms require release review
    license_status: source-citation-no-license
    public_release_status: needs-release-decision

  nanobeir-reranking:
    display_name: NanoBEIR English reranking subset
    description: Official BM25 top-100 candidates, corpora, queries, and relevance judgments for NanoMSMARCO, NanoNFCorpus, and NanoNQ.
    uri: https://huggingface.co/datasets/sentence-transformers/NanoBEIR-en/tree/beb106fbcfaa599c508c667041bf8c85fd78736b
    estimated_size_mb: 6.0
    split: NanoMSMARCO_NanoNFCorpus_NanoNQ
    license: Apache-2.0 repository metadata; component source datasets retain their original licenses
    license_status: component-licenses-release-review-required
    public_release_status: needs-release-decision

  tinyshakespeare:
    display_name: Tiny Shakespeare
    description: Exact 1,115,394-character corpus and 90/10 split used by nanoGPT's Shakespeare character configuration.
    uri: https://raw.githubusercontent.com/karpathy/char-rnn/6f9487a6fe5b420b7ca9afb0d7c078e37c1d1b4e/data/tinyshakespeare/input.txt
    estimated_size_mb: 1.1
    split: train/validation
    license: Upstream char-rnn repository is MIT; underlying Shakespeare text is public domain in the United States
    license_status: mit-repository-public-domain-text
    public_release_status: public-ok-fetch-only
