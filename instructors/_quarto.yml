# =============================================================================
# INSTRUCTOR HUB
# =============================================================================
# Syllabi, shared materials, and teaching guidance for courses built on
# MLSysBook. Course descriptions live in the separate /courses/ site.
# Part of the MLSysBook ecosystem: mlsysbook.ai/instructors/
# =============================================================================

project:
  type: website
  output-dir: _build
  post-render:
    - python3 ../shared/scripts/resolve-draft-links.py _build instructors

website:
  title: "Instructor Hub"
  description: "MLSysBook course plans, syllabi, teaching materials, and instructor guidance."
  site-url: https://mlsysbook.ai/instructors/
  favicon: assets/images/logo.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  # Shared navbar from navbar-common.yml; site-local dropdown merged by Quarto.
  navbar:
    logo: assets/images/logo.png
    search: true
    title: "Machine Learning Systems"
    left:
      - text: "Instructor Hub"
        menu:
          - icon: map
            text: "Courses"
            href: ./index.qmd#courses
          - text: "---"
          - text: "Introduction to ML Systems"
            href: foundations-syllabus.qmd
          - text: "Scaling ML Systems"
            href: scale-syllabus.qmd
          # unreleased:start (Volumes III and IV, staging only)
          - text: "Agentic AI"
            href: agentic-syllabus.qmd
          - text: "Physical AI"
            href: vol4/index.qmd
          # unreleased:end
          - text: "Edge AI"
            href: edge-ai-syllabus.qmd
          - text: "TinyML"
            href: tinyml-syllabus.qmd

  sidebar:
    style: "floating"
    search: true
    collapse-level: 2
    contents:
      - text: "Instructor Hub"
        href: index.qmd
      - section: "Courses"
        href: index.qmd
        contents:
          - text: "Introduction to ML Systems"
            href: foundations-syllabus.qmd
          - text: "Scaling ML Systems"
            href: scale-syllabus.qmd
          # unreleased:start (Volumes III and IV, staging only)
          - text: "Agentic AI"
            href: agentic-syllabus.qmd
          - text: "Physical AI"
            href: vol4/index.qmd
          # unreleased:end
          - text: "Edge AI"
            href: edge-ai-syllabus.qmd
          - text: "TinyML"
            href: tinyml-syllabus.qmd
      - text: "Course Catalog"
        href: https://mlsysbook.ai/courses/

  # Footer — ecosystem pattern
  # page-footer comes from shared/config/footer-common.yml (via metadata-files)

metadata-files:
  - ../shared/config/navbar-common.yml
  - ../shared/config/footer-common.yml
  - config/announcement.yml

format:
  html:
    theme:
      light:
        - default
        - ../shared/styles/style-site.scss
      dark:
        - default
        - ../shared/styles/style-site.scss
        - ../shared/styles/dark-mode-site.scss
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    code-copy: true
    anchor-sections: true
    include-in-header:
      - file: ../shared/config/site-head.html
      - text: |
          <!-- Release identity (rendered into the footer pill below). -->
          <meta name="release-manifest" content="/instructors/release-manifest.json">
    include-after-body:
      - file: ../shared/release/release-pill.html

execute:
  freeze: auto
