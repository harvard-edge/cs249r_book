# =============================================================================
# THE AI ENGINEERING BLUEPRINT: COURSE IN A BOX
# =============================================================================
# Everything an instructor needs to teach AI Engineering.
# Part of the MLSysBook ecosystem: mlsysbook.ai/instructors/
# =============================================================================

project:
  type: website
  output-dir: _build
  post-render:
    - python3 ../shared/scripts/resolve-draft-links.py _build instructors

website:
  title: "Instructor Hub"
  description: "MLSysBook course plans, syllabi, teaching materials, and instructor guidance."
  site-url: https://mlsysbook.ai/instructors/
  favicon: assets/images/logo.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  # Shared navbar from navbar-common.yml; site-local dropdown merged by Quarto.
  navbar:
    logo: assets/images/logo.png
    search: true
    title: "Machine Learning Systems"
    left:
      - text: "Instructor Hub"
        menu:
          - icon: map
            text: "Choose a Course"
            href: ./index.qmd#choose-course
          - text: "Getting Started"
            href: getting-started.qmd
          - text: "---"
          - text: "Foundations Syllabus"
            href: foundations-syllabus.qmd
          - text: "Scale Syllabus"
            href: scale-syllabus.qmd
          - text: "TinyML Syllabus"
            href: tinyml-syllabus.qmd
          - text: "Physical AI Instructor Guide"
            href: vol4/index.qmd
          - text: "---"
          - text: "Pedagogy"
            href: pedagogy.qmd
          - text: "Assessment & Grading"
            href: assessment.qmd
          - text: "TA Guide"
            href: ta-guide.qmd
          - text: "---"
          - text: "Course Map"
            href: course-map.qmd
          - text: "Customization"
            href: customization.qmd
          - text: "FAQ"
            href: faq.qmd

  sidebar:
    style: "floating"
    search: true
    collapse-level: 2
    contents:
      - section: "Start Here"
        contents:
          - text: "Instructor Hub"
            href: index.qmd
          - getting-started.qmd
          - course-map.qmd
      - section: "Syllabi"
        contents:
          - foundations-syllabus.qmd
          - scale-syllabus.qmd
          - tinyml-syllabus.qmd
          - customization.qmd
      - section: "Teaching & Assessment"
        contents:
          - pedagogy.qmd
          - assessment.qmd
          - ta-guide.qmd
          - text: "Physical AI Instructor Guide"
            href: vol4/index.qmd
      - section: "Resources"
        contents:
          - faq.qmd
          - text: "TinyTorch Instructor Guide"
            href: https://github.com/harvard-edge/cs249r_book/blob/dev/tinytorch/INSTRUCTOR.md

  # Footer — ecosystem pattern
  # page-footer comes from shared/config/footer-common.yml (via metadata-files)

metadata-files:
  - ../shared/config/navbar-common.yml
  - ../shared/config/footer-common.yml
  - config/announcement.yml

format:
  html:
    theme:
      light:
        - default
        - assets/styles/style.scss
      dark:
        - default
        - assets/styles/style.scss
        - assets/styles/dark-mode.scss
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    code-copy: true
    anchor-sections: true
    include-in-header:
      - file: ../shared/config/site-head.html
      - text: |
          <!-- Release identity (rendered into the footer pill below). -->
          <meta name="release-manifest" content="/instructors/release-manifest.json">
    include-after-body:
      - file: ../shared/release/release-pill.html

execute:
  freeze: auto
