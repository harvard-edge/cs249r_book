# =============================================================================
# ANNOUNCEMENT BAR CONFIGURATION - INSTRUCTOR HUB
# =============================================================================
# Unifying template (shared across all nine Quarto sites, 2026-04):
#   Line 1  — identity + primary CTA (what is THIS site)
#   Line 2  — the book
#   Line 3  — "Build with your students:" learner-tools row (3 lenses)
#   Line 4  — newsletter
#
# The Instructor Hub pairs with Slides (teacher tools) but instructors also
# need to know what their students will BUILD, so line 3 lists the three
# learner lenses with teacher-facing verbs.
# =============================================================================

website:
  announcement:
    icon: megaphone
    dismissable: true
    type: primary
    position: below-navbar
    content: |
      <span class="mls-ann-line">**Instructor Hub**: a syllabus for each course, with weekly readings and slides.</span>
      <span class="mls-ann-line">**The books:** [Introduction to Machine Learning Systems](https://mlsysbook.ai/vol1/) · [Scaling Machine Learning Systems](https://mlsysbook.ai/vol2/) (preview) · [Agentic Machine Learning Systems](https://mlsysbook.ai/vol3/) (in preparation) · [Physical AI](https://mlsysbook.ai/vol4/) (in preparation). All are open access.</span>
      <span class="mls-ann-line mls-ann-siblings">**Companion resources:** [TinyTorch](https://mlsysbook.ai/tinytorch/) (build) · [Hardware Kits](https://mlsysbook.ai/kits/) (deploy) · [MLSys·im](https://mlsysbook.ai/mlsysim/) (model) · [Labs](https://mlsysbook.ai/labs/) (explore) · [Lecture Slides](https://mlsysbook.ai/slides/) (teach) · [StaffML](https://mlsysbook.ai/staffml/) (practice) · [Newsletter](https://mlsysbook.ai/newsletter/)</span>
