<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Three-tier assessment: correctness, systems thinking, mastery">
  <rect width="680" height="352" fill="#ffffff" rx="6"/>
  <text x="340" y="34" font-size="17" fill="#1a1a2e" font-weight="700" text-anchor="middle">Three-tier assessment</text>
  <text x="340" y="55" font-size="12" fill="#5a6369" font-weight="400" text-anchor="middle">Each assignment is graded on three levels; higher tiers ask for deeper reasoning</text>
  <rect x="40" y="74" width="600" height="74" rx="8" fill="#fbeef0" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="74" width="5" height="74" fill="#A51C30" opacity="1"/>
  <text x="62" y="101" font-size="15" fill="#1a1a2e" font-weight="700" text-anchor="start">Mastery</text>
  <text x="62" y="120" font-size="12" fill="#5a6369" font-weight="500" text-anchor="start" font-style="italic">Can the student apply theory to new problems?</text>
  <text x="62" y="137" font-size="11" fill="#94a3b8" font-weight="500" text-anchor="start">Design challenges and the capstone</text>
  <text x="620" y="108" font-size="22" fill="#A51C30" font-weight="700" text-anchor="end">30%</text>
  <text x="620" y="128" font-size="11" fill="#5a6369" font-weight="500" text-anchor="end">Every two weeks</text>
  <rect x="40" y="156" width="600" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="156" width="5" height="74" fill="#A51C30" opacity="0.65"/>
  <text x="62" y="183" font-size="15" fill="#1a1a2e" font-weight="700" text-anchor="start">Systems thinking</text>
  <text x="62" y="202" font-size="12" fill="#5a6369" font-weight="500" text-anchor="start" font-style="italic">Does the student understand why?</text>
  <text x="62" y="219" font-size="11" fill="#94a3b8" font-weight="500" text-anchor="start">Decision Logs: short written justifications</text>
  <text x="620" y="190" font-size="22" fill="#A51C30" font-weight="700" text-anchor="end">30%</text>
  <text x="620" y="210" font-size="11" fill="#5a6369" font-weight="500" text-anchor="end">Weekly, TA-graded</text>
  <rect x="40" y="238" width="600" height="74" rx="8" fill="#f5f6f8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="238" width="5" height="74" fill="#A51C30" opacity="0.35"/>
  <text x="62" y="265" font-size="15" fill="#1a1a2e" font-weight="700" text-anchor="start">Correctness</text>
  <text x="62" y="284" font-size="12" fill="#5a6369" font-weight="500" text-anchor="start" font-style="italic">Can the student implement the logic?</text>
  <text x="62" y="301" font-size="11" fill="#94a3b8" font-weight="500" text-anchor="start">Auto-graded TinyTorch tests and lab answers</text>
  <text x="620" y="272" font-size="22" fill="#A51C30" font-weight="700" text-anchor="end">40%</text>
  <text x="620" y="292" font-size="11" fill="#5a6369" font-weight="500" text-anchor="end">Weekly, automated</text>
  <text x="340" y="336" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="middle" font-style="italic">Weights are a recommended split of a 100-point assignment.</text>
</svg>
