  <text x="130" y="184" font-size="11" fill="#1a1a2e" font-weight="500" text-anchor="middle">One variable at a time</text>
  <rect x="52" y="198" width="156" height="24" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="130" y="214" font-size="11" fill="#1a1a2e" font-weight="500" text-anchor="middle">Narrow parameter range</text>
  <rect x="52" y="228" width="156" height="24" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
