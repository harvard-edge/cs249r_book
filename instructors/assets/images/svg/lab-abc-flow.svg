  <text x="550" y="278" font-size="10" fill="#A51C30" font-weight="700" text-anchor="middle">Goal</text>
  <text x="550" y="294" font-size="10.5" fill="#5a6369" font-weight="500" text-anchor="middle" font-style="italic">Engineer under constraints</text>
  <line x1="40" y1="338" x2="636" y2="338" stroke="#5a6369" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="40" y="356" font-size="11" fill="#5a6369" font-weight="600" text-anchor="start">More guidance</text>
  <text x="640" y="356" font-size="11" fill="#5a6369" font-weight="600" text-anchor="end">More independence</text>
