  <text x="340" y="184" font-size="11" fill="#1a1a2e" font-weight="500" text-anchor="middle">Competing trade-offs</text>
  <rect x="262" y="198" width="156" height="24" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="214" font-size="11" fill="#1a1a2e" font-weight="500" text-anchor="middle">Wider parameter range</text>
