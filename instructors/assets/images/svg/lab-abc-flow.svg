<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Lab structure: calibration, integration, design challenge">
  <rect width="680" height="372" fill="#ffffff" rx="6"/>
