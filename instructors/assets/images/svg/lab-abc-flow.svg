  <text x="130" y="278" font-size="10" fill="#A51C30" font-weight="700" text-anchor="middle">Goal</text>
  <text x="130" y="294" font-size="10.5" fill="#5a6369" font-weight="500" text-anchor="middle" font-style="italic">Isolate one Iron Law term</text>
  <line x1="224" y1="194" x2="246" y2="194" stroke="#5a6369" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="250" y="76" width="180" height="236" rx="10" fill="#fbeef0" stroke="#e2e8f0" stroke-width="1"/>
