<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Read, build, explore, deploy cycle">
  <rect width="680" height="262" fill="#ffffff" rx="6"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6369"/></marker></defs>
  <text x="340" y="34" font-size="17" fill="#1a1a2e" font-weight="700" text-anchor="middle">Four kinds of work for each major concept</text>
  <text x="340" y="55" font-size="12" fill="#5a6369" font-weight="400" text-anchor="middle">The introductory and scaling courses move each idea through the same cycle</text>
  <rect x="40" y="74" width="130" height="72" rx="8" fill="#fbeef0" stroke="#A51C30" stroke-width="1.5"/>
  <text x="105" y="105" font-size="15" fill="#A51C30" font-weight="700" text-anchor="middle">Read</text>
  <text x="105" y="125" font-size="11" fill="#5a6369" font-weight="500" text-anchor="middle">Textbook chapter</text>
  <line x1="174" y1="110.0" x2="199" y2="110.0" stroke="#5a6369" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="203" y="74" width="130" height="72" rx="8" fill="#fbeef0" stroke="#A51C30" stroke-width="1.5"/>
  <text x="268" y="105" font-size="15" fill="#A51C30" font-weight="700" text-anchor="middle">Build</text>
  <text x="268" y="125" font-size="11" fill="#5a6369" font-weight="500" text-anchor="middle">TinyTorch module</text>
  <line x1="337" y1="110.0" x2="362" y2="110.0" stroke="#5a6369" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="366" y="74" width="130" height="72" rx="8" fill="#fbeef0" stroke="#A51C30" stroke-width="1.5"/>
  <text x="431" y="105" font-size="15" fill="#A51C30" font-weight="700" text-anchor="middle">Explore</text>
  <text x="431" y="125" font-size="11" fill="#5a6369" font-weight="500" text-anchor="middle">Interactive lab</text>
  <line x1="500" y1="110.0" x2="525" y2="110.0" stroke="#5a6369" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="529" y="74" width="130" height="72" rx="8" fill="#ffffff" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="594" y="105" font-size="15" fill="#A51C30" font-weight="700" text-anchor="middle">Deploy</text>
  <text x="594" y="125" font-size="11" fill="#5a6369" font-weight="500" text-anchor="middle">Hardware kit</text>
  <text x="594" y="139" font-size="9.5" fill="#94a3b8" font-weight="500" text-anchor="middle" font-style="italic">optional</text>
  <path d="M594.0,150 V172 H105.0 V152" fill="none" stroke="#5a6369" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="248" y="162" width="184" height="20" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/>
  <text x="340" y="176" font-size="11" fill="#5a6369" font-weight="500" text-anchor="middle">measure, then revisit the reading</text>
  <rect x="40" y="198" width="600" height="50" rx="6" fill="#f5f6f8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="218" font-size="11.5" fill="#1a1a2e" font-weight="700" text-anchor="middle">Example: quantization</text>
  <text x="340" y="236" font-size="11" fill="#5a6369" font-weight="500" text-anchor="middle">read the compression chapter → implement INT8 in TinyTorch → measure it in a lab → run it on a board</text>
</svg>
