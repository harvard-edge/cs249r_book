<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
    <rect width="900" height="300" fill="#ffffff" />
    <text x="450" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1F407A" text-anchor="middle">Compounding Covariate Shift and State Support Drift</text>

    <!-- Graph A: Trajectory -->
    <g transform="translate(50, 60)">
        <rect width="380" height="200" fill="#E2E8F0" rx="4" />
        <text x="190" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D3748" text-anchor="middle">(a) State-Space Trajectory</text>
        
        <!-- Axes -->
        <path d="M 30 170 L 350 170" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow-dark)"/>
        <path d="M 30 170 L 30 50" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow-dark)"/>
        
        <!-- Nominal Support -->
        <path d="M 30 140 L 330 140" stroke="#1F407A" stroke-width="20" stroke-opacity="0.2" fill="none" />
        <path d="M 30 140 L 330 140" stroke="#1F407A" stroke-width="2" stroke-dasharray="4" fill="none" />
        
        <!-- Trajectory -->
        <path d="M 30 140 Q 100 140 150 140 Q 200 135 250 90 Q 300 40 330 20" stroke="#A51C30" stroke-width="3" fill="none" />
        
        <!-- Error Point -->
        <circle cx="150" cy="140" r="5" fill="#A51C30" />
        <text x="150" y="160" font-family="sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">Error at t=τ</text>
        
        <text x="280" y="155" font-family="sans-serif" font-size="10" fill="#1F407A">Support S_demo</text>
        <text x="260" y="80" font-family="sans-serif" font-size="10" fill="#A51C30">Quadratic Drift</text>
    </g>

    <!-- Graph B: Cumulative Error -->
    <g transform="translate(470, 60)">
        <rect width="380" height="200" fill="#E2E8F0" rx="4" />
        <text x="190" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D3748" text-anchor="middle">(b) Cumulative Error Scaling</text>
        
        <!-- Axes -->
        <path d="M 30 170 L 350 170" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow-dark)"/>
        <path d="M 30 170 L 30 50" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow-dark)"/>
        
        <!-- Lines -->
        <path d="M 30 170 Q 150 170 330 30" stroke="#A51C30" stroke-width="3" fill="none" />
        <path d="M 30 170 L 330 120" stroke="#1F407A" stroke-width="3" fill="none" />
        
        <text x="250" y="60" font-family="sans-serif" font-size="12" fill="#A51C30">Cloning: O(T²ϵ)</text>
        <text x="250" y="115" font-family="sans-serif" font-size="12" fill="#1F407A">Recovery: O(Tϵ)</text>
    </g>

    <defs>
        <marker id="arrow-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D3748" />
        </marker>
    </defs>
</svg>
