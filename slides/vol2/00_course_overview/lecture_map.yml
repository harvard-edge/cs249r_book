    why: "Lecture 1 owns them (course plan, hardest ownership call 4); Lecture 0 names the scaling price and shows a^N only as a true-or-false check."

closing:
  return_to_hook: "Synthesis table: where GPT-3's other 80 percent of peak can go, by Fleet Law term and lecture (compute: 2, 6; communication: 3, 5; coordination: 7, 8; goodput: 9)."
  read_and_practice: ["Introduction §1.1 to §1.7", "Appendix A self-check (take-home)"]
  further_reading:
    - cite: "Introduction, §1.1 to §1.7"
      url: "https://mlsysbook.ai"
      why: "The argument and the numbers used today."
    - cite: "Barroso, Hölzle, and Ranganathan, The Datacenter as a Computer, 3rd ed., 2019"
      url: "https://doi.org/10.1007/978-3-031-01761-2"
      why: "The datacenter as one computer."
    - cite: "Kaplan et al., Scaling Laws for Neural Language Models, 2020"
      url: "https://arxiv.org/abs/2001.08361"
      why: "The scaling price."
    - cite: "Dubey et al., The Llama 3 Herd of Models, 2024"
      url: "https://arxiv.org/abs/2407.21783"
      why: "The running case's infrastructure and interruptions."
    - cite: "Patterson et al., Carbon Emissions and Large Neural Network Training, 2021"
      url: "https://arxiv.org/abs/2104.10350"
      why: "The GPT-3 run in the hook."
    - cite: "Dean and Barroso, The Tail at Scale, Communications of the ACM, 2013"
      url: "https://doi.org/10.1145/2408776.2408794"
      why: "Why the slowest part sets the pace."
  bridge: "Lecture 1 (Introduction): Why does adding machines not divide the time?"

