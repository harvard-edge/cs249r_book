  - concept: "Scale moment"
    frame: "Landmark runs grew from 2 GPUs to 16,384 GPUs"
    shown_by: "accelerator-count plot, 2 to 16,384"
  - concept: "Scaling laws as the demand curve"
    frame: "Predict: how much does twice the compute lower loss?"
    shown_by: "loss against compute multiple, 0.966 per doubling, 0.71 at 1,024x"
  - concept: "Bandwidth hierarchy dictates placement (teaser)"
    frame: "Moving 10 GB takes 3 ms in HBM and 200 ms between nodes"
    shown_by: "three-step staircase bars; concept question on which exchange stays inside the node"
  - concept: "Fleet failure rate"
    frame: "Worked example: one GPU lasts years, the job stops every 3 hours"
    shown_by: "MTTF/N arithmetic and failure-clock bars, model against Llama 3 measured"
