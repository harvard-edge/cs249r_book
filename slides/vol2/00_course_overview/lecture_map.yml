chapter: 00_course_overview
lecture: "00"
title: Course Overview
subtitle: "Engineering the fleet behind one large model"
minutes: 75
notes_minutes: 71
core_minutes: 58.5   # notes tagged [CORE] (title note counted); cutting every [OPTIONAL] note leaves this
target_ideas: 24
thesis: "When one model needs thousands of accelerators, the network, failures, and power of the whole fleet decide how long it takes, what it costs, and whether it runs at all."

# Role (author decision, 2026-10-19): Lecture 0 is the motivational overview of
# the course. It shows why the subject matters now, what a fleet is, what
# students will be able to do, and how the course runs, and it poses two
# predictions the course answers later. It teaches no mechanism and repeats
# nothing Lecture 1 teaches, and it reveals no later lecture's hook answer.

hook:
  minutes: "0-6"
  setup: "An A100 card on the slide. GPT-3 needed about 3.14e23 operations; one A100 peaks at 312 TFLOP/s. Students predict the single-accelerator time; then the real run, about 10,000 V100s for about 15 days, beside a photo of the Alps machine hall."
  question_to_class: "Predict: GPT-3 on one A100 at full speed? (A) 3 months, (B) 3 years, (C) 30 years, (D) 300 years."
  payoff: "C, about 32 years against about 15 days on the fleet. The delivered fraction of peak is not shown (Lecture 1 and Lecture 9 own efficiency measures); the synthesis returns to the hall and names the lecture that answers each question the day raised."
  sources:
    - "Introduction §1.1 and footnote 6 (Brown et al. 2020; Patterson et al. 2021); images/calcs.py"
    - "Photo: Marco Abram, CSCS, CC BY-SA 3.0, Wikimedia Commons"
driving_question: "Why does one model now need a fleet, and what will this course teach you to do with one?"
running_example: "BLOOM-176B (BigScience, 2022) through its own public files: 384 A100 80 GB GPUs in 48 nodes with 32 in reserve, 11 March to 28 June 2022 (109 days, derived), the Slurm launch script at commit ed196cd, and the team's checkpoint note. Alps (CSCS, 10,752 Grace Hopper superchips) carries the facility; ChatGPT's 800 million weekly users carry serving. None of the three is used as a dataset by another Volume II lecture except BLOOM's carbon (Lecture 15), which Lecture 0 previews in one line only."

segments:
  - name: Why Now
    divider: "Why does this subject matter now?"
    read: "Introduction, §1.1"
    minutes: 14.5
    concept_questions: [1, 2, 3, 4, 5]
    land: "Training and serving one model now takes thousands of accelerators."
  - name: The Fleet
    divider: "What is a fleet, and what problems does it create?"
    read: "Introduction, §1.1 and §1.6"
    minutes: 17.5
    concept_questions: [6, 7, 8, 9, 10]
    land: "A fleet joins accelerators, links, storage, and a building into one job, and its team plans for failure from the first line of the launch script."
  - name: Outcomes
    divider: "What will you be able to do?"
    read: "Preface; Introduction, §1.7"
    minutes: 7.5
    concept_questions: [11]
    land: "Every outcome ends in a number a student can defend."
  - name: The Course
    divider: "How does the course run?"
    read: "Preface; Introduction, §1.6"
    minutes: 16
    concept_questions: [12, 13, 14]
    land: "Seventeen lectures climb an eight-row stack in four parts, and C³ names what each decision spends."
  - name: First Taste
    divider: "What will the course answer?"
    read: "Introduction, §1.1"
    minutes: 14.5
    concept_questions: [15]
    land: "Two predictions on a card, answered in Lectures 1 and 7."

concept_questions:
  - id: 1
    q: "How long would one accelerator take to train GPT-3?"
    picture: "A100 card photo (predict); log bars of 32 years against 15 days beside the Alps hall photo."
    numbers: "3.14e23 / 312e12 = 1.0e9 s, 31.9 years; 3.14e23 / (10,000 x 24.6e12) = 14.8 days (both derived, calcs.py; inputs Introduction §1.1, footnote 6, Patterson et al. 2021). The 24.6 TFLOP/s input is used only to reproduce the chapter's 15 days; the slide does not state the fraction of peak."
    example: "GPT-3 (2020)."
    read: "§1.1"
  - id: 2
    q: "How large have training runs become?"
    picture: "Landmark accelerator counts, 2012 to 2024, log axis, with a fitted trend (redrawn from Introduction figure 2)."
    numbers: "AlexNet 2, Megatron-LM 512, GPT-3 about 10,000 (estimate, Langston 2020), PaLM 6,144, LLaMA 1 2,048, DeepSeek-V3 2,048, Llama 3 16,384 (MLSysIM). Fit 1.93x per year, shown as about 2x (derived)."
    example: "Llama 3 405B."
    read: "§1.1"
  - id: 3
    q: "What does a modern fleet look like? [OPTIONAL frame]"
    picture: "Photo of Alps's open liquid-cooled racks beside one big number."
    numbers: "10,752 NVIDIA Grace Hopper superchips; inaugurated 14 September 2024; sixth on the June 2024 Top500 (ETH Zurich press release, 14 September 2024)."
    example: "Alps, CSCS, Lugano."
    read: "outside source"
  - id: 4
    q: "How much traffic does a fleet serve?"
    picture: "Aerial photo of Ashburn datacenters beside two big numbers."
    numbers: "More than 800 million weekly ChatGPT users and over 6 billion API tokens per minute (S. Altman, OpenAI DevDay, 6 October 2025, as reported by TechCrunch); about 1.0e8 tokens per second (derived)."
    example: "ChatGPT."
    read: "outside source"
  - id: 5
    q: "What must hold for 10,752 chips to act as one? (discussion)"
    picture: "Alps hall photo."
    numbers: "none; students' answers are grouped into the course's parts."
    example: "Alps."
    read: "§1.1"
  - id: 6
    q: "What is a fleet made of?"
    picture: "Three photos: H100 cards, InfiniBand switch cables, a datacenter cooling tower; [OPTIONAL] three more for serving, phones, and obligations."
    numbers: "none"
    example: "The fleet as the unit of engineering (named, not taught)."
    read: "§1.1, §1.6"
  - id: 7
    q: "What did a real fleet job use?"
    picture: "A100 photo beside an exact excerpt of the BLOOM tr11-176B-ml README (hardware and chronology)."
    numbers: "416 A100 80 GB in 52 nodes, 384 used in 48 nodes, 32 in reserve; started 11 March 2022, epoch one finished 28 June 2022; 109 days (derived)."
    example: "BLOOM-176B."
    read: "outside source (BigScience README)"
  - id: 8
    q: "How many GPU-hours did BLOOM's first pass use? (estimate)"
    picture: "Given card and four choices."
    numbers: "384 x 109 x 24 = 1,004,544 GPU-hours, about 1.0 million; about 115 years on one GPU (derived)."
    example: "BLOOM-176B."
    read: "outside source"
  - id: 9
    q: "What does a fleet job's launch script decide?"
    picture: "Eight exact lines of tr11-176B-ml.slurm at commit ed196cd, each tagged in steps with the lecture that teaches the decision."
    numbers: "--nodes=48, --gres=gpu:8, --time 100:00:00 (at least 27 relaunches over 109 days, derived), TP_SIZE=4, PP_SIZE=12 (48 GPUs per model copy, derived, note only), SAVE_INTERVAL=100, NCCL_ASYNC_ERROR_HANDLING=1."
    example: "BLOOM-176B."
    read: "outside source"
  - id: 10
    q: "How did a real team decide how often to save, and why keep spare GPUs?"
    picture: "Exact quote of the README checkpoint note; then the 32-of-416 reserve as a big number (discussion)."
    numbers: "about 2 min per iteration, 250 iterations about 8 h, about every 4 h (quoted); 32 of 416, 7.7 percent (derived)."
    example: "BLOOM-176B."
    read: "outside source"
  - id: 11
    q: "What will students be able to do by the end?"
    picture: "Four outcomes in a table, each with a text-free photo thumbnail and a real system; then a take-home self-check used as a 60-second in-class retrieval."
    numbers: "BLOOM-176B on 384 A100s; Llama 3 405B on 16,384 H100s (Dubey et al. 2024, via §1.1); 800M weekly users; a keyboard that learns on phones. Self-check note: H100 ridge 989 / 3.35 = 295 FLOP/byte (derived)."
    example: "Appendix A, Single-Machine Foundations."
    read: "Preface; §1.7; Appendix A"
  - id: 12
    q: "How is the course ordered?"
    picture: "Kit course_order [OPTIONAL]; the kit stack built one row per step, then each lecture on its row (stack_lectures), beside the Alps hall photo."
    numbers: "Eighteen lectures (0 to 17) in four parts; eight rows."
    example: "Each row tied to something seen today (Alps, cables, BLOOM's script, ChatGPT)."
    read: "§1.6"
  - id: 13
    q: "Which row does each real thing belong to? (sort)"
    picture: "Switch cables, cooling tower, BLOOM's SAVE_INTERVAL line, a phone."
    numbers: "none"
    example: "Fabric & Storage; Facility & Accelerators; Reliability & Control; Runtime & Serving."
    read: "§1.6"
  - id: 14
    q: "What organizes the course, and which workloads recur?"
    picture: "C³ named once with three real things (H100 cards, cables, BLOOM's faulty-node comment); three archetype cards with photos; how a lecture runs; logistics [OPTIONAL]."
    numbers: "A: 175B parameters, 2.8 TB (derived 175B x 16 bytes), 1,024 H100s. B: embedding tables 10 TB or more, about 10M queries/s. C: phones about 2 to 10 W (§1.6.1, table 3)."
    example: "C³ and the Fleet Law named, not taught; archetype bottlenecks left to Lecture 1."
    read: "§1.5 (named only), §1.6.1"
  - id: 15
    q: "What will the course answer?"
    picture: "Prediction cards 1 and 2; retrieval [OPTIONAL]; synthesis table of today's questions and their lectures beside the Alps hall; takeaways; open questions [OPTIONAL]; reading; next lecture."
    numbers: "BLOOM at 48 nodes, 96 hypothetical; 16,384 H100s (Llama 3 405B). No answers given."
    example: "Index cards kept until Lecture 1."
    read: "§1.1"

concept_trace: []   # Lecture 0 owns no concepts. It names C³ and the Fleet Law once (Lecture 1 owns them) and builds the stack as the course map (Lecture 1 teaches what the rows constrain).

worked_examples:
  - name: "GPT-3, one accelerator against the fleet (Introduction §1.1)"
    steps:
      - "Given: 3.14e23 operations; one A100 at 312 TFLOP/s; the real run on about 10,000 V100s."
      - "One A100: 3.14e23 / 312e12 = 1.0e9 s, about 32 years (derived)."
      - "The run: about 15 days (chapter; 14.8 derived)."
      - "Meaning: the fleet made the run possible; why it is not 10,000 times faster is Lecture 1's question."
  - name: "BLOOM's GPU-hours (estimate activity)"
    steps:
      - "Given: 384 GPUs; 11 March to 28 June 2022."
      - "109 days (derived from the dates)."
      - "384 x 109 x 24 = 1,004,544, about 1.0 million GPU-hours; about 115 GPU-years (derived)."
      - "Meaning: a run's energy, cost, and carbon scale with this number; Lecture 15 measures them."

active_learning:   # at_minute = cumulative note minutes at the start of the frame
  - at_minute: 1.5
    type: predict
    prompt: "GPT-3 on one A100 at full speed: 3 months, 3 years, 30 years, or 300 years?"
    answer: "C, about 32 years."
  - at_minute: 12
    type: discuss
    prompt: "One model trains on every chip in the Alps hall at once. List three things that must be true."
    answer: "Fast enough exchange between chips; surviving a chip's failure; power and cooling; a split of the model and data; data delivered in time; a scheduler granting all chips at once; regular saves. Grouped into the course's parts; nothing quantified."
  - at_minute: 21.5
    type: estimate
    prompt: "How many GPU-hours did BLOOM's first pass use? Given 384 GPUs for 109 days."
    answer: "C, about 1.0 million (1,004,544); about 115 years on one GPU."
  - at_minute: 30.5
    type: discuss
    prompt: "Why did BLOOM's team keep 32 of 416 GPUs in reserve?"
    answer: "Likely spares to replace failed nodes so the 48-node job restarts at full size without waiting for repair; the README states the reserve, not its reason. Not quantified (Lecture 7)."
  - at_minute: 38
    type: retrieval
    prompt: "Pick one of five single-machine questions and answer it in 60 seconds."
    answer: "Short answers in the note; Appendix A for anyone who cannot answer two or more."
  - at_minute: 47
    type: concept_question
    prompt: "Sort: switch cables, a cooling tower, BLOOM's SAVE_INTERVAL line, a phone. Which stack row?"
    answer: "Fabric & Storage; Facility & Accelerators; Reliability & Control; Runtime & Serving."
  - at_minute: 57
    type: predict
    prompt: "BLOOM on 96 nodes instead of 48: each step takes exactly half, a little more than half, much more than half, or longer?"
    answer: "Not revealed. Recorded on a card; Lecture 1's driving question; Lecture 6 shows how to move toward half."
  - at_minute: 60
    type: predict
    prompt: "How often does something stop a 16,384-GPU job: hours, days, weeks, or months?"
    answer: "Not revealed. Recorded on the same card; Lecture 1 opens by checking it and Lecture 7 explains it."
  - at_minute: 62.5
    type: retrieval
    prompt: "Close your notes: three things BLOOM's 384-GPU job needed that one GPU does not, and their rows."
    answer: "Links between nodes (Fabric & Storage); saves, spare nodes, a 100-hour slot (Reliability & Control); a split of the model (Distributed Execution); power and cooling (Facility & Accelerators)."

open_questions:   # none duplicates Lecture 1's open questions
  - "Should a university own a fleet, rent one, or share a national machine such as Alps?"
  - "BLOOM's team published its scripts and notes; most large runs publish little. What should a team disclose about how a model was trained?"
  - "When 800 million people a week use one service, who decides that a change is safe to ship?"

more_examples:
  - "BLOOM's switch from 48 to 24 nodes on 4 July 2022 (README chronology), for an instructor who wants a second real configuration change."
  - "The Microsoft supercomputer built for OpenAI in 2020, more than 10,000 GPUs (Langston 2020, Introduction §1.1)."
  - "Alps ranked sixth on the June 2024 Top500 list (ETH Zurich press release)."

left_to_later_lectures:   # what Lecture 0 deliberately does not show, and who owns it
  - item: "Fraction of peak delivered (GPT-3's about 20 percent), efficiency measures"
    owner: "Lecture 1 (naming the efficiency measure); Lecture 9 (goodput)"
  - item: "Growth decomposition (146 runs, 3.9x per year), scaling-law price, compute-optimal allocation"
    owner: "Lecture 1"
  - item: "Synchronous coupling and stragglers, the 9x bandwidth cliff, C³ classification of a step, the Fleet Law equation and the faster-accelerator fallacy, a^N"
    owner: "Lecture 1 (and Lecture 2 for the staircase)"
  - item: "Failure clock (MTTF/N, Llama 3's 419 interruptions and their causes)"
    owner: "Lecture 7 (hook); Lecture 1 recall"
  - item: "Rack power, 17.5 MW, Dublin grid connection"
    owner: "Lecture 2; Lecture 15 (hook)"
  - item: "Serving cost ($2M training against $18.25M serving)"
    owner: "Lecture 10 (hook)"
  - item: "Archetype bottlenecks by axis"
    owner: "Lecture 1"

