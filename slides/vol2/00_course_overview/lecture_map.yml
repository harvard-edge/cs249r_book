chapter: 00_course_overview
lecture: "00"
title: Course Overview
subtitle: Scaling Machine Learning Systems
minutes: 75
notes_minutes: 71
core_minutes: 60   # notes tagged [CORE] (title note counted); cutting every [OPTIONAL] note leaves this
target_ideas: 28
thesis: "When one model needs thousands of accelerators, the network, failures, and power of the whole fleet decide how long it takes, what it costs, and whether it runs at all."

hook:
  minutes: "0-6"
  setup: "An A100 card on the slide. GPT-3 needed about 3.14e23 FLOPs; the A100 peaks at 312 TFLOP/s. Students predict the single-accelerator time."
  question_to_class: "Predict: GPT-3 on one A100 at full speed? (A) 3 months, (B) 3 years, (C) 30 years, (D) 300 years."
  payoff: "C, about 32 years. The real run used about 10,000 V100s delivering about 24.6 TFLOP/s each (about 20 percent of peak) for about 15 days. The synthesis slide asks where the other 80 percent of peak went and maps each candidate to a Fleet Law term and the lectures that teach it."
  sources:
    - "Introduction §1.1 and footnote 6 (Brown et al. 2020; Patterson et al. 2021)"
driving_question: "Why does adding machines not divide the time, and what does the fleet charge in communication, failure, and power?"
running_example: "A frontier training run of Archetype A: GPT-3 (10,000 V100s, about 15 days) in the hook, then Llama 3 405B on 16,384 H100 GPUs (the top of the accelerator-count plot, the failure clock, 419 interruptions in 54 days and their root causes, about 11.5 MW of accelerator power, derived). The Fleet Law example uses the chapter's 2,048-GPU self-check step and says so on the slide."

segments:
  - name: Why a Fleet
    divider: "Why does one model now need thousands of accelerators?"
    read: "Introduction, §1.1 and §1.3"
    minutes: 16
    concept_questions: [1, 2, 3, 4]
  - name: Off One Machine
    divider: "What changes when a job leaves one machine?"
    read: "Introduction, §1.2; Compute Infrastructure, §2.5"
    minutes: 10
    concept_questions: [5, 6]
  - name: Failure and Power
    divider: "How often does a large job stop, and what limits a site?"
    read: "Introduction, §1.1 and §1.4.1"
    minutes: 13
    concept_questions: [7, 8]
  - name: Diagnosis
    divider: "Where does a distributed step lose its time?"
    read: "Introduction, §1.5"
    minutes: 13
    concept_questions: [9, 10]
  - name: The Stack
    divider: "What is a fleet made of?"
    read: "Introduction, §1.6"
    minutes: 11
    concept_questions: [11, 12]
  - name: The Course
    divider: "What will you be able to do?"
    read: "Preface; Introduction, §1.7"
    minutes: 9
    concept_questions: [13]

concept_questions:
  - id: 1
    q: "How long would one accelerator take to train GPT-3?"
    picture: "A100 card photo (predict); worked example with a Given card; Alps hall photo beside log bars of 32 years against 15 days."
    numbers: "3.14e23 FLOPs / 312 TFLOP/s = 1.0e9 s, about 32 years; 3.14e23 / (10,000 x 24.6e12) = 1.3e6 s, about 15 days (both derived; inputs Introduction §1.1, footnote 6, Patterson et al. 2021); 24.6 TFLOP/s is about 20 percent of V100 peak (§1.1)."
    example: "GPT-3 (2020)."
    read: "§1.1"
  - id: 2
    q: "How fast has the fleet grown?"
    picture: "Landmark accelerator counts, 2012 to 2024, log axis, with a fitted trend (redrawn from Introduction figure 2)."
    numbers: "AlexNet 2, Megatron-LM 512, GPT-3 about 10,000 (estimate, Langston 2020), PaLM 6,144, LLaMA 1 2,048, DeepSeek-V3 2,048, Llama 3 16,384 (MLSysIM Literature.TrainingRuns and model registry). Fit to the filled points: 1.93x per year, shown as about 2x (derived)."
    example: "Llama 3 405B, the running case."
    read: "§1.1"
  - id: 3
    q: "Where did the growth come from? [OPTIONAL]"
    picture: "Annual growth factors on a log axis, revealed one bar per step (redrawn from Introduction figure 1b)."
    numbers: "146 runs, 2012 to 2024: compute 3.9x per year = count 1.6x x duration 1.3x x delivered rate 2x; count and duration supply 51 percent (Introduction §1.1; Epoch AI 2026)."
    example: "The fleet's half of the exponent."
    read: "§1.1"
  - id: 4
    q: "Why do organizations keep paying for bigger fleets?"
    picture: "Predict, then loss against compute multiple on a log axis, with the 1,024x point."
    numbers: "Kaplan et al. 2020 compute fit, exponent -0.050: one doubling multiplies loss by 0.966 (Conclusion §17); 1,024x compute gives 0.71 (derived). Serving: $2M training against $18.25M first-year serving, 9.1x (Serving at Scale, Napkin Math 10.1; $0.001 per request is a scenario input) [OPTIONAL slide]."
    example: "Predictable but expensive returns; serving recurs."
    read: "§1.3; Serving at Scale §10.4"
  - id: 5
    q: "What changes when a job leaves one machine?"
    picture: "New SVG: four workers, compute then AllReduce; a second timeline with one worker 30 percent slower and three waiting (illustrative)."
    numbers: "Illustrative 30 percent straggler stretches the step 30 percent (labeled illustrative)."
    example: "One slow worker among 16,384."
    read: "§1.2.1"
  - id: 6
    q: "How much slower is it to move data between machines?"
    picture: "InfiniBand switch and cables photo beside the staircase bars (log)."
    numbers: "10 GB: HBM 3,350 GB/s 3.0 ms; NVLink 450 GB/s 22.2 ms; InfiniBand 50 GB/s 200 ms, 9x NVLink (Compute Infrastructure, Napkin Math 2.3; per direction)."
    example: "Concept question: activations inside every layer stay on NVLink; the once-per-step gradient may cross."
    read: "Compute Infrastructure §2.5.1"
  - id: 7
    q: "How often does a large job stop?"
    picture: "Predict; failure-clock bars (log); Llama 3 root-cause bars [OPTIONAL]; a^N curves for 99.9 and 99.99 percent nodes (true-or-false)."
    numbers: "MTTF 50,000 h (assumed, §1.1) / 16,384 = 3.05 h (derived); 54 x 24 / 419 = 3.1 h measured (Fault Tolerance War Story 7.2; Dubey et al. 2024); causes from Dubey et al. 2024 table 5 via Fault Tolerance figure 2 (148 faulty GPU, 72 HBM3, 54 software, 35 network, 32 host maintenance, 19 SRAM, 17 GPU system processor, 42 in 11 other causes); 0.999^1,000 = 36.8 percent, 0.999^10,000 = 0.0045 percent, 0.9999^10,000 = 36.8 percent (§1.4.1)."
    example: "Llama 3 405B, measured."
    read: "§1.1, §1.4.1; Fault Tolerance §7.3"
  - id: 8
    q: "What sets how much compute a site can install?"
    picture: "Alps racks with coolant hoses beside rack-power bars; The Dalles substation photo with 17.5 MW [OPTIONAL]."
    numbers: "Traditional rack 12 kW; four-node DGX H100 rack 33.5 kW including allocated cooling; liquid-cooled class 100 kW (Compute Infrastructure §2.6.2). 25,000 x 700 W = 17.5 MW accelerators only (Sustainable AI, Lighthouse 15.1); running case 16,384 x 700 W = 11.5 MW (derived, in the note). Dublin 2022 (War Story 15.1)."
    example: "Grid connection gated new Dublin facilities."
    read: "Compute Infrastructure §2.6.2; Sustainable AI §15.2"
  - id: 9
    q: "How do fleet engineers locate a bottleneck?"
    picture: "C3 axes as three cards built one per step, each with its evidence; then the diagnose bar (gray, then colored by axis)."
    numbers: "2,048 GPUs, 1.5 s step: 0.9 s matrix math, 0.4 s ring transfers, 0.2 s barrier waits (Introduction §1.5 self-check 1)."
    example: "Classify the three times."
    read: "§1.5"
  - id: 10
    q: "What is the Fleet Law, and what does a faster accelerator buy?"
    picture: "Focus slide with the law and its four terms labeled by axis; the step bars with a second row for 2x faster accelerators and the half-step mark."
    numbers: "1.5 s = 0.9 + 0.4 + 0.2 - 0; with compute halved 0.45 + 0.4 + 0.2 = 1.05 s, 1.43x (derived). Chapter scenario: 2x faster accelerators shorten a 29.2 s step by 2.1 percent (§1.8)."
    example: "Fallacy: faster accelerators always shorten the step (§1.8)."
    read: "§1.5.4, §1.8"
  - id: 11
    q: "What is a fleet made of?"
    picture: "Kit stack built one row per step; ninth step with each lecture's number on its row (deck figure stack_lectures on the kit's stack_build8 canvas)."
    numbers: "Eight rows in four parts (§1.6)."
    example: "L2 Facility; L3, L4 Fabric; L5, L6 Execution; L7, L8 Control; L9 to L11 Serving; L12 Operations; L13, L14 Assurance; L15, L16 Governance; L0, L1, L17 span the stack."
    read: "§1.6"
  - id: 12
    q: "Which workloads test the fleet?"
    picture: "Three archetype cards with their stressed axis; discussion slide [OPTIONAL]."
    numbers: "A: 175B parameters, 16 bytes per parameter = 2.8 TB, 1,024 H100s. B: embedding tables 10 TB or more, about 10M queries/s, under 100 ms tail. C: phones about 2 to 10 W (Introduction §1.6.1, table 3)."
    example: "Which wall each hits first at ten times the scale."
    read: "§1.6.1"
  - id: 13
    q: "What will students be able to do, and how does the course run?"
    picture: "Retrieval; synthesis table (where GPT-3's other 80 percent can go); kit course_order; four outcomes; take-home prerequisite self-check [OPTIONAL]; logistics card [OPTIONAL]; takeaways; open questions [OPTIONAL]; reading; next lecture."
    numbers: "Eighteen lectures (0 to 17) in four parts."
    example: "Appendix A self-check: iron law, ridge point (989 TFLOP/s / 3.35 TB/s = 295 FLOP/byte, derived), 16 bytes per parameter, batch-1 decode, FLOPs against FLOP/s."
    read: "Preface; §1.7; Appendix A"

