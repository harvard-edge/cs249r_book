worked_examples:
  - name: "GPT-3, from one accelerator to a fleet (Introduction §1.1)"
    steps:
      - "Given: 3.14e23 FLOPs; one A100 at 312 TFLOP/s; the real run, 10,000 V100s at about 24.6 TFLOP/s each."
      - "One A100: 3.14e23 / 312e12 = 1.0e9 s, about 32 years (derived)."
      - "The fleet: 3.14e23 / (1e4 x 24.6e12) = 1.3e6 s, about 15 days (derived)."
      - "Result: 24.6 TFLOP/s is about 20 percent of a V100's peak."
      - "Meaning: the fleet made the run possible and delivered about a fifth of its peak; the synthesis asks where the rest went."
  - name: "The failure clock (Introduction §1.1; Fault Tolerance War Story 7.2)"
    steps:
      - "Given: MTTF 50,000 h per GPU (assumed), independent failures, 16,384 GPUs."
      - "MTBF = MTTF / N = 3.05 h (derived)."
      - "Check: Llama 3, 54 days x 24 h / 419 interruptions = 3.1 h (derived from the measurement)."
      - "Caveat: measured causes include software, network, and host faults; agreement is in order of magnitude."
      - "Meaning: recovery must be automatic; Lecture 7 sets the checkpoint interval."
  - name: "Doubling accelerator speed under the Fleet Law (§1.5 self-check 1; §1.8)"
    steps:
      - "Given: 1.5 s = 0.9 s compute + 0.4 s communication + 0.2 s coordination, no overlap."
      - "Halve only compute: 0.45 + 0.4 + 0.2 = 1.05 s."
      - "Speedup 1.5 / 1.05 = 1.43x against 2x expected (derived)."
      - "Meaning: saved compute time waits on communication and coordination."

active_learning:   # at_minute = cumulative note minutes at the start of the frame
  - at_minute: 1.5
    type: predict
    prompt: "GPT-3 on one A100 at full speed: 3 months, 3 years, 30 years, or 300 years?"
    answer: "C, about 32 years."
  - at_minute: 13
    type: predict
    prompt: "How much does twice the compute lower loss? 50, 25, 10, or 3 percent?"
    answer: "D, about 3.4 percent (loss x 0.966 per doubling, Kaplan et al. 2020 fit)."
  - at_minute: 23
    type: concept_question
    prompt: "Which exchange must stay on NVLink: a full gradient once per step, overlapped, or smaller activations inside every layer on the critical path?"
    answer: "B, the per-layer activations; frequency and overlap, not size alone, decide (Compute Infrastructure, Napkin Math 2.3)."
  - at_minute: 26.5
    type: predict
    prompt: "How often does a 16,384-GPU job stop: every 3 years, 3 weeks, 3 days, or 3 hours?"
    answer: "Every 3 hours (3.05 h model; 3.1 h measured on Llama 3)."
  - at_minute: 32.5
    type: concept_question
    prompt: "True or false: 99.9 percent nodes make a reliable 1,000-node job."
    answer: "False: all 1,000 are up only 36.8 percent of the time."
  - at_minute: 41.5
    type: diagnose
    prompt: "Classify 0.9 s matrix math, 0.4 s ring transfers, 0.2 s barrier waits by C3 axis."
    answer: "Compute, communication, coordination."
  - at_minute: 48
    type: concept_question
    prompt: "Accelerators twice as fast: new step time 0.75, 1.05, 1.3, or 1.5 s?"
    answer: "1.05 s, 1.43x; only the compute term shrinks."
  - at_minute: 58.5
    type: discuss
    prompt: "A fleet ten times larger: which wall does each archetype hit first?"
    answer: "A the network; B coordination and the latency tail; C device power and participation. No single answer."
  - at_minute: 62
    type: retrieval
    prompt: "Close your notes: name the row for a 9x bandwidth drop, one interruption every 3 hours, and 17.5 MW of accelerator power; then the Fleet Law's four terms."
    answer: "Fabric & Storage; Reliability & Control; Facility & Accelerators. Compute over N + communication + synchronization - overlap."

open_questions:
  - "Which will limit the next frontier training run first: power, the network, failures, or data?"
  - "Should a fleet be built never to fail, or to recover quickly? Who decides how much work it may lose?"
  - "One foundation model serves thousands of products. When it is wrong, whose system failed?"

more_examples:
  - "The Microsoft supercomputer built for OpenAI in 2020, more than 10,000 GPUs (Langston 2020, Introduction §1.1)."
  - "Llama 3 405B: more than 90 percent effective training time despite 419 interruptions (Fault Tolerance War Story 7.2)."
  - "Megatron-LM at 52 percent of peak on 3,072 A100s (Narayanan et al. 2021, Introduction §1.3.2), named in the synthesis note."
  - "The Alps GPU system at CSCS (photos)."
  - "Dublin grid constraint, 2022 (Sustainable AI, War Story 15.1)."

left_to_reading:
