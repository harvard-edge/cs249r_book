notes_for_author:
  - "2026-10-19 rebuild to the author's Lecture 0 decision: motivational overview, no Lecture 1 content, no later hook answers. Removed the growth decomposition, scaling price, synchronous-step build, staircase and placement vote, failure clock and Llama 3 causes, a^N vote, rack power, 17.5 MW and Dublin, C3 diagnose bar, Fleet Law focus and 1.43x vote, serving cost, archetype bottleneck discussion, and GPT-3's fraction of peak."
  - "Lecture 1's recall slide asks 'How often did a 16,384-GPU job stop?' and answers 3.05 h as if Lecture 0 had shown it. Lecture 0 now only collects a prediction on that question (prediction 2). Suggest rewording Lecture 1's recall to 'Check prediction 2 on your Lecture 0 card' and keeping its 3.05 h reveal; its C3 recall still works (Lecture 0 names the three axes)."
  - "Outside numbers read from their sources on 2026-10-19: ETH Zurich press release PDF (10,752 Grace Hopper superchips, 14 September 2024, sixth on June 2024 Top500); TechCrunch, 6 October 2025, quoting Altman ('More than 800 million people use ChatGPT every week, and we process over 6 billion tokens per minute on the API'); BigScience tr11-176B-ml README (master) and tr11-176B-ml.slurm at commit ed196cd266 (19 June 2022, --nodes=48)."
  - "Every derived number is printed by images/calcs.py; make_figs.py now computes the GPT-3 bars from the same inputs and keeps only gpt3_days, cluster_counts, and stack_lectures."
  - "Optional share is about 18 percent of note minutes, below the 30 percent guideline, because an overview has few cuttable frames; cutting all optional notes leaves about 58.5 minutes with every activity but the closing retrieval."
  - "The kit course_order card subtitles are small at slide scale (legibility tool passes; same note as Volume I)."
  - "2026-10-19 sweep (D4, D10). D4: the goals slide names, once, the Fleet Law term (all four, named today) and C3 axis (all three) in the volume's one form (the \\fleetterm line). D10: X-not-Y constructions and reveal colons rewritten. No exhibit here is retold from another lecture (D3)."
