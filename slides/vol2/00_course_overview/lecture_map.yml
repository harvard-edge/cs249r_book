  read_and_practice: ["Introduction §1.1 to §1.7", "Appendix A self-check (take-home)", "Bring the prediction card to Lecture 1"]
  further_reading:
    - cite: "Introduction, §1.1 to §1.7"
      url: "https://mlsysbook.ai"
      why: "The argument behind today's map."
