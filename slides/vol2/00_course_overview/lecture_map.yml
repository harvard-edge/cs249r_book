notes_for_author:
  - "Every derived number on the slides and in the notes is computed and printed by images/calcs.py (inputs sourced in comments); figure values come from images/make_figs.py with the same inputs."
  - "Photo rhythm: no run of more than three frames without a credited photo or a real artifact (the C3 slide carries a short PyTorch torch.distributed sketch). Licenses re-checked on each Commons source page (images/SOURCES.yml)."
  - "2026-10-18, built from scratch. No layer key (spans the stack); no relationship-to-Volume-I slide; the cover is the credited Alps photo (CSCS), shown again on the fleet slide."
  - "Deviation from the course plan: concept question 3 (Kaplan curves) uses the compute-fit exponent quoted in the Conclusion (§17, -0.050, 0.966 per doubling) as a predict slide, since the book's Kaplan figure is drawn in the qmd and not available as a file."
  - "Deviation: the running case for failure and power is Llama 3 405B on 16,384 H100s (plan question 6 and thread 4), with the plan's 25,000-GPU 17.5 MW kept on the grid slide and 11.5 MW for Llama 3 derived in its note."
  - "Added the Llama 3 root-cause chart [OPTIONAL] as the running case's real-system evidence (Fault Tolerance figure 2, from Dubey et al. 2024 table 5). The chapter text's own category totals (268 GPU, 54, 35, 21) do not sum to 419; the slide uses only per-cause counts that appear in the figure caption plus the remainder (42), and the title's 220 = 148 + 72."
  - "The kit course_order card subtitles are small at slide scale; the same note was made for Volume I."
