notes_for_author:
  - "Example 8.2's table 9 mixes tiers: the A100-80 GB row reports allocated and active, the others allocated only, so the pool rows do not weight to the cluster-wide 60 and 84 percent (400 × 0.95 + 424 × 0.64 = 651 of 1,024, 64 percent allocated). The deck plots the table as printed and states the cluster row as the chapter's value."
  - "The Kalos trace's job-state split (61 percent of GPU time in canceled jobs) is computed from the AcmeTrace rows in MLSysIM; the chapter does not use it. It is shown as a measured illustration that job state is not productivity."
  - "The Kalos lower bound Cs >= 5.0 is derived here from size-class means (between-class variance only) and is labeled derived."
