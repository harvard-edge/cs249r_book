<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Arial, Helvetica, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#fff"/>

  <!-- Title -->
  <text x="450" y="30" font-size="14" font-weight="700" fill="#333" text-anchor="middle">Six Principles of Distributed ML Systems Engineering</text>

  <!-- ===== Principle Cards (2x3 grid, book order) ===== -->
  <!-- 1. Infrastructure Determines Capability -->
  <rect x="30" y="50" width="270" height="125" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <rect x="30" y="50" width="270" height="28" fill="#c87b2a"/>
  <rect x="30" y="68" width="270" height="10" fill="#c87b2a"/>
  <text x="165" y="69" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1. Infrastructure Determines Capability</text>
  <text x="165" y="100" font-size="9" fill="#333" text-anchor="middle">What is possible?</text>
  <text x="165" y="118" font-size="8.5" fill="#555" text-anchor="middle">FLOP/s, memory bandwidth, rack power</text>
  <text x="165" y="136" font-size="8" fill="#555" text-anchor="middle">Co-design hardware with algorithms</text>
  <text x="165" y="165" font-size="7.5" fill="#999" text-anchor="middle">Compute Infrastructure</text>

  <!-- 2. Communication Can Dominate -->
  <rect x="315" y="50" width="270" height="125" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <rect x="315" y="50" width="270" height="28" fill="#4a90c4"/>
  <rect x="315" y="68" width="270" height="10" fill="#4a90c4"/>
  <text x="450" y="69" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2. Communication Can Dominate</text>
  <text x="450" y="100" font-size="9" fill="#333" text-anchor="middle">What is the bottleneck?</text>
  <text x="450" y="118" font-size="8.5" fill="#555" text-anchor="middle">Exposed communication, scaling efficiency</text>
  <text x="450" y="136" font-size="8" fill="#555" text-anchor="middle">Ring AllReduce: 2(n-1)/n efficiency</text>
  <text x="450" y="165" font-size="7.5" fill="#999" text-anchor="middle">Collective Communication</text>

  <!-- 3. Failure Is Routine -->
  <rect x="600" y="50" width="270" height="125" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/>
  <rect x="600" y="50" width="270" height="28" fill="#c44"/>
  <rect x="600" y="68" width="270" height="10" fill="#c44"/>
  <text x="735" y="69" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3. Failure Is Routine</text>
  <text x="735" y="100" font-size="9" fill="#333" text-anchor="middle">How do we recover?</text>
  <text x="735" y="118" font-size="8.5" fill="#555" text-anchor="middle">MTBF, checkpoint overhead</text>
  <text x="735" y="136" font-size="8" fill="#555" text-anchor="middle">419 failures / 54 days (Llama 3)</text>
  <text x="735" y="165" font-size="7.5" fill="#999" text-anchor="middle">Fault Tolerance &amp; Reliability</text>

  <!-- 4. Serving Is Bounded by Its Contract -->
  <rect x="30" y="195" width="270" height="125" fill="#e6dff2" stroke="#6f4fa0" stroke-width="1.5"/>
  <rect x="30" y="195" width="270" height="28" fill="#6f4fa0"/>
  <rect x="30" y="213" width="270" height="10" fill="#6f4fa0"/>
  <text x="165" y="214" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4. Serving Is Bounded by Its Contract</text>
  <text x="165" y="245" font-size="9" fill="#333" text-anchor="middle">What reaches the user in time?</text>
  <text x="165" y="263" font-size="8.5" fill="#555" text-anchor="middle">P99 within SLO, cost per request</text>
  <text x="165" y="281" font-size="8" fill="#555" text-anchor="middle">Useful capacity = work done within targets</text>
  <text x="165" y="310" font-size="7.5" fill="#999" text-anchor="middle">Inference at Scale</text>

  <!-- 5. Responsibility Constrains Design -->
  <rect x="315" y="195" width="270" height="125" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <rect x="315" y="195" width="270" height="28" fill="#3d9e5a"/>
  <rect x="315" y="213" width="270" height="10" fill="#3d9e5a"/>
  <text x="450" y="214" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5. Responsibility Constrains Design</text>
  <text x="450" y="245" font-size="9" fill="#333" text-anchor="middle">Who is affected?</text>
  <text x="450" y="263" font-size="8.5" fill="#555" text-anchor="middle">Fairness metrics, audit trails</text>
  <text x="450" y="281" font-size="8" fill="#555" text-anchor="middle">Bias detection from inception</text>
  <text x="450" y="310" font-size="7.5" fill="#999" text-anchor="middle">Responsible AI</text>

  <!-- 6. Sustainability Is a First-Order Cost -->
  <rect x="600" y="195" width="270" height="125" fill="#e8f5e9" stroke="#2d7a2d" stroke-width="1.5"/>
  <rect x="600" y="195" width="270" height="28" fill="#2d7a2d"/>
  <rect x="600" y="213" width="270" height="10" fill="#2d7a2d"/>
  <text x="735" y="214" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">6. Sustainability Is a First-Order Cost</text>
  <text x="735" y="245" font-size="9" fill="#333" text-anchor="middle">What is the cost?</text>
  <text x="735" y="263" font-size="8.5" fill="#555" text-anchor="middle">kWh/training, carbon footprint</text>
  <text x="735" y="281" font-size="8" fill="#555" text-anchor="middle">Energy cost &gt; dev budgets</text>
  <text x="735" y="310" font-size="7.5" fill="#999" text-anchor="middle">Sustainable AI</text>

  <!-- ===== Bottom: Integration Note (red accent marks the scale premise) ===== -->
  <rect x="80" y="345" width="740" height="60" fill="#f7f7f7" stroke="#a31f34" stroke-width="1.5"/>
  <text x="450" y="368" font-size="10" font-weight="700" fill="#333" text-anchor="middle">These principles form a layered architecture mirroring the Fleet Stack:</text>
  <text x="450" y="385" font-size="9" fill="#555" text-anchor="middle">Infrastructure + Communication &amp; Failure (distribution) + Serving (contract) + Governance (constraints)</text>
  <text x="450" y="399" font-size="9" font-weight="700" fill="#a31f34" text-anchor="middle">Scale is the shared cause of all six, not a seventh principle</text>

  <!-- Footnote -->
  <text x="450" y="475" font-size="9" fill="#999" text-anchor="middle" font-style="italic">Each principle connects to specific metrics and chapters developed throughout Volume II</text>
</svg>
