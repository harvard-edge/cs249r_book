="166.6">schedule</tspan></text><line x1="145" y1="33" x2="153" y2="33" stroke="#64748b" stroke-width="2.5" marker-end="url(#a64748b)"/><rect x="154" y="4" width="140" height="58" rx="6" fill="#64748b" stroke="#64748b" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="224" y="33.0">2 Metric</tspan></text><rect x="154" y="70" width="140" height="150" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1A1A2E" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="224" y="123.4">MFU per</tspan><tspan x="224" y="145.0">step has</tspan><tspan x="224" y="166.6">dropped</tspan></text><g opacity="0"><line x1="295" y1="33" x2="303" y2="33" stroke="#64748b" stroke-width="2.5" marker-end="url(#a64748b)"/></g><g opacity="0"><rect x="304" y="4" width="140" height="58" rx="6" fill="#d97706" stroke="#d97706" stroke-width="1"/></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="374" y="33.0">3 C³ term</tspan></text></g><g opacity="0"><rect x="304" y="70" width="140" height="150" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1A1A2E" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="374" y="112.6">per-rank</tspan><tspan x="374" y="134.2">traces: more</tspan><tspan x="374" y="155.8">exposed</tspan><tspan x="374" y="177.4">transfer</tspan></text></g><g opacity="0"><line x1="445" y1="33" x2="453" y2="33" stroke="#64748b" stroke-width="2.5" marker-end="url(#a64748b)"/></g><g opacity="0"><rect x="454" y="4" width="140" height="58" rx="6" fill="#d97706" stroke="#d97706" stroke-width="1"/></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="524" y="33.0">4 Row</tspan></text></g><g opacity="0"><rect x="454" y="70" width="140" height="150" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1A1A2E" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="524" y="134.2">Distributed</tspan><tspan x="524" y="155.8">Execution</tspan></text></g><g opacity="0"><line x1="595" y1="33" x2="603" y2="33" stroke="#64748b" stroke-width="2.5" marker-end="url(#a64748b)"/></g><g opacity="0"><rect x="604" y="4" width="140" height="58" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="674" y="21.6">5 Cost</tspan><tspan x="674" y="44.4">moved</tspan></text></g><g opacity="0"><rect x="604" y="70" width="140" height="150" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1A1A2E" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="674" y="123.4">compression</tspan><tspan x="674" y="145.0">moves risk</tspan><tspan x="674" y="166.6">to quality</tspan></text></g><g opacity="0"><line x1="745" y1="33" x2="753" y2="33" stroke="#64748b" stroke-width="2.5" marker-end="url(#a64748b)"/></g><g opacity="0"><rect x="754" y="4" width="140" height="58" rx="6" fill="#16a34a" stroke="#16a34a" stroke-width="1"/></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="824" y="33.0">6 Evidence</tspan></text></g><g opacity="0"><rect x="754" y="70" width="140" height="150" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1A1A2E" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="824" y="123.4">convergence</tspan><tspan x="824" y="145.0">and eval</tspan><tspan x="824" y="166.6">record</tspan></text></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#d97706" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="450" y="256.0">Barrier wait alone cannot tell slow transfer from late arrival.</tspan></text></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="450" y="300.0">Gradient compression shrinks the bytes in T_comm(N),</tspan></text></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="450" y="332.0">and must show the compressed run still reaches its quality target.</tspan></text></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="450" y="366.0">Same steps: a fairness alert may trace to labels, reviewers, or a threshold.</tspan></text></g></svg>