<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380"><defs><marker id="a1F407A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F407A"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a1A1A2E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A2E"/></marker></defs><rect width="100%" height="100%" fill="white"/><g opacity="0"><rect x="64" y="4" width="832" height="96" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#16a34a" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="78" y="52.0">Governance</tspan></text></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="17.0">5  Responsibility constrains design</tspan></text></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="40.0">spends compute; approval gates add coordination</tspan></text></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="65.0">6  Sustainability is a first-order cost</tspan></text></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="88.0">a step's energy = average power × T_step</tspan></text></g><rect x="64" y="106" width="832" height="60" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7c3aed" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="78" y="136.0">Serving</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="125.0">4  Serving is bounded by its contract</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="148.0">the same terms, counted per request</tspan></text><rect x="64" y="172" width="832" height="126" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#d97706" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="78" y="235.0">Distribution</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="192.5">2  Communication can dominate</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="215.5">T_comm(N) and T_sync(N) need not shrink</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="255.5">3  Failure is routine</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="278.5">recovery adds to T_sync(N); rollback adds work</tspan></text><rect x="64" y="304" width="832" height="72" rx="6" fill="#ffffff" stroke="#1F407A" stroke-width="2.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F407A" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="78" y="340.0">Infrastructure</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="329.0">1  Infrastructure determines capability</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="250" y="352.0">sets the rates behind T_compute / N and T_comm(N)</tspan></text><g opacity="0"><line x1="30" y1="372" x2="30" y2="12" stroke="#dc2626" stroke-width="4" marker-end="url(#adc2626)"/></g><g opacity="0"><text font-family="Helvetica, Arial, sans-serif" x="14" y="190" font-size="18" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 14 190)">the scale moment</text></g></svg>