></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="300" y="301.0">2,450 GB checkpoint: 0.34 s to local NVMe</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F407A" font-weight="bold" text-anchor="end" dominant-baseline="middle"><tspan x="884" y="301.0">L4</tspan></text><rect x="4" y="326" width="892" height="42" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F407A" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="16" y="347.0">Facility &amp; Accelerators</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="300" y="347.0">10 GB: HBM 3.0 ms, NVLink 22.2, InfiniBand 200</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F407A" font-weight="bold" text-anchor="end" dominant-baseline="middle"><tspan x="884" y="347.0">L2</tspan></text></svg>