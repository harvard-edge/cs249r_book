="bold" text-anchor="end" dominant-baseline="middle"><tspan x="884" y="25.0">L15</tspan></text><rect x="4" y="50" width="892" height="42" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F407A" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="16" y="71.0">Assurance</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="300" y="71.0">DP noise: $200 error on a mean of 1,000 salaries</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F407A" font-weight="bold" text-anchor="end" dominant-baseline="middle"><tspan x="884" y="71.0">L13</tspan></text><rect x="4" y="96" width="892" height="42" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F407A" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="16" y="117.0">Operations</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="300" y="117.0">864 false alarms a day from 1,000 monitors</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F407A" font-weight="bold" text-anchor="end" dominant-baseline="middle"><tspan x="884" y="117.0">L12</tspan></text><rect x="4" y="142" width="892" height="42" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F407A" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="16" y="163.0">Runtime &amp; Serving</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1A1A2E" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="300" y="163.0">1