    picture: 'Vote card with an H100 photo (shared library)'
    numbers: 'Reference job: 175B, 2.45 TB checkpoint, 1,024 to 2,048 H100s (Sec. 17.3)'
    example: 'Answered in the synthesis ledger.'
    read: Sec. 17.3
  - id: 3
