notes_for_author:
  - 'MegaScale numbers were read from arXiv 2402.15627 v1, Table 2 (strong scaling, batch 768 for 256 to 1,024 GPUs, NVIDIA Ampere GPUs, sequence 2,048). Applying its 1.86x to our H100 reference cluster is labeled illustrative on the slide.'
  - 'Llama 3 Table 5 counts were read from arXiv 2407.21783 v3; the table percentages do not match either 419 or 466 as a denominator, so the slide shows counts only.'
  - 'Dean and Barroso Table 1 read from the CACM paper PDF: one leaf 1, 5, 10 ms; 95 percent of leaves 12, 32, 70 ms; all leaves 40, 87, 140 ms (50th, 95th, 99th).'
  - 'The final frame uses the label THE NEXT QUESTION instead of NEXT LECTURE because this is the last deck.'
  - 'The old deck images (competency-framework, compound-ai-systems, fermi-brain-vs-cluster, fleet-stack-synthesis, post-silicon-frontier, principle-tensions, six-principles; .svg tracked, .pdf generated) are unused; deckcheck reports them as unused-images errors. They need git rm by the lead.'
  - '2026-10-19 sweep (D3, D4, D10). D3: four exhibits owned elsewhere are recalled in one line. The Llama 3 cause chart (Lecture 7) and the Poland and Quebec grid photos (Lecture 15) lost their frames; the principles note and the mtbi slide recall them. The 63 percent predict (Lecture 10) merged into the Google measurement, which is now the predict. The reasoning frame (Lecture 10 numbers) became a discussion of which fleet pays. The freed time went to the lecture''s own worked examples: the mtbi frame (what the GPU-only ledger misses: 151 of 419, 36 percent), the estimate (2.014x for savings), the six steps, the diagnose, the archetype table, the rare-events slide, the true-or-false, the link estimate, and the final ledger. New values are in calcs.py. llama_causes, interactivity, and the two grid photos are now unused (listed; not deleted). D4: the goals slide names the Fleet Law term (all four) and C3 axis (all three). D10: X-not-Y constructions and reveal colons rewritten.'
