  note: 'The concept map lists no primary or secondary concepts (the conclusion owns none). The trace below covers the chapter synthesis artifacts and the touched concepts the lecture shows, each on a [CORE] frame.'
  entries:
    - concept: Six principles of distributed ML systems
      frame: Six principles sit on the four bands of the fleet stack
      shown_by: 'principles_step1..3 build'
    - concept: Fleet Law
      frame: The Fleet Law (focus)
      shown_by: 'equation with C1, C2, C3, hidden labels'
    - concept: Fleet stack
      frame: Which number did each row of the stack teach?
      shown_by: 'stack_roadmap then stack_numbers'
    - concept: Fleet failure rate
      frame: A job that needs N GPUs is interrupted N times as often
      shown_by: 'mtbi plot with measured Llama 3 point'
    - concept: Young-Daly checkpoint interval
