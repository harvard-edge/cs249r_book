  - id: 5
    q: How far can one placement decision swing the carbon account?
    picture: 'No slide since the 2026-10-19 sweep (D3): Lecture 15 owns the grid comparison. Recalled in one line in the principles note'
    numbers: 'GPT-3 1,287 MWh (Li 2020 via Sec. 17.2); 820 and 20 g/kWh (Ch. 15 NM 15.2, rounded annual averages); 1,055 t against 25.7 t, 41x (derived)'
    example: 'Sustainability is a first-order cost.'
    read: Sec. 17.2
  - id: 6
    q: What does a real fan-out service measure at its root when one leaf's p99 is 10 ms?
    picture: 'Predict card with a one-line recall of Lecture 10 (63 percent at 100 servers); the tail_measured bars replace the question at step 2'
    numbers: '1 - 0.99^100 = 63.4 percent (derived, Sec. 17.2 footnote 2); Dean and Barroso 2013 Table 1 (read from the paper): p99 one leaf 10 ms, 95 percent of leaves 70 ms, all leaves 140 ms'
    example: 'A real Google fan-out service'
    read: Sec. 17.2
  - id: 7
    q: How does the interval between interruptions shrink with job size?
    picture: 'New mtbi: 50,000 h / N line with 1,024 and 2,048 points, Llama 3 measured 3.1 h and the 1.8 h projection'
    numbers: '48.8 h, 24.4 h, 3.05 h (derived); Llama 3 3.1 h (derived from 54 days and 419); Kokolis et al. 2025 projection 1.8 h (via Ch. 7 Sec. 7.2); a one-in-a-million failure at a million requests a day is daily; one straggler at 80 percent costs 20 percent (Sec. 17.6)'
    example: 'Scale changes the probability model.'
    read: Sec. 17.2, Sec. 17.7
  - id: 8
    q: What does doubling the reference cluster cost in recovery?
    picture: 'InfiniBand switch photo with a build of the Fleet Law terms; new overhead curve'
    numbers: 'MTBI 48.8 to 24.4 h; Young-Daly overhead sqrt(2 delta / M): 1.7 to 2.4 percent, x1.41; interval about 49 to 35 min (all derived)'
    example: 'The running case'
    read: Sec. 17.3
  - id: 9
    q: What speedup must the larger cluster reach, and what does real scaling deliver?
    picture: 'Estimate card; new megascale plot (measured strong scaling)'
    numbers: 'Break-even 0.983 / 0.976 = 1.007; +0.7 percent accelerator-hours at 2x (derived). MegaScale Table 2: 49.0k to 176.9k tokens/s, 512 to 1,024 GPUs 1.86x; applied: 46 percent shorter, +8.3 percent accelerator-hours (derived, illustrative transfer)'
    example: 'MegaScale 175B, NVIDIA Ampere GPUs, batch 768'
    read: Sec. 17.3
  - id: 10
    q: What does a doubling of compute buy in loss?
    picture: 'New loss_doublings plot'
    numbers: '2^-0.050 = 0.966, 3.4 percent per doubling; absolute drops 0.034, 0.033, 0.032, 0.031; 12.9 percent over 16x (derived; Kaplan exponent via Sec. 17.3)'
    example: 'Each doubling buys the same fraction and a smaller amount.'
    read: Sec. 17.3
  - id: 11
    q: How do we diagnose the binding term without guessing?
    picture: 'New diagnose_step1..3 (six-step procedure on the lagging expanded run); diagnose activity card'
    numbers: 'Self-check 17.3 question 1: storage 200 GB/s per node, fabric 25 GB/s per accelerator, 4x storage upgrade'
    example: 'MFU drop; per-rank traces separate arrival skew from exposed transfer; compression moves risk to convergence'
