    q: What did each row of the fleet stack teach, in one number?
    picture: 'kit stack_roadmap, then new stack_numbers (one number and owning lecture per row)'
    numbers: '10 GB in 3.0, 22.2, 200 ms (Ch. 2 NM 2.3, L2); 2,450 GB checkpoint 0.34 s to local NVMe (Ch. 4 NM 4.7, L4); 175B pure data parallel on 1,024 GPUs 15 percent efficient (Ch. 6 Sec. 6.4.1, L6); Young-Daly 13.8 min at 10,000 GPUs (Ch. 7 NM 7.2, L7); 12 requests of 128K tokens per 8-GPU node (Ch. 10 NM 10.5, L10); 864 false alarms a day (Ch. 12 NM 12.7, L12); DP error about $200 on a mean of 1,000 salaries (Ch. 13 NM 13.3, L13); 41x carbon Poland against Quebec (Ch. 15 NM 15.2, L15)'
    example: 'Retrieval; any correct number from a row counts.'
    read: 'Lectures 2 to 15'
  - id: 2
