  - id: 13
    q: Where does the binding constraint move next?
    picture: 'Discuss card with a two-line recall of Lecture 10 (12.8 s; 30x); new moe_bytes bars; QSFP transceiver photo with the Amdahl estimate'
    numbers: '128 x 100 ms = 12.8 s (Ch. 10 NM 10.4, illustrative); InferenceX DeepSeek-R1 6,300 against 210 tok/s per GPU, 30x (Ch. 10 Sec. 10.6, SemiAnalysis 2026); DeepSeek-V3 1,342 GB resident against 74 GB active, 18.1x (Ch. 10 Sec. 10.10.4); link share 10 percent illustrative, 5 percent saving, 10 percent ceiling (derived)'
    example: 'Test-time compute, mixture of experts, optical I/O'
    read: Sec. 17.5
