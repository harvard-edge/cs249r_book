chapter: 17_conclusion
lecture: "17"
title: Conclusion
subtitle: "Following the binding constraint across the fleet"
minutes: 75
notes_minutes: 70.0
core_minutes: 62.0
target_ideas: 26
thesis: 'The course reduces to one habit, following the binding constraint across the fleet stack and keeping visible the cost each fix moves. The unit to build and measure is the fleet.'
hook:
  minutes: 0.5-5.5
  setup: 'Step 1 (retrieval): the kit stack_roadmap; notes closed, one number per row. Step 2: stack_numbers, one chapter number per row with the lecture that owns it. Then the vote: the course reference job (Archetype A, 175B dense transformer, 2.45 TB checkpoint, 1,024 H100s) is proposed to double to 2,048 GPUs on the same fabric and checkpoint tier (chapter Sec. 17.3).'
  question_to_class: 'Should we double the reference cluster? A yes, twice the GPUs, half the time; B no, it fails twice as often; C not until we measure what it buys.'
  payoff: 'C, answered in the synthesis ledger: recovery overhead 1.7 to 2.4 percent and a break-even speedup of 1.007 do not block it; at a measured 1.86x (MegaScale) the run is 46 percent shorter and costs 8.3 percent more accelerator-hours (illustrative transfer); quality changes only if compute doubles (3.4 percent lower loss); release needs its own evidence.'
  sources: ['chapter Sec. 17.3', 'kit assets/kit/vol2/stack_roadmap', 'Jiang et al. 2024, MegaScale, NSDI, Table 2']
driving_question: 'Where does the binding constraint move next, and how would you defend a fleet expansion or a model release?'
recall: 'Built into the hook: one number per stack row from memory (stack_numbers reveal).'
running_example: 'The chapter expansion decision: the reference job doubled from 1,024 to 2,048 H100s. MTTF 50,000 h per GPU; 48.8 h to 24.4 h between interruptions; 24.5 s checkpoint write; Young-Daly overhead 1.7 to 2.4 percent; break-even step speedup 1.007; +0.7 percent accelerator-hours at an ideal 2x; Kaplan exponent -0.050, 3.4 percent loss per doubling. Measured anchors: Llama 3 405B (Dubey et al. 2024, Sec. 3.3.4 and Table 5); MegaScale 175B strong scaling (Jiang et al. 2024, Table 2). All derived values computed in images/calcs.py.'
segments:
  - name: Principles
    divider_question: What does the whole course reduce to?
    read: Sec. 17.1, Sec. 17.2
    concept_questions: [1, 2, 3, 4, 5]
    land: 'Six principles, one per band, and every one is paid in a Fleet Law term.'
    minutes: 9.0
  - name: Scale
    divider_question: What happens to a rare event when the fleet grows?
    read: Sec. 17.2, Sec. 17.7
    concept_questions: [6, 7]
    land: 'At fleet scale the rare event, the slow server, and the failed GPU become routine operating conditions, so they are design inputs.'
    minutes: 9.5
  - name: Expansion
    divider_question: Should the fleet grow, and what does growth cost?
    read: Sec. 17.3
    concept_questions: [8, 9, 10]
    land: 'The expansion buys calendar time with accelerator-hours; exposed communication sets the price, and the fitted curve says what extra compute would buy.'
    minutes: 15.5
  - name: Diagnosis
    divider_question: How do we find the binding term without guessing?
    read: Sec. 17.3, Sec. 17.6
    concept_questions: [11, 12]
    land: 'Find the term with evidence, fix it in the row that owns it, and keep the moved cost visible.'
    minutes: 14.0
  - name: What Next
    divider_question: Where does the binding constraint move next?
    read: Sec. 17.5
    concept_questions: [13]
    land: 'New workloads and substrates relocate cost without exempting it from the Fleet Law.'
    minutes: 8.0
concept_questions:
