worked_examples:
  - name: 'The expansion: 1,024 to 2,048 GPUs (Sec. 17.3)'
    steps:
      - 'given: 175B reference job, 2.45 TB checkpoint written in 24.5 s, MTTF 50,000 h per GPU, same fabric'
      - 'MTBI 48.8 h to 24.4 h (GPU failures only)'
      - 'Young-Daly overhead 1.7 to 2.4 percent (x1.41)'
      - 'break-even step speedup 1.007; +0.7 percent accelerator-hours at an ideal 2x'
      - 'measured 1.86x (MegaScale): 46 percent shorter, +8.3 percent accelerator-hours (illustrative)'
      - 'meaning: recovery does not block; exposed communication sets the price'
  - name: 'What a compute doubling buys (Sec. 17.3)'
    steps:
      - 'given: loss proportional to compute^-0.050 (Kaplan et al. 2020)'
      - '2^-0.050 = 0.966: 3.4 percent per doubling'
      - 'absolute drops 0.034, 0.033, 0.032, 0.031; 12.9 percent over 16x'
      - 'meaning: the same fraction at the full price each time; beyond the fitted range the shape, not the value, carries'
  - name: 'Diagnosing the lagging expanded run (Sec. 17.3)'
    steps:
      - 'symptom: schedule lag; metric: MFU per step'
      - 'per-rank traces: little arrival skew, more exposed transfer: communication'
      - 'row: Distributed Execution; fix: gradient compression'
      - 'displaced cost: convergence risk; evidence: convergence and evaluation record'
active_learning:
  - at_minute: 0.5
    type: retrieval
    prompt: 'Close your notes. For each row of the stack, write one number you remember.'
    answer: 'Any correct number from that row; stack_numbers shows one per row.'
  - at_minute: 3.5
    type: concept_question
    prompt: 'Should we double the reference cluster? A, B, or C.'
    answer: 'C, revealed at minute 63 with the ledger.'
  - at_minute: 13.5
    type: concept_question
    prompt: '94 percent efficiency on 8 GPUs, 38 percent on 8,000; over 55 percent of the step at barriers. Which principle?'
    answer: 'A, communication can dominate (self-check 17.2 question 1).'
  - at_minute: 16.5
    type: predict
    prompt: 'A Google service fans each request out to many leaves; one leaf finishes within 10 ms at p99. What is the root p99? (The gray line recalls the 63 percent fan-out result from Lecture 10.)'
    answer: 'D, 140 ms, 14x the single leaf; 70 ms for 95 percent of leaves (Dean and Barroso 2013, Table 1).'
  - at_minute: 30.5
    type: estimate
    prompt: 'Overheads 1.7 and 2.4 percent: break-even speedup, and accelerator-hours at an ideal 2x?'
    answer: '1.007; +0.7 percent. Saving accelerator-hours would need more than 2.014x, a superlinear speedup.'
  - at_minute: 44.5
    type: diagnose
    prompt: 'A 4x faster storage tier did not help; traces show exposed gradient transfer. Which term, row, and moved cost?'
    answer: 'Communication; Distributed Execution; overlap, hierarchical collectives, or compression (convergence risk).'
  - at_minute: 51
    type: concept_question
    prompt: 'True or false: four fallacies and pitfalls from Sec. 17.6.'
    answer: 'All false.'
  - at_minute: 55
    type: discuss
    prompt: 'Recall Lecture 10 (12.8 s; 30x). A reasoning model spends more compute on every request. Which fleet pays, and which Fleet Law term grows?'
    answer: 'The serving fleet, on every request for the life of the deployment; the compute per request grows and capacity at a fixed contract falls.'
  - at_minute: 59.5
    type: estimate
    prompt: 'A link halves energy per bit; links draw 10 percent of fleet power (illustrative). Fleet saving?'
    answer: '5 percent; at most 10 percent for any link (Amdahl for energy).'
open_questions:
