closing:
  return_to_hook: 'The synthesis ledger answers the vote: C. Recovery does not block, exposed communication sets the price, quality changes only if compute doubles, release needs its own evidence.'
  read_and_practice: ['Sec. 17.2 to Sec. 17.6', 'Self-check questions for Sec. 17.2, 17.3, 17.5', 'Redo the Sec. 17.3 expansion for 4,096 GPUs']
  further_reading:
    - cite: 'Dean and Barroso, The Tail at Scale, CACM 2013'
      url: https://doi.org/10.1145/2408776.2408794
      why: 'Why rare slow responses dominate fan-out services.'
    - cite: 'Dubey et al., The Llama 3 Herd of Models, 2024, Sec. 3.3'
      url: https://arxiv.org/abs/2407.21783
      why: 'Measured failures and recovery at 16,384 GPUs.'
    - cite: 'Jiang et al., MegaScale, NSDI 2024'
      url: https://arxiv.org/abs/2402.15627
      why: 'Measured strong scaling of a 175B model to 12,288 GPUs.'
    - cite: 'Kaplan et al., Scaling Laws for Neural Language Models, 2020'
      url: https://arxiv.org/abs/2001.08361
      why: 'The demand curve behind fleet growth.'
    - cite: 'Barroso, Hölzle, and Ranganathan, The Datacenter as a Computer, 3rd ed., 2018'
      url: https://doi.org/10.2200/S00874ED3V01Y201809CAC046
      why: 'The warehouse-scale computer as one machine.'
bridge: 'Last lecture of the course; no next lecture. The closing frame asks, for further study: what changes when the system is an agent that acts over many steps? No other volume is named.'
