    numbers: 'Chapter Sec. 17.2 table 1 and figure 1'
    example: 'Infrastructure, communication, failure, serving contract, responsibility, sustainability.'
    read: Sec. 17.2
  - id: 4
    q: How routine is failure on a real frontier run?
    picture: 'No slide since the 2026-10-19 sweep (D3): Lecture 7 owns the Llama 3 chart. Recalled in one line in the principles note and on the mtbi slide'
    numbers: 'Dubey et al. 2024, Sec. 3.3.4 and Table 5 (read): 466 interruptions, 419 unexpected, GPU 268, software and dependency 56, network 35, unplanned maintenance 32, other host 21, unknown 7; one every 3.1 h (derived); more than 90 percent effective training time'
    example: 'Meta Llama 3 405B on 16,384 H100s'
