worked_examples:
  - name: "Napkin Math 2.3: the bandwidth staircase"
    steps: ["given: one 10 GB buffer; HBM 3,350, NVLink 450, InfiniBand 50 GB/s", "HBM 3.0 ms", "NVLink 22.2 ms", "InfiniBand 200 ms, 9x NVLink", "meaning: frequency and overlap decide placement; tensor parallelism inside the node, data parallelism across the cluster"]
  - name: "Table 11 and Example 2.4: 175B training memory on one DGX H100"
    steps: ["given: 16 B per parameter, 175B parameters, 640 GB per node", "2.8 TB of persistent state plus 100 to 400 GB activations", "TP-8 per GPU: 175 + 87.5 + 87.5 + 25 = 375 GB against 80 GB", "offload moments and master: 112.5 GB still too large", "TP-8 x DP-128 with ZeRO: 43.75 + 1.37 = 45.1 GB before gradients and activations", "meaning: the node is a fast unit, and the state must be sharded across nodes"]
  - name: "Example 2.3: tensor parallelism over NVLink and PCIe"
    steps: ["given: 192 AllReduces of 201 MB, ring factor 1.75, 200 ms compute (assumed)", "NVLink: 0.783 ms each, 150.3 ms, compute 57.1 percent", "PCIe Gen5: 5.51 ms each, 1,057 ms, communication 84.1 percent", "meaning: the most frequent exchange belongs on the fastest link"]
  - name: "Napkin Math 2.4: training time for 175B"
    steps: ["given: 6PD = 3.15e23 FLOPs; 8,192 H100 at 1,979 TFLOP/s FP8", "100 percent of peak: 5.4 h (derived)", "45 percent local efficiency: 12.0 h", "scaling efficiency 0.56: 21.4 h", "x1.03, x1.10, x1.05: 22.1, 24.3, 25.5 h", "meaning: about 21 percent of the purchased FP8 peak becomes progress (derived)"]

active_learning:
  - at_minute: 1
    type: predict
    prompt: "Llama-3 70B at batch 1 on an H100: arithmetic, weight transfer, or about equal?"
    answer: "Weight transfer, 42.1 ms against 0.14 ms (Napkin Math 2.1)."
  - at_minute: 4
    type: retrieval
    prompt: "Write the Fleet Law from Lecture 1; circle the terms that depend on the hardware."
    answer: "T_compute/N (device rate) and T_comm(N) (link bandwidth); failures interrupt every term."
  - at_minute: 15.5
    type: predict
    prompt: "H200 against H100: same FP16 peak, 1.4x bandwidth, 1.6x capacity. Batch-1 decode speedup? 1.0x, 1.4x, 1.6x, 2x"
    answer: "1.4x, the bandwidth ratio (Napkin Math 2.2)."
  - at_minute: 27.5
    type: estimate
    prompt: "Does the 175B training state fit in one 640 GB node? Split eight ways, how much per GPU?"
    answer: "2.8 TB of persistent state does not fit; 375 GB per GPU against 80 GB (Example 2.4)."
  - at_minute: 38
    type: predict
    prompt: "Move tensor parallelism from NVLink to PCIe Gen5. What share of the step is communication?"
    answer: "84.1 percent over PCIe, 42.9 percent over NVLink, with 200 ms of assumed compute and no overlap (Example 2.3)."
  - at_minute: 47.5
    type: estimate
    prompt: "How much air removes 100 kW at a 15 K rise? How much water?"
    answer: "6.6 kg/s, 5.5 m3/s of air; about 1.6 L/s of water (derived), about 3,500x less volume."
  - at_minute: 60.5
    type: diagnose
    prompt: "Name the binding constraint for large-batch 175B training, 70B batch-1 decode, a 10 TB embedding recommender, and mixture-of-experts training."
    answer: "Compute then interconnect; memory bandwidth; memory capacity; fabric bisection (table 17)."
  - at_minute: 66
    type: concept_question
    prompt: "True or false: more GPUs always mean faster training; size cooling for average power; enough HBM capacity settles the choice; all GPU-hours are equivalent."
    answer: "All false: 8x hardware gives 5.4x speed (0.83 to 0.56 modeled); synchronized phases reach 700 W together; 69.2 ms against 21 ms; H100 is 7.9x a V100's FP16 peak (Sec. 2.10)."

open_questions:
  - "A building lasts 15 to 20 years and accelerators turn over every few. What should a facility be designed for?"
  - "Specialized silicon gains efficiency by betting on today's operators. When is the bet worth it?"
  - "Facility redundancy or better checkpoints: which buys more completed training per dollar?"

more_examples:
  - "Google TPU v1 (Jouppi et al. 2017): 92 TOPS INT8 in 75 W; 30 to 80x performance per watt on its inference workloads."
  - "Cerebras WSE-3 (Cerebras S-1, 2024): 900,000 cores, 44 GB of on-wafer SRAM; weight streaming from MemoryX at 1.2 TB/s (Sec. 2.2.1, 2.9.2)."
  - "AMD MI300X: 192 GB HBM at 5.3 TB/s; Gaudi 2: 24 integrated 100 GbE ports (Sec. 2.5.2)."
  - "Llama 3 405B pretraining: faulty GPUs and HBM3 errors caused nearly half of the unexpected interruptions (Dubey et al. 2024, via Sec. 2.5.5)."
  - "CXL over PCIe Gen5 at 64 GB/s against HBM3 at 3.35 TB/s, 52x (Sec. 2.9.1)."
  - "Google's data-center tax: nearly 30 percent of cycles in common building blocks (Kanev et al. 2015, via Sec. 2.5.2)."

