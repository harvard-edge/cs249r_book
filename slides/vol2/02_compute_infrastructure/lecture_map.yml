    why: "Technologies that move a wall; one line each in the notes and open questions (Sec. 2.2.1, 2.2.2, 2.9)."
  - concept: "PCIe hierarchy and NUMA placement inside a node"
    why: "Detail better read than heard (Sec. 2.5.1)."
  - concept: "Power delivery path and PUE accounting"
    why: "PUE belongs to Lecture 15 (facility overhead boundary); the power path is in the transient notes only."
