chapter: 02_compute_infrastructure
lecture: "02"
title: "Compute Infrastructure"
subtitle: "From one accelerator to a pod"
layer: facility
minutes: 75
notes_minutes: 71
core_minutes: 59
target_ideas: 30
thesis: "Memory, communication, power, and reliability walls bind at successive physical scales, and capacity bought at peak FLOP/s is not capacity delivered."

hook:
  minutes: "0-4"
  setup: "Photo of an H100 card with its datasheet: 989 TFLOP/s dense FP16, 3.35 TB/s HBM. Llama-3 70B serves one user at batch 1; each token reads 141.2 GB of FP16 weights and does 1.4e11 FLOPs."
  question_to_class: "Which takes longer per token: the arithmetic, the weight transfer, or about equal?"
  payoff: "Weight transfer: 42.1 ms against 0.14 ms of arithmetic, 99.7 percent of the sum. The synthesis returns to the same H100 and shows the share of its peak that becomes progress at each scale: 0.34 percent (decode bound, FP16), 45 percent (assumed local training efficiency, FP8), 21 percent (8,192-GPU scenario, derived)."
  sources: ["chapter Napkin Math 2.1 (Sec. 2.3.1)", "photo: shared library nvidia-h100-pcie.jpg (Geekerwan, CC BY 3.0)"]

recall: "Lecture 1's Fleet Law, T_step(N) = T_compute/N + T_comm(N) + T_sync(N) - T_overlap; students circle the terms the hardware sets (device rate, link bandwidth)."

driving_question: "What limits the useful compute that an accelerator, a node, a rack, and a pod can deliver?"

running_example: "The course's reference job (Archetype A): a 175B dense transformer, mixed-precision Adam, 16 B per parameter of persistent state (2.8 TB), on H100s; 1,024 GPUs in 128 DGX H100 nodes as the reference cluster, and the chapter's 8,192-GPU pod scenario (Napkin Math 2.4). The decode examples switch to Llama-3 70B, as the chapter does (Sec. 2.3.1), and the slides say so."

goals:
  - "Test an accelerator for capacity and for bandwidth separately, with the roofline."
  - "Place tensor, pipeline, and data parallelism on the bandwidth staircase."
  - "Size a rack's power and cooling, and name its failure domains."
  - "Turn a training budget into wall-clock hours from sustained, not peak, throughput."

segments:
  - name: "The Walls"
    divider_question: "What limits the useful compute that a fleet can deliver?"
    read: "Sec. 2.1"
    concept_questions: [1, 2]
    minutes: 10
    land: "Four walls bind at four physical scales, and relieving one exposes the next."
  - name: Accelerator
    divider_question: "Does the model fit, and how fast do its bytes arrive?"
    read: "Sec. 2.2 to 2.4"
    concept_questions: [3, 4, 5, 6]
    minutes: 15.5
    land: "Capacity decides whether a model fits and bandwidth decides how fast low-reuse phases run; the roofline tells which ceiling binds before any purchase."
  - name: Node
    divider_question: "Where must each kind of traffic run, inside and between nodes?"
    read: "Sec. 2.5"
    concept_questions: [7, 8, 9]
    minutes: 15
    land: "A node aggregates capacity but each memory stays private, so the partition puts its most frequent exchanges on the fastest wires."
  - name: Rack
    divider_question: "Can the building power and cool what the fleet bought?"
    read: "Sec. 2.6"
    concept_questions: [10, 11, 12]
    minutes: 12.5
    land: "Power delivery, cooling, and failure domains bound how much compute a building can install."
  - name: Pod
    divider_question: "How much of the purchased peak becomes training progress?"
    read: "Sec. 2.4.1, 2.7, 2.8"
    concept_questions: [13, 14, 15]
    minutes: 10.5
    land: "Diagnose the binding constraint first, then compare sustained useful work per dollar; 12.0 compute hours become 25.5 wall-clock hours."

concept_questions:
  - id: 1
    q: "How much of an accelerator's datasheet does batch-1 decode use?"
    picture: "H100 photo with datasheet numbers; log bars 0.14 ms arithmetic against 42.1 ms weight transfer"
    numbers: "Llama-3 70B, 1.4e11 FLOPs and 141.2 GB per token; 989 TFLOP/s, 3.35 TB/s (Napkin Math 2.1); ratio 298 (calcs.py)"
    example: "Llama-3 70B decode on one H100-equivalent path"
    read: "Sec. 2.3.1"
  - id: 2
    q: "Which physical resource runs out first at each scale?"
    picture: "Walls ladder (new SVG, built in four steps): accelerator, node, rack, pod"
    numbers: "3.35 TB/s HBM feeding 989 TFLOP/s; NVLink 450 against InfiniBand 50 GB/s (9x); 33.5 kW against 12 kW; 10,000 GPUs at 50,000 h MTTF, about 5 h (Sec. 2.1, 2.5.1, 2.6, 2.7.1)"
    example: "The chapter's figure 1 examples"
    read: "Sec. 2.1"
  - id: 3
    q: "Why does HBM deliver so much more bandwidth than DDR5, and at what price?"
    picture: "AMD Fiji package photo (GPU die and four HBM stacks on an interposer) beside the DDR5 against HBM3 table"
    numbers: "200 GB/s against 3.35 TB/s (16.8x, about 17x), 64 against 1,024 bits, 20 against 4 pJ/bit, $3 against $10 to $15 per GB (table 5); 64 pJ operand fetch against 1.5 pJ MAC, 42x (Sec. 2.3.1)"
    example: "H100 HBM3"
    read: "Sec. 2.3.1"
  - id: 4
    q: "Are capacity and bandwidth the same test?"
    picture: "Two-panel build: 141.2 GB against 80 GB, then decode floors 69.2, 42.1, 17.6 ms at A100, H100, B200 bandwidth"
    numbers: "Sec. 2.3.1; floors computed in calcs.py (the chapter prints 17.7 for B200)"
    example: "Llama-3 70B FP16; the HBM-capacity pitfall (192 GB HBM2e at 69.2 ms against 80 GB HBM3 with INT8 at 21 ms)"
    read: "Sec. 2.3.1, 2.10"
  - id: 5
    q: "How does the roofline screen a purchase?"
    picture: "H100 FP16 roofline with real ceilings; decode batch 1, batch 64, and training points added one per step; then the H200 predict"
    numbers: "Ridge 295.2 FLOP/byte; 0.34 percent at I = 1; 21.7 percent at I = 64; training at 2,048 local tokens (Example 2.2, table 7); H200 1.4x bandwidth, 1.6x capacity, modeled decode 1.4x (Napkin Math 2.2)"
    example: "H100 against H200"
    read: "Sec. 2.3.2"
  - id: 6
    q: "What does specialization buy, and what does it bet?"
    picture: "Die arithmetic share bars (approximate) beside a TPU v4 board photo; Epoch AI scatter of FP16 TFLOP/s per watt"
    numbers: "CPU 5-10, GPU 50-60, TPU 70-80, ASIC over 90 percent (figure 2); TPU v1 92 TOPS INT8 in 75 W, 15 months (Example 2.1, Jouppi et al. 2017); 64 devices, fit about 1.2x per year; V100 0.42 to B200 2.25 TFLOP/s/W, 5.4x, against 18x peak and 3.3x TDP (table 2, figure 5)"
    example: "TPU origin; NVIDIA V100 to B200"
    read: "Sec. 2.2"
  - id: 7
    q: "Does the 175B training state fit in one node?"
    picture: "Real HGX B200 baseboard photo with DGX H100 card; then stacked bars of 2.8 TB against 640 GB and 375 GB per GPU under TP-8 against 80 GB"
    numbers: "350 + 350 + 700 + 700 + 700 GB plus 100 to 400 GB activations (table 11); per GPU 175 + 87.5 + 87.5 + 25 = 375 GB; 112.5 GB after offload (Example 2.4; the chapter rounds to 113)"
    example: "175B on one DGX H100"
    read: "Sec. 2.5.3"
  - id: 8
    q: "How much does each physical boundary cost?"
    picture: "Staircase bars built in three steps beside an InfiniBand switch photo"
    numbers: "10 GB in 3.0, 22.2, 200 ms at 3,350, 450, 50 GB/s (Napkin Math 2.3)"
    example: "One 10 GB buffer"
    read: "Sec. 2.5.1"
  - id: 9
    q: "Which parallelism goes on which tier, and why?"
    picture: "Three lanes (tensor, pipeline, data) with size, frequency, overlap; then NVLink against PCIe stacked bars"
    numbers: "201 MB, 192 times per step; 201 MB per micro-batch per boundary; 350 GB once per step (Sec. 2.5.1, table 10); ring 352 MB, 0.783 ms, 150.3 ms per step, compute 57.1 percent; PCIe 1,057 ms, communication 84.1 percent (Sec. 2.5.2, Example 2.3)"
    example: "TP-8 for the 175B model"
    read: "Sec. 2.5.1, 2.5.2"
  - id: 10
    q: "How much power does a training rack draw, and how fast is that growing?"
    picture: "GB200 NVL72 rack photo with rack-power bars; two-panel plot of package ratings and Epoch AI largest-system power"
    numbers: "12, 33.5, 100, 120 kW (Sec. 2.6, 2.6.2); H100 700 W to B300 1,400 W (2x); Frontier 40 MW to about 350 MW (9x) (figure 13; Epoch AI via MLSysIM)"
    example: "GB200 NVL72; Frontier"
    read: "Sec. 2.6.1"
  - id: 11
    q: "How much air, or water, removes a rack's heat?"
    picture: "Q = m c dT with given values; air against water flow bars; cooling-tower photo"
    numbers: "6.6 kg/s, 5.5 m3/s, 11,713 CFM of air for 100 kW at 15 K (Sec. 2.6.2); water 1.6 kg/s and 3,466x less volume (derived); GB200 NVL72 172 L/min at 10 K (derived from the chapter's inputs)"
    example: "100 kW liquid-class rack"
    read: "Sec. 2.6.2"
  - id: 12
    q: "What does one fault take out with it?"
    picture: "Nested failure domains (GPU, node, rack, hall and row, building) beside the Pompidou website notice during the OVHcloud fire"
    numbers: "OVHcloud Strasbourg, 10 March 2021, over 3.6 million websites offline (War Story 2.1); CDU 4 h: $2,048 for 256 GPUs, $80,000 for a 10,000-GPU synchronous job (Sec. 2.6.4, illustrative $2 per GPU-hour)"
    example: "OVHcloud SBG2"
    read: "Sec. 2.5.5, 2.6.4"
  - id: 13
    q: "How often does a 10,000-GPU pod lose a GPU?"
    picture: "Frontier photo beside the pod's numbers"
    numbers: "9.89 EFLOP/s FP16, 500 TB/s injection, 7 MW of GPUs; 50,000 / 10,000 = 5 h (Sec. 2.7.1)"
    example: "Warehouse-scale computer"
    read: "Sec. 2.7.1"
  - id: 14
    q: "Why plan on sustained, not peak, throughput, and how long does the 175B run take?"
    picture: "Peak against eta = 0.4 bars; then the pod chain bars built in three steps"
    numbers: "1,000 to 2,500 GPU-hours at 40 percent (Sec. 2.4.1); 3.15e23 FLOPs, 8,192 H100 at 1,979 TFLOP/s FP8; 5.4 h at full peak (derived), 12.0 h at 45 percent, 21.4, 22.1, 24.3, 25.5 h (Napkin Math 2.4)"
    example: "175B on 8,192 H100s"
    read: "Sec. 2.4.1, 2.7"
  - id: 15
    q: "Which constraint binds each workload, and how should hardware be compared?"
    picture: "Diagnose table, answers revealed"
    numbers: "Table 17; DLRM 10 TB needs at least 15 DGX H100 nodes of HBM (Lighthouse 2.1); Mixtral-8x7B 12.9B of 46.7B active (Sec. 2.8)"
    example: "Training, decode, recommender, mixture of experts"
    read: "Sec. 2.8"

