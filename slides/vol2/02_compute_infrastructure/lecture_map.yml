    why: "Read Sec. 2.8.2; Lecture 9 owns the measurement contract."
  - concept: "Inference-specific infrastructure and the serving estimate"
    why: "Lecture 10 owns serving (Sec. 2.8.3)."

closing:
  return_to_hook: "Back to the H100's 989 TFLOP/s: decode is bound at 0.34 percent of FP16 peak; local training is assumed at 45 percent of FP8 peak; an 8,192-GPU run delivers about 21 percent; around the device sit 33.5 kW per rack and a GPU failure every 5 h at 10,000 GPUs."
  read_and_practice: ["Sec. 2.3, 2.5, 2.6, 2.7", "the chapter's self-check questions", "redo Napkin Math 2.4 with a scaling efficiency of 0.83"]
  further_reading:
    - cite: "Compute Infrastructure, Sec. 2.3 to 2.7"
      url: "https://mlsysbook.ai"
      why: "Every number of today's lecture, with the napkin math in full."
    - cite: "Jouppi et al., In-Datacenter Performance Analysis of a Tensor Processing Unit, ISCA 2017"
      url: "https://doi.org/10.1145/3079856.3080246"
      why: "The specialization bet in the designers' own words."
    - cite: "Williams, Waterman, and Patterson, Roofline, CACM 2009"
      url: "https://doi.org/10.1145/1498765.1498785"
      why: "The origin of the roofline."
    - cite: "Barroso, Holzle, and Ranganathan, The Datacenter as a Computer, 2019"
      url: "https://doi.org/10.1007/978-3-031-01761-2"
      why: "The warehouse-scale computer."
    - cite: "Pilz et al., Trends in AI Supercomputers, 2025; Epoch AI data"
      url: "https://arxiv.org/abs/2504.16026"
      why: "The power data behind today's plot."
    - cite: "Dubey et al., The Llama 3 Herd of Models, 2024"
      url: "https://arxiv.org/abs/2407.21783"
      why: "Interruptions measured on a real 16,384-GPU run."
  bridge: "Lecture 3, Network Fabrics: what decides how long a collective takes on a real fabric?"

