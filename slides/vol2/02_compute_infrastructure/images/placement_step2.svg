<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="450" fill="white"/>
<rect x="6" y="6" width="888" height="138" rx="8" fill="#EAF1F8" stroke="#1F407A" stroke-width="2.5" opacity="1.0"/>
<text x="24" y="48" font-size="34" fill="#1F407A" font-weight="bold" text-anchor="start" opacity="1.0">Tensor parallel</text>
<text x="24" y="90" font-size="28" fill="#0f172a" font-weight="bold" text-anchor="start" opacity="1.0">Inside one node: NVLink, 450 GB/s</text>
<text x="24" y="128" font-size="26" fill="#334155" font-weight="normal" text-anchor="start" opacity="1.0">201 MB, 192 times per step; on the critical path</text>
<rect x="6" y="154" width="888" height="138" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" opacity="1.0"/>
<text x="24" y="196" font-size="34" fill="#d97706" font-weight="bold" text-anchor="start" opacity="1.0">Pipeline parallel</text>
<text x="24" y="238" font-size="28" fill="#0f172a" font-weight="bold" text-anchor="start" opacity="1.0">Between nodes: InfiniBand, 50 GB/s</text>
<text x="24" y="276" font-size="26" fill="#334155" font-weight="normal" text-anchor="start" opacity="1.0">201 MB per micro-batch per stage boundary; partly hidden</text>
<rect x="6" y="302" width="888" height="138" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" opacity="0.0"/>
<text x="24" y="344" font-size="34" fill="#16a34a" font-weight="bold" text-anchor="start" opacity="0.0">Data parallel</text>
<text x="24" y="386" font-size="28" fill="#0f172a" font-weight="bold" text-anchor="start" opacity="0.0">Across the cluster: InfiniBand, 50 GB/s</text>
<text x="24" y="424" font-size="26" fill="#334155" font-weight="normal" text-anchor="start" opacity="0.0">350 GB of gradients, once per step; overlaps backward</text>
</svg>
