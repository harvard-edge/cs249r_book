<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" width="900" height="345" font-family="Helvetica, Arial, sans-serif">
<defs></defs>
<rect width="900" height="345" fill="white"/>
<text x="270" y="24" font-size="20" fill="#475569" font-weight="bold" text-anchor="middle" opacity="1.0">Tier (wider = more capacity)</text>
<text x="555" y="24" font-size="20" fill="#475569" font-weight="bold" text-anchor="middle" opacity="1.0">Capacity</text>
<text x="710" y="24" font-size="20" fill="#475569" font-weight="bold" text-anchor="middle" opacity="1.0">Bandwidth</text>
<text x="857" y="24" font-size="20" fill="#475569" font-weight="bold" text-anchor="middle" opacity="1.0">Latency</text>
<polygon points="192,83 348,83 326,36 214,36" fill="#EAF1F8" stroke="#1F407A" stroke-width="2"/>
<text x="270" y="67.5" font-size="22" fill="#14294E" font-weight="bold" text-anchor="middle" opacity="1.0">GPU HBM</text>
<text x="4" y="67.5" font-size="22" fill="#475569" font-weight="bold" text-anchor="start" opacity="1.0">0</text>
<text x="555" y="67.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">80 GB</text>
<text x="710" y="67.5" font-size="20" fill="#14294E" font-weight="bold" text-anchor="middle" opacity="1.0">3.35 TB/s per GPU</text>
<text x="857" y="67.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">~100 ns</text>
<polygon points="164,134 376,134 354,87 186,87" fill="#EAF1F8" stroke="#1F407A" stroke-width="2"/>
<text x="270" y="118.5" font-size="22" fill="#14294E" font-weight="bold" text-anchor="middle" opacity="1.0">Host DRAM</text>
<text x="4" y="118.5" font-size="22" fill="#475569" font-weight="bold" text-anchor="start" opacity="1.0">1</text>
<text x="555" y="118.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">0.5 to 2 TB</text>
<text x="710" y="118.5" font-size="20" fill="#14294E" font-weight="bold" text-anchor="middle" opacity="1.0">200 GB/s per node</text>
<text x="857" y="118.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">~100 ns</text>
<polygon points="136,185 404,185 382,138 158,138" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="270" y="169.5" font-size="22" fill="#15803d" font-weight="bold" text-anchor="middle" opacity="1.0">Local NVMe</text>
<text x="4" y="169.5" font-size="22" fill="#475569" font-weight="bold" text-anchor="start" opacity="1.0">2</text>
<text x="555" y="169.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">4 to 30 TB</text>
<text x="710" y="169.5" font-size="20" fill="#14294E" font-weight="bold" text-anchor="middle" opacity="1.0">7 to 25 GB/s</text>
<text x="857" y="169.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">~100 µs</text>
<polygon points="108,236 432,236 410,189 130,189" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="270" y="220.5" font-size="22" fill="#15803d" font-weight="bold" text-anchor="middle" opacity="1.0">Parallel file system</text>
<text x="4" y="220.5" font-size="22" fill="#475569" font-weight="bold" text-anchor="start" opacity="1.0">3</text>
<text x="555" y="220.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">100+ PB</text>
<text x="710" y="220.5" font-size="20" fill="#14294E" font-weight="bold" text-anchor="middle" opacity="1.0">1+ TB/s shared</text>
<text x="857" y="220.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">~1 ms</text>
<polygon points="80,287 460,287 438,240 102,240" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="270" y="271.5" font-size="22" fill="#15803d" font-weight="bold" text-anchor="middle" opacity="1.0">Object storage</text>
<text x="4" y="271.5" font-size="22" fill="#475569" font-weight="bold" text-anchor="start" opacity="1.0">4</text>
<text x="555" y="271.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">very large</text>
<text x="710" y="271.5" font-size="20" fill="#14294E" font-weight="bold" text-anchor="middle" opacity="1.0">100 GB/s shared</text>
<text x="857" y="271.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">~50 ms</text>
<polygon points="52,338 488,338 466,291 74,291" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="270" y="322.5" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="middle" opacity="1.0">Archive</text>
<text x="4" y="322.5" font-size="22" fill="#475569" font-weight="bold" text-anchor="start" opacity="1.0">5</text>
<text x="555" y="322.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">very large</text>
<text x="710" y="322.5" font-size="20" fill="#14294E" font-weight="bold" text-anchor="middle" opacity="1.0">1 GB/s</text>
<text x="857" y="322.5" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="middle" opacity="1.0">min to h</text>
</svg>
