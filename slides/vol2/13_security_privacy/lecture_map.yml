chapter: 13_security_privacy
lecture: "13"
title: "Security and Privacy"
layer: assurance
minutes: 75
notes_minutes: 71
core_minutes: 57
target_ideas: 30
thesis: "A learned system is attacked through interfaces it exposes on purpose, so its defenses are threat models, budgets, and provenance, each priced in a Fleet Law term."

hook:
  minutes: "0-4"
  setup: "A real screenshot of Strava's global heatmap (a city tile, Purwokerto, Wikimedia Commons). The heatmap sums every uploaded run and ride into brightness and shows no names."
  question_to_class: "In January 2018, what did the public heatmap reveal? A) nothing, it held no names; B) each user's password; C) where staff at remote bases ran; D) each user's home address."
  payoff: "C. In sparse regions the few bright tracks came largely from military personnel, so the map traced base perimeters and running routes (War Story 13.1). Nothing was broken into; the release worked as designed. The synthesis writes the heatmap's threat model and uses the salary arithmetic (small groups pay most) to explain why sparse cells leaked."
  sources: ["Security & Privacy, War Story 13.1 (Russell 2018)", "https://commons.wikimedia.org/wiki/File:Strava_Pwr_Heatmap.jpg"]

recall: "Lecture 12, close your notes: what does a staged rollout limit, and what stops a stage? (Exposure: a 5 percent canary is 20 times less than a cutover, Napkin Math 12.5; a stage stops when a monitored signal moves.) Then: does the canary see a backdoor that fires on one input in a million? (No; no metric moves and the trigger may never appear, Security & Privacy 13.8.3.)"

driving_question: "What can an attacker learn or change through a model that is working correctly, and what does each defense cost the fleet?"

goals:
  - "Write a threat model (asset, boundary, adversary, control) for each interface a fleet exposes."
  - "Bound query-based extraction with a cumulative budget, and trace poisoning to the provenance record."
  - "Show why one worker can corrupt a mean, and charge each defense to a Fleet Law term."
  - "Bound what a release reveals with differential privacy, and account the budget across releases."

running_example: "The reference fleet: an Archetype A model trained on 1,024 GPUs in 128 nodes of 8 (350 GB of FP16 gradients per step, a 2.45 TB checkpoint), released through a registry, and served behind a public API on shared GPUs. Its six interfaces (data feed, gradient exchange, node admission, release path, query API, shared accelerators) are the recurring map; each segment returns to one or two of them. The chapter's smaller cases carry arithmetic where the chapter does: a ResNet-50 image API (Napkin Math 13.1) and a salary table (Napkin Math 13.3). The running case is shown as real hardware once (an H100 photo, Fleet segment)."

segments:
  - name: Threats
    divider_question: "Which interfaces does a fleet expose, and to whom?"
    read: "§13.1 to §13.4, §13.5.5, §13.5.6"
    concept_questions: [1, 2, 3, 4]
    land: "Write the asset, boundary, adversary, and control before choosing a defense; every attack uses a permitted interface."
    minutes: 11.5
  - name: Theft
    divider_question: "How much of a model can its own API give away?"
    read: "§13.5.1 (Napkin Math 13.1)"
    concept_questions: [5, 6]
    land: "Extraction is bounded by a cumulative per-principal budget and an output contract; a daily quota only slows it."
    minutes: 8.5
  - name: Poisoning
    divider_question: "What can an attacker change by writing what the model learns?"
    read: "§13.3.1, §13.5.3, §13.8.3 (integrity checks)"
    concept_questions: [7, 8]
    land: "A poisoner optimizes through the defender's training and can leave clean accuracy intact; trust reaches only as far as the provenance record."
    minutes: 10
  - name: Fleet
    divider_question: "What does the fleet's own machinery expose, and what does defense cost?"
    read: "§13.6, §13.7, §13.8.1"
    concept_questions: [9, 10, 11]
    land: "The fleet's internal boundaries need their own controls, and each control is charged to one Fleet Law term."
    minutes: 12.5
  - name: Privacy
    divider_question: "What can a correct model reveal about its training data?"
    read: "§13.5.2, §13.8.5, §13.9"
    concept_questions: [12, 13, 14, 15]
    land: "Privacy is an accounted budget on releases; audits bound leakage from below and differential privacy from above."
    minutes: 16

concept_questions:
  - id: 1
    q: "Which boundary did each landmark breach cross?"
    picture: "Four credited photos: Strava heatmap screenshot, Siemens S7-300 PLC, 2014 Jeep Cherokee, IP camera; boundaries revealed under each."
    numbers: "Stuxnet: four zero-day exploits (§13.3.1, Farwell and Rohozinski 2011). Mirai: peak about 600,000 infections (§13.3.3, Antonakakis et al. 2017)."
    example: "Released model = aggregate; pretrained checkpoint = accepted component; perception model wired to an actuator = path to control; federated phone = endpoint."
    read: "§13.3"
  - id: 2
    q: "Which interfaces does the fleet expose on purpose?"
    picture: "New diagram fleetmap_step1-2 (make_figs.py): data feed, 1,024-GPU cluster with gradient ring, node admission, registry, serving API, users; step 2 numbers six interfaces and what crosses each."
    numbers: "1,024 GPUs in 128 nodes of 8 (§13.6)."
    example: "The reference fleet (running case)."
    read: "§13.1, §13.6"
  - id: 3
    q: "What does a threat model write down?"
    picture: "New diagram threatmodel.svg: one federated round (compromised client, reading coordinator, global model) with boundaries A and B; cards for confidentiality and integrity."
    numbers: "None; the four fields of §13.4."
    example: "The same update crosses a confidentiality boundary (coordinator reads) and an integrity boundary (client writes); authentication proves sender, not benign content."
    read: "§13.4, §13.4.1"
  - id: 4
    q: "What do a language-model API's two new boundaries look like?"
    picture: "New diagram llm_stream.svg (one token stream, external policy check) beside a chat-API message list with an injected tool message (illustrative content)."
    numbers: "None measured; denial of wallet keeps HTTP success normal while spend rises (§13.5.6)."
    example: "Indirect prompt injection from a retrieved page (Greshake et al. 2023); per-principal metering of tokens, retrievals, cost."
    read: "§13.5.5, §13.5.6"
  - id: 5
    q: "How much of a production model can its public API give away?"
    picture: "New log-scale bars carlini_queries.svg from the chapter's table 4, plus the API request fields used; theft_types.svg for exact against behavioral theft (optional slide)."
    numbers: "ada < 2M queries, babbage < 4M (weight matrix, RMS 5 x 10^-4 and 7 x 10^-4); gpt-3.5-turbo < 40M (hidden width); under $20 for ada and babbage, under $2,000 estimated for gpt-3.5-turbo (Carlini et al. 2024, abstract and table, as §13.5.1 table 4). Top 5 of 1,000 scores: 200 times fewer (derived, calcs.py)."
    example: "BERT extraction with random word sequences (Krishna et al. 2020, Example 13.1)."
    read: "§13.5.1"
  - id: 6
    q: "Does a daily quota bound a patient extractor?"
    picture: "Cumulative-bill build bill_step1-3 (book figure 6 redrawn): pay per query, daily quota, lifetime budget."
    numbers: "Scenario (Napkin Math 13.1): $5K training, 5M queries, $50/month for 10K/day, $0.001/query, 100K allowance. 500 days and $833 on the tier; $17 + $4,900 = $4,917 with a lifetime budget (derived in calcs.py, matches the book)."
    example: "ResNet-50 image API (the chapter's scenario; model change stated on the slide)."
    read: "§13.5.1, Napkin Math 13.1"
  - id: 7
    q: "How does a poisoner change a model it cannot touch?"
    picture: "New diagram bilevel.svg (outer attacker loop, inner defender training) with the objective written below."
    numbers: "Equations 1 and 2 (§13.5.3)."
    example: "Spam filter retrained on 'not spam' reports (§13.5.3)."
    read: "§13.5.3"
  - id: 8
    q: "How few poisoned examples change what a model learns, and where does trust end?"
    picture: "Nightshade grid (paper figure, four prompts, relabeled) and supply_step1-2 (Stuxnet chain over the ML supply chain)."
    numbers: "50, 100, 300 poisoned images per concept on SDXL (Shan et al. 2024); 0.01% of LAION-400M (about 40,000 images, derived) for $60 (Carlini et al., IEEE S&P 2024, abstract)."
    example: "True/false on four poisoning claims (§13.5.3, §13.11); release record for rollback and forensics (§13.8.3)."
    read: "§13.3.1, §13.5.3, §13.8.3"
  - id: 9
    q: "What can one compromised worker do to a synchronous mean?"
    picture: "breakdown.svg (illustrative: 63 values near 1.0 and one chosen value; mean against median) beside an H100 photo and the reference-cluster card."
    numbers: "350 GB FP16 gradients per step, 2.45 TB checkpoint (§13.6). Mean of 64 with one value of 10,000 is 157 (derived)."
    example: "Krum and coordinate-wise trimmed mean (Blanchard et al. 2017; Yin et al. 2018)."
    read: "§13.6.1"
  - id: 10
    q: "What does each control cost in the Fleet Law?"
    picture: "Estimate frame with gather_traffic.svg; focus slide with the Fleet Law and each control under its term."
    numbers: "N_DP = 64: ring 1.97 S per worker, gather 63 S, 32 times (derived, §13.6.1). Encryption at half link rate roughly doubles the bandwidth term (§13.6.2). Scenario: 1,000 to 850 tokens/s, 15 percent (Systems Perspective 13.2)."
    example: "Attestation and key re-delivery added to every recovery (§13.6.4)."
    read: "§13.6"
  - id: 11
    q: "Which narrow questions does hardware security answer, and at what price?"
    picture: "Real oscilloscope trace (book figure 16) beside a question-to-control table; optional epc.svg and fhe.svg."
    numbers: "256^5, about 1.1 x 10^12, guesses against 5 x 256 = 1,280 (derived); EPC 128 MiB = 134.2 MB, ResNet-50 FP32 102.4 MB = 76.3 percent (derived); FHE 200 s against 20 ms (assumed 10,000 times, Napkin Math 13.2)."
    example: "Breier et al. 2018 laser fault on a ReLU jump; 128 nodes with one part number (§13.7.6)."
    read: "§13.7, §13.8.1"
  - id: 12
    q: "Can a correctly working model return its training data?"
    picture: "Predict frame: diffusion memorization pair (Carlini et al. 2023) and gpt2_funnel_step2-3."
    numbers: "GPT-2: 600,000 samples, 1,800 inspected, 604 confirmed memorized (Carlini et al. 2021, §13.5.2)."
    example: "Membership (1 bit), inversion (a property), extraction (the record)."
    read: "§13.5.2"
  - id: 13
    q: "What do an audit and a DP guarantee each establish?"
    picture: "audit_roc.svg (book figure 7 redrawn, eps = 1, illustrative audit curve)."
    numbers: "TPR <= e^eps FPR under pure DP (§13.5.2)."
    example: "A shadow-model audit near chance is not a bound."
    read: "§13.5.2"
  - id: 14
    q: "What does differential privacy bound, and what does it cost a small group?"
    picture: "dp_step1-2 (two Laplace densities, illustrative) and the salary worked example with salary_err.svg."
    numbers: "Napkin Math 13.3: sensitivity $200,000, eps = 1, error $200 for 1,000 people, $2,000 for 100 (calcs.py)."
    example: "Adjacency per record against per person; Netflix: 8 ratings identified 99 percent of records (Narayanan and Shmatikov 2008)."
    read: "§13.9, §13.9.1"
  - id: 15
    q: "How does privacy loss add up, and which techniques bound a release?"
    picture: "accountant.svg beside real Opacus code; privacy-technique table with a Gboard screenshot."
    numbers: "Abadi et al. 2016, q = 0.01, sigma = 4, delta = 10^-5: moments accountant eps 1.26 and 2.55 against strong composition 9.34 and 24.22 (7.4 and 9.5 times, derived). Ten releases at eps = 1: basic bound 10."
    example: "Gboard (Archetype C, Lighthouse 13.1); federated learning is not private by itself (gradient inversion, Zhu et al. 2019)."
    read: "§13.8.5, §13.9.2, §13.9.3"

concept_trace:
  - concept: "ML threat model"
    frame: "A threat model writes down asset, boundary, adversary, and control"
    shown_by: "threatmodel.svg build: two boundaries of one federated round, each with its four-field card; prompt injection and denial of wallet on the next frame (llm_stream.svg)."
  - concept: "Extraction budgets"
    frame: "Predict: does a daily quota stop a patient extractor?"
    shown_by: "bill_step1-3: daily quota at $833 against lifetime budget at $4,917."
  - concept: "Poisoning as a bilevel attack"
    frame: "A poisoner optimizes through the defender's own training"
    shown_by: "bilevel.svg: outer attacker loop around inner training, objective below."
  - concept: "Breakdown point of the gradient mean"
    frame: "One compromised worker can move the mean for every replica"
    shown_by: "breakdown.svg: mean follows one worker, median holds."
  - concept: "Security controls priced on a C3 axis"
    frame: "Every defense adds step time (focus slide)"
    shown_by: "The Fleet Law with each control under its term; the estimate frame before it shows the 32 times gather cost."
  - concept: "Provenance bounds trust"
    frame: "A model is trusted only as far as its provenance record reaches"
    shown_by: "supply_step1-2: Stuxnet chain over the ML supply chain, then the provenance record fields."
  - concept: "Leakage through authorized outputs"
    frame: "Predict: can a correct model leak its data?"
    shown_by: "Diffusion memorization pair and the GPT-2 funnel (600,000, 1,800, 604)."
  - concept: "Differential privacy"
    frame: "Differential privacy bounds what one person can change"
    shown_by: "dp_step1-2 densities and the (eps, delta) inequality; the salary estimate follows."
  - concept: "Hardware trust questions (secondary)"
    frame: "Hardware answers four narrow trust questions"
    shown_by: "Power trace and the question-to-control table."
  - concept: "Privacy techniques by excluded observer (secondary)"
    frame: "Vote: is federated learning private by itself?"
    shown_by: "Technique, keeps out, still revealed table."
  - concept: "Privacy budget account (secondary)"
    frame: "Privacy loss adds up across releases, and an accountant tracks it"
    shown_by: "accountant.svg and Opacus code with the accountant call."

worked_examples:
  - name: "Napkin Math 13.1: protecting a production API"
    steps: ["given: $5K training, 5M queries for 90 percent fidelity, $50/month tier at 10K/day, $0.001 per query", "5M / 10K = 500 days", "500 x $50/30 = $833", "lifetime budget: $17 + $4,900 = $4,917", "a daily quota slows extraction; a lifetime budget priced near training removes its cost advantage"]
  - name: "Robust aggregation traffic at N_DP = 64 (§13.6.1)"
    steps: ["given: ring 2(N-1)/N x S, gather (N-1) x S", "ring 1.97 S", "gather 63 S", "32 times, on T_comm", "integrity at the fabric costs communication"]
  - name: "Napkin Math 13.3: the cost of differential privacy"
    steps: ["given: 1,000 salaries in $0 to $200,000, eps = 1, fixed roster", "sensitivity $200,000", "Laplace scale $200,000 on the sum", "error in the mean $200; $2,000 for 100 people", "small groups pay most"]

active_learning:
  - at_minute: 1
    type: predict
    prompt: "What did the heatmap with no names reveal?"
    answer: "C: where personnel at remote bases ran (War Story 13.1)."
  - at_minute: 4.5
    type: retrieval
    prompt: "What does a staged rollout limit, and does a canary see a rare backdoor?"
    answer: "Exposure, 20 times less at 5 percent; no, a rare trigger may never appear (§13.8.3)."
  - at_minute: 8.5
    type: concept_question
    prompt: "Match each breach to its boundary."
    answer: "Strava aggregate release; Stuxnet accepted components; Jeep path to brakes; Mirai default credentials."
  - at_minute: 11.5
    type: discuss
    prompt: "Which interface do you guard first?"
    answer: "It depends on the asset; name what must stay confidential, intact, or available first."
  - at_minute: 23
    type: predict
    prompt: "What does the full copy cost on the paid tier?"
    answer: "$833 over 500 days; a lifetime budget makes it $4,917."
  - at_minute: 32
    type: concept_question
    prompt: "True or false: four poisoning claims."
    answer: "False, false, true, false."
  - at_minute: 41
    type: estimate
    prompt: "What does a gather-based median cost the fabric at N_DP = 64?"
    answer: "63 S against 1.97 S, 32 times."
  - at_minute: 51
    type: predict
    prompt: "Of 1,800 inspected GPT-2 samples, how many were memorized training text?"
    answer: "604."
  - at_minute: 58
    type: estimate
    prompt: "How much noise hides one salary?"
    answer: "$200 error in the mean for 1,000 people; $2,000 for 100."
  - at_minute: 63
    type: concept_question
    prompt: "Is federated learning private by itself?"
    answer: "False; updates leak, and only DP bounds the release."
  - at_minute: 66
    type: retrieval
    prompt: "Write the heatmap's threat model."
    answer: "Asset routines; boundary the public release; adversary any viewer; control suppress sparse cells or DP per person."

open_questions:
  - "Returning log-probabilities helps developers and helped attackers recover a production model's width. Who should decide which scores an API returns?"
  - "A privacy budget is spent per population, across teams and years. Who owns the account, and what happens when it runs out?"
  - "A federated fleet cannot attest every phone. How much robust-aggregation traffic is a defense against one compromised client in 10,000 worth?"

more_examples:
  - "BERT extraction from public APIs (Krishna et al. 2020, Example 13.1)."
  - "Waymo and Tesla trade-secret cases (§13.5.1): insiders copy code and documents, not only weights."
  - "Perspective API evasion with misspellings (Hosseini et al. 2017)."
  - "Spectre, Meltdown, and laser fault injection on a ReLU (Breier et al. 2018)."
  - "SCAAML: CNNs recover AES keys from power traces (Bursztein and Picod 2019)."
  - "Netflix Prize de-anonymization (Narayanan and Shmatikov 2008)."

