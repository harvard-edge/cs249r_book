chapter: 06_distributed_training
lecture: "06"
title: "Distributed Training"
subtitle: "Splitting one training job across many accelerators"
volume: "Volume II"
layer: distributed
minutes: 75
notes_minutes: 70.5
core_minutes: 62.0
target_ideas: 30
thesis: "Every parallelism strategy turns memory pressure into communication, waiting, or idle time, and a good plan sends that overhead to the least binding resource."

hook:
  minutes: "0-4"
  setup: "Goyal et al. 2017 trained ResNet-50 on ImageNet in about one hour on 256 P100 GPUs (32 servers), against about 29 hours on one 8-GPU server, by growing the global batch 32 times to 8,192; throughput scaled at about 90 percent of ideal over 50 Gb/s Ethernet (paper sections 1, 4.3, 5.5). Photo: the P100's GP100 chip (FritzchensFritz, CC0)."
  question_to_class: "32 times the batch means 32 times fewer updates per epoch, for the same 90 epochs. Does ResNet-50 keep its accuracy? A) yes, old learning rate B) yes, learning rate x32 C) only with x32 and a warmup D) no"
  payoff: "C, answered in the Batches segment: 23.60% baseline, 24.84% at 8k without warmup, 23.74% with gradual warmup (Goyal Table 1); past 8k the error rises to 33.96% at 64k (Figure 3 legends). The synthesis returns to the run: the statistical wall, then the 175B job's memory and communication walls."
  sources: ["Goyal et al. 2017, arXiv:1706.02677, sections 1, 4.3, 5.5, Table 1, Figure 3", "chapter War Story 6.1, section 6.4.5"]

driving_question: "How should one training job that is too large and too slow for one node split across 1,024 GPUs?"

recall: "Lecture 5: a ring AllReduce moves 2(N-1)/N times the payload per worker; for the 175B model's 350 GB of FP16 gradients that is about 699 GB per GPU at N = 1,024, about 14 s at 50 GB/s, whatever N is (calcs.py)."

running_example: "The volume's Archetype A reference job: a 175B dense transformer, 16 B per parameter of mixed-precision Adam state (2,800 GB), on 1,024 H100s in 128 nodes of 8 (NVLink 450 GB/s per direction inside a node, NDR InfiniBand 50 GB/s per port between nodes). Scoreboard: pure data parallelism 15% efficiency (Napkin Math 6.5); TP 8 x DP 128 83%; TP 8 x PP 4 x DP 32 87% with ZeRO-1 to fit about 24 GB per GPU (section 6.6). Shown as the real thing through an 8-GPU NVLink board photo, InfiniBand cables, and Llama 3 405B's published layouts (Dubey et al. 2024, Table 4)."

goals:
  - "Compute scaling efficiency from the Fleet Law and find the scaling wall."
  - "Judge when a bigger batch or a looser barrier still buys progress."
  - "Size sharded state and a pipeline bubble for a model that does not fit."
  - "Place tensor, pipeline, and data parallelism on the bandwidth tiers."

segments:
  - name: Replicas
    divider_question: "When does copying the model and splitting the batch pay?"
    read: "§6.3, §6.4.1, §6.4.2"
    concept_questions: [1, 2, 3, 4]
    minutes: 11
    land: "Replicas reproduce single-device SGD, but their AllReduce stays near 2M bytes per GPU, so efficiency falls as N grows: 15 percent for the 175B job."
  - name: Batches
    divider_question: "Who waits at the barrier, and how large can the batch grow?"
    read: "§6.3.1 (synchronization models), §6.4.3 to §6.4.6"
    concept_questions: [5, 6, 7, 8]
    minutes: 11
    land: "The barrier makes the slowest worker set the step, and the critical batch caps how many replicas the optimizer can use."
  - name: Sharding
    divider_question: "How can replicas stop holding a full copy of the state?"
    read: "§6.1, §6.3.3, §6.5"
    concept_questions: [9, 10, 11]
    minutes: 9.5
    land: "Sharding buys capacity with messages; for the 175B job the state fits on 64 GPUs but the regather costs about ten times the compute."
  - name: Splitting
    divider_question: "How do we split the model's computation, and what does each cut cost?"
    read: "§6.5.1 to §6.5.5"
    concept_questions: [12, 13, 14]
    minutes: 12.5
    land: "Pipelines pay idle slots that only more microbatches shrink; tensor parallelism pays two exchanges per layer and needs the NVLink domain."
  - name: Placement
    divider_question: "How do the cuts combine, and where does each one run?"
    read: "§6.6 to §6.8"
    concept_questions: [15]
    minutes: 10.5
    land: "A plan is one joint point DP x PP x TP that fits memory and batch and puts each axis on a tier that carries it."

concept_questions:
  - id: 1
    q: "Why do data-parallel replicas compute the same update as one device?"
    picture: "dp_flow build: four GPUs with full copies, local gradients, AllReduce, identical update; the PyTorch DDP call"
    numbers: "g = (1/N) sum g_k equals the combined-batch gradient for equal local batches (§6.3); conditions: weighting by valid items, matching optimizer state"
    example: "PyTorch DistributedDataParallel"
    read: "§6.3"
  - id: 2
    q: "What is scaling efficiency, and why does it fall with N?"
    picture: "Fleet Law, then eta = T_compute / (N T_step) built term by term"
    numbers: "Equations 1 and 2 (§6.4.1); overhead multiplied by N"
    example: "a 1% single-device residual fills about 84% of each step at 512 GPUs (§6.4.2)"
    read: "§6.4.1, §6.4.2"
  - id: 3
    q: "Where does pure data parallelism hit the scaling wall for the 175B job?"
    picture: "eta_bars: illustrative few/many bars, then 2.1 s compute against 11.9 s exposed AllReduce; InfiniBand photo"
    numbers: "2.1e18 FLOPs per step; 2.07 s compute (FP8 at 50% of 1,979 TFLOP/s, 1,024 GPUs); 350 GB FP16 gradients; 11.9 s exposed; 15.0% (Napkin Math 6.5; calcs.py)"
    example: "the reference job as a counterfactual"
    read: "§6.4.1"
  - id: 4
    q: "What does leaving the node cost, and what do measured runs keep?"
    picture: "GPT-2 bars (99.4% against 27.9%); MLPerf Training five series with ideal lines"
    numbers: "Napkin Math 6.1-6.3: 11.7 ms NVLink sync against 4,650 ms over 10 GbE; 8.9x on 32 GPUs; $100 against $359. MLPerf: Eos GPT-3 58.3 min on 512 H100s, 3.9 min on 10,752 (21x GPUs, 14.9x time, 71%); largest runs keep 71-84% (MLCommons via MLSysIM; calcs.py)"
    example: "NVIDIA Eos"
    read: "§6.3.2, §6.4.2"
  - id: 5
    q: "Why does the slowest worker set each synchronous step?"
    picture: "0.99^N curve with 8, 100, 1,000 marked; PyTorch process-group timeout code"
    numbers: "92.3%, 36.6%, 0.0043% of steps with no late GPU (1% per GPU per step, §6.3.1; calcs.py); NCCL default collective timeout 10 minutes (PyTorch docs)"
    example: "a thermally throttled GPU"
    read: "§6.3.1"
  - id: 6
    q: "What do BSP, SSP, and ASP trade?"
    picture: "three timelines with a straggler W3 (after figure 5); one-line staleness definition"
    numbers: "staleness 0, <= s, unbounded; tables 2 and 4; SSP regret bound O(sqrt((s+1)N/T)) (Ho et al. 2013) in notes"
    example: "64-worker SSP scenario: 38.1x for $37 against BSP 40.1x for $35 (Napkin Math 6.6, illustrative)"
    read: "§6.3.1, §6.4.4, §6.4.7"
  - id: 7
    q: "What is the critical batch, and how many replicas can the optimizer use?"
    picture: "gradient-noise model: steps 1 + Bcrit/B and samples 1 + B/Bcrit (after figure 10); B* = tr(Sigma)/|grad L|^2; N ~ Bcrit/b"
    numbers: "Definition 6.6, McCandlish et al. 2018"
    example: "pilot trace: Bcrit = 16,000, batch 8,192 = 0.51 of it, crossover at 125 GPUs (Checkpoint 6.2 inputs; calcs.py)"
    read: "§6.4.6"
  - id: 8
    q: "Did ResNet-50 keep its accuracy at batch 8k, and past it?"
    picture: "Goyal Table 1 bars (column); batch sweep 128 to 64k"
    numbers: "23.60 / 24.84 / 23.74%; 16k 24.79, 32k 27.55, 64k 33.96%; spread up to 8k 0.26 points (Goyal Table 1, Figure 3 legends; calcs.py)"
    example: "linear scaling rule with 5-epoch gradual warmup"
    read: "§6.4.5, War Story 6.1"
  - id: 9
    q: "Why must state be split at all?"
    picture: "memory wall: Epoch AI notable models x 16 B against single-accelerator capacity"
    numbers: "GPT-3 2.8 TB, about 35x one 80 GB GPU; capacity K80 to B200 about 15x (§6.1, figure 1; MLSysIM)"
    example: "GPT-3 in 2020"
    read: "§6.1"
  - id: 10
    q: "What does each ZeRO stage shard, and what does it cost in traffic?"
    picture: "zero build: 7B on 64 GPUs per-GPU stacked bars with traffic; DeepSpeed config key; ZeRO-3 schedule table"
    numbers: "112, 29.3, 15.5, 1.75 GB; traffic 1x, 1x, 1x, 1.5x; about 3L collectives per step (Napkin Math 6.4, table 3; ZeRO-1/2 derived in calcs.py)"
    example: "DeepSpeed zero_optimization.stage; PyTorch FSDP FULL_SHARD"
    read: "§6.3.3"
  - id: 11
    q: "Can ZeRO-3 alone train the 175B model?"
    picture: "predict card, then fits / slow / no layer split"
    numbers: "2,800/64 = 43.75 GB + 4.8 GB activations = 48.55 GB (chapter rounds 48.6); regather about 1.1 TB per GPU per step, about 10x compute on one NDR port (Napkin Math 6.7, §6.5; calcs.py)"
    example: "the reference model"
    read: "§6.5"
  - id: 12
    q: "Where does a pipeline idle, and how many microbatches does it need?"
    picture: "pipe build: naive 6 of 8 idle, GPipe 6 of 14; bubble curve for p = 4, 8, 16; PyTorch Schedule1F1B"
    numbers: "(p-1)/(m+p-1): 42.9%, 17.9%, 31.9% (p16 m32), 8.6% (p4 m32); m > 9(p-1) = 135 for p = 16 (Napkin Math 6.8, §6.6.2; calcs.py)"
    example: "GPipe and 1F1B"
    read: "§6.5.1, §6.5.2"
  - id: 13
    q: "How does Megatron split a layer, and why must it stay on NVLink?"
    picture: "tp build (column then row then AllReduce); HGX board photo beside per-layer bars"
    numbers: "1.9 ms compute, 0.4 ms over NVLink, 3.5 ms over one NDR port per GPT-3 layer (Systems Perspective 6.1); NVLink 450 against NDR 50 GB/s = 9x"
    example: "Megatron-LM, two AllReduces per block"
    read: "§6.5.3"
  - id: 14
    q: "How well did tensor parallelism scale in practice, and which other axes exist?"
    picture: "Megatron-LM Figure 5 bars; three cards: context, experts, embeddings; FP8 line"
    numbers: "100, 95, 82, 77% (1 to 8 GPUs, one DGX-2H); 96, 83, 79, 74% (64 to 512) (Shoeybi et al. 2019, Figure 5); ring attention chunks >= 1,100 tokens on NVLink, >= 9,900 on NDR (§6.5.4)"
    example: "Ring Attention, Switch Transformer, DLRM"
    read: "§6.5.3 to §6.5.6, §6.4.8"
  - id: 15
    q: "How do the axes combine into one feasible plan?"
    picture: "grid3d on the tiers with Megatron-LM flags; hybrid scoreboard build; Llama 3 Table 4"
    numbers: "configs A/B/C: 15, 83 (54.5 without overlap), 87%; state 2,800, 350, 87.5 GB per GPU, 23.9 GB with ZeRO-1; DP shard 10.94 GB (section 6.6; calcs.py). Llama 3 405B: TP8 PP16 DP64 on 8,192 at 43% MFU; TP8 PP16 DP128 on 16,384 at 41%; TP8 CP16 PP16 DP8 at 38% (Dubey et al. 2024, Table 4)"
    example: "Llama 3 405B"
    read: "§6.6, §6.8"

concept_trace:
  - concept: "Data-parallel update equivalence"
    frame: "Data parallelism averages N local gradients into one update"
    shown_by: "dp_flow 3-step build ending in identical updates, with the averaging equation"
  - concept: "Synchronization models and stragglers"
    frame: "BSP waits at a barrier; SSP and ASP trade waiting for staleness"
    shown_by: "three-panel timeline build with straggler W3; preceded by the 0.99^N straggler curve frame"
  - concept: "Sharded data parallelism"
    frame: "ZeRO shards optimizer state, then gradients, then weights"
    shown_by: "4-step per-GPU memory build with traffic labels 1x, 1x, 1x, 1.5x"
  - concept: "Scaling efficiency and the scaling wall"
    frame: "The 175B AllReduce leaves 15% efficiency at 1,024 GPUs"
    shown_by: "eta_bars: schematic shrinking compute against constant communication, then 2.1 s against 11.9 s"
  - concept: "Critical batch size"
    frame: "Past the critical batch, more samples buy few fewer steps"
    shown_by: "steps and samples curves crossing at B = Bcrit, with the B* formula and N ~ Bcrit/b"
  - concept: "Pipeline parallelism bubble"
    frame: "A pipeline idles (p-1)/(m+p-1) of each step"
    shown_by: "bubble curve for p = 4, 8 with marked points; preceded by the GPipe schedule build"
  - concept: "Tensor parallelism in the fast domain"
    frame: "Tensor-parallel exchanges fit only inside the NVLink domain"
    shown_by: "NVLink board photo beside per-layer compute/NVLink/NDR bars (1.9, 0.4, 3.5 ms)"
  - concept: "Parallelism plan as joint placement"
    frame: "A parallelism plan is a joint placement of DP, PP, and TP"
    shown_by: "grid3d layout TP8 x PP4 x DP32 on node/stage/replica tiers with the four tests; then the hybrid scoreboard build"

worked_examples:
  - name: "Napkin Math 6.5: scaling efficiency of the 175B job"
    steps: ["given: 175B, 2M tokens per update, 1,024 H100s, FP8 at 50% of 1,979 TFLOP/s, FP16 gradients, 50 GB/s", "6 x 175e9 x 2e6 = 2.1e18 FLOPs; 2.07 s per GPU", "ring transfer of 350 GB about 14 s; 11.9 s exposed", "eta = 2.1 / 14.0 = 15%", "meaning: the scaling wall of pure data parallelism"]
  - name: "Napkin Math 6.4 and 6.7: ZeRO stages and the 175B fit"
    steps: ["7B x 16 B = 112 GB > 80 GB", "ZeRO-1 29.3 GB, ZeRO-2 15.5 GB, ZeRO-3 1.75 GB on 64 GPUs", "175B: 2,800/64 = 43.75 GB + 4.8 GB = 48.55 GB, fits", "but regather about 1.1 TB per GPU per step", "meaning: capacity bought with bandwidth"]
  - name: "Napkin Math 6.8: the pipeline bubble"
    steps: ["(p-1)/(m+p-1)", "p = 4, m = 4: 42.9%; p = 8, m = 32: 17.9%", "your turn: p = 16, m = 32: 31.9%", "below 10% needs m > 135", "meaning: microbatches must outnumber stages, and they grow the batch"]
  - name: "Section 6.6: the hybrid scoreboard"
    steps: ["A: DP-1024, 15%, 2,800 GB per GPU", "B: TP8 x DP128, shard 43.75 GB, 1.75 s, 83% (54.5% without overlap), 350 GB per GPU", "C: TP8 x PP4 x DP32, shard 10.94 GB, 0.44 s, bubble 8.6%, 87%, 87.5 GB per GPU", "ZeRO-1 across 32 replicas: 23.9 GB per GPU", "meaning: match each axis to the tier that carries it"]

active_learning:
  - at_minute: 2
    type: predict
    prompt: "Does ResNet-50 keep its accuracy at batch 8,192? A) old LR B) LR x32 C) x32 with warmup D) no"
    answer: "C: 24.84% without warmup, 23.74% with gradual warmup, against 23.60% (Goyal Table 1)."
  - at_minute: 6
    type: retrieval
    prompt: "Write the bytes each worker sends in a ring AllReduce of M bytes; price 350 GB at 50 GB/s."
    answer: "2(N-1)/N x M, about 699 GB per GPU at N = 1,024, about 14 s."
  - at_minute: 16
    type: estimate
    prompt: "GPT-2, 1.8 s compute: estimate efficiency in one NVLink node and across four 10 GbE nodes."
    answer: "99.4% and 27.9%; 8.9x on 32 GPUs; one node with 4-step accumulation costs $100 against $359."
  - at_minute: 28.5
    type: estimate
    prompt: "tr(Sigma) = 1.6e6, |grad L|^2 = 100, 4 sequences per GPU, 32 accumulation steps, 64 GPUs: is B = 8,192 past the critical batch?"
    answer: "Bcrit = 16,000; 8,192 is 0.51 of it; crossover near 125 GPUs."
  - at_minute: 37.5
    type: predict
    prompt: "Can ZeRO-3 alone train the 175B model on 64 GPUs of 80 GB? Does it fit? Is it fast?"
    answer: "Fits at 48.55 GB; slow, about 1.1 TB of regather per GPU per step, about 10x compute; no layer is split."
  - at_minute: 46
    type: estimate
    prompt: "What fraction idles at p = 16, m = 32?"
    answer: "15/47 = 31.9%; below 10% needs m > 135."
  - at_minute: 59.5
    type: diagnose
    prompt: "Run A: TP 8 spans two nodes; Run B: PP 8, m = 8, MFU 35%, links idle; Run C: pure DP across 128 nodes."
    answer: "A: TP off its tier (3.5 ms against 1.9 ms per layer). B: bubble 7/15 = 46.7%. C: scaling wall; add TP and PP."
  - at_minute: 64
    type: concept_question
    prompt: "True or false: linear speedup with enough engineering; accumulation is free; LR from 8 GPUs works on 256; 50% node MFU at 83% scaling gives about 41.5% fleet MFU."
    answer: "F, F, F, T (chapter §6.10 fallacies and pitfalls)."

open_questions:
  - "NVLink Switch systems stretch the fast domain past one server. Which placement rules change, and which stay?"
  - "Llama 3 accepted lower MFU to double its GPUs. When is a faster but less efficient run the right purchase?"
  - "Stale updates trade waiting for convergence. Will heterogeneous fleets make asynchronous training return?"

more_examples:
  - "Llama 3 405B 4D parallelism and its MFU at 8,192 and 16,384 H100s (Dubey et al. 2024, Table 4)."
  - "MLPerf Training GPT-3 and Llama 3.1 405B scaling series (MLCommons v3.1 to v5.1)."
  - "Megatron-LM weak scaling to 512 V100s (Shoeybi et al. 2019, Figure 5)."
  - "Horovod and the move from parameter servers to ring AllReduce (Sergeev and Del Balso 2018; chapter footnote 1)."
  - "PPO against DPO alignment budgets: 1,494 GB against 1,260 GB (Napkin Math 6.9)."
  - "DLRM embedding sharding of 10 TB+ tables (Lighthouse 6.1)."

