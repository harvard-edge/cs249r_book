closing:
  return_to_hook: "Three walls, one per row: the one-hour run hit the statistical wall and needed a scaled learning rate with warmup, which failed past 8k; the 175B job's 2,800 GB hit the memory wall, answered by ZeRO, TP, and PP at the price of bytes, a fast link, and a bubble; pure data parallelism hit the scaling wall at 15 percent, and placing each axis on its tier reached about 87 percent."
  read_and_practice: ["§6.3 to §6.6 and §6.10", "the section self-checks", "redo Napkin Math 6.8 for p = 16"]
  bridge: "Lecture 7 (Fault Tolerance): how often does a large job fail, and how often should it save itself? At 1,024 GPUs with a 50,000-hour MTTF, a GPU fails about every 48.8 hours (§6.1; calcs.py)."

