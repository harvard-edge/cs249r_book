active_learning:
  - at_minute: 1
    type: predict
    prompt: "Did the phone-trained keyboard model beat the data-center model?"
    answer: "C: 15.8 against 15.0 percent top-1 recall on client caches (Hard et al. Table 4); ties on logs."
  - at_minute: 5
    type: retrieval
    prompt: "What is SLO goodput? Write the Fleet Law."
    answer: "Requests per second that meet the latency contract (Lecture 10); T_step = T_compute/N + T_comm + T_sync - T_overlap (Lecture 1)."
  - at_minute: 15
    type: predict
    prompt: "A 10M-parameter model has 40 MB of FP32 weights. Will its full fine-tune fit a 300 MB allowance?"
    answer: "No: 360 MB with Adam and 200 MB of saved activations (figure 3)."
  - at_minute: 28
    type: estimate
    prompt: "4.5 W for 30 minutes on a 15 Wh battery: what share?"
    answer: "2.25 Wh, 15 percent."
  - at_minute: 33
    type: concept_question
    prompt: "Which admission test does charging relax?"
    answer: "Energy only; heat and the foreground deadline remain."
  - at_minute: 39
    type: predict
    prompt: "Non-IID clients, 5 local epochs: more or fewer rounds than one step per round?"
    answer: "More: 1,000 against 483 (McMahan et al. Table 2)."
  - at_minute: 43
    type: estimate
    prompt: "200 MB raw a week against a 2.5 MB update: when do uploads break even?"
    answer: "80 rounds; daily saves, hourly loses."
  - at_minute: 50
    type: concept_question
    prompt: "True or false: federated learning keeps data local, so it is private."
    answer: "False: updates leak (gradient inversion); secure aggregation and differential privacy guard different boundaries."
  - at_minute: 57
    type: diagnose
    prompt: "Budget phones are 20 percent of the fleet and 5 percent of completed updates. Ratio and fix?"
    answer: "0.25; stratified sampling among admitted phones and per-cohort evaluation; never-admitted phones need a policy change."
  - at_minute: 66
    type: retrieval
    prompt: "From memory: what did the Gboard model cost each phone, the network, and the population?"
    answer: "A gated update; 3,000 rounds of uploads; only charging, idle, unmetered phones with 2 GB taught it."

open_questions:
  - "Gboard's eligibility rule (charging, idle, unmetered) protects users and skews the population. Who should decide that trade, and on what evidence?"
  - "Phone NPUs keep growing in TOPS but rarely run backward passes. Should phone chips be designed for training at all?"
  - "If a model keeps learning on 50 million devices, what does it mean to certify it?"

