  read_and_practice: ["§10.3, §10.6 to §10.8, §10.11, §10.15.1", "the chapter's self-check questions", "Napkin Math 10.5 by hand"]
  further_reading:
    - cite: "Yu et al., Orca, OSDI 2022"
      why: "Iteration-level scheduling."
    - cite: "Kwon et al., Efficient Memory Management for LLM Serving with PagedAttention, SOSP 2023"
      why: "KV waste measured and the block table."
    - cite: "Agrawal et al., Sarathi-Serve, OSDI 2024"
      why: "Chunked prefill."
    - cite: "Zhong et al., DistServe, OSDI 2024"
      why: "Separate prefill and decode pools."
    - cite: "Mitzenmacher, The Power of Two Choices in Randomized Load Balancing, IEEE TPDS 2001"
      why: "The two-choices bound."
  bridge: "Next lecture (Edge Intelligence): when should a model learn on the device, and what does a fleet of phones learn from?"

