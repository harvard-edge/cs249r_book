notes_for_author:
  - "The chapter is marked for a second lecture; this deck covers the replica in depth and the fleet in one segment. Global inference (§10.14), MoE serving, and multi-LoRA are the natural second-lecture content."
  - "Real data added from outside the chapter: the Azure LLM traces (CC BY, stored under images/data/) and InferenceX via MLSysIM. Lead may prefer not to ship 1 MB of trace CSV in the repo; make_figs.py and calcs.py read it."
  - "The replica photo shows an HGX B200 board (eight-GPU layout); no openly licensed photo of an 8x H100 board was found on Commons. The H100 node photo (TSUBAME 4.0, HPE Cray XD665) holds four H100s."
  - "2026-10-19 sweep (D4, D10). D4: the goals slide names, once, the Fleet Law term (T_compute/N and T_sync(N)) and C3 axis (Compute (C1) and Coordination (C3)) in the volume's one form (the \\fleetterm line). The 15 per-slide \\cterm tags moved into the notes (each note now ends with its C3 axis or Fleet Law term), so every deck of the volume uses one form. D10: X-not-Y constructions and reveal colons rewritten. No exhibit here is retold from another lecture (D3)."
