  - "vLLM engine arguments as a map of the lecture's knobs (vllm/engine/arg_utils.py)."
  - "ChatGPT outage of 20 March 2023 (War Story 10.1)."
  - "Archetype B (DLRM at Scale): embedding sharding and the tail at scale (Lighthouses 10.1, 10.2)."

