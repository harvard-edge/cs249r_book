closing:
  return_to_hook: "Dublin's operators had capital and chips; the grid connection was the ceiling. The 405B run: 17.7 MW ceiling, 33.2 GWh account, carbon of 0, 8,930, or 14,262 t depending on signal and boundary, 332 to 27,261 t by grid, 192 t embodied, 34 to 53 million L of water (derived)."
  read_and_practice: ["§15.3 to §15.5 and §15.9.4", "Napkin Math 15.2, 15.3, 15.6 by hand", "§15.11 fallacies and the self-check questions"]
  further_reading:
    - cite: "Patterson et al., Carbon Emissions and Large Neural Network Training, 2021"
      url: "https://arxiv.org/abs/2104.10350"
      why: "Table 4: training emissions with measured power, PUE, and grid factor."
    - cite: "Luccioni et al., Estimating the Carbon Footprint of BLOOM, JMLR 2023"
      url: "https://arxiv.org/abs/2211.02001"
      why: "Embodied, idle, and dynamic emissions, and the whole project's development."
    - cite: "Elsworth et al., Measuring the Environmental Impact of Delivering AI at Google Scale, 2025"
      url: "https://arxiv.org/abs/2508.15734"
      why: "Serving energy, carbon, and water per prompt on two boundaries."
    - cite: "Schneider et al., Life-Cycle Emissions of AI Hardware, 2025"
      url: "https://arxiv.org/abs/2502.01671"
      why: "The first cradle-to-grave study of an AI accelerator family."
    - cite: "Radovanovic et al., Carbon-Aware Computing for Datacenters, 2021"
      url: "https://arxiv.org/abs/2106.11750"
      why: "A production carbon-aware scheduler."
  bridge: "Lecture 16 (Responsible AI): the fleet fits its power budget. Who bears its costs, and who can contest its decisions?"

