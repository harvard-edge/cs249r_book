worked_examples:
  - name: "The running case's operational carbon (Napkin Math 15.6 method)"
    steps: ["given: 30.84M GPU-h at 700 W; DGX H100 rack profile 1.375; PUE 1.12; 429 g/kWh", "GPU energy 21,588 MWh", "IT 29,684 MWh; facility 33,246 MWh", "14,262 t at the US average (derived)", "against the card's 8,930 t location-based and 0 t market-based, the gap is boundary and signal"]
  - name: "Replacement break-even (§15.8.6)"
    steps: ["given: old GPU 700 W continuous; new GPU same work at half the energy; 164 kg to make", "saving 8.4 kWh a day", "US 3.60 kg/day: 6.5 weeks", "Quebec 0.168 kg/day: 2.7 years", "the same upgrade repays fast on a dirty grid and barely at all on a clean one"]
  - name: "Move or cut (Napkin Math 15.2, §15.2 self-check 2)"
    steps: ["given: 10,000 MWh; Poland 820, Quebec 20 g/kWh", "Poland 8,200 t", "15 percent cut: 6,970 t", "Quebec 200 t, 41x below Poland", "placement changes the factor; a real move also counts transfer, PUE, capacity, deadline, and the marginal grid response"]
  - name: "Rebound (Checkpoint 15.5)"
    steps: ["given: energy per query -50 percent; queries +300 percent", "fleet energy = per-query energy x queries", "0.5 x 4 = 2x", "efficiency targets need an absolute budget"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "Operators had capital and chips. In 2022, what gated new Dublin sites?"
    answer: "C, grid connection (Government of Ireland 2022)."
  - at_minute: 4
    type: retrieval
    prompt: "How many training passes per batch did PGD-7 adversarial training cost?"
    answer: "8: seven attack steps and one update (Lecture 14)."
  - at_minute: 15
    type: diagnose
    prompt: "Does a 120 MW three-day run fit an 80 MW feed if its energy is less than a month's facility use?"
    answer: "No; power is checked every instant. 67 percent concurrency, about 4.5 days (derived), or more deliverable power."
  - at_minute: 29.5
    type: concept_question
    prompt: "True or false: a GPU draws its TDP; the lower-PUE site emits less; a larger model emits more to train."
    answer: "All false (Patterson et al. Table 4; 4.86 against 0.675 t/h derived; GShard-600B 4.3 t against T5 46.7 t)."
  - at_minute: 37.5
    type: estimate
    prompt: "When does a new GPU that halves energy repay its 164 kg of manufacturing?"
    answer: "6.5 weeks on the US-average grid; 2.7 years on Quebec's (derived)."
  - at_minute: 47
    type: predict
    prompt: "10,000 MWh run: stay in Poland and cut energy 15 percent, or move to Quebec?"
    answer: "Move: 200 t against 6,970 t (Poland 8,200 t)."
  - at_minute: 57.5
    type: estimate
    prompt: "Energy per query halves; queries rise 300 percent. Fleet energy?"
    answer: "2x (0.5 x 4)."
  - at_minute: 62.5
    type: retrieval
    prompt: "Name the ceiling, the account, and three numbers for the 405B run's carbon."
    answer: "Grid connection is the ceiling; 33.2 GWh; 0 t, 8,930 t, 14,262 t (and 332 to 27,261 t by grid)."

open_questions:
  - "Should a model card report location-based, market-based, or both, and which boundary should be the default?"
  - "A data center's power is cheap where its community's water is scarce. Who should decide the site, and with what evidence?"
  - "Should a fleet's carbon budget cap total energy, or only carbon per unit of work?"

more_examples:
  - "Elsworth et al. 2025: Google's median Gemini prompt energy fell 33x in a year, 23x from models and 1.4x from utilization (§4.3)."
  - "Patterson et al. 2021 Table 4: Meena 232 MWh and 96.4 t on a 0.415 kg/kWh grid; Switch 179 MWh, 59.1 t."
  - "BLOOM (Luccioni et al. 2023 Table 4): 433 MWh, 25 t without PUE and 30 t with PUE 1.2 on a 57 g/kWh grid."
  - "Schneider et al. 2025: compute carbon intensity improved 3x from TPU v4i to v6e."
  - "SA §15.6.3: rerunning 30 to 60 minutes on 10,000 accelerators after a cooling failure repeats 3.5 to 7 MWh."
  - "SA Example 15.1: carbon-aware placement with a $100/t internal price selects Quebec at $25.3M."
  - "SA §15.7.4: wake-word hierarchy 15.5 microwatts against 10 mW always on; edge-cloud cascade 6.5 mJ against 60 mJ."

