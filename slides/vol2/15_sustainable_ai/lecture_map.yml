chapter: 15_sustainable_ai
lecture: "15"
title: "Sustainable AI"
subtitle: "Power, energy, and carbon for a fleet"
layer: governance
minutes: 75
notes_minutes: 70
core_minutes: 59
target_ideas: 30
thesis: "Power is a ceiling on what a fleet can run at any instant and energy is an account over time; carbon follows from energy only through boundary, grid, and allocation choices."

hook:
  minutes: "0-3.5"
  setup: "A credited aerial photo of Meta's Clonee data center beside CSO Ireland's Table 1: data centers used 5 percent of Ireland's metered electricity in 2015 and 21 percent in 2023. Step 2 marks the July 2022 government statement (War Story 15.1)."
  question_to_class: "Operators had capital and chips. In 2022, what gated new Dublin sites? A) GPUs B) money C) grid connection D) cooling water"
  payoff: "C. Dublin needed transmission reinforcement before it could accept new data-center power requests (Government of Ireland 2022). The synthesis returns with the running case's power ceiling (17.7 MW), energy account (33.2 GWh), and the five numbers that its carbon can take."
  sources:
    - "CSO Ireland, Data Centres Metered Electricity Consumption 2023 (release of 23 July 2024), Table 1: 1,238 GWh and 5 percent (2015) to 6,334 GWh and 21 percent (2023). Growth 5.1x derived in calcs.py."
    - "Sustainable AI, War Story 15.1 (Government of Ireland 2022); Lighthouse 15.1 (25,000 GPUs x 700 W = 17.5 MW)."

recall: "Lecture 14, close your notes: how many training passes per batch did PGD-7 adversarial training cost? (8: seven attack steps and one update, equal-cost work model, Napkin Math 14.2.) Every pass draws power. Then the running case is introduced."

driving_question: "Can the grid power the fleet we want, and what does each answer cost in carbon and water?"

goals:
  - "Separate the power ceiling from the energy account, and size both for a training run."
  - "Turn energy into carbon through IT, PUE, and grid factor, and state the boundary."
  - "Allocate manufacturing carbon, and find the dominant lifecycle term."
  - "Judge placement, time-shifting, and water as levers with costs."
  - "Explain why fleet demand can outrun efficiency, and what bounds it."

running_example: "Llama 3.1 405B, an Archetype A run: up to 16,384 H100 GPUs at 700 W TDP (Dubey et al. 2024, Sec. 3.3.1), 30.84M GPU-hours, 8,930 t location-based and 0 t market-based (Llama 3.1 model card). Derived with the chapter's method (calcs.py): 11.47 MW of GPUs, 15.77 MW IT (x 1.375 DGX H100 rack profile), 17.66 MW facility (PUE 1.12); 21,588 MWh GPU, 29,684 MWh IT, 33,246 MWh facility; 14,262 t at 429 g/kWh; 665 t in Quebec; 27,261 t in Poland; 192 t embodied by time share of a 3-year life (2,687 t for the fleet); 34 to 53 million L of water. Shown as the real system: liquid-cooled H100 node photo (TSUBAME 4.0), the Llama 3 paper's grid-swing quote, and the model card's own emissions table."

segments:
  - name: Ceiling
    divider_question: "What limits a fleet at an instant, and what adds up over a run?"
    read: "§15.3.1, §15.3.2, §15.6.2"
    concept_questions: [1, 2, 3]
    land: "Power is a ceiling at every instant, energy is an account over time, and a site's connection, not its budget, sets the ceiling."
    minutes: 11.5
  - name: Account
    divider_question: "How does a run's energy become carbon, and why do reports disagree?"
    read: "§15.4, §15.5.3, §15.5.4"
    concept_questions: [4, 5, 6, 7, 8]
    land: "Carbon equals IT energy times PUE times grid factor, and every report must declare its boundary and signal."
    minutes: 14
  - name: Lifecycle
    divider_question: "Which carbon does no meter record, and which term dominates?"
    read: "§15.5.5, §15.5.6, §15.7.3, §15.8"
    concept_questions: [9, 10, 11, 12]
    land: "Manufacturing is paid before boot, its share grows on clean grids, and the dominant lifecycle term picks the lever."
    minutes: 15
  - name: Placement
    divider_question: "Where and when should a flexible job run, and what does water cost?"
    read: "§15.2, §15.6.3, §15.9.4"
    concept_questions: [13, 14]
    land: "Placement, time-shifting, and cooling change the factor applied to energy, each at a price."
    minutes: 10.5
  - name: Demand
    divider_question: "If each query gets cheaper, why can fleet energy rise?"
    read: "§15.3, §15.6.1, §15.9"
    concept_questions: [15]
    land: "Demand can outrun efficiency, so efficiency targets need an absolute budget."
    minutes: 5.5

concept_questions:
  - id: 1
    q: "What limits a fleet at an instant, and what accumulates over a run?"
    picture: "H100 node photo beside a two-step figure: a stacked bar of facility power (GPUs, host and fabric, PUE) and then power over 78 days with the area as energy."
    numbers: "Derived (calcs.py): 11.47, 15.77, 17.66 MW; 1,882 h; 33.2 GWh. Inputs: Dubey et al. Sec. 3.3.1; model card; SA table 7; PUE 1.12 (SA Napkin Math 15.6, MLSysIM)."
    example: "A three-day 120 MW run in an 80 MW feed (SA §15.3 self-check 2): 67 percent concurrency, about 4.5 days (derived)."
    read: "§15.3.1"
  - id: 2
    q: "What does a rack draw beyond its GPUs, and where is each loss counted?"
    picture: "Three-step stacked bar of the DGX H100 rack (SA table 7): GPUs 22.4 kW, IT 30.8 kW (1.38x), 33.5 kW with allocated overhead (1.50x)."
    numbers: "SA table 7; ratios derived in calcs.py; GPUs 67 percent of the rack."
    example: "Transformer, UPS, and distribution losses raise PUE; server supplies and regulators stay in IT load (§15.6.2)."
    read: "§15.6.2"
  - id: 3
    q: "Why does synchronized training stress the grid, and why is the substation the long pole?"
    picture: "Substation photo (The Dalles) and the Llama 3 paper's quote on tens-of-megawatt swings."
    numbers: "Dubey et al. 2024 §3.3.4 (qualitative, tens of MW); substation about 24 months against GPUs about 6 (SA Systems Perspective 15.2, illustrative)."
    example: "Staggered checkpoint writes de-correlate the power steps; energy buffering absorbs them."
    read: "§15.3.2, §15.6.2"
  - id: 4
    q: "How does a run's energy become operational carbon?"
    picture: "Four-step chain: GPU 21.6 GWh, IT 29.7 GWh, facility 33.2 GWh, 14,262 t."
    numbers: "Derived (calcs.py) with SA equations 9 and 10, US-average 429 g/kWh (MLSysIM)."
    example: "Each factor acts at its own tier; percentages from different tiers do not multiply into one saving."
    read: "§15.5.4"
  - id: 5
    q: "What does PUE measure, and what does it leave out?"
    picture: "Facility power for 2 MW IT at PUE 1.58, 1.55, 1.10, 1.09; saving 0.96 MW, 8,410 MWh a year."
    numbers: "SA Napkin Math 15.3 ($588,672 a year at $70/MWh); Uptime 2022 average 1.55 (SA §15.4.1); Google fleet 1.09 (Elsworth et al. 2025 §4.3)."
    example: "Idle servers sit in the IT denominator; PUE can rise when they are made efficient."
    read: "§15.4.1"
  - id: 6
    q: "How much does the measurement boundary move one number?"
    picture: "Elsworth et al. Table 1 as two stacked bars: 0.10 Wh accelerators only against 0.24 Wh full stack."
    numbers: "Elsworth et al. 2025 Table 1; 2.4x and 58 percent derived; 345 against 94 g/kWh (§3.3), 3.7x derived."
    example: "Narrow boundary to compare two models on one server; full stack to report a service."
    read: "§15.5.1, §15.7.3"
  - id: 7
    q: "What must a carbon claim declare before it can be compared?"
    picture: "The Llama 3.1 model card's emissions table (abridged, real artifact) beside a five-field comparison: model card against the facility account."
    numbers: "Card: 30.84M GPU-h, 700 W, 8,930 t location-based, 0 t market-based; implied 414 g/kWh and facility account 14,262 t (1.60x) derived."
    example: "Boundary explains 8,930 against 14,262; carbon signal explains 8,930 against 0."
    read: "§15.4"
  - id: 8
    q: "Do TDP, PUE, or model size predict a run's carbon?"
    picture: "True-or-false with Patterson et al. Table 4 plotted: net t CO2e against parameters for T5, Meena, GShard-600B, Switch, GPT-3."
    numbers: "Patterson et al. 2021 Table 4 (TPU v3 TDP 450 W; measured 245 to 310 W per chip with host; GShard 4.3 t, T5 46.7 t, GPT-3 552.1 t); PUE A against B 4.86 against 0.675 t/h (SA §15.6 self-check 3, derived)."
    example: "The chapter's fallacies 'TDP is actual power' and 'PUE is a complete metric'."
    read: "§15.11"
  - id: 9
    q: "What carbon is emitted before the first job runs, and how is it charged to work?"
    picture: "H100 photo beside 164 kg per GPU; 2,687 t for 16,384 GPUs; 192 t by time share."
    numbers: "SA §15.5.5 (NVIDIA HGX H100 PCF 1,312 kg / 8, via MLSysIM); allocation derived."
    example: "Time, reserved capacity, or useful work as allocation rules (Schneider and Mattia 2024, as cited in §15.5.6)."
    read: "§15.5.5, §15.5.6"
  - id: 10
    q: "When does embodied carbon matter?"
    picture: "Running case embodied share 1.3 percent (US) against 22 percent (Quebec), then TPU v6e 11 or 24 percent and BLOOM 22 percent."
    numbers: "Derived (calcs.py); Schneider et al. 2025 Table 1; Luccioni et al. 2023 Table 3."
    example: "Keep old hardware longest on a clean grid."
    read: "§15.5.5"
  - id: 11
    q: "When does a replacement accelerator repay its manufacturing?"
    picture: "Break-even curves: avoided kg against days, US and Quebec, with the 164 kg line and a 3-year life."
    numbers: "SA §15.8.6; 8.4 kWh/day, 3.60 and 0.168 kg/day, 6.5 weeks and 2.7 years derived."
    example: "Extending life from 3 to 5 years cuts embodied carbon per year by 40 percent."
    read: "§15.8.6"
  - id: 12
    q: "Which lifecycle phase dominates, and what does the reported run leave out?"
    picture: "BLOOM Table 5 bars (final run 37 percent of the project) and a crossover plot: serving at an assumed 1 billion prompts a day at 0.24 Wh passes the 405B run's 33.2 GWh by day 139."
    numbers: "Luccioni et al. 2023 Table 5; Elsworth et al. Table 1; crossover derived with an illustrative volume."
    example: "Inference dominates widely served models; training and development dominate frequently retrained ones."
    read: "§15.5.6, §15.7.3, §15.8.1"
  - id: 13
    q: "How much does placement change carbon, and what does a move cost?"
    picture: "Photos of the Belchatow coal plant and the Daniel-Johnson dam; predict A (cut 15 percent in Poland) against B (move to Quebec); then nine regions for the running case."
    numbers: "SA Napkin Math 15.2 (8,200 against 200 t, 41x) and §15.2 self-check 2 (6,970 t); nine grid factors via MLSysIM (332 to 27,261 t, 82x); Example 15.1 ($25.3M with a $100/t price)."
    example: "Feasibility (capacity, data, deadline) filters regions before carbon ranks them."
    read: "§15.2, §15.5.3, §15.9.4"
  - id: 14
    q: "When should a flexible job wait, and what is water's separate account?"
    picture: "EU fossil share of generation, one week of November 2023, with the best and worst 24-hour windows; cooling-tower fill photo with WUE numbers."
    numbers: "Energy-Charts data (SA figure 19): hourly 20 to 38 percent; 24-hour windows 36 against 23 percent (1.57x) derived; WUE 1.8 L/kWh, 10 MW, 158 million L a year (SA §15.6.3); 0.26 mL per prompt and WUE 1.15 (Elsworth et al.); run water 34 to 53 million L derived."
    example: "Waiting pays only when avoided emissions exceed checkpoint, idle, and migration costs."
    read: "§15.6.3, §15.8.2, §15.9.4"
  - id: 15
    q: "Why can fleet energy rise when each query gets cheaper?"
    picture: "Rebound bars (0.5x per query, 4x queries, 2x fleet energy) and LBNL US data-center electricity (58, 192, 649 TWh reference in 521 to 843)."
    numbers: "SA Checkpoint 15.5; Kaplan 8.2x per 10 percent lower loss (derived from exponent 0.05); LBNL via SA §15.6.1; 3.3x derived."
    example: "Masanet et al. 2020: efficiency held 2010s data-center energy nearly flat."
    read: "§15.3, §15.6.1, §15.9"

concept_trace:
  - concept: "Power ceiling versus energy account"
    frame: "Power caps each instant; energy accumulates over the run"
    shown_by: "power_energy_step1..2: facility power bar, then power over time with the 33.2 GWh area"
  - concept: "Sustainability measurement contract"
    frame: "A sustainability measurement contract names five fields"
    shown_by: "the model card's emissions table beside a five-field table, model card against facility account"
  - concept: "Operational carbon chain"
    frame: "Carbon is IT energy times PUE times grid intensity"
    shown_by: "chain_step1..4: GPU, IT, facility, CO2 boxes built left to right"
  - concept: "Embodied carbon allocation"
    frame: "Manufacturing emits carbon before the first job runs"
    shown_by: "photo, 164 kg per GPU, then 2,687 t and the 192 t time-share build"
  - concept: "Dominant lifecycle carbon term"
    frame: "At fleet volume, serving overtakes training within months"
    shown_by: "lifecycle equation and the crossover plot; also embodied_step1..2 on the next-to-last lifecycle frame"
