notes_for_author:
  - "The running case applies the chapter's rack profile (1.375) and PUE 1.12 to the Llama 3.1 card's GPU-hours; Meta publishes neither facility energy nor its PUE for this run. Every such value is labeled derived."
  - "The card's 8,930 t implies 414 g/kWh only if its energy is GPU-hours x 700 W; the card says its power is 'adjusted for power usage efficiency' without stating the factor."
  - "The crossover slide uses Google's measured prompt energy with an assumed 1 billion prompts a day; the models differ, as the slide says."
  - "Kit request: the stack with the book's intensities for this lecture (Governance 100, Facility 55) per the course plan's amendment 1; the deck uses stack_governance."
  - "2026-10-19 sweep (D4, D10). D4: the goals slide names, once, the Fleet Law term (all four, priced in joules) and C3 axis (all three) in the volume's one form (the \\fleetterm line). D10: X-not-Y constructions and reveal colons rewritten. No exhibit here is retold from another lecture (D3)."
