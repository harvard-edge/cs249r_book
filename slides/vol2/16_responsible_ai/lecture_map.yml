chapter: 16_responsible_ai
lecture: "16"
title: "Responsible AI"
subtitle: "Measured obligations for models that decide about people"
layer: governance
minutes: 75
notes_minutes: 71.5
notes_minutes_core: 54
target_ideas: 30
thesis: "An accurate, fast model can still fail deployment review, because responsibility is a set of measured obligations with owners, budgets, and remedies on the fleet's paths."

hook:
  minutes: "0-6"
  setup: "England, August 2020: A level exams canceled. Teachers submitted a grade and a rank per student; Ofqual's standardization method combined each school's historical results with prior attainment and assigned grades by rank. Predict frame with Ofqual's entry-level outcome bars, then Ofqual's own Figure 1 (grade flows) and Table 2 (per candidate)."
  question_to_class: "What share of A level entries did the method grade below the teacher's grade? A) about 5% B) about 15% C) about 40% D) about 70%"
  payoff: "C: 39% lower, 59% equal, just over 2% higher (457,420 entries). 68% of 246,110 candidates had at least one A level lowered. Four days after results the policy flipped to the higher of the two grades. The synthesis names the missing control in each segment: a per-student claim with an owner, an explicit criterion, disaggregated evidence by cohort size, budgeted review capacity, and an appeal that names the evidence that can change a grade."
  sources:
    - "Ofqual, Grading gaps in summer 2020 (Noden et al., July 2021), Table 1 and text (59/39/2 percent of 457,420 entries), Table 2 (78,470 of 246,110 candidates with none lowered), Figure 1. Open Government Licence v3.0."
    - "Chapter War Story 16.2 (Ofqual 2020 interim report: 39.1 percent; small cohorts weighted to teacher grades; reversal to the higher grade)."
    - "Derived in calcs.py: 68.1 percent with at least one lowered; 4 days from 13 to 17 August."

recall: "Lecture 15, from memory: what must a carbon claim state before it can be compared? (Functional unit, system boundary, attribution rule, carbon signal, time and place: the sustainability measurement contract.) Today every responsibility claim gets the same structure."

driving_question: "What evidence must a fleet produce before and after it deploys a model that decides about people?"

goals:
  - "Build an assurance case with an owner and an expiry."
  - "Compute fairness criteria on one model and show why they conflict."
  - "Size a fleet fairness monitor and say when a measured gap is evidence."
  - "Price safeguards as capacity on a path and design an appeal path."

running_example: "A loan-screening service. Segment 1 states its assurance claim; segment 2 computes the chapter's loan model (Napkin Math 16.1, 16.2: approval 0.70/0.40, TPR 0.889/0.600, FPR 0.545/0.200, PPV 0.571/0.750) and its threshold policy; segment 3 tests its 0.30 gap (z = 4.26 at 100 per group) and sizes its monitor (chapter listing 2 is a loan monitor); segment 4 prices its explanations, privacy, and deletion; segment 5 meets a real credit decision system, Apple Card (2019), as the contestability case. Real systems elsewhere: Ofqual 2020, COMPAS (recomputed from ProPublica's data), Gender Shades, Waymo, Uber Tempe (NTSB)."

segments:
  - name: Assurance
    divider_question: "What justifies shipping a model, and when does that justification expire?"
    read: "§16.1 to §16.3"
    concept_questions: [1, 2, 3]
    land: "Deployment is justified by a versioned assurance case with an owner who can block launch, and it expires on material change."
    minutes: 9
  - name: Fairness
    divider_question: "Which fairness criterion should a deployment meet, and why can it not meet them all?"
    read: "§16.5.1, §16.5.3"
    concept_questions: [4, 5, 6, 7]
    land: "Choosing a criterion is a governance decision; a threshold can move a rate but cannot repair a label."
    minutes: 11.5
  - name: Evidence
    divider_question: "When is a measured gap evidence, and what does monitoring it cost?"
    read: "§16.5.2, §16.5.4, §16.5.5"
    concept_questions: [8, 9, 10]
    land: "A gap is evidence only with its denominator, interval, and intersectional coverage, and watching it costs communication and owner attention."
    minutes: 11.5
  - name: Capacity
    divider_question: "What does each safeguard cost, and which path pays?"
    read: "§16.4.2, §16.6, §16.7.3, §16.8.2"
    concept_questions: [11, 12, 13]
    land: "Every safeguard is budgeted capacity on a named path, and deletion needs an architecture chosen before training."
    minutes: 13
  - name: Remedy
    divider_question: "Who can correct a decision, and how do deployed models change their own data?"
    read: "§16.7.4, §16.8.5, §16.9, §16.10.1"
    concept_questions: [14, 15]
    land: "Evidence protects people only when an owner can act and an affected person can obtain correction."
    minutes: 14.5

concept_questions:
  - id: 1
    q: "Why can an accurate model fail deployment review?"
    picture: "Ofqual's Figure 1 redrawn at slide size from its Table 1 (per teacher grade: higher, same, one lower, two or more lower) and Table 2 as bars (68% of students had at least one grade lowered); both from the real report (calcs.py)."
    numbers: "39% of 457,420 entries lowered; 68% of 246,110 candidates had at least one grade lowered (Ofqual 2021; 68.1 derived)."
    example: "Ofqual 2020: a method that matched national history and failed individual students."
    read: "§16.10.1 War Story 16.2"
  - id: 2
    q: "What is an assurance case?"
    picture: "New 4-step build after chapter figure 1: evidence, argument, claim; assumptions; owner and decision; material change and invalidation rule."
    numbers: "None; structure only."
    example: "The loan-screening claim; the Mitchell et al. model card as one piece of evidence (real artifact, Fig. 2 of the paper, its false-positive panel cropped to slide size)."
    read: "§16.2"
  - id: 3
    q: "When does approval expire, and what outlasts shutdown?"
    picture: "Lifecycle strip after chapter table 1 with the material-change loop and the retirement appeal owner."
    numbers: "Eight stages (chapter table 1)."
    example: "A retrieval-corpus swap with no code change (concept question)."
    read: "§16.2"
  - id: 4
    q: "What do demographic parity, equalized odds, equal opportunity, and calibration each measure?"
    picture: "Grouped bars: approval, TPR, FPR, PPV for groups A and B; the chapter's Fairlearn MetricFrame listing beside it."
    numbers: "Approval 0.70/0.40; TPR 0.889/0.600; FPR 0.545/0.200; PPV 0.571/0.750; DI 0.57 (Napkin Math 16.1, 16.2; calcs.py)."
    example: "The running loan model."
    read: "§16.5.1"
  - id: 5
    q: "Why can the criteria not all hold?"
    picture: "COMPAS recomputed from ProPublica's released data: base rate, FPR, PPV by race, with the pandas confusion counts."
    numbers: "FPR 42.3/22.0%, PPV 65.0/59.5%, base rate 52.3/39.1% (recomputed; ProPublica reported 45/23)."
    example: "The chapter's admissions example and the Kleinberg-Chouldechova results (principle 26)."
    read: "§16.5.1 (Why the fairness criteria conflict)"
  - id: 6
    q: "What does a threshold fix do and cost?"
    picture: "Two-step band figure after chapter figure 5: one cutoff 0.75, then 0.75 and 0.45; two applicants at 0.60 get different decisions."
    numbers: "TPR 75/25% at one cutoff; 75/75% with group cutoffs; B's FPR 0 to 25% (illustrative, calcs.py); fairness cost 4 points, 85 to 81% (Napkin Math 16.4)."
    example: "Group-specific credit thresholds and the authorized attribute lookup they need."
    read: "§16.5.3"
  - id: 7
    q: "Will more data remove bias?"
    picture: "Bars: share of Black patients auto-identified, 17.7% before, 46.5% after the label fix."
    numbers: "Obermeyer et al. 2019 (chapter footnote 7); 2.6 times (calcs.py)."
    example: "Expenditure as a proxy for need (fallacy, §16.11)."
    read: "§16.5.1, §16.11"
  - id: 8
    q: "What does a single-axis audit miss?"
    picture: "IBM 2x2 accuracy grid; dumbbell of darker-female error, 2017 audit and 2018 re-audit; photo of Joy Buolamwini."
    numbers: "IBM 99.7% lighter male, 65.3% darker female; errors 34.7 to 17.0, 34.5 to 4.1, 20.8 to 1.5; Amazon 31.4, Kairos 22.5 (mlsysim series gender_shades_audit)."
    example: "Gender Shades and the Raji-Buolamwini re-audit."
    read: "§16.5.2 (Intersectional fairness)"
  - id: 9
    q: "When is a gap evidence?"
    picture: "z statistic against applicants per group for the 0.30 gap, with the 1.96 line."
    numbers: "z = 4.26 at 100 per group, 1.35 at 10; crossing near 21 per group; 95% interval 0.17 to 0.43 and -0.12 to 0.72 (calcs.py)."
    example: "A 12-decision subgroup on a dashboard."
    read: "§16.5.2"
  - id: 10
    q: "What does continuous fairness monitoring cost, and when can each metric update?"
    picture: "Three-step two-lane architecture after chapter figure 6; 150-square false-alert grid; the chapter's RealTimeFairnessMonitor listing."
    numbers: "864M decisions/day, 8.64M sampled, 1.73 GB/day, 7.5 false alerts per interval (chapter scenario; calcs.py)."
    example: "The loan service's monitor; parity now, error rates when repayment outcomes arrive; thin groups reported as insufficient."
    read: "§16.5.5"
  - id: 11
    q: "Where does each safeguard spend capacity?"
    picture: "Range bars of extra work by safeguard, training path and serving path (chapter table 5, scenario)."
    numbers: "Fairness-aware 5-15%, DP-SGD 30-300%, federated 200-500%, adversarial 2-11x; KernelSHAP 50-200%, exhaustive SHAP 50-1,000x."
    example: "A municipal clinic that cannot afford DP-SGD (§16.4.3)."
    read: "§16.4.2, §16.4.3"
  - id: 12
    q: "What does a privacy claim cover?"
    picture: "Three-step federated boundary diagram after chapter figure 7, with the gateway-log leak; smartphone photo; DP-SGD accuracy plot and Opacus code."
    numbers: "Abadi et al. 2016: MNIST 98.3% baseline, 97/95/90% at eps 8/2/0.5; CIFAR-10 about 80% baseline, 73/70/67% at eps 8/4/2 (delta 1e-5)."
    example: "A raw prompt copied into a serving log."
    read: "§16.6.2, §16.6.3"
  - id: 13
    q: "How do you delete a person from the weights?"
    picture: "Cost ladder: full retraining, SISA one request, SISA daily batch."
    numbers: "$4.6M and 36 days; $46,000 and 8.64 h; P(shard untouched) 4.3e-5, about $4.6M per daily batch (Napkin Math 16.6; derived in calcs.py)."
    example: "A GDPR Article 17 erasure request against a 175B model."
    read: "§16.6.4"
  - id: 14
    q: "What makes a decision contestable?"
    picture: "Contestability stack (provenance, explanation, appeal, outcome, retrain loop) beside an Apple Card photo."
    numbers: "Apple Card 2019: a 20x credit-limit difference; NY DFS found no fair-lending violation (War Story 16.1, labeled a reconstruction)."
    example: "Apple Card; retraining next quarter is not a remedy for today's denial."
    read: "§16.7.4, §16.10.1"
  - id: 15
    q: "How do deployed models reshape their data and their operators, and how does scale change safety?"
    picture: "Feedback loop with three cuts (after chapter figure 13); automation-bias bars; Waymo exposure plot and photo; the safety-case table with a one-line recall of Lecture 14's Tempe crash."
    numbers: "Accepted misses 0.05 x 0.7 = 0.035, team at most 96.5% (Napkin Math 16.7); Waymo 22 to 271M miles, 12.2x, 0.67 vs 3.77 injury crashes per million miles, 183 injury and 2 fatal crashes (mlsysim series). Tempe (NTSB HAR-19/03, Sec. 1.5.6.1): first detection 5.6 s, imminent collision recognized 1.2 s, alert 0.2 s before impact; the playback image is from the preliminary report, which timed the recognition at 1.3 s. Lecture 14 states the same times."
    example: "Predictive policing; Archetype B recommender; radiology assistant; Uber Tempe 2018."
    read: "§16.9.4, §16.8.4, §16.8.5"

concept_trace:
  - concept: "Assurance case"
    frame: "A registry records what shipped but cannot justify it"
    shown_by: "assure_step1-4 build: evidence, argument, claim, assumptions, owner, decision, invalidation rule; then the lifecycle strip"
  - concept: "Fairness criteria conflict"
    frame: "Unequal base rates in real scores force a criterion choice"
    shown_by: "COMPAS base rate, FPR, PPV bars recomputed from ProPublica data, after the loan model's four-criteria bars (Estimate frame)"
  - concept: "Disparity measurement uncertainty"
    frame: "A 30-point disparity is noise at 20 applicants, real at 200"
    shown_by: "z-statistic curve with 1.96 line and the two intervals; plus the Gender Shades intersectional grid and dumbbell"
  - concept: "Fleet fairness monitoring"
    frame: "Parity can update per request; error rates wait for outcomes"
    shown_by: "arch_step1-3 build; then the monitoring-cost estimate with the 150-metric false-alert grid"
  - concept: "Safeguards as capacity"
    frame: "Every safeguard spends capacity on a specific path"
    shown_by: "range bars of extra work by safeguard, training and serving paths"
  - concept: "Machine unlearning"
    frame: "Estimate: what does forgetting one person cost?"
    shown_by: "unlearn_step1-2 cost ladder and the shard-touch probability"
  - concept: "Contestability and remedy"
    frame: "An explanation becomes a remedy only with an appeal path"
    shown_by: "contest_step1-2 stack beside the Apple Card photo"
  - concept: "Sociotechnical feedback and designed oversight"
    frame: "Deployed models reshape the data they later learn from"
    shown_by: "loop_step1-2 with three intervention cuts; then the automation-bias estimate bars"

worked_examples:
  - name: "Fairness metrics on one loan model (Napkin Math 16.1, 16.2)"
    steps: ["Given: 100 applicants per group; A 70 approved (40 repaid), 5 rejected would repay; B 40 approved (30 repaid), 20 rejected would repay", "Approval 0.70 and 0.40, gap 0.30", "TPR 40/45 = 0.889 and 30/50 = 0.600, gap 0.289", "FPR 30/55 = 0.545 and 10/50 = 0.200; PPV 0.571 and 0.750", "The model fails every criterion; which governs is a governance choice"]
  - name: "Is a 30-point gap evidence? (§16.5.2)"
    steps: ["Given: approval 0.70 and 0.40", "Pooled rate 0.55; z = 4.26 at 100 per group", "z = 1.35 at 10 per group; threshold crossed near 21 per group", "Report the interval and denominator; flag thin groups as insufficient"]
  - name: "Fleet fairness monitoring cost (§16.5.5)"
    steps: ["Given: 10,000 decisions/s, 1% sampled, 200 B, 150 metrics, 5% false alarms", "864M decisions/day, 8.64M records, 1.73 GB/day", "150 x 0.05 = 7.5 false alerts per interval", "The binding cost is owner attention, not storage"]
  - name: "The cost of forgetting (Napkin Math 16.6)"
    steps: ["Given: 175B model, $4.6M and 36 days to retrain; SISA with 100 shards", "One request: $46,000 and 8.64 h", "1,000 requests/day: P(shard untouched) = 4.3e-5, about 100 shards retrain", "About $4.6M per daily batch: the architecture and batching policy decide the cost"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "What share of A level entries did the method grade below the teacher's grade?"
    answer: "C, about 40%: 39% lower, 59% equal, about 2% higher (Ofqual 2021)."
  - at_minute: 6.5
    type: retrieval
    prompt: "What must a carbon claim state before it can be compared?"
    answer: "Functional unit, system boundary, attribution rule, carbon signal, time and place (Lecture 15)."
  - at_minute: 15
    type: concept_question
    prompt: "True or false: a retrieval-corpus swap with no code change keeps approval."
    answer: "False; the corpus is an assumption of the case, so the invalidation rule fires and the smallest defensible revalidation runs."
  - at_minute: 17.5
    type: estimate
    prompt: "Compute each group's approval rate, TPR, and FPR for the loan model."
    answer: "0.70/0.40; 0.889/0.600; 0.545/0.200 (PPV 0.571/0.750)."
  - at_minute: 26.5
    type: concept_question
    prompt: "Will more data remove the bias in a risk score trained to predict health cost?"
    answer: "No; the label is the defect. Changing it raised the Black share of auto-identified patients from 17.7 to 46.5%."
  - at_minute: 37.5
    type: estimate
    prompt: "Records/day, GB/day, and false alerts per interval for the fleet monitor."
    answer: "8.64M records, 1.73 GB/day, 7.5 false alerts per interval."
  - at_minute: 49
    type: estimate
    prompt: "Cost of one erasure under SISA, and of 1,000 erasures a day."
    answer: "$46,000 and 8.64 h; about 100 shards a day, about $4.6M per daily batch."
  - at_minute: 58.5
    type: estimate
    prompt: "Best-case sensitivity of a radiologist with a 95% AI who accepts 70% of its misses."
    answer: "At most 96.5%: 0.05 x 0.7 = 0.035 accepted misses."
  - at_minute: 65.5
    type: retrieval
    prompt: "Name the control each segment would have added to Ofqual 2020."
    answer: "Per-student claim with owner and invalidation rule; explicit criterion; outcomes by cohort size; budgeted review capacity; an appeal naming the evidence that can change a grade."

open_questions:
  - "Who should choose the fairness criterion for a public service: engineers, regulators, or the people it decides about?"
  - "A fleet serves 40 jurisdictions. Should it ship the strictest rules everywhere or route by region?"
  - "When a system acts faster than review, what must be true before anyone may call it trustworthy?"

