fleet_law_terms: "Since the 2026-10-19 sweep (D4) the goals slide names the lecture's term once (T_compute/N and T_sync(N); Compute and Coordination) and each mechanism slide's note ends with its C3 axis; the slides carry no tags. The axes by mechanism: approval gates and appeals are coordination; monitoring is communication plus coordination; DP-SGD, adversarial training, and inline explanation are compute on a named path; asynchronous explanation trades compute for coordination."

