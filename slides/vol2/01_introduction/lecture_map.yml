notes_for_author:
  - "Every derived number is computed in images/calcs.py (inputs sourced in comments); the printed values were copied onto the slides and notes and re-checked on 2026-10-18."
  - "Outside numbers were read from the papers on 2026-10-18: OPT-175B Sec. 2.4 and 2.5 (992 80 GB A100s, 147 TFLOP/s per GPU, at least 35 manual restarts, over 100 hosts, 70+ automatic restarts, 2 months); the metaseq 10_percent_update.md quote (verbatim); Llama 3 Table 4 (430 and 400 TFLOP/s, 43 and 41 percent BF16 MFU, TP 8, PP 16, DP 64 and 128, 16M tokens) and Sec. 3.3.4 (466 interruptions, 419 unexpected, 54 days, more than 90 percent effective training time); GPT-3 Table 2.1 (175.0B, 96 layers, d_model 12288, 96 heads, 3.2M batch, 300 billion tokens); PyTorch tutorial dist_tuto code (BSD 3-Clause)."
  - "The Chinchilla fit constants (E, A, B, alpha, beta) are not in this worktree's MLSysIM registry; make_figs.py reads them from the book-source checkout's registry beside it (MLSysBook-slides-vsrc/mlsysim). When this worktree's MLSysIM is updated, that fallback is no longer needed."
  - "The OPT restart interval (14 h or less) takes 'over the course of 2 months' as 60 days and both restart counts as lower bounds."
