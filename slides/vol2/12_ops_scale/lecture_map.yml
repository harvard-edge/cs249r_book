notes_for_author:
  - "The chapter's 620,800 (1 percent baseline, 0.05 point) rounds 7.84 x 0.0198 to 0.1552 before dividing; unrounded arithmetic gives 620,928. The deck shows 620,928 and the note says so; consider fixing the chapter's LEGO cell."
  - "Example 12.2 gives no dollar value; the synthesis uses Napkin Math 12.6's $1.08M/day rate and labels it a different scenario."
  - "The 50 percent rental line on the build-against-buy plot is derived from the chapter's rates; the chapter states only the 80 percent line."
  - "Second lecture: the chapter is marked for one. This deck leaves platform-as-product, org patterns, multi-region coordination, and FinOps attribution to reading; a Part 2 would own them."
  - "2026-10-19 sweep (D4, D10). D4: the goals slide names, once, the Fleet Law term (T_sync(N)) and C3 axis (Coordination (C3)) in the volume's one form (the \\fleetterm line). D10: X-not-Y constructions and reveal colons rewritten. No exhibit here is retold from another lecture (D3)."
