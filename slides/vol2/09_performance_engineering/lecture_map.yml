  read_and_practice: ["Fleet Efficiency §9.2 to §9.9", "§9.8 self-check", "redo Napkin Math 9.5 with P = 0.41"]
  further_reading:
    - {cite: "Wongpanich et al., Machine Learning Fleet Efficiency: ML Productivity Goodput, 2025", why: "The three-factor decomposition measured on Google's TPU fleet."}
    - {cite: "Dubey et al., The Llama 3 Herd of Models, 2024", why: "The hook's numbers and the 8,192 vs 16,384 GPU trade (Table 4)."}
    - {cite: "Jiang et al., MegaScale, NSDI 2024", why: "Per-rank timers and straggler hunting at 10,000 GPUs."}
    - {cite: "Chowdhery et al., PaLM, 2022", why: "Definition of MFU and published MFU values (Table 3)."}
    - {cite: "Ren et al., Google-Wide Profiling, IEEE Micro 2010", why: "Statistical fleet profiling."}
  bridge: "Lecture 10, Serving at Scale: how many requests can a fleet serve within its latency targets?"
