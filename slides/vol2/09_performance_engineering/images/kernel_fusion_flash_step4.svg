<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 348" width="940" height="348" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="940" height="348" fill="white"/>
<rect x="14" y="12" width="442" height="142" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
<text x="26" y="38" font-size="20" font-weight="bold" fill="#b91c1c">1. Unfused: 4 HBM transfers</text>
<rect x="24" y="54" width="64" height="52" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="2"/>
<text x="56.0" y="87" font-size="19" font-weight="bold" fill="#14294E" text-anchor="middle">Lin</text>
<line x1="88" y1="80" x2="100" y2="80" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrG)"/>
<rect x="104" y="54" width="82" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
<text x="145.0" y="87" font-size="19" font-weight="bold" fill="#b91c1c" text-anchor="middle">HBM I1</text>
<line x1="186" y1="80" x2="198" y2="80" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrG)"/>
<rect x="202" y="54" width="62" height="52" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="2"/>
<text x="233.0" y="87" font-size="19" font-weight="bold" fill="#14294E" text-anchor="middle">Act</text>
<line x1="264" y1="80" x2="276" y2="80" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrG)"/>
<rect x="280" y="54" width="82" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
<text x="321.0" y="87" font-size="19" font-weight="bold" fill="#b91c1c" text-anchor="middle">HBM I2</text>
<line x1="362" y1="80" x2="374" y2="80" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrG)"/>
<rect x="378" y="54" width="66" height="52" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="2"/>
<text x="411.0" y="87" font-size="19" font-weight="bold" fill="#14294E" text-anchor="middle">Norm</text>
<text x="235" y="136" font-size="19" fill="#475569" text-anchor="middle">Intermediates I1, I2 cross HBM twice each</text>
<rect x="484" y="12" width="442" height="142" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
<text x="496" y="38" font-size="20" font-weight="bold" fill="#15803d">2. Fused kernel: 0 HBM intermediates</text>
<rect x="502" y="50" width="406" height="60" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
<rect x="518" y="58" width="96" height="44" rx="5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
<text x="566.0" y="87" font-size="19" font-weight="bold" fill="#14294E" text-anchor="middle">Linear</text>
<line x1="614" y1="80" x2="650" y2="80" stroke="#15803d" stroke-width="3" marker-end="url(#arrOk)"/>
<rect x="654" y="58" width="86" height="44" rx="5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
<text x="697.0" y="87" font-size="19" font-weight="bold" fill="#14294E" text-anchor="middle">Act</text>
<line x1="740" y1="80" x2="776" y2="80" stroke="#15803d" stroke-width="3" marker-end="url(#arrOk)"/>
<rect x="780" y="58" width="112" height="44" rx="5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
<text x="836.0" y="87" font-size="19" font-weight="bold" fill="#14294E" text-anchor="middle">Norm</text>
<text x="705" y="136" font-size="19" font-weight="bold" fill="#15803d" text-anchor="middle">I1, I2 stay in registers / SRAM (1 load, 1 store)</text>
<rect x="14" y="170" width="598" height="166" rx="8" fill="#f8fafc" stroke="#1F407A" stroke-width="2"/>
<text x="26" y="196" font-size="20" font-weight="bold" fill="#1F407A">3. FlashAttention: stream K/V blocks into SRAM</text>
<rect x="26" y="210" width="234" height="78" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
<text x="143" y="238" font-size="19" font-weight="bold" fill="#14294E" text-anchor="middle">Block 1: s=1, v=2</text>
<text x="143" y="268" font-size="19" fill="#334155" text-anchor="middle">m=1, l=1.00, a=2.00</text>
<line x1="260" y1="249" x2="294" y2="249" stroke="#d97706" stroke-width="3.2" marker-end="url(#arrA)"/>
<rect x="300" y="210" width="298" height="78" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="449" y="238" font-size="19" font-weight="bold" fill="#b45309" text-anchor="middle">Block 2: s=3, v=6 (α=0.135)</text>
<text x="449" y="268" font-size="19" fill="#78350f" text-anchor="middle">m=3, l=1.135, a=6.271</text>
<text x="313" y="318" font-size="19" fill="#475569" text-anchor="middle">Online softmax rescales prior (l, a) by exp(1 - 3) = 0.135</text>
<rect x="628" y="170" width="298" height="166" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
<text x="642" y="196" font-size="20" font-weight="bold" fill="#15803d">4. Final exact output</text>
<rect x="642" y="210" width="270" height="78" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="777" y="238" font-size="20" font-weight="bold" fill="#15803d" text-anchor="middle">O = a / l = 5.523</text>
<text x="777" y="268" font-size="19" fill="#166534" text-anchor="middle">Single write back to HBM</text>
<text x="777" y="318" font-size="19" font-weight="bold" fill="#b91c1c" text-anchor="middle">No N x N matrix in HBM</text>
</svg>
