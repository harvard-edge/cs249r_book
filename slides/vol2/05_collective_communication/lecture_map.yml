notes_for_author:
  - "The AllToAll segment's data are the chapter's computed bounds from the 50 GB/s port specification, not a published measurement; a measured MoE AllToAll trace (for example from Tutel or DeepSpeed-MoE) would strengthen it."
  - "Horovod bar heights are read from the paper's Figure 6; the paper states only 'about half' and '88 percent' in text."
  - "The HGX photo shows the B200 generation; the numbers use DGX H100. The caption says so."
  - "The Horovod Timeline is the paper's Figure 5 (arXiv non-exclusive license), redrawn at slide size: phase edges read from the screenshot against its 100 ms ticks (about +/-2 ms), the 184.063 ms AllReduce span from its detail pane (calcs.py). Rows are tensors, not ranks."
  - "2026-10-19 sweep (D4, D10). D4: the goals slide names, once, the Fleet Law term (T_comm(N) and T_overlap) and C3 axis (Communication (C2)) in the volume's one form (the \\fleetterm line). D10: X-not-Y constructions and reveal colons rewritten. No exhibit here is retold from another lecture (D3)."
