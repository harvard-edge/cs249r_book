<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="350" fill="#ffffff"/>
<defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1F407A"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#d97706"/></marker><marker id="a-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker><marker id="a-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker><marker id="a-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect x="10" y="10" width="208" height="250" rx="8" fill="#EAF1F8" stroke="#1F407A" stroke-width="2.5" opacity="1.0"/>
<text x="114" y="46" font-size="24" font-weight="700" fill="#1F407A" text-anchor="middle" opacity="1.0">Ingress</text>
<text x="114" y="88" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">source identity,</text>
<text x="114" y="116" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">least privilege</text>
<text x="114" y="170" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle" opacity="1.0">blind spot</text>
<text x="114" y="200" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0" font-style="italic">trusted source</text>
<text x="114" y="228" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0" font-style="italic">turns bad</text>
<line x1="218" y1="135" x2="231" y2="135" stroke="#64748b" stroke-width="3" marker-end="url(#a-gray)" opacity="1.0"/>
<rect x="232" y="10" width="208" height="250" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5" opacity="1.0"/>
<text x="336" y="46" font-size="24" font-weight="700" fill="#7c3aed" text-anchor="middle" opacity="1.0">Sanitize</text>
<text x="336" y="88" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">outliers, clusters,</text>
<text x="336" y="116" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">spectral filters</text>
<text x="336" y="170" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle" opacity="1.0">blind spot</text>
<text x="336" y="200" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0" font-style="italic">clean-label poison</text>
<text x="336" y="228" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0" font-style="italic">is not an outlier</text>
<line x1="440" y1="135" x2="453" y2="135" stroke="#64748b" stroke-width="3" marker-end="url(#a-gray)" opacity="1.0"/>
<rect x="454" y="10" width="208" height="250" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" opacity="0.0"/>
<text x="558" y="46" font-size="24" font-weight="700" fill="#d97706" text-anchor="middle" opacity="0.0">Robust training</text>
<text x="558" y="88" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0">Huber loss,</text>
<text x="558" y="116" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0">robust aggregation</text>
<text x="558" y="170" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle" opacity="0.0">blind spot</text>
<text x="558" y="200" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0" font-style="italic">bounds a residual,</text>
<text x="558" y="228" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0" font-style="italic">not an update</text>
<line x1="662" y1="135" x2="675" y2="135" stroke="#64748b" stroke-width="3" marker-end="url(#a-gray)" opacity="0.0"/>
<rect x="676" y="10" width="208" height="250" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" opacity="0.0"/>
<text x="780" y="46" font-size="24" font-weight="700" fill="#16a34a" text-anchor="middle" opacity="0.0">Release checks</text>
<text x="780" y="88" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0">triggers, canaries,</text>
<text x="780" y="116" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0">target slices</text>
<text x="780" y="170" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle" opacity="0.0">blind spot</text>
<text x="780" y="200" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0" font-style="italic">a trigger nobody</text>
<text x="780" y="228" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0" font-style="italic">tested</text>
<path d="M 790 265 L 790 300 L 114 300 L 114 268" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#a-red)" opacity="0.0"/>
<text x="450" y="338" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle" opacity="0.0">Lineage traces a bad behavior to the batches that taught it</text>
</svg>
