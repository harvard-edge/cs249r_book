<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="395" fill="#ffffff"/>
<defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1F407A"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#d97706"/></marker><marker id="a-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker><marker id="a-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker><marker id="a-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect x="120" y="10" width="375" height="155" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" opacity="1.0"/>
<text x="307.5" y="60" font-size="27" font-weight="700" fill="#dc2626" text-anchor="middle" opacity="1.0">Probe deeper</text>
<text x="307.5" y="102" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">error up, inputs flat:</text>
<text x="307.5" y="132" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">concept drift or a fault</text>
<rect x="505" y="10" width="375" height="155" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" opacity="1.0"/>
<text x="692.5" y="60" font-size="27" font-weight="700" fill="#d97706" text-anchor="middle" opacity="1.0">Isolate slices</text>
<text x="692.5" y="102" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">error and drift together:</text>
<text x="692.5" y="132" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">test the update</text>
<rect x="120" y="175" width="375" height="155" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" opacity="1.0"/>
<text x="307.5" y="225" font-size="27" font-weight="700" fill="#64748b" text-anchor="middle" opacity="1.0">Keep serving</text>
<text x="307.5" y="267" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">nothing moved</text>
<text x="307.5" y="297" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0"></text>
<rect x="505" y="175" width="375" height="155" rx="8" fill="#EAF1F8" stroke="#1F407A" stroke-width="2.5" opacity="1.0"/>
<text x="692.5" y="225" font-size="27" font-weight="700" fill="#1F407A" text-anchor="middle" opacity="1.0">Monitor</text>
<text x="692.5" y="267" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">inputs moved, error flat:</text>
<text x="692.5" y="297" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">find the source</text>
<line x1="120" y1="352" x2="880" y2="352" stroke="#64748b" stroke-width="3" marker-end="url(#a-gray)" opacity="1.0"/>
<text x="500" y="385" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle" opacity="1.0">Input drift statistic (PSI, KS)</text>
<line x1="95" y1="330" x2="95" y2="10" stroke="#64748b" stroke-width="3" marker-end="url(#a-gray)" opacity="1.0"/>
<text x="70" y="170" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle" transform="rotate(-90 70 170)">Measured error</text>
</svg>
