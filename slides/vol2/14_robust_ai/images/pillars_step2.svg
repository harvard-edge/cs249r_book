<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" width="900" height="385" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="385" fill="#ffffff"/>
<defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1F407A"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#d97706"/></marker><marker id="a-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker><marker id="a-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker><marker id="a-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<text x="450" y="30" font-size="24" font-weight="700" fill="#16a34a" text-anchor="middle" opacity="1.0">Latency, uptime, error rate: all green</text>
<rect x="20" y="48" width="274" height="228" rx="8" fill="#EAF1F8" stroke="#1F407A" stroke-width="2.5" opacity="1.0"/>
<text x="157" y="84" font-size="25" font-weight="700" fill="#1F407A" text-anchor="middle" opacity="1.0">Environmental shift</text>
<text x="157" y="118" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">the world moves</text>
<text x="157" y="164" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">evidence: slices, drift tests</text>
<text x="157" y="204" font-size="20" font-weight="700" fill="#64748b" text-anchor="middle" opacity="1.0">response:</text>
<text x="157" y="234" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">recalibrate, retrain</text>
<rect x="313" y="48" width="274" height="228" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" opacity="1.0"/>
<text x="450" y="84" font-size="25" font-weight="700" fill="#d97706" text-anchor="middle" opacity="1.0">Input-level attack</text>
<text x="450" y="118" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">an adversary picks</text>
<text x="450" y="164" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">evidence: attack suites</text>
<text x="450" y="204" font-size="20" font-weight="700" fill="#64748b" text-anchor="middle" opacity="1.0">response:</text>
<text x="450" y="234" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">harden, filter</text>
<rect x="606" y="48" width="274" height="228" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5" opacity="0.0"/>
<text x="743" y="84" font-size="25" font-weight="700" fill="#7c3aed" text-anchor="middle" opacity="0.0">System-level fault</text>
<text x="743" y="118" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0">hardware or code errs</text>
<text x="743" y="164" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0">evidence: replay, canaries</text>
<text x="743" y="204" font-size="20" font-weight="700" fill="#64748b" text-anchor="middle" opacity="0.0">response:</text>
<text x="743" y="234" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0">isolate, roll back</text>
<rect x="20" y="292" width="860" height="84" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" opacity="0.0" stroke-dasharray="8,5"/>
<text x="450" y="325" font-size="23" font-weight="700" fill="#dc2626" text-anchor="middle" opacity="0.0">Software and pipeline defects cut across all three</text>
<text x="450" y="358" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.0">a preprocessing bug looks like shift; an overflow looks like an attack</text>
</svg>
