<text x="495" y="87" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="1.0">one backward pass</text>
<text x="770" y="87" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle" opacity="1.0">adaptive white-box</text>
