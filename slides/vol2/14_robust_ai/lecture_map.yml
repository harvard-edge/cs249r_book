chapter: 14_robust_ai
lecture: "14"
title: "Robust AI"
layer: assurance
minutes: 75
notes_minutes: 71.5
core_minutes: 59
target_ideas: 30
thesis: "Drift, attacks, poisoning, and silent faults can keep every health signal green, so robustness is claimed one failure class at a time and diagnosed from system evidence before a defense is bought."

hook:
  minutes: "0-4"
  setup: "Photo of the stickered stop signs (Eykholt et al., CVPR 2018) beside three bars revealed in steps: LISA-CNN is 91 percent correct on its clean test set; with stickers it reads Speed Limit 45 in 100 percent of lab images; the third bar (drive-by frames) is hidden."
  question_to_class: "In a drive-by test from a moving car, what share of frames read Speed Limit 45? A under 10 percent, B about 30, C about 60, D about 85."
  payoff: "D, 84.8 percent (Table 3, camouflage abstract art). Then: what is each number evidence for? 91 percent is same-distribution accuracy; 100 and 84.8 percent fill the adversarial row for one attack in two capture conditions. The synthesis returns with the other three rows (shift, poisoning, fault) for the same classifier."
  sources:
    - "Eykholt et al. 2018 (arXiv 1707.08945): LISA-CNN 91 percent on the LISA test set (Sec. 1); 100 percent of lab images (abstract); 84.8 percent of drive-by frames, camouflage abstract art (Table 3)."
    - "Robust AI, Example 14.1 (100 and 84.8 percent)."

recall: "Lecture 13, close your notes: name the parts of an ML threat model (asset, trust boundary, capability, goal, control) and what a poisoning attacker optimizes (training data chosen so the trained model misbehaves; a bilevel attack). Today asks whether an authorized, on-time answer is still right."

driving_question: "How do we know a deployed model is still right, and which defense does each failure need?"

goals:
  - "Classify a silent failure by its failure class, and name the evidence each class needs."
  - "Tell covariate shift, label shift, and concept drift apart, and decide when drift justifies a model update."
  - "Price a per-request answer, route, or abstain policy, for classifiers and for language models."
  - "Match an attack or poisoning defense to the attacker's access, and price it in the Fleet Law."
  - "Diagnose a fault that looks like drift or an attack, using system evidence."

running_example: "A road-sign classifier on a vehicle fleet: LISA-CNN under sticker attacks (Eykholt et al. 2018), snow as covariate shift, a backdoored U.S. traffic-sign detector (BadNets, Gu et al. 2017, Table 4), a PGD-7 hardened classifier for an autonomous vehicle (Napkin Math 14.2), and a bit flip in a stored weight (figure 14). Drift statistics use the chapter's fraud service (tables 3 and 4) and the fault diagnosis its credit-risk service (Example 14.2), because the chapter's numbers live there; the slides say so."

segments:
  - name: Silent Failure
    divider_question: "How can a service be healthy and wrong at the same time?"
    read: "§14.1 to §14.3"
    concept_questions: [1, 2, 3]
    land: "Robustness is a claim per failure class, each with its own evidence; replication does not remove a weakness every copy shares."
    minutes: 9
  - name: Shift
    divider_question: "What moved, and when does it justify a new model?"
    read: "§14.4.1 to §14.4.3"
    concept_questions: [4, 5, 6, 7]
    land: "A drift alert starts an investigation; labels and a root cause decide the update."
    minutes: 14
  - name: Competence
    divider_question: "Should the model answer this particular request?"
    read: "§14.4.4 and §14.8"
    concept_questions: [8, 9, 10]
    land: "A per-request answer policy trades coverage for error, and someone must absorb what is not answered."
    minutes: 10.5
  - name: Attacks
    divider_question: "What does the attacker control, and what does a defense cost?"
    read: "§14.5 to §14.7"
    concept_questions: [11, 12, 13, 14]
    land: "Attacker access sets the test; adversarial defenses cost training passes or serving samples; poisoning defense runs in layers along the data path."
    minutes: 18
  - name: Faults
    divider_question: "Is it the world, an attacker, or our own machinery?"
    read: "§14.9"
    concept_questions: [15]
    land: "Read release timing, replay, and telemetry before buying the defense the symptom suggests."
    minutes: 8

concept_questions:
  - id: 1
    q: "Can a system detect a hazard and still fail silently?"
    picture: "Photo of an Uber self-driving Volvo XC90 (Commons, CC BY-SA 2.0; not the crash vehicle) beside a two-step timeline."
    numbers: "Detected 5.6 s before impact; collision recognized 1.2 s before; action held 1 s without alert; alert 0.2 s before impact (the NTSB data table; calcs.py checks 1.2 - 1.0); 4.4 s from detection to recognition (derived). Lecture 16 states the same times."
    example: "Tempe, Arizona, March 2018 (NTSB HAR-19/03, Robust AI §14.2.2)."
    read: "§14.2.2"
  - id: 2
    q: "Which failure classes keep every health signal green?"
    picture: "Three pillar boxes built one per step, then the cross-cutting software band (after figure 2)."
    numbers: "None; the evaluation matrix (table 1) lists evidence and decision per class."
    example: "Google Photos 2015 slice failure (War Story 14.1) on the optional matrix slide."
    read: "§14.3.2, §14.3.3"
  - id: 3
    q: "How often does a fleet corrupt silently?"
    picture: "1 - (1 - p)^N on a log axis with two points; a server-rack photo."
    numbers: "p = 1e-4 per device-hour (assumed, chapter self-check): 0.095 at 1,000 devices, 0.63 at 10,000 (derived, calcs.py)."
    example: "One corrupted gradient reaches every replica through AllReduce (Lecture 6 recall)."
    read: "§14.3.1"
  - id: 4
    q: "What do covariate shift, label shift, and concept drift each change?"
    picture: "Snow-covered stop sign photo (Commons, CC BY-SA 4.0), then three panels P(x), P(y), P(y|x) built in steps (redrawn from figure 3)."
    numbers: "Illustrative points."
    example: "Snow on signs; respiratory illness prevalence during COVID-19; a policy change in loan repayment."
    read: "§14.4.1"
  - id: 5
    q: "Does accuracy hold on a test set built by the same recipe?"
    picture: "ImageNet against ImageNet-V2 scatter with fit (MLSysIM ImageNetTestbedShift)."
    numbers: "212 models with at least 55 percent on ImageNet all lose 7 to 14 points, median 12 (Taori et al. 2020; Recht et al. 2019; figure 4)."
    example: "AlexNet, ResNet-50, EfficientNet-L2."
    read: "§14.4.1"
  - id: 6
    q: "Is a measured shift real, and which monitor can see concept drift?"
    picture: "Predict slide; sampling distribution of a 1,000-request mean with the observed value; two lines of real Python."
    numbers: "Napkin Math 14.1: sigma 0.3, n 1,000, 0.50 to 0.55; SE 0.0095, 5.3 standard errors (derived, calcs.py)."
    example: "Fraud service: PSI 0.065 with Other at 72 percent (derived), KL 0.052, KS 0.089 against 0.023 (tables 3 and 4)."
    read: "§14.4.2"
  - id: 7
    q: "When does a drift alert justify a model update?"
    picture: "Two-by-two grid of input drift against measured error (Level 2 cases)."
    numbers: "Table 5 rules: labels confirm, root cause found, release gate passed."
    example: "The fraud service sits in the monitor cell until delayed labels arrive."
    read: "§14.4.2, §14.4.3"
  - id: 8
    q: "Do model scores mean what they say?"
    picture: "Calibration error bars, as trained against temperature scaled; one line of real PyTorch."
    numbers: "Guo et al. 2017, Table 1: CIFAR-100 LeNet 5 4.85 to 2.02; ResNet 110 16.53 to 1.26; ImageNet ResNet 152 5.48 to 1.86."
    example: "Temperature scaling changes confidence, not predictions."
    read: "§14.4.4"
  - id: 9
    q: "What does answering fewer requests buy, and who pays?"
    picture: "Illustrative risk-coverage curve with a 90 percent operating point; answer, route, abstain."
    numbers: "10,000 requests/s at 90 percent coverage send 1,000/s to fallback (illustrative, calcs.py); conformal rank 901 for n 1,000, alpha 0.1 (derived)."
    example: "Skin-lesion prediction sets; clinician review queue."
    read: "§14.4.4"
  - id: 10
    q: "How is a language model's reliability measured?"
    picture: "Attack success bars on GPT-3.5 and GPT-4 (Zou et al. 2023, Table 2); a vote on a 3 percent hallucination rate with real vLLM sampling code."
    numbers: "GPT-3.5 1.8, 5.7, 47.4, 86.6 percent; GPT-4 8.0, 13.1, 29.1, 46.9 percent over 388 behaviors; k samples cost about k decodes."
    example: "Retrieval-augmented legal assistant (chapter self-check)."
    read: "§14.8"
  - id: 11
    q: "Why does a tiny aligned perturbation flip a prediction?"
    picture: "Goodfellow et al. panda to gibbon (figure 7) with the FGSM equation."
    numbers: "epsilon 0.007; 57.7 percent panda to 99.3 percent gibbon."
    example: "GoogLeNet."
    read: "§14.5.1"
  - id: 12
    q: "What does the attacker's access demand of an evaluation?"
    picture: "Four rows built in steps: white-box, transfer, query, physical."
    numbers: "Stickers: 100 percent lab, 84.8 percent drive-by."
    example: "GCG suffixes transfer (concept 10); stop-sign stickers."
    read: "§14.5.1, §14.5.2"
  - id: 13
    q: "What does adversarial robustness cost, and what does it buy?"
    picture: "Pass bars (1, 3, 8); four-cell penalty table (optional); RobustBench scatter built in three steps; certified radius bars (optional); true-or-false vote."
    numbers: "PGD-7 = 8 passes (Napkin Math 14.2, calcs.py); RobustBench best 44 percent (2018) to 75 percent (2024) at 94 percent clean, 4 defenses under 5 percent (MLSysIM); R = 1.5 against box corner 1.74 (derived)."
    example: "Chan2020Jacobian: clean 93.79, AutoAttack 0.26."
    read: "§14.6"
  - id: 14
    q: "How is a poisoned model caught before release?"
    picture: "BadNets bars; four defense layers with blind spots and a lineage loop."
    numbers: "BadNets Table 4: 90.0 percent honest clean, 89.3 percent backdoored clean, 90.3 percent triggered stop signs read as speed limit."
    example: "Archetype B fake-profile injection (Lighthouse 14.1)."
    read: "§14.7"
  - id: 15
    q: "Is the failure the world, an attacker, or our machinery?"
    picture: "Llama 3 interruption bars with an H100 photo; bit-flip build; replay harness."
    numbers: "Dubey et al. 2024, Table 5: 148, 72, 54, 35, and 6 silent data corruptions of 419 in 54 days; 0.042 to 1.4e37 (x 2^128, calcs.py)."
    example: "Credit-risk drift alert that was a changed library default (Example 14.2)."
    read: "§14.9"

