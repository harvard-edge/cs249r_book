left_to_reading:
  - concept: "KL and Jensen-Shannon divergence formulas, chi-square test, Bonferroni details"
    why: "Mechanics better read than heard; the fraud slide (optional) shows their values."
  - concept: "C&W, DeepFool, EAD, JSMA attack mechanics"
    why: "Access level, not attack name, sets the evaluation; table 6 lists them."
  - concept: "Influence functions, autoencoder gates, self-supervised representations"
    why: "Detail within the layered defense; §14.7.1 to §14.7.4."
  - concept: "Online learning, EWC, adaptive ensembles"
    why: "One line in notes; Lecture 11 met forgetting on devices."

closing:
  return_to_hook: "The 84.8 percent fills one row for one attack. The same classifier needs weather slices for snow, trigger tests for a backdoor (BadNets 90.3 percent at 89.3 percent clean), and canaries and range checks for a bit flip."
  read_and_practice: ["§14.3, §14.4, §14.6, §14.9", "Napkin Math 14.1 and 14.2 by hand", "Checkpoints 14.1 to 14.3"]
  further_reading:
    - cite: "Eykholt et al., Robust Physical-World Attacks on Deep Learning Visual Classification, CVPR 2018"
      url: "https://arxiv.org/abs/1707.08945"
      why: "Physical attacks evaluated through the camera."
    - cite: "Recht et al., Do ImageNet Classifiers Generalize to ImageNet?, ICML 2019"
      url: "https://arxiv.org/abs/1902.10811"
      why: "A shift by recollection that costs every model."
    - cite: "Croce et al., RobustBench, 2021"
      url: "https://arxiv.org/abs/2010.09670"
      why: "Standardized adaptive evaluation."
    - cite: "Gu et al., BadNets, 2017"
      url: "https://arxiv.org/abs/1708.06733"
      why: "Backdoors that pass validation."
    - cite: "Guo et al., On Calibration of Modern Neural Networks, ICML 2017"
      url: "https://arxiv.org/abs/1706.04599"
      why: "Calibration error and temperature scaling."
  bridge: "Next lecture (Lecture 15, Sustainable AI): Can the grid power the fleet we want, and at what cost in carbon and water?"

