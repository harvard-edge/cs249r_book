    frame: "Three failure classes keep every health signal green"
    shows: "pillars build, four steps, with evidence and response per class"
  - concept: "Shift taxonomy"
    frame: "Three shifts change three different probabilities"
    shows: "three panels P(x), P(y), P(y|x) built in steps"
  - concept: "Drift alert to model update"
    frame: "A model update needs labels, a root cause, and a release gate"
    shows: "drift-against-error grid with the action in each cell"
  - concept: "Per-request competence contract"
    frame: "Raising the threshold trades coverage for error, and fallback pays"
    shows: "risk-coverage curve, answer/route/abstain, fallback load, conformal condition"
  - concept: "Adversarial robustness for a named threat model"
    frame: "The attacker's access sets the evaluation a defense must pass; Estimate: what does PGD-7 training cost?; The best CIFAR-10 defense still fails on 25% of attacked inputs"
