    shows: "transfer row; GCG transfer data on the suffix slide"

worked_examples:
  - name: "Napkin Math 14.1: Detecting a real distribution shift"
    steps: ["sigma 0.3, n 1,000, mean 0.50 to 0.55", "SE = 0.3 / sqrt(1,000) = 0.0095", "0.05 / 0.0095 = 5.3 standard errors", "p < 0.001", "a drift alert, not yet a regression"]
  - name: "Napkin Math 14.2: The cost of defense"
    steps: ["7 attack steps plus 1 update per batch", "equal-cost passes, no reuse", "8 passes; FGSM listing about 3", "lands on the compute term of the Fleet Law", "a budget justified by failure consequence"]
  - name: "Example 14.2: A drift alert that was a pipeline fault"
    steps: ["alerts on three income features after a dependency update", "timing at the release", "replay: raw inputs equal, tensors differ by a constant factor", "telemetry: deploys correlate, hardware does not", "software fault; retraining would learn the bug"]
  - name: "Fleet silent corruption (chapter self-check)"
    steps: ["p = 1e-4 per device-hour (assumed)", "1 - (1 - p)^N", "0.095 at 1,000; 0.63 at 10,000", "coordination cost of agreeing what to trust"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "Drive-by stickers: what share of frames read Speed Limit 45?"
    answer: "84.8 percent (Eykholt et al., Table 3)."
  - at_minute: 4
    type: retrieval
    prompt: "Parts of an ML threat model; what a poisoning attacker optimizes."
    answer: "Asset, trust boundary, capability, goal, control; training data chosen so the trained model misbehaves."
  - at_minute: 11.5
    type: estimate
    prompt: "Silent errors at p = 1e-4 per device-hour on 10,000 accelerators."
    answer: "0.63 per hour (derived)."
  - at_minute: 21.5
    type: predict
    prompt: "Which monitor fires under pure concept drift?"
    answer: "Error on recent predictions once labels arrive; input PSI and KS stay silent."
  - at_minute: 23
    type: estimate
    prompt: "Is a 0.05 shift in a feature mean real?"
    answer: "5.3 standard errors, p < 0.001; investigate, do not retrain yet."
  - at_minute: 37.5
    type: concept_question
    prompt: "Can a legal team reuse a 3 percent hallucination rate?"
    answer: "Only after re-measuring against a named evidence source on legal prompts with the same retrieval and decoding settings."
  - at_minute: 43.5
    type: estimate
    prompt: "What does PGD-7 adversarial training cost per batch?"
    answer: "8 passes under the equal-cost work model."
  - at_minute: 52
    type: concept_question
    prompt: "True or false: three adversarial fallacies."
    answer: "False, false, true (§14.10)."
  - at_minute: 62.5
    type: diagnose
    prompt: "Credit-risk drift alerts after a dependency update."
    answer: "Software fault: timing at release, tensors differ on replay, deploy telemetry correlates."
  - at_minute: 65.5
    type: retrieval
    prompt: "One failure per class for the sign classifier, and its evidence."
    answer: "Snow (weather slices), stickers (drive-by tests), backdoor (trigger tests), bit flip (canaries, range checks)."

open_questions:
  - "When a model causes its own drift (fraud, recommendation), how should monitoring change?"
  - "Self-supervised pretraining on uncurated web data may resist shortcuts and widens the poisoning surface. Is the trade worth it?"
  - "After six years the best CIFAR-10 defense still fails on a quarter of attacked inputs. Spend on model, sensor, or system?"

