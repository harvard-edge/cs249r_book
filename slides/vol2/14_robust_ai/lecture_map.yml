  - "Google Photos label failure, 2015 (Kasperkevic, The Guardian)."
  - "Microsoft Tay, 2016 (Lee, Microsoft blog), in the chapter's poisoning section."
  - "Llama 3 405B interruptions (Dubey et al. 2024, Table 5)."
  - "BadNets Post-it stop sign at 95 percent confidence (Gu et al. 2017, Sec. 5.2.3)."
