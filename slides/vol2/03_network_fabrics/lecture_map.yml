notes_for_author:
  - "The running case's real hardware photo is an HGX B200 board (no CC-licensed DGX H100 photo found on Commons); every caption says B200."
  - "The NCCL measurements are intra-node NVLink; the slides and notes say so, because no open NDR collective sweep is in MLSysIM."
  - "Derived values are computed in images/calcs.py; the deck shows 28.0 ms where the chapter prints 28.01 ms (28.005 ms exact)."
  - "2026-10-19 sweep (D4, D10). D4: the goals slide names, once, the Fleet Law term (T_comm(N)) and C3 axis (Communication (C2)) in the volume's one form (the \\fleetterm line). D10: X-not-Y constructions and reveal colons rewritten. No exhibit here is retold from another lecture (D3)."
