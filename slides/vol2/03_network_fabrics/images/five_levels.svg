<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr-comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F407A"/></marker><marker id="arr-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arr-coord" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect width="1000" height="380" fill="white"/><rect x="10" y="8" width="980" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" opacity="1.0"/><text x="46" y="39" font-size="28.6" fill="#b45309" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">L5</text><text x="88" y="39" font-size="26.0" fill="#0f172a" text-anchor="start" font-weight="bold" opacity="1.0" dominant-baseline="middle">Cluster design</text><text x="390" y="39" font-size="23.4" fill="#0f172a" text-anchor="start" font-weight="normal" opacity="1.0" dominant-baseline="middle">4 units of 256 GPUs = the 1,024-GPU job</text><rect x="10" y="82" width="980" height="62" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" opacity="1.0"/><text x="46" y="113" font-size="28.6" fill="#b91c1c" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">L4</text><text x="88" y="113" font-size="26.0" fill="#0f172a" text-anchor="start" font-weight="bold" opacity="1.0" dominant-baseline="middle">Fabric behavior</text><text x="390" y="113" font-size="23.4" fill="#0f172a" text-anchor="start" font-weight="normal" opacity="1.0" dominant-baseline="middle">PAUSE loop froze Microsoft's lossless class</text><rect x="10" y="156" width="980" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" opacity="1.0"/><text x="46" y="187" font-size="28.6" fill="#b45309" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">L3</text><text x="88" y="187" font-size="26.0" fill="#0f172a" text-anchor="start" font-weight="bold" opacity="1.0" dominant-baseline="middle">Switch, topology</text><text x="390" y="187" font-size="23.4" fill="#0f172a" text-anchor="start" font-weight="normal" opacity="1.0" dominant-baseline="middle">25.6 TB/s cut at 1:1; 4:1 gives 0.53</text><rect x="10" y="230" width="980" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" opacity="1.0"/><text x="46" y="261" font-size="28.6" fill="#b45309" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">L2</text><text x="88" y="261" font-size="26.0" fill="#0f172a" text-anchor="start" font-weight="bold" opacity="1.0" dominant-baseline="middle">Transport</text><text x="390" y="261" font-size="23.4" fill="#0f172a" text-anchor="start" font-weight="normal" opacity="1.0" dominant-baseline="middle">α 1.5 μs, β 50 GB/s, crossover 75 KB</text><rect x="10" y="304" width="980" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" opacity="1.0"/><text x="46" y="335" font-size="28.6" fill="#b45309" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">L1</text><text x="88" y="335" font-size="26.0" fill="#0f172a" text-anchor="start" font-weight="bold" opacity="1.0" dominant-baseline="middle">Wire and link</text><text x="390" y="335" font-size="23.4" fill="#0f172a" text-anchor="start" font-weight="normal" opacity="1.0" dominant-baseline="middle">PAM4 + FEC; copper to 3 m, then optics</text></svg>