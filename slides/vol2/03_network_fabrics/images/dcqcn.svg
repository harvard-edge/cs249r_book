<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr-comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F407A"/></marker><marker id="arr-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arr-coord" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect width="560" height="330" fill="white"/><rect x="5" y="120" width="160" height="74" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="2.5" opacity="1.0"/><text x="85" y="144" font-size="26.0" fill="#14294E" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">sender</text><text x="85" y="172" font-size="19.5" fill="#14294E" text-anchor="middle" font-weight="normal" opacity="1.0" dominant-baseline="middle">cuts its rate</text><rect x="215" y="110" width="150" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" opacity="1.0"/><text x="290" y="132" font-size="26.0" fill="#b45309" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">switch</text><rect x="230" y="150" width="27" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="2" opacity="1.0"/><rect x="261" y="150" width="27" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="2" opacity="1.0"/><rect x="292" y="150" width="27" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="2" opacity="1.0"/><rect x="323" y="150" width="27" height="36" rx="2" fill="white" stroke="#94a3b8" stroke-width="2" opacity="1.0"/><rect x="415" y="120" width="140" height="74" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="2.5" opacity="1.0"/><text x="485" y="157" font-size="26.0" fill="#14294E" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">receiver</text><line x1="167" y1="157" x2="213" y2="157" stroke="#d97706" stroke-width="3" opacity="1.0" marker-end="url(#arr-comm)"/><line x1="367" y1="157" x2="413" y2="157" stroke="#d97706" stroke-width="3" opacity="1.0" marker-end="url(#arr-comm)"/><text x="400" y="96" font-size="22.1" fill="#b91c1c" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">ECN mark</text><path d="M485,196 Q485,290 285,290 Q85,290 85,198" fill="none" stroke="#7c3aed" stroke-width="3" opacity="1.0" stroke-dasharray="8 5" marker-end="url(#arr-coord)"/><text x="285" y="314" font-size="22.1" fill="#6d28d9" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">congestion notification</text><text x="280" y="26" font-size="23.4" fill="#0f172a" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">DCQCN: a queue past its threshold</text><text x="280" y="56" font-size="23.4" fill="#0f172a" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">marks packets; senders slow down</text></svg>