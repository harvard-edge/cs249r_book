<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 265" width="1000" height="265" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr-comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F407A"/></marker><marker id="arr-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arr-coord" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arr-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect width="1000" height="265" fill="white"/><text x="10" y="22" font-size="28.6" fill="#b45309" text-anchor="start" font-weight="bold" opacity="1.0" dominant-baseline="middle">InfiniBand: credits</text><rect x="10" y="70" width="120" height="60" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="2" opacity="1.0"/><text x="70" y="100" font-size="24.7" fill="#14294E" text-anchor="middle" font-weight="normal" opacity="1.0" dominant-baseline="middle">sender</text><line x1="132" y1="86" x2="300" y2="86" stroke="#d97706" stroke-width="3" opacity="1.0" marker-end="url(#arr-comm)"/><text x="216" y="66" font-size="20.8" fill="#b45309" text-anchor="middle" font-weight="normal" opacity="1.0" dominant-baseline="middle">data</text><rect x="304" y="70" width="36" height="60" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="1.0"/><rect x="344" y="70" width="36" height="60" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="1.0"/><rect x="384" y="70" width="36" height="60" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="1.0"/><rect x="424" y="70" width="36" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2" opacity="1.0"/><text x="382" y="150" font-size="20.8" fill="#64748b" text-anchor="middle" font-weight="normal" opacity="1.0" dominant-baseline="middle">receiver buffer</text><line x1="300" y1="116" x2="134" y2="116" stroke="#16a34a" stroke-width="3" opacity="1.0" stroke-dasharray="7 5" marker-end="url(#arr-ok)"/><text x="216" y="150" font-size="20.8" fill="#15803d" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">3 credits free</text><text x="10" y="205" font-size="23.4" fill="#0f172a" text-anchor="start" font-weight="normal" opacity="1.0" dominant-baseline="middle">The sender waits for credits;</text><text x="10" y="240" font-size="23.4" fill="#0f172a" text-anchor="start" font-weight="normal" opacity="1.0" dominant-baseline="middle">no buffer overflows.</text><line x1="500" y1="10" x2="500" y2="300" stroke="#cbd5e1" stroke-width="1.5" opacity="1.0"/><text x="530" y="22" font-size="28.6" fill="#b45309" text-anchor="start" font-weight="bold" opacity="1.0" dominant-baseline="middle">RoCE: PFC pause + ECN</text><rect x="530" y="70" width="120" height="60" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="2" opacity="1.0"/><text x="590" y="100" font-size="24.7" fill="#14294E" text-anchor="middle" font-weight="normal" opacity="1.0" dominant-baseline="middle">sender</text><line x1="652" y1="86" x2="804" y2="86" stroke="#d97706" stroke-width="3" opacity="1.0" marker-end="url(#arr-comm)"/><rect x="808" y="70" width="30" height="60" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2" opacity="1.0"/><rect x="842" y="70" width="30" height="60" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2" opacity="1.0"/><rect x="876" y="70" width="30" height="60" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2" opacity="1.0"/><rect x="910" y="70" width="30" height="60" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2" opacity="1.0"/><rect x="944" y="70" width="30" height="60" rx="3" fill="white" stroke="#94a3b8" stroke-width="2" opacity="1.0"/><line x1="928" y1="62" x2="928" y2="138" stroke="#dc2626" stroke-width="2.5" opacity="1.0" stroke-dasharray="5 4"/><text x="860" y="150" font-size="20.8" fill="#64748b" text-anchor="middle" font-weight="normal" opacity="1.0" dominant-baseline="middle">switch queue</text><line x1="804" y1="116" x2="654" y2="116" stroke="#dc2626" stroke-width="3" opacity="1.0" stroke-dasharray="7 5" marker-end="url(#arr-bad)"/><text x="730" y="150" font-size="20.8" fill="#b91c1c" text-anchor="middle" font-weight="bold" opacity="1.0" dominant-baseline="middle">PAUSE</text><text x="928" y="52" font-size="19.5" fill="#b91c1c" text-anchor="middle" font-weight="normal" opacity="1.0" dominant-baseline="middle">threshold</text><text x="530" y="205" font-size="23.4" fill="#0f172a" text-anchor="start" font-weight="normal" opacity="1.0" dominant-baseline="middle">ECN marks slow senders first;</text><text x="530" y="240" font-size="23.4" fill="#0f172a" text-anchor="start" font-weight="normal" opacity="1.0" dominant-baseline="middle">PAUSE stops the upstream port.</text></svg>