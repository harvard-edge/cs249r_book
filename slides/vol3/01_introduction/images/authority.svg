<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360"><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a0284c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="a0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect width="900" height="360" fill="white"/><rect x="10" y="10" width="880" height="58" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" opacity="1.0"/><text x="26" y="47" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#b91c1c" text-anchor="start" opacity="1.0"><tspan x="26" dy="0">A<tspan baseline-shift="sub" font-size="72%">3</tspan> irreversible</tspan></text><text x="270" y="47" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a" text-anchor="start" opacity="1.0"><tspan x="270" dy="0">no automated reversal: refund paid out, unversioned record</tspan></text><rect x="10" y="78" width="880" height="58" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" opacity="1.0"/><text x="26" y="115" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#b45309" text-anchor="start" opacity="1.0"><tspan x="26" dy="0">A<tspan baseline-shift="sub" font-size="72%">2</tspan> compensable</tspan></text><text x="270" y="115" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a" text-anchor="start" opacity="1.0"><tspan x="270" dy="0">external effect with a tested undo: a seat hold released</tspan></text><rect x="10" y="146" width="880" height="58" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5" opacity="1.0"/><text x="26" y="183" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#6d28d9" text-anchor="start" opacity="1.0"><tspan x="26" dy="0">A<tspan baseline-shift="sub" font-size="72%">1</tspan> workspace</tspan></text><text x="270" y="183" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a" text-anchor="start" opacity="1.0"><tspan x="270" dy="0">mutates a disposable copy: discarded on teardown</tspan></text><rect x="10" y="214" width="880" height="58" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" opacity="1.0"/><text x="26" y="251" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0369a1" text-anchor="start" opacity="1.0"><tspan x="26" dy="0">A<tspan baseline-shift="sub" font-size="72%">0</tspan> read only</tspan></text><text x="270" y="251" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a" text-anchor="start" opacity="1.0"><tspan x="270" dy="0">changes nothing, yet secrets it reads can leak</tspan></text><text x="450" y="312" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#b91c1c" text-anchor="middle" opacity="1.0"><tspan x="450" dy="0">Same delete: A<tspan baseline-shift="sub" font-size="72%">1</tspan> in a sandbox clone, A<tspan baseline-shift="sub" font-size="72%">3</tspan> on the only copy of the edits</tspan></text><text x="450" y="346" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="450" dy="0">The level follows the consequence in this environment.</tspan></text></svg>