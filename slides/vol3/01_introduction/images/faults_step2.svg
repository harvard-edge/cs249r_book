<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230"><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a0284c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="a0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect width="900" height="230" fill="white"/><rect x="10" y="10" width="280" height="150" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" opacity="1.0"/><text x="150" y="54" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="middle" opacity="1.0"><tspan x="150" dy="0">Fail-stop</tspan></text><text x="150" y="96" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a" text-anchor="middle" opacity="1.0"><tspan x="150" dy="0">halts, so a heartbeat</tspan><tspan x="150" dy="24.0">or exit code detects it</tspan></text><rect x="310" y="10" width="280" height="150" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" opacity="1.0"/><text x="450" y="54" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="middle" opacity="1.0"><tspan x="450" dy="0">Byzantine</tspan></text><text x="450" y="96" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a" text-anchor="middle" opacity="1.0"><tspan x="450" dy="0">arbitrary, but bounded:</tspan><tspan x="450" dy="24.0">3f + 1 replicas outvote it</tspan></text><rect x="610" y="10" width="280" height="150" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="3" opacity="0.0"/><text x="750" y="54" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#b91c1c" text-anchor="middle" opacity="0.0"><tspan x="750" dy="0">Fail-plausible</tspan></text><text x="750" y="96" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#0f172a" text-anchor="middle" opacity="0.0"><tspan x="750" dy="0">well formed, credible, wrong:</tspan><tspan x="750" dy="24.0">looks like success</tspan></text><text x="450" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle" opacity="0.0"><tspan x="450" dy="0">Crash monitors log it as a success; samples from one model can agree on it.</tspan></text></svg>