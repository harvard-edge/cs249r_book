chapter: 01_introduction
lecture: "01"
title: "Introduction"
layer: trajectory
locator: origin
minutes: 75
notes_minutes: 70.5
core_minutes: 61.5
target_ideas: 30
thesis: "A delegated task is accepted only when a runtime closes the loop around the model, bounding what it may do below and checking what it did above, in proportion to the task's horizon, state, and authority."

hook:
  minutes: "0-5.5"
  setup: "Real system first. A screenshot of astropy issue 14978 (NDDataRef mask propagation crashes). A repair agent (mini-swe-agent 1.0.0 with Claude 4 Sonnet, SWE-bench Verified, task astropy__astropy-14995) made 28 model calls, spent $0.34, and ended 'The fix is working perfectly.' Then Example 1.1 (the chapter's hook in the course plan): the same cleanup command deletes files in a disposable clone and in the developer's only workspace."
  question_to_class: "Vote 1: who decided the repair was accepted? A its final message, B its own test scripts, C tests it never saw, D a human reviewer. Vote 2: which cleanup run is dangerous, and could the model tell?"
  payoff: "C: the benchmark ran test_nddata_bitmask_arithmetic (added by the fix's test patch, never shown) plus 179 existing tests. Run B: S3 and A3 against S2 and A1, though model, prompt, and horizon are identical; only the runtime's environment differs. The synthesis returns to both with the loop, exposure, evidence, and price."
  sources:
    - "https://github.com/astropy/astropy/issues/14978 (screenshot 2026-10-18); fixed by PR 14995"
    - "SWE-bench experiments, evaluation/verified/20250726_mini-v1.0.0_claude-sonnet-4-20250514/per_instance_details.json: astropy__astropy-14995 cost 0.3424152, api_calls 28, resolved true"
    - "SWE-bench Verified (princeton-nlp/SWE-bench_Verified): FAIL_TO_PASS [test_nddata_bitmask_arithmetic], 179 PASS_TO_PASS"
    - "Introduction, Example 1.1"

recall: "Lecture 0 asked students to predict a 100-step task at 99 percent per step (36.6 percent) and named the trajectory as the unit of engineering. Retrieval, 1 minute."

driving_question: "Why can a model that generates a fluent, correct action still fail to complete an autonomous task? (Purpose)"

goals:
  - "Explain why agency belongs to the closed loop rather than the model, and trace one trajectory."
  - "Classify a task by horizon, state, and authority, and name what each exposure demands."
  - "Separate bounds enforced below the model from evidence checked above it; write a task contract."
  - "Compute unchecked success over a horizon and cost per accepted task, and trace a turn's six phases."

running_example: "The repair agent (Lighthouse 1.1: 30 steps in a 128,000-token window; the chapter's connection-pool race repair, illustrative) shown as a real system: one recorded repair of astropy issue 14978 (28 calls, $0.34, an IndentationError its own patch caused, caught one turn later and restored with git checkout, accepted by a sealed test) and the 500-task SWE-bench Verified run it belongs to (324 accepted, $185.73 total, median 33 calls, 18,582 commands)."

segments:
  - name: Closed Loop
    divider_question: "Who closes the loop, and what does the model hold?"
    read: "§1.1 to §1.3"
    concept_questions: [1, 2, 3, 4]
    land: "Agency is a property of the closed loop, and we account for the whole trajectory rather than each call."
    minutes: 13
  - name: Exposure
    divider_question: "How far does a task depart from one model call?"
    read: "§1.4"
    concept_questions: [5, 6, 7]
    land: "Horizon, state, and authority locate a task; authority comes from consequence in the environment, and the runtime sizes its defenses to that location."
    minutes: 12
  - name: Closure
    divider_question: "How does the runtime keep a plausible wrong answer out?"
    read: "§1.5"
    concept_questions: [8, 9, 10, 11]
    land: "Bounds below the model, evidence above it, both written into a contract before the loop runs."
    minutes: 13.5
  - name: Horizon & Cost
    divider_question: "How do reliability and cost scale with a trajectory?"
    read: "§1.6"
    concept_questions: [12, 13, 14]
    land: "Horizon multiplies risk, acceptance divides cost, and both equations price every mechanism."
    minutes: 11.5
  - name: One Turn
    divider_question: "What happens inside one turn?"
    read: "§1.7"
    concept_questions: [15]
    land: "Each turn passes six phases; only model invocation belongs to the model, and every run ends accepted, failed, unresolved, or escalated."
    minutes: 7

concept_questions:
  - id: 1
    q: "What does an agent loop look like in real code?"
    picture: "Excerpt of mini-swe-agent's run/step/execute_actions loop (real framework code)"
    numbers: "none"
    example: "mini-swe-agent 2.4.6 (current version), agents/default.py, commit 04d809c; the 2025 runs used 1.0.0, whose exit rule (agents/default.py lines 126 and 127, commit a2b0efee5f) is quoted on the Closure slide"
    read: "§1.2"
  - id: 2
    q: "Who closes the loop in a conversational assistant, and who in an agent?"
    picture: "Redrawn figure 1, panel A then panel B (build)"
    numbers: "none (Table 1's three eras in the note)"
    example: "Developer pasting errors back vs a runtime dispatching into a sandbox"
    read: "§1.1, §1.2"
  - id: 3
    q: "How does an agent map onto a classical computer, and where does the map break?"
    picture: "Redrawn figure 2 (stochastic computer), step 2 outlines model and runtime; EDVAC photo and First Draft cover"
    numbers: "von Neumann 1945"
    example: "Authority inverted: the runtime decides what runs; context is a lossy copy of state"
    read: "§1.3"
  - id: 4
    q: "What is a trajectory, and what does it record that a transcript does not?"
    picture: "τ notation plus four verbatim turns (11, 13, 14, 16) of the real astropy trajectory; histogram of model calls per task for 500 tasks"
    numbers: "28 calls, $0.34 (RUN); median 33 calls, range 9 to 123, 324 accepted (calcs.py)"
    example: "The failed patch stays in the record"
    read: "§1.4 (Definition 1.2)"
  - id: 5
    q: "How far does a task depart from one model call?"
    picture: "Redrawn figure 3, H·S·A space, three steps; lighthouses placed"
    numbers: "Repair H≈100, S2, A1; remediation H≈20, S3, A3; support H≤3, S1, A0; research H≥1,000, S3, A0 (figure 3)"
    example: "Four lighthouses"
    read: "§1.4"
  - id: 6
    q: "What sets an action's authority level?"
    picture: "A0 to A3 bands with examples; Example 1.1 placed at A1 and A3"
    numbers: "none"
    example: "Seat hold released (A2), refund paid out (A3), Lighthouse 1.4"
    read: "§1.4"
  - id: 7
    q: "Where does authority come from in a real harness?"
    picture: "mini-swe-agent LocalEnvironment (Popen shell=True, env=os.environ) beside DockerEnvironment (docker exec, docker rm -f); bar of 18,582 real commands by class"
    numbers: "read 8,826 (47%), write 5,284 (28%), run 4,463 (24%), network 9 (calcs.py, derived by pattern)"
    example: "Zero ambient authority"
    read: "§1.5.1"
  - id: 8
    q: "Why does an agent's characteristic failure escape crash monitors and voting?"
    picture: "Three fault cards (fail-stop, Byzantine, fail-plausible), build"
    numbers: "3f+1 replicas (Lamport et al. 1982)"
    example: "Deleted lock; commented-out assertion"
    read: "§1.5.1"
  - id: 9
    q: "How often is a confident completion report wrong?"
    picture: "mini-swe-agent _check_finished code beside bars: 500 claimed, 324 accepted, 176 rejected"
    numbers: "176 of 500, 35% (calcs.py)"
    example: "Self-report vs hidden tests"
    read: "§1.5.2, §1.9"
  - id: 10
    q: "What does each level of evidence actually establish?"
    picture: "Staircase of five closure evidence levels, step 2 annotated with the real run's self-report, visible test run, and sealed test"
    numbers: "1 new and 179 old tests (SWE-bench Verified record)"
    example: "Sealing a sequential test does not widen coverage (race repair)"
    read: "§1.5.2"
  - id: 11
    q: "What turns a request into rules a runtime can enforce?"
    picture: "Five-part contract table, built by rows, with the failure each omission causes"
    numbers: "298 truncated outputs in the real run (bounded observation; calcs.py)"
    example: "Repair contract, Table 2"
    read: "§1.5.3"
  - id: 12
    q: "How long are the tasks we now delegate?"
    picture: "METR time-horizon plot, frontier and other models, fit since 2023"
    numbers: "3.2 s to 17.4 h, about 19,000x; doubling 6.2 months overall, 4.2 since 2023 (calcs.py from MLSysIM Literature.AgentTimeHorizon; chapter figure 4)"
    example: "Kwa et al. 2025"
    read: "§1.6"
  - id: 13
    q: "How fast does unchecked success fall with the horizon?"
    picture: "Success vs horizon, three steps: 0.99 curve; 0.11% curve; 200-turn point"
    numbers: "90.4%, 36.6%, eps 0.00105 (9.5x lower), eps*H≈0.105, 13.4% at 200 (calcs.py, NM 1.1)"
    example: "The interpreter caught the agent's bad edit one turn later"
    read: "§1.6, NM 1.1"
  - id: 14
    q: "Which lever lowers cost per accepted task more?"
    picture: "Three bars $5.25, $3.63, $3.50 (build); real-run bars $0.32, $0.37, $0.57"
    numbers: "NM 1.2: 2.10/0.40, 1.45/0.40, 2.10/0.60, break-even 0.58; RUN: $185.73/500 = $0.371, /0.648 = $0.573, winners-only $0.320, 1.79x (calcs.py)"
    example: "Workflow vs model-directed loop (§1.6.1)"
    read: "§1.6, NM 1.2"
  - id: 15
    q: "What happens inside one turn, and which phase belongs to the model?"
    picture: "Redrawn figure 5, six phases in three steps; real trajectory mapped phase by phase; Listing 1 beside the real harness's limits"
    numbers: "step_limit, cost_limit 3.0, wall_time_limit_seconds, max_consecutive_format_errors 3 (mini-swe-agent AgentConfig)"
    example: "Outcomes accepted, failed, unresolved, escalated; tool-wait"
    read: "§1.7"

concept_trace:
  - concept: "Agency is a property of the closed loop"
    frame: "In an agent, a runtime closes the loop a person used to close"
    shows: "figure 1 build: person closes loop, then runtime closes loop; preceded by real harness code"
  - concept: "Trajectory as the unit of engineering"
    frame: "A trajectory records proposals, decisions, and observations"
    shows: "τ notation and four real turns, with the record's total (28 calls, $0.34); next frame histogram of 500 trajectories"
  - concept: "H·S·A exposures"
    frame: "Three axes measure how far a task departs from one call"
    shows: "H·S·A space built in three steps with four lighthouses"
  - concept: "Invariant closure"
    frame: "Invariant closure (focus slide)"
    shows: "the principle's two halves and (1-eps)^H; preceded by fail-plausible cards, claimed-vs-accepted data, and the evidence ladder"
  - concept: "Task contract"
    frame: "A task contract turns a request into rules the runtime enforces"
    shows: "five-part table built by rows with the failure each omission causes"
  - concept: "Horizon compounding"
    frame: "Horizon compounding decays unchecked success exponentially"
    shows: "success vs horizon curve, required error rate, 200-turn squaring"
  - concept: "Cost per accepted task"
    frame: "Halve the token price, or raise acceptance?"
    shows: "NM 1.2 card, three bars, equation 2 and break-even worked line by line"
  - concept: "Six-phase turn lifecycle"
    frame: "Every turn passes six phases, and the model owns one"
    shows: "figure 5 built in three steps; next frame maps the real trajectory to phases"

coverage:
  primary_taught: ["Agency is a property of the closed loop", "Trajectory as the unit of engineering", "H·S·A exposures", "Invariant closure", "Task contract", "Horizon compounding", "Cost per accepted task", "Six-phase turn lifecycle"]
  primary_left_to_reading: []
  secondary:
    "Fail-plausible fault": "A fail-plausible fault looks like a success"
    "Zero ambient authority": "The environment class picked at launch grants the authority"
    "Closure evidence levels": "Five evidence levels support five different claims"
    "Fixed workflow vs model-directed loop": "A model-directed loop pays only where it raises acceptance [OPTIONAL]"
    "Side-effect classes": "The consequence in its environment sets an action's authority"
    "Lighthouse workloads": "Three axes ... (step 3) and Four lighthouse workloads [OPTIONAL]"
    "Tool-wait problem": "six-phase figure step 3 (wait box) and its note; Lecture 5 prices it"
    "Outcome taxonomy": "six-phase step 3 and A bare loop stops on the model's word [OPTIONAL]"

worked_examples:
  - name: "Napkin Math 1.1: Horizon compounding"
    steps: ["Given 99% per step, independent, unchecked", "0.99^10 = 90.4%, 0.99^100 = 36.6%", "eps = 1 - 0.9^(1/100) = 0.11%, 9.5x lower", "eps*H ≈ 0.105 at any horizon", "doubling to 200 turns squares success: 13.4%; checks that restore shorten the unchecked horizon"]
  - name: "Napkin Math 1.2: Cheaper tokens or more acceptances (estimate activity)"
    steps: ["Given $1.30 tokens + $0.80 other, accepted 40%", "C_eff = 2.10/0.40 = $5.25", "half price 1.45/0.40 = $3.63; 60% 2.10/0.60 = $3.50", "break-even 0.40/(1 - 0.5 x 0.62) = 0.58", "acceptance divides the whole attempt"]
  - name: "The real repair trajectory (§1.7 anatomy on a recorded run)"
    steps: ["turn 11 reproduces the bug", "turn 13 patches with sed", "turn 14 IndentationError caught one turn later", "turn 16 git checkout restores", "turn 19 visible check passes", "turn 28 model says done", "sealed test plus 179 accept outside the loop"]
  - name: "Equation 2 on a real run"
    steps: ["$185.73 over 500 single attempts = $0.371", "324 accepted, p = 0.648", "$0.371/0.648 = $0.573", "accepted runs alone $0.320: 1.79x understatement"]

active_learning:
  - at_minute: 0.5
    type: concept_question
    prompt: "Who decided this repair was accepted?"
    answer: "C, a hidden test plus 179 existing tests"
  - at_minute: 3
    type: predict
    prompt: "Which cleanup run is dangerous?"
    answer: "B: S3/A3 vs S2/A1; the model cannot tell, only the environment differs"
  - at_minute: 5.5
    type: retrieval
    prompt: "100 steps at 99%; unit of engineering?"
    answer: "36.6%; the trajectory"
  - at_minute: 19
    type: concept_question
    prompt: "A stronger model: which runtime job can it drop?"
    answer: "D none"
  - at_minute: 30
    type: diagnose
    prompt: "Checkpoint 1.1: deployment, only copy of edits, sealed sequential test"
    answer: "A3 needs human approval; S3 needs an isolated clone; stress runs for concurrency"
  - at_minute: 43.5
    type: concept_question
    prompt: "True or false: coherent report; prompt-stated limit; 128K window"
    answer: "All false: 176/500; host credentials; 51,500 fit but 892,500 resent"
  - at_minute: 51
    type: estimate
    prompt: "Halve the token price or raise acceptance to 60%?"
    answer: "$3.63 vs $3.50; break-even 0.58"
  - at_minute: 64.5
    type: retrieval
    prompt: "Back to the hook: loop, exposure, evidence, price"
    answer: "28 proposals without authority; H=28, S2, A1; sealed test; $0.34, $0.57 per accepted"

open_questions:
  - "What will limit delegated tasks first: model accuracy, cost per accepted task, or the evidence needed to accept the work?"
  - "When an agent's action cannot be undone, who should approve it, and how long may approval take?"
  - "If delegated tasks keep doubling every few months, what must change in the runtime rather than in the model?"

more_examples:
  - "SWE-bench Verified per-task results and trajectories, mini-swe-agent 1.0.0 with Claude 4 Sonnet (SWE-bench experiments)"
  - "git_peek_suspicious_commits.md in the same submission: agents reading future commits from git history, an environment-field leak (not shown)"
  - "METR Time Horizon v1.1 (Kwa et al. 2025)"
  - "EDVAC and von Neumann's First Draft (1945)"
  - "Wiener, Cybernetics (1948) and 'Some Moral and Technical Consequences of Automation' (1960)"

left_to_reading:
  - concept: "Table 3 (isolated-request baseline vs trajectory requirements) and §1.8 book organization"
    why: "Lecture 0 maps the course; the table's rows are owned by later lectures"
  - concept: "Retry budget 1-(1-p)^k (92% at k=5)"
    why: "Fallacy detail in §1.9; computed in calcs.py for questions"

closing:
  return_to_hook: "Synthesis frame: loop (28 proposals, no authority), exposure (H=28, S2, A1 in a container), evidence (sealed test plus 179), price ($0.34; $0.57 per accepted over 500); the delete is harmless in the copy and fatal on the only workspace."
  read_and_practice: ["Introduction §1.1 to §1.9", "Checkpoint 1.1", "Napkin Math 1.1 and 1.2 by hand", "Exercises 1 to 3"]
  further_reading:
    - cite: "Saltzer and Schroeder, The Protection of Information in Computer Systems, 1975"
      url: "https://doi.org/10.1109/proc.1975.9939"
      why: "Least privilege and complete mediation behind capability grants"
    - cite: "Saltzer, Reed, and Clark, End-to-End Arguments in System Design, 1984"
      url: "https://doi.org/10.1145/357401.357402"
      why: "Why only an endpoint that knows the task can check it"
    - cite: "Avizienis et al., Basic Concepts and Taxonomy of Dependable and Secure Computing, 2004"
      url: "https://doi.org/10.1109/TDSC.2004.2"
      why: "Signaled vs unsignaled failures; the fail-plausible fault"
    - cite: "Yao et al., ReAct, ICLR 2023; Jimenez et al., SWE-bench, ICLR 2024"
      url: "https://arxiv.org/abs/2210.03629"
      why: "The reason-act-observe loop; the benchmark behind the real run"
    - cite: "Kwa et al., Measuring AI Ability to Complete Long Software Tasks, 2025"
      url: "https://arxiv.org/abs/2503.14499"
      why: "The measured horizon trend"
  bridge: "Lecture 2, The Foundation Model: what does one model call return, and what does it cost?"

