<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ak" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#1A1A2E"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#CB202D"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#008F45"/></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#581C87"/></marker></defs><rect width="900" height="330" fill="white"/><rect x="20" y="8" width="330" height="52" rx="10" fill="#E7DAF2" stroke="#581C87" stroke-width="2"/><text x="40" y="43" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#581C87" font-weight="bold" text-anchor="start">Execution, memory</text><text x="380" y="43" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1A1A2E" font-weight="normal" text-anchor="start">destroy or restore</text><rect x="20" y="72" width="330" height="52" rx="10" fill="#E7DAF2" stroke="#581C87" stroke-width="2"/><text x="40" y="107" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#581C87" font-weight="bold" text-anchor="start">Workspace, storage</text><text x="380" y="107" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1A1A2E" font-weight="normal" text-anchor="start">keep outputs, drop the rest</text><rect x="20" y="136" width="330" height="52" rx="10" fill="#E7DAF2" stroke="#581C87" stroke-width="2"/><text x="40" y="171" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#581C87" font-weight="bold" text-anchor="start">Network, broker</text><text x="380" y="171" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1A1A2E" font-weight="normal" text-anchor="start">retire sessions, identities</text><rect x="20" y="200" width="330" height="52" rx="10" fill="#E7DAF2" stroke="#581C87" stroke-width="2"/><text x="40" y="235" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#581C87" font-weight="bold" text-anchor="start">Host, devices</text><text x="380" y="235" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1A1A2E" font-weight="normal" text-anchor="start">scrub queues, device memory</text><rect x="20" y="276" width="860" height="48" rx="10" fill="white" stroke="#CB202D" stroke-width="2.5"/><text x="450" y="308" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#CB202D" font-weight="bold" text-anchor="middle">one leftover proves failure: destroy, rebuild</text></svg>