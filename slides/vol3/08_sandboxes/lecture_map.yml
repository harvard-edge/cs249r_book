    - cite: "Dennis and Van Horn, Programming Semantics for Multiprogrammed Computations, 1966"
      url: "https://doi.org/10.1145/365230.365252"
      why: "Capabilities: unforgeable references that bind authority to the reference"

segments:
  - name: Reach
    divider_question: "What can admitted code actually reach, and where must the limit live?"
    read: "§8.1 to §8.3"
    minutes: 15
    land: "A schema-valid call runs with all the authority of its process; pruning globals hides names, not reach, so the limit must be enforced beneath the process."
  - name: Capabilities
    divider_question: "How does the runtime hand code only what the task needs?"
    read: "§8.4"
    minutes: 13
    land: "A capability binds authority to an unforgeable reference with a lifetime; attenuation narrows but never widens, and a broker keeps the secret out of the guest."
  - name: Envelopes
    divider_question: "Which boundary fits the code, the authority, and the horizon?"
    read: "§8.5"
    minutes: 14
    land: "The four envelopes differ in where a system call lands, which sets the trusted base and the per-call tax; setup is amortized over the trajectory."
  - name: Workspace and Egress
    divider_question: "How does state persist across turns without leaking out?"
    read: "§8.6, §8.7"
    minutes: 14
    land: "Copy-on-write makes provisioning track what the agent writes; egress is enforced on the host path, and a permitted channel can still carry data out."
  - name: Pools and Reset
    divider_question: "How does a platform serve the next tenant without delay or leakage?"
    read: "§8.8"
    minutes: 12

