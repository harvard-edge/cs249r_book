closing:
  return_to_hook: "The Gemini CLI command and the README run_shell both run below the model; a sandbox blocks the read and the socket, but the submit_report channel it was permitted still leaks."
  read_and_practice:
    - "§8.2 to §8.8; Checkpoints 8.1 and 8.2"
    - "Napkin Math 8.1 to 8.4 by hand; Exercises 1, 3, 6"
    - "run images/measure.py to reproduce every measurement"
  further_reading:
