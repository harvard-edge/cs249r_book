notes_for_author:
  - "Real-data measurements made for this deck (scripts in images/data/): retry harness on localhost, pipe capacity, exit-status transcript, process-group cancellation, pytest log tokens, GitHub MCP descriptor tokens, 500-run observation sizes."
  - "The IETF draft assigns 422 to key reuse with a different payload and 409 to an outstanding request; the chapter uses 409 for the mismatch. The slide shows the draft; the note names the difference."
  - "pytest returns exit status 5 when it collects zero tests; the chapter's claim that a runner with an unmatched filter exits 0 holds for some runners but not pytest. The note says so."
  - "Altitude: the hook and credits name GitHub MCP, pytest, and SWE-agent as sources of real artifacts; slide titles name no product."
