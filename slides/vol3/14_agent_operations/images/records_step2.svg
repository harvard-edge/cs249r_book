<text x="150" y="318" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0369a1" text-anchor="middle" font-weight="bold">Explains one trial</text>
<text x="450" y="318" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6d28d9" text-anchor="middle" font-weight="bold">Lecture 11</text>
<g opacity="0"><text x="750" y="318" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#15803d" text-anchor="middle" font-weight="bold">Every rate comes from here</text></g>
<g opacity="0"><text x="450" y="375" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#b91c1c" text-anchor="middle" font-weight="bold">A span's status is not a task verdict.</text></g>
