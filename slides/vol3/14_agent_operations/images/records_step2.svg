<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
<rect width="900" height="400" fill="white"/>
<rect x="300" y="14" width="300" height="64" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2.4"/><text x="450.0" y="39.5" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">One runtime event</text><text x="450.0" y="64.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">model call, tool run, or check</text>
<path d="M450,78 L150,160" fill="none" stroke="#0284c7" stroke-width="2.6"/><polygon points="150,160 165.4,163.1 161.7,149.6" fill="#0284c7"/>
<rect x="30" y="162" width="240" height="120" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.4"/><text x="150.0" y="203.3" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0369a1" text-anchor="middle" font-weight="bold">Diagnostic trace</text><text x="150.0" y="228.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">timing and debugging</text><text x="150.0" y="253.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">may sample, cut, or drop</text>
<path d="M450,78 L450,160" fill="none" stroke="#7c3aed" stroke-width="2.6"/><polygon points="450,160 457.0,146.0 443.0,146.0" fill="#7c3aed"/>
<rect x="330" y="162" width="240" height="120" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.4"/><text x="450.0" y="203.3" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6d28d9" text-anchor="middle" font-weight="bold">Trajectory log</text><text x="450.0" y="228.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">recovery rebuilds from it</text><text x="450.0" y="253.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">never sampled</text>
<g opacity="0"><path d="M450,78 L750,160" fill="none" stroke="#16a34a" stroke-width="2.6"/><polygon points="750,160 738.3,149.6 734.6,163.1" fill="#16a34a"/></g>
