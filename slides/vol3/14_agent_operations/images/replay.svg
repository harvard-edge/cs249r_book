<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
<rect width="900" height="360" fill="white"/>
<rect x="250" y="10" width="400" height="64" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.4"/><text x="450.0" y="35.5" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6d28d9" text-anchor="middle" font-weight="bold">Recorded trajectory</text><text x="450.0" y="60.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">saved prefix and captured results</text>
<path d="M450,74 L150,128" fill="none" stroke="#64748b" stroke-width="2.6"/><polygon points="150,128 165.0,132.4 162.5,118.6" fill="#64748b"/>
<rect x="20" y="130" width="260" height="132" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.4"/><text x="150.0" y="177.3" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6d28d9" text-anchor="middle" font-weight="bold">Time-travel replay</text><text x="150.0" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">shows what the</text><text x="150.0" y="227.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">model received</text>
<text x="150" y="300" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6d28d9" text-anchor="middle" font-weight="bold">no new outcome</text>
<path d="M450,74 L450,128" fill="none" stroke="#64748b" stroke-width="2.6"/><polygon points="450,128 457.0,114.0 443.0,114.0" fill="#64748b"/>
<rect x="320" y="130" width="260" height="132" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/><text x="450.0" y="177.3" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#b45309" text-anchor="middle" font-weight="bold">Regression replay</text><text x="450.0" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">old vs. new adapter</text><text x="450.0" y="227.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">on captured output</text>
<text x="450" y="300" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#b45309" text-anchor="middle" font-weight="bold">no model call</text>
<path d="M450,74 L750,128" fill="none" stroke="#64748b" stroke-width="2.6"/><polygon points="750,128 737.5,118.6 735.0,132.4" fill="#64748b"/>
<rect x="620" y="130" width="260" height="132" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.4"/><text x="750.0" y="177.3" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0369a1" text-anchor="middle" font-weight="bold">Counterfactual branch</text><text x="750.0" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">fork the prefix,</text><text x="750.0" y="227.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">change one thing</text>
<text x="750" y="300" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#0369a1" text-anchor="middle" font-weight="bold">fresh model calls</text>
<text x="450" y="345" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="bold">Only the branch tests whether a fix changes the outcome.</text>
</svg>
