  - {concept: "Reward hacking", frame: "One added file: what does pytest report?", shows: "conftest.py listing and our pytest run (1 failed, then 1 passed)"}
  - {concept: "Reward as measurement", frame: "What share of rewards go to failures?", shows: "false_share build: 18.4 percent at 10 percent, 32 percent at 5 percent"}
  - {concept: "Credit assignment", frame: "A terminal failure blames the diagnosis and the bad edit alike", shows: "credit build: equal -0.4 on every turn, then forks"}
  - {concept: "GRPO coefficients", frame: "Three rewards become three update coefficients", shows: "worked example and lone-pass curve; TRL source next frame"}
  - {concept: "Zero-contrast groups", frame: "Groups of eight carry a gradient only at mid-range pass rates", shows: "contrast arch build, 0.34 and 0.99"}
  - {concept: "Faithful rollout records", frame: "The final transcript differs from what the policy saw at each turn", shows: "records build: compaction, then the record fields"}
  - {concept: "Rollout loop sizing", frame: "Reset 233× faster. How much more training?", shows: "slot-cycle bars, 1.77x"}
  - {concept: "Entropy collapse", frame: "Symmetric clipping collapses entropy; a higher ceiling holds it", shows: "DAPO Figure 2(b) with labels; clip room numbers"}
  - {concept: "Verifier isolation", frame: "Grading in a separate workspace turns the hack back into a failure", shows: "isolation build, our run"}

