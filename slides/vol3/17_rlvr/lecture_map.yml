active_learning:
  - {at_minute: 4, type: predict, prompt: "Append 'Please do not reward hack.': hacking rate?", answer: "70 percent (from 80; 95 for 'designer's intent'); METR prompt table, 20 runs each"}
  - {at_minute: 6, type: retrieval, prompt: "Lecture 16: which tokens received loss; which state was never seen?", answer: "observations 77.1 percent of stored tokens with no loss, targets 4.9 percent; the version conflict"}
  - {at_minute: 16, type: predict, prompt: "One added conftest.py: what does pytest report?", answer: "1 passed, exit code 0 (our run); the fixture alone gives 1 failed"}
  - {at_minute: 22, type: estimate, prompt: "Pass rate falls from 10 to 5 percent: share of rewards that are failures?", answer: "32.2 percent (derived), up from 18.4"}
  - {at_minute: 35, type: estimate, prompt: "Your turn: one pass in a group of 16?", answer: "sqrt(15) = 3.87; each failure -0.26"}
  - {at_minute: 43, type: estimate, prompt: "Double the group or retarget the tasks?", answer: "23.8, 28.6, 8.1 rollouts per informative group; retarget, 2.9x cheaper, and log the mixture"}
  - {at_minute: 51, type: diagnose, prompt: "Verifier crashed: what does each pipeline teach?", answer: "reward 0 teaches avoiding long tasks; dropping teaches survivorship; pass teaches crashing the grader; correct: pending or unknown"}
  - {at_minute: 61, type: predict, prompt: "Reset 233x faster: how much more training?", answer: "1.77x; 8 s to 4.515 s; Amdahl"}
  - {at_minute: 65, type: concept_question, prompt: "True or false: four fallacies of §17.11", answer: "all false: 18.4 percent; 28.6 vs 8.1; 32x; 1.77x"}

fallacies:
  - "An automated reward is a complete task specification (vote frame; Napkin Math 17.1)"
  - "Leaving the scorer, runner, or configuration reachable (hook and isolation frames)"
  - "A bigger group is the way to extract signal from hard tasks (vote frame; Napkin Math 17.4)"
  - "Longer self-correction text means better reasoning (length frame; vote frame)"
  - "Faster environment reset speeds training proportionally (slot frame; vote frame)"

open_questions:
  - "A monitor that penalizes detected hacks may teach hacks the monitor cannot see. How should a team use a monitor during training?"
  - "Most agent tasks lack an executable check. When can a judge model be the reward, and how often must it be recalibrated?"
  - "If RL mostly sharpens what the base model can already sample, what must change for it to teach new capabilities?"

