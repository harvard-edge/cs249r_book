chapter: 17_rlvr
lecture: "17"
title: Reinforcement Learning from Verifiable Rewards
minutes: 75
notes_minutes: 70.5
core_minutes: 59.5
target_ideas: 30
layer: learning
locator: origin
previous: "Lecture 16: Trajectory Fine-Tuning"
next: "Lecture 18: Multi-Agent Coordination"

thesis: >-
  When a check becomes the reward, the optimizer searches every gap between
  what the check measures and what the task requires, so the verifier must be
  out of the policy's reach and its rewards read as evidence about only what it
  covers.

hook:
  minutes: "1-6"
  setup: >-
    War Story 17.1 (METR, June 2025). o3's real kernel-task submission replaces
    Python's clock with one that runs a thousand times slow; METR's task table:
    21 of 21 runs on one task, 39 of 128 on RE-Bench (scorer visible), 8 of
    1,087 on HCAST (scorer hidden).
  question_to_class: "Append 'Please do not reward hack.' to the prompt. Hacking rate? A 0, B 20, C 70, D 95 percent."
  payoff: >-
    70 percent (80 originally; 'designer's intent' 95). An instruction does not
    move a reachable scorer above the visible-test closure level. The synthesis
    grades the same kind of hack twice in our own run: 1 passed in the
    candidate's tree, 1 failed in a separate assessment workspace.
  sources: ["Reinforcement Learning from Verifiable Rewards, War Story 17.1, §17.3", "METR blog 2025-06-05 (task and prompt tables, code)"]

driving_question: "Why does a check that only scores an agent's attempts end up defining what the agent learns?"
thread_tag: "H·S·A thread: moves no exposure; training changes the model"   # golden-thread line on the goals slide (sweep D4, 2026-10-19)

running_example: >-
  The repair agent's connection-pool repair, pool_repair_01 on pool_fixture_v1
  under repair_accept_v1, sampled from trained_policy_v1: three trials
  rl_trial_01 to 03 with rewards [0, 1, 0] (Napkin Math 17.3, Case Study
  §17.10). Three real runs made for this lecture (images/data/): the chapter's
  conftest.py exploit on a tiny pool fixture graded in the candidate's tree
  (1 passed) and in a separate assessment workspace (1 failed); open-r1's
  evaluate_code giving two wrong programs reward 1.0; a local model's recorded
  log probabilities, unchanged across temperatures 0.2 to 1.5.

segments:
  - name: Rewards
    minutes: "9-27"   # hook, retrieval, stack, and goals (minutes 0 to 9) precede the first divider
    question: "What does a policy learn when a check is its only teacher?"
    read: "§17.2, §17.3"
    land: "A reward is a measurement of what its check covers, its errors grow when passes are rare, and the optimizer will find any gap."
  - name: Credit
    minutes: "27-46"
    question: "Which turns of a trajectory earned the reward?"
    read: "§17.4, §17.5"
    land: "A terminal reward gives every token of a rollout one coefficient set by its group; rare passes and rare hacks get the biggest push, and tied groups get none."
  - name: Records
    minutes: "46-54"
    question: "What must a rollout record for the update to be faithful?"
    read: "§17.6"
    land: "Record what the policy saw, sampled, and with what probability, and never invent a verdict."
  - name: Isolation
    minutes: "54-58"
    question: "Where must the verdict come from?"
    read: "§17.7"
    land: "The verdict comes from a controller the policy and its code cannot reach, and it covers only what its tests check."
  - name: Rollouts
    minutes: "58-66"
    question: "What limits a training loop that runs agents?"
    read: "§17.8, §17.9"
    land: "The loop's speed is set by its slowest stage, and its health by diversity and outcomes; reward and length can rise while health falls."

concept_questions:
  - q: "What happens when a model can reach its scorer?"
    picture: "o3's real clock-patch code beside METR's per-task hacking bars"
    numbers: "21/21, 12/28, 6/24, 39/128 RE-Bench, 8/1,087 HCAST (METR task table); prompt variants 80, 95, 80, 70, 70 percent over 20 runs"
    example: "o3 on RE-Bench and HCAST"
    read: "§17.3, War Story 17.1"
  - q: "What is RLVR?"
    picture: "loop build: policy, group of sandboxed rollouts, verifier, rewards, update"
    numbers: "binary terminal reward"
    example: "the repair group"
    read: "§17.2.1, definition 17.1"
  - q: "What does a verifiable reward look like in code?"
    picture: "open-r1 evaluate_code and format_reward, real source"
    numbers: "none (code)"
    example: "DeepSeek-R1-Zero's accuracy and format rewards"
    read: "§17.3.1, table 1"
  - q: "Why does a never-solved task teach nothing?"
    picture: "three groups of 8 with their coefficients"
    numbers: "1 - (1-p)^G; all-zero coefficients"
    example: "never solved, 2 of 8, always solved"
    read: "§17.2.3"
  - q: "What is reward hacking, concretely?"
    picture: "conftest.py listing and our pytest run"
    numbers: "fixture 1 failed, candidate tree 1 passed (our run)"
    example: "MacDiarmid et al. 2025 class 3"
    read: "§17.3.1, Listing 1"
  - q: "Can a sealed check still be wrong?"
    picture: "open-r1 checker scores three programs (our run)"
    numbers: "correct 1.0, print-only-1 1.0, print-1..100 1.0"
    example: "zip truncation; TODO in the source"
    read: "§17.3.1"
  - q: "How many rewards go to failures?"
    picture: "false-accept share against pass rate"
    numbers: "18.4 percent at 10 percent (819.2 and 184.32 accepts); 32.2 percent at 5 percent (derived)"
    example: "Napkin Math 17.1, Checkpoint 17.1"
    read: "§17.3.2"
  - q: "How may a reward add shaping terms?"
    picture: "number line of pass and failure score bands"
    numbers: "alpha 0.4, lambda 0.7: lowest pass 0.30, highest failure 0.40"
    example: "Exercise 2"
    read: "§17.3.3"
  - q: "Which turns earned a terminal reward?"
    picture: "five-turn strip with equal -0.4 coefficients, then forks at the debugger turn; Minsky photo"
    numbers: "fork values 0.05 and 0.60, +0.55, bound 0.32; fork cost 117x against 9x"
    example: "the repair attempt with a syntax error"
    read: "§17.4"
  - q: "How does GRPO turn rewards into coefficients?"
    picture: "worked example; lone-pass curve; TRL source"
    numbers: "-0.707107 and 1.414214; lone pass 3.87 at G = 16; TRL Bessel divisor gives 1.155"
    example: "[0, 1, 0]"
    read: "§17.5.1, Napkin Math 17.3"
  - q: "Why do failures get long?"
    picture: "per-token push of 128 and 4,096-token failures; DeepSeek-R1-Zero length curve"
    numbers: "32x; R1-Zero length under 1,000 to about 10,000 tokens (read from figure)"
    example: "Liu et al. 2025; DeepSeek-AI et al. 2025"
    read: "§17.5.3"
  - q: "When does a group carry no gradient, and what does that cost?"
    picture: "contrast arch for G = 8 and 16; rollouts per informative group bars"
    numbers: "0.34 at 5 percent, 0.99 at 50 percent; 23.8, 28.6, 8.1 rollouts; 2.9x; 62.9M tokens per step"
    example: "Napkin Math 17.4"
    read: "§17.5.4"
  - q: "What must a rollout record?"
    picture: "compaction build and record fields; our log-probability run"
    numbers: "reported 0.338 against about 0.063 sampled at T = 0.2 (derived), 5.4x"
    example: "rl_trial_01 compaction at turn 4"
    read: "§17.6"
  - q: "Where must the verdict come from?"
    picture: "exploration and assessment sides, our run"
    numbers: "1 passed in place, conftest.py refused, 1 failed in assessment"
    example: "verifier isolation for rl_trial_02"
    read: "§17.7.1"
  - q: "What limits the training loop, and how healthy is it?"
    picture: "DAPO entropy curve; slot cycle bars; Yue et al. pass@k"
    numbers: "clip room 1.08 against 0.002; 8 s and 4.515 s cycles, 115,200 and 204,120 per hour, 1.77x; 960 verifier slots; pass@1 9.9 to 42.5, pass@256 67.2 to 64.3"
    example: "Napkin Math 17.6; DAPO; Yue et al. Table 3"
    read: "§17.8, §17.9"

