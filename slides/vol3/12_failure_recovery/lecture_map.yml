closing:
  return_to_hook: "Five Knight failures mapped to five mechanisms: the missed server and no review to checks before the pivot; no halt outside the router to a hold at each dispatch gate; the live rollback to recovery passing the same admission; no orders-out against orders-in comparison to a progress check outside the component; 97 ignored e-mails to a finding that becomes an enforced hold."
  read_and_practice: ["§12.2 to §12.9", "Checkpoints 12.1 to 12.5", "Exercises 1, 2, 6, 9"]
  further_reading:
    - cite: "Gray, The Transaction Concept: Virtues and Limitations, VLDB 1981"
      url: "https://jimgray.azurewebsites.net/papers/thetransactionconcept.pdf"
      why: "Why transactions break for long cross-organization work; compensation."
    - cite: "Garcia-Molina and Salem, Sagas, SIGMOD 1987"
      url: "https://doi.org/10.1145/38713.38742"
      why: "The saga and its recovery strategies."
    - cite: "Helland, Life Beyond Distributed Transactions, CIDR 2007"
      url: "https://www.cidrdb.org/cidr2007/papers/cidr07p15.pdf"
      why: "Agreement without distributed transactions: tentative operations, cancellation, idempotence."
    - cite: "Brooker, Timeouts, Retries, and Backoff with Jitter, Amazon Builders' Library, 2019"
      url: "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"
      why: "Layered retry amplification and jitter in practice."
    - cite: "Huang et al., Metastable Failures in the Wild, OSDI 2022"
      url: "https://www.usenix.org/conference/osdi22/presentation/huang-lexiang"
      why: "Measured incidents in which retries sustained outages."
  bridge: "Lecture 13 (Agent Evaluation): one run succeeded and every effect settled. Does the configuration work?"

