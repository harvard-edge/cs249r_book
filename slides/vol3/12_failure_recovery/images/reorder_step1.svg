<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395">
<rect width="900" height="395" fill="white"/>
<text x="215" y="28" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">First plan</text>
<rect x="40" y="44" width="350" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/><text x="215.0" y="79.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#b91c1c" text-anchor="middle" font-weight="bold">1  Publish artifact</text>
<rect x="40" y="116" width="350" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2.2"/><text x="215.0" y="151.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">2  Validate signature</text>
<rect x="40" y="188" width="350" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2.2"/><text x="215.0" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">3  Prepare notes</text>
<rect x="40" y="260" width="350" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/><text x="215.0" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#b91c1c" text-anchor="middle" font-weight="bold">4  Notify recipients</text>
<text x="215" y="350" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#b91c1c" text-anchor="middle">a failed check finds a public defect</text>
<g opacity="0"><text x="680" y="28" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">Reordered plan</text></g>
<g opacity="0"><rect x="470" y="44" width="410" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><text x="675.0" y="75.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#15803d" text-anchor="middle">1  Validate locally</text></g>
<g opacity="0"><rect x="470" y="106" width="410" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><text x="675.0" y="137.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#15803d" text-anchor="middle">2  Stage notes privately</text></g>
<g opacity="0"><rect x="470" y="168" width="410" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><text x="675.0" y="199.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#15803d" text-anchor="middle">3  Confirm approval; record duty</text></g>
<g opacity="0"><rect x="470" y="230" width="410" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/><text x="675.0" y="261.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#b91c1c" text-anchor="middle" font-weight="bold">4  Publish artifact</text></g>
<g opacity="0"><rect x="470" y="292" width="410" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/><text x="675.0" y="323.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#b45309" text-anchor="middle">5  Deliver notification</text></g>
<g opacity="0"><line x1="460" y1="226" x2="890" y2="226" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8,6"/></g>
<g opacity="0"><text x="675" y="382" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#15803d" text-anchor="middle">checks before the pivot; one pivot per region</text></g>
</svg>
