<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="aviolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="900" height="395" fill="white"/><rect x="15" y="10" width="250" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="140" y="40" font-size="22" fill="#b91c1c" text-anchor="middle" font-weight="bold">README</text><text x="140" y="68" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="normal">ι = {readme_7}</text><text x="140" y="94" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="normal">κ = every recipient</text><rect x="15" y="125" width="250" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="140" y="155" font-size="22" fill="#15803d" text-anchor="middle" font-weight="bold">Private fixture</text><text x="140" y="183" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="normal">ι = {fixture}</text><text x="140" y="209" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="normal">κ = {test runner}</text><text x="15" y="262" font-size="20" fill="#64748b" text-anchor="start" font-weight="normal">ι: sources that may have influenced it</text><text x="15" y="288" font-size="20" fill="#64748b" text-anchor="start" font-weight="normal">κ: recipients allowed to receive it</text><path d="M265,60 L312,105" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#agray)"/><path d="M265,175 L312,135" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#agray)"/><rect x="315" y="80" width="150" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="390.0" y="116.0" font-size="23" fill="#0f172a" text-anchor="middle" font-weight="bold">Planner</text><text x="390.0" y="142.0" font-size="20" fill="#0369a1" text-anchor="middle" font-weight="normal">saw both</text><path d="M465,120 L497,120" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#agray)"/><rect x="500" y="30" width="175" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="587" y="62" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">query x</text><text x="587" y="96" font-size="20" fill="#64748b" text-anchor="middle" font-weight="normal">ι = union:</text><text x="587" y="122" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="normal">readme_7, fixture</text><text x="587" y="156" font-size="20" fill="#64748b" text-anchor="middle" font-weight="normal">κ = intersection:</text><text x="587" y="182" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="normal">{test runner}</text><path d="M675,120 L697,120" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#aamber)"/><rect x="700" y="10" width="190" height="220" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/><text x="795" y="42" font-size="21" fill="#6d28d9" text-anchor="middle" font-weight="bold">Release check</text><text x="795" y="74" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="normal">recipient:</text><text x="795" y="100" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="normal">search endpoint</text><text x="795" y="132" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="bold">in κ(x)? no</text><rect x="715" y="158" width="160" height="54" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="795" y="192" font-size="20" fill="#b91c1c" text-anchor="middle" font-weight="bold">rejected</text><rect x="420" y="250" width="470" height="135" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/><text x="440" y="284" font-size="21" fill="#6d28d9" text-anchor="start" font-weight="bold">Evidence check: record a pass</text><text x="440" y="316" font-size="20" fill="#0f172a" text-anchor="start" font-weight="normal">accepts only: protected runner</text><text x="440" y="344" font-size="20" fill="#0f172a" text-anchor="start" font-weight="normal">ι(claim) = {readme_7}</text><text x="440" y="372" font-size="20" fill="#b91c1c" text-anchor="start" font-weight="bold">refused</text></svg>