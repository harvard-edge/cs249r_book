chapter: 09_security
lecture: "09"
title: "Agent Security"
layer: tools
locator: a
minutes: 75
notes_minutes: 70.5
core_minutes: 57.5
target_ideas: 30
thesis: "An agent can stay in its sandbox and call only permitted tools and still serve an attacker, so the runtime must track where each value came from and where it may go."

hook:
  minutes: "0-3.5"
  setup: "War Story 9.1 as real artifacts: the NVD record of CVE-2025-32711 (EchoLeak, CVSS 9.3, vector AV:N/AC:L/PR:N/UI:N) and the reference-style Markdown image reply that routed a secret through a teams.microsoft.com URL (Reddy and Gujral 2025, quoting Aim Labs). A build then shows the chain: attacker email, retrieval, model, reply, client fetch, attacker server, with the classifier, link redaction, and CSP allowlist each passing."
  question_to_class: "Which defense would have stopped the leak? A) a better injection classifier B) stricter link redaction C) a tighter domain allowlist D) a check on where data may go"
  payoff: "D. Each existing defense judged syntax or a channel. The synthesis places a release check on the reply: the reply joins the mailbox label, the image URL is a recipient outside it, so the fetch is rejected before it happens."
  sources:
    - "Agent Security, War Story 9.1 (§9.4.2)"
    - "https://nvd.nist.gov/vuln/detail/CVE-2025-32711 (retrieved 2026-10-19)"
    - "Reddy and Gujral, arXiv 2509.10540 (2025), Figs. 1 and 2 and Steps 3 to 4"

recall: "Close your notes: what does containment beneath the model limit (Lecture 8: what code can reach, through capability grants, egress control, credential brokering), and what can it not decide (what a permitted call carries to an allowed destination)?"

driving_question: "Why can an agent that stays inside its sandbox and calls only permitted tools still work for an attacker?"

goals:
  - "Compute how injection exposure grows with untrusted reads, and what screening changes."
  - "Separate permission to call a tool from permission for the data it carries."
  - "Propagate provenance and confidentiality labels and apply the release and evidence checks."
  - "Judge a defense by effects at the sink, benign utility, and cost per accepted task."

thread_tag: "H·S·A thread: closes the authority exposure"   # golden-thread line on the goals slide (sweep D4, 2026-10-19)
running_example: "The repair agent (Lighthouse 1.1 as the chapter uses it): a dependency README tells it to put a private test fixture in a package_search query (PRIVATE_CASE_EXAMPLE), and claims claimed_tests_passed: true about candidate r18. Shown as a real system once: CVE-2025-53773, where five comment lines in hello.c made GitHub Copilot's agent write .vscode/settings.json to auto-approve tools and run a command (Rehberger, Aug 2025)."

segments:
  - name: Injection
    divider_question: "Why can text in the data steer the agent?"
    read: "§9.2 and §9.4.2"
    concept_questions: [1, 2, 3, 4, 5]
    land: "The model cannot separate data from instructions, every read is a chance to meet a payload, and the decision belongs to a check on each outbound proposal."
    minutes: 11
  - name: Authority
    divider_question: "Who may do this, with this data, for this task?"
    read: "§9.3 and §9.7"
    concept_questions: [6, 7, 8, 9]
    land: "Authorization judges this request, its data, and its exact effect; the function name decides nothing."
    minutes: 10.5
  - name: Labels
    divider_question: "How does the runtime know where a value may go?"
    read: "§9.5 and §9.6"
    concept_questions: [10, 11, 12, 13]
    land: "Labels keep where a value came from and where it may go, and two set checks at dispatch decide."
    minutes: 11.5
  - name: Trajectory
    divider_question: "Does a blocked attack stay blocked over many turns?"
    read: "§9.8"
    concept_questions: [14, 15, 16]
    land: "Policy must hold across turns, memory, and shared caches as well as on each call."
    minutes: 9.5
  - name: Evaluation
    divider_question: "How do we know a defense works, and what does it cost?"
    read: "§9.9 and §9.10"
    concept_questions: [17, 18, 19, 20]
    land: "Score a defense at the sink over whole episodes, with benign utility, unresolved outcomes, and cost per accepted task."
    minutes: 15.5

concept_questions:
  - id: 1
    q: "Where did prompt injection come from, and why does the SQL fix not carry over?"
    picture: "Real screenshot: a remoteli.io bot publishing its instructions after a tweet (Sept 2022), with Simon Willison's photo."
    numbers: "Named 12 Sept 2022 (Willison)."
    example: "Direct injection from the interacting user."
    read: "§9.2.1, footnote 1"
  - id: 2
    q: "Why can the model not tell instructions from data?"
    picture: "seq_step1-3: one token sequence (redraw of §9.2.1 figure 1), model, proposed call, runtime check outside the model."
    numbers: "None."
    example: "README asks for package_search(fixture...)."
    read: "§9.2.1"
  - id: 3
    q: "What does indirect injection look like on a real coding agent?"
    picture: "Real artifact: hello.c comment lines 1 to 5 and the agent's action list (CVE-2025-53773)."
    numbers: "CVSS 7.8 (NVD)."
    example: "Agent wrote .vscode/settings.json with chat.tools.autoApprove and ran open -a Calculator."
    read: "§9.2.1 (Definition 9.1)"
  - id: 4
    q: "How often does a task meet a payload?"
    picture: "exp_step1-2: equation 1 against documents read; screened curve."
    numbers: "NM 9.1 (illustrative): 18.2% at 20 reads, 63.4% at 100; behind a 5% miss screen 1.0% and 4.9% (calcs.py)."
    example: "Repair vs research agent; Lighthouse 9.1 support 5.9%, remediation 9.6%."
    read: "§9.2.1"
  - id: 5
    q: "Which combination of capabilities makes an exfiltration path?"
    picture: "Willison's lethal trifecta slide image beside a table mapping EchoLeak and the repair agent onto the three legs."
    numbers: "None."
    example: "Mailbox, inbound email, image URL; fixture, README, package search."
    read: "§9.4.2"
  - id: 6
    q: "Whose authority does an injection borrow?"
    picture: "Book margin figure of Hardy's compiler (used as is) and a mapping table."
    numbers: "None."
    example: "Compiler writes BILL; runtime searches with the fixture."
    read: "§9.3"
  - id: 7
    q: "Which check rejects the fixture-bearing search?"
    picture: "checks_step1-2: four checks on the PRIVATE_CASE_EXAMPLE query; only the data-to-recipient check fails."
    numbers: "None."
    example: "Name, schema, egress allowlist pass; release fails."
    read: "§9.3.1, §9.4.1"
  - id: 8
    q: "What may an agent acting for a user actually do?"
    picture: "Book margin figure of the four-way intersection (used as is); RFC 8693 delegated token claims as a real artifact."
    numbers: "50 repositories held, 1 needed, 49 refused (calcs.py)."
    example: "Fifty-repository engineer; sub and act claims."
    read: "§9.7.1, §9.7.2"
  - id: 9
    q: "What exactly does a human approve?"
    picture: "approval_step1-3: canonical action fields, digest, recompute at dispatch, mismatch after r18 to r19."
    numbers: "None (digests illustrative)."
    example: "Patch submission for repair_42 at r18."
    read: "§9.7.3"
  - id: 10
    q: "What does a quarantined reader buy, and what does it not?"
    picture: "reader_step1-2: README, reader, adapter, admitted record with host metadata, planner, evidence check."
    numbers: "None."
    example: "claimed_tests_passed: true from readme_7 at doc_v3."
    read: "§9.5"
  - id: 11
    q: "How do labels combine through a transformation?"
    picture: "Dorothy Denning photo and equation 2 (union of sources, intersection of readers)."
    numbers: "None."
    example: "Planner that saw README and fixture."
    read: "§9.6.2"
  - id: 12
    q: "What do the release and evidence checks test?"
    picture: "labels_step1-3: redraw of §9.6.3 figure 4."
    numbers: "None."
    example: "Search rejected by release; README claim refused by evidence."
    read: "§9.6.3"
  - id: 13
    q: "Does control dependence or a handle get past the check?"
    picture: "Apply slide (Checkpoint 9.1) and the real output of the chapter's listing 2 run on four proposals."
    numbers: "None."
    example: "pkg-a vs pkg-b chosen by a fixture value; h_fixture handle."
    read: "§9.6.4"
  - id: 14
    q: "How does a blocked attack come back?"
    picture: "launder_step1-3: README note, summary, stored rule, later session; labels follow derivation."
    numbers: "None."
    example: "Upload rule laundered through consolidation."
    read: "§9.8.2, §9.8.3"
  - id: 15
    q: "What changes over many turns?"
    picture: "Equation 5 card plus oracle, momentum, obfuscation."
    numbers: "Illustrative: 2 reads per turn at 1% gives 2.0% per turn and 45.3% over 30 turns (calcs.py)."
    example: "Base64 retry after a block."
    read: "§9.8, §9.8.1"
  - id: 16
    q: "Can a shared cache leak without any prompt crossing a boundary?"
    picture: "Gu et al. Table 1 (real data); vLLM cache_salt code (real framework code) with an H100 photo."
    numbers: "Caching at 8 of 17 providers, global sharing at 7 (Gu et al. §4.2); modeled 83 ms miss vs 5 ms hit at 2,048 tokens (§9.8.4)."
    example: "OpenAI text-embedding-3-small global sharing."
    read: "§9.8.4"
  - id: 17
    q: "What counts as a successful attack?"
    picture: "ladder: proposal, block, dispatch, confirmed harm, no observed harm, unresolved."
    numbers: "None."
    example: "Ten-turn attack succeeding on turn ten is one compromised episode."
    read: "§9.9.1, §9.9.2"
  - id: 18
    q: "Does a more capable model resist injection, and what do defenses cost?"
    picture: "dojo_step1-2: AgentDojo published results (real data); AgentDojo defense source code."
    numbers: "Undefended 1% to 56%; Claude 3.5 Sonnet 34% vs 1% at 79% utility; GPT-4o 69%/48%, delimiters 72%/42%, detector 41%/8%, tool filter 72%/7%, repeat prompt 85%/28% (calcs.py)."
    example: "GPT-4o ablation."
    read: "§9.9.2"
  - id: 19
    q: "What does a release check buy and cost?"
    picture: "nm92 bars: disclosures with unresolved hatched; benign accepted."
    numbers: "NM 9.2 (illustrative): 75% observed reduction, 40% if unresolved count as harm; +12.5% cost per accepted benign repair; $2.33 vs $2.62 at $2.10 an attempt (calcs.py)."
    example: "Policy A vs B."
    read: "§9.9.2"
  - id: 20
    q: "What does zero observed successes prove?"
    picture: "zero_bound plot; fallacies as true or false."
    numbers: "0 of 50: 5.8%; 0 of 100: 3.0%; 299 clean episodes for 1% (calcs.py)."
    example: "Checkpoint 9.3."
    read: "§9.9.3, §9.10"

concept_trace:
  - concept: "Structural prompt injection"
    frame: "Instructions and data share one sequence with no enforced privilege"
    shows: "seq_step1-3 build: one token sequence, converging lines, runtime check outside the model"
  - concept: "Callable is not permitted"
    frame: "Vote: which check rejects the fixture search?"
    shows: "checks_step1-2: three interface checks pass, the data-to-recipient check fails"
  - concept: "Information-flow labels"
    frame: "Two labels drive two checks that fail independently"
    shows: "labels_step1-3: iota by union, kappa by intersection, release and evidence checks"
  - concept: "Quarantined readers"
    frame: "A quarantined reader returns a claim, and a claim is not evidence"
    shows: "reader_step1-2: quarantine, adapter, host metadata, evidence check refuses the claim"
  - concept: "Effective permission intersection"
    frame: "Effective permission is the intersection, never the union"
    shows: "Book four-way intersection figure, the equation, 49 of 50 repositories refused"
  - concept: "Action-bound approval"
    frame: "Approval binds to the exact action, and a changed action voids it"
    shows: "approval_step1-3: canonical action, digest, recompute at dispatch, mismatch voids"
  - concept: "Multi-turn policy continuity"
    frame: "Every turn is checked again; a reworded retry is the same action"
    shows: "Equation 5 card (45.3% over 30 turns) and the oracle, momentum, obfuscation panel; launder_step3 on the previous frame"
  - concept: "Security outcome measurement"
    frame: "A defense is scored at the sink, over whole episodes"
    shows: "ladder figure and the episode-denominator formula"
  - concept: "Lethal trifecta (secondary)"
    frame: "Private data, untrusted input, and egress make a leak"
    shows: "Willison's slide image and the two-case table"
  - concept: "Prefix-cache timing channel (secondary)"
    frame: "Seven API providers shared prompt caches across users"
    shows: "Gu et al. Table 1 and the modeled hit and miss times"
  - concept: "Detection vs separation (secondary)"
    frame: "Estimate: how often does a task meet a payload?"
    shows: "exp_step2 screened curve; returned in the AgentDojo plot and defense code"

worked_examples:
  - name: "Napkin Math 9.1: exposure from read volume"
    steps: ["f = 1%, repair n = 20, research n = 100", "1 - 0.99^20 = 18.2%", "1 - 0.99^100 = 63.4%", "screen missing 5%: f = 0.05%, 1.0% and 4.9%", "detection lowers the rate; it does not bound reach"]
  - name: "Checkpoint 9.1: control dependence and handles"
    steps: ["planner context: request, README, fixture", "iota = {user, readme_7, fixture}", "kappa = {test runner}", "search endpoint not in kappa: rejected", "handle joins object labels at dereference: rejected the same way"]
  - name: "Napkin Math 9.2: pricing a release check"
    steps: ["A 20 of 100 confirmed, B 5", "75% observed reduction; 25% vs 15% with unresolved, 40%", "benign acceptance 0.90 vs 0.80", "C_eff ratio 1.125: +12.5%", "$2.33 vs $2.62 at $2.10 an attempt (derived)"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "Predict: one email, no clicks. What failed?"
    answer: "D, a check on where data may go; the classifier, link redaction, and CSP allowlist each passed."
  - at_minute: 6.5
    type: retrieval
    prompt: "Recall: what does a sandbox leave open?"
    answer: "Containment bounds reach; an allowed destination accepts whatever a permitted call carries."
  - at_minute: 15
    type: estimate
    prompt: "Estimate: how often does a task meet a payload?"
    answer: "18.2% (repair), 63.4% (research); 1.0% and 4.9% behind a 5% miss screen."
  - at_minute: 22.5
    type: concept_question
    prompt: "Vote: which check rejects the fixture search?"
    answer: "D only: the query data may not reach the search endpoint."
  - at_minute: 36.5
    type: estimate
    prompt: "Apply: may a fixture-chosen search go?"
    answer: "iota {user, readme_7, fixture}, kappa {test runner}: rejected; a handle is rejected the same way."
  - at_minute: 42
    type: diagnose
    prompt: "Diagnose: the search was blocked. Why does it return?"
    answer: "A summary and a consolidated rule carried the instruction; labels follow derivation and retraction cascades."
  - at_minute: 57
    type: estimate
    prompt: "Estimate: what does policy B buy, and what does it cost?"
    answer: "75% observed, 40% with unresolved as harm; +12.5% cost per accepted benign repair."
  - at_minute: 63
    type: concept_question
    prompt: "Check: true or false? (five fallacies)"
    answer: "All false, each with the chapter's quantitative rebuttal."
  - at_minute: 65
    type: retrieval
    prompt: "Retrieval: which check stops EchoLeak?"
    answer: "The release check on the reply's image URL, using the mailbox label."

open_questions:
  - "The conservative label rule blocks a search after the planner sees any private data. How much utility does that cost, and which designs recover it?"
  - "Could a model be trained so that some token positions carry enforced privilege? What would count as evidence?"
  - "Who should own a release decision for data that belongs to several users at once?"

