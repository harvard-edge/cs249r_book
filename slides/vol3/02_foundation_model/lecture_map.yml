    why: "Shown as one bar in the admission build; detail better read."
  - concept: "Phase timing, TTFT and TPOT accounting (§2.8.1, equation 6)"
    why: "Lecture uses the per-token floors; the five-phase decomposition is read."
  - concept: "Learned formatting versus runtime masks (§2.7.3)"
    why: "One line in the mask notes; fine-tuning is Lecture 16's."

closing:
  return_to_hook: "Synthesis frame: status and schema show nothing for the 2025 bugs; a serving-configuration log, external tests, and recorded responses do."
  read_and_practice: ["§2.2 to §2.9", "Checkpoints 2.1 to 2.4", "Napkin Math 2.1 to 2.3 by hand", "Exercises 1, 4, 9", "images/run_model.py as a lab"]
  further_reading:
    - cite: "Birrell and Nelson, Implementing Remote Procedure Calls, 1984"
      url: "https://doi.org/10.1145/2080.357392"
      why: "Why a timeout leaves the remote outcome unknown."
    - cite: "Holtzman et al., The Curious Case of Neural Text Degeneration, ICLR 2020"
      url: "https://arxiv.org/abs/1904.09751"
      why: "Nucleus sampling."
    - cite: "Willard and Louf, Efficient Guided Generation for Large Language Models, 2023"
      url: "https://arxiv.org/abs/2307.09702"
      why: "Grammar masks compiled to automata."
    - cite: "Pope et al., Efficiently Scaling Transformer Inference, MLSys 2023"
      url: "https://arxiv.org/abs/2211.05102"
      why: "Prefill and decode floors."
    - cite: "Huang et al., Large Language Models Cannot Self-Correct Reasoning Yet, ICLR 2024"
      url: "https://arxiv.org/abs/2310.01798"
      why: "Measured self-correction without external evidence."
  bridge: "Lecture 3, Test-Time Compute: when is another token, candidate, check, or model call worth its cost?"

