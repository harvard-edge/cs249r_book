notes_for_author:
  - "images/run_model.py needs torch, transformers, and tiktoken (not in the book venv); it was run once and its output is data/model_runs.json. Laptop timings vary by load (ratio 25 to 41 across runs)."
  - "The 0.5B model invented a path instead of src/pool.py; the deck uses that as a real fail-plausible example and says a frontier model would more often name the right file."
  - "Lighthouse 2.1 states 3.2 s for the 150-token reply; calcs.py gives 3.16 s at 21.075 ms."
