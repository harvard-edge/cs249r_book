notes_for_author:
  - "The hook follows the course plan (NM 13.2); the chapter has no war story. Real data enters at frame 4 (tau-bench) and in every segment."
  - "The measured run uses a 7B local model on 12 small tasks; it illustrates the method, not agent capability. Its paired interval treats 96 run pairs as independent and is too narrow; the slide says so."
  - "METR states the RE-Bench rate as 30.4 percent; 39/128 computes to 30.5 percent. The slide quotes METR's stated percentages for the totals."
  - "NM 13.1 zero-gain count: 1,948 by the chapter's own formula; the chapter rounds it to about 1,900."
  - "Sweep 2026-10-19 (D3): the core frame 'o3 reward-hacked 30% of runs where scoring code was visible' was cut; Lecture 17 owns the METR data and opens with it. The grader-isolation note recalls it in one line and gains a minute matching each hack to the step that stops it; the SWE-bench git-log leak frame is now core and carries the segment's measured evidence. The note on METR's stated 30.4 percent no longer applies to this deck. images/metr.svg and metr.pdf are now unused (deckcheck unused-images)."
