chapter: 13_evaluation
lecture: "13"
title: Agent Evaluation
minutes: 75
notes_minutes: 70.0
core_minutes: 59.0
target_ideas: 30
layer: runtime
locator: hsa
previous: "Lecture 12: Failure Recovery"
next: "Lecture 14: Operating Agents"

thesis: >-
  A completed run is one draw from a stochastic process judged by a fallible
  grader, so a claim about a configuration needs a contract, a sealed
  environment, a calibrated grader, enough paired tasks, and its cost.

hook:
  minutes: "0-4"
  setup: >-
    A support agent answers one recurring question correctly on 90 percent of
    single runs. Students predict how often it is right on all 8 recurrences.
  question_to_class: "How often is it right on all 8 recurrences? A 90, B 70, C 43, D 10 percent."
  payoff: >-
    0.9^8 = 43 percent (NM 13.2); pass@8 is effectively 100 percent. The next
    frames show the gap measured: tau-bench (under 50 percent on one run, under
    25 percent pass^8, retail). The synthesis returns to the 43 percent as the
    sample row of what one completed run lacks.
  sources: ["Agent Evaluation, Napkin Math 13.2, §13.5.4", "Yao et al. 2024, arXiv 2406.12045, abstract"]

driving_question: "Why is a completed agent run not enough evidence that the configuration behind it works?"
thread_tag: "H·S·A thread: closes all three exposures"   # golden-thread line on the goals slide (sweep D4, 2026-10-19)

running_example: >-
  The repair agent's connection-pool repair (pool_repair_01): candidate_v2
  against baseline_v1, fresh trial artifact ws_r19 under repair_accept_v1 and
  pool_fixture_v1 (Example 13.1, table 4, NM 13.1). Beside it, a small real
  evaluation run for this lecture (images/data/eval_run.py, 2026-10-19):
  12 repair tasks (one is a connection pool), 8 runs per task, baseline_v1 =
  one call, candidate_v2 = one retry after a failed visible test, local
  qwen2.5 7B at temperature 0.8, sealed hidden tests in a separate
  interpreter. Results: 64.6 and 68.8 percent accepted; 91.7 percent pass the
  visible test; paired gain 4.2 points, interval -1.9 to 10.3; 348 against
  382 tokens per accepted task.

segments:
  - name: Acceptance
    minutes: "8-24"
    question: "What evidence credits one trial as an accepted task?"
    read: "§13.1, §13.2"
    land: "Acceptance is evidence on the exact artifact against declared criteria, and open verdicts stay counted."
  - name: The Gym
    minutes: "24-34.5"
    question: "How do we make trials comparable and keep the grader out of reach?"
    read: "§13.3"
    land: "Comparable trials need a pinned fixture, a full reset, a grader out of reach, and a suite nobody tuned on."
  - name: Graders
    minutes: "34.5-41.5"
    question: "How wrong is the grader, and how would we know?"
    read: "§13.4"
    land: "A grader is characterized against independent reference failures and recalibrated when anything it depends on changes."
  - name: Statistics
    minutes: "41.5-57.5"
    question: "How many tasks does a claim need, and how do we compare two configurations?"
    read: "§13.5.1 to §13.5.4"
    land: "Sample tasks, report intervals, pair the comparison, and let the deployment pick the quantifier."
  - name: Budget
    minutes: "57.5-64.5"
    question: "What did each accepted task cost?"
    read: "§13.5.5"
    land: "Compare policies on the same tasks, criteria, and envelope, and charge every failed attempt."

concept_questions:
  - q: "Does a score belong to a model or to a configuration?"
    picture: "Terminal-Bench 2.0 dot-range plot, 16 models across scaffolds"
    numbers: "claude-opus-4-6 58 to 80 percent over 11 scaffolds; median spread 14 points vs median SE 3 (MLSysIM Literature.TerminalBenchHarness; Merrill et al. 2026 via Epoch AI)"
    example: "candidate_v2 is declared in full: model, prompts, tools, harness"
    read: "§13.1"
  - q: "What evidence credits a trial as an accepted task?"
    picture: "four evidence dimensions, then the criteria and exposures they supply (build)"
    numbers: "none; definition 13.1 and table 1"
    example: "a repaired schema error vs a forbidden credential read"
    read: "§13.2.1"
  - q: "What happens to trials that time out or crash?"
    picture: "three bars: 60 percent reported, 75 percent upper bound, 70.6 percent if dropped"
    numbers: "100 trials, 60/25/15 (illustrative); rates from calcs.py"
    example: "SWE-bench grading.py: an empty test list returned 1; skipped FAIL_TO_PASS tests now count as failures (commit 02e7a74)"
    read: "§13.2.3"
  - q: "Does a passing check certify the task?"
    picture: "visible vs sealed pass rates from our run; a real BoundedPool submission"
    numbers: "11 of 12 buggy originals pass their visible test; 91.7 vs 64.6 percent; 26 of 88 visible passes fail sealed tests (measured)"
    example: "release() of a never-acquired connection does not raise"
    read: "§13.2.2 (coverage rule)"
  - q: "What makes a trial environment hermetic?"
    picture: "glovebox photo; fixture contents"
    numbers: "table 3 components"
    example: "pool_fixture_v1; a mock that always returns HTTP 200 cannot test recovery"
    read: "§13.3.1, §13.3.2"
  - q: "Where must the grader run?"
    picture: "sandbox and grading boundary, 3-step build"
    numbers: "Recall only, one line: METR's o3 hacked 39 of 128 runs that could see the scorer (Lecture 17 owns the data and opens with it; sweep D3, 2026-10-19)"
    example: "the three hacks (timer, evaluator, cached answer) matched to the build steps that stop them; the SWE-bench git-log leak is the measured evidence"
    read: "§13.3.3, §13.3.4"
  - q: "How does evaluation leak when the sandbox is clean?"
    picture: "SWE-bench issue #465 git log excerpt; ballot box photo"
    numbers: "none"
    example: "git log --all printed the reference fix in pytest-dev__pytest-6202"
    read: "§13.3.5"
  - q: "Which grader error rate answers which question?"
    picture: "2x2 confusion table with row and column highlights (build)"
    numbers: "false acceptance 16/80 = 20 percent (Wilson 12.7 to 30.0); failure among accepted 16/130 = 12.3 percent (exercise 3, hypothetical)"
    example: "judge B on 200 research-agent reports"
    read: "§13.4.2"
  - q: "Can two agreeing judges certify each other?"
    picture: "agreement matrix 81/9/9/1; Zheng et al. Table 2 bars"
    numbers: "90 percent pass each: 82 percent agreement, kappa 0; GPT-4 consistent 65.0 percent on order swap"
    example: "position bias of model judges"
    read: "§13.4.3"
  - q: "Should the budget buy new tasks or repeats?"
    picture: "standard error of 600-run designs, free and paid fixtures"
    numbers: "2.00/2.58/3.27 points; with a 10-run fixture cost, 40 tasks x 5 runs, 5.29 (exercise 1)"
    example: "the repair suite pilot"
    read: "§13.5.1"
  - q: "How wide is the interval, and do leaderboard ranks differ?"
    picture: "SWE-bench Verified top 25 with 95 percent intervals; Wald vs Wilson at 50 tasks"
    numbers: "24 of 24 neighbors tied; gap needed 5.4 points; 0 of 50 Wilson upper 7.13 percent"
    example: "a clean record of 50 tasks"
    read: "§13.5.2"
  - q: "How do we compare two configurations?"
    picture: "paired 2x2 table; worked steps"
    numbers: "4-point gain, interval -3.21 to 11.12, 217 pairs, 1,948 if gain zero, McNemar 0.362, paired variance 40 percent"
    example: "candidate_v2 against baseline_v1, and our measured pair"
    read: "§13.5.3"
  - q: "pass@k or pass^k?"
    picture: "our run's pass@k and pass^k curves; Lighthouse 13.1 table"
    numbers: "candidate pass@8 91.7, pass^8 50.0 percent (measured)"
    example: "support agent vs repair agent"
    read: "§13.5.4"
  - q: "What does each accepted task cost?"
    picture: "Kapoor et al. accuracy vs cost; batch vs sequential worked example; our token table"
    numbers: "LATS 88.0 percent at $134.50 vs warming 93.2 percent at $2.45 (55x); $0.153 vs $0.100; 348 vs 382 tokens"
    example: "NM 13.3"
    read: "§13.5.5"

concept_trace:
  - concept: Task acceptance contract
    frame: "An accepted task needs evidence in four dimensions"
    shows: "dims_step build: four evidence streams, then the criteria they supply; plus the verdicts frame and the Diagnose frame"
  - concept: Hermetic evaluation gym
    frame: "A hermetic gym declares what is provided, simulated, or blocked"
    shows: "glovebox photo and the fixture contents; reset in the gym_step build"
  - concept: Grader isolation
    frame: "Grader isolation keeps the grader outside the agent and its code"
    shows: "gym_step 3-step build: controller outside reach, limited candidate execution, verdicts bound to sha256(ws_r19); then the git-log leak frame, now core"
  - concept: Grader calibration
    frame: "False acceptance and failure among accepted are different rates"
    shows: "confusion_step build with row and column conditioning; kappa estimate frame"
  - concept: Task sampling and score intervals
    frame: "New tasks shrink both variance terms; repeats shrink one"
    shows: "designs plot; then ranks and Wilson frames"
  - concept: Paired comparison
    frame: "Exercise: does candidate_v2 clear a 2-point gate?"
    shows: "paired 2x2 table and worked noninferiority steps; measured pair frame"
  - concept: Matched-budget evaluation
    frame: "Measured: the costliest agent paid 55x for lower accuracy"
    shows: "Kapoor accuracy-cost plot; batch vs sequential estimate; token table"
  - concept: Contamination (secondary)
    frame: "The reference fix leaked through the sandbox's git history"
    shows: "real git log excerpt"
  - concept: Repeated-run consistency (secondary)
    frame: "Predict: how often does a 90% agent pass 8 times?"
    shows: "pass@k and pass^k curves; measured curves; Lighthouse 13.1 table"
  - concept: Coverage rule (secondary)
    frame: "Measured: 11 of 12 buggy functions pass their visible test"
    shows: "visible vs sealed bars and a real submission"

worked_examples:
  - name: "Example 13.1: can ws_r19 be accepted now?"
    steps: ["six required rows", "two rows pending, none failed", "verdict pending", "becomes fail on one failed regression, unknown at the cutoff"]
  - name: "Napkin Math 13.1: a paired gain and an inconclusive gate"
    steps: ["150 pairs, 18 vs 12 discordant", "gain 4 points", "method 10 interval -3.21 to 11.12", "gate -2 not met; held", "217 pairs if the gain holds; 1,948 if zero"]
  - name: "Napkin Math 13.3: batch vs sequential"
    steps: ["p 0.4, cap 3, $0.03 + $0.01", "availability 78.4 percent", "batch $0.12, sequential $0.0784 per trial", "$0.153 vs $0.100 per accepted task", "sequential cost is (g + c)/p for any cap"]
  - name: "Our measured paired comparison"
    steps: ["96 run pairs", "60/6/2/28", "gain 4.2 points, interval -1.9 to 10.3", "runs of one task are clustered, so the interval is too narrow"]

active_learning:
  - at_minute: 1
    type: predict
    prompt: "How often is a 90 percent agent right on all 8 recurrences?"
    answer: "About 43 percent (0.9^8); 98.7 percent per run holds 90 percent."
  - at_minute: 5
    type: retrieval
    prompt: "What does compensation undo, and what does a durable record not do?"
    answer: "Reverses completed effects in dependency order; a log does not change the world."
  - at_minute: 18
    type: diagnose
    prompt: "Can trial ws_r19 be accepted now? (Example 13.1)"
    answer: "Neither: pending; unknown at the cutoff; fail on one failed regression."
  - at_minute: 31
    type: concept_question
    prompt: "Which suite still leaks after a clean reset?"
    answer: "D: read-only hidden tests can be read; a held-out suite used for tuning leaks through the team."
  - at_minute: 38.5
    type: estimate
    prompt: "Two judges each pass 90 percent at random: agreement and kappa?"
    answer: "82 percent agreement, kappa 0."
  - at_minute: 48.5
    type: estimate
    prompt: "Does candidate_v2 clear a 2-point noninferiority gate? (NM 13.1)"
    answer: "No: -3.21 < -2; about 217 pairs if the gain holds."
  - at_minute: 59.5
    type: estimate
    prompt: "Batch or sequential at the same cap? (NM 13.3)"
    answer: "$0.153 vs $0.100 per accepted task; 53 percent premium."
  - at_minute: 65.5
    type: retrieval
    prompt: "Name five things a single completed run lacks."
    answer: "criteria, clean evidence, a trusted grader, a sample, a price"

fallacies:
  - "90 percent of runs means reliable: hook and Lighthouse 13.1 frame"
  - "Comparing by overlap of separate intervals: ranks frame and paired exercise"
  - "An isolated grader that agrees with a second judge is correct: kappa estimate"
  - "Tuning on the held-out suite: concept question on leakage"
  - "The higher-accuracy configuration is better: Kapoor frame and batch estimate"

open_questions:
  - "How many expert labels does calibrating a model judge need, and how often, as the judge and agents change?"
  - "Can a shared benchmark stay valid when public data leaks into training within months?"
  - "How should an evaluation score a correct result reached by an unsafe path the contract did not name?"

more_examples:
