  - cite: "Kapoor et al., AI Agents That Matter, 2024"
    url: "https://arxiv.org/abs/2407.01502"
    why: "cost beside accuracy; holdout levels for agent benchmarks."
  - cite: "Zheng et al., Judging LLM-as-a-Judge, NeurIPS 2023"
