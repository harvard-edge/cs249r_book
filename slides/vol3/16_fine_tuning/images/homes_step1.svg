<g opacity="0"><text x="450" y="324" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7c3aed" text-anchor="middle" font-weight="bold">Fine-tuning changes only the first column:</text></g>
<g opacity="0"><text x="450" y="362" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#0f172a" text-anchor="middle">what the model proposes, not what the runtime permits</text></g>
