<text x="152" y="246" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0f172a" text-anchor="middle">read schema after refusal</text>
<g opacity="0"><rect x="312" y="20" width="276" height="116" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.4"/><text x="450.0" y="73.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#6d28d9" text-anchor="middle" font-weight="bold">Context</text><text x="450.0" y="101.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e293b" text-anchor="middle">per-deployment facts</text></g>
<g opacity="0"><text x="450" y="180" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" font-weight="bold">Repair agent:</text></g>
<g opacity="0"><text x="450" y="214" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0f172a" text-anchor="middle">tool schemas</text></g>
<g opacity="0"><text x="450" y="246" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0f172a" text-anchor="middle">permissions, observations</text></g>
<g opacity="0"><rect x="610" y="20" width="276" height="116" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/><text x="748.0" y="73.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#15803d" text-anchor="middle" font-weight="bold">Runtime</text><text x="748.0" y="101.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e293b" text-anchor="middle">invariants that hold</text></g>
<g opacity="0"><text x="748" y="180" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#64748b" text-anchor="middle" font-weight="bold">Repair agent:</text></g>
