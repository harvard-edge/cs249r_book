<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="aviolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#fca5a5" stroke-width="4"/></pattern></defs><rect x="0" y="0" width="900" height="350" fill="white"/><text x="10" y="52" font-size="22" fill="#0f172a" text-anchor="start" font-weight="bold" opacity="1.0">State</text><text x="10" y="128" font-size="22" fill="#0f172a" text-anchor="start" font-weight="bold" opacity="1.0">Model</text><line x1="160" y1="120" x2="890" y2="120" stroke="#cbd5e1" stroke-width="3"/><text x="10" y="204" font-size="22" fill="#0f172a" text-anchor="start" font-weight="bold" opacity="1.0">Test job</text><line x1="160" y1="196" x2="890" y2="196" stroke="#cbd5e1" stroke-width="3"/><text x="10" y="270" font-size="22" fill="#0f172a" text-anchor="start" font-weight="bold" opacity="1.0">Operator</text><line x1="160" y1="262" x2="890" y2="262" stroke="#cbd5e1" stroke-width="3"/><rect x="150" y="20" width="90" height="48" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2" opacity="1.0"/><text x="195.0" y="52" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold" opacity="1.0">READY</text><rect x="240" y="20" width="225" height="48" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" opacity="1.0"/><text x="352.5" y="52" font-size="22" fill="#0369a1" text-anchor="middle" font-weight="bold" opacity="1.0">CALLING_MODEL</text><rect x="465" y="20" width="205" height="48" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" opacity="1.0"/><text x="567.5" y="52" font-size="22" fill="#b45309" text-anchor="middle" font-weight="bold" opacity="1.0">WAITING_TOOL</text><rect x="670" y="20" width="14" height="48" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2" opacity="1.0"/><rect x="684" y="20" width="116" height="48" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" opacity="1.0"/><text x="742.0" y="52" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold" opacity="1.0">PAUSED</text><rect x="800" y="20" width="90" height="48" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2" opacity="1.0"/><text x="845.0" y="52" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold" opacity="1.0">READY</text><circle cx="240" cy="90" r="15" fill="#7c3aed"/><text x="240" y="97" font-size="22" fill="white" text-anchor="middle" font-weight="bold" opacity="1.0">1</text><rect x="240" y="108" width="225" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" opacity="1.0"/><text x="252" y="160" font-size="22" fill="#0369a1" text-anchor="start" font-weight="normal" opacity="1.0">reserve, then send</text><circle cx="465" cy="90" r="15" fill="#7c3aed"/><text x="465" y="97" font-size="22" fill="white" text-anchor="middle" font-weight="bold" opacity="1.0">2</text><rect x="465" y="184" width="295" height="24" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" opacity="1.0"/><text x="475" y="234" font-size="22" fill="#b45309" text-anchor="start" font-weight="normal" opacity="1.0">reserve, register,</text><text x="475" y="258" font-size="22" fill="#b45309" text-anchor="start" font-weight="normal" opacity="1.0">then send the test</text><circle cx="610" cy="290" r="15" fill="#dc2626"/><text x="610" y="297" font-size="22" fill="white" text-anchor="middle" font-weight="bold" opacity="1.0">3</text><text x="600" y="320" font-size="22" fill="#b91c1c" text-anchor="end" font-weight="normal" opacity="1.0">pause: stop admitting,</text><text x="600" y="344" font-size="22" fill="#b91c1c" text-anchor="end" font-weight="normal" opacity="1.0">keep owning the test</text><circle cx="760" cy="196" r="15" fill="#16a34a"/><text x="760" y="203" font-size="22" fill="white" text-anchor="middle" font-weight="bold" opacity="1.0">4</text><text x="886" y="150" font-size="22" fill="#15803d" text-anchor="end" font-weight="normal" opacity="1.0">result settles its charge;</text><text x="886" y="174" font-size="22" fill="#15803d" text-anchor="end" font-weight="normal" opacity="1.0">the turn stays paused</text><circle cx="800" cy="290" r="15" fill="#7c3aed"/><text x="800" y="297" font-size="22" fill="white" text-anchor="middle" font-weight="bold" opacity="1.0">5</text><text x="886" y="320" font-size="22" fill="#6d28d9" text-anchor="end" font-weight="normal" opacity="1.0">resume:</text><text x="886" y="344" font-size="22" fill="#6d28d9" text-anchor="end" font-weight="normal" opacity="1.0">recheck all</text></svg>