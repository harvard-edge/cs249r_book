closing:
  return_to_hook: "Four failures of the incident mapped to the freeze flag at admission, turn-boundary control, the operation table, and guards that hold on every turn."
  read_and_practice: ["§10.2 to §10.9", "Checkpoints 10.1 to 10.3", "Napkin Math 10.1 to 10.3", "Exercises 1 and 2"]
  further_reading:
    - cite: "Harel, Statecharts: A Visual Formalism for Complex Systems, 1987"
      url: "https://doi.org/10.1016/0167-6423(87)90035-9"
      why: "Guards on transitions."
    - cite: "Hoare, Monitors: An Operating System Structuring Concept, 1974"
      url: "https://doi.org/10.1145/355620.361161"
      why: "The record lock as a monitor."
    - cite: "O'Neil, The Escrow Transactional Method, 1986"
      url: "https://doi.org/10.1145/7239.7265"
      why: "Reservation against an invariant, ancestor of bounded-liability admission."
    - cite: "Shreedhar and Varghese, Efficient Fair Queuing Using Deficit Round Robin, 1995"
      url: "https://doi.org/10.1145/217382.217453"
      why: "Fair sharing with carried credit."
    - cite: "Bainbridge, Ironies of Automation, 1983"
      url: "https://doi.org/10.1016/0005-1098(83)90046-8"
      why: "Why human monitoring degrades; approval fatigue."
  bridge: "Next lecture (Durable Execution): the host crashes after the test is sent. What does the runtime know when it restarts?"

