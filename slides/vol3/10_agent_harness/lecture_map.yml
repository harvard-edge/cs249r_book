chapter: 10_agent_harness
lecture: "10"
title: "The Agent Harness"
subtitle: "The software that decides whether an agent continues"
layer: runtime
locator: h
minutes: 75
notes_minutes: 71.5
core_minutes: 59
target_ideas: 30
thesis: "A deterministic harness outside the model decides whether a trajectory continues, because it owns the trajectory record, its state transitions, its approvals, and its budgets."

hook:
  minutes: "0.5-4"
  setup: "War Story 10.1, shown as the real artifact: the agent's own reply, posted by Jason Lemkin on X on 18 July 2025, admitting it deleted the production database during a code and action freeze stated only in its instructions."
  question_to_class: "Which control would have stopped it? A) state the freeze in the prompt more often B) a model that keeps the rule on 99% of turns C) a rule checked at dispatch, outside the model D) a database snapshot"
  payoff: "C. The synthesis maps each failure in the incident (prompt-only freeze, a stop after dispatch, a false rollback claim, per-turn compliance) to a harness mechanism: a freeze flag checked at admission turns the deletion into a refusal observation."
  sources:
    - "The Agent Harness, War Story 10.1 (§10.7)"
    - "https://x.com/jasonlk/status/1946069562723897802"
    - "https://www.theregister.com/2025/07/21/replit_saastr_vibe_coding_incident/"

recall: "Close your notes: what does a model call return (Lecture 2: a proposal checked against its invocation contract), and may a timed-out call be retried (Lecture 7: settle before retry)?"

driving_question: "Why must the decision to continue an agent live outside the model that proposes its next step?"

goals:
  - "Explain why a rule the model keeps on almost every turn still fails across a run."
  - "Trace a turn through the trajectory record, guarded state changes, and a late result."
  - "Bound how long a pause waits, and hold an approval without dispatching it."
  - "Admit a call by its bounded liability, and choose a ceiling from real runs."

thread_tag: "H·S·A thread: closes the horizon exposure"   # golden-thread line on the goals slide (sweep D4, 2026-10-19)
running_example: "The repair agent (Lighthouse 1.1 as the chapter uses it) at candidate patch r18: a test of r18 is running, an operator pauses, the result arrives late, a review submission is held, the budget nears its ceiling. Shown as a real system through public mini-SWE-agent trajectories on SWE-bench Verified: its agent loop source (v2.1.0) and one saved run (django__django-16263, Claude Opus 4.6) that checked a $3.00 limit and stopped at $3.29."

segments:
  - name: Continuation
    divider_question: "Who decides whether the agent takes another step?"
    read: "§10.1 and §10.2"
    concept_questions: [1, 2, 3, 4]
    land: "The decision to continue is a runtime decision, made from a record, at every step."
    minutes: 11
  - name: Record
    divider_question: "What does the harness decide from, and how may it change?"
    read: "§10.3 and §10.4"
    concept_questions: [5, 6, 7, 8]
    land: "One record, written only by the harness, changed only along guarded edges, and every effect keeps an owner until evidence settles it."
    minutes: 14
  - name: Control
    divider_question: "How fast can an operator stop a run, and how is a sensitive action held?"
    read: "§10.5 to §10.7"
    concept_questions: [9, 10, 11, 12]
    land: "Control takes effect at turn boundaries, streaming cancellation removes the wait, and an approval is a held proposal that dispatch rechecks."
    minutes: 14.5
  - name: Budgets
    divider_question: "How much may one trajectory consume, and who decides?"
    read: "§10.8 and §10.9"
    concept_questions: [13, 14, 15, 16]
    land: "A budget is an admission decision, made by reserving each operation's worst case before it runs, and its ceiling is chosen by cost per accepted task."
    minutes: 17

concept_questions:
  - id: 1
    q: "How often does a rule the model keeps on 99% of turns hold over a whole run?"
    picture: "compound_step1-2: 0.99^H with the 30-turn point and the measured band of median calls."
    numbers: "0.99^30 = 0.74 (derived, eq. 1.1); median calls 23 to 64 across five public SWE-bench Verified configurations (MLSysIM); 0.99^64 = 0.53 (derived)."
    example: "A freeze or budget instruction in the prompt."
    read: "§10.1, §10.10"
  - id: 2
    q: "What does a real agent loop do with a proposed command?"
    picture: "Real code: mini-SWE-agent default.py v2.1.0 (the version the 2026 trajectories record as mini_version, although their submission folder is named mini-v2.0.0; Lecture 1's 2025 cohort used v1.0.0), step() and execute_actions()."
    numbers: "None."
    example: "Every proposed command runs in a fresh shell; no pause, grant, or approval point."
    read: "§10.2.1"
  - id: 3
    q: "What is a harness, and what does it own that the loop lacks?"
    picture: "harness_step1-2: prototype loop vs. the same loop inside a harness (redraw of figure 1)."
    numbers: "None."
    example: "Pause, spend ceiling, and approval land on the harness record; the message list carries none of them."
    read: "§10.2, Definition 10.1"
  - id: 4
    q: "What happens in one supervised turn, and does a result during a pause restart the model?"
    picture: "turn_step1-4: the r18 turn as a timeline (table 1)."
    numbers: "None."
    example: "Reserve then send; reserve, register, send the test; pause; result settles; resume rechecks."
    read: "§10.2.2"
  - id: 5
    q: "What does the harness decide from?"
    picture: "Real saved trajectory info block (two counters, 167 messages) beside the record's eight field groups."
    numbers: "instance_cost 3.2862315, api_calls 80, exit LimitsExceeded (the saved run)."
    example: "Is a test of r18 still running, and what may it still bill?"
    read: "§10.3, Definition 10.2, table 2"
  - id: 6
    q: "How does the trajectory move between states?"
    picture: "Lever frame photo (interlocking), then states_step1-3 (figure 2 redrawn)."
    numbers: "Five live states, FINALIZING, three absorbing outcomes."
    example: "Pause only from READY; every exit through FINALIZING."
    read: "§10.4, table 3"
  - id: 7
    q: "What stops two schedulers from admitting the same call?"
    picture: "Listing 1 (simplified) beside a photo of C. A. R. Hoare."
    numbers: "record_version 41."
    example: "The seen_version check rejects the loser before it reserves or sends."
    read: "§10.4.1"
  - id: 8
    q: "Where does a late result go?"
    picture: "late_step1-3: settlement in the operation table vs. epoch-fenced staging."
    numbers: "Epoch 7 vs. 8."
    example: "The r18 test passes after the wait deadline."
    read: "§10.3 (settlement rule), §10.4.2"
  - id: 9
    q: "How long does a pause wait for a call in flight, and what removes the wait?"
    picture: "pause_step1-3: measured wait vs. output allowance, chapter reference line, measured cancel."
    numbers: "Measured: 71.7 s mean at 4,096 tokens (70.0 to 72.6), cancel within 21 ms, next call within 0.12 s (qwen2.5 7B Q4, Ollama, Apple M5 Max). Chapter: 4,096 x 21.075 ms = 86.3 s (derived)."
    example: "The operator's pause during the test of r18."
    read: "§10.5.1"
  - id: 10
    q: "How do pause, cancel, kill, and budget stop differ?"
    picture: "Table 6 (trimmed) beside the hook's 'Stop ... already too late' screenshot."
    numbers: "None."
    example: "A stop after dispatch cannot recall the effect."
    read: "§10.5.2, §10.5.3"
  - id: 11
    q: "How is a sensitive action held, and what makes the approval binding?"
    picture: "escrow_step1-3: what the reviewer approves, the gate, recheck at dispatch (figure 3 redrawn)."
    numbers: "None."
    example: "submit_review(r18 patch, named checks)."
    read: "§10.7, Definition 10.3"
  - id: 12
    q: "What does an approval queue hold?"
    picture: "Worked estimate (Little's law) and the TMI-2 control room photo for monitoring fatigue."
    numbers: "6/h x 2 h = 12 held, 6 GiB; remediation 0.5 held, approval 15 of 30 min (Lighthouse 10.1, illustrative; derived)."
    example: "Repair review vs. remediation on-call approval."
    read: "§10.7, Lighthouse 10.1"
  - id: 13
    q: "How are model calls shared among trajectories?"
    picture: "drr_step1-2: charge share vs. call share."
    numbers: "75% of charge, 98% of calls, 9.6 vs. one per 5.25 rounds (NM 10.1, illustrative; simulated)."
    example: "Interactive vs. maintenance class."
    read: "§10.8"
  - id: 14
    q: "What stops a runaway loop that passes every per-call check?"
    picture: "runaway_step1-3: the loop, the budget vector, steer/restrict/finalize."
    numbers: "Used fractions 75/45/51/14% (NM 10.3, illustrative)."
    example: "A failing patch retried with variants."
    read: "§10.9.1, §10.9.4"
  - id: 15
    q: "Why is a check of settled spend not a budget?"
    picture: "Real overshoot plot and real limit-check code; then admit_step1-2 (NM 10.2)."
    numbers: "Real: $2.995 before call 80, $3.29 final, 9.5% over; 8 of 500 runs over $3.00. NM 10.2: $0.92 vs. $0.12 headroom, $0.21 liability, $0.09 short (derived)."
    example: "The next model call of the repair trajectory."
    read: "§10.9.2, Definition 10.4, equations 1 and 2"
  - id: 16
    q: "How is a ceiling chosen?"
    picture: "Meter bars (NM 10.3), measured CDF and halt shares (figure 5 data), OSWorld step ceilings (figure 6 data)."
    numbers: "p90 ceiling halts 15 to 31% of failures, at most 10% of successes; ceilings 46 to 101 calls; OSWorld: 3 of 5 flat from 50 to 100 steps, best gain 20 points."
    example: "mini-SWE-agent with Claude Opus 4.6: ceiling 46 calls, $0.73 per accepted task (derived)."
    read: "§10.9.3, §10.9.5"

concept_trace:
  - concept: "Harness owns continuation"
    frames: ["A rule kept on 99% of turns fails in 26% of 30-turn runs", "The harness decides what runs; the model only proposes"]
    shows: "compound_step1-2 (0.99^H with measured horizons); harness_step1-2 (loop vs. harness)"
  - concept: "Trajectory record"
    frame: "The trajectory record holds what a transcript cannot"
    shows: "Real saved trajectory info block beside record_fields (eight field groups)"
  - concept: "Guarded transitions"
    frames: ["The trajectory moves only along guarded edges", "Diagnose: two schedulers admit at version 41"]
    shows: "states_step1-3; listing 1 with the seen_version check highlighted (register before send)"
  - concept: "Settlement rule"
    frame: "A late result settles its charge but cannot enter the turn"
    shows: "late_step1-3: every authentic result settles in the operation table; only a current epoch is staged"
  - concept: "Turn-boundary control"
    frame: "A pause waited 72 s for the reply and 21 ms with a cancel"
    shows: "pause_step1-3: measured wait grows with the output allowance; K_max x t_dec reference; streaming cancellation"
  - concept: "Approval escrow"
    frame: "Escrow holds the exact proposal until dispatch rechecks it"
    shows: "escrow_step1-3: digest-bound held proposal, gate, recheck at dispatch"
  - concept: "Bounded-liability admission"
    frame: "Estimate: may the harness admit this call?"
    shows: "admit_step1-2: spend check vs. admission test bars, liability $0.21 vs. headroom $0.12"
  - concept: "Trajectory budget vector"
    frame: "A runaway loop passes every check made on a single call"
    shows: "runaway_step1-3: loop, four-meter budget vector with largest used fraction, steer/restrict/finalize"

worked_examples:
  - name: "Napkin Math 10.2: a call the spend check admits"
    steps: ["Given $3.50 allowance, $2.58 settled, $0.50 test reservation, $0.30 final reserve; 50,000 in, 4,096 out at $3/$15 per M", "Liability 0.15 + 0.06 = $0.21", "Spend check headroom $0.92", "Admission headroom $0.12", "Refused; admitting leaves the final checks $0.09 short; fits only below about 19,500 input tokens"]
  - name: "Lighthouse 10.1: memory held in escrow"
    steps: ["6/h, 2 h, 512 MiB", "Little's law: 12 held", "6 GiB retained", "Remediation: 0.5 held, approval 50% of 30 min", "Halving review time halves repair memory, removes 7.5 min"]
  - name: "Measured pause latency (outside the chapter)"
    steps: ["Pause 0.1 s after send", "Wait for reply: 3.4 s at 256 tokens to 71.7 s at 4,096", "Chapter reference 86.3 s at 21.075 ms/token", "Cancel the stream: at most 21 ms", "Control latency no longer depends on output length"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "Which control would have stopped the deletion?"
    answer: "C, a rule checked at dispatch; a snapshot repairs after the fact, prompts and per-turn compliance decay over a run."
  - at_minute: 4
    type: retrieval
    prompt: "What does a model call return? May a timed-out call be retried?"
    answer: "A proposal checked against its invocation contract; settle before retry."
  - at_minute: 16
    type: predict
    prompt: "The test of r18 passes during the pause. Does the result restart the model?"
    answer: "No; it settles its charge; only a resume after a fresh check admits the next call."
  - at_minute: 26
    type: diagnose
    prompt: "Two schedulers read record_version 41 and both try to admit a call."
    answer: "The seen_version check rejects the loser; it has reserved nothing and sent nothing."
  - at_minute: 37.5
    type: concept_question
    prompt: "Which reply may the harness dispatch?"
    answer: "Only a COMPLETED reply, validated and admitted now; canceled, withdrawn, or late payloads are diagnostic only."
  - at_minute: 43
    type: estimate
    prompt: "How much memory waits in escrow?"
    answer: "12 held, 6 GiB; remediation 0.5 held, approval half of the 30-minute time to mitigate."
  - at_minute: 55
    type: estimate
    prompt: "May the harness admit this call?"
    answer: "No: liability $0.21 against $0.12 of headroom after reservations."
  - at_minute: 64
    type: retrieval
    prompt: "Name the two checks the harness runs, and apply each to the hook."
    answer: "Before work: do controls, grants, capacity, and reserved budget admit it? After: has evidence settled it, and who owns it?"

open_questions:
  - "What evidence would let a harness stop a stalled run earlier without halting runs about to succeed?"
  - "Which actions deserve a human reviewer, and how would a team measure whether review still works?"
  - "Should a harness refuse, wrap, or accept a declared overshoot for paid tools with no enforceable cost ceiling?"

