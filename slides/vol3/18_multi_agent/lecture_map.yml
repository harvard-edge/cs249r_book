active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "Did 15 times the tokens pay? A) always B) never C) only on tasks one agent usually fails"
    answer: "C; break-even needs single-agent success at most 26.7%."
  - at_minute: 4
    type: retrieval
    prompt: "What share of rewards go to failures (RL NM 17.1)?"
    answer: "18.4%."
  - at_minute: 12.5
    type: estimate
    prompt: "p = 0.9, c = 0.02: halve c or halve the serial work?"
    answer: "Now 7 workers, 2.87x, ceiling 10x; halve c: 9 workers, 3.57x; halve serial: 7 workers, 3.27x, ceiling 20x."
  - at_minute: 26
    type: diagnose
    prompt: "Cut v6 or v5 by 20 s?"
    answer: "v5: 174.5 to 154.5 s; v6 has 26.5 s of slack."
  - at_minute: 35.5
    type: predict
    prompt: "Different files, no merge conflict. Safe?"
    answer: "No; the caller still calls foo(a). A clean merge does not make the change valid."
  - at_minute: 49.5
    type: concept_question
    prompt: "Ten more reviewers, one protected test, or unanimity?"
    answer: "One protected test; ten more move 16.68% toward the 15.0% floor; unanimity still 3.92%."
  - at_minute: 52.5
    type: concept_question
    prompt: "True or false: if each worker is on time 90%, a fan-out of 8 usually is."
    answer: "False: 43.05%; a 6-of-8 rule gives 96.19% only for interchangeable results."
  - at_minute: 61.5
    type: estimate
    prompt: "Three children ask $20 each from a $50 balance with a $5 reserve and $6 open work."
    answer: "$39 available; $60 copied liability; first admitted, others refused; $13 each fits."
  - at_minute: 63.5
    type: retrieval
    prompt: "Name today's control for three MAST failure modes."
    answer: "Typed envelope; completion contract and budgets; protected check of the exact candidate."

open_questions:
  - "Reviewer correlation must be measured on known-invalid candidates. Where does a team get enough of them for its own code?"
  - "Agents can talk in shared chats or pass typed receipts. When is the richer channel worth its quadratic cost?"
  - "As models improve, does a single controller with parallel tools make most delegation unnecessary?"

more_examples:
  - "Anthropic multi-agent research system: 4x and 15x tokens, 90.2% on an internal evaluation, 50 subagents for simple queries, token usage explains 80% of BrowseComp variance (Hadfield et al. 2025)."
  - "AutoGen 0.2 GroupChatManager broadcast loop (microsoft/autogen, commit c631b34)."
  - "Erlang/OTP supervisor strategies and restart intensity (OTP documentation)."
  - "git worktree and git update-ref compare-and-swap (git-scm.com)."
  - "Space Shuttle: four GPCs in a redundant set, BFS independently programmed by Rockwell (Spector and Gifford 1984; Tomayko 1988)."
  - "Kim et al. 2025: models agree on about 60% of shared errors on Helm."
  - "Dean and Barroso 2013: 10 ms against 140 ms 99th-percentile fan-out; hedging 1,800 to 74 ms for 2% more requests."
  - "Cemri et al. 2025 (MAST): 1,642 traces, 14 failure modes, design 44.2%, misalignment 32.3%, verification 23.5%."
  - "Knight and Leveson 1986: 27 independent versions failed coincidentally far more than independence allowed (note only)."

