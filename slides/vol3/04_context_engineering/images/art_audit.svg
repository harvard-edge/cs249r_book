<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 327" width="900" height="327"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="2"/></pattern></defs><rect width="900" height="327" fill="white"/>
<rect x="2" y="2" width="896" height="323" rx="10" fill="#0f172a" stroke="none" stroke-width="2" opacity="1"/>
<rect x="2" y="2" width="896" height="38" rx="10" fill="#1e293b" stroke="none" stroke-width="2" opacity="1"/>
<rect x="2" y="26" width="896" height="14" rx="0" fill="#1e293b" stroke="none" stroke-width="2" opacity="1"/>
<text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#cbd5e1" text-anchor="start" font-weight="bold" xml:space="preserve">Listing 2 (CE §4.6.2), condensed: every compared value comes from the host</text>
<text x="20" y="69.56" font-family="Courier, monospace" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="normal" xml:space="preserve">def audit_record(record, inventory, events, workspace):</text>
<text x="20" y="95.12" font-family="Courier, monospace" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="normal" xml:space="preserve">    found = []</text>
<rect x="10" y="103.67999999999999" width="880" height="25.56" rx="3" fill="#16a34a" stroke="none" stroke-width="2" opacity="0.35"/>
<text x="20" y="120.67999999999999" font-family="Courier, monospace" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="normal" xml:space="preserve">    for f in inventory.required_fields():             # 1. contract</text>
<text x="20" y="146.24" font-family="Courier, monospace" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="normal" xml:space="preserve">        if record.value_of(f.name) != f.value: found.append(f)</text>
<text x="20" y="171.8" font-family="Courier, monospace" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="normal" xml:space="preserve">    for c in (*record.milestones, *record.current_claims):</text>
<rect x="10" y="180.35999999999999" width="880" height="25.56" rx="3" fill="#16a34a" stroke="none" stroke-width="2" opacity="0.35"/>
<text x="20" y="197.35999999999999" font-family="Courier, monospace" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="normal" xml:space="preserve">        e = events.get(c.event_id)                    # 2. event log</text>
<text x="20" y="222.92" font-family="Courier, monospace" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="normal" xml:space="preserve">        if e is None or c.facts() != e.facts(): found.append(c)</text>
<rect x="10" y="231.48" width="880" height="25.56" rx="3" fill="#16a34a" stroke="none" stroke-width="2" opacity="0.35"/>
<text x="20" y="248.48" font-family="Courier, monospace" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="normal" xml:space="preserve">    for c in record.current_claims:                   # 3. version</text>
<text x="20" y="274.03999999999996" font-family="Courier, monospace" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="normal" xml:space="preserve">        if c.version != workspace.version_of(c.artifact): found.append(c)</text>
<text x="20" y="299.6" font-family="Courier, monospace" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="normal" xml:space="preserve">    return found</text>
</svg>
