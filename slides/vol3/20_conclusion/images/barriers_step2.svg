<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0284c7"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0f172a"/></marker></defs>
<rect width="480" height="340" fill="white"/>
<rect x="6" y="4" width="468" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="240" y="30" font-size="21" fill="#dc2626" text-anchor="middle" font-weight="bold">Injected log line: send the</text>
<text x="240" y="56" font-size="21" fill="#dc2626" text-anchor="middle" font-weight="bold">database credential out</text>
<g opacity="1">
<line x1="240" y1="70" x2="240" y2="88" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="6" y="90" width="468" height="66" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="20" y="131" font-size="22" fill="#7c3aed" text-anchor="start" font-weight="bold">Action gate</text>
<text x="462" y="118" font-size="20" fill="#0f172a" text-anchor="end" font-weight="normal">scope names</text>
<text x="462" y="144" font-size="20" fill="#0f172a" text-anchor="end" font-weight="normal">no such host</text>
</g>
<g opacity="1">
<line x1="240" y1="154" x2="240" y2="172" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="6" y="174" width="468" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="20" y="215" font-size="22" fill="#d97706" text-anchor="start" font-weight="bold">Egress policy</text>
<text x="462" y="202" font-size="20" fill="#0f172a" text-anchor="end" font-weight="normal">socket to unlisted</text>
<text x="462" y="228" font-size="20" fill="#0f172a" text-anchor="end" font-weight="normal">host dropped</text>
</g>
<g opacity="0">
<line x1="240" y1="238" x2="240" y2="256" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="6" y="258" width="468" height="66" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="20" y="299" font-size="22" fill="#7c3aed" text-anchor="start" font-weight="bold">Flow label</text>
<text x="462" y="286" font-size="20" fill="#0f172a" text-anchor="end" font-weight="normal">credential may not</text>
<text x="462" y="312" font-size="20" fill="#0f172a" text-anchor="end" font-weight="normal">reach recipient</text>
</g>
</svg>
