chapter: 20_conclusion
lecture: "20"
title: Conclusion
subtitle: "Closing invariants across one agent trajectory"
minutes: 75
notes_minutes: 71.5
core_minutes: 57.0
target_ideas: 24
layer: trajectory
locator: hsa
thesis: "Components that pass their own tests can still leave a task unfinished, so reliable autonomy comes from closing invariants at every boundary of one trajectory."
hook:
  minutes: "2-5.5"
  setup: "incident_42 (§20.2): a latency alert on db_primary_01 after a configuration change; the remediation agent proposes reverting to config_v7; an operator approves; the configuration endpoint drops the connection before acknowledging. Server-rack photo (generic machines, captioned so)."
  question_to_class: "What should the runtime do? A retry the change, B record success and close, C halt and wait, D none of these."
  payoff: "D. A duplicates, B closes an unapplied change, C leaves a live change unowned. The runtime settles by a read-only status query on op_42, possible only because intent was durable before dispatch and the endpoint keeps operation ids. Segment 1 runs all four runtimes for real (measured: 92 duplicates, 27 false closures, 108 unowned, 0)."
  sources: ["Conclusion §20.2, §20.5", "images/data/settle_run.py (measured 2026-10-19)"]
driving_question: "Why can individually tested components still leave an agent's task unfinished or its effects unaccounted for?"
thread_tag: "H·S·A thread: closes all three exposures"   # golden-thread line on the goals slide (sweep D4, 2026-10-19)
recall: "Lecture 19 (opening frame): why did the configuration with the lower token price cost $1.32 per accepted repair against $0.55? Each accepted repair carried 3 rejected attempts against 0.33 (NM 19.1, 25 against 75 accepted of 100; derived)."
running_example: "incident_42 handled by the remediation agent (Lighthouse 1.3), followed from incident_contract_v1 through context_manifest_42, change_request_42 and approval_42, durable intent for op_42, the lost reply, settlement confirming config_v8, to acceptance_42 and health_window_42 (§20.2 table 1). Shown as a real system by running its endpoint contract on a localhost HTTP server with Exercise 3's fault rates."
segments:
  - name: Incident
    divider_question: "What does each boundary of one incident need?"
    read: "§20.2"
    concept_questions: [2, 3, 4, 5, 6]
    land: "Each boundary needs an owner and a record; an unknown outcome is settled by asking the endpoint, never by retrying or assuming."
    minutes: 15.0
  - name: Principles
    divider_question: "Which principle did each part of the course add?"
    read: "§20.2.3 (table 2)"
    concept_questions: [7]
    land: "Fifteen principles, one per guarantee; invariant closure anchors them because no computation certifies its own contract."
    minutes: 9.5
  - name: Evidence
    divider_question: "Where does evidence go stale, and which fix comes first?"
    read: "§20.3, §20.4, §20.6"
    concept_questions: [8, 9, 10, 11]
    land: "A cache hit proves tokens, freshness comes from the source, and the fix follows the attributed failure and its full cost."
    minutes: 11.5
  - name: Safety Case
    divider_question: "What does a passing check actually establish?"
    read: "§20.7 to §20.10"
    concept_questions: [12, 13, 14, 15]
    land: "A passing check supports only what it covers; one incident is one trial; owners adopt contracts, and agents only propose them."
    minutes: 18.0
  - name: Synthesis
    divider_question: "Can you now close one task end to end?"
    read: "§20.2 (table 1), §20.11"
    concept_questions: [1, 16]
    land: "Every consequential transition needs an owner and a durable record."
    minutes: 12.0
concept_questions:
  - id: 1
    q: "Which records close incident_42, and who owns each?"
    picture: "Table 1 built by column (transition, owner, record) in the synthesis; focus frame."
    numbers: "Six transitions (§20.2.1, table 1)."
    example: "acceptance_42 binds contract, approval, settled operation, config_v8, health window."
    read: "§20.2.1"
  - id: 2
    q: "Which parts of the course did one incident cross?"
    picture: "capstone_step1-3: slide variant of Conclusion figure 1."
    numbers: "none"
    example: "Parts I to IV entered; learning and delegation never did."
    read: "§20.2"
  - id: 3
    q: "What does an approval bind, and who enforces the precondition?"
    picture: "Approval record beside the AWS S3 2017 summary excerpt (real artifact)."
    numbers: "none"
    example: "approval_42 binds operator, request, host, payload, config_v7, expiry; the endpoint's expected-version check."
    read: "§20.2.1, table 3"
  - id: 4
    q: "What does the runtime record before dispatch, and how does it settle a lost reply?"
    picture: "lostreply_step1-3 lane diagram; Stripe idempotency excerpt (real artifact)."
    numbers: "none"
    example: "op_42 unknown, status lookup returns config_v8."
    read: "§20.2.1, §20.5"
  - id: 5
    q: "What does a blind retry cost, and what happens when the four runtimes actually run?"
    picture: "Estimate card; measured bars (localhost run)."
    numbers: "Exercise 3 (hypothetical): 124.9 timeouts, 99.8 duplicates, $199,600 a day against $1.25 of lookups (derived). Measured over 25,000 incidents each: retry 92 duplicates, assume 27 false closures (25 expected), halt 108 unowned (92 applied), settle 0."
    example: "Settlement before retry against an endpoint that keeps operation ids."
    read: "§20.13 Exercise 3"
  - id: 6
    q: "How do three independent barriers stop an injected instruction?"
    picture: "barriers_step1-3 beside the Invariant Labs pull request (War Story 7.1)."
    numbers: "none"
    example: "action gate (read_scope_42), egress policy, information-flow label."
    read: "§20.2.2"
  - id: 7
    q: "Which principles did each part add, and what number showed each?"
    picture: "Kit stack_roadmap for retrieval; three part slides with text-free lit-stack thumbnails, a photo or plot, and one number."
    numbers: "892,500 vs 51,500 tokens (NM 2.2); 3,030,000 vs 1,410,000 (NM 4.1); 1.92 percent, 3,842 a day (NM 7.1); 74 percent over 30 turns (§10.10, derived); 39 of 128 vs 8 of 1,087 hacked runs (WS 17.1); about 15x tokens (WS 18.1, one reported system)."
    example: "Table 2's fifteen principles."
    read: "§20.2.3"
  - id: 8
    q: "Why does a cache hit not establish freshness?"
    picture: "records_step1-2 beside the vLLM prefix-caching excerpt (real artifact)."
    numbers: "none"
    example: "config_v7 summary and index stale after config_v8; KV valid for its tokens."
    read: "§20.4"
  - id: 9
    q: "At which seams do locally correct components fail?"
    picture: "Table 4 built in three steps."
    numbers: "none"
    example: "five seams, principle pairs in tension."
    read: "§20.4.2"
  - id: 10
    q: "Where does an incident attempt's money go, and what would more diagnosis need to earn?"
    picture: "bill: log bars of the attempt and the unchecked expected loss (illustrative)."
    numbers: "$20.45 attempt, $29.21 per accepted incident, model 0.7 percent, approval 97.8 percent, $480 expected loss (23.5x the attempt); doubling model calls needs acceptance above 70.51 percent (all derived)."
    example: "Remediation profile, §20.3.2."
    read: "§20.3.2"
  - id: 11
    q: "Which intervention does an attributed failure justify?"
    picture: "Table 6 condensed beside the SWE-agent ablation bars as a one-line recall (Lecture 7 owns the data; sweep D3, 2026-10-19)."
    numbers: "Recall only: interface changes alone moved resolution between 18.0 and 10.3 percent (Yang et al. 2024 via Lecture 7)."
    example: "Interface changes moved the outcome as much as a model swap."
    read: "§20.6"
  - id: 12
    q: "How much of a passing set is invalid?"
    picture: "passing_step1-2 stacked bars, then SWE-bench+ stacked bar (real data)."
    numbers: "30 percent valid, FR 10, FA 5 percent: 11.5 percent invalid (derived). SWE-bench+: 251 passing patches, 82 leaked, 78 weak tests, 91 correct (Aleithan et al. 2024, Table 1)."
    example: "Verification asymmetry, principle 3."
    read: "§20.10"
  - id: 13
    q: "What does a safety case claim, and what does it leave open?"
    picture: "Table 7 condensed (claim, evidence, residual)."
    numbers: "Halving the window widens the interval about 1.41x (derived)."
    example: "incident_42's three scoped claims."
    read: "§20.7"
  - id: 14
    q: "Why is one incident only one trial?"
    picture: "Text beside the canary photo."
    numbers: "Halving the detectable difference quadruples tasks per arm (equation 13.3)."
    example: "Stopping a canary leaves applied changes with their owner."
    read: "§20.7.2, §20.7.3"
  - id: 15
    q: "Does a capable model remove runtime boundaries, and what stays open?"
    picture: "Vote with a one-line recall of War Story 10.1 (Lecture 10 owns it; the X-post quote was removed in sweep D3, 2026-10-19); attribution log bars with Minsky photo; Brooks photo."
    numbers: "0.1 percent per step, 50 turns: 4.88 percent, 488 a day of 10,000; 4^50 about 10^30 vs 4^5 = 1,024 paths, about 20 minutes at 1.2 s; half the effort human: at most 2x (all derived)."
    example: "Specification boundary: an agent drafts, the owner adopts."
    read: "§20.8, §20.9, §20.10"
  - id: 16
    q: "How did the course answer its two relations?"
    picture: "Horizon curve with METR p50 against p80 horizons (measured); cost-per-accepted-task bars."
    numbers: "90.4 and 36.6 percent; METR 13 SOTA models since 2024, p50/p80 ratio 4.0 to 10.3, median 5.5 (derived from METR benchmark_results_1_1.yaml); $5.25, $3.63, $3.50."
    example: "incident_42 needed gates more than cheaper tokens."
    read: "§20.11"
