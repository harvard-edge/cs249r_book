notes_for_author:
  - "The chapter has no war story of its own; incident_42 is constructed. The real counterparts are the AWS S3 2017 excerpt, the Stripe and vLLM documentation excerpts, Replit (War Story 10.1), the Invariant Labs pull request (War Story 7.1), and our localhost run."
  - "The measured run is one seeded run on one laptop (Python http.server, 25,000 incidents per runtime). Counts agree with Exercise 3's formula within sampling error."
  - "The cost bars use $3.63 for the half-price case as the chapter does (it rounds the attempt to $1.45 before dividing); unrounded, it is $3.62."
  - "39 of 128 RE-Bench runs is 30.5 percent unrounded; the chapter and slide say 30 percent."
  - "Part slides group two parts each (three frames) instead of one per part, to stay near 37 frames."
  - "The last lecture of the course."
