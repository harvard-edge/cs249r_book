chapter: 15_trajectory_curation
lecture: "15"
title: Trajectory Curation
minutes: 75
notes_minutes: 71.5
core_minutes: 61.5
target_ideas: 30
layer: learning
locator: origin
previous: "Lecture 14: Operating Agents"
next: "Lecture 16: Trajectory Fine-Tuning"

thesis: >-
  An accepted trajectory is a record of what happened, and curation decides,
  before any gradient, whether a failure belongs in the weights at all and
  which records, tokens, and permissions each learner receives.

hook:
  minutes: "0-3.5"
  setup: >-
    A maintenance agent fails 3,000 of 50,000 runs a month. Fine-tuning on all
    of them costs about $58 of accelerator time. Students predict how many
    failures stop recurring.
  question_to_class: "How many failures stop recurring? A 3,000, B about 2,700, C at most 300, D none."
  payoff: >-
    C. Probes attribute 2,100 to a schema missing a field and 600 to sandbox
    timeouts; only 300 survive every probe. System repairs remove 2,700 for
    every model. The synthesis traces one record from those 300 to a published
    manifest.
  sources: ["Trajectory Curation, Napkin Math 15.1, §15.2.2 (hypothetical)"]

driving_question: "Why is an accepted agent trajectory not automatically a good training example?"

running_example: >-
  The repair agent's recovery record trace_r19_01 (collection_run_r19_01,
  ws_r20, repair_accept_v1, targets e3, e4, e6; redacted view
  trace_r19_01_redacted_v1; manifest repair_demonstrations_v1), §15.6.2 and
  §15.10. Beside it, a real public corpus measured for this lecture:
  nebius/SWE-agent-trajectories (revision 68195a1, CC BY 4.0), 80,036
  SWE-agent runs on 3,591 GitHub issues in 1,276 repositories, 13,389
  resolved; counts by images/data/corpus_stats.py (2026-10-19).

segments:
  - name: Triage
    minutes: "9.5-21.5"
    question: "Does this failure belong in the weights?"
    read: "§15.2"
    land: "Probes keep system defects out of the weights; training gets the residual capability gap."
  - name: Splits
    minutes: "21.5-34"
    question: "Will the test score still measure unseen tasks?"
    read: "§15.3, §15.4"
    land: "A split protects a claim, so it is assigned to whole task groups before collection."
  - name: Admission
    minutes: "34-42.5"
    question: "Which records may each learner receive?"
    read: "§15.5"
    land: "Cheaper checking must admit the same corpus; tests stay out of the candidate's reach."
  - name: Recovery
    minutes: "42.5-58"
    question: "How do we teach recovery, and what does self-generated data narrow?"
    read: "§15.6, §15.7"
    land: "A recorded mistake is context; self-selected data narrows toward what it already solves."
  - name: Collection
    minutes: "58-65.5"
    question: "How does the collector stay bounded, and what does the trainer read?"
    read: "§15.8 to §15.10"
    land: "Staging is sized for a verifier stall with credits; every derived record gets its own lineage and decision."

concept_questions:
  - q: "Does a failure belong in the weights?"
    picture: "ladder_step build (context, schema, runtime probes; residual to SFT and RL)"
    numbers: "NM 15.1: 3,000 failures, 2,100 schema, 600 sandbox, 300 residual (hypothetical)"
    example: "truncated search result fixed by an adapter; SWE-agent's viewer prints lines above and below"
    read: "§15.2.2"
  - q: "What does fine-tuning on every failure cost, and what does it fix?"
    picture: "worked estimate"
    numbers: "36,864,000 tokens; 1.56e19 FLOP; 1.83 h; 14.6 accelerator-hours; $58 (residual only $6)"
    example: "70.6B model on 8 accelerators at 30% MFU"
    read: "NM 15.1"
  - q: "What can one recorded run teach?"
    picture: "artifacts_step build: imitation material, preference comparison, rollout fixture"
    numbers: "Nebius: 2.7k resolved runs for the policy; 8.3k positive and 12.7k negative for a critic"
    example: "trace_r19_01"
    read: "§15.2.3"
  - q: "How often does a random split of runs leak a task?"
    picture: "straddle curve; measured corpus split bars"
    numbers: "83.2% at 8 attempts (formula); 89.9% of 3,591 real issues measured, 90.3% predicted"
    example: "nebius corpus, median 16 runs per issue"
    read: "§15.4"
  - q: "What keeps every relative of a task on one side?"
    picture: "groups_step build; partition-integrity relation"
    numbers: "77.4% of 743 test issues share a repository with training (measured)"
    example: "pool_repair_01 attempts, paraphrase, fork, redacted record"
    read: "§15.4.1"
  - q: "How do we find relatives nobody recorded?"
    picture: "LSH S-curve, 32 bands of 4 rows"
    numbers: "87% at J=0.5; 512 bytes per signature; measured 57.3% same-issue near-duplicate patches, 26 cross-issue pairs"
    example: "datasketch MinHash LSH on the corpus"
    read: "§15.4.3"
  - q: "Which records may a learner receive?"
    picture: "cascade_step build: records A, B, C"
    numbers: "five predicate families, four verdicts"
    example: "malformed call refused before dispatch passes R"
    read: "§15.5.1"
  - q: "How do we keep the candidate from grading itself?"
    picture: "Claude 3.7 Sonnet system card excerpt; chapter listing 1"
    numbers: "WS 15.1"
    example: "assert True replaces the wakeup assertion"
    read: "§15.5.2"
  - q: "In what order should checks run?"
    picture: "order bars"
    numbers: "1 s vs 13.3 s per rejection; 6.24 vs 7.50 s per attempted record; yield 20.52%; 16.9% saved"
    example: "NM 15.2"
    read: "§15.5.3"
  - q: "Which tokens of a recovery record are targets?"
    picture: "typology_step build; real corpus run with mask flags"
    numbers: "2,115,623 of 2,115,623 model turns mask=True in the corpus; 44.0% of runs have a refused edit"
    example: "joke2k__django-environ-358, run 610"
    read: "§15.6"
  - q: "What share of a mixture is recovery?"
    picture: "three-denominator bars, illustrative and measured"
    numbers: "25/45/39% (NM 15.3); 29.7/42.5/45.6% measured"
    example: "recovery runs 1.75 times as long"
    read: "§15.6.4"
  - q: "Which fixtures carry contrast in a self-generated batch?"
    picture: "plateau curves; measured outcome mix"
    numbers: "0.34 at 5% and 95%, 0.99 at 50%; about 24 attempts per success at 5%; 76.7% of real issues all fail, 22.5% mixed"
    example: "rejection-sampling fine-tuning"
    read: "§15.7.1"
  - q: "What does a success-only loop drift toward?"
    picture: "published recipe excerpt; vote"
    numbers: "a linter-error filter removes 3,971 of 13,389 resolved runs (29.7%); shortest-30 cap moves recovery share 29.7% to 28.0%"
    example: "Nebius recipe, 2024-11-15"
    read: "§15.7.2"
  - q: "How fast can a verifier stall fill staging?"
    picture: "staging_step build; ATM switch photo"
    numbers: "216.3 s to fill 32 GB; watermark at most 60%"
    example: "NM 15.4"
    read: "§15.8.2"
  - q: "What must travel with a derived record?"
    picture: "lineage_step build; corpus card license line"
    numbers: "1,276 repositories, each with its own license"
    example: "trace_r19_01_redacted_v1"
    read: "§15.9"

concept_trace:
  - concept: Capability-gap triage
    frame: "Triage: probes send only a capability gap to training"
    shows: "ladder_step 3-step build (probes in ladder order, residual to SFT then RL); Diagnose rung table; hook bars"
  - concept: Learning artifacts from one record
    frame: "One run can feed three learners, each with its own test"
    shows: "artifacts_step 3-step build with each artifact's admission condition; Nebius policy and critic counts"
  - concept: Task-group splits
    frame: "A task group keeps every relative on one side"
    shows: "groups_step 2-step build and the partition relation; straddle predict and measured corpus split frames"
  - concept: Admission cascade
    frame: "Admission runs five checks with four possible verdicts"
    shows: "cascade_step 3-step build (admitted, rejected and kept, held); ordering exercise with order bars"
  - concept: Recovery demonstrations
    frame: "A recovery record keeps the mistake as context only"
    shows: "typology_step 3-step build with loss bars (e3, e4, e6 targets); real run with mask flags (Diagnose)"
  - concept: Self-selection narrowing
    frame: "Mixed outcomes peak at mid difficulty"
    shows: "plateau curves (equation 3) and the measured outcome mix; Vote frame on drift"
  - concept: Bounded collection flow
    frame: "A verifier stall fills 32 GB of staging in 216 s"
    shows: "staging_step 2-step plot (fill, watermark with in-flight and delay terms); collection credit line"
  - concept: Record lineage
    frame: "A derived record inherits its split and permission"
    shows: "lineage_step 2-step build (parent reference, inherited split and permission, pending assessment; withdrawal to descendants)"

worked_examples:
  - name: "Napkin Math 15.1: pricing the ladder"
    steps: ["3,000 runs x 4,096 tokens x 3 epochs", "6 N D = 1.56e19 FLOP", "2.37e15 FLOP/s sustained", "1.83 h, 14.6 accelerator-hours", "$58; residual only $6; training removes none of the 2,700"]
  - name: "Exercise 1: straddle at 5 attempts, 90/10"
    steps: ["0.9^5 + 0.1^5 = 0.590", "41.0% straddle, 819 of 2,000", "sibling in training 0.9999", "majority at 7 attempts"]
  - name: "Napkin Math 15.2: ordering the cascade"
    steps: ["cost per rejection P 1 s, O 13.3 s", "6.2382 vs 7.5036 s per attempted", "yield 20.52% both", "16.9% saved; variant P 2 s 95% runs O first"]
  - name: "Napkin Math 15.4: staging burst"
    steps: ["22.8 arrivals/s vs 30.3 capacity (0.75)", "burst capacity 4.3/s", "147.9 MB/s growth", "216.3 s to full", "watermark at most 60%"]

active_learning:
  - {at_minute: 0.5, type: predict, prompt: "What does $58 of fine-tuning fix?", answer: "At most 300; system repairs remove 2,700."}
  - {at_minute: 3.5, type: retrieval, prompt: "How did Lecture 14 test whether truncation caused the failure?", answer: "Rerun continuations from the saved prefix with the cause removed; keep every failure."}
  - {at_minute: 13, type: estimate, prompt: "What does tuning on all 3,000 cost?", answer: "$58 (36.9M tokens, 1.56e19 FLOP, 14.6 accelerator-hours)."}
  - {at_minute: 18.5, type: diagnose, prompt: "Which rung owns each failure?", answer: "schema, context, runtime, residual capability gap"}
  - {at_minute: 22, type: predict, prompt: "How many tasks leak across a random 80/20 split at 8 attempts?", answer: "83.2%"}
  - {at_minute: 31.5, type: estimate, prompt: "5 attempts, 90/10 split", answer: "41.0%, 819 tasks; majority at 7 attempts"}
  - {at_minute: 39, type: estimate, prompt: "Which check runs first?", answer: "P (1 s vs 13.3 s per rejection); 16.9% less time, same 20.52% yield"}
  - {at_minute: 45, type: diagnose, prompt: "Which turns of a real run teach?", answer: "Refused edit as context; the final edit as target; not the duplicate-import step or the untested submit."}
  - {at_minute: 55.5, type: concept_question, prompt: "Where does a success-only loop drift?", answer: "B: repeats solved strategies; held-out scores stall."}
  - {at_minute: 63.5, type: estimate, prompt: "Cost per emitted artifact", answer: "$20; $10 at 6% yield"}
  - {at_minute: 65.5, type: retrieval, prompt: "Trace one record from failure to manifest", answer: "triage, split group, R U P O T, targets e3 e4 e6, redacted view re-admitted, manifest"}

fallacies:
  - "Every action in a successful trace is a demonstration (Diagnose: real run; typology)."
  - "Fine-tuning on every failure before probing (hook, $58 estimate)."
  - "A random split of traces holds out unseen tasks (predict and measured split)."
  - "Cheapening the cascade by dropping a predicate (ordering exercise)."
  - "Setting a recovery percentage by record count (three denominators)."
  - "Sizing staging from average utilization (staging frame)."

open_questions:
  - "Public corpora mask every model turn. Who should pay to assess targets step by step?"
  - "When a source withdraws permission, what does a team owe for models already trained?"
  - "Can a self-improvement loop stop needing an external anchor?"

