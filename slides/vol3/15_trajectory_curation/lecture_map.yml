notes_for_author:
  - "The public corpus masks every model message (2,115,623 of 2,115,623); the Diagnose frame uses this as the counterexample to role-based targets."
  - "The excerpt run (joke2k__django-environ-358, run 610) is accepted with 12 tests passing, yet its patch keeps a duplicated 8-line import block; checked by reading the patch."
  - "The Nebius filter rules are applied to the public corpus as a counterfactual; their own final training set may differ, and the note says so."
  - "Similarity screen on the corpus used token 5-grams of changed diff lines, 128 permutations, threshold 0.8, verified by exact Jaccard."
