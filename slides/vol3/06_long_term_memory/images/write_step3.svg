<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395">
<rect width="900" height="395" fill="white"/>
<defs><marker id="a-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-storage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-tools" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-compute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="a-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-struct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="10" y="6" width="265" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="24" y="35" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#15803d" text-anchor="start" font-weight="bold">1  Commit the raw</text>
<text x="50" y="63" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#15803d" text-anchor="start" font-weight="bold">observation</text>
<rect x="288" y="6" width="602" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="302" y="35" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">tool output, revision, task id: durable before</text>
<text x="302" y="61" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">any summary or embedding runs</text>
<rect x="10" y="88" width="265" height="68" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="24" y="130" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6d28d9" text-anchor="start" font-weight="bold">2  Admission gate</text>
<rect x="288" y="88" width="602" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="302" y="117" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">permission and consent, record kind and scope,</text>
<text x="302" y="143" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">evidence; a fidelity check for prose</text>
<line x1="142" y1="87" x2="142" y2="75" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a-struct)"/>
<rect x="10" y="170" width="265" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="24" y="199" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#b45309" text-anchor="start" font-weight="bold">3  Identity, then</text>
<text x="50" y="227" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#b45309" text-anchor="start" font-weight="bold">update</text>
<rect x="288" y="170" width="602" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="302" y="199" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">same scope: supersede if its base version is</text>
<text x="302" y="225" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">unchanged; other scope: keep both; unclear: flag</text>
<line x1="142" y1="169" x2="142" y2="157" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a-struct)"/>
<rect x="10" y="252" width="265" height="68" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
<text x="24" y="281" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0369a1" text-anchor="start" font-weight="bold">4  Only then</text>
<text x="50" y="309" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#0369a1" text-anchor="start" font-weight="bold">deduplicate</text>
<rect x="288" y="252" width="602" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="302" y="281" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">similarity may merge storage only when the</text>
<text x="302" y="307" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">new record changes no state and no scope</text>
<line x1="142" y1="251" x2="142" y2="239" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a-struct)"/>
<rect x="10" y="334" width="880" height="57" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="450" y="358" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#b91c1c" text-anchor="middle" font-weight="bold">10:00 to 11:00, same calendar: supersede. Similarity-first</text>
<text x="450" y="383" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#b91c1c" text-anchor="middle" font-weight="bold">deduplication drops it (5 of 6 words shared).</text>
</svg>
