<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395">
<rect width="900" height="395" fill="white"/>
<defs><marker id="a-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-storage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-tools" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-compute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="a-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-struct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="8" y="8" width="285" height="315" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="150" y="40" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#6d28d9" text-anchor="middle" font-weight="bold">Runtime sets bounds</text>
<text x="24" y="80" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">need: notification logic</text>
<text x="24" y="123" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">scope: repair workspace</text>
<text x="24" y="166" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">principal: repair agent</text>
<text x="24" y="209" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">version: r18</text>
<text x="24" y="252" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">limits: items, tokens</text>
<text x="24" y="295" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">deadline, work caps</text>
<line x1="295" y1="165" x2="320" y2="165" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a-struct)"/>
<rect x="322" y="8" width="250" height="315" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
<text x="447" y="40" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#0369a1" text-anchor="middle" font-weight="bold">Service searches</text>
<text x="338" y="80" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">checks access</text>
<text x="338" y="123" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">picks an index</text>
<text x="338" y="166" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">stops at a limit</text>
<text x="338" y="209" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">cancels on timeout</text>
<line x1="574" y1="165" x2="599" y2="165" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a-struct)"/>
<rect x="601" y="8" width="291" height="315" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="746" y="40" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#15803d" text-anchor="middle" font-weight="bold">Envelope reports</text>
<text x="615" y="80" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">status: complete,</text>
<text x="615" y="123" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">  partial, unavailable</text>
<text x="615" y="166" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">searched: repair, r18</text>
<text x="615" y="209" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">each item: path, lines,</text>
<text x="615" y="252" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">  revision, hash, role</text>
<text x="615" y="295" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" text-anchor="start">score: method named</text>
<rect x="8" y="335" width="884" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="450" y="370" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#b91c1c" text-anchor="middle" font-weight="bold">Zero hits prove absence only for a complete scan of the declared scope.</text>
</svg>
