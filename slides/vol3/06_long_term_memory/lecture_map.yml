chapter: 06_long_term_memory
lecture: "06"
title: "Long-Term Memory"
layer: memory
locator: s
minutes: 75
notes_minutes: 71.5
core_minutes: 58.5
target_ideas: 30
thesis: "Persistent memory is a store of fallible claims with sources and versions, so retrieval needs a contract and writes need a policy, or the agent acts on stale facts it ranks highly."

hook:
  minutes: "0-4"
  setup: "War Story 6.1 from the decision itself. A photo of an Air Canada 787 and the setup: in November 2022 the airline's website chatbot told a bereaved passenger he could claim a bereavement refund within 90 days; the policy page allowed none after travel. Students vote on who pays."
  question_to_class: "Who pays when a chatbot contradicts its policy? A) the passenger, since the page was public B) nobody, since the chatbot is a separate entity C) the airline"
  payoff: "C. The tribunal called the separate-entity argument 'a remarkable submission' and held the airline responsible for all information on its website. Award CA$650.88 + $36.14 interest + $125 fees = CA$812.02 (sum derived). The synthesis maps each gap (drift from source, reuse as precedent, policy revision) to the mechanism the lecture teaches."
  sources:
    - "Moffatt v. Air Canada, 2024 BCCRT 149, paras 15 to 17, 27, 28, 40, 44 (decision PDF, copy read 2026-10-18)."
    - "Long-Term Memory, War Story 6.1 (§6.2.1)."

driving_question: "Why does an agent that can search everything it has stored still act on the wrong facts?"

goals:
  - "Classify a stored record by role, and name the source a claim is checked against."
  - "Specify a retrieval contract, and count the records a token allowance holds."
  - "Match a method to an information need, and screen an exact scan by its bandwidth floor."
  - "Design a write policy that supersedes, deletes, and invalidates derived copies."

running_example: "The repair agent (Lecture 1's Lighthouse) repairing the connection-pool race across sessions: the r17 failure of test_waiter_notified_on_return, the r18 candidate of src/pool.py passing under configuration c18, the progress note, and the index entries over all three. The support agent's 10:00 then 11:00 scheduling preference carries the write path. The chatbot case returns in the synthesis."

segments:
  - name: Records
    divider_question: "What does each stored record actually prove?"
    read: "§6.1, §6.2"
    concept_questions: [1, 2, 3]
    land: "A stored record is a role in an evidence chain, and authority stays with the source of record."
    minutes: 8
  - name: Contract
    divider_question: "What must every read specify and report?"
    read: "§6.3, §6.4"
    concept_questions: [4, 5, 6]
    land: "Every read is a bounded request answered by an envelope, and how much the task names decides who writes the query."
    minutes: 11.5
  - name: Matching
    divider_question: "Which index answers which question, and at what cost?"
    read: "§6.5 to §6.7"
    concept_questions: [7, 8, 9, 10]
    land: "Each method answers a different need, an exact scan is bounded by bytes streamed, and every hop multiplies the evidence."
    minutes: 14.5
  - name: Writes
    divider_question: "Who decides what persists, and when it stops counting?"
    read: "§6.8"
    concept_questions: [11, 12, 13]
    land: "The runtime decides what persists, supersedes on identity, deletes every copy, and cascades invalidation."
    minutes: 12.5
  - name: Freshness
    divider_question: "How does a store stay truthful as its sources change?"
    read: "§6.9, §6.10"
    concept_questions: [14, 15]
    land: "Generation intervals keep stale entries out of current reads, and a memory policy is judged on accepted tasks and their full cost."
    minutes: 12.5

concept_questions:
  - id: 1
    q: "What does each stored record prove, and against what is it checked?"
    picture: "New build (roles_step1-4): four rows, source record, observation log, agent-written memory, derived index, each with the repair agent's example and what a later read must keep; arrows from derived to source."
    numbers: "None; Table 1 of the chapter redrawn."
    example: "src/pool.py at r18; waiter test failed at r17 and passed at r18 under c18; a resume note; search entries."
    read: "§6.2.1"
  - id: 2
    q: "What happens when a derived answer drifts from its source of record?"
    picture: "Real artifact: the chatbot's answer (para 15) and the tribunal's summary of the policy page (para 17), quoted side by side; the answer hyperlinked the page (para 16)."
    numbers: "Decision paras 15 to 17."
    example: "Moffatt v. Air Canada; stored and retrieved later, the answer would read as precedent."
    read: "§6.2.1 War Story 6.1"
  - id: 3
    q: "Which record shows that r18 fixes the waiter?"
    picture: "Concept question, four choices."
    numbers: "None."
    example: "B, the r18 pass log, for that reproducer under c18 only."
    read: "§6.2.1, Table 7"
  - id: 4
    q: "What must a read specify, and what must it report?"
    picture: "New build (contract_step1-3): runtime bounds, service, envelope; red band with the absence rule."
    numbers: "Definition 6.1; Table 2; listing 1."
    example: "Query for the notification logic at r18 in the repair workspace."
    read: "§6.3.1, §6.3.2"
  - id: 5
    q: "How many records fit a token allowance?"
    picture: "Estimate with fit_step1-2: body-only count overshoots; serialized count fits. Plus SWE-bench recall against resolve rate (optional)."
    numbers: "NM 6.1: 6,144 allowance, 576 per record, 10 records in 5,888, body-only 12 in 7,040 (896 over), all derived in calcs.py. SWE-bench (Jimenez et al. 2024, Tables 2 and 3): BM25 recall 29.58, 44.41, 51.06 percent at 13K, 27K, 50K; Claude 2 resolved 1.96, 1.87, 1.22 percent."
    example: "Metadata doubled to 128 tokens leaves 9 records (Checkpoint 6.1)."
    read: "§6.3.3"
  - id: 6
    q: "Who should formulate the query: the runtime or the model?"
    picture: "Table of three needs and policies; SWE-agent bars."
    numbers: "Yang et al. 2024, Table 1, SWE-bench Lite, GPT-4 Turbo: RAG 2.67, shell 11.00, SWE-agent 18.00 percent; 6.7 times (derived)."
    example: "Direct read for named src/pool.py; pre-stage its tests; probe the assertion to helper to lock chain."
    read: "§6.4"
  - id: 7
    q: "What does a lexical or structural index return, and what does it miss?"
    picture: "inverted_index diagram beside a credited card-catalog photo; Bush 1945 quote."
    numbers: "BM25 Example 6.1 (14.58 against 8.46) in the notes, checked in calcs.py."
    example: "notify posts to src/pool.py and the stale r17 log alike."
    read: "§6.5"
  - id: 8
    q: "Why does dense similarity blur notify, notify_all, and wait?"
    picture: "Real code: CPython v3.14.4 Lib/threading.py, Condition methods (excerpt)."
    numbers: "notify and notify_all docstrings share 7 of 13 distinct words (derived)."
    example: "Literal search for notify( isolates the call site; hybrid retrieval fuses ranks with RRF after joining on full identity."
    read: "§6.6.1, §6.6.3"
  - id: 9
    q: "What bounds an exact scan, and when does it fit a budget?"
    picture: "scan_floor_step1-2 (chapter figure redrawn), then this deck's measured scan with a DDR5 module photo; ann_bytes for HNSW and IVF-PQ."
    numbers: "NM 6.2: 15.36 GB, 1 FLOP/byte, ridge 20, 307.2 ms, 15.36 ms arithmetic, 0.31 ms at 10,000, ceiling 325,521 (all derived). Measured: Apple M5 Max, numpy 2.5.3, FP32, fit 126 GB/s, 44 to 64 GFLOP/s, 10 ms holds 411,377. HNSW 17.92 GB, IVF-PQ 0.64 GB, 24 times."
    example: "A tenant filter to 10,000 vectors makes an exact scan sub-millisecond."
    read: "§6.6.2"
  - id: 10
    q: "How fast does a multi-hop neighborhood outgrow the allowance?"
    picture: "depth_step1-2 with depth 3 hidden, then revealed."
    numbers: "NM 6.3: 1, 4, 13, 40 nodes; 280, 820, 2,440, 7,300 tokens; at most 33 nodes (derived)."
    example: "Call and mutation edges from the waiter test to the return method to the waiter queue."
    read: "§6.7.3"
  - id: 11
    q: "How few planted records does it take to steer retrieval?"
    picture: "PoisonedRAG bars (optional)."
    numbers: "Zou et al. 2025, Table 1, black-box, PaLM 2: NQ 97 percent (2,681,468 texts), HotpotQA 99 (5,233,329), MS-MARCO 91 (8,841,823); 5 texts per target, 1.86 per million in NQ (derived)."
    example: "Greshake et al. 2023: an injected instruction saved as a project lesson (notes)."
    read: "§6.10.4"
  - id: 12
    q: "In what order does the runtime admit, update, and deduplicate?"
    picture: "write_step1-3 build; GDPR Art. 17(1) excerpt beside the deletion_copies diagram."
    numbers: "10:00 against 11:00 share 5 of 6 words (derived)."
    example: "Supersede by compare-and-swap for the same calendar; tombstone, then purge row, postings, vector, summary, cached prefix, template."
    read: "§6.8.1 to §6.8.4"
  - id: 13
    q: "Why must invalidation follow provenance edges?"
    picture: "cascade_step1-2: observation, lesson, summary, report, heuristic; all descendants marked suspect."
    numbers: "30 retrievals add no evidence (Checkpoint 6.3)."
    example: "'Timeouts always come from a missed notify' induced from one passing run."
    read: "§6.8.5, §6.8.6"
  - id: 14
    q: "How does a store keep stale derived entries out of current reads?"
    picture: "generations interval chart beside PostgreSQL xmin and xmax definitions; exclusion bars (optional)."
    numbers: "Turn 12 to 15 trace, three wasted turns (§6.9). NM 6.4: 88 ms, 210 ms, 1.26 s against 0.4 µs and 1.5 µs; 220,000 times (derived)."
    example: "A query at r18 admits the r18 chunk only; a diagnostic query at r17 admits the r17 chunk and the summary."
    read: "§6.9"
  - id: 15
    q: "How is a memory policy evaluated?"
    picture: "Table 10 conditions; Liu et al. position curve (optional); cost-per-accepted-task bars."
    numbers: "Liu et al. 2024, Table 6 and Table 1: 75.8, 57.2, 53.8, 55.4, 63.2 percent; closed-book 56.1. Checkpoint 6.4: 2.00 against 1.83, 8.3 percent lower, break-even 0.55 (derived)."
    example: "The 10:00, 11:00, delete lifecycle fixture; the r17 and r18 repair fixture."
    read: "§6.10"

concept_trace:
  - concept: Record roles
    frame: "Each stored record plays one role in an evidence chain"
    shown_by: "roles_step1-4 build, one role per step with the repair agent's records"
  - concept: Retrieval contract
    frame: "A read is a bounded request answered by an envelope"
    shown_by: "contract_step1-3 build: bounds, service, envelope with status and per-item provenance, absence rule band"
  - concept: Query formulation choice
    frame: "Query formulation follows how much the task names"
    shown_by: "three-row table (direct read, pre-stage, model probes, with prices) and SWE-agent measured bars"
  - concept: Bounded multi-hop retrieval
    frame: "Does a depth-3 neighborhood fit 6,144 tokens?"
    shown_by: "depth_step1-2 predict build, allowance line, bounds line"
  - concept: Memory write policy
    frame: "The runtime decides what persists, in a fixed order"
    shown_by: "write_step1-3 build (commit observation, admission, identity and supersession, dedup last); deletion frame adds the lifecycle"
  - concept: Memory poisoning
    frame: "Invalidation must cascade to records derived from a claim"
    shown_by: "cascade_step1-2 build: derived chain, then every descendant marked suspect"
  - concept: Source-generation invalidation
    frame: "Each derived entry is valid for an interval of generations"
    shown_by: "generations interval chart with current and historical queries; equation birth <= g < death; PostgreSQL xmin and xmax"
  - concept: Memory policy evaluation
    frame: "Memory is evaluated as a whole policy across sessions"
    shown_by: "four-condition table with acceptance, cost per accepted task, stale-return beside recall; estimate frame on cost per accepted task"

worked_examples:
  - name: "Napkin Math 6.1: records that fit the allowance"
    steps: ["Given 32,768 window, 2,048 reserve, 24,576 other input, 128 envelope, 512 + 64 per record", "Allowance 6,144", "floor((6,144 - 128) / 576) = 10 records, 5,888 tokens", "Body-only count admits 12, 7,040 tokens, 896 over", "Provenance tokens are part of the budget"]
  - name: "Napkin Math 6.2: the exact-scan floor"
    steps: ["Given 10 million x 768 FP16 vectors, 50 GB/s, 1 TFLOP/s", "15.36 GB per scan, 1 FLOP/byte against a ridge of 20", "Floor 307.2 ms; arithmetic 15.36 ms", "10 ms budget allows about 326,000 vectors; 10,000 vectors take 0.31 ms", "Measured on a laptop: slope one, 126 GB/s"]
  - name: "Napkin Math 6.3: depth against the allowance"
    steps: ["Tree, 3 children, 180 tokens per node, 100 tokens envelope", "Depth 2: 13 nodes, 2,440 tokens", "Depth 3: 40 nodes, 7,300 tokens, over 6,144", "Bound depth and edge types before ranking"]
  - name: "Checkpoint 6.4: cost per accepted task of two policies"
    steps: ["A accepts 50 percent; B 60 percent with maintenance 0.1 of A's attempt cost", "A: 1 / 0.5 = 2.00", "B: 1.1 / 0.6 = 1.83, 8.3 percent lower", "Break-even acceptance 0.55"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "Who pays when a chatbot contradicts its policy?"
    answer: "The airline; CA$812.02 including interest and fees; liability for all information on its website."
  - at_minute: 11
    type: concept_question
    prompt: "Which record shows that r18 fixes the waiter?"
    answer: "The r18 pass log, for that reproducer under c18 only; the note is a claim, the index entry only locates."
  - at_minute: 19
    type: estimate
    prompt: "How many records fit 6,144 tokens?"
    answer: "10, not 12; body-only counting overshoots by 896 tokens."
  - at_minute: 27.5
    type: concept_question
    prompt: "Which search finds the notify() call site?"
    answer: "Literal search for notify(; dense similarity lands all three Condition methods together."
  - at_minute: 37
    type: predict
    prompt: "Does a depth-3 neighborhood fit 6,144 tokens?"
    answer: "No: 40 nodes, 7,300 tokens; depth 2 fits at 2,440."
  - at_minute: 50
    type: concept_question
    prompt: "True or false: which memory shortcuts hold?"
    answer: "Reuse is not verification (F); 5-of-6-word directives are not duplicates (F); rank is not currency (F); an exact scan of 10,000 vectors fits 10 ms (T, 0.31 ms floor)."
  - at_minute: 62
    type: estimate
    prompt: "Does policy B lower cost per accepted task?"
    answer: "Yes: 1.83 against 2.00, 8.3 percent lower; break-even at 0.55 acceptance."
  - at_minute: 64.5
    type: retrieval
    prompt: "Name the mechanism that closes each gap the chatbot case exposed."
    answer: "Versioned source staging; admission as a linked hypothesis; generation intervals; gateway generation check; multi-session trial."

open_questions:
  - "An agent consolidates a hundred sessions into one lesson. How much provenance must the lesson carry before the store becomes too large to search?"
  - "Who should be allowed to invalidate a shared lesson (the agent, an operator, or a verifier), and with what evidence?"
  - "A deletion cannot recall tokens already sent to a model provider. What should a deletion receipt promise?"

more_examples:
  - "Moffatt v. Air Canada, 2024 BCCRT 149: a derived answer held to be the company's commitment."
  - "Jimenez et al., SWE-bench, ICLR 2024, Tables 2 and 3: more BM25 context, higher recall, lower resolve rate."
  - "Yang et al., SWE-agent, NeurIPS 2024, Table 1: model-directed search against pre-staging on SWE-bench Lite."
  - "Zou et al., PoisonedRAG, USENIX Security 2025, Table 1: 5 planted texts among millions steer 91 to 99 percent of targets."
  - "Liu et al., Lost in the Middle, TACL 2024, Table 6: accuracy by position of the answer."
  - "PostgreSQL row versions (xmin, xmax), PostgreSQL 18 docs §5.6: the generation interval in a production database."
  - "GDPR Article 17(1): erasure on withdrawn consent."
  - "This deck's own measurement (images/scan_bench.py): an exact scan streams memory at about 126 GB/s on one laptop."

left_to_reading:
  - concept: "BM25 formula, Example 6.1"
    why: "Secondary concept; its numbers are in the notes of the inverted-index frame and checked in calcs.py."
  - concept: "Reciprocal rank fusion arithmetic and cross-encoder reranking (§6.6.3)"
    why: "Secondary detail of the matching method; named in the notes of the notify() frame."
  - concept: "Community summaries as derived memory (§6.7.4)"
    why: "An application of record roles and invalidation; the reading carries it."
  - concept: "Retrieval during index refresh (Table 9) and Napkin Math 6.5"
    why: "Named on the optional exclusion slide and in the cost estimate's notes."

closing:
  return_to_hook: "The synthesis table maps each gap in the chatbot case (drift from source, reuse as precedent, policy revision) and the repair agent's stale r17 read to staging, admission, generation intervals, the gateway check, and multi-session trials."
  read_and_practice: ["§6.3, §6.8, §6.9", "Checkpoints 6.1 and 6.3", "Napkin Math 6.1 to 6.4 by hand", "Exercises 1, 2, 6 and 9", "Run images/scan_bench.py and compare its slope with the floor"]
  further_reading:
    - cite: "Terry et al., Session Guarantees for Weakly Consistent Replicated Data, PDIS 1994"
      url: "https://doi.org/10.1109/PDIS.1994.331722"
      why: "Read-your-writes and monotonic reads in a few pages."
    - cite: "Malkov and Yashunin, Efficient and Robust Approximate Nearest Neighbor Search Using HNSW Graphs, TPAMI 2018; Jegou et al., Product Quantization for Nearest Neighbor Search, TPAMI 2011"
      url: "https://doi.org/10.1109/TPAMI.2010.57"
      why: "The two index designs behind every vector store, with their recall trade-offs."
    - cite: "Park et al., Generative Agents, UIST 2023"
      url: "https://doi.org/10.1145/3586183.3606763"
      why: "A reference agent memory architecture to test against record roles."
    - cite: "Zou et al., PoisonedRAG, USENIX Security 2025"
      url: "https://arxiv.org/abs/2402.07867"
      why: "Measured knowledge-base poisoning."
    - cite: "Yang et al., SWE-agent, NeurIPS 2024"
      url: "https://arxiv.org/abs/2405.15793"
      why: "Model-directed retrieval through tools shaped for code."

