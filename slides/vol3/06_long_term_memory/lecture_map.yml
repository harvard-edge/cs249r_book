notes_for_author:
  - "The chatbot quote elides 'or have already travelled' (Canadian spelling in the original) with an ellipsis so the slide keeps American spelling; the meaning is unchanged."
  - "The measured scan is this deck's own run on one laptop (FP32 because numpy lacks a fast FP16 product); rerunning scan_bench.py rewrites scan_bench.csv, and calcs.py and make_figs.py read it."
  - "Most chapter notebook inputs are hypothetical; each such slide says illustrative or stipulated."
