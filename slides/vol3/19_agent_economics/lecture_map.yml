chapter: 19_agent_economics
lecture: "19"
title: "Agent Economics"
layer: scale
locator: hsa
minutes: 75
notes_minutes: 70.0
core_minutes: 60.0
target_ideas: 30
thesis: "The account that matters charges every attempt, failed and canceled ones included, to the tasks a contract accepted, and each lever (reuse, retries, faster inference, routing, capacity, delegation) pays only if it lowers that ratio or meets a deadline the objective values."

hook:
  minutes: "0.5-4"
  setup: "Napkin Math 19.1 as a predict slide: two repair-agent configurations on the same 100 tickets, one attempt each. Frontier: $3/$15 per M tokens, 4 turns, 75 accepted. Low price: $0.30/$1.20, 7 turns, 25 accepted. Same $0.03 environment per turn and $0.05 assessment per attempt."
  question_to_class: "Which costs less per accepted repair? A low price, B about equal, C frontier."
  payoff: "C: $0.55 against $1.32, 2.4 times. Token charges fall 71.3 percent, the attempt only 19.8 percent, acceptance 66.7 percent; with $10 triage per rejection, $3.88 against $31.32 (8.1 times). The synthesis answers it with the four lighthouse workloads: the discount acted on one term; acceptance divides them all."
  sources: ["Agent Economics §19.2, Napkin Math 19.1 (hypothetical)", "images/calcs.py nm191()"]

driving_question: "Why can a cheaper model cost more per finished task?"
thread_tag: "H·S·A thread: multiplies all three exposures"   # golden-thread line on the goals slide (sweep D4, 2026-10-19)

running_example: "The repair agent (Lighthouse 1.1) throughout: its 100-ticket cohort (NM 19.1), its 30-turn append-only bill (NM 19.2), compaction at turn 16 (NM 19.3), its serial episode (NM 19.5), and a $5 repair budget with two children (NM 19.10). Shown once as the real system: public SWE-bench Verified repair-agent runs with recorded per-trajectory cost (run A, 2024: 500 tasks, $856.86, 168 resolved), and the open-source agent's own cost-limit code."

segments:
  - name: Account
    divider_question: "What does one accepted task really cost?"
    read: "§19.2"
    concept_questions: [1, 2, 3]
    land: "Acceptance divides every charge, so the account counts every attempt and keeps pending work visible."
    minutes: 9.5
  - name: Reuse
    divider_question: "What do reuse, compaction, and retries buy?"
    read: "§19.3"
    concept_questions: [4, 5, 6]
    land: "Reuse lowers a coefficient and pays back over a horizon; retries pay by acceptance per dollar, measured per task."
    minutes: 11.5
  - name: Speed
    divider_question: "Where does faster inference pay, and which model should run?"
    read: "§19.4, §19.5"
    concept_questions: [7, 8, 9]
    land: "A speedup pays only on the critical path, and a cascade pays only through early exits under one gate."
    minutes: 12.5
  - name: Capacity
    divider_question: "How much capacity does a goodput target need?"
    read: "§19.6"
    concept_questions: [10, 11, 12]
    land: "Capacity is sized for goodput at its acceptance, and utilization is paid for in waiting."
    minutes: 10
  - name: Budgets
    divider_question: "How does a spending limit hold, and which design pays?"
    read: "§19.7 to §19.9"
    concept_questions: [13, 14]
    land: "Reserve before dispatch, release only at settlement, and price whole designs per resolved ticket with the human fallback."
    minutes: 9.5

concept_questions:
  - id: 1
    q: "What goes into the cost of one attempt?"
    picture: "bill_step1..2: per-attempt stacked bars, model tokens then environment and assessment (NM 19.1)."
    numbers: "$0.240 against $0.069 of tokens; $0.410 against $0.329 per attempt (derived, calcs.nm191)."
    example: "Trailing container lease, cleanup, and triage after the last token (§19.2.1)."
    read: "§19.2.1"
  - id: 2
    q: "What does a real repair cohort cost per resolved task?"
    picture: "swe_step1..2: mean cost of resolved runs against cohort cost per resolved task, four public SWE-bench runs."
    numbers: "Run A: $856.86 / 168 = $5.10 against a $1.16 survivor mean (4.4 times); unresolved runs averaged $2.00; runs C and D 1.6 times (measured cost as recorded, model tokens only; MLSysIM SweBenchTrajectories)."
    example: "The 2024 SWE-agent run, the running case as a real system."
    read: "§19.2.2"
  - id: 3
    q: "How many failures does each accepted task carry?"
    picture: "multiplier: (1 - alpha)/alpha against acceptance, dots at 3 and 0.33 (book margin figure redrawn)."
    numbers: "3 at 25 of 100, 0.33 at 75 of 100 (NM 19.1)."
    example: "Cohort form beside the per-attempt planning form of Lecture 1."
    read: "§19.2.2"
  - id: 4
    q: "What does a published tariff charge for a cached prefix?"
    picture: "Exact excerpt of a provider price sheet (two rows, footnote on 0.05x cache hits)."
    numbers: "$3 fresh, $0.30 cached, $15 output per M tokens (the chapter's tariff); newer models 5 percent (Anthropic pricing page, retrieved 2026-10-19)."
    example: "The tariff the chapter's notebooks assume, on a real sheet."
    read: "§19.3.1"
  - id: 5
    q: "How much does prefix caching save on the 30-turn trajectory, and what remains?"
    picture: "resend_step1..2: per-call bill without and with ideal reuse."
    numbers: "892,500 logical against 51,500 fresh tokens; $2.767 against $0.497 (5.6 times); cached re-reads 50.8 percent of the cached bill; a 10 percent miss adds $0.227, 45.7 percent (NM 19.2, derived)."
    example: "A timestamp at the front of the system prompt."
    read: "§19.3.1"
  - id: 6
    q: "When does compaction pay, and what does a retry cap buy?"
    picture: "payback: compact minus keep against remaining calls at 10 and 5 percent cache rates; the estimate card for NM 19.4, whose Step 4 recalls Lecture 3's Brown et al. coverage in one line (sweep D3, 2026-10-19)."
    numbers: "Upfront 5.85 cents, 0.555 cents saved per call, payback 12 calls (23 at 5 percent); with 15 left, saves 1.92 cents or loses 1.97 cents (NM 19.3). Sequential retry $0.333, parallel $0.601 (1.8 times), strong $0.571 (NM 19.4). SWE-bench Lite: 15.9 percent at k=1, measured 39.1 percent at k=16 against 93.7 percent predicted (Brown et al. 2024 via MLSysIM)."
    example: "Hard tasks stay hard on every try."
    read: "§19.3.2, §19.3.3"
  - id: 7
    q: "How much does a faster model shorten the episode?"
    picture: "waterfall_step1..4 (book figure redrawn) with a credited photo of Gene Amdahl."
    numbers: "29.25 of 312.40 s is model time (9.4 percent); 4 times faster gives 290.46 s (1.08 times); speculative 292.05 s (1.07 times); instant 283.15 s (1.10 times); halving tests saves 122.8 s (NM 19.5, derived)."
    example: "Required tests and sandbox lifecycle as the non-model floor."
    read: "§19.4.1, §19.4.2"
  - id: 8
    q: "When does speculative decoding pay?"
    picture: "Equation anatomy of S_spec = (m+1)/(gamma r + 1) with two cases."
    numbers: "gamma 5, r 0.08: break-even 0.4; m 3.6 gives 3.29 times (episode 1.07 times); m 0.3 gives 0.93 times (314.65 s) (§19.4.4, derived)."
    example: "A hard reasoning task with low draft acceptance."
    read: "§19.4.4"
  - id: 9
    q: "What does a cascade save, and what can its gate cost?"
    picture: "frontierswe (real scatter), cascade_step1..3 (book figure redrawn), and the diagnose card."
    numbers: "FrontierSWE V2: $9 to $1,030 per trial, top score 10 times the runner-up's cost for 3 points, 21-point median spread (measured). Cascade $0.00998 against $0.06289 per accepted result (6.3 times); mean 1.72 s, worst 6.75 s against 4.90 s (NM 19.6). A 0.9 percent false-accept gate at $10 each adds $5,400 and gives $0.06431 per accepted result (§19.10, derived)."
    example: "A lint check replacing tier 1's tests."
    read: "§19.5"
  - id: 10
    q: "What does one arrival rate demand of each resource, and how does acceptance enter?"
    picture: "Credited datacenter photo with the Little's law build; exact excerpt of a provider's rate-limit page."
    numbers: "20 trajectories present, 60 calls and 1.8M tokens per minute, 90 percent of a 2M quota, admission ceiling 1.11 per minute; a 10 percent acceptance drop reaches 100 percent (NM 19.7, derived)."
    example: "A cache-aware quota that counts only uncached input (Anthropic rate-limits page, retrieved 2026-10-19)."
    read: "§19.6.1"
  - id: 11
    q: "What does higher utilization cost a trajectory?"
    picture: "inferencex (real serving sweep), checkout-queue photo, kingman_step1..2 (book margin figure redrawn)."
    numbers: "InferenceX, 8x H200: 16 times the users gives 5.1 times tokens per GPU, per-token time 9.8 to 31.5 ms (measured). Kingman: 7 s at 70 percent, 27 s at 90 percent (3.9 times) for 28.6 percent more throughput; holding $0.014 to $0.054; tail met with probability 0.26 over 30 calls (NM 19.8)."
    example: "A checkout line when the cashier is nearly always busy."
    read: "§19.6.2"
  - id: 12
    q: "When does owning capacity beat a per-token API?"
    picture: "breakeven: two cost lines with u* and the 52 percent operating point (book margin figure redrawn)."
    numbers: "Effective API price $19.2 per M output; u* 37.7 percent (23.1 percent without caching); at 52 percent $43.13 against $32.49, $10.64 an hour (NM 19.9, derived)."
    example: "Busy hours against round-the-clock commitment (exercise 8)."
    read: "§19.6.3"
  - id: 13
    q: "How does a spending limit hold across children and late bills?"
    picture: "Exact excerpt of SWE-agent's cost check (commit 3ea751c); budget_step1..5 (book figure redrawn)."
    numbers: "Run A's $4 cap (Kapoor et al. 2024, p. 1): 90 of 500 trajectories ended above $4, maximum $4.20 (measured, calcs.swe_cap). NM 19.10: release at local stop $1.65 against $0.65 truly free; late bill $0.70; $0.95 returns at close."
    example: "A canceled fuzzing child with a remote job still billing."
    read: "§19.7"
  - id: 14
    q: "Which architecture costs least per resolved ticket?"
    picture: "arch_step1..2 beside an exact excerpt of a real dependency-upgrade pull request; the Lighthouse 19.1 table at the synthesis."
    numbers: "Per automated acceptance $0.00937, $0.06912, $0.01675; per resolved ticket $25.54, $11.62, $6.53; loop 81.73 percent in 1.711 turns (NM 19.11, derived). Lighthouse 19.1: repair $3.74, research $1.75, remediation $29.21, support $0.76; savings recomputed."
    example: "pallets/flask #5493, opened and merged by a deterministic rewriter."
    read: "§19.8, §19.9"

concept_trace:
  - concept: "Cohort cost per accepted task"
    frame: "A real repair run spent $5.10 per resolved task; Each accepted task carries (1-alpha)/alpha rejected ones"
    shown_by: "swe_step2 (real cohorts) and multiplier with the cohort equation"
  - concept: "Prefix-cache pricing and compaction payback"
    frame: "Prefix caching cuts the 30-turn bill 5.6x; the quadratic term stays; Compaction pays only if enough calls remain to repay it"
    shown_by: "resend_step2 and payback (two tariffs)"
  - concept: "Critical-path acceleration ceiling"
    frame: "Predict: what does a 4x faster model buy?"
    shown_by: "waterfall_step1..4 with the 1/(1-f) ceiling revealed in the photo column"
  - concept: "Cascade and routing pricing"
    frame: "A cascade saves money only through its early exits; Diagnose: when does a cheaper gate cost more?"
    shown_by: "cascade_step1..3 and the harm card"
  - concept: "Trajectory goodput"
    frame: "Goodput, accepted tasks per minute, sets the admission rate"
    shown_by: "Three-step build: goodput defined (Definition 19.3) with admission rate G/alpha; Little's law and the 90 percent quota load; the 10 percent acceptance drop to 100 percent of the quota"
  - concept: "Queueing cost of utilization"
    frame: "Predict: from 70% to 90% busy, how much wait?"
    shown_by: "kingman_step1..2 with the equation, plus the measured InferenceX sweep"
  - concept: "Budget conservation"
    frame: "A limit checked after the charge cannot stop the charge; Predict: when may the root release the money?"
    shown_by: "real cost-check code and run A overshoot, then budget_step1..5"
  - concept: "Architecture pricing with human fallback"
    frame: "Price designs by cost per resolved ticket, human fallback included"
    shown_by: "arch_step1..2 (ranking flips)"
  - concept: "Dedicated capacity break-even (secondary)"
    frame: "Owning capacity wins only above the break-even load"
    shown_by: "breakeven"
  - concept: "Speculative decoding profitability (secondary)"
    frame: "Speculative decoding pays only when accepted drafts beat drafting"
    shown_by: "equation anatomy with both cases"

worked_examples:
  - name: "The token-price fallacy (NM 19.1)"
    steps: ["given: the two configurations of the hook table", "attempts $0.410 and $0.329", "cohorts $41 and $32.888 over 75 and 25 accepted", "result: $0.55 against $1.32, 2.4 times; with triage 8.1 times", "meaning: acceptance divides every term; the discount touched one"]
  - name: "Compaction payback (NM 19.3)"
    steps: ["given: 30,500 to 12,000 tokens at turn 16, 1,500-token summary, 15 calls left", "upfront 5.85 cents; 0.555 cents saved per call", "payback 12 calls: saves 1.92 cents", "at a 5 percent cache rate: payback 23 calls, loses 1.97 cents", "meaning: cheaper caching moves the profitable compaction point earlier"]
  - name: "Retry, parallel, or strong (NM 19.4)"
    steps: ["given: p 0.30 at $0.10 up to 5, or p 0.70 at $0.40", "coverage 83.2 percent, 2.773 attempts", "sequential $0.333; parallel $0.601; strong $0.571", "meaning: early stopping makes the cap a coverage choice; real tasks violate independence (Brown et al.)"]
  - name: "Three designs with human fallback (NM 19.11)"
    steps: ["given: rewriter 32 percent, single call 68 percent, loop 0.55/0.42/0.30; $35 fallback resolving 90 percent", "loop 81.73 percent in 1.711 turns, $0.013688 automated", "per automated acceptance the rewriter wins at $0.00937", "per resolved ticket: $25.54, $11.62, $6.53", "meaning: price the end-to-end policy; each point of acceptance saves $0.35 of fallback"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "Which repair agent costs less per accepted repair?"
    answer: "Frontier: $0.55 against $1.32 (NM 19.1)."
  - at_minute: 6
    type: retrieval
    prompt: "Lecture 18: when can delegation lower cost per accepted task if it uses 15 times the tokens of a chat and one agent 4 times?"
    answer: "Only if single-agent acceptance is at most 26.7 percent (3.75 multiple, NM 18.6)."
  - at_minute: 17.5
    type: concept_question
    prompt: "True or false: canceled charges leave the numerator; pending verdicts make the ratio provisional; zero accepted gives zero cost."
    answer: "False, true, false (§19.2.2)."
  - at_minute: 27.5
    type: estimate
    prompt: "Retry cheap (p 0.30, $0.10, up to 5), run 5 in parallel, or one strong call (p 0.70, $0.40)?"
    answer: "$0.333, $0.601, $0.571 (NM 19.4); with Lecture 3's measured coverage (39 percent at 16 samples against 94 predicted), the $0.333 drifts up."
  - at_minute: 32
    type: predict
    prompt: "Model calls take 29.25 s of 312.40 s. A 4 times faster model speeds the episode by?"
    answer: "1.08 times; ceiling 1.10 times (NM 19.5)."
  - at_minute: 42
    type: diagnose
    prompt: "A lint gate exits tier 1 cheaply; 0.9 percent of its exits are wrong at $10 each. Is the cascade still cheaper?"
    answer: "No: $0.06431 against $0.06289 per accepted result (§19.10)."
  - at_minute: 52
    type: predict
    prompt: "From 70 to 90 percent utilization, how much longer is the mean wait?"
    answer: "3.9 times, 7 s to 27 s (NM 19.8)."
  - at_minute: 58
    type: predict
    prompt: "A stopped child has $0.85 settled and $1 reserved for a remote job. How much may the root release?"
    answer: "Nothing until settlement; a local-stop release would free $1.65 against $0.65 truly free (NM 19.10)."

open_questions:
  - "Should benchmarks rank agents by cost per accepted task, and under whose prices?"
  - "Token prices fall 9 to 860 times a year; which term binds an agent in five years?"
  - "How should a team price a human reviewer's queue, delay, and errors?"

more_examples:
  - "Epoch AI lowest price at fixed capability: 21 thresholds, 9 to 860 times cheaper per year, median 46 (MLSysIM LowestPriceAtCapability)."
  - "Kapoor et al. 2024 (recalled in one line of the open-questions note; Lecture 13 shows the data)."
  - "A provider's rate limit that counts only uncached input toward its input-token limit (Anthropic rate-limits page)."
  - "InferenceX DeepSeek-R1 FP8 on 8x H200: throughput per GPU against per-user speed across concurrency 4 to 64."
  - "SWE-agent's per-instance cost limit defaults to $3 and is checked after each call is charged (commit 3ea751c)."
  - "Dependabot pull requests as a deterministic rule-based rewriter (pallets/flask #5493)."

further_reading:
