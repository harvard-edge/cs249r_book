notes_for_author:
  - "Real visuals added from outside the chapter: public SWE-bench trajectory costs (MLSysIM SweBenchTrajectories), Brown et al. coverage (MLSysIM), InferenceX (MLSysIM), Kapoor et al. Table A1, the provider price and rate-limit pages, SWE-agent source, and one Dependabot pull request. They name products and models in credits and artifacts; slide prose stays generic."
  - "The SWE-bench costs are model-token cost as each agent recorded it at list prices; they exclude sandbox and human cost. The slide and note say so."
  - "SWE-agent's cost check is quoted from the current main branch (commit 3ea751c); the 2024 run used version 0.x. The overshoot (90 of 500 above the $4 cap) is measured from that run; the code excerpt shows the mechanism in the current release."
  - "The chapter's NM 19.7 quota counts cached input at full weight; the real rate-limit page shown does not. The slide presents this as a contract difference, which the chapter's text anticipates."
  - "Figures print one decimal (290.5 s, 292.1 s) where notes give two (290.46 s, 292.05 s); both come from calcs.py. Speculative low case prints 314.65 s; the chapter rounds it to 314.6."
  - "Sweep 2026-10-19 (D3): the optional frame 'Real coverage grows far slower than independent retries predict' was cut; Lecture 3 owns the Brown et al. coverage data, recalled as Step 4 of the retry estimate (+1 min, independence prediction from calcs.py). The open-questions slide no longer redraws Kapoor et al. (Lecture 13 owns it); it shows the hook's bill instead. images/kapoor.svg/.pdf and coverage.svg/.pdf are now unused (deckcheck flags kapoor; it misses coverage because the word appears in slide text)."

