    url: "https://doi.org/10.1145/7239.7265"
    why: "Concurrent reservations on one balance, the root of budget conservation."
  - cite: "Armbrust et al., A View of Cloud Computing, 2010"
    url: "https://doi.org/10.1145/1721654.1721672"
    why: "Renting against owning capacity."

