    url: "https://arxiv.org/abs/2407.01502"
    why: "Why agent evaluations must report cost beside accuracy."
  - cite: "Kingman, The Single Server Queue in Heavy Traffic, 1961"
    url: "https://doi.org/10.1017/S0305004100036094"
    why: "Why waiting is the price of running near saturation."
  - cite: "Dean and Barroso, The Tail at Scale, 2013"
    url: "https://doi.org/10.1145/2408776.2408794"
