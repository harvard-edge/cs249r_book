xt><text x="560" y="385" text-anchor="middle" font-size="21" fill="#b45309">isolated</text><rect x="695.0" y="329.0" width="190" height="70" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/><text x="790" y="360" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Verifiers</text><text x="790" y="385" text-anchor="middle" font-size="21" fill="#b45309">tests</text><line x1="615" y1="192" x2="615" y2="128" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-gray)"/><text x="605" y="168" text-anchor="end" font-size="21" fill="#334155" font-weight="normal" font-style="normal">context</text><line x1="730" y1="128" x2="730" y2="192" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-gray)"/><text x="740" y="168" text-anchor="start" font-size="21" fill="#334155" font-weight="normal" font-style="normal">proposal</text><line x1="520" y1="264" x2="520" y2="328" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arr-purple)"/><text x="510" y="304" text-anchor="end" font-size="21" fill="#6d28d9" font-weight="normal" font-style="normal">dispatch</text><line x1="600" y1="328" x2="600" y2="264" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-gray)"/><text x="610" y="304" text-anchor="start" font-size="21" fill="#334155" font-weight="normal" font-style="normal">observation</text><line x1="790" y1="328" x2="785" y2="264" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-gray)"/><text x="797" y="304" text-anchor="start" font-size="21" fill="#334155" font-weight="normal" font-style="normal">evidence</text><line x1="656" y1="364" x2="694" y2="364" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-gray)"/></svg>