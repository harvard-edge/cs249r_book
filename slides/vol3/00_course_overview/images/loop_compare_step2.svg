<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><text x="10" y="30" text-anchor="start" font-size="25" fill="#0f172a" font-weight="bold" font-style="normal">A. A person closes the loop</text><rect x="70.0" y="57.0" width="290" height="70" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2"/><text x="215" y="88" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Model endpoint</text><text x="215" y="113" text-anchor="middle" font-size="21" fill="#0369a1">answers only</text><rect x="70.0" y="193.0" width="290" height="70" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.2"/><text x="215" y="224" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Developer</text><text x="215" y="249" text-anchor="middle" font-size="21" fill="#0f172a">carries everything</text><rect x="70.0" y="329.0" width="290" height="70" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/><text x="215" y="360" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Local terminal</text><text x="215" y="385" text-anchor="middle" font-size="21" fill="#b45309">make test</text><line x1="155" y1="192" x2="1