    shows: "Five-step build of Introduction figure 3."

worked_examples:
  - name: "The bill of one trajectory (NM 2.2, NM 19.2)"
    steps:
      - "Given: 30 turns, 8,000-token first prompt, 1,500 tokens appended per turn, 200 output tokens per call."
      - "Resent: 30 x 8,000 + 1,500 x (30 x 29)/2 = 892,500 tokens."
      - "Fresh with prefix reuse: 8,000 + 29 x 1,500 = 51,500; ratio 17.3."
      - "At $3 fresh, $0.30 cached, $15 output per million: $2.77 against $0.50, 5.6 times (illustrative)."
      - "Meaning: input grows with the square of the turns; the trajectory, not the call, is the unit of cost. Real check: 500 runs resent 26.4 times the characters they added."
  - name: "Horizon compounding (NM 1.1)"
    steps:
      - "Given: 99 percent per step, independent, unchecked."
      - "0.99^10 = 90.4 percent; 0.99^100 = 36.6 percent."
      - "Holding 90 percent at 100 turns needs 0.11 percent per step, 9.5 times lower."
      - "Meaning: only checks that catch and restore shorten the unchecked horizon; Lecture 1 owns the equation."
  - name: "Cost per accepted repair, measured"
    steps:
      - "Given: 500 runs, $185.73 total, 324 resolved by hidden tests."
      - "Per attempt $0.37; per accepted repair $185.73 / 324 = $0.57 (1.54 times)."
      - "176 rejected runs spent $82.02, 44 percent of the total."
      - "Meaning: every failed attempt is charged to the accepted ones."

active_learning:
  - at_minute: 12.5
    type: predict
    prompt: "A 100-step task, 99 percent per step: A 99, B 90, C 60, D 37 percent?"
    answer: "D, 36.6 percent (NM 1.1)."
  - at_minute: 20.5
    type: estimate
    prompt: "How many input tokens does a 30-turn append-only run send? A 50,000, B 200,000, C 900,000, D 5 million."
    answer: "C, 892,500 (NM 2.2). A is the size of the last call, 51,500."
  - at_minute: 35
    type: predict
    prompt: "What ended the real Django run? A tests passed, B human review, C the model printed a fixed string, D a step limit."
    answer: "C. The harness stops on the sentinel string; hidden tests ran afterward. No step limit, only a $3 cost ceiling."
  - at_minute: 38.5
    type: diagnose
    prompt: "Label six real incidents with the stack layer that failed."
    answer: "Model (WS 2.1), Memory (WS 6.1), Tools (WS 7.1), Runtime (WS 10.1), Learning (WS 17.1), Agents at Scale (WS 18.1)."
  - at_minute: 45.5
    type: predict
    prompt: "A freeze rule honored on 99 percent of turns: how often does it hold for all 30?"
    answer: "74 percent; 26 percent of runs break it at least once (§10.10, derived)."
  - at_minute: 54
    type: concept_question
    prompt: "Which task carries the largest authority: a read-only research agent, the repair agent in a sandbox, or a remediation agent changing production?"
    answer: "Remediation, A3. Research is A0 but still exposed through what it reads (WS 7.1 shows a real case)."
  - at_minute: 58.5
    type: discuss
    prompt: "Script, single call, or bounded loop for 10,000 dependency upgrades a month? What decides it?"
    answer: "Cost per accepted task under one acceptance contract, including the human fallback (previews NM 19.11)."
  - at_minute: 61.5
    type: retrieval
    prompt: "Close your notes: what do 36.6%, 892,500, $0.57, and 176 of 500 measure? Then the unit of engineering and the three exposures."
    answer: "Unchecked success over 100 steps; tokens resent in 30 turns; real cost per accepted repair; done-but-rejected runs. The trajectory; horizon, state, authority."

open_questions:
  - "What will limit delegated tasks first: model accuracy, cost per accepted task, or the evidence needed to accept the work?"
  - "When an agent's action cannot be undone, who should approve it, and how long may approval take?"
  - "If delegated tasks keep doubling in length, what must change in the runtime and not only in the model?"

more_examples:
  - "500 public SWE-bench Verified trajectories and evaluation reports (mini-SWE-agent 1.0.0, Claude 4 Sonnet)."
  - "METR Time Horizon 1.1 data (Kwa et al. 2025 method)."
  - "METR, Recent Frontier Models Are Reward Hacking, 2025 (quoted scorer patch)."
  - "Invariant Labs, GitHub MCP Exploited, 2025 (injected issue and leaking pull request)."
