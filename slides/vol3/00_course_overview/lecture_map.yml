chapter: 00_course_overview
lecture: "00"
title: Course Overview
subtitle: Agentic Machine Learning Systems (Volume III)
minutes: 75
notes_minutes: 70.5
core_minutes: 59    # notes tagged [CORE]; cutting every [OPTIONAL] note leaves this
target_ideas: 24
layer: trajectory   # dividers show the stack with the Trajectory bar lit; L0 spans the stack
thesis: "An agent is a model inside a loop that software closes, so its reliability and its cost are measured over the whole trajectory of calls, actions, and checks."

hook:
  minutes: "0-9"
  setup: "Figure 1 of the Introduction rebuilt in two steps: a developer closes the loop by hand, then a runtime closes it. Then a real repair: a published SWE-bench Verified run (django__django-12050, mini-SWE-agent 1.0.0 with Claude 4 Sonnet) that took 22 model calls and was resolved by hidden tests for $0.15. The cover photo, a steam-engine governor, returns as the loop that measures the world."
  question_to_class: "Which box in panel B decides that the bug is fixed?"
  payoff: "The runtime, on evidence from verifiers; the retrieval slide answers the hook with four numbers from the same running case."
  sources:
    - "Introduction §1.2, figure 1; §1.7 footnote 12 (Wiener)"
    - "SWE-bench/experiments, evaluation/verified/20250726_mini-v1.0.0_claude-sonnet-4-20250514; trajectories and report.json on swe-bench-submissions S3"
    - "Wikimedia Commons, Steam Engine Centrifugal Governor (brewbooks, CC BY-SA 2.0)"
driving_question: "Why can a model that writes a correct patch still fail to finish the task?"
running_example: "The repair agent (Lighthouse 1.1), shown with the chapter's illustrative numbers (99 percent per step; the 30-turn, 8,000 + 1,500-token trajectory; $2.10 attempts at 40 percent) and as a real system: 500 public SWE-bench Verified runs of mini-SWE-agent 1.0.0 with Claude 4 Sonnet ($185.73 in total, 324 resolved, mean 37.2 calls)."

segments:
  - name: One Task
    divider: "What happens when you ask an agent, rather than a chatbot, to fix a bug?"
    read: "Introduction, §1.1 and §1.2"
    minutes: 9
    concept_questions: [1, 2]
  - name: Longer Tasks
    divider: "How long are the tasks we delegate, and what does length do to success?"
    read: "Introduction, §1.6"
    minutes: 10.5
    concept_questions: [3, 4]
  - name: The Bill
    divider: "What does one trajectory cost, and why does the bill grow so fast?"
    read: "Introduction, §1.6 and §1.9; The Foundation Model, §2.8"
    minutes: 11.5
    concept_questions: [5, 6]
  - name: The Stack
    divider: "What is an agentic system made of?"
    read: "Introduction, §1.7 and §1.8"
    minutes: 10.5
    concept_questions: [7, 8, 9]
  - name: Who Checks
    divider: "Why can the model not report its own success?"
    read: "Introduction, §1.5"
    minutes: 9
    concept_questions: [10, 11]
  - name: Exposure
    divider: "How far does a task depart from one model call?"
    read: "Introduction, §1.4"
    minutes: 7.5
    concept_questions: [12]
  - name: The Course
    divider: "When is a loop worth building, and what will you be able to do?"
    read: "Introduction, §1.6.1 and §1.8"
    minutes: 11.5
    concept_questions: [13, 14]

concept_questions:
  - id: 1
    q: "What changes when an agent, rather than a chatbot, fixes a bug?"
    picture: "Introduction figure 1 redrawn at slide size, panel A then panel B (images/loop_compare_step*)."
    numbers: "None; the repair agent's budget (30 steps, 128,000-token window, Lighthouse 1.1) is in the notes."
    example: "A developer pasting errors into a chat window against a runtime that dispatches only granted actions."
    read: "§1.1, §1.2"
  - id: 2
    q: "What does one real repair trajectory look like?"
    picture: "Five turns of the real django__django-12050 trajectory (commands quoted exactly), then SWE-bench's hidden-test verdict; the steam-engine governor as the loop that measures the world [OPTIONAL]."
    numbers: "22 model calls, $0.15; hidden tests 1 of 1 target and 10 of 10 other tests pass (report.json)."
    example: "Django issue: a list passed to a query is silently coerced to a tuple."
    read: "§1.2 footnote 1 (SWE-bench), §1.7"
  - id: 3
    q: "How long are the tasks we now delegate?"
    picture: "METR Time Horizon 1.1 data replotted at slide size: p50 horizon against release date, frontier models in orange."
    numbers: "3.2 s (2019) to 17.4 h (2026), about 19,000 times; doubling 6.2 months overall, 4.2 since 2023 (METR benchmark_results_1_1.yaml; Introduction §1.6, figure 4; derived in calcs.py)."
    example: "Kwa et al. 2025 method: tasks timed on human experts."
    read: "§1.6"
  - id: 4
    q: "If each step is right 99 percent of the time, how often does a 100-step task succeed?"
    picture: "Predict vote, then the unchecked-success curve in three steps; then real resolution rate by run length for 500 SWE-bench runs [OPTIONAL]."
    numbers: "90.4 percent at 10 turns, 36.6 percent at 100; 0.11 percent per step holds 90 percent, 9.5 times lower (NM 1.1, illustrative). Real: 76 to 78 percent resolved under 30 calls, 39 percent at 70 or more (correlation)."
    example: "The repair agent."
    read: "§1.6, Napkin Math 1.1"
  - id: 5
    q: "How many input tokens does a 30-turn append-only trajectory send?"
    picture: "Estimate activity with a Given card; worked arithmetic beside resent and fresh curves."
    numbers: "892,500 resent against 51,500 fresh, 17.3 times; last call 51,500 tokens, 40 percent of 128,000 (NM 2.2; §1.9). Real: the Django run sent 13.4 times the characters it added; 26.4 times across 500 runs (swebench_data.py)."
    example: "The repair agent's 30-turn budget."
    read: "§1.9; The Foundation Model §2.8"
  - id: 6
    q: "What does an accepted task cost?"
    picture: "Bill bars at the chapter's tariff [OPTIONAL]; real per-attempt and per-accepted bars from 500 runs."
    numbers: "$2.77 against $0.50, 5.6 times (NM 19.2, hypothetical prices). Real: $0.37 per attempt, $0.57 per accepted repair (1.54 times); 44 percent of $185.73 spent on 176 rejected runs."
    example: "The SWE-bench Verified run's own reported costs."
    read: "§1.6; Agent Economics §19.3"
  - id: 7
    q: "What is an agentic system made of?"
    picture: "Kit stack built one layer per step, Trajectory bar last, with the Django run mapped onto the layers."
    numbers: "None."
    example: "Model calls, growing prompts, shell commands in a container, the loop and its stop rule."
    read: "§1.7, §1.8"
  - id: 8
    q: "What ends a run of a real coding agent?"
    picture: "Predict vote; then mini-SWE-agent 1.0.0 source: the loop and the stop rule (exact, cuts marked)."
    numbers: "Cost ceiling $3, no step limit (swebench.yaml, v1.0.0)."
    example: "The harness that produced the Django run."
    read: "§1.7.1 (the bare while-loop listing)"
  - id: 9
    q: "Which layer failed in each real incident?"
    picture: "Six incident cards, layer revealed on step 2."
    numbers: "16 percent of requests (WS 2.1); CA$650.88 (WS 6.1); private repository leaked (WS 7.1); production database deleted (WS 10.1); 39 of 128 runs hacked (WS 17.1); 50 subagents, about 15 times chat tokens (WS 18.1)."
    example: "METR's quoted code line that rewrote the scorer's clock."
    read: "War Stories 2.1, 6.1, 7.1, 10.1, 17.1, 18.1"
  - id: 10
    q: "Why can the model not report its own success?"
    picture: "The real last message of astropy__astropy-13398 beside its hidden-test report; then 176 of 500."
    numbers: "Hidden tests: 0 of 4 target tests pass, 5 of 68 previously passing tests broken; 500 of 500 runs ended Submitted, 176 rejected."
    example: "The fail-plausible fault (§1.5.1)."
    read: "§1.5.1"
  - id: 11
    q: "How often does a 99 percent instruction hold across 30 turns, and where must the rule live?"
    picture: "Predict, then the compliance curve; the invariant-closure focus slide; the closure evidence ladder with the astropy run placed on it [OPTIONAL]."
    numbers: "0.99^30 = 74 percent; 26 percent violate at least once (Agent Harness §10.10, derived); WS 10.1 production database deleted under a prompt-only freeze."
    example: "The freeze as a dispatch-time rule."
    read: "§1.5.2; The Agent Harness §10.10"
  - id: 12
    q: "How far does a task depart from one model call?"
    picture: "Introduction figure 3 redrawn in five steps (origin, repair, research, remediation, support); vote on authority; real injected issue and leaking pull request [OPTIONAL]."
    numbers: "Repair H about 100, S2, A1; research H at least 1,000, S3, A0; remediation H about 20, S3, A3; support H at most 3, S1, A0 (Lighthouses 1.1 to 1.4)."
    example: "Invariant Labs' GitHub MCP demonstration (WS 7.1)."
    read: "§1.4, §1.4.1"
  - id: 13
    q: "When is a loop worth more than a script?"
    picture: "Discussion with the three cost-per-accepted-task bars; retrieval with the governor photo."
    numbers: "$5.25, $3.63, $3.50 (NM 1.2, illustrative); break-even acceptance 0.58 (notes)."
    example: "10,000 dependency upgrades a month (NM 19.11, previewed without numbers)."
    read: "§1.6.1; Agent Economics §19.11 preview"
  - id: 14
    q: "Where does each lecture sit, and what will students be able to do?"
    picture: "Kit course_order; outcomes with prerequisites and weekly rhythm."
    numbers: "Twenty lectures."
    example: "The book's three questions (§1.8.3), in the notes."
    read: "§1.8"

