notes_for_author:
  - "Lecture 1's recall slide says Lecture 0 asked students to predict the 100-step task; Lecture 0 still poses it, now without the answer, so that recall reads correctly as the reveal."
  - "Open question 1 (ten times fewer errors) is close in spirit to Lecture 1's concept question 'A stronger model: which job moves into it?'. It is kept as written per the lead's instruction; consider rewording one of them."
  - "The leaderboard plot counts only submissions whose results.json is published (128 of 182 folders; the newest 2026 folders return 404) and only one-attempt submissions (45)."
  - "Product and model names appear in credits, the loop bars, and the leaderboard captions, which are measured artifacts."
