chapter: 00_course_overview
lecture: "00"
title: Course Overview
subtitle: Agentic Machine Learning Systems (Volume III)
minutes: 75
notes_minutes: 70.5
core_minutes: 57    # notes tagged [CORE]; cutting every [OPTIONAL] note leaves this
target_ideas: 20
layer: trajectory   # dividers show the stack with the Trajectory bar lit; L0 spans the stack
thread_tag: "H·S·A thread: previews all three exposures"   # golden-thread line under the locator on "Every lecture answers three questions about one task" (L0 has no goals slide; sweep D4, 2026-10-19)
thesis: "An agent is a model inside a loop that software closes, so its reliability and its cost are measured over the whole task."

# Author's decision, 2026-10-19: Lecture 0 is the motivational overview of the
# course. It shows why the subject matters now, what it is, what students will
# be able to do, and how the course runs. It does not repeat Lecture 1: no
# horizon curve or 36.6 percent reveal, no METR task-length plot, no 176-of-500
# reveal, no cost per accepted task ($0.57 or the $5.25/$3.63/$3.50 bars), no
# evidence ladder, no invariant-closure focus slide, no H·S·A build, no loop
# figure, no harness stop-rule code. Each is named once, at most, as a promise.

hook:
  minutes: "1.5-8"
  setup: "A published SWE-bench Verified repair (django__django-12050, mini-SWE-agent 1.0.0 with Claude 4 Sonnet): five of its 22 model calls quoted exactly, then the benchmark's verdict, resolved. Students then guess what it cost."
  question_to_class: "What did this repair cost? A $0.15, B $1.50, C $15, D $150."
  payoff: "A, $0.15 for 22 model calls. The next slides show why this matters now: the public leaderboard rose from 4.4 to 79.2 percent, and a coding agent deleted a production database. The retrieval slide returns to the repair."
  sources:
    - "SWE-bench/experiments, evaluation/verified/20250726_mini-v1.0.0_claude-sonnet-4-20250514/per_instance_details.json (cost 0.1474131, api_calls 22, resolved true)"
    - "swe-bench-submissions S3, trajs/django__django-12050 (commands quoted)"

driving_question: "Why does an agent that can already fix real bugs for cents need a semester of systems engineering?"

running_example: "The repair agent (Lighthouse 1.1), shown as a real system by one published repair, django__django-12050 (22 calls, $0.15, resolved), and placed among the four lighthouses on 'Four kinds of agent recur through the course'."

segments:
  - name: Why Now
    divider: "Why do agents deserve a semester now?"
    read: "Introduction, §1.1"
    minutes: 12.5
    concept_questions: [1, 2, 3, 4]
    land: "Agents already fix real issues for cents, the best public results rose from 4.4 to 79.2 percent in about two years, and they have already failed in public."
  - name: The Subject
    divider: "What is an agentic system made of?"
    read: "Introduction, §1.1, §1.2, and §1.8"
    minutes: 15
    concept_questions: [5, 6, 7, 8]
    land: "The same model resolves far more issues inside a loop, and the loop is a six-layer system in which each layer has already failed in production."
  - name: Your Skills
    divider: "What will you be able to build and judge?"
    read: "Introduction, §1.8"
    minutes: 13.5
    concept_questions: [9, 10]
    land: "Each part of the course gives one capability, tied to a real system students have now seen."
  - name: The Course
    divider: "How does the course run?"
    read: "Introduction, §1.8"
    minutes: 13.5
    concept_questions: [11, 12, 13]
    land: "Twenty lectures follow the stack in dependency order, organized by three questions and four recurring agents."
  - name: First Taste
    divider: "Two questions the course will answer"
    read: "Introduction, §1.6; The Foundation Model, §2.8"
    minutes: 7
    concept_questions: [14]
    land: "Students leave with two written guesses that Lectures 1 and 2 answer."

concept_questions:
  - id: 1
    q: "What does a software agent do with a real bug?"
    picture: "Five quoted calls of the django__django-12050 trajectory, then the benchmark's verdict"
    numbers: "22 model calls; resolved (per_instance_details.json)"
    example: "The repair agent as a real system"
    read: "§1.2 footnote 1 (SWE-bench)"
  - id: 2
    q: "What does one repair attempt cost?"
    picture: "Predict with four choices; A highlighted"
    numbers: "$0.15 (calcs.py from per_instance_details.json)"
    example: "Same run"
    read: "none (Lecture 1 builds the unit of cost)"
  - id: 3
    q: "How quickly have agents improved on real issues?"
    picture: "Every one-attempt SWE-bench Verified submission over time, best-so-far line"
    numbers: "22 of 500 (4.4 percent, October 2023) to 396 of 500 (79.2 percent, December 2025); 45 one-attempt submissions of 128 with results files (calcs.py)"
    example: "Public leaderboard data"
    read: "Jimenez et al. 2024"
  - id: 4
    q: "What happens when an agent acts on a live system?"
    picture: "The developer's screenshot of the agent's admission, with one line: the freeze existed only in the prompt"
    numbers: "none"
    example: "WS 10.1, previewed in one line (sweep D3, 2026-10-19: 1.5 min, no question answered); Lecture 10 tells it in full and asks what would have stopped it"
    read: "§1.1"
  - id: 5
    q: "What is an agent?"
    picture: "Steam-engine governor photo; one sentence: a model inside a loop that software closes"
    numbers: "none"
    example: "The 22 Django calls as the loop; Wiener 1948 in the note"
    read: "§1.1"
  - id: 6
    q: "What does a loop add to the same model?"
    picture: "Paired bars, one call against a loop, built in two steps"
    numbers: "GPT-4 (1106) 14 to 112 (8.0x); Claude 3 Opus 35 to 79 (2.3x) (calcs.py, SWE-bench Verified submissions of 2 April 2024)"
    example: "SWE-bench retrieval baseline against SWE-agent"
    read: "Yang et al. 2024"
  - id: 7
    q: "What is an agentic system made of?"
    picture: "Kit stack built one layer per step, then the Trajectory bar"
    numbers: "none"
    example: "The Django run mapped onto four layers"
    read: "§1.8"
  - id: 8
    q: "Which layer failed in each public incident?"
    picture: "Six incident cards, labels revealed"
    numbers: "16 percent (WS 2.1); CA$650.88 (WS 6.1); 39 of 128 (WS 17.1); 50 subagents, about 15x tokens (WS 18.1)"
    example: "Diagnose activity; each war story previewed in one line"
    read: "the owning lectures"
  - id: 9
    q: "What will students be able to do for each layer?"
    picture: "Two frames of three cards, each a real system with a capability"
    numbers: "none"
    example: "Anthropic postmortem timeline; Air Canada; MCP pull request; Replit messages; DeepSeek-R1 length curve; Anthropic research architecture"
    read: "§1.8.1"
  - id: 10
    q: "Which task would you hand to an agent today?"
    picture: "Three tasks beside a call-center photo"
    numbers: "none"
    example: "Repair, support, and remediation work"
    read: "§1.4 (lighthouses)"
  - id: 11
    q: "Where does each lecture sit?"
    picture: "Kit course_order figure; then a find-it-on-the-map activity"
    numbers: "twenty lectures"
    example: "Three symptoms located on the map"
    read: "§1.8.1"
  - id: 12
    q: "What organizes the course?"
    picture: "The book's H·S·A locator beside the book's three questions"
    numbers: "none"
    example: "Cost per accepted task, H·S·A exposures, invariant closure, named only"
    read: "§1.8.3"
  - id: 13
    q: "Which agents recur, and how does each week run?"
    picture: "Four lighthouse cards with two photos; the book site screenshot with three cards"
    numbers: "none"
    example: "Repair agent in every lecture"
    read: "§1.4, §1.8.2"
  - id: 14
    q: "Two questions to carry: unchecked success over 100 steps, and tokens sent over 30 turns"
    picture: "Predict with four choices (no reveal); estimate card beside the measured prompt size of every Django call"
    numbers: "Given only: 99 percent per step (NM 1.1); 30 turns, 8,000 + 1,500 tokens (NM 2.2); measured 5.5k to 29.6k characters per call. Answers in notes for the instructor only."
    example: "Lectures 1 and 2 answer them"
    read: "§1.6; §2.8"

concept_trace:   # Lecture 0 owns no concepts (course plan, ownership table); it names these once as promises
  - concept: "Trajectory as the unit of engineering (named; L1 owns)"
    frame: "An agentic system is six layers serving one task"
    shows: "Stack build ending on the Trajectory bar with the Django run mapped onto it; recalled on the retrieval slide."
  - concept: "The book's three questions and the golden thread (named; L1 owns H·S·A, invariant closure, cost per accepted task)"
    frame: "Every lecture answers three questions about one task"
    shows: "Book H·S·A locator beside the three questions, each with its name."
  - concept: "Lighthouse workloads (named; L1 owns)"
    frame: "Four kinds of agent recur through the course"
    shows: "Four cards, two with photos."

worked_examples: []   # Lecture 0 works no example; the first-taste questions are answered in Lectures 1 and 2

active_learning:
  - at_minute: 5.5
    type: predict
    prompt: "What did this repair cost?"
    answer: "A, $0.15"
  - at_minute: 8
    type: predict
    prompt: "How many real issues do agents now fix?"
    answer: "D, about 80 percent: 79.2 percent in December 2025"
  - at_minute: 17.5
    type: predict
    prompt: "What does a loop add to the same model?"
    answer: "GPT-4 14 to 112 (8.0x); Claude 3 Opus 35 to 79 (2.3x)"
  - at_minute: 23.5
    type: diagnose
    prompt: "Which layer failed in each incident?"
    answer: "Model, Memory, Tools, Runtime, Learning, Scale as labeled"
  - at_minute: 37.5
    type: discuss
    prompt: "Which task would you hand to an agent today, and what would you need to see first?"
    answer: "No single answer; tests and undo for upgrades, limits and approval for refunds, approval and confirmed recovery for the rollback"
  - at_minute: 46
    type: map
    prompt: "Where on the map would you look first?"
    answer: "Lecture 2; Lecture 11; Lecture 14"
  - at_minute: 56
    type: predict
    prompt: "How often does a 100-step task succeed? (not revealed)"
    answer: "For the instructor: D, 36.6 percent; Lecture 1 reveals it"
  - at_minute: 59
    type: estimate
    prompt: "How many tokens does a 30-turn run send? (not revealed)"
    answer: "For the instructor: C, 892,500; Lecture 2 works it out"
  - at_minute: 62.5
    type: retrieval
    prompt: "Close your notes: cost of the Django repair, what a loop did for GPT-4, the six layers, the unit of engineering"
    answer: "$0.15 in 22 calls; 14 to 112, 8.0x; Model to Scale; the trajectory"

open_questions:   # distinct from Lecture 1's three
  - "If models made ten times fewer errors, which of the runtime's checks could you remove, and which must stay?"
  - "When an agent learns from its own recorded runs, what stops it from learning to pass the check instead of doing the task?"
  - "When one agent hands part of a task to another, how much of its authority should the second agent receive?"

more_examples:
  - "SWE-bench Verified leaderboard submissions (github.com/SWE-bench/experiments)"
  - "Published mini-SWE-agent trajectories (swe-bench-submissions S3)"
  - "Incident sources of War Stories 2.1, 6.1, 7.1, 10.1, 17.1, 18.1"
  - "DeepSeek-R1 figure 3 (response length during RL)"

left_to_reading:
  - concept: "Everything Lecture 1 owns: closed loop, H·S·A definitions, invariant closure, evidence levels, task contract, horizon compounding, cost per accepted task, six-phase turn"
    why: "Author's decision of 2026-10-19: Lecture 0 motivates and does not repeat Lecture 1."
  - concept: "The 30-turn resend arithmetic and its pricing"
    why: "Owned by Lectures 2 and 19; Lecture 0 poses the estimate only."

closing:
  return_to_hook: "Retrieval with the governor photo: the Django repair's cost, the loop's effect on GPT-4, the six layers, and the unit of engineering, then one question each student wants answered."
  read_and_practice: ["Introduction §1.1 to §1.8", "Open one published trajectory (swe-bench-submissions S3)"]
  further_reading:
    - cite: "Jimenez et al., SWE-bench: Can Language Models Resolve Real-World GitHub Issues?, ICLR 2024"
      url: "https://arxiv.org/abs/2310.06770"
      why: "The benchmark behind the hook and the leaderboard plot."
    - cite: "Yang et al., SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering, NeurIPS 2024"
      url: "https://arxiv.org/abs/2405.15793"
      why: "The loop behind the 14 to 112 comparison."
    - cite: "Yao et al., ReAct: Synergizing Reasoning and Acting in Language Models, ICLR 2023"
      url: "https://arxiv.org/abs/2210.03629"
      why: "The reason, act, and observe loop."
    - cite: "Wiener, Cybernetics, 1948"
      url: "https://mitpress.mit.edu/9780262730099/cybernetics/"
      why: "Feedback control, behind the governor photo."
  bridge: "Lecture 1 (Introduction): Why can a model that generates a fluent, correct action still fail to complete an autonomous task?"

