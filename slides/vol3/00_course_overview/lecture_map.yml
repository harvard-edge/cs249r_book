    why: "Lecture 1 shows it once, as the chapter does; the profile bars it elsewhere."
  - concept: "Task contract, six-phase turn, workflow-against-loop arithmetic"
    why: "Owned by Lecture 1; Lecture 0 mentions them in notes only."

closing:
  return_to_hook: "Retrieval with the governor photo: four numbers from the repair agent (36.6 percent, 892,500 tokens, $0.57, 176 of 500), then the unit of engineering and the three exposures."
  read_and_practice: ["Introduction §1.1 to §1.8", "Checkpoint 1.1", "Open one published trajectory (swe-bench-submissions S3)"]
  further_reading:
    - cite: "Introduction, §1.1 to §1.8"
      url: "https://mlsysbook.ai"
      why: "Every idea previewed today."
    - cite: "Kwa et al., Measuring AI Ability to Complete Long Software Tasks, arXiv:2503.14499, 2025"
      url: "https://arxiv.org/abs/2503.14499"
      why: "How task length is measured, and its doubling."
    - cite: "Jimenez et al., SWE-bench: Can Language Models Resolve Real-World GitHub Issues?, ICLR 2024"
      url: "https://arxiv.org/abs/2310.06770"
      why: "The repair benchmark and its hidden tests."
    - cite: "Saltzer and Schroeder, The Protection of Information in Computer Systems, Proc. IEEE, 1975"
      url: "https://doi.org/10.1109/proc.1975.9939"
      why: "Least privilege and complete mediation behind authority bounds."
    - cite: "Saltzer, Reed, and Clark, End-to-End Arguments in System Design, ACM TOCS, 1984"
      url: "https://doi.org/10.1145/357401.357402"
      why: "Why only an endpoint that knows the task can accept it."
  bridge: "Lecture 1 (Introduction): Why can a model that generates a fluent, correct action still fail to complete an autonomous task?"

