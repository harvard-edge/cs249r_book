notes_for_author:
  - "2026-10-18, first build. Cover is a credited real photo (steam-engine centrifugal governor, brewbooks, CC BY-SA 2.0) shown again on the feedback-loop slide and the retrieval slide; no blueprint cover, since the Introduction's blueprint belongs to Lecture 1."
  - "Real data added beyond the plan: the running case is shown as a real system through 500 public SWE-bench Verified runs (mini-SWE-agent 1.0.0, Claude 4 Sonnet): one resolved trajectory, one confidently wrong one with its hidden-test report, measured cost per accepted repair, resolution by run length, and measured resend in characters. images/swebench_data.py regenerates the CSVs from the public bucket."
  - "The leaderboard reports 64.93 percent resolved for this submission; counting per_instance_details.json gives 324 of 500 (64.8 percent). Slides use 324 of 500 and say so in SOURCES.yml."
  - "Deviation from the plan: the stack segment comes before the incident cards so students can label incidents by layer; the fail-plausible segment follows. The incident cards keep the plan's six war stories."
  - "Deviation: the plan's 'one photo or screenshot per layer' on the stack build is replaced by the real Django run mapped onto the layers and the real agent-loop source on the next slides."
  - "Product names appear only where the war stories and the real run name them (Claude 4 Sonnet as the run's model; GitHub MCP)."
  - "deckcheck flags every 'Lecture N' callback because the other Volume III decks are not built yet; each callback follows the ownership table."
