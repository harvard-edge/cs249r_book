  touches_reused: ["Lecture 1: iron law, D·A·M (one line each)", "Lecture 8: MFU, profiling (MFU computed on the roofline frame)", "Lecture 10b: calibration as a gate (recalled; measured in Lecture 12b)", "Lecture 11: roofline and ridge 295 FLOP/byte, Amdahl, CMOS power (recalled, not rebuilt)"]
