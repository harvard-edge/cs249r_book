closing:
  return_to_hook: "Back to the two bars. '10 TOPS at 0.5 W' is a number at one operating point, at an unstated boundary, in burst. Each segment named one missing condition: the load and statistic (one leaf p99 10 ms, all leaves 140 ms), the boundary (roofline 40,200 against MLPerf 5,000 images/s), the scenario (one GPU, 0.28 ms or 44,411 per second), and the power boundary and heat (0.10 against 0.24 Wh; an iPhone losing 41.5 percent). Two gray tags point to Lecture 12b: the noise and the quality held."
  read_and_practice: ["§12.1 to §12.3, §12.4.4, §12.5, §12.6.4 to §12.6.5, §12.7, §12.10", "self-check questions at the end of each section", "Napkin Math 12.1 to 12.4 by hand; Checkpoint 12.1 (decoding vendor claims)", "time one model on your own laptop twice: once with a host timer and no warm-up, once with warm-up, a synchronize barrier, 30 repeated runs, and p50 and p99; compare"]
  further_reading:
    - cite: "Benchmarking, §12.2, §12.3, §12.5, §12.7"
      url: "https://mlsysbook.ai"
      why: "Benchmark carpentry, granularity with Napkin Math 12.1, time to quality, power boundaries and duty cycle."
    - cite: "Reddi et al., MLPerf Inference Benchmark, ISCA 2020"
      url: "https://doi.org/10.1109/isca45697.2020.00045"
      why: "Why the four scenarios exist and how LoadGen enforces them."
    - cite: "Dean and Barroso, The Tail at Scale, CACM 2013"
      url: "https://doi.org/10.1145/2408776.2408794"
      why: "The measured fan-out table and the tail-tolerant techniques Lecture 13 builds on."
    - cite: "Tschand et al., MLPerf Power: Benchmarking the Energy Efficiency of Machine Learning Systems from uWatts to MWatts, HPCA 2025"
      url: "https://doi.org/10.1109/hpca61900.2025.00092"
      why: "Measurement boundaries and calibrated instruments across tiny, edge, and data-center systems."
    - cite: "Mattson et al., MLPerf Training Benchmark, MLSys 2020"
      url: "https://arxiv.org/abs/1910.01500"
      why: "Time to quality, quality targets, and why training results need several runs."
    - cite: "MLCommons, MLPerf results and rules"
