notes_for_author:
  - "The hook's 10 TOPS at 0.5 W against 3 TOPS at 2 W (§12.7) names no device and is not labeled illustrative in the chapter; the slide labels it illustrative and segment 4 supplies measured throttling (Lee et al. 2019; Tummalapalli et al. 2026). The chapter could label it as a scenario."
  - "The 15 ms mean against 150 to 200 ms p99 (§12.10) is illustrative in the chapter; it appears only as a labeled strip under the measured Dean and Barroso table."
  - "Napkin Math 12.1's 'about 5,000 images/s' MLPerf Training per-accelerator figure names no round or submission. Before building, read a specific MLPerf Training ResNet result (the benchmark was retired after v4.0) to cite it; if none matches, the slide says 'chapter value'."
  - "Lee et al. 2019 Figure 8 values (iPhone Xs CPU about 20 to 26 ms, GPU about 2.4 to 3.9 ms, Pixel 3 GPU about 12.8 ms over 200 s) are read from the published plot and labeled approximate. Its model is MobileNet v1, not V2."
  - "Tummalapalli et al. 2026 (arXiv 2603.23640) is a preprint and its workload is an LLM (Qwen 2.5 1.5B, 4-bit), not MobileNet; it is the second panel, labeled with workload and source."
  - "MLPerf Tiny visual wake words uses a MobileNetV1 0.25x reference, not MobileNetV2; the slide says so. The two Syntiant rows are two published operating points of one chip."
  - "MLPerf Inference v5.0 values come from summary_results.json in mlcommons/inference_results_v5.0 (read 2026-10-16), closed division, available systems; the RTX 4090 rows are a GATEOverflow submission. The 3,550/s single-stream rate is derived (1 / 0.2817 ms) and labeled derived. The current rules no longer list a ResNet-50 Server latency bound, so the slide does not state one."
  - "Lighthouse 12.3's table 18 (ECE 0.031 -> 0.089, edge cases 68.2 -> 61.4) is assumed in the chapter; the slide says 'assumed values'. No measured calibration-after-quantization data was read for this plan; a candidate is to read one published INT8 calibration study before building, otherwise segment 5's measured data is Sandler et al., Chu et al., Recht et al., and the MLPerf rules."
  - "The chapter gives MobileNetV2 3.5M parameters and 600 MFLOP; Sandler et al. Table 4 gives 3.4M and 300M multiply-adds (600 MFLOP). The slide quotes the paper's values on the paper's plot."
  - "Example 12.3, Lighthouse 12.2, and fig-benchmarking-mobilenet-waterfall are illustrative board values; the slides label them so."
  - "No \\mlsysfocus planned: the chapter has no single key law. If one is wanted, the duty-cycle equation (P_avg = d P_active + (1 - d) P_standby) is the candidate."

