<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="A 3 times faster model stage shrinks a 50 ms request only to 43 ms.">
  <rect x="0" y="0" width="180" height="122" fill="#ffffff"/>
  <text x="90" y="16" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">3× → 1.2×</text>
  <!-- before: 40 ms other + 10 ms model, 3.44 px/ms -->
  <text x="4" y="36" font-size="12" fill="#333333">before</text>
  <text x="176" y="36" font-size="12" fill="#555555" text-anchor="end">50 ms</text>
  <rect x="4" y="41" width="137.6" height="20" fill="#cccccc"/>
  <rect x="141.6" y="41" width="34.4" height="20" fill="#e67817" stroke="#ffffff" stroke-width="1"/>
  <text x="72.8" y="55.5" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">other</text>
  <text x="176" y="75" font-size="12" font-weight="bold" fill="#e67817" text-anchor="end">model</text>
  <!-- after: 40 ms other + 3.33 ms model -->
  <text x="4" y="94" font-size="12" fill="#333333">after</text>
  <text x="153" y="94" font-size="12" fill="#555555" text-anchor="end">43 ms</text>
  <rect x="4" y="99" width="137.6" height="20" fill="#cccccc"/>
  <rect x="141.6" y="99" width="11.5" height="20" fill="#e67817" stroke="#ffffff" stroke-width="1"/>
  <text x="72.8" y="113.5" font-size="12" font-weight="bold" fill="#444444" text-anchor="middle">other</text>
</svg>
