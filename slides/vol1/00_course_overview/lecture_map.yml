active_learning:
  - at_minute: 3.5
    type: predict
    prompt: "How much energy does one 500-token answer take? A 0.5 J, B 50 J, C 500 J, D 50,000 J."
    answer: "C, hundreds of joules; Google measured 864 J for its median prompt. A pictures the phone doing the work; D pictures a whole datacenter for one answer."
  - at_minute: 10.5
    type: predict
    prompt: "What share of world electricity did datacenters use in 2024? A 0.1, B 1.5, C 10, D 25 percent."
    answer: "B, about 1.5 percent, 415 TWh (IEA 2025), with about 945 TWh projected for 2030."
  - at_minute: 23
    type: concept_question
    prompt: "Which of these boxes did your ML classes teach? (hand raise per box on the Sculley diagram)"
    answer: "Almost everyone: the model code. Few: the gray boxes, which often take most of the engineering effort."
  - at_minute: 25
    type: discuss
    prompt: "Name one model you used today. Where did it run? What data trained it? Who would notice if it got worse?"
    answer: "Phone photo search or keyboard prediction (phone), a chatbot (datacenter), feed recommendations (trained on clicks). Most do not know who would notice; that is the operations layer."
  - at_minute: 38
    type: estimate
    prompt: "How many H100-class GPUs serve 2.5 billion prompts a day of about 500 tokens? A about 100, B about 1,000, C tens of thousands, D about 10 million."
    answer: "C, about 16,000 at average load (estimate); more for peaks. Lecture 13 teaches the calculation."
  - at_minute: 48
    type: diagnose
    prompt: "Match each lighthouse workload to where it runs: datacenter, phone, or microcontroller."
    answer: "ResNet-50, GPT-2 and Llama, DLRM: datacenter. MobileNetV2: phone. Keyword spotting: microcontroller."
  - at_minute: 55
    type: discuss
    prompt: "Where should a wake-word detector run: on the device or in the cloud? (first taste; not settled today)"
    answer: "Expected: on the device, for energy, privacy, and offline use; the question after the wake word goes to the cloud. Lecture 2 settles it with numbers."
  - at_minute: 59
    type: predict
    prompt: "Which costs less energy per answer on the same accelerator: one user at a time, 100 users at once, or the same? (first taste; not revealed)"
    answer: "Most choose 100 users. Left open; Lecture 13 measures both loads."
  - at_minute: 62
    type: retrieval
    prompt: "Which layer explains each part of today's answer: (a) the chip that computes it, (b) how many users share that chip, (c) noticing when answers get worse, (d) 600 MWh a day for one service?"
    answer: "Hardware (L11); serving (L13); operations (L14); applications (L15)."

open_questions:
  - "When a datacenter and a town need the same power line, who should get it, and what should decide?"
  - "Should your phone's assistant run on the phone or in the cloud? What decides it?"
  - "When a model is wrong and nobody notices, whose job was it to notice?"

