    concept_questions: [12]

concept_questions:
  - id: 1
    q: "How much energy does one chatbot answer take?"
    picture: "Phone, then the Wenatchee datacenter; worked example with a Given card; bars of one answer, Google's measured prompt, and charging a phone on a linear axis; one day of ChatGPT prompts against one GPT-3 training run."
    numbers: "700 W GPU + 300 W host share = 1,000 W; 114 users x 8 tokens/s = 912 tokens/s; about 1.1 J per token; about 548 J per 500-token answer (Napkin Math 13.5). Measured 864 J (Elsworth et al. 2025). Phone charge about 40,000 J. 2.5 billion prompts x 0.24 Wh is about 600 MWh a day against 1,287 MWh for GPT-3 (estimate)."
    example: "The opening chatbot question."
    read: "Model Serving, Napkin Math 13.5; Introduction §1.1"
  - id: 2
    q: "How much has the demand for computation grown?"
    picture: "GTX 580 die photo beside the book's training-compute plot (Introduction §1.8, figure 6)."
    numbers: "About 8 orders of magnitude from AlexNet to GPT-4-class models; doubling roughly every five to six months (Sevilla et al. 2022 measured about six). AlexNet: two consumer GPUs for about six days."
    example: "GPT-3 on a hypothetical 1,024-GPU A100-class cluster (Napkin Math 1.2)."
    read: "§1.3.3, §1.8"
  - id: 3
    q: "How much energy does AI use at the scale of the grid?"
    picture: "Substation beside a datacenter in The Dalles, Oregon; IEA bars."
    numbers: "Datacenters used about 415 TWh in 2024 (about 1.5 percent of world electricity), about 945 TWh projected for 2030 (IEA, Energy and AI, 2025)."
    example: "Datacenters sited by access to grid power."
    read: "IEA 2025; Responsible Engineering (Lecture 15b)"
  - id: 4
    q: "What is inside one accelerator node, and where does the energy go?"
    picture: "H100 card photo beside the kit's node diagram, built in four steps; energy-per-operation bars on a log scale."
    numbers: "DRAM read about 160 pJ per byte, FP16 multiply about 1.1 pJ, INT8 multiply about 0.2 pJ; ratio about 145 (Introduction §1.7, after Horowitz 2014)."
    example: "An out-of-memory error means HBM is full."
    read: "§1.7"
  - id: 5
    q: "Why is generating text limited by memory, and what does idle hardware cost?"
    picture: "Schematic roofline with the H100 ridge at 295 FLOP/byte, decode at about 1 FLOP/byte, training placed illustratively above the ridge [OPTIONAL]; joules per token batched against unbatched [OPTIONAL]."
    numbers: "Ridge 989 TFLOP/s / 3.35 TB/s = 295 FLOP/byte (Hardware Acceleration §11.6). 1.1 J per token batched against 6.6 J at 10 percent of the batched rate (Napkin Math 13.5)."
    example: "Batching reuses each weight read across many users."
    read: "Hardware Acceleration §11.6; Model Serving §13.9"
  - id: 6
    q: "What is an ML system?"
    picture: "Sculley et al. 2015 diagram: the model code as a small box among configuration, data, serving, and monitoring [OPTIONAL]."
    numbers: "None; the chapter says these components often dominate the engineering burden."
    example: "Hidden technical debt in production ML at Google."
    read: "§1.5"
  - id: 7
    q: "What layers make up the stack, and where does each lecture sit?"
    picture: "Kit stack built one layer per step, then a ninth step with each lecture's number on its layer (deck figure stack_lectures, same canvas as the kit's final step)."
    numbers: "None."
    example: "Hardware L11, L11b, L12, L12b; frameworks L7; models L5, L6, L6b, L10, L10b; training L8, L8b; serving L13, L13b; operations L14, L14b; applications L15, L15b; data L4, L4b, L9; L1-3 and L16 span the stack."
    read: "§1.10"
  - id: 8
    q: "What goes wrong at a layer while the system looks healthy?"
    picture: "Illustrative plot: health checks flat while recall falls from 95 to 85 percent over twelve weeks."
    numbers: "Miss rate triples, 1 in 20 to 3 in 20 (Introduction §1.6, illustrative)."
    example: "Drift after deployment; Lecture 14."
    read: "§1.6"
  - id: 9
    q: "Why does the same field need different engineering on a phone and in a datacenter?"
    picture: "Power-tier bars on a log scale, one photo per tier: server racks, NVIDIA DGX Spark, a phone, an Arduino Nano."
    numbers: "Cloud pod about 3 MW, edge about 200 W, mobile about 5 W, TinyML average target below 1 mW: nine orders of magnitude (System Paradigms §2.1, table 4)."
    example: "Wake-word detection on an Echo Dot board; the five lighthouse models named in the notes."
    read: "System Paradigms §2.1"
  - id: 10
    q: "How do ML systems engineers locate a bottleneck?"
    picture: "Kit D·A·M triangle with data, algorithm, and machine highlighted in turn."
    numbers: "None."
    example: "The chatbot: training data against today's users (D), FLOPs per token (A), bytes read per token (M)."
    read: "§1.5"
  - id: 11
    q: "What is the iron law, and how did the GPT-3 estimate use it?"
    picture: "Focus slide: the law with each factor labeled by its D·A·M axis, and the GPT-3 estimate written as the law's factors beneath it."
    numbers: "3.14e23 FLOPs x 7e-18 s/FLOP (1 / (1,024 x 312e12 x 0.45)) is about 2.2e6 s, about 25 days (Napkin Math 1.2)."
    example: "GPT-3 training time."
    read: "§1.7, equation 2"
  - id: 12
    q: "What will you build and be able to do?"
    picture: "Kit course_order figure (parts in the book's order); TinyTorch milestone timeline; four outcomes; how the course runs."
    numbers: "Sixteen lectures; TinyTorch has 20 modules."
    example: "TinyTorch milestones from the 1958 perceptron to a small GPT and custom kernels."
    read: "Preface; §1.10"

worked_examples:
  - name: "Napkin Math 13.5: the energy of one answer"
    steps:
      - "Given: GPU 700 W + host share 300 W = 1,000 W; 114 users x 8 tokens/s = 912 tokens/s; 500 tokens."
      - "Per token: 1,000 J/s / 912 tokens/s is about 1.1 J."
      - "Per answer: 1.1 J x 500 is about 548 J."
      - "Check: Google measured 864 J for its median prompt, the same order of magnitude."
      - "Meaning: the accelerator is shared, so its power is divided across every user it serves."
  - name: "Napkin Math 1.2: GPT-3 training time"
    steps:
      - "Given: 3.14e23 FLOPs; 1,024 A100-class GPUs at 312 TFLOP/s; 45 percent utilization."
      - "T = work / (count x peak x utilization)."
      - "T is about 2.2e6 s, about 25 days."
      - "At 60 percent utilization: 19 days, six days saved on the same hardware."
      - "On the iron-law slide: the same calculation as (samples x FLOPs per sample) x seconds per FLOP."

active_learning:
  - at_minute: 3
    type: predict
    prompt: "How much energy does one 500-token answer take? A 0.5 J, B 50 J, C 500 J, D 50,000 J."
    answer: "C, about 548 J estimated and 864 J measured. A pictures the phone doing the work; D pictures the whole datacenter for one answer."
  - at_minute: 15
    type: estimate
    prompt: "How long would GPT-3 take on 1,024 A100-class GPUs at 45 percent utilization?"
    answer: "3.14e23 / (1,024 x 312e12 x 0.45) is about 2.2e6 s, about 25 days; 19 days at 60 percent."
  - at_minute: 33
    type: concept_question
    prompt: "Which changes cut energy per answer? A faster multipliers, B fewer reads from memory, C batching many users together, D a higher clock speed."
    answer: "B and C. A is already the cheap part (1.1 pJ against 160 pJ); D raises power."
  - at_minute: 46.5
    type: discuss
    prompt: "Where should a wake-word detector run: on the device or in the cloud?"
    answer: "On the device: streaming audio all day costs more energy, sends private audio away, and fails without a network. The cloud handles the question that follows (a hybrid design)."
  - at_minute: 55.5
    type: diagnose
    prompt: "Which axis? Recall falls as users change; each token waits for every weight to be read; a new model needs twice the arithmetic per image."
    answer: "Data; machine; algorithm."
  - at_minute: 58.5
    type: retrieval
    prompt: "Close your notes. Which layer decides each: (a) a DRAM read costs over 100 times a multiply; (b) 1.1 J per token batched against 6.6 J unbatched; (c) recall falls while health checks stay green. Then write the iron law's three factors."
    answer: "Hardware; serving; operations. Samples per task (Data) x FLOPs per sample (Algorithm) x seconds per FLOP (Machine)."

