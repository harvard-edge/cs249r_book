notes_for_author:
  - "2026-10-19, rebuilt as the course's motivational overview (author decision). Removed or cut to a one-line promise, because Lecture 1 teaches it: the training-compute growth plot (10^8) and the AlexNet GTX 580 die; the GPT-3 training-time estimate (Napkin Math 1.2) and the iron-law focus slide built on it; the D·A·M build and the diagnose-by-axis activity; the illustrative silent-failure curve (recall 95 to 85 percent); the 44-times algorithmic-efficiency thumbnail; the open question 'Which will limit AI first' (duplicated Lecture 1's 'What limits AI next'); the Sutton reading. Removed because later lectures own the mechanism: the 548 J worked example (Lecture 13), energy per operation and its predict (Lecture 11), the roofline (Lecture 11), the utilization slide and Google's breakdown figure (Lecture 13), the 'which changes cut energy' vote, the drift-report teaching frame (Lecture 4b and 14; the report now appears only as a capability photo)."
  - "Added: a predict on datacenters' share of world electricity; Three Mile Island Unit 1's restart for Microsoft (Constellation press release, Commons photo); the unit-of-engineering slide on the HGX board; a capability grid tying each outcome to a real system and lecture; a vote on GPUs needed for a day of prompts (answer revealed as an order of magnitude); a match of the five lighthouse workloads to where they run; a First Taste segment (wake-word discussion and a batching prediction, both left open); a retrieval synthesis on the stack. The course-thread strip on the outcomes slide is kept."
  - "Other decks call back to content Lecture 0 no longer shows (not edited here): Lecture 1's opening retrieval asks for 'the iron law's three factors from Lecture 0' and its notes say 'Lecture 0 sorted problems by axis' and 'the product from Lecture 0'; Lecture 16's 'Lecture 0's three questions' slide quotes the old first open question ('Which will limit AI first'); Lecture 16 also cites 'Lecture 0's machine, one node' and the power ladder (both still shown). Lecture 2's wake-word callback, Lecture 11's node-diagram callback, and Lecture 15b's GPT-3 energy callback still hold."
  - "Deviation from the course plan: the plan's concept questions 2 (compute growth), 4 (energy ladder), 9 (D·A·M and iron law), and 10 (iron-law bars) are now Lecture 1's or Lecture 11's, per the author's decision that Lecture 0 not repeat Lecture 1."
