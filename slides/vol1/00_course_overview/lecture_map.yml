    divider: "Why do ML systems matter now?"
    read: "Introduction, §1.3 and §1.4"
    minutes: 10.5
    concept_questions: [2, 3]
  - name: The Machine
    divider: "Where does the time and energy go inside the machine?"
    read: "Introduction, §1.7"
    minutes: 12.5
    concept_questions: [4, 5]
  - name: The Stack
    divider: "What is an ML system made of?"
    read: "Introduction, §1.5 and §1.10"
    minutes: 8.5
    concept_questions: [6, 7, 8]
  - name: Four Machines
    divider: "Why do a phone and a datacenter need different engineering?"
    read: "System Paradigms, §2.1"
    minutes: 6
    concept_questions: [9]
  - name: How We Think
    divider: "How do ML systems engineers reason about all of this?"
    read: "Introduction, §1.7 and §1.8"
    minutes: 11.5
    concept_questions: [10, 11]
  - name: The Course
    divider: "What will you be able to do?"
    read: "Preface; Introduction, §1.10"
