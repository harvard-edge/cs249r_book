chapter: 00_course_overview
lecture: 0
title: Course Overview
minutes: 75
notes_minutes: 71
core_minutes: 55.5   # notes tagged [CORE]; cutting every [OPTIONAL] note leaves this
target_ideas: 26
thesis: "What AI can do, what it costs, and how much energy it uses now depend as much on the systems that run it as on the models."

hook:
  minutes: "0-6"
  setup: "A question typed on a phone is answered in a datacenter like the one in Wenatchee, Washington. Students then predict the energy of one 500-token answer."
  question_to_class: "Predict: how much energy does one answer take? (A) 0.5 J, (B) 50 J, (C) 500 J, (D) 50,000 J."
  payoff: "C. The book's estimate is about 548 J (1,000 W shared across 912 tokens per second, times 500 tokens); Google measured 864 J for its median prompt. One answer is small next to charging a phone (40,000 J), but billions a day add up to a GPT-3 training run every two days. The retrieval slide returns to the same answer, layer by layer."
  sources:
    - "Model Serving, Napkin Math 13.5"
    - "Elsworth et al. 2025 (Google, median Gemini text prompt, 0.24 Wh)"
    - "OpenAI to Axios, July 2025 (2.5 billion prompts a day); Patterson et al. 2021 (GPT-3, 1,287 MWh)"
driving_question: "What happens when you ask a chatbot a question?"
running_example: "One chatbot answer on one H100: its energy, the machine that computes it, the stack that serves it, and the iron law that times it."

