chapter: 00_course_overview
lecture: 0
title: Course Overview
minutes: 75
notes_minutes: 71.5
core_minutes: 58.0   # notes tagged [CORE] plus title and divider notes; cutting every [OPTIONAL] note leaves this
target_ideas: 22
thesis: "What AI can do, what it costs, and how much energy it uses now depend as much on the systems that run it as on the models."

# Rebuilt 2026-10-19 as the course's motivational overview (author decision):
# why now, what the subject is, what students will be able to do, how the
# course runs, and a first taste. Lecture 0 teaches nothing Lecture 1 teaches;
# it names Lecture 1's ideas only as one-line promises.

hook:
  minutes: "0-6"
  setup: "A question typed on a phone is answered in a datacenter like the one in Wenatchee, Washington. Students predict the energy of one 500-token answer."
  question_to_class: "Predict: how much energy does one answer take? (A) 0.5 J, (B) 50 J, (C) 500 J, (D) 50,000 J."
  payoff: "C, hundreds of joules. Google measured 864 J (0.24 Wh) for its median Gemini text prompt; charging a phone takes the energy of about 46 such prompts. Lecture 13 has students estimate the number themselves. The segment then scales one answer up to a service (about 600 MWh a day, an estimate), to world datacenter electricity (IEA), and to a nuclear reactor restarted for a datacenter operator."
  sources:
    - "Elsworth et al. 2025 (Google, median Gemini Apps text prompt, 0.24 Wh)"
    - "Model Serving, Napkin Math 13.5 (phone charge, about 40,000 J)"
    - "OpenAI to Axios, July 2025 (2.5 billion prompts a day); Patterson et al. 2021 (GPT-3, 1,287 MWh)"
    - "IEA, Energy and AI, 2025; Constellation Energy press release, 20 September 2024"
driving_question: "Why does this subject deserve a semester?"
running_example: "One chatbot answer: the phone that asks, the datacenter and eight-accelerator board that answer, the energy it takes, and the stack layers each part of it touches (returned to in the retrieval synthesis)."

segments:
  - name: Why Now
    divider: "Why does the engineering behind AI matter now?"
    read: "Introduction, §1.1"
    minutes: 16.5
    concept_questions: [1, 2, 3]
  - name: The Subject
    divider: "What is a machine learning system made of?"
    read: "Introduction, §1.5 and §1.9"
    minutes: 16.5
    concept_questions: [4, 5, 6, 7]
  - name: Capabilities
    divider: "What will you be able to do by the end?"
    read: "Preface; Introduction, §1.10"
    minutes: 12
    concept_questions: [8, 9]
  - name: The Course
    divider: "How does the course run?"
    read: "Preface; Introduction, §1.10"
    minutes: 11
    concept_questions: [10, 11, 12]
  - name: First Taste
    divider: "What questions will the course answer?"
    read: "System Paradigms, §2.1; Model Serving, §13.5"
    minutes: 14.5
    concept_questions: [13]

concept_questions:
  - id: 1
    q: "How much energy does one chatbot answer take?"
    picture: "Phone, then the Wenatchee datacenter; predict slide; bars of Google's measured prompt against charging a phone (linear axis)."
    numbers: "864 J measured for a median Gemini text prompt (Elsworth et al. 2025); phone charge about 40,000 J, about 46 prompts (images/calcs.py)."
    example: "The opening chatbot question. The derivation from accelerator power and token rate is left to Lecture 13."
    read: "Introduction §1.1"
  - id: 2
    q: "What does that energy become at the scale of a service?"
    picture: "One day of ChatGPT prompts against one GPT-3 training run."
    numbers: "2.5 billion prompts x 0.24 Wh is about 600 MWh a day against 1,287 MWh for GPT-3, a GPT-3 run about every two days (estimate; images/calcs.py). Google Search handles more than 13.7 billion queries a day (Introduction §1.1, in the note)."
    example: "ChatGPT's reported daily traffic."
    read: "Introduction §1.1"
  - id: 3
    q: "How much electricity do datacenters use, and how are operators getting more?"
    picture: "Predict slide on the 2024 share; substation at The Dalles beside IEA bars; Three Mile Island photo with the restart facts."
    numbers: "About 1.5 percent of world electricity, 415 TWh in 2024; about 945 TWh projected for 2030, about 2.3 times (IEA 2025; images/calcs.py). TMI Unit 1: 837 MW, retired 2019, 20-year agreement with Microsoft, expected online 2028 (Constellation, 20 Sept 2024)."
    example: "Datacenters sited by grid access; a reactor restarted under a power purchase agreement."
    read: "IEA 2025; Lecture 15b for energy and carbon"
  - id: 4
    q: "What is the unit of engineering in this course, and what problem does it create?"
    picture: "Photo of an HGX B200 board (eight accelerators, one host); build to the four parts of the problem."
    numbers: "One to eight accelerators per machine (Volume I scope)."
    example: "Fit in memory, finish in time, stay within power and cost, stay correct after launch."
    read: "Introduction §1.9"
  - id: 5
    q: "What is inside one accelerator node?"
    picture: "H100 card photo beside the kit's node diagram, built in four steps (compute, SRAM, HBM, host)."
    numbers: "None; parts are named, and the bottleneck is left to Lecture 11."
    example: "An out-of-memory error means HBM is full."
    read: "Hardware Acceleration (Lecture 11)"
  - id: 6
    q: "What is an ML system?"
    picture: "Sculley et al. 2015 diagram: the model code as a small box among configuration, data, serving, and monitoring; a hand-raise vote first."
    numbers: "None; the drawing is schematic."
    example: "Hidden technical debt in production ML at Google."
    read: "Introduction §1.5"
  - id: 7
    q: "What layers make up the stack?"
    picture: "Kit stack built one layer per step; then a text-free stack thumbnail beside the discussion prompt; the four deployment tiers as photos beside the power bars [OPTIONAL]."
    numbers: "Power tiers 3 MW, 200 W, 5 W, 1 mW, about nine orders of magnitude (System Paradigms §2.1), stated once as a preview for Lecture 2."
    example: "A model each student used today, placed on the stack."
    read: "Introduction §1.10"
  - id: 8
    q: "What will students be able to do, and on which real systems?"
    picture: "Four outcomes with the course-thread strip; a four-photo grid tying each outcome to a real system and its lecture."
    numbers: "None."
    example: "HGX board (estimate, Lecture 13), H100 card (diagnose, Lecture 11), Echo Dot board (decide, Lecture 2), Evidently drift report (keep correct, Lecture 14)."
    read: "Preface"
  - id: 9
    q: "What does a first estimate look like, and what will students build?"
    picture: "Vote on how many accelerators serve a day of prompts; TinyTorch code and a real milestone run [OPTIONAL]; milestone timeline [OPTIONAL]."
    numbers: "About 16,000 H100-class accelerators at average load (estimate: 2.5e9 x 500 tokens / 86,400 s / 912 tokens/s; images/calcs.py; arithmetic in the note only). TinyTorch: 20 modules."
    example: "TinyTorch milestone 03 learns XOR on the student's own code."
    read: "Preface; TinyTorch"
  - id: 10
    q: "What is the order of the semester, and where does each lecture sit?"
    picture: "Kit course_order figure; the stack with each lecture's badge on its layer (deck figure stack_lectures)."
    numbers: "Sixteen chapters taught in 26 lectures after Lecture 0."
    example: "Hardware L11 to L12b; frameworks L7; models L5 to L6b, L10, L10b; training L8, L8b; serving L13, L13b; operations L14, L14b; applications L15, L15b; data L4, L4b, L9; L1 to L3 and L16 span the stack."
    read: "Introduction §1.10"
  - id: 11
    q: "What organizes the course, and which cases recur?"
    picture: "Kit D·A·M triangle with one line naming it and promising Lecture 1; the five lighthouse workloads matched to where they run."
    numbers: "None."
    example: "ResNet-50, GPT-2 and Llama, DLRM, MobileNetV2, keyword spotting, each with the product it stands for."
    read: "Introduction §1.7.1"
  - id: 12
    q: "How does a week of the course run?"
    picture: "mlsysbook.ai screenshot with read, build, act cards; prerequisites cards [OPTIONAL]."
    numbers: "None."
    example: "Instructor fills in schedule and policies."
    read: "Preface"
  - id: 13
    q: "Which questions will the course answer later?"
    picture: "Echo Dot board for the wake-word discussion; HGX board for the batching prediction; the Wenatchee datacenter for the retrieval synthesis."
    numbers: "None revealed; Lecture 2 and Lecture 13 answer."
    example: "Where a wake word should run; whether one user or many costs less per answer."
    read: "System Paradigms §2.1; Model Serving §13.5"

