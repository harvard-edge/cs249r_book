closing:
  return_to_hook: "Back to the TPU. Its 30-80x performance per watt is this lecture in one chip: the energy ladder says a DRAM read costs about 173 multiplies, so it held operands in a 24 MB buffer and a 256x256 array that reuses each one 256 times, a dataflow chosen for convolutions and dense layers above the ridge. Back to Lecture 10b's question: ResNet-50 INT8 at large batch sits near the arithmetic ceiling, so INT8's doubled ceiling shows up (5.9x); at batch one the arithmetic takes about 4 us of a modeled 0.33 ms compiled pass, so the time is overhead and halving the arithmetic barely moves it (1.3x)."
  read_and_practice: ["§11.1 to §11.6 and §11.11", "self-check questions at the end of each section; Checkpoint 11.3 (two ridges) and 11.5 (feasibility)", "Napkin Math 11.1, 11.5, 11.6, 11.9, 11.10 by hand", "TinyTorch modules on matrix multiplication and acceleration, if assigned"]
  further_reading:
    - cite: "Hardware Acceleration, §11.5, §11.6, §11.11"
      url: "https://mlsysbook.ai"
      why: "The memory tiers, the H100 ridges and layer placements, and the selection rule, with every number."
    - cite: "Jouppi et al., In-Datacenter Performance Analysis of a Tensor Processing Unit, ISCA 2017"
      url: "https://doi.org/10.1145/3079856.3080246"
      why: "The hook from the source, including the TPU's own roofline."
    - cite: "Williams, Waterman, Patterson, Roofline: An Insightful Visual Performance Model, CACM 2009"
      url: "https://doi.org/10.1145/1498765.1498785"
      why: "The roofline paper; short and readable."
    - cite: "Sze, Chen, Yang, Emer, Efficient Processing of Deep Neural Networks: A Tutorial and Survey, Proc. IEEE 2017"
      url: "https://doi.org/10.1109/jproc.2017.2761740"
      why: "Dataflows, reuse, and the energy argument in one survey."
    - cite: "Horowitz, Computing's Energy Problem (and What We Can Do about It), ISSCC 2014"
      url: "https://doi.org/10.1109/isscc.2014.6757323"
      why: "The energy ladder's source."
  bridge: "Lecture 11b: the roofline gives the ceiling. What gets a computation to it?"

