closing:
  return_to_hook: "Back to the TPU. Its 30-80x performance per watt is this lecture in one chip: the energy ladder says a DRAM read costs about 173 multiplies, so it held operands in a 24 MB buffer and a 256x256 array that reuses each one 256 times, a dataflow chosen for convolutions and dense layers above the ridge. Back to Lecture 10's question: ResNet-50 INT8 at large batch sits near the arithmetic ceiling, so INT8's doubled ceiling shows up (5.9x); at batch one the arithmetic takes about 4 us of a modeled 0.33 ms compiled pass, so the time is overhead and halving the arithmetic barely moves it (1.3x)."
  read_and_practice: ["§11.1 to §11.8 and §11.11", "self-check questions at the end of each section; Checkpoint 11.3 (two ridges) and 11.5 (feasibility)", "Napkin Math 11.1, 11.5, 11.6, 11.9, 11.10 by hand", "TinyTorch modules on matrix multiplication and acceleration, if assigned"]
  further_reading:
