notes_for_author:
  - "Example 11.1's 15-30x and 30-80x compare the TPU with contemporary CPUs and GPUs together, not with the K80 alone. The hook slide says 'CPUs and GPUs, including the K80'."
  - "No TPU v1 photo exists on Wikimedia Commons (searched). The hook uses the shared datacenter photo and the synthesis the shared TPU v4 board. If TPU v1 specs beyond the chapter (92 TOPS, 34 GB/s, its roofline ridge) are wanted on a slide, they must be read from Jouppi et al. 2017 first; this plan does not use them."
  - "The die shot is the shared CC0 GTX 580 (Fermi, 40 nm) die, labeled as an older GPU. No CC-licensed H100 die shot was found."
  - "Energy ratios differ by operation: 173x against an FP32 multiply (this chapter), about 139x against an FP32 MAC (Lecture 6), about 145x per byte against FP16 (iron-law chapter). Slides name the operation each time."
  - "The A100-measured tile-quantization data (NVIDIA guide, figure 7) moved with the mapping frames to Lecture 11b; its provenance note lives in that lecture's map and images/SOURCES.yml."
  - "The batch-415 crossing is derived from equation 5 and labeled derived."
  - "Lighthouse 11.2's register energy (0.1 pJ) and HBM energy (160 pJ/byte) are 45 nm estimates, while its latencies are Hopper values; the slide labels the energy column '45 nm estimate'."
  - "2026-10-17 revision for the split into two lectures (plan: ../11b_hw_acceleration/part1_changes.md). Moved to Lecture 11b: the Mapping section (loop orders, width-129 predict, A100 measured tiles, compiled ResNet-50) and the One Tensor section (activation trip). Added: the equation-3 estimate (295x, derived), the bandwidth taper ([OPTIONAL], 52x derived), INT8 helps twice, and The Limit section (Amdahl frame, table 17 frame, the true-or-false check without its heatmap). Five-layer estimate given 4 minutes. Sections 5 to 4; notes 71 to 71.5 minutes. The goals, takeaways, open questions, reading list, and next-lecture slide follow the plan. The cover was checked: cover_hw_acceleration.png is the chapter's clean blueprint image, resized (mean pixel difference 1.8 of 255), so it stays; the title subtitle was shortened because the book logo covered the institution line."
