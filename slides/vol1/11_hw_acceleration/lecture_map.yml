chapter: 11_hw_acceleration
lecture: 11
title: Hardware Acceleration
layer: hardware
minutes: 75
notes_minutes: 71.5
target_ideas: 30
thesis: "Accelerators win by keeping data close to arithmetic: a byte from off-chip memory costs far more time and energy than the operation it feeds, so a chip delivers its peak only when its memory hierarchy, its dataflow, and the workload's reuse keep the arrays fed."

hook:
  minutes: "0-4"
  setup: "Step 1, the problem (Example 11.2): in 2013 Google projected that three minutes of voice search per user per day would require doubling its datacenter capacity to run neural-network inference on CPUs. Shared photo of a Google datacenter. Step 2, the answer (Example 11.1): the first TPU went into production in 2015. On six Google inference workloads it delivered 15 to 30x the throughput and 30 to 80x the performance per watt of contemporary CPUs and GPUs, the K80 among them (Jouppi et al. 2017). Two range bars. Step 3, the question."
  question_to_class: "The TPU ran at a modest clock, about 700 MHz. Where did 30 to 80x performance per watt come from? A) a faster clock B) more transistors than the K80 C) one 256x256 array of 8-bit multipliers fed from a large on-chip buffer, so operands are reused instead of refetched D) a better compiler"
  payoff: "C. The TPU spent its silicon on a 256x256 8-bit systolic array and a 24 MB software-managed Unified Buffer, and on almost none of a general processor's control machinery (Example 11.1, footnotes 2 and 6). A is the misconception the lecture removes. The synthesis returns to the chip: the energy ladder, systolic reuse, the on-chip buffer, and the roofline are each one reason the answer is C."
  sources: ["Example 11.1 and 11.2 (Jouppi et al. 2017): 15-30x, 30-80x, 3 min/day, doubling datacenters", "footnote 2 (256x256 8-bit array), footnote 6 (24 MB Unified Buffer)", "§11.2 self-check answer 4 (about 700 MHz)", "photo: shared google-datacenter-dalles-substation.jpg"]

driving_question: "Why does moving data cost more than computing it, and how does an accelerator keep its arithmetic fed?"

recall: "Lecture 10b closed on ResNet-50 INT8 on the H100: batch-one latency 0.38 -> 0.30 ms (1.3x) but large-batch throughput 5.9x. Same chip, same INT8 weights. Why does one barely move? (This lecture answers it in the synthesis: batch one sits on the overhead floor, large batch near the arithmetic ceiling, and INT8 doubles only that ceiling.)"

running_example: "ResNet-50 INT8 on the reference H100 (989 TFLOP/s dense FP16, 1,979 TOPS INT8, 3.35 TB/s HBM, 50 MB L2, 228 KB shared memory per SM) carries the compute-bound side: its stage-3 3x3 convolution clears the FP16 ridge, its stage-2 layers and FC head do not, and its Amdahl budget (18.6x) opens the last segment. GPT-2 XL batch-1 decode (3 GB FP16 weights per token, about 1 FLOP/byte, 0.3 percent of peak) is the single contrast. The first TPU opens and closes the lecture."

segments:
  - name: The Chip
    divider_question: "What is inside an accelerator, and why build one?"
    read: "§11.1 to §11.4"
    concept_questions: [1, 2, 3, 4]
    land: "An accelerator spends its transistors on arrays of multipliers and on storage beside them; it wins only when an operand fetched once is reused many times before it goes back to memory."
    minutes: 16
  - name: Feeding It
    divider_question: "Why can memory not feed the arrays directly?"
    read: "§11.5.1, §11.5.3, §11.5.4, §11.6.3 (equation 3)"
    concept_questions: [5, 6, 16, 17]
    land: "Each step away from the arrays is slower and costlier; HBM alone would need about 295 times its bandwidth to feed the arrays, so operands are staged in SRAM and registers and reused there."
    minutes: 10.5
  - name: Roofline
    divider_question: "Which ceiling binds: arithmetic or bytes?"
    read: "§11.6"
    concept_questions: [7, 8, 9, 18, 10]
    focus: "Attainable = min(R_peak, BW x I); ridge I_ridge = R_peak / BW, one ridge per precision path"
    land: "Compare a kernel's intensity with the ridge of the path it runs on: below it only fewer bytes or more reuse help, and every new generation and every narrower format moves the ridge right."
    minutes: 23.5
  - name: The Limit
    divider_question: "How much can a faster chip speed up the whole job?"
    read: "§11.1 (Theorem 11.1, Lighthouse 11.1), §11.11"
    concept_questions: [15, 19]
    land: "Work the accelerator never touches caps the whole job, and each workload exhausts a different resource first."
    minutes: 9.5

concept_questions:
  - id: 1
    q: "What is inside an accelerator?"
    picture: "Real, abstract: shared photo nvidia-h100-pcie.jpg beside the shared CC0 die shot nvidia-gtx580-die.jpg (an older GPU die, labeled as such; the repeated core arrays are visible); then kit machine_step1..4 built part by part (compute units, on-chip SRAM, HBM, host link), with book fig-accelerator-anatomy as the reading reference"
    numbers: "H100: 80 billion transistors, 989 TFLOP/s dense FP16 against a 1-2 TFLOP/s reference CPU, 490-990x (Definition 11.1, Choquette 2023); more than 16,000 CUDA cores and more than 500 Tensor Cores (§11.7.1)"
    example: "H100 as the reference machine; why specialize at all: a CPU spends hundreds of pJ of control overhead to issue a few-pJ operation, and training compute doubles every 3.4 to about 6 months against about two years for transistor density (§11.2.2); timeline thumbnail (book fig-timeline) in the notes only"
    read: "§11.1"
  - id: 2
    q: "What does a byte cost compared with an operation?"
    picture: "Slide variant of book fig-energy-hierarchy (make_figs.py energy_step1..3, log bars, 45 nm): arithmetic rungs, then the SRAM rung and the show of hands, then the DRAM bar labeled 640 pJ = 173 multiplies"
    numbers: "INT8 add 0.03 pJ, FP32 add 0.9, FP32 multiply 3.7, 8 KB SRAM read 5, DRAM read of a 32-bit value 640 pJ; DRAM is about 173x the FP32 multiply and about 128x the SRAM read (Horowitz 2014, figure 4, §11.2.3)"
    example: "Recall: Lecture 0 showed the ladder and Lecture 6 the 640 pJ against a 4.6 pJ MAC; new here is the on-chip SRAM rung, the one accelerators are built around"
    read: "§11.2.3"
  - id: 3
    q: "Which unit runs which primitive, and how much does a matrix unit buy?"
    picture: "New three-lane diagram: vector unit (ReLU, residual add), matrix unit (convolution, projections), special-function unit (softmax exp, GELU, rsqrt), each tagged with a lighthouse; beside it new bars of NVIDIA peak FP16: P100 21.2 against V100 125 TFLOP/s"
    numbers: "One mma.sync.m16n8k16 instruction: 2,048 MACs across a warp, replacing 64 scalar FMAs per thread (listing 13); P100 21.2 -> V100 125 TFLOP/s FP16, about 6x, the first Tensor Cores (footnote 13, NVIDIA 2017); INT8 wins twice: half the bytes of FP16 and smaller multipliers, so more MACs per die (§11.2, §11.4.5); H100 FP8 1,979 against FP16 989 TFLOP/s"
    example: "ResNet-50 uses the special-function path only for its 1,000-way softmax; GPT-2 XL uses it every step (softmax and GELU grow with context) (§11.3.3)"
    read: "§11.3, §11.4.2, §11.4.5"
  - id: 4
    q: "How does a systolic array reuse an operand?"
    picture: "Slide variant of book fig-systolic-array, redrawn at slide size because the book figure's labels fall below 7 pt (make_figs.py systolic_step1..3, a 4x4 weight-stationary grid): weights held in the cells, activations flow right, partial sums flow down; then the worked card for Napkin Math 11.1"
    numbers: "128x128 array: 16,384 MACs per cycle (TPU v4; Jouppi et al. 2023); naive DRAM streaming 4 accesses x 640 pJ + 1 pJ = 2,561 pJ per op against 0.016 accesses -> about 11 pJ per op, 232.8x (Napkin Math 11.1, deliberately naive baseline); first TPU 256x256 (footnote 2)"
    example: "TPU matrix unit"
    read: "§11.4.4"
  - id: 5
    q: "Why do processors wait for memory, and is it getting better?"
    picture: "Book fig-memory-wall (log growth since 2014: dense model parameters against per-device accelerator bandwidth)"
    numbers: "About 3,900x in dense parameters against 33x in accelerator memory bandwidth since 2014 (figure 7, Gholami et al. 2024 and model papers); Lecture 2's 1.6x/year against 1.2x/year recalled in one line"
    example: "GPT-2 XL decode: every token rereads 3 GB of weights"
    read: "§11.5.1"
  - id: 6
    q: "What does each step of the memory hierarchy cost, and why can HBM not feed the array directly?"
    picture: "Kit machine_hl_compute, _sram, _hbm, _link, one tier per step, with the H100 values in the right column (registers; shared memory and L2; HBM and the 100+ cycle count); final step a four-row tier table and one line for the off-chip taper (NVLink 900, PCIe 64, network 50 GB/s). The taper bars were dropped to keep the final state readable"
    numbers: "Registers about 0.1 pJ per access; shared memory 228 KB per SM, about 17 ns; L2 50 MB, about 150 ns; HBM about 300 ns dependent access, about 160 pJ per byte (Lighthouse 11.2); at 2 GHz a cycle is 500 ps and an HBM access is 100+ cycles (Napkin Math 11.2); taper HBM 3,350, NVLink 900, PCIe 64, network 50 GB/s (§11.5.4)"
    example: "H100"
    read: "§11.5.3, §11.5.4"
  - id: 7
    q: "What is the ridge point, and why does every precision path have its own?"
    picture: "New numeric roofline for the H100 (make_figs.py, log-log, drawn at slide size): one bandwidth slope, ceilings revealed one per step: FP32, FP16, INT8, ridge labeled on each"
    numbers: "FP32 67 TFLOP/s -> ridge about 20; FP16 989 -> 295.2; INT8 1,979 -> 590.7 FLOP/byte, all on 3.35 TB/s (Napkin Math 11.10, 11.6); FP16 against FP32 peak about 15x on the same chip (§11.12)"
    example: "Same H100, three ridges; opened by the focus slide (roofline equation) with a recall of Lecture 2's A100 (312 TFLOP/s, 2.04 TB/s, ridge 153)"
    read: "§11.6.2"
  - id: 8
    q: "Why does the ridge keep rising across generations?"
    picture: "Book fig-rising-ridge (V100, A100, H100, B200) in a predict frame; book fig-bandwidth-envelope (Epoch AI, 52 accelerators) moved to its own [OPTIONAL] frame of 1.5 min"
    numbers: "Ridge V100 139, A100 153, H100 295, B200 281 FLOP/byte; 2017-2024 dense FP16 x18 against bandwidth x8.9 (§11.6.2, figure 9); best compute about 55x against best bandwidth about 13x since TPU v2 (Epoch AI 2026, figure 10); a 200 FLOP/byte kernel gains about 1.6x (bandwidth ratio), not 3.2x (compute ratio), from A100 to H100 (Napkin Math 11.3)"
    example: "An unchanged kernel moved from A100 to H100"
    read: "§11.6.2"
  - id: 9
    q: "Where do real layers sit on the H100 roofline?"
    picture: "Variant of book fig-hw-acceleration-h100-roofline-lighthouses at slide size, FP16 points revealed one per step, each labeled with its bound as a share of peak"
    numbers: "GPT-2 XL QKV projection, prefill batch 8: 125.8 GFLOP / 120.2 MB = 1,046.7 (compute bound); ResNet-50 stage-3 3x3 conv, batch 32: 7.4 GFLOP / 13.1 MB = 563.1 (compute bound); ResNet-50 FC head, batch 32: 131.1 MFLOP / 4.3 MB = 30.5 -> 102.3 TFLOP/s, 10.3 percent; LayerNorm: 104.9 MFLOP / 52.4 MB = 2.0 -> 6.7 TFLOP/s, 0.7 percent; softmax 0.75; GPT-2 XL decode batch 1: 1 FLOP/byte -> 3.4 TFLOP/s, 0.3 percent (Napkin Math 11.4, 11.5, 11.7, 11.8, 11.10)"
    example: "Five layers, two lighthouses, one chip"
    read: "§11.6.2, §11.6.3"
  - id: 10
    q: "How does batch size move a layer along the roofline, and when does INT8 move it below the ridge?"
    picture: "Two frames: a new plot of intensity against batch for a 2048x2048 FP16 dense layer with the 295.2 line (batch_step1..3); then new grouped bars for three ResNet-50 layers at FP16 and INT8, with the stage-3 conv also shown at INT8 weights and FP16 activations (569), against both ridges (int8ridge_step1..3)"
    numbers: "I approximately B: batch 1 -> 1, 32 -> 31, 512 -> 341.3 FLOP/byte (Napkin Math 11.9, equation 5); exact crossing of the FP16 ridge near batch 415 (derived from equation 5, labeled derived); stage-3 3x3 conv 563 FP16, 1,126 with INT8 activations, about 569 if activations stay FP16 (below 590.7); stage-2 3x3 287 / 574, just below both ridges; stage-2 1x1 expansion 51 / 102, far below (Napkin Math 11.6)"
    example: "The same weights cross the ridge or not depending on how activations travel, a compiler decision"
    read: "§11.6.3, §11.6.4"
  - id: 15
    q: "How much can a faster accelerator speed up the whole job?"
    picture: "Slide variant of book fig-iron-law-heatmap, redrawn from equation 1 at slide size (make_figs.py amdahl.svg), with the two Lighthouse 11.1 points marked: ResNet-50 18.6x and GPT-2 decode 4.9x"
    numbers: "Amdahl: ResNet-50, p = 0.95, gain 247x (1,979 TOPS against about 8 TOPS, scenario) -> 18.6x; GPT-2 decode p = 0.80 -> 4.9x, ceiling 5x; with the bandwidth gain (67x) instead, 4.7x (Lighthouse 11.1, Theorem 11.1); one-H100 binding resources: ResNet-50 arithmetic, GPT-2 XL HBM bandwidth, DLRM capacity (100 GB of tables against 80 GB) (table 17)"
    example: "ResNet-50 against GPT-2 XL on one H100; a two-step build of the heatmap, ResNet-50 then GPT-2 decode"
    read: "§11.1, §11.11"
  - id: 16
    q: "Why can HBM not feed the arrays at their rate?"
    picture: "Estimate card: required bandwidth = rate / intensity; reveal 989 TB/s against 3.35 TB/s; then the 500 ps cycle and 100+ cycle HBM access"
    numbers: "989 TFLOP/s at about 1 FLOP/byte needs 989 TB/s against 3.35 TB/s, 295x (derived from equation 3; the ratio is the FP16 ridge); 2 GHz cycle 500 ps, HBM access 100+ cycles (Napkin Math 11.2)"
    example: "H100 FP16 path with no reuse"
    read: "§11.6.3, Napkin Math 11.2"
  - id: 17
    q: "How fast does bandwidth fall off the chip?"
    picture: "Slide variant of book margin-002 (make_figs.py taper.svg, log bars): HBM 3,350, NVLink 900, PCIe 64, network 50 GB/s; predict which link an offloaded model streams over"
    numbers: "HBM 3,350, NVLink 900, PCIe 64, network 50 GB/s (§11.5.4); HBM over PCIe 52x (derived)"
    example: "A model offloaded to host memory"
    read: "§11.5.4"
  - id: 18
    q: "What does INT8 buy on the datapath?"
    picture: "Two bar pairs (make_figs.py int8peak, int8floor): H100 FP16 989 against INT8 1,979; ResNet-50 arithmetic floor 8 against 4 us; corner line on 2:4 sparsity"
    numbers: "989 TFLOP/s FP16, 1,979 TOPS INT8 (Choquette 2023); 8.2 GFLOP per image gives about 8 us and 4 us (§11.4.5, Lighthouse 11.1); 2:4 sparsity doubles the rate only for weights in the pattern (footnote 18)"
    example: "ResNet-50 on the H100"
    read: "§11.4.5"
  - id: 19
    q: "Which resource does each lighthouse exhaust first?"
    picture: "Table 17 as a five-row build (lighthouse, bytes FP16 and INT8, operations per inference, binding resource)"
    numbers: "ResNet-50 51.2 / 25.6 MB, 8.2 GFLOP, arithmetic; MobileNetV2 7.0 / 3.5 MB, 0.6 GFLOP, launch overhead and depthwise bandwidth; GPT-2 XL decode 3 / 1.5 GB, 3 GFLOP per token, HBM bandwidth; DLRM 100 GB of tables against 80 GB, capacity; KWS 400 / 200 KB, 20 MFLOP, none on an H100 (table 17)"
    example: "Five lighthouses on one H100"
    read: "§11.11"

worked_examples:
  - name: "Napkin Math 11.1: the energy of pulsing data through a systolic array"
    steps: ["given: DRAM read 640 pJ, compute about 1 pJ, a 128x128 array", "naive: 3 loads + 1 write per op = 2,561 pJ per op", "systolic: 2 loads per 128 ops = 0.016 accesses -> about 11 pJ per op", "result: 232.8x", "meaning: the ratio measures locality, not a better multiplier; the baseline is deliberately naive"]
  - name: "Napkin Math 11.4, 11.5, 11.7, 11.8, 11.10: five layers on the H100 roofline (student exercise)"
    steps: ["given: H100 ridge 295.2 FLOP/byte (989 TFLOP/s, 3.35 TB/s); FLOPs and bytes for each layer", "QKV prefill 1,046.7 and stage-3 conv 563.1: above the ridge, compute bound", "FC head 30.5: 102.3 TFLOP/s ceiling, 10.3 percent of peak", "LayerNorm 2.0: 6.7 TFLOP/s, 0.7 percent; decode 1: 3.4 TFLOP/s, 0.3 percent", "meaning: the same chip spans three orders of magnitude of attainable rate; below the ridge the lever is fewer bytes (fusion, lower precision, batching)"]
  - name: "Napkin Math 11.9: batch size and arithmetic intensity"
    steps: ["given: 2048x2048 FP16 dense layer, I = 2Bn^2 / (4Bn + 2n^2)", "batch 1: about 1 FLOP/byte", "batch 32: about 31", "batch 512: 341.3, above the 295.2 ridge (crossing near 415, derived)", "meaning: batching buys intensity with waiting time, the trade Lecture 13 develops"]
  - name: "Napkin Math 11.6: when INT8 moves a layer below the ridge (diagnose)"
    steps: ["given: H100 ridges 295.2 (FP16) and 590.7 (INT8); three ResNet-50 layers at batch 32", "stage-3 3x3: 563 -> 1,126 if activations are INT8; about 569 if they stay FP16, below 590.7", "stage-2 3x3: 287 / 574, just below both ridges", "stage-2 1x1: 51 / 102, far below; gains only the halved bytes", "meaning: INT8 doubles the ceiling without moving the slope, so whether a layer gains 2x depends on how its activations travel, a compiler and runtime choice"]

active_learning:
  - at_minute: 3
    type: predict
    prompt: "The first TPU ran at about 700 MHz and beat contemporary CPUs and GPUs by 30 to 80x in performance per watt. Where did it come from? A) clock B) more transistors C) reuse in a 256x256 array fed from on-chip buffers D) the compiler"
    answer: "C (Example 11.1, footnotes 2 and 6). Revisited in the synthesis."
  - at_minute: 5
    type: retrieval
    prompt: "Close your notes. Lecture 10b: ResNet-50 INT8 on an H100 gave how much at batch one, and how much at large batch?"
    answer: "About 1.3x (0.38 -> 0.30 ms) against 5.9x (Lecture 10b, table 13). Today explains the difference."
  - at_minute: 12.5
    type: predict
    prompt: "Show of hands: one 32-bit DRAM read costs the energy of how many FP32 multiplies? About 2, 20, or 200?"
    answer: "About 173 (640 against 3.7 pJ; Horowitz 2014, figure 4)."
  - at_minute: 21
    type: estimate
    prompt: "A naive design reads three operands and writes one result to DRAM for every multiply-accumulate. A 128x128 systolic array loads two operands at its edges per 128 operations. Energy per operation for each, at 640 pJ per DRAM access and 1 pJ per operation?"
    answer: "2,561 pJ against about 11 pJ, about 233x (Napkin Math 11.1)."
  - at_minute: 28
    type: estimate
    prompt: "To keep 989 TFLOP/s busy at about 1 FLOP/byte, what bandwidth would the arrays need, against HBM's 3.35 TB/s?"
    answer: "989 TB/s, about 295x short (derived from equation 3; the ratio is the FP16 ridge)."
  - at_minute: 30
    type: predict
    prompt: "A model too large for HBM is offloaded to host memory. Over which link do its weights stream?"
    answer: "PCIe, 64 GB/s, 52x below HBM's 3,350 (§11.5.4; ratio derived)."
  - at_minute: 34.5
    type: predict
    prompt: "A kernel at 200 FLOP/byte moves unchanged from an A100 to an H100, which has 3.2x the FP16 peak and 1.6x the bandwidth. How much faster?"
    answer: "About 1.6x: 200 is above the A100 ridge (153) and below the H100 ridge (295), so on the H100 the bandwidth slope binds (Napkin Math 11.3)."
  - at_minute: 37.5
    type: estimate
    prompt: "Given FLOPs and bytes, compute the intensity of five layers and place each against the H100's 295 FLOP/byte ridge: QKV prefill, ResNet-50 stage-3 conv, ResNet-50 FC head, LayerNorm, GPT-2 XL decode."
    answer: "1,046.7 and 563.1 above; 30.5 (10.3 percent of peak), 2.0 (0.7 percent), and 1 (0.3 percent) below (Napkin Math 11.4 to 11.10)."
  - at_minute: 43.5
    type: predict
    prompt: "A 2048x2048 FP16 dense layer sits at about 1 FLOP/byte at batch one. Roughly what batch puts it above the H100's ridge?"
    answer: "Intensity is roughly the batch size, so a few hundred: 512 gives 341.3 (Napkin Math 11.9); the exact crossing is near 415 (derived)."
  - at_minute: 46.5
    type: diagnose
    prompt: "INT8 doubles the H100's arithmetic ceiling. ResNet-50's stage-3 conv was compute bound at FP16 (563). After INT8, the profile shows it bandwidth bound. What happened, and what fixes it?"
    answer: "Its activations stayed FP16, so intensity rose only to about 569, below the 590.7 INT8 ridge. Keeping activations INT8 between layers moves it to 1,126 (Napkin Math 11.6)."
  - at_minute: 63
    type: concept_question
    prompt: "True or false: (1) a 247x faster matrix path makes ResNet-50 inference about 247x faster; (2) an A100 has 4.8x a T4's peak, so batch-one inference runs 4.8x faster on it; (3) one peak FLOP/s rating describes an H100 at every precision."
    answer: "All false. (1) 18.6x when 5 percent is unaccelerated (Lighthouse 11.1). (2) Batch-one ceilings differ by 6.4x, the bandwidth ratio; peak contributes nothing (§11.12). (3) 989 TFLOP/s FP16 against 67 FP32, about 15x (§11.12)."

open_questions:
  - "The ridge rose from 139 to 295 FLOP/byte in seven years, and new arithmetic now goes into FP8 and FP4. Should model designers chase intensity, or should hardware designers spend area on bandwidth instead?"
  - "DLRM's tables exceed one H100's memory and KWS needs none of its arithmetic. Should one accelerator design serve all five lighthouses, or should each regime get its own chip?"
  - "CUDA's ecosystem binds much of the field to one vendor. Is that lock-in a cost or a reason the field moved so fast?"

more_examples:
  - "Jouppi et al. 2017: TPU v1, 15-30x throughput and 30-80x performance per watt on six production workloads."
  - "Jouppi et al. 2023: TPU v4, 128x128 BF16 systolic arrays, two cores per chip."
  - "Eyeriss (Chen et al. 2016): row-stationary dataflow for convolutions."
  - "FlashAttention (Dao et al. 2022): tiling through shared memory, recalled from Lecture 8b as the IO-aware answer to softmax's 0.75 FLOP/byte."
  - "Cerebras CS-2: more than 850,000 cores on one wafer (§11.7.1)."
  - "Epoch AI 2026: 52 accelerators, best compute 55x against best bandwidth 13x since TPU v2."
  - "Google's 2013 voice-search projection: doubling datacenters (Example 11.2)."

