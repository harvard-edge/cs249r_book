<rect width="900" height="420" fill="white"/>
<text x="18" y="30" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="bold" fill="#1A1A2E" text-anchor="start" opacity="1.0">1. Trace sampling at 1M req/s (1 KB/req): sampling cuts volume</text>
<rect x="18" y="46" width="540" height="134" rx="8" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1.8" opacity="1.0"/>
<text x="34" y="84" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="bold" fill="#1A1A2E" text-anchor="start" opacity="1.0">All traces</text>
