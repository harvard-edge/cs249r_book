<rect x="20" y="150" width="260" height="150" rx="10" fill="#D4EFDF" stroke="#008F45" stroke-width="3" opacity="1.0"/>
<text x="150" y="186" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#008F45" text-anchor="middle" opacity="1.0">Value recovered</text>
