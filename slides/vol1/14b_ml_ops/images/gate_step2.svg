<text x="745" y="224" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="normal" fill="#1A1A2E" text-anchor="middle" opacity="1.0">compute + validation</text>
<text x="745" y="254" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="normal" fill="#1A1A2E" text-anchor="middle" opacity="1.0">+ deployment</text>
