<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<defs><marker id="arn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008F45"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CB202D"/></marker><marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#006395"/></marker><marker id="arl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BBBBBB"/></marker><marker id="aro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E67817"/></marker></defs>
<rect width="900" height="420" fill="white"/>
<text x="18" y="30" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="bold" fill="#1A1A2E" text-anchor="start" opacity="1.0">1. Trace sampling at 1M req/s (1 KB/req): sampling cuts volume</text>
<rect x="18" y="46" width="540" height="134" rx="8" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1.8" opacity="1.0"/>
<text x="34" y="84" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="bold" fill="#1A1A2E" text-anchor="start" opacity="1.0">All traces</text>
<rect x="182" y="60" width="260" height="34" rx="4" fill="#CB202D" stroke="#CB202D" stroke-width="0" opacity="1.0"/>
<text x="454" y="84" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="bold" fill="#CB202D" text-anchor="start" opacity="1.0">1.0 GB/s</text>
<text x="34" y="140" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="bold" fill="#1A1A2E" text-anchor="start" opacity="1.0">1-in-60 traces</text>
<rect x="182" y="116" width="12" height="34" rx="3" fill="#008F45" stroke="#008F45" stroke-width="0" opacity="1.0"/>
<text x="206" y="140" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="bold" fill="#008F45" text-anchor="start" opacity="1.0">16.7 MB/s  (60× reduction)</text>
<rect x="576" y="46" width="306" height="134" rx="8" fill="#D4EFDF" stroke="#008F45" stroke-width="2.2" opacity="1.0"/>
<text x="729" y="78" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="bold" fill="#008F45" text-anchor="middle" opacity="1.0">Outcome-based sampling</text>
<text x="729" y="114" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="bold" fill="#1A1A2E" text-anchor="middle" opacity="1.0">Keep 100% of errors</text>
<text x="729" y="148" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="normal" fill="#1A1A2E" text-anchor="middle" opacity="1.0">Keep 1% of successes</text>
<text x="18" y="214" font-family="Helvetica, Arial, sans-serif" font-size="21.5" font-weight="bold" fill="#1A1A2E" text-anchor="start" opacity="1.0">2. Monthly budget for 1 ML node (3 variants × 50 metrics = 150 series, 15 s): ~$261/mo</text>
<rect x="18" y="230" width="540" height="174" rx="8" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1.8" opacity="1.0"/>
<text x="30" y="273" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="bold" fill="#1A1A2E" text-anchor="start" opacity="1.0">Queries (12,672/mo)</text>
<rect x="236" y="252" width="148" height="30" rx="4" fill="#E67817" stroke="#E67817" stroke-width="0" opacity="1.0"/>
<text x="392" y="273" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="bold" fill="#E67817" text-anchor="start" opacity="1.0">$253.44 (97%)</text>
<text x="30" y="323" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="bold" fill="#1A1A2E" text-anchor="start" opacity="1.0">Ingest (25.9M pts)</text>
<rect x="236" y="302" width="12" height="30" rx="4" fill="#006395" stroke="#006395" stroke-width="0" opacity="1.0"/>
<text x="256" y="323" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="bold" fill="#006395" text-anchor="start" opacity="1.0">$7.78 (3%)</text>
<text x="30" y="373" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="bold" fill="#1A1A2E" text-anchor="start" opacity="1.0">Storage (0.21 GB)</text>
<rect x="236" y="352" width="5" height="30" rx="4" fill="#666666" stroke="#666666" stroke-width="0" opacity="1.0"/>
<text x="249" y="373" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="bold" fill="#666666" text-anchor="start" opacity="1.0">$0.21 (0.1%)</text>
<rect x="576" y="230" width="306" height="174" rx="8" fill="#F5D2D5" stroke="#CB202D" stroke-width="2.2" opacity="1.0"/>
<text x="729" y="264" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#CB202D" text-anchor="middle" opacity="1.0">Cardinality explosion</text>
<text x="729" y="298" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="bold" fill="#1A1A2E" text-anchor="middle" opacity="1.0">user_id / request_id</text>
<text x="729" y="326" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="normal" fill="#1A1A2E" text-anchor="middle" opacity="1.0">multiply series linearly</text>
<text x="729" y="356" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="normal" fill="#666666" text-anchor="middle" opacity="1.0">(hashing does not cut it).</text>
<text x="729" y="386" font-family="Helvetica, Arial, sans-serif" font-size="20.5" font-weight="bold" fill="#CB202D" text-anchor="middle" opacity="1.0">Fix: bucket + tiered TTL</text>
</svg>
