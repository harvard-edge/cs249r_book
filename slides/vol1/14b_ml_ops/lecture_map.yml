closing:
  return_to_hook: "Unity's timeline again, now with the lecture's instruments drawn on it. An input check on each customer batch fires before training (segment 1); it needs no labels, so it fires in minutes, while the outcome layer, revenue, waited a quarter (segment 2); its threshold is set on effect size and its alert has an owner (segment 3); the decision is roll back to a model trained on known-good data, not retrain on the bad batch (segment 4); and the postmortem turns that batch into a validation rule (segment 5). The company's own remediation sentence names the same three things: monitoring, alerting, and recovery."
  read_and_practice: ["§14.5, §14.5.2, §14.6, §14.7.1, §14.8.1, §14.10", "Self-check questions for §14.5, §14.6, §14.7, §14.8; Checkpoints 14.3, 14.4, 14.5", "Napkin Math 14.2, 14.3, 14.5, 14.6 by hand; recompute T* for C = $1,250 and $20,000"]
