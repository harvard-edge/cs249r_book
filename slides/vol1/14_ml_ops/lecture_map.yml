notes_for_author:
  - "Book bug: margin-002 labels the optimum 'T* ≈ 1 d', but Napkin Math 14.6 and table 17 give sqrt(2 x 5,000 / (1,000,000 x 0.50 x 0.94 x 0.0024)) = 2.98, about 3 days. The course plan's 'about one day' inherits the figure. The slide redraws the figure at 3 days."
  - "Book vs SEC order: War Story 14.2 says Knight handled 'over 17 percent of NYSE volume' and the stale server sent '~1,400 orders/sec'. Neither number is in SEC Release 34-70694, which says Knight's trading was about 10 percent of all trading in listed U.S. equities and gives 212 parent orders, 4 million executions, 397 million shares, about 45 minutes, $460 million. The slides use only the SEC numbers. The chapter's rescue-financing and acquisition sentences are not in the order either."
  - "Zillow's per-home gross profit in Q3 2021 (about -$80,771 in exhibit 99.2) includes the write-down allocation and is not used on slides."
  - "Papasian and Underwood values (about 61, 0, 9, 2, 24 outages by ML-ness 0 to 4; 38, 1, 32, 12, 13 by distributed-ness) are read from bar charts in the OpML 2020 slides, sum to 96, and are labeled 'read from chart'. A published paper with a table was not found."
  - "He et al. 2014 Fig. 2 bar heights are read from the figure and labeled approximate; the slide's claim rests on the quoted text (about 1 percent NE, weekly to daily)."
  - "Rabanser et al. measure label-free shift detection (black-box softmax shift detection); Napkin Math 14.2 is about labeled outcomes. The slide says so: label-free detection is the fast path, and it still needs hundreds of samples for small shifts."
  - "The ranking service numbers (94 to 88 percent, 45 against 12 minutes, 8 percent loss, gamma = 0.0024, C = $5,000) are the chapter's illustrative scenario; every slide that shows them says 'illustrative'."

build_note:
  date: "2026-10-17"
  result: "35 frames, 72 presenting pages, 35 handout pages, 72 notes pages; notes total 71.5 minutes; fit check passes with no overfull boxes. Figures in images/make_figs.py; every value is sourced in its docstring."
  sources_rechecked: "SEC Release 34-70694 re-read from the PDF (paragraphs 15 to 19, 27, and the $12 million penalty); every Knight number on the slides is from the order. Zillow Q2 and Q3 2021 shareholder letters and Q3 press release re-read from the SEC filings (all counts, the write-down, the Q4 range, the 25 percent workforce cut, and the quotations). Rabanser et al. Table 2a, Hazelwood et al. Table II, He et al. Sec. 3.2 and Fig. 2, and the Papasian and Underwood 'Finding #1' chart re-read from the sources. T* recomputed from equation 12: 2.98 days."
  changes:
    - change: "New frame 'Exposure grows in stages: shadow, canary, then ramp' (2.5 min, a three-step router diagram) before the node-day frame; correction cascade, silent-failure cost, Facebook cadence, and open questions each lose 0.5 min."
      reason: "The lead asked for a picture and a step-by-step explanation of staged rollout, canaries, and shadow deployment; the plan showed only their memory cost."
    - change: "Node-day frame's final step lists the second copy per workload as text (DLRM, ResNet-50, keyword spotter) instead of three bars."
      reason: "The three costs are in different units (accelerators, MB of HBM, KB of flash); as bars they needed a derived share axis and rendered under the legibility floor in a column."
    - change: "Rabanser frame title 'Small shifts need ten times more samples to detect' replaced by 'Large shifts show up in 20 samples; small ones need 10,000'."
      reason: "Table 2a shows large shifts pass 0.5 detection accuracy at 20 samples and small ones only at 10,000, a factor of 500, not ten."
    - change: "Book figures for the correction cascade, the uptime iceberg, and Wild-Time redrawn as slide variants (cascade_step, iceberg, wildtime_step); the technical-debt figure drawn in TikZ as Lecture 0 does."
      reason: "At slide size the book figures' labels render near 5 to 6 pt. The variants keep the book's labels and values (Wild-Time values from the figure's alt text)."
    - change: "He et al. freshness drawn as a line of relative NE against delay, not bars."
      reason: "The paper's axis starts at 95 percent; bars on a truncated axis exaggerate the differences."
    - change: "Knight's 97 e-mails shown as a card beside the iceberg rather than an inset on it; the iceberg's four monitoring layers listed beside it."
      reason: "Tags on the redrawn iceberg would cover its labels."
    - change: "Title slide uses the chapter's blueprint cover; the older cover's generated image has garbled text."
      reason: "Garbled labels read as errors on the first slide."
    - change: "Retrieval frame's four Lecture 13 gauges drawn in TikZ; estimate frames put the given values in a full-width card above the plot."
      reason: "Fit: a narrow card wrapped each value onto several lines."
  not_used_old_images: ["canary-deployment.svg", "cicd-pipeline-ml.svg", "degradation-equation.svg", "drift-detection-flow.svg", "maturity-model.svg", "monitoring-dashboard-ml.svg"]
