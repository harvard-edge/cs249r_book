closing:
  return_to_hook: "Back to Zillow's bars, annotated by axis. D: the market moved and resale outcomes arrived months after purchase, so evidence was slow. A: point forecasts with errors larger than anticipated, in both directions, unused as a throttle. M: renovation and resale capacity capped sales, so inventory reached 9,790 homes with 8,172 under contract. Every server stayed up. The missing control was not a better model but an operations one: an exposure cap and a circuit breaker between prediction and purchase."
  read_and_practice: ["§14.1, §14.2, §14.3, §14.4, §14.10", "Self-check questions for §14.1 to §14.4", "Napkin Math 14.1; Checkpoints 14.1 and 14.2"]
  further_reading:
    - cite: "ML Operations, §14.1 to §14.4"
      url: ""
      why: "Reproducibility, the registry, parity, and release controls with their memory cost."
    - cite: "Sculley et al., Hidden Technical Debt in Machine Learning Systems, NeurIPS 2015"
      url: "https://papers.nips.cc/paper/5656-hidden-technical-debt-in-machine-learning-systems"
      why: "The catalog of ML-specific debt: entanglement, correction cascades, undeclared consumers, glue code."
    - cite: "U.S. SEC, Order Instituting Proceedings, Knight Capital Americas LLC, Release No. 34-70694, 2013"
      url: "https://www.sec.gov/litigation/admin/2013/34-70694.pdf"
      why: "An 18-page primary account of a partial deployment, an unowned alert stream, and an unrehearsed rollback."
    - cite: "Baylor et al., TFX: A TensorFlow-Based Production-Scale Machine Learning Platform, KDD 2017"
      url: "https://doi.org/10.1145/3097983.3098021"
      why: "Google's production pipeline components and the metadata store that records lineage."
    - cite: "Papasian and Underwood, How ML Breaks: A Decade of Outages for One Large ML Pipeline, USENIX OpML 2020"
      url: "https://www.usenix.org/conference/opml20/presentation/papasian"
      why: "96 postmortems from one production pipeline: most causes were not ML."
    - cite: "Breck et al., The ML Test Score: A Rubric for ML Production Readiness and Technical Debt Reduction, IEEE Big Data 2017"
      url: "https://doi.org/10.1109/bigdata.2017.8258038"
      why: "28 concrete tests and the min-category score."

