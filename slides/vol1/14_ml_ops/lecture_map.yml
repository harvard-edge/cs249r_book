closing:
  return_to_hook: "Back to Zillow's bars, annotated by axis. D: the market moved and resale outcomes arrived months after purchase, so evidence was slow. A: point forecasts with errors larger than anticipated, in both directions, unused as a throttle. M: renovation and resale capacity capped sales, so inventory reached 9,790 homes with 8,172 under contract. Every server stayed up. The missing control was not a better model but an operations one: an exposure cap and a circuit breaker between prediction and purchase."
  read_and_practice: ["§14.1, §14.2.6, §14.3.1, §14.4.3 to §14.4.5, §14.5.2, §14.6.2, §14.7.1, §14.10", "Self-check questions for §14.1, §14.2, §14.4, §14.6", "Napkin Math 14.1, 14.2, 14.3, 14.6; Checkpoints 14.2 and 14.4"]
  further_reading:
    - cite: "ML Operations, §14.4 and §14.6"
      url: ""
      why: "Release controls with their memory cost, and the retraining economics this lecture compresses."
    - cite: "Sculley et al., Hidden Technical Debt in Machine Learning Systems, NeurIPS 2015"
      url: "https://papers.nips.cc/paper/5656-hidden-technical-debt-in-machine-learning-systems"
