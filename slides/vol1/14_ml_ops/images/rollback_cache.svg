<text x="280" y="138" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#CB202D" text-anchor="middle" opacity="1.0">v1 reads vectors from v2's space</text>
<text x="280" y="170" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#666666" text-anchor="middle" opacity="1.0">(v2 changed the embedding size)</text>
<rect x="4" y="204" width="552" height="210" rx="10" fill="#F7F7F7" stroke="#008F45" stroke-width="2.5" opacity="1.0"/>
<text x="280" y="244" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#008F45" text-anchor="middle" opacity="1.0">A tested rollback restores together:</text>
<text x="36" y="290" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1A1A2E" text-anchor="start" opacity="1.0">• the weights, from the registry</text>
<text x="36" y="330" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1A1A2E" text-anchor="start" opacity="1.0">• the feature transform version</text>
<text x="36" y="370" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1A1A2E" text-anchor="start" opacity="1.0">• the cache (invalidate or swap)</text>
