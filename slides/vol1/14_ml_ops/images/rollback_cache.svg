<rect width="560" height="420" fill="white"/>
<rect x="4" y="8" width="250" height="86" rx="8" fill="#D1E6F3" stroke="#006395" stroke-width="2.5" opacity="1.0"/>
<text x="129" y="44" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1A1A2E" text-anchor="middle" opacity="1.0">Model weights</text>
<text x="129" y="76" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#006395" text-anchor="middle" opacity="1.0">v2 to v1 (reverted)</text>
<rect x="306" y="8" width="250" height="86" rx="8" fill="#F5D2D5" stroke="#CB202D" stroke-width="2.5" opacity="1.0"/>
<text x="431" y="44" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1A1A2E" text-anchor="middle" opacity="1.0">Embedding cache</text>
<text x="431" y="76" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#CB202D" text-anchor="middle" opacity="1.0">still v2 vectors</text>
