<text x="450" y="254" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#666666" text-anchor="middle" opacity="1.0">(illustrative)</text>
<line x1="572" y1="84" x2="650" y2="122" stroke="#888888" stroke-width="3.5" marker-end="url(#arn)" opacity="1.0"/>
<line x1="722" y1="300" x2="700" y2="338" stroke="#888888" stroke-width="3.5" marker-end="url(#arn)" opacity="1.0"/>
<line x1="535" y1="385" x2="370" y2="385" stroke="#888888" stroke-width="3.5" marker-end="url(#arn)" opacity="1.0"/>
<line x1="195" y1="340" x2="175" y2="300" stroke="#888888" stroke-width="3.5" marker-end="url(#arn)" opacity="1.0"/>
<line x1="240" y1="120" x2="320" y2="84" stroke="#888888" stroke-width="3.5" marker-end="url(#arn)" opacity="1.0"/>
<rect x="355" y="32" width="190" height="60" rx="10" fill="#FCE4CC" stroke="#E67817" stroke-width="3" opacity="1.0"/>
<text x="450" y="72" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1A1A2E" text-anchor="middle" opacity="1.0">Detect</text>
<text x="558" y="71" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#E67817" text-anchor="start" opacity="1.0">telemetry bytes per second</text>
<rect x="640" y="150" width="190" height="60" rx="10" fill="#FCE4CC" stroke="#E67817" stroke-width="3" opacity="1.0"/>
<text x="735" y="190" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1A1A2E" text-anchor="middle" opacity="1.0">Diagnose</text>
<rect x="610" y="218" width="250" height="64" rx="4" fill="white" stroke="white" stroke-width="0" opacity="1.0"/>
<text x="735" y="242" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#E67817" text-anchor="middle" opacity="1.0">replay over</text>
<text x="735" y="272" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#E67817" text-anchor="middle" opacity="1.0">logged requests</text>
<rect x="550" y="342" width="190" height="60" rx="10" fill="#FCE4CC" stroke="#E67817" stroke-width="3" opacity="1.0"/>
<text x="645" y="382" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="bold" fill="#1A1A2E" text-anchor="middle" opacity="1.0">Decide</text>
<rect x="520" y="410" width="250" height="64" rx="4" fill="white" stroke="white" stroke-width="0" opacity="1.0"/>
<text x="645" y="434" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#E67817" text-anchor="middle" opacity="1.0">accelerator-hours</text>
<text x="645" y="464" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#E67817" text-anchor="middle" opacity="1.0">for a retraining run</text>
