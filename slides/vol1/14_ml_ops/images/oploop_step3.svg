<text x="255" y="434" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#E67817" text-anchor="middle" opacity="1.0">a second resident copy:</text>
<text x="255" y="464" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#E67817" text-anchor="middle" opacity="1.0">100 GB of tables</text>
<rect x="70" y="150" width="190" height="60" rx="10" fill="#FCE4CC" stroke="#E67817" stroke-width="3" opacity="1.0"/>
