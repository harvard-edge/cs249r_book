closing:
  return_to_hook: "Netflix again: the 2009 ensemble won on the accuracy column alone. The table the class just built has four more columns, and Netflix's choice was a decision on those."
  read_and_practice: ["Network Architectures, 6.1 to 6.10", "self-check questions in each section", "TinyTorch modules on convolution and attention"]
  further_reading:
    - cite: "Network Architectures, 6.9 Comparing and Choosing Architectures"
      why: "The counting rules and workload profile in one place."
    - cite: "He et al., Deep Residual Learning for Image Recognition, CVPR 2016"
      url: "https://arxiv.org/abs/1512.03385"
      why: "Why depth needed skip connections."
    - cite: "Vaswani et al., Attention Is All You Need, NeurIPS 2017"
      url: "https://arxiv.org/abs/1706.03762"
      why: "The transformer and its parallelism claim."
    - cite: "Naumov et al., Deep Learning Recommendation Model for Personalization and Recommendation Systems, 2019"
      url: "https://arxiv.org/abs/1906.00091"
      why: "The DLRM lighthouse."
    - cite: "Gupta et al., The Architectural Implications of Facebook's DNN-based Personalized Recommendation, HPCA 2020"
      url: "https://arxiv.org/abs/1906.03109"
      why: "Why recommenders dominate inference cycles and stress memory."
  bridge: "Lecture 7: how does Python code become kernels on the hardware?"

coverage:
  primary_taught:
    - Inductive bias buys data and cost
    - Every family lowers onto GEMM
    - Architectures as cost signatures
    - Quadratic attention
    - Autoregressive decode and the KV cache
    - Embedding capacity wall
    - Architecture selection by workload profile
  primary_left_to_reading: []
  secondary:
    - "Skip connections and normalization (one optional slide)"
    - "Efficient architecture families (MobileNetV2 concept question)"

notes_for_author:
  - "Netflix Progress Prize facts (107 algorithms, 8.43 percent, 100M against 5B ratings) come from the 2012 Netflix Tech Blog and RecSys tutorial as reported secondhand; the tech blog page refused automated fetch. The chapter's War Story carries only the $1M, 10 percent, and the two retained algorithms."
  - "The context-memory slide is a slide-size redraw of the chapter figure using GPT-2 XL's shape (48 layers, width 1,600, 25 heads); the 80 GB line is drawn at 80 GiB so the scores cross it near 41K tokens, as the chapter states."
  - "Table 8 intensities are FP32 weight-only proxies; the deck never places them against an FP16 ridge point."
