chapter: 06_nn_architectures
lecture: 6
title: Network Architectures
minutes: 75
target_ideas: 30
layer: models
thesis: "Each architecture is a bet about the structure of the data, and each bet commits the machine to its own compute and memory signature."

hook:
  minutes: "0-5"
  setup: "The Netflix Prize leaderboard, 2009: a $1 million award for a 10 percent better rating predictor. Students predict whether Netflix shipped the winning ensemble."
  question_to_class: "Did Netflix put the winning algorithm into production? (A) yes, (B) parts of it, (C) no."
  payoff: "No. The earlier Progress Prize blend of 107 algorithms (8.43 percent) was built for 100 million ratings while production held about 5 billion; Netflix kept two of its algorithms and judged that the Grand Prize's extra accuracy did not justify the engineering. Accuracy is one column; what a model costs the machine is the rest of the table. The lecture builds that table."
  sources:
    - "chapter War Story 6.1 (Johnston 2012, Ars Technica)"
    - "Amatriain and Basilico, Netflix Recommendations: Beyond the 5 stars, Netflix Tech Blog, April 2012; RecSys 2012 tutorial (107 algorithms, 8.43 percent, 100M against 5B ratings)"
    - "photo: Netflix Prize leaderboard, Wikimedia Commons (public domain)"

recall: "Lecture 5: the MNIST network spends 109,184 MACs per digit, and matrix multiply is over 99 percent of its forward-pass FLOPs (Neural Computation)."

driving_question: "What does each architecture commit the machine to?"

running_example: "One accelerator, three requests (a camera frame, a prompt, a click), then the five lighthouses: ResNet-50, MobileNetV2, KWS, GPT-2 XL, DLRM (chapter Table 8)."

goals:
  - "Name the inductive bias of each family and the data structure it matches."
  - "Count weights, multiply-accumulates, and bytes for dense, convolutional, recurrent, attention, and embedding layers."
  - "Predict which limit binds a workload from its arithmetic intensity, state, or table size."
  - "Explain why doubling a transformer's context quadruples its score work."

segments:
  - name: Dense
    question: "What does a layer with no assumptions cost?"
    read: "Network Architectures, 6.1 and 6.2"
    minutes: 8.5
    concept_questions: [1, 2, 3]
  - name: Convolution
    question: "What does assuming locality buy?"
    read: "6.3 and 6.4"
    minutes: 12
    concept_questions: [4, 5, 6, 7]
  - name: Recurrence
    question: "What does carrying state through time cost?"
    read: "6.5"
    minutes: 6
    concept_questions: [8, 9]
  - name: Attention
    question: "What does letting every token see every other token cost?"
    read: "6.6 and 6.7"
    minutes: 14.5
    concept_questions: [10, 11, 12, 13]
  - name: Embeddings
    question: "Why is a recommender a memory machine?"
    read: "6.8"
    minutes: 7
    concept_questions: [14]
  - name: Choosing
    question: "How do we choose, knowing what each family costs?"
    read: "6.9 and 6.10"
    minutes: 12
    concept_questions: [15]

concept_questions:
  - id: 1
    q: "What is an inductive bias, and why does every architecture have one?"
    picture: "spectrum from strong prior, less data (CNN) through transformer to weak prior, more data (MLP); the five families with their data types"
    numbers: "MNIST: 32 dense features need 25,088 weights; 32 3x3 filters need 288, 87x fewer per detector (Example 6.1)"
    example: "Images have locality, language has order, tabular records have neither"
    read: "6.1, 6.2.1"
  - id: 2
    q: "What does a dense layer cost the machine?"
    picture: "dense bipartite graph beside its weight matrix"
    numbers: "784x128 = 100,352 weights; 2,048x2,048 = 4,194,304 weights, 16.8 MB in FP32 (6.2.3, 6.2.5)"
    example: "The MNIST reference layer"
    read: "6.2.3 to 6.2.5"
  - id: 3
    q: "What is arithmetic intensity, and why is a batch-one dense layer at 0.5 FLOP/byte?"
    picture: "equation 2 revealed term by term; focus slide I = O / D"
    numbers: "0.5 FLOP/byte at batch one in FP32; moving a weight costs about 139x its multiply-add (640 pJ against 4.6 pJ; Horowitz 2014)"
    example: "Batching divides the ratio by the batch size (Lecture 5)"
    read: "6.2.5"
  - id: 4
    q: "How does weight sharing cut parameters?"
    picture: "book Fig. 4 (convolution window); bars Dense 205M against Conv 37K"
    numbers: "3x3x64x64 = 36,864 weights against 224^2 x 64 x 64, about 205 million; about 5,575x (Definition 6.3)"
    example: "One 3x3 layer on a 224x224 feature map"
    read: "6.3.2"
  - id: 5
    q: "Why is convolution compute bound when dense layers are not?"
    picture: "intensity bars Dense 0.5 against ResNet-50 80.1 FLOP/byte"
    numbers: "each weight reused at 50,176 positions; 1.85 billion MACs per layer; weights 147.5 KB against activations 12.8 MB (6.3.4); ResNet-50 80.1 FLOP/byte (Table 8)"
    example: "ResNet-50, 25.6M parameters, 8.2 GFLOP per image"
    read: "6.3.4"
  - id: 6
    q: "Why do deep networks need skip connections, and what do they cost?"
    picture: "book Fig. 6 residual block"
    numbers: "56-layer plain net worse than 20-layer; residual 56 layers 7.0 percent against 8.8 percent; residual add about 0.08 FLOP/byte (6.4.1)"
    example: "ResNet-50"
    read: "6.4"
  - id: 7
    q: "Do fewer FLOPs mean a faster model?"
    picture: "ResNet-50 against MobileNetV2 card"
    numbers: "MobileNetV2 3.5M parameters, 600 MFLOP, 13.7x fewer FLOPs; gains far less on datacenter GPUs at small batch (Perspective 6.1)"
    example: "Depthwise separable convolution, about 8 to 9x fewer MACs"
    read: "6.3.5"
  - id: 8
    q: "What does recurrence commit the hardware to?"
    picture: "unrolled RNN chain, built one step at a time"
    numbers: "100 -> 128: 29,184 MACs per step; 1,000 tokens means 1,000 ordered updates; LSTM four times the weights and MACs (6.5)"
    example: "Keyword spotting on a microcontroller (fixed state budget)"
    read: "6.5.2 to 6.5.5"
  - id: 9
    q: "Why does an RNN's state stay flat while a transformer's grows?"
    picture: "log-log plot: RNN state (2 KB) against GPT-2 XL KV cache (307.2 KB per token)"
    numbers: "512-d FP32 state 2 KB (6.5.5); GPT-2 XL 307.2 KB per token (6.7.4)"
    example: "Mamba revives recurrence for decode-time state"
    read: "6.5.5"
  - id: 10
    q: "What does attention compute?"
    picture: "book Fig. 8 (they -> student, finish); softmax(QK^T / sqrt(d)) V built term by term"
    numbers: "S^2 d MACs per head for each of the two products (6.6.3)"
    example: "The trophy did not fit in the suitcase because it was too big / small"
    read: "6.6.1 to 6.6.3"
  - id: 11
    q: "Why does doubling the context quadruple the cost?"
    picture: "score-memory parabola, 4K then 8K tokens (12 heads, FP16, one layer)"
    numbers: "4,096 tokens: 33.6 MB per head per layer; 100,000 tokens x 12 heads: 240 GB per layer, 7,680 GB for 32 layers (Napkin Math 6.1)"
    example: "BERT's 512-token limit: 4,096 tokens would need 64x the score memory (Example 6.4)"
    read: "6.6.4"
  - id: 12
    q: "Why is the same transformer compute bound in prefill and memory bound in decode?"
    picture: "book Fig. 12 prefill and decode"
    numbers: "decode 1.0 FLOP/byte in FP16; GPT-2 XL 1.5B parameters, 3 GFLOP per token (Lighthouse 6.4)"
    example: "A 70B model streams 140 GB of weights per token"
    read: "6.7.4"
  - id: 13
    q: "What grows as context grows: weights, KV cache, or scores?"
    picture: "slide variant of the context-memory figure, built in three steps"
    numbers: "GPT-2 XL: weights 3 GB FP16 fixed; KV passes the weights near 10K tokens; one layer's scores fill an 80 GB device near 41K (6.7.4)"
    example: "Serving budgets the KV cache per request (Lecture 13)"
    read: "6.7.4"
  - id: 14
    q: "Why is a recommender capacity bound?"
    picture: "DLRM pipeline (bottom MLP, tables, interaction, top MLP); capacity bars against 80 GB"
    numbers: "100M items x 128 x 4 B = 51.2 GB, 64 percent of 80 GB; two tables 102.4 GB (Napkin Math 6.2); DLRM 25B embedding parameters, 100 GB; recommenders up to 79 percent of Meta's AI inference cycles (Gupta et al. 2020)"
    example: "Shrink, move, or partition the tables"
    read: "6.8"
  - id: 15
    q: "How do the five lighthouses compare on one machine?"
    picture: "intensity bars for the lighthouses (Table 8); the comparison table students fill in"
    numbers: "ResNet-50 80.1, MobileNetV2 42.8, KWS 25, GPT-2 XL 0.50 FLOP/byte; DLRM n/a (Table 8)"
    example: "One accelerator, three requests (6.1, 6.9)"
    read: "6.9"

worked_examples:
  - name: "Dense layer intensity (equation 2)"
    steps: ["given: d_in x d_out FP32 weights, batch one", "FLOPs = 2 d_in d_out", "bytes = 4 d_in d_out", "0.5 FLOP/byte", "far below any accelerator's balance: memory bound"]
  - name: "Weight sharing (Definition 6.3)"
    steps: ["given: 224x224x64 input, 64 outputs", "dense: 224^2 x 64 x 64 = about 205M", "conv: 3x3x64x64 = 36,864", "about 5,575x", "outputs differ in shape; the filter budget does not grow with resolution"]
  - name: "Napkin Math 6.1: the quadratic bottleneck"
    steps: ["given: 100,000 tokens, 12 heads, FP16", "1.2 x 10^11 scores", "240 GB per layer", "7,680 GB for 32 retained layers", "tile (FlashAttention) or compute fewer scores"]
  - name: "Napkin Math 6.2: the capacity wall"
    steps: ["given: 100M items, 128-wide, FP32", "51.2 GB", "64 percent of an 80 GB A100", "a second table: 102.4 GB, does not fit", "shrink, move, or partition"]

active_learning:
  - at_minute: 2
    type: predict
    prompt: "Did Netflix ship the winning ensemble?"
    answer: "No (C). Engineering cost against a small accuracy gain, during the move to streaming."
  - at_minute: 6
    type: retrieval
    prompt: "What share of the MNIST network's forward-pass FLOPs is matrix multiply?"
    answer: "Over 99 percent; 109,184 MACs per digit."
  - at_minute: 28
    type: concept_question
    prompt: "MobileNetV2 has 13.7x fewer FLOPs than ResNet-50. On a datacenter GPU at small batch, is it 13.7x faster?"
    answer: "No. Depthwise layers have low intensity and leave matrix units idle; gains are far smaller, sometimes none."
  - at_minute: 35
    type: predict
    prompt: "A 1,000-step sequence on an accelerator with 10x the peak FLOP/s: 10x faster?"
    answer: "No. 1,000 ordered steps remain; at batch one each step is a memory-bound matrix-vector product, so more FLOP/s barely helps."
  - at_minute: 42
    type: predict
    prompt: "Double the context from 4K to 8K tokens: score work grows by 2x, 4x, or 8x?"
    answer: "4x (S squared)."
  - at_minute: 55
    type: estimate
    prompt: "100M items, 128-wide, FP32: does the table fit an 80 GB accelerator? Two tables?"
    answer: "51.2 GB, 64 percent; two tables 102.4 GB do not fit."
  - at_minute: 61
    type: diagnose
    prompt: "Fill in the binding limit for each lighthouse."
    answer: "ResNet-50 compute; MobileNetV2 latency on a phone; KWS power; GPT-2 XL decode bandwidth; DLRM capacity."

open_questions:
  - "If transformers win at scale with weak priors, is there still a reason to design architectures by hand?"
  - "Should a context window be priced by the token, when the cost grows faster than the tokens?"
  - "Netflix chose a simpler model it could run. When is a few percent of accuracy worth a new system?"

more_examples:
  - "Vision transformers matched CNNs on ImageNet only with far larger pretraining (Dosovitskiy et al. 2021; Fallacies)."
  - "Mamba: recurrence revived for its fixed decode-time state (Gu and Dao 2023)."
  - "Grouped-query attention cuts KV cache size by sharing keys and values (Ainslie et al. 2023)."
  - "FlashAttention removes score storage but not score arithmetic (Dao et al. 2022)."
  - "Meta: recommendation models up to 79 percent of AI inference cycles (Gupta et al. 2020)."

