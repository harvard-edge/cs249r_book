      url: "https://karpathy.medium.com/software-2-0-a64152b37c35"
      why: "Where the data-as-program framing comes from."
    - cite: "Hernandez and Brown, Measuring the Algorithmic Efficiency of Neural Networks, 2020"
      url: "https://arxiv.org/abs/2005.04305"
      why: "The 44x measurement and how it was made."
  bridge: "Lecture 2: Why does deploying the same model to a phone and a datacenter demand different engineering?"

