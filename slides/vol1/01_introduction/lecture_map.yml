chapter: 01_introduction
lecture: 1
title: Introduction
minutes: 75
notes_minutes: 72
target_ideas: 28
thesis: "An accurate model is not a working system: data defines its behavior, the machine sets its cost, and both must be engineered and measured together."

hook:
  minutes: "0-6"
  setup: "Google Flu Trends estimated US flu activity from search queries with a reporting lag of about one day (Ginsberg et al. 2009). Show the real weekly estimate tracking the CDC count through 2010-11, then stop the plot."
  question_to_class: "Predict: what did the estimate do in the 2012-13 flu season? (A) tracked the CDC within 10 percent, (B) fell well below, (C) ran far above, about double at times, (D) stopped updating."
  payoff: "C. The estimate peaked at 10.6 percent of doctor visits against the CDC's 6.1 percent, and from August 2011 it was too high in 100 of 108 weeks. No server failed. The lecture explains how a system fails while running correctly, and returns to the plot at the end."
  sources:
    - "chapter §1.2, War Story 1.1 (Lazer et al. 2014; Ginsberg et al. 2009)"
    - "Data: Delphi Epidata API (CMU) archives of the GFT estimate and CDC ILINet, retrieved 2026-10-16; images/data/"
driving_question: "Why does an accurate model not guarantee a reliable, efficient system?"
running_example: "Google Flu Trends for the quality half; a spam filter for D·A·M; ResNet-50 and GPT-2 XL on one H100 for the iron law."

segments:
  - name: Data Is the Program
    divider: "What changes when data, not code, defines behavior?"
    read: "Introduction, §1.2 and §1.5"
    minutes: 8.5
    concept_questions: [1, 2, 3]
  - name: The Bottleneck Moves
    divider: "Why did learning from data win, and what did it cost?"
    read: "Introduction, §1.3 and §1.4"
    minutes: 12
    concept_questions: [4, 5, 6, 7]
  - name: Silent Failure
    divider: "How can a system fail while every check is green?"
    read: "Introduction, §1.6"
    minutes: 10
    concept_questions: [8, 9, 10]
  - name: The Iron Law
    divider: "Where does the time go?"
    read: "Introduction, §1.5 and §1.7"
    minutes: 20
    concept_questions: [11, 12, 13, 14, 15]
  - name: Efficiency
    divider: "How do we get more from the same machine?"
    read: "Introduction, §1.8"
    minutes: 7.5
    concept_questions: [16, 17]

concept_questions:
  - id: 1
    q: "What is Software 2.0, and what plays the role of source code, compiler, and debugger?"
    picture: "Side-by-side pipelines: a programmer writes spam rules that become a program; labeled emails pass through a training loop that writes the weights. The Software 2.0 column of the role table is revealed after students fill it in."
    numbers: "Chapter Table 1 (Karpathy 2017)."
    example: "Spam filter: the rule 'if free or winner appears, then spam' against learned word likelihoods (Example 1.3)."
    read: "§1.2"
  - id: 2
    q: "Why can no test set prove a model correct?"
    picture: "Book margin figure: the input space with one dot for the test set; beside it the two counts."
    numbers: "A 224x224 RGB image has 256^150,528 possible values, a number with 362,508 digits; the ILSVRC validation set has 50,000 images (§1.2)."
    example: "ImageNet evaluation of AlexNet."
    read: "§1.2"
  - id: 3
    q: "What is the dual mandate?"
    picture: "A 2x2 grid: trustworthy behavior against within budget. Accurate but too slow is unusable; fast but trained on unrepresentative data is wrong at machine speed."
    numbers: "Chapter §1.1 wording; a search service handles more than 13.7 billion queries a day within latency targets (§1.1)."
    example: "Driver-assistance pedestrian detection: within 50 ms and correct at dusk."
    read: "§1.1, §1.5"
  - id: 4
    q: "What stopped each era of AI?"
    picture: "Four-column timeline built left to right: symbolic AI (logic), expert systems (knowledge), statistical learning (features), deep learning (infrastructure), each with its example."
    numbers: "STUDENT 1964, MYCIN 1975, HOG 2005 with SVMs, AlexNet 2012 (§1.3, Table 2)."
    example: "STUDENT broke on new phrasing; MYCIN grew one rule at a time; a HOG pipeline had to be redesigned for each new object."
    read: "§1.3"
  - id: 5
    q: "Why was AlexNet a systems result, not only an algorithm?"
    picture: "Book figure of AlexNet with its two GPU streams labeled."
    numbers: "60 million parameters at 4 bytes is about 240 MB; each GTX 580 had 3 GB; training state did not fit on one card, so the layers were split across two GPUs over PCIe; 15.3 percent top-5 error against 26.2 percent (§1.3.3)."
    example: "The two-GPU split, the first model parallelism most students will see."
    read: "§1.3.3"
  - id: 6
    q: "What is the bitter lesson?"
    picture: "Deep Blue (museum photo) beside a Go board; Sutton's sentence."
    numbers: "Deep Blue: 480 custom chess chips, 100 to 200 million positions per second; AlphaGo Zero beat AlphaGo Lee 100 to 0 after three days of self-play (§1.4)."
    example: "Deep Blue used encoded chess knowledge; AlphaGo Zero learned without human games or hand-built features."
    read: "§1.4"
  - id: 7
    q: "How fast did the compute bill grow?"
    picture: "Log-scale bars of GPU-days: AlexNet, GPT-3, GPT-4-class."
    numbers: "AlexNet 12 GPU-days (2 GPUs, 6 days); GPT-3 about 405 V100 GPU-years, about 148,000 GPU-days (Patterson et al. 2021); GPT-4-class about 2.5 million reference GPU-days, an estimate (Patel and Wong 2023)."
    example: "GPT-3: 6 x 175e9 x 300e9 is about 3.14e23 FLOPs (§1.3.3)."
    read: "§1.3.3, §1.4 Table 3"
  - id: 8
    q: "What does the degradation equation say?"
    picture: "Equation anatomy, built term by term: Accuracy(t) is about Accuracy_0 minus lambda times D(P_t || P_0)."
    numbers: "Pedestrian recall 95 to 85 percent at full frame rate: the miss rate triples from 1 in 20 to 3 in 20 (§1.6, illustrative)."
    example: "Better winter training data lowers lambda; a better model may only raise Accuracy_0."
    read: "§1.6"
  - id: 9
    q: "What does drift look like in real data?"
    picture: "Bar chart of the GFT estimate divided by the CDC count, by flu season, 2003-04 to 2012-13."
    numbers: "Seasons through 2010-11 between 0.87 and 1.12; 2011-12 at 1.27; 2012-13 at 1.66 (computed from the Delphi archives)."
    example: "Google Flu Trends."
    read: "§1.2, §1.6"
  - id: 10
    q: "What is training-serving skew?"
    picture: "Two pipelines feed one model: training computes account age in days, serving in seconds."
    numbers: "Chapter self-check scenario (§1.6)."
    example: "Image resizing with a different interpolation method; different missing-value defaults."
    read: "§1.6"
  - id: 11
    q: "What is a binding constraint, and why does it move?"
    picture: "Kit D·A·M triangle with one axis lit per step, using the spam filter."
    numbers: "None; this is the diagnostic loop."
    example: "New phishing tactic absent from training (Data); model cannot express the pattern (Algorithm); traffic spike (Machine). Faster accelerators expose slow storage; a bigger dataset exposes model capacity; a bigger model overflows memory (§1.5)."
    read: "§1.5"
  - id: 12
    q: "How does the iron law go from three factors to three terms?"
    picture: "Equation built in steps: the D·A·M product; the first two factors are O; the machine factor unpacks into memory, compute, and overhead."
    numbers: "Decode at batch 1: one token of logical input, gigabytes of weights moved (§1.7)."
    example: "GPT-3: O is about 6ND, 3.14e23 FLOPs."
    read: "§1.7"
  - id: 13
    q: "How do we use the iron law to estimate time and choose an upgrade?"
    picture: "Worked example card and line-by-line calculation (Napkin Math 1.1)."
    numbers: "2 GB at 100 GB/s is 20 ms; 1 GFLOP at 100 GFLOP/s effective is 10 ms; 5 ms overhead; 35 ms total; 2x bandwidth gives 25 ms; ideal overlap gives 25 ms then 15 ms."
    example: "Napkin Math 1.1."
    read: "§1.7"
  - id: 14
    q: "Which resource does each lighthouse model stress?"
    picture: "Five cards: ResNet-50, GPT-2/Llama, DLRM, MobileNetV2, keyword spotting, each with its binding resource and iron-law term; then MLSysIM bars for ResNet-50 and GPT-2 XL."
    numbers: "MLSysIM, H100 FP16, utilization 0.5: ResNet-50 batch 64 memory 0.11, compute 1.06, overhead 0.51 ms; GPT-2 XL batch 1 memory 0.99, compute 0.006, overhead 0.49 ms. Doubling bandwidth: -3 percent against -33 percent."
    example: "Raise peak compute for convolutions; raise bandwidth for decode (§1.7.1)."
    read: "§1.7.1"
  - id: 15
    q: "Why does a 3x faster model not make the product 3x faster?"
    picture: "Stacked latency bars before and after."
    numbers: "60 + 45 + 25 = 130 ms; 60 + 15 + 25 = 100 ms; 23 percent, not 67 percent (§1.11)."
    example: "Amdahl's law (Amdahl 1967); the hypothetical 2 + 8 + 1 = 11 s task becomes 7 s with 2x compute (§1.7)."
    read: "§1.7, §1.11"
  - id: 16
    q: "What are the three efficiency levers?"
    picture: "The D·A·M product with one lever under each factor."
    numbers: "GPT-3 at 45 versus 60 percent utilization: 25 versus 19 days (Napkin Math 1.2), a compute-efficiency gain."
    example: "Data selection (fewer, better samples); compression and better architectures (fewer FLOPs per sample); batching, fusion, overlap (fewer seconds per FLOP)."
    read: "§1.8"
  - id: 17
    q: "If algorithms got 44x more efficient, why did compute budgets grow?"
    picture: "Slide variants of the book figures side by side: algorithmic efficiency since AlexNet; training compute of notable models."
    numbers: "44x less compute to reach AlexNet accuracy, 2012 to 2019 (Hernandez and Brown 2020); about 8 orders of magnitude growth in training compute (Epoch AI)."
    example: "Jevons paradox; return on compute."
    read: "§1.8, §1.8.1"

worked_examples:
  - name: "Napkin Math 1.1: one local execution"
    steps:
      - "Given: 2 GB moved at 100 GB/s; 1 GFLOP at an effective 100 GFLOP/s; 5 ms overhead; sequential."
      - "Memory term: 2 GB / 100 GB/s = 20 ms."
      - "Compute term: 1 GFLOP / 100 GFLOP/s = 10 ms (the effective rate already includes utilization)."
      - "Total: 20 + 10 + 5 = 35 ms; memory is the largest term."
      - "Double bandwidth: 10 + 10 + 5 = 25 ms, not half."
      - "Ideal overlap: max(20, 10) + 5 = 25 ms before, max(10, 10) + 5 = 15 ms after; the stages are now balanced."
  - name: "Double the bandwidth for two lighthouses (MLSysIM)"
    steps:
      - "Given: H100, FP16, utilization 0.5; ResNet-50 at batch 64, GPT-2 XL decode at batch 1."
      - "Read the bars: ResNet-50 is mostly compute; GPT-2 XL is mostly memory; both pay about 0.5 ms of dispatch overhead."
      - "Halve each memory term."
      - "Result: ResNet-50 1.68 to 1.63 ms (-3 percent); GPT-2 XL 1.48 to 0.99 ms (-33 percent)."
      - "Meaning: the same upgrade helps one workload and not the other, and overhead caps the one it helps."
  - name: "Amdahl in a request path"
    steps:
      - "Given: preprocess 60 ms, model 45 ms, postprocess 25 ms."
      - "Model becomes 3x faster: 15 ms."
      - "Total: 130 ms to 100 ms, 23 percent; overall speedup 1.3x."
      - "Meaning: measure the whole path before optimizing a part."

active_learning:
  - at_minute: 3
    type: predict
    prompt: "What did Google Flu Trends do in the 2012-13 season? A tracked, B well below, C far above, D stopped."
    answer: "C. Peak 10.6 percent against the CDC's 6.1 percent; too high in 100 of 108 weeks from August 2011 (Lazer et al. 2014)."
  - at_minute: 8
    type: retrieval
    prompt: "Close your notes: write the iron law's three factors and the D·A·M axis of each (Lecture 0)."
    answer: "Samples per task (Data), FLOPs per sample (Algorithm), seconds per FLOP (Machine)."
  - at_minute: 12
    type: concept_question
    prompt: "Fill in Software 2.0: what is the source code, the compiler, the failure mode, and the debugging target?"
    answer: "Weights shaped by data; the training loop (SGD); also silent loss of statistical quality; also the data and learned behavior (Table 1)."
  - at_minute: 29
    type: concept_question
    prompt: "True or false: (1) hand-built domain rules give a lasting advantage as compute grows; (2) more computation always gives better results."
    answer: "Both false. (1) contradicts the bitter lesson; (2) the method must use the computation productively, and the data and objective must support the task (§1.4)."
  - at_minute: 37
    type: diagnose
    prompt: "Drift, skew, or an ordinary bug? GFT in 2012-13; pedestrian recall falls in winter; account age in days at training, seconds at serving; a serving process crashes on a null field."
    answer: "Drift (the proxy's relation to illness changed); drift (the input population changed); skew (train and serve transforms differ); ordinary bug (it is visible)."
  - at_minute: 53
    type: predict
    prompt: "Double the H100's memory bandwidth: how much faster does each workload get?"
    answer: "ResNet-50 3 percent; GPT-2 XL 33 percent (MLSysIM), not 50 percent, because the 0.49 ms overhead stays."
  - at_minute: 64
    type: discuss
    prompt: "A new model adds 1 point of accuracy and needs 10x the operations. Ship it? Decide for a spam filter and for a cancer screening aid."
    answer: "Depends on what a point is worth: RoC = delta accuracy / delta cost compared against the value of a point. Likely no for a spam filter at 10x serving cost; possibly yes for screening if latency and budget allow."

open_questions:
  - "If a dataset change can change behavior as much as a code change, who should review it, and how?"
  - "The bottleneck moved from logic to knowledge to features to infrastructure. What limits AI next: energy, data, or memory?"
  - "When should a team choose a smaller model on better data over a larger model?"

