notes_for_author:
  - "2026-10-19 sweep: Lecture 0 now only names D·A·M and the iron law (it no longer works the GPT-3 estimate or sorts problems by axis). The opening retrieval asks for the three axes and a guess at each factor, and reveals the law with the GPT-3 line as the chapter's Napkin Math 1.2; the D·A·M diagnosis and three-term notes now refer to the opening recall. D3: the skew slide drops the Feast code (Lecture 4 owns training-serving consistency and shows Feast); its half minute goes to the diagnose activity (how to confirm skew), which now matches its 3-minute label."
  - "2026-10-19, panel fixes. The goals slide carries the course-thread strip with all five parts filled, since this lecture defines the dual mandate and the iron law (H1). The MLPerf slide now reads 'the H200 adds bandwidth and capacity, not compute'; the note gives the 1.76x capacity (141 against 80 GB, calcs.py) and says the extra capacity lets each weight read serve a larger batch, which is how the 1000 W run (1.45x) slightly passes the 1.43x bandwidth ratio (M5; the panel's 'bandwidth bounds the gain' does not hold for the 1000 W run). Six frames moved to [OPTIONAL] so the core runs about 52.5 minutes (M1): Tesla stop signs, the era timeline, the 67-model ImageNetV2 plot, the GPT-2 profile, the 23 percent Amdahl pitfall, and the 10x-compute discussion. The section dividers still show no stack (blocked on a theme-level divider design, panel M4)."
  - "2026-10-19, visual and depth pass (visual audit). Real things added: Tesla stop-sign slide (Karpathy, CVPR 2020 workshop, via Roboflow; new frame after the Software 2.0 table); Mark I Perceptron photo on the timeline; GTX 580 card photo on the AlexNet slide; ImageNetV2 scatter of 67 models from Recht et al. 2019 appendix tables (new frame after the degradation equation; the 64 neural networks lost 10.3 to 13.6 points; fit new = 0.97 x original - 9.5); Feast v0.67.0 on_demand_feature_view excerpt as step 3 of the skew slide; Waymo test car photo on the diagnose slide; a torch.profiler table of one GPT-2 (124M) decode step run on one Apple M5 Max core (images/profile_gpt2.py, data/gpt2_profile.txt; both weight-bound kernels at 76 and 79 GB/s); shared photos on three lighthouse cards; MLPerf Inference v4.0 Llama 2 70B logs, H100 against H200 (1.27x at 700 W, 1.45x at 1000 W, bandwidth ratio 1.43, compute 1.00), new frame after the bandwidth prediction. The bandwidth bars now say they add the terms (no overlap). Every derived number is computed in images/calcs.py; the GPT-3 work in the GPU-days note now reads 3.15e23 (computed) against the 3.14e23 reported. Open questions and Read and explore merged into one frame; D·A·M slide retitled to name the diagnosis. Timing held at 72 minutes by trimming eleven notes by half a minute; 34 frames."
  - "GFT magnitude: the chapter says roughly twice the CDC level in 2012-13. Against today's revised CDC ILINet (weighted), the peak ratio is 10.6/6.1 = 1.74 and single weeks reach 2.3. The deck shows the data and quotes Lazer's 100 of 108 weeks."
  - "MLSysIM's memory term counts the weight bytes plus an activation estimate of 10 percent of the weight bytes per sample (engine/engine.py): about 380 MB for ResNet-50 at batch 64 (51 MB of weights) and 3.3 GB for GPT-2 XL (3.0 GB of weights). The reported arithmetic intensity, 1,385 FLOP/byte for ResNet-50, includes that estimate; weights alone would give about 10,000."
  - "MLSysIM SingleNodeModel reports the overlapped total (max of memory and compute, plus overhead): 1.57 ms for ResNet-50 and 1.48 ms for GPT-2 XL. The bars sum the terms, the sequential form the chapter teaches; the notes give both."
  - "The book's algorithmic-efficiency figure legend says about 14-month doubling; the prose says halving roughly every 15 months. The deck avoids the period."
  - "The chapter's iron-law bar figure is schematic; the deck replaces it with MLSysIM values."
  - "2026-10-17, round 1 review fixes. Kept the GTX 580 die photo on the title slide (author decision: it is the card that trained AlexNet and returns in the second segment); the old cover_introduction.png is not used. Corrected the MLSysIM memory description on the bandwidth slide (credit, notes, make_figs.py docstring) and printed each segment's value on the bars; values rechecked by running make_figs.py, unchanged. Added the illustrative degradation plot (intercept against slope), named drift on the slides, defined recall, drew the D·A·M migration arrows on the triangle, glossed the iron-law symbols, named the dual mandate on its slide, added the GPT-3 line to the recall answer, drew a column-sized Flu Trends plot for the synthesis, and replaced the takeaways question with a retrieval that covers both halves. Tagged every content note [CORE] or [OPTIONAL]."
  - "2026-10-17, timing. Two activities close the 16-minute stretches: a one-minute estimate on the AlexNet slide (minute 23) and the Napkin Math worked example run as a 3-minute estimate (minute 51). Trimmed to hold 72 minutes: goals 1.5 to 1, verification gap 2.5 to 2, lighthouses 2.5 to 2, read and explore 1 to 0.5. The AlexNet slide stays [CORE], against the review's suggestion, because its estimate closes a gap."
  - "Kit figure, out of deck scope: the D·A·M triangle's vertex names are drawn at 26 px on a 900 px canvas, about 6 pt at half-slide width. The deck crops the canvas margins and shows it at 0.6 of the text width, which brings the names to about 8 pt. A kit redraw with larger names would help every deck that uses it."
