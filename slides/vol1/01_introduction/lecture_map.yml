closing:
  return_to_hook: "The GFT plot again, annotated: the failure sat on the data axis (the proxy drifted), the service stayed healthy (silent), and the fix was a feedback loop to CDC clinical data."
  read_and_practice: ["Introduction §1.2 to §1.8 and §1.11", "the chapter's self-check questions", "TinyTorch setup and Module 01 (tensors)"]
  further_reading:
    - cite: "Introduction, §1.2 to §1.8"
      url: "https://mlsysbook.ai"
      why: "The full argument and every number used today."
