closing:
  return_to_hook: "The GFT plot again, annotated: the failure sat on the data axis (the proxy drifted), the service stayed healthy (silent), and the fix was a feedback loop to CDC clinical data, not a bigger model."
  read_and_practice: ["Introduction §1.2 to §1.8 and §1.11", "the chapter's self-check questions", "TinyTorch setup and Module 01 (tensors)"]
  further_reading:
    - cite: "Introduction, §1.2 to §1.8"
      url: "https://mlsysbook.ai"
      why: "The full argument and every number used today."
    - cite: "Lazer, Kennedy, King, and Vespignani, The Parable of Google Flu: Traps in Big Data Analysis, Science, 2014"
      url: "https://doi.org/10.1126/science.1248506"
      why: "The hook's failure, analyzed."
    - cite: "Sutton, The Bitter Lesson, 2019"
      url: "http://www.incompleteideas.net/IncIdeas/BitterLesson.html"
      why: "One page; the history argument in the author's words."
    - cite: "Karpathy, Software 2.0, 2017"
      url: "https://karpathy.medium.com/software-2-0-a64152b37c35"
      why: "Where the data-as-program framing comes from."
    - cite: "Hernandez and Brown, Measuring the Algorithmic Efficiency of Neural Networks, 2020"
      url: "https://arxiv.org/abs/2005.04305"
      why: "The 44x measurement and how it was made."
  bridge: "Lecture 2: Why does deploying the same model to a phone and a datacenter demand different engineering?"

