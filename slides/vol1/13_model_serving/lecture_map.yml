closing:
  return_to_hook: "Back to the two cost bars. The 7.5x is the hook's version of a planning result: at 5,000 requests/s under a 50 ms p99 sub-budget, batch-1 service needs 36 H100s and batched service about 3 (§13.10.2, same utilization factor, still to be load-tested). In dollars at 5,000 requests/s: $8.00 against $0.67 per million requests (derived, $4 per H100-hour). A tighter deadline is bought with accelerators."
