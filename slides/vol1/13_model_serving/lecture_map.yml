notes_for_author:
  - "Example 13.1 says batch 1 'multiplies the hardware cost per million queries by 8x'; $3.92 / $0.52 = 7.5x. The slide says 7.5x. The chapter could say 7.5x."
  - "The book's ResNet-50 numbers (3.5 ms, 283 req/s, table 8, table 9, table 3 host phases) are the modeled reference profile and stated assumptions; every slide that shows them is labeled 'modeled' or 'assumed'. Measured anchors on the same frames: MLPerf v5.0 (H100 Server against Offline; L4 SingleStream, MultiStream, Offline), Richins et al. for the latency budget."
  - "The L4 batch-8 rate (10,390/s) and per-GPU Offline rate (12,855/s) are derived from MLPerf values (8 / 0.770 ms; 38,566 / 3) and labeled derived. MultiStream is 8 samples per query by rule; whether the submission ran SingleStream and MultiStream on one of the three L4s is assumed and stated in the notes."
  - "The MLPerf v5.0 ResNet-50 15 ms Server bound is read from the inference_policies llama2-70b-interactive branch, which holds the v5.0-era datacenter table; the current master no longer lists ResNet-50 in the datacenter suite."
  - "vLLM's Orca baselines are the vLLM authors' reimplementations of Orca with three reservation policies; the slide says 'Orca as reimplemented by Kwon et al.'. Fig. 2 percentages are read from the extracted figure text; the breakdown of the remaining share (reservation, internal, external) is not shown on the slide."
  - "Splitwise's 'batch 64, 2x TBT' is a measured statement in prose (§III-C), not a table value; the slide quotes it. Its Table IV values are P50 without batching on Llama 2 70B."
  - "The joules-per-token bars are derived from §13.9.2 token rates and Napkin Math 13.5's 1 kW node; they assume constant power, which Splitwise supports qualitatively for the token phase. Labeled 'derived'."
  - "The 33x figure (Elsworth et al. 2025) mixes model changes (23x) with utilization (1.4x) and is a whole-service number, not a batching measurement; the notes say so."
  - "No \\mlsysfocus planned; the p99 law is written on the knee plot instead. If one focus slide is wanted, p99 ~= 4.6 S / (1 - rho) is the candidate."
  - "Old deck figures to inspect for reuse or variants: ttft-tpot-timeline.svg, continuous-vs-static-batching.svg, queuing-latency.svg, batching-comparison.svg. The old deck's Facebook war story and Llama-3-70B exercise are not used."

