closing:
  return_to_hook: "Back to the two cost bars. The 7.5x is the hook's version of a planning result: at 5,000 requests/s under a 50 ms p99 sub-budget, batch-1 service needs 36 H100s and batched service about 3 (§13.10.2, same utilization factor, still to be load-tested). For LLMs the measured version: the same 8x H100 system serves Llama 2 70B at 30,904 tokens/s under 2,000/200 ms TTFT/TPOT and at 12,979 tokens/s under 450/40 ms (MLPerf v5.0, 5.0-0020). A tighter deadline is bought with accelerators."
  read_and_practice: ["§13.1, §13.3 to §13.5, §13.8.1 to §13.8.4, §13.9, §13.11", "Self-check questions for §13.3, §13.4, §13.5, §13.9", "Napkin Math 13.2, 13.3, 13.4; Example 13.4; Checkpoints 13.2 and 13.5"]
