<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="480" fill="white"/>
<text x="10" y="34" font-size="24" fill="#666666" font-weight="bold" text-anchor="start">Software</text>
<line x1="55" y1="50" x2="55.0" y2="420.0" stroke="#666666" stroke-width="3"/>
<polygon points="55,432 48.0,420.0 62.0,420.0" fill="#666666"/>
<text x="10" y="466" font-size="24" fill="#666666" font-weight="bold" text-anchor="start">Hardware</text>
<text x="560" y="34" font-size="24" fill="#666666" font-weight="bold" text-anchor="start">Terms it moves</text>
<g opacity="1">
<rect x="90" y="52" width="420" height="116" rx="6" fill="#FCE4CC" stroke="#E67817" stroke-width="3"/>
<text x="300" y="102" font-size="30" fill="#1A1A2E" font-weight="bold" text-anchor="middle">What the model computes</text>
<text x="300" y="144" font-size="27" fill="#E67817" font-weight="normal" text-anchor="middle">pruning, distillation</text>
<line x1="516" y1="110" x2="540.0" y2="110.0" stroke="#E67817" stroke-width="3"/>
<polygon points="552,110 540.0,117.0 540.0,103.0" fill="#E67817"/>
<text x="560" y="102" font-size="27" fill="#E67817" font-weight="bold" text-anchor="start">FLOPs/sample,</text>
<text x="560" y="138" font-size="27" fill="#E67817" font-weight="bold" text-anchor="start">weight bytes</text>
</g>
<g opacity="0">
<rect x="90" y="188" width="420" height="116" rx="6" fill="#D1E6F3" stroke="#006395" stroke-width="3"/>
<text x="300" y="238" font-size="30" fill="#1A1A2E" font-weight="bold" text-anchor="middle">How values are stored</text>
<text x="300" y="280" font-size="27" fill="#006395" font-weight="normal" text-anchor="middle">quantization</text>
<line x1="516" y1="246" x2="540.0" y2="246.0" stroke="#006395" stroke-width="3"/>
<polygon points="552,246 540.0,253.0 540.0,239.0" fill="#006395"/>
<text x="560" y="238" font-size="27" fill="#006395" font-weight="bold" text-anchor="start">bytes moved,</text>
<text x="560" y="274" font-size="27" fill="#006395" font-weight="bold" text-anchor="start">energy/op</text>
</g>
<g opacity="0">
<rect x="90" y="324" width="420" height="116" rx="6" fill="#E6D4E5" stroke="#7E317B" stroke-width="3"/>
<text x="300" y="374" font-size="30" fill="#1A1A2E" font-weight="bold" text-anchor="middle">How it executes</text>
<text x="300" y="416" font-size="27" fill="#7E317B" font-weight="normal" text-anchor="middle">fusion, sparse kernels</text>
<line x1="516" y1="382" x2="540.0" y2="382.0" stroke="#7E317B" stroke-width="3"/>
<polygon points="552,382 540.0,389.0 540.0,375.0" fill="#7E317B"/>
<text x="560" y="374" font-size="27" fill="#7E317B" font-weight="bold" text-anchor="start">bytes,</text>
<text x="560" y="410" font-size="27" fill="#7E317B" font-weight="bold" text-anchor="start">overhead, efficiency</text>
</g>
</svg>
