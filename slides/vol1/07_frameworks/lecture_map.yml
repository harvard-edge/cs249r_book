notes_for_author:
  - "The 15 us per-operation cost (10 us Python dispatch + 5 us launch) is the chapter's illustrative model; slides label it a model, not a measurement."
  - "The ResNet-50 compile throughputs and 30 s compile time are the chapter's hypothetical table 4 values; the slide says hypothetical."
  - "The ResNet-50 activation range (8 to 12 GB at batch 64) is the chapter's illustrative scenario; batch 512 scales it linearly as §7.10 does."
  - "The framework-choice latencies are the chapter's hypothetical project measurements (§7.9)."
  - "The in-place example uses sigmoid (whose backward reads its saved output) rather than the chapter's unnamed custom activation; behavior matches Example 7.2."
  - "The serial and overlapped copy timelines are schematic; only the 0.6 ms copy time is a chapter number."
