closing:
  return_to_hook: "Back to 284 t against 3.2 t. What record would have settled it in 2019? The measured energy at a stated boundary, the processor and its measured power, the datacenter's PUE, the grid intensity and whether it was market- or location-based, and the lineage of the run (the proxy task, the model size, the checkpoints). Now look at the same record from the governance side: lineage from data to checkpoint to device is what an erasure request queries, and a compact manifest per run or per decision is what an audit reads. The same record (energy at a stated boundary, hardware, PUE, grid, lineage) settles the carbon question and answers an erasure request or an audit."
  read_and_practice:
    - "§15.4 (all), §15.5.2 to §15.5.5, §15.6 (training-only pitfall, weights fallacy, documentation pitfall)"
    - "Self-check questions for §15.4 and §15.5"
    - "Napkin Math 15.4 and 15.5; Checkpoint 15.4; table 11 and table 12"
  further_reading:
    - cite: "Responsible Engineering, §15.4 and §15.5"
      url: ""
      why: "The lifecycle TCO, the carbon accounting, and governance as infrastructure, with every number."
    - cite: "Patterson et al., Carbon Emissions and Large Neural Network Training, 2021"
      url: "https://arxiv.org/abs/2104.10350"
      why: "The four factors measured on real runs, and how a careful estimate missed by 88x."
    - cite: "Luccioni, Viguier, Ligozat, Estimating the Carbon Footprint of BLOOM, a 176B Parameter Language Model, JMLR 2023"
      url: "https://arxiv.org/abs/2211.02001"
      why: "The only full life-cycle account of a large model: dynamic, idle, embodied, and a deployed endpoint."
    - cite: "Elsworth et al., Measuring the Environmental Impact of Delivering AI at Google Scale, 2025"
      url: "https://arxiv.org/abs/2508.15734"
      why: "Energy, carbon, and water per prompt at a stated boundary, from a production fleet."
    - cite: "Carlini et al., Extracting Training Data from Large Language Models, USENIX Security 2021"
      url: "https://arxiv.org/abs/2012.07805"
      why: "Why data in the weights is still data."
    - cite: "Dwork and Roth, The Algorithmic Foundations of Differential Privacy, 2014 (free online)"
      url: "https://www.cis.upenn.edu/~aaroth/privacybook.html"
      why: "The definition and its composition, for students who want the mathematics behind the accountant."

bridge: "Lecture 16: every constraint so far, from latency to fairness to carbon, was taught one layer at a time. What does mastering the full stack let you do?"

