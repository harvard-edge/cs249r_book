chapter: 15_responsible_engr
lecture: "15b"
title: "Responsible Engineering, Part 2: Cost, Carbon, and Evidence"
layer: applications
minutes: 75
notes_minutes: 71
target_ideas: 30
status: "BUILT (2026-10-17). Planned and built the same day; see build_note. Part 1 (Lecture 15) revised to match (its revision_note)."

thesis: "A system owes more than correct decisions: its energy, carbon, and dollars over its whole life, and the duties it owes the people whose data it holds, are quantities the machine must compute, spend, and record, so carbon is energy times PUE times grid intensity summed over training, serving, idle time, and manufacturing, and every legal duty becomes a capability with a cost in compute, bytes, or reviewer hours that is designed in before the data arrives."

division: "Part 1 (Lecture 15) asks whether the system treats people correctly: proxies, who the test set covers, fairness criteria and their conflict, the price of a fairness constraint, and the feedback loop. Part 2 (this lecture) asks what else the system owes and whether it can prove it: carbon and cost over the system's life, worked from measured numbers, and governance as a data system (obligations as capabilities, explanation and review cost, lineage and erasure, memorization, differential privacy, audit logs). Part 1's Cost and Carbon and Governance segments (about 17 minutes) move here and are rebuilt at twice the depth."

hook:
  minutes: "0-5.5 (two frames: predict, then the reveal with three causes)"
  setup: "Step 1: a 2019 estimate (Strubell et al., Table 1) put the neural architecture search that found the Evolved Transformer at 626,155 lb of CO2e, 284 t, beside one car's lifetime of 126,000 lb (57 t): 'five cars'. It was the most quoted number about AI's carbon for two years. Step 2: the question. Step 3: reveal on a log axis, 284 t estimated against 3.2 t measured by the team that ran the search, 88 times lower. Step 4: three tags for why (Patterson et al. 2021, Appendices C and D): a small proxy task (18.7x); TPU v2, not P100 (3.3x performance per watt); PUE 1.10 in Google's Georgia datacenter, not the 2018 US average 1.58. The grid was about the same (0.431 against 0.423 kg/kWh). Corrected 2026-10-18; see revision_note."
  question_to_class: "In 2021 the team that ran the search measured its real emissions. Was the real number A) higher, about 600 t B) about the same, 284 t C) about 30 t D) about 3 t?"
  payoff: "D: 3.2 t net (Patterson et al. 2021, Table 4 and section 4.1): 88 times lower for an energy-efficient operator and 18.7 times too high even for an average one. The estimate was careful; it lacked the record, because no one had published which task was searched, on which processor, in which datacenter. 18.7 x 3.3 x 1.4 is about 88; the same search in Google's Iowa datacenter, net of its carbon-free purchases, would have been 0.6 t (Appendix D). The search itself paid back 15 to 1 (48.5 t saved by Meena using the architecture it found). The lecture's claim follows: a carbon number is a computation over stated inputs, every factor is a lever, and a published record of the inputs is what lets anyone check it. The synthesis returns here and writes that record, and shows it is the same record an erasure request or an audit needs."
  sources:
    - "Strubell, Ganesh, McCallum, Energy and Policy Considerations for Deep Learning in NLP, ACL 2019, Table 1 (626,155 lb for Transformer big with NAS; car lifetime 126,000 lb); chapter section 15.4 opening."
    - "Patterson et al. 2021, arXiv 2104.10350, read for this plan: Table 4 (Evolved Transformer NAS 3.2 net tCO2e; fraction of the 284 tCO2e estimate 0.011), section 4.1 ('18.7X too high for the average organization and 88X off in emissions for energy-efficient organizations like Google'; proxy task), section 2.3 (US average PUE 1.58 in 2018, 1.59 in 2020; Iowa 1.11), section 2.4 (0.429 gross US mix; 0.080 net Iowa), Table 4 note (48.5 t saved by Meena, 15:1). Re-read 2026-10-18 for the hook's causes: Table 4 (NAS run in Georgia, Dec 2018, PUE 1.10, 0.431 kg/kWh gross and net, 208 W per TPU v2, 200 chips, 6.8 days, 7.5 MWh); Appendix C, p. 21 (proxy task, Transformer Base at batch 4,096 against Big at 32,768: 2.3x and 8x cost per step; 284 t to 15.2 t, '~18.7'; '~5X further reduction' from hardware and datacenter); Appendix D, p. 22 (PUE 1.10 against 1.58; 0.431 against the EPA's 0.423; 32,633 TPU v2 hours against 117,780 P100 hours, 208 W against 189 W, '3.3X'; '(6.8 * 24 * 200 * 208 * 1.10 / 1000) * 0.431 / 1000 = 3.2 tCO2e'; '88X smaller'; Iowa rerun 0.6 t)."

driving_question: "A responsible system answers for more than its decisions. What energy, carbon, and money does it consume over its life, what does it owe the people whose data it holds, and what must the machine compute and keep to prove it?"

goals:
  - "Convert measured energy to operational carbon with PUE and grid intensity, and add idle and embodied terms."
  - "Find the dominant term of a service's lifetime cost and carbon, and price an optimization against it."
  - "Translate a legal obligation into a capability and estimate its machine cost: explanation compute, reviewer hours, audit bytes."
  - "Trace an erasure request through lineage, and say what memorization, retraining, unlearning, and differential privacy cost."

recall: "Part 1, close your notes, 90 seconds: (1) the care algorithm auto-enrolled 17.7 percent Black patients; ranked by health, what share? (46.5 percent). (2) Name the three fairness criteria and the rate each equalizes (approval rate; TPR; TPR and FPR). (3) A 3-point gap with alpha = 1.10 crosses a 5-point gate in which quarter? (sixth). Part 1 asked whether the system treats people correctly. Today asks what else it owes. A student who missed Part 1 needs only the credit service (constructed, 12,000 applicants, 1 million decisions a day in the governance scenario), introduced again on its first use."

running_example: "Four cases with real numbers, chosen so each segment has measured data. (1) Training runs at the scale of GPT-3: Patterson et al. 2021 and Luccioni et al. 2023 (GPT-3, Gopher, OPT, BLOOM), measured. (2) Google's median Gemini prompt, 0.24 Wh and 0.03 gCO2e (Elsworth et al. 2025), measured; Lecture 12 already measured its boundary. (3) The DLRM ranking service, the book's scenario: 10 million users x 20 items = 200 million inferences a day, three-year TCO $2.07M, labeled 'book scenario'. (4) The credit service (constructed) and the KWS voice assistant for governance, with measured anchors: Meta and Ireland's DPC 2023, Cigna's review (ProPublica 2023), Carlini et al. 2021, De et al. 2022, Bourtoule et al. 2021."

segments:
  - name: Joules to Tonnes
    divider_question: "What sets the carbon of one computation?"
    read: "§15.4.1, §15.4.3 (Napkin Math 15.4 and 15.5)"
    concept_questions: [1, 2, 3, 4]
    land: "Operational carbon is measured energy times PUE times grid intensity; model, processor, datacenter, and grid each move it by factors, and idle power and manufacturing add terms that a training-energy number leaves out."
    minutes: 13
  - name: Over the System's Life
    divider_question: "Over three years, where do the dollars and the carbon go?"
    read: "§15.4.2 (table 10, Napkin Math 15.4, Checkpoint 15.4), §15.4.3, §15.6 (training-only pitfall)"
    concept_questions: [5, 6, 7]
    land: "For a busy service the serving path holds most of the cost and carbon, so a small serving cut beats a large training cut; and as the grid gets cleaner, manufacturing becomes the term that decides whether new hardware helps."
    minutes: 13.5
  - name: Duties Have Machine Costs
    divider_question: "What does a legal duty become inside the machine?"
    read: "§15.5 opening, §15.5.3 (table 11), §15.3.3 (explanation cost), §15.3.1 (human oversight)"
    concept_questions: [8, 9, 10, 11]
    land: "Each duty is a capability with a number attached: explanation compute per denial, reviewer hours per appeal, and a record of legal basis per data use; a capability that was not built cannot be added at the audit."
    minutes: 11.5
  - name: Governance as a Data System
    divider_question: "Which data made this model, can we remove it, and can we prove it?"
    read: "§15.5.2, §15.5.4, §15.5.5, §15.6 (weights fallacy)"
    concept_questions: [12, 13, 14, 15]
    land: "Lineage finds every copy, weights can still hold the data, removal costs a retraining or a validated unlearning, differential privacy bounds what weights remember at a price in memory and accuracy, and the audit log stays bounded only if it records metadata, not payloads."
    minutes: 16

concept_questions:
  - id: 1
    q: "What sets the carbon of one computation?"
    picture: "Build on one stacked bar, Google's median Gemini text prompt, May 2025: step 1 the energy split, active accelerators 0.14 Wh, host CPU and DRAM 0.06, idle machines 0.02, datacenter overhead 0.02, total 0.24 Wh (a thumbnail of Lecture 12's boundary frame beside it); step 2 the equation strip Carbon = Energy x PUE x grid intensity under the bar, with the overhead segment labeled 'PUE 1.09'; step 3 the result, 0.023 g from electricity plus 0.010 g embodied = 0.03 gCO2e, and on-plot '33x less energy, 44x less carbon than a year earlier'."
    numbers: "Elsworth et al. 2025 (arXiv 2508.15734, read): 0.24 Wh, Table 1 split 0.14 / 0.06 / 0.02 / 0.02 Wh; Table 2: 0.023 gCO2e market-based Scope 2 plus 0.010 gCO2e embodied, 0.03 g total; fleet PUE 1.09 (section 4.3); 0.26 mL water; 33x energy and 44x carbon reduction May 2024 to May 2025. Chapter equation and table 12 (operational carbon). PUE definition: chapter §15.4.3."
    example: "LINK Lecture 12 owns where the power is measured (0.10 Wh at the accelerators against 0.24 Wh at the full boundary); this frame adds only the conversion to carbon. Market-based against location-based accounting named in the notes."
    read: "§15.4.3"
  - id: 2
    q: "How far do the model, the processor, the datacenter, and the grid each move one training job?"
    picture: "New waterfall (slideplot hbars, log axis), Patterson et al. 2021 Table 1: Transformer (big) on P100 in an average US datacenter, 316 kWh and 0.1357 t, stepping to Evolved Transformer (medium) on TPU v2 in Google's Iowa datacenter, 30 kWh and 0.0024 t net. One step per factor: model, processor, PUE 1.59 -> 1.11 (1.4x), grid 0.429 -> 0.080 kg/kWh net (5.4x). On-plot result '57x'."
    numbers: "Patterson et al. 2021 Table 1 (read): energy 316, 221, 185, 40, 30 kWh; gross CO2e 0.1357 to 0.0143 t; net 0.1357 to 0.0024 t; overall 57x (text); PUE 1.59 and 1.11 (section 2.3); grid 0.429 gross, 0.080 net (section 2.4); measured system power 296 W (P100) and 229 W (TPU v2). Abstract: the choice of model, datacenter, and processor can reduce the footprint up to about 100 to 1,000x."
    example: "Napkin Math 15.4: 400 W x 1 h x 0.4 kg/kWh = 0.16 kg per GPU-hour, the conversion factor the DLRM accounting reuses in segment 2."
    read: "§15.4.3 (Napkin Math 15.4)"
  - id: 3
    q: "Why can a model trained on 2.5 times less energy emit about 18 times less carbon?"
    picture: "Estimate card: given GPT-3 1,287 MWh including PUE 1.1, at 0.429 kg/kWh (Lecture 0's energy number); BLOOM 433 MWh at the GPUs, PUE 1.2, at 0.057 kg/kWh (French grid). Reveal: new hbars of four 175B-scale models from Luccioni et al. 2023 Table 4, CO2e with PUE: GPT-3 552 t, Gopher 380 t, OPT 76.3 t, BLOOM 30 t, each bar labeled with its energy and its grid intensity."
    numbers: "Napkin Math 15.5: 1,287,000 kWh x 0.429 = 552 t; 120 car-years at 4.6 t. Luccioni, Viguier, Ligozat 2023 (arXiv 2211.02001, read), Table 4: GPT-3 1,287 MWh, 429 g/kWh, PUE 1.1, 552 t; Gopher 1,066 MWh, 330 g, 380 t; OPT 324 MWh, 231 g, 76.3 t; BLOOM 433 MWh, 57 g, PUE 1.2, 25 t (30 t with PUE); text: 433,196 kWh x 57 g = 24.69 t. Derived (corrected 2026-10-18): GPT-3's 1,287 MWh already includes PUE 1.1 (Patterson et al. 2021 multiply chip-hours by measured power and PUE; 14.8 days x 24 x 10,000 x 330 W x 1.10 = 1,289 MWh, and 1,287 x 0.429 = 552 t, the value Luccioni's Table 4 lists under 'CO2 eq emissions x PUE'). BLOOM's 433,195 kWh is GPU energy without PUE (Luccioni et al. section 4.2, p. 4: 1.08 million GPU hours at 400 W TDP, CPUs excluded; section 5.1, p. 7: Table 4 disaggregates with and without PUE). Same boundary: BLOOM 433,195 x 1.2 = 520,000 kWh, x 0.057 = 29.6 t; energy ratio 2.5x, grid ratio 7.5x, carbon ratio about 18.6x (18x with Table 4's rounded 30 t)."
    example: "The table's footnote is the lesson: some entries are inferred because the papers did not report them (Luccioni et al. 2023). Moves Part 1's Patterson five-model frame here as a notes-only comparison."
    read: "§15.4.3 (Napkin Math 15.5)"
  - id: 4
    q: "What does a training run cost beyond the computation it performs?"
    picture: "New stacked hbar, BLOOM's 50.5 t, built in three steps: dynamic consumption 24.7 t (48.9 percent), the number most papers report; idle consumption 14.6 t (28.9 percent), nodes powered but not computing; embodied emissions 11.2 t (22.2 percent), servers 7.57 t and GPUs 3.64 t. Side note on the plot: cluster at idle 64 kWh against 109 kWh during training."
    numbers: "Luccioni et al. 2023 (read), Table 3: 11.2 / 24.69 / 14.6 / 50.5 t; section 4.3: infrastructure 27 kWh, idle 64 kWh, training 109 kWh average (per measurement interval), only about 54 percent attributable to the training processes; idle adds 256,646 kWh; section 4.1: server 2,500 kg CO2e, GPU 150 kg (lower bound), 6-year replacement, 85 percent usage, so 0.056 kg per server-hour and 0.003 kg per GPU-hour; HPE footprints put embodied at 20 to 30 percent of life-cycle emissions."
    example: "Chapter §15.4.3: embodied carbon can be a large share of lifetime emissions, a majority on low-carbon grids (Gupta et al. 2022). Embodied is a separate term, not folded into PUE."
    read: "§15.4.3"
  - id: 5
    q: "For a busy service, which term dominates cost and carbon over three years?"
    picture: "Worked-example sequence (moved from Part 1 and slowed). Frame A, derivation strip: 10 million users x 20 = 200 million inferences/day; x 10 ms = 556 GPU-hours/day; / 24 = 23.1 GPUs always on; x $2.50 = $507K a year, against $3,200 per training cycle. Frame B, the three-year stacked bar rebuilt from Part 1's figure: training $38K (1.9 percent), inference $1.52M (73.5 percent), operations $510K (24.6 percent); carbon pair 1.5 t against 97.3 t (63x). Frame C, estimate card: cut serving 20 percent or halve all training?"
    numbers: "Chapter §15.4.2 and table 10: 200 million inferences/day; 10 ms unbatched; 23.1 GPUs; $2.50 per GPU-hour; $506,944 a year; 12 cycles x $3,200 = $38,400; $170K a year operations; $2.07M total; 40:1; 0.16 kg per GPU-hour; 97.3 t against 1.5 t; 63x. Checkpoint 15.4 answer: 20 percent of inference about 14.6 percent of TCO against about 1 percent; Summary: $304K and 19 t. Derived for the halving: $19.2K and 0.77 t."
    example: "The DLRM numbers are the book's scenario, unbatched by assumption; the slide says so and the notes say batching (Lecture 13) would change the GPU count, not the conclusion's direction. Pitfall: measuring training but not inference (§15.6). The training-dominant counter-case: a frontier run (Epoch AI, 2.9x a year, Grok 4 about $388M; book fig-frontier-training-cost), shown as FLEX in the notes."
    read: "§15.4.2"
  - id: 6
    q: "Do measured fleets and real deployments agree that serving dominates?"
    picture: "Two-panel data frame. Left (moved from Part 1): Google, about 3/5 of ML energy for inference and 2/5 for training, ML 10 to 15 percent of total energy 2019 to 2021; Meta AI power capacity 10:20:70 experimentation:training:inference. Right (new): the BLOOM inference API over 18 days, one big number per line: 230,768 requests, 914 kWh, 3.96 Wh per request (derived), and 'about 75 percent of the energy kept the model in memory while idle'."
    numbers: "Patterson et al. 2022 (arXiv 2204.05149) and Wu et al. 2022 (arXiv 2111.00364), both read for Part 1. Luccioni et al. 2023 section 4.4 (read): 16 A100 40 GB on GCP, 18 days, 558 requests/hour unbatched, 230,768 requests, 914 kWh (GPU 75.3 percent), about 0.28 kWh per 10 minutes with no requests, about 75 percent idle share, 394 g/kWh in us-central1, 19 kg/day, 340 kg total. Derived: 914 kWh / 230,768 = 3.96 Wh per request, labeled derived and not comparable with Gemini's boundary."
    example: "LINK Lecture 13: an unbatched endpoint with a 0.28 kWh idle floor every 10 minutes is the utilization problem batching solves; one line, Lecture 13 owns batching."
    read: "§15.4.2, §15.4.3"
  - id: 7
    q: "When does replacing hardware with more efficient hardware raise emissions?"
    picture: "True-or-false card, then a new two-bar derived plot: carbon per GPU-hour split into operational and embodied at two grids. At 0.4 kg/kWh: operational 0.160 kg, embodied 0.010 kg, embodied 6 percent. At 0.057 kg/kWh: operational 0.023 kg, embodied 0.010 kg, embodied 30 percent. Labeled 'derived from Luccioni et al. 2023 embodied factors and the chapter's 400 W'."
    numbers: "Derived: embodied 0.003 kg per GPU-hour plus 0.056 / 8 kg per server-hour share = 0.010 kg per GPU-hour (Luccioni et al. 2023, 8-GPU server assumed); operational 0.4 kW x 0.4 = 0.16 kg (Napkin Math 15.4) and 0.4 kW x 0.057 = 0.023 kg. Over the DLRM's three years: 608,820 GPU-hours x 0.010 = 6.1 t embodied against 97.3 t operational. Measured: embodied about 30 percent of Meta's large-scale ML footprint (Wu et al. 2022, read for Part 1). Chapter §15.4.3 and Gupta et al. 2022: replacing working servers early to save 10 percent on electricity can raise lifetime emissions."
    example: "Fallacy card (true or false): 'Replacing servers with ones 10 percent more efficient always lowers emissions.' False on a clean grid. Carbon-aware scheduling and scope 1/2/3 named in the notes only."
    read: "§15.4.3"
  - id: 8
    q: "What can a regulator find wrong when no data was breached?"
    picture: "Big number on a plain frame: EUR 390 million (Facebook 210, Instagram 180), January 2023, with one line: invalid legal basis for personalized advertising; no breach, no intrusion. Step 2 adds the system question: for each training use of each record, which legal basis authorized it, and where is that recorded?"
    numbers: "Chapter §15.5 opening (DPC 2023: invalid legal basis, transparency and fairness violations, no security breach). Fine amounts from the DPC's January 2023 decisions as reported (Law Society Gazette Ireland; Irish Legal News): EUR 210M Facebook, EUR 180M Instagram, EUR 390M total; the DPC's draft had proposed EUR 36M and 23M before the EDPB's binding decision. Confirm against the DPC press release at build."
    example: "Security protects who can read data; governance must also prove why each use was lawful. Encryption would not have changed this finding."
    read: "§15.5 (opening, compliance principle)"
  - id: 9
    q: "What does a legal obligation become inside the machine?"
    picture: "Table 11 revealed row by row on the credit service and the KWS assistant (moved from Part 1, slowed): obligation -> capability -> machine cost. Rows: record keeping (EU AI Act) -> versioned models, provenance, event logs -> log storage; reasons for a decision (GDPR Article 15, ECOA adverse-action notices) -> per-decision reason codes -> explanation compute; contestable decisions (GDPR Article 22) -> staffed review path -> reviewer hours; erasure (GDPR) -> lineage-driven deletion -> retraining hours; nondiscrimination -> disaggregated evaluation -> labeled per-group data (grayed, 'Part 1'). Photo amazon-echo-dot-board.jpg as the KWS device."
    numbers: "Chapter table 11; EU AI Act in force August 1, 2024, phased application (§15.5.3); ECOA Regulation B: specific principal reasons for adverse actions (§15.5.3). Regulation B record retention: 25 months for consumer credit applications (12 CFR 1002.12(b)(1), read), used again in concept question 15."
    example: "Pitfall (§15.6): documentation is not enforcement; a model card that says 'not validated for high-stakes decisions' has no effect unless a deployment gate reads it (one line; Lecture 12b owns the acceptance gate, Lecture 14 the registry)."
    read: "§15.5.3 (table 11)"
  - id: 10
    q: "What does a reason for every denial cost the serving path?"
    picture: "Estimate card (given left, steps right), result on a two-bar log plot: model evaluations per day for decisions, 1 million, against explanations with a 1,000-sample attributor, 475 million; a third bar, dashed, for exact Shapley, about 5 x 10^11. Step 3: book fig-interpretability-spectrum as the alternative, an interpretable model that needs no attributor."
    numbers: "Chapter §15.3.3: exact Shapley over 20 features = 2^20 = 1,048,576 evaluations; 1,000 samples multiply the compute of each explained decision by 1,000. Chapter §15.5.3: 1 million daily decisions. Derived: denial share 47.5 percent from the worked example's matrices (6,300 approved of 12,000; constructed), so 475,000 adverse-action notices a day x 1,000 = 475 million evaluations, 475x the decision compute; exact: 475,000 x 1,048,576 = 5.0 x 10^11."
    example: "Model-specific algorithms (TreeSHAP) are polynomial; a sparse linear model needs none. An attribution is not a causal reason, and Regulation B requires reasons that describe the factors actually used (§15.5.3)."
    read: "§15.3.3 (explanation cost), §15.5.3"
  - id: 11
    q: "How many reviewer-hours does contestability need, and when is review a rubber stamp?"
    picture: "Book margin-002 (time per alert falls as volume grows; rubber-stamp zone), then two bars on one axis: 100 reviewer-hours buys 1,000 reviews at 6 minutes each (credit service, assumption labeled), or 300,000 reviews at 1.2 seconds each (Cigna, measured)."
    numbers: "Chapter §15.5.3: 0.1 percent of 1 million daily decisions = 1,000 cases/day. Assumed 6 minutes per case, labeled: 100 reviewer-hours a day, about 12.5 reviewers on 8-hour shifts. ProPublica and The Capitol Forum (Rucker, Miller, Armstrong, March 25, 2023, read): over two months Cigna doctors denied more than 300,000 payment requests, an average of 1.2 seconds each. Derived: 300,000 x 1.2 s = 100 hours. EDPB guidance: human oversight must be substantive, not rubber-stamping (chapter footnote)."
    example: "War Story 15.2 (Uber ATG): a human backup is a new system with its own failure modes (one line, Part 1 left it to reading). The review path's tooling must surface each case's explanation, lineage, and model version (§15.5.3)."
    read: "§15.5.3; §15.3.1 (human-in-the-loop)"
  - id: 12
    q: "How does an erasure request find every copy of a person's data?"
    picture: "Lineage-graph build on the KWS pipeline (Part 1's diagram, rebuilt in four steps): step 1 recording and consent record; step 2 derived artifacts, spectrogram cache and feature embeddings; step 3 training snapshot and checkpoint v12, with a signed manifest edge; step 4 deployment edges to the devices running v12, and a clock: one month to respond."
    numbers: "Chapter §15.5.4 (traversal from source recording to cached spectrograms, embeddings, snapshots, checkpoints; deployment edges for recall); §15.5 (content hashes and signed manifests link each DS-CNN binary to its training split and augmentation seeds). GDPR Article 12(3): respond without undue delay and within one month, extendable by two further months (Regulation 2016/679)."
    example: "LINK Lecture 4 owns the lineage graph and dataset releases, Lecture 14 the model registry; this frame adds only the erasure query and the deployment edges. Identifying an artifact does not by itself require deleting it; scope is a legal decision (self-check 15.5 question 2)."
    read: "§15.5.4"
  - id: 13
    q: "Is data trained into weights gone, and what does removing it cost?"
    picture: "Vote (moved from Part 1), then the one-number reveal 604 (of 1,800 candidates; 46 with names, 32 with contact information). Then new hbars of removal cost: retrain a GPT-3-scale model, 1,287 MWh and 552 t each time; fold the request into the DLRM's next quarterly cycle, $3,200 and up to 90 days of delay; SISA sharded training, unlearning 4.63x, 2.45x, 1.36x faster than retraining (Purchase, SVHN, ImageNet)."
    numbers: "Carlini et al. 2021 (read for Part 1): 604 memorized examples from 1,800 candidates; 46 names; 32 contact details. Chapter §15.6 weights fallacy; §15.5.5 (retraining, validated machine unlearning, or another legally appropriate control). Bourtoule et al. 2021 (arXiv 1912.03817, abstract read): 4.63x Purchase, 2.45x SVHN, 1.36x ImageNet with a small accuracy loss. Napkin Math 15.5 and table 10 for the retraining costs."
    example: "Membership inference (Shokri et al. 2017) as the measurement of leakage; an empirical attack cannot prove a bound holds. Erasure by retraining re-spends the training budget, linking back to segment 1's carbon."
    read: "§15.5.5, §15.6"
  - id: 14
    q: "How does differential privacy bound what weights remember, and what does it cost?"
    picture: "Mechanism build (new diagram): step 1 per-example gradients; step 2 each clipped to norm C; step 3 sum plus Gaussian noise N(0, sigma^2 C^2); step 4 a privacy accountant adds up epsilon across steps. Then a two-panel cost frame: memory (moved from Part 1): one FP32 gradient of the 200K-parameter KWS model 800 KB, a batch of 256 per-example gradients 204.8 MB, GPT-2 1.5 TB against an 80 GB H100; accuracy: CIFAR-10 at epsilon = 8, 81.4 percent against the previous private best 71.7 percent; ImageNet fine-tuned at epsilon = 8, 86.7 percent, 4.3 points below the non-private best."
    numbers: "Chapter §15.5.2 (DP-SGD per Abadi et al. 2016; naive per-sample gradient memory). De et al. 2022 (arXiv 2204.13650, abstract read): 81.4 percent CIFAR-10 at (8, 10^-5)-DP, previous 71.7 percent; ImageNet 86.7 percent at (8, 8 x 10^-7)-DP, 4.3 percent below non-private; 83.8 percent at epsilon 0.5 fine-tuned."
    example: "KWS privacy by architecture (notes, OPTIONAL frame): raw audio stays in an on-chip SRAM ring buffer until the wake word; federated training sends a model update of 800 KB instead of audio, about 115 MB per hour at 16 kHz, 16-bit (derived, 144x); updates can still leak examples (Zhu et al. 2019), so secure aggregation and differential privacy are added."
    read: "§15.5.2"
  - id: 15
    q: "How large does an audit trail grow, and what keeps it bounded?"
    picture: "Estimate card, then book margin-004 (audit log crosses the budget while the dataset stays flat) with the two answers written on it: decision manifests for the credit service, about 195 GB over the retention window; full payloads for the DLRM, 52x the bytes per event."
    numbers: "Chapter §15.5.5 and table 12: volume = events per unit time x bytes per event x retention; decision manifests hold model hash, threshold, score or reason codes, and input-feature hashes. Given: 1 million decisions/day (§15.5.3); 256 bytes per manifest (assumption, labeled); 25 months, about 760 days (12 CFR 1002.12(b)(1)). Result 1e6 x 256 x 760 = 195 GB. Payload contrast (constructed): DLRM input as in MLPerf DLRM on Criteo Terabyte, 13 dense and 26 categorical features with 128-dimensional FP32 embeddings, 13,364 bytes per request, 52x the manifest; 200 million a day for a year is 976 TB against 18.7 TB."
    example: "Edge tier: KWS logs state transitions to a volatile ring buffer and uploads when charging; sequence numbers expose gaps, and a gap cannot prove no incident occurred (§15.5.5)."
    read: "§15.5.5"

worked_examples:
  - name: "Four factors on one training job (Patterson et al. 2021, Table 1)"
    steps: ["given: Transformer (big), P100, US average datacenter, PUE 1.59, 0.429 kg/kWh: 316 kWh, 0.1357 t", "model: Evolved Transformer (medium) reaches the same accuracy with fewer operations", "processor: TPU v2, higher measured performance per watt", "datacenter: PUE 1.11 (1.4x)", "grid: 0.080 kg/kWh net (5.4x)", "result: 30 kWh, 0.0024 t net, 57x", "meaning: the trainer chooses every factor, so the trainer should report every factor"]
  - name: "DLRM lifecycle cost and carbon (§15.4.2, table 10, Checkpoint 15.4)"
    steps: ["given: 10 million users x 20 items; 10 ms unbatched; $2.50 per GPU-hour; $3,200 per training cycle; 400 W; 0.4 kg/kWh", "200 million x 0.01 s / 3,600 = 556 GPU-hours/day; 23.1 GPUs", "inference $1.52M, training $38K, operations $510K over three years", "carbon 97.3 t against 1.5 t (63x)", "check: 20 percent serving cut saves $304K and 19 t; halving all training saves $19K and 0.8 t", "meaning: optimize where the term is largest; the ratio is scenario-specific and must be measured"]
  - name: "Reasons for every denial (§15.3.3, §15.5.3, worked-example matrices)"
    steps: ["given: 1 million decisions a day; 47.5 percent denied (constructed); 1,000-sample attributor; 20 features", "475,000 notices x 1,000 = 475 million evaluations a day", "475x the evaluations that made the decisions", "exact Shapley: 475,000 x 2^20 = 5 x 10^11", "meaning: the explanation path, not the model, can set the accelerator budget; choose the model family with this cost in view"]
  - name: "Audit log volume (§15.5.5, table 12)"
    steps: ["given: 1 million decisions/day; 256-byte manifest (assumption); 25-month retention (Regulation B)", "1e6 x 256 B = 256 MB a day", "x 760 days = 195 GB", "full DLRM payload instead: 13,364 B per event, 52x", "meaning: bytes per event is the term the design controls; log metadata and hashes, keep payloads only where the duty requires them"]

active_learning:
  - at_minute: 1
    type: predict
    prompt: "A 2019 estimate put one architecture search at 284 t of CO2e. The team that ran it measured it in 2021. A) about 600 t B) about 284 t C) about 30 t D) about 3 t?"
    answer: "D, 3.2 t net, 88x lower (Patterson et al. 2021). Students who pick B assume a published estimate is a measurement; students who pick A assume AI always costs more than feared."
  - at_minute: 5.5
    type: retrieval
    prompt: "Part 1, close your notes: the care algorithm's corrected share; the three fairness criteria and their rates; the quarter in which a 3-point gap with alpha 1.10 breaches 5 points."
    answer: "46.5 percent; approval rate, TPR, TPR and FPR; quarter 6 at 5.3 points."
  - at_minute: 14.5
    type: estimate
    prompt: "GPT-3 used 1,287 MWh including its PUE of 1.1, on a 0.429 kg/kWh grid; BLOOM, the same size, used 433 MWh at the GPUs, PUE 1.2, on a 0.057 kg/kWh grid. How many times less carbon did BLOOM emit?"
    answer: "552 t against 29.6 t (433 x 1.2 = 520 MWh at the facility), about 18.6x. Energy gives 2.5x and the grid 7.5x; the factors multiply. Students who answer 2.5x forgot the grid; students who answer 22x divided a facility energy by an IT energy."
  - at_minute: 26.5
    type: estimate
    prompt: "DLRM, three years: inference $1.52M, training $38K. Which saves more, cutting serving cost 20 percent or halving all training? By how much?"
    answer: "Serving: $304K and 19 t; training: $19K and 0.8 t; about 16x. Halving only the final run would save less still, because search and data preparation remain (Checkpoint 15.4)."
  - at_minute: 31.5
    type: concept_question
    prompt: "True or false: replacing working servers with ones 10 percent more efficient always lowers lifetime emissions."
    answer: "False. Manufacturing carbon is spent up front; on a clean grid it is about 30 percent of carbon per GPU-hour (derived), so the 10 percent operational saving may not repay it (chapter §15.4.3; Gupta et al. 2022)."
  - at_minute: 40
    type: estimate
    prompt: "The credit service makes 1 million decisions a day and denies 47.5 percent. Each denial needs reasons from a 1,000-sample attributor. How many model evaluations a day, compared with the decisions themselves?"
    answer: "475 million, 475x. Exact Shapley over 20 features would be about 5 x 10^11. Common error: forgetting that only denials need notices, which gives 1 billion."
  - at_minute: 49.5
    type: concept_question
    prompt: "True or false: once a user's records are deleted from the training database, the deployed model no longer contains them."
    answer: "False: 604 verbatim training examples extracted from GPT-2 (Carlini et al. 2021). Removal needs lineage to find the model, then retraining, validated unlearning, or another control."
  - at_minute: 59.5
    type: estimate
    prompt: "1 million decisions a day, a 256-byte record each, kept 25 months as Regulation B requires. How many bytes? What happens if each record stores the full input instead?"
    answer: "About 195 GB. For the DLRM's 13.4 KB inputs the bytes per event grow 52x; bytes per event, not event count, is the term the design controls."
  - at_minute: 65
    type: retrieval
    prompt: "Close your notes. For the DLRM or the credit service, write one line each: carbon per year and its largest term; what an erasure request touches and costs; what the audit log records and its size; reviewer-hours a day."
    answer: "DLRM: about 32 t a year of modeled accelerator carbon (97.3 t over three years), inference dominant, embodied about 2 t a year. Erasure: lineage from recording to checkpoint and devices; next quarterly retrain at $3,200 or SISA. Audit: manifests, not payloads (52x). Credit: 1,000 appeals a day, 100 reviewer-hours at 6 minutes."

open_questions:
  - "Should a service report carbon per request beside its latency, and on which boundary: market-based or location-based, with or without embodied carbon?"
  - "An erasure request arrives for a model that cost 1,287 MWh to train. Retrain, unlearn, or document an exception? Who decides, and what evidence would satisfy the person who asked?"
  - "How much privacy is enough? Who should choose epsilon for a voice assistant, and should the choice be published?"

more_examples:
  - "Evolved Transformer search paid back 15 to 1: 3.2 t spent, 48.5 t saved when Meena used the architecture (Patterson et al. 2021, Table 4)."
  - "Global datacenter energy rose about 6 percent from 2010 to 2018 while computing capacity rose 550 percent (Masanet et al. 2020 in Science, as cited by Patterson et al. 2021, section 2.3)."
  - "Gemini median prompt: 33x less energy and 44x less carbon in one year, May 2024 to May 2025 (Elsworth et al. 2025)."
  - "BLOOM's API drew about 0.28 kWh per 10 minutes with no requests at all (Luccioni et al. 2023, Figure 3)."
  - "DPC 2023: the draft fines were EUR 36M and 23M; the EDPB's binding decision on legal basis raised them to EUR 210M and 180M."
  - "Cigna: 300,000 denials in two months at 1.2 seconds each (ProPublica 2023)."
  - "Deep leakage from gradients: shared gradients reconstruct training images and text (Zhu et al. 2019; chapter §15.5.2)."
  - "Model stealing through prediction APIs (Tramer et al. 2016; chapter §15.5.1)."
  - "KWS on a 500 mW wearable: DS-CNN 50 mW against MobileNetV2 1.2 W (§15.4.1, assumed active power)."

