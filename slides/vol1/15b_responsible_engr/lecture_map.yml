    - "Operational-carbon focus slide moved ahead of the Gemini slide; the Gemini slide gains a gray line glossing Scope 2 (market-based) and Scopes 1 and 3."
    - "Review-staffing slide: the book's monitoring margin figure (time per alert) replaced by review_zone_step1-2, time per case against cases per reviewer-hour, with the credit service (6 min, assumed) and Cigna (1.2 s, measured) on the curve and the minimum marked illustrative; the separate review_step bars are no longer used."
