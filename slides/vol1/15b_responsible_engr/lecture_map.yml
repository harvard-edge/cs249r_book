    - "Lectures 12b and 14 own release gates and Lecture 14b owns production monitoring in general; this lecture adds no gate or monitor of its own beyond the audit record."
    - "Lecture 16 owns constraints that cross layers and the principle ledger."

notes_for_author:
  - "One mlsysfocus: Operational carbon = Energy x PUE x grid intensity (table 12), the equation both halves of segments 1 and 2 use. Part 1 keeps its focus on the Bias Feedback Model."
  - "Correction to Part 1's map (applied 2026-10-17): its concept question 13 note gave the wrong multiple for the Evolved Transformer NAS. Patterson et al. 2021 say 88x (284 t estimated against 3.2 t net) and 18.7x for an average organization; gross and net are both 3.2 t for the NAS row in Table 4. This plan uses 88x."
  - "Settled at build: Patterson Table 1, read from the rendered table, has five columns: Transformer (Big) on P100 in the US-average datacenter (316 kWh, 0.1357 t); Transformer (Big) on P100 in Iowa (221 kWh; 0.1055 t gross, 0.0177 t net); Evolved Transformer (Medium) on P100 in Iowa (185 kWh; 0.0883 / 0.0148 t); Transformer (Big) on TPU v2 in Iowa (40 kWh; 0.0189 / 0.0032 t); Evolved Transformer (Medium) on TPU v2 in Iowa (30 kWh; 0.0143 / 0.0024 t). The columns do not follow the four-factor order, so the slide draws only the cumulative gains printed on Figure 1 (1.3, 7.4, 10.5, 56.5) with the Table 1 endpoints; per-step factors (processor about 5.7x, PUE 1.4x, grid 5.4x) are derived in the notes. Iowa's gross grid was 0.478 kg/kWh, above the US average; the grid step is market-based (net of 78 percent 24/7 carbon-free purchases), which the notes WARN."
  - "Settled at build: Luccioni et al. Table 4 read from the rendered page. Italic (inferred) entries: GPT-3's 502 t before PUE; Gopher's 1,066 MWh and 352 t; OPT's PUE 1.09, 231 g/kWh, 324 MWh, and 76.3 t. Plotted values (CO2e x PUE) are GPT-3 552 and Gopher 380 (stated), OPT 76.3 (inferred), BLOOM 30 (stated); inferred values are starred on the plot."
  - "Settled at build: the DPC's own press release ('Data Protection Commission announces conclusion of two inquiries into Meta Ireland', 4 January 2023) states EUR 210 million (Facebook) and EUR 180 million (Instagram); the slide credits the release. The draft amounts (EUR 36M and 23M) are not in the release and are not used; the notes say only that the EDPB directed the DPC to raise its proposed fines."
  - "Settled at build: De et al. 2022 abstract re-read; CIFAR-10 81.4 percent at (8, 1e-5)-DP against the previous private best 71.7; ImageNet 86.7 percent at (8, 8e-7)-DP, 4.3 points below the non-private best, drawn as 91.0 and labeled derived."
  - "Assumptions labeled on slides: 6 minutes per review, 256 bytes per manifest, 8 GPUs per server for the embodied share, 16 kHz 16-bit audio, MLPerf DLRM feature counts for the payload contrast."
  - "Constructed or scenario numbers labeled: credit service (constructed), DLRM TCO (book scenario), audit estimate (constructed)."
