  source: "Round 1 review (fixes 1 to 12); fixes 1 and 2 verified against the papers before editing (Patterson et al. 2021, arXiv 2104.10350, Table 4 p. 6, section 4.1 p. 8, Appendices C and D pp. 21 to 22; Luccioni et al., arXiv 2211.02001, section 4.2 p. 4 and section 5.1, Table 4, p. 7)."
