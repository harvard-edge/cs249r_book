    - "Lecture 2: TCO definition (this lecture owns the lifecycle split)"
    - "Lecture 4: lineage graph and dataset releases (the erasure query is added, not the graph)"
    - "Lecture 11: energy ladder (one line in the notes of concept question 1)"
    - "Lecture 12: power measurement boundary, the 0.10 against 0.24 Wh Gemini frame (thumbnail and pointer; this lecture converts to carbon)"
    - "Lecture 12b: acceptance gate (pointer from the documentation pitfall)"
    - "Lecture 13 and 13b: batching and joules per token (one line at the BLOOM endpoint)"
