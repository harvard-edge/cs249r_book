review_lens:
- 'Non-CS student persona (a public-policy student): every rate is defined in plain words on first use (TPR as ''of applicants who would repay, the share approved''); no ''confusion matrix'' before the 2x2 is drawn; legal anchors (four-fifths rule, ECOA, GDPR Article 22, EU AI Act) appear as capabilities, not as legal advice; the COMPAS discussion asks who owns the criterion, which is the policy student''s home ground.'
- The four panel personas from the brief (undergraduate, data-science master's, ECE senior, adopting professor) apply at step 6.
notes_for_author:
- 'Superseded 2026-10-17: the fairness segment is now two segments of 14 minutes each (Fairness Criteria; Fairness Over Time).'
- Resolved at build: the Obermeyer full text was read (see build_note); every Obermeyer number on the slides cites the paper, and no Booth Review value is used.
- ProPublica's base rates (51.4 and 39.4 percent) are derived from its published contingency tables and labeled derived. ProPublica reports predictive accuracy and PPV, not calibration curves; the slide says 'precision' (PPV), and the notes cite Northpointe's calibration argument through Chouldechova 2017.
- Raji and Buolamwini's 2017 darker-female errors are derived as the August 2018 value minus the Table 2 difference; they reproduce Gender Shades (34.5, 34.7, 20.8).
- The chapter's credit service, price of fairness, feedback loop, DLRM TCO, and fairness frontier are constructed or illustrative; each slide says so. Every segment also has measured data.
- The chapter does not state the full Obermeyer remedy as 'label change reduced bias 86 percent'; it states 17.7 to 46.5 percent. The slide uses the abstract's numbers; 86 percent stays in the notes.
- 'Correction 2026-10-17: an earlier version of this map (concept question 13, more_examples) said the Evolved Transformer architecture search emitted a wrong multiple (gross) below the 2019 estimate. Patterson et al. 2021 say 88x (284 t estimated against 3.2 t net, section 4.1 and Table 4), and 18.7x too high for an average organization. The number now lives in Lecture 15b''s hook.'
- 'One \mlsysfocus: the Bias Feedback Model, Delta(k) = Delta(0) alpha^k (principle 13), the one named principle this chapter owns.'
- The proxy-goal knee figure and the fan-out figure are chapter margin figures not in the extracted figure pack; they are redrawn from their descriptions at slide size.
- 'Old deck figures to inspect for reuse: confusion-matrix-groups.svg (worked example), carbon-footprint-tco.svg (likely replaced by new bars), contemplation-of-justice.jpg (possible COMPAS image; credit must be checked). Not used: governance-framework, explainability-spectrum, the old learning-objectives and checklist frames.'
