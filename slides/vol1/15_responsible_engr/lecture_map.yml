chapter: 15_responsible_engr
lecture: 15
title: Responsible Engineering
layer: applications
minutes: 75
notes_minutes: 71.0
target_ideas: 30
thesis: 'A system can do exactly what it was told and still cause harm, so responsibility is an engineering requirement: written before training, gated on named populations, priced in dollars and carbon, and enforced by infrastructure, like any latency budget.'
hook:
  minutes: 0-6
  setup: 'War Story 15.1. A commercial care-management algorithm, used across US health systems, ranks patients by a risk score and automatically enrolls those above the 97th percentile in an extra-care program. It was trained to predict next year''s health-care cost. Obermeyer et al. (Science 2019) audited it on one academic hospital''s patients (6,079 Black and 43,539 White patients, 2013 to 2015). Step 1: the rule and its target (predict cost, enroll the top 3 percent). Step 2: the question. Step 3: the reveal as two bars, 17.7 percent against 46.5 percent.'
  question_to_class: Among the patients the algorithm auto-enrolled, 17.7 percent were Black. If the same program ranked patients by how sick they actually were, what share would be Black? A) about the same, 18 percent B) 25 percent C) 46 percent D) 70 percent
  payoff: 'C: 46.5 percent, 2.6 times as many. The model was not broken: it predicted cost well. ''Unequal access to care means that we spend less money caring for Black patients than for White patients'' (abstract), so at any given score Black patients were sicker; at the 97th percentile they carried 26.3 percent more chronic illnesses (4.8 against 3.8). Students who pick A assume an accurate model is a fair one; that is the lecture''s target misconception. The synthesis returns to this algorithm and writes the requirement, the gate, the monitor, and the record that would have caught it.'
  sources:
  - chapter War Story 15.1 (Obermeyer et al. 2019)
  - 'Obermeyer et al. 2019, Science 366:447, abstract read from Europe PMC (DOI 10.1126/science.aax2342): 17.7 -> 46.5 percent; cost predicted instead of illness; ''affecting millions of patients'''
  - 'Obermeyer et al. 2019, full text read (author-hosted PDF of the Science article): 6,079 Black and 43,539 White patients, 2013 to 2015; auto-enrollment above the 97th percentile, referral above the 55th; 26.3 percent more chronic illnesses at the 97th percentile (4.8 against 3.8); $1,801 less spent per year at the same number of chronic illnesses; Table 2 label experiment (Black share of the top 3 percent: total cost 0.141, avoidable cost 0.210, active chronic conditions 0.267); manufacturer replication on 3,695,943 patients; a combined health and cost label reduced one measure of bias by 84 percent'
driving_question: A system can meet every latency, uptime, and accuracy target and still harm the people it serves. How do we write down, test, price, and enforce what its objective left out?
recall: 'Lecture 3 discussed War Story 3.1 (Amazon''s recruiting tool) and concluded the bias should have been caught at problem definition, because the labels were past hiring decisions; its notes promised that Lecture 15 develops the health-care version. Lecture 14 showed a system that is fully available and silently wrong. Ask: Amazon removed the gendered words and the model still discriminated. Why? Expected: other features (college names, clubs) still carried the signal. This lecture names that a proxy feature and adds the harder case, a proxy target.'
running_example: 'Three running cases, as in the chapter. (1) The care-management algorithm (hook and synthesis, measured). (2) The credit service, the chapter''s labeled composite: Group A 10,000 applicants (TP 4,500, FN 500, FP 1,000, TN 4,000), Group B 2,000 applicants (TP 600, FN 400, FP 200, TN 800); 5 percentage-point release gate; slides label it ''constructed example''. (3) The DLRM ranking service: 10 million users x 20 items = 200 million inferences a day; three-year TCO $2.07M; book scenario, labeled. The KWS voice assistant carries governance. Measured anchors in every segment: Obermeyer 2019, Gender Shades and Raji and Buolamwini 2019, ProPublica''s COMPAS analysis, Patterson et al. 2021 and 2022, Wu et al. 2022, Carlini et al. 2021.'
segments:
- name: Proxies
  divider_question: How can a model that does exactly what it was told cause harm?
  read: §15.1, §15.2
  concept_questions:
  - 2
  - 3
  - 4
  - 5
  land: 'Harm enters through the specification, not a bug: a proxy feature, a proxy target, or a proxy metric, while every health check stays green.'
  minutes: 10.5
- name: Who Is Tested
  divider_question: Which people does the test set actually test?
  read: §15.3.1, §15.3.2 (to the worked example)
  concept_questions:
  - 6
  - 7
  - 8
  land: A population the specification names becomes a release gate with a data budget; a population it does not name is averaged away.
  minutes: 11.5
- name: Fairness Has a Price
  divider_question: What does it cost to make a model fair, and does fairness stay put?
  read: §15.3.2.1, §15.3.2.2, §15.3.4
  concept_questions:
  - 9
  - 10
  - 11
  - 12
  land: Fairness criteria are policy choices that cannot all hold at once; the chosen one has a price that must be stated as a number, and under feedback a gate passed at launch drifts unless the loop is changed.
  minutes: 18.0
- name: Cost and Carbon
  divider_question: What does the system cost the planet and the budget, and where?
  read: §15.4
  concept_questions:
  - 13
  - 14
  land: Carbon is energy times PUE times grid intensity; for a busy service the recurring inference term, not the training run, is where cost and emissions have leverage.
  minutes: 11.0
- name: Governance
  divider_question: What must the infrastructure prove, and to whom?
  read: §15.5, §15.6 (last fallacy)
  concept_questions:
  - 15
  land: Each obligation is a capability with a machine cost; governance is a data system that must answer which data made this model and who touched it.
  minutes: 5.5
concept_questions:
- id: 1
  q: Can an accurate model still send help to the wrong people?
  picture: 'Hook: two bars on one axis, share of Black patients among auto-enrolled patients, 17.7 percent (cost target) and 46.5 percent (need target), with ''???'' on the second bar until the reveal. Then a three-box chain: health need -> care received (access gap) -> cost; the model sees only the last box.'
  numbers: 'Obermeyer et al. 2019 (full text): 17.7 -> 46.5 percent (Fig. 1B); 26.3 percent more chronic illnesses at the 97th percentile; $1,801 less spent per year at the same illness; Table 2 label experiment 14.1, 21.0, 26.7 percent; national replication on 3,695,943 patients.'
  example: A label combining health and cost reduced one measure of the bias by 84 percent (Obermeyer et al. 2019); the chapter states the 46.5 percent as the remedy.
  read: §15.2.1 (War Story 15.1)
- id: 2
  q: What is the difference between verification and validation?
  picture: 'New diagram: the hook system''s dashboard (latency, uptime, aggregate accuracy) all green under ''verification: built to the spec?'', beside one red gate ''validation: right spec?''.'
  numbers: 'Chapter: a recruiting tool at 87 percent aggregate accuracy and 99.9 percent availability that downgraded ''women''s'' (self-check 15.1.1). Verification gap is principle 9 (recall from Lecture 12, one line).'
  example: NASA Systems Engineering Handbook framing (chapter §15.1).
  read: §15.1
- id: 3
  q: On which D·A·M axis did each failure start?
  picture: 'Diagnose activity: three cases as cards; kit dam_D, dam_A, dam_M revealed one per step as the answers.'
  numbers: 'Amazon: data axis, proxy features (college and club names kept the signal after gender words were removed; Dastin 2018). Care algorithm: algorithm axis, proxy target (cost for need). Credit form change: machine axis, telemetry that never slices outcomes (§15.2.2, Systems Perspective 15.3).'
  example: 'Fallacy: removing sensitive attributes eliminates bias (§15.6), answered by both proxy cases.'
  read: §15.2.1, §15.2.2 (Systems Perspective 15.3)
- id: 4
  q: Why does optimizing a proxy metric eventually hurt the goal?
  picture: 'New two-line plot, illustrative and labeled so: Proxy and Goal rise together to a knee, then Proxy keeps rising while Goal falls; gap shaded. Build: lines; knee; numbers at the right edge (clicks 1.20, satisfaction 0.95, gap 0.25).'
  numbers: 'Systems Perspective 15.2 (illustrative): clicks +20 percent, satisfaction -5 percent, Gap = E[Proxy] - E[True] = 0.25 on a common scale; correlation 0.8 -> 0.2. Measured context in notes: Ribeiro et al. 2020 audited 349 channels, 330,925 videos, more than 72 million comments, and more than 2 million recommendations and found users migrating from milder to more extreme content.'
  example: Facebook's 2018 News Feed change toward 'meaningful social interactions', accepting lower short-term engagement (Mosseri 2018). Goodhart's law recalled from Lecture 12 in one line.
  read: §15.2.2 (Systems Perspective 15.2)
- id: 5
  q: How far does one upstream fault reach?
  picture: 'Variant of the chapter''s fan-out margin figure: one red source, many downstream decisions; build labels the green dashboard (latency, confidence, uptime) and the people behind the decisions.'
  numbers: 'Chapter scenario: a form change alters how self-employed income is recorded; the credit model declines applicants it approved a week earlier; no alert fires (§15.2.2). Measured scale for the hook''s algorithm: replicated on 3,695,943 patients (Obermeyer et al. 2019); ''affecting millions of patients'' (abstract).'
  example: Recall Lecture 4's data cascades and Lecture 14's silent failure in one line each; the new question is whom the degraded outputs reach (blast radius).
  read: §15.2.2
- id: 6
  q: What does aggregate accuracy hide?
  picture: 'New hbars (slideplot): Face++ gender-classification error by group, light male 0.8, dark male 0.7, light female 9.8, dark female 34.5 percent; on-plot ''43.1x''. Build: one aggregate bar first (labeled ''what the benchmark reports''), then the four groups.'
  numbers: 'Chapter table 3 (Gender Shades, Buolamwini and Gebru 2018): 0.8, 9.8, 0.7, 34.5 percent; 43.1x. Chapter: a classifier can post 95 percent overall while misclassifying more than a third of darker-skinned women.'
  example: 'Flaw of averages (Systems Perspective 15.4): the bridge that is safe on average; tail latency as the systems analogy students know (p99 from Lectures 12 and 13).'
  read: §15.3.2
- id: 7
  q: How many examples does a 1 percent group need before its error rate means anything?
  picture: Estimate card, then book margin-001 (random 1M against stratified 10K, log scale, 100x).
  numbers: 'Napkin Math 15.1: worst-case margin 1.96 sqrt(0.25/n) = 0.01 -> n = 9,604, about 10,000; random sampling 10,000 / 0.01 = 1,000,000; stratified 10,000; 100x.'
  example: 'Builds on Lecture 4''s data budget: naming a population fixes a per-group budget. Face ID for a 1 percent group.'
  read: §15.3.1 (Napkin Math 15.1)
- id: 8
  q: What does a fairness release gate return, and does publishing one change what ships?
  picture: 'New diagram: four slices, each a point estimate with a confidence interval against the gate threshold; lights read pass, fail, insufficient evidence. Small inset: invariance test (swap ''John'' and ''Jamal'', approval must not move). THEN Then-and-now paired hbars: darker-female error May 2017 against August 2018 for the three audited vendors (Face++ 34.5 -> 4.1, IBM 34.7 -> 16.97, Microsoft 20.8 -> 1.52 percent); two vendors not named in the first audit in 2018 (Amazon 31.37, Kairos 22.50) in gray.'
  numbers: 'Chapter: three outcomes, only pass permits release (§15.3.2); example application policies, error-rate ratio below 1.25x or FPR difference under 5 points; four-fifths rule as a non-dispositive selection-rate diagnostic (1978 Uniform Guidelines). Raji and Buolamwini 2019, Tables 1 and 2 (read from the paper; 2017 values = 2018 value minus the Table 2 difference, matching Gender Shades); new API versions within 66 to 190 days; overall error fell 5.72 to 8.3 percent. Chapter §15.2.4: Microsoft below 2 percent.'
  example: KWS gate slices by accent and acoustic environment (Lighthouse 15.1); stakeholder red-teaming. Twitter's image cropping audit led to uncropped previews (Yee et al. 2021), a product change rather than a threshold change (notes).
  read: §15.3.2; §15.2.4
- id: 9
  q: What do demographic parity, equal opportunity, and equalized odds each require?
  picture: 'Worked example as a table build: the two confusion matrices side by side (variant of the old deck''s confusion-matrix-groups.svg if it reads); each step highlights the cells one criterion uses and writes its two rates.'
  numbers: 'Chapter worked example and table 7: approval 55 against 40 percent (15 points); TPR 90 against 60 percent (30 points); FPR 20 against 20 percent (0 points). Both groups repay at 50 percent, so the impossibility results do not bind here. FNR 10 against 40 percent: qualified Group B applicants rejected at 4x the rate.'
  example: 'Plain-language definitions on the slide for non-CS students: TPR = of applicants who would repay, the share approved; FPR = of applicants who would default, the share approved.'
  read: §15.3.2.1
- id: 10
  q: Can a score be calibrated and still unfair?
  picture: 'Discussion slide on measured data: new grouped bars from ProPublica''s analysis, Black and White defendants: false positive rate 44.9 against 23.5 percent, false negative rate 28.0 against 47.7 percent, positive predictive value 63 against 59 percent; base rates 51 against 39 percent (derived from the same tables, labeled). Reveal: the impossibility in one line (Chouldechova 2017; Kleinberg et al. 2017).'
  numbers: 'ProPublica, How We Analyzed the COMPAS Recidivism Algorithm (2016), read: 7,214 Broward County defendants; Black: FP 44.85, FN 27.99, PPV 0.63; White: FP 23.45, FN 47.72, PPV 0.59; overall predictive accuracy 62.3 against 62.5 percent. Base rates derived from the contingency tables: 1,901 / 3,696 = 51.4 percent; 966 / 2,454 = 39.4 percent. Chapter War Story 15.3 quotes 44.9 against 23.5.'
  example: Northpointe's response that the score is equally predictive for both groups is the calibration side; both sides measured the same data correctly (notes).
  read: §15.3.2.1 (War Story 15.3)
- id: 11
  q: What does closing a fairness gap cost in dollars, and where can a team intervene?
  picture: 'Estimate card (given left, steps right) with the result on a small two-bar plot: Group B utility per applicant $150 baseline against $75 after equalizing TPR. THEN Book fig-fairness-frontier (hypothetical, labeled) with three labels added in steps: before training (reweighting), during training (adversarial debiasing, a second network head), after training (threshold adjustment, legally restricted).'
  numbers: 'Napkin Math 15.2 (constructed): base rate 50 percent; margin $1,500; default loss $3,000; TPR 60 -> 90 percent; FPR +20 points. Baseline 0.60 x 0.5 x 1,500 - 0.20 x 0.5 x 3,000 = $150; added +$225, -$300, net -$75; 50 percent within-group loss; Group B is 2,000 of 12,000 applicants (16.7 percent), so $12.50 per applicant population-wide. Figure 3 points: A unconstrained about 94.7 percent accuracy at 0.18 disparity; B 91 percent at 0.05 (''3.6 times fairer''); C 0 disparity at about 85 percent. Hypothetical, as the chapter states.'
  example: Group-specific cutoffs are prohibited in US employment selection and restricted in credit (ECOA, Regulation B); the calculation prices the trade-off, it is not a deployable fix. Fairlearn, AI Fairness 360, What-If Tool compute any metric; none decides which one (notes).
  read: §15.3.2.2 (Napkin Math 15.2); §15.3.2.2, §15.3.2.1 (mitigation)
- id: 12
  q: Does a gate passed at launch stay passed?
  picture: 'Focus frame for the Bias Feedback Model, Delta(k) = Delta(0) alpha^k; then a new plot of the projected TPR gap over quarters: alpha = 1.10 crosses the 5-point gate at quarter 6 (5.3 points); alpha = 0.90 with randomized exploration decays to 1.6 points; labeled ''fitted from two audits; illustrative''.'
  numbers: 'Napkin Math 15.3: 3.0 -> 3.3 points, alpha = 1.10; ln(5/3)/ln 1.1 = 5.4 -> quarter 6, 5.3 points; unmitigated 30 -> 43.9 points in 4 quarters; alpha = 0.90 -> 1.6 points. DLRM: 200 million impressions a day; 1 percent exploration = 2 million unselected impressions a day; each user''s feedback covers 0.002 percent of a 1 million item catalog.'
  example: 'Denied applicants generate no repayment labels: the loop censors its own evidence. Lecture 14''s retraining loop, seen as a fairness loop.'
  read: §15.3.4 (Napkin Math 15.3)
- id: 13
  q: How much carbon does one large training run emit, and what sets it?
  picture: 'Estimate card building on Lecture 0''s 1,287 MWh; then new hbars of Patterson et al. 2021 Table 4 net emissions: GShard-600B 4.3, T5 46.7, Switch 59.1, Meena 96.4, GPT-3 552.1 tCO2e, each bar labeled with its datacenter''s net kg CO2e/kWh (0.177 to 0.545); equation strip Energy x PUE x intensity.'
  numbers: 'Napkin Math 15.5: 1,287 MWh x 0.429 kg/kWh = 552 t; at 4.6 t per car-year, 120 car-years. Patterson et al. 2021 Table 4 (read): energy 24.1, 85.7, 179, 232, 1,287 MWh; net intensity 0.177 (GShard, North Carolina), 0.545 (T5, Taiwan), 0.330 (Switch), 0.415 (Meena, Georgia), 0.429 (GPT-3, US average); PUE 1.09 to 1.12. The choice of model, datacenter, and processor can change footprint by about 100 to 1,000x (Patterson et al. 2021, text).'
  example: 'The 2019 ''five cars'' estimate (Strubell et al.) and its correction (Patterson et al. 2021): the NAS estimate was overestimated, actual CO2e about 115x lower (gross); notes only.'
  read: §15.4.3 (Napkin Math 15.4, 15.5)
- id: 14
  q: For a busy service, which term dominates cost and carbon, in the book's scenario and in real fleets?
  picture: 'New stacked hbar of three-year TCO for the DLRM service: training $38K (1.9 percent), inference $1.52M (73.5 percent), operations $510K (24.6 percent); second bar pair for modeled accelerator carbon, 1.5 t against 97.3 t (63x); tag ''book scenario''. THEN Measured panel beside the scenario: Google, about 3/5 of ML energy for inference and 2/5 for training (2019 to 2021), ML under 15 percent of Google''s energy; Meta, AI power capacity split 10:20:70 experimentation:training:inference; embodied carbon about 30 percent of the footprint of Meta''s large-scale ML tasks (location-based).'
  numbers: 'Chapter table 10 and §15.4.2: 200 million inferences/day x 10 ms = 556 GPU-hours/day, 23.1 GPUs; $2.50/GPU-hour; 12 training cycles x $3,200; 400 W x 0.4 kg/kWh = 0.16 kg CO2e per GPU-hour; 40:1 cost ratio; 63x carbon ratio. Patterson et al. 2022 (arXiv 2204.05149, read): ML 10 to 15 percent of Google''s total energy across 2019 to 2021, about 3/5 inference. Wu et al. 2022 (arXiv 2111.00364, read): 10:20:70 power capacity; embodied/operational about 30/70; optimizations cut infrastructure to serve one language model by over 800x.'
  example: 'Fallacy: measuring training but not inference (§15.6). Checkpoint 15.4: a 20 percent inference cut saves about 14.6 percent of TCO; halving all training saves about 1 percent. Epoch AI frontier training cost 2.9x per year, Grok 4 about $388M (book fig-frontier-training-cost): cost decides who can take part (notes, FLEX).'
  read: §15.4.2; §15.4.1, §15.4.3
- id: 15
  q: What does a legal obligation become inside the machine, and is data trained into weights gone?
  picture: 'Table (four rows) on the KWS and credit cases: obligation -> capability -> machine cost; shared photo amazon-echo-dot-board.jpg as the KWS device. Rows: reasons for a decision (explanation compute; exact Shapley on 20 features = 2^20 = 1,048,576 evaluations); contestable decisions under GDPR Article 22 (reviewer hours: 0.1 percent of 1 million daily decisions = 1,000 cases a day); erasure (lineage traversal, retraining); record keeping (audit-log bytes = events x bytes per event x retention). THEN True-or-false vote, then a one-number reveal: 604 memorized training examples recovered from GPT-2 out of 1,800 candidates, 46 with individuals'' names, 32 with contact information; second step the DP-SGD memory bars: KWS 200K parameters, 800 KB per gradient, 204.8 MB per batch of 256; GPT-2 1.5B parameters, 1.5 TB against an 80 GB H100.'
  numbers: 'Chapter table 11, §15.3.3 (2^20), §15.5.3 (1,000 cases/day), §15.5.5 (audit volume formula). EU AI Act in force August 1, 2024, phased application. Meta and Ireland''s DPC 2023: invalid legal basis, no breach (one line). Carlini et al. 2021 (USENIX Security; arXiv 2012.07805, read): 604 unique memorized examples from 1,800 candidates; 46 with names; 32 with contact information; at least 0.1 percent of 600,000 generated samples. Chapter §15.5.2: DP-SGD naive per-sample gradient memory.'
  example: 'KWS: raw audio stays in an on-chip SRAM ring buffer until the wake word; signed manifests link each deployed binary to its training split. Fallacy: model weights are exempt from data governance (§15.6); membership inference (Shokri et al. 2017); machine unlearning named only.'
  read: §15.5.1, §15.5.3, §15.5.4, §15.5.5; §15.5.2, §15.6
worked_examples:
- name: Credit service fairness analysis (§15.3.2.1, table 7)
  steps:
  - 'given: Group A TP 4,500, FN 500, FP 1,000, TN 4,000; Group B TP 600, FN 400, FP 200, TN 800'
  - 'approval: 5,500 / 10,000 = 55 percent; 800 / 2,000 = 40 percent; 15 points'
  - 'TPR: 4,500 / 5,000 = 90 percent; 600 / 1,000 = 60 percent; 30 points'
  - 'FPR: 1,000 / 5,000 = 20 percent; 200 / 1,000 = 20 percent; 0 points'
  - 'result: demographic parity, equal opportunity, and equalized odds all violated; FPR alone looks fair'
  - 'meaning: against a 5-point gate the model does not ship; the matrices locate the disparity but not its cause'
- name: 'Napkin Math 15.2: the price of fairness'
  steps:
  - 'given: base rate 50 percent; margin $1,500; default loss $3,000; TPR 60 -> 90; FPR +20 points'
  - 'baseline: 0.6 x 0.5 x 1,500 - 0.2 x 0.5 x 3,000 = $150'
  - added repaid loans +$225; added defaults -$300; net -$75
  - 'result: 50 percent within-group loss; $12.50 per applicant across all applicants'
  - 'meaning: the trade-off is stated as a number stakeholders can argue about; it is not automatic, and closing a gap from a miscalibrated threshold can raise utility'
- name: 'Napkin Math 15.3: when a passed gate fails'
  steps:
  - 'given: launch gap 3.0 points, gate 5 points, next audit 3.3 points'
  - alpha = 3.3 / 3.0 = 1.10 per quarter
  - k > ln(5/3) / ln 1.10 = 5.4 -> quarter 6, gap 5.3 points
  - with randomized approvals alpha = 0.90 -> 1.6 points after 6 quarters
  - 'meaning: fairness under feedback is a stability property of the retraining loop; change what the loop observes'
- name: 'Napkin Math 15.5 and table 10: carbon of training and of serving'
  steps:
  - 'given: GPT-3 1,287 MWh (Lecture 0); 0.429 kg/kWh; 4.6 t per car-year'
  - 1,287,000 kWh x 0.429 = 552 t
  - 552 / 4.6 = 120 car-years
  - 'DLRM: 556 GPU-hours/day x 1,095 days x 0.16 kg = 97.3 t inference against 1.5 t for 12 training cycles'
  - 'meaning: grid and workload choice move the total by factors; for a busy service the serving path holds the leverage'
active_learning:
- at_minute: 1
  type: predict
  prompt: Auto-enrolled patients were 17.7 percent Black. Ranked by actual sickness, what share would be Black? A) 18 B) 25 C) 46 D) 70 percent
  answer: C, 46.5 percent (Obermeyer et al. 2019). A means the student equates accurate with fair.
- at_minute: 11.5
  type: diagnose
  prompt: 'Three failures: Amazon''s resume screener; the care algorithm; a credit model that silently declines self-employed applicants after a form change. Which D·A·M axis did each start on?'
  answer: Data (proxy features in historical text), Algorithm (proxy target), Machine (no per-group telemetry). Real failures can span axes; the axis names the first remedy to test.
- at_minute: 23
  type: estimate
  prompt: A group is 1 percent of users. You need its error rate within plus or minus 1 point at 95 percent confidence. How many of its images, and how many images in total if you sample at random?
  answer: '1.96^2 x 0.25 / 0.01^2 = 9,604, about 10,000; at random 1,000,000 (100x); stratified recruitment 10,000 (Napkin Math 15.1). Common error: computing the margin on the whole test set.'
- at_minute: 35.5
  type: discuss
  prompt: 'COMPAS: Black defendants who did not reoffend were flagged high risk 44.9 percent of the time, White 23.5 percent; the score''s precision was similar (63 against 59 percent). Was the tool fair? Which number should a court care about? Two minutes with a neighbor.'
  answer: 'Open. Both sides read the same data correctly: with base rates of 51 and 39 percent, a score calibrated across groups must give unequal error rates (Chouldechova 2017; Kleinberg et al. 2017). The choice of criterion is a policy decision someone must own and state.'
- at_minute: 39.5
  type: estimate
  prompt: Equalize Group B's TPR (60 -> 90 percent); its FPR rises 20 points. Base rate 50 percent, margin $1,500, default loss $3,000. Net change in utility per Group B applicant?
  answer: '+$225 - $300 = -$75 against a $150 baseline: 50 percent within-group loss (Napkin Math 15.2). Students who count only the added approvals answer +$225.'
- at_minute: 50.5
  type: estimate
  prompt: 'Lecture 0: training GPT-3 used about 1,287 MWh. At the US average 0.429 kg CO2e per kWh, how many tonnes? How many car-years at 4.6 t each?'
  answer: 552 t; 120 car-years (Napkin Math 15.5; Patterson et al. 2021 Table 4 gives 552.1 t).
- at_minute: 63.5
  type: concept_question
  prompt: 'True or false: once a user''s records are deleted from the training database, the deployed model no longer contains them.'
  answer: False. 604 of 1,800 candidate outputs extracted from GPT-2 were verbatim training data (Carlini et al. 2021); erasure requires lineage to find derived artifacts and then retraining, validated unlearning, or another legally appropriate control.
- at_minute: 66
  type: retrieval
  prompt: 'Back to the care algorithm. Close your notes: write the requirement, the release gate, the production monitor, and the record that would have caught it.'
  answer: 'Requirement: predict need (active chronic conditions), not cost, named per racial group. Gate: per-group calibration on health (illness at a given score), with enough Black patients to bound it. Monitor: per-group illness among enrolled and not enrolled, refit each audit. Record: model card with intended use and the target; lineage to the label definition.'
open_questions:
- 'Who should choose the fairness criterion for a risk score used by a court or a hospital: the engineers, the agency that buys it, the legislature, or the people scored?'
- A frontier training run now costs hundreds of millions of dollars (Epoch AI, 2.9x per year). Is efficiency a question of access as well as energy, and who should pay for evaluation of groups a market does not reward?
- If inference dominates emissions, should a service report carbon per request the way it reports latency, and to whom?
more_examples:
- 'Amazon recruiting tool (Dastin 2018; War Story 3.1 in Lecture 3): recall only.'
- 'Gender Shades follow-up: Amazon 31.37 and Kairos 22.50 percent darker-female error in August 2018, not named in the first audit (Raji and Buolamwini 2019, Table 1).'
- 'YouTube radicalization audit: 349 channels, 330,925 videos, more than 72 million comments, more than 2 million recommendations (Ribeiro et al. 2020).'
- Facebook 2018 News Feed objective change toward meaningful social interactions (Mosseri 2018).
- 'Hospital shortcut: pneumonia models learned scanner artifacts and text tags (Zech et al. 2018, Example 15.1).'
- 'Uber ATG fatal collision, Tempe 2018: the human backup was distracted; automatic emergency braking was disabled (NTSB HAR-19/03; War Story 15.2).'
- 'Twitter image cropping: audit led to uncropped previews (Yee et al. 2021).'
