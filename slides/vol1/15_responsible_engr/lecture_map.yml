  why: Lecture 15b owns them.
closing:
  return_to_hook: 'Back to the care algorithm, now as an engineering artifact. Specify: the target is need, not cost, and Black and White patients are named populations. Measure: a gate on illness at a given score for each group, with enough patients to bound it. Price: the extra enrollment the corrected target implies (46.5 against 17.7 percent of a fixed program) is a budget decision stated as a number. Operate: per-group outcomes for enrolled and not-enrolled patients, refit every audit. A gray fifth row, Record, points to Lecture 15b: what the system must keep to prove all of this. None of it is a new discipline; it is the requirement, gate, price, and monitor the course built for latency.'
  read_and_practice:
  - §15.2, §15.3 (all), §15.6 (first four items)
  - Self-check questions for §15.2 and §15.3
  - Napkin Math 15.1, 15.2, 15.3; Checkpoint 15.2
  further_reading:
  - cite: Responsible Engineering, §15.2 and §15.3
    url: ''
    why: The proxies, the fairness criteria, the price of fairness, and the feedback model with every number.
  - cite: Obermeyer, Powers, Vogeli, Mullainathan, Dissecting Racial Bias in an Algorithm Used to Manage the Health of Populations, Science 2019
    url: https://doi.org/10.1126/science.aax2342
    why: 'The hook, in four pages: how a convenient proxy label creates bias and how changing the label fixes most of it.'
  - cite: 'Barocas, Hardt, Narayanan, Fairness and Machine Learning: Limitations and Opportunities, MIT Press 2023 (free online)'
    url: https://fairmlbook.org
    why: The clearest treatment of the criteria and why they conflict; written for engineers and policy readers alike.
  - cite: Raji and Buolamwini, Actionable Auditing, AIES 2019
    url: https://doi.org/10.1145/3306618.3314244
    why: Measured evidence that a published, disaggregated audit changes what vendors ship.
  - cite: Chouldechova, Fair Prediction with Disparate Impact, Big Data 2017
    url: https://doi.org/10.1089/big.2016.0047
    why: The identity behind the computed COMPAS conflict.
  - cite: Hardt, Price, Srebro, Equality of Opportunity in Supervised Learning, NeurIPS 2016
    url: https://arxiv.org/abs/1610.02413
    why: Defines equal opportunity and shows how to reach it by post-processing a score.
bridge: 'Lecture 15b: the system can treat people correctly and still owe more: its energy, carbon, and dollars over its life, and proof of what it did with people''s data. What does each cost, and what must the machine keep?'
