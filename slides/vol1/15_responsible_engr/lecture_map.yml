closing:
  return_to_hook: 'Back to the care algorithm, now as an engineering artifact. Specify: the target is need, not cost, and Black and White patients are named populations. Measure: a gate on illness at a given score for each group, with enough patients to bound it. Price: the extra enrollment the corrected target implies (46.5 against 17.7 percent of a fixed program) is a budget decision stated as a number. Operate: per-group outcomes monitored and refit every audit. Govern: a model card that records the target, and lineage back to the label definition. None of it is a new discipline; it is the same requirement, gate, monitor, and record the course built for latency.'
  read_and_practice:
  - §15.2, §15.3.1 to §15.3.2, §15.3.4, §15.4, §15.5.3 to §15.5.5, §15.6
  - Self-check questions for §15.2, §15.3, §15.4
  - Napkin Math 15.1, 15.2, 15.3, 15.5; Checkpoints 15.2 and 15.4
