closing:
  return_to_hook: "Back to the three bars. Little's law gives the sequences in decode at once: at most 30,904 x 0.2 s = 6,181 under the 200 ms TPOT and 12,979 x 0.04 s = 519 under 40 ms. A tighter TPOT shortens the step, and a shorter step carries fewer sequences, so each weight read serves fewer tokens. The levers of the lecture each move one limit: speculative decoding and fewer weight bytes shorten the step, paging and sharing fit more conversations in memory, chunked prefill and disaggregation stop prompts from stalling the step. A tighter deadline is still bought with accelerators, now counted in tokens."
  read_and_practice: ["§13.9, §13.10.3, Checkpoints 13.5 and 13.6", "Self-check questions for §13.9 and §13.10", "Napkin Math 13.5; equation 15; table 19 rows 'Decode floor', 'Tokens per speculative round', 'KV cache per token'"]
  further_reading:
    - cite: "Model Serving, §13.9 and §13.10.3"
      url: ""
      why: "The decode floor, continuous batching, paging, the KV budget, and the Llama 3 8B case study this lecture works."
    - cite: "Yu et al., Orca: A Distributed Serving System for Transformer-Based Generative Models, OSDI 2022"
      url: "https://www.usenix.org/conference/osdi22/presentation/yu"
      why: "Iteration-level scheduling, the origin of continuous batching."
    - cite: "Kwon et al., Efficient Memory Management for Large Language Model Serving with PagedAttention, SOSP 2023"
      url: "https://arxiv.org/abs/2309.06180"
      why: "The measured KV-cache waste, the block table, and sharing."
    - cite: "Agrawal et al., Taming Throughput-Latency Tradeoff in LLM Inference with Sarathi-Serve, OSDI 2024"
      url: "https://arxiv.org/abs/2403.02310"
      why: "Generation stalls and chunked prefill."
    - cite: "Zhong et al., DistServe: Disaggregating Prefill and Decoding for Goodput-optimized LLM Serving, OSDI 2024"
      url: "https://arxiv.org/abs/2401.09670"
      why: "Per-GPU goodput, interference, and how to size the two pools."
    - cite: "Patel et al., Splitwise: Efficient Generative LLM Inference Using Phase Splitting, ISCA 2024"
      url: "https://arxiv.org/abs/2311.18677"
      why: "Measured latency, batching, memory, and power by phase on A100 and H100."
  bridge: "Lecture 14: the service is up and fast. How do we know it is still right? Training-serving skew (a resize or color-order mismatch) keeps every latency dashboard green while predictions change (§13.8.5, What's Next)."

