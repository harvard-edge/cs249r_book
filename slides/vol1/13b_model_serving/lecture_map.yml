  - "Concepts Part 1 taught that move here: concept questions 12 to 15 of Part 1's map, its worked example 'KV budget for Llama 3 8B', its activity at minute 55, the LLM half of its synthesis (synth_llm), and its figures ttft_step1..2, decode_bytes_step1..2, continuous_step1..2, kv_budget, vllm_step1..2, joules_token. Part 2's images/make_figs.py regenerates them from a copy of Part 1's code, since Part 1's folder is not edited by this lecture's build."
