notes_for_author:
  - "2026-10-19, panel fixes. Worked example 4 no longer puts 140 GB of FP16 weights on one 80 GB H100: the card says the model is split across two H100s (as Conclusion §16.4 does), each reads 70 GB per token, 70 GB / 3.35 TB/s = 20.9 ms, at most about 48 tokens/s (calcs.py; H3). The diagnose table's intensity column is headed 'FLOP/byte (FP32)', so its 0.50 is not set against the FP16 decode slide's 1.0. The Decode divider's read line is one line ('§6.7.2 and §6.7.4') and clears the section watermark. Goals frame carries the course-thread strip (fast enough, algorithm, machine; H1). The packed-projection code, the attention-share predict, the true-or-false vote, the cache-crossing predict, and the scattered-gather bars moved to [OPTIONAL]; the core runs about 51.5 minutes (M1). The by-hand toy stays [CORE] because goal 1 depends on it."
  - "Sources checked on 2026-10-17. Mudigere et al.: the arXiv abstract (2104.05158, Facebook) reads 'We demonstrate the capability to train very large DLRMs with up to 12 Trillion parameters'; the slide quotes it and cites the arXiv number and the ISCA 2022 version. Llama 3.1 8B: the Hugging Face model card lists '128k' context. Context windows: OpenAI DevDay post (6 Nov 2023) 'a 128k context window'; Anthropic Claude 2.1 (21 Nov 2023) 'a limit of 200,000 tokens'; Google Gemini 1.5 (15 Feb 2024) standard 128,000 tokens and up to 1 million in limited preview, so the 1M point is labeled 'preview'. The OpenAI page refused automated fetch; its wording was confirmed through the post's indexed text."
  - "Derived values are marked on each slide: the toy's numbers, GPT-2 XL's 1.55B and 2.95 GFLOP, the 10 percent share, the 21 ms decode bound, the Llama and PaLM KV sizes, the recommender's bytes and request-rate bounds, and the 1M-token synthesis."
  - "Llama 3.1 8B's window is recorded in MLSysIM only on Llama3_70B; add context_length to Llama3_8B if the deck computes from it."
  - "Table 8 intensities are FP32 weight-only proxies; the deck never places them against the FP16 ridge of 295."
  - "The recommender request (26 features, one 128-wide FP32 row each) is illustrative: Criteo has 26 categorical features, but production requests can be multi-hot, and DLRM benchmark configurations often use narrower rows."
  - "2026-10-17 build: KV cache bars use decimal KB, as GPT-2 XL's 307.2 KB does: Llama 2 7B 524 KB, Llama 3.1 8B 131 KB (131,072 B, as Lecture 13b uses), Llama 2 70B 328 KB (2.6 MB unshared), PaLM 121 KB. The plan's 512 KB and 128 KB were the same byte counts in binary units."
  - "2026-10-17 build: the book figures for attention (figures 8, 9, 10), the transformer (11), prefill and decode (12), and DLRM (14) have labels too small at slide size, so the deck uses slide-size redraws credited 'after the chapter's figure'; only the all-to-all margin figure is used as is. Part 1's plots that moved here (state_memory, quadratic, context_memory, capacity) are regenerated from a copy of Part 1's code in images/make_figs.py."
  - "2026-10-17 build: the 79 percent share is quoted from Gupta et al. 2020 as the plan gives it; the chapter itself says only 'most of its AI inference cycles'."
  - "2026-10-18 revision (round 1 review): callbacks now name Lecture 8b (FlashAttention tiling) and Lecture 13b (LLM serving: batching decode, paging); the embedding-partitioning LINK to Lecture 8 is replaced by a pointer to 6.8.3. New frame before the KV formula: a two-step picture of one layer's cache (keys and values kept, each decode step appends a row and the new query reads every row, old queries crossed out). The formula slide gains a step: KV width = KV heads x head width, with a strip of 32 query heads grouped onto 8 key-value heads. The prefill and decode slide is redrawn at full size with the KV cache bar, so the term is named with a picture before it is sized; the recall plot's label no longer uses the term early. The 3.34 TFLOP prompt total moved from the GPT-2 XL weights slide to the predict reveal (with its derivation) so the predict is not spoiled. True-or-false claim 2 is now the tiling claim (6.6.4); the heads claim repeated a slide title. The chapter's KV-growth pitfall is a WARN on the sharing slide. The lighthouse diagnose shows Part 1's three rows in gray and asks only for GPT-2 XL and DLRM (3.5 min); MobileNetV2 reads 'Compute (phone latency)' per 6.11. Label collisions fixed in block_macs (annotations on the plot), million_request, context_memory, and state_memory. Notes 72.0 minutes; 9.5 minutes tagged [OPTIONAL]."
  - "2026-10-19 visual and depth pass (audit visual_audit/06b_nn_architectures.md). Real artifacts added: (1) the attention-pronoun slide's top sentence now shows measured weights (BERT-base-uncased layer 4 head 11, chosen as the head with the largest weight from 'it' on a noun; 'they' -> student 0.38, homework 0.31), produced by images/attention_probe.py, output in images/data/attention_probe.txt; the note says honestly that this head gives 'trophy' 0.82/0.84 for both 'big' and 'small'. The Vaswani et al. Fig. 4 image was tried and dropped: its rotated token labels fall below 6 pt at slide size. (2) New frame after the heads slide: nanoGPT model.py CausalSelfAttention excerpt (commit 3adf61e), green weight lines and orange S^2 d product lines. (3) The block slide shows Block.forward's two skip lines. (4) GPT-2 XL weights slide shows four fields of the real config.json (HF openai-community/gpt2-xl, revision 15ea56d); the note gives the exact 1,557,611,200 count (nanoGPT prints 1558M). (5) True-or-false slide adds a replot of Dao et al. 2022 Tables 20 and 21 (PyTorch vs FlashAttention runtime and memory, A100); fig flash_measured. (6) Decode estimate adds the AMD Fiji HBM package photo; decode_ridge redrawn at column size. (7) KV formula slide quotes Llama 3.1 8B's dim/n_heads/n_kv_heads from meta-llama/llama-models models/sku_list.py (commit 0e0b8c5); the gated HF config was not reachable. (8) New frame: Kwon et al. SOSP 2023 Fig. 1 (left) memory layout, with OPT-13B per-token and per-request KV arithmetic (0.82 MB, 1.68 GB, about 7 requests in 30% of 40 GB); Fig. 1 right and Fig. 2 skipped (labels illegible at slide size; paging belongs to Lecture 13b). (9) Table-size estimate quotes DLRM's nn.EmbeddingBag line (dlrm_s_pytorch.py create_emb, commit 9bc1bc3). (10) Capacity slide replaces the all-to-all margin figure with a photo of Facebook's Prineville datacenter (Oregon State Archives, CC BY 4.0). Mudigere et al. Fig. 1 (model capacity) was tried and dropped as illegible at column size. Fixes: the 240 GB slide names its 12-head, 32-layer model; context_memory now uses a decimal 80 GB, so the scores line fills it near 40K (was 41K from 80 GiB under an 80 GB label). New images/calcs.py computes every derived number in the deck; make_figs.py imports it. Notes 71.5 minutes, 9.5 tagged [OPTIONAL]; divider notes tagged [CORE]."
