<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395">
<rect width="900" height="395" fill="white"/>
<text x="20" y="20" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#008F45" text-anchor="start" dominant-baseline="central">1. Fit on training split only (val, test, serving excluded)</text><rect x="20" y="44" width="205" height="86" rx="8" fill="#D4EFDF" stroke="#008F45" stroke-width="2.5"/><text x="122.5" y="73.8" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A2E" text-anchor="middle" dominant-baseline="central">Train split</text><text x="122.5" y="100.19999999999999" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A2E" text-anchor="middle" dominant-baseline="central">[10, 20, 30]</text><line x1="225" y1="87" x2="276.0" y2="87.0" stroke="#666666" stroke-width="3"/><polygon points="290,87 276.0,80.0 276.0,94.0" fill="#666666"/><rect x="290" y="44" width="330" height="86" rx="8" fill="#D4EFDF" stroke="#008F45" stroke-width="2.5"/><text x="455.0" y="73.8" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E" text-anchor="middle" dominant-baseline="central">Fit once on train</text><text x="455.0" y="100.19999999999999" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E" text-anchor="middle" dominant-baseline="central">μ = 20.0,  σ = 8.16</text><line x1="620" y1="87" x2="671.0" y2="87.0" stroke="#666666" stroke-width="3"/><polygon points="685,87 671.0,80.0 671.0,94.0" fill="#666666"/><rect x="685" y="44" width="195" height="86" rx="8" fill="#D4EFDF" stroke="#008F45" stroke-width="2.5"/><text x="782.5" y="73.8" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E" text-anchor="middle" dominant-baseline="central">x = 50</text><text x="782.5" y="100.19999999999999" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E" text-anchor="middle" dominant-baseline="central">z = +3.67</text><text x="20" y="194" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#CB202D" text-anchor="start" dominant-baseline="central">2. Anti-pattern: refit on incoming serving batch</text><rect x="20" y="218" width="205" height="86" rx="8" fill="#F5D2D5" stroke="#CB202D" stroke-width="2.5"/><text x="122.5" y="247.8" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A2E" text-anchor="middle" dominant-baseline="central">Serving batch</text><text x="122.5" y="274.2" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A2E" text-anchor="middle" dominant-baseline="central">[50, 70, 90]</text><line x1="225" y1="261" x2="276.0" y2="261.0" stroke="#CB202D" stroke-width="3"/><polygon points="290,261 276.0,254.0 276.0,268.0" fill="#CB202D"/><rect x="290" y="218" width="330" height="86" rx="8" fill="#F5D2D5" stroke="#CB202D" stroke-width="2.5"/><text x="455.0" y="247.8" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E" text-anchor="middle" dominant-baseline="central">Refit on batch</text><text x="455.0" y="274.2" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E" text-anchor="middle" dominant-baseline="central">μ = 70.0,  σ = 16.33</text><line x1="620" y1="261" x2="671.0" y2="261.0" stroke="#CB202D" stroke-width="3"/><polygon points="685,261 671.0,254.0 671.0,268.0" fill="#CB202D"/><rect x="685" y="218" width="195" height="86" rx="8" fill="#F5D2D5" stroke="#CB202D" stroke-width="2.5"/><text x="782.5" y="247.8" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#CB202D" text-anchor="middle" dominant-baseline="central">x = 50</text><text x="782.5" y="274.2" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#CB202D" text-anchor="middle" dominant-baseline="central">z = -1.22</text><text x="450" y="360" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#CB202D" text-anchor="middle" dominant-baseline="central">Same code, different state: 4.90σ silent skew (no error raised).</text>
</svg>
