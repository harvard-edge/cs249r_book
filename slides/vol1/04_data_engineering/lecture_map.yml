chapter: 04_data_engineering
lecture: 4
title: "Data Engineering, Part 1"
subtitle: "Data as Code"
layer: data
minutes: 75
notes_minutes: 71.5
target_ideas: 30
thesis: "Training data is the program of an ML system, so it needs the discipline of code: requirements, review, tests, versioning, and monitoring."
hook:
  minutes: "0-4"
  setup: "War Story 4.1: in March 2016 Microsoft's Tay chatbot learned from public replies and was suspended 16 hours after launch. Nobody changed its code; its users changed its data."
  question_to_class: "Who wrote the program that Tay ran on its last day?"
  payoff: "The users did, through the data. The closing synthesis redraws Tay's path beside the keyword-spotting pipeline, whose ingest, label, process, and release stages are each a boundary Tay lacked; delivery and monitoring are drawn dashed and left to Part 2."
  sources: ["chapter War Story 4.1 (Lee 2016)", "chapter §4.1"]
second_hook:
  minutes: "11-15"
  setup: "A wake-word detector checks one window per second, 2,592,000 windows a month. Predict the false wakes at 99.9 percent rejection."
  payoff: "2,592 a month; even 99.999 percent gives 26. One false wake a month needs 99.99996 percent rejection (false-positive rate 3.9e-7)."
  sources: ["chapter Napkin Math 4.1 and its margin figure"]
driving_question: "How do we build the data an ML system learns from with the discipline we give its code?"
running_example: "Keyword spotting (KWS) on a smart speaker: 98 percent detection, below 1 false wake a month, 256 KB model, 16 KB preprocessing state, $150K data budget (illustrative scenario, chapter §4.3). The reference corpus is the Multilingual Spoken Words Corpus."
recall: "Lecture 3: name the lifecycle stage that hands a versioned dataset to model development, and one decision made there that later stages inherit."

concept_questions:
  - q: "Why does training data behave like source code?"
    picture: "Two parallel paths: code -> compiler -> program; data -> training -> model. Tay as the case."
    numbers: "Tay suspended after 16 hours (War Story 4.1)."
    example: "Tay; a changed label set changes the model with no code diff."
    read: "§4.1"
  - q: "Why is overall accuracy the wrong target, and what is a data budget?"
    picture: "Log-scale bars of monthly false wakes against a 1-per-month line (build); then the given card and line-by-line budget calculation."
    numbers: "2,592,000 windows/month; 2,592 at 99.9%; 26 at 99.999%; needed false-positive rate 3.9e-7 (Napkin Math 4.1). $150K; 60% labeling = $90K; $0.12 per reviewed label; 750K labels (Napkin Math 4.2)."
    example: "KWS design: 13 MFCCs, local inference, noisy slice, synthetic augmentation."
    read: "§4.3, §4.3.1"
  - q: "How much listening proves one false wake a month?"
    picture: "Bars: 720 h in a month against 2,160 h needed."
    numbers: "Rule of three: 95% upper bound 3/T with zero events; 2,160 h, about 248 GB at 16 kHz (§4.11)."
    example: "KWS evaluation streams kept separate from training."
    read: "§4.11"
  - q: "Why do evaluation streams and hard negatives answer different questions?"
    picture: "Two cards: representative streams (time order, never trained on, false accepts per hour) against mined hard negatives (chosen for difficulty, used in training)."
    numbers: "None; the distinction (§4.4.1)."
    example: "Near-wake phrases against hours of ordinary kitchen audio."
    read: "§4.4.1"
  - q: "What can synthetic data do, and what can it not?"
    picture: "Book figure 7 (simulation and real data blended); optional book figure 6 (pretraining corpora against the stock of public human text)."
    numbers: "Corpora grew about 2.9x a year, 300B tokens (GPT-3, 2020) to 36T (Qwen3, 2025), against about 300T tokens of public human text; midpoint reached around 2028 (§4.4.3, Villalobos et al. 2024)."
    example: "TTS convolved with room impulse responses; SpecAugment."
    read: "§4.4.3, Example 4.2"
  - q: "What does a label cost, and why do labels dominate data cost?"
    picture: "Log bars: class label 1, ten boxes 40 entries, one 1920x1080 mask about 2.1 million; then $100K labeling against a $20 to $40 training run."
    numbers: "About 35 s per box; more than 1.5 h per Cityscapes image; 51,840x entries (§4.6.1). 2,498x to 4,995x (§4.6.2, tables 3 and 4)."
    example: "Labeling one million images, training ResNet-50 on 8 A100s."
    read: "§4.6.1 to §4.6.2"
  - q: "How wrong are benchmark labels, and why?"
    picture: "Bars of test-set label error rates (Northcutt et al. 2021); then book figure 12, six mislabeled examples, voted as bad input or missing expertise."
    numbers: "ImageNet val 5.83%; CIFAR-100 5.85%; QuickDraw 10.12%; AudioSet 1.35%; MNIST 0.15%."
    example: "Black stork labeled white stork; whispered 'Alexa' against 'Alexis'."
    read: "§4.6.3"
  - q: "How do we measure label quality without knowing the truth?"
    picture: "Cohen's kappa, terms revealed."
    numbers: "Two annotators at 90% 'not spam' agree 82% by chance; KWS campaign kappa 0.85 -> 0.72 (§4.6.3, §4.6.4)."
    example: "New annotators accept near-homophones."
    read: "§4.6.3 to §4.6.4"
  - q: "Can active learning and automatic labeling scale labels?"
    picture: "Given card and reveal for active learning; book figure 14 (MSWC forced alignment)."
    numbers: "Active learning: $100K to score 10M images; filter to 500K, about 90K labels (Napkin Math 4.6). MSWC: 23.4M clips, 340,000 keywords, 50 languages; about 65,000 h or 32.5 person-years by hand at 10 s per label (§4.6.6)."
    example: "Per-clip provenance: source recording, transcript version, aligner version, boundary confidence."
    read: "§4.6.5 to §4.6.6"
  - q: "What is mechanical against semantic validation?"
    picture: "Predict card: the quiet batch (15 percent of clips at half gain, every file valid)."
    numbers: "15 percent of a crowdsourced batch (§4.5.3)."
    example: "Schema check passes; a loudness check against training fails."
    read: "§4.5.3, Systems Perspective 4.1"
  - q: "How do contracts and side queues make silent defects loud?"
    picture: "ZIP-code diagnosis chain; expectation suite beside the 8 kHz batch; retries, dead-letter queue, and circuit breaker (TikZ)."
    numbers: "Backoff 1, 2, 4 s (§4.5.5)."
    example: "Pipeline jungle ZIP code (Example 4.1); 8 kHz clips in a 16 kHz pipeline (§4.5.4)."
    read: "§4.2.1, §4.5.4, §4.5.5"
  - q: "How does evaluation leak, and where must deduplication run?"
    picture: "Split by file against split by hash of speaker key (build), then normalization statistics fitted before the split; predict card for dedup."
    numbers: "None; the rules (§4.1, §4.7.1, §4.8 table 5, §4.1 self-check 1)."
    example: "One speaker's repeated takes in train and test."
    read: "§4.1, §4.7.1"
  - q: "What is training-serving skew?"
    picture: "Two paths normalizing the same clip: per-batch statistics against saved training statistics (build), then the KWS gain trap."
    numbers: "None; the definition (§4.7.1)."
    example: "Per-clip peak normalization a streaming device cannot reproduce."
    read: "§4.7.1"
  - q: "What must a dataset release record?"
    picture: "Table 5 revealed as identity, evaluation, and build fields."
    numbers: "Seven fields per clip (§4.8, table 5)."
    example: "Split from a hash of the speaker key; label with rubric version; feature configuration with code commit."
    read: "§4.8"

worked_examples:
  - name: "Napkin Math 4.1 and §4.11: false-wake budget to listening hours"
    steps: ["2,592,000 one-second windows a month", "99.9% rejection -> 2,592 false wakes; 99.999% -> 26", "1 per month needs false-positive rate 3.9e-7", "rule of three: 2,160 h of non-keyword audio, about 248 GB", "the target sets a data requirement no training set replaces"]
  - name: "Napkin Math 4.2: allocating the KWS data budget"
    steps: ["$150K, 256 KB model, 16 KB preprocessing, 6 months", "60% to labeling: $90K", "$0.10/label + 20% review = $0.12", "750K labels", "below the 1M anchor; acceptance, not the table, decides"]
  - name: "§4.5.3: the quiet batch"
    steps: ["15 percent of clips at half microphone gain", "every file valid: schema check passes", "loudness distribution against the training baseline fails", "mechanical checks validate the container; semantic checks the content"]
  - name: "§4.8, table 5: the release table"
    steps: ["identity: content hash, speaker key, consent", "evaluation: split from a hash of the speaker key, label with rubric version", "build: alignment version, feature configuration and code commit"]

active_learning:
  - at_minute: 1
    type: discuss
    prompt: "Tay changed its behavior with no code change. Who wrote its last program?"
    answer: "Its users, through the data it learned from."
  - at_minute: 6.5
    type: retrieval
    prompt: "Name the lifecycle stage that hands a dataset to model development, and one decision every later stage inherits."
    answer: "The data stage; population collected, label definitions, split."
  - at_minute: 11
    type: predict
    prompt: "At 99.9% per-window rejection, how many false wakes a month? A) 3 B) 26 C) 2,600 D) 26,000"
    answer: "C: 2,592."
  - at_minute: 15.5
    type: estimate
    prompt: "$150K budget, 60% to labeling, $0.10/label plus 20% review. How many labels?"
    answer: "$90K / $0.12 = 750K labels."
  - at_minute: 23
    type: predict
    prompt: "Can mined hard negatives give the false-wake rate?"
    answer: "No: they were chosen to be hard, so they say nothing about how often such audio occurs."
  - at_minute: 34
    type: vote
    prompt: "For each mislabeled image: bad input or missing expertise?"
    answer: "MNIST digit and QuickDraw sketch: input quality; storks and crab: expertise."
  - at_minute: 37.5
    type: predict
    prompt: "Can active learning reach 95% on a 10M-image pool with $50K, $0.50/label, $0.01/image scoring?"
    answer: "Not as stated; filter to 500K candidates and buy about 90K labels."
  - at_minute: 45
    type: predict
    prompt: "Every file in the quiet batch is valid. Which check catches it?"
    answer: "A loudness check against the training baseline, not the schema check."
  - at_minute: 47.5
    type: diagnose
    prompt: "A credit model rejects every applicant from one region after a database migration. Find the cause."
    answer: "ZIP code retyped to integer; an unseen category mapped to high risk. Fix: a data contract at ingestion."
  - at_minute: 56
    type: predict
    prompt: "Deduplicate before or after the split?"
    answer: "Before: a copy on both sides leaks evidence into evaluation."
  - at_minute: 64
    type: concept_question
    prompt: "True or false: more data always helps; preprocessing can be finished once; shared code guarantees consistency."
    answer: "All false (§4.13)."

open_questions:
  - "Synthetic speech is ten times cheaper per example in the scenario. How much of a wake-word corpus would you let it be, and what evidence would change your mind?"
  - "A model that learns from its own users (Tay, recommendation clicks) gets fresh data and an attack surface at once. Where would you put the boundary?"
  - "Public human text may run short around 2028 at current growth (Villalobos et al. 2024). Which part of data engineering becomes the bottleneck then?"

more_examples:
  - "Tay chatbot, 2016 (Lee 2016, War Story 4.1)."
  - "Multilingual Spoken Words Corpus: 23.4M clips, 340,000 keywords, 50 languages, labeled by forced alignment (§4.6.6)."
  - "Pervasive label errors in ten benchmark test sets (Northcutt et al. 2021)."
  - "1914 Cleveland 'traffic light' scraped image (§4.4.3)."
  - "Pipeline jungle ZIP-code failure (Example 4.1, after Sculley et al. 2015)."
  - "Deequ: unit tests for data at Amazon scale (Schelter et al. 2018, §4.5.4)."

segments:
  - name: "Data as Code"
    divider: "Why does training data behave like source code?"
    read: "§4.1"
    questions: [1]
    minutes: 10.5
  - name: "Requirements"
    divider: "How does a product target become a data requirement?"
    read: "§4.3, §4.4, and §4.11"
    questions: [2, 3, 4, 5]
    land: "The target sets the data, including the data training never sees."
    minutes: 17
  - name: "Labels"
    divider: "What does a label cost, and how wrong is it?"
    read: "§4.6"
    questions: [6, 7, 8, 9]
    land: "Labels are the specification, and every wrong label is paid for twice."
    minutes: 15.5
  - name: "Boundaries"
    divider: "Where do silent defects enter, and what stops them?"
    read: "§4.1, §4.2, §4.5, and §4.7.1"
    questions: [10, 11, 12, 13]
    land: "Leakage and skew come from inside the pipeline; a contract at each boundary turns a silent defect into a loud one."
    minutes: 17
  - name: "Release"
    divider: "What must a dataset record so a later failure can be traced?"
    read: "§4.8"
    questions: [14]
    land: "A release that records how it was built is what makes every later comparison possible."
    minutes: 8

closing:
  return_to_hook: "Tay's path went from users straight into the model. The KWS pipeline puts a boundary at each stage built today: contracts and statistical checks at ingestion, a rubric and kappa at labeling, frozen statistics at processing, and a release with speaker-hash splits. Delivery and monitoring are drawn dashed for Part 2."
  read_and_practice: ["§4.1 to §4.8 and §4.11", "chapter self-check questions", "Napkin Math 4.1, 4.2, 4.6"]
  further_reading:
    - cite: "Chapter 4, Data Engineering, §4.1 to §4.8 and §4.11"
      url: "https://mlsysbook.ai"
      why: "The budget, acquisition, labeling, validation, and release arguments with every number."
    - cite: "Sambasivan et al., 'Everyone wants to do the model work, not the data work': Data Cascades in High-Stakes AI, CHI 2021"
      url: "https://doi.org/10.1145/3411764.3445518"
      why: "Interviews with practitioners on how data defects cascade."
    - cite: "Northcutt, Athalye, Mueller, Pervasive Label Errors in Test Sets Destabilize ML Benchmarks, NeurIPS 2021"
      url: "https://arxiv.org/abs/2103.14749"
      why: "The label-error data behind the Labels segment."
    - cite: "Breck et al., Data Validation for Machine Learning, SysML 2019"
      url: "https://proceedings.mlsys.org"
      why: "Validation at the ingestion boundary in production (TFDV)."
    - cite: "Gebru et al., Datasheets for Datasets, CACM 2021"
      url: "https://doi.org/10.1145/3458723"
      why: "Documenting a dataset so another team can trust it."
    - cite: "Mazumder et al., Multilingual Spoken Words Corpus, NeurIPS 2021"
      url: null
      why: "The automatically labeled corpus behind the running example."
  bridge: "Lecture 4b: can the pipeline keep pace with the accelerator and with the world?"

left_to_reading:
  - concept: "Batch versus streaming, ETL versus ELT (Napkin Math 4.3, 4.4)"
    why: "Cost accounting is better read than heard; one notes line in the synthesis (streaming compute about 3x batch in the chapter's scenario)."
  - concept: "Feature stores and point-in-time joins"
    why: "Secondary concept; KWS needs none. No lecture operates them; Data Engineering §4.7.5 is the reading."
  - concept: "Weak supervision and AI-assisted labeling (§4.6.5)"
    why: "Active learning and forced alignment carry the scaling idea."

coverage:
  primary_taught: ["Data as code practice", "Data cascades", "Labels are the specification", "Training-serving consistency", "Data leakage"]
  primary_taught_in_part2: ["The feeding problem", "Drift statistics"]
  primary_left_to_reading: []
  secondary: ["Data budget from targets (taught)", "Coverage and acquisition (taught: evaluation streams, hard negatives, synthetic data)", "Validation at the ingestion boundary (taught: quiet batch, ZIP code, contracts, dead-letter queue)", "Dataset releases and lineage (taught: release table)", "Ingestion and transformation patterns (reading)", "Feature stores (reading)"]

notes_for_author:
  - "The chapter's KWS requirements and budget are an illustrative scenario; slides say so."
  - "99.99% (259 false wakes) is derived from the chapter's window count; the margin figure shows only 99.9% and 99.999%."
  - "2026-10-17: split into two lectures per 04b_data_engineering/part1_changes.md. Moved to Part 2: data gravity, latency ladder, the 250 MB/s estimate, the focus law, storage supply, columnar format, drift types, the K-S test, the shift vote, data debt, and the debugging comparisons. Added: evaluation streams against hard negatives (with a predict), synthetic data, the running-out-of-human-data figure as its own optional frame, the two kinds of label error (as a vote), forced alignment (MSWC), the quiet-batch predict, data contracts, the dead-letter queue and circuit breaker, normalization leakage, the dedup predict, the KWS gain step for skew, and the release table. Kappa is now CORE. The fallacy 'production logs show where it fails' moved to Part 2; 'preprocessing can be finished once' replaced it. Notes total 71.5 minutes."
  - "2026-10-17: these images in images/ are no longer used by this deck (Part 2 regenerates its own copies): latency_ladder_step1-4, storage_supply_step1-2, format_bytes_step1-2, drift_step1-3, ks_cdf_step1-3 (SVG and PDF), nvme-ssd-1tb.jpg, open-hard-drive.jpg, and nvme-ssd.jpg (already unused). They were not deleted."
