chapter: 04_data_engineering
lecture: 4
title: Data Engineering
layer: data
minutes: 75
notes_minutes: 72
target_ideas: 30
thesis: "Training data is the program of an ML system, so it needs the discipline of code: requirements, review, tests, versioning, and monitoring."
hook:
  minutes: "0-4"
  setup: "War Story 4.1: in March 2016 Microsoft's Tay chatbot learned from public replies and was suspended 16 hours after launch. Nobody changed its code; its users changed its data."
  question_to_class: "Who wrote the program that Tay ran on its last day?"
  payoff: "The users did, through the data. The closing synthesis redraws Tay's path beside the keyword-spotting pipeline, whose every stage is a boundary Tay lacked."
  sources: ["chapter War Story 4.1 (Lee 2016)", "chapter §4.1"]
second_hook:
  minutes: "11-15"
  setup: "A wake-word detector checks one window per second, 2,592,000 windows a month. Predict the false wakes at 99.9 percent rejection."
  payoff: "2,592 a month; even 99.999 percent gives 26. One false wake a month needs 99.99996 percent rejection (FPR 3.9e-7)."
  sources: ["chapter Napkin Math 4.1 and its margin figure"]
driving_question: "How do we engineer the data an ML system learns from with the discipline we give its code?"
running_example: "Keyword spotting (KWS) on a smart speaker: 98 percent detection, below 1 false wake a month, 256 KB model, 16 KB preprocessing state, $150K data budget (illustrative scenario, chapter §4.3). ResNet-50 on one A100 carries the throughput half: 3,200 img/s sustained, 150 KB JPEGs."
recall: "Lecture 3: name the lifecycle stage that hands a versioned dataset to model development, and one decision made there that later stages inherit."

concept_questions:
  - q: "Why does training data behave like source code?"
    picture: "Two parallel paths: code -> compiler -> program; data + training code -> training -> model. Tay as the case."
    numbers: "Tay suspended after 16 hours (War Story 4.1)."
    example: "Tay; a changed label set changes the model with no code diff."
    read: "§4.1"
  - q: "Why is overall accuracy the wrong target for an always-on detector?"
    picture: "Log-scale bars of monthly false wakes against a 1-per-month line (build)."
    numbers: "2,592,000 windows/month; 2,592 at 99.9%; 259 at 99.99%; 26 at 99.999%; needed FPR 3.9e-7 (Napkin Math 4.1)."
    example: "KWS smart speaker."
    read: "§4.3"
  - q: "What does a fixed data budget buy?"
    picture: "Given card and line-by-line calculation."
    numbers: "$150K; 60% labeling = $90K; $0.10/label + 20% review = $0.12; 750K labels (Napkin Math 4.2)."
    example: "KWS design: 13 MFCCs, local inference, noisy slice, synthetic augmentation."
    read: "§4.3.1"
  - q: "How much listening proves one false wake a month?"
    picture: "Bars: 720 h in a month against 2,160 h needed."
    numbers: "Rule of three: 95% upper bound 3/T with zero events; 2,160 h, about 248 GB at 16 kHz (§4.11)."
    example: "KWS evaluation streams kept separate from training."
    read: "§4.11"
  - q: "What does a label cost, and why does granularity matter?"
    picture: "Log bars: class label 1, ten boxes 40 entries, one 1920x1080 mask about 2.1 million."
    numbers: "About 35 s per box (Papadopoulos et al. 2017); more than 1.5 h per Cityscapes image (Cordts et al. 2016); 51,840x entries (§4.6.1)."
    example: "KWS label is one class index per clip."
    read: "§4.6.1"
  - q: "Why do labels dominate data cost?"
    picture: "Log bars: $100K labeling against a $20 to $40 training run."
    numbers: "2,498x to 4,995x; 2 to 4 weeks against 1.3 h (§4.6.2, tables 3 and 4)."
    example: "Labeling one million images, training ResNet-50 on 8 A100s."
    read: "§4.6.2"
  - q: "How wrong are the labels we benchmark against?"
    picture: "Book figure: share of test labels found wrong in ten datasets (Northcutt et al. 2021)."
    numbers: "ImageNet val 5.83%; CIFAR-100 5.85%; QuickDraw 10.12%; AudioSet 1.35%; MNIST 0.15%."
    example: "Black stork labeled white stork."
    read: "§4.6.3"
  - q: "How do we measure label quality without knowing the truth?"
    picture: "Cohen's kappa, terms revealed; agreement over time."
    numbers: "Two annotators at 90% 'not spam' agree 82% by chance; KWS campaign kappa 0.85 -> 0.72 (§4.6.3, §4.6.4)."
    example: "New annotators accept near-homophones such as 'Alexis'."
    read: "§4.6.3 to §4.6.4"
  - q: "What is data gravity?"
    picture: "Worked example: 1 PB across 100 Gb/s."
    numbers: "80,000 s, about 22 h; $20,000 egress at $0.02/GB (Napkin Math 4.7)."
    example: "Train in US West on data in US East."
    read: "§4.9.1"
  - q: "Which storage tier can answer within a millisecond?"
    picture: "Log latency ladder against a 1 ms line."
    numbers: "DRAM 100 ns, local NVMe 100 us, remote SSD 2 ms, object store 20 ms (§4.10 margin figure)."
    example: "Feature lookup for a serving request."
    read: "§4.10"
  - q: "What is the feeding problem?"
    picture: "Given card and calculation; then bandwidth bars of storage options against the sustained and ceiling demand."
    numbers: "312 TFLOP/s / 24.6 GFLOP = 12,682 img/s ceiling; 3,200 img/s x 150 KB = 480 MB/s; 250 MB/s supply -> 48% loss; decoded 602 KB -> 1.9 GB/s -> 87% loss; SATA 500 MB/s -> 3,333 img/s (§4.9.3, Napkin Math 4.8)."
    example: "ResNet-50 on one A100."
    read: "§4.9.3, §4.10.3"
  - q: "How do file formats change the bytes we move?"
    picture: "Bars of bytes read, row against columnar."
    numbers: "20 of 100 columns: 5x effective bandwidth (Napkin Math 4.9); Snappy 500 MB/s against gzip 120 MB/s decode."
    example: "Fraud features in Parquet; images in shards."
    read: "§4.10.5"
  - q: "How does evaluation leak, and how do splits stop it?"
    picture: "Split by file against split by hash of speaker key (build)."
    numbers: "None; the rule (§4.1, §4.8 table 5)."
    example: "One speaker's repeated takes in train and test."
    read: "§4.1, §4.8"
  - q: "What is training-serving skew, and how is it different from drift?"
    picture: "Two paths normalizing the same clip: per-batch statistics against saved training statistics (build)."
    numbers: "None; the definition (§4.7.1)."
    example: "Per-clip gain normalization a streaming device cannot reproduce."
    read: "§4.7.1"
  - q: "What are the three kinds of drift, and how do we detect each?"
    picture: "Three panels: p(x), p(y), p(y|x), each with an example and a detector (build)."
    numbers: "PSI bands below 0.1, 0.1 to 0.25, above 0.25 (§4.12.1)."
    example: "New microphone (covariate), flu season (label), fraud tactics (concept)."
    read: "§4.12.1"
  - q: "How does the K-S test flag drift in one feature?"
    picture: "Two empirical CDFs of clip loudness, D marked (illustrative)."
    numbers: "n = 1,000 each; critical value 0.061; observed D = 0.08 -> flag (Napkin Math 4.5)."
    example: "Phone app update halves microphone gain."
    read: "§4.5.3"
  - q: "Why do data pipelines decay without anyone touching them?"
    picture: "Book figure: data cascades; then the ZIP-code diagnosis; then debt categories with thresholds."
    numbers: "Debt thresholds: label error > 1% warning, > 5% critical; PSI > 0.1 / > 0.25; 90 / 365 days since retraining (table 9)."
    example: "Pipeline jungle (Example 4.1); the six-month KWS regression (§4.12)."
    read: "§4.2, §4.12"

worked_examples:
  - name: "Napkin Math 4.1 and §4.11: false-wake budget to listening hours"
    steps: ["2,592,000 one-second windows a month", "99.9% rejection -> 2,592 false wakes; 99.999% -> 26", "1 per month needs FPR 3.9e-7", "rule of three: 2,160 h of non-keyword audio, about 248 GB", "the target sets a data requirement no training set replaces"]
  - name: "Napkin Math 4.2: allocating the KWS data budget"
    steps: ["$150K, 256 KB model, 16 KB preprocessing, 6 months", "60% to labeling: $90K", "$0.10/label + 20% review = $0.12", "750K labels", "below the 1M anchor; acceptance, not the table, decides"]
  - name: "§4.9.3 and Napkin Math 4.8: feeding ResNet-50"
    steps: ["3,200 img/s sustained x 150 KB = 480 MB/s", "attached volume supplies 250 MB/s", "250/480 = 0.52 -> 48% of the training rate lost", "decoded FP32 tensors: 602 KB -> 1.9 GB/s -> 87% lost", "SATA 500 MB/s -> 3,333 img/s: enough today, 26% of the ceiling"]
  - name: "Napkin Math 4.5: the K-S test"
    steps: ["empirical CDFs of loudness, training and recent", "D = largest vertical gap = 0.08", "critical value 1.36 sqrt(2000/10^6) = 0.061", "0.08 > 0.061: flag", "a flag starts an investigation, not a retrain"]

active_learning:
  - at_minute: 3
    type: predict
    prompt: "Tay changed its behavior with no code change. Who wrote its last program?"
    answer: "Its users, through the data it learned from."
  - at_minute: 11
    type: predict
    prompt: "At 99.9% per-window rejection, how many false wakes a month? A) 3 B) 26 C) 2,600 D) 26,000"
    answer: "C: 2,592. Accuracy that sounds high is far from the target."
  - at_minute: 15
    type: estimate
    prompt: "$150K budget, 60% to labeling, $0.10/label plus 20% review. How many labels?"
    answer: "$90K / $0.12 = 750K labels."
  - at_minute: 29
    type: predict
    prompt: "Can active learning reach 95% on a 10M-image pool with $50K, $0.50/label, $0.01/image scoring?"
    answer: "Not as stated: scoring all 10M costs $100K before any label. Narrow to 500K candidates ($5K) and buy about 90K labels; whether that suffices must be measured."
  - at_minute: 37
    type: estimate
    prompt: "ResNet-50 at 3,200 img/s, 150 KB per JPEG, storage at 250 MB/s. What fraction of the training rate survives?"
    answer: "Need 480 MB/s; 250/480 = 52% survives; 48% lost."
  - at_minute: 54
    type: concept_question
    prompt: "Classify three shifts: new microphone; flu-season prevalence; fraudsters adapt."
    answer: "Covariate, label, concept. Only concept drift needs labels to detect."
  - at_minute: 59
    type: diagnose
    prompt: "A credit model rejects every applicant from one region after a database migration. Find the cause."
    answer: "ZIP code retyped to integer, '02139' became '2139', an unseen category mapped to high risk (Example 4.1). Fix: a data contract at ingestion."
  - at_minute: 64
    type: concept_question
    prompt: "True or false: more data always helps; logs show where the model fails; shared preprocessing code guarantees consistency."
    answer: "All false (§4.13)."

open_questions:
  - "Synthetic speech is ten times cheaper per example in the scenario. How much of a wake-word corpus would you let it be, and what evidence would change your mind?"
  - "A model that learns from its own users (Tay, recommendation clicks) gets fresh data and an attack surface at once. Where would you put the boundary?"
  - "Public human text may run short around 2028 at current growth (Villalobos et al. 2024). Which part of data engineering becomes the bottleneck then?"

more_examples:
  - "Tay chatbot, 2016 (Lee 2016, War Story 4.1)."
  - "Multilingual Spoken Words Corpus: 23.4M clips, 340,000 keywords, 50 languages, labeled by forced alignment; about 65,000 h or 32.5 person-years by hand (§4.6.6)."
  - "Pervasive label errors in ten benchmark test sets (Northcutt et al. 2021)."
  - "1914 Cleveland 'traffic light' scraped image (§4.4.3)."
  - "Data stalls dominate training time in nine vision and audio models (Mohan et al. 2021)."
  - "FFCV trains ResNet-50 on ImageNet to 75% in about 20 minutes on one machine by redesigning format and loader (Leclerc et al. 2023)."
  - "Pipeline jungle ZIP-code failure (Example 4.1, after Sculley et al. 2015)."
  - "Storage price per TB fell about 10 orders of magnitude since 1956 while the tier gaps stayed (Our World in Data, figure 16)."

segments:
  - name: "Data as Code"
    divider: "Why does training data behave like source code?"
    read: "§4.1"
    questions: [1]
    minutes: 9.5
  - name: "Data Budget"
    divider: "How does a product target become a data requirement?"
    read: "§4.3 and §4.11"
    questions: [2, 3, 4]
    land: "The target sets the data; the data budget is arithmetic, not a wish."
    minutes: 11.5
  - name: "Labels"
    divider: "What does a label cost, and how wrong is it?"
    read: "§4.6"
    questions: [5, 6, 7, 8]
    land: "Labels are the specification, and every wrong label is paid for twice."
    minutes: 11.5
  - name: "Physics"
    divider: "Can the data reach the accelerator fast enough?"
    read: "§4.9 and §4.10"
    questions: [9, 10, 11, 12]
    focus: "Throughput <= min(compute rate, data supply rate); supply = BW(1 - overhead)/bytes per sample (equations 4 and 5)."
    land: "Training runs at the slower of compute and data supply."
    minutes: 12
  - name: "Skew and Drift"
    divider: "Why does a model that passed evaluation fail later?"
    read: "§4.1, §4.7.1, §4.12.1"
    questions: [13, 14, 15, 16]
    land: "Leakage, skew, and drift all make the model see data unlike what it was judged on; only drift comes from outside."
    minutes: 12
  - name: "Pipeline Debt"
    divider: "Why do data pipelines decay when nobody touches them?"
    read: "§4.2, §4.8, §4.12"
    questions: [17]
    land: "Contracts, releases, and monitors turn silent data failures into loud ones."
    minutes: 15.5

closing:
  return_to_hook: "Tay's path went from users straight into the model. The KWS pipeline puts a boundary at every stage: a contract at ingestion, a rubric and kappa at labeling, frozen statistics at processing, a release with speaker-hash splits, a storage path sized to the accelerator, and drift monitors after launch."
  read_and_practice: ["§4.1 to §4.12", "chapter self-check questions", "Napkin Math 4.1, 4.2, 4.5, 4.8"]
  further_reading:
    - cite: "Chapter 4, Data Engineering, §4.3, §4.6, §4.9 to §4.12"
      url: "https://mlsysbook.ai"
      why: "The budget, labeling, physics, and drift arguments with every number."
    - cite: "Sambasivan et al., 'Everyone wants to do the model work, not the data work': Data Cascades in High-Stakes AI, CHI 2021"
      url: "https://doi.org/10.1145/3411764.3445518"
      why: "Interviews with practitioners on how data defects cascade."
    - cite: "Northcutt, Athalye, Mueller, Pervasive Label Errors in Test Sets Destabilize ML Benchmarks, NeurIPS 2021"
      url: "https://arxiv.org/abs/2103.14749"
      why: "The label-error data behind the Labels segment."
    - cite: "Mohan et al., Analyzing and Mitigating Data Stalls in DNN Training, VLDB 2021"
      url: "https://doi.org/10.14778/3446095.3446100"
      why: "Measured evidence that input pipelines stall training."
    - cite: "Breck et al., Data Validation for Machine Learning, SysML 2019"
      url: "https://proceedings.mlsys.org"
      why: "Validation at the ingestion boundary in production (TFDV)."
  bridge: "Lecture 5: with data in hand, what does a neural network actually compute?"

left_to_reading:
  - concept: "Batch versus streaming, ETL versus ELT (Napkin Math 4.3, 4.4)"
    why: "Cost accounting is better read than heard; one line in the synthesis notes."
  - concept: "Feature stores and point-in-time joins"
    why: "Secondary concept; KWS needs none. Mentioned in skew notes; Lecture 14 operates them."
  - concept: "Dead-letter queues, backoff, circuit breakers, idempotent transforms"
    why: "Reliability mechanisms; named in the synthesis notes, detail in §4.5.5 and §4.7.3."
  - concept: "Storage system types (database, warehouse, lake) and storage price trend"
    why: "Table and figure in §4.10.1 to §4.10.2; the latency ladder carries the idea."
  - concept: "Energy cost of data movement"
    why: "Owned by Lecture 11 (energy ladder); one line in the gravity notes."

coverage:
  primary_taught: ["Data as code practice", "Data cascades", "Labels are the specification", "Training-serving consistency", "Data leakage", "The feeding problem", "Drift statistics"]
  primary_left_to_reading: []
  secondary: ["Data budget from targets (taught)", "Validation at the ingestion boundary (taught via ZIP code and K-S)", "Dataset releases and lineage (taught via speaker-hash split and debugging)", "Storage tiers and access patterns (taught via latency ladder)", "Data debt (taught)", "Ingestion and transformation patterns (reading)", "Feature stores (reading)"]

notes_for_author:
  - "The chapter's KWS requirements and budget are an illustrative scenario; slides say so."
  - "The K-S CDF plot is illustrative (two normal curves shifted to give D = 0.08); the numbers follow Napkin Math 4.5."
  - "The debt-growth curves are illustrative (equation 7 with assumed rates); dropped from the deck for time and kept to the notes."
  - "99.99% (259 false wakes) is derived from the chapter's window count; the margin figure shows only 99.9% and 99.999%."
