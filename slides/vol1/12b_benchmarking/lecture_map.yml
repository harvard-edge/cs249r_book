closing:
  return_to_hook: "Back to the dot strip. Three questions decide it. Is the gap real? Yes: the interval, 0.2 to 1.4 percent, excludes zero. Is it the server? Not shown: host CPU and software changed too. Is it worth acting on? No: below a 2 percent threshold, and one of Dell's five runs never reached the quality target. The H200 row changes one thing and is 9.3 percent faster, interval 8.7 to 9.9. With Part 1's four conditions, a benchmark claim now states six: load and statistic, boundary, scenario, power and heat, noise, and the quality held."
  read_and_practice: ["§12.8.1 to §12.8.4, §12.9.1 to §12.9.3, §12.10, §12.11 (table 21)", "self-check questions for §12.8 and §12.9", "Napkin Math 12.5 by hand; recompute this lecture's interval from the ten logged run times (mlcommons/training_results_v4.0)", "train a small CIFAR-10 model with five seeds; report the mean, the spread, and ECE before and after temperature scaling"]
  further_reading:
    - cite: "Benchmarking, §12.8 and §12.9"
      url: "https://mlsysbook.ai"
      why: "Repeated runs, paired tests, intervals with a minimum useful reduction, Goodhart's law, calibration, and the acceptance gates, with every number."
    - cite: "MLCommons, MLPerf Training rules (benchmark results and run counts) and Inference rules (minimum query counts, early stopping)"
      url: "https://github.com/mlcommons/training_policies"
      why: "How a community benchmark turns noisy runs into one comparable score."
    - cite: "Guo, Pleiss, Sun, Weinberger, On Calibration of Modern Neural Networks, ICML 2017"
      url: "https://arxiv.org/abs/1706.04599"
      why: "Reliability diagrams, ECE, and why temperature scaling works; short and readable."
    - cite: "Koh et al., WILDS: A Benchmark of in-the-Wild Distribution Shifts, ICML 2021"
      url: "https://arxiv.org/abs/2012.07421"
      why: "The camera-trap and hospital shifts measured; how an evaluation set can stop representing deployment."
    - cite: "Henderson et al., Deep Reinforcement Learning That Matters, AAAI 2018"
      url: "https://doi.org/10.1609/aaai.v32i1.11694"
      why: "A careful demonstration that seeds and implementations can reverse a published comparison."
    - cite: "Zhang et al., A Careful Examination of Large Language Model Performance on Grade School Arithmetic, NeurIPS 2024"
      url: "https://arxiv.org/abs/2405.00332"
      why: "Building a fresh test set to measure how much a benchmark score reflects memorization."
  bridge: "Lecture 13: the model passed its gates in the lab. What changes when real users send requests?"

