closing:
  return_to_hook: "Back to the 75x. Read the ladder rung by rung with today's segments: coalesced loads are a layout choice (6.4x, segment 3), shared-memory caching is explicit tile staging (segment 2), 1D and 2D block tiles raise the tile edge and with it the reuse per byte (2.8x and 1.9x, segment 2), autotuning searches tile sizes (segment 3), and warp tiles add one more tier of the same idea. The same multiply on the same chip: every rung changed where operands live. Then the H100: the stage-3 conv's 563 FLOP/byte becomes a reachable ceiling only with tiles that fit, shapes that fill them, and activations that stay INT8 and on chip."
