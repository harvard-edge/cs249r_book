notes_for_author:
  - "2026-10-19, panel fixes. Goals slide carries the course-thread strip with the fast-enough half and the machine factor filled (H1). Every note now carries [CORE] or [OPTIONAL]; five frames moved to [OPTIONAL] (the tier-power predict, the 100-camera feed, the batch-1 ResNet-50 roofline example, the phone throttling screens, Hey Siri) and the open questions, so the core runs about 51 minutes (M1); the title note says so. Hybrid partitioning: the pattern-1 label reads 'train in the cloud, serve on every tier' and no longer uses Lecture 8's bytes per parameter; the frame already built one pattern per step (steps 1 to 3, all three on step 4), so only the label changed (L11). Doorbell credit now names both derived shares, 50.5 and 202 percent; step 1 does show 50.5 percent."
  - "The decode intensity of about 1 FLOP/byte is not in this chapter; it is sourced to Model Serving §13.9, as in Lecture 0."
  - "Hybrid upload of about 37 GB/s is derived from the chapter's 32 TB/s and its 860x reduction; labeled as derived on the slide."
  - "The batching arrow assumes weights dominate traffic (B FLOP/byte at batch B); the notes warn that KV-cache and activation traffic move the real crossover."
  - "2026-10-17 (review round 1): cover replaced with the chapter's unlabeled blueprint; hybrid patterns became a CORE four-step build (3 min); workload archetypes became a CORE diagnose activity with a regime row; the drone slide shows the data locality invariant (Definition 2.3); the energy plot reconciles 0.1 mJ (NPU) with 2.6 mJ (whole phone); the doorbell scorecard and the column rooflines were redrawn at display size; the screening gates gained gate 0 and the no-survivor exit; the third true-or-false item became the 5G fallacy. Time paid for by trimming the round-trip, arm, camera, focus, trends, voice, and silicon-contract notes; memory wall and trends are now OPTIONAL."
  - "2026-10-19 (visual and technical pass): real data replaces illustrative curves. Light in fiber now shows the fiber floor beside measured AWS median round trips (cloudping.co, retrieved 2026-10-18), merging the old two-bar plot. The memory wall is redrawn from Gholami et al. 2024 Fig. 1, markers digitized from the paper's vector figure (refit 3.02x, 1.59x, 1.41x per two years, matching the paper). New CORE frame after the decode predict: the 2015 TPU roofline with six measured production apps (Jouppi et al. 2017), 90 percent of deployed TPUs memory-bound. The thermal slide shows GSMArena's 3DMark Wild Life Stress Test screens (70.4 percent stability) in place of the illustrative trace. The energy plot gains a measured MLPerf Tiny KWS row (31.5 uJ). New CORE frame after the voice upload: Apple's two-pass Hey Siri detector (2017, fig. 5). Silicon contract fixed: the cloud row is now one TPU v4 chip (275 TFLOP/s BF16, 1,200 GB/s, 32 GiB) with the TPU v4 board photo; n/a replaces the em dash. Fiber cable photo on the camera slide. Concept names on slides (workload archetype, physical walls and deployment tiers, hybrid partitioning). All derived numbers now in images/calcs.py; corrections: 39x became about 38x (100/2.6 = 38.5), 7 percent became 6.5 percent, 51 percent became 50.5 percent. Time paid by trimming the objectives, round-trip, drone, roofline, decode, gates, hybrid, trends, doorbell, and energy notes; notes stay at 71.5 minutes."
