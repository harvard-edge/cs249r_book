chapter: 02_system_paradigms
lecture: 2
title: System Paradigms
minutes: 75
notes_minutes: 71.5
target_ideas: 28
thesis: "Distance, memory bandwidth, power, and the cost of moving data decide where a model can run, and each sets one of four deployment regimes with a different binding constraint."
hook:
  minutes: "0-4"
  setup: "Photo of robot arms on a car body line. A safety monitor must stop an arm within 10 ms of seeing a person; its model runs in a cloud region 1,500 km away."
  question_to_class: "Will the arm stop in time? A: yes, B: no, C: it depends on how fast the cloud GPU is."
  payoff: "Segment 2 answers it: the round trip in fiber alone is 15 ms, so B, and no GPU can help (C is the misconception the lecture exists to remove). The synthesis returns to the arm with the full placement decision."
  sources: ["chapter §2.5, Napkin Math 2.2 (the distance penalty)", "photo: BMW Werk Leipzig, Wikimedia Commons"]
driving_question: "Why does the same model need different engineering on a phone and in a datacenter?"
running_example: "The robot-arm safety monitor (10 ms budget, 1,500 km to the cloud), revisited in the synthesis; the five lighthouse models placed on their tiers."
recall: "Lecture 1: write the iron law's three terms, T = D_vol/BW + O/(R_peak eta) + L_lat."

segments:
  - name: Four Regimes
    divider_question: "Why does ML run on four kinds of machine?"
    read: "§2.1 and §2.4"
    concept_questions: [1, 2, 3]
    land: "Each tier offers a different contract: compute, bandwidth, memory, and power."
  - name: Distance
    divider_question: "What does it cost to move a request or its data?"
    read: "§2.2, §2.5, and §2.6"
    concept_questions: [4, 5, 6]
    land: "When distance or data volume breaks the deadline, computation moves to the data."
  - name: Memory
    divider_question: "Why do fast processors sit idle waiting for bytes?"
    read: "§2.2, §2.3, and §2.4"
    concept_questions: [7, 8, 9, 10]
    land: "Arithmetic intensity against the ridge point says which resource limits a workload; batch 1 sits on the memory slope."
  - name: Power
    divider_question: "Why can a phone not run what a server runs, all day?"
    read: "§2.2, §2.7, and §2.8"
    concept_questions: [11, 12, 13]
    land: "On battery-powered devices, energy per inference and the heat ceiling decide what can run."
  - name: Choosing
    divider_question: "How do we pick a tier, and when do we use several?"
    read: "§2.9, §2.10, and §2.12"
    concept_questions: [14, 15]
    land: "Screen for feasibility first, compare cost among survivors, and split the pipeline when no single tier works."

concept_questions:
  - id: 1
    q: "What are the four deployment regimes?"
    picture: "Four photos: a Google datacenter aisle (book figure 5), a Jetson AGX Orin edge box, a phone, an ESP32-S3 board"
    numbers: "Power: cloud 3 MW, edge 200 W, mobile 5 W, TinyML 1 mW (§2.1); memory from 128 TB to 512 KB (table 4)"
    example: "The same image-classification task on each tier"
    read: "§2.1"
  - id: 2
    q: "How wide is the range between the tiers?"
    picture: "Power ladder, log scale, built one tier per step, with each tier's memory on its bar"
    numbers: "Nine orders of magnitude in power; memory 128 TB (TPU v4 pod) to 512 KB SRAM, a 250-million-fold drop (§2.4.2)"
    example: "Lecture 0 showed this ladder as a teaser; here each bar gets its cause"
    read: "§2.1, §2.4.2"
  - id: 3
    q: "What does each tier's hardware offer a model (the silicon contract)?"
    picture: "Table: compute, memory bandwidth, memory per tier; then the iron law with each term labeled by the physical wall that sets it (focus slide)"
    numbers: "TPU v4 chip 275 TFLOP/s BF16, 1,200 GB/s, 32 GiB (Jouppi et al. 2023); pod of 4,096 chips 1.126 EFLOP/s and 128 TiB (calcs.py); DGX Spark about 1 PFLOP/s sparse FP4, over 270 GB/s, 128 GB; phone 15-45 TOPS, 51.2-77 GB/s, 8-16 GB; ESP32-S3 under 1 TOPS, 512 KB SRAM (table 4)"
    example: "Capacity and energy are preconditions: a model that does not fit never starts"
    read: "§2.1, §2.4.1"
  - id: 4
    q: "How far can a signal travel in 10 milliseconds?"
    picture: "Fiber-floor bars against a 10 ms budget line, then measured AWS median round trips from us-east-1 (cloudping.co)"
    numbers: "Light in fiber about 200,000 km/s; 1,500 km gives 15 ms (Napkin Math 2.2); measured medians from N. Virginia: Ohio 13.4 ms (floor 4.8), Oregon 68.1 (35.0), Ireland 68.1 (54.6), Tokyo 148.3 (108.7) (cloudping.co, 2026-10-18; calcs.py)"
    example: "Robot-arm safety monitor (the hook)"
    read: "§2.2, §2.5"
  - id: 5
    q: "Can we ship the raw data to the cloud instead?"
    picture: "Log bars: raw video, the factory link, defect metadata"
    numbers: "100 cameras at 1080p, 30 FPS: 186.6 MB/s each, 18.7 GB/s total, against a 10 Gb/s (1.25 GB/s) link: 14.9 times short; metadata cuts it about 933,120 times (Napkin Math 2.4)"
    example: "Factory quality control"
    read: "§2.6"
  - id: 6
    q: "When must computation move to the data (the data locality invariant)?"
    picture: "Exercise card; worked answer"
    numbers: "4K frame 24.9 MB over 100 Mb/s: 1,990.7 ms, plus 110 ms remote, against a 16.7 ms frame deadline (Napkin Math 2.6)"
    example: "Drone obstacle avoidance; data gravity as the dataset-scale version"
    read: "§2.5.1, §2.6.1"
  - id: 7
    q: "Why do processors wait for memory (the memory wall)?"
    picture: "Published chips: peak FLOP/s against DRAM and interconnect bandwidth, 1996 to 2022, redrawn from Gholami et al. 2024, Fig. 1"
    numbers: "Peak FLOP/s 3.0x every two years (about 60,000x in 20 years), DRAM bandwidth 1.6x (100x), interconnect 1.4x (30x) (Gholami et al. 2024; refit in calcs.py); the chapter's illustrative 1.6x and 1.2x per year in the notes"
    example: "Matrix units idle while weights trickle in from DRAM"
    read: "§2.2"
  - id: 8
    q: "What is arithmetic intensity, and what is the ridge point?"
    picture: "The A100 roofline built in three steps: memory slope, compute ceiling, ridge"
    numbers: "312 TFLOP/s FP16, 2.04 TB/s, ridge 312/2.04 = 153 FLOP/byte (Napkin Math 2.1)"
    example: "First appearance of the roofline in the book; Lecture 11 develops it"
    read: "§2.4.2"
  - id: 9
    q: "Why does single-image inference sit on the memory slope?"
    picture: "ResNet-50 point at 146 FLOP/byte, just left of the ridge; mobile NPU numbers"
    numbers: "8.2 GFLOP, 56.3 MB moved: 0.026 ms compute, 0.028 ms memory; mobile NPU 35 TOPS, 51.2 GB/s: 0.23 ms against 0.55 ms (Napkin Math 2.1)"
    example: "ResNet-50 on an A100 and on a flagship phone NPU"
    read: "§2.4.2"
  - id: 10
    q: "Why does batch-1 text generation sit low on the memory slope, and what moves it?"
    picture: "Decode point at about 1 FLOP/byte; a 2x compute ceiling leaves it unchanged; batching moves it right"
    numbers: "About 2 operations per 2-byte weight, about 1 FLOP/byte (Model Serving §13.9, as in Lecture 0); batch B reuses each weight B times"
    example: "GPT-2 / Llama decode"
    read: "§2.3.2, §2.4.2"
  - id: 11
    q: "What binds each lighthouse model?"
    picture: "Diagnose activity: table with the Bound by column hidden, then revealed; a sixth row adds ResNet-50 at batch 1 (bandwidth) to show the archetype is a regime"
    numbers: "ResNet-50 8.2 GFLOP; GPT-2 1.5B, Llama 7B-70B parameters; DLRM over 100 GB tables; MobileNetV2 13.7x fewer FLOPs; KWS about 200 KB INT8 (§2.3.2)"
    example: "Archetypes are regimes, not model properties"
    read: "§2.3.2"
  - id: 12
    q: "Why did clock speeds stop rising (the power wall)?"
    picture: "Book figure 2, microprocessor trends (Rupp data), with P proportional to f cubed"
    numbers: "Doubling clock costs about 8x dynamic power when V scales with f; mid-2000s to early 2020s: transistors about 190x, clock near 4.7 GHz, single-thread 5x against 21x the decade before (§2.2)"
    example: "Why GPUs and TPUs exist"
    read: "§2.2"
  - id: 13
    q: "Why can a phone not run a heavy model all day?"
    picture: "3DMark Wild Life Stress Test result screens on an iPhone 15 Pro Max (GSMArena review); battery-tax exercise"
    numbers: "3DMark: best loop 10,012, lowest 7,045, 70.4 percent stability; 12 W model on a 3 W chassis: about 1 C/s, 80 C trip within 60 s, 100 to 30 FPS (Napkin Math 2.9); 2 W on 15 Wh lasts 7.5 h, 320 percent of a day's budget (Napkin Math 2.8)"
    example: "Background object detector on a phone"
    read: "§2.7"
  - id: 14
    q: "Where does the energy per inference go, and what decides first on a microcontroller?"
    picture: "Energy per inference redrawn from book figure 7 (10 uJ to 1 kJ), with a second step adding the 100 mJ cost of sending 1 MB and the NPU-alone tick; ESP32-S3 photo with the doorbell scorecard redrawn as two steps (200 ms chime passes at 51 percent, 50 ms chime fails at 202 percent)"
    numbers: "Sending 1 MB about 100 mJ against 0.1 mJ NPU inference (1,000x; about 38x with whole-phone energy); MLPerf Tiny v1.2 KWS measured 31.5 uJ on Syntiant NDP9120 (Napkin Math 2.5); ESP32-S3 512 KB SRAM, 4.2 MB flash; doorbell weights 11.9 percent of flash, latency 50.5 percent of a 200 ms budget and 202 percent of a 50 ms budget (§2.3.2)"
    example: "Keyword spotting; smart doorbell"
    read: "§2.6, §2.8"
  - id: 15
    q: "How do we choose a tier, and when do we combine tiers?"
    picture: "Screening gates after book figure 11, with gate 0 (does ML beat a simple rule?) and the no-survivor exit; voice-assistant bandwidth bars; book figure 12 as a four-step build that highlights the train-serve split, hierarchical processing, and progressive deployment in turn"
    numbers: "Braking at 100 km/h covers 2.8 m in 100 ms (Example 2.1); 1B devices streaming 32 KB/s = 32 TB/s, about $500M/year; residual 20B queries/day x 200 ms = 1.1M GPU-hours/day, 4.6 datacenters average, 20.8 at peak (Napkin Math 2.10)"
    example: "Voice assistant: wake word on TinyML, speech on the phone, language in the cloud"
    read: "§2.9, §2.10"

worked_examples:
  - name: "Napkin Math 2.2: The distance penalty"
    steps: ["Given: 10 ms budget, 1,500 km, 200,000 km/s in fiber", "Round trip 2 x 1,500 / 200,000 = 15 ms", "15 ms > 10 ms before any compute", "No remote GPU can help; move the model beside the arm, then check the local path"]
  - name: "Napkin Math 2.4: The bandwidth bottleneck"
    steps: ["Given: 100 cameras, 1080p, 30 FPS, 3 bytes per pixel", "186.6 MB/s per camera, 18.7 GB/s total", "10 Gb/s link carries 1.25 GB/s: 14.9x short", "Send defect metadata (about 20 KB/s) instead"]
  - name: "Napkin Math 2.1: ResNet-50 at batch 1 on an A100"
    steps: ["Given: 8.2 GFLOP, 56.3 MB moved, 312 TFLOP/s, 2.04 TB/s", "Compute 0.026 ms; memory 0.028 ms", "Intensity 146 FLOP/byte against ridge 153: bandwidth-bound", "Batching reuses weights and moves it right; byte reduction beats more FLOP/s"]
  - name: "Napkin Math 2.10: The voice assistant wall"
    steps: ["Given: 1B devices, 20 queries/day, 32 KB/s audio", "Cloud-side detection: 32 TB/s, about $500M/year", "On-device wake word cuts upload about 860x", "Residual: 1.1M GPU-hours/day, 4.6 datacenters average, 20.8 at peak"]

active_learning:
  - at_minute: 1
    type: predict
    prompt: "Will the arm stop in time? A yes, B no, C depends on the cloud GPU."
    answer: "B. Propagation alone is 15 ms. Revealed in segment 2."
  - at_minute: 4
    type: retrieval
    prompt: "Write the iron law's three terms from Lecture 1."
    answer: "D_vol/BW + O/(R_peak eta_hw) + L_lat."
  - at_minute: 9
    type: predict
    prompt: "Guess the power in watts of a datacenter pod, an edge box, a phone, and a microcontroller."
    answer: "About 3 MW, 200 W, 5 W, 1 mW: nine orders of magnitude."
  - at_minute: 22
    type: estimate
    prompt: "A drone sends each 4K frame (24.9 MB) over a 100 Mb/s uplink; remote round trip and compute 110 ms; deadline 16.7 ms. Can it offload?"
    answer: "Transmission 1,990.7 ms; lower bound 2,100.7 ms, about 126 times the deadline. No."
  - at_minute: 33
    type: predict
    prompt: "A new chip doubles peak FLOP/s with the same memory bandwidth. How much faster is batch-1 text generation?"
    answer: "Almost no faster. At about 1 FLOP/byte the workload is on the memory slope; only bandwidth or fewer bytes help."
  - at_minute: 38
    type: diagnose
    prompt: "Name the resource that binds each lighthouse workload (compute, bandwidth, capacity, or power) from the Why column."
    answer: "Compute, bandwidth, capacity, compute (efficient), power; ResNet-50 at batch 1 moves to bandwidth: the archetype is a regime."
  - at_minute: 45
    type: estimate
    prompt: "A 2 W always-on detector on a 15 Wh phone battery. How long does the battery last, and what share of a 24 h day's energy does it need?"
    answer: "7.5 h; 320 percent."
  - at_minute: 55
    type: discuss
    prompt: "Place each stage of a voice assistant on a tier: wake word, speech to text, language understanding."
    answer: "Wake word on TinyML (always on, milliwatts), speech on the phone (privacy, offline), language in the cloud (large model)."
  - at_minute: 64
    type: concept_question
    prompt: "True or false: (1) a 10x faster model makes a 200 ms camera pipeline 10x faster; (2) quantizing to INT8 lets a 12 W model run all day on a 3 W phone; (3) faster 5G links let a 10 ms control loop use a cloud 1,500 km away."
    answer: "All false. (1) 200 to 146 ms, 1.37x (Amdahl). (2) Quantization does not cut power in proportion; the 3 W ceiling holds. (3) 5G raises bandwidth, not propagation: 15 ms round trip (§2.6.1)."

open_questions:
  - "As phones gain larger NPUs and memory, which workloads will leave the cloud, and which never can?"
  - "Who should decide where a model runs: the ML engineer, the hardware team, or the privacy lawyer?"
  - "If network round trips cannot shrink below physics, what new hybrid patterns will large models need?"

