closing:
  return_to_hook: "The arm: the cloud path fails the latency gate (15 ms > 10 ms); an edge box beside the arm removes propagation; train in the cloud, serve at the edge (train-serve split)."
  read_and_practice: ["§2.1 to §2.10 and §2.12", "the chapter's self-check questions", "Napkin Math 2.1, 2.4, 2.8, 2.10 by hand"]
  further_reading:
    - cite: "System Paradigms, §2.2 (physical constraints) and §2.9 (choosing a paradigm)"
      why: "The light barrier, power wall, and memory wall, and the screening gates."
    - cite: "Williams, Waterman, Patterson, Roofline: An Insightful Visual Performance Model, CACM 2009"
      url: "https://doi.org/10.1145/1498765.1498785"
      why: "The original roofline paper; short and readable."
    - cite: "Wulf and McKee, Hitting the Memory Wall: Implications of the Obvious, 1995"
      url: "https://doi.org/10.1145/216585.216588"
      why: "Two pages that named the memory wall."
    - cite: "Hennessy and Patterson, A New Golden Age for Computer Architecture, CACM 2019"
      url: "https://doi.org/10.1145/3282307"
      why: "Why the end of Dennard scaling led to domain-specific accelerators."
    - cite: "Kang et al., Neurosurgeon: Collaborative Intelligence Between the Cloud and Mobile Edge, ASPLOS 2017"
      url: "https://doi.org/10.1145/3037697.3037698"
      why: "Splitting one network between phone and cloud, layer by layer."
  bridge: "Lecture 3: Why is seeing the whole map necessary before walking any single path?"

