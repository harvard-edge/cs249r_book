<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="330" fill="white"/>
<rect x="10" y="140" width="190" height="110" rx="8" fill="#D1E6F3" stroke="#006395" stroke-width="2.5" opacity="1.0"/>
<text x="105.0" y="188" font-size="21" fill="#1A1A2E" font-weight="bold" text-anchor="middle" opacity="1.0">Local NVMe</text>
<text x="105.0" y="214" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">storage</text>
<text x="105.0" y="285" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">148 GB read</text>
<text x="105.0" y="308" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">21 s per epoch</text>
<g opacity="1.0"><line x1="204" y1="195" x2="226" y2="195" stroke="#666666" stroke-width="3"/><polygon points="236,195 224,188 224,202" fill="#666666"/></g>
<text x="105.0" y="80" font-size="17" fill="#006395" font-weight="bold" text-anchor="middle" opacity="1.0">Halves only if the</text>
<text x="105.0" y="106" font-size="17" fill="#006395" font-weight="bold" text-anchor="middle" opacity="1.0">74 GB subset is written</text>
<rect x="240" y="140" width="190" height="110" rx="8" fill="#D4EFDF" stroke="#CB202D" stroke-width="6" opacity="1.0"/>
<text x="335.0" y="188" font-size="21" fill="#1A1A2E" font-weight="bold" text-anchor="middle" opacity="1.0">Host CPUs</text>
<text x="335.0" y="214" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">decode, augment</text>
<text x="335.0" y="285" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">needs 10,100</text>
<text x="335.0" y="308" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">images/s</text>
<g opacity="1.0"><line x1="434" y1="195" x2="456" y2="195" stroke="#666666" stroke-width="3"/><polygon points="466,195 454,188 454,202" fill="#666666"/></g>
<text x="335.0" y="80" font-size="17" fill="#CB202D" font-weight="bold" text-anchor="middle" opacity="1.0">Supplies only 5,250/s:</text>
<text x="335.0" y="106" font-size="17" fill="#CB202D" font-weight="bold" text-anchor="middle" opacity="1.0">the slow stage</text>
<rect x="470" y="140" width="190" height="110" rx="8" fill="#E6D4E5" stroke="#7E317B" stroke-width="2.5" opacity="1.0"/>
<text x="565.0" y="202" font-size="21" fill="#1A1A2E" font-weight="bold" text-anchor="middle" opacity="1.0">PCIe link</text>
<text x="565.0" y="285" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">193 GB</text>
<text x="565.0" y="308" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">3 s per epoch</text>
<g opacity="1.0"><line x1="664" y1="195" x2="686" y2="195" stroke="#666666" stroke-width="3"/><polygon points="696,195 684,188 684,202" fill="#666666"/></g>
<rect x="700" y="140" width="190" height="110" rx="8" fill="#FCE4CC" stroke="#E67817" stroke-width="2.5" opacity="1.0"/>
<text x="795.0" y="188" font-size="21" fill="#1A1A2E" font-weight="bold" text-anchor="middle" opacity="1.0">H100</text>
<text x="795.0" y="214" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">accelerator</text>
<text x="795.0" y="285" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">126 s, 88 kJ</text>
<text x="795.0" y="308" font-size="17" fill="#1A1A2E" font-weight="normal" text-anchor="middle" opacity="1.0">per epoch</text>
<text x="795.0" y="80" font-size="17" fill="#E67817" font-weight="bold" text-anchor="middle" opacity="1.0">Coreset: 63 s, 44 kJ</text>
<text x="795.0" y="106" font-size="17" fill="#E67817" font-weight="bold" text-anchor="middle" opacity="1.0">scoring: 42 s, once</text>
</svg>
