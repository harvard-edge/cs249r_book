closing:
  return_to_hook: "Back to MobileNetV2. Per-tensor INT8 took it from 71.9 to 0.1 percent because one scale served channels with very different ranges; one scale per channel gave 69.8 percent with no retraining, and QAT 71.1 percent. On a Pixel 2 the same INT8 model ran in 63 ms on the CPU against 105 ms in FP32, and in 15.5 ms on the DSP, which cannot run FP32 at all: precision enabled the speed, the integer processor supplied most of it, as the chapter's blur waterfall argued. Part 1's 7B model now fits: 4-bit weights take 3.5 GB (derived), and each token moves a quarter of the weight bytes when dequantization stays in the kernel."
  read_and_practice: ["§10.3 (all), §10.4.1, §10.5.4, §10.6.2", "self-check questions at the end of §10.3", "Checkpoints 10.2 and 10.3", "Napkin Math 10.1 to 10.4 by hand; redo 10.4 for INT8 weights", "TinyTorch quantization module, if assigned"]
  further_reading:
    - cite: "Model Compression, §10.3 Numerical Precision and §10.4.1"
      url: "https://mlsysbook.ai"
      why: "Formats, energy, the affine mapping, calibration, PTQ and QAT, extreme quantization, and when fewer bits run faster, with every number."
    - cite: "Krishnamoorthi, Quantizing Deep Convolutional Networks for Efficient Inference: A Whitepaper, 2018"
      url: "https://arxiv.org/abs/1806.08342"
      why: "Per-tensor against per-channel, PTQ against QAT, 8 and 4 bits, and phone timings, measured on the same networks."
    - cite: "Jacob et al., Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference, CVPR 2018"
      url: "https://doi.org/10.1109/cvpr.2018.00286"
      why: "The scale and zero-point scheme and the integer-only layer, from the source."
    - cite: "Nagel et al., A White Paper on Neural Network Quantization, 2021"
      url: "https://arxiv.org/abs/2106.08295"
      why: "A clear outside explanation of the quantization pipeline and its standard fixes, from PTQ to QAT."
    - cite: "Dettmers et al., LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale, NeurIPS 2022"
      url: "https://arxiv.org/abs/2208.07339"
      why: "How outlier features break per-tensor INT8 in large language models, and one fix."
    - cite: "Lin et al., AWQ: Activation-aware Weight Quantization for On-Device LLM Compression and Acceleration, MLSys 2024"
      url: "https://arxiv.org/abs/2306.00978"
      why: "Weight-only 4-bit quantization for decoding, salient channels, and measured speedups."
  bridge: "Lecture 11: the same INT8 change gave ResNet-50 1.3x at batch one and 5.9x at large batch on one chip. Why does moving data cost more than computing it, and where does each layer sit?"

