chapter: 03_ml_lifecycle
lecture: 3
title: ML Lifecycle
minutes: 75
notes_minutes: 72
target_ideas: 30
thesis: "An ML system is built around a loop of six stages, and a decision made at any stage, above all at problem definition, constrains every other stage."
hook:
  minutes: "0-5"
  setup: "A fundus camera photo. Google's diabetic retinopathy model matched eye specialists on curated images (sensitivity 97.5 percent, specificity 93.4 percent, from 128,000 graded images; Gulshan et al. 2016). Google Health then deployed it in clinics in Thailand and studied the deployment for eight months across 11 clinics (Beede et al. 2020)."
  question_to_class: "What went wrong in the clinics? A: the model was less accurate on Thai patients; B: many photos could not be graded; C: uploads stalled on slow clinic internet; D: B and C."
  payoff: "D. 393 of 1,838 submitted images (21 percent) failed the image-quality check, retakes added nurse work, and slow uploads delayed screening. None of it was a model-training failure; every failure sat at a different stage of the lifecycle. The synthesis returns to the clinics and assigns each failure, and its fix, to a stage."
  sources: ["chapter §3.1.2 and footnote 5 (Beede et al. 2020: 393 of 1,838 images)", "chapter §3.7 (Gulshan et al. 2016: AUC 0.99, 97.5 / 93.4 percent, 128,000 images)", "blog.google, 'Healthcare AI systems that put people at the center' (2020): 11 clinics, eight months; protocol changed so specialists review ungradable images", "photo: Ralf Roletschek, Wikimedia Commons (FAL)"]
driving_question: "Why is seeing the whole map necessary before walking any single path?"
running_example: "The chapter's diabetic retinopathy (DR) screening scenario: rural clinics, an Orin Nano-class edge device with 4 to 8 GB shared memory of which about 500 MB is reserved for the model, a 2 Mb/s intermittent uplink, a result before the patient leaves, sensitivity above 90 percent and specificity above 80 percent."
recall: "Lecture 2: in what order do we screen deployment tiers? Privacy, latency, resources, then cost (System Paradigms §2.9.2); Lecture 2's gate 0 (does ML beat a simple rule?) returns as stage 1's baseline."

segments:
  - name: The Loop
    divider_question: "Why is the ML lifecycle a loop, not a line?"
    read: "§3.1"
    concept_questions: [1, 2, 3]
    land: "Each stage hands the next an artifact, and monitoring sends evidence back; deployment starts a phase rather than ending a project."
  - name: Propagation
    divider_question: "How does one decision reach every other stage?"
    read: "§3.2 and §3.4"
    concept_questions: [4, 5, 6, 7]
    land: "State a limit at problem definition, where it shapes the work, not at deployment, where it can only reject it."
  - name: Iteration
    divider_question: "Where do the hours go, and why does cycle time matter?"
    read: "§3.3"
    concept_questions: [8, 9]
    land: "Cycle time sets how many ideas a team can test; a fast loop buys search breadth, not guaranteed accuracy."
  - name: Define to Train
    divider_question: "How does a request become numbers a model can meet?"
    read: "§3.5 to §3.7"
    concept_questions: [10, 11, 12, 13]
    land: "Requirements are numbers in three layers, and each stage after them can destroy the evidence they need."
  - name: Validate to Monitor
    divider_question: "What must hold before release, and what changes after it?"
    read: "§3.8 to §3.11"
    concept_questions: [14, "14b", 15, 16]
    land: "Validation tests the numbers problem definition set; deployment is screened for feasibility, then cost; monitoring reopens the loop."

concept_questions:
  - id: 1
    q: "What are the six stages, and what does each hand to the next?"
    picture: "New loop diagram built in three steps: six stages in a line, the artifacts on each arrow, then the return arrow from monitoring"
    numbers: "Six stages and six artifacts: targets and limits, versioned dataset, trained weights, release manifest, running service, monitoring evidence (§3.1)"
    example: "The DR screener's stages"
    read: "§3.1"
  - id: 2
    q: "Why is an ML system a loop when ordinary software can ship and stay fixed?"
    picture: "WILDS Camelyon17 figure 4: tissue patches from five hospitals (Koh et al. 2021); chapter table 1's contrast in the notes"
    numbers: "93.2 percent in-distribution, 70.3 percent on a new hospital, 22.9 points lower, same code (WILDS table 1)"
    example: "Camera upgrade: same code, new images"
    read: "§3.1.1"
  - id: 3
    q: "What happens when a limit is found after the work is done?"
    picture: "Day-153 timeline built in three steps; then log bars of model memory against the clinic reservation, with VGG-16, ResNet-50, and MobileNetV2 weights from a real torchvision 0.28.0 parameter count shown as console output"
    numbers: "Day 90: 92 percent sensitivity; day 120: 94 percent; day 151: model needs 4 GB; reservation about 500 MB (8 times short); MobileNetV2 FP32 weights 14 MB, ResNet-50 102 MB, VGG-16 553 MB (torchvision parameter counts x 4 bytes, calcs.py) (§3.1.2, §3.4)"
    example: "The day-153 failure"
    read: "§3.1.2"
  - id: 4
    q: "What is the constraint propagation principle?"
    picture: "Focus slide"
    numbers: "None"
    example: "The 500 MB reservation"
    read: "§3.2"
  - id: 5
    q: "Which way do constraints travel?"
    picture: "Two chains: backward (2 Mb/s uplink to compression to training data with matching artifacts) and forward (capture resolution to input size to operations per inference)"
    numbers: "2 Mb/s uplink (§3.2)"
    example: "Training-serving skew from compressed uploads"
    read: "§3.2"
  - id: 6
    q: "Who owns each stage, and what crosses each boundary?"
    picture: "Excerpts of the FDA De Novo decision summary for IDx-DR (DEN180001): indications for use (one camera, one population) and the key results (87 / 90 / 96 percent) against prespecified 85.0 / 82.5 percent floors; then the loop, built in four steps, with invariant chips on the 1-2, 2-3, and 4-5 hand-offs, a blocked 1-2 hand-off, and an audit that traces a referral shift to the stage 4 contract"
    numbers: "Table 2 of the chapter"
    example: "Example 3.1: a problem definition that leaves the deployment target as TBD is blocked; Checkpoint 3.3: a referral shift for patients over seventy with no age-group result in the manifest"
    read: "§3.4, §3.4.1"
  - id: 7
    q: "How much rework does a late limit cost?"
    picture: "Artifact chips revealed as kept or redone; a Gantt bar of the four redone artifacts"
    numbers: "1 + 2 + 2 + 1 = 6 days when raw images and labels survive (Example 3.1); against five months discarded in the day-153 case"
    example: "Example 3.1, auditing stage transitions"
    read: "§3.4.1"
  - id: 8
    q: "Where do practitioners say their time goes?"
    picture: "Predict built into the chart: CrowdFlower 2016 bars with the algorithms bar hidden, then revealed (redrawn from chapter figure 4)"
    numbers: "Cleaning and organizing 60 percent, collecting 19, mining 9, other 5, refining algorithms 4, building training sets 3 (CrowdFlower 2016)"
    example: "In DR each image needs grading by several ophthalmologists"
    read: "§3.3"
  - id: 9
    q: "Why does iteration speed compound?"
    picture: "Worked example card; then the MLflow tracking UI run list from the MLflow tutorial (30 trials of 3 to 10 s)"
    numbers: "26 weekly runs; 4,368 possible hourly runs, 100 effective; 95 + 26 x 0.15 = 98.9 percent; 90 + 100 x 0.1 capped at 99 percent; 3.8 times the ideas (Napkin Math 3.1)"
    example: "Large cloud ensemble against lightweight edge model"
    read: "§3.3"
  - id: 10
    q: "How does a request become a requirement?"
    picture: "The one-sentence request and the baseline it must beat (the existing screening and referral workflow), then three constraint layers built one per step"
    numbers: "Statistical: sensitivity above 90, specificity above 80 percent across subgroups; physical: 500 MB, 7 to 15 W, seconds, offline; operational: auditability, regulation (§3.5.1)"
    example: "'Build a model that detects diabetic retinopathy'"
    read: "§3.5"
  - id: 11
    q: "Why is accuracy the wrong number for screening?"
    picture: "Vote, then a 10 x 10 patient grid: 90 healthy, 10 with disease; a model that says normal for everyone"
    numbers: "90 percent accuracy, 0 percent sensitivity (§3.5.1, §3.8.1; illustrative population)"
    example: "Sensitivity and specificity defined on the grid"
    read: "§3.5.1, §3.8.1"
  - id: 12
    q: "How does data collection fail in the field?"
    picture: "Four real EyePACS photos as graded in the EyeQ dataset (Fu et al. 2019, figure 1): good, and reject for lighting, blur, and low contrast; one large number"
    numbers: "393 of 1,838 images (21 percent) failed the quality check (Beede et al. 2020)"
    example: "Lighting, camera maintenance, dilation practice"
    read: "§3.6.1"
  - id: 13
    q: "How can model development destroy the signal before training starts?"
    picture: "A real retinopathy fundus photo; the same region at full resolution and after shrinking the image to 224 x 224"
    numbers: "224 x 224 (ImageNet default, §3.7.2); exudates measured on the photo at 8 to 12 pixels become 2 to 3 pixels (scale 224 / 857 = 0.26)"
    example: "Exudates shrink to a few input pixels"
    read: "§3.7.2"
  - id: 14
    q: "How do targets become one operating point?"
    picture: "The measured ROC curve of Gulshan et al. 2016 (figure 2A inset, EyePACS-1, with the 8 ophthalmologists and both operating points), with the two floors, the pass corner, and an illustrative clinic point drawn over it"
    numbers: "Floors 90 and 80 percent; operating points 97.5 / 93.4 and 90.3 / 98.1 percent, AUC 0.991, 8,788 photos (Gulshan et al. 2016)"
    example: "AUC does not choose a threshold"
    read: "§3.8.1"
  - id: 14b
    q: "What evidence does a release need, and where does a failed check go?"
    picture: "A release manifest card built in three steps: overall sensitivity passes, the cataract subgroup fails and routes to stage 2, then the on-device memory, latency, and calibration rows"
    numbers: "94 percent overall sensitivity (§3.8.1); 76 percent for patients with cataracts (§3.8 self-check); floor 90 percent; 500 MB (§3.1.2)"
    example: "Collect cataract images and retrain with lens-opacity augmentation (§3.10.2)"
    read: "§3.8, §3.8.1"
  - id: 15
    q: "Where should the screener run, and what does it cost?"
    picture: "Exercise card (upload); then cumulative cost lines crossing, built in three steps"
    numbers: "2 GB/day at 0.25 MB/s = 8,000 s, 2.2 h, 27.8 percent of an 8 h shift; one 5 MB image 20 s (Napkin Math 3.2, 3.3). Cloud $136,250/yr; edge $250,000 + $34,125/yr; savings $102,125/yr; payback about 2.4 years (Napkin Math 3.3)"
    example: "500 clinics"
    read: "§3.6, §3.9.1"
  - id: 16
    q: "How does a deployed model fail with no code change?"
    picture: "Photo of a newer fundus camera; ladder of monitoring cadences from minutes to quarters"
    numbers: "Five cadences, minute to quarter, about five orders of magnitude (§3.11.1); scenario alert thresholds (§3.10.1)"
    example: "Camera upgrade changes color profile"
    read: "§3.10, §3.11.1"

worked_examples:
  - name: "Example 3.1: auditing a stage transition"
    steps: ["Given: the 500 MB limit surfaces at deployment; raw images and labels were collected", "Kept: raw images, labels", "Redone: preprocessing, weights, validation evidence, deployment package", "1 + 2 + 2 + 1 = 6 days if each waits for the one before", "A supplied schedule for one dependency chain, not a multiplier; the day-153 team lost five months because nobody had traced it"]
  - name: "Napkin Math 3.1: the iteration tax"
    steps: ["Given: 26 weeks; large model 1 week per run, starts at 95 percent; small model 1 hour per run, starts at 90 percent", "Large: 26 runs, 95 + 26 x 0.15 = 98.9 percent", "Small: 26 x 168 = 4,368 possible runs; 100 effective (hypotheses, not hardware, bind)", "90 + 100 x 0.1 = 100, capped at 99 percent", "Both end near the ceiling; the fast team tested 3.8 times as many ideas"]
  - name: "Napkin Math 3.2: bandwidth against compute"
    steps: ["Given: 100 patients/day, 4 photos, 5 MB each; 2 Mb/s uplink; 8 h shift", "2,000 MB/day", "2 Mb/s = 0.25 MB/s, so 8,000 s, about 2.2 h, 27.8 percent of the shift", "One 5 MB image takes 20 s; on a day the link drops, nothing uploads", "The in-visit result cannot depend on the link: infer locally, send 10 KB summaries (2,000 times less)"]
  - name: "Napkin Math 3.3: cloud against edge economics"
    steps: ["Given: 500 clinics, 50 patients/day, 1 billable image each", "Cloud: $91,250 inference + $45,000 network = $136,250 per year", "Edge: $250,000 hardware + $25,000 maintenance + $9,125 inference per year", "Savings $102,125 per year; payback $250,000 / $102,125 = 2.4 years", "Cost only confirms what feasibility already decided"]

active_learning:
  - at_minute: 3
    type: predict
    prompt: "What went wrong when the lab-accurate screener reached Thai clinics?"
    answer: "D: ungradable images (21 percent of 1,838) and slow uploads, not a less accurate model."
  - at_minute: 6
    type: retrieval
    prompt: "Close your notes: in what order do we screen deployment tiers?"
    answer: "Privacy, latency, resources, then cost."
  - at_minute: 16
    type: diagnose
    prompt: "Assign each clinic failure to the stage that should have caught it: ungradable images, retakes that add nurse work, uploads stalled by slow internet."
    answer: "Data collection (capture quality checks) and validation on clinic images; problem definition's operational layer (the nurse's workflow) and human-factors validation; problem definition and deployment (connectivity is a deployment limit). None is a training failure."
  - at_minute: 26
    type: diagnose
    prompt: "The 500 MB limit surfaces at deployment. Which of six artifacts must be redone?"
    answer: "Keep raw images and labels; redo preprocessing, weights, validation evidence, deployment package: 6 days in sequence."
  - at_minute: 30
    type: predict
    prompt: "What share of surveyed data scientists named refining algorithms as their biggest time sink?"
    answer: "4 percent; cleaning and organizing data, 60 percent."
  - at_minute: 33
    type: estimate
    prompt: "In 26 weeks, how many experiments does a 1-week cycle allow, and how many does a 1-hour cycle allow?"
    answer: "26; 4,368 possible, of which the chapter counts 100 as effective."
  - at_minute: 40
    type: concept_question
    prompt: "90 of 100 patients are healthy. A model answers 'normal' for everyone. Its accuracy?"
    answer: "90 percent, with 0 percent sensitivity."
  - at_minute: 43
    type: discuss
    prompt: "War Story 3.1: where in the lifecycle should the bias have been caught, and by whom?"
    answer: "Problem definition: the labels were past hiring decisions; fairness, auditability, and rejection criteria must be stated before data collection. Removing gendered words failed because proxies remained."
  - at_minute: 53
    type: estimate
    prompt: "A clinic takes 100 patients x 4 photos x 5 MB a day over a 2 Mb/s uplink. How long is the upload, and can the result reach the nurse during the visit?"
    answer: "2 GB, 8,000 s, 2.2 h (27.8 percent of an 8 h shift); one image takes 20 s and the link drops, so inference must run in the clinic."
  - at_minute: 60
    type: concept_question
    prompt: "True or false: passing evaluation means ready to deploy; the deployment target can be chosen after training; skipping validation stages speeds delivery."
    answer: "All false: 21 percent ungradable images; day 153 (4 GB against 500 MB); skipped gates move risk to production."

open_questions:
  - "Who should own the deployment limit: the ML team, the hardware team, or the clinic?"
  - "When labels arrive only for patients the model referred, how can a team ever measure what it misses?"
  - "Should a regulated medical model be allowed to change after approval, and how often?"

more_examples:
  - "Netflix Prize: the winning ensemble was never deployed because its engineering cost exceeded its value (Johnston 2012; §3.7)"
  - "Google changed the Thai protocol so specialists review ungradable images with the patient's records instead of referring every such patient (blog.google, 2020)"
  - "Amazon recruiting tool, 2014 to 2018 (Dastin 2018; War Story 3.1)"
  - "Obermeyer et al. 2019: a health-risk score that used cost as a proxy label (§3.5.2 footnote)"
  - "Data cascades (Sambasivan et al. 2021): one line, owned by Lecture 4"
  - "MobileNetV2: about 14 MB FP32 weights, about 600 MFLOP per inference (§3.4)"

closing:
  return_to_hook: "Back to the Thai clinics: ungradable images belong to data collection (a quality check at capture) and validation on clinic images; retakes belong to problem definition's operational layer and human-factors validation; stalled uploads belong to problem definition (connectivity is a limit) and deployment (infer in the clinic). Google's own fix changed the workflow, not the model."
  read_and_practice: ["§3.1 to §3.5 and §3.8 to §3.10", "the chapter's self-check questions", "Napkin Math 3.1 to 3.3 by hand"]
  further_reading:
    - cite: "ML Lifecycle, §3.1 to §3.4 (the loop, propagation, the iteration tax, contracts)"
      why: "The four ideas of the first half of the lecture."
    - cite: "Beede et al., A Human-Centered Evaluation of a Deep Learning System Deployed in Clinics for the Detection of Diabetic Retinopathy, CHI 2020"
      url: "https://doi.org/10.1145/3313831.3376718"
      why: "The hook, told by the team that watched nurses use the system."
    - cite: "Gulshan et al., Development and Validation of a Deep Learning Algorithm for Detection of Diabetic Retinopathy in Retinal Fundus Photographs, JAMA 2016"
      url: "https://doi.org/10.1001/jama.2016.17216"
      why: "The lab result: how sensitivity and specificity targets are reported."
    - cite: "Amershi et al., Software Engineering for Machine Learning: A Case Study, ICSE-SEIP 2019"
      url: "https://doi.org/10.1109/icse-seip.2019.00042"
      why: "The workflow the chapter's lifecycle definition cites, from interviews with Microsoft teams, and where those teams struggled."
    - cite: "Sculley et al., Hidden Technical Debt in Machine Learning Systems, NeurIPS 2015"
      why: "Why decisions made in isolation accumulate cost."
  bridge: "Lecture 4 (Data Engineering, Part 1): Why does training data function like source code?"

left_to_reading:
  - concept: "Data cascades, the feeding problem, drift statistics, dataset lineage"
    why: "Previews owned by Data Engineering: data cascades in Lecture 4; the feeding problem and drift statistics in Lecture 4b. One line each at most."
  - concept: "Reproducible system artifacts, experiment tracking, ablation"
    why: "§3.7.3 to §3.7.4; reproducibility and the registry are owned by ML Operations (Lecture 14)."
  - concept: "Offline and online evaluation stages (shadow, canary, A/B)"
    why: "§3.8.2; safe release is owned by ML Operations (Lecture 14). Mentioned in notes only."
  - concept: "Regulatory and human-factors validation"
    why: "§3.8.4; better read than heard. Calibration is now a row on the release-gate slide."
  - concept: "Emergent behavior across sites"
    why: "§3.11.2; one sentence in the monitoring notes."
  - concept: "Iron law mapping of stages (Systems Perspective 3.1)"
    why: "Named in notes on the ownership slide; the iron law was taught in Lecture 1."

coverage:
  primary_taught: ["The lifecycle is a loop", "Constraint propagation", "Problem framing", "Stage interface contracts", "Validation as a release gate"]
  primary_left_to_reading: []
  secondary: ["Iteration tax", "Lab-to-field gap"]

notes_for_author:
  - "The ROC slide draws an illustrative threshold-sweep curve shaped to AUC 0.99 through the lab operating point (97.5 / 93.4); the clinic point (sensitivity below 90 percent) is illustrative, as in the chapter's §3.8 opening. Both are labeled on the slide."
  - "The 224-pixel demonstration uses a Commons fundus photo (Hao et al., CC BY 4.0) that is already about 1,000 pixels wide; clinical photos are several megapixels, so the real loss is larger."
  - "11 clinics and eight months come from Google's 2020 blog post, not the chapter."
  - "The old deck's images (ch03-*.svg/pdf, retinal-fundus.jpg) are no longer used and can be deleted."
  - "2026-10-17 (review round 1): Cover is now the clean blueprint (cover_ml_lifecycle_blueprint.png); the old generated artwork was removed. Added a CORE release-gate build after the ROC slide (concept 14b). The contracts slide is CORE and redrawn as a four-step build on the loop with an audit step. Problem framing now starts from the baseline. The Stage 2 slide shows illustrative ungradable photos; the 224-pixel slide prints measured lesion widths. The synthesis adds the retakes row. Goal 4 now names the release evidence; the recall answer uses Lecture 2's gate names. Callbacks point to Lecture 4b for drift statistics and Lectures 14 and 14b for the operations loop. Marked [OPTIONAL]: software table, D·A·M loop, iteration predict, book iteration figure, payback plot, true-or-false check (about 8.5 minutes); the title note gives the shorter path. Notes total 72 minutes."
  - "Real data per segment: the Propagation segment shows the Example 3.1 repair schedule, a supplied schedule rather than a measurement. Accepted as an exception; the measured memory bars (4 GB against 500 MB) sit at the end of segment 1, one slide before the Propagation divider."
  - "2026-10-18 (visual and technical pass): Real things added in rhythm, every number derived in images/calcs.py (new; also checks the deck's existing derived numbers, all of which agree). Predict slide reveals Google's photo of a nurse at the fundus camera in a Thai clinic. The software table is now the WILDS Camelyon17 figure (93.2 to 70.3 percent, same code), still OPTIONAL. The memory slide shows real torchvision 0.28.0 parameter counts (run of images/data/count_params.py with the mlperf-edu venv's torch 2.13.0). The D·A·M loop slide is removed (one sentence moved to the contracts note) and replaced by excerpts of the FDA De Novo decision summary for IDx-DR (DEN180001), CORE. The iteration predict is merged into the time-sinks chart as a two-step build. The book iteration figure is replaced by the MLflow tutorial's run list. The Amazon discussion shows the Reuters headline (Internet Archive capture). Stage 2 shows real EyeQ-graded EyePACS photos instead of illustrative degradations. The ROC slide shows the measured Gulshan et al. figure 2A inset with the floors and the illustrative clinic point drawn over it. Stage 1 title names framing. Notes total 72 minutes; 35 content frames (was 36). Skipped: the Keras Applications table (the torchvision run shows the same catalog as real output)."
  - "Unused after 2026-10-18, to delete: images/book_iteration.svg and .pdf, fundus_ok/dark/blur/pupil.png, loop_dam.svg and .pdf, loop_hl1.svg and .pdf, roc_step1-3.svg and .pdf, time_sinks.svg and .pdf."
