chapter: 16_conclusion
lecture: 16
title: Conclusion
minutes: 75
notes_minutes: 71.5
target_ideas: 26
thesis: 'Engineering the whole stack lets you predict where a system will break before it does. Name the binding term, measure it, and budget for it, at every layer and at every scale.'
hook:
  minutes: 0-8
  setup: 'Step 1 (retrieval): Lecture 0''s stack with each lecture placed on its layer (kit stack_roadmap). Close your notes: for each layer, one number you remember. Step 2: the stack again with one number per layer, each the strongest number its lecture taught (see touches_reused). Then the predict: the chapter''s composite fleet failure. An image classifier ships to a fleet of phones. Architecture chose depthwise separable convolutions (8.7x fewer FLOPs per layer), compression quantized to INT8 to fit on-chip SRAM, serving met a 50 ms p99. Every team met its target. Within weeks, accuracy fell four percentage points on specific firmware and device cohorts. Nothing crashed.'
  question_to_class: 'Whose layer failed? A) architecture B) compression C) serving D) operations E) none of them alone'
  payoff: 'E. INT8 calibration fixed its clipping ranges on the calibration images; a firmware preprocessing path interpolated images differently on some phones; the quantized model met a shifted input distribution; accuracy was measured only as one aggregate number offline. The failure lived at the interfaces, which no single team owned (book margin-001: calibration -> firmware path -> cohort shift -> accuracy drop). Students who pick B have found where the chain starts, not why nobody saw it. The chapter labels the case a composite, not one incident; the slide says so. This is the lecture''s first answer to Lecture 0''s third open question (whose job was it to notice?), and the synthesis returns to it.'
  sources:
  - chapter §16.1 (composite scenario, margin-001); §16.2 table 2 (8.7x)
  - kit assets/kit/vol1/stack_roadmap.svg (Lecture 0's stack with lectures placed)
  - each number on the step-2 stack comes from that lecture's lecture_map.yml (listed under coverage.touches_reused)
driving_question: 'Every lecture taught one layer. Can you now predict where a whole system will break, before it does?'
recall: 'Built into the hook (step 1): one number per layer from memory. Expected answers are the step-2 numbers; any correct number from that lecture counts. Lecture 15b''s bridge asked what mastering the full stack lets you do; this lecture answers it.'
running_example: 'Three carriers. (1) The INT8 fleet failure (hook, segment 1, synthesis; chapter composite). (2) The five lighthouses under constraint propagation: ResNet-50 compute-bound, GPT-2/Llama decode bandwidth-bound, DLRM capacity-bound, MobileNetV2 compute-bound in its efficient regime, KWS power-bound (chapter table 1), with Llama 2 70B on two H100s as the worked example (140 GB, 20.9 ms against 0.07 ms, 295.2x). (3) The voice-assistant request traced through every layer (chapter §16.8): KWS (200 KB INT8, 1 MB flash, 20 MFLOP, milliwatts) -> MobileNetV2-sized front end (600 MFLOP, 3.5 MB INT8, 5 W) -> DLRM ranking (100 GB of embeddings against one H100''s 80 GB) -> GPT-2 decoder (3 GB of FP16 weights per token, 0.9 ms floor, 295x the compute floor). Measured anchors: chapter table 1 and the numbers each earlier lecture measured; Dean and Barroso 2013 Table 1 (tails); Llama 3 training reliability (Llama Team 2024, §3.3.4); MLPerf Inference v5.0 Llama 2 70B (from Lecture 13b).'
segments:
- name: Constraints Propagate
  divider_question: Where does a decision made in one layer show up?
  read: §16.1, §16.2
  concept_questions: [2, 3, 4, 5, 6]
  land: 'A decision travels down the stack: each lighthouse rewards the lever aimed at its binding term, the regime belongs to the workload on a machine, and the costliest failures sit at interfaces no team owns.'
  minutes: 15.5
- name: Thirteen Principles
  divider_question: Which principles did each part of the book add?
  read: §16.3
  concept_questions: [7, 8, 9, 10, 11]
  land: 'The thirteen principles are tools with stated kinds (bounds, decompositions, fitted models, policies, heuristics); one decision activates several of them in turn, and after any simplification you trace where the complexity went.'
  minutes: 15.5
- name: Tails and Trust at Scale
  divider_question: What must a system keep proving after launch, and what happens to rare events when it grows?
  read: §16.4, §16.5 (horizon note)
  concept_questions: [12, 13]
  land: 'Both halves of the dual mandate are budgets the system keeps meeting, and at scale the rare event (the p99 request, the failed GPU) becomes the routine one.'
  minutes: 10.0
- name: What Comes Next
  divider_question: Where do the same constraints bind next?
  read: §16.5, §16.6, §16.7
  concept_questions: [14, 15]
  land: 'New contexts (embodied, composed, fleet-scale) widen the boundary of the analysis; they do not replace it. The engineer still names the binding term and traces where the displaced cost lands.'
  minutes: 7.0
concept_questions:
- id: 1
  q: What did each layer of the stack teach, in one number?
  picture: 'Kit stack_roadmap (Lecture 0''s stack with lecture tags) in step 1; step 2 a new variant of the kit stack with one number beside each layer and the data bar.'
  numbers: 'Hardware: TPU 30 to 80x performance per watt (L11, Jouppi et al. 2017); datasheet 20 against sustained 1.5 TOPS/W, 13.3x (L12, chapter scenario). Frameworks: 8.6 ms of host time against 0.9 ms of weight reads for one GPT-2 XL token (L7). Models: a 7B model needs 14 GB in FP16 against a phone''s 8 GB (L10). Training: 16 bytes per parameter; PaLM''s state about 8.6 TB, about 100 H100s (L8). Serving: batch 1 costs 7.5x batch 8 per million requests, $3.92 against $0.52 (L13). Operations: Zillow''s $304 million write-down while every server stayed up (L14). Applications: 17.7 against 46.5 percent (L15, Obermeyer et al. 2019). Data: Tay suspended 16 hours after launch (L4); GPT-2 saw each WebText token about 17 times (L9). Whole stack: Flu Trends 10.6 against CDC 6.1 percent (L1); 15 ms fiber round trip against a 10 ms deadline (L2); 21 percent of clinic images ungradable (L3).'
  example: 'Students name one per layer before the reveal; the reveal is a recap, not new material.'
  read: Lecture maps 1 to 15; Preface
- id: 2
  q: Whose layer failed when every team met its target?
  picture: 'Predict card (five choices), then book margin-001 redrawn at slide size with each stage tagged by the lecture that owns it: INT8 calibration set (L10b), firmware preprocessing path (L4 and L14, training-serving skew), cohort shift (L4b and L14b, drift), aggregate offline accuracy instead of slices (L12b).'
  numbers: 'Chapter composite: 8.7x fewer FLOPs (depthwise layer), INT8, p99 inside 50 ms, a four-point accuracy drop on specific cohorts.'
  example: 'The measurement that would have caught it: the training-serving skew diagnostic (principle 11) on the same captured inputs through both preprocessing paths, plus cohort-level accuracy monitoring from day one (§16.3, the integrated framework).'
  read: §16.1
- id: 3
  q: How does one artifact carry every lecture's constraint?
  picture: 'New horizontal strip, variant of the old deck''s course-journey-timeline lower row and chapter table 2: the MobileNetV2 journey in nine phases, each with its number; build reveals three groups.'
  numbers: 'Chapter table 2: watt-scale mobile envelope; 8.7x fewer FLOPs for a 3x3, 256-channel layer and 13.7x fewer operations than ResNet-50; INT8 is 1/4 the storage of FP32; mobile NPU mapping; p99 < 50 ms; cohort drift monitoring.'
  example: 'Depthwise layers become bandwidth-bound, so the next lever is bytes (INT8), which pays only if the NPU runs those operators and the gain survives preprocessing (§16.2).'
  read: §16.2 (table 2)
- id: 4
  q: For each lighthouse, which lever paid and which was wasted?
  picture: 'Retrieval table: five rows (ResNet-50, GPT-2/Llama decode, DLRM, MobileNetV2, KWS) and columns home regime, lever that paid, lever wasted; cells blank, revealed by column. Lighthouse icons from the kit if present, else names.'
  numbers: 'Chapter table 1 verbatim in short form.'
  example: 'Wasted levers are the misconceptions: more bandwidth for batched ResNet-50; more peak FLOP/s for batch-1 decode; faster dense math for DLRM; more operation cuts on bandwidth-bound depthwise layers; streaming KWS audio to the cloud.'
  read: §16.2 (table 1)
- id: 5
  q: Does a model have one regime?
  picture: 'New roofline (slideplot roofline_steps), H100: step 1 GPT-2 decode at about 1 FLOP/byte on the memory slope; step 2 GPT-2 training on the compute ceiling; step 3 the INT8 ceiling doubles the ridge and leaves some ResNet-50 layers below it.'
  numbers: 'H100 ridge about 295 FLOP/byte in FP16 (Lecture 11; chapter §16.4); INT8 doubles the peak rate without raising bandwidth, so it doubles the ridge (chapter §16.2). ResNet-50 also went input-bound in Lecture 8.'
  example: 'The regime belongs to the workload on a machine: batch, phase, and precision move it.'
  read: §16.2
- id: 6
  q: Why does a 70-billion-parameter token cost the same physics as GPT-2''s?
  picture: 'Exercise card (given left, steps right), ending on book margin-002 (batch-one decode left of the ridge).'
  numbers: 'Chapter §16.4: 140 GB of FP16 weights; 140 GFLOP per token; two H100s, 6.70 TB/s and 1,978 TFLOP/s aggregate; 20.9 ms against 0.07 ms, 295.2x, equal to the ridge point; sharding doubles both, so the ridge does not move. Measured follow-on (Lecture 13b, MLPerf Inference v5.0, 8x H100-SXM): Llama 2 70B at 30,904 tokens/s under a 2,000/200 ms TTFT/TPOT bound, 12,979 under 450/40 ms; batching is how real systems escape the floor, and the deadline limits it.'
  example: 'Compute-only tuning can approach 0.07 ms and cannot lower 20.9 ms; batching and fewer bytes per weight can.'
  read: §16.4 (Physical deliverability)
- id: 7
  q: What are the thirteen principles, and what kind of statement is each?
  picture: 'Book fig-invariants-cycle (four parts around conservation of complexity), shown whole; one line beneath: 3 bounds, 2 decompositions, 2 fitted models, 2 policies, 4 heuristics.'
  numbers: 'Chapter §16.3 and table 3.'
  example: 'The silicon contract is a heuristic (a prediction); the arithmetic intensity law is the bound that tests it.'
  read: §16.3 (table 3, figure 1)
- id: 8
  q: What did Part I (Foundations) add, and where did we see it?
  picture: 'Part slide: the cycle figure with Foundations lit, beside two evidence thumbnails with their numbers: Flu Trends (data-as-code: the data drifted, the code did not) and the robot arm (data gravity: computation moves to the data when distance breaks the deadline).'
  numbers: 'Principle 1 data-as-code; principle 2 data gravity. L1: Flu Trends peaked at 10.6 against CDC 6.1 percent, too high in 100 of 108 weeks. L2: 15 ms fiber round trip against a 10 ms stop deadline. L4: Tay, 16 hours.'
  example: 'Retrieval prompt per part slide: before the reveal, students name the principle the evidence shows.'
  read: §16.3 (What shapes predictions; What limits execution)
- id: 9
  q: What did Part II (Development) add?
  picture: 'Part slide: Development lit; evidence: the iron-law bars from Lecture 1 (ResNet-50 mostly compute, GPT-2 XL mostly memory, both about 0.5 ms of overhead; MLSysIM) and the L8 memory number.'
  numbers: 'Principle 3 iron law: T = D_vol/BW + O/(R_peak x eta) + L_lat. Principle 4 silicon contract. L1 iron-law bars (MLSysIM, H100). L8: 16 bytes per parameter before activations; PaLM about 8.6 TB. L7: 8.6 ms host against 0.9 ms weights.'
  example: 'Each term names a lever; an upgrade helps only the term it shrinks.'
  read: §16.3; Lecture 1 iron law
- id: 10
  q: What did Part III (Optimization) add, and why did the faster kernel not make the system faster?
  picture: 'Part slide: Optimization lit; four big numbers in a 2x2 grid (one per principle). Then a concept question on Amdahl.'
  numbers: 'Principle 5 Pareto: 7B at 14 GB FP16 against 8 GB (L10). Principle 6 intensity: decode about 1 FLOP/byte against a 295 ridge (L11, L13b). Principle 7 energy: one DRAM access 173 to 582x one arithmetic operation (chapter §16.3); TPU 30 to 80x performance per watt (L11). Principle 8 Amdahl: a 10x kernel speedup with 90 percent host preprocessing gives about 1.1x (chapter §16.7). L12: 20 against 1.5 TOPS/W.'
  example: 'Fallacy (§16.7): optimizing the stage one team owns makes the system fast.'
  read: §16.3; §16.7
- id: 11
  q: What did Part IV (Deployment) add, and how does one decision touch seven principles?
  picture: 'Part slide: Deployment lit; evidence thumbnails: DR clinics 21 percent ungradable (verification gap, L3), Zillow $304M (drift, L14), batch-1 7.5x cost (latency budget, L13), 17.7 against 46.5 percent and alpha = 1.10 crossing a 5-point gate in quarter 6 (bias feedback, L15). Then the worked trace: FP16 -> INT8 on the cycle figure, principles lit in order 5, 4, 6, 7, 12, 9, 11.'
  numbers: 'Chapter §16.3, The integrated framework and Checkpoint 16.2; Lecture numbers as listed.'
  example: 'Had the model moved to the cloud, principle 2 would enter; had preprocessing stayed on the CPU, principle 8 would. Conservation of complexity: quantizing moved complexity into validation.'
  read: §16.3 (What evidence supports deployment; The integrated framework)
- id: 12
  q: What does each half of the dual mandate measure, on which lighthouse?
  picture: 'Comparison: left DLRM (trust: drift 10, skew 11, bias feedback 13, verification gap 9); right GPT-2/Llama (deliverability: iron law 3, intensity 6, energy 7, latency budget 12). Step 3 a diagnose card: click-through fell; the online embedding lookup normalizes one feature differently from training. Which principle? Focus frame after: Name the binding term, measure it, and budget for it.'
  numbers: 'Chapter §16.4; self-check 16.4 question 1 (answer: training-serving skew, measurable without labels).'
  example: 'Neither half is certified once at launch.'
  read: §16.4
- id: 13
  q: What happens to rare events as a system grows?
  picture: 'Predict, then book margin-003 (mean 50 ms against p99 2,000 ms, tagged illustrative), then new hbars of Dean and Barroso 2013 Table 1 (measured). Then a big-number build: one GPU MTTF 5.7 years -> 1,024 GPUs MTBF 48.8 hours (new log-scale hbars, an estimate exercise first).'
  numbers: 'Chapter §16.4: illustrative TTFT mean 50 ms, p99 2,000 ms, 40x (scenario assumptions, the chapter says so). Measured: Google fan-out service, one leaf p99 10 ms, all leaves p99 140 ms (Dean and Barroso 2013, Table 1; read for Lecture 12). Chapter §16.5: MTTF 5.7 years (about 50,000 hours) / 1,024 = 48.8 hours, independent constant-rate failures, any failure halts the pool.'
  example: 'Lecture 13''s fan-out: 0.99^100 = 36.6 percent of requests meet the target (chapter §13), recalled in the notes.'
  read: §16.4 (Physical deliverability); §16.5 (horizon note)
- id: 14
  q: Where do the same constraints bind next, from microcontrollers to composed services?
  picture: 'Step 1 the power ladder from Lecture 0 (kit or regenerated) with the five lighthouses; step 2 a robot arm photo with the deadline as a safety constraint (Lecture 2''s arm). Then an exercise: a composed assistant''s critical path drawn as a small DAG.'
  numbers: 'Chapter §16.5: a reference mobile device has about 10x less memory and about 140x less power than an H100-class accelerator; embodied AI turns the deadline into a hard real-time safety limit. Composed request (self-check 16.5 question 1): retrieval 50 ms + max(110, 70) ms tools + 180 ms generation + 30 ms verifier = 370 ms; the sum 440 ms is the common wrong answer.'
  example: 'A planner can invent a tool name or emit JSON that breaks the schema; each interface needs validation (§16.5, Lampson 1983).'
  read: §16.5
- id: 15
  q: What changes when the system no longer fits in one machine?
  picture: 'New diagram: the Lecture 0 machine (kit machine_step4) inside a node boundary that widens to a fleet; three labels change: HBM bandwidth -> plus network bisection bandwidth; an exception -> fault tolerance; a step -> coordination. Measured panel: Llama 3 405B pre-training.'
  numbers: 'Chapter §16.5 horizon note. Measured: Llama 3 405B trained on up to 16K H100 GPUs; 466 job interruptions in a 54-day snapshot, 419 unexpected, about 78 percent attributed to confirmed hardware issues, faulty GPUs the largest cause (148, 30.1 percent; Table 5); higher than 90 percent effective training time (Llama Team, The Llama 3 Herd of Models, 2024, §3.3.4, read). Derived: 54 x 24 / 419 = one unexpected interruption about every 3.1 hours; the chapter''s model at 16,384 GPUs predicts 50,000 / 16,384 = 3.05 hours. Label both derived.'
  example: 'Described as the next scale of the problem, as further study; no other volume is named.'
  read: §16.5 (A horizon note); §16.6
worked_examples:
- name: 'Llama 2 70B: one token on two H100s (§16.4)'
  steps:
  - 'given: 70B parameters in FP16 = 140 GB; 2 FLOPs per parameter = 140 GFLOP; two H100s: 6.70 TB/s, 1,978 TFLOP/s aggregate'
  - 'memory floor: 140 GB / 6.70 TB/s = 20.9 ms'
  - 'compute floor: 140 GFLOP / 1,978 TFLOP/s = 0.07 ms'
  - 'result: 295.2x, numerically the H100 ridge point, because intensity is about 1 FLOP/byte'
  - 'meaning: compute tuning cannot touch 20.9 ms; batching and fewer bytes per weight can; MLPerf''s 8x H100 system serves 30,904 tokens/s under its conversational bound by batching'
- name: 'One decision, seven principles: FP16 to INT8 (§16.3, Checkpoint 16.2)'
  steps:
  - 'given: a colleague proposes INT8 to cut serving cost; the fleet from the hook'
  - 'Pareto (5): what accuracy for the bandwidth gain? silicon contract (4): does the NPU run INT8 operators?'
  - 'intensity (6) and energy (7): fewer bytes per weight raise intensity and cut traffic'
  - 'latency budget (12): inside the SLO, or headroom for batching?'
  - 'verification gap (9) and skew (11): do calibration images pass through the same preprocessing as every device?'
  - 'meaning: the skew check on the same captured inputs is the measurement that would have caught the hook; complexity moved into validation'
- name: 'From one GPU to a fleet (§16.5)'
  steps:
  - 'given: MTTF 5.7 years, about 50,000 hours; failures independent at a constant rate; any failure halts the pool'
  - '1,024 GPUs: 50,000 / 1,024 = 48.8 hours'
  - '16,384 GPUs: 3.05 hours (same model, derived)'
  - 'measured: Llama 3, 419 unexpected interruptions in 54 days, about one every 3.1 hours (derived)'
  - 'meaning: a multi-week run will fail; checkpoint cadence and recovery scope are design inputs'
- name: 'The voice-assistant request (§16.8)'
  steps:
  - 'KWS: 200 KB INT8 in 1 MB flash, 20 MFLOP, milliwatts: power binds'
  - 'front end: 600 MFLOP on 3.5 MB INT8, 5 W: compute binds'
  - 'DLRM: 100 GB of embeddings against 80 GB: capacity binds'
  - 'GPT-2: 3 GB per token, 0.9 ms floor, 295x the compute floor: bandwidth binds'
  - 'meaning: four limits along one request; a one-layer engineer sees one of them'
active_learning:
- at_minute: 0.5
  type: retrieval
  prompt: 'Close your notes. For each layer of the stack, write one number from its lecture.'
  answer: 'Any correct number counts; step 2 shows one per layer (concept question 1). Empty layers tell the instructor what to review.'
- at_minute: 4.5
  type: predict
  prompt: 'Every team met its target; accuracy fell four points on some phones. Whose layer failed? A architecture B compression C serving D operations E none alone.'
  answer: 'E: the chain crossed four layers (calibration, firmware preprocessing, cohort shift, aggregate-only evaluation). B finds the start, not the failure to notice.'
- at_minute: 14.5
  type: retrieval
  prompt: 'Fill the lighthouse table: home regime, the lever that paid, the lever wasted.'
  answer: 'Chapter table 1: ResNet-50 compute (batching, reduced precision; wasted: more bandwidth); GPT-2/Llama decode bandwidth (batching, fewer bytes, KV-cache management; wasted: peak FLOP/s); DLRM capacity (placing and sharding embeddings, caching; wasted: faster dense math); MobileNetV2 compute in its efficient regime (depthwise separable, then INT8; wasted: more operation cuts on bandwidth-bound layers); KWS power (sub-megabyte INT8 model, planned arena; wasted: streaming audio to the cloud).'
- at_minute: 21
  type: estimate
  prompt: 'Llama 2 70B in FP16 on two H100s (6.70 TB/s, 1,978 TFLOP/s). Memory floor and compute floor for one token at batch 1?'
  answer: '20.9 ms and 0.07 ms, 295x. Students who divide FLOPs by bandwidth have mixed units; students who halve the ratio for sharding miss that both resources double.'
- at_minute: 32.5
  type: concept_question
  prompt: 'Host preprocessing is 90 percent of request time. A kernel rewrite makes inference 10x faster. System speedup? A 10x B 5.5x C 1.1x D 0.9x'
  answer: 'C: 1 / (0.90 + 0.10/10) = 1 / 0.91 = 1.1x (Amdahl, principle 8; chapter §16.7). B averages the speedups.'
- at_minute: 36.5
  type: diagnose
  prompt: 'A colleague proposes INT8. Five questions on the screen; name the principle each one checks.'
  answer: 'Pareto (5), silicon contract (4), verification gap (9), training-serving skew (11), latency budget (12) (Checkpoint 16.2); intensity (6) and energy (7) ride along.'
- at_minute: 40.5
  type: diagnose
  prompt: 'DLRM: click-through fell; latency is healthy; the online embedding lookup normalizes one feature differently from training. Which principle names it?'
  answer: 'Training-serving skew (11), detectable without labels; drift would be a change in the population (self-check 16.4.1).'
- at_minute: 43.5
  type: predict
  prompt: 'A chat endpoint''s mean time to first token is 50 ms. Guess its p99.'
  answer: 'The chapter''s scenario: 2,000 ms, 40x (illustrative). Measured: Google''s fan-out leaf p99 10 ms against all-leaves p99 140 ms (Dean and Barroso 2013).'
- at_minute: 46.5
  type: estimate
  prompt: 'One GPU fails on average every 5.7 years (about 50,000 hours). With 1,024 GPUs, any failure halts the job. How long between failures?'
  answer: '48.8 hours. At 16,384 GPUs, 3.05 hours; Llama 3 measured about one unexpected interruption every 3.1 hours (derived).'
- at_minute: 52.5
  type: estimate
  prompt: 'Retrieval 50 ms; two tools in parallel, 110 and 70 ms; generation 180 ms; verifier 30 ms. Critical path?'
  answer: '370 ms; 440 ms adds the parallel branch. Then: what new failure appears at each arrow? (malformed JSON, invented tool names, timeouts).'
- at_minute: 57
  type: retrieval
  prompt: 'The voice-assistant request: name the binding term at each of four stages before it appears.'
  answer: 'Power (KWS), compute (front end), capacity (DLRM), bandwidth (GPT-2 decode).'
- at_minute: 60.5
  type: discuss
  prompt: 'Lecture 0''s three questions, one at a time: who should get a power line a datacenter and a town both need; phone or cloud; whose job was it to notice. Read the sentence you wrote in Lecture 0; has your answer changed? Two minutes with a neighbor per question.'
  answer: 'Open. The notes give the evidence the course supplies for each (datacenter electricity, 415 TWh in 2024 against 945 projected for 2030, and 0.24 Wh per prompt; the KWS on-device and hybrid split; the hook''s interface failure and cohort monitoring).'
- at_minute: 66.5
  type: retrieval
  prompt: 'Close your notes: write the three principles you would keep, and one system where each binds.'
  answer: 'Any three with a correct binding example; collect them as the course''s final exit ticket.'
open_questions:
- 'When a request passes through many models and tools owned by different teams, who owns the interface between them?'
- 'Which of the thirteen principles do you expect to need revising first, and what measurement would tell you?'
- 'A service''s mean latency is 50 ms and its p99 is 2,000 ms. Which number should it publish to users, and who decides?'
