closing:
  return_to_hook: 'The fleet failure again, now with every lecture''s tool on it: the calibration choice (L10b) met a firmware preprocessing path (L4, L14) that nobody compared on the same inputs (skew, principle 11), the cohort shift went unnamed as drift (L4b, L14b), and accuracy was measured as one aggregate number (L12b) instead of by cohort (L14b). Whose job was it to notice? The engineer who reasons across layers, which is what this course trained. Then the voice-assistant request shows the same reasoning forward, before anything breaks: four stages, four binding terms.'
  read_and_practice:
  - '§16.1 to §16.5, §16.7, §16.8'
  - 'Self-check questions for §16.2, §16.3, §16.4, §16.5'
  - 'Checkpoint 16.2 (trace a quantization proposal) applied to a system of your choice'
  further_reading:
  - cite: 'Conclusion, §16.2 to §16.5'
    url: ''
    why: 'The lighthouse table, the thirteen principles in one place, the dual mandate measured, and the horizon note.'
  - cite: 'Dean and Barroso, The Tail at Scale, CACM 2013'
    url: https://doi.org/10.1145/2408776.2408794
    why: 'Why rare slow events dominate large services, and the techniques that tolerate them.'
  - cite: 'Hennessy and Patterson, A New Golden Age for Computer Architecture, CACM 2019'
    url: https://doi.org/10.1145/3282307
    why: 'Why domain-specific hardware and software co-design are where performance now comes from.'
  - cite: 'Lampson, Hints for Computer System Design, SOSP 1983'
    url: https://doi.org/10.1145/800217.806614
    why: 'Interfaces as the place where assumptions become testable.'
  - cite: 'Llama Team, The Llama 3 Herd of Models, 2024, §3.3 (infrastructure and reliability)'
    url: https://arxiv.org/abs/2407.21783
    why: 'A measured picture of the next scale of the problem: thousands of GPUs, failures every few hours, and what it takes to keep training.'
  - cite: 'Barroso, Hölzle, and Ranganathan, The Datacenter as a Computer, 3rd ed., 2018'
    url: https://doi.org/10.2200/S00874ED3V01Y201809CAC046
    why: 'For further study of systems at warehouse scale: power, failures, and cost when the computer is a building.'
bridge: 'No next lecture. The closing frame poses the question for further study: what changes when the system no longer fits in one machine? Then the chapter''s last line: the world is rushing to build AI systems; our task is to engineer them.'
