review_lens:
- 'Retrieval-heavy by design: there is no new chapter material to teach at length, so seven of thirteen activities ask students to produce what earlier lectures taught before the slide shows it.'
- 'Every number reused from an earlier lecture keeps that lecture''s value and source; the build step should copy or regenerate the figure rather than reference another deck''s images folder.'
- 'The four panel personas from the brief apply at step 6.'
notes_for_author:
- "2026-10-19 sweep: Lecture 0's first open question is now a power-allocation question (a datacenter and a town on one power line). The three-questions slide quotes it, shows the substation photo from Lecture 0, and answers it with Lecture 0's IEA numbers (415 TWh in 2024, 945 projected for 2030, 2.3x in images/calcs.py) and Lecture 15b's 0.24 Wh per prompt. The data-wall thumbnail (images/thumb_data_wall_step2.*) is no longer used on this slide."
- 'Volume I names no other volume. The fleet frame says "the next scale of the problem" and points to outside reading (Llama 3 paper, The Datacenter as a Computer). The old deck''s node-to-fleet.svg names Volume II and is not reused.'
- 'The chapter''s p99 2,000 ms against 50 ms is a scenario assumption; the slide tags it illustrative and pairs it with Dean and Barroso''s measured table.'
- 'Llama 3 numbers were read from arXiv 2407.21783 (HTML v3, §3.3.4 and Table 5) for this plan. The 3.1-hour interval and the 3.05-hour model value are derived and labeled so; not every interruption is a GPU failure (78 percent hardware), and "up to 16K" GPUs means the comparison is approximate. The notes say both.'
- 'Dean and Barroso Table 1 values come from Lecture 12''s map, where they were read from the paper; re-confirm at build time.'
- 'One \mlsysfocus: "Name the binding term, measure it, and budget for it." The chapter states it as the shared discipline of the dual mandate (§16.4); it is the closest thing this chapter has to its own law.'
- 'No "next lecture" slide; the final frame is the further-study question plus the chapter''s closing line, attributed as in the book.'
- 'Four part slides use the book cycle figure with one quadrant lit. If a highlight mask over the PNG reads poorly, regenerate the cycle as a slide variant with four lit states.'
- 'Segment 3 merges the dual mandate with tails and failures (the brief lists them separately) to stay inside 34 frames; the dual mandate keeps its own frame and the focus frame.'
