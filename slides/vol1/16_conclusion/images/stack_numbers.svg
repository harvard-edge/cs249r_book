 Arial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="215" y="111.0">$304M write-down, every server up</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="end" dominant-baseline="middle"><tspan x="788" y="111.0">L14</tspan></text><rect x="20" y="148" width="780" height="54" rx="8" fill="#A51C30" fill-opacity="0.22"/><text font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="38" y="175.0">Serving</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="215" y="175.0">Batch 1 costs 7.5× batch 8</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="end" dominant-baseline="middle"><tspan x="788" y="175.0">L13</tspan></text><rect x="20" y="212" width="780" height="54" rx="8" fill="#A51C30" fill-opacity="0.12"/><text font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="38" y="239.0">Training</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="215" y="239.0">16 bytes per parameter: PaLM ≈ 100 H100s</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="end" dominant-baseline="middle"><tspan x="788" y="239.0">L8</tspan></text><rect x="20" y="276" width="780" height="54" rx="8" fill="#A51C30" fill-opacity="0.17"/><text font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="38" y="303.0">Models</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="215" y="303.0">7B model in FP16 = 14 GB; phone has 8 GB</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="end" dominant-baseline="middle"><tspan x="788" y="303.0">L10</tspan></text><rect x="20" y="340" width="780" height="54" rx="8" fill="#A51C30" fill-opacity="0.22"/><text font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="38" y="367.0">Frameworks</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="215" y="367.0">Host 8.6 ms against 0.9 ms of weight reads</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="end" dominant-baseline="middle"><tspan x="788" y="367.0">L7</tspan></text><rect x="20" y="404" width="780" height="54" rx="8" fill="#A51C30" fill-opacity="0.12"/><text font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="38" y="431.0">Hardware</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="215" y="431.0">TPU 30 to 80× perf/W; 1.5 TOPS/W sustained, not 20</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="end" dominant-baseline="middle"><tspan x="788" y="431.0">L11, L12</tspan></text><rect x="814" y="20" width="56" height="438" rx="8" fill="#A51C30" fill-opacity="0.18"/><text font-family="Helvetica, Arial, sans-serif" x="842" y="239" font-size="22" font-weight="700" fill="#A51C30" text-anchor="middle" dominant-baseline="middle" letter-spacing="3" transform="rotate(-90 842 239)">DATA</text><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="end" dominant-baseline="middle"><tspan x="870" y="500.0">Data: Tay suspended 16 hours after launch (L4);  GPT-2 saw each WebText token about 17 times (L9)</tspan></text><line x1="842" y1="470" x2="842" y2="482" stroke="#A51C30" stroke-width="2" opacity="1.0"/></svg>