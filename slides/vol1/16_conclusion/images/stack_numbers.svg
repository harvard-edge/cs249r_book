rial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="190" y="73.0">$304M write-down, every server up</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="end" dominant-baseline="middle"><tspan x="786" y="73.0">L14</tspan></text><rect x="10" y="98" width="786" height="40" rx="7" fill="#A51C30" fill-opacity="0.22"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="24" y="119.0">Serving</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="190" y="119.0">Batch 1 costs 7.5× batch 8</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="end" dominant-baseline="middle"><tspan x="786" y="119.0">L13</tspan></text><rect x="10" y="144" width="786" height="40" rx="7" fill="#A51C30" fill-opacity="0.12"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="24" y="165.0">Training</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="start" dominant-baseline="middle"><tspan x="190" y="165.0">16 bytes per parameter: PaLM ≈ 100 H100s</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#A51C30" font-weight="bold" opacity="1.0" text-anchor="end" dominant-baseline="middle"><tspan x="786" y="165.0">L8</tspan></text><rect x="10" y="190" width="786" height="40" rx="7" fill="#A51C30" fill-opacity="0.17"/><text font-family="Helvetica, Arial, sans-serif" font-size