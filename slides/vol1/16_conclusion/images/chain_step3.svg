="225.0">Every team met its own target; no test crossed the interfaces.</tspan></text><rect x="20" y="260" width="412" height="104" rx="8" fill="#D4EFDF" stroke="#008F45" stroke-width="2" opacity="1.0"/><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#008F45" font-weight="bold" opacity="1.0" text-anchor="middle" dominant-baseline="middle"><tspan x="226" y="292.0">Skew check (principle 11)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="middle" dominant-baseline="middle"><tspan x="226" y="319.8">same captured images through</tspan><tspan x="226" y="340.2">both preprocessing paths</tspan></text><rect x="464" y="260" width="412" height="104" rx="8" fill="#D4EFDF" stroke="#008F45" stroke-width="2" opacity="1.0"/><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#008F45" font-weight="bold" opacity="1.0" text-anchor="middle" dominant-baseline="middle"><tspan x="670" y="292.0">Cohort-level monitoring</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1A1A2E" font-weight="normal" opacity="1.0" text-anchor="middle" dominant-baseline="middle"><tspan x="670" y="319.8">accuracy by device and firmware,</tspan><tspan x="670" y="340.2">from day one</tspan></text></svg>