    shows: "the field table with the all-ones sentinel"

worked_examples:
  - name: "Napkin Math 13.1: the backlog budget"
    steps: ["given 204 GB/s, 360,448-byte backlog, 3 row conflicts at 37.5 ns, 4 KB snapshot", "one backlog 1.879 us, snapshot 0.020 us", "sense 40 us admits 21; WCET leaves 155 us and admits 82; deadline less 90 leaves 215 us and admits 114", "one channel: 28.4 us per backlog, 5 cross the WCET", "between 82 and 114 the tick is on time but refutes the placement"]
  - name: "Napkin Math 13.2: the thermal hangover"
    steps: ["given 45 C, 2 K/W, 8 s, 4 W and 26 W, trip 95, clear 85, 1.2 GHz halved", "steady states 53 and 97 C; trip after 24.7 s", "300,000 cycles take 500 us; response 590 us, 190 us past the deadline (47.5 percent)", "recovery 2.18 s, 2,175 ticks", "the lever is the heat path or an independent clock, not the tick's code"]
  - name: "Napkin Math 13.3: the board-link toll"
    steps: ["given 40 ms inference, 4,096 B at 25 MHz, 2 + 18 + 1 + 1 ms", "link 1.31 ms; allocation 63.3 ms, 82.3 mm of travel", "ceiling 131.0 mm / 1.3 m/s = 100.8 ms", "reserve 37.5 ms, 48.7 mm", "inference and validation dominate; the link is about 2 percent"]
  - name: "Equation 2 sensitivity (estimate activity)"
    steps: ["phi <= (250/135 - 1)/(S - 1)", "S = 21: 4.3 percent; S = 10: 9.5 percent, 12.8 us of the 135 us tick"]

active_learning:
  - at_minute: 3
    type: predict
    prompt: "Inference stops at the trip. When is the tick on time again?"
    answer: "About 2 s later: 2.18 s, 2,175 ticks (Napkin Math 13.2)."
  - at_minute: 19
    type: concept_question
    prompt: "Which shared rows can still delay or disable the tick on the on-die island (c)?"
    answer: "Die temperature and package, the fabric the proposals cross, the board supply, and a reset chain whose independence needs evidence (ch table 1)."
  - at_minute: 32
    type: estimate
    prompt: "If interference slowed stalls 10×, what share of the 135 us tick could be miss stall before the tick crosses 250 us?"
    answer: "(250/135 - 1)/9 = 9.5 percent, about 12.8 us (ch Checkpoint 13.1; calcs.py)."
  - at_minute: 46
    type: predict
    prompt: "A victim on its own core and own cache partition slows 345× under three write attackers. Which fix restores it?"
    answer: "C, capping the attackers' writes: 1.34× at 100 MB/s, 1.2× at 50 MB/s (Bechtel and Yun 2019, §VI). A dedicated core and a cache partition were already in place."
  - at_minute: 60
    type: concept_question
    prompt: "A loaded cycle runs 300 us against WCET 250 and deadline 400. Which claim does it refute?"
    answer: "It exceeds the WCET by 50 us; with 90 us charged the response is 390 us, 10 us inside the deadline; it refutes the placement's zero-interference timing premise (ch Checkpoint 13.3)."
  - at_minute: 66
    type: retrieval
    prompt: "Close your notes: name three couplings the hook's architecture diagram hid, and the remedy for each."
    answer: "Memory queue and miss handling (regulation, private memory); heat and the shared governor (heat path, independent clock); rail droop and reset (isolated rail, supervisor)."

open_questions:
  - "The integrator cannot program the island on its module. Should a safety argument ever rest on silicon features a vendor may withdraw in the next module generation?"
  - "A passing loaded campaign samples finite states. How many hours of loaded testing should a release require, and who decides?"
  - "Offload moves inference off the board, and wireless tails then decide admission. Which proposals, if any, may a robot accept from a data center?"

more_examples:
  - "Tesla Autopilot HW2.5: NVIDIA processors with an Infineon AURIX TC297 lockstep MCU on one board (Jurvetson photo, Commons)."
  - "NVIDIA Jetson AGX Orin: Cortex-R52 safety island present but not available to integrators; IGX Orin and DRIVE AGX Orin expose it (ch table 2)."
  - "FAA AC 20-193 (2024): interference channels must be identified and their mitigation verified on the target multicore."
  - "Bao static-partitioning hypervisor: Linux on 3 cores and FreeRTOS on 1 core of a Zynq UltraScale+ ZCU104, sharing a 64 KiB region."
  - "RT-2 (Brohan et al. 2023): 55B model at 1 to 3 Hz and 5B at about 5 Hz over a network, too slow to renew a 60 ms lease."
  - "FogROS2 (Ichnowski et al. 2023): grasp planning 14 s locally against 1.2 s offloaded."
  - "Bookout v. Toyota (Barr 2013), recalled in one line on the windowed-watchdog slide; Lecture 15 owns the case."

