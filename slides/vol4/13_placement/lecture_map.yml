segments:
  - name: Inventory
    minutes: "11-23"
    question: "What do two paths on separate cores still share?"
    aha: "Independence is argued one shared resource at a time; a separate core or chip is a hypothesis."
    read: "13.1, 13.2"
  - name: Memory
    minutes: "23-36"
    question: "Why does a mostly idle bus still miss a deadline?"
    aha: "Arbiters serve bursts, not averages, and shared-cache miss handling, not bandwidth, breaks the declared bound."
    read: "13.3"
  - name: Heat
    minutes: "36-44"
    question: "Why does the check stay late after inference stops?"
    aha: "Heat couples the paths on a timescale of seconds, so shedding load cannot rescue the tick in time."
    read: "13.4"
  - name: Remedies
    minutes: "44-59"
    question: "What does each fix cost, and how do separated paths talk?"
    aha: "Each remedy matches one coupling and is paid in a different currency; relocation costs a board link the stopping budget can afford."
    read: "13.5, 13.6"
  - name: Refutation
    minutes: "59-68"
    question: "What measurement could prove the placement wrong?"
    aha: "Any loaded tick above the declared WCET refutes the placement, even inside the deadline; the record carries what was and was not tested."
    read: "13.7, 13.8"

