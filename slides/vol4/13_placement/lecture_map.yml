notes_for_author:
  - "The hangover figure follows the chapter's figure 3 (fig-13-thermal-hysteresis) and Napkin Math 13.2: a 500 us throttled execution ending at 590 us, 190 us past the deadline, and a 47.5 percent overrun, with a 2.18 s cooldown."
  - "The 2.18 s hangover assumes the load stops at the trip point (onset at 95 C). If the proposer keeps running to the 97 C steady state, recovery is 2.55 s (derived in calcs.py); the deck says so in a note."
  - "The 10^7-tick trace percentiles are illustrative in the chapter and are labeled so on the slide."
