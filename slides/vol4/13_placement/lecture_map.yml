closing:
  return_to_hook: "The synthesis returns to the hook: the hangover, the memory queue, and the rail were three couplings no diagram showed; the discrete MCU removes the host governor and the shared DRAM, keeps the battery, and still owes a loaded test whose result the record does not yet hold."
  read_and_practice: ["13.1 to 13.10", "Checkpoints 13.1 to 13.3", "Napkin Math 13.1 to 13.3 by hand"]
  bridge: "Next lecture, Supervisory Intervention: why can handing a moving robot to a human operator cause the collision the handover was meant to prevent?"

