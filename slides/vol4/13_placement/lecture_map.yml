chapter: 13_placement
lecture: "13"
title: Workload Placement
subtitle: "Placing computations so safety checks meet deadlines"
minutes: 75
notes_minutes: 71.5
core_minutes: 58.5
recall: "Lecture 12: the enforcement record declares a 250 us WCET inside a 400 us deadline in a 1 ms tick; Lecture 4 placed the permission path on a discrete safety MCU as a hypothesis."
target_ideas: 30
layer: nervous
thread: "Third law, proposal is not permission (stated in Lecture 8; this lecture closes Part III). Record: the placement record."
part: "Part III, Running the Machine (the third law, proposal is not permission). This lecture closes Part III."
record: "Placement record (ch 13.8), the record this lecture adds to the record chain."

thesis: >-
  Separating the proposer and the permission path in software does not make
  them independent while they share memory, power, clocks, resets, or heat, so
  a placement is a hypothesis that loaded tests on the real silicon must try to
  refute.

hook:
  minutes: "0-5"
  setup: >-
    A real autonomy board (Tesla FSD computer, two SoCs on one board), then the
    thermal hangover of Napkin Math 13.2: a permission cluster on the
    application die, conduction-cooled bay at 45 C. After 24.7 s of continuous
    inference the junction reaches the 95 C trip and the governor halves the
    clock, so every 340 us tick becomes 590 us against a 400 us deadline
    (47.5 percent past it). The figure is revealed in three steps.
  question_to_class: "Inference stops at the trip. When is the safety tick on time again? A at once, B next tick, C about 2 s later, D never."
  payoff: "C: 2.18 s, 2,175 ticks, set by the package's thermal time constant and the governor's 85 C clear point. No architecture diagram shows this coupling."
  sources: ["ch Napkin Math 13.2 (illustrative parameters)", "book figure fig13_real_fsd_board.jpg (Votpuske, CC BY 4.0)"]

driving_question: "Why can a safety check miss its deadline even when it runs on its own processor core?"

running_example: >-
  The warehouse mobile manipulator's permission tick: 1 kHz on a discrete
  dual-core lockstep MCU at 400 MHz, unloaded 135 us (40 sense, 80 check, 15
  stage), declared WCET 250 us, deadline 400 us, 90 us of the MCU's own
  blocking and interference, so 60 us is all shared hardware may add. The
  proposer: 20 Hz chunk policy, p99 40 ms of each 50 ms on the application
  SoC. Aisle speed 1.3 m/s with 131.0 mm of spare clearance (Lecture 12).
  Shared-die numbers evaluate the same tick placed hypothetically on the SoC
  (candidates a and b), as the chapter does.

concept_questions:
  - q: "What must the permission path finish, by when, and how much can shared hardware add?"
    picture: "budget_step1-4: one tick drawn to scale, 135 to 250 to 310 to 400 to 1,000 us"
    numbers: "135, 250, 90, 310, 60 us (ch 13.2; derived in calcs.py)"
    example: "the running machine's MCU tick"
    read: "13.2"
  - q: "Does a separate core or chip make two paths independent?"
    picture: "Tesla HW2.5 board photo: NVIDIA processors and an Infineon AURIX TC297 lockstep MCU in its own package; board_step1-4 build"
    numbers: "ten shared-resource rows, four candidates (ch table 1)"
    example: "candidates a to d on the compute board"
    read: "13.2.1, 13.2.2"
  - q: "Which rows does each candidate still share, and can the integrator use the island?"
    picture: "inventory table; Jetson AGX Orin developer kit photo"
    numbers: "Jetson AGX Orin: island present, not available; DRIVE AGX Orin: available, 3 MB SRAM (ch table 2, NVIDIA 2023, 2026)"
    example: "candidate c rejected for exposure, not capability"
    read: "13.2.2"
  - q: "Why does a mostly idle memory bus still delay a safety read?"
    picture: "socmem.svg: the application SoC with CPU cluster, NPU, RT cores, shared fabric and LLC, one LPDDR5 controller queue (recall: the proposer streams weights every evaluation); eq 1"
    numbers: "one backlog 1.879 us at 204 GB/s; row conflict 37.5 ns (ch 13.3.1)"
    example: "weight tile, camera transfer, telemetry ahead of a 4 KB snapshot"
    read: "13.3.1"
  - q: "How many queued backlogs break the sense allowance, the WCET, the deadline?"
    picture: "backlog_step1-5 (ch figure 2 redrawn)"
    numbers: "21, 82, 114 backlogs; 5 on one channel (Napkin Math 13.1)"
    example: "FIFO model, full interleaving"
    read: "13.3.1"
  - q: "Which interference mechanism actually threatens the declared bound?"
    picture: "measured.svg: published slowdowns; stallshare_step1-2 (eq 2)"
    numbers: "2.1×, 7.9×, 10.6×, 21.4× (Valsan et al. 2016, Fig. 2b, 2e); 346× (Bechtel and Yun 2019, IV-C); tolerable stall share 4.3% at 21×, 0.28% at 300× (ch 13.3.2)"
    example: "victim on its own core and cache partition"
    read: "13.3.2"
  - q: "Why does the check stay late after inference stops?"
    picture: "Tesla Autopilot cooling plate photo; Jetson AGX Orin thermal-zone source; hangover_step1-2"
    numbers: "24.7 s to trip, 500 us tick, 590 us response, 2.18 s and 2,175 ticks (Napkin Math 13.2)"
    example: "candidate b on a shared governor"
    read: "13.4"
  - q: "On what timescales do the couplings act?"
    picture: "ladder.svg"
    numbers: "2 ns droop rise, 37.5 ns bank conflict, 1.88 us backlog, 1 ms tick, 2.18 s recovery (ch 13.4); 138 mV droop and 39 percent gate delay (ch 13.3.3)"
    example: "rail-correlated against temperature-correlated spikes"
    read: "13.3.3, 13.4"
  - q: "A loaded test fails. Which remedy matches which coupling, and what does it cost?"
    picture: "remediation table; regulation_step1-2 (Bechtel and Yun 2019, §VI); Bao static-partitioning config"
    numbers: "345× to 1.34× with writes capped at 100 MB/s, 1.2× at 50 MB/s"
    example: "MemGuard-style regulation, cache coloring, workload reduction, relocation"
    read: "13.6.1"
  - q: "What does relocation to a discrete MCU cost in the stopping budget?"
    picture: "boardlink_step1-2"
    numbers: "1.31 ms link of 63.3 ms allocation under a 100.8 ms ceiling, 37.5 ms or 48.7 mm reserve (Napkin Math 13.3)"
    example: "25 MHz SPI, 4,096-byte chunk"
    read: "13.6.2, 13.6.3"
  - q: "Once separated, how do the two paths exchange a proposal without waiting?"
    picture: "Linux seqlock retry loop (Documentation/locking/seqlock.rst) beside the single-attempt rule"
    numbers: "one read attempt per tick"
    example: "a proposer that crashes mid-publication"
    read: "13.5.1"
  - q: "How does hardware know the enforcer is alive and on schedule?"
    picture: "watchdog_step1-3"
    numbers: "5 ms timeout = 6.5 mm at 1.3 m/s (derived)"
    example: "early feed from a corrupted program counter; late feed from a starved core"
    read: "13.5.2"
  - q: "What measurement could prove the placement wrong?"
    picture: "focus slide, eq 7; trace_step1-2 (illustrative percentiles); FAA AC 20-193 para. 5.5.3"
    numbers: "260 us refutes at 250 even inside 400; hot p99 330 us (illustrative)"
    example: "10^7-tick campaign, 2 h 46 min 40 s"
    read: "13.7"
  - q: "What does the placement record carry to release?"
    picture: "placement record table with the all-ones sentinel"
    numbers: "nominal 1 ms, deadline 400 us, loaded max 0xFFFFFFFFFFFFFFFF (ch table 4)"
    example: "the running machine's record, loaded field still empty"
    read: "13.8"

