<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
</defs>
<rect width="900" height="330" fill="white"/>
<rect x="8" y="8" width="222" height="118" rx="6" fill="#F8FAFC" stroke="#334155" stroke-width="2.2" stroke-dasharray="7,5"/>
<text x="119" y="34.0" font-size="19" fill="#1A1A2E" text-anchor="middle" font-weight="bold">Context: envelope</text>
<text x="119" y="60.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="normal">payload ≤ 50 kg</text>
<text x="119" y="81.96000000000001" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="normal">floor μ ≥ 0.204</text>
<text x="119" y="103.92" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="normal">person stands still</text>
<rect x="262" y="8" width="400" height="66" rx="6" fill="#DCFCE7" stroke="#059669" stroke-width="2.6"/>
<text x="462" y="34.0" font-size="20" fill="#1A1A2E" text-anchor="middle" font-weight="bold">Claim C1a: the base stops inside 1.10 m</text>
<text x="462" y="60.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="normal">at 1.3 m/s, loaded (d_stop ≤ D_clear)</text>
<line x1="230" y1="41" x2="262" y2="41" stroke="#334155" stroke-width="2" stroke-dasharray="5,4"/>
<rect x="262" y="104" width="400" height="66" rx="6" fill="white" stroke="#334155" stroke-width="2.2"/>
<text x="462" y="130.0" font-size="19" fill="#1A1A2E" text-anchor="middle" font-weight="bold">Warrant: the stopping budget bounds</text>
<text x="462" y="156.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="normal">travel if every term is bounded</text>
<line x1="462" y1="104" x2="462" y2="77" stroke="#334155" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="46" y="228" width="200" height="66" rx="6" fill="white" stroke="#059669" stroke-width="2.0"/>
<text x="146" y="255.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="bold">Loaded stop trials</text>
<text x="146" y="281.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="normal">a_brake ≥ 2 m/s²</text>
<line x1="146" y1="228" x2="387.0" y2="173" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<rect x="252" y="228" width="200" height="66" rx="6" fill="white" stroke="#059669" stroke-width="2.0"/>
<text x="352" y="255.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="bold">Brake-onset trials</text>
<text x="352" y="281.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="normal">≤ 20 ms</text>
<line x1="352" y1="228" x2="437.0" y2="173" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<rect x="458" y="228" width="200" height="66" rx="6" fill="white" stroke="#059669" stroke-width="2.0"/>
<text x="558" y="255.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="bold">End-to-end age trace</text>
<text x="558" y="281.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="normal">51.6 ms</text>
<line x1="558" y1="228" x2="487.0" y2="173" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<rect x="664" y="228" width="200" height="66" rx="6" fill="white" stroke="#059669" stroke-width="2.0"/>
<text x="764" y="255.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="bold">Site survey</text>
<text x="764" y="281.0" font-size="18" fill="#1A1A2E" text-anchor="middle" font-weight="normal">D_clear 1.10 m</text>
<line x1="764" y1="228" x2="537.0" y2="173" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<text x="450" y="320" font-size="18" fill="#059669" text-anchor="middle" font-weight="bold">Evidence: calibrated records with stated uncertainty</text>
<rect x="8" y="134" width="222" height="56" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="2.2" stroke-dasharray="3,4"/>
<text x="119" y="156.0" font-size="18" fill="#6B7280" text-anchor="middle" font-weight="bold">1,000 clean runs</text>
<text x="119" y="178.0" font-size="17" fill="#6B7280" text-anchor="middle" font-weight="normal">a demonstration</text>
<text x="10" y="207" font-size="15" fill="#DC2626" text-anchor="start" font-weight="bold">not evidence for</text>
<text x="10" y="223" font-size="15" fill="#DC2626" text-anchor="start" font-weight="bold">new conditions</text>
</svg>
