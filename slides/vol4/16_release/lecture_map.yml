notes_for_author:
  - "36 frames (63 pages with builds), above the brief's 25 to 32: the chapter owns seven first-order concepts and the plan has no second lecture for it. Cut the four optional frames to reach 32."
  - "The Challenger data set temperatures are the calculated joint temperatures of Rogers figure 7; Challenger is plotted at the Commission's 28 +/- 5 F joint estimate with the 36 F air temperature labeled."
  - "The chapter's own Waymo figure and DMV map are replaced by slide-size redraws and real artifacts; the kit still lacks the record-chain figure, so the manifest figure draws its own."
