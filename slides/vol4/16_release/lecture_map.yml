closing:
  return_to_hook: "Synthesis table writes Challenger and the mug case as release cases: claim, weakest premise, status, verdict, standing condition."
  read_and_practice: ["§16.1 to §16.11", "Checkpoints 16.1 to 16.3", "Napkin Math 16.1 and 16.2"]
  further_reading:
    - cite: "Presidential Commission on the Space Shuttle Challenger Accident, Report, 1986"
      url: "https://history.nasa.gov/rogersrep/genindex.htm"
      why: "The hook's documents, testimony, and flight-history figures."
    - cite: "Kelly, Arguing Safety: A Systematic Approach to Managing Safety Cases, 1998"
      url: "https://www-users.york.ac.uk/~tpk/tim_kelly_thesis.pdf"
      why: "Goal Structuring Notation."
    - cite: "Knight and Leveson, An Experimental Evaluation of the Assumption of Independence in Multiversion Programming, IEEE TSE 1986"
      url: "https://doi.org/10.1109/TSE.1986.6312924"
      why: "Why diverse legs must be shown independent."
    - cite: "Vaughan, The Challenger Launch Decision, 1996"
      url: "https://press.uchicago.edu/ucp/books/book/chicago/C/bo22781921.html"
      why: "Normalization of deviance."
    - cite: "Kusano et al., Comparison of Waymo Rider-Only Crash Rates by Crash Type to Human Benchmarks, Traffic Injury Prevention 2025"
      url: "https://doi.org/10.1080/15389588.2025.2499887"
      why: "Fleet evidence reported outcome by outcome."
  bridge: "Next lecture (Lecture 17, Responsible Physical AI): who answers for a machine that moves on its own when its motion harms someone?"

