chapter: 16_release
lecture: "16"
title: "Deployment Release"
layer: governance
minutes: 75
notes_minutes: 71
core_minutes: 59.5
target_ideas: 30
thesis: "Permission to operate is a claim about every condition the machine may meet next, so release states which physical claims the evidence supports, refuses wherever a premise is unknown, and expires when a premise's justification does."

hook:
  minutes: "0.5-3.5"
  setup: "Challenger, 28 January 1986 (War Story 16.1). Photos: icicles on the launch tower (NASA) and smoke at the right booster's aft field joint at ignition (NASA). Air 36 F, 15 F colder than any earlier launch; the coldest earlier flight joint was 53 F; Thiokol's engineers recommended no launch below 53 F."
  question_to_class: "What did 24 returned flights say about 36 F? A) safe, every flight came back B) unsafe, cold flights damaged seals C) nothing, no flight was that cold"
  payoff: "C is the release answer: the premise was unknown, and unknown refuses. The O-ring frame shows the whole record also leans to B. The synthesis writes Challenger as a release case: claim, weakest premise, status unknown, REFUSE, and the missing standing condition."
  sources:
    - "Deployment Release, War Story 16.1."
    - "Rogers Commission report, 1986: ch. IV finding 6 (36 F air, 15 F lower, joint 28 +/- 5 F); ch. V (Thiokol chart p. 90, assessment p. 97, Lund and Thomas testimony); ch. VI (figures 6 and 7, finding 3, criticality 1R to 1 in 1982). https://history.nasa.gov/rogersrep/"

recall: "Lecture 15, close your notes: what does a fault record contain, and how soon must the base brake when the proposer stalls? Injected fault, precommitted oracle, observed trace; the set names unreached regimes. Brake onset within 82 ms (60 + 1 + 1 + 20)."

driving_question: "Why can a machine that completes every trial still lack the evidence to be allowed among people?"

goals:
  - "Write release as physical inequalities, and find how much clear distance the aisle stop leaves."
  - "Build a safety case, and find the premise that limits it."
  - "Sign UNCOND, COND, or REFUSE, and name the measurement that would change it."
  - "Bind the verdict to one configuration and its standing conditions, and say what an update reopens."

law_and_record: "Part IV law: the fourth law, permission must be earned (a design principle, not a physical law). Record added: the release manifest."

running_example: "The warehouse mobile manipulator (running machine; MLSysIM registry): 1.3 m/s aisle speed (chosen), 1.10 m clear distance, 2 m/s2 credible deceleration (illustrative), 368 kg loaded; the restricted mug-delivery case with claims C0 to C6. Shown as a real machine of its class: ER-FLEX (MiR250 base with a UR16e arm). Real fleet beside it: Waymo (crash rates by outcome; three NHTSA software recalls)."

segments:
  - name: Claims
    divider_question: "What does a release decide, and on what evidence?"
    read: "§16.1 to §16.3.1"
    concept_questions: [1, 2, 3, 4]
    land: "A claim is an inequality over an envelope, and the case says why the evidence supports it."
    minutes: 11.5
  - name: Premises
    divider_question: "Why is a case no stronger than its weakest premise?"
    read: "§16.3.2 to §16.3.4"
    concept_questions: [5, 6]
    land: "Required premises multiply; only legs shown to be independent add; a certificate covers one configuration."
    minutes: 8
  - name: Verdicts
    divider_question: "What may the adjudicator sign when a premise is unknown?"
    read: "§16.4 and §16.6"
    concept_questions: [7, 8, 9, 10]
    land: "Unknown refuses; refusal names the measurement; COND needs its own evidence."
    minutes: 13.5
  - name: Expiry
    divider_question: "When does a granted verdict lapse?"
    read: "§16.5, §16.7, §16.9.5 and §16.9.6"
    concept_questions: [11, 12, 13]
    land: "A verdict lives while every premise is known-true, checked at a cadence set by its wear."
    minutes: 12
  - name: Updates
    divider_question: "What does the machine check before it moves, and what does an update reopen?"
    read: "§16.8 and §16.9.1 to §16.9.4"
    concept_questions: [14, 15]
    land: "The manifest binds records, binaries, and calibration by digest; an update reopens what its change touches."
    minutes: 13

concept_questions:
  - q: "What does a record of successes support?"
    picture: "Plot of O-ring distress against joint temperature for the 23 flights, 3 steps: distress-only flights (Rogers fig. 6), all flights (fig. 7), the no-evidence region and Challenger's 28 +/- 5 F joint."
    numbers: "4 of 4 flights at 63 F or colder had distress; 3 of 19 at 66 F or warmer (counted in calcs.py from Dalal et al. 1989, table 1, UCI)."
    example: "Challenger."
    read: "§16.7, War Story 16.1"
  - q: "What exactly does release decide?"
    picture: "ER-FLEX photo beside the three inequalities and the envelope."
    numbers: "Stop inside 1.10 m at 1.3 m/s; latch 100 N at 0.03 m/s; handover 50 N at 0.10 m/s; WCET 250 of 400 us (DR equation 1, table 1)."
    example: "The running machine."
    read: "§16.2"
  - q: "How much clear distance does the aisle stop leave, and what spends it?"
    picture: "Stacked bar in 3 steps: reaction and braking; allowances and spare; admission and reserve."
    numbers: "173.7 + 605.3 + 50 + 40 + 100 = 969.0 mm; spare 131.0 mm = 100.8 ms or a 31 percent weaker brake (1.39 m/s2); admission 82.3 mm leaves 48.7 mm (NM 16.1; calcs.py)."
    example: "The aisle run."
    read: "§16.2, NM 16.1"
  - q: "How does evidence support a claim?"
    picture: "CAE tree for C1a in 3 steps: claim, context, warrant, evidence leaves; a demonstration that is not evidence; the oil-film defeater."
    numbers: "Exposure wall: 1e-9 per hour needs 3.0e9 failure-free hours at 95 percent (derived; Lecture 7)."
    example: "Base-stop claim."
    read: "§16.3.1"
  - q: "How strong is a case with many premises?"
    picture: "Series chain and parallel legs (2 steps) beside the Rogers field-joint drawing."
    numbers: "Ten premises at 0.99: 0.904; two independent legs at 0.90: 0.99 (stipulated, derived)."
    example: "Two O-rings reclassified from 1R to 1 (Rogers ch. VI)."
    read: "§16.3.2"
  - q: "Which standards govern, and what does a certificate cover?"
    picture: "Standards table and a Keyence SZ-V32 datasheet excerpt."
    numbers: "80 ms high-speed against 160 ms standard response: 104 against 208 mm at 1.3 m/s (derived)."
    example: "The running machine's scanner."
    read: "§16.3.4"
  - q: "What happens when the burden of proof inverts?"
    picture: "Thiokol's handwritten recommendation and the signed launch assessment (Rogers vol. 1, pp. 90, 97)."
    numbers: "53 F floor from the coldest flight."
    example: "Challenger teleconference, 27 January 1986."
    read: "War Story 16.1"
  - q: "What can an adjudicator sign?"
    picture: "Three verdict cards; DRIVE PILOT approved-roads map and DMV permit excerpt."
    numbers: "DMV permit: highways, daylight, at most 40 mph (California DMV, 8 June 2023)."
    example: "Mercedes-Benz DRIVE PILOT as a real COND."
    read: "§16.4"
  - q: "Can the door branch be signed?"
    picture: "Log ladder of arm deceleration needed (2 steps) with predict choices."
    numbers: "39 N at onset; 0.15 mm left; about 3 m/s2 at 0.03 m/s; 400 m/s2 at 0.10 m/s, 136 times (MLSysIM, calcs.py)."
    example: "Spring-latched cage door."
    read: "§16.6"
  - q: "What does the whole case decide on the book's evidence, and what would change it?"
    picture: "Mug-delivery tree in 3 steps: claims and leaves; maturity legend and defeater; REFUSE on every branch. Then a COND frame with the fence photo."
    numbers: "Inspected floor 0.12: 1.18 m/s2, ceiling 1.23 m/s, signed 1 m/s (calcs.py)."
    example: "Restricted mug delivery."
    read: "§16.6, §16.6.1"
  - q: "What does fleet exposure license?"
    picture: "Waymo crash-rate intervals by outcome, 2 steps."
    numbers: "271 million rider-only miles; injury 79 to 85 percent (183 crashes); serious injury 83 to 99 (3); fatal 18 to 98 (2) (Waymo Safety Impact Data Hub via MLSysIM)."
    example: "Waymo."
    read: "§16.9.6"
  - q: "How does a verdict stay alive?"
    picture: "Standing-condition table (premise, detector, cadence, response); envelope trichotomy diagram."
    numbers: "1 ms tick; payload each pick; 31 percent brake loss spends the spare."
    example: "Running machine premises."
    read: "§16.5"
  - q: "How far does the base travel when evidence goes missing?"
    picture: "Three timelines, 2 steps."
    numbers: "82 ms, 106.6 mm silent; 22 ms, 28.6 mm flagged at once; up to 78 mm saved only if the flag arrives within 60 ms (NM 16.2)."
    example: "Proposer stall and monitored premise."
    read: "§16.5.3, NM 16.2"
  - q: "What does the machine check before it moves?"
    picture: "Manifest figure in 3 steps: records by lecture, manifest fields, gate; TUF targets.json excerpt and HSM photo."
    numbers: "Thirteen upstream records bound under one Merkle root."
    example: "The running machine's release gate."
    read: "§16.8"
  - q: "What does an update reopen, and how is it qualified?"
    picture: "NHTSA recall table (Waymo 24E-013, 24E-049, 25E-034); reopen matrix; shadow and canary vote."
    numbers: "444, 672, 1,212 vehicles over 15 months; 311 J at 1.3 m/s and 368 kg (derived)."
    example: "Waymo recalls; retrained mug-delivery policy."
    read: "§16.9.1 to §16.9.4"

concept_trace:
  - concept: Safety case
    frame: "A safety case links each claim to evidence through a warrant"
    shows: "CAE tree for C1a: claim, envelope context, warrant, four evidence leaves; demonstration marked as not evidence; defeater added in step 3."
  - concept: Conjunctive premises and diverse legs
    frame: "Required premises multiply; only independent legs add"
    shows: "Ten 0.99 links giving 0.904, then two 0.90 legs giving 0.99 only if independent, beside the field-joint drawing."
  - concept: Three signed verdicts
    frame: "A verdict is a signed permit for a stated envelope"
    shows: "UNCOND, COND, REFUSE cards with the DRIVE PILOT permit as a real COND; applied in the door predict and the all-REFUSE tree."
  - concept: Standing conditions
    frame: "Each premise needs a detector, a cadence, and a response"
    shows: "Six-row table of premise, detector, cadence, and response; the checksum-versus-pose build."
  - concept: Release manifest
    frame: "The release manifest binds every record to one configuration"
    shows: "Three-step figure: thirteen records by lecture, manifest fields under a Merkle root, the gate to UNCOND/COND or REFUSE."
  - concept: Updates reopen claims
    frame: "An update reopens every claim whose evidence it touches"
    shows: "Matrix of five changes against six evidence columns, including the unchanged enforcer binary and the worn brake."
  - concept: Certification authorizes a configuration
    frame: "Certification authorizes one configuration with its evidence"
    shows: "Machinery standards table and the scanner datasheet whose rating and response time depend on its configured mode."

worked_examples:
  - name: "Napkin Math 16.1: the aisle spare"
    steps: ["Given 1.3 m/s, 133.6 ms, 2 m/s2, 7.11 m/s3, allowances 50, 40, 100 mm", "Reaction 173.7 mm; braking 605.3 mm", "969.0 mm used, 131.0 mm spare", "One input wrong: 100.8 ms or 1.39 m/s2 (31 percent)", "Admission 82.3 mm leaves 48.7 mm"]
  - name: "Napkin Math 16.2: the silent-proposer window"
    steps: ["Given 1.3 mm per ms; lease 60, tick 1, bus 1, onset 20 ms", "Silent: 82 ms, 106.6 mm", "Flag at once: 22 ms, 28.6 mm", "Saves up to 78 mm only if the flag arrives within 60 ms"]
  - name: "Restricted mug delivery (§16.6.1), with the door branch (§16.6)"
    steps: ["Door: 39 N at onset, 0.15 mm left, about 3 m/s2 needed; 400 m/s2 at 0.10 m/s", "Every claim refuses on the book's evidence", "Stipulated evidence: floor 0.12 gives 1.18 m/s2 and a 1.23 m/s ceiling", "COND at 1 m/s, local authority only; any spill returns REFUSE"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "What did 24 flights say about 36 F?"
    answer: "C: nothing; the premise was unknown, so it refuses."
  - at_minute: 3.5
    type: retrieval
    prompt: "What does a fault record prove?"
    answer: "Fault, precommitted oracle, trace; onset within 82 ms for the stall."
  - at_minute: 12
    type: estimate
    prompt: "How much clear distance is left?"
    answer: "131.0 mm, 48.7 mm after admission; 31 percent weaker braking spends the spare."
  - at_minute: 21.5
    type: concept_question
    prompt: "Vote: which statements hold? (premises and legs)"
    answer: "F, F, F, T (0.904; shared chip; no compensation; dim light is a premise)."
  - at_minute: 31.5
    type: predict
    prompt: "Can the door branch be signed?"
    answer: "C, REFUSE: the arm's 3 m/s2 stop in 0.15 mm is unmeasured."
  - at_minute: 40
    type: predict
    prompt: "Which crash outcome is least certain?"
    answer: "Fatal: 2 crashes, 18 to 98 percent."
  - at_minute: 47
    type: estimate
    prompt: "How far does the base travel blind?"
    answer: "106.6 mm silent; 28.6 mm flagged at once; gain only if the flag arrives within 60 ms."
  - at_minute: 61
    type: concept_question
    prompt: "Vote: what qualifies an updated policy?"
    answer: "F (shadow mode cannot qualify), F (fewer machines do not bound one action's 311 J), T (contained canary with a prefixed non-inferiority margin)."
  - at_minute: 64
    type: retrieval
    prompt: "What verdict should Challenger have got?"
    answer: "REFUSE: the joint premise (53 F or warmer) was unknown at about 28 F."

fallacies:
  - "A release verdict is permanent (standing-conditions frame and its WARN)."
  - "Web-style canary routing applies to physical machines (update vote, item 2)."
  - "Shadow-mode qualification guarantees closed-loop stability (update vote, item 1)."
  - "Statistical coverage substitutes for architectural warrants (CAE frame, step 2 and note)."

open_questions:
  - "A fleet ships software every week. Which claims can a weekly release re-qualify, and which need a slower cadence?"
  - "Who should sign a release: the builder, an independent assessor, or a regulator? What does each signature prove?"
  - "Waymo's fatal-outcome interval spans 18 to 98 percent. When is that enough evidence to expand a fleet?"

more_examples:
  - "Challenger O-ring record and Thiokol documents (Rogers Commission 1986; Dalal et al. 1989)."
  - "Mercedes-Benz DRIVE PILOT deployment permit (California DMV, 8 June 2023)."
