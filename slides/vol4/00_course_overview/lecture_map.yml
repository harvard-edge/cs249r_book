chapter: 00_course_overview
lecture: "00"
title: Course Overview
subtitle: "Physical AI: Machine Learning Systems That Sense and Act"
minutes: 75
notes_minutes: 71.0
core_minutes: 57.0
recall: "none: Lecture 0 opens the course and recalls no earlier lecture."
target_ideas: 16
role: "The course's motivational overview (author decision, 2026-10-19): why physical AI matters now, what the subject is, what students will be able to do, how the course runs, and two short curiosity activities. It teaches no mechanism; every idea Lecture 1 teaches appears here at most as a one-line promise."
thesis: "Learned models now move machines that work among people, and motion cannot be taken back. The course teaches how to build such a machine so that every action is timed, checked, and allowed on evidence."
thread_line: "Thread: irreversibility at the causal boundary. Record: none yet; Lecture 1 shows the chain."
hook:
  minutes: "0-7"
  setup: "A photo of a Waymo car in San Francisco with no one in the driver's seat; Waymo publishes the miles its fleet drives with no human driver."
  question_to_class: "How many rider-only miles from July 2025 to June 2026? A 1.75 million, B 17.5 million, C 175 million, D 1.75 billion."
  payoff: "C, 175.4 million (derived: 271.3 minus 96.0 million cumulative), about 480,000 miles a day; the plot shows cumulative miles growing 12.2 times from June 2024 to June 2026. The synthesis returns to the 175 million miles: each one depended on the four questions the four parts answer."
  sources: ["Waymo Safety Impact Data Hub, rider-only mileage releases, via MLSysIM Literature.Series.WaymoRiderOnlyMiles", "commons.wikimedia.org/wiki/File:Waymo_Jaguar_I-Pace_in_San_Francisco_2023_dllu.jpg"]
driving_question: "What does it take to let a learned model move a machine?"
running_example: "The warehouse mobile manipulator (the running machine), introduced as the course's one machine with its three recurring scenes (aisle run, cage door, mug), shown as a real machine of its class by an ER-FLEX (MiR250 base, UR16e arm) with datasheet values. No machine-card numbers and no stopping arithmetic: Lecture 1 owns both."
concept_questions:
  - q: "How much do driverless cars drive today?"
    picture: "Waymo photo with a four-choice vote; cumulative rider-only miles in two build steps"
    numbers: "22.2 million (June 2024) to 271.3 million (June 2026), 12.2 times; 175 million in the last 12 months; 480,449 miles a day (Waymo Safety Impact Data Hub via MLSysIM; derived in calcs.py)"
    example: "Predict, then the curve"
    read: "The Causal Boundary, §1.2"
  - q: "How many robots already work in factories and warehouses?"
    picture: "KUKA spot-welding line photo with the IFR numbers; Amazon drive unit photo with the one-millionth-robot number"
    numbers: "542,000 industrial robots installed in 2024, 4,664,000 in operation (IFR World Robotics 2025 press release, 25 Sep 2025); Amazon's one millionth robot and DeepFleet, a projected 10 percent travel-time gain (aboutamazon.com, July 2025)"
    example: "Programmed arms on a car line; a learned model planning a warehouse fleet"
    read: "§1.2"
  - q: "What changed in the last few years?"
    picture: "ALOHA 2 workcell fleet and a Unitree G1 humanoid"
    numbers: "None on the slide; 2023 to 2025 for vision-language-action models (§1.2)"
    example: "Models pretrained on web data fine-tuned to emit robot actions"
    read: "§1.2"
  - q: "What separates physical AI from the robots we already have?"
    picture: "A fenced robotic work area beside a warehouse aisle"
    numbers: "None"
    example: "Programmed motion behind a fence against learned motion among people; the exact scope test is a one-line promise to Lecture 1"
    read: "§1.1, §1.3"
  - q: "What is such a machine made of?"
    picture: "ER-FLEX photo with three cards: body (datasheet values), brain, nervous system"
    numbers: "MiR250: 97 kg, 250 kg payload, two SICK safety laser scanners, two 3D cameras (MiR250 specifications, 2023-06-28); UR16e: 6 joints, 16 kg payload, 900 mm reach (Universal Robots datasheet)"
    example: "Part I's three lectures, one per part"
    read: "§1.3; Reader Guide"
  - q: "Who builds these machines?"
    picture: "Three photos: an ALOHA 2 fleet, an NVIDIA Jetson AGX Orin, a BLDC stator winding"
    numbers: "None"
    example: "Machine learning, embedded systems, robotics and control (Reader Guide, 'Learning across disciplinary boundaries')"
    read: "Reader Guide"
  - q: "What will you be able to do by the end?"
    picture: "Five outcomes, each beside a photo of a real system"
    numbers: "None"
    example: "Course plan outcomes, one per part plus the opening"
    read: "Volume IV course plan"
  - q: "Which real systems will the course open on?"
    picture: "Six photos with lecture number and question: Schiaparelli (L2), Pathfinder (L4), Dactyl (L6), Spirit (L9), Toyota Camry (L15), Challenger (L16)"
    numbers: "Years only"
    example: "One question per case, never answered here"
    read: "each lecture's chapter"
  - q: "How is the course organized?"
    picture: "Kit course_order; one machine and three scenes; kit stack_roadmap; one focus slide naming the golden thread"
    numbers: "Eighteen lectures, four parts"
    example: "The aisle run, the cage door, the mug"
    read: "§1.11"
  - q: "How does each meeting run, and what do I need?"
    picture: "Before, during, after cards beside a TIAGo++ photo; prerequisites cards"
    numbers: "An activity at least every 15 minutes"
    example: "Instructor fills in logistics"
    read: "Reader Guide, 'The Technical Starting Point'"
  - q: "What does it take to let a learned model move a machine?"
    picture: "Waymo photo with the four parts' questions revealed one per step"
    numbers: "175 million miles in a year"
    example: "Synthesis of the first discussion's board"
    read: "§1.11"
concept_trace: []
concept_trace_note: "Lecture 0 owns no concepts (course plan; ownership.yml has no Lecture 0 owner). It names the golden thread twice without teaching it: the thread line on the goals slide ('Thread: irreversibility at the causal boundary. Record: none yet; Lecture 1 shows the chain.', the volume's one goals-slide form) and the focus slide 'Motion cannot be taken back'."
worked_examples: []
worked_examples_note: "None by design. The elementary stopping budget and the clean-run ladder, worked here before, belong to Lecture 1 and Lecture 7."
active_learning:
  - at_minute: 1.5
    type: predict
    prompt: "How many miles did Waymo's driverless cars drive from July 2025 to June 2026? A 1.75 million, B 17.5 million, C 175 million, D 1.75 billion"
    answer: "C, 175.4 million (calcs.py); about 480,000 a day."
  - at_minute: 16
    type: discuss
    prompt: "Which machine would you work beside (drive unit, driverless car, mobile manipulator, humanoid), and what would you want to know first?"
    answer: "No right machine. The questions sort into four groups (how fast it can stop; what it learned and how it was tested; what can overrule it; who allowed it and until when), the four parts. Keep the board for the synthesis."
  - at_minute: 25.5
    type: discuss
    first_taste: true
    prompt: "A person steps out at the rack end. List every step from light reaching the camera to the base standing still."
    answer: "Exposure and readout, transfer, perception, proposal, permission check, bus to the drives, brake onset, braking travel; the base moves through all of them. No numbers today; Lecture 1 puts a distance on each step and Lecture 8 measures the first ones."
  - at_minute: 39
    type: concept_question
    prompt: "Which part of a machine fails most often: the learned model, the software around it, the hardware and its limits, the people and their decisions?"
    answer: "Held open; the tally is kept for Lecture 18. Hint given: five of the six cases on the previous slide ran no learned model."
  - at_minute: 52
    type: discuss
    first_taste: true
    prompt: "An arm opens a spring-latched door 20 times with no failure. Would you stand beside it for run 21? What else would you want to know?"
    answer: "Twenty clean runs do not show 100 percent; Lecture 7 computes how much less. The other questions (same door? what if it fails? what stops it?) belong to Parts III and IV. No number given today."
  - at_minute: 63
    type: retrieval
    prompt: "Close your notes: one number that shows physical AI is here; what a fenced robot cell lacks; the question each part answers."
    answer: "175 million driverless miles in a year or 4.66 million factory robots; a learned model choosing motion among people; react in time, evidence, refusal, permission."
open_questions:
  - "If a model is right 999 times in 1,000, what should the machine do on the thousandth, and who decides?"
  - "Which will limit physical AI first: computation on the robot, data from robots, or evidence about robots?"
  - "When a robot and a person share an aisle, should the robot's uncertainty cost the robot speed or the person attention?"
