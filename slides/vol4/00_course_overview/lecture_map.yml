chapter: 00_course_overview
lecture: "00"
title: Course Overview
subtitle: "Physical AI: Machine Learning Systems That Sense and Act"
minutes: 75
notes_minutes: 70.0
core_minutes: 58.5
recall: "none: Lecture 0 opens the course and recalls no earlier lecture."
target_ideas: 28
thesis: "Once a learned model's output moves mass, the time and evidence behind each action are paid in physical clearance, so the machine is built so that an independent path can refuse an action before that clearance runs out."
hook:
  minutes: "0-6"
  setup: "A real mobile manipulator of the warehouse class (an ER-FLEX: MiR250 base with a UR16e arm), then the course's running machine in an aisle at its 1.5 m/s drive limit while a person steps out at the rack end."
  question_to_class: "How far does the base travel while perception processes one camera frame? A 1 mm, B 10 mm, C 80 mm, D 800 mm."
  payoff: "C, 77.4 mm: the frame is 51.6 ms old when perception dispatches it, and 24.6 ms of that is exposure and readout before any computation. The synthesis returns to the same aisle with the whole elementary stop, 762.9 mm of 1,100 mm."
  sources: ["Sensor Perception, Napkin Math 8.2", "The Causal Boundary, Napkin Math 1.1", "commons.wikimedia.org/wiki/File:ER-FLEX_mobile_manipulator.jpg"]
driving_question: "How far does a robot travel while it decides?"
running_example: "The warehouse mobile manipulator on its aisle run toward a rack end (machine card, The Causal Boundary §1.4.2, table 2): 368 kg loaded, 1.5 m/s drive limit (illustrative), 2 m/s^2 credible deceleration (illustrative), 1.10 m clear distance (illustrative), 133.6 ms pre-brake delay (derived). Shown as a real system by a photo of a machine of the same class (ER-FLEX)."
concept_questions:
  - q: "How far does the robot travel while one camera frame is processed?"
    picture: "ER-FLEX photo with a four-choice vote; aisle top view built in two steps; frame-age bar by stage"
    numbers: "51.6 ms from exposure midpoint to dispatch, 77.4 mm at 1.5 m/s; exposure and readout 24.6 ms (Napkin Math 8.2; derived in calcs.py)"
    example: "Predict first, then reveal"
    read: "The Causal Boundary §1.4.3; Sensor Perception §8.4.1"
  - q: "What changes when a model's output moves mass?"
    picture: "Comparison table of the three digital privileges against their physical replacements, beside the ER-FLEX photo"
    numbers: "An agent behind the glass may take 200 ms or 30 s and the environment waits (§1.1)"
    example: "Elastic time, rollback, discrete interfaces lost"
    read: "§1.1"
  - q: "What makes a system physical AI?"
    picture: "Scope-test Venn: learned model, physical feedback, delegated authority (§1.6, figure 6)"
    numbers: "None"
    example: "Advisory, digital autonomy, classical control in the pairwise overlaps"
    read: "§1.6"
  - q: "Where did physical AI come from, and how large are its models?"
    picture: "Photos of a Unimate (1967) and Shakey (1969) and the ER-FLEX, over a band of where the learned output lands (§1.2, figure 1); Epoch AI compute scatter (§1.2, figure 2)"
    numbers: "OpenVLA (2024) trained on about 350 times less compute than the largest language model of its year, GR00T N1 (2025) about 7,000 times less; 25 robotics models carry a compute estimate (Epoch AI via MLSysIM; calcs.py prints 345 and 7,019)"
    example: "OpenVLA and GR00T N1 labeled on the scatter"
    read: "§1.2"
  - q: "Where does a command become physical work?"
    picture: "Command-to-motion chain in four steps (setpoint, current in a winding, torque, accelerating mass) beside a photo of a real stator winding"
    numbers: "None"
    example: "Definition 1.2, causal boundary"
    read: "§1.4.1"
  - q: "What machine will we study all semester?"
    picture: "Machine card as a table beside the ER-FLEX photo"
    numbers: "368 kg; 1.5 m/s; 2 m/s^2; 1.10 m; 133.6 ms; 336 ms intent model at 2 Hz (table 2, with each value's category)"
    example: "The running machine"
    read: "§1.4.2"
  - q: "How much clearance does delay spend?"
    picture: "Stopping-budget bar in three steps (delay, braking, clear line); delay and braking against speed with the crossover"
    numbers: "200.4 + 562.5 = 762.9 mm of 1,100 mm, spare 337.1 mm; crossover 0.53 m/s (Napkin Math 1.1; calcs.py)"
    example: "Worked example 1"
    read: "§1.4.3"
  - q: "How much of the delay belongs to the learned model?"
    picture: "Pre-brake delay stacked bar: backbone 22 ms, rest of frame age 29.6, chunk lease 60, tick and bus 2, brake onset 20"
    numbers: "Backbone 33 mm, lease 90 mm, 1.5 mm per added millisecond (Napkin Math 1.1; calcs.py)"
    example: "A slower, more accurate model is a distance cost"
    read: "§1.4.3"
  - q: "Why do different machines run out of different margins?"
    picture: "Three photos (mobile manipulator, Franka arm, BLDC stator winding) for the three machine classes"
    numbers: "Latch limit 100 N against 39 N at brake command (Napkin Math 10.1); stalled joint derated from 87 to 73.0 N m, 16.1 percent (Napkin Math 2.6)"
    example: "Base in an aisle, arm on a latch, arm holding a load still"
    read: "§1.5"
  - q: "What is the machine made of?"
    picture: "Kit stack built in seven steps, rates in the side column, proposal boundary and governance envelope last"
    numbers: "Intent 2 Hz, chunk renewal 20 Hz, setpoints 40 Hz, permission loop 1 kHz, current loop 10 to 25 kHz (§1.7, figure 7)"
    example: "Above may only propose; below may command"
    read: "§1.7"
  - q: "Does a mature fleet still need people?"
    picture: "Waymo vehicle photo beside Waymo's California DMV filings, miles per disengagement 2015 to 2025"
    numbers: "1,244 to 19,234 miles per disengagement with a safety driver, 174 takeovers in 2025; driverless testing 71,815 miles per disengagement (California DMV via MLSysIM; Supervisory Intervention §14.1)"
    example: "Human authority stays part of the design"
    read: "Supervisory Intervention §14.1"
  - q: "How much testing would show the machine is safe?"
    picture: "Clean-run ladder 20, 29, 299, 2,995 built in four steps; RAND failure-free miles against Waymo rider-only miles"
    numbers: "20 clean runs support 86.1 percent at 95 percent confidence; 99.9 percent needs 2,995 runs, 33.3 h of cell time against 13.3 min (Napkin Math 7.1, 7.2); 275 million miles against 56.7 million (§7.9.1; Kalra and Paddock 2016; Kusano et al. 2025)"
    example: "Worked example 2"
    read: "Closed-Loop Evaluation §7.6, 7.7.2, 7.9.1"
  - q: "Which four laws organize the course?"
    picture: "Four cards, one per part, each with its established name"
    numbers: "None"
    example: "First law physical; the second to fourth are design principles"
    read: "§1.10"
  - q: "What will you be able to do, and how does the course run?"
    picture: "Kit course order; record chain with one record per lecture; three pathways"
    numbers: "Eighteen lectures after this one, sixteen records"
    example: "Instructor fills in logistics"
    read: "§1.11; Reader Guide"
