worked_examples:
  - name: "Napkin Math 1.1: Does the base stop inside its clearance?"
    given: "v = 1.5 m/s (illustrative), a_brake = 2 m/s^2 (illustrative), D_clear = 1.10 m (illustrative), tau_delay = 51.6 + 60 + 1 + 1 + 20 = 133.6 ms (derived)"
    steps: ["delay travel 1.5 x 0.1336 = 200.4 mm", "braking 1.5^2 / (2 x 2) = 562.5 mm", "stop 762.9 mm, 337.1 mm inside the clear distance", "crossover 2 a tau = 0.53 m/s, so braking dominates at the drive limit"]
    result: "The elementary stop fits with 337.1 mm to spare."
    meaning: "The spare is not yet a safety margin; Lecture 12 adds the allowances that set the aisle speed at 1.3 m/s."
  - name: "Napkin Math 7.1 and 7.2: What does a clean record prove?"
    given: "20 door runs, no failure; 40 s per trial (illustrative)"
    steps: ["p^20 = 0.05 gives p = 0.861", "0.99^n = 0.05 gives n = 299", "0.999^n = 0.05 gives n = 2,995", "2,995 x 40 s = 33.3 h against 13.3 min for 20"]
    result: "Each added nine costs about ten times the runs."
    meaning: "Permission to operate has to rest on more than testing the proposer (Part IV)."
active_learning:
  - at_minute: 1.5
    type: predict
    prompt: "How far does the base travel at 1.5 m/s before perception dispatches one frame? A 1 mm, B 10 mm, C 80 mm, D 800 mm"
    answer: "C, 77.4 mm (Napkin Math 8.2). A pictures inference alone; D confuses one frame with the whole stop."
  - at_minute: 13.5
    type: concept_question
    prompt: "Which is physical AI: a warehouse photo classifier, a line of fixed welding arms, the running machine?"
    answer: "Only the running machine. The classifier is advisory; the welding arms replay taught motion under classical control (§1.6)."
  - at_minute: 19
    type: predict
    prompt: "How much less training compute did a 2024 robot policy use than the largest language model of 2024? 3x, 30x, 300x, 3,000x"
    answer: "About 350 times (OpenVLA; Epoch AI). The 2025 GR00T N1 gap is about 7,000 times."
  - at_minute: 32.5
    type: estimate
    prompt: "Halve the speed to 0.75 m/s. What is the stop now?"
    answer: "Delay travel halves to 100.2 mm, braking quarters to 140.6 mm, 240.8 mm in all (Napkin Math 1.1; calcs.py)."
  - at_minute: 41.5
    type: discuss
    prompt: "Which margin runs out first: the base in the aisle, the arm on the latch, the arm holding a box still for a minute?"
    answer: "Clearance, contact force, heat: the three classes (§1.5)."
  - at_minute: 50.5
    type: estimate
    prompt: "Twenty clean runs support 86.1 percent. How many clean runs support 99 percent at 95 percent confidence?"
    answer: "299 (§7.6 figure; calcs.py)."
  - at_minute: 60
    type: retrieval
    prompt: "Close your notes. Write the stopping budget, name the two boundaries and what each decides, and name the four laws."
    answer: "d_stop = v tau + v^2/(2a) <= D_clear; the proposal boundary decides who may approve, the causal boundary is where approved actions become work; irreversibility, endogenous data, proposal is not permission, permission must be earned."
open_questions:
  - "If a model is right 999 times in 1,000, what should the machine do on the thousandth, and who decides?"
  - "Which will limit physical AI first: computation on the robot, data from robots, or evidence about robots?"
  - "When a robot and a person share an aisle, should the robot's uncertainty cost the robot speed or the person attention?"
