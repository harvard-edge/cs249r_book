<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" width="900" height="365" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F407A"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FEE2E2"/><line x1="0" y1="0" x2="0" y2="10" stroke="#DC2626" stroke-width="3"/></pattern></defs>
<rect width="900" height="365" fill="white"/>
<text x="10" y="30" font-size="23" fill="#1A1A2E" text-anchor="start" font-weight="bold">MCU timestamps split one takeover into four intervals</text>
<rect x="10" y="96" width="211" height="106" rx="8" fill="white" stroke="#DC2626" stroke-width="3"/>
<text x="115.5" y="132" font-size="25" fill="#DC2626" text-anchor="middle" font-weight="bold">drift</text>
<text x="115.5" y="162" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">policy drifts</text>
<text x="115.5" y="188" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal" font-style="italic">4.5 s</text>
<text x="115.5" y="236" font-size="25" fill="#334155" text-anchor="middle" font-weight="bold">M = 0</text>
<rect x="233" y="96" width="211" height="106" rx="8" fill="white" stroke="#059669" stroke-width="3"/>
<text x="338.5" y="132" font-size="25" fill="#059669" text-anchor="middle" font-weight="bold">blend</text>
<text x="338.5" y="162" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">enforcer spline</text>
<text x="338.5" y="188" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal" font-style="italic">38 ms</text>
<text x="338.5" y="236" font-size="25" fill="#334155" text-anchor="middle" font-weight="bold">M = 0</text>
<rect x="456" y="96" width="211" height="106" rx="8" fill="white" stroke="#D97706" stroke-width="3"/>
<text x="561.5" y="132" font-size="25" fill="#D97706" text-anchor="middle" font-weight="bold">re-orient</text>
<text x="561.5" y="162" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">operator hunts</text>
<text x="561.5" y="188" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal" font-style="italic">until settled</text>
<text x="561.5" y="236" font-size="25" fill="#334155" text-anchor="middle" font-weight="bold">M = 0</text>
<rect x="679" y="96" width="211" height="106" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<text x="784.5" y="132" font-size="25" fill="#2563EB" text-anchor="middle" font-weight="bold">stable</text>
<text x="784.5" y="162" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">operator steady</text>
<text x="784.5" y="188" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal" font-style="italic">after a dwell</text>
<text x="784.5" y="236" font-size="25" fill="#1A1A2E" text-anchor="middle" font-weight="bold">M = 1</text>
<line x1="10" y1="70" x2="10" y2="214" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
<text x="10" y="64" font-size="21" fill="#334155" text-anchor="start" font-weight="normal">divergence</text>
<line x1="227" y1="70" x2="227" y2="214" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
<text x="227" y="64" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">commit</text>
<line x1="450" y1="70" x2="450" y2="214" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
<text x="450" y="64" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">blend end</text>
<line x1="673" y1="70" x2="673" y2="214" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
<text x="673" y="64" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">stabilized</text>
<path d="M679,254 L679,262 L890,262 L890,254" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="784.5" y="290" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="bold">trains</text>
