chapter: 14_intervention
lecture: "14"
title: Supervisory Intervention
subtitle: "Part IV, Governing the Machine (the fourth law, permission must be earned)"
layer: governance
thread: "Fourth law, permission must be earned (stated here; this lecture opens Part IV). Record: the authority record."
minutes: 75
recall: "Lecture 12: at 1.3 m/s the budget uses 969.0 of 1,100 mm and leaves 131.0 mm, 100.8 ms; after Lecture 13's 63.3 ms allocation, 48.7 mm or 37.5 ms."
notes_minutes: 71.0
core_minutes: 57.5
target_ideas: 30
thesis: "A takeover is a control action with its own deadline, a single writer per actuator, a smooth transfer, and a record."
hook:
  minutes: "0-3"
  setup: "California DMV disengagement filings for one long-running fleet (Waymo): miles per takeover by the safety driver rose from 1,244 (2015) to 29,945 (2020). Students predict 2021 to 2025; the build shows the 2021 fall (3.8 times, while miles grew 3.7 times), 174 takeovers at 19,234 miles each in 2025, and driverless testing at 71,815 miles per disengagement. A real 2024 DMV CSV excerpt follows: each row names who began the takeover and why, never how long it took."
  question_to_class: "Will takeovers die out by 2025?"
  payoff: "Human authority is permanent, so the takeover itself must be engineered; the synthesis names the four things the filing does not record (deadline, single writer, smooth transfer, record)."
  sources: ["chapter §14.1 figure 1", "MLSysIM Literature.CaliforniaDisengagements", "California DMV 2024 disengagement CSV (web.archive.org, 2025-02-13)"]
driving_question: "Why can handing a moving robot to a human operator cause the collision the handover was meant to prevent?"
running_example: "The warehouse mobile manipulator at 1.3 m/s toward a rack end 1.10 m ahead (Lecture 12's finished budget: 968.99 mm, spare 131.0 mm = 100.8 ms; 37.5 ms after Lecture 13's 63.3 ms dispatch-to-admission allocation). A pallet blocks the aisle and the machine asks a remote assistant to take over. Values are chosen, illustrative, or derived as the chapter labels them; human terms come from cited studies."
concept_questions:
  - q: "How often does a mature fleet still hand control to a person?"
    picture: "DMV miles-per-disengagement build (real data)"
    numbers: "1,244 to 29,945 to 19,234 miles; 174 takeovers in 2025; driverless 71,815 (MLSysIM registry, DMV filings)"
    example: "Waymo, California"
    read: "§14.1"
  - q: "What does a takeover record today, and what does it leave out?"
    picture: "Exact rows of the DMV 2024 CSV"
    numbers: "244 Waymo rows; 230 by test driver, 14 by AV system"
    example: "DMV disengagement report"
    read: "§14.1"
  - q: "What does an intervention transfer, and what stays?"
    picture: "Enforcement against intervention diagram"
    numbers: "none"
    example: "Operator receives the proposal token; enforcer unchanged"
    read: "§14.2, Definition 14.1"
  - q: "How long does a takeover take before any command changes?"
    picture: "Timing strip build: video 104, perceive 200, decide 170, act 100, handshake 31 = 605 ms"
    numbers: "Card et al. 1983 slow-bound cycles; Schimpe et al. 2022 104 ms; 786.5 mm at 1.3 m/s (derived)"
    example: "In-loop remote assistant"
    read: "§14.2.2"
  - q: "What does that delay cost at the rack end?"
    picture: "Stacked stop bars: 969, 1,755, 6,773 mm against 1,100 mm"
    numbers: "Napkin Math 14.1 (derived)"
    example: "In-loop and out-of-loop takeovers"
    read: "§14.2.2"
  - q: "How long is the tail of human take-over times?"
    picture: "Histogram of 520 condition means (Zhang et al. 2019 data, CC0)"
    numbers: "mean 2.72 s, p50 2.37, p90 4.33, p99 7.0 s; ceilings 0.32, 0.29, 0.19, 0.12 m/s"
    example: "Driver take-over studies"
    read: "§14.2.2, table 2"
  - q: "At what speed may the machine ask for a takeover?"
    picture: "Worked steps of eq. 3"
    numbers: "0.836 m/s; perfect brake 1.23 m/s; with admission allocation 0.797 m/s"
    example: "Napkin Math 14.2"
    read: "§14.2.3"
  - q: "How long may it wait before its own stop must begin?"
    picture: "Fallback deadline against speed, three-step build"
    numbers: "100.8 ms at 1.3 m/s; 751.6 ms at 0.75 m/s (83.3 ms left after takeover and allocation); 5.79 s at 0.15 m/s"
    example: "Napkin Math 14.3; slow down, crawl, or stop first"
    read: "§14.2.4"
  - q: "How does authority end when a proposer or operator falls silent?"
    picture: "Teach pendant photo with published limits; ROS 2 teleop_twist_joy code beside the two-lease timeline"
    numbers: "chunk lease 60 ms; manual lease 100 ms; ISO 10218-1 250 mm/s; 117.5 mm"
    example: "Three-position enabling grip; one zero Twist on release"
    read: "§14.3.1, §14.3.4"
  - q: "Who writes the actuator during a handover?"
    picture: "Six-state machine build; four-phase handshake strip"
    numbers: "10 + 5 + 1 + 15 = 31 ms (chosen)"
    example: "Request, Acknowledge, Commit, Confirm"
    read: "§14.3.2, §14.3.3"
  - q: "Why can the command not switch in one tick?"
    picture: "Step against quintic command and jerk; strain wave gear photo"
    numbers: "2,000 m/s^3 step; 527.34 ms base window (528 ticks); 38 ms arm window"
    example: "Bumpless transfer"
    read: "§14.4.1, §14.4.2"
  - q: "Does a remote session fit the clearance?"
    picture: "Clearance waterfall at 0.75 m/s"
    numbers: "563.7, 110.0, 62.5, 32.5 mm; braking blend up to 157 mm"
    example: "Table 7"
    read: "§14.4.6"
  - q: "Can authentication delay a stop?"
    picture: "Veto verification time against forged packets queued"
    numbers: "1.8 ms per Ed25519 check (chapter estimate); 55 and 20 forged; 546 packets per second"
    example: "Verifier flooding pitfall"
    read: "§14.5, §14.9"
  - q: "What does the operator believe the machine is doing?"
    picture: "A320 flight display photo; split-channel lane diagram; Lufthansa 2904 timeline with the aircraft photo"
    numbers: "786.5 mm in 605 ms, 6.0 times the spare; LH2904 lockout 9 s, brakes 13 s, overrun at 72 knots"
    example: "Wet shrink-wrap handover; Warsaw 1993"
    read: "§14.6, War Story 14.1"
  - q: "What must the record hold, and which logged samples may train?"
    picture: "Evidence tuple excerpt with a flight data recorder photo; four-interval mask build"
    numbers: "EDR 10 samples in 5 s against 5,000; 4,500 drift ticks, 38 blend ticks, 0 trainable; Sirius 2 s window leaves 2,500"
    example: "Authority record; causal intervention masking"
    read: "§14.7, §14.8"
worked_examples:
  - name: "Napkin Math 14.1: The takeover tax"
    steps: ["given 1.3 m/s, 1.10 m, tau 133.6 ms, 190 mm, resident stop 605.31 mm", "machine alone 968.99 mm", "add 786.5 mm in-loop: 1,755.49 mm", "add 5,804.5 mm out-of-loop: 6,773.49 mm", "the waiting term decides; no brake fixes it"]
  - name: "Napkin Math 14.2: The speed a human buys"
    steps: ["b = 0.1336 + 0.605 + 0.1406 = 0.8792 s", "root sqrt(1.6830) = 1.2973 s", "v = 2(1.2973 - 0.8792) = 0.836 m/s", "perfect brake 1.23 m/s", "with 63.3 ms, 0.797 m/s"]
  - name: "Napkin Math 14.3: The waiting allowance"
    steps: ["eq. 4 at 1.3 m/s: 100.8 ms", "at 0.75 m/s: 751.6 ms", "minus 605 ms: 146.6 ms", "minus 63.3 ms: 83.3 ms", "slowing multiplies the allowance 7.5 times"]
  - name: "Blend windows (§14.4.2)"
    steps: ["1.875 x 15 / 750 = 37.5 ms, 38 ticks", "1.875 x 2 / 7.11 = 527.34 ms, 528 ticks", "smoothed stop 328.4 mm against 246.1 and 140.6 mm"]
active_learning:
  - {at_minute: 0.5, type: predict, prompt: "Will takeovers die out by 2025?", answer: "No; 174 in 2025 and a 3.8 times fall in 2021."}
  - {at_minute: 4.5, type: retrieval, prompt: "How much spare does the aisle run keep?", answer: "131.0 mm = 100.8 ms; 37.5 ms after the allocation."}
  - {at_minute: 13.5, type: predict, prompt: "Does the stop still fit after a takeover?", answer: "No; 655.5 mm over in-loop, 5.67 m out-of-loop."}
  - {at_minute: 24.5, type: estimate, prompt: "How fast may a braking driver be asked?", answer: "885 ms gives 0.68 m/s."}
  - {at_minute: 37.0, type: concept_question, prompt: "What sets the handover timeout here?", answer: "B: 37.5 ms clips the 500 ms ceiling; 37 whole ticks; tighter by 462.5 ms."}
  - {at_minute: 42.0, type: estimate, prompt: "How long must the arm's blend last?", answer: "37.5 ms, 38 ticks; base 528 ticks."}
  - {at_minute: 48.0, type: diagnose, prompt: "Can valid cryptography delay a stop?", answer: "55 forged packets (20 after allocation) push a veto past its deadline; rate-limit before the verifier."}
  - {at_minute: 57.0, type: concept_question, prompt: "Takeover should bypass the filter?", answer: "False; the operator gains only the right to propose."}
  - {at_minute: 61.5, type: estimate, prompt: "How many logged ticks may train?", answer: "4,500 drift + 38 blend, 0 trainable."}
  - {at_minute: 64.5, type: retrieval, prompt: "What does the takeover count leave out?", answer: "Deadline, single writer, smooth transfer, record."}
concept_trace:
  - concept: Intervention transfers the right to propose
    frame: "A takeover moves the right to propose; the check stays"
    shows: "Two-panel diagram: enforcement changes the proposal, intervention revokes the policy token and keeps the same enforcer"
  - concept: Takeover delay in the stopping budget
    frame: "An in-loop takeover spends 605 ms before any command"
    shows: "Three-step timing strip with the travel row; on the next frame, the kit stopping-budget bar (budget_bar_aisle_step7) with the takeover tax stated in text (+786.5 mm, 655.5 mm past; the kit's step 9 is not used, see the kit README)"
  - concept: Clearance-derived fallback deadline
    frame: "The deadline is the same budget solved for the wait"
    shows: "Eq. 4 curve against speed with the 605 ms and 4.5 s takeovers and the 1.3, 0.75, 0.15 m/s points"
  - concept: Authority leases and physical presence
    frame: "Authority leases lapse on the MCU's own clock"
    shows: "ROS 2 release code beside the 60 ms chunk lease and 100 ms manual lease timelines ending in FALLBACK; three-position grip on the preceding frame"
  - concept: Single-writer handover handshake
    frame: "Each channel is in exactly one authority state per tick"
    shows: "Six-state machine build (main path, fallback edges, protective); the four-phase handshake strip follows"
  - concept: Bumpless transfer
    frame: "A one-tick step asks the drivetrain for 2,000 m/s^3"
    shows: "Step against quintic command and jerk build; window estimate on the next frame"
  - concept: Mode confusion and per-channel annunciation
    frame: "The base kept driving while the operator aligned the arm"
    shows: "Arm, base, and console lanes; step 2 adds the per-channel annunciation and the hold rule"
  - concept: Authority record
    frame: "The authority record logs who held each channel every tick"
    shows: "Per-tick evidence tuple excerpt with EDR comparison; four-interval mask build on the next frame"
