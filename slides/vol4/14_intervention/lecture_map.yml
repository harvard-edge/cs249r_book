segments:
  - name: Deadline
    minutes: "10.5-28"
    question: "How long can a moving machine wait for a person?"
    land: "A takeover is travel before braking, so the machine slows, crawls, or stops before it asks."
    real_things: ["ROV control station and ISS robotics workstation photos", "Zhang et al. 2019 histogram (real data)", "Uber ATG Volvo XC90 photo"]
  - name: Handover
    minutes: "28-41"
    question: "How does authority change hands without two writers?"
    land: "Leases on the MCU clock end silent authority; one state and one writer per channel per tick."
    real_things: ["ABB teach pendant photo with published ISO limits (table)", "ROS 2 teleop_twist_joy source excerpt"]
  - name: Transfer
    minutes: "41-52"
    question: "Why can the command not switch in one tick?"
    land: "A quintic blend bounds the command rate and costs clearance."
    real_things: ["Strain wave gear photo", "da Vinci console photo", "Ed25519 cost from published Cortex-M4 cycle counts (chapter estimate)"]
  - name: Record
    minutes: "52-64.5"
    question: "Who held each channel, and what may be learned?"
    land: "Announce every channel's owner, log it per tick, and let only stable recovery train."
    real_things: ["A320 flight display photo", "Lufthansa 2904 timeline from the accident report and D-AIPN photo", "Flight data recorder photo; EDR rule numbers"]
