  - {concept: Authenticating interventions, frame: "Diagnose: can valid cryptography delay a stop?"}
  - {concept: Causal intervention masking, frame: "Estimate: how many logged ticks may train?"}
  - {concept: Trustworthy operational logs, frame: "The authority record logs who held each channel every tick"}
  - {concept: Ironies of automation, frame: "Open questions (and notes on the masks frame)"}
  - {concept: Shared autonomy blending, frame: "Averaging two good commands can hit the pallet"}
  - {concept: Remote-assistance session admission, frame: "The in-loop session at 0.75 m/s closes by 32.5 mm"}
open_questions:
  - "If takeovers become rare, operators lose practice exactly when a takeover is hardest. How should a fleet keep them ready?"
  - "Should a robot ever accept a moving takeover, or always stop first?"
  - "Who should own the record of a takeover: the operator, the fleet company, or the site?"
