worked_examples:
  - name: "Napkin Math 5.1: the pairing lag"
    steps: ["given: 35 ms uncompensated lag, 2 mm clearance, 0.50, 0.10, 0.03 m/s (illustrative)", "transit 17.5 mm, 8.75x the clearance", "fast 3.5 mm, outside; guarded 1.05 mm, inside", "ceilings 20 and 66.7 ms; rolling shutter alone 15 to 33 ms", "meaning: stamp the exposure midpoint in hardware; the faster approach cannot be collected otherwise"]
  - name: "Napkin Math 5.3: the flex-cable ceiling"
    steps: ["given: 60 min session, 35 min active, 25 s attempt + 15 s reset, 20 percent fail, 15 percent QA loss", "52 attempts, retention 0.68, 35.36 demonstrations, 14.73 min, 24.6 percent", "5,000 kept: 7,353 attempts, 141.4 h", "wear: 102,942 gear cycles (2.1 percent), 58,824 cable bends (29.4 percent)", "meaning: budget in validated demonstrations and fatigue cycles, not facility hours"]
  - name: "The scenario join (§5.7, figure 6)"
    steps: ["given: 3 plate offsets x 2 speeds", "uncritical table: 1 of 1", "required table: 1 of 6, 5 absences", "latch-recovery-02: 2 of 6, 4 absences", "a third speed: 9 cells, 8 absences for the original archive"]
  - name: "Bounds (§5.3, §5.8)"
    steps: ["given: S = 500, eps = 0.001", "open loop 0.5", "cloning 250, vacuous above eps = 0.002", "aggregation with u = 1: 0.5", "meaning: linear only while one mistake has a bounded cost; unrecoverable states belong to the permission path"]

active_learning:
  - at_minute: 3
    type: predict
    prompt: "DROID's arrays had the right shapes, types, and ranges. What was wrong? A corrupted frames, B joint angles out of range, C stored camera poses that did not match the cameras, D missing episodes."
    answer: "C. A wrong camera pose is a well-formed matrix; reprojecting the arm through it shows the error (§5.10.1)."
  - at_minute: 5
    type: retrieval
    prompt: "Close your notes. Who may write to the drives? What can happen to a proposal before it reaches them, and what records it?"
    answer: "Only the permission path; it may admit, clamp, or refuse; the handoff record dates each step (Lecture 4)."
  - at_minute: 15
    type: concept_question
    prompt: "Will 1,000 more hours of clean latch openings fix the recovery gap? A yes, B no, support beside the corridor stays zero, C only with a larger model, D only with a faster logger."
    answer: "B. 3,600,000 records per hour at 1 kHz hold about 1,800 independent samples, and none beside the corridor."
  - at_minute: 23
    type: diagnose
    prompt: "Three deployed symptoms: repeats pushes the machine clamped; stops against the latch; chatters at 8 to 12 Hz. Which tap or signal did each imitate?"
    answer: "Tap 1, the request; tap 4, the measured response (zero velocity while holding torque); raw operator velocity with tremor."
  - at_minute: 29
    type: estimate
    prompt: "A tighter strike plate leaves 1 mm. At 0.10 m/s, how much lag fits? Does a 35 ms logger?"
    answer: "10 ms; the 35 ms logger gives 3.5 mm, 3.5x the clearance."
  - at_minute: 43
    type: estimate
    prompt: "The scenario table adds a third approach speed. How many cells, and how many known absences for the original archive?"
    answer: "9 cells; 8 absences."
  - at_minute: 53
    type: diagnose
    prompt: "Each generation is retrained on all logged takeover episodes; operators intervene earlier each time while validation loss falls. Why?"
    answer: "Learner-action contamination: drift commands entered training as expert labels. Contrast causal confusion (clean labels, spurious cue)."
  - at_minute: 55
    type: predict
    prompt: "A command normalized to [0, 1]: 0.80 opens a 100 mm gripper to 80 mm. What does 0.80 do on a 60 mm gripper with a 75 mm part?"
    answer: "48 mm; the fingers land inside the part. The embodiment contract does not normalize."
  - at_minute: 63
    type: concept_question
    prompt: "True or false: more samples make up for missing coverage; dropping aborted runs cleans the data; labels survive a pad swap; collection scales linearly with operator hours."
    answer: "All false (§5.12): rows not cells; boundary states deleted; contact changed; wear and fatigue lower yield."

open_questions:
  - "Robot-free hand-held grippers cost no robot wear. Which cells of the latch table can they never fill?"
  - "Who should pay for an archive's known absences: more collection, a slower robot, or a narrower ODD?"
  - "If a fleet logs every deployment, when does deployment data become better than demonstrations?"

