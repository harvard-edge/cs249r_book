second_lecture_split: "Split after §5.6 (after the Labels section and the yield and wear slides): the first part, why the archive misleads (endogenous shift, compounding error, collection paths, action taps, timing, teleoperation latency, yield and wear); the second part, how to fill and keep it (bytes and coverage tables, ODD, interventions and curation, cross-embodiment transfer, degradation and drift, provenance). The deck's Coverage divider note marks the point."

