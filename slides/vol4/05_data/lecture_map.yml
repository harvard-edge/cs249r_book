chapter: 05_data
lecture: "05"
title: "Physical Data"
subtitle: "Demonstration data that teaches a robot to recover"
layer: world
minutes: 75
notes_minutes: 71
core_minutes: 58.5
target_ideas: 30
thread_line: "Thread: the second law, endogenous data. Record: the provenance record."
thesis: "A robot's own actions choose the states it will meet, so a demonstration archive is engineered for recovery coverage and for the meaning, timing, and origin of every label."

hook:
  minutes: "0-4"
  setup: "DROID (76,000 trajectories, 350 h, 564 scenes, one robot model) shown as its real 7 x 7 calibration-check grid: the arm silhouette rendered from recorded joint angles through each camera's stored pose. The team published new calibrations for about 36,000 episodes after re-analysis found the original silhouettes barely overlapped the arm; every file had parsed without error."
  question_to_class: "The arrays had the right shapes, types, and ranges. What was wrong? A corrupted frames, B joint angles out of range, C stored camera poses that did not match the cameras, D missing episodes."
  payoff: "C, answered in the Provenance section with kinematic reprojection, and again in the synthesis: a parser checks shapes; an archive's meaning lives in its taps, clock, plant, calibration, and known absences."
  sources: ["chapter §5.10.1 and figure 9 (Khazatsky et al. 2024, Figure 13, CC BY 4.0; Lu et al. 2025)", "chapter table 5 (DROID scale)"]

driving_question: "Why can a large archive of successful demonstrations leave a robot unable to recover from its first mistake?"

recall: "Lecture 4: only the permission path writes to the drives; it may admit, clamp, or refuse a proposal, and the handoff record dates each step. Lecture 1: the proposal boundary."

running_example: "The latch campaign: the warehouse mobile manipulator opens a spring-latched cage door with a 15 N contact tripwire, at a guarded 0.03 m/s or a faster 0.10 m/s approach, 2 mm clearance (all illustrative). 35 ms pairing lag fits only the guarded approach (Napkin Math 5.1); one scheduled hour keeps 35.36 demonstrations, 24.6 percent; 5,000 kept demonstrations cost 7,353 attempts, 141.4 h, 29.4 percent of the wrist cable's rated life (Napkin Math 5.3); the archive fills 1 of 6 scenario cells, latch-recovery-02 a second (§5.7, §5.8); its provenance record lists 5 known absences (§5.11)."

goals:
  - "Explain why a policy's first error leads to states its demonstrations never covered."
  - "Choose which of four logged signals a dataset imitates, and date each pair on one clock."
  - "Price a collection campaign in cell time and wear, and audit coverage against a declared table."
  - "Curate a takeover and write the provenance record that travels with an archive."

law_and_record: "Opens Part II and states the second law, endogenous data (a design principle, not a physical law). Record added to the chain: the provenance record (third, after the limit record of Lecture 2 and the handoff record of Lecture 4)."

segments:
  - name: The Archive
    divider_question: "Why can a large archive of successful demonstrations leave a robot unable to recover from its first mistake?"
    read: "§5.1, §5.10.1"
    concept_questions: [1]
    minutes: 7.5
    land: "Hook, recall, goals."
  - name: Recovery
    divider_question: "Why do more clean demonstrations not teach recovery?"
    read: "§5.1 to §5.3"
    concept_questions: [2, 3, 4, 5]
    minutes: 11
    land: "The robot's own errors lead it where the demonstrations never went, and more of the same data, from one rig or from a hub, does not fill that gap."
  - name: Labels
    divider_question: "What does a recorded action mean, and when was it true?"
    read: "§5.4 to §5.6.1"
    concept_questions: [6, 7, 8]
    minutes: 14
    land: "A label means one of four signals, dated at one instant on one clock; a record without the tap, the clock, or the rate cannot be interpreted later."
  - name: Coverage
    divider_question: "What does an hour of collection buy, and which states does it cover?"
    read: "§5.6.2 to §5.7"
    concept_questions: [9, 10, 11]
    minutes: 13
    land: "Physical data is bought in cell time and component life, and what it covers is a join against a table declared from the ODD, never a property the archive reports about itself."
  - name: Interventions
    divider_question: "What should an archive keep from a takeover?"
    read: "§5.8"
    concept_questions: [12, 13]
    minutes: 11
    land: "Keep the drift states, mask the drift commands, and admit only stabilized recovery; labeling learner states makes the bound linear only while mistakes are recoverable."
  - name: Provenance
    divider_question: "What must travel with every recorded trajectory?"
    read: "§5.9 to §5.11"
    concept_questions: [14, 15]
    minutes: 8
    land: "A stored number means nothing without its units, frame, plant, and clock, so the provenance record binds them and keeps the known absences."
  - name: Wrap-Up
    divider_question: "What does an archive say about where a robot may act?"
    read: "§5.12, §5.13"
    minutes: 6.5

concept_questions:
  - id: 1
    q: "What can be wrong with a robot dataset whose every file parses?"
    picture: "DROID calibration-check grid (real), predict vote; ALOHA 2 collection fleet photo (real)"
    numbers: "DROID 76,000 trajectories, 350 h, 564 scenes; about 36,000 episodes recalibrated (table 5, §5.10.1); ALOHA 2 fleet 'capable of collecting 1000s of demonstrations per day' (ALOHA 2 Team 2024, Figure 1 caption)"
    example: "DROID; ALOHA 2"
    read: "§5.1, §5.10.1"
  - id: 2
    q: "How does a robot's data differ from an image classifier's?"
    picture: "Open-loop classifier against closed-loop policy, built in two steps"
    numbers: "None; definition 5.1"
    example: "Afternoon sunlight (exogenous) against a 1 mm miss that changes the view of the latch (endogenous)"
    read: "§5.1, §5.2"
  - id: 3
    q: "Why do clean demonstrations leave no recovery data?"
    picture: "Latch corridor, top view, with a displaced gripper and the missing return action; Navlab photo for ALVINN (optional)"
    numbers: "Gripper 3 mm toward the fixture (§5.3, §5.7); ALVINN image-shift recoveries about 20 years before DAgger (§5.3 footnote 1)"
    example: "Latch; ALVINN (Pomerleau 1989, 1991)"
    read: "§5.3"
  - id: 4
    q: "How fast does cloning's worst-case cost grow with the horizon?"
    picture: "Log-log bound plot: open loop S eps against cloning min(S, S^2 eps), built in two steps"
    numbers: "S = 500 steps (5 s at 100 Hz), eps = 0.001: open loop 0.5, cloning 250; vacuous above eps = 1/S = 0.002 (§5.3 equation 1, §5.8; derived in calcs.py)"
    example: "Latch episode at 100 Hz"
    read: "§5.3"
  - id: 5
    q: "Does more data, or a faster logger, fill the gap?"
    picture: "Vote slide; LeRobot Hub growth and episode histogram (real)"
    numbers: "3,600,000 records per hour at 1 kHz, about 1,800 independent samples at rho 0.999 (equation 2; derived); Hub 1,085 (end 2024), 26,548 (end 2025), 80,132 (October 2026) datasets; 58 percent of 59,031 hold fewer than 16 episodes, 2 percent 512 or more, median bin 8 to 15 (MLSysIM Literature.LeRobotHub*, Hub API 2026-10-12; figure 5)"
    example: "LeRobot Hub"
    read: "§5.3, §5.4, §5.6.3"
  - id: 6
    q: "Which signal is the action label?"
    picture: "GELLO leader rigs (real); four-tap diagram built in four steps; diagnose table; DROID and LeRobot schemas (real artifacts, optional)"
    numbers: "Permission path at 1 kHz; tremor 8 to 12 Hz (§5.4.1, §5.5.1); ALOHA dataset 50 episodes at 50 fps, one 14-element action (lerobot/aloha_static_coffee info.json, retrieved 2026-10-19)"
    example: "Clamped request; stall against the latch; tremor chatter"
    read: "§5.4, §5.5.1"
  - id: 7
    q: "When was an observation true, and what does a timing error cost?"
    picture: "Pairing error against lag, three speeds, with ceilings and the rolling-shutter band (two steps); estimate activity"
    numbers: "35 ms: 17.5 mm at 0.50 m/s, 1.05 mm at 0.03, 3.5 mm at 0.10 against 2 mm; ceilings 66.7 and 20 ms; skew 15 to 33 ms (Napkin Math 5.1, equation 3); 1 mm at 0.10 m/s allows 10 ms (Checkpoint 5.1; derived)"
    example: "Latch approaches"
    read: "§5.5.2"
  - id: 8
    q: "Which delays belong to the demonstration, and which to the logger?"
    picture: "Teleoperation loop strip with the Goertz 1949 photo (optional); Open X-Embodiment episodes by declared command rate (real)"
    numbers: "50 + 200 + 10 + 80 = 340 ms, human 58.8 percent (equation 5, illustrative; derived); Open X-Embodiment 2,419,193 episodes in 72 datasets: 57 percent at 10 Hz, 28 percent no rate, 2 percent at or above 20 Hz (MLSysIM Literature.OpenXEmbodimentComposition; figure 8b)"
    example: "Operator delay kept and declared; logger delay removed"
    read: "§5.6.1, §5.9.1"
  - id: 9
    q: "What does an hour of collection keep, and what does a campaign wear out?"
    picture: "Session waterfall in two steps; strain-wave gear photo (real) beside rated-life bars; byte-rate ladder (optional)"
    numbers: "52 attempts x 0.68 = 35.36 demonstrations, 14.73 min, 24.6 percent; 7,353 attempts, 141.4 h, 4.07x the kept motion; gear 2.1 percent, cable 29.4 percent of rated life (Napkin Math 5.3, illustrative; derived); 3,122 MB/s raw, navigation camera 4.0x SATA, taps 0.007 percent (Napkin Math 5.2; derived)"
    example: "Latch campaign"
    read: "§5.6.2, §5.6.3"
  - id: 10
    q: "Why do record count and validation loss miss coverage?"
    picture: "Two contact-angle grids (8 and 510 of 600 cells) with held-out errors; Open X-Embodiment by morphology (real, optional)"
    numbers: "8 of 600 (1.3 percent) against 510 (85 percent); RMS error 0.001 against 0.012 rad (table 4, illustrative); 10^28 cells at 10 bins x 28 dims against 4.35e23 records (§5.7.1); single arm 91 percent, mobile manipulators 5 percent of OXE (figure 8a)"
    example: "Cautious operator against exploratory policy"
    read: "§5.7"
  - id: 11
    q: "What is the ODD, and what does the latch archive cover against it?"
    picture: "Scenario-table join in three steps (uncritical table, required table, after latch-recovery-02); estimate activity"
    numbers: "1 of 1, 1 of 6, 2 of 6 cells; third speed gives 9 cells, 8 absences (§5.7, figure 6, Checkpoint 5.2; derived)"
    example: "Latch plate offset x approach speed"
    read: "§5.7"
  - id: 12
    q: "Why is a cell empty, and what does a takeover contribute?"
    picture: "Four-causes table; takeover timeline in three steps; 49 CFR 563 table (real artifact, optional)"
    numbers: "4.47 s takeover budget, 5 s ring buffer, 5,000 ticks at 1 kHz (§5.8; derived); EDR -20 to 0 s at 10 per second, previously -5.0 to 0 s at 2 per second (49 CFR 563.7 Table I, eCFR 2026-10-19)"
    example: "latch-recovery-02 (stipulated)"
    read: "§5.8"
  - id: 13
    q: "How much does labeling learner-visited states help, and when does it stop helping?"
    picture: "Bound plot with the aggregation line; ThriftyDAgger cable routing bars (real, optional); diagnose activity on contamination"
    numbers: "u S eps = 0.5 against S^2 eps = 250 (equation 8; derived, conceptual); Hoque et al. 2022 Table 3: 0/15 cloning, 10/15 HG-DAgger, 12/15 ThriftyDAgger, 1.55 and 1.42 training interventions per episode"
    example: "Withdraw-and-reseat (recoverable) against 100 N on the latch (not)"
    read: "§5.8"
  - id: 14
    q: "What does a normalized action mean on another robot?"
    picture: "Normalization diagram, two steps (predict); five Open X-Embodiment rows (real artifact, optional)"
    numbers: "0.80 x 100 mm = 80 mm clears 75 mm; 0.80 x 60 mm = 48 mm; 30 N against 15 N (§5.9.1; derived)"
    example: "Machine A and Machine B grippers"
    read: "§5.9"
  - id: 15
    q: "What must the provenance record bind, and why?"
    picture: "DROID grid with reprojection explanation (hook payoff); Mars Climate Orbiter photo (optional); provenance record table"
    numbers: "36,000 episodes recalibrated; 3 mm bracket shift (§5.10.1); 4.45 factor, 57 km against 226 km (War Story 5.1); 7,353 attempts, 141.4 h, 1 of 6 cells, 5 absences (§5.11)"
    example: "Latch campaign record"
    read: "§5.10, §5.11"

