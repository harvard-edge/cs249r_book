closing:
  return_to_hook: "Back to DROID: every file parsed and the camera poses were wrong. Five lines, one per segment: recovery states beside the corridor; one tap dated on one clock; 24.6 percent of an hour survives and wear is per attempt; keep drift states and mask drift commands; the provenance record binds plant, calibration, and known absences."
  read_and_practice: ["§5.1 to §5.13", "Checkpoints 5.1 to 5.3", "redo Napkin Math 5.3 with a 10 s reset"]
  further_reading:
    - cite: "Physical Data, §5.1 to §5.13"
      url: "https://mlsysbook.ai"
      why: "Every number in the deck, with derivations."
    - cite: "Ross, Gordon, and Bagnell, A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning, AISTATS 2011"
      url: "https://proceedings.mlr.press/v15/ross11a.html"
      why: "DAgger and the recoverability constant."
    - cite: "Pomerleau, Efficient Training of Artificial Neural Networks for Autonomous Navigation, Neural Computation 1991"
      url: "https://doi.org/10.1162/neco.1991.3.1.88"
      why: "The recovery gap and its first fix."
    - cite: "Khazatsky et al., DROID, RSS 2024"
      url: "https://arxiv.org/abs/2403.12945"
      why: "A single-embodiment corpus and its calibration audit."
    - cite: "Open X-Embodiment Collaboration, Open X-Embodiment, ICRA 2024"
      url: "https://arxiv.org/abs/2310.08864"
      why: "Pooling across embodiments, unaligned action spaces."
    - cite: "Gebru et al., Datasheets for Datasets, CACM 2021"
      url: "https://doi.org/10.1145/3458723"
      why: "Documentation for static corpora that the provenance record extends."
  bridge: "Lecture 6, Policy Training: Why can a policy improve its training score while becoming less reliable on the machine?"

