closing:
  return_to_hook: "One frame vouches for the space ahead for 593.75 ms and for the space beside the rack end not at all; memory added a deadline and no braking distance. At Troy, appearance never observed the soil's strength, and slip was the residual that should have expired the belief."
  record: "The belief record, the seventh record in the record chain."
  read_and_practice: ["§9.1 to §9.12", "Napkin Math 9.2 redone for a 300 mm side gap", "Checkpoints 9.1 to 9.3"]
  bridge: "Next lecture (Grounded Intent): why is recognizing the right object insufficient to authorize a robot to reach for it?"

second_lecture_split: "After §9.5. Part A, estimation and time: the filter, honest covariance, tracking, out-of-sequence replay, epochs, frames, odometry and loop closure (the first two segments here, expanded with the EKF/UKF, the 3D tracking gate, and the frame tree). Part B, representation and expiry: metric maps and distance fields, scene graphs and episodic memory, erosion, the invalidation horizon, covariance growth, observability, failure modes, and the belief record (the last two segments here, expanded with scene graphs and the semantic multi-rate loop)."

coverage:
  primary_taught: ["Recursive estimation on dated measurements", "Covariance is a claim", "Occupancy before identity", "Belief record", "Frames age", "Representation follows the query", "Belief expiry", "Observability ceiling"]
  primary_left_to_reading: []
  secondary: ["Out-of-sequence replay (misdated slide and note)", "Occlusion and free-space erosion (rack-end frames)", "Multi-rate semantic mapping (left to reading)"]

notes_for_author:
  - "The chapter gives the misdated error as 10.3 reported standard deviations; recomputing 38.0 / 3.7 from the chapter's own inputs gives 10.25 (calcs.py prints 10.2). The deck says 'about ten'."
  - "The running machine is a reference platform; every segment pairs its arithmetic with a published artifact or measurement (Ouster and BMI088 datasheets, SORT code, ROS 2 message and tf2 code, UMBmark, KITTI, nvblox Table II, ROS 2 QoS docs)."
