chapter: 09_memory
lecture: "09"
title: "Spatial Memory"
subtitle: "How long a remembered scene may move a robot"
layer: brain
minutes: 75
notes_minutes: 70
core_minutes: 57.5
target_ideas: 30
thesis: "A remembered scene supports motion only until its error bound, grown from the motion the sensors cannot see, reaches the task tolerance. Memory adds a deadline to evidence and adds no distance."

hook:
  minutes: "0-6"
  setup: "Spirit at Troy, 2009 (War Story 9.1): the hazard camera shows loose sand where a wheel broke through a crust that looked like ground already crossed; the cameras observed the surface and nothing observed the soil's strength. Then a real pallet-rack aisle: the navigation camera saw the cross aisle empty and the rack end now hides it."
  question_to_class: "How long may that one frame vouch for the space 1.10 m ahead? A) 0 ms B) 50 ms C) 0.6 s D) until a frame shows a person"
  payoff: "C for the space ahead (593.75 ms, of which the 51.6 ms frame age is spent before memory sees the frame); A for the space beside the rack end (0 ms, even at capture). Memory adds a deadline and no braking distance; the side needs a sensor that sees the cross aisle or a site rule (Napkin Math 9.2). Troy returns in the synthesis as a belief about an unobservable quantity."
  sources: ["chapter War Story 9.1; Arvidson et al., JGR Planets 2010", "chapter Napkin Math 9.2 and equation 13", "photo: NASA/JPL-Caltech, Spirit's Robotic Stretch (public domain)", "photo: W.carter, IKEA Torp pallet-rack aisle (CC0)"]

driving_question: "How long can a robot act on a remembered scene after it loses sight of it?"

recall: "Lecture 8: an observation serves a moving robot only when it states its capture epoch, its frame, and its measured error; the aisle frame is 51.6 ms old at dispatch, 77.4 mm of travel at 1.5 m/s."

running_example: "The warehouse mobile manipulator at the rack end (1.10 m clear distance ahead, 150 mm side gap, 50 mm localization bound, 100 mm protective clearance, 1.6 m/s walking speed), with two manipulation beliefs: the finger in the latch-release slot (0.1 mm initial error, 12 mm/s drift, 50 mm/s^2 disturbance, 1 mm tolerance) and the mug handle on a 0.20 m/s conveyor (3 mm initial error, 15 mm tolerance). All illustrative or chosen values from the chapter; the real system is shown as a credited ER-FLEX mobile manipulator photo and a real pallet-rack aisle."

goals:
  - "Fuse dated measurements and test the spread the filter reports."
  - "Date every belief and every transform by the evidence behind it."
  - "Choose a map by the query the permission path must answer in 2 microseconds."
  - "Set each belief's expiry from its error growth and the task tolerance."

segments:
  - name: Estimation
    divider_question: "How does a robot turn dated measurements into one estimate?"
    read: "§9.2"
    concept_questions: [2, 3, 4, 5]
    minutes: 13.5
    land: "An estimate's spread is a claim to test, it must be dated by its capture epoch, and occupancy reaches the safety path before identity does."
  - name: Records
    divider_question: "What must a remembered value carry so a consumer can check it?"
    read: "§9.3 to §9.5"
    concept_questions: [6, 7, 8]
    minutes: 11.5
    land: "Every remembered value, including every transform, carries its evidence epoch and its frame, and only new evidence renews it."
  - name: Maps
    divider_question: "Which map answers a clearance query inside one permission tick?"
    read: "§9.6"
    concept_questions: [9, 10]
    minutes: 13.5
    land: "Choose the map by the query, freeze a dated distance snapshot for the tick, and let only real rays renew space."
  - name: Expiry
    divider_question: "How long does a remembered scene stay true enough to move on?"
    read: "§9.7 to §9.10"
    concept_questions: [11, 12, 13, 14]
    minutes: 17.5
    land: "Every belief has a deadline from its growth law, and some states have no measurement that can ever renew them."

concept_questions:
  - id: 1
    q: "What did Spirit's cameras observe at Troy, and what did they miss?"
    picture: "Spirit hazard-camera photo at Troy (NASA/JPL, public domain)"
    numbers: "Embedded April to May 2009; declared a stationary platform January 2010 (War Story 9.1; Arvidson et al. 2010)"
    example: "Spirit at Troy"
    read: "War Story 9.1"
  - id: 2
    q: "How does a filter combine a prediction with dated measurements?"
    picture: "Error-bar build: prior, predict, + lidar, + stereo, beside an Ouster OS1-64 point cloud photo"
    numbers: "20 mm prior; 5 mm odometry spread over 50 ms; 20.6 mm predicted; lidar 30 mm (Ouster datasheet) gain 0.32 to 17.0 mm; stereo 3.8 mm gain 0.95 to 3.7 mm (§9.2; derived in calcs.py)"
    example: "Range to the rack-end upright"
    read: "§9.2"
  - id: 3
    q: "What does a misdated measurement do to the estimate and its spread?"
    picture: "Same chart with a red misdated column 38.0 mm off at the same ±3.7 mm"
    numbers: "39.9 mm arrival-stamp travel; 38.0 mm pulled; about 10 reported standard deviations; ring buffer of 52 slots for 51.6 ms at 1 kHz (§9.2, §9.2.3)"
    example: "Stereo frame stamped on arrival"
    read: "§9.2, §9.2.3"
  - id: 4
    q: "How do we test whether a filter's covariance is honest?"
    picture: "Bars: share of single misdated updates caught at gates 3.84 and 6.63"
    numbers: "Expected NIS 6.25; caught 0.63 and 0.39; 50-sample band 0.65 to 1.43 (§9.2.1; noncentral chi-square in calcs.py)"
    example: "NEES offline against a laser-tracker survey; NIS online"
    read: "§9.2.1"
  - id: 5
    q: "Why must occupancy reach the safety path before a tracker confirms identity?"
    picture: "Real SORT code (min_hits=3, max_age=1) above a six-frame timeline of in-view, SORT output, and occupancy"
    numbers: "Two withheld frames = 33.4 ms = 50.1 mm at 1.5 m/s (derived from SORT defaults and the 16.7 ms frame period)"
    example: "A person stepping into the aisle, then hidden"
    read: "§9.2.2"
  - id: 6
    q: "What must a remembered value carry beyond one timestamp?"
    picture: "Real ROS 2 PoseWithCovarianceStamped definition beside a three-epoch timeline (acquisition, estimate, publication)"
    numbers: "0.2 ms clock bound = 0.3 mm at 1.5 m/s; 2.5 ms camera-encoder gap = 4.25 mm at 1.7 m/s (§9.4)"
    example: "Republished prediction looking fresh"
    read: "§9.3, §9.4"
  - id: 7
    q: "Why does a stale transform put the finger outside a 1 mm slot?"
    picture: "Stacked bars: 0.10 + 0.20 + 0.75 = 1.05 mm stale against 0.31 mm same-epoch, with the 1 mm tolerance; then real tf2 code that refuses extrapolation"
    numbers: "Lever 0.15 m, 0.30 rad/s, 12 mm/s, 16.7 ms (§9.5, illustrative)"
    example: "Latch-release slot at the cage door"
    read: "§9.5"
  - id: 8
    q: "How fast does odometry spend the localization bound?"
    picture: "UMBmark lines (real data) and the KITTI leaderboard strip plot (real data, 127 methods)"
    numbers: "317 and 21 mm on 16 m: 2.0 and 0.13 percent, 2.5 and 38.1 m; KITTI lowest 0.53 percent, 9.4 m; median lidar 7.4 m, stereo 4.0 m (§9.5.1)"
    example: "Wheel odometry between map corrections; loop closure moving cells"
    read: "§9.5.1"
  - id: 9
    q: "Which map can answer a clearance query in 2 microseconds?"
    picture: "ER-FLEX photo with the budget arithmetic; then grouped log bars of reads per query at 2, 5, 10 cm"
    numbers: "1 kHz, 100 us for 50 spheres, 2 us each; 3.2 GB/s gives 800 reads; occupancy 1,437, octree 11,494, ESDF 8 at 5 cm (§9.6.1, table 1)"
    example: "Permission microcontroller snapshot"
    read: "§9.6.1"
  - id: 10
    q: "What does a lidar return renew, and what does a map's timestamp not tell you?"
    picture: "nvblox Fig. 8 and Table II runtimes (real); snapshot size bars; ray-update grid with four cell states"
    numbers: "nvblox 1.9 ms, Fiesta 13 ms, voxblox 58 ms per ESDF update (Millane et al. 2024, Table II); 183 kB at 5 cm against 1.05 MB SRAM; 2.4 GB dense against 76.8 MB hashed (Napkin Math 9.1)"
    example: "Cells behind a return keep their old epoch"
    read: "§9.6.1"
  - id: 11
    q: "How long does free space stay free once a rack hides its boundary?"
    picture: "Aisle photo and top view; then certified depth against time, built in three steps"
    numbers: "593.75 ms ahead, 0 ms abreast; 51.6 ms age spends 82.6 mm; 0.625 ms per mm (Napkin Math 9.2)"
    example: "The rack end"
    read: "§9.7.1"
  - id: 12
    q: "When does a belief with accelerating error expire?"
    picture: "Error bound against time with tolerance; constant-velocity line added"
    numbers: "66 ms against 75 ms; 1.14 mm at 75 ms; tighter slot 16.1 ms (§9.7.3)"
    example: "Blind finger insertion"
    read: "§9.7.2, §9.7.3"
  - id: 13
    q: "Why can one robot not use one staleness timeout?"
    picture: "Real ROS 2 QoS definitions (Deadline, Lifespan); horizons bars for four beliefs; lifecycle state machine and the mug admission"
    numbers: "20 mm in 100 ms against 15 mm (§9.9); 0, 66, 84, 593.75 ms (table 4); 10.04 mm, 4.96 mm, 24.8 ms (Napkin Math 9.3)"
    example: "Frozen transform; mug on the conveyor"
    read: "§9.9, §9.10"
  - id: 14
    q: "What can no estimator recover?"
    picture: "Reported 5 N flat against true force falling to 2 N; JPL test-rover photo"
    numbers: "0.2 N/min for 15 min: 3 N, 60 percent (§9.8, illustrative)"
    example: "Wrist strain gauge with thermal bias; Spirit's soil strength"
    read: "§9.8"

concept_trace:
  - concept: "Recursive estimation on dated measurements"
    frame: "A filter predicts, then each update narrows its spread"
    shows: "three-step error-bar build (prior, predict, + lidar, + stereo) with the gains; out-of-sequence replay on the next frame"
  - concept: "Covariance is a claim"
    frame: "Does a residual gate catch a misdated update?"
    shows: "misdated column with unchanged spread (previous frame), then gate-catch bars and the 50-sample NIS band; NEES in the note"
  - concept: "Occupancy before identity"
    frame: "A tracker's identity must not delay occupancy"
    shows: "real SORT code and the six-frame timeline: occupancy from frame 1, SORT output only frames 3 and 4, unknown when hidden"
  - concept: "Belief record"
    frame: "A stamped pose carries one time and no expiry"
    shows: "real ROS 2 message beside the three-epoch timeline, with the fields the belief record adds; completed on 'The belief record admits the mug grasp with 24.8 ms left' (lifecycle and admission)"
  - concept: "Frames age"
    frame: "Does one stale frame miss a 1 mm slot?"
    shows: "stacked error bars 1.05 mm stale against 0.31 mm same-epoch, with the 1 mm tolerance line"
  - concept: "Representation follows the query"
    frame: "Only a distance field answers a sphere query in 8 reads"
    shows: "reads per query by representation and pitch against the 800-read budget; four cell states on 'A lidar return renews only the cells its ray crossed'"
  - concept: "Belief expiry"
    frame: "When must the finger's blind insertion stop?"
    shows: "error bound reaching the 1 mm tolerance at 66 ms, with the definition on the slide; the rack-end erosion build on 'The frame certifies 593.75 ms ahead and 0 ms abreast'"
  - concept: "Observability ceiling"
    frame: "A zero innovation can hide a 60 percent loss of grip"
    shows: "reported 5 N against true force falling to 2 N with zero innovation; the definition of observable on the slide"

worked_examples:
  - name: "Napkin Math 9.2: the erosion deadline"
    steps: ["given: 1.10 m ahead, 150 mm side gap, 50 mm localization, 100 mm reserve, 1.6 m/s", "ahead: 0.95 m / 1.6 m/s = 593.75 ms", "frame age 51.6 ms spends 82.6 mm, leaving 542.15 ms", "abreast: 0 m / 1.6 m/s = 0 ms", "meaning: depth, not frame rate, sets the deadline; memory adds no distance"]
  - name: "§9.7.3: the latch-slot horizon"
    steps: ["given: E = 0.1 + 12 t + 25 t^2 mm, tolerance 1 mm", "solve 25 t^2 + 12 t - 0.9 = 0: 66 ms", "constant-velocity model says 75 ms; bounded error there is 1.14 mm", "0.30 mm slot gives 16.1 ms", "meaning: expiry is a physical deadline from the growth law"]
  - name: "Napkin Math 9.3: the admission margin"
    steps: ["given: 3 mm, 0.20 m/s, 15 mm tolerance, used at 35 ms, 0.2 ms clock bound", "upper age 35.2 ms", "E = 10.04 mm, inside 15 mm", "4.96 mm and 24.8 ms remain; latest use 59.8 ms", "meaning: admission is an input to permission, not a completion guarantee"]
  - name: "§9.2: predict and update, then misdate"
    steps: ["given: 20 mm prior, 5 mm odometry spread, lidar 30 mm, stereo 3.8 mm", "predict 20.6 mm", "lidar gain 0.32, 17.0 mm; stereo gain 0.95, 3.7 mm", "misdated: 38.0 mm off at the same 3.7 mm", "meaning: the covariance cannot see a dating error"]

active_learning:
  - at_minute: 3.5
    type: predict
    prompt: "How long may one frame vouch for the space ahead? A 0 ms, B 50 ms, C 0.6 s, D until a frame shows a person"
    answer: "C ahead, 593.75 ms; A abreast, 0 ms (Napkin Math 9.2), revealed in the expiry segment."
  - at_minute: 5
    type: retrieval
    prompt: "Write the three things an observation must state, and the aisle frame's age at dispatch."
    answer: "Capture epoch, frame, measured error; 51.6 ms, 77.4 mm at 1.5 m/s."
  - at_minute: 14.5
    type: concept_question
    prompt: "Does a residual gate catch a misdated update? A always, B about 2 in 3, C never"
    answer: "B: 0.63 at the 3.84 gate, 0.39 at 6.63; averaging 50 innovations exposes it (mean near 6.25 against 0.65 to 1.43)."
  - at_minute: 25
    type: predict
    prompt: "Does one stale frame miss a 1 mm slot?"
    answer: "Yes: 0.10 + 0.20 + 0.75 = 1.05 mm; same-epoch composition gives 0.31 mm."
  - at_minute: 29.5
    type: estimate
    prompt: "How far can wheel odometry drive before 50 mm?"
    answer: "Uncalibrated 2.0 percent: 2.5 m (1.9 s at 1.3 m/s); calibrated 0.13 percent: 38.1 m."
  - at_minute: 44
    type: discuss
    prompt: "Which forgetting rule could certify an empty aisle?"
    answer: "Only expiry tied to a physical entry-speed bound; nvblox-style decay qualifies only if its rate is set from that bound."
  - at_minute: 53.5
    type: estimate
    prompt: "When must the finger's blind insertion stop?"
    answer: "66 ms; a constant-velocity estimate says 75 ms, by which time the error is 1.14 mm."
  - at_minute: 66
    type: concept_question
    prompt: "True or false: four fallacies and pitfalls of §9.11"
    answer: "All false: free space erodes at 1.6 m/s; covariance assumes existence; 20 ms skew at 3.1 m/s is 62 mm; depth sets the deadline and frame rate does not."

open_questions:
  - "A learned world model predicts the hidden aisle well on average. What would it take for its prediction to count as evidence?"
  - "The walking speed 1.6 m/s is a convention. Who should decide the speed bound on a site, and what evidence should they need?"
  - "Should a robot slow down near every occlusion, or should the site add sensors at every rack end?"

more_examples:
  - "Spirit at Troy, 2009, and the JPL sandbox rehearsal (NASA/JPL photos)."
  - "SORT tracker defaults (abewley/sort) and ByteTrack's grace buffer (§9.9)."
  - "ROS 2 PoseWithCovarianceStamped, tf2's extrapolation check, and the QoS Deadline and Lifespan policies (real code and docs)."
  - "UMBmark (Borenstein and Feng 1996) and the KITTI odometry leaderboard (127 methods)."
  - "nvblox on a ground robot with a segmented person (Millane et al. 2024, Fig. 8, Table II)."
  - "OctoMap clamping, independent Markov-chain grids, Dynablox, Khronos (§9.6.1, table 3)."
  - "Bosch BMI088 IMU datasheet (§9.2)."
  - "Occluded reachable sets for automated driving (Orzechowski et al. 2018)."

further_reading:
  - cite: "Spatial Memory, §9.1 to §9.12, Napkin Math 9.1 to 9.3, Checkpoints 9.1 to 9.3"
    why: "Every number in the lecture, with the derivations."
  - cite: "Thrun, Burgard, and Fox, Probabilistic Robotics, MIT Press, 2005"
    why: "The Kalman filter, occupancy grids, and SLAM in one framework."
  - cite: "Bar-Shalom, Li, and Kirubarajan, Estimation with Applications to Tracking and Navigation, Wiley, 2001"
    why: "NEES, NIS, gating, and filter consistency."
  - cite: "Hornung et al., OctoMap, Autonomous Robots, 2013"
    why: "Keeping unknown apart from free in a 3D map."
  - cite: "Oleynikova et al., Voxblox, IROS 2017; Millane et al., nvblox, ICRA 2024"
    why: "Distance fields built incrementally from range data, on CPU and GPU."
  - cite: "Orzechowski, Meyer, and Lauer, Tackling Occlusions and Limited Sensor Range with Set-Based Safety Verification, ITSC 2018"
    why: "The same free-space erosion idea in automated driving."

left_to_reading:
  - concept: "Extended and unscented Kalman filters"
    why: "Detail better read than heard; the lecture keeps the linear recursion and the consistency tests."
  - concept: "Multi-rate semantic mapping and 3D scene graphs (secondary)"
    why: "One idea (semantics never certify clearance) carried in notes; the second lecture would teach it with the scene-graph figure."
  - concept: "Episodic memory and covariance growth with the cube of time (§9.6.3, §9.7.4)"
    why: "Covered in the reading; the lecture uses bounded-disturbance growth laws."

