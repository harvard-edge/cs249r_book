<svg xmlns="http://www.w3.org/2000/svg" width="6.40in" height="3.70in" viewBox="0 0 640 370" font-family="Helvetica, Arial, sans-serif">
<rect width="640" height="370" fill="white"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="10" stroke="#94A3B8" stroke-width="3"/></pattern></defs>
<line x1="40" y1="150" x2="610" y2="150" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
<text x="600" y="195" font-size="21" fill="#334155" text-anchor="end" font-weight="normal">time</text>
<line x1="90" y1="116" x2="90" y2="184" stroke="#0F766E" stroke-width="5"/>
<text x="90" y="58" font-size="23" fill="#0F766E" text-anchor="middle" font-weight="bold">acquisition</text>
<text x="90" y="90" font-size="20" fill="#0F766E" text-anchor="middle" font-weight="normal">photons strike</text>
<line x1="330" y1="116" x2="330" y2="184" stroke="#1F407A" stroke-width="5"/>
<text x="330" y="58" font-size="23" fill="#1F407A" text-anchor="middle" font-weight="bold">estimate</text>
<text x="330" y="90" font-size="20" fill="#1F407A" text-anchor="middle" font-weight="normal">instant it describes</text>
<line x1="520" y1="116" x2="520" y2="184" stroke="#64748B" stroke-width="5"/>
<text x="520" y="58" font-size="23" fill="#64748B" text-anchor="middle" font-weight="bold">publication</text>
<text x="520" y="90" font-size="20" fill="#64748B" text-anchor="middle" font-weight="normal">message sent</text>
<line x1="90" y1="220" x2="560" y2="220" stroke="#DC2626" stroke-width="3" marker-end="url(#arrR)"/>
<text x="320" y="258" font-size="21" fill="#DC2626" text-anchor="middle" font-weight="bold">evidence age: measured from acquisition</text>
<text x="320" y="310" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">Prediction moves the estimate epoch;</text>
<text x="320" y="340" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">only a new measurement moves acquisition.</text>
</svg>
