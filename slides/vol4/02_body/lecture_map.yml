    why: "Derivation detail for the reading."

closing:
  return_to_hook: "Diagnose frame: Schiaparelli lacked the conditions element and the detector; synthesis table shows each budget's number and weakest condition, the credible deceleration first to qualify."
  read_and_practice: ["§2.1 to §2.10", "Checkpoints 2.1 to 2.3", "Napkin Math 2.1 to 2.7"]
  further_reading:
    - cite: "Lynch and Park, Modern Robotics, 2017"
      url: "https://hades.mech.northwestern.edu/index.php/Modern_Robotics"
      why: "Actuation, gearing, and dynamics from first principles."
    - cite: "Hogan, Impedance Control, 1985"
      url: "https://doi.org/10.1115/1.3140702"
      why: "Contact as a spring and damper set in software."
    - cite: "Pratt and Williamson, Series Elastic Actuators, IROS 1995"
      url: "https://doi.org/10.1109/IROS.1995.525827"
      why: "A spring in the drive on purpose, for force sensing and shock."
    - cite: "Hwangbo et al., Learning Agile and Dynamic Motor Skills, Science Robotics 2019"
      url: "https://doi.org/10.1126/scirobotics.aau5872"
      why: "A learned actuator model closes the simulator's torque gap."
    - cite: "ESA, ExoMars 2016 Schiaparelli Anomaly Inquiry, 2017"
      url: "https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/Exploration/ExoMars/Schiaparelli_landing_investigation_completed"
      why: "The hook in full."
  bridge: "Next lecture (Lecture 3, The Cognitive Brain): why can a robot recognize what to do yet still be too late to act?"

