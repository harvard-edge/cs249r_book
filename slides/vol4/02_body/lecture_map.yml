second_lecture_split: "Split after the Actuators segment (end of §2.4): Part 1 the motion budgets (freshness, momentum, actuation); Part 2 the energy budgets (heat, power), measuring limits, and the limit record, with Schiaparelli closing Part 2. The plan says 'after §2.3' but lists actuation with the motion budgets; §2.4 is actuation, so the boundary falls after §2.4."

notes_for_author:
  - "The kit has no stopping-budget bar or five-budget icon set yet; this deck draws its own three-row stop bars (images/make_figs.py). When the kit bar exists, swap it in."
  - "Real measured data are thin in this chapter: most numbers are illustrative or datasheet-derived on the reference platform. Each segment pairs them with a real artifact (photos, ROS 2 source, ESA inquiry, vendor datasheets as cited by the chapter)."
  - "The strain wave gear photo's Commons page was matched by title (Harmonic Drive AG strain wave gear set); the chapter credits Pieceofmetalwork, CC BY-SA 4.0."
