chapter: 02_body
lecture: "2"
title: "The Physical Body"
layer: body
minutes: 75
notes_minutes: 70.5
core_minutes: 57
target_ideas: 28
thesis: "Every action draws on five physical budgets at once (freshness, momentum, actuation, heat, power), and the budget that binds first sets what the permission path may admit."

hook:
  minutes: "0-3.5"
  setup: "ExoMars Schiaparelli, 19 October 2016 (War Story 2.1). Photos: the lander model at ESOC and the MRO Context Camera before-and-after images of the site. Built in four steps: the IMU saturation flag outlasts the 15 ms assumed at acceptance; the estimator integrates the threshold rate, attitude drifts about 165 degrees, altitude computes negative; the parachute is released at 3.7 km and the thrusters fire 3 s of 30 s; impact at 540 km/h (150 m/s, derived)."
  question_to_class: "Which part failed? A) the gyroscope B) the guidance code C) a limit used outside its conditions"
  payoff: "C. The sensor worked as specified and the code ran as written; a limit measured under one condition was used outside it, and no detector checked the estimate. The limit-record segment returns with a Diagnose activity: which of the six elements was missing (conditions and detector)."
  sources:
    - "The Physical Body, War Story 2.1 (15 ms, about 165 degrees, 3.7 km, 3 s of 30 s, about 150 m/s)."
    - "ESA press release, Schiaparelli landing investigation completed, 2017: 3 s instead of 30 s, free fall from about 3.7 km, 540 km/h."

recall: "Lecture 1, close your notes: at 1.5 m/s with 133.6 ms of delay and 2 m/s2 braking, how far does the base travel? 200.4 + 562.5 = 762.9 mm of 1,100 mm; crossover 0.53 m/s. Today asks where the 2 m/s2, the 1.5 m/s, and the delay come from in the body."

driving_question: "Why can a correctly chosen action still demand more than the machine's body can deliver?"

goals:
  - "Compute a freshness deadline, and count an observation's age from exposure to torque onset."
  - "Solve the stopping distance for the speed ceiling, and find the ceiling that sets the credible deceleration."
  - "Explain what a gear ratio buys and costs, and why an acknowledged command may not deliver torque."
  - "Budget a burst against thermal history and a stop against the shared power bus, and write the limit record."

law_and_record: "Part I law: the first law, irreversibility (stated on the goals slide). Record added: the limit record."

running_example: "The warehouse mobile manipulator (the running machine): 368 kg loaded (derived upper bound), 1.5 m/s drive limit, 1.10 m clear distance, 2 m/s2 credible deceleration (illustrative), two ZLLG10ASM800 direct-drive hub motors (60 N m peak at 25 A, 20 N m rated), a Panda-class arm with a TQ ILM 70x18 plus CSG-25 stand-in joint, a 48 V-class bus (54 to 42 V, MiR250 envelope) with a 33 V converter lockout. Shown as a real machine of its class: ER-FLEX (MiR250 base with a UR16e arm). The mug on the pick-station conveyor carries the freshness segment."

segments:
  - name: Freshness
    divider_question: "How old is a measurement when torque appears?"
    read: "§2.2"
    concept_questions: [1, 2, 3, 4]
    land: "Age runs from exposure to onset, inference is about half of it, and the tail decides whether the deadline holds."
    minutes: 10
  - name: Stopping
    divider_question: "How fast may the base drive toward a person?"
    read: "§2.3"
    concept_questions: [5, 6, 7]
    land: "The stop is linear in delay and quadratic in speed, and its deceleration is the smallest of three separately owned ceilings."
    minutes: 11.5
  - name: Actuators
    divider_question: "Does an acknowledged torque command deliver torque?"
    read: "§2.4"
    concept_questions: [8, 9, 10]
    land: "A setpoint is a current request that voltage, the current limit, and the gear ratio shape; the ratio trades heat for inertia."
    minutes: 12.5
  - name: Heat and Power
    divider_question: "Where does the energy go when the body works?"
    read: "§2.5, §2.6, §2.8.2"
    concept_questions: [11, 12, 13]
    land: "Heat arrives in seconds and leaves in minutes, and the shared bus must hold during a coincident step and absorb a stop."
    minutes: 14.5
  - name: Limits
    divider_question: "When may the permission path rely on a number?"
    read: "§2.7, §2.8"
    concept_questions: [14]
    land: "A number governs admission only as a record with its conditions, evidence category, and a detector."
    minutes: 8

concept_questions:
  - q: "When does a measurement start aging, and when does its age stop mattering?"
    picture: "Real photo: a propeller distorted by a rolling-shutter camera; four boundary events (capture, dispatch, admission, onset)."
    numbers: "None beyond the definitions (§2.2.2)."
    example: "Rolling-shutter camera on the wrist."
    read: "§2.2.1, §2.2.2"
  - q: "How much of an observation's age is the model?"
    picture: "Waterfall of the grasp path, 3 steps: benchmark 18.5 ms; median chain 35 ms; p99 46.2 and p99.9 68.4 against the 60 ms deadline."
    numbers: "Table 1 (illustrative): stage medians 11.2, 1.4, 18.5, 0.6, 1, 2.3 ms; stage p99 sum 50 against end-to-end 46.2 ms; inference 53 percent of the median (derived)."
    example: "Arm wrist-camera grasp path."
    read: "§2.2.2"
  - q: "How old may the mug's observation be?"
    picture: "Mug travel bars against the 12 mm allowed error."
    numbers: "Equation 1: 12 mm / 0.20 m/s = 60 ms; travel 7 mm at the median, 13.7 mm at p99.9, 1.7 mm past (NM 2.1; derived)."
    example: "Mug on the pick-station conveyor."
    read: "§2.2, NM 2.1"
  - q: "Where should the timestamp be taken?"
    picture: "Real code: ros2/demos cam2image.cpp stamps the header after grab and display."
    numbers: "Stages 1 to 4 of table 1 (12.6 ms at the median) disappear from the age."
    example: "ROS 2 camera demo; Systems Perspective 2.2."
    read: "§2.2.2"
  - q: "How does speed enter the stopping distance?"
    picture: "Three stacked stopping bars against the person at 1,100 mm."
    numbers: "742.5 mm (body terms), 912.9 mm (133.6 ms delay), 1,417.2 mm at 2 m/s (figure 2, NM 2.2)."
    example: "The aisle run toward a rack end."
    read: "§2.3.1, NM 2.2"
  - q: "What speed may the base drive for a given clear distance?"
    picture: "Velocity ceiling against clear distance, 3 curves."
    numbers: "Equation 3: 1.91 m/s with body terms (NM 2.2); 1.70 m/s with 133.6 ms; 1.35 m/s on the inspected floor (derived)."
    example: "Person stepping out at 1.10 m."
    read: "§2.3.2"
  - q: "What sets the credible deceleration?"
    picture: "Real photo of an opened hub motor; deceleration ceiling bars against 2.0 m/s2."
    numbers: "Dry floor 4.80, peak current 2.33, inspected floor 1.18, rated current 0.78 m/s2; tip-over unmeasured; 16.6 percent margin (NM 2.3)."
    example: "ZLLG10ASM800 hub motors."
    read: "§2.3.1, NM 2.3"
  - q: "Does a torque setpoint deliver torque at once?"
    picture: "Concept question (fallacy) with the winding equation; voltage needed for braking and driving at 25 A."
    numbers: "2.7 ms electrical time constant; 1.1 ms rise; back-EMF 28.2 V at 1.5 m/s; 10.7 V braking, 45.7 V driving against a 42 V pack (§2.4.2, NM 2.3)."
    example: "Hub motor at the drive limit."
    read: "§2.4.2"
  - q: "What does a gear ratio buy and cost?"
    picture: "Joint acceleration against gear ratio, N* = 39, 100:1 keeps 67.7 percent; strain wave gear and broken tooth photos."
    numbers: "50 g rotor through 100:1 acts as an 11.2 kg flywheel of 10 cm radius (§2.4.3)."
    example: "Panda-class arm joint."
    read: "§2.4.3, §2.4.4"
  - q: "Can a gear ratio cut holding heat and reflected inertia together?"
    picture: "Table at 100:1, 50:1, 10:1 beside a Franka Panda photo."
    numbers: "59.3 W and 0.183 kg m2 at 50:1; 14.8 W and 0.734 at 100:1; 10:1 needs 10.2 N m, 2.5 times peak (NM 2.4)."
    example: "TQ ILM 70x18 with a CSG-25 gear."
    read: "§2.4.5, NM 2.4"
  - q: "Why is continuous torque a third of peak?"
    picture: "Real photo of a burnt stator; S1 and S3 torque-speed envelope."
    numbers: "4.05 N m peak, 1.25 continuous (3.2 times); voltage limit 2,110 to 1,570 rpm (§2.5, figure 6a)."
    example: "Arm stand-in motor."
    read: "§2.5.1, §2.5.3"
  - q: "How long can a burst last, and what does thermal history change?"
    picture: "Winding temperature curves from cold and heat-soaked starts against 155 degrees C."
    numbers: "78.4 s cold, 43.1 s heat-soaked, 45.1 percent less (NM 2.5); stall 238.4 degrees C, 73.0 N m sustainable, 16.1 percent derating (NM 2.6)."
    example: "Elbow joint holding 87 N m."
    read: "§2.5.2, §2.5.4"
  - q: "What happens to the bus when compute and drives draw at once, and when the base stops?"
    picture: "Bus sag scale; regenerative surge scale; phase-short braking curve; supercapacitor photo."
    numbers: "70 A x 60 mOhm = 4.2 V; 37.8 V depleted, 4.8 V above 33 V lockout; 310.5 J to 176.5 V without a chopper; 828 W, at most 4.35 Ohm; phase short peaks 177.3 rpm; 2.025 F holds 140 J, 2.0 s (NM 2.7, §2.6.2, §2.8.2)."
    example: "48 V drive bus of the running machine."
    read: "§2.6, §2.8.2"
  - q: "When may the permission path rely on a number?"
    picture: "Real photo of a test stand; five evidence categories; the six-element limit record for the credible deceleration; Schiaparelli diagnose."
    numbers: "Table 3; rule of three: 3,000 clean stops bound about 1 in 1,000 (§2.7.2)."
    example: "Credible deceleration record; Schiaparelli."
    read: "§2.7"

concept_trace:
  - concept: Five-budget admission
    frame: "Admission needs margin in all five budgets at once"
    shows: "ER-FLEX photo beside the five inequalities with their units; build adds the simultaneous condition and 414 J."
  - concept: Measurement freshness deadline
    frame: "Does the grasp meet its 60 ms deadline?"
    shows: "Card with equation 1 (12 mm / 0.20 m/s = 60 ms); mug-travel bars against the 12 mm line, revealed in 2 steps."
  - concept: Velocity ceiling
    frame: "The velocity ceiling falls as the clear distance shrinks"
    shows: "Equation 3 under a 3-step plot of the ceiling against clear distance (1.91, 1.70, 1.35 m/s at 1.10 m)."
  - concept: Delivered torque ceiling
    frame: "The configured current limit caps delivered torque"
    shows: "Equation 4, the 60 against 20 N m card, the voltage-needed bars, and the measured-current detector."
  - concept: Gear ratio trade
    frame: "For one motor, holding heat times reflected inertia is fixed"
    shows: "Table of motor torque, copper loss, and reflected inertia at 100:1, 50:1, 10:1, and equation 6."
  - concept: Thermal duty limits
    frame: "How long can a hot joint hold a burst?"
    shows: "Two winding-temperature curves crossing 155 degrees C at 78.4 s and 43.1 s; preceded by the S1/S3 envelope frame."
  - concept: Shared-rail power integrity
    frame: "Compute and drives share one power rail, and a step sags it"
    shows: "Bus-sag voltage scale (33, 37.8, 42, 49.8, 54 V) built with the 4.2 V arithmetic; the surge estimate frame follows."
  - concept: Limit record
    frame: "A limit record carries six elements with its value"
    shows: "Six-row table for the credible deceleration revealed in 4 steps, detector highlighted."

worked_examples:
  - name: "Napkin Math 2.2: speed against delay"
    steps: ["Given 1.5 to 2 m/s at 2 m/s2", "Braking at 2 m/s is 1,000 mm, up 77.8 percent", "Adds 437.5 mm", "Equals 291.7 ms of delay at 1.5 m/s", "A speed setpoint may rise only after the quadratic is solved again"]
  - name: "Napkin Math 2.3: can the drives deliver 2 m/s2?"
    steps: ["Traction: mu at least 0.204, 0.250 at the rated share; dry 4.80, inspected 1.18", "Drive torque: 60 N m per wheel, 902.3 N, m_eff at most 387 kg, at least 2.33", "Rated current: 0.78", "Tip-over unmeasured", "The minimum governs; the margin is 16.6 percent at peak current"]
  - name: "Napkin Math 2.5 and 2.6: burst and stall"
    steps: ["200 W at three times rated current toward 540 degrees C", "78.4 s cold, 43.1 s heat-soaked", "Stall: feedback factor 0.4196, settles at 238.4 degrees C", "Sustainable 9.18 A, 73.0 N m, 16.1 percent derating"]
  - name: "Napkin Math 2.7: bus sag and regenerative surge"
    steps: ["70 A x 60 mOhm = 4.2 V; 37.8 V from a depleted pack", "75 percent of 414 J = 310.5 J", "Capacitor only: 176.5 V", "Chopper: 828 W peak, resistor at most 4.35 Ohm"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "Which part of Schiaparelli failed?"
    answer: "C, a limit used outside its conditions; the sensor saturated as specified and the code ran as written."
  - at_minute: 3.5
    type: retrieval
    prompt: "Recall: what did the stop cost in Lecture 1?"
    answer: "200.4 + 562.5 = 762.9 mm of 1,100; crossover 0.53 m/s."
  - at_minute: 13.5
    type: predict
    prompt: "Does the grasp meet its 60 ms deadline?"
    answer: "B: median 7 mm of 12, p99.9 13.7 mm, 1.7 mm past."
  - at_minute: 22
    type: estimate
    prompt: "What does 2 m/s cost in delay?"
    answer: "437.5 mm of added braking, equal to 291.7 ms of delay at 1.5 m/s."
  - at_minute: 30.5
    type: concept_question
    prompt: "True or false: a torque step arrives at once?"
    answer: "False: current rises over about 1.1 ms; at 1.5 m/s driving needs 45.7 V against a 42 V pack."
  - at_minute: 44.5
    type: predict
    prompt: "How long can a hot joint hold a burst?"
    answer: "B, 43.1 s against 78.4 s cold, 45.1 percent less."
  - at_minute: 51.5
    type: estimate
    prompt: "Where does a stop's 414 J go?"
    answer: "310.5 J would drive a capacitor-only bus to 176.5 V; a chopper must take 828 W through at most 4.35 Ohm."
  - at_minute: 61.5
    type: diagnose
    prompt: "Which element did Schiaparelli lack?"
    answer: "Conditions (15 ms held at acceptance only) and, above all, the detector (no plausibility check)."
  - at_minute: 64.5
    type: retrieval
    prompt: "Which budget binds first on the running machine?"
    answer: "Depends on the maneuver; the credible-deceleration premise (peak current, dry floor, unmeasured tip-over) is the first to qualify."

fallacies:
  - "Software step commands deliver instantaneous physical torque (concept question, Actuators)."
  - "Compute accelerators and motor inverters run on independent, ideal rails (bus-sag frame, WARN)."
  - "Model inference time defines the measurement freshness latency (waterfall frame)."

open_questions:
  - "Should the permission path still check each budget when the policy was trained against an actuator model with speed, voltage, and temperature inputs?"
  - "Which budget should a facility measure first on a new floor, and how often again?"
  - "Hydraulic Atlas gave way to an electric robot in 2024: which budgets moved, and which appeared?"

more_examples:
