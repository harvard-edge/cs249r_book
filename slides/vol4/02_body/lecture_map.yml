  - "Franka Emika Panda: seven torque-sensing joints with strain wave gears (Franka 2018)."
  - "ANYmal actuator network (Hwangbo et al. 2019): a learned actuator model closes the simulator torque gap."
  - "MIT Cheetah quasi-direct drive (Seok et al. 2015; Wensing et al. 2017)."
