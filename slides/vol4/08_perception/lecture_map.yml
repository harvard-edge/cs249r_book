chapter: 08_perception
lecture: "08"
title: "Sensor Perception"
subtitle: "Time, frame, and error of each observation"
layer: boundary_brain
minutes: 75
notes_minutes: 71.5
core_minutes: 58
target_ideas: 30
thread_line: "Thread: the third law, proposal is not permission. Record: the observation contract."
thesis: "An observation serves a moving machine only when it states when it was captured, in which frame it was measured, and how far its error has been measured, because the machine travels through every millisecond of its age."

hook:
  minutes: "0-3.5"
  setup: "Williston, Florida, May 2016 (War Story 8.1). NTSB presentation photos of the semitrailer and the Tesla Model S that passed beneath it; the car on Traffic-Aware Cruise Control and Autosteer at 74 mph (33.1 m/s, derived). Then the running machine: a real mobile manipulator of its class (ER-FLEX: MiR250 base, UR16e arm) and the aisle at the 1.5 m/s drive limit, a worker 1.10 m ahead at the rack end."
  question_to_class: "Predict: what failed at Williston? A) the camera stopped working B) the radar stopped working C) all parts ran; none saw the trailer D) the trailer was detected, too late."
  payoff: "C. NTSB Finding 1: no mechanical system on either vehicle failed; Finding 3: the system was not designed to, and did not, identify the truck crossing the car's path, so no alert and no automatic braking. The lecture then asks the second half of the driving question: when perception does see the obstacle, is its observation still true when the machine acts? The synthesis answers both: the rack-end frame is 51.6 ms old at dispatch (77.4 mm of travel, row 5 of the stopping budget), and a silent omission raises no flag that any record can refuse on."
  sources:
    - "NTSB, Highway Accident Report HAR-17/02 (2017), p. 2 (74 mph), Findings 1 and 3; read for this plan 2026-10-19"
    - "Sensor Perception, War Story 8.1 and figure of the NTSB presentation (book image)"
    - "ER-FLEX photo: Auledas, CC BY 4.0, Wikimedia Commons (description: MiR250 with UR16e)"

recall: "Retrieval (2 min): which rows of the stopping budget are already charged at the rack end (braking 562.5, localization and margin 150, onset 30, lease path 93: 835.5 of 1,100 mm, 264.5 left; calcs.py), and what did Lecture 7's evaluation record leave to the runtime (runtime monitors; the input-support and the latency and freshness monitors need dated, framed observations)."

driving_question: "Why can an accurate detection still be too late to guide a robot? (Purpose)"

goals:
  - "Choose a sensor by the physical quantity the decision needs, and say which one may veto."
  - "Date a measurement at capture and place it through calibrated frames."
  - "Build observation age stage by stage, 51.6 ms here, and charge it to the stopping budget."
  - "Set a clearance inset from measured residuals, and write the observation contract."

law_and_record: "Opens Part III: the third law, proposal is not permission (a design principle the book elevates; stated on the goals slide and in the focus note). Record added: the observation contract, record 6 of 16."

running_example: "The warehouse mobile manipulator on the aisle run at its 1.5 m/s drive limit, a worker stepping out at a rack end 1.10 m ahead; navigation camera (16 ms exposure, 3,040 rows read in 16.6 ms, 60 Hz), Ouster OS1-64 lidar at 20 Hz, safety microcontroller running the permission path (Sensor Perception, Napkin Math 8.1 to 8.3, tables 3 to 5; illustrative values labeled). Shown as a real system once (ER-FLEX photo). Real sensor data beside it: KITTI raw drive 2011_09_26_0001 (Velodyne HDL-64E sweep, color camera frame, host-clock timestamp logs, calibration files), MLPerf Inference v3.1 RetinaNet on Jetson AGX Orin, the Ouster OS1 rev7 datasheet, ROS 2 message definitions."

segments:
  - name: Sensors
    divider_question: "Which sensor measures what the decision needs?"
    read: "§8.1, §8.2.3 to §8.2.6"
    concept_questions: [1, 2, 3]
    land: "Sensing is chosen by the quantity the decision needs, and the range that may veto a proposal comes from a sensor the proposer does not use."
    minutes: 9.5
    real: "photo row of five real sensors; KITTI lidar returns projected into the camera (real data); SICK scanner photo"
  - name: Capture
    divider_question: "When and where was the measurement taken?"
    read: "§8.2, §8.3"
    concept_questions: [4, 5, 6, 7]
    land: "A measurement is dated at capture and placed through calibrated frames, or the machine cannot use it."
    minutes: 13.5
    real: "KITTI timestamp log and strip (real data); propeller photo; KITTI sweep and Ouster registered cloud (real data); KITTI calibration record"
  - name: Age
    divider_question: "How old is the observation when it is used?"
    read: "§8.4, §8.5"
    concept_questions: [8, 9, 10]
    land: "Observation age is paid in travel before any consumer can react, and no later stage returns it."
    minutes: 13
    real: "MLPerf v3.1 Orin RetinaNet log and Jetson photo; KITTI stamp-period scatter (real data)"
  - name: Error
    divider_question: "How far can the measurement be trusted?"
    read: "§8.6"
    concept_questions: [11, 12, 13]
    land: "Claimed error must be measured, and qualified metric evidence outranks semantic confidence."
    minutes: 10
    real: "OS1 datasheet precision band on the stereo plot; datasheet excerpt"
  - name: Contract
    divider_question: "What must a record say before anyone reads it?"
    read: "§8.7, §8.8"
    concept_questions: [14, 15]
    land: "A consumer can refuse only what the record lets it check, and it checks before it reads the payload."
    minutes: 12
    real: "KITTI frame with clipped pixels and histogram (real data); ROS 2 Header.msg and Imu.msg"

concept_questions:
  - q: "Which physical quantity does each sensor measure?"
    picture: "Photo row: Raspberry Pi HQ camera (Sony IMX477), Intel RealSense D435, Velodyne HDL-64E, SparkFun ITG-3200/ADXL345 IMU, Prophesee event camera"
    numbers: "Lidar range r = c t / 2; stereo error grows with z^2 (Sensor Perception table 1, §8.2.5)"
    example: "A worker standing still at the corner in dim light at 4 m"
    read: "§8.1, table 1"
  - q: "What does a camera give that a lidar does not, and the reverse?"
    picture: "KITTI frame 0 with 121,015 HDL-64E returns projected through the real calibration, colored by range"
    numbers: "121,015 returns in one sweep (calcs.py); HDL-64E 26.8° vertical field of view (Geiger et al. 2013, §II)"
    example: "Parked cars visible in the image; their range only from the dots"
    read: "§8.2.2, §8.2.5"
  - q: "Who guards the rack end, and which path may veto?"
    picture: "Three lanes: camera to learned proposer; lidar to clearance check on the safety MCU; certified safety scanner to the stop circuit; SICK scanner photo"
    numbers: "ISO 3691-4 person detection at PL d, second of five grades (§8.1)"
    example: "Vote: which range enters the clearance check (lidar; stereo washes out in dock sunlight, event camera loses a stopped worker, depth net shares the proposer's camera)"
    read: "§8.1, §8.2.3, §8.6.3"
  - q: "Which instant does a camera frame represent?"
    picture: "Timeline build: exposure, midpoint t0, readout, link and DMA, arrival stamp; trigger edge"
    numbers: "Arrival 26.6 ms late = 39.9 mm; trigger edge without T/2 = 8 ms early = 12 mm; 24 mm travel during the exposure (calcs.py)"
    example: "Navigation camera at 1.5 m/s"
    read: "§8.2, §8.3"
  - q: "What does a real sensor log look like?"
    picture: "KITTI timestamp files, sweep 20, and a strip of the lidar sweep with four camera stamps"
    numbers: "Sweep 103.2 ms; forward-facing at 51.6 ms; color stamps +10.5 ms, gray +16.7 ms after the trigger (111 sweeps, medians, calcs.py)"
    example: "One reed-contact trigger, four host-clock stamps"
    read: "§8.3; Geiger et al. 2013 §III.A"
  - q: "How far apart do the top and bottom rows see the same upright?"
    picture: "Propeller photo (rolling shutter) and the row-position plot"
    numbers: "5.46 µs per row; 24.9 mm along (0.50 of 50 mm); 9.1 mm sideways (6.1% of 150 mm); 21.6 mm at 1.3 m/s (Napkin Math 8.1, calcs.py)"
    example: "Estimate activity"
    read: "§8.2.1"
  - q: "How does a calibrated frame chain place a claim, and what does a mount error cost?"
    picture: "Frame tree (earth, map, odom, base_link, sensor_link) and a real KITTI calibration record; error bars against the 50 mm and 150 mm allowances; KITTI sweep colored by time from trigger with the Ouster registered cloud"
    numbers: "1° = 19.2 mm at 1.10 m, 262 mm at 15 m; car moved 1.36 m in one 103.1 ms KITTI sweep; OS1-64 at 20 Hz: 75 mm per sweep (calcs.py)"
    example: "Long-aisle look-ahead"
    read: "§8.2.5, §8.3, §8.3.1"
  - q: "Where do the 51.6 ms of observation age go?"
    picture: "Waterfall built in four steps with a travel axis"
    numbers: "8 + 16.6 + 0.8 + 1.2 + 2.5 + 22 + 0.5 = 51.6 ms, 77.4 mm; capture 48 percent, backbone 43 percent (Napkin Math 8.2, calcs.py)"
    example: "Predict activity"
    read: "§8.4.1, table 3"
  - q: "What does a measured detector take, and what does the age cost the stopping budget?"
    picture: "MLPerf log excerpt and bars; stopping-budget bar with row 5"
    numbers: "RetinaNet INT8 on Jetson AGX Orin: p99 11.79 ms (MLPerf v3.1); rows 1 to 5 = 912.9 mm; 187.1 mm left; pre-brake delay 133.6 ms (calcs.py)"
    example: "A faster model shortens one bar of seven"
    read: "§8.4.1"
  - q: "How does age keep growing after dispatch, and what stretches its tail?"
    picture: "Current-evidence-age timeline; KITTI stamp periods (lidar 103.1 to 103.3 ms, gray cameras 100.4 to 105.8 ms); phase margin line"
    numbers: "Dispatch limit 51.8 ms; dropped frame 16.7 ms, 25.0 mm, 13.4% of 187.1 mm; batching four frames 101.6 ms; phase margin gone at 78.5 ms, 60 ms spends 76.4% (calcs.py)"
    example: "Diagnose activity on the real KITTI periods"
    read: "§8.4.3, §8.4.4, §8.5, §8.8"
  - q: "How does stereo error grow with range, against lidar?"
    picture: "Stereo sigma_z against range with the OS1 datasheet band, built in three steps"
    numbers: "3.8 mm at 1.10 m; 50 mm at 4.0 m; 150 mm at 6.9 m; 12.5 mm at 2 m and 312.5 at 10 m; halved baseline 4.9 m (Napkin Math 8.3, calcs.py); OS1 precision 5 to 30 mm (datasheet rev7)"
    example: "Estimate activity"
    read: "§8.6, Napkin Math 8.3"
  - q: "Which numbers must be measured, and how is the inset set?"
    picture: "OS1 datasheet excerpt; heavy-tailed residual schematic with C_safe and C_inset"
    numbers: "Accuracy 25 mm lambertian, 50 mm retroreflective; PTP <1 ms; 10 ppm drift = 10 µs per 1 s; conformal rank: 99 residuals minimum for 1%, 991st of 1,000; shortcut insets 162.5 and 462.5 mm (calcs.py)"
    example: "A new floor finish breaks exchangeability"
    read: "§8.6.1, §8.6.2"
  - q: "Can a confident semantic label overrule metric range?"
    picture: "Timeline: 2 Hz vision-language model says clear aisle; 20 Hz lidar sees a return; permission path halts"
    numbers: "Ten lidar sweeps per model evaluation (calcs.py)"
    example: "Systems Perspective 8.3"
    read: "§8.6.3"
  - q: "Which failures raise no flag, and which is worse, a lost frame or a misdated one?"
    picture: "KITTI frame with 7.5% of pixels clipped and its histogram; lost against misdated distributions"
    numbers: "Misdated by 26.6 ms: 39.9 mm off with a narrower spread; lost: 16.7 ms older; fog 0.05 per m leaves contrast 0.05 at 60 m (calcs.py)"
    example: "Vote; two fallacies as true or false"
    read: "§8.7, §8.9"
  - q: "What must the observation contract carry, and what does ROS 2 already carry?"
    picture: "Contract fields table built by groups; ROS 2 Header.msg and Imu.msg excerpts"
    numbers: "Clock bound 0.2 ms, dispatch limit 51.8 ms; travel during the bound 0.3 mm (table 5, calcs.py)"
    example: "Navigation camera record"
    read: "§8.8"

concept_trace:
  - concept: "Sensor chosen by physical quantity"
    frame: "Each sensor measures one physical quantity"
    shows: "five real sensors, each captioned with the quantity it measures; then the vote on which range enters the clearance check"
  - concept: "Capture epoch"
    frame: "A frame's capture epoch is the midpoint of its exposure"
    shows: "three-step timeline: midpoint t0, arrival stamp 39.9 mm, trigger edge 12 mm; slide text defines capture epoch"
  - concept: "Calibration chain"
    frame: "Every claim reaches the world through a chain of frames"
    shows: "frame tree after REP 105 and a real KITTI calibration record (R, T, K); 1° error 19.2 mm and 262 mm"
  - concept: "Observation age"
    frame: "Predict: where do the 51.6 ms go?"
    shows: "waterfall built in four steps to 51.6 ms and 77.4 mm; next frames charge it as row 5 of the stopping budget"
  - concept: "Clearance inset from measured residuals"
    frame: "The clearance inset rests on a measured 99th-percentile residual"
    shows: "residual distribution with C_safe, C_inset and the tail, then the conformal rank (99; 991st of 1,000)"
  - concept: "Metric veto"
    frame: "Qualified lidar range holds a metric veto over a learned label"
    shows: "timeline: 2 Hz label says clear, 20 Hz lidar return inside the envelope, permission path halts"
  - concept: "Silent versus detectable failure"
    frame: "Vote: a lost frame or a misdated one?"
    shows: "two panels: lost frame widens honestly; misdated frame narrows 39.9 mm off; equation 11"
  - concept: "Observation contract"
    frame: "The observation contract lets a consumer refuse before reading"
    shows: "fields table built in four groups with the navigation camera values and each consumer check; record 6"

coverage:
  primary_taught: ["Sensor chosen by physical quantity", "Capture epoch", "Calibration chain", "Observation age", "Clearance inset from measured residuals", "Metric veto", "Silent versus detectable failure", "Observation contract"]
  primary_left_to_reading: []
  secondary:
    taught: ["Rolling-shutter and de-skew geometry (rows estimate; KITTI sweep, optional)", "Current evidence age", "Perception-side independence (guard frame, one sentence)", "Latency waterfall", "Clock domains and the clock-conversion bound (datasheet frame)", "Environmental degradation (glare frame, optional)", "Input-support monitors (glare frame note, optional)"]

worked_examples:
  - name: "Napkin Math 8.2: the latency waterfall"
    steps: ["given: seven stage allocations, 1.5 m/s", "exposure midpoint 8 + readout 16.6 = 24.6 ms before computation", "+ link, DMA, ISP = 29.1 ms", "+ backbone 22 and dispatch 0.5 = 51.6 ms", "77.4 mm; row 5: 835.5 + 77.4 = 912.9 mm, 187.1 left"]
  - name: "Napkin Math 8.1: the readout shear"
    steps: ["given: 3,040 rows in 16.6 ms, 1.5 m/s, 0.5 rad/s at 1.10 m", "5.46 µs per row", "24.9 mm along, 0.50 of the 50 mm allowance", "9.1 mm sideways, 6.1% of 150 mm", "compensate per row; slowing to 1.3 m/s still leaves 21.6 mm"]
  - name: "Napkin Math 8.3: the stereo range wall"
    steps: ["given: b 0.20 m, f 800 px, sigma_d 0.5 px", "sigma_z = z^2 sigma_d / (f b): 3.8 mm at 1.10 m", "z* = sqrt(C f b / sigma_d): 4.0 m for 50 mm, 6.9 m for 150 mm", "beyond a few meters use a range sensor or slow down"]
  - name: "Clearance inset by split conformal rank"
    steps: ["C_inset = C_safe + p99 residual norm", "rank ceil((n+1)(1-alpha))", "alpha 1%: n >= 99; n = 1,000 gives the 991st", "new campaign when the floor, lighting, or calibration changes"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "What failed at Williston?"
    answer: "C: no part failed (NTSB Finding 1); the system was not designed to, and did not, identify the crossing truck (Finding 3)."
  - at_minute: 5.5
    type: retrieval
    prompt: "Which stopping-budget rows are charged; what did the evaluation record leave to the runtime?"
    answer: "835.5 of 1,100 mm (562.5 + 150 + 30 + 93); runtime monitors, including input-support and latency/freshness."
  - at_minute: 16
    type: concept_question
    prompt: "Which range enters the clearance check at the rack end?"
    answer: "The spinning lidar, qualified on this floor; stereo washes out, the event camera loses a stopped worker, the depth net shares the proposer's camera and is unmeasured."
  - at_minute: 23
    type: estimate
    prompt: "How far apart do the top and bottom rows see the upright?"
    answer: "24.9 mm along (half of 50 mm), 9.1 mm sideways; 5.46 µs per row."
  - at_minute: 32
    type: predict
    prompt: "Where do the 51.6 ms go: backbone or capture?"
    answer: "Capture 24.6 ms (48%) before any computation; backbone 22 ms (43%)."
  - at_minute: 41
    type: diagnose
    prompt: "Why do KITTI's gray-camera stamps wander 100.4 to 105.8 ms when the trigger holds 103.1 to 103.3?"
    answer: "B: host delays enter software stamps; exposure would shift all stamps equally, and the lidar's own period is steady."
  - at_minute: 45
    type: estimate
    prompt: "At what range does one stereo sigma reach 50 mm, and 150 mm?"
    answer: "4.0 m and 6.9 m."
  - at_minute: 57
    type: concept_question
    prompt: "Which hurts more, a lost frame or one misdated by 26.6 ms?"
    answer: "The misdated frame: accepted as information, it narrows the spread around a position 39.9 mm off; the lost frame widens honestly."
  - at_minute: 59.5
    type: concept_question
    prompt: "True or false: high confidence admits an observation regardless of age; lidar is immune to specular surfaces."
    answer: "Both false: three frames late is 50 ms, 75 mm; puddles drop returns, glass makes phantoms, vests read short (±5 cm datasheet)."
  - at_minute: 66
    type: retrieval
    prompt: "Name the three things an observation must state and the two failures the record cannot catch."
    answer: "Capture time and clock, frame, measured error; a silent semantic omission and a scene outside the qualified support."

open_questions:
  - "Should capture age and calibration enter an end-to-end policy as tokens, and how would we test that the model uses them?"
  - "How many independent sensing channels does a person at a rack end deserve, and who decides?"
  - "A detector qualified on people standing upright may miss a kneeling worker. Whose detection rate does a contract report?"

