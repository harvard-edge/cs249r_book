    why: "Detail the chapter develops but the running machine does not carry; named in the sensor slide notes."
  - concept: "Hand-eye calibration (AX = XB) and covariance propagation through the frame tree"
    why: "Mathematical detail better read than heard; the lecture shows the chain and its cost."
  - concept: "Observation tokenizer for VLA policies"
    why: "Raised as an open question; §8.8."

closing:
  return_to_hook: "Rack end: the frame is 51.6 ms old at dispatch, 77.4 mm of travel; rows 1 to 5 use 912.9 of 1,100 mm. Williston: every part ran and nothing was detected; a contract exposes only faults it measures, so an omission needs independent sensing with characterized coverage and a conservative envelope."
  read_and_practice: ["§8.1 to §8.10", "Napkin Math 8.1 to 8.3 by hand", "Checkpoints 8.1 to 8.3", "exercise: measure camera stamp offsets in one KITTI drive"]
  further_reading:
    - cite: "Geiger, Lenz, Stiller, Urtasun, Vision meets Robotics: The KITTI Dataset, IJRR 2013"
      url: "https://www.cvlibs.net/publications/Geiger2013IJRR.pdf"
      why: "A documented sensor rig: trigger, shutters, host-clock stamps."
    - cite: "Furgale, Rehder, Siegwart, Unified Temporal and Spatial Calibration for Multi-Sensor Systems, IROS 2013"
      url: "https://doi.org/10.1109/IROS.2013.6696514"
      why: "Time offsets between sensors estimated as unknowns."
    - cite: "Hartley and Zisserman, Multiple View Geometry in Computer Vision, 2003"
      url: "https://www.robots.ox.ac.uk/~vgg/hzbook/"
      why: "Stereo geometry and its error."
    - cite: "Angelopoulos and Bates, Conformal Prediction: A Gentle Introduction, 2023"
      url: "https://doi.org/10.1561/2200000101"
      why: "The rank rule behind the clearance inset."
    - cite: "Gallego et al., Event-Based Vision: A Survey, TPAMI 2022"
      url: "https://doi.org/10.1109/TPAMI.2020.3008413"
      why: "Event cameras and their limits."
  bridge: "Lecture 9, Spatial Memory: how long can a robot act on a scene it can no longer see?"

second_lecture_split: "Split after the Age segment (chapter §8.4/§8.5, as the course plan says). Part 1: sensors, capture and calibration, observation age and the stopping budget (about 37 minutes here, room to add the lidar de-skew, the sector-streaming table 4, batching, and memory contention in full). Part 2: spatial error and the inset, learned depth and the metric veto, failure modes and degradation, the observation contract (about 23 minutes here, room to add hand-eye calibration, FMCW radar, input-support monitors, and the observation tokenizer)."

