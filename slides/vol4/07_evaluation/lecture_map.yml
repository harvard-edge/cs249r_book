chapter: 07_evaluation
lecture: "07"
title: Closed-Loop Evaluation
minutes: 75
target_ideas: 30
layer: world
thesis: "A physical success rate is conditional evidence about one machine, environment, and protocol, and each added nine of demonstrated reliability costs about ten times the trials, so evaluation states its bound and names the conditions it leaves to the runtime."
hook:
  minutes: "0-5"
  setup: "NHTSA's January 2017 closing report on PE 16-007: airbag-deployment crashes fell from 1.3 to 0.8 per million miles after Autosteer installation, 'almost 40 percent' (report Figure 11 and p. 10, shown as the real document)."
  question_to_class: "Which miles did the 0.8 crashes per million divide by: Autosteer-engaged miles or all miles?"
  payoff: "Footnote 22: all miles, not Autosteer use. The one cohort with complete exposure rose 59 percent (0.76 to 1.21; QCS 2019). The synthesis answers the same four denominator questions for the door campaign."
  sources: ["chapter War Story 7.1", "https://static.nhtsa.gov/odi/inv/2016/INCLA-PE16007-7876.PDF"]
driving_question: "Why can a robot pass every trial and still lack the evidence needed for deployment?"
running_example: "The warehouse mobile manipulator's cage-door campaign for checkpoint latch-bc-01: base stops 2 m out, arm approaches at the guarded 0.03 m/s, 15 N tripwire, 100 N latch limit, 25 s run plus 15 s reset, 20 of 20 clean (illustrative, ch §7.1, §7.7.2). Shown as a real system with a credited photo of an ER-FLEX mobile manipulator (MiR250 base, UR16e arm), labeled as the same class of machine, not the book's machine."
concept_questions:
  - q: "What did a published 40 percent crash-rate drop divide by?"
    picture: "NHTSA PE 16-007 Figure 11 and its footnote 22"
    numbers: "1.3 to 0.8 per million miles (38.5 percent, derived); complete-exposure cohort 0.76 to 1.21 (+59 percent, derived); exact exposure for 13 percent of vehicles"
    example: "Autosteer, 2017"
    read: "§7.10.1, War Story 7.1"
  - q: "What population does a physical success rate describe?"
    picture: "The estimand p(D) = E[phi(Traj(c))] with the five-part condition c built term by term"
    numbers: "None; the definition (equation 1)"
    example: "A worn tire changes p with no weight changed"
    read: "§7.2"
  - q: "Which conditions did twenty clean runs sample?"
    picture: "Coverage grid, 3 plate positions by 2 speeds, 1 cell with demonstrations and runs; TRI's declared evaluation settings (real camera frames)"
    numbers: "1 of 6 cells; base stopped, empty rack, Unit 01"
    example: "latch-bc-01"
    read: "§7.8, §7.10.1 Pathology 1"
  - q: "How do completion, autonomy, and supervisory burden differ?"
    picture: "Four door runs against three channels (table built row by row)"
    numbers: "Jammed-run manual reset 60 of 85 s, 70.6 percent of that run's cell time (derived)"
    example: "Clip, halt, operator rescue, unassisted"
    read: "§7.2.2"
  - q: "How is an intervened run scored?"
    picture: "Vote card"
    numbers: "9 of 10 is 90 percent; dropping the takeover reports 100 percent and infinite MTBI"
    example: "Gripper wedging against the latch"
    read: "§7.4.1, §7.10.1 Pathology 5"
  - q: "Does lower offline loss pick better policies?"
    picture: "Bars from Mandlekar et al. 2021 Appendix G plus their Figure G.1(a, b)"
    numbers: "Square: top checkpoint 80.7 percent, lowest validation loss 2.7; Transport 64.0 against 0.7 (published)"
    example: "BC-RNN on robomimic tasks"
    read: "§7.3"
  - q: "How fast does a 1 degree heading bias spend aisle clearance?"
    picture: "Lateral offset against distance: replay flat, closed loop reaching 15 cm"
    numbers: "MSE 3.05e-4 rad^2; 5.7 s, 8.6 m of a 30 m aisle at 1.5 m/s (derived)"
    example: "Navigation stack of the running machine"
    read: "§7.3.1, equation 2"
  - q: "Why does mean squared error hide contact failures?"
    picture: "Force against penetration, log-log, at 5e5 N/m"
    numbers: "15 N at 0.03 mm, 100 N at 0.2 mm, 1,000 N at 2 mm (derived)"
    example: "Latch interface"
    read: "§7.3.2"
  - q: "What can each evidence regime expose, and what is it blind to?"
    picture: "Two-axis map built one regime per step"
    numbers: "None; table 2"
    example: "Latch policy questions assigned to regimes"
    read: "§7.4.1"
  - q: "When may a simulator screen candidates?"
    picture: "SIMPLER Figure 1: real and simulated setups, real against simulated success"
    numbers: "About 1,500 paired episodes (Li et al. 2024)"
    example: "RT-1, RT-1-X, RT-2-X, Octo"
    read: "§7.4.2"
  - q: "What must a protocol fix before the first run?"
    picture: "TRI Figure 8, initial-condition overlay used by operators"
    numbers: "None"
    example: "Cool-downs, frozen predicate, full denominator"
    read: "§7.5"
  - q: "What does a clean record of n runs bound?"
    picture: "P(20 clean) against p, crossing alpha at 0.861"
    numbers: "86.1 percent lower limit; 13.9 percent failure; one-in-eight policy passes 6.9 percent of campaigns (derived)"
    example: "Twenty door runs"
    read: "§7.6, Napkin Math 7.1"
  - q: "What does each added nine cost?"
    picture: "Clean-run ladder with cell time; NIST stair test station photo"
    numbers: "29, 299, 2,995 runs; 33.3 h and 66.6 operator-hours for 99.9 percent (derived)"
    example: "Door cycle 40 s"
    read: "§7.7, Napkin Math 7.2, table 3"
  - q: "How many failure-free hours bound a hazard rate?"
    picture: "Exposure ladder with one rig-year line; RAND requirements against Waymo miles"
    numbers: "29,957 h at 1e-4; 3.0 million at 1e-6; 3.0 billion at 1e-9; rig-year bound 3.4e-4 (derived); RAND 275M, 3.9M, 1.6M; Waymo 56.7M"
    example: "Warehouse site target, road vehicles"
    read: "§7.9.1, Napkin Math 7.3"
  - q: "What does the evaluation record hand to the runtime?"
    picture: "Seven-field record card with gaps routed to five monitor channels"
    numbers: "Failure at most 13.9 percent (95 percent); five unvisited cells"
    example: "latch-bc-01"
    read: "§7.8, §7.9.3"
concept_trace:
  - concept: "Closed-loop estimand"
    frame: "A success rate belongs to a population of trial conditions"
    shows: "Equation 1 with the condition tuple revealed in four steps"
  - concept: "Outcome channels and censored trials"
    frame: "Completion, autonomy, and burden are three separate channels; Vote: an operator stops a wedging gripper. Score it?"
    shows: "Four-outcome table across Y, A, interventions; vote answer card naming right-censoring"
  - concept: "Offline evaluation illusion"
    frame: "The lowest validation loss picked a 2.7 percent policy; A 1° heading bias: how far down a 30 m aisle?"
    shows: "Mandlekar published bars and curves; replay against closed-loop drift plot"
  - concept: "Four evidence regimes"
    frame: "Each evidence regime trades one blind spot for another"
    shows: "Two-axis map built one quadrant per step, each with Shows and Blind to"
  - concept: "Predeclared trial protocol"
    frame: "A protocol fixes draws, predicate, and denominator first"
    shows: "TRI initial-condition overlay and the three conditions"
  - concept: "Zero-failure bound"
    frame: "Twenty clean runs still allow one failure in seven; A 99.9 percent claim needs 2,995 runs, or 33.3 hours"
    shows: "Inversion plot; clean-run ladder"
  - concept: "Exposure wall"
    frame: "Bounding 10^-9 hazards per hour needs 3.0 billion clean hours"
    shows: "Failure-free hours ladder with the one rig-year line"
  - concept: "Evaluation record"
    frame: "The evaluation record hands untested conditions to the runtime"
    shows: "Seven-field record; gap catalog routed to five monitors and hard limits"
worked_examples:
  - name: "Napkin Math 7.1: the clean-record bound"
    steps: ["given 20 clean runs, alpha 0.05", "p^20 = 0.05", "ln 20 = 2.996, divided by 20 = 0.1498", "p_lower = 0.861; failure up to 13.9 percent", "a policy failing one run in seven is consistent with the record"]
  - name: "Napkin Math 7.2: the nines tax, and the 99.5 percent estimate"
    steps: ["n = ceil(ln 0.05 / ln p_target)", "29, 299, 2,995 runs", "2,995 x 40 s = 33.3 h", "class estimate: 99.5 percent needs 598 runs (rule of three 600), 6.6 h", "each nine multiplies runs, hours, and wear by ten"]
  - name: "Napkin Math 7.3: rig-years against the wall"
    steps: ["T >= 2.996 / lambda", "1e-4: 29,957 h; 1e-6: 3.0 million h (342 machine-years); 1e-9: 3.0 billion h", "one rig-year 8,766 h bounds lambda at 3.4e-4", "342 times short of 1e-6", "past the wall, evidence must come from the permission path and physical safeguards"]
  - name: "Aisle drift (equation 2)"
    steps: ["1 degree, 1.5 m/s, 15 cm clearance", "replay MSE 3.05e-4 rad^2, constant", "t = 0.15 / (1.5 sin 1 degree) = 5.7 s", "8.6 m along a 30 m aisle", "offline scores cannot see integration"]
active_learning:
  - at_minute: 3
    type: predict
    prompt: "Which miles did the 0.8 crashes per million divide by?"
    answer: "All miles after installation (footnote 22); complete-exposure cohort rose 59 percent."
  - at_minute: 5.5
    type: retrieval
    prompt: "What does latch-bc-01's policy manifest declare as its supported region?"
    answer: "One cell of six: nominal plate at 0.03 m/s; plus an omission log."
  - at_minute: 18
    type: concept_question
    prompt: "An operator stops a wedging gripper: discard, success, or autonomy failure?"
    answer: "Autonomy failure, kept in the denominator (90 not 100 percent); right-censored for the crash question."
  - at_minute: 23
    type: predict
    prompt: "A 1 degree heading bias: how far down a 30 m aisle?"
    answer: "About 9 m (8.6 m, 5.7 s)."
  - at_minute: 33
    type: concept_question
    prompt: "Assign each latch question to a regime."
    answer: "Shadow, simulation, constrained physical test, replay."
  - at_minute: 45
    type: estimate
    prompt: "Clean runs and cell hours for 99.5 percent at 95 percent?"
    answer: "598 runs (rule of three 600), 6.6 h."
  - at_minute: 54
    type: predict
    prompt: "Do 56.7 million miles bound the fatality rate?"
    answer: "No; 275 million zero-fatality miles needed (4.9 times). Injury and crash bars are cleared."
  - at_minute: 61
    type: diagnose
    prompt: "Which monitor covers each gap?"
    answer: "Input support, latency and freshness, environmental assumption; glass wall needs physical safeguards."
  - at_minute: 65
    type: concept_question
    prompt: "Four fallacies, true or false"
    answer: "All false (99.70 percent after 1,000; censoring; 2.7 against 80.7; peeking)."
left_to_reading:
  - concept: "Bounds with failures (equation 6), Wilson and Jeffreys intervals"
    why: "One number given in a note (78.4 percent); the derivation reads better than it lectures."
  - concept: "Bonferroni allocation for the recovery update (latch-bc-recovery-02, 3,688 runs per cell)"
    why: "Detail of §7.8.1; the lecture keeps one checkpoint."
  - concept: "Supervised intervention campaign (MTBI 15.8 min, Garwood 2.7 to 5.2 per hour) and wheel-bearing revolutions"
    why: "Worked in §7.9.1; the lecture's time goes to the wall itself."
segments:
  - name: Denominators
    minutes: "1-21"
    aha: "A success rate is a count over a declared population, with every intervention kept and attributed."
  - name: Closing the Loop
    minutes: "21-36"
    aha: "Open-loop scores cannot certify closed-loop behavior, and every regime is blind to something."
  - name: Clean Records
    minutes: "36-52"
    aha: "A clean record buys a bound, and each nine costs ten times the runs."
  - name: Exposure Wall
    minutes: "52-65"
    aha: "Past the exposure wall, safety evidence comes from the permission path and physical safeguards, and the record says where."
  - name: Wrap-Up
    minutes: "65-71"
open_questions:
  - "A fleet logs millions of hours, all in one facility. How much diversity must a claim sample, and who decides?"
  - "Learned world models now generate test scenes. What paired real evidence should earn one the right to screen?"
  - "Interventions censor the failures a test most needs. Should some trials run to failure on sacrificial hardware?"
more_examples:
  - "NHTSA PE 16-007 and the QCS 2019 replication (War Story 7.1)"
  - "Mandlekar et al. 2021: lowest validation loss selects a 2.7 percent policy"
  - "SIMPLER (Li et al. 2024): paired real and simulated evaluation, about 1,500 episodes"
  - "TRI LBM Team 2025: 1,800 blind A/B rollouts with predeclared initial conditions"
  - "RAND RR-1478 against Waymo's 56.7 million rider-only miles (Kusano et al. 2025: 79 and 81 percent reductions)"
  - "NIST response-robot test bays and Mcity: standardized arenas bound their own claims"
  - "DARPA Atlas: evaluating a machine that falls (Systems Perspective 7.2)"
closing:
  return_to_hook: "Four denominator questions (exposure, who acted, bound, what is left) answered for NHTSA 2017 and for the door campaign."
  record: "Evaluation record (record chain, after the policy manifest)."
  read_and_practice: ["§7.1 to §7.12", "Checkpoints 7.1 to 7.3", "Napkin Math 7.2 redone for 99.5 percent"]
  further_reading:
    - cite: "Hanley and Lippman-Hand, If Nothing Goes Wrong, Is Everything All Right?, JAMA 1983"
      why: "The rule of three from clinical trials."
    - cite: "Kalra and Paddock, Driving to Safety, RAND RR-1478, 2016"
      url: "https://www.rand.org/pubs/research_reports/RR1478.html"
      why: "The exposure wall in road miles."
    - cite: "Butler and Finelli, The Infeasibility of Quantifying the Reliability of Life-Critical Real-Time Software, IEEE TSE 1993"
      why: "The same wall for flight software."
    - cite: "Kress-Gazit et al., Robot Learning as an Empirical Science, 2024"
      url: "https://arxiv.org/abs/2409.09491"
      why: "Reporting standard for robot trials."
    - cite: "Li et al., Evaluating Real-World Robot Manipulation Policies in Simulation (SIMPLER), CoRL 2024"
      url: "https://arxiv.org/abs/2405.05941"
      why: "Paired sim-and-real screening."
  bridge: "Next lecture (Sensor Perception): a detection can be correct and already late; what must an observation state before the machine acts on it?"
