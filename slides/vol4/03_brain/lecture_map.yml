  - cite: "Wulf and McKee, Hitting the Memory Wall, 1995"
    url: "https://doi.org/10.1145/216585.216588"
    why: "The two-page paper that named the limit."
  - cite: "Williams, Waterman, and Patterson, Roofline, CACM 2009"
