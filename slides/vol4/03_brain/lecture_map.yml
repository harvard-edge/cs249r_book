chapter: 03_brain
lecture: "03"
title: The Cognitive Brain
subtitle: Learned proposers, the memory wall, and action chunks
minutes: 75
notes_minutes: 70.5
core_minutes: 61.0
recall: "Lectures 1 and 2: the proposal boundary (learned models propose; the permission path and drives command) and the freshness deadline; the mug's 12 mm margin at 0.20 m/s lasts 60 ms."
target_ideas: 30
layer: brain
volume: Volume IV, Physical AI
thesis: >-
  A learned proposer's renewal rate is bounded by the weight bytes it streams
  per evaluation, and action chunking keeps the actuators supplied without
  making the evidence behind the motion any fresher.
hook:
  minutes: "0-3.5"
  setup: >-
    The Jetson AI Lab log of OpenVLA-7B with INT4 weights on a Jetson AGX Orin
    64GB: time=336.2 ms for one frame, 336 ms mean (Franklin 2024). The running
    machine's application processor is the same module, and its intent model is
    sized after OpenVLA (Ch3 NM 3.1).
  question_to_class: >-
    If the base drives at its 1.5 m/s limit, how far does it move while the
    model computes one answer? A 5 mm, B 50 mm, C 0.5 m, D 5 m.
  payoff: >-
    C, 504 mm (derived: 0.336 s x 1.5 m/s). The synthesis splits the 336 ms into
    a 189 ms prefill and 147 ms of decode, and shows how the machine keeps the arm
    supplied (a 20 Hz chunk policy) while the permission path refuses anything
    whose evidence has aged past 219 ms.
  sources: ["Ch3 NM 3.1 and table 1", "https://github.com/dusty-nv/jetson-generative-ai-playground/blob/main/docs/openvla.md", "RM base max_velocity 1.5 m/s (Ch1 machine card)"]
driving_question: "Why can a robot recognize what to do yet still be too late to act?"
running_example: >-
  The warehouse mobile manipulator picks a ceramic mug off a conveyor moving at
  0.20 m/s. Application processor: Jetson AGX Orin (43 TFLOP/s dense FP16,
  204 GB/s peak, 142.8 GB/s sustained, illustrative 70 percent). A 7B intent
  model (INT4, 336 ms, run at 2 Hz) names the target; an 80M chunk policy
  renews every 50 ms with 16 setpoints 25 ms apart; a permission path checks
  on a 1 kHz tick (Ch3 Sec. 3.1, NM 3.1 to 3.3).

concept_questions:
  - q: "How far does the base move while the intent model computes once?"
    picture: "Jetson AI Lab per-frame log excerpt beside a photo of the Orin developer kit"
    numbers: "336 ms per frame at INT4 (Franklin 2024); 504 mm at 1.5 m/s (derived)"
    example: "OpenVLA-7B on Jetson AGX Orin 64GB"
    read: "§3.4.2"
  - q: "Why does a robot need a learned proposer at all?"
    picture: "Photo pair: a fixtured welding cell and a rescue arena with no fixtures"
    numbers: "none; the contrast is coverage (Ch3 Sec. 3.2)"
    example: "BMW Leipzig body shop; Hector rescue robot, RoboCup 2010"
    read: "§3.2"
  - q: "What does a VLA read, and how many tokens is one camera view?"
    picture: "Exact excerpt of OpenVLA-7B config.json (224 px images, patch-14 encoders, 256 action bins, Llama 2 7B)"
    numbers: "(224/14)^2 = 256 patches per view; 3 views + prompt + state about 800 tokens; embeddings 6.55 MB against 14 GB of weights (derived; Ch3 Sec. 3.3)"
    example: "OpenVLA"
    read: "§3.3"
  - q: "Which published models finish inside the robot's 50 ms chunk period on its own module?"
    picture: "MLPerf Inference single-stream p90 latencies on Jetson AGX Orin 64G, log axis, chunk and intent periods marked"
    numbers: "3 of 7 inside 50 ms; GPT-J 6B 4.2 s, 8.4x the 500 ms intent period; 10.2 s one round earlier (MLCommons v3.1, v4.0, v4.1, via MLSysIM)"
    example: "ResNet-50 0.64 ms, RetinaNet 11.7 ms, GPT-J 4.2 s"
    read: "§3.4"
  - q: "What limits how often a batch-1 model can produce a fresh answer?"
    picture: "Orin photo, then the kit accelerator node with on-chip memory and then off-chip memory outlined"
    numbers: "14 GB of FP16 weights over 142.8 GB/s = 98.0 ms, at most 10.2 Hz, 98x below the 1 kHz tick (NM 3.1)"
    example: "Intent model on the Orin"
    read: "§3.4.1 Definition 3.1"
  - q: "Why does prefill bind on arithmetic and decode on bandwidth?"
    picture: "Roofline with real axes: ridge 210.8 FLOP/byte; decode at 1 FLOP/byte; prefill at 288"
    numbers: "decode attains 0.204 TFLOP/s, 0.47 percent of the 43 TFLOP/s peak (Ch3 Sec. 3.4.1)"
    example: "One intent-model evaluation"
    read: "§3.4.1"
  - q: "How long does one evaluation take, and what does INT4 buy?"
    picture: "Stacked bars: FP16 189 + 588 = 777 ms, INT4 189 + 147 = 336 ms, against the 500 ms period"
    numbers: "NM 3.1; measured 840, 471, 336 ms (Franklin 2024)"
    example: "Worked example 1"
    read: "§3.4.1 NM 3.1"
  - q: "Is a quantized checkpoint the same model?"
    picture: "Table of computed vs measured latency with the measured action score; OpenVLA's desktop success rates"
    numbers: "action score 95.3 to 90.1 percent at INT4 on the module; OpenVLA INT8 58.1 percent at 1.2 Hz against 71.3 percent bfloat16 (Kim et al. 2024 Table 2)"
    example: "OpenVLA at three precisions"
    read: "§3.4.2 table 1"
  - q: "What does predicting a chunk of setpoints buy, and what does it not?"
    picture: "ALOHA 2 teleoperation workcell photo; supply numbers"
    numbers: "40 Hz x 14 GB = 560 GB/s, 3.9x the sustained bus; H = 16 gives 35 GB/s, 24.5 percent; reaction stays 50 + 40 = 90 ms (Ch3 Sec. 3.5.1)"
    example: "ACT chunks"
    read: "§3.5.1 Definition 3.2"
  - q: "Can the big model renew a chunk every 50 ms with a better decoder?"
    picture: "Decoder ladder on a log axis: 2.9 s, 899 ms, 264 ms, 241 ms, shared 189 ms prefill, 50 ms line"
    numbers: "Ch3 Sec. 3.5.1 (computed with MLSysIM)"
    example: "Binned tokens, FAST, parallel head, flow expert"
    read: "§3.5.1"
  - q: "How do deployed robots split the work?"
    picture: "Published slow and fast rates: Helix 7 to 9 Hz over 200 Hz; GR00T N1 10 Hz over 120 Hz; this machine 2 over 20 Hz"
    numbers: "Ch3 table 2 (Figure AI 2025; Bjorck et al. 2025)"
    example: "Two-speed brain"
    read: "§3.5.3 table 2"
  - q: "How long does the evidence behind a chunk stay true?"
    picture: "Drift against evidence age: belt drift 0.2 mm per ms untracked, slip drift 0.25 t^2 tracked, 12 mm margin"
    numbers: "60 ms untracked, 219 ms tracked; 2.0 mm at the 90 ms age; 43 mm at 400 ms (NM 3.3)"
    example: "The mug on the conveyor"
    read: "§3.5.2 NM 3.3"
  - q: "What may the arm do with the tail of a chunk?"
    picture: "Direct-replacement timing strip: in force 40 to 90 ms, evidence valid to 219 ms, buffer to 400 ms"
    numbers: "4 setpoints bridge a renewal; the chunk outlasts its evidence by 181 ms (NM 3.3)"
    example: "Worked example 3"
    read: "§3.5.2"
  - q: "What should the slow model hand the fast one?"
    picture: "Table of three interfaces against two checks (compare with depth, age against drift)"
    numbers: "Helix, GR00T N1, pi0.5, Gemini Robotics 1.5, Gemini Robotics-ER (Ch3 table 2)"
    example: "Target pose with capture time"
    read: "§3.5.3"
  - q: "Can an on-time, smooth proposal still be wrong?"
    picture: "Published OpenVLA example ending in robot.act(action); depth profile of a mug handle against a printed photograph; confidence against success"
    numbers: "Ch3 table 4 (illustrative): near OOD 0.89 confidence, 0.52 success"
    example: "The printed mug on a carton"
    read: "§3.6"

worked_examples:
  - name: "Napkin Math 3.1: pricing one intent-model evaluation"
    steps:
      - "given: 7B params, 32 layers, d = 4096, 288 input tokens, 7 output tokens; 43 TFLOP/s at 50 percent; 204 GB/s at 70 percent"
      - "sweep: 14 GB / 142.8 GB/s = 98.0 ms"
      - "prefill: 4.05e12 FLOP / 21.5 TFLOP/s = 188.5 ms"
      - "FP16: 189 + 6 x 98.0 = 777 ms; INT4: 189 + 6 x 24.5 = 336 ms"
    result: "336 ms, so the machine states 2 Hz; measured 336 ms on the module"
    meaning: "INT4 shrinks only the decode; the prefill caps any weight-only format at 5.3 Hz"
  - name: "Napkin Math 3.2: the renewal gap"
    steps:
      - "amortized FP16 sweep 98.0 / 16 = 6.1 ms per setpoint"
      - "INT4 evaluation 336 / 50 = 6.7 renewal periods"
      - "chunk policy sweep 0.16 GB / 142.8 GB/s = 1.12 ms"
      - "bus: 7 x 3.5 x 2 + 0.16 x 20 = 49 + 3.2 = 52.2 GB/s, 37 percent"
    result: "chunking is a supply lever; renewal needs a second, smaller model"
    meaning: "the 147 ms of intent decode per 500 ms contends with the chunk policy, so its 40 ms target must be measured under load"
  - name: "Napkin Math 3.3: chunk supply against the evidence horizon"
    steps:
      - "untracked 12 mm / 0.20 m/s = 60 ms"
      - "tracked sqrt(2 x 12 mm / 0.5 m/s^2) = 219 ms"
      - "age at replacement 50 + 40 = 90 ms, drift 2.0 mm, h_min = 4"
      - "whole chunk 400 ms: 3 + 40 = 43 mm > 15 mm"
    result: "the chunk outlasts its evidence by 181 ms"
    meaning: "the tail keeps setpoints flowing but grants no permission to finish; the chunk lease bounds how far the arm goes when renewal stops (Lecture 4)"

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "How far does the base move while the model thinks? A 5 mm, B 50 mm, C 0.5 m, D 5 m"
    answer: "C: 0.336 s x 1.5 m/s = 504 mm (derived)."
  - at_minute: 5
    type: retrieval
    prompt: "Who may command the drives, and how long does a measurement stay fresh?"
    answer: "Below the proposal boundary may command, above may only propose (Lecture 1); a measurement is fresh while error ceiling over speed bound has not elapsed (Lecture 2)."
  - at_minute: 13
    type: predict
    prompt: "Which of seven MLPerf models answer inside 50 ms on the Orin?"
    answer: "Three: classification 0.64 ms, question answering 5.7 ms, detection 11.7 ms."
  - at_minute: 24
    type: estimate
    prompt: "Price one FP16 evaluation: a 189 ms prefill plus how many 98 ms sweeps?"
    answer: "6 sweeps, 588 ms, 777 ms in all, 1.3 Hz, past the 500 ms period."
  - at_minute: 30
    type: estimate
    prompt: "Halve the input tokens. Does one INT4 evaluation fit a 200 ms period?"
    answer: "No: 94 + 147 = 241 ms. Only about 28 percent of the tokens would fit."
  - at_minute: 38
    type: predict
    prompt: "Which decoder renews a fresh chunk within 50 ms on this backbone?"
    answer: "None: the 189 ms prefill alone is 3.8x the period."
  - at_minute: 46
    type: estimate
    prompt: "Residual slip quadruples. Does the 90 ms age at replacement still fit?"
    answer: "Horizon halves to 110 ms; 90 ms fits with 20 ms to spare."
  - at_minute: 60
    type: concept_question
    prompt: "True or false: a smooth, in-limit chunk can be executed whenever it arrives; softmax confidence is a success rate."
    answer: "Both false: the full chunk carries the mug 43 mm off against 15 mm tolerance; near OOD reports 0.89 confidence at 0.52 success (illustrative)."
  - at_minute: 63
    type: retrieval
    prompt: "Close your notes: where do the 336 ms go, and what stops the arm acting on stale evidence?"
    answer: "189 ms prefill + 147 ms decode; a 20 Hz chunk policy renews in 90 ms, inside the 219 ms horizon; every proposal carries its capture time so the permission path can refuse it."

open_questions:
  - "A latent interface lets the fast policy learn whatever helps; a geometric target lets the permission path check it. Which tasks should a robot give up to stay refusable?"
  - "If the next module doubles memory bandwidth, should the machine spend it on a larger intent model or on faster renewal?"
  - "The INT4 checkpoint lost 5.2 points of action score on the module, while OpenVLA's INT4 build kept its real-robot success. What evidence should a team require before deploying a quantized proposer?"

more_examples:
  - "MLPerf Inference edge results on Jetson AGX Orin (MLCommons, v3.1 to v4.1)"
  - "Jetson AI Lab OpenVLA tutorial: FP16 840 ms, FP8 471 ms, INT4 336 ms (Franklin 2024)"
  - "OpenVLA-7B model card and config.json (Hugging Face)"
  - "ACT temporal ensembling, k = 0.01 (tonyzhaozh/act, imitate_episodes.py)"
