segments:
  - name: "Learned Proposers"
    minutes: "9-17"
    question: "What does a learned proposer read, and what does it cost on the robot's module?"
    frames: ["A fixtured welding cell can be modeled; a rescue arena cannot", "OpenVLA reads 256 tokens from each 224-pixel camera view", "Every retained token costs 0.52 MB of key-value cache", "Which models answer within 50 ms on the Orin?"]
  - name: "Memory Wall"
    minutes: "17-33"
    question: "How often can a 7B model produce a fresh answer on the Orin?"
    frames: ["Each fresh evaluation streams every weight from DRAM", "The weight-streaming ceiling falls as parameters grow", "Prefill reuses each weight 288 times; decode uses it once", "What does one FP16 evaluation cost?", "INT4 runs 2.5x faster on the module, and it is a new model", "Would half the input tokens fit a 200 ms period?"]
  - name: "Chunks"
    minutes: "33-52"
    question: "How does the arm stay supplied, and for how long is the supply true?"
    frames: ["A chunk cuts weight traffic 16-fold but not reaction time", "Which decoder renews a fresh chunk within 50 ms?", "Two proposers take 52.2 GB/s, 37% of the sustained bus", "Deployed robots run a slow model above a fast policy", "The evidence behind a tracked mug's chunk lasts 219 ms", "Chunk 0 runs 50 ms; its last 181 ms outlast the evidence", "If slip quadruples, does the 90 ms age still fit?", "ACT blends overlapping chunks, and a blend can split modes"]
  - name: "Refusable"
    minutes: "52-63"
    question: "What must a proposal carry so the permission path can refuse it?"
    frames: ["Only a geometric target can be checked against depth and aged", "OpenVLA's example passes its prediction straight to the robot", "A smooth, on-time grasp can target a printed mug", "Reported confidence stays high as task success falls", "Are these two claims true or false?"]

concept_trace:
  - concept: Memory-wall renewal ceiling
    frame: "Each fresh evaluation streams every weight from DRAM"
    shown_by: "Orin photo, kit node build (on-chip memory, then off-chip memory outlined), then f <= BW/W = 14 GB / 142.8 GB/s, 98.0 ms, at most 10.2 Hz"
  - concept: Prefill-decode split
    frame: "Prefill reuses each weight 288 times; decode uses it once"
    shown_by: "roofline build with real axes (ridge 210.8, decode 1, prefill 288) and the worked-example bars (189 ms prefill, 6 sweeps)"
  - concept: Quantized model is a new model
    frame: "INT4 runs 2.5x faster on the module, and it is a new model"
    shown_by: "table: computed vs measured latency and the measured action score per format; OpenVLA's INT8 and INT4 real-robot success"
  - concept: Chunking is a supply lever
    frame: "A chunk cuts weight traffic 16-fold but not reaction time"
    shown_by: "two-step build: 560 GB/s vs 35 GB/s bars, then the 90 ms reaction line"
  - concept: Two-speed brain
    frame: "Two proposers take 52.2 GB/s, 37% of the sustained bus"
    shown_by: "two-speed diagram with the renewal-gap steps; set up by the decoder ladder (no decoder under 50 ms) and confirmed by the published slow and fast rates (Deployed robots run a slow model above a fast policy)"
  - concept: Evidence horizon
    frame: "The evidence behind a tracked mug's chunk lasts 219 ms"
    shown_by: "drift-against-age plot built in three steps (60 ms, 219 ms, 43 mm at 400 ms) and the timing strip"
  - concept: Checkable proposer interface
    frame: "Only a geometric target can be checked against depth and aged"
    shown_by: "table of latent, language, and geometric interfaces against the two checks, revealed row by row"
  - concept: On-time wrong proposals
    frame: "A smooth, on-time grasp can target a printed mug"
