closing:
  return_to_hook: >-
    The 336 ms is 189 ms of compute-bound prefill and 147 ms of bandwidth-bound
    decode; the base would cover 504 mm in it. The machine therefore names the
    target at 2 Hz, renews motion at 20 Hz within 90 ms of capture, ages every
    chunk against the 219 ms evidence horizon, and sends proposals the
    permission path can refuse.
  read_and_practice: ["§3.1 to §3.8", "Checkpoints 3.1 to 3.3", "Napkin Math 3.1 to 3.3 by hand"]
  record: "No record of its own; the proposer limits enter the handoff record (Lecture 4)."
  bridge: "Lecture 4, The Nervous System: why must a moving machine keep checking its commands when its learned model stops responding?"

