notes_for_author:
  - "The kit's accelerator node labels off-chip memory HBM; the Orin uses LPDDR5 shared by CPU and GPU. The slide says so; a unified-memory kit variant would remove the caveat."
  - "The hook assumes the base drives at its 1.5 m/s limit while the intent model computes; the chapter's own pick-station scene moves the arm while the base waits. The course plan's hook uses the base, and the slide labels the distance as derived."
