chapter: 18_frontier
lecture: "18"
title: Engineering Physical AI
subtitle: The course's conclusion; spans the whole stack (no layer highlighted)
minutes: 75
notes_minutes: {total: 71.5, core: 58.5}
target_ideas: 28
thesis: "The weakest open premise, not the best prediction, sets what a machine may be trusted to do, and retiring that premise chooses what to build next."
hook:
  minutes: "0-3"
  setup: "Photo of a hydraulic pallet jack on polished concrete. A clear film crosses the aisle; the base runs at 1.3 m/s toward a rack end 1.10 m away; the dry stop is 969.0 mm."
  question_to_class: "How long is the stop on the film? A 969.0 mm, B 1.3 m, C 2.1 m, D no stop."
  payoff: "C, 2.13 m. Every deadline was met and no sensor reports the film. Segment 3 works the friction floor; the synthesis answers with a register entry, not a better model."
  sources: ["Napkin Math 18.2", "photo: Auledas, CC BY 4.0, Wikimedia Commons"]
driving_question: "Why does a better model not, by itself, make a better machine?"
running_example: "The warehouse mobile manipulator's aisle run at 1.3 m/s (MLSysIM Embodied.Scenario.WarehouseAisle): known-component stop 969.0 mm dry, 2.13 m on a film (mu 0.05), clear distance 1.10 m; second case, the packaging cell (Napkin Math 18.1)."
concept_questions:
  - q: "Which law did each part of the course add, and which record?"
    picture: "kit stack_roadmap"
    numbers: "four laws; sixteen records"
    example: "limit, provenance, enforcement, release manifest"
    read: "§18.1"
  - q: "How does the whole machine close its loop, and at what rates?"
    picture: "closed_loop build (slide variant of §18.1 figure 1) beside an ER-FLEX photo"
    numbers: "2 Hz proposals, 1 kHz permission tick, 20 kHz current loop (§18.1)"
    example: "a film reaches no level"
    read: "§18.1"
  - q: "What does each law leave behind, and what must stay true?"
    picture: "table 1 built row by row"
    numbers: "four laws, records by part"
    example: "the film breaks row one's condition"
    read: "§18.1, table 1"
  - q: "Where did the guarantees a person once supplied go?"
    picture: "Shakey 1969, Atlas at the DRC 2015, ER-FLEX today; Open X-Embodiment episodes by robot"
    numbers: "27 robots, 2.42 million episodes (Open X-Embodiment sheet via MLSysIM)"
    example: "reflex halt to permission path; operator to intervention authority"
    read: "§18.1"
  - q: "Does a protective intervention mean the task failed?"
    picture: "vote card"
    numbers: "1.3 to 1 m/s, a 30 m leg 30 percent longer (derived)"
    example: "least-change speed correction completes the delivery"
    read: "§18.5"
  - q: "How does the method transfer to a machine the course never studied?"
    picture: "carton conveyor photo; packaging-cell schematic; four-law audit build"
    numbers: "three machine classes in one cell"
    example: "the packaging cell"
    read: "§18.2.1, §18.2.2"
  - q: "Can the carriage stop before the gate, and what speed can it keep?"
    picture: "cell_stop build; cell_ceilings bars; SICK deTec4 light curtain"
    numbers: "171 mm stop vs 60 mm; ceiling 0.55 m/s; 0.66, 0.47, 0.88 m/s variants; 10 ms curtain response (data sheet)"
    example: "Napkin Math 18.1"
    read: "§18.2.2"
  - q: "What does a safety restriction do to the learned proposer's evidence?"
    picture: "derate_gap (illustrative)"
    numbers: "evaluated at 1.50 m/s, admitted at 0.50 m/s"
    example: "vision proposer at the derated speed"
    read: "§18.2.2"
  - q: "When does the floor, not the brake, set the deceleration?"
    picture: "friction_knee; measured TRL friction bars"
    numbers: "knee mu 0.204; film 0.49 m/s^2; measured 0.85 dry, 0.01 oil with a smooth tire (TRL PPR073 table 5.1)"
    example: "Napkin Math 18.2"
    read: "§18.3"
  - q: "Why can no classifier find the film in time?"
    picture: "indist traces; overreserve bars"
    numbers: "931.2 ms stop vs 465.6 ms distance/speed; 605.3 mm over-reserve vs 100.8 ms spare"
    example: "definition 18.1"
    read: "§18.3.4"
  - q: "What can a design do when a state stays hidden?"
    picture: "responses build; latch force bars; gate latch photo"
    numbers: "67.4, 219.6, 74.9 N vs a 100 N declared floor"
    example: "torque pulse, proof test, conservative speed, series spring, restricted routes"
    read: "§18.3.4"
  - q: "How is an unobserved premise recorded and contained?"
    picture: "register table with photos"
    numbers: "1 m/s on floors inspected to mu 0.12; 2,995 zero-failure trials"
    example: "film, hidden walker, glass jar for mug"
    read: "§18.3.3"
  - q: "What does a shield add to a hazard-rate claim?"
    picture: "equation 2 anatomy; vote card; Waymo rate plot"
    numbers: "1.387e-9 per h vs 1e-9 target; 29,956 seeded trials; Waymo 0.67 vs 3.77 injury crashes per million miles over 271.3 M miles"
    example: "Napkin Math 18.3"
    read: "§18.3.2"
  - q: "Which experiment should the next effort fund?"
    picture: "four gap-class cards; restriction cost; six open problems with a Unitree G1 photo"
    numbers: "+30 percent leg time; 2,995 trials"
    example: "film = unmeasured observable; loaded timing = evaluation deficit; biped fallback = scope mismatch"
    read: "§18.4"
worked_examples:
  - name: "Napkin Math 18.1: the delay wall"
    steps: ["given 1.50 m/s, 60 mm stop line, 15 mm reserve, 15 m/s^2, 64 ms", "96 + 75 = 171 mm", "ceiling 1.51 - 0.96 = 0.55 m/s", "0.50 m/s: 40.3 mm, 19.7 mm spare", "delay chain sets the ceiling; checkpoint at 12 m/s^2 gives 0.52 m/s"]
  - name: "Napkin Math 18.2: the friction floor"
    steps: ["a = min(a_brake, mu g)", "knee mu 0.204", "film: 0.49 m/s^2", "969.0 mm becomes 2.13 m", "only a restriction or an interface measurement helps"]
  - name: "Napkin Math 18.3: the coverage bill"
    steps: ["216,000 proposal-hours, zero events", "bound 1.387e-5 per h", "residual 1.387e-9 per h, above 1e-9", "coverage needs 29,956 seeded trials; 124.8 days of log", "shield attenuates; it does not excuse measuring errors"]
active_learning:
  - {at_minute: 1, type: predict, prompt: "Stop length on the film", answer: "C, 2.13 m"}
  - {at_minute: 4, type: retrieval, prompt: "Four laws in order, one record each", answer: "irreversibility (limit), endogenous data (provenance), proposal is not permission (enforcement), permission must be earned (release manifest)"}
  - {at_minute: 15, type: concept_question, prompt: "Does an intervention mean the task failed?", answer: "False; leg 30 percent longer, three channels"}
  - {at_minute: 22, type: estimate, prompt: "Can the carriage stop before the gate?", answer: "No, 171 mm; ceiling 0.55 m/s"}
  - {at_minute: 31, type: estimate, prompt: "Brake qualified at 12 m/s^2", answer: "ceiling 0.52 m/s; 0.50 m/s fits, 42.4 of 45 mm"}
  - {at_minute: 41, type: concept_question, prompt: "Stop time or distance/speed?", answer: "distance/speed, 465.6 ms; time form over-reserves 605.3 mm"}
  - {at_minute: 48, type: diagnose, prompt: "Register entry for a worn latch", answer: "yield margin; guarded approach and spring; maintenance owner; proof-test interval"}
  - {at_minute: 53, type: concept_question, prompt: "Does a shield make proposer errors irrelevant?", answer: "No; residual 1.387e-9 above target"}
  - {at_minute: 66, type: retrieval, prompt: "Answer the course question in three sentences", answer: "names a premise the model cannot supply and what the machine supplies instead"}
segments:
  - {name: "One Argument", minutes: "8-18", aha: "The four laws are one argument; each part's records are what the next part reads."}
  - {name: "A New Machine", minutes: "18-34", aha: "The audit transfers as ordered questions and budgets; each answer constrains the next."}
  - {name: "Unobserved", minutes: "34-51", aha: "Where no sensor reports a premise, the machine gets a restriction, an owner, and a closure test."}
  - {name: "Next Capability", minutes: "51-63", aha: "The kind of evidence an open premise lacks selects the next experiment."}
  - {name: "Synthesis", minutes: "63-71.5", aha: "The aisle budget built across eight lectures is broken by one unmeasured premise."}
concept_trace:
  - {concept: "Four-law audit of a new machine", frame: "The audit asks one question per law, in order", shows: "audit_step1-4 build; applied on the packaging-cell frames that follow (estimate, ceilings, derate gap, verdict table)"}
  - {concept: "Residual-claims register", frame: "The register binds each open premise to four things", shows: "three-entry table built row by row with photos; practiced on 'What is the register entry for a worn latch?'"}
  - {concept: "Next capability by missing evidence", frame: "The kind of missing evidence selects the next experiment", shows: "four gap-class cards in two steps; priced on 'A 23 percent speed cut costs 30 percent more time per leg'"}
  - {concept: "Observational indistinguishability (secondary)", frame: "Identical sensor histories leave no classifier a signal", shows: "indist traces identical until the deadline, definition on slide"}
  - {concept: "Shield dilution (secondary)", frame: "A shield lowers a hazard rate only by its tested coverage", shows: "equation 2 anatomy built in three steps; worked on the coverage-bill vote"}
open_questions:
  - "When a model updates every week from fleet data, which register entries must reopen, and who decides?"
  - "Who should own a premise that lives in the building, not the robot?"
  - "When could a learned world model's rollouts count as release evidence?"
more_examples:
  - "TRL PPR073 (2006): locked-wheel friction on contaminated surfaces, table 5.1."
  - "SICK deTec4 Set 30/450 data sheet: 10 ms response, PL e, SIL 3."
  - "Waymo Safety Impact hub: rider-only injury crash rates against a human benchmark."
  - "Open X-Embodiment: 27 robots, 2.42 million episodes."
  - "Agility Robotics: 100,000 totes moved at a first customer site by late 2025 (chapter §18.4.2)."
