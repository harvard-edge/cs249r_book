notes_for_author:
  - "The chapter's camera stop and the certified light-curtain chain (22 ms, 0.88 m/s) are this deck's derived comparison; the drive's SS1 reaction time is left out and the note says so."
  - "The TRL measurements are on road vehicles and a smooth ASTM test tire; the deck uses them to show friction belongs to the surface pair, not to calibrate the book's illustrative 0.05."
  - "Kit requests: stopping-budget bar and record-chain figure (drawn locally here as budget_final and record_chain)."
