closing:
  return_to_hook: "AutoRT's filter passed 14 of 31 unsuitable tasks; the lease and its checks catch what physics can see, and the wrong-object premise goes to task evidence, people, and the safety case."
  read_and_practice: ["§10.1 to §10.10", "Checkpoints 10.1 and 10.2", "Napkin Math 10.1 to 10.3 by hand"]
  further_reading:
    - cite: "Ren et al., Robots That Ask for Help, CoRL 2023"
      url: "https://arxiv.org/abs/2307.01928"
      why: "Conformal sets turn ambiguity into a request for help."
    - cite: "Angelopoulos and Bates, Conformal Prediction: A Gentle Introduction, 2023"
      url: "https://arxiv.org/abs/2107.07511"
      why: "The coverage argument and its exchangeability premise."
    - cite: "Gray and Cheriton, Leases, SOSP 1989"
      url: "https://doi.org/10.1145/74850.74870"
      why: "Where the lease comes from."
    - cite: "Garrett et al., Integrated Task and Motion Planning, 2021"
      url: "https://doi.org/10.1146/annurev-control-091420-084139"
      why: "Where symbolic plans need geometric certificates."
    - cite: "Trautman and Krause, Unfreezing the Robot, IROS 2010"
      url: "https://doi.org/10.1109/IROS.2010.5654369"
      why: "Why growing forecasts block every path."
    - cite: "Ahn et al., AutoRT, 2024"
      url: "https://arxiv.org/abs/2401.12963"
      why: "The hook's measured filter and its human supervision."
  bridge: "Lecture 11, Trajectory Planning: the lease names a goal, never a path; how does a moving arm continue, join the motion under way, and keep a stop that runs without the proposer?"
