chapter: 10_intent
lecture: "10"
title: Grounded Intent
subtitle: "From a spoken request to an expiring, bounded target"
minutes: 75
notes_minutes: 71.0
core_minutes: 55.5
recall: "Lecture 9: the belief record (evidence epoch, initial error, growth law) and belief expiry; the mug record holds 12 mm / 200 mm/s = 60 ms."
target_ideas: 28
layer: brain
thread: "Third law, proposal is not permission (stated in Lecture 8). Record: the intent lease."
thesis: >-
  A learned target may be pursued only when it arrives bounded in space,
  effort, and time, through an intent lease that the permission side's clock
  can expire and that grants a goal, never a path.
hook:
  minutes: "0-5"
  setup: >-
    AutoRT (Ahn et al. 2024): foundation models proposed manipulation tasks
    for a fleet of mobile manipulators in office buildings, and a second
    language-model pass filtered them against a written robot constitution.
    Photo of the AutoRT robots from the paper.
  question_to_class: "Of 31 unsuitable proposed tasks, how many did the filter pass? A 0, B 3, C 14, D 31."
  payoff: >-
    C, 14 (recall 55 percent). Every miss was caught by human supervisors
    during teleoperated collection. The synthesis returns to the hook: the
    lecture's checks catch what physics can see (stale, unreachable, too
    forceful, ambiguous), and the wrong-object premise still needs task
    evidence and people.
  sources: ["chapter War Story 10.1", "Ahn et al., AutoRT, arXiv 2401.12963"]
driving_question: "Why is recognizing the right object insufficient to authorize a robot to reach for it?"
running_example: >-
  The warehouse mobile manipulator picks a red mug from a takeaway conveyor
  (15 mm grasp tolerance, 3 mm initial error, 0.20 m/s belt; 60 ms untracked
  and 219 ms tracked evidence; 336 ms intent inference at 2 Hz; 1 m/s TCP
  ceiling). Variants: a glass jar beside the mug and in place of it; the
  spring-latched cage door (15 N tripwire, 100 N limit); a coworker crossing
  the 1.30 m aisle. All running-machine values are illustrative (chapter
  labels) and print from MLSysIM.
segments:
  - name: Grounding
    minutes: "10-21"
    question: "What must a spoken request become before a machine can check it?"
    read: "§10.1, §10.2"
  - name: Refusal
    minutes: "21-34"
    question: "Which object, and how sure must the producer be?"
    read: "§10.3, §10.7, §10.9"
  - name: Expiry
    minutes: "34-48"
    question: "How hard may the arm press, and for how long is the target true?"
    read: "§10.4, §10.5"
  - name: Reach
    minutes: "48-58"
    question: "Can the arm get there before its evidence expires, and is the path clear?"
    read: "§10.6"
  - name: Lease
    minutes: "58-67"
    question: "Who ends the authority, and on whose clock?"
    read: "§10.8, §10.9"
concept_questions:
  - q: "What did a language-model safety filter catch in a real robot fleet?"
    picture: "AutoRT robots (paper figure); bars of proposed, acceptable, rejected, passed"
    numbers: "259 proposed, 228 acceptable; 31 unsuitable, 17 rejected, 14 passed; recall 55 percent (Ahn et al. 2024; chapter War Story 10.1)"
    example: "AutoRT"
    read: "§10.3.3"
  - q: "What does a request like 'pick the red mug' leave unspecified?"
    picture: "VoxPoser real-robot frames: spoken requests beside value maps and Franka arm frames (Huang et al. 2023)"
    numbers: "Seven values per intent inference (3D position, orientation, gripper) in 336 ms (chapter §10.1)"
    example: "VoxPoser tasks; the conveyor mug"
    read: "§10.1"
  - q: "What turns a label into a grounded affordance?"
    picture: "Mug with rim, wall, and handle sites; approach direction, aperture, wrench ceiling, evidence epoch (built in three steps)"
    numbers: "Handle: 3 mm initial error against 15 mm tolerance, valid 60 ms on the belt (Definition 10.1)"
    example: "The mug handle"
    read: "§10.1"
  - q: "Who sets the goal set: the proposer or the task?"
    picture: "Goal-set slice: 15 mm circle, offsets at 10 mm (0.67, inside) and 20 mm (1.33, outside)"
    numbers: "0.67 and 1.33 (derived, calcs.py)"
    example: "Widening the tolerance to admit an uncertain estimate corrupts the task"
    read: "§10.1, equation 1"
  - q: "What does a symbolic operator assert that it cannot check?"
    picture: "Shakey photo; operator pick(mug, handle, conveyor) mapped to motion predicates and the place each is checked (table 1)"
    numbers: "STRIPS 1971 for Shakey; five operator facts"
    example: "LLM+P writes PDDL; TAMP samplers certify facts"
    read: "§10.2"
  - q: "Does a learned grasp score measure success on this gripper?"
    picture: "OK-Robot pipeline (real figure) and its measured failure breakdown"
    numbers: "OK-Robot measured success in real homes and failure causes (Liu et al. 2024, see slide credit)"
    example: "OK-Robot on a Hello Robot Stretch"
    read: "§10.1, §10.3.2"
  - q: "When must the producer refuse, however confident the detector is?"
    picture: "Normalized scores against the 0.40 conformal threshold, two cases"
    numbers: "0.62 and 0.48 normalize to 0.56 and 0.44, set size 2; 0.10 normalizes to 0.14, set size 1; rank 181 of 200; entropy 0.685 of 0.693 nats (Sec. 10.3.1; derived)"
    example: "The jar beside the mug; KnowNo"
    read: "§10.3.1"
  - q: "Can a precise estimate still be the wrong object?"
    picture: "Ellipse 11.2 by 33.5 mm against the 15 mm square; chain confident wrong object, passes every check, crushes the jar"
    numbers: "95 percent semi-axes 11.2, 14.0, 33.5 mm (chi-square 7.815; derived)"
    example: "The distant view; the jar in place of the mug"
    read: "§10.3.3"
  - q: "Which grounding failures look identical on the wire?"
    picture: "Five failure modes against the check that can expose each (table 5)"
    numbers: "Every failure arrives as one seven-number pose"
    example: "Phantom, stale, ambiguous, misclassified, unreachable"
    read: "§10.7"
  - q: "What does the permission side check before it grants a goal?"
    picture: "AP and MCU with mailbox, permission path, lease timer (redrawn from figure 1), built in three steps; MCU board photo"
    numbers: "336 ms intent model; 1 kHz permission tick"
    example: "Four handoff invariants in cost order"
    read: "§10.3.1, §10.4"
  - q: "What does an effort ceiling buy at the latch?"
    picture: "Log bars: 15 N tripwire, 39 N at brake, 2,400 N for a 200 ms stall, 100 N limit"
    numbers: "Napkin Math 10.1 (derived in calcs.py)"
    example: "Spring-latched cage door"
    read: "§10.4"
  - q: "How long does the mug's evidence last, and can the model renew it?"
    picture: "Error against time and leases on one clock (figure 5 redrawn); published VLA inference rates against the horizons"
    numbers: "60 ms against 336 ms; renewal age 836 ms; ceiling 14.4 mm/s, 7.2 percent of belt speed; tracked 219 ms (Napkin Math 10.2)"
    example: "Conveyor pick; host stall 43 mm against 13 mm"
    read: "§10.5"
  - q: "Can the arm reach the handle before its evidence expires?"
    picture: "Transit bar 300 ms against the 219 ms window; two guarded segments"
    numbers: "300 ms floor, 219 mm reach, two captures (Definition 10.2; derived)"
    example: "Staged approach to the mug"
    read: "§10.6"
  - q: "Is the corridor clear of where a person could be?"
    picture: "Aisle top view with 96 mm and 351 mm discs; 3.2 m set spans the aisle"
    numbers: "1.6 m/s ISO 13855; 96, 351 mm, 3.2 m; 0.81 s crossover (Napkin Math 10.3)"
    example: "Coworker in the aisle; the freezing robot problem"
    read: "§10.6.1"
  - q: "When does the lease end, and who ends it?"
    picture: "Equation 9 term by term; three countdowns on the MCU clock; lifecycle state diagram"
    numbers: "Evidence term 60 or 219 ms; 22 ms stop onset (derived)"
    example: "A hung host; a stale renewal"
    read: "§10.8, §10.9"
concept_trace:
  - concept: Grounded affordance
    frame: "A grounded affordance carries five checkable quantities"
    shown_by: "mug_affordance build, three steps"
  - concept: Goal set is a specification
    frame: "The task profile sets the 15 mm goal set"
    shown_by: "goalset build: 0.67 inside, 1.33 outside"
  - concept: Operators discharged by motion predicates
    frame: "A symbolic operator asserts facts it cannot check"
    shown_by: "Shakey photo beside the operator-to-predicate table (build adds the predicate column)"
  - concept: Calibrated referent refusal
    frame: "Estimate: does the producer refuse the jar?"
    shown_by: "conformal build with the 0.40 threshold and set sizes 2 and 1"
  - concept: Admission checks physics not meaning
    frame: "A confident wrong object passes every physical check"
    shown_by: "imprecise ellipse against the square; wrong_object chain"
  - concept: Expiring intent lease
    frame: "The intent lease expires at the earliest of three deadlines (focus), then: Whichever margin runs out first ends the lease; Diagnose: why does the arm stop?"
    shown_by: "focus slide of equation 9, lease_terms build, lifecycle build"
  - concept: Dynamic reachability
    frame: "A handle 300 mm away needs 300 ms; its evidence lasts 219 ms"
    shown_by: "transit build with two guarded segments"
  - concept: Forward occupancy screening
    frame: "The corridor is screened against where a person could be"
    shown_by: "aisle build: 96 mm, 351 mm discs; 3.2 m wash"
worked_examples:
  - name: "Conformal refusal: the jar beside the mug (Sec. 10.3.1)"
    steps: ["given raw scores 0.62 and 0.48, 200 calibration scenes, alpha 0.10, assumed qhat 0.60", "normalize: 0.56 and 0.44", "rank 181 sets qhat; threshold 1 - 0.60 = 0.40", "both pass: set size 2, refuse with ERR_GROUNDING_AMBIGUITY", "jar at 0.10 normalizes to 0.14: singleton, proceed to metric checks"]
  - name: "Napkin Math 10.1: What the latch ceilings buy"
    steps: ["given 15 N tripwire, 0.03 m/s, 400 N/mm, 2 ms loop, 100 N limit", "force at brake 15 + 400 x 0.03 x 2 = 39 N", "counterfactual 200 ms stall: 6 mm, 2,400 N", "the local loop, not the lease, arrests contact; the lease sets the ceilings"]
  - name: "Napkin Math 10.2: The cadence gap"
    steps: ["given 15 mm, 3 mm, 200 mm/s, 500 ms period, 336 ms inference", "horizon (15 - 3)/200 = 60 ms", "renewal age 500 + 336 = 836 ms", "ceiling 12/0.836 = 14.4 mm/s, 7.2 percent of belt speed", "only a tracker (219 ms) or a slower belt or a refusal works"]
  - name: "Dynamic reachability and the freezing radius (Sec. 10.6, Napkin Math 10.3)"
    steps: ["300 mm at 1 m/s takes 300 ms against 219 ms: refuse terminal, stage two captures", "1.6 m/s x 60 ms = 96 mm; x 219 ms = 351 mm; x 2 s = 3.2 m", "1.30 / 1.6 = 0.81 s: past it one person spans the aisle"]
active_learning:
  - at_minute: 1
    type: predict
    prompt: "Of 31 unsuitable AutoRT tasks, how many did the filter pass? A 0, B 3, C 14, D 31"
    answer: "C, 14; recall 55 percent (17 of 31)."
  - at_minute: 5
    type: retrieval
    prompt: "From Lecture 9: what does a belief record carry, and when does it expire?"
    answer: "Evidence epoch, initial error, growth law; it expires when the error bound reaches the task tolerance (belief expiry)."
  - at_minute: 15
    type: concept_question
    prompt: "The handle estimate is 20 mm off and the model is very confident. Admit, widen the goal set, or refuse?"
    answer: "Refuse: normalized distance 1.33 > 1; the goal set comes from the task profile, never from the estimate."
  - at_minute: 25
    type: estimate
    prompt: "Raw scores 0.62 and 0.48, threshold 0.40 on normalized scores. Set size? Then the jar at 0.10?"
    answer: "0.56 and 0.44: size 2, refuse. 0.86 and 0.14: size 1, proceed."
  - at_minute: 31
    type: concept_question
    prompt: "True or false: a confident singleton set proves the robot has the right object."
    answer: "False: the jar in place of the mug normalizes to 1.00 and passes every physical check."
  - at_minute: 39
    type: predict
    prompt: "Tripwire 15 N, 0.03 m/s into a 400 N/mm plate, 2 ms loop. Force when the brake command issues?"
    answer: "39 N (15 + 24); without a local trip a 200 ms stall reaches 2,400 N."
  - at_minute: 44
    type: estimate
    prompt: "How slow must the belt run for 2 Hz renewals alone to hold the mug? Then: a 50 mm/s drift?"
    answer: "14.4 mm/s, 7.2 percent of 200 mm/s; at 50 mm/s the horizon is 240 ms, still under the 836 ms renewal age."
  - at_minute: 55
    type: estimate
    prompt: "At 1.6 m/s, beyond what screening horizon does one person's set span the 1.30 m aisle?"
    answer: "0.81 s; at 2 s the set is 3.2 m."
  - at_minute: 62
    type: diagnose
    prompt: "Renewals arrive every 50 ms with new sequence numbers and the same pose. The mug moves at 0.20 m/s. What happens?"
    answer: "The capture epoch never advances, so the MCU expires the lease 60 ms after the original capture; a keepalive is not evidence."
  - at_minute: 67
    type: retrieval
    prompt: "Return to AutoRT: which of its 14 misses could the lease and its checks catch, and which could they not?"
    answer: "Physics: stale, unreachable, too forceful, ambiguous, blocked corridor. Not: a well-formed task with the wrong meaning or object."
open_questions:
  - "Which premise should a robot ask a person about, and which should it check itself with a second sensor?"
  - "Should the coverage rate of a referent set be the same for a mug and for a knife?"
  - "When people in a shared aisle could make room, how much of the yielding should the robot assume?"
more_examples:
  - "OK-Robot (Liu et al. 2024): OWL-ViT plus SAM plus AnyGrasp on a Hello Robot Stretch in real homes"
  - "VoxPoser (Huang et al. 2023): language-composed value maps on a Franka arm"
  - "KnowNo (Ren et al. 2023): conformal sets over LLM options decide when to ask for help"
  - "RT-1, RT-2, OpenVLA, pi0: published inference rates of action models"
  - "Boston Dynamics Spot SDK: commands carry an end time and control requires a lease"
  - "Shakey and STRIPS (Fikes and Nilsson 1971)"
  - "Trautman and Krause 2010, the freezing robot problem"
