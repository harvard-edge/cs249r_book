    why: "Secondary; stated in one line on the affordance slide's note; grasp mechanics derivation is in the appendix"
  - concept: Task and motion planning in depth
    why: "Secondary; one slide shows operator facts discharged by predicates; PDDLStream mechanics are reading"
  - concept: "Wire format field by field (tables 2 and 6)"
