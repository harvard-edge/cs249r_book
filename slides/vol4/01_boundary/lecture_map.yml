chapter: 01_boundary
lecture: "1"
title: "The Causal Boundary"
subtitle: "Where a learned output becomes physical work"
layer: boundary
minutes: 75
notes_minutes: 71
core_minutes: 59.5
target_ideas: 30
thesis: "A learned output becomes physical work at the causal boundary, and because that work cannot be recalled, the time to refuse a command is paid in clearance."

hook:
  minutes: "0-4"
  setup: "Tempe, 18 March 2018: a photo of an Uber ATG Volvo XC90 test vehicle (the model, not the crash vehicle) beside the NTSB's aerial figure of the crash site with the pedestrian's positions at 5.6, 4.2, 2.6, and 1.2 s before impact and the SUV's speeds."
  question_to_class: "When could software still have changed the outcome? A at first detection (5.6 s, about 107 m); B at emergency recognition (1.2 s); C when suppression ended (0.2 s); D only the safety operator could have."
  payoff: "Synthesis: detection left room for about five full stops (21.4 m each, derived); 4.4 s of relabeling never placed her in the lane (Brain); the 1 s suppression spent 18.7 m with the brake withheld (Nervous System); the independent Volvo emergency braking was off and nothing monitored the operator (governance). The report does not establish the last moment a different design would have stopped, so the answer names where the margin went, level by level."
  sources: ["NTSB HAR-19/03, Figure 1, table on pp. 15-16, Sec. 2.1.2, footnotes 33 and 91", "chapter Sec. 1.8 and War Story 1.1", "photo: foam from Elgaland Vargaland, CC BY-SA 2.0, Wikimedia Commons"]

driving_question: "Why can a better prediction still produce a worse physical action?"

recall: "Lecture 0 worked the stopping budget as an example: d_stop = v tau_delay + v^2/(2 a_brake) <= D_clear, 762.9 mm of 1,100 mm at 1.5 m/s. Close your notes, write it, and say which term grows faster with speed (braking, with v^2)."

running_example: "Two cases. The Tempe collision (NTSB HAR-19/03), the real system: hook, the budget applied to it (18.7 m suppression against a 20.7 m full stop at 0.92 g from 43.2 mph), the classification record, the level-by-level diagnosis, and the synthesis. The running machine's aisle run for the arithmetic: 1.5 m/s, 2 m/s^2, 1.10 m (illustrative), pre-brake delay 51.6 + 60 + 1 + 1 + 20 = 133.6 ms (derived), 200.4 + 562.5 = 762.9 mm, crossover 0.53 m/s (Napkin Math 1.1)."

goals:
  - "Locate the causal boundary on the path from tensor to torque, and say why recovery is a new motion."
  - "Compute a stopping budget and its crossover speed, and read Tempe through it."
  - "Apply the scope test, and separate proposal from permission in the five-level machine."
  - "Diagnose Tempe level by level, and state the four laws that organize the course."

segments:
  - name: Boundary
    divider_question: "Where does a command become physical work?"
    read: "Sec. 1.1, 1.2, 1.4.1, 1.4.4"
    concept_questions: [1, 2, 3, 4, 5]
    minutes: 15
    land: "The causal boundary is where a command first drives current; upstream it can be discarded for free, downstream every correction costs time, clearance, and energy."
  - name: Budget
    divider_question: "How much clearance does delay spend?"
    read: "Sec. 1.4.2, 1.4.3 (Napkin Math 1.1)"
    concept_questions: [6, 7, 8, 9]
    minutes: 14
    land: "Delay is travel: 1.5 mm per millisecond at the drive limit, and each path that can trigger a stop owns its own delay."
  - name: Authority
    divider_question: "Which machines are physical AI, and who may command them?"
    read: "Sec. 1.5, 1.6, 1.7"
    concept_questions: [10, 11, 12, 13]
    minutes: 15
    land: "The scope test says which machines need this architecture; the proposal boundary says that inside them a learned model may only propose."
  - name: Tempe and the Laws
    divider_question: "Which responsibilities failed at Tempe, and what rules follow?"
    read: "Sec. 1.8 to 1.11; NTSB HAR-19/03"
    concept_questions: [14, 15, 16]
    minutes: 13.5
    land: "Tempe failed at several levels at once; the permission path is where safety, security, and accountability are discharged, and four laws, one physical, organize the course."

concept_questions:
  - id: 1
    q: "What privileges does software lose when its output moves mass?"
    picture: "Three-column table built column by column: advisory model, software agent, physical AI, against time, undo, and interface; photos of server racks and a warehouse drive unit"
    numbers: "An agent may take 200 ms or 30 s to plan while a sandbox waits (Sec. 1.1); a live loop runs a batch of one on a hard deadline"
    example: "A mislabeled warehouse photo discarded by a filter against a base already accelerating toward a rack"
    read: "Sec. 1.1, table 1"
  - id: 2
    q: "How did the learned output move from the periphery to the actuator?"
    picture: "Photo strip: Unimate, Shakey, Navlab (ALVINN), Stanley, a humanoid of the VLA era; a band beneath: nothing learned, learned perception, learned commands, pretrained proposers"
    numbers: "1961, 1966-72, 1989, 2005, 2023-25 (Sec. 1.2)"
    example: "Shakey's whisker reflex beneath its planner; ALVINN steering a van"
    read: "Sec. 1.2, figure 1"
  - id: 3
    q: "How large are physical AI's models against language models?"
    picture: "Epoch AI training-compute scatter, language models gray, robotics models green, OpenVLA and GR00T N1 labeled"
    numbers: "Largest language model of the year over the open robot policy: 345x in 2024 (Llama 3.1 405B over OpenVLA), 7,019x in 2025 (Grok 4 over GR00T N1), derived; the chapter rounds to about 350 and 7,000; 25 robotics models with a compute estimate (Epoch AI via mlsysim)"
    example: "OpenVLA, GR00T N1"
    read: "Sec. 1.2, figure 2"
  - id: 4
    q: "Where does a tensor become physical work?"
    picture: "Command-to-motion chain built in three steps: tensor, permission path, position and current loops, PWM register write, current in the winding, torque moves mass; the causal boundary drawn between the register write and the winding; Definition 1.2 card; photo of motor stator windings"
    numbers: "None"
    example: "action_chunk = policy(observation)"
    read: "Sec. 1.4.1, Definition 1.2"
  - id: 5
    q: "Why is recovery on a machine a new motion rather than a rollback?"
    picture: "Two rows: a database transaction S0, S1, abort, S0; a machine S0, torque, S1, brake, S2; photo of a gear with a broken tooth"
    numbers: "None"
    example: "A deformed fixture, an overheated winding"
    read: "Sec. 1.4.4"
  - id: 6
    q: "What sets a moving machine's stopping distance?"
    picture: "Equation anatomy with the two terms labeled, then the five-term pre-brake delay bar (backbone 22, rest of age 29.6, lease 60, tick and bus 2, brake onset 20); photo of a real mobile manipulator of the class"
    numbers: "133.6 ms; 200.4 + 562.5 = 762.9 mm of 1,100 mm; 1.5 mm per ms; backbone 33 mm, lease 90 mm (Napkin Math 1.1)"
    example: "The running machine at its 1.5 m/s drive limit"
    read: "Sec. 1.4.2, 1.4.3"
  - id: 7
    q: "When does delay matter more than braking?"
    picture: "Delay line and braking parabola against speed, crossing at the crossover speed; the sum against the clear distance"
    numbers: "v* = 2 a tau = 0.53 m/s; braking 2.8x the delay travel at 1.5 m/s; delay adds 35.6 percent to braking (Napkin Math 1.1)"
    example: "Half speed: 240.8 mm"
    read: "Sec. 1.4.3, figure 4"
  - id: 8
    q: "How much did Tempe's one-second suppression cost?"
    picture: "Three bars: 18.7 m traveled during suppression, 20.7 m full stop at the road's 0.92 g, 26.8 m at the ADS cap of 0.71 g"
    numbers: "43.2 and 40.5 mph at 1.2 and 0.2 s (NTSB table); 0.71 g and 0.92 g (NTSB footnote 33); crossover for a 1 s delay at 0.92 g 18.0 m/s against 19.3 m/s (derived)"
    example: "Tempe"
    read: "Sec. 1.8.2"
  - id: 9
    q: "Whose delay counts when an independent sensor can stop the machine?"
    picture: "Photo of driverless warehouse vehicles; the delay bar with the backbone and lease hatched out"
    numbers: "82 ms, 123 mm at 1.5 m/s leave the delay (derived); ISO 3691-4"
    example: "A certified safety scanner wired to the drives"
    read: "Sec. 1.4.3"
  - id: 10
    q: "What makes a system physical AI?"
    picture: "Scope-test Venn built in three steps: the three sets, the pairwise overlaps, physical AI at the center"
    numbers: "None"
    example: "Advisory systems, digital autonomy, classical control"
    read: "Sec. 1.6, figure 6"
  - id: 11
    q: "Which machines pass the scope test?"
    picture: "Four photos: CNC mill, flyball governor, da Vinci Xi, warehouse trucks, with the chapter's cases"
    numbers: "Human reaction 150 to 250 ms (Sec. 1.6)"
    example: "Learned haptic guidance; learned perception with a certified scanner veto"
    read: "Sec. 1.6, Checkpoint 1.1"
  - id: 12
    q: "Why do machines run out of different margins?"
    picture: "Three photos: drive unit (clearance), Atlas at the DARPA door task (force), humanoid (heat and supply)"
    numbers: "None"
    example: "The running machine in the aisle, at the latch, holding a load"
    read: "Sec. 1.5, figure 5"
  - id: 13
    q: "What is the machine made of, and who may command it?"
    picture: "Kit stack built one level per step from World up with the reference design's rates; then the proposal boundary and the governance envelope with Definition 1.3"
    numbers: "Intent 2 Hz, chunks 20 Hz, permission loop 1 kHz, current loop 10 to 25 kHz, 4.1 orders of magnitude (derived); published GR00T N1 10 Hz over 120 Hz, Helix 7-9 Hz over 200 Hz (The Cognitive Brain, table 2)"
    example: "Simplex runtime assurance"
    read: "Sec. 1.7, Definition 1.3"
  - id: 14
    q: "What did Tempe's system believe, second by second?"
    picture: "Classification and predicted-path rows from the NTSB table, with a red line at every class change and the 1 s suppression"
    numbers: "Classes from 5.6 s to impact; first in-lane prediction at 1.2 s (NTSB pp. 15-16)"
    example: "Tracking history dropped at each relabeling"
    read: "Sec. 1.8.1"
  - id: 15
    q: "What do safety, security, and accountability demand of the permission path?"
    picture: "Three threats (slick floor, spoofed packet, hallucinated path) into the permission path, out to three demands; photo of a Cruise robotaxi"
    numbers: "Friction 0.8 to 0.2 quadruples braking (illustrative); card premise mu >= 0.204; Cruise moved 6.1 m at up to 7.7 mph (Sec. 1.8, 1.9)"
    example: "Cruise 2023"
    read: "Sec. 1.9"
  - id: 16
    q: "Which four laws organize the course, and which records follow?"
    picture: "Four-row table: law, established name, documented failure; then the record chain redrawn at slide size"
    numbers: "Sixteen records, one per later lecture (Sec. 1.11)"
    example: "Therac-25; ALVINN; Tempe; Cruise"
    read: "Sec. 1.10, 1.11, table 3, figure 9"

concept_trace:
  - concept: Causal boundary
    frame: "Where does a tensor become physical work?"
    shows: "Chain build with the boundary drawn between the register write and the winding current, and the Definition 1.2 card"
  - concept: Irreversibility and recovery
    frame: "Recovery on a machine is a new motion under its limits"
    shows: "Database rollback row against the machine row ending in a new state S2; broken-gear photo; the check-before-admission line"
  - concept: Elementary stopping budget
    frame: "Stopping takes travel during the delay plus braking"
    shows: "Equation anatomy, the five-term delay bar, 762.9 mm of 1,100 mm"
  - concept: Physical AI scope test
    frame: "Physical AI needs a learned model, feedback, and authority"
    shows: "Three-step Venn and the three criteria; applied in 'Which of these four is physical AI?'"
  - concept: Digital privileges lost to embodiment
    frame: "Embodiment takes away three digital privileges"
    shows: "Column-by-column table of time, undo, and interface; the batch-of-one line"
  - concept: Five-level machine
    frame: "The machine in five levels, from learning down to physics"
    shows: "Kit stack built level by level with each level's contents and rates"
