    frame: "Safety, security, and accountability meet at one path"
    shows: "Three threats into the permission path and the three demands out of it"

worked_examples:
  - name: "Napkin Math 1.1: does the base stop inside its clearance?"
    steps: ["given: 1.5 m/s, 2 m/s^2, 1.10 m, 133.6 ms = 51.6 + 60 + 1 + 1 + 20", "delay travel 1.5 x 0.1336 = 200.4 mm", "braking 1.5^2 / 4 = 562.5 mm", "762.9 mm, 337.1 mm spare; crossover 0.53 m/s", "meaning: each millisecond costs 1.5 mm; the spare is not yet a safety margin"]
  - name: "Half speed and a doubled lease (Napkin Math 1.1, Checkpoint 1.1)"
    steps: ["given: the card", "0.75 m/s: 100.2 + 140.6 = 240.8 mm", "120 ms lease: tau 193.6 ms, 290.4 + 562.5 = 852.9 mm, 247.1 mm spare", "meaning: slowing down shrinks both terms; a shorter delay shrinks one"]
  - name: "Tempe through the budget (NTSB inputs, derived)"
    steps: ["given: 43.2 mph at 1.2 s, 40.5 mph at 0.2 s, 0.92 g road, 0.71 g cap", "suppression travel: mean speed x 1 s = 18.7 m", "full stop at 0.92 g: 20.7 m; at 0.71 g: 26.8 m", "crossover for 1 s at 0.92 g: 18.0 m/s against 19.3 m/s", "meaning: the pause cost about a full stop; not a counterfactual"]
  - name: "Tempe forensics by level (Sec. 1.8, War Story 1.1)"
    steps: ["relabeling dropped the track: Brain", "1 s suppression withheld braking: Nervous System", "Volvo AEB disabled: the independent protective path removed", "operator unmonitored: governance", "meaning: the design made one unmonitored person the last countermeasure"]

active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "When could software still have changed Tempe? A 5.6 s, B 1.2 s, C 0.2 s, D only the operator"
    answer: "No single letter; held to the synthesis. Detection left room for about five 21.4 m stops; churn spent 4.4 s; suppression spent 18.7 m; D names the design's reliance on an unmonitored person."
  - at_minute: 4
    type: retrieval
    prompt: "Write the stopping budget; which term grows faster with speed?"
    answer: "d_stop = v tau + v^2/(2 a) <= D_clear; the braking term, with v^2."
  - at_minute: 14
    type: predict
    prompt: "Which link in the chain from tensor to torque can no longer be changed for free?"
    answer: "The step from the register write to current in the winding: the causal boundary."
  - at_minute: 20
    type: concept_question
    prompt: "True or false: canceling the task stops its motion; a reverse command undoes an over-torque; rewriting a setpoint before the next cycle costs no work"
    answer: "False, false, true (Definition 1.2; Sec. 1.12)."
  - at_minute: 28.5
    type: estimate
    prompt: "The stop at 0.75 m/s; the stop at 1.5 m/s with a 120 ms lease"
    answer: "240.8 mm; 852.9 mm, 247.1 mm spare."
  - at_minute: 39
    type: concept_question
    prompt: "Which of four is physical AI: inspected learned toolpaths, a governor, learned haptic guidance, learned perception with a scanner veto?"
    answer: "The last two; the first lacks delegated authority, the second a learned model."
  - at_minute: 49.5
    type: concept_question
    prompt: "True or false: a training penalty guarantees safe actions; slow inference only degrades performance"
    answer: "False, false: a loss bounds expectation, not every cycle; a 100 ms stall at 1.5 m/s is 150 mm unchecked (derived)."
  - at_minute: 54
    type: diagnose
    prompt: "Assign each NTSB finding to a level"
    answer: "Relabeling: Brain; suppression: Nervous System; disabled AEB: the independent path; unmonitored operator: governance."
  - at_minute: 63.5
    type: retrieval
    prompt: "For each Tempe interval, name what was spent and which level spent it"
    answer: "As the synthesis table: 107 m at detection, 4.4 s of churn (Brain), 18.7 m of suppression (Nervous System), gradual slowdown with AEB off."

open_questions:
  - "Tempe's pause existed to avoid braking for false alarms. How long may a machine wait to confirm a hazard, and who should set that number?"
  - "A certified scanner can stop a base with no learned perception. What does the learned path buy, and what does it cost in clearance?"
  - "If a model's measured accuracy exceeds its monitor's, should the model ever hold authority over an actuator?"

more_examples:
  - "Cruise, October 2023: a post-collision pullover moved about 6.1 m at up to 7.7 mph with a person beneath the vehicle (Quinn Emanuel 2024; chapter Sec. 1.8)"
  - "Therac-25 (Leveson and Turner 1993); Mars Pathfinder priority inversion (Reeves 1997)"
  - "ISO 3691-4 driverless industrial trucks with certified safety scanners"
  - "Euro NCAP: a 2017 Volvo S90 pedestrian AEB avoided a crossing adult up to 37 mph (NTSB footnote 89)"

