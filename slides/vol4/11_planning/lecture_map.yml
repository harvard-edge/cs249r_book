closing:
  return_to_hook: "Why can a late plan leave clearance intact? The tail sets availability; the latched stop sets clearance (219.5 of 300 mm)."
  read_and_practice: ["§11.1 to §11.10", "Checkpoints 11.1 to 11.3", "Napkin Math 11.2 and 11.4 by hand", "ruckig_run.py"]
  bridge: "Lecture 12: an admitted plan still needs permission on every control tick. Why?"

notes_for_author:
  - "Ruckig 0.19.4 reproduces the chapter's two stops exactly (275.00 ms and 137.50 mm; 1,031.25 ms and 773.44 mm); ruckig_run.py needs pip install ruckig, which the MLSysBook venv lacks."
  - "MoveIt's Panda config sets panda_joint2 acceleration at 1.875 rad/s^2, a quarter of the 7.5 rad/s^2 datasheet value the chapter uses; the deck shows both files as two real limit sets for one arm."
  - "deckcheck cannot see 'C$^2$ seam' as the concept 'C2 seam'; the seam frame names it."
