chapter: 15_verification
lecture: "15"
title: "Adversarial Verification"
layer: governance
minutes: 75
notes_minutes: 70.5
core_minutes: 56.5
target_ideas: 30
thesis: "The claims that matter describe behavior after a fault, so they are tested by injecting the fault on purpose, witnessing the response independently, and scoring it against an oracle fixed before the run."

hook:
  minutes: "0-3"
  setup: "Bookout v. Toyota, 2013 (War Story 15.1). Photo of a 2005 Camry; built in three steps: the watchdog was fed by a timer interrupt, not by the throttle task; a dead throttle task could freeze its last command while the watchdog stayed satisfied; NASA's review found no electronic cause but documented a 248 ohm tin-whisker short in a pedal sensor (photo of a tin whisker, ESA, labeled as a generic whisker)."
  question_to_class: "Would clean driving tests reveal this? A) yes, given enough miles B) only a test that kills the task on purpose"
  payoff: "B. The Oracle segment runs the injection in miniature (our watchdog run), and the synthesis writes the five-element chain that would settle the hypothesis."
  sources:
    - "Adversarial Verification, War Story 15.1 (Barr 2013; Dunn 2013; NASA NESC 2011; Leidecker et al. 2011; Safety Research & Strategies 2013)."

recall: "Lecture 14, close your notes: the budget uses 969.0 of 1,100 mm at 1.3 m/s; the spare buys 100.8 ms, 37.5 ms after Lecture 13's 63.3 ms allocation; a 605 ms takeover overruns by 655.5 mm (all recomputed in images/calcs.py)."

driving_question: "Why can a machine pass its normal operating tests and still fail when its protective response is needed?"

goals:
  - "Declare the operating envelope, including the machine's own load and supply, and find its coupled corners."
  - "Fix an oracle before the run, from the event the fault disrupts, with independent witnesses and four verdicts."
  - "Derive faults by inverting design claims, working forward from physics, and attacking the proposer's inputs."
  - "Choose the rung that contains each mechanism, search for small margins, and size a campaign by its statistics."

law_and_record: "Part IV law: the fourth law, permission must be earned (goals slide). Record added: the fault-record set."

running_example: "Fault F1 on the running machine (warehouse mobile manipulator): the chunk policy stalls one tick after a lease renewal while the base drives at 1.3 m/s toward the rack end (clear distance 1.10 m, illustrative). Oracle: onset within 82 ms and travel within 751.9 mm of the last valid renewal (629.6 mm at the 1 m/s restricted point on a 0.12 floor). Shown as a real machine of its class (ER-FLEX photo). Carried through every segment: envelope corner, oracle and witnesses, five-element chain, rung choice, statistics, and the signed planned record."

segments:
  - name: Envelope
    divider_question: "Under which conditions must a protective claim hold?"
    read: "§15.1, §15.2, §15.5"
    concept_questions: [1, 2, 3]
    land: "A claim holds over a declared envelope, and the danger lives at coupled corners."
    real_things: ["ER-FLEX photo", "DriveFI published injection data (plot)"]
    minutes: 10
  - name: Oracle
    divider_question: "When does a stopping trial pass?"
    read: "§15.2 to §15.4"
    concept_questions: [4, 5, 6, 7]
    land: "An oracle fixed in advance, scored from the event the fault disrupts, on witnesses the fault cannot reach."
    real_things: ["our watchdog run (log)", "logic analyzer photo", "NIST test bays photo"]
    minutes: 15
  - name: Fault List
    divider_question: "Which faults should the campaign inject?"
    read: "§15.6"
    concept_questions: [8, 9]
    land: "Faults come from inverting records, from physics, from shared resources, and from attacks on the proposer's inputs."
    real_things: ["Brown et al. 2017 Figure 1", "Wang et al. 2025 Table 1(a) plot", "Robey et al. 2025 Tables 2-3 with Unitree Go2 photo"]
    minutes: 11.5
  - name: Ladder
    divider_question: "Which test bench can show which failure?"
    read: "§15.7 to §15.9"
    concept_questions: [10, 11, 12, 13]
    land: "Choose the rung that contains the mechanism, search for small margins, and discount simulated ones."
    real_things: ["NASA SAIL photo", "chassis dynamometer photo", "VNN-COMP 2025 Table 3 plot", "IIHS crash test photo"]
    minutes: 12
  - name: Evidence
    divider_question: "How much evidence does a rate claim need?"
    read: "§15.10, §15.11"
    concept_questions: [14, 15]
    land: "Rates need targets, sampling in proportion, and weights; the record keeps every verdict and every gap."
    real_things: ["O'Kelly et al. 2018 Table 1 plot", "our signed F1 record header"]
    minutes: 14.5

concept_questions:
  - q: "Which faults does the architecture claim to contain, and why do clean runs never test them?"
    picture: "ER-FLEX photo beside an F1 to F4 table"
    numbers: "47.7 V drive bus, 33 V lockout, 50 ms renewal (§15.1)"
    example: "F1 proposer stall"
    read: "§15.1"
  - q: "What makes a trial count as evidence?"
    picture: "five-part contract boxes"
    numbers: "1.10 m bounded claim (§15.1)"
    example: "the rack-end stop"
    read: "§15.1"
  - q: "Where does a protective claim fail when each variable is inside its range?"
    picture: "speed ceiling against floor friction (computed), DriveFI hazard data"
    numbers: "1.44 m/s dry, 1.23 m/s at 0.12, 1.19 m stop at 1.3 m/s (derived); 68 of 7,200 hazardous scenes, 561 faults in under 4 h (Jha et al. 2019)"
    example: "aisle speed on the inspected floor"
    read: "§15.2, §15.5.1"
  - q: "From which event is F1 scored?"
    picture: "three reference-event bars"
    numbers: "969.0 mm capture, 751.9 mm renewal, appearance no value (NM 15.1)"
    example: "F1 at 1.3 m/s"
    read: "§15.2"
  - q: "Which watchdog sees a frozen task?"
    picture: "real log of our watchdog run"
    numbers: "B bites 61 ms after its last feed; A stays ok as the command ages to 316 ms (our run)"
    example: "the Toyota task-blind hypothesis"
    read: "§15.3, Systems Perspective 15.1"
  - q: "Who may witness a trial?"
    picture: "machine against independent witnesses (simplified figure 3) and a logic analyzer photo"
    numbers: "none"
    example: "a thermal-breaker false pass; the probe effect (Gait 1986)"
    read: "§15.3"
  - q: "What verdicts can a trial return?"
    picture: "four trials scored, NIST bays photo"
    numbers: "90 ms onset: -8 ms margin, 10.4 mm extra travel (derived)"
    example: "Checkpoint 15.1"
    read: "§15.4"
  - q: "Where does a fault list come from?"
    picture: "five-element chain for F1 and a forward-analysis row"
    numbers: "82 ms, 751.9 mm; F4a 37.8 V, 4.8 V headroom, 150 A (NM 15.2)"
    example: "F1; a shared supply chip resetting both processors"
    read: "§15.6.1, §15.6.2, §15.6.5"
  - q: "How do attacks reach a learned proposer, and how are they scored?"
    picture: "Brown patch figure; Wang success bars; RoboPAIR table"
    numbers: "banana 97 percent to toaster 99 percent; success 54-88 percent to 0; 3/35 and 1/35 to 35/35"
    example: "wrong-bin pick inside every limit"
    read: "§15.6.3"
  - q: "Which rung can show which failure?"
    picture: "qualification-ladder matrix in 4 steps; SAIL and dynamometer photos"
    numbers: "none (structure)"
    example: "F2, F3, jam"
    read: "§15.7"
  - q: "What can a proof reach?"
    picture: "VNN-COMP 2025 benchmark sizes against 80M and 7B"
    numbers: "largest 138M; 7B is 50.7 times larger (derived)"
    example: "permission path versus proposer"
    read: "§15.7.3"
  - q: "How does a search find the smallest margin?"
    picture: "two clearance traces with signed robustness"
    numbers: "+0.15 m and -0.04 m (illustrative)"
    example: "falsification of the rack-end claim"
    read: "§15.9.1, §15.9.2"
  - q: "When does a simulated margin count?"
    picture: "transfer inequality and an IIHS crash test photo"
    numbers: "131.0 mm reserve, Delta below 0.131 (derived)"
    example: "simulated rack-end stop"
    read: "§15.9.4"
  - q: "How many injections demonstrate a coverage target?"
    picture: "worked example card"
    numbers: "9,800 FIT, 98.98 percent, 293; 10 FIT: 99.90 percent, 2,935 (NM 15.3)"
    example: "four component strata"
    read: "§15.10"
  - q: "How are rare rates and tails estimated, and what does the record keep?"
    picture: "runs ladder, O'Kelly data, GPD tails, signed F1 header"
    numbers: "5.7e10, 1.7e9, 2,709 runs; ESS about 250 (§15.10.2); relative error 70 to 45 percent at the rarest threshold (O'Kelly 2018 Table 1, derived)"
    example: "queue delay past the 100.8 ms spare"
    read: "§15.10.2, §15.10.3, §15.11"

concept_trace:
  - concept: Operating envelope and coupled corners
    frame: "Do speed and floor still pass together?"
    shows: "Speed-ceiling-against-friction plot built in 2 steps; the corner at 0.12 shaded red with the 1.19 m stop on the slide; DriveFI frame follows as data."
  - concept: Precommitted oracle
    frame: "F1 is scored from the last valid renewal instead of capture"
    shows: "Three reference-event bars in 3 steps (969.0, 751.9, no value); the contract frame names the precommitted oracle; NM 15.1 frame computes it."
  - concept: Fault-list derivation
    frame: "Deriving a fault list builds a five-element chain per fault"
    shows: "Five-element chain for F1, then a forward-from-physics row in step 2."
  - concept: Transduction and proposer attacks
    frame: "A printed patch turned a banana into a toaster at 99 percent"
    shows: "Brown et al. Figure 1 with the checksum-valid point; the concept question frame scores the wrong-bin pick as a coverage deficit."
  - concept: Qualification ladder
    frame: "Each qualification rung makes another part of the loop real"
    shows: "Four-rung by six-mechanism matrix revealed one rung per step; the predict frame applies it with real HIL and rig photos."
  - concept: Falsification by signed robustness
    frame: "Signed robustness turns testing into a search for the worst case"
    shows: "Two clearance traces with rho +0.15 and -0.04 m, the min formula, and the falsification objective; the transfer discount frame follows (both core)."
  - concept: Rare-event rates and tails
    frame: "Weighting runs near failure cuts the runs about 2 x 10^7 times"
    shows: "Runs ladder in 3 steps (5.7e10, 1.7e9, 2,709) with the weighting line; tails on the optional extreme-value frame."
  - concept: Fault-record set
    frame: "The fault-record set binds each trace to its claim and its gaps"
    shows: "Header, outcome, and set fields beside the real signed planned F1 header with unavailable outcome fields; record chain thumbnail with the set lit."

worked_examples:
  - name: "Napkin Math 15.1: the reference-event gap"
    steps: ["Given lease 60, tick 1, bus 1, drive 20 ms; 2 m/s2, 7.11 m/s3; 40 mm inset", "Onset 82 ms", "Stop 422.5 + 182.8 = 605.3 mm", "F1 travel 106.6 + 605.3 + 40 = 751.9 mm", "Gap 217.1 mm = 67.1 + 150; against 969.0 mm a brake 167 ms late would pass"]
  - name: "Napkin Math 15.3: the coverage count"
    steps: ["9,800 FIT raw", "98.98 percent coverage for 100 FIT", "ln 0.05 / ln 0.9898 = 292.1, so 293 (rule of three 294)", "Students: 10 FIT gives 99.90 percent and 2,935", "Sample in proportion: 144 of 293 to gate drivers"]
  - name: "Importance sampling the queue delay (§15.10.2)"
    steps: ["Exponential delay, mean 5 ms; threshold 100.8 ms; p = 1.8e-9", "Plain Monte Carlo 5.7e10 runs", "Zero-failure 1.7e9", "Cross-entropy levels 11.5, 38.0, 99.1, 100.8 ms; mean 105.8 ms; 38.6 percent of runs fail", "2,709 runs; ESS about 250"]
  - name: "Alternate, optional frame: Napkin Math 15.2, supply headroom"
    steps: ["42 - 70 x 0.060 = 37.8 V, 4.8 V above lockout", "150 A to reach lockout", "F4a must step the supply", "F4b 1,313.4 ms of the 2 s hold-up", "Headroom vanishes near 129 milliohms"]

active_learning:
  - {at_minute: 0.5, type: predict, prompt: "Would clean driving tests reveal the Toyota hypothesis?", answer: "No; only a test that kills the task on purpose."}
  - {at_minute: 3, type: retrieval, prompt: "What wait does the spare buy at 1.3 m/s?", answer: "100.8 ms, 37.5 ms after allocation; 605 ms takeover overruns by 655.5 mm."}
  - {at_minute: 13, type: predict, prompt: "Do speed and floor still pass together?", answer: "No: 1.19 m against 1.10 m; ceiling 1.23 m/s."}
  - {at_minute: 18, type: predict, prompt: "Which watchdog notices the frozen task?", answer: "Only B, 61 ms after its last feed; A stays ok."}
  - {at_minute: 26.5, type: diagnose, prompt: "Assign verdicts to four trials.", answer: "INVALID, UNOBSERVABLE, FAIL (-8 ms), PASS."}
  - {at_minute: 38, type: concept_question, prompt: "How does the trial record a wrong-bin pick?", answer: "C: physical predicates pass; the wrong action is a coverage deficit."}
  - {at_minute: 43.5, type: predict, prompt: "Which rung first contains F2, F3, and a jam?", answer: "HIL, HIL, physical rig."}
  - {at_minute: 53, type: estimate, prompt: "Zero-miss injections for 10 FIT?", answer: "99.90 percent coverage, 2,935 injections."}
  - {at_minute: 63.5, type: concept_question, prompt: "Are these two claims true or false?", answer: "Both false: an unmonitored queue spends the spare after 100.8 ms; an UNOBSERVABLE trial is not evidence."}
  - {at_minute: 65.5, type: retrieval, prompt: "Which test would settle the Toyota question?", answer: "The five-element chain: kill the task, keep the timer, progress-fed watchdog, external throttle witness, precommitted deadline; also fault the shared pedal converter."}

fallacies:
  - "Independent local watchdog timers guarantee end-to-end deadlines (§15.12): false; 100.8 ms is 75.4 percent of 133.6 ms."
  - "An unobservable outcome is evidence of safety (§15.12): false; survivorship bias."

open_questions:
  - "A proposer update changes behavior everywhere. Which fault records stay valid, and who decides?"
  - "A transduction attack and sun glare produce the same packet. One fault or two?"
  - "How small must a simulator's transfer gap be before a regulator accepts its sweeps?"

