second_lecture_split: "Split after the Fault List segment (end of §15.6), as the plan says. Part 1, one trial and its oracle: hook, Envelope, Oracle, Fault List (about 40 minutes here; expand with the clock-drift F2 detail, the A1-A4 authority faults, and compound faults). Part 2, scaling the evidence: Ladder, hardware injection (§15.8, which this deck covers only through the witnesses frame), search, statistics, and records, with the Toyota synthesis repeated as its retrieval opener."

