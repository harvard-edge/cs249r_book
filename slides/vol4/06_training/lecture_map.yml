second_lecture_split: "After 6.2: Part A, learning from demonstrations and logs (regimes, mode averaging, drift, chunking, decoders, offline RL, pretrained generalists, value functions); Part B, learning from interaction (physical RL cost, simulation throughput, contact exploit, reality gap, randomization, distillation, world models, fine-tuning and post-training regimes, manifest). In this deck the cut falls at the Interaction divider; Part A would expand the Demonstrations and Rewards segments, Part B the Interaction and Manifest segments plus 6.4.3 and 6.6.2."

