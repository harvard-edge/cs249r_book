  - "Rudin et al. 2022 capped hardware command speed at 0.6 m/s because the terrain map was imperfect (paper section 4.3)"
  - "pi*0.6 with RECAP more than doubled throughput on reported tasks (Physical Intelligence 2025), chapter 6.6.2"
  - "OpenVLA model card: out of scope for unseen embodiments (huggingface.co/openvla/openvla-7b)"
  - "OpenAI Rubik's cube with automatic domain randomization (OpenAI et al. 2019)"

