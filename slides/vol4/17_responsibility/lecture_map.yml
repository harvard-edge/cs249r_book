chapter: 17_responsibility
lecture: "17"
title: Responsible Physical AI
minutes: 75
notes_minutes: 71.0
core_minutes: 58.5
recall: "Lecture 16: the release manifest holds a verdict, the records it binds by digest, and the standing conditions that withdraw it, signed by one adjudicator."
target_ideas: 30
layer: governance
thread: "Fourth law, permission must be earned (stated in Lecture 14; this lecture closes Part IV). Record: the approval record."
thesis: "Authority is fit to grant only when each decision behind an action has an owner, each human role can be performed, and each exposed group is counted in meters and joules."
hook:
  minutes: "0-6"
  setup: "A Cruise robotaxi photo. On 2 October 2023 a driverless Cruise car ran over a pedestrian thrown into its path, then pulled over 6.1 m (20 ft) at up to 7.7 mph with her beneath it. The logs rebuilt the motion; the account to regulators left out the pullover for 15 days."
  question_to_class: "Who answered for the pullover? A the classifier engineers, B remote assistance, C the executives, D no one named for the whole."
  payoff: "D. Each party held one piece truthfully. The penalties that followed (CPUC $112,500, NHTSA $1.5 million, DOJ $500,000) were for the record. The synthesis asks which approval-record entries would have refused the configuration."
  sources: ["chapter §17.1, §17.4.2", "https://www.dmv.ca.gov/portal/news-and-media/dmv-statement-on-cruise-llc-suspension/"]
driving_question: "Who answers for a machine that moves on its own when its motion harms someone?"
running_example: "The warehouse mobile manipulator's admitted aisle command: 1.3 m/s toward a rack end, 1.10 m clear distance, 368 kg loaded, 2 m/s^2 credible deceleration, 60 Hz navigation camera (MLSysIM registry). It carries every segment: six decisions behind the command, the remote assistant at the rack end, the warehouse permission ladder, the kneeling worker two frames late, the black-box frames of coworkers, and the approval record for the open floor."
concept_questions:
  - q: "Who answered for the Cruise collision?"
    picture: "Cruise robotaxi photo; timeline of the motion and the record, then the 2024 penalties"
    numbers: "6.1 m pullover; 15 days without a full account; $112,500 + $1.5 million + $500,000 (ch §17.1, §17.4.2)"
    example: "Cruise, 2 October 2023"
    read: "§17.1"
  - q: "Which decisions stand behind one admitted command?"
    picture: "Decision chain: six decisions, their makers, and the record that holds each; two with no record"
    numbers: "six links; 1.3 m/s aisle speed (registry)"
    example: "The running machine's aisle command"
    read: "§17.2"
  - q: "How often can an investigator recover the whole chain?"
    picture: "p^6 against p"
    numbers: "0.94, 0.74, 0.53 at 0.99, 0.95, 0.90 per link (derived)"
    example: "Decisions held only in memory and email"
    read: "§17.2.1"
  - q: "When does a person in the loop add protection?"
    picture: "Uber test vehicle photo; time, information, authority"
    numbers: "Tempe backup operator pleaded guilty in 2023"
    example: "Moral crumple zone (Elish 2019)"
    read: "§17.3"
  - q: "Can a remote assistant stop the rack-end hazard?"
    picture: "Bars: 0.85 s window against 4.47 s takeover"
    numbers: "0.85 s; 4.47 s; 5.8 m travel; about 5x (derived)"
    example: "Out-of-loop takeover at 1.3 m/s"
    read: "§17.3.1"
  - q: "How busy is one assistant serving many machines?"
    picture: "M/M/1 mean wait against machines per assistant"
    numbers: "0.25/60 s, 0.50/180 s, 0.80/720 s; p99 at 20 machines 23.5 min (Napkin Math 17.1)"
    example: "Staffing ratio as a decision with an owner"
    read: "§17.3.2"
  - q: "What does authority over the motion require?"
    picture: "AGV stop button photo; roles table"
    numbers: "FEASIBLE / INFEASIBLE / UNKNOWN verdicts (Checkpoint 17.1)"
    example: "Same assistant, two duties"
    read: "§17.3.3"
  - q: "How is permission to operate granted?"
    picture: "Ladder: California roads and a warehouse; Waymo photo"
    numbers: "CPUC removed the time limit on driverless fared service on 10 August 2023"
    example: "Spotter, unattended zone, open floor"
    read: "§17.4"
  - q: "How long must a stage run before it may be left?"
    picture: "Cumulative fleet hours against days"
    numbers: "2,996 failure-free hours; 10 machines x 16 h; 19 days (derived)"
    example: "A new configuration starts its own count"
    read: "§17.4.1"
  - q: "How is permission withdrawn?"
    picture: "DMV statement excerpt; penalties chart"
    numbers: "Driverless permits suspended 24 October 2023; safety-driver permit kept; $2,112,500 total"
    example: "Incident disclosure duty"
    read: "§17.4.2"
  - q: "Do learned detectors see all people equally?"
    picture: "Dumbbells from Li et al. 2025 Table 7 and Wilson et al. 2019 Table 4"
    numbers: "children 43.89% vs adults 23.75% missed; AP75 55.9% vs 67.1%"
    example: "Eight published detectors each"
    read: "§17.5"
  - q: "What does a detection gap cost in meters and joules?"
    picture: "Miss-in-every-frame plot; speed-distance stop for three groups; table"
    numbers: "3 vs 5 frames; 43 mm, 0.42 m/s, 32 J; 0.60 group 108 mm, 0.66 m/s, 80 J (Napkin Math 17.2)"
    example: "Kneeling worker two frames late"
    read: "§17.5.1"
  - q: "How many people per group does an evaluation need?"
    picture: "Exact intervals for 9,800 and 200 people"
    numbers: "0.945-0.954 vs 0.910-0.976; 1,059 per group (derived); Wilson holdout 387 and 100"
    example: "A 2 percent group of a 10,000-person set"
    read: "§17.5.2"
  - q: "Who bears the risk, and did they choose it?"
    picture: "Starship robot on a crosswalk; exposure bars; Pitt News excerpt"
    numbers: "8x and 0.22x the site average (derived, illustrative shares)"
    example: "Crossing rule; Pittsburgh curb-cut complaint 2019"
    read: "§17.6"
  - q: "What may the machine keep about people, and for whom?"
    picture: "GDPR Art. 5(1) excerpt; retention strip; AI Act Annex III excerpt"
    numbers: "30 s per event, 20 events, 1 percent kept, 96x (derived)"
    example: "Takeover logs used to rank operators"
    read: "§17.7"
  - q: "What labor does the machine move, and what record collects every decision?"
    picture: "Stacked labor bar and drive-unit photo; approval-record blocks and gate"
    numbers: "8 + 8 + 1.3 = 17.3 person-hours, 2.2 shifts (Napkin Math 17.3)"
    example: "One assistant, 20 machines, four sweeps"
    read: "§17.8, §17.9"
concept_trace:
  - concept: Decisions behind an admitted action
    frame: "Six decisions by six parties stand behind that one command"
    shows: "decision_chain build: six decisions, makers, records; two with no record in red"
  - concept: Oversight a person can perform
    frame: "Oversight needs time, information, and authority; Can the assistant stop the rack-end hazard?; One assistant for twenty machines is busy half the time"
    shows: "the three conditions with the Tempe photo; time_test bars; queue curve build"
  - concept: Staged permission
    frame: "Permission to operate is granted one stage at a time"
    shows: "ladder build: California roads, then the warehouse ladder"
  - concept: Detection gaps become stopping gaps
    frame: "What reaches a kneeling worker two frames late?; One stop ends short of one group and strikes another; A 200-person group cannot tell 0.95 detection from 0.92"
    shows: "worked conversion on the slide; speed-distance build with Table 1; interval plot and per-group sample size"
  - concept: Recorded people
    frame: "Event-triggered retention keeps 1% of the footage"
    shows: "GDPR Art. 5(1) excerpt beside the retention strip"
  - concept: Worker burden
    frame: "Twenty machines create 17.3 person-hours of work a day"
    shows: "stacked labor bar (requests, watching, sweeps)"
  - concept: Approval record
    frame: "A decision with no owner refuses release"
    shows: "seven blocks and the four refusal findings"
worked_examples:
  - name: "Napkin Math 17.1: One assistant, twenty machines"
    steps: ["given: 0.5 requests per machine-hour, 180 s each", "utilization = rate x service = 0.50 at 20 machines", "mean wait = 0.50 x 180 / 0.50 = 180 s", "result: busy half the time; 99th-percentile wait 23.5 min", "meaning: the staffing ratio is a productivity budget, never a safety layer"]
  - name: "Napkin Math 17.2: Two frames late"
    steps: ["given: 0.95 and 0.75 per frame, 1e-3 allowed miss, 16.7 ms frames, 1.3 m/s, 2 m/s^2, 368 kg", "frames: 3 and 5", "shortfall: 1.3 x 33.3 ms = 43 mm", "impact: sqrt(2 x 2 x 0.043) = 0.42 m/s; energy 368 x 2 x 0.043 = 32 J", "meaning: fairness for a moving machine is measured in meters and joules"]
  - name: "Napkin Math 17.3: Where the labor went"
    steps: ["given: 20 machines, 16 h, utilization 0.5, four 20 min sweeps", "requests 8 h, watching 8 h", "sweeps 1.3 h", "result: 17.3 person-hours, 2.2 shifts", "meaning: automation moves labor; the deployment owns its conditions"]
  - name: "Stage exit (§17.4.1)"
    steps: ["given: 1 per 1,000 h at 95 percent, zero observed", "hours = ln(20) / 1e-3 = 2,996", "10 machines x 16 h = 160 h a day", "result: 19 days", "meaning: the hours belong to one configuration"]
active_learning:
  - at_minute: 1
    type: concept_question
    prompt: "Who answered for the Cruise pullover?"
    answer: "No one had been named for the whole; each party held one piece."
  - at_minute: 7
    type: retrieval
    prompt: "Name three things a signed release manifest holds."
    answer: "A verdict, the records bound by digest, the standing conditions that withdraw it."
  - at_minute: 15
    type: estimate
    prompt: "Six links each retrievable with p = 0.90: what share of incidents yields the whole chain?"
    answer: "0.90^6 = 0.53."
  - at_minute: 22
    type: diagnose
    prompt: "Can the remote assistant stop the rack-end hazard?"
    answer: "No: 4.47 s takeover against a 0.85 s window, 5.8 m of travel; INFEASIBLE as a countermeasure."
  - at_minute: 34
    type: concept_question
    prompt: "True or false: a policy update keeps the stage its predecessor earned."
    answer: "False: the 2,996 hours belong to the configuration that ran them."
  - at_minute: 44
    type: predict
    prompt: "What reaches a kneeling worker two frames late?"
    answer: "43 mm lost; 0.42 m/s and 32 J at contact."
  - at_minute: 58
    type: discuss
    prompt: "May a site rank operators by their takeovers?"
    answer: "No under the declarations: a record declared for incident reconstruction may not score workers; ranking also discourages takeovers. A worker-evaluation system needs its own declaration, legal classification, and owner (AI Act Annex III 4(b), Art. 26(7))."
  - at_minute: 66
    type: retrieval
    prompt: "Which approval-record entries would have refused the Cruise configuration?"
    answer: "Owner of the post-collision response rule; per-group detection entry for the domain; grantor and date of the stage; owner and deadline of the disclosure log."
open_questions:
  - "Who should grant the stages of a warehouse ladder when no public regulator does?"
  - "Should a site choose its operating speed for its least-detected group, or keep that group out?"
  - "When a machine's records could protect a worker in court and also score her, who decides which use wins?"
more_examples:
  - "Cruise, 2 October 2023: DMV suspension statement (dmv.ca.gov, 24 Oct. 2023)"
  - "Uber, Tempe 2018: backup operator pleaded guilty in 2023 (Maricopa County Attorney 2023)"
  - "Starship robots paused in Pittsburgh after a wheelchair user's report (The Pitt News, 21 Oct. 2019)"
  - "Li et al. 2025, Table 7: eight detectors miss children 20.14 points more often"
  - "Wilson et al. 2019, Table 4: AP75 67.1% lighter vs 55.9% darker skin"
  - "Burtch, Greenwood, Ravindran 2025 (as reported in ch §17.8): fewer severe, more non-severe warehouse injuries"
  - "EU AI Act Annex III 4(b) and Art. 26(7); GDPR Art. 5(1)"
segments:
  - name: Decisions
    minutes: "8-19"
    aha: "Six decisions by six parties stand behind one admitted command, and two of them sit in no record."
  - name: Oversight
    minutes: "19-32"
    aha: "A human role that lacks time, information, or authority adds blame and no protection."
  - name: Permission
    minutes: "32-44"
    aha: "Permission is a stage for one configuration, withdrawn for a withheld record as well as unsafe motion."
  - name: Detection
    minutes: "44-60"
    aha: "Two frames of late detection at 1.3 m/s become 43 mm, 0.42 m/s, and 32 J."
  - name: Records
    minutes: "60-71"
    aha: "Records about people and the labor moved carry their own premises; the approval record refuses release while any decision lacks an owner."
