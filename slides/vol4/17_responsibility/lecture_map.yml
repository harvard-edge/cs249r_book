notes_for_author:
  - "Burtch et al. 2025 (40 percent fewer severe and 77 percent more non-severe injuries) could not be read in full text; the deck cites it only in a note, as reported by the chapter."
  - "Li et al. Table 7 finds almost no skin-tone gap in miss rate, while Wilson et al. find an AP75 gap; the deck shows both and says why they differ."
  - "The Li-based meters-and-joules frame is derived (per-image miss rates treated as independent per-frame rates) and labeled so."
