further_reading:
  - cite: "Responsible Physical AI, §17.1 to §17.11, Checkpoints 17.1 to 17.3"
    why: "The chapter, with its napkin math to redo by hand."
  - cite: "Thompson, Moral Responsibility of Public Officials: The Problem of Many Hands, APSR, 1980"
    url: "https://doi.org/10.2307/1954312"
    why: "Why many contributors leave responsibility with no one."
  - cite: "Elish, Moral Crumple Zones, Engaging Science, Technology, and Society, 2019"
    url: "https://doi.org/10.17351/ests2019.260"
    why: "How blame settles on the person nearest the event."
  - cite: "Santoni de Sio and van den Hoven, Meaningful Human Control over Autonomous Systems, Frontiers in Robotics and AI, 2018"
    url: "https://doi.org/10.3389/frobt.2018.00015"
    why: "When human control is real."
  - cite: "Wilson, Hoffman, Morgenstern, Predictive Inequity in Object Detection, 2019"
    url: "https://arxiv.org/abs/1902.11097"
    why: "Per-group pedestrian detection measured."
  - cite: "Nissenbaum, Privacy in Context, 2009"
    why: "Privacy as appropriate information flow."
closing:
