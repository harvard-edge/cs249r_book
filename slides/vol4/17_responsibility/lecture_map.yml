  read_and_practice: ["§17.1 to §17.11", "Checkpoints 17.1 to 17.3", "Napkin Math 17.1 to 17.3"]
  record: "Approval record (record chain, after the release manifest of Lecture 16)"
  bridge: "Lecture 18, Engineering Physical AI: why does a better model not, by itself, make a better machine?"
