chapter: 12_enforcement
lecture: "12"
title: Safety Enforcement
subtitle: "Granting permission on every control tick"
layer: nervous
thread: "Third law, proposal is not permission (stated in Lecture 8). Record: the enforcement record."
minutes: 75
recall: "Lecture 11: the trajectory record carries timing, a C2 join, and a resident stop suffix; from 1.5 m/s at 2 m/s^2 the jerk-limited stop takes 1,031.25 ms against 750 ms at constant deceleration."
notes_minutes: 70.0
core_minutes: 60.5
target_ideas: 30
thesis: "An admitted plan earns authority one tick at a time, inside a stopping envelope, with minimal correction and a state-matched fallback held in reserve."
hook:
  minutes: "0-3"
  setup: "Therac-25, 1985 to 1987: the Therac-20's turntable microswitch interlock was removed and beam safety left to software; an operator edit raced the software and the 25 MeV beam fired without the target in place."
  question_to_class: "What stopped the beam when the software was wrong? (A second software check, the operator, or nothing.)"
  payoff: "Nothing: six patients overdosed, three died. The synthesis shows the running machine's two layers, the per-tick enforcer and a certified hardware floor beneath it."
  sources: ["Safety Enforcement, War Story 12.1", "Leveson and Turner, IEEE Computer 26(7), 1993"]
driving_question: "Why does an admitted plan still need permission on every control tick?"
running_example: "The warehouse mobile manipulator (the running machine): the aisle run toward a rack end 1.10 m ahead (stopping budget, 1.3 m/s aisle speed), the spring-latched cage door (contact force), and the mug handover to a coworker (hand force). Illustrative and derived values are labeled; each segment pairs them with a published datasheet or measurement."
concept_questions:
  - q: "What can change between admission and execution?"
    picture: "Gatekeeper diagram (proposer, enforcer on the MCU, drives; certified floor beneath) beside a photo of a real mobile manipulator (TIAGo++)"
    numbers: "1 ms tick; chunk renewal every 50 ms (Lecture 3)"
    example: "Simplex architecture (Seto et al. 1998)"
    read: "§12.1"
  - q: "How much clearance does a stop from the drive limit need once every term is priced?"
    picture: "Four-step stacked-bar build of table 1"
    numbers: "913 mm (rows 1-5), 1,124 mm (+ jerk ramps), 1,164 mm (+ 40 mm tracking inset) against 1,100 mm; 969 mm at 1.3 m/s (derived)"
    example: "Rack end, 1.5 m/s drive limit"
    read: "§12.1, §12.2.1"
  - q: "What speed does the finished budget allow?"
    picture: "Worked example revealed line by line"
    numbers: "Ceiling 1.44 m/s; spare 131.0 mm = 100.8 ms at 1.3 m/s; reserve 48.7 mm after 82.3 mm of dispatch travel (Napkin Math 12.1)"
    example: "Candidate aisle speed 1.3 m/s"
    read: "§12.2.1"
  - q: "What does a certified scanner path add, and what does it cost?"
    picture: "Photo of a driverless Jungheinrich ERC 213a with its front scanner; SICK nanoScan3 datasheet excerpt"
    numbers: "85 ms response, 3 m protective field, PL d, SIL 2 (datasheet 2024-12-17); 110.5 mm at 1.3 m/s (derived)"
    example: "Safety laser scanner under ISO 3691-4"
    read: "§12.2.1"
  - q: "What is the stopping envelope as a set, and in what order does the governor check it?"
    picture: "Phase portrait build: braking-only parabola, envelope, states inside and outside"
    numbers: "1.44 m/s at 1.10 m"
    example: "Per-tick speed governor: state first, then clamp"
    read: "§12.2.2"
  - q: "How does gravity change braking authority?"
    picture: "Tool stop distances: no bias, descending, ascending; Franka Research 3 datasheet excerpt"
    numbers: "19.86, 79.45, 11.35 mm; net 7.25 rad/s^2 against 29 (Napkin Math 12.2); 87 Nm peak axes 1-4 (datasheet)"
    example: "Loaded arm descending toward the packing station"
    read: "§12.3"
  - q: "Why does a barrier on distance alone fail, and what fixes it?"
    picture: "Relative-degree chain build; kinetic barrier h = theta - omega^2/(2 alpha_net)"
    numbers: "h = 0 at 79.45 mm and 1.2 rad/s"
    example: "Descending arm"
    read: "§12.4, §12.4.1"
  - q: "What torque does the barrier demand as clearance shrinks?"
    picture: "Braking torque against clearance, peak line at 87 N m"
    numbers: "80.1 N m at 110 mm; 87 at 79.45 mm; 89.1 at 70 mm (equation 6)"
    example: "Descending arm"
    read: "§12.4.1"
  - q: "How should a violating proposal be corrected?"
    picture: "Two-axis torque plane: proposal, per-axis clamp, projection (build)"
    numbers: "Proposal (3.5, 3) gives 10 against 5; clamp gives 7; projection (1.5, 2), lambda* = 1, change 2.236 N m"
    example: "Two-joint arm; latch speed projected from 0.10 to 0.03 m/s"
    read: "§12.5, §12.6, §12.6.1"
  - q: "When contact is the task, what is the margin?"
    picture: "Force against time at the latch (build: 0.03 then 0.10 m/s)"
    numbers: "12 N/ms; 39 N at brake onset; about 3 m/s^2 stop in about 10 ms; 0.10 m/s gives 95 N and needs 400 m/s^2"
    example: "Spring-latched cage door"
    read: "§12.6.2"
  - q: "How hard does a handover press a free or a clamped hand?"
    picture: "Bars: free 20.7 N, clamped 94.9 N, 50 N criterion; UR16e photo"
    numbers: "Reduced mass 0.571 kg; 207 and 949 N per m/s; ceilings 0.24 and 0.053 m/s (Napkin Math 12.3)"
    example: "Mug handover at 0.10 m/s"
    read: "§12.6.2"
  - q: "Do contact-force formulas match measurement?"
    picture: "Grouped bars of measured forces on four arms; KUKA LBR iiwa photo"
    numbers: "Speeds set for 280 N gave 228 to 427 N (Kirschner et al. 2022, Table II, hand, B1)"
    example: "UR10e, Franka, KUKA LBR iiwa 14, Techman TM5"
    read: "§12.6.2; outside source"
  - q: "Which premises must hold for a barrier guarantee, and what watches each?"
    picture: "Five premises with their detectors; cycle budget bar"
    numbers: "Declared WCET 250 us inside a 400 us deadline, QP 150 us; zero-order-hold drift 1.501 mm"
    example: "Disturbance observer, current shunts, watchdog, bus timestamps"
    read: "§12.6.3, §12.6.4"
  - q: "Which fallback runs when no correction exists?"
    picture: "Fallback ladder build (PROJECT, HOLD, STOP, INHIBIT); photos of an emergency stop button and a Pilz PNOZ s4 safety relay"
    numbers: "STOP from 1.3 m/s: 931.25 ms, 605.31 mm; heartbeat timeout 30 ms; spring brakes set 30 to 80 ms"
    example: "Host kernel panic at 1.3 m/s; Cruise 2023"
    read: "§12.7, §12.8"
  - q: "Which layer carries the certified claim, and what does the enforcement record bind?"
    picture: "Standards table with a photo of a Pilz safety controller; admitted-command fields"
    numbers: "PL d for scanner, braking, and Class II arm functions; arm 18 kg"
    example: "Rated lease and heartbeat watchdog; unrated admission checks"
    read: "§12.8.3, §12.10"
worked_examples:
  - name: "Napkin Math 12.1: the ceiling the budget sets"
    steps: ["given: 1,100 mm clear, 190 mm allowances, 2 m/s^2, J 7.11 m/s^3, 133.6 ms delay",
            "room to brake 910 mm; effective delay 274.2 ms",
            "ceiling -0.548 + 1.985 = 1.44 m/s",
            "at 1.3 m/s: spare 131.0 mm = 100.8 ms; dispatch 82.3 mm leaves 48.7 mm",
            "meaning: the budget sets the operating speed below the motor limit; every added millisecond costs 1.3 mm"]
  - name: "Napkin Math 12.2: the gravity braking tax"
    steps: ["given: 1.2 rad/s, 0.80 m lever, 3 kg m^2, 87 N m peak, 65.25 N m bias",
            "no bias 29 rad/s^2, 19.86 mm", "descending 7.25 rad/s^2, 79.45 mm", "ascending 11.35 mm",
            "meaning: braking authority is net of gravity and direction-dependent"]
  - name: "Two-axis projection against per-axis clamp (§12.6.1)"
    steps: ["given: proposal (3.5, 3), barrier 2 tau1 + tau2 <= 5", "clamp to (2, 3) gives 7, still outside",
            "lambda* = 5/5 = 1; projection (1.5, 2) on the line", "SciPy SLSQP confirms (1.5, 2) in 2 iterations",
            "meaning: least change satisfies the coupled constraint; per-axis clamps can break it"]
  - name: "Napkin Math 12.3: the clamped-hand penalty"
    steps: ["given: 12 kg arm side, 0.6 kg hand, 75 N/mm, 0.10 m/s, 50 N", "free: 0.571 kg, 207 N per m/s, 20.7 N",
            "clamped: 949 N per m/s, 94.9 N", "ceilings 0.24 and 0.053 m/s",
            "meaning: the handover ceiling holds only if the geometry excludes clamping; measured forces (Kirschner et al.) show the premise needs testing"]
active_learning:
  - at_minute: 0.5
    type: predict
    prompt: "Therac-25: what stopped the beam when software was wrong?"
    answer: "Nothing; the hardware interlock had been removed. Six patients overdosed (4,000 to 20,000 rads), three died."
  - at_minute: 3
    type: retrieval
    prompt: "What must a trajectory contain before admission? How long does the base take to stop from 1.5 m/s?"
    answer: "Timing, a C2 join, a resident stop; 750 ms at constant deceleration, 1,031.25 ms as an S-curve (Lecture 11)."
  - at_minute: 9
    type: predict
    prompt: "Does a stop from the 1.5 m/s drive limit fit the 1.10 m clear distance?"
    answer: "No: 1,164 mm with jerk ramps and the tracking inset, 63.84 mm over."
  - at_minute: 18
    type: estimate
    prompt: "A host enforces the 60 ms lease and stalls 200 ms at 1.3 m/s. Extra travel? Does the stop fit?"
    answer: "140 ms x 1.3 m/s = 182 mm; 182 - 131.0 = 50.99 mm overrun."
  - at_minute: 32
    type: concept_question
    prompt: "Clamp each joint, project the pair, or stop?"
    answer: "Project: (1.5, 2), lambda* = 1, change 2.236 N m; the clamp leaves 7 > 5."
  - at_minute: 41.5
    type: estimate
    prompt: "Peak force at 0.10 m/s on a free hand and on a hand clamped against a rack upright?"
    answer: "20.7 N (passes 50 N) and 94.9 N (fails); ceilings 0.24 and 0.053 m/s."
  - at_minute: 55
    type: concept_question
    prompt: "The host crashes at 1.3 m/s. Is cutting torque (STO) the safest stop?"
    answer: "No: STO does not brake; the heartbeat trips in 30 ms and the resident STOP takes 931.25 ms over 605.31 mm."
  - at_minute: 63
    type: retrieval
    prompt: "Name the four jobs of the permission path and the one thing beneath it."
    answer: "Reserve the stop, correct by least change, respect contact force, hold a state-matched fallback; a certified hardware floor beneath."
concept_trace:
  - concept: Stopping envelope
    frame: "The envelope is a ceiling that changes with clearance"
    shows: "Phase-portrait build: the envelope as the set of states from which the resident stop succeeds, with the 1.44 m/s ceiling at 1.10 m; preceded by the budget build and the worked ceiling"
  - concept: Kinetic barrier
    frame: "A barrier on distance alone gives the motor no say"
    shows: "Relative-degree chain build and h = theta - omega^2/(2 alpha_net); torque demand plot on the next frame"
  - concept: Minimal-intervention filter
    frame: "Vote: clamp each joint, or project the pair?"
    shows: "Torque-plane build: clamp (2, 3) outside, projection (1.5, 2) on the barrier; closed form and SciPy run on 'The minimal-intervention filter has a closed form'"
  - concept: Contact margins
    frame: "At the latch, force keeps rising while the brake engages"
    shows: "Force-time build: 39 N at brake onset at 0.03 m/s, 95 N and 400 m/s^2 at 0.10 m/s; hand-force bars on the next frame"
  - concept: Invariance premises and timing
    frame: "Every barrier rests on five premises, each with a detector"
    shows: "Five premises each joined to its per-tick detector; the cycle budget bar on the next frame"
  - concept: State-matched fallback ladder
    frame: "The arbiter jumps to the rung whose prerequisites still hold"
    shows: "Four-step ladder build mapping failed check and state to PROJECT, HOLD, STOP, INHIBIT; STO-against-STOP plot on the vote that follows"
  - concept: Certified floor beneath an unrated layer
    frame: "The certified claim rests on the floor beneath the QP"
    shows: "Table of responses and their certified counterparts and levels, the rated watchdog marked, with a photo of a safety controller"
  - concept: Enforcement record
    frame: "The enforcement record binds each tick to its evidence"
    shows: "Admitted-command fields (table 5, abridged) beside the contract and audit log"
secondary_taught:
  - {concept: Recoverable set, frame: "The envelope is a ceiling that changes with clearance"}
  - {concept: Tracking bound, frame: "Predict: does the drive limit fit the rack end?"}
  - {concept: Net braking authority, frame: "Gravity takes 75% of the torque and quadruples the stop"}
  - {concept: Speed and separation monitoring, frame: "Against a walking person, the person's travel is 70% of it"}
  - {concept: Human separation distance, frame: "A walking person cuts the base's ceiling to 0.26 m/s"}
  - {concept: Functional-safety integrity grading, frame: "The certified claim rests on the floor beneath the QP"}
  - {concept: Passive-compliance stiffness, frame: "At the latch, force keeps rising while the brake engages (notes only; stated qualitatively, sized in Lecture 18 per the course plan's open item)"}
open_questions:
  - "Policies trained with the safety filter in the loop learn to avoid its boundary. Does that make the filter less necessary, or harder to audit?"
  - "A humanoid cannot stop by removing torque. What is its INHIBIT rung?"
  - "Should the QP itself be certified, or should certification stay with simpler functions beneath it?"
more_examples:
  - "SICK nanoScan3 safety laser scanner: 85 ms response, PL d (datasheet NANS3-CAAZ30AA1, 2024-12-17)"
  - "Franka Research 3: 87 Nm peak on axes 1-4, 12 Nm on 5-7 (datasheet R02212 2.3)"
  - "Kirschner et al. 2022: measured clamped-hand forces on four commercial arms (arXiv 2203.02706, Table II)"
  - "Cruise, October 2023: pullover fallback after a misclassified collision (Exponent 2024; Quinn Emanuel 2024)"
  - "Tempe, 2018: braking tied to classification (Safety Enforcement §12.11; owned by Lecture 1)"
  - "Pilz PNOZ s4 safety relay and modular safety controllers; emergency stop buttons (photos)"
further_reading:
  - cite: "Ames, Coogan, Egerstedt, Notomista, Sreenath, Tabuada, Control Barrier Functions: Theory and Applications, ECC 2019"
    url: "https://doi.org/10.23919/ECC.2019.8796030"
    why: "The standard tutorial on barrier functions and the QP filter."
  - cite: "Hsu, Hu, Fisac, The Safety Filter: A Unified View of Safety-Critical Control in Autonomous Systems, Annual Review of Control, Robotics, and Autonomous Systems, 2024"
    url: "https://doi.org/10.1146/annurev-control-071723-102940"
    why: "Barrier functions, reachability, and backup-set filters as one family; filter-aware training."
  - cite: "Sha, Using Simplicity to Control Complexity, IEEE Software, 2001"
    why: "The runtime-assurance argument behind Simplex."
  - cite: "Leveson and Turner, An Investigation of the Therac-25 Accidents, IEEE Computer, 1993"
    why: "Why a protective layer cannot be its own backstop."
  - cite: "Kirschner, Mansfeld, Abdolshah, Haddadin, ISO/TS 15066: How Different Interpretations Affect Risk Assessment, arXiv 2203.02706, 2022"
    url: "https://arxiv.org/abs/2203.02706"
    why: "Measured contact forces against the formula the lecture uses."
segments:
  - name: Envelope
    minutes: "9-24"
    question: "How fast may the machine approach the rack end?"
    land: "Clearance is a composite margin, and the finished budget sets the speed below the motor's limit."
    real_things: ["Jungheinrich driverless truck photo", "SICK nanoScan3 datasheet excerpt"]
  - name: Barrier
    minutes: "24-38"
    question: "How does a stopping margin become a limit on the next command?"
    land: "The kinetic barrier turns the stop into a half-space on the next torque; the filter removes only the violating part."
    real_things: ["Franka Research 3 datasheet excerpt", "SciPy run of the projection"]
  - name: Contact
    minutes: "38-49"
    question: "What is the margin when touching is the task?"
    land: "In contact, force replaces distance; every ceiling rests on a premise only measurement settles."
    real_things: ["UR16e photo", "KUKA LBR iiwa photo", "Kirschner et al. measured forces"]
  - name: Reserve
    minutes: "49-63"
    question: "What runs when no correction exists?"
    land: "The fallback matches the state and the surviving hardware; the certified floor carries the formal claim."
    real_things: ["Emergency stop and Pilz safety relay photos", "Cruise vehicle photo", "Pilz safety controller photo"]
