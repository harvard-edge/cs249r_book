left_to_reading:
  - concept: "Hamilton-Jacobi reachability and predictive safety filters"
    why: "Alternatives to the closed-form barrier; detail better read (§12.4.1, table 2)."
  - concept: "Where the thesis bends: direct torque policies (§12.7.1)"
    why: "Named in an open question; the full argument is in the reading."
  - concept: "Undervoltage hold-up timing (§12.8.1)"
    why: "Second-lecture material."
second_lecture_split: "Split after §12.6 (the course plan's line): a first part on the envelope and the filter (tracking bound, budget, envelope, saturation, barriers, the QP, contact); a second part on the reserve (invariance premises and timing, monitor independence, the fallback ladder, stop categories and the STO trap, certified functions, failure modes, the enforcement record). In this deck the split falls at the Reserve divider; the first part would add the energy tank and table 2's filter family, the second the undervoltage hold-up, monitor placement, and the Tempe fallacy."
coverage:
  primary_taught: [Stopping envelope, Kinetic barrier, Minimal-intervention filter, Contact margins, Invariance premises and timing, State-matched fallback ladder, Certified floor beneath an unrated layer, Enforcement record]
  primary_left_to_reading: []
  secondary: [Recoverable set, Tracking bound, Net braking authority, Speed and separation monitoring, Human separation distance, Functional-safety integrity grading, Passive-compliance stiffness]
closing:
  return_to_hook: "The Therac-25 had one software path and nothing beneath it; the running machine has the per-tick enforcer and a separate certified floor."
  read_and_practice: ["§12.1 to §12.12", "Checkpoints 12.1 to 12.3", "Napkin Math 12.1 to 12.3", "appendix_control (barrier functions) for machine learning students"]
  bridge: "Next lecture (Workload Placement): why can a safety check miss its deadline on its own processor core?"
notes_for_author:
  - "Passive-compliance stiffness: stated qualitatively in the latch note only, per the course plan's open item (L12 owns, L18 sizes)."
  - "Photos show real devices of the right class (TIAGo++, Jungheinrich ERC 213a, UR16e, KUKA LBR iiwa, Cruise Bolt); captions do not claim they are the book's reference machine or the incident vehicle."
  - "Chapter cites ISO/TS 15066 hand values (0.6 kg, 75 N/mm); Kirschner et al. 2022 reproduce the same values and measure forces."
  - "Opens Part III, Running the Machine (the third law, proposal is not permission)."
