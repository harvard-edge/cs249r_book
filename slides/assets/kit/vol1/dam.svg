<text x="450" y="100" font-family="Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#008F45" text-anchor="middle" dominant-baseline="central" opacity="1">D</text>
<text x="524" y="52" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#1A1A2E" text-anchor="start" dominant-baseline="central" opacity="1">Data</text>
<circle cx="260" cy="400" r="58" fill="#FFFFFF"/>
