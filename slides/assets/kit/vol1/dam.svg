<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="D-A-M triangle">
<title>D-A-M triangle</title>
<line x1="450" y1="100" x2="260" y2="400" stroke="#7E317B" stroke-width="6"/>
