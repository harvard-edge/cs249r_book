<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 94" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Keyboard gradient update against its background-memory allowance</title>
  <rect x="0" y="0" width="180" height="94" fill="#ffffff"/>
  <!-- limit label: the 300 MB allowance (KeyboardBackgroundBudgetExample) -->
  <text x="174" y="15" font-size="14" fill="#CB202D" text-anchor="end">Allowance 300 MB</text>
  <!-- envelope: full allowance, linear scale, 0..300 MB over x 4..174 -->
  <path d="M 174 26 H 4 V 60 H 174" fill="none" stroke="#006395" stroke-width="1.3"/>
  <!-- filled share: 75 MB = 25% of 170 px = 42.5 px (KeyboardGradientExample) -->
  <rect x="4" y="26" width="42.5" height="34" fill="#006395"/>
  <text x="25.3" y="48" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">25%</text>
  <!-- red limit marker at the allowance edge -->
  <line x1="174" y1="20" x2="174" y2="65.5" stroke="#CB202D" stroke-width="1.8" stroke-dasharray="4 2.5"/>
  <!-- update label under the filled share -->
  <text x="4" y="84" font-size="14" fill="#333333">Update 75 MB</text>
</svg>
