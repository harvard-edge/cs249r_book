<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 62" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Round closes after the first K valid reports; the straggler is late</title>
  <rect x="0" y="0" width="180" height="62" fill="#ffffff"/>
  <!-- neutral bracket over the accepted set: cells 1 .. K -->
  <text x="71" y="16" font-size="14" fill="#333333" text-anchor="middle">first <tspan font-style="italic" font-size="14">K</tspan></text>
  <line x1="4" y1="26" x2="138" y2="26" stroke="#333333" stroke-width="1.6"/>
  <line x1="4" y1="21.5" x2="4" y2="30.5" stroke="#333333" stroke-width="1.4"/>
  <line x1="138" y1="21.5" x2="138" y2="30.5" stroke="#333333" stroke-width="1.4"/>
  <!-- accepted reports -->
  <rect x="4" y="36" width="34" height="22" fill="#1F407A"/>
  <text x="21" y="52" font-size="14" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="40" y="36" width="34" height="22" fill="#1F407A"/>
  <text x="57" y="52" font-size="14" fill="#ffffff" text-anchor="middle">2</text>
  <text x="89" y="51" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">…</text>
  <rect x="104" y="36" width="34" height="22" fill="#1F407A"/>
  <text x="121" y="52" font-size="14" fill="#ffffff" text-anchor="middle" font-style="italic">K</text>
  <!-- straggler: the only fault, the only red -->
  <rect x="142" y="36" width="34" height="22" fill="#DC2626"/>
  <text x="159" y="52" font-size="14" fill="#ffffff" text-anchor="middle">late</text>
</svg>
