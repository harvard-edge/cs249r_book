<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="650" height="376" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== hardware-in-service marker: manufacturing ends, operation begins ===== -->
  <line x1="290" y1="42" x2="290" y2="276" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="290" y="34" text-anchor="middle" font-size="12.5" fill="#334155">hardware in service</text>

  <!-- ===== Lane labels ===== -->
  <text x="20" y="62" font-size="14" font-weight="700" fill="#0f172a">Manufacturing</text>
  <text x="20" y="80" font-size="12.5" fill="#78492A">CO<tspan baseline-shift="sub" font-size="11">2,embodied</tspan></text>
  <text x="20" y="98" font-size="12" fill="#475569">fab, assembly, supply chain</text>

  <text x="20" y="142" font-size="14" font-weight="700" fill="#0f172a">Training</text>
  <text x="20" y="160" font-size="12.5" fill="#9a4a0b">CO<tspan baseline-shift="sub" font-size="11">2,training</tspan></text>
  <text x="20" y="178" font-size="12" fill="#475569">scale, PUE, checkpoint I/O</text>

  <text x="20" y="222" font-size="14" font-weight="700" fill="#0f172a">Inference</text>
  <text x="20" y="240" font-size="12.5" fill="#9a4a0b">CO<tspan baseline-shift="sub" font-size="11">2,inference</tspan></text>
  <text x="20" y="258" font-size="12" fill="#475569">traffic, KV cache, grid</text>

  <!-- ===== Manufacturing: fixed before the hardware runs ===== -->
  <rect x="196" y="56" width="84" height="30" rx="1" fill="#E3D3C8" stroke="#78492A" stroke-width="1.2"/>

  <!-- ===== Training: one bounded run ===== -->
  <rect x="300" y="136" width="96" height="30" rx="1" fill="#FCE4CC" stroke="#E67817" stroke-width="1.2"/>
  <text x="406" y="156" font-size="12.5" fill="#475569">once</text>

  <!-- ===== Inference: recurs per request for the service life ===== -->
  <text x="404" y="236" text-anchor="end" font-size="12.5" fill="#475569">recurs per request</text>
  <g fill="#FCE4CC" stroke="#E67817" stroke-width="1">
    <rect x="414" y="216" width="8" height="30"/>
    <rect x="428" y="216" width="8" height="30"/>
    <rect x="442" y="216" width="8" height="30"/>
    <rect x="456" y="216" width="8" height="30"/>
    <rect x="470" y="216" width="8" height="30"/>
    <rect x="484" y="216" width="8" height="30"/>
    <rect x="498" y="216" width="8" height="30"/>
    <rect x="512" y="216" width="8" height="30"/>
    <rect x="526" y="216" width="8" height="30"/>
    <rect x="540" y="216" width="8" height="30"/>
    <rect x="554" y="216" width="8" height="30"/>
    <rect x="568" y="216" width="8" height="30"/>
    <rect x="582" y="216" width="8" height="30"/>
    <rect x="596" y="216" width="8" height="30"/>
    <rect x="610" y="216" width="8" height="30"/>
  </g>

  <!-- ===== time axis ===== -->
  <line x1="186" y1="276" x2="624" y2="276" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="620" y="268" text-anchor="end" font-size="12.5" fill="#334155">time</text>
  <path d="M290,286 v6 h328 v-6" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="454" y="309" text-anchor="middle" font-size="12.5" fill="#334155">service life</text>

  <!-- ===== lifecycle sum ===== -->
  <text x="325" y="348" text-anchor="middle" font-size="14" fill="#0f172a">CO<tspan baseline-shift="sub" font-size="11.5">2,lifecycle</tspan> = <tspan fill="#78492A">CO<tspan baseline-shift="sub" font-size="11.5">2,embodied</tspan></tspan> + <tspan fill="#9a4a0b">CO<tspan baseline-shift="sub" font-size="11.5">2,training</tspan></tspan> + <tspan fill="#9a4a0b">CO<tspan baseline-shift="sub" font-size="11.5">2,inference</tspan></tspan></text>
</svg>
