<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="100pt" viewBox="0 0 180 200" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#777777" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="180" height="200" fill="#ffffff"/>
  <!-- Linear scale: 164 px = 640 pJ. One FP32 operand from DRAM = 4 B x 160 pJ/B = 640 pJ. -->
  <rect x="6" y="16" width="164" height="60" fill="#006395"/>
  <text x="164" y="42" font-size="13" fill="#ffffff" text-anchor="end">FP32 from DRAM</text>
  <text x="164" y="60" font-size="13" fill="#ffffff" text-anchor="end">640 pJ</text>
  <!-- Ratio leader between the two bar ends -->
  <line x1="10" y1="100" x2="169" y2="100" stroke="#777777" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="72" y="90" width="36" height="20" fill="#ffffff"/>
  <text x="90" y="105" font-size="14" fill="#333333" text-anchor="middle">64×</text>
  <!-- GPU effective energy per FLOP = 10 pJ, same linear scale (2.56 px) -->
  <rect x="6" y="124" width="2.56" height="60" fill="#e67817"/>
  <text x="16" y="150" font-size="13" fill="#333333">GPU FLOP</text>
  <text x="16" y="167" font-size="13" fill="#333333">10 pJ</text>
  <line x1="4" y1="192" x2="176" y2="192" stroke="#cccccc" stroke-width="1.4"/>
</svg>
