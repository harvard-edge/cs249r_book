<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 720 262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="8" width="720" height="262" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#008F45"/>
    </marker>
  </defs>
  <!-- ===== recovery loop: refurbish / recover components ===== -->
  <path d="M660,78 V40 H240 V76" fill="none" stroke="#008F45" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>
  <rect x="388" y="28" width="124" height="22" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="12.5" fill="#15803d">refurbish or recover</text>
  <!-- ── 1 · Design ── -->
  <rect x="20" y="80" width="140" height="56" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="90" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">1 · Design</text>
  <text x="90" y="123" text-anchor="middle" font-size="12.5" fill="#334155">architecture, hardware</text>
  <line x1="160" y1="108" x2="198" y2="108" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <!-- ── 2 · Manufacture ── -->
  <rect x="200" y="80" width="140" height="56" rx="3" fill="#E3D3C8" stroke="#78492A" stroke-width="1.5"/>
  <text x="270" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">2 · Manufacture</text>
  <text x="270" y="123" text-anchor="middle" font-size="12.5" fill="#334155">fab, assembly</text>
  <line x1="340" y1="108" x2="378" y2="108" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <!-- ── 3 · Use ── -->
  <rect x="380" y="80" width="140" height="56" rx="3" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <text x="450" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">3 · Use</text>
  <text x="450" y="123" text-anchor="middle" font-size="12.5" fill="#334155">training, inference</text>
  <line x1="520" y1="108" x2="558" y2="108" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <!-- ── 4 · Decommission ── -->
  <rect x="560" y="80" width="140" height="56" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="630" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">4 · Decommission</text>
  <text x="630" y="123" text-anchor="middle" font-size="12.5" fill="#334155">retire, recover</text>
  <!-- ===== burdens added by each stage ===== -->
  <line x1="270" y1="136" x2="270" y2="168" stroke="#78492A" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="204" y="170" width="132" height="46" rx="2" fill="#E3D3C8" stroke="#78492A" stroke-width="1.2"/>
  <text x="270" y="189" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5c3720">embodied carbon</text>
  <text x="270" y="206" text-anchor="middle" font-size="12.5" fill="#5c3720">water, chemicals</text>
  <line x1="450" y1="136" x2="450" y2="168" stroke="#E67817" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="384" y="170" width="132" height="46" rx="2" fill="#FCE4CC" stroke="#E67817" stroke-width="1.2"/>
  <text x="450" y="189" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a4a0b">operational energy</text>
  <text x="450" y="206" text-anchor="middle" font-size="12.5" fill="#9a4a0b">× grid intensity</text>
  <line x1="630" y1="136" x2="630" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="564" y="170" width="132" height="46" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="630" y="189" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">e-waste</text>
  <text x="630" y="206" text-anchor="middle" font-size="12.5" fill="#334155">unless recovered</text>
  <!-- ===== design fixes much of the later load ===== -->
  <path d="M90,136 V246 H630" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="270" y1="246" x2="270" y2="218" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <line x1="450" y1="246" x2="450" y2="218" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <line x1="630" y1="246" x2="630" y2="218" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="100" y="240" font-size="12.5" fill="#334155">load set at design time</text>
</svg>
