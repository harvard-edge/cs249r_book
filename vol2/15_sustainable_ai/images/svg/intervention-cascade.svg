<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 680 534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="-12" width="680" height="534" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- ===== Unit bands: the chain changes units at the grid factor ===== -->
  <rect x="330" y="66" width="320" height="226" rx="0" fill="#FCE4CC" fill-opacity="0.35" stroke="none"/>
  <rect x="330" y="292" width="320" height="204" rx="0" fill="#f1f5f9" stroke="none"/>
  <line x1="330" y1="292" x2="650" y2="292" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="640" y="86" text-anchor="end" font-size="13" font-weight="700" fill="#9a4a0b">kWh</text>
  <text x="640" y="486" text-anchor="end" font-size="13" font-weight="700" fill="#475569">kg CO₂e</text>


  <!-- ===== Fixed useful work (input) ===== -->
  <rect x="380" y="16" width="140" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="450" y="37" text-anchor="middle" font-size="13" fill="#334155">fixed useful work</text>
  <line x1="450" y1="48" x2="450" y2="78" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- ===== Tier 1: IT energy ===== -->
  <rect x="360" y="80" width="180" height="70" rx="3" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <text x="450" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">IT energy</text>

  <!-- op1: x PUE -->
  <line x1="450" y1="150" x2="450" y2="164" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <circle cx="450" cy="180" r="14" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">×</text>
  <text x="474" y="185" font-size="13" fill="#334155">PUE</text>
  <line x1="450" y1="194" x2="450" y2="208" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- ===== Tier 2: Facility energy ===== -->
  <rect x="360" y="210" width="180" height="52" rx="3" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <text x="450" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Facility energy</text>

  <!-- op2: x grid factor (unit boundary) -->
  <line x1="450" y1="262" x2="450" y2="276" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <circle cx="450" cy="292" r="14" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="298" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">×</text>
  <text x="474" y="276" font-size="13" fill="#334155">kg CO₂e / kWh</text>
  <line x1="450" y1="306" x2="450" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- ===== Tier 3: Electricity carbon ===== -->
  <rect x="360" y="322" width="180" height="52" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Electricity carbon</text>

  <!-- op3: + embodied -->
  <line x1="450" y1="374" x2="450" y2="388" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <circle cx="450" cy="404" r="14" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">+</text>
  <text x="474" y="409" font-size="13" fill="#334155">embodied</text>
  <line x1="450" y1="418" x2="450" y2="432" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- ===== Tier 4: Lifecycle account ===== -->
  <rect x="360" y="434" width="180" height="52" rx="3" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="450" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Lifecycle account</text>

  <!-- ===== Levers ===== -->
  <g font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="40" y="80" width="210" height="30" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="145" y="100">Work reduction</text>
    <rect x="40" y="120" width="210" height="30" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="145" y="140">Execution efficiency</text>
    <rect x="40" y="165" width="210" height="30" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="145" y="185">Facility overhead</text>
    <rect x="40" y="277" width="210" height="30" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="145" y="297">Grid factor</text>
    <rect x="40" y="389" width="210" height="30" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="145" y="409">Hardware lifecycle</text>
  </g>

  <!-- lever arrows: each lands on the quantity or factor it changes -->
  <g stroke="#64748b" stroke-width="1.2" fill="none">
    <line x1="250" y1="95" x2="358" y2="95" marker-end="url(#arr-gray)"/>
    <line x1="250" y1="135" x2="358" y2="135" marker-end="url(#arr-gray)"/>
    <line x1="250" y1="180" x2="434" y2="180" marker-end="url(#arr-gray)"/>
    <line x1="250" y1="292" x2="434" y2="292" marker-end="url(#arr-gray)"/>
    <line x1="250" y1="404" x2="434" y2="404" marker-end="url(#arr-gray)"/>
  </g>
</svg>
