  <text x="250" y="40" text-anchor="start" font-size="13" font-weight="700" fill="#14294E">User embeddings</text>
  <rect x="250" y="48" width="76" height="44" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
