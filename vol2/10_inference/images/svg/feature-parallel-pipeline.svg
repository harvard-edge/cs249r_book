  <rect x="350" y="128" width="76" height="44" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <path d="M350,139 H426 M350,150 H426 M350,161 H426" stroke="#1F407A" stroke-opacity="0.35" stroke-width="0.6"/>
  <rect x="350" y="150" width="76" height="11" rx="0" fill="#1F407A"/>
  <text x="250" y="200" text-anchor="start" font-size="13" font-weight="700" fill="#14294E">Context embeddings</text>
  <rect x="250" y="208" width="76" height="44" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
