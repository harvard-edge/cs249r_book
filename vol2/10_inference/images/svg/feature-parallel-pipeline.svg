<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 5 724 302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="-2" y="5" width="724" height="302" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
