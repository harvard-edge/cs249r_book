  <rect x="624" y="128" width="76" height="10" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="624" y="144" width="62" height="10" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="624" y="160" width="48" height="10" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="624" y="176" width="34" height="10" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="662" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Output</text>
  <text x="662" y="236" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">ranked</text>
