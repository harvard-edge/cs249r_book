  <path d="M326,64.5 H338 V100 H436 V132 H474" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr-amber)"/>
  <path d="M426,155.5 H474" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M326,246.5 H338 V264 H436 V180 H474" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr-amber)"/>
  <rect x="476" y="120" width="26" height="24" rx="0" fill="#1F407A" stroke="#ffffff" stroke-width="1"/>
  <text x="489" y="136.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">U</text>
  <rect x="476" y="144" width="26" height="24" rx="0" fill="#1F407A" stroke="#ffffff" stroke-width="1"/>
  <text x="489" y="160.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">I</text>
  <rect x="476" y="168" width="26" height="24" rx="0" fill="#1F407A" stroke="#ffffff" stroke-width="1"/>
  <text x="489" y="184.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">C</text>
  <rect x="476" y="120" width="26" height="72" rx="0" fill="none" stroke="#1F407A" stroke-width="1.2"/>
  <text x="489" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Gather</text>
  <text x="489" y="108" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">concatenate</text>
  <!-- ===== dense ranking head ===== -->
  <path d="M502,156 H526" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="528" y="116" width="14" height="80" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="554" y="126" width="14" height="60" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="580" y="136" width="14" height="40" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="561" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Ranking head</text>
  <text x="561" y="236" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">dense MLP</text>
  <path d="M594,156 H620" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
