<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Megatron-style tensor-parallel layer pair on two GPUs, drawn as matrix shapes.
       Filled blue = the shard a GPU holds (C1 compute); dashed gray = the part it does not hold.
       Amber = the one collective (C2 communication). -->
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="748" height="368" fill="#ffffff"/>
  <text x="200" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Column-parallel layer</text>
  <text x="200" y="58" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">A = [A<tspan baseline-shift="sub" font-size="12.5">1</tspan> | A<tspan baseline-shift="sub" font-size="12.5">2</tspan>]</text>
  <text x="420" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Row-parallel layer</text>
  <text x="420" y="58" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">B = [B<tspan baseline-shift="sub" font-size="12.5">1</tspan> ; B<tspan baseline-shift="sub" font-size="12.5">2</tspan>]</text>
  <!-- ===== GPU 0 lane (center y=130) ===== -->
  <text x="20" y="135" text-anchor="start" font-size="13" font-weight="700" fill="#334155">GPU 0</text>
  <rect x="80" y="100" width="40" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="100" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">X</text>
  <text x="140" y="135" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">×</text>
  <rect x="200" y="110" width="40" height="40" rx="0" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="160" y="110" width="40" height="40" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="180" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">A<tspan baseline-shift="sub" font-size="12.5">1</tspan></text>
  <text x="260" y="135" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">=</text>
  <rect x="320" y="100" width="40" height="60" rx="0" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="280" y="100" width="40" height="60" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="300" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Y<tspan baseline-shift="sub" font-size="12.5">1</tspan></text>
  <text x="380" y="135" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">×</text>
  <rect x="400" y="130" width="40" height="40" rx="0" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="400" y="90" width="40" height="40" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="420" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">B<tspan baseline-shift="sub" font-size="12.5">1</tspan></text>
  <text x="460" y="135" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">=</text>
  <rect x="480" y="100" width="40" height="60" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="500" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Z<tspan baseline-shift="sub" font-size="12.5">1</tspan></text>
  <line x1="520" y1="130" x2="568" y2="130" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="650" y1="130" x2="678" y2="130" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="680" y="100" width="40" height="60" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="700" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Z</text>
  <!-- ===== GPU 1 lane (center y=270) ===== -->
  <text x="20" y="275" text-anchor="start" font-size="13" font-weight="700" fill="#334155">GPU 1</text>
  <rect x="80" y="240" width="40" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="100" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">X</text>
  <text x="140" y="275" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">×</text>
  <rect x="160" y="250" width="40" height="40" rx="0" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="200" y="250" width="40" height="40" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="220" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">A<tspan baseline-shift="sub" font-size="12.5">2</tspan></text>
  <text x="260" y="275" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">=</text>
  <rect x="280" y="240" width="40" height="60" rx="0" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="320" y="240" width="40" height="60" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="340" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Y<tspan baseline-shift="sub" font-size="12.5">2</tspan></text>
  <text x="380" y="275" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">×</text>
  <rect x="400" y="230" width="40" height="40" rx="0" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="400" y="270" width="40" height="40" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="420" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">B<tspan baseline-shift="sub" font-size="12.5">2</tspan></text>
  <text x="460" y="275" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">=</text>
  <rect x="480" y="240" width="40" height="60" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="500" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Z<tspan baseline-shift="sub" font-size="12.5">2</tspan></text>
  <line x1="520" y1="270" x2="568" y2="270" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="650" y1="270" x2="678" y2="270" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="680" y="240" width="40" height="60" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="700" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Z</text>
  <!-- ===== The one collective ===== -->
  <rect x="570" y="80" width="80" height="240" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="610" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">AllReduce</text>
  <text x="610" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Z<tspan baseline-shift="sub" font-size="12.5">1</tspan> + Z<tspan baseline-shift="sub" font-size="12.5">2</tspan></text>
  <text x="400" y="204" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-style="italic">no communication</text>
  <text x="100" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">replicated</text>
  <text x="200" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">column shard</text>
  <text x="320" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">local slice</text>
  <text x="420" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">row shard</text>
  <text x="500" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">partial sum</text>
  <text x="700" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">full result</text>
</svg>
