<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Complete data path for the running example, schematic: no rates.
       Columns are tiers; the dashed box is one GPU node. Row 1: training data moves right.
       Row 2: checkpoints move left. Solid = the training loop waits; dashed = once per job or background.
       Every solid copy stays inside the node; every dashed copy crosses its boundary or runs outside it. -->
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="680" height="352" fill="#ffffff"/>
  <rect x="20" y="94" width="100" height="196" rx="0" fill="#f8fafc" stroke="none"/>
  <rect x="150" y="94" width="100" height="196" rx="0" fill="#f8fafc" stroke="none"/>
  <rect x="300" y="94" width="100" height="196" rx="0" fill="#f8fafc" stroke="none"/>
  <rect x="420" y="94" width="100" height="196" rx="0" fill="#f8fafc" stroke="none"/>
  <rect x="540" y="94" width="100" height="196" rx="0" fill="#f8fafc" stroke="none"/>
  <rect x="280" y="34" width="380" height="268" rx="4" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="290" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#334155">One GPU node</text>
  <text x="20" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#334155">Shared services</text>
  <rect x="20" y="44" width="100" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Object</text>
  <text x="70" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">storage</text>
  <rect x="150" y="44" width="100" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="200" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Parallel</text>
  <text x="200" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">file system</text>
  <rect x="300" y="44" width="100" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Local</text>
  <text x="350" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">NVMe</text>
  <rect x="420" y="44" width="100" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="470" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Host</text>
  <text x="470" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">DRAM</text>
  <rect x="540" y="44" width="100" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="590" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">GPU</text>
  <text x="590" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">HBM</text>
  <text x="20" y="116" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">Training data</text>
  <rect x="26" y="142" width="88" height="34" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70" y="163.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">dataset</text>
  <rect x="306" y="142" width="88" height="34" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="163.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">staged copy</text>
  <rect x="426" y="142" width="88" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="470" y="163.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">prefetch</text>
  <rect x="546" y="142" width="88" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="590" y="163.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">batch</text>
  <path d="M114,159 H304" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-green)"/>
  <text x="200" y="151" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">stage once</text>
  <path d="M394,159 H424" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M514,159 H544" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M350,142 V124 H590 V140" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="470" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">optional GDS bypass</text>
  <text x="20" y="212" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">Checkpoints</text>
  <rect x="546" y="226" width="88" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="590" y="247.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">model state</text>
  <rect x="306" y="226" width="88" height="34" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="247.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">local shard</text>
  <rect x="156" y="226" width="88" height="34" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="200" y="247.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">durable copy</text>
  <rect x="26" y="226" width="88" height="34" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70" y="247.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">retained</text>
  <path d="M546,243 H396" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M306,243 H246" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-green)"/>
  <path d="M156,243 H116" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-green)"/>
  <text x="350" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">local save (pause)</text>
  <text x="200" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">async copy</text>
  <text x="70" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">retain selected</text>
  <line x1="170" y1="330" x2="210" y2="330" stroke="#16a34a" stroke-width="1.8"/>
  <text x="218" y="334" text-anchor="start" font-size="12" font-weight="400" fill="#475569">training loop waits</text>
  <line x1="380" y1="330" x2="420" y2="330" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="428" y="334" text-anchor="start" font-size="12" font-weight="400" fill="#475569">once per job or background</text>
</svg>
