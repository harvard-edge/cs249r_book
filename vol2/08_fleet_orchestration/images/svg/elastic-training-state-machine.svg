<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Elastic training state machine. Blue = active training (compute), violet = membership changes (coordination), red = failure path. Solid arrows leave Active training; dashed arrows return to it. -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/></marker>
    <marker id="arr-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="680" height="304" fill="#ffffff"/>
  <g transform="translate(0,-4)">
  <rect x="240" y="120" width="200" height="60" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.6"/>
  <text x="340.0" y="147.0" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Active training</text>
  <text x="340.0" y="164.0" text-anchor="middle" font-size="12" fill="#475569">N ranks, AllReduce each step</text>
  <rect x="20" y="30" width="180" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="110.0" y="52.0" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Scale up</text>
  <text x="110.0" y="69.0" text-anchor="middle" font-size="12" fill="#475569">admit new workers</text>
  <rect x="480" y="30" width="180" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="570.0" y="52.0" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Scale down</text>
  <text x="570.0" y="69.0" text-anchor="middle" font-size="12" fill="#475569">release workers</text>
  <rect x="240" y="232" width="200" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="340.0" y="254.0" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Replace worker</text>
  <text x="340.0" y="271.0" text-anchor="middle" font-size="12" fill="#475569">swap in a healthy host</text>
  <path d="M325,120 C325,96 355,96 355,117" fill="none" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <text x="340" y="90" text-anchor="middle" font-size="12" fill="#14294E">step done</text>
  <path d="M240,132 H110 V82" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-violet)"/>
  <text x="175" y="126" text-anchor="middle" font-size="12" fill="#6d28d9">idle GPUs</text>
  <path d="M60,80 V168 H238" fill="none" stroke="#1F407A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="150" y="184" text-anchor="middle" font-size="12" fill="#14294E">group rebuilt</text>
  <path d="M440,132 H570 V82" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-violet)"/>
  <text x="505" y="126" text-anchor="middle" font-size="12" fill="#6d28d9">preemption</text>
  <path d="M620,80 V168 H442" fill="none" stroke="#1F407A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="530" y="184" text-anchor="middle" font-size="12" fill="#14294E">ranks released</text>
  <path d="M320,180 V230" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <text x="312" y="210" text-anchor="end" font-size="12" fill="#b91c1c">host timeout, ECC</text>
  <path d="M360,232 V182" stroke="#1F407A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="368" y="210" text-anchor="start" font-size="12" fill="#14294E">spare joined</text>
  <path d="M650,80 V257 H442" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <text x="545" y="250" text-anchor="middle" font-size="12" fill="#b91c1c">spot reclaim deadline</text>
  </g>
</svg>
