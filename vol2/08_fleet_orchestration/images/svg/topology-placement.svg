<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Line width encodes per-GPU bandwidth. Left: the job's 4 GPUs straddle two racks; its thin amber flow climbs from leaf to spine to leaf through a shared uplink (pale channel) alongside gray flows from other jobs, through hops 1-2-3. Right: the same job packed under one leaf; thick green links, hop 1 only, spine unused. Blue = the job's GPUs, gray fill = GPUs held by other jobs. -->
  <rect width="680" height="270" fill="#ffffff"/>
  <line x1="340" y1="20" x2="340" y2="250" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <!-- ===== Topology-unaware ===== -->
  <text x="170" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Topology-unaware</text>
  <text x="170" y="89" text-anchor="middle" font-size="11" fill="#475569">shared uplinks</text>
  <rect x="110" y="44" width="120" height="30" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="162" y="63.5" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Spine switch</text>
  <circle cx="216" cy="59" r="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="216" y="63" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">2</text>
  <rect x="20" y="96" width="140" height="120" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="114" font-size="12" font-weight="700" fill="#334155">Rack A</text>
  <rect x="180" y="96" width="140" height="120" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="190" y="114" font-size="12" font-weight="700" fill="#334155">Rack B</text>
  <!-- shared uplink channels (contended): one pale pipe carrying three flows, amber = this job -->
  <path d="M90,124 V59 H110" fill="none" stroke="#e8edf3" stroke-width="22" stroke-linejoin="miter"/>
  <path d="M230,59 H250 V124" fill="none" stroke="#e8edf3" stroke-width="22" stroke-linejoin="miter"/>
  <path d="M90,124 V59 H110 M95,124 V64 H110" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <path d="M230,59 H250 V124 M230,64 H245 V124" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <path d="M85,124 V54 H110" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <path d="M230,54 H255 V124" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <rect x="30" y="124" width="120" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="80" y="141.5" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Leaf switch</text>
  <circle cx="136" cy="137" r="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="136" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">1</text>
  <line x1="44" y1="150" x2="44" y2="172" stroke="#d97706" stroke-width="1.2"/>
  <rect x="30" y="172" width="28" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="44" y="192.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G0</text>
  <line x1="76" y1="150" x2="76" y2="172" stroke="#d97706" stroke-width="1.2"/>
  <rect x="62" y="172" width="28" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="76" y="192.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G1</text>
  <line x1="108" y1="150" x2="108" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <rect x="94" y="172" width="28" height="32" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <line x1="140" y1="150" x2="140" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <rect x="126" y="172" width="28" height="32" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <rect x="190" y="124" width="120" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="232" y="141.5" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Leaf switch</text>
  <circle cx="296" cy="137" r="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="296" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">3</text>
  <line x1="204" y1="150" x2="204" y2="172" stroke="#d97706" stroke-width="1.2"/>
  <rect x="190" y="172" width="28" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="204" y="192.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G2</text>
  <line x1="236" y1="150" x2="236" y2="172" stroke="#d97706" stroke-width="1.2"/>
  <rect x="222" y="172" width="28" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="236" y="192.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G3</text>
  <line x1="268" y1="150" x2="268" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <rect x="254" y="172" width="28" height="32" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <line x1="300" y1="150" x2="300" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <rect x="286" y="172" width="28" height="32" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <line x1="56" y1="242" x2="80" y2="242" stroke="#d97706" stroke-width="1.2"/>
  <text x="88" y="246" font-size="13" fill="#334155"><tspan font-weight="700" fill="#b45309">3 hops</tspan>, ~12.5 GB/s per GPU</text>
  <!-- ===== Topology-aware ===== -->
  <text x="510" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Topology-aware</text>
  <rect x="450" y="44" width="120" height="30" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="510" y="63.5" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">Spine switch</text>
  <text x="510" y="89" text-anchor="middle" font-size="11" fill="#475569">not crossed</text>
  <rect x="360" y="96" width="140" height="120" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="370" y="114" font-size="12" font-weight="700" fill="#15803d">Rack A</text>
  <rect x="370" y="124" width="120" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="420" y="141.5" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Leaf switch</text>
  <circle cx="476" cy="137" r="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="476" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">1</text>
  <line x1="384" y1="150" x2="384" y2="172" stroke="#16a34a" stroke-width="4"/>
  <rect x="370" y="172" width="28" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="384" y="192.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G0</text>
  <line x1="416" y1="150" x2="416" y2="172" stroke="#16a34a" stroke-width="4"/>
  <rect x="402" y="172" width="28" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="416" y="192.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G1</text>
  <line x1="448" y1="150" x2="448" y2="172" stroke="#16a34a" stroke-width="4"/>
  <rect x="434" y="172" width="28" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="448" y="192.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G2</text>
  <line x1="480" y1="150" x2="480" y2="172" stroke="#16a34a" stroke-width="4"/>
  <rect x="466" y="172" width="28" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="480" y="192.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G3</text>
  <rect x="520" y="96" width="140" height="120" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="530" y="114" font-size="12" font-weight="700" fill="#334155">Rack B</text>
  <path d="M430,124 V59 H450" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M570,59 H590 V124" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="530" y="124" width="120" height="26" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="141.5" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">Leaf switch</text>
  <line x1="544" y1="150" x2="544" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <rect x="530" y="172" width="28" height="32" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <line x1="576" y1="150" x2="576" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <rect x="562" y="172" width="28" height="32" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <line x1="608" y1="150" x2="608" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <rect x="594" y="172" width="28" height="32" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <line x1="640" y1="150" x2="640" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <rect x="626" y="172" width="28" height="32" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <line x1="408" y1="242" x2="432" y2="242" stroke="#16a34a" stroke-width="4"/>
  <text x="440" y="246" font-size="13" fill="#334155"><tspan font-weight="700" fill="#15803d">1 hop</tspan>, ~50 GB/s per GPU</text>
</svg>
