<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="334" fill="#ffffff"/>
  <g transform="translate(0,12)">
  <!-- ===== Focal span: inside each cabinet, rack PDU through VRM ===== -->
  <rect x="338" y="86" width="242" height="194" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8" stroke-dasharray="4,2"/>
  <!-- ===== Power band: height proportional to power carried (illustrative losses) ===== -->
  <rect x="40" y="104" width="104" height="153.6" fill="#e2e8f0"/>
  <line x1="40" y1="104" x2="144" y2="104" stroke="#64748b" stroke-width="1.0"/>
  <line x1="40" y1="257.6" x2="144" y2="257.6" stroke="#64748b" stroke-width="1.0"/>
  <rect x="156" y="104" width="88" height="145.9" fill="#e2e8f0"/>
  <line x1="156" y1="104" x2="244" y2="104" stroke="#64748b" stroke-width="1.0"/>
  <line x1="156" y1="249.9" x2="244" y2="249.9" stroke="#64748b" stroke-width="1.0"/>
  <rect x="256" y="104" width="88" height="141.5" fill="#e2e8f0"/>
  <line x1="256" y1="104" x2="344" y2="104" stroke="#64748b" stroke-width="1.0"/>
  <line x1="256" y1="245.5" x2="344" y2="245.5" stroke="#64748b" stroke-width="1.0"/>
  <rect x="356" y="104" width="88" height="137.3" fill="#e2e8f0"/>
  <line x1="356" y1="104" x2="444" y2="104" stroke="#64748b" stroke-width="1.0"/>
  <line x1="356" y1="241.3" x2="444" y2="241.3" stroke="#64748b" stroke-width="1.0"/>
  <rect x="456" y="104" width="88" height="130.4" fill="#e2e8f0"/>
  <line x1="456" y1="104" x2="544" y2="104" stroke="#64748b" stroke-width="1.0"/>
  <line x1="456" y1="234.4" x2="544" y2="234.4" stroke="#64748b" stroke-width="1.0"/>
  <rect x="556" y="104" width="44" height="120.0" fill="#e2e8f0"/>
  <line x1="556" y1="104" x2="600" y2="104" stroke="#64748b" stroke-width="1.0"/>
  <line x1="556" y1="224.0" x2="600" y2="224.0" stroke="#64748b" stroke-width="1.0"/>
  <!-- ===== Conversion losses peel off as heat ===== -->
  <rect x="156" y="249.9" width="7.7" height="18.1" fill="#F8C79A" stroke="#E67817" stroke-width="0.8"/>
  <text x="159.8" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#E67817">~5%</text>
  <rect x="256" y="245.5" width="4.4" height="22.5" fill="#F8C79A" stroke="#E67817" stroke-width="0.8"/>
  <text x="258.2" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#E67817">~3%</text>
  <rect x="356" y="241.3" width="4.2" height="26.7" fill="#F8C79A" stroke="#E67817" stroke-width="0.8"/>
  <text x="358.1" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#E67817">~3%</text>
  <rect x="456" y="234.4" width="6.9" height="33.6" fill="#F8C79A" stroke="#E67817" stroke-width="0.8"/>
  <text x="459.4" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#E67817">~5%</text>
  <rect x="556" y="224.0" width="10.4" height="44.0" fill="#F8C79A" stroke="#E67817" stroke-width="0.8"/>
  <text x="561.2" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#E67817">~8%</text>
  <text x="40" y="296" text-anchor="start" font-size="11" fill="#475569">lost as heat</text>
  <!-- ===== Conversion stages ===== -->
  <rect x="144" y="98" width="12" height="165.6" rx="1" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <text x="150" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Transformer</text>
  <text x="150" y="72" text-anchor="middle" font-size="11" fill="#475569">to 480 V AC</text>
  <rect x="244" y="98" width="12" height="157.9" rx="1" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <text x="250" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">UPS</text>
  <text x="250" y="72" text-anchor="middle" font-size="11" fill="#475569">480 V backup</text>
  <rect x="344" y="98" width="12" height="153.5" rx="1" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <text x="350" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Rack PDU</text>
  <text x="350" y="72" text-anchor="middle" font-size="11" fill="#475569">to 240 V AC</text>
  <rect x="444" y="98" width="12" height="149.3" rx="1" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <text x="450" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Server PSU</text>
  <text x="450" y="72" text-anchor="middle" font-size="11" fill="#475569">to 12 V DC</text>
  <rect x="544" y="98" width="12" height="142.4" rx="1" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <text x="550" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">VRM and GPU</text>
  <text x="550" y="72" text-anchor="middle" font-size="11" fill="#475569">to under 1 V</text>
  <text x="40" y="56" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">Utility grid</text>
  <text x="40" y="72" text-anchor="start" font-size="11" fill="#475569">13 kV+ AC</text>
  <!-- ===== GPU dies ===== -->
  <rect x="600" y="104" width="30" height="120.0" rx="0" fill="#1F407A"/>
  <text x="615" y="164.0" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" transform="rotate(-90 615 164.0)" dy="4">GPU dies</text>
  <text x="615" y="242.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">1 MW</text>
  <text x="52" y="184.8" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">about 1.3 MW</text>
  <!-- ===== The in-cabinet span ===== -->
  <path d="M 338,34 V 27 H 580 V 34" fill="none" stroke="#1F407A" stroke-width="1.4"/>
  <text x="459" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">inside each cabinet: 10–40 kW per rack</text>
  </g>
</svg>
