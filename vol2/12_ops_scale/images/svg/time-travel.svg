<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="680" height="310" fill="#ffffff"/>
  <g transform="translate(0,6)">

  <!-- ===== Region labels ===== -->
  <text x="195" y="62" text-anchor="middle" font-size="11.5" fill="#15803d">known by 12:00</text>
  <text x="465" y="62" text-anchor="middle" font-size="11.5" fill="#64748b">not yet happened at 12:00</text>

  <!-- ===== Training event time (noon) ===== -->
  <text x="330" y="24" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">training example at 12:00</text>
  <path d="M330,32 V178" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ===== Batch job at midnight ===== -->
  <text x="600" y="24" text-anchor="middle" font-size="11.5" fill="#475569">batch job</text>
  <path d="M600,32 V110" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- ===== Timeline ===== -->
  <path d="M60,120 H632" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <path d="M60,114 V126" stroke="#475569" stroke-width="1.2"/>
  <path d="M150,114 V126" stroke="#475569" stroke-width="1.2"/>
  <path d="M240,114 V126" stroke="#475569" stroke-width="1.2"/>
  <path d="M420,114 V126" stroke="#475569" stroke-width="1.2"/>
  <path d="M510,114 V126" stroke="#475569" stroke-width="1.2"/>
  <path d="M600,114 V126" stroke="#475569" stroke-width="1.2"/>
  <text x="60" y="142" text-anchor="middle" font-size="11.5" fill="#64748b">00:00</text>
  <text x="150" y="142" text-anchor="middle" font-size="11.5" fill="#64748b">04:00</text>
  <text x="240" y="142" text-anchor="middle" font-size="11.5" fill="#64748b">08:00</text>
  <text x="344" y="142" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f172a">12:00</text>
  <text x="420" y="142" text-anchor="middle" font-size="11.5" fill="#64748b">16:00</text>
  <text x="510" y="142" text-anchor="middle" font-size="11.5" fill="#64748b">20:00</text>
  <text x="600" y="142" text-anchor="middle" font-size="11.5" fill="#64748b">24:00</text>

  <!-- past clicks (observed) -->
  <circle cx="100" cy="98" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="180" cy="98" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="230" cy="98" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="300" cy="98" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <!-- later clicks (after the example) -->
  <circle cx="360" cy="98" r="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="400" cy="98" r="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="450" cy="98" r="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="490" cy="98" r="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="530" cy="98" r="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="570" cy="98" r="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="88" y="102" text-anchor="end" font-size="11.5" fill="#475569">click</text>

  <!-- ===== Counts ===== -->
  <path d="M94,160 H306" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M94,155 V165" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M306,155 V165" stroke="#16a34a" stroke-width="1.2"/>
  <text x="200" y="178" text-anchor="middle" font-size="11.5" fill="#15803d">4 clicks</text>

  <path d="M94,196 H193" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M207,196 H576" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M94,191 V201" stroke="#dc2626" stroke-width="1.2"/>
  <path d="M576,191 V201" stroke="#dc2626" stroke-width="1.2"/>
  <text x="456" y="214" text-anchor="middle" font-size="11.5" fill="#b91c1c">10 clicks by midnight</text>

  <!-- ===== Results ===== -->
  <path d="M200,184 V230" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <rect x="80" y="232" width="240" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="200" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Point-in-time join</text>
  <text x="200" y="270" text-anchor="middle" font-size="11.5" fill="#15803d"><tspan font-family="Courier New, monospace">total_clicks_today</tspan> = 4</text>

  <path d="M456,220 V230" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <rect x="340" y="232" width="240" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="460" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">Naive join: midnight value</text>
  <text x="460" y="270" text-anchor="middle" font-size="11.5" fill="#b91c1c"><tspan font-family="Courier New, monospace">total_clicks_today</tspan> = 10</text>
  </g>
</svg>
