<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="64pt" viewBox="0 0 180 128" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Schematic inverse-square knee: n proportional to 1/delta_MDE^2. -->
  <rect x="0" y="0" width="180" height="128" fill="#ffffff"/>
  <path d="M14,10 C18,46 22,72 34,88 C50,106 90,114 166,117" fill="none" stroke="#333333" stroke-width="3.2" stroke-linecap="round"/>
  <!-- small effect: costly regime -->
  <circle cx="18.5" cy="36" r="6" fill="#cb202d"/>
  <text x="32" y="22" font-size="13" fill="#cb202d">small effect</text>
  <!-- large effect: neutral -->
  <circle cx="164" cy="117" r="6" fill="#777777"/>
  <text x="168" y="98" font-size="13" fill="#555555" text-anchor="end">large effect</text>
  <!-- formula: n ∝ 1/δ²_MDE -->
  <text x="54" y="66" font-size="17" fill="#333333"><tspan font-style="italic">n</tspan> ∝ 1/<tspan font-style="italic">δ</tspan></text>
  <text x="109" y="56" font-size="12" fill="#333333">2</text>
  <text x="109" y="73" font-size="12" fill="#333333">MDE</text>
</svg>
