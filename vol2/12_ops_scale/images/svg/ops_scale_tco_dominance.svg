<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="36pt" viewBox="0 0 180 72" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Iron-law bar of the four TCO terms; segment widths are illustrative, inference dominant. -->
  <rect x="0" y="0" width="180" height="72" fill="#ffffff"/>
  <!-- segments with 2 px white gutters -->
  <rect x="0" y="30" width="18" height="34" fill="#cccccc"/>
  <rect x="20" y="30" width="86" height="34" fill="#e67817"/>
  <rect x="108" y="30" width="40" height="34" fill="#cccccc"/>
  <rect x="150" y="30" width="30" height="34" fill="#cccccc"/>
  <!-- Train label sits above its narrow segment with a leader -->
  <line x1="9" y1="19" x2="9" y2="29" stroke="#777777" stroke-width="1.2"/>
  <text x="1" y="16" font-size="13" font-weight="700" fill="#333333">Train</text>
  <text x="63" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Infer</text>
  <text x="128" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">Data</text>
  <text x="165" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#333333">Iter</text>
</svg>
