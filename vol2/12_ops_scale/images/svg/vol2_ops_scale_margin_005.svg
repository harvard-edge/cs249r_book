<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="66pt" viewBox="0 0 180 132" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Straggler fan: one slow rank, six identical peers waiting at a barrier. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#aaaaaa" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="180" height="132" fill="#ffffff"/>
  <!-- arrows from slow rank to peers -->
  <g stroke="#aaaaaa" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="38" y1="64" x2="103" y2="14"/>
    <line x1="38" y1="64" x2="103" y2="34"/>
    <line x1="38" y1="64" x2="103" y2="54"/>
    <line x1="38" y1="64" x2="103" y2="74"/>
    <line x1="38" y1="64" x2="103" y2="94"/>
    <line x1="38" y1="64" x2="103" y2="114"/>
  </g>
  <!-- slow rank (straggler) -->
  <rect x="8" y="50" width="28" height="28" fill="#DC2626"/>
  <text x="22" y="96" font-size="13" fill="#DC2626" text-anchor="middle">slow</text>
  <!-- peers -->
  <g fill="#1F407A">
    <circle cx="114" cy="14" r="8"/>
    <circle cx="114" cy="34" r="8"/>
    <circle cx="114" cy="54" r="8"/>
    <circle cx="114" cy="74" r="8"/>
    <circle cx="114" cy="94" r="8"/>
    <circle cx="114" cy="114" r="8"/>
  </g>
  <!-- barrier -->
  <line x1="134" y1="4" x2="134" y2="124" stroke="#333333" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="0" y="0" font-size="13" fill="#333333" text-anchor="middle" transform="translate(152,64) rotate(90)">barrier</text>
</svg>
