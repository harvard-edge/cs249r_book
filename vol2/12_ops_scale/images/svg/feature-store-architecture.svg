<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="316" fill="#ffffff"/>
  <g transform="translate(0,6)">

  <!-- ===== Shared feature definitions ===== -->
  <rect x="160" y="16" width="140" height="40" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="230" y="33" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Feature definitions</text>
  <text x="230" y="48" text-anchor="middle" font-size="11" fill="#6d28d9">schema, transforms</text>
  <path d="M230,56 V78" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>

  <!-- ===== Sources ===== -->
  <rect x="20" y="112" width="100" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="134" text-anchor="middle" font-size="11.5" fill="#0f172a">Batch data</text>
  <rect x="20" y="212" width="100" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="234" text-anchor="middle" font-size="11.5" fill="#0f172a">Event streams</text>
  <path d="M120,130 H158" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M120,230 H158" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Materialization ===== -->
  <rect x="160" y="80" width="130" height="210" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="225" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Materialization</text>
  <path d="M174,112 H276" stroke="#86efac" stroke-width="1"/>
  <text x="225" y="175" text-anchor="middle" font-size="11.5" fill="#15803d">batch</text>
  <text x="225" y="201" text-anchor="middle" font-size="11.5" fill="#15803d">streaming</text>
  <text x="225" y="227" text-anchor="middle" font-size="11.5" fill="#15803d">on-demand</text>
  <path d="M290,124 H328" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M290,246 H328" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ===== Offline store: entity x time history, read by scans ===== -->
  <rect x="330" y="70" width="160" height="104" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Offline store</text>
  <g fill="#bbf7d0" stroke="#16a34a" stroke-width="0.8">
    <rect x="350" y="98" width="24" height="14" rx="0"/>
    <rect x="374" y="98" width="24" height="14" rx="0"/>
    <rect x="398" y="98" width="24" height="14" rx="0"/>
    <rect x="422" y="98" width="24" height="14" rx="0"/>
    <rect x="446" y="98" width="24" height="14" rx="0"/>
    <rect x="350" y="112" width="24" height="14" rx="0"/>
    <rect x="374" y="112" width="24" height="14" rx="0"/>
    <rect x="398" y="112" width="24" height="14" rx="0"/>
    <rect x="422" y="112" width="24" height="14" rx="0"/>
    <rect x="446" y="112" width="24" height="14" rx="0"/>
    <rect x="350" y="126" width="24" height="14" rx="0"/>
    <rect x="374" y="126" width="24" height="14" rx="0"/>
    <rect x="398" y="126" width="24" height="14" rx="0"/>
    <rect x="422" y="126" width="24" height="14" rx="0"/>
    <rect x="446" y="126" width="24" height="14" rx="0"/>
  </g>
  <text x="350" y="160" font-size="11" fill="#15803d">full history</text>
  <path d="M442,156 H470" stroke="#15803d" stroke-width="1" marker-end="url(#arr-green)"/>
  <text x="436" y="160" text-anchor="end" font-size="11" fill="#15803d">time</text>

  <!-- ===== Online store: one latest value per key, read by point lookups ===== -->
  <rect x="330" y="196" width="160" height="94" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="214" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Online store</text>
  <g stroke="#16a34a" stroke-width="0.8">
    <rect x="360" y="222" width="36" height="16" rx="0" fill="#ffffff"/>
    <rect x="396" y="222" width="44" height="16" rx="0" fill="#bbf7d0"/>
    <rect x="360" y="238" width="36" height="16" rx="0" fill="#ffffff"/>
    <rect x="396" y="238" width="44" height="16" rx="0" fill="#86efac" stroke="#1F407A" stroke-width="1.5"/>
    <rect x="360" y="254" width="36" height="16" rx="0" fill="#ffffff"/>
    <rect x="396" y="254" width="44" height="16" rx="0" fill="#bbf7d0"/>
  </g>
  <text x="378" y="234" text-anchor="middle" font-size="11" fill="#15803d">key</text>
  <text x="378" y="250" text-anchor="middle" font-size="11" fill="#15803d">key</text>
  <text x="378" y="266" text-anchor="middle" font-size="11" fill="#15803d">key</text>
  <text x="410" y="284" text-anchor="middle" font-size="11" fill="#15803d">latest value</text>

  <!-- ===== Read paths ===== -->
  <path d="M476,98 H480 V140 H476" fill="none" stroke="#1F407A" stroke-width="1"/>
  <path d="M480,119 H538" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="509" y="112" text-anchor="middle" font-size="11" fill="#14294E">scan</text>
  <path d="M440,246 H538" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="511" y="239" text-anchor="middle" font-size="11" fill="#14294E">lookup</text>

  <!-- ===== Consumers ===== -->
  <text x="600" y="84" text-anchor="middle" font-size="11" fill="#475569">throughput path</text>
  <rect x="540" y="94" width="120" height="50" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="600" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Training</text>
  <text x="600" y="131" text-anchor="middle" font-size="11" fill="#14294E">point-in-time joins</text>
  <text x="600" y="210" text-anchor="middle" font-size="11" fill="#475569">latency path</text>
  <rect x="540" y="221" width="120" height="50" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="600" y="241" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Serving</text>
  <text x="600" y="258" text-anchor="middle" font-size="11" fill="#14294E">point lookups</text>
  </g>
</svg>
