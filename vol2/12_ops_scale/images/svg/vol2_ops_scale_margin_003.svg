<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="60pt" viewBox="0 0 180 120" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Schematic saturating curve 1 - (1 - alpha_fp)^N_tests rising toward 1. -->
  <rect x="0" y="0" width="180" height="120" fill="#ffffff"/>
  <!-- asymptote at probability 1 -->
  <line x1="4" y1="12" x2="176" y2="12" stroke="#cccccc" stroke-width="1.4"/>
  <!-- x-axis baseline -->
  <line x1="4" y1="96" x2="176" y2="96" stroke="#cccccc" stroke-width="1.4"/>
  <path d="M6.0,96.0 L12.0,83.9 L18.0,73.5 L24.0,64.7 L30.0,57.1 L36.0,50.7 L42.0,45.2 L48.0,40.5 L54.0,36.5 L60.0,33.0 L66.0,30.1 L72.0,27.6 L78.0,25.5 L84.0,23.7 L90.0,22.1 L96.0,20.8 L102.0,19.6 L108.0,18.7 L114.0,17.8 L120.0,17.1 L126.0,16.5 L132.0,16.0 L138.0,15.6 L144.0,15.2 L150.0,14.9 L156.0,14.6 L162.0,14.4 L168.0,14.2 L174.0,14.0" fill="none" stroke="#cb202d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="172" y="38" font-size="15" fill="#cb202d" text-anchor="end">near 1</text>
  <!-- axis label: N_tests -->
  <text x="148" y="114" font-size="16" fill="#333333" text-anchor="end" font-style="italic">N</text>
  <text x="149" y="118" font-size="12" fill="#333333">tests</text>
</svg>
