<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="712" height="300" fill="#ffffff"/>

  <!-- ===== Phase headers ===== -->
  <text x="279" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Phase 1: halt v2 traffic and drain</text>
  <path d="M126,34 V28 H432 V34" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="575" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Phase 2: restore v1</text>
  <path d="M452,34 V28 H698 V34" fill="none" stroke="#94a3b8" stroke-width="1"/>

  <!-- ===== Lane labels ===== -->
  <rect x="14" y="64" width="96" height="28" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="62" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Coordinator</text>
  <rect x="14" y="126" width="96" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="62" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Region A</text>
  <rect x="14" y="176" width="96" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="62" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Region B</text>
  <rect x="14" y="226" width="96" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="62" y="244" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Region C</text>

  <!-- ===== Lane lines (time runs left to right) ===== -->
  <path d="M112,78 H698" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M112,140 H698" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M112,190 H698" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M112,240 H698" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== Acknowledgment timeout on the coordinator lane ===== -->
  <path d="M146,58 V52 H420 V58" fill="none" stroke="#6d28d9" stroke-width="1"/>
  <text x="283" y="47" text-anchor="middle" font-size="11" fill="#6d28d9">acknowledgment timeout</text>

  <!-- ===== Phase 1: broadcast rollback intent ===== -->
  <circle cx="146" cy="78" r="4" fill="#7c3aed"/>
  <path d="M146,82 V234" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <circle cx="146" cy="140" r="3" fill="#7c3aed"/>
  <circle cx="146" cy="190" r="3" fill="#7c3aed"/>
  <text x="152" y="112" font-size="11" fill="#6d28d9">rollback intent</text>

  <!-- Regions A and B stop routing new requests to v2 and drain -->
  <rect x="164" y="131" width="112" height="18" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="220" y="144" text-anchor="middle" font-size="11" fill="#0f172a">stop v2, drain</text>
  <rect x="164" y="181" width="112" height="18" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="220" y="194" text-anchor="middle" font-size="11" fill="#0f172a">stop v2, drain</text>

  <!-- Region C is partitioned and never acknowledges -->
  <rect x="164" y="231" width="112" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="220" y="244" text-anchor="middle" font-size="11" fill="#b91c1c">no response</text>

  <!-- Acknowledgments return to the coordinator -->
  <path d="M290,140 V86" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <path d="M308,190 V86" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <circle cx="290" cy="140" r="3" fill="#16a34a"/>
  <circle cx="308" cy="190" r="3" fill="#16a34a"/>
  <text x="314" y="112" font-size="11" fill="#15803d">acks from A, B</text>

  <!-- Timeout expires: C marked unhealthy and fenced -->
  <circle cx="420" cy="78" r="4" fill="#dc2626"/>
  <path d="M420,82 V236" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="420" cy="240" r="4" fill="#dc2626"/>
  <text x="414" y="230" text-anchor="end" font-size="11" fill="#b91c1c">marked unhealthy</text>

  <!-- ===== Acknowledgment barrier ===== -->
  <path d="M442,40 V262" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="442" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">acknowledgment barrier: no healthy region routes to v2</text>

  <!-- ===== Phase 2: restore v1 on healthy regions ===== -->
  <circle cx="466" cy="78" r="4" fill="#7c3aed"/>
  <path d="M466,82 V190" fill="none" stroke="#7c3aed" stroke-width="1.4"/>
  <circle cx="466" cy="140" r="3" fill="#7c3aed"/>
  <circle cx="466" cy="190" r="3" fill="#7c3aed"/>
  <path d="M466,140 H482" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <path d="M466,190 H482" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <text x="472" y="112" font-size="11" fill="#6d28d9">restore v1</text>

  <rect x="484" y="131" width="204" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="586" y="144" text-anchor="middle" font-size="11" fill="#15803d">v1 serving, normal routing</text>
  <rect x="484" y="181" width="204" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="586" y="194" text-anchor="middle" font-size="11" fill="#15803d">v1 serving, normal routing</text>

  <!-- Region C stays fenced until it rejoins -->
  <rect x="484" y="231" width="204" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="586" y="244" text-anchor="middle" font-size="11" fill="#b91c1c">fenced: lease revoked, no routing</text>
</svg>
