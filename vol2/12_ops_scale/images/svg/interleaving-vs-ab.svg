<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 692 312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arr-blue-u" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-dark-u" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="692" height="312" fill="#ffffff"/>
  <g transform="translate(6,6)">

  <!-- ===== Panel A: A/B testing ===== -->
  <text x="16" y="22" font-size="12.5" font-weight="700" fill="#0f172a">A<tspan dx="6">A/B testing</tspan></text>
  <circle cx="77" cy="48" r="7" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="99" cy="48" r="7" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="121" cy="48" r="7" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="143" cy="48" r="7" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="237" cy="48" r="7" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <circle cx="259" cy="48" r="7" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <circle cx="281" cy="48" r="7" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <circle cx="303" cy="48" r="7" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <text x="110" y="76" text-anchor="middle" font-size="11.5" fill="#0f172a">Cohort 1 (50%)</text>
  <text x="270" y="76" text-anchor="middle" font-size="11.5" fill="#0f172a">Cohort 2 (50%)</text>
  <path d="M110,80 V94" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M270,80 V94" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="80" y="96" width="60" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="110" y="112" text-anchor="middle" font-size="12" fill="#14294E">A<tspan font-size="11.4" dy="3">1</tspan></text>
  <rect x="240" y="96" width="60" height="24" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <text x="270" y="112" text-anchor="middle" font-size="12" fill="#334155">B<tspan font-size="11.4" dy="3">1</tspan></text>
  <rect x="80" y="124" width="60" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="110" y="140" text-anchor="middle" font-size="12" fill="#14294E">A<tspan font-size="11.4" dy="3">2</tspan></text>
  <rect x="240" y="124" width="60" height="24" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <text x="270" y="140" text-anchor="middle" font-size="12" fill="#334155">B<tspan font-size="11.4" dy="3">2</tspan></text>
  <rect x="80" y="152" width="60" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="110" y="168" text-anchor="middle" font-size="12" fill="#14294E">A<tspan font-size="11.4" dy="3">3</tspan></text>
  <rect x="240" y="152" width="60" height="24" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <text x="270" y="168" text-anchor="middle" font-size="12" fill="#334155">B<tspan font-size="11.4" dy="3">3</tspan></text>
  <text x="110" y="200" text-anchor="middle" font-size="11.4" fill="#475569">ranker A only</text>
  <text x="270" y="200" text-anchor="middle" font-size="11.4" fill="#475569">ranker B only</text>
  <rect x="80" y="222" width="60" height="24" rx="2" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="110" y="238" text-anchor="middle" font-size="11.4" fill="#14294E">mean</text>
  <rect x="240" y="222" width="60" height="24" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="270" y="238" text-anchor="middle" font-size="11.4" fill="#334155">mean</text>
  <path d="M110,246 V254 H270 V246" fill="none" stroke="#64748b" stroke-width="1"/>
  <path d="M190,254 V262" stroke="#64748b" stroke-width="1"/>
  <text x="190" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">compare the two cohorts' means</text>

  <!-- divider -->
  <path d="M345,16 V284" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== Panel B: Interleaving ===== -->
  <text x="372" y="22" font-size="12.5" font-weight="700" fill="#0f172a">B<tspan dx="6">Interleaving</tspan></text>
  <rect x="420" y="36" width="184" height="26" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="512" y="53" text-anchor="middle" font-size="11.5" fill="#0f172a">each user: one query</text>
  <path d="M450,62 V80 H410 V94" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M574,62 V80 H614 V94" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="512" y="88" text-anchor="middle" font-size="11.4" fill="#475569">merged list</text>
  <rect x="380" y="96" width="60" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="410" y="112" text-anchor="middle" font-size="12" fill="#14294E">A<tspan font-size="11.4" dy="3">1</tspan></text>
  <rect x="584" y="96" width="60" height="24" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <text x="614" y="112" text-anchor="middle" font-size="12" fill="#334155">B<tspan font-size="11.4" dy="3">1</tspan></text>
  <rect x="380" y="124" width="60" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="410" y="140" text-anchor="middle" font-size="12" fill="#14294E">A<tspan font-size="11.4" dy="3">2</tspan></text>
  <rect x="584" y="124" width="60" height="24" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <text x="614" y="140" text-anchor="middle" font-size="12" fill="#334155">B<tspan font-size="11.4" dy="3">2</tspan></text>
  <rect x="380" y="152" width="60" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="410" y="168" text-anchor="middle" font-size="12" fill="#14294E">A<tspan font-size="11.4" dy="3">3</tspan></text>
  <rect x="584" y="152" width="60" height="24" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <text x="614" y="168" text-anchor="middle" font-size="12" fill="#334155">B<tspan font-size="11.4" dy="3">3</tspan></text>
  <!-- team draft: every pick drawn, each source item to its merged slot -->
  <path d="M440,108 H480" stroke="#1F407A" stroke-width="1" marker-end="url(#arr-blue)"/>
  <path d="M440,136 H470 V158 H480" fill="none" stroke="#1F407A" stroke-width="1" marker-end="url(#arr-blue)"/>
  <path d="M584,108 H560 V136 H544" fill="none" stroke="#475569" stroke-width="1" marker-end="url(#arr-gray)"/>
  <path d="M584,136 H572 V186 H544" fill="none" stroke="#475569" stroke-width="1" marker-end="url(#arr-gray)"/>
  <rect x="482" y="96" width="60" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="512" y="112" text-anchor="middle" font-size="12" fill="#14294E">A<tspan font-size="11.4" dy="3">1</tspan></text>
  <rect x="482" y="124" width="60" height="24" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <text x="512" y="140" text-anchor="middle" font-size="12" fill="#334155">B<tspan font-size="11.4" dy="3">1</tspan></text>
  <rect x="482" y="152" width="60" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="512" y="168" text-anchor="middle" font-size="12" fill="#14294E">A<tspan font-size="11.4" dy="3">2</tspan></text>
  <rect x="482" y="180" width="60" height="24" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <text x="512" y="196" text-anchor="middle" font-size="12" fill="#334155">B<tspan font-size="11.4" dy="3">2</tspan></text>
  <!-- clicks on merged A2 and B2, each credited to its source ranker -->
  <path d="M482,172 H450 V206 H410 V221" fill="none" stroke="#1F407A" stroke-width="2.2" marker-end="url(#arr-blue-u)"/>
  <circle cx="482" cy="172" r="4.5" fill="#1F407A" stroke="#ffffff" stroke-width="1"/>
  <path d="M542,198 H614 V221" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-dark-u)"/>
  <circle cx="542" cy="198" r="4.5" fill="#334155" stroke="#ffffff" stroke-width="1"/>
  <rect x="380" y="222" width="60" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="410" y="238" text-anchor="middle" font-size="11.4" fill="#14294E">credit A</text>
  <rect x="584" y="222" width="60" height="24" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.2"/>
  <text x="614" y="238" text-anchor="middle" font-size="11.4" fill="#334155">credit B</text>
  <path d="M410,246 V254 H614 V246" fill="none" stroke="#64748b" stroke-width="1"/>
  <path d="M512,254 V262" stroke="#64748b" stroke-width="1"/>
  <text x="512" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">credit each click to its source ranker</text>
  </g>
</svg>
