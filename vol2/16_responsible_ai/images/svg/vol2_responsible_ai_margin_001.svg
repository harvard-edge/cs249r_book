<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 168" role="img" aria-labelledby="title desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="title">Shapley subset growth</title>
  <desc id="desc">Two horizontal orange bars on a log scale. Three features need 8 subset evaluations, a short bar; twenty features need about 1 million, a bar nearly the full width. A double arrow between the two bar ends is labeled 2 to the n subsets.</desc>
  <rect width="180" height="168" fill="#ffffff"/>
  <!-- ===== Log10 scale: x = 6 + 27 * log10(count) ===== -->
  <!-- 20 features: 2^20 = 1,048,576 -> log10 6.02 -> width 162.6 -->
  <rect x="6" y="10" width="162.6" height="44" fill="#e67817" opacity="0.92"/>
  <text x="161" y="29" text-anchor="end" font-size="14" fill="#ffffff">20 features</text>
  <text x="161" y="47" text-anchor="end" font-size="14" font-weight="bold" fill="#ffffff">≈1M</text>
  <!-- ===== Growth arrow between bar ends ===== -->
  <g stroke="#777777" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M33,74 H58"/>
    <path d="M38,70 L33,74 L38,78"/>
    <path d="M136,74 H166"/>
    <path d="M161,70 L166,74 L161,78"/>
  </g>
  <text x="97" y="79" text-anchor="middle" font-size="14" fill="#333333">2<tspan font-size="12" font-style="italic" dy="-5">n</tspan><tspan dy="5" dx="4">subsets</tspan></text>
  <!-- 3 features: 2^3 = 8 -> log10 0.903 -> width 24.4 -->
  <rect x="6" y="94" width="24.4" height="44" fill="#e67817" opacity="0.92"/>
  <text x="37" y="113" font-size="14" fill="#333333">3 features</text>
  <text x="37" y="131" font-size="14" font-weight="bold" fill="#333333">8</text>
  <!-- ===== Axis ===== -->
  <path d="M6,148 H174" stroke="#cccccc" stroke-width="1.2"/>
  <text x="174" y="163" text-anchor="end" font-size="12" fill="#777777">log scale</text>
</svg>
