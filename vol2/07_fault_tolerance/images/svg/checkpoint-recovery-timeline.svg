<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 680 260" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Top: wall-clock timeline of a run that checkpoints twice and then fails. Bottom: training progress on the
       same time axis; progress made since the last save drops back to the durable level at the failure.
       Blue = productive compute, green = durable checkpoint write, red hatch = lost work, red = recovery. -->
  <defs>
    <pattern id="hatch-red" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fee2e2"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#dc2626" stroke-width="1.2"/>
    </pattern>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="-10" width="680" height="260" fill="#ffffff"/>
  <!-- ===== Timeline bar ===== -->
  <rect x="40" y="40" width="130" height="32" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="105.0" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">compute</text>
  <rect x="170" y="40" width="30" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="200" y="40" width="130" height="32" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="265.0" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">compute</text>
  <rect x="330" y="40" width="30" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="360" y="40" width="90" height="32" fill="url(#hatch-red)" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="383.0" y="48" width="44" height="17" fill="#ffffff"/>
  <text x="405.0" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">lost</text>
  <rect x="452" y="40" width="70" height="32" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="487.0" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">recover</text>
  <rect x="522" y="40" width="122" height="32" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="583.0" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">compute</text>
  <line x1="644" y1="56" x2="658" y2="56" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="185" y="32" text-anchor="middle" font-size="11" fill="#15803d">save</text>
  <text x="345" y="32" text-anchor="middle" font-size="11" fill="#15803d">save</text>
  <path d="M362,34 V28 H522 V34" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="442" y="22" text-anchor="middle" font-size="12" fill="#475569">cost of one failure</text>
  <g stroke="#475569" stroke-width="1" fill="none">
    <path d="M202,80 V86 H328 V80"/>
    <path d="M332,80 V86 H358 V80"/>
    <path d="M364,80 V86 H446 V80"/>
    <path d="M456,80 V86 H520 V80"/>
  </g>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="265" y="102">T<tspan font-size="11" dy="3">ckpt</tspan></text>
    <text x="345" y="102">T<tspan font-size="11" dy="3">write</tspan></text>
    <text x="405" y="102">rework</text>
    <text x="488" y="102">T<tspan font-size="11" dy="3">recovery</tspan></text>
  </g>
  <!-- ===== Progress on the same time axis ===== -->
  <line x1="40" y1="212" x2="658" y2="212" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <line x1="40" y1="212" x2="40" y2="128" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="30" y="170.0" text-anchor="middle" font-size="11" fill="#475569" transform="rotate(-90 30 170.0)">progress</text>
  <text x="658" y="228" text-anchor="end" font-size="11" fill="#475569">time</text>
  <polyline points="40.0,208.0 170.0,182.0 200.0,182.0 330.0,156.0 360.0,156.0" fill="none" stroke="#1F407A" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="360" y1="156.0" x2="450" y2="138.0" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="360" y1="156.0" x2="450" y2="156.0" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="450" y1="138.0" x2="450" y2="154.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="445,150.0 455,150.0 450,156.0" fill="#dc2626"/>
  <polyline points="450.0,156.0 522.0,156.0 644.0,131.6" fill="none" stroke="#1F407A" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="200" cy="182.0" r="3.5" fill="#16a34a"/>
  <circle cx="360" cy="156.0" r="3.5" fill="#16a34a"/>
  <text x="208" y="198.0" font-size="11" fill="#15803d">durable</text>
  <line x1="451" y1="36" x2="451" y2="76" stroke="#dc2626" stroke-width="2.4"/>
  <text x="458" y="140.0" font-size="12" font-weight="700" fill="#b91c1c">failure</text>
</svg>
