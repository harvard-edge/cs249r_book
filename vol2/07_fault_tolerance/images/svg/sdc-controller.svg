<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 704 174" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- N+1 hot-spare failover in three steps. Blue = active compute, red = suspect device,
       dashed green = healthy standby spare, dashed gray = isolated device. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="-12" y="-12" width="704" height="174" fill="#ffffff"/>

  <!-- ===== 1. Flag ===== -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="210" height="130" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">1. Checker flags GPU 2</text>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <rect x="7" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="25" y="67" fill="#14294E">G0</text>
      <rect x="47" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="65" y="67" fill="#14294E">G1</text>
      <rect x="87" y="44" width="36" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="105" y="67" fill="#b91c1c">G2</text>
      <rect x="127" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="145" y="67" fill="#14294E">G3</text>
      <rect x="167" y="44" width="36" height="36" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4,2"/><text x="185" y="67" fill="#15803d">S</text>
    </g>
    <text x="105" y="102" text-anchor="middle" font-size="12" fill="#b91c1c">suspect</text>
    <text x="185" y="102" text-anchor="middle" font-size="12" fill="#15803d">spare</text>
  </g>

  <line x1="222" y1="72" x2="232" y2="72" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>

  <!-- ===== 2. Drain and promote ===== -->
  <g transform="translate(235,10)">
    <rect x="0" y="0" width="210" height="130" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">2. Drain, promote spare</text>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <rect x="7" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="25" y="67" fill="#14294E">G0</text>
      <rect x="47" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="65" y="67" fill="#14294E">G1</text>
      <rect x="87" y="44" width="36" height="36" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,2"/><text x="105" y="67" fill="#94a3b8">G2</text>
      <rect x="127" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="145" y="67" fill="#14294E">G3</text>
      <rect x="167" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.6"/><text x="185" y="67" fill="#14294E">S</text>
    </g>
    <text x="105" y="102" text-anchor="middle" font-size="12" fill="#64748b">isolated</text>
    <text x="185" y="102" text-anchor="middle" font-size="12" fill="#14294E">active</text>
  </g>

  <line x1="447" y1="72" x2="457" y2="72" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>

  <!-- ===== 3. Refill ===== -->
  <g transform="translate(460,10)">
    <rect x="0" y="0" width="210" height="130" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">3. Repair, refill spare</text>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <rect x="7" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="25" y="67" fill="#14294E">G0</text>
      <rect x="47" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="65" y="67" fill="#14294E">G1</text>
      <rect x="87" y="44" width="36" height="36" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4,2"/><text x="105" y="67" fill="#15803d">S′</text>
      <rect x="127" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="145" y="67" fill="#14294E">G3</text>
      <rect x="167" y="44" width="36" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="185" y="67" fill="#14294E">S</text>
    </g>
    <text x="105" y="102" text-anchor="middle" font-size="12" fill="#15803d">new spare</text>
    <text x="105" y="118" text-anchor="middle" font-size="12" fill="#64748b">(G2 to repair)</text>
  </g>
</svg>
