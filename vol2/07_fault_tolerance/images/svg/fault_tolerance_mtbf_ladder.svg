<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="72.63pt" height="99.9pt" viewBox="0 0 72.63 99.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
 <!-- Fleet MTBF ladder, log scale (width = -4.43 + 14.714*log10(hours)). Values: FleetReliabilityRates (50,000 h per GPU; 50 h at 1K GPUs; 5 h at 10K GPUs). -->
 <rect x="0" y="0" width="72.6" height="99.9" fill="#ffffff"/>
 <g fill="#5E6B73" fill-opacity="0.9">
  <rect x="1.4" y="10.2" width="64.7" height="21.3"/>
  <rect x="1.4" y="42.5" width="20.6" height="21.3"/>
  <rect x="1.4" y="74.9" width="5.9" height="21.3"/>
 </g>
 <line x1="1.4" y1="98.5" x2="71.2" y2="98.5" stroke="#cccccc" stroke-width="0.6"/>
 <g font-size="5.2">
  <text x="63.4" y="19.9" fill="#ffffff" text-anchor="end">1 GPU</text>
  <text x="63.4" y="26.4" fill="#ffffff" text-anchor="end">50K h</text>
  <text x="24.6" y="52.2" fill="#333333">1K GPUs</text>
  <text x="24.6" y="58.7" fill="#333333">50 h</text>
  <text x="9.9" y="84.5" fill="#333333">10K GPUs</text>
  <text x="9.9" y="91.0" fill="#333333">5 h</text>
 </g>
 <text x="71.2" y="95.6" font-size="5" fill="#777777" text-anchor="end">log scale</text>
</svg>
