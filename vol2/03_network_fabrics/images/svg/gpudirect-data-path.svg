<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 704 380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>
  <rect x="-12" y="-12" width="704" height="380" fill="#ffffff"/>

  <!-- ===== Node frame ===== -->
  <rect x="10" y="10" width="570" height="300" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="24" y="32" font-size="13" font-weight="700" fill="#0f172a">Sending node</text>

  <!-- ===== Host side (top) ===== -->
  <rect x="40" y="46" width="160" height="62" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="56" y="70" font-size="13" font-weight="700" fill="#0f172a">Host memory</text>
  <text x="56" y="90" font-size="11.5" fill="#475569">registered buffer</text>
  <rect x="166" y="62" width="24" height="30" rx="0" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="178" y="82" text-anchor="middle" font-size="12" font-style="italic" font-weight="700" fill="#475569">n</text>
  <text x="120" y="128" text-anchor="middle" font-size="11.5" fill="#475569">≈2<tspan font-style="italic">n</tspan> bytes of bus traffic</text>

  <rect x="300" y="46" width="140" height="62" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="370" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">CPU</text>
  <text x="370" y="91" text-anchor="middle" font-size="11.5" fill="#475569">root complex</text>

  <!-- ===== PCIe switch ===== -->
  <rect x="100" y="146" width="440" height="44" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="112" y="172" font-size="12.5" font-weight="700" fill="#0f172a">PCIe switch</text>

  <!-- ===== Peers (bottom) ===== -->
  <rect x="170" y="230" width="160" height="62" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="186" y="256" font-size="13" font-weight="700" fill="#14294E">GPU memory</text>
  <text x="186" y="276" font-size="11.5" fill="#475569">payload</text>
  <rect x="294" y="246" width="24" height="30" rx="0" fill="#D6E4F2" stroke="#1F407A" stroke-width="1"/>
  <text x="306" y="266" text-anchor="middle" font-size="12" font-style="italic" font-weight="700" fill="#14294E">n</text>

  <rect x="390" y="230" width="140" height="62" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="460" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">RDMA NIC</text>
  <text x="460" y="276" text-anchor="middle" font-size="11.5" fill="#475569">DMA engine</text>

  <!-- ===== Staged path (dashed gray) ===== -->
  <path d="M210,230 V156 H330 V109" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <line x1="300" y1="66" x2="201" y2="66" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="250" y="58" text-anchor="middle" font-size="11.5" fill="#334155">1. write <tspan font-style="italic">n</tspan></text>
  <line x1="200" y1="90" x2="299" y2="90" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="250" y="104" text-anchor="middle" font-size="11.5" fill="#334155">2. read <tspan font-style="italic">n</tspan></text>
  <path d="M410,108 V156 H500 V229" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>

  <!-- ===== GPUDirect path (solid green) ===== -->
  <path d="M280,230 V180 H430 V229" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <!-- ===== To fabric ===== -->
  <line x1="530" y1="261" x2="650" y2="261" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="596" y="252" text-anchor="middle" font-size="12" fill="#b45309">to fabric</text>

  <!-- ===== Key ===== -->
  <line x1="30" y1="334" x2="70" y2="334" stroke="#16a34a" stroke-width="2.2"/>
  <text x="80" y="338" font-size="12" fill="#0f172a">GPUDirect RDMA (direct)</text>
  <line x1="290" y1="334" x2="330" y2="334" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="340" y="338" font-size="12" fill="#0f172a">Staged via host memory (≈2<tspan font-style="italic">n</tspan> bytes)</text>
</svg>
