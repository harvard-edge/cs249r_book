<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="45pt" viewBox="0 0 180 90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Ten epsilon=1 releases stacked; basic composition gives a total bound of epsilon=10. -->
  <text x="8" y="14" font-size="12" fill="#333333">ε = 1 per release</text>
  <g fill="#666666" stroke="#ffffff" stroke-width="1.5">
    <rect x="8" y="22" width="16" height="26"/>
    <rect x="24" y="22" width="16" height="26"/>
    <rect x="40" y="22" width="16" height="26"/>
    <rect x="56" y="22" width="16" height="26"/>
    <rect x="72" y="22" width="16" height="26"/>
    <rect x="88" y="22" width="16" height="26"/>
    <rect x="104" y="22" width="16" height="26"/>
    <rect x="120" y="22" width="16" height="26"/>
    <rect x="136" y="22" width="16" height="26"/>
    <rect x="152" y="22" width="16" height="26"/>
  </g>
  <line x1="168" y1="18" x2="168" y2="54" stroke="#333333" stroke-width="1.4"/>
  <text x="8" y="68" font-size="12" fill="#333333">10 releases</text>
  <text x="168" y="68" font-size="12" fill="#333333" text-anchor="end">basic bound</text>
  <text x="168" y="85" font-size="13" font-weight="bold" fill="#333333" text-anchor="end">ε = 10</text>
</svg>
