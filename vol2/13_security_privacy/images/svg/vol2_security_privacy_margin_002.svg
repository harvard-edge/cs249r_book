<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="70pt" viewBox="0 0 180 140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Log axis: x = 18 + 31.2 * log10(t / 10 ms); 10 ms to 1000 s spans 156 units. -->
  <rect width="180" height="140" fill="#ffffff"/>
  <!-- Plaintext 20 ms: log10(2) = 0.301 decades -->
  <rect x="18" y="6" width="9.4" height="24" fill="#5e6b73" fill-opacity="0.92"/>
  <text x="32" y="22.3" font-size="12" fill="#333333">Plaintext 20 ms</text>
  <!-- AES 20.5 ms: log10(2.05) = 0.312 decades -->
  <rect x="18" y="38" width="9.7" height="24" fill="#5e6b73" fill-opacity="0.92"/>
  <text x="32" y="54.3" font-size="12" fill="#333333">AES 20.5 ms</text>
  <!-- FHE 200 s: log10(20000) = 4.301 decades -->
  <rect x="18" y="70" width="134.2" height="24" fill="#5e6b73" fill-opacity="0.92"/>
  <text x="24" y="86.3" font-size="12" font-weight="bold" fill="#ffffff">FHE 200 s</text>
  <!-- baseline and decade ticks -->
  <line x1="18" y1="100" x2="174" y2="100" stroke="#999999" stroke-width="0.8"/>
  <g stroke="#999999" stroke-width="0.8">
    <line x1="18" y1="100" x2="18" y2="105"/>
    <line x1="49.2" y1="100" x2="49.2" y2="103"/>
    <line x1="80.4" y1="100" x2="80.4" y2="105"/>
    <line x1="111.6" y1="100" x2="111.6" y2="103"/>
    <line x1="142.8" y1="100" x2="142.8" y2="105"/>
    <line x1="174" y1="100" x2="174" y2="103"/>
  </g>
  <g font-size="12" fill="#333333" text-anchor="middle">
    <text x="18" y="117">10 ms</text>
    <text x="80.4" y="117">1 s</text>
    <text x="142.8" y="117">100 s</text>
  </g>
  <text x="96" y="134" font-size="12" fill="#333333" text-anchor="middle">latency, log scale</text>
</svg>
