<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="362" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-shift" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== Likelihood x impact plane ===== -->
  <rect x="90" y="20" width="280" height="140" fill="#f8fafc"/>
  <rect x="370" y="20" width="280" height="140" fill="#fee2e2"/>
  <rect x="90" y="160" width="280" height="140" fill="#f8fafc"/>
  <rect x="370" y="160" width="280" height="140" fill="#f8fafc"/>
  <path d="M370,20 V300 M90,160 H650" stroke="#94a3b8" stroke-width="1" fill="none"/>
  <rect x="90" y="20" width="560" height="280" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M370,20 H650 V160 H370 Z" fill="none" stroke="#dc2626" stroke-width="1.5"/>

  <!-- ── Quadrant responses ── -->
  <text x="104" y="40" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">Prepare where value is high</text>
  <text x="384" y="40" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">Automate defenses</text>
  <text x="104" y="184" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">Monitor and reassess</text>
  <text x="384" y="184" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">Limit and shape the API</text>

  <!-- ── Example threats (dots) ── -->
  <circle cx="114" cy="62" r="5" fill="#1F407A"/>
  <text x="126" y="66" text-anchor="start" font-size="12" fill="#334155">hardware side channels</text>
  <text x="126" y="81" text-anchor="start" font-size="12" fill="#334155">on cloud-hosted models</text>

  <circle cx="394" cy="62" r="5" fill="#dc2626"/>
  <text x="406" y="66" text-anchor="start" font-size="12" fill="#334155">data poisoning in</text>
  <text x="406" y="81" text-anchor="start" font-size="12" fill="#334155">federated training</text>

  <circle cx="394" cy="216" r="5" fill="#1F407A"/>
  <text x="406" y="220" text-anchor="start" font-size="12" fill="#334155">model extraction</text>
  <text x="406" y="235" text-anchor="start" font-size="12" fill="#334155">via a public API</text>

  <circle cx="320" cy="266" r="5" fill="#1F407A"/>
  <text x="308" y="262" text-anchor="end" font-size="12" fill="#334155">membership inference</text>
  <text x="308" y="277" text-anchor="end" font-size="12" fill="#334155">via a public API</text>

  <!-- ── Reassessment: deployment assumptions move a threat ── -->
  <path d="M114,67 V100 H462" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arr-shift)"/>
  <circle cx="470" cy="100" r="5" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2,1.5"/>
  <text x="126" y="118" text-anchor="start" font-size="11" fill="#475569">sensitive co-tenants or</text>
  <text x="126" y="132" text-anchor="start" font-size="11" fill="#475569">exposed edge hardware</text>

  <path d="M320,261 V131" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arr-shift)"/>
  <circle cx="320" cy="124" r="5" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2,1.5"/>
  <text x="312" y="214" text-anchor="end" font-size="11" fill="#475569">sensitive training data</text>

  <!-- ===== Axes ===== -->
  <path d="M70,300 V24" stroke="#475569" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M90,318 H646" stroke="#475569" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <text x="54" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" transform="rotate(-90 54 160)">Impact</text>
  <text x="54" y="90" text-anchor="middle" font-size="11" fill="#475569" transform="rotate(-90 54 90)">high</text>
  <text x="54" y="230" text-anchor="middle" font-size="11" fill="#475569" transform="rotate(-90 54 230)">lower</text>
  <text x="370" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Likelihood</text>
  <text x="230" y="338" text-anchor="middle" font-size="11" fill="#475569">lower</text>
  <text x="510" y="338" text-anchor="middle" font-size="11" fill="#475569">high</text>
</svg>
