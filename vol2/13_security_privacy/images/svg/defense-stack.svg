<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <!-- ===== Data tier ===== -->
  <rect x="20" y="20" width="540" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="32" y="47" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">Data</text>
  <text x="32" y="63" text-anchor="start" font-size="11" fill="#475569">privacy of records</text>
  <rect x="140" y="28" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="187" y="47" text-anchor="middle" font-size="12" fill="#14294E">encryption</text>
  <text x="187" y="62" text-anchor="middle" font-size="12" fill="#14294E">at rest</text>
  <rect x="245" y="28" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="292" y="47" text-anchor="middle" font-size="12" fill="#14294E">provenance</text>
  <text x="292" y="62" text-anchor="middle" font-size="12" fill="#14294E">tracking</text>
  <rect x="350" y="28" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="397" y="47" text-anchor="middle" font-size="12" fill="#14294E">secure</text>
  <text x="397" y="62" text-anchor="middle" font-size="12" fill="#14294E">aggregation</text>
  <rect x="455" y="28" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="502" y="47" text-anchor="middle" font-size="12" fill="#14294E">differential</text>
  <text x="502" y="62" text-anchor="middle" font-size="12" fill="#14294E">privacy</text>
  <!-- ===== Model tier ===== -->
  <rect x="20" y="96" width="540" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="32" y="123" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">Model</text>
  <text x="32" y="139" text-anchor="start" font-size="11" fill="#475569">learned behavior</text>
  <rect x="140" y="104" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="187" y="123" text-anchor="middle" font-size="12" fill="#14294E">adversarial</text>
  <text x="187" y="138" text-anchor="middle" font-size="12" fill="#14294E">training</text>
  <rect x="245" y="104" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="292" y="123" text-anchor="middle" font-size="12" fill="#14294E">input</text>
  <text x="292" y="138" text-anchor="middle" font-size="12" fill="#14294E">validation</text>
  <rect x="350" y="104" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="397" y="123" text-anchor="middle" font-size="12" fill="#14294E">output</text>
  <text x="397" y="138" text-anchor="middle" font-size="12" fill="#14294E">monitoring</text>
  <rect x="455" y="104" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="502" y="123" text-anchor="middle" font-size="12" fill="#14294E">rate</text>
  <text x="502" y="138" text-anchor="middle" font-size="12" fill="#14294E">limits</text>
  <!-- ===== Platform tier ===== -->
  <rect x="20" y="172" width="540" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="32" y="199" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">Platform</text>
  <text x="32" y="215" text-anchor="start" font-size="11" fill="#475569">runtime isolation</text>
  <rect x="140" y="180" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="187" y="199" text-anchor="middle" font-size="12" fill="#14294E">container</text>
  <text x="187" y="214" text-anchor="middle" font-size="12" fill="#14294E">isolation</text>
  <rect x="245" y="180" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="292" y="199" text-anchor="middle" font-size="12" fill="#14294E">network</text>
  <text x="292" y="214" text-anchor="middle" font-size="12" fill="#14294E">segmentation</text>
  <rect x="350" y="180" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="397" y="199" text-anchor="middle" font-size="12" fill="#14294E">access</text>
  <text x="397" y="214" text-anchor="middle" font-size="12" fill="#14294E">control</text>
  <rect x="455" y="180" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="502" y="199" text-anchor="middle" font-size="12" fill="#14294E">runtime</text>
  <text x="502" y="214" text-anchor="middle" font-size="12" fill="#14294E">telemetry</text>
  <!-- ===== Hardware tier ===== -->
  <rect x="20" y="248" width="540" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="32" y="275" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">Hardware</text>
  <text x="32" y="291" text-anchor="start" font-size="11" fill="#475569">root of trust</text>
  <rect x="140" y="256" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="187" y="275" text-anchor="middle" font-size="12" fill="#14294E">trusted</text>
  <text x="187" y="290" text-anchor="middle" font-size="12" fill="#14294E">execution</text>
  <rect x="245" y="256" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="292" y="275" text-anchor="middle" font-size="12" fill="#14294E">secure</text>
  <text x="292" y="290" text-anchor="middle" font-size="12" fill="#14294E">boot</text>
  <rect x="350" y="256" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="397" y="275" text-anchor="middle" font-size="12" fill="#14294E">HSM key</text>
  <text x="397" y="290" text-anchor="middle" font-size="12" fill="#14294E">custody</text>
  <rect x="455" y="256" width="95" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="502" y="275" text-anchor="middle" font-size="12" fill="#14294E">PUF device</text>
  <text x="502" y="290" text-anchor="middle" font-size="12" fill="#14294E">identity</text>
  <!-- ===== Runtime dependency: a compromised host reaches the mechanism, not the released artifact ===== -->
  <circle cx="560" cy="202" r="5" fill="#dc2626"/>
  <text x="572" y="226" text-anchor="start" font-size="11" font-weight="700" fill="#b91c1c">compromised</text>
  <text x="572" y="240" text-anchor="start" font-size="11" font-weight="700" fill="#b91c1c">host</text>
  <path d="M565,202 H600 V88 H502 V74" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arr-red)"/>
  <text x="608" y="136" text-anchor="start" font-size="11" fill="#b91c1c">alters it</text>
  <text x="608" y="150" text-anchor="start" font-size="11" fill="#b91c1c">before</text>
  <text x="608" y="164" text-anchor="start" font-size="11" fill="#b91c1c">release</text>
  <path d="M550,50 H582" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <rect x="584" y="30" width="72" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="620" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">released</text>
  <text x="620" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">artifact</text>
</svg>
