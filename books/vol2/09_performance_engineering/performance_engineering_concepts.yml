      status: draft
      evidence:
        section: sec-performance-engineering-goodput-family
        quote: 'These four measures complement rather than replace one another. SLO goodput applies on top
          of MPG: a serving fleet that operates at a high fraction of its ideal hardware rate on average
          can still violate latency targets in the tail if batches are formed too aggressively. Similarly,
          statistical goodput evaluates progress per example rather than operations per second, so enlarging
          the global batch beyond the critical batch size can raise program goodput while reducing statistical
          goodput. Any quantitative efficiency claim must therefore state which goodput measure it reports,
          which denominator defines its boundary, and which time window it spans. The measurement contract
          of @sec-performance-engineering-measuring-goodput pins down the workload, boundary, and measurement
          window so that two goodput numbers can be compared fairly.'
