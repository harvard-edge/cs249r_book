  ownership_notes:
    - 'Reframed 2026-10-14/15 (vol2 flow pass, ownership audit D6-D8): the chapter is Fleet Efficiency and owns ML
      goodput. Moved out: Prefill-decode intensity and batch operating point and Precision engineering by regime to
      10_inference (absorbed into Prefill-decode interference and chunked prefill and Serving precision decision);
      Speculative decoding to 10_inference (secondary). Local optimization through a Fleet Law term merged into
      Composed re-profiled optimization; Efficiency frontier folded into Trading between goodput factors (D7).
      Fusion, tiled attention, and graph replay is a technical term only: Volume I teaches it and Appendix A recaps
      it (sec-appdx-dam-taxonomy-kernel-levers).'
    - 'Learning objectives (each states a first-order concept): (1) Explain how a job''s or fleet''s useful output
      decomposes into scheduling, runtime, and program goodput, with each loss charged to exactly one factor [ML
      goodput]; (2) Measure goodput under a reproducible contract and localize the lost factor from scheduler records,
      job timelines, and step traces [Reproducible measurement contract; Fleet profiling by hierarchy and sampling];
      (3) Attribute scheduling and runtime losses using the owners'' results, without re-deriving them [Scheduling
      goodput; Runtime goodput]; (4) Measure program goodput with MFU and MBU and find the Fleet Law term a fix must
      shorten [Program goodput]; (5) Select fleet-level program levers (compiler partitioning, overlap under contention, compilation)
      and recognize kernel-level levers by the term they shorten [secondary concepts]; (6) Evaluate a change that
      trades one factor against another by its effect on the product, and place the result on the efficiency frontier
      [Trading between goodput factors].'
