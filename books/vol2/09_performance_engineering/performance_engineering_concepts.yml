    relationships:
    - id: vol2.field.22
      source: vol2.reliability.recovery
      predicate: reduces
      target: vol2.goodput.runtime
      explanation: Time spent restoring execution reduces the useful fraction of allocated opportunity.
      conditions: Use the runtime-goodput accounting window; checkpoint cost and failure loss must not be
        double counted.
      status: draft
      evidence:
        section: sec-performance-engineering-runtime-goodput-counts
        quote: '- *Startup* spans the interval from gang completion to the first training step while processes
          launch, libraries load, collective communicators initialize, checkpoint weights load, and compilers
          warm up. Because scheduler logs timestamp gang completion and the job timeline timestamps the
          first step, startup is measured directly between those two records—which is why @sec-performance-engineering-scheduling-evidence
          requires the scheduler, rather than the first step, to mark allocation completion.

          - *Input waits* capture the time a retained step spends blocked on the data pipeline for its next
          batch, carved out of step duration per @sec-performance-engineering-goodput-boundaries.

          - *Synchronous checkpoint pauses* capture the intervals during which training halts while accelerators
          or hosts flush state to persistent storage.

          - *Failure recovery and rework* cover both the downtime from a fault through detection, relaunch,
          state reload, and warmup, and the held time spent earlier on post-checkpoint steps that the failure
          erased and the job had to repeat.

          - *Forced preemption and planned reconfiguration* charge the post-checkpoint work discarded by
          an eviction, the subsequent reload after readmission, and the warmup before steady-state step
          times return, along with planned maintenance drains or elastic resizes. All of these belong to
          runtime goodput because the job held a complete allocation while the discarded or non-step hours
          were spent.'
    - id: vol2.field.26
      source: vol2.scheduling.gang
      predicate: affects
      target: vol2.goodput.scheduling
      explanation: Waiting for a complete worker set changes how much fleet opportunity reaches the workload.
      conditions: Evaluate allocation efficiency and waiting time over the same measurement window.
      status: draft
      evidence:
        section: sec-performance-engineering-scheduling-goodput-counts
        quote: 'A rigid distributed training job holding half of its requested accelerators while waiting
          for the rest completes zero steps, not half as many, yet a naive utilization counter credits every
          assigned device as busy. Scheduling goodput eliminates that distortion by taking the ratio of
          two capacity-time integrals over the same calendar window. The denominator is the in-service capacity-time
          offered by the pool: its allocatable accelerators multiplied by the window duration. The numerator
          is the all-allocated capacity-time held by complete allocations, summed across jobs as each job''s
          device count multiplied by the interval from the moment its minimum gang became complete until
          release. A complete allocation corresponds to the minimum viable execution group of @sec-fleet-orchestration-gang-scheduling—every
          accelerator, interconnect domain, and co-scheduled host resource required to execute one synchronous
          step. For a rigid job, that group is the full requested gang; for an elastic job, it is the active
          gang size between two reconfiguration boundaries, and any accelerators the job relinquishes re-enter
          the numerator only when another complete allocation claims them. Because nothing inside the allocation
          enters this ratio, a wedged job that holds a complete gang without running a step achieves the
          same scheduling goodput as a job executing at peak FLOP/s.'
