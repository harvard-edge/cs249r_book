    - id: vol2.field.50
      source: vol2.training.critical-batch
      predicate: bounds gains in
      target: vol2.goodput.statistical
      explanation: A larger global batch can improve program execution rate while reducing progress per
        processed example.
      conditions: Compare learning progress at the same target quality and account for optimizer and workload
