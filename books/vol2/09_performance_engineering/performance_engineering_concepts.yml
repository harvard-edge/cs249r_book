  claims:
    MFU: MFU = useful model FLOPs / (N x R_peak x T_step) counts only the arithmetic the model requires, so a fleet
      can show 90 percent hardware utilization at 30 percent MFU, with HFU adding recomputation and MBU as the decode-time
      bandwidth counterpart.
    Reproducible measurement contract: An optimization claim is valid only against a fixed contract (workload and
      quality gate, system state, timing boundary, load-generation mode, repeated trials with tails), and a closed-loop
      load generator suppresses arrivals during a stall and hides overload.
    Fleet profiling by hierarchy and sampling: Trace volume grows with device count, so fleets detect degradation
      with cheap always-on metrics and then capture short targeted traces from ranks chosen to test a hypothesis,
      or sample kernels statistically.
    Local optimization through a Fleet Law term: 'A local optimization reaches the fleet only through the Fleet
      Law term it shortens: fusion, precision, and compilation shrink local compute, overlap enlarges T_overlap
      only up to T_comm, and the fleet gain is diluted by the terms it does not touch.'
    Prefill-decode intensity and batch operating point: Decode arithmetic intensity grows roughly linearly with
      batch while prefill sits far above the ridge, so batching buys a large cost-per-token cut for a small step-time
      penalty until KV-cache capacity stops it, and the two phases want different hardware.
    Composed re-profiled optimization: Speedups do not add, because each optimization shrinks only its own interval
      of the critical-path budget, so the order of optimizations is set by the measured limit and the step is re-profiled
      after each one.
    Efficiency frontier: The target of performance work is a Pareto-optimal operating point over throughput, latency,
      cost per token, quality, and memory for a stated workload, so latency-oriented and throughput-oriented configurations
      of one replica are different frontier points.
    Precision engineering by regime: 'Block-wise scaling contains outliers at small metadata cost, and the roofline
      regime picks the format: weight-only low-bit formats attack bandwidth-bound decode while weight-activation
      FP8 raises the compute ceiling for prefill and large batches.'
    Tensor-parallel collectives under contention: In a tensor-parallel replica the per-layer activation AllReduces
      are launch- and protocol-bound at small batch, so a faster link barely helps, and communication streams contend
      with compute for the same SMs and memory.
    Fusion, tiled attention, and graph replay: Unfused kernels write and reread intermediates through HBM and pay
      microseconds of launch each, so fusion, tiled attention with an online softmax, and graph replay attack bytes
      and dispatch rather than FLOPs.
    Graph compilation amortization: A graph compiler removes dispatch and intermediate traffic only across captured
      regions, and deeper compilation pays back only after enough replays before the model version or shape distribution
      changes.
    Speculative decoding: A draft model proposes K tokens that the target verifies in one pass while preserving
      its distribution, so the gain depends on acceptance rate, draft cost, and spare compute, and it vanishes as
      batching consumes decode's compute headroom.
