<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="27pt" viewBox="0 0 180 54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Iron-law trio, terms in equation order D | C | L; batch-one decode: data term dominates (~87%), C and L thin slivers labeled above -->
