  <rect x="154" y="19" width="11" height="30" fill="#D9D9D9"/>
  <rect x="165" y="19" width="11" height="30" fill="#D9D9D9"/>
  <line x1="154" y1="19" x2="154" y2="49" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="165" y1="19" x2="165" y2="49" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="79" y="39" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">D</text>
  <text x="159.5" y="14" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">C</text>
