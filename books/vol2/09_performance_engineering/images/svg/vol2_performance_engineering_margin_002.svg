<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="97pt" viewBox="0 0 180 194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Roofline thumbnail, log-log, 45-degree memory slope; ridge ~295 FLOP/byte (H100 FP16).
       B=1 (~1 FLOP/byte) and B=256 (~256 FLOP/byte) both sit on the memory-bound slope, B=256 just left of the ridge. -->
  <rect width="180" height="194" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="4.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>
  <line x1="4" y1="4" x2="4" y2="190" stroke="#CCCCCC" stroke-width="1.3"/>
  <line x1="4" y1="190" x2="176" y2="190" stroke="#CCCCCC" stroke-width="1.3"/>
  <line x1="148" y1="30" x2="148" y2="190" stroke="#CCCCCC" stroke-width="1.3" stroke-dasharray="5,2.2"/>
  <line x1="4" y1="174" x2="148" y2="30" stroke="#006395" stroke-width="3.4"/>
  <line x1="148" y1="30" x2="176" y2="30" stroke="#E67817" stroke-width="3.4"/>
  <line x1="50" y1="110" x2="104" y2="56" stroke="#555555" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-gray)"/>
  <circle cx="34" cy="144" r="5.2" fill="#333333"/>
  <circle cx="140" cy="38" r="5.2" fill="#333333"/>
  <text x="29" y="131" font-size="14" fill="#006395" text-anchor="end">B=1</text>
  <text x="130" y="33" font-size="14" fill="#006395" text-anchor="end">B=256</text>
</svg>
