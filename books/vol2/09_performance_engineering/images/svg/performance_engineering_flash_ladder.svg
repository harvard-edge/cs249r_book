<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="109pt" viewBox="0 0 180 218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Two-rung HBM-traffic ladder on a log scale. Values from FlashAttentionSavings:
       naive 34.9 GB, flash 536.9 MB, savings ratio ~65x. Bar lengths are log10 to scale
       (shared floor); the dimension line spans the log distance between the two bar ends.
       Memory magnitude drawn in the base-contract memory hue (#006395). -->
  <rect width="180" height="218" fill="#FFFFFF"/>
  <defs>
    <marker id="dim-end" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L5,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="3.6" y="6" width="149.6" height="79" fill="#006395"/>
  <text x="148" y="50" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">Naive 34.9 GB</text>
  <rect x="3.6" y="126" width="27" height="79" fill="#006395"/>
  <text x="38" y="170" font-size="13" fill="#333333">Flash 536.9 MB</text>
  <line x1="30.6" y1="126" x2="30.6" y2="99" stroke="#777777" stroke-width="0.9"/>
  <line x1="153.2" y1="85" x2="153.2" y2="111" stroke="#777777" stroke-width="0.9"/>
  <line x1="33" y1="105" x2="150.8" y2="105" stroke="#333333" stroke-width="1.1" marker-start="url(#dim-end)" marker-end="url(#dim-end)"/>
  <rect x="70" y="96" width="44" height="18" fill="#FFFFFF"/>
  <text x="92" y="109.5" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">≈65×</text>
  <text x="176" y="200" font-size="12" fill="#777777" text-anchor="end">log scale</text>
  <line x1="3" y1="214" x2="177" y2="214" stroke="#CCCCCC" stroke-width="1.3"/>
</svg>
