<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- One step of three kernels and one collective, on a compute stream and a communication stream.
       (a) serialized: the collective runs after the kernels and is exposed.
       (b) overlapped on an idle device: the collective runs under the kernels at no cost to them.
       (c) overlapped on a shared device: the collective's own kernels take SMs and memory bandwidth,
           so the kernel beside it runs longer (red), and the step ends between (a) and (b).
       Blue = compute (C1), amber = communication (C2), red = time lost to contention.
       Durations are schematic, not measured. -->
  <style>
    .pt { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .ln { font-size: 12px; fill: #475569; }
    .cb { font-size: 12px; font-weight: 700; fill: #b45309; }
    .rd { font-size: 12px; font-weight: 700; fill: #b91c1c; }
    .gd { font-size: 12px; fill: #475569; }
  </style>
  <rect width="680" height="352" fill="#ffffff"/>

  <!-- ===== reference guides (drawn first, behind the lanes) ===== -->
  <line x1="470" y1="40" x2="470" y2="318" stroke="#94a3b8" stroke-width="1" stroke-dasharray="1,2"/>
  <line x1="570" y1="40" x2="570" y2="318" stroke="#94a3b8" stroke-width="1" stroke-dasharray="1,2"/>
  <text x="462" y="334" text-anchor="end" class="gd">ideal overlap end</text>
  <text x="578" y="334" class="gd">serialized end</text>

  <!-- ===== (a) serialized ===== -->
  <text x="170" y="34" class="pt">(a) serialized</text>
  <text x="156" y="61" text-anchor="end" class="ln">compute</text>
  <text x="156" y="93" text-anchor="end" class="ln">comm</text>
  <rect x="170" y="44" width="96" height="26" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="270" y="44" width="96" height="26" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="370" y="44" width="96" height="26" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="470" y="76" width="100" height="26" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="520" y="93" text-anchor="middle" class="cb">exposed</text>
  <line x1="570" y1="40" x2="570" y2="106" stroke="#334155" stroke-width="2"/>

  <!-- ===== (b) overlapped, idle device ===== -->
  <text x="170" y="134" class="pt">(b) overlapped, no contention</text>
  <text x="156" y="161" text-anchor="end" class="ln">compute</text>
  <text x="156" y="193" text-anchor="end" class="ln">comm</text>
  <rect x="170" y="144" width="96" height="26" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="270" y="144" width="96" height="26" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="370" y="144" width="96" height="26" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="280" y="176" width="100" height="26" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="330" y="193" text-anchor="middle" class="cb">hidden</text>
  <line x1="470" y1="140" x2="470" y2="206" stroke="#334155" stroke-width="2"/>

  <!-- ===== (c) overlapped, shared device ===== -->
  <text x="170" y="234" class="pt">(c) overlapped, shared device</text>
  <text x="156" y="261" text-anchor="end" class="ln">compute</text>
  <text x="156" y="293" text-anchor="end" class="ln">comm</text>
  <rect x="170" y="244" width="96" height="26" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="270" y="244" width="96" height="26" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="366" y="244" width="30" height="26" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="400" y="244" width="96" height="26" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="280" y="276" width="100" height="26" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="330" y="293" text-anchor="middle" class="cb">hidden</text>
  <text x="386" y="293" class="rd">contention</text>
  <line x1="500" y1="240" x2="500" y2="306" stroke="#334155" stroke-width="2"/>
</svg>
