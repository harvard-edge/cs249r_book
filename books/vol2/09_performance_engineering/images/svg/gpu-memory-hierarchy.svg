<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 405" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-down" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .layer-title { font-size: 11px; font-weight: 700; }
    .layer-metric { font-size: 9px; fill: #475569; }
    .layer-role { font-size: 8.5px; fill: #64748b; font-style: italic; }
    .badge-text { font-size: 8px; font-weight: 700; }
    .axis-label { font-size: 9px; font-weight: 700; }
    .axis-sub { font-size: 8px; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== Left-side capacity axis ===== -->
  <text x="50" y="30" text-anchor="middle" class="axis-label" fill="#475569">Capacity</text>
  <text x="50" y="42" text-anchor="middle" class="axis-sub" fill="#64748b">grows 2,400×</text>
  <line x1="50" y1="52" x2="50" y2="350" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-down)"/>

  <!-- ===== Right-side energy cost axis ===== -->
  <text x="630" y="30" text-anchor="middle" class="axis-label" fill="#dc2626">Access Energy</text>
  <text x="630" y="42" text-anchor="middle" class="axis-sub" fill="#b91c1c">grows 1,280×</text>
  <line x1="630" y1="52" x2="630" y2="350" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <!-- ===== Layer 1: Registers ===== -->
  <!-- Width: 320px (centered at 340) -->
  <rect x="180" y="25" width="320" height="66" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="340" y="45" text-anchor="middle" class="layer-title" fill="#14294E">Registers (RF)</text>
  <text x="340" y="62" text-anchor="middle" class="layer-metric">~33 MB total · ~1 cycle latency · ~0.01 pJ per access</text>
  <text x="340" y="78" text-anchor="middle" class="layer-role">Private per thread · Unlimited bandwidth (in-register execution)</text>
  <!-- Fast Badge -->
  <rect x="520" y="38" width="80" height="20" rx="2" fill="#1F407A"/>
  <text x="560" y="52" text-anchor="middle" class="badge-text" fill="#ffffff">~0.01 pJ</text>

  <!-- Down arrow 1 -> 2 -->
  <line x1="340" y1="91" x2="340" y2="110" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-down)"/>

  <!-- ===== Layer 2: L1 / Shared SRAM ===== -->
  <!-- Width: 400px (centered at 340) -->
  <rect x="140" y="110" width="400" height="66" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="340" y="130" text-anchor="middle" class="layer-title" fill="#14294E">L1 Cache / Shared Memory (SRAM)</text>
  <text x="340" y="147" text-anchor="middle" class="layer-metric">~228 KB/SM · 20–30 cycles latency (~20 ns) · ~0.5 pJ per access</text>
  <text x="340" y="163" text-anchor="middle" class="layer-role">Shared within thread block · Primary arena for operator fusion &amp; tiling</text>
  <!-- Energy badge -->
  <rect x="520" y="123" width="80" height="20" rx="2" fill="#1F407A"/>
  <text x="560" y="137" text-anchor="middle" class="badge-text" fill="#ffffff">~0.5 pJ (1×)</text>

  <!-- Down arrow 2 -> 3 -->
  <line x1="340" y1="176" x2="340" y2="195" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-down)"/>

  <!-- ===== Layer 3: L2 Cache ===== -->
  <!-- Width: 480px (centered at 340) -->
  <rect x="100" y="195" width="480" height="66" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="215" text-anchor="middle" class="layer-title" fill="#0f172a">L2 Cache</text>
  <text x="340" y="232" text-anchor="middle" class="layer-metric">~50 MB on H100 · ~200 cycles latency (~130 ns) · ~20 pJ per access</text>
  <text x="340" y="248" text-anchor="middle" class="layer-role">Chip-wide shared buffer · Hardware-managed automatic reuse across SMs</text>
  <!-- Energy badge -->
  <rect x="520" y="208" width="80" height="20" rx="2" fill="#d97706"/>
  <text x="560" y="222" text-anchor="middle" class="badge-text" fill="#ffffff">~20 pJ (40×)</text>

  <!-- Down arrow 3 -> 4 -->
  <line x1="340" y1="261" x2="340" y2="280" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-down)"/>

  <!-- ===== Layer 4: HBM ===== -->
  <!-- Width: 560px (centered at 340) -->
  <rect x="60" y="280" width="560" height="74" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="302" text-anchor="middle" class="layer-title" fill="#15803d">High Bandwidth Memory (HBM3)</text>
  <text x="340" y="321" text-anchor="middle" class="layer-metric">80 GB capacity · 3.35 TB/s peak bandwidth · ~300 ns latency</text>
  <text x="340" y="339" text-anchor="middle" class="layer-role">Off-chip stacked DRAM · ~640 pJ per 64-byte transaction · Primary model weight store</text>
  <!-- Energy badge (bottleneck red) -->
  <rect x="520" y="297" width="80" height="20" rx="2" fill="#dc2626"/>
  <text x="560" y="311" text-anchor="middle" class="badge-text" fill="#ffffff">640 pJ (1,280×)</text>

  <!-- Width annotation badge -->
  <rect x="180" y="368" width="320" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="340" y="382" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">
    Pyramid width indicates relative capacity (33 MB RF → 80 GB HBM3)
  </text>
</svg>
