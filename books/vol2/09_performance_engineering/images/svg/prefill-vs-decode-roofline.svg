<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 375" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#334155"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .panel-title { font-size: 12px; font-weight: 700; fill: #0f172a; }
    .panel-badge { font-size: 9px; font-weight: 700; }
    .axis-label { font-size: 8.5px; fill: #475569; }
    .tick-label { font-size: 7.5px; fill: #64748b; }
    .roof-label { font-size: 8px; font-weight: 700; }
    .card-title { font-size: 8.5px; font-weight: 700; }
    .card-sub { font-size: 8px; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== Vertical Divider ===== -->
  <line x1="340" y1="20" x2="340" y2="380" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- ====================================================================== -->
  <!-- LEFT PANEL: Prefill (Compute-Bound)                                    -->
  <!-- ====================================================================== -->
  <text x="180" y="32" text-anchor="middle" class="panel-title">Prefill Phase</text>
  <rect x="135" y="42" width="90" height="20" rx="3" fill="#EAF1F8" stroke="#7dd3fc" stroke-width="1"/>
  <text x="180" y="55" text-anchor="middle" class="panel-badge" fill="#14294E">Compute-Bound</text>

  <!-- Left axes -->
  <line x1="50" y1="330" x2="50" y2="75" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="50" y1="330" x2="315" y2="330" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="180" y="350" text-anchor="middle" class="axis-label">Arithmetic Intensity (FLOP/byte) →</text>
  <text x="25" y="200" text-anchor="middle" class="axis-label" transform="rotate(-90 25 200)">Achievable Throughput (TFLOP/s)</text>

  <!-- Left tick marks -->
  <text x="44" y="333" text-anchor="end" class="tick-label">0</text>
  <text x="44" y="303" text-anchor="end" class="tick-label">low</text>
  <text x="44" y="153" text-anchor="end" class="tick-label">peak</text>

  <!-- Left roofline: memory-bound slope -->
  <line x1="50" y1="330" x2="180" y2="150" stroke="#dc2626" stroke-width="2.2"/>
  <!-- Left roofline: compute ceiling -->
  <line x1="180" y1="150" x2="310" y2="150" stroke="#1F407A" stroke-width="2.2"/>

  <!-- Ridge point left -->
  <circle cx="180" cy="150" r="4" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
  <text x="180" y="140" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">Ridge ~300</text>

  <!-- Ceiling labels left -->
  <text x="80" y="285" text-anchor="middle" class="roof-label" fill="#dc2626" transform="rotate(-38 80 285)">HBM BW ceiling</text>
  <text x="250" y="142" text-anchor="middle" class="roof-label" fill="#1F407A">Compute ceiling</text>

  <!-- Prefill workload dot — on compute ceiling (right of ridge) -->
  <line x1="260" y1="150" x2="260" y2="330" stroke="#1F407A" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="260" cy="150" r="7" fill="#1F407A" stroke="#ffffff" stroke-width="2"/>
  
  <rect x="220" y="98" width="80" height="30" rx="3" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="260" y="112" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">Prefill Point</text>
  <text x="260" y="122" text-anchor="middle" font-size="7.5" fill="#64748b">AI ≈ 1,024 FLOP/B</text>

  <!-- Left annotation box -->
  <rect x="55" y="165" width="135" height="60" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="122" y="182" text-anchor="middle" class="card-title" fill="#14294E">Compute-Limited</text>
  <text x="122" y="196" text-anchor="middle" class="card-sub" fill="#1F407A">Tensor Cores saturated.</text>
  <text x="122" y="208" text-anchor="middle" class="card-sub" fill="#475569">Benefit: FP8 Tensor Cores,</text>
  <text x="122" y="219" text-anchor="middle" class="card-sub" fill="#475569">FlashAttention-2 tiling.</text>

  <!-- ====================================================================== -->
  <!-- RIGHT PANEL: Decode (Memory-Bound)                                     -->
  <!-- ====================================================================== -->
  <text x="500" y="32" text-anchor="middle" class="panel-title">Decode Phase</text>
  <rect x="455" y="42" width="90" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="500" y="55" text-anchor="middle" class="panel-badge" fill="#b91c1c">Memory-Bound</text>

  <!-- Right axes -->
  <line x1="370" y1="330" x2="370" y2="75" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="370" y1="330" x2="635" y2="330" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="500" y="350" text-anchor="middle" class="axis-label">Arithmetic Intensity (FLOP/byte) →</text>

  <!-- Right tick marks -->
  <text x="364" y="333" text-anchor="end" class="tick-label">0</text>
  <text x="364" y="303" text-anchor="end" class="tick-label">low</text>
  <text x="364" y="153" text-anchor="end" class="tick-label">peak</text>

  <!-- Right roofline: memory-bound slope -->
  <line x1="370" y1="330" x2="500" y2="150" stroke="#dc2626" stroke-width="2.2"/>
  <!-- Right roofline: compute ceiling -->
  <line x1="500" y1="150" x2="630" y2="150" stroke="#1F407A" stroke-width="2.2"/>

  <!-- Ridge point right -->
  <circle cx="500" cy="150" r="4" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
  <text x="500" y="140" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">Ridge ~300</text>

  <!-- Ceiling labels right -->
  <text x="420" y="255" text-anchor="middle" class="roof-label" fill="#dc2626" transform="rotate(-38 420 255)">HBM BW ceiling</text>
  <text x="570" y="142" text-anchor="middle" class="roof-label" fill="#1F407A">Compute ceiling</text>

  <!-- Decode workload dot — memory-bound region (left of ridge) -->
  <circle cx="395" cy="295" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <line x1="395" y1="295" x2="395" y2="330" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  
  <rect x="405" y="280" width="80" height="28" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="445" y="293" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">Decode Point</text>
  <text x="445" y="303" text-anchor="middle" font-size="7.5" fill="#64748b">AI ≈ 1 FLOP/B</text>

  <!-- Gap arrow showing severe underutilization of compute -->
  <line x1="395" y1="155" x2="395" y2="285" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>
  <rect x="365" y="200" width="60" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="395" y="211" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">Compute Idle</text>
  <text x="395" y="221" text-anchor="middle" font-size="7" fill="#7f1d1d">HBM-starved</text>

  <!-- Right annotation box -->
  <rect x="490" y="195" width="135" height="60" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="557" y="212" text-anchor="middle" class="card-title" fill="#b91c1c">Memory-BW Limited</text>
  <text x="557" y="226" text-anchor="middle" class="card-sub" fill="#dc2626">Weights streamed per token.</text>
  <text x="557" y="238" text-anchor="middle" class="card-sub" fill="#475569">Benefit: INT4 weights,</text>
  <text x="557" y="249" text-anchor="middle" class="card-sub" fill="#475569">INT8 KV cache, spec dec.</text>

</svg>
