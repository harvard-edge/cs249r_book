<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#d97706"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .node-title { font-size: 9.5px; font-weight: 700; }
    .node-sub { font-size: 8px; }
    .card-title { font-size: 10px; font-weight: 700; }
    .card-sub { font-size: 7.5px; }
    .tech-lbl { font-size: 7.8px; font-weight: 500; }
    .gain-title { font-size: 8px; font-weight: 700; }
    .gain-sub { font-size: 7px; }
    .branch-lbl { font-size: 8px; font-weight: 700; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- ROOT: Profile & Classify Bottleneck                                    -->
  <!-- ====================================================================== -->
  <!-- Step 1: Profile -->
  <rect x="250" y="12" width="240" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="370" y="26" text-anchor="middle" class="node-title" fill="#0f172a">1. Profile Target Workload</text>
  <text x="370" y="38" text-anchor="middle" class="node-sub" fill="#64748b">Nsight Systems · PyTorch Profiler · PyTorch Kineto</text>

  <!-- Arrow down -->
  <path d="M 370,46 L 370,58" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>

  <!-- Step 2: Bottleneck Decision -->
  <rect x="235" y="60" width="270" height="34" rx="4" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="370" y="74" text-anchor="middle" class="node-title" fill="#14294E">2. Identify Dominant Constraint</text>
  <text x="370" y="86" text-anchor="middle" class="node-sub" fill="#475569">Evaluate Roofline placement: MBU vs. MFU vs. Comm Stalls</text>

  <!-- ====================================================================== -->
  <!-- BRANCH ROUTING ARROWS                                                  -->
  <!-- ====================================================================== -->
  <!-- Left Branch (Memory Bound) -->
  <path d="M 300,94 L 300,106 L 130,106 L 130,118" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <rect x="170" y="98" width="80" height="15" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
  <text x="210" y="109" text-anchor="middle" class="branch-lbl" fill="#15803d">High MBU, Low MFU</text>

  <!-- Center Branch (Compute Bound) -->
  <path d="M 370,94 L 370,118" fill="none" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <rect x="330" y="98" width="80" height="15" rx="2" fill="#EAF1F8" stroke="#7dd3fc" stroke-width="0.8"/>
  <text x="370" y="109" text-anchor="middle" class="branch-lbl" fill="#14294E">High MFU (Ceiling)</text>

  <!-- Right Branch (Communication Bound) -->
  <path d="M 440,94 L 440,106 L 610,106 L 610,118" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-amber)"/>
  <rect x="490" y="98" width="80" height="15" rx="2" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="530" y="109" text-anchor="middle" class="branch-lbl" fill="#b45309">NCCL Sync Stalls</text>

  <!-- ====================================================================== -->
  <!-- PILLAR 1: MEMORY-BOUND PLAYBOOK                                        -->
  <!-- ====================================================================== -->
  <rect x="20" y="122" width="220" height="280" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Card Header -->
  <rect x="28" y="130" width="204" height="32" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="130" y="144" text-anchor="middle" class="card-title" fill="#15803d">Memory-Bound Workload</text>
  <text x="130" y="155" text-anchor="middle" class="card-sub" fill="#166534">Objective: Minimize off-chip HBM traffic</text>

  <!-- Techniques -->
  <g transform="translate(28, 170)">
    <!-- Tech 1 -->
    <rect x="0" y="0" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="11" r="2.5" fill="#16a34a"/>
    <text x="16" y="14" class="tech-lbl" fill="#0f172a">Operator Fusion (FlashAttention)</text>

    <!-- Tech 2 -->
    <rect x="0" y="26" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="37" r="2.5" fill="#16a34a"/>
    <text x="16" y="40" class="tech-lbl" fill="#0f172a">FP8 / INT4 Quantization (AWQ/GPTQ)</text>

    <!-- Tech 3 -->
    <rect x="0" y="52" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="63" r="2.5" fill="#16a34a"/>
    <text x="16" y="66" class="tech-lbl" fill="#0f172a">PagedAttention &amp; Chunked Prefill</text>

    <!-- Tech 4 -->
    <rect x="0" y="78" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="89" r="2.5" fill="#16a34a"/>
    <text x="16" y="92" class="tech-lbl" fill="#0f172a">Batch Expansion (Increase Intensity)</text>

    <!-- Tech 5 -->
    <rect x="0" y="104" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="115" r="2.5" fill="#16a34a"/>
    <text x="16" y="118" class="tech-lbl" fill="#0f172a">Selective Activation Checkpointing</text>
  </g>

  <!-- Expected Speedup Badge -->
  <rect x="28" y="306" width="204" height="34" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="130" y="321" text-anchor="middle" class="gain-title" fill="#15803d">Typical Speedup: 2.0× – 5.0×</text>
  <text x="130" y="333" text-anchor="middle" class="gain-sub" fill="#166534">Reduces byte transfers; uncaps execution speed</text>

  <!-- Canonical Example -->
  <rect x="28" y="348" width="204" height="44" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="36" y="363" font-size="7.5" font-weight="700" fill="#334155">Primary Examples:</text>
  <text x="36" y="375" font-size="7" fill="#64748b">LLM Token Generation (Decode phase)</text>
  <text x="36" y="385" font-size="7" fill="#64748b">LayerNorm, Softmax, Pointwise activations</text>

  <!-- ====================================================================== -->
  <!-- PILLAR 2: COMPUTE-BOUND PLAYBOOK                                       -->
  <!-- ====================================================================== -->
  <rect x="260" y="122" width="220" height="280" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Card Header -->
  <rect x="268" y="130" width="204" height="32" rx="2" fill="#EAF1F8" stroke="#7dd3fc" stroke-width="1"/>
  <text x="370" y="144" text-anchor="middle" class="card-title" fill="#14294E">Compute-Bound Workload</text>
  <text x="370" y="155" text-anchor="middle" class="card-sub" fill="#1F407A">Objective: Reduce arithmetic operations</text>

  <!-- Techniques -->
  <g transform="translate(268, 170)">
    <!-- Tech 1 -->
    <rect x="0" y="0" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="11" r="2.5" fill="#1F407A"/>
    <text x="16" y="14" class="tech-lbl" fill="#0f172a">FP8 / FP4 Tensor Core Math</text>

    <!-- Tech 2 -->
    <rect x="0" y="26" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="37" r="2.5" fill="#1F407A"/>
    <text x="16" y="40" class="tech-lbl" fill="#0f172a">Speculative Decoding (Draft-Verify)</text>

    <!-- Tech 3 -->
    <rect x="0" y="52" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="63" r="2.5" fill="#1F407A"/>
    <text x="16" y="66" class="tech-lbl" fill="#0f172a">Sparse Mixture of Experts (MoE)</text>

    <!-- Tech 4 -->
    <rect x="0" y="78" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="89" r="2.5" fill="#1F407A"/>
    <text x="16" y="92" class="tech-lbl" fill="#0f172a">Low-Rank Adaptation / Distillation</text>

    <!-- Tech 5 -->
    <rect x="0" y="104" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="115" r="2.5" fill="#1F407A"/>
    <text x="16" y="118" class="tech-lbl" fill="#0f172a">torch.compile Autotuned Kernels</text>
  </g>

  <!-- Expected Speedup Badge -->
  <rect x="268" y="306" width="204" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="370" y="321" text-anchor="middle" class="gain-title" fill="#14294E">Typical Speedup: 1.4× – 2.5×</text>
  <text x="370" y="333" text-anchor="middle" class="gain-sub" fill="#1F407A">Lowers FLOP count per output token</text>

  <!-- Canonical Example -->
  <rect x="268" y="348" width="204" height="44" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="276" y="363" font-size="7.5" font-weight="700" fill="#334155">Primary Examples:</text>
  <text x="276" y="375" font-size="7" fill="#64748b">LLM Context Encoding (Prefill phase)</text>
  <text x="276" y="385" font-size="7" fill="#64748b">Large Batch GEMM, CNN Convolutions</text>

  <!-- ====================================================================== -->
  <!-- PILLAR 3: COMMUNICATION-BOUND PLAYBOOK                                  -->
  <!-- ====================================================================== -->
  <rect x="500" y="122" width="220" height="280" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Card Header -->
  <rect x="508" y="130" width="204" height="32" rx="2" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="610" y="144" text-anchor="middle" class="card-title" fill="#b45309">Communication Bound</text>
  <text x="610" y="155" text-anchor="middle" class="card-sub" fill="#92400e">Objective: Overlap or compress collectives</text>

  <!-- Techniques -->
  <g transform="translate(508, 170)">
    <!-- Tech 1 -->
    <rect x="0" y="0" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="11" r="2.5" fill="#d97706"/>
    <text x="16" y="14" class="tech-lbl" fill="#0f172a">Compute-Comm Overlap (FSDP / DDP)</text>

    <!-- Tech 2 -->
    <rect x="0" y="26" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="37" r="2.5" fill="#d97706"/>
    <text x="16" y="40" class="tech-lbl" fill="#0f172a">FP8 Collective Quantization</text>

    <!-- Tech 3 -->
    <rect x="0" y="52" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="63" r="2.5" fill="#d97706"/>
    <text x="16" y="66" class="tech-lbl" fill="#0f172a">Topology Mapping (NVLink vs. RoCE)</text>

    <!-- Tech 4 -->
    <rect x="0" y="78" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="89" r="2.5" fill="#d97706"/>
    <text x="16" y="92" class="tech-lbl" fill="#0f172a">Interleaved 1F1B Pipeline Schedules</text>

    <!-- Tech 5 -->
    <rect x="0" y="104" width="204" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="8" cy="115" r="2.5" fill="#d97706"/>
    <text x="16" y="118" class="tech-lbl" fill="#0f172a">RingAttention / Sequence Parallel</text>
  </g>

  <!-- Expected Speedup Badge -->
  <rect x="508" y="306" width="204" height="34" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="610" y="321" text-anchor="middle" class="gain-title" fill="#b45309">Typical Speedup: 1.2× – 1.8×</text>
  <text x="610" y="333" text-anchor="middle" class="gain-sub" fill="#92400e">Hides latency behind compute windows</text>

  <!-- Canonical Example -->
  <rect x="508" y="348" width="204" height="44" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="516" y="363" font-size="7.5" font-weight="700" fill="#334155">Primary Examples:</text>
  <text x="516" y="375" font-size="7" fill="#64748b">Large-Scale Distributed Training</text>
  <text x="516" y="385" font-size="7" fill="#64748b">Tensor Parallel AllReduce across nodes</text>

  <!-- ===== Bottom Footnote ===== -->
  <text x="370" y="428" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    Optimization Law: Alleviating one bottleneck invariably exposes the next. System tuning is an iterative loop of profiling and intervention.
  </text>
</svg>