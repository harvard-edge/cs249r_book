  <path d="M230,60 V88" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="140" y="90" width="180" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="230" y="112" text-anchor="middle" class="t" fill="#0f172a" style="fill:#0f172a">GPU util &lt; 70%?</text>
  <text x="230" y="129" text-anchor="middle" class="s" style="fill:#334155">Nsight / nvidia-smi</text>
  <path d="M230,140 V178" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="242" y="165" text-anchor="start" class="yn">no</text>
  <rect x="400" y="90" width="150" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="475" y="112" text-anchor="middle" class="t" fill="#0f172a" style="fill:#0f172a">I/O bound?</text>
  <text x="475" y="129" text-anchor="middle" class="s" style="fill:#334155">DataLoader stalls</text>
  <path d="M320,115 H398" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="359" y="107" text-anchor="middle" class="yn">yes</text>
  <rect x="610" y="90" width="170" height="50" rx="3" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="695" y="112" text-anchor="middle" class="t" fill="#00602e" style="fill:#00602e">More DL workers</text>
  <text x="695" y="129" text-anchor="middle" class="s" style="fill:#00602e">GDS / NVMe</text>
  <path d="M550,115 H608" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="579" y="107" text-anchor="middle" class="yn">yes</text>
  <rect x="400" y="180" width="150" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="475" y="202" text-anchor="middle" class="t" fill="#0f172a" style="fill:#0f172a">CPU bound?</text>
  <text x="475" y="219" text-anchor="middle" class="s" style="fill:#334155">preprocessing</text>
  <path d="M475,140 V178" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="487" y="165" text-anchor="start" class="yn">no</text>
  <rect x="610" y="180" width="170" height="50" rx="3" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="695" y="202" text-anchor="middle" class="t" fill="#00602e" style="fill:#00602e">Offload preproc.</text>
  <text x="695" y="219" text-anchor="middle" class="s" style="fill:#00602e">DALI / async</text>
  <path d="M550,205 H608" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="579" y="197" text-anchor="middle" class="yn">yes</text>
  <rect x="400" y="270" width="150" height="50" rx="3" fill="#E6D4E5" stroke="#7E317B" stroke-width="1.2"/>
  <text x="475" y="292" text-anchor="middle" class="t" fill="#5c2259" style="fill:#5c2259">Comm overhead</text>
  <text x="475" y="309" text-anchor="middle" class="s" style="fill:#5c2259">overlap / compress</text>
  <path d="M475,230 V268" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="487" y="255" text-anchor="start" class="yn">no</text>
  <path d="M105,550 V572 M285,550 V572 M475,320 V572 M695,230 V572 M780,115 H798 V572" fill="none" stroke="#64748b" stroke-width="1.3"/>
  <path d="M105,572 H798" fill="none" stroke="#64748b" stroke-width="1.3"/>
  <path d="M400,572 V588" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="320" y="590" width="160" height="40" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
  <text x="400" y="615" text-anchor="middle" class="t" style="fill:#0f172a">Re-profile workload</text>
  <path d="M320,610 H10 V40 H148" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="26" y="604" class="loop">iterate until the target is met</text>
</svg>
