<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 0 834 650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 14.5px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 13.5px; fill: #334155; }
    .yn { font-size: 13.5px; font-weight: 700; fill: #475569; }
    .loop { font-size: 13.5px; font-style: italic; fill: #64748b; }
    .ax { font-size: 13px; fill: #475569; }
  </style>
  <rect x="-14" width="834" height="650" fill="#ffffff"/>
  <!-- ===== Kernel regime: the roofline as the decision ===== -->
  <rect x="20" y="180" width="350" height="220" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="36" y="204" class="t">Intensity &gt; ridge?</text>
  <text x="36" y="222" class="s">roofline placement</text>
  <path d="M50,370 L50,345 L200,262 L200,370 Z" fill="#D1E6F3" stroke="none"/>
  <rect x="200" y="262" width="140" height="108" fill="#FCE4CC" stroke="none"/>
  <path d="M50,370 H352 M50,370 V236" fill="none" stroke="#475569" stroke-width="1"/>
  <path d="M50,345 L200,262" fill="none" stroke="#006395" stroke-width="2.2"/>
  <path d="M200,262 H340" fill="none" stroke="#E67817" stroke-width="2.2"/>
  <path d="M200,267 V370" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="3,2"/>
  <circle cx="200" cy="262" r="4" fill="#333333"/>
  <text x="200" y="386" text-anchor="middle" class="ax">ridge</text>
  <text x="352" y="386" text-anchor="end" class="ax">intensity</text>
  <text x="128" y="358" text-anchor="middle" class="t" style="fill:#004a70">Memory-bound</text>
  <text x="270" y="324" text-anchor="middle" class="t" style="fill:#9a4a00">Compute-bound</text>
  <rect x="20" y="420" width="170" height="130" rx="4" fill="#E3F1F8" stroke="#006395" stroke-width="1.2"/>
  <rect x="32" y="432" width="146" height="50" rx="3" fill="#ffffff" stroke="#006395" stroke-width="1.2"/>
  <text x="105" y="454" text-anchor="middle" class="t" fill="#004a70" style="fill:#004a70">Operator fusion</text>
  <text x="105" y="471" text-anchor="middle" class="s" style="fill:#004a70">FlashAttention</text>
  <rect x="32" y="490" width="146" height="50" rx="3" fill="#ffffff" stroke="#006395" stroke-width="1.2"/>
  <text x="105" y="512" text-anchor="middle" class="t" fill="#004a70" style="fill:#004a70">INT4 / speculative</text>
  <text x="105" y="529" text-anchor="middle" class="s" style="fill:#004a70">fewer bytes/token</text>
  <rect x="200" y="420" width="170" height="130" rx="4" fill="#FDF0E2" stroke="#E67817" stroke-width="1.2"/>
  <rect x="212" y="432" width="146" height="50" rx="3" fill="#ffffff" stroke="#E67817" stroke-width="1.2"/>
  <text x="285" y="454" text-anchor="middle" class="t" fill="#9a4a00" style="fill:#9a4a00">FP8 math</text>
  <text x="285" y="471" text-anchor="middle" class="s" style="fill:#9a4a00">precision</text>
  <rect x="212" y="490" width="146" height="50" rx="3" fill="#ffffff" stroke="#E67817" stroke-width="1.2"/>
  <text x="285" y="512" text-anchor="middle" class="t" fill="#9a4a00" style="fill:#9a4a00">MoE routing</text>
  <text x="285" y="529" text-anchor="middle" class="s" style="fill:#9a4a00">less work</text>
  <path d="M105,400 V418" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M285,400 V418" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="150" y="20" width="160" height="40" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
