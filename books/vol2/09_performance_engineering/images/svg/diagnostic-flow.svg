<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-neutral" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .label-bold { font-size: 11px; font-weight: 700; }
    .label-sub { font-size: 9px; }
    .badge-text { font-size: 8.5px; font-weight: 700; letter-spacing: 0.5px; }
    .yes-text { font-size: 9.5px; font-weight: 700; fill: #16a34a; }
    .no-text { font-size: 9.5px; font-weight: 700; fill: #dc2626; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- START NODE -->
  <rect x="360" y="20" width="180" height="42" rx="4" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/>
  <text x="450" y="45" text-anchor="middle" class="label-bold" fill="#ffffff">Training is slow</text>

  <!-- Arrow Start -> D1 -->
  <line x1="450" y1="62" x2="450" y2="100" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-neutral)"/>

  <!-- DECISION 1: GPU utilization < 70%? -->
  <rect x="375" y="100" width="150" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="450" y="118" text-anchor="middle" class="label-bold" fill="#0f172a">GPU util &lt; 70%?</text>
  <text x="450" y="133" text-anchor="middle" class="label-sub" fill="#64748b">(Nsight / nvidia-smi)</text>

  <!-- D1 -> D2 (Yes) -->
  <line x1="525" y1="122" x2="560" y2="122" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="542" y="115" text-anchor="middle" class="yes-text">Yes</text>

  <!-- D1 -> D4 (No) -->
  <line x1="450" y1="144" x2="450" y2="200" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="460" y="172" text-anchor="start" class="no-text">No</text>

  <!-- DECISION 2: I/O bound? -->
  <rect x="560" y="100" width="140" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="630" y="118" text-anchor="middle" class="label-bold" fill="#0f172a">I/O bound?</text>
  <text x="630" y="133" text-anchor="middle" class="label-sub" fill="#64748b">(DataLoader stall)</text>

  <!-- D2 -> Action DL (Yes) -->
  <path d="M 700,122 L 810,122 L 810,148" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="755" y="115" text-anchor="middle" class="yes-text">Yes</text>

  <!-- D2 -> D3 (No) -->
  <line x1="630" y1="144" x2="630" y2="200" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="640" y="172" text-anchor="start" class="no-text">No</text>

  <!-- ACTION: Increase DataLoader workers (Storage/IO green) -->
  <rect x="735" y="148" width="150" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="810" y="165" text-anchor="middle" class="label-bold" fill="#15803d">More DL workers</text>
  <text x="810" y="180" text-anchor="middle" class="label-sub" fill="#166534">Use GDS / NVMe</text>

  <!-- DECISION 3: CPU bound? -->
  <rect x="560" y="200" width="140" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="630" y="218" text-anchor="middle" class="label-bold" fill="#0f172a">CPU bound?</text>
  <text x="630" y="233" text-anchor="middle" class="label-sub" fill="#64748b">(preprocessing)</text>

  <!-- D3 -> Action Offload (Yes) -->
  <path d="M 700,222 L 810,222 L 810,248" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="755" y="215" text-anchor="middle" class="yes-text">Yes</text>

  <!-- D3 -> Action Comm (No) -->
  <line x1="630" y1="244" x2="630" y2="298" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="640" y="272" text-anchor="start" class="no-text">No</text>

  <!-- ACTION: Offload preprocessing (Compute blue) -->
  <rect x="735" y="248" width="150" height="44" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="810" y="265" text-anchor="middle" class="label-bold" fill="#14294E">Offload to GPU</text>
  <text x="810" y="280" text-anchor="middle" class="label-sub" fill="#1F407A">DALI / async preproc</text>

  <!-- ACTION: Communication overhead (Comm amber C2) -->
  <rect x="555" y="298" width="150" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="630" y="315" text-anchor="middle" class="label-bold" fill="#b45309">Comm overhead</text>
  <text x="630" y="330" text-anchor="middle" class="label-sub" fill="#92400e">Overlap / compress</text>

  <!-- DECISION 4: Arithmetic Intensity > Ridge? -->
  <rect x="375" y="200" width="150" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="450" y="218" text-anchor="middle" class="label-bold" fill="#0f172a">AI &gt; ridge point?</text>
  <text x="450" y="233" text-anchor="middle" class="label-sub" fill="#64748b">(Roofline analysis)</text>

  <!-- D4 -> Compute Label (Yes) -->
  <line x1="375" y1="222" x2="282" y2="222" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="330" y="215" text-anchor="middle" class="yes-text">Yes</text>

  <!-- LABEL: COMPUTE BOUND (Compute Blue) -->
  <rect x="120" y="200" width="160" height="44" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="200" y="227" text-anchor="middle" class="label-bold" fill="#14294E" letter-spacing="0.5">COMPUTE BOUND</text>

  <!-- Compute Label -> Actions -->
  <path d="M 175,244 L 175,264 L 130,264 L 130,283" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-neutral)"/>
  <path d="M 225,244 L 225,264 L 270,264 L 270,283" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-neutral)"/>

  <!-- ACTION: Precision engineering -->
  <rect x="60" y="285" width="140" height="44" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="130" y="302" text-anchor="middle" class="label-bold" fill="#14294E">FP8 / INT4</text>
  <text x="130" y="317" text-anchor="middle" class="label-sub" fill="#1F407A">Precision eng.</text>

  <!-- ACTION: Algorithmic -->
  <rect x="200" y="285" width="140" height="44" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="270" y="302" text-anchor="middle" class="label-bold" fill="#14294E">MoE / Speculative</text>
  <text x="270" y="317" text-anchor="middle" class="label-sub" fill="#1F407A">Algorithmic opt.</text>

  <!-- D4 -> Memory Label (No) -->
  <line x1="450" y1="244" x2="450" y2="298" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="460" y="272" text-anchor="start" class="no-text">No</text>

  <!-- LABEL: MEMORY BOUND (Bottleneck Red) -->
  <rect x="370" y="300" width="160" height="44" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="327" text-anchor="middle" class="label-bold" fill="#b91c1c" letter-spacing="0.5">MEMORY BOUND</text>

  <!-- Memory Label -> Actions -->
  <path d="M 425,344 L 425,364 L 370,364 L 370,383" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-neutral)"/>
  <path d="M 475,344 L 475,364 L 530,364 L 530,383" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-neutral)"/>

  <!-- ACTION: Operator fusion -->
  <rect x="300" y="385" width="140" height="44" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="370" y="402" text-anchor="middle" class="label-bold" fill="#b91c1c">Operator fusion</text>
  <text x="370" y="417" text-anchor="middle" class="label-sub" fill="#dc2626">FlashAttention</text>

  <!-- ACTION: torch.compile (Coordination C3 purple) -->
  <rect x="460" y="385" width="140" height="44" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="530" y="402" text-anchor="middle" class="label-bold" fill="#6d28d9">torch.compile</text>
  <text x="530" y="417" text-anchor="middle" class="label-sub" fill="#7c3aed">Graph compilation</text>

  <!-- Re-profile Loop Base -->
  <rect x="360" y="470" width="180" height="42" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="450" y="496" text-anchor="middle" class="label-bold" fill="#0f172a">Re-profile Workload</text>

  <!-- Routing Actions down to Re-profile Buses -->
  <!-- Left Bus (FP8, MoE) -->
  <line x1="270" y1="329" x2="270" y2="445" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 130,329 L 130,445 L 420,445 L 420,468" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-neutral)"/>
  
  <!-- Right Bus (DL workers, Offload, Comm) -->
  <line x1="810" y1="292" x2="810" y2="445" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="630" y1="342" x2="630" y2="445" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 885,170 L 905,170 L 905,445 L 480,445 L 480,468" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-neutral)"/>

  <!-- Center Bus (Fusion, Compile) -->
  <path d="M 370,429 L 370,445 L 530,445 L 530,429" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="450" y1="445" x2="450" y2="468" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-neutral)"/>

  <!-- Iteration Return Loop -->
  <path d="M 360,491 L 45,491 L 45,41 L 358,41" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-neutral)"/>
  <text x="35" y="260" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic" transform="rotate(-90, 35, 260)">iterate until target met</text>

</svg>