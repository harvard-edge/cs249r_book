<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    .region-header { font-size: 10.5px; font-weight: 700; }
    .matrix-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .matrix-dim { font-size: 9.5px; fill: #64748b; }
    .tile-text { font-size: 9.5px; font-weight: 700; fill: #14294E; }
    .tile-box-title { font-size: 9.5px; font-weight: 700; }
    .tile-box-sub { font-size: 8.5px; }
    .transfer-badge { font-size: 9px; font-weight: 700; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- HBM REGION (Off-Chip Memory)                                           -->
  <!-- ====================================================================== -->
  <rect x="25" y="14" width="670" height="186" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="35" y="22" width="375" height="20" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="45" y="37" class="region-header" fill="#15803d">HBM (off-chip, 3.35 TB/s)</text>

  <!-- Q Matrix -->
  <rect x="42" y="52" width="95" height="136" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="42" y="52" width="95" height="28" rx="3" fill="#d6e2f0" stroke="#1F407A" stroke-width="1.2"/>
  <text x="89.5" y="72" text-anchor="middle" class="tile-text">Queries</text>
  <text x="89.5" y="115" text-anchor="middle" class="matrix-title">Q</text>
  <text x="89.5" y="131" text-anchor="middle" class="matrix-dim">S × d</text>
  
  <!-- K Matrix -->
  <rect x="152" y="52" width="95" height="136" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="152" y="52" width="95" height="28" rx="3" fill="#d6e2f0" stroke="#1F407A" stroke-width="1.2"/>
  <text x="199.5" y="72" text-anchor="middle" class="tile-text">Keys</text>
  <text x="199.5" y="115" text-anchor="middle" class="matrix-title">K</text>
  <text x="199.5" y="131" text-anchor="middle" class="matrix-dim">S × d</text>
  
  <!-- V Matrix -->
  <rect x="262" y="52" width="95" height="136" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="262" y="52" width="95" height="28" rx="3" fill="#d6e2f0" stroke="#1F407A" stroke-width="1.2"/>
  <text x="309.5" y="72" text-anchor="middle" class="tile-text">Values</text>
  <text x="309.5" y="115" text-anchor="middle" class="matrix-title">V</text>
  <text x="309.5" y="131" text-anchor="middle" class="matrix-dim">S × d</text>
  
  <!-- Crossed-out Naive S×S Attention Matrix -->
  <rect x="372" y="52" width="155" height="136" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="378" y1="58" x2="521" y2="182" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="521" y1="58" x2="378" y2="182" stroke="#dc2626" stroke-width="2.5"/>
  
  <rect x="384" y="64" width="131" height="38" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="449.5" y="79" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">A = QKᵀ (S × S)</text>
  <text x="449.5" y="93" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">NEVER MATERIALIZED</text>

  <rect x="384" y="138" width="131" height="34" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="449.5" y="152" text-anchor="middle" font-size="8.5" fill="#7f1d1d">Naive FP16 score matrix:</text>
  <text x="449.5" y="163" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">134 MB per head at S = 8,192</text>

  <!-- Output Y Matrix -->
  <rect x="542" y="52" width="140" height="136" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="542" y="52" width="140" height="28" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="612" y="72" text-anchor="middle" class="tile-text" style="fill:#15803d">Output</text>
  <text x="612" y="115" text-anchor="middle" class="matrix-title" fill="#15803d">Y</text>
  <text x="612" y="131" text-anchor="middle" class="matrix-dim" fill="#166534">S × d</text>
  
  <!-- ====================================================================== -->
  <!-- DATA MOVEMENT ARROWS (Between HBM and SRAM)                            -->
  <!-- ====================================================================== -->
  <!-- Load Q -->
  <path d="M 89.5,188 L 89.5,248" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="57" y="209" width="65" height="16" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <text x="89.5" y="221" text-anchor="middle" class="transfer-badge" fill="#14294E">Load Q<tspan dy="2.5" font-size="7">i</tspan><tspan dy="-2.5"></tspan></text>

  <!-- Load K -->
  <path d="M 199.5,188 L 199.5,248" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="167" y="209" width="65" height="16" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <text x="199.5" y="221" text-anchor="middle" class="transfer-badge" fill="#14294E">Load K<tspan dy="2.5" font-size="7">j</tspan><tspan dy="-2.5"></tspan></text>

  <!-- Load V -->
  <path d="M 309.5,188 L 309.5,248" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="277" y="209" width="65" height="16" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <text x="309.5" y="221" text-anchor="middle" class="transfer-badge" fill="#14294E">Load V<tspan dy="2.5" font-size="7">j</tspan><tspan dy="-2.5"></tspan></text>

  <!-- Write partial Y back to HBM -->
  <path d="M 612,254 L 612,194" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="577" y="209" width="70" height="16" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="612" y="221" text-anchor="middle" class="transfer-badge" fill="#15803d">Write Y<tspan dy="2.5" font-size="7">i</tspan><tspan dy="-2.5"></tspan></text>

  <!-- ====================================================================== -->
  <!-- SRAM REGION (On-Chip Shared Memory)                                    -->
  <!-- ====================================================================== -->
  <rect x="25" y="254" width="670" height="102" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="35" y="262" width="375" height="20" rx="2" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="45" y="277" class="region-header" fill="#14294E">SRAM / shared memory (on-chip, ~228 KB per SM)</text>

  <!-- SRAM Tile 1: Q tile -->
  <rect x="42" y="290" width="95" height="48" rx="3" fill="#d6e2f0" stroke="#1F407A" stroke-width="1.2"/>
  <text x="89.5" y="310" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">Q tile</text>
  <text x="89.5" y="324" text-anchor="middle" font-size="8.5" fill="#1F407A">T<tspan dy="2.5" font-size="7">r</tspan><tspan dy="-2.5" dx="3">× d</tspan></text>

  <!-- SRAM Tile 2: K tile -->
  <rect x="152" y="290" width="95" height="48" rx="3" fill="#d6e2f0" stroke="#1F407A" stroke-width="1.2"/>
  <text x="199.5" y="310" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">K tile</text>
  <text x="199.5" y="324" text-anchor="middle" font-size="8.5" fill="#1F407A">T<tspan dy="2.5" font-size="7">c</tspan><tspan dy="-2.5" dx="3">× d</tspan></text>

  <!-- SRAM Tile 3: V tile -->
  <rect x="262" y="290" width="95" height="48" rx="3" fill="#d6e2f0" stroke="#1F407A" stroke-width="1.2"/>
  <text x="309.5" y="310" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">V tile</text>
  <text x="309.5" y="324" text-anchor="middle" font-size="8.5" fill="#1F407A">T<tspan dy="2.5" font-size="7">c</tspan><tspan dy="-2.5" dx="3">× d</tspan></text>

  <!-- SRAM Tile 4: Score tile computed in SRAM -->
  <rect x="372" y="290" width="155" height="48" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="449.5" y="307" text-anchor="middle" class="tile-box-title" fill="#14294E">Score tile S<tspan dy="2.5" font-size="7">ij</tspan><tspan dy="-2.5"></tspan> = Q<tspan dy="2.5" font-size="7">i</tspan><tspan dy="-2.5"></tspan> K<tspan dy="2.5" font-size="7">j</tspan><tspan dy="-2.5"></tspan><tspan dy="-4" font-size="7">T</tspan></text>
  <text x="449.5" y="319" text-anchor="middle" class="tile-box-sub" fill="#1F407A">computed on chip</text>
  <text x="449.5" y="329" text-anchor="middle" class="tile-box-sub" fill="#64748b">never written to HBM</text>

  <!-- SRAM Tile 5: Online Softmax -->
  <rect x="542" y="290" width="140" height="48" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="612" y="307" text-anchor="middle" class="tile-box-title" fill="#b45309">Online softmax</text>
  <text x="612" y="319" text-anchor="middle" class="tile-box-sub" fill="#92400e">running max and sum</text>
  <text x="612" y="329" text-anchor="middle" class="tile-box-sub" fill="#78350f">rescale, accumulate Y<tspan dy="2.5" font-size="7">i</tspan><tspan dy="-2.5"></tspan></text>
</svg>
