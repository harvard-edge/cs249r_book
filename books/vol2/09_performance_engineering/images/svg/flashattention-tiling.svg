<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#006395"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#008F45"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E67817"/>
    </marker>
  </defs>
  <style>
    .hd { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .hs { font-size: 13px; fill: #475569; }
    .m { font-size: 15px; font-weight: 700; font-style: italic; fill: #0f172a; }
    .chip { font-size: 13px; font-weight: 700; font-style: italic; fill: #ffffff; }
    .lab { font-size: 13px; fill: #475569; }
    .bx { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .bs { font-size: 12.5px; fill: #475569; }
    .red { font-size: 13px; font-weight: 700; fill: #CB202D; }
    .reds { font-size: 12.5px; fill: #9b1822; }
    .sub { font-size: 12px; font-style: italic; }
  </style>
  <rect width="760" height="480" fill="#ffffff"/>

  <!-- ===== HBM: operands in place, scores never materialized ===== -->
  <rect x="20" y="20" width="440" height="440" rx="4" fill="#E3F1F8" stroke="#006395" stroke-width="1.2"/>
  <text x="36" y="44" class="hd">HBM</text>
  <text x="76" y="44" class="hs">off chip, 3.35 TB/s</text>

  <!-- K transpose strip: column blocks j -->
  <text x="100" y="99" text-anchor="end" class="m">K<tspan dy="-6" font-size="12" font-style="normal">T</tspan></text>
  <rect x="110" y="76" width="240" height="30" rx="0" fill="#ffffff" stroke="#006395" stroke-width="1.2"/>
  <path d="M150,76 V106 M190,76 V106 M230,76 V106 M270,76 V106 M310,76 V106" stroke="#006395" stroke-width="0.8"/>
  <rect x="190" y="76" width="40" height="30" rx="0" fill="#006395" stroke="#006395" stroke-width="1.2"/>
  <text x="210" y="96" text-anchor="middle" class="chip">K<tspan class="sub" dy="3">j</tspan></text>

  <!-- Q strip: row blocks i -->
  <text x="65" y="118" text-anchor="middle" class="m">Q</text>
  <rect x="50" y="126" width="30" height="240" rx="0" fill="#ffffff" stroke="#006395" stroke-width="1.2"/>
  <path d="M50,166 H80 M50,206 H80 M50,246 H80 M50,286 H80 M50,326 H80" stroke="#006395" stroke-width="0.8"/>
  <rect x="50" y="166" width="30" height="40" rx="0" fill="#006395" stroke="#006395" stroke-width="1.2"/>
  <text x="65" y="191" text-anchor="middle" class="chip">Q<tspan class="sub" dy="3">i</tspan></text>

  <!-- S x S score grid: dashed red, never written -->
  <path d="M150,126 V366 M190,126 V366 M230,126 V366 M270,126 V366 M310,126 V366 M110,166 H350 M110,206 H350 M110,246 H350 M110,286 H350 M110,326 H350" stroke="#CB202D" stroke-width="0.8" stroke-opacity="0.45" stroke-dasharray="3,2"/>
  <rect x="110" y="126" width="240" height="240" rx="0" fill="none" stroke="#CB202D" stroke-width="1.2" stroke-dasharray="5,3"/>
  <!-- row i: tiles already consumed, the live tile, and the sweep ahead -->
  <rect x="110" y="166" width="80" height="40" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <path d="M150,166 V206" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="190" y="166" width="40" height="40" rx="0" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <text x="210" y="191" text-anchor="middle" class="m" font-size="13">S<tspan class="sub" dy="3">ij</tspan></text>
  <path d="M236,186 H342" fill="none" stroke="#E67817" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <!-- label on a backing card -->
  <rect x="130" y="276" width="200" height="54" rx="3" fill="#ffffff" stroke="none"/>
  <text x="230" y="298" text-anchor="middle" class="red"><tspan font-style="italic">S</tspan> × <tspan font-style="italic">S</tspan> scores never written</text>
  <text x="230" y="318" text-anchor="middle" class="reds">134 MB per head at <tspan font-style="italic">S</tspan> = 8,192</text>

  <!-- O strip: row blocks i, written back -->
  <text x="395" y="118" text-anchor="middle" class="m">O</text>
  <rect x="380" y="126" width="30" height="240" rx="0" fill="#ffffff" stroke="#006395" stroke-width="1.2"/>
  <path d="M380,166 H410 M380,206 H410 M380,246 H410 M380,286 H410 M380,326 H410" stroke="#006395" stroke-width="0.8"/>
  <rect x="380" y="166" width="30" height="40" rx="0" fill="#D4EFDF" stroke="#008F45" stroke-width="1.5"/>
  <text x="395" y="191" text-anchor="middle" class="m" font-size="13">O<tspan class="sub" dy="3">i</tspan></text>

  <!-- V strip: blocks j, aligned with the key columns -->
  <text x="100" y="411" text-anchor="end" class="m">V</text>
  <rect x="110" y="390" width="240" height="30" rx="0" fill="#ffffff" stroke="#006395" stroke-width="1.2"/>
  <path d="M150,390 V420 M190,390 V420 M230,390 V420 M270,390 V420 M310,390 V420" stroke="#006395" stroke-width="0.8"/>
  <rect x="190" y="390" width="40" height="30" rx="0" fill="#006395" stroke="#006395" stroke-width="1.2"/>
  <text x="210" y="410" text-anchor="middle" class="chip">V<tspan class="sub" dy="3">j</tspan></text>
  <text x="230" y="444" text-anchor="middle" class="lab"><tspan font-style="italic">Q</tspan>, <tspan font-style="italic">K</tspan>, <tspan font-style="italic">V</tspan>, <tspan font-style="italic">O</tspan> are each <tspan font-style="italic">S</tspan> × <tspan font-style="italic">d</tspan></text>

  <!-- ===== Transfers across the chip boundary ===== -->
  <path d="M460,110 H558" fill="none" stroke="#006395" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="510" y="100" text-anchor="middle" class="lab">load</text>
  <text x="510" y="130" text-anchor="middle" class="lab" font-style="italic">Q<tspan class="sub" dy="3">i</tspan><tspan dy="-3" font-style="normal">,</tspan><tspan dx="4">K</tspan><tspan class="sub" dy="3">j</tspan><tspan dy="-3" font-style="normal">,</tspan><tspan dx="4">V</tspan><tspan class="sub" dy="3">j</tspan></text>
  <text x="510" y="390" text-anchor="middle" class="lab" fill="#008F45">write <tspan font-style="italic">O</tspan><tspan class="sub" dy="3">i</tspan></text>

  <!-- ===== SRAM: what is resident at one time ===== -->
  <rect x="560" y="20" width="180" height="440" rx="4" fill="#ffffff" stroke="#006395" stroke-width="1.5"/>
  <!-- write O_i drawn after the SRAM panel so it visibly leaves the accumulator -->
  <path d="M580,400 H462" fill="none" stroke="#008F45" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="576" y="44" class="hd">SRAM</text>
  <text x="576" y="62" class="hs">on chip, ~228 KB per SM</text>

  <rect x="580" y="90" width="40" height="40" rx="0" fill="#006395" stroke="#006395" stroke-width="1.2"/>
  <text x="600" y="115" text-anchor="middle" class="chip">Q<tspan class="sub" dy="3">i</tspan></text>
  <rect x="630" y="90" width="40" height="40" rx="0" fill="#006395" stroke="#006395" stroke-width="1.2"/>
  <text x="650" y="115" text-anchor="middle" class="chip">K<tspan class="sub" dy="3">j</tspan></text>
  <rect x="680" y="90" width="40" height="40" rx="0" fill="#006395" stroke="#006395" stroke-width="1.2"/>
  <text x="700" y="115" text-anchor="middle" class="chip">V<tspan class="sub" dy="3">j</tspan></text>

  <path d="M600,130 V150 H650" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M650,130 V168" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="580" y="170" width="140" height="50" rx="2" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <text x="650" y="192" text-anchor="middle" class="bx">score tile</text>
  <text x="650" y="210" text-anchor="middle" class="bs" font-style="italic">S<tspan class="sub" dy="3">ij</tspan><tspan dy="-3" dx="3" font-style="normal">=</tspan><tspan dx="3">Q</tspan><tspan class="sub" dy="3">i</tspan><tspan dy="-3" dx="2">K</tspan><tspan class="sub" dy="3">j</tspan><tspan dy="-9" font-size="12" font-style="normal">T</tspan></text>

  <path d="M650,220 V258" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="580" y="260" width="140" height="50" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="650" y="282" text-anchor="middle" class="bx">online softmax</text>
  <text x="650" y="300" text-anchor="middle" class="bs">running max, sum</text>

  <path d="M650,310 V358" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M700,130 V150 H730 V385 H722" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="580" y="360" width="140" height="50" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.5"/>
  <text x="650" y="382" text-anchor="middle" class="bx">accumulate <tspan font-style="italic">O</tspan><tspan class="sub" dy="3">i</tspan></text>
  <text x="650" y="400" text-anchor="middle" class="bs">rescaled each step</text>
</svg>
