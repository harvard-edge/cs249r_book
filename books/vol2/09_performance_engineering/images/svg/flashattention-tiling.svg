<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .region-header { font-size: 9.5px; font-weight: 700; }
    .matrix-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .matrix-dim { font-size: 8px; fill: #64748b; }
    .tile-text { font-size: 7.5px; font-weight: 700; fill: #ffffff; }
    .tile-box-title { font-size: 8.5px; font-weight: 700; }
    .tile-box-sub { font-size: 7.5px; }
    .transfer-badge { font-size: 7.5px; font-weight: 700; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- HBM REGION (Off-Chip Memory)                                           -->
  <!-- ====================================================================== -->
  <rect x="25" y="14" width="670" height="186" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="35" y="22" width="375" height="20" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="45" y="36" class="region-header" fill="#15803d">High Bandwidth Memory (Off-Chip HBM3 · 3.35 TB/s · ~640 pJ)</text>

  <!-- Q Matrix -->
  <rect x="42" y="52" width="95" height="136" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="42" y="52" width="95" height="32" rx="3" fill="#1F407A"/>
  <text x="89.5" y="72" text-anchor="middle" class="tile-text">Q tile (T_r × d)</text>
  <text x="89.5" y="115" text-anchor="middle" class="matrix-title">Q</text>
  <text x="89.5" y="131" text-anchor="middle" class="matrix-dim">S × d_model</text>
  <text x="89.5" y="143" text-anchor="middle" class="matrix-dim">(queries)</text>

  <!-- K Matrix -->
  <rect x="152" y="52" width="95" height="136" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="152" y="52" width="95" height="32" rx="3" fill="#1F407A"/>
  <text x="199.5" y="72" text-anchor="middle" class="tile-text">K tile (T_c × d)</text>
  <text x="199.5" y="115" text-anchor="middle" class="matrix-title">K</text>
  <text x="199.5" y="131" text-anchor="middle" class="matrix-dim">S × d_model</text>
  <text x="199.5" y="143" text-anchor="middle" class="matrix-dim">(keys)</text>

  <!-- V Matrix -->
  <rect x="262" y="52" width="95" height="136" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="262" y="52" width="95" height="32" rx="3" fill="#1F407A"/>
  <text x="309.5" y="72" text-anchor="middle" class="tile-text">V tile (T_c × d)</text>
  <text x="309.5" y="115" text-anchor="middle" class="matrix-title">V</text>
  <text x="309.5" y="131" text-anchor="middle" class="matrix-dim">S × d_model</text>
  <text x="309.5" y="143" text-anchor="middle" class="matrix-dim">(values)</text>

  <!-- Crossed-out Naive S×S Attention Matrix -->
  <rect x="372" y="52" width="155" height="136" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="378" y1="58" x2="521" y2="182" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="521" y1="58" x2="378" y2="182" stroke="#dc2626" stroke-width="2.5"/>
  
  <rect x="384" y="64" width="131" height="38" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="449.5" y="79" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">A = QKᵀ (S × S)</text>
  <text x="449.5" y="93" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">NEVER MATERIALIZED</text>

  <rect x="384" y="138" width="131" height="34" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="449.5" y="152" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Naive Attention Matrix:</text>
  <text x="449.5" y="163" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">128 MB/head at S=8K</text>

  <!-- Output Y Matrix -->
  <rect x="542" y="52" width="140" height="136" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="542" y="52" width="140" height="32" rx="3" fill="#16a34a"/>
  <text x="612" y="72" text-anchor="middle" class="tile-text">Accumulated Tile Y_i</text>
  <text x="612" y="115" text-anchor="middle" class="matrix-title" fill="#15803d">Y</text>
  <text x="612" y="131" text-anchor="middle" class="matrix-dim" fill="#166534">S × d_model</text>
  <text x="612" y="143" text-anchor="middle" class="matrix-dim" fill="#166534">(final output)</text>

  <!-- ====================================================================== -->
  <!-- DATA MOVEMENT ARROWS (Between HBM and SRAM)                            -->
  <!-- ====================================================================== -->
  <!-- Load Q -->
  <path d="M 89.5,188 L 89.5,248" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="62" y="209" width="55" height="16" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <text x="89.5" y="221" text-anchor="middle" class="transfer-badge" fill="#14294E">Load Q_i</text>

  <!-- Load K -->
  <path d="M 199.5,188 L 199.5,248" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="172" y="209" width="55" height="16" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <text x="199.5" y="221" text-anchor="middle" class="transfer-badge" fill="#14294E">Load K_j</text>

  <!-- Load V -->
  <path d="M 309.5,188 L 309.5,248" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="282" y="209" width="55" height="16" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <text x="309.5" y="221" text-anchor="middle" class="transfer-badge" fill="#14294E">Load V_j</text>

  <!-- Write partial Y back to HBM -->
  <path d="M 612,254 L 612,194" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="572" y="209" width="80" height="16" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="612" y="221" text-anchor="middle" class="transfer-badge" fill="#15803d">Write partial Y_i</text>

  <!-- ====================================================================== -->
  <!-- SRAM REGION (On-Chip Shared Memory)                                    -->
  <!-- ====================================================================== -->
  <rect x="25" y="254" width="670" height="122" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="35" y="262" width="375" height="20" rx="2" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="45" y="276" class="region-header" fill="#14294E">SRAM / Shared Memory (On-Chip SM · ~228 KB · ~0.5 pJ · ~20 ns)</text>

  <!-- SRAM Tile 1: Q tile -->
  <rect x="42" y="290" width="95" height="48" rx="3" fill="#1F407A"/>
  <text x="89.5" y="310" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Q tile in SRAM</text>
  <text x="89.5" y="324" text-anchor="middle" font-size="7" fill="#EAF1F8">T_r × d block</text>

  <!-- SRAM Tile 2: K tile -->
  <rect x="152" y="290" width="95" height="48" rx="3" fill="#1F407A"/>
  <text x="199.5" y="310" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">K tile in SRAM</text>
  <text x="199.5" y="324" text-anchor="middle" font-size="7" fill="#EAF1F8">T_c × d block</text>

  <!-- SRAM Tile 3: V tile -->
  <rect x="262" y="290" width="95" height="48" rx="3" fill="#1F407A"/>
  <text x="309.5" y="310" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">V tile in SRAM</text>
  <text x="309.5" y="324" text-anchor="middle" font-size="7" fill="#EAF1F8">T_c × d block</text>

  <!-- SRAM Tile 4: Score tile computed in SRAM -->
  <rect x="372" y="290" width="155" height="48" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="449.5" y="307" text-anchor="middle" class="tile-box-title" fill="#14294E">Tile S_ij = Q_i K_jᵀ</text>
  <text x="449.5" y="319" text-anchor="middle" class="tile-box-sub" fill="#1F407A">Computed in SRAM (T_r × T_c)</text>
  <text x="449.5" y="329" text-anchor="middle" class="tile-box-sub" fill="#64748b">(never written to HBM)</text>

  <!-- SRAM Tile 5: Online Softmax -->
  <rect x="542" y="290" width="140" height="48" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="612" y="307" text-anchor="middle" class="tile-box-title" fill="#b45309">Online Softmax</text>
  <text x="612" y="319" text-anchor="middle" class="tile-box-sub" fill="#92400e">Running max m, sum l</text>
  <text x="612" y="329" text-anchor="middle" class="tile-box-sub" fill="#78350f">Rescale &amp; accumulate Y_i</text>

  <!-- Description text inside SRAM container -->
  <text x="360" y="360" text-anchor="middle" font-size="8" fill="#1F407A">
    FlashAttention processes Q, K, V in T_r × T_c tiles · Online softmax mathematically produces exact results, not an approximation
  </text>

  <!-- ====================================================================== -->
  <!-- KEY PRINCIPLE CALLOUT CARD                                             -->
  <!-- ====================================================================== -->
  <rect x="25" y="388" width="670" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="405" font-size="9" font-weight="700" fill="#14294E">Key Algorithmic Principle: Tile-Based Online Softmax</text>
  <text x="40" y="418" font-size="8" fill="#334155">Load tiles into fast on-chip SRAM · Maintain running normalization statistics · Avoid all O(S²) HBM memory roundtrips</text>
  <rect x="522" y="396" width="163" height="24" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="603.5" y="411" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">O(S²) → O(S) HBM · 2–4× Speedup</text>
</svg>
