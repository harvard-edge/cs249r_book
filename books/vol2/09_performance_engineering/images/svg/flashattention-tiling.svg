<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="700" height="336" fill="#ffffff"/>
  <!-- ===== HBM (off-chip) ===== -->
  <rect x="10" y="10" width="680" height="136" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="24" y="30" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">HBM (off-chip, 3.35 TB/s)</text>
  <rect x="30" y="42" width="100" height="88" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="80" y="84" text-anchor="middle" font-size="18" font-weight="700" fill="#14294E">Q</text>
  <text x="80" y="104" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">S × d</text>
  <rect x="145" y="42" width="100" height="88" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="195" y="84" text-anchor="middle" font-size="18" font-weight="700" fill="#14294E">K</text>
  <text x="195" y="104" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">S × d</text>
  <rect x="260" y="42" width="100" height="88" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="310" y="84" text-anchor="middle" font-size="18" font-weight="700" fill="#14294E">V</text>
  <text x="310" y="104" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">S × d</text>
  <rect x="380" y="42" width="150" height="88" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="455" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">S × S scores</text>
  <text x="455" y="88" text-anchor="middle" font-size="13" font-weight="400" fill="#b91c1c">never written</text>
  <text x="455" y="112" text-anchor="middle" font-size="13" font-weight="400" fill="#7f1d1d">134 MB per head</text>
  <text x="455" y="126" text-anchor="middle" font-size="13" font-weight="400" fill="#7f1d1d">at S = 8,192</text>
  <rect x="560" y="42" width="110" height="88" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="615" y="84" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">O</text>
  <text x="615" y="104" text-anchor="middle" font-size="13" font-weight="400" fill="#166534">S × d</text>
  <!-- ===== SRAM (on-chip) ===== -->
  <rect x="10" y="194" width="680" height="132" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="24" y="316" text-anchor="start" font-size="13" font-weight="700" fill="#14294E">SRAM / shared memory (on-chip, ~228 KB per SM)</text>
  <rect x="30" y="220" width="100" height="64" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="80.0" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Q tile</text>
  <text x="80.0" y="266" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">T<tspan dy="3" font-size="11.5">r</tspan><tspan dy="-3" dx="3.5">× d</tspan></text>
  <rect x="145" y="220" width="100" height="64" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="195.0" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">K tile</text>
  <text x="195.0" y="266" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">T<tspan dy="3" font-size="11.5">c</tspan><tspan dy="-3" dx="3.5">× d</tspan></text>
  <rect x="260" y="220" width="100" height="64" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="310.0" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">V tile</text>
  <text x="310.0" y="266" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">T<tspan dy="3" font-size="11.5">c</tspan><tspan dy="-3" dx="3.5">× d</tspan></text>
  <rect x="380" y="220" width="150" height="64" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="455" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Score tile</text>
  <text x="455" y="266" text-anchor="middle" font-size="13" font-weight="400" fill="#334155"><tspan font-weight="700">S</tspan><tspan dy="3" font-size="11.5">ij</tspan><tspan dy="-3" dx="3.5">=</tspan><tspan dx="3.5" font-weight="700">Q</tspan><tspan dy="3" font-size="11.5">i</tspan><tspan dy="-3" dx="3.5" font-weight="700">K</tspan><tspan dy="3" font-size="11.5">j</tspan><tspan dy="-3">ᵀ</tspan></text>
  <rect x="546" y="220" width="134" height="64" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="613" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Online softmax</text>
  <text x="613" y="260" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">running max, sum</text>
  <text x="613" y="276" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">accumulate <tspan font-weight="700">O</tspan><tspan dy="3" font-size="11.5">i</tspan><tspan dy="-3">&#8201;</tspan></text>
  <!-- ===== Transfers ===== -->
  <line x1="80" y1="130" x2="80" y2="218" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="86" y="172" text-anchor="start" font-size="13" font-weight="400" fill="#14294E">load <tspan font-weight="700">Q</tspan><tspan dy="3" font-size="11.5">i</tspan><tspan dy="-3">&#8201;</tspan></text>
  <line x1="195" y1="130" x2="195" y2="218" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="201" y="172" text-anchor="start" font-size="13" font-weight="400" fill="#14294E">load <tspan font-weight="700">K</tspan><tspan dy="3" font-size="11.5">j</tspan><tspan dy="-3">&#8201;</tspan></text>
  <line x1="310" y1="130" x2="310" y2="218" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="316" y="172" text-anchor="start" font-size="13" font-weight="400" fill="#14294E">load <tspan font-weight="700">V</tspan><tspan dy="3" font-size="11.5">j</tspan><tspan dy="-3">&#8201;</tspan></text>
  <line x1="615" y1="220" x2="615" y2="132" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="621" y="172" text-anchor="start" font-size="13" font-weight="400" fill="#15803d">write <tspan font-weight="700">O</tspan><tspan dy="3" font-size="11.5">i</tspan><tspan dy="-3">&#8201;</tspan></text>
  <!-- Q and K tiles feed the score tile; V joins at the online softmax -->
  <path d="M 80 284 V 296 H 455 V 286" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <line x1="195" y1="284" x2="195" y2="296" stroke="#1F407A" stroke-width="1.2"/>
  <path d="M 340 220 V 207 H 590 V 218" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <line x1="530" y1="252" x2="544" y2="252" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
</svg>
