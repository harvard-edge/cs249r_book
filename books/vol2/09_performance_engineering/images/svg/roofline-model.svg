<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="100%" height="100%">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="#334155"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .axis-title { font-size: 11px; fill: #0f172a; font-weight: 600; }
    .tick-label { font-size: 9.5px; fill: #475569; }
    .region-label { font-size: 9px; font-weight: 700; letter-spacing: 0.8px; }
    .point-title { font-size: 9px; font-weight: 700; }
    .point-sub { font-size: 8px; fill: #64748b; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ── Regions ── -->
  <!-- Memory-bound region (left of ridge, bottleneck red/pink tint) -->
  <polygon points="80,316 558,74 558,340 80,340" fill="#fee2e2" fill-opacity="0.5"/>
  <!-- Compute-bound region (right of ridge, compute blue tint) -->
  <polygon points="558,74 610,74 610,340 558,340" fill="#e0f2fe" fill-opacity="0.55"/>

  <!-- ── Grid lines (Y: 0.1, 1, 10, 100, 1000) ── -->
  <line x1="80" y1="278" x2="610" y2="278" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="216" x2="610" y2="216" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="154" x2="610" y2="154" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="92" x2="610" y2="92" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Grid lines (X: 1, 8, 64, 512) -->
  <line x1="198" y1="55" x2="198" y2="340" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="315" y1="55" x2="315" y2="340" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="433" y1="55" x2="433" y2="340" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="558" y1="55" x2="558" y2="340" stroke="#f1f5f9" stroke-width="1"/>

  <!-- ── Roofline (memory slope + compute flat) ── -->
  <!-- Memory slope line (bottleneck red) -->
  <line x1="80" y1="317" x2="558" y2="74" stroke="#dc2626" stroke-width="2.5"/>
  <!-- Flat compute roof (compute blue) -->
  <line x1="558" y1="74" x2="610" y2="74" stroke="#0284c7" stroke-width="2.5"/>

  <!-- ── Ridge point ── -->
  <circle cx="558" cy="74" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
  <!-- vertical dashed drop -->
  <line x1="558" y1="74" x2="558" y2="340" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="536" y="344" width="44" height="16" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="558" y="356" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">~600</text>

  <!-- ── Axes ── -->
  <line x1="80" y1="340" x2="615" y2="340" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <line x1="80" y1="340" x2="80" y2="45" stroke="#334155" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- ── X ticks & labels (FLOP/byte) ── -->
  <line x1="80" y1="340" x2="80" y2="345" stroke="#334155" stroke-width="1"/>
  <line x1="198" y1="340" x2="198" y2="345" stroke="#334155" stroke-width="1"/>
  <line x1="315" y1="340" x2="315" y2="345" stroke="#334155" stroke-width="1"/>
  <line x1="433" y1="340" x2="433" y2="345" stroke="#334155" stroke-width="1"/>
  <line x1="558" y1="340" x2="558" y2="345" stroke="#334155" stroke-width="1"/>

  <text x="80" y="358" class="tick-label" text-anchor="middle">⅛</text>
  <text x="198" y="358" class="tick-label" text-anchor="middle">1</text>
  <text x="315" y="358" class="tick-label" text-anchor="middle">8</text>
  <text x="433" y="358" class="tick-label" text-anchor="middle">64</text>
  <text x="558" y="372" class="tick-label" text-anchor="middle">512</text>

  <!-- ── Y ticks & labels (TFLOP/s) ── -->
  <line x1="80" y1="340" x2="74" y2="340" stroke="#334155" stroke-width="1"/>
  <line x1="80" y1="278" x2="74" y2="278" stroke="#334155" stroke-width="1"/>
  <line x1="80" y1="216" x2="74" y2="216" stroke="#334155" stroke-width="1"/>
  <line x1="80" y1="154" x2="74" y2="154" stroke="#334155" stroke-width="1"/>
  <line x1="80" y1="92" x2="74" y2="92" stroke="#334155" stroke-width="1"/>
  <line x1="80" y1="74" x2="74" y2="74" stroke="#334155" stroke-width="1"/>

  <text x="70" y="343" class="tick-label" text-anchor="end">0.1</text>
  <text x="70" y="281" class="tick-label" text-anchor="end">1</text>
  <text x="70" y="219" class="tick-label" text-anchor="end">10</text>
  <text x="70" y="157" class="tick-label" text-anchor="end">100</text>
  <text x="70" y="95" class="tick-label" text-anchor="end">1,000</text>
  <text x="70" y="77" class="tick-label" font-weight="700" fill="#0284c7" text-anchor="end">2,000</text>

  <!-- ── Axis titles ── -->
  <text x="345" y="390" class="axis-title" text-anchor="middle">Arithmetic Intensity (FLOP/byte) → log scale</text>
  <text x="22" y="195" class="axis-title" text-anchor="middle" transform="rotate(-90,22,195)">Attainable Throughput (TFLOP/s) — log scale</text>

  <!-- ── Region labels ── -->
  <rect x="140" y="55" width="130" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="205" y="70" class="region-label" fill="#b91c1c" text-anchor="middle">MEMORY-BOUND</text>

  <rect x="520" y="28" width="130" height="22" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="585" y="43" class="region-label" fill="#0369a1" text-anchor="middle">COMPUTE-BOUND</text>

  <!-- Slope label (bandwidth) -->
  <text x="224" y="190" font-size="9" fill="#dc2626" font-weight="600" font-style="italic" transform="rotate(-27,224,190)">slope = 3.35 TB/s (HBM3 BW ceiling)</text>

  <!-- Roof label -->
  <text x="560" y="65" font-size="9" fill="#0284c7" text-anchor="end" font-weight="700">2,000 TFLOP/s FP8 Tensor Core ceiling</text>

  <!-- ── Workload points ── -->
  <!-- Workload: Autoregressive Decode (batch=1) — memory-bound -->
  <circle cx="178" cy="290" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="178" y1="290" x2="178" y2="316" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="115" y="254" width="70" height="28" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="150" y="267" class="point-title" fill="#b91c1c" text-anchor="middle">Decode</text>
  <text x="150" y="278" font-size="8" fill="#7f1d1d" text-anchor="middle">(batch=1)</text>

  <!-- Workload: LLM Prefill (long prompt) -->
  <circle cx="308" cy="210" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="308" y1="210" x2="308" y2="227" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="290" y="172" width="75" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="327" y="185" class="point-title" fill="#0f172a" text-anchor="middle">Prefill</text>
  <text x="327" y="196" font-size="8" fill="#64748b" text-anchor="middle">(long prompt)</text>

  <!-- Workload: Transformer Training (batch=512) -->
  <circle cx="395" cy="158" r="5.5" fill="#475569" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="405" y="138" width="95" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="452" y="151" class="point-title" fill="#0f172a" text-anchor="middle">Transformer</text>
  <text x="452" y="162" font-size="8" fill="#64748b" text-anchor="middle">train (B=512)</text>

  <!-- Workload: Convolution (ResNet, high AI) -->
  <circle cx="510" cy="96" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="480" y="106" width="85" height="28" rx="3" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="522" y="119" class="point-title" fill="#0369a1" text-anchor="middle">Conv training</text>
  <text x="522" y="130" font-size="8" fill="#0284c7" text-anchor="middle">(ResNet)</text>

  <!-- Ridge point label -->
  <rect x="568" y="78" width="105" height="18" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="90" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Ridge ≈ 600 FLOP/B</text>

  <!-- Efficiency gap annotations -->
  <line x1="178" y1="295" x2="178" y2="315" stroke="#94a3b8" stroke-width="1"/>
  <text x="145" y="318" font-size="8" fill="#64748b" font-style="italic">peak ≫ actual</text>

  <!-- ── Bottom note ── -->
  <text x="345" y="425" font-size="8.5" fill="#64748b" text-anchor="middle" font-style="italic">
    Reference: NVIDIA H100 SXM5 · 3.35 TB/s HBM3 bandwidth · 2,000 TFLOP/s FP8 Tensor Core ceiling
  </text>
</svg>
