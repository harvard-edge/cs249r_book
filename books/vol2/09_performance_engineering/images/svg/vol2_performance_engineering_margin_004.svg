<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="49pt" viewBox="0 0 180 98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- MFU on a shared 0-100% of-peak scale (outlined track = peak). Values from FleetEfficiencyCalc:
       local_mfu ~ 65% (8-GPU node), global_mfu ~ 48% (128-GPU fleet). Bars to scale. -->
  <rect width="180" height="98" fill="#FFFFFF"/>
  <text x="4" y="14" font-size="13" fill="#333333">8-GPU node</text>
  <rect x="4" y="20" width="172" height="24" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.2"/>
  <rect x="4" y="20" width="111.8" height="24" fill="#E67817"/>
  <text x="109" y="36.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">65%</text>
  <text x="4" y="64" font-size="13" fill="#333333">128-GPU fleet</text>
  <rect x="4" y="70" width="172" height="24" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.2"/>
  <rect x="4" y="70" width="82.6" height="24" fill="#E67817"/>
  <text x="80" y="86.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">48%</text>
</svg>
