<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="680" height="274" fill="#ffffff"/>

  <!-- ===== Time-saved guides (behind the lanes) ===== -->
  <line x1="326" y1="70" x2="326" y2="168" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="626" y1="70" x2="626" y2="168" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- ===== Standard decoding lane ===== -->
  <text x="20" y="44" font-size="13" font-weight="700" fill="#333">Standard</text>
  <text x="20" y="61" font-size="13" font-weight="700" fill="#333">decoding</text>
  <rect x="130" y="26" width="120" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="190" y="44" text-anchor="middle" font-size="13" fill="#333">Target model</text>
  <text x="190" y="61" text-anchor="middle" font-size="13" fill="#333">token <tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">1</tspan></text>
  <rect x="254" y="26" width="120" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="314" y="44" text-anchor="middle" font-size="13" fill="#333">Target model</text>
  <text x="314" y="61" text-anchor="middle" font-size="13" fill="#333">token <tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">2</tspan></text>
  <rect x="378" y="26" width="120" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="438" y="44" text-anchor="middle" font-size="13" fill="#333">Target model</text>
  <text x="438" y="61" text-anchor="middle" font-size="13" fill="#333">token <tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">3</tspan></text>
  <rect x="502" y="26" width="124" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="564" y="44" text-anchor="middle" font-size="13" fill="#333">Target model</text>
  <text x="564" y="61" text-anchor="middle" font-size="13" fill="#333">token <tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">4</tspan></text>

  <!-- ===== Speculative decoding lane ===== -->
  <text x="20" y="128" font-size="13" font-weight="700" fill="#333">Speculative</text>
  <text x="20" y="145" font-size="13" font-weight="700" fill="#333">decoding</text>
  <rect x="130" y="110" width="72" height="44" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="166" y="128" text-anchor="middle" font-size="13" fill="#333">Draft</text>
  <text x="166" y="145" text-anchor="middle" font-size="13" fill="#333"><tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">1</tspan><tspan dy="-3">–</tspan><tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">4</tspan></text>
  <rect x="206" y="110" width="120" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="266" y="128" text-anchor="middle" font-size="13" fill="#333">Target model</text>
  <text x="266" y="145" text-anchor="middle" font-size="13" fill="#333">verify <tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">1</tspan><tspan dy="-3">–</tspan><tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">4</tspan></text>

  <!-- ── Time saved ── -->
  <text x="476" y="125" text-anchor="middle" font-size="12" fill="#333">time saved for the same four tokens</text>
  <line x1="328" y1="140" x2="624" y2="140" stroke="#555" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

  <!-- ===== Shared time axis (directly under the lanes) ===== -->
  <line x1="130" y1="168" x2="640" y2="168" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="130" y1="164" x2="130" y2="172" stroke="#555" stroke-width="1.2"/>
  <text x="646" y="172" font-size="11" fill="#555">time</text>

  <!-- ===== Output of the verify pass (off the time scale) ===== -->
  <path d="M206,180 V186 H326 V180" fill="none" stroke="#999" stroke-width="0.8"/>
  <text x="198" y="212" text-anchor="end" font-size="11" fill="#555">verify output</text>
  <rect x="208" y="194" width="26" height="26" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="221" y="211" text-anchor="middle" font-size="14" fill="#333"><tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">1</tspan></text>
  <rect x="238" y="194" width="26" height="26" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="251" y="211" text-anchor="middle" font-size="14" fill="#333"><tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">2</tspan></text>
  <rect x="268" y="194" width="26" height="26" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="281" y="211" text-anchor="middle" font-size="14" fill="#333"><tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">3</tspan></text>
  <rect x="298" y="194" width="26" height="26" rx="2" fill="#F5D2D5" stroke="#CB202D" stroke-width="1.2"/>
  <text x="311" y="211" text-anchor="middle" font-size="14" fill="#333"><tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">4</tspan></text>
  <line x1="302" y1="216" x2="320" y2="198" stroke="#CB202D" stroke-width="1.2"/>
  <line x1="311" y1="220" x2="311" y2="232" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="297" y="234" width="28" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="311" y="251" text-anchor="middle" font-size="14" fill="#333"><tspan font-style="italic">T</tspan><tspan dy="3" font-size="11">4</tspan><tspan dy="-3">′</tspan></text>
  <text x="252" y="236" text-anchor="middle" font-size="11" fill="#555">accepted</text>
  <text x="332" y="211" font-size="11" fill="#555">rejected</text>
  <text x="332" y="251" font-size="11" fill="#555">resampled</text>
</svg>
