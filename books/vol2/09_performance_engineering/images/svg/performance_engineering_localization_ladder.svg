<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    .nm { font-size: 14.5px; font-weight: 700; fill: #0f172a; }
    .ev { font-size: 12.5px; fill: #334155; }
    .no { font-size: 12.5px; font-style: italic; fill: #475569; }
    .sc { font-size: 12.5px; font-weight: 700; fill: #1F407A; }
    .chip { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .ln { font-size: 12px; fill: #475569; }
    .lr { font-size: 12px; fill: #CB202D; }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.2"/>
    </pattern>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>
  <!-- ===== Zoom wedges (background) ===== -->
  <path d="M468,112 L350,170 H740 L724,112 Z" fill="#1F407A" fill-opacity="0.06" stroke="none"/>
  <path d="M468,112 L350,170 M724,112 L740,170" fill="none" stroke="#1F407A" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="3,2"/>
  <path d="M596,284 L350,330 H740 L626,284 Z" fill="#1F407A" fill-opacity="0.06" stroke="none"/>
  <path d="M596,284 L350,330 M626,284 L740,330" fill="none" stroke="#1F407A" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="3,2"/>
  <path d="M576,426 L350,466 H740 L666,426 Z" fill="#1F407A" fill-opacity="0.06" stroke="none"/>
  <path d="M576,426 L350,466 M666,426 L740,466" fill="none" stroke="#1F407A" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="3,2"/>
  <!-- ===== Reading order: S then R then P ===== -->
  <line x1="32" y1="48" x2="32" y2="170" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <line x1="32" y1="198" x2="32" y2="330" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <!-- ===== Rung 1: scheduler records (settles S) ===== -->
  <rect x="20" y="22" width="24" height="24" rx="2" fill="#1F407A"/>
  <text x="32" y="39" text-anchor="middle" class="chip">S</text>
  <text x="54" y="40" class="nm">Scheduler records</text>
  <text x="54" y="60" class="ev">queue wait, partial-gang holds,</text>
  <text x="54" y="77" class="ev">fragmentation</text>
  <text x="54" y="96" class="no">cannot see: inside the allocation</text>
  <text x="54" y="116" class="sc">every job · free</text>
  <rect x="350" y="20" width="390" height="92" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="370" y="58" width="40" height="24" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
  <rect x="410" y="58" width="60" height="24" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
  <rect x="410" y="74" width="20" height="8" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>
  <rect x="430" y="68" width="20" height="14" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>
  <rect x="450" y="62" width="20" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>
  <rect x="470" y="58" width="250" height="24" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <text x="595" y="74" text-anchor="middle" class="ln" fill="#334155">held: contents not visible</text>
  <text x="390" y="48" text-anchor="middle" class="ln">queue</text>
  <text x="440" y="100" text-anchor="middle" class="ln">partial gang</text>
  <line x1="470" y1="52" x2="470" y2="88" stroke="#334155" stroke-width="1.5"/>
  <text x="474" y="48" text-anchor="start" class="ln">gang complete</text>
  <rect x="468" y="54" width="256" height="32" rx="1" fill="none" stroke="#1F407A" stroke-width="1.5"/>
  <!-- ===== Rung 2: job timeline (settles R) ===== -->
  <rect x="20" y="172" width="24" height="24" rx="2" fill="#1F407A"/>
  <text x="32" y="189" text-anchor="middle" class="chip">R</text>
  <text x="54" y="190" class="nm">Job timeline</text>
  <text x="54" y="210" class="ev">startup, input waits, checkpoint</text>
  <text x="54" y="227" class="ev">pauses, restarts, rework</text>
  <text x="54" y="246" class="no">cannot see: why a step is slow</text>
  <text x="54" y="266" class="sc">every job · cheap</text>
  <rect x="350" y="170" width="390" height="114" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <!-- step-time series above the plan line -->
  <text x="362" y="200" class="ln">step time</text>
  <text x="362" y="220" class="ln">plan</text>
  <line x1="430" y1="216" x2="720" y2="216" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <polyline points="430,198 440,195 450,199 460,196 470,197" fill="none" stroke="#475569" stroke-width="1.5"/>
  <polyline points="478,196 488,199 498,195 508,198 518,196 528,199 540,197" fill="none" stroke="#475569" stroke-width="1.5"/>
  <polyline points="580,197 590,195 600,199 610,196 620,198 630,195 640,198" fill="none" stroke="#475569" stroke-width="1.5"/>
  <polyline points="648,196 658,199 668,195 678,198 688,196 698,199 708,196 720,198" fill="none" stroke="#475569" stroke-width="1.5"/>
  <!-- lane: retained steps (gray) and runtime losses (brown) -->
  <rect x="370" y="236" width="22" height="20" fill="#E3D3C8" stroke="#78492A" stroke-width="1"/>
  <rect x="392" y="236" width="78" height="20" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <rect x="470" y="236" width="8" height="20" fill="#E3D3C8" stroke="#78492A" stroke-width="1"/>
  <rect x="478" y="236" width="62" height="20" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <rect x="540" y="236" width="40" height="20" fill="#E3D3C8" stroke="#78492A" stroke-width="1"/>
  <rect x="580" y="236" width="60" height="20" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <rect x="640" y="236" width="8" height="20" fill="#E3D3C8" stroke="#78492A" stroke-width="1"/>
  <rect x="648" y="236" width="72" height="20" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <path d="M535,223 L545,231 M545,223 L535,231" fill="none" stroke="#CB202D" stroke-width="1.8"/>
  <text x="381" y="272" text-anchor="middle" class="ln">startup</text>
  <text x="474" y="272" text-anchor="middle" class="ln">checkpoint</text>
  <text x="560" y="272" text-anchor="middle" class="ln">restart, rework</text>
  <text x="648" y="272" text-anchor="middle" class="ln">checkpoint</text>
  <rect x="596" y="186" width="30" height="74" rx="1" fill="none" stroke="#1F407A" stroke-width="1.5"/>
  <!-- ===== Rung 3: step traces (settles P) ===== -->
  <rect x="20" y="332" width="24" height="24" rx="2" fill="#1F407A"/>
  <text x="32" y="349" text-anchor="middle" class="chip">P</text>
  <text x="54" y="350" class="nm">Step traces</text>
  <text x="54" y="370" class="ev">exposed communication,</text>
  <text x="54" y="387" class="ev">memory stalls, dispatch</text>
  <text x="54" y="406" class="no">cannot see: outside the window</text>
  <text x="54" y="426" class="sc">sampled ranks · costly</text>
  <rect x="350" y="330" width="390" height="96" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="364" y="366" class="ln">compute</text>
  <text x="364" y="396" class="ln">comm</text>
  <rect x="430" y="354" width="90" height="16" rx="1" fill="#FCE4CC" stroke="#E67817" stroke-width="1"/>
  <rect x="520" y="354" width="40" height="16" rx="1" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="560" y="354" width="16" height="16" rx="1" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="576" y="354" width="90" height="16" rx="1" fill="#FCE4CC" stroke="#E67817" stroke-width="1"/>
  <rect x="666" y="354" width="40" height="16" rx="1" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="706" y="354" width="14" height="16" rx="1" fill="#FCE4CC" stroke="#E67817" stroke-width="1"/>
  <rect x="490" y="384" width="70" height="16" rx="1" fill="#E6D4E5" stroke="#7E317B" stroke-width="1"/>
  <rect x="636" y="384" width="70" height="16" rx="1" fill="#E6D4E5" stroke="#7E317B" stroke-width="1"/>
  <text x="568" y="347" text-anchor="middle" class="ln">dispatch</text>
  <text x="540" y="416" text-anchor="middle" class="ln">exposed comm</text>
  <rect x="574" y="351" width="94" height="22" rx="1" fill="none" stroke="#1F407A" stroke-width="1.5"/>
  <!-- ===== Continues into the profiling hierarchy ===== -->
  <rect x="350" y="466" width="390" height="34" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="545" y="487" text-anchor="middle" class="ev">kernels and counters: the profiling hierarchy</text>
</svg>
