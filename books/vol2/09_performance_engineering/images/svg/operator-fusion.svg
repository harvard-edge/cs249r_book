  <rect x="40" y="234" width="600" height="30" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="340" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">HBM (off-chip)</text>
