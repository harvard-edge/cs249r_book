  <text x="515" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">LayerNorm</text>
  <line x1="165" y1="264" x2="165" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
