<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 760 530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#CB202D"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#008F45"/>
    </marker>
  </defs>
  <style>
    .hd { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .row { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .rows { font-size: 12.5px; fill: #475569; }
    .k { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .ks { font-size: 12.5px; fill: #475569; }
    .t { font-size: 14px; font-weight: 700; font-style: italic; fill: #0f172a; }
    .sub { font-size: 12.5px; font-style: normal; }
    .lab { font-size: 12.5px; fill: #475569; }
    .labr { font-size: 12.5px; fill: #CB202D; }
  </style>
  <rect y="-10" width="760" height="530" fill="#ffffff"/>

  <!-- ===== Panel A: unfused, three kernels ===== -->
  <text x="20" y="26" class="hd">Unfused: 6 activation transfers</text>

  <!-- HBM band: bars show how long each tensor stays resident -->
  <text x="20" y="80" class="row">HBM</text>
  <text x="20" y="97" class="rows">off chip</text>
  <rect x="100" y="50" width="640" height="60" rx="4" fill="#E3F1F8" stroke="#006395" stroke-width="1.2"/>
  <rect x="110" y="66" width="70" height="28" rx="1" fill="#ffffff" stroke="#006395" stroke-width="1.2"/>
  <text x="145" y="85" text-anchor="middle" class="t">X</text>
  <rect x="230" y="66" width="150" height="28" rx="1" fill="#F5D2D5" stroke="#CB202D" stroke-width="1.5"/>
  <text x="305" y="85" text-anchor="middle" class="t">Z<tspan class="sub" dy="3">1</tspan></text>
  <rect x="430" y="66" width="150" height="28" rx="1" fill="#F5D2D5" stroke="#CB202D" stroke-width="1.5"/>
  <text x="505" y="85" text-anchor="middle" class="t">Z<tspan class="sub" dy="3">2</tspan></text>
  <rect x="630" y="66" width="100" height="28" rx="1" fill="#ffffff" stroke="#006395" stroke-width="1.2"/>
  <text x="680" y="85" text-anchor="middle" class="t">Y</text>

  <!-- SM row -->
  <text x="20" y="190" class="row">SM</text>
  <text x="20" y="207" class="rows">on chip</text>
  <rect x="140" y="170" width="130" height="50" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="205" y="192" text-anchor="middle" class="k">Linear</text>
  <text x="205" y="210" text-anchor="middle" class="ks">kernel 1</text>
  <rect x="340" y="170" width="130" height="50" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="405" y="192" text-anchor="middle" class="k">GELU</text>
  <text x="405" y="210" text-anchor="middle" class="ks">kernel 2</text>
  <rect x="540" y="170" width="130" height="50" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="605" y="192" text-anchor="middle" class="k">LayerNorm</text>
  <text x="605" y="210" text-anchor="middle" class="ks">kernel 3</text>
  <path d="M270,195 H338" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <path d="M470,195 H538" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- Transfers across the chip boundary: the red sawtooth -->
  <path d="M170,94 V168" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="164" y="140" text-anchor="end" class="lab">read</text>
  <path d="M240,170 V96" fill="none" stroke="#CB202D" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="246" y="140" class="labr">write</text>
  <path d="M370,94 V168" fill="none" stroke="#CB202D" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="364" y="140" text-anchor="end" class="labr">read</text>
  <path d="M440,170 V96" fill="none" stroke="#CB202D" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="446" y="140" class="labr">write</text>
  <path d="M570,94 V168" fill="none" stroke="#CB202D" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="564" y="140" text-anchor="end" class="labr">read</text>
  <path d="M640,170 V96" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="646" y="140" class="lab">write</text>

  <!-- ===== Divider ===== -->
  <line x1="20" y1="250" x2="740" y2="250" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== Panel B: one fused kernel ===== -->
  <text x="20" y="286" class="hd">Fused: 2 activation transfers</text>

  <text x="20" y="340" class="row">HBM</text>
  <text x="20" y="357" class="rows">off chip</text>
  <rect x="100" y="310" width="640" height="60" rx="4" fill="#E3F1F8" stroke="#006395" stroke-width="1.2"/>
  <rect x="110" y="326" width="70" height="28" rx="1" fill="#ffffff" stroke="#006395" stroke-width="1.2"/>
  <text x="145" y="345" text-anchor="middle" class="t">X</text>
  <!-- intermediates never materialized in HBM -->
  <rect x="230" y="326" width="150" height="28" rx="1" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="305" y="345" text-anchor="middle" class="lab">no <tspan font-weight="700" font-style="italic" fill="#0f172a">Z</tspan><tspan class="sub" dy="3" font-weight="700" fill="#0f172a">1</tspan><tspan dy="-3" dx="4">in HBM</tspan></text>
  <rect x="430" y="326" width="150" height="28" rx="1" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="505" y="345" text-anchor="middle" class="lab">no <tspan font-weight="700" font-style="italic" fill="#0f172a">Z</tspan><tspan class="sub" dy="3" font-weight="700" fill="#0f172a">2</tspan><tspan dy="-3" dx="4">in HBM</tspan></text>
  <rect x="630" y="326" width="100" height="28" rx="1" fill="#ffffff" stroke="#006395" stroke-width="1.2"/>
  <text x="680" y="345" text-anchor="middle" class="t">Y</text>

  <text x="20" y="460" class="row">SM</text>
  <text x="20" y="477" class="rows">on chip</text>
  <rect x="140" y="430" width="530" height="70" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="156" y="449" class="ks">one fused kernel</text>
  <rect x="160" y="456" width="110" height="34" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="215" y="478" text-anchor="middle" class="k">Linear</text>
  <rect x="350" y="456" width="110" height="34" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="405" y="478" text-anchor="middle" class="k">GELU</text>
  <rect x="540" y="456" width="110" height="34" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="595" y="478" text-anchor="middle" class="k">LayerNorm</text>
  <!-- intermediates handed over in registers / shared memory -->
  <path d="M270,473 H348" fill="none" stroke="#008F45" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="305" y="466" text-anchor="middle" class="t">Z<tspan class="sub" dy="3">1</tspan></text>
  <path d="M460,473 H538" fill="none" stroke="#008F45" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="495" y="466" text-anchor="middle" class="t">Z<tspan class="sub" dy="3">2</tspan></text>

  <path d="M170,354 V428" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="164" y="400" text-anchor="end" class="lab">read</text>
  <path d="M640,430 V356" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="646" y="400" class="lab">write</text>
</svg>
