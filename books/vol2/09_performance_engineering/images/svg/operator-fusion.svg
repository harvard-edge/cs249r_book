  <text x="165" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Linear</text>
  <line x1="220" y1="357" x2="283" y2="357" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
