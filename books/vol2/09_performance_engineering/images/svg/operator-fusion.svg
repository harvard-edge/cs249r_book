<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-neutral" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .section-title { font-size: 11px; font-weight: 700; }
    .kernel-title { font-size: 10.5px; font-weight: 700; fill: #0369a1; }
    .kernel-sub { font-size: 8.5px; fill: #64748b; }
    .rw-label { font-size: 8px; font-weight: 700; }
    .callout-text { font-size: 9px; font-weight: 700; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- SECTION A: UNFUSED EXECUTION                                           -->
  <!-- ====================================================================== -->
  <rect x="40" y="16" width="230" height="22" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="155" y="31" text-anchor="middle" class="section-title" fill="#b91c1c">Unfused: 6 HBM Transfers (3 R / 3 W)</text>

  <!-- HBM bar top -->
  <rect x="40" y="46" width="600" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="340" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">High Bandwidth Memory (Off-Chip HBM3 · ~640 pJ · 300 ns)</text>

  <!-- Kernel 1: LayerNorm -->
  <rect x="100" y="105" width="120" height="42" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="160" y="123" text-anchor="middle" class="kernel-title">LayerNorm</text>
  <text x="160" y="137" text-anchor="middle" class="kernel-sub">Kernel 1</text>

  <!-- HBM read arrow into K1 -->
  <line x1="130" y1="70" x2="130" y2="103" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="122" y="90" class="rw-label" fill="#dc2626" text-anchor="end">Read</text>
  <!-- HBM write arrow out of K1 -->
  <line x1="190" y1="105" x2="190" y2="72" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="198" y="90" class="rw-label" fill="#dc2626">Write</text>

  <!-- Kernel 2: GELU -->
  <rect x="280" y="105" width="120" height="42" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="340" y="123" text-anchor="middle" class="kernel-title">GELU</text>
  <text x="340" y="137" text-anchor="middle" class="kernel-sub">Kernel 2</text>

  <!-- HBM read arrow into K2 -->
  <line x1="310" y1="70" x2="310" y2="103" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="302" y="90" class="rw-label" fill="#dc2626" text-anchor="end">Read</text>
  <!-- HBM write arrow out of K2 -->
  <line x1="370" y1="105" x2="370" y2="72" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="378" y="90" class="rw-label" fill="#dc2626">Write</text>

  <!-- Kernel 3: Linear -->
  <rect x="460" y="105" width="120" height="42" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="520" y="123" text-anchor="middle" class="kernel-title">Linear</text>
  <text x="520" y="137" text-anchor="middle" class="kernel-sub">Kernel 3</text>

  <!-- HBM read arrow into K3 -->
  <line x1="490" y1="70" x2="490" y2="103" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="482" y="90" class="rw-label" fill="#dc2626" text-anchor="end">Read</text>
  <!-- HBM write arrow out of K3 -->
  <line x1="550" y1="105" x2="550" y2="72" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="558" y="90" class="rw-label" fill="#dc2626">Write</text>

  <!-- Logical flow dashed arrows between kernels -->
  <line x1="220" y1="126" x2="278" y2="126" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-neutral)"/>
  <line x1="400" y1="126" x2="458" y2="126" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-neutral)"/>

  <!-- Cost annotation unfused -->
  <rect x="100" y="162" width="480" height="22" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="340" y="177" text-anchor="middle" class="callout-text" fill="#b91c1c">
    Memory Penalty: 3 Intermediate Writes + 3 Reads through HBM · High DRAM Latency Bubbles
  </text>

  <!-- Separator line -->
  <line x1="40" y1="202" x2="640" y2="202" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- ====================================================================== -->
  <!-- SECTION B: FUSED EXECUTION                                             -->
  <!-- ====================================================================== -->
  <rect x="40" y="218" width="230" height="22" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="155" y="233" text-anchor="middle" class="section-title" fill="#15803d">Fused: 2 HBM Transfers (1 R / 1 W)</text>

  <!-- HBM bar bottom -->
  <rect x="40" y="248" width="600" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="340" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">High Bandwidth Memory (Off-Chip HBM3 · ~640 pJ · 300 ns)</text>

  <!-- Single fused kernel -->
  <rect x="120" y="310" width="440" height="88" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="340" y="330" text-anchor="middle" class="kernel-title" font-size="11.5">Fused Kernel: LayerNorm + GELU + Linear</text>
  <text x="340" y="345" text-anchor="middle" class="kernel-sub">Intermediates retained entirely within on-chip SRAM / Registers (~0.5 pJ · 20 ns)</text>

  <!-- Single HBM read arrow -->
  <line x1="220" y1="272" x2="220" y2="308" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="212" y="294" class="rw-label" fill="#15803d" text-anchor="end">1 Read</text>

  <!-- Single HBM write arrow -->
  <line x1="460" y1="310" x2="460" y2="274" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="468" y="294" class="rw-label" fill="#15803d">1 Write</text>

  <!-- Internal flow inside fused kernel -->
  <rect x="145" y="358" width="70" height="24" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="180" y="374" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">LayerNorm</text>

  <line x1="215" y1="370" x2="295" y2="370" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="235" y="352" width="42" height="15" rx="2" fill="#e0f2fe"/>
  <text x="256" y="363" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">SRAM</text>

  <rect x="305" y="358" width="70" height="24" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="340" y="374" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">GELU</text>

  <line x1="375" y1="370" x2="455" y2="370" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="395" y="352" width="42" height="15" rx="2" fill="#e0f2fe"/>
  <text x="416" y="363" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">SRAM</text>

  <rect x="465" y="358" width="70" height="24" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="500" y="374" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">Linear</text>

  <!-- Cost annotation fused -->
  <rect x="120" y="412" width="440" height="22" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="340" y="427" text-anchor="middle" class="callout-text" fill="#15803d">
    Optimization Payoff: 1 Read + 1 Write = 2 HBM Transfers · 3× Memory Traffic Reduction
  </text>

  <!-- ===== Bottom footnote ===== -->
  <text x="340" y="460" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    HBM access consumes ~640 pJ and ~300 ns latency; on-chip SRAM consumes ~0.5 pJ and ~20 ns latency.
  </text>
</svg>