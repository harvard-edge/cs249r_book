<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 690 352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- ML productivity goodput as a chain of three accounting boundaries.
       Each row is the capacity-time that crossed the boundaries above it; the dashed ghost at the
       right end of a row is the capacity-time lost at the boundary just above that row, and the
       losses beside it are charged there and nowhere else. Widths are schematic, not measured.
       Neutral slate = capacity-time; green = useful work at the ideal rate; navy chips = the
       three factors (volume accent, as in the localization ladder). -->
  <style>
    .rl { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .bn { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .ra { font-size: 12px; font-style: italic; fill: #475569; }
    .ls { font-size: 12px; fill: #475569; }
    .ch { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .ug { font-size: 13px; font-weight: 700; fill: #15803d; }
    .eq { font-size: 13px; font-weight: 700; fill: #0f172a; }
  </style>
  <rect y="20" width="690" height="352" fill="#ffffff"/>

  <!-- ===== Row 0: capacity the fleet offers ===== -->
  <rect x="190" y="40" width="300" height="32" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="61" class="rl">capacity-time the fleet offers</text>

  <!-- Boundary S -->
  <line x1="190" y1="96" x2="490" y2="96" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="14" y="85" width="22" height="22" rx="2" fill="#1F407A"/>
  <text x="25" y="101" text-anchor="middle" class="ch">S</text>
  <text x="44" y="93" class="bn">complete allocation</text>
  <text x="44" y="108" class="ra">held ÷ offered</text>

  <!-- ===== Row 1: held by complete allocations ===== -->
  <rect x="190" y="120" width="240" height="32" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="430" y="120" width="60" height="32" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="200" y="141" class="rl">held by complete allocations</text>
  <text x="508" y="128" class="ls">unallocated capacity</text>
  <text x="508" y="143" class="ls">partial gangs</text>
  <text x="508" y="158" class="ls">fragmentation</text>

  <!-- Boundary R -->
  <line x1="190" y1="176" x2="490" y2="176" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="14" y="165" width="22" height="22" rx="2" fill="#1F407A"/>
  <text x="25" y="181" text-anchor="middle" class="ch">R</text>
  <text x="44" y="173" class="bn">retained step</text>
  <text x="44" y="188" class="ra">retained ÷ held</text>

  <!-- ===== Row 2: time on retained steps ===== -->
  <rect x="190" y="200" width="200" height="32" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="390" y="200" width="40" height="32" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="200" y="221" class="rl">time on retained steps</text>
  <text x="448" y="208" class="ls">startup, input waits</text>
  <text x="448" y="223" class="ls">checkpoint pauses</text>
  <text x="448" y="238" class="ls">recovery and rework</text>

  <!-- Boundary P -->
  <line x1="190" y1="256" x2="490" y2="256" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="14" y="245" width="22" height="22" rx="2" fill="#1F407A"/>
  <text x="25" y="261" text-anchor="middle" class="ch">P</text>
  <text x="44" y="253" class="bn">ideal rate</text>
  <text x="44" y="268" class="ra">ideal ÷ retained</text>

  <!-- ===== Row 3: useful work at the ideal rate ===== -->
  <rect x="190" y="280" width="110" height="32" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="300" y="280" width="90" height="32" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="200" y="301" class="ug">useful work</text>
  <text x="408" y="288" class="ls">exposed communication</text>
  <text x="408" y="303" class="ls">stragglers, bubbles</text>
  <text x="408" y="318" class="ls">memory stalls, dispatch</text>

  <!-- the product -->
  <text x="190" y="344" class="eq">useful work = capacity-time × S × R × P</text>
</svg>
