<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 415" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .lvl-badge { font-size: 8px; font-weight: 700; }
    .lvl-title { font-size: 11px; font-weight: 700; fill: #0f172a; }
    .lvl-desc { font-size: 8px; fill: #475569; }
    .lvl-tools { font-size: 8px; font-weight: 700; }
    .scope-lbl { font-size: 7.5px; font-weight: 700; }
    .scope-sub { font-size: 7px; fill: #64748b; }
    .side-lbl { font-size: 8.5px; font-weight: 700; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- LEFT SIDEBAR: Top-Down Diagnostic Flow Indicator                       -->
  <!-- ====================================================================== -->
  <rect x="20" y="16" width="95" height="388" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="67.5" y="32" text-anchor="middle" class="side-lbl" fill="#0f172a">Diagnostic Flow</text>
  <text x="67.5" y="43" text-anchor="middle" font-size="7" fill="#64748b">Top-Down</text>

  <!-- Step 1 (y center 60) -->
  <circle cx="67.5" cy="54" r="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="67.5" y="57.5" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">1</text>
  <text x="67.5" y="74" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">Observe</text>
  <text x="67.5" y="83" text-anchor="middle" font-size="7" fill="#64748b">Symptom</text>

  <!-- Flow line 1 -> 2 -->
  <path d="M 67.5,92 L 67.5,140" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Step 2 (y center 160) -->
  <circle cx="67.5" cy="154" r="10" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="67.5" y="157.5" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">2</text>
  <text x="67.5" y="174" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Isolate</text>
  <text x="67.5" y="183" text-anchor="middle" font-size="7" fill="#92400e">Phase</text>

  <!-- Flow line 2 -> 3 -->
  <path d="M 67.5,192 L 67.5,240" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Step 3 (y center 260) -->
  <circle cx="67.5" cy="254" r="10" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="67.5" y="257.5" text-anchor="middle" font-size="8" font-weight="700" fill="#14294E">3</text>
  <text x="67.5" y="274" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">Pinpoint</text>
  <text x="67.5" y="283" text-anchor="middle" font-size="7" fill="#1F407A">Kernel</text>

  <!-- Flow line 3 -> 4 -->
  <path d="M 67.5,292 L 67.5,340" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Step 4 (y center 360) -->
  <circle cx="67.5" cy="354" r="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="67.5" y="357.5" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">4</text>
  <text x="67.5" y="374" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Resolve</text>
  <text x="67.5" y="383" text-anchor="middle" font-size="7" fill="#7c3aed">Root Cause</text>

  <!-- ====================================================================== -->
  <!-- MAIN HIERARCHY LEVELS (Level 4 down to Level 1)                        -->
  <!-- ====================================================================== -->

  <!-- Level 4: Application & Fleet Profiling -->
  <rect x="125" y="16" width="470" height="88" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="135" y="24" width="64" height="18" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="167" y="36" text-anchor="middle" class="lvl-badge" fill="#334155">Level 4</text>
  <text x="208" y="37" class="lvl-title">Application &amp; Fleet Profiling</text>
  
  <text x="135" y="58" class="lvl-desc"><tspan font-weight="700" fill="#0f172a">Metrics:</tspan> End-to-end SLOs, token generation rate (tok/s), TTFT, ITL, cluster MFU, GPU duty cycle</text>
  <text x="135" y="71" class="lvl-desc"><tspan font-weight="700" fill="#0f172a">Question:</tspan> "Is the cluster meeting target throughput and latency SLOs?"</text>
  <text x="135" y="88" class="lvl-tools" fill="#475569">Tools: Prometheus · Grafana · Weights &amp; Biases · Ray Dashboard · OpenTelemetry</text>

  <!-- Level 3: Distributed Framework Profiling -->
  <rect x="125" y="116" width="470" height="88" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <rect x="135" y="124" width="64" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="167" y="136" text-anchor="middle" class="lvl-badge" fill="#b45309">Level 3</text>
  <text x="208" y="137" class="lvl-title">Framework &amp; Distributed Traces</text>
  
  <text x="135" y="158" class="lvl-desc"><tspan font-weight="700" fill="#0f172a">Metrics:</tspan> NCCL collective communication, AllReduce vs compute overlap, straggler ranks, data loading</text>
  <text x="135" y="171" class="lvl-desc"><tspan font-weight="700" fill="#0f172a">Question:</tspan> "Is throughput bottlenecked by communication, pipeline bubbles, or CPU starvation?"</text>
  <text x="135" y="188" class="lvl-tools" fill="#b45309">Tools: PyTorch Profiler + NVTX · TensorBoard Trace Viewer · DeepSpeed Flops Profiler</text>

  <!-- Level 2: Kernel Timeline Profiling -->
  <rect x="125" y="216" width="470" height="88" rx="4" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
  <rect x="135" y="224" width="64" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <text x="167" y="236" text-anchor="middle" class="lvl-badge" fill="#14294E">Level 2</text>
  <text x="208" y="237" class="lvl-title">Kernel Timeline &amp; Concurrency</text>
  
  <text x="135" y="258" class="lvl-desc"><tspan font-weight="700" fill="#0f172a">Metrics:</tspan> Kernel launch latency, host-device synchronization, GPU idle gaps, CUDA stream serialization</text>
  <text x="135" y="271" class="lvl-desc"><tspan font-weight="700" fill="#0f172a">Question:</tspan> "Are CUDA kernels overlapping effectively and keeping SMs continuously occupied?"</text>
  <text x="135" y="288" class="lvl-tools" fill="#14294E">Tools: NVIDIA Nsight Systems (nsys) · PyTorch Kineto · Perfetto UI</text>

  <!-- Level 1: Microarchitecture Hardware Counters -->
  <rect x="125" y="316" width="470" height="88" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
  <rect x="135" y="324" width="64" height="18" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="167" y="336" text-anchor="middle" class="lvl-badge" fill="#6d28d9">Level 1</text>
  <text x="208" y="337" class="lvl-title">Hardware Microarchitecture Counters</text>
  
  <text x="135" y="358" class="lvl-desc"><tspan font-weight="700" fill="#0f172a">Metrics:</tspan> Memory roofline position, HBM vs SRAM bandwidth, warp occupancy, register spills, pipe stalls</text>
  <text x="135" y="371" class="lvl-desc"><tspan font-weight="700" fill="#0f172a">Question:</tspan> "Is this specific kernel bound by memory bandwidth, latency, or compute units?"</text>
  <text x="135" y="388" class="lvl-tools" fill="#6d28d9">Tools: NVIDIA Nsight Compute (ncu) · Linux perf · ROCm Omnitrace</text>

  <!-- ====================================================================== -->
  <!-- RIGHT SIDEBAR: Scope & Resolution                                      -->
  <!-- ====================================================================== -->
  <rect x="605" y="16" width="115" height="388" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="662.5" y="32" text-anchor="middle" class="side-lbl" fill="#0f172a">Scope &amp; Scale</text>
  <text x="662.5" y="43" text-anchor="middle" font-size="7" fill="#64748b">Resolution</text>

  <!-- Scope 4 (centered around y=60) -->
  <rect x="612" y="38" width="101" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="662.5" y="56" text-anchor="middle" class="scope-lbl" fill="#334155">Fleet / Cluster</text>
  <text x="662.5" y="70" text-anchor="middle" class="scope-sub">Hours to Days</text>

  <!-- Scope 3 (centered around y=160) -->
  <rect x="612" y="138" width="101" height="44" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="662.5" y="156" text-anchor="middle" class="scope-lbl" fill="#b45309">Node / Rank</text>
  <text x="662.5" y="170" text-anchor="middle" class="scope-sub">Minutes / Traced Steps</text>

  <!-- Scope 2 (centered around y=260) -->
  <rect x="612" y="238" width="101" height="44" rx="2" fill="#ffffff" stroke="#7dd3fc" stroke-width="0.8"/>
  <text x="662.5" y="256" text-anchor="middle" class="scope-lbl" fill="#14294E">Process / Stream</text>
  <text x="662.5" y="270" text-anchor="middle" class="scope-sub">Seconds / Milliseconds</text>

  <!-- Scope 1 (centered around y=360) -->
  <rect x="612" y="338" width="101" height="44" rx="2" fill="#ffffff" stroke="#d8b4fe" stroke-width="0.8"/>
  <text x="662.5" y="355" text-anchor="middle" class="scope-lbl" fill="#6d28d9">SM / Warp / Instruction</text>
  <text x="662.5" y="369" text-anchor="middle" class="scope-sub">Microseconds / Nano</text>

</svg>