<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="680" height="370" fill="#ffffff"/>
  <!-- ===== Drill-down axis ===== -->
  <text x="50" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">symptom</text>
  <line x1="50" y1="44" x2="50" y2="336" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="50" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">root cause</text>
  <!-- ── Level 4 ── -->
  <rect x="110" y="20" width="440" height="70" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="122" y="32" width="24" height="20" rx="3" fill="#1F407A"/>
  <text x="134" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="156" y="47" font-size="14" font-weight="700" fill="#0f172a">Application and fleet</text>
  <text x="156" y="66" font-size="12" fill="#334155">TTFT, ITL, tokens/s, MFU</text>
  <text x="156" y="82" font-size="12" font-style="italic" fill="#475569">Prometheus, OpenTelemetry</text>
  <line x1="330" y1="90" x2="330" y2="109" stroke="#64748b" stroke-width="1.2"/>
  <text x="620" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Fleet</text>
  <text x="620" y="70" text-anchor="middle" font-size="12" fill="#475569">hours</text>
  <!-- ── Level 3 ── -->
  <rect x="130" y="110" width="400" height="70" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="142" y="122" width="24" height="20" rx="3" fill="#1F407A"/>
  <text x="154" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="176" y="137" font-size="14" font-weight="700" fill="#0f172a">Framework and distributed traces</text>
  <text x="176" y="156" font-size="12" fill="#334155">operator time, collectives, stragglers</text>
  <text x="176" y="172" font-size="12" font-style="italic" fill="#475569">PyTorch Profiler</text>
  <line x1="330" y1="180" x2="330" y2="199" stroke="#64748b" stroke-width="1.2"/>
  <text x="620" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Rank</text>
  <text x="620" y="160" text-anchor="middle" font-size="12" fill="#475569">steps</text>
  <!-- ── Level 2 ── -->
  <rect x="150" y="200" width="360" height="70" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="162" y="212" width="24" height="20" rx="3" fill="#1F407A"/>
  <text x="174" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="196" y="227" font-size="14" font-weight="700" fill="#0f172a">Kernel timeline</text>
  <text x="196" y="246" font-size="12" fill="#334155">launch gaps, stream overlap</text>
  <text x="196" y="262" font-size="12" font-style="italic" fill="#475569">Nsight Systems</text>
  <line x1="330" y1="270" x2="330" y2="289" stroke="#64748b" stroke-width="1.2"/>
  <text x="620" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Stream</text>
  <text x="620" y="250" text-anchor="middle" font-size="12" fill="#475569">milliseconds</text>
  <!-- ── Level 1 ── -->
  <rect x="170" y="290" width="320" height="70" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="182" y="302" width="24" height="20" rx="3" fill="#1F407A"/>
  <text x="194" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="216" y="317" font-size="14" font-weight="700" fill="#0f172a">Hardware counters</text>
  <text x="216" y="336" font-size="12" fill="#334155">bandwidth, occupancy, stalls</text>
  <text x="216" y="352" font-size="12" font-style="italic" fill="#475569">Nsight Compute</text>
  <text x="620" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">SM</text>
  <text x="620" y="340" text-anchor="middle" font-size="12" fill="#475569">microseconds</text>
</svg>
