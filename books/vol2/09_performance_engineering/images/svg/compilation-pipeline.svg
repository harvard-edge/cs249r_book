<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 740 322" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <style>
    .region-header { font-size: 9.5px; font-weight: 700; }
    .stage-title { font-size: 8.5px; font-weight: 700; }
    .stage-tech { font-size: 8px; font-weight: 700; }
    .stage-body { font-size: 8px; fill: #475569; }
    .card-title { font-size: 9.5px; font-weight: 700; }
    .card-body { font-size: 8px; fill: #334155; }
    .tier-title { font-size: 8.5px; font-weight: 700; }
    .tier-sub { font-size: 7.5px; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- TOP CONTAINER: 4-Stage Compilation Pipeline                            -->
  <!-- ====================================================================== -->
  <rect x="20" y="42" width="700" height="182" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  

  <!-- Stage 1: Graph Capture -->
  <rect x="32" y="52" width="145" height="158" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="58" width="133" height="20" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="104.5" y="72" text-anchor="middle" class="stage-title" fill="#6d28d9">Stage 1: Graph Capture</text>
  <text x="104.5" y="92" text-anchor="middle" class="stage-tech" fill="#7c3aed">TorchDynamo · FX Tracing</text>
  <text x="44" y="110" class="stage-body">Intercepts Python frame</text>
  <text x="44" y="122" class="stage-body">bytecode evaluation</text>
  <text x="44" y="138" class="stage-body">Extracts pure tensor DAG</text>
  <text x="44" y="154" class="stage-body">Installs guards on dynamic</text>
  <text x="44" y="166" class="stage-body">shapes and object types</text>
  <text x="44" y="182" class="stage-body">Emits symbolic FX graph</text>
  <text x="44" y="198" font-size="7" font-weight="700" fill="#6d28d9">Output: Symbolic Graph</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 180,131 L 196,131" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 2: Graph Optimization -->
  <rect x="202" y="52" width="145" height="158" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="208" y="58" width="133" height="20" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <text x="274.5" y="72" text-anchor="middle" class="stage-title" fill="#14294E">Stage 2: Graph Opt</text>
  <text x="274.5" y="92" text-anchor="middle" class="stage-tech" fill="#1F407A">AOTAutograd · FX Passes</text>
  <text x="214" y="110" class="stage-body">Dead code elimination</text>
  <text x="214" y="124" class="stage-body">Common subexpression</text>
  <text x="214" y="136" class="stage-body">elimination (CSE)</text>
  <text x="214" y="152" class="stage-body">Constant folding &amp; baking</text>
  <text x="214" y="166" class="stage-body">Memory layout propagation</text>
  <text x="214" y="198" font-size="7" font-weight="700" fill="#14294E">Output: Clean Target DAG</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 350,131 L 366,131" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Operator Fusion -->
  <rect x="372" y="52" width="145" height="158" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="378" y="58" width="133" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="444.5" y="72" text-anchor="middle" class="stage-title" fill="#b45309">Stage 3: Operator Fusion</text>
  <text x="444.5" y="92" text-anchor="middle" class="stage-tech" fill="#d97706">TorchInductor Fusion Pass</text>
  <text x="384" y="110" class="stage-body">Fuses elementwise ops</text>
  <text x="384" y="122" class="stage-body">(Bias + GELU + Add)</text>
  <text x="384" y="138" class="stage-body">Fuses reductions &amp; norms</text>
  <text x="384" y="152" class="stage-body">Eliminates intermediate</text>
  <text x="384" y="164" class="stage-body">HBM buffer allocations</text>
  <text x="384" y="198" font-size="7" font-weight="700" fill="#b45309">Output: Fused Loop Kernels</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 520,131 L 536,131" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 4: Codegen & Tuning -->
  <rect x="542" y="52" width="166" height="158" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="548" y="58" width="154" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="625" y="72" text-anchor="middle" class="stage-title" fill="#15803d">Stage 4: Codegen &amp; Tuning</text>
  <text x="625" y="92" text-anchor="middle" class="stage-tech" fill="#16a34a">Triton · CUTLASS · cuBLAS</text>
  <text x="554" y="110" class="stage-body">Generates Triton / C++ code</text>
  <text x="554" y="124" class="stage-body">Autotunes tile dimensions,</text>
  <text x="554" y="136" class="stage-body">num_warps, &amp; num_stages</text>
  <text x="554" y="150" class="stage-body">Selects optimal GEMM kernel</text>
  <text x="554" y="164" class="stage-body">Compiles directly to PTX/SASS</text>
  <text x="554" y="178" class="stage-body">Maximizes register occupancy</text>
  <text x="554" y="198" font-size="7" font-weight="700" fill="#15803d">Output: Tuned Machine Code</text>

  <!-- ====================================================================== -->
  <!-- MIDDLE CONTAINERS: IR Pipeline & Runtime Savings                        -->
  <!-- ====================================================================== -->
  <!-- Left Box: IR Transformations -->
  <rect x="20" y="234" width="700" height="106" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="30" y="242" width="250" height="18" rx="2" fill="#EAF1F8" stroke="#7dd3fc" stroke-width="0.8"/>
  <text x="38" y="255" class="card-title" fill="#14294E">One FFN block through the IR stages</text>
  
  <g transform="translate(40, 276)">
    <text x="0" y="0" font-size="9" font-weight="700" fill="#334155">1. Python Source:</text>
    <text x="100" y="0" font-size="9" font-family="Courier New, monospace" fill="#1F407A">y = layer_norm(linear2(gelu(linear1(x))))</text>
    
    <text x="0" y="16" font-size="9" font-weight="700" fill="#334155">2. FX Graph:</text>
    <text x="100" y="16" font-size="9" font-family="Courier New, monospace" fill="#6d28d9">%gelu = call_function[aten.gelu](%linear1)</text>
    
    <text x="0" y="32" font-size="9" font-weight="700" fill="#334155">3. Inductor IR:</text>
    <text x="100" y="32" font-size="9" fill="#b45309">linear1 GEMM + fused GELU epilogue, then linear2, then layer_norm</text>
    
    <text x="0" y="48" font-size="9" font-weight="700" fill="#334155">4. Target Code:</text>
    <text x="100" y="48" font-size="9" fill="#15803d">three tuned kernels (Triton, cuBLAS) instead of four eager launches</text>
  </g>


</svg>