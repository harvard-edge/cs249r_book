<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="100%" height="100%">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .region-header { font-size: 9.5px; font-weight: 700; }
    .stage-title { font-size: 8.5px; font-weight: 700; }
    .stage-tech { font-size: 8px; font-weight: 700; }
    .stage-body { font-size: 7.5px; fill: #475569; }
    .card-title { font-size: 9.5px; font-weight: 700; }
    .card-body { font-size: 8px; fill: #334155; }
    .tier-title { font-size: 8.5px; font-weight: 700; }
    .tier-sub { font-size: 7.5px; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- TOP CONTAINER: 4-Stage Compilation Pipeline                            -->
  <!-- ====================================================================== -->
  <rect x="20" y="14" width="700" height="210" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  
  <rect x="32" y="22" width="340" height="20" rx="2" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="42" y="36" class="region-header" fill="#0369a1">ML Compilation Pipeline: Eager PyTorch to Tuned GPU Kernels</text>

  <!-- Stage 1: Graph Capture -->
  <rect x="32" y="52" width="145" height="158" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="58" width="133" height="20" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="104.5" y="72" text-anchor="middle" class="stage-title" fill="#6d28d9">Stage 1: Graph Capture</text>
  <text x="104.5" y="92" text-anchor="middle" class="stage-tech" fill="#7c3aed">TorchDynamo · FX Tracing</text>
  <text x="44" y="110" class="stage-body">• Intercepts Python frame</text>
  <text x="44" y="122" class="stage-body">  bytecode evaluation</text>
  <text x="44" y="136" class="stage-body">• Extracts pure tensor DAG</text>
  <text x="44" y="150" class="stage-body">• Installs guards on dynamic</text>
  <text x="44" y="162" class="stage-body">  shapes and object types</text>
  <text x="44" y="176" class="stage-body">• Generates Torch FX graph</text>
  <text x="44" y="196" font-size="7" font-weight="700" fill="#6d28d9">Output: Symbolic Graph</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 180,131 L 196,131" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 2: Graph Optimization -->
  <rect x="202" y="52" width="145" height="158" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="208" y="58" width="133" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
  <text x="274.5" y="72" text-anchor="middle" class="stage-title" fill="#0369a1">Stage 2: Graph Opt</text>
  <text x="274.5" y="92" text-anchor="middle" class="stage-tech" fill="#0284c7">AOTAutograd · FX Passes</text>
  <text x="214" y="110" class="stage-body">• Dead code elimination</text>
  <text x="214" y="122" class="stage-body">• Common subexpression</text>
  <text x="214" y="134" class="stage-body">  elimination (CSE)</text>
  <text x="214" y="148" class="stage-body">• Constant folding / baking</text>
  <text x="214" y="162" class="stage-body">• Memory layout propagation</text>
  <text x="214" y="176" class="stage-body">• 10–30% fewer total ops</text>
  <text x="214" y="196" font-size="7" font-weight="700" fill="#0369a1">Output: Clean Target DAG</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 350,131 L 366,131" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Operator Fusion -->
  <rect x="372" y="52" width="145" height="158" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="378" y="58" width="133" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="444.5" y="72" text-anchor="middle" class="stage-title" fill="#b45309">Stage 3: Operator Fusion</text>
  <text x="444.5" y="92" text-anchor="middle" class="stage-tech" fill="#d97706">TorchInductor Fusion Pass</text>
  <text x="384" y="110" class="stage-body">• Fuses elementwise ops</text>
  <text x="384" y="122" class="stage-body">  (Bias + GELU + Add)</text>
  <text x="384" y="136" class="stage-body">• Fuses reductions &amp; norms</text>
  <text x="384" y="150" class="stage-body">• Eliminates intermediate</text>
  <text x="384" y="162" class="stage-body">  HBM buffer allocations</text>
  <text x="384" y="176" class="stage-body">• 30–50% fewer DRAM trips</text>
  <text x="384" y="196" font-size="7" font-weight="700" fill="#b45309">Output: Fused Loop Kernels</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 520,131 L 536,131" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 4: Codegen & Tuning -->
  <rect x="542" y="52" width="166" height="158" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="548" y="58" width="154" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="625" y="72" text-anchor="middle" class="stage-title" fill="#15803d">Stage 4: Codegen &amp; Tuning</text>
  <text x="625" y="92" text-anchor="middle" class="stage-tech" fill="#16a34a">Triton · CUTLASS · cuBLAS</text>
  <text x="554" y="110" class="stage-body">• Generates Triton / C++ code</text>
  <text x="554" y="124" class="stage-body">• Autotunes tile dimensions,</text>
  <text x="554" y="136" class="stage-body">  num_warps, &amp; num_stages</text>
  <text x="554" y="150" class="stage-body">• Selects optimal GEMM kernel</text>
  <text x="554" y="164" class="stage-body">• Compiles directly to PTX/SASS</text>
  <text x="554" y="178" class="stage-body">• Maximizes register occupancy</text>
  <text x="554" y="196" font-size="7" font-weight="700" fill="#15803d">Output: Tuned Machine Code</text>

  <!-- ====================================================================== -->
  <!-- MIDDLE CONTAINERS: IR Pipeline & Runtime Savings                        -->
  <!-- ====================================================================== -->
  <!-- Left Box: IR Transformations -->
  <rect x="20" y="234" width="342" height="106" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="30" y="242" width="220" height="18" rx="2" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
  <text x="38" y="255" class="card-title" fill="#0369a1">Intermediate Representation (IR) Flow</text>
  
  <g transform="translate(32, 270)">
    <text x="0" y="0" font-size="7.5" font-weight="700" fill="#334155">1. Python Source:</text>
    <text x="80" y="0" font-size="7.5" font-family="monospace" fill="#0284c7">y = gelu(linear(norm(x)))</text>
    
    <text x="0" y="16" font-size="7.5" font-weight="700" fill="#334155">2. FX Graph:</text>
    <text x="80" y="16" font-size="7.5" font-family="monospace" fill="#6d28d9">%node_3 = call_function[gelu](...)</text>
    
    <text x="0" y="32" font-size="7.5" font-weight="700" fill="#334155">3. Inductor IR:</text>
    <text x="80" y="32" font-size="7.5" font-family="monospace" fill="#d97706">LoopLevelIR: fused_gemm_gelu()</text>
    
    <text x="0" y="48" font-size="7.5" font-weight="700" fill="#334155">4. Target Code:</text>
    <text x="80" y="48" font-size="7.5" font-family="monospace" fill="#15803d">@triton.jit def kernel(in_ptr, out_ptr...)</text>
  </g>

  <!-- Right Box: Runtime Bottlenecks Eliminated -->
  <rect x="378" y="234" width="342" height="106" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="388" y="242" width="220" height="18" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
  <text x="396" y="255" class="card-title" fill="#15803d">Runtime Bottlenecks Eliminated</text>

  <g transform="translate(390, 270)">
    <text x="0" y="0" class="card-body"><tspan font-weight="700" fill="#0f172a">• Python Interpreter Overhead:</tspan> Bypasses GIL &amp; eval loop (~5–10 µs/op)</text>
    <text x="0" y="16" class="card-body"><tspan font-weight="700" fill="#0f172a">• Kernel Launch Overhead:</tspan> 50+ dispatches reduced to 5–10 macro-kernels</text>
    <text x="0" y="32" class="card-body"><tspan font-weight="700" fill="#0f172a">• Off-Chip HBM Traffic:</tspan> Fused activations held in on-chip SRAM/registers</text>
    <text x="0" y="48" class="card-body"><tspan font-weight="700" fill="#15803d">• Net Acceleration:</tspan> 1.4×–2.0× overall inference and training throughput</text>
  </g>

  <!-- ====================================================================== -->
  <!-- BOTTOM CONTAINER: Compiler Spectrum                                   -->
  <!-- ====================================================================== -->
  <rect x="20" y="348" width="700" height="88" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="32" y="364" font-size="9" font-weight="700" fill="#334155">Compilation Time vs. Runtime Speedup Trade-Off Across Systems</text>

  <!-- Tier 1: torch.compile -->
  <rect x="32" y="374" width="216" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="32" y="374" width="216" height="18" rx="2" fill="#e0f2fe"/>
  <text x="140" y="387" text-anchor="middle" class="tier-title" fill="#0369a1">torch.compile (Inductor)</text>
  <text x="40" y="405" class="tier-sub" fill="#334155"><tspan font-weight="700">Compile Time:</tspan> 5–30 seconds (JIT warm-up)</text>
  <text x="40" y="418" class="tier-sub" fill="#15803d"><tspan font-weight="700">Throughput Gain:</tspan> 1.3×–1.8× (rapid iteration)</text>

  <!-- Tier 2: OpenXLA / JAX -->
  <rect x="262" y="374" width="216" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="262" y="374" width="216" height="18" rx="2" fill="#fef3c7"/>
  <text x="370" y="387" text-anchor="middle" class="tier-title" fill="#b45309">OpenXLA / JAX AOT</text>
  <text x="270" y="405" class="tier-sub" fill="#334155"><tspan font-weight="700">Compile Time:</tspan> 1–10 minutes (AOT graph compilation)</text>
  <text x="270" y="418" class="tier-sub" fill="#15803d"><tspan font-weight="700">Throughput Gain:</tspan> 1.4×–2.0× (cluster training)</text>

  <!-- Tier 3: TensorRT-LLM -->
  <rect x="492" y="374" width="216" height="52" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <rect x="492" y="374" width="216" height="18" rx="2" fill="#dcfce7"/>
  <text x="600" y="387" text-anchor="middle" class="tier-title" fill="#15803d">TensorRT-LLM / TVM</text>
  <text x="500" y="405" class="tier-sub" fill="#334155"><tspan font-weight="700">Compile Time:</tspan> 15–60 minutes (exhaustive autotune)</text>
  <text x="500" y="418" class="tier-sub" fill="#15803d"><tspan font-weight="700">Throughput Gain:</tspan> 1.8×–2.8× (serving deployment)</text>

  <!-- ===== Bottom Footnote ===== -->
  <text x="370" y="458" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    Modern compilers decompose transformation into distinct lowering tiers: frontends trace graphs, mid-ends optimize dataflow, and backends generate hardware kernels.
  </text>
</svg>