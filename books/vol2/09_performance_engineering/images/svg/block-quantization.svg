<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="100%" height="100%">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .card-title { font-size: 11px; font-weight: 700; }
    .card-sub { font-size: 8.5px; }
    .section-lbl { font-size: 9px; font-weight: 700; fill: #475569; }
    .cell-val { font-size: 8px; font-weight: 500; }
    .cell-outlier { font-size: 8px; font-weight: 700; fill: #dc2626; }
    .scale-txt { font-size: 8px; font-weight: 700; }
    .annot-title { font-size: 9px; font-weight: 700; }
    .annot-body { font-size: 8px; fill: #334155; }
    .status-lbl { font-size: 9px; font-weight: 700; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- LEFT PANEL: Per-Tensor Quantization (Failure Case)                     -->
  <!-- ====================================================================== -->
  <rect x="20" y="16" width="340" height="382" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Left Header Banner -->
  <rect x="32" y="26" width="316" height="34" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="190" y="41" text-anchor="middle" class="card-title" fill="#b91c1c">Per-Tensor Quantization</text>
  <text x="190" y="53" text-anchor="middle" class="card-sub" fill="#dc2626">Single scale factor applied across entire tensor</text>

  <!-- FP16 Original Weights -->
  <text x="36" y="80" class="section-lbl">Original FP16 Weights:</text>
  
  <g transform="translate(34, 88)">
    <!-- 8 weight cells (7 normal, 1 outlier at index 4) -->
    <rect x="0" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="18" y="17" text-anchor="middle" class="cell-val" fill="#0369a1">0.12</text>

    <rect x="39" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="57" y="17" text-anchor="middle" class="cell-val" fill="#0369a1">-0.08</text>

    <rect x="78" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="96" y="17" text-anchor="middle" class="cell-val" fill="#0369a1">0.21</text>

    <rect x="117" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="135" y="17" text-anchor="middle" class="cell-val" fill="#0369a1">-0.15</text>

    <!-- Outlier Cell -->
    <rect x="156" y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="174" y="17" text-anchor="middle" class="cell-outlier">58.7</text>

    <rect x="195" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="213" y="17" text-anchor="middle" class="cell-val" fill="#0369a1">0.09</text>

    <rect x="234" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="252" y="17" text-anchor="middle" class="cell-val" fill="#0369a1">0.33</text>

    <rect x="273" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="291" y="17" text-anchor="middle" class="cell-val" fill="#0369a1">-0.07</text>
  </g>

  <!-- Single Scale Bracket -->
  <rect x="34" y="124" width="312" height="22" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="190" y="138" text-anchor="middle" class="scale-txt" fill="#b45309">Single Global Scale: s = max(|W|) / 127 = 58.7 / 127 ≈ 0.462</text>

  <!-- Arrow down -->
  <path d="M 190,146 L 190,166" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>

  <!-- Quantized INT8 Weights -->
  <text x="36" y="180" class="section-lbl">Quantized INT8 Weights (W_q = round(W / s)):</text>

  <g transform="translate(34, 188)">
    <rect x="0" y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="18" y="17" text-anchor="middle" class="cell-val" fill="#dc2626">0</text>

    <rect x="39" y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="57" y="17" text-anchor="middle" class="cell-val" fill="#dc2626">0</text>

    <rect x="78" y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="96" y="17" text-anchor="middle" class="cell-val" fill="#dc2626">0</text>

    <rect x="117" y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="135" y="17" text-anchor="middle" class="cell-val" fill="#dc2626">0</text>

    <!-- Outlier preserved -->
    <rect x="156" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="174" y="17" text-anchor="middle" class="cell-val" fill="#0284c7" font-weight="700">127</text>

    <rect x="195" y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="213" y="17" text-anchor="middle" class="cell-val" fill="#dc2626">0</text>

    <rect x="234" y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="252" y="17" text-anchor="middle" class="cell-val" fill="#dc2626">1</text>

    <rect x="273" y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="291" y="17" text-anchor="middle" class="cell-val" fill="#dc2626">0</text>
  </g>

  <!-- Error Impact Card -->
  <rect x="32" y="226" width="316" height="52" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="42" y="242" class="annot-title" fill="#b91c1c">Outlier Crushes Dynamic Range</text>
  <text x="42" y="256" class="annot-body">Normal weights are rounded to 0 or 1. Representational capacity</text>
  <text x="42" y="268" class="annot-body">collapses across the entire tensor, causing severe accuracy drops.</text>

  <!-- Outcome Badge -->
  <rect x="32" y="290" width="316" height="42" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <circle cx="56" cy="311" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="56" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">✗</text>
  <text x="76" y="307" class="status-lbl" fill="#b91c1c">Catastrophic Perplexity Degradation</text>
  <text x="76" y="321" font-size="8" fill="#64748b">Zero scale metadata overhead, but unacceptable accuracy loss</text>

  <!-- Bottom stat box -->
  <rect x="32" y="344" width="316" height="42" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="190" y="360" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Effective Bit-Depth: ~1 bit (7 of 8 values zeroed)</text>
  <text x="190" y="374" text-anchor="middle" font-size="8" fill="#64748b">Metadata: 1 FP16 scale per tensor (~0% overhead)</text>

  <!-- ====================================================================== -->
  <!-- RIGHT PANEL: Block-Wise Quantization (Modern Standard)                 -->
  <!-- ====================================================================== -->
  <rect x="380" y="16" width="340" height="382" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Right Header Banner -->
  <rect x="392" y="26" width="316" height="34" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="550" y="41" text-anchor="middle" class="card-title" fill="#15803d">Block-Wise Quantization</text>
  <text x="550" y="53" text-anchor="middle" class="card-sub" fill="#16a34a">Independent scale factor per group of B weights (e.g., B=4 shown)</text>

  <!-- FP16 Original Weights -->
  <text x="396" y="80" class="section-lbl">Original FP16 Weights (Grouped into Blocks):</text>
  
  <g transform="translate(394, 88)">
    <!-- Block 1 (Cells 0..3) -->
    <rect x="-2" y="-2" width="153" height="30" rx="3" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="0" y="0" width="36" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="18" y="17" text-anchor="middle" class="cell-val" fill="#15803d">0.12</text>

    <rect x="39" y="0" width="36" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="57" y="17" text-anchor="middle" class="cell-val" fill="#15803d">-0.08</text>

    <rect x="78" y="0" width="36" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="96" y="17" text-anchor="middle" class="cell-val" fill="#15803d">0.21</text>

    <rect x="117" y="0" width="36" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="135" y="17" text-anchor="middle" class="cell-val" fill="#15803d">-0.15</text>

    <!-- Block 2 (Cells 4..7) -->
    <rect x="154" y="-2" width="153" height="30" rx="3" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="156" y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="174" y="17" text-anchor="middle" class="cell-outlier">58.7</text>

    <rect x="195" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="213" y="17" text-anchor="middle" class="cell-val" fill="#0369a1">0.09</text>

    <rect x="234" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="252" y="17" text-anchor="middle" class="cell-val" fill="#0369a1">0.33</text>

    <rect x="273" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="291" y="17" text-anchor="middle" class="cell-val" fill="#0369a1">-0.07</text>
  </g>

  <!-- Two Per-Block Scale Brackets -->
  <g transform="translate(394, 124)">
    <!-- Scale 1 -->
    <rect x="0" y="0" width="150" height="22" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="75" y="14" text-anchor="middle" class="scale-txt" fill="#15803d">s₁ = 0.21 / 127 ≈ 0.00165</text>

    <!-- Scale 2 -->
    <rect x="156" y="0" width="150" height="22" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="231" y="14" text-anchor="middle" class="scale-txt" fill="#b45309">s₂ = 58.7 / 127 ≈ 0.462</text>
  </g>

  <!-- Arrows down -->
  <path d="M 469,146 L 469,166" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <path d="M 625,146 L 625,166" fill="none" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-green)"/>

  <!-- Quantized INT8 Weights -->
  <text x="396" y="180" class="section-lbl">Quantized INT8 Weights (High Resolution Preserved):</text>

  <g transform="translate(394, 188)">
    <!-- Block 1 (High precision restored) -->
    <rect x="0" y="0" width="36" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="18" y="17" text-anchor="middle" class="cell-val" fill="#15803d" font-weight="700">73</text>

    <rect x="39" y="0" width="36" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="57" y="17" text-anchor="middle" class="cell-val" fill="#15803d" font-weight="700">-48</text>

    <rect x="78" y="0" width="36" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="96" y="17" text-anchor="middle" class="cell-val" fill="#15803d" font-weight="700">127</text>

    <rect x="117" y="0" width="36" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="135" y="17" text-anchor="middle" class="cell-val" fill="#15803d" font-weight="700">-91</text>

    <!-- Block 2 (Absorbs outlier locally) -->
    <rect x="156" y="0" width="36" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="174" y="17" text-anchor="middle" class="cell-val" fill="#0284c7" font-weight="700">127</text>

    <rect x="195" y="0" width="36" height="26" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="213" y="17" text-anchor="middle" class="cell-val" fill="#475569">0</text>

    <rect x="234" y="0" width="36" height="26" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="252" y="17" text-anchor="middle" class="cell-val" fill="#475569">1</text>

    <rect x="273" y="0" width="36" height="26" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="291" y="17" text-anchor="middle" class="cell-val" fill="#475569">0</text>
  </g>

  <!-- Error Containment Card -->
  <rect x="392" y="226" width="316" height="52" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="402" y="242" class="annot-title" fill="#15803d">Outlier Damage Strictly Contained</text>
  <text x="402" y="256" class="annot-body">Block 1 retains full INT8 resolution across all normal weights.</text>
  <text x="402" y="268" class="annot-body">Only Block 2 absorbs the outlier; adjacent blocks remain unaffected.</text>

  <!-- Outcome Badge -->
  <rect x="392" y="290" width="316" height="42" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <circle cx="416" cy="311" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="416" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">✓</text>
  <text x="436" y="307" class="status-lbl" fill="#15803d">Lossless Dynamic Range Preservation</text>
  <text x="436" y="321" font-size="8" fill="#64748b">Standard in AWQ, GPTQ, and FP4/FP8 (B=32 or B=64)</text>

  <!-- Bottom stat box -->
  <rect x="392" y="344" width="316" height="42" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="550" y="360" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Effective Bit-Depth: 7.8+ bits (unimpaired)</text>
  <text x="550" y="374" text-anchor="middle" font-size="8" fill="#64748b">Metadata: 1 FP16 scale per 64 weights (+3.1% storage overhead)</text>

  <!-- ===== Bottom Note ===== -->
  <text x="370" y="420" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    Block-wise quantization isolates activation and weight outliers. Block size B=64 or 128 balances precision against scale storage overhead.
  </text>
</svg>
