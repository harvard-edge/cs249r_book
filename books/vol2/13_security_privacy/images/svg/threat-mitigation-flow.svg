<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-flow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Header Row -->
    <g transform="translate(30, 16)">
      <rect x="0" y="0" width="260" height="26" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="130" y="17" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="0.5">THREAT VECTOR</text>

      <rect x="310" y="0" width="260" height="26" rx="3" fill="#f0f9ff" stroke="#D4E2F0" stroke-width="1"/>
      <text x="440" y="17" font-size="10.5" font-weight="700" fill="#14294E" text-anchor="middle" letter-spacing="0.5">DETECTION &amp; AUDITING</text>

      <rect x="620" y="0" width="260" height="26" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="750" y="17" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle" letter-spacing="0.5">DEFENSIVE MITIGATION</text>
    </g>

    <!-- ROW 1: MODEL THEFT -->
    <g transform="translate(30, 56)">
      <!-- Container Background Strip -->
      <rect x="0" y="0" width="880" height="106" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Threat Card (Left) -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="240" height="86" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
        <rect x="8" y="8" width="84" height="18" rx="2" fill="#fee2e2"/>
        <text x="50" y="20" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">MODEL THEFT</text>
        <text x="100" y="21" font-size="11" font-weight="700" fill="#0f172a">API Extraction</text>
        <text x="10" y="42" font-size="8.5" fill="#475569">Adversary clones model behavior</text>
        <text x="10" y="55" font-size="8.5" fill="#475569">or steals weights via high-volume</text>
        <text x="10" y="68" font-size="8.5" fill="#475569">systematic API queries.</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <line x1="260" y1="53" x2="300" y2="53" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-flow)"/>

      <!-- Detection Card (Center) -->
      <g transform="translate(310, 10)">
        <rect x="0" y="0" width="240" height="86" rx="3" fill="#ffffff" stroke="#D4E2F0" stroke-width="1.2"/>
        <rect x="8" y="8" width="94" height="18" rx="2" fill="#EAF1F8"/>
        <text x="55" y="20" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">RATE PROFILING</text>
        <text x="110" y="21" font-size="11" font-weight="700" fill="#0f172a">Query Telemetry</text>
        <text x="10" y="42" font-size="8.5" fill="#475569">Detect burst query volume, out-of-</text>
        <text x="10" y="55" font-size="8.5" fill="#475569">distribution synthetic probes, and</text>
        <text x="10" y="68" font-size="8.5" fill="#475569">automated scraping patterns.</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <line x1="560" y1="53" x2="600" y2="53" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Mitigation Card (Right) -->
      <g transform="translate(610, 10)">
        <rect x="0" y="0" width="260" height="86" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
        <rect x="8" y="8" width="94" height="18" rx="2" fill="#dcfce7"/>
        <text x="55" y="20" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">WATERMARKING</text>
        <text x="110" y="21" font-size="11" font-weight="700" fill="#0f172a">Rate Limits &amp; Enclaves</text>
        <text x="10" y="42" font-size="8.5" fill="#14532d">Embed traceable verification signatures;</text>
        <text x="10" y="55" font-size="8.5" fill="#14532d">enforce user token quotas; truncate soft</text>
        <text x="10" y="68" font-size="8.5" fill="#14532d">logits to top-1 class labels.</text>
      </g>
    </g>

    <!-- ROW 2: DATA POISONING -->
    <g transform="translate(30, 174)">
      <!-- Container Background Strip -->
      <rect x="0" y="0" width="880" height="106" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Threat Card (Left) -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="240" height="86" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
        <rect x="8" y="8" width="84" height="18" rx="2" fill="#fee2e2"/>
        <text x="50" y="20" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">POISONING</text>
        <text x="100" y="21" font-size="11" font-weight="700" fill="#0f172a">Corrupted Data</text>
        <text x="10" y="42" font-size="8.5" fill="#475569">Attacker injects backdoor triggers</text>
        <text x="10" y="55" font-size="8.5" fill="#475569">or flips critical ground-truth labels</text>
        <text x="10" y="68" font-size="8.5" fill="#475569">during pipeline ingestion.</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <line x1="260" y1="53" x2="300" y2="53" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-flow)"/>

      <!-- Detection Card (Center) -->
      <g transform="translate(310, 10)">
        <rect x="0" y="0" width="240" height="86" rx="3" fill="#ffffff" stroke="#D4E2F0" stroke-width="1.2"/>
        <rect x="8" y="8" width="94" height="18" rx="2" fill="#EAF1F8"/>
        <text x="55" y="20" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">ANOMALY SCAN</text>
        <text x="110" y="21" font-size="11" font-weight="700" fill="#0f172a">Spectral Validation</text>
        <text x="10" y="42" font-size="8.5" fill="#475569">Track gradient variance trajectories;</text>
        <text x="10" y="55" font-size="8.5" fill="#475569">spectral signature analysis on feature</text>
        <text x="10" y="68" font-size="8.5" fill="#475569">embeddings to isolate clusters.</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <line x1="560" y1="53" x2="600" y2="53" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Mitigation Card (Right) -->
      <g transform="translate(610, 10)">
        <rect x="0" y="0" width="260" height="86" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
        <rect x="8" y="8" width="94" height="18" rx="2" fill="#dcfce7"/>
        <text x="55" y="20" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">SANITIZATION</text>
        <text x="110" y="21" font-size="11" font-weight="700" fill="#0f172a">Provenance &amp; Robust Opt</text>
        <text x="10" y="42" font-size="8.5" fill="#14532d">Cryptographic data provenance (SBOM);</text>
        <text x="10" y="55" font-size="8.5" fill="#14532d">trimmed mean gradient aggregation;</text>
        <text x="10" y="68" font-size="8.5" fill="#14532d">automatic quarantine of outlier batches.</text>
      </g>
    </g>

    <!-- ROW 3: ADVERSARIAL EXAMPLES -->
    <g transform="translate(30, 292)">
      <!-- Container Background Strip -->
      <rect x="0" y="0" width="880" height="106" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Threat Card (Left) -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="240" height="86" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
        <rect x="8" y="8" width="84" height="18" rx="2" fill="#fee2e2"/>
        <text x="50" y="20" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">EVASION</text>
        <text x="100" y="21" font-size="11" font-weight="700" fill="#0f172a">Adversarial Input</text>
        <text x="10" y="42" font-size="8.5" fill="#475569">Imperceptible norm-bounded or</text>
        <text x="10" y="55" font-size="8.5" fill="#475569">physical patch perturbations designed</text>
        <text x="10" y="68" font-size="8.5" fill="#475569">to trigger severe misclassification.</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <line x1="260" y1="53" x2="300" y2="53" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-flow)"/>

      <!-- Detection Card (Center) -->
      <g transform="translate(310, 10)">
        <rect x="0" y="0" width="240" height="86" rx="3" fill="#ffffff" stroke="#D4E2F0" stroke-width="1.2"/>
        <rect x="8" y="8" width="94" height="18" rx="2" fill="#EAF1F8"/>
        <text x="55" y="20" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">INPUT PROBING</text>
        <text x="110" y="21" font-size="11" font-weight="700" fill="#0f172a">Boundary Proximity</text>
        <text x="10" y="42" font-size="8.5" fill="#475569">Feature squeezing divergence tests;</text>
        <text x="10" y="55" font-size="8.5" fill="#475569">high-frequency noise spectrum checks;</text>
        <text x="10" y="68" font-size="8.5" fill="#475569">monitoring decision boundary distance.</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <line x1="560" y1="53" x2="600" y2="53" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Mitigation Card (Right) -->
      <g transform="translate(610, 10)">
        <rect x="0" y="0" width="260" height="86" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
        <rect x="8" y="8" width="94" height="18" rx="2" fill="#dcfce7"/>
        <text x="55" y="20" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">ROBUSTNESS</text>
        <text x="110" y="21" font-size="11" font-weight="700" fill="#0f172a">Adversarial Training</text>
        <text x="10" y="42" font-size="8.5" fill="#14532d">Madry PGD adversarial training;</text>
        <text x="10" y="55" font-size="8.5" fill="#14532d">randomized smoothing for certified L2 radii;</text>
        <text x="10" y="68" font-size="8.5" fill="#14532d">spatial transformations &amp; bit depth reduction.</text>
      </g>
    </g>

    <!-- ROW 4: MEMBERSHIP INFERENCE -->
    <g transform="translate(30, 410)">
      <!-- Container Background Strip -->
      <rect x="0" y="0" width="880" height="106" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Threat Card (Left) -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="240" height="86" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
        <rect x="8" y="8" width="84" height="18" rx="2" fill="#fee2e2"/>
        <text x="50" y="20" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">PRIVACY LEAK</text>
        <text x="100" y="21" font-size="11" font-weight="700" fill="#0f172a">Membership Inference</text>
        <text x="10" y="42" font-size="8.5" fill="#475569">Attacker queries target model to</text>
        <text x="10" y="55" font-size="8.5" fill="#475569">infer whether a specific individual's</text>
        <text x="10" y="68" font-size="8.5" fill="#475569">record was in the training set.</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <line x1="260" y1="53" x2="300" y2="53" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-flow)"/>

      <!-- Detection Card (Center) -->
      <g transform="translate(310, 10)">
        <rect x="0" y="0" width="240" height="86" rx="3" fill="#ffffff" stroke="#D4E2F0" stroke-width="1.2"/>
        <rect x="8" y="8" width="94" height="18" rx="2" fill="#EAF1F8"/>
        <text x="55" y="20" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">GAP AUDITING</text>
        <text x="110" y="21" font-size="11" font-weight="700" fill="#0f172a">Generalization Discrepancy</text>
        <text x="10" y="42" font-size="8.5" fill="#475569">Evaluate loss/confidence variance</text>
        <text x="10" y="55" font-size="8.5" fill="#475569">between train set and holdout validation;</text>
        <text x="10" y="68" font-size="8.5" fill="#475569">empirical shadow model probing tests.</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <line x1="560" y1="53" x2="600" y2="53" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Mitigation Card (Right) -->
      <g transform="translate(610, 10)">
        <rect x="0" y="0" width="260" height="86" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
        <rect x="8" y="8" width="94" height="18" rx="2" fill="#dcfce7"/>
        <text x="55" y="20" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">BOUNDED DP</text>
        <text x="110" y="21" font-size="11" font-weight="700" fill="#0f172a">DP-SGD &amp; Regularization</text>
        <text x="10" y="42" font-size="8.5" fill="#14532d">Formal (ε, δ)-differential privacy bounds;</text>
        <text x="10" y="55" font-size="8.5" fill="#14532d">gradient clipping with Gaussian noise;</text>
        <text x="10" y="68" font-size="8.5" fill="#14532d">weight decay and dropout to prevent memorization.</text>
      </g>
    </g>
  </g>
</svg>