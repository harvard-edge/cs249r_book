<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="282" fill="#ffffff"/>
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-size="12" fill="#6d28d9">pairwise masks cancel: <tspan font-weight="700">s</tspan><tspan font-size="10.5" dy="3">kj</tspan><tspan dy="-3" dx="3">= −</tspan><tspan font-weight="700">s</tspan><tspan font-size="10.5" dy="3">jk</tspan><tspan dy="-3">, so</tspan><tspan dx="3.5" font-weight="700">r</tspan>₁ + <tspan font-weight="700">r</tspan>₂ + <tspan font-weight="700">r</tspan>₃ + <tspan font-weight="700">r</tspan>₄ = 0</text>
  <!-- ===== Client 1 ===== -->
  <rect x="15" y="40" width="155" height="112" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="92" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Client 1</text>
  <text x="23" y="84" font-size="12" fill="#14294E"><tspan font-weight="700">g</tspan>₁</text>
  <text x="160" y="84" text-anchor="end" font-size="12"  fill="#14294E">[0.3, −0.1, 0.5]</text>
  <text x="23" y="106" font-size="12" fill="#6d28d9"><tspan font-weight="700">r</tspan>₁</text>
  <text x="160" y="106" text-anchor="end" font-size="12"  fill="#6d28d9">[1.4, 0.9, −0.8]</text>
  <path d="M23,116 H162" stroke="#94a3b8" stroke-width="0.8" fill="none"/>
  <text x="23" y="136" font-size="12" font-weight="700" fill="#0f172a">y₁</text>
  <text x="160" y="136" text-anchor="end" font-size="12" font-weight="700"  fill="#0f172a">[1.7, 0.8, −0.3]</text>
  <path d="M92,152 V186" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <!-- ===== Client 2 ===== -->
  <rect x="180" y="40" width="155" height="112" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="257" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Client 2</text>
  <text x="188" y="84" font-size="12" fill="#14294E"><tspan font-weight="700">g</tspan>₂</text>
  <text x="325" y="84" text-anchor="end" font-size="12"  fill="#14294E">[0.1, 0.4, −0.2]</text>
  <text x="188" y="106" font-size="12" fill="#6d28d9"><tspan font-weight="700">r</tspan>₂</text>
  <text x="325" y="106" text-anchor="end" font-size="12"  fill="#6d28d9">[−0.9, 0.7, 0.8]</text>
  <path d="M188,116 H327" stroke="#94a3b8" stroke-width="0.8" fill="none"/>
  <text x="188" y="136" font-size="12" font-weight="700" fill="#0f172a">y₂</text>
  <text x="325" y="136" text-anchor="end" font-size="12" font-weight="700"  fill="#0f172a">[−0.8, 1.1, 0.6]</text>
  <path d="M257,152 V186" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <!-- ===== Client 3 ===== -->
  <rect x="345" y="40" width="155" height="112" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="422" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Client 3</text>
  <text x="353" y="84" font-size="12" fill="#14294E"><tspan font-weight="700">g</tspan>₃</text>
  <text x="490" y="84" text-anchor="end" font-size="12"  fill="#14294E">[−0.2, 0.3, 0.1]</text>
  <text x="353" y="106" font-size="12" fill="#6d28d9"><tspan font-weight="700">r</tspan>₃</text>
  <text x="490" y="106" text-anchor="end" font-size="12"  fill="#6d28d9">[0.7, −0.7, 1.1]</text>
  <path d="M353,116 H492" stroke="#94a3b8" stroke-width="0.8" fill="none"/>
  <text x="353" y="136" font-size="12" font-weight="700" fill="#0f172a">y₃</text>
  <text x="490" y="136" text-anchor="end" font-size="12" font-weight="700"  fill="#0f172a">[0.5, −0.4, 1.2]</text>
  <path d="M422,152 V186" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <!-- ===== Client 4 ===== -->
  <rect x="510" y="40" width="155" height="112" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="587" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Client 4</text>
  <text x="518" y="84" font-size="12" fill="#14294E"><tspan font-weight="700">g</tspan>₄</text>
  <text x="655" y="84" text-anchor="end" font-size="12"  fill="#14294E">[0.2, −0.3, 0.4]</text>
  <text x="518" y="106" font-size="12" fill="#6d28d9"><tspan font-weight="700">r</tspan>₄</text>
  <text x="655" y="106" text-anchor="end" font-size="12"  fill="#6d28d9">[−1.2, −0.9, −1.1]</text>
  <path d="M518,116 H657" stroke="#94a3b8" stroke-width="0.8" fill="none"/>
  <text x="518" y="136" font-size="12" font-weight="700" fill="#0f172a">y₄</text>
  <text x="655" y="136" text-anchor="end" font-size="12" font-weight="700"  fill="#0f172a">[−1.0, −1.2, −0.7]</text>
  <path d="M587,152 V186" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <text x="100" y="174" font-size="12" fill="#15803d">only <tspan font-weight="700">y</tspan></text>
  <!-- ===== Server ===== -->
  <rect x="15" y="188" width="650" height="76" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Server sums the masked vectors</text>
  <text x="340" y="232" text-anchor="middle" font-size="12" fill="#0f172a">Σ <tspan font-weight="700">y</tspan><tspan font-size="10.5" dy="3">k</tspan><tspan dy="-3" dx="3">= Σ</tspan><tspan dx="3.5" font-weight="700">g</tspan><tspan font-size="10.5" dy="3">k</tspan><tspan dy="-3" dx="3">+ Σ</tspan><tspan dx="3.5" font-weight="700">r</tspan><tspan font-size="10.5" dy="3">k</tspan></text>
  <text x="340" y="252" text-anchor="middle" font-size="12"  fill="#0f172a">= [0.4, 0.3, 0.8] + [0, 0, 0]</text>
</svg>
