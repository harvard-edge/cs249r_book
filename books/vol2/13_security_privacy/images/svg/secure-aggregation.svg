<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="sa-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="sa-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="sa-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- STEP 1: Local Gradient Computation -->
    <g transform="translate(30, 24)">
      <rect x="0" y="0" width="900" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="12" y="10" width="60" height="20" rx="2" fill="#e0f2fe"/>
      <text x="42" y="24" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">STEP 1</text>
      <text x="82" y="24" font-size="12" font-weight="700" fill="#0f172a">Local Model Training on Private Data</text>
      <text x="350" y="24" font-size="10" fill="#64748b">Each participant computes raw gradient vector gᵢ locally; raw data never leaves device</text>

      <!-- 4 Clients -->
      <g transform="translate(16, 36)">
        <!-- Client 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="202" height="46" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#0369a1">Client 1 (Edge Node)</text>
          <text x="12" y="34" font-size="9.5" font-family="monospace" fill="#0c4a6e">g₁ = [+0.3, -0.1, +0.5]</text>
        </g>
        <!-- Client 2 -->
        <g transform="translate(222, 0)">
          <rect x="0" y="0" width="202" height="46" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#0369a1">Client 2 (Edge Node)</text>
          <text x="12" y="34" font-size="9.5" font-family="monospace" fill="#0c4a6e">g₂ = [+0.1, +0.4, -0.2]</text>
        </g>
        <!-- Client 3 -->
        <g transform="translate(444, 0)">
          <rect x="0" y="0" width="202" height="46" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#0369a1">Client 3 (Edge Node)</text>
          <text x="12" y="34" font-size="9.5" font-family="monospace" fill="#0c4a6e">g₃ = [-0.2, +0.3, +0.1]</text>
        </g>
        <!-- Client 4 -->
        <g transform="translate(666, 0)">
          <rect x="0" y="0" width="202" height="46" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#0369a1">Client 4 (Edge Node)</text>
          <text x="12" y="34" font-size="9.5" font-family="monospace" fill="#0c4a6e">g₄ = [+0.2, -0.3, +0.4]</text>
        </g>
      </g>
    </g>

    <!-- STEP 2: Pairwise Zero-Sum Masking -->
    <g transform="translate(30, 126)">
      <rect x="0" y="0" width="900" height="106" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      <rect x="12" y="10" width="60" height="20" rx="2" fill="#fef3c7"/>
      <text x="42" y="24" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">STEP 2</text>
      <text x="82" y="24" font-size="12" font-weight="700" fill="#78350f">Diffie-Hellman Pairwise Mask Agreement</text>
      <text x="360" y="24" font-size="10" fill="#92400e">Pairwise mask invariant: s_{i,j} = -s_{j,i}. Total mask sum cancels: Σ rᵢ = Σ Σ s_{i,j} = 0</text>

      <!-- Masked vectors -->
      <g transform="translate(16, 36)">
        <!-- Masked 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="202" height="60" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#b45309">Client 1 + Mask (r₁)</text>
          <text x="12" y="33" font-size="8.5" fill="#a16207">r₁ = [+1.4, +0.9, -0.8]</text>
          <text x="12" y="49" font-size="9.5" font-family="monospace" font-weight="700" fill="#78350f">y₁ = [+1.7, +0.8, -0.3]</text>
        </g>
        <!-- Masked 2 -->
        <g transform="translate(222, 0)">
          <rect x="0" y="0" width="202" height="60" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#b45309">Client 2 + Mask (r₂)</text>
          <text x="12" y="33" font-size="8.5" fill="#a16207">r₂ = [-0.9, +0.7, +0.8]</text>
          <text x="12" y="49" font-size="9.5" font-family="monospace" font-weight="700" fill="#78350f">y₂ = [-0.8, +1.1, +0.6]</text>
        </g>
        <!-- Masked 3 -->
        <g transform="translate(444, 0)">
          <rect x="0" y="0" width="202" height="60" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#b45309">Client 3 + Mask (r₃)</text>
          <text x="12" y="33" font-size="8.5" fill="#a16207">r₃ = [+0.7, -0.7, +1.1]</text>
          <text x="12" y="49" font-size="9.5" font-family="monospace" font-weight="700" fill="#78350f">y₃ = [+0.5, -0.4, +1.2]</text>
        </g>
        <!-- Masked 4 -->
        <g transform="translate(666, 0)">
          <rect x="0" y="0" width="202" height="60" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#b45309">Client 4 + Mask (r₄)</text>
          <text x="12" y="33" font-size="8.5" fill="#a16207">r₄ = [-1.2, -0.9, -1.1]</text>
          <text x="12" y="49" font-size="9.5" font-family="monospace" font-weight="700" fill="#78350f">y₄ = [-1.0, -1.2, -0.7]</text>
        </g>
      </g>
    </g>

    <!-- STEP 3: Masked Uplink to Server -->
    <g transform="translate(30, 242)">
      <rect x="0" y="0" width="900" height="74" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="12" y="10" width="60" height="20" rx="2" fill="#f1f5f9"/>
      <text x="42" y="24" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">STEP 3</text>
      <text x="82" y="24" font-size="12" font-weight="700" fill="#0f172a">Masked Transmission over Encrypted TLS Transport</text>
      <text x="440" y="24" font-size="10" fill="#64748b">Server observes only randomized pseudo-noise vectors yᵢ; individual gᵢ remain strictly hidden</text>

      <!-- 4 Uplink Stream Cards -->
      <g transform="translate(16, 36)">
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="202" height="28" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
          <text x="101" y="18" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Transmit y₁ = [+1.7, +0.8, -0.3] ➔</text>
        </g>
        <g transform="translate(222, 0)">
          <rect x="0" y="0" width="202" height="28" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
          <text x="101" y="18" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Transmit y₂ = [-0.8, +1.1, +0.6] ➔</text>
        </g>
        <g transform="translate(444, 0)">
          <rect x="0" y="0" width="202" height="28" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
          <text x="101" y="18" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Transmit y₃ = [+0.5, -0.4, +1.2] ➔</text>
        </g>
        <g transform="translate(666, 0)">
          <rect x="0" y="0" width="202" height="28" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
          <text x="101" y="18" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Transmit y₄ = [-1.0, -1.2, -0.7] ➔</text>
        </g>
      </g>
    </g>

    <!-- STEP 4: Server Aggregation & Exact Mask Cancellation -->
    <g transform="translate(30, 326)">
      <rect x="0" y="0" width="900" height="88" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="12" y="10" width="60" height="20" rx="2" fill="#dcfce7"/>
      <text x="42" y="24" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">STEP 4</text>
      <text x="82" y="24" font-size="12" font-weight="700" fill="#14532d">Central Server Aggregation (Zero-Knowledge Sum)</text>
      <text x="410" y="24" font-size="10" fill="#166534">Server sums received vectors: masks cancel out algebraically to zero</text>

      <!-- Sum Formula Card -->
      <g transform="translate(16, 36)">
        <rect x="0" y="0" width="868" height="42" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
        <text x="18" y="26" font-size="11" font-family="monospace" fill="#0f172a">
          <tspan font-weight="700" fill="#166534">Σ yᵢ</tspan> = (g₁+r₁) + (g₂+r₂) + (g₃+r₃) + (g₄+r₄) = <tspan font-weight="700" fill="#0369a1">(g₁+g₂+g₃+g₄)</tspan> + <tspan font-weight="700" fill="#dc2626">(r₁+r₂+r₃+r₄ = 0)</tspan> = <tspan font-weight="700" fill="#15803d">[+0.4, +0.3, +0.8]</tspan>
        </text>
      </g>
    </g>

    <!-- COMPARISON & GUARANTEES (Bottom Row) -->
    <g transform="translate(30, 424)">
      <!-- What Server Learns -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="440" height="92" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <rect x="12" y="10" width="160" height="20" rx="2" fill="#dcfce7"/>
        <text x="92" y="24" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">WHAT THE SERVER LEARNS</text>
        <text x="14" y="48" font-size="11" font-weight="700" fill="#14532d">Exact Fleet Aggregate: Σ gᵢ = [+0.4, +0.3, +0.8]</text>
        <text x="14" y="66" font-size="9.5" fill="#166534">• Global model weights update cleanly without bias or distortion</text>
        <text x="14" y="80" font-size="9.5" fill="#166534">• Compatible with central differential privacy for provable epsilon bounds</text>
      </g>

      <!-- What Server Cannot Learn -->
      <g transform="translate(460, 0)">
        <rect x="0" y="0" width="440" height="92" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
        <rect x="12" y="10" width="190" height="20" rx="2" fill="#fee2e2"/>
        <text x="107" y="24" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">WHAT THE SERVER CANNOT LEARN</text>
        <text x="14" y="48" font-size="11" font-weight="700" fill="#991b1b">Zero Knowledge of Individual Client Updates</text>
        <text x="14" y="66" font-size="9.5" fill="#b91c1c">• Deep Leakage from Gradients (DLG) input inversion is mathematically defeated</text>
        <text x="14" y="80" font-size="9.5" fill="#b91c1c">• Threshold t-of-n secret sharing tolerates device dropouts and network latency</text>
      </g>
    </g>
  </g>
</svg>