<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 680 350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="-6" width="680" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <!-- pairwise secret links: one arc per client pair -->
  <path d="M73,84 C73,62.7 235,62.7 235,84" stroke="#7E317B" stroke-width="1" fill="none"/>
  <path d="M97,84 C97,44.0 397,44.0 397,84" stroke="#7E317B" stroke-width="1" fill="none"/>
  <path d="M121,84 C121,25.3 559,25.3 559,84" stroke="#7E317B" stroke-width="1" fill="none"/>
  <path d="M259,84 C259,62.7 421,62.7 421,84" stroke="#7E317B" stroke-width="1" fill="none"/>
  <path d="M283,84 C283,44.0 583,44.0 583,84" stroke="#7E317B" stroke-width="1" fill="none"/>
  <path d="M445,84 C445,62.7 607,62.7 607,84" stroke="#7E317B" stroke-width="1" fill="none"/>
  <circle cx="73" cy="84" r="2" fill="#7E317B"/>
  <circle cx="97" cy="84" r="2" fill="#7E317B"/>
  <circle cx="121" cy="84" r="2" fill="#7E317B"/>
  <circle cx="235" cy="84" r="2" fill="#7E317B"/>
  <circle cx="259" cy="84" r="2" fill="#7E317B"/>
  <circle cx="283" cy="84" r="2" fill="#7E317B"/>
  <circle cx="397" cy="84" r="2" fill="#7E317B"/>
  <circle cx="421" cy="84" r="2" fill="#7E317B"/>
  <circle cx="445" cy="84" r="2" fill="#7E317B"/>
  <circle cx="559" cy="84" r="2" fill="#7E317B"/>
  <circle cx="583" cy="84" r="2" fill="#7E317B"/>
  <circle cx="607" cy="84" r="2" fill="#7E317B"/>
  <text x="340" y="26" text-anchor="middle" font-size="12" fill="#7E317B">pairwise secrets <tspan font-weight="700">s</tspan><tspan font-size="11" dy="3" font-style="italic">k,j</tspan><tspan dy="-3" dx="3">= −</tspan><tspan font-weight="700">s</tspan><tspan font-size="11" dy="3" font-style="italic">j,k</tspan></text>
  <!-- ===== Client 1 ===== -->
  <rect x="20" y="84" width="154" height="116" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="28" y="104" font-size="12" font-weight="700" fill="#14294E">Client 1</text>
  <text x="165" y="104" text-anchor="end" font-size="11" fill="#475569">on device</text>
  <rect x="24" y="112" width="146" height="46" rx="2" fill="#ffffff" fill-opacity="0.55" stroke="#1F407A" stroke-width="0.9" stroke-dasharray="3 2"/>
  <text x="30" y="130" font-size="12" fill="#14294E"><tspan font-weight="700">g</tspan><tspan font-size="11" dy="3">1</tspan></text>
  <text x="163" y="130" text-anchor="end" font-size="12" fill="#14294E">[0.3, −0.1, 0.5]</text>
  <text x="30" y="150" font-size="12" fill="#7E317B"><tspan font-weight="700">r</tspan><tspan font-size="11" dy="3">1</tspan></text>
  <text x="163" y="150" text-anchor="end" font-size="12" fill="#7E317B">[1.4, 0.9, −0.8]</text>
  <text x="30" y="182" font-size="12" font-weight="700" fill="#0f172a">y<tspan font-size="11" font-weight="400" dy="3">1</tspan></text>
  <text x="163" y="182" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">[1.7, 0.8, −0.3]</text>
  <path d="M97,200 V236" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arr-gray)"/>
  <!-- ===== Client 2 ===== -->
  <rect x="182" y="84" width="154" height="116" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="190" y="104" font-size="12" font-weight="700" fill="#14294E">Client 2</text>
  <rect x="186" y="112" width="146" height="46" rx="2" fill="#ffffff" fill-opacity="0.55" stroke="#1F407A" stroke-width="0.9" stroke-dasharray="3 2"/>
  <text x="192" y="130" font-size="12" fill="#14294E"><tspan font-weight="700">g</tspan><tspan font-size="11" dy="3">2</tspan></text>
  <text x="325" y="130" text-anchor="end" font-size="12" fill="#14294E">[0.1, 0.4, −0.2]</text>
  <text x="192" y="150" font-size="12" fill="#7E317B"><tspan font-weight="700">r</tspan><tspan font-size="11" dy="3">2</tspan></text>
  <text x="325" y="150" text-anchor="end" font-size="12" fill="#7E317B">[−0.9, 0.7, 0.8]</text>
  <text x="192" y="182" font-size="12" font-weight="700" fill="#0f172a">y<tspan font-size="11" font-weight="400" dy="3">2</tspan></text>
  <text x="325" y="182" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">[−0.8, 1.1, 0.6]</text>
  <path d="M259,200 V236" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arr-gray)"/>
  <!-- ===== Client 3 ===== -->
  <rect x="344" y="84" width="154" height="116" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="352" y="104" font-size="12" font-weight="700" fill="#14294E">Client 3</text>
  <rect x="348" y="112" width="146" height="46" rx="2" fill="#ffffff" fill-opacity="0.55" stroke="#1F407A" stroke-width="0.9" stroke-dasharray="3 2"/>
  <text x="354" y="130" font-size="12" fill="#14294E"><tspan font-weight="700">g</tspan><tspan font-size="11" dy="3">3</tspan></text>
  <text x="487" y="130" text-anchor="end" font-size="12" fill="#14294E">[−0.2, 0.3, 0.1]</text>
  <text x="354" y="150" font-size="12" fill="#7E317B"><tspan font-weight="700">r</tspan><tspan font-size="11" dy="3">3</tspan></text>
  <text x="487" y="150" text-anchor="end" font-size="12" fill="#7E317B">[0.7, −0.7, 1.1]</text>
  <text x="354" y="182" font-size="12" font-weight="700" fill="#0f172a">y<tspan font-size="11" font-weight="400" dy="3">3</tspan></text>
  <text x="487" y="182" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">[0.5, −0.4, 1.2]</text>
  <path d="M421,200 V236" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arr-gray)"/>
  <!-- ===== Client 4 ===== -->
  <rect x="506" y="84" width="154" height="116" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="514" y="104" font-size="12" font-weight="700" fill="#14294E">Client 4</text>
  <rect x="510" y="112" width="146" height="46" rx="2" fill="#ffffff" fill-opacity="0.55" stroke="#1F407A" stroke-width="0.9" stroke-dasharray="3 2"/>
  <text x="516" y="130" font-size="12" fill="#14294E"><tspan font-weight="700">g</tspan><tspan font-size="11" dy="3">4</tspan></text>
  <text x="649" y="130" text-anchor="end" font-size="12" fill="#14294E">[0.2, −0.3, 0.4]</text>
  <text x="516" y="150" font-size="12" fill="#7E317B"><tspan font-weight="700">r</tspan><tspan font-size="11" dy="3">4</tspan></text>
  <text x="649" y="150" text-anchor="end" font-size="12" fill="#7E317B">[−1.2, −0.9, −1.1]</text>
  <text x="516" y="182" font-size="12" font-weight="700" fill="#0f172a">y<tspan font-size="11" font-weight="400" dy="3">4</tspan></text>
  <text x="649" y="182" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">[−1.0, −1.2, −0.7]</text>
  <path d="M583,200 V236" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arr-gray)"/>
  <text x="105" y="223" font-size="12" fill="#475569">only <tspan font-weight="700" fill="#0f172a">y</tspan><tspan font-size="11" dy="3" font-style="italic">k</tspan><tspan dy="-3" dx="3">leaves</tspan></text>
  <!-- ===== Server (outside the privacy boundary) ===== -->
  <rect x="20" y="238" width="640" height="94" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="36" y="262" font-size="12" font-weight="700" fill="#0f172a">Server</text>
  <text x="36" y="278" font-size="11" fill="#475569">sums masked vectors</text>
  <text x="340" y="268" text-anchor="end" font-size="12" fill="#0f172a">Σ <tspan font-weight="700">y</tspan><tspan font-size="11" dy="3" font-style="italic">k</tspan><tspan dy="-3" dx="3">= Σ</tspan><tspan dx="3.5" font-weight="700">g</tspan><tspan font-size="11" dy="3" font-style="italic">k</tspan><tspan dy="-3" dx="3">+</tspan></text>
  <text x="345" y="268" font-size="12" fill="#7E317B">Σ <tspan font-weight="700">r</tspan><tspan font-size="11" dy="3" font-style="italic">k</tspan></text>
  <text x="340" y="292" text-anchor="end" font-size="12" fill="#0f172a">= [0.4, 0.3, 0.8] +</text>
  <text x="345" y="292" font-size="12" font-weight="700" fill="#7E317B">[0, 0, 0]</text>
  <path d="M345,299 v4 H399 v-4 M372,303 v4" stroke="#7E317B" stroke-width="1.1" fill="none"/>
  <text x="372" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#7E317B">masks cancel</text>
</svg>
