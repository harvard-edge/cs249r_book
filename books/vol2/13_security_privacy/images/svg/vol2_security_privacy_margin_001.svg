<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="64pt" viewBox="0 0 180 128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Scale: 150 px = 128 MiB (134.2 MB) SGX EPC. ResNet-50 FP32 102.2 MB = 76%; ResNet-18 INT8 11.7 MB. -->
  <rect x="158" y="18" width="14" height="104" fill="#f2d7d5" opacity="0.5"/>
  <line x1="8" y1="122" x2="172" y2="122" stroke="#cccccc" stroke-width="1.2"/>
  <text x="172" y="13" font-size="12" fill="#DC2626" text-anchor="end">EPC 128 MiB</text>
  <text x="8" y="36" font-size="12" fill="#333333">ResNet-50 FP32</text>
  <rect x="8" y="41" width="114.4" height="24" fill="#1F407A"/>
  <text x="118" y="57.5" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">102.2 MB</text>
  <text x="8" y="86" font-size="12" fill="#333333">ResNet-18 INT8</text>
  <rect x="8" y="91" width="13.1" height="24" fill="#1F407A"/>
  <text x="26" y="107.5" font-size="12" fill="#333333">11.7 MB</text>
  <line x1="158" y1="18" x2="158" y2="122" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5 3"/>
</svg>
