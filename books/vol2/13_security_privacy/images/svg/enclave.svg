<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-green-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-gray-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== System on chip ===== -->
  <rect x="20" y="20" width="470" height="360" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="32" y="40" font-size="12" font-weight="700" fill="#0f172a">System on chip</text>

  <!-- Application processor -->
  <rect x="40" y="56" width="200" height="60" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="140" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Application processor</text>
  <text x="140" y="100" text-anchor="middle" font-size="12" fill="#475569">OS kernel and apps</text>

  <!-- ===== Secure Enclave ===== -->
  <rect x="40" y="144" width="430" height="156" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="52" y="162" font-size="12" font-weight="700" fill="#15803d">Secure Enclave</text>

  <rect x="56" y="172" width="150" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="131" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Enclave processor</text>
  <rect x="218" y="172" width="70" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="253" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">TRNG</text>
  <rect x="300" y="172" width="154" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="377" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Memory protection</text>
  <text x="377" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">engine</text>

  <rect x="56" y="232" width="70" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="91" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">PKA</text>
  <rect x="138" y="232" width="90" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="183" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">AES engine</text>
  <rect x="240" y="232" width="110" height="44" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="295" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Root keys</text>

  <!-- Storage AES engine (outside the enclave, inside the SoC) -->
  <rect x="240" y="320" width="160" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="320" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Storage AES engine</text>

  <!-- ===== Off-chip memory and storage ===== -->
  <rect x="520" y="56" width="140" height="164" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">DRAM</text>
  <rect x="530" y="84" width="120" height="40" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="590" y="100" text-anchor="middle" font-size="12" fill="#475569">OS and app</text>
  <text x="590" y="115" text-anchor="middle" font-size="12" fill="#475569">memory</text>
  <rect x="530" y="164" width="120" height="44" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="182" text-anchor="middle" font-size="12" fill="#15803d">enclave memory</text>
  <text x="590" y="198" text-anchor="middle" font-size="12" fill="#15803d">(encrypted)</text>

  <rect x="520" y="236" width="140" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Secure</text>
  <text x="590" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">storage</text>

  <rect x="520" y="320" width="140" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">NAND flash</text>

  <!-- ===== Paths ===== -->
  <!-- AP to ordinary DRAM -->
  <path d="M240,104 H528" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <!-- AP to enclave mailbox -->
  <path d="M140,118 V142" stroke="#64748b" stroke-width="1.2" fill="none" marker-start="url(#arr-gray-start)" marker-end="url(#arr-gray)"/>
  <text x="150" y="134" font-size="12" fill="#475569">mailbox</text>
  <!-- memory protection engine to encrypted DRAM -->
  <path d="M454,194 H528" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <!-- enclave to secure storage over I2C -->
  <path d="M470,258 H518" stroke="#16a34a" stroke-width="1.5" fill="none" marker-start="url(#arr-green-start)" marker-end="url(#arr-green)"/>
  <text x="505" y="250" text-anchor="middle" font-size="12" fill="#15803d">I²C</text>
  <!-- enclave-managed keys to storage AES engine -->
  <path d="M295,276 V318" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <text x="303" y="310" font-size="12" fill="#15803d">keys</text>
  <!-- storage AES engine to NAND -->
  <path d="M400,342 H518" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <text x="444" y="334" text-anchor="middle" font-size="12" fill="#475569">encrypted</text>
</svg>
