<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="enc-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="enc-arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="enc-arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="enc-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- SYSTEM ON CHIP (SoC) Container -->
    <g transform="translate(30, 24)">
      <rect x="0" y="0" width="680" height="492" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="16" y="12" width="164" height="20" rx="2" fill="#e2e8f0"/>
      <text x="98" y="26" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">SYSTEM ON CHIP (SoC)</text>

      <!-- NORMAL WORLD (Top Half) -->
      <g transform="translate(18, 40)">
        <rect x="0" y="0" width="444" height="194" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="12" y="10" width="150" height="20" rx="2" fill="#fee2e2"/>
        <text x="87" y="24" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">NORMAL WORLD (Untrusted)</text>
        <text x="170" y="24" font-size="10" fill="#64748b">Host OS &amp; Hypervisor</text>

        <!-- Application Processor Cores -->
        <g transform="translate(12, 38)">
          <rect x="0" y="0" width="420" height="84" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="18" font-size="11" font-weight="700" fill="#0f172a">Application Processor (AP)</text>

          <g transform="translate(12, 26)">
            <rect x="0" y="0" width="120" height="48" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
            <text x="60" y="20" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">CPU Core Cluster</text>
            <text x="60" y="34" font-size="8.5" fill="#64748b" text-anchor="middle">Linux / OS Kernel</text>
          </g>

          <g transform="translate(142, 26)">
            <rect x="0" y="0" width="120" height="48" rx="2" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
            <text x="60" y="20" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">Neural Engine / GPU</text>
            <text x="60" y="34" font-size="8.5" fill="#0284c7" text-anchor="middle">ML Inference Pipeline</text>
          </g>

          <g transform="translate(272, 26)">
            <rect x="0" y="0" width="136" height="48" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.8"/>
            <text x="68" y="20" font-size="9.5" font-weight="700" fill="#9f1239" text-anchor="middle">Untrusted Domain</text>
            <text x="68" y="34" font-size="8" fill="#be123c" text-anchor="middle">Rootkits / DMA Exploits</text>
          </g>
        </g>

        <!-- NoC Interconnect & Mailbox -->
        <g transform="translate(12, 130)">
          <rect x="0" y="0" width="260" height="52" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">AXI / NoC System Fabric</text>
          <text x="12" y="32" font-size="8.5" fill="#64748b">Direct DMA access to shared peripherals</text>
          <text x="12" y="44" font-size="8" fill="#94a3b8">Untrusted memory routing</text>
        </g>

        <g transform="translate(282, 130)">
          <rect x="0" y="0" width="150" height="52" rx="2" fill="#fefce8" stroke="#fde047" stroke-width="0.8"/>
          <text x="75" y="18" font-size="10" font-weight="700" fill="#854d0e" text-anchor="middle">Hardware Mailbox</text>
          <text x="75" y="32" font-size="8.5" fill="#a16207" text-anchor="middle">Register FIFO</text>
          <text x="75" y="44" font-size="8" fill="#ca8a04" text-anchor="middle">Opaque Descriptors</text>
        </g>
      </g>

      <!-- SECURE WORLD: Secure Enclave Subsystem (Bottom Half) -->
      <g transform="translate(18, 246)">
        <rect x="0" y="0" width="444" height="232" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="6 3"/>
        <rect x="12" y="10" width="160" height="20" rx="2" fill="#ddd6fe"/>
        <text x="92" y="24" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">SECURE ENCLAVE (TEE)</text>
        <text x="180" y="24" font-size="9.5" fill="#6d28d9" font-weight="600">Hardware Isolated Boundary</text>

        <!-- Secure Processor -->
        <g transform="translate(12, 38)">
          <rect x="0" y="0" width="200" height="74" rx="4" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
          <rect x="8" y="8" width="130" height="18" rx="2" fill="#ede9fe"/>
          <text x="73" y="21" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">Secure Processor Core</text>
          <text x="8" y="42" font-size="8.5" font-weight="600" fill="#1e1b4b">Dedicated CPU + sepOS</text>
          <text x="8" y="54" font-size="8" fill="#64748b">Isolated SRAM &amp; Boot ROM</text>
          <text x="8" y="66" font-size="8" fill="#64748b">JTAG permanently blown</text>
        </g>

        <!-- Crypto Engines Grid -->
        <g transform="translate(220, 38)">
          <rect x="0" y="0" width="212" height="74" rx="4" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
          <text x="10" y="16" font-size="9.5" font-weight="700" fill="#4c1d95">Hardware Accelerators</text>

          <g transform="translate(8, 24)">
            <rect x="0" y="0" width="94" height="20" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
            <text x="47" y="14" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">TRNG (True RNG)</text>
          </g>

          <g transform="translate(108, 24)">
            <rect x="0" y="0" width="94" height="20" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
            <text x="47" y="14" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">PKA (RSA / ECC)</text>
          </g>

          <g transform="translate(8, 48)">
            <rect x="0" y="0" width="94" height="20" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
            <text x="47" y="14" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">AES-256-GCM</text>
          </g>

          <g transform="translate(108, 48)">
            <rect x="0" y="0" width="94" height="20" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
            <text x="47" y="14" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">SHA-256 Engine</text>
          </g>
        </g>

        <!-- Silicon Key Vault & Tamper Logic -->
        <g transform="translate(12, 122)">
          <rect x="0" y="0" width="420" height="98" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
          <rect x="10" y="8" width="144" height="18" rx="2" fill="#dcfce7"/>
          <text x="82" y="21" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">Silicon Key Vault (RoT)</text>
          <text x="162" y="22" font-size="9" font-weight="700" fill="#14532d">Hardware Non-Exportable Key Anchors</text>

          <g transform="translate(10, 32)">
            <rect x="0" y="0" width="128" height="56" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="0.8"/>
            <text x="64" y="16" font-size="9" font-weight="700" fill="#16a34a" text-anchor="middle">Unique Chip ID (UID)</text>
            <text x="64" y="30" font-size="8" fill="#64748b" text-anchor="middle">Fused into OTP silicon</text>
            <text x="64" y="44" font-size="8" fill="#15803d" text-anchor="middle">Never leaves enclave</text>
          </g>

          <g transform="translate(146, 32)">
            <rect x="0" y="0" width="128" height="56" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="0.8"/>
            <text x="64" y="16" font-size="9" font-weight="700" fill="#16a34a" text-anchor="middle">Device Group ID (GID)</text>
            <text x="64" y="30" font-size="8" fill="#64748b" text-anchor="middle">Model class key</text>
            <text x="64" y="44" font-size="8" fill="#15803d" text-anchor="middle">Firmware attestation</text>
          </g>

          <g transform="translate(282, 32)">
            <rect x="0" y="0" width="128" height="56" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="0.8"/>
            <text x="64" y="16" font-size="9" font-weight="700" fill="#16a34a" text-anchor="middle">Anti-Replay Counter</text>
            <text x="64" y="30" font-size="8" fill="#64748b" text-anchor="middle">Monotonic NV counters</text>
            <text x="64" y="44" font-size="8" fill="#dc2626" text-anchor="middle">Downgrade defeat</text>
          </g>
        </g>
      </g>

      <!-- MEMORY & STORAGE CONTROLLERS (Right Column inside SoC) -->
      <g transform="translate(476, 40)">
        <rect x="0" y="0" width="190" height="438" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="95" y="22" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">MEMORY &amp; STORAGE PHY</text>

        <!-- DRAM Memory Controller (Plaintext) -->
        <g transform="translate(10, 34)">
          <rect x="0" y="0" width="170" height="96" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
          <text x="85" y="18" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">DRAM Controller</text>
          <text x="85" y="32" font-size="8.5" fill="#0284c7" text-anchor="middle">Dual-channel LPDDR PHY</text>
          <rect x="8" y="42" width="154" height="46" rx="2" fill="#ffffff" stroke="#e0f2fe" stroke-width="0.8"/>
          <text x="85" y="58" font-size="8.5" font-weight="600" fill="#0f172a" text-anchor="middle">Normal Allocation Bus</text>
          <text x="85" y="72" font-size="8" fill="#64748b" text-anchor="middle">Direct AP plain DMA</text>
        </g>

        <!-- Memory Protection Engine (MPE) -->
        <g transform="translate(10, 142)">
          <rect x="0" y="0" width="170" height="142" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
          <rect x="8" y="8" width="154" height="20" rx="2" fill="#ede9fe"/>
          <text x="85" y="22" font-size="9" font-weight="700" fill="#5b21b6" text-anchor="middle">Memory Protection (MPE)</text>
          
          <g transform="translate(8, 34)">
            <rect x="0" y="0" width="154" height="32" rx="2" fill="#ffffff" stroke="#ddd6fe" stroke-width="0.8"/>
            <text x="77" y="14" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">AES-XTS Encryption</text>
            <text x="77" y="25" font-size="7.5" fill="#7c3aed" text-anchor="middle">Hardware line-rate scrambler</text>
          </g>

          <g transform="translate(8, 70)">
            <rect x="0" y="0" width="154" height="32" rx="2" fill="#ffffff" stroke="#ddd6fe" stroke-width="0.8"/>
            <text x="77" y="14" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Integrity Merkle Tree</text>
            <text x="77" y="25" font-size="7.5" fill="#7c3aed" text-anchor="middle">Anti-replay MAC verification</text>
          </g>

          <text x="85" y="118" font-size="8" font-weight="600" fill="#4c1d95" text-anchor="middle">Ephemeral Silicon Keys</text>
          <text x="85" y="130" font-size="7.5" fill="#64748b" text-anchor="middle">Regenerated on reboot</text>
        </g>

        <!-- NAND Storage Controller -->
        <g transform="translate(10, 296)">
          <rect x="0" y="0" width="170" height="96" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="85" y="18" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">NAND Flash Controller</text>
          <text x="85" y="32" font-size="8.5" fill="#64748b" text-anchor="middle">NVMe / UFS Storage PHY</text>
          <rect x="8" y="42" width="154" height="46" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
          <text x="85" y="58" font-size="8.5" font-weight="600" fill="#0f172a" text-anchor="middle">Inline Storage AES</text>
          <text x="85" y="72" font-size="8" fill="#15803d" text-anchor="middle">Enclave-wrapped volume keys</text>
        </g>

        <text x="95" y="420" font-size="8" fill="#94a3b8" text-anchor="middle">SoC Memory Boundary PHY</text>
      </g>
    </g>

    <!-- EXTERNAL OFF-CHIP COMPONENTS (Right Column) -->
    <g transform="translate(730, 24)">
      <!-- External DRAM Package -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="200" height="236" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <rect x="12" y="10" width="176" height="20" rx="2" fill="#e2e8f0"/>
        <text x="100" y="24" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">EXTERNAL DRAM (Off-Chip)</text>

        <!-- Plaintext DRAM Section -->
        <g transform="translate(12, 36)">
          <rect x="0" y="0" width="176" height="76" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="88" y="18" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Host OS DRAM Area</text>
          <text x="88" y="32" font-size="8.5" fill="#64748b" text-anchor="middle">Unencrypted User / OS space</text>
          <text x="88" y="46" font-size="8.5" fill="#64748b" text-anchor="middle">Kernel buffers, public models</text>
          <rect x="10" y="54" width="156" height="16" rx="2" fill="#fee2e2"/>
          <text x="88" y="66" font-size="8" font-weight="600" fill="#b91c1c" text-anchor="middle">Physically Probing Vulnerable</text>
        </g>

        <!-- Encrypted Enclave Carve-Out Section -->
        <g transform="translate(12, 120)">
          <rect x="0" y="0" width="176" height="104" rx="3" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
          <rect x="10" y="8" width="156" height="18" rx="2" fill="#ddd6fe"/>
          <text x="88" y="21" font-size="9" font-weight="700" fill="#5b21b6" text-anchor="middle">Enclave Encrypted Carve-Out</text>
          <text x="88" y="40" font-size="8.5" font-weight="600" fill="#6d28d9" text-anchor="middle">AES-XTS Ciphertext + MACs</text>
          <text x="88" y="54" font-size="8" fill="#4c1d95" text-anchor="middle">Protected Model Weights</text>
          <text x="88" y="66" font-size="8" fill="#4c1d95" text-anchor="middle">Private Biometric Templates</text>
          <rect x="10" y="76" width="156" height="20" rx="2" fill="#dcfce7"/>
          <text x="88" y="90" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Hardware Isolated Trust</text>
        </g>
      </g>

      <!-- External Flash Storage -->
      <g transform="translate(0, 248)">
        <rect x="0" y="0" width="200" height="100" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <rect x="12" y="10" width="176" height="20" rx="2" fill="#e2e8f0"/>
        <text x="100" y="24" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">NAND FLASH STORAGE</text>
        <text x="100" y="48" font-size="9" font-weight="600" fill="#0f172a" text-anchor="middle">Encrypted Checkpoints &amp; OS</text>
        <text x="100" y="62" font-size="8.5" fill="#64748b" text-anchor="middle">AES-CBC / XTS Volume Crypt</text>
        <text x="100" y="78" font-size="8" fill="#15803d" font-weight="600" text-anchor="middle">Cryptographically Wrapped Weights</text>
      </g>

      <!-- Security Guarantees Summary Box -->
      <g transform="translate(0, 360)">
        <rect x="0" y="0" width="200" height="156" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <rect x="12" y="10" width="176" height="20" rx="2" fill="#dcfce7"/>
        <text x="100" y="24" font-size="9.5" font-weight="700" fill="#16a34a" text-anchor="middle">SECURITY GUARANTEES</text>
        <text x="14" y="46" font-size="8.5" font-weight="700" fill="#14532d">1. Host OS Blindness</text>
        <text x="14" y="58" font-size="7.5" fill="#166534">Compromised kernel cannot read</text>
        <text x="14" y="68" font-size="7.5" fill="#166534">enclave registers or memory.</text>
        <text x="14" y="84" font-size="8.5" font-weight="700" fill="#14532d">2. Cold-Boot Defense</text>
        <text x="14" y="96" font-size="7.5" fill="#166534">DRAM contents scrambled with</text>
        <text x="14" y="106" font-size="7.5" fill="#166534">ephemeral keys on power-cycle.</text>
        <text x="14" y="122" font-size="8.5" font-weight="700" fill="#14532d">3. Hardware Key Sealing</text>
        <text x="14" y="134" font-size="7.5" fill="#166534">Model weights decrypted only</text>
        <text x="14" y="144" font-size="7.5" fill="#166534">inside enclave silicon execution.</text>
      </g>
    </g>

    <!-- Clean Orthogonal Connections -->
    <!-- AP to DRAM Controller -->
    <path d="M 492 195 L 506 195 L 506 110 L 516 110" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#enc-arr-blue)"/>

    <!-- DRAM Controller to External Plaintext DRAM -->
    <line x1="686" y1="110" x2="742" y2="110" stroke="#0284c7" stroke-width="1.5" marker-end="url(#enc-arr-blue)"/>

    <!-- Secure Enclave to MPE -->
    <path d="M 462 310 L 486 310" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#enc-arr-purple)"/>

    <!-- MPE to External Encrypted DRAM Carve-Out -->
    <line x1="686" y1="230" x2="742" y2="230" stroke="#7c3aed" stroke-width="2" marker-end="url(#enc-arr-purple)"/>

    <!-- NAND Controller to External Flash Storage -->
    <line x1="686" y1="380" x2="742" y2="380" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#enc-arr-green)"/>

    <!-- Mailbox communication between AP and Secure Enclave -->
    <path d="M 375 222 L 375 270" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#enc-arr-amber)"/>
  </g>
</svg>