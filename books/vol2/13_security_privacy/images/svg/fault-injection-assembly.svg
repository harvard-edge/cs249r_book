<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="440" fill="#ffffff"/>

  <!-- Outer container card -->
  <rect x="20" y="15" width="740" height="410" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title header -->
  <rect x="20" y="15" width="740" height="38" rx="8" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="36" y="39" font-size="13" font-weight="700" fill="#1F407A">AVR Assembly Execution Trace: ReLU Activation Under Laser Fault Injection</text>

  <!-- Code editor pane -->
  <rect x="35" y="65" width="460" height="345" rx="6" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Code lines (monospace) -->
  <g font-family="'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.5">
    <!-- Line 1 -->
    <text x="48" y="90" fill="#94A3B8">01</text>
    <text x="75" y="90" font-weight="600" fill="#1F407A">ldi</text>
    <text x="120" y="90" fill="#0F172A">r1, 0</text>
    <text x="240" y="90" fill="#64748B">; load 0 into register r1</text>

    <!-- Line 2 -->
    <text x="48" y="116" fill="#94A3B8">02</text>
    <text x="75" y="116" font-weight="600" fill="#1F407A">cp</text>
    <text x="120" y="116" fill="#0F172A">r1, r15</text>
    <text x="240" y="116" fill="#64748B">; compare MSB of Accum to r1</text>

    <!-- Line 3: FAULT TARGET (Highlighted) -->
    <rect x="36" y="130" width="458" height="30" fill="#FEE2E2" fill-opacity="0.85"/>
    <rect x="36" y="130" width="4" height="30" fill="#DC2626"/>
    <text x="48" y="150" font-weight="700" fill="#DC2626">03</text>
    <text x="75" y="150" font-weight="700" fill="#DC2626">brge</text>
    <text x="120" y="150" font-weight="700" fill="#DC2626">else</text>
    <text x="240" y="150" fill="#991B1B">; jump to else if 0 &gt;= Accum</text>

    <!-- Line 4 -->
    <text x="48" y="184" fill="#94A3B8">04</text>
    <text x="75" y="184" font-weight="600" fill="#1F407A">movw</text>
    <text x="120" y="184" fill="#0F172A">r10, r15</text>
    <text x="240" y="184" fill="#64748B">; HiddenLayerOutput[i] = Accum</text>

    <!-- Line 5 -->
    <text x="48" y="210" fill="#94A3B8">05</text>
    <text x="75" y="210" font-weight="600" fill="#1F407A">movw</text>
    <text x="120" y="210" fill="#0F172A">r12, r17</text>
    <text x="240" y="210" fill="#64748B">; HiddenLayerOutput[i] = Accum</text>

    <!-- Line 6 -->
    <text x="48" y="236" fill="#94A3B8">06</text>
    <text x="75" y="236" font-weight="600" fill="#1F407A">jmp</text>
    <text x="120" y="236" fill="#0F172A">end</text>
    <text x="240" y="236" fill="#64748B">; jump past else branch</text>

    <!-- Line 7: else block (Corrupted Target) -->
    <rect x="36" y="248" width="458" height="126" fill="#FEF2F2" fill-opacity="0.4"/>
    <text x="48" y="266" fill="#94A3B8">07</text>
    <text x="75" y="266" font-weight="700" fill="#B91C1C">else:</text>
    <text x="120" y="266" font-weight="600" fill="#1F407A">clr</text>
    <text x="150" y="266" fill="#0F172A">r10</text>
    <text x="240" y="266" fill="#64748B">; HiddenLayerOutput[i] = 0</text>

    <!-- Line 8 -->
    <text x="48" y="292" fill="#94A3B8">08</text>
    <text x="120" y="292" font-weight="600" fill="#1F407A">clr</text>
    <text x="150" y="292" fill="#0F172A">r11</text>
    <text x="240" y="292" fill="#64748B">; HiddenLayerOutput[i] = 0</text>

    <!-- Line 9 -->
    <text x="48" y="318" fill="#94A3B8">09</text>
    <text x="120" y="318" font-weight="600" fill="#1F407A">clr</text>
    <text x="150" y="318" fill="#0F172A">r12</text>
    <text x="240" y="318" fill="#64748B">; HiddenLayerOutput[i] = 0</text>

    <!-- Line 10 -->
    <text x="48" y="344" fill="#94A3B8">10</text>
    <text x="120" y="344" font-weight="600" fill="#1F407A">clr</text>
    <text x="150" y="344" fill="#0F172A">r13</text>
    <text x="240" y="344" fill="#64748B">; HiddenLayerOutput[i] = 0</text>

    <!-- Line 11 -->
    <text x="48" y="372" fill="#94A3B8">11</text>
    <text x="75" y="372" font-weight="700" fill="#475569">end:</text>
    <text x="120" y="372" fill="#64748B">...</text>
    <text x="240" y="372" fill="#64748B">; continue normal execution</text>
  </g>

  <!-- Right side: Analytical Explanations & Systems Impact -->
  <!-- Box 1: Injection Mechanism -->
  <rect x="510" y="65" width="235" height="155" rx="6" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="510" y="65" width="235" height="28" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="522" y="84" font-size="11" font-weight="700" fill="#DC2626">Injected Glitch Mechanism</text>

  <!-- Laser / Pulse Icon -->
  <path d="M525 105 L535 120 L528 120 L538 140" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="548" y="112" font-size="9.5" font-weight="600" fill="#0F172A">Pulsed Laser / Clock Drop:</text>
  <text x="548" y="128" font-size="9" fill="#475569">Targets instruction fetch / decode</text>
  <text x="548" y="142" font-size="9" fill="#475569">during cycle of line 03 (<tspan font-family="monospace" font-weight="600" fill="#DC2626">brge</tspan>).</text>

  <text x="522" y="168" font-size="9.5" font-weight="600" fill="#B91C1C">Branch Suppression:</text>
  <text x="522" y="184" font-size="9" fill="#475569">Processor interprets instruction as</text>
  <text x="522" y="198" font-size="9" fill="#475569"><tspan font-family="monospace" font-weight="600">NOP</tspan> or corrupts condition flags.</text>

  <!-- Connector arrow from Code line 03 to Injection Mechanism box -->
  <path d="M495 145 L508 145" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Box 2: Semantic Impact -->
  <rect x="510" y="235" width="235" height="175" rx="6" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="510" y="235" width="235" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="522" y="254" font-size="11" font-weight="700" fill="#B45309">Neuron Semantic Corruption</text>

  <text x="522" y="280" font-size="9.5" font-weight="600" fill="#0F172A">Forced Fall-Through:</text>
  <text x="522" y="296" font-size="9" fill="#475569">Even when <tspan font-family="monospace" font-weight="600">Accum &gt; 0</tspan>, the processor</text>
  <text x="522" y="310" font-size="9" fill="#475569">falls into lines 07–10 (<tspan font-family="monospace" font-weight="600">clr</tspan> instructions).</text>

  <text x="522" y="336" font-size="9.5" font-weight="700" fill="#DC2626">Output Neutralization:</text>
  <text x="522" y="352" font-size="9" font-family="monospace" fill="#0F172A">HiddenLayerOutput[i] = 0.0</text>

  <text x="522" y="376" font-size="9" fill="#475569">Completely disables ReLU activation,</text>
  <text x="522" y="392" font-size="9" fill="#475569">zeroing critical feature detector.</text>
</svg>
