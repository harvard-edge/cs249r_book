<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="760" height="370" fill="white"/><rect x="20" y="20" width="405" height="330" rx="3" fill="#EAF1F8" stroke="#1F407A"/>
<text x="38" y="47" font-family="Courier New, monospace" font-size="14" fill="#0f172a">01  ldi r1, 0</text>
<text x="38" y="74" font-family="Courier New, monospace" font-size="14" fill="#0f172a">02  cp r1, r15</text>
<text x="38" y="101" font-family="Courier New, monospace" font-size="14" fill="#0f172a">03  brge else</text>
<text x="38" y="128" font-family="Courier New, monospace" font-size="14" fill="#0f172a">04  movw r10, r15</text>
<text x="38" y="155" font-family="Courier New, monospace" font-size="14" fill="#0f172a">05  movw r12, r17</text>
<rect x="28" y="164" width="389" height="25" fill="#fee2e2"/>
<text x="38" y="182" font-family="Courier New, monospace" font-size="14" fill="#b91c1c">06  jmp end</text>
<text x="38" y="209" font-family="Courier New, monospace" font-size="14" fill="#0f172a">07  else: clr r10</text>
<text x="38" y="236" font-family="Courier New, monospace" font-size="14" fill="#0f172a">08  clr r11</text>
<text x="38" y="263" font-family="Courier New, monospace" font-size="14" fill="#0f172a">09  clr r12</text>
<text x="38" y="290" font-family="Courier New, monospace" font-size="14" fill="#0f172a">10  clr r13</text>
<text x="38" y="317" font-family="Courier New, monospace" font-size="14" fill="#0f172a">11  end: ...</text>
<text x="585" y="85" font-size="13" text-anchor="middle" fill="#0f172a">Positive input</text>
<text x="585" y="110" font-size="13" text-anchor="middle" fill="#0f172a">Lines 4–5 copy the activation</text>
<text x="585" y="178" font-size="13" text-anchor="middle" fill="#0f172a">Fault skips line 6</text>
<text x="585" y="205" font-size="13" text-anchor="middle" fill="#0f172a">Execution enters zeroing block</text>
<text x="585" y="260" font-size="13" text-anchor="middle" fill="#0f172a">Lines 7–10 clear the output</text>
<text x="585" y="288" font-size="13" text-anchor="middle" fill="#0f172a">Neuron becomes inactive</text>
