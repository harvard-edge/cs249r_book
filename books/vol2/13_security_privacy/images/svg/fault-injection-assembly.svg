<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16A34A"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base (No Outer Border) -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: INSTRUCTION TRACE & PROGRAM COUNTER                             -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 20)">
    <!-- Subsystem Container Card -->
    <rect width="490" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 486 0 Q 490 0 490 4 L 490 24 L 0 24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="490" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#1F407A" letter-spacing="0.5px">1. PROGRAM COUNTER TRACE (AVR 8-BIT CORE)</text>

    <!-- Code Listing Sub-box -->
    <g transform="translate(14, 36)">
      <rect width="462" height="340" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="18" font-size="8.5" font-weight="700" fill="#334155">Assembly Sequence</text>
      <text x="448" y="18" font-size="8" font-family="'JetBrains Mono', Consolas, monospace" fill="#64748B" text-anchor="end">TinyAES / Micro-ML</text>

      <!-- Code Block -->
      <g transform="translate(12, 30)" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="9">
        <!-- Line 01 -->
        <text x="6" y="16" fill="#94A3B8">01</text>
        <text x="32" y="16" font-weight="700" fill="#1F407A">ldi</text>
        <text x="75" y="16" fill="#0F172A">r1, 0</text>
        <text x="195" y="16" fill="#64748B">; load 0 to r1</text>

        <!-- Line 02 -->
        <text x="6" y="40" fill="#94A3B8">02</text>
        <text x="32" y="40" font-weight="700" fill="#1F407A">cp</text>
        <text x="75" y="40" fill="#0F172A">r1, r15</text>
        <text x="195" y="40" fill="#64748B">; compare MSB(Accum) to r1</text>

        <!-- Line 03: FAULT TARGET -->
        <rect x="0" y="52" width="438" height="26" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
        <text x="6" y="69" font-weight="700" fill="#DC2626">03</text>
        <text x="32" y="69" font-weight="700" fill="#DC2626">brge</text>
        <text x="75" y="69" font-weight="700" fill="#DC2626">else</text>
        <text x="195" y="69" font-weight="600" fill="#991B1B">; branch if 0 &gt;= Accum [FAULT TARGET]</text>

        <!-- Line 04 -->
        <text x="6" y="98" fill="#94A3B8">04</text>
        <text x="32" y="98" font-weight="700" fill="#1F407A">movw</text>
        <text x="75" y="98" fill="#0F172A">r10, r15</text>
        <text x="195" y="98" fill="#64748B">; HiddenLayerOutput[i] = Accum</text>

        <!-- Line 05 -->
        <text x="6" y="122" fill="#94A3B8">05</text>
        <text x="32" y="122" font-weight="700" fill="#1F407A">movw</text>
        <text x="75" y="122" fill="#0F172A">r12, r17</text>
        <text x="195" y="122" fill="#64748B">; HiddenLayerOutput[i] = Accum</text>

        <!-- Line 06 -->
        <text x="6" y="146" fill="#94A3B8">06</text>
        <text x="32" y="146" font-weight="700" fill="#1F407A">jmp</text>
        <text x="75" y="146" fill="#0F172A">end</text>
        <text x="195" y="146" fill="#64748B">; jump past else zeroing</text>

        <!-- Line 07: else block -->
        <rect x="0" y="158" width="438" height="114" rx="2" fill="#FEF2F2" fill-opacity="0.5"/>
        <text x="6" y="176" fill="#94A3B8">07</text>
        <text x="32" y="176" font-weight="700" fill="#B91C1C">else:</text>
        <text x="75" y="176" font-weight="700" fill="#1F407A">clr</text>
        <text x="108" y="176" fill="#0F172A">r10</text>
        <text x="195" y="176" fill="#64748B">; HiddenLayerOutput[i] = 0</text>

        <!-- Line 08 -->
        <text x="6" y="200" fill="#94A3B8">08</text>
        <text x="75" y="200" font-weight="700" fill="#1F407A">clr</text>
        <text x="108" y="200" fill="#0F172A">r11</text>
        <text x="195" y="200" fill="#64748B">; HiddenLayerOutput[i] = 0</text>

        <!-- Line 09 -->
        <text x="6" y="224" fill="#94A3B8">09</text>
        <text x="75" y="224" font-weight="700" fill="#1F407A">clr</text>
        <text x="108" y="224" fill="#0F172A">r12</text>
        <text x="195" y="224" fill="#64748B">; HiddenLayerOutput[i] = 0</text>

        <!-- Line 10 -->
        <text x="6" y="248" fill="#94A3B8">10</text>
        <text x="75" y="248" font-weight="700" fill="#1F407A">clr</text>
        <text x="108" y="248" fill="#0F172A">r13</text>
        <text x="195" y="248" fill="#64748B">; HiddenLayerOutput[i] = 0</text>

        <!-- Line 11 -->
        <text x="6" y="284" fill="#94A3B8">11</text>
        <text x="32" y="284" font-weight="700" fill="#475569">end:</text>
        <text x="75" y="284" fill="#64748B">...</text>
        <text x="195" y="284" fill="#64748B">; continue network inference</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector from Fault Target to Injection Mechanism -->
  <line x1="515" y1="131" x2="535" y2="131" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arr-red)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: HARDWARE GLITCH & MODEL DIVERGENCE                              -->
  <!-- ========================================================================= -->
  <g transform="translate(535, 20)">
    <!-- Subsystem Container Card -->
    <rect width="320" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 316 0 Q 320 0 320 4 L 320 24 L 0 24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="320" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#1F407A" letter-spacing="0.5px">2. FAULT INJECTION DYNAMICS</text>

    <!-- Sub-box 1: Hardware Glitch Mechanism -->
    <g transform="translate(12, 36)">
      <rect width="296" height="156" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#334155">Hardware Trigger &amp; Decode Impact</text>

      <!-- Trigger pill -->
      <g transform="translate(10, 26)">
        <rect width="276" height="34" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
        <text x="10" y="15" font-size="8" font-weight="700" fill="#991B1B">Trigger: Clock Glitch / Laser Pulse</text>
        <text x="10" y="27" font-size="7.5" fill="#DC2626">Targeted at instruction cycle of line 03 (brge)</text>
      </g>

      <!-- Structured Rows (Zero Bullets) -->
      <g transform="translate(10, 68)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="276" height="22" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.7"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#1E293B">Decode Logic:</text>
        <text x="75" y="14" font-size="7.5" fill="#475569">Voltage droop forces decode to NOP</text>

        <!-- Row 2 -->
        <rect x="0" y="26" width="276" height="22" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.7"/>
        <text x="8" y="40" font-size="7.5" font-weight="700" fill="#1E293B">Status Flags:</text>
        <text x="75" y="40" font-size="7.5" fill="#475569">SREG condition flags (Z, S, V) corrupted</text>

        <!-- Row 3 -->
        <rect x="0" y="52" width="276" height="24" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
        <text x="8" y="67" font-size="7.5" font-weight="700" fill="#991B1B">Branch State:</text>
        <text x="75" y="67" font-size="7.5" font-weight="600" fill="#DC2626">Branch skipped; forced fall-through</text>
      </g>
    </g>

    <!-- Sub-box 2: Model Representation Divergence -->
    <g transform="translate(12, 202)">
      <rect width="296" height="174" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#334155">Model Representation Divergence</text>

      <!-- Path comparison chips -->
      <g transform="translate(10, 26)">
        <rect x="0" y="0" width="134" height="42" rx="2" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
        <text x="67" y="16" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">NOMINAL PATH</text>
        <text x="67" y="32" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Output = Accum</text>

        <rect x="142" y="0" width="134" height="42" rx="2" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
        <text x="209" y="16" font-size="7.5" font-weight="700" fill="#B91C1C" text-anchor="middle">CORRUPTED PATH</text>
        <text x="209" y="32" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">Output = 0.0</text>
      </g>

      <!-- Semantic Impact Details (Zero Bullets) -->
      <g transform="translate(10, 76)">
        <rect x="0" y="0" width="276" height="40" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
        <text x="8" y="15" font-size="7.5" font-weight="700" fill="#1E293B">Activation Shift:</text>
        <text x="8" y="29" font-size="7.5" fill="#475569">ReLU activation forcibly clamped to zero</text>

        <rect x="0" y="46" width="276" height="38" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
        <text x="8" y="61" font-size="7.5" font-weight="700" fill="#991B1B">Security Bypass:</text>
        <text x="8" y="75" font-size="7.5" font-weight="600" fill="#DC2626">Safety gate disabled · Layer output suppressed</text>
      </g>
    </g>
  </g>
</svg>
