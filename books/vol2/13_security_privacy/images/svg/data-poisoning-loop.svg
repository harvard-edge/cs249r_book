<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="710" height="400" fill="#ffffff"/>
  <g transform="translate(10,0)">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- ===== Outer loop: attacker ===== -->
  <rect x="110" y="20" width="460" height="100" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Outer loop: attacker</text>
  <text x="340" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Choose poison <tspan font-style="italic">𝒮</tspan><tspan dy="4" font-size="11">poison</tspan></text>
  <text x="340" y="98" text-anchor="middle" font-size="14" fill="#0f172a">max<tspan dy="4" font-size="11" font-style="italic">𝒮</tspan><tspan dy="2" font-size="11">poison</tspan><tspan dy="-6" dx="5" font-style="italic">ℒ</tspan><tspan dy="4" font-size="11">test</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">θ</tspan>*(<tspan font-style="italic">𝒮</tspan><tspan dy="4" font-size="11">poison</tspan><tspan dy="-4">),</tspan><tspan dx="4" font-style="italic">𝒮</tspan><tspan dy="4" font-size="11">test</tspan><tspan dy="-4">)</tspan><tspan dx="14">s.t.</tspan><tspan dx="14">|</tspan><tspan font-style="italic">𝒮</tspan><tspan dy="4" font-size="11">poison</tspan><tspan dy="-4">|</tspan><tspan dx="5">≤</tspan><tspan dx="5" font-style="italic">D</tspan><tspan dy="4" font-size="11">poison</tspan></text>

  <path d="M340,120 V158" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="352" y="143" font-size="12" fill="#b91c1c">inject <tspan font-style="italic">𝒮</tspan><tspan dy="3" font-size="11">poison</tspan></text>

  <!-- ===== Inner loop: training ===== -->
  <rect x="110" y="160" width="460" height="100" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="340" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#1F407A">Inner loop: training</text>
  <text x="340" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Minimize training loss</text>
  <text x="340" y="238" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-style="italic">θ</tspan>*(<tspan font-style="italic">𝒮</tspan><tspan dy="4" font-size="11">poison</tspan><tspan dy="-4">) = arg min</tspan><tspan dy="4" font-size="11" font-style="italic">θ</tspan><tspan dy="-4" dx="4">Σ</tspan><tspan dy="4" font-size="11">(</tspan><tspan font-size="11" font-style="italic">x</tspan><tspan font-size="11">, </tspan><tspan font-size="11" font-style="italic">y</tspan><tspan font-size="11">) ∈ </tspan><tspan font-size="11" font-style="italic">𝒮</tspan><tspan font-size="11"> ∪ </tspan><tspan font-size="11" font-style="italic">𝒮</tspan><tspan dy="2" font-size="11">poison</tspan><tspan dy="-6" dx="5" font-style="italic">ℓ</tspan>(<tspan font-style="italic">f</tspan><tspan dy="4" font-size="11" font-style="italic">θ</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">x</tspan>), <tspan font-style="italic">y</tspan>)</text>

  <!-- inner loop: repeated SGD steps wrap the training card -->
  <path d="M110,230 H80 V190 H108" stroke="#1F407A" stroke-width="1.2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="70" y="196" text-anchor="end" font-size="12" fill="#1F407A">repeated</text>
  <text x="70" y="212" text-anchor="end" font-size="12" fill="#1F407A">SGD</text>
  <text x="70" y="228" text-anchor="end" font-size="12" fill="#1F407A">steps</text>

  <path d="M340,260 V298" stroke="#1F407A" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>
  <text x="352" y="283" font-size="12" fill="#1F407A">trained <tspan font-style="italic">θ</tspan>*</text>

  <!-- ===== Evaluation ===== -->
  <rect x="110" y="300" width="460" height="80" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Evaluation</text>
  <text x="340" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Measure target loss</text>
  <text x="340" y="368" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-style="italic">ℒ</tspan><tspan dy="4" font-size="11">test</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">f</tspan><tspan dy="4" font-size="11" font-style="italic">θ*</tspan><tspan dy="-4">,</tspan><tspan dx="4" font-style="italic">𝒮</tspan><tspan dy="4" font-size="11">test</tspan><tspan dy="-4">)</tspan></text>

  <!-- ===== Outer loop feedback: target loss returns to the attacker (perimeter route) ===== -->
  <path d="M570,340 H610 V70 H572" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="620" y="196" font-size="12" fill="#b91c1c">target</text>
  <text x="620" y="212" font-size="12" fill="#b91c1c">loss</text>
  <text x="620" y="228" font-size="12" fill="#b91c1c">feedback</text>
  </g>
</svg>
