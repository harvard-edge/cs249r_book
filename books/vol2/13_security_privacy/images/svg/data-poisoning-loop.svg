<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-blue-s" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <!-- ===== Outer loop: attacker ===== -->
  <rect x="110" y="20" width="460" height="74" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Outer loop: attacker chooses <tspan font-style="italic">𝒮</tspan><tspan dy="3" font-size="11.5">poison</tspan></text>
  <text x="340" y="76" text-anchor="middle" font-size="14" fill="#0f172a">max<tspan dy="4" font-size="12.2" font-style="italic">𝒮</tspan><tspan dy="2" font-size="12.2">poison</tspan><tspan dy="-6" dx="5" font-style="italic">ℒ</tspan><tspan dy="4" font-size="12.2">test</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">θ</tspan>*(<tspan font-style="italic">𝒮</tspan><tspan dy="4" font-size="12.2">poison</tspan><tspan dy="-4">),</tspan><tspan dx="4" font-style="italic">𝒮</tspan><tspan dy="4" font-size="12.2">test</tspan><tspan dy="-4">)</tspan><tspan dx="14">s.t.</tspan><tspan dx="14">|</tspan><tspan font-style="italic">𝒮</tspan><tspan dy="4" font-size="12.2">poison</tspan><tspan dy="-4">|</tspan><tspan dx="5">≤</tspan><tspan dx="5" font-style="italic">D</tspan><tspan dy="4" font-size="12.2">poison</tspan></text>
  <path d="M245,94 V124" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="257" y="114" text-anchor="start" font-size="12" fill="#b91c1c">inject <tspan font-style="italic">𝒮</tspan><tspan dy="3" font-size="11.5">poison</tspan></text>
  <!-- ===== Combined training set: clean tiles plus injected poison ===== -->
  <g stroke-width="0.8">
    <rect x="151" y="128" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="175" y="128" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="199" y="128" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="223" y="128" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="247" y="128" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="271" y="128" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="295" y="128" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="319" y="128" width="20" height="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="151" y="144" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="175" y="144" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="199" y="144" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="223" y="144" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="247" y="144" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="271" y="144" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="295" y="144" width="20" height="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="319" y="144" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="151" y="160" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="175" y="160" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="199" y="160" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="223" y="160" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="247" y="160" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="271" y="160" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="295" y="160" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="319" y="160" width="20" height="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  </g>
  <text x="355" y="150" text-anchor="start" font-size="13" fill="#0f172a"><tspan font-style="italic">𝒮</tspan> ∪ <tspan font-style="italic">𝒮</tspan><tspan dy="4" font-size="11.5">poison</tspan></text>
  <path d="M245,174 V206" stroke="#1F407A" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>
  <!-- ===== Inner loop: training ===== -->
  <rect x="20" y="208" width="450" height="112" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="245" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#1F407A">Inner loop: defender minimizes training loss</text>
  <text x="245" y="262" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-style="italic">θ</tspan>*(<tspan font-style="italic">𝒮</tspan><tspan dy="4" font-size="12.2">poison</tspan><tspan dy="-4">) = arg min</tspan><tspan dy="4" font-size="12.2" font-style="italic">θ</tspan><tspan dy="-4" dx="4">Σ</tspan><tspan dy="4" font-size="12.2">(</tspan><tspan font-size="12.2" font-style="italic">x</tspan><tspan font-size="12.2">, </tspan><tspan font-size="12.2" font-style="italic">y</tspan><tspan font-size="12.2">) ∈ </tspan><tspan font-size="12.2" font-style="italic">𝒮</tspan><tspan font-size="12.2"> ∪ </tspan><tspan font-size="12.2" font-style="italic">𝒮</tspan><tspan dy="2" font-size="12.2">poison</tspan><tspan dy="-6" dx="5" font-style="italic">ℓ</tspan>(<tspan font-style="italic">f</tspan><tspan dy="4" font-size="12.2" font-style="italic">θ</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">x</tspan>), <tspan font-style="italic">y</tspan>)</text>
  <!-- repeated SGD steps: a small closed loop of parameter updates -->
  <circle cx="150" cy="292" r="5" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="215" cy="292" r="5" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="280" cy="292" r="5" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <path d="M156,292 H208" stroke="#1F407A" stroke-width="1" fill="none" marker-end="url(#arr-blue-s)"/>
  <path d="M221,292 H273" stroke="#1F407A" stroke-width="1" fill="none" marker-end="url(#arr-blue-s)"/>
  <text x="300" y="296" text-anchor="start" font-size="12" fill="#1F407A">…</text>
  <circle cx="330" cy="292" r="5" fill="#1F407A"/>
  <text x="340" y="296" text-anchor="start" font-size="12" fill="#1F407A"><tspan font-style="italic">θ</tspan>*</text>
  <text x="140" y="296" text-anchor="end" font-size="12.2" fill="#1F407A">SGD steps</text>
  <path d="M470,264 H498" stroke="#1F407A" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>
  <text x="484" y="256" text-anchor="middle" font-size="12" fill="#1F407A"><tspan font-style="italic">θ</tspan>*</text>
  <!-- ===== Evaluation ===== -->
  <rect x="500" y="208" width="160" height="112" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Evaluation</text>
  <text x="580" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">target loss</text>
  <text x="580" y="290" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-style="italic">ℒ</tspan><tspan dy="4" font-size="12.2">test</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">f</tspan><tspan dy="4" font-size="12.2" font-style="italic">θ*</tspan><tspan dy="-4">,</tspan><tspan dx="4" font-style="italic">𝒮</tspan><tspan dy="4" font-size="12.2">test</tspan><tspan dy="-4">)</tspan></text>
  <!-- ===== Outer-loop feedback: target loss returns to the attacker ===== -->
  <path d="M640,208 V57 H572" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="630" y="140" text-anchor="end" font-size="12" fill="#b91c1c">target loss</text>
  <text x="630" y="155" text-anchor="end" font-size="12" fill="#b91c1c">refines proposal</text>
</svg>
