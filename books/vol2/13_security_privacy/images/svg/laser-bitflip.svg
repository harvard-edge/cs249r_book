<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="lbf-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="lbf-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="lbf-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="laser-beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- LEFT PANEL: Physical Fault Injection Mechanism -->
    <g transform="translate(30, 24)">
      <rect x="0" y="0" width="440" height="412" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="14" y="12" width="168" height="20" rx="2" fill="#fee2e2"/>
      <text x="98" y="26" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">PHYSICAL FAULT INJECTION</text>
      <text x="190" y="26" font-size="10" fill="#64748b">Die Target &amp; Photocurrent Induction</text>

      <!-- Laser Source Apparatus -->
      <g transform="translate(14, 42)">
        <rect x="0" y="0" width="412" height="66" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <rect x="10" y="10" width="130" height="18" rx="2" fill="#fee2e2"/>
        <text x="75" y="23" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">Focused Laser Source</text>
        <text x="150" y="23" font-size="9" fill="#7f1d1d">Near-Infrared (λ = 1064 nm) Pulsed Beam</text>
        <text x="10" y="44" font-size="8.5" fill="#64748b">Sub-nanosecond optical pulse focused through microscope objective (spot size ≈ 1 µm)</text>
        <text x="10" y="56" font-size="8.5" fill="#dc2626">Penetrates decapped silicon substrate directly targeting transistor junctions</text>
      </g>

      <!-- Silicon Die Schematic -->
      <g transform="translate(14, 120)">
        <rect x="0" y="0" width="412" height="152" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">Microcontroller Die View (Top-Down)</text>

        <!-- Flash Memory Area -->
        <g transform="translate(12, 28)">
          <rect x="0" y="0" width="118" height="110" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="59" y="20" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle">Flash / ROM</text>
          <text x="59" y="34" font-size="8" fill="#64748b" text-anchor="middle">Firmware &amp; Weights</text>
          <text x="59" y="54" font-size="7.5" fill="#94a3b8" text-anchor="middle">Read-only store</text>
        </g>

        <!-- CPU Core Area -->
        <g transform="translate(138, 28)">
          <rect x="0" y="0" width="118" height="110" rx="2" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
          <text x="59" y="20" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">CPU Execution Core</text>
          <text x="59" y="34" font-size="8" fill="#0284c7" text-anchor="middle">ALU &amp; Status Register</text>
          <text x="59" y="54" font-size="7.5" fill="#64748b" text-anchor="middle">Instruction Pipeline</text>
        </g>

        <!-- SRAM Target Area (Hit by Laser) -->
        <g transform="translate(264, 28)">
          <rect x="0" y="0" width="136" height="110" rx="2" fill="#fff1f2" stroke="#f87171" stroke-width="1.2"/>
          <text x="68" y="20" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">SRAM / Register File</text>
          <text x="68" y="34" font-size="8" fill="#dc2626" text-anchor="middle">Target Memory Cell</text>

          <!-- Target bit cell -->
          <g transform="translate(18, 44)">
            <rect x="0" y="0" width="100" height="54" rx="2" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
            <text x="50" y="16" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">Laser Spot (1 µm)</text>
            <text x="50" y="30" font-size="8" fill="#7f1d1d" text-anchor="middle">Transient Photocurrent</text>
            <text x="50" y="44" font-size="9" font-family="monospace" font-weight="700" fill="#b91c1c" text-anchor="middle">Bit: 1 ➔ 0 Flip</text>
          </g>
        </g>
      </g>

      <!-- SRAM Inverter Latch Circuit Detail -->
      <g transform="translate(14, 284)">
        <rect x="0" y="0" width="412" height="116" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="10" y="10" width="130" height="18" rx="2" fill="#e2e8f0"/>
        <text x="75" y="23" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">6T SRAM Cell Dynamics</text>
        <text x="148" y="23" font-size="9" fill="#64748b">Cross-Coupled CMOS Inverter State</text>

        <g transform="translate(12, 38)">
          <rect x="0" y="0" width="180" height="66" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="90" y="18" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">Pre-Attack State (Stable)</text>
          <text x="90" y="34" font-size="9" font-family="monospace" fill="#166534" text-anchor="middle">Q = 1 (VDD), Q# = 0 (GND)</text>
          <text x="90" y="52" font-size="8" fill="#15803d" text-anchor="middle">Check Flag: AUTH_VALID = 1</text>
        </g>

        <g transform="translate(206, 38)">
          <rect x="0" y="0" width="194" height="66" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="0.8"/>
          <text x="97" y="18" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">Post-Pulse State (Inverted)</text>
          <text x="97" y="34" font-size="9" font-family="monospace" fill="#dc2626" text-anchor="middle">I_photo drains Q node to GND</text>
          <text x="97" y="52" font-size="8" fill="#991b1b" text-anchor="middle">Latch flips: AUTH_CHECK = 0 / BYPASSED</text>
        </g>
      </g>
    </g>

    <!-- RIGHT PANEL: Software & ML System Vulnerability -->
    <g transform="translate(490, 24)">
      <rect x="0" y="0" width="440" height="412" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="14" y="12" width="176" height="20" rx="2" fill="#e0f2fe"/>
      <text x="102" y="26" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">CONTROL FLOW HIJACKING</text>
      <text x="198" y="26" font-size="10" fill="#64748b">Instruction Skipping &amp; Bypass</text>

      <!-- Normal Execution Flow -->
      <g transform="translate(14, 42)">
        <rect x="0" y="0" width="412" height="136" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
        <rect x="10" y="10" width="126" height="18" rx="2" fill="#dcfce7"/>
        <text x="73" y="23" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">Normal Execution Path</text>

        <!-- Step 1 -->
        <g transform="translate(10, 36)">
          <rect x="0" y="0" width="118" height="44" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="59" y="16" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">verify_mac()</text>
          <text x="59" y="28" font-size="7.5" fill="#64748b" text-anchor="middle">Check auth token</text>
          <text x="59" y="38" font-size="7.5" font-family="monospace" fill="#0369a1" text-anchor="middle">CMP R0, #1</text>
        </g>

        <!-- Arrow -->
        <line x1="130" y1="58" x2="146" y2="58" stroke="#16a34a" stroke-width="1.5" marker-end="url(#lbf-arr-green)"/>

        <!-- Step 2 -->
        <g transform="translate(148, 36)">
          <rect x="0" y="0" width="118" height="44" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="59" y="16" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">brne .deny_access</text>
          <text x="59" y="28" font-size="7.5" fill="#64748b" text-anchor="middle">Branch on invalid</text>
          <text x="59" y="38" font-size="7.5" font-family="monospace" fill="#166534" text-anchor="middle">Z-flag evaluated</text>
        </g>

        <!-- Arrow -->
        <line x1="268" y1="58" x2="284" y2="58" stroke="#16a34a" stroke-width="1.5" marker-end="url(#lbf-arr-green)"/>

        <!-- Step 3 -->
        <g transform="translate(286, 36)">
          <rect x="0" y="0" width="116" height="44" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
          <text x="58" y="16" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">secure_infer()</text>
          <text x="58" y="28" font-size="7.5" fill="#166534" text-anchor="middle">Execute ML Model</text>
          <text x="58" y="38" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">✓ Validated Entry</text>
        </g>

        <text x="14" y="104" font-size="8.5" fill="#166534">Condition Check: If signature or MAC fails, branch diverts to halt routine</text>
        <text x="14" y="118" font-size="8" fill="#64748b">Only cryptographically authenticated clients can trigger model inference</text>
      </g>

      <!-- Faulted Execution Flow -->
      <g transform="translate(14, 190)">
        <rect x="0" y="0" width="412" height="146" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
        <rect x="10" y="10" width="134" height="18" rx="2" fill="#fee2e2"/>
        <text x="77" y="23" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">Laser Fault Injected Path</text>

        <!-- Faulted Step 1 -->
        <g transform="translate(10, 36)">
          <rect x="0" y="0" width="118" height="44" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="0.8"/>
          <text x="59" y="16" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">verify_mac() ➔ 0</text>
          <text x="59" y="28" font-size="7.5" fill="#dc2626" text-anchor="middle">Failed Auth Check</text>
          <text x="59" y="38" font-size="7.5" font-family="monospace" fill="#b91c1c" text-anchor="middle">Status: REJECT</text>
        </g>

        <!-- Arrow with Laser Pulse -->
        <line x1="130" y1="58" x2="146" y2="58" stroke="#dc2626" stroke-width="1.5" marker-end="url(#lbf-arr-red)"/>

        <!-- Faulted Step 2: Bit Flip Skips Branch -->
        <g transform="translate(148, 36)">
          <rect x="0" y="0" width="118" height="44" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
          <text x="59" y="16" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">⚡ BIT FLIP / NOP</text>
          <text x="59" y="28" font-size="7.5" fill="#7f1d1d" text-anchor="middle">Branch instruction</text>
          <text x="59" y="38" font-size="7.5" font-weight="700" fill="#dc2626" text-anchor="middle">SKIPPED / ZEROED</text>
        </g>

        <!-- Arrow to Hijacked Access -->
        <line x1="268" y1="58" x2="284" y2="58" stroke="#dc2626" stroke-width="1.5" marker-end="url(#lbf-arr-red)"/>

        <!-- Hijacked Outcome -->
        <g transform="translate(286, 36)">
          <rect x="0" y="0" width="116" height="44" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
          <text x="58" y="16" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">UNAUTH INFER</text>
          <text x="58" y="28" font-size="7.5" fill="#b91c1c" text-anchor="middle">Weights Extracted</text>
          <text x="58" y="38" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">⚠ Security Broken</text>
        </g>

        <text x="14" y="104" font-size="8.5" font-weight="700" fill="#dc2626">Exploit Result: Laser pulse forces instruction decoder to read opcode as NOP</text>
        <text x="14" y="118" font-size="8" fill="#991b1b">Attacker bypasses signature check without knowing private keys or password</text>
        <text x="14" y="130" font-size="8" fill="#64748b">In ML systems: forces ReLU bias corruption or extracts raw neural network weights</text>
      </g>

      <!-- ML Vulnerabilities Box -->
      <g transform="translate(14, 348)">
        <rect x="0" y="0" width="412" height="52" rx="4" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
        <text x="10" y="18" font-size="9.5" font-weight="700" fill="#854d0e">Consequences for Machine Learning Workloads</text>
        <text x="10" y="32" font-size="8.5" fill="#a16207">1. Misclassification: flipping layer activation threshold forces targeted false classification</text>
        <text x="10" y="44" font-size="8.5" fill="#a16207">2. Model exfiltration: instruction skip dumps proprietary weights over debug bus</text>
      </g>
    </g>

    <!-- BOTTOM PANEL: Hardware & Systems Defenses -->
    <g transform="translate(30, 448)">
      <rect x="0" y="0" width="900" height="68" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="14" y="12" width="130" height="20" rx="2" fill="#dcfce7"/>
      <text x="79" y="26" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">HARDWARE MITIGATIONS</text>

      <g transform="translate(154, 12)">
        <text x="0" y="15" font-size="9" font-weight="700" fill="#14532d">1. Dual-Core Lockstep (DCLS):</text>
        <text x="156" y="15" font-size="9" fill="#166534">Redundant cores execute cycle-by-cycle comparisons; any mismatch triggers reset</text>
        <text x="0" y="32" font-size="9" font-weight="700" fill="#14532d">2. On-Die Optical Sensors:</text>
        <text x="156" y="32" font-size="9" fill="#166534">Integrated photodiodes detect unauthorized optical exposure, zeroizing keys instantly</text>
        <text x="0" y="48" font-size="9" font-weight="700" fill="#14532d">3. Parity &amp; ECC Hardening:</text>
        <text x="156" y="48" font-size="9" fill="#166534">SEC-DED ECC tags on weight buffers and branch registers trap bit-flip anomalies</text>
      </g>
    </g>
  </g>
</svg>
