<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="262" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <!-- ===== Shared failure outcome ===== -->
  <rect x="110" y="20" width="350" height="28" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="285" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Halt and reject the component</text>
  <!-- ===== Chain of trust: stage, authentication gate, next stage ===== -->
  <rect x="20" y="74" width="86" height="50" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="63" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">1  Immutable</text>
  <text x="63" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">boot root</text>
  <rect x="170" y="74" width="86" height="50" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="213" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">2  Verified</text>
  <text x="213" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">bootloader</text>
  <rect x="320" y="74" width="86" height="50" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="363" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">3  Verified OS</text>
  <text x="363" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">or loader</text>
  <rect x="470" y="74" width="86" height="50" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="513" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">4  Authorized</text>
  <text x="513" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">ML workload</text>

  <path d="M138,83 L154,99 L138,115 L122,99 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M106,99 H120" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M154,99 H168" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <path d="M138,83 V50" stroke="#dc2626" stroke-width="1.2" fill="none" marker-end="url(#arr-red)"/>
  <text x="144" y="68" text-anchor="start" font-size="11" fill="#b91c1c">fail</text>
  <text x="138" y="140" text-anchor="middle" font-size="11" fill="#15803d">authenticate</text>
  <text x="138" y="154" text-anchor="middle" font-size="11" fill="#15803d">bootloader</text>

  <path d="M288,83 L304,99 L288,115 L272,99 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M256,99 H270" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M304,99 H318" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <path d="M288,83 V50" stroke="#dc2626" stroke-width="1.2" fill="none" marker-end="url(#arr-red)"/>
  <text x="294" y="68" text-anchor="start" font-size="11" fill="#b91c1c">fail</text>
  <text x="288" y="140" text-anchor="middle" font-size="11" fill="#15803d">authenticate kernel</text>
  <text x="288" y="154" text-anchor="middle" font-size="11" fill="#15803d">and startup policy</text>

  <path d="M438,83 L454,99 L438,115 L422,99 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M406,99 H420" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M454,99 H468" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <path d="M438,83 V50" stroke="#dc2626" stroke-width="1.2" fill="none" marker-end="url(#arr-red)"/>
  <text x="444" y="68" text-anchor="start" font-size="11" fill="#b91c1c">fail</text>
  <text x="438" y="140" text-anchor="middle" font-size="11" fill="#15803d">authenticate manifest</text>
  <text x="438" y="154" text-anchor="middle" font-size="11" fill="#15803d">and artifact digest</text>

  <!-- ===== Measured boot: evidence recorded, not enforced ===== -->
  <text x="20" y="192" text-anchor="start" font-size="11" font-weight="700" fill="#475569">measurement log</text>
  <path d="M213,124 V176" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" fill="none"/>
  <rect x="170" y="178" width="86" height="20" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="213" y="192" text-anchor="middle" font-size="11" fill="#334155">bootloader hash</text>
  <path d="M363,124 V176" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" fill="none"/>
  <rect x="320" y="178" width="86" height="20" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="363" y="192" text-anchor="middle" font-size="11" fill="#334155">kernel hash</text>
  <path d="M513,124 V176" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" fill="none"/>
  <rect x="470" y="178" width="86" height="20" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="513" y="192" text-anchor="middle" font-size="11" fill="#334155">model digest</text>

  <!-- ===== Extension of the chain to the model artifact ===== -->
  <path d="M422,214 V220 H556 V214" stroke="#1F407A" stroke-width="1" fill="none"/>
  <text x="489" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#1F407A">extension to the model</text>

  <!-- ===== After boot ===== -->
  <path d="M567,68 V204" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
  <text x="620" y="66" text-anchor="middle" font-size="11" fill="#475569">after boot</text>
  <path d="M556,99 H578" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="580" y="74" width="80" height="50" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="620" y="92" text-anchor="middle" font-size="11" fill="#334155">runtime</text>
  <text x="620" y="105" text-anchor="middle" font-size="11" fill="#334155">controls still</text>
  <text x="620" y="118" text-anchor="middle" font-size="11" fill="#334155">required</text>
</svg>
