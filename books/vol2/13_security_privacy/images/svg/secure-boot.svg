<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="640" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== Chain of trust: stage, check, stage, ... ===== -->
  <!-- stage 0 -->
  <rect x="40" y="20" width="300" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="190" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">1  Immutable boot root</text>
  <path d="M190,64 V82" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <!-- check 1 -->
  <rect x="40" y="84" width="300" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="190" y="111" text-anchor="middle" font-size="13" fill="#15803d">Authenticate bootloader</text>
  <path d="M190,128 V146" stroke="#16a34a" stroke-width="1.2" fill="none" marker-end="url(#arr-green)"/>
  <text x="200" y="141" font-size="11" fill="#15803d">pass</text>
  <!-- stage 1 -->
  <rect x="40" y="148" width="300" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="190" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">2  Verified bootloader</text>
  <path d="M190,192 V210" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <!-- check 2 -->
  <rect x="40" y="212" width="300" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="190" y="239" text-anchor="middle" font-size="13" fill="#15803d">Authenticate kernel and startup policy</text>
  <path d="M190,256 V274" stroke="#16a34a" stroke-width="1.2" fill="none" marker-end="url(#arr-green)"/>
  <text x="200" y="269" font-size="11" fill="#15803d">pass</text>
  <!-- stage 2 -->
  <rect x="40" y="276" width="300" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="190" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">3  Verified OS / loader</text>
  <path d="M190,320 V338" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <!-- check 3 -->
  <rect x="40" y="340" width="300" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="190" y="358" text-anchor="middle" font-size="13" fill="#15803d">Authenticate model manifest</text>
  <text x="190" y="374" text-anchor="middle" font-size="13" fill="#15803d">and artifact digest</text>
  <path d="M190,384 V402" stroke="#16a34a" stroke-width="1.2" fill="none" marker-end="url(#arr-green)"/>
  <text x="200" y="397" font-size="11" fill="#15803d">pass</text>
  <!-- stage 3 -->
  <rect x="40" y="404" width="300" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="190" y="431" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">4  Authorized ML workload</text>

  <!-- ===== Failure path: any check halts the chain ===== -->
  <path d="M340,106 H438" stroke="#dc2626" stroke-width="1.2" fill="none" marker-end="url(#arr-red)"/>
  <path d="M340,234 H438" stroke="#dc2626" stroke-width="1.2" fill="none" marker-end="url(#arr-red)"/>
  <path d="M340,362 H438" stroke="#dc2626" stroke-width="1.2" fill="none" marker-end="url(#arr-red)"/>
  <text x="390" y="99" text-anchor="middle" font-size="11" fill="#b91c1c">fail</text>
  <text x="390" y="227" text-anchor="middle" font-size="11" fill="#b91c1c">fail</text>
  <text x="390" y="355" text-anchor="middle" font-size="11" fill="#b91c1c">fail</text>
  <rect x="440" y="94" width="110" height="280" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="495" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Halt and</text>
  <text x="495" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">reject the</text>
  <text x="495" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">component</text>

  <!-- ===== After boot: runtime controls ===== -->
  <path d="M340,426 H438" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arr-gray)"/>
  <text x="390" y="419" text-anchor="middle" font-size="11" fill="#555555">after boot</text>
  <rect x="440" y="404" width="160" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="520" y="422" text-anchor="middle" font-size="13" fill="#0f172a">Runtime controls</text>
  <text x="520" y="438" text-anchor="middle" font-size="13" fill="#0f172a">still required</text>
</svg>
