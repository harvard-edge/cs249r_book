<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="sb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F407A"/>
    </marker>
    <marker id="sb-arrow-verify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="sb-arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Header Labels -->
    <g transform="translate(40, 24)">
      <rect x="0" y="0" width="280" height="32" rx="4" fill="#f0f9ff" stroke="#D4E2F0" stroke-width="1"/>
      <text x="140" y="21" font-size="12" font-weight="700" fill="#14294E" text-anchor="middle">Layered Boot Stages</text>
    </g>

    <g transform="translate(360, 24)">
      <rect x="0" y="0" width="380" height="32" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="190" y="21" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Cryptographic Verification &amp; Measurement</text>
    </g>

    <g transform="translate(780, 24)">
      <rect x="0" y="0" width="140" height="32" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="70" y="21" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Tamper Gate</text>
    </g>

    <!-- Stage 1: Power-On & Immutable ROM -->
    <g transform="translate(40, 76)">
      <rect x="0" y="0" width="280" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="12" y="12" width="68" height="18" rx="2" fill="#e2e8f0"/>
      <text x="46" y="25" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">STAGE 1</text>
      <text x="90" y="26" font-size="13" font-weight="700" fill="#0f172a">Power-On &amp; Mask ROM</text>
      <text x="14" y="46" font-size="10" fill="#64748b">Immutable on-chip silicon Boot ROM (RoT)</text>
      <text x="14" y="59" font-size="10" fill="#64748b">Hardware-enforced read-only execution state</text>
    </g>

    <!-- Verification 1: Bootloader Hash Check -->
    <g transform="translate(360, 76)">
      <rect x="0" y="0" width="380" height="68" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="12" y="12" width="112" height="18" rx="2" fill="#dcfce7"/>
      <text x="68" y="25" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">eFuse Golden Hash</text>
      <text x="134" y="26" font-size="12" font-weight="700" fill="#14532d">SHA-256 Digest Verification</text>
      <text x="14" y="46" font-size="10" fill="#166534">Computes SHA-256 of Primary Bootloader code in SRAM</text>
      <text x="14" y="59" font-size="10" fill="#475569">Compares against immutable golden digest fused into OTP silicon</text>
    </g>

    <!-- Stage 2: First-Stage Bootloader (FSBL / U-Boot) -->
    <g transform="translate(40, 164)">
      <rect x="0" y="0" width="280" height="68" rx="4" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
      <rect x="12" y="12" width="68" height="18" rx="2" fill="#EAF1F8"/>
      <text x="46" y="25" font-size="10" font-weight="700" fill="#1F407A" text-anchor="middle">STAGE 2</text>
      <text x="90" y="26" font-size="13" font-weight="700" fill="#0c4a6e">Secondary Bootloader</text>
      <text x="14" y="46" font-size="10" fill="#14294E">Initializes DRAM, clocks, and security hardware</text>
      <text x="14" y="59" font-size="10" fill="#64748b">Loads Linux kernel image &amp; device tree to RAM</text>
    </g>

    <!-- Verification 2: Kernel RSA/ECDSA Signature -->
    <g transform="translate(360, 164)">
      <rect x="0" y="0" width="380" height="68" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="12" y="12" width="124" height="18" rx="2" fill="#dcfce7"/>
      <text x="74" y="25" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">PKI Signature Check</text>
      <text x="146" y="26" font-size="12" font-weight="700" fill="#14532d">RSA-4096 / ECDSA P-384</text>
      <text x="14" y="46" font-size="10" fill="#166534">Verifies digital signature on Kernel image &amp; DTB binaries</text>
      <text x="14" y="59" font-size="10" fill="#475569">Public key validated against OEM Root CA anchored in RoT</text>
    </g>

    <!-- Stage 3: Operating System & Linux Kernel -->
    <g transform="translate(40, 252)">
      <rect x="0" y="0" width="280" height="68" rx="4" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
      <rect x="12" y="12" width="68" height="18" rx="2" fill="#EAF1F8"/>
      <text x="46" y="25" font-size="10" font-weight="700" fill="#1F407A" text-anchor="middle">STAGE 3</text>
      <text x="90" y="26" font-size="13" font-weight="700" fill="#0c4a6e">Linux Kernel &amp; Core OS</text>
      <text x="14" y="46" font-size="10" fill="#14294E">Boots verified kernel; initializes LSM &amp; dm-verity</text>
      <text x="14" y="59" font-size="10" fill="#64748b">Mounts authenticated root filesystem (read-only)</text>
    </g>

    <!-- Verification 3: TPM PCR Measurement & dm-verity -->
    <g transform="translate(360, 252)">
      <rect x="0" y="0" width="380" height="68" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="12" y="12" width="134" height="18" rx="2" fill="#dcfce7"/>
      <text x="79" y="25" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">TPM PCR &amp; dm-verity</text>
      <text x="156" y="26" font-size="12" font-weight="700" fill="#14532d">Measured Boot &amp; Hash Tree</text>
      <text x="14" y="46" font-size="10" fill="#166534">Extends PCR[0-7] with stage hashes (tamper-evident log)</text>
      <text x="14" y="59" font-size="10" fill="#475569">Block-level rootfs integrity verified on-the-fly via Merkle tree</text>
    </g>

    <!-- Stage 4: ML Runtime & Model Execution -->
    <g transform="translate(40, 340)">
      <rect x="0" y="0" width="280" height="68" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
      <rect x="12" y="12" width="68" height="18" rx="2" fill="#f3e8ff"/>
      <text x="46" y="25" font-size="10" font-weight="700" fill="#9333ea" text-anchor="middle">STAGE 4</text>
      <text x="90" y="26" font-size="13" font-weight="700" fill="#581c87">ML Runtime &amp; Weights</text>
      <text x="14" y="46" font-size="10" fill="#7e22ce">Spawns inference container / TEE enclave workload</text>
      <text x="14" y="59" font-size="10" fill="#64748b">Decrypts model weights using unsealed hardware key</text>
    </g>

    <!-- Verification 4: Attestation & Model Signature -->
    <g transform="translate(360, 340)">
      <rect x="0" y="0" width="380" height="68" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="12" y="12" width="138" height="18" rx="2" fill="#dcfce7"/>
      <text x="81" y="25" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">Model Attestation</text>
      <text x="160" y="26" font-size="12" font-weight="700" fill="#14532d">Weight Signature &amp; Unsealing</text>
      <text x="14" y="46" font-size="10" fill="#166534">TPM unseals model decryption key only if PCR quote matches</text>
      <text x="14" y="59" font-size="10" fill="#475569">Verifies cryptographic model weight signature before execution</text>
    </g>

    <!-- Failure Box (Right Column) -->
    <g transform="translate(780, 180)">
      <rect x="0" y="0" width="140" height="140" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
      <rect x="12" y="12" width="116" height="22" rx="2" fill="#fee2e2"/>
      <text x="70" y="27" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">BOOT ABORT</text>
      <text x="70" y="54" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Integrity Failure</text>
      <text x="70" y="72" font-size="9" fill="#b91c1c" text-anchor="middle">Signature Mismatch</text>
      <text x="70" y="86" font-size="9" fill="#b91c1c" text-anchor="middle">or Tampered Hash</text>
      <line x1="16" y1="96" x2="124" y2="96" stroke="#fca5a5" stroke-width="1"/>
      <text x="70" y="112" font-size="9" font-weight="600" fill="#7f1d1d" text-anchor="middle">Execution Halted</text>
      <text x="70" y="126" font-size="8.5" fill="#7f1d1d" text-anchor="middle">Hardware Keys Locked</text>
    </g>

    <!-- Success Outcome Banner -->
    <g transform="translate(40, 436)">
      <rect x="0" y="0" width="880" height="56" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="16" y="16" width="200" height="24" rx="2" fill="#16a34a"/>
      <text x="116" y="32" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">ROOT OF TRUST ESTABLISHED</text>
      <text x="230" y="27" font-size="11" font-weight="700" fill="#14532d">Guaranteed System State: Only Authenticated Code &amp; Verified Model Artifacts Can Execute</text>
      <text x="230" y="44" font-size="10" fill="#166534">Pre-runtime tampering prevented; model substitution defeated; cryptographic telemetry verified against silicon identity</text>
    </g>

    <!-- Connector Lines & Flow Arrows -->
    <!-- Downward stage progression arrows -->
    <line x1="180" y1="144" x2="180" y2="164" stroke="#1F407A" stroke-width="2" marker-end="url(#sb-arrow)"/>
    <line x1="180" y1="232" x2="180" y2="252" stroke="#1F407A" stroke-width="2" marker-end="url(#sb-arrow)"/>
    <line x1="180" y1="320" x2="180" y2="340" stroke="#1F407A" stroke-width="2" marker-end="url(#sb-arrow)"/>
    <line x1="180" y1="408" x2="180" y2="436" stroke="#16a34a" stroke-width="2" marker-end="url(#sb-arrow-verify)"/>

    <!-- Verification horizontal links -->
    <line x1="320" y1="110" x2="360" y2="110" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sb-arrow-verify)"/>
    <line x1="320" y1="198" x2="360" y2="198" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sb-arrow-verify)"/>
    <line x1="320" y1="286" x2="360" y2="286" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sb-arrow-verify)"/>
    <line x1="320" y1="374" x2="360" y2="374" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sb-arrow-verify)"/>

    <!-- Failure branch lines to Tamper Gate -->
    <path d="M 740 110 L 760 110 L 760 215 L 780 215" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sb-arrow-fail)"/>
    <path d="M 740 198 L 755 198 L 755 238 L 780 238" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sb-arrow-fail)"/>
    <path d="M 740 286 L 755 286 L 755 262 L 780 262" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sb-arrow-fail)"/>
    <path d="M 740 374 L 760 374 L 760 285 L 780 285" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sb-arrow-fail)"/>
  </g>
</svg>