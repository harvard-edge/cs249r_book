<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="268" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Row 1: Stuxnet attack chain -->
  <text x="20" y="24" font-size="12" font-weight="700" fill="#0f172a">Stuxnet attack chain (2010)</text>

  <rect x="20" y="36" width="112" height="84" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="76" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">USB media</text>
  <text x="76" y="83" text-anchor="middle" font-size="12" fill="#475569">crosses the</text>
  <text x="76" y="98" text-anchor="middle" font-size="12" fill="#475569">air gap</text>

  <rect x="152" y="36" width="112" height="84" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="208" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Windows hosts</text>
  <text x="208" y="83" text-anchor="middle" font-size="12" fill="#475569">four zero-day</text>
  <text x="208" y="98" text-anchor="middle" font-size="12" fill="#475569">exploits</text>

  <rect x="284" y="36" width="112" height="84" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Siemens Step7</text>
  <text x="340" y="83" text-anchor="middle" font-size="12" fill="#475569">PLC programming</text>
  <text x="340" y="98" text-anchor="middle" font-size="12" fill="#475569">software</text>

  <rect x="416" y="36" width="112" height="84" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="472" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">PLC logic</text>
  <text x="472" y="83" text-anchor="middle" font-size="12" fill="#475569">control values</text>
  <text x="472" y="98" text-anchor="middle" font-size="12" fill="#475569">altered</text>

  <rect x="548" y="36" width="112" height="84" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="604" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Centrifuges</text>
  <text x="604" y="74" text-anchor="middle" font-size="12" fill="#b91c1c">damaged while</text>
  <text x="604" y="104" text-anchor="middle" font-size="12" fill="#b91c1c">normal readings</text>
  <text x="604" y="89" text-anchor="middle" font-size="12" fill="#b91c1c">operators see</text>

  <path d="M132,78 H150" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <path d="M264,78 H282" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <path d="M396,78 H414" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <path d="M528,78 H546" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>

  <!-- Row 2: ML supply chain analog -->
  <text x="20" y="152" font-size="12" font-weight="700" fill="#0f172a">ML supply chain analog</text>

  <rect x="20" y="164" width="112" height="84" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="76" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Public artifact</text>
  <text x="76" y="211" text-anchor="middle" font-size="12" fill="#475569">package, dataset,</text>
  <text x="76" y="226" text-anchor="middle" font-size="12" fill="#475569">or weights</text>

  <rect x="152" y="164" width="112" height="84" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="208" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Build host</text>
  <text x="208" y="211" text-anchor="middle" font-size="12" fill="#475569">imports it as a</text>
  <text x="208" y="226" text-anchor="middle" font-size="12" fill="#475569">trusted input</text>

  <rect x="284" y="164" width="112" height="84" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="340" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Training job</text>
  <text x="340" y="211" text-anchor="middle" font-size="12" fill="#475569">framework and</text>
  <text x="340" y="226" text-anchor="middle" font-size="12" fill="#475569">pipeline absorb it</text>

  <rect x="416" y="164" width="112" height="84" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="472" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Model artifact</text>
  <text x="472" y="211" text-anchor="middle" font-size="12" fill="#475569">poisoned or</text>
  <text x="472" y="226" text-anchor="middle" font-size="12" fill="#475569">backdoored</text>

  <rect x="548" y="164" width="112" height="84" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="604" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Deployed model</text>
  <text x="604" y="202" text-anchor="middle" font-size="12" fill="#b91c1c">misbehaves while</text>
  <text x="604" y="232" text-anchor="middle" font-size="12" fill="#b91c1c">looks normal</text>
  <text x="604" y="217" text-anchor="middle" font-size="12" fill="#b91c1c">monitoring</text>

  <path d="M132,206 H150" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <path d="M264,206 H282" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <path d="M396,206 H414" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <path d="M528,206 H546" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
