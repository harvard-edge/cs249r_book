<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-attack" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Top Annotation: Sensor Spoofing Deception Loop -->
    <g transform="translate(520, 20)">
      <rect x="0" y="0" width="310" height="54" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      <rect x="10" y="8" width="94" height="16" rx="2" fill="#fef3c7"/>
      <text x="57" y="19" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">SENSOR SPOOFING</text>
      <text x="112" y="20" font-size="9.5" font-weight="600" fill="#92400e">Recorded Normal Signals</text>
      <text x="12" y="36" font-size="8.5" fill="#78350f">Replayed legitimate telemetry to control room</text>
      <text x="12" y="47" font-size="8.5" fill="#78350f">while actively sabotaging centrifuge drives</text>

      <!-- Feedback indicator line down to PLC -->
      <path d="M 155,54 L 155,90" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-amber)"/>
    </g>

    <!-- Main Attack Chain Container -->
    <g transform="translate(34, 94)">
      <!-- Stage 1: USB Physical Vector -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="134" height="128" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="8" y="8" width="118" height="20" rx="2" fill="#fee2e2"/>
        <text x="67" y="22" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">PHYSICAL VECTOR</text>
        <text x="67" y="48" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Infected USB</text>
        <text x="67" y="66" font-size="9" fill="#64748b" text-anchor="middle">Removable Flash Drive</text>
        <rect x="8" y="80" width="118" height="38" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="67" y="94" font-size="8.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Air-Gap Crossing</text>
        <text x="67" y="107" font-size="8" fill="#64748b" text-anchor="middle">LNK Shortcut Flaw</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <g transform="translate(134, 64)">
        <line x1="4" y1="0" x2="30" y2="0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-attack)"/>
      </g>

      <!-- Stage 2: Windows Workstation -->
      <g transform="translate(168, 0)">
        <rect x="0" y="0" width="134" height="128" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="8" y="8" width="118" height="20" rx="2" fill="#fee2e2"/>
        <text x="67" y="22" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">HOST EXPLOIT</text>
        <text x="67" y="48" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Windows Host</text>
        <text x="67" y="66" font-size="9" fill="#64748b" text-anchor="middle">Engineer Workstation</text>
        <rect x="8" y="80" width="118" height="38" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="67" y="94" font-size="8.5" font-weight="600" fill="#b91c1c" text-anchor="middle">4× Zero-Days</text>
        <text x="67" y="107" font-size="8" fill="#64748b" text-anchor="middle">Privilege Escalation</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <g transform="translate(302, 64)">
        <line x1="4" y1="0" x2="30" y2="0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-attack)"/>
      </g>

      <!-- Stage 3: Siemens Step7 SCADA -->
      <g transform="translate(336, 0)">
        <rect x="0" y="0" width="134" height="128" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="8" y="8" width="118" height="20" rx="2" fill="#fee2e2"/>
        <text x="67" y="22" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">SOFTWARE LAYER</text>
        <text x="67" y="48" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Siemens Step7</text>
        <text x="67" y="66" font-size="9" fill="#64748b" text-anchor="middle">SCADA Programming</text>
        <rect x="8" y="80" width="118" height="38" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="67" y="94" font-size="8.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Rogue s7otbxdx.dll</text>
        <text x="67" y="107" font-size="8" fill="#64748b" text-anchor="middle">Intercepted Blocks</text>
      </g>

      <!-- Arrow 3 -> 4 -->
      <g transform="translate(470, 64)">
        <line x1="4" y1="0" x2="30" y2="0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-attack)"/>
      </g>

      <!-- Stage 4: Simatic S7 PLC Rootkit -->
      <g transform="translate(504, 0)">
        <rect x="0" y="0" width="134" height="128" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="8" y="8" width="118" height="20" rx="2" fill="#fee2e2"/>
        <text x="67" y="22" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">FIRMWARE ROOTKIT</text>
        <text x="67" y="48" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Simatic S7-300</text>
        <text x="67" y="66" font-size="9" fill="#64748b" text-anchor="middle">PLC Controller</text>
        <rect x="8" y="80" width="118" height="38" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="67" y="94" font-size="8.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Injected Ladder Logic</text>
        <text x="67" y="107" font-size="8" fill="#64748b" text-anchor="middle">Masked Diagnostic I/O</text>
      </g>

      <!-- Arrow 4 -> 5 -->
      <g transform="translate(638, 64)">
        <line x1="4" y1="0" x2="30" y2="0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-attack)"/>
      </g>

      <!-- Stage 5: Motor Drives / Inverters -->
      <g transform="translate(672, 0)">
        <rect x="0" y="0" width="134" height="128" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="8" y="8" width="118" height="20" rx="2" fill="#fef3c7"/>
        <text x="67" y="22" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">ACTUATION</text>
        <text x="67" y="48" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Motor Inverters</text>
        <text x="67" y="66" font-size="9" fill="#64748b" text-anchor="middle">Frequency Converters</text>
        <rect x="8" y="80" width="118" height="38" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="67" y="94" font-size="8.5" font-weight="600" fill="#b45309" text-anchor="middle">807 ↔ 1,410 Hz</text>
        <text x="67" y="107" font-size="8" fill="#64748b" text-anchor="middle">Rotor Resonant Strain</text>
      </g>

      <!-- Arrow 5 -> 6 -->
      <g transform="translate(806, 64)">
        <line x1="4" y1="0" x2="30" y2="0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-attack)"/>
      </g>

      <!-- Stage 6: Physical Destruction -->
      <g transform="translate(840, 0)">
        <rect x="0" y="0" width="132" height="128" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
        <rect x="8" y="8" width="116" height="20" rx="2" fill="#dc2626"/>
        <text x="66" y="22" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">PHYSICAL IMPACT</text>
        <text x="66" y="52" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Centrifuge</text>
        <text x="66" y="68" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Rotor Failure</text>
        <rect x="8" y="80" width="116" height="38" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <text x="66" y="95" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">~1,000 Rotors</text>
        <text x="66" y="108" font-size="8" fill="#7f1d1d" text-anchor="middle">Mechanically Destroyed</text>
      </g>
    </g>

    <!-- Context & Historical Impact Card -->
    <g transform="translate(34, 238)">
      <rect x="0" y="0" width="972" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="12" y="10" width="118" height="22" rx="2" fill="#e2e8f0"/>
      <text x="71" y="24" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">HISTORICAL EVENT</text>
      <text x="142" y="25" font-size="9.5" font-weight="600" fill="#0f172a">First confirmed cyberweapon to cross digital-to-kinetic boundaries (Natanz, Iran, 2010).</text>
      <text x="690" y="25" font-size="9" fill="#64748b">Targets: Siemens S7-300 + Fararo Paya / Vacon drives</text>
    </g>

    <!-- Systems Engineering Lesson Card -->
    <g transform="translate(34, 294)">
      <rect x="0" y="0" width="972" height="136" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <!-- Header -->
      <rect x="12" y="12" width="948" height="26" rx="3" fill="#f1f5f9"/>
      <rect x="18" y="15" width="124" height="20" rx="2" fill="#1F407A"/>
      <text x="80" y="28" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">SYSTEMS TAKEAWAYS</text>
      <text x="154" y="28" font-size="10.5" font-weight="700" fill="#0f172a">Trust Boundaries &amp; Integrity Invariants for Autonomous &amp; AI Systems</text>

      <!-- 3 Takeaway Columns -->
      <g transform="translate(12, 46)">
        <!-- Col 1: Air Gaps -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="308" height="78" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#14294E">1. Air-Gaps Are Operational Myths</text>
          <text x="12" y="34" font-size="8.5" fill="#475569">Physical isolation fails as soon as maintenance,</text>
          <text x="12" y="47" font-size="8.5" fill="#475569">model updates, or diagnostic telemetry require</text>
          <text x="12" y="60" font-size="8.5" fill="#475569">human operator removable media.</text>
        </g>

        <!-- Col 2: Firmware & Weight Signing -->
        <g transform="translate(320, 0)">
          <rect x="0" y="0" width="308" height="78" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#14294E">2. Cryptographic Root of Trust</text>
          <text x="12" y="34" font-size="8.5" fill="#475569">Code and neural weights must be verified in</text>
          <text x="12" y="47" font-size="8.5" fill="#475569">hardware (Measured Boot / TPM / Enclave) before</text>
          <text x="12" y="60" font-size="8.5" fill="#475569">execution; unsigned payloads cannot execute.</text>
        </g>

        <!-- Col 3: Independent Invariant Checking -->
        <g transform="translate(640, 0)">
          <rect x="0" y="0" width="308" height="78" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="18" font-size="10" font-weight="700" fill="#14294E">3. Decoupled Physical Interlocks</text>
          <text x="12" y="34" font-size="8.5" fill="#475569">Safety envelopes (e.g. max RPM, temp) must be</text>
          <text x="12" y="47" font-size="8.5" fill="#475569">enforced by independent out-of-band analog</text>
          <text x="12" y="60" font-size="8.5" fill="#475569">trips, not software subject to sensor spoofing.</text>
        </g>
      </g>
    </g>
  </g>
</svg>