<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-trust" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Left Trust Foundation Axis -->
    <g transform="translate(68, 0)">
      <line x1="0" y1="500" x2="0" y2="40" stroke="#1F407A" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-trust)"/>
      <circle cx="0" cy="500" r="3.5" fill="#1F407A"/>
      <text x="-12" y="270" font-size="10.5" font-weight="700" fill="#14294E" text-anchor="middle" transform="rotate(-90 -12 270)" letter-spacing="1.5">HIERARCHY OF TRUST</text>
      <text x="0" y="26" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">Application Governance</text>
      <text x="0" y="522" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">Silicon Root of Trust</text>
    </g>

    <!-- LAYER 4: DATA & GOVERNANCE LAYER (TOP) -->
    <g transform="translate(142, 30)">
      <rect x="0" y="0" width="790" height="110" rx="4" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
      <!-- Layer Badge & Info -->
      <g transform="translate(12, 12)">
        <rect x="0" y="0" width="150" height="86" rx="3" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/>
        <rect x="10" y="10" width="78" height="18" rx="2" fill="#ede9fe"/>
        <text x="49" y="22" font-size="8.5" font-weight="700" fill="#7c3aed" text-anchor="middle">LAYER 4</text>
        <text x="10" y="46" font-size="12" font-weight="700" fill="#0f172a">Data Privacy</text>
        <text x="10" y="62" font-size="8.5" font-weight="600" fill="#7c3aed">Governance &amp; PII</text>
        <text x="10" y="76" font-size="8" fill="#64748b">Training Set Invariants</text>
      </g>

      <!-- 4 Chips in Layer 4 -->
      <g transform="translate(174, 12)">
        <!-- Chip 1: DP-SGD -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#6b21a8">Differential Privacy</text>
          <text x="10" y="36" font-size="8.5" fill="#581c87">DP-SGD clipping,</text>
          <text x="10" y="49" font-size="8.5" fill="#581c87">calibrated Gaussian</text>
          <text x="10" y="62" font-size="8.5" fill="#581c87">noise addition (ε, δ)</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#7e22ce">Zero Memorization</text>
        </g>

        <!-- Chip 2: Homomorphic Encryption / MPC -->
        <g transform="translate(154, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#6b21a8">Secure Aggregation</text>
          <text x="10" y="36" font-size="8.5" fill="#581c87">Zero-knowledge pairwise</text>
          <text x="10" y="49" font-size="8.5" fill="#581c87">masking; cancels on</text>
          <text x="10" y="62" font-size="8.5" fill="#581c87">federated server</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#7e22ce">Blind Computation</text>
        </g>

        <!-- Chip 3: Provenance SBOM -->
        <g transform="translate(308, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#6b21a8">Data Provenance</text>
          <text x="10" y="36" font-size="8.5" fill="#581c87">Cryptographic dataset</text>
          <text x="10" y="49" font-size="8.5" fill="#581c87">signing; verifiable</text>
          <text x="10" y="62" font-size="8.5" fill="#581c87">data-SBOM lineage</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#7e22ce">Supply Chain Audit</text>
        </g>

        <!-- Chip 4: Encryption at Rest -->
        <g transform="translate(462, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#6b21a8">Rest &amp; Flight Crypt</text>
          <text x="10" y="36" font-size="8.5" fill="#581c87">AES-256-GCM envelope</text>
          <text x="10" y="49" font-size="8.5" fill="#581c87">encryption for corpora;</text>
          <text x="10" y="62" font-size="8.5" fill="#581c87">PII scrub pipelines</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#7e22ce">Storage Confidentiality</text>
        </g>
      </g>
    </g>

    <!-- LAYER 3: MODEL LAYER -->
    <g transform="translate(142, 150)">
      <rect x="0" y="0" width="790" height="110" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
      <!-- Layer Badge & Info -->
      <g transform="translate(12, 12)">
        <rect x="0" y="0" width="150" height="86" rx="3" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
        <rect x="10" y="10" width="78" height="18" rx="2" fill="#fef3c7"/>
