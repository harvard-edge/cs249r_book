        <text x="10" y="46" font-size="12" font-weight="700" fill="#0f172a">Model Security</text>
        <text x="10" y="62" font-size="8.5" font-weight="600" fill="#b45309">Weights &amp; Graph</text>
        <text x="10" y="76" font-size="8" fill="#64748b">Inference Safeguards</text>
      </g>

      <!-- 4 Chips in Layer 3 -->
      <g transform="translate(174, 12)">
        <!-- Chip 1: Adversarial Training -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#fffdf5" stroke="#fde68a" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#92400e">Adversarial Training</text>
          <text x="10" y="36" font-size="8.5" fill="#78350f">Minimax optimization</text>
          <text x="10" y="49" font-size="8.5" fill="#78350f">under PGD attack;</text>
          <text x="10" y="62" font-size="8.5" fill="#78350f">certified L2 bounds</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#b45309">Boundary Hardening</text>
        </g>

        <!-- Chip 2: Input Preprocessing -->
        <g transform="translate(154, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#fffdf5" stroke="#fde68a" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#92400e">Feature Squeezing</text>
          <text x="10" y="36" font-size="8.5" fill="#78350f">Bit-depth reduction,</text>
          <text x="10" y="49" font-size="8.5" fill="#78350f">spatial smoothing,</text>
          <text x="10" y="62" font-size="8.5" fill="#78350f">high-frequency filter</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#b45309">Evasion Suppression</text>
        </g>

        <!-- Chip 3: Model Watermarking -->
        <g transform="translate(308, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#fffdf5" stroke="#fde68a" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#92400e">IP Watermarking</text>
          <text x="10" y="36" font-size="8.5" fill="#78350f">Cryptographic weights</text>
          <text x="10" y="49" font-size="8.5" fill="#78350f">fingerprinting; trigger</text>
          <text x="10" y="62" font-size="8.5" fill="#78350f">set ownership proofs</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#b45309">Anti-Theft Auditing</text>
        </g>

        <!-- Chip 4: API Rate Limiting -->
        <g transform="translate(462, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#fffdf5" stroke="#fde68a" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#92400e">Rate &amp; Output Limits</text>
          <text x="10" y="36" font-size="8.5" fill="#78350f">Query throttling,</text>
          <text x="10" y="49" font-size="8.5" fill="#78350f">logit truncation,</text>
          <text x="10" y="62" font-size="8.5" fill="#78350f">token quotas per IP</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#b45309">Extraction Defeat</text>
        </g>
      </g>
    </g>

    <!-- LAYER 2: SYSTEM & OS LAYER -->
    <g transform="translate(142, 270)">
      <rect x="0" y="0" width="790" height="110" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
      <!-- Layer Badge & Info -->
      <g transform="translate(12, 12)">
        <rect x="0" y="0" width="150" height="86" rx="3" fill="#eff6ff" stroke="#dbeafe" stroke-width="1"/>
        <rect x="10" y="10" width="78" height="18" rx="2" fill="#dbeafe"/>
        <text x="49" y="22" font-size="8.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">LAYER 2</text>
        <text x="10" y="46" font-size="12" font-weight="700" fill="#0f172a">Platform Security</text>
        <text x="10" y="62" font-size="8.5" font-weight="600" fill="#1d4ed8">Host &amp; Fabric OS</text>
        <text x="10" y="76" font-size="8" fill="#64748b">Runtime Isolation</text>
      </g>

      <!-- 4 Chips in Layer 2 -->
      <g transform="translate(174, 12)">
        <!-- Chip 1: Container Isolation -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#f8faff" stroke="#bfdbfe" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#1e40af">Sandboxed Runtime</text>
          <text x="10" y="36" font-size="8.5" fill="#1e3a8a">gVisor / Kata containers,</text>
          <text x="10" y="49" font-size="8.5" fill="#1e3a8a">seccomp-bpf filters,</text>
          <text x="10" y="62" font-size="8.5" fill="#1e3a8a">rootless pod deployment</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#2563eb">Breakout Defense</text>
        </g>

        <!-- Chip 2: Network Segmentation -->
        <g transform="translate(154, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#f8faff" stroke="#bfdbfe" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#1e40af">Fabric Segmentation</text>
          <text x="10" y="36" font-size="8.5" fill="#1e3a8a">Zero-trust network</text>
          <text x="10" y="49" font-size="8.5" fill="#1e3a8a">policies; encrypted RoCE</text>
          <text x="10" y="62" font-size="8.5" fill="#1e3a8a">and InfiniBand fabrics</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#2563eb">MiTM Prevention</text>
        </g>

        <!-- Chip 3: Strict RBAC -->
        <g transform="translate(308, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#f8faff" stroke="#bfdbfe" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#1e40af">IAM &amp; SPIFFE mTLS</text>
          <text x="10" y="36" font-size="8.5" fill="#1e3a8a">Short-lived ephemeral</text>
          <text x="10" y="49" font-size="8.5" fill="#1e3a8a">tokens; mutual TLS</text>
          <text x="10" y="62" font-size="8.5" fill="#1e3a8a">between model pods</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#2563eb">Zero Standing Access</text>
        </g>

        <!-- Chip 4: Anomaly Telemetry -->
        <g transform="translate(462, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#f8faff" stroke="#bfdbfe" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#1e40af">eBPF Telemetry</text>
          <text x="10" y="36" font-size="8.5" fill="#1e3a8a">Kernel syscall tracing;</text>
          <text x="10" y="49" font-size="8.5" fill="#1e3a8a">unusual memory read</text>
          <text x="10" y="62" font-size="8.5" fill="#1e3a8a">detection in real time</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#2563eb">Intrusion Detection</text>
        </g>
      </g>
    </g>

    <!-- LAYER 1: HARDWARE & SILICON ROOT OF TRUST (BOTTOM) -->
    <g transform="translate(142, 390)">
      <rect x="0" y="0" width="790" height="110" rx="4" fill="#ffffff" stroke="#D4E2F0" stroke-width="1.2"/>
      <!-- Layer Badge & Info -->
      <g transform="translate(12, 12)">
        <rect x="0" y="0" width="150" height="86" rx="3" fill="#f0f9ff" stroke="#EAF1F8" stroke-width="1"/>
        <rect x="10" y="10" width="78" height="18" rx="2" fill="#EAF1F8"/>
        <text x="49" y="22" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">LAYER 1</text>
        <text x="10" y="46" font-size="12" font-weight="700" fill="#0f172a">Silicon Hardware</text>
        <text x="10" y="62" font-size="8.5" font-weight="600" fill="#1F407A">Root of Trust</text>
        <text x="10" y="76" font-size="8" fill="#64748b">Hardware Anchor</text>
      </g>

      <!-- 4 Chips in Layer 1 -->
      <g transform="translate(174, 12)">
        <!-- Chip 1: TEEs / Confidential Computing -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#f0f9ff" stroke="#D4E2F0" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#14294E">Enclaves &amp; TEEs</text>
          <text x="10" y="36" font-size="8.5" fill="#0c4a6e">AMD SEV-SNP, Intel</text>
          <text x="10" y="49" font-size="8.5" fill="#0c4a6e">TDX, ARM TrustZone;</text>
          <text x="10" y="62" font-size="8.5" fill="#0c4a6e">isolated memory space</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#1F407A">Host Hypervisor Blind</text>
        </g>

        <!-- Chip 2: Secure Boot -->
        <g transform="translate(154, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#f0f9ff" stroke="#D4E2F0" stroke-width="1"/>
          <text x="10" y="20" font-size="9" font-weight="700" fill="#14294E">Measured Boot</text>
          <text x="10" y="36" font-size="8.2" fill="#0c4a6e">ROM golden hash check,</text>
          <text x="10" y="49" font-size="8.2" fill="#0c4a6e">TPM PCR attestation of</text>
          <text x="10" y="62" font-size="8.2" fill="#0c4a6e">firmware &amp; OS kernel</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#1F407A">Root of Trust Chain</text>
        </g>

        <!-- Chip 3: Hardware Security Modules -->
        <g transform="translate(308, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#f0f9ff" stroke="#D4E2F0" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#14294E">Hardware HSMs</text>
          <text x="10" y="36" font-size="8.5" fill="#0c4a6e">Non-exportable master</text>
          <text x="10" y="49" font-size="8.5" fill="#0c4a6e">keys; tamper zeroize</text>
          <text x="10" y="62" font-size="8.5" fill="#0c4a6e">switches; FIPS 140-3</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#1F407A">Hardware Key Vault</text>
        </g>

        <!-- Chip 4: PUF & TRNG -->
        <g transform="translate(462, 0)">
          <rect x="0" y="0" width="144" height="86" rx="3" fill="#f0f9ff" stroke="#D4E2F0" stroke-width="1"/>
          <text x="10" y="20" font-size="9.5" font-weight="700" fill="#14294E">PUF &amp; True RNG</text>
          <text x="10" y="36" font-size="8.5" fill="#0c4a6e">Silicon microstructure</text>
          <text x="10" y="49" font-size="8.5" fill="#0c4a6e">unclonable fingerprint;</text>
          <text x="10" y="62" font-size="8.5" fill="#0c4a6e">quantum thermal noise</text>
          <text x="10" y="77" font-size="8" font-weight="600" fill="#1F407A">Unforgeable Identity</text>
        </g>
      </g>
