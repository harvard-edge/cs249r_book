<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="100%" height="100%">
  <defs>
    <marker id="arr-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Matrix Coordinates: Origin at (110, 30) to (840, 480) -->
    <!-- X-Axis: Likelihood (Bottom) -->
    <g transform="translate(110, 496)">
      <line x1="0" y1="0" x2="720" y2="0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
      <text x="360" y="22" font-size="11" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="1">ATTACK LIKELIHOOD (EXPLOIT FEASIBILITY)</text>
      <text x="30" y="-8" font-size="9" font-weight="600" fill="#64748b">Low Likelihood (Specialized Access)</text>
      <text x="660" y="-8" font-size="9" font-weight="600" fill="#64748b" text-anchor="end">High Likelihood (Public / Commodity)</text>
    </g>

    <!-- Y-Axis: Impact (Left) -->
    <g transform="translate(90, 480)">
      <line x1="0" y1="0" x2="0" y2="-450" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
      <text x="0" y="-225" font-size="11" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90 0 -225)" letter-spacing="1">SYSTEMIC IMPACT (BLAST RADIUS)</text>
      <text x="-8" y="-30" font-size="9" font-weight="600" fill="#64748b" text-anchor="end">Low Impact</text>
      <text x="-8" y="-430" font-size="9" font-weight="600" fill="#64748b" text-anchor="end">High Impact</text>
    </g>

    <!-- QUADRANT 1: TOP-LEFT — PREPARE (Low Likelihood, High Impact) -->
    <g transform="translate(114, 28)">
      <rect x="0" y="0" width="350" height="214" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
      <rect x="12" y="12" width="326" height="28" rx="3" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
      <rect x="18" y="16" width="76" height="20" rx="2" fill="#fef3c7"/>
      <text x="56" y="30" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">PREPARE</text>
      <text x="104" y="30" font-size="10" font-weight="700" fill="#92400e">Low Likelihood · High Impact</text>

      <!-- Threat Items -->
      <g transform="translate(12, 48)">
        <rect x="0" y="0" width="326" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="16" font-size="9.5" font-weight="600" fill="#1e293b">• Hardware Laser Fault Injection / Glitching</text>

        <rect x="0" y="28" width="326" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="44" font-size="9.5" font-weight="600" fill="#1e293b">• Silicon Supply Chain Trojan Insertion</text>

        <rect x="0" y="56" width="326" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="72" font-size="9.5" font-weight="600" fill="#1e293b">• Deep Physical Side-Channel Cryptanalysis</text>
      </g>

      <!-- Strategy Callout -->
      <rect x="12" y="140" width="326" height="60" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="20" y="158" font-size="9" font-weight="700" fill="#92400e">ARCHITECTURAL HARDENING STRATEGY</text>
      <text x="20" y="174" font-size="8.5" fill="#78350f">Hardware Root-of-Trust (RoT), PUF, TEE memory encryption,</text>
      <text x="20" y="188" font-size="8.5" fill="#78350f">tamper-evident chassis, and dual-rail asynchronous logic.</text>
    </g>

    <!-- QUADRANT 2: TOP-RIGHT — CRITICAL (High Likelihood, High Impact) -->
    <g transform="translate(478, 28)">
      <rect x="0" y="0" width="350" height="214" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
      <rect x="12" y="12" width="326" height="28" rx="3" fill="#fef2f2" stroke="#fee2e2" stroke-width="1"/>
      <rect x="18" y="16" width="76" height="20" rx="2" fill="#fee2e2"/>
      <text x="56" y="30" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">CRITICAL</text>
      <text x="104" y="30" font-size="10" font-weight="700" fill="#991b1b">High Likelihood · High Impact</text>

      <!-- Threat Items -->
      <g transform="translate(12, 48)">
        <rect x="0" y="0" width="326" height="24" rx="2" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
        <text x="10" y="16" font-size="9.5" font-weight="600" fill="#991b1b">• Untrusted Pickles / Deserialization RCE</text>

        <rect x="0" y="28" width="326" height="24" rx="2" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
        <text x="10" y="44" font-size="9.5" font-weight="600" fill="#991b1b">• Training Data Poisoning / Targeted Backdoors</text>

        <rect x="0" y="56" width="326" height="24" rx="2" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
        <text x="10" y="72" font-size="9.5" font-weight="600" fill="#991b1b">• Adversarial Physical Evasion (e.g. Signs, Audio)</text>
      </g>

      <!-- Strategy Callout -->
      <rect x="12" y="140" width="326" height="60" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="20" y="158" font-size="9" font-weight="700" fill="#991b1b">AUTOMATED RUNTIME GATES STRATEGY</text>
      <text x="20" y="174" font-size="8.5" fill="#7f1d1d">SafeTensors zero-code deserialization, data provenance SBOM,</text>
      <text x="20" y="188" font-size="8.5" fill="#7f1d1d">adversarial training, and real-time input feature squeezing.</text>
    </g>

    <!-- QUADRANT 3: BOTTOM-LEFT — MONITOR (Low Likelihood, Low Impact) -->
    <g transform="translate(114, 254)">
      <rect x="0" y="0" width="350" height="214" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="12" y="12" width="326" height="28" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="18" y="16" width="76" height="20" rx="2" fill="#e2e8f0"/>
      <text x="56" y="30" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">MONITOR</text>
      <text x="104" y="30" font-size="10" font-weight="700" fill="#334155">Low Likelihood · Low Impact</text>

      <!-- Threat Items -->
      <g transform="translate(12, 48)">
        <rect x="0" y="0" width="326" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="16" font-size="9.5" font-weight="600" fill="#475569">• Opportunistic Local Cache Snooping</text>

        <rect x="0" y="28" width="326" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="44" font-size="9.5" font-weight="600" fill="#475569">• Non-Targeted Minor Objective Perturbations</text>

        <rect x="0" y="56" width="326" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="72" font-size="9.5" font-weight="600" fill="#475569">• Air-Gapped Network Traffic Frequency Jitter</text>
      </g>

      <!-- Strategy Callout -->
      <rect x="12" y="140" width="326" height="60" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="158" font-size="9" font-weight="700" fill="#334155">BASELINE AUDITING &amp; LOGGING</text>
      <text x="20" y="174" font-size="8.5" fill="#64748b">Centralized syslog ingestion, kernel access telemetry, standard</text>
      <text x="20" y="188" font-size="8.5" fill="#64748b">OS file permission integrity checks, and periodic hygiene scans.</text>
    </g>

    <!-- QUADRANT 4: BOTTOM-RIGHT — MITIGATE (High Likelihood, Low Impact) -->
    <g transform="translate(478, 254)">
      <rect x="0" y="0" width="350" height="214" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <rect x="12" y="12" width="326" height="28" rx="3" fill="#f0f9ff" stroke="#e0f2fe" stroke-width="1"/>
      <rect x="18" y="16" width="76" height="20" rx="2" fill="#e0f2fe"/>
      <text x="56" y="30" font-size="9" font-weight="700" fill="#0284c7" text-anchor="middle">MITIGATE</text>
      <text x="104" y="30" font-size="10" font-weight="700" fill="#0369a1">High Likelihood · Low/Medium Impact</text>

      <!-- Threat Items -->
      <g transform="translate(12, 48)">
        <rect x="0" y="0" width="326" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="16" font-size="9.5" font-weight="600" fill="#0369a1">• Model Extraction via Systematic API Queries</text>

        <rect x="0" y="28" width="326" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="44" font-size="9.5" font-weight="600" fill="#0369a1">• Membership Inference on Overfit Public Models</text>

        <rect x="0" y="56" width="326" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="72" font-size="9.5" font-weight="600" fill="#0369a1">• Prompt Scraping &amp; Surface-Level Distillation</text>
      </g>

      <!-- Strategy Callout -->
      <rect x="12" y="140" width="326" height="60" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="20" y="158" font-size="9" font-weight="700" fill="#0369a1">RATE LIMITING &amp; PRIVACY PRESERVATION</text>
      <text x="20" y="174" font-size="8.5" fill="#0284c7">API query throttling, IP reputation scoring, logit rounding /</text>
      <text x="20" y="188" font-size="8.5" fill="#0284c7">truncation, and differential privacy noise addition to outputs.</text>
    </g>
  </g>
</svg>