<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="380" y="20" width="280" height="110" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="520" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Automate defenses</text>
  <text x="520" y="84" text-anchor="middle" font-size="12" fill="#475569">data poisoning in</text>
  <text x="520" y="100" text-anchor="middle" font-size="12" fill="#475569">federated training</text>
  <rect x="380" y="150" width="280" height="110" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="520" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Limit and shape the API</text>
  <text x="520" y="214" text-anchor="middle" font-size="12" fill="#475569">model extraction via</text>
  <text x="520" y="230" text-anchor="middle" font-size="12" fill="#475569">a public API</text>
  <rect x="80" y="20" width="280" height="110" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="220" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Prepare where value is high</text>
  <text x="220" y="84" text-anchor="middle" font-size="12" fill="#475569">hardware side channels</text>
  <text x="220" y="100" text-anchor="middle" font-size="12" fill="#475569">on cloud-hosted models</text>
  <rect x="80" y="150" width="280" height="110" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="220" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Monitor and reassess</text>
  <text x="220" y="214" text-anchor="middle" font-size="12" fill="#475569">membership inference via</text>
  <text x="220" y="230" text-anchor="middle" font-size="12" fill="#475569">a public API</text>
  <!-- ===== Axes ===== -->
  <path d="M60,260 V22" stroke="#475569" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M80,280 H658" stroke="#475569" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <text x="44" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" transform="rotate(-90 44 140)">Impact</text>
  <text x="44" y="75" text-anchor="middle" font-size="12" fill="#475569" transform="rotate(-90 44 75)">high</text>
  <text x="44" y="205" text-anchor="middle" font-size="12" fill="#475569" transform="rotate(-90 44 205)">lower</text>
  <text x="370" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Likelihood</text>
  <text x="220" y="302" text-anchor="middle" font-size="12" fill="#475569">lower</text>
  <text x="520" y="302" text-anchor="middle" font-size="12" fill="#475569">high</text>
</svg>
