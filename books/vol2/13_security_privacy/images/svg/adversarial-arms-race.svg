<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#15803d"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- PHASE 1: TOP LEFT (width 340, padding 15, usable 310) -->
  <g transform="translate(35, 20)">
    <rect width="340" height="130" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <rect width="340" height="26" rx="3" fill="#EAF1F8"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#1F407A">1. Specify Threat Model &amp; Surface</text>
    <text x="15" y="46" font-size="8.5" fill="#334155"><tspan font-weight="600">Access Scope:</tspan> White-box, gray-box, or black-box API</text>
    <text x="15" y="64" font-size="8.5" fill="#334155"><tspan font-weight="600">Perturbation Budget:</tspan> Norm bound ε in L_∞, L_2, or edit radius</text>
    <text x="15" y="82" font-size="8.5" fill="#334155"><tspan font-weight="600">Attacker Knowledge:</tspan> Loss, architecture, filters, or logits</text>
    <text x="15" y="100" font-size="8.5" fill="#334155"><tspan font-weight="600">Adversary Goal:</tspan> Untargeted evasion vs. targeted impersonation</text>
    <text x="15" y="118" font-size="7.5" fill="#64748b">Defines evaluation boundary and security assumptions</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <line x1="375" y1="85" x2="425" y2="85" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="382" y="71" width="36" height="15" rx="2" fill="#fee2e2"/>
  <text x="400" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">ADAPT</text>

  <!-- PHASE 2: TOP RIGHT -->
  <g transform="translate(425, 20)">
    <rect width="340" height="130" rx="3" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
    <rect width="340" height="26" rx="3" fill="#fee2e2"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#b91c1c">2. Evaluate Adaptive Stress Attacks</text>
    <text x="15" y="46" font-size="8.5" fill="#7f1d1d"><tspan font-weight="600">Tailored Evasion:</tspan> Optimize attacks against defense rules</text>
    <text x="15" y="64" font-size="8.5" fill="#7f1d1d"><tspan font-weight="600">Gradient Bypass:</tspan> Backward Pass Differentiable Approx (BPDA)</text>
    <text x="15" y="82" font-size="8.5" fill="#7f1d1d"><tspan font-weight="600">Transformation Invariance:</tspan> Expectation Over Transformation</text>
    <text x="15" y="100" font-size="8.5" fill="#7f1d1d"><tspan font-weight="600">Stress Benchmarks:</tspan> Multi-restart PGD and AutoAttack</text>
    <text x="15" y="118" font-size="7.5" fill="#991b1b">Evaluates empirical worst-case risk against adaptive search</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <line x1="595" y1="150" x2="595" y2="215" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="573" y="176" width="44" height="15" rx="2" fill="#EAF1F8"/>
  <text x="595" y="187" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1F407A">DEFEND</text>

  <!-- PHASE 3: BOTTOM RIGHT -->
  <g transform="translate(425, 215)">
    <rect width="340" height="130" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <rect width="340" height="26" rx="3" fill="#EAF1F8"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#1F407A">3. Harden Defenses &amp; System Controls</text>
    <text x="15" y="46" font-size="8.5" fill="#334155"><tspan font-weight="600">Robust Training:</tspan> Minimax saddle optimization min_θ max_δ L</text>
    <text x="15" y="64" font-size="8.5" fill="#334155"><tspan font-weight="600">Certified Bounds:</tspan> Randomized smoothing, interval bounds</text>
    <text x="15" y="82" font-size="8.5" fill="#334155"><tspan font-weight="600">System Mitigations:</tspan> Rate limits, logit truncation, input filters</text>
    <text x="15" y="100" font-size="8.5" fill="#334155"><tspan font-weight="600">Execution Enclaves:</tspan> TEE weight encryption, watermarking</text>
    <text x="15" y="118" font-size="7.5" fill="#1F407A">Updates security posture and operational deployment envelope</text>
  </g>

  <!-- ARROW 3 -> 4 -->
  <line x1="425" y1="280" x2="375" y2="280" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="382" y="266" width="36" height="15" rx="2" fill="#dcfce7"/>
  <text x="400" y="277" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">VERIFY</text>

  <!-- PHASE 4: BOTTOM LEFT -->
  <g transform="translate(35, 215)">
    <rect width="340" height="130" rx="3" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
    <rect width="340" height="26" rx="3" fill="#dcfce7"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#15803d">4. Continuous Verification in CI/CD</text>
    <text x="15" y="46" font-size="8.5" fill="#166534"><tspan font-weight="600">Pipeline Gating:</tspan> Retest on weight, tokenizer, or data updates</text>
    <text x="15" y="64" font-size="8.5" fill="#166534"><tspan font-weight="600">Anomaly Telemetry:</tspan> Flag sudden query entropy shifts</text>
    <text x="15" y="82" font-size="8.5" fill="#166534"><tspan font-weight="600">Canary Auditing:</tspan> Deploy honeytoken probes to detect theft</text>
    <text x="15" y="100" font-size="8.5" fill="#166534"><tspan font-weight="600">Runtime Hygiene:</tspan> Patch framework CVEs (PyTorch, CUDA)</text>
    <text x="15" y="118" font-size="7.5" fill="#15803d">Production drift can silently invalidate earlier certifications</text>
  </g>

  <!-- ARROW 4 -> 1 -->
  <line x1="205" y1="215" x2="205" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <rect x="183" y="176" width="44" height="15" rx="2" fill="#f1f5f9"/>
  <text x="205" y="187" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">REVISE</text>

  <!-- Center Hub Annotation -->
  <g transform="translate(345, 168)">
    <rect width="110" height="28" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="55" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Review Cycle</text>
  </g>
</svg>
