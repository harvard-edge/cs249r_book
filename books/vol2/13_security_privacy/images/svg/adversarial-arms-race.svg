<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Top Header Banner Pill -->
  <rect x="200.0" y="18" width="600" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500.0" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.2px">ITERATIVE ML DEFENSE LIFECYCLE · ADAPTIVE SECURITY VERIFICATION</text>
  <rect x="415" y="278" width="170" height="34" rx="17" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" letter-spacing="1px">∞ CLOSED CYCLE</text>
  <!-- Phase 1: Specify Attacker Model -->
  <rect x="40" y="65" width="425" height="185" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="55" y="78" width="80" height="24" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="95" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.8px">PHASE 1</text>
  <text x="145" y="95" font-size="14" font-weight="700" fill="#1e40af">Specify Threat Model &amp; Surface</text>
  <rect x="55" y="112" width="395" height="125" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="70" y="132" font-size="12" font-weight="700" fill="#0f172a">Attacker Capabilities &amp; Access Scope</text>
  <text x="70" y="152" font-size="11" fill="#475569">• Access: White-box (gradients), Gray-box, or Black-box (API)</text>
  <text x="70" y="170" font-size="11" fill="#475569">• Budget: Norm-bounded perturbation ε in L_∞ / L_2, or edit radius</text>
  <text x="70" y="188" font-size="11" fill="#475569">• Knowledge: Loss function, defense filters, tokenizers, logits</text>
  <text x="70" y="208" font-size="10" font-weight="600" fill="#2563eb">Goal: Untargeted misclassification vs. targeted class impersonation</text>
  <path d="M 465 157 L 535 157" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="500" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">ADAPT</text>
  <!-- Phase 2: Evaluate Adaptive Attacks -->
  <rect x="535" y="65" width="425" height="185" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="550" y="78" width="80" height="24" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="590" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b" letter-spacing="0.8px">PHASE 2</text>
  <text x="640" y="95" font-size="14" font-weight="700" fill="#991b1b">Evaluate Adaptive Stress Attacks</text>
  <rect x="550" y="112" width="395" height="125" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="565" y="132" font-size="12" font-weight="700" fill="#0f172a">Worst-Case Adversarial Stress Testing</text>
  <text x="565" y="152" font-size="11" fill="#475569">• Tailored Evasion: Optimize attacks directly against defense rules</text>
  <text x="565" y="170" font-size="11" fill="#475569">• Gradient Bypass: Backward Pass Differentiable Approx (BPDA)</text>
  <text x="565" y="188" font-size="11" fill="#475569">• Stochastic Invariance: Expectation Over Transformation (EOT)</text>
  <text x="565" y="208" font-size="10" font-weight="600" fill="#dc2626">Multi-restart PGD and AutoAttack evaluate true worst-case risk</text>
  <path d="M 747 250 L 747 330" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="757" y="295" font-size="10" font-weight="700" fill="#7c3aed">DEFEND</text>
  <!-- Phase 3: Revise Controls & Defenses -->
  <rect x="535" y="330" width="425" height="195" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="550" y="343" width="80" height="24" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="590" y="359" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6" letter-spacing="0.8px">PHASE 3</text>
  <text x="640" y="360" font-size="14" font-weight="700" fill="#5b21b6">Revise Defenses &amp; System Controls</text>
  <rect x="550" y="377" width="395" height="135" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="565" y="397" font-size="12" font-weight="700" fill="#0f172a">Defense-in-Depth &amp; Certified Bounds</text>
  <text x="565" y="417" font-size="11" fill="#475569">• Robust Training: Minimax adversarial training (min_θ max_δ L)</text>
  <text x="565" y="435" font-size="11" fill="#475569">• Certified Guarantees: Randomized smoothing, interval bounds</text>
  <text x="565" y="453" font-size="11" fill="#475569">• Systems Mitigations: API rate limits, top-1 logit truncation, filters</text>
  <text x="565" y="471" font-size="11" fill="#475569">• Safe Runtime: TEE weight enclaves, cryptographic watermarking</text>
  <text x="565" y="493" font-size="10" font-weight="600" fill="#7c3aed">Updates security assumptions and deployment boundaries</text>
  <path d="M 535 427 L 465 427" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="500" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">VERIFY</text>
  <!-- Phase 4: Continuous Pipeline Verification -->
  <rect x="40" y="330" width="425" height="195" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="55" y="343" width="80" height="24" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="95" y="359" text-anchor="middle" font-size="11" font-weight="700" fill="#166534" letter-spacing="0.8px">PHASE 4</text>
  <text x="145" y="360" font-size="14" font-weight="700" fill="#166534">Continuous Verification in CI/CD</text>
  <rect x="55" y="377" width="395" height="135" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="70" y="397" font-size="12" font-weight="700" fill="#0f172a">Retest Under Production Drift &amp; Change</text>
  <text x="70" y="417" font-size="11" fill="#475569">• Pipeline Regression: Retest when weights or tokenizers change</text>
  <text x="70" y="435" font-size="11" fill="#475569">• Anomaly Telemetry: Flag sudden query entropy shifts or bursts</text>
  <text x="70" y="453" font-size="11" fill="#475569">• Canary Auditing: Deploy honeytoken probes to detect attackers</text>
  <text x="70" y="471" font-size="11" fill="#475569">• Dependency Hygiene: Patch framework runtime CVEs (PyTorch/CUDA)</text>
  <text x="70" y="493" font-size="10" font-weight="600" fill="#166534">Production changes can silently invalidate certified margins</text>
  <path d="M 252 330 L 252 250" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="242" y="295" text-anchor="end" font-size="10" font-weight="700" fill="#2563eb">REVISE</text>
  <!-- Bottom Takeaway Card -->
  <rect x="40" y="548" width="920" height="56" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="55" y="562" width="165" height="26" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="137" y="579" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" letter-spacing="0.8px">SECURITY AXIOM</text>
  <text x="235" y="575" font-size="12" font-weight="700" fill="#92400e">Static Defenses Inevitably Fail Against Adaptive Adversaries</text>
  <text x="235" y="593" font-size="11" fill="#475569">Defenses only resist the attacks tested. Real security requires continual red-teaming, adaptive evaluation, and pipeline regression gating.</text>
</svg>