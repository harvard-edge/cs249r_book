<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#15803d"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- PHASE 1: TOP LEFT -->
  <g transform="translate(30, 25)">
    <rect width="320" height="135" rx="3" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2"/>
    <rect width="320" height="26" rx="3" fill="#EAF1F8"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#1F407A">1. Specify Threat Model &amp; Surface</text>
    <text x="15" y="48" font-size="9" fill="#334155"><tspan font-weight="600">Access Scope:</tspan> White-box (gradients), gray-box, or black-box API</text>
    <text x="15" y="66" font-size="9" fill="#334155"><tspan font-weight="600">Perturbation Budget:</tspan> Norm bound ε in L_∞, L_2, or edit radius</text>
    <text x="15" y="84" font-size="9" fill="#334155"><tspan font-weight="600">Attacker Knowledge:</tspan> Loss function, defenses, tokenizers, logits</text>
    <text x="15" y="102" font-size="9" fill="#334155"><tspan font-weight="600">Objective:</tspan> Untargeted evasion vs. targeted class impersonation</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <line x1="350" y1="92" x2="400" y2="92" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="357" y="78" width="36" height="15" rx="2" fill="#fee2e2"/>
  <text x="375" y="89" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">ADAPT</text>

  <!-- PHASE 2: TOP RIGHT -->
  <g transform="translate(410, 25)">
    <rect width="320" height="135" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
    <rect width="320" height="26" rx="3" fill="#fee2e2"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#b91c1c">2. Evaluate Adaptive Stress Attacks</text>
    <text x="15" y="48" font-size="9" fill="#7f1d1d"><tspan font-weight="600">Tailored Evasion:</tspan> Optimize attacks against specific defense rules</text>
    <text x="15" y="66" font-size="9" fill="#7f1d1d"><tspan font-weight="600">Gradient Bypass:</tspan> Backward Pass Differentiable Approx (BPDA)</text>
    <text x="15" y="84" font-size="9" fill="#7f1d1d"><tspan font-weight="600">Transformation Invariance:</tspan> Expectation Over Transformation</text>
    <text x="15" y="102" font-size="9" fill="#7f1d1d"><tspan font-weight="600">Benchmark Standard:</tspan> Multi-restart PGD and AutoAttack</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <line x1="570" y1="160" x2="570" y2="210" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="548" y="177" width="44" height="15" rx="2" fill="#EAF1F8"/>
  <text x="570" y="188" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1F407A">DEFEND</text>

  <!-- PHASE 3: BOTTOM RIGHT -->
  <g transform="translate(410, 220)">
    <rect width="320" height="135" rx="3" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2"/>
    <rect width="320" height="26" rx="3" fill="#EAF1F8"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#1F407A">3. Harden Defenses &amp; System Controls</text>
    <text x="15" y="48" font-size="9" fill="#334155"><tspan font-weight="600">Robust Training:</tspan> Minimax saddle-point optimization min_θ max_δ L</text>
    <text x="15" y="66" font-size="9" fill="#334155"><tspan font-weight="600">Certified Bounds:</tspan> Randomized smoothing, interval bound propagation</text>
    <text x="15" y="84" font-size="9" fill="#334155"><tspan font-weight="600">System Mitigations:</tspan> API rate limits, top-1 logit truncation, filtering</text>
    <text x="15" y="102" font-size="9" fill="#334155"><tspan font-weight="600">Hardware Runtime:</tspan> TEE weight enclaves, cryptographic integrity</text>
  </g>

  <!-- ARROW 3 -> 4 -->
  <line x1="410" y1="287" x2="360" y2="287" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="367" y="273" width="36" height="15" rx="2" fill="#dcfce7"/>
  <text x="385" y="284" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">VERIFY</text>

  <!-- PHASE 4: BOTTOM LEFT -->
  <g transform="translate(30, 220)">
    <rect width="320" height="135" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
    <rect width="320" height="26" rx="3" fill="#dcfce7"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#15803d">4. Continuous Verification in CI/CD</text>
    <text x="15" y="48" font-size="9" fill="#166534"><tspan font-weight="600">Pipeline Regression:</tspan> Retest when weights, tokenizers, or data change</text>
    <text x="15" y="66" font-size="9" fill="#166534"><tspan font-weight="600">Anomaly Telemetry:</tspan> Flag sudden query entropy shifts or burst patterns</text>
    <text x="15" y="84" font-size="9" fill="#166534"><tspan font-weight="600">Canary Auditing:</tspan> Deploy honeypot probes to detect extraction attempts</text>
    <text x="15" y="102" font-size="9" fill="#166534"><tspan font-weight="600">Runtime Hygiene:</tspan> Track dependencies, patch framework execution CVEs</text>
  </g>

  <!-- ARROW 4 -> 1 -->
  <line x1="190" y1="220" x2="190" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <rect x="168" y="187" width="44" height="15" rx="2" fill="#f1f5f9"/>
  <text x="190" y="198" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">REVISE</text>

  <!-- Center Hub Annotation -->
  <g transform="translate(325, 175)">
    <rect width="110" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="55" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Iterative Lifecycle</text>
  </g>
</svg>
