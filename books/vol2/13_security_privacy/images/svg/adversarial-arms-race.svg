<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="272" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="40" y="20" width="250" height="92" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="165" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">1  Specify the adversary</text>
  <text x="165" y="74" text-anchor="middle" font-size="12" fill="#475569">access: white, gray, or black box</text>
  <text x="165" y="91" text-anchor="middle" font-size="12" fill="#475569">perturbation budget and goal</text>
  <rect x="390" y="20" width="250" height="92" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="515" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">2  Run adaptive attacks</text>
  <text x="515" y="74" text-anchor="middle" font-size="12" fill="#475569">attacks tuned to the defense</text>
  <text x="515" y="91" text-anchor="middle" font-size="12" fill="#475569">physical and digital variants</text>
  <rect x="390" y="160" width="250" height="92" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="515" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">3  Harden the system</text>
  <text x="515" y="214" text-anchor="middle" font-size="12" fill="#475569">robust training, input filters</text>
  <text x="515" y="231" text-anchor="middle" font-size="12" fill="#475569">rate limits, isolation</text>
  <rect x="40" y="160" width="250" height="92" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="165" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">4  Retest after changes</text>
  <text x="165" y="214" text-anchor="middle" font-size="12" fill="#475569">new weights, data, or deployment</text>
  <!-- ===== Cycle ===== -->
  <path d="M290,66 H388" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M515,112 V158" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M390,206 H292" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M165,160 V114" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)"/>
</svg>
