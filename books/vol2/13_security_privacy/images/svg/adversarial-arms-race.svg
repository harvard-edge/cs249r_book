<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Box 1: Threat Model (Blue) -->
  <rect x="40" y="30" width="270" height="72" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="175" y="62" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Specify attacker model</text>
  <text x="175" y="82" font-size="11" text-anchor="middle" fill="#475569">Capabilities, access, and deployment scope</text>

  <!-- Box 2: Adaptive Attack (Red) -->
  <rect x="410" y="30" width="270" height="72" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="545" y="62" font-size="13" font-weight="600" text-anchor="middle" fill="#991b1b">Evaluate adaptive attacks</text>
  <text x="545" y="82" font-size="11" text-anchor="middle" fill="#7f1d1d">Stress test against worst-case adversaries</text>

  <!-- Box 3: Controls (Purple) -->
  <rect x="410" y="200" width="270" height="72" rx="4" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="545" y="232" font-size="13" font-weight="600" text-anchor="middle" fill="#581c87">Revise controls and defenses</text>
  <text x="545" y="252" font-size="11" text-anchor="middle" fill="#6b21a8">Update assumptions, rate limits, and filters</text>

  <!-- Box 4: Continuous Verification (Green) -->
  <rect x="40" y="200" width="270" height="72" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="175" y="232" font-size="13" font-weight="600" text-anchor="middle" fill="#166534">Continuous verification</text>
  <text x="175" y="252" font-size="11" text-anchor="middle" fill="#14532d">Retest after pipelines and models change</text>

  <!-- Connectors -->
  <path d="M310 66 H410" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M545 102 V200" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M410 236 H310" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M175 200 V102" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Center Badge -->
  <rect x="270" y="137" width="180" height="26" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="360" y="154" font-size="10" font-weight="700" text-anchor="middle" fill="#475569" letter-spacing="0.5">ITERATIVE SECURITY CYCLE</text>
</svg>
