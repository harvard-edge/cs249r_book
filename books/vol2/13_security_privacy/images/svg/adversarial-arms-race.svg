<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== Review cycle between the steps (neutral) ===== -->
  <g stroke="#64748b" stroke-width="1.2" fill="none">
    <path d="M230,58 H448" marker-end="url(#arr-gray)"/>
    <path d="M555,96 V232" marker-end="url(#arr-gray)"/>
    <path d="M125,234 V98" marker-end="url(#arr-gray)"/>
  </g>
  <text x="565" y="168" text-anchor="start" font-size="11" fill="#475569">results</text>

  <!-- ===== System under evaluation: model inside its defense ===== -->
  <path d="M412,118 H270 V214 H412 V166 M412,134 V118" stroke="#16a34a" stroke-width="2" fill="#f0fdf4"/>
  <text x="280" y="134" text-anchor="start" font-size="11" font-weight="700" fill="#15803d">defense</text>
  <rect x="300" y="142" width="80" height="56" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <g stroke="#1F407A" stroke-width="0.5">
    <rect x="312" y="150" width="14" height="10" fill="#b9cce3"/>
    <rect x="326" y="150" width="14" height="10" fill="#EAF1F8"/>
    <rect x="340" y="150" width="14" height="10" fill="#8aa6cb"/>
    <rect x="354" y="150" width="14" height="10" fill="#EAF1F8"/>
    <rect x="312" y="160" width="14" height="10" fill="#EAF1F8"/>
    <rect x="326" y="160" width="14" height="10" fill="#8aa6cb"/>
    <rect x="340" y="160" width="14" height="10" fill="#EAF1F8"/>
    <rect x="354" y="160" width="14" height="10" fill="#b9cce3"/>
  </g>
  <text x="340" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">model</text>

  <!-- step 2 strikes the system through a gap in the defense -->
  <path d="M480,96 V150 H382" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <!-- step 3 revises the defense -->
  <path d="M448,270 H392 V216" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <!-- step 4 re-evaluates the changed system -->
  <path d="M290,214 V270 H232" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>

  <!-- ===== Steps ===== -->
  <rect x="20" y="24" width="210" height="72" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="32" y="44" text-anchor="start" font-size="12" font-weight="700" fill="#14294E">1  Specify the adversary</text>
  <rect x="32" y="54" width="12" height="12" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="48" y="64" text-anchor="start" font-size="11" fill="#334155">white</text>
  <rect x="86" y="54" width="12" height="12" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <text x="102" y="64" text-anchor="start" font-size="11" fill="#334155">gray</text>
  <rect x="134" y="54" width="12" height="12" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="150" y="64" text-anchor="start" font-size="11" fill="#334155">black box</text>
  <text x="32" y="84" text-anchor="start" font-size="11" fill="#334155">perturbation budget, goal</text>

  <rect x="450" y="24" width="210" height="72" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="462" y="44" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">2  Run adaptive attacks</text>
  <text x="462" y="64" text-anchor="start" font-size="11" fill="#334155">tuned to the defense</text>
  <text x="462" y="80" text-anchor="start" font-size="11" fill="#334155">physical and digital variants</text>

  <rect x="450" y="234" width="210" height="72" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="462" y="254" text-anchor="start" font-size="12" font-weight="700" fill="#14294E">3  Harden the system</text>
  <text x="462" y="274" text-anchor="start" font-size="11" fill="#334155">robust training, input filters</text>
  <text x="462" y="290" text-anchor="start" font-size="11" fill="#334155">rate limits, isolation</text>

  <rect x="20" y="234" width="210" height="72" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="32" y="254" text-anchor="start" font-size="12" font-weight="700" fill="#14294E">4  Retest after changes</text>
  <text x="32" y="274" text-anchor="start" font-size="11" fill="#334155">new weights, data, deployment</text>
  <text x="32" y="292" text-anchor="start" font-size="11" fill="#64748b">earlier evidence</text>
  <path d="M31,288.8 H109.5" stroke="#64748b" stroke-width="1" fill="none"/>
</svg>
