        <rect x="8" y="8" width="80" height="18" rx="2" fill="#fee2e2"/>
        <text x="48" y="20" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">POISONING</text>
        <text x="96" y="21" font-size="10" font-weight="700" fill="#991b1b">Data Scraping Ingestion</text>
        <text x="10" y="40" font-size="8.5" fill="#7f1d1d">Malicious web corpora injection,</text>
        <text x="10" y="51" font-size="8.5" fill="#7f1d1d">compromised data vendors &amp; crawlers</text>
      </g>
      <!-- Arrow Left -> Center -->
      <line x1="240" y1="30" x2="294" y2="30" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-threat)"/>

