        <text x="86" y="21" font-size="10" font-weight="700" fill="#15803d">Watermarking &amp; TEEs</text>
        <text x="10" y="40" font-size="8.5" fill="#14532d">Weight encryption at rest, enclaves (AMD SEV),</text>
