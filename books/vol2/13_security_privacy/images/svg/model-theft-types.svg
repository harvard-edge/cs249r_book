<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <!-- ===== Exact artifact theft ===== -->
  <text x="180" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Exact artifact theft</text>
  <rect x="40" y="44" width="280" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="180" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Access model artifact</text>
  <text x="180" y="83" text-anchor="middle" font-size="12" fill="#475569">registry, bucket, or device</text>
  <path d="M180,96 V116" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="40" y="118" width="280" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="180" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Extract internal properties</text>
  <text x="180" y="157" text-anchor="middle" font-size="12" fill="#475569">weights, architecture, settings</text>
  <path d="M180,170 V190" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="40" y="192" width="280" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="180" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Reconstruct original model</text>
  <text x="180" y="231" text-anchor="middle" font-size="12" fill="#475569">no training cost paid</text>
  <path d="M180,244 V264" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="40" y="266" width="280" height="52" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="180" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Exact copy</text>
  <!-- ===== Approximate behavioral theft ===== -->
  <text x="500" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Approximate behavioral theft</text>
  <rect x="360" y="44" width="280" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Query deployed API</text>
  <text x="500" y="83" text-anchor="middle" font-size="12" fill="#475569">crafted or synthetic inputs</text>
  <path d="M500,96 V116" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="360" y="118" width="280" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Observe output signals</text>
  <text x="500" y="157" text-anchor="middle" font-size="12" fill="#475569">labels, logits, scores</text>
  <path d="M500,170 V190" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="360" y="192" width="280" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Train surrogate model</text>
  <text x="500" y="231" text-anchor="middle" font-size="12" fill="#475569">distill from recorded pairs</text>
  <path d="M500,244 V264" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="360" y="266" width="280" height="52" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="500" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Behavioral clone</text>
  <path d="M340,20 V318" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3" fill="none"/>
</svg>
