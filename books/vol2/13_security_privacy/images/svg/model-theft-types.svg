<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-flow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Center Comparative Pill -->
    <g transform="translate(280, 16)">
      <rect x="0" y="0" width="360" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="180" y="17" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="0.5">TWO ACCESS PARADIGMS · COMMON ASSET RISK</text>
    </g>

    <!-- LEFT COLUMN: EXACT ARTIFACT THEFT -->
    <g transform="translate(36, 54)">
      <!-- Main Container Card -->
      <rect x="0" y="0" width="410" height="390" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
      <!-- Header -->
      <rect x="12" y="12" width="386" height="36" rx="3" fill="#fef2f2" stroke="#fee2e2" stroke-width="1"/>
      <rect x="20" y="18" width="100" height="22" rx="2" fill="#fee2e2"/>
      <text x="70" y="32" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">DIRECT ACCESS</text>
      <text x="130" y="33" font-size="11" font-weight="700" fill="#991b1b">Exact Artifact Theft</text>

      <!-- Step 1: Storage / Checkpoint Infiltration -->
      <g transform="translate(16, 60)">
        <rect x="0" y="0" width="378" height="66" rx="3" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
        <rect x="10" y="10" width="48" height="18" rx="2" fill="#fee2e2"/>
        <text x="34" y="22" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">STEP 1</text>
        <text x="68" y="23" font-size="10.5" font-weight="700" fill="#1e293b">Model Checkpoint Exfiltration</text>
        <text x="12" y="43" font-size="8.5" fill="#475569">Attacker breaches model registry, S3/GCS bucket,</text>
        <text x="12" y="55" font-size="8.5" fill="#475569">unprotected edge flash memory, or developer laptop.</text>
      </g>

      <!-- Arrow Down -->
      <line x1="205" y1="126" x2="205" y2="148" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

      <!-- Step 2: Weight Extraction -->
      <g transform="translate(16, 148)">
        <rect x="0" y="0" width="378" height="66" rx="3" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
        <rect x="10" y="10" width="48" height="18" rx="2" fill="#fee2e2"/>
        <text x="34" y="22" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">STEP 2</text>
        <text x="68" y="23" font-size="10.5" font-weight="700" fill="#1e293b">Tensor &amp; Hyperparameter Parsing</text>
        <text x="12" y="43" font-size="8.5" fill="#475569">Deserializes exact floating-point tensor matrices (FP16/INT8),</text>
        <text x="12" y="55" font-size="8.5" fill="#475569">layer topology configs, tokenizer vocabs, and embeddings.</text>
      </g>

      <!-- Arrow Down -->
      <line x1="205" y1="214" x2="205" y2="236" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

      <!-- Step 3: Direct Replication -->
      <g transform="translate(16, 236)">
        <rect x="0" y="0" width="378" height="66" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
        <rect x="10" y="10" width="48" height="18" rx="2" fill="#dc2626"/>
        <text x="34" y="22" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">RESULT</text>
        <text x="68" y="23" font-size="10.5" font-weight="700" fill="#991b1b">100% Exact Bitwise Replica</text>
        <text x="12" y="43" font-size="8.5" fill="#7f1d1d">Immediate piracy, resale, or zero-day vulnerability discovery</text>
        <text x="12" y="55" font-size="8.5" fill="#7f1d1d">without needing query budgets or surrogate training.</text>
      </g>

      <!-- Summary Pill Box -->
      <g transform="translate(16, 316)">
        <rect x="0" y="0" width="378" height="58" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#475569">ATTACK CHARACTERISTICS</text>
        <text x="12" y="34" font-size="8.5" fill="#64748b"><tspan font-weight="600" fill="#334155">Access:</tspan><tspan dx="4">Storage creds, OS shell, or bus probe</tspan></text>
        <text x="12" y="47" font-size="8.5" fill="#64748b"><tspan font-weight="600" fill="#334155">Expense:</tspan><tspan dx="4">$0 (Direct download / memory dump)</tspan></text>
      </g>
    </g>

    <!-- RIGHT COLUMN: APPROXIMATE BEHAVIORAL THEFT -->
    <g transform="translate(474, 54)">
      <!-- Main Container Card -->
      <rect x="0" y="0" width="410" height="390" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
      <!-- Header -->
      <rect x="12" y="12" width="386" height="36" rx="3" fill="#eff6ff" stroke="#dbeafe" stroke-width="1"/>
      <rect x="20" y="18" width="108" height="22" rx="2" fill="#dbeafe"/>
      <text x="74" y="32" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">BLACK-BOX API</text>
      <text x="138" y="33" font-size="11" font-weight="700" fill="#1e40af">Behavioral Model Stealing</text>

      <!-- Step 1: Systematic API Probing -->
      <g transform="translate(16, 60)">
        <rect x="0" y="0" width="378" height="66" rx="3" fill="#f0f9ff" stroke="#D4E2F0" stroke-width="1"/>
        <rect x="10" y="10" width="48" height="18" rx="2" fill="#EAF1F8"/>
        <text x="34" y="22" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">STEP 1</text>
        <text x="68" y="23" font-size="10.5" font-weight="700" fill="#1e293b">Systematic Query Probing</text>
        <text x="12" y="43" font-size="8.5" fill="#475569">Attacker submits synthesized domain prompts, active-learning</text>
        <text x="12" y="55" font-size="8.5" fill="#475569">samples, or synthetic inputs to public inference endpoint.</text>
      </g>

      <!-- Arrow Down -->
      <line x1="205" y1="126" x2="205" y2="148" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>

      <!-- Step 2: Logit & Label Harvesting -->
      <g transform="translate(16, 148)">
        <rect x="0" y="0" width="378" height="66" rx="3" fill="#f0f9ff" stroke="#D4E2F0" stroke-width="1"/>
        <rect x="10" y="10" width="48" height="18" rx="2" fill="#EAF1F8"/>
        <text x="34" y="22" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">STEP 2</text>
        <text x="68" y="23" font-size="10.5" font-weight="700" fill="#1e293b">Output Observation &amp; Harvesting</text>
        <text x="12" y="43" font-size="8.5" fill="#475569">Collects response pairs (x, f(x)): top-k probabilities,</text>
        <text x="12" y="55" font-size="8.5" fill="#475569">logit distributions, or generated synthetic text tokens.</text>
      </g>

      <!-- Arrow Down -->
      <line x1="205" y1="214" x2="205" y2="236" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>

      <!-- Step 3: Surrogate Distillation -->
      <g transform="translate(16, 236)">
        <rect x="0" y="0" width="378" height="66" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
        <rect x="10" y="10" width="48" height="18" rx="2" fill="#2563eb"/>
        <text x="34" y="22" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">RESULT</text>
        <text x="68" y="23" font-size="10.5" font-weight="700" fill="#1e40af">Surrogate Behavioral Clone</text>
        <text x="12" y="43" font-size="8.5" fill="#1e3a8a">Trains student model via knowledge distillation; matches ~95%</text>
        <text x="12" y="55" font-size="8.5" fill="#1e3a8a">of original task quality at a fraction of pretraining cost.</text>
      </g>

      <!-- Summary Pill Box -->
      <g transform="translate(16, 316)">
        <rect x="0" y="0" width="378" height="58" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#475569">ATTACK CHARACTERISTICS</text>
        <text x="12" y="34" font-size="8.5" fill="#64748b"><tspan font-weight="600" fill="#334155">Access:</tspan><tspan dx="4">Standard inference API authorization token</tspan></text>
        <text x="12" y="47" font-size="8.5" fill="#64748b"><tspan font-weight="600" fill="#334155">Expense:</tspan><tspan dx="4">$100s to $10,000s in automated API queries</tspan></text>
      </g>
    </g>

    <!-- BOTTOM ROW: DEFENSIVE COUNTERMEASURES -->
    <g transform="translate(36, 456)">
      <rect x="0" y="0" width="848" height="68" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="12" y="10" width="136" height="20" rx="2" fill="#dcfce7"/>
      <text x="80" y="23" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">DEFENSIVE MEASURES</text>

      <!-- Left Countermeasures -->
      <g transform="translate(164, 10)">
        <text x="0" y="13" font-size="9" font-weight="700" fill="#15803d">Against Artifact Theft</text>
        <text x="0" y="27" font-size="8.5" fill="#14532d">Weight encryption at rest, hardware enclaves (TEE),</text>
        <text x="0" y="40" font-size="8.5" fill="#14532d">SafeTensors format, and cryptographic watermarks</text>
      </g>

      <!-- Vertical divider -->
      <line x1="500" y1="8" x2="500" y2="60" stroke="#bbf7d0" stroke-width="1"/>

      <!-- Right Countermeasures -->
      <g transform="translate(516, 10)">
        <text x="0" y="13" font-size="9" font-weight="700" fill="#15803d">Against Behavioral Theft</text>
        <text x="0" y="27" font-size="8.5" fill="#14532d">API volume rate limiting, IP reputation firewalls,</text>
        <text x="0" y="40" font-size="8.5" fill="#14532d">logit rounding / top-1 truncation, and DP noise</text>
      </g>
    </g>
  </g>
</svg>
