<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- ===== Panel frames ===== -->
  <rect x="20" y="20" width="310" height="190" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="350" y="20" width="310" height="190" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="230" width="310" height="190" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="350" y="230" width="310" height="190" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <path d="M21,46 H329 M351,46 H659 M21,256 H329 M351,256 H659" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="38" font-size="12" font-weight="700" fill="#0f172a">A<tspan dx="8">Chip fingerprint</tspan></text>
  <text x="362" y="38" font-size="12" font-weight="700" fill="#0f172a">B<tspan dx="8">Optical PUF</tspan></text>
  <text x="32" y="248" font-size="12" font-weight="700" fill="#0f172a">C<tspan dx="8">Arbiter PUF</tspan></text>
  <text x="362" y="248" font-size="12" font-weight="700" fill="#0f172a">D<tspan dx="8">SRAM PUF</tspan></text>

  <!-- ===== A: same design, different microstructure ===== -->
  <text x="175" y="70" text-anchor="middle" font-size="12" fill="#475569">same design, same challenge <tspan font-style="italic">C</tspan></text>
  <rect x="80" y="82" width="70" height="60" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="92" cy="94" r="2.5" fill="#1F407A"/>
  <circle cx="118" cy="100" r="3.5" fill="#1F407A"/>
  <circle cx="138" cy="92" r="2" fill="#1F407A"/>
  <circle cx="100" cy="124" r="3" fill="#1F407A"/>
  <circle cx="132" cy="130" r="2.5" fill="#1F407A"/>
  <circle cx="114" cy="116" r="1.8" fill="#1F407A"/>
  <rect x="200" y="82" width="70" height="60" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="214" cy="104" r="3" fill="#1F407A"/>
  <circle cx="230" cy="90" r="2" fill="#1F407A"/>
  <circle cx="256" cy="98" r="3.5" fill="#1F407A"/>
  <circle cx="222" cy="130" r="2.5" fill="#1F407A"/>
  <circle cx="248" cy="122" r="2" fill="#1F407A"/>
  <circle cx="260" cy="134" r="2.5" fill="#1F407A"/>
  <path d="M115,142 V158" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M235,142 V158" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="75" y="160" width="80" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="115" y="179" text-anchor="middle" font-size="12" fill="#0f172a">response <tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">1</tspan></text>
  <rect x="195" y="160" width="80" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="235" y="179" text-anchor="middle" font-size="12" fill="#0f172a">response <tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">2</tspan></text>
  <text x="175" y="181" text-anchor="middle" font-size="16" fill="#0f172a">≠</text>

  <!-- ===== B: optical PUF (angled beam, scattering token, speckle) ===== -->
  <!-- laser housing, tilted along the beam -->
  <g transform="rotate(19 392 76)">
    <rect x="372" y="69" width="34" height="14" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <rect x="406" y="72" width="4" height="8" fill="#64748b"/>
  </g>
  <!-- surface normal + incidence angle -->
  <path d="M476,104 H428" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
  <path d="M442,104 A34,34 0 0,1 443.7,93.5" stroke="#1F407A" stroke-width="1" fill="none"/>
  <!-- incident beam (challenge) -->
  <path d="M410,82.5 L474,104" stroke="#1F407A" stroke-width="1.6" fill="none" marker-end="url(#arr-blue)"/>
  <!-- token with random scatterers -->
  <rect x="476" y="66" width="56" height="76" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="486" cy="78" r="2.4" fill="#1F407A"/>
  <circle cx="502" cy="74" r="1.6" fill="#1F407A"/>
  <circle cx="520" cy="82" r="3" fill="#1F407A"/>
  <circle cx="492" cy="96" r="3.2" fill="#1F407A"/>
  <circle cx="510" cy="100" r="2" fill="#1F407A"/>
  <circle cx="524" cy="110" r="2.4" fill="#1F407A"/>
  <circle cx="488" cy="120" r="1.8" fill="#1F407A"/>
  <circle cx="504" cy="124" r="3" fill="#1F407A"/>
  <circle cx="520" cy="132" r="1.8" fill="#1F407A"/>
  <circle cx="496" cy="136" r="2.2" fill="#1F407A"/>
  <path d="M478,104 L492,96 L510,100 L524,110" stroke="#1F407A" stroke-width="0.8" stroke-opacity="0.6" fill="none"/>
  <!-- diverging scattered rays -->
  <path d="M532,104 L580,78 M532,104 L580,94 M532,104 L580,114 M532,104 L580,130" stroke="#64748b" stroke-width="0.9" fill="none"/>
  <!-- speckle tile -->
  <rect x="582" y="70" width="62" height="68" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="592" cy="80" r="2" fill="#475569"/>
  <circle cx="606" cy="92" r="3" fill="#475569"/>
  <circle cx="598" cy="112" r="2.5" fill="#475569"/>
  <circle cx="618" cy="78" r="1.8" fill="#475569"/>
  <circle cx="624" cy="104" r="3" fill="#475569"/>
  <circle cx="636" cy="88" r="2.2" fill="#475569"/>
  <circle cx="634" cy="126" r="2" fill="#475569"/>
  <circle cx="610" cy="128" r="1.6" fill="#475569"/>
  <circle cx="592" cy="130" r="1.8" fill="#475569"/>
  <text x="404" y="160" text-anchor="middle" font-size="12" fill="#475569">challenge <tspan font-style="italic">C</tspan></text>
  <text x="404" y="175" text-anchor="middle" font-size="12" fill="#475569">(beam angle)</text>
  <text x="504" y="160" text-anchor="middle" font-size="12" fill="#475569">random</text>
  <text x="504" y="175" text-anchor="middle" font-size="12" fill="#475569">scatterers</text>
  <text x="613" y="160" text-anchor="middle" font-size="12" fill="#475569">speckle</text>
  <text x="613" y="175" text-anchor="middle" font-size="12" fill="#475569">response <tspan font-style="italic">R</tspan></text>

  <!-- ===== C: arbiter PUF ===== -->
  <text x="30" y="304" font-size="12" fill="#475569">in</text>
  <path d="M46,300 H56 M56,288 V312" stroke="#64748b" stroke-width="1.2" fill="none"/>
  <!-- stage boxes -->
  <rect x="70" y="276" width="36" height="72" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="122" y="276" width="36" height="72" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="196" y="276" width="36" height="72" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="88" y="270" text-anchor="middle" font-size="12" fill="#0f172a"><tspan font-style="italic">C</tspan><tspan font-size="11" dy="3">1</tspan></text>
  <text x="140" y="270" text-anchor="middle" font-size="12" fill="#0f172a"><tspan font-style="italic">C</tspan><tspan font-size="11" dy="3">2</tspan></text>
  <text x="214" y="270" text-anchor="middle" font-size="12" fill="#0f172a" font-style="italic">C<tspan font-size="11" dy="3">k</tspan></text>
  <text x="177" y="316" text-anchor="middle" font-size="14" fill="#475569">· · ·</text>
  <!-- top path -->
  <path d="M56,288 H70 M106,288 H122 L158,336 M158,336 H170 M184,336 H196 M232,336 H250" stroke="#1F407A" stroke-width="1.5" fill="none"/>
  <path d="M70,288 H106" stroke="#1F407A" stroke-width="1.5" fill="none"/>
  <path d="M196,336 H232" stroke="#1F407A" stroke-width="1.5" fill="none"/>
  <!-- bottom path -->
  <path d="M56,312 V336 H70 M70,336 H106 M106,336 H122 L158,288 M158,288 H170 M184,288 H196 M196,288 H232 M232,288 H250" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <rect x="250" y="276" width="56" height="72" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="278" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Arbiter</text>
  <path d="M278,348 V370" stroke="#1F407A" stroke-width="1.2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="278" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">bit <tspan font-style="italic">r</tspan></text>
  <text x="150" y="386" text-anchor="middle" font-size="12" fill="#475569">each <tspan font-style="italic">C</tspan><tspan font-size="11" dy="3" font-style="italic">i</tspan><tspan dy="-3">: straight or crossed</tspan></text>

  <!-- ===== D: SRAM PUF (cross-coupled inverters) ===== -->
  <text x="505" y="274" text-anchor="middle" font-size="12" fill="#475569">threshold-voltage mismatch</text>
  <path d="M488,278 V292" stroke="#64748b" stroke-width="1" fill="none"/>
  <g transform="translate(0,8)">
  <!-- inverter 1 (stronger device): points right, heavier -->
  <path d="M470,276 L470,316 L506,296 Z" fill="#D3E0EF" stroke="#1F407A" stroke-width="2"/>
  <circle cx="510" cy="296" r="4" fill="#ffffff" stroke="#1F407A" stroke-width="1.6"/>
  <!-- inverter 2: points left -->
  <path d="M540,324 L540,364 L504,344 Z" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="500" cy="344" r="4" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <!-- cross connections -->
  <path d="M514,296 H570 V344 H540" stroke="#1F407A" stroke-width="1.2" fill="none"/>
  <path d="M496,344 H440 V296 H470" stroke="#1F407A" stroke-width="1.2" fill="none"/>
  <circle cx="440" cy="320" r="2.5" fill="#1F407A"/>
  <circle cx="570" cy="320" r="2.5" fill="#1F407A"/>
  <text x="430" y="324" text-anchor="end" font-size="12" fill="#0f172a"><tspan font-weight="700">A</tspan> = 0</text>
  <text x="580" y="324" font-size="12" fill="#0f172a"><tspan font-weight="700">B</tspan> = 1</text>
  <text x="505" y="392" text-anchor="middle" font-size="12" fill="#475569">power-up value: preferred 0 or 1</text>
  </g>
</svg>
