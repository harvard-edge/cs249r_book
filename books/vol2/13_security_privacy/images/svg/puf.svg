<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="puf-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F407A"/>
    </marker>
    <marker id="puf-arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="puf-arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="puf-arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- 2x2 GRID OF PUF TYPES -->

    <!-- PANEL A: Silicon Fingerprint Concept (Top-Left) -->
    <g transform="translate(30, 24)">
      <rect x="0" y="0" width="440" height="212" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="14" y="10" width="168" height="20" rx="2" fill="#EAF1F8"/>
      <text x="98" y="24" font-size="10" font-weight="700" fill="#14294E" text-anchor="middle">A: SILICON FINGERPRINT</text>
      <text x="190" y="24" font-size="10" fill="#64748b">Manufacturing Process Variations</text>

      <g transform="translate(14, 38)">
        <!-- Silicon Die Graphic -->
        <rect x="0" y="0" width="190" height="110" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text x="95" y="18" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">Silicon Substrate Microstructure</text>

        <!-- Microscopic fluctuation pattern -->
        <g fill="#94a3b8" opacity="0.6">
          <circle cx="28" cy="36" r="3"/>
          <circle cx="56" cy="48" r="2"/>
          <circle cx="82" cy="32" r="4"/>
          <circle cx="118" cy="44" r="2.5"/>
          <circle cx="146" cy="34" r="3.5"/>
          <circle cx="170" cy="50" r="2"/>
          <circle cx="34" cy="74" r="2.5"/>
          <circle cx="68" cy="86" r="3.5"/>
          <circle cx="98" cy="68" r="2"/>
          <circle cx="132" cy="80" r="4"/>
          <circle cx="162" cy="72" r="2.5"/>
          <circle cx="50" cy="100" r="2"/>
          <circle cx="114" cy="98" r="3"/>
        </g>
        <rect x="20" y="58" width="150" height="30" rx="2" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="0.8" opacity="0.9"/>
        <text x="95" y="73" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">Nanoscale Variations</text>
        <text x="95" y="84" font-size="7.5" fill="#14294E" text-anchor="middle">T_ox, channel length, dopant atoms</text>
      </g>

      <!-- Key Concept Properties -->
      <g transform="translate(216, 38)">
        <rect x="0" y="0" width="210" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="12" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Inherent Properties</text>
        <text x="12" y="34" font-size="8" fill="#64748b">• Unclonable even by foundry</text>
        <text x="12" y="48" font-size="8" fill="#64748b">• Zero stored digital secret</text>
        <text x="12" y="62" font-size="8" fill="#64748b">• Generated only on demand</text>
        <text x="12" y="76" font-size="8" fill="#64748b">• Immune to physical extraction</text>
        <rect x="10" y="84" width="190" height="20" rx="2" fill="#dcfce7"/>
        <text x="105" y="98" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Physical Hardware Anchor</text>
      </g>

      <text x="14" y="166" font-size="8.5" fill="#475569">Each chip has a unique, deterministic fingerprint caused by random microscopic variations</text>
      <text x="14" y="180" font-size="8" fill="#64748b">during photolithography, oxide deposition, and chemical-mechanical polishing (CMP).</text>
      <text x="14" y="196" font-size="8" font-weight="600" fill="#14294E">Fuzzy Extractor + Helper Data reconstructs exact cryptographic keys on demand.</text>
    </g>

    <!-- PANEL B: Optical PUF (Top-Right) -->
    <g transform="translate(490, 24)">
      <rect x="0" y="0" width="440" height="212" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="14" y="10" width="144" height="20" rx="2" fill="#fee2e2"/>
      <text x="86" y="24" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">B: OPTICAL PUF</text>
      <text x="166" y="24" font-size="10" fill="#64748b">Laser Scattering &amp; Speckle</text>

      <g transform="translate(14, 38)">
        <!-- Laser source -->
        <rect x="0" y="10" width="90" height="42" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="45" y="26" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">Laser Diode</text>
        <text x="45" y="40" font-size="7.5" fill="#7f1d1d" text-anchor="middle">Challenge (Angle θ)</text>

        <!-- Laser beam path -->
        <path d="M 90 31 L 130 31" fill="none" stroke="#dc2626" stroke-width="2"/>

        <!-- Scattering medium -->
        <g transform="translate(130, 0)">
          <rect x="0" y="0" width="110" height="66" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="55" y="16" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Scattering Token</text>
          <!-- micro spheres -->
          <circle cx="20" cy="32" r="4" fill="#94a3b8"/>
          <circle cx="45" cy="46" r="3.5" fill="#cbd5e1"/>
          <circle cx="70" cy="28" r="5" fill="#64748b"/>
          <circle cx="92" cy="48" r="4" fill="#94a3b8"/>
          <text x="55" y="60" font-size="7" fill="#64748b" text-anchor="middle">Disordered micro-particles</text>
        </g>

        <!-- Speckle pattern to Sensor -->
        <path d="M 240 33 L 280 33" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#puf-arr-purple)"/>

        <!-- CMOS sensor with speckle -->
        <g transform="translate(284, 0)">
          <rect x="0" y="0" width="128" height="66" rx="2" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
          <text x="64" y="15" font-size="8" font-weight="700" fill="#5b21b6" text-anchor="middle">CMOS Image Sensor</text>
          <!-- Speckle grid dots -->
          <g fill="#4c1d95" opacity="0.8">
            <circle cx="20" cy="28" r="1.5"/>
            <circle cx="34" cy="38" r="2.5"/>
            <circle cx="48" cy="26" r="1.2"/>
            <circle cx="62" cy="42" r="3"/>
            <circle cx="78" cy="30" r="1.8"/>
            <circle cx="92" cy="36" r="2.2"/>
            <circle cx="108" cy="26" r="1.5"/>
            <circle cx="26" cy="50" r="2.8"/>
            <circle cx="54" cy="54" r="1.6"/>
            <circle cx="86" cy="52" r="2.4"/>
            <circle cx="112" cy="48" r="1.5"/>
          </g>
          <text x="64" y="62" font-size="7" font-weight="700" fill="#7c3aed" text-anchor="middle">Unique 2D Speckle Hash</text>
        </g>
      </g>

      <!-- Optical Challenge Response -->
      <g transform="translate(14, 114)">
        <rect x="0" y="0" width="412" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#0f172a">Challenge-Response Mechanism:</text>
        <text x="12" y="32" font-size="8" fill="#475569">Laser angle/wavelength = Challenge (C) ➔ Multiple light scattering ➔ Speckle image = Response (R)</text>
      </g>

      <text x="14" y="174" font-size="8.5" fill="#475569">Complex optical wavefront interference produces astronomical state spaces (> 10¹⁰⁰ combinations).</text>
      <text x="14" y="188" font-size="8" fill="#64748b">Gabor hash transform compresses analog speckle intensities into reproducible bit strings.</text>
      <text x="14" y="202" font-size="8" font-weight="600" fill="#b91c1c">High resistance to mathematical modeling due to wave scattering non-linearity.</text>
    </g>

    <!-- PANEL C: Electronic Arbiter PUF (Bottom-Left) -->
    <g transform="translate(30, 246)">
      <rect x="0" y="0" width="440" height="212" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="14" y="10" width="154" height="20" rx="2" fill="#fef3c7"/>
      <text x="91" y="24" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">C: ARBITER RACE PUF</text>
      <text x="174" y="24" font-size="10" fill="#64748b">Switch MUX Delay Difference</text>

      <g transform="translate(14, 38)">
        <!-- Step Pulse In -->
        <g transform="translate(0, 16)">
          <rect x="0" y="0" width="56" height="40" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="28" y="18" font-size="8.5" font-weight="700" fill="#14294E" text-anchor="middle">Pulse In</text>
          <text x="28" y="30" font-size="8" font-family="monospace" fill="#1F407A" text-anchor="middle">0 ➔ 1</text>
        </g>

        <!-- Path Top and Bottom -->
        <path d="M 56 26 L 82 16" fill="none" stroke="#1F407A" stroke-width="1.5"/>
        <path d="M 56 46 L 82 56" fill="none" stroke="#16a34a" stroke-width="1.5"/>

        <!-- Stage 0 MUX Pair -->
        <g transform="translate(82, 0)">
          <rect x="0" y="6" width="54" height="26" rx="2" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="0.8"/>
          <text x="27" y="22" font-size="8" font-weight="700" fill="#14294E" text-anchor="middle">MUX 0A</text>
          <rect x="0" y="40" width="54" height="26" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="27" y="56" font-size="8" font-weight="700" fill="#16a34a" text-anchor="middle">MUX 0B</text>
          <text x="27" y="76" font-size="7.5" fill="#64748b" text-anchor="middle">C[0]</text>
        </g>

        <!-- Stage 1 MUX Pair -->
        <g transform="translate(156, 0)">
          <rect x="0" y="6" width="54" height="26" rx="2" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="0.8"/>
          <text x="27" y="22" font-size="8" font-weight="700" fill="#14294E" text-anchor="middle">MUX 1A</text>
          <rect x="0" y="40" width="54" height="26" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="27" y="56" font-size="8" font-weight="700" fill="#16a34a" text-anchor="middle">MUX 1B</text>
          <text x="27" y="76" font-size="7.5" fill="#64748b" text-anchor="middle">C[1]</text>
        </g>

        <!-- Stage N-1 MUX Pair -->
        <g transform="translate(242, 0)">
          <text x="-12" y="38" font-size="11" font-weight="700" fill="#94a3b8">•••</text>
          <rect x="0" y="6" width="60" height="26" rx="2" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="0.8"/>
          <text x="30" y="22" font-size="8" font-weight="700" fill="#14294E" text-anchor="middle">MUX nA</text>
          <rect x="0" y="40" width="60" height="26" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="30" y="56" font-size="8" font-weight="700" fill="#16a34a" text-anchor="middle">MUX nB</text>
          <text x="30" y="76" font-size="7.5" fill="#64748b" text-anchor="middle">C[n-1]</text>
        </g>

        <!-- Arbiter Latch -->
        <g transform="translate(324, 6)">
          <rect x="0" y="0" width="88" height="60" rx="3" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
          <text x="44" y="18" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">Arbiter (D-FF)</text>
          <text x="44" y="32" font-size="7.5" fill="#92400e" text-anchor="middle">Race Detector</text>
          <rect x="10" y="38" width="68" height="16" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="0.8"/>
          <text x="44" y="50" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">Bit: 0 or 1</text>
        </g>

        <!-- Interconnect lines between stages -->
        <line x1="136" y1="19" x2="156" y2="19" stroke="#1F407A" stroke-width="1.2"/>
        <line x1="136" y1="53" x2="156" y2="53" stroke="#16a34a" stroke-width="1.2"/>
        <line x1="210" y1="19" x2="228" y2="19" stroke="#1F407A" stroke-width="1.2"/>
        <line x1="210" y1="53" x2="228" y2="53" stroke="#16a34a" stroke-width="1.2"/>
        <line x1="302" y1="19" x2="324" y2="24" stroke="#1F407A" stroke-width="1.5" marker-end="url(#puf-arr-blue)"/>
        <line x1="302" y1="53" x2="324" y2="48" stroke="#16a34a" stroke-width="1.5" marker-end="url(#puf-arr-green)"/>
      </g>

      <text x="14" y="142" font-size="8.5" fill="#475569">Two symmetrical nominal delay paths race simultaneously upon a step transition.</text>
      <text x="14" y="156" font-size="8" fill="#64748b">Challenge bits select straight vs crossed paths at each stage.</text>
      <text x="14" y="170" font-size="8" fill="#64748b">Sub-picosecond delay mismatches (Δt) determine which wavefront hits latch first:</text>
      <g transform="translate(14, 180)">
        <rect x="0" y="0" width="412" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="206" y="16" font-size="8.5" font-family="monospace" font-weight="700" fill="#0f172a" text-anchor="middle">Response R = (t_top &lt; t_bottom) ? 1 : 0</text>
      </g>
    </g>

    <!-- PANEL D: SRAM Startup PUF (Bottom-Right) -->
    <g transform="translate(490, 246)">
      <rect x="0" y="0" width="440" height="212" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="14" y="10" width="154" height="20" rx="2" fill="#dcfce7"/>
      <text x="91" y="24" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">D: SRAM STARTUP PUF</text>
      <text x="174" y="24" font-size="10" fill="#64748b">Bistable Inverter Threshold Bias</text>

      <g transform="translate(14, 38)">
        <!-- 6T Cell Schematic Box -->
        <rect x="0" y="0" width="200" height="106" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="100" y="16" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">6T Cross-Coupled Inverter Cell</text>

        <g transform="translate(14, 26)">
          <!-- Inverter 1 -->
          <rect x="0" y="0" width="76" height="42" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="38" y="18" font-size="8.5" font-weight="700" fill="#16a34a" text-anchor="middle">INV 1 (M1/M2)</text>
          <text x="38" y="32" font-size="7.5" fill="#15803d" text-anchor="middle">Vth₁ = 0.402 V</text>

          <!-- Cross-coupling arrows -->
          <path d="M 76 14 L 96 28" fill="none" stroke="#d97706" stroke-width="1.2"/>
          <path d="M 76 28 L 96 14" fill="none" stroke="#d97706" stroke-width="1.2"/>

          <!-- Inverter 2 -->
          <rect x="96" y="0" width="76" height="42" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="134" y="18" font-size="8.5" font-weight="700" fill="#16a34a" text-anchor="middle">INV 2 (M3/M4)</text>
          <text x="134" y="32" font-size="7.5" fill="#15803d" text-anchor="middle">Vth₂ = 0.395 V</text>
        </g>

        <rect x="10" y="78" width="180" height="20" rx="2" fill="#fefce8" stroke="#fde047" stroke-width="0.8"/>
        <text x="100" y="92" font-size="8" font-weight="700" fill="#854d0e" text-anchor="middle">Threshold Delta: ΔVth = 7 mV</text>
      </g>

      <!-- Startup Dynamics Explanation -->
      <g transform="translate(224, 38)">
        <rect x="0" y="0" width="202" height="106" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="10" y="16" font-size="9" font-weight="700" fill="#0f172a">Power-Up Dynamics:</text>
        <text x="10" y="30" font-size="8" fill="#64748b">1. VDD ramps from 0V ➔ 1.2V</text>
        <text x="10" y="44" font-size="8" fill="#64748b">2. Cell enters metastable state</text>
        <text x="10" y="58" font-size="8" fill="#64748b">3. Transistor with lower Vth conducts</text>
        <text x="10" y="70" font-size="8" fill="#64748b">   faster, pulling output to 0 or 1</text>
        <rect x="8" y="80" width="186" height="20" rx="2" fill="#dcfce7"/>
        <text x="101" y="94" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Stable Power-On Pattern (50% 0s / 1s)</text>
      </g>

      <text x="14" y="162" font-size="8.5" fill="#475569">Standard uninitialized SRAM power-up state acts as an inherent digital key.</text>
      <text x="14" y="176" font-size="8" fill="#64748b">Requires zero specialized analog circuitry; available on commodity microcontrollers.</text>
      <text x="14" y="190" font-size="8" fill="#64748b">BCH error-correcting codes eliminate minor thermal noise (bit error rate &lt; 3%).</text>
      <text x="14" y="204" font-size="8" font-weight="600" fill="#15803d">Silicon RoT Anchor: Keys vanish when unpowered, defeating chip deprocessing.</text>
    </g>

    <!-- BOTTOM SUMMARY: Systems Takeaways for ML -->
    <g transform="translate(30, 470)">
      <rect x="0" y="0" width="900" height="66" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="14" y="12" width="168" height="20" rx="2" fill="#dcfce7"/>
      <text x="98" y="26" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">ML SYSTEMS TAKEAWAYS</text>

      <g transform="translate(192, 12)">
        <text x="0" y="15" font-size="9" font-weight="700" fill="#14532d">Device Authentication in Federated Fleets:</text>
        <text x="210" y="15" font-size="9" fill="#166534">PUF challenge-response pairs prove hardware authenticity before accepting gradient updates.</text>
        <text x="0" y="32" font-size="9" font-weight="700" fill="#14532d">Zero Stored Secret Key Sealing:</text>
        <text x="175" y="32" font-size="9" fill="#166534">Model decryption keys derived on-the-fly; memory inspection reveals nothing when powered off.</text>
        <text x="0" y="48" font-size="9" font-weight="700" fill="#14532d">Anti-Counterfeiting for Edge Models:</text>
        <text x="188" y="48" font-size="9" fill="#166534">Proprietary model binaries cryptographically bound to recipient node silicon fingerprint.</text>
      </g>
    </g>
  </g>
</svg>
