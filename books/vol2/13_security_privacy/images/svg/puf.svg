<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- ===== Panel frames ===== -->
  <rect x="20" y="20" width="310" height="190" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="350" y="20" width="310" height="190" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="230" width="310" height="190" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="350" y="230" width="310" height="190" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <path d="M21,46 H329 M351,46 H659 M21,256 H329 M351,256 H659" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="38" font-size="12" font-weight="700" fill="#0f172a">A<tspan dx="8">Chip fingerprint</tspan></text>
  <text x="362" y="38" font-size="12" font-weight="700" fill="#0f172a">B<tspan dx="8">Optical PUF</tspan></text>
  <text x="32" y="248" font-size="12" font-weight="700" fill="#0f172a">C<tspan dx="8">Arbiter PUF</tspan></text>
  <text x="362" y="248" font-size="12" font-weight="700" fill="#0f172a">D<tspan dx="8">SRAM PUF</tspan></text>

  <!-- ===== A: same design, different microstructure ===== -->
  <text x="175" y="70" text-anchor="middle" font-size="12" fill="#475569">same design, same challenge C</text>
  <rect x="80" y="82" width="70" height="60" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="92" cy="94" r="2.5" fill="#1F407A"/>
  <circle cx="118" cy="100" r="3.5" fill="#1F407A"/>
  <circle cx="138" cy="92" r="2" fill="#1F407A"/>
  <circle cx="100" cy="124" r="3" fill="#1F407A"/>
  <circle cx="132" cy="130" r="2.5" fill="#1F407A"/>
  <circle cx="114" cy="116" r="1.8" fill="#1F407A"/>
  <rect x="200" y="82" width="70" height="60" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="214" cy="104" r="3" fill="#1F407A"/>
  <circle cx="230" cy="90" r="2" fill="#1F407A"/>
  <circle cx="256" cy="98" r="3.5" fill="#1F407A"/>
  <circle cx="222" cy="130" r="2.5" fill="#1F407A"/>
  <circle cx="248" cy="122" r="2" fill="#1F407A"/>
  <circle cx="260" cy="134" r="2.5" fill="#1F407A"/>
  <path d="M115,142 V158" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M235,142 V158" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="75" y="160" width="80" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="115" y="179" text-anchor="middle" font-size="12" fill="#0f172a">response R<tspan font-size="10.5" dy="3">1</tspan></text>
  <rect x="195" y="160" width="80" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="235" y="179" text-anchor="middle" font-size="12" fill="#0f172a">response R<tspan font-size="10.5" dy="3">2</tspan></text>
  <text x="175" y="181" text-anchor="middle" font-size="16" fill="#0f172a">≠</text>

  <!-- ===== B: optical PUF ===== -->
  <rect x="366" y="102" width="76" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="404" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Laser</text>
  <rect x="467" y="102" width="76" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="505" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Token</text>
  <rect x="568" y="102" width="76" height="44" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="578" cy="110" r="2" fill="#475569"/>
  <circle cx="592" cy="120" r="3" fill="#475569"/>
  <circle cx="584" cy="136" r="2.5" fill="#475569"/>
  <circle cx="604" cy="108" r="1.8" fill="#475569"/>
  <circle cx="610" cy="130" r="3" fill="#475569"/>
  <circle cx="622" cy="116" r="2.2" fill="#475569"/>
  <circle cx="628" cy="138" r="2" fill="#475569"/>
  <circle cx="598" cy="142" r="1.6" fill="#475569"/>
  <circle cx="636" cy="108" r="1.8" fill="#475569"/>
  <path d="M442,124 H465" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M543,124 H566" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <text x="404" y="168" text-anchor="middle" font-size="12" fill="#475569">challenge C</text>
  <text x="404" y="183" text-anchor="middle" font-size="12" fill="#475569">(beam angle)</text>
  <text x="505" y="168" text-anchor="middle" font-size="12" fill="#475569">random</text>
  <text x="505" y="183" text-anchor="middle" font-size="12" fill="#475569">scatterers</text>
  <text x="606" y="168" text-anchor="middle" font-size="12" fill="#475569">speckle</text>
  <text x="606" y="183" text-anchor="middle" font-size="12" fill="#475569">response R</text>

  <!-- ===== C: arbiter PUF ===== -->
  <text x="30" y="304" font-size="12" fill="#475569">in</text>
  <path d="M46,300 H56 M56,288 V312" stroke="#64748b" stroke-width="1.2" fill="none"/>
  <!-- stage boxes -->
  <rect x="70" y="276" width="36" height="72" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="122" y="276" width="36" height="72" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="196" y="276" width="36" height="72" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="88" y="270" text-anchor="middle" font-size="12" fill="#0f172a">C<tspan font-size="10.5" dy="3">1</tspan></text>
  <text x="140" y="270" text-anchor="middle" font-size="12" fill="#0f172a">C<tspan font-size="10.5" dy="3">2</tspan></text>
  <text x="214" y="270" text-anchor="middle" font-size="12" fill="#0f172a">C<tspan font-size="10.5" dy="3" font-style="italic">k</tspan></text>
  <text x="177" y="316" text-anchor="middle" font-size="14" fill="#475569">· · ·</text>
  <!-- top path -->
  <path d="M56,288 H70 M106,288 H122 L158,336 M158,336 H170 M184,336 H196 M232,336 H250" stroke="#1F407A" stroke-width="1.5" fill="none"/>
  <path d="M70,288 H106" stroke="#1F407A" stroke-width="1.5" fill="none"/>
  <path d="M196,336 H232" stroke="#1F407A" stroke-width="1.5" fill="none"/>
  <!-- bottom path -->
  <path d="M56,312 V336 H70 M70,336 H106 M106,336 H122 L158,288 M158,288 H170 M184,288 H196 M196,288 H232 M232,288 H250" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <rect x="250" y="276" width="56" height="72" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="278" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Arbiter</text>
  <path d="M278,348 V370" stroke="#1F407A" stroke-width="1.2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="278" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">bit r</text>
  <text x="150" y="386" text-anchor="middle" font-size="12" fill="#475569">each C<tspan font-size="10.5" dy="3" font-style="italic">i</tspan><tspan dy="-3">: straight or crossed</tspan></text>

  <!-- ===== D: SRAM PUF (cross-coupled inverters) ===== -->
  <!-- inverter 1: points right -->
  <path d="M470,276 L470,316 L506,296 Z" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="510" cy="296" r="4" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <!-- inverter 2: points left -->
  <path d="M540,324 L540,364 L504,344 Z" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="500" cy="344" r="4" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <!-- cross connections -->
  <path d="M514,296 H570 V344 H540" stroke="#1F407A" stroke-width="1.2" fill="none"/>
  <path d="M496,344 H440 V296 H470" stroke="#1F407A" stroke-width="1.2" fill="none"/>
  <circle cx="440" cy="320" r="2.5" fill="#1F407A"/>
  <circle cx="570" cy="320" r="2.5" fill="#1F407A"/>
  <text x="430" y="324" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">A</text>
  <text x="580" y="324" font-size="12" font-weight="700" fill="#0f172a">B</text>
  <text x="505" y="272" text-anchor="middle" font-size="12" fill="#475569">threshold-voltage mismatch</text>
  <text x="505" y="396" text-anchor="middle" font-size="12" fill="#475569">power-up value: preferred 0 or 1</text>
</svg>
