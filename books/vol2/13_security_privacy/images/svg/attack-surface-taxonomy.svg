<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-gray-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <g transform="translate(0,12)">

  <!-- ===== Layer containers ===== -->
  <rect x="20" y="80" width="130" height="150" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="30" y="220" text-anchor="start" font-size="11" font-weight="700" fill="#475569">Data layer</text>
  <rect x="170" y="80" width="260" height="150" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="180" y="220" text-anchor="start" font-size="11" font-weight="700" fill="#475569">Model layer</text>
  <rect x="450" y="80" width="120" height="150" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="460" y="220" text-anchor="start" font-size="11" font-weight="700" fill="#475569">Interface layer</text>

  <!-- ── Training data: sample tiles, two poisoned ── -->
  <g stroke-width="0.8">
    <rect x="39" y="100" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="63" y="100" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="87" y="100" width="20" height="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="111" y="100" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="39" y="116" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="63" y="116" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="87" y="116" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="111" y="116" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="39" y="132" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="63" y="132" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="87" y="132" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="111" y="132" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="39" y="148" width="20" height="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="63" y="148" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="87" y="148" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
    <rect x="111" y="148" width="20" height="12" fill="#EAF1F8" stroke="#1F407A"/>
  </g>
  <text x="85" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Training data</text>

  <!-- ── Training job with imported dependencies ── -->
  <rect x="185" y="100" width="110" height="64" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="240" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Training job</text>
  <rect x="197" y="112" width="26" height="16" rx="1" fill="#ffffff" stroke="#64748b" stroke-width="0.8"/>
  <rect x="227" y="112" width="26" height="16" rx="1" fill="#ffffff" stroke="#64748b" stroke-width="0.8"/>
  <rect x="257" y="112" width="26" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="240" y="186" text-anchor="middle" font-size="11" fill="#475569">imported packages</text>

  <!-- ── Weights: parameter matrix ── -->
  <g stroke="#1F407A" stroke-width="0.6">
    <rect x="320" y="100" width="14" height="14" fill="#EAF1F8"/>
    <rect x="334" y="100" width="14" height="14" fill="#b9cce3"/>
    <rect x="348" y="100" width="14" height="14" fill="#EAF1F8"/>
    <rect x="362" y="100" width="14" height="14" fill="#8aa6cb"/>
    <rect x="376" y="100" width="14" height="14" fill="#EAF1F8"/>
    <rect x="320" y="114" width="14" height="14" fill="#8aa6cb"/>
    <rect x="334" y="114" width="14" height="14" fill="#EAF1F8"/>
    <rect x="348" y="114" width="14" height="14" fill="#b9cce3"/>
    <rect x="362" y="114" width="14" height="14" fill="#EAF1F8"/>
    <rect x="376" y="114" width="14" height="14" fill="#b9cce3"/>
    <rect x="320" y="128" width="14" height="14" fill="#EAF1F8"/>
    <rect x="334" y="128" width="14" height="14" fill="#EAF1F8"/>
    <rect x="348" y="128" width="14" height="14" fill="#8aa6cb"/>
    <rect x="362" y="128" width="14" height="14" fill="#b9cce3"/>
    <rect x="376" y="128" width="14" height="14" fill="#EAF1F8"/>
    <rect x="320" y="142" width="14" height="14" fill="#b9cce3"/>
    <rect x="334" y="142" width="14" height="14" fill="#8aa6cb"/>
    <rect x="348" y="142" width="14" height="14" fill="#EAF1F8"/>
    <rect x="362" y="142" width="14" height="14" fill="#EAF1F8"/>
    <rect x="376" y="142" width="14" height="14" fill="#8aa6cb"/>
  </g>
  <rect x="320" y="100" width="70" height="56" fill="none" stroke="#1F407A" stroke-width="1.2"/>
  <text x="355" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Weights</text>

  <!-- ── Serving API and clients ── -->
  <rect x="462" y="100" width="96" height="56" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="510" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Serving API</text>
  <rect x="622" y="102" width="34" height="14" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="622" y="121" width="34" height="14" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="622" y="140" width="34" height="14" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="639" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Clients</text>
  <path d="M560,128 H620" stroke="#64748b" stroke-width="1.2" fill="none" marker-start="url(#arr-gray-start)" marker-end="url(#arr-gray)"/>
  <text x="590" y="120" text-anchor="middle" font-size="11" fill="#475569">queries</text>

  <!-- ── Pipeline flow ── -->
  <path d="M131,130 H183" stroke="#1F407A" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>
  <path d="M295,130 H318" stroke="#1F407A" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>
  <path d="M390,128 H460" stroke="#1F407A" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- ===== Entry points from above (red arrow ends on a red dot) ===== -->
  <text x="97" y="36" text-anchor="middle" font-size="12" fill="#b91c1c">poisoning,</text>
  <text x="97" y="51" text-anchor="middle" font-size="12" fill="#b91c1c">backdoor triggers</text>
  <path d="M97,58 V98" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <circle cx="97" cy="106" r="3" fill="#dc2626"/>
  <circle cx="49" cy="154" r="3" fill="#dc2626"/>

  <text x="240" y="36" text-anchor="middle" font-size="12" fill="#b91c1c">tampered</text>
  <text x="240" y="51" text-anchor="middle" font-size="12" fill="#b91c1c">packages, frameworks</text>
  <path d="M270,58 V110" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <circle cx="270" cy="120" r="3" fill="#dc2626"/>

  <text x="355" y="36" text-anchor="middle" font-size="12" fill="#b91c1c">artifact theft,</text>
  <text x="355" y="51" text-anchor="middle" font-size="12" fill="#b91c1c">unsafe loading</text>
  <path d="M355,58 V96" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>

  <text x="510" y="21" text-anchor="middle" font-size="12" fill="#b91c1c">extraction,</text>
  <text x="510" y="36" text-anchor="middle" font-size="12" fill="#b91c1c">adversarial inputs,</text>
  <text x="510" y="51" text-anchor="middle" font-size="12" fill="#b91c1c">membership inference</text>
  <path d="M510,58 V96" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>

  <!-- ===== Infrastructure beneath all three layers ===== -->
  <path d="M85,230 V270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
  <path d="M300,230 V270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
  <path d="M510,230 V270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
  <rect x="20" y="270" width="550" height="92" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="30" y="288" text-anchor="start" font-size="11" font-weight="700" fill="#475569">Infrastructure layer</text>

  <!-- accelerator hosts -->
  <g fill="#EAF1F8" stroke="#1F407A" stroke-width="1">
    <rect x="47" y="322" width="16" height="16"/>
    <rect x="69" y="322" width="16" height="16"/>
    <rect x="91" y="322" width="16" height="16"/>
    <rect x="113" y="322" width="16" height="16"/>
  </g>
  <text x="88" y="312" text-anchor="middle" font-size="11" fill="#14294E">accelerator hosts</text>
  <!-- network fabric -->
  <path d="M182,330 H266" stroke="#64748b" stroke-width="1.2" fill="none"/>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.2">
    <circle cx="186" cy="330" r="4"/>
    <circle cx="210" cy="330" r="4"/>
    <circle cx="238" cy="330" r="4"/>
    <circle cx="262" cy="330" r="4"/>
  </g>
  <text x="224" y="312" text-anchor="middle" font-size="11" fill="#14294E">network fabric</text>
  <!-- firmware and drivers -->
  <g fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8">
    <rect x="316" y="320" width="80" height="6"/>
    <rect x="316" y="328" width="80" height="6"/>
    <rect x="316" y="336" width="80" height="6"/>
  </g>
  <text x="356" y="312" text-anchor="middle" font-size="11" fill="#14294E">firmware and drivers</text>
  <!-- schedulers and keys -->
  <g fill="#ffffff" stroke="#64748b" stroke-width="0.8">
    <rect x="446" y="322" width="12" height="16"/>
    <rect x="462" y="322" width="12" height="16"/>
    <rect x="478" y="322" width="12" height="16"/>
  </g>
  <rect x="502" y="322" width="22" height="16" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="488" y="312" text-anchor="middle" font-size="11" fill="#14294E">schedulers and keys</text>

  <!-- ===== Entry points from below ===== -->
  <path d="M88,388 V340" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="88" y="406" text-anchor="middle" font-size="12" fill="#b91c1c">hardware Trojans</text>
  <path d="M224,388 V336" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="224" y="406" text-anchor="middle" font-size="12" fill="#b91c1c">co-tenant leakage</text>
  <path d="M356,388 V344" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="356" y="406" text-anchor="middle" font-size="12" fill="#b91c1c">firmware tampering</text>
  <path d="M488,388 V340" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="488" y="406" text-anchor="middle" font-size="12" fill="#b91c1c">side channels</text>
  </g>
</svg>
