    - id: vol2.privacy.budget
      label: Privacy budget
      teaches: Privacy budget account
      summary: The accumulated privacy-loss guarantee for a declared neighboring relation, sampling process,
        and composition rule.
      section: sec-security-privacy-privacy-budget-composition-edbe
    relationships:
    - id: vol2.field.40
      source: vol2.privacy.dp
      predicate: is accounted through
      target: vol2.privacy.budget
      explanation: Repeated releases compose privacy loss under the stated accounting method.
      conditions: State the protected unit, sampling assumptions, mechanism, and composition rule.
      status: draft
      evidence:
        section: sec-security-privacy-differential-privacy-8c2b
        quote: Privacy accounting depends on three primary composition tools. Simple composition\index{Differential
          privacy!simple composition} bounds the cumulative privacy loss of $\ComposedMechanismCount$ pure-DP
          mechanisms with bounds $\PrivacyBudget_i$ by $\sum \PrivacyBudget_i$; for approximate DP, their
          additive slack parameters also accumulate. In suitable parameter regimes, advanced composition\index{Differential
          privacy!advanced composition} improves the bound using square-root and linear terms while allocating
          additional slack in the probability inequality. For iterative mechanisms like DP-SGD, the moments
          accountant and Rényi differential privacy\index{Differential privacy!Rényi differential privacy}\index{Rényi
          differential privacy!composition tracking} developed next track the loss across steps before converting
          it to an explicit $(\PrivacyBudget, \PrivacyAdditiveSlack)$ guarantee, and no accountant is uniformly
          tighter than every alternative. Organizations must maintain a privacy accounting log for the protected
          population and halt or redesign further data-dependent releases when the allocated bound would
          be exceeded.
