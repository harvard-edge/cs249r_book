  claims:
    ML threat model: Attacks on a learned system arrive through interfaces the fleet exposes on purpose, so a threat
      model writes down asset, trust boundary, adversary capability and goal, and control, and keeps model visibility
      separate from write capability; the serving interface adds prompt injection, which crosses the boundary between
      instructions and data, and denial of wallet, which spends the cost budget while the endpoint stays available.
    Extraction budgets: Exact artifact theft and approximate behavioral theft need different controls, and because
      a daily rate limit slows collection without capping its lifetime total, query-based extraction is bounded
      by cumulative per-principal budgets and the output contract.
    Poisoning as a bilevel attack: A poisoner needs write access to something the model learns from and solves a
      bilevel problem over the defender's training, so targeted, backdoor, and subpopulation attacks can leave aggregate
      validation accuracy unchanged, and clean-label poisons that keep every label correct pass any label audit,
      as concept poisoning of a text-to-image model (Nightshade) shows at a dose of a few hundred images.
    Breakdown point of the gradient mean: In synchronous data parallelism one compromised worker contributes to
      every replica's update and the mean's breakdown point is zero, so integrity needs robust aggregation rules
      whose gather-based traffic exceeds a ring AllReduce's.
    Security controls priced on a C3 axis: Every isolation and confidentiality control spends capacity in a specific
      Fleet Law term, so encrypting bandwidth-bound collectives slows T_comm and partitioning, scrubbing, and tenant-scoped
      caches strand capacity or forfeit hits.
    Provenance bounds trust: A model can be trusted only as far as a verifiable record of its data, code, weights,
      and hardware extends, so signatures establish origin but not benign content, and the release record must bind
      every input the artifact depends on.
    Leakage through authorized outputs: Persistent learning means a correctly executing model can leak its training
      data through authorized queries (membership in one bit, properties by inversion, verbatim records by memorization),
      so storage access control cannot protect it, an empirical membership-inference audit is only a lower bound
      on that leakage, and differential privacy supplies the upper bound.
    Differential privacy: (epsilon, delta)-differential privacy bounds how much one protected unit can change a
      release, named by an adjacency relation, so it holds against any auxiliary information, and noise scaled to
      sensitivity over epsilon costs small groups the most.
    Hardware trust questions: Hardware security is four narrow deployment decisions (processor isolation, physical
      access and fault injection, side-channel observability, provenance and lifecycle trust), each answered by
      one primitive, and fleet procurement correlates their failure.
    Privacy techniques by excluded observer: De-identification and k-anonymity constrain only the shape of a released
      table, and federated learning, secure aggregation, homomorphic encryption, secure
      computation, and synthetic data each exclude a different observer, and none of them bounds what the released
      model or aggregate reveals.
    Privacy budget account: Privacy loss accumulates across every data-dependent release about the same population,
      so DP-SGD's many sampled steps need a tested accountant whose recorded inputs (sampling, noise, steps, clipping, adjacency) form the release record, and the cumulative budget becomes a release gate.
