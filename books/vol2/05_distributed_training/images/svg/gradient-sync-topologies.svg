<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Three aggregation patterns. Workers = C1 blue; all traffic = C2 amber; server = structural slate;
       red marks the one limit the text names (the parameter server's NIC). -->
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="680" height="272" fill="#ffffff"/>

  <line x1="227" y1="14" x2="227" y2="258" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="453" y1="14" x2="453" y2="258" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- (a) Ring AllReduce -->
  <text x="113" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">(a) Ring AllReduce</text>
  <rect x="36" y="60" width="58" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="65" y="82.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 0</text>
  <rect x="132" y="60" width="58" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="161" y="82.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 1</text>
  <rect x="132" y="150" width="58" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="161" y="172.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 2</text>
  <rect x="36" y="150" width="58" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="65" y="172.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 3</text>
  <line x1="94" y1="78" x2="130" y2="78" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="161" y1="96" x2="161" y2="148" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="132" y1="168" x2="96" y2="168" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="65" y1="150" x2="65" y2="98" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="113" y="128" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">neighbors only</text>
  <text x="113" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">2(<tspan font-style="italic">N</tspan>−1)/<tspan font-style="italic">N</tspan> · <tspan font-style="italic">M</tspan> per GPU</text>
  <text x="113" y="244" text-anchor="middle" font-size="11.5" fill="#64748b">load spread over all links</text>

  <!-- (b) Parameter server -->
  <text x="340" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">(b) Parameter server</text>
  <rect x="250" y="44" width="180" height="40" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="68.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Parameter server</text>
  <rect x="250" y="84" width="180" height="20" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="340" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">server NIC</text>
  <!-- workers: centers 262, 314, 366, 418 -->
  <rect x="244" y="150" width="36" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="262" y="172.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">W0</text>
  <rect x="296" y="150" width="36" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="314" y="172.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">W1</text>
  <rect x="348" y="150" width="36" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="366" y="172.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">W2</text>
  <rect x="400" y="150" width="36" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="418" y="172.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">W3</text>
  <!-- push gradients (up, left line) and pull parameters (down, right line) -->
  <line x1="257" y1="150" x2="257" y2="106" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <line x1="267" y1="104" x2="267" y2="148" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <line x1="309" y1="150" x2="309" y2="106" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <line x1="319" y1="104" x2="319" y2="148" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <line x1="361" y1="150" x2="361" y2="106" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <line x1="371" y1="104" x2="371" y2="148" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <line x1="413" y1="150" x2="413" y2="106" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <line x1="423" y1="104" x2="423" y2="148" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <text x="340" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">2<tspan font-style="italic">M</tspan> per worker</text>
  <text x="340" y="244" text-anchor="middle" font-size="11.5" fill="#64748b">all traffic through one NIC</text>

  <!-- (c) Logical All-to-All -->
  <text x="567" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">(c) Logical All-to-All</text>
  <line x1="546" y1="78" x2="588" y2="78" stroke="#d97706" stroke-width="1.3"/>
  <line x1="546" y1="168" x2="588" y2="168" stroke="#d97706" stroke-width="1.3"/>
  <line x1="517" y1="96" x2="517" y2="150" stroke="#d97706" stroke-width="1.3"/>
  <line x1="617" y1="96" x2="617" y2="150" stroke="#d97706" stroke-width="1.3"/>
  <line x1="546" y1="96" x2="588" y2="150" stroke="#d97706" stroke-width="1.3"/>
  <line x1="588" y1="96" x2="546" y2="150" stroke="#d97706" stroke-width="1.3"/>
  <rect x="488" y="60" width="58" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="517" y="82.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 0</text>
  <rect x="588" y="60" width="58" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="617" y="82.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 1</text>
  <rect x="488" y="150" width="58" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="517" y="172.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 2</text>
  <rect x="588" y="150" width="58" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="617" y="172.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 3</text>
  <text x="567" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#334155"><tspan font-style="italic">N</tspan>(<tspan font-style="italic">N</tspan>−1) messages</text>
  <text x="567" y="244" text-anchor="middle" font-size="11.5" fill="#64748b">logical pairs, not wires</text>
</svg>
