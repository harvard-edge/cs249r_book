  <text x="131" y="206.5" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">2</text>
  <line x1="65" y1="180" x2="65" y2="116" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="56" y="139" width="18" height="16" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="65" y="151.5" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">3</text>
  <text x="130" y="151" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b" font-style="italic">neighbors only</text>
  <text x="130" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">2(<tspan font-style="italic">N</tspan>−1)/<tspan font-style="italic">N</tspan> · <tspan font-style="italic">M</tspan> per GPU</text>
  <text x="130" y="276" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">load spread over all links</text>
  <!-- ===== (b) Parameter server ===== -->
  <text x="380" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">(b) Parameter server</text>
