  <rect x="290" y="84" width="180" height="20" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="380" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">server NIC</text>
  <line x1="380" y1="104" x2="380" y2="140" stroke="#dc2626" stroke-width="7"/>
  <line x1="305" y1="140" x2="455" y2="140" stroke="#d97706" stroke-width="1.5"/>
