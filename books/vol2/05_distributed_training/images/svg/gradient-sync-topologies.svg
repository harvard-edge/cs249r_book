<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="720" height="450" fill="#ffffff"/>

  <!-- ── Column dividers ── -->
  <line x1="240" y1="15" x2="240" y2="435" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="480" y1="15" x2="480" y2="435" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ── (a) Ring AllReduce ── -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="120" y="26" font-size="11" font-weight="700" fill="#14294E" text-anchor="middle">(a) Ring AllReduce</text>

  <!-- 4 GPU nodes in a ring -->
  <rect x="40" y="85" width="60" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="70" y="109" font-size="10" font-weight="700" fill="#14294E" text-anchor="middle">GPU 0</text>

  <rect x="140" y="85" width="60" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="170" y="109" font-size="10" font-weight="700" fill="#14294E" text-anchor="middle">GPU 1</text>

  <rect x="140" y="185" width="60" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="170" y="209" font-size="10" font-weight="700" fill="#14294E" text-anchor="middle">GPU 3</text>

  <rect x="40" y="185" width="60" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="70" y="209" font-size="10" font-weight="700" fill="#14294E" text-anchor="middle">GPU 2</text>

  <!-- Orthogonal clockwise ring paths -->
  <line x1="100" y1="105" x2="140" y2="105" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="170" y1="125" x2="170" y2="185" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="140" y1="205" x2="100" y2="205" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="70" y1="185" x2="70" y2="125" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Data chunk labels -->
  <text x="120" y="96" font-size="8" fill="#1F407A" font-weight="600" text-anchor="middle">chunk 0</text>
  <text x="178" y="159" font-size="8" fill="#1F407A" font-weight="600" text-anchor="start">chunk 1</text>
  <text x="120" y="222" font-size="8" fill="#1F407A" font-weight="600" text-anchor="middle">chunk 2</text>
  <text x="62" y="159" font-size="8" fill="#1F407A" font-weight="600" text-anchor="end">chunk 3</text>

  <!-- Characteristics box -->
  <g transform="translate(20, 295)">
    <rect width="200" height="135" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0,4 Q 0,0 4,0 L 196,0 Q 200,0 200,4 L 200,22 L 0,22 Z" fill="#EAF1F8"/>
    <line x1="0" y1="22" x2="200" y2="22" stroke="#1F407A" stroke-width="1"/>
    <text x="100" y="15" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">Bandwidth Optimal</text>

    <text x="12" y="42" font-size="8"><tspan font-weight="700" fill="#334155">Volume:</tspan><tspan fill="#475569" dx="4">2(N-1)/N · M per GPU</tspan></text>
    <text x="12" y="60" font-size="8"><tspan font-weight="700" fill="#334155">Latency:</tspan><tspan fill="#475569" dx="4">2(N-1) ring steps</tspan></text>
    <text x="12" y="78" font-size="8"><tspan font-weight="700" fill="#334155">BW Util.:</tspan><tspan fill="#15803d" font-weight="600" dx="4">~100% full bidirectional</tspan></text>
    <rect x="10" y="94" width="180" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
    <text x="100" y="110" font-size="7.5" font-weight="700" fill="#14294E" text-anchor="middle">NCCL / PyTorch DDP Default</text>
  </g>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ── (b) Parameter Server ── -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="360" y="26" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">(b) Parameter Server</text>

  <!-- Bottleneck label -->
  <rect x="315" y="48" width="90" height="16" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="360" y="59.5" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Central Bottleneck</text>

  <!-- PS central node -->
  <rect x="320" y="72" width="80" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="360" y="89" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Parameter</text>
  <text x="360" y="103" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Server</text>

  <!-- Worker nodes -->
  <rect x="265" y="195" width="40" height="36" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="285" y="217" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">W 0</text>

  <rect x="315" y="195" width="40" height="36" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="335" y="217" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">W 1</text>

  <rect x="365" y="195" width="40" height="36" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="385" y="217" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">W 2</text>

  <rect x="415" y="195" width="40" height="36" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="435" y="217" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">W 3</text>

  <!-- Flow paths (Zero-crossing layered routing) -->
  <!-- W0 -->
  <path d="M 280,195 L 280,125 L 325,125 L 325,112" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 335,112 L 335,145 L 290,145 L 290,195" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <!-- W1 -->
  <path d="M 330,195 L 330,160 L 345,160 L 345,112" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 355,112 L 355,175 L 340,175 L 340,195" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- W2 -->
  <path d="M 390,195 L 390,160 L 375,160 L 375,112" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 365,112 L 365,175 L 380,175 L 380,195" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- W3 -->
  <path d="M 440,195 L 440,125 L 395,125 L 395,112" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 385,112 L 385,145 L 430,145 L 430,195" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Flow labels -->
  <text x="302.5" y="119" font-size="7" fill="#64748b" text-anchor="middle">push grads</text>
  <text x="407.5" y="139" font-size="7" fill="#64748b" text-anchor="middle">pull params</text>

  <!-- Characteristics box -->
  <g transform="translate(260, 295)">
    <rect width="200" height="135" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0,4 Q 0,0 4,0 L 196,0 Q 200,0 200,4 L 200,22 L 0,22 Z" fill="#fee2e2"/>
    <line x1="0" y1="22" x2="200" y2="22" stroke="#dc2626" stroke-width="1"/>
    <text x="100" y="15" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">Centralized (Legacy)</text>

    <text x="12" y="42" font-size="8"><tspan font-weight="700" fill="#334155">Volume:</tspan><tspan fill="#475569" dx="4">2M per worker</tspan></text>
    <text x="12" y="60" font-size="8"><tspan font-weight="700" fill="#334155">Latency:</tspan><tspan fill="#475569" dx="4">O(1) rounds</tspan></text>
    <text x="12" y="78" font-size="8"><tspan font-weight="700" fill="#334155">BW Util.:</tspan><tspan fill="#dc2626" font-weight="600" dx="4">limited by PS network NIC</tspan></text>
    <rect x="10" y="94" width="180" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="100" y="110" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">DistBelief / Parameter Server Era</text>
  </g>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ── (c) All-to-All (Mesh) ── -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="600" y="26" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">(c) All-to-All Mesh</text>

  <!-- 4 GPU nodes in a grid -->
  <rect x="520" y="85" width="60" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="550" y="109" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">GPU 0</text>

  <rect x="620" y="85" width="60" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="650" y="109" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">GPU 1</text>

  <rect x="520" y="185" width="60" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="550" y="209" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">GPU 2</text>

  <rect x="620" y="185" width="60" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="650" y="209" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">GPU 3</text>

  <!-- All-to-all connections -->
  <line x1="580" y1="105" x2="620" y2="105" stroke="#d97706" stroke-width="1.2"/>
  <line x1="580" y1="205" x2="620" y2="205" stroke="#d97706" stroke-width="1.2"/>
  <line x1="550" y1="125" x2="550" y2="185" stroke="#d97706" stroke-width="1.2"/>
  <line x1="650" y1="125" x2="650" y2="185" stroke="#d97706" stroke-width="1.2"/>
  <line x1="580" y1="125" x2="620" y2="185" stroke="#d97706" stroke-width="1.2"/>
  <line x1="620" y1="125" x2="580" y2="185" stroke="#d97706" stroke-width="1.2"/>

  <!-- Link count chip -->
  <rect x="580" y="147" width="40" height="16" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
  <text x="600" y="158.5" font-size="8" fill="#b45309" font-weight="700" text-anchor="middle">6 links</text>

  <!-- Characteristics box -->
  <g transform="translate(500, 295)">
    <rect width="200" height="135" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0,4 Q 0,0 4,0 L 196,0 Q 200,0 200,4 L 200,22 L 0,22 Z" fill="#fef3c7"/>
    <line x1="0" y1="22" x2="200" y2="22" stroke="#d97706" stroke-width="1"/>
    <text x="100" y="15" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">Fully Connected Mesh</text>

    <text x="12" y="42" font-size="8"><tspan font-weight="700" fill="#334155">Volume:</tspan><tspan fill="#475569" dx="4">M(N-1) total</tspan></text>
    <text x="12" y="60" font-size="8"><tspan font-weight="700" fill="#334155">Latency:</tspan><tspan fill="#475569" dx="4">O(1) rounds</tspan></text>
    <text x="12" y="78" font-size="8"><tspan font-weight="700" fill="#334155">BW Util.:</tspan><tspan fill="#475569" dx="4">high only for small N</tspan></text>
    <rect x="10" y="94" width="180" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
    <text x="100" y="110" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">Impractical Beyond 8 Nodes</text>
  </g>
</svg>
