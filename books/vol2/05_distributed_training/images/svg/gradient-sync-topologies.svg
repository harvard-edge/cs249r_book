  <rect x="287" y="182" width="36" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="305" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">W0</text>
  <line x1="355" y1="142" x2="355" y2="180" stroke="#d97706" stroke-width="1.5" marker-start="url(#arr-amber-start)" marker-end="url(#arr-amber)"/>
  <rect x="337" y="182" width="36" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="355" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">W1</text>
  <line x1="405" y1="142" x2="405" y2="180" stroke="#d97706" stroke-width="1.5" marker-start="url(#arr-amber-start)" marker-end="url(#arr-amber)"/>
  <rect x="387" y="182" width="36" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="405" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">W2</text>
  <line x1="455" y1="142" x2="455" y2="180" stroke="#d97706" stroke-width="1.5" marker-start="url(#arr-amber-start)" marker-end="url(#arr-amber)"/>
  <rect x="437" y="182" width="36" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="455" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">W3</text>
  <text x="380" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">2<tspan font-style="italic">M</tspan> per worker</text>
  <text x="380" y="276" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">all traffic through one NIC</text>
  <!-- ===== (c) Logical All-to-All ===== -->
  <text x="630" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">(c) Logical All-to-All</text>
