  <text x="65" y="197" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 3</text>
  <rect x="38" y="204" width="12" height="11" rx="1" fill="#BFD8E5" stroke="#006395" stroke-width="0.8"/>
  <rect x="52" y="204" width="12" height="11" rx="1" fill="#BFD8E5" stroke="#006395" stroke-width="0.8"/>
