<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Three communication patterns on four GPUs. Each GPU holds its gradient as four chunks (G tint).
       (a) ring: each link carries one chunk per step, load equal on every link.
       (b) parameter server: every worker's traffic converges on one server NIC (red = the limit).
       (c) All-to-All: chunk j of every GPU goes to GPU j, one directed message per ordered pair, N(N-1) = 12.
       Amber = C2 communication. -->
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="arr-amber-s" markerWidth="6" markerHeight="5" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#d97706"/></marker>
    <marker id="arr-amber-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#d97706"/></marker>
  </defs>
  <rect width="760" height="306" fill="#ffffff"/>
  <line x1="255" y1="20" x2="255" y2="285" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="505" y1="20" x2="505" y2="285" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- ===== (a) Ring AllReduce ===== -->
  <text x="130" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">(a) Ring AllReduce</text>
  <rect x="30" y="70" width="70" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="65" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 0</text>
