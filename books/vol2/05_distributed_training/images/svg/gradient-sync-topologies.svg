  <text x="195" y="151.5" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">1</text>
  <line x1="160" y1="202" x2="102" y2="202" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
