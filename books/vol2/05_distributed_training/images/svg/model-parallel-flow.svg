<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="760" height="450" fill="#ffffff"/>

  <!-- ==================== TOP FORMULA STRIP ==================== -->
  <g transform="translate(30, 14)">
    <rect width="700" height="32" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="350" y="21" font-size="10.5" font-weight="700" fill="#1F407A" text-anchor="middle">
      <tspan fill="#475569" font-weight="600">Column-Parallel Partition:</tspan>
      <tspan dx="6" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="10">Y = X · [W₀ | W₁ | W₂ | W₃] = [XW₀ | XW₁ | XW₂ | XW₃] = [Y₀ | Y₁ | Y₂ | Y₃]</tspan>
    </text>
  </g>

  <!-- ==================== MAIN DATAFLOW (y=60 to y=290) ==================== -->

  <!-- Input Tensor X (Broadcast source) -->
  <g transform="translate(25, 115)">
    <rect width="75" height="110" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="37.5" y="44" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">X</text>
    <text x="37.5" y="66" font-size="9" font-weight="600" fill="#B45309" text-anchor="middle">Input Activations</text>
    <rect x="12" y="78" width="51" height="18" rx="3" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
    <text x="37.5" y="91" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">[B, d]</text>
  </g>

  <!-- Broadcast Fan-out Label -->
  <rect x="112" y="64" width="70" height="18" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="147" y="76" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">Broadcast X</text>

  <!-- Broadcast connecting lines from X to GPUs -->
  <path d="M 100 135 L 122 135 L 122 84 L 190 84" stroke="#64748B" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 100 155 L 138 155 L 138 138 L 190 138" stroke="#64748B" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 100 185 L 138 185 L 138 192 L 190 192" stroke="#64748B" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 100 205 L 122 205 L 122 246 L 190 246" stroke="#64748B" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- GPU 0 Shard -->
  <g transform="translate(195, 60)">
    <rect width="165" height="48" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 4 A 4 4 0 0 1 4 0 L 161 0 A 4 4 0 0 1 165 4 L 165 18 L 0 18 Z" fill="#EAF1F8"/>
    <line x1="0" y1="18" x2="165" y2="18" stroke="#CBD5E1" stroke-width="1"/>
    <text x="8" y="13" font-size="8.5" font-weight="700" fill="#1F407A">GPU 0 · Shard W₀</text>
    <text x="157" y="13" font-size="8" fill="#64748B" text-anchor="end">[d, d/4]</text>
    <text x="12" y="34" font-size="9" font-weight="600" fill="#0F172A">Y₀ = X × W₀</text>
    <text x="157" y="34" font-size="8" fill="#64748B" text-anchor="end">shape [B, d/4]</text>
  </g>
  <line x1="360" y1="84" x2="385" y2="84" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- Y0 block -->
  <rect x="390" y="68" width="58" height="32" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="419" y="83" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Y₀</text>
  <text x="419" y="94" font-size="7.5" fill="#15803D" text-anchor="middle">[B, d/4]</text>

  <!-- GPU 1 Shard -->
  <g transform="translate(195, 114)">
    <rect width="165" height="48" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 4 A 4 4 0 0 1 4 0 L 161 0 A 4 4 0 0 1 165 4 L 165 18 L 0 18 Z" fill="#DCFCE7"/>
    <line x1="0" y1="18" x2="165" y2="18" stroke="#CBD5E1" stroke-width="1"/>
    <text x="8" y="13" font-size="8.5" font-weight="700" fill="#166534">GPU 1 · Shard W₁</text>
    <text x="157" y="13" font-size="8" fill="#64748B" text-anchor="end">[d, d/4]</text>
    <text x="12" y="34" font-size="9" font-weight="600" fill="#0F172A">Y₁ = X × W₁</text>
    <text x="157" y="34" font-size="8" fill="#64748B" text-anchor="end">shape [B, d/4]</text>
  </g>
  <line x1="360" y1="138" x2="385" y2="138" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- Y1 block -->
  <rect x="390" y="122" width="58" height="32" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="419" y="137" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Y₁</text>
  <text x="419" y="148" font-size="7.5" fill="#15803D" text-anchor="middle">[B, d/4]</text>

  <!-- GPU 2 Shard -->
  <g transform="translate(195, 168)">
    <rect width="165" height="48" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 4 A 4 4 0 0 1 4 0 L 161 0 A 4 4 0 0 1 165 4 L 165 18 L 0 18 Z" fill="#FEF3C7"/>
    <line x1="0" y1="18" x2="165" y2="18" stroke="#CBD5E1" stroke-width="1"/>
    <text x="8" y="13" font-size="8.5" font-weight="700" fill="#92400E">GPU 2 · Shard W₂</text>
    <text x="157" y="13" font-size="8" fill="#64748B" text-anchor="end">[d, d/4]</text>
    <text x="12" y="34" font-size="9" font-weight="600" fill="#0F172A">Y₂ = X × W₂</text>
    <text x="157" y="34" font-size="8" fill="#64748B" text-anchor="end">shape [B, d/4]</text>
  </g>
  <line x1="360" y1="192" x2="385" y2="192" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- Y2 block -->
  <rect x="390" y="176" width="58" height="32" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="419" y="191" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Y₂</text>
  <text x="419" y="202" font-size="7.5" fill="#15803D" text-anchor="middle">[B, d/4]</text>

  <!-- GPU 3 Shard -->
  <g transform="translate(195, 222)">
    <rect width="165" height="48" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 4 A 4 4 0 0 1 4 0 L 161 0 A 4 4 0 0 1 165 4 L 165 18 L 0 18 Z" fill="#F3E8FF"/>
    <line x1="0" y1="18" x2="165" y2="18" stroke="#CBD5E1" stroke-width="1"/>
    <text x="8" y="13" font-size="8.5" font-weight="700" fill="#7E22CE">GPU 3 · Shard W₃</text>
    <text x="157" y="13" font-size="8" fill="#64748B" text-anchor="end">[d, d/4]</text>
    <text x="12" y="34" font-size="9" font-weight="600" fill="#0F172A">Y₃ = X × W₃</text>
    <text x="157" y="34" font-size="8" fill="#64748B" text-anchor="end">shape [B, d/4]</text>
  </g>
  <line x1="360" y1="246" x2="385" y2="246" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- Y3 block -->
  <rect x="390" y="230" width="58" height="32" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="419" y="245" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Y₃</text>
  <text x="419" y="256" font-size="7.5" fill="#15803D" text-anchor="middle">[B, d/4]</text>

  <!-- Paths from Y0..Y3 to AllGather -->
  <path d="M 448 84 L 476 84 L 476 142 L 498 142" stroke="#16A34A" stroke-width="1.3" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 448 138 L 498 138" stroke="#16A34A" stroke-width="1.3" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 448 192 L 498 192" stroke="#16A34A" stroke-width="1.3" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 448 246 L 476 246 L 476 188 L 498 188" stroke="#16A34A" stroke-width="1.3" fill="none" marker-end="url(#arrow-green)"/>

  <!-- AllGather Communication Card -->
  <g transform="translate(504, 115)">
    <rect width="112" height="110" rx="5" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="56" y="32" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">AllGather</text>
    <text x="56" y="48" font-size="8.5" fill="#15803D" text-anchor="middle">Concatenate</text>
    <text x="56" y="62" font-size="8" font-weight="600" fill="#166534" text-anchor="middle">[Y₀ | Y₁ | Y₂ | Y₃]</text>
    <rect x="14" y="74" width="84" height="22" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
    <text x="56" y="88" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">via NVLink Mesh</text>
  </g>

  <!-- Output Arrow to Y -->
  <line x1="616" y1="170" x2="644" y2="170" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Final Output Tensor Y -->
  <g transform="translate(650, 115)">
    <rect width="85" height="110" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="42.5" y="44" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">Y</text>
    <text x="42.5" y="66" font-size="9" font-weight="600" fill="#B45309" text-anchor="middle">Output Tensor</text>
    <rect x="16" y="78" width="53" height="18" rx="3" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
    <text x="42.5" y="91" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">[B, d] = XW</text>
  </g>

  <!-- ==================== BOTTOM COMPARISON CARDS ==================== -->
  <!-- Card 1: Backward Pass Mechanics -->
  <g transform="translate(25, 298)">
    <rect width="345" height="138" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 339 0 A 6 6 0 0 1 345 6 L 345 28 L 0 28 Z" fill="#EAF1F8"/>
    <line x1="0" y1="28" x2="345" y2="28" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="19" font-size="10" font-weight="700" fill="#1F407A">Backward Pass: Gradient Synchronization</text>

    <text x="14" y="48" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#1F407A">Weight Gradients (Local):</tspan>
      <tspan dx="4">∂L/∂Wᵢ = Xᵀ (∂L/∂Yᵢ)</tspan>
    </text>
    <text x="14" y="64" font-size="8.5" fill="#64748B">Computed independently on each GPU; requires no collective.</text>

    <text x="14" y="88" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#DC2626">Input Activation Gradients:</tspan>
      <tspan dx="4">∂L/∂X = Σᵢ (∂L/∂Yᵢ) Wᵢᵀ</tspan>
    </text>
    <text x="14" y="104" font-size="8.5" fill="#64748B">Requires an AllReduce (sum) across GPUs to reconstitute ∂L/∂X.</text>

    <rect x="14" y="112" width="317" height="18" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="172" y="125" font-size="8" font-weight="600" fill="#991B1B" text-anchor="middle">Forward uses AllGather · Backward uses AllReduce</text>
  </g>

  <!-- Card 2: Interconnect & Scale Constraints -->
  <g transform="translate(390, 298)">
    <rect width="345" height="138" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 339 0 A 6 6 0 0 1 345 6 L 345 28 L 0 28 Z" fill="#F1F5F9"/>
    <line x1="0" y1="28" x2="345" y2="28" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="19" font-size="10" font-weight="700" fill="#0F172A">Hardware &amp; Interconnect Constraints</text>

    <text x="14" y="48" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#0F172A">NVLink Intra-Node Requirement:</tspan>
      <tspan dx="4">600–900 GB/s bandwidth</tspan>
    </text>
    <text x="14" y="64" font-size="8.5" fill="#64748B">Communication occurs twice per transformer layer (sub-ms scale).</text>

    <text x="14" y="88" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#D97706">Scaling Boundary (TP ≤ 8):</tspan>
      <tspan dx="4">Confined within a single server node</tspan>
    </text>
    <text x="14" y="104" font-size="8.5" fill="#64748B">Cross-node TP incurs InfiniBand latency overheads that stall tensor cores.</text>

    <rect x="14" y="112" width="317" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="172" y="125" font-size="8" font-weight="600" fill="#166534" text-anchor="middle">Pair with Row-Parallel linear layer to fuse AllReduce</text>
  </g>
</svg>