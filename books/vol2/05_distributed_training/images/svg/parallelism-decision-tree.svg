<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#ffffff"/>

  <!-- ==================== DECISION NODE 1 ==================== -->
  <g transform="translate(380, 38)">
    <polygon points="0,0 105,28 0,56 -105,28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="0" y="24" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">1. Model &amp; Activations</text>
    <text x="0" y="38" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">fit on 1 GPU?</text>
  </g>

  <!-- Branch 1: YES -> Left to DDP -->
  <path d="M 275 66 L 120 66 L 120 106" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="180" y="54" width="34" height="18" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="197" y="67" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Yes</text>

  <!-- Branch 1: NO -> Right to Decision 2 -->
  <path d="M 485 66 L 600 66 L 600 120" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="525" y="54" width="34" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="542" y="67" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">No</text>

  <!-- ==================== OUTCOME 1: DDP ==================== -->
  <g transform="translate(35, 102)">
    <rect width="170" height="92" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 164 0 A 6 6 0 0 1 170 6 L 170 24 L 0 24 Z" fill="#DCFCE7"/>
    <line x1="0" y1="24" x2="170" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="16" font-size="9.5" font-weight="700" fill="#166534">Data Parallel (DDP)</text>
    <text x="10" y="42" font-size="8.5" fill="#334155">Replicate model on all GPUs</text>
    <text x="10" y="56" font-size="8.5" fill="#64748B">Scale batch across workers</text>

    <!-- Fabric chip -->
    <rect x="8" y="66" width="154" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
    <text x="85" y="79" font-size="8" font-weight="600" fill="#166534" text-anchor="middle">Fabric: Standard IB / RoCE</text>
  </g>

  <!-- Connector from DDP down to ZeRO/FSDP -->
  <line x1="120" y1="194" x2="120" y2="260" stroke="#1F407A" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <rect x="70" y="218" width="100" height="18" rx="3" fill="#EAF1F8" stroke="#93C5FD" stroke-width="1"/>
  <text x="120" y="230" font-size="8" font-weight="600" fill="#1F407A" text-anchor="middle">Memory pressure?</text>

  <!-- ==================== OUTCOME 1b: ZeRO / FSDP ==================== -->
  <g transform="translate(35, 262)">
    <rect width="170" height="96" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 164 0 A 6 6 0 0 1 170 6 L 170 24 L 0 24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="170" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="16" font-size="9.5" font-weight="700" fill="#1F407A">ZeRO / FSDP</text>
    <text x="10" y="42" font-size="8.5" fill="#334155">Shard opt states, grads, params</text>
    <text x="10" y="56" font-size="8.5" fill="#64748B">Eliminates memory redundancy</text>

    <!-- Fabric chip -->
    <rect x="8" y="70" width="154" height="18" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
    <text x="85" y="83" font-size="8" font-weight="600" fill="#1F407A" text-anchor="middle">Fabric: AllGather + ReduceScatter</text>
  </g>

  <!-- ==================== DECISION NODE 2 ==================== -->
  <g transform="translate(600, 118)">
    <polygon points="0,0 100,28 0,56 -100,28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="0" y="24" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">Fits in 1 Server Node</text>
    <text x="0" y="38" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">(≤ 8 GPUs)?</text>
  </g>

  <!-- Branch 2: YES -> Left to TP -->
  <path d="M 500 146 L 335 146 L 335 220" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="405" y="134" width="34" height="18" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="422" y="147" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Yes</text>

  <!-- Branch 2: NO -> Down to Decision 3 -->
  <path d="M 600 174 L 600 236" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="608" y="195" width="30" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="623" y="208" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">No</text>

  <!-- ==================== OUTCOME 2: TENSOR PARALLEL ==================== -->
  <g transform="translate(250, 222)">
    <rect width="170" height="96" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 164 0 A 6 6 0 0 1 170 6 L 170 24 L 0 24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="170" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="16" font-size="9.5" font-weight="700" fill="#1F407A">Tensor Parallel (TP)</text>
    <text x="10" y="42" font-size="8.5" fill="#334155">Shard matrix weight columns/rows</text>
    <text x="10" y="56" font-size="8.5" fill="#64748B">AllReduce at every linear layer</text>

    <!-- Fabric chip -->
    <rect x="8" y="70" width="154" height="18" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
    <text x="85" y="83" font-size="8" font-weight="600" fill="#1F407A" text-anchor="middle">Fabric: Strictly NVLink (900 GB/s)</text>
  </g>

  <!-- ==================== DECISION NODE 3 ==================== -->
  <g transform="translate(600, 238)">
    <polygon points="0,0 100,28 0,56 -100,28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="0" y="24" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">Sequential Depth /</text>
    <text x="0" y="38" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">Bubble Tolerable?</text>
  </g>

  <!-- Branch 3: YES -> Left to PP -->
  <path d="M 500 266 L 450 266 L 450 365" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="460" y="254" width="34" height="18" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="477" y="267" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Yes</text>

  <!-- Branch 3: NO -> Right to 3D Hybrid -->
  <path d="M 700 266 L 685 266 L 685 365" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="705" y="254" width="30" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="720" y="267" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">No</text>

  <!-- ==================== OUTCOME 3: PIPELINE PARALLEL ==================== -->
  <g transform="translate(365, 368)">
    <rect width="170" height="96" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 164 0 A 6 6 0 0 1 170 6 L 170 24 L 0 24 Z" fill="#FEF3C7"/>
    <line x1="0" y1="24" x2="170" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="16" font-size="9.5" font-weight="700" fill="#92400E">Pipeline Parallel (PP)</text>
    <text x="10" y="42" font-size="8.5" fill="#334155">Stage layers across rack nodes</text>
    <text x="10" y="56" font-size="8.5" fill="#64748B">1F1B micro-batch scheduling</text>

    <!-- Fabric chip -->
    <rect x="8" y="70" width="154" height="18" rx="3" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
    <text x="85" y="83" font-size="8" font-weight="600" fill="#92400E" text-anchor="middle">Fabric: P2P over IB / Ethernet</text>
  </g>

  <!-- ==================== OUTCOME 4: 3D HYBRID ==================== -->
  <g transform="translate(600, 368)">
    <rect width="170" height="96" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 164 0 A 6 6 0 0 1 170 6 L 170 24 L 0 24 Z" fill="#F3E8FF"/>
    <line x1="0" y1="24" x2="170" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="16" font-size="9.5" font-weight="700" fill="#7E22CE">3D Parallelism (TP + PP + DP)</text>
    <text x="10" y="42" font-size="8.5" fill="#334155">Combined tiering for &gt;100B params</text>
    <text x="10" y="56" font-size="8.5" fill="#64748B">Intra TP × Inter PP × Outer DP</text>

    <!-- Fabric chip -->
    <rect x="8" y="70" width="154" height="18" rx="3" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1"/>
    <text x="85" y="83" font-size="8" font-weight="600" fill="#7E22CE" text-anchor="middle">Fabric: Tiered NVLink + IB + DC</text>
  </g>
</svg>
