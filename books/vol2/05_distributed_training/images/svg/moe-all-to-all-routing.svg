<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="820" height="470" fill="#ffffff"/>

  <!-- ==================== PHASE BREADCRUMB STRIP ==================== -->
  <g transform="translate(25, 12)">
    <!-- Phase 1 -->
    <rect x="0" y="0" width="180" height="26" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <text x="90" y="17" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle">Step 1 · Gating &amp; Top-k Route</text>

    <!-- Arrow 1->2 -->
    <path d="M 185 13 L 195 13" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Phase 2 -->
    <rect x="200" y="0" width="180" height="26" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
    <text x="290" y="17" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Step 2 · Dispatch (All-to-All)</text>

    <!-- Arrow 2->3 -->
    <path d="M 385 13 L 395 13" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Phase 3 -->
    <rect x="400" y="0" width="170" height="26" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="485" y="17" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">Step 3 · Expert Compute</text>

    <!-- Arrow 3->4 -->
    <path d="M 575 13 L 585 13" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Phase 4 -->
    <rect x="590" y="0" width="180" height="26" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
    <text x="680" y="17" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Step 4 · Combine (All-to-All)</text>
  </g>

  <!-- ==================== CORE PIPELINE ==================== -->

  <!-- All-to-All Background Columns -->
  <rect x="235" y="52" width="105" height="228" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="287" y="160" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">All-to-All</text>
  <text x="287" y="174" font-size="8" font-weight="600" fill="#DC2626" text-anchor="middle">Dispatch Tokens</text>

  <rect x="525" y="52" width="105" height="228" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="577" y="160" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">All-to-All</text>
  <text x="577" y="174" font-size="8" font-weight="600" fill="#16A34A" text-anchor="middle">Combine Outputs</text>

  <!-- Row 0: Rank 0 / Expert 0 -->
  <g transform="translate(25, 56)">
    <!-- Source GPU 0 -->
    <rect width="85" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="85" height="16" rx="4" fill="#EAF1F8"/>
    <text x="42.5" y="12" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">Rank 0</text>
    <text x="42.5" y="29" font-size="8" fill="#334155" text-anchor="middle">Tokens: T1–T4</text>
    <text x="42.5" y="40" font-size="7.5" fill="#64748B" text-anchor="middle">Local Batch</text>

    <!-- Arrow to Router -->
    <line x1="85" y1="23" x2="105" y2="23" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Gating Network -->
    <g transform="translate(105, 0)">
      <rect width="90" height="46" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
      <text x="45" y="16" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">Router / Gate</text>
      <text x="45" y="29" font-size="8" fill="#B45309" text-anchor="middle">Top-2 Softmax</text>
      <text x="45" y="40" font-size="7.5" fill="#78350F" text-anchor="middle">Assign Experts</text>
    </g>

    <!-- Arrow from Router to All-to-All -->
    <line x1="195" y1="23" x2="235" y2="23" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

    <!-- Arrow from All-to-All to Expert -->
    <line x1="340" y1="23" x2="375" y2="23" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

    <!-- Expert 0 -->
    <g transform="translate(375, 0)">
      <rect width="115" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="115" height="16" rx="4" fill="#EAF1F8"/>
      <text x="57.5" y="12" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">Expert 0 (FFN)</text>
      <text x="57.5" y="29" font-size="8" fill="#334155" text-anchor="middle">Capacity: C · (k·N/E)</text>
      <text x="57.5" y="40" font-size="7.5" fill="#1F407A" text-anchor="middle">Host: Device Rank 0</text>
    </g>

    <!-- Arrow from Expert to Combine -->
    <line x1="490" y1="23" x2="525" y2="23" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>

    <!-- Arrow from Combine to Output -->
    <line x1="630" y1="23" x2="665" y2="23" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>

    <!-- Output 0 -->
    <g transform="translate(665, 0)">
      <rect width="90" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="90" height="16" rx="4" fill="#DCFCE7"/>
      <text x="45" y="12" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Output Rank 0</text>
      <text x="45" y="29" font-size="8" fill="#334155" text-anchor="middle">Weighted Sum</text>
      <text x="45" y="40" font-size="7.5" fill="#16A34A" text-anchor="middle">Σ g_i · Expert(x)</text>
    </g>
  </g>

  <!-- Row 1: Rank 1 / Expert 1 -->
  <g transform="translate(25, 114)">
    <rect width="85" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="85" height="16" rx="4" fill="#DCFCE7"/>
    <text x="42.5" y="12" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Rank 1</text>
    <text x="42.5" y="29" font-size="8" fill="#334155" text-anchor="middle">Tokens: T5–T8</text>
    <text x="42.5" y="40" font-size="7.5" fill="#64748B" text-anchor="middle">Local Batch</text>

    <line x1="85" y1="23" x2="105" y2="23" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

    <g transform="translate(105, 0)">
      <rect width="90" height="46" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
      <text x="45" y="16" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">Router / Gate</text>
      <text x="45" y="29" font-size="8" fill="#B45309" text-anchor="middle">Top-2 Softmax</text>
      <text x="45" y="40" font-size="7.5" fill="#78350F" text-anchor="middle">Assign Experts</text>
    </g>

    <line x1="195" y1="23" x2="235" y2="23" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
    <line x1="340" y1="23" x2="375" y2="23" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

    <g transform="translate(375, 0)">
      <rect width="115" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="115" height="16" rx="4" fill="#DCFCE7"/>
      <text x="57.5" y="12" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Expert 1 (FFN)</text>
      <text x="57.5" y="29" font-size="8" fill="#334155" text-anchor="middle">Capacity: C · (k·N/E)</text>
      <text x="57.5" y="40" font-size="7.5" fill="#166534" text-anchor="middle">Host: Device Rank 1</text>
    </g>

    <line x1="490" y1="23" x2="525" y2="23" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>
    <line x1="630" y1="23" x2="665" y2="23" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>

    <g transform="translate(665, 0)">
      <rect width="90" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="90" height="16" rx="4" fill="#DCFCE7"/>
      <text x="45" y="12" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Output Rank 1</text>
      <text x="45" y="29" font-size="8" fill="#334155" text-anchor="middle">Weighted Sum</text>
      <text x="45" y="40" font-size="7.5" fill="#16A34A" text-anchor="middle">Σ g_i · Expert(x)</text>
    </g>
  </g>

  <!-- Row 2: Rank 2 / Expert 2 -->
  <g transform="translate(25, 172)">
    <rect width="85" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="85" height="16" rx="4" fill="#FEF3C7"/>
    <text x="42.5" y="12" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">Rank 2</text>
    <text x="42.5" y="29" font-size="8" fill="#334155" text-anchor="middle">Tokens: T9–T12</text>
    <text x="42.5" y="40" font-size="7.5" fill="#64748B" text-anchor="middle">Local Batch</text>

    <line x1="85" y1="23" x2="105" y2="23" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

    <g transform="translate(105, 0)">
      <rect width="90" height="46" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
      <text x="45" y="16" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">Router / Gate</text>
      <text x="45" y="29" font-size="8" fill="#B45309" text-anchor="middle">Top-2 Softmax</text>
      <text x="45" y="40" font-size="7.5" fill="#78350F" text-anchor="middle">Assign Experts</text>
    </g>

    <line x1="195" y1="23" x2="235" y2="23" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
    <line x1="340" y1="23" x2="375" y2="23" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

    <g transform="translate(375, 0)">
      <rect width="115" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="115" height="16" rx="4" fill="#FEF3C7"/>
      <text x="57.5" y="12" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">Expert 2 (FFN)</text>
      <text x="57.5" y="29" font-size="8" fill="#334155" text-anchor="middle">Capacity: C · (k·N/E)</text>
      <text x="57.5" y="40" font-size="7.5" fill="#B45309" text-anchor="middle">Host: Device Rank 2</text>
    </g>

    <line x1="490" y1="23" x2="525" y2="23" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>
    <line x1="630" y1="23" x2="665" y2="23" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>

    <g transform="translate(665, 0)">
      <rect width="90" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="90" height="16" rx="4" fill="#DCFCE7"/>
      <text x="45" y="12" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Output Rank 2</text>
      <text x="45" y="29" font-size="8" fill="#334155" text-anchor="middle">Weighted Sum</text>
      <text x="45" y="40" font-size="7.5" fill="#16A34A" text-anchor="middle">Σ g_i · Expert(x)</text>
    </g>
  </g>

  <!-- Row 3: Rank 3 / Expert 3 -->
  <g transform="translate(25, 230)">
    <rect width="85" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="85" height="16" rx="4" fill="#F3E8FF"/>
    <text x="42.5" y="12" font-size="8.5" font-weight="700" fill="#7E22CE" text-anchor="middle">Rank 3</text>
    <text x="42.5" y="29" font-size="8" fill="#334155" text-anchor="middle">Tokens: T13–T16</text>
    <text x="42.5" y="40" font-size="7.5" fill="#64748B" text-anchor="middle">Local Batch</text>

    <line x1="85" y1="23" x2="105" y2="23" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

    <g transform="translate(105, 0)">
      <rect width="90" height="46" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
      <text x="45" y="16" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">Router / Gate</text>
      <text x="45" y="29" font-size="8" fill="#B45309" text-anchor="middle">Top-2 Softmax</text>
      <text x="45" y="40" font-size="7.5" fill="#78350F" text-anchor="middle">Assign Experts</text>
    </g>

    <line x1="195" y1="23" x2="235" y2="23" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
    <line x1="340" y1="23" x2="375" y2="23" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

    <g transform="translate(375, 0)">
      <rect width="115" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="115" height="16" rx="4" fill="#F3E8FF"/>
      <text x="57.5" y="12" font-size="8.5" font-weight="700" fill="#7E22CE" text-anchor="middle">Expert 3 (FFN)</text>
      <text x="57.5" y="29" font-size="8" fill="#334155" text-anchor="middle">Capacity: C · (k·N/E)</text>
      <text x="57.5" y="40" font-size="7.5" fill="#9333EA" text-anchor="middle">Host: Device Rank 3</text>
    </g>

    <line x1="490" y1="23" x2="525" y2="23" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>
    <line x1="630" y1="23" x2="665" y2="23" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>

    <g transform="translate(665, 0)">
      <rect width="90" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="90" height="16" rx="4" fill="#DCFCE7"/>
      <text x="45" y="12" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Output Rank 3</text>
      <text x="45" y="29" font-size="8" fill="#334155" text-anchor="middle">Weighted Sum</text>
      <text x="45" y="40" font-size="7.5" fill="#16A34A" text-anchor="middle">Σ g_i · Expert(x)</text>
    </g>
  </g>

  <!-- ==================== BOTTOM COMPARISON CARDS ==================== -->
  <!-- Card 1: All-to-All Comm Volume -->
  <g transform="translate(25, 304)">
    <rect width="365" height="148" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 359 0 A 6 6 0 0 1 365 6 L 365 28 L 0 28 Z" fill="#EAF1F8"/>
    <line x1="0" y1="28" x2="365" y2="28" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="19" font-size="10" font-weight="700" fill="#1F407A">All-to-All Communication Overhead</text>

    <text x="14" y="48" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#1F407A">Two-Phase Exchange:</tspan>
      <tspan dx="4">Dispatch (tokens) + Combine (outputs)</tspan>
    </text>
    <text x="14" y="66" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#1F407A">Layer Comm Volume:</tspan>
      <tspan dx="4">2 × 2 · B · S · d_model bytes</tspan>
    </text>
    <text x="14" y="82" font-size="8.5" fill="#64748B">Each token is routed to Top-k experts across devices via high-speed fabric.</text>

    <rect x="14" y="98" width="337" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="24" y="113" font-size="8.5" font-weight="600" fill="#1F407A">Fabric Requirement:</text>
    <text x="24" y="125" font-size="8" fill="#475569">Bisection bandwidth critical; typically mapped across NVLink or InfiniBand rails</text>
  </g>

  <!-- Card 2: Capacity Factor & Load Balancing -->
  <g transform="translate(410, 304)">
    <rect width="385" height="148" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 379 0 A 6 6 0 0 1 385 6 L 385 28 L 0 28 Z" fill="#FEF3C7"/>
    <line x1="0" y1="28" x2="385" y2="28" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="19" font-size="10" font-weight="700" fill="#92400E">Capacity Factor &amp; Token Load Balancing</text>

    <text x="14" y="48" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#92400E">Capacity Factor (C):</tspan>
      <tspan dx="4">C = 1.25–1.5 bounds per-expert buffer size</tspan>
    </text>
    <text x="14" y="66" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#92400E">Overflow Handling:</tspan>
      <tspan dx="4">Tokens beyond capacity bypass via residual connection</tspan>
    </text>
    <text x="14" y="82" font-size="8.5" fill="#64748B">Auxiliary load-balancing loss prevents routing collapse onto a single expert.</text>

    <rect x="14" y="98" width="357" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="24" y="113" font-size="8.5" font-weight="600" fill="#92400E">Throughput vs. Quality Tradeoff:</text>
    <text x="24" y="125" font-size="8" fill="#475569">Lower C saves memory &amp; comm time; higher C ensures zero dropped tokens</text>
  </g>
</svg>
