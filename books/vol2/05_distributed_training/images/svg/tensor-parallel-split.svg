<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arr-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fff"/>
  <line x1="340" y1="20" x2="340" y2="420" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- ===== Column parallel ===== -->
  <text x="170" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Column Parallel</text>
  <text x="170" y="46" text-anchor="middle" font-size="10" font-weight="400" fill="#475569" font-style="italic">W = [W₁ | W₂]</text>
  <rect x="115" y="60" width="110" height="34" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="170" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#333">Input x</text>
  <path d="M 170 94 L 170 112 L 95 112 L 95 128" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 170 112 L 245 112 L 245 128" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="176" y="105" text-anchor="start" font-size="8.5" font-weight="400" fill="#64748B" font-style="italic">broadcast</text>
  <rect x="33" y="130" width="124" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="95" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#1F407A">W₁</text>
  <text x="95" y="166" text-anchor="middle" font-size="9" font-weight="400" fill="#1F407A">GPU 0</text>
  <text x="95" y="182" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1F407A">[d_model × d_ff/2]</text>
  <path d="M 95 194 L 95 218" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="40" y="220" width="110" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="95" y="237" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">xW₁</text>
  <text x="95" y="252" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1F407A">GPU 0</text>
  <rect x="183" y="130" width="124" height="64" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="245" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#16A34A">W₂</text>
  <text x="245" y="166" text-anchor="middle" font-size="9" font-weight="400" fill="#16A34A">GPU 1</text>
  <text x="245" y="182" text-anchor="middle" font-size="8.5" font-weight="400" fill="#16A34A">[d_model × d_ff/2]</text>
  <path d="M 245 194 L 245 218" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <rect x="190" y="220" width="110" height="40" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="245" y="237" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">xW₂</text>
  <text x="245" y="252" text-anchor="middle" font-size="8.5" font-weight="400" fill="#16A34A">GPU 1</text>
  <path d="M 95 260 L 95 274 L 150 274 L 150 288" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 245 260 L 245 274 L 190 274 L 190 288" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="90" y="290" width="160" height="42" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="170" y="308" text-anchor="middle" font-size="10" font-weight="700" fill="#333">[xW₁, xW₂]</text>
  <text x="170" y="323" text-anchor="middle" font-size="8.5" font-weight="400" fill="#555">concatenated output</text>
  <rect x="60" y="390" width="220" height="36" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="170" y="405" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">No AllReduce in forward pass</text>
  <text x="170" y="419" text-anchor="middle" font-size="8.5" font-weight="400" fill="#475569">AllReduce required in backward pass</text>
  <!-- ===== Row parallel ===== -->
  <text x="510" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Row Parallel</text>
  <text x="510" y="46" text-anchor="middle" font-size="10" font-weight="400" fill="#475569" font-style="italic">W = [W₁ ; W₂]</text>
  <rect x="380" y="60" width="110" height="34" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="435" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">x₁ → GPU 0</text>
  <path d="M 435 94 L 435 128" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="373" y="130" width="124" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="435" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#1F407A">W₁</text>
  <text x="435" y="166" text-anchor="middle" font-size="9" font-weight="400" fill="#1F407A">GPU 0</text>
  <text x="435" y="182" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1F407A">[d_ff/2 × d_model]</text>
  <path d="M 435 194 L 435 218" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="375" y="220" width="120" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="435" y="237" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">x₁W₁ (partial)</text>
  <text x="435" y="252" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1F407A">GPU 0</text>
  <path d="M 435 260 L 435 288" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="530" y="60" width="110" height="34" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="585" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">x₂ → GPU 1</text>
  <path d="M 585 94 L 585 128" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <rect x="523" y="130" width="124" height="64" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="585" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#16A34A">W₂</text>
  <text x="585" y="166" text-anchor="middle" font-size="9" font-weight="400" fill="#16A34A">GPU 1</text>
  <text x="585" y="182" text-anchor="middle" font-size="8.5" font-weight="400" fill="#16A34A">[d_ff/2 × d_model]</text>
  <path d="M 585 194 L 585 218" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <rect x="525" y="220" width="120" height="40" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="585" y="237" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">x₂W₂ (partial)</text>
  <text x="585" y="252" text-anchor="middle" font-size="8.5" font-weight="400" fill="#16A34A">GPU 1</text>
  <path d="M 585 260 L 585 288" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="510" y="114" text-anchor="middle" font-size="8.5" font-weight="400" fill="#64748B" font-style="italic">x split along feature dim</text>
  <rect x="375" y="290" width="270" height="34" rx="3" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="510" y="311" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6D28D9">AllReduce: x₁W₁ + x₂W₂</text>
  <path d="M 510 324 L 510 338" fill="none" stroke="#7C3AED" stroke-width="1.2" marker-end="url(#arr-violet)"/>
  <rect x="430" y="340" width="160" height="40" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="510" y="357" text-anchor="middle" font-size="10" font-weight="700" fill="#333">xW (full output)</text>
  <text x="510" y="372" text-anchor="middle" font-size="8.5" font-weight="400" fill="#555">both GPUs hold result</text>
  <rect x="380" y="390" width="260" height="36" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="510" y="405" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">AllReduce in forward pass</text>
  <text x="510" y="419" text-anchor="middle" font-size="8.5" font-weight="400" fill="#475569">no extra communication in backward pass</text>
</svg>
