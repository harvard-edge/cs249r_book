<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 680 284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Megatron-style tensor-parallel MLP block on two GPUs.
       Compute: C1 blue. The one collective (AllReduce): C2 amber. Lanes are identical GPUs (neutral slate tags). Subscripts are 11px tspans with baseline-shift, as in the chapter's other figures. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect y="-10" width="680" height="284" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="222" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Column-parallel layer</text>
  <text x="222" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">A = [A<tspan baseline-shift="sub" font-size="11">1</tspan> | A<tspan baseline-shift="sub" font-size="11">2</tspan>]</text>
  <text x="402" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Row-parallel layer</text>
  <text x="402" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">B = [B<tspan baseline-shift="sub" font-size="11">1</tspan> ; B<tspan baseline-shift="sub" font-size="11">2</tspan>]</text>

  <!-- Input X (replicated on both GPUs) -->
  <rect x="22" y="112" width="90" height="56" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="67" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">X</text>
  <text x="67" y="156" text-anchor="middle" font-size="11.5" fill="#475569">replicated</text>

  <!-- Lane tags -->
  <text x="162" y="66" font-size="11.5" font-weight="700" fill="#64748b">GPU 0</text>
  <text x="162" y="190" font-size="11.5" font-weight="700" fill="#64748b">GPU 1</text>

  <!-- GPU 0 lane: y 74..126, center 100 -->
  <rect x="162" y="74" width="120" height="52" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="222" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Y<tspan baseline-shift="sub" font-size="11">1</tspan> = XA<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="222" y="116" text-anchor="middle" font-size="11.5" fill="#475569">column shard</text>
  <rect x="342" y="74" width="120" height="52" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="402" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Z<tspan baseline-shift="sub" font-size="11">1</tspan> = Y<tspan baseline-shift="sub" font-size="11">1</tspan>B<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="402" y="116" text-anchor="middle" font-size="11.5" fill="#475569">partial sum</text>

  <!-- GPU 1 lane: y 198..250, center 224 -->
  <rect x="162" y="198" width="120" height="52" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="222" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Y<tspan baseline-shift="sub" font-size="11">2</tspan> = XA<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  <text x="222" y="240" text-anchor="middle" font-size="11.5" fill="#475569">column shard</text>
  <rect x="342" y="198" width="120" height="52" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="402" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Z<tspan baseline-shift="sub" font-size="11">2</tspan> = Y<tspan baseline-shift="sub" font-size="11">2</tspan>B<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  <text x="402" y="240" text-anchor="middle" font-size="11.5" fill="#475569">partial sum</text>

  <!-- X fans out to both lanes -->
  <path d="M112,140 H136 V100 H160" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M136,140 V224 H160" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Local handoff: no communication between the two layers -->
  <line x1="282" y1="100" x2="340" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="282" y1="224" x2="340" y2="224" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="311" y="160" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">stays</text>
  <text x="311" y="175" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">local</text>

  <!-- AllReduce spanning both lanes -->
  <rect x="498" y="74" width="80" height="176" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="538" y="156" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">AllReduce</text>
  <text x="538" y="174" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">Z<tspan baseline-shift="sub" font-size="11">1</tspan> + Z<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  <line x1="462" y1="100" x2="496" y2="100" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="462" y1="224" x2="496" y2="224" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Output Z on both GPUs -->
  <line x1="578" y1="162" x2="600" y2="162" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="602" y="136" width="56" height="52" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="630" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Z</text>
  <text x="630" y="178" text-anchor="middle" font-size="11" fill="#475569">on both</text>
</svg>
