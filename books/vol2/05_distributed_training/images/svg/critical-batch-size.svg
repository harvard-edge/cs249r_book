<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 490">
  <defs>
    <clipPath id="plot-clip">
      <rect x="80" y="55" width="540" height="325" rx="4"/>
    </clipPath>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ── Plot Area ── -->
  <rect x="80" y="55" width="540" height="325" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- ── Shaded Regimes ── -->
  <g clip-path="url(#plot-clip)">
    <!-- Linear scaling regime -->
    <rect x="80" y="55" width="260" height="325" fill="#f0fdf4"/>
    <!-- Diminishing returns regime -->
    <rect x="340" y="55" width="280" height="325" fill="#fffbeb"/>

    <!-- Grid lines -->
    <line x1="80" y1="120" x2="620" y2="120" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="80" y1="185" x2="620" y2="185" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="80" y1="250" x2="620" y2="250" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="80" y1="315" x2="620" y2="315" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Efficiency Curve -->
    <path d="M 80,355 C 150,330 220,260 290,180 C 320,150 335,142 360,140 C 420,138 520,138 620,138" fill="none" stroke="#0284c7" stroke-width="2.8"/>
  </g>

  <!-- ── Regime Banners (Pill Tags) ── -->
  <rect x="135" y="68" width="150" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="210" y="83" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Linear Scaling Regime</text>

  <rect x="410" y="68" width="170" height="22" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="495" y="83" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Diminishing Returns Regime</text>

  <!-- ── Critical Batch Size Divider ── -->
  <line x1="340" y1="55" x2="340" y2="380" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4"/>

  <!-- Knee Point Marker -->
  <circle cx="340" cy="144" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>

  <!-- B* Label Badge below axis -->
  <rect x="265" y="396" width="150" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="340" y="410" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">B* (Critical Batch Size)</text>

  <!-- ── In-Regime Mechanism Annotations ── -->
  <text x="210" y="245" font-size="9" font-weight="600" fill="#15803d" text-anchor="middle">comm. hides behind compute</text>
  <text x="495" y="245" font-size="9" font-weight="600" fill="#b45309" text-anchor="middle">gradient noise limits learning</text>

  <!-- ── Example Benchmark Cards ── -->
  <!-- ResNet-50 Card -->
  <rect x="140" y="105" width="124" height="38" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="202" y="120" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">ResNet-50</text>
  <text x="202" y="133" font-size="8.5" fill="#475569" text-anchor="middle">B* ≈ 8K samples</text>
  <!-- Leader to curve -->
  <path d="M 264,124 L 290,124 L 290,175" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="290" cy="180" r="4" fill="#16a34a" stroke="#ffffff" stroke-width="1.2"/>

  <!-- GPT-3 Card -->
  <rect x="470" y="105" width="130" height="38" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="535" y="120" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">GPT-3</text>
  <text x="535" y="133" font-size="8.5" fill="#475569" text-anchor="middle">B* ≈ 4M tokens</text>
  <!-- Leader to curve -->
  <path d="M 535,143 L 535,152 L 550,152 L 550,140" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="550" cy="138" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/>

  <!-- ── Axes Coordinates & Ticks ── -->
  <!-- X-Axis -->
  <line x1="80" y1="380" x2="620" y2="380" stroke="#94a3b8" stroke-width="1.2"/>
  
  <line x1="80" y1="380" x2="80" y2="385" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="80" y="394" font-size="8.5" fill="#64748b" text-anchor="middle">64</text>
  
  <line x1="170" y1="380" x2="170" y2="385" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="170" y="394" font-size="8.5" fill="#64748b" text-anchor="middle">512</text>
  
  <line x1="260" y1="380" x2="260" y2="385" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="260" y="394" font-size="8.5" fill="#64748b" text-anchor="middle">4K</text>
  
  <line x1="350" y1="380" x2="350" y2="385" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="350" y="394" font-size="8.5" fill="#64748b" text-anchor="middle">32K</text>
  
  <line x1="480" y1="380" x2="480" y2="385" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="480" y="394" font-size="8.5" fill="#64748b" text-anchor="middle">512K</text>
  
  <line x1="620" y1="380" x2="620" y2="385" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Y-Axis -->
  <line x1="80" y1="380" x2="80" y2="55" stroke="#94a3b8" stroke-width="1.2"/>
  
  <line x1="75" y1="380" x2="80" y2="380" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="70" y="383" font-size="8.5" fill="#64748b" text-anchor="end">0.00</text>
  
  <line x1="75" y1="315" x2="80" y2="315" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="70" y="318" font-size="8.5" fill="#64748b" text-anchor="end">0.25</text>
  
  <line x1="75" y1="250" x2="80" y2="250" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="70" y="253" font-size="8.5" fill="#64748b" text-anchor="end">0.50</text>
  
  <line x1="75" y1="185" x2="80" y2="185" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="70" y="188" font-size="8.5" fill="#64748b" text-anchor="end">0.75</text>
  
  <line x1="75" y1="120" x2="80" y2="120" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="70" y="123" font-size="8.5" fill="#64748b" text-anchor="end">1.00</text>

  <!-- ── Axis Titles ── -->
  <text x="350" y="438" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">Batch Size (log scale)</text>
  <text x="25" y="217" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle" transform="rotate(-90, 25, 217)">Training Efficiency (samples/sec per GPU)</text>

  <!-- ── Bottom Takeaway Footnote ── -->
  <text x="350" y="465" font-size="8.5" fill="#64748b" font-style="italic" text-anchor="middle">Above B*, adding replicas yields sub-linear throughput gains; statistical gradient noise degrades sample efficiency.</text>
</svg>
