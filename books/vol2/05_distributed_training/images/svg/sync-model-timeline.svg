    <path d="M 0 6 A 6 6 0 0 1 6 0 L 694 0 A 6 6 0 0 1 700 6 L 700 24 L 0 24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="700" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1F407A">Bulk Synchronous Parallel (BSP) · s = 0</text>
    <text x="270" y="16" font-size="8" fill="#475569">Strict barrier at every step; fast workers idle while straggler W3 completes</text>
    <rect x="625" y="4" width="65" height="16" rx="3" fill="#1F407A"/>
    <text x="657.5" y="15" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">EXACT SGD</text>

    <!-- Worker labels -->
    <text x="58" y="44" font-size="8" font-weight="700" fill="#334155" text-anchor="end">W1</text>
    <text x="58" y="66" font-size="8" font-weight="700" fill="#334155" text-anchor="end">W2</text>
    <text x="58" y="88" font-size="8" font-weight="700" fill="#DC2626" text-anchor="end">W3 (Straggler)</text>
    <text x="58" y="110" font-size="8" font-weight="700" fill="#334155" text-anchor="end">W4</text>

