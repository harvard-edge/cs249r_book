    <text x="265" y="16" font-size="8" fill="#475569">Bounded staleness window; workers proceed up to s = 1 step ahead of slowest worker</text>
    <rect x="615" y="4" width="75" height="16" rx="3" fill="#D97706"/>
    <text x="652.5" y="15" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">BOUNDED DRIFT</text>

