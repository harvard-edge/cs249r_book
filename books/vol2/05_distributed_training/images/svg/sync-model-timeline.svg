    <line x1="313" y1="28" x2="313" y2="126" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="437" y1="28" x2="437" y2="126" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="561" y1="28" x2="561" y2="126" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="685" y1="28" x2="685" y2="126" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Step 0 (x=65 to 189) -->
    <!-- W1 -->
    <rect x="65" y="32" width="80" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <rect x="145" y="32" width="44" height="18" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
    <text x="167" y="44" font-size="7" font-weight="600" fill="#991B1B" text-anchor="middle">wait</text>
    <!-- W2 -->
    <rect x="65" y="54" width="80" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <rect x="145" y="54" width="44" height="18" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
    <text x="167" y="66" font-size="7" font-weight="600" fill="#991B1B" text-anchor="middle">wait</text>
    <!-- W3 (Straggler) -->
    <rect x="65" y="76" width="124" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="127" y="88" font-size="7.5" font-weight="700" fill="#1F407A" text-anchor="middle">Compute (Slow)</text>
    <!-- W4 -->
    <rect x="65" y="98" width="80" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <rect x="145" y="98" width="44" height="18" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
    <text x="167" y="110" font-size="7" font-weight="600" fill="#991B1B" text-anchor="middle">wait</text>

