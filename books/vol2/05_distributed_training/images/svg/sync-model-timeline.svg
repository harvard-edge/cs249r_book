    <rect x="393" y="98" width="44" height="18" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>

    <!-- Step 3 (x=437 to 561) -->
    <rect x="437" y="32" width="80" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
