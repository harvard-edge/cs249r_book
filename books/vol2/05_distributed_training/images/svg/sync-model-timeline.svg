    <rect x="457" y="54" width="22" height="18" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <rect x="481" y="54" width="90" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <rect x="573" y="54" width="90" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>

    <!-- W3 (Slow worker) -->
    <rect x="65" y="76" width="122" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <rect x="189" y="76" width="122" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <rect x="313" y="76" width="122" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <rect x="437" y="76" width="122" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <rect x="561" y="76" width="122" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>

