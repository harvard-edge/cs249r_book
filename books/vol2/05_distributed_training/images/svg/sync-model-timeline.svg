<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="740" height="480" fill="#ffffff"/>

  <!-- ==================== TIME AXIS (TOP) ==================== -->
  <g transform="translate(85, 12)">
    <line x1="0" y1="12" x2="620" y2="12" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="0" y="8" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">t = 0</text>
    <text x="124" y="8" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">t = 1</text>
    <text x="248" y="8" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">t = 2</text>
    <text x="372" y="8" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">t = 3</text>
    <text x="496" y="8" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">t = 4</text>
    <text x="620" y="8" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">t = 5</text>
  </g>

  <!-- ==================== PANEL 1: BSP ==================== -->
  <g transform="translate(20, 32)">
