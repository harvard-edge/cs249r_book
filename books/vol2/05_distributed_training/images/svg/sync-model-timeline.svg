    </g>

    <!-- W4 (Medium, 98px) -->
    <g transform="translate(65, 98)">
      <rect x="0" y="0" width="98" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
      <rect x="100" y="0" width="98" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
