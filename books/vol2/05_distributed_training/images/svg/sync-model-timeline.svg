  <!-- ==================== PANEL 3: ASP ==================== -->
  <g transform="translate(20, 328)">
    <rect width="700" height="136" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 694 0 A 6 6 0 0 1 700 6 L 700 24 L 0 24 Z" fill="#DCFCE7"/>
    <line x1="0" y1="24" x2="700" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#166534">Asynchronous Parallel (ASP) · s = ∞</text>
    <text x="260" y="16" font-size="8" fill="#475569">No synchronization barriers; lock-free gradient updates applied immediately to shared weights</text>
    <rect x="610" y="4" width="80" height="16" rx="3" fill="#16A34A"/>
    <text x="650" y="15" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">MAX THROUGHPUT</text>

    <!-- Worker labels -->
