      <rect x="450" y="0" width="88" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
      <rect x="540" y="0" width="80" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    </g>

