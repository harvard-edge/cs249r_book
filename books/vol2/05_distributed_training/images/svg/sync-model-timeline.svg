    <rect x="457" y="98" width="22" height="18" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <rect x="481" y="98" width="90" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <rect x="573" y="98" width="90" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
