<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 680 368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Data-parallel step on four GPUs. Data = green; compute and update = C1 blue; the AllReduce = C2 amber. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>
  <rect y="-8" width="680" height="368" fill="#ffffff"/>
  <!-- GPU swimlanes, stages 2 to 5 (unstroked tints so adjacent bands do not merge into double lines) -->
  <rect x="108" y="39" width="550" height="68" rx="3" fill="#f1f5f9"/>
  <rect x="108" y="109" width="550" height="68" rx="3" fill="#f1f5f9"/>
  <rect x="108" y="179" width="550" height="68" rx="3" fill="#f1f5f9"/>
  <rect x="108" y="249" width="550" height="68" rx="3" fill="#f1f5f9"/>
  <text x="57" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan fill="#64748b">1</tspan>  Partition</text>
  <text x="159.0" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan fill="#64748b">2</tspan>  Assign</text>
  <text x="291.0" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan fill="#64748b">3</tspan>  Forward + backward</text>
  <text x="429.0" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan fill="#64748b">4</tspan>  AllReduce</text>
  <text x="579" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan fill="#64748b">5</tspan>  Update</text>
  <rect x="22" y="60" width="70" height="254" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="57" y="175.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Global</text>
  <text x="57" y="191.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">batch</text>
  <text x="57" y="211.0" text-anchor="middle" font-size="11.5" fill="#475569"><tspan font-style="italic">B</tspan> = 128</text>
  <rect x="384" y="60" width="90" height="254" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="429" y="165.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">AllReduce</text>
  <text x="429" y="187.0" text-anchor="middle" font-size="12" fill="#92400e"><tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="11">global</tspan> =</text>
  <text x="429" y="205.0" text-anchor="middle" font-size="12" fill="#92400e">(1/<tspan font-style="italic">N</tspan>) Σ <tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">i</tspan></tspan></text>
  <text x="429" y="227.0" text-anchor="middle" font-size="11.5" font-style="italic" fill="#b45309">ring</text>
  <text x="228" y="52" font-size="11.5" font-weight="700" fill="#64748b">GPU 0</text>
  <rect x="114" y="60" width="90" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="159" y="79.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Mini-batch 0</text>
  <text x="159" y="95.0" text-anchor="middle" font-size="11.5" fill="#475569">32 samples</text>
  <path d="M92,187.0 H102 V82.0 H112" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <rect x="228" y="60" width="126" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="291" y="79.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Forward + backward</text>
  <text x="291" y="95.0" text-anchor="middle" font-size="11.5" fill="#475569">local gradient <tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="11">0</tspan></text>
  <line x1="204" y1="82.0" x2="226" y2="82.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <line x1="354" y1="82.0" x2="382" y2="82.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="506" y="60" width="146" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="579" y="86.5" text-anchor="middle" font-size="12.5" fill="#14294E"><tspan font-style="italic">θ</tspan> ← <tspan font-style="italic">θ</tspan> − <tspan font-style="italic">η</tspan> <tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="11">global</tspan></text>
  <line x1="474" y1="82.0" x2="504" y2="82.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="228" y="122" font-size="11.5" font-weight="700" fill="#64748b">GPU 1</text>
  <rect x="114" y="130" width="90" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="159" y="149.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Mini-batch 1</text>
  <text x="159" y="165.0" text-anchor="middle" font-size="11.5" fill="#475569">32 samples</text>
  <path d="M92,187.0 H102 V152.0 H112" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <rect x="228" y="130" width="126" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="291" y="149.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Forward + backward</text>
  <text x="291" y="165.0" text-anchor="middle" font-size="11.5" fill="#475569">local gradient <tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <line x1="204" y1="152.0" x2="226" y2="152.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <line x1="354" y1="152.0" x2="382" y2="152.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="506" y="130" width="146" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="579" y="156.5" text-anchor="middle" font-size="12.5" fill="#14294E"><tspan font-style="italic">θ</tspan> ← <tspan font-style="italic">θ</tspan> − <tspan font-style="italic">η</tspan> <tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="11">global</tspan></text>
  <line x1="474" y1="152.0" x2="504" y2="152.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="228" y="192" font-size="11.5" font-weight="700" fill="#64748b">GPU 2</text>
  <rect x="114" y="200" width="90" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="159" y="219.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Mini-batch 2</text>
  <text x="159" y="235.0" text-anchor="middle" font-size="11.5" fill="#475569">32 samples</text>
  <path d="M92,187.0 H102 V222.0 H112" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <rect x="228" y="200" width="126" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="291" y="219.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Forward + backward</text>
  <text x="291" y="235.0" text-anchor="middle" font-size="11.5" fill="#475569">local gradient <tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="11">2</tspan></text>
  <line x1="204" y1="222.0" x2="226" y2="222.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <line x1="354" y1="222.0" x2="382" y2="222.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="506" y="200" width="146" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="579" y="226.5" text-anchor="middle" font-size="12.5" fill="#14294E"><tspan font-style="italic">θ</tspan> ← <tspan font-style="italic">θ</tspan> − <tspan font-style="italic">η</tspan> <tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="11">global</tspan></text>
  <line x1="474" y1="222.0" x2="504" y2="222.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="228" y="262" font-size="11.5" font-weight="700" fill="#64748b">GPU 3</text>
  <rect x="114" y="270" width="90" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="159" y="289.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Mini-batch 3</text>
  <text x="159" y="305.0" text-anchor="middle" font-size="11.5" fill="#475569">32 samples</text>
  <path d="M92,187.0 H102 V292.0 H112" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <rect x="228" y="270" width="126" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="291" y="289.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Forward + backward</text>
  <text x="291" y="305.0" text-anchor="middle" font-size="11.5" fill="#475569">local gradient <tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="11">3</tspan></text>
  <line x1="204" y1="292.0" x2="226" y2="292.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <line x1="354" y1="292.0" x2="382" y2="292.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="506" y="270" width="146" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="579" y="296.5" text-anchor="middle" font-size="12.5" fill="#14294E"><tspan font-style="italic">θ</tspan> ← <tspan font-style="italic">θ</tspan> − <tspan font-style="italic">η</tspan> <tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="11">global</tspan></text>
  <line x1="474" y1="292.0" x2="504" y2="292.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="579" y="336" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">identical <tspan>θ</tspan> on every GPU</text>
</svg>
