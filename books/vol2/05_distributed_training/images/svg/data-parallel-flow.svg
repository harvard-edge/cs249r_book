  <text x="510" y="28" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a"><tspan fill="#64748b">4</tspan>  AllReduce</text>
  <text x="680" y="28" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a"><tspan fill="#64748b">5</tspan>  Update</text>
  <text x="70" y="46" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569"><tspan font-style="italic">B</tspan> = 128</text>
  <text x="160" y="46" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">32 per GPU</text>
  <text x="305" y="46" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">identical replicas</text>
  <text x="510" y="46" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">average</text>
  <text x="680" y="46" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">θ ← θ − η <tspan font-weight="700">g</tspan><tspan baseline-shift="sub" font-size="12.5">global</tspan></text>
