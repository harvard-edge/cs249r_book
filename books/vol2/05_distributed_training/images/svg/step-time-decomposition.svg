<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="720" height="475" fill="#ffffff"/>

  <!-- ==================== TOP LEGEND STRIP ==================== -->
  <g transform="translate(60, 16)">
    <rect width="600" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Legend items -->
    <g transform="translate(20, 7)">
      <rect x="0" y="0" width="14" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="20" y="11" font-size="8.5" font-weight="600" fill="#1F407A">Forward Pass</text>

      <rect x="110" y="0" width="14" height="14" rx="2" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.2"/>
      <text x="130" y="11" font-size="8.5" font-weight="600" fill="#4338CA">Backward Pass</text>

      <rect x="235" y="0" width="14" height="14" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
      <text x="255" y="11" font-size="8.5" font-weight="700" fill="#DC2626">Gradient Sync (AllReduce)</text>

      <rect x="425" y="0" width="14" height="14" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
      <text x="445" y="11" font-size="8.5" font-weight="600" fill="#92400E">Optimizer Step</text>
    </g>
  </g>

  <!-- ==================== STACKED BARS SECTION ==================== -->

  <!-- Row 1: N=1 (Single GPU) -->
  <g transform="translate(20, 68)">
    <text x="80" y="21" font-size="10" font-weight="700" fill="#0F172A" text-anchor="end">N = 1 GPU</text>
    <text x="80" y="34" font-size="8" fill="#64748B" text-anchor="end">Single Device</text>

    <!-- Bar container -->
    <g transform="translate(95, 0)">
      <!-- Forward: 160px (35%) -->
      <rect x="0" y="4" width="165" height="38" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="82.5" y="22" font-size="9" font-weight="700" fill="#1F407A" text-anchor="middle">Forward Pass</text>
      <text x="82.5" y="34" font-size="8" fill="#1E3A8A" text-anchor="middle">88 ms (35%)</text>

      <!-- Backward: 245px (53%) -->
      <rect x="170" y="4" width="250" height="38" rx="3" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.2"/>
      <text x="295" y="22" font-size="9" font-weight="700" fill="#4338CA" text-anchor="middle">Backward Pass</text>
      <text x="295" y="34" font-size="8" fill="#3730A3" text-anchor="middle">132 ms (53%)</text>

      <!-- Optimizer: 55px (12%) -->
      <rect x="425" y="4" width="60" height="38" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
      <text x="455" y="22" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">Opt</text>
      <text x="455" y="34" font-size="8" fill="#B45309" text-anchor="middle">12%</text>

      <!-- Metric badge -->
      <rect x="495" y="6" width="90" height="34" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="540" y="20" font-size="9" font-weight="700" fill="#0F172A" text-anchor="middle">250 ms</text>
      <text x="540" y="32" font-size="7.5" fill="#64748B" text-anchor="middle">Baseline Step</text>
    </g>
  </g>

  <!-- Row 2: N=8 (1 Server Node) -->
  <g transform="translate(20, 140)">
    <text x="80" y="21" font-size="10" font-weight="700" fill="#0F172A" text-anchor="end">N = 8 GPUs</text>
    <text x="80" y="34" font-size="8" fill="#64748B" text-anchor="end">1 Node (NVLink)</text>

    <!-- Bar container -->
    <g transform="translate(95, 0)">
      <!-- Forward: 125px -->
      <rect x="0" y="4" width="125" height="38" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="62.5" y="22" font-size="9" font-weight="700" fill="#1F407A" text-anchor="middle">Forward</text>
      <text x="62.5" y="34" font-size="8" fill="#1E3A8A" text-anchor="middle">65 ms</text>

      <!-- Backward: 190px -->
      <rect x="130" y="4" width="195" height="38" rx="3" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.2"/>
      <text x="227.5" y="22" font-size="9" font-weight="700" fill="#4338CA" text-anchor="middle">Backward</text>
      <text x="227.5" y="34" font-size="8" fill="#3730A3" text-anchor="middle">100 ms</text>

      <!-- Grad Sync: 75px -->
      <rect x="330" y="4" width="80" height="38" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
      <text x="370" y="20" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">Sync (NVLink)</text>
      <text x="370" y="33" font-size="7.5" fill="#B91C1C" text-anchor="middle">35 ms (16%)</text>

      <!-- Optimizer: 50px -->
      <rect x="415" y="4" width="50" height="38" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
      <text x="440" y="22" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">Opt</text>
      <text x="440" y="34" font-size="8" fill="#B45309" text-anchor="middle">10 ms</text>

      <!-- Metric badge -->
      <rect x="495" y="6" width="90" height="34" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
      <text x="540" y="20" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">210 ms</text>
      <text x="540" y="32" font-size="7.5" font-weight="600" fill="#15803D" text-anchor="middle">1.19× Speedup</text>
    </g>
  </g>

  <!-- Communication Wall Line -->
  <line x1="335" y1="200" x2="335" y2="276" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="270" y="195" width="130" height="16" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="335" y="206" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">COMMUNICATION WALL</text>

  <!-- Row 3: N=64 (8 Server Nodes) -->
  <g transform="translate(20, 220)">
    <text x="80" y="21" font-size="10" font-weight="700" fill="#0F172A" text-anchor="end">N = 64 GPUs</text>
    <text x="80" y="34" font-size="8" fill="#64748B" text-anchor="end">8 Nodes (IB)</text>

    <!-- Bar container -->
    <g transform="translate(95, 0)">
      <!-- Forward: 75px -->
      <rect x="0" y="4" width="75" height="38" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="37.5" y="22" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">Fwd</text>
      <text x="37.5" y="34" font-size="7.5" fill="#1E3A8A" text-anchor="middle">40 ms</text>

      <!-- Backward: 120px -->
      <rect x="80" y="4" width="120" height="38" rx="3" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.2"/>
      <text x="140" y="22" font-size="8.5" font-weight="700" fill="#4338CA" text-anchor="middle">Backward</text>
      <text x="140" y="34" font-size="7.5" fill="#3730A3" text-anchor="middle">60 ms</text>

      <!-- Grad Sync: 250px (DOMINATES!) -->
      <rect x="205" y="4" width="245" height="38" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
      <text x="327.5" y="20" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">Cross-Node AllReduce (Sync Dominates)</text>
      <text x="327.5" y="33" font-size="8" font-weight="600" fill="#B91C1C" text-anchor="middle">260 ms (68% of iteration time)</text>

      <!-- Optimizer: 40px -->
      <rect x="455" y="4" width="30" height="38" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
      <text x="470" y="27" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle">Opt</text>

      <!-- Metric badge -->
      <rect x="495" y="6" width="90" height="34" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
      <text x="540" y="20" font-size="9" font-weight="700" fill="#991B1B" text-anchor="middle">380 ms</text>
      <text x="540" y="32" font-size="7.5" font-weight="600" fill="#B91C1C" text-anchor="middle">0.66× Baseline Rate</text>
    </g>
  </g>

  <!-- ==================== BOTTOM CARDS ==================== -->
  <!-- Card 1: Scaling Analysis -->
  <g transform="translate(30, 305)">
    <rect width="320" height="150" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 314 0 A 6 6 0 0 1 320 6 L 320 26 L 0 26 Z" fill="#EAF1F8"/>
    <line x1="0" y1="26" x2="320" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#1F407A">Scaling Dynamics &amp; Bottlenecks</text>

    <text x="14" y="46" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#1F407A">Compute Scaling:</tspan>
      <tspan dx="4">Per-worker compute shrinks with 1/N</tspan>
    </text>
    <text x="14" y="62" font-size="8.5" fill="#64748B">Forward &amp; backward time decreases as micro-batches reduce.</text>

    <text x="14" y="82" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#DC2626">Communication Law:</tspan>
      <tspan dx="4">AllReduce volume 2(N−1)/N · M</tspan>
    </text>
    <text x="14" y="98" font-size="8.5" fill="#64748B">Gradient size M remains constant regardless of node count.</text>

    <rect x="12" y="108" width="296" height="32" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="20" y="121" font-size="8" font-weight="600" fill="#991B1B">Efficiency Collapse Threshold:</text>
    <text x="20" y="133" font-size="7.5" fill="#7F1D1D">When Sync &gt; 30% of step time, scaling efficiency falls below 70%</text>
  </g>

  <!-- Card 2: Mitigation Strategies -->
  <g transform="translate(370, 305)">
    <rect width="320" height="150" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 314 0 A 6 6 0 0 1 320 6 L 320 26 L 0 26 Z" fill="#F0FDF4"/>
    <line x1="0" y1="26" x2="320" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#166534">Architectural Mitigations</text>

    <text x="14" y="46" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#166534">Bucketed Overlap:</tspan>
      <tspan dx="4">PyTorch DDP ring AllReduce</tspan>
    </text>
    <text x="14" y="62" font-size="8.5" fill="#64748B">Pipelines communication concurrently during backward pass.</text>

    <text x="14" y="82" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#0F172A">Gradient Accumulation:</tspan>
      <tspan dx="4">Amortize AllReduce across steps</tspan>
    </text>
    <text x="14" y="98" font-size="8.5" fill="#64748B">Sync once every K micro-batches to restore arithmetic intensity.</text>

    <rect x="12" y="108" width="296" height="32" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="20" y="121" font-size="8" font-weight="600" fill="#166534">Hybrid Topology Hierarchy:</text>
    <text x="20" y="133" font-size="7.5" fill="#14532D">Keep frequent sync on NVLink; use ZeRO-3 / PP across inter-node fabric</text>
  </g>
</svg>