  <!-- ==================== BOTTOM COMPARISON CARDS ==================== -->
  <g transform="translate(45, 332)">
    <rect width="630" height="138" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 624 0 A 6 6 0 0 1 630 6 L 630 26 L 0 26 Z" fill="#F1F5F9"/>
