    <text x="14" y="18" font-size="10" font-weight="700" fill="#0F172A">ZeRO Mechanism: Trading Communication Primitives for Memory Capacity</text>

    <!-- Comparison rows -->
    <text x="14" y="48" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#92400E">ZeRO-1 (P_os):</tspan>
      <tspan dx="4">Partitions 12 bytes/param optimizer state across N GPUs (4× reduction). Zero extra communication overhead.</tspan>
    </text>

    <text x="14" y="70" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#1F407A">ZeRO-2 (P_os + P_g):</tspan>
      <tspan dx="4">Also partitions gradients (8× reduction). Replaces AllReduce with ReduceScatter; zero extra communication volume.</tspan>
    </text>

    <text x="14" y="92" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#166534">ZeRO-3 (P_os + P_g + P_p):</tspan>
      <tspan dx="4">Shards parameters; AllGathers parameters layer-by-layer on forward and backward pass (1.5× communication tax).</tspan>
    </text>

    <rect x="12" y="104" width="606" height="24" rx="4" fill="#EAF1F8" stroke="#93C5FD" stroke-width="1"/>
    <text x="315" y="119" font-size="8.5" font-weight="600" fill="#1F407A" text-anchor="middle">Core Principle: ZeRO converts memory redundancy into ring collective operations without changing mathematical output</text>
