<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- START BOX: Model + Dataset Constraints                  -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="270" y="14" width="200" height="42" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="370" y="31" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Model + Dataset</text>
  <text x="370" y="46" font-size="9" fill="#64748b" text-anchor="middle">characterize memory &amp; compute constraints</text>

  <!-- Arrow down to Decision 1 -->
  <line x1="370" y1="56" x2="370" y2="78" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- DECISION 1: Model fits on 1 GPU?                       -->
  <!-- ══════════════════════════════════════════════════════ -->
  <polygon points="370,78 440,100 370,122 300,100" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="370" y="96" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">Model fits</text>
  <text x="370" y="109" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">on 1 GPU?</text>

  <!-- YES branch: right → Decision 2 -->
  <line x1="440" y1="100" x2="522" y2="100" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <rect x="468" y="88" width="26" height="14" rx="2" fill="#dcfce7"/>
  <text x="481" y="98.5" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Yes</text>

  <!-- NO branch: left → Decision 3 -->
  <line x1="300" y1="100" x2="200" y2="100" stroke="#dc2626" stroke-width="1.4"/>
  <line x1="200" y1="100" x2="200" y2="148" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <rect x="238" y="88" width="24" height="14" rx="2" fill="#fee2e2"/>
  <text x="250" y="98.5" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">No</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- DECISION 2 (Right): Dataset fits on 1 GPU?             -->
  <!-- ══════════════════════════════════════════════════════ -->
  <polygon points="590,78 660,100 590,122 520,100" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="96" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">Dataset fits</text>
  <text x="590" y="109" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">on 1 GPU?</text>

  <!-- YES → Single Device terminal -->
  <line x1="590" y1="122" x2="590" y2="150" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <rect x="596" y="128" width="26" height="14" rx="2" fill="#dcfce7"/>
  <text x="609" y="138.5" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Yes</text>

  <!-- Terminal: Single Device -->
  <rect x="520" y="152" width="140" height="42" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="590" y="169" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Single Device</text>
  <text x="590" y="184" font-size="8.5" fill="#166534" text-anchor="middle">no parallelism needed</text>

  <!-- NO → Data Parallelism -->
  <path d="M 660,100 L 700,100 L 700,231 L 668,231" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <rect x="668" y="88" width="24" height="14" rx="2" fill="#fee2e2"/>
  <text x="680" y="98.5" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">No</text>

  <!-- Terminal: Data Parallelism -->
  <rect x="520" y="210" width="140" height="42" rx="4" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="590" y="227" font-size="10" font-weight="700" fill="#14294E" text-anchor="middle">Data Parallelism</text>
  <text x="590" y="242" font-size="8.5" fill="#1F407A" text-anchor="middle">replicate model, split batch</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- DECISION 3 (Left): Sequential layers slow?             -->
  <!-- ══════════════════════════════════════════════════════ -->
  <polygon points="200,150 270,172 200,194 130,172" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="168" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">Sequential</text>
  <text x="200" y="181" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">layers slow?</text>

  <!-- YES → Pipeline Parallelism -->
  <path d="M 130,172 L 60,172 L 60,218" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-orange)"/>
  <rect x="80" y="160" width="26" height="14" rx="2" fill="#fef3c7"/>
  <text x="93" y="170.5" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">Yes</text>

  <!-- Terminal: Pipeline Parallelism -->
  <rect x="10" y="220" width="100" height="44" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="60" y="238" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Pipeline</text>
  <text x="60" y="252" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Parallelism</text>

  <!-- NO → Decision 4 -->
  <line x1="200" y1="194" x2="200" y2="238" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <rect x="206" y="206" width="24" height="14" rx="2" fill="#EAF1F8"/>
  <text x="218" y="216.5" font-size="8.5" font-weight="700" fill="#14294E" text-anchor="middle">No</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- DECISION 4: Single layer too large?                    -->
  <!-- ══════════════════════════════════════════════════════ -->
  <polygon points="200,240 270,262 200,284 130,262" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="258" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">Single layer</text>
  <text x="200" y="271" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">too large?</text>

  <!-- YES → Tensor Parallelism -->
  <path d="M 130,262 L 60,262 L 60,308" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <rect x="80" y="250" width="26" height="14" rx="2" fill="#fee2e2"/>
  <text x="93" y="260.5" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">Yes</text>

  <!-- Terminal: Tensor Parallelism -->
  <rect x="10" y="310" width="100" height="44" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="60" y="328" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">Tensor</text>
  <text x="60" y="342" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">Parallelism</text>

  <!-- NO → Model Parallelism -->
  <line x1="200" y1="284" x2="200" y2="318" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <rect x="206" y="292" width="24" height="14" rx="2" fill="#EAF1F8"/>
  <text x="218" y="302.5" font-size="8.5" font-weight="700" fill="#14294E" text-anchor="middle">No</text>

  <!-- Terminal: Model Parallelism -->
  <rect x="145" y="320" width="110" height="44" rx="4" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="200" y="337" font-size="9.5" font-weight="700" fill="#14294E" text-anchor="middle">Model</text>
  <text x="200" y="351" font-size="9.5" font-weight="700" fill="#14294E" text-anchor="middle">Parallelism</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- SUMMARY CARD: 3D Parallelism at bottom                 -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="160" y="415" width="420" height="48" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="370" y="435" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Combine strategies → 3D Parallelism</text>
  <text x="370" y="451" font-size="9" fill="#166534" text-anchor="middle">Data × Pipeline × Tensor partitioning for production-scale training</text>

  <!-- Orthogonal Connectors to 3D Parallelism -->
  <!-- From Pipeline Parallelism (x=110, y=242) -->
  <path d="M 110,242 L 126,242 L 126,386 L 240,386 L 240,413" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- From Tensor Parallelism (x=110, y=332) -->
  <path d="M 110,332 L 132,332 L 132,396 L 310,396 L 310,413" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- From Model Parallelism (x=200, y=364) -->
  <line x1="200" y1="364" x2="200" y2="405" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="200" y1="405" x2="370" y2="405" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="370" y1="405" x2="370" y2="413" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- From Data Parallelism (x=590, y=252) -->
  <path d="M 590,252 L 590,396 L 470,396 L 470,413" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Footnote -->
  <text x="370" y="488" font-size="8.5" fill="#94a3b8" font-style="italic" text-anchor="middle">Single device handles small models; complex models at scale combine Data, Pipeline, and Tensor parallelism.</text>
</svg>