<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Parallelism decision tree. Decisions = neutral diamonds; strategies = C1 blue; dashed collector = combine axes. Decision edges 1.5, collector 1.2. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="534" fill="#ffffff"/>
  <rect x="53" y="20" width="150" height="34" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="128" y="41.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Workload profile</text>
  <path d="M128,54 V77" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M128,79 L216,112 L128,145 L40,112 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="128" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Fits on</text>
  <text x="128" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">one GPU?</text>
  <path d="M338,79 L418,112 L338,145 L258,112 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="338" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">One GPU</text>
  <text x="338" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">meets target?</text>
  <rect x="448" y="90" width="150" height="44" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="523" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Single device</text>
  <text x="523" y="125" text-anchor="middle" font-size="11.5" fill="#475569">no parallelism</text>
  <rect x="448" y="158" width="150" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="523" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Data parallel</text>
  <text x="523" y="193" text-anchor="middle" font-size="11.5" fill="#475569">replicate, shard batch</text>
  <path d="M128,215 L216,248 L128,281 L40,248 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="128" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Deep layer</text>
  <text x="128" y="261" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">stack?</text>
  <rect x="448" y="226" width="150" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="523" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Pipeline parallel</text>
  <text x="523" y="261" text-anchor="middle" font-size="11.5" fill="#475569">layer stages</text>
  <path d="M128,313 L216,346 L128,379 L40,346 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="128" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">One layer</text>
  <text x="128" y="359" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">too large?</text>
  <rect x="448" y="324" width="150" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="523" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Tensor parallel</text>
  <text x="523" y="359" text-anchor="middle" font-size="11.5" fill="#475569">split within a layer</text>
  <rect x="448" y="410" width="150" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="523" y="429" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Sharded DP</text>
  <text x="523" y="445" text-anchor="middle" font-size="11.5" fill="#475569">FSDP, ZeRO</text>
  <path d="M216,112 H256" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="236" y="105" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">yes</text>
  <path d="M418,112 H446" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="432" y="105" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">yes</text>
  <path d="M338,145 V180 H446" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="346" y="164" text-anchor="start" font-size="11.5" font-style="italic" fill="#64748b">no</text>
  <path d="M128,145 V213" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="136" y="184" text-anchor="start" font-size="11.5" font-style="italic" fill="#64748b">no</text>
  <path d="M216,248 H446" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="236" y="241" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">yes</text>
  <path d="M128,281 V311" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="136" y="304" text-anchor="start" font-size="11.5" font-style="italic" fill="#64748b">no</text>
  <path d="M216,346 H446" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="236" y="339" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">yes</text>
  <path d="M128,379 V432 H446" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="136" y="402" text-anchor="start" font-size="11.5" font-style="italic" fill="#64748b">no</text>
  <line x1="598" y1="180" x2="626" y2="180" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="598" y1="248" x2="626" y2="248" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="598" y1="346" x2="626" y2="346" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="598" y1="432" x2="626" y2="432" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M626,180 V474" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <rect x="408" y="476" width="234" height="38" rx="3" fill="#f8fafc" stroke="#1F407A" stroke-width="1.5"/>
  <text x="525" y="499.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Combine axes: TP × PP × DP</text>
</svg>
