<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 475" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-orange" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="740" height="475" fill="#ffffff"/>

  <!-- ==================== START NODE ==================== -->
  <g transform="translate(260, 14)">
    <rect width="220" height="40" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="110" y="18" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">(Start) Workload Profile</text>
    <text x="110" y="32" font-size="8.5" fill="#64748B" text-anchor="middle">Characterize memory &amp; compute constraints</text>
  </g>

  <!-- Arrow down to Decision 1 -->
  <line x1="370" y1="54" x2="370" y2="74" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ==================== DECISION 1: Fits on 1 GPU? ==================== -->
  <polygon points="370,76 435,97 370,118 305,97" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <text x="370" y="93" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">Model fits</text>
  <text x="370" y="106" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">on 1 GPU?</text>

  <!-- YES branch: right → Decision 2 -->
  <line x1="435" y1="97" x2="515" y2="97" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <rect x="463" y="85" width="28" height="15" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="477" y="96" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">Yes</text>

  <!-- NO branch: left → Decision 3 -->
  <line x1="305" y1="97" x2="225" y2="97" stroke="#DC2626" stroke-width="1.4"/>
  <line x1="225" y1="97" x2="225" y2="138" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <rect x="250" y="85" width="28" height="15" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="264" y="96" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">No</text>

  <!-- ==================== DECISION 2 (Right): Dataset fits? ==================== -->
  <polygon points="585,76 650,97 585,118 520,97" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <text x="585" y="93" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">Dataset fits</text>
  <text x="585" y="106" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">on 1 GPU?</text>

  <!-- YES → Single Device terminal -->
  <line x1="585" y1="118" x2="585" y2="140" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <rect x="591" y="122" width="26" height="15" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="604" y="133" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">Yes</text>

  <!-- Terminal: Single Device -->
  <g transform="translate(515, 142)">
    <rect width="140" height="46" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 5 A 5 5 0 0 1 5 0 L 135 0 A 5 5 0 0 1 140 5 L 140 18 L 0 18 Z" fill="#DCFCE7"/>
    <line x1="0" y1="18" x2="140" y2="18" stroke="#CBD5E1" stroke-width="1"/>
    <text x="70" y="13" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">Single Device</text>
    <text x="70" y="34" font-size="8.5" fill="#475569" text-anchor="middle">No parallelism required</text>
  </g>

  <!-- NO → Data Parallelism -->
  <path d="M 650,97 L 695,97 L 695,225 L 658,225" fill="none" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <rect x="664" y="85" width="26" height="15" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="677" y="96" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">No</text>

  <!-- Terminal: Data Parallelism -->
  <g transform="translate(515, 202)">
    <rect width="140" height="46" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 5 A 5 5 0 0 1 5 0 L 135 0 A 5 5 0 0 1 140 5 L 140 18 L 0 18 Z" fill="#EAF1F8"/>
    <line x1="0" y1="18" x2="140" y2="18" stroke="#CBD5E1" stroke-width="1"/>
    <text x="70" y="13" font-size="9" font-weight="700" fill="#1F407A" text-anchor="middle">Data Parallelism (DP)</text>
    <text x="70" y="34" font-size="8.5" fill="#475569" text-anchor="middle">Replicate weights, shard batch</text>
  </g>

  <!-- ==================== DECISION 3 (Left): Sequential layers slow? ==================== -->
  <polygon points="225,140 285,161 225,182 165,161" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <text x="225" y="157" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">Sequential</text>
  <text x="225" y="170" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">layers slow?</text>

  <!-- YES → Pipeline Parallelism (straight left) -->
  <line x1="165" y1="161" x2="143" y2="161" stroke="#D97706" stroke-width="1.4" marker-end="url(#arr-orange)"/>
  <rect x="144" y="142" width="26" height="15" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="157" y="153" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle">Yes</text>

  <!-- Terminal: Pipeline Parallelism -->
  <g transform="translate(15, 138)">
    <rect width="125" height="46" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 5 A 5 5 0 0 1 5 0 L 120 0 A 5 5 0 0 1 125 5 L 125 18 L 0 18 Z" fill="#FEF3C7"/>
    <line x1="0" y1="18" x2="125" y2="18" stroke="#CBD5E1" stroke-width="1"/>
    <text x="62.5" y="13" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">Pipeline Parallel (PP)</text>
    <text x="62.5" y="34" font-size="8" fill="#475569" text-anchor="middle">Stage across nodes (1F1B)</text>
  </g>

  <!-- NO → Decision 4 (down) -->
  <line x1="225" y1="182" x2="225" y2="218" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <rect x="231" y="192" width="26" height="15" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="244" y="203" font-size="8" font-weight="700" fill="#1F407A" text-anchor="middle">No</text>

  <!-- ==================== DECISION 4: Single layer too large? ==================== -->
  <polygon points="225,220 285,241 225,262 165,241" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <text x="225" y="237" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">Single layer</text>
  <text x="225" y="250" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">too large?</text>

  <!-- YES → Tensor Parallelism (straight left) -->
  <line x1="165" y1="241" x2="143" y2="241" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <rect x="144" y="222" width="26" height="15" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="157" y="233" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">Yes</text>

  <!-- Terminal: Tensor Parallelism -->
  <g transform="translate(15, 218)">
    <rect width="125" height="46" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 5 A 5 5 0 0 1 5 0 L 120 0 A 5 5 0 0 1 125 5 L 125 18 L 0 18 Z" fill="#FEE2E2"/>
    <line x1="0" y1="18" x2="125" y2="18" stroke="#CBD5E1" stroke-width="1"/>
    <text x="62.5" y="13" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">Tensor Parallel (TP)</text>
    <text x="62.5" y="34" font-size="8" fill="#475569" text-anchor="middle">Intra-layer split (NVLink)</text>
  </g>

  <!-- NO → Sharded / FSDP (down) -->
  <line x1="225" y1="262" x2="225" y2="300" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <rect x="231" y="272" width="26" height="15" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="244" y="283" font-size="8" font-weight="700" fill="#1F407A" text-anchor="middle">No</text>

  <!-- Terminal: Sharded / FSDP -->
  <g transform="translate(160, 302)">
    <rect width="130" height="46" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 5 A 5 5 0 0 1 5 0 L 125 0 A 5 5 0 0 1 130 5 L 130 18 L 0 18 Z" fill="#EAF1F8"/>
    <line x1="0" y1="18" x2="130" y2="18" stroke="#CBD5E1" stroke-width="1"/>
    <text x="65" y="13" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">Sharded / FSDP</text>
    <text x="65" y="34" font-size="8" fill="#475569" text-anchor="middle">ZeRO layer partitioning</text>
  </g>

  <!-- ==================== SUMMARY CARD: 3D Parallelism at bottom ==================== -->
  <g transform="translate(130, 395)">
    <rect width="480" height="60" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 474 0 A 6 6 0 0 1 480 6 L 480 24 L 0 24 Z" fill="#F0FDF4"/>
    <line x1="0" y1="24" x2="480" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="240" y="16" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Production Scale: 3D Parallelism (TP × PP × DP)</text>
    <text x="240" y="42" font-size="8.5" fill="#334155" text-anchor="middle">Combine Data, Pipeline, and Tensor partitioning when models exceed single-node memory capacity</text>
  </g>

  <!-- Connectors into 3D Parallelism -->
  <!-- From PP (x=77, y=184) -->
  <path d="M 77,184 L 77,375 L 210,375 L 210,393" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- From TP (x=77, y=264) -->
  <path d="M 77,264 L 77,375 L 290,375 L 290,393" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- From Sharded / FSDP (x=225, y=348) -->
  <path d="M 225,348 L 225,393" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- From DP (x=585, y=248) -->
  <path d="M 585,248 L 585,375 L 450,375 L 450,393" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>
</svg>