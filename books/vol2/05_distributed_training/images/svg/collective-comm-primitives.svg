<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540">
  <rect width="680" height="540" fill="#ffffff"/>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- ========================================== -->
  <!-- ===== CELL 1: AllReduce (top-left) ======= -->
  <!-- ========================================== -->
  <g transform="translate(20, 20)">
    <rect width="300" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0,4 Q 0,0 4,0 L 296,0 Q 300,0 300,4 L 300,24 L 0,24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="300" y2="24" stroke="#1F407A" stroke-width="1"/>
    <text x="15" y="16.5" font-size="10" font-weight="700" fill="#14294E">AllReduce</text>
    <text x="285" y="16.5" text-anchor="end" font-size="8" font-weight="600" fill="#1F407A">DDP Gradient Sync</text>

    <text x="150" y="44" text-anchor="middle" font-size="8" fill="#475569">Sum across all nodes; each node receives full result</text>

    <!-- Before nodes -->
    <rect x="25" y="58" width="38" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="44" y="74.5" text-anchor="middle" font-size="8" font-weight="600" fill="#14294E">g₀</text>
    <rect x="73" y="58" width="38" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="92" y="74.5" text-anchor="middle" font-size="8" font-weight="600" fill="#14294E">g₁</text>
    <rect x="121" y="58" width="38" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="140" y="74.5" text-anchor="middle" font-size="8" font-weight="600" fill="#14294E">g₂</text>
    <rect x="169" y="58" width="38" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="188" y="74.5" text-anchor="middle" font-size="8" font-weight="600" fill="#14294E">g₃</text>

    <!-- Orthogonal routing down to sum node -->
    <path d="M 44,84 L 44,95 L 85,95 L 85,112" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <path d="M 92,84 L 92,102 L 102,102 L 102,112" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <path d="M 140,84 L 140,102 L 130,102 L 130,112" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <path d="M 188,84 L 188,95 L 147,95 L 147,112" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

    <!-- Sum node -->
    <rect x="80" y="114" width="72" height="26" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
    <text x="116" y="130.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">Σ g_i</text>

    <!-- Orthogonal routing back to all nodes -->
    <path d="M 85,140 L 85,155 L 44,155 L 44,168" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>
    <path d="M 102,140 L 102,148 L 92,148 L 92,168" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>
    <path d="M 130,140 L 130,148 L 140,148 L 140,168" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>
    <path d="M 147,140 L 147,155 L 188,155 L 188,168" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>

    <!-- After nodes -->
    <rect x="25" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="44" y="186.5" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Σg</text>
    <rect x="73" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="92" y="186.5" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Σg</text>
    <rect x="121" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="140" y="186.5" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Σg</text>
    <rect x="169" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="188" y="186.5" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Σg</text>

    <!-- Volume badge -->
    <g transform="translate(218, 105)">
      <rect width="70" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="35" y="14" text-anchor="middle" font-size="7" font-weight="700" fill="#64748b">VOLUME</text>
      <text x="35" y="27" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f172a">2(N-1)/N · M</text>
      <text x="35" y="39" text-anchor="middle" font-size="7" fill="#15803d">Ring-optimal</text>
    </g>

    <!-- Footer pill -->
    <text x="150" y="222" text-anchor="middle" font-size="7.5" fill="#64748b">Primary workhorse of Megatron-LM DP &amp; PyTorch DDP</text>
  </g>

  <!-- ========================================== -->
  <!-- ===== CELL 2: AllGather (top-right) ====== -->
  <!-- ========================================== -->
  <g transform="translate(360, 20)">
    <rect width="300" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0,4 Q 0,0 4,0 L 296,0 Q 300,0 300,4 L 300,24 L 0,24 Z" fill="#fef3c7"/>
    <line x1="0" y1="24" x2="300" y2="24" stroke="#d97706" stroke-width="1"/>
    <text x="15" y="16.5" font-size="10" font-weight="700" fill="#92400e">AllGather</text>
    <text x="285" y="16.5" text-anchor="end" font-size="8" font-weight="600" fill="#b45309">FSDP Layer Reconstruct</text>

    <text x="150" y="44" text-anchor="middle" font-size="8" fill="#475569">Each node has a distinct shard; all nodes collect full tensor</text>

    <!-- 4 nodes each with shard -->
    <rect x="25" y="58" width="38" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="44" y="74.5" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">P₀</text>
    <rect x="73" y="58" width="38" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="92" y="74.5" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">P₁</text>
    <rect x="121" y="58" width="38" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="140" y="74.5" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">P₂</text>
    <rect x="169" y="58" width="38" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="188" y="74.5" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">P₃</text>

    <!-- Arrows indicating gather -->
    <path d="M 44,84 L 44,168" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
    <path d="M 92,84 L 92,168" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
    <path d="M 140,84 L 140,168" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
    <path d="M 188,84 L 188,168" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow-orange)"/>

    <!-- After nodes -->
    <rect x="25" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="44" y="186.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">P₀₋₃</text>
    <rect x="73" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="92" y="186.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">P₀₋₃</text>
    <rect x="121" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="140" y="186.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">P₀₋₃</text>
    <rect x="169" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="188" y="186.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">P₀₋₃</text>

    <!-- Volume badge -->
    <g transform="translate(218, 105)">
      <rect width="70" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="35" y="14" text-anchor="middle" font-size="7" font-weight="700" fill="#64748b">VOLUME</text>
      <text x="35" y="27" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f172a">(N-1)/N · M</text>
      <text x="35" y="39" text-anchor="middle" font-size="7" fill="#b45309">Per-node rx</text>
    </g>

    <!-- Footer pill -->
    <text x="150" y="222" text-anchor="middle" font-size="7.5" fill="#64748b">Used before each forward pass to assemble sharded weights</text>
  </g>

  <!-- ========================================== -->
  <!-- ===== CELL 3: ReduceScatter (bottom-left)= -->
  <!-- ========================================== -->
  <g transform="translate(20, 280)">
    <rect width="300" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0,4 Q 0,0 4,0 L 296,0 Q 300,0 300,4 L 300,24 L 0,24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="300" y2="24" stroke="#1F407A" stroke-width="1"/>
    <text x="15" y="16.5" font-size="10" font-weight="700" fill="#14294E">ReduceScatter</text>
    <text x="285" y="16.5" text-anchor="end" font-size="8" font-weight="600" fill="#1F407A">ZeRO / FSDP Sharding</text>

    <text x="150" y="44" text-anchor="middle" font-size="8" fill="#475569">Sum across nodes, then scatter — each node holds 1/N reduced</text>

    <!-- Before nodes -->
    <rect x="25" y="58" width="38" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="44" y="74.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#14294E">g₀₁₂₃</text>
    <rect x="73" y="58" width="38" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="92" y="74.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#14294E">g₀₁₂₃</text>
    <rect x="121" y="58" width="38" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="140" y="74.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#14294E">g₀₁₂₃</text>
    <rect x="169" y="58" width="38" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="188" y="74.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#14294E">g₀₁₂₃</text>

    <!-- Virtual reduction bus -->
    <line x1="85" y1="127" x2="147" y2="127" stroke="#1F407A" stroke-width="1.5"/>

    <!-- Orthogonal routing down to bus -->
    <path d="M 44,84 L 44,105 L 85,105 L 85,125" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <path d="M 92,84 L 92,112 L 102,112 L 102,125" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <path d="M 140,84 L 140,112 L 130,112 L 130,125" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <path d="M 188,84 L 188,105 L 147,105 L 147,125" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

    <!-- Orthogonal routing from bus to scattered nodes -->
    <path d="M 85,129 L 85,149 L 44,149 L 44,168" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>
    <path d="M 102,129 L 102,142 L 92,142 L 92,168" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>
    <path d="M 130,129 L 130,142 L 140,142 L 140,168" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>
    <path d="M 147,129 L 147,149 L 188,149 L 188,168" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow-green)"/>

    <!-- After nodes -->
    <rect x="25" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="44" y="186.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">Σg₀</text>
    <rect x="73" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="92" y="186.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">Σg₁</text>
    <rect x="121" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="140" y="186.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">Σg₂</text>
    <rect x="169" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="188" y="186.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">Σg₃</text>

    <!-- Volume badge -->
    <g transform="translate(218, 105)">
      <rect width="70" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="35" y="14" text-anchor="middle" font-size="7" font-weight="700" fill="#64748b">VOLUME</text>
      <text x="35" y="27" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f172a">(N-1)/N · M</text>
      <text x="35" y="39" text-anchor="middle" font-size="7" fill="#15803d">Equal to AllGather</text>
    </g>

    <!-- Footer pill -->
    <text x="150" y="222" text-anchor="middle" font-size="7.5" fill="#64748b">Together with AllGather, forms full AllReduce (ZeRO-3)</text>
  </g>

  <!-- ========================================== -->
  <!-- ===== CELL 4: Broadcast (bottom-right) === -->
  <!-- ========================================== -->
  <g transform="translate(360, 280)">
    <rect width="300" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0,4 Q 0,0 4,0 L 296,0 Q 300,0 300,4 L 300,24 L 0,24 Z" fill="#f1f5f9"/>
    <line x1="0" y1="24" x2="300" y2="24" stroke="#94a3b8" stroke-width="1"/>
    <text x="15" y="16.5" font-size="10" font-weight="700" fill="#334155">Broadcast</text>
    <text x="285" y="16.5" text-anchor="end" font-size="8" font-weight="600" fill="#64748b">Weights / Checkpoints</text>

    <text x="150" y="44" text-anchor="middle" font-size="8" fill="#475569">One root node sends data; all nodes receive an identical copy</text>

    <!-- Root node -->
    <rect x="80" y="58" width="72" height="26" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
    <text x="116" y="74.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">Root: W</text>

    <!-- Orthogonal broadcast routing out -->
    <path d="M 85,84 L 85,150 L 44,150 L 44,168" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <path d="M 102,84 L 102,135 L 92,135 L 92,168" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <path d="M 130,84 L 130,135 L 140,135 L 140,168" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <path d="M 147,84 L 147,150 L 188,150 L 188,168" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

    <!-- Receiving nodes -->
    <rect x="25" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="44" y="186.5" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">W</text>
    <rect x="73" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="92" y="186.5" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">W</text>
    <rect x="121" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="140" y="186.5" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">W</text>
    <rect x="169" y="170" width="38" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="188" y="186.5" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">W</text>

    <!-- Volume badge -->
    <g transform="translate(218, 105)">
      <rect width="70" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="35" y="14" text-anchor="middle" font-size="7" font-weight="700" fill="#64748b">VOLUME</text>
      <text x="35" y="27" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f172a">M · (N-1)/N</text>
      <text x="35" y="39" text-anchor="middle" font-size="7" fill="#64748b">Tree-optimal</text>
    </g>

    <!-- Footer pill -->
    <text x="150" y="222" text-anchor="middle" font-size="7.5" fill="#64748b">Used for initial seed distribution &amp; parameter initialization</text>
  </g>
</svg>