<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- 3D parallelism cube, 4 x 4 x 4 cells, one cell per GPU. One GPU (front, bottom, right) is solid accent navy;
