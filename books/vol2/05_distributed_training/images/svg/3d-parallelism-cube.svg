<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="700" height="330" fill="#ffffff"/>
  <!-- ===== Cube: hidden edges ===== -->
  <line x1="150" y1="262" x2="214" y2="214" stroke="#94a3b8" stroke-width="1.0" stroke-dasharray="4,3"/>
  <line x1="214" y1="214" x2="334" y2="214" stroke="#94a3b8" stroke-width="1.0" stroke-dasharray="4,3"/>
  <line x1="214" y1="214" x2="214" y2="94" stroke="#94a3b8" stroke-width="1.0" stroke-dasharray="4,3"/>
  <!-- ===== Cube: visible faces ===== -->
  <polygon points="150,262 270,262 270,142 150,142" fill="#f8fafc" stroke="none"/>
  <polygon points="150,142 270,142 334,94 214,94" fill="#f1f5f9" stroke="none"/>
  <polygon points="270,262 334,214 334,94 270,142" fill="#e2e8f0" stroke="none"/>
  <!-- ===== Cube: cell grid (one cell = one GPU) ===== -->
  <line x1="180" y1="262" x2="180" y2="142" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="150" y1="232" x2="270" y2="232" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="180" y1="142" x2="244" y2="94" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="166" y1="130" x2="286" y2="130" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="270" y1="232" x2="334" y2="184" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="286" y1="250" x2="286" y2="130" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="210" y1="262" x2="210" y2="142" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="150" y1="202" x2="270" y2="202" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="210" y1="142" x2="274" y2="94" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="182" y1="118" x2="302" y2="118" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="270" y1="202" x2="334" y2="154" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="302" y1="238" x2="302" y2="118" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="240" y1="262" x2="240" y2="142" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="150" y1="172" x2="270" y2="172" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="240" y1="142" x2="304" y2="94" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="198" y1="106" x2="318" y2="106" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="270" y1="172" x2="334" y2="124" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="318" y1="226" x2="318" y2="106" stroke="#cbd5e1" stroke-width="0.8"/>
  <!-- ===== Highlighted GPU cell at the origin ===== -->
  <polygon points="150,262 180,262 180,232 150,232" fill="#1F407A" stroke="#1F407A" stroke-width="1"/>
  <!-- ===== Cube: visible outer edges ===== -->
  <line x1="150" y1="262" x2="270" y2="262" stroke="#475569" stroke-width="1.5"/>
  <line x1="270" y1="262" x2="270" y2="142" stroke="#475569" stroke-width="1.5"/>
  <line x1="270" y1="142" x2="150" y2="142" stroke="#475569" stroke-width="1.5"/>
  <line x1="150" y1="142" x2="150" y2="262" stroke="#475569" stroke-width="1.5"/>
  <line x1="150" y1="142" x2="214" y2="94" stroke="#475569" stroke-width="1.5"/>
  <line x1="270" y1="142" x2="334" y2="94" stroke="#475569" stroke-width="1.5"/>
  <line x1="214" y1="94" x2="334" y2="94" stroke="#475569" stroke-width="1.5"/>
  <line x1="270" y1="262" x2="334" y2="214" stroke="#475569" stroke-width="1.5"/>
  <line x1="334" y1="214" x2="334" y2="94" stroke="#475569" stroke-width="1.5"/>
  <!-- ===== Axis arrows along the three edges ===== -->
  <line x1="278" y1="262" x2="348" y2="262" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="313" y="280" text-anchor="middle" font-size="10" font-weight="700" fill="#D97706">Tensor Parallel (t)</text>
  <line x1="150" y1="134" x2="150" y2="72" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="150" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">Pipeline Parallel (p)</text>
  <line x1="340.4" y1="209.2" x2="391.6" y2="170.8" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="399.6" y="168.8" text-anchor="start" font-size="10" font-weight="700" fill="#1F407A">Data Parallel (d)</text>
  <!-- ===== Leader to highlighted cell ===== -->
  <line x1="146" y1="247" x2="120" y2="247" stroke="#64748b" stroke-width="1.0"/>
  <text x="114" y="244" text-anchor="end" font-size="9" font-weight="700" fill="#0f172a">One GPU</text>
  <text x="114" y="256" text-anchor="end" font-size="8.5" fill="#475569">per (d, p, t) cell</text>
  <!-- ===== Right panel: formula ===== -->
  <rect x="490" y="20" width="190" height="56" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="585" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Total devices = d × p × t</text>
  <text x="585" y="62" text-anchor="middle" font-size="10" fill="#475569">e.g., 64 × 16 × 8 = 8,192</text>
  <!-- ===== Right panel: axis descriptions ===== -->
  <rect x="490" y="88" width="190" height="146" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="500" y="100" width="11" height="11" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="519" y="109" font-size="9.5" font-weight="700" fill="#D97706">Tensor Parallel (t)</text>
  <text x="519" y="122" font-size="8.5" fill="#475569">Split matrices within a layer</text>
  <text x="519" y="134" font-size="8.5" fill="#475569">Requires NVLink (intra-node)</text>
  <rect x="500" y="146" width="11" height="11" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="519" y="155" font-size="9.5" font-weight="700" fill="#16A34A">Pipeline Parallel (p)</text>
  <text x="519" y="168" font-size="8.5" fill="#475569">Partition layers into stages</text>
  <text x="519" y="180" font-size="8.5" fill="#475569">Suitable for inter-node links</text>
  <rect x="500" y="192" width="11" height="11" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="519" y="201" font-size="9.5" font-weight="700" fill="#1F407A">Data Parallel (d)</text>
  <text x="519" y="214" font-size="8.5" fill="#475569">Replicate model; split batch</text>
  <text x="519" y="226" font-size="8.5" fill="#475569">AllReduce over replicas</text>
  <!-- ===== Right panel: placement rule ===== -->
  <rect x="490" y="246" width="190" height="76" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="490" y="246" width="190" height="20" rx="3" fill="#e2e8f0"/>
  <text x="585" y="259.5" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Hardware Placement Rule</text>
  <text x="500" y="281" font-size="8.5"><tspan font-weight="700" fill="#b45309">t:</tspan><tspan fill="#475569" dx="4">within node (NVLink 900 GB/s bidir.)</tspan></text>
  <text x="500" y="296" font-size="8.5"><tspan font-weight="700" fill="#15803d">p:</tspan><tspan fill="#475569" dx="4">across nodes (IB 50 GB/s per port)</tspan></text>
  <text x="500" y="311" font-size="8.5"><tspan font-weight="700" fill="#14294E">d:</tspan><tspan fill="#475569" dx="4">across racks / data centers</tspan></text>
</svg>
