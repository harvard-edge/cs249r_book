  <text x="267.5" y="291.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">tensor group</text>
  <text x="357.5" y="197.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E" transform="rotate(-90 357.5 197.5)">pipeline group</text>
  <!-- ===== axes ===== -->
  <line x1="200" y1="328" x2="378" y2="328" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">tensor, <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="11" font-style="normal">TP</tspan></text>
  <text x="290" y="367" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">within a layer, fast domain</text>
  <line x1="182" y1="310" x2="182" y2="132" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="170" y="214" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">pipeline, <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="11" font-style="normal">PP</tspan></text>
  <text x="170" y="231" text-anchor="end" font-size="11.5" font-weight="400" fill="#475569">stages, activations</text>
  <line x1="396" y1="322" x2="490" y2="251.5" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="504" y="254" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">data, <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="11" font-style="normal">DP</tspan></text>
  <text x="504" y="271" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">replicas, gradients</text>
  <line x1="440.0" y1="242.5" x2="490.0" y2="212.5" stroke="#64748b" stroke-width="0.8"/>
  <text x="494.0" y="210.5" text-anchor="start" font-size="11.5" font-weight="700" fill="#14294E">data group</text>
  <!-- ===== key ===== -->
  <rect x="30" y="24" width="16" height="16" fill="#1F407A" stroke="#1F407A" stroke-width="0.9"/>
  <text x="54" y="37" text-anchor="start" font-size="12" font-weight="400" fill="#334155">one GPU</text>
  <rect x="30" y="50" width="16" height="16" fill="#C9D7EA" stroke="#94a3b8" stroke-width="0.9"/>
  <text x="54" y="63" text-anchor="start" font-size="12" font-weight="400" fill="#334155">GPUs it communicates with</text>
  <text x="670" y="40" text-anchor="end" font-size="15" font-weight="700" fill="#0f172a"><tspan font-style="italic">N</tspan> = <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="11" font-style="normal">DP</tspan> × <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="11" font-style="normal">PP</tspan> × <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="11" font-style="normal">TP</tspan></text>
