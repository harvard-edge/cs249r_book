<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 445" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Clean Canvas Base -->
  <rect width="680" height="445" fill="#ffffff"/>

  <!-- Legend at top -->
  <g transform="translate(85, 14)">
    <rect width="510" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <g transform="translate(15, 7)">
      <rect x="0" y="0" width="14" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="20" y="11" font-size="8.5" font-weight="600" fill="#1F407A">Weights (FP16, 2B/param)</text>

      <rect x="160" y="0" width="14" height="14" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
      <text x="180" y="11" font-size="8.5" font-weight="600" fill="#92400E">Gradients (FP16, 2B/param)</text>

      <rect x="315" y="0" width="14" height="14" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
      <text x="335" y="11" font-size="8.5" font-weight="600" fill="#166534">Optimizer States (FP32, 12B/param)</text>
    </g>
  </g>

  <!-- Stage column headers -->
  <g transform="translate(80, 50)">
    <!-- DDP Header -->
    <rect x="0" y="0" width="90" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="45" y="13" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F172A">DDP</text>
    <text x="45" y="23" text-anchor="middle" font-size="7.5" fill="#64748B">Baseline</text>

    <!-- ZeRO-1 Header -->
    <rect x="155" y="0" width="90" height="28" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <text x="200" y="13" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400E">ZeRO-1</text>
    <text x="200" y="23" text-anchor="middle" font-size="7.5" fill="#B45309">Shard Opt States</text>

    <!-- ZeRO-2 Header -->
    <rect x="310" y="0" width="90" height="28" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="355" y="13" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F407A">ZeRO-2</text>
    <text x="355" y="23" text-anchor="middle" font-size="7.5" fill="#1E3A8A">+ Shard Gradients</text>

    <!-- ZeRO-3 Header -->
    <rect x="465" y="0" width="90" height="28" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
    <text x="510" y="13" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">ZeRO-3</text>
    <text x="510" y="23" text-anchor="middle" font-size="7.5" fill="#15803D">+ Shard Params</text>
  </g>

  <!-- Y-axis label -->
  <text x="22" y="235" text-anchor="middle" font-size="9" font-weight="700" fill="#475569" transform="rotate(-90,22,235)">Memory per GPU (GB)</text>

  <!-- Gridlines -->
  <line x1="55" y1="360" x2="650" y2="360" stroke="#94A3B8" stroke-width="1"/>
  <text x="48" y="363" text-anchor="end" font-size="8.5" fill="#64748B">0</text>

  <line x1="55" y1="312" x2="650" y2="312" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="48" y="315" text-anchor="end" font-size="8.5" fill="#64748B">20</text>

  <line x1="55" y1="264" x2="650" y2="264" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="48" y="267" text-anchor="end" font-size="8.5" fill="#64748B">40</text>

  <line x1="55" y1="216" x2="650" y2="216" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="48" y="219" text-anchor="end" font-size="8.5" fill="#64748B">60</text>

  <line x1="55" y1="168" x2="650" y2="168" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="48" y="171" text-anchor="end" font-size="8.5" fill="#64748B">80</text>

  <line x1="55" y1="120" x2="650" y2="120" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="48" y="123" text-anchor="end" font-size="8.5" fill="#64748B">100</text>

  <!-- ==================== BARS ==================== -->
  <!-- Bar 1: DDP (112 GB total) -->
  <g transform="translate(85, 0)">
    <!-- OS: 84 GB (204px) -->
    <rect x="0" y="156" width="80" height="204" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <text x="40" y="262" text-anchor="middle" font-size="9" font-weight="700" fill="#15803D">OS (84 GB)</text>

    <!-- Gradients: 14 GB (34px) -->
    <rect x="0" y="122" width="80" height="34" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="40" y="143" text-anchor="middle" font-size="8.5" font-weight="600" fill="#92400E">G (14 GB)</text>

    <!-- Weights: 14 GB (34px) -->
    <rect x="0" y="88" width="80" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="40" y="109" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1F407A">W (14 GB)</text>

    <!-- Total Pill -->
    <rect x="-2" y="368" width="84" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="40" y="380" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F172A">112 GB</text>
    <text x="40" y="392" text-anchor="middle" font-size="7.5" fill="#64748B">1.0× Baseline</text>
  </g>

  <!-- Bar 2: ZeRO-1 (~29 GB total) -->
  <g transform="translate(240, 0)">
    <!-- OS/N: ~1.3 GB (8px) -->
    <rect x="0" y="322" width="80" height="38" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <text x="40" y="344" text-anchor="middle" font-size="8" font-weight="700" fill="#15803D">OS/N (1.3 GB)</text>

    <!-- Gradients: 14 GB (34px) -->
    <rect x="0" y="288" width="80" height="34" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="40" y="309" text-anchor="middle" font-size="8.5" font-weight="600" fill="#92400E">G (14 GB)</text>

    <!-- Weights: 14 GB (34px) -->
    <rect x="0" y="254" width="80" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="40" y="275" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1F407A">W (14 GB)</text>

    <!-- Total Pill -->
    <rect x="-2" y="368" width="84" height="30" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <text x="40" y="380" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400E">~29.3 GB</text>
    <text x="40" y="392" text-anchor="middle" font-size="7.5" font-weight="600" fill="#B45309">3.8× Reduction</text>
  </g>

  <!-- Bar 3: ZeRO-2 (~16 GB total) -->
  <g transform="translate(395, 0)">
    <!-- OS/N + G/N (12px) -->
    <rect x="0" y="344" width="80" height="16" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <text x="40" y="356" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803D">(OS+G)/N</text>

    <!-- Weights: 14 GB (34px) -->
    <rect x="0" y="310" width="80" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="40" y="331" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1F407A">W (14 GB)</text>

    <!-- Total Pill -->
    <rect x="-2" y="368" width="84" height="30" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="40" y="380" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F407A">~15.5 GB</text>
    <text x="40" y="392" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1E3A8A">7.2× Reduction</text>
  </g>

  <!-- Bar 4: ZeRO-3 (~1.9 GB total) -->
  <g transform="translate(550, 0)">
    <!-- Fully Sharded Stack (12px) -->
    <rect x="0" y="344" width="80" height="16" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <text x="40" y="356" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803D">(W+G+OS)/N</text>

    <!-- Sharded Label -->
    <text x="40" y="334" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">All Sharded</text>

    <!-- Total Pill -->
    <rect x="-2" y="368" width="84" height="30" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
    <text x="40" y="380" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">~1.75 GB</text>
    <text x="40" y="392" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803D">64× Reduction</text>
  </g>

  <!-- ==================== BOTTOM CONTEXT STRIP ==================== -->
  <g transform="translate(60, 412)">
    <rect width="560" height="22" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="280" y="15" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Reference Benchmark: 7B FP16 Model (16 B/param under AdamW) Sharded Across N = 64 GPUs</text>
  </g>
</svg>