<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean Canvas Base -->
  <rect width="680" height="440" fill="#ffffff"/>

  <!-- Legend at top (y=20) -->
  <g transform="translate(100 16)">
    <rect x="0" y="0" width="14" height="12" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="20" y="10" font-size="8.5" fill="#475569">Weights (FP16, 2B/param)</text>

    <rect x="175" y="0" width="14" height="12" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="195" y="10" font-size="8.5" fill="#475569">Gradients (FP16, 2B/param)</text>

    <rect x="340" y="0" width="14" height="12" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="360" y="10" font-size="8.5" fill="#475569">Optimizer States (FP32, 12B/param)</text>
  </g>

  <!-- Stage column headers (y=48) -->
  <text x="125" y="52" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">DDP</text>
  <text x="125" y="65" text-anchor="middle" font-size="8.5" fill="#64748b">(Baseline)</text>

  <text x="280" y="52" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">ZeRO-1</text>
  <text x="280" y="65" text-anchor="middle" font-size="8.5" fill="#64748b">Shard Optimizer States</text>

  <text x="435" y="52" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">ZeRO-2</text>
  <text x="435" y="65" text-anchor="middle" font-size="8.5" fill="#64748b">+ Shard Gradients</text>

  <text x="590" y="52" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">ZeRO-3</text>
  <text x="590" y="65" text-anchor="middle" font-size="8.5" fill="#64748b">+ Shard Parameters</text>

  <!-- Y-axis label -->
  <text x="24" y="240" text-anchor="middle" font-size="9" font-weight="700" fill="#475569" transform="rotate(-90,24,240)">Memory per GPU (GB)</text>

  <!-- Gridlines -->
  <line x1="55" y1="360" x2="650" y2="360" stroke="#94a3b8" stroke-width="1"/>
  <text x="48" y="363" text-anchor="end" font-size="8.5" fill="#64748b">0</text>

  <line x1="55" y1="312" x2="650" y2="312" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="48" y="315" text-anchor="end" font-size="8.5" fill="#64748b">20</text>

  <line x1="55" y1="264" x2="650" y2="264" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="48" y="267" text-anchor="end" font-size="8.5" fill="#64748b">40</text>

  <line x1="55" y1="216" x2="650" y2="216" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="48" y="219" text-anchor="end" font-size="8.5" fill="#64748b">60</text>

  <line x1="55" y1="168" x2="650" y2="168" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="48" y="171" text-anchor="end" font-size="8.5" fill="#64748b">80</text>

  <line x1="55" y1="120" x2="650" y2="120" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="48" y="123" text-anchor="end" font-size="8.5" fill="#64748b">100</text>

  <!-- Bar 1: DDP (112 GB total) -->
  <rect x="85" y="156" width="80" height="204" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="125" y="260" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">OS (84 GB)</text>
  <rect x="85" y="122" width="80" height="34" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="125" y="143" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b45309">G 14 GB</text>
  <rect x="85" y="88" width="80" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="125" y="109" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0369a1">W 14 GB</text>
  <text x="125" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">112 GB</text>
  <text x="125" y="394" text-anchor="middle" font-size="8.5" fill="#64748b">1.0× baseline</text>

  <!-- Bar 2: ZeRO-1 (~29 GB total) -->
  <rect x="240" y="290" width="80" height="70" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="280" y="330" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">OS/N ≈ 1.3 GB</text>
  <rect x="240" y="256" width="80" height="34" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="280" y="277" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b45309">G 14 GB</text>
  <rect x="240" y="222" width="80" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="280" y="243" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0369a1">W 14 GB</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">~29 GB</text>
  <text x="280" y="394" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803d">~4× reduction</text>

  <!-- Bar 3: ZeRO-2 (~16 GB total) -->
  <rect x="395" y="324" width="80" height="36" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="435" y="344" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">OS/N</text>
  <rect x="395" y="300" width="80" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="435" y="316" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">G/N</text>
  <rect x="395" y="266" width="80" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="435" y="287" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0369a1">W 14 GB</text>
  <text x="435" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">~16 GB</text>
  <text x="435" y="394" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803d">~7× reduction</text>

  <!-- Bar 4: ZeRO-3 (~2 GB total) -->
  <rect x="550" y="346" width="80" height="14" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="550" y="338" width="80" height="8" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <rect x="550" y="330" width="80" height="8" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="590" y="322" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">All Sharded</text>
  <text x="590" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">~1.9 GB</text>
  <text x="590" y="394" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0284c7">~60× reduction</text>

  <!-- Bottom Footnote -->
  <line x1="80" y1="416" x2="600" y2="416" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="432" text-anchor="middle" font-size="8.5" font-style="italic" fill="#64748b">Memory footprints for a 7B FP16 model across 64 GPUs under AdamW (16 bytes state per parameter).</text>
</svg>