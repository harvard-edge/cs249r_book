<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 465" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="680" height="465" fill="#ffffff"/>

  <!-- ===== Concentric Hierarchy Rings ===== -->
  <!-- Outer ring: Data Parallelism (DP) -->
  <ellipse cx="340" cy="150" rx="320" ry="136" fill="#FEF3C7" fill-opacity="0.45" stroke="#D97706" stroke-width="1.8"/>
  <rect x="235" y="22" width="210" height="20" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="340" y="36" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">Data Parallelism (DP) · Cross-Rack</text>
  <text x="340" y="54" text-anchor="middle" font-size="8.5" fill="#78350F">Cross-cluster fabric · 25–50 GB/s · AllReduce gradients once per step</text>

  <!-- Middle ring: Pipeline Parallelism (PP) -->
  <ellipse cx="340" cy="158" rx="225" ry="96" fill="#DCFCE7" fill-opacity="0.55" stroke="#16A34A" stroke-width="1.8"/>
  <rect x="235" y="70" width="210" height="20" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="340" y="84" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">Pipeline Parallelism (PP) · Inter-Node</text>
  <text x="340" y="101" text-anchor="middle" font-size="8.5" fill="#14532D">InfiniBand / RoCE · 50–100 GB/s · P2P activation passing between layer stages</text>

  <!-- Inner ring: Tensor Parallelism (TP) -->
  <ellipse cx="340" cy="172" rx="135" ry="60" fill="#EAF1F8" fill-opacity="0.85" stroke="#1F407A" stroke-width="2"/>
  <rect x="240" y="120" width="200" height="18" rx="9" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="340" y="133" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Tensor Parallelism (TP) · Intra-Node</text>

  <!-- 8-GPU DGX/HGX Node inside Inner Ring -->
  <!-- Row 1: GPUs 0-3 -->
  <!-- Interconnect lines (NVLink Mesh) -->
  <line x1="262" y1="156" x2="418" y2="156" stroke="#93C5FD" stroke-width="2"/>
  <line x1="262" y1="184" x2="418" y2="184" stroke="#93C5FD" stroke-width="2"/>
  <line x1="262" y1="156" x2="262" y2="184" stroke="#93C5FD" stroke-width="2"/>
  <line x1="314" y1="156" x2="314" y2="184" stroke="#93C5FD" stroke-width="2"/>
  <line x1="366" y1="156" x2="366" y2="184" stroke="#93C5FD" stroke-width="2"/>
  <line x1="418" y1="156" x2="418" y2="184" stroke="#93C5FD" stroke-width="2"/>

  <!-- GPUs -->
  <!-- GPU 0 -->
  <rect x="244" y="146" width="36" height="20" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.4"/>
  <text x="262" y="160" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">GPU 0</text>
  <!-- GPU 1 -->
  <rect x="296" y="146" width="36" height="20" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.4"/>
  <text x="314" y="160" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">GPU 1</text>
  <!-- GPU 2 -->
  <rect x="348" y="146" width="36" height="20" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.4"/>
  <text x="366" y="160" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">GPU 2</text>
  <!-- GPU 3 -->
  <rect x="400" y="146" width="36" height="20" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.4"/>
  <text x="418" y="160" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">GPU 3</text>

  <!-- Row 2: GPUs 4-7 -->
  <!-- GPU 4 -->
  <rect x="244" y="174" width="36" height="20" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.4"/>
  <text x="262" y="188" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">GPU 4</text>
  <!-- GPU 5 -->
  <rect x="296" y="174" width="36" height="20" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.4"/>
  <text x="314" y="188" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">GPU 5</text>
  <!-- GPU 6 -->
  <rect x="348" y="174" width="36" height="20" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.4"/>
  <text x="366" y="188" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">GPU 6</text>
  <!-- GPU 7 -->
  <rect x="400" y="174" width="36" height="20" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.4"/>
  <text x="418" y="188" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">GPU 7</text>

  <!-- NVLink Bandwidth Badge -->
  <text x="340" y="209" text-anchor="middle" font-size="8" font-weight="600" fill="#1E3A8A">NVLink 900 GB/s · AllReduce 2× per transformer layer</text>

  <!-- ===== Bottom Comparison Cards ===== -->
  <!-- Card 1: Hierarchy Principle -->
  <rect x="20" y="306" width="310" height="142" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <path d="M 20 312 A 6 6 0 0 1 26 306 L 324 306 A 6 6 0 0 1 330 312 L 330 332 L 20 332 Z" fill="#EAF1F8"/>
  <line x1="20" y1="332" x2="330" y2="332" stroke="#CBD5E1" stroke-width="1"/>
  <text x="34" y="324" font-size="10" font-weight="700" fill="#1F407A">Bandwidth-Matching Principle</text>

  <text x="34" y="350" font-size="9" fill="#334155">
    <tspan font-weight="700" fill="#1F407A">TP (Inner):</tspan>
    <tspan dx="4">Sub-millisecond sync → strictly requires NVLink</tspan>
  </text>
  <text x="34" y="369" font-size="9" fill="#334155">
    <tspan font-weight="700" fill="#16A34A">PP (Middle):</tspan>
    <tspan dx="4">Boundary activations → InfiniBand / RoCE</tspan>
  </text>
  <text x="34" y="388" font-size="9" fill="#334155">
    <tspan font-weight="700" fill="#D97706">DP (Outer):</tspan>
    <tspan dx="4">Once per batch step → tolerates cross-rack fabric</tspan>
  </text>

  <rect x="30" y="405" width="290" height="32" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="175" y="418" text-anchor="middle" font-size="8.5" font-weight="600" fill="#991B1B">Hierarchy Rule: Comm Volume ∝ 1 / Link Bandwidth</text>
  <text x="175" y="430" text-anchor="middle" font-size="8" fill="#B91C1C">Placing TP across nodes causes immediate fabric saturation and stalls</text>

  <!-- Card 2: Production Scaling Example -->
  <rect x="350" y="306" width="310" height="142" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <path d="M 350 312 A 6 6 0 0 1 356 306 L 654 306 A 6 6 0 0 1 660 312 L 660 332 L 350 332 Z" fill="#F1F5F9"/>
  <line x1="350" y1="332" x2="660" y2="332" stroke="#CBD5E1" stroke-width="1"/>
  <text x="364" y="324" font-size="10" font-weight="700" fill="#0F172A">Representative Production Cluster Mapping</text>

  <text x="364" y="350" font-size="9" fill="#334155">
    <tspan font-weight="700" fill="#1F407A">Tensor Parallel (t = 8):</tspan>
    <tspan dx="4">8 GPUs per server node (NVLink)</tspan>
  </text>
  <text x="364" y="369" font-size="9" fill="#334155">
    <tspan font-weight="700" fill="#16A34A">Pipeline Parallel (p = 16):</tspan>
    <tspan dx="4">16 pipeline stages across rack spine</tspan>
  </text>
  <text x="364" y="388" font-size="9" fill="#334155">
    <tspan font-weight="700" fill="#D97706">Data Parallel (d = 128):</tspan>
    <tspan dx="4">128 parallel replicas across cluster</tspan>
  </text>

  <rect x="360" y="405" width="290" height="32" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="505" y="418" text-anchor="middle" font-size="8.5" font-weight="600" fill="#166534">Total GPUs: t × p × d = 8 × 16 × 128 = 16,384</text>
  <text x="505" y="430" text-anchor="middle" font-size="8" fill="#15803D">Optimal alignment keeps high-volume traffic on fast NVLink meshes</text>
</svg>