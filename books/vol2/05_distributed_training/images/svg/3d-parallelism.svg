<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#D97706"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#c44"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="1040" height="470" fill="#fff"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ── 2D Logical Layout: 2x2x2 = 8 GPUs ── -->
  <!-- Flattened into nested axes for orthogonal routing -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- ── Data Parallel Axis Arrow ── -->
  <line x1="220" y1="350" x2="560" y2="350" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="390" y="342" font-size="11" font-weight="700" fill="#1F407A" text-anchor="middle">Data Parallel (d)</text>

  <!-- ── Pipeline Parallel Axis Arrow ── -->
  <line x1="40" y1="115" x2="40" y2="265" stroke="#c44" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="25" y="190" font-size="11" font-weight="700" fill="#c44" text-anchor="middle" transform="rotate(-90, 25, 190)">Pipeline Parallel (p)</text>

  <!-- ── Data Parallel Replica 0 ── -->
  <rect x="80" y="50" width="280" height="270" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <!-- Stage 0 -->
  <rect x="100" y="70" width="240" height="90" fill="#F8FAFC" stroke="#bbb" stroke-width="1"/>
  <line x1="160" y1="85" x2="280" y2="85" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="220" y="78" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">Tensor Parallel (t)</text>
  
  <!-- GPU 0 -->
  <rect x="120" y="100" width="80" height="50" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="160" y="120" font-size="10" font-weight="700" fill="#333" text-anchor="middle">GPU 0</text>
  <text x="160" y="136" font-size="9" fill="#555" text-anchor="middle">d=0,t=0,p=0</text>
  
  <!-- GPU 2 -->
  <rect x="240" y="100" width="80" height="50" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="280" y="120" font-size="10" font-weight="700" fill="#333" text-anchor="middle">GPU 2</text>
  <text x="280" y="136" font-size="9" fill="#555" text-anchor="middle">d=0,t=1,p=0</text>

  <!-- Stage 1 -->
  <rect x="100" y="210" width="240" height="90" fill="#F8FAFC" stroke="#bbb" stroke-width="1"/>
  <line x1="160" y1="225" x2="280" y2="225" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="220" y="218" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">Tensor Parallel (t)</text>
  
  <!-- GPU 4 -->
  <rect x="120" y="240" width="80" height="50" fill="#FEE2E2" stroke="#c44" stroke-width="1.2"/>
  <text x="160" y="270" font-size="10" font-weight="700" fill="#333" text-anchor="middle">GPU 4</text>
  <text x="160" y="286" font-size="9" fill="#555" text-anchor="middle">d=0,t=0,p=1</text>
  
  <!-- GPU 6 -->
  <rect x="240" y="240" width="80" height="50" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="280" y="270" font-size="10" font-weight="700" fill="#333" text-anchor="middle">GPU 6</text>
  <text x="280" y="286" font-size="9" fill="#555" text-anchor="middle">d=0,t=1,p=1</text>


  <!-- ── Data Parallel Replica 1 ── -->
  <rect x="420" y="50" width="280" height="270" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Stage 0 -->
  <rect x="440" y="70" width="240" height="90" fill="#F8FAFC" stroke="#bbb" stroke-width="1"/>
  <line x1="500" y1="85" x2="620" y2="85" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="560" y="78" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">Tensor Parallel (t)</text>
  
  <!-- GPU 1 -->
  <rect x="460" y="100" width="80" height="50" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="500" y="120" font-size="10" font-weight="700" fill="#333" text-anchor="middle">GPU 1</text>
  <text x="500" y="136" font-size="9" fill="#555" text-anchor="middle">d=1,t=0,p=0</text>
  
  <!-- GPU 3 -->
  <rect x="580" y="100" width="80" height="50" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="620" y="120" font-size="10" font-weight="700" fill="#333" text-anchor="middle">GPU 3</text>
  <text x="620" y="136" font-size="9" fill="#555" text-anchor="middle">d=1,t=1,p=0</text>

  <!-- Stage 1 -->
  <rect x="440" y="210" width="240" height="90" fill="#F8FAFC" stroke="#bbb" stroke-width="1"/>
  <line x1="500" y1="225" x2="620" y2="225" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="560" y="218" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">Tensor Parallel (t)</text>
  
  <!-- GPU 5 -->
  <rect x="460" y="240" width="80" height="50" fill="#FEE2E2" stroke="#c44" stroke-width="1.2"/>
  <text x="500" y="270" font-size="10" font-weight="700" fill="#333" text-anchor="middle">GPU 5</text>
  <text x="500" y="286" font-size="9" fill="#555" text-anchor="middle">d=1,t=0,p=1</text>
  
  <!-- GPU 7 -->
  <rect x="580" y="240" width="80" height="50" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="620" y="270" font-size="10" font-weight="700" fill="#333" text-anchor="middle">GPU 7</text>
  <text x="620" y="286" font-size="9" fill="#555" text-anchor="middle">d=1,t=1,p=1</text>


  <!-- ═══════════════════════════════════════════════ -->
  <!-- ── Right panel: axis descriptions ── -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="740" y="50" width="260" height="200" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Data Parallel -->
  <rect x="750" y="60" width="10" height="10" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="770" y="70" font-size="11" font-weight="700" fill="#1F407A">Data Parallel (d = 2)</text>
  <text x="770" y="84" font-size="9" fill="#555">Replicate model, split batch</text>
  <text x="770" y="96" font-size="9" fill="#555">Sync: AllReduce gradients</text>
  <text x="770" y="108" font-size="9" fill="#555">Interconnect: InfiniBand (inter-node)</text>

  <!-- Pipeline Parallel -->
  <rect x="750" y="120" width="10" height="10" fill="#FEE2E2" stroke="#c44" stroke-width="1"/>
  <text x="770" y="130" font-size="11" font-weight="700" fill="#c44">Pipeline Parallel (p = 2)</text>
  <text x="770" y="144" font-size="9" fill="#555">Partition layers across stages</text>
  <text x="770" y="156" font-size="9" fill="#555">Sync: Point-to-point activations</text>
  <text x="770" y="168" font-size="9" fill="#555">Interconnect: Ethernet sufficient</text>

  <!-- Tensor Parallel -->
  <rect x="750" y="180" width="10" height="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="770" y="190" font-size="11" font-weight="700" fill="#D97706">Tensor Parallel (t = 2)</text>
  <text x="770" y="204" font-size="9" fill="#555">Split layers (column/row)</text>
  <text x="770" y="216" font-size="9" fill="#555">Sync: AllReduce per layer</text>
  <text x="770" y="228" font-size="9" fill="#555">Interconnect: NVLink (intra-node)</text>


  <!-- ═══════════════════════════════════════════════ -->
  <!-- ── Formula box ── -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="740" y="260" width="260" height="52" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="870" y="281" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Total devices = d × p × t</text>
  <text x="870" y="298" font-size="11" fill="#475569" text-anchor="middle">2 × 2 × 2 = 8 GPUs</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ── Placement constraint note ── -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="740" y="324" width="260" height="84" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="870" y="342" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">Hardware Placement Rule</text>
  <text x="752" y="359" font-size="9" fill="#475569">TP within node (NVLink: 600 GB/s)</text>
  <text x="752" y="375" font-size="9" fill="#475569">PP across nodes (IB: 25 GB/s per port)</text>
  <text x="752" y="391" font-size="9" fill="#475569">DP across racks (Ethernet: 12.5 GB/s)</text>

  <!-- ── Bottom annotations (centered below all cards with ample clearance) ── -->
  <text x="520" y="434" font-size="10" fill="#64748b" font-style="italic" text-anchor="middle">Example: 2 DP replicas, each with 2 pipeline stages, each stage split across 2 tensor-parallel GPUs.</text>
  <text x="520" y="450" font-size="10" fill="#64748b" font-style="italic" text-anchor="middle">Production configs (e.g., GPT-4): d = 64, t = 8, p = 16 → 8,192 GPUs.</text>

</svg>
