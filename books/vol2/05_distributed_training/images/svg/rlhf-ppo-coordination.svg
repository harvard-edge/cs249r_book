<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -8 768 426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- One PPO-style RLHF step. Trained models (C1 blue cards) vs. frozen inference-only models (slate cards).
       Each card carries a per-parameter state strip in the W/G/O vocabulary of fig-zero-partitioning:
       tile widths proportional to 2, 2, 12 bytes per parameter; dashed = state the model does not hold.
       No model sizes are implied; the table carries memory totals. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/></marker>
  </defs>
  <rect x="-4" y="-8" width="768" height="426" fill="#ffffff"/>
  <!-- ===== key ===== -->
  <rect x="20" y="16" width="16" height="16" rx="2" fill="#D6EAF8" stroke="#006395" stroke-width="1.2"/>
  <text x="42" y="29" font-size="12" fill="#334155"><tspan font-weight="700">W</tspan> weights</text>
  <rect x="140" y="16" width="16" height="16" rx="2" fill="#BFD8E5" stroke="#006395" stroke-width="1.2"/>
  <text x="162" y="29" font-size="12" fill="#334155"><tspan font-weight="700">G</tspan> gradients</text>
  <rect x="270" y="16" width="16" height="16" rx="2" fill="#80B1CA" stroke="#006395" stroke-width="1.2"/>
  <text x="292" y="29" font-size="12" fill="#334155"><tspan font-weight="700">O</tspan> optimizer state</text>
  <!-- ===== generate ===== -->
  <rect x="20" y="170" width="90" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="65" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Prompts</text>
  <line x1="110" y1="195" x2="128" y2="195" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="130" y="153.0" width="180" height="84" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="220" y="175.0" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Policy π<tspan font-size="12.5" dy="3">θ</tspan></text>
  <text x="220" y="193.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">generates responses</text>
  <rect x="140" y="207.0" width="20" height="18" rx="1" fill="#D6EAF8" stroke="#006395" stroke-width="1"/>
  <text x="150" y="220.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f3b57">W</text>
  <rect x="160" y="207.0" width="20" height="18" rx="1" fill="#BFD8E5" stroke="#006395" stroke-width="1"/>
  <text x="170" y="220.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f3b57">G</text>
  <rect x="180" y="207.0" width="120" height="18" rx="1" fill="#80B1CA" stroke="#006395" stroke-width="1"/>
  <text x="240" y="220.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f3b57">O</text>
  <!-- ===== score ===== -->
  <text x="348" y="186" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">responses</text>
  <line x1="310" y1="195" x2="386" y2="195" stroke="#64748b" stroke-width="1.5"/>
  <path d="M386,85 V305" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="386" y1="85" x2="408" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="386" y1="195" x2="408" y2="195" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="386" y1="305" x2="408" y2="305" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="410" y="43.0" width="180" height="84" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="65.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Reference π<tspan font-size="12.5" dy="3">ref</tspan></text>
  <text x="500" y="83.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">log-probs for KL</text>
  <rect x="420" y="97.0" width="20" height="18" rx="1" fill="#D6EAF8" stroke="#006395" stroke-width="1"/>
  <text x="430.0" y="110.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f3b57">W</text>
  <rect x="440" y="97.0" width="20" height="18" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="450.0" y="110.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">G</text>
  <rect x="460" y="97.0" width="120" height="18" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="520.0" y="110.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">O</text>
  <rect x="410" y="153.0" width="180" height="84" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="175.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Reward model</text>
  <text x="500" y="193.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">scalar score r</text>
  <rect x="420" y="207.0" width="20" height="18" rx="1" fill="#D6EAF8" stroke="#006395" stroke-width="1"/>
  <text x="430.0" y="220.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f3b57">W</text>
  <rect x="440" y="207.0" width="20" height="18" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="450.0" y="220.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">G</text>
  <rect x="460" y="207.0" width="120" height="18" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="520.0" y="220.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#94a3b8">O</text>
  <rect x="410" y="263.0" width="180" height="84" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="500" y="285.0" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Value model V</text>
  <text x="500" y="303.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">value estimates</text>
  <rect x="420" y="317.0" width="20" height="18" rx="1" fill="#D6EAF8" stroke="#006395" stroke-width="1"/>
  <text x="430.0" y="330.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f3b57">W</text>
  <rect x="440" y="317.0" width="20" height="18" rx="1" fill="#BFD8E5" stroke="#006395" stroke-width="1"/>
  <text x="450.0" y="330.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f3b57">G</text>
  <rect x="460" y="317.0" width="120" height="18" rx="1" fill="#80B1CA" stroke="#006395" stroke-width="1"/>
  <text x="520.0" y="330.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f3b57">O</text>
  <!-- ===== advantages ===== -->
  <line x1="590" y1="85" x2="610" y2="85" stroke="#64748b" stroke-width="1.5"/>
  <line x1="590" y1="305" x2="610" y2="305" stroke="#64748b" stroke-width="1.5"/>
  <path d="M610,85 V305" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="590" y1="195" x2="638" y2="195" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="640" y="165" width="100" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690" y="191" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Advantages</text>
  <text x="690" y="209" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">r − β·KL, GAE</text>
  <!-- ===== PPO update (gradients only reach trained models) ===== -->
  <path d="M690,225 V375 H220 V239" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M500,375 V349" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="600" y="393" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1F407A">PPO update: gradients to policy and value</text>
</svg>
