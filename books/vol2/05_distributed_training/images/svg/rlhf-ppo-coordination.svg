<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- One PPO-style RLHF step: four models, trained (C1 blue) vs. frozen inference-only (slate). No invented sizes; the table carries memory. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/></marker>
  </defs>
  <rect width="680" height="312" fill="#ffffff"/>
  <g transform="translate(0,-22)">

  <!-- Prompts -->
  <rect x="20" y="112" width="84" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="62" y="143" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Prompts</text>
  <line x1="104" y1="138" x2="124" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Policy (trained) -->
  <rect x="126" y="112" width="130" height="52" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="191" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Policy π<tspan font-size="11" dy="3">θ</tspan></text>
  <text x="191" y="151" text-anchor="middle" font-size="11.5" fill="#475569">generates responses</text>

  <!-- Responses bus to the three scoring models -->
  <text x="284" y="130" text-anchor="middle" font-size="11" fill="#475569">responses</text>
  <line x1="256" y1="138" x2="312" y2="138" stroke="#64748b" stroke-width="1.5"/>
  <line x1="312" y1="66" x2="312" y2="210" stroke="#64748b" stroke-width="1.5"/>
  <line x1="312" y1="66" x2="338" y2="66" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="312" y1="138" x2="338" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="312" y1="210" x2="338" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Reference (frozen) -->
  <rect x="340" y="40" width="150" height="52" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="415" y="61" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Reference π<tspan font-size="11" dy="3">ref</tspan></text>
  <text x="415" y="79" text-anchor="middle" font-size="11.5" fill="#475569">log-probs for KL</text>

  <!-- Reward (frozen) -->
  <rect x="340" y="112" width="150" height="52" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="415" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Reward model</text>
  <text x="415" y="151" text-anchor="middle" font-size="11.5" fill="#475569">scalar score r</text>

  <!-- Value (trained) -->
  <rect x="340" y="184" width="150" height="52" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="415" y="205" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Value model V</text>
  <text x="415" y="223" text-anchor="middle" font-size="11.5" fill="#475569">value estimates</text>

  <!-- Merge bus to advantages -->
  <line x1="490" y1="66" x2="514" y2="66" stroke="#64748b" stroke-width="1.5"/>
  <line x1="490" y1="138" x2="514" y2="138" stroke="#64748b" stroke-width="1.5"/>
  <line x1="490" y1="210" x2="514" y2="210" stroke="#64748b" stroke-width="1.5"/>
  <line x1="514" y1="66" x2="514" y2="210" stroke="#64748b" stroke-width="1.5"/>
  <line x1="514" y1="138" x2="534" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Advantages -->
  <rect x="536" y="112" width="124" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="598" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Advantages</text>
  <text x="598" y="151" text-anchor="middle" font-size="11.5" fill="#475569">r − β·KL, GAE</text>

  <!-- PPO update back to the two trained models -->
  <path d="M598,164 V272 H191 V166" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="415" y1="272" x2="415" y2="238" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="303" y="290" text-anchor="middle" font-size="11.5" fill="#14294E">PPO update: gradients for policy and value</text>

  <!-- Legend -->
  <rect x="150" y="310" width="18" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="176" y="321" font-size="11.5" fill="#475569">trained: gradients and optimizer state</text>
  <rect x="410" y="310" width="18" height="14" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="436" y="321" font-size="11.5" fill="#475569">frozen: forward passes only</text>
  </g>
</svg>
