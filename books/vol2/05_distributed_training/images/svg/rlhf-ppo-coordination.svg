<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="780" height="490" fill="#ffffff"/>

  <!-- ==================== TOP ORCHESTRATION DIAGRAM ==================== -->

  <!-- Prompt Source (far left) -->
  <g transform="translate(15, 60)">
    <rect width="52" height="36" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <text x="26" y="17" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Prompt</text>
    <text x="26" y="29" font-size="7.5" fill="#64748B" text-anchor="middle">Dataset x</text>
  </g>
  <line x1="67" y1="78" x2="80" y2="78" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Model 1: Policy Model (Actor) -->
  <g transform="translate(85, 20)">
    <rect width="200" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 194 0 A 6 6 0 0 1 200 6 L 200 24 L 0 24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="200" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1F407A">Policy Model π_θ (Actor)</text>
    <rect x="136" y="5" width="56" height="14" rx="2" fill="#1F407A"/>
    <text x="164" y="15" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">TRAIN MODE</text>

    <text x="12" y="42" font-size="8.5" fill="#334155">70B parameters · Active Backprop</text>
    <text x="12" y="56" font-size="8" fill="#64748B">Weights (FP16) + Gradients + Adam State</text>
    <text x="12" y="70" font-size="8" fill="#64748B">Sample completions: y ~ π_θ(· | x)</text>

    <rect x="12" y="80" width="176" height="18" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
    <text x="100" y="93" font-size="8" font-weight="700" fill="#1F407A" text-anchor="middle">VRAM: ~1,120 GB (16 bytes / param)</text>
  </g>

  <!-- Model 2: Reference Model (Frozen Baseline) -->
  <g transform="translate(495, 20)">
    <rect width="200" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 194 0 A 6 6 0 0 1 200 6 L 200 24 L 0 24 Z" fill="#F1F5F9"/>
    <line x1="0" y1="24" x2="200" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#334155">Reference Model π_ref</text>
    <rect x="136" y="5" width="56" height="14" rx="2" fill="#64748B"/>
    <text x="164" y="15" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">INFERENCE</text>

    <text x="12" y="42" font-size="8.5" fill="#334155">70B parameters · Frozen SFT weights</text>
    <text x="12" y="56" font-size="8" fill="#64748B">FP16 weights only · Zero gradient state</text>
    <text x="12" y="70" font-size="8" fill="#64748B">Evaluates baseline token log-probs</text>

    <rect x="12" y="80" width="176" height="18" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="100" y="93" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">VRAM: ~140 GB (2 bytes / param)</text>
  </g>

  <!-- Model 3: Value Model (Critic) -->
  <g transform="translate(85, 160)">
    <rect width="200" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 194 0 A 6 6 0 0 1 200 6 L 200 24 L 0 24 Z" fill="#FEF3C7"/>
    <line x1="0" y1="24" x2="200" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#92400E">Value Model V_ϕ (Critic)</text>
    <rect x="136" y="5" width="56" height="14" rx="2" fill="#D97706"/>
    <text x="164" y="15" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">TRAIN MODE</text>

    <text x="12" y="42" font-size="8.5" fill="#334155">13B parameters · Active Critic</text>
    <text x="12" y="56" font-size="8" fill="#64748B">Estimates expected return V(s)</text>
    <text x="12" y="70" font-size="8" fill="#64748B">Computes GAE advantage Â_t</text>

    <rect x="12" y="80" width="176" height="18" rx="3" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
    <text x="100" y="93" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle">VRAM: ~208 GB (16 bytes / param)</text>
  </g>

  <!-- Model 4: Reward Model (RM) -->
  <g transform="translate(495, 160)">
    <rect width="200" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 194 0 A 6 6 0 0 1 200 6 L 200 24 L 0 24 Z" fill="#DCFCE7"/>
    <line x1="0" y1="24" x2="200" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#166534">Reward Model R_ψ</text>
    <rect x="136" y="5" width="56" height="14" rx="2" fill="#16A34A"/>
    <text x="164" y="15" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">INFERENCE</text>

    <text x="12" y="42" font-size="8.5" fill="#334155">13B parameters · Frozen Scorer</text>
    <text x="12" y="56" font-size="8" fill="#64748B">Scores prompt-response pair (x, y)</text>
    <text x="12" y="70" font-size="8" fill="#64748B">Produces scalar preference score r</text>

    <rect x="12" y="80" width="176" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
    <text x="100" y="93" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">VRAM: ~26 GB (2 bytes / param)</text>
  </g>

  <!-- ==================== FLOW CONNECTORS IN CENTER ==================== -->
  <!-- Policy -> Reference (KL Divergence flow) -->
  <line x1="285" y1="58" x2="495" y2="58" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <rect x="330" y="44" width="120" height="24" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="390" y="56" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">KL Divergence Check</text>
  <text x="390" y="65" font-size="7" fill="#B91C1C" text-anchor="middle">D_KL(π_θ || π_ref)</text>

  <!-- Policy -> Reward Model (Completions) -->
  <path d="M 285 85 L 390 85 L 390 200 L 495 200" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="335" y="125" width="110" height="20" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="390" y="138" font-size="7.5" font-weight="600" fill="#334155" text-anchor="middle">Completions (x, y)</text>

  <!-- Reward Model -> Value Model (Scalar Reward) -->
  <path d="M 495 220 L 390 220 L 390 230 L 285 230" fill="none" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <rect x="340" y="215" width="100" height="20" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="390" y="228" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">Reward r_penalized</text>

  <!-- Value Model -> Policy (Advantage Â) -->
  <line x1="185" y1="160" x2="185" y2="130" stroke="#D97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
  <rect x="190" y="137" width="80" height="18" rx="2" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="230" y="149" font-size="7.5" font-weight="700" fill="#92400E" text-anchor="middle">Advantage Â_t</text>

  <!-- ==================== BOTTOM COMPARISON CARDS ==================== -->
  <!-- Card 1: PPO Memory & Scaling Overhead -->
  <g transform="translate(25, 305)">
    <rect width="355" height="165" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 349 0 A 6 6 0 0 1 355 6 L 355 26 L 0 26 Z" fill="#EAF1F8"/>
    <line x1="0" y1="26" x2="355" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#1F407A">PPO Cluster Resource Requirements</text>

    <text x="14" y="46" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#1F407A">Total Multi-Model Memory:</tspan>
      <tspan dx="4">~1,494 GB VRAM (params only)</tspan>
    </text>
    <text x="14" y="62" font-size="8.5" fill="#64748B">Policy (1,120 GB) + Ref (140 GB) + Critic (208 GB) + RM (26 GB)</text>

    <text x="14" y="82" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#0F172A">GPU Cluster Footprint:</tspan>
      <tspan dx="4">64–128× H100 (80 GB) GPUs</tspan>
    </text>
    <text x="14" y="98" font-size="8.5" fill="#64748B">Requires 3D Parallelism or ZeRO-3 across models to fit memory.</text>

    <rect x="12" y="112" width="331" height="40" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="20" y="126" font-size="8.5" font-weight="600" fill="#991B1B">Generative Phase Mismatch:</text>
    <text x="20" y="140" font-size="8" fill="#7F1D1D">Generation is memory-BW bound; PPO update is compute bound → low MFU</text>
  </g>

  <!-- Card 2: DPO Efficiency Comparison -->
  <g transform="translate(400, 305)">
    <rect width="355" height="165" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 349 0 A 6 6 0 0 1 355 6 L 355 26 L 0 26 Z" fill="#DCFCE7"/>
    <line x1="0" y1="26" x2="355" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#166534">DPO Alternative: Simplified Topology</text>

    <text x="14" y="46" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#166534">Direct Preference Optimization:</tspan>
      <tspan dx="4">Eliminates RM &amp; Critic</tspan>
    </text>
    <text x="14" y="62" font-size="8.5" fill="#64748B">Optimizes policy directly from pairwise preference pairs (y_w ≻ y_l).</text>

    <text x="14" y="82" font-size="9" fill="#334155">
      <tspan font-weight="700" fill="#0F172A">Reduced Memory Footprint:</tspan>
      <tspan dx="4">~1,260 GB (~48% reduction)</tspan>
    </text>
    <text x="14" y="98" font-size="8.5" fill="#64748B">Requires only Policy (training) and Reference (frozen) models in memory.</text>

    <rect x="12" y="112" width="331" height="40" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="20" y="126" font-size="8.5" font-weight="600" fill="#166534">Operational Simplicity:</text>
    <text x="20" y="140" font-size="8" fill="#14532D">No online generation or reward modeling during training; stable BCE loss</text>
  </g>
</svg>