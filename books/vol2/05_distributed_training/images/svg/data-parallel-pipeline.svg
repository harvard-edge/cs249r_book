  <!-- ── Bubble (idle) cells ── -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Fill-phase bubbles -->
  <rect x="100" y="150" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  
  <rect x="100" y="230" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="150" y="230" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  
  <rect x="100" y="310" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="150" y="310" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="200" y="310" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>

  <!-- Mid/drain bubbles -->
