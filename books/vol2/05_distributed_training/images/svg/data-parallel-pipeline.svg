  <line x1="90" y1="390" x2="660" y2="390" stroke="#475569" stroke-width="1.2"/>

  <!-- ── Axis titles ── -->
  <text x="25" y="210" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90,25,210)">Pipeline Stage (GPU)</text>
  <text x="370" y="428" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">Time Step</text>

  <!-- ── Y-axis labels ── -->
