  <rect x="300" y="70" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="350" y="70" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="400" y="70" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="450" y="70" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="500" y="70" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="550" y="70" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>

  <!-- Stage 1: t=6..9 (4 slots) -->
  <rect x="350" y="150" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="400" y="150" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="450" y="150" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="500" y="150" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>

  <!-- Stage 2: t=7..8 (2 slots) -->
  <rect x="400" y="230" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>
  <rect x="450" y="230" width="40" height="40" fill="url(#bubble-hatch)" stroke="#bbb" stroke-width="1"/>

  <!-- ── Legend & Formula Card ── -->
  <g transform="translate(90, 440)">
    <rect width="570" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Forward -->
    <rect x="15" y="10" width="16" height="16" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="37" y="22" font-size="8.5" font-weight="600" fill="#14294E">Forward (F)</text>

    <!-- Backward -->
    <rect x="120" y="10" width="16" height="16" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="142" y="22" font-size="8.5" font-weight="600" fill="#b45309">Backward (B)</text>

    <!-- Bubble -->
    <rect x="235" y="10" width="16" height="16" rx="2" fill="url(#bubble-hatch)" stroke="#94a3b8" stroke-width="1"/>
    <text x="257" y="22" font-size="8.5" font-weight="600" fill="#475569">Bubble (idle)</text>

    <!-- Bubble overhead chip -->
    <rect x="355" y="7" width="205" height="22" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="457" y="21.5" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Bubble fraction: (p−1)/m = 75%</text>
  </g>
</svg>