<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="680" height="296" fill="#ffffff"/>

  <!-- ===== Registry: every model and its recorded edges ===== -->
  <rect x="20" y="20" width="640" height="256" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <path d="M20.5,46 H659.5" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="38" font-size="11.5" font-weight="700" fill="#0f172a">Model registry: recorded edges</text>

  <!-- ===== Traversal depth from the changed model ===== -->
  <text x="95" y="68" text-anchor="middle" font-size="11.2" fill="#475569">hop 0</text>
  <text x="250" y="68" text-anchor="middle" font-size="11.2" fill="#475569">hop 1</text>
  <text x="400" y="68" text-anchor="middle" font-size="11.2" fill="#475569">hop 2</text>
  <text x="562" y="68" text-anchor="middle" font-size="11.2" fill="#475569">hop 3</text>

  <!-- ===== Impact set reached by the traversal ===== -->
  <rect x="180" y="78" width="466" height="184" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="632" y="250" text-anchor="end" font-size="11.5" font-weight="700" fill="#6d28d9">impact set: re-evaluate before release</text>

  <!-- ===== Changed model ===== -->
  <rect x="40" y="124" width="110" height="52" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="95" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Embedding <tspan font-style="italic">E</tspan></text>
  <text x="95" y="163" text-anchor="middle" font-size="11.5" fill="#6d28d9">v3.1 → v3.2</text>

  <!-- ===== Model with no recorded edge from E ===== -->
  <path d="M95,176 V210" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="1.5,3"/>
  <text x="104" y="197" font-size="11.2" fill="#64748b">unrecorded?</text>
  <rect x="40" y="212" width="110" height="44" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="95" y="231" text-anchor="middle" font-size="11.5" fill="#334155">Fraud model <tspan font-style="italic">F</tspan></text>
  <text x="95" y="247" text-anchor="middle" font-size="11.2" fill="#64748b">not flagged</text>

  <!-- ===== Traversal along recorded edges ===== -->
  <path d="M150,150 H198" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <path d="M300,150 H325" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M325,105 V195" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="325" cy="150" r="2.5" fill="#7c3aed"/>
  <path d="M325,105 H348" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M325,150 H348" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M325,195 H348" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <path d="M450,105 H480" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M450,150 H480" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M450,195 H480" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M480,105 V195" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="480" cy="150" r="2.5" fill="#7c3aed"/>
  <path d="M480,150 H508" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- ===== Flagged downstream models ===== -->
  <rect x="200" y="132" width="100" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="250" y="154" text-anchor="middle" font-size="11.5" fill="#14294E">Retrieval <tspan font-style="italic">R</tspan></text>

  <rect x="350" y="87" width="100" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="400" y="109" text-anchor="middle" font-size="11.5" fill="#14294E">Ranker <tspan font-style="italic">K</tspan><tspan font-size="11.2" dy="3">1</tspan></text>
  <rect x="350" y="132" width="100" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="400" y="154" text-anchor="middle" font-size="11.5" fill="#14294E">Ranker <tspan font-style="italic">K</tspan><tspan font-size="11.2" dy="3">2</tspan></text>
  <rect x="350" y="177" width="100" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="400" y="199" text-anchor="middle" font-size="11.5" fill="#14294E">Ranker <tspan font-style="italic">K</tspan><tspan font-size="11.2" dy="3">3</tspan></text>

  <rect x="510" y="132" width="104" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="562" y="154" text-anchor="middle" font-size="11.5" fill="#14294E">Ensemble <tspan font-style="italic">M</tspan></text>
</svg>
