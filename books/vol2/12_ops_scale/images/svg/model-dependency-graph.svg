<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 640 218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="640" height="250" fill="#ffffff"/>

  <!-- ===== Impact set found by traversing downstream edges ===== -->
  <rect x="176" y="36" width="444" height="196" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="188" y="54" font-size="11.5" font-weight="700" fill="#6d28d9">Impact set: re-evaluate before release</text>

  <!-- ===== Upstream model with a version change ===== -->
  <rect x="30" y="64" width="110" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="85" y="79" text-anchor="middle" font-size="11.5" fill="#6d28d9">version bump</text>
  <rect x="30" y="110" width="110" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="85" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Embedding <tspan font-style="italic">E</tspan></text>
  <text x="85" y="145" text-anchor="middle" font-size="11.5" fill="#14294E">v3.1 → v3.2</text>
  <path d="M85,86 V110" stroke="#7c3aed" stroke-width="1"/>

  <!-- ===== Unrelated model: no edge from E ===== -->
  <rect x="30" y="190" width="110" height="34" rx="2" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="85" y="211" text-anchor="middle" font-size="11.5" fill="#475569">Fraud model <tspan font-style="italic">F</tspan></text>

  <!-- ===== Downstream consumers ===== -->
  <path d="M140,132 H198" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="200" y="112" width="100" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="250" y="136" text-anchor="middle" font-size="11.5" fill="#14294E">Retrieval <tspan font-style="italic">R</tspan></text>

  <path d="M300,132 H322" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M322,85 V179" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M322,85 H348" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M322,132 H348" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M322,179 H348" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="350" y="68" width="100" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="400" y="88" text-anchor="middle" font-size="11.5" fill="#14294E">Ranker <tspan font-style="italic">K</tspan><tspan font-size="10.5" dy="3">1</tspan></text>
  <rect x="350" y="115" width="100" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="400" y="135" text-anchor="middle" font-size="11.5" fill="#14294E">Ranker <tspan font-style="italic">K</tspan><tspan font-size="10.5" dy="3">2</tspan></text>
  <rect x="350" y="162" width="100" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="400" y="182" text-anchor="middle" font-size="11.5" fill="#14294E">Ranker <tspan font-style="italic">K</tspan><tspan font-size="10.5" dy="3">3</tspan></text>

  <path d="M450,85 H472" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M450,132 H472" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M450,179 H472" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M472,85 V179" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M472,132 H498" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="500" y="112" width="104" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="552" y="136" text-anchor="middle" font-size="11.5" fill="#14294E">Ensemble <tspan font-style="italic">M</tspan></text>
</svg>
