<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%">
  <rect width="680" height="340" fill="#ffffff"/>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- ==================== Top Upstream Model ==================== -->
  <g transform="translate(195, 25)">
    <rect width="210" height="64" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
    <rect width="210" height="22" rx="4" fill="#DCE7F3"/>
    <text x="105" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#1F407A">ROOT PRODUCER NODE</text>
    <text x="105" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">User Embedding v3.2</text>
    <text x="105" y="52" text-anchor="middle" font-size="8.5" fill="#1E3A8A">Shared latent feature representation</text>
  </g>

  <!-- Update / Impact Callout -->
  <g transform="translate(435, 25)">
    <rect width="195" height="64" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
    <rect width="195" height="22" rx="4" fill="#FED7D7"/>
    <text x="97.5" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#991B1B">LINEAGE AUDIT GATE</text>
    <text x="97.5" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">Version Bump Trigger</text>
    <text x="97.5" y="52" text-anchor="middle" font-size="8" fill="#7F1D1D">Requires re-evaluating 3 dependents</text>
  </g>
  <line x1="405" y1="57" x2="435" y2="57" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- ==================== Downstream Arrows ==================== -->
  <line x1="250" y1="89" x2="145" y2="152" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="89" x2="340" y2="152" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <line x1="350" y1="89" x2="535" y2="152" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>

  <!-- ==================== Layer 1 Downstream Consumers ==================== -->
  <!-- Retrieval Model -->
  <g transform="translate(50, 155)">
    <rect width="190" height="68" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
    <rect width="190" height="20" rx="4" fill="#FDE68A"/>
    <text x="95" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">DOWNSTREAM CONSUMER 1</text>
    <text x="95" y="37" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">Retrieval Model</text>
    <text x="95" y="51" text-anchor="middle" font-size="8" fill="#78350F">ANN vector index lookup</text>
    <text x="95" y="62" text-anchor="middle" font-size="7.5" font-weight="600" fill="#92400E">Top-1000 candidates</text>
  </g>

  <!-- Ranking Model -->
  <g transform="translate(245, 155)">
    <rect width="190" height="68" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
    <rect width="190" height="20" rx="4" fill="#FDE68A"/>
    <text x="95" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">DOWNSTREAM CONSUMER 2</text>
    <text x="95" y="37" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">Ranking Model</text>
    <text x="95" y="51" text-anchor="middle" font-size="8" fill="#78350F">Deep cross-attention scoring</text>
    <text x="95" y="62" text-anchor="middle" font-size="7.5" font-weight="600" fill="#92400E">Re-ranks top candidates</text>
  </g>

  <!-- Ensemble Model -->
  <g transform="translate(440, 155)">
    <rect width="190" height="68" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
    <rect width="190" height="20" rx="4" fill="#FDE68A"/>
    <text x="95" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">DOWNSTREAM CONSUMER 3</text>
    <text x="95" y="37" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">Ensemble Model</text>
    <text x="95" y="51" text-anchor="middle" font-size="8" fill="#78350F">Blends CTR &amp; conversion models</text>
    <text x="95" y="62" text-anchor="middle" font-size="7.5" font-weight="600" fill="#92400E">Multi-objective calibration</text>
  </g>

  <!-- ==================== Arrows to Final Stage ==================== -->
  <line x1="145" y1="223" x2="280" y2="265" stroke="#D97706" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>
  <line x1="340" y1="223" x2="340" y2="265" stroke="#D97706" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>
  <line x1="535" y1="223" x2="400" y2="265" stroke="#D97706" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>

  <!-- ==================== Final Endpoint ==================== -->
  <g transform="translate(225, 268)">
    <rect width="230" height="54" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
    <rect width="230" height="18" rx="4" fill="#BBF7D0"/>
    <text x="115" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">PRODUCTION SERVING ENDPOINT</text>
    <text x="115" y="33" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">Final Ranked Recommendation Stream</text>
    <text x="115" y="46" text-anchor="middle" font-size="8" fill="#15803D">p99 &lt; 15 ms · Live production serving traffic</text>
  </g>
</svg>
