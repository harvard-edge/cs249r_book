<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-slate-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="690" height="320" fill="#ffffff"/>

  <!-- ===== Panel A: Shadow deployment ===== -->
  <text x="16" y="24" font-size="12.5" font-weight="700" fill="#0f172a">A<tspan dx="6">Shadow deployment</tspan></text>

  <rect x="16" y="68" width="84" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="58" y="90" text-anchor="middle" font-size="11.5" fill="#0f172a">Live traffic</text>
  <path d="M100,86 H126" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <rect x="128" y="60" width="100" height="52" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="178" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Traffic proxy</text>
  <text x="178" y="98" text-anchor="middle" font-size="11.5" fill="#b45309">mirror</text>

  <!-- proxy to production (all traffic) -->
  <path d="M228,74 H240 V56 H278" fill="none" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <text x="259" y="50" text-anchor="middle" font-size="11.5" fill="#14294E">100%</text>
  <!-- proxy to shadow (copy) -->
  <path d="M228,98 H240 V116 H278" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="259" y="110" text-anchor="middle" font-size="11.5" fill="#64748b">copy</text>

  <rect x="280" y="38" width="136" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="348" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Production v1</text>
  <rect x="280" y="98" width="136" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="348" y="120" text-anchor="middle" font-size="11.5" fill="#14294E">Candidate v2 (shadow)</text>

  <path d="M416,56 H442" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <path d="M416,116 H442" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <rect x="444" y="38" width="94" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="491" y="60" text-anchor="middle" font-size="11.5" fill="#0f172a">User response</text>
  <rect x="444" y="98" width="94" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="491" y="113" text-anchor="middle" font-size="11.5" fill="#475569">Logged,</text>
  <text x="491" y="127" text-anchor="middle" font-size="11.5" fill="#475569">not returned</text>

  <!-- both outputs to offline comparison -->
  <path d="M538,56 H550 V78 H564" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-violet)"/>
  <path d="M538,116 H550 V94 H564" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-violet)"/>
  <rect x="566" y="60" width="110" height="52" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="621" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Offline diff</text>
  <text x="621" y="98" text-anchor="middle" font-size="11.5" fill="#6d28d9">outputs, latency</text>

  <!-- divider -->
  <path d="M16,160 H674" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== Panel B: Canary deployment ===== -->
  <text x="16" y="190" font-size="12.5" font-weight="700" fill="#0f172a">B<tspan dx="6">Canary deployment</tspan></text>

  <rect x="16" y="234" width="84" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="58" y="256" text-anchor="middle" font-size="11.5" fill="#0f172a">Live traffic</text>
  <path d="M100,252 H126" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <rect x="128" y="226" width="100" height="52" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="178" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Traffic splitter</text>
  <text x="178" y="264" text-anchor="middle" font-size="11.5" fill="#b45309">weighted</text>

  <path d="M228,240 H240 V222 H278" fill="none" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <text x="259" y="216" text-anchor="middle" font-size="11.5" fill="#14294E">95%</text>
  <path d="M228,264 H240 V282 H278" fill="none" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <text x="259" y="276" text-anchor="middle" font-size="11.5" fill="#14294E">5%</text>

  <rect x="280" y="204" width="136" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="348" y="226" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Production v1</text>
  <rect x="280" y="264" width="136" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="348" y="286" text-anchor="middle" font-size="11.5" fill="#14294E">Candidate v2 (canary)</text>

  <!-- staged widening of the canary share -->
  <text x="446" y="212" font-size="11.5" fill="#475569">Canary share, widened by stage</text>
  <path d="M458,236 H642" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M630,236 H644" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate-sm)"/>
  <circle cx="458" cy="236" r="4.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="502" cy="236" r="5.5" fill="#1F407A" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="546" cy="236" r="4.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="590" cy="236" r="4.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <circle cx="630" cy="236" r="4.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="458" y="256" text-anchor="middle" font-size="11.5" fill="#475569">1%</text>
  <text x="502" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">5%</text>
  <text x="546" y="256" text-anchor="middle" font-size="11.5" fill="#475569">25%</text>
  <text x="590" y="256" text-anchor="middle" font-size="11.5" fill="#475569">50%</text>
  <text x="630" y="256" text-anchor="middle" font-size="11.5" fill="#475569">100%</text>

  <rect x="446" y="270" width="228" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="560" y="286" text-anchor="middle" font-size="11.5" fill="#b91c1c">roll back if SLO or error metrics drift</text>
</svg>
