<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 375" width="100%" height="100%">
  <defs>
    <marker id="prod-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="shadow-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="canary-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="traffic-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="alert-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="680" height="375" fill="#ffffff"/>

  <!-- ==================== Panel A: Shadow Deployment ==================== -->
  <g transform="translate(0, 5)">
    <!-- Panel Header Badge -->
    <rect x="30" y="10" width="230" height="22" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="145" y="24" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F407A">A · Shadow Deployment (Mirroring)</text>

    <!-- Production Traffic -->
    <rect x="30" y="46" width="95" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="77.5" y="63" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Live Traffic</text>
    <text x="77.5" y="77" text-anchor="middle" font-size="8.5" fill="#64748B">Production stream</text>

    <!-- Arrow: Traffic -> LB -->
    <line x1="125" y1="67" x2="165" y2="67" stroke="#475569" stroke-width="1.3" marker-end="url(#traffic-arr)"/>
    <text x="145" y="61" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">100%</text>

    <!-- Load Balancer / Request Duplicator -->
    <rect x="165" y="40" width="85" height="74" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
    <text x="207.5" y="65" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309">Traffic Proxy</text>
    <text x="207.5" y="80" text-anchor="middle" font-size="8.5" fill="#78350F">Fork / Mirror</text>
    <text x="207.5" y="95" text-anchor="middle" font-size="7.5" font-weight="600" fill="#92400E">Dual dispatch</text>

    <!-- Production Model -->
    <rect x="290" y="38" width="135" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.3"/>
    <text x="357.5" y="52" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F407A">Production Model</text>
    <text x="357.5" y="65" text-anchor="middle" font-size="8" fill="#1E3A8A">v1.3 (Active serving)</text>

    <!-- Arrow: LB -> Production -->
    <line x1="250" y1="56" x2="290" y2="56" stroke="#1F407A" stroke-width="1.3" marker-end="url(#prod-arr)"/>
    <text x="270" y="50" text-anchor="middle" font-size="8.5" fill="#1F407A" font-weight="600">100%</text>

    <!-- Shadow Model -->
    <rect x="290" y="82" width="135" height="36" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="357.5" y="96" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">Shadow Model</text>
    <text x="357.5" y="109" text-anchor="middle" font-size="8" fill="#64748B">v2.0 (Silent candidate)</text>

    <!-- Arrow: LB -> Shadow -->
    <line x1="250" y1="100" x2="290" y2="100" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#shadow-arr)"/>
    <text x="270" y="94" text-anchor="middle" font-size="8.5" fill="#64748B">copy</text>

    <!-- User Response -->
    <rect x="465" y="38" width="85" height="36" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.3"/>
    <text x="507.5" y="52" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">User Client</text>
    <text x="507.5" y="65" text-anchor="middle" font-size="8" fill="#15803D">Returned result</text>

    <!-- Arrow: Production -> User -->
    <line x1="425" y1="56" x2="465" y2="56" stroke="#1F407A" stroke-width="1.3" marker-end="url(#prod-arr)"/>

    <!-- Discarded -->
    <rect x="465" y="82" width="85" height="36" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
    <text x="507.5" y="96" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">Response Sink</text>
    <text x="507.5" y="109" text-anchor="middle" font-size="8" fill="#7F1D1D">Discarded (0 user risk)</text>

    <!-- Arrow: Shadow -> Discarded -->
    <line x1="425" y1="100" x2="465" y2="100" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#shadow-arr)"/>

    <!-- Quality Comparison -->
    <rect x="580" y="40" width="85" height="74" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
    <text x="622.5" y="62" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B45309">Offline Diff</text>
    <text x="622.5" y="76" text-anchor="middle" font-size="8" fill="#78350F">v1.3 vs v2.0</text>
    <text x="622.5" y="90" text-anchor="middle" font-size="7.5" fill="#92400E">Latency &amp; drift</text>
    <text x="622.5" y="102" text-anchor="middle" font-size="7.5" font-weight="600" fill="#B45309">No impact to SLA</text>

    <!-- Lines to Comparison -->
    <line x1="550" y1="56" x2="580" y2="56" stroke="#D97706" stroke-width="1.2"/>
    <line x1="550" y1="100" x2="580" y2="100" stroke="#D97706" stroke-width="1.2"/>

    <!-- Operational summary strip -->
    <rect x="30" y="126" width="635" height="22" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="40" y="141" font-size="8" font-weight="700" fill="#1F407A">Operational Tradeoff:</text>
    <text x="150" y="141" font-size="8" fill="#475569">Zero production risk · 2× inference compute footprint · Evaluates output correctness without user feedback loop</text>
  </g>

  <!-- ==================== Divider ==================== -->
  <line x1="30" y1="184" x2="665" y2="184" stroke="#CBD5E1" stroke-width="1"/>

  <!-- ==================== Panel B: Canary Deployment ==================== -->
  <g transform="translate(0, 192)">
    <!-- Panel Header Badge -->
    <rect x="30" y="8" width="230" height="22" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
    <text x="145" y="22" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">B · Canary Deployment (Phased Rollout)</text>

    <!-- Production Traffic -->
    <rect x="30" y="44" width="95" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="77.5" y="61" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Live Traffic</text>
    <text x="77.5" y="75" text-anchor="middle" font-size="8.5" fill="#64748B">Production stream</text>

    <!-- Traffic Splitter -->
    <rect x="165" y="38" width="85" height="74" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
    <text x="207.5" y="63" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309">Traffic Splitter</text>
    <text x="207.5" y="78" text-anchor="middle" font-size="8.5" fill="#78350F">Weighted Router</text>
    <text x="207.5" y="93" text-anchor="middle" font-size="7.5" font-weight="600" fill="#92400E">Dynamic weighting</text>

    <!-- Arrow: Traffic -> Splitter -->
    <line x1="125" y1="65" x2="165" y2="65" stroke="#475569" stroke-width="1.3" marker-end="url(#traffic-arr)"/>

    <!-- Current Model -->
    <rect x="290" y="36" width="135" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.3"/>
    <text x="357.5" y="50" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F407A">Current Model</text>
    <text x="357.5" y="63" text-anchor="middle" font-size="8" fill="#1E3A8A">v1.3 (Baseline stable)</text>

    <!-- Canary Model -->
    <rect x="290" y="80" width="135" height="36" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.3"/>
    <text x="357.5" y="94" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">Canary Model</text>
    <text x="357.5" y="107" text-anchor="middle" font-size="8" fill="#15803D">v2.0 (Active candidate)</text>

    <!-- Arrow: Splitter -> Current -->
    <line x1="250" y1="54" x2="290" y2="54" stroke="#1F407A" stroke-width="1.3" marker-end="url(#prod-arr)"/>
    <text x="270" y="48" text-anchor="middle" font-size="8.5" fill="#1F407A" font-weight="700">95%</text>

    <!-- Arrow: Splitter -> Canary -->
    <line x1="250" y1="98" x2="290" y2="98" stroke="#16A34A" stroke-width="1.3" marker-end="url(#canary-arr)"/>
    <text x="270" y="92" text-anchor="middle" font-size="8.5" fill="#16A34A" font-weight="700">5%</text>

    <!-- Canary Progression Timeline Box -->
    <rect x="455" y="36" width="210" height="80" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="465" y="52" font-size="8.5" font-weight="700" fill="#0F172A">Canary Traffic Shift Schedule</text>

    <!-- Timeline markers -->
    <text x="475" y="68" text-anchor="middle" font-size="7.5" fill="#64748B">t=0</text>
    <text x="510" y="68" text-anchor="middle" font-size="7.5" fill="#64748B">+1h</text>
    <text x="545" y="68" text-anchor="middle" font-size="7.5" fill="#64748B">+6h</text>
    <text x="585" y="68" text-anchor="middle" font-size="7.5" fill="#64748B">+24h</text>
    <text x="635" y="68" text-anchor="middle" font-size="7.5" fill="#64748B">+48h</text>

    <line x1="475" y1="76" x2="635" y2="76" stroke="#94A3B8" stroke-width="1.3"/>

    <circle cx="475" cy="76" r="3.5" fill="#16A34A"/>
    <circle cx="510" cy="76" r="3.5" fill="#16A34A"/>
    <circle cx="545" cy="76" r="3.5" fill="#16A34A"/>
    <circle cx="585" cy="76" r="3.5" fill="#16A34A"/>
    <circle cx="635" cy="76" r="4" fill="#16A34A" stroke="#0F172A" stroke-width="1"/>

    <text x="475" y="90" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">5%</text>
    <text x="510" y="90" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">10%</text>
    <text x="545" y="90" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">25%</text>
    <text x="585" y="90" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">50%</text>
    <text x="635" y="90" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">100%</text>

    <!-- Automated rollback pill -->
    <rect x="495" y="97" width="130" height="15" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8"/>
    <text x="560" y="108" text-anchor="middle" font-size="7" font-weight="700" fill="#DC2626">Auto-rollback if SLO / error drifts</text>

    <!-- Operational summary strip -->
    <rect x="30" y="126" width="635" height="22" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="40" y="141" font-size="8" font-weight="700" fill="#166534">Operational Tradeoff:</text>
    <text x="150" y="141" font-size="8" fill="#475569">Real user feedback signal · Blast radius bounded to slice · Requires automated health gating and instant rollback</text>
  </g>
</svg>