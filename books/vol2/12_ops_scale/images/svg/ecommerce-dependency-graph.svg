<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="640" height="404" fill="#ffffff"/>

  <!-- ===== Layer labels ===== -->
  <text x="16" y="43" font-size="11.5" fill="#64748b">Sources</text>
  <text x="16" y="123" font-size="11.5" fill="#64748b">Embeddings</text>
  <text x="16" y="223" font-size="11.5" fill="#64748b">Mid-tier</text>
  <text x="16" y="303" font-size="11.5" fill="#64748b">Ranking</text>
  <text x="16" y="379" font-size="11.5" fill="#64748b">Rules</text>

  <!-- ===== Sources ===== -->
  <rect x="150" y="16" width="200" height="46" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="250" y="35" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">User behavior logs</text>
  <text x="250" y="52" text-anchor="middle" font-size="11.5" fill="#15803d">clicks, sessions</text>
  <rect x="400" y="16" width="200" height="46" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="500" y="35" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Product catalog</text>
  <text x="500" y="52" text-anchor="middle" font-size="11.5" fill="#15803d">titles, attributes</text>
  <path d="M250,62 V94" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <path d="M500,62 V94" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>

  <!-- ===== Embeddings ===== -->
  <rect x="150" y="96" width="200" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="250" y="115" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">User embedding</text>
  <text x="250" y="132" text-anchor="middle" font-size="11.5" fill="#14294E">behavior history</text>
  <rect x="400" y="96" width="200" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Product embedding</text>
  <text x="500" y="132" text-anchor="middle" font-size="11.5" fill="#14294E">item vectors</text>

  <!-- ===== Shared bus: every embedding feeds both mid-tier models ===== -->
  <path d="M250,142 V168" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M500,142 V168" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M250,168 H500" stroke="#1F407A" stroke-width="1.5"/>
  <circle cx="250" cy="168" r="3" fill="#1F407A"/>
  <circle cx="500" cy="168" r="3" fill="#1F407A"/>
  <path d="M250,168 V194" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M500,168 V194" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ===== Mid-tier models ===== -->
  <rect x="150" y="196" width="200" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="250" y="215" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Candidate retrieval</text>
  <text x="250" y="232" text-anchor="middle" font-size="11.5" fill="#14294E">nearest-neighbor search</text>
  <rect x="400" y="196" width="200" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="500" y="215" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Price sensitivity</text>
  <text x="500" y="232" text-anchor="middle" font-size="11.5" fill="#14294E">willingness to pay</text>

  <!-- ===== Merge into ranking ===== -->
  <path d="M250,242 V258 H500 V242" fill="none" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M375,258 V274" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="265" y="276" width="220" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="375" y="295" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Ranking model</text>
  <text x="375" y="312" text-anchor="middle" font-size="11.5" fill="#14294E">pCTR × pBuy</text>

  <!-- ===== Business rules ===== -->
  <path d="M375,322 V350" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="265" y="352" width="220" height="46" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="375" y="371" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Business rules</text>
  <text x="375" y="388" text-anchor="middle" font-size="11.5" fill="#6d28d9">inventory, promotions</text>
</svg>
