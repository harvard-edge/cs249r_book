<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="72pt" viewBox="0 0 180 144" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Exposure window, linear time scale: 120 h (5 d) vs 4 h. Bar length 170 px = 120 h. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#777777" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="180" height="144" fill="#ffffff"/>
  <!-- No alert: 5 d = 120 h -->
  <rect x="5" y="10" width="170" height="44" fill="#5e6b73"/>
  <text x="167" y="37" font-size="15" fill="#ffffff" text-anchor="end">No alert 5 d</text>
  <!-- ratio annotation spanning the gap between the two bar ends -->
  <line x1="13" y1="72" x2="44" y2="72" stroke="#777777" stroke-width="1.6" marker-start="url(#arr)"/>
  <line x1="106" y1="72" x2="174" y2="72" stroke="#777777" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="75" y="78" font-size="16" fill="#333333" text-anchor="middle">30×</text>
  <!-- Alert: 4 h = 170 * 4 / 120 ≈ 5.7 px -->
  <rect x="5" y="90" width="5.7" height="44" fill="#5e6b73"/>
  <text x="18" y="117" font-size="15" fill="#333333">Alert 4 h</text>
  <line x1="0" y1="140" x2="180" y2="140" stroke="#cccccc" stroke-width="1.2"/>
</svg>
