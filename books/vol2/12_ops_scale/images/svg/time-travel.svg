<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
  <rect width="700" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- Region Headings -->
  <rect x="60" y="16" width="280" height="24" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="200" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Past: Observable State (t ≤ 12:00)</text>

  <rect x="375" y="16" width="280" height="24" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="515" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#991B1B">Future: Unobserved Horizon (t &gt; 12:00)</text>

  <!-- Shaded Future Region -->
  <rect x="365" y="48" width="290" height="150" rx="4" fill="#FEE2E2" fill-opacity="0.25"/>

  <!-- Point-in-time boundary marker at t=12:00 -->
  <line x1="365" y1="44" x2="365" y2="210" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Inference Request Pin -->
  <g transform="translate(365, 52)">
    <rect x="-85" y="0" width="170" height="28" rx="4" fill="#1F407A" stroke="#1F407A" stroke-width="1"/>
    <text x="0" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Inference Request (12:00)</text>
    <polygon points="0,34 -6,28 6,28" fill="#1F407A"/>
  </g>

  <!-- Timeline Axis -->
  <line x1="50" y1="125" x2="655" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="129" font-size="10" font-weight="700" fill="#475569">time</text>

  <!-- Ticks & Time Labels -->
  <line x1="60" y1="120" x2="60" y2="130" stroke="#475569" stroke-width="1.5"/>
  <text x="60" y="145" text-anchor="middle" font-size="9" fill="#64748B">00:00</text>

  <line x1="160" y1="120" x2="160" y2="130" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="145" text-anchor="middle" font-size="9" fill="#64748B">04:00</text>

  <line x1="260" y1="120" x2="260" y2="130" stroke="#475569" stroke-width="1.5"/>
  <text x="260" y="145" text-anchor="middle" font-size="9" fill="#64748B">08:00</text>

  <line x1="365" y1="120" x2="365" y2="130" stroke="#1F407A" stroke-width="2"/>
  <text x="365" y="145" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F407A">12:00</text>

  <line x1="470" y1="120" x2="470" y2="130" stroke="#475569" stroke-width="1.5"/>
  <text x="470" y="145" text-anchor="middle" font-size="9" fill="#64748B">16:00</text>

  <line x1="575" y1="120" x2="575" y2="130" stroke="#475569" stroke-width="1.5"/>
  <text x="575" y="145" text-anchor="middle" font-size="9" fill="#64748B">20:00</text>

  <!-- Past Clicks (Observable) -->
  <circle cx="95" cy="125" r="7" fill="#1F407A" stroke="#1F407A" stroke-width="1.5"/>
  <text x="95" y="112" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1F407A">click</text>

  <circle cx="170" cy="125" r="7" fill="#1F407A" stroke="#1F407A" stroke-width="1.5"/>
  <text x="170" y="112" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1F407A">click</text>

  <circle cx="245" cy="125" r="7" fill="#1F407A" stroke="#1F407A" stroke-width="1.5"/>
  <text x="245" y="112" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1F407A">click</text>

  <circle cx="320" cy="125" r="7" fill="#1F407A" stroke="#1F407A" stroke-width="1.5"/>
  <text x="320" y="112" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1F407A">click</text>

  <!-- Past bracket -->
  <line x1="85" y1="162" x2="330" y2="162" stroke="#1F407A" stroke-width="1.2"/>
  <line x1="85" y1="158" x2="85" y2="166" stroke="#1F407A" stroke-width="1.2"/>
  <line x1="330" y1="158" x2="330" y2="166" stroke="#1F407A" stroke-width="1.2"/>
  <text x="207.5" y="176" text-anchor="middle" font-size="9" font-weight="600" fill="#1F407A">4 observed events in causal history</text>

  <!-- Future Clicks (Unobservable) -->
  <circle cx="410" cy="125" r="6.5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="450" cy="125" r="6.5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="490" cy="125" r="6.5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="530" cy="125" r="6.5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="570" cy="125" r="6.5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="610" cy="125" r="6.5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Future bracket -->
  <line x1="395" y1="162" x2="625" y2="162" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="395" y1="158" x2="395" y2="166" stroke="#DC2626" stroke-width="1.2"/>
  <line x1="625" y1="158" x2="625" y2="166" stroke="#DC2626" stroke-width="1.2"/>
  <text x="510" y="176" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">6 future events (unobserved at query time)</text>

  <!-- Connector arrows to result cards -->
  <line x1="207.5" y1="184" x2="207.5" y2="218" stroke="#16A34A" stroke-width="1.3" marker-end="url(#arrow-green)"/>
  <line x1="510" y1="184" x2="510" y2="218" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>

  <!-- ===== Bottom Comparison Cards ===== -->
  <!-- Correct Implementation Card -->
  <g transform="translate(60, 222)">
    <rect width="280" height="96" rx="4" fill="#F8FAFC" stroke="#16A34A" stroke-width="1.2"/>
    <rect width="280" height="24" rx="4" fill="#DCFCE7"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#166534">Point-in-Time Correct (t = 12:00)</text>
    <text x="14" y="42" font-size="8.5" font-weight="600" fill="#0F172A">Feature Value: 4 Clicks</text>
    <text x="14" y="58" font-size="8" fill="#475569">Aggregates only data logged before query timestamp.</text>
    <text x="14" y="74" font-size="8" fill="#475569">Replicates exact inference distribution during offline training.</text>
    <rect x="14" y="81" width="130" height="12" rx="2" fill="#DCFCE7"/>
    <text x="79" y="90" text-anchor="middle" font-size="7" font-weight="700" fill="#166534">Zero Feature Skew</text>
  </g>

  <!-- Wrong Implementation Card -->
  <g transform="translate(375, 222)">
    <rect width="280" height="96" rx="4" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.2"/>
    <rect width="280" height="24" rx="4" fill="#FEE2E2"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#991B1B">Temporal Leakage Hazard</text>
    <text x="14" y="42" font-size="8.5" font-weight="600" fill="#DC2626">Feature Value: 10 Clicks (4 past + 6 future)</text>
    <text x="14" y="58" font-size="8" fill="#475569">Naive SQL joins table without point-in-time snapshot filter.</text>
    <text x="14" y="74" font-size="8" fill="#475569">Offline model overfits on future signals unavailable at inference.</text>
    <rect x="14" y="81" width="130" height="12" rx="2" fill="#FEE2E2"/>
    <text x="79" y="90" text-anchor="middle" font-size="7" font-weight="700" fill="#DC2626">Production Failure Mode</text>
  </g>
</svg>
