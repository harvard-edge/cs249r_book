<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="74pt" viewBox="0 0 180 148" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Canary ramp 1, 5, 25, 50, 100 percent of traffic; linear scale, 110 px = 100 percent. -->
  <rect x="0" y="0" width="180" height="148" fill="#ffffff"/>
  <g fill="#5e6b73">
    <rect x="3" y="137.9" width="30" height="1.1"/>
    <rect x="38" y="133.5" width="30" height="5.5"/>
    <rect x="73" y="111.5" width="30" height="27.5"/>
    <rect x="108" y="84" width="30" height="55"/>
    <rect x="143" y="29" width="30" height="110"/>
  </g>
  <g font-size="13" fill="#333333" text-anchor="middle">
    <text x="18" y="131">1%</text>
    <text x="53" y="127">5%</text>
    <text x="88" y="105">25%</text>
    <text x="123" y="78">50%</text>
    <text x="158" y="23">100%</text>
  </g>
  <line x1="0" y1="139.6" x2="180" y2="139.6" stroke="#cccccc" stroke-width="1.2"/>
</svg>
