<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <rect width="760" height="380" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ===== Chart bounds: x=[80,680], y=[50,330] ===== -->

  <!-- Grid lines (horizontal) -->
  <line x1="80" y1="330" x2="680" y2="330" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="80" y1="274" x2="680" y2="274" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="80" y1="218" x2="680" y2="218" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="80" y1="162" x2="680" y2="162" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="80" y1="106" x2="680" y2="106" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="80" y1="50"  x2="680" y2="50"  stroke="#E2E8F0" stroke-width="0.8"/>

  <!-- Grid lines (vertical - months) -->
  <line x1="80"  y1="50" x2="80"  y2="330" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="200" y1="50" x2="200" y2="330" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="320" y1="50" x2="320" y2="330" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="440" y1="50" x2="440" y2="330" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="560" y1="50" x2="560" y2="330" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="680" y1="50" x2="680" y2="330" stroke="#E2E8F0" stroke-width="0.8"/>

  <!-- Axes -->
  <line x1="70" y1="330" x2="705" y2="330" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="80" y1="340" x2="80"  y2="40"  stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- X-axis labels (months) -->
  <text x="80"  y="348" text-anchor="middle" font-size="9" fill="#64748B">0</text>
  <text x="200" y="348" text-anchor="middle" font-size="9" fill="#64748B">6</text>
  <text x="320" y="348" text-anchor="middle" font-size="9" fill="#64748B">12</text>
  <text x="440" y="348" text-anchor="middle" font-size="9" fill="#64748B">18</text>
  <text x="560" y="348" text-anchor="middle" font-size="9" fill="#64748B">24</text>
  <text x="680" y="348" text-anchor="middle" font-size="9" fill="#64748B">30</text>
  <text x="380" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Cluster Operating Lifetime (Months)</text>

  <!-- Y-axis labels ($M) -->
  <text x="72" y="334" text-anchor="end" font-size="9" fill="#64748B">$0</text>
  <text x="72" y="278" text-anchor="end" font-size="9" fill="#64748B">$20M</text>
  <text x="72" y="222" text-anchor="end" font-size="9" fill="#64748B">$40M</text>
  <text x="72" y="166" text-anchor="end" font-size="9" fill="#64748B">$60M</text>
  <text x="72" y="110" text-anchor="end" font-size="9" fill="#64748B">$80M</text>
  <text x="72" y="54"  text-anchor="end" font-size="9" fill="#64748B">$100M</text>
  <text x="24" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A" transform="rotate(-90 24 190)">Cumulative Cost ($M)</text>

  <!-- ===== Curves & Shaded Areas ===== -->

  <!-- Fill area under cloud curve (starts 0 at month 0, reaches $70M = y=134 at month 30) -->
  <!-- Cost scale: $0 = 330, $100M = 50. Slope = 280px / $100M = 2.8 px/$M. -->
  <!-- Cloud: $2.34M/mo -> Month 30 = $70.2M -> y = 330 - (70.2 * 2.8) = 133.4 -->
  <!-- On-prem: CapEx = $58.8M -> y = 330 - (58.8 * 2.8) = 165.4. OpEx = $0.125M/mo -> Month 30 = $62.55M -> y = 330 - (62.55 * 2.8) = 154.9 -->
  <!-- Break-even intersection: Cloud cost = On-prem cost -> 2.34 * m = 58.8 + 0.125 * m -> 2.215 * m = 58.8 -> m = 26.55 months (~27) -->
  <!-- Intersection x = 80 + (26.55 / 30) * 600 = 80 + 531 = 611 -->
  <!-- Intersection y = 330 - (62.1 * 2.8) = 156 -->

  <polygon points="80,330 680,134 680,330" fill="#FEF3C7" fill-opacity="0.35"/>
  <line x1="80" y1="330" x2="680" y2="134" stroke="#D97706" stroke-width="2.5"/>

  <polygon points="80,330 80,165 680,155 680,330" fill="#EAF1F8" fill-opacity="0.3"/>
  <!-- CapEx vertical jump at t=0 -->
  <line x1="80" y1="330" x2="80" y2="165" stroke="#1F407A" stroke-width="3"/>
  <!-- On-prem OpEx growth -->
  <line x1="80" y1="165" x2="680" y2="155" stroke="#1F407A" stroke-width="2.5"/>

  <!-- ===== CapEx Annotation Callout ===== -->
  <g transform="translate(88, 168)">
    <rect width="145" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="8" y="15" font-size="8.5" font-weight="700" fill="#1F407A">Upfront CapEx: ~$58.8M</text>
    <text x="8" y="28" font-size="7.5" fill="#1E3A8A">1,000 H100s + fabric + facility</text>
  </g>

  <!-- ===== Cloud OpEx Rate Annotation ===== -->
  <g transform="translate(230, 240)">
    <rect width="145" height="36" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <text x="8" y="15" font-size="8.5" font-weight="700" fill="#B45309">Cloud OpEx: ~$2.34M / mo</text>
    <text x="8" y="28" font-size="7.5" fill="#78350F">$4.00/GPU-hr at 80% utilization</text>
  </g>

  <!-- ===== Decision Thresholds Card (Top Left) ===== -->
  <g transform="translate(90, 56)">
    <rect width="200" height="74" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="200" height="20" rx="4" fill="#F1F5F9"/>
    <text x="10" y="14" font-size="8.5" font-weight="700" fill="#0F172A">Utilization Sensitivity</text>
    <text x="10" y="34" font-size="8" fill="#475569"><tspan font-weight="700" fill="#0F172A">&lt;60% util:</tspan> Cloud on-demand strictly cheaper</text>
    <text x="10" y="49" font-size="8" fill="#475569"><tspan font-weight="700" fill="#0F172A">~60% util:</tspan> 3-year break-even threshold</text>
    <text x="10" y="64" font-size="8" fill="#475569"><tspan font-weight="700" fill="#166534">&gt;80% util:</tspan> On-prem breaks even at month ~27</text>
  </g>

  <!-- ===== Legend Cards (Top Center) ===== -->
  <g transform="translate(310, 56)">
    <!-- On-Premises Legend -->
    <rect x="0" y="0" width="155" height="26" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <line x1="10" y1="13" x2="30" y2="13" stroke="#1F407A" stroke-width="3"/>
    <text x="36" y="16" font-size="9" font-weight="700" fill="#1F407A">On-Premises (CapEx)</text>

    <!-- Cloud Legend -->
    <rect x="0" y="32" width="155" height="26" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <line x1="10" y1="45" x2="30" y2="45" stroke="#D97706" stroke-width="3"/>
    <text x="36" y="48" font-size="9" font-weight="700" fill="#B45309">Cloud (On-Demand)</text>
  </g>

  <!-- ===== Break-Even Crossover Callout ===== -->
  <!-- Crossover point marker (Month 26.6, ~$62M) -->
  <g transform="translate(545, 56)">
    <rect width="135" height="42" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
    <text x="67.5" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="#991B1B">TCO Crossover</text>
    <text x="67.5" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#DC2626">Month 27 · ~$62.2M</text>
  </g>

  <!-- Leader line from box to intersection point -->
  <line x1="611" y1="98" x2="611" y2="156" stroke="#DC2626" stroke-width="1.3"/>
  <circle cx="611" cy="156" r="5" fill="#DC2626" stroke="#ffffff" stroke-width="2"/>

  <!-- Dotted projection to X-axis -->
  <line x1="611" y1="156" x2="611" y2="330" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="596" y="316" width="30" height="13" rx="2" fill="#DC2626"/>
  <text x="611" y="326" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">~27</text>

  <!-- Curve End Labels -->
  <text x="686" y="137" font-size="8.5" font-weight="700" fill="#D97706">Cloud: $70.2M</text>
  <text x="686" y="158" font-size="8.5" font-weight="700" fill="#1F407A">On-Prem: $62.6M</text>

</svg>
