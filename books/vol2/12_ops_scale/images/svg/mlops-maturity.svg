<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480">
  <defs>
    <marker id="maturity-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="1120" height="480" fill="#fff"/>

  <!-- Maturity axis arrow -->
  <line x1="50" y1="390" x2="980" y2="390" stroke="#999" stroke-width="1.2" marker-end="url(#maturity-arr)"/>
  <text x="990" y="394" font-size="9" fill="#999" font-weight="600">Operational Maturity</text>

  <!-- Vertical axis label -->
  <text x="20" y="240" text-anchor="middle" font-size="9" fill="#999" font-weight="600" transform="rotate(-90, 20, 240)">Automation &amp; Reliability</text>
  <line x1="50" y1="60" x2="50" y2="390" stroke="#bbb" stroke-width="0.8"/>

  <!-- Level 0: Manual -->
  <g transform="translate(70, 280)">
    <rect x="0" y="0" width="120" height="100" fill="#F8FAFC" stroke="#bbb" stroke-width="1.2"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Level 0</text>
    <text x="60" y="30" text-anchor="middle" font-size="9" fill="#555" font-weight="600">Manual</text>
    <line x1="10" y1="40" x2="110" y2="40" stroke="#bbb" stroke-width="0.8"/>
    <text x="10" y="60" font-size="8" fill="#555">Notebook experiments</text>
    <text x="10" y="70" font-size="8" fill="#555">Manual deployment</text>
    <text x="10" y="80" font-size="8" fill="#555">No version control</text>
    <text x="10" y="90" font-size="8" fill="#c44" font-style="italic">No reproducibility</text>
  </g>

  <!-- Level 1: Reproducible -->
  <g transform="translate(320, 210)">
    <rect x="0" y="0" width="120" height="100" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Level 1</text>
    <text x="60" y="30" text-anchor="middle" font-size="9" fill="#1F407A" font-weight="600">Reproducible</text>
    <line x1="10" y1="40" x2="110" y2="40" stroke="#1F407A" stroke-width="0.8" opacity="0.4"/>
    <text x="10" y="60" font-size="8" fill="#555">Versioned code + data</text>
    <text x="10" y="70" font-size="8" fill="#555">Config-driven training</text>
    <text x="10" y="80" font-size="8" fill="#555">Experiment tracking</text>
    <text x="10" y="90" font-size="8" fill="#555">Manual triggers</text>
  </g>

  <!-- Level 2: Automated -->
  <g transform="translate(570, 140)">
    <rect x="0" y="0" width="120" height="100" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">Level 2</text>
    <text x="60" y="30" text-anchor="middle" font-size="9" fill="#16A34A" font-weight="600">Automated</text>
    <line x1="10" y1="40" x2="110" y2="40" stroke="#16A34A" stroke-width="0.8" opacity="0.4"/>
    <text x="10" y="60" font-size="8" fill="#555">CI/CD for ML</text>
    <text x="10" y="70" font-size="8" fill="#555">Automated testing</text>
    <text x="10" y="80" font-size="8" fill="#555">Canary deployment</text>
    <text x="10" y="90" font-size="8" fill="#555">Model registry</text>
  </g>

  <!-- Level 3: Continuous -->
  <g transform="translate(820, 70)">
    <rect x="0" y="0" width="120" height="100" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#D97706">Level 3</text>
    <text x="60" y="30" text-anchor="middle" font-size="9" fill="#D97706" font-weight="600">Continuous</text>
    <line x1="10" y1="40" x2="110" y2="40" stroke="#D97706" stroke-width="0.8" opacity="0.4"/>
    <text x="10" y="60" font-size="8" fill="#555">Drift-triggered retrain</text>
    <text x="10" y="70" font-size="8" fill="#555">Auto-rollback</text>
    <text x="10" y="80" font-size="8" fill="#555">Fleet-wide observability</text>
    <text x="10" y="90" font-size="8" fill="#555">Self-healing pipelines</text>
  </g>

  <!-- Staircase connector paths -->
  <path d="M 190 330 L 250 330 L 250 260 L 320 260" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 440 260 L 500 260 L 500 190 L 570 190" fill="none" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 690 190 L 750 190 L 750 120 L 820 120" fill="none" stroke="#16A34A" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Transition labels -->
  <text x="250" y="250" text-anchor="middle" font-size="9" fill="#999">version control</text>
  <text x="500" y="180" text-anchor="middle" font-size="9" fill="#999">CI/CD pipelines</text>
  <text x="750" y="110" text-anchor="middle" font-size="9" fill="#999">closed-loop monitoring</text>

  <!-- Industry benchmarks -->
  <rect x="70" y="420" width="880" height="40" fill="#fff" stroke="#DC2626" stroke-width="1.2"/>
  <text x="510" y="436" text-anchor="middle" font-size="9" fill="#DC2626" font-weight="600">Industry reality: most organizations operate at Level 0-1</text>
  <text x="510" y="450" text-anchor="middle" font-size="8.5" fill="#555">Level 3 requires multi-model platform investment; ROI often appears around 20–50 models</text>
</svg>
