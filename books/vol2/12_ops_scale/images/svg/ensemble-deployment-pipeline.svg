<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%">
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- ===== Stage lanes ===== -->
  <!-- Stage 1: Shadow -->
  <g transform="translate(30, 16)">
    <rect width="180" height="280" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="180" height="36" rx="4" fill="#FEF3C7"/>
    <line x1="0" y1="36" x2="180" y2="36" stroke="#FDE68A" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309">1. SHADOW STAGE</text>
    <text x="90" y="30" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">0% user exposure · 24–48 h</text>

    <!-- Traffic Bar -->
    <rect x="15" y="48" width="150" height="18" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="90" y="60.5" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">0% Live Traffic</text>

    <!-- Validation Checks -->
    <g transform="translate(15, 76)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#1E293B">Verification Checks:</text>
      <text x="4" y="27" font-size="8" fill="#475569">Load: Peak concurrency test</text>
      <text x="4" y="42" font-size="8" fill="#475569">Correctness: Ground truth</text>
      <text x="4" y="57" font-size="8" fill="#475569">Memory: Leak / HBM bounds</text>
      <text x="4" y="72" font-size="8" fill="#475569">Latency: Tail SLO compliance</text>
    </g>

    <!-- Rollback trigger -->
    <rect x="15" y="170" width="150" height="42" rx="3" fill="#FEE2E2" stroke="#FECACA" stroke-width="0.8"/>
    <text x="90" y="185" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991B1B">Rollback Trigger:</text>
    <text x="90" y="196" text-anchor="middle" font-size="7.2" fill="#7F1D1D">Quality metric regression</text>
    <text x="90" y="206" text-anchor="middle" font-size="7.2" fill="#7F1D1D">exceeding threshold delta</text>
  </g>

  <!-- Stage 2: Canary -->
  <g transform="translate(245, 16)">
    <rect width="180" height="280" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="180" height="36" rx="4" fill="#FEF3C7"/>
    <line x1="0" y1="36" x2="180" y2="36" stroke="#FDE68A" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309">2. CANARY STAGE</text>
    <text x="90" y="30" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">1–5% traffic · 4–8 h</text>

    <!-- Traffic Bar -->
    <rect x="15" y="48" width="150" height="18" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8"/>
    <rect x="15" y="48" width="12" height="18" rx="2" fill="#FCD34D"/>
    <text x="90" y="60.5" text-anchor="middle" font-size="8" font-weight="600" fill="#B45309">5% Live Traffic</text>

    <!-- Validation Checks -->
    <g transform="translate(15, 76)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#1E293B">Verification Checks:</text>
      <text x="4" y="27" font-size="8" fill="#475569">Audience: Real user telemetry</text>
      <text x="4" y="42" font-size="8" fill="#475569">Errors: 5xx / timeout spike</text>
      <text x="4" y="57" font-size="8" fill="#475569">A/B: Statistical delta</text>
      <text x="4" y="72" font-size="8" fill="#475569">Business: Click / conversion</text>
    </g>

    <!-- Rollback trigger -->
    <rect x="15" y="170" width="150" height="42" rx="3" fill="#FEE2E2" stroke="#FECACA" stroke-width="0.8"/>
    <text x="90" y="185" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991B1B">Rollback Trigger:</text>
    <text x="90" y="196" text-anchor="middle" font-size="7.2" fill="#7F1D1D">Statistically significant</text>
    <text x="90" y="206" text-anchor="middle" font-size="7.2" fill="#7F1D1D">conversion degradation</text>
  </g>

  <!-- Stage 3: Staged Rollout -->
  <g transform="translate(460, 16)">
    <rect width="180" height="280" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="180" height="36" rx="4" fill="#DCFCE7"/>
    <line x1="0" y1="36" x2="180" y2="36" stroke="#86EFAC" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#15803D">3. STAGED ROLLOUT</text>
    <text x="90" y="30" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">5% → 100% · 24–72 h</text>

    <!-- Traffic Bar -->
    <rect x="15" y="48" width="150" height="18" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8"/>
    <rect x="15" y="48" width="75" height="18" rx="2" fill="#86EFAC"/>
    <text x="90" y="60.5" text-anchor="middle" font-size="8" font-weight="600" fill="#15803D">5% → 50% → 100%</text>

    <!-- Validation Checks -->
    <g transform="translate(15, 76)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#1E293B">Verification Checks:</text>
      <text x="4" y="27" font-size="8" fill="#475569">Exposure: Progressive tier</text>
      <text x="4" y="42" font-size="8" fill="#475569">Ensemble: Inter-model drift</text>
      <text x="4" y="57" font-size="8" fill="#475569">Capacity: Headroom bounds</text>
      <text x="4" y="72" font-size="8" fill="#475569">Fabric: Router queue depths</text>
    </g>

    <!-- Rollback trigger -->
    <rect x="15" y="170" width="150" height="42" rx="3" fill="#FEE2E2" stroke="#FECACA" stroke-width="0.8"/>
    <text x="90" y="185" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991B1B">Rollback Trigger:</text>
    <text x="90" y="196" text-anchor="middle" font-size="7.2" fill="#7F1D1D">Latency SLO breach or</text>
    <text x="90" y="206" text-anchor="middle" font-size="7.2" fill="#7F1D1D">ensemble divergence</text>
  </g>

  <!-- Stage 4: Full Production -->
  <g transform="translate(675, 16)">
    <rect width="180" height="280" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="180" height="36" rx="4" fill="#DCFCE7"/>
    <line x1="0" y1="36" x2="180" y2="36" stroke="#86EFAC" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#15803D">4. FULL PRODUCTION</text>
    <text x="90" y="30" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">100% · 7–14 d soak</text>

    <!-- Traffic Bar -->
    <rect x="15" y="48" width="150" height="18" rx="2" fill="#4ADE80" stroke="#16A34A" stroke-width="0.8"/>
    <text x="90" y="60.5" text-anchor="middle" font-size="8" font-weight="700" fill="#065F46">100% Live Traffic</text>

    <!-- Validation Checks -->
    <g transform="translate(15, 76)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#1E293B">Verification Checks:</text>
      <text x="4" y="27" font-size="8" fill="#475569">Dynamics: Delayed feedback</text>
      <text x="4" y="42" font-size="8" fill="#475569">Drift: Concept &amp; data drift</text>
      <text x="4" y="57" font-size="8" fill="#475569">Stability: Multi-day soak</text>
      <text x="4" y="72" font-size="8" fill="#475569">Registry: Mark baseline</text>
    </g>

    <!-- Promotion Gate -->
    <rect x="15" y="170" width="150" height="42" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="90" y="185" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">Promotion Gate:</text>
    <text x="90" y="196" text-anchor="middle" font-size="7.2" fill="#15803D">14-day soak passes</text>
    <text x="90" y="206" text-anchor="middle" font-size="7.2" fill="#15803D">certified model archive</text>
  </g>

  <!-- ===== Gates and Arrows ===== -->
  <!-- Gate 1 -> 2 -->
  <line x1="210" y1="156" x2="245" y2="156" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="215" y="238" width="25" height="18" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="227.5" y="250.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#B45309">G1</text>
  <path d="M 227,238 L 227,216 L 200,216" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Gate 2 -> 3 -->
  <line x1="425" y1="156" x2="460" y2="156" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="430" y="238" width="25" height="18" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="442.5" y="250.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#B45309">G2</text>
  <path d="M 442,238 L 442,216 L 415,216" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Gate 3 -> 4 -->
  <line x1="640" y1="156" x2="675" y2="156" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <rect x="645" y="238" width="25" height="18" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="657.5" y="250.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803D">G3</text>
  <path d="M 657,238 L 657,216 L 630,216" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- ===== Bottom Takeaway Bar ===== -->
  <g transform="translate(30, 312)">
    <rect width="825" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="412" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Automated Safety Policy: Continuous Telemetry Validation &amp; Rollback Gates</text>
    <text x="412" y="34" text-anchor="middle" font-size="7.8" fill="#475569">Multi-model interaction hazards emerge across days; automated circuit breakers trigger rollback without manual intervention.</text>
  </g>
</svg>