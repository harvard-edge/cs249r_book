<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="672" height="266" fill="#ffffff"/>

  <!-- ===== Phase brackets: CI and CT ===== -->
  <text x="138" y="24" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Continuous integration (CI)</text>
  <path d="M16,42 V34 H260 V42" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="402" y="24" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Continuous training (CT)</text>
  <path d="M280,42 V34 H524 V42" fill="none" stroke="#94a3b8" stroke-width="1"/>

  <!-- ===== Row 1: CI and CT stages ===== -->
  <rect x="16" y="56" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="72" y="76" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Commit</text>
  <text x="72" y="93" text-anchor="middle" font-size="11.5" fill="#14294E">code, config</text>
  <path d="M128,80 H146" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <rect x="148" y="56" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="204" y="76" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Unit tests</text>
  <text x="204" y="93" text-anchor="middle" font-size="11.5" fill="#14294E">lint, build</text>
  <path d="M260,80 H278" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <rect x="280" y="56" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="336" y="76" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Data validation</text>
  <text x="336" y="93" text-anchor="middle" font-size="11.5" fill="#14294E">schema, drift</text>
  <path d="M392,80 H410" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <rect x="412" y="56" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="468" y="76" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Training</text>
  <text x="468" y="93" text-anchor="middle" font-size="11.5" fill="#14294E">with tuning</text>
  <path d="M524,80 H542" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <rect x="544" y="56" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="600" y="76" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Evaluate</text>
  <text x="600" y="93" text-anchor="middle" font-size="11.5" fill="#14294E">metrics gate</text>

  <!-- ===== Gate outcomes ===== -->
  <path d="M600,56 V40" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <rect x="548" y="14" width="104" height="24" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="600" y="30" text-anchor="middle" font-size="11.5" fill="#b91c1c">fail: block, alert</text>
  <path d="M600,104 V168" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="608" y="140" font-size="11.5" fill="#15803d">pass</text>

  <!-- ===== Row 2: CD stages (the loop returns right to left) ===== -->
  <rect x="544" y="170" width="112" height="48" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Registry</text>
  <text x="600" y="207" text-anchor="middle" font-size="11.5" fill="#15803d">versioned tag</text>
  <path d="M544,194 H526" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <rect x="412" y="170" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="468" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Staging</text>
  <text x="468" y="207" text-anchor="middle" font-size="11.5" fill="#14294E">integration test</text>
  <path d="M412,194 H394" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <rect x="280" y="170" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="336" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Canary</text>
  <text x="336" y="207" text-anchor="middle" font-size="11.5" fill="#14294E">5% of traffic</text>
  <path d="M280,194 H262" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <rect x="148" y="170" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="204" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Production</text>
  <text x="204" y="207" text-anchor="middle" font-size="11.5" fill="#14294E">100% of traffic</text>
  <path d="M148,194 H130" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <rect x="16" y="170" width="112" height="48" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="72" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Monitoring</text>
  <text x="72" y="207" text-anchor="middle" font-size="11.5" fill="#6d28d9">drift, latency</text>

  <!-- ===== Retraining loop ===== -->
  <path d="M72,170 V138 H336 V106" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="204" y="131" text-anchor="middle" font-size="11.5" fill="#6d28d9">drift prompts validation</text>

  <!-- ===== Phase bracket: CD ===== -->
  <path d="M148,226 V234 H656 V226" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="402" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Continuous deployment (CD)</text>
</svg>
