<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 692 332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="692" height="332" fill="#ffffff"/>
  <g transform="translate(10,8)">

  <!-- ===== Phase brackets: CI and CT ===== -->
  <text x="138" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Continuous integration (CI)</text>
  <path d="M16,40 V32 H260 V40" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="468" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Continuous training (CT)</text>
  <path d="M280,40 V32 H656 V40" fill="none" stroke="#94a3b8" stroke-width="1"/>

  <!-- ===== Row 1: CI and CT stages ===== -->
  <rect x="16" y="50" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="72" y="70" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Commit</text>
  <text x="72" y="87" text-anchor="middle" font-size="11" fill="#14294E">code, config</text>
  <path d="M128,74 H146" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <rect x="148" y="50" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="204" y="70" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Unit tests</text>
  <text x="204" y="87" text-anchor="middle" font-size="11" fill="#14294E">lint, build</text>
  <path d="M260,74 H278" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <rect x="280" y="50" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="336" y="70" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Data validation</text>
  <text x="336" y="87" text-anchor="middle" font-size="11" fill="#14294E">schema, drift</text>
  <path d="M392,74 H410" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <rect x="412" y="50" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="468" y="70" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Training</text>
  <text x="468" y="87" text-anchor="middle" font-size="11" fill="#14294E">with tuning</text>
  <path d="M524,74 H542" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <rect x="544" y="50" width="112" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="600" y="70" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Evaluate</text>
  <text x="600" y="87" text-anchor="middle" font-size="11" fill="#14294E">candidate metrics</text>

  <!-- ===== Metrics gate: the one decision point ===== -->
  <path d="M600,98 V110" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M600,112 L644,146 L600,180 L556,146 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="2.2"/>
  <text x="600" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">metrics</text>
  <text x="600" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">gate</text>
  <path d="M556,146 H520" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="538" y="139" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">fail</text>
  <rect x="404" y="133" width="112" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="460" y="150" text-anchor="middle" font-size="11" fill="#b91c1c">block, alert</text>
  <path d="M600,180 V206" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="608" y="197" font-size="11" font-weight="700" fill="#15803d">pass</text>

  <!-- ===== Row 2: CD stages (the loop returns right to left) ===== -->
  <rect x="544" y="208" width="112" height="58" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="232" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Registry</text>
  <text x="600" y="249" text-anchor="middle" font-size="11" fill="#15803d">versioned tag</text>
  <path d="M544,237 H526" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <rect x="412" y="208" width="112" height="58" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="468" y="232" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Staging</text>
  <text x="468" y="249" text-anchor="middle" font-size="11" fill="#14294E">integration test</text>
  <path d="M412,237 H394" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- Canary: share of live traffic drawn to scale -->
  <rect x="280" y="208" width="112" height="58" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="336" y="226" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Canary</text>
  <text x="336" y="242" text-anchor="middle" font-size="11" fill="#14294E">5% of traffic</text>
  <rect x="292" y="250" width="88" height="7" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="292" y="250" width="4.4" height="7" rx="0" fill="#1F407A"/>
  <path d="M280,237 H262" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- Production: all live traffic -->
  <rect x="148" y="208" width="112" height="58" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="204" y="226" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Production</text>
  <text x="204" y="242" text-anchor="middle" font-size="11" fill="#14294E">100% of traffic</text>
  <rect x="160" y="250" width="88" height="7" rx="0" fill="#1F407A" stroke="#1F407A" stroke-width="0.8"/>
  <path d="M148,237 H130" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <rect x="16" y="208" width="112" height="58" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="72" y="232" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Monitoring</text>
  <text x="72" y="249" text-anchor="middle" font-size="11" fill="#6d28d9">drift, latency</text>

  <!-- ===== Drift loop back to validation ===== -->
  <path d="M72,208 V146 H336 V100" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="204" y="139" text-anchor="middle" font-size="11" fill="#6d28d9">drift prompts validation</text>

  <!-- ===== Phase bracket: CD ===== -->
  <path d="M148,274 V282 H656 V274" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="402" y="300" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Continuous deployment (CD)</text>
  </g>
</svg>
