<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="712" height="262" fill="#ffffff"/>

  <!-- Scale: x = 196 + 300 * B, so B = 0 at 196, 0.5 at 346, 1.0 at 496, 1.5 at 646 -->

  <!-- Threshold and average guides (drawn first, behind bars) -->
  <path d="M496,36 V204" fill="none" stroke="#0f172a" stroke-width="1.4"/>
  <text x="496" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">budget exhausted, B = 1</text>
  <path d="M406,44 V204" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- Row labels: dimension and owner -->
  <text x="18" y="62" font-size="11.5" font-weight="700" fill="#0f172a">Availability</text>
  <text x="18" y="76" font-size="11" fill="#475569">serving owner</text>
  <text x="18" y="102" font-size="11.5" font-weight="700" fill="#0f172a">Latency</text>
  <text x="18" y="116" font-size="11" fill="#475569">serving, platform</text>
  <text x="18" y="142" font-size="11.5" font-weight="700" fill="#0f172a">Freshness</text>
  <text x="18" y="156" font-size="11" fill="#475569">data owner</text>
  <text x="18" y="182" font-size="11.5" font-weight="700" fill="#0f172a">Model quality</text>
  <text x="18" y="196" font-size="11" fill="#475569">model owner</text>

  <!-- Bars: illustrative budget consumption per dimension -->
  <rect x="196" y="56" width="120" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="310" y="71" text-anchor="end" font-size="11" fill="#14294E">0.40</text>
  <rect x="196" y="96" width="180" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="370" y="111" text-anchor="end" font-size="11" fill="#14294E">0.60</text>
  <rect x="196" y="136" width="390" height="22" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="580" y="151" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">1.30</text>
  <rect x="196" y="176" width="150" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="340" y="191" text-anchor="end" font-size="11" fill="#14294E">0.50</text>

  <!-- Verdicts -->
  <text x="596" y="151" font-size="11" font-weight="700" fill="#b91c1c">max: stop</text>
  <text x="596" y="165" font-size="11" font-weight="700" fill="#b91c1c">promotion</text>

  <!-- Axis -->
  <path d="M196,210 H646" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <path d="M196,210 V215 M346,210 V215 M496,210 V215 M646,210 V215" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="196" y="228" text-anchor="middle" font-size="11" fill="#475569">0</text>
  <text x="346" y="228" text-anchor="middle" font-size="11" fill="#475569">0.5</text>
  <text x="496" y="228" text-anchor="middle" font-size="11" fill="#475569">1.0</text>
  <text x="646" y="228" text-anchor="middle" font-size="11" fill="#475569">1.5</text>
  <text x="421" y="250" text-anchor="middle" font-size="11" fill="#475569">budget consumption B (observed violating fraction / allowed fraction)</text>

  <!-- Average label below the guide -->
  <text x="400" y="40" text-anchor="end" font-size="11" fill="#475569">average 0.70 looks healthy</text>
</svg>
