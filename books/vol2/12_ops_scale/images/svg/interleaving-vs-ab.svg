<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="680" height="270" fill="#ffffff"/>

  <!-- ===== Panel A: A/B testing ===== -->
  <text x="16" y="22" font-size="12.5" font-weight="700" fill="#0f172a">A<tspan dx="6">A/B testing</tspan></text>
  <rect x="90" y="36" width="160" height="28" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="170" y="55" text-anchor="middle" font-size="11.5" fill="#0f172a">All users</text>
  <path d="M170,64 V76 H89 V86" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <path d="M170,76 H251 V86" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <rect x="24" y="88" width="130" height="28" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="89" y="107" text-anchor="middle" font-size="11.5" fill="#0f172a">Cohort 1 (50%)</text>
  <rect x="186" y="88" width="130" height="28" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="251" y="107" text-anchor="middle" font-size="11.5" fill="#0f172a">Cohort 2 (50%)</text>

  <rect x="44" y="128" width="90" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.3"/>
  <text x="89" y="143" text-anchor="middle" font-size="11.5" fill="#14294E">A<tspan font-size="8.5" dy="3">1</tspan></text>
  <rect x="44" y="156" width="90" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.3"/>
  <text x="89" y="171" text-anchor="middle" font-size="11.5" fill="#14294E">A<tspan font-size="8.5" dy="3">2</tspan></text>
  <rect x="44" y="184" width="90" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.3"/>
  <text x="89" y="199" text-anchor="middle" font-size="11.5" fill="#14294E">A<tspan font-size="8.5" dy="3">3</tspan></text>

  <rect x="206" y="128" width="90" height="22" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.3"/>
  <text x="251" y="143" text-anchor="middle" font-size="11.5" fill="#334155">B<tspan font-size="8.5" dy="3">1</tspan></text>
  <rect x="206" y="156" width="90" height="22" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.3"/>
  <text x="251" y="171" text-anchor="middle" font-size="11.5" fill="#334155">B<tspan font-size="8.5" dy="3">2</tspan></text>
  <rect x="206" y="184" width="90" height="22" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.3"/>
  <text x="251" y="199" text-anchor="middle" font-size="11.5" fill="#334155">B<tspan font-size="8.5" dy="3">3</tspan></text>

  <text x="89" y="226" text-anchor="middle" font-size="11.5" fill="#64748b">ranker A only</text>
  <text x="251" y="226" text-anchor="middle" font-size="11.5" fill="#64748b">ranker B only</text>
  <text x="170" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">compare the two cohorts' means</text>

  <!-- divider -->
  <path d="M340,16 V258" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== Panel B: Interleaving ===== -->
  <text x="356" y="22" font-size="12.5" font-weight="700" fill="#0f172a">B<tspan dx="6">Interleaving</tspan></text>
  <rect x="430" y="36" width="160" height="28" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="510" y="55" text-anchor="middle" font-size="11.5" fill="#0f172a">Each user</text>
  <path d="M510,64 V86" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <rect x="410" y="88" width="200" height="28" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="510" y="107" text-anchor="middle" font-size="11.5" fill="#0f172a">A and B rank the same query</text>
  <path d="M510,116 V126" stroke="#475569" stroke-width="1.3"/>

  <rect x="465" y="128" width="90" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.3"/>
  <text x="510" y="143" text-anchor="middle" font-size="11.5" fill="#14294E">A<tspan font-size="8.5" dy="3">1</tspan></text>
  <rect x="465" y="156" width="90" height="22" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.3"/>
  <text x="510" y="171" text-anchor="middle" font-size="11.5" fill="#334155">B<tspan font-size="8.5" dy="3">1</tspan></text>
  <rect x="465" y="184" width="90" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.3"/>
  <text x="510" y="199" text-anchor="middle" font-size="11.5" fill="#14294E">A<tspan font-size="8.5" dy="3">2</tspan></text>
  <rect x="465" y="212" width="90" height="22" rx="2" fill="#e5e7eb" stroke="#475569" stroke-width="1.3"/>
  <text x="510" y="227" text-anchor="middle" font-size="11.5" fill="#334155">B<tspan font-size="8.5" dy="3">2</tspan></text>

  <path d="M565,128 H572 V234 H565" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="580" y="178" font-size="11.5" fill="#64748b">one merged</text>
  <text x="580" y="193" font-size="11.5" fill="#64748b">list</text>
  <text x="510" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">credit each click to its source ranker</text>
</svg>
