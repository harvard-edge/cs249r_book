<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="326" fill="#ffffff"/>

  <!-- ===== Tiers: one hue, darker toward the few fleet-level alarms ===== -->
  <polygon points="210,16 390,16 423,76 177,76" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.3"/>
  <polygon points="174,82 426,82 463,148 137,148" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.3"/>
  <polygon points="134,154 466,154 506,226 94,226" fill="#f7f2ff" stroke="#7c3aed" stroke-width="1.3"/>
  <polygon points="91,232 509,232 555,316 45,316" fill="#fbf8ff" stroke="#7c3aed" stroke-width="1.3"/>

  <text x="300" y="42" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">Business metrics</text>
  <text x="300" y="61" text-anchor="middle" font-size="11.5" fill="#5b21b6">revenue · conversion · engagement</text>

  <text x="300" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">Portfolio metrics</text>
  <text x="300" y="127" text-anchor="middle" font-size="11.5" fill="#5b21b6">engagement lift · fraud caught · appeal rate</text>

  <text x="300" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">Model metrics</text>
  <text x="300" y="201" text-anchor="middle" font-size="11.5" fill="#5b21b6">task quality · latency · drift · saturation</text>

  <text x="300" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">Infrastructure metrics</text>
  <text x="300" y="279" text-anchor="middle" font-size="11.5" fill="#5b21b6">accelerator utilization · feature store latency</text>
  <text x="300" y="296" text-anchor="middle" font-size="11.5" fill="#5b21b6">serving health · network · storage · pipelines</text>

  <!-- ===== Owners ===== -->
  <text x="578" y="24" font-size="11.5" font-weight="700" fill="#334155">Owner</text>
  <path d="M412,46 H570" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="578" y="50" font-size="11.5" fill="#0f172a">Incident lead</text>
  <path d="M450,115 H570" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="578" y="119" font-size="11.5" fill="#0f172a">Domain teams</text>
  <path d="M492,190 H570" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="578" y="194" font-size="11.5" fill="#0f172a">Model owners</text>
  <path d="M538,274 H570" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="578" y="278" font-size="11.5" fill="#0f172a">Platform team</text>

  <!-- ===== Scope axis ===== -->
  <path d="M26,316 V22" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
