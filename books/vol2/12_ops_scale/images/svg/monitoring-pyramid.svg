<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" width="100%" height="100%">
  <rect width="680" height="336" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- ===== Pyramid construction: trapezoids from top to bottom ===== -->
  <!-- Layer 4 (top): Business metrics — red accent -->
  <polygon points="275,20 405,20 435,76 245,76" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.3"/>

  <!-- Layer 3: Portfolio metrics — amber -->
  <polygon points="245,80 435,80 475,146 205,146" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>

  <!-- Layer 2: Model Metrics — green -->
  <polygon points="205,150 475,150 525,226 155,226" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.3"/>

  <!-- Layer 1 (base): Infrastructure Metrics — blue -->
  <polygon points="155,230 525,230 580,316 100,316" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.3"/>

  <!-- ===== Layer labels (centered in each band) ===== -->
  <!-- Layer 4 label -->
  <text x="340" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">Business Metrics</text>
  <text x="340" y="58" text-anchor="middle" font-size="8" fill="#6d28d9">Revenue · conversion · engagement</text>

  <!-- Layer 3 label -->
  <text x="340" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309">Portfolio Metrics</text>
  <text x="340" y="118" text-anchor="middle" font-size="8" fill="#78350F">Engagement lift · fraud caught · appeal rate</text>
  <text x="340" y="132" text-anchor="middle" font-size="7.5" font-weight="600" fill="#92400E">Scope: Domain Teams</text>

  <!-- Layer 2 label -->
  <text x="340" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#15803D">Model Metrics</text>
  <text x="340" y="192" text-anchor="middle" font-size="8" fill="#166534">Task quality · latency distribution · drift · serving saturation</text>
  <text x="340" y="206" text-anchor="middle" font-size="7.5" font-weight="600" fill="#14532D">Scope: Model Owners</text>

  <!-- Layer 1 label -->
  <text x="340" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Infrastructure Metrics</text>
  <text x="340" y="273" text-anchor="middle" font-size="8" fill="#1E3A8A">GPU cluster utilization · feature store latency · pipeline time</text>
  <text x="340" y="287" text-anchor="middle" font-size="8" fill="#1E3A8A">Serving health · networking · storage</text>
  <text x="340" y="301" text-anchor="middle" font-size="7.5" font-weight="600" fill="#172554">Scope: Platform Team</text>

  <!-- ===== Vertical axis arrow ===== -->
  <line x1="68" y1="316" x2="68" y2="20" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="54" y="168" text-anchor="middle" font-size="8.5" fill="#64748B" font-weight="700" transform="rotate(-90, 54, 168)">Impairment Scope (component → fleet)</text>

  <!-- ===== Right side: audience annotations ===== -->
  <!-- Layer 4 annotation -->
  <line x1="436" y1="48" x2="480" y2="48" stroke="#7c3aed" stroke-width="1.0" stroke-dasharray="3,2"/>
  <rect x="482" y="37" width="90" height="22" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="527" y="52" text-anchor="middle" font-size="8" font-weight="700" fill="#5b21b6">Incident Lead</text>

  <!-- Layer 3 annotation -->
  <line x1="476" y1="113" x2="510" y2="113" stroke="#D97706" stroke-width="1.0" stroke-dasharray="3,2"/>
  <rect x="512" y="102" width="115" height="22" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="569.5" y="117" text-anchor="middle" font-size="8" fill="#B45309" font-weight="700">Domain Teams</text>

  <!-- Layer 2 annotation -->
  <line x1="526" y1="188" x2="550" y2="188" stroke="#16A34A" stroke-width="1.0" stroke-dasharray="3,2"/>
  <rect x="552" y="177" width="105" height="22" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="604.5" y="192" text-anchor="middle" font-size="8" fill="#15803D" font-weight="700">Model Owners</text>

  <!-- Layer 1 annotation -->
  <line x1="581" y1="273" x2="598" y2="273" stroke="#1F407A" stroke-width="1.0" stroke-dasharray="3,2"/>
  <rect x="600" y="262" width="74" height="22" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="637" y="277" text-anchor="middle" font-size="8" fill="#1F407A" font-weight="700">Platform Team</text>

</svg>

