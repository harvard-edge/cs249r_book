<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 410" width="100%" height="100%">
  <rect width="740" height="410" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- ===== Feature Definitions (single source of truth at top) ===== -->
  <g transform="translate(240, 15)">
    <rect width="260" height="52" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text x="130" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309">Feature Definitions (SSOT)</text>
    <text x="130" y="34" text-anchor="middle" font-size="8" font-weight="600" fill="#78350F">Single source of truth repository</text>
    <text x="130" y="45" text-anchor="middle" font-size="7.5" fill="#92400E">schema · transformation code · freshness SLOs</text>
  </g>

  <!-- ===== Offline Store (left, blue, large) ===== -->
  <g transform="translate(45, 95)">
    <rect width="225" height="175" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="225" height="28" rx="4" fill="#EAF1F8"/>
    <line x1="0" y1="28" x2="225" y2="28" stroke="#CBD5E1" stroke-width="1"/>
    <text x="112.5" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Offline Store (Batch / Train)</text>

    <!-- Sub-box -->
    <rect x="12" y="38" width="201" height="125" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
    <text x="22" y="55" font-size="8.5" font-weight="700" fill="#1F407A">Storage Engines:</text>
    <text x="22" y="70" font-size="8" fill="#334155">BigQuery / Snowflake / Iceberg / S3</text>
    <line x1="22" y1="78" x2="203" y2="78" stroke="#F1F5F9" stroke-width="0.8"/>
    <text x="22" y="93" font-size="8.5" font-weight="700" fill="#1F407A">Operating Profile:</text>
    <text x="22" y="108" font-size="7.8" fill="#475569">Scale: Petabyte historical snapshots</text>
    <text x="22" y="122" font-size="7.8" fill="#475569">Throughput: Multi-GB/s parallel scans</text>
    <text x="22" y="136" font-size="7.8" fill="#475569">Latency: Minutes–hours (batch jobs)</text>
    <text x="22" y="150" font-size="7.8" font-weight="600" fill="#1F407A">Point-in-time join correctness</text>
  </g>

  <!-- ===== Materialization Pipeline (center, orange) ===== -->
  <g transform="translate(305, 115)">
    <rect width="130" height="135" rx="4" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <rect width="130" height="24" rx="4" fill="#FEF3C7"/>
    <line x1="0" y1="24" x2="130" y2="24" stroke="#FDE68A" stroke-width="1"/>
    <text x="65" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#B45309">Materialization</text>

    <!-- Pipeline items -->
    <text x="12" y="44" font-size="7.5" font-weight="700" fill="#78350F">Ingestion Modes:</text>
    <text x="12" y="58" font-size="7.5" fill="#475569">Batch: Spark daily</text>
    <text x="12" y="72" font-size="7.5" fill="#475569">Stream: Flink / Kafka</text>
    <text x="12" y="86" font-size="7.5" fill="#475569">On-demand: Gateway</text>
    
    <rect x="8" y="98" width="114" height="26" rx="2" fill="#FEF3C7"/>
    <text x="65" y="110" text-anchor="middle" font-size="7" font-weight="700" fill="#92400E">Enforces Invariant:</text>
    <text x="65" y="120" text-anchor="middle" font-size="7" fill="#78350F">Train = Serve Parity</text>
  </g>

  <!-- ===== Online Store (right, green) ===== -->
  <g transform="translate(470, 95)">
    <rect width="225" height="175" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="225" height="28" rx="4" fill="#DCFCE7"/>
    <line x1="0" y1="28" x2="225" y2="28" stroke="#CBD5E1" stroke-width="1"/>
    <text x="112.5" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#15803D">Online Store (Inference / Serve)</text>

    <!-- Sub-box -->
    <rect x="12" y="38" width="201" height="125" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
    <text x="22" y="55" font-size="8.5" font-weight="700" fill="#15803D">Storage Engines:</text>
    <text x="22" y="70" font-size="8" fill="#334155">Redis / DynamoDB / Bigtable</text>
    <line x1="22" y1="78" x2="203" y2="78" stroke="#F1F5F9" stroke-width="0.8"/>
    <text x="22" y="93" font-size="8.5" font-weight="700" fill="#15803D">Operating Profile:</text>
    <text x="22" y="108" font-size="7.8" fill="#475569">Paradigm: Key-value point lookups</text>
    <text x="22" y="122" font-size="7.8" fill="#475569">Throughput: 100K+ queries/sec</text>
    <text x="22" y="136" font-size="7.8" fill="#475569">Latency: &lt; 5 ms p99 retrieval</text>
    <text x="22" y="150" font-size="7.8" font-weight="600" fill="#15803D">Freshness SLO &lt; 60 seconds</text>
  </g>

  <!-- ===== Arrows from Feature Definitions to both stores ===== -->
  <path d="M 290,67 L 290,82 L 157,82 L 157,95" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 450,67 L 450,82 L 582,82 L 582,95" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrow-orange)"/>
  <line x1="370" y1="67" x2="370" y2="115" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow-orange)"/>

  <!-- ===== Materialization arrows: Offline → Pipeline and Pipeline → Online ===== -->
  <line x1="270" y1="182" x2="305" y2="182" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="435" y1="182" x2="470" y2="182" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="287" y="174" text-anchor="middle" font-size="7" font-weight="600" fill="#1F407A">batch read</text>
  <text x="452" y="174" text-anchor="middle" font-size="7" font-weight="600" fill="#16A34A">sync write</text>

  <!-- ===== Training pipeline reads from Offline ===== -->
  <g transform="translate(45, 290)">
    <rect width="225" height="46" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="112.5" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A">Training Pipeline</text>
    <text x="112.5" y="32" text-anchor="middle" font-size="7.5" fill="#64748B">Bulk Parquet scan · point-in-time joins</text>
  </g>
  <line x1="157" y1="270" x2="157" y2="290" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

  <!-- ===== Serving pipeline reads from Online ===== -->
  <g transform="translate(470, 290)">
    <rect width="225" height="46" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="112.5" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A">Serving Pipeline</text>
    <text x="112.5" y="32" text-anchor="middle" font-size="7.5" fill="#64748B">Online inference request · &lt; 5 ms fetch</text>
  </g>
  <line x1="582" y1="270" x2="582" y2="290" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arrow-green)"/>

  <!-- ===== Invariant label in center ===== -->
  <g transform="translate(285, 295)">
    <rect width="170" height="34" rx="3" fill="#ffffff" stroke="#DC2626" stroke-width="1.2"/>
    <text x="85" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#DC2626">Architectural Invariant:</text>
    <text x="85" y="27" text-anchor="middle" font-size="7.5" font-style="italic" fill="#0F172A">training feature ≡ serving feature</text>
  </g>

  <!-- ===== Bottom Takeaway Bar ===== -->
  <g transform="translate(45, 350)">
    <rect width="650" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="325" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">No Single Engine Satisfies Both Bulk Throughput and Sub-Millisecond P99 Latency</text>
    <text x="325" y="30" text-anchor="middle" font-size="7.5" fill="#475569">Dual-store architecture makes training-serving feature skew an impossibility by construction.</text>
  </g>
</svg>
