<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="680" height="250" fill="#ffffff"/>

  <!-- ===== Shared feature definitions ===== -->
  <rect x="160" y="16" width="140" height="40" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="230" y="33" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Feature definitions</text>
  <text x="230" y="48" text-anchor="middle" font-size="11.5" fill="#6d28d9">schema, transforms</text>
  <path d="M230,56 V78" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>

  <!-- ===== Sources ===== -->
  <rect x="20" y="96" width="100" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="118" text-anchor="middle" font-size="11.5" fill="#0f172a">Batch data</text>
  <rect x="20" y="176" width="100" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="198" text-anchor="middle" font-size="11.5" fill="#0f172a">Event streams</text>
  <path d="M120,114 H158" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <path d="M120,194 H158" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <!-- ===== Materialization ===== -->
  <rect x="160" y="80" width="140" height="146" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="230" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Materialization</text>
  <path d="M176,114 H284" stroke="#86efac" stroke-width="1"/>
  <text x="230" y="140" text-anchor="middle" font-size="11.5" fill="#15803d">batch</text>
  <text x="230" y="164" text-anchor="middle" font-size="11.5" fill="#15803d">streaming</text>
  <text x="230" y="188" text-anchor="middle" font-size="11.5" fill="#15803d">on-demand</text>

  <!-- ===== Dual stores ===== -->
  <path d="M300,103 H338" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M300,203 H338" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="340" y="80" width="150" height="46" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="415" y="99" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Offline store</text>
  <text x="415" y="115" text-anchor="middle" font-size="11.5" fill="#15803d">full history, scans</text>
  <rect x="340" y="180" width="150" height="46" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="415" y="199" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Online store</text>
  <text x="415" y="215" text-anchor="middle" font-size="11.5" fill="#15803d">latest values, key-value</text>

  <!-- ===== Consumers ===== -->
  <path d="M490,103 H528" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M490,203 H528" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="530" y="80" width="130" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="595" y="99" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Training</text>
  <text x="595" y="115" text-anchor="middle" font-size="11.5" fill="#14294E">point-in-time joins</text>
  <rect x="530" y="180" width="130" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="595" y="199" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Serving</text>
  <text x="595" y="215" text-anchor="middle" font-size="11.5" fill="#14294E">point lookups</text>

</svg>
