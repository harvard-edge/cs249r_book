    - id: vol2.field.37
      source: vol2.operations.evaluation-contract
      predicate: sets acceptance criteria for
      target: vol2.operations.rollout
      explanation: Rollout acceptance must evaluate the actual deployed pipeline against a versioned task
        and evidence contract.
      conditions: Offline model accuracy alone does not establish the deployed service contract.
      status: draft
      evidence:
        section: sec-ops-scale-end-to-end-evaluation-contract
        quote: Shadow runs, experiments, canary stages, and regional waves each produce release evidence,
          yet a candidate that passes offline accuracy on one dataset, passes latency benchmarks on a lighter
          synthetic load profile, and enters an online A/B test without a tested rollback target remains
          unverified as a whole. Those checks never evaluated the same release state. Evidence from different
          stages is useful only when it refers to the same candidate and decision. An **evaluation contract**\index{Evaluation
          contract!definition} is the versioned release record that binds a model and its dependencies to
          the workload, metrics, statistical design, acceptance thresholds, rollback conditions, and accountable
          owners. This record is the subject of the evaluation contract principle (\ref{pri-evaluation-contract}),
          one of the fleet-in-production principles listed in the opener to this part of the book. It holds
          that a fleet release decision is valid only when all of its evidence refers to one versioned contract.
          The record therefore becomes the unit of validity for everything this chapter has built, from
          registry versions and feature contracts to rollout stages and experiment statistics. @Tbl-ops-scale-evaluation-contract
          assembles that record across five evidence planes.
    - id: vol2.field.38
      source: vol2.operations.evaluation-contract
      predicate: supplies evidence to
      target: vol2.governance.assurance
      explanation: An assurance case ties deployment claims to evidence and controls under a declared intended
        use.
      conditions: Evidence is bounded by the tested population, environment, and material-change policy.
      status: draft
      evidence:
        section: sec-ops-scale-end-to-end-evaluation-contract
        quote: Acceptance is deliberately distributed, but promotion authority is not ambiguous. The model
          and domain owners accept predictive utility; the serving owner accepts capacity and reliability;
          specialist risk owners accept bounded robustness, fairness, privacy, and safety claims. A named
          release authority promotes only when all required sign-offs refer to the same artifact. The platform
          automates gates and preserves evidence, but it cannot choose the product objective or waive a
          failed assurance claim.
    - id: vol2.field.41
      source: vol2.robustness.shift
      predicate: can invalidate evidence for
      target: vol2.operations.evaluation-contract
      explanation: A shifted operational distribution may invalidate reference performance evidence and
        trigger evaluation.
      conditions: Detected input drift is evidence to investigate; it does not alone prove predictive degradation.
      status: draft
      evidence:
        section: sec-ops-scale-end-to-end-evaluation-contract
        quote: 'Invalidation is the return path through the contract. Drift beyond the evaluated population,
          a feature or label-definition change, exhausted latency headroom, a statistically supported guardrail
          regression, or a material governance change sends the candidate back to the owning gate. Thresholds
          and rollback targets are fixed before exposure so an apparent primary-metric gain cannot redefine
          success after the result is known. Reproducibility requires retaining the inputs to that decision,
          not merely its verdict: the dataset and traffic snapshot, model and code versions, environment
          and hardware envelope, random seeds, assignment and sampling rules, sufficient statistics or permitted
          logs, approvals, and the exact rollback artifact.'
    - id: vol2.field.61
      source: vol2.operations.evaluation-contract
      predicate: sets acceptance conditions for
      target: vol2.serving.slo-goodput
      explanation: Release acceptance includes production-equivalent capacity and reliability evidence for
        the same candidate, workload, and thresholds. Serving SLO goodput is interpretable only under that
        fixed serving contract.
      conditions: The serving workload and latency targets must be those named by the release contract;
