    - id: vol2.field.12
      source: vol2.storage.versioned-artifact
      predicate: preserves provenance for
      target: vol2.operations.registry
      explanation: Registry records identify artifacts and their provenance for dependency and release decisions.
      conditions: Identity and provenance do not by themselves establish behavioral correctness.
      status: draft
      evidence:
        section: sec-ml-operations-scale-model-registries-scale-ccba
        quote: Without explicit dependency tracking, organizations discover architectural coupling through
          production outages when an upstream change silently corrupts downstream assumptions. A single
          YAML entry captures artifact location, training provenance, evaluation results, and declared dependencies
          (@lst-registry-schema). The downstream entries seed impact analysis; following their registry
          records reveals transitive consumers. Release approval additionally requires confirming that the
          update preserves the input-output contract expected by those consumers, or scheduling a coordinated
          rollout while retaining a validated rollback target.
    - id: vol2.field.36
      source: vol2.operations.registry
      predicate: enables dependency checks for
      target: vol2.operations.rollout
      explanation: Recorded consumers support impact analysis, compatible release ordering, and validated
        rollback targets.
      conditions: Registry entries must be current and compatibility must be tested rather than inferred
        from a link.
      status: draft
      evidence:
        section: sec-ml-operations-scale-model-registries-scale-ccba
        quote: Without explicit dependency tracking, organizations discover architectural coupling through
          production outages when an upstream change silently corrupts downstream assumptions. A single
          YAML entry captures artifact location, training provenance, evaluation results, and declared dependencies
          (@lst-registry-schema). The downstream entries seed impact analysis; following their registry
          records reveals transitive consumers. Release approval additionally requires confirming that the
