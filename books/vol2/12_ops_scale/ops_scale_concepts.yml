        concept: Input delivery budget
        quote: Required input bandwidth is the number of distinct consumers times target compute fraction times
          batch bytes over compute time, every stage of the chain must sustain it because delivered rate is the
          minimum over stages, and prefetch absorbs variance but never a sustained deficit; a direct DMA path
          from storage into accelerator memory (GPUDirect Storage, for example) removes the host-copy stage only
          when that copy is the limiting stage.

