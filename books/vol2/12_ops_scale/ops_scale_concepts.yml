  claims:
    Operational load follows coupling: Once models share features, embeddings, pipelines, alerts, and capacity,
      the operational object is the dependency graph, so pairwise conflicts grow toward N^2/2 and a new model's
      marginal cost depends on how it couples to the portfolio.
    Dependency-aware registry: Per-model validation does not establish compatibility along a chain, so the registry
      records upstream and downstream edges whose traversal yields the impact set, and a release names a compatible
      version set whose rollback unit may span a pipeline.
    Feature consistency contract: A feature store makes training-serving consistency a testable platform invariant
      only if freshness SLOs name their timestamp contract and point-in-time joins filter on availability time rather
      than event time.
    Staged rollout exposure budget: Rollout risk is probability of regression times per-unit impact times exposed
      units, so a canary stage lasts at least its planned sample over traffic share, and the slowest outcome the
      release must observe sets the schedule.
    Evaluation contract: A fleet release is accepted against one versioned record that pins, for the same artifact,
      offline, system, responsibility, online, and recovery evidence, each with an owner and an invalidation rule
      fixed before exposure.
    Hierarchical fleet alerting: With M independent checks the chance of at least one false alert 1 - (1 - p)^M
      approaches certainty, so monitoring routes by a business, portfolio, model, and infrastructure hierarchy with
      an owner per level, correlates anomalies to find shared causes, joins metrics, logs, and traces under stable
      identifiers across jobs, models, and infrastructure, and runs calibrated drift statistics whose responsibility
      ends when evidence reaches the model owner's update decision.
    SLO vector of budgets: An endpoint can return HTTP 200 while serving stale features or degraded predictions,
      so each service carries an SLO vector (availability, latency, freshness, quality) with burn rates, and any
      exhausted dimension stops promotion.
    Utilization as the economic invariant: Owned capacity pays a capital step then a shallow operating slope while
      rental grows with use, so ownership wins only above a sustained useful-utilization threshold whose value depends
      on the cost boundary drawn, and the same invariant prices every headroom reserve.
    Fleet experiment budgeting: A release experiment's sample grows as one over the squared effect size, uncorrected
      multiple tests and peeking inflate false rejections, and interference between concurrent experiments must
      be budgeted like sample size.
    Incident containment and attribution: ML incidents can leave every service-health signal green, so response
      applies a known safe containment before root cause is certain, attributes by which models degrade together,
      and converts each incident into a control.
    ML platform as a product: An internal ML platform centralizes recurring operational judgment at a chosen abstraction
      level and needs its own SLOs, interface compatibility guarantees, and retirement dates, judged by the work
      it removes from model teams; namespace tenancy and the team's placement (centralized, embedded, or hybrid) decide
      where its invariants are enforced.
    Platform break-even: Platform benefit-cost ratio is linear in the number of models at fixed savings, so break-even
      portfolio size moves with savings per model and platform cost, and recovered hours are capacity, not cash,
      until spending is avoided; savings per model come from measured recurring technical debt, ranked by impact times
      frequency times benefit over resolution cost.
    Lifecycle TCO: TCO = C_train + C_infer + C_data + C_iter over one accounting horizon with each cost counted
      once, the dominant term, which shifts with workload regime, picks the optimization, and FinOps makes the accounting
      act by metering spend per team, service, and model under attribution rules that shape incentives and an owner
      who can stop a run.
    Capacity planning under lead time: Capacity takes months to years to acquire while traffic changes in days, so
      the plan sizes the fleet from the token budget and sustained throughput, follows the longest supply or facility
      prerequisite as its critical path, and treats late capacity as a reliability failure, not a procurement delay.
