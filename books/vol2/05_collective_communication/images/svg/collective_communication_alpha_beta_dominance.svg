<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Normalized iron-law bars (share of one transfer's time, schematic). Bandwidth term n/beta is always amber, latency term alpha always dark slate. Large message: n/beta dominates; small message: alpha dominates. -->
  <rect width="180" height="114" fill="#ffffff"/>
  <text x="4" y="13" font-size="12" fill="#555555">Share of transfer time</text>
  <text x="4" y="34" font-size="13" font-weight="700" fill="#333333">Large message</text>
  <rect x="4" y="39" width="158" height="22" fill="#d97706" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="162" y="39" width="14" height="22" fill="#5e6b73" stroke="#ffffff" stroke-width="0.8"/>
  <text x="83" y="55.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff"><tspan font-style="italic">n</tspan>/β</text>
  <text x="4" y="82" font-size="13" font-weight="700" fill="#333333">Small message</text>
  <rect x="4" y="87" width="158" height="22" fill="#5e6b73" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="162" y="87" width="14" height="22" fill="#d97706" stroke="#ffffff" stroke-width="0.8"/>
  <text x="83" y="103.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">α</text>
</svg>
