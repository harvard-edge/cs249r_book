<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Compute vs exposed communication share of one training step at the scale of thousands of GPUs (illustrative), drawn to 20 : 65 proportions. Common scale: 65 units = 152 px. -->
  <rect width="160" height="113" fill="#ffffff"/>
  <text x="4" y="13" font-size="12" fill="#555555">Thousands of GPUs</text>
  <text x="4" y="27" font-size="12" fill="#555555">(illustrative)</text>
  <text x="4" y="47" font-size="13" font-weight="700" fill="#333333">Compute</text>
  <rect x="4" y="52" width="46.8" height="17" fill="#1F407A"/>
  <text x="4" y="87" font-size="13" font-weight="700" fill="#333333">Communication</text>
  <rect x="4" y="92" width="152" height="17" fill="#d97706"/>
</svg>
