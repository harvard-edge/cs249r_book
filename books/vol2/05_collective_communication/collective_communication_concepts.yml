  formulas:
    - T(n) = \alpha + \frac{n}{\beta}
    - n^* = \alpha \cdot \beta
    - T_{\text{bandwidth}} = 2 \cdot \frac{N-1}{N} \cdot \frac{n}{\beta}
    - T_{\text{latency}} = 2(N-1) \cdot \alpha
    - T_{\text{bandwidth}}^{\text{min}} = \frac{2(N-1)}{N} \cdot \frac{M}{\beta}
    - T_{\text{ring}} = \underbrace{2(N-1)\alpha}_{\text{Latency Term}} + \underbrace{2\frac{N-1}{N} \frac{M}{\beta}}_{\text{Bandwidth
      Term}}
    - T_{\text{tree-like}} \approx \underbrace{2\log_2 N \cdot \alpha}_{\text{Latency}} + \underbrace{2 \log_2 N
      \frac{M}{\beta}}_{\text{Bandwidth penalty in full-message exchange variants}}
    - T_{\text{butterfly}} = 2\log_2 N \cdot \alpha + 2\frac{N-1}{N} \cdot \frac{M}{\beta}
    - T_{\text{double-tree}} \approx 2\log_2 N \cdot \alpha + \frac{2M}{\beta}
    - T_{\text{tree}} = 2\log_2 N \cdot \alpha + 2\log_2 N \cdot \frac{M}{\beta}
    - T_{\text{ring}} \approx 2N\alpha + \frac{2M}{\beta}, \quad T_{\text{tree}} \approx 2\log_2 N \cdot \alpha
      + \frac{2\log_2 N \cdot M}{\beta}
    - M_{\text{crossover}} \approx \frac{N \cdot \alpha \cdot \beta}{\log_2 N}
    - e_{t+1} = (g_t + e_t) - v_t
    - \sum_{t=1}^{T} v_t = \sum_{t=1}^{T} g_t + e_1 - e_{T+1}
    - T_{\text{pipelined}} = T_{\text{backward}} + T_{\text{first layer comm}} + (N_{\text{layers}} - 1) \times
      T_{\text{exposed}}
