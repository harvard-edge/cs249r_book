    - id: vol2.field.06
      source: vol2.network.startup-latency
      predicate: adds per-round cost to
      target: vol2.collective.allreduce
      explanation: Collective latency depends on the number of communication rounds as well as transferred
        bytes.
      conditions: Alpha-beta approximations require calibration for the backend and message regime.
      status: draft
      evidence:
        section: sec-communication-collective-operations-collective-operations-network-performance-modeling-0d8e
        quote: The $\MessageStartupLatency$-$\LinkBandwidth$ model\index{Hockney model!latency and bandwidth}
          $\PointToPointTransferTime(\PointToPointMessageSize) = \MessageStartupLatency+ \PointToPointMessageSize/\LinkBandwidth$
          prices a transfer over a single link (principle \ref{pri-alpha-beta-model}), separating a fixed
          startup cost ($\MessageStartupLatency$) from a per-byte transfer cost ($\PointToPointMessageSize/\LinkBandwidth$)
          [@hockney1994]. A collective pays that price at every step of its schedule, so the two terms,
          multiplied by the schedule's round count and traffic factor, determine algorithm selection across
          the fleet.
    - id: vol2.field.14
      source: vol2.collective.overlap
      predicate: reduces exposed time in
      target: vol2.fleet.step-time
      explanation: Overlap can shorten the critical path without reducing the number of bytes moved.
      conditions: Only communication concurrent with independent useful compute can be hidden.
      status: draft
      evidence:
        section: sec-communication-overlap-limits
        quote: 'The pipeline also has boundary effects\index{Communication-computation overlap!boundary
          effects}. During the first backward computation, no gradient from this pass is ready to communicate.
          Once the output-side gradient is ready, however, its communication can overlap with the remaining
          backward work. At the other end, the input-side gradient has no subsequent backward computation
          to hide its transfer. More layers create a longer overlap window, but depth alone does not guarantee
          high coverage: if communication takes longer than each compute interval, a backlog remains even
          in a deep model.'
    - id: vol2.field.15
      source: vol2.collective.gradient-compression
      predicate: reduces
      target: vol2.fleet.communication-intensity
      explanation: Compression changes transmitted bytes at the cost of encoding work and possible convergence
        effects.
      conditions: Compare time to target quality, including error feedback and encoding overhead.
      status: draft
      evidence:
        section: sec-communication-collective-operations-collective-operations-gradient-compression-7a5c
        quote: Training across data centers over wide-area links or on cloud instances with commodity Ethernet
          can leave each worker with 10--100$\times$ less network bandwidth than the reference InfiniBand
          fabric. Federated training on phone-class devices, the Archetype C (Federated MobileNet) regime,
          faces cellular or Wi-Fi uplinks that are both slower and intermittently available. Even after
          hierarchical routing and schedule tuning extract all usable capacity from such links, moving a
          full-precision gradient or a multi-step client update can still dominate step time. Gradient compression
          attacks the payload size directly by trading numerical representation fidelity for fewer transmitted
          bits, offering nominal value-payload reductions of 4--1000$\times$ before metadata and aggregation
          costs reduce the realized savings. Because noisy or biased updates can slow or stall optimization,
          the central engineering question is how much communication volume a compressor can remove while
          preserving progress toward the training quality target.
    - id: vol2.field.56
      source: vol2.training.state-sharding
      predicate: gathers parameters with
      target: vol2.collective.allgather
      explanation: Fully sharded workers gather a module's parameter shards before computation needs full
        weights.
      conditions: This describes full parameter sharding; other ZeRO stages and resharding policies have
        different schedules.
      status: draft
      evidence:
        section: sec-collective-communication-six-core-primitives-8a66
        quote: Ring achieves AllReduce's bandwidth-optimal cost while the simple full-message Tree model\index{Broadcast!tree
          topology} trades bandwidth for logarithmic latency [@patarasuk2009; @thakur2005]. AllReduce itself
          also decomposes into ReduceScatter\index{ReduceScatter!decomposition} followed by AllGather\index{AllGather!decomposition}.
          The decomposition is operational as well as mathematical, since Ring AllReduce's first phase is
          a ReduceScatter and its second phase is an AllGather. ReduceScatter performs arithmetic, so it
          does not invert AllGather despite reversing the direction of shard expansion. Full ZeRO-style
          sharding\index{ZeRO!parameter sharding} and PyTorch FSDP use the pair the same way, gathering
          parameter shards with AllGather before a module needs them and reducing gradients with ReduceScatter
          after backward so each rank retains only its shard for the optimizer step [@rajbhandari2020].
          Sharding parameters, gradients, and optimizer state across workers reduces persistent model-state
          memory roughly by $\DeviceCount\times$, while temporary full-parameter buffers and prefetching
          determine peak memory. That memory saving is developed in @sec-distributed-training-systems-systems-memoryefficient-data-parallelism-zero-fsdp-0e69;
          the communication it adds is priced in @sec-communication-fsdp-patterns.
