    - id: vol2.field.60
      source: vol2.collective.allgather
      predicate: can be prefetched for
      target: vol2.collective.overlap
      explanation: An FSDP parameter gather can overlap independent work only while its arrival still satisfies
        the layer dependency.
      conditions: Extra materialized parameters consume memory; the available compute window and actual
        transfer rate bound hidden time.
      status: draft
      evidence:
        section: sec-communication-fsdp-patterns
        quote: Selecting the right collective algorithm at each invocation requires distinguishing transfer
          cost from dependency exposure. An FSDP AllGather is latency-sensitive\index{FSDP!AllGather latency
          sensitivity} in the scheduling sense, because a layer cannot compute until its full parameters
          arrive. Its transfer can nevertheless be bandwidth-bound when the parameter tensor is large. Prefetching
          can hide part of that gather, while a ReduceScatter can overlap with the remaining backward computation.
          Neither dependency alone selects Ring or Tree; message size, group size, topology, and the available
          overlap window jointly determine the useful schedule.
