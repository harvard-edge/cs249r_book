      - chapter: 03_network_fabrics
        concept: ML traffic inversion
        quote: Synchronous training releases a few large, correlated flows whose completion gates a job-wide
          barrier, so a fabric is judged by collective completion time and its tail, static ECMP hashing makes
          persistent hot spots, and oversubscription becomes a workload decision. The chapter defines bulk synchronous
          parallel (BSP) execution, the barrier model that distributed training later trades against SSP and
          ASP, and tail latency (p99) at its first use, the completion-time measure later chapters reuse.

