  formulas:
    - T_{\text{step}}(N) = \frac{T_{\text{compute}}}{N} + T_{\text{comm}}(N) + T_{\text{sync}}(N) - T_{\text{overlap}}
    - g = \frac{1}{B} \sum_{i=1}^B \nabla_{\theta} \mathcal{L}(\theta, x_i)
    - g_k = \frac{1}{|B_k|} \sum_{x_i \in B_k} \nabla_{\theta} \mathcal{L}(\theta, x_i)
    - g_{\text{global}} = \frac{1}{N} \sum_{k=1}^N g_k
    - g_{\text{global}} = \frac{1}{|B_{\text{total}}|} \sum_{x_i \in B_{\text{total}}} \nabla_{\theta} \mathcal{L}(\theta,
      x_i)
    - M_{\text{total}} = 7 \times 10^9 \times 16 \text{ bytes} \approx \mathbf{112 \text{ GB}}
    - M_{\text{ZeRO3}} = \frac{112 \text{ GB}}{64} \approx \mathbf{1.75 \text{ GB}}
    - \eta_{\text{scaling}} = \frac{T_{\text{compute}}}{N \times T_{\text{step}}(N)} = \frac{1}{1 + \frac{N(T_{\text{comm}}(N)
      + T_{\text{sync}}(N) - T_{\text{overlap}})}{T_{\text{compute}}}}
    - \mathbb{E}[\mathcal{L}(\theta_T)] - \mathcal{L}^{\star} \leq \underbrace{\frac{L_s \|\theta_0 - \theta^{\star}\|^2}{2T}}_{\text{optimization
      error}} + \underbrace{\frac{\eta L_s \sigma^2}{2Nb}}_{\text{variance floor}}
    - \mathbb{E}[\mathcal{L}(\theta_T)] - \mathcal{L}^{\star} \leq O\left(\frac{1}{\sqrt{NbT}}\right) + O\left(\frac{s^2
      \eta^2 L_s^2}{Nb}\right)
    - \mathbb{E}[\mathcal{L}(\theta_T)] - \mathcal{L}^{\star} \leq O\left(\frac{1}{\sqrt{T}}\right) + O\left(\bar{\tau}^2
      \eta^2 L_s^2\right)
    - \eta_{\text{large}} = k \cdot \eta_{\text{base}}
    - \eta_{\text{large}} = \sqrt{k} \cdot \eta_{\text{base}}
    - B^{*} \approx \frac{\text{tr}(\Sigma)}{\|\nabla \mathcal{L}(\theta)\|^2}
    - f_{\text{bubble}} = \frac{p-1}{m+p-1}
    - m > 9(p-1) \text{ for } f_{\text{bubble}} < 0.1
    - s = \text{hash}(\text{id}) \bmod N_{\text{shards}}
