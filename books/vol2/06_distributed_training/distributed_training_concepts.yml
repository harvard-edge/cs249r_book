      - chapter: 05_collective_communication
        concept: Collective contracts
        quote: 'A collective is a contract on what each rank holds afterward, not a schedule or a barrier: AllReduce
          = ReduceScatter + AllGather, AllToAll is a distributed transpose, and the right primitive is the narrowest
          one whose output the next computation consumes. Gradient synchronization, the AllReduce of the full
          gradient that every synchronous data-parallel step repeats, is defined here as the central case.'
