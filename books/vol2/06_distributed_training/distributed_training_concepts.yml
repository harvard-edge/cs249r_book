      status: draft
      evidence:
        section: sec-distributed-training-systems-systems-data-parallelism-6132
        quote: 'Parameter updating closes the replicated synchronous contract. After the gradient AllReduce
          [@patarasuk2009], every worker holds the same global gradient and applies it to its own replica
          with SGD, momentum, or Adam\index{Adam!distributed update}, so the update stays decentralized
          without losing equivalence to single-device training. Identical gradients alone are insufficient,
          because optimizer moments, learning rates, and step counts must also match across replicas. Frameworks
          automate the cycle of splitting data, computing gradients, synchronizing, and updating, but they
          cannot remove the ordering constraint that keeps the replicas coherent: every worker must finish
          aggregating the current step''s gradient before any replica computes from the updated weights.'
