  <rect x="552" y="256" width="35" height="48" rx="1" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="569.5" y="260" width="13.5" height="7" fill="#C7D7EB" stroke="#1F407A" stroke-width="1"/>
  <rect x="569.5" y="271" width="13.5" height="7" fill="#C7D7EB" stroke="#1F407A" stroke-width="1"/>
  <rect x="569.5" y="282" width="13.5" height="7" fill="#C7D7EB" stroke="#1F407A" stroke-width="1"/>
  <rect x="569.5" y="293" width="13.5" height="7" fill="#C7D7EB" stroke="#1F407A" stroke-width="1"/>
  <!-- combine axes: stage 1 (upper layers) split across two GPUs, stage 2 (lower layers) split across two more -->
  <rect x="492" y="340" width="35" height="48" rx="1" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="496" y="344" width="13.5" height="7" fill="#C7D7EB" stroke="#1F407A" stroke-width="1"/>
  <rect x="496" y="355" width="13.5" height="7" fill="#C7D7EB" stroke="#1F407A" stroke-width="1"/>
  <rect x="530" y="340" width="35" height="48" rx="1" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="547.5" y="344" width="13.5" height="7" fill="#C7D7EB" stroke="#1F407A" stroke-width="1"/>
  <rect x="547.5" y="355" width="13.5" height="7" fill="#C7D7EB" stroke="#1F407A" stroke-width="1"/>
  <rect x="574" y="340" width="35" height="48" rx="1" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="578" y="366" width="13.5" height="7" fill="#C7D7EB" stroke="#1F407A" stroke-width="1"/>
