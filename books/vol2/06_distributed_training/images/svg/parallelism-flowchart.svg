  <!-- pipeline parallel -->
  <rect x="512" y="424" width="35" height="48" rx="1" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="516" y="428" width="27" height="7" fill="#C7D7EB" stroke="#1F407A" stroke-width="1"/>
