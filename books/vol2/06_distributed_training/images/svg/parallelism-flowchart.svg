<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Parallelism decision tree. Decisions = neutral diamonds; strategies = C1 blue, each with a glyph of what it splits: GPU frames holding layer bars. Single = one full replica; data = whole replicas; pipeline = each GPU holds a contiguous layer group (staircase); tensor = each GPU holds half of every layer; sharded = each GPU stores one 1/N slice of every layer (dashed = rest of the layer, gathered on demand), as in fig-zero-partitioning. Dashed collector = combine axes. Decision edges 1.5, collector 1.2. Type: 13.5 titles, 12.5 sublabels (6 pt floor on an 800 px canvas = 12.4 px). -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="800" height="580" fill="#ffffff"/>
  <rect x="45" y="20" width="150" height="34" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="41.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Workload profile</text>
  <path d="M120,54 V74" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M120,76 L216,112 L120,148 L24,112 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="120" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Fits on</text>
  <text x="120" y="125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">one GPU?</text>
  <path d="M352,76 L448,112 L352,148 L256,112 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="352" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">One GPU</text>
  <text x="352" y="125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">meets target?</text>
  <path d="M120,244 L216,280 L120,316 L24,280 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="120" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Deep layer</text>
  <text x="120" y="293" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">stack?</text>
  <path d="M120,344 L216,380 L120,416 L24,380 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="120" y="376" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">One layer</text>
  <text x="120" y="393" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">too large?</text>
  <rect x="490" y="80" width="266" height="64" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="687" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Single device</text>
  <text x="687" y="125" text-anchor="middle" font-size="12.5" fill="#475569">no parallelism</text>
  <rect x="490" y="164" width="266" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="687" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Data parallel</text>
  <text x="687" y="209" text-anchor="middle" font-size="12.5" fill="#475569">replicate, shard batch</text>
  <rect x="490" y="248" width="266" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="687" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Pipeline parallel</text>
  <text x="687" y="293" text-anchor="middle" font-size="12.5" fill="#475569">layer stages</text>
  <rect x="490" y="348" width="266" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="687" y="376" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Tensor parallel</text>
  <text x="687" y="393" text-anchor="middle" font-size="12.5" fill="#475569">split within a layer</text>
  <rect x="490" y="432" width="266" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
