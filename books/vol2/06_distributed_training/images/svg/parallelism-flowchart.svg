<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Parallelism decision tree. Decisions = neutral diamonds; strategies = C1 blue, each with a glyph of what it splits: GPU frames holding layer bars. Single = one full replica; data = whole replicas; tensor = each GPU holds half of every layer; combine = tensor halves inside each of two pipeline stages; pipeline = each GPU holds a contiguous layer group (staircase); sharded = each GPU stores one 1/N slice of every layer (dashed = rest of the layer, gathered on demand), as in fig-zero-partitioning. 2026-11-03: a model that does not fit tests the layer (TP inside one node) before depth (PP); when TP inside one node still does not fit, the path ends at combine axes (the 175B reference job). Decision edges 1.5. Type: 13.5 titles, 12.5 sublabels (6 pt floor on an 800 px canvas = 12.4 px). -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="800" height="590" fill="#ffffff"/>
  <!-- ===== start and decisions ===== -->
  <rect x="45" y="20" width="150" height="34" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="41.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Workload profile</text>
  <path d="M120,54 V74" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M120,76 L216,112 L120,148 L24,112 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="120" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Fits on</text>
  <text x="120" y="125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">one GPU?</text>
  <path d="M352,76 L448,112 L352,148 L256,112 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="352" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">One GPU</text>
  <text x="352" y="125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">meets target?</text>
  <path d="M120,244 L216,280 L120,316 L24,280 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="120" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">One layer too</text>
  <text x="120" y="293" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">large or slow?</text>
  <path d="M352,244 L448,280 L352,316 L256,280 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="352" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Fits with TP</text>
  <text x="352" y="293" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">in one node?</text>
  <path d="M120,412 L216,448 L120,484 L24,448 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="120" y="444" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Deep layer</text>
  <text x="120" y="461" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">stack?</text>
  <!-- ===== outcomes ===== -->
  <rect x="480" y="80" width="286" height="64" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="692" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Single device</text>
  <text x="692" y="125" text-anchor="middle" font-size="12.5" fill="#475569">no parallelism</text>
  <rect x="480" y="164" width="286" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="692" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Data parallel</text>
  <text x="692" y="209" text-anchor="middle" font-size="12.5" fill="#475569">replicate, shard batch</text>
  <rect x="480" y="248" width="286" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="692" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Tensor parallel</text>
  <text x="692" y="293" text-anchor="middle" font-size="12.5" fill="#475569">split within a layer</text>
  <rect x="480" y="332" width="286" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="712" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Combine axes</text>
  <text x="712" y="377" text-anchor="middle" font-size="12.5" fill="#475569">TP × PP × DP</text>
  <rect x="480" y="416" width="286" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="692" y="444" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Pipeline parallel</text>
  <text x="692" y="461" text-anchor="middle" font-size="12.5" fill="#475569">layer stages</text>
  <rect x="480" y="500" width="286" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="692" y="528" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Sharded DP</text>
  <text x="692" y="545" text-anchor="middle" font-size="12.5" fill="#475569">FSDP, ZeRO</text>
  <!-- ===== decision edges ===== -->
  <path d="M216,112 H254" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="236" y="103" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">yes</text>
  <path d="M448,112 H478" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="463" y="103" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">yes</text>
  <path d="M352,148 V196 H478" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="360" y="176" text-anchor="start" font-size="12.5" font-style="italic" fill="#64748b">no</text>
  <path d="M120,148 V242" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="128" y="199" text-anchor="start" font-size="12.5" font-style="italic" fill="#64748b">no</text>
  <path d="M216,280 H254" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="236" y="271" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">yes</text>
  <path d="M448,280 H478" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="463" y="271" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">yes</text>
  <path d="M352,316 V364 H478" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="360" y="344" text-anchor="start" font-size="12.5" font-style="italic" fill="#64748b">no</text>
  <path d="M120,316 V410" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="128" y="367" text-anchor="start" font-size="12.5" font-style="italic" fill="#64748b">no</text>
  <path d="M216,448 H478" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="236" y="439" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">yes</text>
  <path d="M120,484 V532 H478" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="128" y="512" text-anchor="start" font-size="12.5" font-style="italic" fill="#64748b">no</text>
