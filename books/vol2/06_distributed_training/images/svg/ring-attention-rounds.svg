<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Ring Attention with context-parallel degree 4. Each GPU keeps its query chunk (C1 blue) and, in each round,
       attends to the resident key/value tile (C2 amber) while sending that tile to the next GPU in the ring.
       GPU i holds KV tile (i - r) mod 4 in round r (r = 0..3); after 4 rounds every query chunk has seen every tile. -->
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>
