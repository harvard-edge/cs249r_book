<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Constructed demand over one day against three capacity tiers: reserved covers the steady 60 percent base, on-demand the next 20 percent, spot the peak. Shares and curve are scenario assumptions. -->
  <rect width="680" height="252" fill="#ffffff"/>
  <rect x="70" y="100.0" width="450" height="120.0" fill="#EAF1F8"/>
  <text x="532" y="158.0" font-size="13" font-weight="700" fill="#14294E">Reserved</text>
  <text x="532" y="174.0" font-size="12" fill="#475569">steady base load</text>
  <rect x="70" y="60.0" width="450" height="40.0" fill="#fef3c7"/>
  <text x="532" y="78.0" font-size="13" font-weight="700" fill="#b45309">On-demand</text>
  <text x="532" y="94.0" font-size="12" fill="#475569">bursts that can wait</text>
  <rect x="70" y="20.0" width="450" height="40.0" fill="#dcfce7"/>
  <text x="532" y="38.0" font-size="13" font-weight="700" fill="#15803d">Spot</text>
  <text x="532" y="54.0" font-size="12" fill="#475569">restart-tolerant work</text>
  <line x1="70" y1="100.0" x2="520" y2="100.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="70" y1="60.0" x2="520" y2="60.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="70" y="20" width="450" height="200" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="64" y="224.0" text-anchor="end" font-size="12" fill="#475569">0%</text>
  <text x="64" y="184.0" text-anchor="end" font-size="12" fill="#475569">20%</text>
  <text x="64" y="144.0" text-anchor="end" font-size="12" fill="#475569">40%</text>
  <text x="64" y="104.0" text-anchor="end" font-size="12" fill="#475569">60%</text>
  <text x="64" y="64.0" text-anchor="end" font-size="12" fill="#475569">80%</text>
  <text x="64" y="24.0" text-anchor="end" font-size="12" fill="#475569">100%</text>
  <text x="18" y="120.0" text-anchor="middle" font-size="12" fill="#475569" transform="rotate(-90 18 120.0)">share of peak capacity</text>
  <text x="295.0" y="242" text-anchor="middle" font-size="12" fill="#475569">one day (constructed demand)</text>
  <path d="M70,140.0 C140,140.0 170,36.0 230,36.0 C300,36.0 340,124.0 410,124.0 C460,124.0 490,112.0 520,110.0" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="332" y="40.0" font-size="12" font-weight="700" fill="#0f172a">demand</text>
</svg>
