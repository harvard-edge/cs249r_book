<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 276" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Constructed demand over one day against three capacity tiers: reserved covers the steady 60 percent base, on-demand the next 20 percent, spot the peak. The area under the demand curve is colored by the tier that serves it; reserved capacity above the curve is hatched because it is held whether or not demand uses it, while on-demand and spot are acquired only where demand reaches them. Shares and curve are scenario assumptions. -->
  <defs>
    <clipPath id="under"><path d="M84.0,140.0 C151.8,140.0 180.9,36.0 239.0,36.0 C306.8,36.0 345.6,124.0 413.4,124.0 C461.9,124.0 490.9,112.0 520.0,110.0 L520.0,220 L84.0,220 Z"/></clipPath>
    <pattern id="idle" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b6c4d8" stroke-width="1.6"/>
    </pattern>
  </defs>
  <rect width="680" height="276" fill="#ffffff"/>
  <g transform="translate(0,10)">
  <rect x="84" y="100.0" width="436" height="120.0" fill="url(#idle)"/>
  <g clip-path="url(#under)">
    <rect x="84" y="100.0" width="436" height="120.0" fill="#c9d8ea"/>
    <rect x="84" y="60.0" width="436" height="40.0" fill="#fde68a"/>
    <rect x="84" y="20.0" width="436" height="40.0" fill="#bbf7d0"/>
  </g>
  <line x1="84" y1="100.0" x2="520" y2="100.0" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="84" y1="60.0" x2="520" y2="60.0" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="84" y="20" width="436" height="200" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="462" y="86.0" text-anchor="middle" font-size="11" fill="#334155">reserved, idle</text>
  <line x1="462" y1="90.0" x2="462" y2="110.0" stroke="#334155" stroke-width="0.8"/>
  <text x="307" y="164.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">served by reserved</text>
  <rect x="532" y="142" width="10" height="10" fill="#c9d8ea"/>
  <text x="548" y="152" font-size="13" font-weight="700" fill="#14294E">Reserved</text>
  <text x="548" y="168" font-size="12" fill="#475569">steady base load</text>
  <rect x="532" y="62" width="10" height="10" fill="#fde68a"/>
  <text x="548" y="72" font-size="13" font-weight="700" fill="#b45309">On-demand</text>
  <text x="548" y="88" font-size="12" fill="#475569">bursts that can wait</text>
  <rect x="532" y="22" width="10" height="10" fill="#bbf7d0"/>
  <text x="548" y="32" font-size="13" font-weight="700" fill="#15803d">Spot</text>
  <text x="548" y="48" font-size="12" fill="#475569">restart-tolerant work</text>
  <text x="78" y="224" text-anchor="end" font-size="12" fill="#475569">0%</text>
  <text x="78" y="184" text-anchor="end" font-size="12" fill="#475569">20%</text>
  <text x="78" y="144" text-anchor="end" font-size="12" fill="#475569">40%</text>
  <text x="78" y="104" text-anchor="end" font-size="12" fill="#475569">60%</text>
  <text x="78" y="64" text-anchor="end" font-size="12" fill="#475569">80%</text>
  <text x="78" y="24" text-anchor="end" font-size="12" fill="#475569">100%</text>
  <text x="32" y="120" text-anchor="middle" font-size="12" fill="#475569" transform="rotate(-90 32 120)">share of peak capacity</text>
  <text x="302" y="242" text-anchor="middle" font-size="12" fill="#475569">one day (constructed demand)</text>
  <path d="M84.0,140.0 C151.8,140.0 180.9,36.0 239.0,36.0 C306.8,36.0 345.6,124.0 413.4,124.0 C461.9,124.0 490.9,112.0 520.0,110.0" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="307" y="40" font-size="12" font-weight="700" fill="#0f172a">demand</text>
  </g>
</svg>
