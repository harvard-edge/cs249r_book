<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 405" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Chart Area -->
  <g transform="translate(65, 45)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Axes Lines -->
    <line x1="45" y1="320" x2="520" y2="320" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="45" y1="30" x2="45" y2="320" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Y-Axis Ticks: 0% to 100% (h=270, 67.5px per 25%) -->
    <!-- 100% at y=50, 75% at y=117.5, 60% at y=158, 50% at y=185, 25% at y=252.5, 0% at y=320 -->
    <line x1="38" y1="50" x2="45" y2="50" stroke="#94a3b8" stroke-width="1"/>
    <text x="34" y="53" text-anchor="end" font-size="8" fill="#64748b">100%</text>

    <line x1="38" y1="118" x2="45" y2="118" stroke="#94a3b8" stroke-width="1"/>
    <text x="34" y="121" text-anchor="end" font-size="8" fill="#64748b">75%</text>

    <line x1="38" y1="185" x2="45" y2="185" stroke="#94a3b8" stroke-width="1"/>
    <text x="34" y="188" text-anchor="end" font-size="8" fill="#64748b">50%</text>

    <line x1="38" y1="252" x2="45" y2="252" stroke="#94a3b8" stroke-width="1"/>
    <text x="34" y="255" text-anchor="end" font-size="8" fill="#64748b">25%</text>

    <line x1="38" y1="320" x2="45" y2="320" stroke="#94a3b8" stroke-width="1"/>
    <text x="34" y="323" text-anchor="end" font-size="8" fill="#64748b">0%</text>

    <text x="-15" y="185" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155" transform="rotate(-90,-15,185)">Fleet GPU Capacity Share</text>

    <!-- ===== TIER 1: RESERVED CAPACITY (0% to 60%, y=158 to 320, h=162) ===== -->
    <rect x="45" y="158" width="475" height="162" fill="#f0f9ff" stroke="none"/>
    <line x1="45" y1="158" x2="520" y2="158" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4 2"/>

    <g transform="translate(360, 220)">
      <rect x="0" y="0" width="145" height="52" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="72.5" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#14294E">Tier 1: Reserved Instances</text>
      <text x="72.5" y="32" text-anchor="middle" font-size="7.5" fill="#475569">1–3 yr commitment · 60% base</text>
      <text x="72.5" y="44" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1F407A">Steady training &amp; base serving</text>
    </g>

    <!-- ===== TIER 2: ON-DEMAND CAPACITY (60% to 80%, y=104 to 158, h=54) ===== -->
    <rect x="45" y="104" width="475" height="54" fill="#fffbeb" stroke="none"/>
    <line x1="45" y1="104" x2="520" y2="104" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 2"/>

    <g transform="translate(360, 108)">
      <rect x="0" y="0" width="145" height="42" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="72.5" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">Tier 2: On-Demand</text>
      <text x="72.5" y="30" text-anchor="middle" font-size="7.5" fill="#475569">Immediate provisioning · 20% buffer</text>
    </g>

    <!-- ===== TIER 3: SPOT / PREEMPTIBLE (80% to 100%, y=50 to 104, h=54) ===== -->
    <rect x="45" y="50" width="475" height="54" fill="#f0fdf4" stroke="none"/>

    <g transform="translate(360, 54)">
      <rect x="0" y="0" width="145" height="44" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="72.5" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Tier 3: Spot / Preemptible</text>
      <text x="72.5" y="30" text-anchor="middle" font-size="7.5" fill="#475569">Opportunistic · 60–90% discount</text>
      <text x="72.5" y="40" text-anchor="middle" font-size="7" fill="#dc2626">Subject to 30s–2m eviction notice</text>
    </g>

    <!-- ===== WORKLOAD DEMAND CURVE (Diverging Red/Purple Path) ===== -->
    <!-- Starts at 50% (y=185), ramps up to 92% (y=72) at peak, settles at 55% (y=171) -->
    <path d="M 45,210 C 110,210 140,75 220,72 C 300,69 350,195 430,190 C 470,187 500,175 520,175" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Peak Demand Marker -->
    <circle cx="220" cy="72" r="4" fill="#dc2626"/>
    <g transform="translate(155, 30)">
      <rect x="0" y="0" width="130" height="32" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text x="65" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Peak Demand Burst (92%)</text>
      <text x="65" y="25" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Absorbed by Spot &amp; On-Demand</text>
      <line x1="65" y1="32" x2="65" y2="40" stroke="#dc2626" stroke-width="1"/>
    </g>

    <!-- Demand Curve Label -->
    <text x="110" y="235" font-size="8.5" font-weight="700" fill="#6d28d9">Actual Workload Demand</text>

    <!-- X-Axis Label -->
    <text x="280" y="342" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Timeline / Diurnal Cycle</text>
  </g>

  <!-- ===== RIGHT SIDE: PRICING PILLS & ECONOMICS ===== -->
  <g transform="translate(585, 95)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Spot Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="95" height="42" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="47.5" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">$0.70</text>
      <text x="47.5" y="28" text-anchor="middle" font-size="7" fill="#64748b">per GPU-hour</text>
      <text x="47.5" y="38" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">SPOT RATE</text>
    </g>

    <!-- On-Demand Pill -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="95" height="42" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="47.5" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">$2.00</text>
      <text x="47.5" y="28" text-anchor="middle" font-size="7" fill="#64748b">per GPU-hour</text>
      <text x="47.5" y="38" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">ON-DEMAND</text>
    </g>

    <!-- Reserved Pill -->
    <g transform="translate(0, 114)">
      <rect x="0" y="0" width="95" height="42" rx="4" fill="#f0f9ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="47.5" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">$0.80</text>
      <text x="47.5" y="28" text-anchor="middle" font-size="7" fill="#64748b">per GPU-hour</text>
      <text x="47.5" y="38" text-anchor="middle" font-size="7" font-weight="700" fill="#1F407A">RESERVED (3Y)</text>
    </g>

    <!-- Savings Callout -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="95" height="50" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="47.5" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Optimal Mix</text>
      <text x="47.5" y="30" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">50–65% Savings</text>
      <text x="47.5" y="42" text-anchor="middle" font-size="7" fill="#64748b">vs pure on-demand</text>
    </g>
  </g>
</svg>