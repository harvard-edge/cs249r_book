<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="448" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Vertical Divider -->
  <line x1="340" y1="15" x2="340" y2="335" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== LEFT SIDE: NON-GANG SCHEDULER DEADLOCK ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="170" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Non-Gang Scheduler (Deadlock)</text>
    <text x="170" y="38" text-anchor="middle" font-size="8.5" fill="#64748b">8 GPUs total; J1 and J2 each hold 4 and wait for 4</text>

    <!-- GPU Row: 8 GPUs -->
    <g transform="translate(10, 48)">
      <!-- J1 holds G0..G3 (Blue) -->
      <g transform="translate(15, 0)">
        <rect x="0" y="0" width="34" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
        <text x="17" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">G0</text>
        <rect x="38" y="0" width="34" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
        <text x="55" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">G1</text>
        <rect x="76" y="0" width="34" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
        <text x="93" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">G2</text>
        <rect x="114" y="0" width="34" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
        <text x="131" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">G3</text>
        <text x="74" y="40" text-anchor="middle" font-size="8" font-weight="600" fill="#1F407A">J1 holds 4 GPUs</text>
      </g>

      <!-- J2 holds G4..G7 (Purple) -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="34" height="28" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="17" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">G4</text>
        <rect x="38" y="0" width="34" height="28" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="55" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">G5</text>
        <rect x="76" y="0" width="34" height="28" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="93" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">G6</text>
        <rect x="114" y="0" width="34" height="28" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="131" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">G7</text>
        <text x="74" y="40" text-anchor="middle" font-size="8" font-weight="600" fill="#7c3aed">J2 holds 4 GPUs</text>
      </g>
    </g>

    <!-- State Cards: J1 and J2 -->
    <g transform="translate(15, 102)">
      <!-- J1 Card -->
      <rect x="10" y="0" width="125" height="58" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="72" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">Job J1 (4/8 GPUs)</text>
      <text x="72" y="32" text-anchor="middle" font-size="8" fill="#475569">Waiting for 4 more</text>
      <text x="72" y="46" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">Blocked (0%)</text>

      <!-- J2 Card -->
      <rect x="175" y="0" width="125" height="58" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
      <text x="237" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">Job J2 (4/8 GPUs)</text>
      <text x="237" y="32" text-anchor="middle" font-size="8" fill="#475569">Waiting for 4 more</text>
      <text x="237" y="46" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">Blocked (0%)</text>

      <!-- Circular Wait Arrows in the gap (x=135 to 175) -->
      <line x1="140" y1="18" x2="170" y2="18" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
      <text x="155" y="13" text-anchor="middle" font-size="7" font-weight="700" fill="#b91c1c">wants</text>
      <line x1="170" y1="40" x2="140" y2="40" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
      <text x="155" y="52" text-anchor="middle" font-size="7" font-weight="700" fill="#b91c1c">wants</text>
    </g>

    <!-- Queued Job J3 -->
    <rect x="25" y="170" width="290" height="30" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="170" y="189" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b45309">Job J3 in Queue: needs 4 GPUs, 0 available</text>

    <!-- Deadlock Alert Pill -->
    <rect x="110" y="210" width="120" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="170" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">CIRCULAR DEADLOCK</text>

    <!-- Cost of Deadlock Banner -->
    <rect x="25" y="250" width="290" height="38" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="170" y="266" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">8 GPUs 100% Allocated · 0 Useful Compute</text>
    <text x="170" y="279" text-anchor="middle" font-size="8" fill="#b91c1c">Waste: $16/hr ($2/GPU-hr) until timeout or operator intervention</text>
  </g>

  <!-- ===== RIGHT SIDE: GANG SCHEDULING (ATOMIC) ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="510" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Gang Scheduler (All-or-Nothing)</text>
    <text x="510" y="38" text-anchor="middle" font-size="8.5" fill="#64748b">Atomic grants prevent hold-and-wait; jobs execute sequentially</text>

    <!-- Step 1: J1 Allocated Atomically -->
    <g transform="translate(360, 52)">
      <rect x="0" y="0" width="300" height="54" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Step 1: Allocate J1 Atomically (8/8 GPUs)</text>
      <!-- 8 mini GPU chips for J1 -->
      <g transform="translate(10, 22)">
        <rect x="0" y="0" width="30" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
        <text x="15" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#14294E">J1</text>
        <rect x="35" y="0" width="30" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
        <text x="50" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#14294E">J1</text>
        <rect x="70" y="0" width="30" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
        <text x="85" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#14294E">J1</text>
        <rect x="105" y="0" width="30" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
        <text x="120" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#14294E">J1</text>
        <rect x="140" y="0" width="30" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
        <text x="155" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#14294E">J1</text>
        <rect x="175" y="0" width="30" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
        <text x="190" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#14294E">J1</text>
        <rect x="210" y="0" width="30" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
        <text x="225" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#14294E">J1</text>
        <rect x="245" y="0" width="30" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
        <text x="260" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#14294E">J1</text>
      </g>
    </g>

    <!-- Step 2: J2 Queued Cleanly -->
    <g transform="translate(360, 114)">
      <rect x="0" y="0" width="300" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Step 2: J2 Queued Cleanly (Holds 0 GPUs)</text>
      <text x="10" y="31" font-size="8" fill="#64748b">J2 waits without occupying partial slots · zero cluster lock</text>
    </g>

    <!-- Step 3: J1 Completes, J2 Runs -->
    <g transform="translate(360, 164)">
      <rect x="0" y="0" width="300" height="54" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#6d28d9">Step 3: J1 Completes; J2 Granted 8/8 GPUs</text>
      <!-- 8 mini GPU chips for J2 -->
      <g transform="translate(10, 22)">
        <rect x="0" y="0" width="30" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
        <text x="15" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">J2</text>
        <rect x="35" y="0" width="30" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
        <text x="50" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">J2</text>
        <rect x="70" y="0" width="30" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
        <text x="85" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">J2</text>
        <rect x="105" y="0" width="30" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
        <text x="120" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">J2</text>
        <rect x="140" y="0" width="30" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
        <text x="155" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">J2</text>
        <rect x="175" y="0" width="30" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
        <text x="190" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">J2</text>
        <rect x="210" y="0" width="30" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
        <text x="225" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">J2</text>
        <rect x="245" y="0" width="30" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
        <text x="260" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">J2</text>
      </g>
    </g>

    <!-- Success Resolution Card -->
    <rect x="360" y="226" width="300" height="34" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="510" y="242" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Zero Starvation · Sequential Execution</text>
    <text x="510" y="253.5" text-anchor="middle" font-size="8" fill="#166534">Both jobs complete in minimum time with 100% productive GPU cycles</text>
  </g>

  <!-- ===== BOTTOM: COFFMAN DEADLOCK CONDITIONS ===== -->
  <g transform="translate(20, 310)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="640" height="126" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="320" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Resource Dependency Analysis: Coffman Deadlock Conditions</text>

    <!-- Condition 1: Mutual Exclusion -->
    <g transform="translate(15, 28)">
      <rect x="0" y="0" width="135" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="67" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">1. Mutual Exclusion</text>
      <text x="67" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Exclusive GPU access</text>
      <text x="67" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">(no device sharing)</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="152" y1="54" x2="173" y2="54" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Condition 2: Hold and Wait (Target of Gang Scheduling!) -->
    <g transform="translate(175, 28)">
      <rect x="0" y="0" width="135" height="52" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="67" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">2. Hold &amp; Wait</text>
      <text x="67" y="32" text-anchor="middle" font-size="7.5" font-weight="600" fill="#166534">Jobs hold partial gpus</text>
      <text x="67" y="44" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">BROKEN BY GANG</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="312" y1="54" x2="333" y2="54" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Condition 3: No Preemption -->
    <g transform="translate(335, 28)">
      <rect x="0" y="0" width="135" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="67" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">3. No Preemption</text>
      <text x="67" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Allocations cannot be</text>
      <text x="67" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">forcibly reclaimed</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="472" y1="54" x2="493" y2="54" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Condition 4: Circular Wait -->
    <g transform="translate(495, 28)">
      <rect x="0" y="0" width="130" height="52" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">4. Circular Wait</text>
      <text x="65" y="32" text-anchor="middle" font-size="7.5" fill="#991b1b">J1 waits for J2's GPUs</text>
      <text x="65" y="44" text-anchor="middle" font-size="7.5" fill="#991b1b">J2 waits for J1's GPUs</text>
    </g>

    <!-- Gang Scheduling Callout below condition 2 -->
    <g transform="translate(175, 84)">
      <line x1="67" y1="0" x2="67" y2="10" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <rect x="2" y="12" width="131" height="22" rx="2" fill="#16a34a"/>
      <text x="67.5" y="26" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">Breaks Hold &amp; Wait</text>
    </g>
  </g>
</svg>
