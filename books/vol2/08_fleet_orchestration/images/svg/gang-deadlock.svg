<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 214" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Left: partial allocation, J1 and J2 each hold half of 8 GPUs and wait for the other half (circular wait). Right: gang scheduling grants all 8 GPUs atomically, J1 then J2. -->
  <defs><marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker></defs>
  <rect width="680" height="214" fill="#ffffff"/>
  <line x1="340" y1="8" x2="340" y2="206" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="170" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Partial allocation</text>
  <rect x="21" y="34" width="32" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="37.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="59" y="34" width="32" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="75.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="97" y="34" width="32" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="113.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="135" y="34" width="32" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="151.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="173" y="34" width="32" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="189.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <rect x="211" y="34" width="32" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="227.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <rect x="249" y="34" width="32" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="265.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <rect x="287" y="34" width="32" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="303.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <path d="M21,72 V76 H165 V72 M175,72 V76 H319 V72" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="93" y="92" text-anchor="middle" font-size="12" fill="#475569">J1 holds 4</text>
  <text x="247" y="92" text-anchor="middle" font-size="12" fill="#475569">J2 holds 4</text>
  <rect x="20" y="108" width="120" height="48" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="80" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Job J1</text>
  <text x="80" y="145" text-anchor="middle" font-size="12" fill="#b91c1c">needs 8, holds 4</text>
  <rect x="200" y="108" width="120" height="48" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="260" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Job J2</text>
  <text x="260" y="145" text-anchor="middle" font-size="12" fill="#b91c1c">needs 8, holds 4</text>
  <path d="M140,120 H198" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M200,144 H142" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="170" y="136" text-anchor="middle" font-size="11" fill="#b91c1c">waits</text>
  <text x="170" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Deadlock: 8 GPUs held, none computing</text>
  <text x="510" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Gang scheduling</text>
  <text x="360" y="54.5" font-size="12" font-weight="700" fill="#334155">Step 1</text>
