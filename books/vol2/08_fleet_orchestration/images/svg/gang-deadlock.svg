  <text x="425.5" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="443" y="34" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="456.5" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="474" y="34" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="487.5" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="505" y="34" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="518.5" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="536" y="34" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="549.5" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="567" y="34" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="580.5" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="598" y="34" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="611.5" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <rect x="629" y="34" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="642.5" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J1</text>
  <text x="535" y="86" text-anchor="middle" font-size="12" fill="#475569">J1 gets all 8 at once; J2 waits holding none</text>
  <text x="360" y="128.5" font-size="12" font-weight="700" fill="#334155">Step 2</text>
  <rect x="412" y="108" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="425.5" y="128.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <rect x="443" y="108" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="456.5" y="128.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <rect x="474" y="108" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="487.5" y="128.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <rect x="505" y="108" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="518.5" y="128.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <rect x="536" y="108" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="549.5" y="128.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <rect x="567" y="108" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="580.5" y="128.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <rect x="598" y="108" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="611.5" y="128.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <rect x="629" y="108" width="27" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="642.5" y="128.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">J2</text>
  <text x="535" y="160" text-anchor="middle" font-size="12" fill="#475569">J1 finishes; J2 gets all 8 at once</text>
  <text x="510" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">No partial holds, so no deadlock</text>
</svg>
