<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%">
  <rect width="680" height="430" fill="#ffffff"/>

  <defs>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Vertical Divider -->
  <line x1="340" y1="15" x2="340" y2="300" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== LEFT PANEL: Topology-Unaware ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="170" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Topology-Unaware (Scattered Placement)</text>
    <text x="170" y="38" text-anchor="middle" font-size="8.5" fill="#64748b">4-GPU tensor group split across two racks via spine switch</text>

    <!-- Spine Switch (Bottleneck) -->
    <rect x="110" y="48" width="120" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="170" y="65" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">Spine Switch (Traversed)</text>

    <!-- Rack A -->
    <g transform="translate(20, 95)">
      <rect x="0" y="0" width="135" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="67.5" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Rack A</text>

      <!-- Leaf-A -->
      <rect x="15" y="24" width="105" height="22" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="67.5" y="38" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Leaf Switch A</text>

      <!-- GPUs in Rack A -->
      <!-- G0 (Job) -->
      <rect x="15" y="55" width="48" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="39" y="71" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">G0</text>
      <text x="39" y="83" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">Job</text>

      <!-- G1 (Job) -->
      <rect x="72" y="55" width="48" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="96" y="71" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">G1</text>
      <text x="96" y="83" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">Job</text>

      <!-- Busy GPUs -->
      <rect x="15" y="100" width="48" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="39" y="121" text-anchor="middle" font-size="8" fill="#94a3b8">busy</text>
      <rect x="72" y="100" width="48" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="96" y="121" text-anchor="middle" font-size="8" fill="#94a3b8">busy</text>
    </g>

    <!-- Leaf-A to Spine link -->
    <line x1="87.5" y1="119" x2="135" y2="74" stroke="#dc2626" stroke-width="1.5"/>

    <!-- Rack B -->
    <g transform="translate(185, 95)">
      <rect x="0" y="0" width="135" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="67.5" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Rack B</text>

      <!-- Leaf-B -->
      <rect x="15" y="24" width="105" height="22" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="67.5" y="38" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Leaf Switch B</text>

      <!-- GPUs in Rack B -->
      <!-- G2 (Job) -->
      <rect x="15" y="55" width="48" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="39" y="71" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">G2</text>
      <text x="39" y="83" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">Job</text>

      <!-- G3 (Job) -->
      <rect x="72" y="55" width="48" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="96" y="71" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">G3</text>
      <text x="96" y="83" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">Job</text>

      <!-- Busy GPUs -->
      <rect x="15" y="100" width="48" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="39" y="121" text-anchor="middle" font-size="8" fill="#94a3b8">busy</text>
      <rect x="72" y="100" width="48" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="96" y="121" text-anchor="middle" font-size="8" fill="#94a3b8">busy</text>
    </g>

    <!-- Leaf-B to Spine link -->
    <line x1="252.5" y1="119" x2="205" y2="74" stroke="#dc2626" stroke-width="1.5"/>

    <!-- Cross-Rack Communication Path traversing Spine (3 hops) -->
    <path d="M 59,150 V 119 L 135,74 H 205 L 224,119 V 150" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow-red)"/>
    <rect x="115" y="78" width="110" height="15" rx="2" fill="#fef2f2"/>
    <text x="170" y="89" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">3 Hops via Spine</text>

    <!-- Metrics unaware card -->
    <rect x="25" y="255" width="290" height="36" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="170" y="270" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">Effective BW: ~12 GB/s (Spine Congestion)</text>
    <text x="170" y="283" text-anchor="middle" font-size="8" fill="#991b1b">3 switch hops per AllReduce • High tail latency</text>
  </g>

  <!-- ===== RIGHT PANEL: Topology-Aware ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="510" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Topology-Aware (Packed Placement)</text>
    <text x="510" y="38" text-anchor="middle" font-size="8.5" fill="#64748b">4-GPU tensor group co-located within a single rack under Leaf-A</text>

    <!-- Spine Switch (Unused by job) -->
    <rect x="450" y="48" width="120" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="510" y="65" text-anchor="middle" font-size="9" fill="#94a3b8">Spine Switch (Bypassed)</text>

    <!-- Rack A (All 4 GPUs) -->
    <g transform="translate(360, 95)">
      <rect x="0" y="0" width="135" height="150" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="67.5" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">Rack A</text>

      <!-- Leaf-A (In-Rack Fastpath) -->
      <rect x="15" y="24" width="105" height="22" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="67.5" y="38" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Leaf Switch A (1-Hop)</text>

      <!-- GPUs in Rack A: G0, G1, G2, G3 -->
      <rect x="15" y="55" width="48" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="39" y="71" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">G0</text>
      <text x="39" y="83" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">Job</text>

      <rect x="72" y="55" width="48" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="96" y="71" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">G1</text>
      <text x="96" y="83" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">Job</text>

      <rect x="15" y="100" width="48" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="39" y="116" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">G2</text>
      <text x="39" y="128" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">Job</text>

      <rect x="72" y="100" width="48" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="96" y="116" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">G3</text>
      <text x="96" y="128" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">Job</text>

      <!-- Intra-Rack Fastpath links -->
      <line x1="39" y1="89" x2="39" y2="100" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>
      <line x1="96" y1="89" x2="96" y2="100" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>
      <line x1="63" y1="72" x2="72" y2="72" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>
      <line x1="63" y1="117" x2="72" y2="117" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>
    </g>

    <!-- Rack B (Unused by this job) -->
    <g transform="translate(525, 95)">
      <rect x="0" y="0" width="135" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="67.5" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Rack B</text>

      <rect x="15" y="24" width="105" height="22" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="67.5" y="38" text-anchor="middle" font-size="8.5" fill="#94a3b8">Leaf Switch B</text>

      <rect x="15" y="55" width="48" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="39" y="76" text-anchor="middle" font-size="8" fill="#94a3b8">other</text>
      <rect x="72" y="55" width="48" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="96" y="76" text-anchor="middle" font-size="8" fill="#94a3b8">other</text>
      <rect x="15" y="100" width="48" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="39" y="121" text-anchor="middle" font-size="8" fill="#94a3b8">other</text>
      <rect x="72" y="100" width="48" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="96" y="121" text-anchor="middle" font-size="8" fill="#94a3b8">other</text>
    </g>

    <!-- Faded uplink -->
    <line x1="427.5" y1="119" x2="480" y2="74" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Metrics aware card -->
    <rect x="365" y="255" width="290" height="36" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="510" y="270" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Effective BW: ~50 GB/s (4× Speedup)</text>
    <text x="510" y="283" text-anchor="middle" font-size="8" fill="#166534">1 switch hop (leaf-local) • Zero spine link contention</text>
  </g>

  <!-- ===== BOTTOM: QUANTITATIVE IMPACT TABLE ===== -->
  <g transform="translate(20, 305)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="640" height="88" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="320" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Quantitative Summary: Switch Hops vs. Collective Latency</text>

    <!-- Header Row -->
    <text x="140" y="36" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Placement Strategy</text>
    <text x="310" y="36" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Switch Traversal</text>
    <text x="470" y="36" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Effective Bandwidth</text>
    <text x="580" y="36" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Relative Speed</text>

    <line x1="20" y1="42" x2="620" y2="42" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Row 1: Unaware -->
    <text x="140" y="58" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b91c1c">Topology-Unaware (Scattered)</text>
    <text x="310" y="58" text-anchor="middle" font-size="8.5" fill="#dc2626">3 hops (Leaf → Spine → Leaf)</text>
    <text x="470" y="58" text-anchor="middle" font-size="8.5" fill="#dc2626">~12 GB/s per rank</text>
    <text x="580" y="58" text-anchor="middle" font-size="8.5" font-weight="700" fill="#dc2626">1.0×</text>

    <!-- Row 2: Aware -->
    <text x="140" y="75" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Topology-Aware (Packed)</text>
    <text x="310" y="75" text-anchor="middle" font-size="8.5" font-weight="600" fill="#16a34a">1 hop (Local Leaf only)</text>
    <text x="470" y="75" text-anchor="middle" font-size="8.5" font-weight="600" fill="#16a34a">~50 GB/s per rank</text>
    <text x="580" y="75" text-anchor="middle" font-size="8.5" font-weight="700" fill="#16a34a">4.2× Faster</text>
  </g>

  <!-- Global Footer Note -->
  <text x="340" y="414" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-style="italic" fill="#64748b">Topology-aware placement keeps high-bandwidth tensor parallel groups within single leaf switch domains, eliminating spine oversubscription.</text>
</svg>
