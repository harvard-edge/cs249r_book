<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <rect width="700" height="440" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Subtitle -->
  <text x="350" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">LLM autoscaling control loop: key-value (KV) cache memory pressure — not raw SM compute — drives replica decisions</text>

  <!-- ===== STEP 1: MONITOR (Green) ===== -->
  <g transform="translate(30, 50)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="170" height="96" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">1. Continuous Monitor</text>
    <rect x="15" y="32" width="140" height="20" rx="2" fill="#dcfce7"/>
    <text x="85" y="46" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">KV Cache Occupancy</text>
    <text x="85" y="66" text-anchor="middle" font-size="7.5" fill="#475569">+ Queue backlog depth</text>
    <text x="85" y="78" text-anchor="middle" font-size="7.5" fill="#475569">+ Pending token arrival rate</text>
    <text x="85" y="90" text-anchor="middle" font-size="7.5" fill="#166534">PagedAttention block leak check</text>
  </g>

  <!-- Arrow: Step 1 -> Step 2 -->
  <line x1="202" y1="98" x2="258" y2="98" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="230" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">metrics</text>

  <!-- ===== STEP 2: THRESHOLD EVALUATION (Diamond, Amber) ===== -->
  <g transform="translate(260, 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <polygon points="55,0 110,50 55,100 0,50" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="55" y="44" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Evaluate</text>
    <text x="55" y="56" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Threshold</text>
    <text x="55" y="68" text-anchor="middle" font-size="7" fill="#78350f">&gt;75% / &lt;40%</text>
  </g>

  <!-- Transition Up: Above Threshold (>75%) -->
  <path d="M 370,75 L 435,58" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="375" y="48" width="55" height="15" rx="2" fill="#e0f2fe"/>
  <text x="402.5" y="59" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#0369a1">&gt; 75% High</text>

  <!-- Transition Down: Below Threshold (<40%) -->
  <path d="M 370,120 L 435,138" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <rect x="375" y="130" width="55" height="15" rx="2" fill="#fffbeb"/>
  <text x="402.5" y="141" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#b45309">&lt; 40% Low</text>

  <!-- ===== STEP 3A: SCALE UP (Blue) ===== -->
  <g transform="translate(440, 25)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="230" height="66" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
    <text x="14" y="20" font-size="9.5" font-weight="700" fill="#0369a1">Scale Up (Add Replicas)</text>
    <text x="14" y="34" font-size="8" fill="#334155">• Cooldown: 0 min (aggressive response)</text>
    <text x="14" y="46" font-size="8" fill="#334155">• Headroom buffer to prevent OOM evictions</text>
    <text x="14" y="58" font-size="7.5" font-weight="600" fill="#0284c7">Guarantees P99 First-Token-Time (TTFT) SLO</text>
  </g>

  <!-- ===== STEP 3B: SCALE DOWN (Amber) ===== -->
  <g transform="translate(440, 105)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="230" height="66" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
    <text x="14" y="20" font-size="9.5" font-weight="700" fill="#b45309">Scale Down (Reclaim GPUs)</text>
    <text x="14" y="34" font-size="8" fill="#334155">• Cooldown: 15–30 min (conservative)</text>
    <text x="14" y="46" font-size="8" fill="#334155">• Graceful drain of active generation streams</text>
    <text x="14" y="58" font-size="7.5" font-weight="600" fill="#b45309">Asymmetric hysteresis prevents replica thrashing</text>
  </g>

  <!-- Loopback Arrow to Monitor -->
  <path d="M 670,58 H 685 V 190 H 115 V 150" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="640" y="185" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Continuous Control Feedback Loop</text>

  <!-- ===== BOTTOM PANEL: "NOT GPU UTILIZATION" CONTRAST ===== -->
  <g transform="translate(30, 205)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Left Warning Card: Why GPU Compute Fails -->
    <rect x="0" y="0" width="310" height="175" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="16" y="22" font-size="10" font-weight="700" fill="#b91c1c">Anti-Pattern: Scaling on Raw GPU Utilization</text>

    <!-- Cross symbol -->
    <circle cx="280" cy="20" r="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="280" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">✕</text>

    <text x="16" y="42" font-size="8.5" font-weight="600" fill="#7f1d1d">Long-context decodes saturate memory, not compute:</text>
    <text x="16" y="58" font-size="8" fill="#475569">• GPU SM compute can sit at &lt; 45% during generation</text>
    <text x="16" y="72" font-size="8" fill="#475569">• Meanwhile, 80 GB KV cache reaches 95% capacity</text>
    <text x="16" y="86" font-size="8" fill="#475569">• HPA looking at compute will never trigger scale-out</text>
    <text x="16" y="100" font-size="8" font-weight="700" fill="#b91c1c">• Result: Out-Of-Memory panic &amp; dropped requests</text>

    <line x1="16" y1="110" x2="294" y2="110" stroke="#fecaca" stroke-width="1"/>
    <text x="16" y="126" font-size="8" font-weight="600" fill="#0f172a">Failure Mode:</text>
    <text x="16" y="140" font-size="7.5" fill="#b91c1c">Autoregressive decoding is memory-bandwidth bound.</text>
    <text x="16" y="152" font-size="7.5" fill="#b91c1c">Scaling on SM load misdiagnoses memory starvation.</text>
  </g>

  <!-- Right Explanation Card: Memory-Bound Scaling Mechanics -->
  <g transform="translate(360, 205)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="310" height="175" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="16" y="22" font-size="10" font-weight="700" fill="#0f172a">Correct Pattern: Dual-Signal Scaling Policy</text>

    <rect x="250" y="12" width="46" height="18" rx="2" fill="#dcfce7"/>
    <text x="273" y="24.5" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Target</text>

    <text x="16" y="42" font-size="8.5" font-weight="600" fill="#0369a1">Formula: S_composite = max(U_compute, P_memory)</text>
    <text x="16" y="58" font-size="8" fill="#475569">• P_memory = (KV_allocated + KV_pending) / KV_total</text>
    <text x="16" y="72" font-size="8" fill="#475569">• U_compute = Observed SM active fraction</text>
    <text x="16" y="86" font-size="8" fill="#475569">• Trigger scale-up if S_composite &gt; 0.75</text>
    <text x="16" y="100" font-size="8" fill="#475569">• Incorporate cold-start pre-warmup (2–5 min model load)</text>

    <line x1="16" y1="110" x2="294" y2="110" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="126" font-size="8" font-weight="600" fill="#15803d">Asymmetric Cooldown:</text>
    <text x="16" y="140" font-size="7.5" fill="#475569">Immediate scale-up absorbs unpredictable traffic spikes.</text>
    <text x="16" y="152" font-size="7.5" fill="#475569">Delayed scale-down (20 min) prevents weight reload flap.</text>
  </g>

  <!-- Global Footer Note -->
  <text x="350" y="416" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-style="italic" fill="#64748b">Inference engines (vLLM, TensorRT-LLM) expose Prometheus metrics for KV cache block usage to drive Kubernetes custom HPAs.</text>
</svg>