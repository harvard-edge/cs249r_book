<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Backfill under a reservation. GPU pool (vertical) against time (horizontal). Running jobs hold the upper GPUs until the reservation start; the head-of-queue gang is reserved the whole pool from that moment. Free GPUs before the reservation form the backfill window: a short job that ends before the reservation is admitted; a longer job that would overrun it is held. Schematic, no measured values. -->
  <defs>
    <pattern id="win" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="2"/>
    </pattern>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="270" fill="#ffffff"/>

  <!-- axes -->
  <text x="58" y="146" text-anchor="middle" font-size="11" fill="#475569" transform="rotate(-90 58 146)">GPUs in the pool</text>
  <line x1="80" y1="52" x2="80" y2="236" stroke="#64748b" stroke-width="1"/>
  <path d="M80,236 H640" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="80" y="252" text-anchor="middle" font-size="11" fill="#475569">now</text>
  <text x="638" y="252" text-anchor="end" font-size="11" fill="#475569">time</text>

  <!-- backfill window: free GPUs before the reservation -->
  <rect x="81" y="132" width="279" height="103" fill="url(#win)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="90" y="228" font-size="11" fill="#475569">backfill window (free until the reservation)</text>

  <!-- running jobs on the upper GPUs -->
  <rect x="81" y="52" width="279" height="78" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="220" y="87" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">running jobs</text>
  <text x="220" y="104" text-anchor="middle" font-size="11" fill="#14294E">release their GPUs at the reservation start</text>

  <!-- reservation for the head-of-queue gang -->
  <rect x="362" y="52" width="250" height="183" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="487" y="134" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">reserved for the</text>
  <text x="487" y="151" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">head-of-queue gang</text>
  <text x="487" y="170" text-anchor="middle" font-size="11" fill="#6d28d9">needs every GPU at once</text>
  <line x1="361" y1="40" x2="361" y2="236" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="361" y="32" text-anchor="middle" font-size="11" fill="#6d28d9">reservation start</text>

  <!-- B1: fits, admitted -->
  <rect x="96" y="140" width="200" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="196" y="159" text-anchor="middle" font-size="11.5" fill="#15803d"><tspan font-weight="700">B1</tspan> ends before the start: admitted</text>

  <!-- B2: would overrun the reservation, held -->
  <rect x="96" y="178" width="340" height="30" rx="2" fill="#fee2e2" fill-opacity="0.75" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="228" y="197" text-anchor="middle" font-size="11.5" fill="#b91c1c"><tspan font-weight="700">B2</tspan> would delay the gang: held</text>
</svg>
