<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 410" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="750" height="410" fill="#ffffff"/>

  <defs>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== CHART AREA ===== -->
  <!-- Origin at x=75, y=340. Width=450, Height=260 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Phase Background Zones -->
    <!-- Phase 1: Linear (Green) x=75 to 215 (w=140) -->
    <rect x="75" y="50" width="140" height="290" fill="#f0fdf4" opacity="0.6"/>
    <!-- Phase 2: Sublinear (Amber) x=215 to 355 (w=140) -->
    <rect x="215" y="50" width="140" height="290" fill="#fffbeb" opacity="0.6"/>
    <!-- Phase 3: Saturation (Red) x=355 to 525 (w=170) -->
    <rect x="355" y="50" width="170" height="290" fill="#fef2f2" opacity="0.6"/>

    <!-- Phase Dividers -->
    <line x1="215" y1="50" x2="215" y2="340" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="355" y1="50" x2="355" y2="340" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>

    <!-- Phase Header Badges (Placed at bottom of chart zones, y=308) -->
    <rect x="95" y="308" width="100" height="20" rx="2" fill="#dcfce7"/>
    <text x="145" y="322" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Linear (Compute)</text>

    <rect x="235" y="308" width="100" height="20" rx="2" fill="#fef3c7"/>
    <text x="285" y="322" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Sublinear (Mixed)</text>

    <rect x="390" y="308" width="100" height="20" rx="2" fill="#fee2e2"/>
    <text x="440" y="322" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Saturation (Comm)</text>

    <!-- Axes Lines -->
    <line x1="75" y1="340" x2="525" y2="340" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="75" y1="50" x2="75" y2="340" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Y-Axis Ticks & Labels: 0.0 to 1.0 (step 0.2, 54px per 0.2) -->
    <line x1="68" y1="70" x2="75" y2="70" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="73" text-anchor="end" font-size="8" fill="#64748b">1.0</text>
    <line x1="75" y1="70" x2="525" y2="70" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

    <line x1="68" y1="124" x2="75" y2="124" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="127" text-anchor="end" font-size="8" fill="#64748b">0.8</text>
    <line x1="75" y1="124" x2="525" y2="124" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

    <line x1="68" y1="178" x2="75" y2="178" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="181" text-anchor="end" font-size="8" fill="#64748b">0.6</text>
    <line x1="75" y1="178" x2="525" y2="178" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

    <line x1="68" y1="232" x2="75" y2="232" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="235" text-anchor="end" font-size="8" fill="#64748b">0.4</text>
    <line x1="75" y1="232" x2="525" y2="232" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

    <line x1="68" y1="286" x2="75" y2="286" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="289" text-anchor="end" font-size="8" fill="#64748b">0.2</text>

    <line x1="68" y1="340" x2="75" y2="340" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="343" text-anchor="end" font-size="8" fill="#64748b">0.0</text>

    <!-- Y-Axis Title -->
    <text x="24" y="195" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155" transform="rotate(-90,24,195)">Scaling Efficiency E(k)</text>

    <!-- X-Axis Ticks: 64, 128, 256, 512, 1024, 2048, 4096 -->
    <line x1="75" y1="340" x2="75" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="75" y="358" text-anchor="middle" font-size="8" fill="#64748b">64</text>

    <line x1="145" y1="340" x2="145" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="145" y="358" text-anchor="middle" font-size="8" fill="#64748b">128</text>

    <line x1="215" y1="340" x2="215" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="215" y="358" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">256</text>

    <line x1="285" y1="340" x2="285" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="285" y="358" text-anchor="middle" font-size="8" fill="#64748b">512</text>

    <line x1="355" y1="340" x2="355" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="355" y="358" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">1,024</text>

    <line x1="425" y1="340" x2="425" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="425" y="358" text-anchor="middle" font-size="8" fill="#64748b">2,048</text>

    <line x1="495" y1="340" x2="495" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="495" y="358" text-anchor="middle" font-size="8" fill="#64748b">4,096</text>

    <text x="300" y="380" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">GPU Worker Count (Log Scale)</text>

    <!-- Ideal E=1.0 Reference Line -->
    <line x1="75" y1="70" x2="525" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="520" y="64" text-anchor="end" font-size="7.5" fill="#94a3b8">Ideal Linear (E = 1.0)</text>

    <!-- Phase 1 Line Segment (Green) -->
    <path d="M 75,81 L 145,86 L 215,97" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Phase 2 Line Segment (Amber) -->
    <path d="M 215,97 L 285,121 L 355,156" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Phase 3 Line Segment (Red) -->
    <path d="M 355,156 L 425,200 L 495,227" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Data Points -->
    <circle cx="75" cy="81" r="3.5" fill="#16a34a"/>
    <circle cx="145" cy="86" r="3.5" fill="#16a34a"/>
    <circle cx="215" cy="97" r="3.5" fill="#d97706"/>
    <circle cx="285" cy="121" r="3.5" fill="#d97706"/>
    <circle cx="355" cy="156" r="3.5" fill="#dc2626"/>
    <circle cx="425" cy="200" r="3.5" fill="#dc2626"/>
    <circle cx="495" cy="227" r="3.5" fill="#dc2626"/>

    <!-- Point Labels -->
    <text x="75" y="97" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">96%</text>
    <text x="145" y="102" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">94%</text>
    <text x="215" y="113" text-anchor="middle" font-size="7.5" font-weight="600" fill="#b45309">90%</text>
    <text x="285" y="137" text-anchor="middle" font-size="7.5" font-weight="600" fill="#b45309">81%</text>
    <text x="355" y="172" text-anchor="middle" font-size="7.5" font-weight="600" fill="#b91c1c">68%</text>
    <text x="425" y="216" text-anchor="middle" font-size="7.5" font-weight="600" fill="#b91c1c">52%</text>
    <text x="495" y="243" text-anchor="middle" font-size="7.5" font-weight="600" fill="#b91c1c">42%</text>
  </g>

  <!-- ===== RIGHT SIDE: POLICY & TAKEAWAY CARDS ===== -->
  <g transform="translate(545, 50)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Policy Range Card -->
    <rect x="0" y="0" width="185" height="116" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="12" y="20" font-size="9.5" font-weight="700" fill="#15803d">Enforced Elastic Range</text>
    <text x="12" y="40" font-size="14" font-weight="700" fill="#1F407A">[256, 1024] GPUs</text>
    <text x="12" y="58" font-size="8" font-weight="600" fill="#334155">Min scale: 256 GPUs</text>
    <text x="12" y="72" font-size="7.5" fill="#64748b">Below 256: comm latency wastes allocation</text>
    <text x="12" y="88" font-size="8" font-weight="600" fill="#334155">Max scale: 1,024 GPUs</text>
    <text x="12" y="102" font-size="7.5" fill="#64748b">Above 1024: 5% gain not worth re-sharding</text>

    <!-- Saturation Warning Card -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="185" height="150" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="12" y="20" font-size="9.5" font-weight="700" fill="#b91c1c">Saturation Trap</text>
      <text x="12" y="38" font-size="8" font-weight="600" fill="#7f1d1d">At 4,096 GPUs, efficiency drops to 42%.</text>
      <text x="12" y="54" font-size="7.5" fill="#475569">58% of all compute cycles</text>
      <text x="12" y="66" font-size="7.5" fill="#475569">are lost to AllReduce rings.</text>
      <line x1="12" y1="76" x2="173" y2="76" stroke="#fecaca" stroke-width="1"/>
      <text x="12" y="92" font-size="8" font-weight="600" fill="#0f172a">Scheduler Action:</text>
      <text x="12" y="106" font-size="7.5" fill="#64748b">Withhold nodes &gt;1,024 to</text>
      <text x="12" y="118" font-size="7.5" fill="#64748b">clear pending queue backlog.</text>
      <rect x="12" y="126" width="161" height="20" rx="2" fill="#fee2e2"/>
      <text x="92" y="140" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">Marginal Utility Policy</text>
    </g>
  </g>
</svg>