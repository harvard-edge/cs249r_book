<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="440" fill="#ffffff"/>

  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Subtitle -->
  <text x="350" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Dynamic worker resizing and recovery transitions without aborting the optimization loop</text>

  <!-- ===== CENTRAL STATE: TRAINING (Compute Blue) ===== -->
  <g transform="translate(260, 160)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="180" height="85" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="2"/>
    <text x="90" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Active Training</text>
    <text x="90" y="44" text-anchor="middle" font-size="9" font-weight="600" fill="#0f172a">N active worker ranks</text>
    <text x="90" y="58" text-anchor="middle" font-size="8" fill="#475569">Synchronous AllReduce each step</text>
    <text x="90" y="70" text-anchor="middle" font-size="8" fill="#1F407A">Local batch = B / N</text>

    <!-- Self-Loop: Steady State Progress (Left side) -->
    <path d="M 0,25 C -25,25 -25,60 0,60" fill="none" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
    <text x="-35" y="45" text-anchor="end" font-size="7.5" font-weight="600" fill="#1F407A">Step completion</text>
  </g>

  <!-- ===== STATE 1: SCALE UP (Top-Left, Green) ===== -->
  <g transform="translate(45, 55)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="175" height="75" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="87.5" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">Scale Up (Grow)</text>
    <text x="87.5" y="38" text-anchor="middle" font-size="8.5" fill="#166534">Admit +M spare workers</text>
    <text x="87.5" y="52" text-anchor="middle" font-size="8" fill="#475569">Re-shard data batches</text>
    <text x="87.5" y="64" text-anchor="middle" font-size="8" fill="#15803d">Linear LR warmup step</text>
  </g>

  <!-- Transitions: Training <-> Scale Up -->
  <!-- Forward: Triggered by idle capacity -->
  <path d="M 280,160 Q 200,140 200,132" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <rect x="180" y="142" width="95" height="15" rx="2" fill="#f0fdf4"/>
  <text x="227.5" y="153" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#15803d">Idle GPUs free</text>

  <!-- Return: Workers joined -->
  <path d="M 170,130 Q 230,195 260,195" fill="none" stroke="#1F407A" stroke-width="1.4" stroke-dasharray="4 2" marker-end="url(#arrow-blue)"/>
  <text x="215" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#1F407A">Group rebuilt</text>

  <!-- ===== STATE 2: SCALE DOWN (Top-Right, Amber) ===== -->
  <g transform="translate(480, 55)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="175" height="75" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="87.5" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Scale Down (Shrink)</text>
    <text x="87.5" y="38" text-anchor="middle" font-size="8.5" fill="#78350f">Release -K workers</text>
    <text x="87.5" y="52" text-anchor="middle" font-size="8" fill="#475569">Drain in-flight gradient sync</text>
    <text x="87.5" y="64" text-anchor="middle" font-size="8" fill="#b45309">Recalibrate learning rate</text>
  </g>

  <!-- Transitions: Training <-> Scale Down -->
  <!-- Forward: Higher priority job or spot eviction -->
  <path d="M 420,160 Q 500,140 500,132" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
  <rect x="425" y="142" width="105" height="15" rx="2" fill="#fffbeb"/>
  <text x="477.5" y="153" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b45309">Preempt / high-pri</text>

  <!-- Return: Shards rebalanced -->
  <path d="M 530,130 Q 470,195 440,195" fill="none" stroke="#1F407A" stroke-width="1.4" stroke-dasharray="4 2" marker-end="url(#arrow-blue)"/>
  <text x="485" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#1F407A">Ranks released</text>

  <!-- ===== STATE 3: WORKER REPLACE (Bottom, Fault Red) ===== -->
  <g transform="translate(260, 295)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="180" height="75" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">Worker Replace (Self-Heal)</text>
    <text x="90" y="38" text-anchor="middle" font-size="8.5" fill="#7f1d1d">Substitute 1:1 failed host</text>
    <text x="90" y="52" text-anchor="middle" font-size="8" fill="#475569">Fetch latest micro-checkpoint</text>
    <text x="90" y="64" text-anchor="middle" font-size="8" fill="#b91c1c">Zero batch-size disruption</text>
  </g>

  <!-- Transitions: Training <-> Worker Replace -->
  <!-- Down: Heartbeat failure -->
  <path d="M 330,245 V 293" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="235" y="258" width="90" height="15" rx="2" fill="#fef2f2"/>
  <text x="280" y="269" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b91c1c">Host timeout / ECC</text>

  <!-- Up: Replacement healthy -->
  <path d="M 370,295 V 247" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow-blue)"/>
  <rect x="375" y="258" width="90" height="15" rx="2" fill="#f0f9ff"/>
  <text x="420" y="269" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#1F407A">Hot spare joined</text>

  <!-- Side Transition: Spot Reclamation mid-scale down directly into replace -->
  <path d="M 567,130 Q 567,332 442,332" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow-red)"/>
  <text x="575" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#dc2626" transform="rotate(90,575,240)">Spot 30s deadline</text>

  <!-- Invariant Banner -->
  <rect x="110" y="385" width="480" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="350" y="401" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#334155">Core Invariant: Model parameters and optimizer states remain continuous across all worker transitions.</text>

  <!-- Global Footer Note -->
  <text x="350" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-style="italic" fill="#64748b">Elastic frameworks (TorchElastic, Horovod Elastic) adjust world size dynamically without terminating the user script.</text>
</svg>
