<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Nested topology domains: node (NVLink via NVSwitch) inside rack (leaf switch) inside pod (spine). Amber = communication fabric and its per-direction bandwidth; blue = GPUs; slate = structural containers. -->
  <rect width="680" height="250" fill="#ffffff"/>
  <rect x="10" y="10" width="660" height="230" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="22" y="30" font-size="13" font-weight="700" fill="#0f172a">Pod (spine switches)</text>
  <text x="658" y="30" text-anchor="end" font-size="12" font-weight="700" fill="#b45309">~12.5–25 GB/s per endpoint, oversubscribed</text>
  <rect x="22" y="40" width="476" height="188" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="34" y="60" font-size="13" font-weight="700" fill="#0f172a">Rack (leaf switch)</text>
  <text x="486" y="60" text-anchor="end" font-size="12" font-weight="700" fill="#b45309">50 GB/s per direction</text>
  <rect x="34" y="70" width="316" height="146" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="46" y="90" font-size="13" font-weight="700" fill="#0f172a">Node (NVLink)</text>
  <text x="338" y="90" text-anchor="end" font-size="12" font-weight="700" fill="#b45309">450 GB/s per direction</text>
  <line x1="61.5" y1="136" x2="61.5" y2="166" stroke="#d97706" stroke-width="1.2"/>
  <rect x="46" y="102" width="31" height="34" rx="2" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="61.5" y="123.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G0</text>
  <line x1="98.5" y1="136" x2="98.5" y2="166" stroke="#d97706" stroke-width="1.2"/>
  <rect x="83" y="102" width="31" height="34" rx="2" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="98.5" y="123.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G1</text>
  <line x1="135.5" y1="136" x2="135.5" y2="166" stroke="#d97706" stroke-width="1.2"/>
  <rect x="120" y="102" width="31" height="34" rx="2" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="135.5" y="123.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G2</text>
  <line x1="172.5" y1="136" x2="172.5" y2="166" stroke="#d97706" stroke-width="1.2"/>
  <rect x="157" y="102" width="31" height="34" rx="2" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="172.5" y="123.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G3</text>
  <line x1="209.5" y1="136" x2="209.5" y2="166" stroke="#d97706" stroke-width="1.2"/>
  <rect x="194" y="102" width="31" height="34" rx="2" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="209.5" y="123.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G4</text>
  <line x1="246.5" y1="136" x2="246.5" y2="166" stroke="#d97706" stroke-width="1.2"/>
  <rect x="231" y="102" width="31" height="34" rx="2" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="246.5" y="123.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G5</text>
  <line x1="283.5" y1="136" x2="283.5" y2="166" stroke="#d97706" stroke-width="1.2"/>
  <rect x="268" y="102" width="31" height="34" rx="2" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="283.5" y="123.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G6</text>
  <line x1="320.5" y1="136" x2="320.5" y2="166" stroke="#d97706" stroke-width="1.2"/>
  <rect x="305" y="102" width="31" height="34" rx="2" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="320.5" y="123.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">G7</text>
  <rect x="46" y="166" width="292" height="30" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="192" y="185.5" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">NVSwitch</text>
  <rect x="362" y="70" width="124" height="146" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="424" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">more nodes</text>
  <text x="424" y="161" text-anchor="middle" font-size="12" fill="#64748b">under this leaf</text>
  <rect x="510" y="40" width="148" height="188" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="584" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">more racks</text>
  <text x="584" y="153" text-anchor="middle" font-size="12" fill="#64748b">under the spine</text>
</svg>
