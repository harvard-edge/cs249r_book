<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="100%" height="100%">
  <rect width="720" height="460" fill="#ffffff"/>

  <defs>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Subtitle -->
  <text x="360" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Physical nesting of accelerator interconnect domains: each boundary crossing incurs an order-of-magnitude bandwidth cliff</text>

  <!-- ===== OUTERMOST CONTAINER: POD / FABRIC (Amber) ===== -->
  <g transform="translate(25, 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="490" height="360" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <!-- Header Badge -->
    <rect x="15" y="12" width="140" height="22" rx="2" fill="#d97706"/>
    <text x="85" y="27" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Pod / Fabric Domain</text>
    <text x="240" y="27" font-size="8" fill="#92400e">Cross-rack Spine: ~25 GB/s effective (2:1 oversubscribed)</text>

    <!-- ===== MIDDLE CONTAINER: RACK (Purple) ===== -->
    <g transform="translate(20, 46)">
      <rect x="0" y="0" width="450" height="290" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
      <!-- Header Badge -->
      <rect x="15" y="12" width="170" height="22" rx="2" fill="#7c3aed"/>
      <text x="100" y="27" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Rack / Leaf Switch Domain</text>
      <text x="260" y="27" font-size="8" fill="#5b21b6">InfiniBand NDR: 50 GB/s per port (400 Gbps)</text>

      <!-- ===== INNER CONTAINER: NODE (Blue) ===== -->
      <g transform="translate(20, 46)">
        <rect x="0" y="0" width="410" height="220" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
        <!-- Header Badge -->
        <rect x="15" y="12" width="160" height="22" rx="2" fill="#0284c7"/>
        <text x="95" y="27" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Node (Single Server Chassis)</text>
        <text x="235" y="27" font-size="8" fill="#0369a1">NVLink 4: 900 GB/s bidirectional</text>

        <!-- 8 GPUs in Chassis -->
        <g transform="translate(15, 48)">
          <!-- GPU 0..7 -->
          <g transform="translate(0, 0)">
            <rect width="42" height="48" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
            <text x="21" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU 0</text>
            <text x="21" y="36" text-anchor="middle" font-size="7.5" fill="#0369a1">80 GB</text>
          </g>
          <g transform="translate(48, 0)">
            <rect width="42" height="48" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
            <text x="21" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU 1</text>
            <text x="21" y="36" text-anchor="middle" font-size="7.5" fill="#0369a1">80 GB</text>
          </g>
          <g transform="translate(96, 0)">
            <rect width="42" height="48" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
            <text x="21" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU 2</text>
            <text x="21" y="36" text-anchor="middle" font-size="7.5" fill="#0369a1">80 GB</text>
          </g>
          <g transform="translate(144, 0)">
            <rect width="42" height="48" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
            <text x="21" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU 3</text>
            <text x="21" y="36" text-anchor="middle" font-size="7.5" fill="#0369a1">80 GB</text>
          </g>
          <g transform="translate(192, 0)">
            <rect width="42" height="48" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
            <text x="21" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU 4</text>
            <text x="21" y="36" text-anchor="middle" font-size="7.5" fill="#0369a1">80 GB</text>
          </g>
          <g transform="translate(240, 0)">
            <rect width="42" height="48" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
            <text x="21" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU 5</text>
            <text x="21" y="36" text-anchor="middle" font-size="7.5" fill="#0369a1">80 GB</text>
          </g>
          <g transform="translate(288, 0)">
            <rect width="42" height="48" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
            <text x="21" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU 6</text>
            <text x="21" y="36" text-anchor="middle" font-size="7.5" fill="#0369a1">80 GB</text>
          </g>
          <g transform="translate(336, 0)">
            <rect width="42" height="48" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
            <text x="21" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU 7</text>
            <text x="21" y="36" text-anchor="middle" font-size="7.5" fill="#0369a1">80 GB</text>
          </g>
        </g>

        <!-- NVSwitch Crossbar Fabric -->
        <g transform="translate(15, 110)">
          <rect width="378" height="42" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
          <text x="189" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#0369a1">NVSwitch Intra-Node Crossbar</text>
          <text x="189" y="33" text-anchor="middle" font-size="7.5" fill="#0284c7">Full mesh all-to-all: 900 GB/s per GPU • zero OS/PCIe overhead</text>

          <!-- Traces to GPUs -->
          <line x1="21" y1="0" x2="21" y2="-14" stroke="#0284c7" stroke-width="1.2" opacity="0.6"/>
          <line x1="69" y1="0" x2="69" y2="-14" stroke="#0284c7" stroke-width="1.2" opacity="0.6"/>
          <line x1="117" y1="0" x2="117" y2="-14" stroke="#0284c7" stroke-width="1.2" opacity="0.6"/>
          <line x1="165" y1="0" x2="165" y2="-14" stroke="#0284c7" stroke-width="1.2" opacity="0.6"/>
          <line x1="213" y1="0" x2="213" y2="-14" stroke="#0284c7" stroke-width="1.2" opacity="0.6"/>
          <line x1="261" y1="0" x2="261" y2="-14" stroke="#0284c7" stroke-width="1.2" opacity="0.6"/>
          <line x1="309" y1="0" x2="309" y2="-14" stroke="#0284c7" stroke-width="1.2" opacity="0.6"/>
          <line x1="357" y1="0" x2="357" y2="-14" stroke="#0284c7" stroke-width="1.2" opacity="0.6"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== RIGHT SIDE: BANDWIDTH CLIFF CARDS ===== -->
  <g transform="translate(530, 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Card 1: Node Tier -->
    <rect x="0" y="0" width="165" height="98" rx="4" fill="#f0f9ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="12" y="20" font-size="9" font-weight="700" fill="#0369a1">Tier 1: Intra-Node</text>
    <text x="12" y="38" font-size="14" font-weight="700" fill="#0284c7">900 GB/s</text>
    <text x="12" y="54" font-size="7.5" fill="#0369a1">NVLink Mesh (NVSwitch)</text>
    <text x="12" y="70" font-size="7.5" fill="#64748b">Latency: &lt; 1 µs</text>
    <rect x="12" y="76" width="141" height="14" rx="2" fill="#e0f2fe"/>
    <text x="82.5" y="86.5" text-anchor="middle" font-size="7" font-weight="600" fill="#0369a1">Tensor Parallelism (TP)</text>

    <!-- Downward Cliff 1 -->
    <line x1="82.5" y1="102" x2="82.5" y2="126" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow-red)"/>
    <rect x="92" y="106" width="68" height="16" rx="2" fill="#fee2e2"/>
    <text x="126" y="117" text-anchor="middle" font-size="7" font-weight="700" fill="#dc2626">18× Drop</text>

    <!-- Card 2: Rack Tier -->
    <rect x="0" y="130" width="165" height="98" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="12" y="150" font-size="9" font-weight="700" fill="#6d28d9">Tier 2: Intra-Rack</text>
    <text x="12" y="168" font-size="14" font-weight="700" fill="#7c3aed">50 GB/s</text>
    <text x="12" y="184" font-size="7.5" fill="#5b21b6">InfiniBand NDR Leaf</text>
    <text x="12" y="200" font-size="7.5" fill="#64748b">Latency: 2–5 µs</text>
    <rect x="12" y="206" width="141" height="14" rx="2" fill="#f3e8ff"/>
    <text x="82.5" y="216.5" text-anchor="middle" font-size="7" font-weight="600" fill="#6d28d9">Pipeline Parallelism (PP)</text>

    <!-- Downward Cliff 2 -->
    <line x1="82.5" y1="232" x2="82.5" y2="256" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow-red)"/>
    <rect x="92" y="236" width="68" height="16" rx="2" fill="#fee2e2"/>
    <text x="126" y="247" text-anchor="middle" font-size="7" font-weight="700" fill="#dc2626">2× Drop (36×)</text>

    <!-- Card 3: Pod/Spine Tier -->
    <rect x="0" y="260" width="165" height="100" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="12" y="280" font-size="9" font-weight="700" fill="#b45309">Tier 3: Inter-Rack</text>
    <text x="12" y="298" font-size="14" font-weight="700" fill="#d97706">~25 GB/s</text>
    <text x="12" y="314" font-size="7.5" fill="#78350f">Spine Switch Fabric (2:1)</text>
    <text x="12" y="330" font-size="7.5" fill="#64748b">Latency: 10–30 µs (tail-heavy)</text>
    <rect x="12" y="336" width="141" height="14" rx="2" fill="#fef3c7"/>
    <text x="82.5" y="346.5" text-anchor="middle" font-size="7" font-weight="600" fill="#b45309">Data Parallelism (DP)</text>
  </g>

  <!-- Global Footer Note -->
  <text x="360" y="432" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-style="italic" fill="#64748b">Hierarchical schedulers match 3D parallelism strategies (TP, PP, DP) strictly to their matching hardware bandwidth domains.</text>
</svg>