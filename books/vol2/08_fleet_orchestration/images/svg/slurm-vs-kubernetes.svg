<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Left: Slurm, an imperative request flows once from job script to slurmctld to slurmd on the allocated nodes. Right: Kubernetes, declared state is stored in etcd and a controller loop observes pods and reconciles them. Violet = control plane (coordination), blue = compute, slate = user input. -->
  <defs>
    <marker id="arr-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="330" fill="#ffffff"/>
  <line x1="340" y1="8" x2="340" y2="322" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="170" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Slurm (imperative)</text>
  <rect x="60" y="32" width="220" height="46" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="170" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Job script</text>
  <text x="170" y="68" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#475569">sbatch --gres=gpu:8 --nodes=4</text>
  <path d="M170,78 V100" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="60" y="102" width="220" height="46" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="170" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">slurmctld</text>
  <text x="170" y="138" text-anchor="middle" font-size="11.5" fill="#475569">one global scheduler</text>
  <path d="M170,148 V170" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="60" y="172" width="220" height="46" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="170" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">slurmd on each node</text>
  <text x="170" y="208" text-anchor="middle" font-size="11.5" fill="#475569">launch on the allocation</text>
  <path d="M170,218 V230 M56,230 H284 M56,230 V240 M132,230 V240 M208,230 V240 M284,230 V240" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <rect x="24" y="242" width="64" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="56" y="262.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Node 0</text>
  <rect x="100" y="242" width="64" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="132" y="262.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Node 1</text>
  <rect x="176" y="242" width="64" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="208" y="262.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Node 2</text>
  <rect x="252" y="242" width="64" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="284" y="262.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Node 3</text>
  <text x="170" y="306" text-anchor="middle" font-size="13" fill="#475569">all nodes granted at once, or the job waits</text>
  <text x="510" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Kubernetes (declarative)</text>
  <rect x="400" y="32" width="220" height="46" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="510" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Desired state</text>
  <text x="510" y="68" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#475569">kubectl apply -f job.yaml</text>
  <path d="M510,78 V100" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="400" y="102" width="220" height="46" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="510" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">API server + etcd</text>
  <text x="510" y="138" text-anchor="middle" font-size="11.5" fill="#475569">stores the desired state</text>
  <path d="M510,148 V170" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="400" y="172" width="220" height="46" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="510" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Controllers</text>
  <text x="510" y="208" text-anchor="middle" font-size="11.5" fill="#475569">reconcile actual to desired</text>
  <path d="M490,218 V230 M396,230 H624 M396,230 V240 M472,230 V240 M548,230 V240 M624,230 V240" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <rect x="364" y="242" width="64" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="396" y="262.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Pod 0</text>
  <rect x="440" y="242" width="64" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="472" y="262.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Pod 1</text>
  <rect x="516" y="242" width="64" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="548" y="262.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Pod 2</text>
  <rect x="592" y="242" width="64" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="624" y="262.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Pod 3</text>
  <path d="M656,258 H666 V195 H622" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-violet)"/>
  <text x="510" y="306" text-anchor="middle" font-size="13" fill="#475569">observed state is reconciled continuously</text>
</svg>
