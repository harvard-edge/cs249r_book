<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Vertical Divider -->
  <line x1="340" y1="16" x2="340" y2="330" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== LEFT: SLURM (IMPERATIVE) ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="170" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#1F407A">Slurm (Imperative HPC)</text>
    <text x="170" y="38" text-anchor="middle" font-size="8.5" fill="#64748b">Exact resource specification · Authoritative start guarantee</text>

    <!-- User Box -->
    <rect x="95" y="52" width="150" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="170" y="69" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">1. User Submits Script</text>
    <text x="170" y="83" text-anchor="middle" font-size="8" fill="#0c4a6e">sbatch --gres=gpu:8 --nodes=4</text>

    <!-- Arrow down -->
    <line x1="170" y1="94" x2="170" y2="114" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

    <!-- Central Scheduler Box -->
    <rect x="85" y="116" width="170" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="170" y="133" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">2. Central Scheduler (slurmctld)</text>
    <text x="170" y="147" text-anchor="middle" font-size="8" fill="#475569">Single authoritative global cluster state</text>

    <!-- Arrow down -->
    <line x1="170" y1="160" x2="170" y2="180" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

    <!-- Node Manager Box -->
    <rect x="85" y="182" width="170" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="170" y="199" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">3. Node Execution (slurmd)</text>
    <text x="170" y="213" text-anchor="middle" font-size="8" fill="#475569">Local execution on dedicated hardware</text>

    <!-- Arrow down -->
    <line x1="170" y1="226" x2="170" y2="246" stroke="#1F407A" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

    <!-- Dedicated GPU Allocation (4 GPUs representation) -->
    <g transform="translate(70, 248)">
      <rect x="0" y="0" width="44" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="22" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">GPU 0</text>
      <rect x="52" y="0" width="44" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="74" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">GPU 1</text>
      <rect x="104" y="0" width="44" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="126" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">GPU 2</text>
      <rect x="156" y="0" width="44" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="178" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">GPU 3</text>
    </g>

    <!-- Guarantee Pill -->
    <rect x="25" y="286" width="290" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="170" y="300" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d4ed8">Atomic Guarantee: 100% Granted or Stays in Queue</text>
    <text x="170" y="312" text-anchor="middle" font-size="7.5" fill="#1e40af">Zero container virtualization overhead · Ideal for multi-node MPI/NCCL</text>
  </g>

  <!-- ===== RIGHT: KUBERNETES (DECLARATIVE) ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="510" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Kubernetes (Declarative Cloud)</text>
    <text x="510" y="38" text-anchor="middle" font-size="8.5" fill="#64748b">Desired state declaration · Continuous reconciliation loop</text>

    <!-- User Box -->
    <rect x="435" y="52" width="150" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="510" y="69" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">1. User Declares State</text>
    <text x="510" y="83" text-anchor="middle" font-size="8" fill="#166534">kubectl apply -f deployment.yaml</text>

    <!-- Arrow down -->
    <line x1="510" y1="94" x2="510" y2="114" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>

    <!-- API Server Box -->
    <rect x="425" y="116" width="170" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="510" y="133" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">2. API Server &amp; etcd</text>
    <text x="510" y="147" text-anchor="middle" font-size="8" fill="#475569">Persists target spec in distributed store</text>

    <!-- Arrow down -->
    <line x1="510" y1="160" x2="510" y2="180" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>

    <!-- Controller Reconcile Box -->
    <rect x="425" y="182" width="170" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="510" y="199" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">3. Controller Manager Loop</text>
    <text x="510" y="213" text-anchor="middle" font-size="8" fill="#475569">Continuous loop: actual → desired state</text>

    <!-- Arrow down -->
    <line x1="510" y1="226" x2="510" y2="246" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>

    <!-- Pod Containers Allocation (4 Pods) -->
    <g transform="translate(410, 248)">
      <rect x="0" y="0" width="44" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="22" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Pod 0</text>
      <rect x="52" y="0" width="44" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="74" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Pod 1</text>
      <rect x="104" y="0" width="44" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="126" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Pod 2</text>
      <rect x="156" y="0" width="44" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="178" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Pod 3</text>
    </g>

    <!-- Self-Healing Pill -->
    <rect x="365" y="286" width="290" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="510" y="300" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Self-Healing: Autonomous Node &amp; Pod Replacement</text>
    <text x="510" y="312" text-anchor="middle" font-size="7.5" fill="#166534">Dynamic scaling &amp; rolling upgrades · Ideal for inference &amp; microservices</text>
  </g>

  <!-- ===== BOTTOM SUMMARY COMPARISON ===== -->
  <g transform="translate(25, 335)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="630" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="315" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Architectural Convergence: Complementary Roles in Production Fleets</text>
    <line x1="20" y1="24" x2="610" y2="24" stroke="#e2e8f0" stroke-width="1"/>
    <text x="150" y="39" text-anchor="middle" font-size="8" font-weight="600" fill="#1F407A">Slurm: Dedicated large-scale batch pretraining</text>
    <text x="150" y="50" text-anchor="middle" font-size="7.5" fill="#64748b">Deterministic topology placement &amp; bare-metal performance</text>
    <line x1="315" y1="28" x2="315" y2="52" stroke="#e2e8f0" stroke-width="1"/>
    <text x="470" y="39" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Kubernetes: Inference serving &amp; pipeline lifecycle</text>
    <text x="470" y="50" text-anchor="middle" font-size="7.5" fill="#64748b">Dynamic elasticity, HPA, and multi-tenant service orchestration</text>
  </g>
</svg>