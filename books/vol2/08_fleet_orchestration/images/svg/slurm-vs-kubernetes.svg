<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Left: Slurm, a straight line. An imperative request flows once, top to bottom, from job script to slurmctld to slurmd, which launches one atomic allocation of four nodes (dashed violet outline). Right: Kubernetes, a closed loop. etcd holds desired and observed state; controllers watch the gap and recreate the failed pod; pod status returns to observed state as a peer edge of the cycle. Violet = control plane, blue = compute, red = a failed pod, slate = user input. -->
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="356" fill="#ffffff"/>
  <line x1="340" y1="20" x2="340" y2="336" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <!-- ===== Slurm: one-way line ===== -->
  <text x="170" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Slurm (imperative)</text>
  <rect x="60" y="44" width="220" height="46" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="170" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Job script</text>
  <text x="170" y="80" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#475569">sbatch --gres=gpu:8 --nodes=4</text>
  <path d="M170,90 V110" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="60" y="112" width="220" height="46" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="170" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">slurmctld</text>
  <text x="170" y="148" text-anchor="middle" font-size="11.5" fill="#475569">one global scheduler</text>
  <path d="M170,158 V178" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="60" y="180" width="220" height="46" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="170" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">slurmd on each node</text>
  <text x="170" y="216" text-anchor="middle" font-size="11.5" fill="#475569">launch on the allocation</text>
  <path d="M170,226 V236 M62,236 H278 M62,236 V248 M134,236 V248 M206,236 V248 M278,236 V248" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <rect x="24" y="248" width="292" height="48" rx="3" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 2"/>
  <rect x="32" y="256" width="60" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="62" y="276.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Node 0</text>
  <rect x="104" y="256" width="60" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="134" y="276.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Node 1</text>
  <rect x="176" y="256" width="60" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="206" y="276.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Node 2</text>
  <rect x="248" y="256" width="60" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="278" y="276.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Node 3</text>
  <text x="170" y="330" text-anchor="middle" font-size="13" fill="#475569">all nodes granted at once, or the job waits</text>
  <!-- ===== Kubernetes: closed reconcile loop ===== -->
  <text x="510" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Kubernetes (declarative)</text>
  <rect x="400" y="44" width="220" height="46" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="510" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Desired state</text>
  <text x="510" y="80" text-anchor="middle" font-size="11.5" font-family="Courier New, monospace" fill="#475569">kubectl apply -f job.yaml</text>
  <path d="M510,90 V110" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <!-- etcd: top of the cycle -->
  <rect x="410" y="112" width="200" height="52" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="510" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">API server + etcd</text>
  <rect x="416" y="139" width="92" height="18" rx="2" fill="#ffffff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="462" y="152" text-anchor="middle" font-size="11" fill="#334155">desired: 4 pods</text>
  <rect x="512" y="139" width="92" height="18" rx="2" fill="#ffffff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="558" y="152" text-anchor="middle" font-size="11" fill="#334155">observed: 3</text>
  <!-- controllers: lower right of the cycle -->
  <rect x="540" y="236" width="110" height="46" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="595" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Controllers</text>
  <text x="595" y="272" text-anchor="middle" font-size="11.5" fill="#475569">act on the gap</text>
  <!-- pods: lower left of the cycle -->
  <rect x="360" y="226" width="128" height="66" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="368" y="232" width="52" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="394" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Pod 0</text>
  <rect x="428" y="232" width="52" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="454" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Pod 1</text>
  <rect x="368" y="262" width="52" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="394" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Pod 2</text>
  <rect x="428" y="262" width="52" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="454" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Pod 3</text>
  <text x="454" y="306" text-anchor="middle" font-size="11" fill="#b91c1c">failed</text>
  <!-- the three edges of the loop -->
  <path d="M580,164 C580,200 595,200 595,234" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <text x="599" y="203" font-size="11" fill="#6d28d9">watch</text>
  <path d="M540,259 H490" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <text x="514" y="251" text-anchor="middle" font-size="11" fill="#6d28d9">recreate</text>
  <path d="M424,226 C424,196 440,196 440,166" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <text x="422" y="203" text-anchor="end" font-size="11" fill="#6d28d9">status</text>
  <text x="510" y="200" text-anchor="middle" font-size="12" font-style="italic" fill="#6d28d9">reconcile loop</text>
  <text x="510" y="330" text-anchor="middle" font-size="13" fill="#475569">observed state is reconciled continuously</text>
</svg>
