<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Each parallelism dimension (left) is placed on the tightest topology domain its traffic needs (right). Amber arrows = communication, labeled with the per-direction bandwidth of that domain; blue = hardware domain. -->
  <defs><marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker></defs>
  <rect width="680" height="236" fill="#ffffff"/>
  <rect x="20" y="12" width="230" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="135" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Tensor parallelism (TP)</text>
  <text x="135" y="56" text-anchor="middle" font-size="12" fill="#475569">activations at every layer</text>
  <path d="M250,42 H408" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="330" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">NVLink, 450 GB/s</text>
  <rect x="410" y="12" width="250" height="60" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="535" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">One node</text>
  <text x="535" y="56" text-anchor="middle" font-size="12" fill="#475569">8 GPUs on one NVSwitch</text>
  <rect x="20" y="88" width="230" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="135" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Pipeline parallelism (PP)</text>
  <text x="135" y="132" text-anchor="middle" font-size="12" fill="#475569">activations at stage boundaries</text>
  <path d="M250,118 H408" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="330" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">leaf, 50 GB/s</text>
  <rect x="410" y="88" width="250" height="60" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="535" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Adjacent nodes, one rack</text>
  <text x="535" y="132" text-anchor="middle" font-size="12" fill="#475569">stages 0, 1, 2 on nodes A, B, C</text>
  <rect x="20" y="164" width="230" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="135" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Data parallelism (DP)</text>
  <text x="135" y="208" text-anchor="middle" font-size="12" fill="#475569">gradients once per step</text>
  <path d="M250,194 H408" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="330" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">spine, ~12.5–25 GB/s</text>
  <rect x="410" y="164" width="250" height="60" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="535" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Across racks</text>
  <text x="535" y="208" text-anchor="middle" font-size="12" fill="#475569">replicas in racks 1 to N</text>
</svg>
