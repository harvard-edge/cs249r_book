<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="440" fill="#ffffff"/>

  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-purple" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Subtitle -->
  <text x="350" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Bandwidth-matched placement: mapping 3D parallelism strategies to hardware interconnect domains</text>

  <!-- Column Headers -->
  <g transform="translate(30, 36)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="130" y="14" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">Parallelism Strategy</text>
    <text x="320" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="#94a3b8">Interconnect Requirement</text>
    <text x="510" y="14" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">Target Hardware Domain</text>
  </g>

  <!-- ===== ROW 1: TENSOR PARALLELISM -> NVLINK (Blue) ===== -->
  <g transform="translate(30, 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Left Card: Strategy -->
    <rect x="0" y="0" width="260" height="98" rx="4" fill="#f0f9ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="16" y="22" font-size="10.5" font-weight="700" fill="#14294E">Tensor Parallelism (TP)</text>
    <text x="16" y="40" font-size="8.5" fill="#334155">Splits matrix ops (GEMM) across ranks</text>
    <text x="16" y="54" font-size="8" fill="#64748b">Exchanges activations at every layer</text>
    <rect x="16" y="66" width="130" height="18" rx="2" fill="#EAF1F8"/>
    <text x="81" y="78.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">Highest Bandwidth Need</text>

    <!-- Connector Arrow -->
    <line x1="262" y1="49" x2="375" y2="49" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <rect x="275" y="32" width="90" height="15" rx="2" fill="#EAF1F8"/>
    <text x="320" y="43" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1F407A">900 GB/s NVLink</text>

    <!-- Right Card: Domain -->
    <rect x="380" y="0" width="260" height="98" rx="4" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
    <text x="396" y="22" font-size="10.5" font-weight="700" fill="#14294E">Single-Node NVLink Mesh</text>
    <text x="396" y="40" font-size="8.5" fill="#334155">Confined strictly within 1 chassis (8 GPUs)</text>
    <text x="396" y="54" font-size="8" fill="#64748b">NVSwitch crossbar • latency &lt; 1 µs</text>
    <!-- 8 Mini GPU Chips -->
    <g transform="translate(396, 66)">
      <rect x="0" y="0" width="24" height="18" rx="2" fill="#1F407A"/>
      <text x="12" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">G0</text>
      <rect x="28" y="0" width="24" height="18" rx="2" fill="#1F407A"/>
      <text x="40" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">G1</text>
      <rect x="56" y="0" width="24" height="18" rx="2" fill="#1F407A"/>
      <text x="68" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">G2</text>
      <rect x="84" y="0" width="24" height="18" rx="2" fill="#1F407A"/>
      <text x="96" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">G3</text>
      <rect x="112" y="0" width="24" height="18" rx="2" fill="#1F407A"/>
      <text x="124" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">G4</text>
      <rect x="140" y="0" width="24" height="18" rx="2" fill="#1F407A"/>
      <text x="152" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">G5</text>
      <rect x="168" y="0" width="24" height="18" rx="2" fill="#1F407A"/>
      <text x="180" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">G6</text>
      <rect x="196" y="0" width="24" height="18" rx="2" fill="#1F407A"/>
      <text x="208" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">G7</text>
    </g>
  </g>

  <!-- ===== ROW 2: PIPELINE PARALLELISM -> INFINIBAND RACK (Purple) ===== -->
  <g transform="translate(30, 172)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Left Card: Strategy -->
    <rect x="0" y="0" width="260" height="98" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
    <text x="16" y="22" font-size="10.5" font-weight="700" fill="#6d28d9">Pipeline Parallelism (PP)</text>
    <text x="16" y="40" font-size="8.5" fill="#334155">Partitions layers across pipeline stages</text>
    <text x="16" y="54" font-size="8" fill="#64748b">Sends activations at stage boundaries</text>
    <rect x="16" y="66" width="130" height="18" rx="2" fill="#f3e8ff"/>
    <text x="81" y="78.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Moderate Bandwidth Need</text>

    <!-- Connector Arrow -->
    <line x1="262" y1="49" x2="375" y2="49" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <rect x="275" y="32" width="90" height="15" rx="2" fill="#f3e8ff"/>
    <text x="320" y="43" text-anchor="middle" font-size="7.5" font-weight="700" fill="#7c3aed">50 GB/s IB NDR</text>

    <!-- Right Card: Domain -->
    <rect x="380" y="0" width="260" height="98" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="396" y="22" font-size="10.5" font-weight="700" fill="#6d28d9">Intra-Rack Leaf Domain</text>
    <text x="396" y="40" font-size="8.5" fill="#334155">Spans adjacent nodes under same leaf switch</text>
    <text x="396" y="54" font-size="8" fill="#64748b">1-hop leaf fabric • latency 2–5 µs</text>
    <!-- Node stage badges -->
    <g transform="translate(396, 66)">
      <rect x="0" y="0" width="65" height="18" rx="2" fill="#7c3aed"/>
      <text x="32.5" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">Stage 0 (Node A)</text>
      <rect x="75" y="0" width="65" height="18" rx="2" fill="#7c3aed"/>
      <text x="107.5" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">Stage 1 (Node B)</text>
      <rect x="150" y="0" width="65" height="18" rx="2" fill="#7c3aed"/>
      <text x="182.5" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">Stage 2 (Node C)</text>
    </g>
  </g>

  <!-- ===== ROW 3: DATA PARALLELISM -> CROSS-RACK FABRIC (Amber) ===== -->
  <g transform="translate(30, 286)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Left Card: Strategy -->
    <rect x="0" y="0" width="260" height="98" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
    <text x="16" y="22" font-size="10.5" font-weight="700" fill="#b45309">Data Parallelism (DP / ZeRO)</text>
    <text x="16" y="40" font-size="8.5" fill="#334155">Replicates model; splits data batch</text>
    <text x="16" y="54" font-size="8" fill="#64748b">AllReduce gradients once per step (pipelined)</text>
    <rect x="16" y="66" width="130" height="18" rx="2" fill="#fef3c7"/>
    <text x="81" y="78.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Latency-Tolerant (Overlap)</text>

    <!-- Connector Arrow -->
    <line x1="262" y1="49" x2="375" y2="49" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
    <rect x="275" y="32" width="90" height="15" rx="2" fill="#fef3c7"/>
    <text x="320" y="43" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d97706">~25 GB/s Spine</text>

    <!-- Right Card: Domain -->
    <rect x="380" y="0" width="260" height="98" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="396" y="22" font-size="10.5" font-weight="700" fill="#b45309">Cross-Rack Pod Fabric</text>
    <text x="396" y="40" font-size="8.5" fill="#334155">Scales across hundreds of racks via spines</text>
    <text x="396" y="54" font-size="8" fill="#64748b">Bucketed AllReduce overlaps backward pass</text>
    <!-- Rack badges -->
    <g transform="translate(396, 66)">
      <rect x="0" y="0" width="50" height="18" rx="2" fill="#d97706"/>
      <text x="25" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">Rack 1</text>
      <rect x="58" y="0" width="50" height="18" rx="2" fill="#d97706"/>
      <text x="83" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">Rack 2</text>
      <rect x="116" y="0" width="50" height="18" rx="2" fill="#d97706"/>
      <text x="141" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">...</text>
      <rect x="174" y="0" width="50" height="18" rx="2" fill="#d97706"/>
      <text x="199" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">Rack N</text>
    </g>
  </g>

  <!-- Global Footer Note -->
  <text x="350" y="416" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-style="italic" fill="#64748b">Violating these boundaries (e.g. stretching TP across racks) causes severe pipeline stalls due to the 36× bandwidth cliff.</text>
</svg>