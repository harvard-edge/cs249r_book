<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <defs>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <g transform="translate(0, -20)">

  <!-- Tension Lines Between Opposing Vertices -->
  <!-- Diagonal Tensions -->
  <line x1="210" y1="130" x2="310" y2="75" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="470" y1="130" x2="370" y2="75" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="210" y1="270" x2="310" y2="325" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="470" y1="270" x2="370" y2="325" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Vertical Axis Tension: Throughput <-> Latency -->
  <line x1="340" y1="105" x2="340" y2="168" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="340" y1="232" x2="340" y2="295" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Horizontal Axis Tension: Cost <-> Fairness -->
  <line x1="215" y1="200" x2="265" y2="200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="415" y1="200" x2="465" y2="200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== VERTEX 1: THROUGHPUT (Top, Compute Blue) ===== -->
  <g transform="translate(255, 45)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="170" height="58" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">Throughput</text>
    <text x="85" y="37" text-anchor="middle" font-size="8.5" fill="#0c4a6e">Maximize GPU-hours utilized</text>
    <text x="85" y="49" text-anchor="middle" font-size="7.5" fill="#1F407A">Pack massive batch jobs</text>
  </g>

  <!-- ===== VERTEX 2: FAIRNESS (Right, Coordination Purple) ===== -->
  <g transform="translate(470, 171)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="170" height="58" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">Fairness</text>
    <text x="85" y="37" text-anchor="middle" font-size="8.5" fill="#4c1d95">Equitable share per team / user</text>
    <text x="85" y="49" text-anchor="middle" font-size="7.5" fill="#7c3aed">DRF / hierarchical fair-share</text>
  </g>

  <!-- ===== VERTEX 3: LATENCY (Bottom, Communication Amber) ===== -->
  <g transform="translate(255, 297)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="170" height="58" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Latency</text>
    <text x="85" y="37" text-anchor="middle" font-size="8.5" fill="#78350f">Minimize queue &amp; start wait time</text>
    <text x="85" y="49" text-anchor="middle" font-size="7.5" fill="#d97706">Fast turnaround for interactive jobs</text>
  </g>

  <!-- ===== VERTEX 4: COST (Left, Contention Red) ===== -->
  <g transform="translate(40, 171)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="170" height="58" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Cost Efficiency</text>
    <text x="85" y="37" text-anchor="middle" font-size="8.5" fill="#7f1d1d">Minimize $/effective GPU-hour</text>
    <text x="85" y="49" text-anchor="middle" font-size="7.5" fill="#dc2626">Spot instances &amp; off-peak packing</text>
  </g>

  <!-- ===== CENTER: CONFLICT CARD ===== -->
  <g transform="translate(265, 171)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="150" height="58" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">No Pareto-Optimal</text>
    <text x="75" y="33" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">Scheduler Exists</text>
    <text x="75" y="47" text-anchor="middle" font-size="7.5" fill="#64748b">Policy encodes trade-offs</text>
  </g>

  <!-- Axis Trade-Off Annotation Badges -->
  <!-- Top-Center: Throughput vs Latency -->
  <g transform="translate(350, 120)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="95" height="18" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="47.5" y="12" text-anchor="middle" font-size="7.5" font-weight="600" fill="#b91c1c">Starves small jobs</text>
  </g>

  <!-- Bottom-Center: Latency vs Throughput -->
  <g transform="translate(350, 262)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="105" height="18" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="52.5" y="12" text-anchor="middle" font-size="7.5" font-weight="600" fill="#b91c1c">Fragments large gangs</text>
  </g>

  <!-- Left-Center: Cost vs Center -->
  <g transform="translate(130, 240)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="105" height="18" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="52.5" y="12" text-anchor="middle" font-size="7.5" font-weight="600" fill="#b91c1c">Higher preemption tax</text>
  </g>

  <!-- Right-Center: Fairness vs Center -->
  <g transform="translate(445, 240)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="0" y="0" width="105" height="18" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="52.5" y="12" text-anchor="middle" font-size="7.5" font-weight="600" fill="#b91c1c">Sacrifices peak utilization</text>
  </g>

  </g>
</svg>