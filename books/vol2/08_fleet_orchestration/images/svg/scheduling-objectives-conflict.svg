<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 378" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Trade-off diamond. Each vertex draws a four-GPU pool against time (strip height = GPUs) as that objective would schedule it: blue = the large gang, gray = other or short jobs, dashed white = idle GPUs, red hatch = work lost to preemption, red tick = preemption. The label under each strip names what the objective gives up. -->
  <defs>
    <pattern id="lost" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fef2f2"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#f3a5a5" stroke-width="2"/>
    </pattern>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="378" fill="#ffffff"/>
  <!-- ===== Diamond edges ===== -->
  <line x1="240" y1="75" x2="120" y2="134" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="440" y1="75" x2="560" y2="134" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="240" y1="303" x2="120" y2="244" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="440" y1="303" x2="560" y2="244" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- ===== Throughput (top) ===== -->
  <rect x="240" y="20" width="200" height="110" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="340" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Throughput</text>
  <path d="M284,98 H430" stroke="#94a3b8" stroke-width="0.8" marker-end="url(#arr-gray)"/>
  <rect x="284.5" y="52.5" width="139" height="39" rx="0.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="354" y="76" text-anchor="middle" font-size="11" fill="#14294E">one gang, unbroken</text>
  <!-- queue: three small jobs stacked in a column, waiting, never placed -->
  <rect x="256.5" y="52.5" width="17" height="39" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 2"/>
  <rect x="261" y="56" width="8" height="8" rx="0.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="261" y="68" width="8" height="8" rx="0.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="261" y="80" width="8" height="8" rx="0.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="340" y="117" text-anchor="middle" font-size="11.5" fill="#334155">gives up: small jobs starve</text>
  <!-- ===== Cost efficiency (left) ===== -->
  <rect x="20" y="134" width="200" height="110" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="120" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Cost efficiency</text>
  <path d="M50,212 H196" stroke="#94a3b8" stroke-width="0.8" marker-end="url(#arr-gray)"/>
  <rect x="50.5" y="166.5" width="39" height="39" rx="0.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="70" y="190" text-anchor="middle" font-size="11" fill="#14294E">spot</text>
  <rect x="90.5" y="166.5" width="14" height="39" rx="0.5" fill="url(#lost)" stroke="#dc2626" stroke-width="0.8"/>
  <rect x="105.5" y="166.5" width="35" height="39" rx="0.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="123" y="190" text-anchor="middle" font-size="11" fill="#14294E">spot</text>
  <rect x="141.5" y="166.5" width="14" height="39" rx="0.5" fill="url(#lost)" stroke="#dc2626" stroke-width="0.8"/>
  <rect x="156.5" y="166.5" width="33" height="39" rx="0.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="173" y="190" text-anchor="middle" font-size="11" fill="#14294E">spot</text>
  <line x1="90" y1="161" x2="90" y2="208" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="141" y1="161" x2="141" y2="208" stroke="#dc2626" stroke-width="1.5"/>
  <text x="120" y="231" text-anchor="middle" font-size="11.5" fill="#334155">gives up: preemption overhead</text>
  <!-- ===== Fairness (right) ===== -->
  <rect x="460" y="134" width="200" height="110" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="560" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Fairness</text>
  <path d="M490,212 H636" stroke="#94a3b8" stroke-width="0.8" marker-end="url(#arr-gray)"/>
  <rect x="490.5" y="166.5" width="139" height="19" rx="0.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="560" y="180" text-anchor="middle" font-size="11" fill="#14294E">team A</text>
  <rect x="490.5" y="186.5" width="55" height="19" rx="0.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="518" y="200" text-anchor="middle" font-size="11" fill="#334155">team B</text>
  <rect x="546.5" y="186.5" width="83" height="19" rx="0.5" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="588" y="200" text-anchor="middle" font-size="11" fill="#64748b">idle share</text>
  <text x="560" y="231" text-anchor="middle" font-size="11.5" fill="#334155">gives up: peak utilization</text>
  <!-- ===== Latency (bottom) ===== -->
  <rect x="240" y="248" width="200" height="110" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="340" y="269" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Latency</text>
  <path d="M270,326 H416" stroke="#94a3b8" stroke-width="0.8" marker-end="url(#arr-gray)"/>
  <rect x="270.5" y="280.5" width="41" height="39" rx="0.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="312.5" y="280.5" width="20" height="9" rx="0.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="312.5" y="290.5" width="15.8" height="9" rx="0.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="312.5" y="300.5" width="24.2" height="9" rx="0.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="312.5" y="310.5" width="18.6" height="9" rx="0.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="337.7" y="280.5" width="24.2" height="39" rx="0.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="362.9" y="280.5" width="18.6" height="19" rx="0.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="362.9" y="300.5" width="15.8" height="19" rx="0.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="382.5" y="280.5" width="27" height="39" rx="0.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <line x1="312" y1="275" x2="312" y2="322" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="362.4" y1="275" x2="362.4" y2="322" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="345" text-anchor="middle" font-size="11.5" fill="#334155">gives up: large gangs fragment</text>
  <!-- ===== Center ===== -->
  <text x="340" y="187" text-anchor="middle" font-size="12" fill="#475569">a scheduling policy</text>
  <text x="340" y="203" text-anchor="middle" font-size="12" fill="#475569">sets the weights</text>
</svg>
