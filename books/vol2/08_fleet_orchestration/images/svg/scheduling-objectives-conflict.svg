<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Four scheduling objectives (coordination violet). Each box names what the objective favors and what favoring it gives up; dashed edges mark the tensions a scheduling policy must weigh. -->
  <rect width="680" height="300" fill="#ffffff"/>
  <line x1="340" y1="72" x2="115" y2="118" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="340" y1="72" x2="565" y2="118" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="340" y1="228" x2="115" y2="182" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="340" y1="228" x2="565" y2="182" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="340" y="146" text-anchor="middle" font-size="12" fill="#475569">a scheduling policy</text>
  <text x="340" y="162" text-anchor="middle" font-size="12" fill="#475569">sets the weights</text>
  <rect x="230" y="8" width="220" height="64" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="340" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Throughput</text>
  <text x="340" y="44" text-anchor="middle" font-size="12" fill="#0f172a">favors long, unbroken runs</text>
  <text x="340" y="61" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">gives up: small jobs starve</text>
  <rect x="230" y="228" width="220" height="64" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="340" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Latency</text>
  <text x="340" y="264" text-anchor="middle" font-size="12" fill="#0f172a">favors preempting for fast starts</text>
  <text x="340" y="281" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">gives up: large gangs fragment</text>
  <rect x="5" y="118" width="220" height="64" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="115" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Cost efficiency</text>
  <text x="115" y="154" text-anchor="middle" font-size="12" fill="#0f172a">favors discounted spot capacity</text>
  <text x="115" y="171" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">gives up: preemption overhead</text>
  <rect x="455" y="118" width="220" height="64" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="565" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Fairness</text>
  <text x="565" y="154" text-anchor="middle" font-size="12" fill="#0f172a">favors equal shares per team</text>
  <text x="565" y="171" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">gives up: peak utilization</text>
</svg>
