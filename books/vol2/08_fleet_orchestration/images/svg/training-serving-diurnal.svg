<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="780" height="450" fill="#ffffff"/>

  <defs>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Subtitle -->
  <text x="390" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Diurnal resource sharing: training and serving workloads naturally anti-correlate across the 24-hour day/night cycle</text>

  <!-- ===== CHART AREA ===== -->
  <!-- Origin at x=75, y=340. Width=500, Height=270 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Axes Lines -->
    <line x1="75" y1="340" x2="575" y2="340" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="75" y1="70" x2="75" y2="340" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Y-Axis Ticks: 0% to 100% (270px total, 67.5px per 25%) -->
    <line x1="68" y1="70" x2="75" y2="70" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="73" text-anchor="end" font-size="8" fill="#64748b">100%</text>

    <line x1="68" y1="137.5" x2="75" y2="137.5" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="140.5" text-anchor="end" font-size="8" fill="#64748b">75%</text>

    <line x1="68" y1="205" x2="75" y2="205" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="208" text-anchor="end" font-size="8" fill="#64748b">50%</text>

    <line x1="68" y1="272.5" x2="75" y2="272.5" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="275.5" text-anchor="end" font-size="8" fill="#64748b">25%</text>

    <line x1="68" y1="340" x2="75" y2="340" stroke="#94a3b8" stroke-width="1"/>
    <text x="64" y="343" text-anchor="end" font-size="8" fill="#64748b">0%</text>

    <text x="24" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155" transform="rotate(-90,24,205)">Fleet GPU Allocation (% of total)</text>

    <!-- X-Axis Ticks: 0 to 24 hours (step 4h, 500px total / 24 = 20.83px/h) -->
    <!-- 0h: 75, 4h: 158, 8h: 242, 12h: 325, 16h: 408, 20h: 492, 24h: 575 -->
    <line x1="75" y1="340" x2="75" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="75" y="358" text-anchor="middle" font-size="8" fill="#64748b">00:00</text>

    <line x1="158" y1="340" x2="158" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="158" y="358" text-anchor="middle" font-size="8" fill="#64748b">04:00</text>

    <line x1="242" y1="340" x2="242" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="242" y="358" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">08:00</text>

    <line x1="325" y1="340" x2="325" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="325" y="358" text-anchor="middle" font-size="8" fill="#64748b">12:00</text>

    <line x1="408" y1="340" x2="408" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="408" y="358" text-anchor="middle" font-size="8" fill="#64748b">16:00</text>

    <line x1="492" y1="340" x2="492" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="492" y="358" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">20:00</text>

    <line x1="575" y1="340" x2="575" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="575" y="358" text-anchor="middle" font-size="8" fill="#64748b">24:00</text>

    <text x="325" y="378" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Time of Day (24-Hour Cycle)</text>

    <!-- ===== WORKLOAD POLYGONS ===== -->
    <!-- Serving: 15% at night (y=299.5), 85% during day (y=110.5) -->
    <!-- Ramp up from 06:00 (x=200) to 09:00 (x=262) -->
    <!-- Ramp down from 18:00 (x=450) to 21:00 (x=512) -->
    <polygon points="75,299 200,299 262,111 450,111 512,299 575,299 575,340 75,340" fill="#dcfce7" opacity="0.85"/>
    <polyline points="75,299 200,299 262,111 450,111 512,299 575,299" fill="none" stroke="#16a34a" stroke-width="2"/>

    <!-- Training: 85% at night (y=110.5), 15% during day (y=299.5) -->
    <!-- Placed on top of serving to fill to 100% (y=70) -->
    <polygon points="75,70 575,70 575,299 512,299 450,111 262,111 200,299 75,299" fill="#EAF1F8" opacity="0.85"/>
    <line x1="75" y1="70" x2="575" y2="70" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Labels in Shaded Areas -->
    <!-- Night Training Label -->
    <text x="135" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#14294E">Batch Training</text>
    <text x="135" y="174" text-anchor="middle" font-size="8" fill="#1F407A">~85% Fleet Share</text>
    <text x="135" y="186" text-anchor="middle" font-size="7.5" fill="#64748b">Night pretraining bursts</text>

    <!-- Daytime Serving Label -->
    <text x="356" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Inference Serving</text>
    <text x="356" y="214" text-anchor="middle" font-size="8" fill="#166534">~85% Fleet Share</text>
    <text x="356" y="226" text-anchor="middle" font-size="7.5" fill="#64748b">Business hours peak traffic</text>

    <!-- Evening Training Label -->
    <text x="540" y="160" text-anchor="middle" font-size="9" font-weight="700" fill="#14294E">Batch Training</text>
    <text x="540" y="174" text-anchor="middle" font-size="7.5" fill="#1F407A">~85% Fleet Share</text>

    <!-- ===== CROSSOVER MARKERS ===== -->
    <!-- Morning Shift: x=231 (approx 07:30) -->
    <line x1="231" y1="50" x2="231" y2="340" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="180" y="44" width="102" height="20" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="231" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Morning Shift (~08:00)</text>

    <!-- Evening Shift: x=481 (approx 19:30) -->
    <line x1="481" y1="50" x2="481" y2="340" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="430" y="44" width="102" height="20" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="481" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Evening Shift (~20:00)</text>

    <!-- Migration Latency Callout Pill -->
    <g transform="translate(230, 245)">
      <rect x="0" y="0" width="125" height="42" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <text x="62.5" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Switching Latency: 5–20 min</text>
      <text x="62.5" y="27" text-anchor="middle" font-size="7.5" fill="#475569">Checkpoint save (1–5 min)</text>
      <text x="62.5" y="37" text-anchor="middle" font-size="7.5" fill="#475569">Weight load &amp; warmup (5–15 min)</text>
    </g>
  </g>

  <!-- ===== RIGHT SIDE: ECONOMIC VALUE CARD ===== -->
  <g transform="translate(595, 70)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Economic Recovery Card -->
    <rect x="0" y="0" width="168" height="142" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="12" y="20" font-size="9.5" font-weight="700" fill="#15803d">Fleet Capacity Recovery</text>
    <text x="12" y="36" font-size="8" font-weight="600" fill="#334155">Static Partitioning:</text>
    <text x="12" y="48" font-size="7.5" fill="#64748b">• Peak reserves 500 GPUs</text>
    <text x="12" y="58" font-size="7.5" fill="#64748b">• Idle at night (~35% util)</text>
    <line x1="12" y1="67" x2="156" y2="67" stroke="#bbf7d0" stroke-width="1"/>
    <text x="12" y="80" font-size="8" font-weight="600" fill="#0f172a">Dynamic Sharing:</text>
    <text x="12" y="92" font-size="7.5" fill="#166534">• Reclaims ~200 GPUs nightly</text>
    <text x="12" y="102" font-size="7.5" fill="#166534">  for elastic training runs</text>
    <rect x="12" y="110" width="144" height="22" rx="3" fill="#dcfce7"/>
    <text x="84" y="125" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">+$3.5M / Year Value</text>

    <!-- Operational Rule Card -->
    <g transform="translate(0, 154)">
      <rect x="0" y="0" width="168" height="116" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="9.5" font-weight="700" fill="#0f172a">Operational Rule</text>
      <text x="12" y="36" font-size="7.5" fill="#475569">• Scheduled diurnal shifts only</text>
      <text x="12" y="47" font-size="7.5" fill="#475569">• 5–20 min switching latency</text>
      <text x="12" y="57" font-size="7.5" fill="#64748b">  (not for second-level spikes)</text>
      <line x1="12" y1="66" x2="156" y2="66" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="79" font-size="8" font-weight="600" fill="#dc2626">Safety Headroom:</text>
      <text x="12" y="91" font-size="7.5" fill="#64748b">• Retain 15% buffer against</text>
      <text x="12" y="101" font-size="7.5" fill="#64748b">  unpredicted traffic surges</text>
    </g>
  </g>

  <!-- Global Footer Note -->
  <text x="390" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-style="italic" fill="#64748b">Dynamic co-location amortizes expensive GPU infrastructure by feeding nightly off-peak cycles to elastic training runs.</text>
</svg>