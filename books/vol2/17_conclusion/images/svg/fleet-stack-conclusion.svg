<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean canvas background with zero outer border stroke -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .label-chip   { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
      .layer-title  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .pill-text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; }
      .arrow-label  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #334155; }
    </style>
    <marker id="arrow-up" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <g transform="translate(40, 20)">
    <!-- Layer IV: The Responsible Fleet -->
    <g transform="translate(0, 0)">
      <rect x="0" y="18" width="95" height="24" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="47.5" y="33.5" text-anchor="middle" class="label-chip" fill="#047857">GOVERNANCE</text>

      <rect x="110" y="0" width="390" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="305" y="22" text-anchor="middle" class="layer-title" fill="#166534">IV. The Responsible Fleet</text>
      
      <!-- Fleet Stack rows (two per band) -->
      <g transform="translate(0, 32)">
        <rect x="125" y="0" width="172" height="20" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
        <text x="211" y="13.5" text-anchor="middle" class="pill-text" fill="#166534">Assurance</text>

        <rect x="313" y="0" width="172" height="20" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
        <text x="399" y="13.5" text-anchor="middle" class="pill-text" fill="#166534">Governance &amp; Sustainability</text>
      </g>
    </g>

    <!-- Layer III: Deployment at Scale -->
    <g transform="translate(0, 75)">
      <rect x="0" y="18" width="95" height="24" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="47.5" y="33.5" text-anchor="middle" class="label-chip" fill="#b45309">SERVING</text>

      <rect x="110" y="0" width="390" height="60" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
      <text x="305" y="22" text-anchor="middle" class="layer-title" fill="#92400e">III. Deployment at Scale</text>

      <!-- Fleet Stack rows (two per band) -->
      <g transform="translate(0, 32)">
        <rect x="125" y="0" width="172" height="20" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
        <text x="211" y="13.5" text-anchor="middle" class="pill-text" fill="#92400e">Runtime &amp; Serving</text>

        <rect x="313" y="0" width="172" height="20" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
        <text x="399" y="13.5" text-anchor="middle" class="pill-text" fill="#92400e">Operations</text>
      </g>
    </g>

    <!-- Layer II: Distributed ML -->
    <g transform="translate(0, 150)">
      <rect x="0" y="18" width="95" height="24" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
      <text x="47.5" y="33.5" text-anchor="middle" class="label-chip" fill="#6b21a8">DISTRIBUTION</text>

      <rect x="110" y="0" width="390" height="60" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
      <text x="305" y="22" text-anchor="middle" class="layer-title" fill="#6b21a8">II. Distributed ML</text>

      <!-- Fleet Stack rows (two per band) -->
      <g transform="translate(0, 32)">
        <rect x="125" y="0" width="172" height="20" rx="4" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
        <text x="211" y="13.5" text-anchor="middle" class="pill-text" fill="#6b21a8">Distributed Execution</text>

        <rect x="313" y="0" width="172" height="20" rx="4" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
        <text x="399" y="13.5" text-anchor="middle" class="pill-text" fill="#6b21a8">Reliability &amp; Control</text>
      </g>
    </g>

    <!-- Layer I: The Fleet -->
    <g transform="translate(0, 225)">
      <rect x="0" y="18" width="95" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text x="47.5" y="33.5" text-anchor="middle" class="label-chip" fill="#1d4ed8">INFRASTRUCTURE</text>

      <rect x="110" y="0" width="390" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="305" y="22" text-anchor="middle" class="layer-title" fill="#1e40af">I. The Fleet</text>

      <!-- Fleet Stack rows (two per band) -->
      <g transform="translate(0, 32)">
        <rect x="125" y="0" width="172" height="20" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="211" y="13.5" text-anchor="middle" class="pill-text" fill="#1e40af">Facility &amp; Accelerators</text>

        <rect x="313" y="0" width="172" height="20" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="399" y="13.5" text-anchor="middle" class="pill-text" fill="#1e40af">Fabric &amp; Storage</text>
      </g>
    </g>

    <!-- Scale Arrow on the right -->
    <path d="M 535,260 L 535,28" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow-up)"/>
    <g transform="translate(550, 126)">
      <text x="0" y="0" class="arrow-label">Scale Creates</text>
      <text x="0" y="16" class="arrow-label">Qualitative</text>
      <text x="0" y="32" class="arrow-label">Change</text>
    </g>
  </g>
</svg>
