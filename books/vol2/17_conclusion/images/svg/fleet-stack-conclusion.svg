<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="680" height="348" fill="#ffffff"/>
  <!-- ===== Part I: Infrastructure band ===== -->
  <rect x="62" y="260" width="118" height="68" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="121" y="290" text-anchor="middle" font-size="12" fill="#475569">Part I</text>
  <text x="121" y="306" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Infrastructure</text>
  <rect x="192" y="295" width="196" height="32" rx="2" fill="#D6DEEA"/>
  <text x="204" y="315.5" font-size="12.5" font-weight="700" fill="#14294E">Facility &amp; Accelerators</text>
  <rect x="192" y="261" width="196" height="32" rx="2" fill="#D6DEEA"/>
  <text x="204" y="281.5" font-size="12.5" font-weight="700" fill="#14294E">Fabric &amp; Storage</text>
  <text x="404" y="298.5" font-size="12.5" fill="#0f172a"><tspan font-weight="700" fill="#1F407A">1</tspan><tspan dx="6">Infrastructure determines capability</tspan></text>
  <!-- ===== Part II: Distribution band ===== -->
  <rect x="62" y="180" width="118" height="68" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="121" y="210" text-anchor="middle" font-size="12" fill="#475569">Part II</text>
  <text x="121" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Distribution</text>
  <rect x="192" y="215" width="196" height="32" rx="2" fill="#D6DEEA"/>
  <text x="204" y="235.5" font-size="12.5" font-weight="700" fill="#14294E">Distributed Execution</text>
  <text x="404" y="235.5" font-size="12.5" fill="#0f172a"><tspan font-weight="700" fill="#1F407A">2</tspan><tspan dx="6">Communication can dominate</tspan></text>
  <rect x="192" y="181" width="196" height="32" rx="2" fill="#D6DEEA"/>
  <text x="204" y="201.5" font-size="12.5" font-weight="700" fill="#14294E">Reliability &amp; Control</text>
  <text x="404" y="201.5" font-size="12.5" fill="#0f172a"><tspan font-weight="700" fill="#1F407A">3</tspan><tspan dx="6">Failure is routine</tspan></text>
  <!-- ===== Part III: Serving band ===== -->
  <rect x="62" y="100" width="118" height="68" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="121" y="130" text-anchor="middle" font-size="12" fill="#475569">Part III</text>
  <text x="121" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Serving</text>
  <rect x="192" y="135" width="196" height="32" rx="2" fill="#D6DEEA"/>
  <text x="204" y="155.5" font-size="12.5" font-weight="700" fill="#14294E">Runtime &amp; Serving</text>
  <rect x="192" y="101" width="196" height="32" rx="2" fill="#D6DEEA"/>
  <text x="204" y="121.5" font-size="12.5" font-weight="700" fill="#14294E">Operations</text>
  <text x="404" y="138.5" font-size="12.5" fill="#0f172a"><tspan font-weight="700" fill="#1F407A">4</tspan><tspan dx="6">Serving is bounded by its contract</tspan></text>
  <!-- ===== Part IV: Governance band ===== -->
  <rect x="62" y="20" width="118" height="68" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="121" y="50" text-anchor="middle" font-size="12" fill="#475569">Part IV</text>
  <text x="121" y="66" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Governance</text>
  <rect x="192" y="55" width="196" height="32" rx="2" fill="#D6DEEA"/>
  <text x="204" y="75.5" font-size="12.5" font-weight="700" fill="#14294E">Assurance</text>
  <text x="404" y="75.5" font-size="12.5" fill="#0f172a"><tspan font-weight="700" fill="#1F407A">5</tspan><tspan dx="6">Responsibility constrains design</tspan></text>
  <rect x="192" y="21" width="196" height="32" rx="2" fill="#D6DEEA"/>
  <text x="204" y="41.5" font-size="12.5" font-weight="700" fill="#14294E">Governance &amp; Sustainability</text>
  <text x="404" y="41.5" font-size="12.5" fill="#0f172a"><tspan font-weight="700" fill="#1F407A">6</tspan><tspan dx="6">Sustainability is a first-order cost</tspan></text>
  <!-- ===== Dependency / scale arrow ===== -->
  <path d="M34,328 V22" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="26" y="174" text-anchor="middle" font-size="12" fill="#14294E" transform="rotate(-90 26 174)">scale creates qualitative change</text>
</svg>
