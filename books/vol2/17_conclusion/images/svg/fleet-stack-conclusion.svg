<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%">
  <!-- Clean canvas background with zero outer border stroke -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .label-chip   { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 700; }
      .layer-title  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1a202c; }
      .layer-sub    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #4a5568; }
      .arrow-label  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #2d3748; }
    </style>
    <marker id="arrow-up" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#4a5568"/>
    </marker>
  </defs>

  <g transform="translate(40, 20)">
    <!-- Layer IV: The Responsible Fleet -->
    <g transform="translate(0, 0)">
      <rect x="0" y="16" width="95" height="24" rx="2" fill="#f0fff4"/>
      <text x="47" y="32" text-anchor="middle" class="label-chip" fill="#22543d">GOVERNANCE</text>

      <rect x="110" y="0" width="390" height="58" rx="4" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.2"/>
      <text x="305" y="24" text-anchor="middle" class="layer-title" fill="#22543d">IV. The Responsible Fleet</text>
      <text x="305" y="44" text-anchor="middle" class="layer-sub">Security  •  Robustness  •  Responsible AI  •  Sustainability</text>
    </g>

    <!-- Layer III: Deployment at Scale -->
    <g transform="translate(0, 75)">
      <rect x="0" y="16" width="95" height="24" rx="2" fill="#fffaf0"/>
      <text x="47" y="32" text-anchor="middle" class="label-chip" fill="#c05621">SERVING</text>

      <rect x="110" y="0" width="390" height="58" rx="4" fill="#fffaf0" stroke="#fbd38d" stroke-width="1.2"/>
      <text x="305" y="24" text-anchor="middle" class="layer-title" fill="#c05621">III. Deployment at Scale</text>
      <text x="305" y="44" text-anchor="middle" class="layer-sub">Inference  •  Performance  •  Edge  •  Fleet Operations</text>
    </g>

    <!-- Layer II: Distributed ML -->
    <g transform="translate(0, 150)">
      <rect x="0" y="16" width="95" height="24" rx="2" fill="#faf5ff"/>
      <text x="47" y="32" text-anchor="middle" class="label-chip" fill="#6b46c1">DISTRIBUTION</text>

      <rect x="110" y="0" width="390" height="58" rx="4" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1.2"/>
      <text x="305" y="24" text-anchor="middle" class="layer-title" fill="#553c9e">II. Distributed ML</text>
      <text x="305" y="44" text-anchor="middle" class="layer-sub">Parallelism  •  Communication Fabrics  •  Fault Tolerance</text>
    </g>

    <!-- Layer I: The Fleet -->
    <g transform="translate(0, 225)">
      <rect x="0" y="16" width="95" height="24" rx="2" fill="#ebf8ff"/>
      <text x="47" y="32" text-anchor="middle" class="label-chip" fill="#2b6cb0">INFRASTRUCTURE</text>

      <rect x="110" y="0" width="390" height="58" rx="4" fill="#ebf8ff" stroke="#90cdf4" stroke-width="1.2"/>
      <text x="305" y="24" text-anchor="middle" class="layer-title" fill="#2b6cb0">I. The Fleet</text>
      <text x="305" y="44" text-anchor="middle" class="layer-sub">Compute Clusters  •  High-Speed Interconnect  •  Data Systems</text>
    </g>

    <!-- Scale Arrow on the right -->
    <path d="M 535,260 L 535,28" stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#arrow-up)"/>
    <g transform="translate(548, 130)">
      <text x="0" y="0" class="arrow-label">Scale Creates</text>
      <text x="0" y="16" class="arrow-label">Qualitative</text>
      <text x="0" y="32" class="arrow-label">Change</text>
    </g>
  </g>
</svg>
