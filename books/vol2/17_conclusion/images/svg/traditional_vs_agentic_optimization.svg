<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="680" height="340" fill="#ffffff"/>

  <!-- ===== (a) Model execution boundary ===== -->
  <text x="20" y="24" font-size="13" font-weight="700" fill="#0f172a">(a) Model execution</text>
  <rect x="220" y="38" width="240" height="60" rx="4" fill="none" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="5,3"/>

  <rect x="30" y="50" width="110" height="36" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="85" y="72" text-anchor="middle" font-size="12" fill="#0f172a">Prompt</text>
  <rect x="240" y="50" width="200" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="340" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Model forward pass</text>
  <rect x="540" y="50" width="110" height="36" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="595" y="72" text-anchor="middle" font-size="12" fill="#0f172a">Tokens</text>
  <path d="M140,68 H238" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M440,68 H538" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="340" y="116" text-anchor="middle" font-size="12" fill="#1F407A">measured per token: FLOPs per token, joules per token</text>

  <line x1="20" y1="136" x2="660" y2="136" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== (b) Complete workflow boundary ===== -->
  <text x="20" y="160" font-size="13" font-weight="700" fill="#0f172a">(b) Complete workflow</text>
  <rect x="120" y="172" width="436" height="128" rx="4" fill="none" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- retry lane above the steps -->
  <path d="M500,212 V197 H184 V210" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="342" y="190" text-anchor="middle" font-size="11.5" fill="#b91c1c">check failed: retry</text>

  <rect x="20" y="212" width="84" height="36" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="62" y="234" text-anchor="middle" font-size="12" fill="#0f172a">Goal</text>
  <rect x="140" y="212" width="88" height="36" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="184" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Plan</text>
  <rect x="244" y="212" width="88" height="36" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="288" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Retrieve</text>
  <rect x="348" y="212" width="88" height="36" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="392" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Run tool</text>
  <rect x="452" y="212" width="88" height="36" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="496" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Verify</text>
  <rect x="572" y="212" width="88" height="36" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="616" y="229" text-anchor="middle" font-size="12" fill="#15803d">Verified</text>
  <text x="616" y="243" text-anchor="middle" font-size="12" fill="#15803d">result</text>

  <path d="M104,230 H138" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M228,230 H242" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M332,230 H346" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M436,230 H450" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M540,230 H570" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- the model is one component called from inside the loop -->
  <rect x="140" y="266" width="296" height="24" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="288" y="282" text-anchor="middle" font-size="12" fill="#14294E">model calls</text>
  <line x1="184" y1="248" x2="184" y2="266" stroke="#1F407A" stroke-width="1.2"/>
  <line x1="288" y1="248" x2="288" y2="266" stroke="#1F407A" stroke-width="1.2"/>
  <line x1="392" y1="248" x2="392" y2="266" stroke="#1F407A" stroke-width="1.2"/>

  <text x="338" y="322" text-anchor="middle" font-size="12" fill="#1F407A">measured per task: joules per useful task completed</text>
</svg>
