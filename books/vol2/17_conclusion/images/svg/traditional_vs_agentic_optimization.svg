<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean canvas background with zero outer border stroke -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .section-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
      .node-text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; }
      .node-sub    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 500; fill: #475569; }
      .opt-hdr     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .opt-metric  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 600; }
      .badge-text  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; font-weight: 700; }
      .annotation  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; fill: #475569; }
      .flow-label  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; font-weight: 700; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6B21A8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#166534"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- ========================================================================= -->
  <!-- PANEL A: TRADITIONAL AI (Stateless Request-Response)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(20, 16)">
    <rect width="840" height="170" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="840" height="26" rx="4" fill="#EAF1F8"/>
    <line x1="0" y1="26" x2="840" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="17" class="section-hdr" fill="#1F407A">(A) TRADITIONAL AI: STATELESS REQUEST-RESPONSE</text>
    <rect x="686" y="4" width="140" height="18" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="756" y="16.5" text-anchor="middle" class="badge-text" fill="#475569">Open-Loop Inference</text>

    <!-- Pipeline Flow -->
    <!-- Input Box -->
    <g transform="translate(45, 46)">
      <rect width="125" height="48" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
      <text x="62.5" y="23" text-anchor="middle" font-size="11.5" class="node-text" fill="#0F172A">Input</text>
      <text x="62.5" y="37" text-anchor="middle" font-size="9" class="node-sub">User Prompt / Query</text>
    </g>

    <!-- Arrow Input -> Model -->
    <line x1="170" y1="70" x2="305" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="237" y="62" text-anchor="middle" font-size="9" class="annotation">Prompt Tokens</text>

    <!-- Model Box -->
    <g transform="translate(305, 40)">
      <rect width="190" height="60" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
      <text x="95" y="27" text-anchor="middle" font-size="11.5" class="node-text" fill="#1F407A">Foundation Model</text>
      <text x="95" y="43" text-anchor="middle" font-size="9" class="node-sub" fill="#334155">Forward Pass / KV Cache</text>
    </g>

    <!-- Arrow Model -> Output -->
    <line x1="495" y1="70" x2="630" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="562" y="62" text-anchor="middle" font-size="9" class="annotation">Completion Tokens</text>

    <!-- Output Box -->
    <g transform="translate(630, 46)">
      <rect width="125" height="48" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
      <text x="62.5" y="23" text-anchor="middle" font-size="11.5" class="node-text" fill="#0F172A">Output</text>
      <text x="62.5" y="37" text-anchor="middle" font-size="9" class="node-sub">Text Stream / JSON</text>
    </g>

    <!-- Optimization Callout Bracket below Model -->
    <g transform="translate(280, 110)">
      <line x1="120" y1="0" x2="120" y2="8" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="8" width="240" height="42" rx="3" fill="#F0F4F9" stroke="#93C5FD" stroke-width="1"/>
      <text x="120" y="24" text-anchor="middle" font-size="11" class="opt-hdr" fill="#1F407A">Target: Micro-Efficiency</text>
      <text x="120" y="39" text-anchor="middle" font-size="9.5" class="opt-metric" fill="#1E3A8A">FLOPs / token  |  joules / token</text>
    </g>
    
    <!-- Descriptive Notes on right (Structured Key-Values) -->
    <g transform="translate(540, 114)">
      <rect x="0" y="0" width="280" height="40" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="10" y="16" font-size="9" class="annotation"><tspan font-weight="600" fill="#334155">Execution:</tspan><tspan dx="4">Single forward pass; volatile state</tspan></text>
      <text x="10" y="30" font-size="9" class="annotation"><tspan font-weight="600" fill="#334155">Environment:</tspan><tspan dx="4">Zero persistent external memory</tspan></text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL B: AGENTIC AI (Closed-Loop Trajectory Execution)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(20, 200)">
    <rect width="840" height="325" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="840" height="26" rx="4" fill="#F3E8FF"/>
    <line x1="0" y1="26" x2="840" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="17" class="section-hdr" fill="#6B21A8">(B) AGENTIC AI: CLOSED-LOOP TRAJECTORY EXECUTION</text>
    <rect x="670" y="4" width="156" height="18" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="748" y="16.5" text-anchor="middle" class="badge-text" fill="#6B21A8">Stateful Feedback System</text>

    <!-- Overarching Foundation Model Backbone Box -->
    <g transform="translate(195, 38)">
      <rect width="455" height="30" rx="3" fill="#FAF5FF" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="227.5" y="19.5" text-anchor="middle" font-size="10.5" class="node-text" fill="#6B21A8">Neural Foundation Model Backbone (Cognitive Policy Engine)</text>
      
      <!-- Downward connector lines to sub-components -->
      <line x1="60" y1="30" x2="60" y2="44" stroke="#7E22CE" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <line x1="210" y1="30" x2="210" y2="44" stroke="#7E22CE" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <line x1="360" y1="30" x2="360" y2="44" stroke="#7E22CE" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
    </g>

    <!-- Subsystem Nodes Row 1 -->
    <!-- Input Goal -->
    <g transform="translate(35, 84)">
      <rect width="105" height="48" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="52.5" y="23" text-anchor="middle" font-size="11.5" class="node-text" fill="#0F172A">Input Goal</text>
      <text x="52.5" y="37" text-anchor="middle" font-size="9" class="node-sub">User Objective</text>
    </g>

    <!-- Arrow Input -> Planner -->
    <line x1="140" y1="108" x2="195" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Planner Node -->
    <g transform="translate(195, 84)">
      <rect width="120" height="48" rx="3" fill="#FAF5FF" stroke="#C084FC" stroke-width="1.2"/>
      <text x="60" y="23" text-anchor="middle" font-size="11.5" class="node-text" fill="#6B21A8">Planner</text>
      <text x="60" y="37" text-anchor="middle" font-size="9" class="node-sub" fill="#7E22CE">Decomposition</text>
    </g>

    <!-- Arrow Planner -> Retrieval -->
    <line x1="315" y1="108" x2="350" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Retrieval Node -->
    <g transform="translate(350, 84)">
      <rect width="120" height="48" rx="3" fill="#FAF5FF" stroke="#C084FC" stroke-width="1.2"/>
      <text x="60" y="23" text-anchor="middle" font-size="11.5" class="node-text" fill="#6B21A8">Retrieval</text>
      <text x="60" y="37" text-anchor="middle" font-size="9" class="node-sub" fill="#7E22CE">Context &amp; Memory</text>
    </g>

    <!-- Arrow Retrieval -> Tool -->
    <line x1="470" y1="108" x2="505" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Tool Execution Node -->
    <g transform="translate(505, 84)">
      <rect width="120" height="48" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
      <text x="60" y="23" text-anchor="middle" font-size="11.5" class="node-text" fill="#B45309">Tool / Action</text>
      <text x="60" y="37" text-anchor="middle" font-size="9" class="node-sub" fill="#92400E">Sandbox &amp; POSIX</text>
    </g>

    <!-- Row 2: Verification Node -->
    <!-- Downward arrows into Verification -->
    <path d="M 410 132 L 410 152 L 485 152" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
    <text x="445" y="147" font-size="8.5" class="node-sub">Context</text>

    <line x1="565" y1="132" x2="565" y2="152" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
    <text x="592" y="146" font-size="8.5" class="node-sub">Mutations</text>

    <g transform="translate(485, 150)">
      <rect width="165" height="52" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
      <text x="82.5" y="24" text-anchor="middle" font-size="11.5" class="node-text" fill="#166534">Verification Oracle</text>
      <text x="82.5" y="39" text-anchor="middle" font-size="9" class="node-sub" fill="#15803D">Compilers, Linters &amp; Tests</text>
    </g>

    <!-- Arrow Verification -> Output (Terminal Success) -->
    <line x1="650" y1="176" x2="715" y2="176" stroke="#166534" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
    <rect x="653" y="160" width="58" height="15" rx="2" fill="#DCFCE7"/>
    <text x="682" y="171.5" text-anchor="middle" font-size="8.5" class="flow-label" fill="#15803D">PASS / OK</text>

    <!-- Terminal Output Node -->
    <g transform="translate(718, 152)">
      <rect width="112" height="48" rx="3" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
      <text x="56" y="23" text-anchor="middle" font-size="11.5" class="node-text" fill="#166534">Output</text>
      <text x="56" y="38" text-anchor="middle" font-size="9" class="node-sub" fill="#15803D">Certified Goal</text>
    </g>

    <!-- Closed-Loop Feedback Path (Verification -> Planner on Retry / Incomplete) -->
    <path d="M 485 180 L 255 180 L 255 138" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
    
    <!-- Badge on Feedback Path -->
    <rect x="265" y="188" width="200" height="18" rx="2" fill="#FEF2F2" stroke="#FECACA" stroke-width="0.8"/>
    <text x="365" y="201" text-anchor="middle" font-size="8.5" class="badge-text" fill="#DC2626">RETRY / REPLAN FEEDBACK LOOP</text>

    <!-- Optimization Callout for the Whole Loop -->
    <g transform="translate(100, 248)">
      <rect width="640" height="54" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
      <text x="320" y="23" text-anchor="middle" font-size="11" class="opt-hdr" fill="#166534">Target: System-Wide Macro-Efficiency (Whole Loop)</text>
      <text x="320" y="42" text-anchor="middle" font-size="9.5" class="opt-metric" fill="#14532D">joules / useful task  |  cost / resolved goal  |  Trajectory Goodput</text>
    </g>
  </g>
</svg>