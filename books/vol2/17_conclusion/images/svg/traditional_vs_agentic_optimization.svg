<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 390"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="688" height="390" fill="#ffffff"/>
  <g transform="translate(4,10)">

  <!-- ===== (a) Model execution: the boundary holds one forward pass, the unit is one token ===== -->
  <text x="20" y="24" font-size="13" font-weight="700" fill="#0f172a">(a) Model execution</text>

  <rect x="20" y="52" width="100" height="36" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="70" y="74" text-anchor="middle" font-size="12" fill="#0f172a">Prompt</text>

  <!-- per-token boundary -->
  <rect x="200" y="40" width="220" height="60" rx="4" fill="none" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="5,3"/>
  <rect x="220" y="52" width="180" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="310" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Model forward pass</text>
  <path d="M120,70 H218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M400,70 H468" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- token stream: the denominator is counted one token at a time -->
  <text x="470" y="46" font-size="11" fill="#475569">tokens</text>
  <rect x="470" y="60" width="20" height="20" rx="1" fill="#1F407A"/>
  <rect x="496" y="60" width="20" height="20" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="522" y="60" width="20" height="20" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="548" y="60" width="20" height="20" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="574" y="60" width="20" height="20" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="600" y="60" width="20" height="20" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="634" y="75" font-size="12" fill="#475569">…</text>
  <text x="480" y="98" text-anchor="middle" font-size="11" fill="#475569">1 unit</text>

  <text x="310" y="122" text-anchor="middle" font-size="12" fill="#1F407A">measured per token: FLOPs per token, joules per token</text>

  <line x1="20" y1="142" x2="660" y2="142" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== (b) Complete workflow: the boundary holds the whole loop, the unit is one verified task ===== -->
  <text x="20" y="168" font-size="13" font-weight="700" fill="#0f172a">(b) Complete workflow</text>

  <!-- per-task boundary -->
  <rect x="120" y="180" width="430" height="150" rx="4" fill="none" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- model calls: the panel (a) forward pass, now one component called from inside the loop -->
  <rect x="136" y="188" width="88" height="40" rx="3" fill="none" stroke="#1F407A" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="144" y="194" width="72" height="28" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="180" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">model</text>
  <rect x="244" y="194" width="72" height="28" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="280" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">model</text>
  <rect x="344" y="194" width="72" height="28" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="380" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">model</text>
  <line x1="180" y1="228" x2="180" y2="240" stroke="#1F407A" stroke-width="1.2"/>
  <line x1="280" y1="222" x2="280" y2="240" stroke="#1F407A" stroke-width="1.2"/>
  <line x1="380" y1="222" x2="380" y2="240" stroke="#1F407A" stroke-width="1.2"/>

  <!-- loop stages -->
  <rect x="20" y="240" width="80" height="36" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="262" text-anchor="middle" font-size="12" fill="#0f172a">Goal</text>
  <rect x="140" y="240" width="80" height="36" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="180" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Plan</text>
  <rect x="240" y="240" width="80" height="36" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Retrieve</text>
  <rect x="340" y="240" width="80" height="36" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="380" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Run tool</text>
  <rect x="440" y="240" width="80" height="36" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="480" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Verify</text>

  <path d="M100,258 H138" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M220,258 H238" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M320,258 H338" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M420,258 H438" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- retry lap: routes under the stages and re-enters Plan -->
  <path d="M480,276 V310 H180 V278" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <rect x="268" y="302" width="124" height="16" fill="#ffffff"/>
  <text x="330" y="314" text-anchor="middle" font-size="11.5" fill="#b91c1c">check failed: retry</text>

  <!-- the unit of account: one verified task -->
  <path d="M520,258 H568" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="570" y="240" width="90" height="36" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Verified</text>
  <text x="615" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">result</text>
  <text x="615" y="294" text-anchor="middle" font-size="11" fill="#475569">1 unit</text>

  <text x="335" y="352" text-anchor="middle" font-size="12" fill="#1F407A">measured per task: joules per useful task completed</text>
  </g>
</svg>
