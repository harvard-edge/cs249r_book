<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean canvas background with zero outer border stroke -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .section-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.5px; }
      .node-text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .node-sub    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 500; text-anchor: middle; fill: #4a5568; }
      .opt-hdr     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 800; text-anchor: middle; }
      .opt-metric  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .badge-text  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; font-weight: 700; }
      .annotation  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #4a5568; }
      .flow-label  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; font-weight: 700; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6b46c1"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22543d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c53030"/>
    </marker>
  </defs>

  <!-- ========================================================================= -->
  <!-- PANEL 1: TRADITIONAL AI (Stateless Request-Response)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(20, 20)">
    <rect width="840" height="170" rx="4" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="840" height="30" rx="4" fill="#edf2f7"/>
    <text x="16" y="20" class="section-hdr" fill="#2d3748">1. TRADITIONAL AI: STATELESS REQUEST-RESPONSE</text>
    <rect x="680" y="6" width="144" height="18" rx="2" fill="#e2e8f0"/>
    <text x="752" y="18.5" text-anchor="middle" class="badge-text" fill="#4a5568">Open-Loop Inference</text>

    <!-- Pipeline Flow -->
    <!-- Input Box -->
    <g transform="translate(50, 48)">
      <rect width="120" height="48" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
      <text x="60" y="24" class="node-text" fill="#1a202c">Input</text>
      <text x="60" y="38" class="node-sub">User Prompt / Query</text>
    </g>

    <!-- Arrow Input -> Model -->
    <line x1="170" y1="72" x2="310" y2="72" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="240" y="64" text-anchor="middle" class="annotation">Prompt Tokens</text>

    <!-- Model Box -->
    <g transform="translate(310, 42)">
      <rect width="180" height="60" rx="4" fill="#ebf8ff" stroke="#90cdf4" stroke-width="1.5"/>
      <text x="90" y="28" class="node-text" fill="#2b6cb0">Foundation Model</text>
      <text x="90" y="44" class="node-sub" fill="#3182ce">Forward Pass / KV Cache</text>
    </g>

    <!-- Arrow Model -> Output -->
    <line x1="490" y1="72" x2="630" y2="72" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="560" y="64" text-anchor="middle" class="annotation">Completion Tokens</text>

    <!-- Output Box -->
    <g transform="translate(630, 48)">
      <rect width="120" height="48" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
      <text x="60" y="24" class="node-text" fill="#1a202c">Output</text>
      <text x="60" y="38" class="node-sub">Text Stream / JSON</text>
    </g>

    <!-- Optimization Callout Bracket below Model -->
    <g transform="translate(290, 112)">
      <line x1="110" y1="0" x2="110" y2="8" stroke="#2b6cb0" stroke-width="1.2"/>
      <rect x="0" y="8" width="220" height="38" rx="4" fill="#ebf8ff" stroke="#bee3f8" stroke-width="1"/>
      <text x="110" y="22" class="opt-hdr" fill="#2b6cb0">optimize this (Micro-Efficiency)</text>
      <text x="110" y="36" class="opt-metric" fill="#2c5282">FLOPs / token  •  joules / token</text>
    </g>
    
    <!-- Descriptive Notes on right -->
    <g transform="translate(560, 120)">
      <text x="0" y="12" class="annotation">• Single forward pass; volatile activation reclamation</text>
      <text x="0" y="26" class="annotation">• Zero persistent environment state or self-correction</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: AGENTIC AI (Closed-Loop Trajectory Execution)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(20, 205)">
    <rect width="840" height="325" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2"/>
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="840" height="30" rx="4" fill="#faf5ff"/>
    <text x="16" y="20" class="section-hdr" fill="#553c9e">2. AGENTIC AI: CLOSED-LOOP TRAJECTORY EXECUTION</text>
    <rect x="665" y="6" width="160" height="18" rx="2" fill="#ede9fe"/>
    <text x="745" y="18.5" text-anchor="middle" class="badge-text" fill="#6b46c1">Stateful Feedback System</text>

    <!-- Overarching Foundation Model Backbone Box -->
    <g transform="translate(195, 42)">
      <rect width="455" height="30" rx="4" fill="#faf5ff" stroke="#b794f4" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="227" y="19" class="node-text" fill="#553c9e" font-size="11.5px">Neural Foundation Model Backbone (Cognitive Policy Engine)</text>
      
      <!-- Downward connector lines to sub-components -->
      <line x1="60" y1="30" x2="60" y2="46" stroke="#805ad5" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <line x1="210" y1="30" x2="210" y2="46" stroke="#805ad5" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <line x1="360" y1="30" x2="360" y2="46" stroke="#805ad5" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
    </g>

    <!-- Subsystem Nodes Row 1 -->
    <!-- Input Goal -->
    <g transform="translate(35, 90)">
      <rect width="105" height="48" rx="4" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
      <text x="52" y="23" class="node-text" fill="#1a202c">Input Goal</text>
      <text x="52" y="37" class="node-sub">User Objective</text>
    </g>

    <!-- Arrow Input -> Planner -->
    <line x1="140" y1="114" x2="195" y2="114" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Planner Node -->
    <g transform="translate(195, 90)">
      <rect width="120" height="48" rx="4" fill="#faf5ff" stroke="#b794f4" stroke-width="1.2"/>
      <text x="60" y="23" class="node-text" fill="#553c9e">Planner</text>
      <text x="60" y="37" class="node-sub" fill="#6b46c1">Decomposition</text>
    </g>

    <!-- Arrow Planner -> Retrieval -->
    <line x1="315" y1="114" x2="350" y2="114" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Retrieval Node -->
    <g transform="translate(350, 90)">
      <rect width="120" height="48" rx="4" fill="#faf5ff" stroke="#b794f4" stroke-width="1.2"/>
      <text x="60" y="23" class="node-text" fill="#553c9e">Retrieval</text>
      <text x="60" y="37" class="node-sub" fill="#6b46c1">Context &amp; Memory</text>
    </g>

    <!-- Arrow Retrieval -> Tool -->
    <line x1="470" y1="114" x2="505" y2="114" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Tool Execution Node -->
    <g transform="translate(505, 90)">
      <rect width="120" height="48" rx="4" fill="#fffaf0" stroke="#fbd38d" stroke-width="1.2"/>
      <text x="60" y="23" class="node-text" fill="#c05621">Tool / Action</text>
      <text x="60" y="37" class="node-sub" fill="#dd6b20">Sandbox &amp; POSIX</text>
    </g>

    <!-- Row 2: Verification Node -->
    <!-- Downward arrows into Verification -->
    <path d="M 410 138 L 410 156 L 485 156" fill="none" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
    <text x="445" y="151" class="node-sub" font-size="8.5px">Context</text>

    <line x1="565" y1="138" x2="565" y2="156" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
    <text x="590" y="149" class="node-sub" font-size="8.5px">Mutations</text>

    <g transform="translate(485, 156)">
      <rect width="160" height="50" rx="4" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5"/>
      <text x="80" y="24" class="node-text" fill="#22543d">Verification Oracle</text>
      <text x="80" y="38" class="node-sub" fill="#276749">Compilers, Linters &amp; Tests</text>
    </g>

    <!-- Arrow Verification -> Output (Terminal Success) -->
    <line x1="645" y1="181" x2="715" y2="181" stroke="#22543d" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
    <rect x="648" y="165" width="60" height="14" rx="2" fill="#c6f6d5"/>
    <text x="678" y="175.5" text-anchor="middle" class="flow-label" fill="#22543d">PASS / OK</text>

    <!-- Terminal Output Node -->
    <g transform="translate(718, 158)">
      <rect width="112" height="46" rx="4" fill="#f0fff4" stroke="#68d391" stroke-width="1.5"/>
      <text x="56" y="22" class="node-text" fill="#22543d">Output</text>
      <text x="56" y="36" class="node-sub" fill="#276749">Certified Objective</text>
    </g>

    <!-- Closed-Loop Feedback Path (Verification -> Planner on Retry / Incomplete) -->
    <path d="M 485 185 L 255 185 L 255 142" fill="none" stroke="#c53030" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
    
    <!-- Badge on Feedback Path -->
    <rect x="270" y="193" width="190" height="17" rx="2" fill="#fff5f5" stroke="#feb2b2" stroke-width="0.8"/>
    <text x="365" y="205" text-anchor="middle" class="badge-text" fill="#c53030">RETRY / REPLAN FEEDBACK LOOP</text>

    <!-- Optimization Callout for the Whole Loop -->
    <g transform="translate(120, 252)">
      <rect width="600" height="50" rx="4" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5"/>
      <text x="300" y="22" class="opt-hdr" fill="#22543d">optimize THIS WHOLE LOOP (Macro-Efficiency)</text>
      <text x="300" y="40" class="opt-metric" fill="#276749">joules / useful task  •  cost / resolved goal  •  Trajectory Goodput</text>
    </g>
  </g>
</svg>