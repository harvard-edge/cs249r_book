<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 200 290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch-orch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fdf0e3"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e67817" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="200" height="290" fill="#ffffff"/>
  <!-- log10 scale: 110 px per decade; bar spans 1x (y=254) to 100x (y=34) -->
  <!-- hardware 4x: log 0.602 = 66.2 px ; algorithm 2.5x: log 0.398 = 43.8 px ; orchestration 10x: 110 px -->
  <rect x="8" y="187.8" width="54" height="66.2" fill="#a3acb9" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="8" y="144" width="54" height="43.8" fill="#a3acb9" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="9.25" y="35.25" width="51.5" height="107.5" fill="url(#hatch-orch)" stroke="#e67817" stroke-width="2.5"/>
  <path d="M2 33 H68" stroke="#333333" stroke-width="3"/>
  <path d="M2 255 H68" stroke="#555555" stroke-width="2"/>
  <g font-size="15" fill="#333333">
    <text x="2" y="22" font-weight="bold">100× target</text>
    <text x="72" y="84">Orchestration</text>
    <text x="72" y="102" font-weight="bold" fill="#c2410c">10× required</text>
    <text x="72" y="161">Algorithm</text>
    <text x="72" y="179" font-weight="bold">2.5×</text>
    <text x="72" y="216">Hardware</text>
    <text x="72" y="234" font-weight="bold">4×</text>
    <text x="2" y="276">1× (log scale)</text>
  </g>
</svg>
