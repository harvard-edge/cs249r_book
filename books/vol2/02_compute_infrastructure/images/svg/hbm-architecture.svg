<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 435">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean canvas background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- LEFT CARD: HBM ASSEMBLY (ON-PACKAGE)                                   -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 16)">
    <rect width="310" height="380" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 306,0 Q 310,0 310,4 L 310,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="310" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#14294E">HBM3 Assembly (On-Package 2.5D)</text>

    <!-- Bandwidth & Energy callout box -->
    <g transform="translate(14, 38)">
      <rect width="135" height="42" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <text x="67.5" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#14294E">3.35 TB/s Bandwidth</text>
      <text x="67.5" y="32" text-anchor="middle" font-size="8.5" fill="#1F407A">80–141 GB HBM3e</text>

      <rect x="145" y="0" width="135" height="42" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="212.5" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">~2 pJ / bit Energy</text>
      <text x="212.5" y="32" text-anchor="middle" font-size="8.5" fill="#16a34a">10× lower than DDR5</text>
    </g>

    <!-- GPU Die -->
    <g transform="translate(18, 226)">
      <rect width="112" height="64" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="56" y="24" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14294E">GPU Compute</text>
      <text x="56" y="38" text-anchor="middle" font-size="8.5" fill="#475569">528 Tensor Cores</text>
      <rect x="18" y="44" width="76" height="14" rx="2" fill="#1F407A"/>
      <text x="56" y="54" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">H100 / B200</text>
    </g>

    <!-- HBM Stack 1 (8 DRAM dies stacked vertically) -->
    <g transform="translate(160, 92)">
      <!-- Dies 8 down to 1 -->
      <rect x="0" y="0" width="70" height="15" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="35" y="11" text-anchor="middle" font-size="7.5" fill="#15803d">DRAM Die 8</text>

      <rect x="0" y="17" width="70" height="15" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="35" y="28" text-anchor="middle" font-size="7.5" fill="#15803d">DRAM Die 7</text>

      <rect x="0" y="34" width="70" height="15" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="35" y="45" text-anchor="middle" font-size="7.5" fill="#15803d">DRAM Die 6</text>

      <rect x="0" y="51" width="70" height="15" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="35" y="62" text-anchor="middle" font-size="7.5" fill="#15803d">DRAM Die 5</text>

      <rect x="0" y="68" width="70" height="15" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="35" y="79" text-anchor="middle" font-size="7.5" fill="#15803d">DRAM Die 4</text>

      <rect x="0" y="85" width="70" height="15" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="35" y="96" text-anchor="middle" font-size="7.5" fill="#15803d">DRAM Die 3</text>

      <rect x="0" y="102" width="70" height="15" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="35" y="113" text-anchor="middle" font-size="7.5" fill="#15803d">DRAM Die 2</text>

      <rect x="0" y="119" width="70" height="15" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="35" y="130" text-anchor="middle" font-size="7.5" fill="#15803d">DRAM Die 1</text>

      <!-- Base Logic Die -->
      <rect x="0" y="136" width="70" height="18" rx="2" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
      <text x="35" y="148.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Base / TSV Logic</text>

      <!-- Vertical TSV indicator -->
      <line x1="80" y1="8" x2="80" y2="145" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="88" y="78" font-size="7.5" font-weight="700" fill="#15803d" transform="rotate(90 88 78)">1024-bit TSVs</text>
    </g>

    <!-- Silicon Interposer -->
    <g transform="translate(18, 296)">
      <rect width="274" height="24" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="137" y="15.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Silicon Interposer (&lt; 5 mm passive sub-micron routing)</text>
      <!-- microbumps between GPU/HBM and interposer -->
      <line x1="130" y1="-3" x2="160" y2="-3" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="145" y="-6" text-anchor="middle" font-size="7" fill="#64748b">μ-bumps</text>
    </g>

    <!-- Package Substrate -->
    <g transform="translate(18, 326)">
      <rect width="274" height="20" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="137" y="13.5" text-anchor="middle" font-size="8" fill="#64748b">Organic Package Substrate</text>
    </g>

    <!-- Bullet recap -->
    <text x="155" y="366" text-anchor="middle" font-size="8" fill="#64748b">Micrometer-scale 2.5D vertical stack minimizes RC parasitics</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- RIGHT CARD: DDR5 REFERENCE (OFF-PACKAGE)                               -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(350, 16)">
    <rect width="310" height="380" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 306,0 Q 310,0 310,4 L 310,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="310" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#475569">DDR5 Reference (Off-Package DIMM)</text>

    <!-- Bandwidth & Energy callout box -->
    <g transform="translate(14, 38)">
      <rect width="135" height="42" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="67.5" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">~200 GB/s Bandwidth</text>
      <text x="67.5" y="32" text-anchor="middle" font-size="8.5" fill="#dc2626">16× slower than HBM</text>

      <rect x="145" y="0" width="135" height="42" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="212.5" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">~20 pJ / bit Energy</text>
      <text x="212.5" y="32" text-anchor="middle" font-size="8.5" fill="#dc2626">Centimeter trace drive</text>
    </g>

    <!-- CPU Die -->
    <g transform="translate(18, 226)">
      <rect width="90" height="64" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="45" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Host CPU</text>
      <text x="45" y="40" text-anchor="middle" font-size="8" fill="#64748b">Memory Ctrl</text>
      <rect x="12" y="46" width="66" height="12" rx="2" fill="#e2e8f0"/>
      <text x="45" y="55" text-anchor="middle" font-size="7" fill="#475569">x86 / ARM</text>
    </g>

    <!-- Long PCB trace -->
    <g transform="translate(112, 250)">
      <line x1="0" y1="8" x2="60" y2="8" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
      <text x="30" y="-1" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">64-bit bus</text>
      <text x="30" y="21" text-anchor="middle" font-size="7" fill="#64748b">10–15 cm trace</text>
    </g>

    <!-- DDR5 DIMM Slot -->
    <g transform="translate(185, 92)">
      <rect width="98" height="198" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="49" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">DDR5 DIMM</text>

      <!-- DRAM packages on DIMM -->
      <rect x="12" y="26" width="74" height="16" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.6"/>
      <text x="49" y="37.5" text-anchor="middle" font-size="7.5" fill="#475569">DRAM Device 1</text>

      <rect x="12" y="46" width="74" height="16" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.6"/>
      <text x="49" y="57.5" text-anchor="middle" font-size="7.5" fill="#475569">DRAM Device 2</text>

      <rect x="12" y="66" width="74" height="16" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.6"/>
      <text x="49" y="77.5" text-anchor="middle" font-size="7.5" fill="#475569">DRAM Device 3</text>

      <rect x="12" y="86" width="74" height="16" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.6"/>
      <text x="49" y="97.5" text-anchor="middle" font-size="7.5" fill="#475569">DRAM Device 4</text>

      <text x="49" y="120" text-anchor="middle" font-size="8" fill="#94a3b8">···</text>

      <!-- DIMM edge connector -->
      <rect x="8" y="172" width="82" height="18" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="49" y="184" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">288-Pin Connector</text>
    </g>

    <!-- PCB Motherboard -->
    <g transform="translate(18, 296)">
      <rect width="274" height="24" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="137" y="15.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Motherboard FR4 PCB (Centimeter traces)</text>
    </g>

    <!-- System Chassis -->
    <g transform="translate(18, 326)">
      <rect width="274" height="20" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="137" y="13.5" text-anchor="middle" font-size="8" fill="#64748b">Server Chassis Motherboard Plane</text>
    </g>

    <!-- Bullet recap -->
    <text x="155" y="366" text-anchor="middle" font-size="8" fill="#64748b">Long PCB traces force high drive voltage and narrow pin counts</text>
  </g>

  <!-- Footnote -->
  <text x="340" y="420" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic">
    HBM's 1024-bit TSV bus replaces centimeter PCB traces with micrometer vertical paths — achieving 16× bandwidth at 10× lower energy per bit.
  </text>
</svg>
