<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E67817"/>
    </marker>
    <marker id="tube-gray" markerWidth="14" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <marker id="tube-orange" markerWidth="14" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#E67817"/>
    </marker>
  </defs>

  <!-- ===== panel headers ===== -->
  <text x="180" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Air</text>
  <text x="540" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Direct-to-chip liquid</text>
  <line x1="360" y1="20" x2="360" y2="238" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= AIR ================= -->
  <!-- heat sink fins -->
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="0.8">
    <rect x="124" y="100" width="5" height="70"/>
    <rect x="137" y="100" width="5" height="70"/>
    <rect x="150" y="100" width="5" height="70"/>
    <rect x="163" y="100" width="5" height="70"/>
    <rect x="176" y="100" width="5" height="70"/>
    <rect x="189" y="100" width="5" height="70"/>
    <rect x="202" y="100" width="5" height="70"/>
    <rect x="215" y="100" width="5" height="70"/>
    <rect x="228" y="100" width="5" height="70"/>
    <rect x="120" y="170" width="116" height="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  </g>
  <text x="178" y="90" text-anchor="middle" font-size="12.5" fill="#334155">heat sink</text>

  <!-- chip + board -->
  <rect x="138" y="184" width="80" height="16" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <rect x="60" y="200" width="240" height="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="128" y="197" text-anchor="end" font-size="12.5" font-weight="700" fill="#9a4a0b">chip</text>

  <!-- airflow loop: cool supply rises from heat rejection to the inlet, warm exhaust collects and returns -->
  <g stroke-width="1.5" fill="none">
    <path d="M200,300 H40 V118" stroke="#64748b"/>
    <path d="M40,136 V154" stroke="#64748b"/>
    <line x1="40" y1="118" x2="116" y2="118" stroke="#64748b" marker-end="url(#arr-gray)"/>
    <line x1="40" y1="136" x2="116" y2="136" stroke="#64748b" marker-end="url(#arr-gray)"/>
    <line x1="40" y1="154" x2="116" y2="154" stroke="#64748b" marker-end="url(#arr-gray)"/>
    <line x1="242" y1="118" x2="310" y2="118" stroke="#E67817"/>
    <line x1="242" y1="136" x2="310" y2="136" stroke="#E67817"/>
    <line x1="242" y1="154" x2="310" y2="154" stroke="#E67817"/>
    <path d="M310,118 V276" stroke="#E67817" marker-end="url(#arr-orange)"/>
  </g>
  <text x="56" y="106" font-size="12.5" fill="#334155">cool air</text>
  <text x="296" y="106" text-anchor="end" font-size="12.5" fill="#9a4a0b">warm air</text>

  <!-- ================= LIQUID ================= -->
  <!-- cold plate -->
  <rect x="490" y="164" width="100" height="20" rx="1" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="480" y="179" text-anchor="end" font-size="12.5" fill="#334155">cold plate</text>

  <!-- chip + board -->
  <rect x="500" y="184" width="80" height="16" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <text x="490" y="197" text-anchor="end" font-size="12.5" font-weight="700" fill="#9a4a0b">chip</text>
  <rect x="430" y="200" width="220" height="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>

  <!-- coolant loop: cool supply rises from heat rejection, warm return goes back -->
  <path d="M400,278 V80 H520 V152" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#tube-gray)"/>
  <path d="M560,164 V96 H660 V266" fill="none" stroke="#E67817" stroke-width="4" marker-end="url(#tube-orange)"/>
  <text x="410" y="72" font-size="12.5" fill="#334155">cool supply</text>
  <text x="572" y="88" font-size="12.5" fill="#9a4a0b">warm return</text>

  <!-- ================= boundary + facility ================= -->
  <line x1="20" y1="250" x2="700" y2="250" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="50" y="243" font-size="12" fill="#475569">server and rack</text>
  <text x="50" y="266" font-size="12" fill="#475569">facility</text>

  <rect x="200" y="278" width="480" height="44" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Heat rejection</text>
</svg>
