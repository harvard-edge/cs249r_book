<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-gray-s" markerWidth="7" markerHeight="6" refX="0.5" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="364" fill="#ffffff"/>
  <!-- Ring spacing is proportional to log10 of each step ratio:
       HBM to NVLink 7.44x (0.872), NVLink to IB 9x (0.954), IB to storage 7.14x (0.854); 85 units per decade in x, 47 in y. -->
  <ellipse cx="340" cy="182" rx="287.8" ry="159.9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <ellipse cx="340" cy="182" rx="215.2" ry="119.8" fill="#ffffff" stroke="none"/>
  <ellipse cx="340" cy="182" rx="215.2" ry="119.8" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5,3"/>
  <ellipse cx="340" cy="182" rx="134.1" ry="75.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <ellipse cx="340" cy="182" rx="60" ry="34" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>

  <!-- Tier names in the upper part of each band -->
  <text x="340" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Example storage path</text>
  <text x="340" y="55" text-anchor="middle" font-size="11" fill="#334155">illustrative</text>
  <text x="340" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">InfiniBand NDR</text>
  <text x="340" y="97" text-anchor="middle" font-size="11" fill="#334155">one port, per direction</text>
  <text x="340" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">NVLink / NVSwitch</text>
  <text x="340" y="139" text-anchor="middle" font-size="11" fill="#334155">per GPU, each way</text>
  <text x="340" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">HBM3</text>
  <text x="340" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1F407A">3.35 TB/s</text>

  <!-- Bandwidth of each tier on the left radius -->
  <text x="243" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">450 GB/s</text>
  <text x="165.3" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">50 GB/s</text>
  <text x="88.5" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">7 GB/s</text>

  <!-- Step ratio across each boundary on the right radius: the band width is the cut -->
  <line x1="403" y1="191" x2="471.1" y2="191" stroke="#64748b" stroke-width="0.8" marker-start="url(#arr-gray-s)" marker-end="url(#arr-gray)"/>
  <line x1="477.1" y1="191" x2="552.2" y2="191" stroke="#64748b" stroke-width="0.8" marker-start="url(#arr-gray-s)" marker-end="url(#arr-gray)"/>
  <line x1="558.2" y1="191" x2="624.8" y2="191" stroke="#64748b" stroke-width="0.8" marker-start="url(#arr-gray-s)" marker-end="url(#arr-gray)"/>
  <text x="437" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">÷7.4</text>
  <text x="514.7" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">÷9</text>
  <text x="591.5" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">÷7.1</text>
  <text x="340" y="326" text-anchor="middle" font-size="11" fill="#334155">band width proportional to log of each step</text>
</svg>
