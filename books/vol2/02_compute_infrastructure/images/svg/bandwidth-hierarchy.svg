<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean canvas background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CONCENTRIC BANDWIDTH ZONES (Center at 310, 235)                        -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->

  <!-- Zone 4: Storage / PFS (outermost) — Storage Green -->
  <ellipse cx="310" cy="235" rx="275" ry="175" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>

  <!-- Zone 3: InfiniBand NDR (Inter-Node) — Fabric Purple -->
  <ellipse cx="310" cy="235" rx="210" ry="132" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>

  <!-- Zone 2: NVLink / NVSwitch (Intra-Node) — Comm Amber -->
  <ellipse cx="310" cy="235" rx="145" ry="90" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>

  <!-- Zone 1: HBM3 (On-Package) — Compute Blue -->
  <ellipse cx="310" cy="235" rx="78" ry="48" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>

  <!-- ===== Center Zone 1: HBM3 ===== -->
  <g transform="translate(310, 235)" text-anchor="middle">
    <text y="-8" font-size="11" font-weight="700" fill="#0369a1">HBM3 / HBM3e</text>
    <text y="7" font-size="11" font-weight="700" fill="#0284c7">3.35 TB/s</text>
    <text y="19" font-size="7.5" fill="#64748b">~100 ns · On-Package</text>
  </g>

  <!-- ===== Zone 2 Label Pill: NVLink ===== -->
  <g transform="translate(310, 162)">
    <rect x="-105" y="-14" width="210" height="24" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
    <text x="0" y="-1.5" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">NVLink 4 / NVSwitch · 900 GB/s</text>
    <text x="0" y="8" text-anchor="middle" font-size="7.5" fill="#64748b">1–3 μs latency · 8-GPU intra-node mesh</text>
  </g>

  <!-- ===== Zone 3 Label Pill: InfiniBand ===== -->
  <g transform="translate(310, 118)">
    <rect x="-120" y="-14" width="240" height="24" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="0" y="-1.5" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">InfiniBand NDR / RoCEv2 · 50 GB/s (400G)</text>
    <text x="0" y="8" text-anchor="middle" font-size="7.5" fill="#64748b">3–10 μs latency · Inter-node fat-tree network</text>
  </g>

  <!-- ===== Zone 4 Label Pill: Storage ===== -->
  <g transform="translate(310, 72)">
    <rect x="-135" y="-14" width="270" height="24" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
    <text x="0" y="-1.5" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Parallel File System (Lustre / NVMe-oF) · 7–15 GB/s</text>
    <text x="0" y="8" text-anchor="middle" font-size="7.5" fill="#64748b">100–1,000 μs latency · Remote persistent storage</text>
  </g>

  <!-- ===== Left Scope Badges ===== -->
  <g transform="translate(20, 68)">
    <!-- Storage -->
    <rect x="0" y="0" width="76" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="38" y="13" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Persistent</text>

    <!-- Inter-Node -->
    <rect x="0" y="44" width="76" height="20" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="38" y="57" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Inter-Node</text>

    <!-- Intra-Node -->
    <rect x="0" y="88" width="76" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
    <text x="38" y="101" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Intra-Node</text>

    <!-- On-Package -->
    <rect x="0" y="142" width="76" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="38" y="155" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">On-Package</text>
  </g>

  <!-- ===== Bandwidth Cliff Indicators (Right Boundary) ===== -->
  <!-- HBM to NVLink -->
  <g transform="translate(415, 210)">
    <line x1="0" y1="0" x2="30" y2="-10" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>
    <rect x="22" y="-24" width="56" height="16" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="50" y="-13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">3.7× drop</text>
  </g>

  <!-- NVLink to IB -->
  <g transform="translate(442, 148)">
    <line x1="0" y1="0" x2="30" y2="-10" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>
    <rect x="22" y="-24" width="56" height="16" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="50" y="-13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">18× drop</text>
  </g>

  <!-- IB to Storage -->
  <g transform="translate(460, 94)">
    <line x1="0" y1="0" x2="30" y2="-10" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>
    <rect x="22" y="-24" width="56" height="16" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="50" y="-13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">7× drop</text>
  </g>

  <!-- ===== Right Scale Bar (Log Scale) ===== -->
  <g transform="translate(615, 42)">
    <text x="12" y="0" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Bandwidth</text>
    <text x="12" y="11" text-anchor="middle" font-size="7.5" fill="#64748b">(Log scale)</text>

    <!-- Scale bar background -->
    <rect x="0" y="20" width="24" height="326" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- HBM segment -->
    <rect x="1" y="21" width="22" height="72" rx="2" fill="#e0f2fe"/>
    <text x="-6" y="58" text-anchor="end" font-size="8" font-weight="700" fill="#0369a1">3.35 TB/s</text>
    <line x1="-4" y1="55" x2="0" y2="55" stroke="#0284c7" stroke-width="1.2"/>

    <!-- NVLink segment -->
    <rect x="1" y="94" width="22" height="84" fill="#fef3c7"/>
    <text x="-6" y="136" text-anchor="end" font-size="8" font-weight="700" fill="#b45309">900 GB/s</text>
    <line x1="-4" y1="133" x2="0" y2="133" stroke="#d97706" stroke-width="1.2"/>

    <!-- IB segment -->
    <rect x="1" y="179" width="22" height="92" fill="#f3e8ff"/>
    <text x="-6" y="226" text-anchor="end" font-size="8" font-weight="700" fill="#6d28d9">50 GB/s</text>
    <line x1="-4" y1="223" x2="0" y2="223" stroke="#7c3aed" stroke-width="1.2"/>

    <!-- Storage segment -->
    <rect x="1" y="272" width="22" height="74" rx="2" fill="#dcfce7"/>
    <text x="-6" y="310" text-anchor="end" font-size="8" font-weight="700" fill="#15803d">7 GB/s</text>
    <line x1="-4" y1="307" x2="0" y2="307" stroke="#16a34a" stroke-width="1.2"/>

    <!-- Zero tick -->
    <text x="12" y="358" text-anchor="middle" font-size="7.5" fill="#94a3b8">0</text>
  </g>

  <!-- Footnote -->
  <text x="310" y="426" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic">
    Parallelism partitioning matches tier bandwidth: tensor parallelism within NVLink, pipeline parallelism across InfiniBand.
  </text>
</svg>
