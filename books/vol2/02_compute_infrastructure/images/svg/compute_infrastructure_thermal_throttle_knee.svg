<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="80pt" viewBox="0 0 180 160" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#777777" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="180" height="160" fill="#ffffff"/>
  <!-- Schematic: chip temperature over time. Balanced, then cooling falls behind, then throttling caps it. -->
  <path d="M 22 10 V 136 H 176" fill="none" stroke="#cccccc" stroke-width="1.6"/>
  <text x="176" y="152" font-size="12" fill="#777777" text-anchor="end">Time</text>
  <text x="0" y="0" font-size="12" fill="#777777" text-anchor="middle" transform="translate(14 80) rotate(-90)">Chip temp</text>
  <!-- Thermal limit (wall) -->
  <line x1="22" y1="34" x2="176" y2="34" stroke="#cb202d" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="176" y="26" font-size="12.5" fill="#cb202d" text-anchor="end">Thermal limit</text>
  <!-- Margin between steady temperature and limit -->
  <line x1="34" y1="37" x2="34" y2="101" stroke="#777777" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="38" y="62" width="44" height="18" fill="#ffffff"/>
  <text x="40" y="75" font-size="12.5" fill="#333333">Margin</text>
  <!-- Temperature trace -->
  <path d="M 22 104 H 62 C 78 104 112 50 132 40 H 172" fill="none" stroke="#333333" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="176" y="60" font-size="12.5" fill="#333333" text-anchor="end">Throttle</text>
</svg>
