<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean canvas background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CARD 1: RING TOPOLOGY                                                 -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(18, 16)">
    <rect width="236" height="366" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 232,0 Q 236,0 236,4 L 236,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="236" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#334155">1. Ring Topology</text>
    <text x="222" y="18" text-anchor="end" font-size="8" fill="#64748b">Pass-Through</text>

    <!-- Ring arrows (connecting G0..G7 in a ring) -->
    <g transform="translate(118, 150)">
      <!-- Ring loop path -->
      <path d="M 0,-70 A 70,70 0 1,1 -0.1,-70" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,2"/>

      <!-- GPU Nodes positioned in ring -->
      <!-- G0 top (0, -70) -->
      <g transform="translate(-18, -80)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G0</text>
      </g>
      <!-- G1 (50, -50) -->
      <g transform="translate(32, -60)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G1</text>
      </g>
      <!-- G2 (70, 0) -->
      <g transform="translate(52, -10)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G2</text>
      </g>
      <!-- G3 (50, 50) -->
      <g transform="translate(32, 40)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G3</text>
      </g>
      <!-- G4 (0, 70) -->
      <g transform="translate(-18, 60)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G4</text>
      </g>
      <!-- G5 (-50, 50) -->
      <g transform="translate(-68, 40)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G5</text>
      </g>
      <!-- G6 (-70, 0) -->
      <g transform="translate(-88, -10)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G6</text>
      </g>
      <!-- G7 (-50, -50) -->
      <g transform="translate(-68, -60)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G7</text>
      </g>

      <!-- Center text -->
      <text x="0" y="-3" text-anchor="middle" font-size="8" fill="#64748b">1-Hop</text>
      <text x="0" y="9" text-anchor="middle" font-size="7.5" fill="#94a3b8">Neighbors</text>
    </g>

    <!-- Properties Card -->
    <g transform="translate(14, 252)">
      <rect width="208" height="100" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#334155">Ring Invariants:</text>
      <text x="10" y="34" font-size="8" fill="#64748b">• 2 links per GPU (minimal pin cost)</text>
      <text x="10" y="48" font-size="8" fill="#64748b">• Max hop distance: N/2 = 4 hops</text>
      
      <rect x="10" y="58" width="188" height="32" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.6"/>
      <text x="16" y="71" font-size="7.5" font-weight="700" fill="#b45309">Bottleneck:</text>
      <text x="16" y="83" font-size="7.5" fill="#b45309">Latency scales O(N); 1 link failure stalls ring</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CARD 2: DIRECT MESH                                                   -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(272, 16)">
    <rect width="236" height="366" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 232,0 Q 236,0 236,4 L 236,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="236" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#334155">2. Direct Mesh</text>
    <text x="222" y="18" text-anchor="end" font-size="8" fill="#64748b">Point-to-Point</text>

    <!-- Mesh cross-connections -->
    <g transform="translate(118, 150)">
      <!-- Full mesh links -->
      <line x1="0" y1="-70" x2="50" y2="-50" stroke="#cbd5e1" stroke-width="0.8"/>
      <line x1="0" y1="-70" x2="70" y2="0" stroke="#cbd5e1" stroke-width="0.8"/>
      <line x1="0" y1="-70" x2="50" y2="50" stroke="#cbd5e1" stroke-width="0.8"/>
      <line x1="0" y1="-70" x2="0" y2="70" stroke="#0284c7" stroke-width="1"/>
      <line x1="0" y1="-70" x2="-50" y2="50" stroke="#cbd5e1" stroke-width="0.8"/>
      <line x1="0" y1="-70" x2="-70" y2="0" stroke="#cbd5e1" stroke-width="0.8"/>
      <line x1="0" y1="-70" x2="-50" y2="-50" stroke="#cbd5e1" stroke-width="0.8"/>

      <line x1="70" y1="0" x2="-70" y2="0" stroke="#0284c7" stroke-width="1"/>
      <line x1="50" y1="-50" x2="-50" y2="50" stroke="#0284c7" stroke-width="1"/>
      <line x1="-50" y1="-50" x2="50" y2="50" stroke="#0284c7" stroke-width="1"/>

      <!-- GPU Nodes -->
      <g transform="translate(-18, -80)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G0</text>
      </g>
      <g transform="translate(32, -60)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G1</text>
      </g>
      <g transform="translate(52, -10)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G2</text>
      </g>
      <g transform="translate(32, 40)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G3</text>
      </g>
      <g transform="translate(-18, 60)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G4</text>
      </g>
      <g transform="translate(-68, 40)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G5</text>
      </g>
      <g transform="translate(-88, -10)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G6</text>
      </g>
      <g transform="translate(-68, -60)">
        <rect width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="18" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G7</text>
      </g>

      <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="0" y="3" text-anchor="middle" font-size="7.5" font-weight="600" fill="#64748b">28 links</text>
    </g>

    <!-- Properties Card -->
    <g transform="translate(14, 252)">
      <rect width="208" height="100" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#334155">Mesh Invariants:</text>
      <text x="10" y="34" font-size="8" fill="#64748b">• Links grow as O(N²): N(N-1)/2 = 28</text>
      <text x="10" y="48" font-size="8" fill="#64748b">• Direct 1-hop reach to all ranks</text>

      <rect x="10" y="58" width="188" height="32" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.6"/>
      <text x="16" y="71" font-size="7.5" font-weight="700" fill="#b91c1c">Bottleneck:</text>
      <text x="16" y="83" font-size="7.5" fill="#b91c1c">Unroutable PCB traces; impractical for N &gt; 8</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CARD 3: NVSWITCH FABRIC                                               -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(526, 16)">
    <rect width="236" height="366" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 232,0 Q 236,0 236,4 L 236,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="236" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#6d28d9">3. NVSwitch Crossbar</text>
    <text x="222" y="18" text-anchor="end" font-size="8" fill="#15803d">Non-Blocking</text>

    <!-- NVSwitch Central Crossbar Architecture -->
    <g transform="translate(18, 42)">
      <!-- Left 4 GPUs -->
      <g transform="translate(0, 8)">
        <rect y="0" width="38" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="19" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G0</text>
        <line x1="38" y1="11" x2="68" y2="40" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

        <rect y="38" width="38" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="19" y="52" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G2</text>
        <line x1="38" y1="49" x2="68" y2="58" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

        <rect y="76" width="38" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="19" y="90" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G4</text>
        <line x1="38" y1="87" x2="68" y2="76" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

        <rect y="114" width="38" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="19" y="128" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G6</text>
        <line x1="38" y1="125" x2="68" y2="94" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      </g>

      <!-- Center NVSwitch Chip -->
      <g transform="translate(68, 16)">
        <rect width="64" height="128" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="32" y="32" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">NVSwitch</text>
        <text x="32" y="46" text-anchor="middle" font-size="7" fill="#7c3aed">Crossbar</text>

        <rect x="6" y="60" width="52" height="24" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="0.8"/>
        <text x="32" y="72" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Non-</text>
        <text x="32" y="81" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Blocking</text>

        <rect x="6" y="96" width="52" height="22" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
        <text x="32" y="107" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">900 GB/s</text>
        <text x="32" y="115" text-anchor="middle" font-size="6.5" fill="#16a34a">Uniform</text>
      </g>

      <!-- Right 4 GPUs -->
      <g transform="translate(162, 8)">
        <rect y="0" width="38" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="19" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G1</text>
        <line x1="0" y1="11" x2="-30" y2="40" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

        <rect y="38" width="38" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="19" y="52" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G3</text>
        <line x1="0" y1="49" x2="-30" y2="58" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

        <rect y="76" width="38" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="19" y="90" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G5</text>
        <line x1="0" y1="87" x2="-30" y2="76" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

        <rect y="114" width="38" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="19" y="128" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">G7</text>
        <line x1="0" y1="125" x2="-30" y2="94" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      </g>
    </g>

    <!-- Properties Card -->
    <g transform="translate(14, 252)">
      <rect width="208" height="100" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#334155">NVSwitch Invariants:</text>
      <text x="10" y="34" font-size="8" fill="#64748b">• Uniform 1-hop crossbar fabric</text>
      <text x="10" y="48" font-size="8" fill="#64748b">• Full bisection bandwidth (900 GB/s)</text>

      <rect x="8" y="58" width="192" height="32" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.6"/>
      <text x="14" y="71" font-size="7.5" font-weight="700" fill="#15803d">Fleet Advantage:</text>
      <text x="14" y="83" font-size="7" fill="#15803d">Enables intra-node Tensor Parallelism with zero NUMA skew</text>
    </g>
  </g>

  <!-- Footnote -->
  <text x="390" y="415" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic">
    NVSwitch decouples port count from node diameter: every GPU pair communicates simultaneously at full NVLink 4 line rate.
  </text>
</svg>
