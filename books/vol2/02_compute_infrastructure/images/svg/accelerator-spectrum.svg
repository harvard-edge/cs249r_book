  <rect x="130" y="124" width="300" height="24" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="130" y="124" width="210" height="24" rx="0" fill="#1F407A" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="340" y="124" width="30" height="24" rx="0" fill="#9db4d3" stroke="#1F407A" stroke-width="0.8"/>
  <text x="438" y="140" text-anchor="start" font-size="10.5" font-weight="700" fill="#14294E">70–80%</text>
