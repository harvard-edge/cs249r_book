<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 445">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Clean canvas background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- SPECTRUM BAR & GENERALITY TAX                                          -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <rect x="20" y="14" width="640" height="12" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="35" y1="20" x2="645" y2="20" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  
  <text x="25" y="42" text-anchor="start" font-size="9" font-weight="600" fill="#64748b">General-Purpose</text>
  
  <!-- Generality Tax annotation -->
  <line x1="320" y1="38" x2="495" y2="38" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow-amber)"/>
  <text x="407" y="32" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Generality Tax eliminated →</text>
  
  <text x="655" y="42" text-anchor="end" font-size="9" font-weight="700" fill="#0369a1">Maximum Compute Density</text>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CARD 1: CPU                                                           -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 52)">
    <rect width="142" height="312" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 138,0 Q 142,0 142,4 L 142,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="142" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="71" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">CPU</text>

    <text x="71" y="42" text-anchor="middle" font-size="8.5" fill="#64748b">General-Purpose</text>

    <!-- CPU pie chart (mostly control/cache) -->
    <g transform="translate(71, 104)">
      <!-- Control/cache: 90% -->
      <path d="M0,0 L0,-46 A46,46 0 1,1 -45,9 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <!-- Arithmetic: 10% -->
      <path d="M0,0 L-45,9 A46,46 0 0,1 0,-46 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">Die</text>
    </g>

    <!-- CPU legend -->
    <g transform="translate(16, 172)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="16" y="8.5" font-size="8" fill="#475569">Control/Cache</text>
      <text x="110" y="8.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#64748b">~90%</text>

      <rect x="0" y="16" width="10" height="10" rx="2" fill="#bae6fd" stroke="#0284c7" stroke-width="0.8"/>
      <text x="16" y="24.5" font-size="8" fill="#475569">Arithmetic</text>
      <text x="110" y="24.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#0369a1">~10%</text>
    </g>

    <g transform="translate(71, 236)" font-size="8" fill="#64748b" text-anchor="middle">
      <text y="0">Branch predictors</text>
      <text y="14">Out-of-order execution</text>
      <text y="28">Multi-level SRAM cache</text>
      <text y="46" font-size="8.5" font-weight="600" fill="#334155">Full programmability</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CARD 2: GPU                                                           -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(186, 52)">
    <rect width="142" height="312" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 138,0 Q 142,0 142,4 L 142,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="142" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="71" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">GPU</text>

    <text x="71" y="42" text-anchor="middle" font-size="8.5" fill="#64748b">SIMT Parallel</text>

    <!-- GPU pie chart: ~55% arithmetic, ~35% control, ~10% sched -->
    <g transform="translate(71, 104)">
      <!-- Control slice: 35% -->
      <path d="M0,0 L0,-46 A46,46 0 0,1 37.2,-27 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <!-- Schedulers slice: 10% -->
      <path d="M0,0 L37.2,-27 A46,46 0 0,1 46,0 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <!-- Arithmetic slice: 55% -->
      <path d="M0,0 L46,0 A46,46 0 1,1 0,-46 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">Die</text>
    </g>

    <!-- GPU legend -->
    <g transform="translate(16, 172)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="16" y="8.5" font-size="8" fill="#475569">Control</text>
      <text x="110" y="8.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#64748b">~35%</text>

      <rect x="0" y="16" width="10" height="10" rx="2" fill="#bae6fd" stroke="#0284c7" stroke-width="0.8"/>
      <text x="16" y="24.5" font-size="8" fill="#475569">Arithmetic</text>
      <text x="110" y="24.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#0369a1">~55%</text>
    </g>

    <g transform="translate(71, 236)" font-size="8" fill="#64748b" text-anchor="middle">
      <text y="0">SIMT warp execution</text>
      <text y="14">Hardware warp schedulers</text>
      <text y="28">High-speed HBM bus</text>
      <text y="46" font-size="8.5" font-weight="600" fill="#0369a1">Massive data parallelism</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CARD 3: TPU                                                           -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(352, 52)">
    <rect width="142" height="312" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 138,0 Q 142,0 142,4 L 142,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="142" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="71" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">TPU</text>

    <text x="71" y="42" text-anchor="middle" font-size="8.5" fill="#64748b">Systolic Matrix Unit</text>

    <!-- TPU pie chart: ~75% arithmetic -->
    <g transform="translate(71, 104)">
      <!-- Control: 20% -->
      <path d="M0,0 L0,-46 A46,46 0 0,1 43.7,-14.2 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <!-- Routing: 5% -->
      <path d="M0,0 L43.7,-14.2 A46,46 0 0,1 46,0 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <!-- Arithmetic: ~75% -->
      <path d="M0,0 L46,0 A46,46 0 1,1 0,-46 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">Die</text>
    </g>

    <!-- TPU legend -->
    <g transform="translate(16, 172)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="16" y="8.5" font-size="8" fill="#475569">Control</text>
      <text x="110" y="8.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#64748b">~20%</text>

      <rect x="0" y="16" width="10" height="10" rx="2" fill="#bae6fd" stroke="#0284c7" stroke-width="0.8"/>
      <text x="16" y="24.5" font-size="8" fill="#475569">Arithmetic</text>
      <text x="110" y="24.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#0369a1">~75%</text>
    </g>

    <g transform="translate(71, 236)" font-size="8" fill="#64748b" text-anchor="middle">
      <text y="0">2D systolic array</text>
      <text y="14">Zero instruction decode</text>
      <text y="28">Direct tensor streaming</text>
      <text y="46" font-size="8.5" font-weight="600" fill="#0369a1">High energy density</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CARD 4: CUSTOM ASIC                                                   -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(518, 52)">
    <rect width="142" height="312" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 138,0 Q 142,0 142,4 L 142,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="142" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="71" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">Custom ASIC</text>

    <text x="71" y="42" text-anchor="middle" font-size="8.5" fill="#64748b">Hardwired Dataflow</text>

    <!-- ASIC pie chart: ~92% arithmetic -->
    <g transform="translate(71, 104)">
      <!-- Control: 8% -->
      <path d="M0,0 L0,-46 A46,46 0 0,1 22.3,-40.3 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <!-- Arithmetic: 92% -->
      <path d="M0,0 L22.3,-40.3 A46,46 0 1,1 0,-46 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">Die</text>
    </g>

    <!-- ASIC legend -->
    <g transform="translate(16, 172)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="16" y="8.5" font-size="8" fill="#475569">Control</text>
      <text x="110" y="8.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#64748b">~8%</text>

      <rect x="0" y="16" width="10" height="10" rx="2" fill="#bae6fd" stroke="#0284c7" stroke-width="0.8"/>
      <text x="16" y="24.5" font-size="8" fill="#475569">Arithmetic</text>
      <text x="110" y="24.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#0369a1">&gt;90%</text>
    </g>

    <g transform="translate(71, 236)" font-size="8" fill="#64748b" text-anchor="middle">
      <text y="0">Hardwired pipeline</text>
      <text y="14">No general ISA overhead</text>
      <text y="28">5–10× efficiency gain</text>
      <text y="46" font-size="8.5" font-weight="600" fill="#0369a1">Application-locked</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- TRADEOFF AXIS LABELS                                                  -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <line x1="90" y1="390" x2="590" y2="390" stroke="#cbd5e1" stroke-width="1.2"/>

  <g transform="translate(90, 378)">
    <rect width="140" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="70" y="15.5" text-anchor="middle" font-size="9" font-weight="700" fill="#0369a1">← Higher Programmability</text>
  </g>

  <g transform="translate(450, 378)">
    <rect width="140" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="70" y="15.5" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Higher Energy Efficiency →</text>
  </g>

  <text x="340" y="428" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic">Each architectural step sacrifices programmability to dedicate silicon die area to arithmetic — eliminating the Generality Tax.</text>
</svg>
