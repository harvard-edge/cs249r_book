  <line x1="508" y1="44" x2="508" y2="188" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="520" y="116" text-anchor="middle" font-size="9.5" fill="#475569" transform="rotate(90 520 116.0)">More specialized</text>
