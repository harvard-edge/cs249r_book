  <text x="120" y="107" text-anchor="end" font-size="9" fill="#475569">SIMT warps, Tensor Cores</text>
  <rect x="130" y="84" width="300" height="24" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="130" y="84" width="150" height="24" rx="0" fill="#1F407A" stroke="#1F407A" stroke-width="0.8"/>
