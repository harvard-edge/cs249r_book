  <text x="120" y="175" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a">Custom ASIC</text>
  <text x="120" y="187" text-anchor="end" font-size="9" fill="#475569">Hardwired dataflow</text>
  <rect x="130" y="164" width="300" height="24" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="130" y="164" width="270" height="24" rx="0" fill="#1F407A" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="400" y="164" width="15" height="24" rx="0" fill="#9db4d3" stroke="#1F407A" stroke-width="0.8"/>
  <text x="438" y="180" text-anchor="start" font-size="10.5" font-weight="700" fill="#14294E">&gt;90%</text>
