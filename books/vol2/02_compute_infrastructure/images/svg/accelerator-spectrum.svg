  <line x1="130" y1="200" x2="430" y2="200" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="130" y1="200" x2="130" y2="204" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="130" y="215" text-anchor="middle" font-size="9" fill="#475569">0%</text>
  <line x1="205" y1="200" x2="205" y2="204" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="205" y="215" text-anchor="middle" font-size="9" fill="#475569">25%</text>
  <line x1="280" y1="200" x2="280" y2="204" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="280" y="215" text-anchor="middle" font-size="9" fill="#475569">50%</text>
  <line x1="355" y1="200" x2="355" y2="204" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="355" y="215" text-anchor="middle" font-size="9" fill="#475569">75%</text>
  <line x1="430" y1="200" x2="430" y2="204" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="430" y="215" text-anchor="middle" font-size="9" fill="#475569">100%</text>
  <text x="280" y="229" text-anchor="middle" font-size="9.5" fill="#475569">Share of die area</text>
