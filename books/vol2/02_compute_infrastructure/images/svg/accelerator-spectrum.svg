  <rect x="130" y="12" width="12" height="10" rx="1" fill="#1F407A" stroke="#1F407A" stroke-width="0.8"/>
  <text x="147" y="21" text-anchor="start" font-size="9.5" fill="#0f172a">Arithmetic units</text>
  <rect x="242" y="12" width="12" height="10" rx="1" fill="#9db4d3" stroke="#1F407A" stroke-width="0.8"/>
  <text x="259" y="21" text-anchor="start" font-size="9.5" fill="#0f172a">Range of estimates</text>
  <rect x="362" y="12" width="12" height="10" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="379" y="21" text-anchor="start" font-size="9.5" fill="#0f172a">Control, cache, other</text>
  <!-- ===== CPU ===== -->
  <text x="120" y="55" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a">CPU</text>
  <text x="120" y="67" text-anchor="end" font-size="9" fill="#475569">Branch prediction, caches</text>
