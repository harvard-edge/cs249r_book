<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 435">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean canvas background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- LEFT CARD: FAT-TREE (3-TIER CLOS FABRIC)                              -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(18, 16)">
    <rect width="314" height="380" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 310,0 Q 314,0 314,4 L 314,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="314" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#334155">Fat-Tree (3-Tier Clos Fabric)</text>
    <text x="300" y="18" text-anchor="end" font-size="8.5" fill="#64748b">InfiniBand / RoCEv2</text>

    <!-- Tier labels -->
    <g transform="translate(14, 38)" font-size="8" font-weight="700" fill="#64748b">
      <text y="14">Core</text>
      <text y="70">Spine</text>
      <text y="132">Leaf (ToR)</text>
      <text y="196">GPU Racks</text>
    </g>

    <!-- Core Switches (2) - Purple -->
    <g transform="translate(74, 42)">
      <rect x="20" y="0" width="60" height="20" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="50" y="13.5" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Core 1</text>

      <rect x="140" y="0" width="60" height="20" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="170" y="13.5" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Core 2</text>

      <!-- Spine Switches (4) - Amber -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="44" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="22" y="13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Sp 1</text>

        <rect x="60" y="0" width="44" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="82" y="13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Sp 2</text>

        <rect x="120" y="0" width="44" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="142" y="13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Sp 3</text>

        <rect x="180" y="0" width="44" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="202" y="13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Sp 4</text>
      </g>

      <!-- Core to Spine interconnect lines -->
      <line x1="50" y1="20" x2="22" y2="52" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="50" y1="20" x2="82" y2="52" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="50" y1="20" x2="142" y2="52" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2,2"/>
      <line x1="50" y1="20" x2="202" y2="52" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2,2"/>

      <line x1="170" y1="20" x2="22" y2="52" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2,2"/>
      <line x1="170" y1="20" x2="82" y2="52" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2,2"/>
      <line x1="170" y1="20" x2="142" y2="52" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="170" y1="20" x2="202" y2="52" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Leaf Switches (4) - Amber -->
      <g transform="translate(0, 114)">
        <rect x="0" y="0" width="44" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="22" y="13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Lf 1</text>

        <rect x="60" y="0" width="44" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="82" y="13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Lf 2</text>

        <rect x="120" y="0" width="44" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="142" y="13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Lf 3</text>

        <rect x="180" y="0" width="44" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="202" y="13.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Lf 4</text>
      </g>

      <!-- Spine to Leaf interconnects -->
      <line x1="22" y1="72" x2="22" y2="114" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="22" y1="72" x2="82" y2="114" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="82" y1="72" x2="22" y2="114" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="82" y1="72" x2="82" y2="114" stroke="#cbd5e1" stroke-width="1"/>

      <line x1="142" y1="72" x2="142" y2="114" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="142" y1="72" x2="202" y2="114" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="202" y1="72" x2="142" y2="114" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="202" y1="72" x2="202" y2="114" stroke="#cbd5e1" stroke-width="1"/>

      <!-- GPU Nodes / Racks (8 units) -->
      <g transform="translate(-8, 172)">
        <rect x="0" y="0" width="24" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="12" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">R1</text>
        <line x1="12" y1="0" x2="20" y2="-38" stroke="#0284c7" stroke-width="0.8"/>

        <rect x="30" y="0" width="24" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="42" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">R2</text>
        <line x1="42" y1="0" x2="38" y2="-38" stroke="#0284c7" stroke-width="0.8"/>

        <rect x="62" y="0" width="24" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="74" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">R3</text>
        <line x1="74" y1="0" x2="82" y2="-38" stroke="#0284c7" stroke-width="0.8"/>

        <rect x="92" y="0" width="24" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="104" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">R4</text>
        <line x1="104" y1="0" x2="98" y2="-38" stroke="#0284c7" stroke-width="0.8"/>

        <rect x="124" y="0" width="24" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="136" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">R5</text>
        <line x1="136" y1="0" x2="142" y2="-38" stroke="#0284c7" stroke-width="0.8"/>

        <rect x="154" y="0" width="24" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="166" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">R6</text>
        <line x1="166" y1="0" x2="158" y2="-38" stroke="#0284c7" stroke-width="0.8"/>

        <rect x="186" y="0" width="24" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="198" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">R7</text>
        <line x1="198" y1="0" x2="204" y2="-38" stroke="#0284c7" stroke-width="0.8"/>

        <rect x="216" y="0" width="24" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="228" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">R8</text>
        <line x1="228" y1="0" x2="220" y2="-38" stroke="#0284c7" stroke-width="0.8"/>
      </g>
    </g>

    <!-- Fat-Tree properties callout -->
    <g transform="translate(14, 280)">
      <rect width="286" height="88" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <rect x="8" y="8" width="130" height="16" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.6"/>
      <text x="73" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Full Bisection Bandwidth</text>
      <text x="10" y="40" font-size="8" fill="#334155">• Non-blocking: any-to-any without oversubscription</text>
      <text x="10" y="54" font-size="8" fill="#475569">• Multipath ECMP routing spreads elephant flows</text>
      <text x="10" y="68" font-size="8" fill="#64748b">• High optical transceiver count drives cluster CapEx</text>
      <text x="10" y="80" font-size="7.5" font-weight="600" fill="#15803d">Preferred for synchronous AllReduce collectives</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- RIGHT CARD: 2D TORUS (TPU POD DIRECT FABRIC)                          -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(348, 16)">
    <rect width="314" height="380" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 310,0 Q 314,0 314,4 L 314,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="314" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#334155">2D Torus (Direct Mesh Fabric)</text>
    <text x="300" y="18" text-anchor="end" font-size="8.5" fill="#64748b">Google TPU Pods</text>

    <!-- 4x4 Torus Grid (Nodes N00 to N33) -->
    <g transform="translate(42, 42)">
      <!-- Grid links horizontal & vertical -->
      <!-- Horizontal lines -->
      <line x1="16" y1="16" x2="214" y2="16" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="16" y1="68" x2="214" y2="68" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="16" y1="120" x2="214" y2="120" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="16" y1="172" x2="214" y2="172" stroke="#cbd5e1" stroke-width="1.2"/>

      <!-- Vertical lines -->
      <line x1="16" y1="16" x2="16" y2="172" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="82" y1="16" x2="82" y2="172" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="148" y1="16" x2="148" y2="172" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="214" y1="16" x2="214" y2="172" stroke="#cbd5e1" stroke-width="1.2"/>

      <!-- Wrap-around links (Torus edges) -->
      <path d="M 214,16 C 240,16 240,-12 115,-12 C -10,-12 -10,16 16,16" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,2"/>
      <path d="M 214,68 C 248,68 248,-24 115,-24 C -18,-24 -18,68 16,68" fill="none" stroke="#7c3aed" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
      <path d="M 16,176 C 16,204 -16,204 -16,94 C -16,-10 16,-10 16,4" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3,2"/>

      <rect x="90" y="-20" width="50" height="14" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="0.6"/>
      <text x="115" y="-10" text-anchor="middle" font-size="7" font-weight="700" fill="#6d28d9">Torus Wrap</text>

      <!-- 16 Nodes (4x4) -->
      <!-- Row 0 -->
      <rect x="0" y="4" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="16" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N00</text>

      <rect x="66" y="4" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="82" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N01</text>

      <rect x="132" y="4" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="148" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N02</text>

      <rect x="198" y="4" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="214" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N03</text>

      <!-- Row 1 -->
      <rect x="0" y="56" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="16" y="71" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N10</text>

      <rect x="66" y="56" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="82" y="71" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N11</text>

      <rect x="132" y="56" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="148" y="71" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N12</text>

      <rect x="198" y="56" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="214" y="71" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N13</text>

      <!-- Row 2 -->
      <rect x="0" y="108" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="16" y="123" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N20</text>

      <rect x="66" y="108" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="82" y="123" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N21</text>

      <rect x="132" y="108" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="148" y="123" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N22</text>

      <rect x="198" y="108" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="214" y="123" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N23</text>

      <!-- Row 3 -->
      <rect x="0" y="160" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="16" y="175" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N30</text>

      <rect x="66" y="160" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="82" y="175" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N31</text>

      <rect x="132" y="160" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="148" y="175" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N32</text>

      <rect x="198" y="160" width="32" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="214" y="175" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">N33</text>
    </g>

    <!-- Torus properties callout -->
    <g transform="translate(14, 280)">
      <rect width="286" height="88" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <rect x="8" y="8" width="146" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.6"/>
      <text x="81" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Bisection Bandwidth: O(√N)</text>
      <text x="10" y="40" font-size="8" fill="#334155">• Zero external switches: inter-node links wire directly</text>
      <text x="10" y="54" font-size="8" fill="#475569">• Bisection cut scales as O(N^(1-1/d)) with dimension d</text>
      <text x="10" y="68" font-size="8" fill="#64748b">• Demands tight workload locality (mesh coordinates)</text>
      <text x="10" y="80" font-size="7.5" font-weight="600" fill="#b45309">Optical Circuit Switches (OCS) reconfigure 3D topologies</text>
    </g>
  </g>

  <!-- Footnote -->
  <text x="340" y="418" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic">
    Fat-tree guarantees uniform non-blocking all-to-all bandwidth; Torus lowers switch CapEx but rewards workloads with strong topological locality.
  </text>
</svg>
