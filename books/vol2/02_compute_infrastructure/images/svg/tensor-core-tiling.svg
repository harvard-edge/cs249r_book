<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean canvas background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- COLUMN 1: LARGE WEIGHT MATRIX (HBM)                                   -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 16)">
    <rect width="320" height="380" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 316,0 Q 320,0 320,4 L 320,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="320" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#334155">Large Matrix (Off-Chip HBM3)</text>
    <text x="306" y="18" text-anchor="end" font-size="8.5" fill="#64748b">4096 × 4096 Elements</text>

    <!-- Matrix grid container -->
    <g transform="translate(20, 42)">
      <rect width="280" height="240" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Grid lines -->
      <line x1="0" y1="40" x2="280" y2="40" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="0" y1="80" x2="280" y2="80" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="0" y1="120" x2="280" y2="120" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="0" y1="160" x2="280" y2="160" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="0" y1="200" x2="280" y2="200" stroke="#f1f5f9" stroke-width="1"/>

      <line x1="46.6" y1="0" x2="46.6" y2="240" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="93.3" y1="0" x2="93.3" y2="240" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="140" y1="0" x2="140" y2="240" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="186.6" y1="0" x2="186.6" y2="240" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="233.3" y1="0" x2="233.3" y2="240" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Processed tiles (completed) -->
      <rect x="0" y="0" width="46.6" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <rect x="46.6" y="0" width="46.6" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <rect x="93.3" y="0" width="46.6" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <rect x="0" y="40" width="46.6" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <rect x="46.6" y="40" width="46.6" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>

      <!-- Active tile being loaded -->
      <rect x="93.3" y="80" width="46.6" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
      <text x="116.6" y="101" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">Active</text>
      <text x="116.6" y="112" text-anchor="middle" font-size="7.5" fill="#1F407A">Tile</text>

      <!-- Matrix dimensions -->
      <text x="140" y="-8" text-anchor="middle" font-size="8" fill="#64748b">4096 columns (K-dim)</text>
      <text x="-8" y="120" text-anchor="middle" font-size="8" fill="#64748b" transform="rotate(-90 -8 120)">4096 rows (M-dim)</text>
    </g>

    <!-- Subtitle info -->
    <g transform="translate(20, 296)">
      <rect width="280" height="66" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="14" y="20" font-size="9" font-weight="700" fill="#334155">Tiling Imperative:</text>
      <text x="14" y="36" font-size="8" fill="#64748b">• 4096² FP16 matrix is 32 MB (exceeds on-chip SRAM)</text>
      <text x="14" y="50" font-size="8" fill="#64748b">• Partitioned into 16×16 / 128×128 sub-blocks (tiles)</text>
    </g>
  </g>

  <!-- Load Arrow between Matrix and SRAM -->
  <g transform="translate(344, 180)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#1F407A" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="10" y="-8" text-anchor="middle" font-size="8" font-weight="700" fill="#14294E">Tile</text>
    <text x="10" y="14" text-anchor="middle" font-size="7.5" fill="#64748b">Load</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- COLUMN 2: ON-CHIP SRAM & TENSOR CORE                                  -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(368, 16)">
    <rect width="290" height="380" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 286,0 Q 290,0 290,4 L 290,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="290" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#14294E">On-Chip SRAM &amp; Tensor Core</text>
    <text x="276" y="18" text-anchor="end" font-size="8.5" fill="#64748b">SM Shared Mem</text>

    <!-- SRAM Area -->
    <g transform="translate(16, 38)">
      <rect width="258" height="116" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#334155">Shared Memory (SRAM) Buffer</text>
      <text x="246" y="18" text-anchor="end" font-size="8" fill="#15803d">10× faster than HBM</text>

      <!-- Tile A (Inputs) -->
      <g transform="translate(18, 30)">
        <rect width="104" height="70" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
        <text x="52" y="24" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">Tile A (Inputs)</text>
        <text x="52" y="40" text-anchor="middle" font-size="8" fill="#475569">16×16 Activations</text>
        <rect x="22" y="48" width="60" height="14" rx="2" fill="#D4E2F0"/>
        <text x="52" y="58" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">Reused N times</text>
      </g>

      <!-- Tile B (Weights) -->
      <g transform="translate(136, 30)">
        <rect width="104" height="70" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
        <text x="52" y="24" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">Tile B (Weights)</text>
        <text x="52" y="40" text-anchor="middle" font-size="8" fill="#475569">16×16 Parameters</text>
        <rect x="22" y="48" width="60" height="14" rx="2" fill="#D4E2F0"/>
        <text x="52" y="58" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">Reused M times</text>
      </g>
    </g>

    <!-- Tensor Core Processing Unit -->
    <g transform="translate(16, 170)">
      <rect width="258" height="104" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.5"/>
      <path d="M 0,3 Q 0,0 3,0 L 255,0 Q 258,0 258,3 L 258,22 L 0,22 Z" fill="#EAF1F8"/>
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#14294E">Tensor Core MMA Unit (Matrix Multiply-Accumulate)</text>
      <text x="129" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#1F407A">D = A × B + C</text>
      <text x="129" y="58" text-anchor="middle" font-size="8.5" fill="#475569">4,096 MAC ops per tile (16 × 16 × 16)</text>
      <text x="129" y="72" text-anchor="middle" font-size="8" fill="#64748b">FP16 / BF16 inputs → FP32 Accumulation</text>
      <rect x="49" y="80" width="160" height="16" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="129" y="91.5" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">High Arithmetic Intensity (&gt;150 FLOP/B)</text>
    </g>

    <!-- Accumulator Output -->
    <g transform="translate(16, 290)">
      <rect width="258" height="72" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#15803d">FP32 Register Accumulator</text>
      <text x="12" y="34" font-size="8" fill="#475569">Partial sums stay in fast RF until tile dot product finishes</text>
      <line x1="12" y1="46" x2="246" y2="46" stroke="#cbd5e1" stroke-dasharray="3,2"/>
      <text x="129" y="60" text-anchor="middle" font-size="8" fill="#64748b">Stream back to HBM only after full K-reduction</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- COLUMN 3: ENERGY HIERARCHY & 10x GAP                                  -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(680, 16)">
    <rect width="180" height="380" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 176,0 Q 180,0 180,4 L 180,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="180" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#334155">Energy Cost / Op</text>

    <!-- HBM Load Cost -->
    <g transform="translate(12, 38)">
      <rect width="156" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#b91c1c">HBM DRAM Read</text>
      <text x="10" y="34" font-size="11" font-weight="700" fill="#dc2626">2–5 pJ / bit</text>
      <text x="10" y="48" font-size="7.5" fill="#64748b">Off-chip capacitive traces</text>
    </g>

    <!-- SRAM Access Cost -->
    <g transform="translate(12, 102)">
      <rect width="156" height="56" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#b45309">SRAM Access</text>
      <text x="10" y="34" font-size="11" font-weight="700" fill="#d97706">0.1–0.5 pJ / bit</text>
      <text x="10" y="48" font-size="7.5" fill="#64748b">On-chip shared memory</text>
    </g>

    <!-- Register / MAC Cost -->
    <g transform="translate(12, 166)">
      <rect width="156" height="56" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#14294E">Tensor Core MAC</text>
      <text x="10" y="34" font-size="11" font-weight="700" fill="#1F407A">~1 pJ / MAC</text>
      <text x="10" y="48" font-size="7.5" fill="#64748b">Register-file arithmetic</text>
    </g>

    <!-- The 10x Energy Gap Callout -->
    <g transform="translate(12, 230)">
      <rect width="156" height="134" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <rect x="8" y="8" width="140" height="20" rx="2" fill="#dc2626"/>
      <text x="78" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">10–50× Energy Gap</text>
      <text x="10" y="46" font-size="8" font-weight="700" fill="#b91c1c">The Locality Invariant:</text>
      <text x="10" y="60" font-size="8" fill="#334155">Moving 1 bit from HBM</text>
      <text x="10" y="74" font-size="8" fill="#334155">burns more energy than</text>
      <text x="10" y="88" font-size="8" font-weight="700" fill="#14294E">running multiple MACs!</text>
      <text x="10" y="108" font-size="7.5" fill="#64748b">Tiling amortizes HBM reads</text>
      <text x="10" y="120" font-size="7.5" fill="#64748b">across thousands of reuse ops.</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM STRIP / FOOTNOTE                                               -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 412)">
    <rect width="840" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <g transform="translate(16, 12)">
      <text x="0" y="12" font-size="9.5" font-weight="700" fill="#14294E">Algorithmic Consequence:</text>
      <text x="0" y="28" font-size="8.5" fill="#475569">
        Matrix multiplication (C = A × B) without tiling is strictly memory-bandwidth bound (OI ≈ 0.25 FLOP/byte).
      </text>
      <text x="0" y="42" font-size="8.5" fill="#475569">
        With 2D block tiling in shared memory, each loaded element is reused O(TileSize) times, elevating operational intensity to &gt;150 FLOP/byte.
      </text>
      <text x="0" y="55" font-size="8" fill="#64748b" font-style="italic">
        This shifts the kernel from the memory-bound slope to the compute-bound plateau of the accelerator roofline.
      </text>
    </g>
  </g>
</svg>
