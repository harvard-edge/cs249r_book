<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/></marker>
  </defs>
  <rect width="684" height="342" fill="#ffffff"/>
  <g transform="translate(2,0)">
  <g transform="translate(0,0)">
  <!-- ===== HBM: full matrices, K slices along the shared dimension ===== -->
  <rect x="20" y="50" width="260" height="230" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <path d="M 24,50 L 276,50 Q 280,50 280,54 L 280,86 L 20,86 L 20,54 Q 20,50 24,50 Z" fill="#e2e8f0"/>
  <line x1="20" y1="86" x2="280" y2="86" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="150" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">HBM</text>
  <text x="150" y="80" text-anchor="middle" font-size="11" fill="#475569">full matrices, 3.35 TB/s</text>
  <rect x="140" y="98" width="120" height="45" rx="0" fill="#ffffff" stroke="#1F407A" stroke-width="1.0"/>
  <rect x="185" y="98" width="30" height="9" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.6"/>
  <rect x="185" y="107" width="30" height="9" rx="0" fill="#1F407A" stroke="#1F407A" stroke-width="0.6"/>
  <rect x="185" y="116" width="30" height="9" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.6"/>
  <rect x="185" y="125" width="30" height="9" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.6"/>
  <rect x="185" y="134" width="30" height="9" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.6"/>
  <rect x="50" y="152" width="80" height="100" rx="0" fill="#ffffff" stroke="#1F407A" stroke-width="1.0"/>
  <rect x="50" y="187" width="16" height="30" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.6"/>
  <rect x="66" y="187" width="16" height="30" rx="0" fill="#1F407A" stroke="#1F407A" stroke-width="0.6"/>
  <rect x="82" y="187" width="16" height="30" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.6"/>
  <rect x="98" y="187" width="16" height="30" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.6"/>
  <rect x="114" y="187" width="16" height="30" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.6"/>
  <rect x="140" y="152" width="120" height="100" rx="0" fill="#ffffff" stroke="#1F407A" stroke-width="1.0"/>
  <rect x="185" y="187" width="30" height="30" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
  <text x="128" y="125" text-anchor="end" font-size="12" font-weight="700" fill="#14294E">B</text>
  <text x="90" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">A</text>
  <text x="200" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">C</text>
  <text x="90" y="179" text-anchor="middle" font-size="11" fill="#475569">K slices</text>
  <!-- ===== Shared memory: the current slice pair ===== -->
  <rect x="320" y="50" width="150" height="230" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <path d="M 324,50 L 466,50 Q 470,50 470,54 L 470,86 L 320,86 L 320,54 Q 320,50 324,50 Z" fill="#e2e8f0"/>
  <line x1="320" y1="86" x2="470" y2="86" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="395" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Shared memory</text>
  <text x="395" y="80" text-anchor="middle" font-size="11" fill="#475569">228 KB per SM</text>
  <rect x="342" y="128" width="20" height="96" rx="0" fill="#1F407A"/>
  <text x="352" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">A tile</text>
  <text x="352" y="259" text-anchor="middle" font-size="11" fill="#475569">128×32</text>
  <rect x="370" y="102" width="88" height="20" rx="0" fill="#1F407A"/>
  <text x="414" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">B tile</text>
  <text x="414" y="157" text-anchor="middle" font-size="11" fill="#475569">32×128</text>
  <!-- ===== Tensor Cores and registers: the accumulating output tile ===== -->
  <rect x="510" y="50" width="150" height="230" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <path d="M 514,50 L 656,50 Q 660,50 660,54 L 660,86 L 510,86 L 510,54 Q 510,50 514,50 Z" fill="#e2e8f0"/>
  <line x1="510" y1="86" x2="660" y2="86" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="585" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Tensor Cores</text>
  <text x="585" y="80" text-anchor="middle" font-size="11" fill="#475569">and registers</text>
  <rect x="544" y="100" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="558" y="100" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="572" y="100" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="586" y="100" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="600" y="100" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="614" y="100" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="544" y="114" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="558" y="114" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="572" y="114" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="586" y="114" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="600" y="114" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="614" y="114" width="12" height="12" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <text x="585" y="146" text-anchor="middle" font-size="11" fill="#475569">MMA instructions</text>
  <rect x="545" y="162" width="80" height="80" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
  <text x="585" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">C tile</text>
  <text x="585" y="208" text-anchor="middle" font-size="11" fill="#14294E">128×128</text>
  <text x="585" y="223" text-anchor="middle" font-size="11" fill="#14294E">FP32 sums</text>
  <!-- ===== Forward flow ===== -->
  <line x1="280" y1="176" x2="318" y2="176" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="470" y1="176" x2="508" y2="176" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- ===== K loop: repeats once per slice ===== -->
  <path d="M 585,50 V 30 H 150 V 48" fill="none" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>
  <rect x="262" y="22" width="216" height="16" fill="#ffffff"/>
  <text x="370" y="34" text-anchor="middle" font-size="11" fill="#14294E">repeat per K slice: load the next pair</text>
  <!-- ===== Single write-back ===== -->
  <path d="M 585,280 V 300 H 200 V 282" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="392" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">after the last slice: write the C tile once</text>
  </g>
  </g>
</svg>
