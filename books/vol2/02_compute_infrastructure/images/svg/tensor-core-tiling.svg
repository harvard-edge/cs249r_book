<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-gray-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="arr-amber-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#d97706"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/></marker>
    <marker id="arr-blue-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#1F407A"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arr-red-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-green-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-violet-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arr-slate-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="560" height="270" fill="#ffffff"/>
  <!-- ===== Panel 1: matrices in HBM ===== -->
  <rect x="20" y="20" width="200" height="200" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <path d="M 24,20 L 216,20 Q 220,20 220,24 L 220,54 L 20,54 L 20,24 Q 20,20 24,20 Z" fill="#f1f5f9"/>
  <line x1="20" y1="54" x2="220" y2="54" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="120" y="35" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">HBM</text>
  <text x="120" y="48" text-anchor="middle" font-size="9.5" fill="#475569">full matrices, 3.35 TB/s</text>
  <rect x="96" y="66" width="104" height="36" rx="0" fill="#ffffff" stroke="#1F407A" stroke-width="1.0"/>
  <rect x="136" y="66" width="26" height="36" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="136" y="76" width="26" height="9" rx="0" fill="#1F407A" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="34" y="110" width="52" height="90" rx="0" fill="#ffffff" stroke="#1F407A" stroke-width="1.0"/>
  <rect x="34" y="142" width="52" height="26" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="44" y="142" width="9" height="26" rx="0" fill="#1F407A" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="96" y="110" width="104" height="90" rx="0" fill="#ffffff" stroke="#1F407A" stroke-width="1.0"/>
  <rect x="136" y="142" width="26" height="26" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
  <text x="208" y="88" text-anchor="start" font-size="11" font-weight="700" fill="#14294E">B</text>
  <text x="60" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">A</text>
  <text x="148" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">C</text>
  <!-- ===== Panel 2: shared memory ===== -->
  <rect x="250" y="20" width="130" height="200" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <path d="M 254,20 L 376,20 Q 380,20 380,24 L 380,54 L 250,54 L 250,24 Q 250,20 254,20 Z" fill="#f1f5f9"/>
  <line x1="250" y1="54" x2="380" y2="54" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="315" y="35" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Shared memory</text>
  <text x="315" y="48" text-anchor="middle" font-size="9.5" fill="#475569">228 KB per SM</text>
  <rect x="270" y="76" width="24" height="96" rx="0" fill="#1F407A" stroke="#1F407A" stroke-width="0.8"/>
  <text x="282" y="188" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">A tile</text>
  <text x="282" y="200" text-anchor="middle" font-size="9.5" fill="#475569">128×32</text>
  <rect x="304" y="76" width="64" height="16" rx="0" fill="#1F407A" stroke="#1F407A" stroke-width="0.8"/>
  <text x="336" y="108" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">B tile</text>
  <text x="336" y="120" text-anchor="middle" font-size="9.5" fill="#475569">32×128</text>
  <!-- ===== Panel 3: tensor cores and registers ===== -->
  <rect x="410" y="20" width="130" height="200" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <path d="M 414,20 L 536,20 Q 540,20 540,24 L 540,54 L 410,54 L 410,24 Q 410,20 414,20 Z" fill="#f1f5f9"/>
  <line x1="410" y1="54" x2="540" y2="54" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="475" y="35" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Tensor Cores</text>
  <text x="475" y="48" text-anchor="middle" font-size="9.5" fill="#475569">and registers</text>
  <rect x="439" y="68" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="451" y="68" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="463" y="68" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="475" y="68" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="487" y="68" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="499" y="68" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="439" y="80" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="451" y="80" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="463" y="80" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="475" y="80" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="487" y="80" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <rect x="499" y="80" width="10" height="10" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
  <text x="475" y="104" text-anchor="middle" font-size="9.5" fill="#475569">MMA instructions</text>
  <rect x="428" y="118" width="94" height="58" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
  <text x="475" y="142" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">C tile 128×128</text>
  <text x="475" y="156" text-anchor="middle" font-size="9.5" fill="#14294E">FP32 partial sums</text>
  <text x="475" y="200" text-anchor="middle" font-size="9.5" fill="#475569">stays on chip</text>
  <!-- ===== Flow arrows ===== -->
  <line x1="220" y1="124" x2="250" y2="124" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="380" y1="124" x2="410" y2="124" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 475,220 L 475,244 L 149,244 L 149,224" fill="none" stroke="#1F407A" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <text x="312" y="260" text-anchor="middle" font-size="9.5" fill="#14294E">Write the C tile back once, after every K slice has been accumulated</text>
</svg>
