<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430">
  <defs>
    <marker id="road-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean canvas background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- 4 INFRASTRUCTURE WALLS (SCALING CONSTRAINTS)                          -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->

  <!-- Wall 1: Power Wall (Amber) -->
  <g transform="translate(20, 20)">
    <rect width="144" height="216" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 140,0 Q 144,0 144,4 L 144,28 L 0,28 Z" fill="#fef3c7"/>
    <line x1="0" y1="28" x2="144" y2="28" stroke="#d97706" stroke-width="1"/>
    <text x="72" y="19" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">1. Power Wall</text>

    <text x="72" y="48" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Datacenter Delivery</text>
    <text x="72" y="60" text-anchor="middle" font-size="8" fill="#64748b">Thermal &amp; MW limits</text>

    <line x1="14" y1="72" x2="130" y2="72" stroke="#e2e8f0"/>

    <rect x="14" y="82" width="116" height="36" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
    <text x="72" y="97" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">~40–100 MW</text>
    <text x="72" y="109" text-anchor="middle" font-size="7.5" fill="#b45309">PUE 1.15 · 100 kW/rack</text>

    <line x1="14" y1="130" x2="130" y2="130" stroke="#e2e8f0"/>

    <text x="72" y="148" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Mitigation:</text>
    <text x="72" y="164" text-anchor="middle" font-size="7.5" fill="#64748b">Direct liquid cooling</text>
    <text x="72" y="178" text-anchor="middle" font-size="7.5" fill="#64748b">48V busbar distribution</text>
    <text x="72" y="192" text-anchor="middle" font-size="7.5" fill="#64748b">Workload power capping</text>
  </g>

  <!-- Wall 2: Memory Wall (Compute Blue) -->
  <g transform="translate(182, 20)">
    <rect width="144" height="216" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 140,0 Q 144,0 144,4 L 144,28 L 0,28 Z" fill="#e0f2fe"/>
    <line x1="0" y1="28" x2="144" y2="28" stroke="#0284c7" stroke-width="1"/>
    <text x="72" y="19" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1">2. Memory Wall</text>

    <text x="72" y="48" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Bandwidth &amp; Capacity</text>
    <text x="72" y="60" text-anchor="middle" font-size="8" fill="#64748b">DRAM vs compute gap</text>

    <line x1="14" y1="72" x2="130" y2="72" stroke="#e2e8f0"/>

    <rect x="14" y="82" width="116" height="36" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="72" y="97" text-anchor="middle" font-size="9" font-weight="700" fill="#0369a1">3.35 TB/s vs 2 PFLOP</text>
    <text x="72" y="109" text-anchor="middle" font-size="7.5" fill="#0284c7">80–141 GB HBM capacity</text>

    <line x1="14" y1="130" x2="130" y2="130" stroke="#e2e8f0"/>

    <text x="72" y="148" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Mitigation:</text>
    <text x="72" y="164" text-anchor="middle" font-size="7.5" fill="#64748b">HBM3 3D-stacking</text>
    <text x="72" y="178" text-anchor="middle" font-size="7.5" fill="#64748b">2D block tiling in SRAM</text>
    <text x="72" y="192" text-anchor="middle" font-size="7.5" fill="#64748b">ZeRO-3 weight sharding</text>
  </g>

  <!-- Wall 3: Communication Wall (Coordination Purple) -->
  <g transform="translate(344, 20)">
    <rect width="144" height="216" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 140,0 Q 144,0 144,4 L 144,28 L 0,28 Z" fill="#f3e8ff"/>
    <line x1="0" y1="28" x2="144" y2="28" stroke="#7c3aed" stroke-width="1"/>
    <text x="72" y="19" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">3. Comm. Wall</text>

    <text x="72" y="48" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Bisection Fabric</text>
    <text x="72" y="60" text-anchor="middle" font-size="8" fill="#64748b">Cluster networking limit</text>

    <line x1="14" y1="72" x2="130" y2="72" stroke="#e2e8f0"/>

    <rect x="14" y="82" width="116" height="36" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="72" y="97" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">400–800 Gb/s</text>
    <text x="72" y="109" text-anchor="middle" font-size="7.5" fill="#7c3aed">AllReduce barrier latency</text>

    <line x1="14" y1="130" x2="130" y2="130" stroke="#e2e8f0"/>

    <text x="72" y="148" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Mitigation:</text>
    <text x="72" y="164" text-anchor="middle" font-size="7.5" fill="#64748b">Fat-tree rail optimization</text>
    <text x="72" y="178" text-anchor="middle" font-size="7.5" fill="#64748b">Overlap comm &amp; compute</text>
    <text x="72" y="192" text-anchor="middle" font-size="7.5" fill="#64748b">Hierarchical ring reduction</text>
  </g>

  <!-- Wall 4: Reliability Wall (Faults Red) -->
  <g transform="translate(506, 20)">
    <rect width="154" height="216" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 150,0 Q 154,0 154,4 L 154,28 L 0,28 Z" fill="#fee2e2"/>
    <line x1="0" y1="28" x2="154" y2="28" stroke="#dc2626" stroke-width="1"/>
    <text x="77" y="19" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">4. Reliability Wall</text>

    <text x="77" y="48" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">MTBF Scale Collapse</text>
    <text x="77" y="60" text-anchor="middle" font-size="8" fill="#64748b">Fleet availability limit</text>

    <line x1="14" y1="72" x2="140" y2="72" stroke="#e2e8f0"/>

    <rect x="14" y="82" width="126" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="77" y="97" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">MTBF &lt; 2–5 Hours</text>
    <text x="77" y="109" text-anchor="middle" font-size="7.5" fill="#dc2626">At 10K–25K GPU scale</text>

    <line x1="14" y1="130" x2="140" y2="130" stroke="#e2e8f0"/>

    <text x="77" y="148" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Mitigation:</text>
    <text x="77" y="164" text-anchor="middle" font-size="7.5" fill="#64748b">Async multi-tier ckpt</text>
    <text x="77" y="178" text-anchor="middle" font-size="7.5" fill="#64748b">N+1 hot standby spare</text>
    <text x="77" y="192" text-anchor="middle" font-size="7.5" fill="#64748b">Elastic training restart</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- TIMELINE ROADWAY (SCALING JOURNEY)                                    -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 252)">
    <rect width="640" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="10" x2="625" y2="10" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6,4"/>
    <line x1="625" y1="10" x2="636" y2="10" stroke="#64748b" stroke-width="1.5" marker-end="url(#road-arr)"/>
    <text x="320" y="13.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1">SCALING JOURNEY</text>
  </g>

  <!-- Scale Levels corresponding to walls -->
  <g transform="translate(20, 285)">
    <g transform="translate(72, 0)">
      <rect x="-42" y="0" width="84" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="0" y="13.5" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Facility Level</text>
      <line x1="0" y1="-13" x2="0" y2="0" stroke="#d97706" stroke-width="1.2"/>
    </g>

    <g transform="translate(234, 0)">
      <rect x="-42" y="0" width="84" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
      <text x="0" y="13.5" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">Device / SM Level</text>
      <line x1="0" y1="-13" x2="0" y2="0" stroke="#0284c7" stroke-width="1.2"/>
    </g>

    <g transform="translate(396, 0)">
      <rect x="-42" y="0" width="84" height="20" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="0" y="13.5" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Cluster Level</text>
      <line x1="0" y1="-13" x2="0" y2="0" stroke="#7c3aed" stroke-width="1.2"/>
    </g>

    <g transform="translate(563, 0)">
      <rect x="-42" y="0" width="84" height="20" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="0" y="13.5" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Fleet Scale</text>
      <line x1="0" y1="-13" x2="0" y2="0" stroke="#dc2626" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Scale Tick Markers -->
  <g transform="translate(20, 324)" font-size="8" fill="#64748b">
    <line x1="20" y1="0" x2="620" y2="0" stroke="#cbd5e1" stroke-width="1"/>
    
    <circle cx="72" cy="0" r="3" fill="#64748b"/>
    <text x="72" y="14" text-anchor="middle">Facility (100 MW)</text>

    <circle cx="234" cy="0" r="3" fill="#64748b"/>
    <text x="234" y="14" text-anchor="middle">1–8 GPUs (Node)</text>

    <circle cx="396" cy="0" r="3" fill="#64748b"/>
    <text x="396" y="14" text-anchor="middle">1,024 GPUs (Pod)</text>

    <circle cx="563" cy="0" r="3" fill="#64748b"/>
    <text x="563" y="14" text-anchor="middle">10K–25K+ GPUs</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM TAKEAWAY BANNER                                                -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 360)">
    <rect width="640" height="52" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="320" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">
      The Hierarchical Invariant: Each wall creates the dominant design constraint at its operational scale.
    </text>
    <text x="320" y="38" text-anchor="middle" font-size="8" fill="#64748b">
      SRAM tiling mitigates the memory wall, fat-tree fabric bypasses the comm wall, and hot-spare elasticity overcomes the reliability wall.
    </text>
  </g>
</svg>
