<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-gray-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="arr-amber-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#d97706"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/></marker>
    <marker id="arr-blue-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#1F407A"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arr-red-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-green-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-violet-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arr-slate-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="550" height="202" fill="#ffffff"/>
  <!-- ===== Scale axis ===== -->
  <line x1="20" y1="22" x2="528" y2="22" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="20" y="14" text-anchor="start" font-size="9.5" fill="#475569">Smaller physical scale</text>
  <text x="530" y="14" text-anchor="end" font-size="9.5" fill="#475569">Larger physical scale</text>
  <!-- ===== Node: Memory wall ===== -->
  <rect x="20" y="34" width="120" height="38" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
  <text x="80" y="50" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Node</text>
  <text x="80" y="64" text-anchor="middle" font-size="9.5" fill="#475569">8 GPUs</text>
  <line x1="80" y1="72" x2="80" y2="88" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="20" y="90" width="120" height="96" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="80" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14294E">Memory wall</text>
  <line x1="32" y1="120" x2="128" y2="120" stroke="#1F407A" stroke-width="0.6" opacity="0.5"/>
  <text x="80" y="142" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">3.35 TB/s of HBM</text>
  <text x="80" y="158" text-anchor="middle" font-size="9.5" fill="#334155">feeds ~2,000 TFLOP/s</text>
  <text x="80" y="174" text-anchor="middle" font-size="9.5" fill="#334155">of FP8 arithmetic</text>
  <!-- ===== Rack: Power wall ===== -->
  <rect x="150" y="34" width="120" height="38" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
  <text x="210" y="50" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Rack</text>
  <text x="210" y="64" text-anchor="middle" font-size="9.5" fill="#475569">32 GPUs</text>
  <line x1="210" y1="72" x2="210" y2="88" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="150" y="90" width="120" height="96" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="210" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Power wall</text>
  <line x1="162" y1="120" x2="258" y2="120" stroke="#94a3b8" stroke-width="0.6" opacity="0.5"/>
  <text x="210" y="142" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">33.5 kW per rack,</text>
  <text x="210" y="158" text-anchor="middle" font-size="9.5" fill="#334155">nearly 3× a 12 kW</text>
  <text x="210" y="174" text-anchor="middle" font-size="9.5" fill="#334155">traditional rack</text>
  <!-- ===== Pod: Communication wall ===== -->
  <rect x="280" y="34" width="120" height="38" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
  <text x="340" y="50" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Pod</text>
  <text x="340" y="64" text-anchor="middle" font-size="9.5" fill="#475569">1,024 GPUs</text>
  <line x1="340" y1="72" x2="340" y2="88" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="280" y="90" width="120" height="96" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="340" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Communication wall</text>
  <line x1="292" y1="120" x2="388" y2="120" stroke="#d97706" stroke-width="0.6" opacity="0.5"/>
  <text x="340" y="142" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">450 GB/s NVLink</text>
  <text x="340" y="158" text-anchor="middle" font-size="9.5" fill="#334155">drops to 50 GB/s</text>
  <text x="340" y="174" text-anchor="middle" font-size="9.5" fill="#334155">InfiniBand: a 9× cliff</text>
  <!-- ===== Fleet: Reliability wall ===== -->
  <rect x="410" y="34" width="120" height="38" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
  <text x="470" y="50" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Fleet</text>
  <text x="470" y="64" text-anchor="middle" font-size="9.5" fill="#475569">10K–25K GPUs</text>
  <line x1="470" y1="72" x2="470" y2="88" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="410" y="90" width="120" height="96" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="470" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">Reliability wall</text>
  <line x1="422" y1="120" x2="518" y2="120" stroke="#dc2626" stroke-width="0.6" opacity="0.5"/>
  <text x="470" y="142" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">MTBF ≈ 2 hours</text>
  <text x="470" y="158" text-anchor="middle" font-size="9.5" fill="#334155">at 25K GPUs, from</text>
  <text x="470" y="174" text-anchor="middle" font-size="9.5" fill="#334155">50,000 hours per GPU</text>
</svg>
