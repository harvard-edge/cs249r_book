<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 681 378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="681" height="378" fill="#ffffff"/>
  <g transform="translate(3,0)">
  <g transform="translate(0,14)">

  <!-- ===== Scale axis ===== -->
  <text x="20" y="16" text-anchor="start" font-size="11" fill="#475569">Smaller physical scale</text>
  <text x="655" y="16" text-anchor="end" font-size="11" fill="#475569">Larger physical scale</text>
  <line x1="20" y1="26" x2="653" y2="26" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Scale glyphs: each level drawn as its actual parts ===== -->
  <!-- Node: one chassis, 8 GPUs -->
  <rect x="50" y="50" width="80" height="44" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <g fill="#EAF1F8" stroke="#1F407A" stroke-width="1.0">
    <rect x="56" y="56" width="14" height="14" rx="1"/>
    <rect x="74" y="56" width="14" height="14" rx="1"/>
    <rect x="92" y="56" width="14" height="14" rx="1"/>
    <rect x="110" y="56" width="14" height="14" rx="1"/>
    <rect x="56" y="74" width="14" height="14" rx="1"/>
    <rect x="74" y="74" width="14" height="14" rx="1"/>
    <rect x="92" y="74" width="14" height="14" rx="1"/>
    <rect x="110" y="74" width="14" height="14" rx="1"/>
  </g>
  <!-- Rack: four nodes -->
  <rect x="227" y="42" width="56" height="63" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <g fill="#EAF1F8" stroke="#1F407A" stroke-width="1.0">
    <rect x="232" y="47" width="46" height="11" rx="1"/>
    <rect x="232" y="61" width="46" height="11" rx="1"/>
    <rect x="232" y="75" width="46" height="11" rx="1"/>
    <rect x="232" y="89" width="46" height="11" rx="1"/>
  </g>
  <!-- Pod: 32 racks -->
  <g fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8">
    <rect x="374" y="44" width="9" height="12"/><rect x="386" y="44" width="9" height="12"/><rect x="398" y="44" width="9" height="12"/><rect x="410" y="44" width="9" height="12"/><rect x="422" y="44" width="9" height="12"/><rect x="434" y="44" width="9" height="12"/><rect x="446" y="44" width="9" height="12"/><rect x="458" y="44" width="9" height="12"/>
    <rect x="374" y="59" width="9" height="12"/><rect x="386" y="59" width="9" height="12"/><rect x="398" y="59" width="9" height="12"/><rect x="410" y="59" width="9" height="12"/><rect x="422" y="59" width="9" height="12"/><rect x="434" y="59" width="9" height="12"/><rect x="446" y="59" width="9" height="12"/><rect x="458" y="59" width="9" height="12"/>
    <rect x="374" y="74" width="9" height="12"/><rect x="386" y="74" width="9" height="12"/><rect x="398" y="74" width="9" height="12"/><rect x="410" y="74" width="9" height="12"/><rect x="422" y="74" width="9" height="12"/><rect x="434" y="74" width="9" height="12"/><rect x="446" y="74" width="9" height="12"/><rect x="458" y="74" width="9" height="12"/>
    <rect x="374" y="89" width="9" height="12"/><rect x="386" y="89" width="9" height="12"/><rect x="398" y="89" width="9" height="12"/><rect x="410" y="89" width="9" height="12"/><rect x="422" y="89" width="9" height="12"/><rect x="434" y="89" width="9" height="12"/><rect x="446" y="89" width="9" height="12"/><rect x="458" y="89" width="9" height="12"/>
  </g>
  <!-- Fleet: many pods -->
  <g fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8">
    <rect x="522" y="46" width="22" height="22"/><rect x="548" y="46" width="22" height="22"/><rect x="574" y="46" width="22" height="22"/><rect x="600" y="46" width="22" height="22"/><rect x="626" y="46" width="22" height="22"/>
    <rect x="522" y="72" width="22" height="22"/><rect x="548" y="72" width="22" height="22"/><rect x="574" y="72" width="22" height="22"/><rect x="600" y="72" width="22" height="22"/><rect x="626" y="72" width="22" height="22"/>
  </g>

  <!-- Scale labels -->
  <text x="90" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Node</text>
  <text x="90" y="135" text-anchor="middle" font-size="11" fill="#475569">8 GPUs</text>
  <text x="255" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Rack</text>
  <text x="255" y="135" text-anchor="middle" font-size="11" fill="#475569">32 GPUs</text>
  <text x="420" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Pod</text>
  <text x="420" y="135" text-anchor="middle" font-size="11" fill="#475569">1,024 GPUs</text>
  <text x="585" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Fleet</text>
  <text x="585" y="135" text-anchor="middle" font-size="11" fill="#475569">10K–25K GPUs</text>

  <g stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)">
    <line x1="90" y1="142" x2="90" y2="162"/>
    <line x1="255" y1="142" x2="255" y2="162"/>
    <line x1="420" y1="142" x2="420" y2="162"/>
    <line x1="585" y1="142" x2="585" y2="162"/>
  </g>

  <!-- ===== Memory wall: a wide arithmetic block fed through a narrow HBM pipe ===== -->
  <rect x="20" y="164" width="140" height="178" rx="3" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2"/>
  <text x="90" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Memory wall</text>
  <line x1="32" y1="193" x2="148" y2="193" stroke="#1F407A" stroke-width="0.6" opacity="0.5"/>
  <rect x="34" y="214" width="28" height="64" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="48" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E" transform="rotate(-90 48 246)" dy="4">HBM</text>
  <rect x="62" y="244" width="26" height="4" fill="#1F407A"/>
  <rect x="88" y="216" width="60" height="60" rx="0" fill="#1F407A"/>
  <text x="118" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">FP8</text>
  <text x="118" y="259" text-anchor="middle" font-size="11" fill="#ffffff">math</text>
  <text x="90" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">3.35 TB/s HBM</text>
  <text x="90" y="328" text-anchor="middle" font-size="11" fill="#334155">feeds ~2,000 TFLOP/s</text>

  <!-- ===== Power wall: rack draw against a traditional rack budget, to scale ===== -->
  <rect x="185" y="164" width="140" height="178" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="255" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Power wall</text>
  <line x1="197" y1="193" x2="313" y2="193" stroke="#64748b" stroke-width="0.6" opacity="0.5"/>
  <rect x="205" y="255" width="30" height="23" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.0"/>
  <rect x="275" y="214" width="30" height="64" fill="#475569" stroke="#334155" stroke-width="1.0"/>
  <line x1="197" y1="255" x2="313" y2="255" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="255" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">12 kW</text>
  <line x1="197" y1="278" x2="313" y2="278" stroke="#94a3b8" stroke-width="1.0"/>
  <text x="220" y="292" text-anchor="middle" font-size="11" fill="#475569">traditional</text>
  <text x="290" y="292" text-anchor="middle" font-size="11" fill="#475569">DGX H100</text>
  <text x="255" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">33.5 kW per rack</text>
  <text x="255" y="328" text-anchor="middle" font-size="11" fill="#334155">nearly 3× a 12 kW rack</text>

  <!-- ===== Communication wall: link widths drawn to scale (9:1) ===== -->
  <rect x="350" y="164" width="140" height="178" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="420" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Communication wall</text>
  <line x1="362" y1="193" x2="478" y2="193" stroke="#d97706" stroke-width="0.6" opacity="0.5"/>
  <rect x="370" y="210" width="100" height="36" rx="0" fill="#d97706"/>
  <text x="420" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">NVLink</text>
  <rect x="370" y="262" width="100" height="4" rx="0" fill="#d97706"/>
  <text x="420" y="284" text-anchor="middle" font-size="11" fill="#b45309">InfiniBand</text>
  <text x="420" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">450 → 50 GB/s</text>
  <text x="420" y="328" text-anchor="middle" font-size="11" fill="#334155">a 9× cliff</text>

  <!-- ===== Reliability wall: time between failures on a log axis ===== -->
  <rect x="515" y="164" width="140" height="178" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="585" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Reliability wall</text>
  <line x1="527" y1="193" x2="643" y2="193" stroke="#dc2626" stroke-width="0.6" opacity="0.5"/>
  <text x="530" y="210" text-anchor="start" font-size="11" fill="#334155">1 GPU</text>
  <rect x="530" y="216" width="103" height="12" fill="#94a3b8"/>
  <text x="530" y="246" text-anchor="start" font-size="11" fill="#b91c1c">25K GPUs</text>
  <rect x="530" y="252" width="7" height="12" fill="#dc2626"/>
  <line x1="530" y1="272" x2="640" y2="272" stroke="#94a3b8" stroke-width="1.0"/>
  <g stroke="#94a3b8" stroke-width="1.0">
    <line x1="530" y1="272" x2="530" y2="276"/><line x1="574" y1="272" x2="574" y2="276"/><line x1="618" y1="272" x2="618" y2="276"/>
  </g>
  <text x="530" y="289" text-anchor="middle" font-size="11" fill="#64748b">1 h</text>
  <text x="574" y="289" text-anchor="middle" font-size="11" fill="#64748b">10² h</text>
  <text x="618" y="289" text-anchor="middle" font-size="11" fill="#64748b">10⁴ h</text>
  <text x="585" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">MTTF ≈ 2 h at 25K</text>
  <text x="585" y="328" text-anchor="middle" font-size="11" fill="#334155">from 50,000 h per GPU</text>
  </g>
  </g>
</svg>
