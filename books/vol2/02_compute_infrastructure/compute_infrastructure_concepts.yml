    relationships:
    - id: vol2.field.01
      source: vol2.fleet.scaling-laws
      predicate: drive demand for
      target: vol2.hardware.memory-capacity
      explanation: Scaling model parameters increases the memory required before a training run can begin.
      conditions: Within the fitted scaling regime and specified model precision.
      status: draft
      evidence:
        section: sec-compute-infrastructure-infrastructure-walls-4f2c
        quote: 'The scaling laws of @sec-vol2-intro-ai-scaling-laws-a043 are why demand outruns any single
          device. Loss falls predictably as parameters, training tokens, and compute grow together, so each
          step up in capability multiplies both the memory a model occupies and the arithmetic its training
          consumes; a GPT-3-class model already needs several accelerators merely to store its FP16 weights.
          A model that exceeds one accelerator''s memory capacity forces a hardware decision before training
          begins. Adding accelerators supplies capacity, but also creates transfers between devices, increases
          power demand, and couples progress to more components that can fail. The familiar single-node
          compute and memory limits therefore become inputs to fleet design. Four recurring physical constraints
          appear at escalating physical scales, from an eight-GPU node to a 25K-accelerator fleet (@fig-three-walls-grid).
          Memory bandwidth, rack power, pod communication, and fleet failure exposure provide the examples;
          the workload and configuration determine which constraint binds at each scale. These are the memory,
          energy, and network walls of the scale moment and the fleet''s reliability gap, seen from the
          hardware that imposes them. Because this chapter studies the hardware, it names each constraint
          by the physical resource that runs out. It uses these four names from here on: the memory wall,
          the power wall (the energy wall as power delivery and heat removal), the communication wall (the
          network wall as link bandwidth), and the reliability wall (the reliability gap as a failure interval).'
    - id: vol2.field.04
      source: vol2.hardware.bandwidth-hierarchy
      predicate: constrains
      target: vol2.training.tensor-parallelism
      explanation: Frequent tensor-parallel exchanges belong in the fast interconnect domain.
      conditions: Placement must reflect the actual traffic pattern and measured link capacity.
      status: draft
      evidence:
        section: sec-compute-bandwidth-hierarchy
        quote: '**Systems insight**: For the same payload, the example inter-node path has a transfer-time
          lower bound `{python} BandwidthStaircase.bs_gap_nv_ib_mult_str` larger than the example intra-node
          path. Size alone does not decide which traffic may cross that cliff; frequency and overlap do.
          Tensor parallelism\index{Tensor parallelism!intra-node} exchanges activations inside every layer,
          on the critical path, so it favors the fast local NVLink domain in this configuration. Data parallelism\index{Data
          parallelism!inter-node} moves the largest buffer, the full gradient, but only once per step and
          overlapped with the backward pass, so it can cross the scarce InfiniBand tier. A partition that
          fits in memory can still spend much of a step waiting if its exposed exchanges exceed the communication
          budget.'
    - id: vol2.field.05
      source: vol2.hardware.power-envelope
      predicate: bounds feasible
      target: vol2.scheduling.placement
      explanation: A placement must fit the power and heat-removal capacity of its physical domain.
      conditions: Power and cooling are feasibility constraints, not merely average energy costs.
      status: draft
      evidence:
        section: sec-compute-power-wall
        quote: Every floating-point operation dissipates energy as heat. Dense Tensor Core activity during
          large matrix multiplications drives heat proportional to the switching activity of billions of
          transistors. Fleet design must pair each accelerator's sustained power envelope with any documented
          transient excursion requirement. At dense fleet scale, this produces the power wall\index{Power
          wall!facility constraint}, the point at which facility power delivery and heat removal, rather
          than available arithmetic units, determine how much compute can be installed and sustained.
