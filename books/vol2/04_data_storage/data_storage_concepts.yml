    relationships:
    - id: vol2.field.09
      source: vol2.storage.prefetch
      predicate: hides latency in
      target: vol2.storage.input-pipeline
      explanation: Preparing batches ahead can overlap input work with accelerator execution.
      conditions: Buffers must fit and long-run producer service rate must meet consumer demand.
      status: draft
      evidence:
        section: sec-storage-pipelining
        quote: 'Pipelining converts a sequential bottleneck into overlapped execution (@fig-data-pipeline-vol2),
          but continuous saturation requires a prefetch buffer deep enough to absorb variance in I/O latency.
          Stage durations need not be deterministic if ready batches cover the delays. Storage systems experience
          I/O jitter\index{I/O jitter!sources and pipeline impact}: variation in read latency caused by
          contention and background work. NVMe drives suffer occasional latency spikes during internal garbage
          collection (when the controller reorganizes NAND flash blocks) or wear-leveling operations. Parallel
          file systems incur spikes when multiple training jobs contend for the same OSS nodes, when the
          MDS processes a burst of metadata operations, or when background scrubbing detects and repairs
          bit errors. Object storage likewise exposes delays from shared-service contention and maintenance.'
    - id: vol2.field.10
      source: vol2.storage.input-pipeline
      predicate: can lengthen
      target: vol2.fleet.step-time
      explanation: Late input delivery leaves accelerators idle and delays useful progress.
      conditions: Input stalls matter only when input service lies on the execution critical path.
      status: draft
      evidence:
        section: sec-storage-pipeline-equation
        quote: '**Systems insight**: Even with pipelining, the accelerator is idle `{python} PipelineCalcs.data_stall_pct_str`
          of the time. To eliminate the stall entirely, the next batch must arrive within the `{python}
          PipelineCalcs.t_comp_stall_str` compute window, either by increasing effective storage bandwidth
          or by adding parallel I/O streams. Deeper prefetch buffers cannot help here, because the delivery
          time exceeds the compute window on every step rather than merely in the tail.'
    - id: vol2.field.11
      source: vol2.storage.durable-checkpoint
      predicate: provides restore state for
      target: vol2.reliability.recovery
      explanation: A saved state protects progress only when its committed copy survives the relevant failure.
      conditions: The checkpoint must be complete, discoverable, and outside the failed domain.
      status: draft
      evidence:
        section: sec-storage-checkpointing
        quote: Asynchronous checkpointing shrinks even that local-flash pause by staging the snapshot in
          host DRAM first. Nodes coordinate the training step to capture, copy each accelerator-resident
          shard into a dedicated pinned host-memory buffer, and resume training immediately while a background
          thread writes the buffer to local NVMe. The snapshot buffer must remain immutable until the background
          write finishes; separate live-state buffers allow training to advance without changing the captured
          generation. If a node fails during the asynchronous write, its local shard may be incomplete.
          The job must wait for the required writes or peer replication before declaring this generation
          durable, even if training has already resumed.
    maps: []
