  claims:
    I/O wall: Full-corpus training inverts database assumptions (large sequential shard reads, working sets larger
      than any cache, synchronized burst writes), so storage is provisioned for streaming bandwidth and burst absorption,
      and faster compute against a fixed input path plateaus at the delivery rate.
    Scoped storage hierarchy: The six storage tiers trade bandwidth for capacity and cost but quote bandwidth at
      different scopes, so a tier ratio is not a feed requirement, and as a cache E[T] = h*T_hot + (1-h)*T_miss
      means a 95 percent hit rate with a 100x slower miss path delivers about one-sixth of the all-hot rate.
    Input delivery budget: Required input bandwidth is the number of distinct consumers times target compute fraction
      times batch bytes over compute time, every stage of the chain must sustain it because delivered rate is the
      minimum over stages, and prefetch absorbs variance but never a sustained deficit.
    Metadata-bound shard packaging: A parallel file system separates a metadata path of a few hundred thousand operations
      per second from a striped data path, so millions of small files collapse delivery to the metadata rate, and
      packaging samples into large shards amortizes opens across thousands of samples.
    Checkpoint write path: A resumable mixed-precision Adam checkpoint is about 14 bytes per parameter, so a coordinated
      save must write each unique byte once, and tiered staging confines the exposed pause to the local write while
      the shared-tier copy drains in the background.
    Total cost of data delivery: Storage cost is capacity plus transfer, request, retrieval, and idle-accelerator
      cost, and because egress scales with bytes read, tiering is a placement policy chosen from access pattern,
      read count, and latency need rather than dollars per GB-month.
    Versioned artifacts and commit boundaries: A fleet data pipeline is a DAG of immutable, content-identified artifacts
      that lets a run replay the exact batch behind a loss spike, and correctness under worker failure is decided
      at the output commit boundary by replayable inputs and idempotent writes.
    Data stall ratio: The data stall ratio measures exposed input wait per step, and it diagnoses the input path
      only when it is separated from communication and barrier time.
    Checkpoint storm: When every writer saves at once, synchronized checkpoint bursts saturate the shared storage
      tier, so save time grows with writer count unless flushes are staggered, rate-limited, or staged locally.
    Hedged reads against storage tail latency: Sharded reads fan out across many servers so the slowest server sets
      the step's input latency, and hedged or tied requests trade a small amount of extra load for a much shorter
      tail.
