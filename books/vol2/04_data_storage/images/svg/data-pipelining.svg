<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Sequential vs. pipelined data loading on one time scale (illustrative durations).
       Storage green, CPU slate, GPU compute blue, GPU idle red (wasted accelerator time).
       Shaded column in (b): one instant with three batches in flight. Dashed line: end of (a), stopped above the (b) GPU lane; short tick marks where it lands on the (b) time axis. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="680" height="472" fill="#ffffff"/>
  <rect x="376" y="264" width="66" height="140" rx="0" fill="#f1f5f9" stroke="none"/>
  <text x="409.0" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">3 in flight</text>
  <line x1="596" y1="187" x2="596" y2="362" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="596" y1="410" x2="596" y2="422" stroke="#475569" stroke-width="1.5"/>
  <text x="20" y="24" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">(a) Sequential loading</text>
  <text x="100" y="59.5" text-anchor="end" font-size="12.5" font-weight="700" fill="#334155">Storage</text>
  <text x="100" y="101.5" text-anchor="end" font-size="12.5" font-weight="700" fill="#334155">CPU</text>
  <text x="100" y="143.5" text-anchor="end" font-size="12.5" font-weight="700" fill="#334155">GPU</text>
  <rect x="112" y="40" width="88" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="156.0" y="59.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Read 1</text>
  <rect x="200" y="82" width="66" height="30" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="233.0" y="101.5" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Prep 1</text>
  <rect x="112" y="124" width="154" height="30" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="189.0" y="143.5" text-anchor="middle" font-size="12" font-weight="400" fill="#b91c1c" font-style="italic">GPU idle</text>
