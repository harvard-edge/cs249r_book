  <rect x="442" y="370" width="88" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="486.0" y="389.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Train 3</text>
  <rect x="376" y="286" width="88" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420.0" y="305.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Read 4</text>
  <rect x="464" y="328" width="66" height="30" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="497.0" y="347.5" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Prep 4</text>
  <rect x="530" y="370" width="88" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="574.0" y="389.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Train 4</text>
  <rect x="112" y="370" width="154" height="30" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="189.0" y="389.5" text-anchor="middle" font-size="12" font-weight="400" fill="#b91c1c" font-style="italic">GPU idle</text>
  <line x1="112" y1="416" x2="626" y2="416" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="632" y="420" text-anchor="start" font-size="11.5" font-weight="400" fill="#64748b">time</text>
  <path d="M112,425 V430 H618 V425" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="365.0" y="446" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">4 batches</text>
