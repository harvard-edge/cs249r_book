  <text x="244.0" y="305.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Read 2</text>
  <rect x="288" y="328" width="66" height="30" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="321.0" y="347.5" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Prep 2</text>
  <rect x="354" y="370" width="88" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="398.0" y="389.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Train 2</text>
  <rect x="288" y="286" width="88" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
