  <text x="610" y="174" text-anchor="start" font-size="11.5" font-weight="400" fill="#64748b">time</text>
  <path d="M112,179 V184 H596 V179" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="354.0" y="200" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">2 batches</text>
