  <text x="310.0" y="143.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Train 1</text>
  <rect x="354" y="40" width="88" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="398.0" y="59.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Read 2</text>
  <rect x="442" y="82" width="66" height="30" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="475.0" y="101.5" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Prep 2</text>
  <rect x="354" y="124" width="154" height="30" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="431.0" y="143.5" text-anchor="middle" font-size="12" font-weight="400" fill="#b91c1c" font-style="italic">GPU idle</text>
