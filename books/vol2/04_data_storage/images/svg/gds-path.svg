<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Buffered storage path vs. GPUDirect Storage path.
       Payload hops: green arrows. CPU payload copy: slate solid. CPU control only: slate dashed. -->
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="332" fill="#ffffff"/>

  <!-- ===== (a) Buffered path ===== -->
  <text x="20" y="24" font-size="13" font-weight="700" fill="#0f172a">(a) Buffered path</text>

  <!-- NVMe -->
  <rect x="20" y="42" width="120" height="54" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="73.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">NVMe SSD</text>
  <!-- Host DRAM kernel buffer -->
  <rect x="185" y="42" width="120" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="245" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Host DRAM</text>
  <text x="245" y="83" text-anchor="middle" font-size="11.5" fill="#475569">kernel buffer</text>
  <!-- Host DRAM pinned buffer -->
  <rect x="350" y="42" width="120" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="410" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Host DRAM</text>
  <text x="410" y="83" text-anchor="middle" font-size="11.5" fill="#475569">pinned buffer</text>
  <!-- GPU HBM -->
  <rect x="515" y="42" width="145" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="587.5" y="73.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU HBM</text>

  <!-- payload hops -->
  <line x1="140" y1="69" x2="183" y2="69" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="162.5" y="61" text-anchor="middle" font-size="11.5" fill="#15803d">DMA</text>
  <line x1="305" y1="69" x2="348" y2="69" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="327.5" y="61" text-anchor="middle" font-size="11.5" fill="#475569">copy</text>
  <line x1="470" y1="69" x2="513" y2="69" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="492.5" y="61" text-anchor="middle" font-size="11.5" fill="#15803d">DMA</text>

  <!-- CPU performs the payload copy -->
  <rect x="267.5" y="118" width="120" height="36" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="327.5" y="140.5" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">CPU</text>
  <line x1="327.5" y1="118" x2="327.5" y2="72" stroke="#64748b" stroke-width="1.5"/>
  <text x="397" y="140.5" font-size="11.5" fill="#475569">copies every payload byte</text>

  <!-- divider -->
  <line x1="20" y1="176" x2="660" y2="176" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== (b) GPUDirect Storage ===== -->
  <text x="20" y="204" font-size="13" font-weight="700" fill="#0f172a">(b) GPUDirect Storage</text>

  <rect x="20" y="222" width="120" height="54" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="253.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">NVMe SSD</text>
  <rect x="515" y="222" width="145" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="587.5" y="253.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU HBM</text>

  <line x1="140" y1="249" x2="513" y2="249" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="327.5" y="241" text-anchor="middle" font-size="11.5" fill="#15803d">direct DMA, no host copy</text>

  <!-- CPU submits and completes I/O only -->
  <rect x="267.5" y="290" width="120" height="36" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="327.5" y="312.5" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">CPU</text>
  <path d="M267.5,308 H80 V278" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="397" y="312.5" font-size="11.5" fill="#475569">submits I/O, checks completion</text>
</svg>
