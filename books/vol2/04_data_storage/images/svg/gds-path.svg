<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Buffered path vs. GPUDirect Storage, drawn on one PCIe topology per panel.
       Thin gray = physical links. Thick green = payload DMA route. Gray = CPU work. -->
  <defs>
    <marker id="arr-green-lg" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="760" height="318" fill="#ffffff"/>
  <line x1="380" y1="14" x2="380" y2="304" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- ===== (a) Buffered path ===== -->
  <text x="20" y="22" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">(a) Buffered path</text>
  <line x1="95" y1="186" x2="95" y2="220" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="225" y1="110" x2="225" y2="156" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="315" y1="110" x2="315" y2="156" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="315" y1="192" x2="315" y2="220" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="130" y1="75" x2="180" y2="75" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="20" y="50" width="110" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="75" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">CPU</text>
  <rect x="180" y="40" width="180" height="70" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="270" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Host DRAM</text>
  <rect x="190" y="68" width="70" height="30" rx="0" fill="#ffffff" stroke="#1F407A" stroke-width="1"/>
  <text x="225" y="87.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#14294E">kernel</text>
  <rect x="280" y="68" width="70" height="30" rx="0" fill="#ffffff" stroke="#1F407A" stroke-width="1"/>
  <text x="315" y="87.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#14294E">pinned</text>
  <line x1="261" y1="83" x2="278" y2="83" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="130" y1="75" x2="180" y2="75" stroke="#64748b" stroke-width="2.5"/>
  <text x="155" y="68" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">copy</text>
  <rect x="20" y="156" width="340" height="36" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="270" y="171" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">PCIe switch</text>
  <rect x="20" y="220" width="110" height="70" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="75" y="259.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">NVMe SSD</text>
  <rect x="220" y="220" width="140" height="70" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.5"/>
  <text x="232" y="238" text-anchor="start" font-size="13" font-weight="700" fill="#14294E">GPU</text>
  <rect x="232" y="248" width="116" height="30" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="290" y="267.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#14294E">HBM</text>
  <path d="M95,220 V182 H225 V100" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr-green-lg)"/>
  <path d="M315,98 V246" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr-green-lg)"/>
  <text x="217" y="137" text-anchor="end" font-size="12.5" font-weight="700" fill="#15803d">DMA 1</text>
  <text x="323" y="137" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">DMA 2</text>
  <!-- ===== (b) GPUDirect Storage ===== -->
  <text x="400" y="22" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">(b) GPUDirect Storage</text>
  <line x1="475" y1="186" x2="475" y2="220" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="605" y1="110" x2="605" y2="156" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="695" y1="110" x2="695" y2="156" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="695" y1="192" x2="695" y2="220" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="510" y1="75" x2="560" y2="75" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="400" y="50" width="110" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="455" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">CPU</text>
  <rect x="560" y="40" width="180" height="70" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="650" y="79.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Host DRAM</text>
  <rect x="400" y="156" width="340" height="36" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="650" y="171" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">PCIe switch</text>
  <rect x="400" y="220" width="110" height="70" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="455" y="259.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">NVMe SSD</text>
  <rect x="600" y="220" width="140" height="70" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.5"/>
  <text x="612" y="238" text-anchor="start" font-size="13" font-weight="700" fill="#14294E">GPU</text>
  <rect x="612" y="248" width="116" height="30" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="670" y="267.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#14294E">HBM</text>
  <path d="M475,220 V182 H695 V246" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr-green-lg)"/>
  <text x="703" y="210" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">DMA</text>
  <line x1="435" y1="100" x2="435" y2="218" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="443" y="137" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">control</text>
</svg>
