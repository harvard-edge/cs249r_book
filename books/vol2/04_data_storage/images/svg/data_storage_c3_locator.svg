<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="100%" height="100%">
  <!-- Background Triangle -->
  <polygon points="65.0,22.0 24.0,92.0 106.0,92.0" fill="#F8FAFC" stroke="none" />

  <!-- Connecting Edges with Volume 1 Palette -->
  <line x1="65.0" y1="22.0" x2="24.0" y2="92.0" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <line x1="24.0" y1="92.0" x2="106.0" y2="92.0" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <line x1="106.0" y1="92.0" x2="65.0" y2="22.0" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

  <!-- Center Hub: Persistent Storage Physical Substrate -->
  <circle cx="65.0" cy="68.0" r="16" fill="#D6EAF8" stroke="#006395" stroke-width="2" />
  <text x="65.0" y="68.0" fill="#006395" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" dominant-baseline="central">Storage</text>

  <!-- Vertex: Compute (C1) -->
  <circle cx="65.0" cy="22.0" r="16" fill="#006395" stroke="#006395" stroke-width="2" />
  <text x="65.0" y="22.0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">C₁</text>

  <!-- Vertex: Communication (C2) -->
  <circle cx="24.0" cy="92.0" r="16" fill="#E67817" stroke="#E67817" stroke-width="2" />
  <text x="24.0" y="92.0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">C₂</text>

  <!-- Vertex: Coordination (C3) -->
  <circle cx="106.0" cy="92.0" r="16" fill="#7E317B" stroke="#7E317B" stroke-width="2" />
  <text x="106.0" y="92.0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">C₃</text>
</svg>
