<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 3 122 108" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- C3 locator: storage hub spanning the three C3 roles (vol2 palette.md colors) -->
  <polygon points="65.0,22.0 24.0,92.0 106.0,92.0" fill="#f8fafc" stroke="none"/>

  <!-- Edges: structural slate -->
  <line x1="65.0" y1="22.0" x2="24.0" y2="92.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="24.0" y1="92.0" x2="106.0" y2="92.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="106.0" y1="92.0" x2="65.0" y2="22.0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Center hub: storage (palette storage green) -->
  <circle cx="65.0" cy="68.0" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="65.0" y="68.0" fill="#15803d" font-size="8.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">Storage</text>

  <!-- C1 Compute: ETH blue -->
  <circle cx="65.0" cy="22.0" r="16" fill="#1F407A" stroke="#1F407A" stroke-width="2"/>
  <text x="65.0" y="22.0" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">C₁</text>

  <!-- C2 Communication: amber -->
  <circle cx="24.0" cy="92.0" r="16" fill="#d97706" stroke="#d97706" stroke-width="2"/>
  <text x="24.0" y="92.0" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">C₂</text>

  <!-- C3 Coordination: violet -->
  <circle cx="106.0" cy="92.0" r="16" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
  <text x="106.0" y="92.0" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">C₃</text>
</svg>
