<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Complete data path for the running example, schematic: no rates.
       Columns ordered by tier (object, PFS, NVMe, host DRAM, HBM).
       Row 1: training data moves toward the accelerator. Row 2: checkpoints return toward durable storage.
       Solid = on the training critical path; dashed = off it. -->
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="680" height="312" fill="#ffffff"/>
  <text x="20" y="26" font-size="13" font-weight="700" fill="#0f172a">Training data</text>
  <rect x="20" y="72" width="100" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70.0" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Object</text>
  <text x="70.0" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">storage</text>
  <rect x="290" y="72" width="100" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340.0" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Local</text>
  <text x="340.0" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">NVMe</text>
  <rect x="425" y="72" width="100" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="475.0" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Host DRAM</text>
  <text x="475.0" y="111" text-anchor="middle" font-size="11.5" fill="#475569">prefetch queue</text>
  <rect x="560" y="72" width="100" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="610.0" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU HBM</text>
  <text x="610.0" y="111" text-anchor="middle" font-size="11.5" fill="#475569">training step</text>
  <line x1="120" y1="97" x2="288" y2="97" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="205.0" y="89" text-anchor="middle" font-size="11.5" fill="#15803d">stage once per job</text>
  <line x1="390" y1="97" x2="423" y2="97" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="525" y1="97" x2="558" y2="97" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M360.0,72 V54 H590.0 V70" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="475.0" y="46" text-anchor="middle" font-size="11.5" fill="#15803d">optional GDS bypass</text>
  <line x1="20" y1="148" x2="660" y2="148" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="176" font-size="13" font-weight="700" fill="#0f172a">Checkpoints</text>
  <rect x="20" y="190" width="100" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70.0" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Object</text>
  <text x="70.0" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">storage</text>
  <rect x="155" y="190" width="100" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="205.0" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Parallel</text>
  <text x="205.0" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">file system</text>
  <rect x="290" y="190" width="100" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340.0" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Local</text>
  <text x="340.0" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">NVMe</text>
  <rect x="560" y="190" width="100" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="610.0" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU HBM</text>
  <text x="610.0" y="229" text-anchor="middle" font-size="11.5" fill="#475569">model state</text>
  <line x1="560" y1="215" x2="392" y2="215" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="475.0" y="207" text-anchor="middle" font-size="11.5" fill="#15803d">local save (pause)</text>
  <line x1="290" y1="215" x2="257" y2="215" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <line x1="155" y1="215" x2="122" y2="215" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="272.5" y="260" text-anchor="middle" font-size="11.5" fill="#15803d">async copy</text>
  <text x="137.5" y="260" text-anchor="middle" font-size="11.5" fill="#15803d">retain selected</text>
  <line x1="170" y1="294" x2="204" y2="294" stroke="#16a34a" stroke-width="2"/>
  <text x="212" y="298" font-size="11.5" fill="#475569">training loop waits</text>
  <line x1="380" y1="294" x2="414" y2="294" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="422" y="298" font-size="11.5" fill="#475569">once per job or background</text>
</svg>
