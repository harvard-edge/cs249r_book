<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 405">
  <rect width="1000" height="405" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ===== FORWARD PATH ===== -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="220" height="18" rx="2" fill="#f1f5f9"/>
    <text x="10" y="12.5" font-size="8.5" font-weight="700" fill="#334155">TRAINING DATA FORWARD PATH</text>
  </g>

  <!-- Box 1: Object Storage -->
  <rect x="30" y="45" width="100" height="60" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="80" y="65" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Object</text>
  <text x="80" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Storage</text>
  <text x="80" y="95" text-anchor="middle" font-size="8" fill="#64748b">S3 / GCS</text>

  <!-- Arrow 1 → 2 -->
  <line x1="130" y1="75" x2="210" y2="75" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="170" y="65" text-anchor="middle" font-size="8" font-weight="600" fill="#b91c1c">0.1 GB/s</text>
  <text x="170" y="90" text-anchor="middle" font-size="7.5" fill="#94a3b8">stage</text>

  <!-- Box 2: Parallel FS -->
  <rect x="210" y="45" width="100" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="260" y="65" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Parallel</text>
  <text x="260" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">File System</text>
  <text x="260" y="95" text-anchor="middle" font-size="8" fill="#64748b">Lustre / GPFS</text>

  <!-- Arrow 2 → 3 -->
  <line x1="310" y1="75" x2="390" y2="75" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="350" y="65" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">4 GB/s</text>
  <text x="350" y="90" text-anchor="middle" font-size="7.5" fill="#94a3b8">per node</text>

  <!-- Box 3: Local NVMe -->
  <rect x="390" y="45" width="100" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="440" y="65" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Local</text>
  <text x="440" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">NVMe</text>
  <text x="440" y="95" text-anchor="middle" font-size="8" fill="#64748b">PCIe Gen5</text>

  <!-- Arrow 3 → 4 -->
  <line x1="490" y1="75" x2="630" y2="75" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="560" y="65" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">14 GB/s</text>
  <text x="560" y="90" text-anchor="middle" font-size="7.5" fill="#94a3b8">read + decode</text>

  <!-- Box 4: Host DRAM -->
  <rect x="630" y="45" width="100" height="60" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="680" y="65" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Host</text>
  <text x="680" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">DRAM</text>
  <text x="680" y="95" text-anchor="middle" font-size="8" fill="#64748b">pinned memory</text>

  <!-- Arrow 4 → 5 -->
  <line x1="730" y1="75" x2="830" y2="75" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="780" y="65" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">64 GB/s</text>
  <text x="780" y="90" text-anchor="middle" font-size="7.5" fill="#94a3b8">PCIe DMA</text>

  <!-- Box 5: GPU HBM -->
  <rect x="830" y="45" width="100" height="60" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="880" y="65" text-anchor="middle" font-size="9" font-weight="700" fill="#14294E">GPU HBM</text>
  <text x="880" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#14294E">80 GB</text>
  <text x="880" y="95" text-anchor="middle" font-size="8" fill="#475569">prefetch buffer</text>

  <!-- Arrow 5 → Compute -->
  <line x1="930" y1="75" x2="960" y2="75" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Compute block -->
  <rect x="960" y="45" width="20" height="60" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="970" y="75" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E" transform="rotate(-90,970,75)">COMPUTE</text>

  <!-- ===== Bandwidth badges below each box ===== -->
  <rect x="40" y="115" width="80" height="18" rx="2" fill="#dc2626"/>
  <text x="80" y="127.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">0.1 GB/s</text>

  <rect x="220" y="115" width="80" height="18" rx="2" fill="#d97706"/>
  <text x="260" y="127.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">1–4 GB/s</text>

  <rect x="400" y="115" width="80" height="18" rx="2" fill="#d97706"/>
  <text x="440" y="127.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">7–14 GB/s</text>

  <rect x="640" y="115" width="80" height="18" rx="2" fill="#16a34a"/>
  <text x="680" y="127.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">200 GB/s</text>

  <rect x="840" y="115" width="80" height="18" rx="2" fill="#1F407A"/>
  <text x="880" y="127.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">3,350 GB/s</text>

  <!-- ===== Horizontal divider ===== -->
  <line x1="20" y1="148" x2="980" y2="148" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== CHECKPOINT RETURN PATH ===== -->
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="220" height="18" rx="2" fill="#f1f5f9"/>
    <text x="10" y="12.5" font-size="8.5" font-weight="700" fill="#334155">CHECKPOINT RETURN PATH</text>
  </g>

  <!-- GPU HBM source -->
  <rect x="830" y="185" width="100" height="60" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="880" y="205" text-anchor="middle" font-size="9" font-weight="700" fill="#14294E">GPU HBM</text>
  <text x="880" y="220" text-anchor="middle" font-size="8" fill="#475569">weights +</text>
  <text x="880" y="235" text-anchor="middle" font-size="8" fill="#475569">opt. state</text>

  <!-- Arrow HBM → NVMe -->
  <line x1="830" y1="215" x2="490" y2="215" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="205" text-anchor="middle" font-size="8" font-weight="600" fill="#1F407A">14 GB/s · ~0.3 s</text>
  <text x="660" y="230" text-anchor="middle" font-size="8" fill="#64748b">sync write</text>

  <!-- Local NVMe (checkpoint copy 1) -->
  <rect x="390" y="185" width="100" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="440" y="205" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Local NVMe</text>
  <text x="440" y="220" text-anchor="middle" font-size="8" fill="#64748b">T_save = T_local</text>
  <text x="440" y="235" text-anchor="middle" font-size="8" fill="#b45309" font-weight="600">~0.3 s pause</text>

  <!-- Arrow NVMe → PFS -->
  <line x1="390" y1="215" x2="310" y2="215" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow-orange)"/>
  <text x="350" y="205" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">async · minutes</text>
  <text x="350" y="230" text-anchor="middle" font-size="7.5" fill="#94a3b8">(background)</text>

  <!-- PFS (checkpoint copy 2) -->
  <rect x="210" y="185" width="100" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="260" y="205" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Parallel FS</text>
  <text x="260" y="220" text-anchor="middle" font-size="8" fill="#64748b">durable copy</text>
  <text x="260" y="235" text-anchor="middle" font-size="8" fill="#64748b">3 recent kept</text>

  <!-- Arrow PFS → Object -->
  <line x1="210" y1="215" x2="130" y2="215" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>

  <!-- Object (archive) -->
  <rect x="30" y="185" width="100" height="60" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="80" y="205" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Object</text>
  <text x="80" y="220" text-anchor="middle" font-size="8" fill="#64748b">archive</text>
  <text x="80" y="235" text-anchor="middle" font-size="7.5" fill="#64748b">long-term</text>

  <!-- ===== T_save annotation ===== -->
  <g transform="translate(210, 260)">
    <rect x="0" y="0" width="460" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="230" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">T_save = T_local (not T_PFS)</text>
    <text x="230" y="31" text-anchor="middle" font-size="8" fill="#166534">Training resumes after local NVMe write; PFS copy is asynchronous</text>
  </g>

  <!-- ===== Legend ===== -->
  <g transform="translate(180, 315)">
    <rect x="0" y="0" width="640" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="640" height="18" rx="4" fill="#f1f5f9"/>
    <text x="320" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Transfer Path Characteristics</text>

    <!-- Sync line -->
    <line x1="30" y1="32" x2="60" y2="32" stroke="#1F407A" stroke-width="1.5"/>
    <text x="70" y="35.5" font-size="8" font-weight="600" fill="#334155">Sync write (training paused)</text>

    <!-- Async dashed line -->
    <line x1="250" y1="32" x2="280" y2="32" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,2"/>
    <text x="290" y="35.5" font-size="8" font-weight="600" fill="#334155">Async copy (training continues)</text>

    <!-- Archive line -->
    <line x1="480" y1="32" x2="510" y2="32" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="520" y="35.5" font-size="8" font-weight="600" fill="#334155">Long-term archive</text>
  </g>
</svg>