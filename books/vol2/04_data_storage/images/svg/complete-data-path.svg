<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262">
  <!-- Complete data path for the running example, schematic: no rates.
       Columns ordered by tier (object, PFS, NVMe, host DRAM, HBM).
       Row 1: training data moves toward the accelerator.
       Row 2: checkpoints return toward durable storage.
       Solid = on the training critical path; dashed = off it. -->
  <rect width="680" height="262" fill="#ffffff"/>

  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- ===== Row 1: training data path ===== -->
  <text x="30" y="30" text-anchor="start" font-size="9.5" font-weight="700" fill="#0f172a">Training data</text>

  <rect x="30" y="50" width="96" height="44" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="78" y="69" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Object</text>
  <text x="78" y="82" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">storage</text>

  <rect x="290" y="50" width="96" height="44" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="338" y="69" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Local</text>
  <text x="338" y="82" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">NVMe</text>

  <rect x="420" y="50" width="96" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="468" y="69" text-anchor="middle" font-size="9" font-weight="700" fill="#14294E">Host DRAM</text>
  <text x="468" y="82" text-anchor="middle" font-size="8" fill="#475569">prefetch queue</text>

  <rect x="550" y="50" width="96" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="598" y="69" text-anchor="middle" font-size="9" font-weight="700" fill="#14294E">GPU HBM</text>
  <text x="598" y="82" text-anchor="middle" font-size="8" fill="#475569">training step</text>

  <!-- object -> NVMe: staging, once per job (skips the PFS column) -->
  <line x1="126" y1="72" x2="288" y2="72" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="207" y="65" text-anchor="middle" font-size="8" fill="#15803d">stage once per job</text>
  <!-- NVMe -> DRAM -> HBM: critical path -->
  <line x1="386" y1="72" x2="418" y2="72" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="516" y1="72" x2="548" y2="72" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- optional GDS bypass routed above host DRAM -->
  <path d="M362,50 L362,36 L574,36 L574,48" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="468" y="31" text-anchor="middle" font-size="8" fill="#1F407A">optional GDS path: no host payload copy</text>

  <!-- divider -->
  <line x1="30" y1="118" x2="646" y2="118" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== Row 2: checkpoint return path ===== -->
  <text x="30" y="140" text-anchor="start" font-size="9.5" font-weight="700" fill="#0f172a">Checkpoints</text>

  <rect x="30" y="156" width="96" height="44" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="78" y="175" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Object</text>
  <text x="78" y="188" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">storage</text>

  <rect x="160" y="156" width="96" height="44" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="208" y="175" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Parallel</text>
  <text x="208" y="188" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">file system</text>

  <rect x="290" y="156" width="96" height="44" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="338" y="175" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Local</text>
  <text x="338" y="188" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">NVMe</text>

  <rect x="550" y="156" width="96" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="598" y="175" text-anchor="middle" font-size="9" font-weight="700" fill="#14294E">GPU HBM</text>
  <text x="598" y="188" text-anchor="middle" font-size="8" fill="#475569">weights + optimizer</text>

  <!-- HBM -> NVMe: local save, training paused (critical) -->
  <line x1="550" y1="178" x2="388" y2="178" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="468" y="171" text-anchor="middle" font-size="8" fill="#15803d">local save (pause)</text>
  <!-- NVMe -> PFS: async copy -->
  <line x1="290" y1="178" x2="258" y2="178" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <!-- PFS -> object: long-term retention -->
  <line x1="160" y1="178" x2="128" y2="178" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="273" y="216" text-anchor="middle" font-size="8" fill="#475569">async copy</text>
  <text x="143" y="216" text-anchor="middle" font-size="8" fill="#475569">retain selected</text>

  <!-- ===== Key ===== -->
  <line x1="190" y1="244" x2="222" y2="244" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="247" text-anchor="start" font-size="8" fill="#475569">on the training critical path</text>
  <line x1="390" y1="244" x2="422" y2="244" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="430" y="247" text-anchor="start" font-size="8" fill="#475569">off the critical path</text>
</svg>
