<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean Canvas Base -->
  <rect width="680" height="500" fill="#ffffff"/>

  <!-- Y-axis label -->
  <text x="24" y="215" text-anchor="middle" font-size="9" font-weight="700" fill="#64748b" transform="rotate(-90, 24, 215)">Bandwidth (Log Scale)</text>

  <!-- ===== Tier bands: stacked waterfall from top (HBM) to bottom (Object) ===== -->
  <!-- 1. GPU HBM: y=25, height=54 -->
  <rect x="60" y="25" width="560" height="54" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="80" y="46" font-size="11" font-weight="700" fill="#14294E">GPU HBM3e</text>
  <text x="80" y="62" font-size="8.5" fill="#475569">3,350 GB/s · On-package · 80–141 GB capacity</text>
  <text x="600" y="55" text-anchor="end" font-size="10" font-weight="700" fill="#1F407A">3,350 GB/s</text>

  <!-- Cliff annotation 1: HBM → DRAM (17×) -->
  <rect x="60" y="79" width="560" height="28" fill="#fee2e2" fill-opacity="0.6"/>
  <line x1="60" y1="93" x2="620" y2="93" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="220" y="83" width="240" height="20" rx="3" fill="#dc2626"/>
  <text x="340" y="97" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Cliff: 17× drop → refill window ~400 ms</text>

  <!-- 2. Host DRAM: y=107, height=48 -->
  <rect x="60" y="107" width="500" height="48" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="126" font-size="11" font-weight="700" fill="#15803d">Host DRAM (DDR5)</text>
  <text x="80" y="141" font-size="8.5" fill="#475569">200 GB/s · PCIe Gen5-attached · 512 GB–2 TB</text>
  <text x="540" y="134" text-anchor="end" font-size="10" font-weight="700" fill="#16a34a">200 GB/s</text>

  <!-- Cliff annotation 2: DRAM → NVMe (15–30×) -->
  <rect x="60" y="155" width="500" height="28" fill="#fee2e2" fill-opacity="0.6"/>
  <line x1="60" y1="169" x2="560" y2="169" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="190" y="159" width="240" height="20" rx="3" fill="#dc2626"/>
  <text x="310" y="173" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Cliff: 15–30× drop → refill window ~3 s</text>

  <!-- 3. Local NVMe: y=183, height=44 -->
  <rect x="60" y="183" width="400" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="201" font-size="11" font-weight="700" fill="#15803d">Local NVMe SSDs (RAID-0)</text>
  <text x="80" y="215" font-size="8.5" fill="#475569">7–25 GB/s · Direct PCIe Gen5 · 4–30 TB</text>
  <text x="440" y="209" text-anchor="end" font-size="10" font-weight="700" fill="#16a34a">7–25 GB/s</text>

  <!-- Cliff annotation 3: NVMe → PFS (3–10×) -->
  <rect x="60" y="227" width="400" height="28" fill="#fee2e2" fill-opacity="0.6"/>
  <line x1="60" y1="241" x2="460" y2="241" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="140" y="231" width="240" height="20" rx="3" fill="#dc2626"/>
  <text x="260" y="245" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Cliff: 3–10× drop → refill window ~10 s</text>

  <!-- 4. Parallel File System: y=255, height=44 -->
  <rect x="60" y="255" width="280" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="272" font-size="11" font-weight="700" fill="#15803d">Parallel File System</text>
  <text x="80" y="286" font-size="8.5" fill="#475569">Lustre / GPFS / DAOS · 100+ PB</text>
  <text x="320" y="281" text-anchor="end" font-size="9.5" font-weight="700" fill="#16a34a">1–4 GB/s/node</text>

  <!-- Cliff annotation 4: PFS → Object (10–100×) -->
  <rect x="60" y="299" width="280" height="28" fill="#fee2e2" fill-opacity="0.6"/>
  <line x1="60" y1="313" x2="340" y2="313" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="80" y="303" width="240" height="20" rx="3" fill="#dc2626"/>
  <text x="200" y="317" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Cliff: 10–100× drop → requires staging</text>

  <!-- 5. Object Storage: y=327, height=40 -->
  <rect x="60" y="327" width="180" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="80" y="343" font-size="10.5" font-weight="700" fill="#0f172a">Object Storage</text>
  <text x="80" y="357" font-size="8.5" fill="#475569">S3 / GCS · ~0.1 GB/s/client</text>

  <!-- Right-side Refill Window Card -->
  <g>
    <rect x="475" y="225" width="165" height="135" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="475" y="225" width="165" height="24" rx="4" fill="#f1f5f9" stroke="none"/>
    <line x1="475" y1="249" x2="640" y2="249" stroke="#cbd5e1" stroke-width="1"/>
    <text x="557" y="241" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Refill Windows</text>
    <text x="485" y="266" font-size="8" fill="#0f172a">• HBM drains in ~50 ms</text>
    <text x="485" y="281" font-size="8" fill="#0f172a">• DRAM refills in ~400 ms</text>
    <text x="485" y="296" font-size="8" fill="#0f172a">• NVMe refills in ~3 s</text>
    <text x="485" y="311" font-size="8" fill="#0f172a">• PFS refills in ~10 s</text>
    <text x="557" y="342" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">Each tier buffers tier above</text>
  </g>

  <!-- Design Principle Card -->
  <rect x="60" y="390" width="560" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="340" y="407" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Architectural Principle: Continuous Prefetching</text>
  <text x="340" y="423" text-anchor="middle" font-size="8.5" fill="#475569">Each lower storage tier must prefetch deep enough to absorb the draining rate and latency jitter of the tier below.</text>

  <!-- Footnote -->
  <line x1="80" y1="455" x2="600" y2="455" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="475" text-anchor="middle" font-size="8.5" font-style="italic" fill="#64748b">Bandwidth figures are per-node for NVMe and PFS; aggregate for PFS cluster. Refill windows assume H100 HBM consumption rate.</text>
</svg>