<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- The acknowledgment gap at an output commit boundary, schematic (no data).
       A worker writes the output row for event e42, then crashes before it records
       the commit. Its replacement replays e42: an append duplicates the row, a write
       under a stable key overwrites the same row. -->
  <defs>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="346" fill="#ffffff"/>

  <!-- Lane labels -->
  <text x="116" y="43" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">Worker</text>
  <text x="116" y="59" text-anchor="end" font-size="11.5" fill="#64748b">first attempt</text>
  <text x="116" y="159" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">Replacement</text>
  <text x="116" y="175" text-anchor="end" font-size="11.5" fill="#64748b">after the crash</text>

  <!-- Row 1: read, write, crash, commit never reached -->
  <rect x="130" y="26" width="100" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="45" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">read e42</text>
  <text x="180" y="61" text-anchor="middle" font-size="11.5" fill="#475569">input event</text>

  <line x1="230" y1="48" x2="248" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-slate)"/>

  <rect x="254" y="26" width="110" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="309" y="45" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">write row</text>
  <text x="309" y="61" text-anchor="middle" font-size="11.5" fill="#15803d">output stored</text>

  <!-- crash marker -->
  <line x1="375" y1="38" x2="395" y2="58" stroke="#dc2626" stroke-width="3"/>
  <line x1="395" y1="38" x2="375" y2="58" stroke="#dc2626" stroke-width="3"/>
  <text x="385" y="84" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">crash</text>

  <rect x="406" y="26" width="130" height="44" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="471" y="45" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">record commit</text>
  <text x="471" y="61" text-anchor="middle" font-size="11.5" fill="#6d28d9">never reached</text>

  <!-- acknowledgment gap bracket -->
  <path d="M364,96 L364,102 L536,102 L536,96" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">acknowledgment gap</text>
  <text x="450" y="135" text-anchor="middle" font-size="11.5" fill="#b91c1c">written but not committed</text>

  <!-- Row 2: replay -->
  <rect x="130" y="142" width="100" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="161" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">replay e42</text>
  <text x="180" y="177" text-anchor="middle" font-size="11.5" fill="#475569">commit unknown</text>

  <!-- branch to the two outcomes -->
  <line x1="180" y1="186" x2="180" y2="198" stroke="#64748b" stroke-width="1.5"/>
  <line x1="180" y1="198" x2="527" y2="198" stroke="#64748b" stroke-width="1.5"/>
  <line x1="260" y1="198" x2="260" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <line x1="527" y1="198" x2="527" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-slate)"/>

  <!-- Panel (a): append -->
  <rect x="130" y="216" width="260" height="110" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="142" y="236" font-size="12.5" font-weight="700" fill="#0f172a">(a) Append the row</text>
  <rect x="146" y="246" width="228" height="24" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="156" y="262" font-size="12" fill="#0f172a">e42 · click · first write</text>
  <rect x="146" y="274" width="228" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="156" y="290" font-size="12" fill="#0f172a">e42 · click · replay</text>
  <text x="364" y="290" text-anchor="end" font-size="11.5" font-weight="700" fill="#b91c1c">duplicate</text>
  <text x="146" y="316" font-size="11.5" fill="#b91c1c">the click counts twice</text>

  <!-- Panel (b): stable key -->
  <rect x="404" y="216" width="246" height="110" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="416" y="236" font-size="12.5" font-weight="700" fill="#0f172a">(b) Write under a stable key</text>
  <rect x="420" y="246" width="214" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="430" y="262" font-size="12" fill="#14532d">(feature_version, e42) · click</text>
  <text x="420" y="292" font-size="11.5" fill="#15803d">replay overwrites the same row</text>
  <text x="420" y="316" font-size="11.5" fill="#15803d">the click counts once</text>
</svg>
