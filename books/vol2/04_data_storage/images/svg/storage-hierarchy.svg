<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Six-tier ML storage hierarchy. Band width = schematic capacity growth.
       Left: bandwidth scope, with a glyph of what one bandwidth figure is shared by
       (one accelerator; one node of eight accelerators; several such nodes tied to one shared service). -->
  <rect width="730" height="360" fill="#ffffff"/>
  <text x="178" y="22" text-anchor="end" font-size="12.5" font-weight="700" fill="#0f172a">Bandwidth scope</text>
  <text x="380" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Tier (width = relative capacity)</text>
  <text x="574" y="22" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">Path to accelerator</text>
  <polygon points="305.0,40 455.0,40 471.5,84 288.5,84" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="380" y="66.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU HBM</text>
  <line x1="469.2" y1="62" x2="566" y2="62" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="574" y="66" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">mm, silicon interposer</text>
  <polygon points="286.3,90 473.7,90 490.2,134 269.8,134" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="380" y="116.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Host DRAM</text>
  <line x1="487.9" y1="112" x2="566" y2="112" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="574" y="116" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">cm, host memory bus</text>
  <polygon points="267.6,140 492.4,140 508.9,184 251.1,184" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="380" y="166.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Local NVMe</text>
  <line x1="506.6" y1="162" x2="566" y2="162" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="574" y="166" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">cm, PCIe lanes</text>
  <polygon points="248.9,190 511.1,190 527.6,234 232.4,234" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="380" y="216.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Parallel file system</text>
  <line x1="525.4" y1="212" x2="566" y2="212" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="574" y="216" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">m, switched network</text>
  <polygon points="230.2,240 529.8,240 546.3,284 213.7,284" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="380" y="266.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Object storage</text>
  <line x1="544.0" y1="262" x2="566" y2="262" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="574" y="266" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">km, data-center fiber</text>
  <polygon points="211.5,290 548.5,290 565.0,334 195.0,334" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="380" y="316.5" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Archive</text>
  <line x1="562.8" y1="312" x2="566" y2="312" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="574" y="316" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">offline media</text>
  <path d="M194,43 H188 V81 H194" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M194,93 H188 V181 H194" fill="none" stroke="#64748b" stroke-width="1.5"/>
