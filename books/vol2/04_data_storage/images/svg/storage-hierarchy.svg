<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="360" fill="#ffffff"/>
  <!-- Column headers -->
  <text x="128" y="22" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">Bandwidth scope</text>
  <text x="330" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Tier (width = relative capacity)</text>
  <text x="524" y="22" font-size="12" font-weight="700" fill="#0f172a">Path to accelerator</text>
  <!-- Tier 0: GPU HBM -->
  <polygon points="255.0,40 405.0,40 421.5,84 238.5,84" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="330" y="66.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU HBM</text>
  <line x1="419.2" y1="62.0" x2="516" y2="62.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="524" y="66.0" font-size="12" fill="#475569">mm, silicon interposer</text>
  <!-- Tier 1: Host DRAM -->
  <polygon points="236.3,90 423.7,90 440.2,134 219.8,134" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="330" y="116.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Host DRAM</text>
  <line x1="437.9" y1="112.0" x2="516" y2="112.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="524" y="116.0" font-size="12" fill="#475569">cm, host memory bus</text>
  <!-- Tier 2: Local NVMe -->
  <polygon points="217.6,140 442.4,140 458.9,184 201.1,184" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="330" y="166.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Local NVMe</text>
  <line x1="456.6" y1="162.0" x2="516" y2="162.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="524" y="166.0" font-size="12" fill="#475569">cm, PCIe lanes</text>
  <!-- Tier 3: Parallel file system -->
  <polygon points="198.9,190 461.1,190 477.6,234 182.4,234" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="330" y="216.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Parallel file system</text>
  <line x1="475.4" y1="212.0" x2="516" y2="212.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="524" y="216.0" font-size="12" fill="#475569">m, switched network</text>
  <!-- Tier 4: Object storage -->
  <polygon points="180.2,240 479.8,240 496.3,284 163.7,284" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="330" y="266.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Object storage</text>
  <line x1="494.1" y1="262.0" x2="516" y2="262.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="524" y="266.0" font-size="12" fill="#475569">km, data-center fiber</text>
  <!-- Tier 5: Archive -->
  <polygon points="161.5,290 498.5,290 515.0,334 145.0,334" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="330" y="316.5" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Archive</text>
  <line x1="512.8" y1="312.0" x2="516" y2="312.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="524" y="316.0" font-size="12" fill="#475569">offline media</text>
  <!-- Scope brackets -->
  <path d="M144,43 H138 V81 H144" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="66.0" text-anchor="end" font-size="12" font-weight="700" fill="#334155">Per accelerator</text>
  <path d="M144,93 H138 V181 H144" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="141.0" text-anchor="end" font-size="12" font-weight="700" fill="#334155">Per node</text>
  <path d="M144,193 H138 V331 H144" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="266.0" text-anchor="end" font-size="12" font-weight="700" fill="#334155">Shared service</text>
</svg>
