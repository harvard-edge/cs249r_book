<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="680" height="442" fill="#ffffff"/>

  <!-- Column dividers -->
  <line x1="215" y1="20" x2="215" y2="410" stroke="#e2e8f0" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="465" y1="20" x2="465" y2="410" stroke="#e2e8f0" stroke-dasharray="4,4" stroke-width="1"/>

  <!-- Column headers -->
  <text x="95" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#14294E">Compute Clients (C₁)</text>
  <text x="340" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Storage / Metadata Nodes</text>
  <text x="565" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Storage Targets (Storage)</text>

  <!-- ===== MDS + MDT (top center, metadata path) ===== -->
  <!-- MDS box -->
  <rect x="270" y="46" width="130" height="42" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="335" y="63" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">MDS</text>
  <text x="335" y="77" text-anchor="middle" font-size="8.5" fill="#475569">Metadata Server</text>

  <!-- MDT disk cylinder -->
  <g fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2">
    <ellipse cx="565" cy="54" rx="32" ry="10"/>
    <rect x="533" y="54" width="64" height="26"/>
    <ellipse cx="565" cy="80" rx="32" ry="10"/>
  </g>
  <text x="565" y="71" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">MDT</text>

  <!-- MDS → MDT arrow -->
  <line x1="400" y1="67" x2="533" y2="67" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="466" y="61" text-anchor="middle" font-size="8" fill="#6d28d9">namespace ops</text>

  <!-- ===== Client boxes (left column) ===== -->
  <!-- Client 1 -->
  <rect x="30" y="112" width="130" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="95" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#14294E">Client 1</text>
  <text x="95" y="143" text-anchor="middle" font-size="8.5" fill="#475569">GPU Trainer Node</text>

  <!-- Client 2 -->
  <rect x="30" y="172" width="130" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="95" y="189" text-anchor="middle" font-size="10" font-weight="700" fill="#14294E">Client 2</text>
  <text x="95" y="203" text-anchor="middle" font-size="8.5" fill="#475569">GPU Trainer Node</text>

  <!-- Client 3 -->
  <rect x="30" y="232" width="130" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="95" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#14294E">Client 3</text>
  <text x="95" y="263" text-anchor="middle" font-size="8.5" fill="#475569">GPU Trainer Node</text>

  <!-- Client ellipsis -->
  <text x="95" y="296" text-anchor="middle" font-size="14" fill="#94a3b8">⋮</text>

  <!-- Client N -->
  <rect x="30" y="312" width="130" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="95" y="329" text-anchor="middle" font-size="10" font-weight="700" fill="#14294E">Client N</text>
  <text x="95" y="343" text-anchor="middle" font-size="8.5" fill="#475569">GPU Trainer Node</text>

  <!-- Client 1 → MDS (step 1: open file, get stripe map) -->
  <path d="M 120 112 L 120 74 L 270 74" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>
  <text x="195" y="70" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6d28d9">1. open() → stripe map</text>

  <!-- ===== OSS boxes (middle column) ===== -->
  <!-- OSS-1 -->
  <rect x="270" y="112" width="130" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="335" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">OSS-1</text>
  <text x="335" y="143" text-anchor="middle" font-size="8.5" fill="#475569">Object Storage Server</text>

  <!-- OSS-2 -->
  <rect x="270" y="172" width="130" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="335" y="189" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">OSS-2</text>
  <text x="335" y="203" text-anchor="middle" font-size="8.5" fill="#475569">Object Storage Server</text>

  <!-- OSS-3 -->
  <rect x="270" y="232" width="130" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="335" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">OSS-3</text>
  <text x="335" y="263" text-anchor="middle" font-size="8.5" fill="#475569">Object Storage Server</text>

  <!-- OSS ellipsis -->
  <text x="335" y="296" text-anchor="middle" font-size="14" fill="#94a3b8">⋮</text>

  <!-- OSS-N -->
  <rect x="270" y="312" width="130" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="335" y="329" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">OSS-N</text>
  <text x="335" y="343" text-anchor="middle" font-size="8.5" fill="#475569">Object Storage Server</text>

  <!-- Client → OSS parallel data arrows -->
  <line x1="160" y1="133" x2="270" y2="133" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="160" y1="193" x2="270" y2="193" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="160" y1="253" x2="270" y2="253" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="160" y1="333" x2="270" y2="333" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <text x="215" y="129" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">2. parallel reads</text>

  <!-- ===== OST cylinders (right column) ===== -->
  <!-- OST-1 -->
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.2">
    <ellipse cx="565" cy="120" rx="32" ry="10"/>
    <rect x="533" y="120" width="64" height="26"/>
    <ellipse cx="565" cy="146" rx="32" ry="10"/>
  </g>
  <text x="565" y="137" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">OST-1</text>

  <!-- OST-2 -->
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.2">
    <ellipse cx="565" cy="180" rx="32" ry="10"/>
    <rect x="533" y="180" width="64" height="26"/>
    <ellipse cx="565" cy="206" rx="32" ry="10"/>
  </g>
  <text x="565" y="197" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">OST-2</text>

  <!-- OST-3 -->
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.2">
    <ellipse cx="565" cy="240" rx="32" ry="10"/>
    <rect x="533" y="240" width="64" height="26"/>
    <ellipse cx="565" cy="266" rx="32" ry="10"/>
  </g>
  <text x="565" y="257" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">OST-3</text>

  <!-- OST ellipsis -->
  <text x="565" y="296" text-anchor="middle" font-size="14" fill="#94a3b8">⋮</text>

  <!-- OST-N -->
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.2">
    <ellipse cx="565" cy="320" rx="32" ry="10"/>
    <rect x="533" y="320" width="64" height="26"/>
    <ellipse cx="565" cy="346" rx="32" ry="10"/>
  </g>
  <text x="565" y="337" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">OST-N</text>

  <!-- OSS → OST direct attach lines -->
  <line x1="400" y1="133" x2="533" y2="133" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <line x1="400" y1="193" x2="533" y2="193" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <line x1="400" y1="253" x2="533" y2="253" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <line x1="400" y1="333" x2="533" y2="333" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>

  <!-- Key annotation cards at bottom -->
  <g>
    <!-- Path Distinction Card -->
    <rect x="30" y="380" width="280" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="45" y1="394" x2="65" y2="394" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="75" y="397" font-size="8.5" font-weight="600" fill="#6d28d9">Metadata Path (MDS / MDT)</text>
    <line x1="45" y1="410" x2="65" y2="410" stroke="#16a34a" stroke-width="1.5"/>
    <text x="75" y="413" font-size="8.5" font-weight="600" fill="#15803d">Data Path (OSS / OST, Parallel I/O)</text>

    <!-- File Striping Card -->
    <rect x="370" y="380" width="280" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="510" y="396" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">File Striping</text>
    <text x="510" y="412" text-anchor="middle" font-size="8.5" fill="#475569">4 GB shard striped across 100 OSTs × 40 MB stripes</text>
  </g>

</svg>