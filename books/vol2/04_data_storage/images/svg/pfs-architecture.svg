<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Lustre-style parallel file system. Violet: metadata path (one lookup).
       Green: data path through a shared fabric to every OSS. Each OST holds every Nth stripe of one file
       (round-robin), so a client reads stripes 0..N-1 from N servers at once. -->
