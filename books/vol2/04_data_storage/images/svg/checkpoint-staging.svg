<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="100%" height="100%">
  <rect width="740" height="380" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- ===== Vertical marker: training pause zone ===== -->
  <rect x="175" y="25" width="50" height="180" fill="#FEE2E2" opacity="0.3"/>
  <line x1="175" y1="25" x2="175" y2="205" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="225" y1="25" x2="225" y2="205" stroke="#16A34A" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="200" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#DC2626">pause</text>

  <!-- ===== ROW 1: GPU HBM (training state) ===== -->
  <text x="100" y="49" text-anchor="end" font-size="9" font-weight="700" fill="#1E293B">GPU HBM</text>
  <text x="100" y="63" text-anchor="end" font-size="7.5" fill="#64748B">Training</text>

  <!-- HBM: training block before t=0 -->
  <rect x="115" y="35" width="60" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="145" y="59" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F407A">Training</text>

  <!-- HBM: snapshot at t=0 (brief pause) -->
  <rect x="175" y="35" width="50" height="40" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="200" y="51" text-anchor="middle" font-size="8" font-weight="700" fill="#DC2626">snapshot</text>
  <text x="200" y="63" text-anchor="middle" font-size="7.5" fill="#64748B">to DRAM</text>

  <!-- HBM: resumes training -->
  <rect x="225" y="35" width="475" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="462" y="59" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F407A">Training resumes immediately ↗</text>

  <!-- ===== ROW 2: Local NVMe ===== -->
  <text x="100" y="109" text-anchor="end" font-size="9" font-weight="700" fill="#1E293B">Local NVMe</text>
  <text x="100" y="123" text-anchor="end" font-size="7.5" fill="#64748B">Fast write</text>

  <!-- NVMe: empty before checkpoint -->
  <rect x="115" y="95" width="60" height="40" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="145" y="119" text-anchor="middle" font-size="8" fill="#94A3B8">idle</text>

  <!-- NVMe write (t=0 to t=0.3s) -->
  <rect x="175" y="95" width="50" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="200" y="105" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">WRITE</text>
  <text x="200" y="117" text-anchor="middle" font-size="7.5" fill="#475569">14 GB/s</text>
  <text x="200" y="129" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1F407A">~0.3 s</text>

  <!-- NVMe: holds checkpoint data -->
  <rect x="225" y="95" width="325" height="40" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="387" y="119" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">checkpoint shard held locally (durable)</text>

  <!-- NVMe: data cleared after PFS confirms -->
  <rect x="550" y="95" width="150" height="40" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="625" y="119" text-anchor="middle" font-size="8" fill="#94A3B8">can be cleared</text>

  <!-- ===== ROW 3: Parallel FS ===== -->
  <text x="100" y="169" text-anchor="end" font-size="9" font-weight="700" fill="#1E293B">Parallel FS</text>
  <text x="100" y="183" text-anchor="end" font-size="7.5" fill="#64748B">Async copy</text>

  <!-- PFS: idle before local write done -->
  <rect x="115" y="155" width="110" height="40" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="170" y="179" text-anchor="middle" font-size="8" fill="#94A3B8">idle</text>

  <!-- PFS: async background copy -->
  <rect x="225" y="155" width="325" height="40" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="387" y="172" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">async background upload (minutes)</text>
  <text x="387" y="185" text-anchor="middle" font-size="7.5" fill="#78350F">3.9 GB/s per node · 4 GB shard ≈ ~1 s upload</text>

  <!-- PFS: done -->
  <rect x="550" y="155" width="150" height="40" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="625" y="172" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">durable</text>
  <text x="625" y="185" text-anchor="middle" font-size="7.5" fill="#15803D">checkpoint safe</text>

  <!-- ===== Key annotation box ===== -->
  <rect x="115" y="215" width="585" height="58" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="407" y="233" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F172A">Key insight: T_save = T_local ≈ 0.3 s (not T_PFS ≈ minutes)</text>
  <text x="407" y="248" text-anchor="middle" font-size="8.5" fill="#475569">Training resumes after local NVMe write. Durability (PFS copy) happens asynchronously.</text>
  <text x="407" y="261" text-anchor="middle" font-size="8.5" fill="#475569">At 10-min interval: 0.3 s pause / 600 s step = 0.05% overhead vs. 10+ s for direct PFS write.</text>

  <!-- ===== Timeline axis ===== -->
  <line x1="115" y1="315" x2="700" y2="315" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="407" y="335" text-anchor="middle" font-size="9" font-weight="600" fill="#64748B">Time →</text>

  <!-- Tick marks mapped correctly to event edges -->
  <line x1="115" y1="315" x2="115" y2="325" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="115" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">t = 0</text>
  <text x="115" y="352" text-anchor="middle" font-size="7.5" fill="#64748B">Ckpt trigger</text>

  <line x1="225" y1="315" x2="225" y2="325" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="225" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">t ≈ 0.3 s</text>
  <text x="225" y="352" text-anchor="middle" font-size="7.5" fill="#64748B">Local write done</text>

  <line x1="550" y1="315" x2="550" y2="325" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="550" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">t ≈ minutes</text>
  <text x="550" y="352" text-anchor="middle" font-size="7.5" fill="#64748B">PFS copy done</text>

  <line x1="680" y1="315" x2="680" y2="325" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="680" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">t = 10 min</text>
  <text x="680" y="352" text-anchor="middle" font-size="7.5" fill="#64748B">Next checkpoint</text>

  <!-- ===== Arrows showing data flow ===== -->
  <!-- HBM → NVMe arrow (fast, vertical) -->
  <line x1="200" y1="75" x2="200" y2="95" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- NVMe → PFS arrow (async, vertical) -->
  <line x1="387" y1="135" x2="387" y2="155" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
</svg>