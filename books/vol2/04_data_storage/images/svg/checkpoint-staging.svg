<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Two-phase (tiered) checkpoint staging, schematic: no measured durations.
       Lanes: training, local NVMe, parallel file system, coordinator.
       t0 trigger, t1 local shards complete (training resumes),
       t2 every shard durable on PFS, t3 manifest published (generation committed). -->
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="680" height="386" fill="#ffffff"/>
  <line x1="190" y1="12" x2="190" y2="268" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="270" y1="12" x2="270" y2="268" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="144" x2="480" y2="268" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="570" y1="82" x2="570" y2="268" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="116" y="39" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">Training</text>
  <text x="116" y="55" text-anchor="end" font-size="11.5" fill="#64748b">accelerators</text>
  <text x="116" y="101" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">Local NVMe</text>
  <text x="116" y="117" text-anchor="end" font-size="11.5" fill="#64748b">per node</text>
  <text x="116" y="163" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">Parallel FS</text>
  <text x="116" y="179" text-anchor="end" font-size="11.5" fill="#64748b">shared</text>
  <text x="116" y="225" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">Coordinator</text>
  <text x="116" y="241" text-anchor="end" font-size="11.5" fill="#64748b">manifest</text>
  <rect x="130" y="20" width="60" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="160.0" y="47" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">step <tspan font-style="italic">i</tspan></text>
  <rect x="190" y="20" width="80" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="230.0" y="39" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c"><tspan font-style="italic">T</tspan><tspan font-size="9.5" dy="3">write</tspan></text>
  <text x="230.0" y="55" text-anchor="middle" font-size="11.5" fill="#b91c1c">paused</text>
  <rect x="270" y="20" width="390" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="465.0" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Training continues on live state</text>
  <rect x="190" y="82" width="80" height="44" rx="3" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="230.0" y="101" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">write</text>
  <text x="230.0" y="117" text-anchor="middle" font-size="11.5" fill="#ffffff">shard</text>
  <rect x="270" y="82" width="300" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420.0" y="101" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Shard staged locally</text>
  <text x="420.0" y="117" text-anchor="middle" font-size="11.5" fill="#475569">lost if this node fails</text>
  <rect x="570" y="82" width="90" height="44" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="615.0" y="109" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">can be cleared</text>
  <rect x="270" y="144" width="210" height="44" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="375.0" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Async copy to PFS</text>
  <text x="375.0" y="179" text-anchor="middle" font-size="11.5" fill="#475569">overlaps training</text>
  <rect x="480" y="144" width="180" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570.0" y="171" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Durable shard copies</text>
  <line x1="294" y1="126" x2="294" y2="143" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="270" y="206" width="210" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="375.0" y="233" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">wait for every rank&#8217;s shard</text>
  <rect x="480" y="206" width="90" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="525.0" y="225" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">verify</text>
  <text x="525.0" y="241" text-anchor="middle" font-size="11.5" fill="#6d28d9">checksums</text>
  <rect x="570" y="206" width="90" height="44" rx="3" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="615.0" y="225" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">publish</text>
  <text x="615.0" y="241" text-anchor="middle" font-size="11.5" fill="#ffffff">manifest last</text>
  <line x1="130" y1="272" x2="652" y2="272" stroke="#64748b" stroke-width="1.2"/>
  <path d="M652,268 L660,272 L652,276 Z" fill="#64748b"/>
  <line x1="190" y1="268" x2="190" y2="276" stroke="#64748b" stroke-width="1.2"/>
  <text x="190" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a"><tspan font-style="italic">t</tspan><tspan font-size="9.5" dy="3">0</tspan></text>
  <text x="190" y="309" text-anchor="middle" font-size="11.5" fill="#475569">trigger</text>
  <line x1="270" y1="268" x2="270" y2="276" stroke="#64748b" stroke-width="1.2"/>
  <text x="270" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a"><tspan font-style="italic">t</tspan><tspan font-size="9.5" dy="3">1</tspan></text>
  <text x="270" y="309" text-anchor="middle" font-size="11.5" fill="#475569">resume</text>
  <line x1="480" y1="268" x2="480" y2="276" stroke="#64748b" stroke-width="1.2"/>
  <text x="480" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a"><tspan font-style="italic">t</tspan><tspan font-size="9.5" dy="3">2</tspan></text>
  <text x="480" y="309" text-anchor="middle" font-size="11.5" fill="#475569">all shards on PFS</text>
  <line x1="570" y1="268" x2="570" y2="276" stroke="#64748b" stroke-width="1.2"/>
  <text x="570" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a"><tspan font-style="italic">t</tspan><tspan font-size="9.5" dy="3">3</tspan></text>
  <text x="570" y="309" text-anchor="middle" font-size="11.5" fill="#475569">committed</text>
  <path d="M270,322 V328 H567 V322" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="420.0" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Staged, not restorable</text>
  <text x="420.0" y="362" text-anchor="middle" font-size="11.5" fill="#475569">previous generation is the restore point</text>
  <path d="M573,322 V328 H660 V322" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <text x="615.0" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Restorable</text>
</svg>
