<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316">
  <!-- Two-phase (tiered) checkpoint staging, schematic: no measured durations.
       Lanes: training, local NVMe, parallel file system, coordinator.
       t0 trigger, t1 local shards complete (training resumes),
       t2 every shard durable on PFS, t3 manifest published (generation committed). -->
  <rect width="680" height="316" fill="#ffffff"/>

  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Event guides -->
  <line x1="190" y1="14" x2="190" y2="232" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="250" y1="14" x2="250" y2="232" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="470" y1="120" x2="470" y2="232" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="560" y1="120" x2="560" y2="232" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Lane labels -->
  <text x="120" y="37" text-anchor="end" font-size="9.5" font-weight="700" fill="#0f172a">Training</text>
  <text x="120" y="50" text-anchor="end" font-size="8" fill="#64748b">accelerators</text>
  <text x="120" y="89" text-anchor="end" font-size="9.5" font-weight="700" fill="#0f172a">Local NVMe</text>
  <text x="120" y="102" text-anchor="end" font-size="8" fill="#64748b">per node</text>
  <text x="120" y="141" text-anchor="end" font-size="9.5" font-weight="700" fill="#0f172a">Parallel FS</text>
  <text x="120" y="154" text-anchor="end" font-size="8" fill="#64748b">shared</text>
  <text x="120" y="193" text-anchor="end" font-size="9.5" font-weight="700" fill="#0f172a">Coordinator</text>
  <text x="120" y="206" text-anchor="end" font-size="8" fill="#64748b">manifest</text>

  <!-- Lane 1: training -->
  <rect x="135" y="22" width="55" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="162.5" y="44" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">step i</text>
  <rect x="190" y="22" width="60" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="220" y="38" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c"><tspan font-style="italic">T</tspan><tspan font-size="7" dy="2">write</tspan></text>
  <text x="220" y="51" text-anchor="middle" font-size="8" fill="#b91c1c">paused</text>
  <rect x="250" y="22" width="410" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="455" y="44" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">Training continues on live state</text>

  <!-- Lane 2: local NVMe -->
  <rect x="190" y="74" width="60" height="36" rx="2" fill="#16a34a" stroke="#15803d" stroke-width="1.2"/>
  <text x="220" y="90" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">write</text>
  <text x="220" y="102" text-anchor="middle" font-size="8" fill="#ffffff">shard</text>
  <rect x="250" y="74" width="310" height="36" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="405" y="96" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Shard staged locally (lost if this node fails)</text>
  <rect x="560" y="74" width="100" height="36" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="610" y="96" text-anchor="middle" font-size="8" fill="#64748b">can be cleared</text>

  <!-- NVMe -> PFS background copy -->
  <line x1="270" y1="111" x2="270" y2="122" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>

  <!-- Lane 3: parallel file system -->
  <rect x="250" y="126" width="220" height="36" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="360" y="141" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Async copy to PFS</text>
  <text x="360" y="154" text-anchor="middle" font-size="8" fill="#475569">overlaps training</text>
  <rect x="470" y="126" width="190" height="36" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="565" y="148" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Durable shard copies</text>

  <!-- Lane 4: coordinator -->
  <rect x="250" y="178" width="220" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="360" y="200" text-anchor="middle" font-size="8" fill="#475569">wait for every rank's shard</text>
  <rect x="470" y="178" width="90" height="36" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="515" y="194" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">verify</text>
  <text x="515" y="206" text-anchor="middle" font-size="8" fill="#6d28d9">checksums</text>
  <rect x="560" y="178" width="100" height="36" rx="2" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="610" y="194" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">publish</text>
  <text x="610" y="206" text-anchor="middle" font-size="8" fill="#ffffff">manifest last</text>

  <!-- Time axis -->
  <line x1="135" y1="240" x2="652" y2="240" stroke="#64748b" stroke-width="1.2"/>
  <path d="M652,236 L660,240 L652,244 Z" fill="#64748b"/>
  <line x1="190" y1="236" x2="190" y2="244" stroke="#64748b" stroke-width="1.2"/>
  <line x1="250" y1="236" x2="250" y2="244" stroke="#64748b" stroke-width="1.2"/>
  <line x1="470" y1="236" x2="470" y2="244" stroke="#64748b" stroke-width="1.2"/>
  <line x1="560" y1="236" x2="560" y2="244" stroke="#64748b" stroke-width="1.2"/>
  <text x="190" y="257" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">t₀</text>
  <text x="190" y="268" text-anchor="middle" font-size="8" fill="#475569">trigger</text>
  <text x="250" y="257" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">t₁</text>
  <text x="250" y="268" text-anchor="middle" font-size="8" fill="#475569">resume</text>
  <text x="470" y="257" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">t₂</text>
  <text x="470" y="268" text-anchor="middle" font-size="8" fill="#475569">all shards on PFS</text>
  <text x="560" y="257" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">t₃</text>
  <text x="560" y="268" text-anchor="middle" font-size="8" fill="#475569">committed</text>

  <!-- Generation state brackets -->
  <path d="M250,284 L250,290 L558,290 L558,284" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="404" y="304" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Staged, not restorable: previous generation is the restore point</text>
  <path d="M562,284 L562,290 L660,290 L660,284" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <text x="611" y="304" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Restorable</text>
</svg>
