<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#ffffff"/>

  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-red-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== Log-scale axis ===== -->
  <text x="420" y="18" text-anchor="middle" font-size="8.5" font-weight="600" fill="#64748b">Bandwidth (GB/s, Log Scale)</text>

  <!-- Axis line -->
  <line x1="220" y1="28" x2="620" y2="28" stroke="#cbd5e1" stroke-width="1"/>
  
  <line x1="220" y1="24" x2="220" y2="32" stroke="#94a3b8" stroke-width="1"/>
  <text x="220" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">0.001</text>

  <line x1="277" y1="24" x2="277" y2="32" stroke="#94a3b8" stroke-width="1"/>
  <text x="277" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">0.01</text>

  <line x1="334" y1="24" x2="334" y2="32" stroke="#94a3b8" stroke-width="1"/>
  <text x="334" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">0.1</text>

  <line x1="391" y1="24" x2="391" y2="32" stroke="#94a3b8" stroke-width="1"/>
  <text x="391" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">1</text>

  <line x1="449" y1="24" x2="449" y2="32" stroke="#94a3b8" stroke-width="1"/>
  <text x="449" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">10</text>

  <line x1="506" y1="24" x2="506" y2="32" stroke="#94a3b8" stroke-width="1"/>
  <text x="506" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">100</text>

  <line x1="563" y1="24" x2="563" y2="32" stroke="#94a3b8" stroke-width="1"/>
  <text x="563" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">1,000</text>

  <line x1="620" y1="24" x2="620" y2="32" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">10,000</text>

  <!-- ===== Horizontal bar chart rows ===== -->
  <!-- ── Row 1: GPU HBM ── -->
  <rect x="60" y="58" width="140" height="30" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="130" y="71" text-anchor="middle" font-size="9" font-weight="700" fill="#14294E">GPU HBM3e</text>
  <text x="130" y="82" text-anchor="middle" font-size="7.5" fill="#475569">On-chip DRAM</text>

  <rect x="220" y="58" width="373" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="603" y="77" text-anchor="start" font-size="9.5" font-weight="700" fill="#1F407A">3,350 GB/s</text>

  <!-- ── Row 2: NVLink ── -->
  <rect x="60" y="98" width="140" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="130" y="111" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">NVLink Fabric</text>
  <text x="130" y="122" text-anchor="middle" font-size="7.5" fill="#475569">GPU-to-GPU mesh</text>

  <rect x="220" y="98" width="340" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="570" y="117" text-anchor="start" font-size="9.5" font-weight="700" fill="#16a34a">900 GB/s</text>

  <!-- ── Row 3: Local NVMe ── -->
  <rect x="60" y="138" width="140" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="130" y="151" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">Local NVMe</text>
  <text x="130" y="162" text-anchor="middle" font-size="7.5" fill="#475569">PCIe Gen5 SSD</text>

  <rect x="220" y="138" width="219" height="30" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="449" y="157" text-anchor="start" font-size="9.5" font-weight="700" fill="#d97706">7–14 GB/s</text>

  <!-- ── Row 4: Parallel File System ── -->
  <rect x="60" y="178" width="140" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="130" y="191" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">Parallel FS</text>
  <text x="130" y="202" text-anchor="middle" font-size="7.5" fill="#475569">Lustre / GPFS / DAOS</text>

  <rect x="220" y="178" width="171" height="30" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="401" y="197" text-anchor="start" font-size="9.5" font-weight="700" fill="#d97706">1–4 GB/s</text>

  <!-- ── Row 5: Object Storage ── -->
  <rect x="60" y="218" width="140" height="30" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="130" y="231" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">Object Storage</text>
  <text x="130" y="242" text-anchor="middle" font-size="7.5" fill="#475569">S3 / GCS cloud</text>

  <rect x="220" y="218" width="114" height="30" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="344" y="237" text-anchor="start" font-size="9.5" font-weight="700" fill="#dc2626">0.1 GB/s</text>

  <!-- ===== 250,000x gap annotation ===== -->
  <line x1="334" y1="275" x2="593" y2="275" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" marker-start="url(#arrow-red-rev)"/>
  <rect x="400" y="265" width="130" height="20" rx="3" fill="#dc2626"/>
  <text x="465" y="278.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">250,000× gap</text>
  <line x1="334" y1="250" x2="334" y2="275" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="593" y1="90" x2="593" y2="275" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- ===== Legend: color key ===== -->
  <g transform="translate(60, 310)">
    <rect x="0" y="0" width="560" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <rect x="16" y="12" width="18" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="40" y="24.5" font-size="8" font-weight="600" fill="#14294E">On-Chip / Interconnect</text>
    
    <rect x="156" y="12" width="18" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="180" y="24.5" font-size="8" font-weight="600" fill="#15803d">GPU Fabric</text>
    
    <rect x="260" y="12" width="18" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="284" y="24.5" font-size="8" font-weight="600" fill="#b45309">Node / Cluster Storage</text>
    
    <rect x="420" y="12" width="18" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="444" y="24.5" font-size="8" font-weight="600" fill="#b91c1c">Cloud Object Storage</text>
  </g>
</svg>