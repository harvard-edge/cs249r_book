<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base (no outer stroke) -->
  <rect width="1200" height="440" fill="#ffffff"/>

  <!-- ===== Chart Area ===== -->
  <rect x="90" y="25" width="960" height="320" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Y-axis gridlines and labels -->
  <!-- 100% -->
  <line x1="90" y1="25" x2="1050" y2="25" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="80" y="25" text-anchor="end" font-size="8.5" fill="#475569" dominant-baseline="central">100%</text>

  <!-- 80% -->
  <line x1="90" y1="89" x2="1050" y2="89" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="80" y="89" text-anchor="end" font-size="8.5" fill="#475569" dominant-baseline="central">80%</text>

  <!-- 60% -->
  <line x1="90" y1="153" x2="1050" y2="153" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="80" y="153" text-anchor="end" font-size="8.5" fill="#475569" dominant-baseline="central">60%</text>

  <!-- 40% -->
  <line x1="90" y1="217" x2="1050" y2="217" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="80" y="217" text-anchor="end" font-size="8.5" fill="#475569" dominant-baseline="central">40%</text>

  <!-- 20% -->
  <line x1="90" y1="281" x2="1050" y2="281" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="80" y="281" text-anchor="end" font-size="8.5" fill="#475569" dominant-baseline="central">20%</text>

  <!-- 0% Baseline -->
  <line x1="90" y1="345" x2="1050" y2="345" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="80" y="345" text-anchor="end" font-size="8.5" fill="#475569" dominant-baseline="central">0%</text>

  <!-- X-axis Ticks & Labels (Log Scale: 1, 10, 100, 1000, 10000) -->
  <line x1="90" y1="345" x2="90" y2="352" stroke="#64748b" stroke-width="1"/>
  <text x="90" y="366" text-anchor="middle" font-size="9" fill="#0f172a">1</text>

  <line x1="330" y1="345" x2="330" y2="352" stroke="#64748b" stroke-width="1"/>
  <text x="330" y="366" text-anchor="middle" font-size="9" fill="#0f172a">10</text>

  <line x1="570" y1="345" x2="570" y2="352" stroke="#64748b" stroke-width="1"/>
  <text x="570" y="366" text-anchor="middle" font-size="9" fill="#0f172a">100</text>

  <line x1="810" y1="345" x2="810" y2="352" stroke="#64748b" stroke-width="1"/>
  <text x="810" y="366" text-anchor="middle" font-size="9" fill="#0f172a">1,000</text>

  <line x1="1050" y1="345" x2="1050" y2="352" stroke="#64748b" stroke-width="1"/>
  <text x="1050" y="366" text-anchor="middle" font-size="9" fill="#0f172a">10,000</text>

  <!-- X-axis label -->
  <text x="570" y="396" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Fleet Size (Nodes / Accelerators) — Log Scale</text>

  <!-- Y-axis label -->
  <text x="25" y="185" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" transform="rotate(-90, 25, 185)">Fleet Availability A = r<tspan baseline-shift="super" font-size="7.5">N</tspan> (%)</text>

  <!-- Vertical reference line at N=1000 -->
  <line x1="810" y1="25" x2="810" y2="345" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="802" y="38" text-anchor="end" font-size="8" fill="#64748b" font-style="italic">N = 1,000</text>

  <!-- Danger Shading Zone for N >= 1,000 under 99.9% -->
  <polygon points="810,345 810,227.6 1050,345" fill="#fee2e2" fill-opacity="0.5"/>

  <!-- Curve 1: 99.9% per-node (drops steeply to near zero at 10k) -->
  <!-- y = 25 + (1 - 0.999^N)*320 -->
  <!-- N=1: 25.3, N=10: 28.2, N=100: 55.4, N=1000: 227.6, N=10000: 344.9 -->
  <polyline points="90,25.3 330,28.2 570,55.4 810,227.6 1050,344.9" fill="none" stroke="#0284c7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Curve 2: 99.99% per-node (drops slower) -->
  <!-- N=1: 25.0, N=10: 25.3, N=100: 28.2, N=1000: 55.4, N=10000: 227.6 -->
  <polyline points="90,25.0 330,25.3 570,28.2 810,55.4 1050,227.6" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Markers & Callouts -->
  <!-- Point 1: 99.9% at N=1000 -->
  <circle cx="810" cy="227.6" r="4.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="680" y="208" width="115" height="38" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="737" y="222" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">99.9% / Node</text>
  <text x="737" y="236" text-anchor="middle" font-size="8" fill="#475569">N=1,000 → 36.8% Fleet</text>
  <line x1="795" y1="227.6" x2="805" y2="227.6" stroke="#0284c7" stroke-width="1"/>

  <!-- Point 2: 99.9% at N=10,000 (Collapse!) -->
  <circle cx="1050" cy="344.9" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="1068" y="325" width="120" height="38" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="1128" y="339" text-anchor="middle" font-size="8.5" font-weight="700" fill="#dc2626">N=10,000 Collapse</text>
  <text x="1128" y="353" text-anchor="middle" font-size="8" font-weight="600" fill="#dc2626">99.9% → 0.0045%</text>
  <line x1="1055" y1="344.9" x2="1068" y2="344.9" stroke="#dc2626" stroke-width="1"/>

  <!-- Point 3: 99.99% at N=10,000 (36.8%) -->
  <circle cx="1050" cy="227.6" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="1068" y="208" width="120" height="38" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="1128" y="222" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">99.99% / Node</text>
  <text x="1128" y="236" text-anchor="middle" font-size="8" fill="#475569">N=10,000 → 36.8% Fleet</text>
  <line x1="1055" y1="227.6" x2="1068" y2="227.6" stroke="#16a34a" stroke-width="1"/>

  <!-- Legend -->
  <g>
    <rect x="110" y="40" width="230" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="125" y1="56" x2="155" y2="56" stroke="#16a34a" stroke-width="2.4"/>
    <circle cx="140" cy="56" r="3.5" fill="#16a34a"/>
    <text x="165" y="60" font-size="8.5" font-weight="600" fill="#0f172a">99.99% per-node reliability (r = 0.9999)</text>

    <line x1="125" y1="78" x2="155" y2="78" stroke="#0284c7" stroke-width="2.4"/>
    <circle cx="140" cy="78" r="3.5" fill="#0284c7"/>
    <text x="165" y="82" font-size="8.5" font-weight="600" fill="#0f172a">99.9% per-node reliability (r = 0.999)</text>
  </g>

  <!-- Bottom Footnote -->
  <line x1="120" y1="418" x2="1080" y2="418" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="433" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">Even four-nines per-node hardware availability collapses to near zero fleet uptime at 10,000-accelerator scale.</text>
</svg>
