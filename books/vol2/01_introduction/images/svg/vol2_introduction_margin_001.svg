<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="156" fill="#ffffff"/>
  <!-- baseline -->
  <line x1="4" y1="18" x2="4" y2="150" stroke="#cccccc" stroke-width="1"/>
  <!-- FP32 gradient: memory blue -->
  <text x="5" y="14" font-size="13" fill="#333333">Gradient (FP32)</text>
  <rect x="4" y="20" width="80" height="26" fill="#006395" fill-opacity="0.92"/>
  <text x="79" y="38" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="end">700 GB</text>
  <!-- Ring traffic FP32: network violet, 2x -->
  <text x="5" y="66" font-size="13" fill="#333333">Ring traffic, FP32</text>
  <rect x="4" y="72" width="160" height="26" fill="#7E317B" fill-opacity="0.92"/>
  <!-- 1x mark inside the 2x bar: one gradient length -->
  <line x1="84" y1="72" x2="84" y2="98" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2.5"/>
  <text x="158" y="90" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="end">≈ 2×</text>
  <!-- Ring traffic FP16: network violet, 1x -->
  <text x="5" y="118" font-size="13" fill="#333333">Ring traffic, FP16</text>
  <rect x="4" y="124" width="80" height="26" fill="#7E317B" fill-opacity="0.92"/>
  <text x="79" y="142" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="end">≈ 1×</text>
</svg>
