<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="158" fill="#ffffff"/>
  <!-- axes -->
  <line x1="24" y1="8" x2="24" y2="128" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="24" y1="128" x2="176" y2="128" stroke="#cccccc" stroke-width="1.5"/>
  <!-- fabric balance threshold (bandwidth wall) -->
  <line x1="100" y1="8" x2="100" y2="128" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="95" y="22" font-size="13" fill="#DC2626" text-anchor="end">Fabric</text>
  <text x="95" y="37" font-size="13" fill="#DC2626" text-anchor="end">balance</text>
  <!-- step time: flat while compute-bound, then linear past the balance point -->
  <polyline points="26,104 100,104 172,22" fill="none" stroke="#333333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100" cy="104" r="5" fill="#DC2626"/>
  <!-- axis labels -->
  <text x="100" y="148" font-size="13" fill="#333333" text-anchor="middle">CI (bytes/op)</text>
  <text x="0" y="0" font-size="13" fill="#333333" text-anchor="middle" transform="translate(16 68) rotate(-90)">Step time</text>
</svg>
