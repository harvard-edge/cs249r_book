<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="180" height="168" fill="#ffffff"/>
  <!-- fan: one straggler holds every synchronous peer -->
  <g stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arr-red)">
    <line x1="44" y1="70" x2="128" y2="18"/>
    <line x1="44" y1="72" x2="127" y2="45"/>
    <line x1="44" y1="74" x2="126" y2="74"/>
    <line x1="44" y1="76" x2="127" y2="103"/>
    <line x1="44" y1="78" x2="128" y2="130"/>
  </g>
  <!-- straggler source -->
  <rect x="14" y="60" width="28" height="28" fill="#DC2626"/>
  <!-- waiting workers (C1 compute) -->
  <g fill="#1F407A">
    <circle cx="140" cy="14" r="9"/>
    <circle cx="140" cy="44" r="9"/>
    <circle cx="140" cy="74" r="9"/>
    <circle cx="140" cy="104" r="9"/>
    <circle cx="140" cy="134" r="9"/>
  </g>
  <text x="28" y="108" font-size="13" fill="#b91c1c" text-anchor="middle">Straggler</text>
  <text x="140" y="162" font-size="13" fill="#14294E" text-anchor="middle">Peers wait</text>
</svg>
