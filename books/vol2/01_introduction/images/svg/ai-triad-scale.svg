<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <desc id="desc">Algorithm, infrastructure, and data connected by bidirectional scale constraints.</desc>
  <defs>
    <style>
      .node-title { font-size: 15px; font-weight: 700; }
      .node-detail { font-size: 11px; fill: #475569; }
      .edge-label { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .edge-pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    </style>
    <marker id="arrow-neutral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-neutral-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="720" height="440" fill="#ffffff"/>

  <!-- Bidirectional Connection Lines -->
  <g stroke="#94a3b8" stroke-width="1.8" fill="none">
    <path d="M316 156 L232 258" marker-start="url(#arrow-neutral-start)" marker-end="url(#arrow-neutral)"/>
    <path d="M404 156 L488 258" marker-start="url(#arrow-neutral-start)" marker-end="url(#arrow-neutral)"/>
    <path d="M268 318 H452" marker-start="url(#arrow-neutral-start)" marker-end="url(#arrow-neutral)"/>
  </g>

  <!-- Node 1: Algorithm (Top, Coordination/Logic) -->
  <g>
    <circle cx="360" cy="116" r="70" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <!-- Neural Network Glyphs -->
    <g stroke="#7c3aed" stroke-width="1.2" fill="#ffffff">
      <circle cx="340" cy="98" r="5"/>
      <circle cx="340" cy="134" r="5"/>
      <circle cx="360" cy="86" r="5"/>
      <circle cx="360" cy="116" r="5"/>
      <circle cx="360" cy="146" r="5"/>
      <circle cx="380" cy="98" r="5"/>
      <circle cx="380" cy="134" r="5"/>
      <path d="M345 98 L355 86 M345 98 L355 116 M345 98 L355 146 M345 134 L355 86 M345 134 L355 116 M345 134 L355 146"/>
      <path d="M365 86 L375 98 M365 86 L375 134 M365 116 L375 98 M365 116 L375 134 M365 146 L375 98 M365 146 L375 134"/>
    </g>
    <text x="360" y="205" text-anchor="middle" class="node-title" fill="#6d28d9">Algorithm</text>
    <text x="360" y="222" text-anchor="middle" class="node-detail">Model architecture, objective, optimization</text>
  </g>

  <!-- Node 2: Infrastructure (Bottom Left, Compute/Fabric) -->
  <g>
    <circle cx="196" cy="318" r="70" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <!-- Server Chassis Glyphs -->
    <g fill="#ffffff" stroke="#0284c7" stroke-width="1.4">
      <rect x="168" y="288" width="56" height="60" rx="3"/>
      <rect x="178" y="298" width="36" height="8" rx="1"/>
      <rect x="178" y="314" width="36" height="8" rx="1"/>
      <rect x="178" y="330" width="36" height="8" rx="1"/>
      <circle cx="185" cy="302" r="1.5" fill="#0284c7"/>
      <circle cx="206" cy="302" r="1.5" fill="#0284c7"/>
      <circle cx="185" cy="318" r="1.5" fill="#0284c7"/>
      <circle cx="206" cy="318" r="1.5" fill="#0284c7"/>
      <circle cx="185" cy="334" r="1.5" fill="#0284c7"/>
      <circle cx="206" cy="334" r="1.5" fill="#0284c7"/>
    </g>
    <text x="196" y="402" text-anchor="middle" class="node-title" fill="#0369a1">Infrastructure</text>
    <text x="196" y="419" text-anchor="middle" class="node-detail">Accelerators, fabrics, memory hierarchy</text>
  </g>

  <!-- Node 3: Data (Bottom Right, Storage) -->
  <g>
    <circle cx="524" cy="318" r="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <!-- Storage Cylinder Glyphs -->
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.4">
      <ellipse cx="524" cy="294" rx="34" ry="10"/>
      <path d="M490 294 V338 C490 344 558 344 558 338 V294"/>
      <ellipse cx="524" cy="316" rx="34" ry="10"/>
      <ellipse cx="524" cy="338" rx="34" ry="10"/>
    </g>
    <text x="524" y="402" text-anchor="middle" class="node-title" fill="#15803d">Data</text>
    <text x="524" y="419" text-anchor="middle" class="node-detail">Token volume, sharding, I/O pipeline</text>
  </g>

  <!-- Edge Constraint Badges (rx=4 micro-radii) -->
  <g>
    <rect x="166" y="200" width="94" height="24" rx="4" class="edge-pill"/>
    <text x="213" y="216" text-anchor="middle" class="edge-label">10<tspan baseline-shift="super" font-size="8">25</tspan> FLOPs</text>
  </g>
  <g>
    <rect x="460" y="200" width="88" height="24" rx="4" class="edge-pill"/>
    <text x="504" y="216" text-anchor="middle" class="edge-label">Petabytes</text>
  </g>
  <g>
    <rect x="305" y="292" width="110" height="24" rx="4" class="edge-pill"/>
    <text x="360" y="308" text-anchor="middle" class="edge-label">25,000 GPUs</text>
  </g>
</svg>
