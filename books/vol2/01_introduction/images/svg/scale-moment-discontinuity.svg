<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 495" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base (no outer stroke) -->
  <rect width="760" height="495" fill="#ffffff"/>

  <!-- ===== Left Panel: Single Machine ===== -->
  <g>
    <!-- Panel background -->
    <rect x="20" y="16" width="345" height="412" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header band -->
    <rect x="20" y="16" width="345" height="28" rx="4" fill="#f1f5f9" stroke="none"/>
    <line x1="20" y1="44" x2="365" y2="44" stroke="#cbd5e1" stroke-width="1"/>
    <text x="192" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Single Machine (Volume I)</text>
    <text x="192" y="58" text-anchor="middle" font-size="8.5" fill="#64748b">1–8 Accelerators · Unified Cache &amp; NVLink</text>

    <!-- Single GPU box -->
    <rect x="132" y="78" width="120" height="56" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="192" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1">GPU / Accelerator</text>
    <text x="192" y="118" text-anchor="middle" font-size="8.5" fill="#475569">Shared HBM · Intra-chassis</text>

    <!-- Data feed arrow -->
    <line x1="192" y1="62" x2="192" y2="78" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Weights / output arrow -->
    <line x1="192" y1="134" x2="192" y2="148" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Local memory box -->
    <rect x="132" y="148" width="120" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="192" y="165" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">Local Memory</text>
    <text x="192" y="179" text-anchor="middle" font-size="8" fill="#475569">HBM3e · SRAM · Host DRAM</text>

    <!-- Constraint box -->
    <rect x="92" y="202" width="200" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="192" y="217" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">Governing Constraint:</text>
    <text x="192" y="229" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0f172a">The Memory Wall (HBM Bandwidth)</text>

    <!-- Characteristics checklist -->
    <g font-size="8.5" fill="#334155">
      <text x="48" y="262">✓  Zero network packet drop or jitter</text>
      <text x="48" y="280">✓  Failures are exceptional rare events</text>
      <text x="48" y="298">✓  Single OS &amp; driver control plane</text>
      <text x="48" y="316">✓  Deterministic synchronous execution</text>
      <text x="48" y="334">✓  Throughput fixed by arithmetic intensity</text>
    </g>

    <!-- Volume I badge -->
    <rect x="112" y="372" width="160" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="192" y="390" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Volume I Foundation</text>
  </g>

  <!-- ===== Center Divider ===== -->
  <line x1="380" y1="20" x2="380" y2="424" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1"/>

  <!-- ===== Right Panel: Fleet Scale ===== -->
  <g>
    <!-- Panel background -->
    <rect x="395" y="16" width="345" height="412" rx="4" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <!-- Header band -->
    <rect x="395" y="16" width="345" height="28" rx="4" fill="#e0f2fe" stroke="none"/>
    <line x1="395" y1="44" x2="740" y2="44" stroke="#0284c7" stroke-width="1"/>
    <text x="567" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">Fleet Scale (Volume II)</text>
    <text x="567" y="58" text-anchor="middle" font-size="8.5" fill="#64748b">Thousands of Nodes · Multi-Tier Fabrics &amp; Schedulers</text>

    <!-- GPU Node Grid (4×3) -->
    <!-- Row 1 -->
    <rect x="415" y="72" width="65" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="447" y="86" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">GPU 0</text>
    <text x="447" y="98" text-anchor="middle" font-size="7" fill="#64748b">Healthy</text>

    <rect x="495" y="72" width="65" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="527" y="86" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">GPU 1</text>
    <text x="527" y="98" text-anchor="middle" font-size="7" fill="#64748b">Healthy</text>

    <rect x="575" y="72" width="65" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="607" y="86" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">GPU 2</text>
    <text x="607" y="98" text-anchor="middle" font-size="7" fill="#64748b">Healthy</text>

    <rect x="655" y="72" width="65" height="34" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="687" y="86" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">GPU 3</text>
    <text x="687" y="98" text-anchor="middle" font-size="7" font-weight="700" fill="#dc2626">FAIL (ECC)</text>

    <!-- Row 2 -->
    <rect x="415" y="116" width="65" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="447" y="130" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">GPU 4</text>
    <text x="447" y="142" text-anchor="middle" font-size="7" fill="#64748b">Healthy</text>

    <rect x="495" y="116" width="65" height="34" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="527" y="130" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">GPU 5</text>
    <text x="527" y="142" text-anchor="middle" font-size="7" font-weight="700" fill="#dc2626">STRAGGLER</text>

    <rect x="575" y="116" width="65" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="607" y="130" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">GPU 6</text>
    <text x="607" y="142" text-anchor="middle" font-size="7" fill="#64748b">Healthy</text>

    <rect x="655" y="116" width="65" height="34" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="687" y="130" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">GPU 7</text>
    <text x="687" y="142" text-anchor="middle" font-size="7" fill="#64748b">Healthy</text>

    <!-- Interconnect Lines (Amber C2) -->
    <g stroke="#d97706" stroke-width="1.2" fill="none">
      <line x1="480" y1="89" x2="495" y2="89" marker-end="url(#arr-amber)"/>
      <line x1="560" y1="89" x2="575" y2="89" marker-end="url(#arr-amber)"/>
      <line x1="640" y1="89" x2="655" y2="89" marker-end="url(#arr-amber)"/>
      <line x1="480" y1="133" x2="495" y2="133" marker-end="url(#arr-amber)"/>
      <line x1="560" y1="133" x2="575" y2="133" marker-end="url(#arr-amber)"/>
      <line x1="640" y1="133" x2="655" y2="133" marker-end="url(#arr-amber)"/>
      <line x1="447" y1="106" x2="447" y2="116" marker-end="url(#arr-amber)"/>
      <line x1="527" y1="106" x2="527" y2="116" marker-end="url(#arr-amber)"/>
      <line x1="607" y1="106" x2="607" y2="116" marker-end="url(#arr-amber)"/>
      <line x1="687" y1="106" x2="687" y2="116" marker-end="url(#arr-amber)"/>
    </g>

    <!-- Challenge 1: Communication Dominance (C2) -->
    <rect x="420" y="165" width="295" height="38" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="567" y="180" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">Communication Dominance (C₂)</text>
    <text x="567" y="194" text-anchor="middle" font-size="8" fill="#475569">Gradient sync: 700 GB/step; fabric jitter bounds throughput</text>

    <!-- Challenge 2: Routine Failure & Stragglers (Faults) -->
    <rect x="420" y="210" width="295" height="38" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="567" y="225" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">Routine Failures &amp; Tail Latency</text>
    <text x="567" y="239" text-anchor="middle" font-size="8" fill="#475569">10,000 GPUs: MTBF drops to hours; straggler holds barrier</text>

    <!-- Challenge 3: Coordination & Schedulers (C3) -->
    <rect x="420" y="255" width="295" height="38" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="567" y="270" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">Coordination &amp; Gang Scheduling (C₃)</text>
    <text x="567" y="284" text-anchor="middle" font-size="8" fill="#475569">Consensus barriers, checkpoint frequency, topology awareness</text>

    <!-- Characteristics checklist -->
    <g font-size="8.5" fill="#334155">
      <text x="425" y="312">⚠  Network contention dictates effective FLOPs</text>
      <text x="425" y="328">⚠  Mean Time Between Failures &lt;&lt; Job runtime</text>
      <text x="425" y="344">⚠  Multi-tenant cluster governance and preemption</text>
    </g>

    <!-- Volume II badge -->
    <rect x="487" y="372" width="160" height="28" rx="4" fill="#0284c7" stroke="none"/>
    <text x="567" y="390" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Volume II Focus: C³ Fleet</text>
  </g>

  <!-- ===== Bottom Takeaway ===== -->
  <line x1="80" y1="450" x2="680" y2="450" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="472" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">Scale changes the fundamental nature of the problem, not merely its magnitude.</text>
</svg>
