<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="310" fill="#ffffff"/>

  <!-- ===== Panel tags ===== -->
  <text x="130" y="28" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Single machine</text>
  <text x="460" y="28" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Fleet</text>
  <line x1="270" y1="20" x2="270" y2="262" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== Left: one node, memory-bound ===== -->
  <rect x="30" y="50" width="200" height="200" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="130" y="72" text-anchor="middle" font-size="12" fill="#475569">one node</text>

  <rect x="60" y="90" width="140" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="130" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Accelerators</text>

  <rect x="60" y="190" width="140" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="130" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">HBM</text>

  <line x1="130" y1="134" x2="130" y2="190" stroke="#1F407A" stroke-width="4"/>
  <text x="140" y="160" font-size="12" font-weight="700" fill="#b91c1c">memory</text>
  <text x="140" y="174" font-size="12" font-weight="700" fill="#b91c1c">wall</text>


  <!-- ===== Right: fleet, C3 colors ===== -->
  <!-- coordination: control plane and the gang it manages -->
  <rect x="370" y="44" width="180" height="32" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="460" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Scheduler &amp; recovery</text>
  <line x1="460" y1="76" x2="460" y2="92" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="300" y="92" width="320" height="176" rx="4" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- compute: top row of nodes -->
  <rect x="316" y="108" width="62" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="392" y="108" width="62" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="468" y="108" width="62" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="544" y="108" width="62" height="36" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="347" y="130" text-anchor="middle" font-size="12" fill="#14294E">node</text>
  <text x="423" y="130" text-anchor="middle" font-size="12" fill="#14294E">node</text>
  <text x="499" y="130" text-anchor="middle" font-size="12" fill="#14294E">node</text>
  <text x="575" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">failed</text>

  <!-- communication: shared fabric -->
  <line x1="347" y1="144" x2="347" y2="168" stroke="#d97706" stroke-width="1.5"/>
  <line x1="423" y1="144" x2="423" y2="168" stroke="#d97706" stroke-width="1.5"/>
  <line x1="499" y1="144" x2="499" y2="168" stroke="#d97706" stroke-width="1.5"/>
  <line x1="575" y1="144" x2="575" y2="168" stroke="#d97706" stroke-width="1.5"/>
  <line x1="347" y1="192" x2="347" y2="216" stroke="#d97706" stroke-width="1.5"/>
  <line x1="423" y1="192" x2="423" y2="216" stroke="#d97706" stroke-width="1.5"/>
  <line x1="499" y1="192" x2="499" y2="216" stroke="#d97706" stroke-width="1.5"/>
  <line x1="575" y1="192" x2="575" y2="216" stroke="#d97706" stroke-width="1.5"/>
  <rect x="316" y="168" width="290" height="24" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="461" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Network fabric</text>

  <!-- compute: bottom row of nodes -->
  <rect x="316" y="216" width="62" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="392" y="216" width="62" height="36" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="468" y="216" width="62" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="544" y="216" width="62" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="347" y="238" text-anchor="middle" font-size="12" fill="#14294E">node</text>
  <text x="423" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">slow</text>
  <text x="499" y="238" text-anchor="middle" font-size="12" fill="#14294E">node</text>
  <text x="575" y="238" text-anchor="middle" font-size="12" fill="#14294E">node</text>

  <!-- where the fleet binds -->
  <text x="630" y="178" font-size="12" font-weight="700" fill="#b91c1c">network</text>
  <text x="630" y="192" font-size="12" font-weight="700" fill="#b91c1c">wall</text>

  <!-- C3 legend along the bottom -->
  <g font-size="12">
    <rect x="170" y="280" width="12" height="12" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="188" y="290" fill="#14294E">Compute (C₁)</text>
    <rect x="290" y="280" width="12" height="12" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="308" y="290" fill="#92400e">Communication (C₂)</text>
    <rect x="450" y="280" width="12" height="12" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="468" y="290" fill="#5b21b6">Coordination (C₃)</text>
  </g>
</svg>
