<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <desc>Two step timelines for the same workload. Doubling the device count halves the compute term, but communication and synchronization do not shrink, so the step falls short of half its original length.</desc>
  <rect width="680" height="320" fill="#ffffff"/>

  <!-- ===== Lane labels (shared by both rows) ===== -->
  <g font-size="12" fill="#475569" text-anchor="end">
    <text x="136" y="56">Compute</text>
    <text x="136" y="88">Network &amp; sync</text>
    <text x="136" y="211">Compute</text>
    <text x="136" y="243">Network &amp; sync</text>
  </g>

  <!-- ===== Row A: N devices ===== -->
  <text x="150" y="24" font-size="13" font-weight="700" fill="#0f172a">N devices</text>
  <!-- overlap band: spans both lanes where transfer runs beneath compute -->
  <rect x="410" y="32" width="70" height="72" fill="#e2e8f0"/>
  <line x1="410" y1="32" x2="410" y2="104" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="480" y1="32" x2="480" y2="104" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- compute lane -->
  <rect x="150" y="40" width="330" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="270" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">T<tspan dy="3" font-size="11">compute</tspan><tspan dy="-3" dx="3">/ N</tspan></text>
  <!-- communication and synchronization lane -->
  <rect x="410" y="72" width="160" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="490" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">T<tspan dy="3" font-size="11">comm</tspan><tspan dy="-3">(N)</tspan></text>
  <rect x="570" y="72" width="60" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="600" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">T<tspan dy="3" font-size="11">sync</tspan></text>
  <!-- overlap label -->
  <text x="445" y="120" text-anchor="middle" font-size="12" fill="#475569">T<tspan dy="3" font-size="11">overlap</tspan></text>
  <!-- step bracket -->
  <path d="M 150 128 V 134 H 630 V 128" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="390" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">T<tspan dy="3" font-size="11">step</tspan><tspan dy="-3">(N)</tspan></text>

  <!-- ===== Row B: 2N devices ===== -->
  <text x="150" y="179" font-size="13" font-weight="700" fill="#0f172a">2N devices</text>
  <!-- ideal half-step reference -->
  <text x="398" y="179" font-size="12" fill="#475569">ideal: half of T<tspan dy="3" font-size="11">step</tspan><tspan dy="-3">(N)</tspan></text>
  <line x1="390" y1="166" x2="390" y2="290" stroke="#334155" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- overlap band -->
  <rect x="270" y="187" width="45" height="72" fill="#e2e8f0"/>
  <line x1="270" y1="187" x2="270" y2="259" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="315" y1="187" x2="315" y2="259" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- compute lane -->
  <rect x="150" y="195" width="165" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="210" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">T<tspan dy="3" font-size="11">compute</tspan><tspan dy="-3" dx="3">/ 2N</tspan></text>
  <!-- communication and synchronization lane -->
  <rect x="270" y="227" width="200" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="370" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">T<tspan dy="3" font-size="11">comm</tspan><tspan dy="-3">(2N)</tspan></text>
  <rect x="470" y="227" width="80" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="510" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">T<tspan dy="3" font-size="11">sync</tspan></text>
  <!-- overlap label -->
  <text x="292" y="275" text-anchor="middle" font-size="12" fill="#475569">T<tspan dy="3" font-size="11">overlap</tspan></text>
  <!-- step bracket -->
  <path d="M 150 283 V 289 H 550 V 283" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="350" y="309" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">T<tspan dy="3" font-size="11">step</tspan><tspan dy="-3">(2N)</tspan></text>
</svg>
