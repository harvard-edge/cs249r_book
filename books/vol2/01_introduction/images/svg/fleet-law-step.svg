<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <desc>Two step timelines for the same workload. Doubling the device count halves the compute term, but communication and synchronization do not shrink, so the step falls short of half its original length.</desc>
  <rect width="600" height="270" fill="#ffffff"/>

  <!-- Lane labels (shared by both rows) -->
  <g font-size="8.5" fill="#475569" text-anchor="end">
    <text x="120" y="51">Compute</text>
    <text x="120" y="79">Network &amp; sync</text>
    <text x="120" y="176">Compute</text>
    <text x="120" y="204">Network &amp; sync</text>
  </g>

  <!-- ============ Row A: N devices ============ -->
  <text x="130" y="26" font-size="10" font-weight="700" fill="#0f172a">N devices</text>
  <!-- overlap band -->
  <rect x="350" y="34" width="80" height="54" fill="#e2e8f0" opacity="0.7"/>
  <!-- compute lane -->
  <rect x="130" y="36" width="300" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="240" y="51" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">T<tspan dy="2.5" font-size="7">compute</tspan><tspan dy="-2.5" dx="2">/ N</tspan></text>
  <!-- comm + sync lane -->
  <rect x="350" y="64" width="160" height="22" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="470" y="79" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">T<tspan dy="2.5" font-size="7">comm</tspan><tspan dy="-2.5">(N)</tspan></text>
  <rect x="510" y="64" width="50" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="535" y="79" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">T<tspan dy="2.5" font-size="7">sync</tspan></text>
  <!-- overlap label -->
  <text x="390" y="100" text-anchor="middle" font-size="8.5" font-style="italic" fill="#475569">T<tspan dy="2.5" font-size="6.5">overlap</tspan></text>
  <!-- step bracket -->
  <path d="M 130 106 V 112 H 560 V 106" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="345" y="126" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">T<tspan dy="2.5" font-size="7">step</tspan><tspan dy="-2.5">(N)</tspan></text>

  <!-- ============ Row B: 2N devices ============ -->
  <text x="130" y="151" font-size="10" font-weight="700" fill="#0f172a">2N devices</text>
  <!-- ideal half-step reference -->
  <line x1="345" y1="155" x2="345" y2="238" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="350" y="151" font-size="8.5" fill="#475569">Ideal: half of T<tspan dy="2.5" font-size="6.5">step</tspan><tspan dy="-2.5">(N)</tspan></text>
  <!-- overlap band -->
  <rect x="240" y="159" width="40" height="54" fill="#e2e8f0" opacity="0.7"/>
  <!-- compute lane -->
  <rect x="130" y="161" width="150" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="185" y="176" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">T<tspan dy="2.5" font-size="7">compute</tspan><tspan dy="-2.5" dx="2">/ 2N</tspan></text>
  <!-- comm + sync lane -->
  <rect x="240" y="189" width="180" height="22" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="360" y="204" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">T<tspan dy="2.5" font-size="7">comm</tspan><tspan dy="-2.5">(2N)</tspan></text>
  <rect x="420" y="189" width="70" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="455" y="204" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">T<tspan dy="2.5" font-size="7">sync</tspan></text>
  <!-- overlap label -->
  <text x="260" y="225" text-anchor="middle" font-size="8.5" font-style="italic" fill="#475569">T<tspan dy="2.5" font-size="6.5">overlap</tspan></text>
  <!-- step bracket -->
  <path d="M 130 231 V 237 H 490 V 231" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="310" y="251" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">T<tspan dy="2.5" font-size="7">step</tspan><tspan dy="-2.5">(2N)</tspan></text>
</svg>
