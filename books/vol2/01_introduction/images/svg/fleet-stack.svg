<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <desc id="desc">Four stacked layers showing the book organization from infrastructure to responsible engineering.</desc>
  <defs>
    <style>
      .layer-title { font-size: 15px; font-weight: 700; }
      .layer-subtitle { font-size: 12px; font-weight: 500; fill: #475569; }
      .side-title { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .side-detail { font-size: 11px; fill: #475569; }
      .note { font-size: 10px; font-style: italic; fill: #64748b; }
    </style>
    <marker id="up-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#ffffff"/>

  <g transform="translate(58 36)">
    <!-- Part I: The Fleet (Compute & Substrate) -->
    <rect x="42" y="238" width="360" height="56" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
    <text x="222" y="261" text-anchor="middle" class="layer-title" fill="#14294E">Part I: The Fleet</text>
    <text x="222" y="279" text-anchor="middle" class="layer-subtitle">Compute, network fabrics, data storage</text>

    <!-- Part II: Distributed ML (Communication & Coordination) -->
    <rect x="10" y="164" width="424" height="56" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="222" y="187" text-anchor="middle" class="layer-title" fill="#b45309">Part II: Distributed ML</text>
    <text x="222" y="205" text-anchor="middle" class="layer-subtitle">Training, collectives, fault tolerance, orchestration</text>

    <!-- Part III: Deployment at Scale (Serving & Systems Ops) -->
    <rect x="54" y="90" width="336" height="56" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="222" y="113" text-anchor="middle" class="layer-title" fill="#6d28d9">Part III: Deployment at Scale</text>
    <text x="222" y="131" text-anchor="middle" class="layer-subtitle">Performance engineering, inference, edge, MLOps</text>

    <!-- Part IV: The Responsible Fleet (Governance & Safety) -->
    <rect x="28" y="16" width="388" height="56" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="222" y="39" text-anchor="middle" class="layer-title" fill="#15803d">Part IV: The Responsible Fleet</text>
    <text x="222" y="57" text-anchor="middle" class="layer-subtitle">Security, robustness, sustainability, responsible AI</text>

    <!-- Flow Arrows Upward -->
    <path d="M222 238 V226" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#up-arrow)"/>
    <path d="M222 164 V152" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#up-arrow)"/>
    <path d="M222 90 V78" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#up-arrow)"/>

    <!-- Right Side Ownership Categories -->
    <g>
      <line x1="416" y1="44" x2="456" y2="44" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="472" y="39" class="side-title">Governance</text>
      <text x="472" y="54" class="side-detail">Security, robustness,</text>
      <text x="472" y="68" class="side-detail">sustainability, responsibility</text>

      <line x1="390" y1="118" x2="456" y2="118" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="472" y="113" class="side-title">Serving</text>
      <text x="472" y="128" class="side-detail">Inference, compilation, edge, ops</text>

      <line x1="434" y1="192" x2="456" y2="192" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="472" y="187" class="side-title">Distribution</text>
      <text x="472" y="202" class="side-detail">Parallelism, consensus, recovery</text>

      <line x1="402" y1="266" x2="456" y2="266" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="472" y="261" class="side-title">Infrastructure</text>
      <text x="472" y="276" class="side-detail">Accelerators, fabrics, I/O pipelines</text>
    </g>
  </g>

  <line x1="86" y1="370" x2="634" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="392" text-anchor="middle" class="note">Engineering decisions at the bottom constrain possibilities at the top.</text>
</svg>
