<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 806 278"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="806" height="278" fill="#ffffff"/>
  <g transform="translate(3,4)">
  <text x="205" y="30" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">MapReduce: independent tasks</text>
  <text x="600" y="30" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Synchronous training: shared step</text>
  <line x1="405" y1="20" x2="405" y2="250" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- ===== Left: map tasks on a time axis ===== -->
  <text x="84" y="84" text-anchor="end" font-size="13" font-weight="400" fill="#475569">Map 1</text>
  <text x="84" y="124" text-anchor="end" font-size="13" font-weight="400" fill="#475569">Map 2</text>
  <text x="84" y="164" text-anchor="end" font-size="13" font-weight="400" fill="#475569">Map 3</text>
  <text x="84" y="206" text-anchor="end" font-size="13" font-weight="400" fill="#475569">Reduce</text>
  <rect x="94" y="68" width="130" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="228" y="74" width="12" height="12" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="254" y="84" text-anchor="start" font-size="13" font-weight="400" fill="#475569">done</text>
  <rect x="94" y="108" width="150" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="248" y="114" width="12" height="12" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="274" y="124" text-anchor="start" font-size="13" font-weight="400" fill="#475569">done</text>
  <rect x="94" y="148" width="56" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="122" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">failed</text>
  <line x1="155" y1="153" x2="169" y2="167" stroke="#dc2626" stroke-width="2"/>
  <line x1="155" y1="167" x2="169" y2="153" stroke="#dc2626" stroke-width="2"/>
  <rect x="176" y="148" width="124" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="238" y="164" text-anchor="middle" font-size="13" font-weight="400" fill="#14294E">re-run alone</text>
  <rect x="304" y="154" width="12" height="12" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M 310 166 V 190" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <rect x="300" y="190" width="80" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="340" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#14294E">reduce</text>
  <line x1="94" y1="236" x2="380" y2="236" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="380" y="252" text-anchor="end" font-size="13" font-weight="400" fill="#475569">time</text>
  <!-- ===== Right: workers meet at the AllReduce barrier ===== -->
  <text x="494" y="84" text-anchor="end" font-size="13" font-weight="400" fill="#475569">Worker 0</text>
  <text x="494" y="124" text-anchor="end" font-size="13" font-weight="400" fill="#475569">Worker 1</text>
  <text x="494" y="164" text-anchor="end" font-size="13" font-weight="400" fill="#475569">Worker 2</text>
  <text x="494" y="206" text-anchor="end" font-size="13" font-weight="400" fill="#475569">Update</text>
  <rect x="664" y="62" width="50" height="114" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="689" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">AllReduce</text>
  <rect x="504" y="68" width="80" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="584" y="68" width="80" height="24" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="624" y="84" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">wait</text>
  <rect x="504" y="108" width="96" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="600" y="108" width="64" height="24" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="632" y="124" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">wait</text>
  <rect x="504" y="148" width="160" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="584" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">slow</text>
  <path d="M 689 176 V 190" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="656" y="190" width="66" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="689" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#14294E">update</text>
  <line x1="504" y1="236" x2="780" y2="236" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="780" y="252" text-anchor="end" font-size="13" font-weight="400" fill="#475569">time</text>
  </g>
</svg>
