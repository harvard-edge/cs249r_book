<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="680" height="280" fill="#ffffff"/>

  <!-- ===== Panel tags ===== -->
  <text x="170" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">MapReduce: independent tasks</text>
  <text x="510" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Synchronous training: shared step</text>
  <line x1="340" y1="16" x2="340" y2="264" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== Left: map tasks finish and retry separately ===== -->
  <rect x="30" y="50" width="120" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="90" y="72" text-anchor="middle" font-size="12" fill="#14294E">Map task 1</text>
  <rect x="30" y="100" width="120" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="90" y="122" text-anchor="middle" font-size="12" fill="#14294E">Map task 2</text>
  <rect x="30" y="150" width="120" height="36" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="90" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Map task 3 failed</text>
  <rect x="30" y="220" width="120" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="90" y="242" text-anchor="middle" font-size="12" fill="#14294E">Task 3, re-run</text>
  <path d="M90,186 V218" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="98" y="207" font-size="11.5" fill="#475569">retry alone</text>

  <rect x="210" y="90" width="110" height="130" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="265" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Intermediate</text>
  <text x="265" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">outputs</text>

  <path d="M150,68 H180 V104 H208" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M150,118 H208" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M150,238 H180 V204 H208" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ===== Right: every gradient must arrive before the update ===== -->
  <rect x="370" y="50" width="120" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="430" y="72" text-anchor="middle" font-size="12" fill="#14294E">Worker 0</text>
  <rect x="370" y="100" width="120" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="430" y="122" text-anchor="middle" font-size="12" fill="#14294E">Worker 1</text>
  <rect x="370" y="150" width="120" height="36" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="430" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Worker 2 slow</text>

  <rect x="550" y="84" width="110" height="68" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="605" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">AllReduce</text>
  <text x="605" y="130" text-anchor="middle" font-size="11.5" fill="#92400e">needs all three</text>

  <path d="M490,68 H520 V100 H548" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M490,118 H548" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M490,168 H520 V136 H548" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="430" y="206" text-anchor="middle" font-size="11.5" fill="#475569">workers 0 and 1 wait</text>

  <rect x="550" y="220" width="110" height="36" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="605" y="242" text-anchor="middle" font-size="12" fill="#14294E">Shared update</text>
  <path d="M605,152 V218" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
</svg>
