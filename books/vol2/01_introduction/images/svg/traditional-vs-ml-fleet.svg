<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 425" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas (No outer border stroke) -->
  <rect width="760" height="425" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: MAPREDUCE (Independent Tasks)                          -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <!-- Outer Card -->
    <rect x="0" y="0" width="350" height="385" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header Band -->
    <path d="M 0,6 Q 0,0 6,0 L 344,0 Q 350,0 350,6 L 350,28 L 0,28 Z" fill="#f8fafc"/>
    <line x1="0" y1="28" x2="350" y2="28" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="9.5" font-weight="700" fill="#0f172a">MapReduce (Retryable Map Tasks)</text>

    <!-- Worker A -->
    <g transform="translate(25, 45)">
      <rect x="0" y="0" width="130" height="38" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="65" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Worker A</text>
      <text x="65" y="28" text-anchor="middle" font-size="8" fill="#475569">Task partition 1</text>
    </g>

    <!-- Worker B -->
    <g transform="translate(25, 100)">
      <rect x="0" y="0" width="130" height="38" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="65" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Worker B</text>
      <text x="65" y="28" text-anchor="middle" font-size="8" fill="#475569">Task partition 2</text>
    </g>

    <!-- Worker C -->
    <g transform="translate(25, 155)">
      <rect x="0" y="0" width="130" height="38" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="65" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Worker C</text>
      <text x="65" y="28" text-anchor="middle" font-size="8" fill="#475569">Task partition 3</text>
    </g>

    <!-- Storage Block -->
    <g transform="translate(195, 195)">
      <rect x="0" y="0" width="130" height="50" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="65" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">Intermediate Outputs</text>
      <text x="65" y="34" text-anchor="middle" font-size="8" fill="#475569">Consumed by reducers</text>
    </g>

    <!-- Data Flow Paths -->
    <path d="M 155 64 L 285 64 L 285 195" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <path d="M 155 119 L 255 119 L 255 195" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <path d="M 155 174 L 225 174 L 225 195" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Summary Box -->
    <g transform="translate(20, 265)">
      <rect x="0" y="0" width="310" height="36" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="155" y="22" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Map tasks can finish and be retried separately</text>
    </g>

    <!-- Property Explanations -->
    <g transform="translate(22, 320)">
      <text x="0" y="0" font-size="8" fill="#334155"><tspan font-weight="600" fill="#15803d">Late finish:</tspan><tspan dx="4" fill="#475569">A and B can finish before C</tspan></text>
      <text x="0" y="15" font-size="8" fill="#334155"><tspan font-weight="600" fill="#15803d">Fault isolation:</tspan><tspan dx="4" fill="#475569">Failed map tasks can be re-executed</tspan></text>
      <text x="0" y="30" font-size="8" fill="#334155"><tspan font-weight="600" fill="#15803d">Scaling:</tspan><tspan dx="4" fill="#475569">Scheduling and shuffle still impose costs</tspan></text>
      <text x="0" y="45" font-size="8" fill="#334155"><tspan font-weight="600" fill="#15803d">Scheduling:</tspan><tspan dx="4" fill="#475569">Reducers require the relevant map outputs</tspan></text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: ML FLEET (Barrier Synchronization)                    -->
  <!-- ================================================================= -->
  <g transform="translate(390, 20)">
    <!-- Outer Card -->
    <rect x="0" y="0" width="350" height="385" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header Band -->
    <path d="M 0,6 Q 0,0 6,0 L 344,0 Q 350,0 350,6 L 350,28 L 0,28 Z" fill="#f8fafc"/>
    <line x1="0" y1="28" x2="350" y2="28" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Synchronous Training (Shared Update)</text>

    <!-- GPU Worker 0 -->
    <g transform="translate(25, 45)">
      <rect x="0" y="0" width="125" height="38" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="62" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">GPU Worker 0</text>
      <text x="62" y="28" text-anchor="middle" font-size="8" fill="#14294E">Gradient: ready ✓</text>
    </g>

    <!-- GPU Worker 1 -->
    <g transform="translate(25, 100)">
      <rect x="0" y="0" width="125" height="38" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="62" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">GPU Worker 1</text>
      <text x="62" y="28" text-anchor="middle" font-size="8" fill="#14294E">Gradient: ready ✓</text>
    </g>

    <!-- GPU Worker 2 (Straggler) -->
    <g transform="translate(25, 155)">
      <rect x="0" y="0" width="125" height="38" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="62" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">GPU Worker 2</text>
      <text x="62" y="28" text-anchor="middle" font-size="8" font-weight="600" fill="#dc2626">Straggler: late gradient</text>
    </g>

    <!-- Wait text annotations -->
    <text x="168" y="60" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b" font-style="italic">WAIT</text>
    <text x="168" y="115" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b" font-style="italic">WAIT</text>

    <!-- AllReduce Block -->
    <g transform="translate(205, 95)">
      <rect x="0" y="0" width="120" height="58" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="60" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">AllReduce</text>
      <text x="60" y="34" text-anchor="middle" font-size="8" fill="#475569">All contributions</text>
      <text x="60" y="46" text-anchor="middle" font-size="8" fill="#475569">needed to finish</text>
    </g>

    <!-- Barrier Arrows -->
    <path d="M 150 64 L 190 64 L 190 106 L 205 106" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M 150 119 L 205 119" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M 150 174 L 190 174 L 190 138 L 205 138" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>

    <!-- Summary Box -->
    <g transform="translate(20, 265)">
      <rect x="0" y="0" width="310" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="155" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">A critical-path straggler delays the shared step</text>
      <text x="155" y="28" text-anchor="middle" font-size="8" fill="#64748b">Penalty depends on overlap and other costs</text>
    </g>

    <!-- Property Explanations -->
    <g transform="translate(22, 320)">
      <text x="0" y="0" font-size="8" fill="#334155"><tspan font-weight="600" fill="#b91c1c">Straggler tax:</tspan><tspan dx="4" fill="#475569">Late contributions delay step completion</tspan></text>
      <text x="0" y="15" font-size="8" fill="#334155"><tspan font-weight="600" fill="#b91c1c">Coupled fate:</tspan><tspan dx="4" fill="#475569">Recovery must restore consistent state</tspan></text>
      <text x="0" y="30" font-size="8" fill="#334155"><tspan font-weight="600" fill="#b91c1c">Scaling tax:</tspan><tspan dx="4" fill="#475569">Collective cost depends on fleet and fabric</tspan></text>
      <text x="0" y="45" font-size="8" fill="#334155"><tspan font-weight="600" fill="#b91c1c">Bandwidth:</tspan><tspan dx="4" fill="#475569">This example reduces gradients each step</tspan></text>
    </g>
  </g>
</svg>
