<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 -8 544 531"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="28" y="-8" width="544" height="531" fill="#ffffff"/>

  <!-- ===== Set regions (fills first, strokes after, so every boundary stays crisp) ===== -->
  <circle cx="300" cy="185" r="165" fill="#1F407A" fill-opacity="0.07"/>
  <circle cx="217.5" cy="327.9" r="165" fill="#d97706" fill-opacity="0.08"/>
  <circle cx="382.5" cy="327.9" r="165" fill="#7c3aed" fill-opacity="0.07"/>
  <circle cx="300" cy="185" r="165" fill="none" stroke="#1F407A" stroke-width="2"/>
  <circle cx="217.5" cy="327.9" r="165" fill="none" stroke="#d97706" stroke-width="2"/>
  <circle cx="382.5" cy="327.9" r="165" fill="none" stroke="#7c3aed" stroke-width="2"/>

  <!-- ===== Pure dimensions ===== -->
  <g text-anchor="middle">
    <text x="300" y="82" font-size="16" font-weight="700" fill="#14294E">Compute (C₁)</text>
    <text x="300" y="102" font-size="12.5" font-style="italic" fill="#334155">node substrate</text>
    <text x="300" y="124" font-size="12.5" fill="#14294E">T<tspan dy="3" font-size="11.5">compute</tspan><tspan dx="3" dy="-3">/ N</tspan></text>

    <text x="138" y="360" font-size="16" font-weight="700" fill="#b45309">Communication</text>
    <text x="138" y="379" font-size="16" font-weight="700" fill="#b45309">(C₂)</text>
    <text x="138" y="399" font-size="12.5" font-style="italic" fill="#334155">network backbone</text>
    <text x="138" y="421" font-size="12.5" fill="#92400e">T<tspan dy="3" font-size="11.5">comm</tspan><tspan dy="-3">(N)</tspan></text>

    <text x="462" y="360" font-size="16" font-weight="700" fill="#6d28d9">Coordination</text>
    <text x="462" y="379" font-size="16" font-weight="700" fill="#6d28d9">(C₃)</text>
    <text x="462" y="399" font-size="12.5" font-style="italic" fill="#334155">orchestration layer</text>
    <text x="462" y="421" font-size="12.5" fill="#5b21b6">T<tspan dy="3" font-size="11.5">sync</tspan><tspan dy="-3">(N)</tspan></text>
  </g>

  <!-- ===== Pairwise intersections ===== -->
  <g text-anchor="middle">
    <text x="197" y="210" font-size="11.5" font-weight="700" fill="#475569">C₁ ∩ C₂</text>
    <text x="197" y="225" font-size="12" fill="#0f172a">Hiding network</text>
    <text x="197" y="240" font-size="12" fill="#0f172a">latency</text>

    <text x="403" y="210" font-size="11.5" font-weight="700" fill="#475569">C₁ ∩ C₃</text>
    <text x="403" y="225" font-size="12" fill="#0f172a">Preserving progress</text>
    <text x="403" y="240" font-size="12" fill="#0f172a">against failure</text>

    <text x="300" y="388" font-size="11.5" font-weight="700" fill="#475569">C₂ ∩ C₃</text>
    <text x="300" y="403" font-size="12" fill="#0f172a">Collective</text>
    <text x="300" y="418" font-size="12" fill="#0f172a">synchronization</text>
  </g>

  <!-- ===== Center: all three ===== -->
  <g text-anchor="middle">
    <rect x="240" y="248" width="120" height="66" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="300" y="266" font-size="11.5" font-weight="700" fill="#475569">C₁ ∩ C₂ ∩ C₃</text>
    <text x="300" y="283" font-size="12.5" font-weight="700" fill="#0f172a">Fleet ML systems</text>
    <text x="300" y="299" font-size="12.5" font-weight="700" fill="#0f172a">engineering</text>
  </g>
</svg>
