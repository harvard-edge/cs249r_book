  claims:
    Scale moment: 'Leaving one machine is a discontinuity, not an extrapolation: the binding constraint moves from
      the local memory wall to the network and then the energy wall while component failure becomes routine, so
      the unit of engineering becomes the fleet.'
    Synchronous tight coupling: Synchronous training advances one shared model state through a barrier every step,
      so a persistent slowdown on one critical-path worker becomes a step penalty for all, and recovery must restore
      mutually consistent state across every participant rather than re-execute one task.
    Scaling laws as the demand curve: Loss falls as a power law toward an irreducible floor, so each equal quality
      gain multiplies the resource by a fixed factor, a predictable but sublinear return that keeps organizations
      buying each further order of magnitude of fleet.
    Reliability gap: A job that needs all N components at once has availability a^N, so 99.9 percent nodes give
      37 percent all-up at 1,000 nodes, and one more nine only postpones the collapse, which makes resilience rather
      than prevention the objective.
    Communication intensity: 'Bytes moved across the network per local operation is the fleet analog of arithmetic
      intensity: below the fabric balance point scaling is easy, above it bisection bandwidth binds, and byte-reducing
      methods change it while overlap only hides exposed time.'
    C3 taxonomy: Distributed execution time divides into Compute, Communication, and Coordination, each leaving
      different evidence (utilization and memory counters, link and collective timing, barrier waits and recovery
      records), and relieving one moves the bottleneck to another.
    Fleet Law: Distributed step time is T_compute/N + T_comm(N) + T_sync(N) - T_overlap, so adding devices shrinks
      only the compute term while communication and synchronization persist, and scaling efficiency T_1/(N T_N)
      shows which term binds.
    Fleet stack: The fleet is eight rows in four bands (infrastructure, distribution, serving, governance) in which
      capabilities fixed lower constrain choices above, so the stack locates where a decision belongs while C3 says
      what it costs in time.
    Compute-optimal allocation: Training a dense transformer costs about C = 6ND FLOPs, so a fixed budget fixes the
      product of parameters and tokens, and the compute-optimal point grows both together (about 20 tokens per
      parameter); diagnosing whether a project is compute-limited or data-limited decides whether the next investment
      is accelerator-hours or data pipelines.
    Naming the efficiency measure: Percent of peak, compute-time fraction, scaling efficiency, run-level goodput,
      and ML productivity goodput answer different questions over different windows, so every efficiency claim must
      name its measure and interval; the goodput factors are previewed here and defined where ML goodput is owned.
    Energy accounting boundary: Fleet energy productivity, useful model FLOPs per joule of device, cooling, and
      network energy, compares designs only when every design is charged for the same set of energy consumers, and
      exposed communication costs joules as well as seconds.
    Governance as the fleet control plane: At billions of users governance is the control plane that decides what
      the fleet may optimize and deploy, built from security, lineage-based auditability, and responsible-AI requirements
      held as operational invariants with owners and evidence.
    CAP choice under partition: When a worker becomes unreachable, a distributed training system must either wait
      for it and keep one current shared state (synchronous training halts) or proceed without it on stale or
      divergent state (asynchronous and federated training), the training analog of the consistency-availability
      choice that the CAP theorem forces under a network partition.
    Warehouse-scale computer: A tightly coupled data-center fleet is one computer, in which the network fabric acts as
      the system bus, distributed storage as the local disk, and the orchestrator as the operating system, so power,
      cooling, and bisection bandwidth become first-order design constraints.
