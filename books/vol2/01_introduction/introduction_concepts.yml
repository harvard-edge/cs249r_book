  formulas:
    - \mathcal{L}(N) = A N^{-\alpha} + B
    - \text{MTBF}_{\text{system}} = \frac{\text{MTTF}_{\text{component}}}{N}
    - A_{\text{job}} = (A_{\text{component}})^N
    - \text{CI} = \frac{\text{Bytes Transferred (Network)}}{\text{FLOPs Executed (Local)}}
    - C \approx 6 N D
    - \text{Ring AllReduce traffic} \approx \frac{2(N-1)}{N} \times \text{gradient tensor size}
    - T_{\text{step}}(N) = \frac{T_{\text{compute}}}{N} + T_{\text{comm}}(N) + T_{\text{sync}}(N) - T_{\text{overlap}}
    - f_{\text{compute}} = \frac{T_{\text{compute}}/N}{T_{\text{step}}(N)}
    - \rho_{\text{energy}} = \frac{O_{\text{useful}}}{E_{\text{compute}} + E_{\text{cooling}} + E_{\text{network}}}
    - \eta_{\text{scaling}} = \frac{T_1}{N \times T_N}
