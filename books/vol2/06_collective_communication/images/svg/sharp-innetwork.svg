<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="420" fill="#ffffff"/>

  <defs>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-red-dash" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-green-dash" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Vertical Divider -->
  <line x1="340" y1="16" x2="340" y2="390" stroke="#e2e8f0" stroke-dasharray="4 3" stroke-width="1"/>

  <!-- ===== LEFT PANEL: Standard Tree AllReduce ===== -->
  <g id="left-panel">
    <text x="170" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Standard Tree AllReduce</text>
    <text x="170" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">Full gradients traverse all switch tiers to Root GPU</text>

    <!-- Left Summary Card -->
    <rect x="20" y="48" width="300" height="44" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="170" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Bottleneck: Full Tensor Incast</text>
    <text x="170" y="79" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#991b1b">All N workers stream full tensors to root • Root bandwidth = N × Bandwidth</text>

    <!-- Root GPU -->
    <g id="left-root-gpu">
      <rect x="115" y="112" width="110" height="48" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="170" y="129" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Root GPU (Worker 0)</text>
      <text x="170" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">sum = g0 + g1 + g2 + g3</text>
      <text x="170" y="153" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-style="italic" fill="#dc2626">Compute &amp; PCIe Bottleneck</text>
    </g>

    <!-- Intermediate Switches (L1) -->
    <g id="left-l1-switches">
      <rect x="45" y="200" width="90" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="90" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#334155">Switch L1-A</text>
      <text x="90" y="231" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Packet Forward Only</text>

      <rect x="205" y="200" width="90" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="250" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#334155">Switch L1-B</text>
      <text x="250" y="231" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Packet Forward Only</text>
    </g>

    <!-- GPU Workers (Bottom) -->
    <g id="left-gpus">
      <rect x="20" y="295" width="60" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="50" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">GPU 0</text>
      <text x="50" y="326" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#14294E">grad = g0</text>

      <rect x="98" y="295" width="60" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="128" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">GPU 1</text>
      <text x="128" y="326" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#14294E">grad = g1</text>

      <rect x="182" y="295" width="60" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="212" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">GPU 2</text>
      <text x="212" y="326" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#14294E">grad = g2</text>

      <rect x="260" y="295" width="60" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="290" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">GPU 3</text>
      <text x="290" y="326" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#14294E">grad = g3</text>
    </g>

    <!-- Connectors: Workers -> L1 Switches -->
    <line x1="50" y1="295" x2="75" y2="246" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
    <line x1="128" y1="295" x2="105" y2="246" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
    <line x1="212" y1="295" x2="235" y2="246" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
    <line x1="290" y1="295" x2="265" y2="246" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>

    <!-- Data Volume Labels -->
    <text x="50" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b91c1c">g0 (full)</text>
    <text x="132" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b91c1c">g1 (full)</text>
    <text x="208" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b91c1c">g2 (full)</text>
    <text x="290" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b91c1c">g3 (full)</text>

    <!-- Connectors: L1 Switches -> Root GPU -->
    <line x1="90" y1="200" x2="145" y2="164" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <line x1="250" y1="200" x2="195" y2="164" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <text x="102" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b91c1c">g0 + g1</text>
    <text x="238" y="178" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b91c1c">g2 + g3</text>

    <!-- Broadcast return links (dashed) -->
    <path d="M 135 164 L 80 200" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-red-dash)"/>
    <path d="M 205 164 L 260 200" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-red-dash)"/>
    <text x="170" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Upstream: 4 full tensors. Downstream: 4 broadcast copies.</text>
  </g>

  <!-- ===== RIGHT PANEL: SHARP In-Network Reduction ===== -->
  <g id="right-panel">
    <text x="510" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#15803d">SHARP In-Network Reduction</text>
    <text x="510" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">Switch ASICs reduce inline; only aggregates traverse upwards</text>

    <!-- Right Summary Card -->
    <rect x="360" y="48" width="300" height="44" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="510" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803d">Optimization: Line-Rate In-Switch Reduction</text>
    <text x="510" y="79" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">ASICs aggregate payloads inline • 2–3× AllReduce speedup on Quantum fabrics</text>

    <!-- Root Switch -->
    <g id="right-root-switch">
      <rect x="455" y="112" width="110" height="48" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="510" y="129" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803d">Root Switch (ASIC)</text>
      <text x="510" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Aggregates Subtree Sums</text>
      <text x="510" y="153" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-style="italic" fill="#15803d">Final sum: g0+g1+g2+g3</text>
    </g>

    <!-- SHARP Switches with ASIC chips -->
    <g id="right-sharp-switches">
      <!-- Switch A -->
      <rect x="385" y="196" width="94" height="48" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
      <text x="432" y="213" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#15803d">SHARP Switch A</text>
      <rect x="397" y="222" width="70" height="15" rx="2" fill="#16a34a"/>
      <text x="432" y="233" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#ffffff">ASIC REDUCE</text>

      <!-- Switch B -->
      <rect x="541" y="196" width="94" height="48" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
      <text x="588" y="213" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#15803d">SHARP Switch B</text>
      <rect x="553" y="222" width="70" height="15" rx="2" fill="#16a34a"/>
      <text x="588" y="233" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#ffffff">ASIC REDUCE</text>
    </g>

    <!-- GPU Workers (Bottom) -->
    <g id="right-gpus">
      <rect x="360" y="295" width="60" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="390" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">GPU 0</text>
      <text x="390" y="326" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#14294E">grad = g0</text>

      <rect x="438" y="295" width="60" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="468" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">GPU 1</text>
      <text x="468" y="326" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#14294E">grad = g1</text>

      <rect x="522" y="295" width="60" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="552" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">GPU 2</text>
      <text x="552" y="326" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#14294E">grad = g2</text>

      <rect x="600" y="295" width="60" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="630" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">GPU 3</text>
      <text x="630" y="326" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#14294E">grad = g3</text>
    </g>

    <!-- Connectors: Workers -> SHARP Switches -->
    <line x1="390" y1="295" x2="415" y2="248" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>
    <line x1="468" y1="295" x2="445" y2="248" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>
    <line x1="552" y1="295" x2="573" y2="248" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>
    <line x1="630" y1="295" x2="605" y2="248" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>

    <!-- Data Volume Labels -->
    <text x="390" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#15803d">g0</text>
    <text x="472" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#15803d">g1</text>
    <text x="548" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#15803d">g2</text>
    <text x="630" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#15803d">g3</text>

    <!-- Connectors: SHARP Switches -> Root Switch (Only Aggregates!) -->
    <line x1="432" y1="196" x2="485" y2="164" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <line x1="588" y1="196" x2="535" y2="164" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

    <text x="444" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#15803d">g0 + g1 (reduced)</text>
    <text x="580" y="178" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#15803d">g2 + g3 (reduced)</text>

    <!-- Broadcast return links (dashed) -->
    <path d="M 475 164 L 420 196" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-green-dash)"/>
    <path d="M 545 164 L 600 196" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-green-dash)"/>
    <text x="510" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Only aggregated payloads cross the switch fabric; zero GPU root stall.</text>
  </g>

  <!-- Global Footer Note -->
  <text x="340" y="396" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-style="italic" fill="#64748b">NVIDIA SHARP (Scalable Hierarchical Aggregation and Reduction Protocol) offloads floating-point reduction to Mellanox/Quantum switch ASICs.</text>
</svg>