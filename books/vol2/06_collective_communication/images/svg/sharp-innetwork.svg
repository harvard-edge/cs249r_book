<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Upstream half of a reduction: (a) switches forward full tensors to one reducer GPU; (b) switches add partial sums in the fabric. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="300" fill="#ffffff"/>
  <line x1="340" y1="10" x2="340" y2="290" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="10" y="24" font-size="12.5" font-weight="700" fill="#0f172a">(a) Endpoint reduction</text>
  <rect x="80" y="48" width="180" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="170" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Reducer GPU</text>
  <text x="170" y="82" text-anchor="middle" font-size="11" fill="#475569">adds g0 + g1 + g2 + g3</text>
  <rect x="37" y="150" width="110" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="92" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Switch</text>
  <text x="92" y="184" text-anchor="middle" font-size="11" fill="#475569">forwards only</text>
  <rect x="193" y="150" width="110" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="248" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Switch</text>
  <text x="248" y="184" text-anchor="middle" font-size="11" fill="#475569">forwards only</text>
  <rect x="20" y="250" width="66" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="53" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 0</text>
  <text x="53" y="284" text-anchor="middle" font-size="11" fill="#475569">g0</text>
  <line x1="53" y1="250" x2="53" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="59" y="226" text-anchor="start" font-size="11" fill="#0f172a"></text>
  <rect x="98" y="250" width="66" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="131" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 1</text>
  <text x="131" y="284" text-anchor="middle" font-size="11" fill="#475569">g1</text>
  <line x1="131" y1="250" x2="131" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="137" y="226" text-anchor="start" font-size="11" fill="#0f172a"></text>
  <rect x="176" y="250" width="66" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="209" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 2</text>
  <text x="209" y="284" text-anchor="middle" font-size="11" fill="#475569">g2</text>
  <line x1="209" y1="250" x2="209" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="215" y="226" text-anchor="start" font-size="11" fill="#0f172a"></text>
  <rect x="254" y="250" width="66" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="287" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 3</text>
  <text x="287" y="284" text-anchor="middle" font-size="11" fill="#475569">g3</text>
  <line x1="287" y1="250" x2="287" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="293" y="226" text-anchor="start" font-size="11" fill="#0f172a"></text>
  <line x1="92" y1="150" x2="92" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="86" y="125" text-anchor="end" font-size="11" fill="#0f172a">g0, g1</text>
  <line x1="248" y1="150" x2="248" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="254" y="125" text-anchor="start" font-size="11" fill="#0f172a">g2, g3</text>
  <text x="350" y="24" font-size="12.5" font-weight="700" fill="#0f172a">(b) In-network reduction (SHARP)</text>
  <rect x="420" y="48" width="180" height="44" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="510" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Root switch</text>
  <text x="510" y="82" text-anchor="middle" font-size="11" fill="#475569">adds the two partial sums</text>
  <rect x="377" y="150" width="110" height="44" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="432" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Switch</text>
  <text x="432" y="184" text-anchor="middle" font-size="11" fill="#475569">adds its inputs</text>
  <rect x="533" y="150" width="110" height="44" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="588" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Switch</text>
  <text x="588" y="184" text-anchor="middle" font-size="11" fill="#475569">adds its inputs</text>
  <rect x="360" y="250" width="66" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="393" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 0</text>
  <text x="393" y="284" text-anchor="middle" font-size="11" fill="#475569">g0</text>
  <line x1="393" y1="250" x2="393" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="399" y="226" text-anchor="start" font-size="11" fill="#0f172a"></text>
  <rect x="438" y="250" width="66" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="471" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 1</text>
  <text x="471" y="284" text-anchor="middle" font-size="11" fill="#475569">g1</text>
  <line x1="471" y1="250" x2="471" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="477" y="226" text-anchor="start" font-size="11" fill="#0f172a"></text>
  <rect x="516" y="250" width="66" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="549" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 2</text>
  <text x="549" y="284" text-anchor="middle" font-size="11" fill="#475569">g2</text>
  <line x1="549" y1="250" x2="549" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="555" y="226" text-anchor="start" font-size="11" fill="#0f172a"></text>
  <rect x="594" y="250" width="66" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="627" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 3</text>
  <text x="627" y="284" text-anchor="middle" font-size="11" fill="#475569">g3</text>
  <line x1="627" y1="250" x2="627" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="633" y="226" text-anchor="start" font-size="11" fill="#0f172a"></text>
  <line x1="432" y1="150" x2="432" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="426" y="125" text-anchor="end" font-size="11" fill="#0f172a">g0+g1</text>
  <line x1="588" y1="150" x2="588" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="594" y="125" text-anchor="start" font-size="11" fill="#0f172a">g2+g3</text>
</svg>
