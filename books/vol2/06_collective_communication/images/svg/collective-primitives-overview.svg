<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== QUADRANT 1: ALLREDUCE (Top-Left) ===== -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="340" height="215" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="24" rx="4" fill="#f1f5f9"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">AllReduce (Sum Reduction)</text>
    <text x="328" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#0369a1">All Hold Total Sum</text>

    <!-- Subtitle -->
    <text x="12" y="38" font-size="8" fill="#64748b">Aggregates distributed arrays; all devices receive the identical sum.</text>

    <!-- Inputs (Left Column) -->
    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="68" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">G0: [ 1 ]</text>

      <rect x="0" y="32" width="68" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="34" y="47" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">G1: [ 2 ]</text>

      <rect x="0" y="64" width="68" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="34" y="79" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">G2: [ 3 ]</text>

      <rect x="0" y="96" width="68" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="34" y="111" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">G3: [ 4 ]</text>
    </g>

    <!-- Central Primitive Operator Box -->
    <g transform="translate(125, 96)">
      <rect x="0" y="0" width="80" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="40" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">AllReduce Σ</text>
    </g>

    <!-- Arrows in: G0..G3 -> Central Box -->
    <path d="M 83,60 L 105,60 L 105,109 L 123,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 83,92 L 123,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 83,124 L 123,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 83,156 L 105,156 L 105,109 L 123,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- Arrows out: Central Box -> G0..G3 -->
    <path d="M 205,109 L 225,109 L 225,60 L 243,60" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 205,109 L 243,92" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 205,109 L 243,124" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 205,109 L 225,109 L 225,156 L 243,156" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- Outputs (Right Column) -->
    <g transform="translate(245, 48)">
      <rect x="0" y="0" width="80" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">G0: [ 10 ]</text>

      <rect x="0" y="32" width="80" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="40" y="47" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">G1: [ 10 ]</text>

      <rect x="0" y="64" width="80" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="40" y="79" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">G2: [ 10 ]</text>

      <rect x="0" y="96" width="80" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="40" y="111" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">G3: [ 10 ]</text>
    </g>

    <!-- Usage Note -->
    <text x="170" y="195" text-anchor="middle" font-size="8" font-weight="600" fill="#0369a1">Core Usage: Data Parallel gradient synchronization (DDP)</text>
  </g>

  <!-- ===== QUADRANT 2: ALLGATHER (Top-Right) ===== -->
  <g transform="translate(380, 20)">
    <rect x="0" y="0" width="340" height="215" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="24" rx="4" fill="#f1f5f9"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">AllGather (Concatenation)</text>
    <text x="328" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#15803d">All Hold Full Tensor</text>

    <!-- Subtitle -->
    <text x="12" y="38" font-size="8" fill="#64748b">Collects partial shards from each device into the complete tensor.</text>

    <!-- Inputs (Left Column) -->
    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="68" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">G0: [ a ]</text>

      <rect x="0" y="32" width="68" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="34" y="47" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">G1: [ b ]</text>

      <rect x="0" y="64" width="68" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="34" y="79" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">G2: [ c ]</text>

      <rect x="0" y="96" width="68" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="34" y="111" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">G3: [ d ]</text>
    </g>

    <!-- Central Primitive Operator Box -->
    <g transform="translate(125, 96)">
      <rect x="0" y="0" width="80" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="40" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">AllGather ⊞</text>
    </g>

    <!-- Arrows in: G0..G3 -> Central Box -->
    <path d="M 83,60 L 105,60 L 105,109 L 123,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 83,92 L 123,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 83,124 L 123,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 83,156 L 105,156 L 105,109 L 123,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- Arrows out: Central Box -> G0..G3 -->
    <path d="M 205,109 L 218,109 L 218,60 L 230,60" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 205,109 L 230,92" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 205,109 L 230,124" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 205,109 L 218,109 L 218,156 L 230,156" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- Outputs (Right Column) -->
    <g transform="translate(232, 48)">
      <rect x="0" y="0" width="95" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="47" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">G0: [ a, b, c, d ]</text>

      <rect x="0" y="32" width="95" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="47" y="47" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">G1: [ a, b, c, d ]</text>

      <rect x="0" y="64" width="95" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="47" y="79" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">G2: [ a, b, c, d ]</text>

      <rect x="0" y="96" width="95" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="47" y="111" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">G3: [ a, b, c, d ]</text>
    </g>

    <!-- Usage Note -->
    <text x="170" y="195" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Core Usage: FSDP / ZeRO-3 weight un-sharding before forward pass</text>
  </g>

  <!-- ===== QUADRANT 3: REDUCESCATTER (Bottom-Left) ===== -->
  <g transform="translate(20, 250)">
    <rect x="0" y="0" width="340" height="215" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="24" rx="4" fill="#f1f5f9"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">ReduceScatter (Reduce + Partition)</text>
    <text x="328" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#d97706">Each Holds Unique Shard</text>

    <!-- Subtitle -->
    <text x="12" y="38" font-size="8" fill="#64748b">Reduces full arrays across devices, then scatters disjoint reduced slices.</text>

    <!-- Inputs (Left Column) -->
    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="90" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="45" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">G0:[a0,b0,c0,d0]</text>

      <rect x="0" y="32" width="90" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="45" y="47" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">G1:[a1,b1,c1,d1]</text>

      <rect x="0" y="64" width="90" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="45" y="79" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">G2:[a2,b2,c2,d2]</text>

      <rect x="0" y="96" width="90" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="45" y="111" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">G3:[a3,b3,c3,d3]</text>
    </g>

    <!-- Central Primitive Operator Box -->
    <g transform="translate(130, 96)">
      <rect x="0" y="0" width="85" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="42" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">ReduceScatter</text>
    </g>

    <!-- Arrows in: G0..G3 -> Central Box -->
    <path d="M 102,60 L 118,60 L 118,109 L 128,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 102,92 L 128,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 102,124 L 128,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 102,156 L 118,156 L 118,109 L 128,109" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- Arrows out: Central Box -> G0..G3 -->
    <path d="M 215,109 L 227,109 L 227,60 L 238,60" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 215,109 L 238,92" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 215,109 L 238,124" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 215,109 L 227,109 L 227,156 L 238,156" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- Outputs (Right Column) -->
    <g transform="translate(240, 48)">
      <rect x="0" y="0" width="85" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="42" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">G0: [ Σ a ]</text>

      <rect x="0" y="32" width="85" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="42" y="47" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">G1: [ Σ b ]</text>

      <rect x="0" y="64" width="85" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="42" y="79" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">G2: [ Σ c ]</text>

      <rect x="0" y="96" width="85" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="42" y="111" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">G3: [ Σ d ]</text>
    </g>

    <!-- Usage Note -->
    <text x="170" y="195" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">Core Usage: FSDP / ZeRO gradient reduction into sharded optimizer state</text>
  </g>

  <!-- ===== QUADRANT 4: ALLTOALL (Bottom-Right) ===== -->
  <g transform="translate(380, 250)">
    <rect x="0" y="0" width="340" height="215" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="24" rx="4" fill="#f1f5f9"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">AlltoAll (Global Matrix Transpose)</text>
    <text x="328" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#7c3aed">Pairwise Shuffle</text>

    <!-- Subtitle -->
    <text x="12" y="38" font-size="8" fill="#64748b">Each rank sends distinct shard i to peer rank i (global matrix transposition).</text>

    <!-- Inputs (Left Column) -->
    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="90" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="45" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">G0:[a0,b0,c0,d0]</text>

      <rect x="0" y="32" width="90" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="45" y="47" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">G1:[a1,b1,c1,d1]</text>

      <rect x="0" y="64" width="90" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="45" y="79" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">G2:[a2,b2,c2,d2]</text>

      <rect x="0" y="96" width="90" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="45" y="111" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">G3:[a3,b3,c3,d3]</text>
    </g>

    <!-- Central Primitive Operator Box -->
    <g transform="translate(130, 96)">
      <rect x="0" y="0" width="85" height="26" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="42" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">AlltoAll ⇄</text>
    </g>

    <!-- Arrows in/out: AlltoAll routes -->
    <path d="M 102,60 L 118,60 L 118,109 L 128,109" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 102,92 L 128,109" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 102,124 L 128,109" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 102,156 L 118,156 L 118,109 L 128,109" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

    <path d="M 215,109 L 227,109 L 227,60 L 238,60" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 215,109 L 238,92" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 215,109 L 238,124" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 215,109 L 227,109 L 227,156 L 238,156" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

    <!-- Outputs (Right Column) -->
    <g transform="translate(240, 48)">
      <rect x="0" y="0" width="88" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="44" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">G0:[a0,a1,a2,a3]</text>

      <rect x="0" y="32" width="88" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="44" y="47" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">G1:[b0,b1,b2,b3]</text>

      <rect x="0" y="64" width="88" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="44" y="79" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">G2:[c0,c1,c2,c3]</text>

      <rect x="0" y="96" width="88" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="44" y="111" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">G3:[d0,d1,d2,d3]</text>
    </g>

    <!-- Usage Note -->
    <text x="170" y="195" text-anchor="middle" font-size="8" font-weight="600" fill="#7c3aed">Core Usage: Mixture-of-Experts (MoE) token dispatch &amp; combine routing</text>
  </g>
</svg>