<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== STEP EXECUTION SUMMARY PILL STRIP (Top, y=12..36) ===== -->
  <g transform="translate(30, 12)">
    <!-- Step 1 Pill -->
    <rect x="0" y="0" width="210" height="24" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="105" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">Step 1: Intra-Node ReduceScatter</text>

    <!-- Step 2 Pill -->
    <rect x="225" y="0" width="210" height="24" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="330" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">Step 2: Inter-Node AllReduce (Leaders)</text>

    <!-- Step 3 Pill -->
    <rect x="450" y="0" width="210" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="555" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Step 3: Intra-Node AllGather</text>
  </g>

  <!-- ===== INTER-NODE OPTICAL FABRIC BRIDGE (Step 2, Overhead Route G0 <-> G4) ===== -->
  <!-- Symmetrical line connecting G0 (x=78) and G4 (x=423) -->
  <g stroke="#d97706" stroke-width="1.8" fill="none">
    <path d="M 78,105 L 78,52 L 138,52" stroke-dasharray="5,3"/>
    <path d="M 362,52 L 423,52 L 423,105" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>
  </g>

  <!-- Inter-Node IB Badge Centered between G0 and G4 -->
  <g transform="translate(140, 40)">
    <rect x="0" y="0" width="220" height="25" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="110" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">Step 2: Optical Spine Fabric (50 GB/s · ⅛ Traffic)</text>
  </g>

  <!-- ===== NODE 0 (Left Server Chassis, y=75..295) ===== -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="315" height="220" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="0" y="0" width="315" height="22" rx="4" fill="#f1f5f9"/>
    <text x="12" y="15" font-size="9" font-weight="700" fill="#0f172a">Node 0 (8-GPU Server Chassis)</text>
    <text x="303" y="15" text-anchor="end" font-size="8" font-weight="600" fill="#1F407A">NVLink 4.0 Mesh</text>

    <!-- GPUs inside Node 0 -->
    <!-- G0 (Leader) -->
    <g transform="translate(18, 32)">
      <rect x="0" y="0" width="60" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="30" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">G0</text>
      <text x="30" y="32" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d97706">Leader</text>
    </g>

    <!-- G1 -->
    <g transform="translate(90, 32)">
      <rect x="0" y="0" width="60" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="30" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">G1</text>
      <text x="30" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rank 1</text>
    </g>

    <!-- G2 -->
    <g transform="translate(162, 32)">
      <rect x="0" y="0" width="60" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="30" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">G2</text>
      <text x="30" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rank 2</text>
    </g>

    <!-- G3 -->
    <g transform="translate(234, 32)">
      <rect x="0" y="0" width="60" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="30" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">G3</text>
      <text x="30" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rank 3</text>
    </g>

    <!-- Intra-Node NVLink Ring Arrows -->
    <g stroke="#1F407A" stroke-width="1.2" fill="none">
      <path d="M 78,54 L 90,54" marker-end="url(#arr-blue)"/>
      <path d="M 150,54 L 162,54" marker-end="url(#arr-blue)"/>
      <path d="M 222,54 L 234,54" marker-end="url(#arr-blue)"/>
      <!-- Internal return path -->
      <path d="M 264,76 L 264,90 L 48,90 L 48,76" marker-end="url(#arr-blue)"/>
    </g>
    <text x="157" y="102" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1F407A">Intra-Node NVLink Ring (900 GB/s)</text>

    <!-- Step 1 Callout Card -->
    <g transform="translate(15, 114)">
      <rect x="0" y="0" width="285" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#0f172a">Step 1: Intra-Node ReduceScatter</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">Ranks 0..7 reduce partial gradients over 900 GB/s NVLink.</text>
      <text x="10" y="37" font-size="7.5" fill="#14294E" font-weight="600">G0 accumulates the fully reduced slice for rank index 0.</text>
    </g>

    <!-- Step 3 Callout Card -->
    <g transform="translate(15, 164)">
      <rect x="0" y="0" width="285" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#15803d">Step 3: Intra-Node AllGather</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">G0 receives the global aggregate from the optical fabric</text>
      <text x="10" y="37" font-size="7.5" fill="#166534" font-weight="600">and broadcasts it via NVLink AllGather to ranks 1..7.</text>
    </g>
  </g>

  <!-- ===== NODE 1 (Right Server Chassis, y=75..295) ===== -->
  <g transform="translate(375, 75)">
    <rect x="0" y="0" width="315" height="220" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="0" y="0" width="315" height="22" rx="4" fill="#f1f5f9"/>
    <text x="12" y="15" font-size="9" font-weight="700" fill="#0f172a">Node 1 (8-GPU Server Chassis)</text>
    <text x="303" y="15" text-anchor="end" font-size="8" font-weight="600" fill="#1F407A">NVLink 4.0 Mesh</text>

    <!-- GPUs inside Node 1 -->
    <!-- G4 (Leader) -->
    <g transform="translate(18, 32)">
      <rect x="0" y="0" width="60" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="30" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">G4</text>
      <text x="30" y="32" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d97706">Leader</text>
    </g>

    <!-- G5 -->
    <g transform="translate(90, 32)">
      <rect x="0" y="0" width="60" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="30" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">G5</text>
      <text x="30" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rank 5</text>
    </g>

    <!-- G6 -->
    <g transform="translate(162, 32)">
      <rect x="0" y="0" width="60" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="30" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">G6</text>
      <text x="30" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rank 6</text>
    </g>

    <!-- G7 -->
    <g transform="translate(234, 32)">
      <rect x="0" y="0" width="60" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="30" y="19" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">G7</text>
      <text x="30" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rank 7</text>
    </g>

    <!-- Intra-Node NVLink Ring Arrows -->
    <g stroke="#1F407A" stroke-width="1.2" fill="none">
      <path d="M 78,54 L 90,54" marker-end="url(#arr-blue)"/>
      <path d="M 150,54 L 162,54" marker-end="url(#arr-blue)"/>
      <path d="M 222,54 L 234,54" marker-end="url(#arr-blue)"/>
      <!-- Internal return path -->
      <path d="M 264,76 L 264,90 L 48,90 L 48,76" marker-end="url(#arr-blue)"/>
    </g>
    <text x="157" y="102" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1F407A">Intra-Node NVLink Ring (900 GB/s)</text>

    <!-- Step 1 Callout Card -->
    <g transform="translate(15, 114)">
      <rect x="0" y="0" width="285" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#0f172a">Step 1: Intra-Node ReduceScatter</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">Ranks 4..11 reduce partial gradients over 900 GB/s NVLink.</text>
      <text x="10" y="37" font-size="7.5" fill="#14294E" font-weight="600">G4 accumulates the fully reduced slice for rank index 4.</text>
    </g>

    <!-- Step 3 Callout Card -->
    <g transform="translate(15, 164)">
      <rect x="0" y="0" width="285" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#15803d">Step 3: Intra-Node Broadcast</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">G4 receives the global aggregate from the optical fabric</text>
      <text x="10" y="37" font-size="7.5" fill="#166534" font-weight="600">and broadcasts it via NVLink AllGather to ranks 5..11.</text>
    </g>
  </g>

  <!-- ===== BOTTOM BANDWIDTH COMPARISON CARD (y=310..440) ===== -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="660" height="130" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="660" height="20" rx="4" fill="#f1f5f9"/>
    <text x="330" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Hierarchical Traffic Scaling Advantage (18× Bandwidth Multiplier)</text>

    <!-- NVLink Bar -->
    <rect x="20" y="30" width="480" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="30" y="43" font-size="8.5" font-weight="700" fill="#92400e">Intra-Node NVLink 4.0: 900 GB/s Bidirectional</text>

    <!-- Ratio Badge -->
    <g transform="translate(515, 30)">
      <rect x="0" y="0" width="125" height="42" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="62" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">18×</text>
      <text x="62" y="32" text-anchor="middle" font-size="7.5" font-weight="600" fill="#dc2626">Bandwidth Gap</text>
    </g>

    <!-- IB Bar -->
    <rect x="20" y="54" width="30" height="18" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="58" y="67" font-size="8.5" font-weight="700" fill="#6b21a8">InfiniBand NDR: 50 GB/s (400 Gb/s per port)</text>

    <!-- Explanation -->
    <g transform="translate(20, 85)">
      <text x="0" y="14" font-size="8" font-weight="700" fill="#0f172a">Traffic Elimination Law:</text>
      <text x="120" y="14" font-size="8" fill="#475569">By completing the first reduction tier inside the node over 900 GB/s NVLink, inter-node traffic across</text>
      <text x="0" y="28" font-size="8" fill="#475569">the optical network switches drops by exactly 8×, preventing bisection bandwidth exhaustion at fleet scale.</text>
      <text x="0" y="42" font-size="8" font-weight="600" fill="#15803d">NCCL Default: Automatically maps multi-node rings to this 3-step hierarchical topology.</text>
    </g>
  </g>
</svg>