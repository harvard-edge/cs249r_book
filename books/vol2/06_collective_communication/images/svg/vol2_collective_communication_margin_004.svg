<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Error feedback loop in the prose's notation: g_t + e_t -> compress -> v_t sent; residual e_{t+1} returns to the next step. -->
  <defs>
    <marker id="arr-gray" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#d97706"/></marker>
  </defs>
  <rect width="140" height="100" fill="#ffffff"/>
  <rect x="4" y="30" width="54" height="24" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="31" y="46" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">g<tspan font-size="7.5" dy="2.5">t</tspan><tspan dy="-2.5">&#160;+ e</tspan><tspan font-size="7.5" dy="2.5">t</tspan></text>
  <line x1="58" y1="42" x2="78" y2="42" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="80" y="30" width="56" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="108" y="46" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">compress</text>
  <line x1="108" y1="30" x2="108" y2="16" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="104" y="11" text-anchor="end" font-size="9" fill="#b45309">send v<tspan font-size="7" dy="2.5">t</tspan></text>
  <path d="M108,54 V82 H92" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="34" y="72" width="56" height="20" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="62" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">e<tspan font-size="7.5" dy="2.5">t+1</tspan></text>
  <path d="M34,82 H20 V56" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="104" y="68" text-anchor="end" font-size="8" fill="#475569">residual</text>
</svg>
