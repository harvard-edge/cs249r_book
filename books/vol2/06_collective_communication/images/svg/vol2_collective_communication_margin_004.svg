<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Error feedback loop in the prose's notation: g_t + e_t -> compress -> v_t sent; residual e_{t+1} returns to the next step. -->
  <defs>
    <marker id="arr-gray" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#d97706"/></marker>
  </defs>
  <rect width="140" height="110" fill="#ffffff"/>
  <rect x="4" y="34" width="48" height="26" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="28" y="51" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">g<tspan font-size="10" dy="3">t</tspan><tspan dy="-3">&#160;+ e</tspan><tspan font-size="10" dy="3">t</tspan></text>
  <line x1="52" y1="47" x2="70" y2="47" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="72" y="34" width="66" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="105" y="51" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">compress</text>
  <line x1="105" y1="34" x2="105" y2="20" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="100" y="14" text-anchor="end" font-size="11.5" fill="#b45309">send v<tspan font-size="10" dy="3">t</tspan></text>
  <path d="M105,60 V93 H92" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="34" y="82" width="56" height="22" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="62" y="97" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">e<tspan font-size="10" dy="3">t+1</tspan></text>
  <path d="M34,93 H20 V62" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="100" y="75" text-anchor="end" font-size="10" fill="#475569">residual</text>
</svg>
