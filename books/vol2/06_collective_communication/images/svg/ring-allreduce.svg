<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== PHASE 1: SCATTER-REDUCE ===== -->
  <g transform="translate(20, 20)">
    <!-- Container -->
    <rect x="0" y="0" width="660" height="175" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="660" height="24" rx="4" fill="#f1f5f9"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">Phase 1: Scatter-Reduce (N − 1 = 3 Transmission Steps)</text>
    <text x="648" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#0284c7">Each GPU Obtains 1 Reduced Shard</text>

    <text x="12" y="38" font-size="8" fill="#475569">Gradients shift right along the ring while adding local partials; after 3 steps, each rank owns one fully reduced slice.</text>

    <!-- GPU 0 -->
    <g transform="translate(30, 52)">
      <rect x="0" y="0" width="115" height="62" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="57" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">GPU 0 (Rank 0)</text>
      <!-- Shards -->
      <rect x="8" y="24" width="22" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="19" y="43" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">A✓</text>

      <rect x="34" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="43" text-anchor="middle" font-size="8" fill="#64748b">B</text>

      <rect x="60" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="71" y="43" text-anchor="middle" font-size="8" fill="#64748b">C</text>

      <rect x="86" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="97" y="43" text-anchor="middle" font-size="8" fill="#64748b">D</text>
    </g>

    <!-- GPU 1 -->
    <g transform="translate(185, 52)">
      <rect x="0" y="0" width="115" height="62" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="57" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">GPU 1 (Rank 1)</text>
      <!-- Shards -->
      <rect x="8" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="19" y="43" text-anchor="middle" font-size="8" fill="#64748b">A</text>

      <rect x="34" y="24" width="22" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="45" y="43" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">B✓</text>

      <rect x="60" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="71" y="43" text-anchor="middle" font-size="8" fill="#64748b">C</text>

      <rect x="86" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="97" y="43" text-anchor="middle" font-size="8" fill="#64748b">D</text>
    </g>

    <!-- GPU 2 -->
    <g transform="translate(340, 52)">
      <rect x="0" y="0" width="115" height="62" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="57" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">GPU 2 (Rank 2)</text>
      <!-- Shards -->
      <rect x="8" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="19" y="43" text-anchor="middle" font-size="8" fill="#64748b">A</text>

      <rect x="34" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="43" text-anchor="middle" font-size="8" fill="#64748b">B</text>

      <rect x="60" y="24" width="22" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="71" y="43" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">C✓</text>

      <rect x="86" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="97" y="43" text-anchor="middle" font-size="8" fill="#64748b">D</text>
    </g>

    <!-- GPU 3 -->
    <g transform="translate(495, 52)">
      <rect x="0" y="0" width="115" height="62" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="57" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">GPU 3 (Rank 3)</text>
      <!-- Shards -->
      <rect x="8" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="19" y="43" text-anchor="middle" font-size="8" fill="#64748b">A</text>

      <rect x="34" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="43" text-anchor="middle" font-size="8" fill="#64748b">B</text>

      <rect x="60" y="24" width="22" height="30" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="71" y="43" text-anchor="middle" font-size="8" fill="#64748b">C</text>

      <rect x="86" y="24" width="22" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="97" y="43" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">D✓</text>
    </g>

    <!-- Unidirectional Ring Transmission Arrows (Scatter-Reduce: Blue) -->
    <g stroke="#0284c7" stroke-width="1.5" fill="none">
      <path d="M 145,83 L 183,83" marker-end="url(#arr-blue)"/>
      <path d="M 300,83 L 338,83" marker-end="url(#arr-blue)"/>
      <path d="M 455,83 L 493,83" marker-end="url(#arr-blue)"/>
      <!-- Wrap-around: GPU 3 back to GPU 0 -->
      <path d="M 552,114 L 552,135 L 87,135 L 87,116" marker-end="url(#arr-blue)"/>
    </g>
    <text x="320" y="146" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">Unidirectional Ring Bus Wrap-Around (3 → 0)</text>

    <!-- Phase 1 status note -->
    <text x="330" y="165" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">State: Rank i holds the fully reduced slice for index i (A✓ on G0, B✓ on G1, C✓ on G2, D✓ on G3)</text>
  </g>

  <!-- ===== PHASE 2: ALLGATHER ===== -->
  <g transform="translate(20, 205)">
    <!-- Container -->
    <rect x="0" y="0" width="660" height="165" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="660" height="24" rx="4" fill="#f1f5f9"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">Phase 2: AllGather (N − 1 = 3 Transmission Steps)</text>
    <text x="648" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#15803d">All GPUs Obtain All Reduced Shards</text>

    <text x="12" y="38" font-size="8" fill="#475569">Each GPU sends the fully reduced shard it received to its neighbor until all devices possess all 4 reduced shards.</text>

    <!-- GPU 0 -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="115" height="58" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="57" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">GPU 0</text>
      <!-- All Shards Reduced -->
      <rect x="8" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="19" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">A✓</text>
      <rect x="34" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="45" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">B✓</text>
      <rect x="60" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="71" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">C✓</text>
      <rect x="86" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="97" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">D✓</text>
    </g>

    <!-- GPU 1 -->
    <g transform="translate(185, 50)">
      <rect x="0" y="0" width="115" height="58" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="57" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">GPU 1</text>
      <rect x="8" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="19" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">A✓</text>
      <rect x="34" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="45" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">B✓</text>
      <rect x="60" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="71" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">C✓</text>
      <rect x="86" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="97" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">D✓</text>
    </g>

    <!-- GPU 2 -->
    <g transform="translate(340, 50)">
      <rect x="0" y="0" width="115" height="58" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="57" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">GPU 2</text>
      <rect x="8" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="19" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">A✓</text>
      <rect x="34" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="45" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">B✓</text>
      <rect x="60" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="71" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">C✓</text>
      <rect x="86" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="97" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">D✓</text>
    </g>

    <!-- GPU 3 -->
    <g transform="translate(495, 50)">
      <rect x="0" y="0" width="115" height="58" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="57" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">GPU 3</text>
      <rect x="8" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="19" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">A✓</text>
      <rect x="34" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="45" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">B✓</text>
      <rect x="60" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="71" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">C✓</text>
      <rect x="86" y="22" width="22" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="97" y="40" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">D✓</text>
    </g>

    <!-- Unidirectional Ring Transmission Arrows (AllGather: Green) -->
    <g stroke="#16a34a" stroke-width="1.5" fill="none">
      <path d="M 145,79 L 183,79" marker-end="url(#arr-green)"/>
      <path d="M 300,79 L 338,79" marker-end="url(#arr-green)"/>
      <path d="M 455,79 L 493,79" marker-end="url(#arr-green)"/>
      <!-- Wrap-around: GPU 3 back to GPU 0 -->
      <path d="M 552,108 L 552,128 L 87,128 L 87,110" marker-end="url(#arr-green)"/>
    </g>
    <text x="320" y="139" text-anchor="middle" font-size="7.5" font-weight="600" fill="#16a34a">AllGather Ring Forwarding (3 → 0)</text>

    <!-- Phase 2 completion note -->
    <text x="330" y="155" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Final Result: Every GPU holds the complete global gradient sum [A✓, B✓, C✓, D✓].</text>
  </g>

  <!-- ===== BOTTOM ANALYTICAL FORMULA CARD ===== -->
  <g transform="translate(20, 380)">
    <rect x="0" y="0" width="660" height="85" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="660" height="20" rx="4" fill="#f1f5f9"/>
    <text x="330" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Ring AllReduce Analytical Performance Invariants</text>

    <g transform="translate(20, 30)">
      <text x="0" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Bandwidth Optimality:</text>
      <text x="135" y="14" font-size="8.5" font-family="Courier New, monospace" fill="#0369a1">Traffic = 2 · (N − 1)/N · S → 2S as N → ∞</text>
      <text x="420" y="14" font-size="8" fill="#475569">Independent of cluster size N!</text>

      <text x="0" y="32" font-size="8.5" font-weight="700" fill="#b91c1c">Latency Scaling Penalty:</text>
      <text x="135" y="32" font-size="8.5" font-family="Courier New, monospace" fill="#b91c1c">Latency = 2(N − 1) · α</text>
      <text x="420" y="32" font-size="8" fill="#475569">Scales linearly; breaks down at N > 64 nodes.</text>
    </g>
  </g>
</svg>