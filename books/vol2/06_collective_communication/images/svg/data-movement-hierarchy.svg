<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== ROW 1: SRAM (On-Chip Cache) ===== -->
  <g transform="translate(20, 25)">
    <!-- Label left -->
    <text x="130" y="24" text-anchor="end" font-size="10" font-weight="700" fill="#0f172a">SRAM</text>
    <text x="130" y="37" text-anchor="end" font-size="8.5" fill="#475569">On-Chip Cache</text>
    <text x="130" y="49" text-anchor="end" font-size="8" fill="#64748b">~0–1 mm die</text>

    <!-- Bar: SRAM (0.5 pJ/bit) -->
    <rect x="145" y="10" width="45" height="46" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="167" y="32" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">~0.5 pJ</text>
    <text x="167" y="44" text-anchor="middle" font-size="7.5" fill="#166534">per bit</text>

    <!-- System Implication Card -->
    <rect x="205" y="10" width="370" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="215" y="27" font-size="8.5" font-weight="700" fill="#0f172a">Tiling &amp; Kernel Fusion</text>
    <text x="215" y="42" font-size="8" fill="#475569">Maximized via FlashAttention tiling; keeps intermediate activations inside SRAM.</text>

    <!-- Multiplier Badge -->
    <rect x="590" y="15" width="85" height="36" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="632" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">1×</text>
    <text x="632" y="43" text-anchor="middle" font-size="7.5" fill="#166534">Baseline</text>
  </g>

  <!-- ===== ROW 2: DRAM / HBM (GPU Memory) ===== -->
  <g transform="translate(20, 95)">
    <!-- Label left -->
    <text x="130" y="24" text-anchor="end" font-size="10" font-weight="700" fill="#0f172a">DRAM / HBM</text>
    <text x="130" y="37" text-anchor="end" font-size="8.5" fill="#475569">On-Package Stack</text>
    <text x="130" y="49" text-anchor="end" font-size="8" fill="#64748b">~1–10 mm 2.5D</text>

    <!-- Bar: DRAM / HBM (20 pJ/bit) -->
    <rect x="145" y="10" width="120" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="205" y="32" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">~20 pJ / bit</text>
    <text x="205" y="44" text-anchor="middle" font-size="7.5" fill="#0c4a6e">HBM3e PHY read</text>

    <!-- System Implication Card -->
    <rect x="280" y="10" width="295" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="290" y="27" font-size="8.5" font-weight="700" fill="#0f172a">Memory Bandwidth Wall</text>
    <text x="290" y="42" font-size="8" fill="#475569">Requires memory-bound operator recomputation to avoid HBM round-trips.</text>

    <!-- Multiplier Badge -->
    <rect x="590" y="15" width="85" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="632" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#14294E">40×</text>
    <text x="632" y="43" text-anchor="middle" font-size="7.5" fill="#1F407A">vs. SRAM</text>
  </g>

  <!-- ===== ROW 3: NVLink (Intra-Node Interconnect) ===== -->
  <g transform="translate(20, 165)">
    <!-- Label left -->
    <text x="130" y="24" text-anchor="end" font-size="10" font-weight="700" fill="#0f172a">NVLink 4.0</text>
    <text x="130" y="37" text-anchor="end" font-size="8.5" fill="#475569">Intra-Node Mesh</text>
    <text x="130" y="49" text-anchor="end" font-size="8" fill="#64748b">~0.5–1 m PCB</text>

    <!-- Bar: NVLink (100 pJ/bit) -->
    <rect x="145" y="10" width="230" height="46" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="260" y="32" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">~100 pJ / bit</text>
    <text x="260" y="44" text-anchor="middle" font-size="7.5" fill="#78350f">NVSwitch copper trace</text>

    <!-- System Implication Card -->
    <rect x="390" y="10" width="185" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="400" y="27" font-size="8.5" font-weight="700" fill="#0f172a">Intra-Node Locality</text>
    <text x="400" y="42" font-size="8" fill="#475569">Enables Tensor Parallelism (TP).</text>

    <!-- Multiplier Badge -->
    <rect x="590" y="15" width="85" height="36" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="632" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">200×</text>
    <text x="632" y="43" text-anchor="middle" font-size="7.5" fill="#b45309">vs. SRAM</text>
  </g>

  <!-- ===== ROW 4: InfiniBand / Optical (Inter-Node Fabric) ===== -->
  <g transform="translate(20, 235)">
    <!-- Label left -->
    <text x="130" y="24" text-anchor="end" font-size="10" font-weight="700" fill="#0f172a">InfiniBand NDR</text>
    <text x="130" y="37" text-anchor="end" font-size="8.5" fill="#475569">Inter-Node Fabric</text>
    <text x="130" y="49" text-anchor="end" font-size="8" fill="#64748b">~10–100 m optics</text>

    <!-- Bar: InfiniBand (1,000 pJ/bit) -->
    <rect x="145" y="10" width="430" height="46" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="360" y="32" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6b21a8">~1,000 pJ / bit (Laser Transceiver + Serialization + Optical Fiber)</text>
    <text x="360" y="44" text-anchor="middle" font-size="7.5" fill="#581c87">Dominates cluster power budget during all-to-all collectives</text>

    <!-- Multiplier Badge (Red: Extreme Energy Cliff) -->
    <rect x="590" y="15" width="85" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="632" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">2,000×</text>
    <text x="632" y="43" text-anchor="middle" font-size="7.5" font-weight="600" fill="#dc2626">Energy Cliff</text>
  </g>

  <!-- ===== LOG-SCALE X-AXIS ===== -->
  <g transform="translate(20, 305)">
    <line x1="145" y1="0" x2="575" y2="0" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Ticks -->
    <line x1="167" y1="0" x2="167" y2="5" stroke="#94a3b8" stroke-width="1"/>
    <text x="167" y="16" text-anchor="middle" font-size="8" fill="#64748b">0.5 pJ</text>

    <line x1="265" y1="0" x2="265" y2="5" stroke="#94a3b8" stroke-width="1"/>
    <text x="265" y="16" text-anchor="middle" font-size="8" fill="#64748b">20 pJ</text>

    <line x1="375" y1="0" x2="375" y2="5" stroke="#94a3b8" stroke-width="1"/>
    <text x="375" y="16" text-anchor="middle" font-size="8" fill="#64748b">100 pJ</text>

    <line x1="575" y1="0" x2="575" y2="5" stroke="#94a3b8" stroke-width="1"/>
    <text x="575" y="16" text-anchor="middle" font-size="8" fill="#64748b">1,000 pJ</text>

    <text x="360" y="30" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Energy Cost per Bit Transferred (pJ / bit, Log Scale)</text>
  </g>

  <!-- ===== BOTTOM SUMMARY CARD ===== -->
  <g transform="translate(30, 350)">
    <rect x="0" y="0" width="645" height="75" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="645" height="20" rx="4" fill="#f1f5f9"/>
    <text x="322" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Thermodynamic Law of Distributed ML Systems</text>

    <text x="20" y="38" font-size="8.5" font-weight="700" fill="#0f172a">The Distance Penalty:</text>
    <text x="140" y="38" font-size="8.5" fill="#475569">Moving a bit across a 50-meter optical datacenter fabric costs 2,000× more energy than moving it inside SRAM.</text>

    <text x="20" y="56" font-size="8.5" font-weight="700" fill="#14294E">Algorithmic Defense:</text>
    <text x="140" y="56" font-size="8.5" fill="#475569">Hierarchical AllReduce and FP8/FP4 gradient quantization exist primarily to avoid paying this 2,000× optical tax.</text>
  </g>
</svg>