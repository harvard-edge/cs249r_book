<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Nested accounting boundaries for one transfer: package, node, fabric path. Memory and GPU endpoints blue (C1), switches and links amber (C2). -->
  <rect width="680" height="214" fill="#ffffff"/>
  <!-- boundaries -->
  <rect x="10" y="10" width="660" height="194" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="24" y="30" font-size="12" font-weight="700" fill="#b45309">Fabric path</text>
  <rect x="20" y="40" width="480" height="150" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="34" y="58" font-size="12" font-weight="700" fill="#0f172a">Node</text>
  <rect x="30" y="68" width="280" height="108" rx="4" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="44" y="86" font-size="12" font-weight="700" fill="#14294E">Package</text>
  <!-- links -->
  <line x1="130" y1="130" x2="210" y2="130" stroke="#d97706" stroke-width="1.5"/>
  <line x1="300" y1="130" x2="390" y2="130" stroke="#d97706" stroke-width="1.5"/>
  <line x1="480" y1="130" x2="570" y2="130" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="123" text-anchor="middle" font-size="11" fill="#475569">on-package</text>
  <text x="355" y="123" text-anchor="middle" font-size="11" fill="#475569">intra-node</text>
  <text x="535" y="123" text-anchor="middle" font-size="11" fill="#475569">inter-node</text>
  <!-- endpoints: C1 tiles -->
  <rect x="40" y="106" width="90" height="48" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="85" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Local SRAM</text>
  <rect x="210" y="106" width="90" height="48" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="255" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">HBM</text>
  <rect x="390" y="106" width="90" height="48" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="435" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Peer GPU</text>
  <rect x="570" y="106" width="90" height="48" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="615" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Switches</text>
  <text x="615" y="143" text-anchor="middle" font-size="11" fill="#475569">to remote node</text>
</svg>
