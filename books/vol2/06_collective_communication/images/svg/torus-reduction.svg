    <g transform="translate(175, 192)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Node(1,2)</text>
      <text x="34" y="27" text-anchor="middle" font-size="8.5" fill="#14294E">rank 9</text>
