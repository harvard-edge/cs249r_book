    </marker>
    <marker id="arrow-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ===== 4×4 TORUS GRID ===== -->
  <!-- Col 0: x=85, Col 1: x=175, Col 2: x=265, Col 3: x=355. Node w=68, h=36 -->
  <!-- Row 0: y=32, Row 1: y=112, Row 2: y=192, Row 3: y=272 -->

  <!-- Phase 1: X-Dimension Horizontal Links (Amber) -->
  <g id="phase1-horizontal-links" stroke="#d97706" stroke-width="1.4">
    <!-- Row 0 -->
    <line x1="153" y1="50" x2="173" y2="50" marker-end="url(#arrow-amber)"/>
    <line x1="243" y1="50" x2="263" y2="50" marker-end="url(#arrow-amber)"/>
    <line x1="333" y1="50" x2="353" y2="50" marker-end="url(#arrow-amber)"/>
    <!-- Row 0 Wrap-around -->
    <path d="M 423 50 H 442 V 22 H 66 V 50 H 83" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>

    <!-- Row 1 -->
    <line x1="153" y1="130" x2="173" y2="130" marker-end="url(#arrow-amber)"/>
    <line x1="243" y1="130" x2="263" y2="130" marker-end="url(#arrow-amber)"/>
    <line x1="333" y1="130" x2="353" y2="130" marker-end="url(#arrow-amber)"/>
    <!-- Row 1 Wrap-around -->
