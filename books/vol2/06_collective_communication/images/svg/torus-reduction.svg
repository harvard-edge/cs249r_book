<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="420" fill="#ffffff"/>

  <defs>
    <marker id="arrow-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== 4×4 TORUS GRID ===== -->
  <!-- Col 0: x=85, Col 1: x=175, Col 2: x=265, Col 3: x=355. Node w=68, h=36 -->
  <!-- Row 0: y=32, Row 1: y=112, Row 2: y=192, Row 3: y=272 -->

  <!-- Phase 1: X-Dimension Horizontal Links (Amber) -->
  <g id="phase1-horizontal-links" stroke="#d97706" stroke-width="1.4">
    <!-- Row 0 -->
    <line x1="153" y1="50" x2="173" y2="50" marker-end="url(#arrow-amber)"/>
    <line x1="243" y1="50" x2="263" y2="50" marker-end="url(#arrow-amber)"/>
    <line x1="333" y1="50" x2="353" y2="50" marker-end="url(#arrow-amber)"/>
    <!-- Row 0 Wrap-around -->
    <path d="M 423 50 H 442 V 22 H 66 V 50 H 83" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>

    <!-- Row 1 -->
    <line x1="153" y1="130" x2="173" y2="130" marker-end="url(#arrow-amber)"/>
    <line x1="243" y1="130" x2="263" y2="130" marker-end="url(#arrow-amber)"/>
    <line x1="333" y1="130" x2="353" y2="130" marker-end="url(#arrow-amber)"/>
    <!-- Row 1 Wrap-around -->
    <path d="M 423 130 H 442 V 102 H 66 V 130 H 83" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>

    <!-- Row 2 -->
    <line x1="153" y1="210" x2="173" y2="210" marker-end="url(#arrow-amber)"/>
    <line x1="243" y1="210" x2="263" y2="210" marker-end="url(#arrow-amber)"/>
    <line x1="333" y1="210" x2="353" y2="210" marker-end="url(#arrow-amber)"/>
    <!-- Row 2 Wrap-around -->
    <path d="M 423 210 H 442 V 182 H 66 V 210 H 83" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>

    <!-- Row 3 -->
    <line x1="153" y1="290" x2="173" y2="290" marker-end="url(#arrow-amber)"/>
    <line x1="243" y1="290" x2="263" y2="290" marker-end="url(#arrow-amber)"/>
    <line x1="333" y1="290" x2="353" y2="290" marker-end="url(#arrow-amber)"/>
    <!-- Row 3 Wrap-around -->
    <path d="M 423 290 H 442 V 262 H 66 V 290 H 83" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
  </g>

  <!-- Phase 2: Y-Dimension Vertical Links (Purple) -->
  <g id="phase2-vertical-links" stroke="#7c3aed" stroke-width="1.4">
    <!-- Col 0 -->
    <line x1="119" y1="68" x2="119" y2="110" marker-end="url(#arrow-purple)"/>
    <line x1="119" y1="148" x2="119" y2="190" marker-end="url(#arrow-purple)"/>
    <line x1="119" y1="228" x2="119" y2="270" marker-end="url(#arrow-purple)"/>
    <!-- Col 0 Wrap-around -->
    <path d="M 119 308 V 324 H 50 V 16 H 119 V 30" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>

    <!-- Col 1 -->
    <line x1="209" y1="68" x2="209" y2="110" marker-end="url(#arrow-purple)"/>
    <line x1="209" y1="148" x2="209" y2="190" marker-end="url(#arrow-purple)"/>
    <line x1="209" y1="228" x2="209" y2="270" marker-end="url(#arrow-purple)"/>
    <!-- Col 1 Wrap-around -->
    <path d="M 209 308 V 324 H 164 V 16 H 209 V 30" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>

    <!-- Col 2 -->
    <line x1="299" y1="68" x2="299" y2="110" marker-end="url(#arrow-purple)"/>
    <line x1="299" y1="148" x2="299" y2="190" marker-end="url(#arrow-purple)"/>
    <line x1="299" y1="228" x2="299" y2="270" marker-end="url(#arrow-purple)"/>
    <!-- Col 2 Wrap-around -->
    <path d="M 299 308 V 324 H 254 V 16 H 299 V 30" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>

    <!-- Col 3 -->
    <line x1="389" y1="68" x2="389" y2="110" marker-end="url(#arrow-purple)"/>
    <line x1="389" y1="148" x2="389" y2="190" marker-end="url(#arrow-purple)"/>
    <line x1="389" y1="228" x2="389" y2="270" marker-end="url(#arrow-purple)"/>
    <!-- Col 3 Wrap-around -->
    <path d="M 389 308 V 324 H 344 V 16 H 389 V 30" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>
  </g>

  <!-- 16 Compute Nodes -->
  <g id="torus-nodes" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Row 0 -->
    <g transform="translate(85, 32)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(0,0)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 0</text>
    </g>
    <g transform="translate(175, 32)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(1,0)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 1</text>
    </g>
    <g transform="translate(265, 32)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(2,0)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 2</text>
    </g>
    <g transform="translate(355, 32)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(3,0)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 3</text>
    </g>

    <!-- Row 1 -->
    <g transform="translate(85, 112)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(0,1)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 4</text>
    </g>
    <g transform="translate(175, 112)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(1,1)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 5</text>
    </g>
    <g transform="translate(265, 112)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(2,1)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 6</text>
    </g>
    <g transform="translate(355, 112)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(3,1)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 7</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(85, 192)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(0,2)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 8</text>
    </g>
    <g transform="translate(175, 192)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(1,2)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 9</text>
    </g>
    <g transform="translate(265, 192)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(2,2)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 10</text>
    </g>
    <g transform="translate(355, 192)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(3,2)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 11</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(85, 272)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(0,3)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 12</text>
    </g>
    <g transform="translate(175, 272)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(1,3)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 13</text>
    </g>
    <g transform="translate(265, 272)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(2,3)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 14</text>
    </g>
    <g transform="translate(355, 272)">
      <rect width="68" height="36" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="34" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Node(3,3)</text>
      <text x="34" y="27" text-anchor="middle" font-size="7.5" fill="#14294E">rank 15</text>
    </g>
  </g>

  <!-- ===== RIGHT SIDE ANNOTATION CARDS ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Phase 1 Card -->
    <rect x="475" y="25" width="205" height="60" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="487" y="43" font-size="9.5" font-weight="700" fill="#b45309">Phase 1: X-Dimension Rings</text>
    <text x="487" y="58" font-size="8" fill="#78350f">Ring AllReduce along each row in parallel</text>
    <text x="487" y="72" font-size="7.5" fill="#92400e"><tspan font-weight="600">Topology:</tspan> 4 rings parallel <tspan font-weight="600" dx="6">Steps:</tspan> 2(X - 1) = 6</text>

    <!-- Phase 2 Card -->
    <rect x="475" y="95" width="205" height="60" rx="4" fill="#f3e8ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="487" y="113" font-size="9.5" font-weight="700" fill="#6d28d9">Phase 2: Y-Dimension Rings</text>
    <text x="487" y="128" font-size="8" fill="#5b21b6">Ring AllReduce along each column in parallel</text>
    <text x="487" y="142" font-size="7.5" fill="#4c1d95"><tspan font-weight="600">Topology:</tspan> 4 rings parallel <tspan font-weight="600" dx="6">Steps:</tspan> 2(Y - 1) = 6</text>

    <!-- Latency Advantage Card -->
    <rect x="475" y="165" width="205" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="487" y="183" font-size="9" font-weight="700" fill="#0f172a">Latency &amp; Step Complexity</text>
    <line x1="487" y1="190" x2="665" y2="190" stroke="#e2e8f0" stroke-width="1"/>
    <text x="487" y="205" font-size="8" fill="#475569">1D Global Ring (N = 16):</text>
    <text x="665" y="205" text-anchor="end" font-size="8" font-weight="600" fill="#b91c1c">30 steps</text>
    <text x="487" y="222" font-size="8" fill="#475569">2D Torus 4×4: 2(X-1) + 2(Y-1):</text>
    <text x="665" y="222" text-anchor="end" font-size="8" font-weight="700" fill="#15803d">12 steps</text>
    <rect x="487" y="232" width="181" height="18" rx="2" fill="#dcfce7"/>
    <text x="577" y="244" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">2.5× Step Latency Reduction</text>

    <!-- Bandwidth Cost Card -->
    <rect x="475" y="267" width="205" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="487" y="284" font-size="9" font-weight="700" fill="#0f172a">Bandwidth Volume Invariant</text>
    <text x="487" y="299" font-size="8" fill="#475569">Total volume = 2 × (N - 1)/N × M ≈ 2M / β</text>
    <text x="487" y="309" font-size="7.5" fill="#64748b">Identical link utilization to a flat ring</text>

    <!-- Legend -->
    <g transform="translate(475, 328)">
      <line x1="0" y1="6" x2="22" y2="6" stroke="#d97706" stroke-width="2"/>
      <text x="28" y="9" font-size="8" fill="#334155">Phase 1: X-dim horizontal ring</text>

      <line x1="0" y1="20" x2="22" y2="20" stroke="#7c3aed" stroke-width="2"/>
      <text x="28" y="23" font-size="8" fill="#334155">Phase 2: Y-dim vertical ring</text>

      <line x1="0" y1="34" x2="22" y2="34" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="28" y="37" font-size="8" fill="#64748b">Dashed: wrap-around torus boundary links</text>
    </g>
  </g>
</svg>