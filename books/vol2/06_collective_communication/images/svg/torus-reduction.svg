<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 8 410 346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="46" y="8" width="410" height="346" fill="#ffffff"/>

  <defs>
