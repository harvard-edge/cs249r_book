<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Layer-wise overlap on a time axis. Compute lane: backward L4..L1, each followed by a solid amber slice o (nonoverlappable overhead that occupies the GPU), then idle while AllReduce L1 runs, then the optimizer step. Network lane: each AllReduce transfer starts when its o slice ends. Shaded band = exposed time. -->
  <defs>
    <marker id="arr-time" markerWidth="7.2" markerHeight="5.4" refX="6.2" refY="2.7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.2,2.7 L0,5.4 Z" fill="#475569"/></marker>
  </defs>
  <rect width="832" height="286" fill="#ffffff"/>
  <g transform="translate(0,4)">
  <rect x="602" y="34" width="124" height="144" rx="0" fill="#eef2f6"/>
  <text x="664" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">exposed</text>
  <text x="20" y="83" font-size="14.5" font-weight="700" fill="#0f172a">Compute</text>
  <text x="20" y="151" font-size="14.5" font-weight="700" fill="#0f172a">Network</text>
  <rect x="120" y="56" width="110" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="175" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">Backward L4</text>
  <rect x="230" y="56" width="14" height="44" rx="0" fill="#d97706"/>
  <text x="237" y="116" text-anchor="middle" font-size="14" font-style="italic" fill="#b45309">o</text>
  <rect x="244" y="124" width="110" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="299" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">AllReduce L4</text>
  <rect x="244" y="56" width="110" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="299" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">Backward L3</text>
  <rect x="354" y="56" width="14" height="44" rx="0" fill="#d97706"/>
  <text x="361" y="116" text-anchor="middle" font-size="14" font-style="italic" fill="#b45309">o</text>
  <rect x="368" y="124" width="110" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="423" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">AllReduce L3</text>
  <rect x="368" y="56" width="110" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="423" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">Backward L2</text>
  <rect x="478" y="56" width="14" height="44" rx="0" fill="#d97706"/>
  <text x="485" y="116" text-anchor="middle" font-size="14" font-style="italic" fill="#b45309">o</text>
  <rect x="492" y="124" width="110" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="547" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">AllReduce L2</text>
  <rect x="492" y="56" width="110" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="547" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">Backward L1</text>
  <rect x="602" y="56" width="14" height="44" rx="0" fill="#d97706"/>
  <text x="609" y="116" text-anchor="middle" font-size="14" font-style="italic" fill="#b45309">o</text>
  <rect x="616" y="124" width="110" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="671" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">AllReduce L1</text>
  <rect x="616" y="56" width="110" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="671" y="83" text-anchor="middle" font-size="14" fill="#475569">GPU idle</text>
  <rect x="726" y="56" width="86" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="769" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">Optimizer</text>
  <path d="M245,180 v6 H600 v-6" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="423" y="204" text-anchor="middle" font-size="14" fill="#475569">hidden behind backward compute</text>
  <line x1="120" y1="226" x2="800" y2="226" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-time)"/>
  <text x="110" y="231" text-anchor="end" font-size="14" fill="#475569">time</text>
  <rect x="120" y="244" width="14" height="18" rx="0" fill="#d97706"/>
  <text x="142" y="258" font-size="14" fill="#475569"><tspan font-style="italic">o</tspan>: nonoverlappable overhead, occupies the GPU</text>
  </g>
</svg>
