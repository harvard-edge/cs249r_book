<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== ROW LABELS (Left) ===== -->
  <g transform="translate(15, 60)">
    <rect x="0" y="0" width="85" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="42" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#0369a1">Backward</text>
    <text x="42" y="35" text-anchor="middle" font-size="8" font-weight="600" fill="#0c4a6e">Compute Pass</text>
  </g>

  <g transform="translate(15, 175)">
    <rect x="0" y="0" width="85" height="52" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="42" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">AllReduce</text>
    <text x="42" y="35" text-anchor="middle" font-size="8" font-weight="600" fill="#78350f">Fabric Comms</text>
  </g>

  <!-- ===== PIPELINED OVERLAP WINDOW HIGHLIGHT BACKGROUND ===== -->
  <g transform="translate(225, 30)">
    <rect x="0" y="0" width="345" height="225" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="72" y="-12" width="200" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="172" y="4" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">100% Pipelined Overlap Window</text>
  </g>

  <!-- ===== ROW 1: BACKWARD PASS (Compute Blue) ===== -->
  <!-- Layer L4 (First to compute in reverse graph) -->
  <g transform="translate(110, 60)">
    <rect x="0" y="0" width="110" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="55" y="23" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Backward L4</text>
    <text x="55" y="38" text-anchor="middle" font-size="8" fill="#0369a1">Compute ∇W₄</text>
  </g>

  <!-- Layer L3 -->
  <g transform="translate(225, 60)">
    <rect x="0" y="0" width="110" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="55" y="23" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Backward L3</text>
    <text x="55" y="38" text-anchor="middle" font-size="8" fill="#0369a1">Compute ∇W₃</text>
  </g>

  <!-- Layer L2 -->
  <g transform="translate(340, 60)">
    <rect x="0" y="0" width="110" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="55" y="23" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Backward L2</text>
    <text x="55" y="38" text-anchor="middle" font-size="8" fill="#0369a1">Compute ∇W₂</text>
  </g>

  <!-- Layer L1 -->
  <g transform="translate(455, 60)">
    <rect x="0" y="0" width="110" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="55" y="23" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Backward L1</text>
    <text x="55" y="38" text-anchor="middle" font-size="8" fill="#0369a1">Compute ∇W₁</text>
  </g>

  <!-- Exposed Wait Stall (Idle Compute during L1 AllReduce) -->
  <g transform="translate(575, 60)">
    <rect x="0" y="0" width="125" height="52" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="62" y="23" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">Compute Idle Stall</text>
    <text x="62" y="38" text-anchor="middle" font-size="7.5" font-weight="600" fill="#dc2626">Waiting for ∇W₁ Sync</text>
  </g>

  <!-- ===== TRIGGER ARROWS (Autograd Hook triggers NCCL AllReduce) ===== -->
  <!-- L4 triggers AllReduce L4 -->
  <path d="M 220,95 L 235,95 L 235,170" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- L3 triggers AllReduce L3 -->
  <path d="M 335,95 L 350,95 L 350,170" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- L2 triggers AllReduce L2 -->
  <path d="M 450,95 L 465,95 L 465,170" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- L1 triggers AllReduce L1 -->
  <path d="M 565,95 L 580,95 L 580,170" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ===== ROW 2: ALLREDUCE PIPELINE (Fabric Amber & Exposed Red) ===== -->
  <!-- Overlapped AllReduce L4 -->
  <g transform="translate(230, 175)">
    <rect x="0" y="0" width="105" height="52" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="52" y="23" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">AllReduce L4</text>
    <text x="52" y="38" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">100% Hidden</text>
  </g>

  <!-- Overlapped AllReduce L3 -->
  <g transform="translate(345, 175)">
    <rect x="0" y="0" width="105" height="52" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="52" y="23" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">AllReduce L3</text>
    <text x="52" y="38" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">100% Hidden</text>
  </g>

  <!-- Overlapped AllReduce L2 -->
  <g transform="translate(460, 175)">
    <rect x="0" y="0" width="105" height="52" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="52" y="23" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">AllReduce L2</text>
    <text x="52" y="38" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">100% Hidden</text>
  </g>

  <!-- Exposed AllReduce L1 (No compute left to hide behind!) -->
  <g transform="translate(575, 175)">
    <rect x="0" y="0" width="125" height="52" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="62" y="23" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">AllReduce L1</text>
    <text x="62" y="38" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">EXPOSED LATENCY</text>
  </g>

  <!-- ===== TIME AXIS ===== -->
  <g transform="translate(110, 260)">
    <line x1="0" y1="0" x2="575" y2="0" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
    <text x="585" y="4" font-size="8" fill="#64748b">Time</text>

    <!-- Time Marks -->
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#94a3b8" stroke-width="1"/>
    <text x="0" y="14" text-anchor="middle" font-size="7.5" fill="#64748b">t₀</text>

    <line x1="115" y1="-3" x2="115" y2="3" stroke="#94a3b8" stroke-width="1"/>
    <text x="115" y="14" text-anchor="middle" font-size="7.5" fill="#64748b">L4 Done</text>

    <line x1="230" y1="-3" x2="230" y2="3" stroke="#94a3b8" stroke-width="1"/>
    <text x="230" y="14" text-anchor="middle" font-size="7.5" fill="#64748b">L3 Done</text>

    <line x1="345" y1="-3" x2="345" y2="3" stroke="#94a3b8" stroke-width="1"/>
    <text x="345" y="14" text-anchor="middle" font-size="7.5" fill="#64748b">L2 Done</text>

    <line x1="460" y1="-3" x2="460" y2="3" stroke="#94a3b8" stroke-width="1"/>
    <text x="460" y="14" text-anchor="middle" font-size="7.5" fill="#dc2626" font-weight="700">Compute Ends</text>

    <line x1="565" y1="-3" x2="565" y2="3" stroke="#94a3b8" stroke-width="1"/>
    <text x="565" y="14" text-anchor="middle" font-size="7.5" fill="#16a34a" font-weight="700">Step Boundary</text>
  </g>

  <!-- ===== BOTTOM TAKEAWAY CARD ===== -->
  <g transform="translate(15, 305)">
    <rect x="0" y="0" width="690" height="125" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="690" height="22" rx="4" fill="#f1f5f9"/>
    <text x="345" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Pipelined AllReduce Overlap Principles (PyTorch DDP / NCCL)</text>

    <g transform="translate(20, 30)">
      <text x="0" y="14" font-size="8.5" font-weight="700" fill="#15803d">1. Reverse Autograd Launch:</text>
      <text x="160" y="14" font-size="8.5" fill="#475569">Backpropagation executes in reverse topological order (L4 → L1). As each layer finishes,</text>
      <text x="160" y="26" font-size="8.5" fill="#475569">autograd hooks immediately stage its gradient tensor into a communication bucket.</text>

      <text x="0" y="44" font-size="8.5" font-weight="700" fill="#92400e">2. Asynchronous Overlap:</text>
      <text x="160" y="44" font-size="8.5" fill="#475569">AllReduce for layer L_i executes concurrently on a dedicated CUDA communication stream</text>
      <text x="160" y="56" font-size="8.5" fill="#475569">while GPU Tensor Cores simultaneously compute gradients for earlier layer L_{i-1}.</text>

      <text x="0" y="74" font-size="8.5" font-weight="700" fill="#b91c1c">3. The Critical Tail Barrier:</text>
      <text x="160" y="74" font-size="8.5" fill="#475569">The first layer (L1) has no remaining computation to overlap with. Its AllReduce is 100% exposed,</text>
      <text x="160" y="86" font-size="8.5" font-weight="600" fill="#b91c1c">forming the hard synchronization floor before the optimizer step can update weights.</text>
    </g>
  </g>
</svg>