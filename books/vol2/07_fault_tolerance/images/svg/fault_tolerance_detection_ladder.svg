<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="72.63pt" height="99.9pt" viewBox="0 0 72.63 99.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
 <!-- Detection latency, log scale (width = -24.15 + 22.37*log10(seconds)). Bars end at the upper bounds of tbl-fault-tolerance-detection-latencies:
      crash 30 s, GPU hang 120 s, partition 180 s. SDC is "minutes to hours": solid to 1 h, then a dotted open end (uncertain, unbounded). -->
 <rect x="0" y="0" width="72.6" height="99.9" fill="#ffffff"/>
 <g fill="#5E6B73" fill-opacity="0.9">
  <rect x="1.4" y="8" width="55.4" height="16"/>
  <rect x="1.4" y="32.2" width="26.3" height="16"/>
  <rect x="1.4" y="56.5" width="22.4" height="16"/>
  <rect x="1.4" y="80.8" width="8.9" height="16"/>
 </g>
 <rect x="56.8" y="8" width="13.6" height="16" fill="#5E6B73" fill-opacity="0.2"/>
 <g stroke="#5E6B73" stroke-width="0.6" stroke-dasharray="1,1" fill="none">
  <line x1="56.8" y1="8.3" x2="70.4" y2="8.3"/>
  <line x1="56.8" y1="23.7" x2="70.4" y2="23.7"/>
 </g>
 <line x1="1.4" y1="98.5" x2="71.2" y2="98.5" stroke="#cccccc" stroke-width="0.6"/>
 <g font-size="5.2">
  <text x="54.3" y="15.0" fill="#ffffff" text-anchor="end">SDC</text>
  <text x="54.3" y="21.5" fill="#ffffff" text-anchor="end">hours</text>
  <text x="30.3" y="39.3" fill="#333333">Partition</text>
  <text x="30.3" y="45.8" fill="#333333">≤180 s</text>
  <text x="26.4" y="63.5" fill="#333333">GPU hang</text>
  <text x="26.4" y="70.0" fill="#333333">≤120 s</text>
  <text x="13.0" y="87.8" fill="#333333">Crash</text>
  <text x="13.0" y="94.3" fill="#333333">≤30 s</text>
 </g>
 <text x="71.2" y="95.6" font-size="5" fill="#777777" text-anchor="end">log scale</text>
</svg>
