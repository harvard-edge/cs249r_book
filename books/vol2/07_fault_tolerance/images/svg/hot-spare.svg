<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 445">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Canvas background (clean, no outer border) -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CARD 1: ACTIVE CLUSTER (4+1 REDUNDANCY)                               -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 16)">
    <!-- Container -->
    <rect width="620" height="174" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Header banner -->
    <path d="M 0,4 Q 0,0 4,0 L 616,0 Q 620,0 620,4 L 620,28 L 0,28 Z" fill="#f1f5f9"/>
    <line x1="0" y1="28" x2="620" y2="28" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="19" font-size="11" font-weight="700" fill="#334155">Active Training Cluster: N+1 Redundancy Scheme</text>
    <text x="606" y="19" text-anchor="end" font-size="9.5" fill="#64748b">4 Active GPUs + 1 Standby Hot Spare</text>

    <!-- GPU 0 (Active) -->
    <g transform="translate(18, 42)">
      <rect width="104" height="66" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="52" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">GPU 0</text>
      <text x="52" y="38" text-anchor="middle" font-size="9.5" fill="#64748b">Rank 0</text>
      <rect x="12" y="44" width="80" height="14" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="52" y="54.5" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">ACTIVE</text>
    </g>

    <!-- GPU 1 (Active) -->
    <g transform="translate(138, 42)">
      <rect width="104" height="66" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="52" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">GPU 1</text>
      <text x="52" y="38" text-anchor="middle" font-size="9.5" fill="#64748b">Rank 1</text>
      <rect x="12" y="44" width="80" height="14" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="52" y="54.5" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">ACTIVE</text>
    </g>

    <!-- GPU 2 (FAILED) -->
    <g transform="translate(258, 42)">
      <rect width="104" height="66" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="52" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">GPU 2</text>
      <text x="52" y="38" text-anchor="middle" font-size="9.5" fill="#b91c1c">Rank 2 (Fault)</text>
      <!-- Subtle cross line -->
      <line x1="20" y1="12" x2="84" y2="44" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
      <line x1="84" y1="12" x2="20" y2="44" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
      <rect x="12" y="44" width="80" height="14" rx="2" fill="#dc2626"/>
      <text x="52" y="54.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">FAILED</text>
    </g>

    <!-- GPU 3 (Active) -->
    <g transform="translate(378, 42)">
      <rect width="104" height="66" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="52" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">GPU 3</text>
      <text x="52" y="38" text-anchor="middle" font-size="9.5" fill="#64748b">Rank 3</text>
      <rect x="12" y="44" width="80" height="14" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="52" y="54.5" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">ACTIVE</text>
    </g>

    <!-- Hot Spare GPU (Standby) -->
    <g transform="translate(498, 42)">
      <rect width="104" height="66" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="52" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Hot Spare</text>
      <text x="52" y="38" text-anchor="middle" font-size="9.5" fill="#64748b">Synchronized</text>
      <rect x="12" y="44" width="80" height="14" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="52" y="54.5" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">STANDBY</text>
    </g>

    <!-- Failover path arrow -->
    <path d="M 550,118 C 550,148 390,148 314,122" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-green)"/>
    <rect x="375" y="140" width="125" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="437.5" y="152.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Fast Failover (seconds)</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CARD 2: REDUNDANCY STRATEGY COMPARISON                                -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 204)">
    <!-- Container -->
    <rect width="620" height="182" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Header banner -->
    <path d="M 0,4 Q 0,0 4,0 L 616,0 Q 620,0 620,4 L 620,28 L 0,28 Z" fill="#f1f5f9"/>
    <line x1="0" y1="28" x2="620" y2="28" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Columns Header -->
    <text x="80" y="18.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Strategy</text>
    <text x="235" y="18.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Standby State</text>
    <text x="375" y="18.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Recovery Latency</text>
    <text x="525" y="18.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Training Impact</text>

    <!-- Row 1: Hot Spare -->
    <g transform="translate(0, 28)">
      <rect width="620" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <rect x="18" y="10" width="124" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="80" y="23" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Hot Spare</text>
      <text x="80" y="33" text-anchor="middle" font-size="7.5" fill="#16a34a">(recommended)</text>

      <text x="235" y="22" text-anchor="middle" font-size="9" fill="#334155">Synchronized with cluster</text>
      <text x="235" y="34" text-anchor="middle" font-size="8" fill="#64748b">Receiving state &amp; ring updates</text>

      <rect x="330" y="14" width="90" height="20" rx="2" fill="#dcfce7"/>
      <text x="375" y="27.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">Seconds</text>

      <text x="525" y="22" text-anchor="middle" font-size="9" fill="#334155">Near-zero interruption</text>
      <text x="525" y="34" text-anchor="middle" font-size="8" fill="#64748b">Training continues without reset</text>
    </g>

    <!-- Row 2: Cold Spare -->
    <g transform="translate(0, 76)">
      <rect width="620" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <rect x="18" y="10" width="124" height="28" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="80" y="23" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">Cold Spare</text>
      <text x="80" y="33" text-anchor="middle" font-size="7.5" fill="#d97706">(idle reserve)</text>

      <text x="235" y="22" text-anchor="middle" font-size="9" fill="#334155">Powered idle hardware</text>
      <text x="235" y="34" text-anchor="middle" font-size="8" fill="#64748b">Requires node boot &amp; rank join</text>

      <rect x="330" y="14" width="90" height="20" rx="2" fill="#fef3c7"/>
      <text x="375" y="27.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">Minutes</text>

      <text x="525" y="22" text-anchor="middle" font-size="9" fill="#334155">Moderate downtime</text>
      <text x="525" y="34" text-anchor="middle" font-size="8" fill="#64748b">Rollback to prior checkpoint</text>
    </g>

    <!-- Row 3: No Spare -->
    <g transform="translate(0, 124)">
      <rect width="620" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <rect x="18" y="10" width="124" height="28" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="80" y="23" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">No Spare</text>
      <text x="80" y="33" text-anchor="middle" font-size="7.5" fill="#dc2626">(reactive)</text>

      <text x="235" y="22" text-anchor="middle" font-size="9" fill="#334155">Unallocated / absent</text>
      <text x="235" y="34" text-anchor="middle" font-size="8" fill="#64748b">Wait for data center RMA/repair</text>

      <rect x="330" y="14" width="90" height="20" rx="2" fill="#fee2e2"/>
      <text x="375" y="27.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">Hours to Days</text>

      <text x="525" y="22" text-anchor="middle" font-size="9" fill="#334155">Cluster stalled</text>
      <text x="525" y="34" text-anchor="middle" font-size="8" fill="#64748b">Idle compute burn across all ranks</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM LEGEND & FOOTNOTE (Split cleanly across two lines)             -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(36, 404)">
    <!-- Legend items -->
    <rect x="0" y="0" width="12" height="10" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="18" y="8.5" font-size="8.5" fill="#475569">Active GPU</text>

    <rect x="86" y="0" width="12" height="10" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="104" y="8.5" font-size="8.5" fill="#475569">Hot Spare (Standby)</text>

    <rect x="210" y="0" width="12" height="10" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="228" y="8.5" font-size="8.5" fill="#475569">Failed GPU</text>

    <line x1="295" y1="5" x2="315" y2="5" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="322" y="8.5" font-size="8.5" fill="#475569">Failover migration</text>
  </g>

  <g transform="translate(36, 424)">
    <text x="304" y="8.5" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic">N+1 redundancy trades spare hardware cost for near-instantaneous MTTR</text>
  </g>
</svg>
