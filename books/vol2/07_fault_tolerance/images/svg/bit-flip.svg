<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ==================== TOP SECTION: WORD VALUE COMPARISON ==================== -->
  <!-- Original Value Section -->
  <text x="195" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Original Value: 74 (0x4A)</text>

  <!-- Corrupted Value Section -->
  <text x="535" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">Corrupted Value: 78 (0x4E)</text>

  <!-- Bit position labels -->
  <!-- Left word bit labels -->
  <g font-size="8" fill="#64748b" text-anchor="middle">
    <text x="70" y="44">b7</text>
    <text x="108" y="44">b6</text>
    <text x="146" y="44">b5</text>
    <text x="184" y="44">b4</text>
    <text x="222" y="44">b3</text>
    <text x="260" y="44">b2</text>
    <text x="298" y="44">b1</text>
    <text x="336" y="44">b0</text>
  </g>

  <!-- Right word bit labels -->
  <g font-size="8" fill="#64748b" text-anchor="middle">
    <text x="410" y="44">b7</text>
    <text x="448" y="44">b6</text>
    <text x="486" y="44">b5</text>
    <text x="524" y="44">b4</text>
    <text x="562" y="44">b3</text>
    <text x="600" y="44" font-weight="700" fill="#dc2626">b2</text>
    <text x="638" y="44">b1</text>
    <text x="676" y="44">b0</text>
  </g>

  <!-- Left word cells: 01001010 -->
  <g>
    <!-- bit 7: 0 -->
    <rect x="55" y="52" width="30" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="70" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
    <!-- bit 6: 1 -->
    <rect x="93" y="52" width="30" height="46" rx="3" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
    <text x="108" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1F407A">1</text>
    <!-- bit 5: 0 -->
    <rect x="131" y="52" width="30" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="146" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
    <!-- bit 4: 0 -->
    <rect x="169" y="52" width="30" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="184" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
    <!-- bit 3: 1 -->
    <rect x="207" y="52" width="30" height="46" rx="3" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
    <text x="222" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1F407A">1</text>
    <!-- bit 2: 0 -->
    <rect x="245" y="52" width="30" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="260" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
    <!-- bit 1: 1 -->
    <rect x="283" y="52" width="30" height="46" rx="3" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
    <text x="298" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1F407A">1</text>
    <!-- bit 0: 0 -->
    <rect x="321" y="52" width="30" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="336" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
  </g>

  <!-- Powers of 2 under left word -->
  <g font-size="8" fill="#64748b" text-anchor="middle">
    <text x="70" y="110">128</text>
    <text x="108" y="110" font-weight="700" fill="#1F407A">64</text>
    <text x="146" y="110">32</text>
    <text x="184" y="110">16</text>
    <text x="222" y="110" font-weight="700" fill="#1F407A">8</text>
    <text x="260" y="110">4</text>
    <text x="298" y="110" font-weight="700" fill="#1F407A">2</text>
    <text x="336" y="110">1</text>
  </g>
  <text x="195" y="126" text-anchor="middle" font-size="9" fill="#475569">= 64 + 8 + 2 = 74</text>

  <!-- Transition arrow in middle -->
  <g>
    <line x1="360" y1="75" x2="380" y2="75" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <text x="370" y="68" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">SEU</text>
  </g>

  <!-- Right word cells: 01001110 -->
  <g>
    <!-- bit 7: 0 -->
    <rect x="395" y="52" width="30" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="410" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
    <!-- bit 6: 1 -->
    <rect x="433" y="52" width="30" height="46" rx="3" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
    <text x="448" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1F407A">1</text>
    <!-- bit 5: 0 -->
    <rect x="471" y="52" width="30" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="486" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
    <!-- bit 4: 0 -->
    <rect x="509" y="52" width="30" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="524" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
    <!-- bit 3: 1 -->
    <rect x="547" y="52" width="30" height="46" rx="3" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
    <text x="562" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1F407A">1</text>
    <!-- bit 2: FLIPPED (0 -> 1) -->
    <rect x="585" y="49" width="30" height="52" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#dc2626">1</text>
    <!-- bit 1: 1 -->
    <rect x="623" y="52" width="30" height="46" rx="3" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
    <text x="638" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1F407A">1</text>
    <!-- bit 0: 0 -->
    <rect x="661" y="52" width="30" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="676" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
  </g>

  <!-- Powers of 2 under right word -->
  <g font-size="8" fill="#64748b" text-anchor="middle">
    <text x="410" y="110">128</text>
    <text x="448" y="110" font-weight="700" fill="#1F407A">64</text>
    <text x="486" y="110">32</text>
    <text x="524" y="110">16</text>
    <text x="562" y="110" font-weight="700" fill="#1F407A">8</text>
    <text x="600" y="110" font-weight="700" fill="#dc2626">4 (flipped)</text>
    <text x="638" y="110" font-weight="700" fill="#1F407A">2</text>
    <text x="676" y="110">1</text>
  </g>
  <text x="535" y="126" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">= 64 + 8 + 4 + 2 = 78 (+4 Silent Drift)</text>

  <!-- ==================== LOWER SECTION: PHYSICAL MECHANISM ==================== -->
  <g transform="translate(55, 142)">
    <!-- Container -->
    <rect width="636" height="222" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header band -->
    <path d="M 0,6 Q 0,0 6,0 L 630,0 Q 636,0 636,6 L 636,26 L 0,26 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="318" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Physical Inversion Mechanism in 6T SRAM Cell</text>

    <!-- LEFT SUB-PANEL: Normal vs Flipped Latch -->
    <!-- Normal State Box -->
    <g transform="translate(18, 34)">
      <rect width="270" height="66" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="15" font-size="8.5" font-weight="700" fill="#1e293b">1. Stable State Before Strike</text>

      <!-- Inverter 1 -->
      <rect x="20" y="22" width="85" height="36" rx="3" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
      <text x="62" y="36" text-anchor="middle" font-size="8" font-weight="600" fill="#1F407A">Inverter 1</text>
      <text x="62" y="48" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Q = 0 (Low)</text>

      <!-- Cross-coupling lines -->
      <line x1="105" y1="34" x2="165" y2="34" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
      <line x1="165" y1="46" x2="105" y2="46" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

      <!-- Inverter 2 -->
      <rect x="165" y="22" width="85" height="36" rx="3" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
      <text x="207" y="36" text-anchor="middle" font-size="8" font-weight="600" fill="#1F407A">Inverter 2</text>
      <text x="207" y="48" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Q̄ = 1 (High)</text>
    </g>

    <!-- Transition Ionizing Strike Badge in Gap -->
    <g transform="translate(18, 102)">
      <rect x="15" y="1" width="105" height="15" rx="3" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="67" y="11" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">⚡ Ionizing Strike (α / n)</text>
      <line x1="67" y1="16" x2="67" y2="28" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
    </g>

    <!-- Flipped State Box -->
    <g transform="translate(18, 128)">
      <rect width="270" height="82" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="12" y="15" font-size="8.5" font-weight="700" fill="#991b1b">2. Inverted State Post-Ionization</text>

      <!-- Inverter 1 Flipped -->
      <rect x="20" y="24" width="85" height="36" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="62" y="38" text-anchor="middle" font-size="8" font-weight="600" fill="#dc2626">Inverter 1</text>
      <text x="62" y="50" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Q → 1 (Flipped)</text>

      <!-- Cross coupling flipped -->
      <line x1="105" y1="36" x2="165" y2="36" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
      <line x1="165" y1="48" x2="105" y2="48" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>

      <!-- Inverter 2 Flipped -->
      <rect x="165" y="24" width="85" height="36" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="207" y="38" text-anchor="middle" font-size="8" font-weight="600" fill="#dc2626">Inverter 2</text>
      <text x="207" y="50" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Q̄ → 0 (Flipped)</text>

      <text x="135" y="72" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Feedback latch locks inverted state permanently until rewritten</text>
    </g>

    <!-- RIGHT SUB-PANEL: Architectural Insights Card -->
    <g transform="translate(306, 38)">
      <rect width="312" height="172" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="18" font-size="9.5" font-weight="700" fill="#0f172a">SEU Physics &amp; System Consequences</text>
      <line x1="14" y1="26" x2="298" y2="26" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Key Value 1 -->
      <text x="14" y="42" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan><tspan dx="4">Ionizing particle deposits charge Q_dep &gt; Q_crit at sensitive drain node.</tspan></text>

      <!-- Key Value 2 -->
      <text x="14" y="60" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Failure Class:</tspan><tspan dx="4">Soft Error (data corrupted, physical silicon lattice undamaged).</tspan></text>

      <!-- Key Value 3 -->
      <text x="14" y="78" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Terrestrial Rate:</tspan><tspan dx="4">~1–10 FIT/Mbit (~1 SEU per 100 GB memory per month at sea level).</tspan></text>

      <!-- Key Value 4 -->
      <text x="14" y="96" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Cluster Risk:</tspan><tspan dx="4">A 1,024-node cluster (80 TB memory) experiences an SEU every ~21 hours.</tspan></text>

      <!-- Mitigation Pill -->
      <rect x="14" y="110" width="284" height="50" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="24" y="126" font-size="8" font-weight="700" fill="#1e40af">Primary Hardware Defenses:</text>
      <text x="24" y="139" font-size="7.5" fill="#1e3a8a"><tspan font-weight="600">SECDED ECC:</tspan><tspan dx="3">Corrects 100% of single-bit flips; halts on double-bit flips.</tspan></text>
      <text x="24" y="151" font-size="7.5" fill="#1e3a8a"><tspan font-weight="600">Silent Data Corruption (SDC):</tspan><tspan dx="3">Unprotected registers drift weights silently.</tspan></text>
    </g>
  </g>
</svg>