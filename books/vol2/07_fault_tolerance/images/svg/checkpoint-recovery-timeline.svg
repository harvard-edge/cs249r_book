<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- One checkpoint cycle interrupted by a failure. Blue = productive compute, green = durable
       checkpoint write, red hatch = work lost since that checkpoint, red = recovery time. -->
  <defs>
    <pattern id="hatch-red" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fee2e2"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#dc2626" stroke-width="1.2"/>
    </pattern>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="150" fill="#ffffff"/>

  <!-- ===== Timeline bar ===== -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="30" width="200" height="40" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="120" y="55" fill="#14294E">compute</text>
    <rect x="220" y="30" width="60" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="250" y="55" fill="#15803d">save</text>
    <rect x="280" y="30" width="150" height="40" fill="url(#hatch-red)" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="325" y="43" width="60" height="18" fill="#ffffff"/>
    <text x="355" y="57" fill="#b91c1c">lost</text>
    <rect x="440" y="30" width="100" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="490" y="55" fill="#b91c1c">recover</text>
    <rect x="540" y="30" width="110" height="40" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="595" y="55" fill="#14294E">compute</text>
  </g>
  <line x1="650" y1="50" x2="668" y2="50" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- failure marker -->
  <line x1="435" y1="22" x2="435" y2="78" stroke="#dc2626" stroke-width="2.4"/>
  <text x="435" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">failure</text>

  <!-- ===== Brackets ===== -->
  <g stroke="#475569" stroke-width="1" fill="none">
    <path d="M20,84 V90 H220 V84"/>
    <path d="M222,84 V90 H278 V84"/>
    <path d="M282,84 V90 H430 V84"/>
    <path d="M440,84 V90 H540 V84"/>
  </g>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="120" y="108">interval τ</text>
    <text x="250" y="108">T<tspan font-size="11" dy="3">write</tspan></text>
    <text x="356" y="108">rework since save</text>
    <text x="490" y="108">T<tspan font-size="11" dy="3">recovery</tspan></text>
  </g>
  <text x="397" y="140" text-anchor="middle" font-size="12" fill="#475569">cost of one failure = rework + recovery</text>
  <path d="M282,120 V124 H540 V120" fill="none" stroke="#94a3b8" stroke-width="1"/>
</svg>
