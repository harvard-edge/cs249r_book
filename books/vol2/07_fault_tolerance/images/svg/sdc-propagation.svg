<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Top: one bit flip propagating through training state. Bottom: two recovery timelines,
       a detected error (short) against silent corruption (long). Red = fault, green = recovery. -->
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="290" fill="#ffffff"/>

  <!-- ===== Propagation chain ===== -->
  <g font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="10" y="10" width="116" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="68" y="34">Bit flip</text>
    <rect x="146" y="10" width="116" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="204" y="34">Wrong value</text>
    <rect x="282" y="10" width="116" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="340" y="34">Backward pass</text>
    <rect x="418" y="10" width="116" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="476" y="34">Weight update</text>
    <rect x="554" y="10" width="116" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="612" y="34">Quality drops</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="68" y="54">in memory or ALU</text>
    <text x="204" y="54">one tensor entry</text>
    <text x="340" y="54">taints gradients</text>
    <text x="476" y="54">commits to weights</text>
    <text x="612" y="54">seen at evaluation</text>
  </g>
  <g stroke="#dc2626" stroke-width="1.4">
    <line x1="126" y1="38" x2="144" y2="38" marker-end="url(#arr-red)"/>
    <line x1="262" y1="38" x2="280" y2="38" marker-end="url(#arr-red)"/>
    <line x1="398" y1="38" x2="416" y2="38" marker-end="url(#arr-red)"/>
    <line x1="534" y1="38" x2="552" y2="38" marker-end="url(#arr-red)"/>
  </g>

  <!-- ===== Recovery timelines ===== -->
  <line x1="10" y1="92" x2="670" y2="92" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- lane A: detected error -->
  <text x="10" y="132" font-size="13" font-weight="700" fill="#0f172a">Detected error</text>
  <line x1="150" y1="128" x2="660" y2="128" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="160" cy="128" r="6" fill="#dc2626"/>
  <text x="160" y="112" text-anchor="middle" font-size="12" fill="#b91c1c">fault</text>
  <circle cx="200" cy="128" r="6" fill="#64748b"/>
  <text x="200" y="112" text-anchor="middle" font-size="12" fill="#475569">trap</text>
  <rect x="220" y="116" width="170" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="305" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">restart from checkpoint</text>

  <!-- lane B: silent corruption -->
  <text x="10" y="196" font-size="13" font-weight="700" fill="#0f172a">Silent corruption</text>
  <line x1="150" y1="192" x2="660" y2="192" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="166" y="180" width="364" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="348" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">corrupt state saved into checkpoints</text>
  <circle cx="160" cy="192" r="6" fill="#dc2626"/>
  <text x="160" y="176" text-anchor="middle" font-size="12" fill="#b91c1c">fault</text>
  <circle cx="542" cy="192" r="6" fill="#64748b"/>
  <text x="542" y="176" text-anchor="middle" font-size="12" fill="#475569">alert</text>
  <rect x="556" y="180" width="104" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="608" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">roll back</text>

  <!-- time axis -->
  <line x1="150" y1="240" x2="662" y2="240" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="160" y="260" text-anchor="middle" font-size="12" fill="#475569">t = 0</text>
  <text x="200" y="278" text-anchor="middle" font-size="12" fill="#475569">milliseconds</text>
  <text x="542" y="260" text-anchor="middle" font-size="12" fill="#475569">hours to days</text>
  <line x1="160" y1="236" x2="160" y2="244" stroke="#64748b" stroke-width="1"/>
  <line x1="200" y1="236" x2="200" y2="244" stroke="#64748b" stroke-width="1"/>
  <line x1="542" y1="236" x2="542" y2="244" stroke="#64748b" stroke-width="1"/>
  <text x="40" y="244" font-size="12" fill="#475569">time (not to scale)</text>
</svg>
