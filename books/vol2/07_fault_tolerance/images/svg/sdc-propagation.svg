<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 495" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#475569"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#16a34a"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- 5-STAGE SDC PROPAGATION CHAIN                                         -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->

  <!-- STAGE 1 -->
  <g transform="translate(25, 20)" filter="url(#card-shadow)">
    <rect width="130" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 124,0 Q 130,0 130,6 L 130,26 L 0,26 Z" fill="#fee2e2"/>
    <text x="65" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Stage 1 · Hardware</text>
    <text x="65" y="44" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Bit-Flip (SEU)</text>
    <text x="65" y="62" text-anchor="middle" font-size="8" fill="#475569">Cosmic ray strike or</text>
    <text x="65" y="74" text-anchor="middle" font-size="8" fill="#475569">voltage droop in ALU</text>
    <rect x="15" y="86" width="100" height="18" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="65" y="98" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">UNDETECTED</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 155 77 L 168 77" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- STAGE 2 -->
  <g transform="translate(170, 20)" filter="url(#card-shadow)">
    <rect width="130" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 124,0 Q 130,0 130,6 L 130,26 L 0,26 Z" fill="#fee2e2"/>
    <text x="65" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Stage 2 · Tensor</text>
    <text x="65" y="44" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Corrupted Value</text>
    <text x="65" y="62" text-anchor="middle" font-size="8" fill="#475569">Exponent bit flips:</text>
    <text x="65" y="74" text-anchor="middle" font-size="8" fill="#475569">10⁻⁵ jumps to 10²⁰</text>
    <rect x="15" y="86" width="100" height="18" rx="3" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="65" y="98" text-anchor="middle" font-size="7.5" font-weight="700" fill="#be123c">FP EXTREMUM</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 300 77 L 313 77" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- STAGE 3 -->
  <g transform="translate(315, 20)" filter="url(#card-shadow)">
    <rect width="130" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 124,0 Q 130,0 130,6 L 130,26 L 0,26 Z" fill="#fee2e2"/>
    <text x="65" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Stage 3 · Gradients</text>
    <text x="65" y="44" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Backprop Spread</text>
    <text x="65" y="62" text-anchor="middle" font-size="8" fill="#475569">Single bad cell taints</text>
    <text x="65" y="74" text-anchor="middle" font-size="8" fill="#475569">entire backward pass</text>
    <rect x="15" y="86" width="100" height="18" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="65" y="98" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">POISON FLUSH</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 445 77 L 458 77" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- STAGE 4 -->
  <g transform="translate(460, 20)" filter="url(#card-shadow)">
    <rect width="130" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 124,0 Q 130,0 130,6 L 130,26 L 0,26 Z" fill="#fee2e2"/>
    <text x="65" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Stage 4 · Optimizer</text>
    <text x="65" y="44" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Silent Weight Shift</text>
    <text x="65" y="62" text-anchor="middle" font-size="8" fill="#475569">Corrupt gradients are</text>
    <text x="65" y="74" text-anchor="middle" font-size="8" fill="#475569">committed to weights</text>
    <rect x="15" y="86" width="100" height="18" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="65" y="98" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">CORRUPT STATE</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 590 77 L 603 77" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- STAGE 5 -->
  <g transform="translate(605, 20)" filter="url(#card-shadow)">
    <rect width="130" height="114" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <path d="M 0,6 Q 0,0 6,0 L 124,0 Q 130,0 130,6 L 130,26 L 0,26 Z" fill="#dc2626"/>
    <text x="65" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Stage 5 · Outcome</text>
    <text x="65" y="44" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">Model Degradation</text>
    <text x="65" y="62" text-anchor="middle" font-size="8" fill="#475569">Perplexity explosion,</text>
    <text x="65" y="74" text-anchor="middle" font-size="8" fill="#475569">gibberish, or NaN loss</text>
    <rect x="15" y="86" width="100" height="18" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="65" y="98" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">LATE DETECTION</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- DETECTION GAP BANNER                                                   -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(25, 148)">
    <rect width="710" height="42" rx="5" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
    <text x="355" y="17" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">Detection Gap: Microseconds to Corrupt vs. Hours or Days to Discover</text>
    <text x="355" y="32" text-anchor="middle" font-size="8" fill="#78350f">Hardware fault occurs instantly at t = 0; model validation or divergence alarms trigger only after massive compute waste</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- COMPARISON: DETECTED FAULT VS SILENT DATA CORRUPTION (SDC)            -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->

  <!-- Panel A: Hard Detected Error -->
  <g transform="translate(25, 204)" filter="url(#card-shadow)">
    <rect width="345" height="186" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 339,0 Q 345,0 345,6 L 345,28 L 0,28 Z" fill="#dcfce7"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#166534">Panel A: Detected Error (Crash / Exception)</text>
    <text x="331" y="18" text-anchor="end" font-size="8" font-weight="700" fill="#15803d">Immediate Recovery</text>

    <!-- Key-values -->
    <g transform="translate(14, 38)">
      <text x="0" y="10" font-size="8.5" fill="#0f172a">
        <tspan font-weight="700" fill="#1e293b">Fault Signal:</tspan>
        <tspan dx="4" fill="#475569">OS / driver kernel trap (SIGSEGV, Xid hardware interrupt)</tspan>
      </text>
      <text x="0" y="24" font-size="8.5" fill="#0f172a">
        <tspan font-weight="700" fill="#1e293b">Detection Latency:</tspan>
        <tspan dx="4" fill="#166534" font-weight="600">Immediate (t ≈ 0 ms) · Job halted instantly</tspan>
      </text>
      <text x="0" y="38" font-size="8.5" fill="#0f172a">
        <tspan font-weight="700" fill="#1e293b">Recovery Cost:</tspan>
        <tspan dx="4" fill="#475569">Rollback to iteration N-1 · Zero corrupt checkpoints saved</tspan>
      </text>
    </g>

    <!-- Mini Visual Timeline -->
    <g transform="translate(14, 92)">
      <rect width="317" height="80" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="20" y1="36" x2="295" y2="36" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Fault -->
      <circle cx="45" cy="36" r="6" fill="#dc2626"/>
      <text x="45" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">Fault</text>
      <text x="45" y="52" text-anchor="middle" font-size="7" fill="#64748b">t = 0</text>

      <!-- Trap -->
      <circle cx="110" cy="36" r="6" fill="#16a34a"/>
      <text x="110" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#16a34a">Trap</text>
      <text x="110" y="52" text-anchor="middle" font-size="7" fill="#64748b">+1 ms</text>

      <!-- Restart -->
      <circle cx="190" cy="36" r="6" fill="#1F407A"/>
      <text x="190" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1F407A">Restart</text>
      <text x="190" y="52" text-anchor="middle" font-size="7" fill="#64748b">Checkpoint N-1</text>

      <!-- Resumed -->
      <rect x="235" y="25" width="62" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="266" y="39" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">Resumed</text>
      <text x="266" y="58" text-anchor="middle" font-size="7" fill="#16a34a">Zero Loss</text>
    </g>
  </g>

  <!-- Panel B: Silent Data Corruption -->
  <g transform="translate(390, 204)" filter="url(#card-shadow)">
    <rect width="345" height="186" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 339,0 Q 345,0 345,6 L 345,28 L 0,28 Z" fill="#fee2e2"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#991b1b">Panel B: Silent Data Corruption (SDC)</text>
    <text x="331" y="18" text-anchor="end" font-size="8" font-weight="700" fill="#b91c1c">Prolonged Damage</text>

    <!-- Key-values -->
    <g transform="translate(14, 38)">
      <text x="0" y="10" font-size="8.5" fill="#0f172a">
        <tspan font-weight="700" fill="#1e293b">Fault Signal:</tspan>
        <tspan dx="4" fill="#475569">None; kernels finish with status OK, bypassing hardware ECC</tspan>
      </text>
      <text x="0" y="24" font-size="8.5" fill="#0f172a">
        <tspan font-weight="700" fill="#1e293b">Detection Latency:</tspan>
        <tspan dx="4" fill="#dc2626" font-weight="600">Hours to days · Only caught when evaluation metric craters</tspan>
      </text>
      <text x="0" y="38" font-size="8.5" fill="#0f172a">
        <tspan font-weight="700" fill="#1e293b">Recovery Cost:</tspan>
        <tspan dx="4" fill="#475569">Massive rollback; all intervening saved checkpoints corrupted</tspan>
      </text>
    </g>

    <!-- Mini Visual Timeline -->
    <g transform="translate(14, 92)">
      <rect width="317" height="80" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="20" y1="36" x2="295" y2="36" stroke="#fca5a5" stroke-width="2"/>
      
      <!-- Fault -->
      <circle cx="45" cy="36" r="6" fill="#dc2626"/>
      <text x="45" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">Fault</text>
      <text x="45" y="52" text-anchor="middle" font-size="7" fill="#64748b">t = 0</text>

      <!-- Undetected propagation bar -->
      <rect x="75" y="28" width="135" height="16" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="142" y="39" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">Corrupt weights saved to storage</text>

      <!-- Late Alert -->
      <circle cx="235" cy="36" r="6" fill="#d97706"/>
      <text x="235" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d97706">Alert</text>
      <text x="235" y="52" text-anchor="middle" font-size="7" fill="#d97706">t + 48 hrs</text>

      <!-- Rollback -->
      <rect x="255" y="25" width="52" height="22" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="281" y="39" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">Rollback</text>
      <text x="281" y="58" text-anchor="middle" font-size="7" fill="#dc2626">-2 days</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- OVERALL TIMELINE AXIS                                                 -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(25, 410)">
    <rect width="710" height="66" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="50" y1="28" x2="660" y2="28" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="672" y="31" font-size="8.5" font-weight="700" fill="#475569">Timeline</text>

    <!-- Ticks -->
    <line x1="70" y1="22" x2="70" y2="34" stroke="#475569" stroke-width="1.2"/>
    <text x="70" y="47" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">t = 0</text>
    <text x="70" y="57" text-anchor="middle" font-size="7" fill="#64748b">Bit flip</text>

    <line x1="210" y1="22" x2="210" y2="34" stroke="#475569" stroke-width="1.2"/>
    <text x="210" y="47" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Microseconds</text>
    <text x="210" y="57" text-anchor="middle" font-size="7" fill="#64748b">Tensor calc</text>

    <line x1="360" y1="22" x2="360" y2="34" stroke="#475569" stroke-width="1.2"/>
    <text x="360" y="47" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Seconds</text>
    <text x="360" y="57" text-anchor="middle" font-size="7" fill="#64748b">Backprop / allreduce</text>

    <line x1="500" y1="22" x2="500" y2="34" stroke="#475569" stroke-width="1.2"/>
    <text x="500" y="47" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Hours</text>
    <text x="500" y="57" text-anchor="middle" font-size="7" fill="#64748b">Bad checkpoint saved</text>

    <line x1="630" y1="22" x2="630" y2="34" stroke="#dc2626" stroke-width="1.5"/>
    <text x="630" y="47" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">Days / Weeks</text>
    <text x="630" y="57" text-anchor="middle" font-size="7" fill="#b91c1c">Eval failure discovered</text>
  </g>
</svg>