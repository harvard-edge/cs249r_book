<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="740" height="520" fill="#fff" rx="4" />

  <!-- ===== Title and legend ===== -->
  <text x="370" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#333">Transient timing glitch</text>
  <line x1="90" y1="75" x2="140" y2="75" stroke="#3d9e5a" stroke-width="4" />
  <text x="155" y="82" font-size="17" fill="#555">expected arrival</text>
  <line x1="400" y1="75" x2="450" y2="75" stroke="#c44" stroke-width="4" />
  <text x="465" y="82" font-size="17" fill="#555">delayed arrival</text>

  <!-- ===== Clock waveform ===== -->
  <text x="135" y="135" text-anchor="end" font-size="18" font-weight="700" fill="#333">Clock</text>
  <path d="M150 145 H200 V110 H270 V145 H340 V110 H420 V145 H500 V110 H580 V145 H660"
        fill="none" stroke="#4a90c4" stroke-width="4" />

  <!-- ===== Sampling edges ===== -->
  <line x1="340" y1="100" x2="340" y2="360" stroke="#777" stroke-width="2" stroke-dasharray="8,6" />
  <text x="340" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#555">sampling edge</text>
  <line x1="500" y1="100" x2="500" y2="360" stroke="#bbb" stroke-width="2" stroke-dasharray="8,6" />
  <text x="500" y="95" text-anchor="middle" font-size="16" fill="#777">next edge</text>

  <!-- ===== Expected and delayed data ===== -->
  <text x="135" y="220" text-anchor="end" font-size="18" font-weight="700" fill="#333">Expected</text>
  <path d="M150 205 H270 V245 H660" fill="none" stroke="#3d9e5a" stroke-width="5" />
  <circle cx="270" cy="225" r="7" fill="#3d9e5a" />

  <text x="135" y="310" text-anchor="end" font-size="18" font-weight="700" fill="#333">Observed</text>
  <path d="M150 295 H400 V335 H660" fill="none" stroke="#c44" stroke-width="5" />
  <circle cx="400" cy="315" r="7" fill="#c44" />

  <!-- ===== Violation window ===== -->
  <rect x="270" y="185" width="130" height="170" rx="5" fill="#f9d6d5" fill-opacity="0.45" stroke="#c44" stroke-width="2" stroke-dasharray="6,4" />
  <path d="M300 380 V350 H330" fill="none" stroke="#c44" stroke-width="2" />
  <text x="285" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#c44">temporary delay</text>
  <text x="285" y="428" text-anchor="middle" font-size="16" fill="#555">data is unsettled</text>
  <text x="285" y="448" text-anchor="middle" font-size="16" fill="#555">at the first edge</text>

  <!-- ===== Recovery ===== -->
  <path d="M500 380 V350 H530" fill="none" stroke="#3d9e5a" stroke-width="2" />
  <text x="535" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#3d9e5a">recovered</text>
  <text x="535" y="428" text-anchor="middle" font-size="16" fill="#555">the next cycle samples</text>
  <text x="535" y="448" text-anchor="middle" font-size="16" fill="#555">stable data</text>

  <!-- ===== Operational interpretation ===== -->
  <rect x="80" y="465" width="580" height="40" rx="5" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5" />
  <text x="370" y="491" text-anchor="middle" font-size="15" fill="#333">One-cycle violation; retry succeeds because no state is permanently damaged.</text>
</svg>
