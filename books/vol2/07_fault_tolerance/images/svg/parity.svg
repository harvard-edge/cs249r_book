<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- ROW 1: VALID DATA (EVEN PARITY)                                       -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(24, 16)">
    <rect width="632" height="116" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 628,0 Q 632,0 632,4 L 632,24 L 0,24 Z" fill="#f1f5f9"/>
    <line x1="0" y1="24" x2="632" y2="24" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="12" y="5" width="48" height="15" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="36" y="15.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">VALID</text>
    <text x="70" y="16" font-size="9.5" font-weight="700" fill="#334155">Transmission Word (8-bit Data + Even Parity)</text>
    <text x="618" y="16" text-anchor="end" font-size="8.5" fill="#64748b">Parity matches computed sum</text>

    <!-- 8 Data Bits -->
    <g transform="translate(18, 34)">
      <!-- b7: 1 -->
      <rect x="0" y="0" width="46" height="42" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="23" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">1</text>
      <text x="23" y="52" text-anchor="middle" font-size="8" fill="#64748b">b7</text>

      <!-- b6: 0 -->
      <rect x="52" y="0" width="46" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="75" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">0</text>
      <text x="75" y="52" text-anchor="middle" font-size="8" fill="#64748b">b6</text>

      <!-- b5: 1 -->
      <rect x="104" y="0" width="46" height="42" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="127" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">1</text>
      <text x="127" y="52" text-anchor="middle" font-size="8" fill="#64748b">b5</text>

      <!-- b4: 1 -->
      <rect x="156" y="0" width="46" height="42" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="179" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">1</text>
      <text x="179" y="52" text-anchor="middle" font-size="8" fill="#64748b">b4</text>

      <!-- b3: 0 -->
      <rect x="208" y="0" width="46" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="231" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">0</text>
      <text x="231" y="52" text-anchor="middle" font-size="8" fill="#64748b">b3</text>

      <!-- b2: 0 -->
      <rect x="260" y="0" width="46" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="283" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">0</text>
      <text x="283" y="52" text-anchor="middle" font-size="8" fill="#64748b">b2</text>

      <!-- b1: 1 -->
      <rect x="312" y="0" width="46" height="42" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="335" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">1</text>
      <text x="335" y="52" text-anchor="middle" font-size="8" fill="#64748b">b1</text>

      <!-- b0: 0 -->
      <rect x="364" y="0" width="46" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="387" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">0</text>
      <text x="387" y="52" text-anchor="middle" font-size="8" fill="#64748b">b0</text>

      <!-- Separator line -->
      <line x1="422" y1="4" x2="422" y2="46" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>

      <!-- Parity Bit -->
      <rect x="434" y="0" width="46" height="42" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="457" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">0</text>
      <text x="457" y="52" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Parity</text>

      <!-- Parity calculation badge -->
      <rect x="492" y="7" width="102" height="28" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
      <text x="543" y="19" text-anchor="middle" font-size="8" fill="#475569">Ones: 4 (even)</text>
      <text x="543" y="29.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">✓ Parity Match</text>
    </g>

    <!-- Bottom summary line -->
    <text x="20" y="104" font-size="8.5" fill="#15803d">Valid transmission: Receiver tallies 4 ones (even) → stored parity bit = 0 → parity verified, zero errors flagged.</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- ROW 2: CORRUPTED DATA (BIT FLIP DETECTED)                             -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(24, 142)">
    <rect width="632" height="116" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 628,0 Q 632,0 632,4 L 632,24 L 0,24 Z" fill="#f1f5f9"/>
    <line x1="0" y1="24" x2="632" y2="24" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="12" y="5" width="48" height="15" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="36" y="15.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">CORRUPT</text>
    <text x="70" y="16" font-size="9.5" font-weight="700" fill="#334155">Single-Bit Inversion Detected at Receiver</text>
    <text x="618" y="16" text-anchor="end" font-size="8.5" fill="#dc2626">Parity mismatch triggers fault handler</text>

    <!-- 8 Data Bits -->
    <g transform="translate(18, 34)">
      <!-- b7: 1 -->
      <rect x="0" y="0" width="46" height="42" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="23" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">1</text>
      <text x="23" y="52" text-anchor="middle" font-size="8" fill="#64748b">b7</text>

      <!-- b6: 0 -->
      <rect x="52" y="0" width="46" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="75" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">0</text>
      <text x="75" y="52" text-anchor="middle" font-size="8" fill="#64748b">b6</text>

      <!-- b5: FLIPPED 1 -> 0 -->
      <rect x="104" y="0" width="46" height="42" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
      <text x="127" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">0</text>
      <text x="127" y="52" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">b5 (flip)</text>

      <!-- b4: 1 -->
      <rect x="156" y="0" width="46" height="42" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="179" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">1</text>
      <text x="179" y="52" text-anchor="middle" font-size="8" fill="#64748b">b4</text>

      <!-- b3: 0 -->
      <rect x="208" y="0" width="46" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="231" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">0</text>
      <text x="231" y="52" text-anchor="middle" font-size="8" fill="#64748b">b3</text>

      <!-- b2: 0 -->
      <rect x="260" y="0" width="46" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="283" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">0</text>
      <text x="283" y="52" text-anchor="middle" font-size="8" fill="#64748b">b2</text>

      <!-- b1: 1 -->
      <rect x="312" y="0" width="46" height="42" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="335" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">1</text>
      <text x="335" y="52" text-anchor="middle" font-size="8" fill="#64748b">b1</text>

      <!-- b0: 0 -->
      <rect x="364" y="0" width="46" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="387" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">0</text>
      <text x="387" y="52" text-anchor="middle" font-size="8" fill="#64748b">b0</text>

      <!-- Separator line -->
      <line x1="422" y1="4" x2="422" y2="46" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>

      <!-- Parity Bit (stored 0, but calculated 1) -->
      <rect x="434" y="0" width="46" height="42" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
      <text x="457" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">0</text>
      <text x="457" y="52" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Mismatch</text>

      <!-- Parity calculation badge -->
      <rect x="492" y="7" width="102" height="28" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="543" y="19" text-anchor="middle" font-size="8" fill="#b91c1c">Ones: 3 (odd)</text>
      <text x="543" y="29.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">✕ Parity Error</text>
    </g>

    <!-- Bottom summary line -->
    <text x="20" y="104" font-size="8.5" fill="#b91c1c">Error detected: Receiver counts 3 ones (odd) but received parity = 0 (even) → mismatch triggers retransmission request.</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CARD 3: PARITY CAPABILITIES & LIMITATIONS                             -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(24, 268)">
    <rect width="632" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 628,0 Q 632,0 632,4 L 632,24 L 0,24 Z" fill="#f1f5f9"/>
    <line x1="0" y1="24" x2="632" y2="24" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="16" font-size="10" font-weight="700" fill="#334155">Parity vs. ECC: Detection and Correction Trade-offs</text>
    <text x="618" y="16" text-anchor="end" font-size="8.5" fill="#64748b">1-bit parity detection vs multi-bit SECDED</text>

    <!-- 3 Columns -->
    <g transform="translate(14, 32)">
      <!-- Col 1: Detects -->
      <rect x="0" y="0" width="194" height="88" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <rect x="8" y="8" width="80" height="16" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.6"/>
      <text x="48" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Detects</text>
      <text x="10" y="40" font-size="8.5" font-weight="600" fill="#334155">• Single-bit flips (100%)</text>
      <text x="10" y="54" font-size="8" fill="#64748b">• Odd-number bit errors</text>
      <text x="10" y="68" font-size="8" fill="#64748b">• Zero payload modification</text>
      <text x="10" y="80" font-size="8" fill="#15803d">Cost: 1 bit per word (~1.5–12%)</text>

      <!-- Col 2: Cannot Do -->
      <rect x="204" y="0" width="194" height="88" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <rect x="212" y="8" width="80" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.6"/>
      <text x="252" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Limitations</text>
      <text x="214" y="40" font-size="8.5" font-weight="600" fill="#334155">• Cannot locate flipped bit</text>
      <text x="214" y="54" font-size="8" fill="#64748b">• Cannot correct errors (detect only)</text>
      <text x="214" y="68" font-size="8" fill="#64748b">• Blind to 2-bit flips (parity cancels)</text>
      <text x="214" y="80" font-size="8" fill="#b45309">Requires retransmission / abort</text>

      <!-- Col 3: ECC Upgrade -->
      <rect x="408" y="0" width="194" height="88" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <rect x="416" y="8" width="90" height="16" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.6"/>
      <text x="461" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">ECC (SECDED)</text>
      <text x="418" y="40" font-size="8.5" font-weight="600" fill="#334155">• Single-bit error correction</text>
      <text x="418" y="54" font-size="8" fill="#64748b">• Double-bit error detection</text>
      <text x="418" y="68" font-size="8" fill="#64748b">• Mandatory in HBM3 / DDR5 DRAM</text>
      <text x="418" y="80" font-size="8" fill="#0369a1">Cost: 8 check bits per 64-bit word (12.5%)</text>
    </g>

    <text x="316" y="138" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic">HBM3 in GPU accelerators employs inline SECDED ECC to safeguard model weights and gradients from cosmic soft errors.</text>
  </g>
</svg>
