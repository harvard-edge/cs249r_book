<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Left: active-active, the load balancer splits traffic across three serving replicas.
       Right: active-passive, all traffic to a primary; a warm standby takes over on failure.
       Violet = load balancer (coordination), blue = serving replicas, dashed = standby path. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="680" height="230" fill="#ffffff"/>

  <!-- ===== Left: active-active ===== -->
  <text x="170" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Active-active</text>
  <line x1="170" y1="26" x2="170" y2="42" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="100" y="44" width="140" height="36" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="170" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Load balancer</text>
  <g stroke="#7c3aed" stroke-width="1.4" fill="none">
    <path d="M170,80 V112"/>
    <path d="M60,112 H280"/>
    <line x1="60" y1="112" x2="60" y2="148" marker-end="url(#arr-purple)"/>
    <line x1="170" y1="112" x2="170" y2="148" marker-end="url(#arr-purple)"/>
    <line x1="280" y1="112" x2="280" y2="148" marker-end="url(#arr-purple)"/>
  </g>
  <g font-size="12" fill="#6d28d9" text-anchor="start">
    <text x="66" y="136">1/3</text>
    <text x="176" y="136">1/3</text>
    <text x="286" y="136">1/3</text>
  </g>
  <g font-size="13" font-weight="700" fill="#14294E" text-anchor="middle">
    <rect x="15" y="150" width="90" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="60" y="175">Replica 1</text>
    <rect x="125" y="150" width="90" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="170" y="175">Replica 2</text>
    <rect x="235" y="150" width="90" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="280" y="175">Replica 3</text>
  </g>
  <text x="170" y="218" text-anchor="middle" font-size="12" fill="#475569">survivors must absorb a lost replica's load</text>

  <line x1="340" y1="10" x2="340" y2="222" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== Right: active-passive ===== -->
  <text x="510" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Active-passive</text>
  <line x1="470" y1="26" x2="470" y2="42" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="400" y="44" width="140" height="36" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="470" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Load balancer</text>
  <line x1="430" y1="80" x2="430" y2="148" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <text x="436" y="120" font-size="12" fill="#6d28d9">all traffic</text>
  <path d="M540,62 H600 V148" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="606" y="120" font-size="12" fill="#6d28d9">on failure</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="375" y="150" width="110" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="430" y="175" fill="#14294E">Primary</text>
    <rect x="545" y="150" width="110" height="40" rx="2" fill="#ffffff" stroke="#1F407A" stroke-dasharray="4,2"/><text x="600" y="175" fill="#14294E">Warm standby</text>
  </g>
  <text x="510" y="218" text-anchor="middle" font-size="12" fill="#475569">standby holds loaded weights but serves nothing</text>
</svg>
