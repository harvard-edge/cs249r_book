<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -11 680 287" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Each replica card shows loaded weights (blue, C1 substrate) and a load gauge (green fill = traffic served,
       empty = unused capacity). Active-active: three gauges one-third full, the rest is failover headroom.
       Active-passive: the primary's gauge is full, the warm standby has weights loaded but an empty gauge.
       Violet = load balancer and routing (C3). -->
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="-11" width="680" height="287" fill="#ffffff"/>
  <!-- ===== Active-active ===== -->
  <text x="170" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Active-active</text>
  <rect x="100" y="34" width="140" height="30" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="170" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Load balancer</text>
  <path d="M170,64 V84 H65 V128" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="73" y="108" font-size="12" fill="#6d28d9">1/3</text>
  <rect x="20" y="130" width="90" height="92" rx="2" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2"/>
  <text x="65.0" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Replica 1</text>
  <rect x="30" y="160" width="70" height="18" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="65.0" y="173" text-anchor="middle" font-size="11" fill="#14294E">weights</text>
  <rect x="30" y="188" width="70" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="30" y="188" width="23.3" height="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <line x1="170" y1="64" x2="170" y2="128" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="178" y="108" font-size="12" fill="#6d28d9">1/3</text>
  <rect x="125" y="130" width="90" height="92" rx="2" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2"/>
  <text x="170.0" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Replica 2</text>
  <rect x="135" y="160" width="70" height="18" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="170.0" y="173" text-anchor="middle" font-size="11" fill="#14294E">weights</text>
  <rect x="135" y="188" width="70" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="135" y="188" width="23.3" height="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <path d="M170,64 V84 H275 V128" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="283" y="108" font-size="12" fill="#6d28d9">1/3</text>
  <rect x="230" y="130" width="90" height="92" rx="2" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2"/>
  <text x="275.0" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Replica 3</text>
  <rect x="240" y="160" width="70" height="18" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="275.0" y="173" text-anchor="middle" font-size="11" fill="#14294E">weights</text>
  <rect x="240" y="188" width="70" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="240" y="188" width="23.3" height="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <path d="M55,230 V236 H100 V230" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="55" y="252" font-size="12" fill="#0f172a">headroom absorbs a failed share</text>
  <line x1="340" y1="10" x2="340" y2="252" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- ===== Active-passive ===== -->
  <text x="510" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Active-passive</text>
  <rect x="440" y="34" width="140" height="30" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="510" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Load balancer</text>
  <path d="M470,64 V84 H440 V128" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="448" y="108" font-size="12" fill="#6d28d9">all traffic</text>
  <path d="M550,64 V84 H600 V128" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="592" y="108" text-anchor="end" font-size="12" fill="#6d28d9">on failure</text>
  <rect x="380" y="130" width="120" height="92" rx="2" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2"/>
  <text x="440.0" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Primary</text>
  <rect x="390" y="160" width="100" height="18" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="440.0" y="173" text-anchor="middle" font-size="11" fill="#14294E">weights</text>
  <rect x="390" y="188" width="100" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="390" y="188" width="100.0" height="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="440" y="201" text-anchor="middle" font-size="11" fill="#15803d">traffic</text>
  <rect x="540" y="130" width="120" height="92" rx="2" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="600.0" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Warm standby</text>
  <rect x="550" y="160" width="100" height="18" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="600.0" y="173" text-anchor="middle" font-size="11" fill="#14294E">weights</text>
  <rect x="550" y="188" width="100" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="600" y="201" text-anchor="middle" font-size="11" fill="#64748b">idle</text>
  <path d="M550,230 V236 H650 V230" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="650" y="252" text-anchor="end" font-size="12" fill="#0f172a">loaded, serves nothing</text>
</svg>
