<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blk" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#334155"/>
    </marker>
    <marker id="arr-grn" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#d97706"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-2%" width="106%" height="106%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL A: ACTIVE-ACTIVE SERVING                                        -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 20)" filter="url(#card-shadow)">
    <rect width="370" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,8 Q 0,0 8,0 L 362,0 Q 370,0 370,8 L 370,36 L 0,36 Z" fill="#eff6ff"/>
    <text x="16" y="22" font-size="11" font-weight="700" fill="#1e40af">Panel A: Active-Active Serving Architecture</text>
    <text x="354" y="22" text-anchor="end" font-size="8.5" font-weight="700" fill="#2563eb">100% Active</text>

    <!-- Incoming traffic arrow -->
    <line x1="185" y1="44" x2="185" y2="60" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-blk)"/>
    <text x="195" y="54" font-size="8" font-weight="600" fill="#475569">Client Requests</text>

    <!-- Load Balancer Card -->
    <g transform="translate(115, 64)">
      <rect width="140" height="40" rx="4" fill="#f8fafc" stroke="#1F407A" stroke-width="1.5"/>
      <text x="70" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Load Balancer</text>
      <text x="70" y="30" text-anchor="middle" font-size="8" fill="#475569">Round-robin / least-load</text>
    </g>

    <!-- Distribution routes -->
    <path d="M 140 104 L 140 122 L 65 122 L 65 138" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-grn)"/>
    <path d="M 185 104 L 185 138" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-grn)"/>
    <path d="M 230 104 L 230 122 L 305 122 L 305 138" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-grn)"/>

    <text x="75" y="132" font-size="7.5" font-weight="700" fill="#16a34a">~33%</text>
    <text x="193" y="132" font-size="7.5" font-weight="700" fill="#16a34a">~33%</text>
    <text x="313" y="132" font-size="7.5" font-weight="700" fill="#16a34a">~33%</text>

    <!-- Active Replicas -->
    <g transform="translate(18, 142)">
      <!-- Replica 1 -->
      <g transform="translate(0, 0)">
        <rect width="100" height="52" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="50" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">Replica 1</text>
        <rect x="25" y="28" width="50" height="15" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
        <text x="50" y="39" text-anchor="middle" font-size="7" font-weight="700" fill="#166534">ACTIVE</text>
      </g>
      <!-- Replica 2 -->
      <g transform="translate(117, 0)">
        <rect width="100" height="52" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="50" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">Replica 2</text>
        <rect x="25" y="28" width="50" height="15" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
        <text x="50" y="39" text-anchor="middle" font-size="7" font-weight="700" fill="#166534">ACTIVE</text>
      </g>
      <!-- Replica 3 -->
      <g transform="translate(234, 0)">
        <rect width="100" height="52" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="50" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">Replica 3</text>
        <rect x="25" y="28" width="50" height="15" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
        <text x="50" y="39" text-anchor="middle" font-size="7" font-weight="700" fill="#166534">ACTIVE</text>
      </g>
    </g>

    <!-- Continuous Serving Flow -->
    <path d="M 68 198 L 68 214 L 302 214 L 302 198" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="185" y="222" text-anchor="middle" font-size="7.5" fill="#64748b">Unified low-latency egress responses</text>

    <!-- Feature 1: High Utilization -->
    <g transform="translate(18, 236)">
      <rect width="334" height="66" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="14" y="20" font-size="9.5" font-weight="700" fill="#166534">Maximized Hardware Utilization &amp; Throughput</text>
      <text x="14" y="37" font-size="8" fill="#15803d"><tspan font-weight="700">Capacity:</tspan><tspan dx="4">Zero idle nodes; all replicas host live models.</tspan></text>
      <text x="14" y="53" font-size="8" fill="#15803d"><tspan font-weight="700">Efficiency:</tspan><tspan dx="4">Maximizes throughput per hardware dollar.</tspan></text>
    </g>

    <!-- Feature 2: Trade-off Note -->
    <g transform="translate(18, 314)">
      <rect width="334" height="88" rx="5" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="14" y="20" font-size="9.5" font-weight="700" fill="#92400e">Trade-off: Failover Rebalancing &amp; Headroom</text>
      <text x="14" y="37" font-size="8" fill="#78350f">
        <tspan font-weight="700">Surge Impact:</tspan>
        <tspan dx="4">Crashed replica shifts +50% load to survivors.</tspan>
      </text>
      <text x="14" y="53" font-size="8" fill="#78350f">
        <tspan font-weight="700">Headroom Rule:</tspan>
        <tspan dx="4">Keep load &lt; 70% to prevent tail-latency spikes.</tspan>
      </text>
      <text x="14" y="69" font-size="8" fill="#78350f">
        <tspan font-weight="700">Failover Lag:</tspan>
        <tspan dx="4">Health check delay (100–500ms) causes drops.</tspan>
      </text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL B: ACTIVE-PASSIVE SERVING                                       -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(410, 20)" filter="url(#card-shadow)">
    <rect width="370" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,8 Q 0,0 8,0 L 362,0 Q 370,0 370,8 L 370,36 L 0,36 Z" fill="#fff7ed"/>
    <text x="16" y="22" font-size="11" font-weight="700" fill="#c2410c">Panel B: Active-Passive Serving Architecture</text>
    <text x="354" y="22" text-anchor="end" font-size="8.5" font-weight="700" fill="#ea580c">Instant Failover</text>

    <!-- Incoming traffic arrow -->
    <line x1="185" y1="44" x2="185" y2="60" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-blk)"/>
    <text x="195" y="54" font-size="8" font-weight="600" fill="#475569">Client Requests</text>

    <!-- Load Balancer Card -->
    <g transform="translate(115, 64)">
      <rect width="140" height="40" rx="4" fill="#f8fafc" stroke="#1F407A" stroke-width="1.5"/>
      <text x="70" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Load Balancer</text>
      <text x="70" y="30" text-anchor="middle" font-size="8" fill="#475569">Health probes &amp; fencing</text>
    </g>

    <!-- 100% route to Primary -->
    <path d="M 175 104 L 175 138" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-grn)"/>
    <text x="168" y="124" text-anchor="end" font-size="8" font-weight="700" fill="#16a34a">100% Traffic</text>

    <!-- Heartbeat & Failover paths to Standby -->
    <path d="M 230 104 L 230 118 L 266 118 L 266 138" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-amber)"/>
    <text x="272" y="116" font-size="7.5" font-weight="700" fill="#d97706">Failover route</text>

    <!-- Primary & Standby Nodes -->
    <g transform="translate(24, 142)">
      <!-- Primary -->
      <g transform="translate(20, 0)">
        <rect width="120" height="52" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
        <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">Primary Node</text>
        <rect x="30" y="28" width="60" height="15" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
        <text x="60" y="39" text-anchor="middle" font-size="7" font-weight="700" fill="#166534">ACTIVE (100%)</text>
        <!-- Fault tag badge -->
        <circle cx="115" cy="5" r="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
        <text x="115" y="8.5" text-anchor="middle" font-size="9" font-weight="800" fill="#dc2626">✕</text>
      </g>
      <!-- Standby 1 (Warm) -->
      <g transform="translate(182, 0)">
        <rect width="120" height="52" rx="4" fill="#f8fafc" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 2"/>
        <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Standby Node</text>
        <rect x="25" y="28" width="70" height="15" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
        <text x="60" y="39" text-anchor="middle" font-size="7" font-weight="700" fill="#92400e">WARM (PROMOTED)</text>
      </g>
    </g>

    <!-- Heartbeat synchronization -->
    <path d="M 164 168 L 206 168" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="185" y="163" text-anchor="middle" font-size="6.5" fill="#64748b">Warm VRAM</text>

    <!-- Feature 1: Deterministic Failover -->
    <g transform="translate(18, 236)">
      <rect width="334" height="66" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="14" y="20" font-size="9.5" font-weight="700" fill="#1e40af">Deterministic Failover &amp; Strict Isolation</text>
      <text x="14" y="37" font-size="8" fill="#1F407A">
        <tspan font-weight="700">Warm Standby:</tspan>
        <tspan dx="4">Weights pre-loaded in VRAM; ready in ms.</tspan>
      </text>
      <text x="14" y="53" font-size="8" fill="#1F407A">
        <tspan font-weight="700">No Degradation:</tspan>
        <tspan dx="4">Full throughput preserved on failover.</tspan>
      </text>
    </g>

    <!-- Feature 2: Trade-off Note -->
    <g transform="translate(18, 314)">
      <rect width="334" height="88" rx="5" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="14" y="20" font-size="9.5" font-weight="700" fill="#92400e">Trade-off: Reserved Idle Capacity Cost</text>
      <text x="14" y="37" font-size="8" fill="#78350f">
        <tspan font-weight="700">Hardware Cost:</tspan>
        <tspan dx="4">50% of accelerator capital sits idle.</tspan>
      </text>
      <text x="14" y="53" font-size="8" fill="#78350f">
        <tspan font-weight="700">Split-Brain:</tspan>
        <tspan dx="4">Fencing tokens required to prevent dual primary.</tspan>
      </text>
      <text x="14" y="69" font-size="8" fill="#78350f">
        <tspan font-weight="700">Critical Use:</tspan>
        <tspan dx="4">Best for safety-critical and medical serving.</tspan>
      </text>
    </g>
  </g>
</svg>