<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">

  <!-- Background -->
  <rect width="880" height="520" fill="#fff"/>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#bbb"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c44"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- Divider -->
  <line x1="440" y1="20" x2="440" y2="390" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LEFT PANEL: Fail-Stop Failure -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="220" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Panel A: Fail-Stop Failure (Crash Silent)</text>

  <!-- Coordinator -->
  <rect x="160" y="56" width="120" height="42" rx="4" fill="#eff6ff" stroke="#1F407A" stroke-width="1.5"/>
  <text x="220" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#1F407A">Coordinator</text>
  <text x="220" y="88" text-anchor="middle" font-size="8.5" fill="#1e40af">Heartbeat &amp; Timeout Monitor</text>

  <!-- Worker 1 -->
  <rect x="30" y="180" width="80" height="70" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="70" y="211" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">Worker 1</text>
  <text x="70" y="225" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Running</text>

  <!-- Worker 2 (FAILED) -->
  <rect x="130" y="180" width="80" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="158" y1="188" x2="182" y2="212" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="182" y1="188" x2="158" y2="212" stroke="#dc2626" stroke-width="2.5"/>
  <text x="170" y="225" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">Worker 2</text>
  <text x="170" y="238" text-anchor="middle" font-size="8" fill="#64748b">Silent / Dead</text>

  <!-- Worker 3 -->
  <rect x="230" y="180" width="80" height="70" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="270" y="211" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">Worker 3</text>
  <text x="270" y="225" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Running</text>

  <!-- Worker 4 -->
  <rect x="330" y="180" width="80" height="70" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="370" y="211" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">Worker 4</text>
  <text x="370" y="225" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Running</text>

  <!-- Routing Arrows -->
  <path d="M70,180 L70,120 L190,120 L190,98" fill="none" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <text x="130" y="115" text-anchor="middle" font-size="8" font-weight="600" fill="#1F407A">heartbeat</text>

  <path d="M170,180 L170,150 L210,150 L210,98" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="165" y="165" text-anchor="end" font-size="8" font-weight="700" fill="#dc2626">Timeout!</text>

  <path d="M270,180 L270,150 L230,150 L230,98" fill="none" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <path d="M370,180 L370,120 L250,120 L250,98" fill="none" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>

  <!-- Detection Annotation -->
  <rect x="130" y="280" width="180" height="36" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="220" y="295" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Missing Heartbeat Detected</text>
  <text x="220" y="307" text-anchor="middle" font-size="8" fill="#92400e">Failure declared immediately on timeout</text>

  <!-- Left Panel Key -->
  <rect x="30" y="335" width="380" height="54" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="220" y="352" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">Failure Model: Fail-Stop Dynamics</text>
  <text x="220" y="366" text-anchor="middle" font-size="8.5" fill="#334155">Component stops responding entirely (crash-silent).</text>
  <text x="220" y="378" text-anchor="middle" font-size="8.5" fill="#64748b">Detection: Lease timeout. Recovery: Replace node + restore checkpoint.</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- RIGHT PANEL: Byzantine Failure -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="660" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Panel B: Byzantine Failure (Arbitrary / Silent Corruption)</text>

  <!-- Coordinator -->
  <rect x="600" y="56" width="120" height="42" rx="4" fill="#eff6ff" stroke="#1F407A" stroke-width="1.5"/>
  <text x="660" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#1F407A">Coordinator</text>
  <text x="660" y="88" text-anchor="middle" font-size="8.5" fill="#1e40af">Receives All Gradients</text>

  <!-- Worker 5 -->
  <rect x="470" y="180" width="80" height="70" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="510" y="211" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">Worker 5</text>
  <text x="510" y="225" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Correct ∇</text>

  <!-- Worker 6 (BYZANTINE) -->
  <rect x="570" y="180" width="80" height="70" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="610" y="201" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">Worker 6</text>
  <text x="610" y="215" text-anchor="middle" font-size="8" font-weight="600" fill="#d97706">Appears Healthy!</text>
  <text x="610" y="229" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">Corrupt / SDC</text>

  <!-- Worker 7 -->
  <rect x="670" y="180" width="80" height="70" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="710" y="211" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">Worker 7</text>
  <text x="710" y="225" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Correct ∇</text>

  <!-- Worker 8 -->
  <rect x="770" y="180" width="80" height="70" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="810" y="211" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">Worker 8</text>
  <text x="810" y="225" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Correct ∇</text>

  <!-- Routing Arrows -->
  <path d="M510,180 L510,120 L630,120 L630,98" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  
  <path d="M610,180 L610,150 L650,150 L650,98" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="605" y="160" text-anchor="end" font-size="8" font-weight="700" fill="#dc2626">Poison ∇</text>
  <text x="605" y="172" text-anchor="end" font-size="7.5" fill="#d97706">(passes sanity check)</text>

  <path d="M710,180 L710,150 L670,150 L670,98" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M810,180 L810,120 L690,120 L690,98" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Detection Annotation -->
  <rect x="570" y="280" width="180" height="36" rx="4" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
  <text x="660" y="295" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">No Timeout Triggered</text>
  <text x="660" y="307" text-anchor="middle" font-size="8" fill="#b91c1c">Corrupted weights invisible to basic heartbeat</text>

  <!-- Right Panel Key -->
  <rect x="470" y="335" width="380" height="54" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="660" y="352" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">Failure Model: Byzantine / Arbitrary Dynamics</text>
  <text x="660" y="366" text-anchor="middle" font-size="8.5" fill="#334155">Component produces faulty outputs but remains responsive.</text>
  <text x="660" y="378" text-anchor="middle" font-size="8.5" fill="#64748b">Detection: Gradient norms / cross-validation. Recovery: Byzantine agreement / rollback.</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- BOTTOM COMPARISON BAR -->
  <!-- ═══════════════════════════════════════════════ -->
  <g transform="translate(30, 410)">
    <rect width="820" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="410" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Core Architectural Distinction</text>
    
    <text x="205" y="38" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1F407A">Fail-Stop: Absence of signal = failure</text>
    <text x="205" y="52" text-anchor="middle" font-size="8" fill="#475569">Deterministic timeout detection and lease renewal are sufficient.</text>
    
    <line x1="410" y1="28" x2="410" y2="58" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="615" y="38" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b45309">Byzantine: Presence of signal ≠ correctness</text>
    <text x="615" y="52" text-anchor="middle" font-size="8" fill="#475569">Requires mathematical checksums, outlier rejection, or replicated voting.</text>
  </g>
</svg>