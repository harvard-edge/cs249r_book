<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Fail-stop (left): a crashed worker goes silent and the coordinator's timeout catches it.
       Byzantine (right): a corrupt worker keeps sending plausible gradients the coordinator accepts.
       Violet = coordination, blue = compute workers, amber = gradient traffic, red = fault. -->
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="680" height="250" fill="#ffffff"/>

  <!-- ===== Left: Fail-stop ===== -->
  <text x="170" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Fail-stop</text>
  <rect x="20" y="30" width="300" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="170" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Coordinator</text>
  <text x="170" y="63" text-anchor="middle" font-size="12" fill="#6d28d9">timeout flags W2</text>

  <!-- heartbeat lines -->
  <line x1="53" y1="160" x2="53" y2="72" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <line x1="205" y1="160" x2="205" y2="72" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <line x1="281" y1="160" x2="281" y2="72" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <line x1="129" y1="160" x2="129" y2="112" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="1,3"/>
  <rect x="66" y="98" width="42" height="18" fill="#ffffff"/>
  <text x="87" y="111" text-anchor="middle" font-size="12" fill="#7c3aed">beat</text>
  <text x="129" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">silence</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="160" width="66" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="53" y="185" fill="#14294E">W1</text>
    <rect x="96" y="160" width="66" height="40" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4,2"/><text x="129" y="185" fill="#94a3b8">W2</text>
    <rect x="172" y="160" width="66" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="205" y="185" fill="#14294E">W3</text>
    <rect x="248" y="160" width="66" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="281" y="185" fill="#14294E">W4</text>
  </g>
  <line x1="112" y1="166" x2="146" y2="194" stroke="#dc2626" stroke-width="2"/>
  <line x1="146" y1="166" x2="112" y2="194" stroke="#dc2626" stroke-width="2"/>
  <text x="129" y="220" text-anchor="middle" font-size="12" fill="#b91c1c">crashed</text>
  <text x="170" y="242" text-anchor="middle" font-size="12" fill="#475569">absence of signal is the evidence</text>

  <!-- divider -->
  <line x1="340" y1="10" x2="340" y2="240" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== Right: Byzantine ===== -->
  <text x="510" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Byzantine</text>
  <rect x="360" y="30" width="300" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="510" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Coordinator</text>
  <text x="510" y="63" text-anchor="middle" font-size="12" fill="#6d28d9">averages all gradients</text>

  <line x1="393" y1="160" x2="393" y2="72" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-amber)"/>
  <line x1="545" y1="160" x2="545" y2="72" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-amber)"/>
  <line x1="621" y1="160" x2="621" y2="72" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-amber)"/>
  <line x1="469" y1="160" x2="469" y2="72" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arr-red)"/>
  <rect x="406" y="98" width="48" height="18" fill="#ffffff"/>
  <text x="430" y="111" text-anchor="middle" font-size="12" fill="#b45309">grad</text>
  <rect x="478" y="98" width="58" height="18" fill="#ffffff"/>
  <text x="507" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">wrong</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="360" y="160" width="66" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="393" y="185" fill="#14294E">W5</text>
    <rect x="436" y="160" width="66" height="40" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="469" y="185" fill="#b91c1c">W6</text>
    <rect x="512" y="160" width="66" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="545" y="185" fill="#14294E">W7</text>
    <rect x="588" y="160" width="66" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="621" y="185" fill="#14294E">W8</text>
  </g>
  <text x="469" y="220" text-anchor="middle" font-size="12" fill="#b91c1c">looks healthy</text>
  <text x="510" y="242" text-anchor="middle" font-size="12" fill="#475569">a signal does not prove correctness</text>
</svg>
