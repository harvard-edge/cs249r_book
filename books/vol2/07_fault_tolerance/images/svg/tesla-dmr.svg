<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 485" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blk" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#334155"/>
    </marker>
    <marker id="arr-grn" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#dc2626"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#d97706"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- SENSOR INPUTS CARD                                                    -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(24, 25)" filter="url(#card-shadow)">
    <rect width="126" height="275" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 120,0 Q 126,0 126,6 L 126,28 L 0,28 Z" fill="#f1f5f9"/>
    <text x="63" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Sensor Inputs</text>

    <!-- Sensor chips -->
    <g transform="translate(11, 38)">
      <g transform="translate(0, 0)">
        <rect width="104" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="52" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Cameras (8×)</text>
        <text x="52" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">360° Vision @ 36 Hz</text>
      </g>
      <g transform="translate(0, 56)">
        <rect width="104" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="52" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Radar / Lidar</text>
        <text x="52" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Long-range depth</text>
      </g>
      <g transform="translate(0, 112)">
        <rect width="104" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="52" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Ultrasonics</text>
        <text x="52" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Near-field proximity</text>
      </g>
      <g transform="translate(0, 168)">
        <rect width="104" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="52" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">IMU &amp; GNSS</text>
        <text x="52" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Odometry &amp; heading</text>
      </g>
    </g>
  </g>

  <!-- Feed connections: Sensors broadcast identical data to SoC A and SoC B -->
  <!-- Upper bus to SoC A -->
  <path d="M 150 90 L 175 90" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-blk)"/>
  <!-- Lower bus to SoC B -->
  <path d="M 150 235 L 175 235" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-blk)"/>
  <!-- Split indicator -->
  <path d="M 150 90 L 162 90 L 162 235 L 175 235" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="146" y="152" width="34" height="18" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="163" y="164" text-anchor="middle" font-size="7" font-weight="700" fill="#475569">DUAL</text>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- SoC A (PRIMARY CHANNEL)                                               -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(182, 25)" filter="url(#card-shadow)">
    <rect width="206" height="126" rx="6" fill="#ffffff" stroke="#1F407A" stroke-width="1.5"/>
    <path d="M 0,6 Q 0,0 6,0 L 200,0 Q 206,0 206,6 L 206,28 L 0,28 Z" fill="#e0e7ff"/>
    <text x="12" y="19" font-size="10.5" font-weight="700" fill="#1e1b4b">Primary SoC A (Full Redundancy)</text>

    <!-- Sub-blocks -->
    <g transform="translate(10, 36)">
      <!-- ISP -->
      <rect x="0" y="0" width="186" height="22" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.8"/>
      <text x="93" y="15" text-anchor="middle" font-size="8" font-weight="600" fill="#312e81">Hardware Image Signal Processor (ISP)</text>
      
      <!-- NPU & Planner -->
      <rect x="0" y="27" width="90" height="28" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="45" y="40" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">Neural Engine</text>
      <text x="45" y="50" text-anchor="middle" font-size="7" fill="#3b82f6">Dual NPU cores</text>

      <rect x="96" y="27" width="90" height="28" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="141" y="40" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">Motion Planner</text>
      <text x="141" y="50" text-anchor="middle" font-size="7" fill="#3b82f6">12-core Lockstep CPU</text>

      <!-- Action Output Vector -->
      <rect x="0" y="60" width="186" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="93" y="74" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">Egress Action Vector: Trajectory A</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- SoC B (SECONDARY CHANNEL)                                             -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(182, 174)" filter="url(#card-shadow)">
    <rect width="206" height="126" rx="6" fill="#ffffff" stroke="#1F407A" stroke-width="1.5"/>
    <path d="M 0,6 Q 0,0 6,0 L 200,0 Q 206,0 206,6 L 206,28 L 0,28 Z" fill="#e0e7ff"/>
    <text x="12" y="19" font-size="10.5" font-weight="700" fill="#1e1b4b">Secondary SoC B (Isolated Rail)</text>

    <!-- Sub-blocks -->
    <g transform="translate(10, 36)">
      <!-- ISP -->
      <rect x="0" y="0" width="186" height="22" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.8"/>
      <text x="93" y="15" text-anchor="middle" font-size="8" font-weight="600" fill="#312e81">Hardware Image Signal Processor (ISP)</text>
      
      <!-- NPU & Planner -->
      <rect x="0" y="27" width="90" height="28" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="45" y="40" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">Neural Engine</text>
      <text x="45" y="50" text-anchor="middle" font-size="7" fill="#3b82f6">Dual NPU cores</text>

      <rect x="96" y="27" width="90" height="28" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="141" y="40" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">Motion Planner</text>
      <text x="141" y="50" text-anchor="middle" font-size="7" fill="#3b82f6">12-core Lockstep CPU</text>

      <!-- Action Output Vector -->
      <rect x="0" y="60" width="186" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="93" y="74" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">Egress Action Vector: Trajectory B</text>
    </g>
  </g>

  <!-- Output lines into Comparator -->
  <path d="M 388 112 L 418 112 L 418 135 L 428 135" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blk)"/>
  <path d="M 388 260 L 418 260 L 418 175 L 428 175" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blk)"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- HARDWARE LOCKSTEP COMPARATOR                                          -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(430, 75)" filter="url(#card-shadow)">
    <rect width="145" height="160" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <path d="M 0,6 Q 0,0 6,0 L 139,0 Q 145,0 145,6 L 145,28 L 0,28 Z" fill="#fef3c7"/>
    <text x="72" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">DMR Comparator</text>

    <!-- Sub-block 1: Equality check -->
    <g transform="translate(10, 36)">
      <rect width="125" height="30" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
      <text x="62.5" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Bitwise Equality</text>
      <text x="62.5" y="24" text-anchor="middle" font-size="7.5" fill="#92400e">Trajectory A ≟ B</text>
    </g>

    <!-- Sub-block 2: Frequency -->
    <g transform="translate(10, 72)">
      <rect width="125" height="32" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="62.5" y="13" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">Sampling Frequency</text>
      <text x="62.5" y="25" text-anchor="middle" font-size="7.5" fill="#475569">Synchronous @ 36 Hz</text>
    </g>

    <!-- Sub-block 3: Status logic -->
    <g transform="translate(10, 110)">
      <rect width="125" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="62.5" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">A == B: Pass Action</text>
      <text x="62.5" y="30" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">A ≠ B: Abort &amp; Failsafe</text>
    </g>
  </g>

  <!-- Output branches from Comparator -->
  <!-- Match -> Drive-by-wire (Green) -->
  <path d="M 570 112 L 610 112" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-grn)"/>
  <text x="590" y="104" text-anchor="middle" font-size="7" font-weight="700" fill="#16a34a">MATCH</text>

  <!-- Mismatch -> Fail-Safe Handover (Red) -->
  <path d="M 570 200 L 610 200" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="590" y="192" text-anchor="middle" font-size="7" font-weight="700" fill="#dc2626">MISMATCH</text>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- ACTUATION TARGETS (RIGHT COLUMN)                                      -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- Vehicle Control (Match) -->
  <g transform="translate(615, 75)" filter="url(#card-shadow)">
    <rect width="120" height="74" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">Vehicle Actuation</text>
    <text x="60" y="36" text-anchor="middle" font-size="8" fill="#166534">Steering &amp; throttle valid</text>
    <rect x="12" y="46" width="96" height="18" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
    <text x="60" y="58" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">DRIVE-BY-WIRE OK</text>
  </g>

  <!-- Emergency Safe-State (Mismatch) -->
  <g transform="translate(615, 163)" filter="url(#card-shadow)">
    <rect width="120" height="74" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Fail-Safe Handover</text>
    <text x="60" y="36" text-anchor="middle" font-size="8" fill="#b91c1c">Failsafe safe stop triggered</text>
    <rect x="12" y="46" width="96" height="18" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
    <text x="60" y="58" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">ABORT TO MIN RISK</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- ARCHITECTURAL PRINCIPLES CARD                                         -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(24, 320)" filter="url(#card-shadow)">
    <rect width="711" height="142" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 705,0 Q 711,0 711,6 L 711,28 L 0,28 Z" fill="#f8fafc"/>
    <text x="16" y="19" font-size="11" font-weight="700" fill="#1e293b">Dual Modular Redundancy (DMR) Safety Guarantees</text>
    <text x="695" y="19" text-anchor="end" font-size="8.5" font-weight="700" fill="#1F407A">ASIL-D Automotive Safety Architecture</text>

    <g transform="translate(16, 38)">
      <!-- Left Column: Fault Independence -->
      <g transform="translate(0, 0)">
        <rect width="332" height="92" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Physical &amp; Electrical Isolation</text>
        <text x="12" y="35" font-size="8" fill="#334155">
          <tspan font-weight="700">Dual Silicon:</tspan>
          <tspan dx="4">Redundant SoCs with separate power rails.</tspan>
        </text>
        <text x="12" y="51" font-size="8" fill="#334155">
          <tspan font-weight="700">Clock Isolation:</tspan>
          <tspan dx="4">Blocks correlated transient voltage faults.</tspan>
        </text>
        <text x="12" y="67" font-size="8" fill="#334155">
          <tspan font-weight="700">Fail-Operational:</tspan>
          <tspan dx="4">Survives complete failure of either chip.</tspan>
        </text>
      </g>

      <!-- Right Column: Comparator Logic -->
      <g transform="translate(346, 0)">
        <rect width="333" height="92" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Deterministic Fail-Stop Behavior</text>
        <text x="12" y="35" font-size="8" fill="#334155">
          <tspan font-weight="700">Zero SDC:</tspan>
          <tspan dx="4">Any bit-flip causes immediate disparity.</tspan>
        </text>
        <text x="12" y="51" font-size="8" fill="#334155">
          <tspan font-weight="700">Failsafe Stop:</tspan>
          <tspan dx="4">Disparity halts actuation; alerts backup MCU.</tspan>
        </text>
        <text x="12" y="67" font-size="8" fill="#334155">
          <tspan font-weight="700">Availability:</tspan>
          <tspan dx="4">Full safety without 3× TMR hardware cost.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>