<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="100%" height="100%">
  <!-- Three observability signal types (metrics, logs, traces) joined on shared identifiers,
       then mapped to a recovery action. Telemetry and correlation are coordination (violet). -->
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="680" height="290" fill="#ffffff"/>

  <!-- Pillar 1: Metrics -->
  <g transform="translate(20,20)">
    <rect width="200" height="90" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect width="200" height="26" rx="3" fill="#f3e8ff"/>
    <line x1="0" y1="26" x2="200" y2="26" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Metrics</text>
    <text x="100" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">when and where</text>
    <text x="100" y="74" text-anchor="middle" font-size="12" fill="#0f172a" font-style="italic">GPU utilization drops</text>
  </g>

  <!-- Pillar 2: Logs -->
  <g transform="translate(240,20)">
    <rect width="200" height="90" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect width="200" height="26" rx="3" fill="#f3e8ff"/>
    <line x1="0" y1="26" x2="200" y2="26" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Logs</text>
    <text x="100" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">what happened</text>
    <text x="100" y="74" text-anchor="middle" font-size="12" fill="#0f172a" font-style="italic">out-of-memory exception</text>
  </g>

  <!-- Pillar 3: Traces -->
  <g transform="translate(460,20)">
    <rect width="200" height="90" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect width="200" height="26" rx="3" fill="#f3e8ff"/>
    <line x1="0" y1="26" x2="200" y2="26" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Traces</text>
    <text x="100" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">request path</text>
    <text x="100" y="74" text-anchor="middle" font-size="12" fill="#0f172a" font-style="italic">request behind the spike</text>
  </g>

  <!-- Arrows down into the correlation step (tips land on the box's top edge at y=140) -->
  <line x1="120" y1="110" x2="120" y2="138.5" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <line x1="340" y1="110" x2="340" y2="138.5" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <line x1="560" y1="110" x2="560" y2="138.5" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>

  <!-- Correlation -->
  <g transform="translate(20,140)">
    <rect width="640" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="320" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Correlate on shared identifiers</text>
    <text x="320" y="39" text-anchor="middle" font-size="12" fill="#475569">request · trace · model version · feature version · deployment</text>
  </g>

  <line x1="340" y1="190" x2="340" y2="218.5" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>

  <!-- Recovery action -->
  <g transform="translate(120,220)">
    <rect width="440" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="220" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Recovery action</text>
    <text x="220" y="39" text-anchor="middle" font-size="12" fill="#475569">shed load · restart replica · roll back · degrade gracefully</text>
  </g>
</svg>
