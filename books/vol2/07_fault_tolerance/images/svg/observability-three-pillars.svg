<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="490" fill="#ffffff"/>

  <!-- ===== Pillar 1: Metrics (blue) ===== -->
  <g transform="translate(20, 15)">
    <rect width="216" height="300" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="216" height="26" rx="4" fill="#EAF1F8"/>
    <line x1="0" y1="26" x2="216" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="17" font-size="10" font-weight="700" fill="#1F407A">1. METRICS (TIMESERIES)</text>

    <g transform="translate(10, 36)">
      <!-- Infra box -->
      <rect width="196" height="74" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1F407A">Hardware Infrastructure</text>
      <text x="10" y="32" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Compute:</tspan> GPU SM &amp; Tensor Core Util</text>
      <text x="10" y="47" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Memory:</tspan> HBM3e capacity &amp; bandwidth</text>
      <text x="10" y="62" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Fabric:</tspan> NVLink &amp; RoCEv2 line-rate BW</text>

      <!-- App box -->
      <rect y="82" width="196" height="74" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="10" y="97" font-size="8.5" font-weight="700" fill="#1F407A">Serving Runtime</text>
      <text x="10" y="114" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Latency:</tspan> TTFT &amp; TPOT (p50, p99)</text>
      <text x="10" y="129" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Goodput:</tspan> Query error rate, SLA status</text>
      <text x="10" y="144" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Queue:</tspan> KV cache block allocation %</text>

      <!-- ML box -->
      <rect y="164" width="196" height="88" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="10" y="179" font-size="8.5" font-weight="700" fill="#1F407A">Model Training Dynamics</text>
      <text x="10" y="196" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Norm:</tspan> Gradient L2 norm per worker rank</text>
      <text x="10" y="211" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Loss:</tspan> Cross-entropy trajectory, perplexity</text>
      <text x="10" y="226" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Scale:</tspan> Model FLOPs Utilization (MFU %)</text>
      <text x="10" y="241" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Step:</tspan> AllReduce communication time ratio</text>
    </g>
  </g>

  <!-- ===== Pillar 2: Logs (green) ===== -->
  <g transform="translate(252, 15)">
    <rect width="216" height="300" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="216" height="26" rx="4" fill="#DCFCE7"/>
    <line x1="0" y1="26" x2="216" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="17" font-size="10" font-weight="700" fill="#15803D">2. LOGS (STRUCTURED EVENTS)</text>

    <g transform="translate(10, 36)">
      <!-- Severity Levels -->
      <rect width="196" height="106" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#15803D">Canonical Severity Levels</text>
      
      <rect x="10" y="24" width="36" height="13" rx="2" fill="#F1F5F9"/>
      <text x="28" y="33.5" text-anchor="middle" font-size="7" font-weight="700" fill="#475569">DEBUG</text>
      <text x="52" y="34" font-size="7.5" fill="#475569">Detailed kernel launch telemetry</text>

      <rect x="10" y="40" width="36" height="13" rx="2" fill="#EAF1F8"/>
      <text x="28" y="49.5" text-anchor="middle" font-size="7" font-weight="700" fill="#1F407A">INFO</text>
      <text x="52" y="50" font-size="7.5" fill="#475569">Checkpoint saved; rendezvous ok</text>

      <rect x="10" y="56" width="36" height="13" rx="2" fill="#FEF3C7"/>
      <text x="28" y="65.5" text-anchor="middle" font-size="7" font-weight="700" fill="#B45309">WARN</text>
      <text x="52" y="66" font-size="7.5" fill="#475569">Thermal throttle; PCIe ECC corrected</text>

      <rect x="10" y="72" width="36" height="13" rx="2" fill="#FEE2E2"/>
      <text x="28" y="81.5" text-anchor="middle" font-size="7" font-weight="700" fill="#DC2626">ERROR</text>
      <text x="52" y="82" font-size="7.5" fill="#475569">NCCL watchdog timeout; CUDA crash</text>

      <rect x="10" y="88" width="36" height="13" rx="2" fill="#991B1B"/>
      <text x="28" y="97.5" text-anchor="middle" font-size="7" font-weight="700" fill="#FFFFFF">FATAL</text>
      <text x="52" y="98" font-size="7.5" fill="#475569">Host kernel panic; power rail trip</text>

      <!-- Structured Format -->
      <rect y="114" width="196" height="138" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="10" y="129" font-size="8.5" font-weight="700" fill="#15803D">Structured JSON Schema</text>
      <rect x="8" y="136" width="180" height="108" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.6"/>
      <text x="14" y="150" font-family="'JetBrains Mono', Consolas, monospace" font-size="7" fill="#475569">{</text>
      <text x="22" y="162" font-family="'JetBrains Mono', Consolas, monospace" font-size="7" fill="#15803D">"timestamp": <tspan fill="#64748B">"2026-09-16T..."</tspan>,</text>
      <text x="22" y="174" font-family="'JetBrains Mono', Consolas, monospace" font-size="7" fill="#15803D">"level": <tspan fill="#DC2626">"ERROR"</tspan>,</text>
      <text x="22" y="186" font-family="'JetBrains Mono', Consolas, monospace" font-size="7" fill="#15803D">"trace_id": <tspan fill="#1F407A">"tr-89b4f"</tspan>,</text>
      <text x="22" y="198" font-family="'JetBrains Mono', Consolas, monospace" font-size="7" fill="#15803D">"rank": <tspan fill="#B45309">14</tspan>, "gpu_id": <tspan fill="#B45309">6</tspan>,</text>
      <text x="22" y="210" font-family="'JetBrains Mono', Consolas, monospace" font-size="7" fill="#15803D">"msg": <tspan fill="#64748B">"NCCL commRing stall"</tspan>,</text>
      <text x="22" y="222" font-family="'JetBrains Mono', Consolas, monospace" font-size="7" fill="#15803D">"peer_host": <tspan fill="#64748B">"worker-082"</tspan></text>
      <text x="14" y="234" font-family="'JetBrains Mono', Consolas, monospace" font-size="7" fill="#475569">}</text>
    </g>
  </g>

  <!-- ===== Pillar 3: Traces (orange) ===== -->
  <g transform="translate(484, 15)">
    <rect width="216" height="300" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="216" height="26" rx="4" fill="#FEF3C7"/>
    <line x1="0" y1="26" x2="216" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="17" font-size="10" font-weight="700" fill="#B45309">3. TRACES (DISTRIBUTED SPANS)</text>

    <g transform="translate(10, 36)">
      <!-- Concepts -->
      <rect width="196" height="74" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#B45309">Core Tracing Primitives</text>
      <text x="10" y="32" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Trace:</tspan> End-to-end directed acyclic path</text>
      <text x="10" y="47" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Span:</tspan> Individual timed unit of execution</text>
      <text x="10" y="62" font-size="7.8" fill="#475569"><tspan font-weight="600" fill="#1E293B">Context:</tspan> Propagated baggage &amp; correlation ID</text>

      <!-- Trace Execution Timeline -->
      <rect y="82" width="196" height="170" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="10" y="97" font-size="8.5" font-weight="700" fill="#B45309">Inference Request Span Waterfall</text>
      
      <!-- Spans -->
      <g transform="translate(10, 106)">
        <rect x="0" y="0" width="176" height="18" rx="2" fill="#EAF1F8" stroke="#93C5FD" stroke-width="0.8"/>
        <text x="8" y="12" font-size="7.5" font-weight="600" fill="#1F407A">api-gateway (66 ms total)</text>

        <rect x="15" y="24" width="70" height="18" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="20" y="36" font-size="7" fill="#475569">auth / rate-limit</text>

        <rect x="30" y="48" width="55" height="18" rx="2" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.8"/>
        <text x="35" y="60" font-size="7" fill="#B45309">feat-lookup</text>

        <rect x="40" y="72" width="130" height="34" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
        <text x="46" y="85" font-size="7.2" font-weight="600" fill="#166534">engine.generate (45 ms)</text>
        <text x="46" y="98" font-size="6.8" fill="#15803D">prefill: 5ms | decode: 40ms</text>

        <rect x="15" y="112" width="150" height="18" rx="2" fill="#FEE2E2" stroke="#FECACA" stroke-width="0.8"/>
        <text x="22" y="124" font-size="7" font-weight="600" fill="#DC2626">token-stream output serializer</text>
      </g>
    </g>
  </g>

  <!-- ===== Arrows to central correlation engine ===== -->
  <path d="M128,315 L128,340" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M360,315 L360,340" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M592,315 L592,340" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ===== Central Correlation and Alerting Engine ===== -->
  <g transform="translate(20, 344)">
    <rect width="680" height="130" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="340" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">Correlation Engine &amp; Automated Remediation</text>
    <text x="340" y="34" text-anchor="middle" font-size="8.5" fill="#64748B">Cross-signal union: metric latency knee → error log trace ID → slow microservice span</text>

    <!-- Sub-boxes inside correlation engine -->
    <g transform="translate(15, 46)">
      <rect width="200" height="68" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="200" height="18" rx="3" fill="#EAF1F8"/>
      <text x="100" y="13" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">Threshold Alerts</text>
      <text x="10" y="34" font-size="7.5" fill="#475569"><tspan font-weight="600" fill="#1E293B">Static rule:</tspan> Loss spike &gt; 3σ</text>
      <text x="10" y="48" font-size="7.5" fill="#475569"><tspan font-weight="600" fill="#1E293B">Action:</tspan> Pause optimizer step</text>
      <text x="10" y="60" font-size="7.5" fill="#64748B">PagerDuty / OpsGenie dispatch</text>

      <rect x="225" width="200" height="68" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="225" width="200" height="18" rx="3" fill="#DCFCE7"/>
      <text x="325" y="13" text-anchor="middle" font-size="8" font-weight="700" fill="#15803D">Anomaly Detection</text>
      <text x="235" y="34" font-size="7.5" fill="#475569"><tspan font-weight="600" fill="#1E293B">Algorithm:</tspan> Isolation forest on MFU</text>
      <text x="235" y="48" font-size="7.5" fill="#475569"><tspan font-weight="600" fill="#1E293B">Detection:</tspan> Straggler worker node</text>
      <text x="235" y="60" font-size="7.5" fill="#64748B">Early preemption prior to hang</text>

      <rect x="450" width="200" height="68" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="450" width="200" height="18" rx="3" fill="#FEF3C7"/>
      <text x="550" y="13" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">Root-Cause Isolation</text>
      <text x="460" y="34" font-size="7.5" fill="#475569"><tspan font-weight="600" fill="#1E293B">Analysis:</tspan> Automated span graph join</text>
      <text x="460" y="48" font-size="7.5" fill="#475569"><tspan font-weight="600" fill="#1E293B">Output:</tspan> Defective switch port ID</text>
      <text x="460" y="60" font-size="7.5" fill="#64748B">Instant cordoning &amp; failover</text>
    </g>
  </g>
</svg>
