<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -7 680 336" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- The three signals drawn in their native forms: a metric time series, a log stream, and a trace waterfall.
       A dashed violet connector leaves the red anomaly in each panel and carries it down into the join on shared
       identifiers, which drives the recovery action. Violet = telemetry and coordination (C3), red = the anomaly. -->
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="-7" width="680" height="336" fill="#ffffff"/>
  <!-- ===== Metrics ===== -->
  <rect x="20" y="14" width="200" height="160" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <path d="M20,38 V18 a4,4 0 0 1 4,-4 H216 a4,4 0 0 1 4,4 V38 Z" fill="#e2e8f0"/>
  <line x1="20" y1="38" x2="220" y2="38" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Metrics</text>
  <text x="120" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">when and where</text>
  <line x1="34" y1="160" x2="206" y2="160" stroke="#94a3b8" stroke-width="0.8"/>
  <polyline points="34.0,86.0 45.3,89.0 56.6,84.0 67.9,90.0 79.2,85.0 90.5,88.0 101.8,83.0 113.1,87.0 124.4,89.0 135.7,84.0 147.0,86.0 158.3,88.0 169.6,85.0" fill="none" stroke="#1F407A" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="169.6,85.0 173.0,90.0 180.0,138.0 188.0,141.0 197.0,137.0 206.0,140.0" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="34" y="154" font-size="11" fill="#475569">GPU utilization</text>
  <path d="M206,140 H212 V196" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <!-- ===== Logs ===== -->
  <rect x="240" y="14" width="200" height="160" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <path d="M240,38 V18 a4,4 0 0 1 4,-4 H436 a4,4 0 0 1 4,4 V38 Z" fill="#e2e8f0"/>
  <line x1="240" y1="38" x2="440" y2="38" stroke="#94a3b8" stroke-width="1"/>
  <text x="340" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Logs</text>
  <text x="340" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">what happened</text>
  <rect x="254" y="74" width="26" height="7" fill="#cbd5e1"/>
  <rect x="286" y="74" width="110" height="7" fill="#e2e8f0"/>
  <rect x="254" y="89" width="26" height="7" fill="#cbd5e1"/>
  <rect x="286" y="89" width="86" height="7" fill="#e2e8f0"/>
  <rect x="254" y="104" width="26" height="7" fill="#cbd5e1"/>
  <rect x="286" y="104" width="124" height="7" fill="#e2e8f0"/>
  <rect x="254" y="119" width="26" height="7" fill="#cbd5e1"/>
  <text x="286" y="127" font-size="11" font-weight="700" fill="#b91c1c" font-family="Courier New, monospace">OOM exception</text>
  <rect x="254" y="134" width="26" height="7" fill="#cbd5e1"/>
  <rect x="286" y="134" width="96" height="7" fill="#e2e8f0"/>
  <rect x="254" y="149" width="26" height="7" fill="#cbd5e1"/>
  <rect x="286" y="149" width="72" height="7" fill="#e2e8f0"/>
  <path d="M378,123 H420 V196" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <!-- ===== Traces ===== -->
  <rect x="460" y="14" width="200" height="160" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <path d="M460,38 V18 a4,4 0 0 1 4,-4 H656 a4,4 0 0 1 4,4 V38 Z" fill="#e2e8f0"/>
  <line x1="460" y1="38" x2="660" y2="38" stroke="#94a3b8" stroke-width="1"/>
  <text x="560" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Traces</text>
  <text x="560" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">request path</text>
  <rect x="474" y="76" width="172" height="12" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="480" y="98" width="44" height="12" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="528" y="98" width="112" height="12" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="534" y="120" width="30" height="12" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="568" y="120" width="68" height="12" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="474" y="156" font-size="11" fill="#475569">spans by service</text>
  <path d="M641,104 H650 V196" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <rect x="20" y="198" width="640" height="44" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="340" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Correlate on shared identifiers</text>
  <text x="340" y="233" text-anchor="middle" font-size="12" fill="#475569">request · trace · model version · feature version · deployment</text>
  <line x1="340" y1="242" x2="340" y2="262" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="190" y="264" width="300" height="44" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Recovery action</text>
  <text x="340" y="299" text-anchor="middle" font-size="12" fill="#475569">shed load · restart · roll back · degrade</text>
</svg>
