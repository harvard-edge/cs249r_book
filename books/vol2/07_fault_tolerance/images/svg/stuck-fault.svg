<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blk" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#334155"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0.5 7,3 0,5.5" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL A: LOGIC CIRCUIT MODEL                                          -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 20)" filter="url(#card-shadow)">
    <rect width="460" height="270" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 454,0 Q 460,0 460,6 L 460,30 L 0,30 Z" fill="#fee2e2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#991b1b">Panel A: Circuit Model · Stuck-at-0 (SA0) on AND Gate</text>
    <text x="446" y="20" text-anchor="end" font-size="8.5" font-weight="700" fill="#dc2626">Hard Fault</text>

    <!-- Circuit Diagram Area -->
    <g transform="translate(20, 45)">
      <!-- Input A -->
      <text x="15" y="44" font-size="11" font-weight="700" fill="#1e293b">A</text>
      <line x1="30" y1="40" x2="135" y2="40" stroke="#334155" stroke-width="2" marker-end="url(#arr-blk)"/>
      <text x="75" y="32" text-anchor="middle" font-size="8" fill="#64748b">A ∈ {0, 1}</text>

      <!-- Input B with Short to GND -->
      <text x="15" y="104" font-size="11" font-weight="700" fill="#dc2626">B</text>
      <line x1="30" y1="100" x2="135" y2="100" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
      <circle cx="75" cy="100" r="3.5" fill="#dc2626"/>
      <line x1="75" y1="100" x2="75" y2="135" stroke="#dc2626" stroke-width="2"/>
      
      <!-- Ground symbol -->
      <line x1="60" y1="135" x2="90" y2="135" stroke="#dc2626" stroke-width="2"/>
      <line x1="66" y1="140" x2="84" y2="140" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="71" y1="145" x2="79" y2="145" stroke="#dc2626" stroke-width="1"/>
      <text x="75" y="157" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">GND (0V)</text>

      <!-- Fault Tag -->
      <g transform="translate(35, 80)">
        <rect width="70" height="15" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="35" y="11" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">SA0 Wire</text>
      </g>

      <!-- AND Gate Body -->
      <g transform="translate(140, 15)">
        <path d="M 0,0 L 40,0 C 65,0 75,25 75,55 C 75,85 65,110 40,110 L 0,110 Z" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
        <text x="25" y="60" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e">&amp;</text>
        <text x="25" y="74" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b45309">AND</text>
      </g>

      <!-- Output Line -->
      <line x1="215" y1="70" x2="275" y2="70" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
      <text x="245" y="62" text-anchor="middle" font-size="8.5" font-weight="600" fill="#64748b">Output Z</text>

      <!-- Output State Badge -->
      <g transform="translate(280, 42)">
        <rect width="130" height="56" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
        <text x="65" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">Z ≡ 0 (Always)</text>
        <text x="65" y="42" text-anchor="middle" font-size="8" fill="#7f1d1d">Degraded to constant 0</text>
      </g>
    </g>

    <!-- Cause & Mechanism Box -->
    <g transform="translate(14, 212)">
      <rect width="432" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" fill="#0f172a">
        <tspan font-weight="700" fill="#1e293b">Physical Cause:</tspan>
        <tspan dx="4" fill="#475569">Gate-oxide breakdown creates short to substrate ground.</tspan>
      </text>
      <text x="12" y="34" font-size="8.5" fill="#0f172a">
        <tspan font-weight="700" fill="#1e293b">Functional Impact:</tspan>
        <tspan dx="4" fill="#991b1b" font-weight="600">Masked when A=0; activated and corrupting when A=1, B=1.</tspan>
      </text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL B: TRUTH TABLE & ACTIVATION                                     -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(500, 20)" filter="url(#card-shadow)">
    <rect width="320" height="270" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 314,0 Q 320,0 320,6 L 320,30 L 0,30 Z" fill="#eff6ff"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#1e40af">Panel B: Fault Activation Truth Table</text>
    <text x="306" y="20" text-anchor="end" font-size="8.5" font-weight="700" fill="#2563eb">Test Vectors</text>

    <!-- Table Header -->
    <g transform="translate(12, 42)">
      <rect width="296" height="24" rx="3" fill="#1F407A"/>
      <text x="20" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">A</text>
      <text x="65" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">B (Faulty)</text>
      <text x="130" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Expected Z</text>
      <text x="195" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Actual Z</text>
      <text x="252" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Status</text>

      <!-- Row 1: A=0, B=0 -->
      <g transform="translate(0, 26)">
        <rect width="296" height="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="20" y="15" text-anchor="middle" font-size="9" fill="#0f172a">0</text>
        <text x="65" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">0</text>
        <text x="130" y="15" text-anchor="middle" font-size="9" fill="#475569">0</text>
        <text x="195" y="15" text-anchor="middle" font-size="9" fill="#475569">0</text>
        <text x="252" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#16a34a">PASS (Masked)</text>
      </g>

      <!-- Row 2: A=0, B=1 -->
      <g transform="translate(0, 50)">
        <rect width="296" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="20" y="15" text-anchor="middle" font-size="9" fill="#0f172a">0</text>
        <text x="65" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">0</text>
        <text x="130" y="15" text-anchor="middle" font-size="9" fill="#475569">0</text>
        <text x="195" y="15" text-anchor="middle" font-size="9" fill="#475569">0</text>
        <text x="252" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#16a34a">PASS (Masked)</text>
      </g>

      <!-- Row 3: A=1, B=0 -->
      <g transform="translate(0, 74)">
        <rect width="296" height="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="20" y="15" text-anchor="middle" font-size="9" fill="#0f172a">1</text>
        <text x="65" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">0</text>
        <text x="130" y="15" text-anchor="middle" font-size="9" fill="#475569">0</text>
        <text x="195" y="15" text-anchor="middle" font-size="9" fill="#475569">0</text>
        <text x="252" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#16a34a">PASS (Masked)</text>
      </g>

      <!-- Row 4: A=1, B=1 (FAIL) -->
      <g transform="translate(0, 98)">
        <rect width="296" height="26" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
        <text x="20" y="17" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991b1b">1</text>
        <text x="65" y="17" text-anchor="middle" font-size="9.5" font-weight="700" fill="#dc2626">0</text>
        <text x="130" y="17" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">1</text>
        <text x="195" y="17" text-anchor="middle" font-size="9.5" font-weight="800" fill="#dc2626">0</text>
        <text x="252" y="17" text-anchor="middle" font-size="8" font-weight="800" fill="#b91c1c">FAIL (Mismatch)</text>
      </g>
    </g>

    <!-- Key Takeaway Pill -->
    <g transform="translate(12, 182)">
      <rect width="296" height="74" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#92400e">Sensitization Vector: [A=1, B=1]</text>
      <text x="12" y="33" font-size="7.5" fill="#78350f">A fault is only observable when the circuit is exercised by</text>
      <text x="12" y="45" font-size="7.5" fill="#78350f">inputs that propagate the discrepancy to an observable output.</text>
      <text x="12" y="60" font-size="7.5" font-weight="700" fill="#b45309">Coverage: 3 of 4 input patterns conceal the defect!</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL C: STUCK-AT TAXONOMY IN ACCELERATOR HARDWARE                    -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 310)" filter="url(#card-shadow)">
    <rect width="800" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 794,0 Q 800,0 800,6 L 800,28 L 0,28 Z" fill="#f1f5f9"/>
    <text x="16" y="19" font-size="11" font-weight="700" fill="#1e293b">Panel C: Stuck-at Fault Taxonomy in ML Tensor Accelerators</text>
    <text x="784" y="19" text-anchor="end" font-size="8.5" font-weight="700" fill="#64748b">ALU &amp; MAC Pipelines</text>

    <!-- Sub-cards -->
    <g transform="translate(16, 38)">
      <!-- SA0 Card -->
      <g transform="translate(0, 0)">
        <rect width="374" height="98" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="20" font-size="10" font-weight="700" fill="#dc2626">Stuck-at-0 (SA0) · Short to GND</text>
        <text x="14" y="38" font-size="8" fill="#334155">
          <tspan font-weight="700">Physical Origin:</tspan>
          <tspan dx="4">Short to ground rail (VSS); logic 0 state.</tspan>
        </text>
        <text x="14" y="54" font-size="8" fill="#334155">
          <tspan font-weight="700">MAC Pipeline:</tspan>
          <tspan dx="4">Forces mantissa bits or partial sums to zero.</tspan>
        </text>
        <text x="14" y="70" font-size="8" fill="#334155">
          <tspan font-weight="700">ML Training:</tspan>
          <tspan dx="4">Under-prediction; artificial activation sparsity.</tspan>
        </text>
        <text x="14" y="86" font-size="8" fill="#334155">
          <tspan font-weight="700">Detection:</tspan>
          <tspan dx="4">Periodic self-tests with non-zero test patterns.</tspan>
        </text>
      </g>

      <!-- SA1 Card -->
      <g transform="translate(394, 0)">
        <rect width="374" height="98" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="20" font-size="10" font-weight="700" fill="#d97706">Stuck-at-1 (SA1) · Short to VDD</text>
        <text x="14" y="38" font-size="8" fill="#334155">
          <tspan font-weight="700">Physical Origin:</tspan>
          <tspan dx="4">Short to power rail (VDD); logic 1 state.</tspan>
        </text>
        <text x="14" y="54" font-size="8" fill="#334155">
          <tspan font-weight="700">MAC Pipeline:</tspan>
          <tspan dx="4">Exponent bit driven high forces Inf/NaNs.</tspan>
        </text>
        <text x="14" y="70" font-size="8" fill="#334155">
          <tspan font-weight="700">ML Training:</tspan>
          <tspan dx="4">Gradient blowup; catastrophic loss divergence.</tspan>
        </text>
        <text x="14" y="86" font-size="8" fill="#334155">
          <tspan font-weight="700">Detection:</tspan>
          <tspan dx="4">Hardware Inf/NaN floating-point trap registers.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>