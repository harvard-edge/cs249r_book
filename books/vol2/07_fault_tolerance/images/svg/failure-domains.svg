<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 704 314" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Nested failure domains: datacenter > power/network domain > rack > node > GPU.
       The left rack's top-of-rack switch fails (red): every GPU it holds is lost; the right rack is untouched. -->
  <rect x="-12" y="-12" width="704" height="314" fill="#ffffff"/>

  <!-- ===== Datacenter ===== -->
  <rect x="10" y="10" width="660" height="270" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="24" y="30" font-size="13" font-weight="700" fill="#0f172a">Datacenter</text>
  <text x="656" y="30" text-anchor="end" font-size="12" fill="#475569">blast radius: all GPUs</text>

  <!-- ===== PDU / switch domain ===== -->
  <rect x="24" y="42" width="632" height="226" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="38" y="62" font-size="13" font-weight="700" fill="#0f172a">Power and network domain</text>
  <text x="642" y="62" text-anchor="end" font-size="12" fill="#475569">several racks</text>

  <!-- ===== Left rack (failed) ===== -->
  <rect x="38" y="74" width="296" height="180" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="52" y="94" font-size="13" font-weight="700" fill="#b91c1c">Rack: ToR switch fails</text>
  <text x="320" y="94" text-anchor="end" font-size="12" fill="#b91c1c">32–64 GPUs</text>
  <!-- nodes -->
  <g>
    <rect x="52" y="106" width="130" height="134" rx="2" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="117" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Node</text>
    <text x="117" y="228" text-anchor="middle" font-size="12" fill="#475569">8 GPUs</text>
    <rect x="190" y="106" width="130" height="134" rx="2" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="255" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Node</text>
    <text x="255" y="228" text-anchor="middle" font-size="12" fill="#475569">8 GPUs</text>
  </g>
  <g fill="#fee2e2" stroke="#dc2626">
    <rect x="66" y="140" width="20" height="20" rx="1"/><rect x="94" y="140" width="20" height="20" rx="1"/><rect x="122" y="140" width="20" height="20" rx="1"/><rect x="150" y="140" width="20" height="20" rx="1"/>
    <rect x="66" y="172" width="20" height="20" rx="1"/><rect x="94" y="172" width="20" height="20" rx="1"/><rect x="122" y="172" width="20" height="20" rx="1"/><rect x="150" y="172" width="20" height="20" rx="1"/>
    <rect x="204" y="140" width="20" height="20" rx="1"/><rect x="232" y="140" width="20" height="20" rx="1"/><rect x="260" y="140" width="20" height="20" rx="1"/><rect x="288" y="140" width="20" height="20" rx="1"/>
    <rect x="204" y="172" width="20" height="20" rx="1"/><rect x="232" y="172" width="20" height="20" rx="1"/><rect x="260" y="172" width="20" height="20" rx="1"/><rect x="288" y="172" width="20" height="20" rx="1"/>
  </g>

  <!-- ===== Right rack (healthy) ===== -->
  <rect x="346" y="74" width="296" height="180" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="360" y="94" font-size="13" font-weight="700" fill="#0f172a">Rack</text>
  <text x="628" y="94" text-anchor="end" font-size="12" fill="#475569">unaffected</text>
  <g>
    <rect x="360" y="106" width="130" height="134" rx="2" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="425" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Node</text>
    <text x="425" y="228" text-anchor="middle" font-size="12" fill="#475569">8 GPUs</text>
    <rect x="498" y="106" width="130" height="134" rx="2" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="563" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Node</text>
    <text x="563" y="228" text-anchor="middle" font-size="12" fill="#475569">8 GPUs</text>
  </g>
  <g fill="#EAF1F8" stroke="#1F407A">
    <rect x="374" y="140" width="20" height="20" rx="1"/><rect x="402" y="140" width="20" height="20" rx="1"/><rect x="430" y="140" width="20" height="20" rx="1"/><rect x="458" y="140" width="20" height="20" rx="1"/>
    <rect x="374" y="172" width="20" height="20" rx="1"/><rect x="402" y="172" width="20" height="20" rx="1"/><rect x="430" y="172" width="20" height="20" rx="1"/><rect x="458" y="172" width="20" height="20" rx="1"/>
    <rect x="512" y="140" width="20" height="20" rx="1"/><rect x="540" y="140" width="20" height="20" rx="1"/><rect x="568" y="140" width="20" height="20" rx="1"/><rect x="596" y="140" width="20" height="20" rx="1"/>
    <rect x="512" y="172" width="20" height="20" rx="1"/><rect x="540" y="172" width="20" height="20" rx="1"/><rect x="568" y="172" width="20" height="20" rx="1"/><rect x="596" y="172" width="20" height="20" rx="1"/>
  </g>
</svg>
