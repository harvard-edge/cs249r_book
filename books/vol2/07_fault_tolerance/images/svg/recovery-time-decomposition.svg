<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="100%" height="100%">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="390" fill="#ffffff"/>

  <!-- ===== Timeline bar ===== -->
  <!-- Failure marker -->
  <line x1="40" y1="20" x2="40" y2="260" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="40" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#DC2626">Failure</text>

  <!-- T_detect segment (orange) -->
  <rect x="40" y="28" width="160" height="46" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="120" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309">T_detect</text>
  <text x="120" y="63" text-anchor="middle" font-size="8.5" fill="#78350F">30–180 s</text>

  <!-- T_restart segment (red/pink) -->
  <rect x="200" y="28" width="200" height="46" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="300" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#991B1B">T_restart</text>
  <text x="300" y="63" text-anchor="middle" font-size="8.5" fill="#7F1D1D">3–15 min</text>

  <!-- T_load segment (blue) -->
  <rect x="400" y="28" width="240" height="46" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="520" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">T_load</text>
  <text x="520" y="63" text-anchor="middle" font-size="8.5" fill="#14294E">5–30 min</text>

  <!-- T_warmup segment (green) -->
  <rect x="640" y="28" width="180" height="46" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="730" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#15803D">T_warmup</text>
  <text x="730" y="63" text-anchor="middle" font-size="8.5" fill="#166534">1–5 min</text>

  <!-- Resume marker -->
  <line x1="820" y1="20" x2="820" y2="260" stroke="#16A34A" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="820" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#16A34A">Resume</text>

  <!-- Total span annotation -->
  <line x1="40" y1="96" x2="820" y2="96" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
  <rect x="310" y="86" width="240" height="20" rx="3" fill="#ffffff" stroke="#DC2626" stroke-width="1"/>
  <text x="430" y="100" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">Total T_recovery (typical: 15–50 min)</text>

  <!-- ===== Detail cards below (Structured, zero bullets) ===== -->

  <!-- T_detect detail -->
  <g transform="translate(40, 120)">
    <rect width="160" height="130" rx="3" fill="#ffffff" stroke="#D97706" stroke-width="1"/>
    <rect width="160" height="22" rx="3" fill="#FEF3C7"/>
    <text x="80" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">1. Fault Detection</text>
    <text x="12" y="38" font-size="7.8" fill="#334155">Heartbeat timeout fires</text>
    <text x="12" y="53" font-size="7.8" fill="#334155">NCCL collective watchdog</text>
    <text x="12" y="68" font-size="7.8" fill="#334155">Loss spike / NaN detection</text>
    <text x="12" y="83" font-size="7.8" fill="#334155">Health probe fails k times</text>
    <rect x="8" y="98" width="144" height="22" rx="2" fill="#FEF3C7"/>
    <text x="80" y="112" text-anchor="middle" font-size="7.5" font-weight="700" fill="#B45309">Action: reduce timeout</text>
  </g>

  <!-- T_restart detail -->
  <g transform="translate(220, 120)">
    <rect width="180" height="130" rx="3" fill="#ffffff" stroke="#DC2626" stroke-width="1"/>
    <rect width="180" height="22" rx="3" fill="#FEE2E2"/>
    <text x="90" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">2. Job Re-Scheduling</text>
    <text x="12" y="38" font-size="7.8" fill="#334155">Evict surviving rank processes</text>
    <text x="12" y="53" font-size="7.8" fill="#334155">Scheduler allocates replacement</text>
    <text x="12" y="68" font-size="7.8" fill="#334155">Re-launch worker containers</text>
    <text x="12" y="83" font-size="7.8" fill="#334155">Initialize rendezvous / torchrun</text>
    <rect x="8" y="98" width="164" height="22" rx="2" fill="#FEE2E2"/>
    <text x="90" y="112" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991B1B">Action: hot standby spares</text>
  </g>

  <!-- T_load detail -->
  <g transform="translate(420, 120)">
    <rect width="200" height="130" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1"/>
    <rect width="200" height="22" rx="3" fill="#EAF1F8"/>
    <text x="100" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F407A">3. Checkpoint Ingestion</text>
    <text x="12" y="38" font-size="7.8" fill="#334155">Read checkpoint shards from PFS</text>
    <text x="12" y="53" font-size="7.8" fill="#334155">DMA transfer to GPU HBM memory</text>
    <text x="12" y="68" font-size="7.8" fill="#334155">Verify cryptographic hash integrity</text>
    <text x="12" y="83" font-size="7.8" fill="#334155">Broadcast non-partitioned params</text>
    <rect x="8" y="98" width="184" height="22" rx="2" fill="#EAF1F8"/>
    <text x="100" y="112" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1F407A">Action: local NVMe staging</text>
  </g>

  <!-- T_warmup detail -->
  <g transform="translate(640, 120)">
    <rect width="180" height="130" rx="3" fill="#ffffff" stroke="#16A34A" stroke-width="1"/>
    <rect width="180" height="22" rx="3" fill="#DCFCE7"/>
    <text x="90" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">4. Pipeline Warmup</text>
    <text x="12" y="38" font-size="7.8" fill="#334155">Refill input data loader buffers</text>
    <text x="12" y="53" font-size="7.8" fill="#334155">TorchDynamo / JIT kernel compile</text>
    <text x="12" y="68" font-size="7.8" fill="#334155">NCCL ring communication warmup</text>
    <text x="12" y="83" font-size="7.8" fill="#334155">Step latency stabilizes to steady-state</text>
    <rect x="8" y="98" width="164" height="22" rx="2" fill="#DCFCE7"/>
    <text x="90" y="112" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803D">Action: persistent worker pool</text>
  </g>

  <!-- ===== Optimization target bar ===== -->
  <g transform="translate(40, 268)">
    <rect width="780" height="95" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="390" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A">Dominant Bottleneck by Deployment Scale</text>
    
    <g transform="translate(10, 28)">
      <!-- Col 1 -->
      <rect x="0" y="0" width="180" height="56" rx="2" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="90" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">T_detect Dominates</text>
      <text x="90" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Large multi-thousand clusters</text>
      <text x="90" y="45" text-anchor="middle" font-size="7.5" fill="#64748B">conservative timeout thresholds</text>

      <!-- Col 2 -->
      <rect x="195" y="0" width="185" height="56" rx="2" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="287.5" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#991B1B">T_restart Dominates</text>
      <text x="287.5" y="32" text-anchor="middle" font-size="7.5" fill="#475569">No warm standby spares</text>
      <text x="287.5" y="45" text-anchor="middle" font-size="7.5" fill="#64748B">cold container pull &amp; host reboot</text>

      <!-- Col 3 -->
      <rect x="390" y="0" width="185" height="56" rx="2" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="482.5" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">T_load Dominates</text>
      <text x="482.5" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Remote multi-terabyte PFS</text>
      <text x="482.5" y="45" text-anchor="middle" font-size="7.5" fill="#64748B">network storage IOPS throttling</text>

      <!-- Col 4 -->
      <rect x="585" y="0" width="175" height="56" rx="2" fill="#ffffff" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="672.5" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#15803D">T_warmup Dominates</text>
      <text x="672.5" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Deep pipeline parallel models</text>
      <text x="672.5" y="45" text-anchor="middle" font-size="7.5" fill="#64748B">heavy dynamic shape JIT trace</text>
    </g>
  </g>
</svg>