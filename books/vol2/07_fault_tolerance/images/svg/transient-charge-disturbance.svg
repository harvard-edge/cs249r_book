<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16A34A"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Clean White Canvas Base (No Outer Border) -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: PHYSICAL STRIKE & CHARGE COLLECTION                             -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 20)">
    <!-- Container -->
    <rect width="260" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 256 0 Q 260 0 260 4 L 260 24 L 0 24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="260" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1F407A" letter-spacing="0.5px">1. IONIZING PARTICLE STRIKE</text>

    <!-- Sub-box 1: Silicon Drain Junction -->
    <g transform="translate(12, 36)">
      <rect width="236" height="158" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Silicon Reverse-Biased Junction</text>
      <text x="226" y="16" font-size="8" font-family="serif" font-style="italic" fill="#64748B" text-anchor="end">Si Lattice</text>

      <!-- Substrate block -->
      <rect x="18" y="30" width="200" height="116" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.9"/>
      <line x1="18" y1="76" x2="218" y2="76" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="26" y="52" font-size="8" font-weight="600" fill="#475569">p-substrate</text>
      <text x="26" y="94" font-size="8" font-weight="600" fill="#1F407A">n+ drain region</text>

      <!-- Particle Strike Track -->
      <line x1="180" y1="10" x2="110" y2="125" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
      <circle cx="180" cy="10" r="3" fill="#DC2626"/>
      <text x="175" y="24" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="end">n / α strike</text>

      <!-- Electron-Hole Pairs along track -->
      <circle cx="152" cy="56" r="3.5" fill="#3B82F6"/>
      <text x="152" y="59" font-size="6.5" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>
      <circle cx="163" cy="62" r="3.5" fill="#EF4444"/>
      <text x="163" y="65" font-size="6.5" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

      <circle cx="134" cy="85" r="3.5" fill="#3B82F6"/>
      <text x="134" y="88" font-size="6.5" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>
      <circle cx="145" cy="91" r="3.5" fill="#EF4444"/>
      <text x="145" y="94" font-size="6.5" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

      <circle cx="120" cy="110" r="3.5" fill="#3B82F6"/>
      <text x="120" y="113" font-size="6.5" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>
      <circle cx="131" cy="116" r="3.5" fill="#EF4444"/>
      <text x="131" y="119" font-size="6.5" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
    </g>

    <!-- Sub-box 2: Critical Charge Dynamic -->
    <g transform="translate(12, 202)">
      <rect width="236" height="174" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Charge Collection Dynamic</text>

      <!-- Equation box -->
      <rect x="14" y="24" width="208" height="32" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
      <text x="118" y="44" font-size="9" font-family="serif" font-style="italic" font-weight="700" fill="#991B1B" text-anchor="middle">ΔQ = ∫ I(t) dt &gt; Q_crit</text>

      <!-- Waveform graphic: Current transient -->
      <g transform="translate(14, 66)">
        <rect width="208" height="94" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <!-- Axes -->
        <line x1="28" y1="74" x2="195" y2="74" stroke="#94A3B8" stroke-width="0.8"/>
        <line x1="28" y1="14" x2="28" y2="74" stroke="#94A3B8" stroke-width="0.8"/>
        <text x="24" y="22" font-size="7" fill="#64748B" text-anchor="end">I(t)</text>
        <text x="195" y="83" font-size="7" fill="#64748B" text-anchor="end">Time (ps)</text>

        <!-- Current spike curve -->
        <path d="M 32 74 L 44 74 L 52 24 L 72 67 L 110 73 L 190 74" fill="none" stroke="#DC2626" stroke-width="1.6"/>
        <line x1="28" y1="38" x2="195" y2="38" stroke="#94A3B8" stroke-width="0.7" stroke-dasharray="2,2"/>
        <text x="190" y="34" font-size="7" font-weight="600" fill="#DC2626" text-anchor="end">I_peak threshold</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <line x1="285" y1="215" x2="310" y2="215" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: CIRCUIT BISTABLE STATE FLIP                                     -->
  <!-- ========================================================================= -->
  <g transform="translate(310, 20)">
    <!-- Container -->
    <rect width="260" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 256 0 Q 260 0 260 4 L 260 24 L 0 24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="260" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1F407A" letter-spacing="0.5px">2. CIRCUIT BIT-FLIP (SEU)</text>

    <!-- Sub-box 1: Cross-Coupled Inverters -->
    <g transform="translate(12, 36)">
      <rect width="236" height="158" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">6T SRAM Bitcell Cross-Coupling</text>

      <!-- Inverter 1 -->
      <g transform="translate(45, 45)">
        <polygon points="0,10 0,40 28,25" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
        <circle cx="31" cy="25" r="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
        <text x="14" y="28" font-size="7.5" font-weight="700" fill="#475569" text-anchor="middle">I₁</text>
      </g>

      <!-- Inverter 2 -->
      <g transform="translate(160, 45)">
        <polygon points="0,40 0,10 -28,25" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
        <circle cx="-31" cy="25" r="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
        <text x="-14" y="28" font-size="7.5" font-weight="700" fill="#475569" text-anchor="middle">I₂</text>
      </g>

      <!-- Forward wire: Inv1 out to Inv2 in -->
      <line x1="79" y1="70" x2="160" y2="70" stroke="#DC2626" stroke-width="1.5"/>
      <circle cx="118" cy="70" r="3" fill="#DC2626"/>
      <text x="118" y="62" font-size="8" font-weight="700" fill="#DC2626" text-anchor="middle">Node Q</text>

      <!-- Return wire: Inv2 out to Inv1 in -->
      <path d="M 129 70 L 129 105 L 25 105 L 25 70 L 45 70" fill="none" stroke="#475569" stroke-width="1.2"/>
      <text x="75" y="117" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">Feedback Loop</text>

      <!-- VDD / GND Rails -->
      <line x1="30" y1="138" x2="206" y2="138" stroke="#94A3B8" stroke-width="0.8"/>
      <text x="118" y="149" font-size="7.5" fill="#64748B" text-anchor="middle">Regenerative Feedback Latches Error</text>
    </g>

    <!-- Sub-box 2: State Transition -->
    <g transform="translate(12, 202)">
      <rect width="236" height="174" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Bistable Latch State Transition</text>

      <!-- Nominal state chip -->
      <rect x="20" y="28" width="85" height="48" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
      <text x="62" y="45" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">PRE-UPSET</text>
      <text x="62" y="64" font-size="12" font-weight="700" fill="#16A34A" text-anchor="middle">Q = 0</text>

      <!-- Transition arrow -->
      <line x1="112" y1="52" x2="130" y2="52" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

      <!-- Corrupted state chip -->
      <rect x="135" y="28" width="85" height="48" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
      <text x="177" y="45" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">POST-UPSET</text>
      <text x="177" y="64" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">Q = 1</text>

      <!-- Structured Architectural Classification (Zero Bullets) -->
      <g transform="translate(14, 88)">
        <rect width="208" height="74" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#1E293B">Failure Mode: Single-Event Upset</text>

        <rect x="8" y="24" width="192" height="18" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.7"/>
        <text x="14" y="36" font-size="7.5" fill="#475569">Physical State: Gate oxide intact</text>

        <rect x="8" y="46" width="192" height="18" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.7"/>
        <text x="14" y="58" font-size="7.5" fill="#16A34A">Recovery: Overwrite restores state</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <line x1="570" y1="215" x2="595" y2="215" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: ML NUMERICAL REPRESENTATION CORRUPTION                         -->
  <!-- ========================================================================= -->
  <g transform="translate(595, 20)">
    <!-- Container -->
    <rect width="260" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 256 0 Q 260 0 260 4 L 260 24 L 0 24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="260" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1F407A" letter-spacing="0.5px">3. ML NUMERICAL CORRUPTION</text>

    <!-- Sub-box 1: IEEE 754 FP16 Layout -->
    <g transform="translate(12, 36)">
      <rect width="236" height="158" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">IEEE 754 FP16 Register Bitfield</text>

      <!-- Bit cells -->
      <g transform="translate(10, 30)">
        <!-- Sign bit (flipped) -->
        <rect x="0" y="0" width="28" height="34" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
        <text x="14" y="21" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">1</text>
        <text x="14" y="46" font-size="7" font-weight="700" fill="#DC2626" text-anchor="middle">Sign [15]</text>

        <!-- Exponent bits -->
        <rect x="34" y="0" width="68" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.9"/>
        <text x="68" y="21" font-size="10" font-family="'JetBrains Mono', Consolas, monospace" fill="#1F407A" text-anchor="middle">01111</text>
        <text x="68" y="46" font-size="7" font-weight="600" fill="#1F407A" text-anchor="middle">Exp [14:10]</text>

        <!-- Mantissa bits -->
        <rect x="108" y="0" width="108" height="34" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.9"/>
        <text x="162" y="21" font-size="9" font-family="'JetBrains Mono', Consolas, monospace" fill="#475569" text-anchor="middle">0000000000</text>
        <text x="162" y="46" font-size="7" font-weight="600" fill="#64748B" text-anchor="middle">Fraction [9:0]</text>
      </g>

      <!-- Value Mapping comparison -->
      <g transform="translate(10, 94)">
        <rect width="216" height="52" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="12" y="19" font-size="8" font-weight="700" fill="#334155">Nominal Scalar:</text>
        <text x="120" y="19" font-size="8.5" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" fill="#16A34A">+1.0000</text>
        <text x="12" y="38" font-size="8" font-weight="700" fill="#DC2626">Corrupted Scalar:</text>
        <text x="120" y="38" font-size="8.5" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" fill="#DC2626">-1.0000</text>
      </g>
    </g>

    <!-- Sub-box 2: Fleet Propagation Pipeline -->
    <g transform="translate(12, 202)">
      <rect width="236" height="174" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Downstream Fleet Propagation</text>

      <!-- Cascade flow steps -->
      <g transform="translate(14, 26)">
        <rect width="208" height="26" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="104" y="17" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">Layer Forward: a^(l) = σ(W a^(l-1))</text>

        <!-- Connector Arrow 1 -> 2 -->
        <line x1="104" y1="26" x2="104" y2="38" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-gray)"/>

        <!-- Step 2 -->
        <rect y="38" width="208" height="26" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
        <text x="104" y="55" font-size="8" font-weight="600" fill="#B45309" text-anchor="middle">Attention Mask / Softmax Divergence</text>

        <!-- Connector Arrow 2 -> 3 -->
        <line x1="104" y1="64" x2="104" y2="76" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

        <!-- Step 3 -->
        <rect y="76" width="208" height="52" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
        <text x="104" y="93" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">AllReduce Silent Corruption</text>
        <text x="104" y="106" font-size="7.5" fill="#DC2626" text-anchor="middle">Gradient Ring Poisoning (SDC)</text>
        <text x="104" y="119" font-size="7.5" font-weight="600" fill="#991B1B" text-anchor="middle">Loss Spike / NaN Divergence</text>
      </g>
    </g>
  </g>
</svg>
