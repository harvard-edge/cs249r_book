<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Title bar -->
  <text x="30" y="32" font-size="15" font-weight="700" fill="#0F172A">Transient Single-Event Upset (SEU): From Particle Strike to Silent ML Corruption</text>
  <text x="30" y="52" font-size="11" fill="#64748B">Ionizing radiation deposits critical charge, flipping memory cell states and perturbing model representations</text>

  <!-- Panel 1: Physical Strike & Silicon Ionization -->
  <rect x="25" y="70" width="265" height="325" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="25" y="70" width="265" height="32" rx="8" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="37" y="91" font-size="12" font-weight="700" fill="#1F407A">1. Physical Strike</text>

  <!-- Particle label placed clearly to the right of the strike -->
  <text x="125" y="128" font-size="10" font-weight="600" fill="#DC2626">High-Energy Neutron /</text>
  <text x="125" y="141" font-size="10" font-weight="600" fill="#DC2626">Alpha Particle Strike</text>

  <!-- Cosmic particle path -->
  <path d="M60 120 L105 185" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <circle cx="58" cy="118" r="4" fill="#DC2626"/>

  <!-- Silicon Substrate schematic -->
  <rect x="50" y="200" width="215" height="95" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="157" y="285" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Silicon Lattice (Drain Junction)</text>

  <!-- Ionization track -->
  <line x1="105" y1="200" x2="150" y2="265" stroke="#DC2626" stroke-width="2" stroke-dasharray="3,2"/>
  
  <!-- Electron-hole pairs with labels -->
  <circle cx="112" cy="214" r="4.5" fill="#3B82F6"/>
  <text x="112" y="217.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#fff">-</text>
  <circle cx="125" cy="221" r="4.5" fill="#EF4444"/>
  <text x="125" y="224.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#fff">+</text>

  <circle cx="122" cy="235" r="4.5" fill="#3B82F6"/>
  <text x="122" y="238.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#fff">-</text>
  <circle cx="135" cy="242" r="4.5" fill="#EF4444"/>
  <text x="135" y="245.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#fff">+</text>

  <text x="180" y="235" font-size="9" fill="#475569">e⁻ / h⁺ pairs</text>

  <text x="157" y="320" text-anchor="middle" font-size="10" font-weight="600" fill="#0F172A">Charge Collection:</text>
  <text x="157" y="338" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#DC2626">ΔQ = ∫ I(t) dt &gt; Q_crit</text>
  <text x="157" y="360" text-anchor="middle" font-size="9.5" fill="#475569">Transient current spike collapses</text>
  <text x="157" y="374" text-anchor="middle" font-size="9.5" fill="#475569">the reverse-biased depletion region</text>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="298" y1="230" x2="310" y2="230" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel 2: SRAM/DRAM Bitcell State Inversion -->
  <rect x="318" y="70" width="265" height="325" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="318" y="70" width="265" height="32" rx="8" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="330" y="91" font-size="12" font-weight="700" fill="#1F407A">2. Circuit Bit-Flip (SEU)</text>

  <!-- Cross-coupled inverter schematic -->
  <rect x="338" y="115" width="225" height="98" rx="5" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="450" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Cross-Coupled Inverter Pair (SRAM Bitcell)</text>

  <!-- Inverter 1 (left to right) -->
  <polygon points="365,148 365,178 392,163" fill="#E2E8F0" stroke="#475569" stroke-width="1.2"/>
  <circle cx="395" cy="163" r="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>

  <!-- Inverter 2 (right to left) -->
  <polygon points="495,183 495,153 468,168" fill="#E2E8F0" stroke="#475569" stroke-width="1.2"/>
  <circle cx="465" cy="168" r="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>

  <!-- Interconnect Lines -->
  <!-- Out of Inv 1 to In of Inv 2 -->
  <line x1="398" y1="163" x2="425" y2="163" stroke="#DC2626" stroke-width="1.8"/>
  <line x1="425" y1="163" x2="425" y2="168" stroke="#DC2626" stroke-width="1.8"/>
  <line x1="425" y1="168" x2="462" y2="168" stroke="#DC2626" stroke-width="1.8"/>

  <!-- Out of Inv 2 to In of Inv 1 -->
  <line x1="465" y1="168" x2="445" y2="168" stroke="#475569" stroke-width="1.2"/>
  <line x1="445" y1="168" x2="445" y2="198" stroke="#475569" stroke-width="1.2"/>
  <line x1="445" y1="198" x2="350" y2="198" stroke="#475569" stroke-width="1.2"/>
  <line x1="350" y1="198" x2="350" y2="163" stroke="#475569" stroke-width="1.2"/>
  <line x1="350" y1="163" x2="365" y2="163" stroke="#475569" stroke-width="1.2"/>

  <!-- State badge BEFORE and AFTER -->
  <rect x="338" y="225" width="105" height="52" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="390" y="243" text-anchor="middle" font-size="9.5" font-weight="600" fill="#16A34A">Nominal State</text>
  <text x="390" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#16A34A">Bit = 0</text>

  <line x1="450" y1="251" x2="468" y2="251" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="478" y="225" width="95" height="52" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="525" y="243" text-anchor="middle" font-size="9.5" font-weight="600" fill="#DC2626">Corrupted State</text>
  <text x="525" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">Bit = 1</text>

  <text x="450" y="315" text-anchor="middle" font-size="10" font-weight="600" fill="#0F172A">Bistable Latch Overwritten:</text>
  <text x="450" y="336" text-anchor="middle" font-size="9.5" fill="#475569">Voltage spike pulls node below V_thresh;</text>
  <text x="450" y="352" text-anchor="middle" font-size="9.5" fill="#475569">regenerative feedback latches erroneous state.</text>
  <text x="450" y="374" text-anchor="middle" font-size="9" font-weight="600" fill="#1F407A">No permanent hardware damage (soft error)</text>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="591" y1="230" x2="603" y2="230" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel 3: ML System Impact -->
  <rect x="610" y="70" width="265" height="325" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="610" y="70" width="265" height="32" rx="8" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="622" y="91" font-size="12" font-weight="700" fill="#1F407A">3. ML Model Corruption</text>

  <!-- IEEE FP16 representation box -->
  <rect x="622" y="115" width="241" height="74" rx="5" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="742" y="132" text-anchor="middle" font-size="9.5" font-weight="600" fill="#475569">FP16 Weight Bitfield Representation</text>

  <!-- Sign bit cell (corrupted) -->
  <rect x="630" y="142" width="26" height="26" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="643" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#DC2626">1</text>
  <text x="643" y="180" text-anchor="middle" font-size="7.5" font-weight="600" fill="#DC2626">Sign</text>

  <!-- Exponent cells -->
  <rect x="660" y="142" width="70" height="26" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="695" y="159" text-anchor="middle" font-size="10" fill="#1F407A">01111</text>
  <text x="695" y="180" text-anchor="middle" font-size="7.5" fill="#1F407A">5-bit Exp</text>

  <!-- Mantissa cells -->
  <rect x="734" y="142" width="118" height="26" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="793" y="159" text-anchor="middle" font-size="9" fill="#475569">0000000000</text>
  <text x="793" y="180" text-anchor="middle" font-size="7.5" fill="#64748B">10-bit Mantissa</text>

  <!-- Downstream effect rows -->
  <rect x="622" y="200" width="241" height="48" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="632" y="218" font-size="9.5" font-weight="700" fill="#B45309">Weight Value Inversion:</text>
  <text x="632" y="236" font-size="11" font-family="monospace" fill="#0F172A">+1.000  →  -1.000 (Sign Bit Flipped)</text>

  <!-- Systems consequence -->
  <rect x="622" y="258" width="241" height="122" rx="4" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
  <text x="632" y="278" font-size="9.5" font-weight="700" fill="#0F172A">Downstream Systems Manifestation:</text>
  <text x="632" y="298" font-size="9" fill="#475569">• Activation sign reversal flips feature vector</text>
  <text x="632" y="316" font-size="9" fill="#475569">• Cascades through subsequent attention layers</text>
  <text x="632" y="334" font-size="9" fill="#475569">• Loss spikes, NaN gradients, or misclassification</text>
  <text x="632" y="352" font-size="9" fill="#475569">• Training divergence across AllReduce ranks</text>
  <text x="632" y="370" font-size="9" font-weight="600" fill="#DC2626">Silent Data Corruption (SDC) in fleet</text>
</svg>
