<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Elastic recovery in three phases, top to bottom. Blue = worker (C1), amber = ring links (C2),
       violet = rendezvous barrier (C3), red = failed node and broken link, green = enlarged shard. -->
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#ffffff"/>

  <!-- ===== Phase 1: four-node ring ===== -->
  <rect x="20" y="20" width="640" height="110" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="36" y="42" font-size="13" font-weight="700" fill="#0f172a">1. Four-node ring</text>
  <text x="644" y="42" text-anchor="end" font-size="12" fill="#475569">throughput 100%</text>
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#14294E">
    <rect x="80" y="56" width="100" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/><text x="130" y="80">Node 0</text>
    <rect x="220" y="56" width="100" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/><text x="270" y="80">Node 1</text>
    <rect x="360" y="56" width="100" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/><text x="410" y="80">Node 2</text>
    <rect x="500" y="56" width="100" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/><text x="550" y="80">Node 3</text>
  </g>
  <g fill="none" stroke="#d97706" stroke-width="1.5">
    <line x1="180" y1="76" x2="218" y2="76" marker-end="url(#arr-amber)"/>
    <line x1="320" y1="76" x2="358" y2="76" marker-end="url(#arr-amber)"/>
    <line x1="460" y1="76" x2="498" y2="76" marker-end="url(#arr-amber)"/>
    <path d="M550,96 V112 H130 V98" marker-end="url(#arr-amber)"/>
  </g>

  <line x1="340" y1="131" x2="340" y2="147" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Phase 2: node 3 fails, survivors wait and reload ===== -->
  <rect x="20" y="150" width="640" height="130" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="36" y="172" font-size="13" font-weight="700" fill="#0f172a">2. Node 3 fails</text>
  <text x="644" y="172" text-anchor="end" font-size="12" fill="#475569">training paused</text>
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#14294E">
    <rect x="80" y="186" width="100" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/><text x="130" y="210">Node 0</text>
    <rect x="220" y="186" width="100" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/><text x="270" y="210">Node 1</text>
    <rect x="360" y="186" width="100" height="40" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/><text x="410" y="210">Node 2</text>
  </g>
  <rect x="500" y="186" width="100" height="40" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="550" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Node 3</text>
  <text x="550" y="218" text-anchor="middle" font-size="11" fill="#b91c1c">failed</text>
  <g fill="none" stroke="#d97706" stroke-width="1.5">
    <line x1="180" y1="206" x2="218" y2="206" marker-end="url(#arr-amber)"/>
    <line x1="320" y1="206" x2="358" y2="206" marker-end="url(#arr-amber)"/>
  </g>
  <line x1="460" y1="206" x2="500" y2="206" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="80" y="240" width="380" height="26" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="270" y="257" text-anchor="middle" font-size="12" fill="#6d28d9">rendezvous barrier: reload last checkpoint</text>

  <line x1="340" y1="281" x2="340" y2="297" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Phase 3: three-node ring with enlarged shards ===== -->
  <rect x="20" y="300" width="640" height="120" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="36" y="322" font-size="13" font-weight="700" fill="#0f172a">3. Three-node ring</text>
  <text x="644" y="322" text-anchor="end" font-size="12" fill="#475569">throughput 75%</text>
  <g text-anchor="middle">
    <rect x="80" y="336" width="100" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="130" y="356" font-size="12" font-weight="700" fill="#14294E">Node 0</text>
    <text x="130" y="373" font-size="11" fill="#15803d">shard +33%</text>
    <rect x="220" y="336" width="100" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="270" y="356" font-size="12" font-weight="700" fill="#14294E">Node 1</text>
    <text x="270" y="373" font-size="11" fill="#15803d">shard +33%</text>
    <rect x="360" y="336" width="100" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="410" y="356" font-size="12" font-weight="700" fill="#14294E">Node 2</text>
    <text x="410" y="373" font-size="11" fill="#15803d">shard +33%</text>
    <rect x="500" y="336" width="100" height="48" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="550" y="364" font-size="11" fill="#94a3b8">removed</text>
  </g>
  <g fill="none" stroke="#d97706" stroke-width="1.5">
    <line x1="180" y1="360" x2="218" y2="360" marker-end="url(#arr-amber)"/>
    <line x1="320" y1="360" x2="358" y2="360" marker-end="url(#arr-amber)"/>
    <path d="M410,384 V400 H130 V386" marker-end="url(#arr-amber)"/>
  </g>
</svg>
