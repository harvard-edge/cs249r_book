<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <clipPath id="plot-clip">
      <rect x="80" y="55" width="540" height="300" rx="4"/>
    </clipPath>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ── Plot Frame ── -->
  <rect x="80" y="55" width="540" height="300" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- ── Grid Lines ── -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="80" y1="98" x2="620" y2="98"/>
    <line x1="80" y1="141" x2="620" y2="141"/>
    <line x1="80" y1="184" x2="620" y2="184"/>
    <line x1="80" y1="227" x2="620" y2="227"/>
    <line x1="80" y1="270" x2="620" y2="270"/>
    <line x1="80" y1="313" x2="620" y2="313"/>
  </g>

  <!-- ── Axes ── -->
  <line x1="80" y1="355" x2="620" y2="355" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="80" y1="355" x2="80" y2="45" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ── Y-Axis Labels ── -->
  <text x="70" y="358" text-anchor="end" font-size="8.5" fill="#64748b">0%</text>
  <text x="70" y="316" text-anchor="end" font-size="8.5" fill="#64748b">5%</text>
  <text x="70" y="273" text-anchor="end" font-size="8.5" fill="#64748b">10%</text>
  <text x="70" y="230" text-anchor="end" font-size="8.5" fill="#64748b">15%</text>
  <text x="70" y="187" text-anchor="end" font-size="8.5" fill="#64748b">20%</text>
  <text x="70" y="144" text-anchor="end" font-size="8.5" fill="#64748b">25%</text>
  <text x="70" y="101" text-anchor="end" font-size="8.5" fill="#64748b">30%</text>
  <text x="70" y="58" text-anchor="end" font-size="8.5" fill="#64748b">35%</text>

  <!-- Y-Axis Ticks -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="75" y1="355" x2="80" y2="355"/>
    <line x1="75" y1="313" x2="80" y2="313"/>
    <line x1="75" y1="270" x2="80" y2="270"/>
    <line x1="75" y1="227" x2="80" y2="227"/>
    <line x1="75" y1="184" x2="80" y2="184"/>
    <line x1="75" y1="141" x2="80" y2="141"/>
    <line x1="75" y1="98" x2="80" y2="98"/>
    <line x1="75" y1="55" x2="80" y2="55"/>
  </g>

  <!-- ── X-Axis Labels (minutes) ── -->
  <text x="80" y="370" text-anchor="middle" font-size="8.5" fill="#64748b">0</text>
  <text x="157" y="370" text-anchor="middle" font-size="8.5" fill="#64748b">20</text>
  <text x="234" y="370" text-anchor="middle" font-size="8.5" fill="#64748b">40</text>
  <text x="311" y="370" text-anchor="middle" font-size="8.5" fill="#64748b">60</text>
  <text x="388" y="370" text-anchor="middle" font-size="8.5" fill="#64748b">80</text>
  <text x="465" y="370" text-anchor="middle" font-size="8.5" fill="#64748b">100</text>
  <text x="542" y="370" text-anchor="middle" font-size="8.5" fill="#64748b">120</text>
  <text x="619" y="370" text-anchor="middle" font-size="8.5" fill="#64748b">140</text>

  <!-- X-Axis Ticks -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="80" y1="355" x2="80" y2="360"/>
    <line x1="157" y1="355" x2="157" y2="360"/>
    <line x1="234" y1="355" x2="234" y2="360"/>
    <line x1="311" y1="355" x2="311" y2="360"/>
    <line x1="388" y1="355" x2="388" y2="360"/>
    <line x1="465" y1="355" x2="465" y2="360"/>
    <line x1="542" y1="355" x2="542" y2="360"/>
    <line x1="619" y1="355" x2="619" y2="360"/>
  </g>

  <!-- ── Curves within Clip ── -->
  <g clip-path="url(#plot-clip)">
    <!-- Save Overhead (C / tau) - Blue dashed -->
    <path d="M 105,55 C 120,95 135,160 160,205 C 190,255 240,295 300,320 C 370,340 470,350 620,352" fill="none" stroke="#1F407A" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- Expected Rework (tau / 2M) - Red dashed -->
    <path d="M 80,355 L 620,70" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- Total Overhead (U-shaped) - Green solid -->
    <path d="M 105,65 C 120,105 135,170 170,225 C 215,280 270,305 340,308 C 400,308 460,290 520,250 C 560,220 590,185 620,150" fill="none" stroke="#16a34a" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- ── Curve Badges / Labels ── -->
  <!-- Save Overhead Badge -->
  <rect x="125" y="240" width="130" height="20" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="190" y="253.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">Save Overhead (T_write / τ)</text>

  <!-- Total Overhead Badge -->
  <rect x="95" y="65" width="110" height="20" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
  <text x="150" y="78.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Total Overhead</text>

  <!-- Expected Rework Badge (placed safely above rework curve, well clear of callout box) -->
  <rect x="475" y="115" width="138" height="20" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
  <text x="544" y="128.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Rework (τ / 2 MTBF_sys)</text>

  <!-- ── Optimal Callout Card ── -->
  <g transform="translate(260, 68)">
    <rect width="180" height="58" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="8" y="7" width="164" height="18" rx="2" fill="#fee2e2"/>
    <text x="90" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">Minimum Total Overhead</text>
    <text x="90" y="37" text-anchor="middle" font-size="8" fill="#64748b">T_write = 20 min, MTBF = 200 min</text>
    <text x="90" y="50" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">Optimal Interval τ_opt ≈ 89 min</text>
  </g>

  <!-- Dashed vertical indicator line from card to optimal minimum point -->
  <line x1="350" y1="126" x2="350" y2="308" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="350" cy="308" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Vertical dashed line down to x-axis -->
  <line x1="350" y1="308" x2="350" y2="355" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- Optimal Marker on X-axis -->
  <rect x="325" y="378" width="50" height="16" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="350" y="389.5" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">τ_opt (89m)</text>

  <!-- ── Axis Titles ── -->
  <text x="350" y="414" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Checkpoint Interval (minutes)</text>
  <text x="25" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b" transform="rotate(-90, 25, 205)">Time Overhead (%)</text>

  <!-- ── Legend Bar ── -->
  <g transform="translate(100, 442)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#1F407A" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="28" y="3.5" font-size="8.5" fill="#475569">Save overhead</text>

    <line x1="125" y1="0" x2="147" y2="0" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="153" y="3.5" font-size="8.5" fill="#475569">Expected rework</text>

    <line x1="260" y1="0" x2="282" y2="0" stroke="#16a34a" stroke-width="2.8"/>
    <text x="288" y="3.5" font-size="8.5" fill="#475569">Total (U-shaped)</text>

    <circle cx="395" cy="0" r="4" fill="#dc2626"/>
    <text x="405" y="3.5" font-size="8.5" font-weight="600" fill="#1e293b">τ_opt = √(2 · T_write · MTBF)</text>
  </g>
</svg>
