<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="800" height="600" fill="#ffffff"/>

  <!-- ── Spectrum Header Labels ── -->
  <text x="30" y="26" font-size="9.5" font-weight="700" fill="#15803d">Fast Recovery (Soft Errors)</text>
  <text x="400" y="26" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">Marginal / Environmental (Intermittent)</text>
  <text x="770" y="26" text-anchor="end" font-size="9.5" font-weight="700" fill="#b91c1c">Permanent Hardware Loss (Hard Faults)</text>

  <!-- ── Severity gradient bar (top) ── -->
  <g transform="translate(30, 34)">
    <rect x="0" y="0" width="246" height="8" rx="2" fill="#dcfce7"/>
    <rect x="247" y="0" width="246" height="8" rx="2" fill="#fef3c7"/>
    <rect x="494" y="0" width="246" height="8" rx="2" fill="#fee2e2"/>
  </g>

  <!-- ── Connecting progression arrow ── -->
  <line x1="30" y1="52" x2="765" y2="52" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="400" y="68" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Increasing blast radius, diagnosis latency, and operational cost →</text>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- ── COLUMN 1: TRANSIENT FAILURES ── -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 84)">
    <rect width="230" height="494" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 224,0 Q 230,0 230,6 L 230,46 L 0,46 Z" fill="#dcfce7"/>
    <text x="115" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Transient Failures</text>
    <text x="115" y="38" text-anchor="middle" font-size="8.5" font-weight="600" fill="#166534">Duration: Microseconds to Milliseconds</text>

    <!-- Description -->
    <g font-size="8.5" fill="#334155" text-anchor="middle" transform="translate(115, 66)">
      <text y="0">Single-event upset; occurs once</text>
      <text y="14">then vanishes completely.</text>
      <text y="28" font-weight="600" fill="#15803d">Underlying silicon is undamaged.</text>
    </g>

    <!-- Example box -->
    <g transform="translate(15, 114)">
      <rect width="200" height="66" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="100" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Physical Cause</text>
      <text x="100" y="36" text-anchor="middle" font-size="8" fill="#475569">Cosmic ray or alpha particle strike</text>
      <text x="100" y="50" text-anchor="middle" font-size="8" fill="#475569">flips bit in DRAM or register latch</text>
    </g>

    <!-- Detection box -->
    <g transform="translate(15, 192)">
      <rect width="200" height="58" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <text x="100" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Detection Mechanism</text>
      <text x="100" y="34" text-anchor="middle" font-size="8" fill="#334155">In-line SECDED ECC parity checks</text>
      <text x="100" y="46" text-anchor="middle" font-size="7.5" fill="#64748b">Immediate hardware signal interrupt</text>
    </g>

    <!-- Recovery box -->
    <g transform="translate(15, 262)">
      <rect width="200" height="58" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <text x="100" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Recovery Strategy</text>
      <text x="100" y="34" text-anchor="middle" font-size="8" fill="#334155">Automatic 1-bit hardware scrubbing</text>
      <text x="100" y="46" text-anchor="middle" font-size="7.5" fill="#64748b">Zero application interruption</text>
    </g>

    <!-- Frequency Metric Card -->
    <g transform="translate(15, 332)">
      <rect width="200" height="146" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Scale Rate (10K GPUs)</text>
      <line x1="20" y1="28" x2="180" y2="28" stroke="#e2e8f0" stroke-width="1"/>
      <text x="100" y="48" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">~1–5 errors / hour</text>
      <text x="100" y="64" text-anchor="middle" font-size="8" fill="#64748b">99.9% masked by hardware ECC</text>
      <rect x="15" y="78" width="170" height="54" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
      <text x="100" y="94" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">Residual Threat:</text>
      <text x="100" y="108" text-anchor="middle" font-size="7.5" fill="#14532d">Double-bit flips halt execution</text>
      <text x="100" y="120" text-anchor="middle" font-size="7.5" fill="#14532d">Silent data corruption (SDC)</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- ── COLUMN 2: INTERMITTENT FAILURES ── -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(285, 84)">
    <rect width="230" height="494" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 224,0 Q 230,0 230,6 L 230,46 L 0,46 Z" fill="#fef3c7"/>
    <text x="115" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Intermittent Failures</text>
    <text x="115" y="38" text-anchor="middle" font-size="8.5" font-weight="600" fill="#92400e">Duration: Seconds to Minutes</text>

    <!-- Description -->
    <g font-size="8.5" fill="#334155" text-anchor="middle" transform="translate(115, 66)">
      <text y="0">Recurs under specific operating</text>
      <text y="14">conditions (temperature, VDD droop).</text>
      <text y="28" font-weight="600" fill="#b45309">Disappears on cooldown or idle.</text>
    </g>

    <!-- Example box -->
    <g transform="translate(15, 114)">
      <rect width="200" height="66" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="100" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Physical Cause</text>
      <text x="100" y="36" text-anchor="middle" font-size="8" fill="#475569">Solder fatigue, loose optical link,</text>
      <text x="100" y="50" text-anchor="middle" font-size="8" fill="#475569">or high-load voltage fluctuation</text>
    </g>

    <!-- Detection box -->
    <g transform="translate(15, 192)">
      <rect width="200" height="58" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="100" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">Detection Mechanism</text>
      <text x="100" y="34" text-anchor="middle" font-size="8" fill="#334155">Loss anomalies, telemetry drift</text>
      <text x="100" y="46" text-anchor="middle" font-size="7.5" fill="#64748b">PCIe link re-training event counters</text>
    </g>

    <!-- Recovery box -->
    <g transform="translate(15, 262)">
      <rect width="200" height="58" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="100" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">Recovery Strategy</text>
      <text x="100" y="34" text-anchor="middle" font-size="8" fill="#334155">Task retry, frequency throttling</text>
      <text x="100" y="46" text-anchor="middle" font-size="7.5" fill="#64748b">Cordon and drain suspicious node</text>
    </g>

    <!-- Frequency Metric Card -->
    <g transform="translate(15, 332)">
      <rect width="200" height="146" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Scale Rate (10K GPUs)</text>
      <line x1="20" y1="28" x2="180" y2="28" stroke="#e2e8f0" stroke-width="1"/>
      <text x="100" y="48" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309">~1–3 faults / day</text>
      <text x="100" y="64" text-anchor="middle" font-size="8" fill="#64748b">Most insidious to isolate</text>
      <rect x="15" y="78" width="170" height="54" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
      <text x="100" y="94" text-anchor="middle" font-size="7.5" font-weight="700" fill="#92400e">Diagnostic Trap:</text>
      <text x="100" y="108" text-anchor="middle" font-size="7.5" fill="#78350f">Node passes idle offline diagnostics</text>
      <text x="100" y="120" text-anchor="middle" font-size="7.5" fill="#78350f">Re-fails immediately under full load</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- ── COLUMN 3: PERMANENT FAILURES ── -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(540, 84)">
    <rect width="230" height="494" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 224,0 Q 230,0 230,6 L 230,46 L 0,46 Z" fill="#fee2e2"/>
    <text x="115" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Permanent Failures</text>
    <text x="115" y="38" text-anchor="middle" font-size="8.5" font-weight="600" fill="#991b1b">Duration: Forever (Irreversible)</text>

    <!-- Description -->
    <g font-size="8.5" fill="#334155" text-anchor="middle" transform="translate(115, 66)">
      <text y="0">Physical silicon damage or burn;</text>
      <text y="14">component cannot recover on retry.</text>
      <text y="28" font-weight="600" fill="#b91c1c">Requires physical replacement.</text>
    </g>

    <!-- Example box -->
    <g transform="translate(15, 114)">
      <rect width="200" height="66" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="100" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Physical Cause</text>
      <text x="100" y="36" text-anchor="middle" font-size="8" fill="#475569">Gate dielectric breakdown, short,</text>
      <text x="100" y="50" text-anchor="middle" font-size="8" fill="#475569">or electromigration wire void</text>
    </g>

    <!-- Detection box -->
    <g transform="translate(15, 192)">
      <rect width="200" height="58" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="100" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">Detection Mechanism</text>
      <text x="100" y="34" text-anchor="middle" font-size="8" fill="#334155">Heartbeat timeout, fatal MCE</text>
      <text x="100" y="46" text-anchor="middle" font-size="7.5" fill="#64748b">PCIe device fallen off bus</text>
    </g>

    <!-- Recovery box -->
    <g transform="translate(15, 262)">
      <rect width="200" height="58" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="100" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">Recovery Strategy</text>
      <text x="100" y="34" text-anchor="middle" font-size="8" fill="#334155">Hot-spare node swap &amp; resume</text>
      <text x="100" y="46" text-anchor="middle" font-size="7.5" fill="#64748b">RMA hardware component replacement</text>
    </g>

    <!-- Frequency Metric Card -->
    <g transform="translate(15, 332)">
      <rect width="200" height="146" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Scale Rate (10K GPUs)</text>
      <line x1="20" y1="28" x2="180" y2="28" stroke="#e2e8f0" stroke-width="1"/>
      <text x="100" y="48" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">~1 hardware death / 5 hrs</text>
      <text x="100" y="64" text-anchor="middle" font-size="8" fill="#64748b">MTBF_sys = MTBF_comp / N</text>
      <rect x="15" y="78" width="170" height="54" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
      <text x="100" y="94" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">Fleet Consequence:</text>
      <text x="100" y="108" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Demands checkpoint rollback</text>
      <text x="100" y="120" text-anchor="middle" font-size="7.5" fill="#7f1d1d">N+1 redundancy buffer required</text>
    </g>
  </g>
</svg>
