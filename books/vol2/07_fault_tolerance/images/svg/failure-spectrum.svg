<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Failure spectrum ordered by fault persistence: transient, intermittent, permanent.
       Each card: behavior, typical cause, fleet response (short labels; caption explains). -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="220" fill="#ffffff"/>

  <!-- ===== Persistence axis ===== -->
  <line x1="20" y1="30" x2="652" y2="30" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <text x="20" y="20" font-size="12" fill="#475569">clears on its own</text>
  <text x="340" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">fault persistence</text>
  <text x="660" y="20" text-anchor="end" font-size="12" fill="#475569">lasts until repaired</text>

  <!-- ===== Transient ===== -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="200" height="160" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="28" rx="3" fill="#e2e8f0"/>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="19" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Transient</text>
    <text x="100" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">occurs once</text>
    <text x="14" y="86" font-size="12" font-weight="700" fill="#475569">cause</text>
    <text x="14" y="104" font-size="12" fill="#0f172a">particle strike</text>
    <text x="14" y="132" font-size="12" font-weight="700" fill="#475569">response</text>
    <text x="14" y="150" font-size="12" fill="#0f172a">retry or roll back</text>
  </g>

  <!-- ===== Intermittent ===== -->
  <g transform="translate(240,50)">
    <rect x="0" y="0" width="200" height="160" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="28" rx="3" fill="#e2e8f0"/>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="19" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Intermittent</text>
    <text x="100" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">recurs under load</text>
    <text x="14" y="86" font-size="12" font-weight="700" fill="#475569">cause</text>
    <text x="14" y="104" font-size="12" fill="#0f172a">cracked solder joint</text>
    <text x="14" y="132" font-size="12" font-weight="700" fill="#475569">response</text>
    <text x="14" y="150" font-size="12" fill="#0f172a">drain and stress-test</text>
  </g>

  <!-- ===== Permanent ===== -->
  <g transform="translate(460,50)">
    <rect x="0" y="0" width="200" height="160" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="28" rx="3" fill="#e2e8f0"/>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="19" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Permanent</text>
    <text x="100" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">fails on every retry</text>
    <text x="14" y="86" font-size="12" font-weight="700" fill="#475569">cause</text>
    <text x="14" y="104" font-size="12" fill="#0f172a">stuck-at fault, wear-out</text>
    <text x="14" y="132" font-size="12" font-weight="700" fill="#475569">response</text>
    <text x="14" y="150" font-size="12" fill="#0f172a">replace and restore</text>
  </g>
</svg>
