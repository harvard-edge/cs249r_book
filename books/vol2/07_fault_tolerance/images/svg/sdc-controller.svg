<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="480" fill="#ffffff"/>

  <!-- Panel dividers -->
  <line x1="440" y1="16" x2="440" y2="464" stroke="#f1f5f9" stroke-width="1.2"/>
  <line x1="16" y1="240" x2="864" y2="240" stroke="#f1f5f9" stroke-width="1.2"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL 1: NOMINAL TRAINING                                             -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 20)">
    <rect width="395" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 389,0 Q 395,0 395,6 L 395,30 L 0,30 Z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="14" y="20" font-size="10" font-weight="700" fill="#166534">Phase 1: Nominal Cluster Training</text>
    <text x="381" y="20" text-anchor="end" font-size="8.5" fill="#15803d">4 Active GPUs · 1 Hot Spare</text>

    <!-- 4 Active GPUs -->
    <g transform="translate(18, 44)">
      <g transform="translate(0, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 0</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <g transform="translate(70, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 1</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <g transform="translate(140, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 2</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <g transform="translate(210, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 3</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <g transform="translate(290, 0)">
        <rect width="65" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <text x="32" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">Hot Spare</text>
        <text x="32" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">STANDBY</text>
      </g>
    </g>

    <!-- Health Monitor Badge -->
    <g transform="translate(18, 102)">
      <rect width="358" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="179" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Health Monitor Status</text>
      <text x="179" y="27" text-anchor="middle" font-size="8" fill="#475569">Gradient statistics nominal · Loss curve converging smoothly</text>
    </g>

    <!-- Telemetry Status Pill -->
    <g transform="translate(18, 148)">
      <rect width="358" height="38" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="179" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">All Checksums &amp; Inf/NaN Traps Passing</text>
      <text x="179" y="29" text-anchor="middle" font-size="7.5" fill="#15803d">Cross-iteration gradient cosine similarity &gt; 0.98</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL 2: SDC DETECTED & ISOLATED                                      -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(465, 20)">
    <rect width="395" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 389,0 Q 395,0 395,6 L 395,30 L 0,30 Z" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="14" y="20" font-size="10" font-weight="700" fill="#991b1b">Phase 2: SDC Detected &amp; Quarantined</text>
    <text x="381" y="20" text-anchor="end" font-size="8.5" font-weight="700" fill="#dc2626">GPU 2 Anomaly Flagged</text>

    <!-- 4 Active GPUs with GPU 2 faulty -->
    <g transform="translate(18, 44)">
      <g transform="translate(0, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 0</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <g transform="translate(70, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 1</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <!-- GPU 2 FAULTY -->
      <g transform="translate(140, 0)">
        <rect width="60" height="42" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
        <text x="30" y="16" text-anchor="middle" font-size="9.5" font-weight="800" fill="#991b1b">GPU 2 ⚠</text>
        <text x="30" y="27" text-anchor="middle" font-size="7" font-weight="700" fill="#dc2626">SDC FLIP</text>
        <text x="30" y="36" text-anchor="middle" font-size="6.5" fill="#7f1d1d">Quarantined</text>
      </g>
      <g transform="translate(210, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 3</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <g transform="translate(290, 0)">
        <rect width="65" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <text x="32" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">Hot Spare</text>
        <text x="32" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">STANDBY</text>
      </g>
    </g>

    <!-- Health Monitor Alert Badge -->
    <g transform="translate(18, 102)">
      <rect width="358" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="179" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Monitor Alert: Invariant Violation</text>
      <text x="179" y="27" text-anchor="middle" font-size="8" fill="#7f1d1d">Gradient checksum mismatch / activation norm outlier on rank 2</text>
    </g>

    <!-- Alert Action Pill -->
    <g transform="translate(18, 148)">
      <rect width="358" height="38" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="179" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Action: Pause Job &amp; Cordon Rank 2</text>
      <text x="179" y="29" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Fencing token invalidated; prevents corrupt weight commit</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL 3: HOT SPARE ACTIVATED                                          -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 260)">
    <rect width="395" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 389,0 Q 395,0 395,6 L 395,30 L 0,30 Z" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="14" y="20" font-size="10" font-weight="700" fill="#92400e">Phase 3: Hot-Spare Dynamic Failover</text>
    <text x="381" y="20" text-anchor="end" font-size="8.5" font-weight="700" fill="#b45309">Sub-Minute Resumption</text>

    <!-- Hot spare joining -->
    <g transform="translate(18, 44)">
      <g transform="translate(0, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 0</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <g transform="translate(70, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 1</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <!-- Defective GPU 2 isolated -->
      <g transform="translate(140, 0)">
        <rect width="60" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">GPU 2</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" fill="#94a3b8">ISOLATED</text>
      </g>
      <g transform="translate(210, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 3</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <!-- Spare Active -->
      <g transform="translate(290, 0)">
        <rect width="65" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
        <text x="32" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Spare GPU</text>
        <text x="32" y="32" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">PROMOTED</text>
      </g>
    </g>



    <!-- Recovery Steps -->
    <g transform="translate(18, 102)">
      <rect width="358" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="179" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Fast Re-Topology &amp; State Hydration</text>
      <text x="179" y="27" text-anchor="middle" font-size="8" fill="#475569">NCCL communicators re-initialized · Last good shard loaded into spare</text>
    </g>

    <g transform="translate(18, 148)">
      <rect width="358" height="38" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="179" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">Zero Job Rescheduling Penalty</text>
      <text x="179" y="29" text-anchor="middle" font-size="7.5" fill="#78350f">Training restarts from iteration N-1 with 4-GPU ring preserved</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL 4: QUARANTINED & HEALED CLUSTER                                -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(465, 260)">
    <rect width="395" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,6 Q 0,0 6,0 L 389,0 Q 395,0 395,6 L 395,30 L 0,30 Z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="14" y="20" font-size="10" font-weight="700" fill="#1e40af">Phase 4: Hardware RMA &amp; Cluster Restored</text>
    <text x="381" y="20" text-anchor="end" font-size="8.5" font-weight="700" fill="#1F407A">Full N+1 Resilience Re-established</text>

    <!-- Cluster restored -->
    <g transform="translate(18, 44)">
      <g transform="translate(0, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 0</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <g transform="translate(70, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 1</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <!-- Permanent replacement -->
      <g transform="translate(140, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 2'</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">PERM</text>
      </g>
      <g transform="translate(210, 0)">
        <rect width="60" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="30" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">GPU 3</text>
        <text x="30" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">ACTIVE</text>
      </g>
      <!-- Defective GPU to RMA -->
      <g transform="translate(290, 0)">
        <rect width="65" height="42" rx="4" fill="#f8fafc" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="32" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#dc2626">Defective</text>
        <text x="32" y="32" text-anchor="middle" font-size="7.5" fill="#7f1d1d">→ RMA Eject</text>
      </g>
    </g>

    <!-- RMA ejection arrow -->
    <line x1="322" y1="42" x2="322" y2="34" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Operational State -->
    <g transform="translate(18, 102)">
      <rect width="358" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="179" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Background Fleet Provisioning</text>
      <text x="179" y="27" text-anchor="middle" font-size="8" fill="#475569">Defective sled dispatched for repair · New spare re-provisioned into pool</text>
    </g>

    <g transform="translate(18, 148)">
      <rect width="358" height="38" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="179" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">Continuous Production Availability</text>
      <text x="179" y="29" text-anchor="middle" font-size="7.5" fill="#1e3a8a">No human intervention required on critical training critical path</text>
    </g>
  </g>

  <!-- Flow arrows between panels -->
  <line x1="415" y1="120" x2="465" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="217" y1="220" x2="217" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="662" y1="220" x2="662" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="360" x2="465" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>