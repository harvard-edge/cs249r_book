<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="480" fill="#ffffff"/>

  <!-- ===== (A) Normal Training — top left ===== -->
  <g transform="translate(20, 15)">
    <rect width="310" height="215" rx="4" fill="#ffffff" stroke="#16A34A" stroke-width="1.2"/>
    <rect width="310" height="26" rx="4" fill="#DCFCE7"/>
    <line x1="0" y1="26" x2="310" y2="26" stroke="#86EFAC" stroke-width="1"/>
    <text x="14" y="17" font-size="10" font-weight="700" fill="#15803D">(A) NORMAL TRAINING</text>
    <text x="14" y="42" font-size="8.5" fill="#475569">Smooth monotonic descent with minor batch variance</text>

    <!-- Axes -->
    <line x1="45" y1="165" x2="45" y2="65" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="45" y1="165" x2="295" y2="165" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="32" y="62" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">Loss</text>
    <text x="285" y="178" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">Steps</text>

    <!-- Normal loss curve -->
    <polyline points="45,75 65,80 85,90 105,102 125,115 145,125 165,135 185,142 205,148 225,150 245,150 265,150 285,150" fill="none" stroke="#16A34A" stroke-width="2" stroke-linejoin="round"/>

    <!-- Annotations -->
    <text x="55" y="70" font-size="7.5" fill="#15803D" font-weight="700">Start</text>
    <text x="245" y="142" font-size="7.5" fill="#15803D" font-weight="700">Converged</text>
    <rect x="12" y="184" width="286" height="20" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="155" y="198" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803D">Signature: stable descent, bounded gradient variance</text>
  </g>

  <!-- ===== (B) Gradient Explosion — top right ===== -->
  <g transform="translate(350, 15)">
    <rect width="310" height="215" rx="4" fill="#ffffff" stroke="#DC2626" stroke-width="1.2"/>
    <rect width="310" height="26" rx="4" fill="#FEE2E2"/>
    <line x1="0" y1="26" x2="310" y2="26" stroke="#FECACA" stroke-width="1"/>
    <text x="14" y="17" font-size="10" font-weight="700" fill="#991B1B">(B) GRADIENT EXPLOSION</text>
    <text x="14" y="42" font-size="8.5" fill="#475569">Sudden catastrophic spike exceeding loss bounds</text>

    <!-- Axes -->
    <line x1="45" y1="165" x2="45" y2="75" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="45" y1="165" x2="295" y2="165" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="32" y="72" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">Loss</text>
    <text x="285" y="178" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">Steps</text>

    <!-- Explosion loss curve -->
    <polyline points="45,85 65,90 85,100 105,110 125,120 145,128 160,132 170,72 180,82 200,132 220,130 250,130 285,130" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round"/>

    <!-- Spike annotation -->
    <line x1="170" y1="72" x2="170" y2="60" stroke="#DC2626" stroke-width="1.2"/>
    <text x="170" y="56" text-anchor="middle" font-size="7.5" fill="#DC2626" font-weight="700">Spike</text>
    <rect x="12" y="184" width="286" height="20" rx="2" fill="#FEF2F2" stroke="#FECACA" stroke-width="0.8"/>
    <text x="155" y="198" text-anchor="middle" font-size="7.5" font-weight="600" fill="#991B1B">Signature: loss spike, gradient norm ≥ 100× baseline</text>
  </g>

  <!-- ===== (C) Loss Plateau — bottom left ===== -->
  <g transform="translate(20, 245)">
    <rect width="310" height="215" rx="4" fill="#ffffff" stroke="#D97706" stroke-width="1.2"/>
    <rect width="310" height="26" rx="4" fill="#FEF3C7"/>
    <line x1="0" y1="26" x2="310" y2="26" stroke="#FDE68A" stroke-width="1"/>
    <text x="14" y="17" font-size="10" font-weight="700" fill="#B45309">(C) LOSS PLATEAU</text>
    <text x="14" y="42" font-size="8.5" fill="#475569">Learning stalls prematurely; zero meaningful descent</text>

    <!-- Axes -->
    <line x1="45" y1="165" x2="45" y2="65" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="45" y1="165" x2="295" y2="165" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="32" y="62" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">Loss</text>
    <text x="285" y="178" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">Steps</text>

    <!-- Plateau curve -->
    <polyline points="45,75 65,80 85,90 105,102 125,115 145,120 165,120 185,120 205,120 225,120 245,120 265,120 285,120" fill="none" stroke="#D97706" stroke-width="2" stroke-linejoin="round"/>

    <!-- Plateau annotation -->
    <rect x="150" y="100" width="115" height="14" rx="2" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.8"/>
    <text x="207.5" y="111" text-anchor="middle" font-size="7.5" font-weight="600" fill="#B45309">Plateau Region</text>
    <rect x="12" y="184" width="286" height="20" rx="2" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8"/>
    <text x="155" y="198" text-anchor="middle" font-size="7.5" font-weight="600" fill="#B45309">Signature: vanishing gradient norm, optimizer stagnation</text>
  </g>

  <!-- ===== (D) NaN Divergence — bottom right ===== -->
  <g transform="translate(350, 245)">
    <rect width="310" height="215" rx="4" fill="#ffffff" stroke="#DC2626" stroke-width="1.2"/>
    <rect width="310" height="26" rx="4" fill="#FEE2E2"/>
    <line x1="0" y1="26" x2="310" y2="26" stroke="#FECACA" stroke-width="1"/>
    <text x="14" y="17" font-size="10" font-weight="700" fill="#991B1B">(D) NAN DIVERGENCE</text>
    <text x="14" y="42" font-size="8.5" fill="#475569">Erratic numerical oscillation collapsing to Inf / NaN</text>

    <!-- Axes -->
    <line x1="45" y1="165" x2="45" y2="65" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="45" y1="165" x2="295" y2="165" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="32" y="62" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">Loss</text>
    <text x="285" y="178" text-anchor="middle" font-size="8" font-weight="600" fill="#64748B">Steps</text>

    <!-- NaN curve -->
    <polyline points="45,85 65,75 85,95 105,65 125,115 145,65 165,135 175,75 185,145" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- NaN termination marker -->
    <line x1="185" y1="65" x2="185" y2="155" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="195" y="90" width="85" height="24" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
    <text x="237.5" y="106" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">NaN Halt</text>

    <rect x="12" y="184" width="286" height="20" rx="2" fill="#FEF2F2" stroke="#FECACA" stroke-width="0.8"/>
    <text x="155" y="198" text-anchor="middle" font-size="7.5" font-weight="600" fill="#991B1B">Signature: numerical overflow, IEEE-754 exception trap</text>
  </g>
</svg>