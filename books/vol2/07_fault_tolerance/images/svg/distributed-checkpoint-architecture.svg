<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Left: centralized checkpointing funnels every shard through one coordinator (red bottleneck).
       Right: distributed checkpointing writes each shard to local NVMe in parallel, then drains to
       object storage in the background. Blue = workers, violet = coordinator, green = storage. -->
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="240" fill="#ffffff"/>

  <!-- ===== Left: centralized ===== -->
  <text x="170" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Centralized</text>
  <g font-size="12" font-weight="700" fill="#14294E" text-anchor="middle">
    <rect x="10" y="36" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="50" y="55">Worker 0</text>
    <rect x="10" y="80" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="50" y="99">Worker 1</text>
    <rect x="10" y="124" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="50" y="143">Worker 2</text>
    <rect x="10" y="168" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="50" y="187">Worker 3</text>
  </g>
  <g stroke="#dc2626" stroke-width="1.4" fill="none">
    <path d="M90,51 H112 V110"/>
    <path d="M90,95 H112"/>
    <path d="M90,139 H112"/>
    <path d="M90,183 H112 V110"/>
    <line x1="112" y1="117" x2="128" y2="117" marker-end="url(#arr-red)"/>
  </g>
  <rect x="130" y="92" width="100" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="180" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Coordinator</text>
  <text x="180" y="130" text-anchor="middle" font-size="12" fill="#b91c1c">ingress limit</text>
  <line x1="230" y1="117" x2="248" y2="117" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="250" y="92" width="80" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="290" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Shared</text>
  <text x="290" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">storage</text>
  <text x="170" y="228" text-anchor="middle" font-size="12" fill="#475569">write time grows with worker count</text>

  <line x1="340" y1="10" x2="340" y2="230" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== Right: distributed ===== -->
  <text x="510" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Distributed</text>
  <g font-size="12" font-weight="700" fill="#14294E" text-anchor="middle">
    <rect x="350" y="36" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="390" y="55">Worker 0</text>
    <rect x="350" y="80" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="390" y="99">Worker 1</text>
    <rect x="350" y="124" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="390" y="143">Worker 2</text>
    <rect x="350" y="168" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="390" y="187">Worker 3</text>
  </g>
  <g font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">
    <rect x="460" y="36" width="70" height="30" rx="2" fill="#dcfce7" stroke="#16a34a"/><text x="495" y="55">NVMe</text>
    <rect x="460" y="80" width="70" height="30" rx="2" fill="#dcfce7" stroke="#16a34a"/><text x="495" y="99">NVMe</text>
    <rect x="460" y="124" width="70" height="30" rx="2" fill="#dcfce7" stroke="#16a34a"/><text x="495" y="143">NVMe</text>
    <rect x="460" y="168" width="70" height="30" rx="2" fill="#dcfce7" stroke="#16a34a"/><text x="495" y="187">NVMe</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.4">
    <line x1="430" y1="51" x2="458" y2="51" marker-end="url(#arr-green)"/>
    <line x1="430" y1="95" x2="458" y2="95" marker-end="url(#arr-green)"/>
    <line x1="430" y1="139" x2="458" y2="139" marker-end="url(#arr-green)"/>
    <line x1="430" y1="183" x2="458" y2="183" marker-end="url(#arr-green)"/>
  </g>
  <g stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" fill="none">
    <path d="M530,51 H552 V110"/>
    <path d="M530,95 H552"/>
    <path d="M530,139 H552"/>
    <path d="M530,183 H552 V110"/>
    <line x1="552" y1="117" x2="568" y2="117" marker-end="url(#arr-gray)"/>
  </g>
  <rect x="570" y="92" width="100" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="620" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Object store</text>
  <text x="620" y="130" text-anchor="middle" font-size="12" fill="#15803d">background</text>
  <text x="510" y="228" text-anchor="middle" font-size="12" fill="#475569">fixed-size shards bound local write work</text>
</svg>
