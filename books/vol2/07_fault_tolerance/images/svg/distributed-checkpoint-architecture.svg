<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="540" fill="#ffffff"/>

  <!-- ===== Left panel: Centralized checkpointing ===== -->
  <g transform="translate(20, 20)">
    <rect width="395" height="500" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Header band -->
    <path d="M 0,6 Q 0,0 6,0 L 389,0 Q 395,0 395,6 L 395,44 L 0,44 Z" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="197" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Panel A: Centralized Coordinator Bottleneck</text>
    <text x="197" y="36" text-anchor="middle" font-size="8.5" fill="#7f1d1d">All worker state funnels through a single coordinator process</text>

    <!-- Compute nodes (workers) -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <g transform="translate(20, 64)">
        <rect width="80" height="36" rx="4" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
        <text x="40" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Worker 0</text>
        <text x="40" y="28" text-anchor="middle" font-size="8.5" fill="#1e40af">shard 0</text>
      </g>
      <g transform="translate(20, 114)">
        <rect width="80" height="36" rx="4" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
        <text x="40" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Worker 1</text>
        <text x="40" y="28" text-anchor="middle" font-size="8.5" fill="#1e40af">shard 1</text>
      </g>
      <g transform="translate(20, 164)">
        <rect width="80" height="36" rx="4" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
        <text x="40" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Worker 2</text>
        <text x="40" y="28" text-anchor="middle" font-size="8.5" fill="#1e40af">shard 2</text>
      </g>
      <g transform="translate(20, 214)">
        <rect width="80" height="36" rx="4" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
        <text x="40" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Worker 3</text>
        <text x="40" y="28" text-anchor="middle" font-size="8.5" fill="#1e40af">shard 3</text>
      </g>
    </g>

    <!-- Funnel network arrows -->
    <path d="M 100 82 L 130 82 L 130 142 L 165 142" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <path d="M 100 132 L 145 132 L 145 152 L 165 152" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <path d="M 100 182 L 145 182 L 145 162 L 165 162" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <path d="M 100 232 L 130 232 L 130 172 L 165 172" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <!-- Coordinator Box -->
    <rect x="170" y="128" width="105" height="58" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="222" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Coordinator</text>
    <text x="222" y="165" text-anchor="middle" font-size="8" font-weight="800" fill="#b91c1c">INGRESS SATURATED</text>
    <text x="222" y="176" text-anchor="middle" font-size="7" fill="#7f1d1d">Single Point of Failure</text>

    <!-- Coordinator to PFS -->
    <line x1="275" y1="157" x2="310" y2="157" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow-red)"/>

    <!-- PFS Storage Box -->
    <rect x="315" y="128" width="65" height="58" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="347" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">PFS</text>
    <text x="347" y="164" text-anchor="middle" font-size="8" fill="#78350f">Shared</text>
    <text x="347" y="175" text-anchor="middle" font-size="8" fill="#78350f">Storage</text>

    <!-- Left: Bottleneck Analysis Card -->
    <g transform="translate(15, 270)">
      <rect width="365" height="215" rx="4" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
      <path d="M 0,4 Q 0,0 4,0 L 361,0 Q 365,0 365,4 L 365,24 L 0,24 Z" fill="#fee2e2"/>
      <text x="182" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991b1b">Centralized Scalability Failure</text>

      <g font-size="8" fill="#334155" transform="translate(14, 40)">
        <text y="0"><tspan font-weight="700" fill="#0f172a">Data Path:</tspan><tspan dx="4">All worker state funnels through one coordinator process.</tspan></text>
        <text y="20"><tspan font-weight="700" fill="#0f172a">Memory Pressure:</tspan><tspan dx="4">Coordinator must buffer full global checkpoint in memory.</tspan></text>
        <text y="40"><tspan font-weight="700" fill="#0f172a">NIC Ingress Fan-In:</tspan><tspan dx="4">N worker streams saturate single receiver bandwidth.</tspan></text>
        <text y="60"><tspan font-weight="700" fill="#0f172a">Fault Vulnerability:</tspan><tspan dx="4">Coordinator failure corrupts or halts the entire save.</tspan></text>
      </g>

      <!-- Bottleneck metric pill -->
      <g transform="translate(14, 122)">
        <rect width="337" height="42" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="168" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">Write Time Growth: T_write = O(N · M_shard / B_coord)</text>
        <text x="168" y="30" text-anchor="middle" font-size="8" fill="#7f1d1d">1,000 workers at 1 GB/s each = 1 TB/s coordinator ingress required</text>
      </g>
    </g>
  </g>

  <!-- ===== Right panel: Distributed/sharded checkpointing ===== -->
  <g transform="translate(445, 20)">
    <rect width="395" height="500" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Header band -->
    <path d="M 0,6 Q 0,0 6,0 L 389,0 Q 395,0 395,6 L 395,44 L 0,44 Z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="197" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Panel B: Distributed Sharded Architecture</text>
    <text x="197" y="36" text-anchor="middle" font-size="8.5" fill="#14532d">Each worker saves shard to local NVMe, background async upload</text>

    <!-- Compute nodes (workers) -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <g transform="translate(20, 64)">
        <rect width="75" height="36" rx="4" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
        <text x="37" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Worker 0</text>
        <text x="37" y="28" text-anchor="middle" font-size="8.5" fill="#1e40af">shard 0</text>
      </g>
      <g transform="translate(20, 114)">
        <rect width="75" height="36" rx="4" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
        <text x="37" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Worker 1</text>
        <text x="37" y="28" text-anchor="middle" font-size="8.5" fill="#1e40af">shard 1</text>
      </g>
      <g transform="translate(20, 164)">
        <rect width="75" height="36" rx="4" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
        <text x="37" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Worker 2</text>
        <text x="37" y="28" text-anchor="middle" font-size="8.5" fill="#1e40af">shard 2</text>
      </g>
      <g transform="translate(20, 214)">
        <rect width="75" height="36" rx="4" fill="#eff6ff" stroke="#1F407A" stroke-width="1.2"/>
        <text x="37" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Worker 3</text>
        <text x="37" y="28" text-anchor="middle" font-size="8.5" fill="#1e40af">shard 3</text>
      </g>

      <!-- Local NVMe boxes -->
      <g transform="translate(130, 64)">
        <rect width="75" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="37" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">NVMe 0</text>
        <text x="37" y="28" text-anchor="middle" font-size="8" fill="#166534">Local SSD</text>
      </g>
      <g transform="translate(130, 114)">
        <rect width="75" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="37" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">NVMe 1</text>
        <text x="37" y="28" text-anchor="middle" font-size="8" fill="#166534">Local SSD</text>
      </g>
      <g transform="translate(130, 164)">
        <rect width="75" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="37" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">NVMe 2</text>
        <text x="37" y="28" text-anchor="middle" font-size="8" fill="#166534">Local SSD</text>
      </g>
      <g transform="translate(130, 214)">
        <rect width="75" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="37" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">NVMe 3</text>
        <text x="37" y="28" text-anchor="middle" font-size="8" fill="#166534">Local SSD</text>
      </g>
    </g>

    <!-- Fast PCIe direct writes -->
    <line x1="95" y1="82" x2="125" y2="82" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
    <line x1="95" y1="132" x2="125" y2="132" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
    <line x1="95" y1="182" x2="125" y2="182" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
    <line x1="95" y1="232" x2="125" y2="232" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>

    <!-- Async upload arrows to Object Store -->
    <path d="M 205 82 L 235 82 L 235 142 L 265 142" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
    <path d="M 205 132 L 245 132 L 245 152 L 265 152" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
    <path d="M 205 182 L 245 182 L 245 162 L 265 162" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
    <path d="M 205 232 L 235 232 L 235 172 L 265 172" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

    <!-- Remote Storage Target -->
    <rect x="270" y="128" width="105" height="58" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="322" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Remote Object Store</text>
    <text x="322" y="162" text-anchor="middle" font-size="8" fill="#78350f">S3 / GCS / Ceph</text>
    <text x="322" y="174" text-anchor="middle" font-size="7.5" font-weight="600" fill="#b45309">Async Background Drain</text>

    <!-- Right: Throughput Analysis Card -->
    <g transform="translate(15, 270)">
      <rect width="365" height="215" rx="4" fill="#f8fafc" stroke="#86efac" stroke-width="1"/>
      <path d="M 0,4 Q 0,0 4,0 L 361,0 Q 365,0 365,4 L 365,24 L 0,24 Z" fill="#dcfce7"/>
      <text x="182" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">Distributed Linear Throughput</text>

      <g font-size="8" fill="#334155" transform="translate(14, 40)">
        <text y="0"><tspan font-weight="700" fill="#0f172a">Data Path:</tspan><tspan dx="4">Each worker writes exclusively its own shard in parallel.</tspan></text>
        <text y="20"><tspan font-weight="700" fill="#0f172a">Zero Network Contention:</tspan><tspan dx="4">Blocking phase completes at full local NVMe bus bandwidth.</tspan></text>
        <text y="40"><tspan font-weight="700" fill="#0f172a">Asynchronous Staging:</tspan><tspan dx="4">Background daemon streams NVMe shards to remote storage.</tspan></text>
        <text y="60"><tspan font-weight="700" fill="#0f172a">Atomic Commit:</tspan><tspan dx="4">Coordinator publishes only a tiny manifest JSON on completion.</tspan></text>
      </g>

      <!-- Distributed metric pill -->
      <g transform="translate(14, 122)">
        <rect width="337" height="42" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="168" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">Blocking Write Time: T_write = O(1) constant per worker</text>
        <text x="168" y="30" text-anchor="middle" font-size="8" fill="#14532d">1,000 workers at 1 GB/s = 1 TB/s aggregated parallel cluster bandwidth</text>
      </g>
    </g>
  </g>
</svg>
