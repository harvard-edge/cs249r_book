<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 628 430" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Error masking: a soft error must pass two filters (read, then wrong output) to become a failure.
       The failure path (Yes, Yes) is the heavy red spine; the masked exits are light.
       Software fault injection enters after the first filter, so its view (shaded region) holds only the second. -->
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="-2" width="628" height="430" fill="#ffffff"/>

  <!-- ===== View of software fault injection: everything below the injection point ===== -->
  <rect x="24" y="196" width="580" height="210" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="592" y="396" text-anchor="end" font-size="12" font-style="italic" fill="#475569">view of software fault injection</text>

  <!-- ===== Source ===== -->
  <rect x="60" y="20" width="140" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="43" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Soft error</text>

  <!-- ===== Failure spine (Yes, Yes): heavy red ===== -->
  <line x1="130" y1="56" x2="130" y2="83" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="130" y1="166" x2="130" y2="237" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="120" y="186" text-anchor="end" font-size="12" font-weight="700" fill="#b91c1c">Yes</text>
  <line x1="130" y1="320" x2="130" y2="353" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="120" y="341" text-anchor="end" font-size="12" font-weight="700" fill="#b91c1c">Yes</text>

  <!-- ===== Filter 1: microarchitecture ===== -->
  <polygon points="40,126 130,86 220,126 130,166" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="130" y="123" text-anchor="middle" font-size="12" fill="#0f172a">Corrupted</text>
  <text x="130" y="139" text-anchor="middle" font-size="12" fill="#0f172a">data read?</text>

  <line x1="220" y1="126" x2="298" y2="126" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="258" y="118" text-anchor="middle" font-size="12" fill="#64748b">No</text>
  <rect x="300" y="106" width="140" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="370" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Masked</text>
  <text x="370" y="139" text-anchor="middle" font-size="12" fill="#15803d">microarchitecture</text>

  <line x1="440" y1="126" x2="460" y2="126" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="460" y1="102" x2="460" y2="150" stroke="#cbd5e1" stroke-width="1"/>
  <text x="472" y="110" font-size="12" fill="#475569">unused component</text>
  <text x="472" y="130" font-size="12" fill="#475569">overwritten value</text>
  <text x="472" y="150" font-size="12" fill="#475569">squashed speculation</text>

  <!-- ===== Software fault injection enters the spine here ===== -->
  <line x1="320" y1="216" x2="137" y2="216" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-slate)"/>
  <text x="330" y="220" font-size="12" font-style="italic" fill="#475569">software fault injection</text>

  <!-- ===== Filter 2: software ===== -->
  <polygon points="40,280 130,240 220,280 130,320" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="130" y="277" text-anchor="middle" font-size="12" fill="#0f172a">Incorrect output</text>
  <text x="130" y="293" text-anchor="middle" font-size="12" fill="#0f172a">or crash?</text>

  <line x1="220" y1="280" x2="298" y2="280" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="258" y="272" text-anchor="middle" font-size="12" fill="#64748b">No</text>
  <rect x="300" y="260" width="140" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="370" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Masked</text>
  <text x="370" y="293" text-anchor="middle" font-size="12" fill="#15803d">software</text>

  <line x1="440" y1="280" x2="460" y2="280" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="460" y1="256" x2="460" y2="304" stroke="#cbd5e1" stroke-width="1"/>
  <text x="472" y="264" font-size="12" fill="#475569">dead instruction</text>
  <text x="472" y="284" font-size="12" fill="#475569">logical or compare op</text>
  <text x="472" y="304" font-size="12" fill="#475569">uninfluential branch</text>

  <!-- ===== Outcome ===== -->
  <rect x="60" y="356" width="140" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Failure</text>
</svg>
