<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Error masking: a soft error must pass two filters (read, then wrong output) to become a failure.
       Software fault injection enters after the first filter, so it sees only the second. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#ffffff"/>

  <!-- ===== Source ===== -->
  <rect x="60" y="20" width="140" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="130" y="43" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Soft error</text>
  <line x1="130" y1="56" x2="130" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Filter 1: microarchitecture ===== -->
  <polygon points="40,126 130,86 220,126 130,166" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="130" y="123" text-anchor="middle" font-size="12" fill="#0f172a">Corrupted</text>
  <text x="130" y="139" text-anchor="middle" font-size="12" fill="#0f172a">data read?</text>

  <line x1="220" y1="126" x2="298" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="258" y="118" text-anchor="middle" font-size="12" fill="#475569">No</text>
  <rect x="300" y="106" width="140" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="370" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Masked</text>
  <text x="370" y="139" text-anchor="middle" font-size="11" fill="#15803d">microarchitecture</text>

  <line x1="440" y1="126" x2="460" y2="126" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="460" y1="102" x2="460" y2="150" stroke="#cbd5e1" stroke-width="1"/>
  <text x="472" y="110" font-size="12" fill="#475569">unused component</text>
  <text x="472" y="130" font-size="12" fill="#475569">overwritten value</text>
  <text x="472" y="150" font-size="12" fill="#475569">squashed speculation</text>

  <!-- ===== Yes path, with the software injection point ===== -->
  <line x1="130" y1="166" x2="130" y2="224" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="120" y="186" text-anchor="end" font-size="12" fill="#475569">Yes</text>
  <line x1="320" y1="200" x2="134" y2="200" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="330" y="204" font-size="12" font-style="italic" fill="#475569">software fault injection</text>

  <!-- ===== Filter 2: software ===== -->
  <polygon points="40,266 130,226 220,266 130,306" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="130" y="263" text-anchor="middle" font-size="12" fill="#0f172a">Incorrect output</text>
  <text x="130" y="279" text-anchor="middle" font-size="12" fill="#0f172a">or crash?</text>

  <line x1="220" y1="266" x2="298" y2="266" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="258" y="258" text-anchor="middle" font-size="12" fill="#475569">No</text>
  <rect x="300" y="246" width="140" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="370" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Masked</text>
  <text x="370" y="279" text-anchor="middle" font-size="11" fill="#15803d">software</text>

  <line x1="440" y1="266" x2="460" y2="266" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="460" y1="242" x2="460" y2="290" stroke="#cbd5e1" stroke-width="1"/>
  <text x="472" y="250" font-size="12" fill="#475569">dead instruction</text>
  <text x="472" y="270" font-size="12" fill="#475569">logical or compare op</text>
  <text x="472" y="290" font-size="12" fill="#475569">uninfluential branch</text>

  <!-- ===== Outcome ===== -->
  <line x1="130" y1="306" x2="130" y2="342" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="120" y="328" text-anchor="end" font-size="12" fill="#475569">Yes</text>
  <rect x="60" y="344" width="140" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="130" y="367" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Failure</text>
</svg>
