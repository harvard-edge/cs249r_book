    - id: vol2.field.20
      source: vol2.reliability.failure-rate
      predicate: raises demand for
      target: vol2.storage.durable-checkpoint
      explanation: More frequent interruptions change the balance between checkpoint overhead and lost work.
      conditions: Independent-failure approximations require adjustment for correlated failures and varying
        checkpoint cost.
      status: draft
      evidence:
        section: sec-fault-tolerance-young-daly
        quote: Setting the first derivative to zero ($\frac{d\CheckpointWasteFraction}{d\CheckpointInterval}
          = -\frac{\CheckpointWriteTime}{\CheckpointInterval^2} + \frac{1}{2 \cdot \SystemMtbf} = 0$) directly
          yields the square-root minimum of @eq-ft-young-daly-interval. As clusters grow, system MTBF drops,
          so the optimal interval shrinks, demanding higher-bandwidth storage to keep $\CheckpointWriteTime$
          small before checkpoint overhead consumes the cluster's compute capacity. Because the relationship
          is a square root, halving MTBF tightens the interval by only $\sqrt{2}\approx 1.4\times$, so doubling
          cluster size does not demand doubling checkpoint I/O bandwidth when checkpoint size and the other
          assumptions stay fixed. Substituting the optimum back into @eq-ft-checkpoint-waste gives a minimum
          waste of $\sqrt{2\CheckpointWriteTime/\SystemMtbf}$. Because $\SystemMtbf$ falls as $1/\DeviceCount$
          under independent failures, that optimized overhead grows as $\sqrt{\DeviceCount}$, and doubling
          the cluster raises it by a factor of $\sqrt{2}$ even though the interval itself adapts.
    - id: vol2.field.21
      source: vol2.reliability.consistent-cut
      predicate: is required for correct
      target: vol2.reliability.recovery
      explanation: Recovery must restore mutually compatible worker states rather than arbitrary local snapshots.
      conditions: The cut must cover optimizer, model, and execution state required by the training contract.
      status: draft
      evidence:
        section: sec-fault-tolerance-reliability-checkpoint-coordination-patterns-f670
        quote: 'If workers in a sharded training job save their local shards at different steps without
          coordinating, rolling one failed worker back to its last save invalidates every peer that already
          consumed gradients or activations from its later steps. Rollbacks then cascade backward through
          the run in the classic domino effect [@elnozahy2002survey]. Avoiding that cascade requires choosing
          how workers coordinate across two orthogonal dimensions. Workers can vary in whether they synchronize
          to capture a consistent cut (**coordinated** versus **uncoordinated checkpointing**\index{Checkpointing!uncoordinated}\index{Uncoordinated
          checkpointing|see{Checkpointing}}). They can also vary in whether they funnel state through one
          writer or persist shards in parallel (centralized versus distributed checkpointing). Because distributed
          ML workers exchange state at every step, production training relies on **coordinated checkpointing**\index{Checkpointing!coordinated}\index{Coordinated
          checkpointing|see{Checkpointing}}. In this scheme, workers synchronize at step boundaries or through
          an explicit two-phase commit protocol, so that all saved shards belong to a single globally consistent
          recovery line. Once coordination guarantees consistency, the remaining architectural decision
          is how those shards reach persistent storage: whether workers funnel their state through a single
          coordinator or write their partitions directly in parallel.'
