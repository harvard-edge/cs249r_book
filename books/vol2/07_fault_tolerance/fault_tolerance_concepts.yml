  claims:
    Fleet failure rate: Independent constant-rate failures compose in series, so system MTBF = MTTF/N turns a 50,000-hour
      GPU into an interruption every few hours on a 10,000-GPU cluster, and correlated hazards over shared power,
      switches, and cooling come on top.
    Fault classification by persistence, manifestation, and scope: 'A fault is placed on three axes that each select
      part of the response: persistence decides retry, quarantine, or replace-and-restore, manifestation decides
      whether liveness checks can see it, and scope decides the blast radius.'
    Silent data corruption verification: ECC and link CRCs protect stored and transmitted bits but never arithmetic,
      so a live worker can feed a wrong gradient into a correct AllReduce, and because full redundancy costs 100
      to 200 percent of compute, fleets use selective check-and-verify.
    Young-Daly checkpoint interval: Expected waste delta/tau + tau/(2M) is minimized at tau* = sqrt(2 delta M),
      a shallow optimum that tightens only by sqrt(2) when MTBF halves, while the optimized overhead sqrt(2 delta/M)
      grows as sqrt(N) because M falls as 1/N.
    Consistent checkpoint cut: A distributed checkpoint is recoverable only when its shards form a consistent cut
      and a manifest naming every shard is published last, so training uses coordinated checkpoints whose stage-then-publish
      protocol is a two-phase commit.
    Recovery-time budget and fencing: Each failure pays T_detect + T_restart + T_load + T_warmup on top of lost
      rework, which comes to dominate as clusters grow, and epochs, leases, and write fencing stop a stale worker
      from corrupting the recovered state.
    Gray failure detection: A gray failure keeps passing liveness checks while the synchronous step runs at the slowest
      rank's pace, so stragglers call for mitigation (rebalance, backup workers, proactive replacement) rather than
      checkpoint recovery, with progress metrics beside heartbeats.
    Elastic recovery invariants: Elastic recovery turns a permanent capacity loss into a pause plus reduced throughput
      only if the resize preserves effective batch size or a validated learning-rate policy, exactly-once data coverage,
      and reconstructable state for every lost shard.
    Serving replication sized to state: Serving buys availability with parallel replicas, A = 1 - (1 - a)^r when
      failures are independent, and failover is a retry for stateless workers but a reconstruction for stateful
      ones, so design starts from which state is authoritative.
    Graceful degradation ladder: When redundancy cannot meet the latency budget the service descends a ladder validated
      before the incident (model fallback, feature fallback, load shedding, admission control) with hysteresis and
      monitoring of the quality it trades.
    Fault injection at the decision level: A recovery path is trustworthy only for the fault model it has been exercised
      against, so tests inject faults where recovery decisions are made and assert the invariant each decision depends
      on.
    Fault-tolerance investment criterion: A protection is worth buying while it removes more expected failure cost
      than it adds, so the same hot spare that pays for itself beside a 10,000-GPU job is waste beside an 8-GPU one.
    Observability for one distributed job: Metrics, logs, and traces joined on shared identifiers localize a failure
      in one job or service, and a training-loss signature or serving symptom becomes evidence only when it maps
      to a first recovery action.
