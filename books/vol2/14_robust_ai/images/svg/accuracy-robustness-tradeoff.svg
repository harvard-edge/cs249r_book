<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="100%" height="100%">
  <rect width="680" height="390" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- ===== Chart bounds: x=[90,620], y=[40,320] ===== -->

  <!-- Grid lines (horizontal) -->
  <line x1="90" y1="40"  x2="620" y2="40"  stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="90" y1="96"  x2="620" y2="96"  stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="90" y1="152" x2="620" y2="152" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="90" y1="208" x2="620" y2="208" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="90" y1="264" x2="620" y2="264" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="90" y1="320" x2="620" y2="320" stroke="#E2E8F0" stroke-width="0.8"/>

  <!-- Vertical grid lines -->
  <line x1="196" y1="40" x2="196" y2="320" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="302" y1="40" x2="302" y2="320" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="408" y1="40" x2="408" y2="320" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="514" y1="40" x2="514" y2="320" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="620" y1="40" x2="620" y2="320" stroke="#E2E8F0" stroke-width="0.8"/>

  <!-- Axes -->
  <line x1="80" y1="320" x2="645" y2="320" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="90" y1="330" x2="90"  y2="30"  stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- X axis labels -->
  <text x="90"  y="336" text-anchor="middle" font-size="8.5" fill="#64748B">0</text>
  <text x="196" y="336" text-anchor="middle" font-size="8.5" fill="#64748B">2/255</text>
  <text x="302" y="336" text-anchor="middle" font-size="8.5" fill="#64748B">4/255</text>
  <text x="408" y="336" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">8/255</text>
  <text x="514" y="336" text-anchor="middle" font-size="8.5" fill="#64748B">16/255</text>
  <text x="620" y="336" text-anchor="middle" font-size="8.5" fill="#64748B">32/255</text>
  <text x="355" y="356" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Adversarial Training Perturbation Budget ε (L_∞ Ball)</text>

  <!-- Y axis labels -->
  <text x="82" y="43"  text-anchor="end" font-size="8.5" fill="#64748B">100%</text>
  <text x="82" y="99"  text-anchor="end" font-size="8.5" fill="#64748B">80%</text>
  <text x="82" y="155" text-anchor="end" font-size="8.5" fill="#64748B">60%</text>
  <text x="82" y="211" text-anchor="end" font-size="8.5" fill="#64748B">40%</text>
  <text x="82" y="267" text-anchor="end" font-size="8.5" fill="#64748B">20%</text>
  <text x="82" y="323" text-anchor="end" font-size="8.5" fill="#64748B">0%</text>
  <text x="32" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A" transform="rotate(-90 32 180)">Model Accuracy (%)</text>

  <!-- Standard benchmark reference line at ε = 8/255 (x = 408) -->
  <line x1="408" y1="35" x2="408" y2="320" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="345" y="18" width="126" height="18" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8"/>
  <text x="408" y="30" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991B1B">Standard Benchmark (ε = 8/255)</text>

  <!-- Shaded Robustness Tax Area -->
  <!-- Clean accuracy points: (90, 54), (196, 62), (302, 73), (408, 96), (514, 130), (620, 174) -->
  <!-- Adversarial points:     (90, 256), (196, 194), (302, 163), (408, 146), (514, 137), (620, 137) -->
  <polygon points="90,54 196,62 302,73 408,96 514,130 620,174 620,137 514,137 408,146 302,163 196,194 90,256" fill="#FEE2E2" fill-opacity="0.45"/>

  <!-- Clean Accuracy Curve (Solid Blue) -->
  <polyline points="90,54 196,62 302,73 408,96 514,130 620,174" fill="none" stroke="#1F407A" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="90"  cy="54"  r="4" fill="#1F407A"/>
  <circle cx="196" cy="62"  r="4" fill="#1F407A"/>
  <circle cx="302" cy="73"  r="4" fill="#1F407A"/>
  <circle cx="408" cy="96"  r="4" fill="#1F407A"/>
  <circle cx="514" cy="130" r="4" fill="#1F407A"/>
  <circle cx="620" cy="174" r="4" fill="#1F407A"/>

  <!-- Adversarial Accuracy Curve (Dashed Green) -->
  <polyline points="90,256 196,194 302,163 408,146 514,137 620,137" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6,4"/>
  <circle cx="90"  cy="256" r="4" fill="#16A34A"/>
  <circle cx="196" cy="194" r="4" fill="#16A34A"/>
  <circle cx="302" cy="163" r="4" fill="#16A34A"/>
  <circle cx="408" cy="146" r="4" fill="#16A34A"/>
  <circle cx="514" cy="137" r="4" fill="#16A34A"/>
  <circle cx="620" cy="137" r="4" fill="#16A34A"/>

  <!-- Robustness Tax Dimension Line & Callout at ε = 8/255 -->
  <line x1="408" y1="102" x2="408" y2="140" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="408" y1="140" x2="408" y2="102" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <g transform="translate(265, 105)">
    <rect width="130" height="34" rx="3" fill="#ffffff" stroke="#DC2626" stroke-width="1.2"/>
    <text x="65" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">Robustness Tax</text>
    <text x="65" y="27" text-anchor="middle" font-size="8" font-weight="600" fill="#DC2626">Δ ≈ 18 pp at ε = 8/255</text>
  </g>

  <!-- Point annotations -->
  <g transform="translate(100, 44)">
    <rect width="70" height="18" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
    <text x="35" y="12" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1F407A">95% Clean</text>
  </g>

  <g transform="translate(100, 264)">
    <rect width="84" height="20" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8"/>
    <text x="42" y="14" text-anchor="middle" font-size="7.5" font-weight="600" fill="#166534">No Def.: 23% Adv.</text>
  </g>

  <!-- In-Chart Legend (Top Right) -->
  <g transform="translate(470, 48)">
    <rect width="165" height="52" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    
    <line x1="12" y1="18" x2="36" y2="18" stroke="#1F407A" stroke-width="2.5"/>
    <circle cx="24" cy="18" r="3.5" fill="#1F407A"/>
    <text x="44" y="21" font-size="8" font-weight="600" fill="#0F172A">Clean Accuracy (No Attack)</text>

    <line x1="12" y1="36" x2="36" y2="36" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="5,3"/>
    <circle cx="24" cy="36" r="3.5" fill="#16A34A"/>
    <text x="44" y="39" font-size="8" font-weight="600" fill="#0F172A">Adversarial Accuracy (PGD)</text>
  </g>
</svg>