<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="bs-arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569"/>
    </marker>
    <marker id="bs-arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: Training Distribution -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="415" height="340" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header Chip -->
    <rect x="14" y="12" width="220" height="22" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <text x="124" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">TRAINING DISTRIBUTION (NOMINAL)</text>
    <text x="242" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Controlled Conditions (e.g. Clear Day)</text>

    <!-- Plot Area -->
    <g transform="translate(18, 44)">
      <rect x="0" y="0" width="379" height="236" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Coordinate Axes -->
      <line x1="30" y1="210" x2="360" y2="210" stroke="#64748b" stroke-width="1.2" marker-end="url(#bs-arr)"/>
      <line x1="30" y1="210" x2="30" y2="20" stroke="#64748b" stroke-width="1.2" marker-end="url(#bs-arr)"/>
      <text x="355" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="end">Feature x₁ (Luminance)</text>
      <text x="22" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">x₂ (Contrast)</text>

      <!-- Learned Decision Boundary -->
      <line x1="45" y1="200" x2="335" y2="35" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
      <text x="210" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#dc2626" stroke="#ffffff" stroke-width="3" paint-order="stroke fill" transform="rotate(-30, 210, 130)">Learned Boundary f(x) = 0</text>

      <!-- Class A: Blue circles (Upper Left, e.g. Pedestrian) -->
      <g fill="#0284c7" opacity="0.85">
        <circle cx="65" cy="55" r="5"/>
        <circle cx="85" cy="70" r="5"/>
        <circle cx="60" cy="90" r="5"/>
        <circle cx="95" cy="95" r="5"/>
        <circle cx="80" cy="115" r="5"/>
        <circle cx="110" cy="80" r="5"/>
        <circle cx="125" cy="105" r="5"/>
        <circle cx="105" cy="130" r="5"/>
        <circle cx="70" cy="140" r="5"/>
        <circle cx="130" cy="125" r="5"/>
        <circle cx="90" cy="155" r="5"/>
        <circle cx="115" cy="150" r="5"/>
      </g>
      <text x="65" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Class A (Pedestrian)</text>

      <!-- Class B: Green circles (Lower Right, e.g. Background) -->
      <g fill="#16a34a" opacity="0.85">
        <circle cx="210" cy="135" r="5"/>
        <circle cx="230" cy="150" r="5"/>
        <circle cx="250" cy="140" r="5"/>
        <circle cx="220" cy="170" r="5"/>
        <circle cx="245" cy="175" r="5"/>
        <circle cx="270" cy="160" r="5"/>
        <circle cx="280" cy="185" r="5"/>
        <circle cx="260" cy="195" r="5"/>
        <circle cx="235" cy="195" r="5"/>
        <circle cx="300" cy="170" r="5"/>
        <circle cx="290" cy="195" r="5"/>
        <circle cx="320" cy="185" r="5"/>
      </g>
      <text x="280" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Class B (Background)</text>

      <!-- Clean Separation Status Badge -->
      <rect x="235" y="10" width="130" height="22" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="300" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">✓ Perfect Margin Separation</text>
    </g>

    <!-- Subtitle text -->
    <text x="18" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">Optimal Empirical Risk Minimization (ERM)</text>
    <text x="18" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Model fits training distribution with high generalization accuracy in-distribution.</text>
    <text x="18" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">Decision boundary maximizes geometric margin under nominal training samples.</text>
  </g>

  <!-- CENTRAL TRANSITION CONNECTOR -->
  <g transform="translate(449, 155)">
    <!-- Transition Box -->
    <rect x="0" y="0" width="62" height="50" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="31" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">NATURAL</text>
    <text x="31" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">SHIFT</text>
    <text x="31" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#78350f" text-anchor="middle">Fog / Rain</text>
    <line x1="62" y1="25" x2="68" y2="25" stroke="#d97706" stroke-width="1.5" marker-end="url(#bs-arr-amber)"/>
  </g>

  <!-- RIGHT PANEL: Test Distribution (Deployment) -->
  <g transform="translate(515, 20)">
    <rect x="0" y="0" width="415" height="340" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header Chip -->
    <rect x="14" y="12" width="220" height="22" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="124" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">TEST DISTRIBUTION (DEPLOYMENT)</text>
    <text x="242" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Environmental Drift (e.g. Dense Fog)</text>

    <!-- Plot Area -->
    <g transform="translate(18, 44)">
      <rect x="0" y="0" width="379" height="236" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Coordinate Axes -->
      <line x1="30" y1="210" x2="360" y2="210" stroke="#64748b" stroke-width="1.2" marker-end="url(#bs-arr)"/>
      <line x1="30" y1="210" x2="30" y2="20" stroke="#64748b" stroke-width="1.2" marker-end="url(#bs-arr)"/>
      <text x="355" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="end">Feature x₁ (Luminance)</text>
      <text x="22" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">x₂ (Contrast)</text>

      <!-- Frozen Decision Boundary (SAME as training) -->
      <line x1="45" y1="200" x2="335" y2="35" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
      <text x="210" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#dc2626" stroke="#ffffff" stroke-width="3" paint-order="stroke fill" transform="rotate(-30, 210, 130)">Frozen Boundary f(x) = 0</text>

      <!-- Failure Callout Badge at Top Right -->
      <g transform="translate(195, 12)">
        <rect x="0" y="0" width="170" height="28" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
        <text x="85" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">❌ Silent Misclassification</text>
        <text x="85" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#7f1d1d" text-anchor="middle">Shifted Class A predicted as Class B</text>
      </g>

      <!-- Class B (Green) background stays in place -->
      <g fill="#16a34a" opacity="0.6">
        <circle cx="210" cy="135" r="5"/>
        <circle cx="230" cy="150" r="5"/>
        <circle cx="250" cy="140" r="5"/>
        <circle cx="220" cy="170" r="5"/>
        <circle cx="245" cy="175" r="5"/>
        <circle cx="270" cy="160" r="5"/>
        <circle cx="280" cy="185" r="5"/>
        <circle cx="260" cy="195" r="5"/>
        <circle cx="235" cy="195" r="5"/>
        <circle cx="300" cy="170" r="5"/>
        <circle cx="290" cy="195" r="5"/>
        <circle cx="320" cy="185" r="5"/>
      </g>

      <!-- Class A (Pedestrian) SHIFTED significantly right & down due to environmental fog/darkness -->
      <!-- Points that remain on correct side -->
      <g fill="#0284c7" opacity="0.85">
        <circle cx="105" cy="90" r="5"/>
        <circle cx="125" cy="105" r="5"/>
        <circle cx="110" cy="125" r="5"/>
        <circle cx="140" cy="115" r="5"/>
        <circle cx="130" cy="140" r="5"/>
        <circle cx="150" cy="130" r="5"/>
      </g>

      <!-- Points that have crossed boundary -> SILENT MISCLASSIFICATIONS -->
      <!-- Point 1: cx=175, cy=145 -->
      <circle cx="175" cy="145" r="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="170" y1="140" x2="180" y2="150" stroke="#dc2626" stroke-width="2"/>
      <line x1="180" y1="140" x2="170" y2="150" stroke="#dc2626" stroke-width="2"/>

      <!-- Point 2: cx=195, cy=130 -->
      <circle cx="195" cy="130" r="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="190" y1="125" x2="200" y2="135" stroke="#dc2626" stroke-width="2"/>
      <line x1="200" y1="125" x2="190" y2="135" stroke="#dc2626" stroke-width="2"/>

      <!-- Point 3: cx=185, cy=165 -->
      <circle cx="185" cy="165" r="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="180" y1="160" x2="190" y2="170" stroke="#dc2626" stroke-width="2"/>
      <line x1="190" y1="160" x2="180" y2="170" stroke="#dc2626" stroke-width="2"/>

      <!-- Point 4: cx=205, cy=155 -->
      <circle cx="205" cy="155" r="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="200" y1="150" x2="210" y2="160" stroke="#dc2626" stroke-width="2"/>
      <line x1="210" y1="150" x2="200" y2="160" stroke="#dc2626" stroke-width="2"/>

      <!-- Point 5: cx=215, cy=180 -->
      <circle cx="215" cy="180" r="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="210" y1="175" x2="220" y2="185" stroke="#dc2626" stroke-width="2"/>
      <line x1="220" y1="175" x2="210" y2="185" stroke="#dc2626" stroke-width="2"/>

    </g>

    <!-- Subtitle text -->
    <text x="18" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Systemic Failure Without Hardware Traps</text>
    <text x="18" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">The model computes valid logits with high confidence, but outputs wrong labels</text>
    <text x="18" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">because deployment data has moved across the static decision boundary.</text>
  </g>

  <!-- BOTTOM PANEL: System-Level Mitigations -->
  <g transform="translate(30, 372)">
    <rect x="0" y="0" width="900" height="68" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="14" y="12" width="168" height="20" rx="2" fill="#e2e8f0"/>
    <text x="98" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">MLSYS ARCHITECTURAL DEFENSES</text>

    <g transform="translate(194, 10)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">1. Ingestion Drift Monitoring:</text>
      <text x="155" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Compute PSI &amp; Wasserstein distance over rolling inference windows to detect covariate shifts before errors compound.</text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">2. Multi-Modal Redundancy:</text>
      <text x="150" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Cross-validate camera perception with LiDAR / Radar signals that are immune to optical luminance and fog distribution shifts.</text>
      <text x="0" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">3. OOD Fail-Safe Fallbacks:</text>
      <text x="145" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Route out-of-distribution inputs (high epistemic uncertainty) to conservative rule-based failsafe modes or human operators.</text>
    </g>
  </g>
</svg>