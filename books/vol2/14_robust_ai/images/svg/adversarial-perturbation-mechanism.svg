<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>

    <!-- Synthetic high-frequency noise pattern for adversarial perturbation visualization -->
    <pattern id="noise-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#334155"/>
      <rect x="0" y="0" width="4" height="4" fill="#94A3B8"/>
      <rect x="8" y="2" width="4" height="4" fill="#64748B"/>
      <rect x="4" y="8" width="4" height="4" fill="#CBD5E1"/>
      <rect x="12" y="10" width="4" height="4" fill="#475569"/>
      <rect x="2" y="12" width="4" height="4" fill="#94A3B8"/>
      <rect x="10" y="6" width="4" height="4" fill="#CBD5E1"/>
      <rect x="6" y="4" width="4" height="4" fill="#1E293B"/>
      <rect x="14" y="14" width="2" height="2" fill="#F8FAFC"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="920" height="440" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="25" y="30" font-size="15" font-weight="700" fill="#0F172A">Adversarial Perturbation Mechanism: Input-Gradient Optimization</text>
  <text x="25" y="48" font-size="11" fill="#64748B">Imperceptible norm-bounded noise alters high-dimensional feature geometry to force high-confidence misclassification</text>

  <!-- LEFT PANEL: Clean Inference Pipeline -->
  <rect x="25" y="65" width="270" height="270" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="25" y="65" width="270" height="32" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="37" y="86" font-size="11.5" font-weight="700" fill="#166534">1. Clean Sample (x)</text>

  <!-- Image Representation Box -->
  <rect x="40" y="110" width="100" height="100" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <!-- Stylized Cat silhouette/icon -->
  <circle cx="90" cy="160" r="30" fill="#64748B"/>
  <!-- Cat ears -->
  <polygon points="68,140 76,115 88,135" fill="#475569"/>
  <polygon points="92,135 104,115 112,140" fill="#475569"/>
  <!-- Eyes -->
  <circle cx="80" cy="155" r="3.5" fill="#DCFCE7"/>
  <circle cx="100" cy="155" r="3.5" fill="#DCFCE7"/>
  <!-- Nose/mouth -->
  <polygon points="88,165 92,165 90,168" fill="#F87171"/>
  <text x="90" y="202" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Ground Truth: Cat</text>

  <!-- Classifier Forward arrow -->
  <line x1="148" y1="160" x2="168" y2="160" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Model Inference Block -->
  <rect x="175" y="110" width="105" height="100" rx="6" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="175" y="110" width="105" height="24" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="227" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F407A">Classifier f(x)</text>

  <!-- Output Logits Bars -->
  <!-- Cat Bar -->
  <text x="182" y="148" font-size="8.5" font-weight="600" fill="#166534">Cat</text>
  <rect x="204" y="140" width="60" height="10" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8"/>
  <rect x="204" y="140" width="58" height="10" rx="2" fill="#16A34A"/>
  <text x="268" y="148" font-size="8" font-weight="700" fill="#16A34A">99.2%</text>

  <!-- Dog Bar -->
  <text x="182" y="168" font-size="8.5" fill="#64748B">Dog</text>
  <rect x="204" y="160" width="60" height="10" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
  <rect x="204" y="160" width="2" height="10" rx="1" fill="#94A3B8"/>
  <text x="268" y="168" font-size="8" fill="#64748B">0.3%</text>

  <!-- Fox Bar -->
  <text x="182" y="188" font-size="8.5" fill="#64748B">Fox</text>
  <rect x="204" y="180" width="60" height="10" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
  <rect x="204" y="180" width="3" height="10" rx="1" fill="#94A3B8"/>
  <text x="268" y="188" font-size="8" fill="#64748B">0.5%</text>

  <!-- Assessment Pill -->
  <rect x="40" y="228" width="240" height="92" rx="5" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="50" y="248" font-size="9.5" font-weight="700" fill="#166534">Correct Classification:</text>
  <text x="50" y="266" font-size="9" fill="#475569">• Clear separation across decision boundary</text>
  <text x="50" y="282" font-size="9" fill="#475569">• Low loss: <tspan font-family="monospace">L(θ, x, y_cat) ≈ 0.008</tspan></text>
  <text x="50" y="302" font-size="9" font-weight="600" fill="#16A34A">Robust baseline under nominal distribution</text>

  <!-- MIDDLE PANEL: Adversarial Gradient Attack -->
  <rect x="315" y="65" width="285" height="270" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="315" y="65" width="285" height="32" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="327" y="86" font-size="11.5" font-weight="700" fill="#B45309">2. Adversarial Optimization (δ)</text>

  <!-- Perturbation Noise Box -->
  <rect x="330" y="110" width="100" height="100" rx="6" fill="url(#noise-pattern)" stroke="#D97706" stroke-width="1.5"/>
  <rect x="330" y="185" width="100" height="25" rx="4" fill="#0F172A" fill-opacity="0.8"/>
  <text x="380" y="201" text-anchor="middle" font-size="8.5" font-weight="600" fill="#FEF3C7">Noise (Amplified 10×)</text>

  <!-- Formula Details Box -->
  <rect x="442" y="110" width="145" height="100" rx="6" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="452" y="128" font-size="9.5" font-weight="700" fill="#0F172A">Attack Formulation:</text>
  <text x="452" y="148" font-size="10.5" font-weight="600" fill="#B45309">FGSM / PGD Step</text>
  <text x="452" y="170" font-size="9.5" font-family="monospace" fill="#0F172A">δ = ε · sign(∇_x L)</text>
  <text x="452" y="195" font-size="8.5" fill="#64748B">Bounded: <tspan font-family="monospace">||δ||_∞</tspan> ≤ ε</text>

  <!-- Mechanism Explanation -->
  <rect x="330" y="228" width="257" height="92" rx="5" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="340" y="248" font-size="9.5" font-weight="700" fill="#B45309">Gradient Ascent on Input:</text>
  <text x="340" y="266" font-size="9" fill="#475569">• Gradients backpropagated to pixels, not weights</text>
  <text x="340" y="282" font-size="9" fill="#475569">• Perturbations co-align across thousands of pixels</text>
  <text x="340" y="302" font-size="9" font-weight="600" fill="#D97706">Small individual shifts compound into huge dot-product</text>

  <!-- Flow Addition Symbols -->
  <!-- Line from clean image to addition circle -->
  <circle cx="305" cy="160" r="11" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="305" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F407A">+</text>

  <!-- RIGHT PANEL: Adversarial Example -->
  <rect x="620" y="65" width="275" height="270" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="620" y="65" width="275" height="32" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="632" y="86" font-size="11.5" font-weight="700" fill="#DC2626">3. Adversarial Sample (x_adv)</text>

  <!-- Perturbed Image Box (looks identical to clean cat!) -->
  <rect x="635" y="110" width="100" height="100" rx="6" fill="#E2E8F0" stroke="#DC2626" stroke-width="1.5"/>
  <circle cx="685" cy="160" r="30" fill="#64748B"/>
  <polygon points="663,140 671,115 683,135" fill="#475569"/>
  <polygon points="687,135 699,115 707,140" fill="#475569"/>
  <circle cx="675" cy="155" r="3.5" fill="#DCFCE7"/>
  <circle cx="695" cy="155" r="3.5" fill="#DCFCE7"/>
  <polygon points="683,165 687,165 685,168" fill="#F87171"/>
  <text x="685" y="202" text-anchor="middle" font-size="8.5" font-weight="600" fill="#DC2626">x_adv = x + δ</text>

  <!-- Forward arrow -->
  <line x1="743" y1="160" x2="763" y2="160" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Model Inference Block -->
  <rect x="770" y="110" width="112" height="100" rx="6" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="770" y="110" width="112" height="24" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="826" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#DC2626">Classifier f(x_adv)</text>

  <!-- Output Logits Bars -->
  <!-- Cat Bar -->
  <text x="777" y="148" font-size="8.5" fill="#64748B">Cat</text>
  <rect x="799" y="140" width="60" height="10" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
  <rect x="799" y="140" width="3" height="10" rx="1" fill="#94A3B8"/>
  <text x="863" y="148" font-size="8" fill="#64748B">0.8%</text>

  <!-- Dog Bar (Misclassified!) -->
  <text x="777" y="168" font-size="8.5" font-weight="700" fill="#DC2626">Dog</text>
  <rect x="799" y="160" width="60" height="10" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8"/>
  <rect x="799" y="160" width="58" height="10" rx="2" fill="#DC2626"/>
  <text x="863" y="168" font-size="8" font-weight="700" fill="#DC2626">98.7%</text>

  <!-- Fox Bar -->
  <text x="777" y="188" font-size="8.5" fill="#64748B">Fox</text>
  <rect x="799" y="180" width="60" height="10" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
  <rect x="799" y="180" width="2" height="10" rx="1" fill="#94A3B8"/>
  <text x="863" y="188" font-size="8" fill="#64748B">0.5%</text>

  <!-- Systems Consequence -->
  <rect x="635" y="228" width="247" height="92" rx="5" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="645" y="248" font-size="9.5" font-weight="700" fill="#DC2626">Catastrophic Decision Error:</text>
  <text x="645" y="266" font-size="9" fill="#475569">• Human visual delta is imperceptible (<tspan font-family="monospace">ε ≈ 0.007</tspan>)</text>
  <text x="645" y="282" font-size="9" fill="#475569">• Crosses decision boundary into wrong basin</text>
  <text x="645" y="302" font-size="9" font-weight="600" fill="#DC2626">High-confidence misclassification as Dog</text>

  <!-- Bottom Systems Summary Footer -->
  <rect x="25" y="350" width="870" height="65" rx="6" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="40" y="372" font-size="10.5" font-weight="700" fill="#1F407A">Systems Insight: The High-Dimensional Linearity Paradox</text>
  <text x="40" y="392" font-size="9.5" fill="#334155">In an input space with d = 3 × 224 × 224 ≈ 1.5 × 10⁵ dimensions, even a tiny ε perturbation per pixel produces an activation shift of w · δ ≈ ε · d · E[|w|],</text>
  <text x="40" y="406" font-size="9.5" fill="#334155">easily overpowering correct logits. Standard empirical risk minimization (ERM) leaves these high-dimensional linear directions undefended.</text>
</svg>
