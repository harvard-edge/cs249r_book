<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#D97706"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16A34A"/>
    </marker>

    <!-- Synthetic high-frequency noise pattern for perturbation visualization -->
    <pattern id="noise-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#334155"/>
      <rect x="0" y="0" width="4" height="4" fill="#94A3B8"/>
      <rect x="8" y="2" width="4" height="4" fill="#64748B"/>
      <rect x="4" y="8" width="4" height="4" fill="#CBD5E1"/>
      <rect x="12" y="10" width="4" height="4" fill="#475569"/>
      <rect x="2" y="12" width="4" height="4" fill="#94A3B8"/>
      <rect x="10" y="6" width="4" height="4" fill="#CBD5E1"/>
      <rect x="6" y="4" width="4" height="4" fill="#1E293B"/>
      <rect x="14" y="14" width="2" height="2" fill="#F8FAFC"/>
    </pattern>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: CLEAN SAMPLE PIPELINE                                           -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 20)">
    <rect width="260" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 256 0 Q 260 0 260 4 L 260 24 L 0 24 Z" fill="#DCFCE7"/>
    <line x1="0" y1="24" x2="260" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d" letter-spacing="0.5px">1. CLEAN SAMPLE (x)</text>

    <!-- Sub-box 1: Input Sample -->
    <g transform="translate(12, 34)">
      <rect width="236" height="156" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Input Image: x ∈ [0, 1]^(C×H×W)</text>

      <!-- Silhouette container -->
      <g transform="translate(18, 28)">
        <rect width="90" height="85" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8"/>
        <!-- Stylized Cat -->
        <circle cx="45" cy="50" r="24" fill="#64748B"/>
        <polygon points="26,34 32,14 42,30" fill="#475569"/>
        <polygon points="48,30 58,14 64,34" fill="#475569"/>
        <circle cx="36" cy="46" r="2.8" fill="#DCFCE7"/>
        <circle cx="54" cy="46" r="2.8" fill="#DCFCE7"/>
        <polygon points="43,54 47,54 45,57" fill="#F87171"/>
      </g>

      <!-- Label block -->
      <g transform="translate(118, 28)">
        <rect width="100" height="40" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8"/>
        <text x="50" y="15" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">GROUND TRUTH</text>
        <text x="50" y="30" font-size="10" font-weight="700" fill="#16A34A" text-anchor="middle">Cat</text>

        <rect y="46" width="100" height="39" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="8" y="60" font-size="7.5" font-weight="600" fill="#334155">Nominal Input</text>
        <text x="8" y="74" font-size="7" font-family="monospace" fill="#64748B">ε = 0.000</text>
      </g>

      <text x="118" y="136" font-size="7.5" fill="#64748B" text-anchor="middle">Empirical Distribution Manifold</text>
    </g>

    <!-- Sub-box 2: Model Prediction -->
    <g transform="translate(12, 202)">
      <rect width="236" height="174" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Model Output: f(x; θ)</text>

      <!-- Logits / Bars -->
      <g transform="translate(14, 26)">
        <!-- Cat row -->
        <text x="0" y="13" font-size="8" font-weight="700" fill="#15803d">Cat</text>
        <rect x="28" y="4" width="125" height="12" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.7"/>
        <rect x="28" y="4" width="122" height="12" rx="2" fill="#16A34A"/>
        <text x="160" y="14" font-size="8" font-weight="700" fill="#16A34A">99.2%</text>

        <!-- Dog row -->
        <text x="0" y="34" font-size="8" fill="#64748B">Dog</text>
        <rect x="28" y="25" width="125" height="12" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.7"/>
        <rect x="28" y="25" width="3" height="12" rx="1" fill="#94A3B8"/>
        <text x="160" y="35" font-size="8" fill="#64748B">0.3%</text>

        <!-- Fox row -->
        <text x="0" y="55" font-size="8" fill="#64748B">Fox</text>
        <rect x="28" y="46" width="125" height="12" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.7"/>
        <rect x="28" y="46" width="4" height="12" rx="1" fill="#94A3B8"/>
        <text x="160" y="56" font-size="8" fill="#64748B">0.5%</text>
      </g>

      <!-- Verification badge -->
      <g transform="translate(14, 102)">
        <rect width="208" height="58" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Correct Classification State</text>
        <text x="10" y="32" font-size="7.5" fill="#166534">Loss: L(θ, x, y_cat) ≈ 0.008</text>
        <text x="10" y="46" font-size="7.5" fill="#166534">Inside nominal class decision basin</text>
      </g>
    </g>
  </g>

  <!-- Flow Addition Symbol Between Clean and Adversarial -->
  <g transform="translate(285, 95)">
    <circle cx="12" cy="12" r="10" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="12" y="16" font-size="12" font-weight="700" fill="#1F407A" text-anchor="middle">+</text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: INPUT-GRADIENT OPTIMIZATION                                     -->
  <!-- ========================================================================= -->
  <g transform="translate(310, 20)">
    <rect width="260" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 256 0 Q 260 0 260 4 L 260 24 L 0 24 Z" fill="#FEF3C7"/>
    <line x1="0" y1="24" x2="260" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#B45309" letter-spacing="0.5px">2. INPUT-GRADIENT NOISE (δ)</text>

    <!-- Sub-box 1: Perturbation Pattern -->
    <g transform="translate(12, 34)">
      <rect width="236" height="156" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Adversarial Perturbation: δ</text>

      <!-- Noise container -->
      <g transform="translate(18, 28)">
        <rect width="90" height="85" rx="3" fill="url(#noise-pattern)" stroke="#D97706" stroke-width="1"/>
        <rect y="65" width="90" height="20" rx="2" fill="#0F172A" fill-opacity="0.8"/>
        <text x="45" y="78" font-size="7" font-weight="700" fill="#FEF3C7" text-anchor="middle">Amplified (10×)</text>
      </g>

      <!-- Norm bound detail -->
      <g transform="translate(118, 28)">
        <rect width="100" height="40" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
        <text x="50" y="15" font-size="7" font-weight="700" fill="#B45309" text-anchor="middle">NORM CONSTRAINT</text>
        <text x="50" y="30" font-size="9" font-family="monospace" font-weight="700" fill="#B45309" text-anchor="middle">||δ||_∞ ≤ ε</text>

        <rect y="46" width="100" height="39" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="8" y="60" font-size="7.5" font-weight="600" fill="#334155">Budget Radius</text>
        <text x="8" y="74" font-size="7" font-family="monospace" fill="#64748B">ε = 8/255 (0.031)</text>
      </g>

      <text x="118" y="136" font-size="7.5" fill="#64748B" text-anchor="middle">Loss Gradient Backpropagated to Pixels</text>
    </g>

    <!-- Sub-box 2: Attack Formulation -->
    <g transform="translate(12, 202)">
      <rect width="236" height="174" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">FGSM Optimization Step</text>

      <!-- Formulation box -->
      <g transform="translate(14, 26)">
        <rect width="208" height="38" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
        <text x="104" y="24" font-size="9.5" font-family="monospace" font-weight="700" fill="#B45309" text-anchor="middle">δ = ε · sign(∇_x L(θ, x, y))</text>
      </g>

      <!-- Dimensionality Analysis -->
      <g transform="translate(14, 76)">
        <rect width="208" height="84" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#1E293B">High-Dimensional Compounding:</text>
        <text x="10" y="32" font-size="7.5" fill="#475569">Dimension: d = 3×224×224 ≈ 150,528</text>
        <text x="10" y="48" font-size="7.5" fill="#475569">Activation shift: w^T δ ≈ ε · d · E[|w|]</text>
        <text x="10" y="64" font-size="7.5" font-weight="600" fill="#D97706">Small pixel steps overpower logit boundary</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector from middle to right -->
  <line x1="570" y1="107" x2="593" y2="107" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: ADVERSARIAL SAMPLE (MISCLASSIFICATION)                           -->
  <!-- ========================================================================= -->
  <g transform="translate(595, 20)">
    <rect width="260" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 256 0 Q 260 0 260 4 L 260 24 L 0 24 Z" fill="#FEE2E2"/>
    <line x1="0" y1="24" x2="260" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991B1B" letter-spacing="0.5px">3. ADVERSARIAL SAMPLE (x_adv)</text>

    <!-- Sub-box 1: Perturbed Image -->
    <g transform="translate(12, 34)">
      <rect width="236" height="156" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Perturbed Image: x_adv = x + δ</text>

      <!-- Silhouette container (identical visual appearance) -->
      <g transform="translate(18, 28)">
        <rect width="90" height="85" rx="3" fill="#E2E8F0" stroke="#DC2626" stroke-width="1.2"/>
        <!-- Stylized Cat -->
        <circle cx="45" cy="50" r="24" fill="#64748B"/>
        <polygon points="26,34 32,14 42,30" fill="#475569"/>
        <polygon points="48,30 58,14 64,34" fill="#475569"/>
        <circle cx="36" cy="46" r="2.8" fill="#DCFCE7"/>
        <circle cx="54" cy="46" r="2.8" fill="#DCFCE7"/>
        <polygon points="43,54 47,54 45,57" fill="#F87171"/>
      </g>

      <!-- Label block -->
      <g transform="translate(118, 28)">
        <rect width="100" height="40" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8"/>
        <text x="50" y="15" font-size="7" font-weight="700" fill="#991B1B" text-anchor="middle">HUMAN PERCEPTION</text>
        <text x="50" y="30" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Cat (Δ ≈ 0)</text>

        <rect y="46" width="100" height="39" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="8" y="60" font-size="7.5" font-weight="600" fill="#334155">Pixel Divergence</text>
        <text x="8" y="74" font-size="7" font-family="monospace" fill="#DC2626">||x_adv - x||_∞ ≤ ε</text>
      </g>

      <text x="118" y="136" font-size="7.5" fill="#DC2626" text-anchor="middle">Manifold Decision Boundary Crossed</text>
    </g>

    <!-- Sub-box 2: Corrupted Model Prediction -->
    <g transform="translate(12, 202)">
      <rect width="236" height="174" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Model Output: f(x_adv; θ)</text>

      <!-- Logits / Bars -->
      <g transform="translate(14, 26)">
        <!-- Dog row (Misclassified!) -->
        <text x="0" y="13" font-size="8" font-weight="700" fill="#DC2626">Dog</text>
        <rect x="28" y="4" width="125" height="12" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.7"/>
        <rect x="28" y="4" width="120" height="12" rx="2" fill="#DC2626"/>
        <text x="160" y="14" font-size="8" font-weight="700" fill="#DC2626">98.7%</text>

        <!-- Cat row -->
        <text x="0" y="34" font-size="8" fill="#64748B">Cat</text>
        <rect x="28" y="25" width="125" height="12" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.7"/>
        <rect x="28" y="25" width="4" height="12" rx="1" fill="#94A3B8"/>
        <text x="160" y="35" font-size="8" fill="#64748B">0.8%</text>

        <!-- Fox row -->
        <text x="0" y="55" font-size="8" fill="#64748B">Fox</text>
        <rect x="28" y="46" width="125" height="12" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.7"/>
        <rect x="28" y="46" width="3" height="12" rx="1" fill="#94A3B8"/>
        <text x="160" y="56" font-size="8" fill="#64748B">0.5%</text>
      </g>

      <!-- Failure state badge -->
      <g transform="translate(14, 102)">
        <rect width="208" height="58" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#991B1B">Catastrophic Decision Error</text>
        <text x="10" y="32" font-size="7.5" fill="#B91C1C">Forced into wrong classification basin</text>
        <text x="10" y="46" font-size="7.5" font-weight="600" fill="#DC2626">High-confidence adversarial misclassification</text>
      </g>
    </g>
  </g>
</svg>
