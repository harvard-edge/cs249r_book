<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="ga-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="ga-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="ga-arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- TOP PIPELINE: 4 Stages of Fast Gradient Sign Method (FGSM) -->

  <!-- STAGE 1: Original Clean Input x -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="185" height="236" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="12" width="161" height="22" rx="2" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="92" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">ORIGINAL INPUT x</text>

    <!-- Image representation box -->
    <g transform="translate(22, 44)">
      <rect x="0" y="0" width="141" height="96" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <!-- Panda face stylized geometric icon -->
      <circle cx="70" cy="50" r="28" fill="#f8fafc"/>
      <!-- Ears -->
      <circle cx="48" cy="28" r="9" fill="#1e293b"/>
      <circle cx="92" cy="28" r="9" fill="#1e293b"/>
      <!-- Eye patches -->
      <ellipse cx="58" cy="46" rx="7" ry="9" fill="#1e293b" transform="rotate(-15, 58, 46)"/>
      <ellipse cx="82" cy="46" rx="7" ry="9" fill="#1e293b" transform="rotate(15, 82, 46)"/>
      <circle cx="59" cy="45" r="2.5" fill="#ffffff"/>
      <circle cx="81" cy="45" r="2.5" fill="#ffffff"/>
      <!-- Nose & Mouth -->
      <polygon points="67 56, 73 56, 70 60" fill="#1e293b"/>
      <path d="M 66 63 Q 70 66 74 63" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    </g>

    <!-- Prediction Badge -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="157" height="42" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803d">Prediction: Panda</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Confidence: 99.2% (Ground Truth)</text>
    </g>
    <text x="92" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Human: Clear Panda</text>
    <text x="92" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#94a3b8" text-anchor="middle">Input norm: ‖x‖_∞ ≤ 1.0</text>
  </g>

  <!-- CONNECTOR 1: Gradient Backprop -->
  <g transform="translate(217, 110)">
    <line x1="0" y1="18" x2="32" y2="18" stroke="#64748b" stroke-width="1.5" marker-end="url(#ga-arr)"/>
    <text x="16" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#475569" text-anchor="middle">+ ∇_x L</text>
  </g>

  <!-- STAGE 2: Perturbation δ = ε · sign(∇_x L) -->
  <g transform="translate(252, 24)">
    <rect x="0" y="0" width="185" height="236" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="12" width="161" height="22" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="92" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">PERTURBATION δ</text>

    <!-- Noise visualization grid -->
    <g transform="translate(22, 44)">
      <rect x="0" y="0" width="141" height="96" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <!-- High frequency noise tiles -->
      <g fill="#f59e0b" opacity="0.4">
        <rect x="6" y="6" width="14" height="14"/><rect x="34" y="6" width="14" height="14"/><rect x="62" y="6" width="14" height="14"/><rect x="90" y="6" width="14" height="14"/><rect x="118" y="6" width="14" height="14"/>
        <rect x="20" y="24" width="14" height="14"/><rect x="48" y="24" width="14" height="14"/><rect x="76" y="24" width="14" height="14"/><rect x="104" y="24" width="14" height="14"/>
        <rect x="6" y="42" width="14" height="14"/><rect x="34" y="42" width="14" height="14"/><rect x="62" y="42" width="14" height="14"/><rect x="90" y="42" width="14" height="14"/><rect x="118" y="42" width="14" height="14"/>
        <rect x="20" y="60" width="14" height="14"/><rect x="48" y="60" width="14" height="14"/><rect x="76" y="60" width="14" height="14"/><rect x="104" y="60" width="14" height="14"/>
        <rect x="6" y="76" width="14" height="14"/><rect x="34" y="76" width="14" height="14"/><rect x="62" y="76" width="14" height="14"/><rect x="90" y="76" width="14" height="14"/><rect x="118" y="76" width="14" height="14"/>
      </g>
      <text x="70" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">ε · sign(∇_x L)</text>
    </g>

    <!-- Formula Details Badge -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="157" height="42" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b45309">Magnitude: ε = 0.007</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#92400e">L_∞ norm bound: ‖δ‖_∞ ≤ ε</text>
    </g>
    <text x="92" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Human: Imperceptible noise</text>
    <text x="92" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#94a3b8" text-anchor="middle">Signed steepest ascent direction</text>
  </g>

  <!-- CONNECTOR 2: Vector Addition -->
  <g transform="translate(439, 110)">
    <line x1="0" y1="18" x2="32" y2="18" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ga-arr-red)"/>
    <text x="16" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">x + δ</text>
  </g>

  <!-- STAGE 3: Adversarial Example x' -->
  <g transform="translate(474, 24)">
    <rect x="0" y="0" width="185" height="236" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="12" width="161" height="22" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="92" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">ADVERSARIAL EXAMPLE x'</text>

    <!-- Visually Identical Image with Imperceptible Perturbation -->
    <g transform="translate(22, 44)">
      <rect x="0" y="0" width="141" height="96" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="1.2"/>
      <!-- Panda face identical to human eyes -->
      <circle cx="70" cy="50" r="28" fill="#f8fafc"/>
      <circle cx="48" cy="28" r="9" fill="#1e293b"/>
      <circle cx="92" cy="28" r="9" fill="#1e293b"/>
      <ellipse cx="58" cy="46" rx="7" ry="9" fill="#1e293b" transform="rotate(-15, 58, 46)"/>
      <ellipse cx="82" cy="46" rx="7" ry="9" fill="#1e293b" transform="rotate(15, 82, 46)"/>
      <circle cx="59" cy="45" r="2.5" fill="#ffffff"/>
      <circle cx="81" cy="45" r="2.5" fill="#ffffff"/>
      <polygon points="67 56, 73 56, 70 60" fill="#1e293b"/>
      <path d="M 66 63 Q 70 66 74 63" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    </g>

    <!-- Catastrophic Wrong Prediction Badge -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="157" height="42" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">❌ Prediction: Gibbon</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">Confidence: 99.3% (Misclassified!)</text>
    </g>
    <text x="92" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Human: Indistinguishable Panda</text>
    <text x="92" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Deep model logit completely flipped</text>
  </g>

  <!-- STAGE 4: Geometric Boundary Crossing Vector Space -->
  <g transform="translate(685, 24)">
    <rect x="0" y="0" width="245" height="236" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="12" width="221" height="22" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="122" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle">GEOMETRIC BOUNDARY SHIFT</text>

    <!-- Geometry Plot -->
    <g transform="translate(16, 44)">
      <rect x="0" y="0" width="213" height="136" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Decision Boundary (Diagonal line) -->
      <line x1="20" y1="120" x2="190" y2="16" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 2"/>
      <text x="130" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" transform="rotate(-31, 130, 44)">Hyperplane f(x) = 0</text>

      <!-- Regions -->
      <text x="40" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#0369a1">Class: Panda</text>
      <text x="135" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c">Class: Gibbon</text>

      <!-- Point x -->
      <circle cx="70" cy="80" r="5" fill="#0284c7"/>
      <text x="60" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0369a1">x</text>

      <!-- Perturbation vector pointing across boundary -->
      <line x1="70" y1="80" x2="135" y2="92" stroke="#dc2626" stroke-width="2" marker-end="url(#ga-arr-red)"/>
      <text x="96" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#dc2626">+δ</text>

      <!-- Point x' across boundary -->
      <circle cx="138" cy="93" r="5" fill="#dc2626"/>
      <text x="146" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c">x'</text>

      <!-- Gradient direction indication -->
      <path d="M 70 80 L 105 50" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#ga-arr-blue)"/>
      <text x="94" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#0284c7">∇_x L</text>
    </g>

    <text x="122" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">High-Dimensional Geometry</text>
    <text x="122" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#475569" text-anchor="middle">In d-dimensions, δ accumulates</text>
    <text x="122" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#b91c1c" text-anchor="middle">wᵀδ = ε · ‖w‖₁ &gt;&gt; margin gap</text>
  </g>

  <!-- BOTTOM PANEL: Defensive Architecture -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="900" height="136" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect x="16" y="14" width="168" height="22" rx="2" fill="#dcfce7"/>
    <text x="100" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">ARCHITECTURAL MITIGATIONS</text>
    <text x="194" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#166534">Multi-Layered Hardening for Machine Learning Pipelines</text>

    <g transform="translate(16, 46)">
      <!-- Defense 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="280" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">1. Adversarial Training (PGD-AT)</text>
        <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Min-Max robust optimization objective:</text>
        <text x="12" y="46" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="7.5" fill="#15803d">min_θ E [ max_{‖δ‖≤ε} L(θ, x+δ, y) ]</text>
        <text x="12" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Hardens boundary by injecting PGD perturbations.</text>
      </g>

      <!-- Defense 2 -->
      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="280" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">2. Certified Defenses (Smoothing)</text>
        <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Guarantees provable radius R via noise addition:</text>
        <text x="12" y="46" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="7.5" fill="#0369a1">R = (σ / 2) · (Φ⁻¹(p_A) − Φ⁻¹(p_B))</text>
        <text x="12" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">No adversarial perturbation within R can flip class.</text>
      </g>

      <!-- Defense 3 -->
      <g transform="translate(590, 0)">
        <rect x="0" y="0" width="278" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">3. Input Denoising &amp; Purification</text>
        <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Removes high-frequency adversarial energy:</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">• Denoising autoencoders &amp; diffusion purification</text>
        <text x="12" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">• Neural compression (JPEG, quantization, VAE)</text>
      </g>
    </g>
  </g>
</svg>
