<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="600" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#CB202D"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== Input-space axes ===== -->
  <path d="M60,300 H560" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <path d="M60,300 V30" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="566" y="304" font-size="12" fill="#475569">x<tspan font-size="10.5" dy="3">1</tspan></text>
  <text x="46" y="26" font-size="12" fill="#475569">x<tspan font-size="10.5" dy="3">2</tspan></text>

  <!-- ===== Class regions ===== -->
  <text x="100" y="60" font-size="12" font-weight="700" fill="#0f172a">Other class</text>
  <text x="100" y="76" font-size="11" fill="#475569">(e.g., gibbon)</text>
  <text x="440" y="250" font-size="12" font-weight="700" fill="#0f172a">True class y</text>
  <text x="440" y="266" font-size="11" fill="#475569">(e.g., panda)</text>

  <!-- ===== l-infinity ball around x (half-width eps = 70) ===== -->
  <rect x="260" y="120" width="140" height="140" rx="0" fill="#EAF1F8" fill-opacity="0.6" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="406" y="136" font-size="11" fill="#14294E">allowed set</text>
  <text x="406" y="151" font-size="11" fill="#14294E">|&#8202;|&#8201;δ&#8201;|&#8202;|<tspan font-size="10.5" dy="3">∞</tspan><tspan dx="3" dy="-3">≤ ε</tspan><tspan font-size="10.5" dy="3">adv</tspan></text>

  <!-- ===== Decision boundary y = -0.8x + 384 ===== -->
  <line x1="130" y1="280" x2="450" y2="24" stroke="#0f172a" stroke-width="1.8"/>
  <text x="458" y="40" font-size="11" fill="#0f172a">decision boundary</text>

  <!-- eps dimension marker -->
  <path d="M330,276 H400" fill="none" stroke="#475569" stroke-width="1"/>
  <path d="M330,271 V281 M400,271 V281" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="322" y="280" text-anchor="end" font-size="11" fill="#475569">ε<tspan font-size="10.5" dy="3">adv</tspan></text>

  <!-- ===== Gradient direction (does not reach the boundary) ===== -->
  <line x1="330" y1="190" x2="287" y2="169" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="298" y="186" text-anchor="end" font-size="11" fill="#14294E">∇<tspan font-size="10.5" dy="3">x</tspan><tspan dy="-3">ℒ</tspan></text>

  <!-- ===== FGSM step to the corner ===== -->
  <line x1="330" y1="190" x2="264" y2="124" stroke="#CB202D" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- clean input x -->
  <circle cx="330" cy="190" r="5" fill="#1F407A"/>
  <text x="340" y="200" font-size="12" font-weight="700" fill="#0f172a">x</text>

  <!-- adversarial input -->
  <circle cx="260" cy="120" r="5" fill="#CB202D"/>
  <text x="250" y="112" text-anchor="end" font-size="12" font-weight="700" fill="#CB202D">x<tspan font-size="10.5" dy="3">adv</tspan><tspan dx="3" dy="-3" font-size="11" font-weight="400">= x + ε</tspan><tspan font-size="10.5" font-weight="400" dy="3">adv</tspan><tspan dx="3" dy="-3" font-size="11" font-weight="400">· sign(∇</tspan><tspan font-size="10.5" font-weight="400" dy="3">x</tspan><tspan dy="-3" font-size="11" font-weight="400">ℒ)</tspan></text>
</svg>
