<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="ga-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="ga-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="ga-arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- TOP PIPELINE: 4 Stages of Fast Gradient Sign Method (FGSM) -->

  <!-- STAGE 1: Original Clean Input x -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="195" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="24" rx="4" fill="#EAF1F8"/>
    <rect x="0" y="20" width="195" height="4" fill="#EAF1F8"/>
    <text x="97.5" y="16" font-size="9" font-weight="700" fill="#1F407A" text-anchor="middle" letter-spacing="0.3">Panel A: Clean Input x</text>

    <!-- Image representation box -->
    <g transform="translate(27, 36)">
      <rect x="0" y="0" width="141" height="96" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <!-- Panda face stylized geometric icon -->
      <circle cx="70" cy="50" r="28" fill="#f8fafc"/>
      <!-- Ears -->
      <circle cx="48" cy="28" r="9" fill="#1e293b"/>
      <circle cx="92" cy="28" r="9" fill="#1e293b"/>
      <!-- Eye patches -->
      <ellipse cx="58" cy="46" rx="7" ry="9" fill="#1e293b" transform="rotate(-15, 58, 46)"/>
      <ellipse cx="82" cy="46" rx="7" ry="9" fill="#1e293b" transform="rotate(15, 82, 46)"/>
      <circle cx="59" cy="45" r="2.5" fill="#ffffff"/>
      <circle cx="81" cy="45" r="2.5" fill="#ffffff"/>
      <!-- Nose & Mouth -->
      <polygon points="67 56, 73 56, 70 60" fill="#1e293b"/>
      <path d="M 66 63 Q 70 66 74 63" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    </g>

    <!-- Prediction Badge -->
    <g transform="translate(14, 142)">
      <rect x="0" y="0" width="167" height="44" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="17" font-size="8.5" font-weight="700" fill="#15803d">Prediction: Panda</text>
      <text x="10" y="32" font-size="8" fill="#166534">Confidence: 99.2% (True Label)</text>
    </g>
    <text x="97.5" y="206" font-size="8" fill="#475569" text-anchor="middle">Perception: Unambiguous Panda</text>
    <text x="97.5" y="222" font-size="7.5" fill="#64748b" text-anchor="middle">Bounded domain: ‖x‖_∞ ≤ 1.0</text>
  </g>

  <!-- CONNECTOR 1: Gradient Backprop -->
  <g transform="translate(222, 116)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#64748b" stroke-width="1.5" marker-end="url(#ga-arr)"/>
    <text x="11" y="-8" font-size="7.5" font-weight="700" fill="#475569" text-anchor="middle">+ ∇_x L</text>
  </g>

  <!-- STAGE 2: Perturbation δ = ε · sign(∇_x L) -->
  <g transform="translate(247, 20)">
    <rect x="0" y="0" width="195" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="24" rx="4" fill="#fef3c7"/>
    <rect x="0" y="20" width="195" height="4" fill="#fef3c7"/>
    <text x="97.5" y="16" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing="0.3">Panel B: Perturbation δ</text>

    <!-- Noise visualization grid -->
    <g transform="translate(27, 36)">
      <rect x="0" y="0" width="141" height="96" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <!-- High frequency noise tiles -->
      <g fill="#f59e0b" opacity="0.4">
        <rect x="6" y="6" width="14" height="14"/><rect x="34" y="6" width="14" height="14"/><rect x="62" y="6" width="14" height="14"/><rect x="90" y="6" width="14" height="14"/><rect x="118" y="6" width="14" height="14"/>
        <rect x="20" y="24" width="14" height="14"/><rect x="48" y="24" width="14" height="14"/><rect x="76" y="24" width="14" height="14"/><rect x="104" y="24" width="14" height="14"/>
        <rect x="6" y="42" width="14" height="14"/><rect x="34" y="42" width="14" height="14"/><rect x="62" y="42" width="14" height="14"/><rect x="90" y="42" width="14" height="14"/><rect x="118" y="42" width="14" height="14"/>
        <rect x="20" y="60" width="14" height="14"/><rect x="48" y="60" width="14" height="14"/><rect x="76" y="60" width="14" height="14"/><rect x="104" y="60" width="14" height="14"/>
        <rect x="6" y="76" width="14" height="14"/><rect x="34" y="76" width="14" height="14"/><rect x="62" y="76" width="14" height="14"/><rect x="90" y="76" width="14" height="14"/><rect x="118" y="76" width="14" height="14"/>
      </g>
      <text x="70" y="53" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">ε · sign(∇_x L)</text>
    </g>

    <!-- Formula Details Badge -->
    <g transform="translate(14, 142)">
      <rect x="0" y="0" width="167" height="44" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="17" font-size="8.5" font-weight="700" fill="#b45309">Magnitude: ε = 0.007</text>
      <text x="10" y="32" font-size="8" fill="#92400e">L_∞ norm bound: ‖δ‖_∞ ≤ ε</text>
    </g>
    <text x="97.5" y="206" font-size="8" fill="#475569" text-anchor="middle">Perception: Imperceptible Noise</text>
    <text x="97.5" y="222" font-size="7.5" fill="#64748b" text-anchor="middle">Signed steepest ascent step</text>
  </g>

  <!-- CONNECTOR 2: Vector Addition -->
  <g transform="translate(444, 116)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ga-arr-red)"/>
    <text x="11" y="-8" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">x + δ</text>
  </g>

  <!-- STAGE 3: Adversarial Example x' -->
  <g transform="translate(469, 20)">
    <rect x="0" y="0" width="195" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="24" rx="4" fill="#fee2e2"/>
    <rect x="0" y="20" width="195" height="4" fill="#fee2e2"/>
    <text x="97.5" y="16" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="0.3">Panel C: Adversarial Input x'</text>

    <!-- Visually Identical Image with Imperceptible Perturbation -->
    <g transform="translate(27, 36)">
      <rect x="0" y="0" width="141" height="96" rx="3" fill="#0f172a" stroke="#dc2626" stroke-width="1.2"/>
      <circle cx="70" cy="50" r="28" fill="#f8fafc"/>
      <circle cx="48" cy="28" r="9" fill="#1e293b"/>
      <circle cx="92" cy="28" r="9" fill="#1e293b"/>
      <ellipse cx="58" cy="46" rx="7" ry="9" fill="#1e293b" transform="rotate(-15, 58, 46)"/>
      <ellipse cx="82" cy="46" rx="7" ry="9" fill="#1e293b" transform="rotate(15, 82, 46)"/>
      <circle cx="59" cy="45" r="2.5" fill="#ffffff"/>
      <circle cx="81" cy="45" r="2.5" fill="#ffffff"/>
      <polygon points="67 56, 73 56, 70 60" fill="#1e293b"/>
      <path d="M 66 63 Q 70 66 74 63" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    </g>

    <!-- Catastrophic Wrong Prediction Badge -->
    <g transform="translate(14, 142)">
      <rect x="0" y="0" width="167" height="44" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
      <text x="10" y="17" font-size="8.5" font-weight="700" fill="#b91c1c">Result: Gibbon (Adversarial)</text>
      <text x="10" y="32" font-size="8" fill="#7f1d1d">Confidence: 99.3% Misclassified</text>
    </g>
    <text x="97.5" y="206" font-size="8" fill="#475569" text-anchor="middle">Perception: Indistinguishable</text>
    <text x="97.5" y="222" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Decision hyperplane breached</text>
  </g>

  <!-- STAGE 4: Geometric Boundary Crossing Vector Space -->
  <g transform="translate(685, 20)">
    <rect x="0" y="0" width="250" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="24" rx="4" fill="#f1f5f9"/>
    <rect x="0" y="20" width="250" height="4" fill="#f1f5f9"/>
    <text x="125" y="16" font-size="9" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="0.3">Panel D: Decision Boundary Geometry</text>

    <!-- Geometry Plot -->
    <g transform="translate(18, 36)">
      <rect x="0" y="0" width="214" height="136" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Decision Boundary (Diagonal line) -->
      <line x1="20" y1="120" x2="190" y2="16" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 2"/>
      <text x="130" y="44" font-size="7.5" fill="#64748b" transform="rotate(-31, 130, 44)">Hyperplane f(x) = 0</text>

      <!-- Regions -->
      <text x="40" y="32" font-size="8" font-weight="700" fill="#1F407A">Class: Panda</text>
      <text x="135" y="124" font-size="8" font-weight="700" fill="#b91c1c">Class: Gibbon</text>

      <!-- Point x -->
      <circle cx="70" cy="80" r="5" fill="#1F407A"/>
      <text x="60" y="74" font-size="8.5" font-weight="700" fill="#1F407A">x</text>

      <!-- Perturbation vector pointing across boundary -->
      <line x1="70" y1="80" x2="135" y2="92" stroke="#dc2626" stroke-width="2" marker-end="url(#ga-arr-red)"/>
      <text x="96" y="98" font-size="8" font-weight="700" fill="#dc2626">+δ</text>

      <!-- Point x' across boundary -->
      <circle cx="138" cy="93" r="5" fill="#dc2626"/>
      <text x="146" y="92" font-size="8.5" font-weight="700" fill="#b91c1c">x'</text>

      <!-- Gradient direction indication -->
      <path d="M 70 80 L 105 50" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#ga-arr-blue)"/>
      <text x="94" y="44" font-size="7" fill="#1F407A">∇_x L</text>
    </g>

    <text x="125" y="196" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">High-Dimensional Geometry</text>
    <text x="125" y="209" font-size="7.5" fill="#475569" text-anchor="middle">In d-dimensions, small δ accumulates:</text>
    <text x="125" y="222" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">wᵀδ = ε · ‖w‖₁ &gt;&gt; boundary margin</text>
  </g>

  <!-- BOTTOM PANEL: Defensive Hardening Architectures -->
  <g transform="translate(25, 274)">
    <rect x="0" y="0" width="910" height="144" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="910" height="24" rx="5" fill="#f1f5f9"/>
    <rect x="0" y="20" width="910" height="4" fill="#f1f5f9"/>
    <text x="16" y="16" font-size="9" font-weight="700" fill="#334155" letter-spacing="0.4">DEFENSIVE HARDENING ARCHITECTURES</text>

    <g transform="translate(16, 36)">
      <!-- Defense 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="280" height="92" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="280" height="20" rx="4" fill="#eff6ff"/>
        <rect x="0" y="16" width="280" height="4" fill="#eff6ff"/>
        <text x="12" y="14" font-size="8.5" font-weight="700" fill="#1F407A">1 · Adversarial Training (PGD-AT)</text>
        <text x="12" y="34" font-size="8" fill="#475569">Min-Max robust optimization objective:</text>
        <text x="12" y="52" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="7.5" fill="#15803d">min_θ E [ max_{‖δ‖≤ε} L(θ, x+δ, y) ]</text>
        <text x="12" y="74" font-size="7.5" fill="#64748b">Directly hardens decision margin during training</text>
      </g>

      <!-- Defense 2 -->
      <g transform="translate(298, 0)">
        <rect x="0" y="0" width="280" height="92" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="280" height="20" rx="4" fill="#eff6ff"/>
        <rect x="0" y="16" width="280" height="4" fill="#eff6ff"/>
        <text x="12" y="14" font-size="8.5" font-weight="700" fill="#1F407A">2 · Certified Defenses (Smoothing)</text>
        <text x="12" y="34" font-size="8" fill="#475569">Guarantees provable radius R via Gaussian noise:</text>
        <text x="12" y="52" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="7.5" fill="#1F407A">R = (σ / 2) · (Φ⁻¹(p_A) − Φ⁻¹(p_B))</text>
        <text x="12" y="74" font-size="7.5" fill="#64748b">Provably guarantees no flip inside radius R</text>
      </g>

      <!-- Defense 3 -->
      <g transform="translate(596, 0)">
        <rect x="0" y="0" width="280" height="92" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="280" height="20" rx="4" fill="#eff6ff"/>
        <rect x="0" y="16" width="280" height="4" fill="#eff6ff"/>
        <text x="12" y="14" font-size="8.5" font-weight="700" fill="#1F407A">3 · Input Purification &amp; Denoising</text>
        <text x="12" y="34" font-size="8" fill="#475569">Filters high-frequency adversarial energy:</text>
        <text x="12" y="52" font-size="8" fill="#0f172a">Diffusion purification &amp; autoencoders</text>
        <text x="12" y="74" font-size="7.5" fill="#64748b">Neural compression (JPEG, VAE, quantization)</text>
      </g>
    </g>
  </g>
</svg>
