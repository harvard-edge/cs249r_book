<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- PANEL A: ROBUST CLASSIFIER -->
  <g transform="translate(25, 20)">
    <rect width="340" height="295" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Header -->
    <rect width="340" height="30" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="170" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">(a) Robust Classifier: Margin &gt; ε</text>

    <!-- Coordinate Axes -->
    <line x1="45" y1="210" x2="310" y2="210" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <line x1="45" y1="210" x2="45" y2="50" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <text x="315" y="214" font-size="10" font-weight="600" fill="#64748b">x₁</text>
    <text x="42" y="45" text-anchor="end" font-size="10" font-weight="600" fill="#64748b">x₂</text>

    <!-- Class - Sample & Perturbation Ball -->
    <circle cx="115" cy="130" r="42" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="115" cy="130" r="5" fill="#1e40af"/>
    <text x="115" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">x₋</text>
    <text x="115" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">−</text>
    <text x="115" y="184" text-anchor="middle" font-size="9" fill="#16a34a">B_ε(x₋)</text>

    <!-- Class + Sample & Perturbation Ball -->
    <circle cx="245" cy="130" r="42" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="245" cy="130" r="5" fill="#1e40af"/>
    <text x="245" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">x₊</text>
    <text x="245" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">+</text>
    <text x="245" y="184" text-anchor="middle" font-size="9" fill="#16a34a">B_ε(x₊)</text>

    <!-- Decision Boundary A -->
    <line x1="180" y1="50" x2="180" y2="210" stroke="#0f172a" stroke-width="2"/>
    <rect x="145" y="55" width="70" height="18" rx="2" fill="#0f172a"/>
    <text x="180" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Boundary A</text>

    <!-- Perturbation arrow inside ball -->
    <line x1="245" y1="130" x2="215" y2="100" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="200" y="88" font-size="9" font-weight="600" fill="#dc2626">x₊ + δ</text>

    <!-- Outcome Note -->
    <rect x="15" y="230" width="310" height="50" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="25" y="248" font-size="10" font-weight="700" fill="#166534">Certified Robust Invariance</text>
    <text x="25" y="266" font-size="9" fill="#334155">Clean Accuracy: 100% · Perturbed Accuracy: 100%</text>
  </g>

  <!-- PANEL B: FRAGILE CLASSIFIER -->
  <g transform="translate(395, 20)">
    <rect width="340" height="295" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Header -->
    <rect width="340" height="30" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="170" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">(b) Fragile Classifier: Margin &lt; ε</text>

    <!-- Coordinate Axes -->
    <line x1="45" y1="210" x2="310" y2="210" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <line x1="45" y1="210" x2="45" y2="50" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <text x="315" y="214" font-size="10" font-weight="600" fill="#64748b">x₁</text>
    <text x="42" y="45" text-anchor="end" font-size="10" font-weight="600" fill="#64748b">x₂</text>

    <!-- Class - Sample & Perturbation Ball -->
    <circle cx="115" cy="130" r="42" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="115" cy="130" r="5" fill="#1e40af"/>
    <text x="115" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">x₋</text>
    <text x="115" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">−</text>
    <text x="115" y="184" text-anchor="middle" font-size="9" fill="#16a34a">B_ε(x₋)</text>

    <!-- Class + Sample & Perturbation Ball -->
    <circle cx="245" cy="130" r="42" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="245" cy="130" r="5" fill="#1e40af"/>
    <text x="260" y="134" font-size="11" font-weight="600" fill="#0f172a">x₊</text>
    <text x="245" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">+</text>
    <text x="245" y="184" text-anchor="middle" font-size="9" fill="#16a34a">B_ε(x₊)</text>

    <!-- Fragile Decision Boundary B cutting into B_ε(x₊) -->
    <line x1="50" y1="195" x2="300" y2="85" stroke="#0f172a" stroke-width="2"/>
    <rect x="235" y="70" width="70" height="18" rx="2" fill="#0f172a"/>
    <text x="270" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Boundary B</text>

    <!-- Adversarial Perturbation Crossing Boundary -->
    <line x1="245" y1="130" x2="215" y2="95" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
    <circle cx="215" cy="95" r="3" fill="#dc2626"/>
    <rect x="155" y="65" width="80" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="195" y="78" text-anchor="middle" font-size="8.5" font-weight="700" fill="#dc2626">x₊ + δ* (Flipped)</text>

    <!-- Outcome Note -->
    <rect x="15" y="230" width="310" height="50" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="25" y="248" font-size="10" font-weight="700" fill="#b91c1c">Vulnerable to Adversarial Evasion</text>
    <text x="25" y="266" font-size="9" fill="#334155">Clean Accuracy: 100% · Robust Accuracy: 0%</text>
  </g>

  <!-- BOTTOM LEGEND (Compact textbook notation) -->
  <g transform="translate(100, 335)">
    <circle cx="15" cy="12" r="5" fill="#1e40af"/>
    <text x="28" y="16" font-size="9.5" fill="#334155">Clean inputs (x₋, x₊)</text>

    <circle cx="195" cy="12" r="7" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="210" y="16" font-size="9.5" fill="#334155">Allowed perturbation set B_ε(x) = {x′ : ||x′ − x||_p ≤ ε}</text>

    <line x1="510" y1="12" x2="535" y2="12" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="545" y="16" font-size="9.5" fill="#dc2626">Perturbation vector δ</text>
  </g>
</svg>
