<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Top Header Banner Pill -->
  <rect x="190.0" y="18" width="620" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500.0" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.2px">GEOMETRIC ROBUSTNESS · CLEAN GENERALIZATION VS. PERTURBATION MARGIN</text>
  <!-- Panel A: Robust Classifier -->
  <rect x="40" y="65" width="440" height="400" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="55" y="78" width="145" height="26" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="127" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#166534" letter-spacing="0.8px">PANEL A: ROBUST</text>
  <text x="210" y="96" font-size="13" font-weight="700" fill="#166534">Margin &gt; Perturbation Radius ε</text>
  <rect x="55" y="115" width="410" height="250" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
  <line x1="85" y1="330" x2="435" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="85" y1="330" x2="85" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="445" y="334" font-size="11" font-weight="700" fill="#64748b">x1</text>
  <text x="82" y="128" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">x2</text>
  <circle cx="170" cy="235" r="55" fill="#f1f5f9" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="170" cy="235" r="7" fill="#1e40af"/>
  <text x="170" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">−</text>
  <text x="170" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">x−</text>
  <text x="170" y="303" text-anchor="middle" font-size="10" fill="#16a34a">B_ε(x−)</text>
  <circle cx="340" cy="235" r="55" fill="#f1f5f9" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="340" cy="235" r="7" fill="#1e40af"/>
  <text x="340" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">+</text>
  <text x="340" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">x+</text>
  <text x="340" y="303" text-anchor="middle" font-size="10" fill="#16a34a">B_ε(x+)</text>
  <line x1="255" y1="135" x2="255" y2="330" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="205" y="145" width="100" height="22" rx="4" fill="#0f172a"/>
  <text x="255" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Boundary A</text>
  <line x1="340" y1="235" x2="300" y2="195" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="280" y="210" font-size="10" font-weight="700" fill="#dc2626">x+ + δ</text>
  <rect x="55" y="375" width="410" height="75" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="70" y="395" font-size="12" font-weight="700" fill="#166534">✓ Certified Prediction Invariance</text>
  <text x="70" y="413" font-size="11" fill="#334155">• Clean Accuracy: 100% (both x− and x+ correctly separated)</text>
  <text x="70" y="431" font-size="11" fill="#166534">• Perturbed Accuracy: 100% — boundary stays outside both L_p balls!</text>
  <!-- Panel B: Fragile Standard Classifier -->
  <rect x="520" y="65" width="440" height="400" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="535" y="78" width="145" height="26" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="607" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b" letter-spacing="0.8px">PANEL B: FRAGILE</text>
  <text x="690" y="96" font-size="13" font-weight="700" fill="#991b1b">Margin &lt; Perturbation Radius ε</text>
  <rect x="535" y="115" width="410" height="250" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <line x1="565" y1="330" x2="915" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="565" y1="330" x2="565" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="925" y="334" font-size="11" font-weight="700" fill="#64748b">x1</text>
  <text x="562" y="128" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">x2</text>
  <circle cx="650" cy="235" r="55" fill="#f1f5f9" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="650" cy="235" r="7" fill="#1e40af"/>
  <text x="650" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">−</text>
  <text x="650" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">x−</text>
  <text x="650" y="303" text-anchor="middle" font-size="10" fill="#16a34a">B_ε(x−)</text>
  <circle cx="820" cy="235" r="55" fill="#f1f5f9" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="820" cy="235" r="7" fill="#1e40af"/>
  <text x="820" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">+</text>
  <text x="838" y="240" font-size="11" font-weight="700" fill="#334155">x+</text>
  <text x="820" y="303" text-anchor="middle" font-size="10" fill="#16a34a">B_ε(x+)</text>
  <line x1="570" y1="315" x2="905" y2="180" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="830" y="165" width="95" height="22" rx="4" fill="#0f172a"/>
  <text x="877" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Boundary B</text>
  <line x1="820" y1="235" x2="780" y2="190" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <circle cx="780" cy="190" r="4" fill="#dc2626"/>
  <line x1="780" y1="186" x2="780" y2="167" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2 2"/>
  <rect x="710" y="145" width="135" height="22" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="777" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">x+ + δ* (FLIPPED!)</text>
  <rect x="535" y="375" width="410" height="75" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="550" y="395" font-size="12" font-weight="700" fill="#dc2626">✗ Vulnerable to Adversarial Evasion</text>
  <text x="550" y="413" font-size="11" fill="#334155">• Clean Accuracy: 100% (same clean performance as Panel A)</text>
  <text x="550" y="431" font-size="11" fill="#dc2626">• Robust Accuracy: 0% under attack — boundary crosses perturbation ball!</text>
  <rect x="40" y="475" width="920" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="70" cy="496" r="6" fill="#1e40af"/>
  <text x="85" y="500" font-size="11" font-weight="600" fill="#334155">Clean training input (x−, x+)</text>
  <circle cx="340" cy="496" r="9" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="358" y="500" font-size="11" font-weight="600" fill="#334155">Allowed perturbation set B_ε(x) = {x′ : ||x′ − x||_p ≤ ε}</text>
  <line x1="720" y1="496" x2="750" y2="496" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="760" y="500" font-size="11" font-weight="600" fill="#dc2626">Adversarial perturbation vector δ</text>
  <!-- Bottom Takeaway Card -->
  <rect x="40" y="530" width="920" height="72" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="55" y="542" width="165" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="137" y="558" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af" letter-spacing="0.8px">FUNDAMENTAL INSIGHT</text>
  <text x="235" y="557" font-size="12" font-weight="700" fill="#1e40af">Clean Generalization ≠ Adversarial Robustness</text>
  <text x="235" y="574" font-size="11" fill="#475569">Two classifiers can achieve identical 100% accuracy on held-out test sets while having radically different geometric margins.</text>
  <text x="235" y="590" font-size="11" fill="#475569">Robust optimization enforces boundary margins &gt; ε to guarantee that no allowable perturbation alters predictions.</text>
</svg>