<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#DC2626" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Panel A Card -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="440" height="340" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="15" y="15" width="220" height="26" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="125" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">A: PREDICTIONS PRESERVED</text>

    <!-- Axes -->
    <path d="M45 295 H405 M45 295 V55" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
    <text x="412" y="300" font-size="14" font-weight="600" fill="#475569">x₁</text>
    <text x="32" y="55" font-size="14" font-weight="600" fill="#475569">x₂</text>

    <!-- Class (-) point and perturbation ball -->
    <circle cx="130" cy="195" r="60" fill="#DCFCE7" fill-opacity="0.45" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="130" cy="195" r="6" fill="#1F407A"/>
    <text x="130" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">−</text>

    <!-- Class (+) point and perturbation ball -->
    <circle cx="310" cy="195" r="60" fill="#DCFCE7" fill-opacity="0.45" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="310" cy="195" r="6" fill="#1F407A"/>
    <text x="310" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">+</text>

    <!-- Boundary A -->
    <path d="M220 65 V295" stroke="#0F172A" stroke-width="2.2"/>
    <rect x="230" y="70" width="85" height="20" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <text x="272" y="84" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">Boundary A</text>

    <!-- Perturbation Vector -->
    <path d="M310 195 L285 145" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
    <path d="M280 141 L289 149 M289 141 L280 149" stroke="#DC2626" stroke-width="2"/>
  </g>

  <!-- Panel B Card -->
  <g transform="translate(495, 20)">
    <rect x="0" y="0" width="440" height="340" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="15" y="15" width="220" height="26" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="125" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">B: PREDICTION CAN CHANGE</text>

    <!-- Axes -->
    <path d="M45 295 H405 M45 295 V55" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
    <text x="412" y="300" font-size="14" font-weight="600" fill="#475569">x₁</text>
    <text x="32" y="55" font-size="14" font-weight="600" fill="#475569">x₂</text>

    <!-- Class (-) point and perturbation ball -->
    <circle cx="130" cy="195" r="60" fill="#DCFCE7" fill-opacity="0.45" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="130" cy="195" r="6" fill="#1F407A"/>
    <text x="130" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">−</text>

    <!-- Class (+) point and perturbation ball -->
    <circle cx="310" cy="195" r="60" fill="#DCFCE7" fill-opacity="0.45" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="310" cy="195" r="6" fill="#1F407A"/>
    <text x="310" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">+</text>

    <!-- Boundary B (Tilted) -->
    <path d="M50 280 L395 105" stroke="#0F172A" stroke-width="2.2"/>
    <rect x="230" y="90" width="85" height="20" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <text x="272" y="104" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">Boundary B</text>

    <!-- Perturbation Vector crossing boundary -->
    <path d="M310 195 L285 145" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
    <path d="M280 141 L289 149 M289 141 L280 149" stroke="#DC2626" stroke-width="2"/>
  </g>

  <!-- Legend Footer Card -->
  <g transform="translate(25, 375)">
    <rect x="0" y="0" width="910" height="46" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

    <circle cx="80" cy="23" r="6" fill="#1F407A"/>
    <text x="95" y="27" font-size="12" font-weight="600" fill="#334155">Clean input (+ or −)</text>

    <circle cx="370" cy="23" r="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="390" y="27" font-size="12" font-weight="600" fill="#334155">Allowed perturbations (L_p ball)</text>

    <path d="M685 23 H725" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
    <text x="740" y="27" font-size="12" font-weight="600" fill="#334155">Perturbed adversarial input</text>
  </g>
</svg>
