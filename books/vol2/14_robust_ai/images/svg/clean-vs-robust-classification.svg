<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- PANEL A: ROBUST CLASSIFIER -->
  <g transform="translate(25, 20)">
    <rect width="360" height="280" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="180" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">(a) Robust Classifier: Margin &gt; ε<tspan baseline-shift="sub" font-size="70%">adv</tspan></text>

    <!-- Axes -->
    <line x1="55" y1="215" x2="330" y2="215" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <line x1="55" y1="215" x2="55" y2="55" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <text x="335" y="219" font-size="10" font-weight="600" fill="#64748b">x₁</text>
    <text x="50" y="50" text-anchor="end" font-size="10" font-weight="600" fill="#64748b">x₂</text>

    <!-- Class - Sample & Ball -->
    <circle cx="130" cy="135" r="42" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="130" cy="135" r="5" fill="#1e40af"/>
    <text x="130" y="117" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">x₋</text>
    <text x="130" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">−</text>
    <text x="130" y="190" text-anchor="middle" font-size="9" fill="#16a34a">B_ε<tspan baseline-shift="sub" font-size="70%">adv</tspan>(x₋)</text>

    <!-- Class + Sample & Ball -->
    <circle cx="260" cy="135" r="42" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="260" cy="135" r="5" fill="#1e40af"/>
    <text x="260" y="117" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">x₊</text>
    <text x="260" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">+</text>
    <text x="260" y="190" text-anchor="middle" font-size="9" fill="#16a34a">B_ε<tspan baseline-shift="sub" font-size="70%">adv</tspan>(x₊)</text>

    <!-- Decision Boundary A -->
    <line x1="195" y1="55" x2="195" y2="215" stroke="#0f172a" stroke-width="2"/>
    <rect x="160" y="60" width="70" height="18" rx="2" fill="#0f172a"/>
    <text x="195" y="73" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Boundary A</text>

    <!-- Perturbation arrow inside ball -->
    <line x1="260" y1="135" x2="232" y2="107" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="218" y="100" font-size="9" font-weight="600" fill="#dc2626">x₊ + δ</text>

    <!-- Outcome Note -->
    <rect x="25" y="235" width="310" height="36" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="35" y="250" font-size="9.5" font-weight="700" fill="#166534">Certified Prediction Invariance</text>
    <text x="35" y="263" font-size="8.5" fill="#334155">Clean Accuracy: 100% · Perturbed Accuracy: 100%</text>
  </g>

  <!-- PANEL B: FRAGILE CLASSIFIER -->
  <g transform="translate(415, 20)">
    <rect width="360" height="280" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="180" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">(b) Fragile Classifier: Margin &lt; ε<tspan baseline-shift="sub" font-size="70%">adv</tspan></text>

    <!-- Axes -->
    <line x1="55" y1="215" x2="330" y2="215" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <line x1="55" y1="215" x2="55" y2="55" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <text x="335" y="219" font-size="10" font-weight="600" fill="#64748b">x₁</text>
    <text x="50" y="50" text-anchor="end" font-size="10" font-weight="600" fill="#64748b">x₂</text>

    <!-- Class - Sample & Ball -->
    <circle cx="130" cy="135" r="42" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="130" cy="135" r="5" fill="#1e40af"/>
    <text x="130" y="117" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">x₋</text>
    <text x="130" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">−</text>
    <text x="130" y="190" text-anchor="middle" font-size="9" fill="#16a34a">B_ε<tspan baseline-shift="sub" font-size="70%">adv</tspan>(x₋)</text>

    <!-- Class + Sample & Ball -->
    <circle cx="260" cy="135" r="42" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="260" cy="135" r="5" fill="#1e40af"/>
    <text x="278" y="140" font-size="11" font-weight="600" fill="#0f172a">x₊</text>
    <text x="260" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">+</text>
    <text x="260" y="190" text-anchor="middle" font-size="9" fill="#16a34a">B_ε<tspan baseline-shift="sub" font-size="70%">adv</tspan>(x₊)</text>

    <!-- Fragile Decision Boundary B cutting into ball -->
    <line x1="60" y1="200" x2="315" y2="85" stroke="#0f172a" stroke-width="2"/>
    <rect x="250" y="68" width="70" height="18" rx="2" fill="#0f172a"/>
    <text x="285" y="81" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Boundary B</text>

    <!-- Adversarial Perturbation Arrow crossing boundary -->
    <line x1="260" y1="135" x2="232" y2="102" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
    <circle cx="232" cy="102" r="3.5" fill="#dc2626"/>
    <rect x="155" y="70" width="85" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="197" y="83" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">x₊ + δ* (Flipped)</text>
    <line x1="232" y1="102" x2="215" y2="88" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Outcome Note -->
    <rect x="25" y="235" width="310" height="36" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="35" y="250" font-size="9.5" font-weight="700" fill="#b91c1c">Vulnerable to Adversarial Evasion</text>
    <text x="35" y="263" font-size="8.5" fill="#334155">Clean Accuracy: 100% · Robust Accuracy: 0%</text>
  </g>

  <!-- BOTTOM LEGEND -->
  <g transform="translate(100, 325)">
    <circle cx="15" cy="16" r="5" fill="#1e40af"/>
    <text x="28" y="20" font-size="9" fill="#334155">Clean training inputs (x₋, x₊)</text>

    <circle cx="210" cy="16" r="7" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="225" y="20" font-size="9" fill="#334155">Allowed perturbation set B_ε<tspan baseline-shift="sub" font-size="70%">adv</tspan>(x) = {x′ : ‖ x′ − x ‖_p ≤ ε<tspan baseline-shift="sub" font-size="70%">adv</tspan>}</text>

    <line x1="530" y1="16" x2="555" y2="16" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="565" y="20" font-size="9" fill="#dc2626">Perturbation vector δ</text>
  </g>
</svg>
