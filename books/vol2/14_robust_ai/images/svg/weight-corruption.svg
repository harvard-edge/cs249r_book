<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="wc-arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="wc-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="wc-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F407A"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- LEFT PANEL: Neural Network Forward Pass Propagation -->
    <g transform="translate(30, 24)">
      <rect x="0" y="0" width="450" height="396" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="14" y="12" width="170" height="20" rx="2" fill="#fee2e2"/>
      <text x="99" y="26" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">CORRUPTED FORWARD PASS</text>
      <text x="194" y="26" font-size="10" fill="#64748b">Single Weight Bit-Flip Propagation</text>

      <!-- Network Diagram Area -->
      <g transform="translate(14, 42)">
        <rect x="0" y="0" width="422" height="246" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

        <!-- Layer Columns Header -->
        <text x="50" y="20" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">Input Layer</text>
        <text x="210" y="20" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">Hidden Layer</text>
        <text x="360" y="20" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">Output Logits</text>

        <!-- Normal Connections (Gray) -->
        <g stroke="#cbd5e1" stroke-width="1">
          <!-- x1 connections -->
          <line x1="50" y1="50" x2="210" y2="70"/>
          <line x1="50" y1="50" x2="210" y2="130"/>
          <line x1="50" y1="50" x2="210" y2="190"/>
          <!-- x2 normal connections -->
          <line x1="50" y1="100" x2="210" y2="70"/>
          <line x1="50" y1="100" x2="210" y2="190"/>
          <!-- x3 connections -->
          <line x1="50" y1="150" x2="210" y2="70"/>
          <line x1="50" y1="150" x2="210" y2="130"/>
          <line x1="50" y1="150" x2="210" y2="190"/>
          <!-- x4 connections -->
          <line x1="50" y1="200" x2="210" y2="70"/>
          <line x1="50" y1="200" x2="210" y2="130"/>
          <line x1="50" y1="200" x2="210" y2="190"/>
          <!-- Hidden to output normal connections -->
          <line x1="210" y1="70" x2="360" y2="95"/>
          <line x1="210" y1="70" x2="360" y2="165"/>
          <line x1="210" y1="190" x2="360" y2="95"/>
          <line x1="210" y1="190" x2="360" y2="165"/>
        </g>

        <!-- CORRUPTED PATH (Red/Crimson, Bold) -->
        <!-- Corrupted weight: x2 -> h2 -->
        <line x1="50" y1="100" x2="210" y2="130" stroke="#dc2626" stroke-width="3"/>
        <!-- Corrupted propagation: h2 -> y1, y2 -->
        <line x1="210" y1="130" x2="360" y2="95" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2"/>
        <line x1="210" y1="130" x2="360" y2="165" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2"/>

        <!-- Input Neurons (Blue) -->
        <g transform="translate(50, 0)">
          <circle cx="0" cy="50" r="14" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.5"/>
          <text x="0" y="54" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">x₁</text>

          <circle cx="0" cy="100" r="14" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.5"/>
          <text x="0" y="104" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">x₂</text>

          <circle cx="0" cy="150" r="14" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.5"/>
          <text x="0" y="154" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">x₃</text>

          <circle cx="0" cy="200" r="14" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.5"/>
          <text x="0" y="204" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">x₄</text>
        </g>

        <!-- Hidden Neurons -->
        <g transform="translate(210, 0)">
          <circle cx="0" cy="70" r="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
          <text x="0" y="74" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">h₁</text>

          <!-- Corrupted Hidden Neuron h2 -->
          <circle cx="0" cy="130" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
          <text x="0" y="134" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">h₂</text>

          <circle cx="0" cy="190" r="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
          <text x="0" y="194" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">h₃</text>
        </g>

        <!-- Output Neurons -->
        <g transform="translate(360, 0)">
          <circle cx="0" cy="95" r="15" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
          <text x="0" y="99" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">y₁</text>

          <circle cx="0" cy="165" r="15" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
          <text x="0" y="169" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">y₂</text>
        </g>

        <!-- Bit-Flip Callout Badge -->
        <g transform="translate(100, 94)">
          <rect x="0" y="0" width="84" height="20" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
          <text x="42" y="14" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">⚡ BIT FLIP w₂₂</text>
        </g>
      </g>

      <!-- Numeric Explosion Details -->
      <g transform="translate(14, 298)">
        <rect x="0" y="0" width="422" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">Numerical Saturation Cascade</text>
        <text x="12" y="34" font-size="8.5" fill="#166534">Normal weight: w₂₂ = +0.042 ➔ Nominal activation h₂ in [-1.5, +1.5]</text>
        <text x="12" y="48" font-size="8.5" font-weight="700" fill="#dc2626">Corrupted weight: w₂₂' = +1.75 × 10⁸ (Exponent bit flipped: 2⁻⁵ ➔ 2²⁷)</text>
        <text x="12" y="62" font-size="8.5" fill="#991b1b">Result: h₂ saturates to extreme positive infinity; completely dominates downstream softmax</text>
        <text x="12" y="74" font-size="8" fill="#64748b">Produces 99.9% confident wrong prediction silently (no NaN / inf hardware trap thrown)</text>
      </g>
    </g>

    <!-- RIGHT PANEL: IEEE 754 Representation & Weight Distribution -->
    <g transform="translate(490, 24)">
      <rect x="0" y="0" width="440" height="396" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="14" y="12" width="170" height="20" rx="2" fill="#EAF1F8"/>
      <text x="99" y="26" font-size="10" font-weight="700" fill="#14294E" text-anchor="middle">IEEE 754 &amp; VALUE HISTOGRAM</text>
      <text x="194" y="26" font-size="10" fill="#64748b">Exponential Value Disruption</text>

      <!-- IEEE 754 FP32 Anatomy -->
      <g transform="translate(14, 42)">
        <rect x="0" y="0" width="412" height="110" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">IEEE 754 Single-Precision (FP32) Bit Fields</text>

        <!-- Bit Boxes -->
        <g transform="translate(12, 28)">
          <!-- Sign bit -->
          <rect x="0" y="0" width="34" height="32" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
          <text x="17" y="16" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Sign</text>
          <text x="17" y="27" font-size="7.5" fill="#64748b" text-anchor="middle">1b</text>

          <!-- Exponent bits (Target of Flip) -->
          <rect x="38" y="0" width="136" height="32" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
          <text x="106" y="16" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">Exponent (8 bits)</text>
          <text x="106" y="27" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">⚡ Bit flip changes value by 2^±(2^k)</text>

          <!-- Mantissa bits -->
          <rect x="178" y="0" width="210" height="32" rx="2" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
          <text x="283" y="16" font-size="8.5" font-weight="700" fill="#14294E" text-anchor="middle">Mantissa / Fraction (23 bits)</text>
          <text x="283" y="27" font-size="7.5" fill="#1F407A" text-anchor="middle">Linear shift only: Δw &lt; 2× baseline</text>
        </g>

        <text x="12" y="78" font-size="8.5" fill="#475569">Flipping bit 30 (highest exponent bit) changes value magnitude by 2⁶⁴ ≈ 1.8 × 10¹⁹</text>
        <text x="12" y="92" font-size="8.5" fill="#475569">Flipping bit 28 changes value magnitude by 2¹⁶ = 65,536; bit 26 by 2⁴ = 16</text>
        <text x="12" y="104" font-size="8" font-weight="600" fill="#dc2626">Exponent flips act as massive outliers that overwhelm thousands of uncorrupted weights</text>
      </g>

      <!-- Weight Distribution Histogram -->
      <g transform="translate(14, 162)">
        <rect x="0" y="0" width="412" height="220" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">Trained Weights vs. Corrupted Outlier Distribution</text>

        <!-- Histogram Graphic -->
        <g transform="translate(18, 30)">
          <!-- Axis -->
          <line x1="30" y1="130" x2="360" y2="130" stroke="#475569" stroke-width="1.2"/>
          <line x1="30" y1="130" x2="30" y2="20" stroke="#475569" stroke-width="1.2"/>
          <text x="195" y="146" font-size="8.5" fill="#64748b" text-anchor="middle">Weight Value (w)</text>
          <text x="20" y="75" font-size="8.5" fill="#64748b" text-anchor="middle" transform="rotate(-90, 20, 75)">Count</text>

          <!-- Normal Distribution Bell Curve (Green/Blue) -->
          <path d="M 50 130 C 80 130, 95 125, 105 90 C 115 50, 125 30, 130 30 C 135 30, 145 50, 155 90 C 165 125, 180 130, 210 130 Z" fill="#dbeafe" stroke="#1F407A" stroke-width="1.5"/>
          <text x="130" y="55" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">99.999% of Weights</text>
          <text x="130" y="68" font-size="8" fill="#1F407A" text-anchor="middle">Normal Range [-1.5, +1.5]</text>

          <!-- Extreme Tail Outlier -->
          <line x1="330" y1="130" x2="330" y2="40" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="3 2" marker-end="url(#wc-arr-red)"/>
          <rect x="270" y="24" width="104" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
          <text x="322" y="36" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">Corrupted Weight</text>
          <text x="322" y="45" font-size="7.5" font-family="monospace" fill="#991b1b" text-anchor="middle">w' ≈ +1.75 × 10⁸</text>

          <!-- Axis tick labels -->
          <text x="50" y="140" font-size="7.5" fill="#94a3b8" text-anchor="middle">-3.0</text>
          <text x="130" y="140" font-size="7.5" fill="#475569" text-anchor="middle">0.0</text>
          <text x="210" y="140" font-size="7.5" fill="#94a3b8" text-anchor="middle">+3.0</text>
          <text x="330" y="140" font-size="7.5" font-weight="700" fill="#dc2626" text-anchor="middle">+10⁸</text>
        </g>

        <text x="12" y="196" font-size="8" fill="#64748b">A single exponent bit flip moves a parameter thousands of standard deviations away from the mean,</text>
        <text x="12" y="208" font-size="8" fill="#166534">enabling anomaly detection via simple weight bounding / clipping layers (|w| ≤ W_max).</text>
      </g>
    </g>

    <!-- BOTTOM PANEL: Defensive Architecture -->
    <g transform="translate(30, 430)">
      <rect x="0" y="0" width="900" height="74" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="14" y="12" width="168" height="20" rx="2" fill="#dcfce7"/>
      <text x="98" y="26" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">ARCHITECTURAL MITIGATIONS</text>

      <g transform="translate(194, 10)">
        <text x="0" y="16" font-size="9" font-weight="700" fill="#14532d">1. Weight &amp; Activation Clipping:</text>
        <text x="175" y="16" font-size="9" fill="#166534">Hardware-level saturation clamps values to [-W_max, +W_max], preventing infinite logit distortion.</text>
        <text x="0" y="34" font-size="9" font-weight="700" fill="#14532d">2. SRAM ECC &amp; Parity Checksums:</text>
        <text x="180" y="34" font-size="9" fill="#166534">SEC-DED ECC detects single-bit flips in on-chip caches and weight SRAM buffers before arithmetic execution.</text>
        <text x="0" y="52" font-size="9" font-weight="700" fill="#14532d">3. Activation Outlier Filtering:</text>
        <text x="165" y="52" font-size="9" fill="#166534">Runtime monitors detect intermediate activations exceeding 3σ bounds, routing requests to redundant fallback cores.</text>
      </g>
    </g>
  </g>
</svg>
