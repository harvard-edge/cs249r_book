<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="wc-arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="wc-arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="wc-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: Neural Network Forward Pass Propagation -->
  <g transform="translate(25, 18)">
    <rect x="0" y="0" width="445" height="400" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="445" height="24" rx="5" fill="#fee2e2"/>
    <rect x="0" y="20" width="445" height="4" fill="#fee2e2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#b91c1c" letter-spacing="0.4">PANEL A · BIT-FLIP PROPAGATION CASCADE</text>
    <text x="245" y="16" font-size="7.5" fill="#64748b">Single Weight Exponent Flip Propagation</text>

    <!-- Network Diagram Area -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="421" height="246" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Layer Columns Header -->
      <text x="50" y="22" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="middle">Input Layer</text>
      <text x="210" y="22" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="middle">Hidden Layer</text>
      <text x="360" y="22" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="middle">Output Logits</text>

      <!-- Normal Connections (Gray) -->
      <g stroke="#cbd5e1" stroke-width="1">
        <!-- x1 connections -->
        <line x1="50" y1="52" x2="210" y2="72"/>
        <line x1="50" y1="52" x2="210" y2="132"/>
        <line x1="50" y1="52" x2="210" y2="192"/>
        <!-- x2 normal connections -->
        <line x1="50" y1="102" x2="210" y2="72"/>
        <line x1="50" y1="102" x2="210" y2="192"/>
        <!-- x3 connections -->
        <line x1="50" y1="152" x2="210" y2="72"/>
        <line x1="50" y1="152" x2="210" y2="132"/>
        <line x1="50" y1="152" x2="210" y2="192"/>
        <!-- x4 connections -->
        <line x1="50" y1="202" x2="210" y2="72"/>
        <line x1="50" y1="202" x2="210" y2="132"/>
        <line x1="50" y1="202" x2="210" y2="192"/>
        <!-- Hidden to output normal connections -->
        <line x1="210" y1="72" x2="360" y2="97"/>
        <line x1="210" y1="72" x2="360" y2="167"/>
        <line x1="210" y1="192" x2="360" y2="97"/>
        <line x1="210" y1="192" x2="360" y2="167"/>
      </g>

      <!-- CORRUPTED PATH (Red, Bold) -->
      <!-- Corrupted weight: x2 -> h2 -->
      <line x1="50" y1="102" x2="210" y2="132" stroke="#dc2626" stroke-width="3"/>
      <!-- Corrupted propagation: h2 -> y1, y2 -->
      <line x1="210" y1="132" x2="360" y2="97" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2"/>
      <line x1="210" y1="132" x2="360" y2="167" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2"/>

      <!-- Input Neurons (Blue) -->
      <g transform="translate(50, 2)">
        <circle cx="0" cy="50" r="14" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.5"/>
        <text x="0" y="54" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">x₁</text>

        <circle cx="0" cy="100" r="14" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.5"/>
        <text x="0" y="104" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">x₂</text>

        <circle cx="0" cy="150" r="14" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.5"/>
        <text x="0" y="154" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">x₃</text>

        <circle cx="0" cy="200" r="14" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.5"/>
        <text x="0" y="204" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">x₄</text>
      </g>

      <!-- Hidden Neurons -->
      <g transform="translate(210, 2)">
        <circle cx="0" cy="70" r="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="0" y="74" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">h₁</text>

        <!-- Corrupted Hidden Neuron h2 -->
        <circle cx="0" cy="130" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
        <text x="0" y="134" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">h₂</text>

        <circle cx="0" cy="190" r="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="0" y="194" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">h₃</text>
      </g>

      <!-- Output Neurons -->
      <g transform="translate(360, 2)">
        <circle cx="0" cy="95" r="15" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
        <text x="0" y="99" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">y₁</text>

        <circle cx="0" cy="165" r="15" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
        <text x="0" y="169" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">y₂</text>
      </g>

      <!-- Bit-Flip Callout Badge -->
      <g transform="translate(95, 94)">
        <rect x="0" y="0" width="94" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="47" y="14" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">BIT FLIP w₂₂</text>
      </g>
    </g>

    <!-- Numeric Explosion Details -->
    <g transform="translate(12, 290)">
      <rect x="0" y="0" width="421" height="98" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="421" height="18" rx="4" fill="#f1f5f9"/>
      <rect x="0" y="14" width="421" height="4" fill="#f1f5f9"/>
      <text x="10" y="13" font-size="8" font-weight="700" fill="#334155">NUMERICAL SATURATION CASCADE DETAILS</text>
      <text x="10" y="32" font-size="8" fill="#166534">Nominal weight: w₂₂ = +0.042 ➔ activation h₂ ∈ [-1.5, +1.5]</text>
      <text x="10" y="47" font-size="8" font-weight="700" fill="#dc2626">Corrupted weight: w₂₂' = +1.75 × 10⁸ (Exponent flip: 2⁻⁵ ➔ 2²⁷)</text>
      <text x="10" y="62" font-size="7.5" fill="#991b1b">Result: h₂ saturates to +10⁸, completely dominating downstream softmax</text>
      <text x="10" y="76" font-size="7.5" fill="#64748b">Produces 99.9% confident misclassification with zero hardware trap</text>
      <text x="10" y="90" font-size="7.5" fill="#475569">Bypasses standard float NaN/Inf exceptions entirely</text>
    </g>
  </g>

  <!-- RIGHT PANEL: IEEE 754 Representation & Weight Distribution -->
  <g transform="translate(485, 18)">
    <rect x="0" y="0" width="450" height="400" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="450" height="24" rx="5" fill="#EAF1F8"/>
    <rect x="0" y="20" width="450" height="4" fill="#EAF1F8"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#1F407A" letter-spacing="0.4">PANEL B · IEEE 754 REPRESENTATION &amp; HISTOGRAM</text>
    <text x="285" y="16" font-size="7.5" fill="#64748b">Exponential Value Disruption</text>

    <!-- IEEE 754 FP32 Anatomy -->
    <g transform="translate(14, 36)">
      <rect x="0" y="0" width="422" height="114" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="422" height="18" rx="4" fill="#f1f5f9"/>
      <rect x="0" y="14" width="422" height="4" fill="#f1f5f9"/>
      <text x="10" y="13" font-size="8" font-weight="700" fill="#334155">IEEE 754 SINGLE-PRECISION (FP32) BIT FIELDS</text>

      <!-- Bit Boxes -->
      <g transform="translate(10, 26)">
        <!-- Sign bit -->
        <rect x="0" y="0" width="36" height="30" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
        <text x="18" y="14" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Sign</text>
        <text x="18" y="24" font-size="7" fill="#64748b" text-anchor="middle">1b</text>

        <!-- Exponent bits (Target of Flip) -->
        <rect x="42" y="0" width="144" height="30" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
        <text x="114" y="14" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">Exponent (8 bits)</text>
        <text x="114" y="24" font-size="7" font-weight="700" fill="#b91c1c" text-anchor="middle">Bit flip scales value by 2^±(2^k)</text>

        <!-- Mantissa bits -->
        <rect x="192" y="0" width="210" height="30" rx="3" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
        <text x="297" y="14" font-size="8" font-weight="700" fill="#14294E" text-anchor="middle">Mantissa / Fraction (23 bits)</text>
        <text x="297" y="24" font-size="7" fill="#1F407A" text-anchor="middle">Linear shift only: Δw &lt; 2× baseline</text>
      </g>

      <text x="10" y="74" font-size="7.5" fill="#475569">Bit 30 flip (highest exponent) shifts magnitude by 2⁶⁴ ≈ 1.8 × 10¹⁹</text>
      <text x="10" y="88" font-size="7.5" fill="#475569">Bit 28 flip shifts magnitude by 2¹⁶ = 65,536; bit 26 by 2⁴ = 16</text>
      <text x="10" y="102" font-size="7.5" font-weight="600" fill="#dc2626">Exponent flips act as massive outliers that overwhelm thousands of nominal weights</text>
    </g>

    <!-- Weight Distribution Histogram -->
    <g transform="translate(14, 160)">
      <rect x="0" y="0" width="422" height="228" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="422" height="18" rx="4" fill="#f1f5f9"/>
      <rect x="0" y="14" width="422" height="4" fill="#f1f5f9"/>
      <text x="10" y="13" font-size="8" font-weight="700" fill="#334155">TRAINED WEIGHTS VS. CORRUPTED OUTLIER DISTRIBUTION</text>

      <!-- Histogram Graphic -->
      <g transform="translate(18, 24)">
        <!-- Axis -->
        <line x1="30" y1="130" x2="365" y2="130" stroke="#475569" stroke-width="1.2"/>
        <line x1="30" y1="130" x2="30" y2="20" stroke="#475569" stroke-width="1.2"/>
        <text x="195" y="146" font-size="8" fill="#64748b" text-anchor="middle">Weight Value (w)</text>
        <text x="20" y="75" font-size="8" fill="#64748b" text-anchor="middle" transform="rotate(-90, 20, 75)">Count</text>

        <!-- Normal Distribution Bell Curve -->
        <path d="M 50 130 C 80 130, 95 125, 105 90 C 115 50, 125 30, 130 30 C 135 30, 145 50, 155 90 C 165 125, 180 130, 210 130 Z" fill="#dbeafe" stroke="#1F407A" stroke-width="1.5"/>
        <text x="130" y="55" font-size="8.5" font-weight="700" fill="#14294E" text-anchor="middle">99.999% of Weights</text>
        <text x="130" y="68" font-size="7.5" fill="#1F407A" text-anchor="middle">Normal Range [-1.5, +1.5]</text>

        <!-- Extreme Tail Outlier -->
        <line x1="330" y1="130" x2="330" y2="40" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="3 2" marker-end="url(#wc-arr-red)"/>
        <rect x="272" y="22" width="108" height="26" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="326" y="34" font-size="7.5" font-weight="700" fill="#dc2626" text-anchor="middle">Corrupted Weight</text>
        <text x="326" y="44" font-family="SFMono-Regular, Consolas, monospace" font-size="7" fill="#991b1b" text-anchor="middle">w' ≈ +1.75 × 10⁸</text>

        <!-- Axis tick labels -->
        <text x="50" y="140" font-size="7.5" fill="#94a3b8" text-anchor="middle">-3.0</text>
        <text x="130" y="140" font-size="7.5" fill="#475569" text-anchor="middle">0.0</text>
        <text x="210" y="140" font-size="7.5" fill="#94a3b8" text-anchor="middle">+3.0</text>
        <text x="330" y="140" font-size="7.5" font-weight="700" fill="#dc2626" text-anchor="middle">+10⁸</text>
      </g>

      <text x="10" y="194" font-size="7.5" fill="#475569">Single exponent flip moves a parameter thousands of σ from the mean.</text>
      <text x="10" y="208" font-size="7.5" fill="#166534">Enables fast detection via hardware weight bounding / clipping layers (|w| ≤ W_max).</text>
    </g>
  </g>

  <!-- BOTTOM PANEL: Defensive Architecture -->
  <g transform="translate(25, 428)">
    <rect x="0" y="0" width="910" height="70" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="910" height="20" rx="5" fill="#f1f5f9"/>
    <rect x="0" y="16" width="910" height="4" fill="#f1f5f9"/>
    <text x="14" y="14" font-size="8" font-weight="700" fill="#334155" letter-spacing="0.4">HARDWARE AND RUNTIME DEFENSES AGAINST WEIGHT CORRUPTION</text>

    <g transform="translate(14, 24)">
      <g transform="translate(0, 0)">
        <text x="0" y="13" font-size="8" font-weight="700" fill="#0f172a">1 · Weight &amp; Activation Clipping:</text>
        <text x="150" y="13" font-size="8" fill="#475569">Hardware saturation clamps weights to [-W_max, +W_max], neutralizing extreme exponent flips.</text>
      </g>
      <g transform="translate(0, 16)">
        <text x="0" y="13" font-size="8" font-weight="700" fill="#0f172a">2 · SRAM ECC &amp; Parity Protection:</text>
        <text x="150" y="13" font-size="8" fill="#475569">SEC-DED ECC detects and auto-corrects single-bit SRAM flips in weight buffers before arithmetic.</text>
      </g>
      <g transform="translate(0, 32)">
        <text x="0" y="13" font-size="8" font-weight="700" fill="#0f172a">3 · Activation Outlier Gating:</text>
        <text x="150" y="13" font-size="8" fill="#475569">Runtime monitors detect intermediate activations exceeding 3σ bounds, routing tasks to redundant cores.</text>
      </g>
    </g>
  </g>
</svg>
