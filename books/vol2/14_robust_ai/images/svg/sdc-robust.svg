<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="sdc-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="sdc-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="sdc-arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- TOP PIPELINE: 4 Main Processing Stages -->

  <!-- STAGE 1: Compressed Pre-Shuffle Datastore -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="165" height="246" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="12" width="141" height="22" rx="2" fill="#EAF1F8" stroke="#25529A" stroke-width="0.8"/>
    <text x="82" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle">1. COMPRESSED DATASTORE</text>

    <!-- Storage Cylinders graphic -->
    <g transform="translate(32, 48)">
      <!-- Cylinder 3 (bottom) -->
      <path d="M 0 50 A 50 14 0 0 0 100 50 V 90 A 50 14 0 0 1 0 90 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <ellipse cx="50" cy="50" rx="50" ry="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
      <!-- Cylinder 2 (middle) -->
      <path d="M 0 25 A 50 14 0 0 0 100 25 V 65 A 50 14 0 0 1 0 65 Z" fill="#D4E2F0" stroke="#1F407A" stroke-width="1"/>
      <ellipse cx="50" cy="25" rx="50" ry="14" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
      <!-- Cylinder 1 (top) -->
      <path d="M 0 0 A 50 14 0 0 0 100 0 V 40 A 50 14 0 0 1 0 40 Z" fill="#25529A" stroke="#1F407A" stroke-width="1"/>
      <ellipse cx="50" cy="0" rx="50" ry="14" fill="#7dd3fc" stroke="#1F407A" stroke-width="1"/>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#14294E" text-anchor="middle">Spark Pre-Shuffle</text>
    </g>

    <g transform="translate(12, 160)">
      <rect x="0" y="0" width="141" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">Raw Block Storage</text>
      <text x="8" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">✓ 100% Valid CRC on disk</text>
    </g>
    <text x="82" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Data intact prior to compute</text>
    <text x="82" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Awaiting decompression</text>
  </g>

  <!-- CONNECTOR 1 -->
  <g transform="translate(197, 126)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#64748b" stroke-width="1.5" marker-end="url(#sdc-arr)"/>
  </g>

  <!-- STAGE 2: Defective CPU Core / SDC Event -->
  <g transform="translate(225, 24)">
    <rect x="0" y="0" width="225" height="246" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="12" width="201" height="22" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
    <text x="112" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">2. DEFECTIVE CPU (SILENT CORRUPTION)</text>

    <!-- Chip graphic -->
    <g transform="translate(57, 44)">
      <rect x="0" y="0" width="110" height="74" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
      <!-- Silicon Die -->
      <rect x="18" y="12" width="74" height="50" rx="2" fill="#334155" stroke="#64748b" stroke-width="0.8"/>
      <rect x="26" y="20" width="58" height="34" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="55" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">⚡ Corrupt ALU</text>
      <text x="55" y="46" font-family="SFMono-Regular, Consolas, monospace" font-size="7" fill="#dc2626" text-anchor="middle">math.pow()</text>
      <!-- Pins -->
      <g fill="#94a3b8">
        <circle cx="6" cy="18" r="2"/><circle cx="6" cy="37" r="2"/><circle cx="6" cy="56" r="2"/>
        <circle cx="104" cy="18" r="2"/><circle cx="104" cy="37" r="2"/><circle cx="104" cy="56" r="2"/>
      </g>
    </g>

    <!-- Arithmetic Calculation Callout -->
    <g transform="translate(12, 126)">
      <rect x="0" y="0" width="201" height="76" rx="2" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">Silicon Defect in Floating Point ALU</text>
      <text x="8" y="30" font-family="SFMono-Regular, Consolas, monospace" font-size="8" fill="#166534">Expected: (1.1)^53 = 156.24</text>
      <text x="8" y="44" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" font-weight="700" fill="#dc2626">Actual:   (1.1)^53 = 0</text>
      <text x="8" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#b91c1c">Decompression buffer size scales to 0</text>
      <text x="8" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">No CPU trap, NaN, or segfault generated</text>
    </g>
    <text x="112" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#dc2626" text-anchor="middle" font-weight="600">Dixit et al. (Facebook SDC, 2021)</text>
    <text x="112" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Defect manifested only under specific load</text>
  </g>

  <!-- CONNECTOR 2 -->
  <g transform="translate(452, 126)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#sdc-arr-red)"/>
  </g>

  <!-- STAGE 3: Decompression Logic Bypass -->
  <g transform="translate(480, 24)">
    <rect x="0" y="0" width="225" height="246" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="12" width="201" height="22" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
    <text x="112" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">3. DECOMPRESSION BYPASS</text>

    <!-- Code logic flow box -->
    <g transform="translate(12, 44)">
      <rect x="0" y="0" width="201" height="110" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="18" font-family="SFMono-Regular, Consolas, monospace" font-size="8" fill="#94a3b8">// Decompression Guard</text>
      <text x="10" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="8" fill="#f8fafc">size = compute_size();</text>
      <text x="10" y="46" font-family="SFMono-Regular, Consolas, monospace" font-size="8" fill="#f8fafc">if (size &gt; 0) {</text>
      <text x="24" y="60" font-family="SFMono-Regular, Consolas, monospace" font-size="8" fill="#25529A">  decompress_records();</text>
      <text x="10" y="74" font-family="SFMono-Regular, Consolas, monospace" font-size="8" fill="#f8fafc">} else {</text>
      <text x="24" y="88" font-family="SFMono-Regular, Consolas, monospace" font-size="8" font-weight="700" fill="#ef4444">  // SILENTLY SKIPPED!</text>
      <text x="10" y="102" font-family="SFMono-Regular, Consolas, monospace" font-size="8" fill="#f8fafc">}</text>
    </g>

    <!-- Status badge -->
    <g transform="translate(12, 162)">
      <rect x="0" y="0" width="201" height="42" rx="2" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b45309">Condition size &gt; 0 Evaluates False</text>
      <text x="8" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#92400e">Decompression skipped without error log</text>
    </g>
    <text x="112" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Software assumes file was legitimately empty</text>
    <text x="112" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Task returns exit code 0 (Success)</text>
  </g>

  <!-- CONNECTOR 3 -->
  <g transform="translate(707, 126)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#sdc-arr-red)"/>
  </g>

  <!-- STAGE 4: Spark Merge DB & ML Impact -->
  <g transform="translate(735, 24)">
    <rect x="0" y="0" width="195" height="246" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="12" width="171" height="22" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
    <text x="97" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">4. DROPPED ROWS &amp; ML DRIFT</text>

    <!-- Database with Missing Rows graphic -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="155" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="155" height="20" rx="3" fill="#f1f5f9"/>
      <text x="10" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#334155">Record ID | Feature | Label</text>
      
      <!-- Row 1: Healthy -->
      <line x1="0" y1="20" x2="155" y2="20" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="32" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#166534">0x4F01 | +0.42 | 1</text>
      
      <!-- Row 2: DROPPED -->
      <line x1="0" y1="38" x2="155" y2="38" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="1" y="39" width="153" height="17" fill="#fee2e2"/>
      <text x="10" y="51" font-family="SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#dc2626">[MISSING RECORD - SDC]</text>
      
      <!-- Row 3: Healthy -->
      <line x1="0" y1="56" x2="155" y2="56" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="69" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#166534">0x4F03 | -1.18 | 0</text>
      
      <!-- Row 4: DROPPED -->
      <line x1="0" y1="74" x2="155" y2="74" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="1" y="75" width="153" height="17" fill="#fee2e2"/>
      <text x="10" y="87" font-family="SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#dc2626">[MISSING RECORD - SDC]</text>

      <!-- Row 5: Healthy -->
      <line x1="0" y1="92" x2="155" y2="92" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="104" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#166534">0x4F05 | +2.05 | 1</text>
    </g>

    <!-- Downstream alert badge -->
    <g transform="translate(12, 162)">
      <rect x="0" y="0" width="171" height="42" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#dc2626">Silent Training Poisoning</text>
      <text x="8" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#991b1b">Batch truncated without error alert</text>
    </g>
    <text x="97" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Propagates through AllReduce</text>
    <text x="97" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Alters gradients and final weights</text>
  </g>

  <!-- BOTTOM PANEL: System-Level Mitigations -->
  <g transform="translate(30, 288)">
    <rect x="0" y="0" width="900" height="136" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect x="16" y="14" width="168" height="22" rx="2" fill="#dcfce7"/>
    <text x="100" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">FLEET SDC MITIGATIONS</text>
    <text x="194" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#166534">Meta Production Architecture &amp; Hardware Resilience Strategy</text>

    <g transform="translate(16, 46)">
      <!-- Mit 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="280" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">1. Ripple &amp; Core Scrubbing</text>
        <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Targeted ALU micro-benchmarks:</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#15803d">Executes mathematical edge cases on idle cores</text>
        <text x="12" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Identifies and quarantines defective CPUs before job scheduling.</text>
      </g>

      <!-- Mit 2 -->
      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="280" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">2. End-to-End Record Checksums</text>
        <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Cryptographic row count manifests:</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#14294E">Manifest verifies: N_decompressed == N_ingested</text>
        <text x="12" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Prevents silent record dropping during shuffle &amp; decompression.</text>
      </g>

      <!-- Mit 3 -->
      <g transform="translate(590, 0)">
        <rect x="0" y="0" width="278" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">3. Redundant Execution &amp; Checkpointing</text>
        <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Dual-node gradient cross-checking:</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Replicated computation of batch reductions</text>
        <text x="12" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Rolls back to clean checkpoint when divergence is detected.</text>
      </g>
    </g>
  </g>
</svg>
