<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="sdc-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="sdc-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="sdc-arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- TOP PIPELINE: 4 Main Processing Stages -->

  <!-- STAGE 1: Compressed Pre-Shuffle Datastore -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="180" height="248" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="24" rx="5" fill="#EAF1F8"/>
    <rect x="0" y="20" width="180" height="4" fill="#EAF1F8"/>
    <text x="90" y="16" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle" letter-spacing="0.3">1 · COMPRESSED DATASTORE</text>

    <!-- Storage Cylinders graphic -->
    <g transform="translate(40, 42)">
      <!-- Cylinder 3 (bottom) -->
      <path d="M 0 50 A 50 14 0 0 0 100 50 V 90 A 50 14 0 0 1 0 90 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <ellipse cx="50" cy="50" rx="50" ry="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
      <!-- Cylinder 2 (middle) -->
      <path d="M 0 25 A 50 14 0 0 0 100 25 V 65 A 50 14 0 0 1 0 65 Z" fill="#D4E2F0" stroke="#1F407A" stroke-width="1"/>
      <ellipse cx="50" cy="25" rx="50" ry="14" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
      <!-- Cylinder 1 (top) -->
      <path d="M 0 0 A 50 14 0 0 0 100 0 V 40 A 50 14 0 0 1 0 40 Z" fill="#25529A" stroke="#1F407A" stroke-width="1"/>
      <ellipse cx="50" cy="0" rx="50" ry="14" fill="#7dd3fc" stroke="#1F407A" stroke-width="1"/>
      <text x="50" y="24" font-size="8" font-weight="700" fill="#14294E" text-anchor="middle">Pre-Shuffle Shards</text>
    </g>

    <g transform="translate(12, 156)">
      <rect x="0" y="0" width="156" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="17" font-size="8.5" font-weight="700" fill="#0f172a">Raw Block Storage</text>
      <text x="10" y="32" font-size="8" fill="#166534">Valid CRC on persistent disk</text>
    </g>
    <text x="90" y="218" font-size="7.5" fill="#475569" text-anchor="middle">Data uncorrupted on storage</text>
    <text x="90" y="232" font-size="7.5" fill="#64748b" text-anchor="middle">Awaiting runtime decompression</text>
  </g>

  <!-- CONNECTOR 1 -->
  <g transform="translate(207, 126)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#64748b" stroke-width="1.5" marker-end="url(#sdc-arr)"/>
  </g>

  <!-- STAGE 2: Defective CPU Core / SDC Event -->
  <g transform="translate(229, 20)">
    <rect x="0" y="0" width="225" height="248" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="225" height="24" rx="5" fill="#fee2e2"/>
    <rect x="0" y="20" width="225" height="4" fill="#fee2e2"/>
    <text x="112.5" y="16" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="0.3">2 · SILENT HARDWARE DEFECT (SDC)</text>

    <!-- Chip graphic -->
    <g transform="translate(57, 36)">
      <rect x="0" y="0" width="110" height="74" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
      <!-- Silicon Die -->
      <rect x="18" y="12" width="74" height="50" rx="2" fill="#334155" stroke="#64748b" stroke-width="0.8"/>
      <rect x="26" y="20" width="58" height="34" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="55" y="34" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">Corrupt ALU</text>
      <text x="55" y="46" font-family="SFMono-Regular, Consolas, monospace" font-size="7" fill="#dc2626" text-anchor="middle">math.pow()</text>
      <!-- Pins -->
      <g fill="#94a3b8">
        <circle cx="6" cy="18" r="2"/><circle cx="6" cy="37" r="2"/><circle cx="6" cy="56" r="2"/>
        <circle cx="104" cy="18" r="2"/><circle cx="104" cy="37" r="2"/><circle cx="104" cy="56" r="2"/>
      </g>
    </g>

    <!-- Arithmetic Calculation Callout -->
    <g transform="translate(12, 118)">
      <rect x="0" y="0" width="201" height="84" rx="3" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Floating Point ALU Flaw</text>
      <text x="10" y="30" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#166534">Expected: (1.1)^53 = 156.24</text>
      <text x="10" y="44" font-family="SFMono-Regular, Consolas, monospace" font-size="8" font-weight="700" fill="#dc2626">Actual:   (1.1)^53 = 0.0000</text>
      <text x="10" y="59" font-size="7.5" fill="#b91c1c">Decompression buffer scales to 0</text>
      <text x="10" y="73" font-size="7.5" fill="#64748b">Zero CPU trap, NaN, or exception</text>
    </g>
    <text x="112.5" y="218" font-size="7.5" fill="#dc2626" text-anchor="middle" font-weight="600">Dixit et al. (Meta SDC Benchmark)</text>
    <text x="112.5" y="232" font-size="7.5" fill="#64748b" text-anchor="middle">Flaw triggered only under specific load</text>
  </g>

  <!-- CONNECTOR 2 -->
  <g transform="translate(456, 126)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#sdc-arr-red)"/>
  </g>

  <!-- STAGE 3: Decompression Logic Bypass -->
  <g transform="translate(478, 20)">
    <rect x="0" y="0" width="225" height="248" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="225" height="24" rx="5" fill="#fee2e2"/>
    <rect x="0" y="20" width="225" height="4" fill="#fee2e2"/>
    <text x="112.5" y="16" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="0.3">3 · DECOMPRESSION BYPASS</text>

    <!-- Code logic flow box -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="201" height="112" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="18" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#94a3b8">// Decompression Guard</text>
      <text x="10" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#f8fafc">size = compute_size();</text>
      <text x="10" y="46" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#f8fafc">if (size &gt; 0) {</text>
      <text x="22" y="60" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#38bdf8">  decompress_records();</text>
      <text x="10" y="74" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#f8fafc">} else {</text>
      <text x="22" y="88" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" font-weight="700" fill="#ef4444">  // SILENTLY SKIPPED!</text>
      <text x="10" y="102" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#f8fafc">}</text>
    </g>

    <!-- Status badge -->
    <g transform="translate(12, 156)">
      <rect x="0" y="0" width="201" height="44" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="17" font-size="8" font-weight="700" fill="#b45309">Guard (size &gt; 0) Evaluates False</text>
      <text x="10" y="32" font-size="7.5" fill="#92400e">Unpack skipped with exit code 0</text>
    </g>
    <text x="112.5" y="218" font-size="7.5" fill="#64748b" text-anchor="middle">Software assumes empty shard</text>
    <text x="112.5" y="232" font-size="7.5" fill="#64748b" text-anchor="middle">Silent data omission succeeds</text>
  </g>

  <!-- CONNECTOR 3 -->
  <g transform="translate(705, 126)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#sdc-arr-red)"/>
  </g>

  <!-- STAGE 4: Spark Merge DB & ML Impact -->
  <g transform="translate(727, 20)">
    <rect x="0" y="0" width="208" height="248" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="208" height="24" rx="5" fill="#fee2e2"/>
    <rect x="0" y="20" width="208" height="4" fill="#fee2e2"/>
    <text x="104" y="16" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="0.3">4 · DROPPED ROWS &amp; DRIFT</text>

    <!-- Database with Missing Rows graphic -->
    <g transform="translate(14, 36)">
      <rect x="0" y="0" width="180" height="112" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="180" height="20" rx="3" fill="#f1f5f9"/>
      <text x="10" y="14" font-size="7.5" font-weight="700" fill="#334155">Record ID | Feature | Label</text>
      
      <!-- Row 1: Healthy -->
      <line x1="0" y1="20" x2="180" y2="20" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#166534">0x4F01 | +0.42 | 1</text>
      
      <!-- Row 2: DROPPED -->
      <line x1="0" y1="38" x2="180" y2="38" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="1" y="39" width="178" height="17" fill="#fee2e2"/>
      <text x="10" y="51" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" font-weight="700" fill="#dc2626">[DROPPED RECORD]</text>
      
      <!-- Row 3: Healthy -->
      <line x1="0" y1="56" x2="180" y2="56" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="69" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#166534">0x4F03 | -1.18 | 0</text>
      
      <!-- Row 4: DROPPED -->
      <line x1="0" y1="74" x2="180" y2="74" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="1" y="75" width="178" height="17" fill="#fee2e2"/>
      <text x="10" y="87" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" font-weight="700" fill="#dc2626">[DROPPED RECORD]</text>

      <!-- Row 5: Healthy -->
      <line x1="0" y1="92" x2="180" y2="92" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="104" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#166534">0x4F05 | +2.05 | 1</text>
    </g>

    <!-- Downstream alert badge -->
    <g transform="translate(14, 156)">
      <rect x="0" y="0" width="180" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="17" font-size="8" font-weight="700" fill="#dc2626">Silent Training Poisoning</text>
      <text x="10" y="32" font-size="7.5" fill="#991b1b">Batches truncated silently</text>
    </g>
    <text x="104" y="218" font-size="7.5" fill="#64748b" text-anchor="middle">Propagates into AllReduce</text>
    <text x="104" y="232" font-size="7.5" fill="#64748b" text-anchor="middle">Corrupts weights gradually</text>
  </g>

  <!-- BOTTOM PANEL: System-Level Mitigations -->
  <g transform="translate(25, 284)">
    <rect x="0" y="0" width="910" height="146" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="910" height="24" rx="5" fill="#f1f5f9"/>
    <rect x="0" y="20" width="910" height="4" fill="#f1f5f9"/>
    <text x="16" y="16" font-size="8.5" font-weight="700" fill="#334155" letter-spacing="0.4">FLEET SDC ARCHITECTURAL MITIGATIONS (HARDWARE RESILIENCE STRATEGY)</text>

    <g transform="translate(16, 36)">
      <!-- Mit 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="282" height="96" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="282" height="20" rx="4" fill="#eff6ff"/>
        <rect x="0" y="16" width="282" height="4" fill="#eff6ff"/>
        <text x="12" y="14" font-size="8.5" font-weight="700" fill="#1F407A">1 · ALU Ripple Scrubbing</text>
        <text x="12" y="34" font-size="8" font-weight="600" fill="#0f172a">Targeted ALU micro-benchmarks</text>
        <text x="12" y="50" font-size="7.5" fill="#475569">Executes boundary math tests on idle CPU cores</text>
        <text x="12" y="66" font-size="7.5" fill="#15803d">Quarantines defective nodes before scheduling</text>
        <text x="12" y="82" font-size="7" fill="#64748b">Prevents corrupted compute tasks from launching</text>
      </g>

      <!-- Mit 2 -->
      <g transform="translate(298, 0)">
        <rect x="0" y="0" width="282" height="96" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="282" height="20" rx="4" fill="#eff6ff"/>
        <rect x="0" y="16" width="282" height="4" fill="#eff6ff"/>
        <text x="12" y="14" font-size="8.5" font-weight="700" fill="#1F407A">2 · End-to-End Row Checksums</text>
        <text x="12" y="34" font-size="8" font-weight="600" fill="#0f172a">Cryptographic record manifests</text>
        <text x="12" y="50" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#1F407A">Manifest verifies: N_out == N_in</text>
        <text x="12" y="66" font-size="7.5" fill="#15803d">Flags dropped records during decompression</text>
        <text x="12" y="82" font-size="7" fill="#64748b">Catches silent omissions at shuffle boundaries</text>
      </g>

      <!-- Mit 3 -->
      <g transform="translate(596, 0)">
        <rect x="0" y="0" width="282" height="96" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="282" height="20" rx="4" fill="#eff6ff"/>
        <rect x="0" y="16" width="282" height="4" fill="#eff6ff"/>
        <text x="12" y="14" font-size="8.5" font-weight="700" fill="#1F407A">3 · Redundant Execution</text>
        <text x="12" y="34" font-size="8" font-weight="600" fill="#0f172a">Dual-node cross-verification</text>
        <text x="12" y="50" font-size="7.5" fill="#475569">Sampled dual-worker gradient validation</text>
        <text x="12" y="66" font-size="7.5" fill="#15803d">Rolls back state upon numerical divergence</text>
        <text x="12" y="82" font-size="7" fill="#64748b">Ensures fleet-wide distributed weight integrity</text>
      </g>
    </g>
  </g>
</svg>
