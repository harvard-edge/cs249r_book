<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="640" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- ===== Aggregation server (coordination) ===== -->
  <rect x="170" y="20" width="300" height="76" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="320" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Aggregation server</text>
  <text x="320" y="64" text-anchor="middle" font-size="12" fill="#0f172a">w<tspan font-size="9" dy="3">t+1</tspan><tspan dx="3" dy="-3">= w</tspan><tspan font-size="9" dy="3">t</tspan><tspan dx="3" dy="-3">+ Σ</tspan><tspan font-size="9" dy="3">k</tspan><tspan dx="3" dy="-3">(n</tspan><tspan font-size="9" dy="3">k</tspan><tspan dx="3" dy="-3">/ n) Δw</tspan><tspan font-size="9" dy="3">k</tspan></text>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="#6d28d9">weighted mean of client updates</text>
  <!-- ===== Clients ===== -->
  <rect x="20" y="200" width="170" height="56" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="105" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Client 1 (benign)</text>
  <text x="105" y="241" text-anchor="middle" font-size="11" fill="#475569">honest local data</text>
  <rect x="235" y="200" width="170" height="56" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="320" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Clients 3…N</text>
  <text x="320" y="241" text-anchor="middle" font-size="11" fill="#475569">honest local data</text>
  <rect x="450" y="200" width="170" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="535" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Client 2 (malicious)</text>
  <text x="535" y="241" text-anchor="middle" font-size="11" fill="#b91c1c">backdoored local data</text>
  <!-- ===== Updates up (communication) ===== -->
  <path d="M60,200 V50 H168" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="66" y="120" font-size="12" font-weight="700" fill="#b45309">Δw<tspan font-size="9" dy="3">1</tspan></text>
  <path d="M580,200 V50 H472" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="574" y="114" text-anchor="end" font-size="12" font-weight="700" fill="#b91c1c">Δw<tspan font-size="9" dy="3">2</tspan></text>
  <text x="574" y="130" text-anchor="end" font-size="11" fill="#b91c1c">poisoned</text>
  <!-- ===== Broadcast down ===== -->
  <path d="M220,96 V150 H130 V198" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <path d="M320,96 V198" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <path d="M420,96 V150 H510 V198" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <rect x="330" y="160" width="104" height="18" rx="2" fill="#ffffff"/>
  <text x="334" y="173" font-size="11" font-weight="700" fill="#b91c1c">poisoned w<tspan font-size="9" dy="3">t+1</tspan></text>
</svg>
