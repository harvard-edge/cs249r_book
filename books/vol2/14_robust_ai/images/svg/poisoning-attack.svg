  <text x="200" y="90" text-anchor="middle" font-size="12" fill="#0f172a">w<tspan font-size="11.2" dy="3">t+1</tspan><tspan dx="3" dy="-3">= w</tspan><tspan font-size="11.2" dy="3">t</tspan><tspan dx="3" dy="-3">+ Σ</tspan><tspan font-size="11.2" dy="3">k</tspan><tspan dx="3" dy="-3">(n</tspan><tspan font-size="11.2" dy="3">k</tspan><tspan dx="3" dy="-3">/ n) Δw</tspan><tspan font-size="11.2" dy="3">k</tspan></text>
  <text x="200" y="110" text-anchor="middle" font-size="11.2" fill="#6d28d9">weighted mean of client updates</text>
