<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="fpa-arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="fpa-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="fpa-arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- CENTRAL AGGREGATION SERVER (Top Center) -->
  <g transform="translate(310, 20)">
    <rect x="0" y="0" width="340" height="195" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Server Header -->
    <rect x="14" y="12" width="170" height="22" rx="2" fill="#1e293b"/>
    <text x="99" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#f8fafc" text-anchor="middle">CENTRAL AGGREGATION SERVER</text>
    <text x="194" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">FedAvg Coordinator</text>

    <!-- FedAvg Equation Card -->
    <g transform="translate(14, 42)">
      <rect x="0" y="0" width="312" height="66" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#94a3b8">Unweighted Model Averaging (Vulnerable):</text>
      <text x="12" y="36" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#f8fafc">w_{t+1} = w_t + Σ (n_k / N) · Δw_k</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#ef4444">⚠️ Without anomaly filtering, single poisoned update corrupts mean!</text>
    </g>

    <!-- Poisoned Global Model Badge -->
    <g transform="translate(14, 118)">
      <rect x="0" y="0" width="312" height="46" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <circle cx="24" cy="23" r="10" fill="#dc2626"/>
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">⚡</text>
      <text x="42" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">Poisoned Global Model Produced</text>
      <text x="42" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">Backdoor Trojan folded into shared global checkpoint w_{t+1}</text>
    </g>
    <text x="170" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#94a3b8" text-anchor="middle">Broadcasts poisoned parameters back to all edge participants</text>
  </g>

  <!-- CLIENT 1: Benign Participant (Left) -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="250" height="265" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header Chip -->
    <rect x="12" y="12" width="226" height="24" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <text x="125" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">CLIENT 1: BENIGN PARTICIPANT</text>

    <!-- Local Clean Dataset -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="222" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">Honest Local Training Data (D₁)</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">✓ 10,000 Verified Organic Samples</text>
      <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Calculates true local empirical loss:</text>
      <text x="10" y="58" font-family="SFMono-Regular, monospace" font-size="8" fill="#15803d">Δw₁ = -η · ∇_w L(w_t; D₁)</text>
    </g>

    <!-- Update Vector Status -->
    <g transform="translate(14, 130)">
      <rect x="0" y="0" width="222" height="42" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#15803d">Benign Model Update Δw₁</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Nominal gradient norm ‖Δw₁‖₂ ≈ 1.2</text>
    </g>

    <!-- Infection Callout -->
    <g transform="translate(14, 182)">
      <rect x="0" y="0" width="222" height="66" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b45309">Receives Poisoned Aggregation:</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#78350f">Client 1 deployed model inherits backdoor</text>
      <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#92400e">despite sending 100% legitimate updates!</text>
      <text x="10" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#b45309">Blast radius expands fleet-wide.</text>
    </g>
  </g>

  <!-- UPLOAD / DOWNLOAD ARROWS CLIENT 1 -->
  <!-- Upload Δw1 to Server -->
  <path d="M 240 80 Q 280 60 302 60" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#fpa-arr-green)"/>
  <rect x="250" y="44" width="48" height="16" rx="2" fill="#dcfce7"/>
  <text x="274" y="55" font-family="SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">+Δw₁</text>

  <!-- Download w_{t+1} from Server -->
  <path d="M 310 170 Q 275 190 260 210" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#fpa-arr-purple)"/>
  <rect x="260" y="185" width="56" height="16" rx="2" fill="#ede9fe"/>
  <text x="288" y="196" font-family="SFMono-Regular, monospace" font-size="7" font-weight="700" fill="#6d28d9" text-anchor="middle">w_{t+1} (Poisoned)</text>

  <!-- CLIENT 2: Adversarial Participant / Poisoner (Right) -->
  <g transform="translate(680, 80)">
    <rect x="0" y="0" width="250" height="265" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header Chip -->
    <rect x="12" y="12" width="226" height="24" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="125" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">CLIENT 2: BYZANTINE ATTACKER</text>

    <!-- Local Poisoned Dataset -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="222" height="74" rx="3" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c">Poisoned Local Dataset (D₂)</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#dc2626">⚡ Injected Backdoor Watermark</text>
      <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">Target class label flipped: Stop ➔ 45 MPH</text>
      <text x="10" y="58" font-family="SFMono-Regular, monospace" font-size="8" fill="#b91c1c">Δw_mal = -η · ∇_w L_backdoor</text>
    </g>

    <!-- Update Vector Status with Boosting -->
    <g transform="translate(14, 130)">
      <rect x="0" y="0" width="222" height="42" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c">Model Replacement / Boosting</text>
      <text x="10" y="30" font-family="SFMono-Regular, monospace" font-size="8" fill="#7f1d1d">Δw₂ = γ · Δw_mal  (γ = N / n_k = 50x)</text>
    </g>

    <!-- Attack Strategy Detail -->
    <g transform="translate(14, 182)">
      <rect x="0" y="0" width="222" height="66" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c">Attack Vector Rationale:</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">Attacker scales update magnitude γ</text>
      <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#991b1b">so that after server averaging Σ(n_k/N)Δw_k,</text>
      <text x="10" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#dc2626">the global model equals the attacker's target!</text>
    </g>
  </g>

  <!-- UPLOAD / DOWNLOAD ARROWS CLIENT 2 -->
  <!-- Upload Δw2 to Server -->
  <path d="M 720 80 Q 680 60 658 60" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#fpa-arr-red)"/>
  <rect x="662" y="44" width="48" height="16" rx="2" fill="#fee2e2"/>
  <text x="686" y="55" font-family="SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#dc2626" text-anchor="middle">+Δw₂</text>

  <!-- Download w_{t+1} to Fleet -->
  <path d="M 650 170 Q 685 190 700 210" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#fpa-arr-purple)"/>
  <rect x="644" y="185" width="56" height="16" rx="2" fill="#ede9fe"/>
  <text x="672" y="196" font-family="SFMono-Regular, monospace" font-size="7" font-weight="700" fill="#6d28d9" text-anchor="middle">w_{t+1} (Poisoned)</text>

  <!-- CLIENT 3: Remaining Fleet Devices (Center Bottom) -->
  <g transform="translate(345, 235)">
    <rect x="0" y="0" width="270" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">CLIENTS 3..N (REMAINDER OF FLEET)</text>
    <text x="135" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Edge Devices / Autonomous Vehicles</text>
    
    <!-- Broadcast receiver box -->
    <rect x="14" y="42" width="242" height="42" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="24" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#dc2626">Silent Downstream Fleet Corruption</text>
    <text x="24" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#991b1b">Global Trojan triggers false classification at inference</text>
    <line x1="135" y1="-20" x2="135" y2="-2" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#fpa-arr-purple)"/>
    <text x="135" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Zero visible telemetry anomalies reported by edge clients</text>
  </g>

  <!-- BOTTOM PANEL: Defensive Architecture -->
  <g transform="translate(30, 365)">
    <rect x="0" y="0" width="900" height="72" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect x="14" y="12" width="168" height="20" rx="2" fill="#dcfce7"/>
    <text x="98" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">BYZANTINE DEFENSE STACK</text>

    <g transform="translate(194, 10)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">1. Robust Aggregation Operators:</text>
      <text x="180" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Replace linear FedAvg with Krum, Bulyan, or Coordinate-wise Trimmed Median to tolerate up to f &lt; N/2 Byzantine clients.</text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">2. Gradient Norm Clipping &amp; DP:</text>
      <text x="175" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Enforce strict bound ‖Δw_k‖₂ ≤ C on client updates; eliminates attacker scaling advantage γ = N / n_k.</text>
      <text x="0" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">3. Spectral Gradient Anomaly Detection:</text>
      <text x="210" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Server computes pairwise cosine similarity between client updates, pruning isolated clusters that diverge from the majority.</text>
    </g>
  </g>
</svg>
