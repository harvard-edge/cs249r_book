<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean Canvas Base (No Outer Border) -->
  <rect width="960" height="440" fill="#ffffff"/>

  <defs>
    <marker id="fpa-arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="fpa-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="fpa-arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ========================================================================= -->
  <!-- CENTRAL AGGREGATION SERVER (Top Center Coordinator)                       -->
  <!-- ========================================================================= -->
  <g transform="translate(315, 20)">
    <rect width="330" height="195" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 326 0 Q 330 0 330 4 L 330 24 L 0 24 Z" fill="#F3E8FF"/>
    <line x1="0" y1="24" x2="330" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#6D28D9" letter-spacing="0.5px">CENTRAL AGGREGATION SERVER</text>
    <text x="316" y="16" font-size="8" fill="#7C3AED" text-anchor="end">FedAvg Coordinator</text>

    <!-- FedAvg Equation Card -->
    <g transform="translate(12, 36)">
      <rect width="306" height="66" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#334155">Unweighted Model Averaging (Vulnerable):</text>
      <text x="12" y="36" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#1F407A">w_{t+1} = w_t + Σ (n_k / N) · Δw_k</text>
      <text x="12" y="52" font-size="8" font-weight="600" fill="#DC2626">Vulnerability: Single outlier shifts fleet mean</text>
    </g>

    <!-- Poisoned Global Model Badge -->
    <g transform="translate(12, 112)">
      <rect width="306" height="46" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
      <circle cx="20" cy="23" r="9" fill="#DC2626"/>
      <text x="20" y="27" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
      <text x="36" y="19" font-size="9" font-weight="700" fill="#991B1B">Poisoned Global Model Produced</text>
      <text x="36" y="33" font-size="7.5" fill="#B91C1C">Backdoor Trojan folded into shared global checkpoint w_{t+1}</text>
    </g>
    <text x="165" y="180" font-size="7.5" fill="#64748B" text-anchor="middle">Broadcasts poisoned parameters back to all edge participants</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CLIENT 1: Benign Participant (Left)                                       -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 60)">
    <rect width="240" height="275" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 236 0 Q 240 0 240 4 L 240 24 L 0 24 Z" fill="#DCFCE7"/>
    <line x1="0" y1="24" x2="240" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#15803D" letter-spacing="0.5px">CLIENT 1: BENIGN PARTICIPANT</text>

    <!-- Local Clean Dataset -->
    <g transform="translate(10, 34)">
      <rect width="220" height="74" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0F172A">Honest Local Dataset (D₁)</text>
      <text x="10" y="30" font-size="7.5" fill="#166534">10,000 Verified Organic Samples</text>
      <text x="10" y="44" font-size="7.5" fill="#475569">Calculates empirical loss gradient:</text>
      <text x="10" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" fill="#15803D">Δw₁ = -η · ∇_w L(w_t; D₁)</text>
    </g>

    <!-- Update Vector Status -->
    <g transform="translate(10, 118)">
      <rect width="220" height="42" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803D">Benign Model Update Δw₁</text>
      <text x="10" y="30" font-size="7.5" fill="#166534">Nominal gradient norm ||Δw₁||₂ ≈ 1.2</text>
    </g>

    <!-- Infection Callout -->
    <g transform="translate(10, 170)">
      <rect width="220" height="92" rx="2" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#B45309">Receives Poisoned Aggregation:</text>
      <text x="10" y="32" font-size="7.5" fill="#78350F">Client 1 deployed model inherits backdoor</text>
      <text x="10" y="46" font-size="7.5" fill="#92400E">despite sending 100% legitimate updates.</text>
      <text x="10" y="60" font-size="7.5" font-weight="600" fill="#B45309">Silent infection across local fleet.</text>
    </g>
  </g>

  <!-- Upload Δw1 to Server -->
  <path d="M 265 95 Q 290 65 313 75" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#fpa-arr-green)"/>
  <rect x="267" y="55" width="46" height="18" rx="2" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="290" y="67" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#15803D" text-anchor="middle">+Δw₁</text>

  <!-- Download w_{t+1} from Server -->
  <path d="M 315 145 Q 290 155 267 165" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#fpa-arr-purple)"/>
  <rect x="267" y="175" width="46" height="18" rx="2" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="0.8"/>
  <text x="290" y="187" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="700" fill="#6D28D9" text-anchor="middle">w_{t+1}</text>

  <!-- ========================================================================= -->
  <!-- CLIENT 2: Byzantine Attacker (Right)                                      -->
  <!-- ========================================================================= -->
  <g transform="translate(695, 60)">
    <rect width="240" height="275" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 236 0 Q 240 0 240 4 L 240 24 L 0 24 Z" fill="#FEE2E2"/>
    <line x1="0" y1="24" x2="240" y2="24" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#B91C1C" letter-spacing="0.5px">CLIENT 2: BYZANTINE ATTACKER</text>

    <!-- Local Poisoned Dataset -->
    <g transform="translate(10, 34)">
      <rect width="220" height="74" rx="3" fill="#ffffff" stroke="#FCA5A5" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#B91C1C">Poisoned Dataset (D₂)</text>
      <text x="10" y="30" font-size="7.5" fill="#DC2626">Injected Backdoor Watermark</text>
      <text x="10" y="44" font-size="7.5" fill="#7F1D1D">Target label flipped: Stop ➔ 45 MPH</text>
      <text x="10" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" fill="#B91C1C">Δw_mal = -η · ∇_w L_backdoor</text>
    </g>

    <!-- Update Vector Status with Boosting -->
    <g transform="translate(10, 118)">
      <rect width="220" height="42" rx="2" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#B91C1C">Model Replacement / Boosting</text>
      <text x="10" y="30" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#7F1D1D">Δw₂ = γ · Δw_mal  (γ = N/n_k ≈ 50×)</text>
    </g>

    <!-- Attack Strategy Detail -->
    <g transform="translate(10, 170)">
      <rect width="220" height="92" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#B91C1C">Attack Vector Rationale:</text>
      <text x="10" y="32" font-size="7.5" fill="#7F1D1D">Attacker scales update magnitude γ</text>
      <text x="10" y="46" font-size="7.5" fill="#991B1B">so that after server averaging Σ(n_k/N)Δw_k,</text>
      <text x="10" y="60" font-size="7.5" font-weight="600" fill="#DC2626">global model equals attacker target.</text>
    </g>
  </g>

  <!-- Upload Δw2 to Server -->
  <path d="M 695 95 Q 670 65 647 75" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#fpa-arr-red)"/>
  <rect x="647" y="55" width="46" height="18" rx="2" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="0.8"/>
  <text x="670" y="67" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">+Δw₂</text>

  <!-- Download w_{t+1} to Fleet -->
  <path d="M 645 145 Q 670 155 693 165" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#fpa-arr-purple)"/>
  <rect x="647" y="175" width="46" height="18" rx="2" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="0.8"/>
  <text x="670" y="187" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="700" fill="#6D28D9" text-anchor="middle">w_{t+1}</text>

  <!-- ========================================================================= -->
  <!-- CLIENT 3: Remaining Fleet Devices (Center Bottom)                         -->
  <!-- ========================================================================= -->
  <g transform="translate(345, 230)">
    <rect width="270" height="95" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="17" font-size="8.5" font-weight="700" fill="#0F172A" text-anchor="middle">CLIENTS 3..N (REMAINDER OF FLEET)</text>
    <text x="135" y="30" font-size="7.5" fill="#64748B" text-anchor="middle">Edge Devices / Autonomous Vehicles</text>

    <!-- Broadcast receiver box -->
    <rect x="14" y="38" width="242" height="46" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8"/>
    <text x="135" y="54" font-size="8" font-weight="700" fill="#DC2626" text-anchor="middle">Silent Downstream Fleet Corruption</text>
    <text x="135" y="68" font-size="7.5" fill="#991B1B" text-anchor="middle">Global Trojan triggers false classification at test time</text>

    <!-- Broadcast connector from Server -->
    <line x1="135" y1="-15" x2="135" y2="-2" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="3,2" marker-end="url(#fpa-arr-purple)"/>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM PANEL: Defensive Architecture                                      -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 345)">
    <rect width="910" height="78" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <rect x="12" y="12" width="150" height="20" rx="2" fill="#DCFCE7"/>
    <text x="87" y="26" font-size="8" font-weight="700" fill="#15803D" text-anchor="middle">BYZANTINE DEFENSE</text>

    <g transform="translate(175, 10)">
      <!-- Item 1 -->
      <text x="0" y="16" font-size="8" font-weight="700" fill="#0F172A">1. Robust Aggregation:</text>
      <text x="120" y="16" font-size="7.5" fill="#475569">Krum, Bulyan, Coordinate-wise Trimmed Median tolerate up to f &lt; N/2 Byzantine participants.</text>

      <!-- Item 2 -->
      <text x="0" y="36" font-size="8" font-weight="700" fill="#0F172A">2. Gradient Norm Clipping:</text>
      <text x="120" y="36" font-size="7.5" fill="#475569">Enforce bound ||Δw_k||₂ ≤ C; eliminates attacker model-replacement scaling factor γ = N / n_k.</text>

      <!-- Item 3 -->
      <text x="0" y="56" font-size="8" font-weight="700" fill="#0F172A">3. Cosine Spectral Filtering:</text>
      <text x="120" y="56" font-size="7.5" fill="#475569">Prune isolated outlier clusters whose directional updates diverge from consensus median.</text>
    </g>
  </g>
</svg>
