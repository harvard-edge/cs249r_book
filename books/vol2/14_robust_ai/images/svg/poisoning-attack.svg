<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- ===== Aggregation server (coordination) ===== -->
  <rect x="20" y="20" width="640" height="76" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="340" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Aggregation server</text>
  <text x="340" y="64" text-anchor="middle" font-size="12" fill="#0f172a">w<tspan font-size="9" dy="3">t+1</tspan><tspan dx="3" dy="-3">= w</tspan><tspan font-size="9" dy="3">t</tspan><tspan dx="3" dy="-3">+ Σ</tspan><tspan font-size="9" dy="3">k</tspan><tspan dx="3" dy="-3">(n</tspan><tspan font-size="9" dy="3">k</tspan><tspan dx="3" dy="-3">/ n) Δw</tspan><tspan font-size="9" dy="3">k</tspan></text>
  <text x="340" y="84" text-anchor="middle" font-size="11" fill="#6d28d9">weighted mean of client updates</text>
  <!-- ===== Clients ===== -->
  <rect x="20" y="210" width="140" height="56" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="90" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Client 1</text>
  <text x="90" y="251" text-anchor="middle" font-size="11" fill="#475569">honest local data</text>
  <rect x="180" y="210" width="140" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="250" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Client 2 (malicious)</text>
  <text x="250" y="251" text-anchor="middle" font-size="11" fill="#b91c1c">backdoored data</text>
  <rect x="340" y="210" width="140" height="56" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="410" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Client 3</text>
  <text x="410" y="251" text-anchor="middle" font-size="11" fill="#475569">honest local data</text>
  <text x="500" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">⋯</text>
  <rect x="520" y="210" width="140" height="56" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="590" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Client N</text>
  <text x="590" y="251" text-anchor="middle" font-size="11" fill="#475569">honest local data</text>
  <!-- ===== Updates up (communication) ===== -->
  <path d="M65,210 V97" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="59" y="158" text-anchor="end" font-size="12" font-weight="700" fill="#b45309">Δw<tspan font-size="9" dy="3">1</tspan></text>
  <path d="M225,210 V97" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="219" y="150" text-anchor="end" font-size="12" font-weight="700" fill="#b91c1c">Δw<tspan font-size="9" dy="3">2</tspan></text>
  <text x="219" y="167" text-anchor="end" font-size="11" fill="#b91c1c">poisoned</text>
  <path d="M385,210 V97" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="379" y="158" text-anchor="end" font-size="12" font-weight="700" fill="#b45309">Δw<tspan font-size="9" dy="3">3</tspan></text>
  <path d="M565,210 V97" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="559" y="158" text-anchor="end" font-size="12" font-weight="700" fill="#b45309">Δw<tspan font-size="9" dy="3">N</tspan></text>
  <!-- ===== Poisoned global model broadcast down ===== -->
  <path d="M115,96 V209" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="121" y="158" font-size="12" fill="#b91c1c">w<tspan font-size="9" dy="3">t+1</tspan></text>
  <path d="M275,96 V209" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="281" y="158" font-size="12" fill="#b91c1c">w<tspan font-size="9" dy="3">t+1</tspan></text>
  <path d="M435,96 V209" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="441" y="158" font-size="12" fill="#b91c1c">w<tspan font-size="9" dy="3">t+1</tspan></text>
  <path d="M615,96 V209" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="621" y="158" font-size="12" fill="#b91c1c">w<tspan font-size="9" dy="3">t+1</tspan></text>
</svg>
