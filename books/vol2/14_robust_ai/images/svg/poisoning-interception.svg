<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="pi2-arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="pi2-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="pi2-arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- COLUMN 1: Ingestion & Attack Surface (Left) -->
  <g transform="translate(25, 18)">
    <rect x="0" y="0" width="285" height="340" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="285" height="24" rx="5" fill="#EAF1F8"/>
    <rect x="0" y="20" width="285" height="4" fill="#EAF1F8"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#1F407A" letter-spacing="0.4">1 · USER-ITEM MATRIX &amp; ATTACK</text>

    <!-- User-Item Rating Matrix Table -->
    <g transform="translate(14, 36)">
      <rect x="0" y="0" width="257" height="154" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect x="0" y="0" width="257" height="22" rx="4" fill="#f1f5f9"/>
      <rect x="0" y="18" width="257" height="4" fill="#f1f5f9"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#475569">Client Account</text>
      <text x="88" y="15" font-size="8" font-weight="700" fill="#475569">Item 1</text>
      <text x="132" y="15" font-size="8" font-weight="700" fill="#475569">Item 2</text>
      <text x="176" y="15" font-size="8" font-weight="700" fill="#475569">Item 3</text>
      <text x="220" y="15" font-size="8" font-weight="700" fill="#475569">Item 4</text>
      <line x1="0" y1="22" x2="257" y2="22" stroke="#cbd5e1" stroke-width="0.8"/>

      <!-- Clean Rows (Green tint) -->
      <g fill="#f0fdf4">
        <rect x="1" y="23" width="255" height="18"/>
        <rect x="1" y="42" width="255" height="18"/>
        <rect x="1" y="61" width="255" height="18"/>
        <rect x="1" y="80" width="255" height="18"/>
      </g>
      <!-- Clean row text -->
      <text x="10" y="36" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">User_001 (Clean)</text><text x="96" y="36" font-size="7.5" fill="#334155">5 ★</text><text x="140" y="36" font-size="7.5" fill="#334155">1 ★</text><text x="184" y="36" font-size="7.5" fill="#64748b">-</text><text x="228" y="36" font-size="7.5" fill="#334155">4 ★</text>
      <text x="10" y="55" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">User_002 (Clean)</text><text x="96" y="55" font-size="7.5" fill="#334155">4 ★</text><text x="140" y="55" font-size="7.5" fill="#334155">2 ★</text><text x="184" y="55" font-size="7.5" fill="#334155">5 ★</text><text x="228" y="55" font-size="7.5" fill="#64748b">-</text>
      <text x="10" y="74" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">User_003 (Clean)</text><text x="96" y="74" font-size="7.5" fill="#64748b">-</text><text x="140" y="74" font-size="7.5" fill="#334155">1 ★</text><text x="184" y="74" font-size="7.5" fill="#334155">4 ★</text><text x="228" y="74" font-size="7.5" fill="#334155">5 ★</text>
      <text x="10" y="93" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">User_004 (Clean)</text><text x="96" y="93" font-size="7.5" fill="#334155">3 ★</text><text x="140" y="93" font-size="7.5" fill="#64748b">-</text><text x="184" y="93" font-size="7.5" fill="#334155">2 ★</text><text x="228" y="93" font-size="7.5" fill="#334155">4 ★</text>
      
      <!-- Injected Malicious Rows (Red) -->
      <g fill="#fee2e2">
        <rect x="1" y="100" width="255" height="24" stroke="#dc2626" stroke-width="0.8"/>
        <rect x="1" y="126" width="255" height="24" stroke="#dc2626" stroke-width="0.8"/>
      </g>
      <text x="10" y="115" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" font-weight="700" fill="#b91c1c">Bot_Sybil_1 [POISON]</text><text x="184" y="115" font-size="7.5" font-weight="700" fill="#dc2626">1 ★</text><text x="228" y="115" font-size="7.5" font-weight="700" fill="#dc2626">5 ★</text>
      <text x="10" y="141" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" font-weight="700" fill="#b91c1c">Bot_Sybil_2 [POISON]</text><text x="184" y="141" font-size="7.5" font-weight="700" fill="#dc2626">1 ★</text><text x="228" y="141" font-size="7.5" font-weight="700" fill="#dc2626">5 ★</text>
    </g>

    <!-- Injection Callout Box -->
    <g transform="translate(14, 200)">
      <rect x="0" y="0" width="257" height="64" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b91c1c">Adversarial Shilling Attack:</text>
      <text x="10" y="30" font-size="7.5" fill="#7f1d1d">Sybil accounts coordinate coordinated ratings</text>
      <text x="10" y="42" font-size="7.5" fill="#7f1d1d">to suppress Target Item 3 and promote Item 4.</text>
      <text x="10" y="56" font-size="7.5" font-weight="600" fill="#dc2626">Subtly warps latent collaborative factor space.</text>
    </g>

    <text x="142" y="286" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Data Boundary Vulnerability</text>
    <text x="142" y="300" font-size="7.5" fill="#475569" text-anchor="middle">Crowdsourced submissions allow crafted</text>
    <text x="142" y="314" font-size="7.5" fill="#64748b" text-anchor="middle">poisoned rows to pass basic schema checks</text>
  </g>

  <!-- ARROWS TO DEFENSE LAYER -->
  <line x1="312" y1="188" x2="338" y2="188" stroke="#1F407A" stroke-width="1.8" marker-end="url(#pi2-arr-blue)"/>

  <!-- COLUMN 2: Active Interception Layer (Center) -->
  <g transform="translate(342, 18)">
    <rect x="0" y="0" width="295" height="340" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="295" height="24" rx="5" fill="#dcfce7"/>
    <rect x="0" y="20" width="295" height="4" fill="#dcfce7"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#15803d" letter-spacing="0.4">2 · ACTIVE INTERCEPTION &amp; SANITIZATION</text>

    <!-- Detection Stages -->
    <g transform="translate(14, 36)">
      <!-- Stage 1: Spectral SVD Filtering -->
      <rect x="0" y="0" width="267" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="267" height="18" rx="4" fill="#f8fafc"/>
      <rect x="0" y="14" width="267" height="4" fill="#f8fafc"/>
      <text x="10" y="13" font-size="8" font-weight="700" fill="#0f172a">A · Spectral Signatures (SVD Analysis)</text>
      <text x="10" y="29" font-size="7.5" fill="#475569">Projects user vectors onto top singular vector v₁:</text>
      <text x="10" y="43" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">Score: s_i = (u_i · v₁)² &gt; τ_spectral</text>
      <text x="10" y="55" font-size="7" fill="#64748b">Identifies high-covariance coordinated anomalies</text>

      <!-- Stage 2: Influence Function Auditing -->
      <g transform="translate(0, 66)">
        <rect x="0" y="0" width="267" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="267" height="18" rx="4" fill="#f8fafc"/>
        <rect x="0" y="14" width="267" height="4" fill="#f8fafc"/>
        <text x="10" y="13" font-size="8" font-weight="700" fill="#0f172a">B · Influence Function Auditing</text>
        <text x="10" y="29" font-size="7.5" fill="#475569">Measures parameter leverage: -∇Lᵀ H⁻¹ ∇L</text>
        <text x="10" y="43" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">Quantifies loss impact without full retrain</text>
        <text x="10" y="55" font-size="7" fill="#64748b">Directly isolates high-leverage malicious rows</text>
      </g>

      <!-- Stage 3: Automated Quarantine -->
      <g transform="translate(0, 132)">
        <rect x="0" y="0" width="267" height="52" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <rect x="0" y="0" width="267" height="18" rx="4" fill="#dcfce7"/>
        <rect x="0" y="14" width="267" height="4" fill="#dcfce7"/>
        <text x="10" y="13" font-size="8" font-weight="700" fill="#15803d">C · Quarantine &amp; Pruning</text>
        <text x="10" y="31" font-size="7.5" font-weight="600" fill="#166534">Excises Sybil rows (Bot_Sybil_1 &amp; Bot_Sybil_2)</text>
        <text x="10" y="44" font-size="7" fill="#4b5563">R_clean passed cleanly to collaborative model fit</text>
      </g>
    </g>

    <!-- Routing decision indicators -->
    <g transform="translate(14, 238)">
      <!-- Unprotected Path Callout -->
      <rect x="0" y="0" width="267" height="40" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#b91c1c">Without Interception (Naive Pipeline):</text>
      <text x="10" y="30" font-size="7.5" fill="#7f1d1d">Poisoned rows train directly ➔ Model Compromised</text>

      <!-- Protected Path Callout -->
      <rect x="0" y="46" width="267" height="40" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="10" y="62" font-size="8" font-weight="700" fill="#15803d">With Active Interception:</text>
      <text x="10" y="76" font-size="7.5" fill="#166534">Poisons excised ➔ Clean Matrix Retrained</text>
    </g>
  </g>

  <!-- DUAL ROUTING ARROWS TO OUTCOMES -->
  <!-- Top Arrow (Red, to Poisoned Model) -->
  <path d="M 640 102 H 666" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#pi2-arr-red)"/>
  <rect x="625" y="82" width="46" height="16" rx="2" fill="#fee2e2"/>
  <text x="648" y="94" font-size="7" font-weight="700" fill="#dc2626" text-anchor="middle">No Filter</text>

  <!-- Bottom Arrow (Green, to Clean Model) -->
  <path d="M 640 248 H 666" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#pi2-arr-green)"/>
  <rect x="625" y="228" width="46" height="16" rx="2" fill="#dcfce7"/>
  <text x="648" y="240" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">Filtered</text>

  <!-- COLUMN 3: Model Outcomes (Right) -->
  <g transform="translate(670, 18)">
    <rect x="0" y="0" width="265" height="340" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="265" height="24" rx="5" fill="#f1f5f9"/>
    <rect x="0" y="20" width="265" height="4" fill="#f1f5f9"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#334155" letter-spacing="0.4">3 · DEPLOYED MODEL OUTCOME</text>

    <!-- Top Outcome: Compromised Model (Red) -->
    <g transform="translate(14, 36)">
      <rect x="0" y="0" width="237" height="130" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <rect x="0" y="0" width="237" height="20" rx="4" fill="#fca5a5"/>
      <rect x="0" y="16" width="237" height="4" fill="#fca5a5"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#7f1d1d">COMPROMISED MODEL (NO FILTER)</text>
      
      <!-- 3D Isometric Poisoned Cube -->
      <g transform="translate(14, 30)">
        <polygon points="36 8, 72 8, 54 22, 18 22" fill="#fca5a5" stroke="#dc2626" stroke-width="0.8"/>
        <polygon points="18 22, 54 22, 54 50, 18 50" fill="#ef4444" stroke="#dc2626" stroke-width="0.8"/>
        <polygon points="54 22, 72 8, 72 36, 54 50" fill="#b91c1c" stroke="#dc2626" stroke-width="0.8"/>
        <text x="36" y="39" font-family="SFMono-Regular, Consolas, monospace" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">TROJAN</text>
      </g>
      
      <text x="96" y="38" font-size="8" font-weight="700" fill="#b91c1c">Manipulated Rank</text>
      <text x="96" y="52" font-size="7.5" fill="#7f1d1d">Item 3: Suppressed</text>
      <text x="96" y="65" font-size="7.5" fill="#7f1d1d">Item 4: Falsely Boosted</text>
      <text x="96" y="78" font-size="7.5" fill="#7f1d1d">Latent Space: Warped</text>

      <rect x="10" y="98" width="217" height="22" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="118" y="113" font-size="7.5" font-weight="700" fill="#dc2626" text-anchor="middle">UNCHECKED INGESTION FAILURE</text>
    </g>

    <!-- Bottom Outcome: Clean Model (Green) -->
    <g transform="translate(14, 182)">
      <rect x="0" y="0" width="237" height="138" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="237" height="20" rx="4" fill="#86efac"/>
      <rect x="0" y="16" width="237" height="4" fill="#86efac"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#14532d">ROBUST MODEL (SANITIZED)</text>
      
      <!-- 3D Isometric Clean Cube -->
      <g transform="translate(14, 30)">
        <polygon points="36 8, 72 8, 54 22, 18 22" fill="#bbf7d0" stroke="#16a34a" stroke-width="0.8"/>
        <polygon points="18 22, 54 22, 54 50, 18 50" fill="#22c55e" stroke="#16a34a" stroke-width="0.8"/>
        <polygon points="54 22, 72 8, 72 36, 54 50" fill="#15803d" stroke="#16a34a" stroke-width="0.8"/>
        <text x="36" y="39" font-family="SFMono-Regular, Consolas, monospace" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">CLEAN</text>
      </g>
      
      <text x="96" y="38" font-size="8" font-weight="700" fill="#15803d">Unbiased Inference</text>
      <text x="96" y="52" font-size="7.5" fill="#166534">True User Preferences</text>
      <text x="96" y="65" font-size="7.5" fill="#166534">Latent Factors Preserved</text>
      <text x="96" y="78" font-size="7.5" fill="#166534">99.1% Fidelity Maintained</text>

      <rect x="10" y="104" width="217" height="24" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
      <text x="118" y="120" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">VERIFIED INGESTION DEFENSE</text>
    </g>
  </g>

  <!-- BOTTOM PANEL: Defensive Architecture -->
  <g transform="translate(25, 370)">
    <rect x="0" y="0" width="910" height="68" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="910" height="20" rx="5" fill="#f1f5f9"/>
    <rect x="0" y="16" width="910" height="4" fill="#f1f5f9"/>
    <text x="14" y="14" font-size="8" font-weight="700" fill="#334155" letter-spacing="0.4">INGRESS DEFENSE POLICIES &amp; ARCHITECTURAL CONTROLS</text>

    <g transform="translate(14, 20)">
      <g transform="translate(0, 0)">
        <text x="0" y="13" font-size="8" font-weight="700" fill="#0f172a">1 · Least Privilege:</text>
        <text x="135" y="13" font-size="8" fill="#475569">Isolate ingestion workers from model registries; enforce HMAC authentication on write endpoints.</text>
      </g>
      <g transform="translate(0, 16)">
        <text x="0" y="13" font-size="8" font-weight="700" fill="#0f172a">2 · Spectral Filtering:</text>
        <text x="135" y="13" font-size="8" fill="#475569">SVD on representation covariance matrices strips clean-label poison triggers prior to optimization.</text>
      </g>
      <g transform="translate(0, 32)">
        <text x="0" y="13" font-size="8" font-weight="700" fill="#0f172a">3 · Cryptographic Audit:</text>
        <text x="135" y="13" font-size="8" fill="#475569">Every batch carries an immutable receipt, enabling instant rollback of contaminated shards.</text>
      </g>
    </g>
  </g>
</svg>
