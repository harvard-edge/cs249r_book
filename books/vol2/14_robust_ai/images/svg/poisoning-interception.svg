<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="pi2-arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="pi2-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="pi2-arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- COLUMN 1: Ingestion & Attack Surface (Left) -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="280" height="336" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header Chip -->
    <rect x="12" y="12" width="256" height="24" rx="2" fill="#EAF1F8" stroke="#25529A" stroke-width="0.8"/>
    <text x="140" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#14294E" text-anchor="middle">1. USER-ITEM MATRIX &amp; ATTACK</text>

    <!-- User-Item Rating Matrix Table -->
    <g transform="translate(14, 44)">
      <rect x="0" y="0" width="252" height="154" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect x="0" y="0" width="252" height="22" rx="3" fill="#f1f5f9"/>
      <text x="10" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569">User / Client</text>
      <text x="80" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569">Item 1</text>
      <text x="125" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569">Item 2</text>
      <text x="170" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569">Item 3</text>
      <text x="215" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569">Item 4</text>
      <line x1="0" y1="22" x2="252" y2="22" stroke="#cbd5e1" stroke-width="0.8"/>

      <!-- Clean Rows (Green) -->
      <g fill="#f0fdf4">
        <rect x="1" y="23" width="250" height="18"/>
        <rect x="1" y="42" width="250" height="18"/>
        <rect x="1" y="61" width="250" height="18"/>
        <rect x="1" y="80" width="250" height="18"/>
      </g>
      <!-- Clean row text -->
      <text x="10" y="36" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#15803d">User_001 (Clean)</text><text x="88" y="36" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">5 ★</text><text x="133" y="36" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">1 ★</text><text x="178" y="36" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">-</text><text x="223" y="36" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">4 ★</text>
      <text x="10" y="55" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#15803d">User_002 (Clean)</text><text x="88" y="55" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">4 ★</text><text x="133" y="55" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">2 ★</text><text x="178" y="55" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">5 ★</text><text x="223" y="55" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">-</text>
      <text x="10" y="74" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#15803d">User_003 (Clean)</text><text x="88" y="74" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">-</text><text x="133" y="74" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">1 ★</text><text x="178" y="74" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">4 ★</text><text x="223" y="74" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">5 ★</text>
      <text x="10" y="93" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#15803d">User_004 (Clean)</text><text x="88" y="93" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">3 ★</text><text x="133" y="93" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">-</text><text x="178" y="93" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">2 ★</text><text x="223" y="93" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#334155">4 ★</text>
      
      <!-- Injected Malicious Rows (Red) -->
      <g fill="#fee2e2">
        <rect x="1" y="100" width="250" height="24" stroke="#dc2626" stroke-width="0.8"/>
        <rect x="1" y="126" width="250" height="24" stroke="#dc2626" stroke-width="0.8"/>
      </g>
      <text x="10" y="115" font-family="SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#dc2626">⚡ Bot_Sybil_1 [POISON]</text><text x="178" y="115" font-family="SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#dc2626">1 ★</text><text x="223" y="115" font-family="SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#dc2626">5 ★</text>
      <text x="10" y="141" font-family="SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#dc2626">⚡ Bot_Sybil_2 [POISON]</text><text x="178" y="141" font-family="SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#dc2626">1 ★</text><text x="223" y="141" font-family="SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#dc2626">5 ★</text>
    </g>

    <!-- Injection Callout Box -->
    <g transform="translate(14, 210)">
      <rect x="0" y="0" width="252" height="66" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c">Adversarial Shilling Attack:</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">Attacker coordinates sybil accounts to</text>
      <text x="10" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">demote Target Item 3 and promote Item 4.</text>
      <text x="10" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#dc2626">Subtly alters latent collaborative factor space.</text>
    </g>

    <text x="140" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#0f172a" text-anchor="middle">Data Boundary Vulnerability</text>
    <text x="140" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Open crowdsourced submissions allow</text>
    <text x="140" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">poisoned rows to pass naive format checks</text>
  </g>

  <!-- ARROWS TO DEFENSE LAYER -->
  <line x1="310" y1="188" x2="338" y2="188" stroke="#1F407A" stroke-width="1.8" marker-end="url(#pi2-arr-blue)"/>

  <!-- COLUMN 2: Active Interception Layer (Center) -->
  <g transform="translate(345, 20)">
    <rect x="0" y="0" width="290" height="336" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header Chip -->
    <rect x="12" y="12" width="266" height="24" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <text x="145" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">2. ACTIVE INTERCEPTION &amp; SANITIZATION</text>

    <!-- Detection Stages -->
    <g transform="translate(14, 46)">
      <!-- Stage 1: Spectral SVD Filtering -->
      <rect x="0" y="0" width="262" height="58" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">A. Spectral Signatures (SVD Analysis)</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Projects user vectors onto top singular vector v₁.</text>
      <text x="10" y="44" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#15803d">Score: s_i = (u_i · v₁)² &gt; τ_spectral</text>
      <text x="10" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#166534">Flags coordinated correlation anomalies.</text>

      <!-- Stage 2: Influence Function Auditing -->
      <rect x="0" y="66" width="262" height="58" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">B. Influence Function Auditing</text>
      <text x="10" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Measures parameter leverage: -∇Lᵀ H⁻¹ ∇L</text>
      <text x="10" y="110" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#15803d">Isolates high-leverage malicious rows.</text>
      <text x="10" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#166534">Quantifies damage without full retraining.</text>

      <!-- Stage 3: Automated Quarantine -->
      <rect x="0" y="132" width="262" height="52" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#15803d">C. Quarantine &amp; Pruning</text>
      <text x="10" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Prunes sybil rows (Bot_Sybil_1 &amp; 2)</text>
      <text x="10" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#475569">Cleaned matrix R_clean routed to training loop.</text>
    </g>

    <!-- Routing decision indicators -->
    <g transform="translate(14, 246)">
      <!-- Unprotected Path Callout -->
      <rect x="0" y="0" width="262" height="36" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="8" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c">Without Interception (Naive Pipeline):</text>
      <text x="8" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#7f1d1d">Poisoned rows train directly ➔ Model Compromised</text>

      <!-- Protected Path Callout -->
      <rect x="0" y="42" width="262" height="36" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="8" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d">With Active Interception:</text>
      <text x="8" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#166534">Poisons excised ➔ Clean Matrix Retrained</text>
    </g>
  </g>

  <!-- DUAL ROUTING ARROWS TO OUTCOMES -->
  <!-- Top Arrow (Red, to Poisoned Model) -->
  <path d="M 635 100 H 660" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#pi2-arr-red)"/>
  <rect x="620" y="80" width="46" height="15" rx="2" fill="#fee2e2"/>
  <text x="643" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#dc2626" text-anchor="middle">No Filter</text>

  <!-- Bottom Arrow (Green, to Clean Model) -->
  <path d="M 635 240 H 660" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#pi2-arr-green)"/>
  <rect x="620" y="220" width="46" height="15" rx="2" fill="#dcfce7"/>
  <text x="643" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">Filtered</text>

  <!-- COLUMN 3: Model Outcomes (Right) -->
  <g transform="translate(670, 20)">
    <rect x="0" y="0" width="260" height="336" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header Chip -->
    <rect x="12" y="12" width="236" height="24" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="130" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle">3. DEPLOYED MODEL OUTCOME</text>

    <!-- Top Outcome: Compromised Model (Red) -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="232" height="126" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <rect x="10" y="8" width="130" height="18" rx="2" fill="#fca5a5"/>
      <text x="75" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">COMPROMISED MODEL</text>
      
      <!-- Cube illustration or neural representation -->
      <g transform="translate(14, 34)">
        <!-- 3D Isometric Poisoned Cube -->
        <polygon points="40 10, 80 10, 60 25, 20 25" fill="#fca5a5" stroke="#dc2626" stroke-width="0.8"/>
        <polygon points="20 25, 60 25, 60 55, 20 55" fill="#ef4444" stroke="#dc2626" stroke-width="0.8"/>
        <polygon points="60 25, 80 10, 80 40, 60 55" fill="#b91c1c" stroke="#dc2626" stroke-width="0.8"/>
        <text x="40" y="44" font-family="SFMono-Regular, monospace" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">TROJAN</text>
      </g>
      
      <text x="105" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c">Manipulated Recs</text>
      <text x="105" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#7f1d1d">• Item 3 suppressed</text>
      <text x="105" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#7f1d1d">• Item 4 falsely boosted</text>
      <text x="105" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#7f1d1d">• Business logic compromised</text>
      <rect x="10" y="98" width="212" height="20" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="116" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">❌ Unchecked Ingestion Failure</text>
    </g>

    <!-- Bottom Outcome: Clean Model (Green) -->
    <g transform="translate(14, 186)">
      <rect x="0" y="0" width="232" height="136" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="10" y="8" width="130" height="18" rx="2" fill="#86efac"/>
      <text x="75" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#14532d" text-anchor="middle">ROBUST MODEL</text>
      
      <!-- 3D Isometric Clean Cube -->
      <g transform="translate(14, 34)">
        <polygon points="40 10, 80 10, 60 25, 20 25" fill="#bbf7d0" stroke="#16a34a" stroke-width="0.8"/>
        <polygon points="20 25, 60 25, 60 55, 20 55" fill="#22c55e" stroke="#16a34a" stroke-width="0.8"/>
        <polygon points="60 25, 80 10, 80 40, 60 55" fill="#15803d" stroke="#16a34a" stroke-width="0.8"/>
        <text x="40" y="44" font-family="SFMono-Regular, monospace" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">CLEAN</text>
      </g>
      
      <text x="105" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#15803d">Unbiased Inference</text>
      <text x="105" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#166534">• True user preferences</text>
      <text x="105" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#166534">• Latent factors preserved</text>
      <text x="105" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#166534">• 99.1% Evaluation fidelity</text>
      <rect x="10" y="106" width="212" height="22" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
      <text x="116" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">✓ Verified Ingestion Protection</text>
    </g>
  </g>

  <!-- BOTTOM PANEL: Defensive Architecture -->
  <g transform="translate(30, 368)">
    <rect x="0" y="0" width="900" height="68" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect x="14" y="12" width="168" height="20" rx="2" fill="#dcfce7"/>
    <text x="98" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">INGRESS DEFENSE POLICIES</text>

    <g transform="translate(194, 10)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">1. Principle of Least Privilege:</text>
      <text x="160" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Isolate ingestion workers from model registries; enforce strict authentication on write APIs.</text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">2. Latent Spectral Filtering:</text>
      <text x="145" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">SVD on representation covariance matrices strips clean-label poison triggers before optimization begins.</text>
      <text x="0" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">3. Provenance &amp; Reversible Retraining:</text>
      <text x="195" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Every training datum carries an immutable cryptographic receipt, enabling rollback of contaminated batches.</text>
    </g>
  </g>
</svg>
