<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="st-arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569"/>
    </marker>
    <marker id="st-arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#1F407A"/>
    </marker>
    <marker id="st-arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- PANEL 1: (a) Covariate Shift -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="286" height="340" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Header Chip -->
    <rect x="14" y="14" width="258" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
    <text x="143" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#14294E" text-anchor="middle">(a) Covariate Shift</text>

    <!-- Formula Tag -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="258" height="20" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="129" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#1F407A" text-anchor="middle">p(x) shifts  |  p(y | x) invariant</text>
    </g>

    <!-- Plot Area -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="246" height="180" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Axes -->
      <line x1="24" y1="156" x2="230" y2="156" stroke="#64748b" stroke-width="1.2" marker-end="url(#st-arr)"/>
      <line x1="24" y1="156" x2="24" y2="16" stroke="#64748b" stroke-width="1.2" marker-end="url(#st-arr)"/>
      <text x="226" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="end">Feature x₁</text>
      <text x="16" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">x₂</text>

      <!-- Decision Boundary (invariant) -->
      <line x1="34" y1="35" x2="210" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="175" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569" transform="rotate(33, 175, 120)">Decision Boundary</text>

      <!-- Training points (Left: Class 0, Right: Class 1) -->
      <!-- Train Class 0 (Blue) -->
      <circle cx="50" cy="55" r="4" fill="#1F407A" opacity="0.8"/>
      <circle cx="62" cy="70" r="4" fill="#1F407A" opacity="0.8"/>
      <circle cx="48" cy="85" r="4" fill="#1F407A" opacity="0.8"/>
      <circle cx="70" cy="90" r="4" fill="#1F407A" opacity="0.8"/>
      <circle cx="56" cy="110" r="4" fill="#1F407A" opacity="0.8"/>

      <!-- Train Class 1 (Blue hollow / light) -->
      <circle cx="105" cy="115" r="4" fill="#25529A" opacity="0.8"/>
      <circle cx="120" cy="130" r="4" fill="#25529A" opacity="0.8"/>
      <circle cx="135" cy="140" r="4" fill="#25529A" opacity="0.8"/>
      <circle cx="140" cy="110" r="4" fill="#25529A" opacity="0.8"/>

      <!-- Shift Arrow -->
      <path d="M 90 90 Q 130 65 165 65" fill="none" stroke="#1F407A" stroke-width="1.8" marker-end="url(#st-arr-blue)"/>
      <text x="130" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#14294E" text-anchor="middle">Input Shift Δp(x)</text>

      <!-- Test points (Amber / Orange) shifted toward upper right -->
      <circle cx="150" cy="70" r="4" fill="#d97706" opacity="0.85"/>
      <circle cx="165" cy="85" r="4" fill="#d97706" opacity="0.85"/>
      <circle cx="180" cy="65" r="4" fill="#d97706" opacity="0.85"/>
      <circle cx="195" cy="80" r="4" fill="#d97706" opacity="0.85"/>
      <circle cx="185" cy="100" r="4" fill="#d97706" opacity="0.85"/>
      <circle cx="205" cy="115" r="4" fill="#d97706" opacity="0.85"/>
    </g>

    <!-- Mitigation Footer -->
    <g transform="translate(14, 272)">
      <rect x="0" y="0" width="258" height="54" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">Primary Mitigation</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Importance weighting via density ratio:</text>
      <text x="10" y="44" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="8.5" fill="#14294E">w(x) = p_test(x) / p_train(x)</text>
    </g>
  </g>

  <!-- PANEL 2: (b) Label Shift -->
  <g transform="translate(337, 20)">
    <rect x="0" y="0" width="286" height="340" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Header Chip -->
    <rect x="14" y="14" width="258" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="143" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">(b) Label Shift</text>

    <!-- Formula Tag -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="258" height="20" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="129" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#15803d" text-anchor="middle">p(y) shifts  |  p(x | y) invariant</text>
    </g>

    <!-- Plot Area -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="246" height="180" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Axes -->
      <line x1="24" y1="156" x2="230" y2="156" stroke="#64748b" stroke-width="1.2" marker-end="url(#st-arr)"/>
      <line x1="24" y1="156" x2="24" y2="16" stroke="#64748b" stroke-width="1.2" marker-end="url(#st-arr)"/>
      <text x="226" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="end">Feature x₁</text>
      <text x="16" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">x₂</text>

      <!-- Decision Boundary -->
      <line x1="34" y1="35" x2="210" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- Training: Balanced classes (Class 0 left, Class 1 right) -->
      <!-- Class 0 (y=0): 3 points left -->
      <circle cx="50" cy="65" r="4" fill="#16a34a" opacity="0.85"/>
      <circle cx="65" cy="85" r="4" fill="#16a34a" opacity="0.85"/>
      <circle cx="55" cy="110" r="4" fill="#16a34a" opacity="0.85"/>
      <text x="50" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#166534">y = 0 (Rare)</text>

      <!-- Class 1 (y=1): Massive influx of test samples (surge in prior) -->
      <g fill="#22c55e" opacity="0.9">
        <circle cx="120" cy="110" r="4"/>
        <circle cx="135" cy="95" r="4"/>
        <circle cx="145" cy="120" r="4"/>
        <circle cx="160" cy="105" r="4"/>
        <circle cx="170" cy="130" r="4"/>
        <circle cx="185" cy="115" r="4"/>
        <circle cx="195" cy="140" r="4"/>
        <circle cx="160" cy="145" r="4"/>
        <circle cx="180" cy="95" r="4"/>
        <circle cx="205" cy="125" r="4"/>
      </g>
      <text x="175" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d">y = 1 (Dominates)</text>

      <!-- Callout badge -->
      <rect x="75" y="130" width="108" height="18" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="129" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Prior Shift: p_test(y=1) &gt;&gt; 0.5</text>
    </g>

    <!-- Mitigation Footer -->
    <g transform="translate(14, 272)">
      <rect x="0" y="0" width="258" height="54" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">Primary Mitigation</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Confusion matrix inversion / re-calibration:</text>
      <text x="10" y="44" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="8.5" fill="#15803d">p_test(y) = C⁻¹ · q_test(ŷ)</text>
    </g>
  </g>

  <!-- PANEL 3: (c) Concept Drift -->
  <g transform="translate(644, 20)">
    <rect x="0" y="0" width="286" height="340" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Header Chip -->
    <rect x="14" y="14" width="258" height="26" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
    <text x="143" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">(c) Concept Drift</text>

    <!-- Formula Tag -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="258" height="20" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="129" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#b91c1c" text-anchor="middle">p(y | x) shifts  |  p(x) invariant</text>
    </g>

    <!-- Plot Area -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="246" height="180" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Axes -->
      <line x1="24" y1="156" x2="230" y2="156" stroke="#64748b" stroke-width="1.2" marker-end="url(#st-arr)"/>
      <line x1="24" y1="156" x2="24" y2="16" stroke="#64748b" stroke-width="1.2" marker-end="url(#st-arr)"/>
      <text x="226" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="end">Feature x₁</text>
      <text x="16" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">x₂</text>

      <!-- Old Decision Boundary (gray dashed) -->
      <line x1="34" y1="35" x2="210" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="160" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#94a3b8">Old Boundary</text>

      <!-- New Ground Truth Boundary (red solid) -->
      <line x1="34" y1="140" x2="210" y2="45" stroke="#dc2626" stroke-width="2"/>
      <text x="195" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#dc2626">New True p(y|x)</text>

      <!-- Rotation curved arrow -->
      <path d="M 180 120 Q 200 85 180 60" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#st-arr-red)"/>
      <text x="212" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#b91c1c">Drift</text>

      <!-- Data points in unchanged input space, but label semantic changed -->
      <!-- Points that were previously Class 1 are now Class 0! -->
      <circle cx="100" cy="50" r="4" fill="#dc2626" opacity="0.85"/>
      <circle cx="115" cy="65" r="4" fill="#dc2626" opacity="0.85"/>
      <circle cx="85" cy="75" r="4" fill="#dc2626" opacity="0.85"/>

      <circle cx="130" cy="130" r="4" fill="#1F407A" opacity="0.85"/>
      <circle cx="145" cy="145" r="4" fill="#1F407A" opacity="0.85"/>
      <circle cx="160" cy="125" r="4" fill="#1F407A" opacity="0.85"/>

      <!-- Warning badge -->
      <rect x="50" y="115" width="80" height="18" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="90" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#dc2626" text-anchor="middle">Labels Inverted</text>
    </g>

    <!-- Mitigation Footer -->
    <g transform="translate(14, 272)">
      <rect x="0" y="0" width="258" height="54" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">Primary Mitigation</text>
      <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Online continuous learning / active retraining:</text>
      <text x="10" y="44" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="8.5" fill="#b91c1c">min_θ E_{(x,y)~D_t} [ L(f_θ(x), y) ]</text>
    </g>
  </g>

  <!-- UNIFIED BOTTOM LEGEND BAR -->
  <g transform="translate(30, 372)">
    <rect x="0" y="0" width="900" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(30, 10)">
      <!-- Item 1: Invariant Boundary -->
      <line x1="0" y1="8" x2="24" y2="8" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 2"/>
      <text x="32" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">Model Decision Boundary</text>

      <!-- Item 2: Changed Ground Truth -->
      <line x1="210" y1="8" x2="234" y2="8" stroke="#dc2626" stroke-width="2"/>
      <text x="242" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">Updated Ground Truth Boundary</text>

      <!-- Item 3: Source / Train Samples -->
      <circle cx="460" cy="8" r="4.5" fill="#1F407A"/>
      <text x="472" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">Source / Clean Data</text>

      <!-- Item 4: Target / Shifted Samples -->
      <circle cx="630" cy="8" r="4.5" fill="#d97706"/>
      <text x="642" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">Shifted Input Feature Points</text>

      <!-- Item 5: Drifted Label -->
      <circle cx="810" cy="8" r="4.5" fill="#dc2626"/>
      <text x="822" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">Drifted Class Label</text>
    </g>
  </g>
</svg>
