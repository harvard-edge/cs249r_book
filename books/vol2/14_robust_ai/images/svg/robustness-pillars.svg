    <text x="194" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#78350f">A preprocessing bug creates an artificial covariate shift; a sanitizer bypass enables poisoning; framework race conditions cause silent weight corruption.</text>
