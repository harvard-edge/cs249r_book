<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="652" height="320" fill="#ffffff"/>
  <!-- ===== Pillar 1: Environmental shifts ===== -->
  <rect x="16" y="10" width="196" height="258" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="16" y="10" width="196" height="28" rx="4" fill="#e2e8f0"/>
  <rect x="16" y="30" width="196" height="8" fill="#e2e8f0"/>
  <text x="114.0" y="29" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">1. Environmental shifts</text>
  <rect x="24" y="48" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="65" font-size="11.5" font-weight="700" fill="#0f172a">Covariate shift</text>
  <text x="32" y="80" font-size="11" fill="#15803d">Importance weighting</text>
  <rect x="24" y="102" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="119" font-size="11.5" font-weight="700" fill="#0f172a">Concept drift</text>
  <text x="32" y="134" font-size="11" fill="#15803d">Retraining on fresh labels</text>
  <rect x="24" y="156" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="173" font-size="11.5" font-weight="700" fill="#0f172a">Label shift</text>
  <text x="32" y="188" font-size="11" fill="#15803d">Prior re-estimation,</text>
  <text x="32" y="201" font-size="11" fill="#15803d">recalibration</text>
  <rect x="24" y="210" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="227" font-size="11.5" font-weight="700" fill="#0f172a">Domain shift</text>
  <text x="32" y="242" font-size="11" fill="#15803d">Domain adaptation,</text>
  <text x="32" y="255" font-size="11" fill="#15803d">fine-tuning</text>
  <!-- ===== Pillar 2: Input-level attacks ===== -->
  <rect x="228" y="10" width="196" height="258" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="228" y="10" width="196" height="28" rx="4" fill="#e2e8f0"/>
  <rect x="228" y="30" width="196" height="8" fill="#e2e8f0"/>
  <text x="326.0" y="29" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">2. Input-level attacks</text>
  <rect x="236" y="48" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="244" y="65" font-size="11.5" font-weight="700" fill="#0f172a">Evasion (FGSM, PGD)</text>
  <text x="244" y="80" font-size="11" fill="#15803d">Adversarial training</text>
  <rect x="236" y="102" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="244" y="119" font-size="11.5" font-weight="700" fill="#0f172a">C&amp;W, boundary attacks</text>
  <text x="244" y="134" font-size="11" fill="#15803d">Certified defenses</text>
  <rect x="236" y="156" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="244" y="173" font-size="11.5" font-weight="700" fill="#0f172a">Data and backdoor poisoning</text>
  <text x="244" y="188" font-size="11" fill="#15803d">Provenance, spectral</text>
  <text x="244" y="201" font-size="11" fill="#15803d">filtering</text>
  <rect x="236" y="210" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="244" y="227" font-size="11.5" font-weight="700" fill="#0f172a">Physical perturbations</text>
  <text x="244" y="242" font-size="11" fill="#15803d">Transformation-robust</text>
  <text x="244" y="255" font-size="11" fill="#15803d">training</text>
  <!-- ===== Pillar 3: System-level faults ===== -->
  <rect x="440" y="10" width="196" height="258" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="440" y="10" width="196" height="28" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="30" width="196" height="8" fill="#e2e8f0"/>
  <text x="538.0" y="29" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">3. System-level faults</text>
  <rect x="448" y="48" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="456" y="65" font-size="11.5" font-weight="700" fill="#0f172a">Silent data corruption</text>
  <text x="456" y="80" font-size="11" fill="#15803d">Redundant execution,</text>
  <text x="456" y="93" font-size="11" fill="#15803d">fleet screening</text>
  <rect x="448" y="102" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="456" y="119" font-size="11.5" font-weight="700" fill="#0f172a">Memory and weight bit flips</text>
  <text x="456" y="134" font-size="11" fill="#15803d">ECC, weight range checks</text>
  <rect x="448" y="156" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="456" y="173" font-size="11.5" font-weight="700" fill="#0f172a">Underflow, overflow, NaN</text>
  <text x="456" y="188" font-size="11" fill="#15803d">Loss scaling, NaN guards</text>
  <rect x="448" y="210" width="180" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="456" y="227" font-size="11.5" font-weight="700" fill="#0f172a">Distributed training desync</text>
  <text x="456" y="242" font-size="11" fill="#15803d">Checkpoint rollback,</text>
  <text x="456" y="255" font-size="11" fill="#15803d">watchdogs</text>
  <!-- ===== Cross-cutting layer ===== -->
  <rect x="16" y="280" width="620" height="30" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="326" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Software and pipeline defects (cross-cutting)</text>
</svg>
