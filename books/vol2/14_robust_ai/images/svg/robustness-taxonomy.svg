<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean Canvas Base (No Outer Border) -->
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: ENVIRONMENTAL SHIFTS (DISTRIBUTIONAL DRIFT)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 20)">
    <rect width="286" height="350" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 282 0 Q 286 0 286 4 L 286 26 L 0 26 Z" fill="#EAF1F8"/>
    <line x1="0" y1="26" x2="286" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="17" font-size="9.5" font-weight="700" fill="#1F407A" letter-spacing="0.5px">1. ENVIRONMENTAL SHIFTS</text>

    <!-- Sub-cards -->
    <g transform="translate(12, 36)">
      <!-- Card 1: Covariate Shift -->
      <g transform="translate(0, 0)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#EAF1F8"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#1F407A" text-anchor="middle">COVARIATE</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Covariate Shift</text>
        <text x="10" y="38" font-size="8" fill="#475569">Input marginal p(x) shifts while p(y|x) is invariant</text>
        <text x="10" y="52" font-size="7.5" fill="#1F407A">Defense: Importance weighting, domain adaptation</text>
      </g>

      <!-- Card 2: Concept Drift -->
      <g transform="translate(0, 72)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#EAF1F8"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#1F407A" text-anchor="middle">CONCEPT</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Concept Drift</text>
        <text x="10" y="38" font-size="8" fill="#475569">True relationship p(y|x) evolves over time</text>
        <text x="10" y="52" font-size="7.5" fill="#1F407A">Defense: Continuous retraining, online calibration</text>
      </g>

      <!-- Card 3: Label Shift -->
      <g transform="translate(0, 144)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#EAF1F8"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#1F407A" text-anchor="middle">LABEL</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Label Shift</text>
        <text x="10" y="38" font-size="8" fill="#475569">Target prior p(y) shifts while p(x|y) is invariant</text>
        <text x="10" y="52" font-size="7.5" fill="#1F407A">Defense: Confusion matrix inversion, prior adjust</text>
      </g>

      <!-- Card 4: Domain Shift -->
      <g transform="translate(0, 216)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#EAF1F8"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#1F407A" text-anchor="middle">DOMAIN</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Domain Shift</text>
        <text x="10" y="38" font-size="8" fill="#475569">Joint distribution p(x,y) shifts across deployment</text>
        <text x="10" y="52" font-size="7.5" fill="#1F407A">Defense: Invariant representations, fine-tuning</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: INPUT-LEVEL ATTACKS (ADVERSARIAL MANIPULATION)                  -->
  <!-- ========================================================================= -->
  <g transform="translate(337, 20)">
    <rect width="286" height="350" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 282 0 Q 286 0 286 4 L 286 26 L 0 26 Z" fill="#FEE2E2"/>
    <line x1="0" y1="26" x2="286" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="17" font-size="9.5" font-weight="700" fill="#B91C1C" letter-spacing="0.5px">2. INPUT-LEVEL ATTACKS</text>

    <!-- Sub-cards -->
    <g transform="translate(12, 36)">
      <!-- Card 1: Gradient Attacks -->
      <g transform="translate(0, 0)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#fee2e2"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">GRADIENT</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Evasion Attacks (FGSM, PGD)</text>
        <text x="10" y="38" font-size="8" fill="#475569">Imperceptible noise δ = ε·sign(∇xL) forces logit flip</text>
        <text x="10" y="52" font-size="7.5" fill="#b91c1c">Defense: Adversarial training (PGD-AT), smoothing</text>
      </g>

      <!-- Card 2: Optimization Attacks -->
      <g transform="translate(0, 72)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#fee2e2"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">CARLINI-W</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">C&amp;W &amp; Boundary Attacks</text>
        <text x="10" y="38" font-size="8" fill="#475569">High-confidence, minimal L₂/L₀ distortion attacks</text>
        <text x="10" y="52" font-size="7.5" fill="#b91c1c">Defense: Certified defense bounds (IBP, randomized)</text>
      </g>

      <!-- Card 3: Data Poisoning -->
      <g transform="translate(0, 144)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#fee2e2"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">POISONING</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Data &amp; Backdoor Poisoning</text>
        <text x="10" y="38" font-size="8" fill="#475569">Malicious samples bend boundaries or plant triggers</text>
        <text x="10" y="52" font-size="7.5" fill="#b91c1c">Defense: Spectral signatures, influence filtering</text>
      </g>

      <!-- Card 4: Physical Attacks -->
      <g transform="translate(0, 216)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#fee2e2"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">PHYSICAL</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Physical Perturbations</text>
        <text x="10" y="38" font-size="8" fill="#475569">Real-world stickers, optical patches, blur</text>
        <text x="10" y="52" font-size="7.5" fill="#b91c1c">Defense: Expectation over transformation (EOT)</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: SYSTEM-LEVEL FAULTS (PHYSICAL HARDWARE & INFRASTRUCTURE)        -->
  <!-- ========================================================================= -->
  <g transform="translate(644, 20)">
    <rect width="286" height="350" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 282 0 Q 286 0 286 4 L 286 26 L 0 26 Z" fill="#DCFCE7"/>
    <line x1="0" y1="26" x2="286" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="17" font-size="9.5" font-weight="700" fill="#15803D" letter-spacing="0.5px">3. SYSTEM-LEVEL FAULTS</text>

    <!-- Sub-cards -->
    <g transform="translate(12, 36)">
      <!-- Card 1: Silent Data Corruption -->
      <g transform="translate(0, 0)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#dcfce7"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">SDC / ALU</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Silent Data Corruption (SDC)</text>
        <text x="10" y="38" font-size="8" fill="#475569">Defective compute core causes arithmetic errors</text>
        <text x="10" y="52" font-size="7.5" fill="#15803d">Defense: Redundant execution, heartbeat checks</text>
      </g>

      <!-- Card 2: Memory Bit Flips -->
      <g transform="translate(0, 72)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#dcfce7"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">BIT FLIP</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Memory &amp; Weight Bit Flips</text>
        <text x="10" y="38" font-size="8" fill="#475569">Cosmic rays or voltage drops flip exponent bits</text>
        <text x="10" y="52" font-size="7.5" fill="#15803d">Defense: ECC SRAM/HBM, weight clipping</text>
      </g>

      <!-- Card 3: Numerical Instability -->
      <g transform="translate(0, 144)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#dcfce7"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">PRECISION</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Numerical Underflow &amp; NaN</text>
        <text x="10" y="38" font-size="8" fill="#475569">FP16/FP8 gradient underflows or explosive Inf</text>
        <text x="10" y="52" font-size="7.5" fill="#15803d">Defense: Loss scaling, mixed precision guards</text>
      </g>

      <!-- Card 4: Fleet & Runtime Errors -->
      <g transform="translate(0, 216)">
        <rect width="262" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="8" y="8" width="68" height="18" rx="2" fill="#dcfce7"/>
        <text x="42" y="20" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">FLEET</text>
        <text x="82" y="21" font-size="9" font-weight="700" fill="#0f172a">Distributed Training Desync</text>
        <text x="10" y="38" font-size="8" fill="#475569">Network stragglers, dropped AllReduce, deadlocks</text>
        <text x="10" y="52" font-size="7.5" fill="#15803d">Defense: Checkpoint rollback, timeout watchdogs</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- FOUNDATION PLINTH: Cross-Cutting Software Reality                         -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 380)">
    <rect width="900" height="36" rx="3" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <rect x="8" y="8" width="130" height="20" rx="2" fill="#FEF3C7"/>
    <text x="73" y="22" font-size="8" font-weight="700" fill="#B45309" text-anchor="middle">CROSS-CUTTING REALITY</text>
    <text x="150" y="22" font-size="8.5" fill="#92400E">Software and pipeline defects (preprocessing bugs, sanitizer bypasses, driver race conditions) permeate all three pillars.</text>
  </g>
</svg>
