<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <defs>
    <marker id="tax-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Root Node -->
  <g transform="translate(330, 20)">
    <rect x="0" y="0" width="300" height="46" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="150" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ML ROBUSTNESS TAXONOMY</text>
    <text x="150" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Core Failure Modes &amp; Operational Vulnerabilities</text>
  </g>

  <!-- Branch lines from Root -->
  <path d="M 480 66 V 90 H 165 V 108" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#tax-arr)"/>
  <path d="M 480 66 V 108" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#tax-arr)"/>
  <path d="M 480 66 V 90 H 795 V 108" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#tax-arr)"/>

  <!-- COLUMN 1: Environmental Shifts (Blue) -->
  <g transform="translate(30, 114)">
    <rect x="0" y="0" width="270" height="42" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="135" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">1. ENVIRONMENTAL SHIFTS</text>
    <text x="135" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#0284c7" text-anchor="middle">Distributional drift in data generating process</text>

    <!-- Sub-cards -->
    <g transform="translate(0, 52)">
      <!-- Card 1: Covariate Shift -->
      <rect x="0" y="0" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="8" width="76" height="16" rx="2" fill="#e0f2fe"/>
      <text x="48" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">COVARIATE</text>
      <text x="94" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Covariate Shift</text>
      <text x="10" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Input marginal p(x) shifts while p(y|x) is invariant</text>
      <text x="10" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Importance weighting, domain adaptation</text>

      <!-- Card 2: Concept Drift -->
      <rect x="0" y="60" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="68" width="76" height="16" rx="2" fill="#e0f2fe"/>
      <text x="48" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">CONCEPT</text>
      <text x="94" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Concept Drift</text>
      <text x="10" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">True relationship p(y|x) changes over time</text>
      <text x="10" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Continuous retraining, online calibration</text>

      <!-- Card 3: Label Shift -->
      <rect x="0" y="120" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="128" width="76" height="16" rx="2" fill="#e0f2fe"/>
      <text x="48" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">LABEL</text>
      <text x="94" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Label Shift</text>
      <text x="10" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Target prior p(y) shifts while p(x|y) is invariant</text>
      <text x="10" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Confusion matrix inversion, prior adjustment</text>

      <!-- Card 4: Domain Shift -->
      <rect x="0" y="180" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="188" width="76" height="16" rx="2" fill="#e0f2fe"/>
      <text x="48" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">DOMAIN</text>
      <text x="94" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Domain Shift</text>
      <text x="10" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Joint distribution p(x,y) shifts across deployment sites</text>
      <text x="10" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Invariant representations, fine-tuning</text>
    </g>
  </g>

  <!-- COLUMN 2: Input-Level Attacks (Red) -->
  <g transform="translate(345, 114)">
    <rect x="0" y="0" width="270" height="42" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
    <text x="135" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">2. INPUT-LEVEL ATTACKS</text>
    <text x="135" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#dc2626" text-anchor="middle">Deliberate adversarial input manipulation</text>

    <!-- Sub-cards -->
    <g transform="translate(0, 52)">
      <!-- Card 1: Gradient Attacks -->
      <rect x="0" y="0" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="8" width="76" height="16" rx="2" fill="#fee2e2"/>
      <text x="48" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">GRADIENT</text>
      <text x="94" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Evasion Attacks (FGSM, PGD)</text>
      <text x="10" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Imperceptible noise δ = ε·sign(∇xL) forces wrong logit</text>
      <text x="10" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Adversarial training (PGD-AT), smoothing</text>

      <!-- Card 2: Optimization Attacks -->
      <rect x="0" y="60" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="68" width="76" height="16" rx="2" fill="#fee2e2"/>
      <text x="48" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">CARLINI-W</text>
      <text x="94" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">C&amp;W &amp; Boundary Attacks</text>
      <text x="10" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">High-confidence, minimal L₂/L₀ distortion attacks</text>
      <text x="10" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Certified defense bounds (IBP, randomized)</text>

      <!-- Card 3: Data Poisoning -->
      <rect x="0" y="120" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="128" width="76" height="16" rx="2" fill="#fee2e2"/>
      <text x="48" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">POISONING</text>
      <text x="94" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Data &amp; Backdoor Poisoning</text>
      <text x="10" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Malicious samples bend boundaries or plant triggers</text>
      <text x="10" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Spectral signatures, influence filtering</text>

      <!-- Card 4: Physical Attacks -->
      <rect x="0" y="180" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="188" width="76" height="16" rx="2" fill="#fee2e2"/>
      <text x="48" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">PHYSICAL</text>
      <text x="94" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Physical World Perturbations</text>
      <text x="10" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Real-world stickers, patches, or lighting manipulation</text>
      <text x="10" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Expectation over transformation (EOT)</text>
    </g>
  </g>

  <!-- COLUMN 3: System-Level Faults (Green) -->
  <g transform="translate(660, 114)">
    <rect x="0" y="0" width="270" height="42" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
    <text x="135" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">3. SYSTEM-LEVEL FAULTS</text>
    <text x="135" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#16a34a" text-anchor="middle">Hardware corruption &amp; infrastructure failures</text>

    <!-- Sub-cards -->
    <g transform="translate(0, 52)">
      <!-- Card 1: Silent Data Corruption -->
      <rect x="0" y="0" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="8" width="76" height="16" rx="2" fill="#dcfce7"/>
      <text x="48" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">SDC / ALU</text>
      <text x="94" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Silent Data Corruption (SDC)</text>
      <text x="10" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Defective compute core causes incorrect math (e.g. 1.1⁵³=0)</text>
      <text x="10" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Redundant execution, core heartbeat checks</text>

      <!-- Card 2: Memory Bit Flips -->
      <rect x="0" y="60" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="68" width="76" height="16" rx="2" fill="#dcfce7"/>
      <text x="48" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">BIT FLIP</text>
      <text x="94" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Memory &amp; Weight Bit Flips</text>
      <text x="10" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Cosmic rays or voltage drops flip exponent bits</text>
      <text x="10" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: ECC SRAM/HBM, parameter clipping layers</text>

      <!-- Card 3: Numerical Instability -->
      <rect x="0" y="120" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="128" width="76" height="16" rx="2" fill="#dcfce7"/>
      <text x="48" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">PRECISION</text>
      <text x="94" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Numerical Underflow &amp; NaN</text>
      <text x="10" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">FP16/FP8 gradient underflows or Inf explosive scaling</text>
      <text x="10" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Loss scaling, mixed precision stabilization</text>

      <!-- Card 4: Fleet & Runtime Errors -->
      <rect x="0" y="180" width="270" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="188" width="76" height="16" rx="2" fill="#dcfce7"/>
      <text x="48" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">FLEET</text>
      <text x="94" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Distributed Training Desync</text>
      <text x="10" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Network stragglers, dropped AllReduce packets, deadlocks</text>
      <text x="10" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Mitigation: Checkpoint rollback, timeout watchdogs</text>
    </g>
  </g>

  <!-- BOTTOM PANEL: Cross-cutting Software Faults -->
  <g transform="translate(30, 412)">
    <rect x="0" y="0" width="900" height="50" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="14" y="14" width="168" height="22" rx="2" fill="#fef3c7"/>
    <text x="98" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">CROSS-CUTTING REALITY</text>
    <text x="194" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#92400e">Software &amp; Pipeline Bugs Cut Across All Three Pillars</text>
    <text x="194" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#78350f">Preprocessing errors create artificial distribution shifts; sanitizer bypasses allow adversarial poisoning; framework bugs trigger silent runtime corruption.</text>
  </g>
</svg>
