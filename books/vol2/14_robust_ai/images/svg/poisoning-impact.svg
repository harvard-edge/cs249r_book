  <text x="246.0" y="219" text-anchor="middle" font-size="11" fill="#b91c1c">record inside</text>
  <line x1="310" y1="203.0" x2="336" y2="203.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="338" y="160" width="128" height="86" rx="3" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.2"/>
  <text x="402.0" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Optimization</text>
  <text x="402.0" y="204" text-anchor="middle" font-size="11" fill="#b91c1c">gradients pulled</text>
  <text x="402.0" y="219" text-anchor="middle" font-size="11" fill="#b91c1c">toward trigger</text>
  <line x1="466" y1="203.0" x2="492" y2="203.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="494" y="160" width="128" height="86" rx="3" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.2"/>
  <text x="558.0" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Trained model</text>
  <text x="558.0" y="204" text-anchor="middle" font-size="11" fill="#b91c1c">backdoored model;</text>
  <text x="558.0" y="219" text-anchor="middle" font-size="11" fill="#b91c1c">clean accuracy intact</text>
