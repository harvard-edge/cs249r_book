  <line x1="154" y1="85.0" x2="180" y2="85.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="182" y="42" width="128" height="86" rx="3" fill="#dcfce7" fill-opacity="0.5" stroke="#16a34a" stroke-width="1.2"/>
