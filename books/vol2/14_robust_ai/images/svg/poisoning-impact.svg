        <text x="93" y="110" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">NOMINAL DECISION SPACE</text>
      </g>
    </g>
  </g>

  <!-- PANEL B: Data Poisoning Attack Pipeline -->
  <g transform="translate(25, 206)">
    <rect x="0" y="0" width="910" height="178" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="910" height="24" rx="5" fill="#fee2e2"/>
    <rect x="0" y="20" width="910" height="4" fill="#fee2e2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#b91c1c" letter-spacing="0.4">PANEL B · DATA POISONING ATTACK PIPELINE</text>
    <text x="420" y="16" font-size="8" fill="#64748b">Malicious record injected into training corpus skews parameter trajectory</text>

    <!-- 4 Pipeline Stages -->
    <g transform="translate(14, 34)">
      <!-- Stage 1: Ingested Stream with Poison -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="206" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="206" height="20" rx="4" fill="#f1f5f9"/>
        <rect x="0" y="16" width="206" height="4" fill="#f1f5f9"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#334155">1 · INGESTION + POISON</text>
        
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="186" height="26" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="10" y="17" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">Clean #101: (x₁, y=0)</text>
        </g>
        <g transform="translate(10, 60)">
          <rect x="0" y="0" width="186" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
          <text x="10" y="17" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" font-weight="700" fill="#b91c1c">POISON: (x̃, ỹ = 1)</text>
        </g>
        <g transform="translate(10, 92)">
          <rect x="0" y="0" width="186" height="26" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="10" y="17" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">Clean #103: (x₃, y=0)</text>
        </g>
      </g>

      <!-- Arrow 1 -> 2 -->
      <line x1="211" y1="65" x2="227" y2="65" stroke="#dc2626" stroke-width="1.8" marker-end="url(#pi-arr-red)"/>

      <!-- Stage 2: Contaminated Dataset -->
      <g transform="translate(232, 0)">
        <rect x="0" y="0" width="206" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="206" height="20" rx="4" fill="#f1f5f9"/>
        <rect x="0" y="16" width="206" height="4" fill="#f1f5f9"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#334155">2 · CONTAMINATED CORPUS</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="186" height="58" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
          <text x="10" y="18" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#b91c1c">D_poison = D_clean ∪ {x_p, y_p}</text>
          <text x="10" y="34" font-size="8" font-weight="600" fill="#991b1b">Malicious Trigger Ingested</text>
          <text x="10" y="48" font-size="7.5" fill="#7f1d1d">Bypasses naive hash checks</text>
        </g>
        <rect x="10" y="94" width="186" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
        <text x="103" y="110" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">POISON INGESTED</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <line x1="443" y1="65" x2="459" y2="65" stroke="#dc2626" stroke-width="1.8" marker-end="url(#pi-arr-red)"/>

      <!-- Stage 3: Contaminated Optimization -->
      <g transform="translate(464, 0)">
        <rect x="0" y="0" width="206" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="206" height="20" rx="4" fill="#f1f5f9"/>
        <rect x="0" y="16" width="206" height="4" fill="#f1f5f9"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#334155">3 · SKEWED OPTIMIZATION</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="186" height="58" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
          <text x="10" y="18" font-size="8" font-weight="600" fill="#0f172a">Biased Gradient Trajectory</text>
          <text x="10" y="34" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#b45309">∇_w L pulled toward trigger</text>
          <text x="10" y="48" font-size="7.5" fill="#78350f">Parameter update warps margin</text>
        </g>
        <rect x="10" y="94" width="186" height="24" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="103" y="110" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">SKEWED CONVERGENCE</text>
      </g>

      <!-- Arrow 3 -> 4 -->
      <line x1="675" y1="65" x2="691" y2="65" stroke="#dc2626" stroke-width="1.8" marker-end="url(#pi-arr-red)"/>

      <!-- Stage 4: Compromised Model -->
      <g transform="translate(696, 0)">
        <rect x="0" y="0" width="186" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="186" height="20" rx="4" fill="#f1f5f9"/>
        <rect x="0" y="16" width="186" height="4" fill="#f1f5f9"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#334155">4 · TROJANED ARTIFACT</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="166" height="58" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
          <!-- Corrupted Network Nodes (Red) -->
          <circle cx="20" cy="29" r="4" fill="#dc2626"/>
          <circle cx="48" cy="18" r="4" fill="#dc2626"/>
          <circle cx="48" cy="40" r="4" fill="#dc2626"/>
          <circle cx="76" cy="29" r="4" fill="#dc2626"/>
          <line x1="20" y1="29" x2="48" y2="18" stroke="#ef4444" stroke-width="1.2"/>
          <line x1="20" y1="29" x2="48" y2="40" stroke="#ef4444" stroke-width="1.2"/>
          <line x1="48" y1="18" x2="76" y2="29" stroke="#ef4444" stroke-width="1.2"/>
          <line x1="48" y1="40" x2="76" y2="29" stroke="#ef4444" stroke-width="1.2"/>
          <text x="92" y="24" font-size="7.5" font-weight="700" fill="#b91c1c">Backdoor Planted</text>
          <text x="92" y="40" font-size="7" fill="#7f1d1d">Targeted Trojan</text>
        </g>
        <rect x="10" y="94" width="166" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
        <text x="93" y="110" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">DISTORTED BOUNDARY</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM TAKEAWAY: Architectural Defenses -->
  <g transform="translate(25, 396)">
    <rect x="0" y="0" width="910" height="42" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <rect x="0" y="0" width="145" height="42" rx="4" fill="#dcfce7"/>
    <text x="72" y="25" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">INGESTION DEFENSES</text>
    <text x="160" y="18" font-size="8.5" font-weight="700" fill="#14532d">Data Boundary Sanitization &amp; Latent Spectral Analysis</text>
    <text x="160" y="32" font-size="7.5" fill="#166534">Cryptographic provenance verification, spectral signatures in latent embedding space, influence function auditing, and robust loss capping.</text>
  </g>
</svg>
