<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="pi-arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F407A"/>
    </marker>
    <marker id="pi-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- PANEL A: Normal Learning Pipeline -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="910" height="178" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="910" height="24" rx="5" fill="#EAF1F8"/>
    <rect x="0" y="20" width="910" height="4" fill="#EAF1F8"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#1F407A" letter-spacing="0.4">PANEL A · NOMINAL LEARNING PIPELINE (UNCOMPROMISED)</text>
    <text x="420" y="16" font-size="8" fill="#64748b">Verified data provenance and uncorrupted empirical risk minimization</text>

    <!-- 4 Pipeline Stages -->
    <g transform="translate(14, 34)">
      <!-- Stage 1: Clean Raw Data Cards -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="206" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="206" height="20" rx="4" fill="#f1f5f9"/>
        <rect x="0" y="16" width="206" height="4" fill="#f1f5f9"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#334155">1 · INGESTION STREAM</text>
        
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="186" height="26" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="10" y="17" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">✓ Sample #101: (x₁, y=0)</text>
        </g>
        <g transform="translate(10, 60)">
          <rect x="0" y="0" width="186" height="26" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="10" y="17" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">✓ Sample #102: (x₂, y=1)</text>
        </g>
        <g transform="translate(10, 92)">
          <rect x="0" y="0" width="186" height="26" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="10" y="17" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#15803d">✓ Sample #103: (x₃, y=0)</text>
        </g>
      </g>

      <!-- Arrow 1 -> 2 -->
      <line x1="211" y1="65" x2="227" y2="65" stroke="#1F407A" stroke-width="1.8" marker-end="url(#pi-arr-blue)"/>

      <!-- Stage 2: Curated Training Dataset -->
      <g transform="translate(232, 0)">
        <rect x="0" y="0" width="206" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="206" height="20" rx="4" fill="#f1f5f9"/>
        <rect x="0" y="16" width="206" height="4" fill="#f1f5f9"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#334155">2 · CLEAN TRAINING CORPUS</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="186" height="58" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="10" y="18" font-family="SFMono-Regular, Consolas, monospace" font-size="8" fill="#1F407A">D_train = {(x_i, y_i)}</text>
          <text x="10" y="34" font-size="8" font-weight="600" fill="#15803d">Validated Labels &amp; Hashes</text>
          <text x="10" y="48" font-size="7.5" fill="#64748b">Verified cryptographic provenance</text>
        </g>
        <rect x="10" y="94" width="186" height="24" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="103" y="110" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">VERIFIED: ZERO CONTAMINANTS</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <line x1="443" y1="65" x2="459" y2="65" stroke="#1F407A" stroke-width="1.8" marker-end="url(#pi-arr-blue)"/>

      <!-- Stage 3: Learning Algorithm -->
      <g transform="translate(464, 0)">
        <rect x="0" y="0" width="206" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="206" height="20" rx="4" fill="#f1f5f9"/>
        <rect x="0" y="16" width="206" height="4" fill="#f1f5f9"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#334155">3 · OPTIMIZATION ENGINE</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="186" height="58" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="10" y="18" font-size="8" font-weight="600" fill="#0f172a">SGD / AdamW Dynamics</text>
          <text x="10" y="34" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" fill="#1F407A">w_{t+1} = w_t - η · ∇_w L</text>
          <text x="10" y="48" font-size="7.5" fill="#64748b">Gradient vector tracks true loss</text>
        </g>
        <rect x="10" y="94" width="186" height="24" rx="3" fill="#EAF1F8" stroke="#7dd3fc" stroke-width="0.8"/>
        <text x="103" y="110" font-size="8" font-weight="700" fill="#1F407A" text-anchor="middle">STANDARD ERM CONVERGENCE</text>
      </g>

      <!-- Arrow 3 -> 4 -->
      <line x1="675" y1="65" x2="691" y2="65" stroke="#1F407A" stroke-width="1.8" marker-end="url(#pi-arr-blue)"/>

      <!-- Stage 4: Clean Model -->
      <g transform="translate(696, 0)">
        <rect x="0" y="0" width="186" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="186" height="20" rx="4" fill="#f1f5f9"/>
        <rect x="0" y="16" width="186" height="4" fill="#f1f5f9"/>
