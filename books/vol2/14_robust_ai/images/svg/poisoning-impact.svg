          <circle cx="48" cy="18" r="4" fill="#16a34a"/>
          <circle cx="48" cy="40" r="4" fill="#16a34a"/>
          <circle cx="76" cy="29" r="4" fill="#1F407A"/>
          <line x1="20" y1="29" x2="48" y2="18" stroke="#94a3b8" stroke-width="1"/>
          <line x1="20" y1="29" x2="48" y2="40" stroke="#94a3b8" stroke-width="1"/>
          <line x1="48" y1="18" x2="76" y2="29" stroke="#94a3b8" stroke-width="1"/>
          <line x1="48" y1="40" x2="76" y2="29" stroke="#94a3b8" stroke-width="1"/>
          <text x="94" y="24" font-size="8" font-weight="700" fill="#15803d">High Accuracy</text>
          <text x="94" y="40" font-size="7.5" fill="#166534">99.4% Test Acc</text>
        </g>
