<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="pi-arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="pi-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- PANEL A: Normal Learning Pipeline -->
  <g transform="translate(30, 18)">
    <rect x="0" y="0" width="900" height="175" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header Chip -->
    <rect x="14" y="10" width="160" height="20" rx="2" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="94" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">A. NORMAL LEARNING PIPELINE</text>
    <text x="184" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Nominal Ingestion &amp; Uncorrupted Convergence</text>

    <!-- 4 Pipeline Stages -->
    <g transform="translate(14, 38)">
      <!-- Stage 1: Clean Raw Data Cards -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="122" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">1. Ingested Data Stream</text>
        
        <!-- Card 1 -->
        <g transform="translate(10, 26)">
          <rect x="0" y="0" width="170" height="24" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="8" y="16" font-family="SFMono-Regular, monospace" font-size="8" fill="#15803d">✓ Sample #101: (x₁, y=0)</text>
        </g>
        <!-- Card 2 -->
        <g transform="translate(10, 56)">
          <rect x="0" y="0" width="170" height="24" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="8" y="16" font-family="SFMono-Regular, monospace" font-size="8" fill="#15803d">✓ Sample #102: (x₂, y=1)</text>
        </g>
        <!-- Card 3 -->
        <g transform="translate(10, 86)">
          <rect x="0" y="0" width="170" height="24" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="8" y="16" font-family="SFMono-Regular, monospace" font-size="8" fill="#15803d">✓ Sample #103: (x₃, y=0)</text>
        </g>
      </g>

      <!-- Arrow 1 -> 2 -->
      <line x1="198" y1="61" x2="224" y2="61" stroke="#0284c7" stroke-width="1.8" marker-end="url(#pi-arr-blue)"/>

      <!-- Stage 2: Curated Training Dataset -->
      <g transform="translate(232, 0)">
        <rect x="0" y="0" width="190" height="122" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">2. Clean Training Corpus</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="170" height="52" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="10" y="18" font-family="SFMono-Regular, monospace" font-size="8" fill="#334155">D_train = {(x_i, y_i)}</text>
          <text x="10" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#15803d">Validated Labels &amp; Hashes</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Verified data provenance</text>
        </g>
        <rect x="10" y="88" width="170" height="22" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="95" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">✓ Zero Contaminants</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <line x1="430" y1="61" x2="456" y2="61" stroke="#0284c7" stroke-width="1.8" marker-end="url(#pi-arr-blue)"/>

      <!-- Stage 3: Learning Algorithm -->
      <g transform="translate(464, 0)">
        <rect x="0" y="0" width="190" height="122" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">3. Learning Algorithm</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="170" height="52" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#0f172a">SGD / AdamW Engine</text>
          <text x="10" y="18" font-family="SFMono-Regular, monospace" font-size="8" fill="#0369a1">w_{t+1} = w_t - η · ∇_w L</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Gradients follow true loss</text>
        </g>
        <rect x="10" y="88" width="170" height="22" rx="2" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
        <text x="95" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#0284c7" text-anchor="middle">Standard ERM Convergence</text>
      </g>

      <!-- Arrow 3 -> 4 -->
      <line x1="662" y1="61" x2="688" y2="61" stroke="#0284c7" stroke-width="1.8" marker-end="url(#pi-arr-blue)"/>

      <!-- Stage 4: Clean Machine Learning Model -->
      <g transform="translate(696, 0)">
        <rect x="0" y="0" width="176" height="122" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">4. Trained Model (Clean)</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="156" height="52" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
          <!-- Neural Network Mini Nodes -->
          <circle cx="20" cy="26" r="4" fill="#0284c7"/>
          <circle cx="50" cy="16" r="4" fill="#16a34a"/>
          <circle cx="50" cy="36" r="4" fill="#16a34a"/>
          <circle cx="80" cy="26" r="4" fill="#0284c7"/>
          <line x1="20" y1="26" x2="50" y2="16" stroke="#94a3b8" stroke-width="1"/>
          <line x1="20" y1="26" x2="50" y2="36" stroke="#94a3b8" stroke-width="1"/>
          <line x1="50" y1="16" x2="80" y2="26" stroke="#94a3b8" stroke-width="1"/>
          <line x1="50" y1="36" x2="80" y2="26" stroke="#94a3b8" stroke-width="1"/>
          <text x="100" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d">High Accuracy</text>
          <text x="100" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#166534">99.4% Test Acc</text>
        </g>
        <rect x="10" y="88" width="156" height="22" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="88" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">✓ Nominal Decision Boundary</text>
      </g>
    </g>
  </g>

  <!-- PANEL B: Data Poisoning Attack Pipeline -->
  <g transform="translate(30, 204)">
    <rect x="0" y="0" width="900" height="175" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header Chip -->
    <rect x="14" y="10" width="160" height="20" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
    <text x="94" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">B. DATA POISONING ATTACK</text>
    <text x="184" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Malicious Record Injected Into Training Corpus</text>

    <!-- 4 Pipeline Stages -->
    <g transform="translate(14, 38)">
      <!-- Stage 1: Ingested Data Stream with Injected Poison -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="122" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">1. Ingested Stream + Poison</text>
        
        <!-- Card 1 -->
        <g transform="translate(10, 26)">
          <rect x="0" y="0" width="170" height="24" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="8" y="16" font-family="SFMono-Regular, monospace" font-size="8" fill="#15803d">✓ Sample #101: (x₁, y=0)</text>
        </g>
        <!-- Card 2: POISONED RECORD -->
        <g transform="translate(10, 56)">
          <rect x="0" y="0" width="170" height="24" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
          <text x="8" y="16" font-family="SFMono-Regular, monospace" font-size="8" font-weight="700" fill="#b91c1c">⚡ POISON: (x̃, ỹ = 1)</text>
        </g>
        <!-- Card 3 -->
        <g transform="translate(10, 86)">
          <rect x="0" y="0" width="170" height="24" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="8" y="16" font-family="SFMono-Regular, monospace" font-size="8" fill="#15803d">✓ Sample #103: (x₃, y=0)</text>
        </g>
      </g>

      <!-- Arrow 1 -> 2 -->
      <line x1="198" y1="61" x2="224" y2="61" stroke="#dc2626" stroke-width="1.8" marker-end="url(#pi-arr-red)"/>

      <!-- Stage 2: Contaminated Dataset -->
      <g transform="translate(232, 0)">
        <rect x="0" y="0" width="190" height="122" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">2. Contaminated Dataset</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="170" height="52" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
          <text x="10" y="18" font-family="SFMono-Regular, monospace" font-size="8" fill="#b91c1c">D_poison = D_clean + {x_p, y_p}</text>
          <text x="10" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#991b1b">Malicious trigger in training set</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#7f1d1d">Undetected by naive deduplication</text>
        </g>
        <rect x="10" y="88" width="170" height="22" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
        <text x="95" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">⚠️ Poison Ingested</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <line x1="430" y1="61" x2="456" y2="61" stroke="#dc2626" stroke-width="1.8" marker-end="url(#pi-arr-red)"/>

      <!-- Stage 3: Optimization on Corrupted Loss -->
      <g transform="translate(464, 0)">
        <rect x="0" y="0" width="190" height="122" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">3. Corrupted Optimization</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="170" height="52" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
          <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#0f172a">Biased Gradient Trajectory</text>
          <text x="10" y="32" font-family="SFMono-Regular, monospace" font-size="7.5" fill="#b45309">∇_w L pulled toward poison</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#78350f">Parameter update skews boundary</text>
        </g>
        <rect x="10" y="88" width="170" height="22" rx="2" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="95" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">Loss Objective Contaminated</text>
      </g>

      <!-- Arrow 3 -> 4 -->
      <line x1="662" y1="61" x2="688" y2="61" stroke="#dc2626" stroke-width="1.8" marker-end="url(#pi-arr-red)"/>

      <!-- Stage 4: Compromised / Backdoored Model -->
      <g transform="translate(696, 0)">
        <rect x="0" y="0" width="176" height="122" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a">4. Poisoned Model (Trojan)</text>
        <g transform="translate(10, 28)">
          <rect x="0" y="0" width="156" height="52" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
          <!-- Corrupted Network Nodes (Red) -->
          <circle cx="20" cy="26" r="4" fill="#dc2626"/>
          <circle cx="50" cy="16" r="4" fill="#dc2626"/>
          <circle cx="50" cy="36" r="4" fill="#dc2626"/>
          <circle cx="80" cy="26" r="4" fill="#dc2626"/>
          <line x1="20" y1="26" x2="50" y2="16" stroke="#ef4444" stroke-width="1.2"/>
          <line x1="20" y1="26" x2="50" y2="36" stroke="#ef4444" stroke-width="1.2"/>
          <line x1="50" y1="16" x2="80" y2="26" stroke="#ef4444" stroke-width="1.2"/>
          <line x1="50" y1="36" x2="80" y2="26" stroke="#ef4444" stroke-width="1.2"/>
          <text x="100" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c">Backdoor Implantation</text>
          <text x="100" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#7f1d1d">Targeted Failures</text>
        </g>
        <rect x="10" y="88" width="156" height="22" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
        <text x="88" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">❌ Distorted Boundary</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM TAKEAWAY: Architectural Defenses -->
  <g transform="translate(30, 390)">
    <rect x="0" y="0" width="900" height="46" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect x="14" y="11" width="160" height="24" rx="2" fill="#dcfce7"/>
    <text x="94" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">INGESTION DEFENSES</text>
    <text x="186" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#14532d">Data Boundary Sanitization &amp; Representation Defense</text>
    <text x="186" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Provenance verification, spectral signatures in latent embedding space, influence function auditing, and robust Huber loss capping.</text>
  </g>
</svg>
