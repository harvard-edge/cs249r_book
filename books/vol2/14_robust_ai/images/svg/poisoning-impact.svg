  <rect x="40" y="224" width="100" height="14" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="90.0" y="235" text-anchor="middle" font-size="11" fill="#15803d">clean record</text>
  <line x1="154" y1="203.0" x2="180" y2="203.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="182" y="160" width="128" height="86" rx="3" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.2"/>
