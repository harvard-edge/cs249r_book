  <line x1="310" y1="85.0" x2="336" y2="85.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="338" y="42" width="128" height="86" rx="3" fill="#EAF1F8" fill-opacity="0.5" stroke="#1F407A" stroke-width="1.2"/>
  <text x="402.0" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Optimization</text>
  <text x="402.0" y="86" text-anchor="middle" font-size="11" fill="#475569">gradients follow</text>
  <text x="402.0" y="101" text-anchor="middle" font-size="11" fill="#475569">clean loss</text>
  <line x1="466" y1="85.0" x2="492" y2="85.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="494" y="42" width="128" height="86" rx="3" fill="#EAF1F8" fill-opacity="0.5" stroke="#1F407A" stroke-width="1.2"/>
