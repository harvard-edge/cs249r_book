  <text x="558.0" y="86" text-anchor="middle" font-size="11" fill="#475569">nominal</text>
  <text x="558.0" y="101" text-anchor="middle" font-size="11" fill="#475569">decision boundary</text>
  <!-- ===== Poisoned pipeline ===== -->
  <text x="26" y="150" font-size="12" font-weight="700" fill="#b91c1c">Poisoned pipeline</text>
  <rect x="26" y="160" width="128" height="86" rx="3" fill="#dcfce7" fill-opacity="0.5" stroke="#16a34a" stroke-width="1.2"/>
  <text x="90.0" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Ingestion</text>
  <rect x="40" y="188" width="100" height="14" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
