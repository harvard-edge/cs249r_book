<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="ae-arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="ae-arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="ae-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- TOP MAIN CARD: Autoencoder Symmetric Architecture -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="900" height="336" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Section Headers -->
    <!-- Encoder Header -->
    <rect x="70" y="14" width="180" height="24" rx="2" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="160" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">ENCODER: q_φ(z | x)</text>

    <!-- Bottleneck Header -->
    <rect x="290" y="14" width="130" height="24" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="355" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">LATENT SPACE z</text>

    <!-- Decoder Header -->
    <rect x="460" y="14" width="180" height="24" rx="2" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="550" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">DECODER: p_θ(x̂ | z)</text>

    <!-- NEURAL NETWORK HOURGLASS DIAGRAM -->
    <g transform="translate(20, 50)">
      <!-- Inter-layer synaptic connections (subtle lines) -->
      <!-- Layer 0 (Input) to Layer 1 -->
      <g stroke="#94a3b8" stroke-width="0.7" opacity="0.4">
        <line x1="60" y1="40" x2="130" y2="60"/><line x1="60" y1="40" x2="130" y2="90"/><line x1="60" y1="40" x2="130" y2="120"/>
        <line x1="60" y1="70" x2="130" y2="60"/><line x1="60" y1="70" x2="130" y2="90"/><line x1="60" y1="70" x2="130" y2="120"/><line x1="60" y1="70" x2="130" y2="150"/>
        <line x1="60" y1="100" x2="130" y2="60"/><line x1="60" y1="100" x2="130" y2="90"/><line x1="60" y1="100" x2="130" y2="120"/><line x1="60" y1="100" x2="130" y2="150"/><line x1="60" y1="100" x2="130" y2="180"/>
        <line x1="60" y1="130" x2="130" y2="60"/><line x1="60" y1="130" x2="130" y2="90"/><line x1="60" y1="130" x2="130" y2="120"/><line x1="60" y1="130" x2="130" y2="150"/><line x1="60" y1="130" x2="130" y2="180"/>
        <line x1="60" y1="160" x2="130" y2="90"/><line x1="60" y1="160" x2="130" y2="120"/><line x1="60" y1="160" x2="130" y2="150"/><line x1="60" y1="160" x2="130" y2="180"/>
        <line x1="60" y1="190" x2="130" y2="120"/><line x1="60" y1="190" x2="130" y2="150"/><line x1="60" y1="190" x2="130" y2="180"/>
        <line x1="60" y1="220" x2="130" y2="150"/><line x1="60" y1="220" x2="130" y2="180"/>
      </g>

      <!-- Layer 1 to Layer 2 -->
      <g stroke="#94a3b8" stroke-width="0.7" opacity="0.4">
        <line x1="130" y1="60" x2="200" y2="85"/><line x1="130" y1="60" x2="200" y2="120"/><line x1="130" y1="60" x2="200" y2="155"/>
        <line x1="130" y1="90" x2="200" y2="85"/><line x1="130" y1="90" x2="200" y2="120"/><line x1="130" y1="90" x2="200" y2="155"/>
        <line x1="130" y1="120" x2="200" y2="85"/><line x1="130" y1="120" x2="200" y2="120"/><line x1="130" y1="120" x2="200" y2="155"/>
        <line x1="130" y1="150" x2="200" y2="85"/><line x1="130" y1="150" x2="200" y2="120"/><line x1="130" y1="150" x2="200" y2="155"/>
        <line x1="130" y1="180" x2="200" y2="85"/><line x1="130" y1="180" x2="200" y2="120"/><line x1="130" y1="180" x2="200" y2="155"/>
      </g>

      <!-- Layer 2 to Bottleneck (Layer 3) -->
      <g stroke="#f59e0b" stroke-width="1.2" opacity="0.6">
        <line x1="200" y1="85" x2="270" y2="105"/><line x1="200" y1="85" x2="270" y2="135"/>
        <line x1="200" y1="120" x2="270" y2="105"/><line x1="200" y1="120" x2="270" y2="135"/>
        <line x1="200" y1="155" x2="270" y2="105"/><line x1="200" y1="155" x2="270" y2="135"/>
      </g>

      <!-- Bottleneck to Layer 4 -->
      <g stroke="#f59e0b" stroke-width="1.2" opacity="0.6">
        <line x1="270" y1="105" x2="340" y2="85"/><line x1="270" y1="105" x2="340" y2="120"/><line x1="270" y1="105" x2="340" y2="155"/>
        <line x1="270" y1="135" x2="340" y2="85"/><line x1="270" y1="135" x2="340" y2="120"/><line x1="270" y1="135" x2="340" y2="155"/>
      </g>

      <!-- Layer 4 to Layer 5 -->
      <g stroke="#94a3b8" stroke-width="0.7" opacity="0.4">
        <line x1="340" y1="85" x2="410" y2="60"/><line x1="340" y1="85" x2="410" y2="90"/><line x1="340" y1="85" x2="410" y2="120"/><line x1="340" y1="85" x2="410" y2="150"/><line x1="340" y1="85" x2="410" y2="180"/>
        <line x1="340" y1="120" x2="410" y2="60"/><line x1="340" y1="120" x2="410" y2="90"/><line x1="340" y1="120" x2="410" y2="120"/><line x1="340" y1="120" x2="410" y2="150"/><line x1="340" y1="120" x2="410" y2="180"/>
        <line x1="340" y1="155" x2="410" y2="60"/><line x1="340" y1="155" x2="410" y2="90"/><line x1="340" y1="155" x2="410" y2="120"/><line x1="340" y1="155" x2="410" y2="150"/><line x1="340" y1="155" x2="410" y2="180"/>
      </g>

      <!-- Layer 5 to Layer 6 (Output) -->
      <g stroke="#94a3b8" stroke-width="0.7" opacity="0.4">
        <line x1="410" y1="60" x2="480" y2="40"/><line x1="410" y1="60" x2="480" y2="70"/><line x1="410" y1="60" x2="480" y2="100"/>
        <line x1="410" y1="90" x2="480" y2="70"/><line x1="410" y1="90" x2="480" y2="100"/><line x1="410" y1="90" x2="480" y2="130"/><line x1="410" y1="90" x2="480" y2="160"/>
        <line x1="410" y1="120" x2="480" y2="100"/><line x1="410" y1="120" x2="480" y2="130"/><line x1="410" y1="120" x2="480" y2="160"/><line x1="410" y1="120" x2="480" y2="190"/>
        <line x1="410" y1="150" x2="480" y2="130"/><line x1="410" y1="150" x2="480" y2="160"/><line x1="410" y1="150" x2="480" y2="190"/><line x1="410" y1="150" x2="480" y2="220"/>
        <line x1="410" y1="180" x2="480" y2="160"/><line x1="410" y1="180" x2="480" y2="190"/><line x1="410" y1="180" x2="480" y2="220"/>
      </g>

      <!-- LAYER NODES -->
      <!-- Input Layer (x) - 7 nodes -->
      <g fill="#bae6fd" stroke="#0284c7" stroke-width="1.2">
        <circle cx="60" cy="40" r="7"/><circle cx="60" cy="70" r="7"/>
        <circle cx="60" cy="100" r="7"/><circle cx="60" cy="130" r="7"/>
        <circle cx="60" cy="160" r="7"/><circle cx="60" cy="190" r="7"/>
        <circle cx="60" cy="220" r="7"/>
      </g>
      <text x="60" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">Input x</text>
      <text x="60" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">dim: D</text>

      <!-- Hidden 1 (5 nodes) -->
      <g fill="#e0f2fe" stroke="#38bdf8" stroke-width="1">
        <circle cx="130" cy="60" r="6"/><circle cx="130" cy="90" r="6"/>
        <circle cx="130" cy="120" r="6"/><circle cx="130" cy="150" r="6"/>
        <circle cx="130" cy="180" r="6"/>
      </g>
      <text x="130" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">h₁</text>

      <!-- Hidden 2 (3 nodes) -->
      <g fill="#e0f2fe" stroke="#38bdf8" stroke-width="1">
        <circle cx="200" cy="85" r="6"/><circle cx="200" cy="120" r="6"/>
        <circle cx="200" cy="155" r="6"/>
      </g>
      <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">h₂</text>

      <!-- Bottleneck (Latent Space z, 2 nodes) -->
      <g fill="#fef3c7" stroke="#d97706" stroke-width="1.8">
        <circle cx="270" cy="105" r="8"/><circle cx="270" cy="135" r="8"/>
      </g>
      <text x="270" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">Latent z</text>
      <text x="270" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#b45309" text-anchor="middle">dim: d ≪ D</text>

      <!-- Hidden 3 (3 nodes) -->
      <g fill="#e0f2fe" stroke="#38bdf8" stroke-width="1">
        <circle cx="340" cy="85" r="6"/><circle cx="340" cy="120" r="6"/>
        <circle cx="340" cy="155" r="6"/>
      </g>
      <text x="340" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">h₃</text>

      <!-- Hidden 4 (5 nodes) -->
      <g fill="#e0f2fe" stroke="#38bdf8" stroke-width="1">
        <circle cx="410" cy="60" r="6"/><circle cx="410" cy="90" r="6"/>
        <circle cx="410" cy="120" r="6"/><circle cx="410" cy="150" r="6"/>
        <circle cx="410" cy="180" r="6"/>
      </g>
      <text x="410" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">h₄</text>

      <!-- Output Layer (x̂) - 7 nodes -->
      <g fill="#bae6fd" stroke="#0284c7" stroke-width="1.2">
        <circle cx="480" cy="40" r="7"/><circle cx="480" cy="70" r="7"/>
        <circle cx="480" cy="100" r="7"/><circle cx="480" cy="130" r="7"/>
        <circle cx="480" cy="160" r="7"/><circle cx="480" cy="190" r="7"/>
        <circle cx="480" cy="220" r="7"/>
      </g>
      <text x="480" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">Reconstructed x̂</text>
      <text x="480" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">dim: D</text>
    </g>

    <!-- RIGHT PANEL: Anomaly Detection Gating Logic -->
    <g transform="translate(560, 44)">
      <rect x="0" y="0" width="320" height="270" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Anomaly Detection via Reconstruction Loss</text>
      
      <!-- Loss Formula Box -->
      <g transform="translate(14, 30)">
        <rect x="0" y="0" width="292" height="42" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#475569">Mean Squared Reconstruction Error:</text>
        <text x="10" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#0f172a">L_rec(x) = ‖x - x̂‖² = 1/D · ∑ (x_j - x̂_j)²</text>
      </g>

      <!-- Case 1: Clean In-Distribution Record -->
      <g transform="translate(14, 84)">
        <rect x="0" y="0" width="292" height="74" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <rect x="10" y="8" width="90" height="18" rx="2" fill="#dcfce7"/>
        <text x="55" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">CLEAN INPUT</text>
        <text x="110" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#15803d">L_rec(x) ≤ τ_anomaly</text>
        <text x="10" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Model easily encodes/decodes normal manifold data.</text>
        <text x="10" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Action: Ingested into training corpus with high confidence.</text>
        <text x="10" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#15803d">[PASS] Status: ACCEPTED FOR TRAINING</text>
      </g>

      <!-- Case 2: Poisoned / Outlier Record -->
      <g transform="translate(14, 168)">
        <rect x="0" y="0" width="292" height="88" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <rect x="10" y="8" width="96" height="18" rx="2" fill="#fca5a5"/>
        <text x="58" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#7f1d1d" text-anchor="middle">POISONED INPUT</text>
        <text x="116" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c">L_rec(x*) &gt; τ_anomaly</text>
        <text x="10" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">Backdoor triggers / outliers do not lie on manifold.</text>
        <text x="10" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Decoder fails to reconstruct unfamiliar features.</text>
        <text x="10" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#dc2626">Action: Blocked from training set; sent to quarantine.</text>
        <text x="10" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#b91c1c">[FLAG] Status: ANOMALY QUARANTINE</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM PANEL: Defensive Architecture -->
  <g transform="translate(30, 368)">
    <rect x="0" y="0" width="900" height="68" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect x="14" y="12" width="168" height="20" rx="2" fill="#dcfce7"/>
    <text x="98" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">OPERATIONAL INGESTION GATING</text>

    <g transform="translate(194, 10)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">1. Reference Manifold Training:</text>
      <text x="175" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Autoencoder is trained strictly on golden clean batches, learning normal low-dimensional data structures.</text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">2. Dynamic Threshold Calibration:</text>
      <text x="180" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Threshold τ_anomaly is calibrated via empirical 99th percentile loss on held-out clean validation subsets.</text>
      <text x="0" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">3. Latent Representation Auditing:</text>
      <text x="185" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Latent code z is cross-checked via Mahalanobis distance in bottleneck space to catch clean-label semantic shifts.</text>
    </g>
  </g>
</svg>