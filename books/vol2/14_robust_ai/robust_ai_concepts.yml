  learner_graph:
    schema_version: 1
    concepts:
    - id: vol2.robustness.shift
      label: Distribution shift
      teaches: Shift taxonomy
      summary: A change between training or reference data and the operational data-generating distribution.
      section: sec-robust-ai-distribution-shift-concept-drift-55e2
    - id: vol2.robustness.selective-prediction
      label: Selective prediction
      teaches: Per-request competence contract
      summary: A decision rule that answers selected requests and abstains or routes the remainder under
        a measured risk-coverage contract.
      section: sec-robust-ai-selective-prediction
    - id: vol2.robustness.poisoning-defense
      label: Poisoning defenses
      teaches: Layered poisoning defense
      summary: Layered controls on source provenance, incoming data, training, and post-training behavior
        that reduce specified poisoning risks.
      section: sec-robust-ai-data-poisoning-defenses-d070
    - id: vol2.robustness.fallback-capacity
      label: Fallback capacity
      teaches: Per-request competence contract
      section: sec-robust-ai-conformal-coverage
      summary: The service or human-review capacity needed to handle the rate and work of requests deferred
        by the primary predictor within their response deadlines.
    relationships:
    - id: vol2.field.39
      source: vol2.security.poisoning
      predicate: is addressed in layers by
      target: vol2.robustness.poisoning-defense
      explanation: No single detector or robust objective covers all poisoning pathways.
      conditions: Controls must be selected for attacker access, contamination assumptions, and acceptable
        false positives.
      status: draft
      evidence:
        section: sec-robust-ai-data-poisoning-defenses-d070
        quote: '1. **Ingress controls** establish provenance and access limits, dictating which sources
          may contribute or modify data.

          2. **Anomaly detection and sanitization** inspect candidate records before training and filter
          suspicious submissions.

          3. **Robust training objectives** reduce the weight that extreme residuals receive for poisoned
          samples that evade ingestion filtering, although they do not by themselves bound parameter updates.

          4. **Post-training checks** test the trained model''s behavior on the poisoning objectives that
          aggregate accuracy hides before the model is released.'
    - id: vol2.field.42
      source: vol2.robustness.selective-prediction
      predicate: creates demand for
      target: vol2.robustness.fallback-capacity
      explanation: Abstained requests may be routed to a stronger model or human review; their rate determines
        the fallback capacity required.
      conditions: Measure the risk-coverage operating point, route mix, service time, and response deadline;
        fallback capacity does not itself establish prediction validity.
      status: draft
      evidence:
        section: sec-robust-ai-selective-prediction
        quote: 'Set size or interval width supplies an operational load signal. Larger outputs convey less
          specific predictions and can trigger abstention, a stronger model, or human review, so their tail
          distribution determines fallback capacity just as the risk-coverage curve determines rejected
          traffic. The target coverage is therefore not free: increasing it usually widens sets, raises
          review demand, or reduces the fraction of requests on which the system can act automatically.'
    - id: vol2.field.55
      source: vol2.robustness.poisoning-defense
      predicate: requires checks before
      target: vol2.operations.rollout
      explanation: Post-training checks evaluate attack-specific behavior before a model is released; clean
        aggregate accuracy alone cannot rule out targeted or backdoor poisoning.
      conditions: The checks cover only their stated poisoning threat models, target cohorts, and trigger
        assumptions; an unseen backdoor can evade them.
      status: draft
      evidence:
        section: sec-robust-ai-data-poisoning-defenses-d070
