  claims:
    Robustness per failure class: Drift, adversarial inputs, poisoning, and silent faults can keep every service-health
      signal green while predictions become invalid, and replication does not remove a weakness every copy shares,
      so robustness is claimed only per stated failure class.
    Shift taxonomy: Covariate shift changes P(x), label shift changes P(y), and concept drift changes P(y|x), so
      input monitors can be silent under pure concept drift and the type of shift selects the remedy (reweighting,
      recalibration, or adaptation on fresh labels).
    Drift alert to model update: 'A drift alert opens an investigation rather than a retrain: detection, correlation
      with outcome performance, and action are separate levels, and a model update needs labels that confirm the
      shift and a root cause the update addresses.'
    Per-request competence contract: Population monitors cannot say whether one request lies inside demonstrated
      competence, so serving trades coverage against selective risk along a threshold, and conformal prediction
      adds a coverage guarantee that holds only under exchangeability.
    Adversarial robustness for a named threat model: Attacker access defines the evaluation a defense must survive
      (for a physical attack, the full sensor loop rather than saved images), and robustness is bought empirically
      in training compute (adversarial training multiplies passes per batch) or certifiably in serving samples.
    Layered poisoning defense: Because poisoned records can preserve clean aggregate accuracy, defense runs as ordered
      layers along the data path (ingress controls, anomaly detection and sanitization, robust training, post-training
      checks), each with a named blind spot, made reversible by lineage.
    Generative reliability: A hallucination rate is meaningful only against a stated evidence source, prompt set,
      and decoding settings, and entropy and self-consistency are priced routing signals, not factuality scores.
    Distinguishing faults from shift: A preprocessing bug moves feature statistics like covariate shift and a numerical overflow
      flips decisions like an adversarial example, so operators read system evidence (timing against releases, fixed-input
      replay, cross-layer correlation) before choosing a defense.
    Adversarial transferability: Adversarial examples crafted on a surrogate often transfer to the deployed model,
      which makes black-box attacks practical without gradient access.
