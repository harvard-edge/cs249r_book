<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="600" height="236" fill="#fff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <!-- ===== Full retraining ===== -->
  <rect x="20" y="20" width="172" height="196" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="172" height="24" rx="4" fill="#e2e8f0"/>
  <text x="106.0" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Full retraining</text>
  <rect x="30" y="64" width="68" height="48" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="64.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">D minus</text>
  <text x="64.0" y="100.0" text-anchor="middle" font-size="10" fill="#334155">forget set</text>
  <line x1="98" y1="88.0" x2="114" y2="88.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="116" y="64" width="66" height="48" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="149.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Train</text>
  <text x="149.0" y="100.0" text-anchor="middle" font-size="10" fill="#334155">from scratch</text>
  <line x1="30" y1="136" x2="182" y2="136" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="32" y="158" font-size="10" fill="#475569">guarantee</text>
  <text x="180" y="158" text-anchor="end" font-size="10.5" font-weight="700" fill="#15803d">exact</text>
  <text x="32" y="182" font-size="10" fill="#475569">recompute</text>
  <text x="180" y="182" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a">whole model</text>
  <!-- ===== Gradient ascent ===== -->
  <rect x="214" y="20" width="172" height="196" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="214" y="20" width="172" height="24" rx="4" fill="#e2e8f0"/>
  <text x="300.0" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Gradient ascent</text>
  <rect x="224" y="64" width="68" height="48" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="258.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Forget</text>
  <text x="258.0" y="100.0" text-anchor="middle" font-size="10" fill="#334155">set</text>
  <line x1="292" y1="88.0" x2="308" y2="88.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="310" y="64" width="66" height="48" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="343" y="83" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Ascent</text>
  <text x="343" y="99" text-anchor="middle" font-size="10" fill="#334155"><tspan font-style="italic">θ</tspan> + <tspan font-style="italic">η</tspan>∇ℒ</text>
  <line x1="224" y1="136" x2="376" y2="136" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="226" y="158" font-size="10" fill="#475569">guarantee</text>
  <text x="374" y="158" text-anchor="end" font-size="10.5" font-weight="700" fill="#b45309">approximate</text>
  <text x="226" y="182" font-size="10" fill="#475569">recompute</text>
  <text x="374" y="182" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a">forget-set passes</text>
  <!-- ===== SISA sharding ===== -->
  <rect x="408" y="20" width="172" height="196" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="408" y="20" width="172" height="24" rx="4" fill="#e2e8f0"/>
  <text x="494.0" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">SISA sharding</text>
  <rect x="418" y="64" width="18" height="48" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="427" y="92.0" text-anchor="middle" font-size="10" fill="#0f172a">S<tspan baseline-shift="sub" font-size="8">1</tspan></text>
  <rect x="440" y="64" width="18" height="48" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="449" y="92.0" text-anchor="middle" font-size="10" fill="#0f172a">S<tspan baseline-shift="sub" font-size="8">2</tspan></text>
  <rect x="462" y="64" width="18" height="48" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="471" y="92.0" text-anchor="middle" font-size="10" fill="#0f172a">S<tspan baseline-shift="sub" font-size="8">3</tspan></text>
  <line x1="484" y1="88.0" x2="502" y2="88.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="504" y="64" width="66" height="48" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="537.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Retrain</text>
  <text x="537.0" y="100.0" text-anchor="middle" font-size="10" fill="#334155">shard 3</text>
  <line x1="418" y1="136" x2="570" y2="136" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="420" y="158" font-size="10" fill="#475569">guarantee</text>
  <text x="568" y="158" text-anchor="end" font-size="10.5" font-weight="700" fill="#15803d">exact</text>
  <text x="420" y="182" font-size="10" fill="#475569">recompute</text>
  <text x="568" y="182" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a">one shard</text>
  <text x="420" y="206" font-size="10" fill="#475569">serving</text>
  <text x="568" y="206" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a">shard vote</text>
</svg>
