<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" width="100%" height="100%">
  <rect width="760" height="385" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- ==================== CARD 1: FULL RETRAINING ==================== -->
  <g transform="translate(25, 18)">
    <rect width="230" height="348" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="230" height="28" rx="4" fill="#EAF1F8"/>
    <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Full Retraining (Baseline)</text>

    <!-- Diagram -->
    <g transform="translate(18, 42)">
      <!-- Dataset Box -->
      <rect x="0" y="0" width="80" height="54" rx="3" fill="#ffffff" stroke="#16A34A" stroke-width="1.2"/>
      <text x="40" y="16" text-anchor="middle" font-size="8.5" font-weight="600" fill="#166534">Dataset D</text>
      <rect x="8" y="24" width="64" height="20" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
      <text x="40" y="37" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991B1B">Remove D_forget</text>

      <!-- Arrow -->
      <line x1="84" y1="27" x2="108" y2="27" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

      <!-- Retrain Box -->
      <rect x="114" y="0" width="80" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="154" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F407A">Train from</text>
      <text x="154" y="38" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F407A">Scratch</text>
    </g>

    <!-- Divider -->
    <line x1="15" y1="110" x2="215" y2="110" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Operational Properties -->
    <text x="15" y="128" font-size="9" font-weight="700" fill="#0F172A">Operational Profile</text>
    
    <text x="15" y="146" font-size="8" font-weight="600" fill="#475569">Guarantee:</text>
    <text x="15" y="159" font-size="8" fill="#166534">Exact unlearning (zero residue)</text>

    <text x="15" y="177" font-size="8" font-weight="600" fill="#475569">Corpus Access:</text>
    <text x="15" y="190" font-size="8" fill="#475569">Requires full training dataset</text>

    <text x="15" y="208" font-size="8" font-weight="600" fill="#475569">Primary Bottleneck:</text>
    <text x="15" y="221" font-size="8" fill="#DC2626">Extreme CapEx / OpEx cost</text>

    <!-- Scorecards -->
    <line x1="15" y1="236" x2="215" y2="236" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="15" y="254" font-size="8" font-weight="600" fill="#475569">Unlearning Fidelity:</text>
    <rect x="15" y="260" width="200" height="14" rx="2" fill="#E2E8F0"/>
    <rect x="15" y="260" width="200" height="14" rx="2" fill="#DCFCE7"/>
    <text x="115" y="271" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">100% (Provable Exact)</text>

    <text x="15" y="293" font-size="8" font-weight="600" fill="#475569">Compute Overhead:</text>
    <rect x="15" y="299" width="200" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8"/>
    <text x="115" y="312" text-anchor="middle" font-size="8" font-weight="700" fill="#991B1B">Full Training Run (O(days))</text>

    <text x="15" y="333" font-size="8" font-weight="600" fill="#475569">Serving Impact: <tspan font-weight="700" fill="#166534">Zero penalty</tspan></text>
  </g>

  <!-- ==================== CARD 2: GRADIENT ASCENT ==================== -->
  <g transform="translate(265, 18)">
    <rect width="230" height="348" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="230" height="28" rx="4" fill="#FEF3C7"/>
    <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309">Gradient Ascent (Approximate)</text>

    <!-- Diagram -->
    <g transform="translate(18, 42)">
      <!-- Forget Set Box -->
      <rect x="0" y="0" width="80" height="54" rx="3" fill="#ffffff" stroke="#DC2626" stroke-width="1.2"/>
      <text x="40" y="16" text-anchor="middle" font-size="8.5" font-weight="600" fill="#991B1B">Forget Set</text>
      <rect x="8" y="24" width="64" height="20" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
      <text x="40" y="37" text-anchor="middle" font-size="7.5" font-weight="700" fill="#DC2626">Maximize Loss</text>

      <!-- Arrow -->
      <line x1="84" y1="27" x2="108" y2="27" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

      <!-- Weight Update Box -->
      <rect x="114" y="0" width="80" height="54" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
      <text x="154" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">Ascent Step</text>
      <text x="154" y="38" text-anchor="middle" font-size="8" fill="#78350F">θ ← θ + η∇L</text>
    </g>

    <!-- Divider -->
    <line x1="15" y1="110" x2="215" y2="110" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Operational Properties -->
    <text x="15" y="128" font-size="9" font-weight="700" fill="#0F172A">Operational Profile</text>
    
    <text x="15" y="146" font-size="8" font-weight="600" fill="#475569">Guarantee:</text>
    <text x="15" y="159" font-size="8" fill="#B45309">Approximate (empirical heuristic)</text>

    <text x="15" y="177" font-size="8" font-weight="600" fill="#475569">Corpus Access:</text>
    <text x="15" y="190" font-size="8" fill="#475569">Only forget samples required</text>

    <text x="15" y="208" font-size="8" font-weight="600" fill="#475569">Primary Bottleneck:</text>
    <text x="15" y="221" font-size="8" fill="#DC2626">Collateral degradation / forgetting</text>

    <!-- Scorecards -->
    <line x1="15" y1="236" x2="215" y2="236" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="15" y="254" font-size="8" font-weight="600" fill="#475569">Unlearning Fidelity:</text>
    <rect x="15" y="260" width="200" height="14" rx="2" fill="#E2E8F0"/>
    <rect x="15" y="260" width="160" height="14" rx="2" fill="#FEF3C7"/>
    <text x="115" y="271" text-anchor="middle" font-size="7.5" font-weight="700" fill="#B45309">~80% (Approximate)</text>

    <text x="15" y="293" font-size="8" font-weight="600" fill="#475569">Compute Overhead:</text>
    <rect x="15" y="299" width="200" height="18" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8"/>
    <text x="115" y="312" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">Minutes (&lt; 0.1% cost)</text>

    <text x="15" y="333" font-size="8" font-weight="600" fill="#475569">Serving Impact: <tspan font-weight="700" fill="#166534">Zero penalty</tspan></text>
  </g>

  <!-- ==================== CARD 3: SISA ARCHITECTURE ==================== -->
  <g transform="translate(505, 18)">
    <rect width="230" height="348" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="230" height="28" rx="4" fill="#DCFCE7"/>
    <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">SISA Framework (Sharded)</text>

    <!-- Diagram -->
    <g transform="translate(18, 42)">
      <!-- Shard S1 -->
      <rect x="0" y="6" width="24" height="42" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
      <text x="12" y="30" text-anchor="middle" font-size="7.5" fill="#166534">S₁</text>

      <!-- Shard S2 -->
      <rect x="30" y="6" width="24" height="42" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
      <text x="42" y="30" text-anchor="middle" font-size="7.5" fill="#166534">S₂</text>

      <!-- Shard S3 (Target) -->
      <rect x="60" y="6" width="24" height="42" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
      <text x="72" y="24" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991B1B">S₃</text>
      <text x="72" y="38" text-anchor="middle" font-size="6.5" fill="#DC2626">retrain</text>

      <!-- Arrow -->
      <line x1="88" y1="27" x2="108" y2="27" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

      <!-- Retrained Shard Model -->
      <rect x="114" y="0" width="80" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="154" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F407A">Retrain</text>
      <text x="154" y="38" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F407A">Shard 3 Only</text>
    </g>

    <!-- Divider -->
    <line x1="15" y1="110" x2="215" y2="110" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Operational Properties -->
    <text x="15" y="128" font-size="9" font-weight="700" fill="#0F172A">Operational Profile</text>
    
    <text x="15" y="146" font-size="8" font-weight="600" fill="#475569">Guarantee:</text>
    <text x="15" y="159" font-size="8" fill="#166534">Exact unlearning (within shard)</text>

    <text x="15" y="177" font-size="8" font-weight="600" fill="#475569">Corpus Access:</text>
    <text x="15" y="190" font-size="8" fill="#475569">Only target shard data required</text>

    <text x="15" y="208" font-size="8" font-weight="600" fill="#475569">Primary Bottleneck:</text>
    <text x="15" y="221" font-size="8" fill="#475569">Serving aggregation overhead</text>

    <!-- Scorecards -->
    <line x1="15" y1="236" x2="215" y2="236" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="15" y="254" font-size="8" font-weight="600" fill="#475569">Unlearning Fidelity:</text>
    <rect x="15" y="260" width="200" height="14" rx="2" fill="#E2E8F0"/>
    <rect x="15" y="260" width="192" height="14" rx="2" fill="#DCFCE7"/>
    <text x="115" y="271" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">~96% (Shard-Exact)</text>

    <text x="15" y="293" font-size="8" font-weight="600" fill="#475569">Compute Overhead:</text>
    <rect x="15" y="299" width="200" height="18" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
    <text x="115" y="312" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">1 / K Shard Cost (≈ 5–10%)</text>

    <text x="15" y="333" font-size="8" font-weight="600" fill="#475569">Serving Impact: <tspan font-weight="700" fill="#D97706">K-model voting</tspan></text>
  </g>
</svg>
