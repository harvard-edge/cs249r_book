<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 192" role="img" aria-labelledby="title desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="title">Fairness tax slope</title>
  <desc id="desc">Two slope panels drawn at the same scale of 3 pixels per percentage point. Top panel, approval rate: Group A stays at 80 percent while Group B rises from 60 to 80 percent. Bottom panel, accuracy: falls from 85 to 81 percent, a 4-point drop.</desc>
  <rect width="180" height="192" fill="#ffffff"/>
  <!-- ===== Panel 1: approval rate (3 px per percentage point) ===== -->
  <text x="8" y="14" text-anchor="start" font-size="12" fill="#555555">approval</text>
  <line x1="70" y1="32" x2="136" y2="32" stroke="#bbbbbb" stroke-width="3"/>
  <line x1="70" y1="92" x2="136" y2="32" stroke="#333333" stroke-width="3.5"/>
  <circle cx="70" cy="32" r="4" fill="#bbbbbb"/>
  <circle cx="70" cy="92" r="4.5" fill="#333333"/>
  <circle cx="136" cy="32" r="4.5" fill="#333333"/>
  <text x="62" y="37" text-anchor="end" font-size="13" fill="#555555">A 80%</text>
  <text x="62" y="97" text-anchor="end" font-size="13" font-weight="700" fill="#333333">B 60%</text>
  <!-- ===== Panel divider ===== -->
  <line x1="8" y1="113" x2="172" y2="113" stroke="#cccccc" stroke-width="1"/>
  <!-- ===== Panel 2: accuracy (same 3 px per point) ===== -->
  <line x1="70" y1="134" x2="136" y2="146" stroke="#333333" stroke-width="2"/>
  <circle cx="70" cy="134" r="3.5" fill="#333333"/>
  <circle cx="136" cy="146" r="3.5" fill="#333333"/>
  <text x="62" y="139" text-anchor="end" font-size="13" fill="#333333">acc. 85%</text>
  <text x="144" y="151" text-anchor="start" font-size="13" fill="#333333">81%</text>
  <!-- ===== Shared column labels ===== -->
  <text x="70" y="182" text-anchor="middle" font-size="13" fill="#333333">base</text>
  <text x="136" y="182" text-anchor="middle" font-size="13" fill="#333333">parity</text>
</svg>
