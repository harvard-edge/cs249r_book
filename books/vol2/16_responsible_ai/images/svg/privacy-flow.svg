<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%">
  <rect width="680" height="340" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <linearGradient id="visibility-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#EA580C" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#D97706" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#16A34A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- ==================== 5 PIPELINE CARDS ==================== -->
  <!-- Width: 640px across 5 cards. w=115 each, gap=16.25. x=20, 151, 282, 413, 545 -->

  <!-- Card 1: Raw Data -->
  <g transform="translate(20, 20)">
    <rect width="116" height="114" rx="4" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.3"/>
    <rect width="116" height="20" rx="4" fill="#FEE2E2"/>
    <text x="58" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#991B1B">INPUT DOMAIN</text>
    <text x="58" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Raw Data</text>
    <line x1="10" y1="46" x2="106" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="58" y="60" text-anchor="middle" font-size="8" fill="#475569">Local user records</text>
    <text x="58" y="72" text-anchor="middle" font-size="8" fill="#475569">PII &amp; telemetry</text>
    <text x="58" y="84" text-anchor="middle" font-size="8" fill="#475569">Sensitive attributes</text>
    <rect x="10" y="92" width="96" height="14" rx="2" fill="#FEE2E2"/>
    <text x="58" y="102" text-anchor="middle" font-size="7" font-weight="700" fill="#991B1B">High Privacy Risk</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="136" y1="77" x2="151" y2="77" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Card 2: Differential Privacy -->
  <g transform="translate(151, 20)">
    <rect width="116" height="114" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.3"/>
    <rect width="116" height="20" rx="4" fill="#EAF1F8"/>
    <text x="58" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">PERTURBATION</text>
    <text x="58" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Diff. Privacy</text>
    <line x1="10" y1="46" x2="106" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="58" y="60" text-anchor="middle" font-size="8" fill="#475569">Calibrated noise</text>
    <text x="58" y="72" text-anchor="middle" font-size="8" fill="#475569">Laplace / Gaussian</text>
    <text x="58" y="84" text-anchor="middle" font-size="8" fill="#475569">Gradient clipping</text>
    <rect x="10" y="92" width="96" height="14" rx="2" fill="#EAF1F8"/>
    <text x="58" y="102" text-anchor="middle" font-size="7" font-weight="700" fill="#1F407A">(ε, δ)-DP Bound</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="267" y1="77" x2="282" y2="77" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Card 3: Federated Learning -->
  <g transform="translate(282, 20)">
    <rect width="116" height="114" rx="4" fill="#F8FAFC" stroke="#16A34A" stroke-width="1.3"/>
    <rect width="116" height="20" rx="4" fill="#DCFCE7"/>
    <text x="58" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">DECENTRALIZED</text>
    <text x="58" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Federated Learn</text>
    <line x1="10" y1="46" x2="106" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="58" y="60" text-anchor="middle" font-size="8" fill="#475569">On-device compute</text>
    <text x="58" y="72" text-anchor="middle" font-size="8" fill="#475569">Local updates Δw</text>
    <text x="58" y="84" text-anchor="middle" font-size="8" fill="#475569">Data stays on edge</text>
    <rect x="10" y="92" width="96" height="14" rx="2" fill="#DCFCE7"/>
    <text x="58" y="102" text-anchor="middle" font-size="7" font-weight="700" fill="#166534">Isolated Raw Data</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="398" y1="77" x2="413" y2="77" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Card 4: Secure Aggregation -->
  <g transform="translate(413, 20)">
    <rect width="116" height="114" rx="4" fill="#F8FAFC" stroke="#D97706" stroke-width="1.3"/>
    <rect width="116" height="20" rx="4" fill="#FEF3C7"/>
    <text x="58" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">CRYPTOGRAPHIC</text>
    <text x="58" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">SecAgg</text>
    <line x1="10" y1="46" x2="106" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="58" y="60" text-anchor="middle" font-size="8" fill="#475569">Zero-sum masks</text>
    <text x="58" y="72" text-anchor="middle" font-size="8" fill="#475569">Encrypted sums</text>
    <text x="58" y="84" text-anchor="middle" font-size="8" fill="#475569">Server sees ∑Δw</text>
    <rect x="10" y="92" width="96" height="14" rx="2" fill="#FEF3C7"/>
    <text x="58" y="102" text-anchor="middle" font-size="7" font-weight="700" fill="#B45309">Zero Client Leakage</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="529" y1="77" x2="545" y2="77" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Card 5: Global Model -->
  <g transform="translate(545, 20)">
    <rect width="115" height="114" rx="4" fill="#F8FAFC" stroke="#16A34A" stroke-width="1.5"/>
    <rect width="115" height="20" rx="4" fill="#DCFCE7"/>
    <text x="57.5" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">RESULT ARTIFACT</text>
    <text x="57.5" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Global Model</text>
    <line x1="10" y1="46" x2="105" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="57.5" y="60" text-anchor="middle" font-size="8" fill="#475569">FedAvg consensus</text>
    <text x="57.5" y="72" text-anchor="middle" font-size="8" fill="#475569">Broadcast to fleet</text>
    <text x="57.5" y="84" text-anchor="middle" font-size="8" fill="#475569">Certified bounds</text>
    <rect x="10" y="92" width="95" height="14" rx="2" fill="#DCFCE7"/>
    <text x="57.5" y="102" text-anchor="middle" font-size="7" font-weight="700" fill="#166534">Privacy Preserved</text>
  </g>

  <!-- ==================== ATTACKER OBSERVABILITY BAR ==================== -->
  <g transform="translate(20, 160)">
    <!-- Header strip -->
    <text x="0" y="12" font-size="8.5" font-weight="700" fill="#DC2626">Attacker Observability Surface:</text>
    <text x="640" y="12" text-anchor="end" font-size="8" font-weight="700" fill="#166534">Monotonically Decreasing Information Leakage ►</text>

    <!-- Gradient bar -->
    <rect x="0" y="20" width="640" height="14" rx="3" fill="url(#visibility-grad)" stroke="#CBD5E1" stroke-width="0.8"/>

    <!-- Step Guides -->
    <line x1="58" y1="34" x2="58" y2="50" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="189" y1="34" x2="189" y2="50" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="320" y1="34" x2="320" y2="50" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="451" y1="34" x2="451" y2="50" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="582" y1="34" x2="582" y2="50" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Bottom descriptions card -->
    <g transform="translate(0, 52)">
      <rect width="640" height="88" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

      <!-- Col 1 -->
      <text x="58" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">Full Exposure</text>
      <text x="58" y="34" text-anchor="middle" font-size="7.5" fill="#475569">Plaintext records</text>
      <text x="58" y="46" text-anchor="middle" font-size="7.5" fill="#475569">Direct re-identification</text>
      <text x="58" y="58" text-anchor="middle" font-size="7.5" fill="#475569">No defense</text>

      <!-- Col 2 -->
      <line x1="128" y1="8" x2="128" y2="80" stroke="#E2E8F0" stroke-width="1"/>
      <text x="189" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#EA580C">Noisy Statistics</text>
      <text x="189" y="34" text-anchor="middle" font-size="7.5" fill="#475569">Query responses masked</text>
      <text x="189" y="46" text-anchor="middle" font-size="7.5" fill="#475569">Formal privacy budget</text>
      <text x="189" y="58" text-anchor="middle" font-size="7.5" fill="#475569">Limits reconstruction</text>

      <!-- Col 3 -->
      <line x1="254" y1="8" x2="254" y2="80" stroke="#E2E8F0" stroke-width="1"/>
      <text x="320" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#D97706">Local Gradient Only</text>
      <text x="320" y="34" text-anchor="middle" font-size="7.5" fill="#475569">No raw data transmitted</text>
      <text x="320" y="46" text-anchor="middle" font-size="7.5" fill="#475569">Vulnerable to gradient</text>
      <text x="320" y="58" text-anchor="middle" font-size="7.5" fill="#475569">inversion if unmasked</text>

      <!-- Col 4 -->
      <line x1="386" y1="8" x2="386" y2="80" stroke="#E2E8F0" stroke-width="1"/>
      <text x="451" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">Encrypted Sum</text>
      <text x="451" y="34" text-anchor="middle" font-size="7.5" fill="#475569">Server inspects aggregate</text>
      <text x="451" y="46" text-anchor="middle" font-size="7.5" fill="#475569">Single client gradients</text>
      <text x="451" y="58" text-anchor="middle" font-size="7.5" fill="#475569">are information-theoretically hidden</text>

      <!-- Col 5 -->
      <line x1="517" y1="8" x2="517" y2="80" stroke="#E2E8F0" stroke-width="1"/>
      <text x="582" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">Population Model</text>
      <text x="582" y="34" text-anchor="middle" font-size="7.5" fill="#475569">Generalizes knowledge</text>
      <text x="582" y="46" text-anchor="middle" font-size="7.5" fill="#475569">Hardened against</text>
      <text x="582" y="58" text-anchor="middle" font-size="7.5" fill="#475569">membership inference</text>
    </g>
  </g>
</svg>
