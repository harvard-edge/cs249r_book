<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="625" height="270" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== Clients: raw records never leave ===== -->
  <rect x="15" y="20" width="150" height="230" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="90" y="40" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Clients</text>

  <rect x="28" y="55" width="124" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="90" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Local records</text>
  <text x="90" y="93" text-anchor="middle" font-size="11" fill="#475569">clipped update</text>

  <rect x="28" y="120" width="124" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="90" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Local records</text>
  <text x="90" y="158" text-anchor="middle" font-size="11" fill="#475569">clipped update</text>

  <rect x="28" y="185" width="124" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="90" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Local records</text>
  <text x="90" y="223" text-anchor="middle" font-size="11" fill="#475569">clipped update</text>

  <!-- ── Updates converge on secure aggregation ── -->
  <path d="M152,80 H175 V145" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M152,210 H175 V145" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <line x1="152" y1="145" x2="190" y2="145" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Secure aggregation protocol ===== -->
  <rect x="192" y="105" width="130" height="80" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="257" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Secure aggregation</text>
  <text x="257" y="151" text-anchor="middle" font-size="11" fill="#475569">bounded collusion</text>
  <text x="257" y="166" text-anchor="middle" font-size="11" fill="#475569">and dropout</text>

  <!-- ===== Trusted curator (central DP) ===== -->
  <rect x="345" y="40" width="150" height="190" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="1,2"/>
  <text x="420" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Trusted curator</text>

  <rect x="360" y="75" width="120" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="420" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Aggregate</text>
  <text x="420" y="113" text-anchor="middle" font-size="11" fill="#475569">+ calibrated noise</text>

  <rect x="360" y="155" width="120" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="420" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Privacy</text>
  <text x="420" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">accountant</text>

  <path d="M322,145 H335 V100 H358" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="420" y1="125" x2="420" y2="153" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ===== Public release boundary ===== -->
  <line x1="513" y1="20" x2="513" y2="250" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="521" y="36" font-size="11" fill="#475569">public</text>

  <path d="M480,180 H528" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="530" y="155" width="80" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="570" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Released</text>
  <text x="570" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">model</text>
</svg>
