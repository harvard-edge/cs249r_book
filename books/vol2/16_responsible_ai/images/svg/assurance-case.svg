<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="740" height="392" fill="#ffffff"/>
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== Assurance case for one stated use ===== -->
  <rect x="20" y="20" width="700" height="244" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="42" font-size="12.5" font-weight="700" fill="#334155">Assurance case</text>
  <text x="704" y="42" text-anchor="end" font-size="12.5" fill="#475569">one stated use and operating envelope</text>

  <!-- Evidence tiles -->
  <text x="40" y="70" font-size="12.5" font-weight="700" fill="#0f172a">Evidence</text>
  <rect x="40" y="80" width="150" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="115" y="97" text-anchor="middle" font-size="12.5" fill="#0f172a">Disaggregated results</text>
  <rect x="40" y="112" width="150" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="115" y="129" text-anchor="middle" font-size="12.5" fill="#0f172a">Audit reports</text>
  <rect x="40" y="144" width="150" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="115" y="161" text-anchor="middle" font-size="12.5" fill="#0f172a">Decision logs</text>
  <rect x="40" y="176" width="150" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="115" y="193" text-anchor="middle" font-size="12.5" fill="#0f172a">Documentation</text>

  <!-- Evidence bus into the argument -->
  <line x1="190" y1="93" x2="206" y2="93" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="190" y1="125" x2="206" y2="125" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="190" y1="157" x2="206" y2="157" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="190" y1="189" x2="206" y2="189" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="206" y1="93" x2="206" y2="189" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="206" y1="141" x2="231" y2="141" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Argument -->
  <rect x="232" y="108" width="132" height="66" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="298" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Argument</text>
  <text x="298" y="148" text-anchor="middle" font-size="12.5" fill="#334155">why the evidence</text>
  <text x="298" y="164" text-anchor="middle" font-size="12.5" fill="#334155">supports the claim</text>
  <line x1="364" y1="141" x2="389" y2="141" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Claim -->
  <rect x="390" y="108" width="132" height="66" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.6"/>
  <text x="456" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Claim</text>
  <text x="456" y="148" text-anchor="middle" font-size="12.5" fill="#334155">required property</text>
  <text x="456" y="164" text-anchor="middle" font-size="12.5" fill="#334155">for the stated use</text>
  <line x1="522" y1="141" x2="551" y2="141" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Accountable owner -->
  <rect x="552" y="108" width="150" height="66" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="627" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Accountable owner</text>
  <text x="627" y="148" text-anchor="middle" font-size="12.5" fill="#334155">can block, restrict,</text>
  <text x="627" y="164" text-anchor="middle" font-size="12.5" fill="#334155">or require remedy</text>
  <line x1="627" y1="174" x2="627" y2="191" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Launch decision -->
  <rect x="552" y="192" width="150" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="627" y="213" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Launch decision</text>
  <text x="627" y="230" text-anchor="middle" font-size="12.5" fill="#334155">launch, restrict, reject</text>

  <!-- Assumptions strip: the claim holds only inside these bounds -->
  <rect x="232" y="212" width="290" height="30" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="377" y="232" text-anchor="middle" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">Assumptions</tspan> population, setting, suppliers</text>
  <line x1="456" y1="212" x2="456" y2="175" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="298" y1="212" x2="298" y2="175" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ===== Expiry path ===== -->
  <rect x="40" y="298" width="200" height="64" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="140" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Material change</text>
  <text x="140" y="337" text-anchor="middle" font-size="12.5" fill="#334155">model, data, or corpus;</text>
  <text x="140" y="353" text-anchor="middle" font-size="12.5" fill="#334155">region, users, or workflow</text>
  <line x1="240" y1="330" x2="289" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="290" y="298" width="200" height="64" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="390" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Invalidation rule</text>
  <text x="390" y="337" text-anchor="middle" font-size="12.5" fill="#334155">states which change</text>
  <text x="390" y="353" text-anchor="middle" font-size="12.5" fill="#334155">forces revalidation</text>

  <path d="M490,330 H627 V243" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="637" y="300" font-size="12.5" fill="#b91c1c">approval</text>
  <text x="637" y="316" font-size="12.5" fill="#b91c1c">expires</text>
</svg>
