<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="620" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== Three score conditions ===== -->
  <rect x="20" y="20" width="170" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="105" y="41" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Group calibration</text>
  <text x="105" y="58" text-anchor="middle" font-size="10.5" fill="#475569">within each group</text>

  <rect x="225" y="20" width="170" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="310" y="41" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Positive-class balance</text>
  <text x="310" y="58" text-anchor="middle" font-size="10.5" fill="#475569">equal mean score, <tspan font-style="italic">Y</tspan> = 1</text>

  <rect x="430" y="20" width="170" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="515" y="41" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Negative-class balance</text>
  <text x="515" y="58" text-anchor="middle" font-size="10.5" fill="#475569">equal mean score, <tspan font-style="italic">Y</tspan> = 0</text>

  <!-- ── Converge ── -->
  <path d="M105,70 V90 H515 V70" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <line x1="310" y1="70" x2="310" y2="90" stroke="#64748b" stroke-width="1.2"/>
  <line x1="310" y1="90" x2="310" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Joint requirement ===== -->
  <rect x="220" y="110" width="180" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="310" y="134" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">All three jointly</text>

  <!-- ── Branch ── -->
  <path d="M270,150 V170 H130 V188" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M350,150 V170 H490 V188" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ===== Outcomes ===== -->
  <rect x="20" y="190" width="220" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="130" y="211" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">Cannot all hold</text>
  <text x="130" y="228" text-anchor="middle" font-size="10.5" fill="#475569">unequal base rates, imperfect prediction</text>

  <rect x="380" y="190" width="220" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="490" y="211" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Can all hold (exceptional)</text>
  <text x="490" y="228" text-anchor="middle" font-size="10.5" fill="#475569">equal base rates or perfect prediction</text>
</svg>
