<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%">
  <rect width="680" height="400" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- ==================== STAGE 1: INFERENCE LOGGING ==================== -->
  <g transform="translate(20, 20)">
    <rect width="105" height="92" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.3"/>
    <rect width="105" height="20" rx="4" fill="#EAF1F8"/>
    <text x="52.5" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">1 · COLLECT</text>
    <text x="52.5" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Predictions</text>
    <line x1="12" y1="46" x2="93" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="52.5" y="60" text-anchor="middle" font-size="8" fill="#475569">Inference stream</text>
    <text x="52.5" y="72" text-anchor="middle" font-size="8" fill="#475569">Logged features</text>
    <text x="52.5" y="84" text-anchor="middle" font-size="8" fill="#475569">&amp; metadata</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="125" y1="66" x2="155" y2="66" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 2: SUBGROUP METRICS ==================== -->
  <g transform="translate(155, 20)">
    <rect width="110" height="92" rx="4" fill="#F8FAFC" stroke="#16A34A" stroke-width="1.3"/>
    <rect width="110" height="20" rx="4" fill="#DCFCE7"/>
    <text x="55" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">2 · MEASURE</text>
    <text x="55" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Subgroup Drift</text>
    <line x1="12" y1="46" x2="98" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="55" y="60" text-anchor="middle" font-size="8" fill="#475569">FPR / TPR parity</text>
    <text x="55" y="72" text-anchor="middle" font-size="8" fill="#475569">Per demographic</text>
    <text x="55" y="84" text-anchor="middle" font-size="8" fill="#475569">slice G_i</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="265" y1="66" x2="295" y2="66" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 3: THRESHOLD CHECK ==================== -->
  <!-- Diamond centered at (345, 66) -->
  <polygon points="345,20 395,66 345,112 295,66" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <text x="345" y="61" text-anchor="middle" font-size="9" font-weight="700" fill="#B45309">Gap &gt; ε ?</text>
  <text x="345" y="74" text-anchor="middle" font-size="7.5" fill="#78350F">Threshold</text>

  <!-- Fail Arrow (Right to Alert) -->
  <line x1="395" y1="66" x2="425" y2="66" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arrow-red)"/>
  <text x="410" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#DC2626">YES</text>

  <!-- Pass Arrow (Down to OK) -->
  <line x1="345" y1="112" x2="345" y2="135" stroke="#16A34A" stroke-width="1.3" marker-end="url(#arrow-green)"/>
  <text x="355" y="126" font-size="8" font-weight="700" fill="#166534">NO</text>

  <!-- OK Box -->
  <g transform="translate(290, 137)">
    <rect width="110" height="34" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <text x="55" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">Serving Continues</text>
    <text x="55" y="27" text-anchor="middle" font-size="7.5" fill="#15803D">Parity delta within budget</text>
  </g>

  <!-- ==================== STAGE 4: ALERT ==================== -->
  <g transform="translate(425, 20)">
    <rect width="110" height="92" rx="4" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.3"/>
    <rect width="110" height="20" rx="4" fill="#FEE2E2"/>
    <text x="55" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#991B1B">4 · RESPOND</text>
    <text x="55" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">Fairness Alert</text>
    <line x1="12" y1="46" x2="98" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="55" y="60" text-anchor="middle" font-size="8" fill="#475569">Breach logged</text>
    <text x="55" y="72" text-anchor="middle" font-size="8" fill="#475569">Traffic throttled</text>
    <text x="55" y="84" text-anchor="middle" font-size="8" fill="#475569">Audit dispatch</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="535" y1="66" x2="560" y2="66" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 5: RETRAIN / UPDATE ==================== -->
  <g transform="translate(560, 20)">
    <rect width="100" height="92" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.3"/>
    <rect width="100" height="20" rx="4" fill="#EAF1F8"/>
    <text x="50" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">5 · IMPROVE</text>
    <text x="50" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Recalibration</text>
    <line x1="10" y1="46" x2="90" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="50" y="60" text-anchor="middle" font-size="8" fill="#475569">Bias-aware</text>
    <text x="50" y="72" text-anchor="middle" font-size="8" fill="#475569">re-weighting or</text>
    <text x="50" y="84" text-anchor="middle" font-size="8" fill="#475569">decision shift</text>
  </g>

  <!-- Feedback loop path from Stage 5 back to Stage 1 -->
  <path d="M 610,112 L 610,195 L 72,195 L 72,114" fill="none" stroke="#1F407A" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <rect x="230" y="186" width="220" height="18" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="340" y="199" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">Feedback Loop: Retrained weights redeployed</text>

  <!-- ==================== BOTTOM METRICS CARD ==================== -->
  <g transform="translate(20, 222)">
    <rect width="640" height="155" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="640" height="24" rx="4" fill="#F1F5F9"/>
    <text x="320" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A">Production Subgroup Metrics Tracked per Evaluation Window</text>

    <!-- Column 1: Accuracy Parity -->
    <g transform="translate(15, 34)">
      <rect width="190" height="78" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="190" height="18" rx="3" fill="#EAF1F8"/>
      <text x="95" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F407A">Accuracy &amp; Error Parity</text>
      <text x="12" y="32" font-size="8" font-weight="600" fill="#0F172A">|FPR_A − FPR_B| ≤ ε</text>
      <text x="12" y="46" font-size="7.8" fill="#475569">Threshold: ε = 0.05 max delta</text>
      <text x="12" y="59" font-size="7.8" fill="#475569">Window: Evaluated every 10k requests</text>
      <text x="12" y="71" font-size="7.8" fill="#64748B">Ensures uniform false positive penalty</text>
    </g>

    <!-- Column 2: Calibration Drift -->
    <g transform="translate(225, 34)">
      <rect width="190" height="78" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="190" height="18" rx="3" fill="#DCFCE7"/>
      <text x="95" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">Calibration by Demographic</text>
      <text x="12" y="32" font-size="8" font-weight="600" fill="#0F172A">|Pr(Y=1|score=s, G=g) − s|</text>
      <text x="12" y="46" font-size="7.8" fill="#475569">Threshold: ECE per group ≤ 0.02</text>
      <text x="12" y="59" font-size="7.8" fill="#475569">Window: Two-sample KS-test daily</text>
      <text x="12" y="71" font-size="7.8" fill="#64748B">Validates confidence score fidelity</text>
    </g>

    <!-- Column 3: Demographic Parity -->
    <g transform="translate(435, 34)">
      <rect width="190" height="78" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="190" height="18" rx="3" fill="#FEF3C7"/>
      <text x="95" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">Statistical Acceptance Rate</text>
      <text x="12" y="32" font-size="8" font-weight="600" fill="#0F172A">|Pr(Ŷ=1|G=a) − Pr(Ŷ=1|G=b)|</text>
      <text x="12" y="46" font-size="7.8" fill="#475569">Threshold: Adverse impact ratio &gt; 0.80</text>
      <text x="12" y="59" font-size="7.8" fill="#475569">Window: Rolling 24-hour baseline</text>
      <text x="12" y="71" font-size="7.8" fill="#64748B">Detects systemic population shifts</text>
    </g>

    <!-- Bottom Telemetry Chip -->
    <rect x="15" y="122" width="610" height="22" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="320" y="136" text-anchor="middle" font-size="7.8" font-weight="600" fill="#475569">
      Telemetry Overhead: +12 ms logging per inference · ~1.7 GB/day per 100M queries · 150 active monitor rules per model
    </text>
  </g>
</svg>
