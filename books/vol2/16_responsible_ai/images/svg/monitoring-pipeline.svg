<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="560" height="192" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- ===== 1 Collect ===== -->
  <rect x="14" y="16" width="96" height="72" rx="3" fill="#F5F8FC" stroke="#1F407A" stroke-width="1.2"/>
  <path d="M14.6,36 V19 Q14.6,16.6 17,16.6 H107 Q109.4,16.6 109.4,19 V36 Z" fill="#EAF1F8"/>
  <text x="62" y="30" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">1 · Collect</text>
  <text x="62" y="56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Predictions</text>
  <text x="62" y="74" text-anchor="middle" font-size="9.5" fill="#475569">features, metadata</text>

  <line x1="110" y1="52" x2="126" y2="52" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>

  <!-- ===== 2 Measure ===== -->
  <rect x="128" y="16" width="96" height="72" rx="3" fill="#F7FDF9" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M128.6,36 V19 Q128.6,16.6 131,16.6 H221 Q223.4,16.6 223.4,19 V36 Z" fill="#dcfce7"/>
  <text x="176" y="30" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">2 · Measure</text>
  <text x="176" y="56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Subgroup drift</text>
  <text x="176" y="74" text-anchor="middle" font-size="9.5" fill="#475569">FPR, TPR per G<tspan baseline-shift="sub" font-size="8">i</tspan></text>

  <line x1="224" y1="52" x2="240" y2="52" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>

  <!-- ===== 3 Threshold check ===== -->
  <polygon points="280,14 318,52 280,90 242,52" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="280" y="48" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">3 · Check</text>
  <text x="280" y="61" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">gap &gt; ε<tspan baseline-shift="sub" font-size="7">fair</tspan>?</text>

  <!-- yes: alert -->
  <line x1="318" y1="52" x2="334" y2="52" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="326" y="42" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">yes</text>

  <!-- no: serving continues -->
  <line x1="280" y1="90" x2="280" y2="114" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="287" y="106" font-size="9" font-weight="700" fill="#15803d">no</text>
  <rect x="222" y="116" width="116" height="26" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="280" y="133" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Serving continues</text>

  <!-- ===== 4 Respond ===== -->
  <rect x="336" y="16" width="96" height="72" rx="3" fill="#FEF7F7" stroke="#dc2626" stroke-width="1.2"/>
  <path d="M336.6,36 V19 Q336.6,16.6 339,16.6 H429 Q431.4,16.6 431.4,19 V36 Z" fill="#fee2e2"/>
  <text x="384" y="30" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">4 · Respond</text>
  <text x="384" y="56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Fairness alert</text>
  <text x="384" y="74" text-anchor="middle" font-size="9.5" fill="#475569">log, page, audit</text>

  <line x1="432" y1="52" x2="448" y2="52" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>

  <!-- ===== 5 Improve ===== -->
  <rect x="450" y="16" width="96" height="72" rx="3" fill="#F5F8FC" stroke="#1F407A" stroke-width="1.2"/>
  <path d="M450.6,36 V19 Q450.6,16.6 453,16.6 H543 Q545.4,16.6 545.4,19 V36 Z" fill="#EAF1F8"/>
  <text x="498" y="30" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">5 · Improve</text>
  <text x="498" y="56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Recalibrate</text>
  <text x="498" y="74" text-anchor="middle" font-size="9.5" fill="#475569">reweight or shift</text>

  <!-- ===== Feedback loop ===== -->
  <path d="M498,88 V172 H62 V90" fill="none" stroke="#1F407A" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <rect x="160" y="163" width="240" height="18" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="280" y="176" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F407A">validated update after authorized release</text>
</svg>
