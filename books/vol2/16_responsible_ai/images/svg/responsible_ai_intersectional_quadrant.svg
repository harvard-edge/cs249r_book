<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 190 142" role="img" aria-labelledby="title desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="title">Intersectional accuracy grid</title>
  <desc id="desc">Two-by-two grid of IBM gender-classifier accuracy in the Gender Shades audit: lighter-skinned men 99.7 percent in the lightest gray cell, lighter-skinned women and darker-skinned men in progressively darker gray cells, and darker-skinned women 65.3 percent in red.</desc>
  <rect width="190" height="142" fill="#ffffff"/>
  <text x="95" y="24" font-size="13" fill="#555555" text-anchor="middle">men</text>
  <text x="155" y="24" font-size="13" fill="#555555" text-anchor="middle">women</text>
  <text x="61" y="66" font-size="13" fill="#555555" text-anchor="end">lighter</text>
  <text x="61" y="116" font-size="13" fill="#555555" text-anchor="end">darker</text>
  <rect x="67" y="36" width="56" height="46" fill="#f0f0f0"/>
  <rect x="127" y="36" width="56" height="46" fill="#dadada"/>
  <rect x="67" y="86" width="56" height="46" fill="#c4c4c4"/>
  <rect x="127" y="86" width="56" height="46" fill="#DC2626"/>
  <text x="95" y="64" font-size="14" fill="#555555" text-anchor="middle">99.7%</text>
  <text x="155" y="114" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">65.3%</text>
</svg>
