<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="560" height="222" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== Boxes ===== -->
  <rect x="20" y="16" width="170" height="56" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="105" y="40" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">True goal</text>
  <text x="105" y="58" text-anchor="middle" font-size="10" fill="#334155">long-term user value</text>

  <rect x="370" y="16" width="170" height="56" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="455" y="40" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">Proxy metric</text>
  <text x="455" y="58" text-anchor="middle" font-size="10" fill="#334155">maximize clicks</text>

  <rect x="370" y="150" width="170" height="56" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.3"/>
  <text x="455" y="174" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">ML recommender</text>
  <text x="455" y="192" text-anchor="middle" font-size="10" fill="#334155">optimizes the proxy</text>

  <rect x="20" y="150" width="170" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="105" y="174" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">Observed behavior</text>
  <text x="105" y="192" text-anchor="middle" font-size="10" fill="#334155">clickbait, outrage, filter bubbles</text>

  <!-- ===== Goal is replaced by a proxy ===== -->
  <line x1="190" y1="44" x2="368" y2="44" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <text x="280" y="37" text-anchor="middle" font-size="9.5" fill="#475569">measured by</text>

  <!-- ===== Proxy becomes the reward ===== -->
  <line x1="455" y1="72" x2="455" y2="148" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <text x="447" y="114" text-anchor="end" font-size="9.5" fill="#475569">reward</text>

  <!-- ===== Reinforcing loop between model and behavior ===== -->
  <line x1="370" y1="166" x2="192" y2="166" stroke="#1F407A" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <text x="280" y="160" text-anchor="middle" font-size="9.5" fill="#475569">serves</text>
  <line x1="190" y1="190" x2="368" y2="190" stroke="#1F407A" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="280" y="204" text-anchor="middle" font-size="9.5" fill="#475569">clicks become training data</text>

  <!-- ===== Behavior undermines the goal ===== -->
  <line x1="105" y1="150" x2="105" y2="74" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="113" y="114" font-size="9.5" fill="#b91c1c">undermines</text>
</svg>
