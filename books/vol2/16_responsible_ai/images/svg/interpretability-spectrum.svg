<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 395" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <linearGradient id="spectrum-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F407A"/>
      <stop offset="35%" stop-color="#0D9488"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- ==================== TOP GROUPING CATEGORIES ==================== -->
  <g transform="translate(20, 14)">
    <!-- Group 1: Inherently Interpretable -->
    <rect x="0" y="0" width="374" height="26" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="187" y="17" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">Inherently Interpretable (Transparent by Construction)</text>

    <!-- Group 2: Posthoc Explanations Required -->
    <rect x="386" y="0" width="374" height="26" rx="4" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1"/>
    <text x="573" y="17" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B21A8">Surrogate Attribution Required (Post-Hoc Analysis)</text>
  </g>

  <!-- ==================== MAIN SPECTRUM TRACK ==================== -->
  <g transform="translate(20, 48)">
    <rect x="0" y="6" width="760" height="6" rx="3" fill="url(#spectrum-grad)"/>

    <!-- Left Indicator -->
    <polygon points="0,9 8,3 8,15" fill="#1F407A"/>
    <text x="14" y="23" font-size="8" font-weight="700" fill="#1F407A">HIGH TRANSPARENCY / EXACT REASONING</text>

    <!-- Right Indicator -->
