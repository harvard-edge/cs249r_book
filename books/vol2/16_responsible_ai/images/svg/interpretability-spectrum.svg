    <rect x="0" y="0" width="118" height="22" rx="4" fill="#EAF1F8"/>
    <text x="59" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">INHERENT</text>

    <text x="8" y="38" font-size="10.5" font-weight="700" fill="#0F172A">Linear Models</text>
    <text x="8" y="50" font-size="8" fill="#64748B">GLM / GAMs</text>

    <line x1="8" y1="56" x2="110" y2="56" stroke="#E2E8F0" stroke-width="1"/>
    <text x="8" y="69" font-size="8.5" font-weight="700" fill="#0F172A">Mechanism:</text>
    <text x="8" y="82" font-size="8" fill="#475569">Additive weights βᵢ</text>
    <text x="8" y="94" font-size="8" fill="#475569">Direct marginal effect</text>
    <text x="8" y="106" font-size="8" fill="#475569">Monotonic response</text>

