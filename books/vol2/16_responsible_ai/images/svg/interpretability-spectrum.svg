    <text x="8" y="82" font-size="8" fill="#475569">Branching predicates</text>
    <text x="8" y="94" font-size="8" fill="#475569">Disjunctive normal form</text>
    <text x="8" y="106" font-size="8" fill="#475569">Bounded tree depth</text>

    <line x1="8" y1="114" x2="110" y2="114" stroke="#E2E8F0" stroke-width="1"/>
    <text x="8" y="128" font-size="8.5" font-weight="700" fill="#0F172A">Audit Strength:</text>
