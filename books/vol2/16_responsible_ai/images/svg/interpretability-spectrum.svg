  <!-- ==================== BOTTOM TRADE-OFFS TABLE ==================== -->
  <g transform="translate(20, 276)">
    <rect x="0" y="0" width="760" height="105" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Row 1: Serving Latency & Compute -->
    <g transform="translate(15, 20)">
      <g>
        <rect x="0" y="-8" width="140" height="18" rx="3" fill="#E2E8F0"/>
        <text x="70" y="4" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Serving Latency &amp; Cost</text>
      </g>
      
      <line x1="155" y1="0" x2="720" y2="0" stroke="#CBD5E1" stroke-width="1.5"/>
      <polygon points="725,0 718,-3 718,3" fill="#64748B"/>
      
      <text x="160" y="13" font-size="8" font-weight="600" fill="#166534">&lt; 1 ms (Single CPU core, minimal RAM)</text>
      <text x="435" y="13" font-size="8" font-weight="600" fill="#B45309">5–20 ms (Vectorized)</text>
      <text x="720" y="13" text-anchor="end" font-size="8" font-weight="600" fill="#991B1B">50–500+ ms (Multi-GPU Fleet)</text>
    </g>

    <!-- Row 2: Regulatory Auditability -->
    <g transform="translate(15, 52)">
      <g>
        <rect x="0" y="-8" width="140" height="18" rx="3" fill="#E2E8F0"/>
        <text x="70" y="4" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Regulatory Auditability</text>
      </g>
      
      <line x1="155" y1="0" x2="720" y2="0" stroke="#CBD5E1" stroke-width="1.5"/>
      <polygon points="150,0 157,-3 157,3" fill="#1F407A"/>
      
      <text x="160" y="13" font-size="8" font-weight="600" fill="#1F407A">Direct mathematical proof (court defensible)</text>
      <text x="435" y="13" font-size="8" font-weight="600" fill="#7E22CE">Surrogate-dependent (approximate)</text>
      <text x="720" y="13" text-anchor="end" font-size="8" font-weight="600" fill="#991B1B">Heuristic / Plausible Rationales</text>
    </g>

    <!-- Row 3: Expressive Capacity -->
