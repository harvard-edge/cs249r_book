<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean canvas background with zero outer border stroke -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #1a202c; }
      .text-body  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 500; fill: #4a5568; }
      .text-chip  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8px; font-weight: 700; }
      .text-sub   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #718096; }
      .text-bold  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 700; }
      .text-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; }
    </style>

    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#718096"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2b6cb0"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#6b46c1"/>
    </marker>

    <linearGradient id="spectrum-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#319795"/>
      <stop offset="35%" stop-color="#3182ce"/>
      <stop offset="70%" stop-color="#805ad5"/>
      <stop offset="100%" stop-color="#e53e3e"/>
    </linearGradient>
  </defs>

  <!-- ==================== TOP GROUPING CATEGORIES ==================== -->
  <g transform="translate(20, 16)">
    <!-- Group 1: Inherently Interpretable -->
    <rect x="0" y="0" width="370" height="28" rx="4" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1"/>
    <text x="185" y="18" text-anchor="middle" class="text-bold" fill="#22543d">INHERENTLY INTERPRETABLE (Transparent by Design)</text>

    <!-- Group 2: Posthoc Explanations Required -->
    <rect x="390" y="0" width="370" height="28" rx="4" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1"/>
    <text x="575" y="18" text-anchor="middle" class="text-bold" fill="#553c9e">POSTHOC EXPLANATIONS REQUIRED (Surrogate Models)</text>
  </g>

  <!-- ==================== MAIN SPECTRUM ARROW BAR ==================== -->
  <g transform="translate(20, 56)">
    <!-- Gradient Track -->
    <rect x="0" y="6" width="760" height="6" rx="3" fill="url(#spectrum-grad)"/>

    <!-- Left Indicator -->
    <polygon points="0,9 10,2 10,16" fill="#319795"/>
    <text x="18" y="24" class="text-chip" fill="#234e52">◄ HIGH TRANSPARENCY / EXACT REASONING</text>

    <!-- Right Indicator -->
    <polygon points="760,9 750,2 750,16" fill="#e53e3e"/>
    <text x="742" y="24" text-anchor="end" class="text-chip" fill="#9b2c2c">HIGH CAPACITY / OPAQUE BEHAVIOR ►</text>
  </g>

  <!-- ==================== 6 MODEL FAMILY CARDS ==================== -->
  <!-- Total width = 760. 6 cards with width=118, spacing=10. -->
  <!-- Positions: 20, 148, 276, 404, 532, 660 -->

  <!-- Card 1: Linear & Logistic Models -->
  <g transform="translate(20, 92)">
    <rect x="0" y="0" width="118" height="175" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="6" y="6" width="58" height="15" rx="2" fill="#c6f6d5"/>
    <text x="35" y="16.5" text-anchor="middle" class="text-chip" fill="#22543d">INHERENT</text>
    <text x="6" y="36" class="text-title" fill="#22543d">Linear &amp; Logistic</text>
    <text x="6" y="47" class="text-sub">Regression / GAMs</text>

    <line x1="6" y1="54" x2="112" y2="54" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="68" class="text-bold" fill="#2d3748">Mechanism:</text>
    <text x="6" y="80" class="text-body">• Additive weights β_i</text>
    <text x="6" y="92" class="text-body">• Direct unit effect</text>
    <text x="6" y="104" class="text-body">• Monotonic bounds</text>

    <line x1="6" y1="112" x2="112" y2="112" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="126" class="text-bold" fill="#2d3748">Audit Strength:</text>
    <text x="6" y="138" class="text-body">Exact coefficient</text>
    <text x="6" y="149" class="text-body">verification;</text>
    <text x="6" y="160" class="text-body">zero surrogate bias</text>
  </g>

  <!-- Card 2: Decision Trees & Rule Sets -->
  <g transform="translate(148, 92)">
    <rect x="0" y="0" width="118" height="175" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="6" y="6" width="58" height="15" rx="2" fill="#c6f6d5"/>
    <text x="35" y="16.5" text-anchor="middle" class="text-chip" fill="#22543d">INHERENT</text>
    <text x="6" y="36" class="text-title" fill="#22543d">Decision Trees</text>
    <text x="6" y="47" class="text-sub">CART / Rule Lists</text>

    <line x1="6" y1="54" x2="112" y2="54" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="68" class="text-bold" fill="#2d3748">Mechanism:</text>
    <text x="6" y="80" class="text-body">• Branch predicates</text>
    <text x="6" y="92" class="text-body">• If-then rule paths</text>
    <text x="6" y="104" class="text-body">• Bounded tree depth</text>

    <line x1="6" y1="112" x2="112" y2="112" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="126" class="text-bold" fill="#2d3748">Audit Strength:</text>
    <text x="6" y="138" class="text-body">Transparent split</text>
    <text x="6" y="149" class="text-body">logic; immediate</text>
    <text x="6" y="160" class="text-body">stakeholder trace</text>
  </g>

  <!-- Card 3: Prototype & Sparse Hybrid Models -->
  <g transform="translate(276, 92)">
    <rect x="0" y="0" width="118" height="175" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="6" y="6" width="50" height="15" rx="2" fill="#e6fffa"/>
    <text x="31" y="16.5" text-anchor="middle" class="text-chip" fill="#234e52">HYBRID</text>
    <text x="6" y="36" class="text-title" fill="#234e52">Prototype Models</text>
    <text x="6" y="47" class="text-sub">ProtoPNet / CBMs</text>

    <line x1="6" y1="54" x2="112" y2="54" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="68" class="text-bold" fill="#2d3748">Mechanism:</text>
    <text x="6" y="80" class="text-body">• Learned exemplars</text>
    <text x="6" y="92" class="text-body">• Case-based analogy</text>
    <text x="6" y="104" class="text-body">• Concept bottlenecks</text>

    <line x1="6" y1="112" x2="112" y2="112" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="126" class="text-bold" fill="#2d3748">Audit Strength:</text>
    <text x="6" y="138" class="text-body">Interpretable parts;</text>
    <text x="6" y="149" class="text-body">requires exemplar</text>
    <text x="6" y="160" class="text-body">indexing at serve</text>
  </g>

  <!-- Card 4: Random Forests & Boosted Trees -->
  <g transform="translate(404, 92)">
    <rect x="0" y="0" width="118" height="175" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="6" y="6" width="56" height="15" rx="2" fill="#feebc8"/>
    <text x="34" y="16.5" text-anchor="middle" class="text-chip" fill="#c05621">POSTHOC</text>
    <text x="6" y="36" class="text-title" fill="#c05621">Tree Ensembles</text>
    <text x="6" y="47" class="text-sub">Random Forest / GBDT</text>

    <line x1="6" y1="54" x2="112" y2="54" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="68" class="text-bold" fill="#2d3748">Mechanism:</text>
    <text x="6" y="80" class="text-body">• Hundreds of trees</text>
    <text x="6" y="92" class="text-body">• Weighted voting</text>
    <text x="6" y="104" class="text-body">• High interaction</text>

    <line x1="6" y1="112" x2="112" y2="112" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="126" class="text-bold" fill="#2d3748">Attribution Tool:</text>
    <text x="6" y="138" class="text-body">TreeSHAP (exact</text>
    <text x="6" y="149" class="text-body">Shapley in poly-time);</text>
    <text x="6" y="160" class="text-body">feature gain ranking</text>
  </g>

  <!-- Card 5: Deep Neural Networks -->
  <g transform="translate(532, 92)">
    <rect x="0" y="0" width="118" height="175" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="6" y="6" width="56" height="15" rx="2" fill="#e9d8fd"/>
    <text x="34" y="16.5" text-anchor="middle" class="text-chip" fill="#553c9e">POSTHOC</text>
    <text x="6" y="36" class="text-title" fill="#553c9e">Deep Neural Nets</text>
    <text x="6" y="47" class="text-sub">MLPs / CNNs / ResNets</text>

    <line x1="6" y1="54" x2="112" y2="54" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="68" class="text-bold" fill="#2d3748">Mechanism:</text>
    <text x="6" y="80" class="text-body">• Layered activations</text>
    <text x="6" y="92" class="text-body">• Latent embeddings</text>
    <text x="6" y="104" class="text-body">• Non-linear tensor ops</text>

    <line x1="6" y1="112" x2="112" y2="112" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="126" class="text-bold" fill="#2d3748">Attribution Tool:</text>
    <text x="6" y="138" class="text-body">Grad-CAM, Saliency,</text>
    <text x="6" y="149" class="text-body">Integrated Gradients,</text>
    <text x="6" y="160" class="text-body">KernelSHAP / LIME</text>
  </g>

  <!-- Card 6: Transformers & Foundation Models -->
  <g transform="translate(660, 92)">
    <rect x="0" y="0" width="120" height="175" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="6" y="6" width="50" height="15" rx="2" fill="#fed7d7"/>
    <text x="31" y="16.5" text-anchor="middle" class="text-chip" fill="#9b2c2c">OPAQUE</text>
    <text x="6" y="36" class="text-title" fill="#9b2c2c">Foundation LLMs</text>
    <text x="6" y="47" class="text-sub">Transformers / Multimodal</text>

    <line x1="6" y1="54" x2="114" y2="54" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="68" class="text-bold" fill="#2d3748">Mechanism:</text>
    <text x="6" y="80" class="text-body">• Billions of weights</text>
    <text x="6" y="92" class="text-body">• Multi-head attention</text>
    <text x="6" y="104" class="text-body">• Emergent reasoning</text>

    <line x1="6" y1="112" x2="114" y2="112" stroke="#edf2f7" stroke-width="1"/>
    <text x="6" y="126" class="text-bold" fill="#2d3748">Attribution Tool:</text>
    <text x="6" y="138" class="text-body">Attention rollout,</text>
    <text x="6" y="149" class="text-body">TCAV concept tests,</text>
    <text x="6" y="160" class="text-body">mechanistic probes</text>
  </g>

  <!-- ==================== BOTTOM TRADE-OFFS TABLE ==================== -->
  <g transform="translate(20, 280)">
    <rect x="0" y="0" width="760" height="105" rx="4" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Row 1: Serving Latency & Compute -->
    <g transform="translate(15, 20)">
      <rect x="0" y="-8" width="135" height="16" rx="2" fill="#edf2f7"/>
      <text x="6" y="3.5" class="text-bold" fill="#2d3748">Serving Latency &amp; Cost</text>
      
      <!-- Indicator Track -->
      <line x1="150" y1="0" x2="725" y2="0" stroke="#cbd5e0" stroke-width="2"/>
      <polygon points="730,0 722,-3.5 722,3.5" fill="#718096"/>
      
      <text x="155" y="12" class="text-mono" fill="#276749">&lt; 1 ms (Single CPU core, minimal RAM)</text>
      <text x="430" y="12" class="text-mono" fill="#c05621">5–20 ms (Vectorized)</text>
      <text x="725" y="12" text-anchor="end" class="text-mono" fill="#9b2c2c">50–500+ ms (Multi-GPU Fleet)</text>
    </g>

    <!-- Row 2: Regulatory Auditability -->
    <g transform="translate(15, 52)">
      <rect x="0" y="-8" width="135" height="16" rx="2" fill="#edf2f7"/>
      <text x="6" y="3.5" class="text-bold" fill="#2d3748">Regulatory Auditability</text>
      
      <!-- Indicator Track -->
      <line x1="150" y1="0" x2="725" y2="0" stroke="#cbd5e0" stroke-width="2"/>
      <polygon points="145,0 153,-3.5 153,3.5" fill="#319795"/>
      
      <text x="155" y="12" class="text-mono" fill="#234e52">Direct proof (Defensible in court)</text>
      <text x="430" y="12" class="text-mono" fill="#553c9e">Surrogate-dependent</text>
      <text x="725" y="12" text-anchor="end" class="text-mono" fill="#9b2c2c">Heuristic / Plausible Rationales</text>
    </g>

    <!-- Row 3: Representational Capacity -->
    <g transform="translate(15, 84)">
      <rect x="0" y="-8" width="135" height="16" rx="2" fill="#edf2f7"/>
      <text x="6" y="3.5" class="text-bold" fill="#2d3748">Expressive Capacity</text>
      
      <!-- Indicator Track -->
      <line x1="150" y1="0" x2="725" y2="0" stroke="#cbd5e0" stroke-width="2"/>
      <polygon points="730,0 722,-3.5 722,3.5" fill="#718096"/>
      
      <text x="155" y="12" class="text-mono" fill="#4a5568">Low dimensional / tabular patterns</text>
      <text x="430" y="12" class="text-mono" fill="#4a5568">Nonlinear interactions</text>
      <text x="725" y="12" text-anchor="end" class="text-mono" fill="#2b6cb0">Unstructured multimodal semantics</text>
    </g>
  </g>
</svg>
