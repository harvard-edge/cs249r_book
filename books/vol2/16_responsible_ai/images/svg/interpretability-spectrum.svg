    <text x="8" y="141" font-size="8" fill="#475569">Grad-CAM, Saliency,</text>
    <text x="8" y="153" font-size="8" fill="#475569">Integrated Gradients,</text>
    <text x="8" y="165" font-size="8" fill="#475569">KernelSHAP / LIME</text>
