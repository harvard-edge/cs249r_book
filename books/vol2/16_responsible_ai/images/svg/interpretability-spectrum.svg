    <text x="8" y="128" font-size="8.5" font-weight="700" fill="#0F172A">Audit Strength:</text>
    <text x="8" y="141" font-size="8" fill="#475569">Exact coefficient proof;</text>
    <text x="8" y="153" font-size="8" fill="#475569">defensible in regulatory</text>
    <text x="8" y="165" font-size="8" fill="#475569">compliance reviews</text>
  </g>

