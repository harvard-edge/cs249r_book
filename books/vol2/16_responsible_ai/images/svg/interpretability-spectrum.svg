      <g>
        <rect x="0" y="-8" width="140" height="18" rx="3" fill="#E2E8F0"/>
        <text x="70" y="4" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Expressive Capacity</text>
      </g>
      
      <line x1="155" y1="0" x2="720" y2="0" stroke="#CBD5E1" stroke-width="1.5"/>
      <polygon points="725,0 718,-3 718,3" fill="#64748B"/>
      
      <text x="160" y="13" font-size="8" fill="#475569">Low-dimensional / tabular patterns</text>
      <text x="435" y="13" font-size="8" fill="#475569">Nonlinear feature interactions</text>
      <text x="720" y="13" text-anchor="end" font-size="8" font-weight="600" fill="#1F407A">Unstructured multimodal representations</text>
