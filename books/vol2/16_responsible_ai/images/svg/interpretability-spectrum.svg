    <text x="8" y="82" font-size="8" fill="#475569">O(100B) parameters</text>
    <text x="8" y="94" font-size="8" fill="#475569">Multi-head attention</text>
    <text x="8" y="106" font-size="8" fill="#475569">Emergent reasoning</text>

    <line x1="8" y1="114" x2="110" y2="114" stroke="#E2E8F0" stroke-width="1"/>
    <text x="8" y="128" font-size="8.5" font-weight="700" fill="#0F172A">Attribution Tool:</text>
    <text x="8" y="141" font-size="8" fill="#475569">Attention rollout,</text>
    <text x="8" y="153" font-size="8" fill="#475569">TCAV concept vectors,</text>
    <text x="8" y="165" font-size="8" fill="#475569">mechanistic circuits</text>
