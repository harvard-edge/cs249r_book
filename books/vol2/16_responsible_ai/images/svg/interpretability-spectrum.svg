    <text x="8" y="38" font-size="10.5" font-weight="700" fill="#0F172A">Prototypes / CBM</text>
    <text x="8" y="50" font-size="8" fill="#64748B">ProtoPNet / Concept</text>

    <line x1="8" y1="56" x2="110" y2="56" stroke="#E2E8F0" stroke-width="1"/>
    <text x="8" y="69" font-size="8.5" font-weight="700" fill="#0F172A">Mechanism:</text>
    <text x="8" y="82" font-size="8" fill="#475569">Learned exemplars</text>
