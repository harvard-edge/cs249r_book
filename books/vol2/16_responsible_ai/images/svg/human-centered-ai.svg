<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="560" height="262" fill="#ffffff"/>
  <!-- ── Government and society ── -->
  <rect x="10" y="10" width="540" height="242" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="22" y="31" font-size="11" font-weight="700" fill="#334155">Government and society</text>
  <rect x="333" y="17" width="207" height="20" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="0.9"/>
  <text x="436.5" y="31" text-anchor="middle" font-size="9.5" fill="#334155">GDPR, EU AI Act, sector-specific law</text>
  <!-- ── Industry ── -->
  <rect x="30" y="42" width="500" height="200" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="42" y="63" font-size="11" font-weight="700" fill="#92400e">Industry</text>
  <rect x="345" y="49" width="175" height="20" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="0.9"/>
  <text x="432.5" y="63" text-anchor="middle" font-size="9.5" fill="#92400e">ISO standards, external audits</text>
  <!-- ── Organization ── -->
  <rect x="50" y="74" width="460" height="158" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="62" y="95" font-size="11" font-weight="700" fill="#15803d">Organization</text>
  <rect x="267" y="81" width="233" height="20" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="0.9"/>
  <text x="383.5" y="95" text-anchor="middle" font-size="9.5" fill="#15803d">Impact assessments, ethical review boards</text>
  <!-- ── Development team ── -->
  <rect x="70" y="106" width="420" height="116" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.3"/>
  <text x="82" y="127" font-size="11" font-weight="700" fill="#14294E">Development team</text>
  <rect x="241" y="113" width="239" height="20" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="0.9"/>
  <text x="360.5" y="127" text-anchor="middle" font-size="9.5" fill="#14294E">Fairness testing, model cards, red-teaming</text>
  <!-- ── Core ── -->
  <rect x="210" y="152" width="140" height="48" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.5"/>
  <text x="280" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">AI system</text>
  <text x="280" y="189" text-anchor="middle" font-size="9.5" fill="#334155">model and infrastructure</text>
</svg>
