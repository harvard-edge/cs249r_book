<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="370" fill="#ffffff"/>
  <!-- Government and society: the norm it enforces is drawn as its wall -->
  <rect x="20" y="30" width="660" height="320" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="34" y="63" font-size="13" font-weight="700" fill="#14294E">Government and society</text>
  <!-- Industry: the norm it enforces is drawn as its wall -->
  <rect x="60" y="82" width="580" height="250" rx="4" fill="#e3ebf4" stroke="#7489a6" stroke-width="1.6"/>
  <text x="74" y="115" font-size="13" font-weight="700" fill="#14294E">Industry</text>
  <!-- Organization: the norm it enforces is drawn as its wall -->
  <rect x="100" y="134" width="500" height="180" rx="4" fill="#cddcec" stroke="#4a6a94" stroke-width="1.6"/>
  <text x="114" y="167" font-size="13" font-weight="700" fill="#14294E">Organization</text>
  <!-- Development team: the norm it enforces is drawn as its wall -->
  <rect x="140" y="186" width="420" height="110" rx="4" fill="#b2c8e0" stroke="#1F407A" stroke-width="1.6"/>
  <text x="154" y="219" font-size="13" font-weight="700" fill="#14294E">Development team</text>
  <rect x="222" y="21" width="256" height="9" fill="#ffffff"/>
  <rect x="222" y="30" width="256" height="9" fill="#f8fafc"/>
  <line x1="222" y1="22" x2="222" y2="38" stroke="#94a3b8" stroke-width="2.4"/>
  <line x1="478" y1="22" x2="478" y2="38" stroke="#94a3b8" stroke-width="2.4"/>
  <text x="350" y="34.5" text-anchor="middle" font-size="12.5" font-style="italic" fill="#14294E">GDPR, EU AI Act, sector-specific law</text>
  <rect x="245" y="73" width="210" height="9" fill="#f8fafc"/>
  <rect x="245" y="82" width="210" height="9" fill="#e3ebf4"/>
  <line x1="245" y1="74" x2="245" y2="90" stroke="#7489a6" stroke-width="2.4"/>
  <line x1="455" y1="74" x2="455" y2="90" stroke="#7489a6" stroke-width="2.4"/>
  <text x="350" y="86.5" text-anchor="middle" font-size="12.5" font-style="italic" fill="#14294E">ISO standards, external audits</text>
  <rect x="208" y="125" width="284" height="9" fill="#e3ebf4"/>
  <rect x="208" y="134" width="284" height="9" fill="#cddcec"/>
  <line x1="208" y1="126" x2="208" y2="142" stroke="#4a6a94" stroke-width="2.4"/>
  <line x1="492" y1="126" x2="492" y2="142" stroke="#4a6a94" stroke-width="2.4"/>
  <text x="350" y="138.5" text-anchor="middle" font-size="12.5" font-style="italic" fill="#14294E">Impact assessments, ethical review boards</text>
  <rect x="208" y="177" width="284" height="9" fill="#cddcec"/>
  <rect x="208" y="186" width="284" height="9" fill="#b2c8e0"/>
  <line x1="208" y1="178" x2="208" y2="194" stroke="#1F407A" stroke-width="2.4"/>
  <line x1="492" y1="178" x2="492" y2="194" stroke="#1F407A" stroke-width="2.4"/>
  <text x="350" y="190.5" text-anchor="middle" font-size="12.5" font-style="italic" fill="#14294E">Fairness testing, model cards, red-teaming</text>
  <!-- Core: the AI system every wall ultimately binds -->
  <rect x="270" y="228" width="160" height="52" rx="3" fill="#1F407A" stroke="#14294E" stroke-width="1.4"/>
  <text x="350" y="250" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">AI system</text>
  <text x="350" y="268" text-anchor="middle" font-size="12.5" fill="#dbe7f3">model and infrastructure</text>
