<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 425" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean canvas background with zero outer border stroke -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1a202c; }
      .text-body  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 500; fill: #4a5568; }
      .text-chip  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8px; font-weight: 700; }
      .text-sub   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #718096; }
      .text-bold  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; }
    </style>

    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a5568"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b6cb0"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c53030"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b46c1"/>
    </marker>
  </defs>

  <!-- ==================== MAIN INFERENCE PIPELINE (TOP ROW) ==================== -->
  
  <!-- 1. Input Request -->
  <g transform="translate(18, 55)">
    <rect x="0" y="10" width="62" height="65" rx="4" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
    <text x="31" y="36" text-anchor="middle" class="text-bold" fill="#2d3748">User</text>
    <text x="31" y="49" text-anchor="middle" class="text-bold" fill="#2d3748">Request</text>
    <text x="31" y="62" text-anchor="middle" class="text-sub">Inference</text>
  </g>

  <!-- Arrow to Input Guardrails -->
  <line x1="80" y1="97" x2="98" y2="97" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- 2. Input Guardrails -->
  <g transform="translate(100, 25)">
    <rect x="0" y="0" width="124" height="145" rx="4" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
    <rect x="8" y="8" width="52" height="15" rx="2" fill="#fed7d7"/>
    <text x="34" y="18.5" text-anchor="middle" class="text-chip" fill="#9b2c2c">FILTER</text>
    <text x="8" y="38" class="text-title" fill="#9b2c2c">Input Guardrails</text>
    
    <line x1="8" y1="46" x2="116" y2="46" stroke="#feb2b2" stroke-width="0.8"/>
    <circle cx="14" cy="62" r="2.5" fill="#c53030"/>
    <text x="22" y="65" class="text-body">PII Anonymization</text>
    <circle cx="14" cy="82" r="2.5" fill="#c53030"/>
    <text x="22" y="85" class="text-body">Content Moderation</text>
    <circle cx="14" cy="102" r="2.5" fill="#c53030"/>
    <text x="22" y="105" class="text-body">Schema Validation</text>
    <circle cx="14" cy="122" r="2.5" fill="#c53030"/>
    <text x="22" y="125" class="text-body">Injection Defense</text>
  </g>

  <!-- Arrow to ML Model -->
  <line x1="224" y1="97" x2="240" y2="97" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- 3. ML Model Serving -->
  <g transform="translate(242, 25)">
    <rect x="0" y="0" width="124" height="145" rx="4" fill="#ebf8ff" stroke="#bee3f8" stroke-width="1.2"/>
    <rect x="8" y="8" width="56" height="15" rx="2" fill="#bee3f8"/>
    <text x="36" y="18.5" text-anchor="middle" class="text-chip" fill="#2b6cb0">PREDICT</text>
    <text x="8" y="38" class="text-title" fill="#2b6cb0">Model Serving</text>
    
    <line x1="8" y1="46" x2="116" y2="46" stroke="#bee3f8" stroke-width="0.8"/>
    <circle cx="14" cy="62" r="2.5" fill="#2b6cb0"/>
    <text x="22" y="65" class="text-body">Feature Store Lookup</text>
    <circle cx="14" cy="82" r="2.5" fill="#2b6cb0"/>
    <text x="22" y="85" class="text-body">Model Inference</text>
    <circle cx="14" cy="102" r="2.5" fill="#2b6cb0"/>
    <text x="22" y="105" class="text-body">Group Thresholding</text>
    <circle cx="14" cy="122" r="2.5" fill="#2b6cb0"/>
    <text x="22" y="125" class="text-body">Logit Calibration</text>
  </g>

  <!-- Arrow to Output Guardrails -->
  <line x1="366" y1="97" x2="382" y2="97" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- 4. Output Guardrails -->
  <g transform="translate(384, 25)">
    <rect x="0" y="0" width="124" height="145" rx="4" fill="#f0fff4" stroke="#c6f6d5" stroke-width="1"/>
    <rect x="8" y="8" width="60" height="15" rx="2" fill="#c6f6d5"/>
    <text x="38" y="18.5" text-anchor="middle" class="text-chip" fill="#22543d">VALIDATE</text>
    <text x="8" y="38" class="text-title" fill="#276749">Output Guard</text>
    
    <line x1="8" y1="46" x2="116" y2="46" stroke="#c6f6d5" stroke-width="0.8"/>
    <circle cx="14" cy="62" r="2.5" fill="#276749"/>
    <text x="22" y="65" class="text-body">Toxicity &amp; Bias Scan</text>
    <circle cx="14" cy="82" r="2.5" fill="#276749"/>
    <text x="22" y="85" class="text-body">Factual Grounding</text>
    <circle cx="14" cy="102" r="2.5" fill="#276749"/>
    <text x="22" y="105" class="text-body">Policy Alignment</text>
    <circle cx="14" cy="122" r="2.5" fill="#276749"/>
    <text x="22" y="125" class="text-body">Violation Detection</text>
  </g>

  <!-- Arrow to Audit Logger -->
  <line x1="508" y1="97" x2="524" y2="97" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- 5. Audit Logger -->
  <g transform="translate(526, 25)">
    <rect x="0" y="0" width="124" height="145" rx="4" fill="#fffaf0" stroke="#feebc8" stroke-width="1"/>
    <rect x="8" y="8" width="50" height="15" rx="2" fill="#feebc8"/>
    <text x="33" y="18.5" text-anchor="middle" class="text-chip" fill="#c05621">AUDIT</text>
    <text x="8" y="38" class="text-title" fill="#c05621">Audit Logger</text>
    
    <line x1="8" y1="46" x2="116" y2="46" stroke="#feebc8" stroke-width="0.8"/>
    <circle cx="14" cy="62" r="2.5" fill="#c05621"/>
    <text x="22" y="65" class="text-body">Immutable Records</text>
    <circle cx="14" cy="82" r="2.5" fill="#c05621"/>
    <text x="22" y="85" class="text-body">Sensitive Metadata</text>
    <circle cx="14" cy="102" r="2.5" fill="#c05621"/>
    <text x="22" y="105" class="text-body">Decision Lineage</text>
    <circle cx="14" cy="122" r="2.5" fill="#c05621"/>
    <text x="22" y="125" class="text-body">Compliance Ledger</text>
  </g>

  <!-- Arrow from Audit Logger to Approved Output -->
  <line x1="650" y1="130" x2="666" y2="130" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Output Approved Endpoint -->
  <g transform="translate(668, 102)">
    <rect x="0" y="0" width="122" height="58" rx="4" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1"/>
    <text x="61" y="22" text-anchor="middle" class="text-bold" fill="#22543d">Approved Response</text>
    <text x="61" y="36" text-anchor="middle" class="text-body" fill="#276749">Served to End User</text>
    <text x="61" y="48" text-anchor="middle" class="text-sub">Low Latency Path</text>
  </g>

  <!-- Escalation Route: Output Guardrails OVER THE TOP to Human Review -->
  <path d="M 446,25 L 446,10 L 729,10 L 729,23" fill="none" stroke="#c53030" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <rect x="540" y="2" width="100" height="15" rx="2" fill="#ffffff" stroke="#feb2b2" stroke-width="0.8"/>
  <text x="590" y="12.5" text-anchor="middle" class="text-chip" fill="#c53030">FLAGGED VIOLATION</text>

  <!-- Human Review Queue (Escalation) -->
  <g transform="translate(668, 25)">
    <rect x="0" y="0" width="122" height="58" rx="4" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
    <text x="61" y="22" text-anchor="middle" class="text-bold" fill="#9b2c2c">Human Review Queue</text>
    <text x="61" y="36" text-anchor="middle" class="text-body" fill="#c53030">Policy Team Triage</text>
    <text x="61" y="48" text-anchor="middle" class="text-sub">Asynchronous Escalation</text>
  </g>


  <!-- ==================== REAL-TIME OBSERVABILITY & GOVERNANCE LAYER (BOTTOM ROW) ==================== -->

  <!-- Vertical connection from ML Model to Bias Monitoring -->
  <line x1="304" y1="170" x2="304" y2="218" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  
  <!-- Vertical connection from Output Guard to Explainability Module -->
  <line x1="446" y1="170" x2="446" y2="218" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>

  <!-- Vertical connection from Explainability Module to Audit Logger -->
  <line x1="588" y1="220" x2="588" y2="172" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-purple)"/>

  <!-- Card 1: Fairness & Bias Telemetry Monitor -->
  <g transform="translate(180, 220)">
    <rect x="0" y="0" width="230" height="120" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="8" y="8" width="80" height="15" rx="2" fill="#fed7d7"/>
    <text x="48" y="18.5" text-anchor="middle" class="text-chip" fill="#9b2c2c">OBSERVABILITY</text>
    <text x="8" y="38" class="text-title" fill="#2d3748">Fairness &amp; Bias Monitor</text>
    
    <line x1="8" y1="46" x2="222" y2="46" stroke="#edf2f7" stroke-width="1"/>
    <text x="12" y="62" class="text-body">• Real-time Subgroup Disparity Tracking</text>
    <text x="12" y="77" class="text-body">• True/False Positive Rate Equivalence</text>
    <text x="12" y="92" class="text-body">• Demographic Calibration Shift Alerts</text>
    <text x="12" y="107" class="text-body">• Multiple-Comparison Error Bounds</text>
  </g>

  <!-- Card 2: Explainability & Attribution Module -->
  <g transform="translate(434, 220)">
    <rect x="0" y="0" width="230" height="120" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="8" y="8" width="76" height="15" rx="2" fill="#e9d8fd"/>
    <text x="46" y="18.5" text-anchor="middle" class="text-chip" fill="#6b46c1">INTERPRET</text>
    <text x="8" y="38" class="text-title" fill="#2d3748">Explainability Engine</text>
    
    <line x1="8" y1="46" x2="222" y2="46" stroke="#edf2f7" stroke-width="1"/>
    <text x="12" y="62" class="text-body">• Local Feature Attributions (SHAP / LIME)</text>
    <text x="12" y="77" class="text-body">• Concept Activation Vectors (TCAV)</text>
    <text x="12" y="92" class="text-body">• Counterfactual Recourse Testing</text>
    <text x="12" y="107" class="text-body">• Audit Ledger Attestation Artifacts</text>
  </g>

  <!-- Feedback Loop: From Fairness Monitor back to Model Serving Pipeline -->
  <path d="M 180,270 L 48,270 L 48,190 L 278,190 L 278,172" fill="none" stroke="#c53030" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <rect x="58" y="182" width="118" height="16" rx="2" fill="#ffffff" stroke="#feb2b2" stroke-width="0.8"/>
  <text x="117" y="193.5" text-anchor="middle" class="text-chip" fill="#c53030">RETRAINING / ROLLBACK</text>

  <!-- ==================== BOTTOM LEGEND ==================== -->
  <g transform="translate(18, 368)">
    <rect x="0" y="0" width="772" height="34" rx="4" fill="#f7fafc" stroke="#edf2f7" stroke-width="1"/>
    
    <!-- Legend item 1 -->
    <g transform="translate(24, 17)">
      <rect x="0" y="-6" width="14" height="12" rx="2" fill="#fed7d7" stroke="#feb2b2" stroke-width="0.8"/>
      <text x="20" y="3.5" class="text-sub" fill="#4a5568">Input &amp; Output Guardrails</text>
    </g>

    <!-- Legend item 2 -->
    <g transform="translate(200, 17)">
      <rect x="0" y="-6" width="14" height="12" rx="2" fill="#bee3f8" stroke="#90cdf4" stroke-width="0.8"/>
      <text x="20" y="3.5" class="text-sub" fill="#4a5568">Core Model Serving Stack</text>
    </g>

    <!-- Legend item 3 -->
    <g transform="translate(370, 17)">
      <rect x="0" y="-6" width="14" height="12" rx="2" fill="#feebc8" stroke="#fbd38d" stroke-width="0.8"/>
      <text x="20" y="3.5" class="text-sub" fill="#4a5568">Audit Trail &amp; Attestation</text>
    </g>

    <!-- Legend item 4 -->
    <g transform="translate(540, 17)">
      <rect x="0" y="-6" width="14" height="12" rx="2" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.8"/>
      <text x="20" y="3.5" class="text-sub" fill="#4a5568">Observability &amp; Explainability Engines</text>
    </g>
  </g>
</svg>