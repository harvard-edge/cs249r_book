<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== Lane containers ===== -->
  <rect x="20" y="20" width="600" height="100" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="37" font-size="10.5" font-weight="700" fill="#475569">Synchronous request path</text>

  <rect x="20" y="150" width="600" height="170" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="608" y="308" text-anchor="end" font-size="10.5" font-weight="700" fill="#475569">Asynchronous governance</text>

  <!-- ===== Request path ===== -->
  <rect x="40" y="50" width="110" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="95" y="79" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Request</text>

  <rect x="190" y="50" width="110" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="245" y="71" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Access control</text>
  <text x="245" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">and minimization</text>

  <rect x="340" y="50" width="110" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="395" y="79" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Inference</text>

  <rect x="490" y="50" width="110" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="545" y="79" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Response</text>

  <line x1="150" y1="75" x2="188" y2="75" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="300" y1="75" x2="338" y2="75" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="450" y1="75" x2="488" y2="75" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ===== Cross-lane links ===== -->
  <path d="M375,100 V135 H95 V198" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M545,215 V135 H415 V102" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="537" y="185" text-anchor="end" font-size="10.5" fill="#475569">approved update</text>

  <!-- ===== Governance tier ===== -->
  <rect x="40" y="200" width="110" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="95" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Bounded evidence</text>

  <rect x="40" y="250" width="110" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="95" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Delayed labels</text>

  <rect x="190" y="200" width="260" height="90" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="320" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Fairness analysis</text>
  <text x="320" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Explanations</text>

  <rect x="490" y="215" width="110" height="60" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="545" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Release gate</text>
  <text x="545" y="257" text-anchor="middle" font-size="10.5" fill="#475569">review owner</text>

  <line x1="150" y1="220" x2="188" y2="220" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <line x1="150" y1="270" x2="188" y2="270" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <line x1="450" y1="245" x2="488" y2="245" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
</svg>
