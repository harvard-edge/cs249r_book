<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="560" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== Loop nodes ===== -->
  <rect x="40" y="56" width="150" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="115" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Biased training</text>
  <text x="115" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">data</text>

  <rect x="370" y="56" width="150" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="445" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Biased model</text>
  <text x="445" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">predictions</text>

  <rect x="370" y="186" width="150" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="445" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Disparate</text>
  <text x="445" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">outcomes</text>

  <rect x="40" y="186" width="150" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="115" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Reinforced bias</text>
  <text x="115" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">in new data</text>

  <!-- ===== Reinforcing edges (clockwise) ===== -->
  <line x1="190" y1="81" x2="368" y2="81" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="280" y="74" text-anchor="middle" font-size="10" fill="#475569">trains on</text>
  <line x1="445" y1="106" x2="445" y2="184" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="453" y="150" font-size="10" fill="#475569">produces</text>
  <line x1="370" y1="211" x2="192" y2="211" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="280" y="228" text-anchor="middle" font-size="10" fill="#475569">creates</text>
  <line x1="115" y1="186" x2="115" y2="108" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="123" y="150" font-size="10" fill="#475569">feeds into</text>

  <!-- ===== Interventions ===== -->
  <rect x="55" y="6" width="120" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="115" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Pre-processing</text>
  <text x="115" y="34" text-anchor="middle" font-size="9.5" fill="#15803d">audit, reweight</text>
  <line x1="115" y1="40" x2="115" y2="54" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>

  <rect x="215" y="100" width="130" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="280" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">In-processing</text>
  <text x="280" y="125" text-anchor="middle" font-size="9.5" fill="#15803d">fairness constraints</text>
  <line x1="280" y1="100" x2="280" y2="84" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>

  <rect x="240" y="150" width="130" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="305" y="162" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Post-processing</text>
  <text x="305" y="175" text-anchor="middle" font-size="9.5" fill="#15803d">threshold calibration</text>
  <line x1="370" y1="165" x2="443" y2="165" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>
</svg>
