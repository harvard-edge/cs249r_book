  <path d="M130.9,222.5 A132,132 0 0 1 179.4,145.5" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="161.3" y="205.4" text-anchor="start" font-size="11.5" fill="#334155">feeds into</text>
  <rect x="185" y="95" width="150" height="46" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="260" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Biased training</text>
  <text x="260" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">data</text>
  <rect x="317" y="227" width="150" height="46" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="392" y="247" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Biased model</text>
  <text x="392" y="263" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">predictions</text>
  <rect x="185" y="359" width="150" height="46" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="260" y="379" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Disparate</text>
  <text x="260" y="395" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">outcomes</text>
  <rect x="53" y="227" width="150" height="46" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="128" y="247" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Reinforced bias</text>
  <text x="128" y="263" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">in new data</text>
  <text x="260" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">possible</text>
  <text x="260" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">reinforcing loop</text>
  <!-- ===== Interventions: each cuts the loop where it acts ===== -->
  <rect x="185" y="14" width="150" height="46" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="260" y="34" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Pre-processing</text>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#334155">audit, reweight</text>
  <line x1="260" y1="60" x2="260" y2="94" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <line x1="368.5" y1="201.2" x2="392.3" y2="190.5" stroke="#16a34a" stroke-width="4"/>
  <rect x="470" y="72" width="170" height="46" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="555" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">In-processing</text>
  <text x="555" y="108" text-anchor="middle" font-size="11.5" fill="#334155">fairness constraints</text>
  <path d="M470,95 H380.4 V180.9" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <line x1="349.5" y1="328.4" x2="369.1" y2="345.5" stroke="#16a34a" stroke-width="4"/>
  <rect x="470" y="382" width="170" height="46" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="555" y="402" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Post-processing</text>
  <text x="555" y="418" text-anchor="middle" font-size="11.5" fill="#334155">threshold calibration</text>
  <path d="M470,405 H359.3 V352" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
  </g>
