<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 490" width="100%" height="100%">
  <rect width="750" height="490" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- ==================== LOOP PATHS ==================== -->
  <!-- Top -> Right -->
  <path d="M 470,75 L 585,75 L 585,185" fill="none" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Right -> Bottom -->
  <path d="M 585,255 L 585,365 L 470,365" fill="none" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Bottom -> Left -->
  <path d="M 250,365 L 140,365 L 140,255" fill="none" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Left -> Top -->
  <path d="M 140,185 L 140,75 L 250,75" fill="none" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Path step annotations -->
  <rect x="505" y="62" width="60" height="16" rx="2" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="535" y="73" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">trains on</text>

  <rect x="555" y="320" width="60" height="16" rx="2" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="585" y="331" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">produces</text>

  <rect x="165" y="352" width="60" height="16" rx="2" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="195" y="363" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">creates</text>

  <rect x="110" y="125" width="60" height="16" rx="2" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="140" y="136" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">feeds into</text>

  <!-- ==================== CENTER BADGE ==================== -->
  <g transform="translate(360, 220)">
    <circle cx="0" cy="0" r="48" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
    <text x="0" y="-8" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">SYSTEMIC</text>
    <text x="0" y="4" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">FEEDBACK</text>
    <text x="0" y="16" text-anchor="middle" font-size="7.5" font-weight="600" fill="#64748B">Compound Drift</text>
  </g>

  <!-- ==================== NODE 1: BIASED DATASET (TOP) ==================== -->
  <g transform="translate(250, 42)">
    <rect width="220" height="66" rx="4" fill="#F8FAFC" stroke="#D97706" stroke-width="1.3"/>
    <rect width="220" height="20" rx="4" fill="#FEF3C7"/>
    <text x="110" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">HISTORICAL INPUT CORPUS</text>
    <text x="110" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Biased Training Data</text>
    <text x="110" y="50" text-anchor="middle" font-size="8" fill="#475569">Underrepresented cohorts &amp; historical disparities</text>
  </g>

  <!-- ==================== NODE 2: BIASED MODEL (RIGHT) ==================== -->
  <g transform="translate(475, 185)">
    <rect width="220" height="70" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.3"/>
    <rect width="220" height="20" rx="4" fill="#EAF1F8"/>
    <text x="110" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F407A">DEPLOYED MODEL ARTIFACT</text>
    <text x="110" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Biased Model Predictions</text>
    <text x="110" y="50" text-anchor="middle" font-size="8" fill="#475569">Learns spurious demographic correlation;</text>
    <text x="110" y="61" text-anchor="middle" font-size="8" fill="#475569">penalizes protected demographic groups</text>
  </g>

  <!-- ==================== NODE 3: DISCRIMINATORY OUTCOMES (BOTTOM) ==================== -->
  <g transform="translate(250, 332)">
    <rect width="220" height="66" rx="4" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.3"/>
    <rect width="220" height="20" rx="4" fill="#FEE2E2"/>
    <text x="110" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">DOWNSTREAM REAL-WORLD IMPACT</text>
    <text x="110" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">Disparate Outcomes</text>
    <text x="110" y="50" text-anchor="middle" font-size="8" fill="#475569">Asymmetric denial rates in lending &amp; hiring</text>
  </g>

  <!-- ==================== NODE 4: REINFORCED DATA BIAS (LEFT) ==================== -->
  <g transform="translate(30, 185)">
    <rect width="220" height="70" rx="4" fill="#F8FAFC" stroke="#D97706" stroke-width="1.3"/>
    <rect width="220" height="20" rx="4" fill="#FEF3C7"/>
    <text x="110" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">DATA COLLECTION FLYWHEEL</text>
    <text x="110" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Reinforced Bias in New Data</text>
    <text x="110" y="50" text-anchor="middle" font-size="8" fill="#475569">Suppressed participation produces</text>
    <text x="110" y="61" text-anchor="middle" font-size="8" fill="#475569">fewer positive repayment labels</text>
  </g>

  <!-- ==================== INTERVENTIONS (GREEN) ==================== -->
  <!-- Intervention 1: Pre-processing (Top Left) -->
  <g transform="translate(130, 15)">
    <rect width="115" height="36" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <text x="57.5" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">Pre-Processing</text>
    <text x="57.5" y="27" text-anchor="middle" font-size="7.5" fill="#15803D">Data Audit &amp; Re-weight</text>
    <line x1="57.5" y1="36" x2="57.5" y2="55" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Intervention 2: In-processing (Right) -->
  <g transform="translate(615, 270)">
    <rect width="115" height="36" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <text x="57.5" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">In-Processing</text>
    <text x="57.5" y="27" text-anchor="middle" font-size="7.5" fill="#15803D">Fairness Constraints</text>
    <line x1="0" y1="18" x2="-25" y2="18" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Intervention 3: Post-processing (Bottom Left) -->
  <g transform="translate(70, 420)">
    <line x1="57.5" y1="0" x2="57.5" y2="-20" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <rect width="115" height="36" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <text x="57.5" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">Post-Processing</text>
    <text x="57.5" y="27" text-anchor="middle" font-size="7.5" fill="#15803D">Threshold Calibration</text>
  </g>

  <!-- ==================== BOTTOM LEGEND ==================== -->
  <g transform="translate(210, 440)">
    <rect width="300" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    
    <line x1="20" y1="14" x2="45" y2="14" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="52" y="17" font-size="8" font-weight="600" fill="#475569">Bias Reinforcement Loop</text>

    <line x1="170" y1="14" x2="195" y2="14" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="202" y="17" font-size="8" font-weight="600" fill="#166534">Fairness Intervention</text>
  </g>
</svg>