  </defs>
  <g transform="translate(0,9)">
  <!-- ===== Reinforcing loop ===== -->
  <path d="M338.7,144.1 A132,132 0 0 1 388.6,220.2" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="345.2" y="184.5" text-anchor="end" font-size="11.5" fill="#334155">trains on</text>
  <path d="M389.1,277.5 A132,132 0 0 1 340.6,354.5" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
