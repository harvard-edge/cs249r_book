<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 75 600 350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect y="75" width="600" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <!-- ===== Reinforcing loop (same vocabulary as reward-hacking-loop) ===== -->
  <path d="M371.9,139.3 A132,132 0 0 1 428.6,220.2" fill="none" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="395" y="196" text-anchor="end" font-size="11.5" fill="#334155">trains on</text>
  <path d="M429.1,277.5 A132,132 0 0 1 373.8,359.4" fill="none" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="395" y="312" text-anchor="end" font-size="11.5" fill="#334155">produces</text>
  <path d="M228.1,360.7 A132,132 0 0 1 171.4,279.8" fill="none" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="205" y="312" text-anchor="start" font-size="11.5" fill="#334155">creates</text>
  <path d="M170.9,222.5 A132,132 0 0 1 226.2,140.6" fill="none" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="205" y="196" text-anchor="start" font-size="11.5" fill="#334155">feeds into</text>
  <rect x="232" y="95" width="136" height="46" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="300" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Biased training</text>
  <text x="300" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">data</text>
  <rect x="364" y="227" width="136" height="46" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="432" y="247" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Biased model</text>
  <text x="432" y="263" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">predictions</text>
  <rect x="232" y="359" width="136" height="46" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="300" y="379" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Disparate</text>
  <text x="300" y="395" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">outcomes</text>
  <rect x="100" y="227" width="136" height="46" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="168" y="247" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Reinforced bias</text>
  <text x="168" y="263" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">in new data</text>
  <text x="300" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#1F407A">possible</text>
  <text x="300" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#1F407A">reinforcing loop</text>
  <!-- ===== Interventions: each ends at a green bar cutting the arc it acts on ===== -->
  <rect x="20" y="124" width="140" height="46" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="90" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Pre-processing</text>
  <text x="90" y="160" text-anchor="middle" font-size="11.5" fill="#334155">audit, reweight</text>
  <line x1="160" y1="146.8" x2="195" y2="146.8" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <line x1="215.1" y1="165.1" x2="196.8" y2="146.8" stroke="#16a34a" stroke-width="4"/>
  <rect x="440" y="124" width="140" height="46" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="510" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">In-processing</text>
  <text x="510" y="160" text-anchor="middle" font-size="11.5" fill="#334155">fairness constraints</text>
  <line x1="440" y1="146.8" x2="405" y2="146.8" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <line x1="384.9" y1="165.1" x2="403.2" y2="146.8" stroke="#16a34a" stroke-width="4"/>
  <rect x="440" y="330" width="140" height="46" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="510" y="350" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Post-processing</text>
  <text x="510" y="366" text-anchor="middle" font-size="11.5" fill="#334155">threshold calibration</text>
  <line x1="440" y1="353.2" x2="405" y2="353.2" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <line x1="384.9" y1="334.9" x2="403.2" y2="353.2" stroke="#16a34a" stroke-width="4"/>
</svg>
