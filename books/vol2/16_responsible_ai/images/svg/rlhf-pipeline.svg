<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 620 208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="-8" width="620" height="208" fill="#fff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== Policy lane ===== -->
  <rect x="20" y="30" width="125" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="82.5" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Pretrained</text>
  <text x="82.5" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">model</text>

  <rect x="170" y="30" width="125" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="232.5" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Supervised</text>
  <text x="232.5" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">fine-tuning</text>

  <rect x="320" y="30" width="125" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="382.5" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">RL fine-tuning</text>
  <text x="382.5" y="68" text-anchor="middle" font-size="10.5" fill="#334155">(PPO)</text>

  <rect x="470" y="30" width="125" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
  <text x="532.5" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Aligned</text>
  <text x="532.5" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">policy</text>

  <line x1="145" y1="55" x2="168" y2="55" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="295" y1="55" x2="318" y2="55" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M232.5,30 V14 H382.5 V28" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <rect x="270" y="0" width="75" height="16" fill="#fff"/>
  <text x="307.5" y="11" text-anchor="middle" font-size="10.5" fill="#475569">KL reference</text>
  <line x1="445" y1="55" x2="468" y2="55" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ===== Preference lane ===== -->
  <rect x="20" y="130" width="125" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="82.5" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Human</text>
  <text x="82.5" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">raters</text>

  <rect x="170" y="130" width="125" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="232.5" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Preference</text>
  <text x="232.5" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">comparisons</text>

  <rect x="320" y="130" width="125" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="382.5" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Reward model</text>
  <text x="382.5" y="168" text-anchor="middle" font-size="10.5" fill="#334155">r(x, y)</text>

  <line x1="145" y1="155" x2="168" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="295" y1="155" x2="318" y2="155" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ===== Cross-lane links ===== -->
  <line x1="232.5" y1="80" x2="232.5" y2="128" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="240" y="108" font-size="10.5" fill="#475569">sampled outputs</text>
  <line x1="382.5" y1="130" x2="382.5" y2="82" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="390" y="108" font-size="10.5" fill="#475569">reward signal</text>
