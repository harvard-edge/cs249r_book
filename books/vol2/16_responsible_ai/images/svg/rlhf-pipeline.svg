<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="780" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-blue-lg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <!-- ===== Lanes ===== -->
  <rect x="20" y="20" width="740" height="112" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="40" font-size="12.5" font-weight="700" fill="#334155">Policy</text>
  <rect x="20" y="176" width="740" height="134" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="196" font-size="12.5" font-weight="700" fill="#334155">Human judgment</text>
  <!-- Policy lane: light supporting structure -->
  <rect x="40" y="62" width="120" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Pretrained</text>
  <text x="100" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">model</text>
  <rect x="200" y="62" width="140" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="270" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Supervised</text>
  <text x="270" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">fine-tuning</text>
  <rect x="410" y="62" width="150" height="50" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="485" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">RL fine-tuning</text>
  <text x="485" y="100" text-anchor="middle" font-size="12.5" fill="#334155">PPO</text>
  <rect x="600" y="62" width="140" height="50" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="670" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Aligned</text>
  <text x="670" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">policy</text>
  <line x1="160" y1="87" x2="199" y2="87" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="340" y1="87" x2="409" y2="87" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="560" y1="87" x2="599" y2="87" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M270,62 V44 H485 V61" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <rect x="328" y="35" width="100" height="18" fill="#f8fafc"/>
  <text x="378" y="48" text-anchor="middle" font-size="12.5" fill="#334155">KL reference</text>
  <!-- Human lane: many raters, many comparisons, one reward model -->
  <rect x="48" y="214" width="120" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="44" y="218" width="120" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="40" y="222" width="120" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="100" y="244" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Human</text>
  <text x="100" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">raters</text>
  <rect x="210" y="202" width="160" height="74" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <rect x="205" y="206" width="160" height="74" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <rect x="200" y="210" width="160" height="74" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="280" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Preference pairs</text>
  <rect x="216" y="238" width="48" height="34" rx="2" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/>
  <text x="240" y="260" text-anchor="middle" font-size="14" font-style="italic" fill="#0f172a">y<tspan font-size="12.5" font-style="normal" dy="3">1</tspan></text>
  <rect x="296" y="238" width="48" height="34" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="320" y="260" text-anchor="middle" font-size="14" font-style="italic" fill="#0f172a">y<tspan font-size="12.5" font-style="normal" dy="3">2</tspan></text>
  <text x="280" y="262" text-anchor="middle" font-size="20" font-weight="700" fill="#15803d">&#8827;</text>
  <!-- Focal: the reward model is the only path from preferences to weights -->
  <rect x="410" y="216" width="150" height="62" rx="3" fill="#1F407A" stroke="#1F407A" stroke-width="1.2"/>
  <text x="485" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Reward model</text>
  <text x="485" y="260" text-anchor="middle" font-size="12.5" font-style="italic" fill="#dbe7f3">r(x, y)</text>
  <line x1="160" y1="247" x2="199" y2="247" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="370" y1="247" x2="409" y2="247" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="389" y="238" text-anchor="middle" font-size="12.5" fill="#334155">trains</text>
  <!-- ===== The two lane crossings ===== -->
  <line x1="270" y1="112" x2="270" y2="209" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="280" y="158" font-size="12.5" fill="#334155">sampled outputs</text>
  <line x1="485" y1="216" x2="485" y2="113" stroke="#1F407A" stroke-width="3" marker-end="url(#arr-blue-lg)"/>
  <text x="497" y="150" font-size="12.5" font-weight="700" fill="#1F407A">reward signal</text>
  <text x="497" y="166" font-size="12.5" fill="#334155">the only path to weights</text>
</svg>
