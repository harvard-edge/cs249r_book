<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 405" width="100%" height="100%">
  <rect width="680" height="405" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- ==================== TOP STAGE ROW ==================== -->
  <!-- 6 boxes across 640px: w=92, gap=17.6. x=20, 130, 240, 350, 460, 570 -->

  <!-- Stage 1: Base Model -->
  <g transform="translate(20, 16)">
    <rect width="92" height="116" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.3"/>
    <rect width="92" height="20" rx="4" fill="#EAF1F8"/>
    <text x="46" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">1 · PRETRAIN</text>
    <text x="46" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Base Checkpoint</text>
    <line x1="10" y1="46" x2="82" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="46" y="60" text-anchor="middle" font-size="8" fill="#475569">Pre-trained</text>
    <text x="46" y="72" text-anchor="middle" font-size="8" fill="#475569">dense / MoE</text>
    <text x="46" y="84" text-anchor="middle" font-size="8" fill="#475569">Next-token loss</text>
    <text x="46" y="96" text-anchor="middle" font-size="7.5" fill="#64748B">O(TB) tokens</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="112" y1="74" x2="130" y2="74" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 2: SFT -->
  <g transform="translate(130, 16)">
    <rect width="92" height="116" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.3"/>
    <rect width="92" height="20" rx="4" fill="#EAF1F8"/>
    <text x="46" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">2 · SFT</text>
    <text x="46" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Fine-Tuning</text>
    <line x1="10" y1="46" x2="82" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="46" y="60" text-anchor="middle" font-size="8" fill="#475569">Curated dialog</text>
    <text x="46" y="72" text-anchor="middle" font-size="8" fill="#475569">demonstrations</text>
    <text x="46" y="84" text-anchor="middle" font-size="8" fill="#475569">~10k–100k</text>
    <text x="46" y="96" text-anchor="middle" font-size="7.5" fill="#64748B">instruction pairs</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="222" y1="74" x2="240" y2="74" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 3: Human Preferences -->
  <g transform="translate(240, 16)">
    <rect width="92" height="116" rx="4" fill="#F8FAFC" stroke="#D97706" stroke-width="1.3"/>
    <rect width="92" height="20" rx="4" fill="#FEF3C7"/>
    <text x="46" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">3 · PREFERENCE</text>
    <text x="46" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Pairwise Data</text>
    <line x1="10" y1="46" x2="82" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="46" y="60" text-anchor="middle" font-size="8" fill="#475569">Pairwise outputs</text>
    <text x="46" y="72" text-anchor="middle" font-size="8" fill="#475569">(y_w ≻ y_l)</text>
    <text x="46" y="84" text-anchor="middle" font-size="8" fill="#475569">50k–500k</text>
    <text x="46" y="96" text-anchor="middle" font-size="7.5" fill="#64748B">labeled prompts</text>
  </g>

  <!-- Human Rater Chip below Stage 3 -->
  <g transform="translate(248, 142)">
    <rect width="76" height="24" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <text x="38" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">Human Raters</text>
  </g>
  <line x1="286" y1="142" x2="286" y2="132" stroke="#D97706" stroke-width="1.2" marker-end="url(#arrow-amber)"/>

  <!-- Arrow 3 -> 4 -->
  <line x1="332" y1="74" x2="350" y2="74" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 4: Reward Model -->
  <g transform="translate(350, 16)">
    <rect width="92" height="116" rx="4" fill="#F8FAFC" stroke="#16A34A" stroke-width="1.3"/>
    <rect width="92" height="20" rx="4" fill="#DCFCE7"/>
    <text x="46" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">4 · REWARD</text>
    <text x="46" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Reward Network</text>
    <line x1="10" y1="46" x2="82" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="46" y="60" text-anchor="middle" font-size="8" fill="#475569">Bradley-Terry</text>
    <text x="46" y="72" text-anchor="middle" font-size="8" fill="#475569">preference loss</text>
    <text x="46" y="84" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">r(x, y) ∈ ℝ</text>
    <text x="46" y="96" text-anchor="middle" font-size="7.5" fill="#64748B">Scalar proxy</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="442" y1="74" x2="460" y2="74" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 5: PPO Training -->
  <g transform="translate(460, 16)">
    <rect width="92" height="116" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.3"/>
    <rect width="92" height="20" rx="4" fill="#EAF1F8"/>
    <text x="46" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">5 · POLICY RL</text>
    <text x="46" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">PPO Tuning</text>
    <line x1="10" y1="46" x2="82" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="46" y="60" text-anchor="middle" font-size="8" fill="#475569">Policy gradient</text>
    <text x="46" y="72" text-anchor="middle" font-size="8" fill="#475569">max 𝔼[r(x,y)]</text>
    <text x="46" y="84" text-anchor="middle" font-size="8" fill="#475569">− β KL penalty</text>
    <text x="46" y="96" text-anchor="middle" font-size="7.5" fill="#64748B">Actor-Critic</text>
  </g>

  <!-- Reward feedback connector from Stage 4 to Stage 5 -->
  <path d="M 396,132 L 396,154 L 506,154 L 506,132" fill="none" stroke="#16A34A" stroke-width="1.3" marker-end="url(#arrow-green)"/>
  <rect x="418" y="146" width="66" height="16" rx="2" fill="#DCFCE7"/>
  <text x="451" y="158" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">Reward r</text>

  <!-- Arrow 5 -> 6 -->
  <line x1="552" y1="74" x2="570" y2="74" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 6: Aligned Model -->
  <g transform="translate(570, 16)">
    <rect width="90" height="116" rx="4" fill="#F8FAFC" stroke="#16A34A" stroke-width="1.5"/>
    <rect width="90" height="20" rx="4" fill="#DCFCE7"/>
    <text x="45" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">6 · DEPLOY</text>
    <text x="45" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Aligned Policy</text>
    <line x1="10" y1="46" x2="80" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    <text x="45" y="60" text-anchor="middle" font-size="8" fill="#475569">Helpful &amp; honest</text>
    <text x="45" y="72" text-anchor="middle" font-size="8" fill="#475569">Safety bound</text>
    <text x="45" y="84" text-anchor="middle" font-size="8" font-weight="600" fill="#DC2626">2–8% bench tax</text>
    <text x="45" y="96" text-anchor="middle" font-size="7.5" fill="#64748B">Serving ready</text>
  </g>

  <!-- ==================== MIDDLE CARD: ENGINEERING TRADE-OFFS ==================== -->
  <g transform="translate(20, 180)">
    <rect width="640" height="96" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="640" height="22" rx="4" fill="#F1F5F9"/>
    <text x="320" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A">Key RLHF Engineering Trade-Offs</text>

    <!-- Column 1: Label Cost -->
    <g transform="translate(15, 28)">
      <rect width="190" height="58" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="190" height="16" rx="3" fill="#FEF3C7"/>
      <text x="95" y="12" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">Data &amp; Annotation Cost</text>
      <text x="10" y="30" font-size="8" font-weight="600" fill="#0F172A">$0.50–$5.00 per human label</text>
      <text x="10" y="44" font-size="7.5" fill="#475569">Requires 50k–500k comparison pairs</text>
    </g>

    <!-- Column 2: Compute Overhead -->
    <g transform="translate(225, 28)">
      <rect width="190" height="58" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="190" height="16" rx="3" fill="#EAF1F8"/>
      <text x="95" y="12" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">Compute Footprint</text>
      <text x="10" y="30" font-size="8" font-weight="600" fill="#0F172A">+50% to +100% vs. SFT alone</text>
      <text x="10" y="44" font-size="7.5" fill="#475569">4 models in memory: actor, critic, ref, reward</text>
    </g>

    <!-- Column 3: Alignment Tax -->
    <g transform="translate(435, 28)">
      <rect width="190" height="58" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <rect width="190" height="16" rx="3" fill="#FEE2E2"/>
      <text x="95" y="12" text-anchor="middle" font-size="8" font-weight="700" fill="#991B1B">Alignment Capability Tax</text>
      <text x="10" y="30" font-size="8" font-weight="600" fill="#DC2626">2% to 8% benchmark degradation</text>
      <text x="10" y="44" font-size="7.5" fill="#475569">Over-cautious refusals &amp; entropy collapse</text>
    </g>
  </g>

  <!-- ==================== BOTTOM CARD: FAILURE MODES ==================== -->
  <g transform="translate(20, 288)">
    <rect width="640" height="98" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="640" height="22" rx="4" fill="#FEE2E2"/>
    <text x="320" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#991B1B">RLHF Failure Modes in Autonomous Training</text>

    <!-- Column 1: Reward Hacking -->
    <g transform="translate(15, 28)">
      <rect width="190" height="60" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0F172A">1 · Reward Hacking</text>
      <text x="10" y="32" font-size="7.5" fill="#475569">Exploits flaws in reward proxy</text>
      <text x="10" y="44" font-size="7.5" fill="#475569">Verbosity bias &amp; sycophancy</text>
    </g>

    <!-- Column 2: Misaligned Internal Goals -->
    <g transform="translate(225, 28)">
      <rect width="190" height="60" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0F172A">2 · Goal Misgeneralization</text>
      <text x="10" y="32" font-size="7.5" fill="#475569">Out-of-distribution divergence</text>
      <text x="10" y="44" font-size="7.5" fill="#475569">Reward optimal but unsafe in novel context</text>
    </g>

    <!-- Column 3: Power Seeking -->
    <g transform="translate(435, 28)">
      <rect width="190" height="60" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0F172A">3 · Strategic Deception</text>
      <text x="10" y="32" font-size="7.5" fill="#475569">Faking alignment during eval</text>
      <text x="10" y="44" font-size="7.5" fill="#475569">Preserving capability at expense of safety</text>
    </g>
  </g>
</svg>