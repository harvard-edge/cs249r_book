  claims:
    Assurance case: A registry proves which weights shipped, not that shipping was justified, so deployment is justified
      by a versioned assurance case (claim for a stated use, argument, evidence, assumptions, an owner who can block,
      an invalidation rule) that expires on material change
      and maps the applicable legal obligations onto the lifecycle.
    Fairness criteria conflict: Demographic parity, equalized odds, equality of opportunity, and calibration measure
      different conditional rates, one classifier can fail all of them at once, and they cannot all hold when base
      rates differ, so choosing one is a governance decision.
    Disparity measurement uncertainty: A subgroup gap is evidence only with denominators, confidence intervals,
      and coverage limits, single-axis audits hide intersectional failure, and a significant disparity says nothing
      about its cause.
    Fleet fairness monitoring: Continuous fairness telemetry costs streaming counters per group and metric, runs
      mostly off the request path, updates prediction-only metrics at once while label-dependent metrics wait for
      outcomes, and reports under-supported groups as insufficient, not zero.
    Safeguards as capacity: Every responsible-AI control consumes budgeted training, serving, memory, storage, or
      human-review capacity on a specific path, and where it is placed decides who is protected.
    Machine unlearning: A privacy guarantee bounds exposure but does not remove a record from trained weights, so
      deletion that reaches model state needs a removal method and evidence, and its cost (full retraining vs sharded
      retraining) is set by architecture chosen before training.
    Contestability and remedy: Explanation serves accountability only when an affected person can challenge a decision
      and obtain correction, which requires decision provenance, audience-appropriate reasons, an appeal routed
      to an authorized reviewer, and tracked outcomes.
    Sociotechnical feedback and designed oversight: Deployed models reshape their own future data and their operators,
      so predictions can become self-fulfilling in ways a static test set cannot detect, and human oversight must
      be designed against both automation bias and alert fatigue.
    Threshold postprocessing and the fairness cost: Group-specific thresholds can equalize a chosen rate but leave
      score calibration unchanged, need authorized sensitive attributes at decision time, and carry a scenario-specific
      accuracy cost.
    Explanation placement: Explanation method and placement are fixed by audience, deadline, and attribution cost
      (saliency, exact tree attribution, sampled Shapley values), and attribution is not causation.
    Generative governance surfaces: For a generative fleet, fairness, privacy, and safety are governed through system
      prompts, retrieved context, reward models, policy classifiers, and output filters, all versioned as infrastructure.
    Bounded autonomy and safety case: When a system acts faster than anyone can review its decisions, the objective
      itself becomes a governed artifact and trust is operationalized as a safety case over a validated envelope
      with runtime guardrails, because fleet scale turns rare failures into expected incidents.
    Privacy claims name their boundary: A privacy guarantee covers only the data path its mechanism accounts for,
      so differentially private training says nothing about private inputs copied into service logs, and each claim
      must state which accesses it covers.
