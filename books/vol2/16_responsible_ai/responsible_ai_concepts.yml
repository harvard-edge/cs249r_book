  learner_graph:
    schema_version: 1
    concepts:
    - id: vol2.governance.assurance
      label: Assurance case
      teaches: Assurance case
      summary: A bounded deployment claim supported by evidence, controls, accountable ownership, and rules
        for material change.
      section: sec-responsible-ai-governance-assurance-lifecycle
    - id: vol2.governance.fairness
      label: Fairness criterion
      teaches: Fairness criteria conflict
      summary: A selected formal or normative requirement about how model outcomes or errors are distributed
        across affected groups.
      section: sec-responsible-ai-fairness-machine-learning-2ba4
    - id: vol2.governance.contestability
      label: Contestability
      teaches: Contestability and remedy
      summary: The ability of affected people to challenge a decision and obtain investigation and an actionable
        remedy.
      section: sec-responsible-ai-transparency-contestability-2f2c
    relationships:
    - id: vol2.field.47
      source: vol2.governance.fairness
      predicate: constrains
      target: vol2.governance.assurance
      explanation: A deployment assurance case must name and justify its selected fairness requirements
        and evidence.
      conditions: Fairness criteria can conflict; no single metric establishes universal fairness.
      status: draft
      evidence:
        section: sec-responsible-ai-governance-assurance-lifecycle
        quote: The lifecycle begins before model selection. Teams first define the intended use, prohibited
          uses, affected parties, operating environment, and decision consequences. They then identify harms
          and requirements, including subgroup performance, privacy, security, robustness, sustainability,
          human-oversight, and contestability obligations. Some controls are implemented locally; others
          are inherited from data providers, foundation-model vendors, cloud platforms, or downstream operators.
          Each inherited control needs an interface contract stating what the supplier guarantees, what
          evidence supports that guarantee, and which residual risks remain with the deploying organization.
    - id: vol2.field.48
      source: vol2.governance.contestability
      predicate: requires remedy within
      target: vol2.governance.assurance
      explanation: Affected people need an operational route to contest outcomes and receive investigation
        or correction.
      conditions: An explanation alone is insufficient unless accountable owners can act on a challenge.
      status: draft
      evidence:
        section: sec-responsible-ai-transparency-contestability-2f2c
        quote: 'Showing a rejected loan applicant a feature-attribution chart accomplishes nothing if the
          app offers no button to dispute an error in the credit file, no human reviewer with authority
          to overturn the rejection, and no immutable snapshot of the inputs that produced the score. Explanations
          serve accountability only when stakeholders can both understand and challenge system decisions.
          Transparency allows users, developers, auditors, and regulators to inspect how a system functions,
          assess its limitations, and identify sources of harm, but disclosure alone is not enough. In high-stakes
          domains, individuals and institutions need contestability\index{Contestability!system accountability}:
          the operational ability to interrogate, appeal, and reverse an automated decision.'
    - id: vol2.field.49
      source: vol2.privacy.dp
      predicate: supports a bounded claim in
      target: vol2.governance.assurance
      explanation: Privacy guarantees must state their boundary and be accompanied by lifecycle controls
        and evidence.
      conditions: A formal privacy bound does not authorize collection or replace retention, deletion, or
        access controls.
      status: draft
      evidence:
        section: sec-responsible-ai-privacy-preservation-91b1
        quote: For differential privacy, governance consumes the mechanism and accounting established in
          @sec-security-privacy-differential-privacy-8c2b. A differentially private stochastic gradient
          descent (DP-SGD) deployment must retain the clipping, noise, sampling, and composition configuration
          that supports its reported bound [@abadi2016deep]. Reviewers then evaluate that bound alongside
          utility, subgroup performance, and the private-data accesses outside training. Naming the method
          is insufficient evidence for approving the complete service.
