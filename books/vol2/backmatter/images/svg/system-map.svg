<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" height="100%">

  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .col-title { font-size: 12px; font-weight: 700; fill: #0F172A; }
      .col-sub { font-size: 9px; fill: #64748B; }
      .layer-title { font-size: 10px; font-weight: 700; }
      .layer-desc { font-size: 8.5px; fill: #475569; }
      .chip-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8px; font-weight: 700; }
      .map-desc { font-size: 8.5px; fill: #334155; }
    </style>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="#166534"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="680" height="500" fill="#ffffff"/>

  <!-- ======================================================= -->
  <!-- (A) Single-Machine Stack (left)                         -->
  <!-- ======================================================= -->
  <g transform="translate(45, 16)">
    <text x="120" y="16" text-anchor="middle" class="col-title">Single-Machine Stack</text>
    <text x="120" y="31" text-anchor="middle" class="col-sub">1–8 GPUs · Shared Memory &amp; NVLink</text>

    <!-- Layer 4 top: Application -->
    <rect x="0" y="44" width="240" height="48" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="120" y="64" text-anchor="middle" class="layer-title" fill="#0F172A">Application</text>
    <text x="120" y="79" text-anchor="middle" class="layer-desc">Training loop / inference serving</text>

    <!-- Layer 3: ML Framework -->
    <rect x="0" y="100" width="240" height="48" rx="4" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="120" y="120" text-anchor="middle" class="layer-title" fill="#B45309">ML Framework</text>
    <text x="120" y="135" text-anchor="middle" class="layer-desc">PyTorch / JAX / optimized kernels</text>

    <!-- Layer 2: Operating System -->
    <rect x="0" y="156" width="240" height="48" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="120" y="176" text-anchor="middle" class="layer-title" fill="#166534">Operating System</text>
    <text x="120" y="191" text-anchor="middle" class="layer-desc">CUDA runtime, PCIe DMA &amp; unified memory</text>

    <!-- Layer 1 bottom: Hardware -->
    <rect x="0" y="212" width="240" height="48" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
    <text x="120" y="232" text-anchor="middle" class="layer-title" fill="#1F407A">Hardware (PCIe / HBM)</text>
    <text x="120" y="247" text-anchor="middle" class="layer-desc">GPU ↔ GPU: NVLink 900 GB/s</text>

    <!-- Bottleneck annotation A -->
    <rect x="0" y="268" width="240" height="28" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="120" y="286" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">Bottleneck: Memory Wall (HBM Bandwidth)</text>
  </g>

  <!-- ======================================================= -->
  <!-- Scaling Arrow (center)                                  -->
  <!-- ======================================================= -->
  <line x1="285" y1="252" x2="395" y2="252" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="340" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">Scaling</text>

  <!-- ======================================================= -->
  <!-- (B) Fleet Stack (right)                                 -->
  <!-- ======================================================= -->
  <g transform="translate(395, 16)">
    <text x="120" y="16" text-anchor="middle" class="col-title">Fleet Stack</text>
    <text x="120" y="31" text-anchor="middle" class="col-sub">1,000–100,000+ GPUs · Message Passing &amp; Fabric</text>

    <!-- Layer 4 top: Governance -->
    <rect x="0" y="44" width="240" height="48" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="120" y="64" text-anchor="middle" class="layer-title" fill="#0F172A">Governance</text>
    <text x="120" y="79" text-anchor="middle" class="layer-desc">Responsible AI, Privacy &amp; Robustness</text>

    <!-- Layer 3: Serving / Ops -->
    <rect x="0" y="100" width="240" height="48" rx="4" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="120" y="120" text-anchor="middle" class="layer-title" fill="#B45309">Serving / Ops</text>
    <text x="120" y="135" text-anchor="middle" class="layer-desc">Fleet orchestration, CI/CD &amp; inference</text>

    <!-- Layer 2: Distribution -->
    <rect x="0" y="156" width="240" height="48" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="120" y="176" text-anchor="middle" class="layer-title" fill="#166534">Distribution</text>
    <text x="120" y="191" text-anchor="middle" class="layer-desc">NCCL, RDMA &amp; collective comms</text>

    <!-- Layer 1 bottom: Infrastructure -->
    <rect x="0" y="212" width="240" height="48" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
    <text x="120" y="232" text-anchor="middle" class="layer-title" fill="#1F407A">Infrastructure (Fabric / RDMA)</text>
    <text x="120" y="247" text-anchor="middle" class="layer-desc">InfiniBand NDR 400 Gb/s · RoCEv2 Ethernet</text>

    <!-- Bottleneck annotation B -->
    <rect x="0" y="268" width="240" height="28" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="120" y="286" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">Bottleneck: Bisection Bandwidth Wall</text>
  </g>

  <!-- ======================================================= -->
  <!-- Chapter Map Card (bottom)                               -->
  <!-- ======================================================= -->
  <g transform="translate(45, 332)">
    <rect width="590" height="152" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Card Header -->
    <rect width="590" height="26" rx="5" fill="#F8FAFC"/>
    <line x1="0" y1="26" x2="590" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="16" y="17.5" font-size="10.5" font-weight="700" fill="#1E293B">VOLUME II ARCHITECTURE &amp; CHAPTER MAP</text>

    <!-- Infrastructure Row -->
    <g transform="translate(16, 36)">
      <g>
        <rect x="0" y="0" width="86" height="20" rx="3" fill="#EAF1F8" stroke="#93C5FD" stroke-width="0.8"/>
        <text x="43" y="13.5" text-anchor="middle" class="chip-text" fill="#1F407A">INFRASTRUCTURE</text>
      </g>
      <text x="98" y="14" class="map-desc">Compute Clusters · Storage Systems · Network Fabrics · Collective Communications</text>
    </g>

    <!-- Distribution Row -->
    <g transform="translate(16, 62)">
      <g>
        <rect x="0" y="0" width="86" height="20" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
        <text x="43" y="13.5" text-anchor="middle" class="chip-text" fill="#166534">DISTRIBUTION</text>
      </g>
      <text x="98" y="14" class="map-desc">Distributed Training · Fleet Orchestration · Checkpointing &amp; Fault Tolerance</text>
    </g>

    <!-- Serving Row -->
    <g transform="translate(16, 88)">
      <g>
        <rect x="0" y="0" width="86" height="20" rx="3" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8"/>
        <text x="43" y="13.5" text-anchor="middle" class="chip-text" fill="#B45309">SERVING / OPS</text>
      </g>
      <text x="98" y="14" class="map-desc">Inference Systems · Performance Optimization · Fleet Deployment &amp; Ops at Scale</text>
    </g>

    <!-- Governance Row -->
    <g transform="translate(16, 114)">
      <g>
        <rect x="0" y="0" width="86" height="20" rx="3" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="0.8"/>
        <text x="43" y="13.5" text-anchor="middle" class="chip-text" fill="#6B21A8">GOVERNANCE</text>
      </g>
      <text x="98" y="14" class="map-desc">Security &amp; Privacy · Robust AI · Sustainable Computing · Edge Intelligence</text>
    </g>
  </g>

</svg>