<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 -8 544 531"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="28" y="-8" width="544" height="531" fill="#ffffff"/>

  <!-- ===== Set regions (fills first, strokes after, so every boundary stays crisp) ===== -->
  <!-- Base color contract for the framework triad: data green, algorithm orange, machine blue. -->
  <circle cx="300" cy="185" r="165" fill="#008F45" fill-opacity="0.07"/>
  <circle cx="217.5" cy="327.9" r="165" fill="#E67817" fill-opacity="0.08"/>
  <circle cx="382.5" cy="327.9" r="165" fill="#006395" fill-opacity="0.07"/>
  <circle cx="300" cy="185" r="165" fill="none" stroke="#008F45" stroke-width="2"/>
  <circle cx="217.5" cy="327.9" r="165" fill="none" stroke="#E67817" stroke-width="2"/>
  <circle cx="382.5" cy="327.9" r="165" fill="none" stroke="#006395" stroke-width="2"/>

  <!-- ===== Pure axes ===== -->
  <g text-anchor="middle">
    <text x="300" y="82" font-size="16" font-weight="700" fill="#00663A">Data (D)</text>
    <text x="300" y="102" font-size="12.5" font-style="italic" fill="#334155">information</text>
    <text x="300" y="124" font-size="12.5" fill="#00663A">Samples / Task</text>

    <text x="138" y="360" font-size="16" font-weight="700" fill="#B35A0C">Algorithm</text>
    <text x="138" y="379" font-size="16" font-weight="700" fill="#B35A0C">(A)</text>
    <text x="138" y="399" font-size="12.5" font-style="italic" fill="#334155">logic</text>
    <text x="138" y="421" font-size="12.5" fill="#9A4D0A">FLOPs / Sample</text>

    <text x="462" y="360" font-size="16" font-weight="700" fill="#004C73">Machine</text>
    <text x="462" y="379" font-size="16" font-weight="700" fill="#004C73">(M)</text>
    <text x="462" y="399" font-size="12.5" font-style="italic" fill="#334155">physics</text>
    <text x="462" y="421" font-size="12.5" fill="#004C73">Seconds / FLOP</text>
  </g>

  <!-- ===== Pairwise intersections ===== -->
  <g text-anchor="middle">
    <text x="197" y="210" font-size="11.5" font-weight="700" fill="#475569">D ∩ A</text>
    <text x="197" y="225" font-size="12" fill="#0f172a">What to learn</text>
    <text x="197" y="240" font-size="12" fill="#0f172a">from</text>

    <text x="403" y="210" font-size="11.5" font-weight="700" fill="#475569">D ∩ M</text>
    <text x="403" y="225" font-size="12" fill="#0f172a">How to move</text>
    <text x="403" y="240" font-size="12" fill="#0f172a">information</text>

    <text x="300" y="388" font-size="11.5" font-weight="700" fill="#475569">A ∩ M</text>
    <text x="300" y="403" font-size="12" fill="#0f172a">How to execute</text>
    <text x="300" y="418" font-size="12" fill="#0f172a">efficiently</text>
  </g>

  <!-- ===== Center: all three ===== -->
  <g text-anchor="middle">
    <rect x="240" y="248" width="120" height="66" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="300" y="266" font-size="11.5" font-weight="700" fill="#475569">D ∩ A ∩ M</text>
    <text x="300" y="283" font-size="12.5" font-weight="700" fill="#0f172a">ML systems</text>
    <text x="300" y="299" font-size="12.5" font-weight="700" fill="#0f172a">engineering</text>
  </g>
</svg>
