<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="100%" height="100%">
  <defs>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="#e11d48"/>
    </marker>
    <clipPath id="plot-clip">
      <rect x="85" y="45" width="535" height="305"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .axis-title { font-size: 11px; font-weight: 700; fill: #0f172a; }
    .tick-lbl { font-size: 9px; fill: #64748b; }
    .zone-title { font-size: 10.5px; font-weight: 700; }
    .zone-sub { font-size: 8.5px; font-weight: 600; }
    .curve-lbl { font-size: 9.5px; font-weight: 700; }
    .badge-txt { font-size: 8px; font-weight: 700; }
    .card-title { font-size: 9px; font-weight: 700; fill: #0f172a; }
    .card-txt { font-size: 8px; fill: #334155; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- ZONES BACKGROUND                                                       -->
  <!-- ====================================================================== -->
  <!-- Safe Zone Region (ρ < 0.7) -->
  <rect x="85" y="45" width="364" height="305" fill="#f0fdf4" fill-opacity="0.6"/>
  
  <!-- Caution Zone Region (0.7 <= ρ <= 0.85) -->
  <rect x="449" y="45" width="78" height="305" fill="#fef3c7" fill-opacity="0.6"/>

  <!-- Danger Zone Region (ρ > 0.85) -->
  <rect x="527" y="45" width="93" height="305" fill="#ffe4e6" fill-opacity="0.6"/>

  <!-- Grid Lines -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="85" y1="289" x2="620" y2="289"/>
    <line x1="85" y1="228" x2="620" y2="228"/>
    <line x1="85" y1="167" x2="620" y2="167"/>
    <line x1="85" y1="106" x2="620" y2="106"/>
  </g>

  <!-- Zone Boundary Dotted Lines -->
  <!-- ρ = 0.7 -->
  <line x1="449" y1="45" x2="449" y2="350" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- ρ = 0.85 -->
  <line x1="527" y1="45" x2="527" y2="350" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- Saturation Asymptote ρ = 1.0 -->
  <line x1="605" y1="45" x2="605" y2="350" stroke="#be123c" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Zone Watermarks/Labels placed comfortably above curves -->
  <text x="250" y="220" text-anchor="middle" class="zone-title" fill="#15803d">Safe Operating Zone</text>
  <text x="250" y="234" text-anchor="middle" class="zone-sub" fill="#16a34a">ρ &lt; 0.7 · Minimal Queuing Delay</text>

  <text x="488" y="115" text-anchor="middle" class="zone-title" fill="#b45309">Caution</text>
  <text x="488" y="128" text-anchor="middle" class="zone-sub" fill="#d97706">0.7–0.85</text>

  <text x="571" y="90" text-anchor="middle" class="zone-title" fill="#be123c">Danger Zone</text>
  <text x="571" y="103" text-anchor="middle" class="zone-sub" fill="#e11d48">ρ &gt; 0.85</text>

  <!-- ====================================================================== -->
  <!-- LEGEND CARD (Top-Left)                                                 -->
  <!-- ====================================================================== -->
  <g transform="translate(100, 58)">
    <rect x="0" y="0" width="200" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="16" class="card-title">Queuing Regime Thresholds</text>

    <!-- Safe -->
    <rect x="12" y="24" width="12" height="10" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="30" y="33" class="card-txt"><tspan font-weight="700" fill="#15803d">Safe (ρ &lt; 0.7):</tspan> stable queue depth</text>

    <!-- Caution -->
    <rect x="12" y="40" width="12" height="10" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
    <text x="30" y="49" class="card-txt"><tspan font-weight="700" fill="#b45309">Caution (0.7–0.85):</tspan> variance amplifies</text>

    <!-- Danger -->
    <rect x="12" y="56" width="12" height="10" rx="2" fill="#ffe4e6" stroke="#e11d48" stroke-width="0.8"/>
    <text x="30" y="65" class="card-txt"><tspan font-weight="700" fill="#be123c">Danger (ρ &gt; 0.85):</tspan> queue grows to ∞</text>
  </g>

  <!-- ====================================================================== -->
  <!-- AXES & TICKS                                                           -->
  <!-- ====================================================================== -->
  <!-- X-Axis -->
  <line x1="85" y1="350" x2="630" y2="350" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="350" y="390" text-anchor="middle" class="axis-title">System Utilization (ρ)</text>

  <!-- Y-Axis -->
  <line x1="85" y1="350" x2="85" y2="35" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="30" y="195" text-anchor="middle" class="axis-title" transform="rotate(-90, 30, 195)">Mean Queue Length (requests)</text>

  <!-- X Ticks -->
  <g class="tick-lbl" text-anchor="middle">
    <line x1="85" y1="350" x2="85" y2="356" stroke="#475569" stroke-width="1"/>
    <text x="85" y="368">0</text>

    <line x1="189" y1="350" x2="189" y2="356" stroke="#475569" stroke-width="1"/>
    <text x="189" y="368">0.2</text>

    <line x1="293" y1="350" x2="293" y2="356" stroke="#475569" stroke-width="1"/>
    <text x="293" y="368">0.4</text>

    <line x1="397" y1="350" x2="397" y2="356" stroke="#475569" stroke-width="1"/>
    <text x="397" y="368">0.6</text>

    <line x1="449" y1="350" x2="449" y2="356" stroke="#16a34a" stroke-width="1.2"/>
    <text x="449" y="368" font-weight="700" fill="#15803d">0.7</text>

    <line x1="501" y1="350" x2="501" y2="356" stroke="#475569" stroke-width="1"/>
    <text x="501" y="368">0.8</text>

    <line x1="527" y1="350" x2="527" y2="356" stroke="#e11d48" stroke-width="1.2"/>
    <text x="527" y="368" font-weight="700" fill="#be123c">0.85</text>

    <line x1="605" y1="350" x2="605" y2="356" stroke="#be123c" stroke-width="1.2"/>
    <text x="605" y="368" font-weight="700" fill="#be123c">1.0</text>
  </g>

  <!-- Y Ticks -->
  <g class="tick-lbl" text-anchor="end">
    <line x1="80" y1="350" x2="85" y2="350" stroke="#475569" stroke-width="1"/>
    <text x="76" y="353">0</text>

    <line x1="80" y1="289" x2="85" y2="289" stroke="#475569" stroke-width="1"/>
    <text x="76" y="292">5</text>

    <line x1="80" y1="228" x2="85" y2="228" stroke="#475569" stroke-width="1"/>
    <text x="76" y="231">10</text>

    <line x1="80" y1="167" x2="85" y2="167" stroke="#475569" stroke-width="1"/>
    <text x="76" y="170">15</text>

    <line x1="80" y1="106" x2="85" y2="106" stroke="#475569" stroke-width="1"/>
    <text x="76" y="109">20</text>

    <line x1="80" y1="45" x2="85" y2="45" stroke="#475569" stroke-width="1"/>
    <text x="76" y="48">25</text>
  </g>

  <!-- ====================================================================== -->
  <!-- M/M/1 QUEUE CURVE                                                      -->
  <!-- ====================================================================== -->
  <!-- Polyline plotted with exact M/M/1 coordinates:
       x = 85 + rho * 520, y = 350 - (rho/(1-rho)) * 12.2
       rho=0: (85, 350)
       rho=0.2: (189, 347.0)
       rho=0.4: (293, 341.9)
       rho=0.5: (345, 337.8)
       rho=0.6: (397, 331.7)
       rho=0.7: (449, 321.5)
       rho=0.75: (475, 313.4)
       rho=0.8: (501, 301.2)
       rho=0.85: (527, 280.9)
       rho=0.88: (542.6, 260.5)
       rho=0.90: (553, 240.2)
       rho=0.92: (563.4, 209.7)
       rho=0.94: (573.8, 158.9)
       rho=0.95: (579, 118.2)
       rho=0.96: (584.2, 57.2)
  -->
  <polyline points="85,350 137,348.6 189,347.0 241,344.8 293,341.9 345,337.8 397,331.7 423,327.3 449,321.5 475,313.4 501,301.2 514,292.5 527,280.9 542.6,260.5 553,240.2 563.4,209.7 573.8,158.9 579,118.2 584.2,57.2"
            fill="none" stroke="#0284c7" stroke-width="2.8" stroke-linejoin="round" clip-path="url(#plot-clip)"/>

  <!-- Curve Formula Label -->
  <rect x="330" y="278" width="136" height="22" rx="3" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="398" y="293" text-anchor="middle" class="curve-lbl" fill="#0369a1">M/M/1: L = ρ / (1 − ρ)</text>

  <!-- ====================================================================== -->
  <!-- HOCKEY STICK BEND ANNOTATION                                           -->
  <!-- ====================================================================== -->
  <!-- Knee Callout -->
  <g transform="translate(435, 175)">
    <rect x="0" y="0" width="82" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="41" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Hockey Stick</text>
    <text x="41" y="26" text-anchor="middle" font-size="8" font-weight="600" fill="#d97706">Knee (ρ ≈ 0.8)</text>
    <path d="M 41,34 L 41,75 L 63,115" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  </g>

  <!-- Saturation Asymptote Annotation -->
  <text x="613" y="110" class="badge-txt" fill="#be123c" transform="rotate(90, 613, 110)">Asymptote (ρ → 1.0)</text>

  <!-- ====================================================================== -->
  <!-- FOOTER TAKEAWAY                                                        -->
  <!-- ====================================================================== -->
  <text x="350" y="420" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    Production serving systems target ρ ≤ 0.7 to preserve latency headroom; beyond ρ = 0.85, queuing delay diverges toward infinity.
  </text>
</svg>
