<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="392" fill="#ffffff"/>

  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== Connectors (drawn first so boxes sit on top) ===== -->
  <g fill="none" stroke="#64748b" stroke-width="1.4">
    <path d="M380 66 V86 H200 V104" marker-end="url(#arr-gray)"/>
    <path d="M380 86 H560 V104" marker-end="url(#arr-gray)"/>
    <path d="M200 162 V182 H110 V200" marker-end="url(#arr-gray)"/>
    <path d="M200 182 H290 V200" marker-end="url(#arr-gray)"/>
    <path d="M560 162 V182 H470 V200" marker-end="url(#arr-gray)"/>
    <path d="M560 182 H650 V200" marker-end="url(#arr-gray)"/>
    <path d="M110 258 V294" marker-end="url(#arr-gray)"/>
    <path d="M290 258 V294" marker-end="url(#arr-gray)"/>
    <path d="M470 258 V294" marker-end="url(#arr-gray)"/>
    <path d="M650 258 V294" marker-end="url(#arr-gray)"/>
  </g>

  <!-- ===== Row 1: the anomaly that starts triage ===== -->
  <rect x="270" y="20" width="220" height="46" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="380" y="40" font-size="14" font-weight="700" fill="#0f172a">Telemetry anomaly</text>
    <text x="380" y="57" font-size="12" fill="#475569">step time or MFU off baseline</text>
  </g>

  <!-- ===== Row 2: which telemetry source shows it ===== -->
  <rect x="75" y="104" width="250" height="58" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="435" y="104" width="250" height="58" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <g text-anchor="middle">
    <text x="200" y="128" font-size="13.5" font-weight="700" fill="#0f172a">Node telemetry</text>
    <text x="200" y="147" font-size="12" fill="#475569">MFU, temperature, PCIe errors</text>
    <text x="560" y="128" font-size="13.5" font-weight="700" fill="#0f172a">Network telemetry</text>
    <text x="560" y="147" font-size="12" fill="#475569">pause frames, credits, step tails</text>
  </g>

  <!-- ===== Row 3: the specific signal (fault and risk role) ===== -->
  <g fill="#fee2e2" stroke="#dc2626" stroke-width="1.2">
    <rect x="30" y="200" width="160" height="58" rx="3"/>
    <rect x="210" y="200" width="160" height="58" rx="3"/>
    <rect x="390" y="200" width="160" height="58" rx="3"/>
    <rect x="570" y="200" width="160" height="58" rx="3"/>
  </g>
  <g text-anchor="middle">
    <text x="110" y="224" font-size="13" font-weight="700" fill="#b91c1c">Thermal throttle</text>
    <text x="110" y="243" font-size="12" fill="#475569">GPU above 85 °C</text>
    <text x="290" y="224" font-size="13" font-weight="700" fill="#b91c1c">PCIe AER retries</text>
    <text x="290" y="243" font-size="12" fill="#475569">link width below x16</text>
    <text x="470" y="224" font-size="13" font-weight="700" fill="#b91c1c">IB credit stalls</text>
    <text x="470" y="243" font-size="12" fill="#475569">PFC pause frames</text>
    <text x="650" y="224" font-size="13" font-weight="700" fill="#b91c1c">High tail latency</text>
    <text x="650" y="243" font-size="12" fill="#475569">one rank always last</text>
  </g>

  <!-- ===== Row 4: the C3 axis that binds ===== -->
  <rect x="30" y="294" width="160" height="62" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <rect x="210" y="294" width="160" height="62" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <rect x="390" y="294" width="160" height="62" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="570" y="294" width="160" height="62" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="110" y="320" font-size="13.5" font-weight="700" fill="#14294E">Compute (C₁)</text>
    <text x="110" y="340" font-size="12" fill="#14294E">clock throttling</text>
    <text x="290" y="320" font-size="13.5" font-weight="700" fill="#14294E">Compute (C₁)</text>
    <text x="290" y="340" font-size="12" fill="#14294E">host link degraded</text>
    <text x="470" y="320" font-size="13.5" font-weight="700" fill="#b45309">Communication (C₂)</text>
    <text x="470" y="340" font-size="12" fill="#b45309">fabric congestion</text>
    <text x="650" y="320" font-size="13.5" font-weight="700" fill="#6d28d9">Coordination (C₃)</text>
    <text x="650" y="340" font-size="12" fill="#6d28d9">straggler at barrier</text>
  </g>
</svg>
