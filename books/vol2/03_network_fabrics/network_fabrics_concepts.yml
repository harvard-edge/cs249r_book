  formulas:
    - '1. Latency-dominated (n < \alpha\beta): Transfer time is dominated by the startup cost \alpha. Small control
      messages and pipeline bubbles fall here.'
    - '2. Bandwidth-dominated (n > \alpha\beta): Transfer time scales with n/\beta. Gradient AllReduce typically
      falls here.'
    - Apply T(n) = \alpha + n/\beta for a 4 KB control message and a 100 MB gradient shard.
    - 'InfiniBand: 1.5\mu s + 4 KB/50 GB/s = 1.5 + 0.08 = \mathbf{1.58 \mu s}'
    - 'Ethernet: 5.0\mu s + 4 KB/12.5 GB/s = 5.0 + 0.32 = \mathbf{5.32 \mu s}'
    - '*Verdict*: InfiniBand is 3.4\times faster purely due to lower \alpha.'
    - 'InfiniBand: 1.5\mu s + 100 MB/50 GB/s = 0.0015 + 2.0 = \mathbf{2.00 ms}'
    - 'Ethernet: 5.0\mu s + 100 MB/12.5 GB/s = 0.005 + 8.0 = \mathbf{8.01 ms}'
    - '*Verdict*: InfiniBand is 4\times faster purely due to higher \beta.'
    - With N = 1{,}024 and M = 4 \times 10^9 bytes
    - '1. Total transceiver exposure: 4,096 GPUs \times 3 links/GPU \times 2 transceivers/link = 24,576 transceivers.'
    - '2. Probability of zero failures: P(\text{safe}) = (1 - 0.00001)^{24,576} \approx 0.78, so P(\text{storm})
      \approx 0.22.'
