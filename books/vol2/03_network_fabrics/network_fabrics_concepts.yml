      status: draft
      evidence:
        section: sec-network-workload-inversion
        quote: The flow inversion compounds this problem. Traditional networks are designed for fairness
          among millions of "mice flows,"\index{Mice flow!network traffic}[^fn-elephant-flow-collision]
          yet ML training is dominated by a few "elephant flows"\index{Elephant flow!gradient AllReduce}
          corresponding to the gradient AllReduce. The full 175B model has `{python} NetworkRunningExampleCluster.grad_gb_str`
          of gradient state at the assumed precision, but a sharded job distributes that state across workers.
          Each collective operates on its participating group and local payload; its algorithm determines
          how much each worker sends. Standard flow control and routing mechanisms like equal-cost multi-path
          (ECMP)\index{ECMP!elephant flow limitations}\index{Multi-path routing|see{ECMP}}\index{Equal-cost
          multi-path|see{ECMP}}, which hash each flow onto one of several equal-cost paths, are poorly suited
          to this traffic pattern. A static hash\index{ECMP!hash polarization} cannot subdivide one elephant
          flow across all available links, and it can inadvertently map multiple elephant flows to the same
          link, creating massive congestion while other links sit idle.
