<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arr-axis-left" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-axis-right" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Plot Area: x=85..575, y=30..280 (height=250) -->
  <!-- Grid Lines -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="85" y1="30" x2="575" y2="30"/>
    <line x1="85" y1="80" x2="575" y2="80"/>
    <line x1="85" y1="130" x2="575" y2="130"/>
    <line x1="85" y1="180" x2="575" y2="180"/>
    <line x1="85" y1="230" x2="575" y2="230"/>
    <line x1="85" y1="280" x2="575" y2="280"/>
  </g>

  <!-- Left Y-Axis: Bisection Bandwidth (TB/s) -->
  <line x1="85" y1="280" x2="85" y2="22" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-axis-left)"/>
  <text x="32" y="155" text-anchor="middle" font-size="9" font-weight="700" fill="#0284c7" transform="rotate(-90, 32, 155)">Bisection Bandwidth (TB/s)</text>

  <!-- Left Y Ticks & Labels (0 to 25 TB/s) -->
  <text x="78" y="284" text-anchor="end" font-size="8.5" fill="#64748b">0</text>
  <text x="78" y="234" text-anchor="end" font-size="8.5" fill="#64748b">5</text>
  <text x="78" y="184" text-anchor="end" font-size="8.5" fill="#64748b">10</text>
  <text x="78" y="134" text-anchor="end" font-size="8.5" fill="#64748b">15</text>
  <text x="78" y="84" text-anchor="end" font-size="8.5" fill="#64748b">20</text>
  <text x="78" y="34" text-anchor="end" font-size="8.5" fill="#64748b">25</text>

  <!-- Right Y-Axis: Interconnect Cost ($/Gb/s) -->
  <line x1="575" y1="280" x2="575" y2="22" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-axis-right)"/>
  <text x="630" y="155" text-anchor="middle" font-size="9" font-weight="700" fill="#d97706" transform="rotate(90, 630, 155)">Cost ($ / Gb/s)</text>

  <!-- Right Y Ticks & Labels (0 to $6 / Gb/s) -->
  <text x="583" y="284" font-size="8.5" fill="#b45309">0</text>
  <text x="583" y="234" font-size="8.5" fill="#b45309">$1.2</text>
  <text x="583" y="184" font-size="8.5" fill="#b45309">$2.4</text>
  <text x="583" y="134" font-size="8.5" fill="#b45309">$3.6</text>
  <text x="583" y="84" font-size="8.5" fill="#b45309">$4.8</text>
  <text x="583" y="34" font-size="8.5" fill="#b45309">$6.0</text>

  <!-- X Axis Base Line -->
  <line x1="85" y1="280" x2="575" y2="280" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- ===== BARS: Bisection Bandwidth (Compute/Fabric Blue) ===== -->
  <!-- Centers at x = 135, 235, 335, 435, 535; width = 50 -->

  <!-- 1. Fat-Tree: 25.6 TB/s -> height = (25.6/25)*250 = 256px -> y = 280-256 = 24 -->
  <g transform="translate(110, 24)">
    <rect x="0" y="0" width="50" height="256" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="25" y="-6" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">25.6</text>
  </g>
  <text x="135" y="296" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Fat-Tree</text>
  <text x="135" y="307" text-anchor="middle" font-size="7.5" fill="#64748b">Non-Blocking</text>

  <!-- 2. Dragonfly: 20.0 TB/s -> height = (20/25)*250 = 200px -> y = 280-200 = 80 -->
  <g transform="translate(210, 80)">
    <rect x="0" y="0" width="50" height="200" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="25" y="-6" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">20.0</text>
  </g>
  <text x="235" y="296" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Dragonfly</text>
  <text x="235" y="307" text-anchor="middle" font-size="7.5" fill="#64748b">Direct Interconnect</text>

  <!-- 3. Torus 3D: 8.0 TB/s -> height = (8/25)*250 = 80px -> y = 280-80 = 200 -->
  <g transform="translate(310, 200)">
    <rect x="0" y="0" width="50" height="80" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="25" y="-6" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">8.0</text>
  </g>
  <text x="335" y="296" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Torus 3D</text>
  <text x="335" y="307" text-anchor="middle" font-size="7.5" fill="#64748b">Mesh Ring</text>

  <!-- 4. Rail-Opt: 12.8 TB/s -> height = (12.8/25)*250 = 128px -> y = 280-128 = 152 -->
  <g transform="translate(410, 152)">
    <rect x="0" y="0" width="50" height="128" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="25" y="-6" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">12.8</text>
  </g>
  <text x="435" y="296" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Rail-Opt.</text>
  <text x="435" y="307" text-anchor="middle" font-size="7.5" fill="#64748b">Rank-Segregated</text>

  <!-- 5. Butterfly: 6.4 TB/s -> height = (6.4/25)*250 = 64px -> y = 280-64 = 216 -->
  <g transform="translate(510, 216)">
    <rect x="0" y="0" width="50" height="64" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="25" y="-6" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">6.4</text>
  </g>
  <text x="535" y="296" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Butterfly</text>
  <text x="535" y="307" text-anchor="middle" font-size="7.5" fill="#64748b">Multi-Stage</text>

  <!-- ===== LINE: Cost per Gb/s (Amber) ===== -->
  <!-- Scale: $6.0 = 250px -> 1$ = 41.67px -> y = 280 - (cost/6.0)*250 -->
  <!-- Fat-tree: $3.0 -> y = 280 - 125 = 155 -->
  <!-- Dragonfly: $4.0 -> y = 280 - 166.7 = 113.3 -->
  <!-- Torus 3D: $1.5 -> y = 280 - 62.5 = 217.5 -->
  <!-- Rail-Opt: $2.0 -> y = 280 - 83.3 = 196.7 -->
  <!-- Butterfly: $5.0 -> y = 280 - 208.3 = 71.7 -->
  <polyline points="135,155 235,113.3 335,217.5 435,196.7 535,71.7" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cost Points and Labels -->
  <!-- Fat-tree -->
  <circle cx="135" cy="155" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="115" y="132" width="40" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="135" y="143" text-anchor="middle" font-size="7.5" font-weight="700" fill="#92400e">$3.0</text>

  <!-- Dragonfly -->
  <circle cx="235" cy="113.3" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="215" y="90" width="40" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="235" y="101" text-anchor="middle" font-size="7.5" font-weight="700" fill="#92400e">$4.0</text>

  <!-- Torus 3D -->
  <circle cx="335" cy="217.5" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="315" y="225" width="40" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="335" y="236" text-anchor="middle" font-size="7.5" font-weight="700" fill="#92400e">$1.5</text>

  <!-- Rail-Opt -->
  <circle cx="435" cy="196.7" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="415" y="205" width="40" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="435" y="216" text-anchor="middle" font-size="7.5" font-weight="700" fill="#92400e">$2.0</text>

  <!-- Butterfly -->
  <circle cx="535" cy="71.7" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="515" y="48" width="40" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="535" y="59" text-anchor="middle" font-size="7.5" font-weight="700" fill="#92400e">$5.0</text>

  <!-- ===== LEGEND (Top Center) ===== -->
  <g transform="translate(200, 8)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="18" y="9" font-size="8" font-weight="600" fill="#334155">Bisection BW (TB/s)</text>

    <line x1="140" y1="6" x2="160" y2="6" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="150" cy="6" r="3" fill="#d97706"/>
    <text x="168" y="9" font-size="8" font-weight="600" fill="#334155">Interconnect Cost ($ / Gb/s)</text>
  </g>

  <!-- ===== BOTTOM SUMMARY CARD ===== -->
  <g transform="translate(60, 325)">
    <rect x="0" y="0" width="560" height="90" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="560" height="20" rx="4" fill="#f1f5f9"/>
    <text x="280" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Topology Trade-Offs (1,024-GPU Training Cluster)</text>

    <text x="20" y="38" font-size="8.5" font-weight="700" fill="#0284c7">Fat-Tree Clos:</text>
    <text x="110" y="38" font-size="8.5" fill="#475569">Delivers non-blocking 1:1 bisection bandwidth (25.6 TB/s), but requires high switch radix.</text>

    <text x="20" y="56" font-size="8.5" font-weight="700" fill="#d97706">Torus 3D:</text>
    <text x="110" y="56" font-size="8.5" fill="#475569">Cuts cabling and switch costs by 50% ($1.5/Gb/s), but chokes global all-to-all shuffles (8 TB/s).</text>

    <text x="20" y="74" font-size="8.5" font-weight="700" fill="#15803d">Rail-Optimized:</text>
    <text x="110" y="74" font-size="8.5" fill="#475569">Matches data-parallel communication patterns to dedicated leaf domains ($2.0/Gb/s, 12.8 TB/s).</text>
  </g>
</svg>
