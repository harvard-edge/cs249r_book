<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- PFC credit deadlock: four switch buffers B1..B4 form a cyclic dependency.
       Solid gray = a packet in B_i needs space in B_j; dashed red = PAUSE sent upstream. Schematic only. -->
  <rect width="680" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="150" y="30" width="120" height="70" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="210" y="50" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Switch 1</text>
  <rect x="164" y="64" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="182" y="64" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="200" y="64" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="218" y="64" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="246" y="76" text-anchor="start" font-size="9.5" font-weight="700" fill="#b91c1c"><tspan font-style="italic">b</tspan>₁</text>
  <text x="200" y="93" text-anchor="middle" font-size="8" fill="#475569">queue full</text>
  <rect x="410" y="30" width="120" height="70" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="470" y="50" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Switch 2</text>
  <rect x="424" y="64" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="442" y="64" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="460" y="64" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="478" y="64" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="506" y="76" text-anchor="start" font-size="9.5" font-weight="700" fill="#b91c1c"><tspan font-style="italic">b</tspan>₂</text>
  <text x="460" y="93" text-anchor="middle" font-size="8" fill="#475569">queue full</text>
  <rect x="410" y="190" width="120" height="70" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="470" y="210" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Switch 3</text>
  <rect x="424" y="224" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="442" y="224" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="460" y="224" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="478" y="224" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="506" y="236" text-anchor="start" font-size="9.5" font-weight="700" fill="#b91c1c"><tspan font-style="italic">b</tspan>₃</text>
  <text x="460" y="253" text-anchor="middle" font-size="8" fill="#475569">queue full</text>
  <rect x="150" y="190" width="120" height="70" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="210" y="210" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Switch 4</text>
  <rect x="164" y="224" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="182" y="224" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="200" y="224" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="218" y="224" width="18" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="246" y="236" text-anchor="start" font-size="9.5" font-weight="700" fill="#b91c1c"><tspan font-style="italic">b</tspan>₄</text>
  <text x="200" y="253" text-anchor="middle" font-size="8" fill="#475569">queue full</text>
  <line x1="270" y1="50" x2="408" y2="50" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="340" y="44" text-anchor="middle" font-size="8.5" fill="#334155"><tspan font-style="italic">b</tspan>₁ → <tspan font-style="italic">b</tspan>₂</text>
  <line x1="410" y1="80" x2="272" y2="80" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="340" y="94" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">PAUSE</text>
  <line x1="440" y1="100" x2="440" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="434" y="148" text-anchor="end" font-size="8.5" fill="#334155"><tspan font-style="italic">b</tspan>₂ → <tspan font-style="italic">b</tspan>₃</text>
  <line x1="500" y1="190" x2="500" y2="102" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="506" y="148" text-anchor="start" font-size="8.5" font-weight="700" fill="#b91c1c">PAUSE</text>
  <line x1="410" y1="240" x2="272" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="340" y="254" text-anchor="middle" font-size="8.5" fill="#334155"><tspan font-style="italic">b</tspan>₃ → <tspan font-style="italic">b</tspan>₄</text>
  <line x1="270" y1="210" x2="408" y2="210" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="340" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">PAUSE</text>
  <line x1="240" y1="190" x2="240" y2="102" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="246" y="148" text-anchor="start" font-size="8.5" fill="#334155"><tspan font-style="italic">b</tspan>₄ → <tspan font-style="italic">b</tspan>₁</text>
  <line x1="180" y1="100" x2="180" y2="188" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="174" y="148" text-anchor="end" font-size="8.5" font-weight="700" fill="#b91c1c">PAUSE</text>
  <line x1="120" y1="292" x2="150" y2="292" stroke="#64748b" stroke-width="1.5"/>
  <text x="158" y="295" text-anchor="start" font-size="8" fill="#475569">packet in one buffer needs space in the next</text>
  <line x1="400" y1="292" x2="430" y2="292" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="438" y="295" text-anchor="start" font-size="8" fill="#475569">PAUSE sent to the upstream port</text>
</svg>
