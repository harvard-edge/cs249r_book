<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- PFC credit deadlock: four switch buffers b1..b4 form a cyclic dependency.
       Solid gray = a packet in b_i needs space in b_j (clockwise); dashed red = PAUSE sent upstream (counterclockwise). Schematic only. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="600" height="330" fill="#ffffff"/>
  <!-- ── Switch 1 ── -->
  <rect x="60" y="30" width="140" height="80" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="130" y="51" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Switch 1</text>
  <rect x="80" y="62" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="100" y="62" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="120" y="62" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="140" y="62" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="168" y="76" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c"><tspan font-style="italic">b</tspan>₁</text>
  <text x="120" y="98" text-anchor="middle" font-size="11" fill="#475569">queue full</text>
  <!-- ── Switch 2 ── -->
  <rect x="400" y="30" width="140" height="80" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="470" y="51" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Switch 2</text>
  <rect x="420" y="62" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="440" y="62" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="460" y="62" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="480" y="62" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="508" y="76" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c"><tspan font-style="italic">b</tspan>₂</text>
  <text x="460" y="98" text-anchor="middle" font-size="11" fill="#475569">queue full</text>
  <!-- ── Switch 3 ── -->
  <rect x="400" y="210" width="140" height="80" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="470" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Switch 3</text>
  <rect x="420" y="242" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="440" y="242" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="460" y="242" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="480" y="242" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="508" y="256" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c"><tspan font-style="italic">b</tspan>₃</text>
  <text x="460" y="278" text-anchor="middle" font-size="11" fill="#475569">queue full</text>
  <!-- ── Switch 4 ── -->
  <rect x="60" y="210" width="140" height="80" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="130" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Switch 4</text>
  <rect x="80" y="242" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="100" y="242" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="120" y="242" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="140" y="242" width="20" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="168" y="256" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c"><tspan font-style="italic">b</tspan>₄</text>
  <text x="120" y="278" text-anchor="middle" font-size="11" fill="#475569">queue full</text>
  <!-- ===== Dependencies (solid, clockwise) and PAUSE frames (dashed, counterclockwise) ===== -->
  <line x1="200" y1="48" x2="398" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="300" y="40" text-anchor="middle" font-size="11.5" fill="#334155"><tspan font-style="italic">b</tspan>₁ → <tspan font-style="italic">b</tspan>₂</text>
  <line x1="400" y1="92" x2="202" y2="92" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="300" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">PAUSE</text>
  <line x1="430" y1="110" x2="430" y2="208" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="422" y="164" text-anchor="end" font-size="11.5" fill="#334155"><tspan font-style="italic">b</tspan>₂ → <tspan font-style="italic">b</tspan>₃</text>
  <line x1="510" y1="210" x2="510" y2="112" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="518" y="164" text-anchor="start" font-size="11" font-weight="700" fill="#b91c1c">PAUSE</text>
  <line x1="200" y1="228" x2="398" y2="228" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="300" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">PAUSE</text>
  <line x1="400" y1="272" x2="202" y2="272" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="300" y="288" text-anchor="middle" font-size="11.5" fill="#334155"><tspan font-style="italic">b</tspan>₃ → <tspan font-style="italic">b</tspan>₄</text>
  <line x1="170" y1="210" x2="170" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="178" y="164" text-anchor="start" font-size="11.5" fill="#334155"><tspan font-style="italic">b</tspan>₄ → <tspan font-style="italic">b</tspan>₁</text>
  <line x1="90" y1="110" x2="90" y2="208" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="82" y="164" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">PAUSE</text>
  <!-- ===== Key ===== -->
  <line x1="60" y1="310" x2="90" y2="310" stroke="#64748b" stroke-width="1.5"/>
  <text x="98" y="314" text-anchor="start" font-size="11" fill="#475569">packet in one buffer needs space in the next</text>
  <line x1="356" y1="310" x2="386" y2="310" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="394" y="314" text-anchor="start" font-size="11" fill="#475569">PAUSE sent to the upstream port</text>
</svg>
