<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 415">
  <!-- Clean canvas background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- LEVEL 5: CLUSTER DESIGN (COORDINATION PURPLE)                         -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 16)">
    <rect width="620" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 616,0 Q 620,0 620,4 L 620,24 L 0,24 Z" fill="#f3e8ff"/>
    <line x1="0" y1="24" x2="620" y2="24" stroke="#7c3aed" stroke-width="1"/>
    <text x="16" y="16.5" font-size="10" font-weight="700" fill="#6d28d9">LEVEL 5 — Cluster Design &amp; Integration</text>
    
    <rect x="566" y="4" width="42" height="16" rx="2" fill="#7c3aed"/>
    <text x="587" y="15.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">L5</text>

    <text x="16" y="42" font-size="10" font-weight="700" fill="#334155">DGX SuperPOD · TPU Pods · Multi-Rail Cluster Fabric</text>
    <text x="16" y="56" font-size="8.5" fill="#64748b">Topology-aware job placement · failure domain isolation · multi-rail chassis routing · operational runbooks</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- LEVEL 4: FABRIC BEHAVIOR & FLOW CONTROL (CONGESTION AMBER)            -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 94)">
    <rect width="620" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 616,0 Q 620,0 620,4 L 620,24 L 0,24 Z" fill="#fef3c7"/>
    <line x1="0" y1="24" x2="620" y2="24" stroke="#d97706" stroke-width="1"/>
    <text x="16" y="16.5" font-size="10" font-weight="700" fill="#b45309">LEVEL 4 — Fabric Behavior &amp; Congestion Dynamics</text>
    
    <rect x="566" y="4" width="42" height="16" rx="2" fill="#d97706"/>
    <text x="587" y="15.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">L4</text>

    <text x="16" y="42" font-size="10" font-weight="700" fill="#334155">PFC · DCQCN · HPCC · Packet Trimming · Adaptive Routing</text>
    <text x="16" y="56" font-size="8.5" fill="#64748b">Head-of-line blocking · PFC deadlock loops · incast burst collapse · tail-latency stragglers · buffer bloat</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- LEVEL 3: SWITCH & TOPOLOGY (ROUTING / COMMUNICATION)                  -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 172)">
    <rect width="620" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 616,0 Q 620,0 620,4 L 620,24 L 0,24 Z" fill="#f1f5f9"/>
    <line x1="0" y1="24" x2="620" y2="24" stroke="#94a3b8" stroke-width="1"/>
    <text x="16" y="16.5" font-size="10" font-weight="700" fill="#334155">LEVEL 3 — Switch Architecture &amp; Topologies</text>
    
    <rect x="566" y="4" width="42" height="16" rx="2" fill="#475569"/>
    <text x="587" y="15.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">L3</text>

    <text x="16" y="42" font-size="10" font-weight="700" fill="#334155">Fat-Tree (Clos) · Rail-Optimized · Dragonfly+ · Torus Mesh</text>
    <text x="16" y="56" font-size="8.5" fill="#64748b">Switch radix limits · non-blocking bisection · ECMP hashing · optical vs electrical switching · hop penalty</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- LEVEL 2: TRANSPORT & ACCELERATOR INTERFACE (COMPUTE BLUE)             -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 250)">
    <rect width="620" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 616,0 Q 620,0 620,4 L 620,24 L 0,24 Z" fill="#EAF1F8"/>
    <line x1="0" y1="24" x2="620" y2="24" stroke="#1F407A" stroke-width="1"/>
    <text x="16" y="16.5" font-size="10" font-weight="700" fill="#14294E">LEVEL 2 — Transport Protocols &amp; Direct Memory Access</text>
    
    <rect x="566" y="4" width="42" height="16" rx="2" fill="#1F407A"/>
    <text x="587" y="15.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">L2</text>

    <text x="16" y="42" font-size="10" font-weight="700" fill="#334155">GPUDirect RDMA · RoCEv2 · InfiniBand Verbs · α-β Cost Model</text>
    <text x="16" y="56" font-size="8.5" fill="#64748b">Zero-copy kernel bypass · NIC PCIe p2p access · reliable connection (RC) QP state · latency/transfer terms</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- LEVEL 1: PHYSICAL WIRE, SERDES & OPTICS (STORAGE/PHYSICAL)            -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 328)">
    <rect width="620" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 616,0 Q 620,0 620,4 L 620,24 L 0,24 Z" fill="#dcfce7"/>
    <line x1="0" y1="24" x2="620" y2="24" stroke="#16a34a" stroke-width="1"/>
    <text x="16" y="16.5" font-size="10" font-weight="700" fill="#15803d">LEVEL 1 — Physical Layer: SerDes, Wires &amp; Optics</text>
    
    <rect x="566" y="4" width="42" height="16" rx="2" fill="#16a34a"/>
    <text x="587" y="15.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">L1</text>

    <text x="16" y="42" font-size="10" font-weight="700" fill="#334155">PAM4 Modulation · 106 Gbps SerDes · DAC Copper · AOC · Pluggable Optics</text>
    <text x="16" y="56" font-size="8.5" fill="#64748b">Bit error rate (BER) · Forward Error Correction (FEC) · insertion loss budget · optical reach · transceivers</text>
  </g>

