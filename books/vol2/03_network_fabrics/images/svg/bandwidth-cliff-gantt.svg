<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="720" height="240" fill="#ffffff"/>
  <!-- Time scale: 1.9 px per ms, t = 0 at x = 130. Compute phases in C1 blue; exposed AllReduce in red. -->
  <!-- ===== Intra-node ===== -->
  <text x="116" y="39" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">Intra-node</text>
  <text x="116" y="55" text-anchor="end" font-size="13" fill="#475569">8 GPUs, NVLink</text>
  <text x="116" y="71" text-anchor="end" font-size="13" font-weight="700" fill="#15803d">99.5% compute</text>
  <rect x="130.0" y="24" width="190" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="225.0" y="53" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Forward (100 ms)</text>
  <rect x="320.0" y="24" width="190" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="415.0" y="53" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Backward (100 ms)</text>
  <rect x="510.0" y="24" width="2.5" height="48" fill="#dc2626"/>
  <text x="520.9" y="53" text-anchor="start" font-size="13" font-weight="700" fill="#b91c1c">AllReduce (1 ms)</text>
  <!-- ===== Inter-node ===== -->
  <text x="116" y="119" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">Inter-node</text>
  <text x="116" y="135" text-anchor="end" font-size="13" fill="#475569">64 GPUs, IB</text>
  <text x="116" y="151" text-anchor="end" font-size="13" font-weight="700" fill="#b91c1c">87% compute</text>
  <rect x="130.0" y="104" width="190" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="225.0" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Forward (100 ms)</text>
  <rect x="320.0" y="104" width="190" height="48" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="415.0" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Backward (100 ms)</text>
  <rect x="510.0" y="104" width="57" height="48" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="576.0" y="133" text-anchor="start" font-size="13" font-weight="700" fill="#b91c1c">AllReduce (30 ms)</text>
  <!-- Idle-cost brace under the inter-node AllReduce -->
  <path d="M 510.0,158 Q 510.0,164 516.0,164 L 532.5,164 Q 538.5,164 538.5,170 Q 538.5,164 544.5,164 L 561.0,164 Q 567.0,164 567.0,158" fill="none" stroke="#dc2626" stroke-width="1.2"/>
  <text x="538.5" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">30 ms idle per step</text>
  <!-- ===== Time axis ===== -->
  <line x1="130" y1="206" x2="605.0" y2="206" stroke="#64748b" stroke-width="1.0" marker-end="url(#arr-gray)"/>
  <line x1="130.0" y1="202" x2="130.0" y2="210" stroke="#64748b" stroke-width="1.0"/>
  <text x="130.0" y="227" text-anchor="middle" font-size="12.5" fill="#475569">0</text>
  <line x1="320.0" y1="202" x2="320.0" y2="210" stroke="#64748b" stroke-width="1.0"/>
  <text x="320.0" y="227" text-anchor="middle" font-size="12.5" fill="#475569">100</text>
  <line x1="510.0" y1="202" x2="510.0" y2="210" stroke="#64748b" stroke-width="1.0"/>
  <text x="510.0" y="227" text-anchor="middle" font-size="12.5" fill="#475569">200</text>
  <line x1="567.0" y1="202" x2="567.0" y2="210" stroke="#64748b" stroke-width="1.0"/>
  <text x="567.0" y="227" text-anchor="middle" font-size="12.5" fill="#475569">230</text>
  <text x="615.0" y="211" text-anchor="start" font-size="13" fill="#475569">Time (ms)</text>
</svg>
