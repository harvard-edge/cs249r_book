<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 435">
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean canvas background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- SENDER NODE (LEFT)                                                    -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 16)">
    <rect width="210" height="290" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 206,0 Q 210,0 210,4 L 210,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="210" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#334155">Sender Node</text>
    <text x="196" y="18" text-anchor="end" font-size="8.5" fill="#64748b">Host A</text>

    <!-- GPU Memory -->
    <g transform="translate(20, 42)">
      <rect width="170" height="46" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="85" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#14294E">GPU Memory (VRAM)</text>
      <text x="85" y="32" text-anchor="middle" font-size="8" fill="#475569">Gradient payload (HBM3)</text>
    </g>

    <!-- Host CPU / System RAM -->
    <g transform="translate(20, 126)">
      <rect width="170" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Host CPU &amp; Kernel RAM</text>
      <text x="85" y="32" text-anchor="middle" font-size="8" fill="#94a3b8">Bounce buffer (TCP/IP stack)</text>
    </g>

    <!-- Host NIC -->
    <g transform="translate(20, 210)">
      <rect width="170" height="46" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="85" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">Host NIC (ConnectX-7)</text>
      <text x="85" y="32" text-anchor="middle" font-size="8" fill="#475569">400 Gb/s RDMA engine</text>
    </g>

    <!-- PCIe bus labels -->
    <text x="105" y="104" text-anchor="middle" font-size="7" fill="#94a3b8">PCIe Switch</text>
    <text x="105" y="188" text-anchor="middle" font-size="7" fill="#94a3b8">PCIe Switch</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- CENTER NETWORK FABRIC                                                 -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(250, 16)">
    <rect width="180" height="290" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 176,0 Q 180,0 180,4 L 180,26 L 0,26 Z" fill="#f3e8ff"/>
    <line x1="0" y1="26" x2="180" y2="26" stroke="#7c3aed" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">Network Fabric</text>

    <!-- Network specs card -->
    <g transform="translate(16, 44)">
      <rect width="148" height="56" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="74" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">InfiniBand / RoCEv2</text>
      <text x="74" y="34" text-anchor="middle" font-size="8" fill="#475569">400–800 Gb/s Non-blocking</text>
      <text x="74" y="46" text-anchor="middle" font-size="7.5" fill="#64748b">1–3 μs wire flight time</text>
    </g>

    <!-- 700 GB eliminated badge -->
    <g transform="translate(16, 120)">
      <rect width="148" height="74" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <rect x="8" y="8" width="132" height="18" rx="2" fill="#dc2626"/>
      <text x="74" y="20.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">700 GB ELIMINATED</text>
      <text x="74" y="42" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Per Training Step</text>
      <text x="74" y="54" text-anchor="middle" font-size="7.5" fill="#334155">Zero CPU RAM thrashing</text>
      <text x="74" y="65" text-anchor="middle" font-size="7.5" fill="#64748b">Direct PCIe P2P DMA</text>
    </g>

    <text x="90" y="260" text-anchor="middle" font-size="8" fill="#64748b">Wire Transfer</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- RECEIVER NODE (RIGHT)                                                 -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(450, 16)">
    <rect width="210" height="290" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 206,0 Q 210,0 210,4 L 210,26 L 0,26 Z" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="210" y2="26" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#334155">Receiver Node</text>
    <text x="196" y="18" text-anchor="end" font-size="8.5" fill="#64748b">Host B</text>

    <!-- GPU Memory -->
    <g transform="translate(20, 42)">
      <rect width="170" height="46" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="85" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#14294E">GPU Memory (VRAM)</text>
      <text x="85" y="32" text-anchor="middle" font-size="8" fill="#475569">AllReduce accumulator</text>
    </g>

    <!-- Host CPU / System RAM -->
    <g transform="translate(20, 126)">
      <rect width="170" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Host CPU &amp; Kernel RAM</text>
      <text x="85" y="32" text-anchor="middle" font-size="8" fill="#94a3b8">Bounce buffer (TCP/IP stack)</text>
    </g>

    <!-- Host NIC -->
    <g transform="translate(20, 210)">
      <rect width="170" height="46" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="85" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">Host NIC (ConnectX-7)</text>
      <text x="85" y="32" text-anchor="middle" font-size="8" fill="#475569">400 Gb/s RDMA engine</text>
    </g>

    <!-- PCIe bus labels -->
    <text x="105" y="104" text-anchor="middle" font-size="7" fill="#94a3b8">PCIe Switch</text>
    <text x="105" y="188" text-anchor="middle" font-size="7" fill="#94a3b8">PCIe Switch</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- DATA PATH ROUTING (TRADITIONAL VS GPUDIRECT)                          -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->

  <!-- Path A: Traditional (Red dashed) -->
  <!-- Sender: GPU -> CPU -> NIC -->
  <line x1="125" y1="104" x2="125" y2="142" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
  <line x1="125" y1="188" x2="125" y2="226" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
  <!-- Sender NIC -> Network -->
  <line x1="210" y1="240" x2="250" y2="240" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
  <!-- Network -> Receiver NIC -->
  <line x1="430" y1="240" x2="470" y2="240" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
  <!-- Receiver: NIC -> CPU -> GPU -->
  <line x1="555" y1="226" x2="555" y2="188" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
  <line x1="555" y1="142" x2="555" y2="104" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>

  <!-- Path B: GPUDirect RDMA (Green solid) -->
  <!-- Sender: GPU direct to NIC via PCIe switch (left side) -->
  <path d="M 40,81 L 28,81 L 28,249 L 40,249" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="14" y="152" width="28" height="14" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.6"/>
  <text x="28" y="162" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">P2P</text>

  <!-- Sender NIC -> Network -->
  <line x1="210" y1="256" x2="250" y2="256" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <!-- Network -> Receiver NIC -->
  <line x1="430" y1="256" x2="470" y2="256" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Receiver NIC -> GPU direct via PCIe switch (right side) -->
  <path d="M 640,249 L 652,249 L 652,81 L 640,81" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="638" y="152" width="28" height="14" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.6"/>
  <text x="652" y="162" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">P2P</text>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM COMPARISON SUMMARY CARDS                                       -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 320)">
    <!-- Traditional Path Card -->
    <rect x="0" y="0" width="310" height="56" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
    <rect x="8" y="8" width="130" height="16" rx="2" fill="#fee2e2"/>
    <text x="73" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Traditional TCP/IP Path</text>
    <text x="10" y="36" font-size="8" fill="#334155">4 CPU copies + 4 PCIe traversals · CPU core burn</text>
    <text x="10" y="48" font-size="7.5" fill="#dc2626">Severe throughput throttling on 175B+ models</text>

    <!-- GPUDirect RDMA Card -->
    <rect x="330" y="0" width="310" height="56" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
    <rect x="338" y="8" width="130" height="16" rx="2" fill="#dcfce7"/>
    <text x="403" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">GPUDirect RDMA</text>
    <text x="340" y="36" font-size="8" fill="#334155">0 CPU copies · direct PCIe P2P DMA between GPU &amp; NIC</text>
    <text x="340" y="48" font-size="7.5" fill="#15803d">Line-rate 400 Gb/s collective exchange with 0% host CPU load</text>
  </g>

  <!-- Footnote -->
  <text x="340" y="416" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-style="italic">
    GPUDirect bypasses host CPU and DRAM entirely, eliminating 700 GB of redundant memory movement per training step.
  </text>
</svg>
