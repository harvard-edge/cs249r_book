<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-gray-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="arr-amber-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#d97706"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/></marker>
    <marker id="arr-blue-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#1F407A"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arr-red-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-green-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-violet-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arr-slate-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="560" height="232" fill="#ffffff"/>
  <rect x="8" y="8" width="470" height="176" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <text x="18" y="24" text-anchor="start" font-size="10" font-weight="700" fill="#0f172a">Sending node</text>
  <rect x="24" y="44" width="130" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="89" y="65" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14294E">GPU memory</text>
  <text x="89" y="78" text-anchor="middle" font-size="9.5" fill="#475569"><tspan font-style="italic">n</tspan>-byte payload</text>
  <rect x="196" y="44" width="104" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="248" y="65" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">PCIe switch</text>
  <text x="248" y="78" text-anchor="middle" font-size="9.5" fill="#475569">peer-to-peer path</text>
  <rect x="342" y="44" width="116" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="400" y="65" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">RDMA NIC</text>
  <text x="400" y="78" text-anchor="middle" font-size="9.5" fill="#475569">DMA engine</text>
  <rect x="196" y="128" width="104" height="40" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="248" y="147" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Host memory</text>
  <text x="248" y="160" text-anchor="middle" font-size="9.5" fill="#475569">registered buffer</text>
  <line x1="154" y1="66" x2="195" y2="66" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arr-green)"/>
  <line x1="300" y1="66" x2="341" y2="66" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arr-green)"/>
  <line x1="458" y1="66" x2="540" y2="66" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <text x="500" y="58" text-anchor="middle" font-size="9.5" fill="#b45309">to fabric</text>
  <path d="M 89,88 L 89,148 L 195,148" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="142" y="142" text-anchor="middle" font-size="9.5" fill="#0f172a">1. write <tspan font-style="italic">n</tspan> bytes</text>
  <path d="M 300,148 L 400,148 L 400,89" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="350" y="142" text-anchor="middle" font-size="9.5" fill="#0f172a">2. read <tspan font-style="italic">n</tspan> bytes</text>
  <line x1="18" y1="204" x2="48" y2="204" stroke="#16a34a" stroke-width="2.0"/>
  <text x="56" y="207.5" text-anchor="start" font-size="9.5" fill="#0f172a">GPUDirect RDMA: NIC reads GPU memory directly</text>
  <line x1="18" y1="222" x2="48" y2="222" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="56" y="225.5" text-anchor="start" font-size="9.5" fill="#0f172a">Without GPUDirect: staged through host memory, about 2<tspan font-style="italic">n</tspan> bytes of host-memory traffic</text>
</svg>
