<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 680 358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="-14" width="680" height="358" fill="#ffffff"/>

  <!-- ===== Fan-in: many senders converge on one port ===== -->
  <g stroke="#d97706" stroke-width="0.8" stroke-opacity="0.45">
    <line x1="100" y1="168" x2="200" y2="135"/>
    <line x1="100" y1="173" x2="200" y2="135"/>
    <line x1="100" y1="178" x2="200" y2="135"/>
    <line x1="100" y1="183" x2="200" y2="135"/>
    <line x1="100" y1="188" x2="200" y2="135"/>
    <line x1="100" y1="193" x2="200" y2="135"/>
    <line x1="100" y1="198" x2="200" y2="135"/>
  </g>
  <g stroke="#d97706" stroke-width="1.3">
    <line x1="100" y1="54" x2="200" y2="135"/>
    <line x1="100" y1="98" x2="200" y2="135"/>
    <line x1="100" y1="142" x2="200" y2="135"/>
    <line x1="100" y1="224" x2="200" y2="135"/>
  </g>
  <line x1="200" y1="135" x2="228" y2="135" stroke="#d97706" stroke-width="4"/>
  <path d="M226,129 L239,135 L226,141 Z" fill="#d97706"/>

  <rect x="20" y="40" width="80" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="60" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 1</text>
  <rect x="20" y="84" width="80" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="60" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 2</text>
  <rect x="20" y="128" width="80" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="60" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 3</text>
  <rect x="20" y="162" width="80" height="42" rx="2" fill="none" stroke="#1F407A" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="3,2"/>
  <text x="60" y="181" text-anchor="middle" font-size="16" fill="#475569">⋮</text>
  <text x="60" y="198" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">252 more</text>
  <rect x="20" y="210" width="80" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="60" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">GPU 256</text>
  <text x="108" y="50" font-size="11.5" fill="#b45309">50 GB/s each</text>

  <!-- ===== Backpressure ===== -->
  <path d="M300,70 V26 H60 V39" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="180" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">PAUSE</text>

  <!-- ===== Switch with full egress buffer ===== -->
  <rect x="240" y="70" width="200" height="130" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">Switch egress port</text>
  <g fill="#fee2e2" stroke="#dc2626" stroke-width="1">
    <rect x="260" y="110" width="16" height="26" rx="0"/>
    <rect x="276" y="110" width="16" height="26" rx="0"/>
    <rect x="292" y="110" width="16" height="26" rx="0"/>
    <rect x="308" y="110" width="16" height="26" rx="0"/>
    <rect x="324" y="110" width="16" height="26" rx="0"/>
    <rect x="340" y="110" width="16" height="26" rx="0"/>
    <rect x="356" y="110" width="16" height="26" rx="0"/>
    <rect x="372" y="110" width="16" height="26" rx="0"/>
    <rect x="388" y="110" width="16" height="26" rx="0"/>
    <rect x="404" y="110" width="16" height="26" rx="0"/>
  </g>
  <text x="340" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">32 MB buffer, full</text>
  <text x="340" y="178" text-anchor="middle" font-size="11.5" fill="#b91c1c">drops or PAUSE upstream</text>

  <!-- ===== Egress to receiver ===== -->
  <line x1="440" y1="123" x2="559" y2="123" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="500" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">400 Gb/s</text>
  <rect x="560" y="107" width="90" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="605" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Receiver</text>

  <!-- ===== Rates to scale ===== -->
  <line x1="20" y1="252" x2="660" y2="252" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="20" y="274" font-size="11.5" fill="#475569">rates to scale</text>
  <text x="150" y="288" text-anchor="end" font-size="12" fill="#0f172a">offered</text>
  <rect x="160" y="274" width="480" height="20" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="170" y="288" font-size="12" font-weight="700" fill="#b45309">12.8 TB/s</text>
  <text x="150" y="314" text-anchor="end" font-size="12" fill="#0f172a">egress</text>
  <rect x="160" y="300" width="2" height="20" rx="0" fill="#d97706"/>
  <text x="170" y="314" font-size="12" font-weight="700" fill="#b45309">50 GB/s</text>
  <text x="640" y="314" text-anchor="end" font-size="12" font-weight="700" fill="#b91c1c">256× oversubscribed</text>
</svg>
