    <marker id="arr-slate-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="540" height="226" fill="#ffffff"/>
  <!-- ===== Senders and fan-in ===== -->
  <rect x="20" y="20" width="74" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="57" y="38" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14294E">GPU 1</text>
  <line x1="94" y1="34" x2="150" y2="34" stroke="#d97706" stroke-width="1.3"/>
  <rect x="20" y="64" width="74" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="57" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14294E">GPU 2</text>
  <line x1="94" y1="78" x2="150" y2="78" stroke="#d97706" stroke-width="1.3"/>
  <rect x="20" y="108" width="74" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="57" y="126" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14294E">GPU 3</text>
  <line x1="94" y1="122" x2="150" y2="122" stroke="#d97706" stroke-width="1.3"/>
  <text x="57" y="156" text-anchor="middle" font-size="16" fill="#475569">⋮</text>
  <text x="101" y="158" text-anchor="start" font-size="9.5" font-style="italic" fill="#475569">252 more</text>
  <rect x="20" y="184" width="74" height="28" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="57" y="202" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14294E">GPU 256</text>
  <line x1="94" y1="198" x2="150" y2="198" stroke="#d97706" stroke-width="1.3"/>
  <line x1="150" y1="34" x2="150" y2="198" stroke="#d97706" stroke-width="1.3"/>
  <text x="100" y="29" text-anchor="start" font-size="9.5" fill="#b45309">50 GB/s each</text>
  <line x1="150" y1="118" x2="227" y2="118" stroke="#d97706" stroke-width="4"/>
  <path d="M 226,112 L 236,118 L 226,124 Z" fill="#d97706" stroke="#d97706" stroke-width="0.5" stroke-linejoin="round"/>
  <text x="193" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">12.8 TB/s</text>
  <text x="193" y="138" text-anchor="middle" font-size="9.5" fill="#b45309">offered</text>
  <!-- ===== Switch with full egress buffer ===== -->
  <rect x="236" y="72" width="150" height="92" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="311" y="90" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Switch egress port</text>
  <rect x="251" y="104" width="15" height="22" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
  <rect x="266" y="104" width="15" height="22" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
  <rect x="281" y="104" width="15" height="22" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
  <rect x="296" y="104" width="15" height="22" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
  <rect x="311" y="104" width="15" height="22" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
  <rect x="326" y="104" width="15" height="22" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
  <rect x="341" y="104" width="15" height="22" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
  <rect x="356" y="104" width="15" height="22" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
  <text x="311" y="142" text-anchor="middle" font-size="9.5" font-weight="600" fill="#b91c1c">32 MB buffer, full</text>
  <text x="311" y="155" text-anchor="middle" font-size="9.5" fill="#b91c1c">drops or PAUSE upstream</text>
  <!-- ===== Egress to receiver ===== -->
  <line x1="386" y1="118" x2="450" y2="118" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <text x="418" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">400 Gb/s</text>
  <text x="418" y="136" text-anchor="middle" font-size="9.5" fill="#b45309">(50 GB/s)</text>
  <rect x="450" y="102" width="80" height="32" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="490" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14294E">Receiver</text>
</svg>
