<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== TOP GPU SENDER NODES (Compute Blue) ===== -->
  <g id="top-gpus">
    <!-- GPU 1 -->
    <g transform="translate(40, 20)">
      <rect x="0" y="0" width="90" height="38" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="45" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU Node 1</text>
      <text x="45" y="29" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0369a1">50 GB/s Burst</text>
    </g>

    <!-- GPU 2 -->
    <g transform="translate(160, 20)">
      <rect x="0" y="0" width="90" height="38" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="45" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU Node 2</text>
      <text x="45" y="29" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0369a1">50 GB/s Burst</text>
    </g>

    <!-- GPU 3 -->
    <g transform="translate(280, 20)">
      <rect x="0" y="0" width="90" height="38" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="45" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU Node 3</text>
      <text x="45" y="29" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0369a1">50 GB/s Burst</text>
    </g>

    <!-- GPU 4 -->
    <g transform="translate(400, 20)">
      <rect x="0" y="0" width="90" height="38" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="45" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU Node 4</text>
      <text x="45" y="29" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0369a1">50 GB/s Burst</text>
    </g>

    <!-- GPU 5 -->
    <g transform="translate(520, 20)">
      <rect x="0" y="0" width="90" height="38" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="45" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU Node 5</text>
      <text x="45" y="29" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0369a1">50 GB/s Burst</text>
    </g>
  </g>

  <!-- ===== SIDE GPU NODES ===== -->
  <!-- Left GPU 6 -->
  <g transform="translate(40, 135)">
    <rect x="0" y="0" width="90" height="38" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="45" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU Node 6</text>
    <text x="45" y="29" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0369a1">50 GB/s Burst</text>
  </g>

  <!-- Right GPU 7 -->
  <g transform="translate(550, 135)">
    <rect x="0" y="0" width="90" height="38" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="45" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU Node 7</text>
    <text x="45" y="29" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0369a1">50 GB/s Burst</text>
  </g>

  <!-- ===== BOTTOM SENDER NODES ===== -->
  <!-- Bottom Left GPU 8 -->
  <g transform="translate(40, 235)">
    <rect x="0" y="0" width="90" height="38" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="45" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU Node 8</text>
    <text x="45" y="29" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0369a1">50 GB/s Burst</text>
  </g>

  <!-- Bottom Many Nodes Expansion -->
  <g transform="translate(210, 235)">
    <rect x="0" y="0" width="260" height="38" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">· · · 248 Additional Nodes · · ·</text>
    <text x="130" y="29" text-anchor="middle" font-size="7.5" fill="#64748b">Synchronized AllReduce / Gather Burst</text>
  </g>

  <!-- Bottom Right GPU 256 -->
  <g transform="translate(550, 235)">
    <rect x="0" y="0" width="90" height="38" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="45" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">GPU Node 256</text>
    <text x="45" y="29" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0369a1">50 GB/s Burst</text>
  </g>

  <!-- ===== CONVERGING ORTHOGONAL RED ARROWS ===== -->
  <g stroke="#dc2626" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <!-- Top GPU 1 -->
    <path d="M 85,58 L 85,90 L 250,90 L 250,118" marker-end="url(#arr-red)"/>
    <!-- Top GPU 2 -->
    <path d="M 205,58 L 205,90 L 285,90 L 285,118" marker-end="url(#arr-red)"/>
    <!-- Top GPU 3 -->
    <path d="M 325,58 L 325,118" marker-end="url(#arr-red)"/>
    <!-- Top GPU 4 -->
    <path d="M 445,58 L 445,90 L 365,90 L 365,118" marker-end="url(#arr-red)"/>
    <!-- Top GPU 5 -->
    <path d="M 565,58 L 565,90 L 400,90 L 400,118" marker-end="url(#arr-red)"/>

    <!-- Left GPU 6 -->
    <path d="M 130,154 L 198,154" marker-end="url(#arr-red)"/>

    <!-- Right GPU 7 -->
    <path d="M 550,154 L 482,154" marker-end="url(#arr-red)"/>

    <!-- Bottom Left GPU 8 -->
    <path d="M 85,235 L 85,210 L 275,210 L 275,192" marker-end="url(#arr-red)"/>
    <!-- Bottom Expansion -->
    <path d="M 340,235 L 340,192" marker-end="url(#arr-red)"/>
    <!-- Bottom Right GPU 256 -->
    <path d="M 595,235 L 595,210 L 405,210 L 405,192" marker-end="url(#arr-red)"/>
  </g>

  <!-- ===== CENTER TARGET SWITCH EGRESS & BUFFER ===== -->
  <g transform="translate(205, 120)">
    <!-- Switch Egress Card -->
    <rect x="0" y="0" width="270" height="70" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="18" rx="4" fill="#fde68a"/>
    <text x="135" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#78350f">Destination Switch Egress Port &amp; Shared Memory Buffer</text>

    <!-- Capacity info -->
    <text x="12" y="32" font-size="8.5" font-weight="700" fill="#0f172a">Max Port Drain Rate: 400 Gb/s (50 GB/s)</text>
    <text x="12" y="44" font-size="8" fill="#92400e">On-Chip Shared Memory Buffer: 32 MB</text>

    <!-- Buffer State Alert Strip -->
    <g transform="translate(12, 49)">
      <rect x="0" y="0" width="246" height="15" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="123" y="11" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">BUFFER OVERFLOW · PACKET LOSS · PFC PAUSE BLAST</text>
    </g>
  </g>

  <!-- ===== BOTTOM ANALYTICAL BREAKDOWN CARD ===== -->
  <g transform="translate(40, 305)">
    <!-- Main Box -->
    <rect x="0" y="0" width="600" height="105" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="600" height="22" rx="4" fill="#f1f5f9"/>
    <text x="300" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Incast Mathematics &amp; Fleet Architectural Mitigation</text>

    <!-- Left side: The Math -->
    <g transform="translate(20, 32)">
      <text x="0" y="14" font-size="8.5" font-weight="700" fill="#b91c1c">Aggregate Ingress Incast Traffic:</text>
      <text x="165" y="14" font-size="8.5" font-family="Courier New, monospace" fill="#0f172a">256 × 50 GB/s = 12,800 GB/s (12.8 TB/s)</text>

      <text x="0" y="30" font-size="8.5" font-weight="700" fill="#475569">Single Egress Port Drain Rate:</text>
      <text x="165" y="30" font-size="8.5" font-family="Courier New, monospace" fill="#0f172a">400 Gb/s = 50 GB/s wire capacity</text>

      <text x="0" y="46" font-size="8.5" font-weight="700" fill="#dc2626">Buffer Depletion Time:</text>
      <text x="165" y="46" font-size="8.5" fill="#475569">32 MB / (12,750 GB/s) ≈ <tspan font-weight="700" fill="#b91c1c">2.5 microseconds</tspan> until drops occur</text>

      <text x="0" y="62" font-size="8.5" font-weight="700" fill="#15803d">Fleet Solution:</text>
      <text x="165" y="62" font-size="8.5" fill="#475569">Ring/Tree AllReduce (no single destination) + DCQCN / ECN proactive throttling</text>
    </g>

    <!-- Right Side: Badge -->
    <g transform="translate(485, 32)">
      <rect x="0" y="0" width="95" height="58" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="47" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">256 : 1</text>
      <text x="47" y="38" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">Fan-In Ratio</text>
      <text x="47" y="49" text-anchor="middle" font-size="7" fill="#7f1d1d">Tail Latency Spike</text>
    </g>
  </g>
</svg>
