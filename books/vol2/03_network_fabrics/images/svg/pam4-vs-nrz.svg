<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== LEFT PANEL: NRZ SIGNALING ===== -->
  <g transform="translate(30, 20)">
    <!-- Container -->
    <rect x="0" y="0" width="315" height="304" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="315" height="24" rx="4" fill="#f1f5f9"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">NRZ (Non-Return-to-Zero)</text>
    <text x="303" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#1F407A">2 Levels · 1 Bit/Symbol</text>

    <!-- Axes -->
    <line x1="45" y1="210" x2="295" y2="210" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
    <line x1="55" y1="220" x2="55" y2="45" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
    <text x="295" y="222" font-size="7.5" fill="#64748b">Time</text>
    <text x="50" y="42" font-size="7.5" fill="#64748b" text-anchor="middle">V</text>

    <!-- Voltage ticks -->
    <text x="48" y="90" text-anchor="end" font-size="8" font-weight="600" fill="#1F407A">+V (1)</text>
    <line x1="52" y1="87" x2="58" y2="87" stroke="#94a3b8" stroke-width="1"/>

    <text x="48" y="183" text-anchor="end" font-size="8" font-weight="600" fill="#1F407A">−V (0)</text>
    <line x1="52" y1="180" x2="58" y2="180" stroke="#94a3b8" stroke-width="1"/>

    <!-- NRZ Square Waveform -->
    <polyline points="70,87 105,87 105,180 140,180 140,87 175,87 175,180 210,180 210,87 245,87 245,180 280,180" fill="none" stroke="#1F407A" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Bit values -->
    <text x="87" y="78" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">1</text>
    <text x="122" y="195" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">0</text>
    <text x="157" y="78" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">1</text>
    <text x="192" y="195" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">0</text>
    <text x="227" y="78" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">1</text>
    <text x="262" y="195" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">0</text>

    <!-- Noise Margin Pill / Badge -->

    <!-- NRZ Characteristics Footer Box -->
    <g transform="translate(15, 228)">
      <rect x="0" y="0" width="285" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8"><tspan font-weight="700" fill="#0f172a">Bit density:</tspan><tspan fill="#475569" dx="6">1 bit per symbol (binary)</tspan></text>
      <text x="12" y="30" font-size="8"><tspan font-weight="700" fill="#0f172a">Error rate:</tspan><tspan fill="#475569" dx="6">BER &lt; 10⁻¹² without correction</tspan></text>
      <text x="12" y="44" font-size="8"><tspan font-weight="700" fill="#0f172a">Latency floor:</tspan><tspan fill="#16a34a" font-weight="600" dx="6">~5–10 ns PHY processing</tspan></text>
      <text x="12" y="58" font-size="8"><tspan font-weight="700" fill="#0f172a">Eye height:</tspan><tspan fill="#475569" dx="6">full swing, wide noise margin, no FEC</tspan></text>
    </g>
  </g>

  <!-- ===== RIGHT PANEL: PAM4 SIGNALING ===== -->
  <g transform="translate(375, 20)">
    <!-- Container -->
    <rect x="0" y="0" width="315" height="304" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="315" height="24" rx="4" fill="#f1f5f9"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">PAM4 (4-Level Amplitude Modulation)</text>
    <text x="303" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#d97706">4 Levels · 2 Bits/Symbol</text>

    <!-- Axes -->
    <line x1="45" y1="210" x2="295" y2="210" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
    <line x1="55" y1="220" x2="55" y2="45" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
    <text x="295" y="222" font-size="7.5" fill="#64748b">Time</text>
    <text x="50" y="42" font-size="7.5" fill="#64748b" text-anchor="middle">V</text>

    <!-- Voltage ticks (4 levels) -->
    <text x="48" y="70" text-anchor="end" font-size="7.5" font-weight="600" fill="#d97706">+3V (11)</text>
    <line x1="52" y1="67" x2="58" y2="67" stroke="#94a3b8" stroke-width="1"/>

    <text x="48" y="105" text-anchor="end" font-size="7.5" font-weight="600" fill="#d97706">+1V (10)</text>
    <line x1="52" y1="102" x2="58" y2="102" stroke="#94a3b8" stroke-width="1"/>

    <text x="48" y="140" text-anchor="end" font-size="7.5" font-weight="600" fill="#d97706">−1V (01)</text>
    <line x1="52" y1="137" x2="58" y2="137" stroke="#94a3b8" stroke-width="1"/>

    <text x="48" y="175" text-anchor="end" font-size="7.5" font-weight="600" fill="#d97706">−3V (00)</text>
    <line x1="52" y1="172" x2="58" y2="172" stroke="#94a3b8" stroke-width="1"/>

    <!-- PAM4 Multi-Level Waveform -->
    <polyline points="70,67 105,67 105,137 140,137 140,102 175,102 175,172 210,172 210,67 245,67 245,137 280,137" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Bit pair values -->
    <text x="87" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">11</text>
    <text x="122" y="152" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">01</text>
    <text x="157" y="93" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">10</text>
    <text x="192" y="187" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">00</text>
    <text x="227" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">11</text>
    <text x="262" y="152" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">01</text>


    <!-- PAM4 Characteristics Footer Box -->
    <g transform="translate(15, 228)">
      <rect x="0" y="0" width="285" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8"><tspan font-weight="700" fill="#0f172a">Bit density:</tspan><tspan fill="#475569" dx="6">2 bits per symbol (2× data rate)</tspan></text>
      <text x="12" y="30" font-size="8"><tspan font-weight="700" fill="#0f172a">Error rate:</tspan><tspan fill="#475569" dx="6">Raw BER ~ 10⁻⁴ (needs FEC decoding)</tspan></text>
      <text x="12" y="44" font-size="8"><tspan font-weight="700" fill="#0f172a">Latency floor:</tspan><tspan fill="#dc2626" font-weight="700" dx="6">+100–200 ns / hop latency penalty</tspan></text>
      <text x="12" y="58" font-size="8"><tspan font-weight="700" fill="#0f172a">Eye height:</tspan><tspan fill="#b91c1c" font-weight="600" dx="6">⅓ of the swing (about −9.5 dB), FEC required</tspan></text>
    </g>
  </g>

  <!-- ===== BOTTOM SUMMARY COMPARISON CARD ===== -->
</svg>
