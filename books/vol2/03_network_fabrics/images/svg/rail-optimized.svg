<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== TOP SPINE SWITCH LAYER ===== -->
  <g transform="translate(60, 20)">
    <rect x="0" y="0" width="580" height="24" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="290" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Spine Fabric Layer (Inter-Rail Cluster Routing)</text>
  </g>

  <!-- Dashed uplinks from Leaf to Spine -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3">
    <line x1="125" y1="44" x2="125" y2="65"/>
    <line x1="275" y1="44" x2="275" y2="65"/>
    <line x1="425" y1="44" x2="425" y2="65"/>
    <line x1="575" y1="44" x2="575" y2="65"/>
  </g>

  <!-- ===== RAIL SWITCHES (Leaf Layer) ===== -->
  <g id="rail-switches">
    <!-- Switch-0 (Rail 0) -->
    <g transform="translate(60, 65)">
      <rect x="0" y="0" width="130" height="38" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="0" width="130" height="12" rx="3" fill="#D4E2F0"/>
      <text x="65" y="9" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">RAIL 0 FABRIC</text>
      <text x="65" y="27" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Switch-0</text>
    </g>

    <!-- Switch-1 (Rail 1) -->
    <g transform="translate(210, 65)">
      <rect x="0" y="0" width="130" height="38" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <rect x="0" y="0" width="130" height="12" rx="3" fill="#fde68a"/>
      <text x="65" y="9" text-anchor="middle" font-size="7.5" font-weight="700" fill="#92400e">RAIL 1 FABRIC</text>
      <text x="65" y="27" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Switch-1</text>
    </g>

    <!-- Switch-2 (Rail 2) -->
    <g transform="translate(360, 65)">
      <rect x="0" y="0" width="130" height="38" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <rect x="0" y="0" width="130" height="12" rx="3" fill="#e9d5ff"/>
      <text x="65" y="9" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6b21a8">RAIL 2 FABRIC</text>
      <text x="65" y="27" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Switch-2</text>
    </g>

    <!-- Switch-3 (Rail 3) -->
    <g transform="translate(510, 65)">
      <rect x="0" y="0" width="130" height="38" rx="3" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
      <rect x="0" y="0" width="130" height="12" rx="3" fill="#99f6e4"/>
      <text x="65" y="9" text-anchor="middle" font-size="7.5" font-weight="700" fill="#115e59">RAIL 3 FABRIC</text>
      <text x="65" y="27" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Switch-3</text>
    </g>
  </g>

  <!-- ===== INTER-CONNECTING RAIL ROUTES (Orthogonal Lines) ===== -->
  <!-- Rail 0 (Blue): Node 0 G0 & Node 1 G0 -> Switch-0 -->
  <path d="M 100,205 L 100,140 L 110,140 L 110,103" fill="none" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M 440,205 L 440,135 L 140,135 L 140,103" fill="none" stroke="#1F407A" stroke-width="1.5"/>

  <!-- Rail 1 (Amber): Node 0 G1 & Node 1 G1 -> Switch-1 -->
  <path d="M 165,205 L 165,150 L 260,150 L 260,103" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M 505,205 L 505,145 L 290,145 L 290,103" fill="none" stroke="#d97706" stroke-width="1.5"/>

  <!-- Rail 2 (Purple): Node 0 G2 & Node 1 G2 -> Switch-2 -->
  <path d="M 230,205 L 230,145 L 410,145 L 410,103" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M 570,205 L 570,150 L 440,150 L 440,103" fill="none" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Rail 3 (Teal): Node 0 G3 & Node 1 G3 -> Switch-3 -->
  <path d="M 295,205 L 295,135 L 560,135 L 560,103" fill="none" stroke="#0d9488" stroke-width="1.5"/>
  <path d="M 635,205 L 635,140 L 590,140 L 590,103" fill="none" stroke="#0d9488" stroke-width="1.5"/>

  <!-- ===== COMPUTE NODES ===== -->
  <!-- NODE 0 -->
  <g transform="translate(60, 195)">
    <!-- Chassis Card -->
    <rect x="0" y="0" width="280" height="150" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <!-- Header banner -->
    <rect x="0" y="0" width="280" height="22" rx="4" fill="#f1f5f9"/>
    <text x="12" y="15" font-size="9" font-weight="700" fill="#0f172a">Node 0 (DGX H100 Server)</text>
    <text x="268" y="15" text-anchor="end" font-size="8" font-weight="600" fill="#64748b">8-way NVSwitch</text>

    <!-- GPUs inside Node 0 -->
    <!-- G0 -->
    <g transform="translate(18, 32)">
      <rect x="0" y="0" width="44" height="42" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="22" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">G0</text>
      <text x="22" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rail 0</text>
    </g>
    <!-- G1 -->
    <g transform="translate(83, 32)">
      <rect x="0" y="0" width="44" height="42" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="22" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">G1</text>
      <text x="22" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rail 1</text>
    </g>
    <!-- G2 -->
    <g transform="translate(148, 32)">
      <rect x="0" y="0" width="44" height="42" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="22" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b21a8">G2</text>
      <text x="22" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rail 2</text>
    </g>
    <!-- G3 -->
    <g transform="translate(213, 32)">
      <rect x="0" y="0" width="44" height="42" rx="2" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
      <text x="22" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#115e59">G3</text>
      <text x="22" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rail 3</text>
    </g>

    <!-- NVLink Internal Mesh Connectors -->
    <g stroke="#d97706" stroke-width="1.5">
      <line x1="40" y1="74" x2="40" y2="105"/>
      <line x1="105" y1="74" x2="105" y2="105"/>
      <line x1="170" y1="74" x2="170" y2="105"/>
      <line x1="235" y1="74" x2="235" y2="105"/>
    </g>

    <!-- Intra-Node NVLink Fabric Bus -->
    <g transform="translate(18, 105)">
      <rect x="0" y="0" width="239" height="28" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="120" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">Intra-Node NVLink 4.0 Fabric (900 GB/s)</text>
      <text x="120" y="24" text-anchor="middle" font-size="7.5" fill="#78350f">Dedicated High-Bandwidth Mesh for Tensor Parallelism</text>
    </g>
  </g>

  <!-- NODE 1 -->
  <g transform="translate(400, 195)">
    <!-- Chassis Card -->
    <rect x="0" y="0" width="280" height="150" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <!-- Header banner -->
    <rect x="0" y="0" width="280" height="22" rx="4" fill="#f1f5f9"/>
    <text x="12" y="15" font-size="9" font-weight="700" fill="#0f172a">Node 1 (DGX H100 Server)</text>
    <text x="268" y="15" text-anchor="end" font-size="8" font-weight="600" fill="#64748b">8-way NVSwitch</text>

    <!-- GPUs inside Node 1 -->
    <!-- G0 -->
    <g transform="translate(18, 32)">
      <rect x="0" y="0" width="44" height="42" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="22" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">G0</text>
      <text x="22" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rail 0</text>
    </g>
    <!-- G1 -->
    <g transform="translate(83, 32)">
      <rect x="0" y="0" width="44" height="42" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="22" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">G1</text>
      <text x="22" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rail 1</text>
    </g>
    <!-- G2 -->
    <g transform="translate(148, 32)">
      <rect x="0" y="0" width="44" height="42" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="22" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b21a8">G2</text>
      <text x="22" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rail 2</text>
    </g>
    <!-- G3 -->
    <g transform="translate(213, 32)">
      <rect x="0" y="0" width="44" height="42" rx="2" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
      <text x="22" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#115e59">G3</text>
      <text x="22" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Rail 3</text>
    </g>

    <!-- NVLink Internal Mesh Connectors -->
    <g stroke="#d97706" stroke-width="1.5">
      <line x1="40" y1="74" x2="40" y2="105"/>
      <line x1="105" y1="74" x2="105" y2="105"/>
      <line x1="170" y1="74" x2="170" y2="105"/>
      <line x1="235" y1="74" x2="235" y2="105"/>
    </g>

    <!-- Intra-Node NVLink Fabric Bus -->
    <g transform="translate(18, 105)">
      <rect x="0" y="0" width="239" height="28" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="120" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">Intra-Node NVLink 4.0 Fabric (900 GB/s)</text>
      <text x="120" y="24" text-anchor="middle" font-size="7.5" fill="#78350f">Dedicated High-Bandwidth Mesh for Tensor Parallelism</text>
    </g>
  </g>

  <!-- ===== ANNOTATION CARD (Principles & Invariants) ===== -->
  <g transform="translate(60, 365)">
    <rect x="0" y="0" width="580" height="85" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="580" height="20" rx="4" fill="#f1f5f9"/>
    <text x="290" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Rail-Optimized Architecture Principles</text>

    <text x="20" y="38" font-size="8.5" font-weight="700" fill="#0f172a">1. Homogeneous Rank Mapping:</text>
    <text x="165" y="38" font-size="8.5" fill="#475569">All GPUs of rank i across all nodes connect to the same dedicated leaf switch.</text>

    <text x="20" y="55" font-size="8.5" font-weight="700" fill="#0f172a">2. Contention-Free AllReduce:</text>
    <text x="165" y="55" font-size="8.5" fill="#475569">Data-parallel collective traffic stays on a single leaf switch (1 hop, zero spine traversal).</text>

    <text x="20" y="72" font-size="8.5" font-weight="700" fill="#0f172a">3. Hybrid Hierarchy:</text>
    <text x="165" y="72" font-size="8.5" fill="#475569">Tensor-parallel traffic routes over intra-node NVLink (900 GB/s), bypassing the leaf fabric.</text>
  </g>

  <!-- ===== BOTTOM LEGEND ===== -->
  <g transform="translate(60, 465)">
    <!-- Rail 0 -->
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
    <text x="18" y="12" font-size="8" font-weight="600" fill="#334155">Rail 0</text>

    <!-- Rail 1 -->
    <rect x="80" y="2" width="12" height="12" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="98" y="12" font-size="8" font-weight="600" fill="#334155">Rail 1</text>

    <!-- Rail 2 -->
    <rect x="160" y="2" width="12" height="12" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="178" y="12" font-size="8" font-weight="600" fill="#334155">Rail 2</text>

    <!-- Rail 3 -->
    <rect x="240" y="2" width="12" height="12" rx="2" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
    <text x="258" y="12" font-size="8" font-weight="600" fill="#334155">Rail 3</text>

    <!-- Intra-node NVLink -->
    <line x1="330" y1="8" x2="355" y2="8" stroke="#d97706" stroke-width="2"/>
    <text x="362" y="12" font-size="8" font-weight="600" fill="#334155">Intra-Node NVLink</text>

    <!-- Spine Interconnect -->
    <line x1="470" y1="8" x2="495" y2="8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="502" y="12" font-size="8" font-weight="600" fill="#334155">Spine Fabric</text>
  </g>
</svg>
