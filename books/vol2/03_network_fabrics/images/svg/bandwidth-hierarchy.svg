<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      text { fill: #0f172a; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; }
      .grid { stroke: #f1f5f9; stroke-width: 1; stroke-dasharray: 4 4; }
      .tick { font-size: 13px; fill: #64748b; }
      .label { font-size: 13px; font-weight: 700; fill: #334155; }
      .legend { font-size: 10px; font-weight: 600; fill: #334155; }
      .ratio { fill: #b91c1c; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <g id="plot" transform="translate(100, 30)">
    <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
    <line class="grid" x1="0" x2="760" y1="344" y2="344"/>
    <line class="grid" x1="0" x2="760" y1="239" y2="239"/>
    <line class="grid" x1="0" x2="760" y1="135" y2="135"/>
    <line class="grid" x1="0" x2="760" y1="31" y2="31"/>

    <line class="axis" x1="0" y1="0" x2="0" y2="380"/>
    <line class="axis" x1="0" y1="380" x2="760" y2="380"/>

    <text class="tick" x="-15" y="348" text-anchor="end">10</text>
    <text class="tick" x="-15" y="243" text-anchor="end">100</text>
    <text class="tick" x="-15" y="139" text-anchor="end">1,000</text>
    <text class="tick" x="-15" y="35" text-anchor="end">10,000</text>

    <!-- ===== V100 (2017) ===== -->
    <g transform="translate(100, 0)">
      <!-- HBM: 900 GB/s -->
      <rect x="-42" y="140" width="26" height="240" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <!-- NVLink: 300 GB/s -->
      <rect x="-14" y="181" width="26" height="199" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <!-- InfiniBand: 12.5 GB/s -->
      <rect x="14" y="304" width="26" height="76" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <!-- PCIe: 16 GB/s -->
      <rect x="42" y="323" width="26" height="57" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>

      <!-- Gap Ratio Badge -->
      <rect x="-30" y="152" width="46" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text class="ratio" x="-7" y="165" text-anchor="middle">12×</text>

      <text class="tick" x="7" y="405" text-anchor="middle" font-weight="700" fill="#0f172a">V100</text>
      <text class="tick" x="7" y="422" text-anchor="middle">(2017)</text>
    </g>

    <!-- ===== A100 (2020) ===== -->
    <g transform="translate(290, 0)">
      <!-- HBM: 2,039 GB/s -->
      <rect x="-42" y="105" width="26" height="275" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <!-- NVLink: 600 GB/s -->
      <rect x="-14" y="148" width="26" height="232" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <!-- InfiniBand: 25 GB/s -->
      <rect x="14" y="304" width="26" height="76" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <!-- PCIe: 32 GB/s -->
      <rect x="42" y="294" width="26" height="86" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>

      <!-- Gap Ratio Badge -->
      <rect x="-30" y="122" width="46" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text class="ratio" x="-7" y="135" text-anchor="middle">24×</text>

      <text class="tick" x="7" y="405" text-anchor="middle" font-weight="700" fill="#0f172a">A100</text>
      <text class="tick" x="7" y="422" text-anchor="middle">(2020)</text>
    </g>

    <!-- ===== H100 (2022) ===== -->
    <g transform="translate(480, 0)">
      <!-- HBM: 3,350 GB/s -->
      <rect x="-42" y="82" width="26" height="298" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <!-- NVLink: 900 GB/s -->
      <rect x="-14" y="140" width="26" height="240" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <!-- InfiniBand: 50 GB/s -->
      <rect x="14" y="274" width="26" height="106" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <!-- PCIe: 64 GB/s -->
      <rect x="42" y="263" width="26" height="117" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>

      <!-- Gap Ratio Badge -->
      <rect x="-30" y="105" width="46" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text class="ratio" x="-7" y="118" text-anchor="middle">18×</text>

      <text class="tick" x="7" y="405" text-anchor="middle" font-weight="700" fill="#0f172a">H100</text>
      <text class="tick" x="7" y="422" text-anchor="middle">(2022)</text>
    </g>

    <!-- ===== B200 (2024) ===== -->
    <g transform="translate(670, 0)">
      <!-- HBM: 8,000 GB/s -->
      <rect x="-42" y="41" width="26" height="339" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <!-- NVLink: 1,800 GB/s -->
      <rect x="-14" y="108" width="26" height="272" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <!-- InfiniBand: 100 GB/s -->
      <rect x="14" y="239" width="26" height="141" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <!-- PCIe: 64 GB/s -->
      <rect x="42" y="263" width="26" height="117" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>

      <!-- Gap Ratio Badge -->
      <rect x="-30" y="75" width="46" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text class="ratio" x="-7" y="88" text-anchor="middle">18×</text>

      <text class="tick" x="7" y="405" text-anchor="middle" font-weight="700" fill="#0f172a">B200</text>
      <text class="tick" x="7" y="422" text-anchor="middle">(2024)</text>
    </g>

    <text class="label" x="380" y="455" text-anchor="middle">Accelerator Generation</text>
    <text class="label" x="-60" y="190" text-anchor="middle" transform="rotate(-90 -60 190)">Bandwidth (GB/s, log scale)</text>

    <!-- ===== COMPACT LEGEND (Top Left of Plot, x=10..220) ===== -->
    <g transform="translate(10, 15)">
      <rect x="0" y="0" width="220" height="85" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- HBM -->
      <rect x="10" y="10" width="16" height="10" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text class="legend" x="32" y="18">HBM (On-Package)</text>
      <!-- NVLink -->
      <rect x="10" y="28" width="16" height="10" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text class="legend" x="32" y="36">NVLink (Intra-Node)</text>
      <!-- InfiniBand -->
      <rect x="10" y="46" width="16" height="10" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
      <text class="legend" x="32" y="54">InfiniBand / RoCE</text>
      <!-- PCIe -->
      <rect x="10" y="64" width="16" height="10" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text class="legend" x="32" y="72">PCIe Host Bus</text>
    </g>
  </g>

  <!-- ===== BOTTOM SUMMARY CARD ===== -->
  <g transform="translate(100, 495)">
    <rect x="0" y="0" width="760" height="50" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="760" height="16" rx="4" fill="#f1f5f9"/>
    <text x="380" y="12" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Fleet Hierarchy Invariant: Bandwidth Tiers Scale at Different Exponents</text>
    <text x="380" y="32" text-anchor="middle" font-size="8.5" fill="#475569">While on-package HBM scales 8.8× from V100 to B200, inter-node InfiniBand scales 8× and PCIe scales only 4×,</text>
    <text x="380" y="44" text-anchor="middle" font-size="8" font-weight="600" fill="#0369a1">mandating communication avoidance and tensor-parallel locality within the node boundary.</text>
  </g>
</svg>
