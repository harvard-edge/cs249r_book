<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== TIER LABELS (left side badges) ===== -->
  <g transform="translate(15, 27)">
    <rect x="0" y="0" width="65" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="32" y="15" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">Core</text>
    <text x="32" y="27" font-size="8" fill="#78350f" text-anchor="middle">Fabric</text>
  </g>

  <g transform="translate(15, 137)">
    <rect x="0" y="0" width="65" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="32" y="15" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">Leaf</text>
    <text x="32" y="27" font-size="8" fill="#78350f" text-anchor="middle">Switches</text>
  </g>

  <g transform="translate(15, 222)">
    <rect x="0" y="0" width="65" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="32" y="15" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">GPU</text>
    <text x="32" y="27" font-size="8" fill="#0c4a6e" text-anchor="middle">Racks</text>
  </g>

  <!-- ===== CORE SWITCHES (Top Fabric Tier) ===== -->
  <g id="core-switches">
    <!-- Core-1 -->
    <rect x="150" y="22" width="70" height="42" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <rect x="150" y="22" width="70" height="14" rx="3" fill="#fde68a"/>
    <text x="185" y="33" text-anchor="middle" font-size="8" font-weight="700" fill="#78350f">SPINE</text>
    <text x="185" y="52" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Core-1</text>

    <!-- Core-2 -->
    <rect x="255" y="22" width="70" height="42" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <rect x="255" y="22" width="70" height="14" rx="3" fill="#fde68a"/>
    <text x="290" y="33" text-anchor="middle" font-size="8" font-weight="700" fill="#78350f">SPINE</text>
    <text x="290" y="52" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Core-2</text>

    <!-- Core-3 -->
    <rect x="360" y="22" width="70" height="42" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <rect x="360" y="22" width="70" height="14" rx="3" fill="#fde68a"/>
    <text x="395" y="33" text-anchor="middle" font-size="8" font-weight="700" fill="#78350f">SPINE</text>
    <text x="395" y="52" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Core-3</text>

    <!-- Core-4 -->
    <rect x="465" y="22" width="70" height="42" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <rect x="465" y="22" width="70" height="14" rx="3" fill="#fde68a"/>
    <text x="500" y="33" text-anchor="middle" font-size="8" font-weight="700" fill="#78350f">SPINE</text>
    <text x="500" y="52" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Core-4</text>
  </g>

  <!-- Right annotation badge: Full bisection -->
  <g transform="translate(565, 24)">
    <rect x="0" y="0" width="100" height="38" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="50" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Full Bisection</text>
    <text x="50" y="30" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">Non-Blocking ✓</text>
  </g>

  <!-- ===== BISECTION CUT LINE ===== -->
  <line x1="90" y1="98" x2="570" y2="98" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="580" y="87" width="85" height="22" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="622" y="102" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Bisection Cut</text>

  <!-- ===== CORE → LEAF INTERCONNECT MESH ===== -->
  <g stroke="#d97706" stroke-width="1" opacity="0.6">
    <!-- Core-1 to Leaves -->
    <line x1="165" y1="64" x2="135" y2="132"/>
    <line x1="175" y1="64" x2="230" y2="132"/>
    <line x1="185" y1="64" x2="325" y2="132"/>
    <line x1="195" y1="64" x2="420" y2="132"/>
    <line x1="205" y1="64" x2="515" y2="132"/>

    <!-- Core-2 to Leaves -->
    <line x1="270" y1="64" x2="145" y2="132"/>
    <line x1="280" y1="64" x2="240" y2="132"/>
    <line x1="290" y1="64" x2="335" y2="132"/>
    <line x1="300" y1="64" x2="430" y2="132"/>
    <line x1="310" y1="64" x2="525" y2="132"/>

    <!-- Core-3 to Leaves -->
    <line x1="375" y1="64" x2="155" y2="132"/>
    <line x1="385" y1="64" x2="250" y2="132"/>
    <line x1="395" y1="64" x2="345" y2="132"/>
    <line x1="405" y1="64" x2="440" y2="132"/>
    <line x1="415" y1="64" x2="535" y2="132"/>

    <!-- Core-4 to Leaves -->
    <line x1="480" y1="64" x2="165" y2="132"/>
    <line x1="490" y1="64" x2="260" y2="132"/>
    <line x1="500" y1="64" x2="355" y2="132"/>
    <line x1="510" y1="64" x2="450" y2="132"/>
    <line x1="520" y1="64" x2="545" y2="132"/>
  </g>

  <!-- ===== LEAF SWITCHES ===== -->
  <g id="leaf-switches">
    <!-- Leaf-1 -->
    <rect x="115" y="132" width="70" height="38" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="150" y="155" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Leaf-1</text>

    <!-- Leaf-2 -->
    <rect x="210" y="132" width="70" height="38" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="245" y="155" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Leaf-2</text>

    <!-- Leaf-3 -->
    <rect x="305" y="132" width="70" height="38" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="340" y="155" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Leaf-3</text>

    <!-- Leaf-4 -->
    <rect x="400" y="132" width="70" height="38" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="435" y="155" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Leaf-4</text>

    <!-- Leaf-5 -->
    <rect x="495" y="132" width="70" height="38" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="530" y="155" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Leaf-5</text>
  </g>

  <!-- ===== LEAF → RACK DOWNLINKS (Direct Vertical) ===== -->
  <g stroke="#0284c7" stroke-width="1.5">
    <line x1="150" y1="170" x2="150" y2="208"/>
    <line x1="245" y1="170" x2="245" y2="208"/>
    <line x1="340" y1="170" x2="340" y2="208"/>
    <line x1="435" y1="170" x2="435" y2="208"/>
    <line x1="530" y1="170" x2="530" y2="208"/>
  </g>

  <!-- ===== GPU RACKS (Compute Layer) ===== -->
  <g id="gpu-racks">
    <!-- Rack 1 -->
    <rect x="110" y="208" width="80" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="115" y="213" width="70" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="150" y="225" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Rack 1</text>
    <text x="150" y="233" text-anchor="middle" font-size="7.5" fill="#0369a1">8 GPUs</text>
    <text x="150" y="251" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">400 Gb/s</text>
    <text x="150" y="261" text-anchor="middle" font-size="7.5" fill="#64748b">Host Uplink</text>

    <!-- Rack 2 -->
    <rect x="205" y="208" width="80" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="210" y="213" width="70" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="245" y="225" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Rack 2</text>
    <text x="245" y="233" text-anchor="middle" font-size="7.5" fill="#0369a1">8 GPUs</text>
    <text x="245" y="251" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">400 Gb/s</text>
    <text x="245" y="261" text-anchor="middle" font-size="7.5" fill="#64748b">Host Uplink</text>

    <!-- Rack 3 -->
    <rect x="300" y="208" width="80" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="305" y="213" width="70" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="340" y="225" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Rack 3</text>
    <text x="340" y="233" text-anchor="middle" font-size="7.5" fill="#0369a1">8 GPUs</text>
    <text x="340" y="251" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">400 Gb/s</text>
    <text x="340" y="261" text-anchor="middle" font-size="7.5" fill="#64748b">Host Uplink</text>

    <!-- Rack 4 -->
    <rect x="395" y="208" width="80" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="400" y="213" width="70" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="435" y="225" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Rack 4</text>
    <text x="435" y="233" text-anchor="middle" font-size="7.5" fill="#0369a1">8 GPUs</text>
    <text x="435" y="251" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">400 Gb/s</text>
    <text x="435" y="261" text-anchor="middle" font-size="7.5" fill="#64748b">Host Uplink</text>

    <!-- Rack 5 -->
    <rect x="490" y="208" width="80" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="495" y="213" width="70" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="530" y="225" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Rack 5</text>
    <text x="530" y="233" text-anchor="middle" font-size="7.5" fill="#0369a1">8 GPUs</text>
    <text x="530" y="251" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">400 Gb/s</text>
    <text x="530" y="261" text-anchor="middle" font-size="7.5" fill="#64748b">Host Uplink</text>
  </g>

  <!-- ===== MIDDLE ARCHITECTURAL METRICS CARDS (Below Racks) ===== -->
  <g transform="translate(100, 285)">
    <rect x="0" y="0" width="225" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="225" height="16" rx="4" fill="#f1f5f9"/>
    <text x="112" y="12" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Subscription Ratio</text>
    <text x="112" y="31" text-anchor="middle" font-size="9" font-weight="600" fill="#0f172a">1:1 Non-Blocking Fabric</text>
    <text x="112" y="41" text-anchor="middle" font-size="7.5" fill="#64748b">Uplink Bandwidth = Downlink Bandwidth</text>
  </g>

  <g transform="translate(355, 285)">
    <rect x="0" y="0" width="225" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="225" height="16" rx="4" fill="#f1f5f9"/>
    <text x="112" y="12" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Aggregate Bisection Rate</text>
    <text x="112" y="31" text-anchor="middle" font-size="9" font-weight="600" fill="#0369a1">5 × 50 GB/s = 250 GB/s</text>
    <text x="112" y="41" text-anchor="middle" font-size="7.5" fill="#64748b">Zero cross-spine saturation or oversubscription</text>
  </g>

  <!-- ===== CLUSTER SCALE FOOTER SUMMARY ===== -->
  <g transform="translate(50, 345)">
    <rect x="0" y="0" width="580" height="65" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="580" height="18" rx="4" fill="#f1f5f9"/>
    <text x="290" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Clos Scaling Invariants (Three-Tier Topology)</text>
    <text x="290" y="34" text-anchor="middle" font-size="9" font-weight="600" fill="#0f172a">k = 64 Radix Switch → k³/4 = 65,536 Hosts Supported</text>
    <text x="290" y="48" text-anchor="middle" font-size="8" fill="#475569">At 4,096-GPU Scale: ~2,048 Fabric Switches · ~40,000 Optical Cables</text>
    <text x="290" y="59" text-anchor="middle" font-size="8" fill="#64748b">Bisection bandwidth sets the absolute ceiling for all-to-all distributed ML collective primitives</text>
  </g>
</svg>
