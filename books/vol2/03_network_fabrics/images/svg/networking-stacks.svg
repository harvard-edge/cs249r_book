<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- ===== LEFT COLUMN: TRADITIONAL TCP/IP ===== -->
  <g transform="translate(30, 20)">
    <!-- Container -->
    <rect x="0" y="0" width="325" height="380" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header banner -->
    <rect x="0" y="0" width="325" height="26" rx="4" fill="#f1f5f9"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#0f172a">Traditional TCP/IP Stack</text>
    <text x="313" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#b91c1c">Kernel Traversal Tax</text>

    <!-- User Space Label -->
    <text x="15" y="44" font-size="8" font-weight="700" fill="#64748b">USER SPACE</text>

    <!-- Layer 1: Collective Library -->
    <g transform="translate(45, 52)">
      <rect x="0" y="0" width="240" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="120" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Distributed Training Framework</text>
      <text x="120" y="24" text-anchor="middle" font-size="7.5" fill="#64748b">PyTorch DDP / Horovod (MPI backend)</text>
    </g>

    <!-- Down arrow -->
    <line x1="165" y1="83" x2="165" y2="92" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Layer 2: Application Buffer -->
    <g transform="translate(45, 93)">
      <rect x="0" y="0" width="240" height="28" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="120" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">Application User Buffer (Host DRAM)</text>
      <text x="120" y="23" text-anchor="middle" font-size="7.5" fill="#0c4a6e">Gradient Tensors Staged in RAM</text>
    </g>

    <!-- Down arrow -->
    <line x1="165" y1="122" x2="165" y2="131" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <!-- Kernel Space Boundary Divider -->
    <g transform="translate(15, 132)">
      <line x1="0" y1="0" x2="295" y2="0" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,2"/>
      <rect x="75" y="-8" width="145" height="16" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="147" y="4" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">Kernel Boundary (Syscall Trap)</text>
    </g>

    <!-- Kernel Space Container -->
    <g transform="translate(45, 146)">
      <rect x="0" y="0" width="240" height="118" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>

      <!-- Socket Layer -->
      <rect x="10" y="8" width="220" height="28" rx="2" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
      <text x="120" y="21" text-anchor="middle" font-size="8.5" font-weight="600" fill="#9f1239">BSD Socket API (send / recv)</text>
      <text x="120" y="30" text-anchor="middle" font-size="7" fill="#be123c">CPU Copy #1: User DRAM → Kernel Skbuff</text>

      <!-- TCP/IP Protocol Stack -->
      <rect x="10" y="42" width="220" height="34" rx="2" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
      <text x="120" y="55" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9f1239">TCP / IP Network Stack</text>
      <text x="120" y="65" text-anchor="middle" font-size="7" fill="#be123c">Flow Control · Retransmission · Checksumming</text>
      <text x="120" y="73" text-anchor="middle" font-size="7" fill="#475569">Significant host CPU core saturation</text>

      <!-- Device Driver Ring Buffer -->
      <rect x="10" y="82" width="220" height="28" rx="2" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
      <text x="120" y="95" text-anchor="middle" font-size="8.5" font-weight="600" fill="#9f1239">Network Device Driver (DMA Rings)</text>
      <text x="120" y="104" text-anchor="middle" font-size="7" fill="#be123c">CPU Copy #2: Kernel Skbuff → NIC TX Ring</text>
    </g>

    <!-- Down arrow -->
    <line x1="165" y1="265" x2="165" y2="274" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Layer 3: Physical NIC -->
    <g transform="translate(45, 275)">
      <rect x="0" y="0" width="240" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="120" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Standard Ethernet NIC</text>
      <text x="120" y="28" text-anchor="middle" font-size="7.5" fill="#64748b">Packets framed onto physical cable</text>
    </g>

    <!-- TCP Metrics Badge -->
    <g transform="translate(15, 325)">
      <rect x="0" y="0" width="295" height="42" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="147" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">Latency: 10–25 µs · 2–3 Memory Copies</text>
      <text x="147" y="27" text-anchor="middle" font-size="7.5" fill="#991b1b">Host CPU spent handling network interrupts and buffer copying</text>
      <text x="147" y="37" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Severe tail latency under multi-node AllReduce contention</text>
    </g>
  </g>

  <!-- ===== RIGHT COLUMN: RDMA / ROCE V2 ===== -->
  <g transform="translate(385, 20)">
    <!-- Container -->
    <rect x="0" y="0" width="325" height="380" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header banner -->
    <rect x="0" y="0" width="325" height="26" rx="4" fill="#f1f5f9"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#0f172a">RDMA / RoCE v2 Stack</text>
    <text x="313" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#15803d">Zero-Copy Kernel Bypass</text>

    <!-- User Space Label -->
    <text x="15" y="44" font-size="8" font-weight="700" fill="#64748b">USER SPACE</text>

    <!-- Layer 1: Collective Library (NCCL) -->
    <g transform="translate(45, 52)">
      <rect x="0" y="0" width="240" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="120" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">NVIDIA NCCL / AMD RCCL</text>
      <text x="120" y="24" text-anchor="middle" font-size="7.5" fill="#64748b">Topology-Aware Collective Engine</text>
    </g>

    <!-- Down arrow -->
    <line x1="165" y1="83" x2="165" y2="92" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- Layer 2: Application / Verbs API -->
    <g transform="translate(45, 93)">
      <rect x="0" y="0" width="240" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="120" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Direct Verbs API (ibv_post_send)</text>
      <text x="120" y="23" text-anchor="middle" font-size="7.5" fill="#166534">Direct user-space work queue posting</text>
    </g>

    <!-- Kernel Bypass Region -->
    <g transform="translate(45, 132)">
      <rect x="0" y="0" width="240" height="85" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="25" y="8" width="190" height="18" rx="2" fill="#f1f5f9"/>
      <text x="120" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">OS KERNEL BYPASS REGION</text>
      <text x="120" y="42" text-anchor="middle" font-size="8" fill="#64748b">• No system calls or trap overhead</text>
      <text x="120" y="56" text-anchor="middle" font-size="8" fill="#64748b">• No intermediate OS bounce buffers</text>
      <text x="120" y="70" text-anchor="middle" font-size="8" fill="#64748b">• Zero CPU consumption during transfer</text>
    </g>

    <!-- Kernel Bypass Green Arrow (Orthogonal routing around the bypass box) -->
    <path d="M 286,107 L 305,107 L 305,240 L 286,240" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="312" y="175" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle" transform="rotate(90, 312, 175)">Zero-Copy Path</text>

    <!-- Down arrow -->
    <line x1="165" y1="218" x2="165" y2="228" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- Layer 3: Hardware RDMA Transport Engine -->
    <g transform="translate(45, 230)">
      <rect x="0" y="0" width="240" height="34" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="120" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">Hardware RoCE v2 / IB Transport Engine</text>
      <text x="120" y="26" text-anchor="middle" font-size="7.5" fill="#b45309">Go-Back-N / Selective ACK offloaded onto silicon ASIC</text>
    </g>

    <!-- Down arrow -->
    <line x1="165" y1="265" x2="165" y2="274" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- Layer 4: RDMA SmartNIC / ConnectX -->
    <g transform="translate(45, 275)">
      <rect x="0" y="0" width="240" height="34" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="120" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">RDMA SmartNIC (ConnectX-7 / CX-8)</text>
      <text x="120" y="27" text-anchor="middle" font-size="7.5" fill="#0369a1" font-weight="600">GPUDirect RDMA: Direct DMA to/from GPU HBM via PCIe</text>
    </g>

    <!-- RDMA Metrics Badge -->
    <g transform="translate(15, 325)">
      <rect x="0" y="0" width="295" height="42" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="147" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Latency: 1–3 µs · 0 Memory Copies</text>
      <text x="147" y="27" text-anchor="middle" font-size="7.5" fill="#166534">Zero CPU involvement: host cores execute training forward/backward</text>
      <text x="147" y="37" text-anchor="middle" font-size="7.5" fill="#14532d">Ultra-consistent tail latency across thousands of nodes</text>
    </g>
  </g>

  <!-- ===== BOTTOM COMPARISON CARD ===== -->
  <g transform="translate(30, 415)">
    <rect x="0" y="0" width="680" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="680" height="20" rx="4" fill="#f1f5f9"/>
    <text x="340" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Architectural Imperative: Why Distributed ML Cannot Use Traditional Sockets</text>

    <text x="20" y="38" font-size="8.5" font-weight="700" fill="#0f172a">Synchronization Frequency:</text>
    <text x="175" y="38" font-size="8.5" fill="#475569">Frequent sync (50–200 ms); 20 µs kernel tax stalls all GPUs on the step barrier.</text>

    <text x="20" y="56" font-size="8.5" font-weight="700" fill="#15803d">Bandwidth Protection:</text>
    <text x="175" y="56" font-size="8.5" fill="#475569">Direct PCIe crossbar transfer to NIC bypasses host DRAM, preserving DDR5 bandwidth.</text>
  </g>
</svg>
