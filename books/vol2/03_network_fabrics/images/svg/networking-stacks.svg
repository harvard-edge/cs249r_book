<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>
  <rect width="600" height="452" fill="#ffffff"/>
  <!-- ===== TCP/IP sockets ===== -->
  <rect x="10" y="10" width="270" height="432" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
  <path d="M 14,10 L 276,10 Q 280,10 280,14 L 280,36 L 10,36 L 10,14 Q 10,10 14,10 Z" fill="#f1f5f9"/>
  <line x1="10" y1="36" x2="280" y2="36" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="145" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">TCP/IP sockets</text>
  <rect x="11" y="150" width="268" height="182" fill="#f8fafc"/>
  <line x1="11" y1="150" x2="279" y2="150" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="11" y1="332" x2="279" y2="332" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="20" y="54" text-anchor="start" font-size="10.5" fill="#475569">User space</text>
  <text x="20" y="168" text-anchor="start" font-size="10.5" fill="#475569">Kernel</text>
  <text x="20" y="350" text-anchor="start" font-size="10.5" fill="#475569">Hardware</text>
  <rect x="50" y="62" width="190" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="145" y="77" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Training framework</text>
  <text x="145" y="91" text-anchor="middle" font-size="10.5" fill="#475569">gradients in host memory</text>
  <line x1="145" y1="98" x2="145" y2="177" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="155.0" y="129" width="52" height="18" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="0.9"/>
  <text x="181.0" y="142" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">copy 1</text>
  <rect x="50" y="178" width="190" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="145" y="193" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Socket API</text>
  <text x="145" y="207" text-anchor="middle" font-size="10.5" fill="#475569">send() system call</text>
  <line x1="145" y1="214" x2="145" y2="231" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="50" y="232" width="190" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="145" y="247" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">TCP/IP stack</text>
  <text x="145" y="261" text-anchor="middle" font-size="10.5" fill="#475569">reliability in software</text>
  <line x1="145" y1="268" x2="145" y2="285" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="50" y="286" width="190" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="145" y="301" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">NIC driver</text>
  <text x="145" y="315" text-anchor="middle" font-size="10.5" fill="#475569">kernel buffer to NIC ring</text>
  <line x1="145" y1="322" x2="145" y2="367" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="155.0" y="340" width="52" height="18" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="0.9"/>
  <text x="181.0" y="353" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">copy 2</text>
  <rect x="50" y="368" width="190" height="36" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="145" y="390" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Ethernet NIC</text>
  <text x="145" y="428" text-anchor="middle" font-size="10.5" fill="#475569">CPU copies data and runs the transport</text>
  <!-- ===== RDMA verbs (InfiniBand or RoCEv2) ===== -->
  <rect x="320" y="10" width="270" height="432" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
  <path d="M 324,10 L 586,10 Q 590,10 590,14 L 590,36 L 320,36 L 320,14 Q 320,10 324,10 Z" fill="#f1f5f9"/>
  <line x1="320" y1="36" x2="590" y2="36" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="455" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">RDMA verbs (InfiniBand or RoCEv2)</text>
  <rect x="321" y="150" width="268" height="182" fill="#f8fafc"/>
  <line x1="321" y1="150" x2="589" y2="150" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="321" y1="332" x2="589" y2="332" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="330" y="54" text-anchor="start" font-size="10.5" fill="#475569">User space</text>
  <text x="330" y="168" text-anchor="start" font-size="10.5" fill="#475569">Kernel</text>
  <text x="330" y="350" text-anchor="start" font-size="10.5" fill="#475569">Hardware</text>
  <rect x="360" y="62" width="190" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="455" y="77" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">NCCL</text>
  <text x="455" y="91" text-anchor="middle" font-size="10.5" fill="#475569">collective library</text>
  <line x1="455" y1="98" x2="455" y2="109" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="360" y="110" width="190" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="455" y="125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Verbs API</text>
  <text x="455" y="139" text-anchor="middle" font-size="10.5" fill="#475569">posts to a user-space queue</text>
  <line x1="455" y1="146" x2="455" y2="367" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <text x="465" y="239" text-anchor="start" font-size="11" font-style="italic" fill="#475569">Kernel not on</text>
  <text x="465" y="253" text-anchor="start" font-size="11" font-style="italic" fill="#475569">the data path</text>
  <rect x="360" y="368" width="190" height="36" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="455" y="383" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">RDMA NIC</text>
  <text x="455" y="397" text-anchor="middle" font-size="10.5" fill="#475569">transport in hardware</text>
  <text x="455" y="428" text-anchor="middle" font-size="10.5" fill="#475569">NIC reads GPU memory directly (GPUDirect)</text>
</svg>
