<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 745" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <pattern id="pad-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#fca5a5" stroke-width="1.5"/>
    </pattern>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .panel-title { font-size: 11px; font-weight: 700; fill: #0f172a; }
    .panel-sub { font-size: 8.5px; fill: #64748b; }
    .req-txt { font-size: 8px; font-weight: 700; fill: #14294E; }
    .wait-txt { font-size: 7.5px; font-weight: 600; fill: #b45309; }
    .pad-txt { font-size: 7.5px; font-weight: 700; fill: #be123c; }
    .util-lbl { font-size: 8px; font-weight: 700; }
    .axis-lbl { font-size: 8px; font-weight: 600; fill: #64748b; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- PANEL (a): NO BATCHING                                                 -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="700" height="215" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="16" y="12" width="110" height="18" rx="2" fill="#e2e8f0"/>
    <text x="71" y="24" text-anchor="middle" class="panel-title">(a) No Batching</text>
    <text x="136" y="25" class="panel-sub">Sequential execution: GPU is memory-bandwidth starved during decode; idle between requests</text>

    <!-- Execution Timeline -->
    <g transform="translate(70, 52)">
      <!-- Request Tracks -->
      <!-- R1 -->
      <text x="-15" y="14" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R1</text>
      <rect x="0" y="0" width="90" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="45" y="13" text-anchor="middle" class="req-txt">Compute R1</text>

      <!-- R2 -->
      <text x="-15" y="38" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R2</text>
      <rect x="120" y="24" width="130" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="185" y="37" text-anchor="middle" class="req-txt">Compute R2</text>

      <!-- R3 -->
      <text x="-15" y="62" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R3</text>
      <rect x="275" y="48" width="75" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="312.5" y="61" text-anchor="middle" class="req-txt">Compute R3</text>

      <!-- R4 -->
      <text x="-15" y="86" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R4</text>
      <rect x="375" y="72" width="105" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="427.5" y="85" text-anchor="middle" class="req-txt">Compute R4</text>

      <!-- GPU Utilization Bar -->
      <text x="-15" y="118" text-anchor="end" font-size="8.5" font-weight="700" fill="#475569">GPU Active</text>
      <rect x="0" y="106" width="500" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="0" y="106" width="90" height="18" rx="2" fill="#1F407A"/>
      <rect x="120" y="106" width="130" height="18" rx="2" fill="#1F407A"/>
      <rect x="275" y="106" width="75" height="18" rx="2" fill="#1F407A"/>
      <rect x="375" y="106" width="105" height="18" rx="2" fill="#1F407A"/>

      <!-- Util Badge -->
      <rect x="520" y="105" width="85" height="20" rx="2" fill="#fee2e2" stroke="#e11d48" stroke-width="0.8"/>
      <text x="562.5" y="118" text-anchor="middle" class="util-lbl" fill="#be123c">~38% GPU Util</text>

      <!-- Time Axis -->
      <line x1="0" y1="138" x2="500" y2="138" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <text x="250" y="150" text-anchor="middle" class="axis-lbl">Time (t)</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- PANEL (b): STATIC BATCHING                                             -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 255)">
    <rect x="0" y="0" width="700" height="235" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="16" y="12" width="120" height="18" rx="2" fill="#e2e8f0"/>
    <text x="76" y="24" text-anchor="middle" class="panel-title">(b) Static Batching</text>
    <text x="146" y="25" class="panel-sub">Fixed barrier: requests wait until batch size B is filled; tail padding wastes Tensor Core cycles</text>

    <!-- Execution Timeline -->
    <g transform="translate(70, 52)">
      <!-- Barrier Line -->
      <line x1="110" y1="-5" x2="110" y2="95" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2"/>
      <rect x="70" y="-18" width="80" height="15" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="110" y="-8" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">Batch Dispatch</text>

      <!-- R1: arrives t=0, waits until t=110, computes, then padded -->
      <text x="-15" y="14" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R1</text>
      <rect x="0" y="0" width="110" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="55" y="13" text-anchor="middle" class="wait-txt">Wait (110ms)</text>
      <rect x="110" y="0" width="90" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="155" y="13" text-anchor="middle" class="req-txt">Compute R1</text>
      <rect x="200" y="0" width="40" height="20" rx="2" fill="url(#pad-hatch)" stroke="#e11d48" stroke-width="0.8"/>
      <text x="220" y="13" text-anchor="middle" class="pad-txt">Pad</text>

      <!-- R2: arrives t=30, waits until t=110, computes (longest = 130) -->
      <text x="-15" y="38" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R2</text>
      <rect x="30" y="24" width="80" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="70" y="37" text-anchor="middle" class="wait-txt">Wait (80ms)</text>
      <rect x="110" y="24" width="130" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="175" y="37" text-anchor="middle" class="req-txt">Compute R2 (Max Len)</text>

      <!-- R3: arrives t=65, waits until t=110, computes, padded -->
      <text x="-15" y="62" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R3</text>
      <rect x="65" y="48" width="45" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="87.5" y="61" text-anchor="middle" class="wait-txt">Wait</text>
      <rect x="110" y="48" width="75" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="147.5" y="61" text-anchor="middle" class="req-txt">Compute R3</text>
      <rect x="185" y="48" width="55" height="20" rx="2" fill="url(#pad-hatch)" stroke="#e11d48" stroke-width="0.8"/>
      <text x="212.5" y="61" text-anchor="middle" class="pad-txt">Pad (Waste)</text>

      <!-- R4: arrives t=105, completes the batch trigger -->
      <text x="-15" y="86" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R4</text>
      <rect x="95" y="72" width="15" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <rect x="110" y="72" width="105" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="162.5" y="85" text-anchor="middle" class="req-txt">Compute R4</text>
      <rect x="215" y="72" width="25" height="20" rx="2" fill="url(#pad-hatch)" stroke="#e11d48" stroke-width="0.8"/>
      <text x="227.5" y="85" text-anchor="middle" class="pad-txt">Pad</text>

      <!-- GPU Utilization Bar -->
      <text x="-15" y="128" text-anchor="end" font-size="8.5" font-weight="700" fill="#475569">GPU Active</text>
      <rect x="0" y="116" width="500" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="110" y="116" width="130" height="18" rx="2" fill="#1F407A"/>

      <!-- Util Badge -->
      <rect x="520" y="115" width="85" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="562.5" y="128" text-anchor="middle" class="util-lbl" fill="#b45309">~68% GPU Util</text>

      <!-- Time Axis -->
      <line x1="0" y1="148" x2="500" y2="148" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <text x="250" y="160" text-anchor="middle" class="axis-lbl">Time (t)</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- PANEL (c): DYNAMIC BATCHING                                            -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 510)">
    <rect x="0" y="0" width="700" height="215" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="16" y="12" width="130" height="18" rx="2" fill="#e2e8f0"/>
    <text x="81" y="24" text-anchor="middle" class="panel-title">(c) Dynamic Batching</text>
    <text x="156" y="25" class="panel-sub">Timeout-bounded window: batch dispatches when max_queue_delay_ms expires OR batch size reached</text>

    <!-- Execution Timeline -->
    <g transform="translate(70, 52)">
      <!-- Window 1 Barrier -->
      <line x1="50" y1="-5" x2="50" y2="95" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
      <rect x="10" y="-18" width="80" height="15" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="50" y="-8" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">Window 1 Δt</text>

      <!-- Batch 1: R1 + R2 -->
      <!-- R1 -->
      <text x="-15" y="14" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R1</text>
      <rect x="0" y="0" width="50" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="25" y="13" text-anchor="middle" class="wait-txt">Wait</text>
      <rect x="50" y="0" width="90" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="95" y="13" text-anchor="middle" class="req-txt">Compute R1</text>
      <rect x="140" y="0" width="40" height="20" rx="2" fill="url(#pad-hatch)" stroke="#e11d48" stroke-width="0.8"/>
      <text x="160" y="13" text-anchor="middle" class="pad-txt">Pad</text>

      <!-- R2 -->
      <text x="-15" y="38" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R2</text>
      <rect x="20" y="24" width="30" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="35" y="37" text-anchor="middle" class="wait-txt">Wait</text>
      <rect x="50" y="24" width="130" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="115" y="37" text-anchor="middle" class="req-txt">Compute R2</text>

      <!-- Window 2 Barrier -->
      <line x1="220" y1="-5" x2="220" y2="95" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
      <rect x="180" y="-18" width="80" height="15" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="220" y="-8" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">Window 2 Δt</text>

      <!-- Batch 2: R3 + R4 -->
      <!-- R3 -->
      <text x="-15" y="62" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R3</text>
      <rect x="180" y="48" width="40" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="200" y="61" text-anchor="middle" class="wait-txt">Wait</text>
      <rect x="220" y="48" width="75" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="257.5" y="61" text-anchor="middle" class="req-txt">Compute R3</text>
      <rect x="295" y="48" width="30" height="20" rx="2" fill="url(#pad-hatch)" stroke="#e11d48" stroke-width="0.8"/>
      <text x="310" y="61" text-anchor="middle" class="pad-txt">Pad</text>

      <!-- R4 -->
      <text x="-15" y="86" text-anchor="end" font-size="8.5" font-weight="700" fill="#334155">R4</text>
      <rect x="190" y="72" width="30" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="205" y="85" text-anchor="middle" class="wait-txt">Wait</text>
      <rect x="220" y="72" width="105" height="20" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
      <text x="272.5" y="85" text-anchor="middle" class="req-txt">Compute R4</text>

      <!-- GPU Utilization Bar -->
      <text x="-15" y="118" text-anchor="end" font-size="8.5" font-weight="700" fill="#475569">GPU Active</text>
      <rect x="0" y="106" width="500" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="50" y="106" width="130" height="18" rx="2" fill="#1F407A"/>
      <rect x="220" y="106" width="105" height="18" rx="2" fill="#1F407A"/>

      <!-- Util Badge -->
      <rect x="520" y="105" width="85" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="562.5" y="118" text-anchor="middle" class="util-lbl" fill="#15803d">~86% GPU Util</text>

      <!-- Time Axis -->
      <line x1="0" y1="138" x2="500" y2="138" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <text x="250" y="150" text-anchor="middle" class="axis-lbl">Time (t)</text>
    </g>
  </g>
</svg>
