<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .stage-title { font-size: 8.5px; font-weight: 700; fill: #0f172a; }
    .stage-sub { font-size: 7.5px; fill: #475569; }
    .badge-txt { font-size: 7px; font-weight: 700; fill: #ffffff; }
    .flow-lbl { font-size: 7px; font-weight: 600; fill: #b45309; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- PIPELINE ARCHITECTURE (TOP SECTION)                                    -->
  <!-- ====================================================================== -->
  <g transform="translate(18, 28)">
    <!-- Stage 1: Request Ingress -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="64" height="64" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="6" y="6" width="52" height="16" rx="2" fill="#e2e8f0"/>
      <text x="32" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Request</text>
      <text x="32" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">Tokens</text>
      <text x="32" y="50" text-anchor="middle" font-size="7" fill="#64748b">(B × S)</text>
    </g>

    <!-- Arrow -> Gating -->
    <path d="M 64,137 L 84,137" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <!-- Stage 2: Router / Gating Network -->
    <g transform="translate(86, 92)">
      <rect x="0" y="0" width="104" height="90" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <rect x="8" y="8" width="88" height="16" rx="2" fill="#fde68a"/>
      <text x="52" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Gating Network</text>
      
      <text x="8" y="38" class="stage-sub"><tspan font-weight="600">Softmax:</tspan><tspan dx="3">Top-k logits</tspan></text>
      <text x="8" y="50" class="stage-sub"><tspan font-weight="600">Selection:</tspan><tspan dx="3">k=2 of E=8</tspan></text>
      <text x="8" y="62" class="stage-sub"><tspan font-weight="600">Weights:</tspan><tspan dx="3">Token gating</tspan></text>
      <text x="8" y="76" font-size="7.5" font-weight="700" fill="#b45309">Capacity Factor Gate</text>
    </g>

    <!-- Arrow -> AllToAll Dispatch -->
    <path d="M 190,137 L 226,137" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <text x="208" y="125" text-anchor="middle" class="flow-lbl">Top-2 IDs</text>

    <!-- Stage 3: AllToAll Dispatch -->
    <g transform="translate(228, 102)">
      <rect x="0" y="0" width="92" height="70" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <rect x="8" y="8" width="76" height="16" rx="2" fill="#fde68a"/>
      <text x="46" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">AllToAll Dispatch</text>
      
      <text x="8" y="38" class="stage-sub"><tspan font-weight="600">Scatter:</tspan><tspan dx="3">To ranks</tspan></text>
      <text x="8" y="50" class="stage-sub"><tspan font-weight="600">Exchange:</tspan><tspan dx="3">Permute rank</tspan></text>
      <text x="8" y="62" class="stage-sub"><tspan font-weight="600">Fabric:</tspan><tspan dx="3">Cross-device</tspan></text>
    </g>

    <!-- Arrow AllToAll -> Expert Pool -->
    <path d="M 320,137 L 354,137" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="337" y="125" text-anchor="middle" font-size="7" font-weight="600" fill="#1F407A">Tokens</text>

    <!-- Stage 4: Expert Compute Pool (4 GPU Ranks) -->
    <g transform="translate(356, 8)">
      <rect x="0" y="0" width="175" height="260" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="12" y="8" width="151" height="16" rx="2" fill="#e2e8f0"/>
      <text x="87.5" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Sharded Expert Ranks</text>

      <!-- GPU 0: Expert 0 & 1 (Active) -->
      <g transform="translate(10, 32)">
        <rect x="0" y="0" width="155" height="48" rx="4" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
        <rect x="6" y="6" width="38" height="14" rx="2" fill="#1F407A"/>
        <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 0</text>
        <text x="50" y="17" class="stage-title" fill="#14294E">Expert 0 &amp; 1 (Active)</text>
        <text x="6" y="32" class="stage-sub"><tspan font-weight="600">Input:</tspan><tspan dx="3">Routed token batch</tspan></text>
        <text x="6" y="42" class="stage-sub"><tspan font-weight="600">Compute:</tspan><tspan dx="3">SwiGLU FFN pass</tspan></text>
      </g>

      <!-- GPU 1: Expert 2 & 3 (Idle) -->
      <g transform="translate(10, 86)">
        <rect x="0" y="0" width="155" height="48" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,2"/>
        <rect x="6" y="6" width="38" height="14" rx="2" fill="#94a3b8"/>
        <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 1</text>
        <text x="50" y="17" class="stage-title" fill="#64748b">Expert 2 &amp; 3 (Idle)</text>
        <text x="6" y="32" class="stage-sub" fill="#94a3b8"><tspan font-weight="600">Routed:</tspan><tspan dx="3">0 tokens this step</tspan></text>
        <text x="6" y="42" class="stage-sub" fill="#94a3b8"><tspan font-weight="600">State:</tspan><tspan dx="3">Idle bubble cycle</tspan></text>
      </g>

      <!-- GPU 2: Expert 4 & 5 (Active) -->
      <g transform="translate(10, 140)">
        <rect x="0" y="0" width="155" height="48" rx="4" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
        <rect x="6" y="6" width="38" height="14" rx="2" fill="#1F407A"/>
        <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 2</text>
        <text x="50" y="17" class="stage-title" fill="#14294E">Expert 4 &amp; 5 (Active)</text>
        <text x="6" y="32" class="stage-sub"><tspan font-weight="600">Input:</tspan><tspan dx="3">Routed token batch</tspan></text>
        <text x="6" y="42" class="stage-sub"><tspan font-weight="600">Compute:</tspan><tspan dx="3">SwiGLU FFN pass</tspan></text>
      </g>

      <!-- GPU 3: Expert 6 & 7 (Idle) -->
      <g transform="translate(10, 194)">
        <rect x="0" y="0" width="155" height="48" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,2"/>
        <rect x="6" y="6" width="38" height="14" rx="2" fill="#94a3b8"/>
        <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 3</text>
        <text x="50" y="17" class="stage-title" fill="#64748b">Expert 6 &amp; 7 (Idle)</text>
        <text x="6" y="32" class="stage-sub" fill="#94a3b8"><tspan font-weight="600">Routed:</tspan><tspan dx="3">0 tokens this step</tspan></text>
        <text x="6" y="42" class="stage-sub" fill="#94a3b8"><tspan font-weight="600">State:</tspan><tspan dx="3">Idle bubble cycle</tspan></text>
      </g>
    </g>

    <!-- Arrow Expert Pool -> AllToAll Combine -->
    <path d="M 531,137 L 565,137" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <text x="548" y="125" text-anchor="middle" class="flow-lbl">Act</text>

    <!-- Stage 5: AllToAll Combine -->
    <g transform="translate(567, 102)">
      <rect x="0" y="0" width="92" height="70" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <rect x="8" y="8" width="76" height="16" rx="2" fill="#fde68a"/>
      <text x="46" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">AllToAll Combine</text>
      
      <text x="8" y="38" class="stage-sub"><tspan font-weight="600">Gather:</tspan><tspan dx="3">Activations</tspan></text>
      <text x="8" y="50" class="stage-sub"><tspan font-weight="600">Restore:</tspan><tspan dx="3">Un-permute tokens</tspan></text>
      <text x="8" y="62" class="stage-sub"><tspan font-weight="600">Fabric:</tspan><tspan dx="3">Cross-device</tspan></text>
    </g>

    <!-- Arrow Combine -> Weighted Sum -->
    <path d="M 659,137 L 687,137" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Stage 6: Weighted Sum & Egress -->
    <g transform="translate(689, 97)">
      <rect x="0" y="0" width="50" height="80" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="25" y="24" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Sum</text>
      <text x="25" y="42" text-anchor="middle" font-size="7" fill="#16a34a">Top-2</text>
      <text x="25" y="54" text-anchor="middle" font-size="7" fill="#16a34a">Weights</text>
      <text x="25" y="70" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">+ Res</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- TECHNICAL CALLOUT CARDS (BOTTOM SECTION)                               -->
  <!-- ====================================================================== -->
  <g transform="translate(18, 335)">
    <!-- Card 1: Expert Load Imbalance -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="362" height="105" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="1"/>
      <rect x="10" y="8" width="135" height="16" rx="2" fill="#ffe4e6"/>
      <text x="77.5" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#be123c">LOAD IMBALANCE RISK</text>

      <text x="10" y="38" class="stage-sub"><tspan font-weight="700">Popularity Skew:</tspan><tspan dx="4">Hot experts receive excess tokens, causing GPU stragglers.</tspan></text>
      <text x="10" y="52" class="stage-sub"><tspan font-weight="700">Token Dropping:</tspan><tspan dx="4">Exceeding capacity factor (e.g. C=1.2) causes dropped tokens.</tspan></text>
      <text x="10" y="66" class="stage-sub"><tspan font-weight="700">Auxiliary Loss:</tspan><tspan dx="4">Balances routing probabilities across experts during pretraining.</tspan></text>
      <text x="10" y="84" font-size="7.5" font-weight="700" fill="#be123c">Straggler latency bounds the slowest expert in each forward step.</text>
    </g>

    <!-- Card 2: Interconnect & AllToAll Overhead -->
    <g transform="translate(382, 0)">
      <rect x="0" y="0" width="362" height="105" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="8" width="145" height="16" rx="2" fill="#e2e8f0"/>
      <text x="82.5" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">ALLTOALL NETWORK SCALING</text>

      <text x="10" y="38" class="stage-sub"><tspan font-weight="700">Two Collectives:</tspan><tspan dx="4">1× AllToAll dispatch + 1× AllToAll combine per MoE layer.</tspan></text>
      <text x="10" y="52" class="stage-sub"><tspan font-weight="700">Cross-Node Fabric:</tspan><tspan dx="4">EP scales across cluster nodes over RoCE/InfiniBand fabrics.</tspan></text>
      <text x="10" y="66" class="stage-sub"><tspan font-weight="700">Layer Volume:</tspan><tspan dx="4">2 × k × B × S × d_hidden bytes per MoE transformer block.</tspan></text>
      <text x="10" y="84" font-size="7.5" font-weight="700" fill="#14294E">High-bandwidth 400 Gb/s fabrics essential to prevent network saturation.</text>
    </g>
  </g>
</svg>