  <text x="190" y="60" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">compute-bound</text>
  <text x="190" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">sets TTFT</text>
