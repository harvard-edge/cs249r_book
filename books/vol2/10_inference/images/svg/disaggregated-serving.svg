<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .pool-title { font-size: 11px; font-weight: 700; }
    .pool-sub { font-size: 8px; font-weight: 600; }
    .node-title { font-size: 8.5px; font-weight: 700; }
    .node-spec { font-size: 7.5px; fill: #475569; }
    .badge-txt { font-size: 7.5px; font-weight: 700; fill: #ffffff; }
    .fab-title { font-size: 9px; font-weight: 700; }
    .fab-sub { font-size: 7.5px; }
    .flow-lbl { font-size: 8px; font-weight: 700; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- INGRESS: Client Request                                                -->
  <!-- ====================================================================== -->
  <rect x="20" y="175" width="85" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="28" y="183" width="69" height="18" rx="2" fill="#e2e8f0"/>
  <text x="62.5" y="195" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">User Request</text>
  <text x="62.5" y="214" text-anchor="middle" font-size="7.5" fill="#64748b">Prompt Tokens</text>
  <text x="62.5" y="226" text-anchor="middle" font-size="7.5" fill="#64748b">(S_prompt tokens)</text>

  <!-- Ingress Arrow -> Prefill Pool -->
  <path d="M 105,205 L 138,205" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ====================================================================== -->
  <!-- PREFILL POOL: Compute-Bound                                            -->
  <!-- ====================================================================== -->
  <rect x="140" y="20" width="280" height="370" rx="4" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>

  <!-- Header Banner -->
  <rect x="152" y="28" width="256" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="280" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">Prefill Worker Pool</text>
  <text x="280" y="60" text-anchor="middle" font-size="8" font-weight="600" fill="#0284c7">Compute-Bound · High FP8 TFLOP/s · TTFT Critical</text>

  <!-- Prefill GPU Nodes -->
  <!-- Node PF-0 -->
  <g transform="translate(152, 78)">
    <rect x="0" y="0" width="122" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="6" y="6" width="38" height="15" rx="2" fill="#0284c7"/>
    <text x="25" y="17" text-anchor="middle" class="badge-txt">PF-0</text>
    <text x="50" y="17" class="node-title" fill="#0f172a">H100 SXM5</text>
    <text x="8" y="36" class="node-spec">• 8× H100 (FP8 Tensor Cores)</text>
    <text x="8" y="48" class="node-spec">• Parallel Prompt GEMM</text>
    <text x="8" y="58" class="node-spec">• High Arithmetic Intensity</text>
  </g>

  <!-- Node PF-1 -->
  <g transform="translate(286, 78)">
    <rect x="0" y="0" width="122" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="6" y="6" width="38" height="15" rx="2" fill="#0284c7"/>
    <text x="25" y="17" text-anchor="middle" class="badge-txt">PF-1</text>
    <text x="50" y="17" class="node-title" fill="#0f172a">H100 SXM5</text>
    <text x="8" y="36" class="node-spec">• 8× H100 (FP8 Tensor Cores)</text>
    <text x="8" y="48" class="node-spec">• Parallel Prompt GEMM</text>
    <text x="8" y="58" class="node-spec">• High Arithmetic Intensity</text>
  </g>

  <!-- Node PF-2 -->
  <g transform="translate(152, 152)">
    <rect x="0" y="0" width="122" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="6" y="6" width="38" height="15" rx="2" fill="#0284c7"/>
    <text x="25" y="17" text-anchor="middle" class="badge-txt">PF-2</text>
    <text x="50" y="17" class="node-title" fill="#0f172a">H100 SXM5</text>
    <text x="8" y="36" class="node-spec">• 8× H100 (FP8 Tensor Cores)</text>
    <text x="8" y="48" class="node-spec">• Parallel Prompt GEMM</text>
    <text x="8" y="58" class="node-spec">• High Arithmetic Intensity</text>
  </g>

  <!-- Node PF-3 -->
  <g transform="translate(286, 152)">
    <rect x="0" y="0" width="122" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="6" y="6" width="38" height="15" rx="2" fill="#0284c7"/>
    <text x="25" y="17" text-anchor="middle" class="badge-txt">PF-3</text>
    <text x="50" y="17" class="node-title" fill="#0f172a">H100 SXM5</text>
    <text x="8" y="36" class="node-spec">• 8× H100 (FP8 Tensor Cores)</text>
    <text x="8" y="48" class="node-spec">• Parallel Prompt GEMM</text>
    <text x="8" y="58" class="node-spec">• High Arithmetic Intensity</text>
  </g>

  <!-- Prefill Characteristics Card -->
  <rect x="152" y="226" width="256" height="74" rx="2" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="162" y="242" font-size="8.5" font-weight="700" fill="#0369a1">Phase Characteristics:</text>
  <text x="162" y="256" font-size="7.5" fill="#334155">• Processes entire prompt forward pass in 1 burst step</text>
  <text x="162" y="268" font-size="7.5" fill="#334155">• High memory bandwidth efficiency; saturates compute</text>
  <text x="162" y="280" font-size="7.5" fill="#334155">• Generates first token and builds initial KV-cache</text>
  <text x="162" y="292" font-size="7.5" font-weight="700" fill="#0284c7">• Autoscaling metric: Prompt Arrival Rate (tok/s)</text>

  <!-- Prefill Scaling rule -->
  <rect x="152" y="310" width="256" height="68" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="280" y="326" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Independent Capacity Sizing</text>
  <text x="280" y="340" text-anchor="middle" font-size="7.5" fill="#475569">Smaller pool footprint (e.g., 20% of GPUs)</text>
  <text x="280" y="352" text-anchor="middle" font-size="7.5" fill="#475569">Zero interference from slow decode token generation</text>
  <text x="280" y="364" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">Deterministic Time-to-First-Token (TTFT)</text>

  <!-- ====================================================================== -->
  <!-- HIGH-SPEED KV MIGRATION FABRIC                                         -->
  <!-- ====================================================================== -->
  <g transform="translate(426, 150)">
    <rect x="0" y="0" width="76" height="110" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="38" y="20" text-anchor="middle" class="fab-title" fill="#b45309">KV Cache</text>
    <text x="38" y="32" text-anchor="middle" class="fab-title" fill="#b45309">Transfer</text>
    
    <path d="M 12,50 L 64,50" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
    
    <text x="38" y="68" text-anchor="middle" class="fab-sub" fill="#78350f">RDMA / RoCE</text>
    <text x="38" y="80" text-anchor="middle" class="fab-sub" fill="#78350f">400 Gb/s NICs</text>
    <text x="38" y="94" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">&lt; 5–10 ms</text>
  </g>

  <!-- Data Flow Arrow Prefill -> Transfer -->
  <path d="M 420,205 L 424,205" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <!-- Data Flow Arrow Transfer -> Decode -->
  <path d="M 502,205 L 508,205" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- ====================================================================== -->
  <!-- DECODE POOL: Memory-Bandwidth-Bound                                    -->
  <!-- ====================================================================== -->
  <rect x="510" y="20" width="240" height="370" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>

  <!-- Header Banner -->
  <rect x="522" y="28" width="216" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="630" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Decode Worker Pool</text>
  <text x="630" y="60" text-anchor="middle" font-size="8" font-weight="600" fill="#16a34a">Memory-Bound · High HBM Bandwidth · TPOT Critical</text>

  <!-- Decode GPU Nodes (3 rows of 2 nodes = 6 nodes) -->
  <g transform="translate(522, 78)">
    <rect x="0" y="0" width="102" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="5" y="5" width="34" height="14" rx="2" fill="#16a34a"/>
    <text x="22" y="15" text-anchor="middle" class="badge-txt">DC-0</text>
    <text x="44" y="15" font-size="7.5" font-weight="700" fill="#0f172a">Large HBM</text>
    <text x="6" y="30" class="node-spec">PagedAttention KV</text>

    <rect x="114" y="0" width="102" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="119" y="5" width="34" height="14" rx="2" fill="#16a34a"/>
    <text x="136" y="15" text-anchor="middle" class="badge-txt">DC-1</text>
    <text x="158" y="15" font-size="7.5" font-weight="700" fill="#0f172a">Large HBM</text>
    <text x="120" y="30" class="node-spec">PagedAttention KV</text>
  </g>

  <g transform="translate(522, 128)">
    <rect x="0" y="0" width="102" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="5" y="5" width="34" height="14" rx="2" fill="#16a34a"/>
    <text x="22" y="15" text-anchor="middle" class="badge-txt">DC-2</text>
    <text x="44" y="15" font-size="7.5" font-weight="700" fill="#0f172a">Large HBM</text>
    <text x="6" y="30" class="node-spec">PagedAttention KV</text>

    <rect x="114" y="0" width="102" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="119" y="5" width="34" height="14" rx="2" fill="#16a34a"/>
    <text x="136" y="15" text-anchor="middle" class="badge-txt">DC-3</text>
    <text x="158" y="15" font-size="7.5" font-weight="700" fill="#0f172a">Large HBM</text>
    <text x="120" y="30" class="node-spec">PagedAttention KV</text>
  </g>

  <g transform="translate(522, 178)">
    <rect x="0" y="0" width="102" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="5" y="5" width="34" height="14" rx="2" fill="#16a34a"/>
    <text x="22" y="15" text-anchor="middle" class="badge-txt">DC-4</text>
    <text x="44" y="15" font-size="7.5" font-weight="700" fill="#0f172a">Large HBM</text>
    <text x="6" y="30" class="node-spec">PagedAttention KV</text>

    <rect x="114" y="0" width="102" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="119" y="5" width="34" height="14" rx="2" fill="#16a34a"/>
    <text x="136" y="15" text-anchor="middle" class="badge-txt">DC-5</text>
    <text x="158" y="15" font-size="7.5" font-weight="700" fill="#0f172a">Large HBM</text>
    <text x="120" y="30" class="node-spec">PagedAttention KV</text>
  </g>

  <!-- Decode Characteristics Card -->
  <rect x="522" y="226" width="216" height="74" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="532" y="242" font-size="8.5" font-weight="700" fill="#15803d">Phase Characteristics:</text>
  <text x="532" y="256" font-size="7.5" fill="#334155">• Emits tokens one-by-one autoregressively</text>
  <text x="532" y="268" font-size="7.5" fill="#334155">• Memory bandwidth bound: reads all weights/token</text>
  <text x="532" y="280" font-size="7.5" fill="#334155">• Large KV cache pools allow large continuous batching</text>
  <text x="532" y="292" font-size="7.5" font-weight="700" fill="#16a34a">• Autoscaling metric: Active Concurrent Streams</text>

  <!-- Decode Scaling rule -->
  <rect x="522" y="310" width="216" height="68" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="630" y="326" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Independent Capacity Sizing</text>
  <text x="630" y="340" text-anchor="middle" font-size="7.5" fill="#475569">Larger pool footprint (e.g., 80% of GPUs)</text>
  <text x="630" y="352" text-anchor="middle" font-size="7.5" fill="#475569">Quantized FP8/INT4 weights maximize throughput</text>
  <text x="630" y="364" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Bounded Time-Per-Output-Token (TPOT)</text>

  <!-- ====================================================================== -->
  <!-- EGRESS: Streamed Output Tokens                                         -->
  <!-- ====================================================================== -->
  <path d="M 750,205 L 778,205" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="780" y="175" width="65" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="786" y="183" width="53" height="18" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
  <text x="812.5" y="195" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Response</text>
  <text x="812.5" y="214" text-anchor="middle" font-size="7.5" fill="#334155">Streamed</text>
  <text x="812.5" y="226" text-anchor="middle" font-size="7.5" fill="#334155">Tokens</text>

  <!-- ====================================================================== -->
  <!-- BOTTOM SUMMARY CARD: Systems Takeaway                                  -->
  <!-- ====================================================================== -->
  <rect x="20" y="405" width="820" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="35" y="423" font-size="9" font-weight="700" fill="#0f172a">Key Systems Advantage of Disaggregated Serving:</text>
  <text x="35" y="437" font-size="8" fill="#334155">• <tspan font-weight="700">Eliminates Phase Contention:</tspan> Compute-intensive prompt prefill bursts never starve or preempt memory-bandwidth-bound token decode loops.</text>
  <text x="35" y="449" font-size="8" fill="#334155">• <tspan font-weight="700">Heterogeneous Specialization:</tspan> Prefill nodes use high-compute accelerators; decode nodes use high-capacity memory configurations.</text>

  <!-- Footnote -->
  <text x="430" y="472" text-anchor="middle" font-size="8" fill="#64748b" font-style="italic">
    State migration over RDMA/RoCE transfers the completed KV cache in milliseconds, decoupling scaling dimensions while preserving end-to-end latency SLOs.
  </text>
</svg>
