<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="262" fill="#ffffff"/>
