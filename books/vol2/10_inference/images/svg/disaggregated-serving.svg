  <text x="510" y="60" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">bandwidth-bound</text>
  <text x="510" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">sets TPOT</text>
