  <rect x="438" y="178" width="144" height="32" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="510.0" y="198.32" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Decode 2</text>
  <text x="510" y="236" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-style="italic">sized for output tokens/s</text>
  <rect x="620" y="119" width="66" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
