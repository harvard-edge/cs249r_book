<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="#e11d48"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .axis-title { font-size: 11px; font-weight: 700; }
    .tick-lbl { font-size: 9px; fill: #64748b; }
    .curve-lbl { font-size: 10px; font-weight: 700; }
    .badge-txt { font-size: 8.5px; font-weight: 700; }
    .card-txt { font-size: 8.5px; fill: #334155; }
    .card-title { font-size: 9px; font-weight: 700; fill: #0f172a; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- PLOT AREA & GRID                                                       -->
  <!-- ====================================================================== -->
  <!-- Horizontal Grid Lines -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="85" y1="90" x2="605" y2="90"/>
    <line x1="85" y1="130" x2="605" y2="130"/>
    <line x1="85" y1="170" x2="605" y2="170"/>
    <line x1="85" y1="210" x2="605" y2="210"/>
    <line x1="85" y1="250" x2="605" y2="250"/>
    <line x1="85" y1="290" x2="605" y2="290"/>
    <line x1="85" y1="330" x2="605" y2="330"/>
  </g>

  <!-- OOM / Capacity Limit Shaded Zone (B > 64) -->
  <rect x="525" y="65" width="80" height="275" fill="#ffe4e6" fill-opacity="0.45"/>

  <!-- Key Insight Callout Card (Top-Left) -->
  <g transform="translate(100, 68)">
    <rect x="0" y="0" width="165" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="18" class="card-title">Scaling Characteristics</text>
    <text x="12" y="32" class="card-txt"><tspan font-weight="700" fill="#14294E">• Throughput:</tspan> sublinear (saturates compute)</text>
    <text x="12" y="44" class="card-txt"><tspan font-weight="700" fill="#be123c">• Latency:</tspan> linear growth with batch size</text>
  </g>

  <!-- ====================================================================== -->
  <!-- AXES & TICKS                                                           -->
  <!-- ====================================================================== -->
  <!-- X Axis -->
  <line x1="85" y1="340" x2="615" y2="340" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="345" y="380" text-anchor="middle" class="axis-title" fill="#0f172a">Batch Size (B)</text>

  <!-- Left Y Axis: Throughput -->
  <line x1="85" y1="340" x2="85" y2="50" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="30" y="195" text-anchor="middle" class="axis-title" fill="#14294E" transform="rotate(-90, 30, 195)">Throughput (tokens/s)</text>

  <!-- Right Y Axis: Latency -->
  <line x1="605" y1="340" x2="605" y2="50" stroke="#e11d48" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="660" y="195" text-anchor="middle" class="axis-title" fill="#be123c" transform="rotate(90, 660, 195)">Latency P50 (ms)</text>

  <!-- X Ticks -->
  <g class="tick-lbl" text-anchor="middle">
    <line x1="110" y1="340" x2="110" y2="346" stroke="#475569" stroke-width="1"/>
    <text x="110" y="358">1</text>
    <line x1="170" y1="340" x2="170" y2="346" stroke="#475569" stroke-width="1"/>
    <text x="170" y="358">2</text>
    <line x1="230" y1="340" x2="230" y2="346" stroke="#475569" stroke-width="1"/>
    <text x="230" y="358">4</text>
    <line x1="290" y1="340" x2="290" y2="346" stroke="#475569" stroke-width="1"/>
    <text x="290" y="358">8</text>
    <line x1="350" y1="340" x2="350" y2="346" stroke="#475569" stroke-width="1"/>
    <text x="350" y="358" font-weight="700" fill="#15803d">16</text>
    <line x1="410" y1="340" x2="410" y2="346" stroke="#475569" stroke-width="1"/>
    <text x="410" y="358">32</text>
    <line x1="470" y1="340" x2="470" y2="346" stroke="#475569" stroke-width="1"/>
    <text x="470" y="358">64</text>
    <line x1="530" y1="340" x2="530" y2="346" stroke="#475569" stroke-width="1"/>
    <text x="530" y="358" font-weight="700" fill="#be123c">128</text>
  </g>

  <!-- Left Y Ticks (Throughput) -->
  <g class="tick-lbl" text-anchor="end">
    <line x1="80" y1="330" x2="85" y2="330" stroke="#1F407A" stroke-width="1"/>
    <text x="76" y="333">100</text>
    <line x1="80" y1="290" x2="85" y2="290" stroke="#1F407A" stroke-width="1"/>
    <text x="76" y="293">200</text>
    <line x1="80" y1="250" x2="85" y2="250" stroke="#1F407A" stroke-width="1"/>
    <text x="76" y="253">500</text>
    <line x1="80" y1="210" x2="85" y2="210" stroke="#1F407A" stroke-width="1"/>
    <text x="76" y="213">1K</text>
    <line x1="80" y1="170" x2="85" y2="170" stroke="#1F407A" stroke-width="1"/>
    <text x="76" y="173">2K</text>
    <line x1="80" y1="130" x2="85" y2="130" stroke="#1F407A" stroke-width="1"/>
    <text x="76" y="133">5K</text>
    <line x1="80" y1="90" x2="85" y2="90" stroke="#1F407A" stroke-width="1"/>
    <text x="76" y="93">10K</text>
  </g>

  <!-- Right Y Ticks (Latency) -->
  <g class="tick-lbl" text-anchor="start">
    <line x1="605" y1="330" x2="610" y2="330" stroke="#e11d48" stroke-width="1"/>
    <text x="615" y="333">20</text>
    <line x1="605" y1="290" x2="610" y2="290" stroke="#e11d48" stroke-width="1"/>
    <text x="615" y="293">40</text>
    <line x1="605" y1="250" x2="610" y2="250" stroke="#e11d48" stroke-width="1"/>
    <text x="615" y="253">80</text>
    <line x1="605" y1="210" x2="610" y2="210" stroke="#e11d48" stroke-width="1"/>
    <text x="615" y="213">150</text>
    <line x1="605" y1="170" x2="610" y2="170" stroke="#e11d48" stroke-width="1"/>
    <text x="615" y="173">300</text>
    <line x1="605" y1="130" x2="610" y2="130" stroke="#e11d48" stroke-width="1"/>
    <text x="615" y="133">600</text>
    <line x1="605" y1="90" x2="610" y2="90" stroke="#e11d48" stroke-width="1"/>
    <text x="615" y="93">1.2K</text>
  </g>

  <!-- ====================================================================== -->
  <!-- CURVES & DATA POINTS                                                   -->
  <!-- ====================================================================== -->
  <!-- Throughput Curve (Blue, sublinear saturation) -->
  <path d="M 110,320 C 120.0,314.2 150.0,298.3 170,285 C 190.0,271.7 210.0,253.5 230,240 C 250.0,226.5 270.0,214.3 290,204 C 310.0,193.7 330.0,185.7 350,178 C 370.0,170.3 390.0,164.0 410,158 C 430.0,152.0 450.0,146.7 470,142 C 490.0,137.3 520.0,132.0 530,130"
        fill="none" stroke="#1F407A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Throughput Data Points -->
  <g fill="#1F407A">
    <circle cx="110" cy="320" r="3.5"/>
    <circle cx="170" cy="285" r="3.5"/>
    <circle cx="230" cy="240" r="3.5"/>
    <circle cx="290" cy="204" r="3.5"/>
    <circle cx="350" cy="178" r="4"/>
    <circle cx="410" cy="158" r="3.5"/>
    <circle cx="470" cy="142" r="3.5"/>
    <circle cx="530" cy="130" r="3.5"/>
  </g>
  <text x="465" y="125" text-anchor="middle" class="curve-lbl" fill="#14294E">Throughput</text>

  <!-- Latency Curve (Red, linear growth on log scale) -->
  <path d="M 110,330 L 170,310 L 230,285 L 290,255 L 350,225 L 410,195 L 470,165 L 530,135"
        fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Latency Data Points -->
  <g fill="#e11d48">
    <circle cx="110" cy="330" r="3.5"/>
    <circle cx="170" cy="310" r="3.5"/>
    <circle cx="230" cy="285" r="3.5"/>
    <circle cx="290" cy="255" r="3.5"/>
    <circle cx="350" cy="225" r="4"/>
    <circle cx="410" cy="195" r="3.5"/>
    <circle cx="470" cy="165" r="3.5"/>
    <circle cx="530" cy="135" r="3.5"/>
  </g>
  <text x="475" y="185" text-anchor="middle" class="curve-lbl" fill="#be123c">Latency</text>

  <!-- ====================================================================== -->
  <!-- OPTIMAL OPERATING KNEE & OOM LIMIT                                     -->
  <!-- ====================================================================== -->
  <!-- Optimal Knee Vertical Guideline (B = 16) -->
  <line x1="350" y1="58" x2="350" y2="340" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Highlight Rings at B = 16 -->
  <circle cx="350" cy="178" r="7" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="350" cy="225" r="7" fill="none" stroke="#16a34a" stroke-width="2"/>

  <!-- Optimal Knee Badge -->
  <rect x="298" y="46" width="104" height="22" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="350" y="61" text-anchor="middle" class="badge-txt" fill="#15803d">Optimal Knee (B=16)</text>

  <!-- Memory Capacity Limit Guideline (B ~ 96) -->
  <line x1="525" y1="58" x2="525" y2="340" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- OOM Badge -->
  <rect x="495" y="46" width="105" height="22" rx="2" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/>
  <text x="547.5" y="61" text-anchor="middle" class="badge-txt" fill="#be123c">KV OOM Boundary</text>

  <!-- ====================================================================== -->
  <!-- FOOTER BENCHMARK SPEC                                                  -->
  <!-- ====================================================================== -->
  <text x="345" y="415" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    Evaluated on 8× H100 SXM5, Llama-3-70B (FP8 TP=4, PP=1, S_prompt=2048, S_gen=512). B=16 balances saturation with latency SLO.
  </text>
</svg>
