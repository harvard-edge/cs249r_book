<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="820" height="432" fill="#ffffff"/>
  <g transform="translate(0,10)">  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <!-- ===== tier bands: light supporting structure ===== -->
  <rect x="140" y="52" width="500" height="88" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="93.0" font-size="14.5" font-weight="700" fill="#0f172a">Tier 1</text>
  <text x="20" y="110.0" font-size="13.5" fill="#475569">edge cache</text>
  <rect x="140" y="160" width="500" height="90" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="202.0" font-size="14.5" font-weight="700" fill="#0f172a">Tier 2</text>
  <text x="20" y="219.0" font-size="13.5" fill="#475569">gateway, router</text>
  <rect x="140" y="270" width="500" height="110" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="322.0" font-size="14.5" font-weight="700" fill="#0f172a">Tier 3</text>
  <text x="20" y="339.0" font-size="13.5" fill="#475569">model serving</text>
  <!-- ===== client ===== -->
  <rect x="160" y="12" width="470" height="24" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="395" y="28.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">client</text>
  <!-- ===== tier 1 ===== -->
  <rect x="160" y="74" width="90" height="32" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="205.0" y="94.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b21b6">authorize</text>
  <rect x="280" y="74" width="100" height="32" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="330.0" y="94.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Edge PoP</text>
  <rect x="400" y="74" width="70" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="435.0" y="94.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b">PoP</text>
  <rect x="485" y="74" width="70" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="520.0" y="94.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#64748b">PoP</text>
  <!-- ===== tier 2 ===== -->
  <rect x="160" y="190" width="110" height="32" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="215.0" y="210.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5b21b6">telemetry</text>
  <rect x="290" y="190" width="80" height="32" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="330.0" y="210.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b21b6">rate limit</text>
  <rect x="390" y="190" width="60" height="32" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="420.0" y="210.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b21b6">auth</text>
  <rect x="470" y="190" width="90" height="32" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="515.0" y="210.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b21b6">router</text>
  <!-- ===== tier 3 ===== -->
  <rect x="160" y="296" width="130" height="60" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="225" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b21b6">autoscaler</text>
  <text x="225" y="333" text-anchor="middle" font-size="13.5" fill="#475569">queue depth,</text>
  <text x="225" y="349" text-anchor="middle" font-size="13.5" fill="#475569">KV use</text>
  <rect x="318" y="296" width="54" height="60" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="345" y="331" text-anchor="middle" font-size="13.5" fill="#64748b">worker</text>
  <rect x="382" y="296" width="54" height="60" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="409" y="331" text-anchor="middle" font-size="13.5" fill="#64748b">worker</text>
  <path d="M290,326 H316" fill="none" stroke="#7c3aed" stroke-width="1.1" stroke-dasharray="3,2" marker-end="url(#arr-purple)"/>
  <rect x="450" y="290" width="162" height="72" rx="2" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="602" y="306" text-anchor="end" font-size="13.5" font-weight="700" fill="#14294E">GPU worker</text>
  <rect x="462" y="318" width="66" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="495.0" y="337.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">prefill</text>
  <rect x="540" y="318" width="66" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="573.0" y="337.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">decode</text>
  <!-- ===== focal path: one cache-miss request, down through the tiers ===== -->
  <path d="M205,36 V72" fill="none" stroke="#1F407A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <path d="M250,90 H278" fill="none" stroke="#1F407A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <path d="M330,106 V188" fill="none" stroke="#1F407A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <path d="M370,206 H388" fill="none" stroke="#1F407A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <path d="M450,206 H468" fill="none" stroke="#1F407A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <path d="M495,222 V316" fill="none" stroke="#1F407A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <path d="M528,333 H538" fill="none" stroke="#1F407A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <text x="213" y="67" font-size="13.5" font-weight="700" fill="#14294E">request</text>
  <text x="338" y="128" font-size="13.5" font-weight="700" fill="#14294E">cache miss</text>
  <text x="503" y="244" font-size="13.5" font-weight="700" fill="#14294E">dispatch</text>
  <!-- ===== token stream back up ===== -->
  <path d="M606,333 H626 V40" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arr-green)"/>
  <text x="618" y="264" text-anchor="end" font-size="13.5" font-weight="700" fill="#15803d">token stream</text>
  <!-- ===== latency budget bars, log scale from 1 ms ===== -->
  <text x="652" y="28.5" font-size="13.5" font-weight="700" fill="#64748b">latency budget</text>
  <line x1="652" y1="52" x2="652" y2="380" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="652" y="88.0" width="30.0" height="16" rx="1" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="690.0" y="101.0" font-size="14.5" font-weight="700" fill="#334155">&lt; 10 ms</text>
  <rect x="652" y="197.0" width="51.0" height="16" rx="1" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="711.0" y="210.0" font-size="14.5" font-weight="700" fill="#334155">&lt; 50 ms</text>
  <rect x="652" y="317.0" width="99.0" height="16" rx="1" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="759.0" y="330.0" font-size="14.5" font-weight="700" fill="#334155">&lt; 2 s</text>
  <text x="652" y="400" font-size="13.5" font-style="italic" fill="#475569">bar ∝ log budget</text>
  </g>
</svg>
