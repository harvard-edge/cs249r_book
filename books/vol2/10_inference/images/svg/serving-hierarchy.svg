<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 580" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-down" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-up" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .tier-title { font-size: 11px; font-weight: 700; }
    .tier-sub { font-size: 8.5px; fill: #475569; }
    .sla-txt { font-size: 8.5px; font-weight: 700; fill: #be123c; }
    .node-title { font-size: 8.5px; font-weight: 700; fill: #0f172a; }
    .node-sub { font-size: 7.5px; fill: #64748b; }
    .flow-lbl { font-size: 8px; font-weight: 600; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- TIER 1: CDN / EDGE CACHE                                               -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="680" height="120" rx="4" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
    
    <!-- Title badge -->
    <rect x="16" y="14" width="160" height="20" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
    <text x="96" y="28" text-anchor="middle" class="tier-title" fill="#14294E">Tier 1: CDN / Edge Cache</text>
    <text x="186" y="28" class="tier-sub">Geographic PoP termination, static response cache, prompt templates</text>

    <!-- SLA Badge -->
    <rect x="580" y="14" width="84" height="20" rx="2" fill="#ffe4e6" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="622" y="28" text-anchor="middle" class="sla-txt">SLA: &lt; 10 ms</text>

    <!-- PoP Nodes -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="125" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="8" width="40" height="14" rx="2" fill="#1F407A"/>
      <text x="28" y="18" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">EDGE</text>
      <text x="54" y="19" class="node-title">Edge PoP 1</text>
      <text x="8" y="34" class="node-sub">• Regional TLS termination</text>
      <text x="8" y="45" class="node-sub">• Response cache hit</text>

      <rect x="145" y="0" width="125" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="153" y="8" width="40" height="14" rx="2" fill="#1F407A"/>
      <text x="173" y="18" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">EDGE</text>
      <text x="199" y="19" class="node-title">Edge PoP 2</text>
      <text x="153" y="34" class="node-sub">• Regional TLS termination</text>
      <text x="153" y="45" class="node-sub">• Response cache hit</text>

      <rect x="290" y="0" width="125" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="298" y="8" width="40" height="14" rx="2" fill="#1F407A"/>
      <text x="318" y="18" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">EDGE</text>
      <text x="344" y="19" class="node-title">Edge PoP 3</text>
      <text x="298" y="34" class="node-sub">• Regional TLS termination</text>
      <text x="298" y="45" class="node-sub">• Response cache hit</text>

      <text x="438" y="32" font-size="14" font-weight="700" fill="#94a3b8">···</text>

      <rect x="470" y="0" width="178" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="480" y="19" class="node-title">Prompt Template Cache</text>
      <text x="480" y="34" class="node-sub">• Prefix KV hash matching</text>
      <text x="480" y="45" class="node-sub">• Client geo-affinity steering</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- ROUTING ARROWS: TIER 1 <-> TIER 2                                      -->
  <!-- ====================================================================== -->
  <!-- Request (Down) -->
  <path d="M 300,145 L 300,185" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-down)"/>
  <text x="292" y="168" text-anchor="end" class="flow-lbl" fill="#475569">Cache Miss (Request)</text>

  <!-- Response (Up) -->
  <path d="M 440,185 L 440,145" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-up)"/>
  <text x="448" y="168" text-anchor="start" class="flow-lbl" fill="#15803d">Streamed Response</text>

  <!-- ====================================================================== -->
  <!-- TIER 2: GATEWAY / ROUTER                                               -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 185)">
    <rect x="0" y="0" width="680" height="130" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
    
    <!-- Title badge -->
    <rect x="16" y="14" width="160" height="20" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="0.8"/>
    <text x="96" y="28" text-anchor="middle" class="tier-title" fill="#b45309">Tier 2: Gateway / Router</text>
    <text x="186" y="28" class="tier-sub">Request routing, rate limiting, authentication, tenant SLO classification</text>

    <!-- SLA Badge -->
    <rect x="580" y="14" width="84" height="20" rx="2" fill="#ffe4e6" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="622" y="28" text-anchor="middle" class="sla-txt">SLA: &lt; 50 ms</text>

    <!-- Gateway Components -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="150" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="8" width="50" height="14" rx="2" fill="#d97706"/>
      <text x="33" y="18" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">POLICY</text>
      <text x="64" y="19" class="node-title">Rate Limiter</text>
      <text x="8" y="34" class="node-sub">• Token bucket per tenant</text>
      <text x="8" y="45" class="node-sub">• Concurrency bounds</text>
      <text x="8" y="56" class="node-sub">• Shedding &amp; 429 throttling</text>

      <rect x="165" y="0" width="150" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="173" y="8" width="46" height="14" rx="2" fill="#d97706"/>
      <text x="196" y="18" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">AUTH</text>
      <text x="225" y="19" class="node-title">API Key &amp; Auth</text>
      <text x="173" y="34" class="node-sub">• JWT / HMAC verification</text>
      <text x="173" y="45" class="node-sub">• Quota validation</text>
      <text x="173" y="56" class="node-sub">• Priority tier tagging</text>

      <rect x="330" y="0" width="160" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="338" y="8" width="50" height="14" rx="2" fill="#d97706"/>
      <text x="363" y="18" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">ROUTER</text>
      <text x="394" y="19" class="node-title">Model Router</text>
      <text x="338" y="34" class="node-sub">• Prefix-cache-aware routing</text>
      <text x="338" y="45" class="node-sub">• Model &amp; LoRA dispatch</text>
      <text x="338" y="56" class="node-sub">• Least-loaded worker select</text>

      <rect x="505" y="0" width="143" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="513" y="8" width="38" height="14" rx="2" fill="#64748b"/>
      <text x="532" y="18" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">OBS</text>
      <text x="557" y="19" class="node-title">Telemetry</text>
      <text x="513" y="34" class="node-sub">• Distributed tracing</text>
      <text x="513" y="45" class="node-sub">• TTFT / TPOT timers</text>
      <text x="513" y="56" class="node-sub">• Prometheus metrics</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- ROUTING ARROWS: TIER 2 <-> TIER 3                                      -->
  <!-- ====================================================================== -->
  <!-- Request (Down) -->
  <path d="M 300,315 L 300,355" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-down)"/>
  <text x="292" y="338" text-anchor="end" class="flow-lbl" fill="#475569">Dispatched Request</text>

  <!-- Response (Up) -->
  <path d="M 440,355 L 440,315" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-up)"/>
  <text x="448" y="338" text-anchor="start" class="flow-lbl" fill="#15803d">Token Stream (SSE / gRPC)</text>

  <!-- ====================================================================== -->
  <!-- TIER 3: MODEL SERVING CLUSTER                                          -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 355)">
    <rect x="0" y="0" width="680" height="165" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    
    <!-- Title badge -->
    <rect x="16" y="14" width="180" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="106" y="28" text-anchor="middle" class="tier-title" fill="#15803d">Tier 3: Model Serving Cluster</text>
    <text x="206" y="28" class="tier-sub">GPU worker fleet, iteration-level continuous batching, disaggregated prefill/decode</text>

    <!-- SLA Badge -->
    <rect x="580" y="14" width="84" height="20" rx="2" fill="#ffe4e6" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="622" y="28" text-anchor="middle" class="sla-txt">SLA: &lt; 2 s</text>

    <!-- GPU Workers and Autoscaler -->
    <g transform="translate(16, 46)">
      <!-- Worker 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="118" height="100" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="59" y="17" text-anchor="middle" class="node-title">GPU Worker 1</text>
        <rect x="8" y="25" width="102" height="30" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="59" y="38" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">Prefill Engine</text>
        <text x="59" y="49" text-anchor="middle" font-size="7" fill="#1F407A">Compute-Bound (SXM5)</text>

        <rect x="8" y="60" width="102" height="30" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="0.8"/>
        <text x="59" y="73" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Decode Engine</text>
        <text x="59" y="84" text-anchor="middle" font-size="7" fill="#16a34a">Memory-Bound (HBM3)</text>
      </g>

      <!-- Worker 2 -->
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="118" height="100" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="59" y="17" text-anchor="middle" class="node-title">GPU Worker 2</text>
        <rect x="8" y="25" width="102" height="30" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="59" y="38" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">Prefill Engine</text>
        <text x="59" y="49" text-anchor="middle" font-size="7" fill="#1F407A">Compute-Bound (SXM5)</text>

        <rect x="8" y="60" width="102" height="30" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="0.8"/>
        <text x="59" y="73" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Decode Engine</text>
        <text x="59" y="84" text-anchor="middle" font-size="7" fill="#16a34a">Memory-Bound (HBM3)</text>
      </g>

      <!-- Worker 3 -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="118" height="100" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="59" y="17" text-anchor="middle" class="node-title">GPU Worker 3</text>
        <rect x="8" y="25" width="102" height="30" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="59" y="38" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">Prefill Engine</text>
        <text x="59" y="49" text-anchor="middle" font-size="7" fill="#1F407A">Compute-Bound (SXM5)</text>

        <rect x="8" y="60" width="102" height="30" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="0.8"/>
        <text x="59" y="73" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Decode Engine</text>
        <text x="59" y="84" text-anchor="middle" font-size="7" fill="#16a34a">Memory-Bound (HBM3)</text>
      </g>

      <text x="395" y="55" font-size="14" font-weight="700" fill="#94a3b8">···</text>

      <!-- Horizontal Cluster Autoscaler Card -->
      <g transform="translate(425, 0)">
        <rect x="0" y="0" width="223" height="100" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,2"/>
        <rect x="8" y="8" width="80" height="16" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
        <text x="48" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">AUTOSCALER</text>
        <text x="96" y="20" class="node-title">Fleet Elasticity</text>
        <text x="8" y="38" class="node-sub">• Queue depth &amp; token-rate monitoring</text>
        <text x="8" y="51" class="node-sub">• Target utilization: ρ ≤ 0.70 headroom</text>
        <text x="8" y="64" class="node-sub">• Dynamic spot / on-demand node pools</text>
        <text x="8" y="77" class="node-sub">• Proactive warm pool prevents ~60s cold start</text>
        <text x="8" y="90" font-size="7.5" font-weight="700" fill="#15803d">Metric: Active Requests / KV Block Occupancy</text>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- FOOTER                                                                 -->
  <!-- ====================================================================== -->
  <text x="370" y="550" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    Each tier scales horizontally; cumulative latency budget consumed progressively down the stack from edge to GPU cluster.
  </text>
</svg>