<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .card-title { font-size: 9.5px; font-weight: 700; fill: #0f172a; }
    .card-sub { font-size: 7.5px; fill: #475569; }
    .badge-txt { font-size: 7.5px; font-weight: 700; fill: #ffffff; }
    .flow-lbl { font-size: 8px; font-weight: 600; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- INGRESS & LOAD BALANCER                                                -->
  <!-- ====================================================================== -->
  <!-- Request Card -->
  <g transform="translate(18, 140)">
    <rect x="0" y="0" width="70" height="52" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="6" y="6" width="58" height="16" rx="2" fill="#e2e8f0"/>
    <text x="35" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Request</text>
    <text x="35" y="34" text-anchor="middle" font-size="7.5" fill="#64748b">Tokens</text>
    <text x="35" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">(Prompt / Gen)</text>
  </g>

  <!-- Arrow Request -> LB -->
  <path d="M 88,166 L 108,166" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Load Balancer Card -->
  <g transform="translate(110, 134)">
    <rect x="0" y="0" width="95" height="64" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <rect x="8" y="8" width="79" height="16" rx="2" fill="#fde68a"/>
    <text x="47.5" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Load Balancer</text>
    <text x="47.5" y="38" text-anchor="middle" font-size="7.5" fill="#78350f">• Selects Shards</text>
    <text x="47.5" y="50" text-anchor="middle" font-size="7.5" fill="#78350f">• TP load router</text>
  </g>

  <!-- Arrow LB -> Broadcast Spine -->
  <path d="M 205,166 L 265,166" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="235" y="158" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">Broadcast</text>

  <!-- ====================================================================== -->
  <!-- TENSOR PARALLEL SHARD GROUP (INTRA-NODE NVLINK DOMAIN)                 -->
  <!-- ====================================================================== -->
  <g transform="translate(265, 25)">
    <!-- Container Card -->
    <rect x="0" y="0" width="470" height="280" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Container Banner -->
    <rect x="12" y="10" width="225" height="18" rx="2" fill="#e2e8f0"/>
    <text x="124.5" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">TP Shard Group (TP = 4, Intra-Node NVLink)</text>

    <!-- Broadcast Spine Distribution Line -->
    <path d="M 12,141 L 30,141 L 30,48 L 48,48" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 30,110 L 48,110" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 30,172 L 48,172" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <path d="M 30,141 L 30,234 L 48,234" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- GPU Shards (4 GPUs) -->
    <!-- GPU 0 -->
    <g transform="translate(50, 24)">
      <rect x="0" y="0" width="165" height="48" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <rect x="6" y="6" width="38" height="14" rx="2" fill="#0284c7"/>
      <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 0</text>
      <text x="50" y="17" class="card-title">Heads 0–7 / QKV Split</text>
      <text x="8" y="32" class="card-sub">• Partial attention GEMM (W_q, W_k, W_v)</text>
      <text x="8" y="42" class="card-sub">• Output projection slice (W_o column)</text>
    </g>

    <!-- GPU 1 -->
    <g transform="translate(50, 86)">
      <rect x="0" y="0" width="165" height="48" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <rect x="6" y="6" width="38" height="14" rx="2" fill="#0284c7"/>
      <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 1</text>
      <text x="50" y="17" class="card-title">Heads 8–15 / QKV Split</text>
      <text x="8" y="32" class="card-sub">• Partial attention GEMM (W_q, W_k, W_v)</text>
      <text x="8" y="42" class="card-sub">• Output projection slice (W_o column)</text>
    </g>

    <!-- GPU 2 -->
    <g transform="translate(50, 148)">
      <rect x="0" y="0" width="165" height="48" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <rect x="6" y="6" width="38" height="14" rx="2" fill="#0284c7"/>
      <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 2</text>
      <text x="50" y="17" class="card-title">Heads 16–23 / QKV Split</text>
      <text x="8" y="32" class="card-sub">• Partial attention GEMM (W_q, W_k, W_v)</text>
      <text x="8" y="42" class="card-sub">• Output projection slice (W_o column)</text>
    </g>

    <!-- GPU 3 -->
    <g transform="translate(50, 210)">
      <rect x="0" y="0" width="165" height="48" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <rect x="6" y="6" width="38" height="14" rx="2" fill="#0284c7"/>
      <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 3</text>
      <text x="50" y="17" class="card-title">Heads 24–31 / QKV Split</text>
      <text x="8" y="32" class="card-sub">• Partial attention GEMM (W_q, W_k, W_v)</text>
      <text x="8" y="42" class="card-sub">• Output projection slice (W_o column)</text>
    </g>

    <!-- Funnel arrows from GPUs to AllReduce -->
    <path d="M 215,48 L 245,48 L 245,130 L 268,130" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 215,110 L 235,110 L 235,135 L 268,135" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 215,172 L 235,172 L 235,147 L 268,147" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <path d="M 215,234 L 245,234 L 245,152 L 268,152" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- AllReduce Collective Card -->
    <g transform="translate(270, 105)">
      <rect x="0" y="0" width="185" height="72" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="8" y="8" width="66" height="16" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="41" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">ALLREDUCE</text>
      <text x="80" y="20" class="card-title" fill="#15803d">Sum Synchronization</text>

      <text x="8" y="36" class="card-sub">• Combines partial head activations</text>
      <text x="8" y="48" class="card-sub">• Ring-AllReduce / NVLink Tree</text>
      <text x="8" y="60" class="card-sub" font-weight="600" fill="#16a34a">• 2× AllReduce per Transformer Block</text>
    </g>
  </g>

  <!-- Output from AllReduce -> Next Layer / Response -->
  <path d="M 630,205 L 630,320 L 515,320" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Synchronized Response Card -->
  <g transform="translate(370, 305)">
    <rect x="0" y="0" width="140" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="70" y="16" text-anchor="middle" class="card-title" fill="#15803d">Full Layer Output</text>
    <text x="70" y="27" text-anchor="middle" font-size="7.5" fill="#16a34a">Synchronized hidden state</text>
  </g>

  <!-- ====================================================================== -->
  <!-- TECHNICAL CALLOUT CARDS (BOTTOM)                                       -->
  <!-- ====================================================================== -->
  <!-- Interconnect Bandwidth Constraint -->
  <g transform="translate(25, 355)">
    <rect x="0" y="0" width="340" height="68" rx="3" fill="#fff1f2" stroke="#f43f5e" stroke-width="1"/>
    <rect x="10" y="8" width="135" height="16" rx="2" fill="#ffe4e6"/>
    <text x="77.5" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#be123c">INTERCONNECT CONSTRAINT</text>
    <text x="10" y="38" class="card-sub">• <tspan font-weight="700">Strictly Intra-Node:</tspan> TP requires ultra-high bandwidth (NVLink 900 GB/s).</text>
    <text x="10" y="50" class="card-sub">• PCIe (64 GB/s) or inter-node Ethernet throttles GEMM to communication stalls.</text>
    <text x="10" y="62" class="card-sub">• Practical limit: TP = 8 (single 8-GPU SXM5 chassis).</text>
  </g>

  <!-- Execution Dynamics -->
  <g transform="translate(385, 355)">
    <rect x="0" y="0" width="350" height="68" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="10" y="8" width="125" height="16" rx="2" fill="#e2e8f0"/>
    <text x="72.5" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">LATENCY CHARACTERISTICS</text>
    <text x="10" y="38" class="card-sub">• <tspan font-weight="700">Latency Reduction:</tspan> Slices weight matrices by TP factor; cuts FLOP/GPU.</text>
    <text x="10" y="50" class="card-sub">• Communication overhead scales with activation tensor size (B × S × H).</text>
    <text x="10" y="62" class="card-sub">• Essential for low-latency interactive serving (TTFT &amp; TPOT SLOs).</text>
  </g>

  <!-- ====================================================================== -->
  <!-- FOOTER                                                                 -->
  <!-- ====================================================================== -->
  <text x="380" y="450" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    Tensor parallelism partitions model weights across intra-node GPUs; partial activations are synchronized via high-speed NVLink AllReduce.
  </text>
</svg>
