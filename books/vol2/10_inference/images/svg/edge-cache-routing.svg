<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 485" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
    <marker id="arr-rose" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#e11d48"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 7px; font-weight: 700; fill: #ffffff; }
    .node-title { font-size: 8px; font-weight: 700; fill: #0f172a; }
    .node-sub { font-size: 7px; fill: #475569; }
    .tbl-hdr { font-size: 7.2px; font-weight: 700; fill: #334155; }
    .tbl-cell { font-size: 7px; fill: #1e293b; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- MAIN ARCHITECTURE & DATA FLOWS                                         -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 20)">
    <!-- ── COLUMN 1: ARCHITECTURAL HIERARCHY (LEFT) ── -->
    <g transform="translate(0, 0)">
      <!-- Node 1: User / Client -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="130" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="8" y="6" width="70" height="15" rx="2" fill="#e2e8f0"/>
        <text x="43" y="16.5" text-anchor="middle" class="tbl-hdr">USER CLIENT</text>
        <text x="65" y="34" text-anchor="middle" class="node-sub">Web / Mobile / API App</text>
      </g>

      <!-- Flow User <-> Edge Cache (Query down, Hit Return up) -->
      <!-- Query Arrow (Down) -->
      <path d="M 45,46 L 45,78" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <text x="36" y="66" text-anchor="end" font-size="6.8" fill="#64748b">Query</text>

      <!-- Hit Return Arrow (Up) -->
      <path d="M 85,78 L 85,48" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
      <text x="94" y="66" text-anchor="start" font-size="6.8" font-weight="700" fill="#16a34a">Hit &lt;10ms</text>

      <!-- Node 2: Edge PoP Cache Node -->
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="130" height="66" rx="4" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
        <rect x="8" y="6" width="85" height="15" rx="2" fill="#1F407A"/>
        <text x="50.5" y="16.5" text-anchor="middle" class="badge-txt">EDGE POP CACHE</text>
        <text x="65" y="34" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">CDN Edge Server</text>
        <text x="65" y="46" text-anchor="middle" class="node-sub">Prefix / Prompt Cache</text>
        <text x="65" y="56" text-anchor="middle" font-size="6.5" font-weight="600" fill="#1F407A">Local RAM / NVMe</text>
      </g>

      <!-- Arrow Edge Cache -> Regional Gateway (Miss Only) -->
      <path d="M 65,146 L 65,188" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-rose)"/>
      <text x="73" y="171" font-size="6.8" font-weight="600" fill="#e11d48">Miss</text>

      <!-- Node 3: Regional Gateway / Proxy -->
      <g transform="translate(0, 190)">
        <rect x="0" y="0" width="130" height="52" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <rect x="8" y="6" width="100" height="15" rx="2" fill="#fde68a"/>
        <text x="58" y="16.5" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">REGIONAL GATEWAY</text>
        <text x="65" y="34" text-anchor="middle" class="node-sub">Auth · Rate Limit</text>
        <text x="65" y="44" text-anchor="middle" class="node-sub">Cluster Load Balancer</text>
      </g>

      <!-- Arrow Regional Gateway -> Central GPU Cluster -->
      <path d="M 65,242 L 65,278" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-rose)"/>
      <text x="73" y="264" font-size="6.8" font-weight="600" fill="#e11d48">Forward</text>

      <!-- Node 4: Central Inference Cluster -->
      <g transform="translate(0, 280)">
        <rect x="0" y="0" width="130" height="66" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="8" y="6" width="105" height="15" rx="2" fill="#e2e8f0"/>
        <text x="60.5" y="16.5" text-anchor="middle" font-size="7" font-weight="700" fill="#334155">CENTRAL GPU CLUSTER</text>
        <text x="65" y="34" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f172a">vLLM / TensorRT-LLM</text>
        <text x="65" y="46" text-anchor="middle" class="node-sub">Full Prefill + Decode</text>
        <text x="65" y="56" text-anchor="middle" font-size="6.5" font-weight="600" fill="#16a34a">Generates Tokens</text>
      </g>
    </g>

    <!-- ── COLUMN 2: EXECUTION PATH ANALYSIS (MIDDLE) ── -->
    <g transform="translate(155, 20)">
      <!-- ── PATH A: CACHE HIT ── -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="270" height="120" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        
        <rect x="10" y="8" width="85" height="16" rx="2" fill="#16a34a"/>
        <text x="52.5" y="19" text-anchor="middle" class="badge-txt">PATH A: CACHE HIT</text>
        <text x="105" y="20" font-size="7.5" font-weight="700" fill="#15803d">Zero GPU Execution</text>

        <!-- Hit details -->
        <g transform="translate(10, 32)">
          <text x="0" y="10" font-size="7.2" fill="#166534"><tspan font-weight="700">Immediate Return:</tspan><tspan dx="4">Query matches cached prompt key.</tspan></text>
          <text x="0" y="22" font-size="7.2" fill="#166534"><tspan font-weight="700">Edge Local Response:</tspan><tspan dx="4">Returned directly from PoP memory.</tspan></text>
          <text x="0" y="34" font-size="7.2" fill="#166534"><tspan font-weight="700">Backend Bypass:</tspan><tspan dx="4">0 FLOPs consumed; zero GPU latency.</tspan></text>
        </g>

        <!-- Hit Latency Badge -->
        <g transform="translate(10, 80)">
          <rect x="0" y="0" width="250" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
          <text x="125" y="13" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">End-to-End Latency: &lt; 10 ms</text>
          <text x="125" y="23" text-anchor="middle" font-size="6.8" fill="#166534">Cost: $0.00 GPU Compute · 99% Latency Reduction</text>
        </g>
      </g>

      <!-- ── PATH B: CACHE MISS ── -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="270" height="135" rx="4" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
        
        <rect x="10" y="8" width="95" height="16" rx="2" fill="#e11d48"/>
        <text x="57.5" y="19" text-anchor="middle" class="badge-txt">PATH B: CACHE MISS</text>
        <text x="115" y="20" font-size="7.5" font-weight="700" fill="#be123c">Full Cluster Forward</text>

        <!-- Miss details -->
        <g transform="translate(10, 32)">
          <text x="0" y="10" font-size="7.2" fill="#9f1239"><tspan font-weight="700">Cluster Traversal:</tspan><tspan dx="4">Miss forwards through gateway to GPUs.</tspan></text>
          <text x="0" y="22" font-size="7.2" fill="#9f1239"><tspan font-weight="700">Full Execution:</tspan><tspan dx="4">TensorRT-LLM runs prefill + token decode.</tspan></text>
          <text x="0" y="34" font-size="7.2" fill="#9f1239"><tspan font-weight="700">Async Hydration:</tspan><tspan dx="4">Output streamed to user &amp; PoP store.</tspan></text>
        </g>

        <!-- Miss Latency Badge -->
        <g transform="translate(10, 80)">
          <rect x="0" y="0" width="250" height="42" rx="2" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/>
          <text x="125" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#be123c">End-to-End Latency: Full Model RTT</text>
          <text x="125" y="26" text-anchor="middle" font-size="6.8" fill="#9f1239">TTFT (150–350 ms) + Generation (20–40 ms/tok)</text>
          <text x="125" y="36" text-anchor="middle" font-size="6.5" font-weight="600" fill="#e11d48">Stores generated tokens into PoP cache upon completion</text>
        </g>
      </g>
    </g>

    <!-- ── COLUMN 3: WORKLOAD BENCHMARK TABLE (RIGHT) ── -->
    <g transform="translate(450, 20)">
      <rect x="0" y="0" width="260" height="255" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Table Header -->
      <rect x="12" y="10" width="135" height="16" rx="2" fill="#e2e8f0"/>
      <text x="79.5" y="21" text-anchor="middle" class="tbl-hdr">WORKLOAD CACHE HIT RATES</text>

      <!-- Table Column Titles -->
      <g transform="translate(12, 36)">
        <text x="5" y="10" font-size="7" font-weight="700" fill="#475569">Workload Archetype</text>
        <text x="135" y="10" font-size="7" font-weight="700" fill="#475569">Hit Rate</text>
        <text x="195" y="10" font-size="7" font-weight="700" fill="#475569">Viability</text>
        <line x1="0" y1="16" x2="236" y2="16" stroke="#cbd5e1" stroke-width="0.8"/>
      </g>

      <!-- Row 1: Code Completion / Autocomplete -->
      <g transform="translate(12, 58)">
        <text x="5" y="11" class="tbl-cell" font-weight="600">Code Autocomplete</text>
        <text x="135" y="11" font-size="7.2" font-weight="700" fill="#15803d">65–85%</text>
        <rect x="188" y="1" width="48" height="14" rx="2" fill="#dcfce7"/>
        <text x="212" y="10.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">Optimal</text>
        <line x1="0" y1="18" x2="236" y2="18" stroke="#e2e8f0" stroke-width="0.6"/>
      </g>

      <!-- Row 2: Customer Support FAQ -->
      <g transform="translate(12, 82)">
        <text x="5" y="11" class="tbl-cell" font-weight="600">Customer Support FAQ</text>
        <text x="135" y="11" font-size="7.2" font-weight="700" fill="#15803d">45–65%</text>
        <rect x="188" y="1" width="48" height="14" rx="2" fill="#dcfce7"/>
        <text x="212" y="10.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">High</text>
        <line x1="0" y1="18" x2="236" y2="18" stroke="#e2e8f0" stroke-width="0.6"/>
      </g>

      <!-- Row 3: Structured Extraction -->
      <g transform="translate(12, 106)">
        <text x="5" y="11" class="tbl-cell" font-weight="600">Doc Entity Extraction</text>
        <text x="135" y="11" font-size="7.2" font-weight="700" fill="#b45309">25–45%</text>
        <rect x="188" y="1" width="48" height="14" rx="2" fill="#fef3c7"/>
        <text x="212" y="10.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309">Medium</text>
        <line x1="0" y1="18" x2="236" y2="18" stroke="#e2e8f0" stroke-width="0.6"/>
      </g>

      <!-- Row 4: Open-Ended Chat -->
      <g transform="translate(12, 130)">
        <text x="5" y="11" class="tbl-cell" font-weight="600">Open-Ended Generation</text>
        <text x="135" y="11" font-size="7.2" font-weight="700" fill="#be123c">5–15%</text>
        <rect x="188" y="1" width="48" height="14" rx="2" fill="#ffe4e6"/>
        <text x="212" y="10.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#be123c">Low</text>
        <line x1="0" y1="18" x2="236" y2="18" stroke="#e2e8f0" stroke-width="0.6"/>
      </g>

      <!-- Semantic Caching Callout Inside Table Card -->
      <g transform="translate(12, 160)">
        <rect x="0" y="0" width="236" height="82" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="10" y="14" font-size="7" font-weight="700" fill="#14294E">Semantic Caching Enhancement</text>
        <text x="10" y="27" font-size="6.8" fill="#475569"><tspan font-weight="600" fill="#334155">Vector Match:</tspan><tspan dx="4">Cosine ≥ 0.96 catches paraphrases</tspan></text>
        <text x="10" y="40" font-size="6.8" fill="#475569"><tspan font-weight="600" fill="#334155">Chat Hit Rate:</tspan><tspan dx="4">2–3× gain (up to ~35% hit rate)</tspan></text>
        <text x="10" y="53" font-size="6.8" fill="#64748b"><tspan font-weight="600" fill="#475569">Overhead:</tspan><tspan dx="4">+2–4 ms embedding vector lookup</tspan></text>
        <text x="10" y="68" font-size="6.8" font-weight="600" fill="#1F407A">Requires Milvus / Qdrant edge index</text>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- BOTTOM SECTION: ARCHITECTURAL PRINCIPLE CALLOUT CARD                   -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 395)">
    <rect x="0" y="0" width="710" height="74" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="8" width="190" height="16" rx="2" fill="#e2e8f0"/>
    <text x="107" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">CACHE HYDRATION &amp; PREFIX ARCHITECTURE</text>

    <text x="12" y="38" font-size="7.5" fill="#334155">
      <tspan font-weight="700" fill="#15803d">Exact vs. Prefix:</tspan><tspan dx="4">Exact prompt hashing yields high hit rates on repetitive tasks; prefix caching saves prefill on shared context.</tspan>
    </text>
    <text x="12" y="52" font-size="7.5" fill="#334155">
      <tspan font-weight="700" fill="#14294E">Async Hydration:</tspan><tspan dx="4">Central inference streams tokens to client while populating edge PoP key-value store in background.</tspan>
    </text>
    <text x="12" y="66" font-size="7.5" fill="#334155">
      <tspan font-weight="700" fill="#be123c">Eviction &amp; TTL:</tspan><tspan dx="4">Sliding window LRU with bounded TTL ensures stale system prompt updates are automatically purged.</tspan>
    </text>
  </g>
</svg>