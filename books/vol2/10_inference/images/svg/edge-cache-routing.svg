<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="242" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
  <!-- ===== Request path ===== -->
  <rect x="15" y="96" width="130" height="58" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="80" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">User</text>
  <text x="80" y="139" text-anchor="middle" font-size="12" fill="#475569">web, app, API</text>
  <rect x="195" y="96" width="130" height="58" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="260" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Edge PoP</text>
  <text x="260" y="139" text-anchor="middle" font-size="12" fill="#475569">response cache</text>
  <rect x="375" y="96" width="130" height="58" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="440" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Regional gateway</text>
  <text x="440" y="139" text-anchor="middle" font-size="12" fill="#475569">auth, rate limit</text>
  <rect x="555" y="96" width="130" height="58" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="620" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU cluster</text>
  <text x="620" y="139" text-anchor="middle" font-size="12" fill="#475569">prefill + decode</text>
  <path d="M 145,116 H 193" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <text x="170" y="109" text-anchor="middle" font-size="12" fill="#475569">query</text>
  <path d="M 325,116 H 373" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <text x="350" y="109" text-anchor="middle" font-size="12" fill="#475569">miss</text>
  <path d="M 505,116 H 553" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <text x="530" y="109" text-anchor="middle" font-size="12" fill="#475569">forward</text>
  <!-- ===== Path A: cache hit ===== -->
  <path d="M 260.0,96 V 48 H 80.0 V 94" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <text x="170" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">cache hit: returned from edge, &lt; 10 ms</text>
  <!-- ===== Path B: cache miss return ===== -->
  <path d="M 620.0,154 V 206 H 80.0 V 156" fill="none" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="350" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">cache miss: generated tokens stream back</text>
  <!-- ===== Hydration into edge cache ===== -->
  <path d="M 260.0,206 V 156" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="268" y="184" text-anchor="start" font-size="12" fill="#166534">store response</text>
  <circle cx="260.0" cy="206" r="3" fill="#1F407A"/>
</svg>
