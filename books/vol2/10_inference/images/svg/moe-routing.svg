<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== token batch: t1 is the traced token ===== -->
  <text x="55" y="80" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">tokens</text>
  <rect x="20" y="90" width="70" height="156" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="30" y="104" width="50" height="26" rx="2" fill="#1F407A" stroke="#1F407A" stroke-width="1.2"/>
  <text x="55" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">t1</text>
  <rect x="30" y="138" width="50" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="55" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">t2</text>
  <rect x="30" y="172" width="50" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="55" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">t3</text>
  <rect x="30" y="206" width="50" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="55" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">t4</text>
  <path d="M90,168 H118" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== gate ===== -->
  <rect x="120" y="138" width="100" height="60" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="170" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Gate</text>
  <text x="170" y="181" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">selects top 2</text>

  <!-- ===== AllToAll dispatch: bold = path of t1 ===== -->
  <text x="250" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">AllToAll dispatch</text>
  <path d="M220,168 H250 M250,85 V168" fill="none" stroke="#d97706" stroke-width="2"/>
  <path d="M250,168 V251" fill="none" stroke="#d97706" stroke-width="1"/>
  <path d="M250,85 H278" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <path d="M250,168 H278" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <path d="M250,251 H278" fill="none" stroke="#d97706" stroke-width="1" marker-end="url(#arr-amber)"/>

  <!-- ===== experts, one per device, with the tokens each receives ===== -->
  <rect x="280" y="50" width="210" height="70" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="294" y="81" text-anchor="start" font-size="14" font-weight="700" fill="#14294E">Expert A</text>
  <text x="294" y="98" text-anchor="start" font-size="13" font-weight="400" fill="#475569">device 0</text>
  <rect x="386" y="74" width="28" height="22" rx="2" fill="#1F407A" stroke="#1F407A" stroke-width="1"/>
  <text x="400" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">t1</text>
  <rect x="420" y="74" width="28" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="434" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">t2</text>

  <rect x="280" y="133" width="210" height="70" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="294" y="164" text-anchor="start" font-size="14" font-weight="700" fill="#14294E">Expert B</text>
  <text x="294" y="181" text-anchor="start" font-size="13" font-weight="400" fill="#475569">device 1</text>
  <rect x="386" y="157" width="28" height="22" rx="2" fill="#1F407A" stroke="#1F407A" stroke-width="1"/>
  <text x="400" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">t1</text>
  <rect x="420" y="157" width="28" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="434" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">t3</text>
  <rect x="454" y="157" width="28" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="468" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">t4</text>

  <rect x="280" y="216" width="210" height="70" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="294" y="247" text-anchor="start" font-size="14" font-weight="700" fill="#14294E">Expert C</text>
  <text x="294" y="264" text-anchor="start" font-size="13" font-weight="400" fill="#475569">device 2</text>
  <rect x="386" y="240" width="28" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">t2</text>
  <rect x="420" y="240" width="28" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="434" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">t3</text>
  <rect x="454" y="240" width="28" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="468" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">t4</text>

  <!-- ===== AllToAll gather ===== -->
  <text x="520" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">AllToAll gather</text>
  <path d="M490,85 H520 V168 M490,168 H520" fill="none" stroke="#d97706" stroke-width="2"/>
  <path d="M490,251 H520 V168" fill="none" stroke="#d97706" stroke-width="1"/>
  <path d="M520,168 H538" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- ===== recombination ===== -->
  <rect x="540" y="138" width="110" height="60" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="595" y="164" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14294E">Weighted sum</text>
  <text x="595" y="181" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">gate weights</text>
  <path d="M650,168 H668" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="670" y="143" width="70" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="705" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Output</text>
</svg>
