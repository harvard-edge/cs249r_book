<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
    <pattern id="bubble-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#fca5a5" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .panel-title { font-size: 11px; font-weight: 700; fill: #0f172a; }
    .panel-sub { font-size: 8.5px; fill: #64748b; }
    .stage-title { font-size: 9px; font-weight: 700; fill: #14294E; }
    .stage-sub { font-size: 7px; fill: #64748b; }
    .badge-txt { font-size: 7.5px; font-weight: 700; fill: #ffffff; }
    .time-lbl { font-size: 8px; font-weight: 700; fill: #64748b; }
    .gpu-lbl { font-size: 8.5px; font-weight: 700; fill: #1F407A; }
    .cell-txt { font-size: 8px; font-weight: 600; fill: #14294E; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- PANEL (a): SINGLE REQUEST SEQUENTIAL FLOW                              -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="700" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="16" y="12" width="165" height="20" rx="2" fill="#e2e8f0"/>
    <text x="98.5" y="26" text-anchor="middle" class="panel-title">(a) Single Request Flow</text>
    <text x="190" y="26" class="panel-sub">Sequential propagation: P2P activation transfers across stages; latency equals sum of all stage times</text>

    <!-- Pipeline Stages Flow -->
    <g transform="translate(16, 50)">
      <!-- Request -->
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="60" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="30" y="22" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Request</text>
        <text x="30" y="34" text-anchor="middle" font-size="7.5" fill="#64748b">Tokens</text>
      </g>

      <!-- Arrow -> Stage 0 -->
      <path d="M 60,38 L 85,38" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <!-- Stage 0 -->
      <g transform="translate(87, 8)">
        <rect x="0" y="0" width="115" height="60" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
        <rect x="6" y="6" width="38" height="14" rx="2" fill="#1F407A"/>
        <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 0</text>
        <text x="48" y="17" class="stage-title">Stage 0</text>
        <text x="8" y="34" class="stage-sub"><tspan font-weight="600">Layers:</tspan><tspan dx="3">1–20 (Input + Blocks)</tspan></text>
        <text x="8" y="46" class="stage-sub"><tspan font-weight="600">State:</tspan><tspan dx="3">Weights + KV Cache</tspan></text>
      </g>

      <!-- Arrow -> Stage 1 -->
      <path d="M 202,38 L 227,38" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
      <text x="214.5" y="32" text-anchor="middle" font-size="7" font-weight="600" fill="#1F407A">Acts</text>

      <!-- Stage 1 -->
      <g transform="translate(229, 8)">
        <rect x="0" y="0" width="115" height="60" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
        <rect x="6" y="6" width="38" height="14" rx="2" fill="#1F407A"/>
        <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 1</text>
        <text x="48" y="17" class="stage-title">Stage 1</text>
        <text x="8" y="34" class="stage-sub"><tspan font-weight="600">Layers:</tspan><tspan dx="3">21–40 (Mid Blocks)</tspan></text>
        <text x="8" y="46" class="stage-sub"><tspan font-weight="600">State:</tspan><tspan dx="3">Weights + KV Cache</tspan></text>
      </g>

      <!-- Arrow -> Stage 2 -->
      <path d="M 344,38 L 369,38" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
      <text x="356.5" y="32" text-anchor="middle" font-size="7" font-weight="600" fill="#1F407A">Acts</text>

      <!-- Stage 2 -->
      <g transform="translate(371, 8)">
        <rect x="0" y="0" width="115" height="60" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
        <rect x="6" y="6" width="38" height="14" rx="2" fill="#1F407A"/>
        <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 2</text>
        <text x="48" y="17" class="stage-title">Stage 2</text>
        <text x="8" y="34" class="stage-sub"><tspan font-weight="600">Layers:</tspan><tspan dx="3">41–60 (Mid Blocks)</tspan></text>
        <text x="8" y="46" class="stage-sub"><tspan font-weight="600">State:</tspan><tspan dx="3">Weights + KV Cache</tspan></text>
      </g>

      <!-- Arrow -> Stage 3 -->
      <path d="M 486,38 L 511,38" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
      <text x="498.5" y="32" text-anchor="middle" font-size="7" font-weight="600" fill="#1F407A">Acts</text>

      <!-- Stage 3 -->
      <g transform="translate(513, 8)">
        <rect x="0" y="0" width="115" height="60" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
        <rect x="6" y="6" width="38" height="14" rx="2" fill="#1F407A"/>
        <text x="25" y="16" text-anchor="middle" class="badge-txt">GPU 3</text>
        <text x="48" y="17" class="stage-title">Stage 3</text>
        <text x="8" y="34" class="stage-sub"><tspan font-weight="600">Layers:</tspan><tspan dx="3">61–80 (Output + LM)</tspan></text>
        <text x="8" y="46" class="stage-sub"><tspan font-weight="600">State:</tspan><tspan dx="3">Weights + Vocab</tspan></text>
      </g>

      <!-- Arrow -> Response -->
      <path d="M 628,38 L 650,38" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Response -->
      <g transform="translate(652, 15)">
        <rect x="0" y="0" width="20" height="46" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="10" y="27" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Out</text>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- PANEL (b): CONCURRENT PIPELINED THROUGHPUT SCALING                     -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 190)">
    <rect x="0" y="0" width="700" height="235" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="16" y="12" width="195" height="20" rx="2" fill="#e2e8f0"/>
    <text x="113.5" y="26" text-anchor="middle" class="panel-title">(b) Pipelined Concurrency (P = 4)</text>
    <text x="220" y="26" class="panel-sub">Multiple requests overlap across pipeline stages; throughput scales 4× in steady state</text>

    <!-- Execution Timeline Matrix -->
    <!-- Columns: Time Slots t1..t6, width 75 each, x=80 -->
    <g transform="translate(85, 48)">
      <!-- Column Time Headers -->
      <g>
        <text x="37" y="10" text-anchor="middle" class="time-lbl">Slot t1</text>
        <text x="115" y="10" text-anchor="middle" class="time-lbl">Slot t2</text>
        <text x="193" y="10" text-anchor="middle" class="time-lbl">Slot t3</text>
        <text x="271" y="10" text-anchor="middle" class="time-lbl">Slot t4</text>
        <text x="349" y="10" text-anchor="middle" class="time-lbl">Slot t5</text>
        <text x="427" y="10" text-anchor="middle" class="time-lbl">Slot t6</text>
      </g>

      <!-- GPU 0 Row -->
      <g transform="translate(0, 18)">
        <text x="-16" y="16" text-anchor="end" class="gpu-lbl">GPU 0</text>
        <rect x="0" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="37.5" y="15" text-anchor="middle" class="cell-txt">Req 1</text>

        <rect x="78" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="115.5" y="15" text-anchor="middle" class="cell-txt">Req 2</text>

        <rect x="156" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="193.5" y="15" text-anchor="middle" class="cell-txt">Req 3</text>

        <rect x="234" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="271.5" y="15" text-anchor="middle" class="cell-txt">Req 4</text>

        <rect x="312" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="349.5" y="15" text-anchor="middle" class="cell-txt">Req 5</text>

        <rect x="390" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="427.5" y="15" text-anchor="middle" class="cell-txt">Req 6</text>
      </g>

      <!-- GPU 1 Row -->
      <g transform="translate(0, 46)">
        <text x="-16" y="16" text-anchor="end" class="gpu-lbl">GPU 1</text>
        <rect x="0" y="0" width="75" height="24" rx="2" fill="url(#bubble-hatch)" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="37.5" y="15" text-anchor="middle" font-size="7.5" fill="#be123c">Fill Bubble</text>

        <rect x="78" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="115.5" y="15" text-anchor="middle" class="cell-txt">Req 1</text>

        <rect x="156" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="193.5" y="15" text-anchor="middle" class="cell-txt">Req 2</text>

        <rect x="234" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="271.5" y="15" text-anchor="middle" class="cell-txt">Req 3</text>

        <rect x="312" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="349.5" y="15" text-anchor="middle" class="cell-txt">Req 4</text>

        <rect x="390" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="427.5" y="15" text-anchor="middle" class="cell-txt">Req 5</text>
      </g>

      <!-- GPU 2 Row -->
      <g transform="translate(0, 74)">
        <text x="-16" y="16" text-anchor="end" class="gpu-lbl">GPU 2</text>
        <rect x="0" y="0" width="75" height="24" rx="2" fill="url(#bubble-hatch)" stroke="#fca5a5" stroke-width="0.8"/>
        <rect x="78" y="0" width="75" height="24" rx="2" fill="url(#bubble-hatch)" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="76.5" y="15" text-anchor="middle" font-size="7.5" fill="#be123c">Fill Bubble</text>

        <rect x="156" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="193.5" y="15" text-anchor="middle" class="cell-txt">Req 1</text>

        <rect x="234" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="271.5" y="15" text-anchor="middle" class="cell-txt">Req 2</text>

        <rect x="312" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="349.5" y="15" text-anchor="middle" class="cell-txt">Req 3</text>

        <rect x="390" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="427.5" y="15" text-anchor="middle" class="cell-txt">Req 4</text>
      </g>

      <!-- GPU 3 Row -->
      <g transform="translate(0, 102)">
        <text x="-16" y="16" text-anchor="end" class="gpu-lbl">GPU 3</text>
        <rect x="0" y="0" width="75" height="24" rx="2" fill="url(#bubble-hatch)" stroke="#fca5a5" stroke-width="0.8"/>
        <rect x="78" y="0" width="75" height="24" rx="2" fill="url(#bubble-hatch)" stroke="#fca5a5" stroke-width="0.8"/>
        <rect x="156" y="0" width="75" height="24" rx="2" fill="url(#bubble-hatch)" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="115.5" y="15" text-anchor="middle" font-size="7.5" fill="#be123c">Fill Bubble</text>

        <rect x="234" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="271.5" y="15" text-anchor="middle" class="cell-txt">Req 1</text>

        <rect x="312" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="349.5" y="15" text-anchor="middle" class="cell-txt">Req 2</text>

        <rect x="390" y="0" width="75" height="24" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="0.8"/>
        <text x="427.5" y="15" text-anchor="middle" class="cell-txt">Req 3</text>
      </g>

      <!-- Steady State Vertical Barrier Line -->
      <line x1="233" y1="5" x2="233" y2="135" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
      <g>
        <rect x="175" y="-12" width="116" height="15" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
        <text x="233" y="-2" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Pipeline Full (Steady State)</text>
      </g>

      <!-- Throughput Gain Badge Card (Right) -->
      <g transform="translate(485, 22)">
        <rect x="0" y="0" width="125" height="98" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
        <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Throughput Scaling</text>
        <text x="12" y="34" font-size="7.5" fill="#475569">Pipeline Depth: P = 4</text>
        <text x="12" y="48" font-size="7.5" fill="#15803d">Output: 1 req / step</text>
        
        <rect x="12" y="58" width="101" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
        <text x="62.5" y="73" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">4× Peak Throughput</text>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- BOTTOM SUMMARY CARD                                                    -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="700" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="16" y="19" font-size="8.5" font-weight="700" fill="#0f172a">Key Operational Trade-offs of Pipeline Parallelism (PP)</text>
    <text x="16" y="33" font-size="7.5" fill="#334155"><tspan font-weight="700">Decoupled Interconnect:</tspan><tspan dx="3">Activations pass peer-to-peer across stage boundaries without requiring all-reduce collectives.</tspan></text>
    <text x="16" y="45" font-size="7.5" fill="#334155"><tspan font-weight="700">Latency vs. Throughput:</tspan><tspan dx="3">PP maintains single-request latency (T_total = ∑ T_stage) while scaling throughput linearly.</tspan></text>
  </g>
</svg>
