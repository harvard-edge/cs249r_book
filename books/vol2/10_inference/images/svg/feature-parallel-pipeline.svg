<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="780" height="240" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <!-- ===== request and split ===== -->
  <rect x="20" y="94" width="70" height="52" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="55" y="124.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Request</text>
  <rect x="120" y="90" width="100" height="60" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="170" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Feature split</text>
  <text x="170" y="133" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">by type</text>
  <path d="M90,120 H118" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <!-- ===== embedding servers ===== -->
  <rect x="260" y="20" width="150" height="50" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="335" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">User embeddings</text>
  <text x="335" y="58" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">sharded tables</text>
  <rect x="260" y="95" width="150" height="50" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="335" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Item embeddings</text>
  <text x="335" y="133" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">sharded tables</text>
  <rect x="260" y="170" width="150" height="50" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="335" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Context embeddings</text>
  <text x="335" y="208" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">sharded tables</text>
  <path d="M220,120 H240" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M240,120 V45 H258" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M240,120 H258" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M240,120 V195 H258" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <!-- ===== gather, rank, output ===== -->
  <path d="M410,45 H430 V120" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M410,195 H430 V120" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M410,120 H448" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="450" y="90" width="90" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="495" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Gather</text>
  <text x="495" y="133" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">concatenate</text>
  <path d="M540,120 H568" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="570" y="90" width="110" height="60" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="625" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Ranking head</text>
  <text x="625" y="133" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">dense MLP</text>
  <path d="M680,120 H698" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="700" y="94" width="60" height="52" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="730" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Output</text>
  <text x="730" y="133" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">ranked</text>
</svg>
