<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 460" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .phase-hdr { font-size: 8.5px; font-weight: 700; letter-spacing: 0.8px; }
    .card-title { font-size: 9.5px; font-weight: 700; fill: #0f172a; }
    .card-sub { font-size: 7.5px; fill: #475569; }
    .badge-txt { font-size: 7.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- PHASE HEADERS & DIVIDERS                                               -->
  <!-- ====================================================================== -->
  <g transform="translate(0, 20)">
    <!-- Phase 1: Ingress -->
    <rect x="25" y="0" width="180" height="20" rx="2" fill="#f1f5f9"/>
    <text x="115" y="14" text-anchor="middle" class="phase-hdr" fill="#475569">INGRESS &amp; PARSING</text>

    <!-- Phase 2: Embedding Lookup -->
    <rect x="220" y="0" width="205" height="20" rx="2" fill="#EAF1F8"/>
    <text x="322.5" y="14" text-anchor="middle" class="phase-hdr" fill="#14294E">PARALLEL EMBEDDINGS (MEMORY)</text>

    <!-- Phase 3: Gather -->
    <rect x="440" y="0" width="125" height="20" rx="2" fill="#fef3c7"/>
    <text x="502.5" y="14" text-anchor="middle" class="phase-hdr" fill="#b45309">ALLGATHER / POOL</text>

    <!-- Phase 4: Dense Ranking -->
    <rect x="580" y="0" width="135" height="20" rx="2" fill="#dcfce7"/>
    <text x="647.5" y="14" text-anchor="middle" class="phase-hdr" fill="#15803d">DENSE RANKING (COMPUTE)</text>
  </g>

  <!-- Vertical Phase Separator Lines -->
  <line x1="212" y1="50" x2="212" y2="390" stroke="#f1f5f9" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="432" y1="50" x2="432" y2="390" stroke="#f1f5f9" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="572" y1="50" x2="572" y2="390" stroke="#f1f5f9" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- ====================================================================== -->
  <!-- PHASE 1: INGRESS & FEATURE EXTRACTION                                  -->
  <!-- ====================================================================== -->
  <!-- Request Card -->
  <g transform="translate(25, 175)">
    <rect x="0" y="0" width="70" height="60" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="6" y="6" width="58" height="16" rx="2" fill="#e2e8f0"/>
    <text x="35" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Request</text>
    <text x="35" y="36" text-anchor="middle" font-size="7.5" fill="#475569">User + Items</text>
    <text x="35" y="48" text-anchor="middle" font-size="7.5" fill="#475569">+ Context</text>
  </g>

  <!-- Arrow Request -> Extraction -->
  <path d="M 95,205 L 112,205" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Feature Extraction Card -->
  <g transform="translate(114, 160)">
    <rect x="0" y="0" width="85" height="90" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="8" y="8" width="69" height="18" rx="2" fill="#f1f5f9"/>
    <text x="42.5" y="20" text-anchor="middle" class="card-title">Extractor</text>
    <text x="42.5" y="38" text-anchor="middle" class="card-sub">• Parse sparse ID</text>
    <text x="42.5" y="50" text-anchor="middle" class="card-sub">• Split by domain</text>
    <text x="42.5" y="62" text-anchor="middle" class="card-sub">• User / Item / Ctx</text>
    <text x="42.5" y="76" text-anchor="middle" font-size="7" font-weight="700" fill="#1F407A">Fan-out Shards</text>
  </g>

  <!-- Fan-out routing arrows from Extractor to 3 Embedding Tables -->
  <path d="M 199,185 L 215,185 L 215,105 L 228,105" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <path d="M 199,205 L 228,205" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <path d="M 199,225 L 215,225 L 215,305 L 228,305" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- ====================================================================== -->
  <!-- PHASE 2: PARALLEL EMBEDDING TABLES (GPU 0, 1, 2)                       -->
  <!-- ====================================================================== -->
  <!-- GPU 0: User Embeddings -->
  <g transform="translate(230, 75)">
    <rect x="0" y="0" width="185" height="60" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
    <rect x="8" y="8" width="40" height="16" rx="2" fill="#1F407A"/>
    <text x="28" y="19" text-anchor="middle" class="badge-txt">GPU 0</text>
    <text x="56" y="20" class="card-title" fill="#14294E">User Embeddings</text>
    <text x="8" y="38" class="card-sub">• user_id, age, demographics, history</text>
    <text x="8" y="50" class="card-sub">• Large embedding table (100M+ entries)</text>
  </g>

  <!-- GPU 1: Item Embeddings -->
  <g transform="translate(230, 175)">
    <rect x="0" y="0" width="185" height="60" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
    <rect x="8" y="8" width="40" height="16" rx="2" fill="#1F407A"/>
    <text x="28" y="19" text-anchor="middle" class="badge-txt">GPU 1</text>
    <text x="56" y="20" class="card-title" fill="#14294E">Item Embeddings</text>
    <text x="8" y="38" class="card-sub">• item_id, category, price, seller</text>
    <text x="8" y="50" class="card-sub">• High-cardinality item catalog tables</text>
  </g>

  <!-- GPU 2: Context Embeddings -->
  <g transform="translate(230, 275)">
    <rect x="0" y="0" width="185" height="60" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
    <rect x="8" y="8" width="40" height="16" rx="2" fill="#1F407A"/>
    <text x="28" y="19" text-anchor="middle" class="badge-txt">GPU 2</text>
    <text x="56" y="20" class="card-title" fill="#14294E">Context Embeddings</text>
    <text x="8" y="38" class="card-sub">• Timestamp, geo-location, device OS</text>
    <text x="8" y="50" class="card-sub">• Dense feature interactions &amp; cross features</text>
  </g>

  <!-- Memory Footprint Callout -->
  <rect x="230" y="350" width="185" height="34" rx="2" fill="#fff1f2" stroke="#f43f5e" stroke-width="0.8"/>
  <text x="322.5" y="364" text-anchor="middle" font-size="8" font-weight="700" fill="#be123c">Memory-Capacity Dominant</text>
  <text x="322.5" y="375" text-anchor="middle" font-size="7" fill="#9f1239">Embedding tables consume 80%+ of total GPU HBM</text>

  <!-- ====================================================================== -->
  <!-- PHASE 3: ALLGATHER & CONCATENATION                                     -->
  <!-- ====================================================================== -->
  <!-- Arrows from GPUs to Gather -->
  <path d="M 415,105 L 428,105 L 428,185 L 440,185" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <path d="M 415,205 L 440,205" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <path d="M 415,305 L 428,305 L 428,225 L 440,225" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <!-- Gather Card -->
  <g transform="translate(442, 160)">
    <rect x="0" y="0" width="115" height="90" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <rect x="8" y="8" width="99" height="18" rx="2" fill="#fde68a"/>
    <text x="57.5" y="20" text-anchor="middle" class="card-title" fill="#b45309">Gather &amp; Pool</text>
    <text x="57.5" y="38" text-anchor="middle" class="card-sub">• Concatenate vectors</text>
    <text x="57.5" y="50" text-anchor="middle" class="card-sub">• NVLink / PCIe gather</text>
    <text x="57.5" y="62" text-anchor="middle" class="card-sub">• Feature normalization</text>
    <text x="57.5" y="76" text-anchor="middle" font-size="7.5" font-weight="700" fill="#d97706">Unified Feature Tensor</text>
  </g>

  <!-- Arrow Gather -> Dense Ranking -->
  <path d="M 557,205 L 580,205" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ====================================================================== -->
  <!-- PHASE 4: DENSE RANKING NETWORK & RESPONSE                              -->
  <!-- ====================================================================== -->
  <!-- GPU 3: Dense Ranking Network -->
  <g transform="translate(582, 140)">
    <rect x="0" y="0" width="135" height="100" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="8" y="8" width="40" height="16" rx="2" fill="#16a34a"/>
    <text x="28" y="19" text-anchor="middle" class="badge-txt">GPU 3</text>
    <text x="54" y="20" class="card-title" fill="#15803d">Dense Ranking</text>
    
    <text x="8" y="38" class="card-sub">• Deep MLP interaction</text>
    <text x="8" y="50" class="card-sub">• Compute-intensive GEMMs</text>
    <text x="8" y="62" class="card-sub">• CTR / CVR scoring</text>
    
    <rect x="8" y="70" width="119" height="20" rx="2" fill="#dcfce7"/>
    <text x="67.5" y="83" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">COMPUTE-BOUND (TENSOR CORES)</text>
  </g>

  <!-- Arrow Ranking -> Response -->
  <path d="M 649.5,240 L 649.5,275" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Response Egress Card -->
  <g transform="translate(582, 278)">
    <rect x="0" y="0" width="135" height="42" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="67.5" y="18" text-anchor="middle" class="card-title" fill="#15803d">Ranked Output</text>
    <text x="67.5" y="32" text-anchor="middle" font-size="7.5" fill="#16a34a">Top-K scored candidate items</text>
  </g>

  <!-- ====================================================================== -->
  <!-- FOOTER                                                                 -->
  <!-- ====================================================================== -->
  <text x="370" y="435" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    Feature parallelism shards memory-dominant embedding tables across GPU devices; dense MLP scoring executes concurrently post-gather.
  </text>
</svg>