<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 590" width="100%" height="100%">
  <defs>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
    <pattern id="waste-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#fca5a5" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .panel-title { font-size: 10.5px; font-weight: 700; }
    .panel-sub { font-size: 8px; fill: #64748b; }
    .seq-lbl { font-size: 8.5px; font-weight: 700; fill: #334155; }
    .blk-txt { font-size: 7.5px; font-weight: 700; }
    .waste-txt { font-size: 7.5px; font-weight: 700; fill: #be123c; }
    .card-txt { font-size: 8px; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- TOP LEFT PANEL: INTERNAL FRAGMENTATION                                 -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="385" height="260" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="12" y="10" width="140" height="18" rx="2" fill="#ffe4e6" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="82" y="23" text-anchor="middle" class="panel-title" fill="#be123c">Internal Fragmentation</text>
    <text x="160" y="23" class="panel-sub">Pre-allocating worst-case max sequence length (S_max)</text>

    <!-- Sequences Layout -->
    <g transform="translate(14, 42)">
      <!-- Seq A: 8 allocated, 3 used (T1..T3), 5 wasted -->
      <text x="0" y="15" class="seq-lbl">Seq A</text>
      <g transform="translate(42, 0)">
        <rect x="0" y="0" width="34" height="22" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="17" y="14" text-anchor="middle" class="blk-txt" fill="#0369a1">T1</text>
        <rect x="38" y="0" width="34" height="22" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="55" y="14" text-anchor="middle" class="blk-txt" fill="#0369a1">T2</text>
        <rect x="76" y="0" width="34" height="22" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="93" y="14" text-anchor="middle" class="blk-txt" fill="#0369a1">T3</text>

        <!-- Wasted pre-allocated memory -->
        <rect x="114" y="0" width="202" height="22" rx="2" fill="url(#waste-hatch)" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="215" y="14" text-anchor="middle" class="waste-txt">5 Blocks Unused (62.5% Wasted)</text>
      </g>

      <!-- Seq B: 8 allocated, 5 used (T1..T5), 3 wasted -->
      <text x="0" y="47" class="seq-lbl">Seq B</text>
      <g transform="translate(42, 32)">
        <rect x="0" y="0" width="34" height="22" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="17" y="14" text-anchor="middle" class="blk-txt" fill="#0369a1">T1</text>
        <rect x="38" y="0" width="34" height="22" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="55" y="14" text-anchor="middle" class="blk-txt" fill="#0369a1">T2</text>
        <rect x="76" y="0" width="34" height="22" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="93" y="14" text-anchor="middle" class="blk-txt" fill="#0369a1">T3</text>
        <rect x="114" y="0" width="34" height="22" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="131" y="14" text-anchor="middle" class="blk-txt" fill="#0369a1">T4</text>
        <rect x="152" y="0" width="34" height="22" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="169" y="14" text-anchor="middle" class="blk-txt" fill="#0369a1">T5</text>

        <!-- Wasted -->
        <rect x="190" y="0" width="126" height="22" rx="2" fill="url(#waste-hatch)" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="253" y="14" text-anchor="middle" class="waste-txt">3 Blocks (37.5%)</text>
      </g>

      <!-- Seq C: 8 allocated, 1 used (T1), 7 wasted -->
      <text x="0" y="79" class="seq-lbl">Seq C</text>
      <g transform="translate(42, 64)">
        <rect x="0" y="0" width="34" height="22" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="17" y="14" text-anchor="middle" class="blk-txt" fill="#0369a1">T1</text>

        <!-- Wasted -->
        <rect x="38" y="0" width="278" height="22" rx="2" fill="url(#waste-hatch)" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="177" y="14" text-anchor="middle" class="waste-txt">7 Blocks Unused (87.5% Wasted)</text>
      </g>
    </g>

    <!-- Impact Callout -->
    <rect x="14" y="165" width="357" height="42" rx="3" fill="#fff1f2" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="192.5" y="181" text-anchor="middle" font-size="8.5" font-weight="700" fill="#be123c">Total Capacity Waste: 60% – 80%</text>
    <text x="192.5" y="195" text-anchor="middle" font-size="7.5" fill="#9f1239">Memory reserved for tokens that are never generated restricts batch concurrency.</text>
  </g>

  <!-- ====================================================================== -->
  <!-- TOP RIGHT PANEL: EXTERNAL FRAGMENTATION                                -->
  <!-- ====================================================================== -->
  <g transform="translate(430, 20)">
    <rect x="0" y="0" width="385" height="260" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="12" y="10" width="145" height="18" rx="2" fill="#ffe4e6" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="84.5" y="23" text-anchor="middle" class="panel-title" fill="#be123c">External Fragmentation</text>
    <text x="165" y="23" class="panel-sub">Dynamic allocation leaves non-contiguous memory gaps</text>

    <!-- Memory Layout Scenario -->
    <g transform="translate(14, 42)">
      <text x="0" y="12" class="seq-lbl">Linear HBM Space</text>
      <text x="0" y="24" font-size="7.5" fill="#64748b">After requests terminate and free disparate ranges:</text>

      <!-- Row of fragmented memory -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="60" height="24" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="30" y="15" text-anchor="middle" class="blk-txt" fill="#0369a1">Seq X (3b)</text>

        <rect x="65" y="0" width="40" height="24" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="85" y="15" text-anchor="middle" font-size="7.5" fill="#64748b">Free (2b)</text>

        <rect x="110" y="0" width="80" height="24" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="150" y="15" text-anchor="middle" class="blk-txt" fill="#0369a1">Seq Y (4b)</text>

        <rect x="195" y="0" width="40" height="24" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="215" y="15" text-anchor="middle" font-size="7.5" fill="#64748b">Free (2b)</text>

        <rect x="240" y="0" width="115" height="24" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
        <text x="297.5" y="15" text-anchor="middle" class="blk-txt" fill="#0369a1">Seq W (6b)</text>
      </g>

      <!-- Rejection Incident -->
      <g transform="translate(0, 72)">
        <text x="0" y="14" font-size="8" font-weight="700" fill="#be123c">New Request Seq Z Arrives (Requires 4 contiguous blocks):</text>
        <rect x="0" y="22" width="357" height="34" rx="2" fill="#fee2e2" stroke="#e11d48" stroke-width="0.8"/>
        <text x="178.5" y="36" text-anchor="middle" font-size="8" font-weight="700" fill="#be123c">Total Free HBM = 4 Blocks (2 + 2), but Non-Contiguous!</text>
        <text x="178.5" y="48" text-anchor="middle" font-size="7.5" fill="#9f1239">Allocation Fails: Request Z rejected or preempted despite sufficient total bytes.</text>
      </g>
    </g>

    <!-- Impact Callout -->
    <rect x="14" y="210" width="357" height="36" rx="3" fill="#fff1f2" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="192.5" y="225" text-anchor="middle" font-size="8.5" font-weight="700" fill="#be123c">Admission Collapse Under High Concurrency</text>
    <text x="192.5" y="238" text-anchor="middle" font-size="7.5" fill="#9f1239">Frequent compaction causes severe GPU synchronization latency spikes.</text>
  </g>

  <!-- ====================================================================== -->
  <!-- BOTTOM PANEL: PAGEDATTENTION SOLUTION                                  -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 300)">
    <rect x="0" y="0" width="790" height="225" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="16" y="12" width="165" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="98.5" y="26" text-anchor="middle" class="panel-title" fill="#15803d">PagedAttention Mapping</text>
    <text x="195" y="26" class="panel-sub">OS-style paging decouples contiguous logical tokens from non-contiguous physical HBM blocks</text>

    <!-- Paging Diagram -->
    <g transform="translate(25, 48)">
      <!-- 1. Logical Virtual Blocks (Sequence 1) -->
      <g transform="translate(0, 10)">
        <text x="97" y="12" text-anchor="middle" class="seq-lbl">Logical Sequence Blocks</text>
        <text x="97" y="24" text-anchor="middle" font-size="7.5" fill="#64748b">(Virtual Contiguous Space)</text>

        <g transform="translate(0, 32)">
          <rect x="0" y="0" width="45" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
          <text x="22.5" y="18" text-anchor="middle" class="blk-txt" fill="#0369a1">Page 0</text>

          <rect x="50" y="0" width="45" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
          <text x="72.5" y="18" text-anchor="middle" class="blk-txt" fill="#0369a1">Page 1</text>

          <rect x="100" y="0" width="45" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
          <text x="122.5" y="18" text-anchor="middle" class="blk-txt" fill="#0369a1">Page 2</text>

          <rect x="150" y="0" width="45" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
          <text x="172.5" y="18" text-anchor="middle" class="blk-txt" fill="#0369a1">Page 3</text>
        </g>
      </g>

      <!-- Arrow Logical -> Block Table -->
      <path d="M 205,56 L 268,56" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

      <!-- 2. Block Table (Translation Layer) -->
      <g transform="translate(275, 0)">
        <rect x="0" y="0" width="130" height="110" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <text x="65" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Page Table Mapping</text>
        <line x1="8" y1="22" x2="122" y2="22" stroke="#fcd34d" stroke-width="0.8"/>

        <g font-size="7.5" font-family="monospace">
          <text x="16" y="38" fill="#78350f">Page 0 → Blk 12</text>
          <text x="16" y="56" fill="#78350f">Page 1 → Blk 3</text>
          <text x="16" y="74" fill="#78350f">Page 2 → Blk 47</text>
          <text x="16" y="92" fill="#78350f">Page 3 → Blk 19</text>
        </g>
      </g>

      <!-- Arrow Block Table -> Physical Memory -->
      <path d="M 415,56 L 465,56" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- 3. Physical GPU HBM (Non-Contiguous Pages) -->
      <g transform="translate(470, 0)">
        <text x="135" y="12" text-anchor="middle" class="seq-lbl">Physical GPU HBM Blocks</text>
        <text x="135" y="24" text-anchor="middle" font-size="7.5" fill="#64748b">(Dynamically Allocated Scattered Pages)</text>

        <!-- Scattered grid of 8 physical blocks -->
        <g transform="translate(0, 32)">
          <!-- Row 1 -->
          <rect x="0" y="0" width="60" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
          <text x="30" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Blk 12</text>
          <text x="30" y="23" text-anchor="middle" font-size="6.5" fill="#16a34a">(Page 0)</text>

          <rect x="68" y="0" width="60" height="28" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="98" y="17" text-anchor="middle" font-size="7" fill="#64748b">Blk 15 (Seq 2)</text>

          <rect x="136" y="0" width="60" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
          <text x="166" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Blk 3</text>
          <text x="166" y="23" text-anchor="middle" font-size="6.5" fill="#16a34a">(Page 1)</text>

          <rect x="204" y="0" width="60" height="28" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="234" y="17" text-anchor="middle" font-size="7" fill="#64748b">Blk 8 (Free)</text>

          <!-- Row 2 -->
          <rect x="0" y="34" width="60" height="28" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="30" y="51" text-anchor="middle" font-size="7" fill="#64748b">Blk 21 (Seq 3)</text>

          <rect x="68" y="34" width="60" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
          <text x="98" y="48" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Blk 47</text>
          <text x="98" y="57" text-anchor="middle" font-size="6.5" fill="#16a34a">(Page 2)</text>

          <rect x="136" y="34" width="60" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
          <text x="166" y="48" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Blk 19</text>
          <text x="166" y="57" text-anchor="middle" font-size="6.5" fill="#16a34a">(Page 3)</text>

          <rect x="204" y="34" width="60" height="28" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="234" y="51" text-anchor="middle" font-size="7" fill="#64748b">Blk 50 (Free)</text>
        </g>
      </g>
    </g>

    <!-- PagedAttention Benefit Bottom Banner -->
    <rect x="16" y="175" width="758" height="34" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="395" y="189" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Near-Zero Memory Waste (&lt;4%) · 2× – 4× Serving Throughput Improvement</text>
    <text x="395" y="201" text-anchor="middle" font-size="7.5" fill="#16a34a">Eliminates external fragmentation completely; internal fragmentation restricted to at most the final block in each sequence.</text>
  </g>

  <!-- ====================================================================== -->
  <!-- FOOTER                                                                 -->
  <!-- ====================================================================== -->
  <text x="420" y="565" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    PagedAttention resolves internal and external KV-cache fragmentation by decoupling logical sequence coordinates from physical HBM allocation.
  </text>
</svg>