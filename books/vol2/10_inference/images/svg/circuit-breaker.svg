<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- ===== states ===== -->
  <rect x="40" y="40" width="180" height="64" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="130" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Closed</text>
  <text x="130" y="86" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">normal traffic</text>
  <rect x="460" y="40" width="180" height="64" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="550" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Open</text>
  <text x="550" y="86" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">requests fail fast</text>
  <rect x="250" y="230" width="180" height="64" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="257" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Half-open</text>
  <text x="340" y="276" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">limited probes</text>
  <!-- ===== transitions ===== -->
  <path d="M220,72 H458" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">threshold exceeded</text>
  <text x="340" y="92" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">errors, timeouts, or latency</text>
  <path d="M600,104 V262 H432" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="590" y="200" text-anchor="end" font-size="12.5" font-weight="700" fill="#334155">timeout elapses</text>
  <path d="M380,230 V160 H510 V106" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="445" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">probe fails</text>
  <path d="M250,262 H130 V106" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="120" y="190" text-anchor="end" font-size="12.5" font-weight="700" fill="#166534">probe succeeds</text>
</svg>
