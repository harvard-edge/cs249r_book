<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs><marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker><marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker><marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker></defs>
  <style>
    .st { font-size: 16px; font-weight: 700; letter-spacing: 0.4px; }
    .b { font-size: 13.5px; }
    .lb { font-size: 13px; font-weight: 700; }
    .ex { font-size: 12.5px; font-style: italic; }
  </style>
  <rect width="680" height="372" fill="#ffffff"/>
  <rect x="20" y="20" width="210" height="112" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="125" y="50" text-anchor="middle" class="st" fill="#166534">CLOSED</text>
  <text x="125" y="76" text-anchor="middle" class="b" fill="#166534">requests pass through</text>
  <text x="125" y="95" text-anchor="middle" class="b" fill="#166534">failures are counted</text>
  <rect x="450" y="20" width="210" height="112" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="555" y="50" text-anchor="middle" class="st" fill="#991b1b">OPEN</text>
  <text x="555" y="76" text-anchor="middle" class="b" fill="#991b1b">requests fail fast</text>
  <text x="555" y="95" text-anchor="middle" class="b" fill="#991b1b">serve fallback or cache</text>
  <rect x="235" y="244" width="210" height="112" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="340" y="274" text-anchor="middle" class="st" fill="#92400e">HALF-OPEN</text>
  <text x="340" y="300" text-anchor="middle" class="b" fill="#92400e">limited probe</text>
  <text x="340" y="319" text-anchor="middle" class="b" fill="#92400e">requests allowed</text>
  <path d="M 230,62 H 448" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text x="340" y="52" text-anchor="middle" class="lb" fill="#991b1b">failure threshold exceeded</text>
  <text x="340" y="84" text-anchor="middle" class="ex" fill="#991b1b">e.g., 5 failures in 30 s</text>
  <path d="M 610,132 V 300 H 447" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#aa)"/>
  <text x="598" y="196" text-anchor="end" class="lb" fill="#92400e">timeout expires</text>
  <text x="598" y="215" text-anchor="end" class="ex" fill="#92400e">e.g., after 60 s</text>
  <path d="M 235,300 H 125 V 134" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="116" y="196" text-anchor="end" class="lb" fill="#166534">probe</text>
  <text x="116" y="215" text-anchor="end" class="lb" fill="#166534">succeeds</text>
  <path d="M 400,244 V 176 H 500 V 134" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text x="392" y="222" text-anchor="end" class="lb" fill="#991b1b">probe fails</text>
</svg>
