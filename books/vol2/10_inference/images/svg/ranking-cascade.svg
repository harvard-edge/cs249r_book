<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="20" y="26" text-anchor="start" font-size="12" font-weight="700" fill="#64748b">stage</text>
  <text x="370" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">candidates in → out</text>
  <text x="680" y="26" text-anchor="end" font-size="12" font-weight="700" fill="#64748b">latency budget</text>
  <line x1="20" y1="36" x2="680" y2="36" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="210" y="50" width="320" height="40" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="370" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">1,000,000 → 10,000</text>
  <text x="20" y="67" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">Retrieval</text>
  <text x="20" y="84" text-anchor="start" font-size="12" font-weight="400" fill="#475569">lexical, ANN embeddings</text>
  <text x="680" y="75" text-anchor="end" font-size="13" font-weight="700" fill="#334155">≤ 10 ms</text>
  <path d="M370,90 V108" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="245" y="110" width="250" height="40" rx="3" fill="#DCE7F3" stroke="#1F407A" stroke-width="1.4"/>
  <text x="370" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">10,000 → 1,000</text>
  <text x="20" y="127" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">First-stage ranking</text>
  <text x="20" y="144" text-anchor="start" font-size="12" font-weight="400" fill="#475569">two-tower, GBDT</text>
  <text x="680" y="135" text-anchor="end" font-size="13" font-weight="700" fill="#334155">≈ 20 ms</text>
  <path d="M370,150 V168" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="280" y="170" width="180" height="40" rx="3" fill="#C9D9EC" stroke="#1F407A" stroke-width="1.4"/>
  <text x="370" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">1,000 → 100</text>
  <text x="20" y="187" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">Second-stage scoring</text>
  <text x="20" y="204" text-anchor="start" font-size="12" font-weight="400" fill="#475569">deep MLP, DLRM</text>
  <text x="680" y="195" text-anchor="end" font-size="13" font-weight="700" fill="#334155">≈ 50 ms</text>
  <path d="M370,210 V228" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="315" y="230" width="110" height="40" rx="3" fill="#B3C8E3" stroke="#1F407A" stroke-width="1.4"/>
  <text x="370" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">100 → 10</text>
  <text x="20" y="247" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">Final re-ranking</text>
  <text x="20" y="264" text-anchor="start" font-size="12" font-weight="400" fill="#475569">cross-attention transformer</text>
  <text x="680" y="255" text-anchor="end" font-size="13" font-weight="700" fill="#334155">≈ 100 ms</text>
</svg>
