<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#e11d48"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .region-title { font-size: 9.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.8px; }
    .stage-title { font-size: 10px; font-weight: 700; }
    .stage-sub { font-size: 8px; }
    .badge-txt { font-size: 7.5px; font-weight: 700; }
    .flow-lbl { font-size: 8px; font-weight: 600; fill: #475569; }
    .bar-lbl { font-size: 8px; font-weight: 700; }
    .bar-sub { font-size: 7px; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- BACKGROUND REGIONS                                                     -->
  <!-- ====================================================================== -->
  <!-- CPU Zone -->
  <rect x="25" y="25" width="220" height="395" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="35" y="35" width="130" height="18" rx="2" fill="#e2e8f0"/>
  <text x="100" y="47" text-anchor="middle" class="region-title">CPU PRE / POST ZONE</text>

  <!-- GPU Inference Zone -->
  <rect x="260" y="25" width="475" height="395" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="270" y="35" width="160" height="18" rx="2" fill="#e2e8f0"/>
  <text x="350" y="47" text-anchor="middle" class="region-title">GPU ACCELERATOR ZONE</text>

  <!-- ====================================================================== -->
  <!-- CLIENT INGRESS & LOAD BALANCER                                         -->
  <!-- ====================================================================== -->
  <!-- Client Requests -->
  <g transform="translate(38, 68)">
    <rect x="0" y="0" width="52" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="15" text-anchor="middle" font-size="8" font-weight="600" fill="#334155">Req 1</text>

    <rect x="0" y="32" width="52" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="47" text-anchor="middle" font-size="8" font-weight="600" fill="#334155">Req 2</text>

    <text x="26" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">···</text>

    <rect x="0" y="78" width="52" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="93" text-anchor="middle" font-size="8" font-weight="600" fill="#334155">Req N</text>
  </g>

  <!-- Funnel Arrows from Requests to Load Balancer -->
  <path d="M 90,80 L 115,80 L 115,98 L 124,98" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <path d="M 90,112 L 124,112" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <path d="M 90,158 L 115,158 L 115,126 L 124,126" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Load Balancer -->
  <g transform="translate(126, 85)">
    <rect x="0" y="0" width="95" height="54" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="47.5" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Load Balancer</text>
    <text x="47.5" y="32" text-anchor="middle" font-size="7.5" fill="#78350f">Token routing</text>
    <text x="47.5" y="44" text-anchor="middle" font-size="7.5" fill="#78350f">Concurrency gate</text>
  </g>

  <!-- Arrow LB -> Preprocessing -->
  <path d="M 173.5,139 L 173.5,178" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="181" y="162" class="flow-lbl">Raw Text</text>

  <!-- ====================================================================== -->
  <!-- CPU STAGE 1: PREPROCESSING (TOKENIZATION)                              -->
  <!-- ====================================================================== -->
  <g transform="translate(36, 180)">
    <rect x="0" y="0" width="185" height="60" rx="3" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
    <rect x="8" y="8" width="52" height="14" rx="2" fill="#1F407A"/>
    <text x="34" y="18" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">CPU STAGE</text>
    <text x="66" y="19" class="stage-title" fill="#14294E">Tokenization</text>
    <text x="8" y="36" class="stage-sub" fill="#334155"><tspan font-weight="600">Algorithm:</tspan><tspan dx="3">BPE / SentencePiece</tspan></text>
    <text x="8" y="48" class="stage-sub" fill="#334155"><tspan font-weight="600">Output:</tspan><tspan dx="3">Input ID tensor batch</tspan></text>
  </g>

  <!-- Arrow Preprocessing -> GPU Prefill -->
  <path d="M 221,210 L 273,210" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="247" y="202" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">Tokens</text>

  <!-- ====================================================================== -->
  <!-- GPU STAGE 2: PREFILL                                                   -->
  <!-- ====================================================================== -->
  <g transform="translate(275, 168)">
    <rect x="0" y="0" width="180" height="84" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
    <rect x="8" y="8" width="70" height="16" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
    <text x="43" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14294E">PREFILL STAGE</text>
    <text x="85" y="20" class="stage-title" fill="#14294E">Prompt Prefill</text>
    
    <text x="8" y="36" class="stage-sub" fill="#334155"><tspan font-weight="600">Compute:</tspan><tspan dx="3">Parallel prompt GEMMs</tspan></text>
    <text x="8" y="48" class="stage-sub" fill="#334155"><tspan font-weight="600">Intensity:</tspan><tspan dx="3">High FLOP/byte (&gt;&gt; 1)</tspan></text>
    <text x="8" y="60" class="stage-sub" fill="#334155"><tspan font-weight="600">Metric:</tspan><tspan dx="3">Emits first token (TTFT)</tspan></text>

    <rect x="8" y="67" width="164" height="13" rx="2" fill="#dbeafe"/>
    <text x="90" y="77" text-anchor="middle" font-size="7" font-weight="700" fill="#1e40af">COMPUTE-BOUND · FP8 TENSOR CORES</text>
  </g>

  <!-- Arrow Prefill -> KV Cache -->
  <path d="M 455,210 L 508,210" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="481" y="202" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">KV State</text>

  <!-- KV Cache Card -->
  <g transform="translate(510, 168)">
    <rect x="0" y="0" width="195" height="84" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="8" y="8" width="56" height="16" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="36" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">KV CACHE</text>
    <text x="70" y="20" class="stage-title" fill="#15803d">PagedAttention</text>
    <text x="8" y="36" class="stage-sub" fill="#334155"><tspan font-weight="600">Blocks:</tspan><tspan dx="3">Virtual non-contiguous pages</tspan></text>
    <text x="8" y="48" class="stage-sub" fill="#334155"><tspan font-weight="600">Memory:</tspan><tspan dx="3">Zero external fragmentation</tspan></text>
    <text x="8" y="60" class="stage-sub" fill="#334155"><tspan font-weight="600">Sharing:</tspan><tspan dx="3">Radix tree prefix reuse</tspan></text>
    <text x="8" y="72" class="stage-sub" font-weight="600" fill="#16a34a"><tspan font-weight="700">Capacity:</tspan><tspan dx="3">HBM Allocation Limit</tspan></text>
  </g>

  <!-- Arrow KV Cache -> Decode Stage -->
  <path d="M 607.5,252 L 607.5,288" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="615" y="273" class="flow-lbl" fill="#15803d">Lookup KV</text>

  <!-- ====================================================================== -->
  <!-- GPU STAGE 3: DECODE                                                    -->
  <!-- ====================================================================== -->
  <g transform="translate(470, 290)">
    <rect x="0" y="0" width="220" height="105" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <rect x="8" y="8" width="68" height="16" rx="2" fill="#ffe4e6" stroke="#e11d48" stroke-width="0.8"/>
    <text x="42" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#be123c">DECODE STAGE</text>
    <text x="84" y="20" class="stage-title" fill="#be123c">Autoregressive Loop</text>

    <text x="8" y="36" class="stage-sub" fill="#334155"><tspan font-weight="600">Step:</tspan><tspan dx="3">1 token/step per sequence</tspan></text>
    <text x="8" y="48" class="stage-sub" fill="#334155"><tspan font-weight="600">Memory:</tspan><tspan dx="3">Reads full weight matrix</tspan></text>
    <text x="8" y="60" class="stage-sub" fill="#334155"><tspan font-weight="600">Cache:</tspan><tspan dx="3">Appends new K, V pages</tspan></text>
    <text x="8" y="72" class="stage-sub" fill="#334155"><tspan font-weight="600">Latency:</tspan><tspan dx="3">Time-Per-Output-Token (TPOT)</tspan></text>

    <rect x="8" y="82" width="204" height="16" rx="2" fill="#ffe4e6"/>
    <text x="110" y="93" text-anchor="middle" font-size="7" font-weight="700" fill="#9f1239">MEMORY-BANDWIDTH BOUND · HBM3</text>
  </g>

  <!-- Next Token Self-Loop (Autoregressive Loop) -->
  <path d="M 690,328 L 710,328 L 710,360 L 692,360" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>
  <text x="702" y="375" text-anchor="middle" font-size="7" font-weight="700" fill="#be123c">Loop</text>

  <!-- Arrow Decode -> CPU Postprocessing (Orthogonal route) -->
  <path d="M 470,345 L 223,345" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="345" y="338" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">Generated Token IDs (Logits / Argmax)</text>

  <!-- ====================================================================== -->
  <!-- CPU STAGE 4: POSTPROCESSING & EGRESS                                   -->
  <!-- ====================================================================== -->
  <g transform="translate(36, 315)">
    <rect x="0" y="0" width="185" height="58" rx="3" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
    <rect x="8" y="8" width="52" height="14" rx="2" fill="#1F407A"/>
    <text x="34" y="18" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">CPU STAGE</text>
    <text x="66" y="19" class="stage-title" fill="#14294E">Detokenization</text>
    <text x="8" y="35" class="stage-sub" fill="#334155"><tspan font-weight="600">Decode:</tspan><tspan dx="3">Token IDs to UTF-8 text</tspan></text>
    <text x="8" y="47" class="stage-sub" fill="#334155"><tspan font-weight="600">Framing:</tspan><tspan dx="3">Stop detection &amp; SSE events</tspan></text>
  </g>

  <!-- Egress to Client -->
  <path d="M 128,373 L 128,388" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="70" y="388" width="116" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="128" y="402" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Streamed SSE Egress</text>

  <!-- ====================================================================== -->
  <!-- LATENCY BUDGET BREAKDOWN (BOTTOM SEGMENTED BAR)                         -->
  <!-- ====================================================================== -->
  <g transform="translate(45, 442)">
    <text x="0" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Latency Budget Breakdown:</text>

    <!-- Segmented container -->
    <g transform="translate(145, 0)">
      <!-- 1. Routing -->
      <rect x="0" y="0" width="55" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="27.5" y="12" text-anchor="middle" class="bar-lbl" fill="#b45309">Routing</text>
      <text x="27.5" y="21" text-anchor="middle" class="bar-sub" fill="#78350f">&lt; 10 ms</text>

      <!-- 2. Preprocessing -->
      <rect x="58" y="0" width="50" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <text x="83" y="12" text-anchor="middle" class="bar-lbl" fill="#14294E">Pre</text>
      <text x="83" y="21" text-anchor="middle" class="bar-sub" fill="#1F407A">&lt; 5 ms</text>

      <!-- 3. Prefill (TTFT) -->
      <rect x="111" y="0" width="155" height="24" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="188.5" y="12" text-anchor="middle" class="bar-lbl" fill="#1e40af">Prefill Stage (TTFT)</text>
      <text x="188.5" y="21" text-anchor="middle" class="bar-sub" fill="#1d4ed8">50–200 ms (Compute-Bound)</text>

      <!-- 4. Decode (TPOT) -->
      <rect x="269" y="0" width="205" height="24" rx="2" fill="#ffe4e6" stroke="#e11d48" stroke-width="0.8"/>
      <text x="371.5" y="12" text-anchor="middle" class="bar-lbl" fill="#be123c">Decode Stage (TPOT × S_gen)</text>
      <text x="371.5" y="21" text-anchor="middle" class="bar-sub" fill="#e11d48">15–30 ms/token (Memory-Bound)</text>

      <!-- 5. Postprocessing -->
      <rect x="477" y="0" width="45" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <text x="499.5" y="12" text-anchor="middle" class="bar-lbl" fill="#14294E">Post</text>
      <text x="499.5" y="21" text-anchor="middle" class="bar-sub" fill="#1F407A">&lt; 5 ms</text>
    </g>
  </g>
</svg>
