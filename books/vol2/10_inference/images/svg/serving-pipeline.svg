<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <pattern id="hatch-idle" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.2"/>
    </pattern>
  </defs>
  <!-- ===== zones ===== -->
  <rect x="20" y="16" width="220" height="334" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="34" y="38" text-anchor="start" font-size="12.5" font-weight="700" fill="#334155">CPU</text>
  <rect x="260" y="140" width="420" height="164" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="274" y="162" text-anchor="start" font-size="12.5" font-weight="700" fill="#334155">GPU</text>
  <!-- ===== request path ===== -->
  <rect x="45" y="52" width="170" height="36" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="130.0" y="74.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Requests</text>
  <rect x="45" y="112" width="170" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="130.0" y="128.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">Load balancer</text>
  <text x="130.0" y="144.45" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">route, admit</text>
  <rect x="45" y="176" width="170" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="130.0" y="192.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Tokenize</text>
  <text x="130.0" y="208.45" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">text to token IDs</text>
  <rect x="45" y="244" width="170" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="130.0" y="260.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Detokenize</text>
  <text x="130.0" y="276.45" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">token IDs to text</text>
  <rect x="45" y="304" width="170" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="130.0" y="324.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Response stream</text>
  <path d="M130.0,88 V110" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M130.0,152 V174" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M130.0,284 V302" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <!-- ===== gpu phases ===== -->
  <rect x="285" y="176" width="170" height="40" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="370.0" y="192.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Prefill</text>
  <text x="370.0" y="208.45" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">whole prompt, one pass</text>
  <rect x="490" y="176" width="170" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="575.0" y="192.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">KV cache</text>
  <text x="575.0" y="208.45" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">paged blocks in HBM</text>
  <rect x="490" y="244" width="170" height="40" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="575.0" y="260.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Decode</text>
  <text x="575.0" y="276.45" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">one token per step</text>
  <path d="M215,196 H283" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M455,196 H488" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="472.5" y="187" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">K, V</text>
  <path d="M550,216 V242" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M600,244 V218" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="542" y="234" text-anchor="end" font-size="12" font-weight="400" fill="#475569">read</text>
  <text x="606" y="234" text-anchor="start" font-size="12" font-weight="400" fill="#475569">append</text>
  <path d="M660,256 H674 V276 H662" fill="none" stroke="#1F407A" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <path d="M490,264 H217" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="352.5" y="258" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">generated token IDs</text>
  <!-- ===== latency budget strip (widths illustrative) ===== -->
  <rect x="20" y="396" width="54" height="28" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="47.0" y="414.5" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">route</text>
  <rect x="76" y="396" width="54" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="103.0" y="414.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">pre</text>
  <rect x="132" y="396" width="168" height="28" rx="2" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.2"/>
  <text x="216.0" y="414.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">prefill</text>
  <rect x="302" y="396" width="300" height="28" rx="2" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.2"/>
  <text x="452.0" y="414.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">decode steps</text>
  <rect x="604" y="396" width="54" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="631.0" y="414.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">post</text>
  <line x1="20" y1="388" x2="300" y2="388" stroke="#334155" stroke-width="1.2"/>
  <line x1="20" y1="383" x2="20" y2="393" stroke="#334155" stroke-width="1.2"/>
  <line x1="300" y1="383" x2="300" y2="393" stroke="#334155" stroke-width="1.2"/>
  <text x="160.0" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">time to first token (TTFT)</text>
  <line x1="302" y1="388" x2="602" y2="388" stroke="#334155" stroke-width="1.2"/>
  <line x1="302" y1="383" x2="302" y2="393" stroke="#334155" stroke-width="1.2"/>
  <line x1="602" y1="383" x2="602" y2="393" stroke="#334155" stroke-width="1.2"/>
  <text x="452.0" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">TPOT × output tokens</text>
</svg>
