<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -4 680 552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect y="-4" width="680" height="552" fill="#ffffff"/>
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ===== column headers and stage brackets ===== -->
  <text x="270" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU 0</text>
  <text x="530" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU 1</text>
  <path d="M136,44 H130 V180 H136" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="116" text-anchor="end" font-size="13" font-weight="700" fill="#334155">Attention</text>
  <path d="M136,200 H130 V440 H136" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="324" text-anchor="end" font-size="13" font-weight="700" fill="#334155">Feed-forward</text>

  <path d="M400,44 V140 M400,186 V400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== attention: each GPU owns half the heads ===== -->
  <!-- GPU 0: heads 1-4 owned, 5-8 ghost -->
  <g stroke-width="1.2">
    <rect x="170" y="50" width="20" height="40" rx="1" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A"/>
    <rect x="196" y="50" width="20" height="40" rx="1" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A"/>
    <rect x="222" y="50" width="20" height="40" rx="1" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A"/>
    <rect x="248" y="50" width="20" height="40" rx="1" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A"/>
    <rect x="274" y="50" width="20" height="40" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,2"/>
    <rect x="300" y="50" width="20" height="40" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,2"/>
    <rect x="326" y="50" width="20" height="40" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,2"/>
    <rect x="352" y="50" width="20" height="40" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,2"/>
  </g>
  <!-- GPU 1: heads 1-4 ghost, 5-8 owned -->
  <g stroke-width="1.2">
    <rect x="430" y="50" width="20" height="40" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,2"/>
    <rect x="456" y="50" width="20" height="40" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,2"/>
    <rect x="482" y="50" width="20" height="40" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,2"/>
    <rect x="508" y="50" width="20" height="40" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,2"/>
    <rect x="534" y="50" width="20" height="40" rx="1" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A"/>
    <rect x="560" y="50" width="20" height="40" rx="1" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A"/>
    <rect x="586" y="50" width="20" height="40" rx="1" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A"/>
    <rect x="612" y="50" width="20" height="40" rx="1" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A"/>
  </g>
  <path d="M219,91 V144" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="229" y="112" text-anchor="start" font-size="12" fill="#14294E" font-weight="700">first half of heads</text>
  <text x="229" y="130" text-anchor="start" font-size="12" fill="#475569">partial output</text>
  <path d="M583,91 V144" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="573" y="112" text-anchor="end" font-size="12" fill="#14294E" font-weight="700">second half of heads</text>
  <text x="573" y="130" text-anchor="end" font-size="12" fill="#475569">partial output</text>
  <rect x="150" y="146" width="500" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="400" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">AllReduce over NVLink</text>

  <!-- ===== feed-forward: W1 split by columns ===== -->
  <path d="M219,180 V202" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M583,180 V202" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- GPU 0 W1: left columns owned -->
  <rect x="219" y="204" width="35" height="70" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="184" y="204" width="35" height="70" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A" stroke-width="1.4"/>
  <path d="M184,221.5 H219 M184,239 H219 M184,256.5 H219 M201.5,204 V274" stroke="#1F407A" stroke-opacity="0.35" stroke-width="0.6"/>
  <!-- GPU 1 W1: right columns owned -->
  <rect x="548" y="204" width="35" height="70" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="583" y="204" width="35" height="70" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A" stroke-width="1.4"/>
  <path d="M583,221.5 H618 M583,239 H618 M583,256.5 H618 M600.5,204 V274" stroke="#1F407A" stroke-opacity="0.35" stroke-width="0.6"/>
  <text x="270" y="236" text-anchor="start" font-size="13" font-weight="700" fill="#14294E">Column slice of <tspan font-style="italic">W</tspan><tspan font-size="11" dy="4">1</tspan></text>
  <text x="270" y="253" text-anchor="start" font-size="12" fill="#475569">plus activation</text>
  <text x="532" y="236" text-anchor="end" font-size="13" font-weight="700" fill="#14294E">Column slice of <tspan font-style="italic">W</tspan><tspan font-size="11" dy="4">1</tspan></text>
  <text x="532" y="253" text-anchor="end" font-size="12" fill="#475569">plus activation</text>

  <path d="M201,274 V316" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="212" y="299" text-anchor="start" font-size="12" fill="#475569" font-style="italic">no communication</text>
  <path d="M600,274 V312 H550 V370.5 H563.5" fill="none" stroke-linejoin="round" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="589" y="299" text-anchor="end" font-size="12" fill="#475569" font-style="italic">no communication</text>

  <!-- ===== feed-forward: W2 split by rows ===== -->
  <!-- GPU 0 W2: top rows owned -->
  <rect x="166" y="353" width="70" height="35" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="166" y="318" width="70" height="35" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A" stroke-width="1.4"/>
  <path d="M183.5,318 V353 M201,318 V353 M218.5,318 V353 M166,335.5 H236" stroke="#1F407A" stroke-opacity="0.35" stroke-width="0.6"/>
  <!-- GPU 1 W2: bottom rows owned -->
  <rect x="565" y="318" width="70" height="35" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="565" y="353" width="70" height="35" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A" stroke-width="1.4"/>
  <path d="M582.5,353 V388 M600,353 V388 M617.5,353 V388 M565,370.5 H635" stroke="#1F407A" stroke-opacity="0.35" stroke-width="0.6"/>
  <text x="270" y="350" text-anchor="start" font-size="13" font-weight="700" fill="#14294E">Row slice of <tspan font-style="italic">W</tspan><tspan font-size="11" dy="4">2</tspan></text>
  <text x="270" y="367" text-anchor="start" font-size="12" fill="#475569">partial sum</text>
  <text x="532" y="350" text-anchor="end" font-size="13" font-weight="700" fill="#14294E">Row slice of <tspan font-style="italic">W</tspan><tspan font-size="11" dy="4">2</tspan></text>
  <text x="532" y="367" text-anchor="end" font-size="12" fill="#475569">partial sum</text>

  <path d="M236,335.5 H250 V404" fill="none" stroke-linejoin="round" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M600,388 V404" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="150" y="406" width="500" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="400" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">AllReduce over NVLink</text>
  <path d="M400,440 V458" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="320" y="460" width="160" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="400" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Next layer</text>

  <!-- ===== key ===== -->
  <rect x="200" y="510" width="14" height="14" rx="1" fill="#1F407A" fill-opacity="0.2" stroke="#1F407A" stroke-width="1.2"/>
  <text x="222" y="521" text-anchor="start" font-size="12" fill="#475569">held on this GPU</text>
  <rect x="400" y="510" width="14" height="14" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="422" y="521" text-anchor="start" font-size="12" fill="#475569">held on the other GPU</text>
</svg>
