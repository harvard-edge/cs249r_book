<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>
  <text x="260" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU 0</text>
  <text x="530" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">GPU 1</text>
  <path d="M134,44 H128 V162 H134" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="118" y="107" text-anchor="end" font-size="13" font-weight="700" fill="#334155">Attention</text>
  <path d="M134,196 H128 V398 H134" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="118" y="301" text-anchor="end" font-size="13" font-weight="700" fill="#334155">Feed-forward</text>
  <!-- ===== attention: heads split, partial outputs ===== -->
  <rect x="150" y="44" width="220" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="260" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Heads, first half</text>
  <text x="260" y="85" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">partial output</text>
  <rect x="420" y="44" width="220" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="530" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Heads, second half</text>
  <text x="530" y="85" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">partial output</text>
  <path d="M260,98 V126" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M530,98 V126" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="150" y="128" width="490" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="395" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">AllReduce over NVLink</text>
  <!-- ===== feed-forward: column then row split ===== -->
  <path d="M260,162 V194" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="150" y="196" width="220" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="260" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Column slice of <tspan font-style="italic">W</tspan><tspan font-size="11" dy="4">1</tspan><tspan dy="-4"> </tspan></text>
  <text x="260" y="237" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">plus activation</text>
  <path d="M260,250 V288" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="270" y="273" text-anchor="start" font-size="12" font-weight="400" fill="#475569" font-style="italic">no communication</text>
  <rect x="150" y="290" width="220" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="260" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Row slice of <tspan font-style="italic">W</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> </tspan></text>
  <text x="260" y="331" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">partial sum</text>
  <path d="M260,344 V362" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M530,162 V194" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="420" y="196" width="220" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="530" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Column slice of <tspan font-style="italic">W</tspan><tspan font-size="11" dy="4">1</tspan><tspan dy="-4"> </tspan></text>
  <text x="530" y="237" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">plus activation</text>
  <path d="M530,250 V288" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="540" y="273" text-anchor="start" font-size="12" font-weight="400" fill="#475569" font-style="italic">no communication</text>
  <rect x="420" y="290" width="220" height="54" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="530" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Row slice of <tspan font-style="italic">W</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> </tspan></text>
  <text x="530" y="331" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">partial sum</text>
  <path d="M530,344 V362" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="150" y="364" width="490" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="395" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">AllReduce over NVLink</text>
  <path d="M395,398 V418" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="315" y="420" width="160" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="395" y="441" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Next layer</text>
</svg>
