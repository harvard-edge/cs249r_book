  <text x="350" y="54" text-anchor="middle" font-size="12" fill="#475569">routes each user to an eligible, ready region</text>
  <path d="M 350,66 V 88" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <path d="M 123,88 H 577" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <path d="M 123,88 V 110" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <path d="M 350,88 V 110" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <path d="M 577,88 V 110" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <!-- ===== Region US-East ===== -->
  <rect x="20" y="112" width="206" height="132" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="123" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">US-East</text>
  <text x="123" y="152" text-anchor="middle" font-size="12" fill="#475569">serves North America</text>
  <rect x="35" y="168" width="81" height="60" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="75.5" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Replica 0</text>
  <text x="75.5" y="212" text-anchor="middle" font-size="12" fill="#475569">GPU server</text>
  <rect x="130" y="168" width="81" height="60" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="170.5" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Replica 1</text>
  <text x="170.5" y="212" text-anchor="middle" font-size="12" fill="#475569">GPU server</text>
  <!-- ===== Region EU-West ===== -->
  <rect x="247" y="112" width="206" height="132" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
