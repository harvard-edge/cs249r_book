  <path d="M 123,292 V 246" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <path d="M 350,292 V 246" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <path d="M 577,292 V 246" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="358" y="272" text-anchor="start" font-size="12" fill="#166534">sync</text>
  </g>
