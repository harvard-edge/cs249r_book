  <text x="350" y="152" text-anchor="middle" font-size="12" fill="#475569">EU data stays in region</text>
  <rect x="262" y="168" width="81" height="60" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="302.5" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Replica 0</text>
  <text x="302.5" y="212" text-anchor="middle" font-size="12" fill="#475569">GPU server</text>
  <rect x="357" y="168" width="81" height="60" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="397.5" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Replica 1</text>
  <text x="397.5" y="212" text-anchor="middle" font-size="12" fill="#475569">GPU server</text>
  <!-- ===== Region Asia-Pacific ===== -->
  <rect x="474" y="112" width="206" height="132" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="577" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Asia-Pacific</text>
  <text x="577" y="152" text-anchor="middle" font-size="12" fill="#475569">serves Asia and Oceania</text>
  <rect x="489" y="168" width="81" height="60" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="529.5" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Replica 0</text>
  <text x="529.5" y="212" text-anchor="middle" font-size="12" fill="#475569">GPU server</text>
  <rect x="584" y="168" width="81" height="60" rx="3" fill="#D6E4F2" stroke="#1F407A" stroke-width="1.4"/>
  <text x="624.5" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Replica 1</text>
  <text x="624.5" y="212" text-anchor="middle" font-size="12" fill="#475569">GPU server</text>
  <!-- ===== Model registry ===== -->
  <rect x="60" y="292" width="580" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="350" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Model registry</text>
