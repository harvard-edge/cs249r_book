<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 7px; font-weight: 700; fill: #ffffff; }
    .region-title { font-size: 8.5px; font-weight: 700; fill: #0f172a; }
    .replica-title { font-size: 7.5px; font-weight: 700; fill: #14294E; }
    .replica-sub { font-size: 6.8px; fill: #64748b; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- TOP SECTION: GLOBAL ANYCAST ROUTER / LOAD BALANCER                     -->
  <!-- ====================================================================== -->
  <g transform="translate(0, 20)">
    <!-- Global Load Balancer Card -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="400" height="60" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <rect x="12" y="8" width="180" height="15" rx="2" fill="#fde68a"/>
      <text x="102" y="18.5" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">GLOBAL TRAFFIC CONTROLLER</text>
      <text x="388" y="18.5" text-anchor="end" font-size="7" font-weight="600" fill="#b45309">Anycast DNS · Latency SLO</text>

      <g transform="translate(14, 28)">
        <rect x="0" y="0" width="118" height="22" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="59" y="14" text-anchor="middle" font-size="6.8" font-weight="600" fill="#78350f">RTT Probing (&lt; 20ms)</text>

        <rect x="126" y="0" width="120" height="22" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="186" y="14" text-anchor="middle" font-size="6.8" font-weight="600" fill="#78350f">Failover Cascades</text>

        <rect x="254" y="0" width="118" height="22" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="313" y="14" text-anchor="middle" font-size="6.8" font-weight="600" fill="#78350f">Geo-Fencing Policies</text>
      </g>
    </g>

    <!-- Fan-out routing paths to 3 regions -->
    <!-- Path to US-East -->
    <path d="M 240,60 L 240,82 L 138,82 L 138,105" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <rect x="155" y="73" width="70" height="16" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
    <text x="190" y="84" text-anchor="middle" font-size="6.8" font-weight="700" fill="#b45309">~12 ms RTT</text>

    <!-- Path to EU-West -->
    <path d="M 380,60 L 380,105" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <rect x="345" y="73" width="70" height="16" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
    <text x="380" y="84" text-anchor="middle" font-size="6.8" font-weight="700" fill="#b45309">~15 ms RTT</text>

    <!-- Path to Asia-Pac -->
    <path d="M 520,60 L 520,82 L 622,82 L 622,105" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <rect x="535" y="73" width="70" height="16" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
    <text x="570" y="84" text-anchor="middle" font-size="6.8" font-weight="700" fill="#b45309">~18 ms RTT</text>
  </g>

  <!-- ====================================================================== -->
  <!-- MIDDLE SECTION: 3 GEO-REGIONAL INFERENCE DEPLOYMENTS                   -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 128)">
    <!-- Region 0: US-East (Virginia / Ohio) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="225" height="182" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Region Header Badge -->
      <rect x="8" y="8" width="85" height="15" rx="2" fill="#1F407A"/>
      <text x="50.5" y="18.5" text-anchor="middle" class="badge-txt">US-EAST (VA)</text>
      <text x="100" y="19" font-size="7" font-weight="600" fill="#475569">45% Fleet Load</text>

      <!-- Replicas Grid -->
      <g transform="translate(8, 30)">
        <rect x="0" y="0" width="100" height="52" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
        <text x="50" y="15" text-anchor="middle" class="replica-title">Replica 0</text>
        <text x="50" y="27" text-anchor="middle" class="replica-sub">vLLM · 4× H100</text>
        <rect x="18" y="34" width="64" height="13" rx="2" fill="#dcfce7"/>
        <text x="50" y="43" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">Active</text>

        <rect x="108" y="0" width="100" height="52" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
        <text x="158" y="15" text-anchor="middle" class="replica-title">Replica 1</text>
        <text x="158" y="27" text-anchor="middle" class="replica-sub">vLLM · 4× H100</text>
        <rect x="126" y="34" width="64" height="13" rx="2" fill="#dcfce7"/>
        <text x="158" y="43" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">Active</text>
      </g>

      <!-- Latency Metric Box -->
      <g transform="translate(8, 90)">
        <rect x="0" y="0" width="208" height="42" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="10" y="15" font-size="7" font-weight="700" fill="#14294E">Latency Profile (US Clients)</text>
        <text x="10" y="27" font-size="6.8" fill="#475569"><tspan font-weight="600" fill="#334155">RTT Profile:</tspan><tspan dx="3">New York / DC: 10–14 ms</tspan></text>
        <text x="10" y="37" font-size="6.8" fill="#475569"><tspan font-weight="600" fill="#334155">Backbone:</tspan><tspan dx="3">Direct peering over AWS/GCP</tspan></text>
      </g>

      <!-- Failover indicator -->
      <g transform="translate(8, 138)">
        <rect x="0" y="0" width="208" height="34" rx="2" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8"/>
        <text x="104" y="13" text-anchor="middle" font-size="7" font-weight="700" fill="#047857">Primary Regional Anchor</text>
        <text x="104" y="25" text-anchor="middle" font-size="6.5" fill="#065f46">Absorbs Europe overflow during peak hours</text>
      </g>
    </g>

    <!-- Region 1: EU-West (Frankfurt / Dublin) -->
    <g transform="translate(242, 0)">
      <rect x="0" y="0" width="225" height="182" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Region Header Badge -->
      <rect x="8" y="8" width="85" height="15" rx="2" fill="#1F407A"/>
      <text x="50.5" y="18.5" text-anchor="middle" class="badge-txt">EU-WEST (DE)</text>
      <text x="100" y="19" font-size="7" font-weight="600" fill="#475569">35% Fleet Load</text>

      <!-- Replicas Grid -->
      <g transform="translate(8, 30)">
        <rect x="0" y="0" width="100" height="52" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
        <text x="50" y="15" text-anchor="middle" class="replica-title">Replica 0</text>
        <text x="50" y="27" text-anchor="middle" class="replica-sub">vLLM · 4× H100</text>
        <rect x="18" y="34" width="64" height="13" rx="2" fill="#dcfce7"/>
        <text x="50" y="43" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">Active</text>

        <rect x="108" y="0" width="100" height="52" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
        <text x="158" y="15" text-anchor="middle" class="replica-title">Replica 1</text>
        <text x="158" y="27" text-anchor="middle" class="replica-sub">vLLM · 4× H100</text>
        <rect x="126" y="34" width="64" height="13" rx="2" fill="#dcfce7"/>
        <text x="158" y="43" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">Active</text>
      </g>

      <!-- Latency Metric Box -->
      <g transform="translate(8, 90)">
        <rect x="0" y="0" width="208" height="42" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="10" y="15" font-size="7" font-weight="700" fill="#14294E">Latency Profile (EU Clients)</text>
        <text x="10" y="27" font-size="6.8" fill="#475569"><tspan font-weight="600" fill="#334155">RTT Profile:</tspan><tspan dx="3">London / Frankfurt: 8–15 ms</tspan></text>
        <text x="10" y="37" font-size="6.8" fill="#475569"><tspan font-weight="600" fill="#334155">Residency:</tspan><tspan dx="3">Local GPU keeps tokens in EU</tspan></text>
      </g>

      <!-- Regulatory Boundary Chip -->
      <g transform="translate(8, 138)">
        <rect x="0" y="0" width="208" height="34" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="0.8"/>
        <text x="104" y="13" text-anchor="middle" font-size="7" font-weight="700" fill="#1d4ed8">GDPR Compliance Boundary</text>
        <text x="104" y="25" text-anchor="middle" font-size="6.5" fill="#1e40af">Zero cross-border token replication</text>
      </g>
    </g>

    <!-- Region 2: Asia-Pacific (Tokyo / Singapore) -->
    <g transform="translate(484, 0)">
      <rect x="0" y="0" width="225" height="182" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Region Header Badge -->
      <rect x="8" y="8" width="85" height="15" rx="2" fill="#1F407A"/>
      <text x="50.5" y="18.5" text-anchor="middle" class="badge-txt">AP-EAST (TYO)</text>
      <text x="100" y="19" font-size="7" font-weight="600" fill="#475569">20% Fleet Load</text>

      <!-- Replicas Grid -->
      <g transform="translate(8, 30)">
        <rect x="0" y="0" width="100" height="52" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
        <text x="50" y="15" text-anchor="middle" class="replica-title">Replica 0</text>
        <text x="50" y="27" text-anchor="middle" class="replica-sub">vLLM · 4× H100</text>
        <rect x="18" y="34" width="64" height="13" rx="2" fill="#dcfce7"/>
        <text x="50" y="43" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">Active</text>

        <rect x="108" y="0" width="100" height="52" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1"/>
        <text x="158" y="15" text-anchor="middle" class="replica-title">Replica 1</text>
        <text x="158" y="27" text-anchor="middle" class="replica-sub">vLLM · 4× H100</text>
        <rect x="126" y="34" width="64" height="13" rx="2" fill="#dcfce7"/>
        <text x="158" y="43" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">Active</text>
      </g>

      <!-- Latency Metric Box -->
      <g transform="translate(8, 90)">
        <rect x="0" y="0" width="208" height="42" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="10" y="15" font-size="7" font-weight="700" fill="#14294E">Latency Profile (APAC Clients)</text>
        <text x="10" y="27" font-size="6.8" fill="#475569"><tspan font-weight="600" fill="#334155">RTT Profile:</tspan><tspan dx="3">Tokyo / Singapore: 12–18 ms</tspan></text>
        <text x="10" y="37" font-size="6.8" fill="#475569"><tspan font-weight="600" fill="#334155">Avoidance:</tspan><tspan dx="3">Bypasses 160 ms trans-Pacific RTT</tspan></text>
      </g>

      <!-- Failover indicator -->
      <g transform="translate(8, 138)">
        <rect x="0" y="0" width="208" height="34" rx="2" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="104" y="13" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">Disaster Recovery Target</text>
        <text x="104" y="25" text-anchor="middle" font-size="6.5" fill="#92400e">Reroutes to US-East on local undersea cable faults</text>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- MIDDLE-LOWER SECTION: SYNCHRONIZED MODEL REGISTRY LAYER                -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 320)">
    <rect x="0" y="0" width="710" height="52" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect x="12" y="8" width="165" height="15" rx="2" fill="#16a34a"/>
    <text x="94.5" y="18.5" text-anchor="middle" class="badge-txt">GLOBAL MODEL REGISTRY</text>
    <text x="190" y="19" font-size="7.2" font-weight="700" fill="#15803d">S3 / GCS Multi-Region Replication · Version-Pinned Checkpoints</text>

    <!-- Connectors up to regions -->
    <path d="M 112,0 L 112,-10" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>
    <path d="M 355,0 L 355,-10" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>
    <path d="M 596,0 L 596,-10" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>

    <text x="12" y="38" font-size="7.2" fill="#166534">
      <tspan font-weight="600" fill="#15803d">Sync Mechanism:</tspan><tspan dx="3">Replicates model weights, LoRA adapters, and tokenizers via geo-replication with sha256 pinning.</tspan>
    </text>
  </g>

  <!-- ====================================================================== -->
  <!-- BOTTOM SECTION: ARCHITECTURAL & FAILOVER CALLOUT                       -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 384)">
    <rect x="0" y="0" width="710" height="74" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="8" width="180" height="16" rx="2" fill="#e2e8f0"/>
    <text x="102" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">GEO-ROUTING &amp; DISASTER RECOVERY</text>

    <text x="12" y="38" font-size="7.5" fill="#334155">
      <tspan font-weight="700" fill="#14294E">Latency Anycast:</tspan><tspan dx="3">Directs user requests to topologically nearest datacenter, reducing client TTFT (&lt; 20 ms vs. 150+ ms transoceanic).</tspan>
    </text>
    <text x="12" y="52" font-size="7.5" fill="#334155">
      <tspan font-weight="700" fill="#be123c">Automated Failover:</tspan><tspan dx="3">Monitors GPU queue depths; if a region degrades, traffic dynamically sheds to adjacent healthy regions within 3s.</tspan>
    </text>
    <text x="12" y="66" font-size="7.5" fill="#334155">
      <tspan font-weight="700" fill="#15803d">Data Sovereignty:</tspan><tspan dx="3">Requests flagged with residency constraints (e.g. GDPR) remain strictly locked to compliant regional boundaries.</tspan>
    </text>
  </g>
</svg>