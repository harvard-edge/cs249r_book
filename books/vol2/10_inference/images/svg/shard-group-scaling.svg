        <rect x="0" y="0" width="207" height="46" rx="2" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
        <text x="103.5" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#047857">Single Logical Replica (vLLM / TRT-LLM)</text>
        <text x="103.5" y="26" text-anchor="middle" font-size="6.8" fill="#065f46">Intra-Node NVLink / NVSwitch Domain (900 GB/s)</text>
        <text x="103.5" y="38" text-anchor="middle" font-size="6.8" font-weight="600" fill="#047857">• AllReduce latency bounded &lt; 5 µs</text>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- BOTTOM SECTION: ARCHITECTURAL PRINCIPLE CALLOUT CARD                   -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 380)">
    <rect x="0" y="0" width="710" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="8" width="165" height="16" rx="2" fill="#e2e8f0"/>
    <text x="94.5" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">SCALING DUALITY: TP VS. DP</text>

    <text x="12" y="38" font-size="7.5" fill="#334155">
      <tspan font-weight="700" fill="#0369a1">• Horizontal Scaling (Data Parallelism across Shard Groups):</tspan> Adds independent shard groups to scale aggregate query throughput linearly without cross-node synchronization.
    </text>
    <text x="12" y="52" font-size="7.5" fill="#334155">
      <tspan font-weight="700" fill="#047857">• Vertical Scaling (Tensor Parallelism within Shard Group):</tspan> Partitions model weights across 8 GPUs via 900 GB/s NVLink to fit massive models and bound single-token generation latency.
    </text>
  </g>

  <!-- Footer Insight -->
  <text x="380" y="472" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    The load balancer treats each 8-GPU tensor parallel group as a single logical server, isolating frequent AllReduce communication to local NVLink fabric.
  </text>
</svg>
