        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="48" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.9"/>
          <text x="24" y="12" text-anchor="middle" class="gpu-title">GPU 0</text>
          <text x="24" y="22" text-anchor="middle" class="gpu-sub">Shard 0/8</text>

          <rect x="53" y="0" width="48" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.9"/>
          <text x="77" y="12" text-anchor="middle" class="gpu-title">GPU 1</text>
          <text x="77" y="22" text-anchor="middle" class="gpu-sub">Shard 1/8</text>

          <rect x="106" y="0" width="48" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.9"/>
          <text x="130" y="12" text-anchor="middle" class="gpu-title">GPU 2</text>
          <text x="130" y="22" text-anchor="middle" class="gpu-sub">Shard 2/8</text>

          <rect x="159" y="0" width="48" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.9"/>
          <text x="183" y="12" text-anchor="middle" class="gpu-title">GPU 3</text>
          <text x="183" y="22" text-anchor="middle" class="gpu-sub">Shard 3/8</text>
        </g>

        <!-- Row 2: GPU 4..7 -->
        <g transform="translate(0, 32)">
          <rect x="0" y="0" width="48" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.9"/>
          <text x="24" y="12" text-anchor="middle" class="gpu-title">GPU 4</text>
          <text x="24" y="22" text-anchor="middle" class="gpu-sub">Shard 4/8</text>

          <rect x="53" y="0" width="48" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.9"/>
          <text x="77" y="12" text-anchor="middle" class="gpu-title">GPU 5</text>
          <text x="77" y="22" text-anchor="middle" class="gpu-sub">Shard 5/8</text>

          <rect x="106" y="0" width="48" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.9"/>
          <text x="130" y="12" text-anchor="middle" class="gpu-title">GPU 6</text>
          <text x="130" y="22" text-anchor="middle" class="gpu-sub">Shard 6/8</text>

          <rect x="159" y="0" width="48" height="28" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.9"/>
          <text x="183" y="12" text-anchor="middle" class="gpu-title">GPU 7</text>
