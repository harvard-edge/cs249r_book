<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="100%" height="100%">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#0284c7"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .card-title { font-size: 8.5px; font-weight: 700; fill: #0f172a; }
    .card-sub { font-size: 7.5px; fill: #475569; }
    .badge-txt { font-size: 7px; font-weight: 700; fill: #ffffff; }
    .gpu-title { font-size: 7.5px; font-weight: 700; fill: #0369a1; }
    .gpu-sub { font-size: 6.5px; fill: #64748b; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- TOP SECTION: CONCURRENT CLIENT INGRESS & LOAD BALANCER                 -->
  <!-- ====================================================================== -->
  <g transform="translate(40, 20)">
    <!-- Incoming Request Stream -->
    <g transform="translate(140, 0)">
      <text x="200" y="12" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">CONCURRENT CLIENT INGRESS STREAM</text>
      
      <!-- Req Chips -->
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="75" height="24" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
        <text x="37.5" y="15" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1d4ed8">Request A</text>

        <rect x="90" y="0" width="75" height="24" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
        <text x="127.5" y="15" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1d4ed8">Request B</text>

        <rect x="180" y="0" width="75" height="24" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
        <text x="217.5" y="15" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1d4ed8">Request C</text>

        <text x="272" y="16" font-size="11" fill="#94a3b8" font-weight="700">···</text>

        <rect x="300" y="0" width="75" height="24" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
        <text x="337.5" y="15" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1d4ed8">Request N</text>
      </g>

      <!-- Converging Arrows to LB -->
      <path d="M 37.5,46 L 160,82" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <path d="M 127.5,46 L 180,82" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <path d="M 217.5,46 L 220,82" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <path d="M 337.5,46 L 240,82" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    </g>

    <!-- Load Balancer Card -->
    <g transform="translate(190, 84)">
      <rect x="0" y="0" width="300" height="62" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <rect x="10" y="8" width="135" height="16" rx="2" fill="#fde68a"/>
      <text x="77.5" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">INFERENCE LOAD BALANCER</text>
      
      <!-- Routing Policy Tags -->
      <g transform="translate(10, 32)">
        <rect x="0" y="0" width="85" height="20" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="42.5" y="13" text-anchor="middle" font-size="6.8" font-weight="600" fill="#78350f">Power-of-Two (P2C)</text>

        <rect x="92" y="0" width="88" height="20" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="136" y="13" text-anchor="middle" font-size="6.8" font-weight="600" fill="#78350f">Least-Outstanding-Reqs</text>

        <rect x="187" y="0" width="88" height="20" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="231" y="13" text-anchor="middle" font-size="6.8" font-weight="600" fill="#78350f">KV-Affinity Hash</text>
      </g>
    </g>

    <!-- Fan-out Routing Arrows from LB to Shard Groups -->
    <path d="M 230,146 L 105,188" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <path d="M 340,146 L 340,188" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <path d="M 450,146 L 575,188" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  </g>

