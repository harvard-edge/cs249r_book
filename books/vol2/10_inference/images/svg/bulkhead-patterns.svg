<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="390" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <!-- ===== gold tier: dedicated replicas ===== -->
  <rect x="20" y="20" width="660" height="118" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="36" y="42" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">Gold tier</text>
  <rect x="40" y="69" width="100" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="90" y="95.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Clients</text>
  <rect x="170" y="69" width="120" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="230" y="95.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Load balancer</text>
  <path d="M140,91 H168" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M290,91 H310" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M310,70 V112" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M310,70 H328" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="330" y="54" width="150" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="405" y="74.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Replica 1</text>
  <path d="M310,112 H328" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="330" y="96" width="150" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="405" y="116.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Replica 2</text>
  <text x="500" y="95" text-anchor="start" font-size="12.5" font-weight="700" fill="#166534">keeps serving</text>
  <!-- ===== bulkhead between dedicated pools ===== -->
  <line x1="20" y1="152" x2="680" y2="152" stroke="#334155" stroke-width="2.5"/>
  <rect x="560" y="143" width="80" height="18" fill="#ffffff"/>
  <text x="600" y="156.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">bulkhead</text>
  <!-- ===== standard tier: one engine crash ===== -->
  <rect x="20" y="166" width="660" height="160" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="36" y="188" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">Standard tier</text>
  <rect x="40" y="236" width="100" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="90" y="262.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Clients</text>
  <rect x="170" y="236" width="120" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="230" y="262.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Load balancer</text>
  <path d="M140,258 H168" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M290,258 H310" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M310,216 V300" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M310,216 H328" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="330" y="200" width="150" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="405" y="220.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Replica 3</text>
  <path d="M310,258 H328" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="330" y="242" width="150" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="405" y="262.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">Replica 4</text>
  <path d="M310,300 H328" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="330" y="284" width="150" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="405" y="304.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Replica 5</text>
  <text x="500" y="262" text-anchor="start" font-size="12.5" font-weight="700" fill="#991b1b">engine crash</text>
  <!-- ===== shared dependencies outside the bulkhead ===== -->
  <rect x="20" y="340" width="660" height="32" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="1,2"/>
  <text x="350" y="360.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">shared network, storage, and control plane</text>
</svg>
