<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 760 310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#008F45"/>
    </marker>
    <marker id="arrow-green-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#008F45"/>
    </marker>
  </defs>
  <style>
    .lane { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .bx { font-size: 13px; fill: #0f172a; }
    .tk { font-size: 13px; font-style: italic; fill: #0f172a; }
    .tks { font-size: 12.5px; font-style: normal; }
    .ann { font-size: 12.5px; fill: #475569; }
  </style>
  <rect width="760" height="328" fill="#ffffff"/>

  <!-- ===== Time guides (behind the lanes) ===== -->
  <line x1="402" y1="122" x2="402" y2="198" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="660" y1="84" x2="660" y2="284" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- ===== Standard decoding: four full target passes, one token each ===== -->
  <text x="20" y="58" class="lane">Standard</text>
  <text x="20" y="75" class="lane">decoding</text>
  <rect x="140" y="40" width="126" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="203" y="66" text-anchor="middle" class="bx">target pass</text>
  <rect x="270" y="40" width="126" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="333" y="66" text-anchor="middle" class="bx">target pass</text>
  <rect x="400" y="40" width="126" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="463" y="66" text-anchor="middle" class="bx">target pass</text>
  <rect x="530" y="40" width="130" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="595" y="66" text-anchor="middle" class="bx">target pass</text>
  <!-- emitted tokens, one at the end of each pass -->
  <rect x="240" y="92" width="26" height="24" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="253" y="108" text-anchor="middle" class="tk">T<tspan class="tks" dy="3">1</tspan></text>
  <rect x="370" y="92" width="26" height="24" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="383" y="108" text-anchor="middle" class="tk">T<tspan class="tks" dy="3">2</tspan></text>
  <rect x="500" y="92" width="26" height="24" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="513" y="108" text-anchor="middle" class="tk">T<tspan class="tks" dy="3">3</tspan></text>
  <rect x="634" y="92" width="26" height="24" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="647" y="108" text-anchor="middle" class="tk">T<tspan class="tks" dy="3">4</tspan></text>

  <!-- ===== Speculative decoding: four cheap draft steps, one verify pass ===== -->
  <text x="20" y="168" class="lane">Speculative</text>
  <text x="20" y="185" class="lane">decoding</text>
  <text x="193" y="142" text-anchor="middle" class="ann">draft</text>
  <rect x="140" y="150" width="26" height="44" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="153" y="176" text-anchor="middle" class="tk" font-size="12.5">T<tspan class="tks" dy="3">1</tspan></text>
  <rect x="168" y="150" width="26" height="44" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="181" y="176" text-anchor="middle" class="tk" font-size="12.5">T<tspan class="tks" dy="3">2</tspan></text>
  <rect x="196" y="150" width="26" height="44" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="209" y="176" text-anchor="middle" class="tk" font-size="12.5">T<tspan class="tks" dy="3">3</tspan></text>
  <rect x="224" y="150" width="26" height="44" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="237" y="176" text-anchor="middle" class="tk" font-size="12.5">T<tspan class="tks" dy="3">4</tspan></text>
  <rect x="256" y="150" width="146" height="44" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="329" y="168" text-anchor="middle" class="bx">target pass</text>
  <text x="329" y="185" text-anchor="middle" class="bx">verify <tspan font-style="italic">T</tspan><tspan class="tks" dy="3">1</tspan><tspan dy="-3">–</tspan><tspan font-style="italic">T</tspan><tspan class="tks" dy="3">4</tspan></text>

  <!-- time saved -->
  <text x="531" y="164" text-anchor="middle" class="ann" fill="#008F45">time saved for the same four tokens</text>
  <line x1="406" y1="178" x2="656" y2="178" stroke="#008F45" stroke-width="1.5" marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green)"/>

  <!-- verify output: emitted together at the end of the verify pass -->
  <rect x="256" y="202" width="26" height="24" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="269" y="218" text-anchor="middle" class="tk">T<tspan class="tks" dy="3">1</tspan></text>
  <rect x="286" y="202" width="26" height="24" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="299" y="218" text-anchor="middle" class="tk">T<tspan class="tks" dy="3">2</tspan></text>
  <rect x="316" y="202" width="26" height="24" rx="2" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="329" y="218" text-anchor="middle" class="tk">T<tspan class="tks" dy="3">3</tspan></text>
  <!-- the first rejected draft token is replaced by a corrected sample -->
  <rect x="346" y="202" width="26" height="24" rx="2" fill="#F5D2D5" stroke="#CB202D" stroke-width="1.2"/>
  <text x="359" y="218" text-anchor="middle" class="tk">T<tspan class="tks" dy="3">4</tspan></text>
  <line x1="350" y1="222" x2="368" y2="206" stroke="#CB202D" stroke-width="1.2"/>
  <text x="380" y="218" class="ann">rejected</text>
  <line x1="359" y1="226" x2="359" y2="236" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="346" y="238" width="26" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="359" y="254" text-anchor="middle" class="tk">T<tspan class="tks" dy="3">4</tspan><tspan dy="-3" font-style="normal">′</tspan></text>
  <text x="380" y="254" class="ann">resampled</text>
  <text x="248" y="218" text-anchor="end" class="ann">accepted</text>

  <!-- ===== Shared time axis ===== -->
  <line x1="140" y1="284" x2="704" y2="284" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="140" y1="280" x2="140" y2="288" stroke="#555" stroke-width="1.2"/>
  <line x1="402" y1="279" x2="402" y2="289" stroke="#555" stroke-width="1.2"/>
  <line x1="660" y1="279" x2="660" y2="289" stroke="#555" stroke-width="1.2"/>
  <text x="704" y="274" text-anchor="end" class="ann">time</text>
  <text x="402" y="304" text-anchor="middle" class="ann">speculative: 4 tokens</text>
  <text x="660" y="304" text-anchor="middle" class="ann">standard: 4 tokens</text>
</svg>
