<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="224" y="22" width="240" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="344" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Requests</text>
  <text x="344" y="57" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">tagged with an SLO class</text>
  <path d="M344,66 V92" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <!-- ===== pools ===== -->
  <rect x="20" y="204" width="304" height="156" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="364" y="204" width="304" height="156" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
  <!-- ===== traffic lanes: total width proportional to share; draining worker gets none ===== -->
  <path d="M210,144 V176 H78 V224" fill="none" stroke="#c3cdd9" stroke-width="5" stroke-linejoin="round"/>
  <path d="M71.5,224 L84.5,224 L78,235 Z" fill="#8f9db0"/>
  <path d="M240,144 V188 H172 V224" fill="none" stroke="#c3cdd9" stroke-width="5" stroke-linejoin="round"/>
  <path d="M165.5,224 L178.5,224 L172,235 Z" fill="#8f9db0"/>
  <path d="M266,144 V224" fill="none" stroke="#c3cdd9" stroke-width="5" stroke-linejoin="round"/>
  <path d="M259.5,224 L272.5,224 L266,235 Z" fill="#8f9db0"/>
  <path d="M422,144 V224" fill="none" stroke="#c3cdd9" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M416.4,224 L427.6,224 L422,235 Z" fill="#8f9db0"/>
  <path d="M462,144 V176 H516 V224" fill="none" stroke="#c3cdd9" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M510.4,224 L521.6,224 L516,235 Z" fill="#8f9db0"/>
  <text x="280" y="190" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">SLO-critical (70%)</text>
  <text x="530" y="190" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">best-effort (30%)</text>
  <rect x="174" y="94" width="340" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="344" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Spot-aware gateway</text>
  <text x="344" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">classify SLO, watch preemption, drain</text>
  <rect x="36" y="236" width="84" height="58" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="78" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Worker 0</text>
  <text x="78" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">on-demand</text>
  <rect x="130" y="236" width="84" height="58" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="172" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Worker 1</text>
  <text x="172" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">on-demand</text>
  <rect x="224" y="236" width="84" height="58" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="266" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Worker 2</text>
  <text x="266" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">on-demand</text>
  <rect x="380" y="236" width="84" height="58" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="422" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Worker 3</text>
  <text x="422" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">spot</text>
  <rect x="474" y="236" width="84" height="58" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.4"/>
  <text x="516" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Worker 4</text>
  <text x="516" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">spot</text>
  <rect x="568" y="236" width="84" height="58" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="610" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Worker 5</text>
  <text x="610" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">draining</text>
  <text x="172" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">On-demand pool</text>
  <text x="172" y="342" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">no spot reclamation</text>
  <text x="516" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Spot pool</text>
  <text x="516" y="342" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">discounted, can be preempted</text>
  <path d="M652,265 H698 V119 H516" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="690" y="111" text-anchor="end" font-size="12" font-weight="700" fill="#b91c1c">eviction notice</text>
