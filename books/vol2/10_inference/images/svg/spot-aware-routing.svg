<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 7px; font-weight: 700; fill: #ffffff; }
    .worker-title { font-size: 8px; font-weight: 700; fill: #0f172a; }
    .worker-sub { font-size: 7px; fill: #64748b; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- TOP SECTION: INGRESS & SPOT-AWARE LOAD BALANCER                        -->
  <!-- ====================================================================== -->
  <g transform="translate(0, 18)">
    <!-- Ingress Request Box -->
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="300" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="8" y="6" width="130" height="14" rx="2" fill="#e2e8f0"/>
      <text x="73" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">INCOMING INFERENCE REQUESTS</text>
      <text x="150" y="31" text-anchor="middle" font-size="7.2" fill="#64748b">Classified by Service Level Objective (SLO) Tier &amp; Tolerance</text>
    </g>

    <!-- Arrow Ingress -> LB -->
    <path d="M 380,40 L 380,62" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <!-- Spot-Aware Gateway / Load Balancer -->
    <g transform="translate(140, 64)">
      <rect x="0" y="0" width="480" height="66" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <rect x="12" y="8" width="165" height="15" rx="2" fill="#fde68a"/>
      <text x="94.5" y="18.5" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">SPOT-AWARE TRAFFIC GATEWAY</text>

      <!-- Sub-components -->
      <g transform="translate(12, 30)">
        <rect x="0" y="0" width="142" height="26" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="71" y="11" text-anchor="middle" font-size="7" font-weight="700" fill="#78350f">SLO Classifier</text>
        <text x="71" y="21" text-anchor="middle" font-size="6.3" fill="#92400e">Interactive vs. Batch Routing</text>

        <rect x="156" y="0" width="144" height="26" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="228" y="11" text-anchor="middle" font-size="7" font-weight="700" fill="#78350f">Preemption Monitor</text>
        <text x="228" y="21" text-anchor="middle" font-size="6.3" fill="#92400e">Cloud Webhook / Poll (2m Signal)</text>

        <rect x="314" y="0" width="142" height="26" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="385" y="11" text-anchor="middle" font-size="7" font-weight="700" fill="#78350f">Drain Orchestrator</text>
        <text x="385" y="21" text-anchor="middle" font-size="6.3" fill="#92400e">Reroute Ingress · Flush Batches</text>
      </g>
    </g>

    <!-- Straight Down Routing Arrows to Fleets -->
    <!-- On-Demand Arrow (Left) -->
    <path d="M 197.5,130 L 197.5,193" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <g transform="translate(130, 150)">
      <rect x="0" y="0" width="135" height="20" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="67.5" y="13.5" text-anchor="middle" font-size="7.2" font-weight="700" fill="#15803d">70% Critical / Interactive</text>
    </g>

    <!-- Spot Arrow (Right) -->
    <path d="M 562.5,130 L 562.5,193" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arr-amber)"/>
    <g transform="translate(495, 150)">
      <rect x="0" y="0" width="135" height="20" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
      <text x="67.5" y="13.5" text-anchor="middle" font-size="7.2" font-weight="700" fill="#b45309">30% Delay-Tolerant / Spot</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- MIDDLE SECTION: PARALLEL WORKER FLEETS (ON-DEMAND VS. SPOT)            -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 215)">
    <!-- Column 1: On-Demand Replicas (Green/Emerald Theme) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="345" height="185" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      
      <!-- Column Header -->
      <rect x="12" y="10" width="135" height="16" rx="2" fill="#16a34a"/>
      <text x="79.5" y="21" text-anchor="middle" class="badge-txt">ON-DEMAND REPLICAS</text>
      <text x="160" y="22" font-size="7" font-weight="600" fill="#166534">Guaranteed SLA Fleet</text>

      <!-- Worker 0, Worker 1, Worker 2 -->
      <g transform="translate(12, 36)">
        <!-- Worker 0 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="98" height="74" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
          <text x="49" y="16" text-anchor="middle" class="worker-title" fill="#15803d">Worker 0</text>
          <text x="49" y="30" text-anchor="middle" class="worker-sub">Reserved GPU</text>
          <rect x="14" y="44" width="70" height="18" rx="2" fill="#dcfce7"/>
          <text x="49" y="56" text-anchor="middle" font-size="6.8" font-weight="700" fill="#15803d">100% Uptime</text>
        </g>

        <!-- Worker 1 -->
        <g transform="translate(112, 0)">
          <rect x="0" y="0" width="98" height="74" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
          <text x="49" y="16" text-anchor="middle" class="worker-title" fill="#15803d">Worker 1</text>
          <text x="49" y="30" text-anchor="middle" class="worker-sub">Reserved GPU</text>
          <rect x="14" y="44" width="70" height="18" rx="2" fill="#dcfce7"/>
          <text x="49" y="56" text-anchor="middle" font-size="6.8" font-weight="700" fill="#15803d">100% Uptime</text>
        </g>

        <!-- Worker 2 -->
        <g transform="translate(224, 0)">
          <rect x="0" y="0" width="98" height="74" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
          <text x="49" y="16" text-anchor="middle" class="worker-title" fill="#15803d">Worker 2</text>
          <text x="49" y="30" text-anchor="middle" class="worker-sub">Reserved GPU</text>
          <rect x="14" y="44" width="70" height="18" rx="2" fill="#dcfce7"/>
          <text x="49" y="56" text-anchor="middle" font-size="6.8" font-weight="700" fill="#15803d">100% Uptime</text>
        </g>
      </g>

      <!-- Guarantee Summary Badge -->
      <g transform="translate(12, 124)">
        <rect x="0" y="0" width="321" height="48" rx="3" fill="#ffffff" stroke="#22c55e" stroke-width="0.9"/>
        <text x="12" y="18" font-size="7.5" font-weight="700" fill="#15803d">SLO-Critical Latency Guarantees</text>
        <text x="12" y="31" font-size="7" fill="#475569"><tspan font-weight="600" fill="#15803d">Zero Eviction:</tspan><tspan dx="3">Guaranteed stability; in-flight KV cache preserved</tspan></text>
        <text x="12" y="42" font-size="7" fill="#475569"><tspan font-weight="600" fill="#15803d">P99 Latency:</tspan><tspan dx="3">Absorbs traffic spikes and mission-critical API queries</tspan></text>
      </g>
    </g>

    <!-- Column 2: Spot / Preemptible Replicas (Amber/Rose Theme) -->
    <g transform="translate(365, 0)">
      <rect x="0" y="0" width="345" height="185" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
      
      <!-- Column Header -->
      <rect x="12" y="10" width="135" height="16" rx="2" fill="#d97706"/>
      <text x="79.5" y="21" text-anchor="middle" class="badge-txt">SPOT / PREEMPTIBLE FLEET</text>
      <text x="160" y="22" font-size="7" font-weight="600" fill="#b45309">Cost-Optimized Fleet</text>

      <!-- Worker 3, Worker 4, Worker 5 (Draining) -->
      <g transform="translate(12, 36)">
        <!-- Worker 3 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="98" height="74" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
          <text x="49" y="16" text-anchor="middle" class="worker-title" fill="#b45309">Worker 3</text>
          <text x="49" y="30" text-anchor="middle" class="worker-sub">Spot GPU (~70% off)</text>
          <rect x="14" y="44" width="70" height="18" rx="2" fill="#fef3c7"/>
          <text x="49" y="56" text-anchor="middle" font-size="6.8" font-weight="700" fill="#b45309">Active Serving</text>
        </g>

        <!-- Worker 4 -->
        <g transform="translate(112, 0)">
          <rect x="0" y="0" width="98" height="74" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
          <text x="49" y="16" text-anchor="middle" class="worker-title" fill="#b45309">Worker 4</text>
          <text x="49" y="30" text-anchor="middle" class="worker-sub">Spot GPU (~70% off)</text>
          <rect x="14" y="44" width="70" height="18" rx="2" fill="#fef3c7"/>
          <text x="49" y="56" text-anchor="middle" font-size="6.8" font-weight="700" fill="#b45309">Active Serving</text>
        </g>

        <!-- Worker 5: Preempted / Draining -->
        <g transform="translate(224, 0)">
          <rect x="0" y="0" width="98" height="74" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3,2"/>
          <text x="49" y="16" text-anchor="middle" class="worker-title" fill="#be123c">Worker 5</text>
          <text x="49" y="30" text-anchor="middle" font-size="7" fill="#e11d48">Eviction Notice (2m)</text>
          <rect x="14" y="44" width="70" height="18" rx="2" fill="#ffe4e6"/>
          <text x="49" y="56" text-anchor="middle" font-size="6.8" font-weight="700" fill="#e11d48">Draining Queue</text>
        </g>
      </g>

      <!-- Spot Economics & Failover Badge -->
      <g transform="translate(12, 124)">
        <rect x="0" y="0" width="321" height="48" rx="3" fill="#ffffff" stroke="#f59e0b" stroke-width="0.9"/>
        <text x="12" y="18" font-size="7.5" font-weight="700" fill="#b45309">Preemption Tolerance &amp; Economics</text>
        <text x="12" y="31" font-size="7" fill="#475569"><tspan font-weight="600" fill="#b45309">Discount:</tspan><tspan dx="3">60–75% compute savings with 2-minute preemption notice</tspan></text>
        <text x="12" y="42" font-size="7" fill="#475569"><tspan font-weight="600" fill="#b45309">Failover:</tspan><tspan dx="3">Gateway halts traffic to draining worker; falls back to on-demand</tspan></text>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- BOTTOM SECTION: ECONOMIC & FAULT-TOLERANCE CALLOUT                     -->
  <!-- ====================================================================== -->
  <g transform="translate(25, 415)">
    <rect x="0" y="0" width="710" height="66" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="8" width="180" height="16" rx="2" fill="#e2e8f0"/>
    <text x="102" y="19" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">FLEET BLENDING &amp; PREEMPTION PROTOCOL</text>

    <text x="12" y="38" font-size="7.5" fill="#334155">
      <tspan font-weight="700" fill="#15803d">Cost Reduction:</tspan><tspan dx="4">Blending 70% reserved with 30% spot reduces fleet TCO by ~20–25% while preserving SLAs.</tspan>
    </text>
    <text x="12" y="52" font-size="7.5" fill="#334155">
      <tspan font-weight="700" fill="#be123c">Graceful Eviction:</tspan><tspan dx="4">On 2-minute termination notice, gateway halts ingress and flushes active tokens without drops.</tspan>
    </text>
  </g>
</svg>
