    relationships:
    - id: vol2.field.30
      source: vol2.serving.batching
      predicate: trades waiting against
      target: vol2.serving.slo-goodput
      explanation: Batching improves reuse but can make requests miss the serving latency contract.
      conditions: A batch policy must be evaluated at the specified arrival process and latency percentile.
      status: draft
      evidence:
        section: sec-inference-scale-batching-strategies-scale-6733
        quote: Processing multiple requests together shares weight reads and kernel launch overhead across
          more useful work. The resulting service-rate gain can reduce queueing, but waiting to form a batch
          adds delay; the net effect on request latency depends on load. Single-machine serving applies
          this insight through dynamic batching\index{Dynamic batching}, which collects requests within
          a time window before processing them together.
    - id: vol2.field.31
      source: vol2.serving.kv-cache
      predicate: bounds
      target: vol2.serving.concurrency
      explanation: Growing per-request KV state constrains how many active sequences can share a replica.
      conditions: Capacity depends on model, precision, sequence lengths, allocator behavior, and reserved
        headroom.
      status: draft
      evidence:
        section: sec-inference-scale-kv-cache-wall
        quote: A replica's KV footprint is that cost multiplied by every token it holds, $\KvCacheMemory
          = \BatchSize \times \SequenceLength \times \KvCacheBytesPerToken$, so the largest admissible batch
          at context $\SequenceLength$ is the HBM left after weights and runtime allocations divided by
          $\SequenceLength \times \KvCacheBytesPerToken$. Each serving lever acts on a different factor.
          Grouped-query attention lowers $\KvHeadCount$, KV quantization lowers $\ElementStorageSize$, a
          shorter admitted context lowers $\SequenceLength$, and paging returns HBM lost to fragmentation
          without changing the per-token cost. The notebook below turns this budget into an explicit batch-size
          limit for a production node.
    - id: vol2.field.32
      source: vol2.serving.slo-goodput
      predicate: uses a different contract from
      target: vol2.goodput.ml
      explanation: Serving useful work counts only output satisfying the declared serving contract.
      conditions: Do not equate raw token throughput with deadline-qualified useful output or training progress.
      status: draft
      evidence:
        section: sec-inference-scale-fundamental-inversion-training-vs-inference-8834
        quote: The same targets also define the serving system's capacity metric. **SLO goodput**\index{Goodput!SLO-constrained}
          is the rate of completed requests that meet the stated TTFT and TPOT targets for a fixed request
          mix. It is the serving counterpart of the useful-progress goodput that coordination protects in
          training (@sec-vol2-introduction-dim-coord), and it applies after ML goodput, which measures how
          much of a replica's held capacity runs at its ideal rate. SLO goodput then counts how much of
          that capacity completes requests within their targets. A request that misses its contract counts
          for nothing, however busy the accelerators were while serving it, so increasing arrivals without
          completing more requests within those targets does not increase useful capacity.
    - id: vol2.field.54
      source: vol2.hardware.memory-capacity
      predicate: bounds admission using
      target: vol2.serving.kv-cache
      explanation: The cache budget is the memory left after weights and other runtime allocations.
