  claims:
    Serving cost dominance: Lifetime cost is training once plus cost per query times traffic times deployment time,
      so at high volume serving overtakes training within days to weeks and the lever is cost per completed request
      at a fixed mix, quality, and SLO.
    SLO goodput and the serving tax: Serving capacity is the rate of completed requests that meet stated TTFT and
      per-token targets for a fixed mix, and end-to-end latency adds network, serialization, coordination, and queueing
      to model time, so a 70 ms model in a 100 ms budget leaves 30 ms for everything else.
    Batch formation trades waiting for reuse: With batch service time t_0 + B t_req throughput saturates toward
      1/t_req past a knee near t_0/t_req, and request latency is queueing plus formation plus execution, so a batching
      window caps formation but not queueing.
    Iteration-level batching: Fixed batch membership strands slots when output lengths differ, and admitting requests
      at iteration boundaries recovers that capacity only when requests are waiting, KV memory is free, and per-iteration
      scheduling is cheap relative to a decode step.
    Prefill-decode interference and chunked prefill: A monolithic compute-bound prefill colocated with active streams
      lands in every decoder's per-token latency, and chunked prefill caps prompt tokens per iteration, moving rather
      than removing the cost into the long prompt's time to first token.
    KV cache as admission budget: KV bytes per token = 2 x layers x KV heads x head dimension x bytes, so maximum
      batch is free HBM over context times bytes per token, weight fit does not establish serving capacity, and
      each lever changes a different factor.
    Serving parallelism chosen by the SLO: Weight bytes set the minimum shard count, but latency follows the per-request
      Fleet Law, so tensor parallelism divides layer compute while paying collectives per token whose fixed latency
      dominates decode and keeps it inside one fast domain.
    State-aware request routing: Two random probes cut the maximum load from log n / log log n to log log n in the
      static model, but serving needs a work signal (active tokens, remaining decode, KV pressure) and atomic admit-or-reject
      because probes go stale and requests differ fiftyfold in remaining work.
    Paged KV allocation and prefix sharing: Contiguous maximum-length reservation strands most reserved KV memory,
      and paged allocation through per-sequence block tables bounds waste to the last block and lets compatible
      prefixes share physical blocks copy-on-write.
    Prefill-decode disaggregation: Separate prefill and decode pools remove phase interference and tune TTFT and
      per-token latency independently, but every handoff pays alpha + KV bytes / beta, so disaggregation earns its
      transfer tax only through measured goodput.
    Serving precision decision: A precision change is deployed only for the resource that binds (fit, bandwidth-bound
      decode, compute-bound prefill, outliers), and the runtime must keep the packed format resident, select supported
      kernels, and plan KV around real allocations.
    Overload containment: A slowing replica becomes a fleet failure when timeouts and retries consume neighbors'
      headroom, so circuit breakers withdraw it, backpressure pushes overload upstream to admission control, and
      deadlines travel with cancellation.
    Token-denominated tenant isolation: Pooling tenants raises utilization only with enforced isolation, so quotas
      bound request rate, concurrency, input and output tokens, KV pages, and accelerator time, checked and reserved
      atomically.
    Phase-aware autoscaling and cold start: Average utilization is the wrong control signal, so scaling acts on
      outstanding work against phase-specific service rates with asymmetric hysteresis, and a large-model cold start
      takes minutes that a ready reserve must cover.
    Global placement by policy then cost: A global balancer first filters regions by data-placement policy, artifact
      version, readiness, and capacity and only then chooses by measured latency or cost, because cross-region sharding
      pays one to two orders of magnitude on the execution path.
