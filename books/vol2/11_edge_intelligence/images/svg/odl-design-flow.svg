<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-cyan" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#0891b2"/>
    </marker>
    <marker id="arr-emerald" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#059669"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 6.2px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
    .card-title { font-size: 8px; font-weight: 700; }
    .card-sub { font-size: 6.8px; }
    .tag-lbl { font-size: 6.5px; font-weight: 700; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- START NODE: DEPLOYMENT                                                 -->
  <!-- ====================================================================== -->
  <g transform="translate(290, 16)">
    <rect x="0" y="0" width="260" height="42" rx="4" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
    <rect x="10" y="8" width="46" height="12" rx="2" fill="#1F407A"/>
    <text x="33" y="17" text-anchor="middle" class="badge-txt">DEPLOY</text>
    <text x="64" y="17" class="card-title" fill="#14294E">Deploy Model to Edge Target Hardware</text>
    <text x="130" y="32" text-anchor="middle" class="card-sub" fill="#1F407A">Static quantized baseline flashed to target device ROM/Flash</text>
  </g>

  <!-- Arrow Start -> Decision 1 -->
  <line x1="420" y1="58" x2="420" y2="84" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- ====================================================================== -->
  <!-- DECISION 1: ADAPTATION NEEDED?                                         -->
  <!-- ====================================================================== -->
  <g transform="translate(290, 86)">
    <rect x="0" y="0" width="260" height="46" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="10" y="8" width="56" height="12" rx="2" fill="#7c3aed"/>
    <text x="38" y="17" text-anchor="middle" class="badge-txt">DECISION 1</text>
    <text x="74" y="17" class="card-title" fill="#4c1d95">Adaptation Needed Post-Deploy?</text>
    <text x="130" y="34" text-anchor="middle" class="card-sub" fill="#6d28d9">Personalization, user shift, or acoustic domain drift expected?</text>
  </g>

  <!-- Decision 1 -> No branch (Right to Static Deployment) -->
  <line x1="550" y1="109" x2="618" y2="109" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <rect x="565" y="100" width="36" height="14" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="583" y="110" text-anchor="middle" class="tag-lbl" fill="#475569">No</text>

  <!-- Terminal: Static Deployment -->
  <g transform="translate(620, 84)">
    <rect x="0" y="0" width="200" height="50" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="10" y="8" width="96" height="12" rx="2" fill="#64748b"/>
    <text x="58" y="17" text-anchor="middle" class="badge-txt">STATIC DEPLOYMENT</text>
    <text x="10" y="31" class="card-title" fill="#1e293b">Frozen Inference Only</text>
    <text x="10" y="42" class="card-sub" fill="#64748b">Zero on-device training or state tracking overhead</text>
  </g>

  <!-- Decision 1 -> Yes branch (Down to Decision 2) -->
  <line x1="420" y1="132" x2="420" y2="168" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <rect x="424" y="142" width="26" height="14" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
  <text x="437" y="152" text-anchor="middle" class="tag-lbl" fill="#047857">Yes</text>

  <!-- ====================================================================== -->
  <!-- DECISION 2: MEMORY < 1 MB?                                             -->
  <!-- ====================================================================== -->
  <g transform="translate(290, 170)">
    <rect x="0" y="0" width="260" height="46" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="10" y="8" width="56" height="12" rx="2" fill="#7c3aed"/>
    <text x="38" y="17" text-anchor="middle" class="badge-txt">DECISION 2</text>
    <text x="74" y="17" class="card-title" fill="#4c1d95">Working Memory &lt; 1 MB (MCU)?</text>
    <text x="130" y="34" text-anchor="middle" class="card-sub" fill="#6d28d9">Constrained SRAM budget limits backpropagation caching</text>
  </g>

  <!-- Decision 2 -> Yes branch (Left to Bias-Only) -->
  <line x1="290" y1="193" x2="222" y2="193" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <rect x="240" y="184" width="36" height="14" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
  <text x="258" y="194" text-anchor="middle" class="tag-lbl" fill="#b45309">Yes</text>

  <!-- Terminal: Bias-Only Fine-Tuning -->
  <g transform="translate(20, 168)">
    <rect x="0" y="0" width="200" height="50" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <rect x="10" y="8" width="106" height="12" rx="2" fill="#d97706"/>
    <text x="63" y="17" text-anchor="middle" class="badge-txt">BIAS-ONLY FINE-TUNING</text>
    <text x="10" y="31" class="card-title" fill="#92400e">TinyTL / BitFit Adaptation</text>
    <text x="10" y="42" class="card-sub" fill="#b45309">Backbone frozen; zero activation storage; fits in SRAM</text>
  </g>

  <!-- Decision 2 -> No branch (Down to Decision 3) -->
  <line x1="420" y1="216" x2="420" y2="252" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <rect x="424" y="226" width="32" height="14" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="440" y="236" text-anchor="middle" class="tag-lbl" fill="#475569">No</text>

  <!-- ====================================================================== -->
  <!-- DECISION 3: LABELED DATA AVAILABLE?                                    -->
  <!-- ====================================================================== -->
  <g transform="translate(290, 254)">
    <rect x="0" y="0" width="260" height="46" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="10" y="8" width="56" height="12" rx="2" fill="#7c3aed"/>
    <text x="38" y="17" text-anchor="middle" class="badge-txt">DECISION 3</text>
    <text x="74" y="17" class="card-title" fill="#4c1d95">Labeled Data Available On-Device?</text>
    <text x="130" y="34" text-anchor="middle" class="card-sub" fill="#6d28d9">Direct user feedback, touch clicks, or explicit ground truth</text>
  </g>

  <!-- Decision 3 -> No branch (Left to Self-Supervised) -->
  <line x1="290" y1="277" x2="222" y2="277" stroke="#0891b2" stroke-width="1.2" marker-end="url(#arr-cyan)"/>
  <rect x="236" y="268" width="40" height="14" rx="2" fill="#ecfeff" stroke="#a5f3fc" stroke-width="0.8"/>
  <text x="256" y="278" text-anchor="middle" class="tag-lbl" fill="#0891b2">No</text>

  <!-- Terminal: Self-Supervised / Test-Time -->
  <g transform="translate(20, 252)">
    <rect x="0" y="0" width="200" height="50" rx="4" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
    <rect x="10" y="8" width="134" height="12" rx="2" fill="#0891b2"/>
    <text x="77" y="17" text-anchor="middle" class="badge-txt">TEST-TIME ADAPTATION (TTA)</text>
    <text x="10" y="31" class="card-title" fill="#155e75">Self-Supervised Adaptation</text>
    <text x="10" y="42" class="card-sub" fill="#0e7490">Entropy minimization (TENT) &amp; batch norm update</text>
  </g>

  <!-- Decision 3 -> Yes branch (Down to Decision 4) -->
  <line x1="420" y1="300" x2="420" y2="336" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <rect x="424" y="310" width="26" height="14" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
  <text x="437" y="320" text-anchor="middle" class="tag-lbl" fill="#047857">Yes</text>

  <!-- ====================================================================== -->
  <!-- DECISION 4: PRIVACY / FLEET COLLABORATION?                             -->
  <!-- ====================================================================== -->
  <g transform="translate(290, 338)">
    <rect x="0" y="0" width="260" height="46" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="10" y="8" width="56" height="12" rx="2" fill="#7c3aed"/>
    <text x="38" y="17" text-anchor="middle" class="badge-txt">DECISION 4</text>
    <text x="74" y="17" class="card-title" fill="#4c1d95">Fleet Collaboration &amp; Privacy?</text>
    <text x="130" y="34" text-anchor="middle" class="card-sub" fill="#6d28d9">Cross-device learning required without raw telemetry egress</text>
  </g>

  <!-- Decision 4 -> Yes branch (Left to Federated Learning) -->
  <line x1="290" y1="361" x2="222" y2="361" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-emerald)"/>
  <rect x="240" y="352" width="36" height="14" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
  <text x="258" y="362" text-anchor="middle" class="tag-lbl" fill="#047857">Yes</text>

  <!-- Terminal: Federated Learning -->
  <g transform="translate(20, 336)">
    <rect x="0" y="0" width="200" height="50" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <rect x="10" y="8" width="130" height="12" rx="2" fill="#059669"/>
    <text x="75" y="17" text-anchor="middle" class="badge-txt">FEDERATED LEARNING (FL)</text>
    <text x="10" y="31" class="card-title" fill="#065f46">FedAvg + Secure Aggregation</text>
    <text x="10" y="42" class="card-sub" fill="#047857">Δθ updates aggregated; raw data strictly quarantined</text>
  </g>

  <!-- Decision 4 -> No branch (Right to Isolated LoRA) -->
  <line x1="550" y1="361" x2="618" y2="361" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="565" y="352" width="36" height="14" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="583" y="362" text-anchor="middle" class="tag-lbl" fill="#1e40af">No</text>

  <!-- Terminal: On-Device Fine-Tuning / LoRA -->
  <g transform="translate(620, 336)">
    <rect x="0" y="0" width="200" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="10" y="8" width="124" height="12" rx="2" fill="#2563eb"/>
    <text x="72" y="17" text-anchor="middle" class="badge-txt">ISOLATED ON-DEVICE FT</text>
    <text x="10" y="31" class="card-title" fill="#1e40af">Local LoRA / Adapter Training</text>
    <text x="10" y="42" class="card-sub" fill="#1d4ed8">Rank-r parameter adaptation; zero cross-fleet sync</text>
  </g>

  <!-- ====================================================================== -->
  <!-- FOOTER PRINCIPLE CALLOUT                                               -->
  <!-- ====================================================================== -->
  <text x="420" y="440" text-anchor="middle" font-size="8" fill="#64748b" font-style="italic">
    A systematic triage of memory envelope, supervisory signals, and fleet governance boundaries dictates the optimal on-device learning strategy.
  </text>
</svg>