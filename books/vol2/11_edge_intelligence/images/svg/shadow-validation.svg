<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#CB202D"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#008F45"/>
    </marker>
  </defs>
  <rect width="680" height="530" fill="#ffffff"/>
  <!-- ===== Input stream ===== -->
  <rect x="240" y="20" width="200" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">Live input stream</text>
  <path d="M340,60 V80" fill="none" stroke="#555555" stroke-width="1.2"/>
  <path d="M340,80 H170 V108" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M340,80 H510 V108" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="180" y="100" font-size="12" fill="#555555">mirror</text>
  <text x="500" y="100" text-anchor="end" font-size="12" fill="#555555">serve</text>
  <!-- ===== Two models ===== -->
  <rect x="60" y="110" width="220" height="60" rx="3" fill="#e8e8e8" stroke="#888888" stroke-width="1.2"/>
  <text x="170" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">Frozen baseline</text>
  <text x="170" y="155" text-anchor="middle" font-size="12" fill="#555555">v1, shadow</text>
  <rect x="400" y="110" width="220" height="60" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="510" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">Adapted candidate</text>
  <text x="510" y="155" text-anchor="middle" font-size="12" fill="#555555">v1.1, active</text>
  <path d="M170,170 V218" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M510,170 V218" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="180" y="199" font-size="12" fill="#555555">reference</text>
  <text x="500" y="199" text-anchor="end" font-size="12" fill="#555555">candidate</text>
  <!-- ===== Comparator ===== -->
  <rect x="120" y="220" width="440" height="60" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="340" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Comparator</text>
  <text x="340" y="265" text-anchor="middle" font-size="12" fill="#555555">disagreement, confidence, latency and resource deltas</text>
  <path d="M340,280 V338" fill="none" stroke="#CB202D" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="350" y="314" font-size="12" fill="#CB202D">disagreement &gt; <tspan font-style="italic">τ</tspan></text>
  <!-- ===== Gate ===== -->
  <rect x="230" y="340" width="220" height="60" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="340" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">Gate</text>
  <text x="340" y="385" text-anchor="middle" font-size="12" fill="#555555">hold candidate out of service</text>
  <rect x="20" y="350" width="150" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="95" y="367" text-anchor="middle" font-size="12" fill="#333333">validated outcome</text>
  <text x="95" y="382" text-anchor="middle" font-size="12" fill="#333333">or safety invariant</text>
  <path d="M170,370 H228" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- ===== Resolution ===== -->
  <path d="M340,400 V430" fill="none" stroke="#555555" stroke-width="1.2"/>
  <path d="M340,430 H200 V458" fill="none" stroke="#008F45" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <path d="M340,430 H480 V458" fill="none" stroke="#CB202D" stroke-width="1.2" marker-end="url(#arrow-red)"/>
  <rect x="100" y="460" width="200" height="50" rx="3" fill="#D4EFDF" stroke="#008F45" stroke-width="1.2"/>
  <text x="200" y="481" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Clear</text>
  <text x="200" y="499" text-anchor="middle" font-size="12" fill="#555555">return to service</text>
  <rect x="380" y="460" width="200" height="50" rx="3" fill="#F5D2D5" stroke="#CB202D" stroke-width="1.2"/>
  <text x="480" y="481" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Regression</text>
  <text x="480" y="499" text-anchor="middle" font-size="12" fill="#555555">roll back</text>
</svg>
