<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <marker id="arr-rose" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#e11d48"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-emerald" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#059669"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 6.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
    .prop-hdr { font-size: 7px; font-weight: 700; }
    .prop-txt { font-size: 6.4px; }
    .metric-lbl { font-size: 6.2px; font-weight: 600; fill: #64748b; }
    .metric-val { font-size: 6.2px; font-weight: 700; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- THREE PARADIGM PANELS (A, B, C)                                        -->
  <!-- ====================================================================== -->
  <g transform="translate(18, 16)">

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- PANEL A: FULL FINE-TUNING                                            -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="242" height="406" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Panel Header Badge -->
      <rect x="10" y="10" width="132" height="16" rx="2" fill="#e11d48"/>
      <text x="76" y="21" text-anchor="middle" class="badge-txt">A — FULL FINE-TUNING</text>
      <text x="150" y="21.5" font-size="6.8" font-weight="600" fill="#be123c">High Overhead</text>

      <!-- Architecture Schematic -->
      <g transform="translate(16, 36)">
        <rect x="0" y="0" width="210" height="172" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        
        <!-- 4 Trainable Layers + Head -->
        <g transform="translate(16, 12)">
          <!-- Layer 1 -->
          <rect x="0" y="0" width="134" height="20" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
          <text x="67" y="13" text-anchor="middle" font-size="6.8" font-weight="600" fill="#e11d48">Layer 1 (trainable)</text>
          
          <!-- Layer 2 -->
          <rect x="0" y="28" width="134" height="20" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
          <text x="67" y="41" text-anchor="middle" font-size="6.8" font-weight="600" fill="#e11d48">Layer 2 (trainable)</text>

          <!-- Layer 3 -->
          <rect x="0" y="56" width="134" height="20" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
          <text x="67" y="69" text-anchor="middle" font-size="6.8" font-weight="600" fill="#e11d48">Layer 3 (trainable)</text>

          <!-- Layer 4 -->
          <rect x="0" y="84" width="134" height="20" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
          <text x="67" y="97" text-anchor="middle" font-size="6.8" font-weight="600" fill="#e11d48">Layer 4 (trainable)</text>

          <!-- Head -->
          <rect x="0" y="112" width="134" height="22" rx="2" fill="#e11d48" stroke="#be123c" stroke-width="1"/>
          <text x="67" y="126" text-anchor="middle" font-size="7" font-weight="700" fill="#ffffff">Task Head (trainable)</text>

          <!-- Connectors between layers -->
          <line x1="67" y1="20" x2="67" y2="28" stroke="#fda4af" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="67" y1="48" x2="67" y2="56" stroke="#fda4af" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="67" y1="76" x2="67" y2="84" stroke="#fda4af" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="67" y1="104" x2="67" y2="112" stroke="#fda4af" stroke-width="1" stroke-dasharray="2,1"/>

          <!-- Full Backprop Arrow -->
          <path d="M 134,123 L 165,123 L 165,10 L 140,10" fill="none" stroke="#e11d48" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arr-rose)"/>
          <text x="171" y="68" font-size="6.2" font-weight="600" fill="#e11d48" transform="rotate(90, 171, 68)" text-anchor="middle">Full Gradient Backpropagation</text>
        </g>
      </g>

      <!-- Characteristics Box -->
      <g transform="translate(16, 216)">
        <rect x="0" y="0" width="210" height="74" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.8"/>
        <text x="10" y="14" class="prop-hdr" fill="#be123c">Maximum Expressivity, Heavy Footprint</text>
        <text x="10" y="27" class="prop-txt" fill="#9f1239">• Updates all weights throughout deep backbone</text>
        <text x="10" y="38" class="prop-txt" fill="#9f1239">• Caches all intermediate activations for backprop</text>
        <text x="10" y="49" class="prop-txt" fill="#9f1239">• 3–5× inference RAM overhead during training</text>
        <text x="10" y="60" class="prop-txt" fill="#9f1239">• High risk of catastrophic forgetting on small edge sets</text>
      </g>

      <!-- Metrics Comparison Gauges -->
      <g transform="translate(16, 298)">
        <rect x="0" y="0" width="210" height="96" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        
        <text x="10" y="16" class="prop-hdr" fill="#334155">RESOURCE COMPARISON (768-DIM MODEL)</text>
        
        <!-- Memory Bar -->
        <text x="10" y="32" class="metric-lbl">Activation Memory:</text>
        <text x="200" y="32" text-anchor="end" class="metric-val" fill="#e11d48">~1,000 KB (High)</text>
        <rect x="10" y="36" width="190" height="8" rx="2" fill="#f1f5f9"/>
        <rect x="10" y="36" width="190" height="8" rx="2" fill="#e11d48"/>

        <!-- Parameters Bar -->
        <text x="10" y="58" class="metric-lbl">Trainable Parameters:</text>
        <text x="200" y="58" text-anchor="end" class="metric-val" fill="#e11d48">100% (589,824)</text>
        <rect x="10" y="62" width="190" height="8" rx="2" fill="#f1f5f9"/>
        <rect x="10" y="62" width="190" height="8" rx="2" fill="#e11d48"/>

        <!-- Suitability -->
        <text x="10" y="84" font-size="6" fill="#64748b"><tspan font-weight="600" fill="#334155">Deployment Fit:</tspan> Edge servers or mains-powered gateways</text>
      </g>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- PANEL B: HEAD-ONLY ADAPTATION                                        -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(262, 0)">
      <rect x="0" y="0" width="242" height="406" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Panel Header Badge -->
      <rect x="10" y="10" width="136" height="16" rx="2" fill="#d97706"/>
      <text x="78" y="21" text-anchor="middle" class="badge-txt">B — HEAD-ONLY ADAPTATION</text>
      <text x="154" y="21.5" font-size="6.8" font-weight="600" fill="#b45309">Low Overhead</text>

      <!-- Architecture Schematic -->
      <g transform="translate(16, 36)">
        <rect x="0" y="0" width="210" height="172" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        
        <!-- 4 Frozen Layers + Trainable Head -->
        <g transform="translate(16, 12)">
          <!-- Layer 1 (Frozen) -->
          <rect x="0" y="0" width="134" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="67" y="13" text-anchor="middle" font-size="6.8" fill="#64748b">Layer 1 (frozen ❄)</text>
          
          <!-- Layer 2 (Frozen) -->
          <rect x="0" y="28" width="134" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="67" y="41" text-anchor="middle" font-size="6.8" fill="#64748b">Layer 2 (frozen ❄)</text>

          <!-- Layer 3 (Frozen) -->
          <rect x="0" y="56" width="134" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="67" y="69" text-anchor="middle" font-size="6.8" fill="#64748b">Layer 3 (frozen ❄)</text>

          <!-- Layer 4 (Frozen) -->
          <rect x="0" y="84" width="134" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="67" y="97" text-anchor="middle" font-size="6.8" fill="#64748b">Layer 4 (frozen ❄)</text>

          <!-- Head (Trainable) -->
          <rect x="0" y="112" width="134" height="22" rx="2" fill="#d97706" stroke="#b45309" stroke-width="1"/>
          <text x="67" y="126" text-anchor="middle" font-size="7" font-weight="700" fill="#ffffff">Task Head (trainable)</text>

          <!-- Connectors between layers -->
          <line x1="67" y1="20" x2="67" y2="28" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="67" y1="48" x2="67" y2="56" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="67" y1="76" x2="67" y2="84" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="67" y1="104" x2="67" y2="112" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>

          <!-- Local Head-Only Gradient Arrow -->
          <path d="M 134,123 L 165,123 L 165,110 L 140,110" fill="none" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
          <text x="171" y="119" font-size="6.2" font-weight="600" fill="#d97706">Head grad</text>
        </g>
      </g>

      <!-- Characteristics Box -->
      <g transform="translate(16, 216)">
        <rect x="0" y="0" width="210" height="74" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
        <text x="10" y="14" class="prop-hdr" fill="#b45309">Ultra-Low Overhead, Bound Expressivity</text>
        <text x="10" y="27" class="prop-txt" fill="#92400e">• Backbone completely frozen; zero activation storage</text>
        <text x="10" y="38" class="prop-txt" fill="#92400e">• Training memory drops by &gt;90% relative to full FT</text>
        <text x="10" y="49" class="prop-txt" fill="#92400e">• Rapid convergence on simple linear classification shifts</text>
        <text x="10" y="60" class="prop-txt" fill="#92400e">• Cannot adapt internal feature representations to new domains</text>
      </g>

      <!-- Metrics Comparison Gauges -->
      <g transform="translate(16, 298)">
        <rect x="0" y="0" width="210" height="96" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        
        <text x="10" y="16" class="prop-hdr" fill="#334155">RESOURCE COMPARISON (768-DIM MODEL)</text>
        
        <!-- Memory Bar -->
        <text x="10" y="32" class="metric-lbl">Activation Memory:</text>
        <text x="200" y="32" text-anchor="end" class="metric-val" fill="#d97706">~150 KB (Low)</text>
        <rect x="10" y="36" width="190" height="8" rx="2" fill="#f1f5f9"/>
        <rect x="10" y="36" width="28" height="8" rx="2" fill="#d97706"/>

        <!-- Parameters Bar -->
        <text x="10" y="58" class="metric-lbl">Trainable Parameters:</text>
        <text x="200" y="58" text-anchor="end" class="metric-val" fill="#d97706">~1.5% (7,680)</text>
        <rect x="10" y="62" width="190" height="8" rx="2" fill="#f1f5f9"/>
        <rect x="10" y="62" width="8" height="8" rx="2" fill="#d97706"/>

        <!-- Suitability -->
        <text x="10" y="84" font-size="6" fill="#64748b"><tspan font-weight="600" fill="#334155">Deployment Fit:</tspan> Mobile apps with static upstream feature extractors</text>
      </g>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- PANEL C: ADAPTER / LORA (PEFT)                                       -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(524, 0)">
      <rect x="0" y="0" width="242" height="406" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Panel Header Badge -->
      <rect x="10" y="10" width="132" height="16" rx="2" fill="#059669"/>
      <text x="76" y="21" text-anchor="middle" class="badge-txt">C — ADAPTER / LORA</text>
      <text x="150" y="21.5" font-size="6.8" font-weight="600" fill="#047857">Parameter-Efficient</text>

      <!-- Architecture Schematic -->
      <g transform="translate(16, 36)">
        <rect x="0" y="0" width="210" height="172" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        
        <!-- 4 Frozen Backbone Layers + Sidecar Adapters -->
        <g transform="translate(12, 12)">
          <!-- Layer 1 -->
          <rect x="0" y="0" width="104" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="52" y="13" text-anchor="middle" font-size="6.5" fill="#64748b">Layer 1 (frozen ❄)</text>
          <rect x="112" y="0" width="68" height="20" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
          <text x="146" y="13" text-anchor="middle" font-size="6.2" font-weight="700" fill="#047857">Adapter (r=8)</text>
          
          <!-- Layer 2 -->
          <rect x="0" y="28" width="104" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="52" y="41" text-anchor="middle" font-size="6.5" fill="#64748b">Layer 2 (frozen ❄)</text>
          <rect x="112" y="28" width="68" height="20" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
          <text x="146" y="41" text-anchor="middle" font-size="6.2" font-weight="700" fill="#047857">Adapter (r=8)</text>

          <!-- Layer 3 -->
          <rect x="0" y="56" width="104" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="52" y="69" text-anchor="middle" font-size="6.5" fill="#64748b">Layer 3 (frozen ❄)</text>
          <rect x="112" y="56" width="68" height="20" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
          <text x="146" y="69" text-anchor="middle" font-size="6.2" font-weight="700" fill="#047857">LoRA (r=8)</text>

          <!-- Layer 4 -->
          <rect x="0" y="84" width="104" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="52" y="97" text-anchor="middle" font-size="6.5" fill="#64748b">Layer 4 (frozen ❄)</text>
          <rect x="112" y="84" width="68" height="20" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
          <text x="146" y="97" text-anchor="middle" font-size="6.2" font-weight="700" fill="#047857">LoRA (r=8)</text>

          <!-- Head (Trainable) -->
          <rect x="0" y="112" width="180" height="22" rx="2" fill="#059669" stroke="#047857" stroke-width="1"/>
          <text x="90" y="126" text-anchor="middle" font-size="7" font-weight="700" fill="#ffffff">Task Head (trainable)</text>

          <!-- Connectors between layers -->
          <line x1="52" y1="20" x2="52" y2="28" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="52" y1="48" x2="52" y2="56" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="52" y1="76" x2="52" y2="84" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="52" y1="104" x2="52" y2="112" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>
          
          <!-- Adapter branch lines -->
          <line x1="104" y1="10" x2="112" y2="10" stroke="#059669" stroke-width="1"/>
          <line x1="104" y1="38" x2="112" y2="38" stroke="#059669" stroke-width="1"/>
          <line x1="104" y1="66" x2="112" y2="66" stroke="#059669" stroke-width="1"/>
          <line x1="104" y1="94" x2="112" y2="94" stroke="#059669" stroke-width="1"/>
        </g>
      </g>

      <!-- Characteristics Box -->
      <g transform="translate(16, 216)">
        <rect x="0" y="0" width="210" height="74" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
        <text x="10" y="14" class="prop-hdr" fill="#047857">Near-Full Accuracy at ~1% Parameter Cost</text>
        <text x="10" y="27" class="prop-txt" fill="#065f46">• Low-rank decomposition (W + BA) adapts representations</text>
        <text x="10" y="38" class="prop-txt" fill="#065f46">• Backprop confined to small rank-r adapter matrices</text>
        <text x="10" y="49" class="prop-txt" fill="#065f46">• Zero latency overhead: weights folded at inference time</text>
        <text x="10" y="60" class="prop-txt" fill="#065f46">• Highly composable: multiple adapters swapped dynamically</text>
      </g>

      <!-- Metrics Comparison Gauges -->
      <g transform="translate(16, 298)">
        <rect x="0" y="0" width="210" height="96" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        
        <text x="10" y="16" class="prop-hdr" fill="#334155">RESOURCE COMPARISON (768-DIM MODEL)</text>
        
        <!-- Memory Bar -->
        <text x="10" y="32" class="metric-lbl">Activation Memory:</text>
        <text x="200" y="32" text-anchor="end" class="metric-val" fill="#059669">~50 KB (Tiny)</text>
        <rect x="10" y="36" width="190" height="8" rx="2" fill="#f1f5f9"/>
        <rect x="10" y="36" width="12" height="8" rx="2" fill="#059669"/>

        <!-- Parameters Bar -->
        <text x="10" y="58" class="metric-lbl">Trainable Parameters:</text>
        <text x="200" y="58" text-anchor="end" class="metric-val" fill="#059669">&lt; 1% (6,144)</text>
        <rect x="10" y="62" width="190" height="8" rx="2" fill="#f1f5f9"/>
        <rect x="10" y="62" width="4" height="8" rx="2" fill="#059669"/>

        <!-- Suitability -->
        <text x="10" y="84" font-size="6" fill="#64748b"><tspan font-weight="600" fill="#334155">Deployment Fit:</tspan> On-device personalization, IoT, and edge devices</text>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- FOOTER PRINCIPLE CALLOUT                                               -->
  <!-- ====================================================================== -->
  <text x="400" y="444" text-anchor="middle" font-size="8" fill="#64748b" font-style="italic">
    Personalization strategies trade expressivity for memory efficiency; adapters achieve near-full fine-tuning accuracy with &lt; 1% parameter footprint.
  </text>
</svg>