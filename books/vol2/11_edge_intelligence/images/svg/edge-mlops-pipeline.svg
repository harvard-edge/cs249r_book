<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-emerald" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#059669"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#7c3aed"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 6.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
    .stage-num { font-size: 7px; font-weight: 700; fill: #ffffff; }
    .card-hdr { font-size: 7.2px; font-weight: 700; }
    .card-txt { font-size: 6.2px; }
    .math-txt { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- MAIN WORKFLOW ENCLOSURE                                                -->
  <!-- ====================================================================== -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="800" height="434" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Cloud vs Edge Dividing Boundary -->
    <!-- Cloud Side is x=0 to 395, Edge Side is x=405 to 800 -->
    <line x1="400" y1="12" x2="400" y2="420" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Boundary Zone Headers -->
    <!-- Cloud Zone Header -->
    <g transform="translate(20, 12)">
      <rect x="0" y="0" width="130" height="18" rx="2" fill="#1F407A"/>
      <text x="65" y="12" text-anchor="middle" class="badge-txt">CLOUD INFRASTRUCTURE</text>
      <text x="140" y="12.5" font-size="6.8" font-weight="600" fill="#14294E">Centralized Fleet Management</text>
    </g>

    <!-- Edge Zone Header -->
    <g transform="translate(420, 12)">
      <rect x="0" y="0" width="130" height="18" rx="2" fill="#059669"/>
      <text x="65" y="12" text-anchor="middle" class="badge-txt">EDGE ENVIRONMENT</text>
      <text x="140" y="12.5" font-size="6.8" font-weight="600" fill="#047857">Distributed Heterogeneous Devices</text>
    </g>

    <!-- Boundary Tag at Center -->
    <g transform="translate(366, 12)">
      <rect x="0" y="0" width="68" height="18" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="34" y="11.5" text-anchor="middle" font-size="6" font-weight="700" fill="#475569">NETWORK</text>
    </g>

    <!-- ==================================================================== -->
    <!-- TOP PIPELINE FLOW: STAGES 1 TO 4                                     -->
    <!-- ==================================================================== -->
    <g transform="translate(20, 42)">

      <!-- ────────────────────────────────────────────────────────────────── -->
      <!-- STAGE 1: CLOUD TRAINING                                            -->
      <!-- ────────────────────────────────────────────────────────────────── -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="106" rx="3" fill="#ffffff" stroke="#D4E2F0" stroke-width="1"/>
        <!-- Stage Number Badge -->
        <rect x="8" y="8" width="16" height="16" rx="2" fill="#1F407A"/>
        <text x="16" y="19" text-anchor="middle" class="stage-num">1</text>
        <text x="30" y="19.5" class="card-hdr" fill="#14294E">Cloud Pretraining</text>

        <g transform="translate(10, 30)">
          <text x="0" y="10" class="card-txt" fill="#475569">• Full TB-scale corpus training</text>
          <text x="0" y="21" class="card-txt" fill="#475569">• Multi-node GPU/TPU clusters</text>
          <text x="0" y="32" class="card-txt" fill="#475569">• Weeks of compute time</text>
          <rect x="0" y="42" width="145" height="18" rx="2" fill="#f0f9ff"/>
          <text x="72" y="53.5" text-anchor="middle" font-size="6" font-weight="700" fill="#1F407A" class="math-txt">Base Model w* (14 GB)</text>
        </g>
      </g>

      <!-- Stage 1 -> Stage 2 Arrow -->
      <line x1="165" y1="53" x2="198" y2="53" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

      <!-- ────────────────────────────────────────────────────────────────── -->
      <!-- STAGE 2: MODEL COMPRESSION                                         -->
      <!-- ────────────────────────────────────────────────────────────────── -->
      <g transform="translate(202, 0)">
        <rect x="0" y="0" width="165" height="106" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
        <rect x="8" y="8" width="16" height="16" rx="2" fill="#d97706"/>
        <text x="16" y="19" text-anchor="middle" class="stage-num">2</text>
        <text x="30" y="19.5" class="card-hdr" fill="#b45309">Compression &amp; PEFT</text>

        <g transform="translate(10, 30)">
          <text x="0" y="10" class="card-txt" fill="#475569">• INT8/INT4 PTQ quantization</text>
          <text x="0" y="21" class="card-txt" fill="#475569">• Magnitude &amp; structured pruning</text>
          <text x="0" y="32" class="card-txt" fill="#475569">• LoRA adapter matrix init</text>
          <rect x="0" y="42" width="145" height="18" rx="2" fill="#fffbeb"/>
          <text x="72" y="53.5" text-anchor="middle" font-size="6" font-weight="700" fill="#d97706" class="math-txt">Tier Packages (~350 MB)</text>
        </g>
      </g>

      <!-- Stage 2 -> Stage 3 Arrow (Crossing Network Boundary) -->
      <line x1="367" y1="53" x2="408" y2="53" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

      <!-- ────────────────────────────────────────────────────────────────── -->
      <!-- STAGE 3: OTA DEPLOYMENT                                            -->
      <!-- ────────────────────────────────────────────────────────────────── -->
      <g transform="translate(412, 0)">
        <rect x="0" y="0" width="165" height="106" rx="3" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
        <rect x="8" y="8" width="16" height="16" rx="2" fill="#7c3aed"/>
        <text x="16" y="19" text-anchor="middle" class="stage-num">3</text>
        <text x="30" y="19.5" class="card-hdr" fill="#6d28d9">OTA Deployment</text>

        <g transform="translate(10, 30)">
          <text x="0" y="10" class="card-txt" fill="#475569">• Staged canary rollout (1%→10%)</text>
          <text x="0" y="21" class="card-txt" fill="#475569">• Binary delta update packages</text>
          <text x="0" y="32" class="card-txt" fill="#475569">• Tiered target configuration</text>
          <rect x="0" y="42" width="145" height="18" rx="2" fill="#f5f3ff"/>
          <text x="72" y="53.5" text-anchor="middle" font-size="6" font-weight="700" fill="#7c3aed" class="math-txt">Delta Payload (25 MB)</text>
        </g>
      </g>

      <!-- Stage 3 -> Stage 4 Arrow -->
      <line x1="577" y1="53" x2="610" y2="53" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

      <!-- ────────────────────────────────────────────────────────────────── -->
      <!-- STAGE 4: ON-DEVICE INFERENCE & ADAPTATION                          -->
      <!-- ────────────────────────────────────────────────────────────────── -->
      <g transform="translate(614, 0)">
        <rect x="0" y="0" width="146" height="106" rx="3" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
        <rect x="8" y="8" width="16" height="16" rx="2" fill="#059669"/>
        <text x="16" y="19" text-anchor="middle" class="stage-num">4</text>
        <text x="30" y="19.5" class="card-hdr" fill="#047857">On-Device Adaptation</text>

        <g transform="translate(8, 30)">
          <text x="0" y="10" class="card-txt" fill="#475569">• Local inference &lt; 10 ms</text>
          <text x="0" y="21" class="card-txt" fill="#475569">• LoRA/TinyTL on private data</text>
          <text x="0" y="32" class="card-txt" fill="#475569">• Shadow model validation</text>
          <rect x="0" y="42" width="130" height="18" rx="2" fill="#ecfdf5"/>
          <text x="65" y="53.5" text-anchor="middle" font-size="6" font-weight="700" fill="#059669" class="math-txt">Adapted θ_local</text>
        </g>
      </g>
    </g>

    <!-- ==================================================================== -->
    <!-- STAGE 5: PRIVACY-SAFE TELEMETRY FEEDBACK LOOP (EDGE -> CLOUD)        -->
    <!-- ==================================================================== -->
    <!-- Loop flows from bottom of Stage 4 (x=707, y=148)
         Down to y=170
         Left across the network boundary to x=102
         Up to bottom of Stage 1 (x=102, y=148)
    -->
    <g transform="translate(0, 0)">
      <path d="M 707,148 L 707,175 L 102,175 L 102,154" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-emerald)"/>

      <!-- Telemetry Chip on the path -->
      <g transform="translate(320, 163)">
        <rect x="0" y="0" width="160" height="24" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
        <rect x="6" y="4" width="16" height="16" rx="2" fill="#059669"/>
        <text x="14" y="15" text-anchor="middle" class="stage-num">5</text>
        <text x="28" y="15" class="card-hdr" fill="#047857">Privacy-Preserved Telemetry Loop</text>
      </g>

      <text x="230" y="190" text-anchor="middle" font-size="6" fill="#047857" font-weight="600">Triggers Retraining</text>
      <text x="580" y="190" text-anchor="middle" font-size="6" fill="#047857" font-weight="600">Differential Privacy (ε &lt; 8)</text>
    </g>

    <!-- ==================================================================== -->
    <!-- LOWER SECTION: 4 ARCHITECTURAL DETAIL PANELS                         -->
    <!-- ==================================================================== -->
    <g transform="translate(20, 206)">

      <!-- Panel 1: Training Infrastructure -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="180" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="10" y="10" width="155" height="18" rx="2" fill="#f0f9ff" stroke="#D4E2F0" stroke-width="0.8"/>
        <text x="87" y="21.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="#14294E">Training Infrastructure</text>

        <g transform="translate(12, 36)">
          <text x="0" y="10" class="card-txt" fill="#334155"><tspan font-weight="700">Compute Fabric:</tspan> Multi-node GPU</text>
          <text x="0" y="22" class="card-txt" fill="#475569">• Distributed FP8/BF16 clusters</text>
          <text x="0" y="34" class="card-txt" fill="#475569">• Megatron-LM tensor parallel</text>
          
          <text x="0" y="52" class="card-txt" fill="#334155"><tspan font-weight="700">Dataset Scope:</tspan> Global corpus</text>
          <text x="0" y="64" class="card-txt" fill="#475569">• Trillions of tokens (TB scale)</text>
          <text x="0" y="76" class="card-txt" fill="#475569">• Rigorous deduplication &amp; filters</text>

          <text x="0" y="94" class="card-txt" fill="#334155"><tspan font-weight="700">Cadence:</tspan> Monthly / quarterly</text>
          <text x="0" y="106" class="card-txt" fill="#475569">• Foundation base models v1, v2</text>
          <text x="0" y="118" class="card-txt" fill="#475569">• Checkpoint registry &amp; lineage</text>
        </g>
      </g>

      <!-- Panel 2: Compression Techniques -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="175" height="180" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="10" y="10" width="155" height="18" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
        <text x="87" y="21.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="#b45309">Compression Techniques</text>

        <g transform="translate(12, 36)">
          <text x="0" y="10" class="card-txt" fill="#334155"><tspan font-weight="700">Quantization:</tspan> INT8 / INT4</text>
          <text x="0" y="22" class="card-txt" fill="#475569">• SmoothQuant &amp; AWQ activation</text>
          <text x="0" y="34" class="card-txt" fill="#475569">• 4× footprint reduction</text>
          
          <text x="0" y="52" class="card-txt" fill="#334155"><tspan font-weight="700">Sparsity &amp; Distillation:</tspan></text>
          <text x="0" y="64" class="card-txt" fill="#475569">• 2:4 semi-structured pruning</text>
          <text x="0" y="76" class="card-txt" fill="#475569">• Compact student knowledge dist.</text>

          <text x="0" y="94" class="card-txt" fill="#334155"><tspan font-weight="700">PEFT Preparation:</tspan></text>
          <text x="0" y="106" class="card-txt" fill="#475569">• LoRA matrix initialization</text>
          <text x="0" y="118" class="card-txt" fill="#475569">• Tailored device-tier packaging</text>
        </g>
      </g>

      <!-- Panel 3: On-Device Constraints -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="175" height="180" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="10" y="10" width="155" height="18" rx="2" fill="#f5f3ff" stroke="#c7d2fe" stroke-width="0.8"/>
        <text x="87" y="21.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="#6d28d9">On-Device Constraints</text>

        <g transform="translate(12, 36)">
          <text x="0" y="10" class="card-txt" fill="#334155"><tspan font-weight="700">Memory Budget:</tspan> 256 MB – 8 GB</text>
          <text x="0" y="22" class="card-txt" fill="#475569">• Strict RAM quarantine per app</text>
          <text x="0" y="34" class="card-txt" fill="#475569">• Zero OS page fault tolerance</text>
          
          <text x="0" y="52" class="card-txt" fill="#334155"><tspan font-weight="700">Energy &amp; Battery:</tspan></text>
          <text x="0" y="64" class="card-txt" fill="#475569">• Drain bound: &lt; 5% per day</text>
          <text x="0" y="76" class="card-txt" fill="#475569">• Train only when charging + idle</text>

          <text x="0" y="94" class="card-txt" fill="#334155"><tspan font-weight="700">Operational Safeguards:</tspan></text>
          <text x="0" y="106" class="card-txt" fill="#475569">• Wi-Fi only update uplinks</text>
          <text x="0" y="118" class="card-txt" fill="#475569">• Automatic shadow rollback</text>
        </g>
      </g>

      <!-- Panel 4: Privacy-Safe Telemetry -->
      <g transform="translate(585, 0)">
        <rect x="0" y="0" width="175" height="180" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="10" y="10" width="155" height="18" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
        <text x="87" y="21.5" text-anchor="middle" font-size="6.8" font-weight="700" fill="#047857">Privacy-Safe Telemetry</text>

        <g transform="translate(12, 36)">
          <text x="0" y="10" class="card-txt" fill="#334155"><tspan font-weight="700">Differential Privacy:</tspan> ε &lt; 8</text>
          <text x="0" y="22" class="card-txt" fill="#475569">• Local Gaussian mechanism noise</text>
          <text x="0" y="34" class="card-txt" fill="#475569">• Strict cumulative privacy budget</text>
          
          <text x="0" y="52" class="card-txt" fill="#334155"><tspan font-weight="700">Payload Boundaries:</tspan></text>
          <text x="0" y="64" class="card-txt" fill="#475569">• Aggregate confusion matrix only</text>
          <text x="0" y="76" class="card-txt" fill="#475569">• Zero raw audio/text/image egress</text>

          <text x="0" y="94" class="card-txt" fill="#334155"><tspan font-weight="700">Continuous Drift Triggers:</tspan></text>
          <text x="0" y="106" class="card-txt" fill="#475569">• Population performance drop</text>
          <text x="0" y="118" class="card-txt" fill="#475569">• Autonomous cloud retraining call</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- FOOTER PRINCIPLE CALLOUT                                               -->
  <!-- ====================================================================== -->
  <text x="420" y="468" text-anchor="middle" font-size="8" fill="#64748b" font-style="italic">
    The edge MLOps lifecycle closes the loop between cloud pretraining, compressed OTA deployment, on-device adaptation, and privacy-preserving telemetry.
  </text>
</svg>