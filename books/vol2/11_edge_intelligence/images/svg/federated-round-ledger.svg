<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- TOP PARAMETER SELECTION BOX -->
  <g transform="translate(180, 16)">
    <rect width="400" height="40" rx="3" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2"/>
    <text x="200" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#1F407A">Local Work Setting E (SGD Steps / Epochs per Round)</text>
  </g>

  <!-- Branches Down to Regimes -->
  <path d="M 280 56 V 80 H 195 V 95" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <path d="M 480 56 V 80 H 565 V 95" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- LEFT REGIME: HIGH E -->
  <g transform="translate(30, 95)">
    <rect width="330" height="130" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="330" height="26" rx="3" fill="#fef2f2"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#b91c1c">Computation-Heavy Regime (E ≫ 1)</text>

    <text x="15" y="46" font-size="9" fill="#334155"><tspan font-weight="600">Round Duration:</tspan> Long local compute t_r(E); high client drain</text>
    <text x="15" y="66" font-size="9" fill="#334155"><tspan font-weight="600">Rounds to Target:</tspan> Fewer total rounds R(E) needed</text>
    <text x="15" y="86" font-size="9" fill="#334155"><tspan font-weight="600">Network Burden:</tspan> Amortizes communication across local steps</text>
    <text x="15" y="106" font-size="9" fill="#b91c1c"><tspan font-weight="600">Risk:</tspan> Client drift under non-IID data degrades convergence</text>
  </g>

  <!-- RIGHT REGIME: LOW E -->
  <g transform="translate(400, 95)">
    <rect width="330" height="130" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="330" height="26" rx="3" fill="#eff6ff"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#1F407A">Communication-Heavy Regime (E = 1)</text>

    <text x="15" y="46" font-size="9" fill="#334155"><tspan font-weight="600">Round Duration:</tspan> Short local compute t_r(E); low device heating</text>
    <text x="15" y="66" font-size="9" fill="#334155"><tspan font-weight="600">Rounds to Target:</tspan> Many rounds R(E) required to converge</text>
    <text x="15" y="86" font-size="9" fill="#334155"><tspan font-weight="600">Network Burden:</tspan> Frequent syncs saturate server uplink bandwidth</text>
    <text x="15" y="106" font-size="9" fill="#15803d"><tspan font-weight="600">Advantage:</tspan> Minimal client drift; updates anchor to global state</text>
  </g>

  <!-- Drops to Ledger -->
  <line x1="195" y1="225" x2="195" y2="255" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="565" y1="225" x2="565" y2="255" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- BOTTOM MEASURED LEDGER CONTAINER -->
  <g transform="translate(30, 255)">
    <rect width="700" height="105" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="700" height="24" rx="3" fill="#f1f5f9"/>
    <text x="15" y="16" font-size="10" font-weight="700" fill="#0f172a">EMPIRICAL TIME-TO-TARGET LEDGER: T_target(E) = ∑ t_r(E)  (r = 1 … R(E))</text>

    <!-- 4 Metrics Columns -->
    <g transform="translate(15, 34)">
      <rect width="160" height="60" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Wall-Clock Time</text>
      <text x="10" y="34" font-size="8.5" fill="#475569">∑ t_r(E) across rounds</text>
      <text x="10" y="48" font-size="8.5" fill="#1F407A">Local + network + wait</text>
    </g>

    <g transform="translate(185, 34)">
      <rect width="160" height="60" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Transmitted Bytes</text>
      <text x="10" y="34" font-size="8.5" fill="#475569">2 · |W| · K_admitted · R(E)</text>
      <text x="10" y="48" font-size="8.5" fill="#1F407A">Uplink &amp; downlink cost</text>
    </g>

    <g transform="translate(355, 34)">
      <rect width="160" height="60" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Client Energy Budget</text>
      <text x="10" y="34" font-size="8.5" fill="#475569">Joules / client / round</text>
      <text x="10" y="48" font-size="8.5" fill="#15803d">Battery &amp; thermal cap</text>
    </g>

    <g transform="translate(525, 34)">
      <rect width="160" height="60" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Population Coverage</text>
      <text x="10" y="34" font-size="8.5" fill="#475569">K_admitted / K_selected</text>
      <text x="10" y="48" font-size="8.5" fill="#d97706">Prevents straggler skew</text>
    </g>
  </g>
</svg>
