<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Top Header Banner Pill -->
  <rect x="210.0" y="18" width="580" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500.0" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.2px">FEDERATED COMMUNICATION-COMPUTATION TRADE-OFF · EMPIRICAL LEDGER</text>
  <!-- Top Hyperparameter Dispatcher Card -->
  <rect x="230" y="65" width="540" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="245" y="77" width="130" height="26" rx="4" fill="#0f172a"/>
  <text x="310" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.8px">PARAMETER E</text>
  <text x="390" y="95" font-size="14" font-weight="700" fill="#0f172a">Local Work Setting E (Epochs / Steps per Round)</text>
  <path d="M 370 117 L 370 142 L 260 142 L 260 155" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M 630 117 L 630 142 L 740 142 L 740 155" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <!-- Column 1: High Local Work -->
  <rect x="40" y="158" width="440" height="235" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="55" y="172" width="120" height="26" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="115" y="189" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b" letter-spacing="0.8px">HIGH E (E &gt;&gt; 1)</text>
  <text x="190" y="190" font-size="14" font-weight="700" fill="#991b1b">Computation-Heavy Regime</text>
  <rect x="55" y="210" width="410" height="50" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="70" y="230" font-size="12" font-weight="700" fill="#1e293b">Elapsed Duration per Round: Long</text>
  <text x="70" y="247" font-size="11" fill="#64748b">Local work dominates tr(E); high client thermal &amp; battery drain.</text>
  <rect x="55" y="268" width="410" height="50" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="70" y="288" font-size="12" font-weight="700" fill="#1e293b">Rounds to Target: Fewer [R(E) ↓]</text>
  <text x="70" y="305" font-size="11" fill="#64748b">Amortizes server communication across more local SGD updates.</text>
  <rect x="55" y="326" width="410" height="54" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="70" y="346" font-size="12" font-weight="700" fill="#b91c1c">Client Drift &amp; Non-IID Instability</text>
  <text x="70" y="364" font-size="11" fill="#64748b">Weights diverge locally (Δwk); can degrade aggregate quality.</text>
  <!-- Column 2: Low Local Work -->
  <rect x="520" y="158" width="440" height="235" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="535" y="172" width="120" height="26" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="595" y="189" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.8px">LOW E (E = 1)</text>
  <text x="670" y="190" font-size="14" font-weight="700" fill="#1e40af">Communication-Heavy Regime</text>
  <rect x="535" y="210" width="410" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="550" y="230" font-size="12" font-weight="700" fill="#1e293b">Elapsed Duration per Round: Short</text>
  <text x="550" y="247" font-size="11" fill="#64748b">Fast local execution; low device heating &amp; minimal dropout rate.</text>
  <rect x="535" y="268" width="410" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="550" y="288" font-size="12" font-weight="700" fill="#1e293b">Rounds to Target: Many [R(E) ↑]</text>
  <text x="550" y="305" font-size="11" fill="#64748b">Frequent syncs saturate server bandwidth and uplink queues.</text>
  <rect x="535" y="326" width="410" height="54" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="550" y="346" font-size="12" font-weight="700" fill="#1d4ed8">Bounded Drift &amp; Stable Consensus</text>
  <text x="550" y="364" font-size="11" fill="#64748b">Updates stay anchored near shared global state; high stability.</text>
  <path d="M 260 393 L 260 425" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M 740 393 L 740 425" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <!-- Measurement Ledger Container -->
  <rect x="40" y="428" width="920" height="108" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="440" width="160" height="24" rx="4" fill="#0f172a"/>
  <text x="135" y="456" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.8px">MEASURED LEDGER</text>
  <text x="230" y="457" font-size="13" font-weight="700" fill="#1e293b">Total Time to Target: T_target(E) = ∑ tr(E) for r = 1 ... R(E)</text>
  <rect x="55" y="472" width="200" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="65" y="490" font-size="11" font-weight="700" fill="#0f172a">Elapsed Wall Time</text>
  <text x="65" y="506" font-size="10" fill="#64748b">Sum of round latencies</text>
  <text x="65" y="518" font-size="10" fill="#0284c7">Local + xfer + wait time</text>
  <rect x="270" y="472" width="210" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="280" y="490" font-size="11" font-weight="700" fill="#0f172a">Transmitted Bytes</text>
  <text x="280" y="506" font-size="10" fill="#64748b">R(E) × 2 × |W| × Kadmitted</text>
  <text x="280" y="518" font-size="10" fill="#0284c7">Uplink &amp; downlink budget</text>
  <rect x="495" y="472" width="210" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="505" y="490" font-size="11" font-weight="700" fill="#0f172a">Client Energy &amp; Battery</text>
  <text x="505" y="506" font-size="10" fill="#64748b">Joules / client / round</text>
  <text x="505" y="518" font-size="10" fill="#16a34a">Thermal &amp; SOC constraints</text>
  <rect x="720" y="472" width="225" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="730" y="490" font-size="11" font-weight="700" fill="#0f172a">Population Coverage</text>
  <text x="730" y="506" font-size="10" fill="#64748b">Kadmitted / Kselected ratio</text>
  <text x="730" y="518" font-size="10" fill="#ea580c">Prevents demographic skew</text>
  <!-- Bottom Takeaway Card -->
  <rect x="40" y="548" width="920" height="56" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="55" y="562" width="145" height="26" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="127" y="579" text-anchor="middle" font-size="11" font-weight="700" fill="#166534" letter-spacing="0.8px">SYSTEM RULE</text>
  <text x="215" y="575" font-size="12" font-weight="700" fill="#166534">Optimize Total Observed Time Under Strict Coverage and Energy Constraints</text>
  <text x="215" y="593" font-size="11" fill="#475569">Selecting E requires measuring actual wall-clock duration and completion rates—not relying on idealized convergence plots.</text>
</svg>