<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="640" height="220" fill="#ffffff"/>
  <!-- ===== Control: local epochs ===== -->
  <rect x="20" y="85" width="100" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="70" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">local work</text>
  <text x="70" y="123" text-anchor="middle" font-size="12" fill="#4c1d95">E epochs</text>
  <!-- ===== Branch: round duration ===== -->
  <rect x="180" y="25" width="170" height="56" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="265" y="47" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">round duration t<tspan font-size="9" dy="3">r</tspan><tspan dy="-3">(E)</tspan></text>
  <text x="265" y="66" text-anchor="middle" font-size="12" fill="#14294E">grows with E</text>
  <!-- ===== Branch: rounds to target ===== -->
  <rect x="180" y="139" width="170" height="56" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="265" y="161" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">rounds to target R(E)</text>
  <text x="265" y="180" text-anchor="middle" font-size="12" fill="#78350f">fewer syncs, more drift</text>
  <path d="M120,110 H150 V53 H178" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M150,110 V167 H178" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <!-- ===== Ledger ===== -->
  <rect x="410" y="80" width="200" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="510" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">time to target</text>
  <text x="510" y="124" text-anchor="middle" font-size="12" fill="#0f172a">T<tspan font-size="9" dy="3">target</tspan><tspan dy="-3">(E) = Σ</tspan><tspan font-size="9" dy="3">r ≤ R(E)</tspan><tspan dy="-3" dx="3">t</tspan><tspan font-size="9" dy="3">r</tspan><tspan dy="-3">(E)</tspan></text>
  <path d="M350,53 H380 V100 H408" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M350,167 H380 V120 H408" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <!-- ===== Admission constraints ===== -->
  <rect x="410" y="170" width="200" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="510" y="190" text-anchor="middle" font-size="11" fill="#475569">within energy and coverage budgets</text>
  <path d="M510,140 V168" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-gray)"/>
</svg>
