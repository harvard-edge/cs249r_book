<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- TOP PARAMETER SELECTION BOX -->
  <g transform="translate(200, 15)">
    <rect width="400" height="38" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <rect width="400" height="38" rx="3" fill="#EAF1F8"/>
    <text x="200" y="23" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1F407A">Local Work Setting E (SGD Steps / Epochs per Round)</text>
  </g>

  <!-- Branches Down to Regimes -->
  <path d="M 300 53 V 75 H 210 V 85" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <path d="M 500 53 V 75 H 590 V 85" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- LEFT REGIME: HIGH E (width 350, usable 320) -->
  <g transform="translate(35, 85)">
    <rect width="350" height="130" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="350" height="26" rx="3" fill="#fef2f2"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#b91c1c">Computation-Heavy Regime (E ≫ 1)</text>

    <text x="15" y="46" font-size="8.5" fill="#334155"><tspan font-weight="600">Round Duration:</tspan> Long compute t_r(E); high battery drain</text>
    <text x="15" y="66" font-size="8.5" fill="#334155"><tspan font-weight="600">Rounds to Target:</tspan> Fewer total sync rounds R(E) needed</text>
    <text x="15" y="86" font-size="8.5" fill="#334155"><tspan font-weight="600">Network Burden:</tspan> Amortizes transfer across more local steps</text>
    <text x="15" y="106" font-size="8.5" fill="#b91c1c"><tspan font-weight="600">Primary Risk:</tspan> Client drift under non-IID data harms convergence</text>
  </g>

  <!-- RIGHT REGIME: LOW E -->
  <g transform="translate(415, 85)">
    <rect width="350" height="130" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="350" height="26" rx="3" fill="#eff6ff"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#1F407A">Communication-Heavy Regime (E = 1)</text>

    <text x="15" y="46" font-size="8.5" fill="#334155"><tspan font-weight="600">Round Duration:</tspan> Short compute t_r(E); low thermal strain</text>
    <text x="15" y="66" font-size="8.5" fill="#334155"><tspan font-weight="600">Rounds to Target:</tspan> Many rounds R(E) required to converge</text>
    <text x="15" y="86" font-size="8.5" fill="#334155"><tspan font-weight="600">Network Burden:</tspan> Frequent syncs saturate server bandwidth</text>
    <text x="15" y="106" font-size="8.5" fill="#15803d"><tspan font-weight="600">Key Property:</tspan> Bounded drift keeps updates close to global state</text>
  </g>

  <!-- Drops to Ledger -->
  <line x1="210" y1="215" x2="210" y2="238" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="590" y1="215" x2="590" y2="238" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- BOTTOM MEASURED LEDGER CONTAINER -->
  <g transform="translate(35, 238)">
    <rect width="730" height="115" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="730" height="24" rx="3" fill="#f1f5f9"/>
    <text x="15" y="16" font-size="9.5" font-weight="700" fill="#0f172a">EMPIRICAL TIME-TO-TARGET LEDGER: T_target(E) = ∑ t_r(E)  (r = 1 … R(E))</text>

    <!-- 4 Metrics Columns (width 165, spacing 18) -->
    <g transform="translate(15, 34)">
      <rect width="165" height="68" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Wall-Clock Time</text>
      <text x="10" y="34" font-size="8" fill="#475569">∑ t_r(E) across rounds</text>
      <text x="10" y="48" font-size="8" fill="#1F407A">Local + network + wait</text>
      <text x="10" y="60" font-size="7.5" fill="#64748b">Primary convergence metric</text>
    </g>

    <g transform="translate(195, 34)">
      <rect width="165" height="68" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Transmitted Bytes</text>
      <text x="10" y="34" font-size="8" fill="#475569">2 · |W| · K_admitted · R(E)</text>
      <text x="10" y="48" font-size="8" fill="#1F407A">Uplink &amp; downlink volume</text>
      <text x="10" y="60" font-size="7.5" fill="#64748b">Network quota limit</text>
    </g>

    <g transform="translate(375, 34)">
      <rect width="165" height="68" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Client Energy Budget</text>
      <text x="10" y="34" font-size="8" fill="#475569">Joules / client / round</text>
      <text x="10" y="48" font-size="8" fill="#15803d">Battery &amp; thermal cap</text>
      <text x="10" y="60" font-size="7.5" fill="#64748b">Prevents client dropout</text>
    </g>

    <g transform="translate(555, 34)">
      <rect width="160" height="68" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Population Coverage</text>
      <text x="10" y="34" font-size="8" fill="#475569">K_admitted / K_selected</text>
      <text x="10" y="48" font-size="8" fill="#d97706">Prevents straggler bias</text>
      <text x="10" y="60" font-size="7.5" fill="#64748b">Preserves demographic fairness</text>
    </g>
  </g>
</svg>
