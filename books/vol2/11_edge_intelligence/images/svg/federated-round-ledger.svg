<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Top Controller Box -->
  <rect x="220" y="20" width="240" height="52" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="340" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Local epoch setting E</text>

  <!-- Connectors from Top -->
  <path d="M280 72 V100 H155 V125" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M400 72 V100 H525 V125" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Left: Latency / Duration (Amber) -->
  <rect x="40" y="125" width="230" height="68" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="155" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Elapsed duration per round</text>
  <text x="155" y="174" text-anchor="middle" font-size="11" fill="#78350f">Local work + transfer + waiting</text>

  <!-- Right: Rounds to Target (Green) -->
  <rect x="410" y="125" width="230" height="68" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="525" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Rounds to quality target</text>
  <text x="525" y="174" text-anchor="middle" font-size="11" fill="#14532d">Updates + validation + coverage</text>

  <!-- Connectors to Bottom -->
  <path d="M155 193 V215 H270 V225" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M525 193 V215 H410 V225" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Bottom: Synthesis Box -->
  <rect x="140" y="225" width="400" height="52" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="340" y="257" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Sum round durations through target round</text>

  <!-- Footer Note Badge -->
  <rect x="160" y="288" width="360" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="340" y="303" text-anchor="middle" font-size="9.5" font-weight="600" fill="#475569" letter-spacing="0.3">CHECK ENERGY · ADMISSION · POPULATION COVERAGE</text>
</svg>
