<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="600" height="280" fill="#ffffff"/>

  <!-- ===== Input ===== -->
  <rect x="20" y="110" width="70" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="55" y="134" text-anchor="middle" font-size="16" font-style="italic" font-weight="700" fill="#0f172a">x</text>
  <text x="55" y="151" text-anchor="middle" font-size="11" fill="#475569">d</text>

  <!-- ===== Split ===== -->
  <path d="M90,135 H130" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M130,135 V70 H168" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M130,135 V200 H168" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ===== Frozen path: W0 ===== -->
  <rect x="170" y="25" width="170" height="90" rx="3" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="255" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">W<tspan font-size="12" dy="4">0</tspan></text>
  <text x="255" y="92" text-anchor="middle" font-size="12" fill="#475569">d × d</text>

  <!-- ===== Trainable path: A (down) and B (up) ===== -->
  <polygon points="170,168 238,186 238,214 170,232" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="198" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#14294E">A</text>
  <text x="198" y="215" text-anchor="middle" font-size="11" fill="#14294E">r × d</text>
  <path d="M238,200 H270" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="254" y="192" text-anchor="middle" font-size="12" font-style="italic" fill="#14294E">r</text>
  <polygon points="272,186 340,168 340,232 272,214" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="312" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#14294E">B</text>
  <text x="312" y="215" text-anchor="middle" font-size="11" fill="#14294E">d × r</text>

  <!-- ===== Merge ===== -->
  <path d="M340,70 H440 V119" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="390" y="62" text-anchor="middle" font-size="12" fill="#0f172a">W<tspan font-size="9" dy="3">0</tspan><tspan dy="-3" dx="3">x</tspan></text>
  <path d="M340,200 H440 V151" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="390" y="192" text-anchor="middle" font-size="12" fill="#14294E">BA x</text>
  <circle cx="440" cy="135" r="14" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <path d="M432,135 H448 M440,127 V143" stroke="#0f172a" stroke-width="1.5"/>

  <!-- ===== Output ===== -->
  <path d="M454,135 H508" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="510" y="110" width="70" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="545" y="134" text-anchor="middle" font-size="16" font-style="italic" font-weight="700" fill="#0f172a">h</text>
  <text x="545" y="151" text-anchor="middle" font-size="11" fill="#475569">d</text>
  <text x="545" y="182" text-anchor="middle" font-size="11" fill="#475569">merged for serving</text>
  <text x="545" y="198" text-anchor="middle" font-size="12" fill="#0f172a">W<tspan font-size="9" dy="3">0</tspan><tspan dy="-3" dx="3">+ BA</tspan></text>

  <!-- ===== Legend ===== -->
  <rect x="170" y="252" width="16" height="12" rx="1" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="192" y="262" font-size="11" fill="#334155">Frozen: no gradients or optimizer state</text>
  <rect x="410" y="252" width="16" height="12" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="432" y="262" font-size="11" fill="#334155">Trainable</text>
</svg>
