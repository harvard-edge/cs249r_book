<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#059669"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 6.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
    .hdr-txt { font-size: 7.2px; font-weight: 700; }
    .sub-txt { font-size: 6.2px; }
    .math-txt { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- TOP METRIC PANEL: PARAMETER EFFICIENCY COMPARISON                      -->
  <!-- ====================================================================== -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="752" height="74" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <g>
      <rect x="12" y="8" width="148" height="15" rx="2" fill="#1F407A"/>
      <text x="86" y="18.5" text-anchor="middle" font-size="6.5" class="badge-txt">Panel A: Parameter Efficiency</text>
    </g>
    <text x="168" y="19" font-size="6.8" font-weight="600" fill="#14294E">Linear Layer Benchmark (d = 768, rank r = 8)</text>

    <!-- Full Fine-Tuning Bar -->
    <g transform="translate(12, 30)">
      <text x="0" y="11" font-size="6.5" font-weight="600" fill="#64748b">Full Fine-Tuning (d × d):</text>
      <text x="270" y="11" text-anchor="end" font-size="6.5" font-weight="700" fill="#e11d48">589,824 parameters (100%)</text>
      <rect x="0" y="15" width="270" height="8" rx="2" fill="#f1f5f9"/>
      <rect x="0" y="15" width="270" height="8" rx="2" fill="#e11d48"/>
    </g>

    <!-- LoRA Bar -->
    <g transform="translate(12, 50)">
      <text x="0" y="11" font-size="6.5" font-weight="600" fill="#64748b">LoRA Adapters 2 × (d × r):</text>
      <text x="270" y="11" text-anchor="end" font-size="6.5" font-weight="700" fill="#059669">12,288 parameters (2.08%)</text>
      <rect x="0" y="15" width="270" height="8" rx="2" fill="#f1f5f9"/>
      <rect x="0" y="15" width="6" height="8" rx="2" fill="#059669"/>
    </g>

    <!-- Reduction Callout Box (Right) -->
    <g transform="translate(320, 24)">
      <rect x="0" y="0" width="230" height="42" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
      <text x="115" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#be123c">97.9% Parameter Reduction</text>
      <text x="115" y="27" text-anchor="middle" font-size="6.2" fill="#9f1239">2 × (768 × 8) = 12,288 vs 589,824 weights</text>
      <text x="115" y="37" text-anchor="middle" font-size="5.8" fill="#e11d48">~48× fewer trainable parameters per transformed layer</text>
    </g>

    <!-- Footprint RAM Box (Far Right) -->
    <g transform="translate(565, 24)">
      <rect x="0" y="0" width="175" height="42" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="87.5" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#047857">FP16 Memory Footprint</text>
      <text x="87.5" y="27" text-anchor="middle" font-size="6.5" font-weight="700" fill="#059669">24.5 KB per Adapter</text>
      <text x="87.5" y="37" text-anchor="middle" font-size="5.8" fill="#166534">Fits comfortably into MCU / mobile L1/L2 cache</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- MAIN ARCHITECTURE DIAGRAM                                              -->
  <!-- ====================================================================== -->
  <g transform="translate(24, 102)">
    <rect x="0" y="0" width="752" height="326" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- INPUT TENSOR NODE                                                    -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="90" height="90" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
      <g>
        <rect x="10" y="10" width="70" height="14" rx="2" fill="#475569"/>
        <text x="45" y="20" text-anchor="middle" font-size="6.5" class="badge-txt">INPUT VECTOR</text>
      </g>
      <text x="45" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" class="math-txt">x</text>
      <text x="45" y="58" text-anchor="middle" font-size="6.8" font-weight="600" fill="#475569" class="math-txt">x ∈ ℝ^d</text>
      <text x="45" y="72" text-anchor="middle" font-size="6.2" fill="#64748b">d = 768 dim</text>
    </g>

    <!-- Fork Routing from Input -->
    <!-- Upper Fork -->
    <path d="M 114,140 L 150,140 L 150,80 L 178,80" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <rect x="122" y="74" width="46" height="12" rx="2" fill="#f0f9ff" stroke="#D4E2F0" stroke-width="0.8"/>
    <text x="145" y="82.5" text-anchor="middle" font-size="5.8" font-weight="700" fill="#1F407A">MAIN PATH</text>

    <!-- Lower Fork -->
    <path d="M 114,170 L 150,170 L 150,220 L 178,220" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <rect x="116" y="214" width="56" height="12" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="144" y="222.5" text-anchor="middle" font-size="5.8" font-weight="700" fill="#059669">ADAPTER PATH</text>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- UPPER PATH: FROZEN BASE MATRIX W0                                    -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(182, 24)">
      <rect x="0" y="0" width="220" height="114" rx="3" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
      
      <!-- Frozen Badge -->
      <g>
        <rect x="10" y="8" width="60" height="14" rx="2" fill="#1F407A"/>
        <text x="40" y="18" text-anchor="middle" font-size="6.5" class="badge-txt">FROZEN (❄)</text>
      </g>
      <text x="78" y="18.5" font-size="6.8" font-weight="600" fill="#14294E">Gradient: ∇W = 0</text>

      <!-- Matrix Representation -->
      <g transform="translate(14, 28)">
        <rect x="0" y="0" width="70" height="70" rx="2" fill="#ffffff" stroke="#D4E2F0" stroke-width="1"/>
        <!-- Matrix internal grid -->
        <line x1="23" y1="0" x2="23" y2="70" stroke="#EAF1F8" stroke-width="0.8"/>
        <line x1="47" y1="0" x2="47" y2="70" stroke="#EAF1F8" stroke-width="0.8"/>
        <line x1="0" y1="23" x2="70" y2="23" stroke="#EAF1F8" stroke-width="0.8"/>
        <line x1="0" y1="47" x2="70" y2="47" stroke="#EAF1F8" stroke-width="0.8"/>
        <text x="35" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1F407A" class="math-txt">W₀</text>
      </g>

      <!-- Matrix Details (Right) -->
      <g transform="translate(94, 30)">
        <text x="0" y="12" font-size="7.5" font-weight="700" fill="#14294E">Pretrained Weights</text>
        <text x="0" y="24" font-size="6.8" font-weight="600" fill="#334155" class="math-txt">W₀ ∈ ℝ^(d × d)</text>
        <text x="0" y="36" font-size="6.2" fill="#64748b">Dimensions: 768 × 768</text>
        <text x="0" y="47" font-size="6.2" fill="#64748b">Weights: 589,824 params</text>
        <g>
          <rect x="0" y="52" width="112" height="15" rx="2" fill="#ffffff" stroke="#D4E2F0" stroke-width="0.8"/>
          <text x="56" y="62.5" text-anchor="middle" font-size="6" font-weight="700" fill="#1F407A" class="math-txt">h_base = W₀ · x</text>
        </g>
      </g>
    </g>

    <!-- Arrow from W0 to Adder -->
    <path d="M 402,80 L 512,80 L 512,130" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="456" y="74" text-anchor="middle" font-size="6.2" font-weight="600" fill="#1F407A" class="math-txt">W₀ · x</text>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- LOWER PATH: LOW-RANK ADAPTER MATRICES (A and B)                      -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(182, 160)">
      <rect x="0" y="0" width="280" height="140" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
      
      <!-- Trainable Badge -->
      <g>
        <rect x="10" y="8" width="68" height="14" rx="2" fill="#059669"/>
        <text x="44" y="18" text-anchor="middle" font-size="6.5" class="badge-txt">TRAINABLE (PEFT)</text>
      </g>
      <text x="86" y="18.5" font-size="6.8" font-weight="600" fill="#047857">Backprop confined to A, B</text>

      <!-- Matrix A: Down-projection -->
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="34" height="74" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
        <text x="17" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#059669" class="math-txt">A</text>
        <text x="17" y="44" text-anchor="middle" font-size="5.8" font-weight="600" fill="#047857">d × r</text>
        <text x="17" y="54" text-anchor="middle" font-size="5.2" fill="#64748b">768×8</text>
        <g>
          <rect x="0" y="78" width="34" height="12" rx="2" fill="#dcfce7"/>
          <text x="17" y="86.5" text-anchor="middle" font-size="5" font-weight="700" fill="#15803d">Gaussian</text>
        </g>
      </g>

      <!-- Text between A and B -->
      <g transform="translate(62, 54)">
        <text x="14" y="12" text-anchor="middle" font-size="6" font-weight="700" fill="#047857">Down-Proj</text>
        <line x1="2" y1="18" x2="26" y2="18" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)"/>
        <!-- Bottleneck Rank r indicator -->
        <g>
          <rect x="0" y="24" width="28" height="14" rx="2" fill="#059669"/>
          <text x="14" y="34" text-anchor="middle" font-size="6.2" font-weight="700" fill="#ffffff" class="math-txt">r = 8</text>
        </g>
      </g>

      <!-- Matrix B: Up-projection -->
      <g transform="translate(102, 32)">
        <rect x="0" y="0" width="74" height="34" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
        <text x="37" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#059669" class="math-txt">B</text>
        <text x="37" y="28" text-anchor="middle" font-size="5.8" font-weight="600" fill="#047857">r × d (8 × 768)</text>
        <g>
          <rect x="0" y="78" width="74" height="12" rx="2" fill="#dcfce7"/>
          <text x="37" y="86.5" text-anchor="middle" font-size="5.2" font-weight="700" fill="#15803d">Zero Init (B = 0)</text>
        </g>
      </g>

      <!-- Text after B: Scaling factor -->
      <g transform="translate(188, 48)">
        <text x="24" y="10" text-anchor="middle" font-size="6" font-weight="700" fill="#047857">Scaling Factor</text>
        <g>
          <rect x="6" y="16" width="36" height="18" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
          <text x="24" y="28" text-anchor="middle" font-size="7" font-weight="700" fill="#059669" class="math-txt">α / r</text>
        </g>
        <text x="24" y="44" text-anchor="middle" font-size="5.5" fill="#64748b">α = 16 (× 2.0)</text>
      </g>

      <!-- Mathematical Summary Box at bottom -->
      <g transform="translate(16, 102)">
        <rect x="0" y="0" width="248" height="26" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="0.8"/>
        <text x="124" y="11" text-anchor="middle" font-size="6.2" font-weight="700" fill="#047857">
          Low-Rank Update: <tspan class="math-txt">ΔW = (α/r) · B · A</tspan>
        </text>
        <text x="124" y="21" text-anchor="middle" font-size="5.6" fill="#166534">
          At initialization: B = 0 ⇒ ΔW = 0 (exact pretrained identity preservation)
        </text>
      </g>
    </g>

    <!-- Arrow from B to Adder -->
    <path d="M 462,220 L 512,220 L 512,176" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="484" y="214" text-anchor="middle" font-size="6.2" font-weight="600" fill="#059669" class="math-txt">ΔW · x</text>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- SUMMATION NODE (ELEMENT-WISE ADDITION)                                -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(497, 137)">
      <circle cx="15" cy="15" r="15" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
      <text x="15" y="20.5" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">⊕</text>
    </g>

    <!-- Arrow from Adder to Output -->
    <line x1="528" y1="152" x2="578" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- OUTPUT TENSOR NODE & MERGE EQUATION                                  -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(582, 88)">
      <rect x="0" y="0" width="146" height="130" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
      
      <g>
        <rect x="10" y="8" width="80" height="14" rx="2" fill="#475569"/>
        <text x="50" y="18" text-anchor="middle" font-size="6.5" class="badge-txt">OUTPUT ACTIVATION</text>
      </g>

      <text x="73" y="40" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" class="math-txt">h'</text>
      <text x="73" y="54" text-anchor="middle" font-size="6.8" font-weight="600" fill="#334155" class="math-txt">h' = W₀·x + (α/r)BA·x</text>

      <!-- Zero-latency deployment card -->
      <g transform="translate(8, 64)">
        <rect x="0" y="0" width="130" height="56" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="12" font-size="6.2" font-weight="700" fill="#0f172a">Zero-Latency Deployment:</text>
        <text x="8" y="24" font-size="5.8" fill="#475569"><tspan font-weight="600">Merge:</tspan><tspan dx="3">Fold adapter into base at serve</tspan></text>
        <text x="14" y="35" font-size="6" font-weight="700" fill="#059669" class="math-txt">W_eff = W₀ + (α/r)BA</text>
        <text x="8" y="47" font-size="5.8" fill="#475569"><tspan font-weight="600">Cost:</tspan><tspan dx="3">0 extra latency or serving FLOPs</tspan></text>
      </g>
    </g>
  </g>
</svg>