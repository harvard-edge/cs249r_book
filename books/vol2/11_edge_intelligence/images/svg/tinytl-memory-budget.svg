<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 680 260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect y="30" width="680" height="260" fill="#ffffff"/>
  <!-- ===== Nonvolatile storage ===== -->
  <rect x="30" y="110" width="190" height="100" rx="4" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
  <path d="M30.5,132 V114 Q30.5,110.5 34,110.5 H216 Q219.5,110.5 219.5,114 V132 Z" fill="#dcfce7"/>
  <path d="M30,132 H220" stroke="#16a34a" stroke-width="0.6"/>
  <text x="40" y="125" font-size="12" font-weight="700" fill="#14532d">Nonvolatile flash</text>
  <rect x="55" y="150" width="140" height="36" rx="2" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="125" y="166" text-anchor="middle" font-size="12" fill="#475569">frozen weights</text>
  <text x="125" y="181" text-anchor="middle" font-size="12" fill="#475569">W<tspan font-size="9" dy="3">storage</tspan></text>
  <!-- ===== Working memory stack (not to scale) ===== -->
  <rect x="330" y="200" width="120" height="50" rx="0" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="390" y="229" text-anchor="middle" font-size="12" fill="#475569">W<tspan font-size="9" dy="3">resident</tspan></text>
  <text x="462" y="229" font-size="12" fill="#334155">resident weights</text>
  <rect x="330" y="170" width="120" height="30" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="390" y="189" text-anchor="middle" font-size="12" fill="#14294E">S<tspan font-size="9" dy="3">train</tspan></text>
  <text x="462" y="189" font-size="12" fill="#334155">trainable state</text>
  <rect x="330" y="100" width="120" height="70" fill="#c9daee" stroke="#1F407A" stroke-width="1.2"/>
  <text x="390" y="139" text-anchor="middle" font-size="12" fill="#14294E">max<tspan font-size="9" dy="3">t</tspan><tspan dy="-3"> [A</tspan><tspan font-size="9" dy="3">live</tspan><tspan dy="-3"> + U]</tspan></text>
  <text x="462" y="139" font-size="12" fill="#334155">activations + workspace</text>
  <rect x="330" y="50" width="120" height="50" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="390" y="79" text-anchor="middle" font-size="12" fill="#64748b">runtime + app</text>
  <text x="462" y="79" font-size="12" fill="#334155">reserved</text>
  <!-- ===== Device limit ===== -->
  <path d="M310,50 H470" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="476" y="54" font-size="12" font-weight="700" fill="#b91c1c">M<tspan font-size="9" dy="3">device</tspan></text>
  <!-- ===== Peak brace ===== -->
  <path d="M612,100 H620 V250 H612" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <text x="628" y="180" font-size="12" font-weight="700" fill="#0f172a">M<tspan font-size="9" dy="3">peak</tspan></text>
  <!-- ===== Staging ===== -->
  <path d="M220,160 H270 V135 H328" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="275" y="127" font-size="12" fill="#475569">stage</text>
  <text x="390" y="272" text-anchor="middle" font-size="12" fill="#334155">working memory (SRAM or RAM)</text>
</svg>
