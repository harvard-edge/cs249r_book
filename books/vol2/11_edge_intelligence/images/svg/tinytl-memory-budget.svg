<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Top Header Banner Pill -->
  <rect x="220.0" y="18" width="560" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500.0" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.2px">ON-DEVICE ADAPTATION · WORKING-MEMORY ADMISSION BUDGET</text>
  <!-- Left Container: Nonvolatile Flash Domain -->
  <rect x="40" y="65" width="245" height="465" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="78" width="130" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.8px">FLASH / STORAGE</text>
  <text x="55" y="128" font-size="14" font-weight="700" fill="#0f172a">Nonvolatile Footprint</text>
  <text x="55" y="146" font-size="11" fill="#64748b">Persistent device storage (eMMC / Flash)</text>
  <rect x="55" y="165" width="215" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="68" y="188" font-size="12" font-weight="700" fill="#0f172a">Frozen Backbone Weights</text>
  <text x="68" y="206" font-size="11" font-weight="600" fill="#2563eb">W_storage (INT8/FP16)</text>
  <text x="68" y="224" font-size="10" fill="#64748b">10 MB – 100 MB in Flash;</text>
  <text x="68" y="238" font-size="10" fill="#64748b">never held entirely in SRAM.</text>
  <rect x="55" y="265" width="215" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="68" y="288" font-size="12" font-weight="700" fill="#0f172a">Flash Access Mechanism</text>
  <text x="68" y="306" font-size="11" fill="#475569">• Execute-in-Place (XIP)</text>
  <text x="68" y="322" font-size="11" fill="#475569">• DMA Chunk Staging</text>
  <text x="68" y="338" font-size="10" fill="#64748b">Staging buffers allocated in U(t).</text>
  <rect x="55" y="365" width="215" height="150" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="68" y="388" font-size="11" font-weight="700" fill="#334155">STORAGE IS SEPARATE</text>
  <text x="68" y="408" font-size="11" fill="#475569">Weights stored in Flash</text>
  <text x="68" y="424" font-size="11" fill="#475569">consume package footprint,</text>
  <text x="68" y="440" font-size="11" font-weight="700" fill="#b91c1c">DO NOT count in SRAM</text>
  <text x="68" y="456" font-size="11" fill="#475569">until staged into working</text>
  <text x="68" y="472" font-size="11" fill="#475569">buffers during step t.</text>
  <path d="M 285 240 L 325 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="305" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">STAGE</text>
  <!-- Right Container: Working Memory Boundary -->
  <rect x="330" y="65" width="630" height="465" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="345" y="78" width="170" height="26" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="430" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.8px">SRAM / DRAM BOUNDARY</text>
  <text x="530" y="96" font-size="14" font-weight="700" fill="#0f172a">Working Memory Admission Budget</text>
  <rect x="345" y="118" width="600" height="40" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="645" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">M_peak = W_resident  +  S_train  +  max_t [ A_live(t) + U(t) ]</text>
  <rect x="345" y="172" width="190" height="255" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="355" y="184" width="90" height="22" rx="4" fill="#dbeafe"/>
  <text x="400" y="199" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">TERM 1</text>
  <text x="355" y="225" font-size="13" font-weight="700" fill="#0f172a">W_resident</text>
  <text x="355" y="243" font-size="11" font-weight="600" fill="#2563eb">Resident Weights</text>
  <text x="355" y="265" font-size="11" fill="#475569">• Unfrozen layers</text>
  <text x="355" y="283" font-size="11" fill="#475569">• Pinned backbone blocks</text>
  <text x="355" y="301" font-size="11" fill="#475569">• Active layer tensors</text>
  <text x="355" y="325" font-size="10" fill="#64748b">Only weights that cannot</text>
  <text x="355" y="339" font-size="10" fill="#64748b">stream from Flash remain</text>
  <text x="355" y="353" font-size="10" fill="#64748b">permanently resident.</text>
  <rect x="550" y="172" width="190" height="255" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <rect x="560" y="184" width="90" height="22" rx="4" fill="#dcfce7"/>
  <text x="605" y="199" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">TERM 2</text>
  <text x="560" y="225" font-size="13" font-weight="700" fill="#0f172a">S_train</text>
  <text x="560" y="243" font-size="11" font-weight="600" fill="#16a34a">Trainable State</text>
  <text x="560" y="265" font-size="11" fill="#475569">• TinyTL lite-residuals</text>
  <text x="560" y="283" font-size="11" fill="#475569">• Bias parameters &amp; grads</text>
  <text x="560" y="301" font-size="11" fill="#475569">• Optimizer states:</text>
  <text x="575" y="319" font-size="10" fill="#64748b">Adam: 2× param bytes</text>
  <text x="575" y="333" font-size="10" fill="#64748b">SGD+Mom: 1× bytes</text>
  <text x="560" y="355" font-size="10" fill="#166534">Freezing backbone drops</text>
  <text x="560" y="369" font-size="10" fill="#166534">its optimizer footprint!</text>
  <rect x="755" y="172" width="190" height="255" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <rect x="765" y="184" width="90" height="22" rx="4" fill="#fef3c7"/>
  <text x="810" y="199" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">TERM 3</text>
  <text x="765" y="225" font-size="13" font-weight="700" fill="#0f172a">max_t [A_live + U]</text>
  <text x="765" y="243" font-size="11" font-weight="600" fill="#d97706">Dynamic Peak State</text>
  <text x="765" y="265" font-size="11" fill="#475569">• A_live(t): Saved activations</text>
  <text x="765" y="283" font-size="10" fill="#b45309">TinyTL eliminates backbone</text>
  <text x="765" y="297" font-size="10" fill="#b45309">activation storage (6.5×↓)</text>
  <text x="765" y="319" font-size="11" fill="#475569">• U(t): Scratchpad workspace</text>
  <text x="775" y="335" font-size="10" fill="#64748b">im2col convolution buffer</text>
  <text x="775" y="349" font-size="10" fill="#64748b">GEMM scratch &amp; DMA staging</text>
  <text x="765" y="371" font-size="10" fill="#92400e">Evaluated at peak step t*</text>
  <rect x="345" y="440" width="600" height="75" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="360" y="452" width="140" height="24" rx="4" fill="#0f172a"/>
  <text x="430" y="468" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.8px">ADMISSION CHECK</text>
  <text x="515" y="469" font-size="13" font-weight="700" fill="#0f172a">M_peak ≤ M_budget = M_device − (M_runtime + M_app)</text>
  <text x="360" y="495" font-size="11" fill="#475569">If M_peak exceeds usable physical SRAM, device rejects execution to avoid out-of-memory kernel panics.</text>
  <text x="360" y="509" font-size="10" fill="#64748b">Backbone freezing removes gradient memory; parameter-efficient adapters fit within tightly bounded SRAM limits.</text>
  <!-- Bottom Takeaway Card -->
  <rect x="40" y="548" width="920" height="56" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="55" y="562" width="165" height="26" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="137" y="579" text-anchor="middle" font-size="11" font-weight="700" fill="#166534" letter-spacing="0.8px">ARCHITECTURAL LESSON</text>
  <text x="235" y="575" font-size="12" font-weight="700" fill="#166534">Activation Footprint Dwarfs Parameter Footprint in On-Device Learning</text>
  <text x="235" y="593" font-size="11" fill="#475569">Techniques like TinyTL succeed because bypassing backbone weight updates avoids saving intermediate layer activations.</text>
</svg>