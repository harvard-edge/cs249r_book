<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="860" height="390" fill="#ffffff"/>
  <!-- ===== Device limit ===== -->
  <path d="M260,40 H560" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="250" y="46" text-anchor="end" font-size="16" font-weight="700" fill="#b91c1c">M<tspan font-size="14" dy="4">device</tspan></text>
  <!-- ===== Working memory stack (schematic, not to scale) ===== -->
  <rect x="300" y="40" width="240" height="60" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="420" y="66" text-anchor="middle" font-size="16" fill="#475569">M<tspan font-size="14" dy="4">reserve</tspan></text>
  <text x="420" y="88" text-anchor="middle" font-size="15" fill="#475569">runtime + app</text>
  <rect x="300" y="100" width="240" height="100" fill="#c9daee" stroke="#1F407A" stroke-width="1.5"/>
  <text x="420" y="130" text-anchor="middle" font-size="16" fill="#14294E">max<tspan font-size="14" dy="4">t</tspan><tspan dx="4" dy="-4">[ M</tspan><tspan font-size="14" dy="4">activations</tspan><tspan dy="-4">(t) +</tspan></text>
  <text x="420" y="154" text-anchor="middle" font-size="16" fill="#14294E">M<tspan font-size="14" dy="4">workspace</tspan><tspan dy="-4">(t) ]</tspan></text>
  <text x="420" y="184" text-anchor="middle" font-size="15" fill="#14294E">activations + workspace</text>
  <rect x="300" y="200" width="240" height="40" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="314" y="225" font-size="16" fill="#14294E">M<tspan font-size="14" dy="4">train</tspan></text>
  <text x="526" y="225" text-anchor="end" font-size="15" fill="#14294E">trainable state</text>
  <rect x="300" y="240" width="240" height="60" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="420" y="265" text-anchor="middle" font-size="16" fill="#475569">M<tspan font-size="14" dy="4">weights,resident</tspan></text>
  <text x="420" y="288" text-anchor="middle" font-size="15" fill="#475569">resident weights</text>
  <text x="352" y="326" font-size="15" fill="#334155">working memory (SRAM or RAM)</text>
  <!-- ===== Peak brace (left of the stack) ===== -->
  <path d="M290,100 H282 V300 H290" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <text x="272" y="206" text-anchor="end" font-size="18" font-weight="700" fill="#0f172a">M<tspan font-size="14" dy="4">peak</tspan></text>
  <!-- ===== Nonvolatile storage, staged into the stack from below ===== -->
  <rect x="40" y="270" width="200" height="86" rx="4" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="41" y="271" width="198" height="25" rx="3" fill="#dcfce7"/>
  <path d="M40,296 H240" fill="none" stroke="#16a34a" stroke-width="0.8"/>
  <text x="52" y="289" font-size="15" font-weight="700" fill="#15803d">Nonvolatile flash</text>
  <rect x="60" y="310" width="160" height="32" rx="2" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="140" y="331" text-anchor="middle" font-size="15" fill="#475569">frozen weights</text>
  <path d="M240,326 H330 V301" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="252" y="318" font-size="15" fill="#475569">stage</text>
  <!-- ===== Activation + workspace profile, on the stack's vertical scale ===== -->
  <!-- baseline aligned with the bottom of the activations segment, peak with its top -->
  <path d="M590,200 H840" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="840" y="220" text-anchor="end" font-size="16" fill="#475569" font-style="italic">t</text>
  <path d="M590,194 L612,186 L634,174 L656,158 L676,138 L692,118 L704,100 L716,112 L730,132 L746,154 L764,172 L784,186 L806,194 L820,197 L820,200 L590,200 Z" fill="#EAF1F8" stroke="none"/>
  <path d="M590,194 L612,186 L634,174 L656,158 L676,138 L692,118 L704,100 L716,112 L730,132 L746,154 L764,172 L784,186 L806,194 L820,197" fill="none" stroke="#1F407A" stroke-width="1.8"/>
  <!-- peak level carried back to the top edge of the activations segment -->
  <path d="M540,100 H699" fill="none" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="540" cy="100" r="2.5" fill="#1F407A"/>
  <circle cx="704" cy="100" r="4" fill="#1F407A"/>
  <text x="704" y="88" text-anchor="middle" font-size="15" fill="#14294E">peak</text>
  <text x="634" y="222" text-anchor="middle" font-size="15" fill="#475569">forward</text>
  <text x="764" y="222" text-anchor="middle" font-size="15" fill="#475569">backward</text>
</svg>
