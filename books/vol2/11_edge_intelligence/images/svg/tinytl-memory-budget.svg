<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- LEFT: FLASH STORAGE DOMAIN (width 225, usable 195) -->
  <g transform="translate(25, 15)">
    <rect width="225" height="340" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="112" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Nonvolatile Flash / eMMC</text>

    <!-- Frozen Weights -->
    <g transform="translate(12, 40)">
      <rect width="201" height="85" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="20" font-size="9" font-weight="700" fill="#1F407A">Frozen Backbone Weights</text>
      <text x="10" y="38" font-size="8.5" fill="#475569">W_storage (INT8 / FP16)</text>
      <text x="10" y="54" font-size="8" fill="#64748b">10 MB – 100 MB footprint</text>
      <text x="10" y="70" font-size="8" fill="#64748b">Never loaded all at once in SRAM</text>
    </g>

    <!-- Flash Access -->
    <g transform="translate(12, 138)">
      <rect width="201" height="80" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="20" font-size="9" font-weight="700" fill="#0f172a">Flash Streaming Interface</text>
      <text x="10" y="38" font-size="8" fill="#475569">• Execute-in-Place (XIP)</text>
      <text x="10" y="52" font-size="8" fill="#475569">• DMA Chunk Staging</text>
      <text x="10" y="68" font-size="7.5" fill="#64748b">Staging buffers allocated in U(t)</text>
    </g>

    <!-- Architectural Principle Note -->
    <g transform="translate(12, 230)">
      <rect width="201" height="95" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1F407A">Storage vs. SRAM Boundary</text>
      <text x="10" y="34" font-size="8" fill="#1e3a8a">Weights stored in Flash consume</text>
      <text x="10" y="46" font-size="8" fill="#1e3a8a">package footprint, but do not count</text>
      <text x="10" y="58" font-size="8" fill="#1e3a8a">toward physical SRAM until staged</text>
      <text x="10" y="70" font-size="8" fill="#1e3a8a">during forward execution.</text>
    </g>
  </g>

  <!-- TRANSITION ARROW -->
  <line x1="250" y1="185" x2="278" y2="185" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="264" y="177" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1F407A">STAGE</text>

  <!-- RIGHT: PHYSICAL SRAM WORKING MEMORY (width 495, usable 465) -->
  <g transform="translate(280, 15)">
    <rect width="495" height="340" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <text x="247" y="24" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1F407A">Physical SRAM Working Memory Admission Budget</text>

    <!-- Peak Memory Formula Banner -->
    <g transform="translate(15, 38)">
      <rect width="465" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="232" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">M_peak = W_resident + S_train + max_t [ A_live(t) + U(t) ]</text>
    </g>

    <!-- 3 Terms Breakdown Columns (width 147 each, spacing 12) -->
    <g transform="translate(15, 78)">
      <!-- Term 1: W_resident (width 147, usable 127) -->
      <rect x="0" y="0" width="147" height="175" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="73" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Term 1: W_resident</text>
      <text x="8" y="38" font-size="8" font-weight="600" fill="#0f172a">Resident Weights</text>
      <text x="8" y="52" font-size="7.5" fill="#475569">• Unfrozen adapter blocks</text>
      <text x="8" y="66" font-size="7.5" fill="#475569">• Pinned backbone layers</text>
      <text x="8" y="80" font-size="7.5" fill="#475569">• Active chunk buffers</text>
      <text x="8" y="100" font-size="7.5" fill="#64748b">Only weights that cannot</text>
      <text x="8" y="112" font-size="7.5" fill="#64748b">stream from Flash stay</text>
      <text x="8" y="124" font-size="7.5" fill="#64748b">resident in SRAM.</text>

      <!-- Term 2: S_train -->
      <g transform="translate(159, 0)">
        <rect x="0" y="0" width="147" height="175" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="73" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">Term 2: S_train</text>
        <text x="8" y="38" font-size="8" font-weight="600" fill="#15803d">Trainable State</text>
        <text x="8" y="52" font-size="7.5" fill="#166534">• TinyTL lite-residuals</text>
        <text x="8" y="66" font-size="7.5" fill="#166534">• Bias terms &amp; grads</text>
        <text x="8" y="80" font-size="7.5" fill="#166534">• Optimizer moments:</text>
        <text x="12" y="94" font-size="7.5" fill="#475569">Adam: 2× params</text>
        <text x="12" y="106" font-size="7.5" fill="#475569">SGD: 1× params</text>
        <text x="8" y="126" font-size="7.5" font-weight="600" fill="#15803d">Freezing backbone drops</text>
        <text x="8" y="138" font-size="7.5" font-weight="600" fill="#15803d">optimizer footprint!</text>
      </g>

      <!-- Term 3: A_live + U -->
      <g transform="translate(318, 0)">
        <rect x="0" y="0" width="147" height="175" rx="2" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
        <text x="73" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#854d0e">Term 3: Dynamic State</text>
        <text x="8" y="38" font-size="8" font-weight="600" fill="#713f12">max_t [ A_live(t) + U(t) ]</text>
        <text x="8" y="52" font-size="7.5" fill="#854d0e">• Saved activations</text>
        <text x="8" y="66" font-size="7.5" font-weight="700" fill="#d97706">TinyTL eliminates</text>
        <text x="8" y="78" font-size="7.5" fill="#d97706">backbone state (6.5×↓)</text>
        <text x="8" y="96" font-size="7.5" fill="#854d0e">• Workspace U(t):</text>
        <text x="12" y="108" font-size="7.5" fill="#713f12">im2col GEMM buffer</text>
        <text x="12" y="120" font-size="7.5" fill="#713f12">DMA staging chunks</text>
      </g>
    </g>

    <!-- Admission Rule Footer -->
    <g transform="translate(15, 262)">
      <rect width="465" height="64" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#0f172a">Admission Constraint: M_peak ≤ M_budget = M_device − (M_runtime + M_app)</text>
      <text x="12" y="34" font-size="8" fill="#475569">If peak SRAM demand exceeds usable hardware memory, execution triggers an OOM fault.</text>
      <text x="12" y="48" font-size="8" fill="#475569">Backbone parameter freezing enables adaptation within tightly constrained on-chip SRAM.</text>
    </g>
  </g>
</svg>
