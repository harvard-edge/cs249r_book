<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Nonvolatile Weights Card -->
  <rect x="20" y="115" width="165" height="56" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="102.5" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Nonvolatile weights</text>

  <!-- Stage Connector -->
  <text x="210" y="133" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">Stage</text>
  <path d="M185 143 H235" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Working Memory Container Card -->
  <rect x="235" y="20" width="425" height="295" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="250" y="30" width="180" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="340" y="45" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A" letter-spacing="0.4">WORKING-MEMORY BUDGET</text>

  <!-- Resident frozen weights (Neutral) -->
  <rect x="255" y="66" width="180" height="48" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="345" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Resident frozen weights</text>

  <!-- Operator + -->
  <text x="447" y="96" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">+</text>

  <!-- Trainable state (Green) -->
  <rect x="460" y="66" width="180" height="48" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="550" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Trainable state</text>

  <!-- Operator + -->
  <text x="447" y="136" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">+</text>

  <!-- Peak simultaneous state (Amber) -->
  <rect x="255" y="148" width="385" height="70" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="447.5" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Peak simultaneous state</text>
  <text x="447.5" y="200" text-anchor="middle" font-size="11" fill="#78350f">Live activations + operator workspace</text>

  <!-- Downward arrow -->
  <path d="M447.5 218 V246" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Invariant Requirement Pill -->
  <rect x="300" y="248" width="295" height="30" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="447.5" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#1F407A">Required memory ≤ admitted budget</text>
</svg>
