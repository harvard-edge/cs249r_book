<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- LEFT: FLASH / STORAGE DOMAIN -->
  <g transform="translate(25, 20)">
    <rect width="200" height="340" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="200" height="28" rx="3" fill="#f1f5f9"/>
    <text x="100" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Nonvolatile Flash / eMMC</text>

    <!-- Frozen Weights -->
    <g transform="translate(12, 40)">
      <rect width="176" height="85" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="20" font-size="9.5" font-weight="700" fill="#1F407A">Frozen Backbone Weights</text>
      <text x="10" y="38" font-size="8.5" fill="#475569">W_storage (INT8 / FP16)</text>
      <text x="10" y="54" font-size="8.5" fill="#64748b">10 MB – 100 MB footprint</text>
      <text x="10" y="70" font-size="8" fill="#94a3b8">Never resident all at once in SRAM</text>
    </g>

    <!-- Flash Access -->
    <g transform="translate(12, 138)">
      <rect width="176" height="80" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="20" font-size="9.5" font-weight="700" fill="#0f172a">Flash Streaming Interface</text>
      <text x="10" y="38" font-size="8.5" fill="#475569">• Execute-in-Place (XIP)</text>
      <text x="10" y="54" font-size="8.5" fill="#475569">• DMA Chunk Staging</text>
      <text x="10" y="70" font-size="8" fill="#64748b">Staging buffers allocated in U(t)</text>
    </g>

    <!-- Architectural Principle Note -->
    <g transform="translate(12, 230)">
      <rect width="176" height="95" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#1F407A">Storage vs. SRAM Boundary</text>
      <text x="10" y="36" font-size="8" fill="#1e3a8a">Weights stored in Flash consume</text>
      <text x="10" y="48" font-size="8" fill="#1e3a8a">package footprint, but do not count</text>
      <text x="10" y="60" font-size="8" fill="#1e3a8a">toward physical SRAM until staged</text>
      <text x="10" y="72" font-size="8" fill="#1e3a8a">during forward execution.</text>
    </g>
  </g>

  <!-- TRANSITION ARROW -->
  <line x1="225" y1="180" x2="255" y2="180" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="240" y="172" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">STAGE</text>

  <!-- RIGHT: PHYSICAL SRAM WORKING MEMORY DOMAIN -->
  <g transform="translate(265, 20)">
    <rect width="470" height="340" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <rect width="470" height="28" rx="3" fill="#EAF1F8"/>
    <text x="235" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Physical SRAM Working Memory Admission Budget</text>

    <!-- Peak Memory Formula Banner -->
    <g transform="translate(15, 38)">
      <rect width="440" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="220" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">M_peak = W_resident + S_train + max_t [ A_live(t) + U(t) ]</text>
    </g>

    <!-- 3 Terms Breakdown Columns -->
    <g transform="translate(15, 78)">
      <!-- Term 1: W_resident -->
      <rect x="0" y="0" width="140" height="175" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="0" y="0" width="140" height="22" rx="2" fill="#f1f5f9"/>
      <text x="70" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Term 1: W_resident</text>
      <text x="10" y="38" font-size="8.5" font-weight="600" fill="#0f172a">Resident Weights</text>
      <text x="10" y="54" font-size="8" fill="#475569">• Unfrozen adapter blocks</text>
      <text x="10" y="68" font-size="8" fill="#475569">• Pinned backbone layers</text>
      <text x="10" y="82" font-size="8" fill="#475569">• Active chunk buffers</text>
      <text x="10" y="104" font-size="7.5" fill="#64748b">Only weights that cannot</text>
      <text x="10" y="116" font-size="7.5" fill="#64748b">stream from Flash stay</text>
      <text x="10" y="128" font-size="7.5" fill="#64748b">permanently in SRAM.</text>

      <!-- Term 2: S_train -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="140" height="175" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <rect x="0" y="0" width="140" height="22" rx="2" fill="#dcfce7"/>
        <text x="70" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">Term 2: S_train</text>
        <text x="10" y="38" font-size="8.5" font-weight="600" fill="#15803d">Trainable State</text>
        <text x="10" y="54" font-size="8" fill="#166534">• TinyTL lite-residuals</text>
        <text x="10" y="68" font-size="8" fill="#166534">• Bias terms &amp; gradients</text>
        <text x="10" y="82" font-size="8" fill="#166534">• Optimizer moments:</text>
        <text x="15" y="96" font-size="7.5" fill="#475569">Adam: 2× param bytes</text>
        <text x="15" y="108" font-size="7.5" fill="#475569">SGD: 1× param bytes</text>
        <text x="10" y="130" font-size="7.5" fill="#15803d">Freezing backbone drops</text>
        <text x="10" y="142" font-size="7.5" fill="#15803d">optimizer footprint!</text>
      </g>

      <!-- Term 3: A_live + U -->
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="140" height="175" rx="2" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
        <rect x="0" y="0" width="140" height="22" rx="2" fill="#fef9c3"/>
        <text x="70" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#854d0e">Term 3: Dynamic State</text>
        <text x="10" y="38" font-size="8.5" font-weight="600" fill="#713f12">max_t [ A_live(t) + U(t) ]</text>
        <text x="10" y="54" font-size="8" fill="#854d0e">• Saved activations</text>
        <text x="10" y="68" font-size="8" fill="#d97706"><tspan font-weight="700">TinyTL eliminates</tspan></text>
        <text x="10" y="80" font-size="8" fill="#d97706">backbone activations (6.5×↓)</text>
        <text x="10" y="98" font-size="8" fill="#854d0e">• U(t): Scratchpad workspace</text>
        <text x="15" y="112" font-size="7.5" fill="#713f12">im2col convolution buffer</text>
        <text x="15" y="124" font-size="7.5" fill="#713f12">DMA streaming scratch</text>
      </g>
    </g>

    <!-- Admission Rule Footer -->
    <g transform="translate(15, 264)">
      <rect width="440" height="62" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="9.5" font-weight="700" fill="#0f172a">Admission Constraint: M_peak ≤ M_budget = M_device − (M_runtime + M_app)</text>
      <text x="12" y="38" font-size="8.5" fill="#475569">If peak SRAM demand exceeds usable hardware memory, execution triggers an OOM fault.</text>
      <text x="12" y="50" font-size="8.5" fill="#475569">Backbone parameter freezing enables adaptation within tightly constrained on-chip SRAM.</text>
    </g>
  </g>
</svg>
