<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 720 260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect y="30" width="720" height="260" fill="#ffffff"/>
  <!-- ===== Nonvolatile storage ===== -->
  <rect x="30" y="110" width="190" height="100" rx="4" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
  <path d="M30.5,132 V114 Q30.5,110.5 34,110.5 H216 Q219.5,110.5 219.5,114 V132 Z" fill="#dcfce7"/>
  <path d="M30,132 H220" stroke="#16a34a" stroke-width="0.6"/>
  <text x="40" y="125" font-size="12" font-weight="700" fill="#14532d">Nonvolatile flash</text>
  <rect x="55" y="150" width="140" height="30" rx="2" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="125" y="169" text-anchor="middle" font-size="12" fill="#475569">frozen weights</text>
  <!-- ===== Working memory stack (not to scale) ===== -->
  <rect x="320" y="200" width="160" height="50" rx="0" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="400" y="229" text-anchor="middle" font-size="12" fill="#475569">M<tspan font-size="11" dy="3">weights,resident</tspan></text>
  <text x="494" y="229" font-size="12" fill="#334155">resident weights</text>
  <rect x="320" y="170" width="160" height="30" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="400" y="188" text-anchor="middle" font-size="12" fill="#14294E">M<tspan font-size="11" dy="3">train</tspan></text>
  <text x="494" y="189" font-size="12" fill="#334155">trainable state</text>
  <rect x="320" y="100" width="160" height="70" fill="#c9daee" stroke="#1F407A" stroke-width="1.2"/>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#14294E">max<tspan font-size="11" dy="3">t</tspan><tspan dy="-3"> [ M</tspan><tspan font-size="11" dy="3">activations</tspan><tspan dy="-3">(t)</tspan></text>
  <text x="400" y="151" text-anchor="middle" font-size="12" fill="#14294E">+ M<tspan font-size="11" dy="3">workspace</tspan><tspan dy="-3">(t) ]</tspan></text>
  <text x="494" y="139" font-size="12" fill="#334155">activations + workspace</text>
  <rect x="320" y="50" width="160" height="50" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="78" text-anchor="middle" font-size="12" fill="#64748b">M<tspan font-size="11" dy="3">reserve</tspan></text>
  <text x="494" y="79" font-size="12" fill="#334155">runtime + app</text>
  <!-- ===== Device limit ===== -->
  <path d="M300,50 H490" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="496" y="54" font-size="12" font-weight="700" fill="#b91c1c">M<tspan font-size="11" dy="3">device</tspan></text>
  <!-- ===== Peak brace ===== -->
  <path d="M642,100 H650 V250 H642" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <text x="658" y="180" font-size="12" font-weight="700" fill="#0f172a">M<tspan font-size="11" dy="3">peak</tspan></text>
  <!-- ===== Staging ===== -->
  <path d="M220,165 H260 V135 H318" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="266" y="127" font-size="12" fill="#475569">stage</text>
  <text x="400" y="272" text-anchor="middle" font-size="12" fill="#334155">working memory (SRAM or RAM)</text>
</svg>
