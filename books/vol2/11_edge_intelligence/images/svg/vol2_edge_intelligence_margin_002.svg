<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 250" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Full model copy versus residual adapter, per context</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#777777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="180" height="250" fill="#ffffff"/>
  <!-- log scale; StorageWall: full 40 MB, adapter 0.2 MB, per_context_savings 200x -->
  <rect x="3.6" y="36" width="153.3" height="78.9" fill="#006395"/>
  <text x="154.5" y="80" font-size="14" fill="#ffffff" text-anchor="end">Full 40 MB</text>
  <line x1="28" y1="136" x2="72" y2="136" stroke="#777777" stroke-width="1.36" marker-start="url(#ah)"/>
  <line x1="111" y1="136" x2="156.5" y2="136" stroke="#777777" stroke-width="1.36" marker-end="url(#ah)"/>
  <text x="91.5" y="141" font-size="14" fill="#333333" text-anchor="middle">200×</text>
  <rect x="3.6" y="156.3" width="22.5" height="78.9" fill="#006395"/>
  <text x="37" y="200" font-size="14" fill="#333333">Adapter 0.2 MB</text>
  <text x="176" y="233" font-size="12" fill="#777777" text-anchor="end">log scale</text>
  <line x1="3" y1="246" x2="177" y2="246" stroke="#cccccc" stroke-width="1.36"/>
</svg>
