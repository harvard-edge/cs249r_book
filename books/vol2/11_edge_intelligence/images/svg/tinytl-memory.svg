<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-rose" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#e11d48"/>
    </marker>
    <marker id="arr-emerald" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#059669"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 6.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
    .axis-txt { font-size: 6.5px; fill: #64748b; }
    .bar-lbl { font-size: 7px; font-weight: 700; }
    .bar-sub { font-size: 6px; }
    .math-txt { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- MAIN CONTAINER CARD                                                    -->
  <!-- ====================================================================== -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="752" height="424" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Header Badges -->
    <rect x="14" y="12" width="170" height="16" rx="2" fill="#1F407A"/>
    <text x="99" y="23" text-anchor="middle" class="badge-txt">MEMORY PROFILING BREAKDOWN</text>
    <text x="194" y="23.5" font-size="6.8" font-weight="600" fill="#14294E">MCU SRAM Constraint Evaluation (MCUNet / TinyTL)</text>

    <!-- ==================================================================== -->
    <!-- CHART CANVAS                                                         -->
    <!-- ==================================================================== -->
    <g transform="translate(30, 42)">
      <!-- Background Grid Card -->
      <rect x="50" y="0" width="640" height="280" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Gridlines & Labels (0 to 2,000 KB) -->
      <!-- 2,000 KB line -->
      <line x1="50" y1="46" x2="690" y2="46" stroke="#f1f5f9" stroke-width="1"/>
      <text x="42" y="49" text-anchor="end" class="axis-txt">2,000 KB</text>

      <!-- 1,500 KB line -->
      <line x1="50" y1="102" x2="690" y2="102" stroke="#f1f5f9" stroke-width="1"/>
      <text x="42" y="105" text-anchor="end" class="axis-txt">1,500 KB</text>

      <!-- 1,000 KB line -->
      <line x1="50" y1="158" x2="690" y2="158" stroke="#f1f5f9" stroke-width="1"/>
      <text x="42" y="161" text-anchor="end" class="axis-txt">1,000 KB</text>

      <!-- 500 KB line -->
      <line x1="50" y1="214" x2="690" y2="214" stroke="#f1f5f9" stroke-width="1"/>
      <text x="42" y="217" text-anchor="end" class="axis-txt">500 KB</text>

      <!-- 0 KB Baseline -->
      <line x1="50" y1="268" x2="690" y2="268" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="42" y="271" text-anchor="end" class="axis-txt">0 KB</text>

      <!-- ────────────────────────────────────────────────────────────────── -->
      <!-- CRITICAL THRESHOLD: 512 KB MCU SRAM CEILING                        -->
      <!-- ────────────────────────────────────────────────────────────────── -->
      <line x1="50" y1="211" x2="690" y2="211" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,3"/>
      
      <!-- Threshold Tag Badge (Left in 90px gutter) -->
      <g transform="translate(54, 194)">
        <rect x="0" y="0" width="80" height="15" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="0.8"/>
        <text x="40" y="10.5" text-anchor="middle" font-size="5.8" font-weight="700" fill="#be123c">512 KB MCU SRAM</text>
      </g>

      <!-- ────────────────────────────────────────────────────────────────── -->
      <!-- BAR A: STANDARD FINE-TUNING (STACKED)                              -->
      <!-- ────────────────────────────────────────────────────────────────── -->
      <g transform="translate(140, 0)">
        <!-- Segment 1: Model Weights (340 KB) -->
        <rect x="0" y="230" width="130" height="38" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="65" y="246" text-anchor="middle" class="bar-lbl" fill="#475569">Model Weights</text>
        <text x="65" y="258" text-anchor="middle" class="bar-sub" fill="#64748b">340 KB</text>

        <!-- Segment 2: Intermediate Activations (1,000 KB) -->
        <rect x="0" y="118" width="130" height="112" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
        <text x="65" y="166" text-anchor="middle" class="bar-lbl" fill="#b45309">Intermediate Activations</text>
        <text x="65" y="178" text-anchor="middle" font-size="6.8" font-weight="700" fill="#d97706">1,000 KB</text>
        <text x="65" y="190" text-anchor="middle" class="bar-sub" fill="#92400e">Cached for all backward layers</text>

        <!-- Segment 3: Weight Gradients (340 KB) -->
        <rect x="0" y="80" width="130" height="38" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="0.8"/>
        <text x="65" y="96" text-anchor="middle" class="bar-lbl" fill="#be123c">Weight Gradients</text>
        <text x="65" y="108" text-anchor="middle" class="bar-sub" fill="#e11d48">340 KB</text>

        <!-- Segment 4: Optimizer States (420 KB) -->
        <rect x="0" y="34" width="130" height="46" rx="2" fill="#ede9fe" stroke="#ddd6fe" stroke-width="0.8"/>
        <text x="65" y="52" text-anchor="middle" class="bar-lbl" fill="#6d28d9">Optimizer States</text>
        <text x="65" y="64" text-anchor="middle" class="bar-sub" fill="#7c3aed">420 KB (Momenta)</text>

        <!-- Top Total Callout Box -->
        <g transform="translate(-10, 8)">
          <rect x="0" y="0" width="150" height="20" rx="2" fill="#e11d48"/>
          <text x="75" y="13" text-anchor="middle" font-size="7" font-weight="700" fill="#ffffff">TOTAL: ~2,100 KB (OOM ✗)</text>
        </g>

        <!-- Overflow Alert Indicator at 512 KB line -->
        <g transform="translate(138, 194)">
          <rect x="0" y="0" width="84" height="15" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="0.8"/>
          <text x="42" y="10.5" text-anchor="middle" font-size="6" font-weight="700" fill="#e11d48">Exceeds SRAM 4.1×</text>
        </g>

        <!-- Label below chart -->
        <text x="65" y="295" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">(a) Standard Fine-Tuning</text>
        <text x="65" y="306" text-anchor="middle" font-size="6.5" fill="#64748b">Backprop through entire model</text>
      </g>

      <!-- ────────────────────────────────────────────────────────────────── -->
      <!-- REDUCTION CALLOUT ARROW                                             -->
      <!-- ────────────────────────────────────────────────────────────────── -->
      <g transform="translate(330, 45)">
        <path d="M 0,20 Q 50,20 60,140" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-emerald)"/>
        <g transform="translate(25, 45)">
          <rect x="0" y="0" width="80" height="28" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
          <text x="40" y="11" text-anchor="middle" font-size="6.8" font-weight="700" fill="#047857">~5.4× Memory</text>
          <text x="40" y="21" text-anchor="middle" font-size="6.2" font-weight="700" fill="#059669">Reduction</text>
        </g>
      </g>

      <!-- ────────────────────────────────────────────────────────────────── -->
      <!-- BAR B: TINYTL (STACKED)                                            -->
      <!-- ────────────────────────────────────────────────────────────────── -->
      <g transform="translate(450, 0)">
        <!-- Total height is ~44px (representing ~390 KB)
             Baseline: y=268
             Top of bar: y=224 (comfortably below 512 KB line at y=211)
        -->

        <!-- Segment 1: Model Weights (340 KB -> 38px, y=230 to 268) -->
        <rect x="0" y="230" width="130" height="38" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="65" y="246" text-anchor="middle" class="bar-lbl" fill="#475569">Model Weights</text>
        <text x="65" y="258" text-anchor="middle" class="bar-sub" fill="#64748b">340 KB (Frozen)</text>

        <!-- Segment 2: Lite Residual Activations (30 KB -> 3.5px, y=226.5 to 230) -->
        <rect x="0" y="226" width="130" height="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/>

        <!-- Segment 3: Bias Gradients & Head (20 KB -> 2px, y=224 to 226) -->
        <rect x="0" y="224" width="130" height="2" fill="#bbf7d0" stroke="#4ade80" stroke-width="0.5"/>

        <!-- Pointer Callouts for tiny segments on right -->
        <g transform="translate(138, 218)">
          <!-- Line to Lite Residual -->
          <line x1="0" y1="9" x2="10" y2="9" stroke="#15803d" stroke-width="0.8"/>
          <text x="14" y="11" font-size="6" font-weight="600" fill="#15803d">Lite Residual Act: 30 KB</text>

          <!-- Line to Bias Gradients -->
          <line x1="0" y1="0" x2="10" y2="0" stroke="#166534" stroke-width="0.8"/>
          <text x="14" y="2" font-size="6" font-weight="600" fill="#166534">Bias Grads + Head: 20 KB</text>
        </g>

        <!-- Top Total Callout Box -->
        <g transform="translate(-10, 185)">
          <rect x="0" y="0" width="150" height="20" rx="2" fill="#059669"/>
          <text x="75" y="13" text-anchor="middle" font-size="7" font-weight="700" fill="#ffffff">TOTAL: ~390 KB (FITS ✓)</text>
        </g>

        <!-- Margin Safety Tag (under 512 KB line) -->
        <g transform="translate(138, 234)">
          <rect x="0" y="0" width="80" height="15" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
          <text x="40" y="10.5" text-anchor="middle" font-size="6" font-weight="700" fill="#047857">76% of SRAM Budget</text>
        </g>

        <!-- Label below chart -->
        <text x="65" y="295" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">(b) TinyTL Transfer Learning</text>
        <text x="65" y="306" text-anchor="middle" font-size="6.5" fill="#64748b">Frozen backbone + lite residual</text>
      </g>
    </g>

    <!-- ==================================================================== -->
    <!-- COMPONENT LEGEND & SYSTEMS TAKEAWAYS                                 -->
    <!-- ==================================================================== -->
    <g transform="translate(40, 360)">
      <!-- Legend Chips -->
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="18" y="9" font-size="6.5" fill="#475569">Model Weights</text>

      <rect x="95" y="0" width="12" height="12" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="113" y="9" font-size="6.5" fill="#475569">Activations (Backprop)</text>

      <rect x="220" y="0" width="12" height="12" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="0.8"/>
      <text x="238" y="9" font-size="6.5" fill="#475569">Weight Gradients</text>

      <rect x="330" y="0" width="12" height="12" rx="2" fill="#ede9fe" stroke="#ddd6fe" stroke-width="0.8"/>
      <text x="348" y="9" font-size="6.5" fill="#475569">Optimizer States</text>

      <rect x="440" y="0" width="12" height="12" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="458" y="9" font-size="6.5" fill="#475569">Lite Residual (TinyTL)</text>

      <line x1="565" y1="6" x2="585" y2="6" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,2"/>
      <text x="592" y="9" font-size="6.5" font-weight="700" fill="#be123c">512 KB SRAM Ceiling</text>

      <!-- Bottom takeaway text -->
      <text x="336" y="30" text-anchor="middle" font-size="7" fill="#64748b" font-style="italic">
        Freezing the convolutional backbone eliminates intermediate activation caching, allowing on-device learning to operate strictly within MCU on-chip SRAM.
      </text>
    </g>
  </g>
</svg>