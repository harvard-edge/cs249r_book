<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <pattern id="meta" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#d97706" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="370" fill="#ffffff"/>
  <!-- ===== Column headers ===== -->
  <text x="323" y="26" text-anchor="middle" font-size="13" fill="#555555">gradient vector on device (<tspan font-style="italic">d</tspan> = 4)</text>
  <text x="520" y="26" font-size="13" fill="#555555">upload payload</text>
  <path d="M496,40 V350" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- ===== Row A: FP32 ===== -->
  <text x="20" y="68" font-size="15" font-weight="700" fill="#333333">A<tspan dx="8">FP32</tspan></text>
  <text x="20" y="86" font-size="13" fill="#555555">uncompressed</text>
  <rect x="180" y="50" width="64" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="212" y="75" text-anchor="middle" font-size="14" fill="#333333">+0.50</text>
  <rect x="254" y="50" width="64" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="286" y="75" text-anchor="middle" font-size="14" fill="#333333">−0.20</text>
  <rect x="328" y="50" width="64" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="360" y="75" text-anchor="middle" font-size="14" fill="#333333">+0.01</text>
  <rect x="402" y="50" width="64" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="434" y="75" text-anchor="middle" font-size="14" fill="#333333">+0.80</text>
  <text x="212" y="108" text-anchor="middle" font-size="13" fill="#555555">32 bit</text>
  <text x="286" y="108" text-anchor="middle" font-size="13" fill="#555555">32 bit</text>
  <text x="360" y="108" text-anchor="middle" font-size="13" fill="#555555">32 bit</text>
  <text x="434" y="108" text-anchor="middle" font-size="13" fill="#555555">32 bit</text>
  <rect x="520" y="58" width="192" height="24" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <path d="M568,58 V82 M616,58 V82 M664,58 V82" stroke="#d97706" stroke-width="0.8"/>
  <text x="722" y="75" font-size="13" fill="#333333">128 bits</text>
  <!-- ===== Row B: INT8 quantization ===== -->
  <text x="20" y="158" font-size="15" font-weight="700" fill="#333333">B<tspan dx="8">INT8</tspan></text>
  <text x="20" y="176" font-size="13" fill="#555555">scale <tspan font-style="italic">s</tspan> ≈ 0.0063</text>
  <rect x="180" y="140" width="64" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="212" y="165" text-anchor="middle" font-size="14" fill="#333333">+79</text>
  <rect x="254" y="140" width="64" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="286" y="165" text-anchor="middle" font-size="14" fill="#333333">−32</text>
  <rect x="328" y="140" width="64" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="360" y="165" text-anchor="middle" font-size="14" fill="#333333">+2</text>
  <rect x="402" y="140" width="64" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="434" y="165" text-anchor="middle" font-size="14" fill="#333333">+127</text>
  <text x="212" y="198" text-anchor="middle" font-size="13" fill="#555555">8 bit</text>
  <text x="286" y="198" text-anchor="middle" font-size="13" fill="#555555">8 bit</text>
  <text x="360" y="198" text-anchor="middle" font-size="13" fill="#555555">8 bit</text>
  <text x="434" y="198" text-anchor="middle" font-size="13" fill="#555555">8 bit</text>
  <rect x="520" y="148" width="48" height="24" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <path d="M532,148 V172 M544,148 V172 M556,148 V172" stroke="#d97706" stroke-width="0.8"/>
  <rect x="568" y="148" width="12" height="24" fill="url(#meta)" stroke="#d97706" stroke-width="1"/>
  <text x="590" y="165" font-size="13" fill="#333333">32 bits + scale</text>
  <!-- ===== Row C: top-k sparsification ===== -->
  <text x="20" y="248" font-size="15" font-weight="700" fill="#333333">C<tspan dx="8">Top-</tspan><tspan font-style="italic">k</tspan></text>
  <text x="20" y="266" font-size="13" fill="#555555"><tspan font-style="italic">k</tspan> = 2, error feedback</text>
  <rect x="180" y="230" width="64" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="212" y="255" text-anchor="middle" font-size="14" fill="#333333">+0.50</text>
  <rect x="254" y="230" width="64" height="40" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="286" y="255" text-anchor="middle" font-size="14" fill="#94a3b8">−0.20</text>
  <rect x="328" y="230" width="64" height="40" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="360" y="255" text-anchor="middle" font-size="14" fill="#94a3b8">+0.01</text>
  <rect x="402" y="230" width="64" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="434" y="255" text-anchor="middle" font-size="14" fill="#333333">+0.80</text>
  <text x="212" y="288" text-anchor="middle" font-size="13" fill="#555555">idx 0</text>
  <text x="434" y="288" text-anchor="middle" font-size="13" fill="#555555">idx 3</text>
  <path d="M286,270 V308" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <path d="M360,270 V308" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="254" y="310" width="138" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="323" y="332" text-anchor="middle" font-size="13" fill="#14294E">residual <tspan font-style="italic">e</tspan>, kept local</text>
  <rect x="520" y="238" width="96" height="24" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <path d="M568,238 V262" stroke="#d97706" stroke-width="0.8"/>
  <rect x="616" y="238" width="24" height="24" fill="url(#meta)" stroke="#d97706" stroke-width="1"/>
  <text x="650" y="255" font-size="13" fill="#333333">2 values + indices</text>
</svg>
