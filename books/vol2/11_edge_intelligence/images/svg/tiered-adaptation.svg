<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="720" height="740" fill="#ffffff"/>
  <!-- ===== Start ===== -->
  <rect x="250" y="20" width="220" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="360" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">Deploy on-device learning</text>
  <path d="M360,60 V78" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- ===== Q1: adaptation demand ===== -->
  <path d="M360,80 L470,120 L360,160 L250,120 Z" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="360" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">Heavy adaptation</text>
  <text x="360" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">needed?</text>
  <path d="M250,120 H150 V198" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="200" y="112" text-anchor="middle" font-size="13" fill="#555555">no</text>
  <path d="M470,120 H570 V198" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="520" y="112" text-anchor="middle" font-size="13" fill="#555555">yes</text>
  <!-- ===== Lightweight card ===== -->
  <rect x="25" y="200" width="250" height="70" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="150" y="218" text-anchor="middle" font-size="12" fill="#1F407A">lightweight</text>
  <text x="150" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">Bias-only (BitFit)</text>
  <text x="150" y="258" text-anchor="middle" font-size="12" fill="#555555">microcontrollers</text>
  <!-- ===== Moderate card ===== -->
  <rect x="445" y="200" width="250" height="70" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="570" y="218" text-anchor="middle" font-size="12" fill="#1F407A">moderate</text>
  <text x="570" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">Adapters or LoRA</text>
  <text x="570" y="258" text-anchor="middle" font-size="12" fill="#555555">mobile NPUs</text>
  <path d="M570,270 V288" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- ===== Q2: compute and energy envelope ===== -->
  <path d="M570,290 L680,330 L570,370 L460,330 Z" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="570" y="327" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">Compute and energy</text>
  <text x="570" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">sufficient?</text>
  <path d="M570,370 V408" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="580" y="394" font-size="13" fill="#555555">yes</text>
  <path d="M460,330 H360 V518" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="410" y="322" text-anchor="middle" font-size="13" fill="#555555">no</text>
  <!-- ===== Full card ===== -->
  <rect x="445" y="410" width="250" height="70" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="570" y="428" text-anchor="middle" font-size="12" fill="#1F407A">full</text>
  <text x="570" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#14294E">Partial or full fine-tuning</text>
  <text x="570" y="468" text-anchor="middle" font-size="12" fill="#555555">wall-powered edge servers, high-end GPUs</text>
  <!-- ===== Q3: cross-device value ===== -->
  <path d="M150,270 V560 H248" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M570,480 V560 H472" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M360,520 L470,560 L360,600 L250,560 Z" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="360" y="557" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">Updates valuable</text>
  <text x="360" y="573" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">across devices?</text>
  <path d="M360,600 V620" fill="none" stroke="#555555" stroke-width="1.2"/>
  <path d="M360,620 H210 V648" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M360,620 H510 V648" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="200" y="638" text-anchor="end" font-size="13" fill="#555555">no</text>
  <text x="520" y="638" font-size="13" fill="#555555">yes</text>
  <!-- ===== Outcomes ===== -->
  <rect x="100" y="650" width="220" height="70" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="210" y="668" text-anchor="middle" font-size="12" fill="#555555">isolated</text>
  <text x="210" y="688" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">Local-only adaptation</text>
  <text x="210" y="708" text-anchor="middle" font-size="12" fill="#555555">shadow validation, drift monitoring</text>
  <rect x="400" y="650" width="220" height="70" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="510" y="668" text-anchor="middle" font-size="12" fill="#6d28d9">federated</text>
  <text x="510" y="688" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">FedAvg + differential privacy</text>
  <text x="510" y="708" text-anchor="middle" font-size="12" fill="#555555">fleet model synchronization</text>
</svg>
