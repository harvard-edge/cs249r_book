<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="370" fill="#ffffff"/>
  <!-- ===== Stage 1: cloud meta-training ===== -->
  <text x="105" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">1<tspan dx="8">Meta-train</tspan></text>
  <text x="105" y="52" text-anchor="middle" font-size="15" fill="#64748b">cloud, generic data</text>
  <rect x="30" y="96" width="150" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" font-size="15" fill="#14294E">Layer 1</text>
  <rect x="30" y="140" width="150" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="105" y="162" text-anchor="middle" font-size="15" fill="#14294E">Layer 2</text>
  <rect x="30" y="184" width="150" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="105" y="206" text-anchor="middle" font-size="15" fill="#14294E">Layer 3</text>
  <rect x="30" y="228" width="150" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="105" y="250" text-anchor="middle" font-size="15" fill="#14294E">Head</text>
  <path d="M182,180 H236" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="209" y="170" text-anchor="middle" font-size="16" fill="#334155">θ</text>
  <!-- ===== Stage 2: rank by benefit per unit cost; budget sets the cut ===== -->
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">2<tspan dx="8">Rank</tspan></text>
  <text x="450" y="52" text-anchor="middle" font-size="15" fill="#64748b">benefit per unit device cost</text>
  <rect x="290" y="112" width="50" height="150" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="315.0" y="282" text-anchor="middle" font-size="15" fill="#14294E">Head</text>
  <rect x="340" y="150" width="84" height="112" rx="0" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="382.0" y="282" text-anchor="middle" font-size="15" fill="#14294E">Layer 3</text>
  <rect x="424" y="210" width="110" height="52" rx="0" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="479.0" y="282" text-anchor="middle" font-size="15" fill="#475569">Layer 2</text>
  <rect x="534" y="228" width="90" height="34" rx="0" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="579.0" y="282" text-anchor="middle" font-size="15" fill="#475569">Layer 1</text>
  <path d="M290,262 H640" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <path d="M290,262 V94" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="298" y="102" font-size="15" fill="#475569">benefit / cost</text>
  <text x="640" y="306" text-anchor="end" font-size="15" fill="#475569">cumulative device cost</text>
  <path d="M424,90 V266" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="432" y="142" font-size="15" font-weight="700" fill="#b91c1c">device budget</text>
  <text x="432" y="162" font-size="15" fill="#b91c1c">data, compute, memory</text>
  <!-- ===== Stage 3: selective on-device update ===== -->
  <text x="795" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">3<tspan dx="8">Update</tspan></text>
  <text x="795" y="52" text-anchor="middle" font-size="15" fill="#64748b">device, local data</text>
  <path d="M660,180 H714" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="687" y="170" text-anchor="middle" font-size="15" fill="#334155">mask</text>
  <rect x="720" y="96" width="150" height="34" rx="2" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="795" y="118" text-anchor="middle" font-size="15" fill="#475569">Layer 1</text>
  <rect x="720" y="140" width="150" height="34" rx="2" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="795" y="162" text-anchor="middle" font-size="15" fill="#475569">Layer 2</text>
  <rect x="720" y="184" width="150" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="795" y="206" text-anchor="middle" font-size="15" fill="#14294E">Layer 3</text>
  <rect x="720" y="228" width="150" height="34" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="795" y="250" text-anchor="middle" font-size="15" fill="#14294E">Head</text>
  <!-- ===== Legend ===== -->
  <rect x="330" y="334" width="18" height="14" rx="1" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="356" y="346" font-size="15" fill="#475569">frozen</text>
  <rect x="440" y="334" width="18" height="14" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="466" y="346" font-size="15" fill="#475569">trainable</text>
</svg>
