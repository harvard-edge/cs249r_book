<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="680" height="300" fill="#ffffff"/>
  <!-- ===== Stage 1: cloud meta-training ===== -->
  <text x="100" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">1  Meta-train</text>
  <text x="100" y="44" text-anchor="middle" font-size="11" fill="#64748b">cloud, generic data</text>
  <rect x="40" y="80" width="120" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="100" y="99" text-anchor="middle" font-size="12" fill="#14294E">Layer 1</text>
  <rect x="40" y="120" width="120" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="100" y="139" text-anchor="middle" font-size="12" fill="#14294E">Layer 2</text>
  <rect x="40" y="160" width="120" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="100" y="179" text-anchor="middle" font-size="12" fill="#14294E">Layer 3</text>
  <rect x="40" y="200" width="120" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="100" y="219" text-anchor="middle" font-size="12" fill="#14294E">Head</text>
  <!-- ===== Stage 2: importance ranking under device budget ===== -->
  <text x="340" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">2  Rank</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#64748b">importance per unit cost</text>
  <rect x="220" y="244" width="240" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="340" y="261" text-anchor="middle" font-size="11" fill="#475569">device budget: data, compute, memory</text>
  <text x="300" y="99" text-anchor="end" font-size="12" fill="#334155">Layer 1</text>
  <rect x="310" y="86" width="30" height="18" fill="#cbd5e1"/>
  <text x="300" y="139" text-anchor="end" font-size="12" fill="#334155">Layer 2</text>
  <rect x="310" y="126" width="45" height="18" fill="#cbd5e1"/>
  <text x="300" y="179" text-anchor="end" font-size="12" fill="#334155">Layer 3</text>
  <rect x="310" y="166" width="110" height="18" fill="#1F407A"/>
  <text x="300" y="219" text-anchor="end" font-size="12" fill="#334155">Head</text>
  <rect x="310" y="206" width="130" height="18" fill="#1F407A"/>
  <path d="M390,72 V244" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="394" y="72" font-size="11" fill="#b91c1c">cut</text>
  <!-- ===== Stage 3: selective on-device update ===== -->
  <text x="580" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">3  Update</text>
  <text x="580" y="44" text-anchor="middle" font-size="11" fill="#64748b">device, local data</text>
  <rect x="520" y="80" width="120" height="30" rx="2" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="580" y="99" text-anchor="middle" font-size="12" fill="#475569">Layer 1</text>
  <rect x="520" y="120" width="120" height="30" rx="2" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="580" y="139" text-anchor="middle" font-size="12" fill="#475569">Layer 2</text>
  <rect x="520" y="160" width="120" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="580" y="179" text-anchor="middle" font-size="12" fill="#14294E">Layer 3</text>
  <rect x="520" y="200" width="120" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="580" y="219" text-anchor="middle" font-size="12" fill="#14294E">Head</text>
  <path d="M162,155 H198" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="180" y="147" text-anchor="middle" font-size="12" fill="#334155">θ</text>
  <path d="M470,155 H518" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="494" y="147" text-anchor="middle" font-size="11" fill="#334155">mask</text>
  <!-- ===== Legend ===== -->
  <rect x="200" y="282" width="14" height="11" rx="1" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="220" y="291" font-size="11" fill="#334155">frozen</text>
  <rect x="290" y="282" width="14" height="11" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="310" y="291" font-size="11" fill="#334155">trainable</text>
  <rect x="390" y="282" width="14" height="11" fill="#1F407A"/>
  <text x="410" y="291" font-size="11" fill="#334155">above cut: update</text>
</svg>
