<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 7px; font-weight: 700; fill: #ffffff; }
    .card-title { font-size: 8px; font-weight: 700; fill: #0f172a; }
    .prop-hdr { font-size: 6.8px; font-weight: 700; fill: #334155; }
    .prop-txt { font-size: 6.8px; fill: #475569; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- THREE PARADIGM PANELS (A, B, C)                                        -->
  <!-- ====================================================================== -->
  <g transform="translate(20, 20)">
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- PANEL A: LOCAL-ONLY LEARNING                                         -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="250" height="395" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Panel Header Badge -->
      <rect x="10" y="10" width="125" height="16" rx="2" fill="#d97706"/>
      <text x="72.5" y="21" text-anchor="middle" class="badge-txt">A — LOCAL ONLY</text>
      <text x="145" y="22" font-size="7" font-weight="600" fill="#b45309">Device-Centric</text>

      <!-- Visual Schematic: Single Device with Local Loop -->
      <g transform="translate(20, 38)">
        <rect x="0" y="0" width="210" height="120" rx="3" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
        
        <!-- Device Body -->
        <g transform="translate(30, 16)">
          <rect x="0" y="0" width="60" height="88" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
          <rect x="6" y="8" width="48" height="62" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="0.8"/>
          <circle cx="30" cy="78" r="3" fill="#d97706"/>
          <text x="30" y="28" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">Edge Node</text>
          <text x="30" y="42" text-anchor="middle" font-size="6.2" fill="#78350f">Sensor / Phone</text>
          <text x="30" y="54" text-anchor="middle" font-size="6" font-weight="600" fill="#d97706">Local Buffer</text>
        </g>

        <!-- Local Loop Arrow -->
        <path d="M 90,45 L 140,45 L 140,75 L 95,75" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>
        <g transform="translate(105, 34)">
          <rect x="0" y="0" width="75" height="18" rx="2" fill="#fde68a"/>
          <text x="37.5" y="12" text-anchor="middle" font-size="6.5" font-weight="700" fill="#78350f">Train Locally</text>
        </g>
        <text x="142" y="94" text-anchor="middle" font-size="6.2" fill="#92400e">No external network</text>
      </g>

      <!-- Data Trust Badge -->
      <g transform="translate(20, 168)">
        <rect x="0" y="0" width="210" height="28" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
        <text x="105" y="12" text-anchor="middle" font-size="6.8" font-weight="700" fill="#b45309">Zero Communication Egress</text>
        <text x="105" y="22" text-anchor="middle" font-size="6.2" fill="#78350f">Raw telemetry strictly quarantined to device SRAM/flash</text>
      </g>

      <!-- Trade-offs Breakdown -->
      <g transform="translate(20, 206)">
        <text x="0" y="10" font-size="7" font-weight="700" fill="#15803d">✓ Advantages:</text>
        <text x="10" y="22" class="prop-txt">• 100% offline autonomy (zero connectivity required)</text>
        <text x="10" y="33" class="prop-txt">• Absolute privacy: zero PII network exposure</text>
        <text x="10" y="44" class="prop-txt">• Sub-10 ms local inference &amp; fast adaptation</text>

        <text x="0" y="62" font-size="7" font-weight="700" fill="#be123c">✗ Limitations:</text>
        <text x="10" y="74" class="prop-txt">• No collaborative fleet learning or shared knowledge</text>
        <text x="10" y="85" class="prop-txt">• Severely bounded by single-device compute/memory</text>
        <text x="10" y="96" class="prop-txt">• Cold-start dilemma: poor initial accuracy</text>
      </g>

      <!-- Operational Profile Chip -->
      <g transform="translate(20, 328)">
        <rect x="0" y="0" width="210" height="52" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="10" y="14" class="prop-hdr">OPERATIONAL PROFILE</text>
        <text x="10" y="27" font-size="6.5" fill="#334155"><tspan font-weight="600">Inference Latency:</tspan> &lt; 10 ms (Edge Local)</text>
        <text x="10" y="37" font-size="6.5" fill="#334155"><tspan font-weight="600">Privacy Level:</tspan> Complete isolation (Max)</text>
        <text x="10" y="47" font-size="6.5" fill="#334155"><tspan font-weight="600">Network Bandwidth:</tspan> 0 B/s (Zero egress)</text>
      </g>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- PANEL B: CENTRALIZED CLOUD LEARNING                                  -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(275, 0)">
      <rect x="0" y="0" width="250" height="395" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Panel Header Badge -->
      <rect x="10" y="10" width="135" height="16" rx="2" fill="#1F407A"/>
      <text x="77.5" y="21" text-anchor="middle" class="badge-txt">B — CENTRALIZED CLOUD</text>
      <text x="155" y="22" font-size="7" font-weight="600" fill="#14294E">Cloud-Harvested</text>

      <!-- Visual Schematic: Devices Uploading Raw Data to Server -->
      <g transform="translate(20, 38)">
        <rect x="0" y="0" width="210" height="120" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1"/>
        
        <!-- Cloud Server (Top) -->
        <g transform="translate(35, 10)">
          <rect x="0" y="0" width="140" height="28" rx="2" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
          <text x="70" y="13" text-anchor="middle" font-size="7" font-weight="700" fill="#14294E">Central Cloud GPU Cluster</text>
          <text x="70" y="23" text-anchor="middle" font-size="6" fill="#1F407A">Aggregates All Raw Telemetry</text>
        </g>

        <!-- Upward Raw Data Arrows -->
        <path d="M 35,76 L 35,52 L 60,52 L 60,42" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
        <path d="M 80,76 L 80,42" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
        <path d="M 130,76 L 130,42" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
        <path d="M 175,76 L 175,52 L 150,52 L 150,42" fill="none" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>
        
        <rect x="68" y="55" width="74" height="14" rx="2" fill="#EAF1F8"/>
        <text x="105" y="65" text-anchor="middle" font-size="6" font-weight="700" fill="#14294E">Raw Data Uploads</text>

        <!-- 4 Device Chips (Bottom) -->
        <g transform="translate(15, 78)">
          <rect x="0" y="0" width="38" height="34" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
          <text x="19" y="16" text-anchor="middle" font-size="5.8" font-weight="700" fill="#334155">Dev 1</text>
          <text x="19" y="26" text-anchor="middle" font-size="5.2" fill="#64748b">Raw PII</text>

          <rect x="47" y="0" width="38" height="34" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
          <text x="66" y="16" text-anchor="middle" font-size="5.8" font-weight="700" fill="#334155">Dev 2</text>
          <text x="66" y="26" text-anchor="middle" font-size="5.2" fill="#64748b">Raw PII</text>

          <rect x="94" y="0" width="38" height="34" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
          <text x="113" y="16" text-anchor="middle" font-size="5.8" font-weight="700" fill="#334155">Dev 3</text>
          <text x="113" y="26" text-anchor="middle" font-size="5.2" fill="#64748b">Raw PII</text>

          <rect x="141" y="0" width="38" height="34" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
          <text x="160" y="16" text-anchor="middle" font-size="5.8" font-weight="700" fill="#334155">Dev 4</text>
          <text x="160" y="26" text-anchor="middle" font-size="5.2" fill="#64748b">Raw PII</text>
        </g>
      </g>

      <!-- Data Trust Badge -->
      <g transform="translate(20, 168)">
        <rect x="0" y="0" width="210" height="28" rx="2" fill="#fff1f2" stroke="#f43f5e" stroke-width="0.8"/>
        <text x="105" y="12" text-anchor="middle" font-size="6.8" font-weight="700" fill="#be123c">Raw Data Leaves Device Boundary</text>
        <text x="105" y="22" text-anchor="middle" font-size="6.2" fill="#9f1239">High privacy risk; subject to GDPR / HIPAA regulatory exposure</text>
      </g>

      <!-- Trade-offs Breakdown -->
      <g transform="translate(20, 206)">
        <text x="0" y="10" font-size="7" font-weight="700" fill="#15803d">✓ Advantages:</text>
        <text x="10" y="22" class="prop-txt">• Unbounded cloud cluster FLOPs &amp; large batch training</text>
        <text x="10" y="33" class="prop-txt">• Standard centralized debugging &amp; validation pipelines</text>
        <text x="10" y="44" class="prop-txt">• Global model convergence without edge stragglers</text>

        <text x="0" y="62" font-size="7" font-weight="700" fill="#be123c">✗ Limitations:</text>
        <text x="10" y="74" class="prop-txt">• Heavy cellular data consumption &amp; cloud ingress bills</text>
        <text x="10" y="85" class="prop-txt">• Inoperable during network disconnection/intermittency</text>
        <text x="10" y="96" class="prop-txt">• Severe privacy violation for voice, medical, or typing data</text>
      </g>

      <!-- Operational Profile Chip -->
      <g transform="translate(20, 328)">
        <rect x="0" y="0" width="210" height="52" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="10" y="14" class="prop-hdr">OPERATIONAL PROFILE</text>
        <text x="10" y="27" font-size="6.5" fill="#334155"><tspan font-weight="600">Inference Latency:</tspan> 100–500 ms (Network RTT dependent)</text>
        <text x="10" y="37" font-size="6.5" fill="#334155"><tspan font-weight="600">Privacy Level:</tspan> Minimal (Centralized raw exposure)</text>
        <text x="10" y="47" font-size="6.5" fill="#334155"><tspan font-weight="600">Network Bandwidth:</tspan> Very High (Full uncompressed inputs)</text>
      </g>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- PANEL C: FEDERATED LEARNING                                          -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="250" height="395" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Panel Header Badge -->
      <rect x="10" y="10" width="135" height="16" rx="2" fill="#16a34a"/>
      <text x="77.5" y="21" text-anchor="middle" class="badge-txt">C — FEDERATED LEARNING</text>
      <text x="155" y="22" font-size="7" font-weight="600" fill="#15803d">Privacy-Preserving</text>

      <!-- Visual Schematic: Devices Uploading Only Updates to Coordinator -->
      <g transform="translate(20, 38)">
        <rect x="0" y="0" width="210" height="120" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
        
        <!-- FedAvg Coordinator (Top) -->
        <g transform="translate(35, 10)">
          <rect x="0" y="0" width="140" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
          <text x="70" y="13" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">FedAvg Coordinator</text>
          <text x="70" y="23" text-anchor="middle" font-size="6" fill="#166534">Aggregates Weights: θ ← Σ (n_k/N) θ_k</text>
        </g>

        <!-- Upward Gradient Update Arrows (Dashed) -->
        <path d="M 35,76 L 35,52 L 60,52 L 60,42" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
        <path d="M 80,76 L 80,42" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
        <path d="M 130,76 L 130,42" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
        <path d="M 175,76 L 175,52 L 150,52 L 150,42" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
        
        <rect x="65" y="55" width="80" height="14" rx="2" fill="#bbf7d0"/>
        <text x="105" y="65" text-anchor="middle" font-size="6" font-weight="700" fill="#15803d">Model Updates Δθ Only</text>

        <!-- 4 Device Chips (Bottom) -->
        <g transform="translate(15, 78)">
          <rect x="0" y="0" width="38" height="34" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="19" y="14" text-anchor="middle" font-size="5.8" font-weight="700" fill="#166534">Dev 1</text>
          <text x="19" y="23" text-anchor="middle" font-size="5" fill="#047857">Local Data</text>
          <text x="19" y="30" text-anchor="middle" font-size="5" font-weight="700" fill="#16a34a">Δθ₁</text>

          <rect x="47" y="0" width="38" height="34" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="66" y="14" text-anchor="middle" font-size="5.8" font-weight="700" fill="#166534">Dev 2</text>
          <text x="66" y="23" text-anchor="middle" font-size="5" fill="#047857">Local Data</text>
          <text x="66" y="30" text-anchor="middle" font-size="5" font-weight="700" fill="#16a34a">Δθ₂</text>

          <rect x="94" y="0" width="38" height="34" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="113" y="14" text-anchor="middle" font-size="5.8" font-weight="700" fill="#166534">Dev 3</text>
          <text x="113" y="23" text-anchor="middle" font-size="5" fill="#047857">Local Data</text>
          <text x="113" y="30" text-anchor="middle" font-size="5" font-weight="700" fill="#16a34a">Δθ₃</text>

          <rect x="141" y="0" width="38" height="34" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="160" y="14" text-anchor="middle" font-size="5.8" font-weight="700" fill="#166534">Dev 4</text>
          <text x="160" y="23" text-anchor="middle" font-size="5" fill="#047857">Local Data</text>
          <text x="160" y="30" text-anchor="middle" font-size="5" font-weight="700" fill="#16a34a">Δθ₄</text>
        </g>
      </g>

      <!-- Data Trust Badge -->
      <g transform="translate(20, 168)">
        <rect x="0" y="0" width="210" height="28" rx="2" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8"/>
        <text x="105" y="12" text-anchor="middle" font-size="6.8" font-weight="700" fill="#047857">Data Locality Fully Preserved</text>
        <text x="105" y="22" text-anchor="middle" font-size="6.2" fill="#065f46">Raw samples never transmitted; ephemeral parameter deltas only</text>
      </g>

      <!-- Trade-offs Breakdown -->
      <g transform="translate(20, 206)">
        <text x="0" y="10" font-size="7" font-weight="700" fill="#15803d">✓ Advantages:</text>
        <text x="10" y="22" class="prop-txt">• Strong privacy guarantees (with Secure Aggregation)</text>
        <text x="10" y="33" class="prop-txt">• Collaborative learning from population-wide diversity</text>
        <text x="10" y="44" class="prop-txt">• Substantial bandwidth reduction vs. raw media streaming</text>

        <text x="0" y="62" font-size="7" font-weight="700" fill="#be123c">✗ Limitations:</text>
        <text x="10" y="74" class="prop-txt">• Non-IID data distribution induces client gradient drift</text>
        <text x="10" y="85" class="prop-txt">• System heterogeneity &amp; edge stragglers slow rounds</text>
        <text x="10" y="96" class="prop-txt">• Vulnerable to inference attacks without differential privacy</text>
      </g>

      <!-- Operational Profile Chip -->
      <g transform="translate(20, 328)">
        <rect x="0" y="0" width="210" height="52" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="10" y="14" class="prop-hdr">OPERATIONAL PROFILE</text>
        <text x="10" y="27" font-size="6.5" fill="#334155"><tspan font-weight="600">Inference Latency:</tspan> &lt; 10 ms (Model runs on-device)</text>
        <text x="10" y="37" font-size="6.5" fill="#334155"><tspan font-weight="600">Privacy Level:</tspan> High (Only weights/gradients leave)</text>
        <text x="10" y="47" font-size="6.5" fill="#334155"><tspan font-weight="600">Network Bandwidth:</tspan> Moderate (Compressed Δθ sync)</text>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- FOOTER PRINCIPLE CALLOUT                                               -->
  <!-- ====================================================================== -->
  <text x="420" y="456" text-anchor="middle" font-size="8.5" fill="#64748b" font-style="italic">
    Edge intelligence shifts the trust and compute boundary: from harvesting raw data into central clouds to dispatching models to the edge where private data resides.
  </text>
</svg>
