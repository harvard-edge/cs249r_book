<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-emerald" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#059669"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#6366f1"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 6.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
    .math-txt { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- TOP BANNER: PAIRWISE KEY AGREEMENT PROTOCOL                            -->
  <!-- ====================================================================== -->
  <g transform="translate(24, 12)">
    <rect x="0" y="0" width="752" height="24" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="376" y="15" text-anchor="middle" font-size="7" font-weight="600" fill="#047857">
      Pairwise Key Agreement: Clients A and B negotiate a shared random secret mask <tspan font-weight="700" class="math-txt">r</tspan> via Diffie-Hellman key exchange prior to round upload
    </text>
  </g>

  <!-- ====================================================================== -->
  <!-- THREE COLUMNS: CLIENT A, SERVER, CLIENT B                              -->
  <!-- ====================================================================== -->
  <g transform="translate(24, 46)">

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- CLIENT A CARD                                                        -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="344" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Header Badge -->
      <rect x="12" y="10" width="74" height="16" rx="2" fill="#0284c7"/>
      <text x="49" y="21" text-anchor="middle" class="badge-txt">CLIENT A</text>
      <text x="96" y="21.5" font-size="6.8" font-weight="600" fill="#0369a1">Edge Node</text>

      <!-- Step 1: Local Model Update -->
      <g transform="translate(12, 38)">
        <rect x="0" y="0" width="192" height="42" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
        <text x="10" y="14" font-size="6.8" font-weight="700" fill="#0369a1">1. Local Model Update</text>
        <rect x="8" y="20" width="176" height="16" rx="2" fill="#f0f9ff"/>
        <text x="96" y="31.5" text-anchor="middle" font-size="7.2" font-weight="600" fill="#0284c7" class="math-txt">Δθ_A = [+0.12, -0.05, +0.34]</text>
      </g>

      <!-- Operation: Plus Mask -->
      <circle cx="108" cy="94" r="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="108" y="97.5" text-anchor="middle" font-size="9" font-weight="700" fill="#0284c7">+</text>

      <!-- Step 2: Add Shared Random Mask -->
      <g transform="translate(12, 108)">
        <rect x="0" y="0" width="192" height="42" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
        <text x="10" y="14" font-size="6.8" font-weight="700" fill="#047857">2. Add Shared Mask (+r)</text>
        <rect x="8" y="20" width="176" height="16" rx="2" fill="#ecfdf5"/>
        <text x="96" y="31.5" text-anchor="middle" font-size="7.2" font-weight="600" fill="#059669" class="math-txt">+r = [+0.45, -0.22, +0.18]</text>
      </g>

      <!-- Equal Sign -->
      <circle cx="108" cy="164" r="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text x="108" y="167" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">=</text>

      <!-- Step 3: Masked Payload -->
      <g transform="translate(12, 178)">
        <rect x="0" y="0" width="192" height="48" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="10" y="14" font-size="6.8" font-weight="700" fill="#0369a1">3. Transmitted Payload (y_A)</text>
        <rect x="8" y="20" width="176" height="20" rx="2" fill="#0284c7"/>
        <text x="96" y="33" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff" class="math-txt">y_A = Δθ_A + r</text>
      </g>

      <!-- Privacy Security Callout -->
      <g transform="translate(12, 240)">
        <rect x="0" y="0" width="192" height="88" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="10" y="15" font-size="6.8" font-weight="700" fill="#0369a1">LOCAL SECURITY INVARIANT</text>
        <text x="10" y="30" font-size="6.2" fill="#475569">• Mask <tspan class="math-txt">r</tspan> acts as a one-time cryptographic pad</text>
        <text x="10" y="42" font-size="6.2" fill="#475569">• Eavesdropper or server sees only pseudo-noise</text>
        <text x="10" y="54" font-size="6.2" fill="#475569">• Raw weights <tspan class="math-txt">Δθ_A</tspan> strictly quarantined</text>
        <text x="10" y="66" font-size="6.2" fill="#475569">• Zero information leakage for single round</text>
        <rect x="8" y="72" width="176" height="12" rx="2" fill="#ecfdf5"/>
        <text x="96" y="80.5" text-anchor="middle" font-size="5.8" font-weight="700" fill="#047857">✓ Provably Blinded Transmission</text>
      </g>
    </g>

    <!-- Transmission Channel A -> Server -->
    <g transform="translate(216, 0)">
      <line x1="4" y1="202" x2="32" y2="202" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <rect x="4" y="184" width="28" height="13" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="18" y="193" text-anchor="middle" font-size="5.5" font-weight="700" fill="#0284c7">UPLINK</text>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- CENTER CARD: AGGREGATION SERVER                                      -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(252, 0)">
      <rect x="0" y="0" width="248" height="344" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Header Badge -->
      <rect x="12" y="10" width="124" height="16" rx="2" fill="#6366f1"/>
      <text x="74" y="21" text-anchor="middle" class="badge-txt">AGGREGATION SERVER</text>
      <text x="146" y="21.5" font-size="6.8" font-weight="600" fill="#4f46e5">Semi-Honest</text>

      <!-- Ingress Buffer: Two Masked Packets Received -->
      <g transform="translate(12, 38)">
        <rect x="0" y="0" width="224" height="64" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="14" font-size="6.8" font-weight="700" fill="#334155">Ingress Updates Received</text>
        
        <rect x="8" y="20" width="208" height="16" rx="2" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
        <text x="112" y="31.5" text-anchor="middle" font-size="7" font-weight="600" fill="#0369a1" class="math-txt">From A: y_A = Δθ_A + r</text>

        <rect x="8" y="40" width="208" height="16" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
        <text x="112" y="51.5" text-anchor="middle" font-size="7" font-weight="600" fill="#b45309" class="math-txt">From B: y_B = Δθ_B - r</text>
      </g>

      <!-- Summation Operator -->
      <circle cx="124" cy="116" r="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
      <text x="124" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#4338ca">∑</text>

      <!-- Algebraic Mask Cancellation Box -->
      <g transform="translate(12, 130)">
        <rect x="0" y="0" width="224" height="96" rx="2" fill="#f5f3ff" stroke="#c7d2fe" stroke-width="1"/>
        <text x="10" y="15" font-size="7" font-weight="700" fill="#4338ca">Algebraic Mask Cancellation</text>
        
        <rect x="8" y="22" width="208" height="16" rx="2" fill="#ffffff"/>
        <text x="112" y="33.5" text-anchor="middle" font-size="7" fill="#334155" class="math-txt">y_sum = y_A + y_B</text>

        <rect x="8" y="42" width="208" height="16" rx="2" fill="#ffffff"/>
        <text x="112" y="53.5" text-anchor="middle" font-size="7" fill="#334155" class="math-txt">= (Δθ_A + r) + (Δθ_B - r)</text>

        <rect x="8" y="62" width="208" height="16" rx="2" fill="#ffffff"/>
        <text x="112" y="73.5" text-anchor="middle" font-size="7" fill="#334155" class="math-txt">= Δθ_A + Δθ_B + (r - r)</text>

        <rect x="8" y="80" width="208" height="12" rx="2" fill="#dcfce7"/>
        <text x="112" y="89" text-anchor="middle" font-size="6.8" font-weight="700" fill="#15803d" class="math-txt">= Δθ_A + Δθ_B  ✓  (Mask cancels)</text>
      </g>

      <!-- Output Aggregated Result -->
      <g transform="translate(12, 240)">
        <rect x="0" y="0" width="224" height="88" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
        <text x="10" y="15" font-size="6.8" font-weight="700" fill="#047857">EXACT UNMASKED AGGREGATE</text>
        <text x="10" y="30" font-size="6.2" fill="#475569">• Server obtains exact linear sum <tspan class="math-txt">Δθ_A + Δθ_B</tspan></text>
        <text x="10" y="42" font-size="6.2" fill="#475569">• Zero noise added; convergence rate is untainted</text>
        <text x="10" y="54" font-size="6.2" fill="#475569">• Impossible for server to decompose individual parts</text>
        <rect x="8" y="62" width="208" height="18" rx="2" fill="#059669"/>
        <text x="112" y="74.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff" class="math-txt">θ_next ← θ_global + η · (y_sum / 2)</text>
      </g>
    </g>

    <!-- Transmission Channel B -> Server -->
    <g transform="translate(500, 0)">
      <line x1="32" y1="202" x2="4" y2="202" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
      <rect x="4" y="184" width="28" height="13" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="0.8"/>
      <text x="18" y="193" text-anchor="middle" font-size="5.5" font-weight="700" fill="#d97706">UPLINK</text>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- CLIENT B CARD                                                        -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(536, 0)">
      <rect x="0" y="0" width="216" height="344" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Header Badge -->
      <rect x="12" y="10" width="74" height="16" rx="2" fill="#d97706"/>
      <text x="49" y="21" text-anchor="middle" class="badge-txt">CLIENT B</text>
      <text x="96" y="21.5" font-size="6.8" font-weight="600" fill="#b45309">Edge Node</text>

      <!-- Step 1: Local Model Update -->
      <g transform="translate(12, 38)">
        <rect x="0" y="0" width="192" height="42" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
        <text x="10" y="14" font-size="6.8" font-weight="700" fill="#b45309">1. Local Model Update</text>
        <rect x="8" y="20" width="176" height="16" rx="2" fill="#fffbeb"/>
        <text x="96" y="31.5" text-anchor="middle" font-size="7.2" font-weight="600" fill="#d97706" class="math-txt">Δθ_B = [-0.08, +0.19, -0.11]</text>
      </g>

      <!-- Operation: Subtract Mask -->
      <circle cx="108" cy="94" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="108" y="97" text-anchor="middle" font-size="9" font-weight="700" fill="#d97706">−</text>

      <!-- Step 2: Subtract Shared Random Mask -->
      <g transform="translate(12, 108)">
        <rect x="0" y="0" width="192" height="42" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
        <text x="10" y="14" font-size="6.8" font-weight="700" fill="#047857">2. Subtract Shared Mask (-r)</text>
        <rect x="8" y="20" width="176" height="16" rx="2" fill="#ecfdf5"/>
        <text x="96" y="31.5" text-anchor="middle" font-size="7.2" font-weight="600" fill="#059669" class="math-txt">-r = [-0.45, +0.22, -0.18]</text>
      </g>

      <!-- Equal Sign -->
      <circle cx="108" cy="164" r="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text x="108" y="167" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">=</text>

      <!-- Step 3: Masked Payload -->
      <g transform="translate(12, 178)">
        <rect x="0" y="0" width="192" height="48" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
        <text x="10" y="14" font-size="6.8" font-weight="700" fill="#b45309">3. Transmitted Payload (y_B)</text>
        <rect x="8" y="20" width="176" height="20" rx="2" fill="#d97706"/>
        <text x="96" y="33" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff" class="math-txt">y_B = Δθ_B - r</text>
      </g>

      <!-- Privacy Security Callout -->
      <g transform="translate(12, 240)">
        <rect x="0" y="0" width="192" height="88" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="10" y="15" font-size="6.8" font-weight="700" fill="#b45309">LOCAL SECURITY INVARIANT</text>
        <text x="10" y="30" font-size="6.2" fill="#475569">• Negative polarity mask <tspan class="math-txt">-r</tspan> offsets A's pad</text>
        <text x="10" y="42" font-size="6.2" fill="#475569">• Eavesdropper or server sees only pseudo-noise</text>
        <text x="10" y="54" font-size="6.2" fill="#475569">• Raw weights <tspan class="math-txt">Δθ_B</tspan> strictly quarantined</text>
        <text x="10" y="66" font-size="6.2" fill="#475569">• Zero information leakage for single round</text>
        <rect x="8" y="72" width="176" height="12" rx="2" fill="#ecfdf5"/>
        <text x="96" y="80.5" text-anchor="middle" font-size="5.8" font-weight="700" fill="#047857">✓ Provably Blinded Transmission</text>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- BOTTOM PRIVACY GUARANTEE BANNER                                        -->
  <!-- ====================================================================== -->
  <g transform="translate(24, 404)">
    <rect x="0" y="0" width="752" height="34" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="10" y="8" width="108" height="18" rx="2" fill="#047857"/>
    <text x="64" y="20" text-anchor="middle" class="badge-txt">PRIVACY GUARANTEE</text>
    <text x="128" y="16" font-size="6.8" font-weight="700" fill="#0f172a">Zero-Knowledge Fleet Aggregation:</text>
    <text x="128" y="26" font-size="6.5" fill="#475569">
      The coordinator computes exact fleet gradient updates without being able to reconstruct, decrypt, or inspect any individual participant's weights or private examples.
    </text>
  </g>

  <!-- ====================================================================== -->
  <!-- FOOTER PRINCIPLE CALLOUT                                               -->
  <!-- ====================================================================== -->
  <text x="400" y="462" text-anchor="middle" font-size="7.5" fill="#64748b" font-style="italic">
    Cryptographic random masks cancel out identically during aggregation: ∑ y_k = ∑ Δθ_k + ∑ r_ij = ∑ Δθ_k when pairwise masks are anti-symmetric.
  </text>
</svg>
