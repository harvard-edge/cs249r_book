<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="600" height="300" fill="#ffffff"/>

  <!-- ===== Client A ===== -->
  <rect x="20" y="20" width="260" height="90" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="260" height="22" rx="4" fill="#e2e8f0"/>
  <rect x="20" y="36" width="260" height="6" fill="#e2e8f0"/>
  <text x="32" y="36" font-size="11" font-weight="700" fill="#0f172a">Client A</text>
  <rect x="34" y="56" width="70" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="69" y="79" text-anchor="middle" font-size="13" fill="#14294E">Δθ<tspan font-size="9" dy="3">A</tspan></text>
  <path d="M104,74 H128" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <circle cx="145" cy="74" r="15" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="145" y="79" text-anchor="middle" font-size="13" fill="#0f172a">+ r</text>
  <path d="M160,74 H184" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="186" y="56" width="80" height="36" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="226" y="79" text-anchor="middle" font-size="13" fill="#78350f">y<tspan font-size="9" dy="3">A</tspan></text>

  <!-- ===== Client B ===== -->
  <rect x="20" y="180" width="260" height="90" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="180" width="260" height="22" rx="4" fill="#e2e8f0"/>
  <rect x="20" y="196" width="260" height="6" fill="#e2e8f0"/>
  <text x="32" y="196" font-size="11" font-weight="700" fill="#0f172a">Client B</text>
  <rect x="34" y="216" width="70" height="36" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="69" y="239" text-anchor="middle" font-size="13" fill="#14294E">Δθ<tspan font-size="9" dy="3">B</tspan></text>
  <path d="M104,234 H128" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <circle cx="145" cy="234" r="15" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="145" y="239" text-anchor="middle" font-size="13" fill="#0f172a">− r</text>
  <path d="M160,234 H184" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="186" y="216" width="80" height="36" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="226" y="239" text-anchor="middle" font-size="13" fill="#78350f">y<tspan font-size="9" dy="3">B</tspan></text>

  <!-- ===== Shared mask (pairwise key agreement) ===== -->
  <path d="M145,89 V219" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="158" y="136" width="96" height="28" rx="3" fill="#ffffff"/>
  <text x="164" y="148" font-size="11" fill="#334155">shared mask r</text>
  <text x="164" y="161" font-size="11" fill="#64748b">(key agreement)</text>

  <!-- ===== Trust boundary ===== -->
  <path d="M320,14 V286" fill="none" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== Uplinks ===== -->
  <path d="M266,74 H300 V125 H368" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M266,234 H300 V175 H368" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- ===== Server ===== -->
  <rect x="370" y="80" width="210" height="140" rx="4" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/>
  <rect x="370" y="80" width="210" height="22" rx="4" fill="#f3e8ff"/>
  <rect x="370" y="96" width="210" height="6" fill="#f3e8ff"/>
  <text x="382" y="96" font-size="11" font-weight="700" fill="#4c1d95">Aggregation server</text>
  <rect x="384" y="114" width="50" height="72" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="409" y="157" text-anchor="middle" font-size="18" fill="#4c1d95">Σ</text>
  <path d="M434,150 H456" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="458" y="130" width="108" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="512" y="155" text-anchor="middle" font-size="13" fill="#14532d">Δθ<tspan font-size="9" dy="3">A</tspan><tspan dy="-3" dx="2">+ Δθ</tspan><tspan font-size="9" dy="3">B</tspan></text>
  <text x="475" y="200" text-anchor="middle" font-size="11" fill="#475569">masks cancel: r − r = 0</text>

  <!-- ===== Boundary labels ===== -->
  <text x="150" y="292" text-anchor="middle" font-size="11" fill="#64748b">on device</text>
  <text x="475" y="292" text-anchor="middle" font-size="11" fill="#64748b">visible to server</text>
</svg>
