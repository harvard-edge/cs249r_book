<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- Title header -->
  <text x="25" y="30" font-size="15" font-weight="700" fill="#0F172A">Conceptual Foundations of Knowledge Transfer in On-Device Learning</text>
  <text x="25" y="48" font-size="11" fill="#64748B">Shared structural representations enable rapid local adaptation with minimal sample complexity and compute</text>

  <!-- 3 Analogous Domain Columns -->
  <!-- Column 1: Board Games -->
  <rect x="25" y="65" width="265" height="240" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="25" y="65" width="265" height="32" rx="8" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="37" y="86" font-size="11.5" font-weight="700" fill="#1F407A">Domain A: Strategic Rule Systems</text>

  <!-- Source Domain Box -->
  <rect x="38" y="110" width="105" height="60" rx="5" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="90" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Source Task</text>
  <text x="90" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#1F407A">Chess</text>
  <text x="90" y="158" text-anchor="middle" font-size="8" fill="#64748B">Spatial control &amp; tactics</text>

  <!-- Arrow -->
  <line x1="147" y1="140" x2="167" y2="140" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Target Domain Box -->
  <rect x="172" y="110" width="105" height="60" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="224" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Target Task</text>
  <text x="224" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#16A34A">Checkers</text>
  <text x="224" y="158" text-anchor="middle" font-size="8" fill="#166534">Diagonal captures</text>

  <!-- Core Invariance Pill -->
  <rect x="38" y="185" width="239" height="105" rx="5" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
  <text x="48" y="204" font-size="9.5" font-weight="700" fill="#1F407A">Transferred Invariant Representations:</text>
  <text x="48" y="222" font-size="9" fill="#475569">• 2D spatial grid coordinate geometry</text>
  <text x="48" y="238" font-size="9" fill="#475569">• Adversarial turn-taking &amp; minimax trees</text>
  <text x="48" y="254" font-size="9" fill="#475569">• Piece value weighting &amp; board evaluation</text>
  <text x="48" y="274" font-size="8.5" font-weight="600" fill="#16A34A">Efficiency: Reuses tree-search &amp; spatial priors</text>

  <!-- Column 2: Musical Instruments -->
  <rect x="307" y="65" width="265" height="240" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="307" y="65" width="265" height="32" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="319" y="86" font-size="11.5" font-weight="700" fill="#B45309">Domain B: Sensorimotor Control</text>

  <!-- Source Domain Box -->
  <rect x="320" y="110" width="105" height="60" rx="5" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="372" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Source Task</text>
  <text x="372" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#D97706">Violin</text>
  <text x="372" y="158" text-anchor="middle" font-size="8" fill="#64748B">Continuous pitch &amp; bow</text>

  <!-- Arrow -->
  <line x1="429" y1="140" x2="449" y2="140" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- Target Domain Box -->
  <rect x="454" y="110" width="105" height="60" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="506" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Target Task</text>
  <text x="506" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#16A34A">Cello</text>
  <text x="506" y="158" text-anchor="middle" font-size="8" fill="#166534">Bass-clef fingerboard</text>

  <!-- Core Invariance Pill -->
  <rect x="320" y="185" width="239" height="105" rx="5" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
  <text x="330" y="204" font-size="9.5" font-weight="700" fill="#B45309">Transferred Invariant Representations:</text>
  <text x="330" y="222" font-size="9" fill="#475569">• Auditory pitch-feedback loop timing</text>
  <text x="330" y="238" font-size="9" fill="#475569">• Finger independent micro-articulation</text>
  <text x="330" y="254" font-size="9" fill="#475569">• Rhythm subdivision &amp; dynamic expression</text>
  <text x="330" y="274" font-size="8.5" font-weight="600" fill="#16A34A">Efficiency: Finger pressure recalibrates quickly</text>

  <!-- Column 3: Vehicles -->
  <rect x="590" y="65" width="265" height="240" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="590" y="65" width="265" height="32" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="602" y="86" font-size="11.5" font-weight="700" fill="#166534">Domain C: Kinematic Systems</text>

  <!-- Source Domain Box -->
  <rect x="603" y="110" width="105" height="60" rx="5" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="655" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Source Task</text>
  <text x="655" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#16A34A">Bicycle</text>
  <text x="655" y="158" text-anchor="middle" font-size="8" fill="#64748B">Pedal cadence &amp; lean</text>

  <!-- Arrow -->
  <line x1="712" y1="140" x2="732" y2="140" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Target Domain Box -->
  <rect x="737" y="110" width="105" height="60" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="789" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Target Task</text>
  <text x="789" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#16A34A">E-Scooter</text>
  <text x="789" y="158" text-anchor="middle" font-size="8" fill="#166534">Motor throttle balance</text>

  <!-- Core Invariance Pill -->
  <rect x="603" y="185" width="239" height="105" rx="5" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
  <text x="613" y="204" font-size="9.5" font-weight="700" fill="#166534">Transferred Invariant Representations:</text>
  <text x="613" y="222" font-size="9" fill="#475569">• Dynamic equilibrium &amp; lean countersteering</text>
  <text x="613" y="238" font-size="9" fill="#475569">• Surface traction &amp; stopping-distance sensing</text>
  <text x="613" y="254" font-size="9" fill="#475569">• Obstacle avoidance &amp; velocity control</text>
  <text x="613" y="274" font-size="8.5" font-weight="600" fill="#16A34A">Efficiency: Balance reflex transfers directly</text>

  <!-- Bottom Mapping Banner: Bridge to On-Device ML Architecture -->
  <rect x="25" y="320" width="830" height="92" rx="8" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="40" y="342" font-size="11" font-weight="700" fill="#1F407A">On-Device Machine Learning Architecture Mapping:</text>

  <!-- 3 Stage Flow -->
  <rect x="40" y="352" width="210" height="46" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="145" y="370" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F172A">Pretrained Base Backbone (θ_base)</text>
  <text x="145" y="386" text-anchor="middle" font-size="8.5" fill="#64748B">Cloud trained on internet-scale corpus</text>

  <line x1="255" y1="375" x2="277" y2="375" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="282" y="352" width="260" height="46" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="412" y="370" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F407A">Shared Latent Representation Space (Z)</text>
  <text x="412" y="386" text-anchor="middle" font-size="8.5" fill="#475569">Frozen features capture universal domain invariances</text>

  <line x1="547" y1="375" x2="569" y2="375" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="574" y="352" width="265" height="46" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="706" y="370" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">Edge Lightweight Adapter (ΔW / Head)</text>
  <text x="706" y="386" text-anchor="middle" font-size="8.5" fill="#16A34A">On-device few-shot adaptation on local user data</text>
</svg>
