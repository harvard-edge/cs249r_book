<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#D97706"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#16A34A"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5 Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base (No Outer Border) -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: DISCRETE STATE SPACES (BOARD GAMES)                             -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 20)">
    <rect width="260" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 A 4 4 0 0 1 4 0 L 256 0 A 4 4 0 0 1 260 4 L 260 26 L 0 26 Z" fill="#EAF1F8"/>
    <line x1="0" y1="26" x2="260" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#14294E" letter-spacing="0.4px">1. DISCRETE STATE SPACES</text>

    <!-- Sub-box 1: Domain Mapping -->
    <g transform="translate(12, 36)">
      <rect width="236" height="158" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Spatial Grid Task Transfer</text>

      <!-- Source / Target Chips -->
      <g transform="translate(14, 28)">
        <rect width="90" height="44" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
        <text x="45" y="16" font-size="7.5" font-weight="700" fill="#475569" text-anchor="middle">SOURCE TASK</text>
        <text x="45" y="32" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Chess</text>

        <!-- Arrow -->
        <line x1="94" y1="22" x2="114" y2="22" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

        <rect x="118" y="0" width="90" height="44" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
        <text x="163" y="16" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">TARGET TASK</text>
        <text x="163" y="32" font-size="10" font-weight="700" fill="#16A34A" text-anchor="middle">Checkers</text>
      </g>

      <!-- Structural Invariance Chip -->
      <g transform="translate(14, 84)">
        <rect width="208" height="62" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#1E293B">Shared Inductive Priors:</text>
        <rect x="6" y="22" width="196" height="16" rx="1.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.7"/>
        <text x="12" y="33.5" font-size="7.2" fill="#475569">Priors: 2D Cartesian board grid</text>
        <rect x="6" y="40" width="196" height="16" rx="1.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.7"/>
        <text x="12" y="51.5" font-size="7.2" fill="#475569">Dynamics: Minimax turn search</text>
      </g>
    </g>

    <!-- Sub-box 2: On-Device ML Architecture -->
    <g transform="translate(12, 202)">
      <rect width="236" height="174" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">On-Device Model Adaptation</text>

      <g transform="translate(14, 26)">
        <rect width="208" height="38" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#14294E">Base Feature Extractor (θ_base)</text>
        <text x="10" y="28" font-size="7.2" fill="#475569">Frozen ResNet / ViT board encoder</text>
      </g>

      <line x1="118" y1="64" x2="118" y2="76" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)"/>

      <g transform="translate(14, 76)">
        <rect width="208" height="38" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#334155">Shared Latent Space (Z ∈ ℝ^d)</text>
        <text x="10" y="28" font-size="7.2" fill="#64748B">Positional evaluation representations</text>
      </g>

      <line x1="118" y1="114" x2="118" y2="126" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)"/>

      <g transform="translate(14, 126)">
        <rect width="208" height="38" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Edge Policy Head (ΔW_local)</text>
        <text x="10" y="28" font-size="7.2" fill="#16A34A">Few-shot LoRA adapter (&lt; 0.5% weights)</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: SENSORIMOTOR DYNAMICS (INSTRUMENTS)                             -->
  <!-- ========================================================================= -->
  <g transform="translate(310, 20)">
    <rect width="260" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 A 4 4 0 0 1 4 0 L 256 0 A 4 4 0 0 1 260 4 L 260 26 L 0 26 Z" fill="#FEF3C7"/>
    <line x1="0" y1="26" x2="260" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#92400e" letter-spacing="0.4px">2. SENSORIMOTOR DYNAMICS</text>

    <!-- Sub-box 1: Domain Mapping -->
    <g transform="translate(12, 36)">
      <rect width="236" height="158" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Acoustic Feedback Task Transfer</text>

      <!-- Source / Target Chips -->
      <g transform="translate(14, 28)">
        <rect width="90" height="44" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
        <text x="45" y="16" font-size="7.5" font-weight="700" fill="#475569" text-anchor="middle">SOURCE TASK</text>
        <text x="45" y="32" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Violin</text>

        <!-- Arrow -->
        <line x1="94" y1="22" x2="114" y2="22" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

        <rect x="118" y="0" width="90" height="44" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
        <text x="163" y="16" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">TARGET TASK</text>
        <text x="163" y="32" font-size="10" font-weight="700" fill="#16A34A" text-anchor="middle">Cello</text>
      </g>

      <!-- Structural Invariance Chip -->
      <g transform="translate(14, 84)">
        <rect width="208" height="62" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#1E293B">Shared Inductive Priors:</text>
        <rect x="6" y="22" width="196" height="16" rx="1.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.7"/>
        <text x="12" y="33.5" font-size="7.2" fill="#475569">Priors: Continuous intonation tracking</text>
        <rect x="6" y="40" width="196" height="16" rx="1.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.7"/>
        <text x="12" y="51.5" font-size="7.2" fill="#475569">Dynamics: Real-time pitch feedback</text>
      </g>
    </g>

    <!-- Sub-box 2: On-Device ML Architecture -->
    <g transform="translate(12, 202)">
      <rect width="236" height="174" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">On-Device Model Adaptation</text>

      <g transform="translate(14, 26)">
        <rect width="208" height="38" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#92400e">Base Audio Backbone (θ_base)</text>
        <text x="10" y="28" font-size="7.2" fill="#475569">Pretrained Whisper / audio encoder</text>
      </g>

      <line x1="118" y1="64" x2="118" y2="76" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>

      <g transform="translate(14, 76)">
        <rect width="208" height="38" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#334155">Shared Latent Space (Z ∈ ℝ^d)</text>
        <text x="10" y="28" font-size="7.2" fill="#64748B">Harmonic frequency representations</text>
      </g>

      <line x1="118" y1="114" x2="118" y2="126" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)"/>

      <g transform="translate(14, 126)">
        <rect width="208" height="38" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Edge Pitch Adapter (ΔW_local)</text>
        <text x="10" y="28" font-size="7.2" fill="#16A34A">Recalibrates bass register offsets</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: KINEMATIC DYNAMICS (VEHICLES)                                   -->
  <!-- ========================================================================= -->
  <g transform="translate(595, 20)">
    <rect width="260" height="390" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 4 A 4 4 0 0 1 4 0 L 256 0 A 4 4 0 0 1 260 4 L 260 26 L 0 26 Z" fill="#DCFCE7"/>
    <line x1="0" y1="26" x2="260" y2="26" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#166534" letter-spacing="0.4px">3. KINEMATIC DYNAMICS</text>

    <!-- Sub-box 1: Domain Mapping -->
    <g transform="translate(12, 36)">
      <rect width="236" height="158" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">Inertial Control Task Transfer</text>

      <!-- Source / Target Chips -->
      <g transform="translate(14, 28)">
        <rect width="90" height="44" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
        <text x="45" y="16" font-size="7.5" font-weight="700" fill="#475569" text-anchor="middle">SOURCE TASK</text>
        <text x="45" y="32" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Bicycle</text>

        <!-- Arrow -->
        <line x1="94" y1="22" x2="114" y2="22" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arr-green)"/>

        <rect x="118" y="0" width="90" height="44" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
        <text x="163" y="16" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">TARGET TASK</text>
        <text x="163" y="32" font-size="10" font-weight="700" fill="#16A34A" text-anchor="middle">E-Scooter</text>
      </g>

      <!-- Structural Invariance Chip -->
      <g transform="translate(14, 84)">
        <rect width="208" height="62" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#1E293B">Shared Inductive Priors:</text>
        <rect x="6" y="22" width="196" height="16" rx="1.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.7"/>
        <text x="12" y="33.5" font-size="7.2" fill="#475569">Priors: Two-wheeled balance manifold</text>
        <rect x="6" y="40" width="196" height="16" rx="1.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.7"/>
        <text x="12" y="51.5" font-size="7.2" fill="#475569">Dynamics: Countersteering control</text>
      </g>
    </g>

    <!-- Sub-box 2: On-Device ML Architecture -->
    <g transform="translate(12, 202)">
      <rect width="236" height="174" rx="3" fill="#ffffff" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">On-Device Model Adaptation</text>

      <g transform="translate(14, 26)">
        <rect width="208" height="38" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Base Dynamics Core (θ_base)</text>
        <text x="10" y="28" font-size="7.2" fill="#475569">Inertial odometry / state estimator</text>
      </g>

      <line x1="118" y1="64" x2="118" y2="76" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)"/>

      <g transform="translate(14, 76)">
        <rect width="208" height="38" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#334155">Shared Latent Space (Z ∈ ℝ^d)</text>
        <text x="10" y="28" font-size="7.2" fill="#64748B">Balance manifold &amp; friction envelope</text>
      </g>

      <line x1="118" y1="114" x2="118" y2="126" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)"/>

      <g transform="translate(14, 126)">
        <rect width="208" height="38" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Edge Actuator Head (ΔW_local)</text>
        <text x="10" y="28" font-size="7.2" fill="#16A34A">Motor torque response adaptation</text>
      </g>
    </g>
  </g>
</svg>
