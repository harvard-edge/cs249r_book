<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="680" height="340" fill="#ffffff"/>
  <!-- ===== Coordinator ===== -->
  <rect x="110" y="20" width="420" height="92" rx="4" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/>
  <path d="M110.5,42 V24 Q110.5,20.5 114,20.5 H526 Q529.5,20.5 529.5,24 V42 Z" fill="#f3e8ff"/>
  <path d="M110,42 H530" stroke="#7c3aed" stroke-width="0.6"/>
  <text x="120" y="35" font-size="12" font-weight="700" fill="#4c1d95">Coordinator</text>
  <rect x="125" y="54" width="175" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="142" cy="76" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="142" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#4c1d95">1</text>
  <text x="160" y="73" font-size="12" font-weight="700" fill="#0f172a">Select cohort</text>
  <text x="160" y="89" font-size="12" fill="#334155">broadcast θ<tspan font-size="9" dy="-5">t</tspan></text>
  <rect x="340" y="54" width="175" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="357" cy="76" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="357" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#4c1d95">4</text>
  <text x="375" y="73" font-size="12" font-weight="700" fill="#0f172a">Aggregate</text>
  <text x="375" y="90" font-size="12" fill="#334155">θ<tspan font-size="9" dy="-5">t+1</tspan><tspan dy="5" dx="3">= Σ</tspan><tspan dx="3">(n</tspan><tspan font-size="9" dy="3">k</tspan><tspan dy="-3">/n</tspan><tspan font-size="9" dy="3">round</tspan><tspan dy="-3">)</tspan><tspan dx="3">θ</tspan><tspan font-size="9" dy="3">k</tspan><tspan font-size="9" dy="-8">t+1</tspan></text>
