  <rect x="172" y="240" width="56" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="200" y="253" text-anchor="middle" font-size="12" fill="#14532d">data D<tspan font-size="9" dy="3">2</tspan></text>
  <text x="200" y="280" text-anchor="middle" font-size="12" fill="#14294E">E local epochs</text>
  <rect x="270" y="210" width="100" height="80" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="320" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Client 3</text>
  <rect x="292" y="240" width="56" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="320" y="253" text-anchor="middle" font-size="12" fill="#14532d">data D<tspan font-size="9" dy="3">3</tspan></text>
  <text x="320" y="280" text-anchor="middle" font-size="12" fill="#14294E">E local epochs</text>
  <rect x="390" y="210" width="100" height="80" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="440" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Client 4</text>
  <rect x="412" y="240" width="56" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="440" y="253" text-anchor="middle" font-size="12" fill="#14532d">data D<tspan font-size="9" dy="3">4</tspan></text>
  <text x="440" y="280" text-anchor="middle" font-size="12" fill="#14294E">E local epochs</text>
  <rect x="510" y="210" width="100" height="80" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="560" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Client 5</text>
  <text x="560" y="256" text-anchor="middle" font-size="12" fill="#991b1b">straggler</text>
  <text x="560" y="272" text-anchor="middle" font-size="12" fill="#991b1b">misses deadline</text>
  <!-- ===== Downlink bus (theta^t) ===== -->
  <path d="M212,112 V140" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M60,140 H540" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M60,140 V208" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M180,140 V208" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M300,140 V208" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M420,140 V208" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M540,140 V208" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <!-- ===== Uplink bus (theta_k^{t+1}) ===== -->
  <path d="M100,210 V175" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M220,210 V175" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M340,210 V175" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M460,210 V175" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M100,175 H610 V76 H517" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M580,210 V200" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="580" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">×</text>
  <!-- ===== Step labels ===== -->
  <text x="548" y="131" font-size="12" fill="#334155">θ<tspan font-size="9" dy="-5">t</tspan></text>
  <circle cx="632" cy="128" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="632" y="132" text-anchor="middle" font-size="10" font-weight="700" fill="#4c1d95">3</text>
  <text x="620" y="152" font-size="12" fill="#92400e">upload</text>
  <text x="620" y="167" font-size="12" fill="#92400e">θ<tspan font-size="9" dy="3">k</tspan><tspan font-size="9" dy="-8">t+1</tspan></text>
  <circle cx="222" cy="318" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="222" y="322" text-anchor="middle" font-size="10" font-weight="700" fill="#4c1d95">2</text>
  <text x="238" y="322" font-size="12" fill="#334155">local training on private data</text>
</svg>
