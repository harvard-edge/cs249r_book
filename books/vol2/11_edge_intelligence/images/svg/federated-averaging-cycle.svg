<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="700" height="350" fill="#ffffff"/>
  <!-- ===== Coordinator ===== -->
  <rect x="110" y="20" width="460" height="92" rx="4" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/>
  <path d="M110.5,42 V24 Q110.5,20.5 114,20.5 H566 Q569.5,20.5 569.5,24 V42 Z" fill="#f3e8ff"/>
  <path d="M110,42 H570" stroke="#7c3aed" stroke-width="0.6"/>
  <text x="120" y="35" font-size="12" font-weight="700" fill="#4c1d95">Coordinator</text>
  <rect x="125" y="54" width="185" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="142" cy="76" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="142" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">1</text>
  <text x="160" y="73" font-size="12" font-weight="700" fill="#0f172a">Select cohort</text>
  <text x="160" y="89" font-size="12" fill="#334155">broadcast θ<tspan font-size="11" dy="-5">t</tspan></text>
  <rect x="330" y="54" width="225" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="347" cy="76" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="347" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">4</text>
  <text x="365" y="73" font-size="12" font-weight="700" fill="#0f172a">Aggregate</text>
  <text x="365" y="90" font-size="12" fill="#334155">θ<tspan font-size="11" dy="-5">t+1</tspan><tspan dy="5" dx="3">= Σ</tspan><tspan dx="3">(n</tspan><tspan font-size="11" dy="3">k</tspan><tspan dy="-3">/n</tspan><tspan font-size="11" dy="3">round</tspan><tspan dy="-3">)</tspan><tspan dx="3">θ</tspan><tspan font-size="11" dy="3">k</tspan><tspan font-size="11" dy="-8">t+1</tspan></text>
  <!-- ===== Downlink bus (theta^t) ===== -->
  <path d="M222,112 V140" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M80,140 H560" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M80,140 V178" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M200,140 V178" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M320,140 V178" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M440,140 V178" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M560,140 V178" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="570" y="136" font-size="12" fill="#334155">θ<tspan font-size="11" dy="-5">t</tspan></text>
  <!-- ===== Clients ===== -->
  <rect x="50" y="180" width="100" height="80" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="100" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Client 1</text>
  <rect x="72" y="210" width="56" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="100" y="223" text-anchor="middle" font-size="12" fill="#14532d">data D<tspan font-size="11" dy="3">1</tspan></text>
  <text x="100" y="250" text-anchor="middle" font-size="12" fill="#14294E">E local epochs</text>
  <rect x="170" y="180" width="100" height="80" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="220" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Client 2</text>
  <rect x="192" y="210" width="56" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="220" y="223" text-anchor="middle" font-size="12" fill="#14532d">data D<tspan font-size="11" dy="3">2</tspan></text>
  <text x="220" y="250" text-anchor="middle" font-size="12" fill="#14294E">E local epochs</text>
  <rect x="290" y="180" width="100" height="80" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="340" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Client 3</text>
  <rect x="312" y="210" width="56" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="340" y="223" text-anchor="middle" font-size="12" fill="#14532d">data D<tspan font-size="11" dy="3">3</tspan></text>
  <text x="340" y="250" text-anchor="middle" font-size="12" fill="#14294E">E local epochs</text>
  <rect x="410" y="180" width="100" height="80" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="460" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Client 4</text>
  <rect x="432" y="210" width="56" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="460" y="223" text-anchor="middle" font-size="12" fill="#14532d">data D<tspan font-size="11" dy="3">4</tspan></text>
  <text x="460" y="250" text-anchor="middle" font-size="12" fill="#14294E">E local epochs</text>
  <rect x="530" y="180" width="100" height="80" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="580" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Client 5</text>
  <text x="580" y="226" text-anchor="middle" font-size="12" fill="#991b1b">straggler</text>
  <text x="580" y="242" text-anchor="middle" font-size="12" fill="#991b1b">misses deadline</text>
  <!-- ===== Uplink bus (theta_k^{t+1}), routed below the clients ===== -->
  <path d="M120,260 V300" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M240,260 V300" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M360,260 V300" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M480,260 V300" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <path d="M120,300 H670 V76 H557" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M600,260 V276" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="600" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">×</text>
  <!-- ===== Step 2 and 3 labels ===== -->
  <circle cx="69" cy="324" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="69" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">2</text>
  <text x="85" y="328" font-size="12" fill="#14294E">local training</text>
  <circle cx="239" cy="324" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="239" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">3</text>
  <text x="255" y="328" font-size="12" fill="#92400e">upload θ<tspan font-size="11" dy="3">k</tspan><tspan font-size="11" dy="-8">t+1</tspan><tspan dy="5" dx="4">before the deadline</tspan></text>
</svg>
