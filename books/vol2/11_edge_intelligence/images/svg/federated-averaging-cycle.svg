<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 6.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
    .math-txt { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- MAIN WORKFLOW CONTAINER                                                -->
  <!-- ====================================================================== -->
  <g transform="translate(20, 20)">

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- TOP SECTION: CENTRAL COORDINATOR (SERVER)                            -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(180, 10)">
      <rect x="0" y="0" width="440" height="110" rx="4" fill="#f0f9ff" stroke="#1F407A" stroke-width="1.2"/>
      
      <!-- Badges -->
      <rect x="14" y="10" width="132" height="16" rx="2" fill="#1F407A"/>
      <text x="80" y="21" text-anchor="middle" class="badge-txt">CENTRAL COORDINATOR</text>
      <text x="156" y="21.5" font-size="6.8" font-weight="600" fill="#14294E">Cloud Fleet Orchestrator</text>

      <!-- Server Sub-components: Model Store & Aggregator -->
      <g transform="translate(14, 34)">
        <!-- Global Model Store -->
        <rect x="0" y="0" width="190" height="64" rx="2" fill="#ffffff" stroke="#D4E2F0" stroke-width="1"/>
        <text x="10" y="14" font-size="6.8" font-weight="700" fill="#14294E">Phase 1: Global Model Broadcast</text>
        <text x="10" y="27" font-size="6.2" fill="#475569">• Selects random client cohort <tspan class="math-txt">C · K</tspan></text>
        <text x="10" y="38" font-size="6.2" fill="#475569">• Broadcasts global weights <tspan class="math-txt">θ^(t)</tspan> to selected nodes</text>
        <rect x="10" y="44" width="170" height="14" rx="2" fill="#EAF1F8"/>
        <text x="95" y="54" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1F407A" class="math-txt">Broadcast θ^(t) Downlink</text>

        <!-- FedAvg Aggregator -->
        <g transform="translate(206, 0)">
          <rect x="0" y="0" width="206" height="64" rx="2" fill="#ffffff" stroke="#D4E2F0" stroke-width="1"/>
          <text x="10" y="14" font-size="6.8" font-weight="700" fill="#14294E">Phase 4: FedAvg Aggregation</text>
          <text x="10" y="26" font-size="6.2" fill="#475569">• Aggregates received updates weighted by data size</text>
          <rect x="10" y="32" width="186" height="24" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
          <text x="103" y="44" text-anchor="middle" font-size="6.8" font-weight="700" fill="#15803d" class="math-txt">θ^(t+1) ← ∑ (n_k / N) · θ_k^(t)</text>
          <text x="103" y="52.5" text-anchor="middle" font-size="5.8" fill="#166534">Advances fleet to communication round t+1</text>
        </g>
      </g>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- LEFT PATH: PHASE 1 BROADCAST DOWNLINK                                -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(0, 0)">
      <!-- Downlink arrow from bottom-left of Server (x=275, y=120) into Downlink chip (y=160) -->
      <path d="M 275,120 L 275,135 L 105,135 L 105,158" fill="none" stroke="#1F407A" stroke-width="1.5"/>
      <!-- Downlink arrow from Downlink chip (y=194) down to top of Client 1 (y=232) -->
      <path d="M 105,194 L 105,232" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <g transform="translate(65, 160)">
        <rect x="0" y="0" width="80" height="34" rx="2" fill="#ffffff" stroke="#D4E2F0" stroke-width="1"/>
        <text x="40" y="12" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1F407A">DOWNLINK</text>
        <text x="40" y="22" text-anchor="middle" font-size="6" fill="#14294E">Broadcasts <tspan class="math-txt">θ^(t)</tspan></text>
        <text x="40" y="30" text-anchor="middle" font-size="5.5" fill="#64748b">Single global copy</text>
      </g>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- RIGHT PATH: PHASE 3 UPDATE UPLINK                                    -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(0, 0)">
      <!-- Uplink arrow from top of Client 4 (y=240) into Uplink chip (y=194) -->
      <path d="M 695,232 L 695,196" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2"/>
      <!-- Uplink arrow from Uplink chip (y=160) up to bottom-right of Server (y=128) -->
      <path d="M 695,158 L 695,135 L 525,135 L 525,128" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
      <g transform="translate(655, 160)">
        <rect x="0" y="0" width="80" height="34" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
        <text x="40" y="12" text-anchor="middle" font-size="6.5" font-weight="700" fill="#16a34a">UPLINK</text>
        <text x="40" y="22" text-anchor="middle" font-size="6" fill="#15803d">Updates <tspan class="math-txt">Δθ_k</tspan> Only</text>
        <text x="40" y="30" text-anchor="middle" font-size="5.5" fill="#64748b">Zero raw data egress</text>
      </g>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- CENTER ORBIT: ROUND PROGRESSION                                      -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(340, 145)">
      <circle cx="60" cy="35" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="60" y="31" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">ROUND t</text>
      <text x="60" y="42" text-anchor="middle" font-size="6" fill="#64748b">Iterative Loop</text>
      <path d="M 75,12 A 28 28 0 0 1 88,35" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <path d="M 45,58 A 28 28 0 0 1 32,35" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- BOTTOM SECTION: DISTRIBUTED CLIENT FLEET                             -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="760" height="166" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Fleet Header Badge -->
      <rect x="14" y="10" width="176" height="16" rx="2" fill="#d97706"/>
      <text x="102" y="21" text-anchor="middle" class="badge-txt">PHASE 2: ON-DEVICE LOCAL TRAINING</text>
      <text x="200" y="21.5" font-size="6.8" font-weight="600" fill="#b45309">Private Data Boundary (Zero External Network Comm During Epochs)</text>

      <!-- 4 Device Cards -->
      <g transform="translate(14, 34)">

        <!-- Device 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="175" height="118" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <!-- Top bar -->
          <rect x="8" y="8" width="54" height="13" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
          <text x="35" y="17" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309">Client 1</text>
          <text x="165" y="17" text-anchor="end" font-size="6" fill="#64748b" class="math-txt">n₁ = 1,420</text>

          <!-- Local Private Buffer -->
          <rect x="8" y="26" width="159" height="26" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
          <text x="14" y="37" font-size="6" font-weight="700" fill="#92400e">Private Dataset 𝒟₁</text>
          <text x="14" y="47" font-size="5.8" fill="#b45309">Local sensor &amp; keyboard telemetry</text>

          <!-- Training Execution -->
          <g transform="translate(8, 56)">
            <rect x="0" y="0" width="159" height="32" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
            <text x="8" y="12" font-size="6" font-weight="700" fill="#334155">SGD Optimization (E = 5)</text>
            <text x="8" y="22" font-size="5.8" fill="#475569" class="math-txt">θ₁^(t) ← θ^(t) - η ∑ ∇L(w; x)</text>
          </g>

          <!-- Output Payload -->
          <rect x="8" y="92" width="159" height="18" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="87" y="103.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#16a34a" class="math-txt">Update: Δθ₁ = θ₁^(t) - θ^(t)</text>
        </g>

        <!-- Device 2 -->
        <g transform="translate(186, 0)">
          <rect x="0" y="0" width="175" height="118" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <rect x="8" y="8" width="54" height="13" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
          <text x="35" y="17" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309">Client 2</text>
          <text x="165" y="17" text-anchor="end" font-size="6" fill="#64748b" class="math-txt">n₂ = 850</text>

          <rect x="8" y="26" width="159" height="26" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
          <text x="14" y="37" font-size="6" font-weight="700" fill="#92400e">Private Dataset 𝒟₂</text>
          <text x="14" y="47" font-size="5.8" fill="#b45309">Camera frames &amp; audio samples</text>

          <g transform="translate(8, 56)">
            <rect x="0" y="0" width="159" height="32" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
            <text x="8" y="12" font-size="6" font-weight="700" fill="#334155">SGD Optimization (E = 5)</text>
            <text x="8" y="22" font-size="5.8" fill="#475569" class="math-txt">θ₂^(t) ← θ^(t) - η ∑ ∇L(w; x)</text>
          </g>

          <rect x="8" y="92" width="159" height="18" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="87" y="103.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#16a34a" class="math-txt">Update: Δθ₂ = θ₂^(t) - θ^(t)</text>
        </g>

        <!-- Device 3 -->
        <g transform="translate(372, 0)">
          <rect x="0" y="0" width="175" height="118" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <rect x="8" y="8" width="54" height="13" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
          <text x="35" y="17" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309">Client 3</text>
          <text x="165" y="17" text-anchor="end" font-size="6" fill="#64748b" class="math-txt">n₃ = 2,100</text>

          <rect x="8" y="26" width="159" height="26" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
          <text x="14" y="37" font-size="6" font-weight="700" fill="#92400e">Private Dataset 𝒟₃</text>
          <text x="14" y="47" font-size="5.8" fill="#b45309">Wearable biometric signals</text>

          <g transform="translate(8, 56)">
            <rect x="0" y="0" width="159" height="32" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
            <text x="8" y="12" font-size="6" font-weight="700" fill="#334155">SGD Optimization (E = 5)</text>
            <text x="8" y="22" font-size="5.8" fill="#475569" class="math-txt">θ₃^(t) ← θ^(t) - η ∑ ∇L(w; x)</text>
          </g>

          <rect x="8" y="92" width="159" height="18" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="87" y="103.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#16a34a" class="math-txt">Update: Δθ₃ = θ₃^(t) - θ^(t)</text>
        </g>

        <!-- Device 4 -->
        <g transform="translate(558, 0)">
          <rect x="0" y="0" width="174" height="118" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <rect x="8" y="8" width="54" height="13" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
          <text x="35" y="17" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309">Client 4</text>
          <text x="164" y="17" text-anchor="end" font-size="6" fill="#64748b" class="math-txt">n₄ = 530</text>

          <rect x="8" y="26" width="158" height="26" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
          <text x="14" y="37" font-size="6" font-weight="700" fill="#92400e">Private Dataset 𝒟₄</text>
          <text x="14" y="47" font-size="5.8" fill="#b45309">App usage &amp; navigation logs</text>

          <g transform="translate(8, 56)">
            <rect x="0" y="0" width="158" height="32" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
            <text x="8" y="12" font-size="6" font-weight="700" fill="#334155">SGD Optimization (E = 5)</text>
            <text x="8" y="22" font-size="5.8" fill="#475569" class="math-txt">θ₄^(t) ← θ^(t) - η ∑ ∇L(w; x)</text>
          </g>

          <rect x="8" y="92" width="158" height="18" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
          <text x="87" y="103.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#16a34a" class="math-txt">Update: Δθ₄ = θ₄^(t) - θ^(t)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- FOOTER PRINCIPLE CALLOUT                                               -->
  <!-- ====================================================================== -->
  <text x="420" y="454" text-anchor="middle" font-size="8" fill="#64748b" font-style="italic">
    FedAvg coordinates distributed learning through iterative communication rounds: models move to the data, while private data never leaves the device.
  </text>
</svg>
