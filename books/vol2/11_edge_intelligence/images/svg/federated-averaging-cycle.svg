  <rect x="52" y="240" width="56" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="80" y="253" text-anchor="middle" font-size="12" fill="#14532d">data D<tspan font-size="9" dy="3">1</tspan></text>
  <text x="80" y="280" text-anchor="middle" font-size="12" fill="#14294E">E local epochs</text>
  <rect x="150" y="210" width="100" height="80" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
