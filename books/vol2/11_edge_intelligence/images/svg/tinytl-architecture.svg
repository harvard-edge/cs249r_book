  <rect x="85" y="82" width="130" height="26" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="150" y="99" text-anchor="middle" font-size="11" fill="#14294E">Block 1</text>
  <path d="M150,108 V118" stroke="#94a3b8" stroke-width="1"/>
