  <text x="420" y="252" text-anchor="middle" font-size="11" fill="#334155">Updates: biases, lite residuals, classifier</text>

  <!-- ===== Legend ===== -->
  <rect x="112" y="274" width="16" height="12" rx="1" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="134" y="284" font-size="11" fill="#334155">Frozen weights</text>
  <rect x="240" y="274" width="16" height="12" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="262" y="284" font-size="11" fill="#334155">Trainable</text>
