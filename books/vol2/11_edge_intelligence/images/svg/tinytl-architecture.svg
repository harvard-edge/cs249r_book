  <path d="M460,131 H474" stroke="#1F407A" stroke-width="1"/>
  <rect x="474" y="121" width="82" height="20" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="515" y="135" text-anchor="middle" font-size="10.5" fill="#14294E">lite residual</text>
  <path d="M395,144 V154" stroke="#94a3b8" stroke-width="1"/>

  <rect x="330" y="154" width="130" height="26" rx="2" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
  <text x="380" y="171" text-anchor="middle" font-size="11" fill="#475569">Block 3</text>
  <rect x="428" y="159" width="26" height="16" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="441" y="171" text-anchor="middle" font-size="11" font-style="italic" fill="#14294E">b</text>
  <path d="M460,167 H474" stroke="#1F407A" stroke-width="1"/>
  <rect x="474" y="157" width="82" height="20" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="515" y="171" text-anchor="middle" font-size="10.5" fill="#14294E">lite residual</text>
  <path d="M395,180 V196" stroke="#94a3b8" stroke-width="1"/>

  <rect x="330" y="196" width="130" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
