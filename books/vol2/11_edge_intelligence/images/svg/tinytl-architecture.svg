  <text x="150" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#14294E">Classifier</text>
  <path d="M240,226 V84" fill="none" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#334155">Updates: every weight</text>

  <!-- ===== Panel B: TinyTL ===== -->
