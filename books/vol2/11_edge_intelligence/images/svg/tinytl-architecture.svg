<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-rose" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#e11d48"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#059669"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#d97706"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0.5, 6 3, 0 5.5" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-txt { font-size: 6.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
    .prop-hdr { font-size: 7.2px; font-weight: 700; }
    .prop-txt { font-size: 6.4px; }
    .metric-lbl { font-size: 6.2px; font-weight: 600; fill: #64748b; }
    .metric-val { font-size: 6.2px; font-weight: 700; }
    .math-txt { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- TWO COMPARISON PANELS                                                  -->
  <!-- ====================================================================== -->
  <g transform="translate(24, 16)">

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- LEFT PANEL: CONVENTIONAL FINE-TUNING                                 -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="364" height="420" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Canonical Header Bar -->
      <path d="M 0 4 A 4 4 0 0 1 4 0 L 360 0 A 4 4 0 0 1 364 4 L 364 26 L 0 26 Z" fill="#fee2e2"/>
      <text x="14" y="17" font-size="7.5" font-weight="700" fill="#991b1b" letter-spacing="0.3">CONVENTIONAL FINE-TUNING · FULL ACTIVATION CACHING</text>

      <!-- Architecture Schematic -->
      <g transform="translate(16, 36)">
        <rect x="0" y="0" width="332" height="210" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        
        <!-- Layer Blocks -->
        <g transform="translate(20, 12)">
          <!-- Layer 1 -->
          <rect x="0" y="0" width="200" height="26" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
          <text x="100" y="14" text-anchor="middle" font-size="7" font-weight="700" fill="#e11d48">Conv Block 1 (Trainable)</text>
          <text x="100" y="22" text-anchor="middle" font-size="5.8" fill="#be123c">Weights W₁ + Activations A₁ cached</text>

          <!-- Layer 2 -->
          <rect x="0" y="36" width="200" height="26" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
          <text x="100" y="50" text-anchor="middle" font-size="7" font-weight="700" fill="#e11d48">Conv Block 2 (Trainable)</text>
          <text x="100" y="58" text-anchor="middle" font-size="5.8" fill="#be123c">Weights W₂ + Activations A₂ cached</text>

          <!-- Layer 3 -->
          <rect x="0" y="72" width="200" height="26" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
          <text x="100" y="86" text-anchor="middle" font-size="7" font-weight="700" fill="#e11d48">Conv Block 3 (Trainable)</text>
          <text x="100" y="94" text-anchor="middle" font-size="5.8" fill="#be123c">Weights W₃ + Activations A₃ cached</text>

          <!-- Layer 4 -->
          <rect x="0" y="108" width="200" height="26" rx="2" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
          <text x="100" y="122" text-anchor="middle" font-size="7" font-weight="700" fill="#e11d48">Conv Block 4 (Trainable)</text>
          <text x="100" y="130" text-anchor="middle" font-size="5.8" fill="#be123c">Weights W₄ + Activations A₄ cached</text>

          <!-- Head -->
          <rect x="0" y="144" width="200" height="28" rx="2" fill="#e11d48" stroke="#be123c" stroke-width="1"/>
          <text x="100" y="158" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">Classifier Head (Trainable)</text>
          <text x="100" y="167" text-anchor="middle" font-size="5.8" fill="#ffe4e6">Full loss computation &amp; gradient initiation</text>

          <!-- Connectors between layers -->
          <line x1="100" y1="26" x2="100" y2="36" stroke="#fda4af" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="100" y1="62" x2="100" y2="72" stroke="#fda4af" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="100" y1="98" x2="100" y2="108" stroke="#fda4af" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="100" y1="134" x2="100" y2="144" stroke="#fda4af" stroke-width="1" stroke-dasharray="2,1"/>

          <!-- Full Backprop Arrow -->
          <path d="M 200,158 L 244,158 L 244,13 L 206,13" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-rose)"/>
          <text x="250" y="86" font-size="6.2" font-weight="600" fill="#e11d48" transform="rotate(90, 250, 86)" text-anchor="middle">Full Backprop Through All Layers</text>
        </g>
      </g>

      <!-- Characteristics Callout -->
      <g transform="translate(16, 256)">
        <rect x="0" y="0" width="332" height="66" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.8"/>
        <text x="10" y="14" class="prop-hdr" fill="#be123c">Activation Memory Bottleneck</text>
        <text x="10" y="27" font-size="6.4" class="prop-txt" fill="#9f1239">Cache: Activations must be retained during forward pass</text>
        <text x="10" y="39" font-size="6.4" class="prop-txt" fill="#9f1239">Scaling: Footprint scales with batch × resolution × channels</text>
        <text x="10" y="51" font-size="6.4" class="prop-txt" fill="#9f1239">Constraint: Peak memory (&gt;2,000 KB) exhausts MCU SRAM (512 KB)</text>
      </g>

      <!-- Metrics Gauges -->
      <g transform="translate(16, 330)">
        <rect x="0" y="0" width="332" height="80" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="10" y="15" class="prop-hdr" fill="#334155">MEMORY PROFILE (MICROCONTROLLER CLASS)</text>

        <!-- Activation RAM -->
        <text x="10" y="30" class="metric-lbl">Activation Storage Footprint:</text>
        <text x="322" y="30" text-anchor="end" class="metric-val" fill="#e11d48">~1,000 KB (Exceeds Limit)</text>
        <rect x="10" y="34" width="312" height="8" rx="2" fill="#f1f5f9"/>
        <rect x="10" y="34" width="312" height="8" rx="2" fill="#e11d48"/>

        <!-- SRAM Limit Line Indicator -->
        <line x1="166" y1="31" x2="166" y2="45" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="2,1"/>
        <text x="166" y="52" text-anchor="middle" font-size="5.8" font-weight="700" fill="#0f172a">MCU SRAM Ceiling (512 KB)</text>

        <!-- Status Result -->
        <rect x="10" y="58" width="312" height="15" rx="2" fill="#ffe4e6"/>
        <text x="166" y="68.5" text-anchor="middle" font-size="6.2" font-weight="700" fill="#be123c">✗ Out-of-Memory (OOM) Crash on MCU</text>
      </g>
    </g>

    <!-- ──────────────────────────────────────────────────────────────────── -->
    <!-- RIGHT PANEL: TINYTL (TINY TRANSFER LEARNING)                         -->
    <!-- ──────────────────────────────────────────────────────────────────── -->
    <g transform="translate(388, 0)">
      <rect x="0" y="0" width="364" height="420" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Canonical Header Bar -->
      <path d="M 0 4 A 4 4 0 0 1 4 0 L 360 0 A 4 4 0 0 1 364 4 L 364 26 L 0 26 Z" fill="#dcfce7"/>
      <text x="14" y="17" font-size="7.5" font-weight="700" fill="#166534" letter-spacing="0.3">TINYTL ARCHITECTURE · FROZEN BACKBONE ADAPTATION</text>

      <!-- Architecture Schematic -->
      <g transform="translate(16, 36)">
        <rect x="0" y="0" width="332" height="210" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        
        <!-- Layer Blocks: Frozen Backbone + Bias + Lite Residual -->
        <g transform="translate(14, 12)">
          <!-- Layer 1 -->
          <rect x="0" y="0" width="168" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="84" y="13" text-anchor="middle" font-size="6.8" fill="#64748b">Conv Block 1 (frozen ❄)</text>
          <text x="84" y="22" text-anchor="middle" font-size="5.6" fill="#94a3b8">0 activation memory cached</text>
          <rect x="174" y="5" width="28" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
          <text x="188" y="15.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309" class="math-txt">+b₁</text>

          <!-- Layer 2 -->
          <rect x="0" y="36" width="168" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="84" y="49" text-anchor="middle" font-size="6.8" fill="#64748b">Conv Block 2 (frozen ❄)</text>
          <text x="84" y="58" text-anchor="middle" font-size="5.6" fill="#94a3b8">0 activation memory cached</text>
          <rect x="174" y="41" width="28" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
          <text x="188" y="51.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309" class="math-txt">+b₂</text>

          <!-- Lite Residual Module (Sidecar Bypass) -->
          <g transform="translate(210, 20)">
            <rect x="0" y="0" width="84" height="60" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
            <text x="42" y="14" text-anchor="middle" font-size="6.5" font-weight="700" fill="#047857">Lite Residual</text>
            <text x="42" y="24" text-anchor="middle" font-size="6.5" font-weight="700" fill="#047857">Adapter</text>
            <text x="42" y="36" text-anchor="middle" font-size="5.6" fill="#065f46">Trainable (r=8)</text>
            <text x="42" y="46" text-anchor="middle" font-size="5.5" fill="#15803d">Activations: 30 KB</text>
            <!-- In/Out connectors -->
            <path d="M -42,16 L -10,16 L 0,16" fill="none" stroke="#059669" stroke-width="1" marker-end="url(#arr-green)"/>
            <path d="M 42,60 L 42,76 L -10,76" fill="none" stroke="#059669" stroke-width="1" marker-end="url(#arr-green)"/>
          </g>

          <!-- Layer 3 -->
          <rect x="0" y="72" width="168" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="84" y="85" text-anchor="middle" font-size="6.8" fill="#64748b">Conv Block 3 (frozen ❄)</text>
          <text x="84" y="94" text-anchor="middle" font-size="5.6" fill="#94a3b8">0 activation memory cached</text>
          <rect x="174" y="77" width="28" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
          <text x="188" y="87.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309" class="math-txt">+b₃</text>

          <!-- Layer 4 -->
          <rect x="0" y="108" width="168" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="84" y="121" text-anchor="middle" font-size="6.8" fill="#64748b">Conv Block 4 (frozen ❄)</text>
          <text x="84" y="130" text-anchor="middle" font-size="5.6" fill="#94a3b8">0 activation memory cached</text>
          <rect x="174" y="113" width="28" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
          <text x="188" y="123.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309" class="math-txt">+b₄</text>

          <!-- Head -->
          <rect x="0" y="144" width="202" height="28" rx="2" fill="#059669" stroke="#047857" stroke-width="1"/>
          <text x="101" y="158" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">Classifier Head (Trainable)</text>
          <text x="101" y="167" text-anchor="middle" font-size="5.8" fill="#d1fae5">Updates bias + residual adapter paths only</text>

          <!-- Backbone Connectors -->
          <line x1="84" y1="26" x2="84" y2="36" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="84" y1="62" x2="84" y2="72" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="84" y1="98" x2="84" y2="108" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>
          <line x1="84" y1="134" x2="84" y2="144" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,1"/>

          <!-- Local Backprop Arrow: updates only Head, Lite Residual, and Biases -->
          <path d="M 202,158 L 298,158 L 298,50 L 294,50" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
          <text x="304" y="112" font-size="6.2" font-weight="600" fill="#059669" transform="rotate(90, 304, 112)" text-anchor="middle">Local Backprop Only</text>
        </g>
      </g>

      <!-- Characteristics Callout -->
      <g transform="translate(16, 256)">
        <rect x="0" y="0" width="332" height="66" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
        <text x="10" y="14" class="prop-hdr" fill="#047857">Memory-Bounded Transfer Learning</text>
        <text x="10" y="27" font-size="6.4" class="prop-txt" fill="#065f46">Zero Cache: Backbone layers frozen (0 cached activations)</text>
        <text x="10" y="39" font-size="6.4" class="prop-txt" fill="#065f46">BitFit Biases: Lightweight bias tuning shifts domain features</text>
        <text x="10" y="51" font-size="6.4" class="prop-txt" fill="#065f46">Lite Residual: Sidecar adapter recovers full expressive capacity</text>
      </g>

      <!-- Metrics Gauges -->
      <g transform="translate(16, 330)">
        <rect x="0" y="0" width="332" height="80" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="10" y="15" class="prop-hdr" fill="#334155">MEMORY PROFILE (MICROCONTROLLER CLASS)</text>

        <!-- Activation RAM -->
        <text x="10" y="30" class="metric-lbl">Activation Storage Footprint:</text>
        <text x="322" y="30" text-anchor="end" class="metric-val" fill="#059669">~50 KB (~20× Reduction)</text>
        <rect x="10" y="34" width="312" height="8" rx="2" fill="#f1f5f9"/>
        <rect x="10" y="34" width="28" height="8" rx="2" fill="#059669"/>

        <!-- SRAM Limit Line Indicator -->
        <line x1="166" y1="31" x2="166" y2="45" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="2,1"/>
        <text x="166" y="52" text-anchor="middle" font-size="5.8" font-weight="700" fill="#0f172a">MCU SRAM Ceiling (512 KB)</text>

        <!-- Status Result -->
        <rect x="10" y="58" width="312" height="15" rx="2" fill="#dcfce7"/>
        <text x="166" y="68.5" text-anchor="middle" font-size="6.2" font-weight="700" fill="#15803d">✓ Fully Executes within 512 KB MCU SRAM</text>
      </g>
    </g>
  </g>
</svg>