  formulas:
    - y = W x + b
    - \frac{\partial \mathcal{L}}{\partial W} = 0, \quad \frac{\partial \mathcal{L}}{\partial b} \neq 0
    - b \leftarrow b - \eta \frac{\partial \mathcal{L}}{\partial b}
    - h' = h + A(h)
    - A(h) = W_2 \, \sigma(W_1 h)
    - \Delta W \approx U V^\top
    - W_{\text{adapted}} = W_{\text{frozen}} + U V^\top
    - \theta_i \leftarrow \theta_i - \eta \frac{\partial \mathcal{L}}{\partial \theta_i}, \quad \text{for } i =
      1, \ldots, N_L
    - \theta_i \leftarrow \begin{cases} \theta_i - \eta \frac{\partial \mathcal{L}}{\partial \theta_i}, & \text{if
      } i \in \mathcal{S} \\ \theta_i, & \text{otherwise} \end{cases}
    - \theta_{t+1} = \theta_t - \eta_t \nabla \mathcal{L}(x_t; \theta_t)
    - \theta_{t+1} = \theta_t - \eta \nabla_\theta \left[ \frac{1}{k} \sum_{i=1}^{k} \mathcal{L}(x_i, y_i; \theta_t)
      \right]
    - \theta_{t+1} = \theta_t - \eta \nabla_\theta \mathcal{L}\big(g(z_i; \theta), y_i\big)
    - \theta^{t+1} = \sum_{k=1}^{C} \frac{n_k}{n} \theta_k^{t+1}
    - \mathbb{E}[F(\theta^R) - F(\theta^\star)] \leq \mathcal{O}\left(\frac{1}{\sqrt{CER}}\right)
    - \mathbb{E}[F(\theta^R) - F(\theta^\star)] \leq \mathcal{O}\left(\frac{1 + \beta_{\text{het}}}{\sqrt{CER}}
      + \frac{\beta_{\text{het}}^2 E^2}{R}\right)
    - \beta_{\text{het}}^2 = \frac{1}{K}\sum_{k=1}^{K} \|\nabla F_k(\theta) - \nabla F(\theta)\|^2
    - \min_{\theta_1, \ldots, \theta_K} \sum_{k=1}^{K} \left( \mathcal{L}_k(\theta_k) + \lambda_{\text{reg}} \cdot
      \mathcal{R}(\theta_k, \theta_{\text{global}}) \right)
