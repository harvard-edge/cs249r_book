      label: Secure aggregation
      teaches: Secure aggregation
      summary: A protocol that reveals an aggregate update while hiding individual contributions within
        its stated threat model.
      section: sec-edge-intelligence-federated-privacy-a1ed
    relationships:
    - id: vol2.field.33
      source: vol2.federated.participation
      predicate: changes the sample used by
      target: vol2.federated.fedavg
      explanation: Client availability and selection determine which data distributions influence the aggregate
        update.
      conditions: Weights and sampling corrections must match the intended population objective.
      status: draft
      evidence:
        section: sec-edge-intelligence-client-scheduling-f675
        quote: Scheduling must therefore balance completion speed with population coverage. Stratified or
          quota-based sampling can prioritize underrepresented groups among eligible devices, while cumulative
          participation records can guide later invitations. Weighting methods require estimates of the
          population and selection process; they cannot recover observations from a cohort that never participates.
          Buffered asynchronous aggregation [@fedbuff], whose mechanism @sec-edge-intelligence-asynchronous-device-synchronization-348e
          describes, staleness-aware methods [@rodio2024], and fairness-oriented weighting [@fedstaleweight]
          offer additional controls. Their effectiveness must be checked through completed participation
          and cohort quality, rather than inferred from the scheduling rule alone. Example weighting in
          the aggregate (@eq-fedavg-weighted-aggregation) also gives large local datasets more influence
          whether or not they represent the target population any better.
    - id: vol2.field.34
      source: vol2.federated.secure-aggregation
      predicate: hides individual inputs to
      target: vol2.federated.fedavg
      explanation: Secure aggregation restricts visibility of client contributions while exposing an aggregate.
      conditions: The guarantee is bounded by cohort size, dropouts, collusion, and the protocol threat
        model.
      status: draft
      evidence:
        section: sec-edge-intelligence-federated-privacy-a1ed
        quote: Secure aggregation also creates a robustness conflict. Byzantine-resilient rules\index{Secure
          aggregation!Byzantine resilience conflict} such as Krum, coordinate-wise filtering, or per-client
          anomaly inspection need access to individual updates, while secure aggregation deliberately hides
          those updates [@blanchard2017machine; @bonawitz2017]. A system cannot claim both arbitrary per-client
          inspection and conventional secure aggregation over the same messages. It must instead validate
          clients before masking, use attested execution and bounded local updates, compute only aggregation-compatible
          checks, or adopt a protocol designed to evaluate approved robust statistics without revealing
          raw client contributions. @Fig-secure-agg models this cryptographic boundary through pairwise
          zero-sum masking. Clients A and B negotiate a shared random mask $\PairwiseMaskSecret$ via Diffie-Hellman
          key agreement. They perturb their local updates into pseudo-random vectors ($\FirstClientMaskedUpdate
          = \FiniteChange\FirstClientModelParameters+ \PairwiseMaskSecret$ and $\SecondClientMaskedUpdate
          = \FiniteChange\SecondClientModelParameters- \PairwiseMaskSecret$) before crossing into the server
          domain. When the aggregation server sums the received vectors, the symmetric masks cancel ($\PairwiseMaskSecret
          - \PairwiseMaskSecret = 0$), yielding the exact unmasked aggregate $\FiniteChange\FirstClientModelParameters+
          \FiniteChange\SecondClientModelParameters$. This two-client illustration assumes both clients
          complete the exchange and neither reveals its mask to the server. It demonstrates cancellation,
          not a complete protocol for collusion resistance or dropout recovery.
    - id: vol2.field.35
      source: vol2.federated.secure-aggregation
      predicate: does not substitute for
      target: vol2.privacy.dp
      explanation: Hiding individual update messages does not alone bound information leakage through the
        released aggregate or model.
      conditions: Secure aggregation and differential privacy protect against different observers and disclosures.
      status: draft
      evidence:
        section: sec-edge-intelligence-federated-privacy-a1ed
        quote: Secure aggregation and differential privacy\index{Differential privacy!composition with secure
          aggregation} can protect different boundaries, but their composition must follow the threat model.
          If a trusted server adds noise after receiving an exact aggregate, the privacy guarantee applies
          to the released noisy result; it does not hide that exact aggregate from the server. A protocol
          designed for distributed noise can instead let the server receive only a noisy aggregate. Clipping,
          noise calibration, dropout assumptions, and repeated-release accounting must match the chosen
          protocol. Neither mechanism establishes that local data or updates are trustworthy.
    maps: []
