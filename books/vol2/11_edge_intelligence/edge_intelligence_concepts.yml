  claims:
    Local training must earn its place: Centralized, local-only, and federated learning differ in what crosses the
      device boundary, and local training is justified only when a measured adaptation gain beats feature-based
      personalization under privacy and resource constraints.
    Update working set within the background allowance: An on-device update must fit its peak training working set
      inside the allowance the OS grants a background task, a few hundred MB on a phone rather than its installed
      RAM, so a model whose weights fit easily can still fail to train.
    Background adaptation admission: The runtime admits an adaptation window only if its energy, thermal, and foreground-latency
      tests all hold, charging relaxes only the energy test, and admission is revoked when the measured envelope
      changes.
    FedAvg under sampling and non-IID data: FedAvg is local SGD under a sampled cohort and non-IID shards, so local
      epochs that save uplink rounds also pull clients toward their own optima (client drift), and the comparison
      is measured time to a quality target, not rounds.
    Participation selection: Passing the device admission test correlates with hardware, charging habits, and connectivity,
      so the federated model learns from the admitted population rather than the deployed one, and over-selection
      with a round deadline concentrates that bias; the skew is sized per cohort as a coverage ratio, the cohort's
      share of completed updates over its share of the deployed population.
    Federated uplink budget: Per-round traffic is downlink plus uplink plus protocol plus retry over a slow asymmetric
      uplink, so a small compressed update is not an end-to-end saving once cumulative uploads overtake the raw-data
      volume.
    Secure aggregation: Data locality is not privacy, because updates and metadata still leak, so secure aggregation's
      cancelling pairwise masks hide each client's update from the coordinator at the cost of a participation floor
      (a secret-sharing threshold of survivors, and enough clients that the sum hides each one) and dropout recovery
      (survivors' shares rebuild a dropped client's masks in an extra round), while differential privacy bounds a
      different boundary.
    Adaptive fleet release policy: Once models learn after release the release artifact is an adaptation policy
      versioned with its base model, adapters, and schemas, rollback must restore a compatible set, a shadow
      comparison against a frozen model is a gate, not a judge, and fleet promotion adds hardware-in-the-loop validation,
      compatibility across long version skew, and a hold when a cohort's reporting coverage is too low to count as evidence.
    Adaptation method by budget term: Freezing removes a parameter's gradient and optimizer state but not its place
      on the backward path, so bias-only updates, LoRA, and residual adapters each shrink a different term of the
      peak-memory budget.
    Scarce local evidence allocation: On-device data is sparse, weakly labeled, non-IID, and unshuffleable, so few-shot
      sets, streaming updates, replay buffers, and compressed representations each spend a different scarce resource,
      and an embedding is not anonymized by being low-dimensional.
    On-device drift and forgetting: Sequential local updates that each pass the budget and a local metric can compound
      into catastrophic forgetting and drift from the validated release, so stability needs a mechanism priced in
      device state and forgetting measured per cohort.
    Personalization state boundary: The federated objective guarantees nothing per client, so personalization adds
      per-client state regularized toward the global model and must declare which state is aggregated and which
      stays local.
    Version-compatible aggregation: A returned update is meaningful only against its base version and schema, so
      the coordinator binds updates to version and round, reconciles devices returning after days offline, and down-weights
      stale contributions in buffered asynchronous aggregation.
