  formulas:
    - P_{\text{total}} = P_{\text{dynamic}} + P_{\text{static}} = \alpha C V^2 f + V I_{\text{leak}}
    - \text{PUE} = \frac{P_{\text{total\_facility}}}{P_{\text{IT\_equipment}}}
    - \text{WUE} = \frac{W_{\text{annual\_water\_usage}}}{P_{\text{IT\_equipment\_energy}}}
    - \text{AI} = \frac{\text{Total FLOPs}}{\text{Total Bytes Moved}}
    - E_{\text{total}} = E_{\text{compute}} + E_{\text{memory}} = \text{FLOPs} \times e_{\text{flop}} + \text{Bytes}
      \times e_{\text{byte}}
    - E_{\text{dominant}} = \max\left(E_{\text{compute}}, E_{\text{memory}}\right) = \max\left(\text{FLOPs} \times
      e_{\text{flop}}, \text{Bytes} \times e_{\text{byte}}\right)
    - \text{AI}_{\text{crossover}} = \frac{e_{\text{byte}}}{e_{\text{flop}}}
    - \text{AI}_{\text{crossover}} = \frac{160 \text{ pJ/byte}}{10 \text{ pJ/FLOP}} = 16 \text{ FLOP/byte}
    - P_{\text{average}} = P_{\text{active}} \times D + P_{\text{idle}} \times (1 - D)
    - E_{\text{total}} = (E_{\text{CPU}} + E_{\text{GPU}} + E_{\text{memory}} + E_{\text{network}}) \times \text{PUE}
    - C_{\text{operational}} = E_{\text{total}} \times \text{CI}_{\text{grid}}
    - C_{\text{embodied,daily}} = \frac{C_{\text{manufacturing}}}{T_{\text{lifetime}} \times 365}
    - C_{\text{lifecycle}} = C_{\text{training}} + C_{\text{inference}} + C_{\text{embodied}}
    - P_{\text{average}} = P_{\text{active}} \times \frac{t_{\text{inference}}}{T_{\text{period}}} + P_{\text{sleep}}
      \times \frac{T_{\text{period}} - t_{\text{inference}}}{T_{\text{period}}}
    - E_{\text{cascade}} = E_{\text{edge}} + p_{\text{escalate}} \times (E_{\text{transmit}} + E_{\text{cloud}})
    - E_{\text{federated}} = N \times E_{\text{local\_train}} + E_{\text{aggregation}}
    - E_{\text{centralized}} = N \times E_{\text{transmit}} + E_{\text{cloud\_train}}
    - \text{EDP} = E \times T = P \times T^2
