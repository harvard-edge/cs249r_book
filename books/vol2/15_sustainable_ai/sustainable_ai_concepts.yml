  claims:
    Power ceiling versus energy account: A facility cannot draw more than its grid feed and cooling capacity at
      any instant, while run energy integrates average power over time, so a short run can be infeasible at modest
      energy and a long run feasible at large energy.
    Sustainability measurement contract: An energy or carbon number supports a comparison only when it extends the
      reproducible measurement contract with five fields, the functional unit, system boundary, attribution rule,
      carbon signal, and time and location of operation.
    Operational carbon chain: Operational CO2 = IT energy x PUE x grid carbon intensity, three terms acting at separate
      tiers, and PUE measures only non-IT overhead, so a coal-fed site can beat a hydro-fed one on PUE.
    Embodied carbon allocation: Manufacturing emissions are fixed before first power-on and allocated to work by
      a declared rule, so their share of a job's footprint rises on clean grids and at low utilization and decides
      when replacing hardware pays.
    Dominant lifecycle carbon term: Lifecycle CO2 is training plus inference plus embodied, where development multiplies
      training and inference recurs with query volume and idle capacity, so for widely served models inference is
      usually the dominant term and picks the lever.
    Carbon-aware placement and time-shifting: Moving work to cleaner regions or hours changes the emissions factor,
      not the energy, so it must use a marginal signal from a forecast, meet deadline, data, capacity, and reliability
      constraints, and beat the cost of the move.
    Water accounting: Evaporative heat rejection lowers facility energy at the price of water, so water is a separate,
      location-weighted account (WUE at the IT boundary, withdrawal vs consumption, direct vs indirect) traded against
      energy.
    Demand outruns efficiency: Fleet energy is energy per job times number of jobs, and demand outruns efficiency
      twice, through scaling laws that price each loss reduction in multiplicative compute and through rebound,
      so efficiency targets need absolute budgets.
    Facility overhead boundary: 'PUE is facility energy over IT energy, defined once at the facility boundary, so
      budgeting by accelerator TDP underestimates load and the boundary decides where each loss is counted: upstream
      transformer, UPS, and distribution losses raise PUE while supply and regulator losses stay in IT load.'
    Energy crossover versus performance ridge: Modeled energy crosses over from movement-dominated to arithmetic-dominated
      at an intensity set by energy per byte over energy per operation, a different point from the performance ridge,
      so batch-1 decode spends most of its energy moving bytes.
    Edge and federated energy accounting: Local execution saves energy only when the radio, remote compute, and
      transfers it avoids exceed the device's added compute, idle power, and manufacturing, so edge and federated
      deployment move energy rather than remove it.
