      evidence:
        section: sec-sustainable-ai-sustainable-ai-engineering-discipline-6d39
        quote: '1.  **Significance**: Training GPT-3 consumed approximately `{python} Gpt3HouseholdEnergyAnchor.gpt3_training_mwh_str`
          of energy [@li2020estimating], equivalent to roughly `{python} Gpt3HouseholdEnergyAnchor.gpt3_household_years_str`
          US household-years of electricity. The same lifecycle logic applies after training: pretrained
          models can often be adapted with far less work than training from scratch, and high-volume inference
          can eventually dominate total energy. Sustainable AI therefore tracks both one-time training runs
          and recurring serving workloads rather than treating model training as the whole footprint.

          2.  **Distinction**: Unlike corporate sustainability reporting (which aggregates energy usage
          into annual CO~2~ disclosures), sustainable AI engineering operates at the individual workload
          level. It selects hardware by FLOP/s per watt, schedules training during periods of high renewable
          availability, and chooses model architectures that minimize inference FLOPs rather than maximizing
          accuracy alone.

          3.  **Common pitfall**: A frequent misconception is that switching to renewable energy solves
          the sustainability problem. For hardware-intensive ML, embodied carbon (the carbon emitted manufacturing
          the chips, servers, and cooling equipment before they ever run a training job) can rival operational
          carbon on clean grids or at low utilization. For battery-powered consumer devices, manufacturing
          can account for most of the lifecycle footprint [@gupta2022chasing]. Hardware longevity and utilization
          rate are therefore as important as energy source.'
    - id: vol2.field.45
      source: vol2.hardware.power-envelope
      predicate: caps instantaneous power underlying
      target: vol2.sustainability.energy
      explanation: Rack power is an instantaneous operating constraint; accumulated energy also depends
        on how long equipment runs.
      conditions: Integrate the measured power profile over time using the same equipment and facility boundary.
      status: draft
      evidence:
        section: sec-sustainable-ai-energy-wall
        quote: The two limits obey different arithmetic (@fig-energy-wall). The power limit is instantaneous.
          A facility cannot draw more than its grid feed ($\FacilityPower\le \GridFeedCapacity$), which
          caps the number of servers active at once ($\PoweredServerCount\le \InformationTechnologyPower/
          \ServerPower$) regardless of how long a job runs. The energy account is cumulative, integrating
          average power over wall-clock time to give run energy ($\TotalEnergy = \AveragePower\times \JobDuration$).
          Exceeding electrical or thermal capacity can force power limiting, throttling, or protective shutdown.
          Cumulative energy instead enters the electricity and emissions accounts, which also depend on
          tariffs and the applicable grid emissions factors.
