<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- LEFT AREA: Bar Chart (x=40 to 650, width 610, y=40 to 390, height 350) -->
  <!-- Axis bounds: y=70 (35B) to y=370 (0B). Height = 300px. Formula: y = 370 - (v / 35) * 300 -->
  <!-- Gridlines at 0, 5, 10, 15, 20, 25, 30, 35 B -->
  <g stroke="#e2e8f0" stroke-width="0.8">
    <line x1="85" y1="370" x2="640" y2="370"/>
    <line x1="85" y1="327.1" x2="640" y2="327.1"/> <!-- 5B -->
    <line x1="85" y1="284.3" x2="640" y2="284.3"/> <!-- 10B -->
    <line x1="85" y1="241.4" x2="640" y2="241.4"/> <!-- 15B -->
    <line x1="85" y1="198.6" x2="640" y2="198.6"/> <!-- 20B -->
    <line x1="85" y1="155.7" x2="640" y2="155.7"/> <!-- 25B -->
    <line x1="85" y1="112.9" x2="640" y2="112.9"/> <!-- 30B -->
    <line x1="85" y1="70" x2="640" y2="70"/>       <!-- 35B -->
  </g>

  <!-- Y-Axis Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="end">
    <text x="76" y="373">0</text>
    <text x="76" y="330">5B</text>
    <text x="76" y="287">10B</text>
    <text x="76" y="244">15B</text>
    <text x="76" y="201">20B</text>
    <text x="76" y="158">25B</text>
    <text x="76" y="115">30B</text>
    <text x="76" y="73">35B</text>
  </g>
  <text x="24" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90,24,220)">Active Connected Devices (Billions)</text>

  <!-- Vertical Divider at 2024 (Between 2023 and 2024*) -->
  <!-- 12 slots: 2019=0 to 2030=11. Slot width = 45px. First slot center x = 115, ... 2023 center = 295, 2024 center = 340. Divider at x = 317.5 -->
  <line x1="317.5" y1="50" x2="317.5" y2="370" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <rect x="250" y="44" width="135" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="317.5" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Historical / Projection Split</text>

  <!-- Bars (Width = 28px, bar centered on slot) -->
  <!-- 2019: 8.60B -> h = 73.7, y = 296.3, cx = 115, x = 101 -->
  <rect x="101" y="296.3" width="28" height="73.7" rx="2" fill="#1F407A"/>
  <text x="115" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#14294E" text-anchor="middle">8.6</text>
  <text x="115" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">2019</text>

  <!-- 2020: 9.76B -> h = 83.7, y = 286.3, cx = 160, x = 146 -->
  <rect x="146" y="286.3" width="28" height="83.7" rx="2" fill="#1F407A"/>
  <text x="160" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#14294E" text-anchor="middle">9.8</text>
  <text x="160" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">2020</text>

  <!-- 2021: 11.28B -> h = 96.7, y = 273.3, cx = 205, x = 191 -->
  <rect x="191" y="273.3" width="28" height="96.7" rx="2" fill="#1F407A"/>
  <text x="205" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#14294E" text-anchor="middle">11.3</text>
  <text x="205" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">2021</text>

  <!-- 2022: 13.14B -> h = 112.6, y = 257.4, cx = 250, x = 236 -->
  <rect x="236" y="257.4" width="28" height="112.6" rx="2" fill="#1F407A"/>
  <text x="250" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#14294E" text-anchor="middle">13.1</text>
  <text x="250" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">2022</text>

  <!-- 2023: 15.14B -> h = 129.8, y = 240.2, cx = 295, x = 281 -->
  <rect x="281" y="240.2" width="28" height="129.8" rx="2" fill="#1F407A"/>
  <text x="295" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#14294E" text-anchor="middle">15.1</text>
  <text x="295" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">2023</text>

  <!-- 2024*: 17.80B -> h = 152.6, y = 217.4, cx = 340, x = 326 -->
  <rect x="326" y="217.4" width="28" height="152.6" rx="2" fill="#6366f1"/>
  <text x="340" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#4338ca" text-anchor="middle">17.8</text>
  <text x="340" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#4338ca" text-anchor="middle">2024*</text>

  <!-- 2025*: 19.08B -> h = 163.5, y = 206.5, cx = 385, x = 371 -->
  <rect x="371" y="206.5" width="28" height="163.5" rx="2" fill="#6366f1"/>
  <text x="385" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#4338ca" text-anchor="middle">19.1</text>
  <text x="385" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#4338ca" text-anchor="middle">2025*</text>

  <!-- 2026*: 21.09B -> h = 180.8, y = 189.2, cx = 430, x = 416 -->
  <rect x="416" y="189.2" width="28" height="180.8" rx="2" fill="#6366f1"/>
  <text x="430" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#4338ca" text-anchor="middle">21.1</text>
  <text x="430" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#4338ca" text-anchor="middle">2026*</text>

  <!-- 2027*: 23.14B -> h = 198.3, y = 171.7, cx = 475, x = 461 -->
  <rect x="461" y="171.7" width="28" height="198.3" rx="2" fill="#6366f1"/>
  <text x="475" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#4338ca" text-anchor="middle">23.1</text>
  <text x="475" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#4338ca" text-anchor="middle">2027*</text>

  <!-- 2028*: 25.21B -> h = 216.1, y = 153.9, cx = 520, x = 506 -->
  <rect x="506" y="153.9" width="28" height="216.1" rx="2" fill="#6366f1"/>
  <text x="520" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#4338ca" text-anchor="middle">25.2</text>
  <text x="520" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#4338ca" text-anchor="middle">2028*</text>

  <!-- 2029*: 27.31B -> h = 234.1, y = 135.9, cx = 565, x = 551 -->
  <rect x="551" y="135.9" width="28" height="234.1" rx="2" fill="#6366f1"/>
  <text x="565" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#4338ca" text-anchor="middle">27.3</text>
  <text x="565" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#4338ca" text-anchor="middle">2029*</text>

  <!-- 2030*: 29.42B -> h = 252.2, y = 117.8, cx = 610, x = 596 -->
  <rect x="596" y="117.8" width="28" height="252.2" rx="2" fill="#6366f1"/>
  <text x="610" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#4338ca" text-anchor="middle">29.4</text>
  <text x="610" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#4338ca" text-anchor="middle">2030*</text>

  <!-- Axes lines -->
  <line x1="85" y1="50" x2="85" y2="370" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="85" y1="370" x2="640" y2="370" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Legend inside chart -->
  <g transform="translate(100, 75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">
    <rect x="0" y="0" width="12" height="10" rx="1.5" fill="#1F407A"/>
    <text x="18" y="9" fill="#475569">Historical Data</text>
    <rect x="110" y="0" width="12" height="10" rx="1.5" fill="#6366f1"/>
    <text x="128" y="9" fill="#475569">Statista Projections (*)</text>
  </g>

  <!-- RIGHT CARDS AREA: x from 665 to 935 (width 270) -->
  <g transform="translate(665, 45)">
    <rect x="0" y="0" width="270" height="345" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <path d="M 0 5 A 5 5 0 0 1 5 0 L 265 0 A 5 5 0 0 1 270 5 L 270 26 L 0 26 Z" fill="#fee2e2"/>
    <text x="135" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle" letter-spacing="0.4">E-WASTE &amp; OBSOLESCENCE DYNAMICS</text>

    <!-- Block 1: Scale -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="246" height="74" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="8" y="8" width="115" height="16" rx="2" fill="#EAF1F8"/>
      <text x="65" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#14294E" text-anchor="middle">ENDPOINT EXPLOSION</text>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Scale: 3.4× fleet expansion in one decade</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Topology: Distributed low-value edge deployments</text>
      <text x="10" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Toxicity: Accumulation of uncollected micro-batteries</text>
    </g>

    <!-- Block 2: Obsolescence Mechanics -->
    <g transform="translate(12, 118)">
      <rect x="0" y="0" width="246" height="92" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="8" y="8" width="125" height="16" rx="2" fill="#fef3c7"/>
      <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">TIGHT-COUPLING RISKS</text>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Enclosures: Glued hermetic casing prevents repair</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Silicon: Non-modular sensor-compute baseboards</text>
      <text x="10" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Software: Deprecated security firmware strands units</text>
      <text x="10" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Consequence: Entire device retired for 1 failed cell</text>
    </g>

    <!-- Block 3: Circular Economy Solution -->
    <g transform="translate(12, 218)">
      <rect x="0" y="0" width="246" height="78" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <rect x="8" y="8" width="125" height="16" rx="2" fill="#dcfce7"/>
      <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">CIRCULAR INTERVENTIONS</text>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Hardware: Modular socketed boards (Right-to-Repair)</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Lifecycle: Guaranteed 5-year security maintenance</text>
      <text x="10" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Embodied CO2: Amortized manufacturing emissions</text>
    </g>

    <text x="135" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">Source: Statista (2022) / UN E-Waste Monitor</text>
  </g>
</svg>
