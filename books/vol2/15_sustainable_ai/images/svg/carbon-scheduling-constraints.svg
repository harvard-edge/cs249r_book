<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 3 CONSTRAINTS INPUT (TOP ROW) -->
  <!-- Constraint 1: Grid Signal -->
  <g transform="translate(25, 20)">
    <rect width="220" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="220" height="26" rx="3" fill="#f8fafc"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#1F407A">Dynamic Grid Signal C(t)</text>
    <text x="15" y="44" font-size="8.5" fill="#334155">• Marginal intensity (g CO₂eq/kWh)</text>
    <text x="15" y="60" font-size="8.5" fill="#334155">• Solar peaks (midday) &amp; wind (night)</text>
    <text x="15" y="76" font-size="8.5" fill="#334155">• High-emissions fossil baseload periods</text>
    <text x="15" y="96" font-size="8" font-weight="600" fill="#1F407A">Time-varying carbon factor</text>
  </g>

  <!-- Constraint 2: SLA Bound -->
  <g transform="translate(270, 20)">
    <rect width="220" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="220" height="26" rx="3" fill="#f8fafc"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#1F407A">Job SLA &amp; Deadline</text>
    <text x="15" y="44" font-size="8.5" fill="#334155">• Runtime duration required (T_run)</text>
    <text x="15" y="60" font-size="8.5" fill="#334155">• Completion deadline (T_deadline)</text>
    <text x="15" y="76" font-size="8.5" fill="#334155">• Permissible slack: T_slack &gt; 0</text>
    <text x="15" y="96" font-size="8" font-weight="600" fill="#1F407A">Bounds delay tolerance</text>
  </g>

  <!-- Constraint 3: Cluster Headroom -->
  <g transform="translate(515, 20)">
    <rect width="220" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="220" height="26" rx="3" fill="#f8fafc"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#1F407A">Cluster Capacity Headroom</text>
    <text x="15" y="44" font-size="8.5" fill="#334155">• Available accelerator nodes N(t)</text>
    <text x="15" y="60" font-size="8.5" fill="#334155">• Facility power &amp; thermal headroom</text>
    <text x="15" y="76" font-size="8.5" fill="#334155">• Interconnect topology locality</text>
    <text x="15" y="96" font-size="8" font-weight="600" fill="#1F407A">Physical execution limit</text>
  </g>

  <!-- Convergence Arrows -->
  <path d="M 135 130 V 155 H 380 V 170" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="380" y1="130" x2="380" y2="170" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <path d="M 625 130 V 155 H 380 V 170" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- TIMELINE OPTIMIZATION CONTAINER -->
  <g transform="translate(25, 175)">
    <rect width="710" height="165" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <rect width="710" height="28" rx="3" fill="#EAF1F8"/>
    <text x="15" y="19" font-size="10" font-weight="700" fill="#1F407A">Carbon-Aware Scheduler: Feasible Window Optimization [t_start, t_start + T_run]</text>

    <!-- Timeline Bar -->
    <g transform="translate(20, 42)">
      <!-- Avoided Fossil Peak -->
      <rect x="0" y="0" width="180" height="42" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="90" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">Fossil Peak (Avoided)</text>
      <text x="90" y="32" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Carbon &gt; 450 g/kWh · Job Paused</text>

      <!-- Feasible Clean Window -->
      <rect x="190" y="0" width="280" height="42" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
      <text x="330" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Feasible Clean Window (Job Running)</text>
      <text x="330" y="32" text-anchor="middle" font-size="8" fill="#166534">High Renewables · Carbon &lt; 90 g/kWh · Fits T_run</text>

      <!-- Remaining Slack -->
      <rect x="480" y="0" width="120" height="42" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="540" y="18" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Remaining Slack</text>
      <text x="540" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Buffer before SLA penalty</text>

      <!-- Deadline Line -->
      <line x1="605" y1="-8" x2="605" y2="50" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="612" y="24" font-size="8.5" font-weight="700" fill="#dc2626">T_deadline</text>
    </g>

    <!-- Operational Overhead Formula Note -->
    <g transform="translate(20, 100)">
      <rect width="670" height="50" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="15" y="18" font-size="9" font-weight="700" fill="#0f172a">Net Operational Carbon Accounting Equation:</text>
      <text x="15" y="34" font-size="8.5" fill="#334155">Net Carbon = ∫ P(t) C(t) dt + Carbon_checkpoint + Carbon_idle_wait + Carbon_migration</text>
      <text x="490" y="18" font-size="8" fill="#64748b">Shifting is beneficial only if carbon saved &gt; overhead</text>
    </g>
  </g>
</svg>
