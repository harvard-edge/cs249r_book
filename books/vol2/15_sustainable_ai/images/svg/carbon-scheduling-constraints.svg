<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 3 CONSTRAINTS INPUT (TOP ROW, width 230 each) -->
  <!-- Constraint 1: Grid Signal -->
  <g transform="translate(25, 15)">
    <rect width="230" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="22" font-size="9.5" font-weight="700" fill="#1F407A">Dynamic Grid Signal C(t)</text>
    <text x="12" y="44" font-size="8" fill="#334155">• Marginal intensity (g CO₂eq/kWh)</text>
    <text x="12" y="58" font-size="8" fill="#334155">• Solar peaks (midday) &amp; wind (night)</text>
    <text x="12" y="72" font-size="8" fill="#334155">• High-emissions fossil baseload</text>
    <text x="12" y="94" font-size="7.5" font-weight="600" fill="#1F407A">Time-varying carbon factor</text>
  </g>

  <!-- Constraint 2: SLA Bound -->
  <g transform="translate(285, 15)">
    <rect width="230" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="22" font-size="9.5" font-weight="700" fill="#1F407A">Job SLA &amp; Deadline</text>
    <text x="12" y="44" font-size="8" fill="#334155">• Runtime duration required (T_run)</text>
    <text x="12" y="58" font-size="8" fill="#334155">• Completion deadline (T_deadline)</text>
    <text x="12" y="72" font-size="8" fill="#334155">• Permissible slack: T_slack &gt; 0</text>
    <text x="12" y="94" font-size="7.5" font-weight="600" fill="#1F407A">Bounds delay tolerance</text>
  </g>

  <!-- Constraint 3: Cluster Headroom -->
  <g transform="translate(545, 15)">
    <rect width="230" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="22" font-size="9.5" font-weight="700" fill="#1F407A">Cluster Capacity Headroom</text>
    <text x="12" y="44" font-size="8" fill="#334155">• Available accelerator nodes N(t)</text>
    <text x="12" y="58" font-size="8" fill="#334155">• Facility power &amp; thermal headroom</text>
    <text x="12" y="72" font-size="8" fill="#334155">• Interconnect topology locality</text>
    <text x="12" y="94" font-size="7.5" font-weight="600" fill="#1F407A">Physical execution limit</text>
  </g>

  <!-- Convergence Arrows -->
  <path d="M 140 125 V 145 H 400 V 158" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="400" y1="125" x2="400" y2="158" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <path d="M 660 125 V 145 H 400 V 158" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- TIMELINE OPTIMIZATION CONTAINER (width 750) -->
  <g transform="translate(25, 160)">
    <rect width="750" height="175" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <text x="15" y="22" font-size="10" font-weight="700" fill="#1F407A">Carbon-Aware Scheduler: Feasible Window Optimization [t_start, t_start + T_run]</text>

    <!-- Timeline Bar -->
    <g transform="translate(20, 40)">
      <!-- Avoided Fossil Peak -->
      <rect x="0" y="0" width="190" height="42" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="95" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">Fossil Peak (Avoided)</text>
      <text x="95" y="32" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Carbon &gt; 450 g/kWh · Job Paused</text>

      <!-- Feasible Clean Window -->
      <rect x="200" y="0" width="310" height="42" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
      <text x="355" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Feasible Clean Window (Job Running)</text>
      <text x="355" y="32" text-anchor="middle" font-size="8" fill="#166534">High Renewables · Carbon &lt; 90 g/kWh · Fits T_run</text>

      <!-- Remaining Slack -->
      <rect x="520" y="0" width="130" height="42" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="585" y="18" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Remaining Slack</text>
      <text x="585" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Buffer before penalty</text>

      <!-- Deadline Line -->
      <line x1="660" y1="-8" x2="660" y2="50" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="668" y="24" font-size="8.5" font-weight="700" fill="#dc2626">T_deadline</text>
    </g>

    <!-- Operational Overhead Formula Note -->
    <g transform="translate(20, 96)">
      <rect width="710" height="65" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="15" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Net Operational Carbon Accounting Equation:</text>
      <text x="15" y="34" font-size="8" fill="#334155">Net Carbon = ∫ P(t) C(t) dt + Carbon_checkpoint + Carbon_idle_wait + Carbon_migration</text>
      <text x="15" y="52" font-size="7.5" fill="#64748b">Shifting is beneficial only if carbon saved during clean window exceeds migration and checkpoint overhead.</text>
    </g>
  </g>
</svg>
