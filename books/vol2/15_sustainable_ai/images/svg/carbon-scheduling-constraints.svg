<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Top Flow: Grid Forecast (Purple) -> Feasible Window (Purple) -> Scheduled Job (Blue) -->
  <rect x="25" y="65" width="175" height="65" rx="4" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="112.5" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">Grid forecast</text>

  <path d="M200 97.5 L255 97.5" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="255" y="65" width="175" height="65" rx="4" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="342.5" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">Feasible window</text>

  <path d="M430 97.5 L485 97.5" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="485" y="65" width="170" height="65" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="570" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Scheduled job</text>

  <!-- Constraint from Below (Red) -->
  <rect x="255" y="185" width="175" height="48" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="342.5" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Deadline + capacity</text>

  <path d="M342.5 185 V130" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
