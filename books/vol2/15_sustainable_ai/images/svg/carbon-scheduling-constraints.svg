<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Top Header Banner Pill -->
  <rect x="205.0" y="18" width="590" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500.0" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.2px">CARBON-AWARE SCHEDULING · FEASIBLE JOB WINDOW OPTIMIZATION</text>
  <rect x="40" y="65" width="280" height="145" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="55" y="78" width="115" height="22" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="112" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6" letter-spacing="0.8px">GRID SIGNAL</text>
  <text x="55" y="122" font-size="13" font-weight="700" fill="#5b21b6">Dynamic Grid Forecast C(t)</text>
  <text x="55" y="142" font-size="11" fill="#475569">• Marginal carbon intensity (gCO2eq/kWh)</text>
  <text x="55" y="160" font-size="11" fill="#475569">• Solar peaks (midday) &amp; wind surges (night)</text>
  <text x="55" y="178" font-size="11" fill="#475569">• High-emissions fossil baseload periods</text>
  <rect x="360" y="65" width="280" height="145" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="375" y="78" width="115" height="22" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="432" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af" letter-spacing="0.8px">SLA BOUND</text>
  <text x="375" y="122" font-size="13" font-weight="700" fill="#1e40af">Job Deadline &amp; Duration</text>
  <text x="375" y="142" font-size="11" fill="#475569">• Execution runtime required (T_run)</text>
  <text x="375" y="160" font-size="11" fill="#475569">• Absolute completion deadline (T_deadline)</text>
  <text x="375" y="178" font-size="11" fill="#475569">• Permissible slack window: T_slack &gt; 0</text>
  <rect x="680" y="65" width="280" height="145" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="695" y="78" width="125" height="22" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="757" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b" letter-spacing="0.8px">HARDWARE CAP</text>
  <text x="695" y="122" font-size="13" font-weight="700" fill="#991b1b">Cluster Capacity Headroom</text>
  <text x="695" y="142" font-size="11" fill="#475569">• Available accelerator nodes N(t)</text>
  <text x="695" y="160" font-size="11" fill="#475569">• Facility power &amp; thermal headroom</text>
  <text x="695" y="178" font-size="11" fill="#475569">• Network fabric topology availability</text>
  <path d="M 180 210 L 180 235 L 350 235 L 350 248" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M 500 210 L 500 248" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M 820 210 L 820 235 L 650 235 L 650 248" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <!-- Center Container: Feasible Window -->
  <rect x="40" y="250" width="920" height="195" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="262" width="160" height="24" rx="4" fill="#0f172a"/>
  <text x="135" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.8px">OPTIMIZATION ENGINE</text>
  <text x="230" y="279" font-size="13" font-weight="700" fill="#0f172a">Identify Optimal Feasible Window [t_start, t_start + T_run]</text>
  <rect x="55" y="300" width="890" height="65" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="65" y="310" width="220" height="45" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="175" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Fossil Peak Period (Avoided)</text>
  <text x="175" y="344" text-anchor="middle" font-size="10" fill="#991b1b">Carbon &gt; 450 g/kWh • Job Paused</text>
  <rect x="295" y="310" width="355" height="45" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="472" y="327" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">✓ FEASIBLE GREEN WINDOW (RUNNING)</text>
  <text x="472" y="343" text-anchor="middle" font-size="10" fill="#166534">High Solar/Wind • Carbon &lt; 90 g/kWh • Fits T_run Window</text>
  <rect x="660" y="310" width="175" height="45" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="747" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Remaining Slack</text>
  <text x="747" y="344" text-anchor="middle" font-size="10" fill="#64748b">Buffer before SLA penalty</text>
  <line x1="840" y1="305" x2="840" y2="360" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 2"/>
  <text x="885" y="333" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">T_deadline</text>
  <rect x="55" y="375" width="890" height="60" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="70" y="395" font-size="11" font-weight="700" fill="#1e40af">Net Emissions Equation Accounting for Operational Overhead:</text>
  <text x="70" y="415" font-size="12" font-weight="700" fill="#0f172a">Net Carbon = ∫ P(t) C(t) dt  +  Carbon_checkpoint/restart  +  Carbon_idle_wait  +  Carbon_data_migration</text>
  <text x="70" y="429" font-size="10" fill="#64748b">Scheduling is valid only if carbon saved during clean window exceeds migration and checkpoint costs.</text>
  <path d="M 500 445 L 500 460" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="260" y="462" width="480" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="500" y="487" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">✓ Scheduled Job Dispatched Under Minimal Marginal Carbon</text>
  <!-- Bottom Takeaway Card -->
  <rect x="40" y="515" width="920" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="528" width="165" height="24" rx="4" fill="#0f172a"/>
  <text x="137" y="544" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.8px">SYSTEMS TAKEAWAY</text>
  <text x="235" y="545" font-size="12" font-weight="700" fill="#0f172a">Carbon-Aware Scheduling Must Factor Overhead and Firm Delivery SLAs</text>
  <text x="55" y="570" font-size="11" fill="#475569">• Delaying or pausing jobs is viable only for delay-tolerant batch training, not real-time user-facing inference.</text>
  <text x="55" y="586" font-size="11" fill="#475569">• Checkpointing 100B+ models incurs high I/O energy; frequent pause-resume cycles can consume more energy than continuous execution.</text>
</svg>