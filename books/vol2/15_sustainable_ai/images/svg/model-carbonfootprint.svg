<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="760" height="505" fill="#ffffff"/>
  <defs>
    <pattern id="offline-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#F8FAFC"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.8"/>
    </pattern>
    <pattern id="oss-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#F8FAFC"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#16a34a" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!-- Legend -->
  <g font-size="9.5" fill="#334155" transform="translate(40, -12)">
    <rect x="140" y="38" width="13" height="13" fill="url(#offline-hatch)" stroke="#64748b" stroke-width="1" rx="1.5"/>
    <text x="159" y="48">Offline training</text>
    <rect x="260" y="38" width="13" height="13" fill="#d97706" stroke="#b45309" stroke-width="1" rx="1.5"/>
    <text x="279" y="48">Online training</text>
    <rect x="380" y="38" width="13" height="13" fill="#1F407A" rx="1.5"/>
    <text x="399" y="48">Inference</text>
    <rect x="475" y="38" width="13" height="13" fill="url(#oss-hatch)" stroke="#16a34a" stroke-width="1" rx="1.5"/>
    <text x="494" y="48">Public baseline (training-only)</text>
  </g>

  <!-- Gridlines -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="82" y1="290" x2="705" y2="290"/>
    <line x1="82" y1="220" x2="705" y2="220"/>
    <line x1="82" y1="150" x2="705" y2="150"/>
    <line x1="82" y1="80" x2="705" y2="80"/>
  </g>

  <!-- Axes lines -->
  <line x1="82" y1="70" x2="82" y2="360" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="82" y1="360" x2="705" y2="360" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Y-Axis Labels -->
  <g font-size="9" fill="#64748b" text-anchor="end">
    <text x="74" y="363">0.00</text>
    <text x="74" y="293">0.25</text>
    <text x="74" y="223">0.50</text>
    <text x="74" y="153">0.75</text>
    <text x="74" y="83">1.00</text>
  </g>
  <text x="26" y="215" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155" transform="rotate(-90 26 215)">CO₂e (Million kg)</text>

  <!-- Vertical partition between Meta and Public models -->
  <line x1="362" y1="70" x2="362" y2="360" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Category grouping labels at bottom -->
  <rect x="94" y="468" width="250" height="22" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="219" y="482" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14294E">META PRODUCTION MODELS (LIFECYCLE)</text>

  <rect x="380" y="468" width="315" height="22" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="537" y="482" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">PUBLIC BENCHMARK MODELS (TRAINING ONLY)</text>

  <!-- Meta production models: offline training, online training, inference -->
  <g stroke-width="1">
    <rect x="96" y="354.4" width="26" height="5.6" fill="url(#offline-hatch)" stroke="#64748b"/>
    <rect x="96" y="326.4" width="26" height="28.0" fill="#1F407A"/>

    <rect x="140" y="262.0" width="26" height="98.0" fill="url(#offline-hatch)" stroke="#64748b"/>
    <rect x="140" y="250.8" width="26" height="11.2" fill="#d97706" stroke="#b45309"/>
    <rect x="140" y="122.0" width="26" height="128.8" fill="#1F407A"/>

    <rect x="184" y="290.0" width="26" height="70.0" fill="url(#offline-hatch)" stroke="#64748b"/>
    <rect x="184" y="281.6" width="26" height="8.4" fill="#d97706" stroke="#b45309"/>
    <rect x="184" y="203.2" width="26" height="78.4" fill="#1F407A"/>

    <rect x="228" y="323.6" width="26" height="36.4" fill="url(#offline-hatch)" stroke="#64748b"/>
    <rect x="228" y="318.0" width="26" height="5.6" fill="#d97706" stroke="#b45309"/>
    <rect x="228" y="250.8" width="26" height="67.2" fill="#1F407A"/>

    <rect x="272" y="320.8" width="26" height="39.2" fill="url(#offline-hatch)" stroke="#64748b"/>
    <rect x="272" y="315.2" width="26" height="5.6" fill="#d97706" stroke="#b45309"/>
    <rect x="272" y="259.2" width="26" height="56.0" fill="#1F407A"/>

    <rect x="316" y="315.2" width="26" height="44.8" fill="url(#offline-hatch)" stroke="#64748b"/>
    <rect x="316" y="309.6" width="26" height="5.6" fill="#d97706" stroke="#b45309"/>
    <rect x="316" y="236.8" width="26" height="72.8" fill="#1F407A"/>
  </g>

  <!-- Public baselines: training-only values from published reports -->
  <g stroke="#16a34a" stroke-width="1">
    <rect x="390" y="281.6" width="26" height="78.4" fill="url(#oss-hatch)"/>
    <rect x="434" y="358.8" width="26" height="1.2" fill="url(#oss-hatch)"/>
    <rect x="478" y="346.0" width="26" height="14.0" fill="url(#oss-hatch)"/>
    <rect x="522" y="334.8" width="26" height="25.2" fill="url(#oss-hatch)"/>
    <rect x="566" y="358.3" width="26" height="1.7" fill="url(#oss-hatch)"/>
    <rect x="610" y="340.4" width="26" height="19.6" fill="url(#oss-hatch)"/>
    <rect x="654" y="206.0" width="26" height="154.0" fill="url(#oss-hatch)"/>
  </g>

  <!-- Model labels under ticks -->
  <g font-size="9" font-weight="600" fill="#475569" text-anchor="end">
    <text x="109" y="380" transform="rotate(-55 109 380)">LM</text>
    <text x="153" y="380" transform="rotate(-55 153 380)">RM-1</text>
    <text x="197" y="380" transform="rotate(-55 197 380)">RM-2</text>
    <text x="241" y="380" transform="rotate(-55 241 380)">RM-3</text>
    <text x="285" y="380" transform="rotate(-55 285 380)">RM-4</text>
    <text x="329" y="380" transform="rotate(-55 329 380)">RM-5</text>
    <text x="403" y="380" transform="rotate(-55 403 380)">BERT-NAS</text>
    <text x="447" y="380" transform="rotate(-55 447 380)">Evolved Transformer</text>
    <text x="491" y="380" transform="rotate(-55 491 380)">T5</text>
    <text x="535" y="380" transform="rotate(-55 535 380)">Meena</text>
    <text x="579" y="380" transform="rotate(-55 579 380)">GShard-600B</text>
    <text x="623" y="380" transform="rotate(-55 623 380)">Switch Transformer</text>
    <text x="667" y="380" transform="rotate(-55 667 380)">GPT-3</text>
  </g>

  <!-- Ticks -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="109" y1="360" x2="109" y2="365"/>
    <line x1="153" y1="360" x2="153" y2="365"/>
    <line x1="197" y1="360" x2="197" y2="365"/>
    <line x1="241" y1="360" x2="241" y2="365"/>
    <line x1="285" y1="360" x2="285" y2="365"/>
    <line x1="329" y1="360" x2="329" y2="365"/>
    <line x1="403" y1="360" x2="403" y2="365"/>
    <line x1="447" y1="360" x2="447" y2="365"/>
    <line x1="491" y1="360" x2="491" y2="365"/>
    <line x1="535" y1="360" x2="535" y2="365"/>
    <line x1="579" y1="360" x2="579" y2="365"/>
    <line x1="623" y1="360" x2="623" y2="365"/>
    <line x1="667" y1="360" x2="667" y2="365"/>
  </g>
</svg>
