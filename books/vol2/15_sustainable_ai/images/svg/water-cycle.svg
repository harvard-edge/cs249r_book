<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="730" height="280" fill="#fff"/>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== Row 1: intake to fab ===== -->
  <rect x="40" y="30" width="150" height="90" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="115" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Raw water intake</text>
  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#1F407A">river or municipal</text>

  <rect x="230" y="30" width="170" height="90" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="315" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Ultrapure water</text>
  <text x="315" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">treatment</text>
  <text x="315" y="97" text-anchor="middle" font-size="12" fill="#1F407A">deionize, filter, UV</text>

  <rect x="440" y="30" width="150" height="90" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="515" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Fab processing</text>
  <text x="515" y="88" text-anchor="middle" font-size="12" fill="#92400e">cleaning, CMP, rinses</text>

  <rect x="616" y="40" width="94" height="70" rx="3" fill="#FEE2E2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="663" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Consumed</text>
  <text x="663" y="88" text-anchor="middle" font-size="12" fill="#b91c1c">evaporation</text>

  <!-- ===== Row 2: treatment and reuse ===== -->
  <rect x="400" y="180" width="190" height="80" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="495" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Wastewater treatment</text>
  <text x="495" y="236" text-anchor="middle" font-size="12" fill="#15803d">neutralize, filter, test</text>

  <!-- ===== Flow arrows ===== -->
  <line x1="190" y1="75" x2="230" y2="75" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="400" y1="75" x2="440" y2="75" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="515" y1="120" x2="515" y2="180" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="590" y1="75" x2="616" y2="75" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>

  <!-- ===== Reuse loop ===== -->
  <path d="M 400 220 H 300" fill="none" stroke="#16A34A" stroke-width="1.5"/>
  <path d="M 130 220 H 20 V 150 H 115 V 120" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="130" y="200" width="170" height="40" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="215" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">treated flow reused</text>
</svg>
