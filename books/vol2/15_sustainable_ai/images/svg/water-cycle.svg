<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="750" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#008F45"/>
    </marker>
  </defs>

  <!-- ===== Row 1: intake to fab ===== -->
  <rect x="40" y="30" width="150" height="90" rx="3" fill="#f7f7f7" stroke="#999999" stroke-width="1.5"/>
  <text x="115" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Raw water intake</text>
  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#555">river or municipal</text>

  <rect x="230" y="30" width="170" height="90" rx="3" fill="#f7f7f7" stroke="#999999" stroke-width="1.5"/>
  <text x="315" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Ultrapure water</text>
  <text x="315" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#333">treatment</text>
  <text x="315" y="97" text-anchor="middle" font-size="12" fill="#555">deionize, filter, UV</text>

  <rect x="440" y="30" width="150" height="90" rx="3" fill="#f7f7f7" stroke="#999999" stroke-width="1.5"/>
  <text x="515" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Fab processing</text>
  <text x="515" y="88" text-anchor="middle" font-size="12" fill="#555">cleaning, CMP, rinses</text>

  <!-- ===== Flows leaving the facility ===== -->
  <rect x="620" y="40" width="104" height="70" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="672" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Consumed</text>
  <text x="672" y="88" text-anchor="middle" font-size="12" fill="#555">evaporation</text>

  <rect x="620" y="185" width="104" height="70" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="672" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Discharged</text>
  <text x="672" y="233" text-anchor="middle" font-size="12" fill="#555">leaves facility</text>

  <!-- ===== Row 2: treatment and reuse ===== -->
  <rect x="400" y="180" width="190" height="80" rx="3" fill="#D4EFDF" stroke="#008F45" stroke-width="1.5"/>
  <text x="495" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Wastewater treatment</text>
  <text x="495" y="236" text-anchor="middle" font-size="12" fill="#555">neutralize, filter, test</text>

  <!-- ===== Flow arrows ===== -->
  <line x1="190" y1="75" x2="230" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="75" x2="440" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="515" y1="120" x2="515" y2="180" stroke="#008F45" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="590" y1="75" x2="620" y2="75" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="590" y1="220" x2="620" y2="220" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Reuse loop ===== -->
  <path d="M 400 220 H 20 V 150 H 115 V 120" fill="none" stroke="#008F45" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="210" y="210" text-anchor="middle" font-size="12" fill="#555">treated flow reused</text>
</svg>
