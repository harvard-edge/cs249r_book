<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- LEFT PLOT AREA: x from 140 to 620, y from 40 to 390 -->
  <!-- Origin (0,0) at (140, 360) -->
  <!-- Point A (Cost): y = 140. Point B (Cost): y = 250 -->
  <!-- Point C (Volume): x = 250. Point D (Volume): x = 520 -->

  <!-- Shaded Region 1: Direct Unit Savings (140, 140) to (250, 250). Width 110, Height 110 -->
  <rect x="140" y="140" width="110" height="110" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="195" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">THEORETICAL</text>
  <text x="195" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">SAVINGS</text>
  <text x="195" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#166534" text-anchor="middle">(Cost Drop × Q₀)</text>

  <!-- Shaded Region 2: Rebound Surge (250, 250) to (520, 360). Width 270, Height 110 -->
  <rect x="250" y="250" width="270" height="110" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="385" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">REBOUND CONSUMPTION SURGE</text>
  <text x="385" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d" text-anchor="middle">Cheaper inference unlocks continuous background automation,</text>
  <text x="385" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d" text-anchor="middle">mass agentic loops, and synthetic data generating runs</text>
  <text x="385" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">NET ENERGY SURGE: Area(Rebound) &gt; Area(Savings)</text>

  <!-- Retained Base: (140, 250) to (250, 360) -->
  <rect x="140" y="250" width="110" height="110" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="195" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Retained Base</text>

  <!-- Elastic Demand Curve (Smooth Convex Curve) -->
  <!-- Passes through (180, 85), (250, 140), (360, 205), (520, 250), (590, 268) -->
  <path d="M 180 85 C 210 110, 230 128, 250 140 C 300 170, 420 230, 520 250 C 550 256, 575 262, 595 266" fill="none" stroke="#1F407A" stroke-width="3"/>
  <rect x="360" y="180" width="180" height="18" rx="2" fill="#ffffff" stroke="#D4E2F0" stroke-width="0.8"/>
  <text x="450" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#14294E" text-anchor="middle">Elastic Demand Curve: D(P)</text>

  <!-- Projections for Point A (250, 140) -->
  <line x1="140" y1="140" x2="250" y2="140" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="250" y1="140" x2="250" y2="360" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="250" cy="140" r="4.5" fill="#1F407A" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Projections for Point B (520, 250) -->
  <line x1="140" y1="250" x2="520" y2="250" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="520" y1="250" x2="520" y2="360" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="520" cy="250" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Cost Drop Indicator (Y-axis left) -->
  <line x1="105" y1="145" x2="105" y2="245" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="68" y="185" width="60" height="20" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
  <text x="98" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">−50% COST</text>

  <!-- Usage Surge Indicator (X-axis bottom) -->
  <line x1="255" y1="395" x2="515" y2="395" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="330" y="385" width="110" height="20" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="385" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">+145% USAGE SURGE</text>

  <!-- Y-Axis Labels -->
  <text x="132" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="end">P₀: Initial Unit Cost</text>
  <text x="132" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="end">P₁: Reduced Cost</text>

  <!-- X-Axis Labels -->
  <text x="250" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Q₀: Base Volume</text>
  <text x="520" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Q₁: Rebound Volume</text>

  <!-- Axes lines -->
  <line x1="140" y1="60" x2="140" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="140" y1="360" x2="570" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle">Unit Cost ($ / FLOP)</text>
  <text x="560" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#334155" text-anchor="end">AI Compute Volume →</text>

  <!-- RIGHT CARDS AREA: x from 645 to 935 (width 290) -->
  <g transform="translate(645, 45)">
    <rect x="0" y="0" width="290" height="350" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <path d="M 0 5 A 5 5 0 0 1 5 0 L 285 0 A 5 5 0 0 1 290 5 L 290 26 L 0 26 Z" fill="#EAF1F8"/>
    <text x="145" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#14294E" text-anchor="middle" letter-spacing="0.4">THE JEVONS EFFICIENCY TRAP</text>

    <!-- Block 1: The Microeconomic Trap -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="266" height="76" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="8" y="8" width="125" height="16" rx="2" fill="#fef3c7"/>
      <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">ELASTICITY &gt; 1 MECHANISM</text>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Unit Gain: Quantization &amp; pruning slash cost −50%</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Transition: Batch luxury becomes omnipresent utility</text>
      <text x="10" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Dynamics: Lower price expands market aggregate demand</text>
    </g>

    <!-- Block 2: Rebound Drivers -->
    <g transform="translate(12, 120)">
      <rect x="0" y="0" width="266" height="92" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="8" y="8" width="120" height="16" rx="2" fill="#fee2e2"/>
      <text x="68" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">SYSTEMS REBOUND LEVERS</text>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Agentic Loops: Multi-step tool loops execute 100× calls</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Continuous AI: Streaming edge computer vision &amp; audio</text>
      <text x="10" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Synthetic Data: LLM pipelines generating pre-training tokens</text>
      <text x="10" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">Speculation: Speculative sampling and tree branch search</text>
    </g>

    <!-- Block 3: Mitigation Architecture -->
    <g transform="translate(12, 220)">
      <rect x="0" y="0" width="266" height="78" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <rect x="8" y="8" width="130" height="16" rx="2" fill="#dcfce7"/>
      <text x="73" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">ABSOLUTE BUDGET CONTROLS</text>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Datacenter: Enforce hard aggregate MW power envelopes</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Matching: Hourly 24/7 carbon matching &amp; curtailment</text>
      <text x="10" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">Governance: Quota throttling for automated agent loops</text>
    </g>

    <text x="145" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">Economic Principle: Jevons (1865) / Khazzoom-Brookes</text>
  </g>
</svg>
