<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480">
  <rect width="840" height="480" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- Background grid: Left=110, Right=800, Bottom=370, Top=90 -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="110" y1="370" x2="800" y2="370"/>
    <line x1="110" y1="325" x2="800" y2="325"/>
    <line x1="110" y1="280" x2="800" y2="280"/>
    <line x1="110" y1="235" x2="800" y2="235"/>
    <line x1="110" y1="190" x2="800" y2="190"/>
    <line x1="110" y1="145" x2="800" y2="145"/>
    <line x1="110" y1="100" x2="800" y2="100"/>
  </g>

  <!-- Phase separator dashed verticals -->
  <line x1="260" y1="100" x2="260" y2="370" stroke="#cbd5e1" stroke-dasharray="4,3" stroke-width="1.2"/>
  <line x1="620" y1="100" x2="620" y2="370" stroke="#cbd5e1" stroke-dasharray="4,3" stroke-width="1.2"/>

  <!-- Y-axis labels -->
  <g font-size="8.5" fill="#64748b" text-anchor="end">
    <text x="100" y="373">0%</text>
    <text x="100" y="328">20%</text>
    <text x="100" y="283">40%</text>
    <text x="100" y="238">60%</text>
    <text x="100" y="193">80%</text>
    <text x="100" y="148">100%</text>
    <text x="100" y="103">120%</text>
  </g>
  <text x="28" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#334155" transform="rotate(-90,28,235)">Cluster Power Draw (% Rated TDP)</text>

  <!-- GPU Compute Power Area (Blue) -->
  <!-- Ramp from 110,370 to 260,145; Flat to 620,145; Ramp-down to 710,370 -->
  <polygon points="110,370 260,145 620,145 710,370 110,370" fill="#EAF1F8" opacity="0.85"/>
  <polyline points="110,370 260,145 620,145 710,370" fill="none" stroke="#1F407A" stroke-width="2.5"/>

  <!-- Cooling Overhead Area (Amber) -->
  <!-- Ramp from 110,370 to 260,95; Flat to 620,95; Down to 620,145; back along 260,145 to 110,370 -->
  <polygon points="110,370 260,95 620,95 620,145 260,145 110,370" fill="#fef3c7" opacity="0.6"/>
  <polyline points="110,370 260,95 620,95" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5,2"/>

  <!-- In-Chart Overhead Tag -->
  <g transform="translate(440, 116)">
    <rect x="-85" y="-11" width="170" height="22" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">+ Facility Cooling Overhead (~30%)</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="370" x2="800" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="370" x2="110" y2="60" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="388" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Training Cluster Startup and Execution Timeline</text>

  <!-- Phase labels -->
  <g transform="translate(185, 354)">
    <rect x="-42" y="-13" width="84" height="18" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="0" y="-1" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">Phase 1 · Ramp</text>
  </g>
  <g transform="translate(440, 354)">
    <rect x="-50" y="-13" width="100" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="0" y="-1" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">Phase 2 · Steady State</text>
  </g>
  <g transform="translate(665, 354)">
    <rect x="-48" y="-13" width="96" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="0" y="-1" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">Phase 3 · Wind-Down</text>
  </g>

  <!-- Callout 1: Voltage Spike Hazard (Top Left) -->
  <g transform="translate(130, 20)">
    <rect width="165" height="50" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="82.5" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">VOLTAGE TRANSIENT SPIKE</text>
    <text x="82.5" y="29" text-anchor="middle" font-size="7.5" fill="#7f1d1d">dI/dt exceeds protection trip limits</text>
    <text x="82.5" y="41" text-anchor="middle" font-size="7" fill="#dc2626">Requires phased accelerator ramp</text>
    <!-- Arrow pointing down to the ramp -->
    <line x1="82.5" y1="50" x2="82.5" y2="92" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrow-red)"/>
  </g>

  <!-- Callout 2: Steady State Baseload (Center Top) -->
  <g transform="translate(350, 20)">
    <rect width="180" height="50" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect width="180" height="16" rx="4" fill="#eff6ff"/>
    <rect y="12" width="180" height="4" fill="#eff6ff"/>
    <text x="8" y="11.5" font-size="7.5" font-weight="700" fill="#1F407A">STEADY STATE BASELOAD</text>
    <text x="8" y="28" font-size="7.5" fill="#1e3a8a">~100% TDP Continuous Load</text>
    <text x="8" y="41" font-size="7" fill="#64748b">24/7 inflexible grid demand</text>
    <line x1="90" y1="50" x2="90" y2="90" stroke="#1F407A" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Callout 3: Synchronized Inrush (Inside chart area) -->
  <g transform="translate(280, 210)">
    <rect width="150" height="66" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <rect width="150" height="16" rx="4" fill="#fee2e2"/>
    <rect y="12" width="150" height="4" fill="#fee2e2"/>
    <text x="8" y="11.5" font-size="7.5" font-weight="700" fill="#b91c1c">INRUSH CURRENT HAZARD</text>
    <text x="8" y="28" font-size="7.5" font-weight="600" fill="#0f172a">Thousands of GPUs</text>
    <text x="8" y="41" font-size="7" fill="#64748b">Sync kernel execution</text>
    <text x="8" y="55" font-size="7" font-weight="700" fill="#dc2626">Trips upstream breakers</text>
    <line x1="0" y1="33" x2="-35" y2="33" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
  </g>

  <!-- Legend at Top Right -->
  <g transform="translate(630, 20)">
    <rect width="170" height="82" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="170" height="18" rx="4" fill="#f1f5f9"/>
    <rect y="14" width="170" height="4" fill="#f1f5f9"/>
    <text x="10" y="13" font-size="7.5" font-weight="700" fill="#334155">LEGEND</text>

    <g transform="translate(10, 26)">
      <rect x="0" y="2" width="14" height="10" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
      <text x="22" y="10" font-size="7.5" fill="#334155">GPU Compute Load</text>

      <rect x="0" y="18" width="14" height="10" rx="2" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
      <text x="22" y="26" font-size="7.5" fill="#334155">Cooling Overhead</text>

      <rect x="0" y="34" width="14" height="10" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="22" y="42" font-size="7.5" fill="#334155">Voltage Transient Hazard</text>
    </g>
  </g>

  <!-- Bottom Takeaway Callout Card -->
  <g transform="translate(20, 408)">
    <rect width="800" height="56" rx="5" fill="#f8fafc" stroke="#93c5fd" stroke-width="1"/>
    <rect width="800" height="18" rx="5" fill="#eff6ff"/>
    <rect y="14" width="800" height="4" fill="#eff6ff"/>
    <text x="14" y="13" font-size="8" font-weight="700" fill="#1F407A" letter-spacing="0.4">TRANSIENT dI/dt GRID PROTECTION PRINCIPLE</text>
    <text x="14" y="32" font-size="8.5" fill="#334155">
      Simultaneous un-throttled startup of tens of thousands of accelerator chips creates extreme rates of current change (dI/dt).
    </text>
    <text x="14" y="46" font-size="8.5" fill="#475569">
      Without phased startup sequencing and battery buffer smoothing, multi-megawatt transients trip substation protection relays and cause local voltage sag.
    </text>
  </g>
</svg>