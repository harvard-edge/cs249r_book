<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Top Header Banner Pill -->
  <rect x="195.0" y="18" width="610" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500.0" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.2px">AI COMPUTE GROWTH DRIVERS · MULTI-AXIS EXPONENTIAL DEMAND</text>
  <rect x="40" y="65" width="280" height="125" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="55" y="78" width="110" height="22" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="110" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af" letter-spacing="0.8px">AXIS 1: SCALE</text>
  <text x="55" y="122" font-size="13" font-weight="700" fill="#1e40af">Model Parameters (N)</text>
  <text x="55" y="142" font-size="11" fill="#475569">• 7B → 70B → 405B+ parameters</text>
  <text x="55" y="160" font-size="11" fill="#475569">• Attention heads, MLP width, MoE experts</text>
  <text x="55" y="178" font-size="10" font-weight="600" fill="#2563eb">FLOPs / token: 2N (infer) • 6N (train)</text>
  <rect x="40" y="200" width="280" height="125" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="55" y="213" width="110" height="22" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="110" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6" letter-spacing="0.8px">AXIS 2: TOKENS</text>
  <text x="55" y="257" font-size="13" font-weight="700" fill="#5b21b6">Pretraining Tokens (D)</text>
  <text x="55" y="277" font-size="11" fill="#475569">• 1T → 15T+ token training corpora</text>
  <text x="55" y="295" font-size="11" fill="#475569">• Synthetic data &amp; RLHF rollout tokens</text>
  <text x="55" y="313" font-size="10" font-weight="600" fill="#7c3aed">Chinchilla ratio &amp; overtraining regime</text>
  <rect x="40" y="335" width="280" height="125" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="55" y="348" width="110" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="110" y="363" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e" letter-spacing="0.8px">AXIS 3: VOLUME</text>
  <text x="55" y="392" font-size="13" font-weight="700" fill="#92400e">Serving Queries (V)</text>
  <text x="55" y="412" font-size="11" fill="#475569">• Millions of daily API query calls</text>
  <text x="55" y="430" font-size="11" fill="#475569">• Multi-turn autonomous agent loops</text>
  <text x="55" y="448" font-size="10" font-weight="600" fill="#b45309">Inference cumulative FLOPs &gt; Pretraining</text>
  <path d="M 320 127 L 345 127 L 345 200 L 370 200" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M 320 262 L 345 262 L 345 225 L 370 225" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M 320 397 L 345 397 L 345 310 L 370 310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <!-- Center: Total Computational Work Engine -->
  <rect x="370" y="65" width="310" height="395" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="385" y="78" width="165" height="26" rx="4" fill="#0f172a"/>
  <text x="467" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.8px">COMPUTE ENGINE</text>
  <text x="385" y="130" font-size="14" font-weight="700" fill="#0f172a">Total Computational Work</text>
  <text x="385" y="150" font-size="11" fill="#64748b">Theoretical FLOPs across lifecycle</text>
  <rect x="385" y="172" width="280" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="195" font-size="11" font-weight="700" fill="#1e40af">Pretraining FLOPs:</text>
  <text x="400" y="218" font-size="14" font-weight="700" fill="#0f172a">C_train ≈ 6 × N × D</text>
  <text x="400" y="240" font-size="10" fill="#64748b">E.g., 70B model × 15T tokens ≈ 6.3×10^24 FLOPs</text>
  <rect x="385" y="268" width="280" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="291" font-size="11" font-weight="700" fill="#92400e">Serving FLOPs:</text>
  <text x="400" y="314" font-size="13" font-weight="700" fill="#0f172a">C_infer ≈ 2 × N × T_tokens × V</text>
  <text x="400" y="336" font-size="10" fill="#64748b">Scales directly with total served query tokens</text>
  <rect x="385" y="365" width="280" height="80" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="400" y="388" font-size="11" font-weight="700" fill="#1e40af">Total Lifecycle FLOPs:</text>
  <text x="400" y="410" font-size="13" font-weight="700" fill="#2563eb">FLOPs_total = C_train + C_infer</text>
  <text x="400" y="430" font-size="10" fill="#64748b">Unified basis for energy accounting</text>
  <path d="M 680 262 L 720 262" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- Right: Systems & Infrastructure Footprint -->
  <rect x="720" y="65" width="240" height="395" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="735" y="78" width="130" height="26" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="800" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#166534" letter-spacing="0.8px">INFRASTRUCTURE</text>
  <text x="735" y="130" font-size="14" font-weight="700" fill="#166534">Physical Implications</text>
  <text x="735" y="150" font-size="11" fill="#64748b">Hardware scale &amp; footprint</text>
  <rect x="735" y="172" width="210" height="70" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="748" y="195" font-size="11" font-weight="700" fill="#0f172a">Cluster Size</text>
  <text x="748" y="213" font-size="12" font-weight="700" fill="#16a34a">10,000 – 100,000 GPUs</text>
  <text x="748" y="229" font-size="10" fill="#64748b">Scale-out optical networks</text>
  <rect x="735" y="252" width="210" height="70" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="748" y="275" font-size="11" font-weight="700" fill="#0f172a">Energy Footprint</text>
  <text x="748" y="293" font-size="12" font-weight="700" fill="#16a34a">Joules = FLOPs / η_realized</text>
  <text x="748" y="309" font-size="10" fill="#64748b">Gigawatt-hour fleet scale</text>
  <rect x="735" y="332" width="210" height="113" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="748" y="355" font-size="11" font-weight="700" fill="#0f172a">Facility Power Envelope</text>
  <text x="748" y="373" font-size="12" font-weight="700" fill="#16a34a">50 MW – 500 MW+</text>
  <text x="748" y="391" font-size="10" fill="#64748b">Direct grid interconnection</text>
  <text x="748" y="407" font-size="10" fill="#64748b">Liquid-to-chip cooling</text>
  <text x="748" y="432" font-size="10" font-weight="600" fill="#16a34a">PUE × IT energy multiplier</text>
  <!-- Bottom Takeaway Card -->
  <rect x="40" y="485" width="920" height="115" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="498" width="165" height="24" rx="4" fill="#0f172a"/>
  <text x="137" y="514" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.8px">SCALING PERSPECTIVE</text>
  <text x="235" y="515" font-size="13" font-weight="700" fill="#0f172a">Demand Grows Multiplicatively Across Three Orthogonal Axes</text>
  <text x="55" y="542" font-size="11" fill="#475569">• Model size (N), token volume (D), and query traffic (V) multiply together, creating exponential growth in total operations.</text>
  <text x="55" y="560" font-size="11" fill="#475569">• Hardware efficiency improvements (FLOPs/Joule) must keep pace with this compounding product to prevent fleet energy escalation.</text>
  <text x="55" y="578" font-size="11" fill="#475569">• A compute-growth trend (FLOPs) cannot be equated to energy (Joules) without declaring the realized system efficiency (η) and facility boundary.</text>
</svg>