<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- LEFT: 3 ORTHOGONAL GROWTH AXES -->
  <g transform="translate(25, 20)">
    <rect width="215" height="320" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="215" height="28" rx="3" fill="#f8fafc"/>
    <text x="107" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Multi-Axis Demand Drivers</text>

    <!-- Axis 1: Parameters N -->
    <g transform="translate(10, 36)">
      <rect width="195" height="80" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#1F407A">Axis 1: Parameters (N)</text>
      <text x="10" y="34" font-size="8.5" fill="#1e3a8a">7B → 70B → 405B+ parameters</text>
      <text x="10" y="50" font-size="8" fill="#475569">• Attention heads, MLP width, MoE</text>
      <text x="10" y="68" font-size="8" font-weight="600" fill="#1F407A">FLOPs/token: 2N (infer) · 6N (train)</text>
    </g>

    <!-- Axis 2: Tokens D -->
    <g transform="translate(10, 126)">
      <rect width="195" height="80" rx="2" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#6d28d9">Axis 2: Training Tokens (D)</text>
      <text x="10" y="34" font-size="8.5" fill="#5b21b6">1T → 15T+ training corpus</text>
      <text x="10" y="50" font-size="8" fill="#475569">• Synthetic corpora &amp; RLHF rollouts</text>
      <text x="10" y="68" font-size="8" font-weight="600" fill="#6d28d9">Chinchilla &amp; overtraining regime</text>
    </g>

    <!-- Axis 3: Serving Queries V -->
    <g transform="translate(10, 216)">
      <rect width="195" height="88" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#b45309">Axis 3: Serving Volume (V)</text>
      <text x="10" y="34" font-size="8.5" fill="#78350f">Millions of daily requests</text>
      <text x="10" y="50" font-size="8" fill="#475569">• Multi-turn autonomous agent loops</text>
      <text x="10" y="66" font-size="8" fill="#475569">• Long context (128k+ windows)</text>
      <text x="10" y="80" font-size="7.5" font-weight="600" fill="#b45309">Cumulative infer FLOPs &gt; train</text>
    </g>
  </g>

  <!-- CONVERGENCE ARROWS INTO COMPUTE ENGINE -->
  <path d="M 240 76 H 265 V 105 H 280" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="240" y1="166" x2="280" y2="166" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <path d="M 240 260 H 265 V 230 H 280" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- CENTER: THEORETICAL COMPUTE ENGINE -->
  <g transform="translate(285, 20)">
    <rect width="215" height="320" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <rect width="215" height="28" rx="3" fill="#EAF1F8"/>
    <text x="107" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Computational Work (FLOPs)</text>

    <!-- Pretraining FLOPs -->
    <g transform="translate(10, 36)">
      <rect width="195" height="75" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Pretraining FLOPs:</text>
      <text x="10" y="36" font-size="10" font-weight="700" fill="#1F407A">C_train ≈ 6 × N × D</text>
      <text x="10" y="54" font-size="8" fill="#64748b">E.g., 70B × 15T tokens ≈ 6.3×10²⁴ FLOPs</text>
    </g>

    <!-- Serving FLOPs -->
    <g transform="translate(10, 121)">
      <rect width="195" height="75" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Serving FLOPs:</text>
      <text x="10" y="36" font-size="10" font-weight="700" fill="#1F407A">C_infer ≈ 2 × N × T_tokens × V</text>
      <text x="10" y="54" font-size="8" fill="#64748b">Scales directly with served query volume</text>
    </g>

    <!-- Total Lifecycle FLOPs -->
    <g transform="translate(10, 206)">
      <rect width="195" height="98" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#1F407A">Total Lifecycle FLOPs:</text>
      <text x="10" y="38" font-size="10" font-weight="700" fill="#1e3a8a">FLOPs_total = C_train + C_infer</text>
      <text x="10" y="60" font-size="8" fill="#334155">Multiplicative compounding across all</text>
      <text x="10" y="74" font-size="8" fill="#334155">three axes drives exponential</text>
      <text x="10" y="88" font-size="8" fill="#334155">aggregate operational demand.</text>
    </g>
  </g>

  <!-- ARROW CENTER -> RIGHT -->
  <line x1="500" y1="180" x2="525" y2="180" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- RIGHT: PHYSICAL INFRASTRUCTURE SCALE -->
  <g transform="translate(530, 20)">
    <rect width="205" height="320" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect width="205" height="28" rx="3" fill="#dcfce7"/>
    <text x="102" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Physical Infrastructure Scale</text>

    <!-- Cluster Size -->
    <g transform="translate(10, 36)">
      <rect width="185" height="80" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#15803d">Cluster Accelerator Size</text>
      <text x="10" y="36" font-size="12" font-weight="700" fill="#166534">10,000 – 100,000 GPUs</text>
      <text x="10" y="54" font-size="8" fill="#475569">Scale-out optical spine fabrics</text>
      <text x="10" y="68" font-size="8" fill="#64748b">Partitioning &amp; rail-optimized topologies</text>
    </g>

    <!-- Energy Footprint -->
    <g transform="translate(10, 126)">
      <rect width="185" height="80" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#15803d">Fleet Energy Footprint</text>
      <text x="10" y="36" font-size="10" font-weight="700" fill="#166534">Joules = FLOPs / η_realized</text>
      <text x="10" y="54" font-size="8" fill="#475569">Gigawatt-hour fleet consumption</text>
      <text x="10" y="68" font-size="8" fill="#64748b">Converts compute into utility draw</text>
    </g>

    <!-- Facility Power Envelope -->
    <g transform="translate(10, 216)">
      <rect width="185" height="88" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#15803d">Facility Power Envelope</text>
      <text x="10" y="36" font-size="12" font-weight="700" fill="#166534">50 MW – 500 MW+</text>
      <text x="10" y="54" font-size="8" fill="#475569">High-voltage substation feeds</text>
      <text x="10" y="68" font-size="8" fill="#475569">Direct-to-chip liquid cooling</text>
      <text x="10" y="80" font-size="7.5" fill="#15803d">Multiplied by facility PUE</text>
    </g>
  </g>
</svg>
