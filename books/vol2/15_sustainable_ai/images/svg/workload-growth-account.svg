<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- LEFT: 3 DEMAND AXES (width 230) -->
  <g transform="translate(25, 15)">
    <rect width="230" height="320" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="230" height="26" rx="3" fill="#f8fafc"/>
    <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Multi-Axis Demand Drivers</text>

    <!-- Axis 1: Parameters N -->
    <g transform="translate(10, 34)">
      <rect width="210" height="82" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1F407A">Axis 1: Parameters (N)</text>
      <text x="10" y="34" font-size="8" fill="#1e3a8a">7B → 70B → 405B+ parameters</text>
      <text x="10" y="50" font-size="7.5" fill="#475569">• Attention heads, MLP width, MoE</text>
      <text x="10" y="68" font-size="7.5" font-weight="600" fill="#1F407A">FLOPs/token: 2N (infer) · 6N (train)</text>
    </g>

    <!-- Axis 2: Tokens D -->
    <g transform="translate(10, 124)">
      <rect width="210" height="82" rx="2" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#6d28d9">Axis 2: Training Tokens (D)</text>
      <text x="10" y="34" font-size="8" fill="#5b21b6">1T → 15T+ training corpus</text>
      <text x="10" y="50" font-size="7.5" fill="#475569">• Synthetic corpora &amp; RLHF rollouts</text>
      <text x="10" y="68" font-size="7.5" font-weight="600" fill="#6d28d9">Chinchilla &amp; overtraining regime</text>
    </g>

    <!-- Axis 3: Serving Queries V -->
    <g transform="translate(10, 214)">
      <rect width="210" height="86" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#b45309">Axis 3: Serving Volume (V)</text>
      <text x="10" y="34" font-size="8" fill="#78350f">Millions of daily requests</text>
      <text x="10" y="50" font-size="7.5" fill="#475569">• Multi-turn autonomous agent loops</text>
      <text x="10" y="64" font-size="7.5" fill="#475569">• Long context (128k+ windows)</text>
      <text x="10" y="78" font-size="7.5" font-weight="600" fill="#b45309">Cumulative infer FLOPs &gt; train</text>
    </g>
  </g>

  <!-- CONVERGENCE ARROWS INTO COMPUTE ENGINE -->
  <path d="M 255 75 H 272 V 105 H 285" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="255" y1="165" x2="285" y2="165" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <path d="M 255 257 H 272 V 225 H 285" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- CENTER: THEORETICAL COMPUTE (width 230) -->
  <g transform="translate(285, 15)">
    <rect width="230" height="320" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <rect width="230" height="26" rx="3" fill="#EAF1F8"/>
    <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Computational Work (FLOPs)</text>

    <!-- Pretraining FLOPs -->
    <g transform="translate(10, 34)">
      <rect width="210" height="75" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Pretraining FLOPs:</text>
      <text x="10" y="36" font-size="9.5" font-weight="700" fill="#1F407A">C_train ≈ 6 × N × D</text>
      <text x="10" y="54" font-size="7.5" fill="#64748b">E.g., 70B × 15T tokens ≈ 6.3×10²⁴ FLOPs</text>
    </g>

    <!-- Serving FLOPs -->
    <g transform="translate(10, 117)">
      <rect width="210" height="75" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Serving FLOPs:</text>
      <text x="10" y="36" font-size="9.5" font-weight="700" fill="#1F407A">C_infer ≈ 2 × N × T_tokens × V</text>
      <text x="10" y="54" font-size="7.5" fill="#64748b">Scales directly with query volume</text>
    </g>

    <!-- Total Lifecycle FLOPs -->
    <g transform="translate(10, 200)">
      <rect width="210" height="104" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1F407A">Total Lifecycle FLOPs:</text>
      <text x="10" y="36" font-size="9.5" font-weight="700" fill="#1e3a8a">FLOPs_total = C_train + C_infer</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">Multiplicative compounding across all</text>
      <text x="10" y="70" font-size="7.5" fill="#334155">three axes drives exponential</text>
      <text x="10" y="82" font-size="7.5" fill="#334155">aggregate operational demand.</text>
    </g>
  </g>

  <!-- ARROW CENTER -> RIGHT -->
  <line x1="515" y1="175" x2="545" y2="175" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- RIGHT: PHYSICAL INFRASTRUCTURE (width 230) -->
  <g transform="translate(545, 15)">
    <rect width="230" height="320" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect width="230" height="26" rx="3" fill="#dcfce7"/>
    <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Physical Infrastructure Scale</text>

    <!-- Cluster Size -->
    <g transform="translate(10, 34)">
      <rect width="210" height="82" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#15803d">Cluster Accelerator Size</text>
      <text x="10" y="36" font-size="11" font-weight="700" fill="#166534">10,000 – 100,000 GPUs</text>
      <text x="10" y="52" font-size="7.5" fill="#475569">Scale-out optical spine fabrics</text>
      <text x="10" y="66" font-size="7.5" fill="#64748b">Partitioning &amp; rail-optimized topologies</text>
    </g>

    <!-- Energy Footprint -->
    <g transform="translate(10, 124)">
      <rect width="210" height="82" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#15803d">Fleet Energy Footprint</text>
      <text x="10" y="36" font-size="9" font-weight="700" fill="#166534">Joules = FLOPs / η_realized</text>
      <text x="10" y="52" font-size="7.5" fill="#475569">Gigawatt-hour fleet consumption</text>
      <text x="10" y="66" font-size="7.5" fill="#64748b">Converts compute into utility draw</text>
    </g>

    <!-- Facility Power Envelope -->
    <g transform="translate(10, 214)">
      <rect width="210" height="90" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#15803d">Facility Power Envelope</text>
      <text x="10" y="36" font-size="11" font-weight="700" fill="#166534">50 MW – 500 MW+</text>
      <text x="10" y="52" font-size="7.5" fill="#475569">High-voltage substation feeds</text>
      <text x="10" y="66" font-size="7.5" fill="#475569">Direct-to-chip liquid cooling</text>
      <text x="10" y="78" font-size="7.5" fill="#15803d">Multiplied by facility PUE</text>
    </g>
  </g>
</svg>
