<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- TOP HEADER / LEGEND BAR -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="900" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="14" y="10" width="180" height="22" rx="2" fill="#e0f2fe"/>
    <text x="104" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">HARDWARE MARKET TRAJECTORY</text>

    <!-- Legend Items -->
    <g transform="translate(560, 14)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">
      <rect x="0" y="2" width="14" height="10" rx="1.5" fill="#94a3b8"/>
      <text x="20" y="11" fill="#475569" font-weight="600">2017 Baseline</text>

      <rect x="110" y="2" width="14" height="10" rx="1.5" fill="#0284c7"/>
      <text x="130" y="11" fill="#0369a1" font-weight="700">2025 Projected</text>

      <line x1="225" y1="7" x2="255" y2="7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="262" y="11" fill="#15803d" font-weight="600">Growth Delta</text>
    </g>
  </g>

  <!-- PANEL 1: Data Center Market (Left Panel: x=30, y=75, width=440, height=295) -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="440" height="295" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Subtitle chip -->
    <rect x="16" y="14" width="220" height="24" rx="2" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
    <text x="126" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">Data Center Total Market ($ Billion)</text>

    <!-- Axis Area: y=50 to y=230 (height 180). Max value: $12B -->
    <!-- Gridlines: 0, 3, 6, 9, 12 -->
    <g stroke="#e2e8f0" stroke-width="0.8">
      <line x1="50" y1="230" x2="410" y2="230"/>
      <line x1="50" y1="185" x2="410" y2="185"/>
      <line x1="50" y1="140" x2="410" y2="140"/>
      <line x1="50" y1="95" x2="410" y2="95"/>
      <line x1="50" y1="50" x2="410" y2="50"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="end">
      <text x="44" y="233">$0B</text>
      <text x="44" y="188">$3B</text>
      <text x="44" y="143">$6B</text>
      <text x="44" y="98">$9B</text>
      <text x="44" y="53">$12B</text>
    </g>

    <!-- Section A: Inference (x center ~140) -->
    <!-- 2017: $4.5B -> height = (4.5/12)*180 = 67.5 -> y = 162.5 -->
    <rect x="95" y="162.5" width="40" height="67.5" rx="3" fill="#94a3b8"/>
    <text x="115" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">$4.5B</text>
    <text x="115" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">2017</text>

    <!-- 2025: $9.5B -> height = (9.5/12)*180 = 142.5 -> y = 87.5 -->
    <rect x="145" y="87.5" width="40" height="142.5" rx="3" fill="#0284c7"/>
    <text x="165" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">$9.5B</text>
    <text x="165" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0284c7" text-anchor="middle">2025*</text>

    <!-- Growth tag -->
    <path d="M 115 162.5 L 115 87.5 L 140 87.5" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,2"/>
    <rect x="118" y="116" width="42" height="15" rx="2" fill="#dcfce7"/>
    <text x="139" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">+111%</text>

    <text x="140" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">INFERENCE</text>

    <!-- Section B: Training (x center ~310) -->
    <!-- 2017: $0.8B -> height = (0.8/12)*180 = 12 -> y = 218 -->
    <rect x="265" y="218" width="40" height="12" rx="2" fill="#94a3b8"/>
    <text x="285" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">&lt;$1B</text>
    <text x="285" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">2017</text>

    <!-- 2025: $4.5B -> height = (4.5/12)*180 = 67.5 -> y = 162.5 -->
    <rect x="315" y="162.5" width="40" height="67.5" rx="3" fill="#6366f1"/>
    <text x="335" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#4338ca" text-anchor="middle">$4.5B</text>
    <text x="335" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#6366f1" text-anchor="middle">2025*</text>

    <text x="310" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">TRAINING</text>

    <!-- Panel footnote -->
    <text x="220" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Data Center inference reaches 2× data center training volume</text>
  </g>

  <!-- PANEL 2: Edge Market (Right Panel: x=490, y=75, width=440, height=295) -->
  <g transform="translate(490, 75)">
    <rect x="0" y="0" width="440" height="295" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Subtitle chip -->
    <rect x="16" y="14" width="220" height="24" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="126" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Edge Total Market ($ Billion)</text>

    <!-- Axis Area: y=50 to y=230 (height 180). Max value: $6B -->
    <!-- Gridlines: 0, 1.5, 3.0, 4.5, 6.0 -->
    <g stroke="#e2e8f0" stroke-width="0.8">
      <line x1="50" y1="230" x2="410" y2="230"/>
      <line x1="50" y1="185" x2="410" y2="185"/>
      <line x1="50" y1="140" x2="410" y2="140"/>
      <line x1="50" y1="95" x2="410" y2="95"/>
      <line x1="50" y1="50" x2="410" y2="50"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="end">
      <text x="44" y="233">$0.0B</text>
      <text x="44" y="188">$1.5B</text>
      <text x="44" y="143">$3.0B</text>
      <text x="44" y="98">$4.5B</text>
      <text x="44" y="53">$6.0B</text>
    </g>

    <!-- Section A: Inference (x center ~140) -->
    <!-- 2017: $0.05B -> height = (0.05/6)*180 = 1.5 -> y = 228.5 -->
    <rect x="95" y="227" width="40" height="3" rx="1" fill="#94a3b8"/>
    <text x="115" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">&lt;$0.1B</text>
    <text x="115" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">2017</text>

    <!-- 2025: $4.25B -> height = (4.25/6)*180 = 127.5 -> y = 102.5 -->
    <rect x="145" y="102.5" width="40" height="127.5" rx="3" fill="#10b981"/>
    <text x="165" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">$4.25B</text>
    <text x="165" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#10b981" text-anchor="middle">2025*</text>

    <!-- Explosive tag -->
    <rect x="115" y="60" width="80" height="16" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <text x="155" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">NEW SEGMENT (~40×)</text>

    <text x="140" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">INFERENCE</text>

    <!-- Section B: Training (x center ~310) -->
    <!-- 2017: $0.05B -> height = (0.05/6)*180 = 1.5 -> y = 228.5 -->
    <rect x="265" y="227" width="40" height="3" rx="1" fill="#94a3b8"/>
    <text x="285" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">&lt;$0.1B</text>
    <text x="285" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">2017</text>

    <!-- 2025: $1.25B -> height = (1.25/6)*180 = 37.5 -> y = 192.5 -->
    <rect x="315" y="192.5" width="40" height="37.5" rx="3" fill="#f59e0b"/>
    <text x="335" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">$1.25B</text>
    <text x="335" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#f59e0b" text-anchor="middle">2025*</text>

    <text x="310" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">TRAINING</text>

    <!-- Panel footnote -->
    <text x="220" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Edge inference emerges as a massive independent market category</text>
  </g>

  <!-- BOTTOM TAKEAWAY BANNER: x=30, y=385, width=900, height=60 -->
  <g transform="translate(30, 385)">
    <rect x="0" y="0" width="900" height="60" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <rect x="14" y="10" width="130" height="20" rx="2" fill="#e0f2fe"/>
    <text x="79" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">SYSTEMS TAKEAWAYS</text>

    <g transform="translate(160, 12)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">
      <text x="0" y="12" font-weight="700" fill="#0f172a">1. Inference Inversion:</text>
      <text x="110" y="12" fill="#475569">While training hardware dominates early capex headlines, operational inference market volume overtakes training by &gt;2×.</text>
      
      <text x="0" y="28" font-weight="700" fill="#0f172a">2. Edge Growth Dominance:</text>
      <text x="135" y="28" fill="#475569">Edge inference expands from negligible market share in 2017 to rival the entire cloud training market by 2025.</text>
    </g>
  </g>
</svg>
