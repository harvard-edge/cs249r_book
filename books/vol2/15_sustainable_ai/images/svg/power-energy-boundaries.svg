<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#1F407A"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- TIER 1: POWER DOMAIN (width 750, usable 720) -->
  <g transform="translate(25, 15)">
    <rect width="750" height="135" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
    <rect width="750" height="26" rx="3" fill="#fef2f2"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#b91c1c">(a) Power Domain — Instantaneous Rate Limit &amp; Concurrency Envelope (MW / kW)</text>

    <!-- Step 1: Substation Feed (width 218) -->
    <g transform="translate(15, 36)">
      <rect width="218" height="85" rx="2" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">Utility Grid Feed P_grid</text>
      <text x="10" y="34" font-size="8" fill="#475569">• Substation capacity (e.g. 50 MW)</text>
      <text x="10" y="48" font-size="8" fill="#475569">• High-voltage interconnection</text>
      <text x="10" y="68" font-size="7.5" font-weight="600" fill="#b91c1c">Cannot exceed instantaneously</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="233" y1="78" x2="260" y2="78" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <!-- Step 2: Facility Power Envelope -->
    <g transform="translate(265, 36)">
      <rect width="218" height="85" rx="2" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">Facility Power Envelope</text>
      <text x="10" y="34" font-size="8" fill="#475569">• Transformer &amp; PDU ratings</text>
      <text x="10" y="48" font-size="8" fill="#475569">• P_facility = P_IT + P_cooling</text>
      <text x="10" y="68" font-size="7.5" font-weight="600" fill="#b91c1c">Chiller capacity caps thermal load</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="483" y1="78" x2="510" y2="78" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <!-- Step 3: Active Fleet Capacity -->
    <g transform="translate(515, 36)">
      <rect width="220" height="85" rx="2" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">Active Accelerator Capacity</text>
      <text x="10" y="34" font-size="8" fill="#475569">• N_active ≤ P_IT_budget / P_server</text>
      <text x="10" y="48" font-size="8" fill="#475569">• E.g., 20,000 GPUs @ 1 kW each</text>
      <text x="10" y="68" font-size="7.5" font-weight="600" fill="#b91c1c">Rate limit caps parallel scaling</text>
    </g>
  </g>

  <!-- TRANSITION: TIME INTEGRATION BAR -->
  <g transform="translate(250, 160)">
    <rect width="300" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="150" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Time Integration: E = ∫ P(t) dt</text>
  </g>

  <!-- TIER 2: ENERGY DOMAIN -->
  <g transform="translate(25, 195)">
    <rect width="750" height="140" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
    <rect width="750" height="26" rx="3" fill="#eff6ff"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#1F407A">(b) Energy Domain — Cumulative Consumption Over Full Duration (MWh / GJ)</text>

    <!-- Factor 1: Average Power -->
    <g transform="translate(15, 36)">
      <rect width="218" height="90" rx="2" fill="#f0f9ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#1F407A">Average Measured Power</text>
      <text x="10" y="34" font-size="8" fill="#475569">P_avg (in kW or MW)</text>
      <text x="10" y="50" font-size="7.5" fill="#64748b">• Telemetry sampling over run</text>
      <text x="10" y="64" font-size="7.5" fill="#64748b">• Accounts for dynamic idle stalls</text>
      <text x="10" y="78" font-size="7.5" fill="#64748b">• Excludes facility unless specified</text>
    </g>

    <!-- Operator x -->
    <text x="243" y="86" font-size="16" font-weight="700" fill="#1F407A">×</text>

    <!-- Factor 2: Elapsed Duration -->
    <g transform="translate(265, 36)">
      <rect width="218" height="90" rx="2" fill="#f0f9ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#1F407A">Total Elapsed Duration</text>
      <text x="10" y="34" font-size="8" fill="#475569">T_run (in Hours or Days)</text>
      <text x="10" y="50" font-size="7.5" fill="#64748b">• Wall-clock execution time</text>
      <text x="10" y="64" font-size="7.5" fill="#64748b">• Includes straggler recovery</text>
      <text x="10" y="78" font-size="7.5" fill="#64748b">• E.g., 21 days for 100B pretraining</text>
    </g>

    <!-- Operator = -->
    <line x1="483" y1="81" x2="510" y2="81" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Result: Accumulated Run Energy -->
    <g transform="translate(515, 36)">
      <rect width="220" height="90" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#15803d">Accumulated Run Energy</text>
      <text x="10" y="34" font-size="8.5" font-weight="700" fill="#166534">E_run = P_avg × T_run (MWh)</text>
      <text x="10" y="50" font-size="7.5" fill="#334155">• Total electricity consumed</text>
      <text x="10" y="64" font-size="7.5" fill="#334155">• Baseline for Scope 2 carbon</text>
      <text x="10" y="78" font-size="7.5" font-weight="600" fill="#15803d">Direct driver of datacenter bills</text>
    </g>
  </g>
</svg>
