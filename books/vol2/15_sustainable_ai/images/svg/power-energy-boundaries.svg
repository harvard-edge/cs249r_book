<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="560" height="232" fill="#fff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- ===== (a) Power: instantaneous cap ===== -->
  <text x="20" y="22" font-size="11" font-weight="700" fill="#0f172a">(a) Power: an instantaneous cap (MW)</text>

  <rect x="20" y="34" width="150" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="95" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Grid connection</text>
  <text x="95" y="73" text-anchor="middle" font-size="10.5" fill="#334155">P<tspan baseline-shift="sub" font-size="9.3">grid</tspan></text>

  <rect x="205" y="34" width="150" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="280" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Facility envelope</text>
  <text x="280" y="73" text-anchor="middle" font-size="10.5" fill="#b91c1c">P<tspan baseline-shift="sub" font-size="9.3">facility</tspan> ≤ P<tspan baseline-shift="sub" font-size="9.3">grid</tspan></text>

  <rect x="390" y="34" width="150" height="52" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="465" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Active fleet</text>
  <text x="465" y="73" text-anchor="middle" font-size="10.5" fill="#b91c1c">N ≤ P<tspan baseline-shift="sub" font-size="9.3">IT</tspan> / P<tspan baseline-shift="sub" font-size="9.3">server</tspan></text>

  <line x1="170" y1="60" x2="203" y2="60" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="355" y1="60" x2="388" y2="60" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== link: integrate over time ===== -->
  <line x1="20" y1="114" x2="200" y2="114" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="360" y1="114" x2="540" y2="114" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <rect x="210" y="102" width="140" height="24" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="280" y="118" text-anchor="middle" font-size="10.5" fill="#334155">E = ∫ P(t) dt</text>

  <!-- ===== (b) Energy: power integrated over time ===== -->
  <text x="20" y="152" font-size="11" font-weight="700" fill="#0f172a">(b) Energy: power integrated over run time (MWh)</text>

  <rect x="20" y="164" width="150" height="52" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="95" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Average power</text>
  <text x="95" y="203" text-anchor="middle" font-size="10.5" fill="#334155">P<tspan baseline-shift="sub" font-size="9.3">avg</tspan> (measured)</text>

  <rect x="205" y="164" width="150" height="52" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="280" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Run duration</text>
  <text x="280" y="203" text-anchor="middle" font-size="10.5" fill="#334155">T<tspan baseline-shift="sub" font-size="9.3">run</tspan> (wall clock)</text>

  <rect x="390" y="164" width="150" height="52" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.8"/>
  <text x="465" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Run energy</text>
  <text x="465" y="203" text-anchor="middle" font-size="10.5" fill="#14294E">E<tspan baseline-shift="sub" font-size="9.3">run</tspan> = P<tspan baseline-shift="sub" font-size="9.3">avg</tspan> × T<tspan baseline-shift="sub" font-size="9.3">run</tspan></text>

  <text x="187.5" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">×</text>
  <line x1="355" y1="190" x2="388" y2="190" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
</svg>
