<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Top Row: Power Rate Limits (Red -> Red -> Blue) -->
  <rect x="30" y="25" width="175" height="60" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="117.5" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Grid power</text>

  <path d="M205 55 L255 55" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="255" y="25" width="175" height="60" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="342.5" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Facility envelope</text>

  <path d="M430 55 L480 55" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="480" y="25" width="175" height="60" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="567.5" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Active fleet</text>

  <!-- Center Relationship Pill -->
  <rect x="150" y="122" width="380" height="26" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="340" y="139" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569" letter-spacing="0.4">POWER CONSTRAINS RATE · ENERGY ACCUMULATES OVER TIME</text>

  <!-- Bottom Row: Energy Accounting (Blue * Blue = Blue) -->
  <rect x="30" y="190" width="175" height="60" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="117.5" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Measured power</text>

  <text x="230" y="227" text-anchor="middle" font-size="20" font-weight="600" fill="#64748b">×</text>

  <rect x="255" y="190" width="175" height="60" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="342.5" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Run duration</text>

  <path d="M430 220 L480 220" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="480" y="190" width="175" height="60" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="567.5" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Run energy</text>
</svg>
