<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="270" fill="#fff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== (a) Power: instantaneous cap ===== -->
  <text x="30" y="26" font-size="13" font-weight="700" fill="#0f172a">(a) Power: an instantaneous cap (MW)</text>

  <rect x="30" y="40" width="180" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="120" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Grid connection</text>
  <text x="120" y="84" text-anchor="middle" font-size="12" fill="#334155">P<tspan baseline-shift="sub" font-size="10">grid</tspan></text>

  <rect x="250" y="40" width="180" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Facility envelope</text>
  <text x="340" y="84" text-anchor="middle" font-size="12" fill="#CB202D">P<tspan baseline-shift="sub" font-size="10">facility</tspan> ≤ P<tspan baseline-shift="sub" font-size="10">grid</tspan></text>

  <rect x="470" y="40" width="180" height="60" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="560" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Active fleet</text>
  <text x="560" y="84" text-anchor="middle" font-size="12" fill="#CB202D">N ≤ P<tspan baseline-shift="sub" font-size="10">IT</tspan> / P<tspan baseline-shift="sub" font-size="10">server</tspan></text>

  <line x1="210" y1="70" x2="248" y2="70" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="430" y1="70" x2="468" y2="70" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== link: integrate over time ===== -->
  <line x1="30" y1="134" x2="250" y2="134" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="430" y1="134" x2="650" y2="134" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <rect x="260" y="120" width="160" height="28" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="340" y="139" text-anchor="middle" font-size="12" fill="#334155">E<tspan baseline-shift="sub" font-size="10">run</tspan> = ∫ P<tspan baseline-shift="sub" font-size="10">facility</tspan>(t) dt</text>

  <!-- ===== (b) Energy: power integrated over time ===== -->
  <text x="30" y="176" font-size="13" font-weight="700" fill="#0f172a">(b) Energy: power integrated over run time (MWh)</text>

  <rect x="30" y="190" width="180" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="120" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Average power</text>
  <text x="120" y="234" text-anchor="middle" font-size="12" fill="#334155">P<tspan baseline-shift="sub" font-size="10">avg</tspan> (measured)</text>

  <rect x="250" y="190" width="180" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Run duration</text>
  <text x="340" y="234" text-anchor="middle" font-size="12" fill="#334155">T<tspan baseline-shift="sub" font-size="10">run</tspan> (wall clock)</text>

  <rect x="470" y="190" width="180" height="60" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="560" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Run energy</text>
  <text x="560" y="234" text-anchor="middle" font-size="12" fill="#334155">E<tspan baseline-shift="sub" font-size="10">run</tspan> (MWh)</text>

  <text x="230" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">×</text>
  <text x="450" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">=</text>
</svg>
