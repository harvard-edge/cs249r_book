<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Top Header Banner Pill -->
  <rect x="180.0" y="18" width="640" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500.0" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.2px">ENERGY SYSTEMS ACCOUNTING · INSTANTANEOUS POWER VS. ACCUMULATED ENERGY</text>
  <!-- Upper Container: Instantaneous Power Domain -->
  <rect x="40" y="65" width="920" height="215" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="55" y="78" width="185" height="26" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="147" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b" letter-spacing="0.8px">POWER DOMAIN (MW / kW)</text>
  <text x="255" y="96" font-size="14" font-weight="700" fill="#991b1b">Instantaneous Rate Limit &amp; Concurrency Envelope</text>
  <rect x="55" y="118" width="260" height="142" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <rect x="68" y="130" width="115" height="20" rx="3" fill="#fee2e2"/>
  <text x="125" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">SUBSTATION FEED</text>
  <text x="68" y="168" font-size="13" font-weight="700" fill="#0f172a">Utility Grid Power P_grid</text>
  <text x="68" y="188" font-size="11" fill="#475569">• Substation capacity (e.g. 50 MW)</text>
  <text x="68" y="206" font-size="11" fill="#475569">• Interconnection contract limit</text>
  <text x="68" y="224" font-size="11" fill="#475569">• High-voltage step-down feed</text>
  <text x="68" y="246" font-size="10" font-weight="600" fill="#b91c1c">Cannot be exceeded instantaneously</text>
  <path d="M 315 189 L 365 189" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="365" y="118" width="270" height="142" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <rect x="378" y="130" width="125" height="20" rx="3" fill="#fee2e2"/>
  <text x="440" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">THERMAL &amp; PDU</text>
  <text x="378" y="168" font-size="13" font-weight="700" fill="#0f172a">Facility Power Envelope</text>
  <text x="378" y="188" font-size="11" fill="#475569">• Transformer &amp; breaker ratings</text>
  <text x="378" y="206" font-size="11" fill="#475569">• Chiller &amp; cooling heat rejection</text>
  <text x="378" y="224" font-size="11" fill="#475569">• P_facility = P_IT + P_cooling</text>
  <text x="378" y="246" font-size="10" font-weight="600" fill="#b91c1c">Thermal runaway if heat &gt; chillers</text>
  <path d="M 635 189 L 685 189" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="685" y="118" width="260" height="142" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <rect x="698" y="130" width="120" height="20" rx="3" fill="#fee2e2"/>
  <text x="758" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">CLUSTER LIMIT</text>
  <text x="698" y="168" font-size="13" font-weight="700" fill="#0f172a">Active Fleet Capacity</text>
  <text x="698" y="188" font-size="11" fill="#475569">• N_active ≤ P_IT_budget / P_server</text>
  <text x="698" y="206" font-size="11" fill="#475569">• Caps concurrent accelerators</text>
  <text x="698" y="224" font-size="11" fill="#475569">• E.g., 20,000 GPUs @ 1 kW each</text>
  <text x="698" y="246" font-size="10" font-weight="600" fill="#b91c1c">Rate limit caps parallel scaling</text>
  <rect x="360" y="290" width="280" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="500" y="306" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" letter-spacing="1px">TIME INTEGRATION: E = ∫ P(t) dt</text>
  <!-- Lower Container: Accumulated Energy Domain -->
  <rect x="40" y="324" width="920" height="200" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="55" y="337" width="185" height="26" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="147" y="354" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.8px">ENERGY DOMAIN (MWh / GJ)</text>
  <text x="255" y="355" font-size="14" font-weight="700" fill="#1e40af">Cumulative Consumption Over Full Duration</text>
  <rect x="55" y="375" width="260" height="128" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="68" y="398" font-size="13" font-weight="700" fill="#0f172a">Average Measured Power</text>
  <text x="68" y="416" font-size="11" font-weight="600" fill="#2563eb">P_avg (in kW or MW)</text>
  <text x="68" y="438" font-size="11" fill="#475569">• Continuous telemetry sampling</text>
  <text x="68" y="456" font-size="11" fill="#475569">• Accounts for dynamic workload idle</text>
  <text x="68" y="474" font-size="11" fill="#475569">• Excludes facility unless specified</text>
  <text x="340" y="445" text-anchor="middle" font-size="22" font-weight="700" fill="#2563eb">×</text>
  <rect x="365" y="375" width="270" height="128" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="378" y="398" font-size="13" font-weight="700" fill="#0f172a">Total Elapsed Run Duration</text>
  <text x="378" y="416" font-size="11" font-weight="600" fill="#2563eb">T_run (in Hours or Days)</text>
  <text x="378" y="438" font-size="11" fill="#475569">• Wall-clock execution time</text>
  <text x="378" y="456" font-size="11" fill="#475569">• Includes checkpoint &amp; straggler stalls</text>
  <text x="378" y="474" font-size="11" fill="#475569">• E.g., 21 days for 100B pretraining</text>
  <path d="M 635 440 L 685 440" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="685" y="375" width="260" height="128" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="698" y="398" font-size="13" font-weight="700" fill="#0f172a">Accumulated Run Energy</text>
  <text x="698" y="416" font-size="11" font-weight="700" fill="#16a34a">E_run = P_avg × T_run (MWh)</text>
  <text x="698" y="438" font-size="11" fill="#475569">• Total electricity purchased</text>
  <text x="698" y="456" font-size="11" fill="#475569">• Scope 2 carbon basis</text>
  <text x="698" y="474" font-size="10" font-weight="600" fill="#16a34a">Direct driver of energy bills &amp; GHG</text>
  <!-- Bottom Takeaway Card -->
  <rect x="40" y="534" width="920" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="546" width="165" height="24" rx="4" fill="#0f172a"/>
  <text x="137" y="562" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.8px">CORE SYSTEM IDENTITY</text>
  <text x="235" y="561" font-size="12" font-weight="700" fill="#0f172a">Do Not Confuse Instantaneous Capacity (MW) with Cumulative Work (MWh)</text>
  <text x="235" y="579" font-size="11" fill="#475569">Power sets the ceiling on how many chips can run concurrently without tripping electrical or thermal breakers.</text>
  <text x="235" y="595" font-size="11" fill="#475569">Energy measures total work completed over time. Comparing a single training run to annual power plant generation is invalid.</text>
</svg>