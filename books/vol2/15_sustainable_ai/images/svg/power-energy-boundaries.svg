<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 760 346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="-8" width="760" height="346" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ================= (a) Power: an instantaneous cap ================= -->
  <text x="30" y="26" font-size="14" font-weight="700" fill="#0f172a">(a) Power: a cap at every instant</text>

  <!-- axis -->
  <line x1="60" y1="280" x2="60" y2="62" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <line x1="60" y1="280" x2="310" y2="280" stroke="#64748b" stroke-width="1"/>
  <text x="48" y="172" font-size="12" fill="#334155" text-anchor="middle" transform="rotate(-90 48 172)">power</text>
  <text x="180" y="300" font-size="12" fill="#334155" text-anchor="middle">one instant</text>

  <g transform="translate(40,0)">
  <!-- facility overhead -->
  <rect x="90" y="250" width="100" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="140" y="269" font-size="12" fill="#334155" text-anchor="middle">overhead</text>

  <!-- seven server slabs: P_IT -->
  <g fill="#FCE4CC" stroke="#E67817" stroke-width="1">
    <rect x="90" y="228" width="100" height="22"/>
    <rect x="90" y="206" width="100" height="22"/>
    <rect x="90" y="184" width="100" height="22"/>
    <rect x="90" y="162" width="100" height="22"/>
    <rect x="90" y="140" width="100" height="22"/>
    <rect x="90" y="118" width="100" height="22"/>
    <rect x="90" y="96" width="100" height="22"/>
  </g>
  <text x="140" y="243" font-size="12" fill="#7c3d0c" text-anchor="middle">server 1</text>
  <text x="140" y="199" font-size="12" fill="#7c3d0c" text-anchor="middle">⋮</text>
  <text x="140" y="111" font-size="12" fill="#7c3d0c" text-anchor="middle">server N</text>

  <!-- one more server does not fit -->
  <rect x="90" y="72" width="100" height="22" fill="none" stroke="#CB202D" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="198" y="79" font-size="12" fill="#CB202D">N + 1</text>

  <!-- braces on the right -->
  <path d="M198,96 h6 v154 h-6" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="212" y="170" font-size="13" fill="#0f172a">P<tspan baseline-shift="sub" font-size="12.5">IT</tspan></text>
  <path d="M236,96 h6 v184 h-6" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="248" y="194" font-size="13" fill="#0f172a">P<tspan baseline-shift="sub" font-size="12.5">facility</tspan></text>
  <path d="M86,206 h-6 v22 h6" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="76" y="221" font-size="12" fill="#334155" text-anchor="end">P<tspan baseline-shift="sub" font-size="12">server</tspan></text>

  </g>
  <!-- grid ceiling -->
  <line x1="60" y1="86" x2="310" y2="86" stroke="#CB202D" stroke-width="2"/>
  <text x="308" y="76" font-size="13" font-weight="700" fill="#CB202D" text-anchor="end">P<tspan baseline-shift="sub" font-size="12.5">grid</tspan></text>

  <!-- divider -->
  <line x1="360" y1="40" x2="360" y2="300" stroke="#e2e8f0" stroke-width="1"/>

  <g transform="translate(40,0)">
  <!-- ================= (b) Energy: area under power over time ================= -->
  <text x="350" y="26" font-size="14" font-weight="700" fill="#0f172a">(b) Energy: area under power</text>

  <!-- axes -->
  <line x1="370" y1="280" x2="370" y2="62" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <line x1="370" y1="280" x2="692" y2="280" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="358" y="172" font-size="12" fill="#334155" text-anchor="middle" transform="rotate(-90 358 172)">power</text>
  <text x="690" y="300" font-size="12" fill="#334155" text-anchor="end">time</text>

  <!-- same ceiling, faint: never crossed -->
  <line x1="370" y1="84" x2="680" y2="84" stroke="#CB202D" stroke-width="1" stroke-dasharray="5,4" opacity="0.7"/>
  <text x="680" y="76" font-size="12" fill="#CB202D" text-anchor="end">same cap</text>

  <!-- power trace with shaded energy -->
  <path d="M400,280 L400,150 C420,140 432,128 448,134 C466,142 478,160 496,152 C516,142 528,118 548,126 C568,134 578,158 598,150 C616,142 628,128 646,138 L646,280 Z"
        fill="#FCE4CC" stroke="none"/>
  <path d="M400,280 L400,150 C420,140 432,128 448,134 C466,142 478,160 496,152 C516,142 528,118 548,126 C568,134 578,158 598,150 C616,142 628,128 646,138 L646,280"
        fill="none" stroke="#E67817" stroke-width="2"/>

  <!-- P_avg -->
  <line x1="400" y1="142" x2="646" y2="142" stroke="#334155" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="652" y="146" font-size="13" fill="#0f172a">P<tspan baseline-shift="sub" font-size="12.5">avg</tspan></text>

  <!-- area label -->
  <text x="523" y="208" font-size="16" font-weight="700" fill="#7c3d0c" text-anchor="middle">E<tspan baseline-shift="sub" font-size="12">total</tspan></text>
  <text x="523" y="230" font-size="12.5" fill="#7c3d0c" text-anchor="middle">= ∫ P(t) dt = P<tspan baseline-shift="sub" font-size="12.5">avg</tspan> × T<tspan baseline-shift="sub" font-size="12.5">job</tspan></text>

  <!-- T_job bracket -->
  <path d="M400,290 v6 h246 v-6" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="523" y="314" font-size="13" fill="#0f172a" text-anchor="middle">T<tspan baseline-shift="sub" font-size="12.5">job</tspan></text>
  </g>
</svg>
