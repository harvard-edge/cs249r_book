<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="560" height="272" fill="#fff"/>
  <!-- ===== Environmental justice ===== -->
  <rect x="20" y="20" width="250" height="106" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="34" y="44" font-size="11.5" font-weight="700" fill="#0f172a">Environmental justice</text>
  <text x="34" y="62" font-size="10.5" font-style="italic" fill="#334155">Who bears the local burden?</text>
  <line x1="34" y1="74" x2="256" y2="74" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="34" y="88" width="68" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="68.0" y="103" text-anchor="middle" font-size="10" fill="#334155">water draw</text>
  <rect x="110" y="88" width="73" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="146.5" y="103" text-anchor="middle" font-size="10" fill="#334155">grid strain</text>
  <rect x="191" y="88" width="46" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="214.0" y="103" text-anchor="middle" font-size="10" fill="#334155">siting</text>
  <!-- ===== Intergenerational equity ===== -->
  <rect x="290" y="20" width="250" height="106" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="304" y="44" font-size="11.5" font-weight="700" fill="#0f172a">Intergenerational equity</text>
  <text x="304" y="62" font-size="10.5" font-style="italic" fill="#334155">What do later generations inherit?</text>
  <line x1="304" y1="74" x2="526" y2="74" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="304" y="88" width="90" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="349.0" y="103" text-anchor="middle" font-size="10" fill="#334155">cumulative CO₂</text>
  <rect x="402" y="88" width="106" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="455.0" y="103" text-anchor="middle" font-size="10" fill="#334155">long-lived assets</text>
  <!-- ===== Resource competition ===== -->
  <rect x="20" y="146" width="250" height="106" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="34" y="170" font-size="11.5" font-weight="700" fill="#0f172a">Resource competition</text>
  <text x="34" y="188" font-size="10.5" font-style="italic" fill="#334155">What else needs these resources?</text>
  <line x1="34" y1="200" x2="256" y2="200" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="34" y="214" width="41" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="54.5" y="229" text-anchor="middle" font-size="10" fill="#334155">water</text>
  <rect x="83" y="214" width="36" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="101.0" y="229" text-anchor="middle" font-size="10" fill="#334155">land</text>
  <rect x="127" y="214" width="41" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="147.5" y="229" text-anchor="middle" font-size="10" fill="#334155">power</text>
  <rect x="176" y="214" width="57" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="204.5" y="229" text-anchor="middle" font-size="10" fill="#334155">minerals</text>
  <!-- ===== Transparency gap ===== -->
  <rect x="290" y="146" width="250" height="106" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="304" y="170" font-size="11.5" font-weight="700" fill="#0f172a">Transparency gap</text>
  <text x="304" y="188" font-size="10.5" font-style="italic" fill="#334155">What remains undisclosed?</text>
  <line x1="304" y1="200" x2="526" y2="200" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="304" y="214" width="46" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="327.0" y="229" text-anchor="middle" font-size="10" fill="#334155">energy</text>
  <rect x="358" y="214" width="46" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="381.0" y="229" text-anchor="middle" font-size="10" fill="#334155">carbon</text>
  <rect x="412" y="214" width="41" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="432.5" y="229" text-anchor="middle" font-size="10" fill="#334155">water</text>
  <rect x="461" y="214" width="63" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="492.5" y="229" text-anchor="middle" font-size="10" fill="#334155">per model</text>
</svg>
