<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="740" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr-tel" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#006395"/>
    </marker>
  </defs>
  <!-- Three concern groups stand on the transparency layer: their burdens can be
       assessed only with the per-model ledgers the transparency gap leaves undisclosed. -->

  <!-- ===== Environmental justice ===== -->
  <rect x="20" y="20" width="223" height="140" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="131.5" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Environmental justice</text>
  <text x="131.5" y="74" text-anchor="middle" font-size="13" font-style="italic" fill="#334155">Who bears the local burden?</text>
  <line x1="56" y1="96" x2="207" y2="96" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="131.5" y="122" text-anchor="middle" font-size="13" fill="#334155">water withdrawal</text>
  <text x="131.5" y="141" text-anchor="middle" font-size="13" fill="#334155">grid strain</text>

  <!-- ===== Intergenerational equity ===== -->
  <rect x="258.5" y="20" width="223" height="140" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="370" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Intergenerational equity</text>
  <text x="370" y="74" text-anchor="middle" font-size="13" font-style="italic" fill="#334155">What do later generations inherit?</text>
  <line x1="294.5" y1="96" x2="445.5" y2="96" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="370" y="122" text-anchor="middle" font-size="13" fill="#334155">CO₂ persistence</text>
  <text x="370" y="141" text-anchor="middle" font-size="13" fill="#334155">long-lived infrastructure</text>

  <!-- ===== Resource competition ===== -->
  <rect x="497" y="20" width="223" height="140" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="608.5" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Resource competition</text>
  <text x="608.5" y="74" text-anchor="middle" font-size="13" font-style="italic" fill="#334155">What else needs these resources?</text>
  <line x1="533" y1="96" x2="684" y2="96" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="608.5" y="122" text-anchor="middle" font-size="13" fill="#334155">agricultural, municipal claims</text>
  <text x="608.5" y="141" text-anchor="middle" font-size="13" fill="#334155">land · water · minerals</text>

  <!-- ===== Telemetry lifts the ledgers up to each concern ===== -->
  <g stroke="#006395" stroke-width="1.5" fill="none">
    <line x1="131.5" y1="214" x2="131.5" y2="163" marker-end="url(#arr-tel)"/>
    <line x1="370" y1="214" x2="370" y2="163" marker-end="url(#arr-tel)"/>
    <line x1="608.5" y1="214" x2="608.5" y2="163" marker-end="url(#arr-tel)"/>
  </g>
  <text x="250.75" y="193" text-anchor="middle" font-size="13" fill="#00476b">assessed with telemetry</text>

  <!-- ===== Transparency gap: the measurement layer engineering addresses most directly ===== -->
  <rect x="20" y="214" width="700" height="96" rx="4" fill="#eaf3fa" stroke="#006395" stroke-width="1.8"/>
  <text x="44" y="252" font-size="15" font-weight="700" fill="#0f172a">Transparency gap</text>
  <text x="44" y="274" font-size="13" font-style="italic" fill="#334155">What remains undisclosed?</text>
  <text x="44" y="292" font-size="13" fill="#00476b">engineering acts here</text>

  <!-- per-model ledger: three columns, cells dashed because the entries are undisclosed -->
  <text x="476" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#00476b">per-model ledger</text>
  <g font-size="13" text-anchor="middle" fill="#0f172a" font-weight="700">
    <text x="361" y="262">energy</text>
    <text x="476" y="262">carbon</text>
    <text x="591" y="262">water</text>
  </g>
  <line x1="306" y1="268" x2="646" y2="268" stroke="#006395" stroke-width="1"/>
  <g fill="#ffffff" stroke="#006395" stroke-width="1" stroke-dasharray="4 3">
    <rect x="310" y="276" width="102" height="20" rx="2"/>
    <rect x="425" y="276" width="102" height="20" rx="2"/>
    <rect x="540" y="276" width="102" height="20" rx="2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#00476b" font-style="italic">
    <text x="361" y="290.5">undisclosed</text>
    <text x="476" y="290.5">undisclosed</text>
    <text x="591" y="290.5">undisclosed</text>
  </g>
</svg>
