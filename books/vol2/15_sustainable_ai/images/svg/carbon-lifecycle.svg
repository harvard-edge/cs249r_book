<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <rect width="680" height="440" fill="#fff"/>
  <defs><marker id="arrow-cl" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>
  <!-- Equal-height columns: relative sizes are workload-specific, so no shares are drawn -->
