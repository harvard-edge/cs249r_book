  <rect x="52.5" y="272" width="140" height="20" rx="1" fill="#fff" stroke="#D97706" stroke-width="0.8"/>
  <text x="122.5" y="286" text-anchor="middle" font-size="8.5" font-weight="600" fill="#555">Supply Chain</text>
