  <text x="340.5" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Training</text>
  <text x="340.5" y="58" text-anchor="middle" font-size="9.5" fill="#555">Operational Carbon</text>
  <line x1="433.0" y1="48" x2="465.0" y2="48" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-cl)"/>
  <rect x="258.0" y="90" width="165" height="220" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="265.5" y="102" width="150" height="20" rx="1" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="340.5" y="116" text-anchor="middle" font-size="8.5" fill="#1F407A" font-style="italic">GPT-3: 1,287 MWh ≈ 552 t CO₂</text>
  <text x="340.5" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1F407A">C<tspan font-size="9" dy="3">training</tspan></text>
  <rect x="270.5" y="194" width="140" height="20" rx="1" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="340.5" y="208" text-anchor="middle" font-size="8.5" font-weight="600" fill="#555">Compute × PUE × Time</text>
  <rect x="270.5" y="220" width="140" height="20" rx="1" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="340.5" y="234" text-anchor="middle" font-size="8.5" font-weight="600" fill="#555">Grid Carbon Intensity</text>
  <rect x="270.5" y="246" width="140" height="20" rx="1" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="340.5" y="260" text-anchor="middle" font-size="8.5" font-weight="600" fill="#555">Gradient Sync Overhead</text>
  <rect x="270.5" y="272" width="140" height="20" rx="1" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="340.5" y="286" text-anchor="middle" font-size="8.5" font-weight="600" fill="#555">Checkpoint I/O</text>
  <rect x="466.0" y="22" width="185" height="52" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="558.5" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Inference</text>
  <text x="558.5" y="58" text-anchor="middle" font-size="9.5" fill="#555">Operational Carbon</text>
  <rect x="476.0" y="90" width="165" height="220" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <rect x="483.5" y="102" width="150" height="20" rx="1" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="558.5" y="116" text-anchor="middle" font-size="8.5" fill="#1F407A" font-style="italic">Scales with deployment</text>
  <text x="558.5" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1F407A">C<tspan font-size="9" dy="3">inference</tspan></text>
  <rect x="488.5" y="220" width="140" height="20" rx="1" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="558.5" y="234" text-anchor="middle" font-size="8.5" font-weight="600" fill="#555">Requests × Energy/req</text>
  <rect x="488.5" y="246" width="140" height="20" rx="1" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="558.5" y="260" text-anchor="middle" font-size="8.5" font-weight="600" fill="#555">Grid Carbon Intensity</text>
  <rect x="488.5" y="272" width="140" height="20" rx="1" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="558.5" y="286" text-anchor="middle" font-size="8.5" font-weight="600" fill="#555">KV Cache Memory</text>
  <rect x="30" y="326" width="621" height="52" rx="2" fill="#fff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340.5" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#333">Lifecycle Carbon Equation</text>
  <text x="340.5" y="360" text-anchor="middle" font-size="9.5" fill="#555">Total CO₂ = embodied CO₂ + training energy × PUE × grid CI</text>
  <text x="340.5" y="372" text-anchor="middle" font-size="9.5" fill="#555">+ request count × energy/request × grid CI</text>
  <rect x="30" y="388" width="621" height="44" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="44" y="406" font-size="9.5" fill="#333"><tspan font-weight="700">Key insight:</tspan> on clean grids (hydro, nuclear), embodied carbon can exceed operational carbon</text>
  <text x="44" y="421" font-size="9.5" fill="#333">over the hardware lifetime, so longevity and utilization become first-order levers alongside energy source.</text>
</svg>
