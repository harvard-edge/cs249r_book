<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <!-- ===== Manufacturing ===== -->
  <rect x="25" y="20" width="190" height="50" rx="3" fill="#E3D3C8"/>
  <rect x="25" y="66" width="190" height="4" fill="#E3D3C8"/>
  <rect x="25" y="20" width="190" height="210" rx="3" fill="none" stroke="#78492A" stroke-width="1.5"/>
  <line x1="25" y1="70" x2="215" y2="70" stroke="#78492A" stroke-width="0.8"/>
  <text x="120" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Manufacturing</text>
  <text x="120" y="60" text-anchor="middle" font-size="12" fill="#555">CO<tspan baseline-shift="sub" font-size="10">2,embodied</tspan></text>
  <rect x="35" y="84" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="120" y="102" text-anchor="middle" font-size="12" fill="#333">Chip fabrication</text>
  <rect x="35" y="120" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="120" y="138" text-anchor="middle" font-size="12" fill="#333">Server assembly</text>
  <rect x="35" y="156" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="120" y="174" text-anchor="middle" font-size="12" fill="#333">Rare earth mining</text>
  <rect x="35" y="192" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="120" y="210" text-anchor="middle" font-size="12" fill="#333">Supply chain</text>
  <!-- ===== Training ===== -->
  <rect x="245" y="20" width="190" height="50" rx="3" fill="#FCE4CC"/>
  <rect x="245" y="66" width="190" height="4" fill="#FCE4CC"/>
  <rect x="245" y="20" width="190" height="210" rx="3" fill="none" stroke="#E67817" stroke-width="1.5"/>
  <line x1="245" y1="70" x2="435" y2="70" stroke="#E67817" stroke-width="0.8"/>
  <text x="340" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Training</text>
  <text x="340" y="60" text-anchor="middle" font-size="12" fill="#555">CO<tspan baseline-shift="sub" font-size="10">2,training</tspan></text>
  <rect x="255" y="84" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="340" y="102" text-anchor="middle" font-size="12" fill="#333">Compute × PUE × time</text>
  <rect x="255" y="120" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="340" y="138" text-anchor="middle" font-size="12" fill="#333">Grid carbon intensity</text>
  <rect x="255" y="156" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="340" y="174" text-anchor="middle" font-size="12" fill="#333">Gradient sync overhead</text>
  <rect x="255" y="192" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="340" y="210" text-anchor="middle" font-size="12" fill="#333">Checkpoint I/O</text>
  <!-- ===== Inference ===== -->
  <rect x="465" y="20" width="190" height="50" rx="3" fill="#FCE4CC"/>
  <rect x="465" y="66" width="190" height="4" fill="#FCE4CC"/>
  <rect x="465" y="20" width="190" height="210" rx="3" fill="none" stroke="#E67817" stroke-width="1.5"/>
  <line x1="465" y1="70" x2="655" y2="70" stroke="#E67817" stroke-width="0.8"/>
  <text x="560" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Inference</text>
  <text x="560" y="60" text-anchor="middle" font-size="12" fill="#555">CO<tspan baseline-shift="sub" font-size="10">2,inference</tspan></text>
  <rect x="475" y="84" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="560" y="102" text-anchor="middle" font-size="12" fill="#333">Requests × energy/request</text>
  <rect x="475" y="120" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="560" y="138" text-anchor="middle" font-size="12" fill="#333">Grid carbon intensity</text>
  <rect x="475" y="156" width="170" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="560" y="174" text-anchor="middle" font-size="12" fill="#333">KV cache memory</text>
  <line x1="215" y1="45" x2="243" y2="45" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="435" y1="45" x2="463" y2="45" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- ===== Lifecycle sum ===== -->
  <rect x="25" y="248" width="630" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="270" text-anchor="middle" font-size="13" fill="#333">CO<tspan baseline-shift="sub" font-size="10">2,lifecycle</tspan> = CO<tspan baseline-shift="sub" font-size="10">2,embodied</tspan> + CO<tspan baseline-shift="sub" font-size="10">2,training</tspan> + CO<tspan baseline-shift="sub" font-size="10">2,inference</tspan></text>
</svg>
