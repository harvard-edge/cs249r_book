<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="560" height="330" fill="#fff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <!-- ===== Manufacturing ===== -->
  <rect x="20" y="20" width="160" height="44" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="39" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Manufacturing</text>
  <text x="100" y="55" text-anchor="middle" font-size="10" fill="#334155">embodied carbon</text>
  <line x1="180" y1="42" x2="198" y2="42" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="20" y="76" width="160" height="196" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <rect x="28" y="86" width="144" height="22" rx="2" fill="#fff" stroke="#d97706" stroke-width="0.8"/>
  <text x="100" y="101" text-anchor="middle" font-size="9.5" font-style="italic" fill="#92400e">150–164 kg CO₂e per GPU</text>
  <text x="100" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">CO<tspan baseline-shift="sub" font-size="10.5">2,embodied</tspan></text>
  <rect x="30" y="162" width="140" height="22" rx="2" fill="#fff" stroke="#d97706" stroke-width="0.8"/>
  <text x="100" y="177" text-anchor="middle" font-size="10" fill="#334155">Chip fabrication</text>
  <rect x="30" y="188" width="140" height="22" rx="2" fill="#fff" stroke="#d97706" stroke-width="0.8"/>
  <text x="100" y="203" text-anchor="middle" font-size="10" fill="#334155">Server assembly</text>
  <rect x="30" y="214" width="140" height="22" rx="2" fill="#fff" stroke="#d97706" stroke-width="0.8"/>
  <text x="100" y="229" text-anchor="middle" font-size="10" fill="#334155">Rare earth mining</text>
  <rect x="30" y="240" width="140" height="22" rx="2" fill="#fff" stroke="#d97706" stroke-width="0.8"/>
  <text x="100" y="255" text-anchor="middle" font-size="10" fill="#334155">Supply chain</text>
  <!-- ===== Training ===== -->
  <rect x="200" y="20" width="160" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="280" y="39" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Training</text>
  <text x="280" y="55" text-anchor="middle" font-size="10" fill="#334155">operational carbon</text>
  <line x1="360" y1="42" x2="378" y2="42" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="200" y="76" width="160" height="196" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="208" y="86" width="144" height="22" rx="2" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="280" y="101" text-anchor="middle" font-size="9.5" font-style="italic" fill="#14294E">GPT-3: 1,287 MWh ≈ 552 t CO₂</text>
  <text x="280" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#14294E">CO<tspan baseline-shift="sub" font-size="10.5">2,training</tspan></text>
  <rect x="210" y="162" width="140" height="22" rx="2" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="280" y="177" text-anchor="middle" font-size="10" fill="#334155">Compute × PUE × time</text>
  <rect x="210" y="188" width="140" height="22" rx="2" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="280" y="203" text-anchor="middle" font-size="10" fill="#334155">Grid carbon intensity</text>
  <rect x="210" y="214" width="140" height="22" rx="2" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="280" y="229" text-anchor="middle" font-size="10" fill="#334155">Gradient sync overhead</text>
  <rect x="210" y="240" width="140" height="22" rx="2" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="280" y="255" text-anchor="middle" font-size="10" fill="#334155">Checkpoint I/O</text>
  <!-- ===== Inference ===== -->
  <rect x="380" y="20" width="160" height="44" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="460" y="39" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Inference</text>
  <text x="460" y="55" text-anchor="middle" font-size="10" fill="#334155">operational carbon</text>
  <rect x="380" y="76" width="160" height="196" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <rect x="388" y="86" width="144" height="22" rx="2" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="460" y="101" text-anchor="middle" font-size="9.5" font-style="italic" fill="#14294E">Scales with deployment</text>
  <text x="460" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#14294E">CO<tspan baseline-shift="sub" font-size="10.5">2,inference</tspan></text>
  <rect x="390" y="162" width="140" height="22" rx="2" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="460" y="177" text-anchor="middle" font-size="10" fill="#334155">Requests × energy/request</text>
  <rect x="390" y="188" width="140" height="22" rx="2" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="460" y="203" text-anchor="middle" font-size="10" fill="#334155">Grid carbon intensity</text>
  <rect x="390" y="214" width="140" height="22" rx="2" fill="#fff" stroke="#1F407A" stroke-width="0.8"/>
  <text x="460" y="229" text-anchor="middle" font-size="10" fill="#334155">KV cache memory</text>
  <!-- ===== Lifecycle sum ===== -->
  <rect x="20" y="286" width="520" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#0f172a">CO<tspan baseline-shift="sub" font-size="9.5">2,lifecycle</tspan> = CO<tspan baseline-shift="sub" font-size="9.5">2,embodied</tspan> + CO<tspan baseline-shift="sub" font-size="9.5">2,training</tspan> + CO<tspan baseline-shift="sub" font-size="9.5">2,inference</tspan></text>
</svg>
