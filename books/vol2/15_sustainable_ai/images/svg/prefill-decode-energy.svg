<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430">
  <rect width="680" height="430" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Section divider at x=340 -->
  <line x1="340" y1="18" x2="340" y2="415" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1"/>

  <!-- ===== LEFT PANEL: Prefill Phase ===== -->
  <!-- Panel header -->
  <rect x="20" y="18" width="300" height="38" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="170" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Prefill Phase</text>
  <text x="170" y="49" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1F407A">COMPUTE-BOUND · HIGH ARITHMETIC INTENSITY</text>

  <!-- GPU utilization bar background -->
  <rect x="40" y="75" width="260" height="30" rx="3" fill="#F8FAFC" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Active compute bar: ~90% -->
  <rect x="40" y="75" width="234" height="30" rx="3" fill="#1F407A"/>
  <!-- Labels -->
  <text x="157" y="94" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">~90% Active Compute</text>
  <text x="170" y="122" text-anchor="middle" font-size="8.5" font-weight="600" fill="#64748b">GPU Utilization</text>

  <!-- Energy breakdown bars -->
  <text x="40" y="148" font-size="9.5" font-weight="700" fill="#334155">Energy per Token (Relative)</text>

  <!-- Useful compute energy -->
  <rect x="40" y="158" width="234" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="157" y="173" text-anchor="middle" font-size="8.5" font-weight="700" fill="#14294E">Compute Energy (Dominant)</text>

  <!-- Small idle/memory energy -->
  <rect x="40" y="186" width="26" height="22" rx="2" fill="#FEE2E2" stroke="#f87171" stroke-width="1"/>
  <line x1="66" y1="197" x2="76" y2="197" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="80" y="201" font-size="8.5" fill="#64748b">Memory overhead</text>

  <!-- Arithmetic intensity annotation -->
  <rect x="40" y="226" width="260" height="52" rx="3" fill="#DCFCE7" stroke="#86efac" stroke-width="1"/>
  <text x="170" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">High Arithmetic Intensity</text>
  <text x="170" y="258" text-anchor="middle" font-size="8.5" fill="#166534">Thousands of MACs per byte read</text>
  <text x="170" y="270" text-anchor="middle" font-size="8.5" fill="#166534">from HBM → near-peak pJ/FLOP efficiency</text>

  <!-- Energy/token annotation -->
  <rect x="68" y="294" width="204" height="38" rx="4" fill="#1F407A"/>
  <text x="170" y="311" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Energy / Token: LOW</text>
  <text x="170" y="325" text-anchor="middle" font-size="8.5" fill="#EAF1F8">~1× baseline reference (highly amortized)</text>

  <!-- Use case example -->
  <rect x="40" y="348" width="260" height="62" rx="3" fill="#F8FAFC" stroke="#cbd5e1" stroke-width="1"/>
  <text x="170" y="366" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">Example: Processing prompt tokens</text>
  <text x="170" y="380" text-anchor="middle" font-size="8.5" fill="#64748b">All prompt tokens processed in parallel batch pass</text>
  <text x="170" y="393" text-anchor="middle" font-size="8.5" fill="#64748b">Full weight matrix reused across entire prompt length</text>
  <text x="170" y="405" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803d">→ Tensor cores fully saturated</text>

  <!-- ===== RIGHT PANEL: Decode Phase ===== -->
  <!-- Panel header -->
  <rect x="360" y="18" width="300" height="38" rx="4" fill="#FEE2E2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="510" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Decode Phase</text>
  <text x="510" y="49" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b91c1c">BANDWIDTH-BOUND · LOW ARITHMETIC INTENSITY</text>

  <!-- GPU utilization bar background -->
  <rect x="380" y="75" width="260" height="30" rx="3" fill="#F8FAFC" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Active compute bar: ~10% -->
  <rect x="380" y="75" width="26" height="30" rx="3" fill="#1F407A"/>
  <!-- Idle bar: ~90% -->
  <rect x="406" y="75" width="234" height="30" rx="3" fill="#FEE2E2"/>
  <!-- Labels -->
  <text x="523" y="94" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">~90% Idle (waiting on HBM transfers)</text>
  <text x="510" y="122" text-anchor="middle" font-size="8.5" font-weight="600" fill="#64748b">GPU Utilization</text>

  <!-- Energy breakdown bars -->
  <text x="380" y="148" font-size="9.5" font-weight="700" fill="#334155">Energy per Token (Relative)</text>

  <!-- Wasted static power: large red bar -->
  <rect x="380" y="158" width="234" height="22" rx="2" fill="#FEE2E2" stroke="#f87171" stroke-width="1"/>
  <text x="497" y="173" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">Static Leakage &amp; Clock Power (Wasted)</text>

  <!-- Small useful compute -->
  <rect x="380" y="186" width="26" height="22" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <line x1="406" y1="197" x2="416" y2="197" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="420" y="201" font-size="8.5" fill="#64748b">Useful compute</text>

  <!-- Arithmetic intensity annotation -->
  <rect x="380" y="226" width="260" height="52" rx="3" fill="#FEE2E2" stroke="#fca5a5" stroke-width="1"/>
  <text x="510" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">Low Arithmetic Intensity</text>
  <text x="510" y="258" text-anchor="middle" font-size="8.5" fill="#991b1b">Entire model weights re-read from HBM</text>
  <text x="510" y="270" text-anchor="middle" font-size="8.5" fill="#991b1b">to generate a single auto-regressive token</text>

  <!-- Energy/token annotation -->
  <rect x="408" y="294" width="204" height="38" rx="4" fill="#b91c1c"/>
  <text x="510" y="311" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Energy / Token: HIGH</text>
  <text x="510" y="325" text-anchor="middle" font-size="8.5" fill="#fee2e2">10–50× prefill energy (memory-bound)</text>

  <!-- Use case example -->
  <rect x="380" y="348" width="260" height="62" rx="3" fill="#F8FAFC" stroke="#cbd5e1" stroke-width="1"/>
  <text x="510" y="366" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">Example: Generating output tokens</text>
  <text x="510" y="380" text-anchor="middle" font-size="8.5" fill="#64748b">1,000 generated tokens = 1,000 sequential passes</text>
  <text x="510" y="393" text-anchor="middle" font-size="8.5" fill="#64748b">Each token incurs full weight loading bandwidth</text>
  <text x="510" y="405" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b91c1c">→ Compute units stalled waiting for memory</text>
</svg>