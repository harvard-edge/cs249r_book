<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Top Header Banner Pill -->
  <rect x="185.0" y="18" width="630" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500.0" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.2px">FLEET ENERGY DEMAND · EFFICIENCY VS. VOLUME SCALING (JEVONS PARADOX)</text>
  <rect x="220" y="65" width="560" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Fleet Energy Accounting: E_fleet = ∑_c ( Energy per Job_c  ×  Completed Jobs_c )</text>
  <!-- Left Pillar: Efficiency Driver -->
  <rect x="40" y="125" width="280" height="340" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="55" y="140" width="115" height="26" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="112" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#166534" letter-spacing="0.8px">FACTOR 1 (↓)</text>
  <text x="55" y="188" font-size="14" font-weight="700" fill="#166534">Energy per Job</text>
  <text x="55" y="206" font-size="11" fill="#64748b">Algorithmic &amp; HW gains</text>
  <rect x="55" y="220" width="250" height="230" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="68" y="242" font-size="11" font-weight="700" fill="#0f172a">Efficiency Levers:</text>
  <text x="68" y="262" font-size="11" fill="#475569">• Quantization: FP16 → FP8/INT4</text>
  <text x="68" y="280" font-size="11" fill="#475569">• FlashAttention &amp; SRAM tiling</text>
  <text x="68" y="298" font-size="11" fill="#475569">• Speculative decoding</text>
  <text x="68" y="316" font-size="11" fill="#475569">• Domain ASICs (higher FLOP/J)</text>
  <text x="68" y="334" font-size="11" fill="#475569">• Distillation into small models</text>
  <rect x="68" y="360" width="224" height="75" rx="4" fill="#dcfce7"/>
  <text x="80" y="380" font-size="10" font-weight="700" fill="#166534">Per-Job Energy Falls:</text>
  <text x="80" y="398" font-size="11" font-weight="700" fill="#15803d">Joules / Token ↓ 30–50%</text>
  <text x="80" y="416" font-size="10" fill="#166534">Lowers marginal cost per query</text>
  <circle cx="347" cy="295" r="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="347" y="302" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">×</text>
  <!-- Center Pillar: Demand Driver -->
  <rect x="375" y="125" width="280" height="340" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="390" y="140" width="115" height="26" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="447" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6" letter-spacing="0.8px">FACTOR 2 (↑)</text>
  <text x="390" y="188" font-size="14" font-weight="700" fill="#5b21b6">Completed Jobs</text>
  <text x="390" y="206" font-size="11" fill="#64748b">Elastic demand surge</text>
  <rect x="390" y="220" width="250" height="230" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="403" y="242" font-size="11" font-weight="700" fill="#0f172a">Demand Drivers:</text>
  <text x="403" y="262" font-size="11" fill="#475569">• Surging user query volume</text>
  <text x="403" y="280" font-size="11" fill="#475569">• Multi-turn agent loop tokens</text>
  <text x="403" y="298" font-size="11" fill="#475569">• Long context (128k+ windows)</text>
  <text x="403" y="316" font-size="11" fill="#475569">• Higher deployment frequency</text>
  <text x="403" y="334" font-size="11" fill="#475569">• Unlocked new AI workloads</text>
  <rect x="403" y="360" width="224" height="75" rx="4" fill="#ede9fe"/>
  <text x="415" y="380" font-size="10" font-weight="700" fill="#5b21b6">Job Volume Explodes:</text>
  <text x="415" y="398" font-size="11" font-weight="700" fill="#6d28d9">Total Queries ↑ 3–10×</text>
  <text x="415" y="416" font-size="10" fill="#5b21b6">Jevons rebound effect triggered</text>
  <path d="M 655 295 L 695 295" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="675" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">=</text>
  <!-- Right Output Pillar: Total Fleet Energy -->
  <rect x="700" y="125" width="260" height="340" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="715" y="140" width="130" height="26" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="780" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.8px">NET RESULT</text>
  <text x="715" y="188" font-size="14" font-weight="700" fill="#1e40af">Total Fleet Energy</text>
  <text x="715" y="206" font-size="11" fill="#64748b">E_fleet in MWh / GWh</text>
  <rect x="715" y="220" width="230" height="230" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="728" y="242" font-size="11" font-weight="700" fill="#0f172a">Fleet Trajectory:</text>
  <rect x="728" y="255" width="204" height="85" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="738" y="275" font-size="11" font-weight="700" fill="#991b1b">Jevons Paradox Escalation</text>
  <text x="738" y="293" font-size="10" fill="#475569">If Demand Elasticity &gt; 1:</text>
  <text x="738" y="311" font-size="11" font-weight="700" fill="#dc2626">Net Fleet Energy RISES (↑)</text>
  <text x="738" y="327" font-size="10" fill="#64748b">despite major efficiency gains!</text>
  <rect x="728" y="350" width="204" height="85" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="738" y="370" font-size="11" font-weight="700" fill="#166534">Decoupled Scaling</text>
  <text x="738" y="388" font-size="10" fill="#475569">If Demand Elasticity ≤ 1:</text>
  <text x="738" y="406" font-size="11" font-weight="700" fill="#16a34a">Fleet Energy Stabilizes (→)</text>
  <text x="738" y="422" font-size="10" fill="#64748b">Only with saturated usage.</text>
  <!-- Bottom Takeaway Card -->
  <rect x="40" y="485" width="920" height="115" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="498" width="160" height="24" rx="4" fill="#0f172a"/>
  <text x="135" y="514" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.8px">JEVONS PARADOX IN AI</text>
  <text x="230" y="515" font-size="13" font-weight="700" fill="#1e293b">Why Efficiency Gains Alone Do Not Curtail Total Datacenter Consumption</text>
  <text x="55" y="542" font-size="11" fill="#475569">• A 2× improvement in hardware energy efficiency cuts the cost per token in half, stimulating greater application adoption.</text>
  <text x="55" y="560" font-size="11" fill="#475569">• If demand elasticity &gt; 1, total jobs completed grow faster than energy per job falls, driving aggregate fleet consumption upward.</text>
  <text x="55" y="578" font-size="11" font-weight="600" fill="#1e40af">• Rigorous sustainability accounting requires forecasting both terms across distinct workload classes (training, fine-tuning, serving).</text>
</svg>