<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 315" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 3 COLUMNS -->
  <!-- COLUMN 1: FACTOR 1 (width 220) -->
  <g transform="translate(35, 20)">
    <rect width="220" height="275" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="110" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Factor 1: Energy per Job (↓)</text>

    <g transform="translate(10, 36)">
      <rect width="200" height="150" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#166534">Algorithmic &amp; HW Levers:</text>
      <text x="10" y="36" font-size="8" fill="#334155">• Quantization: FP16 → FP8/INT4</text>
      <text x="10" y="52" font-size="8" fill="#334155">• FlashAttention &amp; SRAM tiling</text>
      <text x="10" y="68" font-size="8" fill="#334155">• Speculative decoding</text>
      <text x="10" y="84" font-size="8" fill="#334155">• Custom domain ASICs</text>
      <text x="10" y="100" font-size="8" fill="#334155">• Distillation into small models</text>
      <text x="10" y="124" font-size="8" font-weight="700" fill="#15803d">Energy per token falls</text>
      <text x="10" y="138" font-size="7.5" fill="#64748b">Lowers marginal cost per query</text>
    </g>

    <text x="15" y="206" font-size="8" font-weight="600" fill="#166534">Economic Consequence:</text>
    <text x="15" y="222" font-size="7.5" fill="#475569">Cheaper inference stimulates new</text>
    <text x="15" y="234" font-size="7.5" fill="#475569">deployment across software applications.</text>
  </g>

  <!-- OPERATOR × -->
  <text x="268" y="160" font-size="18" font-weight="700" fill="#64748b">×</text>

  <!-- COLUMN 2: FACTOR 2 (width 220) -->
  <g transform="translate(290, 20)">
    <rect width="220" height="275" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="110" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Factor 2: Completed Jobs (↑)</text>

    <g transform="translate(10, 36)">
      <rect width="200" height="150" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Elastic Demand Surge:</text>
      <text x="10" y="36" font-size="8" fill="#334155">• Surging user query volume</text>
      <text x="10" y="52" font-size="8" fill="#334155">• Multi-turn agent loops</text>
      <text x="10" y="68" font-size="8" fill="#334155">• Longer context windows</text>
      <text x="10" y="84" font-size="8" fill="#334155">• Higher deployment frequency</text>
      <text x="10" y="100" font-size="8" fill="#334155">• Unlocked real-time reasoning</text>
      <text x="10" y="124" font-size="8" font-weight="700" fill="#1F407A">Total query volume multiplies</text>
      <text x="10" y="138" font-size="7.5" fill="#64748b">High elasticity triggers rebound</text>
    </g>

    <text x="15" y="206" font-size="8" font-weight="600" fill="#334155">Jevons Paradox Mechanism:</text>
    <text x="15" y="222" font-size="7.5" fill="#475569">Demand growth outpaces hardware</text>
    <text x="15" y="234" font-size="7.5" fill="#475569">efficiency improvements.</text>
  </g>

  <!-- OPERATOR = -->
  <line x1="520" y1="155" x2="540" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>

  <!-- COLUMN 3: NET FLEET RESULT (width 220) -->
  <g transform="translate(545, 20)">
    <rect width="220" height="275" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="110" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Net Result: Total Fleet Energy</text>

    <!-- Case A: Jevons Rebound -->
    <g transform="translate(10, 36)">
      <rect width="200" height="95" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#b91c1c">Jevons Rebound (Elasticity &gt; 1)</text>
      <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• Query volume growth outstrips</text>
      <text x="10" y="46" font-size="7.5" fill="#7f1d1d">  hardware efficiency gains</text>
      <text x="10" y="66" font-size="8.5" font-weight="700" fill="#b91c1c">Net Fleet Energy RISES (↑)</text>
      <text x="10" y="80" font-size="7.5" fill="#991b1b">Despite major processor gains</text>
    </g>

    <!-- Case B: Saturated Scaling -->
    <g transform="translate(10, 145)">
      <rect width="200" height="95" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#15803d">Decoupled Scaling (Elasticity ≤ 1)</text>
      <text x="10" y="34" font-size="7.5" fill="#166534">• Workload volume plateaus</text>
      <text x="10" y="46" font-size="7.5" fill="#166534">  or reaches market saturation</text>
      <text x="10" y="66" font-size="8.5" font-weight="700" fill="#15803d">Net Fleet Energy Holds or Falls</text>
      <text x="10" y="80" font-size="7.5" fill="#166534">Efficiency lowers total energy</text>
    </g>
  </g>
</svg>
