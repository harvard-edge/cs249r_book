<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- TOP EQUATION BANNER -->
  <g transform="translate(130, 16)">
    <rect width="500" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="250" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Fleet Energy Demand: E_fleet = ∑_c ( Energy per Job_c × Completed Jobs_c )</text>
  </g>

  <!-- 3 COLUMNS -->
  <!-- COLUMN 1: FACTOR 1 (EFFICIENCY) -->
  <g transform="translate(30, 68)">
    <rect width="210" height="270" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect width="210" height="28" rx="3" fill="#dcfce7"/>
    <text x="105" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Factor 1: Energy per Job (↓)</text>

    <g transform="translate(12, 38)">
      <rect width="186" height="145" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#166534">Algorithmic &amp; HW Levers:</text>
      <text x="10" y="36" font-size="8.5" fill="#334155">• Quantization: FP16 → FP8/INT4</text>
      <text x="10" y="52" font-size="8.5" fill="#334155">• FlashAttention &amp; SRAM tiling</text>
      <text x="10" y="68" font-size="8.5" fill="#334155">• Speculative decoding</text>
      <text x="10" y="84" font-size="8.5" fill="#334155">• Custom domain ASICs</text>
      <text x="10" y="100" font-size="8.5" fill="#334155">• Distillation into small models</text>
      <text x="10" y="122" font-size="8.5" font-weight="700" fill="#15803d">Energy / token falls 30–50%</text>
      <text x="10" y="136" font-size="7.5" fill="#64748b">Lowers marginal cost per query</text>
    </g>

    <text x="15" y="202" font-size="8.5" fill="#166534"><tspan font-weight="600">Economic Effect:</tspan></text>
    <text x="15" y="218" font-size="8" fill="#475569">Cheaper inference stimulates</text>
    <text x="15" y="230" font-size="8" fill="#475569">new deployment across applications.</text>
  </g>

  <!-- OPERATOR × -->
  <text x="252" y="205" font-size="20" font-weight="700" fill="#64748b">×</text>

  <!-- COLUMN 2: FACTOR 2 (VOLUME) -->
  <g transform="translate(275, 68)">
    <rect width="210" height="270" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="210" height="28" rx="3" fill="#f1f5f9"/>
    <text x="105" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Factor 2: Completed Jobs (↑)</text>

    <g transform="translate(12, 38)">
      <rect width="186" height="145" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Elastic Demand Surge:</text>
      <text x="10" y="36" font-size="8.5" fill="#334155">• Surging user query volume</text>
      <text x="10" y="52" font-size="8.5" fill="#334155">• Autonomous multi-turn agent loops</text>
      <text x="10" y="68" font-size="8.5" fill="#334155">• Long context (128k+ windows)</text>
      <text x="10" y="84" font-size="8.5" fill="#334155">• Higher deployment frequency</text>
      <text x="10" y="100" font-size="8.5" fill="#334155">• Unlocked real-time reasoning</text>
      <text x="10" y="122" font-size="8.5" font-weight="700" fill="#1F407A">Total queries explode 3–10×</text>
      <text x="10" y="136" font-size="7.5" fill="#64748b">High demand elasticity triggers rebound</text>
    </g>

    <text x="15" y="202" font-size="8.5" fill="#334155"><tspan font-weight="600">Jevons Paradox:</tspan></text>
    <text x="15" y="218" font-size="8" fill="#475569">Demand growth outpaces</text>
    <text x="15" y="230" font-size="8" fill="#475569">hardware efficiency improvements.</text>
  </g>

  <!-- OPERATOR = -->
  <line x1="495" y1="200" x2="515" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>

  <!-- COLUMN 3: NET FLEET RESULT -->
  <g transform="translate(525, 68)">
    <rect width="205" height="270" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="205" height="28" rx="3" fill="#f8fafc"/>
    <text x="102" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Net Result: Total Fleet Energy</text>

    <!-- Case A: Jevons Rebound -->
    <g transform="translate(10, 38)">
      <rect width="185" height="95" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#b91c1c">Jevons Rebound (Elasticity &gt; 1)</text>
      <text x="10" y="34" font-size="8" fill="#7f1d1d">• Query volume growth outstrips</text>
      <text x="10" y="46" font-size="8" fill="#7f1d1d">  hardware efficiency gains</text>
      <text x="10" y="64" font-size="8.5" font-weight="700" fill="#b91c1c">Net Fleet Energy RISES (↑)</text>
      <text x="10" y="78" font-size="7.5" fill="#991b1b">Despite major compiler/chip efficiency</text>
    </g>

    <!-- Case B: Saturated Scaling -->
    <g transform="translate(10, 145)">
      <rect width="185" height="95" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#15803d">Decoupled Scaling (Elasticity ≤ 1)</text>
      <text x="10" y="34" font-size="8" fill="#166534">• Workload volume plateaus</text>
      <text x="10" y="46" font-size="8" fill="#166534">  or reaches market saturation</text>
      <text x="10" y="64" font-size="8.5" font-weight="700" fill="#15803d">Net Fleet Energy Stabilizes (→)</text>
      <text x="10" y="78" font-size="7.5" fill="#166534">Efficiency gains reduce total power</text>
    </g>
  </g>
</svg>
