<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Top Flow: Energy per job * Completed jobs -> Total energy -->
  <rect x="30" y="70" width="175" height="65" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="117.5" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Energy per job</text>

  <text x="232" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#64748b">×</text>

  <rect x="255" y="70" width="175" height="65" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="342.5" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Completed jobs</text>

  <path d="M430 102.5 L480 102.5" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="480" y="70" width="175" height="65" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="567.5" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Total energy</text>

  <!-- Bottom Drivers: Efficiency (Green) and Demand (Purple) -->
  <rect x="30" y="180" width="175" height="42" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="117.5" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Efficiency driver</text>
  <path d="M117.5 180 V135" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="255" y="180" width="175" height="42" rx="4" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="342.5" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#581c87">Workload demand</text>
  <path d="M342.5 180 V135" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
