<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 465">
  <rect width="680" height="465" fill="#ffffff"/>

  <!-- Gridlines -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="100" y1="305.6" x2="610" y2="305.6"/>  <!-- 100 -->
    <line x1="100" y1="271.1" x2="610" y2="271.1"/>  <!-- 200 -->
    <line x1="100" y1="236.7" x2="610" y2="236.7"/>  <!-- 300 -->
    <line x1="100" y1="202.2" x2="610" y2="202.2"/>  <!-- 400 -->
    <line x1="100" y1="167.8" x2="610" y2="167.8"/>  <!-- 500 -->
    <line x1="100" y1="133.3" x2="610" y2="133.3"/>  <!-- 600 -->
    <line x1="100" y1="98.9" x2="610" y2="98.9"/>    <!-- 700 -->
    <line x1="100" y1="64.4" x2="610" y2="64.4"/>    <!-- 800 -->
  </g>

  <!-- Axes -->
  <line x1="100" y1="340" x2="610" y2="340" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="100" y1="30" x2="100" y2="340" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Y-axis labels -->
  <g font-size="9" fill="#64748b" text-anchor="end">
    <text x="92" y="344">0</text>
    <text x="92" y="309">100</text>
    <text x="92" y="275">200</text>
    <text x="92" y="240">300</text>
    <text x="92" y="206">400</text>
    <text x="92" y="171">500</text>
    <text x="92" y="137">600</text>
    <text x="92" y="102">700</text>
    <text x="92" y="68">800</text>
  </g>
  <text x="22" y="185" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155" transform="rotate(-90,22,185)">Carbon Intensity (gCO₂ / kWh)</text>

  <!-- "Green threshold" reference line at 100 gCO2/kWh -->
  <line x1="100" y1="305.6" x2="610" y2="305.6" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="6,3"/>

  <!-- Bars (7 regions) -->
  <!-- Norway: 23 gCO2/kWh -->
  <rect x="115" y="332.1" width="55" height="7.9" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="142.5" y="326" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">23</text>
  <text x="142.5" y="355" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">Norway</text>
  <text x="142.5" y="368" text-anchor="middle" font-size="8" fill="#64748b">Hydro</text>

  <!-- France: 85 gCO2/kWh -->
  <rect x="185" y="310.7" width="55" height="29.3" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="212.5" y="303" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">85</text>
  <text x="212.5" y="355" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">France</text>
  <text x="212.5" y="368" text-anchor="middle" font-size="8" fill="#64748b">Nuclear</text>

  <!-- California: 210 gCO2/kWh -->
  <rect x="255" y="267.7" width="55" height="72.3" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="282.5" y="260" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">210</text>
  <text x="282.5" y="355" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">California</text>
  <text x="282.5" y="368" text-anchor="middle" font-size="8" fill="#64748b">Mixed/Solar</text>

  <!-- EU avg: 270 gCO2/kWh -->
  <rect x="325" y="247.0" width="55" height="93.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="352.5" y="239" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">270</text>
  <text x="352.5" y="355" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">EU Avg</text>
  <text x="352.5" y="368" text-anchor="middle" font-size="8" fill="#64748b">Grid Mix</text>

  <!-- US avg: 386 gCO2/kWh -->
  <rect x="395" y="207.1" width="55" height="132.9" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="422.5" y="199" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">386</text>
  <text x="422.5" y="355" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">US Avg</text>
  <text x="422.5" y="368" text-anchor="middle" font-size="8" fill="#64748b">Gas/Coal</text>

  <!-- China: 581 gCO2/kWh -->
  <rect x="465" y="139.9" width="55" height="200.1" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="492.5" y="132" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">581</text>
  <text x="492.5" y="355" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">China</text>
  <text x="492.5" y="368" text-anchor="middle" font-size="8" fill="#64748b">Coal-heavy</text>

  <!-- Poland: 773 gCO2/kWh -->
  <rect x="535" y="73.7" width="55" height="266.3" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="562.5" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">773</text>
  <text x="562.5" y="355" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">Poland</text>
  <text x="562.5" y="368" text-anchor="middle" font-size="8" fill="#64748b">Coal</text>

  <rect x="536" y="282" width="70" height="22" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
  <text x="571" y="296" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">"Green" &lt; 100</text>

  <!-- 33x annotation: Norway vs Poland -->
  <line x1="142.5" y1="316" x2="142.5" y2="40" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="562.5" y1="58" x2="562.5" y2="40" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="142.5" y1="40" x2="562.5" y2="40" stroke="#b91c1c" stroke-width="1.2"/>
  <rect x="250" y="31" width="205" height="18" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="352.5" y="43" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">33.6× REGIONAL EMISSION FACTOR SPREAD</text>

  <!-- Key insight box -->
  <g transform="translate(100, 385)">
    <rect x="0" y="0" width="510" height="66" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0 4 A 4 4 0 0 1 4 0 L 506 0 A 4 4 0 0 1 510 4 L 510 20 L 0 20 Z" fill="#fee2e2"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#991b1b" letter-spacing="0.3">SPATIAL LOAD PLACEMENT LEVERAGE</text>
    <text x="500" y="14" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="end">Sources: EIA (2023), IEA / Ember (2024)</text>

    <text x="12" y="36" font-size="8.5" fill="#334155">Geographic site selection is the single highest-leverage operational decarbonization decision.</text>
    <text x="12" y="52" font-size="8.5" fill="#64748b">Identical 10 GWh model training run: Norway (hydro) = <tspan font-weight="700" fill="#15803d">230 t CO₂</tspan> vs. Poland (coal) = <tspan font-weight="700" fill="#b91c1c">7,730 t CO₂</tspan>.</text>
  </g>
</svg>
