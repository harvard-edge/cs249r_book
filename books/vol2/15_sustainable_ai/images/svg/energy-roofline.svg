<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 435">
  <rect width="680" height="435" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ===== Chart area: left=100, right=630, top=30, bottom=365 ===== -->
  <!-- X: log scale Arithmetic Intensity (FLOP/byte): 0.1 to 1000 -->
  <!-- Y: log scale Energy Efficiency (GFLOP/Joule): 0.01 to 100 -->

  <!-- ── Gridlines ── -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="100" y1="30" x2="100" y2="365"/>
    <line x1="232" y1="30" x2="232" y2="365"/>
    <line x1="365" y1="30" x2="365" y2="365"/>
    <line x1="497" y1="30" x2="497" y2="365"/>
    <line x1="630" y1="30" x2="630" y2="365"/>
    <line x1="100" y1="365" x2="630" y2="365"/>
    <line x1="100" y1="281" x2="630" y2="281"/>
    <line x1="100" y1="197" x2="630" y2="197"/>
    <line x1="100" y1="113" x2="630" y2="113"/>
    <line x1="100" y1="30" x2="630" y2="30"/>
  </g>

  <!-- ── Shaded Energy Regimes ── -->
  <!-- Memory Bound Polygon (Under slope) -->
  <polygon points="100,365 365,113 365,365" fill="#eff6ff" opacity="0.6"/>
  <!-- Compute Bound Polygon (Under flat ceiling) -->
  <polygon points="365,113 630,113 630,365 365,365" fill="#fef2f2" opacity="0.4"/>

  <!-- ── Axes ── -->
  <line x1="100" y1="365" x2="640" y2="365" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="365" x2="100" y2="20" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Y-axis labels ── -->
  <g font-size="9" fill="#64748b" text-anchor="end">
    <text x="92" y="369">0.01</text>
    <text x="92" y="285">0.1</text>
    <text x="92" y="201">1.0</text>
    <text x="92" y="117">10</text>
    <text x="92" y="33">100</text>
  </g>
  <text x="32" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#334155" transform="rotate(-90,32,195)">Energy Efficiency (GFLOP / Joule)</text>

  <!-- ── X-axis labels ── -->
  <g font-size="9" fill="#64748b" text-anchor="middle">
    <text x="100" y="382">0.1</text>
    <text x="232" y="382">1.0</text>
    <text x="365" y="382">10</text>
    <text x="497" y="382">100</text>
    <text x="630" y="382">1000</text>
  </g>
  <text x="365" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Arithmetic Intensity (FLOP / Byte)</text>

  <!-- ── X-axis ticks ── -->
  <g stroke="#475569" stroke-width="1">
    <line x1="100" y1="365" x2="100" y2="370"/>
    <line x1="232" y1="365" x2="232" y2="370"/>
    <line x1="365" y1="365" x2="365" y2="370"/>
    <line x1="497" y1="365" x2="497" y2="370"/>
    <line x1="630" y1="365" x2="630" y2="370"/>
  </g>

  <!-- ── Memory bandwidth energy ceiling (sloped, blue) ── -->
  <line x1="100" y1="365" x2="365" y2="113" stroke="#1F407A" stroke-width="2.5"/>

  <!-- ── Compute energy ceiling (flat, red) ── -->
  <line x1="365" y1="113" x2="630" y2="113" stroke="#dc2626" stroke-width="2.5"/>

  <!-- ── Ridge point ── -->
  <line x1="365" y1="113" x2="365" y2="365" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="365" cy="113" r="6" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
  
  <g transform="translate(365, 340)">
    <rect x="-42" y="-16" width="84" height="18" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="0" y="-4" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f172a">Ridge: 10 FLOP/B</text>
  </g>

  <!-- ── Region labels ── -->
  <text x="210" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A" transform="rotate(-43,210,240)">Memory Energy Bound Region</text>
  <text x="505" y="102" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">Compute Energy Bound Ceiling</text>

  <!-- ── Workload points ── -->
  <!-- Point A: LLM Inference -->
  <g transform="translate(265, 295)">
    <circle cx="0" cy="0" r="7" fill="#EAF1F8" stroke="#1F407A" stroke-width="2"/>
    <rect x="12" y="-12" width="135" height="26" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="0" font-size="8" font-weight="700" fill="#1F407A">A · Autoregressive Decode</text>
    <text x="18" y="10" font-size="7" fill="#64748b">Memory-bound, low efficiency</text>
  </g>

  <!-- Point B: MatMul Training -->
  <g transform="translate(485, 126)">
    <circle cx="0" cy="0" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <rect x="12" y="-12" width="130" height="26" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="0" font-size="8" font-weight="700" fill="#b91c1c">B · Dense GEMM Training</text>
    <text x="18" y="10" font-size="7" fill="#64748b">Near peak compute efficiency</text>
  </g>

  <!-- Point C: Sparse Inference -->
  <g transform="translate(325, 255)">
    <circle cx="0" cy="0" r="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="12" y="-12" width="125" height="26" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="0" font-size="8" font-weight="700" fill="#15803d">C · Sparse MoE Routing</text>
    <text x="18" y="10" font-size="7" fill="#64748b">Intermediate intensity</text>
  </g>

  <!-- ── In-Chart Vol 3/4 Explanatory Card (Top-Left) ── -->
  <g transform="translate(110, 30)">
    <rect width="235" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="235" height="18" rx="4" fill="#f8fafc"/>
    <rect y="14" width="235" height="4" fill="#f8fafc"/>
    <text x="10" y="13" font-size="8" font-weight="700" fill="#334155" letter-spacing="0.3">DATA MOVEMENT VS COMPUTE ENERGY</text>
    
    <text x="10" y="30" font-size="7.5" fill="#475569">DRAM Transfer: ~100 pJ / byte</text>
    <text x="10" y="44" font-size="7.5" fill="#475569">FP32 ALU Compute: ~10 pJ / FLOP</text>
    <text x="10" y="58" font-size="7.5" font-weight="700" fill="#1F407A">Ratio: 1 Byte Transfer ≈ 10 FLOPs Energy</text>
    <text x="10" y="69" font-size="7" fill="#64748b">Inference decode lies deep in memory-bound zone</text>
  </g>
</svg>
