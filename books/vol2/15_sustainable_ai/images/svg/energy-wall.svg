<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430">
  <rect width="680" height="430" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
    <linearGradient id="wall-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Gridlines: Y-axis log scale MWh 0.01 to 100,000 -->
  <!-- Left=80, Right=620, Bottom=350, Top=40 -->
  <!-- yMap: 0.01 -> 350, 0.1 -> 306, 1 -> 262, 10 -> 218, 100 -> 174, 1,000 -> 130, 10,000 -> 86, 100,000 -> 42 -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="80" y1="350" x2="620" y2="350"/>
    <line x1="80" y1="306" x2="620" y2="306"/>
    <line x1="80" y1="262" x2="620" y2="262"/>
    <line x1="80" y1="218" x2="620" y2="218"/>
    <line x1="80" y1="174" x2="620" y2="174"/>
    <line x1="80" y1="130" x2="620" y2="130"/>
    <line x1="80" y1="86" x2="620" y2="86"/>
    <line x1="80" y1="42" x2="620" y2="42"/>
  </g>

  <!-- Trend Shaded Area -->
  <path d="M 80 306 L 134 278 L 242 214 L 296 126 L 404 106 L 458 52 L 512 61 L 512 350 L 80 350 Z" fill="url(#wall-grad)"/>

  <!-- Power Plant Reference Line (10,000 MWh = 10 GWh) -->
  <line x1="80" y1="86" x2="620" y2="86" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="6,4"/>
  <g transform="translate(460, 74)">
    <rect width="155" height="22" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <text x="77.5" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Small Power Plant (~10 GWh/yr)</text>
  </g>

  <!-- Axes -->
  <line x1="80" y1="350" x2="630" y2="350" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="350" x2="80" y2="30" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Y-axis labels -->
  <g font-size="8.5" fill="#64748b" text-anchor="end">
    <text x="72" y="353">0.01</text>
    <text x="72" y="309">0.1</text>
    <text x="72" y="265">1</text>
    <text x="72" y="221">10</text>
    <text x="72" y="177">100</text>
    <text x="72" y="133">1,000</text>
    <text x="72" y="89">10,000</text>
    <text x="72" y="45">100,000</text>
  </g>
  <text x="24" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#334155" transform="rotate(-90,24,196)">Energy per Training Run (MWh)</text>

  <!-- X-axis labels and ticks (2016 -> 80, 2026 -> 620, step=54) -->
  <g font-size="8.5" fill="#64748b" text-anchor="middle">
    <text x="80" y="366">2016</text>
    <text x="134" y="366">2017</text>
    <text x="188" y="366">2018</text>
    <text x="242" y="366">2019</text>
    <text x="296" y="366">2020</text>
    <text x="350" y="366">2021</text>
    <text x="404" y="366">2022</text>
    <text x="458" y="366">2023</text>
    <text x="512" y="366">2024</text>
    <text x="566" y="366">2025</text>
    <text x="620" y="366">2026</text>
  </g>
  <g stroke="#475569" stroke-width="1">
    <line x1="80" y1="350" x2="80" y2="354"/>
    <line x1="134" y1="350" x2="134" y2="354"/>
    <line x1="188" y1="350" x2="188" y2="354"/>
    <line x1="242" y1="350" x2="242" y2="354"/>
    <line x1="296" y1="350" x2="296" y2="354"/>
    <line x1="350" y1="350" x2="350" y2="354"/>
    <line x1="404" y1="350" x2="404" y2="354"/>
    <line x1="458" y1="350" x2="458" y2="354"/>
    <line x1="512" y1="350" x2="512" y2="354"/>
    <line x1="566" y1="350" x2="566" y2="354"/>
    <line x1="620" y1="350" x2="620" y2="354"/>
  </g>
  <text x="350" y="392" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Frontier Foundation Model Release Year</text>

  <!-- Exponential Trend Line -->
  <path d="M 80 306 L 134 278 L 242 214 L 296 126 L 404 106 L 458 52" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="210" y="248" font-size="9" font-weight="700" fill="#dc2626" transform="rotate(-30,210,248)">Exponential Compute Growth (~3.4× / yr)</text>

  <!-- Infrastructure Limit Card (Top Left) -->
  <g transform="translate(100, 42)">
    <rect width="180" height="52" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <rect width="180" height="16" rx="4" fill="#fee2e2"/>
    <rect y="12" width="180" height="4" fill="#fee2e2"/>
    <text x="8" y="11.5" font-size="7.5" font-weight="700" fill="#b91c1c">INFRASTRUCTURE CAPACITY WALL</text>
    <text x="8" y="28" font-size="7" fill="#7f1d1d">Grid interconnect &amp; substation limits</text>
    <text x="8" y="42" font-size="7" fill="#475569">Single training run equals regional city draw</text>
  </g>

  <!-- Data Points -->
  <!-- AlphaGo 2016 -->
  <circle cx="80" cy="306" r="4.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="92" y="306" font-size="8" font-weight="700" fill="#1F407A">AlphaGo (0.1 MWh)</text>

  <!-- Transformer 2017 -->
  <circle cx="134" cy="278" r="4.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="146" y="280" font-size="8" font-weight="700" fill="#1F407A">Transformer (~0.5 MWh)</text>

  <!-- BERT 2019 -->
  <circle cx="242" cy="214" r="4.5" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="234" y="202" font-size="8" font-weight="700" fill="#1F407A" text-anchor="end">BERT (~12 MWh)</text>

  <!-- GPT-3 2020 -->
  <circle cx="296" cy="126" r="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="286" y="118" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="end">GPT-3 (1,287 MWh)</text>

  <!-- PaLM 2022 -->
  <circle cx="404" cy="106" r="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="394" y="98" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="end">PaLM (~3,400 MWh)</text>

  <!-- GPT-4 (est.) 2023 -->
  <circle cx="458" cy="52" r="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="448" y="44" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="end">GPT-4 (~50,000 MWh)</text>

  <!-- Llama 3.1 2024 -->
  <circle cx="512" cy="61" r="5.5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="524" y="58" font-size="8.5" font-weight="700" fill="#b45309">Llama 3.1 (~30,000 MWh)</text>
</svg>
