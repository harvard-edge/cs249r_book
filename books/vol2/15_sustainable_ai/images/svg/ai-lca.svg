<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262">
  <rect width="680" height="262" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ── 4 HORIZONTAL STAGE CARDS ── -->

  <!-- Stage 1: Design (Green) -->
  <g transform="translate(25, 20)">
    <rect width="148" height="225" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="148" height="24" rx="5" fill="#f0fdf4"/>
    <rect y="20" width="148" height="4" fill="#f0fdf4"/>
    <text x="74" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d" letter-spacing="0.4">1 · SYSTEM DESIGN</text>

    <!-- Content items -->
    <g transform="translate(10, 32)">
      <text x="0" y="12" font-size="8" font-weight="600" fill="#0f172a">Architecture Selection</text>
      <text x="0" y="24" font-size="7.5" fill="#64748b">Dense vs. MoE routing</text>

      <text x="0" y="44" font-size="8" font-weight="600" fill="#0f172a">Parameter Budgeting</text>
      <text x="0" y="56" font-size="7.5" fill="#64748b">Pruning &amp; distillation target</text>

      <text x="0" y="76" font-size="8" font-weight="600" fill="#0f172a">Hardware Spec</text>
      <text x="0" y="88" font-size="7.5" fill="#64748b">ASIC vs. GPU efficiency</text>

      <text x="0" y="108" font-size="8" font-weight="600" fill="#0f172a">Facility Planning</text>
      <text x="0" y="120" font-size="7.5" fill="#64748b">PUE targets &amp; grid site</text>
    </g>

    <!-- Impact Indicator -->
    <rect x="10" y="174" width="128" height="40" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="74" y="189" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">System Leverage</text>
    <text x="74" y="203" text-anchor="middle" font-size="7.5" fill="#166534">Architects lifetime load</text>

    <!-- Connector Arrow -->
    <line x1="148" y1="112" x2="160" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 2: Manufacture (Blue) -->
  <g transform="translate(185, 20)">
    <rect width="148" height="225" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="148" height="24" rx="5" fill="#EAF1F8"/>
    <rect y="20" width="148" height="4" fill="#EAF1F8"/>
    <text x="74" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F407A" letter-spacing="0.4">2 · MANUFACTURE</text>

    <!-- Content items -->
    <g transform="translate(10, 32)">
      <text x="0" y="12" font-size="8" font-weight="600" fill="#0f172a">Silicon Fabrication</text>
      <text x="0" y="24" font-size="7.5" fill="#64748b">EUV lithography &amp; wafers</text>

      <text x="0" y="44" font-size="8" font-weight="600" fill="#0f172a">Resource Extraction</text>
      <text x="0" y="56" font-size="7.5" fill="#64748b">Rare-earth &amp; copper mining</text>

      <text x="0" y="76" font-size="8" font-weight="600" fill="#0f172a">Board Assembly</text>
      <text x="0" y="88" font-size="7.5" fill="#64748b">HBM packaging &amp; PCB</text>

      <text x="0" y="108" font-size="8" font-weight="600" fill="#0f172a">Supply Transport</text>
      <text x="0" y="120" font-size="7.5" fill="#64748b">Global freight logistics</text>
    </g>

    <!-- Impact Indicator -->
    <rect x="10" y="174" width="128" height="40" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="74" y="189" text-anchor="middle" font-size="8" font-weight="700" fill="#1F407A">Embodied Carbon</text>
    <text x="74" y="203" text-anchor="middle" font-size="7.5" fill="#1e40af">High water &amp; chemical cost</text>

    <!-- Connector Arrow -->
    <line x1="148" y1="112" x2="160" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 3: Use (Amber) -->
  <g transform="translate(345, 20)">
    <rect width="148" height="225" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="148" height="24" rx="5" fill="#fef3c7"/>
    <rect y="20" width="148" height="4" fill="#fef3c7"/>
    <text x="74" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309" letter-spacing="0.4">3 · USE &amp; OPERATE</text>

    <!-- Content items -->
    <g transform="translate(10, 32)">
      <text x="0" y="12" font-size="8" font-weight="600" fill="#0f172a">Model Training</text>
      <text x="0" y="24" font-size="7.5" fill="#64748b">Megawatt-scale clusters</text>

      <text x="0" y="44" font-size="8" font-weight="600" fill="#0f172a">Fleet Inference</text>
      <text x="0" y="56" font-size="7.5" fill="#64748b">Autoregressive token decode</text>

      <text x="0" y="76" font-size="8" font-weight="600" fill="#0f172a">Facility Overhead</text>
      <text x="0" y="88" font-size="7.5" fill="#64748b">PUE chillers &amp; power loss</text>

      <text x="0" y="108" font-size="8" font-weight="600" fill="#0f172a">Continuous Retraining</text>
      <text x="0" y="120" font-size="7.5" fill="#64748b">Online updates &amp; fine-tunes</text>
    </g>

    <!-- Impact Indicator -->
    <rect x="10" y="174" width="128" height="40" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="74" y="189" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Operational Energy</text>
    <text x="74" y="203" text-anchor="middle" font-size="7.5" fill="#92400e">Grid carbon intensity draw</text>

    <!-- Connector Arrow -->
    <line x1="148" y1="112" x2="160" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 4: Disposal (Red/Rose) -->
  <g transform="translate(505, 20)">
    <rect width="148" height="225" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="148" height="24" rx="5" fill="#fee2e2"/>
    <rect y="20" width="148" height="4" fill="#fee2e2"/>
    <text x="74" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c" letter-spacing="0.4">4 · DECOMMISSION</text>

    <!-- Content items -->
    <g transform="translate(10, 32)">
      <text x="0" y="12" font-size="8" font-weight="600" fill="#0f172a">Server Retirement</text>
      <text x="0" y="24" font-size="7.5" fill="#64748b">3–5 year refresh cadence</text>

      <text x="0" y="44" font-size="8" font-weight="600" fill="#0f172a">E-Waste Stream</text>
      <text x="0" y="56" font-size="7.5" fill="#64748b">Heavy metals &amp; toxics</text>

      <text x="0" y="76" font-size="8" font-weight="600" fill="#0f172a">Component Recovery</text>
      <text x="0" y="88" font-size="7.5" fill="#64748b">Low formal recycling rates</text>

      <text x="0" y="108" font-size="8" font-weight="600" fill="#0f172a">Secondary Life</text>
      <text x="0" y="120" font-size="7.5" fill="#64748b">Refurbishment &amp; reuse</text>
    </g>

    <!-- Impact Indicator -->
    <rect x="10" y="174" width="128" height="40" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="74" y="189" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">E-Waste &amp; Toxics</text>
    <text x="74" y="203" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Landfill &amp; recycling burden</text>
  </g>

</svg>
