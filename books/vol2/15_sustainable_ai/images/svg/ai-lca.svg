<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 530">
  <rect width="690" height="530" fill="#fff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#999"/></marker>
  </defs>

  <!-- Lifecycle header arrow spanning all stages -->
  <text x="345" y="40" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">Total Lifecycle Impact = Design + Manufacture + Use + Disposal</text>
  <path d="M 105 70 L 105 50 L 585 50 L 585 70" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── STAGE BOXES (horizontal flow) ── -->
  <!-- Stage 1: Design (green) -->
  <rect x="30" y="70" width="150" height="170" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="105" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#16A34A">Design</text>
  <line x1="40" y1="100" x2="170" y2="100" stroke="#16A34A" stroke-width="1.2"/>
  <text x="105" y="120" text-anchor="middle" font-size="10" fill="#16A34A">Architecture choices</text>
  <text x="105" y="134" text-anchor="middle" font-size="10" fill="#16A34A">Model size decisions</text>
  <text x="105" y="148" text-anchor="middle" font-size="10" fill="#16A34A">Hardware selection</text>
  <text x="105" y="162" text-anchor="middle" font-size="10" fill="#16A34A">Efficiency targets</text>
  <text x="105" y="176" text-anchor="middle" font-size="10" fill="#16A34A">PUE planning</text>
  <text x="105" y="190" text-anchor="middle" font-size="10" fill="#16A34A">Location / grid mix</text>
  <text x="105" y="204" text-anchor="middle" font-size="10" fill="#16A34A">Cooling strategy</text>
  <text x="105" y="220" text-anchor="middle" font-size="10" fill="#16A34A">Workload profiling</text>

  <!-- Stage 2: Manufacture (blue) -->
  <rect x="190" y="70" width="150" height="170" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="265" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F407A">Manufacture</text>
  <line x1="200" y1="100" x2="330" y2="100" stroke="#1F407A" stroke-width="1.2"/>
  <text x="265" y="120" text-anchor="middle" font-size="10" fill="#1F407A">Chip fabrication</text>
  <text x="265" y="134" text-anchor="middle" font-size="10" fill="#1F407A">Water &amp; energy intensive</text>
  <text x="265" y="148" text-anchor="middle" font-size="10" fill="#1F407A">Chemical processes</text>
  <text x="265" y="162" text-anchor="middle" font-size="10" fill="#1F407A">Server assembly</text>
  <text x="265" y="176" text-anchor="middle" font-size="10" fill="#1F407A">Supply chain transport</text>
  <text x="265" y="190" text-anchor="middle" font-size="10" fill="#1F407A">Packaging materials</text>
  <text x="265" y="204" text-anchor="middle" font-size="10" fill="#1F407A">Quality testing</text>
  <text x="265" y="220" text-anchor="middle" font-size="10" fill="#1F407A">Logistics &amp; delivery</text>

  <!-- Stage 3: Use (orange) -->
  <rect x="350" y="70" width="150" height="170" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="425" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97706">Use</text>
  <line x1="360" y1="100" x2="490" y2="100" stroke="#D97706" stroke-width="1.2"/>
  <text x="425" y="120" text-anchor="middle" font-size="10" fill="#D97706">Training energy (GPU-h)</text>
  <text x="425" y="134" text-anchor="middle" font-size="10" fill="#D97706">Inference power draw</text>
  <text x="425" y="148" text-anchor="middle" font-size="10" fill="#D97706">Cooling overhead (PUE)</text>
  <text x="425" y="162" text-anchor="middle" font-size="10" fill="#D97706">Storage I/O energy</text>
  <text x="425" y="176" text-anchor="middle" font-size="10" fill="#D97706">Network transmission</text>
  <text x="425" y="190" text-anchor="middle" font-size="10" fill="#D97706">Retraining cycles</text>
  <text x="425" y="204" text-anchor="middle" font-size="10" fill="#D97706">Monitoring overhead</text>
  <text x="425" y="220" text-anchor="middle" font-size="10" fill="#D97706">Idle power baseline</text>

  <!-- Stage 4: Disposal (red) -->
  <rect x="510" y="70" width="150" height="170" fill="#FEE2E2" stroke="#c44" stroke-width="1.5"/>
  <text x="585" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#DC2626">Disposal</text>
  <line x1="520" y1="100" x2="650" y2="100" stroke="#c44" stroke-width="1.2"/>
  <text x="585" y="120" text-anchor="middle" font-size="10" fill="#DC2626">E-waste generation</text>
  <text x="585" y="134" text-anchor="middle" font-size="10" fill="#c44">Rare earth recovery</text>
  <text x="585" y="148" text-anchor="middle" font-size="10" fill="#c44">Toxic material disposal</text>
  <text x="585" y="162" text-anchor="middle" font-size="10" fill="#c44">Recycling rates (&lt;20%)</text>
  <text x="585" y="176" text-anchor="middle" font-size="10" fill="#c44">Refurbishment / reuse</text>
  <text x="585" y="190" text-anchor="middle" font-size="10" fill="#c44">Export to dev. nations</text>
  <text x="585" y="204" text-anchor="middle" font-size="10" fill="#c44">Landfill impact</text>
  <text x="585" y="220" text-anchor="middle" font-size="10" fill="#c44">Data destruction</text>

  <!-- Flow arrows between stages -->
  <line x1="180" y1="155" x2="190" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="155" x2="350" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="155" x2="510" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Impact Category Icons (below each stage box) ── -->
  <rect x="60" y="260" width="90" height="50" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="105" y="278" text-anchor="middle" font-size="12" fill="#16A34A">⚙</text>
  <text x="105" y="292" text-anchor="middle" font-size="9" fill="#16A34A">System</text>
  <text x="105" y="302" text-anchor="middle" font-size="9" fill="#16A34A">Choices</text>

  <rect x="220" y="260" width="90" height="50" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="265" y="276" text-anchor="middle" font-size="10" fill="#1F407A" font-weight="bold">Carbon</text>
  <text x="265" y="288" text-anchor="middle" font-size="10" fill="#1F407A">Water</text>
  <text x="265" y="300" text-anchor="middle" font-size="10" fill="#1F407A">Chemicals</text>

  <rect x="380" y="260" width="90" height="50" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="425" y="276" text-anchor="middle" font-size="10" fill="#D97706" font-weight="bold">Energy (kWh)</text>
  <text x="425" y="288" text-anchor="middle" font-size="10" fill="#D97706">CO₂ emissions</text>
  <text x="425" y="300" text-anchor="middle" font-size="10" fill="#D97706">Grid carbon intensity</text>

  <rect x="540" y="260" width="90" height="50" fill="#FEE2E2" stroke="#c44" stroke-width="1.5"/>
  <text x="585" y="276" text-anchor="middle" font-size="10" fill="#DC2626" font-weight="bold">E-Waste (kg)</text>
  <text x="585" y="288" text-anchor="middle" font-size="10" fill="#c44">Toxics (Pb, Cd)</text>
  <text x="585" y="300" text-anchor="middle" font-size="10" fill="#c44">Recyclability</text>

  <!-- Key insight box -->
  <rect x="30" y="340" width="630" height="50" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="345" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97706">Key Insight: Embodied Carbon</text>
  <text x="345" y="374" text-anchor="middle" font-size="11" fill="#D97706">Manufacturing a GPU server emits carbon equivalent to 1–2 years of its operational energy use.</text>
  <text x="345" y="386" text-anchor="middle" font-size="10" fill="#D97706">Extending hardware lifetime and maximizing utilization are the highest-leverage sustainability interventions.</text>

  <!-- Quantitative breakdown bar -->
  <text x="345" y="420" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Typical AI System Lifecycle Carbon Split</text>
  
  <rect x="30" y="430" width="32" height="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="46" y="444" text-anchor="middle" font-size="9" fill="#16A34A">5%</text>
  
  <rect x="62" y="430" width="283" height="20" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="203.5" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F407A">45% — Manufacture</text>
  
  <rect x="345" y="430" width="252" height="20" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="471" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97706">40% — Use</text>
  
  <rect x="597" y="430" width="63" height="20" fill="#FEE2E2" stroke="#c44" stroke-width="1.2"/>
  <text x="628.5" y="444" text-anchor="middle" font-size="9" fill="#DC2626">10%</text>

  <!-- Bottom annotation -->
  <rect x="30" y="470" width="630" height="20" fill="#F8FAFC" stroke="#bbb" stroke-width="1.2"/>
  <text x="345" y="484" text-anchor="middle" font-size="11" fill="#555">Lifecycle Assessment (LCA) quantifies total environmental cost — manufacturing often dominates total carbon footprint</text>
</svg>
