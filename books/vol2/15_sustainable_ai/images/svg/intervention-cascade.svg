<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <text x="200" y="34" text-anchor="middle" font-size="12" fill="#555">Lever</text>
  <text x="480" y="34" text-anchor="middle" font-size="12" fill="#555">Accounting tier</text>

  <!-- ===== Levers: one pitch (50 px boxes on an 80 px step) ===== -->
  <rect x="100" y="50" width="200" height="50" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Work reduction</text>
  <rect x="100" y="130" width="200" height="50" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Execution efficiency</text>
  <rect x="100" y="210" width="200" height="50" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Facility overhead</text>
  <rect x="100" y="290" width="200" height="50" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Grid factor</text>
  <rect x="100" y="370" width="200" height="50" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Hardware lifecycle</text>

  <!-- ===== Accounting tiers (IT energy spans its two levers) ===== -->
  <rect x="380" y="50" width="200" height="130" rx="2" fill="#f8fafc" stroke="#555" stroke-width="1.5"/>
  <text x="480" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#333">IT energy</text>
  <text x="480" y="129" text-anchor="middle" font-size="12" fill="#555">kWh</text>
  <rect x="380" y="210" width="200" height="50" rx="2" fill="#f8fafc" stroke="#555" stroke-width="1.5"/>
  <text x="480" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Facility energy</text>
  <text x="480" y="248" text-anchor="middle" font-size="12" fill="#555">kWh</text>
  <rect x="380" y="290" width="200" height="50" rx="2" fill="#f8fafc" stroke="#555" stroke-width="1.5"/>
  <text x="480" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Electricity carbon</text>
  <text x="480" y="328" text-anchor="middle" font-size="12" fill="#555">kg CO<tspan baseline-shift="sub" font-size="10">2</tspan>e</text>
  <rect x="380" y="370" width="200" height="50" rx="2" fill="#f8fafc" stroke="#555" stroke-width="1.5"/>
  <text x="480" y="391" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Lifecycle account</text>
  <text x="480" y="408" text-anchor="middle" font-size="12" fill="#555">kg CO<tspan baseline-shift="sub" font-size="10">2</tspan>e</text>

  <!-- ===== Lever → tier arrows ===== -->
  <line x1="300" y1="75" x2="378" y2="75" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="300" y1="155" x2="378" y2="155" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="300" y1="235" x2="378" y2="235" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="300" y1="315" x2="378" y2="315" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="300" y1="395" x2="378" y2="395" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Tier chain ===== -->
  <line x1="480" y1="180" x2="480" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="260" x2="480" y2="288" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="340" x2="480" y2="368" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
