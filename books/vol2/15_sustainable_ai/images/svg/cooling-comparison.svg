<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 435">
  <rect width="680" height="435" fill="#ffffff"/>

  <defs>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== LEFT PANEL: Air Cooling (Legacy) ===== -->
  <g transform="translate(20, 16)">
    <rect width="310" height="330" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="310" height="24" rx="5" fill="#fee2e2"/>
    <rect y="20" width="310" height="4" fill="#fee2e2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#b91c1c" letter-spacing="0.4">A · FORCED-AIR CONVECTION (LEGACY)</text>
    <text x="210" y="16" font-size="7.5" fill="#7f1d1d">Limited density &lt; 35 kW</text>

    <!-- Rack outline -->
    <rect x="70" y="36" width="120" height="175" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="130" y="49" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">42U Air-Cooled Rack</text>

    <!-- 6 GPU servers in rack -->
    <g transform="translate(78, 56)">
      <rect x="0" y="0" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <text x="52" y="10" text-anchor="middle" font-size="7" fill="#1F407A">GPU Server Node 1</text>

      <rect x="0" y="18" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <text x="52" y="28" text-anchor="middle" font-size="7" fill="#1F407A">GPU Server Node 2</text>

      <rect x="0" y="36" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <text x="52" y="46" text-anchor="middle" font-size="7" fill="#1F407A">GPU Server Node 3</text>

      <rect x="0" y="54" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <text x="52" y="64" text-anchor="middle" font-size="7" fill="#1F407A">GPU Server Node 4</text>

      <rect x="0" y="72" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <text x="52" y="82" text-anchor="middle" font-size="7" fill="#1F407A">GPU Server Node 5</text>

      <rect x="0" y="90" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <text x="52" y="100" text-anchor="middle" font-size="7" fill="#1F407A">GPU Server Node 6</text>

      <!-- Fan Bank -->
      <rect x="0" y="112" width="104" height="20" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="52" y="125" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">Chassis Fan Bank</text>
    </g>

    <!-- Cold air in from front -->
    <path d="M 24 116 L 62 116" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <path d="M 24 132 L 62 132" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="43" y="104" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1F407A">Cold Air</text>
    <text x="43" y="146" text-anchor="middle" font-size="7.5" fill="#1F407A">20°C</text>

    <!-- Hot air out from rear -->
    <path d="M 198 116 L 236 116" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <path d="M 198 132 L 236 132" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <text x="220" y="104" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">Hot Air</text>
    <text x="220" y="146" text-anchor="middle" font-size="7.5" fill="#dc2626">38–45°C</text>

    <!-- Air cooling metrics card -->
    <g transform="translate(14, 222)">
      <rect width="282" height="96" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <rect width="282" height="18" rx="4" fill="#fee2e2"/>
      <rect y="14" width="282" height="4" fill="#fee2e2"/>
      <text x="10" y="13" font-size="8" font-weight="700" fill="#b91c1c">AIR CONVECTION PERFORMANCE METRICS</text>
      
      <text x="10" y="32" font-size="7.5" fill="#475569">Power Density: 15–30 kW / rack max</text>
      <text x="10" y="46" font-size="7.5" fill="#475569">Facility PUE: 1.40 – 1.80 (High chill overhead)</text>
      <text x="10" y="60" font-size="7.5" fill="#475569">Fan Power Draw: 30–40% of IT compute load</text>
      <text x="10" y="74" font-size="7.5" font-weight="700" fill="#dc2626">Thermal Choking: Fails above ~35 kW/rack</text>
      <text x="10" y="88" font-size="7" fill="#991b1b">Fan power scales cubically with required airflow</text>
    </g>
  </g>

  <!-- ===== RIGHT PANEL: Liquid Cooling ===== -->
  <g transform="translate(350, 16)">
    <rect width="310" height="330" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="310" height="24" rx="5" fill="#dcfce7"/>
    <rect y="20" width="310" height="4" fill="#dcfce7"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#15803d" letter-spacing="0.4">B · DIRECT-TO-CHIP LIQUID COOLING</text>
    <text x="210" y="16" font-size="7.5" fill="#166534">High density 100+ kW</text>

    <!-- Rack outline -->
    <rect x="55" y="36" width="120" height="175" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="115" y="49" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">High-Density Rack</text>

    <!-- 6 GPU servers in rack with cold plates -->
    <g transform="translate(63, 56)">
      <rect x="0" y="0" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <rect x="86" y="2" width="14" height="10" rx="1" fill="#1F407A"/>
      <text x="44" y="10" text-anchor="middle" font-size="7" fill="#1F407A">GPU Node 1</text>

      <rect x="0" y="18" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <rect x="86" y="20" width="14" height="10" rx="1" fill="#1F407A"/>
      <text x="44" y="28" text-anchor="middle" font-size="7" fill="#1F407A">GPU Node 2</text>

      <rect x="0" y="36" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <rect x="86" y="38" width="14" height="10" rx="1" fill="#1F407A"/>
      <text x="44" y="46" text-anchor="middle" font-size="7" fill="#1F407A">GPU Node 3</text>

      <rect x="0" y="54" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <rect x="86" y="56" width="14" height="10" rx="1" fill="#1F407A"/>
      <text x="44" y="64" text-anchor="middle" font-size="7" fill="#1F407A">GPU Node 4</text>

      <rect x="0" y="72" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <rect x="86" y="74" width="14" height="10" rx="1" fill="#1F407A"/>
      <text x="44" y="82" text-anchor="middle" font-size="7" fill="#1F407A">GPU Node 5</text>

      <rect x="0" y="90" width="104" height="14" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="0.8"/>
      <rect x="86" y="92" width="14" height="10" rx="1" fill="#1F407A"/>
      <text x="44" y="100" text-anchor="middle" font-size="7" fill="#1F407A">GPU Node 6</text>

      <!-- CDU Manifold -->
      <rect x="0" y="112" width="104" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="52" y="125" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">CDU In-Rack Manifold</text>
    </g>

    <!-- Coolant loop arrows -->
    <!-- Supply cool 18°C -->
    <path d="M 12 110 L 48 110" fill="none" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="30" y="98" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1F407A">Cool In</text>
    <text x="30" y="124" text-anchor="middle" font-size="7" fill="#1F407A">18°C</text>

    <!-- Return warm 45°C -->
    <path d="M 48 140 L 12 140" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <text x="30" y="154" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">Warm Out</text>
    <text x="30" y="166" text-anchor="middle" font-size="7" fill="#dc2626">45°C</text>

    <!-- External Heat Exchanger -->
    <g transform="translate(195, 75)">
      <rect width="95" height="75" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect width="95" height="18" rx="4" fill="#f0fdf4"/>
      <rect y="14" width="95" height="4" fill="#f0fdf4"/>
      <text x="47.5" y="13" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">HEAT EXCHANGER</text>
      <text x="47.5" y="32" text-anchor="middle" font-size="7" fill="#475569">Waste Heat Reuse</text>
      <text x="47.5" y="44" text-anchor="middle" font-size="7" fill="#166534">District Heating</text>
      <text x="47.5" y="56" text-anchor="middle" font-size="7" fill="#166534">Dry Coolers</text>
      <text x="47.5" y="68" text-anchor="middle" font-size="7" fill="#64748b">Zero water evapor.</text>
    </g>
    <line x1="175" y1="112" x2="192" y2="112" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

    <!-- Liquid cooling metrics card -->
    <g transform="translate(14, 222)">
      <rect width="282" height="96" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect width="282" height="18" rx="4" fill="#dcfce7"/>
      <rect y="14" width="282" height="4" fill="#dcfce7"/>
      <text x="10" y="13" font-size="8" font-weight="700" fill="#15803d">DIRECT LIQUID COOLING PERFORMANCE METRICS</text>
      
      <text x="10" y="32" font-size="7.5" fill="#475569">Power Density: 100–250+ kW / rack</text>
      <text x="10" y="46" font-size="7.5" fill="#475569">Facility PUE: 1.05 – 1.10 (Ultra-low overhead)</text>
      <text x="10" y="60" font-size="7.5" fill="#475569">Pump Power Draw: &lt;5% of IT compute load</text>
      <text x="10" y="74" font-size="7.5" font-weight="700" fill="#15803d">Mandatory for Modern Accelerators (H100/B200)</text>
      <text x="10" y="88" font-size="7" fill="#166534">Warm water return allows direct thermal reuse</text>
    </g>
  </g>

  <!-- ===== BOTTOM PANEL: Thermodynamic Takeaway Card ===== -->
  <g transform="translate(20, 356)">
    <rect width="640" height="64" rx="5" fill="#f8fafc" stroke="#93c5fd" stroke-width="1"/>
    <rect width="640" height="18" rx="5" fill="#eff6ff"/>
    <rect y="14" width="640" height="4" fill="#eff6ff"/>
    <text x="14" y="13" font-size="8" font-weight="700" fill="#1F407A" letter-spacing="0.4">THERMODYNAMIC DENSITY LIMIT PRINCIPLE</text>
    <text x="14" y="33" font-size="8.5" fill="#334155">
      Above 40 kW/rack, fan power requirements scale cubically with volumetric air velocity, creating an air-cooling wall.
    </text>
    <text x="14" y="48" font-size="8.5" fill="#475569">
      Direct liquid cooling (D2C) reduces thermal resistance by 1000×, slashing cooling overhead from 40% to &lt;5% of IT power while enabling 100+ kW rack clusters.
    </text>
  </g>
</svg>
