<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="222" fill="#ffffff"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>
  <!-- ===== zones ===== -->
  <text x="290" y="32" text-anchor="middle" font-size="12" fill="#555">Server and rack</text>
  <text x="595" y="32" text-anchor="middle" font-size="12" fill="#555">Facility</text>
  <line x1="525" y1="20" x2="525" y2="210" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- ===== Air path ===== -->
  <text x="20" y="79" font-size="13" font-weight="700" fill="#333">Air</text>
  <rect x="90" y="50" width="100" height="50" rx="2" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <text x="140" y="79.5" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Chip</text>
  <rect x="230" y="50" width="110" height="50" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="285" y="79.5" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Heat sink</text>
  <rect x="380" y="50" width="110" height="50" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="435" y="79.5" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Moving air</text>
  <line x1="190" y1="75" x2="228" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="75" x2="378" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="75" x2="553" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- ===== Liquid path ===== -->
  <text x="20" y="179" font-size="13" font-weight="700" fill="#333">Liquid</text>
  <rect x="90" y="150" width="100" height="50" rx="2" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <text x="140" y="179.5" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Chip</text>
  <rect x="230" y="150" width="110" height="50" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="285" y="179.5" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Cold plate</text>
  <rect x="380" y="150" width="110" height="50" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="435" y="179.5" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Coolant loop</text>
  <line x1="190" y1="175" x2="228" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="175" x2="378" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="175" x2="553" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- ===== shared rejection ===== -->
  <rect x="555" y="50" width="105" height="150" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="607.5" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Heat</text>
  <text x="607.5" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#333">rejection</text>
</svg>
