<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <linearGradient id="envelope-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#EAF1F8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- LEFT PLOT AREA: x from 90 to 650 (width 560), y from 40 to 370 (height 330) -->
  <!-- X mapping: 2010 -> 90, 2012 -> 146, 2014 -> 202, 2016 -> 258, 2018 -> 314, 2020 -> 370, 2022 -> 426, 2024 -> 482, 2026 -> 538, 2028 -> 594, 2030 -> 650 -->
  <!-- Y mapping: 0 TWh -> 370, 2000 TWh -> 295, 4000 TWh -> 220, 6000 TWh -> 145, 8000 TWh -> 70 -->
  <!-- Formula: y = 370 - (TWh / 8000) * 300 -->

  <!-- Shaded Divergence Envelope (from 2018 to 2030) -->
  <path d="M 314 323 L 370 310 L 426 287 L 482 257 L 538 201 L 594 145 L 650 72.5 L 650 344 L 594 344.4 L 538 345.5 L 482 346.7 L 426 347.8 L 370 348.5 L 314 349 Z" fill="url(#envelope-grad)"/>

  <!-- Horizontal Grid Lines & Y-axis labels -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="90" y1="370" x2="650" y2="370"/>
    <line x1="90" y1="295" x2="650" y2="295"/>
    <line x1="90" y1="220" x2="650" y2="220"/>
    <line x1="90" y1="145" x2="650" y2="145"/>
    <line x1="90" y1="70" x2="650" y2="70"/>
  </g>

  <g font-size="9" fill="#64748b" text-anchor="end">
    <text x="80" y="373">0</text>
    <text x="80" y="298">2,000</text>
    <text x="80" y="223">4,000</text>
    <text x="80" y="148">6,000</text>
    <text x="80" y="73">8,000</text>
  </g>
  <text x="24" y="220" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90,24,220)">Global Data Center Electricity (TWh / yr)</text>

  <!-- X-axis Ticks & Labels -->
  <g font-size="9" fill="#64748b" text-anchor="middle">
    <text x="90" y="388">2010</text>
    <text x="146" y="388">2012</text>
    <text x="202" y="388">2014</text>
    <text x="258" y="388">2016</text>
    <text x="314" y="388">2018</text>
    <text x="370" y="388">2020</text>
    <text x="426" y="388">2022</text>
    <text x="482" y="388">2024</text>
    <text x="538" y="388">2026</text>
    <text x="594" y="388">2028</text>
    <text x="650" y="388">2030</text>
  </g>
  <text x="370" y="414" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle">Projection Timeline (Calendar Years)</text>

  <!-- Axes lines -->
  <line x1="90" y1="50" x2="90" y2="370" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="90" y1="370" x2="650" y2="370" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Vertical Divergence Line at 2018 -->
  <line x1="314" y1="50" x2="314" y2="370" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="256" y="48" width="116" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="314" y="60" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">Historical / Model Split</text>

  <!-- Global Reference Line: Total US Electricity ~4,100 TWh (y=216) -->
  <line x1="90" y1="216" x2="650" y2="216" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
  <rect x="100" y="206" width="146" height="18" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="173" y="218" font-size="7.5" font-weight="600" fill="#475569" text-anchor="middle">Total US Electricity (~4,100 TWh)</text>

  <!-- Historical Segment (2010 to 2018) -->
  <polyline points="90,351 146,350.8 202,350.4 258,349.8 314,349" fill="none" stroke="#475569" stroke-width="2.5"/>

  <!-- SCENARIO 1: Worst Case (Red) -->
  <polyline points="314,323 370,310 426,287 482,257 538,201 594,145 650,72.5" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="314" cy="323" r="3.5" fill="#dc2626"/>
  <circle cx="370" cy="310" r="3.5" fill="#dc2626"/>
  <circle cx="426" cy="287" r="3.5" fill="#dc2626"/>
  <circle cx="482" cy="257" r="3.5" fill="#dc2626"/>
  <circle cx="538" cy="201" r="3.5" fill="#dc2626"/>
  <circle cx="594" cy="145" r="3.5" fill="#dc2626"/>
  <circle cx="650" cy="72.5" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <text x="644" y="60" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="end">Worst: 7,933 TWh</text>

  <!-- SCENARIO 2: Expected Case (Blue) -->
  <polyline points="314,341.5 370,337.8 426,332.5 482,325 538,310 594,295 650,258.7" fill="none" stroke="#1F407A" stroke-width="2.5"/>
  <circle cx="314" cy="341.5" r="3" fill="#1F407A"/>
  <circle cx="370" cy="337.8" r="3" fill="#1F407A"/>
  <circle cx="426" cy="332.5" r="3" fill="#1F407A"/>
  <circle cx="482" cy="325" r="3" fill="#1F407A"/>
  <circle cx="538" cy="310" r="3" fill="#1F407A"/>
  <circle cx="594" cy="295" r="3" fill="#1F407A"/>
  <circle cx="650" cy="258.7" r="4.5" fill="#1F407A" stroke="#ffffff" stroke-width="1.5"/>
  <text x="644" y="248" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="end">Expected: 2,967 TWh</text>

  <!-- SCENARIO 3: Best Case (Green) -->
  <polyline points="314,349 370,348.5 426,347.8 482,346.7 538,345.5 594,344.4 650,344" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="314" cy="349" r="3" fill="#16a34a"/>
  <circle cx="370" cy="348.5" r="3" fill="#16a34a"/>
  <circle cx="426" cy="347.8" r="3" fill="#16a34a"/>
  <circle cx="482" cy="346.7" r="3" fill="#16a34a"/>
  <circle cx="538" cy="345.5" r="3" fill="#16a34a"/>
  <circle cx="594" cy="344.4" r="3" fill="#16a34a"/>
  <circle cx="650" cy="344" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="644" y="360" font-size="8.5" font-weight="700" fill="#16a34a" text-anchor="end">Best: 700 TWh</text>

  <!-- RIGHT CARDS AREA: x from 675 to 940 (width 265) -->
  <g transform="translate(675, 40)">
    <rect x="0" y="0" width="265" height="375" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="265" height="24" rx="5" fill="#f1f5f9"/>
    <rect x="0" y="20" width="265" height="4" fill="#f1f5f9"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#334155" letter-spacing="0.4">PROJECTION SENSITIVITY ENVELOPE (2030)</text>

    <!-- Worst Case Chip -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="241" height="96" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <rect x="0" y="0" width="241" height="20" rx="4" fill="#fee2e2"/>
      <rect x="0" y="16" width="241" height="4" fill="#fee2e2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#b91c1c">WORST CASE · 7,933 TWh</text>
      <text x="10" y="34" font-size="7.5" fill="#7f1d1d">Workload: Unbounded algorithmic scaling</text>
      <text x="10" y="49" font-size="7.5" fill="#7f1d1d">Hardware: Silicon efficiency gains stall</text>
      <text x="10" y="64" font-size="7.5" fill="#7f1d1d">Cooling: Legacy air PUE persists &gt; 1.5</text>
      <text x="10" y="79" font-size="7.5" font-weight="700" fill="#b91c1c">Grid Load: Exceeds ~2× current US electricity</text>
    </g>

    <!-- Expected Case Chip -->
    <g transform="translate(12, 144)">
      <rect x="0" y="0" width="241" height="96" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <rect x="0" y="0" width="241" height="20" rx="4" fill="#EAF1F8"/>
      <rect x="0" y="16" width="241" height="4" fill="#EAF1F8"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#1F407A">EXPECTED CASE · 2,967 TWh</text>
      <text x="10" y="34" font-size="7.5" fill="#1e3a8a">Workload: Steady industrial adoption</text>
      <text x="10" y="49" font-size="7.5" fill="#1e3a8a">Hardware: Continued ~1.5× annual silicon gains</text>
      <text x="10" y="64" font-size="7.5" fill="#1e3a8a">Cooling: Gradual shift to liquid cooling</text>
      <text x="10" y="79" font-size="7.5" font-weight="700" fill="#1F407A">Grid Load: Consumes ~72% of US grid output</text>
    </g>

    <!-- Best Case Chip -->
    <g transform="translate(12, 252)">
      <rect x="0" y="0" width="241" height="96" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect x="0" y="0" width="241" height="20" rx="4" fill="#dcfce7"/>
      <rect x="0" y="16" width="241" height="4" fill="#dcfce7"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">BEST CASE · 700 TWh</text>
      <text x="10" y="34" font-size="7.5" fill="#166534">Workload: Radical quantization &amp; MoE sparsity</text>
      <text x="10" y="49" font-size="7.5" fill="#166534">Hardware: Specialized ultra-low-power ASICs</text>
      <text x="10" y="64" font-size="7.5" fill="#166534">Cooling: Full liquid cooling deployment (PUE &lt; 1.10)</text>
      <text x="10" y="79" font-size="7.5" font-weight="700" fill="#15803d">Grid Load: Contained within planned capacity</text>
    </g>

    <text x="132" y="364" font-size="7" fill="#64748b" text-anchor="middle">Source: Nature / IEA High-Growth Envelope Modeling</text>
  </g>
</svg>
