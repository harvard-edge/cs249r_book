<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <linearGradient id="envelope-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#EAF1F8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- LEFT PLOT AREA: x from 90 to 650 (width 560), y from 50 to 390 (height 340) -->
  <!-- X mapping: 2010 -> 90, 2012 -> 146, 2014 -> 202, 2016 -> 258, 2018 -> 314, 2020 -> 370, 2022 -> 426, 2024 -> 482, 2026 -> 538, 2028 -> 594, 2030 -> 650 -->
  <!-- Y mapping: 0 TWh -> 390, 2000 TWh -> 310, 4000 TWh -> 230, 6000 TWh -> 150, 8000 TWh -> 70 -->
  <!-- Formula: y = 390 - (TWh / 8000) * 320 -->

  <!-- Shaded Divergence Envelope (from 2018 to 2030) -->
  <!-- 2018: (314, 340) to (314, 367.6) -->
  <!-- 2020: (370, 326) to (370, 366.8) -->
  <!-- 2022: (426, 302) to (426, 366) -->
  <!-- 2024: (482, 270) to (482, 364.8) -->
  <!-- 2026: (538, 210) to (538, 363.6) -->
  <!-- 2028: (594, 150) to (594, 362.4) -->
  <!-- 2030: (650, 72.7) to (650, 362) -->
  <path d="M 314 340 L 370 326 L 426 302 L 482 270 L 538 210 L 594 150 L 650 72.7 L 650 362 L 594 362.4 L 538 363.6 L 482 364.8 L 426 366 L 370 366.8 L 314 367.6 Z" fill="url(#envelope-grad)"/>

  <!-- Horizontal Grid Lines & Y-axis labels -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="90" y1="390" x2="650" y2="390"/>
    <line x1="90" y1="310" x2="650" y2="310"/>
    <line x1="90" y1="230" x2="650" y2="230"/>
    <line x1="90" y1="150" x2="650" y2="150"/>
    <line x1="90" y1="70" x2="650" y2="70"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="end">
    <text x="80" y="393">0</text>
    <text x="80" y="313">2,000</text>
    <text x="80" y="233">4,000</text>
    <text x="80" y="153">6,000</text>
    <text x="80" y="73">8,000</text>
  </g>
  <text x="24" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90,24,230)">Global Data Center Electricity (TWh / yr)</text>

  <!-- X-axis Ticks & Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">
    <text x="90" y="408">2010</text>
    <text x="146" y="408">2012</text>
    <text x="202" y="408">2014</text>
    <text x="258" y="408">2016</text>
    <text x="314" y="408">2018</text>
    <text x="370" y="408">2020</text>
    <text x="426" y="408">2022</text>
    <text x="482" y="408">2024</text>
    <text x="538" y="408">2026</text>
    <text x="594" y="408">2028</text>
    <text x="650" y="408">2030</text>
  </g>
  <text x="370" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Projection Timeline (Years)</text>

  <!-- Axes lines -->
  <line x1="90" y1="50" x2="90" y2="390" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="90" y1="390" x2="650" y2="390" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Vertical Divergence Line at 2018 -->
  <line x1="314" y1="50" x2="314" y2="390" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="260" y="54" width="108" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="314" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Historical / Model Split</text>

  <!-- Global Reference Line: Total US Electricity ~4,000 TWh (y=230) -->
  <line x1="90" y1="230" x2="650" y2="230" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
  <rect x="100" y="218" width="140" height="18" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="170" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#475569" text-anchor="middle">Total US Electricity (~4,100 TWh)</text>

  <!-- Historical Segment (2010 to 2018): shared baseline -->
  <!-- 2010: (90, 370) -> 2012: (146, 369.6) -> 2014: (202, 369.2) -> 2016: (258, 368.4) -> 2018: (314, 367.6) -->
  <polyline points="90,370 146,369.6 202,369.2 258,368.4 314,367.6" fill="none" stroke="#475569" stroke-width="2.5"/>

  <!-- SCENARIO 1: Worst Case (Rose Red) -->
  <!-- 2018: 314, 340; 2020: 370, 326; 2022: 426, 302; 2024: 482, 270; 2026: 538, 210; 2028: 594, 150; 2030: 650, 72.7 -->
  <polyline points="314,340 370,326 426,302 482,270 538,210 594,150 650,72.7" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <!-- Points -->
  <circle cx="314" cy="340" r="3.5" fill="#dc2626"/>
  <circle cx="370" cy="326" r="3.5" fill="#dc2626"/>
  <circle cx="426" cy="302" r="3.5" fill="#dc2626"/>
  <circle cx="482" cy="270" r="3.5" fill="#dc2626"/>
  <circle cx="538" cy="210" r="3.5" fill="#dc2626"/>
  <circle cx="594" cy="150" r="3.5" fill="#dc2626"/>
  <circle cx="650" cy="72.7" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <text x="644" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#dc2626" text-anchor="end">Worst: 7,933 TWh</text>

  <!-- SCENARIO 2: Expected Case (Sky Blue) -->
  <!-- 2018: 314, 359.6; 2020: 370, 355.6; 2022: 426, 350; 2024: 482, 342; 2026: 538, 326; 2028: 594, 310; 2030: 650, 271.3 -->
  <polyline points="314,359.6 370,355.6 426,350 482,342 538,326 594,310 650,271.3" fill="none" stroke="#1F407A" stroke-width="2.5"/>
  <circle cx="314" cy="359.6" r="3" fill="#1F407A"/>
  <circle cx="370" cy="355.6" r="3" fill="#1F407A"/>
  <circle cx="426" cy="350" r="3" fill="#1F407A"/>
  <circle cx="482" cy="342" r="3" fill="#1F407A"/>
  <circle cx="538" cy="326" r="3" fill="#1F407A"/>
  <circle cx="594" cy="310" r="3" fill="#1F407A"/>
  <circle cx="650" cy="271.3" r="4.5" fill="#1F407A" stroke="#ffffff" stroke-width="1.5"/>
  <text x="644" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#1F407A" text-anchor="end">Expected: 2,967 TWh</text>

  <!-- SCENARIO 3: Best Case (Emerald Green) -->
  <!-- 2018: 314, 367.6; 2020: 370, 366.8; 2022: 426, 366; 2024: 482, 364.8; 2026: 538, 363.6; 2028: 594, 362.4; 2030: 650, 362 -->
  <polyline points="314,367.6 370,366.8 426,366 482,364.8 538,363.6 594,362.4 650,362" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="314" cy="367.6" r="3" fill="#16a34a"/>
  <circle cx="370" cy="366.8" r="3" fill="#16a34a"/>
  <circle cx="426" cy="366" r="3" fill="#16a34a"/>
  <circle cx="482" cy="364.8" r="3" fill="#16a34a"/>
  <circle cx="538" cy="363.6" r="3" fill="#16a34a"/>
  <circle cx="594" cy="362.4" r="3" fill="#16a34a"/>
  <circle cx="650" cy="362" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="644" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#16a34a" text-anchor="end">Best: 700 TWh</text>

  <!-- RIGHT CARDS AREA: x from 675 to 940 (width 265) -->
  <!-- Card 1: Scenario Breakdown Header -->
  <g transform="translate(675, 50)">
    <rect x="0" y="0" width="265" height="340" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="12" y="12" width="241" height="22" rx="2" fill="#e2e8f0"/>
    <text x="132" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">SENSITIVITY ENVELOPE (2030)</text>

    <!-- Worst Case Chip -->
    <g transform="translate(12, 44)">
      <rect x="0" y="0" width="241" height="80" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <rect x="8" y="8" width="90" height="16" rx="2" fill="#fee2e2"/>
      <text x="53" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">WORST CASE</text>
      <text x="106" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c">7,933 TWh</text>
      <text x="8" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">• Unbounded algorithmic compute surge</text>
      <text x="8" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">• Hardware efficiency scaling halts</text>
      <text x="8" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d">• Exceeds entire US electricity generation (~2×)</text>
    </g>

    <!-- Expected Case Chip -->
    <g transform="translate(12, 134)">
      <rect x="0" y="0" width="241" height="80" rx="3" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
      <rect x="8" y="8" width="90" height="16" rx="2" fill="#EAF1F8"/>
      <text x="53" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#14294E" text-anchor="middle">EXPECTED CASE</text>
      <text x="106" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#14294E">2,967 TWh</text>
      <text x="8" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#0c4a6e">• Steady exponential serving deployment</text>
      <text x="8" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#0c4a6e">• Continued ~1.5× annual silicon gains</text>
      <text x="8" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#0c4a6e">• Consumes ~72% of current US grid supply</text>
    </g>

    <!-- Best Case Chip -->
    <g transform="translate(12, 224)">
      <rect x="0" y="0" width="241" height="80" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <rect x="8" y="8" width="90" height="16" rx="2" fill="#dcfce7"/>
      <text x="53" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">BEST CASE</text>
      <text x="106" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#15803d">700 TWh</text>
      <text x="8" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">• Radical quantization, sparsity &amp; small models</text>
      <text x="8" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">• Full data center PUE optimization to 1.10</text>
      <text x="8" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#166534">• Contained within manageable grid margin</text>
    </g>

    <!-- Bottom Takeaway Badge -->
    <text x="132" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">Source: Nature / IEA High-Growth Envelope Modeling</text>
  </g>

  <!-- FOOTER NOTE -->
  <text x="370" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Note: Shaded region represents projection uncertainty across 2018–2030; lines reflect varying assumptions on hardware efficiency vs. workload growth.</text>
</svg>
