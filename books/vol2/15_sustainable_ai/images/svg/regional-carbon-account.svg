<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Input: Facility Energy -->
  <rect x="25" y="30" width="185" height="60" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="117.5" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Facility energy</text>

  <!-- Branches to Region A & B Factors (Purple) -->
  <path d="M210 60 H250" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M210 60 H230 V195 H250" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="250" y="30" width="180" height="60" rx="4" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="340" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">Region A factor</text>

  <rect x="250" y="165" width="180" height="60" rx="4" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="340" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">Region B factor</text>

  <!-- Outputs: Carbon A & B -->
  <path d="M430 60 H480" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M430 195 H480" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="480" y="30" width="175" height="60" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="567.5" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Carbon, A</text>

  <rect x="480" y="165" width="175" height="60" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="567.5" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Carbon, B</text>

  <!-- Footer Note Badge -->
  <rect x="170" y="250" width="340" height="24" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="340" y="266" text-anchor="middle" font-size="10" font-weight="600" fill="#475569" letter-spacing="0.3">SAME PERIOD · UNITS · EMISSIONS BOUNDARY</text>
</svg>
