<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#15803d"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- LEFT: BENCHMARK WORKLOAD (width 240) -->
  <g transform="translate(25, 20)">
    <rect width="240" height="310" rx="3" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2"/>
    <text x="120" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">Standardized Workload Demand</text>

    <!-- Energy Consumption Callout -->
    <g transform="translate(15, 38)">
      <rect width="210" height="110" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Facility Electricity Demand:</text>
      <text x="12" y="46" font-size="18" font-weight="700" fill="#1F407A">10,000 kWh</text>
      <text x="12" y="64" font-size="8.5" fill="#475569">(10 MWh facility consumption)</text>
      <text x="12" y="84" font-size="7.5" fill="#64748b">• Fixed model architecture &amp; tokens</text>
      <text x="12" y="98" font-size="7.5" fill="#64748b">• Identical compute cluster hardware</text>
    </g>

    <!-- Accounting Controls Note -->
    <g transform="translate(15, 160)">
      <rect width="210" height="135" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#334155">Accounting Controls:</text>
      <text x="12" y="34" font-size="8" fill="#475569">• Matched temporal time window</text>
      <text x="12" y="48" font-size="8" fill="#475569">• Consistent Scope 2 emissions rule</text>
      <text x="12" y="62" font-size="8" fill="#475569">• Local PUE variations factored</text>
      <text x="12" y="76" font-size="8" fill="#475569">• Network transfer footprint added</text>
      <text x="12" y="100" font-size="7.5" font-weight="600" fill="#1F407A">Holds compute work constant</text>
      <text x="12" y="112" font-size="7.5" font-weight="600" fill="#1F407A">to isolate regional grid impact</text>
    </g>
  </g>

  <!-- BRANCHING TRUNK -->
  <line x1="265" y1="175" x2="305" y2="175" stroke="#475569" stroke-width="1.5"/>
  <path d="M 305 175 V 95 H 335" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 305 175 V 255 H 335" fill="none" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- RIGHT TOP: REGION A (width 435, usable 405) -->
  <g transform="translate(340, 20)">
    <rect width="435" height="145" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="15" y="24" font-size="10" font-weight="700" fill="#15803d">Region A: Low-Carbon Grid (e.g., Hydro / Nuclear / Nordic)</text>

    <text x="15" y="48" font-size="9" fill="#166534"><tspan font-weight="700">Grid Emission Factor:</tspan> 25 g CO₂eq / kWh</text>
    <text x="15" y="66" font-size="8" fill="#334155">• Generation Mix: 85% Hydroelectric, 10% Nuclear, 5% Wind</text>
    <text x="15" y="80" font-size="8" fill="#334155">• Datacenter PUE: 1.10 (Cool ambient climate minimizes chiller load)</text>

    <!-- Calculation Pill -->
    <g transform="translate(15, 94)">
      <rect width="405" height="40" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">Total Emissions: 10,000 kWh × 25 g/kWh = 250 kg CO₂eq (0.25 t)</text>
      <text x="12" y="30" font-size="8" font-weight="600" fill="#166534">✓ 94% LOWER EMISSIONS FOR IDENTICAL WORKLOAD RUN</text>
    </g>
  </g>

  <!-- RIGHT BOTTOM: REGION B (width 435, usable 405) -->
  <g transform="translate(340, 185)">
    <rect width="435" height="145" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="15" y="24" font-size="10" font-weight="700" fill="#b91c1c">Region B: Fossil-Dominated Grid (e.g., Coal &amp; Gas Baseload)</text>

    <text x="15" y="48" font-size="9" fill="#991b1b"><tspan font-weight="700">Grid Emission Factor:</tspan> 450 g CO₂eq / kWh</text>
    <text x="15" y="64" font-size="8" fill="#334155">• Generation Mix: 55% Natural Gas, 30% Coal, 15% Solar/Wind</text>
    <text x="15" y="78" font-size="8" fill="#334155">• Datacenter PUE: 1.25 (Higher ambient cooling burden)</text>

    <!-- Calculation Pill -->
    <g transform="translate(15, 92)">
      <rect width="405" height="40" rx="2" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#b91c1c">Total Emissions: 10,000 kWh × 450 g/kWh = 4,500 kg CO₂eq (4.50 t)</text>
      <text x="12" y="30" font-size="8" font-weight="600" fill="#991b1b">✗ 18× HIGHER EMISSIONS FOR IDENTICAL WORKLOAD RUN</text>
    </g>
  </g>
</svg>
