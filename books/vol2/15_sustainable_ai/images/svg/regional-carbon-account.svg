<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Top Header Banner Pill -->
  <rect x="185.0" y="18" width="630" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500.0" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.2px">GEOGRAPHIC CARBON ACCOUNTING · REGIONAL GRID INTENSITY COMPARISON</text>
  <!-- Left Source: Identical Workload Demand -->
  <rect x="40" y="65" width="280" height="425" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="78" width="145" height="26" rx="4" fill="#0f172a"/>
  <text x="127" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.8px">BENCHMARK LOAD</text>
  <text x="55" y="130" font-size="14" font-weight="700" fill="#0f172a">Identical Workload Demand</text>
  <text x="55" y="150" font-size="11" fill="#64748b">Standardized training / inference workload</text>
  <rect x="55" y="172" width="250" height="150" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="195" font-size="12" font-weight="700" fill="#1e293b">Facility Electricity:</text>
  <text x="70" y="218" font-size="16" font-weight="700" fill="#2563eb">10,000 kWh</text>
  <text x="70" y="236" font-size="11" fill="#64748b">(10 MWh facility consumption)</text>
  <text x="70" y="260" font-size="11" fill="#475569">• Identical model architecture</text>
  <text x="70" y="278" font-size="11" fill="#475569">• Identical training tokens</text>
  <text x="70" y="296" font-size="11" fill="#475569">• Identical compute cluster hardware</text>
  <rect x="55" y="335" width="250" height="140" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="358" font-size="11" font-weight="700" fill="#334155">ACCOUNTING HYGIENE</text>
  <text x="70" y="378" font-size="11" fill="#475569">• Matched temporal window</text>
  <text x="70" y="396" font-size="11" fill="#475569">• Consistent Scope 2 boundary</text>
  <text x="70" y="414" font-size="11" fill="#475569">• Local PUE variations accounted</text>
  <text x="70" y="432" font-size="11" fill="#475569">• Network transfer energy added</text>
  <text x="70" y="454" font-size="10" font-weight="600" fill="#b91c1c">Holds work constant to isolate grid</text>
  <line x1="320" y1="220" x2="360" y2="220" stroke="#64748b" stroke-width="2"/>
  <path d="M 360 220 L 360 160 L 400 160" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 360 220 L 360 380 L 400 380" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <!-- Region A (Clean Grid) -->
  <rect x="400" y="65" width="560" height="195" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="415" y="78" width="130" height="26" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="480" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#166534" letter-spacing="0.8px">REGION A</text>
  <text x="560" y="96" font-size="14" font-weight="700" fill="#166534">Low-Carbon Grid (e.g., Hydro / Nuclear / Nordic)</text>
  <rect x="415" y="115" width="530" height="130" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="430" y="138" font-size="12" font-weight="700" fill="#0f172a">Grid Emission Factor: 25 gCO2eq / kWh</text>
  <text x="430" y="158" font-size="11" fill="#475569">• Generation Mix: 85% Hydroelectric, 10% Nuclear, 5% Wind</text>
  <text x="430" y="176" font-size="11" fill="#475569">• Local Datacenter PUE: 1.10 (Cool ambient climate reduces chiller burden)</text>
  <rect x="430" y="190" width="500" height="42" rx="4" fill="#dcfce7"/>
  <text x="445" y="208" font-size="11" font-weight="700" fill="#166534">Total Emissions: 10,000 kWh × 25 g/kWh = 250 kg CO2eq (0.25 t CO2eq)</text>
  <text x="445" y="222" font-size="10" font-weight="700" fill="#16a34a">✓ 94% LOWER EMISSIONS FOR IDENTICAL COMPUTATIONAL WORK</text>
  <!-- Region B (Fossil-Heavy Grid) -->
  <rect x="400" y="285" width="560" height="205" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="415" y="298" width="130" height="26" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="480" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b" letter-spacing="0.8px">REGION B</text>
  <text x="560" y="316" font-size="14" font-weight="700" fill="#991b1b">Fossil-Dominated Grid (e.g., Coal &amp; Gas Baseload)</text>
  <rect x="415" y="335" width="530" height="140" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="430" y="358" font-size="12" font-weight="700" fill="#0f172a">Grid Emission Factor: 450 gCO2eq / kWh</text>
  <text x="430" y="378" font-size="11" fill="#475569">• Generation Mix: 55% Natural Gas, 30% Coal, 15% Solar/Wind</text>
  <text x="430" y="396" font-size="11" fill="#475569">• Local Datacenter PUE: 1.25 (Higher ambient cooling load)</text>
  <rect x="430" y="412" width="500" height="50" rx="4" fill="#fee2e2"/>
  <text x="445" y="430" font-size="11" font-weight="700" fill="#991b1b">Total Emissions: 10,000 kWh × 450 g/kWh = 4,500 kg CO2eq (4.50 t CO2eq)</text>
  <text x="445" y="448" font-size="11" font-weight="700" fill="#dc2626">✗ 18× HIGHER EMISSIONS FOR IDENTICAL WORKLOAD RUN</text>
  <!-- Bottom Takeaway Card -->
  <rect x="40" y="505" width="920" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="518" width="165" height="24" rx="4" fill="#0f172a"/>
  <text x="137" y="534" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.8px">SYSTEMS LESSON</text>
  <text x="235" y="535" font-size="13" font-weight="700" fill="#0f172a">Geography Often Outweighs Microarchitectural Optimization</text>
  <text x="55" y="562" font-size="11" fill="#475569">• An 18× carbon swing from grid location dwarfs typical 15–30% compiler or kernel performance optimizations.</text>
  <text x="55" y="580" font-size="11" fill="#475569">• Placement decisions must also account for WAN data transfer footprint, wide-area network latency, and regional data residency mandates.</text>
</svg>