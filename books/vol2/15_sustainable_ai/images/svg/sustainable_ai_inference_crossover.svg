<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="75pt" viewBox="0 0 180 150" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="150" fill="#ffffff"/>
  <!-- Schematic: emissions over a model's service life. -->
  <path d="M 10 8 V 136 H 176" fill="none" stroke="#cccccc" stroke-width="1.6"/>
  <!-- Training: one-time cost, flat -->
  <line x1="10" y1="88" x2="166" y2="88" stroke="#666666" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="166" cy="88" r="4.5" fill="#666666"/>
  <!-- Inference: cumulative, from zero at deployment -->
  <line x1="11" y1="135" x2="166" y2="22" stroke="#e67817" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="166" cy="22" r="4.5" fill="#e67817"/>
  <!-- Crossover -->
  <circle cx="75.5" cy="88" r="5" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <text x="14" y="26" font-size="13" fill="#b8600f">Inference</text>
  <text x="14" y="42" font-size="13" fill="#b8600f">(cumulative)</text>
  <text x="166" y="108" font-size="13" fill="#555555" text-anchor="end">Training (once)</text>
</svg>
