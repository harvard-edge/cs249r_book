<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="540" height="480" fill="#ffffff"/>
<g transform="translate(5,0)">

  <!-- ===== Concentric reporting boundaries, centered at (240, 240) ===== -->
  <!-- Scope 3: value chain (upstream manufacturing, downstream end of life) -->
  <circle cx="240" cy="240" r="220" fill="#E3D3C8" fill-opacity="0.45" stroke="#78492A" stroke-width="1.5"/>
  <!-- Scope 2: purchased energy -->
  <circle cx="240" cy="240" r="132" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <!-- Scope 1: direct, on site -->
  <circle cx="240" cy="240" r="72" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>

  <!-- ===== Scope 1 (center): a server rack stands for the data center ===== -->
  <rect x="226" y="172" width="28" height="44" rx="1.5" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <g fill="#cbd5e1" stroke="#64748b" stroke-width="0.6">
    <rect x="230" y="176" width="20" height="6"/>
    <rect x="230" y="185" width="20" height="6"/>
    <rect x="230" y="194" width="20" height="6"/>
    <rect x="230" y="203" width="20" height="6"/>
  </g>
  <g fill="#475569">
    <circle cx="246.5" cy="179" r="1"/>
    <circle cx="246.5" cy="188" r="1"/>
    <circle cx="246.5" cy="197" r="1"/>
    <circle cx="246.5" cy="206" r="1"/>
  </g>
  <text x="240" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Scope 1</text>
  <text x="240" y="252" text-anchor="middle" font-size="12.5" fill="#334155">diesel generators</text>
  <text x="240" y="272" text-anchor="middle" font-size="12.5" fill="#334155">fleet vehicles</text>

  <!-- ===== Scope 2 (middle ring) ===== -->
  <text x="240" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Scope 2</text>
  <text x="240" y="150" text-anchor="middle" font-size="12.5" fill="#9a4a0b">purchased energy</text>
  <text x="240" y="336" text-anchor="middle" font-size="12.5" fill="#334155">grid electricity</text>
  <text x="240" y="352" text-anchor="middle" font-size="12.5" fill="#334155">for IT and cooling</text>

  <!-- ===== Scope 3 (outer ring): one source per position ===== -->
  <text x="240" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Scope 3</text>
  <text x="240" y="63" text-anchor="middle" font-size="12.5" fill="#5c3720">value chain</text>
  <!-- upstream: upper left, where the band is widest horizontally -->
  <text x="116" y="116" text-anchor="middle" font-size="12.5" fill="#334155">semiconductor</text>
  <text x="116" y="132" text-anchor="middle" font-size="12.5" fill="#334155">fabrication</text>
  <!-- downstream: upper right -->
  <text x="364" y="116" text-anchor="middle" font-size="12.5" fill="#334155">end-of-life</text>
  <text x="364" y="132" text-anchor="middle" font-size="12.5" fill="#334155">recycling</text>
  <!-- bottom -->
  <text x="240" y="420" text-anchor="middle" font-size="12.5" fill="#334155">employee travel</text>

  <!-- ===== Control gradient: radial, from the Scope 1 edge out across both rings ===== -->
  <!-- dots sit exactly on the Scope 2 and Scope 3 boundaries; the head clears the outer ring -->
  <line x1="291" y1="291" x2="413" y2="413" stroke="#475569" stroke-width="1.3"/>
  <path d="M421,421 L409.7,417.5 L417.5,409.7 Z" fill="#475569"/>
  <circle cx="333.3" cy="333.3" r="2.6" fill="#475569"/>
  <circle cx="395.6" cy="395.6" r="2.6" fill="#475569"/>
  <text x="428" y="436" font-size="12.5" fill="#334155">farther from</text>
  <text x="428" y="452" font-size="12.5" fill="#334155">direct control</text>
</g>
</svg>
