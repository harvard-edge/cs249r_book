<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="-15 0 645 420">
  <rect x="-15" width="645" height="420" fill="#ffffff"/>

  <!-- Concentric scopes, centered at (195, 210) -->
  <circle cx="195" cy="210" r="190" fill="#fafafa" stroke="#999999" stroke-width="1.5"/>
  <circle cx="195" cy="210" r="128" fill="#f0f0f0" stroke="#777777" stroke-width="1.5"/>
  <circle cx="195" cy="210" r="70" fill="#e2e2e2" stroke="#555555" stroke-width="1.5"/>

  <!-- Ring labels -->
  <text x="195" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Scope 3</text>
  <text x="195" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Scope 2</text>

  <!-- Center: data center icon and Scope 1 label -->
  <rect x="174" y="178" width="42" height="32" fill="#F8FAFC" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="178" y="183" width="16" height="5" fill="#cbd5e1"/>
  <rect x="178" y="191" width="16" height="5" fill="#cbd5e1"/>
  <rect x="178" y="199" width="16" height="5" fill="#cbd5e1"/>
  <rect x="197" y="183" width="16" height="5" fill="#cbd5e1"/>
  <rect x="197" y="191" width="16" height="5" fill="#cbd5e1"/>
  <rect x="197" y="199" width="16" height="5" fill="#cbd5e1"/>
  <text x="195" y="232" text-anchor="middle" font-size="11.5" fill="#333">data center</text>
  <text x="195" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Scope 1</text>

  <!-- Leaders: dot in each band to its callout -->
  <circle cx="200" cy="150" r="3.5" fill="#555"/>
  <line x1="200" y1="150" x2="410" y2="150" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="290" cy="235" r="3.5" fill="#555"/>
  <line x1="290" y1="235" x2="410" y2="235" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="300" cy="330" r="3.5" fill="#555"/>
  <line x1="300" y1="330" x2="410" y2="330" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Scope 1 callout -->
  <rect x="410" y="118" width="200" height="64" rx="3" fill="#e2e2e2" stroke="#555" stroke-width="1.2"/>
  <text x="422" y="139" font-size="12" font-weight="bold" fill="#333">Scope 1 · direct</text>
  <text x="422" y="157" font-size="11.5" fill="#333">On-site diesel generators</text>
  <text x="422" y="173" font-size="11.5" fill="#333">Company vehicles</text>

  <!-- Scope 2 callout -->
  <rect x="410" y="203" width="200" height="64" rx="3" fill="#f0f0f0" stroke="#777777" stroke-width="1.2"/>
  <text x="422" y="224" font-size="12" font-weight="bold" fill="#333">Scope 2 · purchased energy</text>
  <text x="422" y="242" font-size="11.5" fill="#333">Grid electricity for IT</text>
  <text x="422" y="258" font-size="11.5" fill="#333">Grid electricity for cooling</text>

  <!-- Scope 3 callout -->
  <rect x="410" y="281" width="200" height="98" rx="3" fill="#fafafa" stroke="#999999" stroke-width="1.2"/>
  <text x="422" y="302" font-size="12" font-weight="bold" fill="#333">Scope 3 · value chain</text>
  <text x="422" y="320" font-size="11.5" fill="#333">Chip and server manufacturing</text>
  <text x="422" y="336" font-size="11.5" fill="#333">Embodied hardware carbon</text>
  <text x="422" y="352" font-size="11.5" fill="#333">Employee travel</text>
  <text x="422" y="368" font-size="11.5" fill="#333">End-of-life recycling</text>
</svg>
