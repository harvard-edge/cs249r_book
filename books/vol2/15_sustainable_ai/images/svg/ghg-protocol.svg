<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="540" height="460" fill="#ffffff"/>

  <!-- ===== Concentric reporting boundaries, centered at (230, 230) ===== -->
  <!-- Scope 3: value chain (upstream manufacturing, downstream end of life) -->
  <circle cx="230" cy="230" r="195" fill="#E3D3C8" fill-opacity="0.45" stroke="#78492A" stroke-width="1.5"/>
  <!-- Scope 2: purchased energy -->
  <circle cx="230" cy="230" r="128" fill="#FCE4CC" stroke="#E67817" stroke-width="1.5"/>
  <!-- Scope 1: direct, on site -->
  <circle cx="230" cy="230" r="68" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>

  <!-- ===== Scope 1 (center) ===== -->
  <rect x="212" y="178" width="36" height="26" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="216" y="182" width="13" height="4" fill="#cbd5e1"/>
  <rect x="216" y="189" width="13" height="4" fill="#cbd5e1"/>
  <rect x="216" y="196" width="13" height="4" fill="#cbd5e1"/>
  <rect x="231" y="182" width="13" height="4" fill="#cbd5e1"/>
  <rect x="231" y="189" width="13" height="4" fill="#cbd5e1"/>
  <rect x="231" y="196" width="13" height="4" fill="#cbd5e1"/>
  <text x="230" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Scope 1</text>
  <text x="230" y="244" text-anchor="middle" font-size="12.5" fill="#334155">on-site diesel</text>
  <text x="230" y="260" text-anchor="middle" font-size="12.5" fill="#334155">vehicles</text>

  <!-- ===== Scope 2 (middle ring) ===== -->
  <text x="230" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Scope 2</text>
  <text x="230" y="144" text-anchor="middle" font-size="12.5" fill="#9a4a0b">purchased energy</text>
  <text x="230" y="322" text-anchor="middle" font-size="12.5" fill="#334155">grid electricity</text>
  <text x="230" y="338" text-anchor="middle" font-size="12.5" fill="#334155">for IT and cooling</text>

  <!-- ===== Scope 3 (outer ring) ===== -->
  <text x="230" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Scope 3</text>
  <text x="230" y="81" text-anchor="middle" font-size="12.5" fill="#5c3720">value chain</text>
  <text x="69" y="224" text-anchor="middle" font-size="12.5" fill="#334155">chip and</text>
  <text x="69" y="240" text-anchor="middle" font-size="12.5" fill="#334155">server fab</text>
  <text x="391" y="224" text-anchor="middle" font-size="12.5" fill="#334155">end-of-life</text>
  <text x="391" y="240" text-anchor="middle" font-size="12.5" fill="#334155">recycling</text>
  <text x="200" y="382" text-anchor="middle" font-size="12.5" fill="#334155">embodied hardware carbon</text>
  <text x="200" y="398" text-anchor="middle" font-size="12.5" fill="#334155">employee travel</text>

  <!-- ===== Control gradient: radial, from the Scope 1 edge out across both rings ===== -->
  <line x1="279" y1="279" x2="397" y2="397" stroke="#475569" stroke-width="1.3"/>
  <path d="M403,403 L391.7,399.5 L399.5,391.7 Z" fill="#475569"/>
  <circle cx="320.5" cy="320.5" r="2.6" fill="#475569"/>
  <circle cx="367.9" cy="367.9" r="2.6" fill="#475569"/>
  <text x="414" y="408" font-size="12.5" fill="#334155">farther from</text>
  <text x="414" y="424" font-size="12.5" fill="#334155">direct control</text>
</svg>
