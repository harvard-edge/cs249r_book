<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420">
  <rect width="620" height="420" fill="#fff"/>

  <!-- Concentric scopes, centered at (195, 210) -->
  <circle cx="195" cy="210" r="190" fill="#EAF1F8" stroke="#1F407A" stroke-width="2.2"/>
  <circle cx="195" cy="210" r="128" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
  <circle cx="195" cy="210" r="70" fill="#e2e8f0" stroke="#475569" stroke-width="2.2"/>

  <!-- Ring labels -->
  <text x="195" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F407A">Scope 3</text>
  <text x="195" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">Scope 2</text>

  <!-- Center: data center icon and Scope 1 label -->
  <rect x="174" y="178" width="42" height="32" fill="#F8FAFC" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="178" y="183" width="16" height="5" fill="#cbd5e1"/>
  <rect x="178" y="191" width="16" height="5" fill="#cbd5e1"/>
  <rect x="178" y="199" width="16" height="5" fill="#cbd5e1"/>
  <rect x="197" y="183" width="16" height="5" fill="#cbd5e1"/>
  <rect x="197" y="191" width="16" height="5" fill="#cbd5e1"/>
  <rect x="197" y="199" width="16" height="5" fill="#cbd5e1"/>
  <text x="195" y="232" text-anchor="middle" font-size="11.5" fill="#334155">data center</text>
  <text x="195" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Scope 1</text>

  <!-- Leaders: dot in each band to its callout -->
  <circle cx="200" cy="150" r="3.5" fill="#475569"/>
  <line x1="200" y1="150" x2="410" y2="150" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="290" cy="235" r="3.5" fill="#B45309"/>
  <line x1="290" y1="235" x2="410" y2="235" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="300" cy="330" r="3.5" fill="#1F407A"/>
  <line x1="300" y1="330" x2="410" y2="330" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Scope 1 callout -->
  <rect x="410" y="118" width="200" height="64" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="422" y="139" font-size="12" font-weight="bold" fill="#334155">Scope 1 · direct</text>
  <text x="422" y="157" font-size="11.5" fill="#334155">On-site diesel generators</text>
  <text x="422" y="173" font-size="11.5" fill="#334155">Company vehicles</text>

  <!-- Scope 2 callout -->
  <rect x="410" y="203" width="200" height="64" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="422" y="224" font-size="12" font-weight="bold" fill="#92400E">Scope 2 · purchased energy</text>
  <text x="422" y="242" font-size="11.5" fill="#92400E">Grid electricity for IT</text>
  <text x="422" y="258" font-size="11.5" fill="#92400E">Grid electricity for cooling</text>

  <!-- Scope 3 callout -->
  <rect x="410" y="281" width="200" height="98" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="422" y="302" font-size="12" font-weight="bold" fill="#1F407A">Scope 3 · value chain</text>
  <text x="422" y="320" font-size="11.5" fill="#1F407A">Chip and server manufacturing</text>
  <text x="422" y="336" font-size="11.5" fill="#1F407A">Embodied hardware carbon</text>
  <text x="422" y="352" font-size="11.5" fill="#1F407A">Employee travel</text>
  <text x="422" y="368" font-size="11.5" fill="#1F407A">End-of-life recycling</text>
</svg>
