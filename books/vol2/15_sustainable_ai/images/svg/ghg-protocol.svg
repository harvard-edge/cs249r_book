<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 465">
  <rect width="680" height="465" fill="#fff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
  </defs>
  <!-- ── Three concentric circles ── -->
  <!-- Scope 3 (outermost, blue) -->
  <circle cx="340" cy="215" r="190" fill="#EAF1F8" opacity="0.55" stroke="#1F407A" stroke-width="2.5"/>

  <!-- Scope 2 (middle, orange) -->
  <circle cx="340" cy="215" r="135" fill="#FEF3C7" opacity="0.70" stroke="#D97706" stroke-width="2.5"/>

  <!-- Scope 1 (innermost, red) -->
  <circle cx="340" cy="215" r="78" fill="#FEE2E2" opacity="0.85" stroke="#c44" stroke-width="2.5"/>

  <!-- Center: Data Center icon -->
  <rect x="314" y="192" width="52" height="40" fill="#F8FAFC" stroke="#bbb" stroke-width="1.5"/>
  <!-- Server racks inside -->
  <rect x="318" y="197" width="20" height="6" fill="#EAF1F8"/>
  <rect x="318" y="206" width="20" height="6" fill="#EAF1F8"/>
  <rect x="318" y="215" width="20" height="6" fill="#DCFCE7"/>
  <rect x="341" y="197" width="20" height="6" fill="#EAF1F8"/>
  <rect x="341" y="206" width="20" height="6" fill="#DCFCE7"/>
  <rect x="341" y="215" width="20" height="6" fill="#FEF3C7"/>
  <!-- Antenna on top -->
  <line x1="340" y1="192" x2="340" y2="182" stroke="#bbb" stroke-width="1.5"/>
  <circle cx="340" cy="180" r="3" fill="#bbb"/>

  <!-- Center label -->
  <text x="340" y="248" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Data Center</text>
  <text x="340" y="260" text-anchor="middle" font-size="9" fill="#555">/ AI System</text>

  <!-- ── Scope 1 Label ── -->
  <text x="340" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#DC2626">Scope 1</text>
  <text x="340" y="173" text-anchor="middle" font-size="10" fill="#c44">Direct Emissions</text>

  <!-- ── Scope 1 Examples (callout right) ── -->
  <line x1="418" y1="215" x2="457" y2="215" stroke="#c44" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="457" y="192" width="155" height="50" fill="#FEE2E2" stroke="#c44" stroke-width="1.2"/>
  <text x="534.5" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">Scope 1 — Direct</text>
  <text x="534.5" y="224" text-anchor="middle" font-size="10" fill="#c44">On-site diesel generators</text>
  <text x="534.5" y="236" text-anchor="middle" font-size="10" fill="#c44">Backup power, company vehicles</text>

  <!-- ── Scope 2 Label ── -->
  <text x="215" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97706">Scope 2</text>
  <text x="215" y="188" text-anchor="middle" font-size="10" fill="#D97706">Indirect Energy</text>

  <!-- ── Scope 2 Examples (callout left) ── -->
  <line x1="210.5" y1="253" x2="200" y2="253" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="20" y="228" width="180" height="50" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="110" y="246" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97706">Scope 2 — Indirect</text>
  <text x="110" y="260" text-anchor="middle" font-size="10" fill="#D97706">Grid electricity purchased</text>
  <text x="110" y="272" text-anchor="middle" font-size="10" fill="#D97706">Cooling system power</text>

  <!-- ── Scope 3 Label ── -->
  <text x="340" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F407A">Scope 3 — Value Chain Emissions</text>

  <!-- ── Scope 3 Examples — distributed around outer ring ── -->
  <!-- Top-left: Supply chain -->
  <line x1="216" y1="71" x2="192" y2="71" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="24" y="55" width="168" height="32" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="108" y="70" text-anchor="middle" font-size="10" fill="#1F407A">Supply chain manufacturing</text>
  <text x="108" y="82" text-anchor="middle" font-size="10" fill="#1F407A">chips, servers, cooling units</text>

  <!-- Top-right: Embodied carbon -->
  <line x1="464" y1="71" x2="488" y2="71" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="488" y="55" width="165" height="32" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="570.5" y="70" text-anchor="middle" font-size="10" fill="#1F407A">Embodied carbon in hardware</text>
  <text x="570.5" y="82" text-anchor="middle" font-size="10" fill="#1F407A">GPU, memory, PCBs</text>

  <!-- Bottom: Employee travel + data disposal -->
  <line x1="340" y1="405" x2="340" y2="415" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="175" y="415" width="330" height="36" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="340" y="431" text-anchor="middle" font-size="10" fill="#1F407A">Employee travel · data disposal</text>
  <text x="340" y="445" text-anchor="middle" font-size="10" fill="#1F407A">end-of-life recycling</text>

</svg>
