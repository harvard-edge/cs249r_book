<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Top Header Banner Pill -->
  <rect x="185.0" y="18" width="630" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500.0" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.2px">FACILITY ENERGY ACCOUNTING · COMPUTATIONAL WORK TO FACILITY DEMAND</text>
  <!-- Stage 1: Workload & Efficiency -->
  <rect x="40" y="75" width="310" height="395" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="88" width="130" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.8px">STAGE 1</text>
  <text x="195" y="106" font-size="14" font-weight="700" fill="#0f172a">Workload &amp; Efficiency</text>
  <rect x="55" y="125" width="280" height="115" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="70" y="148" font-size="12" font-weight="700" fill="#1e40af">Useful Computational Work (W)</text>
  <text x="70" y="168" font-size="11" fill="#475569">• Algorithmic FLOPs required</text>
  <text x="70" y="186" font-size="11" fill="#475569">• Processed training / inference tokens</text>
  <text x="70" y="204" font-size="11" fill="#475569">• Model parameter passes</text>
  <text x="70" y="224" font-size="10" font-weight="600" fill="#2563eb">Excludes idle overhead &amp; retries</text>
  <text x="195" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">÷ (divided by)</text>
  <rect x="55" y="275" width="280" height="120" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="70" y="298" font-size="12" font-weight="700" fill="#166534">Realized System Efficiency (η)</text>
  <text x="70" y="318" font-size="11" fill="#475569">• Model FLOPs / Joule (realized)</text>
  <text x="70" y="336" font-size="11" fill="#475569">• Accounts for MFU (e.g. 40–55%)</text>
  <text x="70" y="354" font-size="11" fill="#475569">• Includes memory stalls &amp; all-reduce</text>
  <text x="70" y="374" font-size="10" font-weight="600" fill="#16a34a">Excludes datacenter facility cooling</text>
  <rect x="55" y="408" width="280" height="48" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="195" y="428" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">E_IT = W_useful / η_realized</text>
  <text x="195" y="444" text-anchor="middle" font-size="10" fill="#64748b">Calculates raw IT energy consumed</text>
  <path d="M 350 272 L 390 272" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- Stage 2: IT Energy Boundary -->
  <rect x="390" y="75" width="260" height="395" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="405" y="88" width="130" height="26" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="470" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.8px">STAGE 2</text>
  <text x="405" y="138" font-size="14" font-weight="700" fill="#1e40af">IT Equipment Energy</text>
  <text x="405" y="156" font-size="11" fill="#64748b">Server chassis electrical draw (E_IT)</text>
  <rect x="405" y="172" width="230" height="284" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="420" y="196" font-size="12" font-weight="700" fill="#0f172a">Server Power Breakdown:</text>
  <rect x="420" y="210" width="200" height="42" rx="4" fill="#eff6ff"/>
  <text x="430" y="227" font-size="11" font-weight="700" fill="#1e40af">Accelerators (70–80%)</text>
  <text x="430" y="242" font-size="10" fill="#475569">GPU / TPU matrix cores, HBM</text>
  <rect x="420" y="260" width="200" height="42" rx="4" fill="#f8fafc"/>
  <text x="430" y="277" font-size="11" font-weight="700" fill="#334155">Host CPUs &amp; RAM (12–18%)</text>
  <text x="430" y="292" font-size="10" fill="#475569">Data loader pipelines, OS</text>
  <rect x="420" y="310" width="200" height="42" rx="4" fill="#f8fafc"/>
  <text x="430" y="327" font-size="11" font-weight="700" fill="#334155">Network &amp; Interconnect (6–10%)</text>
  <text x="430" y="342" font-size="10" fill="#475569">NICs, optical transceivers</text>
  <rect x="420" y="360" width="200" height="42" rx="4" fill="#f8fafc"/>
  <text x="430" y="377" font-size="11" font-weight="700" fill="#334155">Storage &amp; Fans (3–5%)</text>
  <text x="430" y="392" font-size="10" fill="#475569">Local NVMe drives, chassis fans</text>
  <text x="420" y="430" font-size="10" font-weight="600" fill="#2563eb">Measured at PDU / rack power tap</text>
  <text x="420" y="444" font-size="10" fill="#64748b">Excludes external chiller plant</text>
  <path d="M 650 272 L 700 272" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="653" y="235" width="45" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="675" y="251" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">× PUE</text>
  <!-- Stage 3: Total Facility Energy -->
  <rect x="700" y="75" width="260" height="395" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="715" y="88" width="130" height="26" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="780" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" letter-spacing="0.8px">STAGE 3</text>
  <text x="715" y="138" font-size="14" font-weight="700" fill="#92400e">Total Facility Energy</text>
  <text x="715" y="156" font-size="11" fill="#64748b">E_facility = E_IT × PUE</text>
  <rect x="715" y="172" width="230" height="284" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
  <text x="730" y="196" font-size="12" font-weight="700" fill="#0f172a">Facility Overhead Added:</text>
  <rect x="730" y="210" width="200" height="42" rx="4" fill="#fffbeb"/>
  <text x="740" y="227" font-size="11" font-weight="700" fill="#92400e">Cooling Plant (8–15%)</text>
  <text x="740" y="242" font-size="10" fill="#475569">Chillers, cooling towers, pumps</text>
  <rect x="730" y="260" width="200" height="42" rx="4" fill="#f8fafc"/>
  <text x="740" y="277" font-size="11" font-weight="700" fill="#334155">Power Delivery Losses (3–5%)</text>
  <text x="740" y="292" font-size="10" fill="#475569">UPS double conversion, transformers</text>
  <rect x="730" y="310" width="200" height="42" rx="4" fill="#f8fafc"/>
  <text x="740" y="327" font-size="11" font-weight="700" fill="#334155">Auxiliary Lighting &amp; BMS (&lt;1%)</text>
  <text x="740" y="342" font-size="10" fill="#475569">Building controls, security</text>
  <rect x="730" y="365" width="200" height="75" rx="4" fill="#fef3c7"/>
  <text x="740" y="385" font-size="11" font-weight="700" fill="#92400e">Typical PUE Ranges:</text>
  <text x="740" y="403" font-size="10" fill="#475569">• Modern Hyperscale: 1.10 – 1.15</text>
  <text x="740" y="419" font-size="10" fill="#475569">• Legacy Enterprise DC: 1.40 – 1.80</text>
  <text x="740" y="433" font-size="10" font-weight="600" fill="#92400e">PUE ≥ 1.0 by physical definition</text>
  <!-- Bottom Takeaway Card -->
  <rect x="40" y="485" width="920" height="115" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="55" y="498" width="165" height="24" rx="4" fill="#0f172a"/>
  <text x="137" y="514" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.8px">ACCOUNTING PROTOCOL</text>
  <text x="235" y="515" font-size="13" font-weight="700" fill="#0f172a">Apply PUE Exactly Once at the Declared Datacenter Boundary</text>
  <text x="55" y="542" font-size="11" fill="#475569">• Never double-count facility cooling overhead into processor-level efficiency benchmarks (η_realized).</text>
  <text x="55" y="560" font-size="11" fill="#475569">• When reporting total energy for carbon footprinting (Scope 2), convert IT energy to facility energy using verified annual average PUE.</text>
  <text x="55" y="578" font-size="11" fill="#475569">• Seasonal temperature variation alters cooling demand: PUE must match the actual runtime period of the training run.</text>
</svg>