<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#475569"/>
    </marker>
    <marker id="arr-orange" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- STAGE 1: WORKLOAD COMPUTATION -->
  <g transform="translate(25, 20)">
    <rect width="215" height="320" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="215" height="28" rx="3" fill="#f8fafc"/>
    <text x="107" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">1. Workload &amp; Efficiency</text>

    <!-- Workload Block -->
    <g transform="translate(12, 38)">
      <rect width="191" height="85" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Useful Work W_useful</text>
      <text x="10" y="34" font-size="8.5" fill="#475569">• Algorithmic FLOPs required</text>
      <text x="10" y="48" font-size="8.5" fill="#475569">• Processed tokens / batch</text>
      <text x="10" y="62" font-size="8.5" fill="#475569">• Model parameter passes</text>
      <text x="10" y="76" font-size="7.5" fill="#64748b">Excludes retries and idle</text>
    </g>

    <!-- Operator ÷ -->
    <text x="107" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">÷ (divided by)</text>

    <!-- Realized Efficiency Block -->
    <g transform="translate(12, 160)">
      <rect width="191" height="85" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#15803d">Realized Efficiency η</text>
      <text x="10" y="34" font-size="8.5" fill="#166534">• Model FLOPs / Joule</text>
      <text x="10" y="48" font-size="8.5" fill="#166534">• Accounts for MFU (40–55%)</text>
      <text x="10" y="62" font-size="8.5" fill="#166534">• Includes memory/sync stalls</text>
      <text x="10" y="76" font-size="7.5" fill="#15803d">Measured at server level</text>
    </g>

    <!-- Result: IT Energy -->
    <g transform="translate(12, 258)">
      <rect width="191" height="48" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#1F407A">E_IT = W_useful / η_realized</text>
      <text x="10" y="34" font-size="8" fill="#1e3a8a">Direct IT equipment electrical draw</text>
    </g>
  </g>

  <!-- ARROW 1 -> 2 -->
  <line x1="240" y1="180" x2="265" y2="180" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- STAGE 2: IT EQUIPMENT BREAKDOWN -->
  <g transform="translate(270, 20)">
    <rect width="215" height="320" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <rect width="215" height="28" rx="3" fill="#EAF1F8"/>
    <text x="107" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">2. Server Chassis Energy (E_IT)</text>

    <!-- Server Power Breakdown -->
    <g transform="translate(12, 38)">
      <!-- Accelerators -->
      <rect x="0" y="0" width="191" height="52" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#1F407A">Accelerators (70–80%)</text>
      <text x="10" y="34" font-size="8" fill="#475569">GPU / TPU matrix cores, HBM stacks</text>

      <!-- Host CPUs -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="191" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#334155">Host CPUs &amp; RAM (12–18%)</text>
        <text x="10" y="34" font-size="8" fill="#64748b">Data loading pipelines, OS runtime</text>
      </g>

      <!-- Interconnect -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="191" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#334155">Interconnect &amp; NICs (6–10%)</text>
        <text x="10" y="34" font-size="8" fill="#64748b">Optical transceivers, PCIe/NVLink</text>
      </g>

      <!-- Storage & Fans -->
      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="191" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#334155">Storage &amp; Fans (3–5%)</text>
        <text x="10" y="34" font-size="8" fill="#64748b">Local NVMe drives, chassis fans</text>
      </g>

      <!-- Tap Point Note -->
      <text x="5" y="254" font-size="8" fill="#64748b">Measured at server PDU rack tap;</text>
      <text x="5" y="266" font-size="8" fill="#64748b">excludes facility cooling plant.</text>
    </g>
  </g>

  <!-- ARROW 2 -> 3 WITH PUE BADGE -->
  <line x1="485" y1="180" x2="520" y2="180" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <rect x="488" y="165" width="28" height="15" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="502" y="176" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">×PUE</text>

  <!-- STAGE 3: TOTAL FACILITY ENERGY -->
  <g transform="translate(525, 20)">
    <rect width="210" height="320" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <rect width="210" height="28" rx="3" fill="#fef3c7"/>
    <text x="105" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">3. Total Facility Energy</text>

    <!-- Formula -->
    <g transform="translate(10, 38)">
      <rect width="190" height="32" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="95" y="21" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">E_facility = E_IT × PUE</text>
    </g>

    <!-- Facility Overhead Components -->
    <g transform="translate(10, 80)">
      <rect width="190" height="140" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Facility Overhead Added:</text>

      <text x="10" y="38" font-size="8.5" font-weight="600" fill="#334155">• Cooling Plant (8–15%)</text>
      <text x="15" y="50" font-size="7.5" fill="#64748b">Chillers, cooling towers, pumps</text>

      <text x="10" y="68" font-size="8.5" font-weight="600" fill="#334155">• Power Delivery (3–5%)</text>
      <text x="15" y="80" font-size="7.5" fill="#64748b">UPS double conversion, transformers</text>

      <text x="10" y="98" font-size="8.5" font-weight="600" fill="#334155">• Auxiliary Systems (&lt;1%)</text>
      <text x="15" y="110" font-size="7.5" fill="#64748b">Building lighting, telemetry, BMS</text>
    </g>

    <!-- Standard PUE Ranges -->
    <g transform="translate(10, 230)">
      <rect width="190" height="76" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#92400e">Standard Benchmark Ranges:</text>
      <text x="10" y="34" font-size="8" fill="#78350f">• Modern Hyperscale: 1.10 – 1.15</text>
      <text x="10" y="48" font-size="8" fill="#78350f">• Legacy Enterprise DC: 1.40 – 1.80</text>
      <text x="10" y="64" font-size="8" font-weight="600" fill="#92400e">PUE ≥ 1.0 by physical definition</text>
    </g>
  </g>
</svg>
