<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#475569"/>
    </marker>
    <marker id="arr-orange" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- STAGE 1: WORKLOAD COMPUTATION (width 230) -->
  <g transform="translate(25, 15)">
    <rect width="230" height="320" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="115" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">1. Workload &amp; Efficiency</text>

    <!-- Workload Block -->
    <g transform="translate(10, 36)">
      <rect width="210" height="85" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Useful Work W<tspan dy="2" font-size="6.5">useful</tspan></text>
      <text x="10" y="34" font-size="8" fill="#475569">• Algorithmic FLOPs required</text>
      <text x="10" y="48" font-size="8" fill="#475569">• Processed tokens / batch</text>
      <text x="10" y="62" font-size="8" fill="#475569">• Model parameter passes</text>
      <text x="10" y="76" font-size="8" fill="#64748b">Excludes retries and idle</text>
    </g>

    <!-- Operator ÷ -->
    <text x="115" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">÷</text>

    <!-- Realized Efficiency Block -->
    <g transform="translate(10, 160)">
      <rect width="210" height="85" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#15803d">Realized Efficiency η</text>
      <text x="10" y="34" font-size="8" fill="#166534">• Model FLOPs / Joule</text>
      <text x="10" y="48" font-size="8" fill="#166534">• Accounts for achieved utilization</text>
      <text x="10" y="62" font-size="8" fill="#166534">• Includes memory/sync stalls</text>
      <text x="10" y="76" font-size="8" fill="#15803d">Measured at server level</text>
    </g>

    <!-- Result: IT Energy -->
    <g transform="translate(10, 258)">
      <rect width="210" height="48" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#1F407A">E<tspan dy="2" font-size="6.5">IT</tspan><tspan dy="-2" dx="3">= W</tspan><tspan dy="2" font-size="6.5">useful</tspan><tspan dy="-2" dx="3">/ η</tspan><tspan dy="2" font-size="6.5">realized</tspan></text>
      <text x="10" y="34" font-size="8" fill="#1e3a8a">Direct IT equipment electrical draw</text>
    </g>
  </g>

  <!-- ARROW 1 -> 2 -->
  <line x1="255" y1="175" x2="285" y2="175" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- STAGE 2: IT EQUIPMENT BREAKDOWN (width 230) -->
  <g transform="translate(285, 15)">
    <rect width="230" height="320" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
    <text x="115" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#1F407A">2. Server Chassis Energy (E<tspan dy="2" font-size="7">IT</tspan><tspan dy="-2">)</tspan></text>

    <!-- Server Power Breakdown -->
    <g transform="translate(10, 36)">
      <!-- Accelerators -->
      <rect x="0" y="0" width="210" height="52" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1F407A">Accelerators (largest share)</text>
      <text x="10" y="34" font-size="8" fill="#475569">GPU / TPU matrix cores, HBM</text>

      <!-- Host CPUs -->
      <g transform="translate(0, 58)">
        <rect x="0" y="0" width="210" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#334155">Host CPUs &amp; RAM</text>
        <text x="10" y="34" font-size="8" fill="#64748b">Data pipelines, OS runtime</text>
      </g>

      <!-- Interconnect -->
      <g transform="translate(0, 116)">
        <rect x="0" y="0" width="210" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#334155">Interconnect &amp; NICs</text>
        <text x="10" y="34" font-size="8" fill="#64748b">Optical transceivers, switches</text>
      </g>

      <!-- Storage & Fans -->
      <g transform="translate(0, 174)">
        <rect x="0" y="0" width="210" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#334155">Storage &amp; Fans</text>
        <text x="10" y="34" font-size="8" fill="#64748b">Local NVMe, chassis cooling</text>
      </g>

      <!-- Tap Point Note -->
      <text x="5" y="250" font-size="8" fill="#64748b">Measured at server PDU rack tap;</text>
      <text x="5" y="262" font-size="8" fill="#64748b">excludes facility cooling plant.</text>
    </g>
  </g>

  <!-- ARROW 2 -> 3 WITH PUE BADGE -->
  <line x1="515" y1="175" x2="545" y2="175" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <rect x="518" y="160" width="24" height="15" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="530" y="171" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">×PUE</text>

  <!-- STAGE 3: TOTAL FACILITY ENERGY (width 230) -->
  <g transform="translate(545, 15)">
    <rect width="230" height="320" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <text x="115" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">3. Total Facility Energy</text>

    <!-- Formula -->
    <g transform="translate(10, 36)">
      <rect width="210" height="30" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="105" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">E<tspan dy="2" font-size="7">facility</tspan><tspan dy="-2" dx="3">= E</tspan><tspan dy="2" font-size="7">IT</tspan><tspan dy="-2" dx="3">× PUE</tspan></text>
    </g>

    <!-- Facility Overhead Components -->
    <g transform="translate(10, 76)">
      <rect width="210" height="140" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Facility Overhead Added:</text>

      <text x="10" y="38" font-size="8" font-weight="600" fill="#334155">• Cooling Plant</text>
      <text x="15" y="50" font-size="8" fill="#64748b">Chillers, cooling towers, pumps</text>

      <text x="10" y="68" font-size="8" font-weight="600" fill="#334155">• Power Delivery</text>
      <text x="15" y="80" font-size="8" fill="#64748b">UPS double conversion, transformers</text>

      <text x="10" y="98" font-size="8" font-weight="600" fill="#334155">• Auxiliary Systems</text>
      <text x="15" y="110" font-size="8" fill="#64748b">Building lighting, telemetry, BMS</text>
    </g>

    <!-- Standard PUE Ranges -->
    <g transform="translate(10, 226)">
      <rect width="210" height="80" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#92400e">Reading PUE:</text>
      <text x="10" y="34" font-size="8" fill="#78350f">• PUE ≥ 1.0 by definition</text>
      <text x="10" y="48" font-size="8" fill="#78350f">• Measures overhead, not carbon</text>
      <text x="10" y="62" font-size="8" fill="#78350f">• Idle IT load stays in denominator</text>

    </g>
  </g>
</svg>
