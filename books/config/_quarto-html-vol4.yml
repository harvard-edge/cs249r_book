# =============================================================================
# VOLUME IV HTML WEBSITE CONFIGURATION: Physical AI Systems
# =============================================================================
# Builds Volume IV: Physical AI Systems
# Deploys to: mlsysbook.ai/vol4/
# =============================================================================

project:
  type: website
  output-dir: _build/html-vol4
  execute-dir: project

  resources:
    - shared/assets/images/covers/*
    - shared/assets/downloads/*

  render:
    # Generated from vol4/index.qmd. The preface is a separate page below.
    - index.qmd
    - vol4/frontmatter/dedication.qmd
    - vol4/frontmatter/author_note.qmd
    - vol4/frontmatter/about.qmd
    - vol4/frontmatter/about_author.qmd
    - vol4/frontmatter/prerequisites.qmd
    - vol4/frontmatter/syllabus.qmd
    - vol4/frontmatter/acknowledgements.qmd
    - vol4/frontmatter/ai_use.qmd
    - vol4/frontmatter/notation.qmd
    - vol4/01_boundary/01_boundary.qmd
    - vol4/parts/anatomy_principles.qmd
    - vol4/02_body/02_body.qmd
    - vol4/03_nervous/03_nervous.qmd
    - vol4/04_brain/04_brain.qmd
    - vol4/parts/teaching_principles.qmd
    - vol4/05_data/05_data.qmd
    - vol4/06_training/06_training.qmd
    - vol4/07_evaluation/07_evaluation.qmd
    - vol4/parts/running_principles.qmd
    - vol4/08_perception/08_perception.qmd
    - vol4/09_memory/09_memory.qmd
    - vol4/10_intent/10_intent.qmd
    - vol4/11_planning/11_planning.qmd
    - vol4/12_enforcement/12_enforcement.qmd
    - vol4/13_placement/13_placement.qmd
    - vol4/parts/governing_principles.qmd
    - vol4/14_intervention/14_intervention.qmd
    - vol4/15_verification/15_verification.qmd
    - vol4/16_release/16_release.qmd
    - vol4/17_frontier/17_frontier.qmd
    - vol4/backmatter/references.qmd
    - vol4/backmatter/appendix_ml.qmd
    - vol4/backmatter/appendix_control.qmd
    - vol4/backmatter/appendix_systems.qmd
    - vol4/backmatter/glossary/glossary.qmd

  post-render:
    - shared/scripts/clean_svgs.py
    - shared/scripts/resolve_cross_references.py
    - shared/scripts/fix_lightbox_paths.py

  preview:
    browser: false
    navigate: false

website:
  title: "Physical AI"
  description: "Volume IV: Physical AI: Machine Learning Systems That Sense and Act."
  site-url: https://mlsysbook.ai/vol4/

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    image: shared/assets/images/covers/cover-hardcover-book-vol4.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: shared/assets/images/covers/cover-hardcover-book-vol4.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    keyboard-shortcut: ["/"]

  navbar:
    logo: "shared/assets/images/icons/logo-seas-shield.png"
    search: true
    title: "Machine Learning Systems"

  favicon: shared/assets/images/icons/favicon.png

  sidebar:
    - id: vol4-content
      title: "Volume IV"
      style: "floating"
      background: light
      collapse-level: 2
      contents:
        - text: "Homepage"
          href: index.qmd
        - href: vol4/frontmatter/dedication.qmd
        - href: vol4/frontmatter/author_note.qmd
        - href: vol4/frontmatter/about.qmd
        - href: vol4/frontmatter/about_author.qmd
        - href: vol4/frontmatter/prerequisites.qmd
        - href: vol4/frontmatter/syllabus.qmd
        - href: vol4/frontmatter/acknowledgements.qmd
        - href: vol4/frontmatter/ai_use.qmd
        - href: vol4/frontmatter/notation.qmd

        - text: "---"

        # Introduction (frames the whole book)
        - text: "Introduction: The Causal Boundary"
          href: vol4/01_boundary/01_boundary.qmd

        - section: "Part I: The Machine Anatomy"
          id: vol4-part1
          href: vol4/parts/anatomy_principles.qmd
          contents:
            - href: vol4/02_body/02_body.qmd
            - href: vol4/03_nervous/03_nervous.qmd
            - href: vol4/04_brain/04_brain.qmd

        - section: "Part II: Teaching the Machine"
          id: vol4-part2
          href: vol4/parts/teaching_principles.qmd
          contents:
            - href: vol4/05_data/05_data.qmd
            - href: vol4/06_training/06_training.qmd
            - href: vol4/07_evaluation/07_evaluation.qmd

        - section: "Part III: Running the Machine"
          id: vol4-part3
          href: vol4/parts/running_principles.qmd
          contents:
            - href: vol4/08_perception/08_perception.qmd
            - href: vol4/09_memory/09_memory.qmd
            - href: vol4/10_intent/10_intent.qmd
            - href: vol4/11_planning/11_planning.qmd
            - href: vol4/12_enforcement/12_enforcement.qmd
            - href: vol4/13_placement/13_placement.qmd

        - section: "Part IV: Governing the Machine"
          id: vol4-part4
          href: vol4/parts/governing_principles.qmd
          contents:
            - href: vol4/14_intervention/14_intervention.qmd
            - href: vol4/15_verification/15_verification.qmd
            - href: vol4/16_release/16_release.qmd

        # Conclusion (synthesizes the whole book)
        - text: "Conclusion: The Epistemic Frontier"
          href: vol4/17_frontier/17_frontier.qmd

        - text: "---"

        - text: "References"
          href: vol4/backmatter/references.qmd

        - section: "Appendices"
          id: vol4-appendices
          contents:
            - href: vol4/backmatter/appendix_ml.qmd
            - href: vol4/backmatter/appendix_control.qmd
            - href: vol4/backmatter/appendix_systems.qmd

        - text: "Glossary"
          href: vol4/backmatter/glossary/glossary.qmd

  page-footer:
    center: |
      <a href="../vol1/">Back to Volume I →</a>

bibliography: references-vol4.bib
format:
  html:
    lightbox: true
    mermaid:
      theme: default
    theme:
      light:
        - default
        - shared/assets/styles/style-vol4.scss
      dark:
        - default
        - shared/assets/styles/style-vol4.scss
        - shared/assets/styles/dark-mode-vol4.scss
    respect-user-color-scheme: true
    title-prefix: ""
    pagetitle: "Physical AI"
    code-block-bg: true
    code-copy: true
    code-overflow: wrap
    language:
      title-block-author-single: "Author, Editor & Curator"
      title-block-published: "Last Updated"
    reference-location: margin
    citation-location: margin
    sidenote: true
    syntax-highlighting: shared/assets/styles/custom-code.theme
    code-link: true
    link-external-icon: false
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: false
    citations-hover: false
    footnotes-hover: false
    fig-width: 7
    fig-height: 5
    toc: true
    toc-depth: 4
    toc-expand: true
    toc-title: "On this page"
    number-sections: false
    number-depth: 3
    include-in-header:
      - file: ../shared/config/site-head.html
      - text: |
          <link rel="manifest" href="/site.webmanifest">
          <link rel="apple-touch-icon" href="/assets/images/icons/favicon.png">
          <meta name="theme-color" content="#065F46">
          <script src="/assets/scripts/sidebar-auto-collapse.js" defer></script>
          <script src="/assets/scripts/version-link.js" defer></script>
          <script src="/assets/scripts/subscribe-modal.js" defer></script>
    citeproc: true

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/html/filters.yml
  - config/shared/html/filter-metadata.yml
  - config/shared/vol4/filter-metadata-paths.yml
  - config/shared/html/announcement-vol4.yml
  - ../shared/config/navbar-common.yml
  - config/shared/html/footer-common.yml
