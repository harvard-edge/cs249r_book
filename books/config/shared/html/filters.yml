# inject_quizzes.lua is HTML-ONLY. PDF and EPUB do not list it. The filter
# is also self-guarded via quarto.doc.is_format("html") so even accidental
# cross-format inclusion is a no-op. The quiz JSON files it reads live at
# books/{vol}/{chapter}/{chapter}_quizzes.json.
#
# Quizzes are enabled (HTML-only via inject_quizzes.lua).
#
# inject_slides.lua is HTML-ONLY as well. It adds a one-line link from each
# chapter to its lecture slides and study sheet, read from the manifests that
# slides/tools/lectures.py (_build/slides/lectures.json) and
# shared/studysheet/build.py (_build/studysheets/manifest.json) write at
# pre-render time; without either file it does nothing.
#
# studysheet_list.lua is HTML-only too. It fills each volume's Study Sheets
# page (volN/backmatter/studysheets.qmd) from the same study-sheet manifest.
#
filters:
  - shared/filters/sidenote.lua
  - shared/filters/inject_parts.lua
  - shared/filters/dropcap.lua
  - shared/filters/inject_quizzes.lua
  - shared/filters/inject_slides.lua
  - shared/filters/studysheet_list.lua
  - shared/filters/inject_concept_maps.lua
  - shared/filters/reviewed_figure_assets.lua
  - pandoc-ext/diagram
  - mlsysbook-ext/custom-numbered-blocks
  - mlsysbook-ext/pseudocode
  - mlsysbook-ext/figure-explore
