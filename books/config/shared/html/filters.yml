# inject_quizzes.lua is HTML-ONLY. PDF and EPUB do not list it. The filter
# is also self-guarded via quarto.doc.is_format("html") so even accidental
# cross-format inclusion is a no-op. The quiz JSON files it reads live at
# books/{vol}/{chapter}/{chapter}_quizzes.json and are
# regenerated by bindery/tools/scripts/quizzes/generate_quizzes.py
# against the canonical spec in the project quiz-generation spec.
#
# Quizzes are enabled (HTML-only via inject_quizzes.lua).
# Quiz JSON files live at contents/{vol}/{chapter}/{chapter}_quizzes.json.
#
filters:
  - shared/filters/sidenote.lua
  - shared/filters/inject_parts.lua
  - shared/filters/dropcap.lua
  - shared/filters/inject_quizzes.lua
  - pandoc-ext/diagram
  - mlsysbook-ext/custom-numbered-blocks
  - mlsysbook-ext/pseudocode
