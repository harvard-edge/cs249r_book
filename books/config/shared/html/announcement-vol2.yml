# =============================================================================
# ANNOUNCEMENT BAR — Volume II (Scaling)
# =============================================================================
# Audience: practitioners and advanced students reading the scale volume.
# Color:    inherits ETH Blue via $accent (set in theme-eth.scss and consumed
#           by .announcement / .alert-primary in _base-styles.scss). The bar
#           therefore renders as a soft ETH-blue tint with an ETH-blue accent
#           border — visually distinct from Vol I's crimson bar.
#           Do NOT hard-code colors here — keep the theme as the single source.
#
# Unifying template (shared across all nine Quarto sites, 2026-04):
#   Line 1  — identity + primary CTA (what is THIS site)
#   Line 2  — the book (or, on book sites, the other volume)
#   Line 3  — "Alongside the book:" sibling row (3 most-relevant verbs)
#   Line 4  — newsletter
#
# Sibling: books/config/shared/html/announcement-vol1.yml
# =============================================================================

website:
  announcement:
    icon: megaphone
    dismissable: true
    type: primary
    position: below-navbar
    content: |
      **Scaling Machine Learning Systems (Volume II), preview edition.** Distributed training, fleet operations, and responsible deployment.<br>
      **Companion volume:** [Introduction to Machine Learning Systems (Volume I)](https://mlsysbook.ai/vol1/), on machine learning systems on a single machine. Both volumes are open access.<br>
      **Alongside the book:** [TinyTorch](https://mlsysbook.ai/tinytorch/) (build) · [Hardware Kits](https://mlsysbook.ai/kits/) (deploy) · [MLSys·im](https://mlsysbook.ai/mlsysim/) (model) · [Labs](https://mlsysbook.ai/labs/) (explore) · [StaffML](https://mlsysbook.ai/staffml/) (practice)<br>
      **Newsletter:** news about the books and their companion tools. [Subscribe →](https://mlsysbook.ai/newsletter/)
