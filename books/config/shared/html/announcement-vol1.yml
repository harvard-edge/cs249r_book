# =============================================================================
# ANNOUNCEMENT BAR — Volume I (Foundations)
# =============================================================================
# Audience: students + instructors meeting the textbook for the first time.
# Color:    inherits Harvard Crimson via $accent (set in theme-harvard.scss
#           and consumed by .announcement / .alert-primary in _base-styles.scss).
#           Do NOT hard-code colors here — let the theme drive it so a brand
#           change in shared/styles/_brand.scss propagates automatically.
#
# Unifying template (shared across all nine Quarto sites, 2026-04):
#   Line 1  — identity + primary CTA (what is THIS site)
#   Line 2  — the book (or, on book sites, the other volume)
#   Line 3  — "Alongside the book:" sibling row (3 most-relevant verbs)
#   Line 4  — newsletter
#
# To edit Vol II's bar (ETH-blue tint, scale-focused copy):
#   books/config/shared/html/announcement-vol2.yml
# =============================================================================

website:
  announcement:
    icon: megaphone
    dismissable: true
    type: primary
    position: below-navbar
    content: |
      <span class="mls-ann-line">**Introduction to Machine Learning Systems (Volume I).** Machine learning systems on a single machine: data, algorithms, and machines.</span>
      <span class="mls-ann-line">**Next volume:** [Scaling Machine Learning Systems (Volume II)](https://mlsysbook.ai/vol2/) (preview), on distributed training, fleet operations, and responsible deployment.</span>
      <span class="mls-ann-line mls-ann-siblings">**Alongside the book:** [TinyTorch](https://mlsysbook.ai/tinytorch/) (build) · [Hardware Kits](https://mlsysbook.ai/kits/) (deploy) · [MLSys·im](https://mlsysbook.ai/mlsysim/) (model) · [Labs](https://mlsysbook.ai/labs/) (explore) · [StaffML](https://mlsysbook.ai/staffml/) (practice)</span>
      <span class="mls-ann-line">**Newsletter:** news about the books and their companion tools. [Subscribe →](https://mlsysbook.ai/newsletter/)</span>
