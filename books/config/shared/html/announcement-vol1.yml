# =============================================================================
# ANNOUNCEMENT BAR — Volume I (Foundations)
# =============================================================================
# Audience: students + instructors meeting the textbook for the first time.
# Color:    inherits Harvard Crimson via $accent (set in theme-harvard.scss
#           and consumed by .announcement / .alert-primary in _base-styles.scss).
#           Do NOT hard-code colors here — let the theme drive it so a brand
#           change in shared/styles/_brand.scss propagates automatically.
#
# Unifying template (shared across all Quarto sites, 2026-10):
#   Line 1  — identity (what is THIS site)
#   Line 2  — "The books:" the released volumes
#   Line 3  — "Companion resources:" the full sibling row, newsletter last
#
# To edit Vol II's bar (ETH-blue tint, scale-focused copy):
#   books/config/shared/html/announcement-vol2.yml
# =============================================================================

website:
  announcement:
    icon: megaphone
    dismissable: true
    type: primary
    position: below-navbar
    content: |
      <span class="mls-ann-line">**Introduction to Machine Learning Systems (Volume I)**: machine learning systems on a single machine, across data, algorithms, and machines.</span>
      <span class="mls-ann-line">**The books:** [Introduction to Machine Learning Systems](https://mlsysbook.ai/vol1/) · [Scaling Machine Learning Systems](https://mlsysbook.ai/vol2/) (preview)<span class="mls-unreleased"> · [Agentic Machine Learning Systems](https://mlsysbook.ai/vol3/) (in preparation) · [Physical AI](https://mlsysbook.ai/vol4/) (in preparation)</span>. All are open access.</span>
      <span class="mls-ann-line mls-ann-siblings">**Companion resources:** [TinyTorch](https://mlsysbook.ai/tinytorch/) (build) · [Hardware Kits](https://mlsysbook.ai/kits/) (deploy) · [MLSys·im](https://mlsysbook.ai/mlsysim/) (model) · [Labs](https://mlsysbook.ai/labs/) (explore) · [Lecture Slides](https://mlsysbook.ai/slides/) (teach) · [Instructor Hub](https://mlsysbook.ai/instructors/) (teach) · [StaffML](https://mlsysbook.ai/staffml/) (practice) · [Newsletter](https://mlsysbook.ai/newsletter/)</span>
