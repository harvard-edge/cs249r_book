# =============================================================================
# VOLUME II EPUB CONFIGURATION
# =============================================================================
# Builds only Volume II: Scaling Machine Learning Systems as EPUB
#
# Usage:
#   cp config/_quarto-epub-vol2.yml _quarto.yml
#   quarto render --to epub
# =============================================================================

project:
  pre-render:
    - ../tools/build_notation.py
  type: book
  output-dir: _build/epub-vol2
  execute-dir: project
  post-render:
    - shared/scripts/clean_svgs.py
    - shared/scripts/epub_postprocess.py

  preview:
    browser: false
    navigate: false

book:
  output-file: Machine-Learning-Systems-Vol2
  favicon: shared/assets/images/icons/favicon.png
  cover-image: vol2/covers/cover-hardcover-book-vol2.png
  cover-image-alt: "Cover image."

  title: "Scaling Machine Learning Systems"

  date: today
  date-format: long

  author:
    name: "Prof. Vijay Janapa Reddi"
    email: vj@eecs.harvard.edu
    url: https://www.google.com/search?q=Vijay+Janapa+Reddi
    affiliations:
      - name: "Harvard University"
        department: "School of Engineering and Applied Sciences"
        city: "Cambridge"
        state: "MA"
        country: "USA"
    corresponding: true
    roles: "Author, editor and curator."
    orcid: "0000-0002-5259-7721"

  abstract: |
    Machine learning systems at scale are fleets of thousands of accelerators, joined by networks and storage, that train and serve models as if they were one machine. Engineering them means designing the fleet as a whole, because at this size communication between machines can cost more than computation, hardware failure becomes routine, and system behavior emerges from interactions no single component controls. Model quality improves predictably as data, parameters, and compute grow, and that predictability is why fleets keep growing.

    This book develops the principles for building and operating such fleets. It begins with physical infrastructure, including datacenter compute and power, the network fabrics that join accelerators, and the storage systems that feed them. It then covers distributed training, including collective communication, parallelism strategies, fault tolerance, and cluster orchestration. It turns next to production, with fleet efficiency, inference for models too large for one device, edge and federated learning, and operations at scale, and it closes with security, privacy, robustness, sustainability, and responsible AI as properties a fleet must be engineered to enforce.

    Bandwidth, failure rates, queuing delay, and scaling efficiency are the working quantities. Readers learn to design training and serving infrastructure and to predict its cost and risk before building it. The book assumes the single-machine foundations of an introductory course in machine learning systems and serves graduate students and practitioners who build or operate large-scale ML infrastructure.

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    left: |
      Written, edited and curated by Prof. Vijay Janapa Reddi (Harvard University)
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  chapters:
    # `type: book` requires the first chapter to be literally `index.qmd`.
    # The build workflow creates it as a symlink to `index-vol2.qmd` per-job.
    - index.qmd

    # ==================================================
    # Volume II Frontmatter
    # ==================================================
    - vol2/frontmatter/dedication.qmd
    - vol2/frontmatter/author_note.qmd
    - vol2/frontmatter/about.qmd
    - vol2/frontmatter/acknowledgements.qmd
    - vol2/frontmatter/ai_use.qmd
    - vol2/frontmatter/notation.qmd

    # ==================================================
    # Part I: The Fleet
    # ==================================================
    # Introduction (frames the whole book; un-parted)
    - vol2/01_introduction/01_introduction.qmd

    - part: "The Fleet"
      chapters:
        - vol2/parts/fleet_principles.qmd
        - vol2/02_compute_infrastructure/02_compute_infrastructure.qmd
        - vol2/03_network_fabrics/03_network_fabrics.qmd
        - vol2/04_data_storage/04_data_storage.qmd

    # ==================================================
    # Part II: Distributed ML
    # ==================================================
    - part: "Distributed ML"
      chapters:
        - vol2/parts/distributed_ml_principles.qmd
        - vol2/05_collective_communication/05_collective_communication.qmd
        - vol2/06_distributed_training/06_distributed_training.qmd
        - vol2/07_fault_tolerance/07_fault_tolerance.qmd
        - vol2/08_fleet_orchestration/08_fleet_orchestration.qmd

    # ==================================================
    # Part III: The Fleet in Production
    # ==================================================
    - part: "The Fleet in Production"
      chapters:
        - vol2/parts/deployment_principles.qmd
        - vol2/09_performance_engineering/09_performance_engineering.qmd
        - vol2/10_inference/10_inference.qmd
        - vol2/11_edge_intelligence/11_edge_intelligence.qmd
        - vol2/12_ops_scale/12_ops_scale.qmd

    # ==================================================
    # Part IV: The Responsible Fleet
    # ==================================================
    - part: "The Responsible Fleet"
      chapters:
        - vol2/parts/responsible_fleet_principles.qmd
        - vol2/13_security_privacy/13_security_privacy.qmd
        - vol2/14_robust_ai/14_robust_ai.qmd
        - vol2/15_sustainable_ai/15_sustainable_ai.qmd
        - vol2/16_responsible_ai/16_responsible_ai.qmd

    # Conclusion (synthesizes the whole book; un-parted) + back matter
    - vol2/17_conclusion/17_conclusion.qmd
    - vol2/backmatter/references.qmd

  appendices:
    - vol2/backmatter/appendix_dam.qmd
    - vol2/backmatter/appendix_c3.qmd
    - vol2/backmatter/appendix_fleet.qmd
    - vol2/backmatter/appendix_communication.qmd
    - vol2/backmatter/appendix_reliability.qmd
    - vol2/backmatter/appendix_inference.qmd
    - vol2/backmatter/appendix_assumptions.qmd
    - vol2/backmatter/glossary/glossary.qmd

bibliography:
  - references.bib

lang: "en-US"

language: config/shared/base/crossref-labels.yml

format:
  epub:
    identifier: "https://mlsysbook.ai/epub/vol2"
    contributor: "Harvard University, School of Engineering and Applied Sciences"
    subject: "Machine Learning, Distributed Systems, Production ML, Responsible AI"
    type: "Text"
    format: "application/epub+zip"
    source: "https://mlsysbook.ai"
    toc: true
    toc-depth: 3
    toc-title: "Table of Contents"
    epub-chapter-level: 1
    epub-cover-image: "vol2/covers/cover-image-title-vol2.png"
    epub-title-page: true
    css:
      - "vol2/styles/epub.css"
      - "shared/assets/styles/epub/layout.css"
      - "shared/assets/styles/epub/callouts.css"
    code-overflow: wrap
    number-sections: false
    number-depth: 3
    fig-align: center
    link-citations: true

metadata-files:
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/epub/filters.yml
  - config/shared/epub/filter-metadata.yml
  - config/shared/vol2/filter-metadata-paths.yml
