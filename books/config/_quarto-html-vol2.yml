# =============================================================================
# VOLUME II HTML WEBSITE CONFIGURATION
# =============================================================================
# Builds only Volume II: Machine Learning Systems at Scale
# Deploys to: mlsysbook.ai/vol2/
# =============================================================================

project:
  type: website
  output-dir: _build/html-vol2
  execute-dir: project

  resources:
    - shared/assets/images/covers/*
    - shared/assets/downloads/*

  # Full render manifest (vol2 HTML). An explicit list is required here: the
  # project index (index.qmd) and the website homepage (index-vol2.qmd) BOTH
  # declare `output-file: index.html`, so an unscoped render-all renders both
  # and they race for index.html, failing the project-index move. We render
  # index.qmd (the canonical project index) and deliberately OMIT index-vol2.qmd
  # to avoid the collision. The render list is an HTML-website mechanism; PDF/EPUB
  # use chapter and appendix manifests. Chapter-selective builds comment out
  # non-selected entries; `binder reset html` uncomments them all to restore this
  # full default.
  render:
    - index.qmd
    - vol2/frontmatter/dedication.qmd
    - vol2/frontmatter/author_note.qmd
    - vol2/frontmatter/about.qmd
    - vol2/frontmatter/acknowledgements.qmd
    - vol2/frontmatter/ai_use.qmd
    - vol2/frontmatter/notation.qmd
    - shared/frontmatter/socratiq/socratiq.qmd
    - vol2/01_introduction/01_introduction.qmd
    - vol2/parts/fleet_principles.qmd
    - vol2/02_compute_infrastructure/02_compute_infrastructure.qmd
    - vol2/03_network_fabrics/03_network_fabrics.qmd
    - vol2/04_data_storage/04_data_storage.qmd
    - vol2/parts/distributed_ml_principles.qmd
    - vol2/05_distributed_training/05_distributed_training.qmd
    - vol2/06_collective_communication/06_collective_communication.qmd
    - vol2/07_fault_tolerance/07_fault_tolerance.qmd
    - vol2/08_fleet_orchestration/08_fleet_orchestration.qmd
    - vol2/parts/deployment_principles.qmd
    - vol2/09_performance_engineering/09_performance_engineering.qmd
    - vol2/10_inference/10_inference.qmd
    - vol2/11_edge_intelligence/11_edge_intelligence.qmd
    - vol2/12_ops_scale/12_ops_scale.qmd
    - vol2/parts/responsible_fleet_principles.qmd
    - vol2/13_security_privacy/13_security_privacy.qmd
    - vol2/14_robust_ai/14_robust_ai.qmd
    - vol2/15_sustainable_ai/15_sustainable_ai.qmd
    - vol2/16_responsible_ai/16_responsible_ai.qmd
    - vol2/17_conclusion/17_conclusion.qmd
    - vol2/backmatter/references.qmd
    - vol2/backmatter/appendix_dam.qmd
    - vol2/backmatter/appendix_c3.qmd
    - vol2/backmatter/appendix_fleet.qmd
    - vol2/backmatter/appendix_communication.qmd
    - vol2/backmatter/appendix_reliability.qmd
    - vol2/backmatter/appendix_inference.qmd
    - vol2/backmatter/appendix_assumptions.qmd
    - vol2/backmatter/glossary/glossary.qmd

  post-render:
    - shared/scripts/clean_svgs.py
    - shared/scripts/resolve_cross_references.py
    - shared/scripts/fix_lightbox_paths.py
    # Render-truth backstop: fail the build if any unresolved `?@xxx-yyy`
    # literal survives the resolve-cross-references pass. See script header.
    - shared/scripts/verify_rendered_xrefs.py

  preview:
    browser: false
    navigate: false

website:
  title: "Scaling Machine Learning Systems"
  description: "Volume II: Scaling Machine Learning Systems. Scale, distribute, and govern machine learning systems in production."
  site-url: https://mlsysbook.ai/vol2/

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    image: shared/assets/images/covers/cover-hardcover-book-vol2.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: shared/assets/images/covers/cover-hardcover-book-vol2.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    keyboard-shortcut: ["/"]

  google-analytics:
    tracking-id: "G-M21L0CBCVN"
    anonymize-ip: true
    version: 4

  # Hypothesis annotation policy: enabled, but sidebar is collapsed by
  # default (openSidebar: false). Readers see only the small annotation
  # affordance in the right margin until they actively engage. This keeps
  # community annotation a first-class feature without visually crowding
  # the page. To disable site-wide, comment this block out; to make
  # annotations sidebar-open by default, set openSidebar: true.
  comments:
    hypothesis:
      theme: clean
      openSidebar: false

  navbar:
    # Institutional brand for navbar (matches site/_quarto.yml).
    # Browser-tab favicon stays book-themed via the `favicon:` key below.
    logo: "shared/assets/images/icons/logo-seas-shield.png"
    search: true
    title: "Machine Learning Systems"
    # Navbar structure defined in config/shared/html/navbar-common.yml

  favicon: shared/assets/images/icons/favicon.png

  sidebar:
    - id: vol2-content
      title: "Volume II"
      style: "floating"
      background: light
      collapse-level: 2
      contents:
        # Frontmatter
        - text: "Homepage"
          href: vol2/index.qmd
        - href: vol2/frontmatter/dedication.qmd
        - href: vol2/frontmatter/author_note.qmd
        - href: vol2/frontmatter/about.qmd
        - href: vol2/frontmatter/acknowledgements.qmd
        - href: vol2/frontmatter/ai_use.qmd
        - href: vol2/frontmatter/notation.qmd
        # SocratiQ TOC entry disabled pending quiz regeneration:
        - href: shared/frontmatter/socratiq/socratiq.qmd

        - text: "---"

        # Introduction (frames the whole book)
        - text: "Introduction"
          href: vol2/01_introduction/01_introduction.qmd

        # Part I: The Fleet
        - section: "Part I: The Fleet"
          id: vol2-fleet
          href: vol2/parts/fleet_principles.qmd
          contents:
            - href: vol2/02_compute_infrastructure/02_compute_infrastructure.qmd
            - href: vol2/03_network_fabrics/03_network_fabrics.qmd
            - href: vol2/04_data_storage/04_data_storage.qmd

        # Part II: Distributed ML
        - section: "Part II: Distributed ML"
          id: vol2-distributed
          href: vol2/parts/distributed_ml_principles.qmd
          contents:
            - href: vol2/05_distributed_training/05_distributed_training.qmd
            - href: vol2/06_collective_communication/06_collective_communication.qmd
            - href: vol2/07_fault_tolerance/07_fault_tolerance.qmd
            - href: vol2/08_fleet_orchestration/08_fleet_orchestration.qmd

        # Part III: Deployment at Scale
        - section: "Part III: Deployment at Scale"
          id: vol2-deployment
          href: vol2/parts/deployment_principles.qmd
          contents:
            - href: vol2/09_performance_engineering/09_performance_engineering.qmd
            - href: vol2/10_inference/10_inference.qmd
            - href: vol2/11_edge_intelligence/11_edge_intelligence.qmd
            - href: vol2/12_ops_scale/12_ops_scale.qmd

        # Part IV: The Responsible Fleet
        - section: "Part IV: The Responsible Fleet"
          id: vol2-responsible
          href: vol2/parts/responsible_fleet_principles.qmd
          contents:
            - href: vol2/13_security_privacy/13_security_privacy.qmd
            - href: vol2/14_robust_ai/14_robust_ai.qmd
            - href: vol2/15_sustainable_ai/15_sustainable_ai.qmd
            - href: vol2/16_responsible_ai/16_responsible_ai.qmd

        # Conclusion (synthesizes the whole book)
        - text: "Conclusion"
          href: vol2/17_conclusion/17_conclusion.qmd

        - text: "---"

        - text: "References"
          href: vol2/backmatter/references.qmd

        # Appendices
        - section: "Appendices"
          id: vol2-appendices
          contents:
            - text: "Single-Machine Foundations (D·A·M)"
              href: vol2/backmatter/appendix_dam.qmd
            - text: "The C³ Taxonomy"
              href: vol2/backmatter/appendix_c3.qmd
            - text: "Fleet Foundations"
              href: vol2/backmatter/appendix_fleet.qmd
            - text: "Communication Foundations"
              href: vol2/backmatter/appendix_communication.qmd
            - text: "Reliability Foundations"
              href: vol2/backmatter/appendix_reliability.qmd
            - text: "Inference Foundations"
              href: vol2/backmatter/appendix_inference.qmd
            - text: "System Assumptions"
              href: vol2/backmatter/appendix_assumptions.qmd
        - text: "Glossary"
          href: vol2/backmatter/glossary/glossary.qmd

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    center: |
      <a href="../vol1/">← Back to Volume I</a>

bibliography:
  - references.bib

language: config/shared/base/crossref-labels.yml

format:
  html:
    # Avoid Quarto promoting the first section ## (e.g. “The Synchronization
    # Backbone”) into the page hero instead of the chapter # title. Chapter
    # pages rely on the leading “# Chapter Name” line for the visible title.
    title-block-style: none
    lightbox: true
    mermaid:
      theme: default
    theme:
      light:
        - default
        - shared/assets/styles/style-vol2.scss
      dark:
        - default
        - shared/assets/styles/style-vol2.scss
        - shared/assets/styles/dark-mode-vol2.scss
    respect-user-color-scheme: true
    title-prefix: ""
    pagetitle: "Machine Learning Systems at Scale"
    code-block-bg: true
    code-copy: true
    code-overflow: wrap
    language:
      title-block-author-single: "Author, Editor & Curator"
      title-block-published: "Last Updated"
    reference-location: margin
    citation-location: margin
    sidenote: true
    syntax-highlighting: shared/assets/styles/custom-code.theme
    code-link: true
    link-external-icon: false
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: false
    citations-hover: false
    footnotes-hover: false
    fig-width: 7
    fig-height: 5
    toc: true
    toc-depth: 4
    toc-expand: true
    toc-title: "On this page"
    number-sections: false
    number-depth: 3
    include-in-header:
      - file: ../shared/config/site-head.html
      - text: |
          <link rel="manifest" href="/site.webmanifest">
          <link rel="apple-touch-icon" href="/assets/images/icons/favicon.png">
          <meta name="theme-color" content="#1F407A">
          <!-- Release identity (rendered into the footer pill below).
               The publish workflow drops release-manifest.json at
               /vol2/release-manifest.json before deploy. -->
          <meta name="release-manifest" content="/vol2/release-manifest.json">
          <!-- SocratiQ bundle: -->
          <script type="module" src="/tools/scripts/socratiQ/bundle.js" defer></script>
          <script src="/assets/scripts/sidebar-auto-collapse.js" defer></script>
          <script src="/assets/scripts/version-link.js" defer></script>
          <script src="/assets/scripts/subscribe-modal.js" defer></script>
    include-after-body:
      - file: ../shared/release/release-pill.html
    citeproc: true

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/html/filters.yml
  - config/shared/html/filter-metadata.yml
  - config/shared/vol2/filter-metadata-paths.yml
  - config/shared/html/announcement-vol2.yml
  - ../shared/config/navbar-common.yml
  - config/shared/html/footer-common.yml
