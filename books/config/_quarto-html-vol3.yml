# =============================================================================
# VOLUME III HTML WEBSITE CONFIGURATION: Agentic Machine Learning Systems
# =============================================================================

project:
  type: website
  output-dir: _build/html-vol3
  execute-dir: project

  resources:
    - /shared/assets/images/covers/*
    - /shared/assets/downloads/*

  render:
    - index.qmd
    - vol3/frontmatter/dedication.qmd
    - vol3/frontmatter/author_note.qmd
    - vol3/frontmatter/about.qmd
    - vol3/frontmatter/acknowledgements.qmd
    - vol3/frontmatter/ai_use.qmd
    - vol3/frontmatter/notation.qmd
    - vol3/01_introduction/01_introduction.qmd
    - vol3/02_processor/02_processor.qmd
    - vol3/03_deliberation/03_deliberation.qmd
    - vol3/04_working_sets/04_working_sets.qmd
    - vol3/05_virtual_memory/05_virtual_memory.qmd
    - vol3/06_episodic_memory/06_episodic_memory.qmd
    - vol3/07_checkpointing/07_checkpointing.qmd
    - vol3/08_scheduling/08_scheduling.qmd
    - vol3/09_actuation/09_actuation.qmd
    - vol3/10_interrupts/10_interrupts.qmd
    - vol3/11_virtualization/11_virtualization.qmd
    - vol3/12_data_flywheel/12_data_flywheel.qmd
    - vol3/13_sft/13_sft.qmd
    - vol3/14_rlvr/14_rlvr.qmd
    - vol3/15_multi_agent/15_multi_agent.qmd
    - vol3/16_observability/16_observability.qmd
    - vol3/17_tokenomics/17_tokenomics.qmd
    - vol3/18_conclusion/18_conclusion.qmd
    - vol3/backmatter/references.qmd
    - vol3/appendices/app_a_reference_architecture.qmd
    - vol3/appendices/app_b_tool_design.qmd
    - vol3/appendices/app_c_failure_taxonomy.qmd
    - vol3/backmatter/appendix_math.qmd
    - vol3/backmatter/glossary/glossary.qmd


  post-render:
    - shared/scripts/clean_svgs.py
    - shared/scripts/resolve_cross_references.py
    - shared/scripts/fix_lightbox_paths.py
    - shared/scripts/verify_rendered_xrefs.py

  preview:
    browser: false
    navigate: false

website:
  title: "Agentic Machine Learning Systems"
  description: "Volume III: systems foundations for stateful trajectories, constrained action, and agentic operations."
  site-url: https://mlsysbook.ai/vol3/

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    image: shared/assets/images/covers/cover-hardcover-book-vol3.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: shared/assets/images/covers/cover-hardcover-book-vol3.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    keyboard-shortcut: ["/"]

  navbar:
    logo: "shared/assets/images/icons/logo-seas-shield.png"
    search: true
    title: "Machine Learning Systems"

  favicon: shared/assets/images/icons/favicon.png

  sidebar:
    - id: vol3-content
      title: "Volume III"
      style: "floating"
      background: light
      collapse-level: 2
      contents:
        - text: "Homepage"
          href: vol3/index.qmd
        - href: vol3/frontmatter/dedication.qmd
        - href: vol3/frontmatter/author_note.qmd
        - href: vol3/frontmatter/about.qmd
        - href: vol3/frontmatter/acknowledgements.qmd
        - href: vol3/frontmatter/ai_use.qmd
        - href: vol3/frontmatter/notation.qmd

        - text: "---"

        - text: "Introduction"
          href: vol3/01_introduction/01_introduction.qmd

        - section: "Part I: The Stochastic Processor"
          id: vol3-foundations
          href: vol3/parts/foundations_principles.qmd
          contents:
            - href: vol3/02_processor/02_processor.qmd
            - href: vol3/03_deliberation/03_deliberation.qmd

        - section: "Part II: The Context Memory Hierarchy"
          id: vol3-serving-memory
          href: vol3/parts/serving_memory_principles.qmd
          contents:
            - href: vol3/04_working_sets/04_working_sets.qmd
            - href: vol3/05_virtual_memory/05_virtual_memory.qmd
            - href: vol3/06_episodic_memory/06_episodic_memory.qmd
            - href: vol3/07_checkpointing/07_checkpointing.qmd
            - href: vol3/08_scheduling/08_scheduling.qmd

        - section: "Part III: The Actuation Boundary"
          id: vol3-security-isolation
          href: vol3/parts/security_isolation_principles.qmd
          contents:
            - href: vol3/09_actuation/09_actuation.qmd
            - href: vol3/10_interrupts/10_interrupts.qmd
            - href: vol3/11_virtualization/11_virtualization.qmd

        - section: "Part IV: The Policy Compiler"
          id: vol3-training-adaptation
          href: vol3/parts/training_adaptation_principles.qmd
          contents:
            - href: vol3/12_data_flywheel/12_data_flywheel.qmd
            - href: vol3/13_sft/13_sft.qmd
            - href: vol3/14_rlvr/14_rlvr.qmd

        - section: "Part V: The Distributed Fleet"
          id: vol3-scale-operations
          href: vol3/parts/scale_operations_principles.qmd
          contents:
            - href: vol3/15_multi_agent/15_multi_agent.qmd
            - href: vol3/16_observability/16_observability.qmd
            - href: vol3/17_tokenomics/17_tokenomics.qmd

        - text: "Conclusion"
          href: vol3/18_conclusion/18_conclusion.qmd

        - text: "---"

        - text: "References"
          href: vol3/backmatter/references.qmd

        # Appendices
        - section: "Appendices"
          id: vol3-appendices
          contents:
            - text: "App A: Reference Architecture"
              href: vol3/appendices/app_a_reference_architecture.qmd
            - text: "App B: Tool Design & Typed ABIs"
              href: vol3/appendices/app_b_tool_design.qmd
            - text: "App C: Taxonomy of Failures"
              href: vol3/appendices/app_c_failure_taxonomy.qmd
            - text: "Mathematical Foundations"
              href: vol3/backmatter/appendix_math.qmd
        - text: "Glossary"
          href: vol3/backmatter/glossary/glossary.qmd

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    center: |
      <a href="../vol2/">← Back to Volume II</a>

bibliography: references-vol3.bib
language: config/shared/base/crossref-labels.yml

format:
  html:
    title-block-style: none
    lightbox: true
    mermaid:
      theme: default
    theme:
      light:
        - default
        - shared/assets/styles/style-vol3.scss
      dark:
        - default
        - shared/assets/styles/style-vol3.scss
        - shared/assets/styles/dark-mode-vol3.scss
    respect-user-color-scheme: true
    title-prefix: ""
    pagetitle: "Agentic Machine Learning Systems"
    code-block-bg: true
    code-copy: true
    code-overflow: wrap
    language:
      title-block-author-single: "Author, Editor & Curator"
      title-block-published: "Last Updated"
    reference-location: margin
    citation-location: margin
    sidenote: true
    syntax-highlighting: shared/assets/styles/custom-code.theme
    code-link: true
    link-external-icon: false
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: false
    citations-hover: false
    footnotes-hover: false
    fig-width: 7
    fig-height: 5
    toc: true
    toc-depth: 4
    toc-expand: true
    toc-title: "On this page"
    number-sections: false
    number-depth: 3
    include-in-header:
      - file: ../shared/config/site-head.html
      - text: |
          <link rel="manifest" href="/site.webmanifest">
          <link rel="apple-touch-icon" href="/shared/assets/images/icons/favicon.png">
          <meta name="theme-color" content="#581C87">
          <script src="/shared/assets/scripts/sidebar-auto-collapse.js" defer></script>
          <script src="/shared/assets/scripts/version-link.js" defer></script>
          <script src="/shared/assets/scripts/subscribe-modal.js" defer></script>
    citeproc: true

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/html/filters.yml
  - config/shared/html/filter-metadata.yml
  - config/shared/vol3/filter-metadata-paths.yml
  - config/shared/html/announcement-vol3.yml
  - ../shared/config/navbar-common.yml
  - config/shared/html/footer-common.yml
