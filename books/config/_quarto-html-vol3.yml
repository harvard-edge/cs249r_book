# =============================================================================
# VOLUME III HTML WEBSITE CONFIGURATION: Agentic Machine Learning Systems
# =============================================================================

project:
  type: website
  output-dir: _build/html-vol3
  execute-dir: project

  resources:
    - shared/assets/images/covers/*
    - shared/assets/downloads/*

  render:
    - index.qmd
    - vol3/frontmatter/dedication.qmd
    - vol3/frontmatter/author_note.qmd
    - vol3/frontmatter/about.qmd
    - vol3/frontmatter/acknowledgements.qmd
    - vol3/frontmatter/ai_use.qmd
    - vol3/frontmatter/notation.qmd
    - vol3/introduction/introduction.qmd
    - vol3/parts/foundations_principles.qmd
    - vol3/execution_descriptors/execution_descriptors.qmd
    - vol3/control_topologies/control_topologies.qmd
    - vol3/parts/training_adaptation_principles.qmd
    - vol3/trajectory_fine_tuning/trajectory_fine_tuning.qmd
    - vol3/reinforcement_learning/reinforcement_learning.qmd
    - vol3/test_time_search/test_time_search.qmd
    - vol3/parts/serving_memory_principles.qmd
    - vol3/context_working_sets/context_working_sets.qmd
    - vol3/prefix_caching_paging/prefix_caching_paging.qmd
    - vol3/trajectory_scheduling/trajectory_scheduling.qmd
    - vol3/parts/security_isolation_principles.qmd
    - vol3/tool_interfaces/tool_interfaces.qmd
    - vol3/sandboxing_isolation/sandboxing_isolation.qmd
    - vol3/verification_recovery/verification_recovery.qmd
    - vol3/parts/scale_operations_principles.qmd
    - vol3/multi_agent_coordination/multi_agent_coordination.qmd
    - vol3/telemetry_evaluation/telemetry_evaluation.qmd
    - vol3/conclusion/conclusion.qmd
    - vol3/backmatter/references.qmd

  post-render:
    - shared/scripts/clean_svgs.py
    - shared/scripts/resolve_cross_references.py
    - shared/scripts/fix_lightbox_paths.py
    - shared/scripts/verify_rendered_xrefs.py

  preview:
    browser: false
    navigate: false

website:
  title: "Agentic Machine Learning Systems"
  description: "Volume III: systems foundations for stateful trajectories, constrained action, and agentic operations."
  site-url: https://mlsysbook.ai/vol3/

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    image: shared/assets/images/covers/cover-hardcover-book-vol3.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: shared/assets/images/covers/cover-hardcover-book-vol3.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    keyboard-shortcut: ["/"]

  navbar:
    logo: "shared/assets/images/icons/logo-seas-shield.png"
    search: true
    title: "Machine Learning Systems"

  favicon: shared/assets/images/icons/favicon.png

  sidebar:
    - id: vol3-content
      title: "Volume III"
      style: "floating"
      background: light
      collapse-level: 2
      contents:
        - text: "Homepage"
          href: vol3/index.qmd
        - href: vol3/frontmatter/dedication.qmd
        - href: vol3/frontmatter/author_note.qmd
        - href: vol3/frontmatter/about.qmd
        - href: vol3/frontmatter/acknowledgements.qmd
        - href: vol3/frontmatter/ai_use.qmd
        - href: vol3/frontmatter/notation.qmd

        - text: "---"

        - text: "Introduction"
          href: vol3/introduction/introduction.qmd

        - section: "Part I: Foundations of Agency"
          id: vol3-foundations
          href: vol3/parts/foundations_principles.qmd
          contents:
            - href: vol3/execution_descriptors/execution_descriptors.qmd
            - href: vol3/control_topologies/control_topologies.qmd

        - section: "Part II: Agent Training and Test-Time Compute"
          id: vol3-training-adaptation
          href: vol3/parts/training_adaptation_principles.qmd
          contents:
            - href: vol3/trajectory_fine_tuning/trajectory_fine_tuning.qmd
            - href: vol3/reinforcement_learning/reinforcement_learning.qmd
            - href: vol3/test_time_search/test_time_search.qmd

        - section: "Part III: Serving Runtimes and Memory Systems"
          id: vol3-serving-memory
          href: vol3/parts/serving_memory_principles.qmd
          contents:
            - href: vol3/context_working_sets/context_working_sets.qmd
            - href: vol3/prefix_caching_paging/prefix_caching_paging.qmd
            - href: vol3/trajectory_scheduling/trajectory_scheduling.qmd

        - section: "Part IV: Security, Isolation, and Red Teaming"
          id: vol3-security-isolation
          href: vol3/parts/security_isolation_principles.qmd
          contents:
            - href: vol3/tool_interfaces/tool_interfaces.qmd
            - href: vol3/sandboxing_isolation/sandboxing_isolation.qmd
            - href: vol3/verification_recovery/verification_recovery.qmd

        - section: "Part V: Scale, Evaluation, and Operations"
          id: vol3-scale-operations
          href: vol3/parts/scale_operations_principles.qmd
          contents:
            - href: vol3/multi_agent_coordination/multi_agent_coordination.qmd
            - href: vol3/telemetry_evaluation/telemetry_evaluation.qmd

        - text: "Conclusion"
          href: vol3/conclusion/conclusion.qmd

        - text: "---"

        - text: "References"
          href: vol3/backmatter/references.qmd

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    center: |
      <a href="../vol2/">← Back to Volume II</a>

bibliography: references-vol3.bib
language: config/shared/base/crossref-labels.yml

format:
  html:
    title-block-style: none
    lightbox: true
    mermaid:
      theme: default
    theme:
      light:
        - default
        - shared/assets/styles/style-vol3.scss
      dark:
        - default
        - shared/assets/styles/style-vol3.scss
        - shared/assets/styles/dark-mode-vol3.scss
    respect-user-color-scheme: true
    title-prefix: ""
    pagetitle: "Agentic Machine Learning Systems"
    code-block-bg: true
    code-copy: true
    code-overflow: wrap
    language:
      title-block-author-single: "Author, Editor & Curator"
      title-block-published: "Last Updated"
    reference-location: margin
    citation-location: margin
    sidenote: true
    syntax-highlighting: shared/assets/styles/custom-code.theme
    code-link: true
    link-external-icon: false
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: false
    citations-hover: false
    footnotes-hover: false
    fig-width: 7
    fig-height: 5
    toc: true
    toc-depth: 4
    toc-expand: true
    toc-title: "On this page"
    number-sections: false
    number-depth: 3
    include-in-header:
      - file: ../shared/config/site-head.html
      - text: |
          <link rel="manifest" href="/site.webmanifest">
          <link rel="apple-touch-icon" href="/assets/images/icons/favicon.png">
          <meta name="theme-color" content="#581C87">
          <script src="/assets/scripts/sidebar-auto-collapse.js" defer></script>
          <script src="/assets/scripts/version-link.js" defer></script>
          <script src="/assets/scripts/subscribe-modal.js" defer></script>
    citeproc: true

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/html/filters.yml
  - config/shared/html/filter-metadata.yml
  - config/shared/vol3/filter-metadata-paths.yml
  - config/shared/html/announcement-vol3.yml
  - ../shared/config/navbar-common.yml
  - config/shared/html/footer-common.yml
