# =============================================================================
# VOLUME III HTML WEBSITE CONFIGURATION: Agentic Machine Learning Systems
# =============================================================================

project:
  type: website
  output-dir: _build/html-vol3
  execute-dir: project

  resources:
    - shared/assets/images/covers/*
    - shared/assets/downloads/*

  render:
    - index.qmd
    - vol3/frontmatter/dedication.qmd
    - vol3/frontmatter/author_note.qmd
    - vol3/frontmatter/about.qmd
    - vol3/frontmatter/acknowledgements.qmd
    - vol3/frontmatter/ai_use.qmd
    - vol3/frontmatter/notation.qmd
    - vol3/introduction/introduction.qmd
    - vol3/draft_v2/01_processor/01_processor.qmd
    - vol3/draft_v2/02_deliberation/02_deliberation.qmd
    - vol3/draft_v2/03_working_sets/03_working_sets.qmd
    - vol3/draft_v2/04_virtual_memory/04_virtual_memory.qmd
    - vol3/draft_v2/05_episodic_memory/05_episodic_memory.qmd
    - vol3/draft_v2/06_checkpointing/06_checkpointing.qmd
    - vol3/draft_v2/07_scheduling/07_scheduling.qmd
    - vol3/draft_v2/08_actuation/08_actuation.qmd
    - vol3/draft_v2/09_interrupts/09_interrupts.qmd
    - vol3/draft_v2/10_virtualization/10_virtualization.qmd
    - vol3/draft_v2/11_data_flywheel/11_data_flywheel.qmd
    - vol3/draft_v2/12_sft/12_sft.qmd
    - vol3/draft_v2/13_rlvr/13_rlvr.qmd
    - vol3/draft_v2/14_multi_agent/14_multi_agent.qmd
    - vol3/draft_v2/15_observability/15_observability.qmd
    - vol3/draft_v2/16_tokenomics/16_tokenomics.qmd
    - vol3/conclusion/conclusion.qmd


  post-render:
    - shared/scripts/clean_svgs.py
    - shared/scripts/resolve_cross_references.py
    - shared/scripts/fix_lightbox_paths.py
    - shared/scripts/verify_rendered_xrefs.py

  preview:
    browser: false
    navigate: false

website:
  title: "Agentic Machine Learning Systems"
  description: "Volume III: systems foundations for stateful trajectories, constrained action, and agentic operations."
  site-url: https://mlsysbook.ai/vol3/

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    image: shared/assets/images/covers/cover-hardcover-book-vol3.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: shared/assets/images/covers/cover-hardcover-book-vol3.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    keyboard-shortcut: ["/"]

  navbar:
    logo: "shared/assets/images/icons/logo-seas-shield.png"
    search: true
    title: "Machine Learning Systems"

  favicon: shared/assets/images/icons/favicon.png

  sidebar:
    - id: vol3-content
      title: "Volume III"
      style: "floating"
      background: light
      collapse-level: 2
      contents:
        - text: "Homepage"
          href: vol3/index.qmd
        - href: vol3/frontmatter/dedication.qmd
        - href: vol3/frontmatter/author_note.qmd
        - href: vol3/frontmatter/about.qmd
        - href: vol3/frontmatter/acknowledgements.qmd
        - href: vol3/frontmatter/ai_use.qmd
        - href: vol3/frontmatter/notation.qmd

        - text: "---"

        - text: "Introduction"
          href: vol3/introduction/introduction.qmd

        - section: "Part I: Foundations of Agency"
          id: vol3-foundations
          href: vol3/parts/foundations_principles.qmd
          contents:
            - href: vol3/draft_v2/01_processor/01_processor.qmd
            - href: vol3/draft_v2/02_deliberation/02_deliberation.qmd

        - section: "Part II: Memory Systems and Runtimes"
          id: vol3-serving-memory
          href: vol3/parts/serving_memory_principles.qmd
          contents:
            - href: vol3/draft_v2/03_working_sets/03_working_sets.qmd
            - href: vol3/draft_v2/04_virtual_memory/04_virtual_memory.qmd
            - href: vol3/draft_v2/05_episodic_memory/05_episodic_memory.qmd
            - href: vol3/draft_v2/06_checkpointing/06_checkpointing.qmd
            - href: vol3/draft_v2/07_scheduling/07_scheduling.qmd

        - section: "Part III: Actuation, Interrupts, and Virtualization"
          id: vol3-security-isolation
          href: vol3/parts/security_isolation_principles.qmd
          contents:
            - href: vol3/draft_v2/08_actuation/08_actuation.qmd
            - href: vol3/draft_v2/09_interrupts/09_interrupts.qmd
            - href: vol3/draft_v2/10_virtualization/10_virtualization.qmd

        - section: "Part IV: Policy Adaptation and Training"
          id: vol3-training-adaptation
          href: vol3/parts/training_adaptation_principles.qmd
          contents:
            - href: vol3/draft_v2/11_data_flywheel/11_data_flywheel.qmd
            - href: vol3/draft_v2/12_sft/12_sft.qmd
            - href: vol3/draft_v2/13_rlvr/13_rlvr.qmd

        - section: "Part V: Distributed Scale, Observability, and Tokenomics"
          id: vol3-scale-operations
          href: vol3/parts/scale_operations_principles.qmd
          contents:
            - href: vol3/draft_v2/14_multi_agent/14_multi_agent.qmd
            - href: vol3/draft_v2/15_observability/15_observability.qmd
            - href: vol3/draft_v2/16_tokenomics/16_tokenomics.qmd

        - text: "Conclusion"
          href: vol3/conclusion/conclusion.qmd

        - text: "---"

        - text: "References"
          href: vol3/backmatter/references.qmd

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    center: |
      <a href="../vol2/">← Back to Volume II</a>

bibliography: references-vol3.bib
language: config/shared/base/crossref-labels.yml

format:
  html:
    title-block-style: none
    lightbox: true
    mermaid:
      theme: default
    theme:
      light:
        - default
        - shared/assets/styles/style-vol3.scss
      dark:
        - default
        - shared/assets/styles/style-vol3.scss
        - shared/assets/styles/dark-mode-vol3.scss
    respect-user-color-scheme: true
    title-prefix: ""
    pagetitle: "Agentic Machine Learning Systems"
    code-block-bg: true
    code-copy: true
    code-overflow: wrap
    language:
      title-block-author-single: "Author, Editor & Curator"
      title-block-published: "Last Updated"
    reference-location: margin
    citation-location: margin
    sidenote: true
    syntax-highlighting: shared/assets/styles/custom-code.theme
    code-link: true
    link-external-icon: false
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: false
    citations-hover: false
    footnotes-hover: false
    fig-width: 7
    fig-height: 5
    toc: true
    toc-depth: 4
    toc-expand: true
    toc-title: "On this page"
    number-sections: false
    number-depth: 3
    include-in-header:
      - file: ../shared/config/site-head.html
      - text: |
          <link rel="manifest" href="/site.webmanifest">
          <link rel="apple-touch-icon" href="/assets/images/icons/favicon.png">
          <meta name="theme-color" content="#581C87">
          <script src="/assets/scripts/sidebar-auto-collapse.js" defer></script>
          <script src="/assets/scripts/version-link.js" defer></script>
          <script src="/assets/scripts/subscribe-modal.js" defer></script>
    citeproc: true

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/html/filters.yml
  - config/shared/html/filter-metadata.yml
  - config/shared/vol3/filter-metadata-paths.yml
  - config/shared/html/announcement-vol3.yml
  - ../shared/config/navbar-common.yml
  - config/shared/html/footer-common.yml
