# =============================================================================
# VOLUME III EPUB CONFIGURATION: Agentic Machine Learning Systems
# =============================================================================

project:
  type: book
  output-dir: _build/epub-vol3
  execute-dir: project
  post-render:
    - shared/scripts/clean_svgs.py
    - shared/scripts/epub_postprocess.py

  preview:
    browser: false
    navigate: false

book:
  output-file: Machine-Learning-Systems-Vol3
  favicon: shared/assets/images/icons/favicon.png
  cover-image: shared/assets/images/covers/cover-hardcover-book-vol3.png
  cover-image-alt: "Book cover for Agentic Machine Learning Systems, showing a branching trajectory network."
  title: "Agentic Machine Learning Systems"
  date: today
  date-format: long

  author:
    name: "Prof. Vijay Janapa Reddi"
    email: vj@eecs.harvard.edu
    url: https://vijay.seas.harvard.edu/
    affiliations:
      - name: "Harvard University"
        department: "School of Engineering and Applied Sciences"
        city: "Cambridge"
        state: "MA"
        country: "USA"
    corresponding: true
    roles: "Author, editor and curator."
    orcid: "0000-0002-5259-7721"

  abstract: |
    Agentic machine learning systems turn model inference into a stateful control loop that observes, decides, acts, verifies, and adapts over time. This volume develops the systems foundations for managed trajectories across context, memory, tools, control, runtime, evaluation, and operations.

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    left: |
      Written, edited and curated by Prof. Vijay Janapa Reddi (Harvard University)
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  chapters:
    - index.qmd
    - vol3/frontmatter/dedication.qmd
    - vol3/frontmatter/author_note.qmd
    - vol3/frontmatter/about.qmd
    - vol3/frontmatter/acknowledgements.qmd
    - vol3/frontmatter/ai_use.qmd
    - vol3/frontmatter/notation.qmd
    - vol3/introduction/introduction.qmd

    - part: "Foundations of Agency"
      chapters:
        - vol3/parts/foundations_principles.qmd
        - vol3/execution_descriptors/execution_descriptors.qmd
        - vol3/control_topologies/control_topologies.qmd

    - part: "Agent Training & Test-Time Compute"
      chapters:
        - vol3/parts/training_adaptation_principles.qmd
        - vol3/trajectory_fine_tuning/trajectory_fine_tuning.qmd
        - vol3/reinforcement_learning/reinforcement_learning.qmd
        - vol3/test_time_search/test_time_search.qmd

    - part: "Serving Runtimes & Memory Systems"
      chapters:
        - vol3/parts/serving_memory_principles.qmd
        - vol3/context_working_sets/context_working_sets.qmd
        - vol3/prefix_caching_paging/prefix_caching_paging.qmd
        - vol3/trajectory_scheduling/trajectory_scheduling.qmd

    - part: "Security, Isolation & Red Teaming"
      chapters:
        - vol3/parts/security_isolation_principles.qmd
        - vol3/tool_interfaces/tool_interfaces.qmd
        - vol3/sandboxing_isolation/sandboxing_isolation.qmd
        - vol3/verification_recovery/verification_recovery.qmd

    - part: "Scale, Evaluation & Operations"
      chapters:
        - vol3/parts/scale_operations_principles.qmd
        - vol3/multi_agent_coordination/multi_agent_coordination.qmd
        - vol3/telemetry_evaluation/telemetry_evaluation.qmd

    - vol3/conclusion/conclusion.qmd
    - vol3/backmatter/appendix_math.qmd
    - vol3/backmatter/glossary/glossary.qmd

bibliography: references-vol3.bib
lang: "en-US"
language: config/shared/base/crossref-labels.yml

format:
  epub:
    identifier: "https://mlsysbook.ai/epub/vol3"
    contributor: "Harvard University, School of Engineering and Applied Sciences"
    subject: "Machine Learning Systems, AI Agents, Autonomous Systems, Production ML"
    type: "Text"
    format: "application/epub+zip"
    source: "https://mlsysbook.ai"
    toc: true
    toc-depth: 3
    toc-title: "Table of Contents"
    epub-chapter-level: 1
    epub-cover-image: "shared/assets/images/covers/cover-hardcover-book-vol3.png"
    epub-title-page: true
    css:
      - "shared/assets/styles/epub/vol2.css"
      - "shared/assets/styles/epub/layout.css"
      - "shared/assets/styles/epub/callouts.css"
    code-overflow: wrap
    number-sections: false
    number-depth: 3
    fig-align: center
    link-citations: true

metadata-files:
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/epub/filters.yml
  - config/shared/epub/filter-metadata.yml
  - config/shared/vol3/filter-metadata-paths.yml
