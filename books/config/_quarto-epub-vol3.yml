# =============================================================================
# VOLUME III EPUB CONFIGURATION: Agentic Machine Learning Systems
# =============================================================================

project:
  type: book
  output-dir: _build/epub-vol3
  execute-dir: project
  post-render:
    - shared/scripts/clean_svgs.py
    - shared/scripts/epub_postprocess.py

  preview:
    browser: false
    navigate: false

book:
  output-file: Machine-Learning-Systems-Vol3
  favicon: shared/assets/images/icons/favicon.png
  cover-image: shared/assets/images/covers/cover-hardcover-book-vol3.png
  cover-image-alt: "Book cover for Agentic Machine Learning Systems, showing a branching trajectory network."
  title: "Agentic Machine Learning Systems"
  date: today
  date-format: long

  author:
    name: "Prof. Vijay Janapa Reddi"
    email: vj@eecs.harvard.edu
    url: https://vijay.seas.harvard.edu/
    affiliations:
      - name: "Harvard University"
        department: "School of Engineering and Applied Sciences"
        city: "Cambridge"
        state: "MA"
        country: "USA"
    corresponding: true
    roles: "Author, editor and curator."
    orcid: "0000-0002-5259-7721"

  abstract: |
    Agentic machine learning systems turn model inference into a stateful control loop that observes, decides, acts, verifies, and adapts over time. This volume develops the systems foundations for managed trajectories across context, memory, tools, control, runtime, evaluation, and operations.

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    left: |
      Written, edited and curated by Prof. Vijay Janapa Reddi (Harvard University)
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

