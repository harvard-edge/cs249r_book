# =============================================================================
# VOLUME III PDF CONFIGURATION: Agentic Machine Learning Systems
# =============================================================================

project:
  output-dir: _build/pdf-vol3
  post-render:
    - shared/scripts/save_latex_log.py
    - shared/scripts/clean_svgs.py

book:
  output-file: Machine-Learning-Systems-Vol3
  favicon: shared/assets/images/icons/favicon.png
  cover-image: shared/assets/images/covers/cover-hardcover-book-vol3.png
  cover-image-alt: "Book cover for Agentic Machine Learning Systems by Vijay Janapa Reddi, with an abstract branching trajectory network."

  title: "Agentic Machine Learning Systems"

  date: today
  date-format: long

  author:
    name: Vijay Janapa Reddi
    email: vj@eecs.harvard.edu
    url: https://vijay.seas.harvard.edu/
    affiliations: Harvard University
    corresponding: true
    roles: "Author, editor and curator."

  abstract: |
    Agentic machine learning systems represent a fundamental shift in computing infrastructure: the transition from stateless, request-scoped token generation to stateful, autonomous trajectory execution. When a foundation model is given memory, tools, and a delegated goal, the system ceases to be an oracle and becomes an actor.

    This volume establishes the systems engineering foundations of agentic AI, governed by the H·S·A Triad (Horizon, State, Authority) and the Invariant Closure Principle. Across four parts, it develops the execution runtimes, memory hierarchies (L1 attention working set, L2 Radix prefix caching, L3 episodic storage), capability sandboxing (microVMs, Wasm, Model Context Protocol), distributed Sagas with deterministic rollbacks, and trajectory benchmarking (SWE-bench, MLPerf Agents) necessary to build robust autonomous systems.

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    left: |
      Written, edited and curated by Prof. Vijay Janapa Reddi (Harvard University)
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  chapters:
    - index.qmd
    - vol3/frontmatter/dedication.qmd
    - vol3/frontmatter/author_note.qmd
    - vol3/frontmatter/about.qmd
    - vol3/frontmatter/acknowledgements.qmd
    - vol3/frontmatter/ai_use.qmd
    - vol3/frontmatter/notation.qmd
    # ==================================================
    # Introduction (frames the whole book)
    # ==================================================
    - vol3/01_introduction/01_introduction.qmd

    # ==================================================
    # Part I: The Stochastic Processor
    # ==================================================
    - vol3/parts/foundations_principles.qmd
    - vol3/02_processor/02_processor.qmd
    - vol3/03_deliberation/03_deliberation.qmd

    # ==================================================
    # Part II: The Context Memory Hierarchy
    # ==================================================
    - vol3/parts/serving_memory_principles.qmd
    - vol3/04_working_sets/04_working_sets.qmd
    - vol3/05_virtual_memory/05_virtual_memory.qmd
    - vol3/06_episodic_memory/06_episodic_memory.qmd
    - vol3/07_checkpointing/07_checkpointing.qmd
    - vol3/08_scheduling/08_scheduling.qmd

    # ==================================================
    # Part III: The Actuation Boundary
    # ==================================================
    - vol3/parts/security_isolation_principles.qmd
    - vol3/09_actuation/09_actuation.qmd
    - vol3/10_interrupts/10_interrupts.qmd
    - vol3/11_virtualization/11_virtualization.qmd

    # ==================================================
    # Part IV: The Policy Compiler
    # ==================================================
    - vol3/parts/training_adaptation_principles.qmd
    - vol3/12_data_flywheel/12_data_flywheel.qmd
    - vol3/13_sft/13_sft.qmd
    - vol3/14_rlvr/14_rlvr.qmd

    # ==================================================
    # Part V: The Distributed Fleet
    # ==================================================
    - vol3/parts/scale_operations_principles.qmd
    - vol3/15_multi_agent/15_multi_agent.qmd
    - vol3/16_observability/16_observability.qmd
    - vol3/17_tokenomics/17_tokenomics.qmd

    # ==================================================
    # Conclusion (synthesizes the whole book)
    # ==================================================
    - vol3/18_conclusion/18_conclusion.qmd

  appendices:
    - vol3/appendices/app_a_reference_architecture.qmd
    - vol3/appendices/app_b_tool_design.qmd
    - vol3/appendices/app_c_failure_taxonomy.qmd
    - vol3/backmatter/appendix_math.qmd
    - vol3/backmatter/glossary/glossary.qmd

bibliography: references-vol3.bib
citation: true
license: CC-BY-NC-ND

language: config/shared/base/crossref-labels.yml

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/pdf/filters.yml
  - config/shared/pdf/filter-metadata.yml
  - config/shared/vol3/filter-metadata-paths.yml
  - config/shared/pdf/custom-numbered-blocks-overrides.yml
  - config/shared/pdf/titlepage-theme-common.yml
  - config/shared/pdf/titlepage-pdf-common.yml
  - config/shared/pdf/build-production-common.yml

execute:
  env:
    PYTHONPATH: "..:../mlsysim"
    MPLBACKEND: "Agg"

format:
  titlepage-pdf:
    # The designed cover is included by default. To omit it from a build:
    # ./binder/binder build pdf --vol3 --no-cover
    coverpage: true
    coverpage-title: "Machine Learning Systems"
    coverpage-bg-image: "shared/assets/images/covers/cover-image-white-vol3.png"
    coverpage-author: ["Vijay", "Janapa Reddi"]
    coverpage-footer: "Agentic"
    coverpage-theme:
      page-text-align: "left"
      bg-image-left: "-0.015\\paperwidth"
      bg-image-bottom: 7
      bg-image-rotate: 0
      bg-image-opacity: 1.0
      header-style: "none"
      date-style: "none"
      footer-fontsize: 22
      footer-left: "0.075\\paperwidth"
      footer-bottom: "0.394\\paperwidth"
      footer-width: "0.9\\paperwidth"
      footer-align: "left"
      title-fontsize: 60
      title-left: "0.075\\paperwidth"
      title-bottom: "0.330\\paperwidth"
      title-width: "0.9\\paperwidth"
      author-style: "plain"
      author-sep: "newline"
      author-fontsize: 25
      author-align: "right"
      author-bottom: "0.170\\paperwidth"
      author-left: ".925\\paperwidth"
      author-width: 3in

    titlepage: true
    titlepage-theme:
      elements: ["\\mlsysTitleBlock"]

    lof: false
    lot: false
    lol: false
    toc-depth: 2
    toc-title: "Contents"
    number-depth: 3
    keep-tex: true
    reference-location: document
    citation-location: document
    include-in-header:
      - file: "shared/tex/theme-colors-vol3.tex"
      - file: "shared/tex/header-includes.tex"
      - file: "shared/tex/agent-stack-vol3.tex"
      - file: "shared/tex/frontmatter-vol3.tex"
      - text: |
          \usepackage{needspace}
          \let\Needspace\needspace
    include-before-body:
      - file: "shared/tex/before-body-includes.tex"
