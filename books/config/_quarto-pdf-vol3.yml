# =============================================================================
# VOLUME III PDF CONFIGURATION: Agentic Machine Learning Systems
# =============================================================================

project:
  output-dir: _build/pdf-vol3
  post-render:
    - shared/scripts/save_latex_log.py
    - shared/scripts/clean_svgs.py

book:
  output-file: Machine-Learning-Systems-Vol3
  favicon: shared/assets/images/icons/favicon.png
  cover-image: vol3/covers/cover-hardcover-book-vol3.png
  cover-image-alt: "Book cover for Agentic Machine Learning Systems by Vijay Janapa Reddi, with an abstract branching trajectory network."

  title: "Agentic Machine Learning Systems"

  date: today
  date-format: long

  author:
    name: Vijay Janapa Reddi
    email: vj@eecs.harvard.edu
    url: https://vijay.seas.harvard.edu/
    affiliations: Harvard University
    corresponding: true
    roles: "Author, editor and curator."

  abstract: |
    Agentic machine learning systems represent a fundamental shift in computing infrastructure: the transition from stateless, request-scoped token generation to stateful, autonomous trajectory execution. When a foundation model is given memory, tools, and a delegated goal, the system ceases to be an oracle and becomes an actor.

    This volume develops the systems engineering of agentic AI around the H·S·A exposures (Horizon, State, Authority) that an agent adds beyond a single model call, and the Invariant Closure Principle that governs how a deterministic runtime closes them. Across seven parts, it develops the model as a priced computational engine, the context memory hierarchy, execution sandboxing (microVMs, WebAssembly, the Model Context Protocol), runtime orchestration with checkpoints, interrupts, and compensating Sagas, the policy compiler that turns verified trajectories into training signal, and the coordination, observability, and serving economics that fleets of agents require.

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    left: |
      Written, edited and curated by Prof. Vijay Janapa Reddi (Harvard University)
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  chapters:
    - index.qmd
    - vol3/frontmatter/dedication.qmd
    - vol3/frontmatter/author_note.qmd
    - vol3/frontmatter/about.qmd
    - vol3/frontmatter/acknowledgements.qmd
    - vol3/frontmatter/ai_use.qmd
    - vol3/frontmatter/notation.qmd
    # ==================================================
    # Chapter 01: Introduction
    # ==================================================
    - vol3/01_introduction/01_introduction.qmd

    # ==================================================
    # Part I: The Model
    # ==================================================
    - vol3/parts/model_principles.qmd
    - vol3/02_foundation_model/02_foundation_model.qmd
    - vol3/03_test_time_compute/03_test_time_compute.qmd

    # ==================================================
    # Part II: Agent Memory
    # ==================================================
    - vol3/parts/memory_principles.qmd
    - vol3/04_context_engineering/04_context_engineering.qmd
    - vol3/05_kv_cache/05_kv_cache.qmd
    - vol3/06_long_term_memory/06_long_term_memory.qmd

    # ==================================================
    # Part III: Tool Use
    # ==================================================
    - vol3/parts/tool_use_principles.qmd
    - vol3/07_tool_calling/07_tool_calling.qmd
    - vol3/08_sandboxes/08_sandboxes.qmd

    # ==================================================
    # Part IV: The Agent Runtime
    # ==================================================
    - vol3/parts/runtime_principles.qmd
    - vol3/09_agent_harness/09_agent_harness.qmd
    - vol3/10_durable_execution/10_durable_execution.qmd
    - vol3/11_failure_recovery/11_failure_recovery.qmd
    - vol3/12_evaluation/12_evaluation.qmd

    # ==================================================
    # Part V: Learning from Trajectories
    # ==================================================
    - vol3/parts/learning_principles.qmd
    - vol3/13_trajectory_curation/13_trajectory_curation.qmd
    - vol3/14_fine_tuning/14_fine_tuning.qmd
    - vol3/15_rlvr/15_rlvr.qmd

    # ==================================================
    # Part VI: Agents at Scale
    # ==================================================
    - vol3/parts/scale_principles.qmd
    - vol3/16_multi_agent/16_multi_agent.qmd
    - vol3/17_agent_economics/17_agent_economics.qmd

    # ==================================================
    # Part VII: Synthesis
    # ==================================================
    - vol3/parts/synthesis_principles.qmd
    - vol3/18_conclusion/18_conclusion.qmd

  appendices:
    - vol3/appendices/app_a_reference_architecture.qmd
    - vol3/appendices/app_b_tool_design.qmd
    - vol3/appendices/app_c_failure_taxonomy.qmd
    - vol3/backmatter/appendix_inference.qmd
    - vol3/backmatter/appendix_math.qmd
    - vol3/backmatter/glossary/glossary.qmd

bibliography:
  - references.bib
citation: true
license: CC-BY-NC-ND

language: config/shared/base/crossref-labels.yml

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/pdf/filters.yml
  - config/shared/pdf/filter-metadata.yml
  - config/shared/vol3/filter-metadata-paths.yml
  - config/shared/pdf/custom-numbered-blocks-overrides.yml
  - config/shared/pdf/titlepage-theme-common.yml
  - config/shared/pdf/titlepage-pdf-common.yml
  - config/shared/pdf/draft-watermark.yml
  - config/shared/pdf/build-production-common.yml

execute:
  env:
    PYTHONPATH: "..:../mlsysim"
    MPLBACKEND: "Agg"

format:
  titlepage-pdf:
    # The designed cover is included by default. To omit it from a build:
    # ./binder/binder build pdf --vol3 --no-cover
    coverpage: true
    coverpage-title: "Machine Learning Systems"
    coverpage-bg-image: "vol3/covers/cover-image-white-vol3.png"
    coverpage-author: ["Vijay", "Janapa Reddi"]
    coverpage-footer: "Agentic"
    coverpage-theme:
      page-text-align: "left"
      bg-image-left: "-0.015\\paperwidth"
      bg-image-bottom: 7
      bg-image-rotate: 0
      bg-image-opacity: 1.0
      header-style: "none"
      date-style: "none"
      footer-fontsize: 22
      footer-left: "0.075\\paperwidth"
      footer-bottom: "0.394\\paperwidth"
      footer-width: "0.9\\paperwidth"
      footer-align: "left"
      title-fontsize: 60
      title-left: "0.075\\paperwidth"
      title-bottom: "0.330\\paperwidth"
      title-width: "0.9\\paperwidth"
      author-style: "plain"
      author-sep: "newline"
      author-fontsize: 25
      author-align: "right"
      author-bottom: "0.170\\paperwidth"
      author-left: ".925\\paperwidth"
      author-width: 3in

    titlepage: true
    titlepage-theme:
      elements: ["\\mlsysTitleBlock"]

    lof: false
    lot: false
    lol: false
    toc-depth: 2
    toc-title: "Contents"
    number-depth: 3
    keep-tex: true
    reference-location: document
    citation-location: document
    include-in-header:
      - file: "vol3/tex/theme-colors.tex"
      - file: "shared/tex/header-includes.tex"
      - file: "vol3/tex/agent-stack.tex"
      - file: "vol3/tex/frontmatter.tex"
      - text: |
          \usepackage{needspace}
          \let\Needspace\needspace
    include-before-body:
      - file: "vol3/tex/before-body-includes.tex"
