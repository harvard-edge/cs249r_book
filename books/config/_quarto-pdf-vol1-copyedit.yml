# =============================================================================
# VOLUME I PDF CONFIGURATION — COPYEDIT VERSION (Double-spaced, 9pt)
# =============================================================================
# Double-spaced PDF for MIT Press copyediting workflow.
# Output: Single pages (not spreads), double line spacing for annotation.
#
# Usage:
#   cp config/_quarto-pdf-vol1-copyedit.yml _quarto.yml
#   quarto render --to titlepage-pdf
#
# Note: This produces a much longer PDF (~2x pages) due to double spacing.
# Use _quarto-pdf-vol1.yml for the final single-spaced production PDF.
# =============================================================================

project:
  pre-render:
    - ../tools/build_notation.py
  output-dir: _build/pdf-vol1-copyedit

book:
  favicon: shared/assets/images/icons/favicon.png
  cover-image: vol1/covers/cover-hardcover-book-vol1.png
  cover-image-alt: "Book cover for Introduction to Machine Learning Systems by Vijay Janapa Reddi, with an abstract radial network of blue, teal, gray, and red nodes."

  title: "Introduction to Machine Learning Systems"
  subtitle: "COPYEDIT VERSION — Double-Spaced"

  date: today
  date-format: long

  author:
    name: Vijay Janapa Reddi
    email: vj@eecs.harvard.edu
    url: https://vijay.seas.harvard.edu/
    affiliations: Harvard University
    corresponding: true
    roles: "Author, editor and curator."

  abstract: |
    Machine learning systems are computer systems whose behavior is learned from data rather than written by hand. Building one means engineering the data that trains the model, the algorithms that define it, and the machines that run it as a single design, because a weakness in any one of them limits the whole. Progress in machine learning has come mostly from general methods that improve as data and computation grow, so the system that carries a model increasingly decides what the model can achieve.

    This book develops these principles on a single machine, where every constraint is visible and measurable. It covers how deployment settings, from datacenter to microcontroller, set budgets for memory, power, and response time, and how data engineering bounds what a model can learn. It follows a model from mathematics to hardware through neural computation, architectures, frameworks, and training. It then treats optimization through data selection, model compression, and hardware acceleration, with benchmarking to verify each gain, and closes with serving, operations, and responsible engineering in production.

    Every design choice is weighed in latency, throughput, memory, and energy. Readers learn to locate bottlenecks, predict the effect of an optimization before applying it, and deploy models with sound engineering judgment. The book assumes programming experience and undergraduate mathematics but no prior knowledge of machine learning systems, and it serves advanced undergraduates, graduate students, and practitioners in computer science and engineering.

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    left: |
      Written, edited and curated by Prof. Vijay Janapa Reddi (Harvard University)
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  chapters:
    # `type: book` requires the first chapter to be literally `index.qmd`.
    # The build workflow creates it as a symlink to `index-vol1.qmd` per-job.
    - index.qmd

    # ==================================================
    # Volume I Frontmatter
    # ==================================================
    - vol1/frontmatter/dedication.qmd
    - vol1/frontmatter/foreword.qmd
    - vol1/frontmatter/author_note.qmd
    - vol1/frontmatter/about.qmd
    - vol1/frontmatter/acknowledgements.qmd
    - vol1/frontmatter/ai_use.qmd
    - vol1/frontmatter/notation.qmd

    # ==================================================
    # Introduction (frames the whole book)
    # ==================================================
    - vol1/01_introduction/01_introduction.qmd

    # ==================================================
    # Part I: Foundations
    # ==================================================
    - vol1/parts/foundations_principles.qmd
    - vol1/02_system_paradigms/02_system_paradigms.qmd
    - vol1/03_ml_lifecycle/03_ml_lifecycle.qmd
    - vol1/04_data_engineering/04_data_engineering.qmd

    # ==================================================
    # Part II: Development
    # ==================================================
    - vol1/parts/build_principles.qmd
    - vol1/05_nn_computation/05_nn_computation.qmd
    - vol1/06_nn_architectures/06_nn_architectures.qmd
    - vol1/07_frameworks/07_frameworks.qmd
    - vol1/08_training/08_training.qmd

    # ==================================================
    # Part III: Optimization
    # ==================================================
    - vol1/parts/optimize_principles.qmd
    - vol1/09_data_selection/09_data_selection.qmd
    - vol1/10_model_compression/10_model_compression.qmd
    - vol1/11_hw_acceleration/11_hw_acceleration.qmd
    - vol1/12_benchmarking/12_benchmarking.qmd

    # ==================================================
    # Part IV: Deployment
    # ==================================================
    - vol1/parts/deploy_principles.qmd
    - vol1/13_model_serving/13_model_serving.qmd
    - vol1/14_ml_ops/14_ml_ops.qmd
    - vol1/15_responsible_engr/15_responsible_engr.qmd
    - vol1/16_conclusion/16_conclusion.qmd
    - vol1/backmatter/references.qmd

  # ==================================================
  # Appendices (uses Appendix A, B, C... numbering)
  # ==================================================
  appendices:
    - vol1/backmatter/appendix_dam.qmd
    - vol1/backmatter/appendix_data.qmd
    - vol1/backmatter/appendix_algorithm.qmd
    - vol1/backmatter/appendix_machine.qmd
    - vol1/backmatter/appendix_assumptions.qmd
    - vol1/backmatter/glossary/glossary.qmd

bibliography:
  - references.bib

language: config/shared/base/crossref-labels.yml

execute:
  env:
    PYTHONPATH: "..:../mlsysim"
    MPLBACKEND: "Agg"

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/pdf/filters.yml
  - config/shared/pdf/filter-metadata.yml
  - config/shared/vol1/filter-metadata-paths.yml
  - config/shared/pdf/custom-numbered-blocks-overrides.yml
  - config/shared/pdf/titlepage-theme-common.yml
  - config/shared/pdf/titlepage-pdf-common.yml
  - config/shared/pdf/titlepage-pdf-copyedit-common.yml
  - config/shared/pdf/copyedit-watermark.yml
  - config/shared/pdf/build-copyedit-common.yml

format:
  titlepage-pdf:
    toc-title: "Contents"
    # Simplified cover for copyedit version
    include-in-header:
      - file: "vol1/tex/theme-colors-copyedit.tex"   # Black accent (copyedit only)
      - file: "shared/tex/header-includes.tex"
      - file: "vol1/tex/halftitle.tex"   # Half-title page (defines \halftitle macro)
      - text: |
          \usepackage{needspace}
          \let\Needspace\needspace
          % Copyedit-only: force all hyperref link colors to black. Quarto's
          % Pandoc template emits its own \hypersetup{linkcolor=Maroon,...} in
          % the preamble *after* this include-in-header block, so a direct
          % \hypersetup call here would be overwritten. Wrap in
          % \AtBeginDocument so our override runs after the template's default
          % hypersetup, guaranteeing black link colors throughout the PDF
          % (TOC entries, citations, URLs, Appendices, Index links).
          \AtBeginDocument{%
            \hypersetup{linkcolor=black,citecolor=black,urlcolor=black,filecolor=black,menucolor=black}%
          }
    include-before-body:
      - file: "vol1/tex/before-body-includes.tex"
