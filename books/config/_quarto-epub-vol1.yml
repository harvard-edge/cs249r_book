# =============================================================================
# VOLUME I EPUB CONFIGURATION
# =============================================================================
# Builds only Volume I: Introduction as EPUB
#
# Usage:
#   cp config/_quarto-epub-vol1.yml _quarto.yml
#   quarto render --to epub
# =============================================================================

project:
  type: book
  output-dir: _build/epub-vol1
  execute-dir: project
  post-render:
    - shared/scripts/clean_svgs.py
    - shared/scripts/epub_postprocess.py

  preview:
    browser: false
    navigate: false

book:
  output-file: Machine-Learning-Systems-Vol1
  favicon: shared/assets/images/icons/favicon.png
  cover-image: shared/assets/images/covers/cover-hardcover-book-vol1.png
  cover-image-alt: "Book cover for Introduction to Machine Learning Systems by Vijay Janapa Reddi, with an abstract radial network of blue, teal, gray, and red nodes."

  title: "Introduction to Machine Learning Systems"

  date: today
  date-format: long

  author:
    name: "Prof. Vijay Janapa Reddi"
    email: vj@eecs.harvard.edu
    url: https://vijay.seas.harvard.edu/
    affiliations:
      - name: "Harvard University"
        department: "School of Engineering and Applied Sciences"
        city: "Cambridge"
        state: "MA"
        country: "USA"
    corresponding: true
    roles: "Author, editor and curator."
    orcid: "0000-0002-5259-7721"

  abstract: |
    Machine learning systems engineering is a discipline governed by physical law. Memory bandwidth, arithmetic intensity, power envelopes, and the speed of data movement — not engineering convention — determine which architectures succeed and which fail. The full lifecycle of an ML system — from data ingestion through production deployment — becomes comprehensible through a single machine: by limiting scope to what one node provides and withholds, the constraints that govern every design decision become visible.

    Four parts develop this understanding progressively. Part I establishes foundations: the landscape of ML deployment paradigms and their physical constraints, the end-to-end ML workflow as a systems discipline, and data engineering as infrastructure with its own quality, reliability, and governance demands. Part II examines how models are built: the computational machinery of neural networks, the architectural families that encode different inductive biases, the trade-offs among ML frameworks, and the mechanics of efficient training. Part III addresses optimization under resource constraint: data selection as a systems problem, model compression through quantization and pruning, hardware acceleration from memory hierarchies through tensor cores, and benchmarking methodology for comparative evaluation. Part IV addresses production: model serving, operational monitoring and lifecycle management, and responsible engineering practice.

    Throughout, quantitative reasoning is the primary instrument. Every design decision is examined in terms of measurable consequences — latency, throughput, memory capacity, and energy — because understanding a system means understanding what constrains it. Readers develop the capacity to diagnose system bottlenecks, apply hardware-aware optimization techniques, and deploy models into production with principled engineering judgment. Suitable for advanced undergraduates and graduate students in computer science and engineering, and for practitioners seeking a principled foundation for ML systems design.

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    left: |
      Written, edited and curated by Prof. Vijay Janapa Reddi (Harvard University)
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  chapters:
    # `type: book` requires the first chapter to be literally `index.qmd`.
    # The build workflow creates it as a symlink to `index-vol1.qmd` per-job.
    - index.qmd

    # Volume I Frontmatter
    - vol1/frontmatter/dedication.qmd
    - vol1/frontmatter/foreword.qmd
    - vol1/frontmatter/author_note.qmd
    - vol1/frontmatter/about.qmd
    - vol1/frontmatter/acknowledgements.qmd
    - vol1/frontmatter/ai_use.qmd
    - vol1/frontmatter/notation.qmd

    # Introduction (frames the whole book; un-parted)
    - vol1/introduction/introduction.qmd

    # Part I: Foundations
    - part: "Foundations"
      chapters:
        - vol1/parts/foundations_principles.qmd
        - vol1/ml_systems/ml_systems.qmd
        - vol1/ml_workflow/ml_workflow.qmd
        - vol1/data_engineering/data_engineering.qmd

    # Part II: Build
    - part: "Build"
      chapters:
        - vol1/parts/build_principles.qmd
        - vol1/nn_computation/nn_computation.qmd
        - vol1/nn_architectures/nn_architectures.qmd
        - vol1/frameworks/frameworks.qmd
        - vol1/training/training.qmd

    # Part III: Optimize
    - part: "Optimize"
      chapters:
        - vol1/parts/optimize_principles.qmd
        - vol1/data_selection/data_selection.qmd
        - vol1/model_compression/model_compression.qmd
        - vol1/hw_acceleration/hw_acceleration.qmd
        - vol1/benchmarking/benchmarking.qmd

    # Part IV: Deploy
    - part: "Deploy"
      chapters:
        - vol1/parts/deploy_principles.qmd
        - vol1/model_serving/model_serving.qmd
        - vol1/ml_ops/ml_ops.qmd
        - vol1/responsible_engr/responsible_engr.qmd

    # Conclusion (synthesizes the whole book; un-parted) + back matter
    - vol1/conclusion/conclusion.qmd
    - vol1/backmatter/references.qmd

    - part: "Appendices"
      chapters:
        - vol1/backmatter/appendix_dam.qmd
        - vol1/backmatter/appendix_data.qmd
        - vol1/backmatter/appendix_algorithm.qmd
        - vol1/backmatter/appendix_machine.qmd
        - vol1/backmatter/appendix_assumptions.qmd
    - vol1/backmatter/glossary/glossary.qmd

bibliography:
  - references.bib

lang: "en-US"

language: config/shared/base/crossref-labels.yml

format:
  epub:
    identifier: "https://mlsysbook.ai/epub/vol1"
    contributor: "Harvard University, School of Engineering and Applied Sciences"
    subject: "Machine Learning, Computer Science, Engineering, Artificial Intelligence, Systems Design"
    type: "Text"
    format: "application/epub+zip"
    source: "https://mlsysbook.ai"
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    epub-chapter-level: 1
    epub-cover-image: "shared/assets/images/covers/cover-image-title-vol1.png"
    epub-title-page: true
    css:
      - "shared/assets/styles/epub/vol1.css"
      - "shared/assets/styles/epub/layout.css"
      - "shared/assets/styles/epub/callouts.css"
    code-overflow: wrap
    number-sections: false
    number-depth: 3
    fig-align: center
    link-citations: true

metadata-files:
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/epub/filters.yml
  - config/shared/epub/filter-metadata.yml
  - config/shared/vol1/filter-metadata-paths.yml
