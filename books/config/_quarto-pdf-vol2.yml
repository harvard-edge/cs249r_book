# =============================================================================
# VOLUME II PDF CONFIGURATION (Single-spaced, 9pt — regular layout)
# =============================================================================
# Builds only Volume II: Machine Learning Systems at Scale
#
# Usage:
#   cp config/_quarto-pdf-vol2.yml _quarto.yml
#   quarto render --to titlepage-pdf
#
# For the double-spaced copy-editing PDF, use:
#   cp config/_quarto-pdf-vol2-copyedit.yml _quarto.yml
#   quarto render --to titlepage-pdf
# =============================================================================

project:
  output-dir: _build/pdf-vol2
  post-render:
    - shared/scripts/save_latex_log.py
    - shared/scripts/clean_svgs.py
    - shared/scripts/mit_press/generate_figure_list.py

book:
  output-file: Machine-Learning-Systems-Vol2
  favicon: shared/assets/images/icons/favicon.png
  cover-image: shared/assets/images/covers/cover-hardcover-book-vol2.png
  cover-image-alt: "Cover image."

  title: "Machine Learning Systems at Scale"

  date: today
  date-format: long

  author:
    name: Vijay Janapa Reddi
    email: vj@eecs.harvard.edu
    url: https://www.google.com/search?q=Vijay+Janapa+Reddi
    affiliations: Harvard University
    corresponding: true
    roles: "Author, editor and curator."

  abstract: |
    Scale changes machine learning infrastructure in kind, not merely in degree. When training requires coordination across many machines, communication between nodes dominates compute time; hardware failures become statistically routine; and system behavior emerges from interactions that no single component determines. The fleet — the coordinated ensemble of compute, network, and storage spanning many machines — becomes the fundamental unit of analysis, requiring principles and architectures that single-machine reasoning cannot supply.

    Four parts examine these principles. Part I establishes the physical infrastructure of large-scale ML: datacenter architecture and cooling constraints, the network fabrics that interconnect machines, and the distributed storage systems that feed training and serving pipelines. Part II examines distributed ML: parallelism strategies across nodes, collective communication algorithms, fault tolerance through checkpointing and elastic training, and fleet orchestration using cluster schedulers. Part III addresses deployment at scale: distributed inference and large-model serving, performance engineering, edge intelligence and federated learning, and production operations. Part IV addresses governance: security and privacy, adversarial robustness, sustainable computing under energy and carbon constraints, and responsible AI at fleet scale.

    Throughout, physical constraints drive architecture. Bisection bandwidth, MTBF analysis, queuing theory, and scaling efficiency metrics are the analytical instruments. Readers develop the capacity to design distributed training pipelines, reason quantitatively about fault tolerance and scaling efficiency, and govern production ML infrastructure with accountability and environmental awareness. Suitable for graduate students in distributed systems and machine learning systems, and for practitioners designing and operating ML infrastructure at production scale.

  repo-url: https://github.com/harvard-edge/cs249r_book

  page-footer:
    left: |
      Written, edited and curated by Prof. Vijay Janapa Reddi (Harvard University)
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  chapters:
    # `type: book` requires the first chapter to be literally `index.qmd`.
    # The build workflow creates it as a symlink to `index-vol2.qmd` per-job.
    - index.qmd

    # ==================================================
    # Volume II Frontmatter
    # ==================================================
    - vol2/frontmatter/dedication.qmd
    - vol2/frontmatter/author_note.qmd
    - vol2/frontmatter/about.qmd
    - vol2/frontmatter/acknowledgements.qmd
    - vol2/frontmatter/ai_use.qmd
    - vol2/frontmatter/notation.qmd

    # ==================================================
    # Introduction (frames the whole book)
    # ==================================================
    - vol2/01_introduction/01_introduction.qmd

    # ==================================================
    # Part I: The Fleet
    # ==================================================
    - vol2/parts/fleet_principles.qmd
    - vol2/02_compute_infrastructure/02_compute_infrastructure.qmd
    - vol2/03_network_fabrics/03_network_fabrics.qmd
    - vol2/04_data_storage/04_data_storage.qmd

    # ==================================================
    # Part II: Distributed ML
    # ==================================================
    - vol2/parts/distributed_ml_principles.qmd
    - vol2/05_distributed_training/05_distributed_training.qmd
    - vol2/06_collective_communication/06_collective_communication.qmd
    - vol2/07_fault_tolerance/07_fault_tolerance.qmd
    - vol2/08_fleet_orchestration/08_fleet_orchestration.qmd

    # ==================================================
    # Part III: Deployment at Scale
    # ==================================================
    - vol2/parts/deployment_principles.qmd
    - vol2/09_performance_engineering/09_performance_engineering.qmd
    - vol2/10_inference/10_inference.qmd
    - vol2/11_edge_intelligence/11_edge_intelligence.qmd
    - vol2/12_ops_scale/12_ops_scale.qmd

    # ==================================================
    # Part IV: The Responsible Fleet
    # ==================================================
    - vol2/parts/responsible_fleet_principles.qmd
    - vol2/13_security_privacy/13_security_privacy.qmd
    - vol2/14_robust_ai/14_robust_ai.qmd
    - vol2/15_sustainable_ai/15_sustainable_ai.qmd
    - vol2/16_responsible_ai/16_responsible_ai.qmd
    - vol2/17_conclusion/17_conclusion.qmd
    - vol2/backmatter/references.qmd

  # ==================================================
  # Appendices (uses Appendix A, B, C... numbering)
  # ==================================================
  appendices:
    - vol2/backmatter/appendix_dam.qmd           # A: Single-Machine Foundations (D·A·M, prerequisite recap)
    - vol2/backmatter/appendix_c3.qmd            # B: C³ Taxonomy (the fleet diagnostic framework)
    - vol2/backmatter/appendix_fleet.qmd         # C: Fleet Foundations (cross-cutting C³ reference numbers)
    - vol2/backmatter/appendix_communication.qmd # D: Communication Foundations (C³ communication axis)
    - vol2/backmatter/appendix_reliability.qmd   # E: Reliability Foundations (C³ coordination axis)
    - vol2/backmatter/appendix_inference.qmd     # F: Inference Foundations (queuing theory + KV cache)
    - vol2/backmatter/appendix_assumptions.qmd   # G: System Assumptions (napkin-math reference)
    - vol2/backmatter/glossary/glossary.qmd      # H: Glossary

bibliography:
  - references.bib

citation: true
license: CC-BY-NC-ND

language: config/shared/base/crossref-labels.yml

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/pdf/filters.yml
  - config/shared/pdf/filter-metadata.yml
  - config/shared/vol2/filter-metadata-paths.yml
  - config/shared/pdf/custom-numbered-blocks-overrides.yml
  - config/shared/pdf/titlepage-theme-common.yml
  - config/shared/pdf/titlepage-pdf-common.yml
  - config/shared/pdf/build-production-common.yml

execute:
  env:
    PYTHONPATH: "..:../mlsysim"
    MPLBACKEND: "Agg"

editor:
  render-on-save: true

format:
  titlepage-pdf:
    # The designed cover is included by default. To omit it from a build:
    # ./binder/binder build pdf --vol2 --no-cover
    coverpage: true
    coverpage-title: "Machine Learning Systems"
    coverpage-bg-image: "shared/assets/images/covers/cover-image-transparent-vol2.png"
    coverpage-author: ["Vijay", "Janapa Reddi"]
    coverpage-footer: "Scaling"
    coverpage-theme:
        page-text-align: "left"
        bg-image-left: "0.155\\paperwidth"
        bg-image-bottom: 7.5
        bg-image-rotate: 0
        bg-image-opacity: 1.0
        header-style: "none"
        date-style: "none"

        footer-fontsize: 22
        footer-left: "0.075\\paperwidth"
        footer-bottom: "0.394\\paperwidth"
        footer-width: "0.9\\paperwidth"
        footer-align: "left"

        title-fontsize: 60
        title-left: "0.075\\paperwidth"
        title-bottom: "0.330\\paperwidth"
        title-width: "0.9\\paperwidth"

        author-style: "plain"
        author-sep: "newline"
        author-fontsize: 25
        author-align: "right"
        author-bottom: "0.170\\paperwidth"
        author-left: ".925\\paperwidth"
        author-width: 3in

    titlepage: true
    titlepage-theme:
      elements: [ "\\mlsysTitleBlock"]

    lof: false
    lot: false
    lol: false
    toc-depth: 2
    number-depth: 3
    keep-tex: true  # Preserve .tex intermediate for inspection and debugging
    latex-clean: false  # Keep .log/.aux so binder's log-based gates (missing glyphs, overfull boxes, crossref warnings) can read them
    reference-location: document
    citation-location: document
    include-in-header:
      - file: "shared/tex/theme-colors-vol2.tex"
      - file: "shared/tex/header-includes.tex"
      - file: "shared/tex/frontmatter-vol2.tex"   # Front matter pages (defines \halftitle and \mlsysTitleBlock)
      - text: |
          \usepackage{needspace}
          \let\Needspace\needspace
    include-before-body:
      - file: "shared/tex/before-body-includes-vol2.tex"
