<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-label="A four-stage cycle running clockwise: collect the robot's experience, curate to keep the informative few, adapt by training off-device, and deploy the improved model, which then collects again. The center notes that engagement is collection and the loop spins only if each round's gain beats its cost.">
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.5;opacity:0.88}
    .ar{stroke:currentColor;stroke-width:1.6;opacity:0.8;fill:none}
    .ah{fill:currentColor;opacity:0.8}
    .lab{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:13px}
    .sub{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10px;opacity:0.6}
    .ctr{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
    .csub{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10.5px;opacity:0.62}
    .yield{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10px;font-style:italic;opacity:0.7}
  </style>

  <!-- nodes -->
  <rect class="box" x="56"  y="48"  width="150" height="50" rx="4"/>
  <text class="lab" x="131" y="72"  text-anchor="middle">collect</text>
  <text class="sub" x="131" y="88"  text-anchor="middle">the robot's experience</text>

  <rect class="box" x="294" y="48"  width="150" height="50" rx="4"/>
  <text class="lab" x="369" y="72"  text-anchor="middle">curate</text>
  <text class="sub" x="369" y="88"  text-anchor="middle">keep the informative few</text>

  <rect class="box" x="294" y="202" width="150" height="50" rx="4"/>
  <text class="lab" x="369" y="226" text-anchor="middle">adapt</text>
  <text class="sub" x="369" y="242" text-anchor="middle">train, off-device</text>

  <rect class="box" x="56"  y="202" width="150" height="50" rx="4"/>
  <text class="lab" x="131" y="226" text-anchor="middle">deploy</text>
  <text class="sub" x="131" y="242" text-anchor="middle">the improved model</text>

  <!-- clockwise arrows -->
  <line class="ar" x1="206" y1="73"  x2="286" y2="73"/>
  <polygon class="ah" points="286,68 295,73 286,78"/>
  <line class="ar" x1="369" y1="98"  x2="369" y2="194"/>
  <polygon class="ah" points="364,194 369,203 374,194"/>
  <line class="ar" x1="294" y1="227" x2="214" y2="227"/>
  <polygon class="ah" points="214,222 205,227 214,232"/>
  <line class="ar" x1="131" y1="202" x2="131" y2="106"/>
  <polygon class="ah" points="126,106 131,97 136,106"/>

  <!-- data yield note on the curate->adapt edge -->
  <text class="yield" x="380" y="150">data yield =</text>
  <text class="yield" x="380" y="164">fraction kept</text>

  <!-- center -->
  <text class="ctr"  x="250" y="138" text-anchor="middle">the flywheel</text>
  <text class="csub" x="250" y="158" text-anchor="middle">engagement is collection:</text>
  <text class="csub" x="250" y="172" text-anchor="middle">the child teaching = labeled data</text>
  <text class="csub" x="250" y="190" text-anchor="middle">spins only if each round's gain &gt; its cost</text>
</svg>
