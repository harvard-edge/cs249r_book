<svg xmlns="http://www.w3.org/2000/svg" width="520" height="290" viewBox="0 0 520 290" role="img" aria-label="One frame feeds two paths. The top path sends it to a tiny VLM on the device, returning rough meaning in about 150 milliseconds with nothing leaving. The bottom path uploads it to a big VLM in the cloud, returning rich meaning in about 600 milliseconds, with the frame leaving the device.">
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.4;opacity:0.85}
    .ar{stroke:currentColor;stroke-width:1.4;opacity:0.8}
    .ah{fill:currentColor;opacity:0.8}
    .lab{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:12px}
    .el{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10px;opacity:0.6}
    .faint{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10.5px;opacity:0.62}
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
  </style>

  <text class="ttl" x="44" y="24">placing meaning: device vs cloud</text>

  <!-- the one frame -->
  <rect class="box" x="26" y="118" width="80" height="40" rx="4"/>
  <text class="lab" x="66" y="142" text-anchor="middle">a frame</text>

  <!-- top path: device -->
  <line class="ar" x1="106" y1="130" x2="174" y2="92"/>
  <polygon class="ah" points="170,87 180,90 171,96"/>
  <rect class="box" x="182" y="62" width="132" height="38" rx="4"/>
  <text class="lab" x="248" y="85" text-anchor="middle">tiny VLM (device)</text>
  <line class="ar" x1="314" y1="81" x2="356" y2="81"/>
  <polygon class="ah" points="356,77 364,81 356,85"/>
  <rect class="box" x="366" y="62" width="128" height="38" rx="4"/>
  <text class="lab" x="430" y="85" text-anchor="middle">rough meaning</text>
  <text class="faint" x="300" y="120" text-anchor="middle">~150 ms · nothing leaves · rough</text>

  <!-- bottom path: cloud -->
  <line class="ar" x1="106" y1="150" x2="196" y2="200"/>
  <polygon class="ah" points="192,194 202,198 191,204"/>
  <text class="el" x="120" y="186">upload</text>
  <rect class="box" x="204" y="196" width="132" height="38" rx="4"/>
  <text class="lab" x="270" y="219" text-anchor="middle">big VLM (cloud)</text>
  <line class="ar" x1="336" y1="215" x2="382" y2="215"/>
  <polygon class="ah" points="382,211 390,215 382,219"/>
  <text class="el" x="345" y="207">download</text>
  <rect class="box" x="392" y="196" width="116" height="38" rx="4"/>
  <text class="lab" x="450" y="219" text-anchor="middle">rich meaning</text>
  <text class="faint" x="300" y="254" text-anchor="middle">~600 ms · the frame leaves · rich</text>
</svg>
