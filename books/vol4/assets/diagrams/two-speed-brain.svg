<svg xmlns="http://www.w3.org/2000/svg" width="520" height="290" viewBox="0 0 520 290" role="img" aria-label="A situation enters a reflex on the device. Most of the time, a thick arrow labeled one minus f goes straight to act because the reflex is confident. A thin arrow labeled f, for the uncertain fraction, escalates down to a deliberation step in the cloud, which then also leads to act.">
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.4;opacity:0.85}
    .reflex{fill:none;stroke:#18a999;stroke-width:2}
    .delib{fill:none;stroke:#1b2a4a;stroke-width:2}
    .main{stroke:currentColor;stroke-width:2.6;opacity:0.85}
    .esc{stroke:currentColor;stroke-width:1.2;opacity:0.7}
    .ahm{fill:currentColor;opacity:0.85}
    .ahe{fill:currentColor;opacity:0.7}
    .lab{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:12px}
    .sub{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10px;opacity:0.6}
    .el{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:11px}
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
  </style>

  <text class="ttl" x="40" y="24">the two-speed brain: escalate only when uncertain</text>

  <!-- situation -->
  <rect class="box" x="20" y="120" width="92" height="44" rx="4"/>
  <text class="lab" x="66" y="146" text-anchor="middle">a situation</text>
  <line class="main" x1="112" y1="142" x2="150" y2="142"/>
  <polygon class="ahm" points="150,137 159,142 150,147"/>

  <!-- reflex (fast, on device) -->
  <rect class="reflex" x="156" y="118" width="142" height="48" rx="4"/>
  <text class="lab" x="227" y="139" text-anchor="middle">reflex</text>
  <text class="sub" x="227" y="156" text-anchor="middle">on device · ms</text>

  <!-- common path: confident -> act -->
  <line class="main" x1="298" y1="135" x2="420" y2="135"/>
  <polygon class="ahm" points="420,130 430,135 420,140"/>
  <text class="el" x="359" y="126" text-anchor="middle">1 − f : confident</text>

  <!-- act -->
  <rect class="box" x="432" y="116" width="78" height="46" rx="4"/>
  <text class="lab" x="471" y="143" text-anchor="middle">act</text>

  <!-- rare path: uncertain -> deliberation -->
  <line class="esc" x1="227" y1="166" x2="227" y2="214"/>
  <polygon class="ahe" points="222,214 227,222 232,214"/>
  <text class="el" x="237" y="196">f : uncertain</text>

  <!-- deliberation (slow, cloud) -->
  <rect class="delib" x="150" y="222" width="160" height="48" rx="4"/>
  <text class="lab" x="230" y="243" text-anchor="middle">deliberation</text>
  <text class="sub" x="230" y="260" text-anchor="middle">cloud · ~s</text>

  <!-- deliberation rejoins act -->
  <line class="esc" x1="310" y1="246" x2="466" y2="164"/>
  <polygon class="ahe" points="463,159 471,162 461,168"/>
</svg>
