<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-label="Placement map: each capability placed by loop, from reflex to learning, and by box, from device to cloud.">
  <style>
    .ax{stroke:currentColor;stroke-width:1.2;opacity:0.65;fill:none}
    .gr{stroke:currentColor;stroke-width:0.6;opacity:0.16;fill:none}
    .fr{stroke:currentColor;stroke-width:1;opacity:0.25;stroke-dasharray:4 5;fill:none}
    .lab{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:12px;opacity:0.75}
    .cap{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:11px}
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
  </style>
  <text class="ttl" x="60" y="20">placement map</text>
  <!-- axes -->
  <line class="ax" x1="80" y1="300" x2="500" y2="300"/>
  <line class="ax" x1="80" y1="300" x2="80" y2="32"/>
  <!-- gridlines: loop columns and box rows -->
  <line class="gr" x1="220" y1="32" x2="220" y2="300"/>
  <line class="gr" x1="360" y1="32" x2="360" y2="300"/>
  <line class="gr" x1="80" y1="210" x2="500" y2="210"/>
  <line class="gr" x1="80" y1="120" x2="500" y2="120"/>
  <!-- natural frontier: fast+near to slow+far -->
  <line class="fr" x1="110" y1="285" x2="470" y2="55"/>
  <!-- x labels: loop -->
  <text class="lab" x="150" y="320" text-anchor="middle">reflex</text>
  <text class="lab" x="290" y="320" text-anchor="middle">deliberation</text>
  <text class="lab" x="430" y="320" text-anchor="middle">learning</text>
  <text class="lab" x="290" y="342" text-anchor="middle">loop  (fast to slow)</text>
  <!-- y labels: box -->
  <text class="lab" x="72" y="259" text-anchor="end">device</text>
  <text class="lab" x="72" y="169" text-anchor="end">server</text>
  <text class="lab" x="72" y="79" text-anchor="end">cloud</text>
  <!-- placed capabilities; color = timescale -->
  <circle cx="150" cy="255" r="7" fill="#18a999"/>
  <text class="cap" x="162" y="259">track a face</text>
  <circle cx="290" cy="255" r="7" fill="#1b2a4a"/>
  <text class="cap" x="302" y="259">remember</text>
  <circle cx="290" cy="165" r="7" fill="#1b2a4a"/>
  <text class="cap" x="302" y="169">read meaning</text>
  <circle cx="290" cy="75" r="7" fill="#1b2a4a"/>
  <text class="cap" x="302" y="79">escalate</text>
  <circle cx="430" cy="75" r="7" fill="#e8a33d"/>
  <text class="cap" x="442" y="79">improve</text>
</svg>
