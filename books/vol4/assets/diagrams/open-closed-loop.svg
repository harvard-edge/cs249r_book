<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Two diagrams. Top: three boxes labeled sense, infer, act connected left to right by arrows, ending at the word done. Bottom: four boxes labeled sense, infer, act, actuate connected left to right, with a curved arrow returning from actuate back to sense.">
  <style>
    .bx{fill:none;stroke:currentColor;stroke-width:1.4;opacity:0.85}
    .ar{stroke:currentColor;stroke-width:1.4;opacity:0.85}
    .ah{fill:currentColor;opacity:0.85}
    .rl{stroke:#18a999;stroke-width:1.8;fill:none}
    .rh{fill:#18a999}
    .bl{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:12px}
    .cap{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:11px;opacity:0.6}
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
    .rlab{fill:#18a999;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:11px}
  </style>

  <!-- ============ OPEN LOOP (top) ============ -->
  <text class="ttl" x="70" y="40">open loop</text>

  <rect class="bx" x="70"  y="56" width="80" height="34" rx="3"/>
  <rect class="bx" x="190" y="56" width="80" height="34" rx="3"/>
  <rect class="bx" x="310" y="56" width="80" height="34" rx="3"/>
  <text class="bl" x="110" y="77" text-anchor="middle">sense</text>
  <text class="bl" x="230" y="77" text-anchor="middle">infer</text>
  <text class="bl" x="350" y="77" text-anchor="middle">act</text>

  <line class="ar" x1="150" y1="73" x2="184" y2="73"/>
  <polygon class="ah" points="184,69 192,73 184,77"/>
  <line class="ar" x1="270" y1="73" x2="304" y2="73"/>
  <polygon class="ah" points="304,69 312,73 304,77"/>
  <line class="ar" x1="390" y1="73" x2="424" y2="73"/>
  <polygon class="ah" points="424,69 432,73 424,77"/>
  <text class="bl" x="440" y="77">done</text>

  <text class="cap" x="70" y="112">a one-shot pipeline: it runs once and ends.</text>

  <!-- ============ CLOSED LOOP (bottom) ============ -->
  <text class="ttl" x="70" y="172">closed loop</text>

  <rect class="bx" x="70"  y="188" width="80" height="34" rx="3"/>
  <rect class="bx" x="190" y="188" width="80" height="34" rx="3"/>
  <rect class="bx" x="310" y="188" width="80" height="34" rx="3"/>
  <rect class="bx" x="410" y="188" width="80" height="34" rx="3"/>
  <text class="bl" x="110" y="209" text-anchor="middle">sense</text>
  <text class="bl" x="230" y="209" text-anchor="middle">infer</text>
  <text class="bl" x="350" y="209" text-anchor="middle">act</text>
  <text class="bl" x="450" y="209" text-anchor="middle">actuate</text>

  <line class="ar" x1="150" y1="205" x2="184" y2="205"/>
  <polygon class="ah" points="184,201 192,205 184,209"/>
  <line class="ar" x1="270" y1="205" x2="304" y2="205"/>
  <polygon class="ah" points="304,201 312,205 304,209"/>
  <line class="ar" x1="390" y1="205" x2="404" y2="205"/>
  <polygon class="ah" points="404,201 412,205 404,209"/>

  <!-- return arrow: actuate -> down -> left -> up into sense (reflex teal) -->
  <path class="rl" d="M 450 222 L 450 258 L 110 258 L 110 230"/>
  <polygon class="rh" points="106,230 110,222 114,230"/>
  <text class="rlab" x="280" y="276" text-anchor="middle">the act changes the next thing it senses</text>
</svg>
