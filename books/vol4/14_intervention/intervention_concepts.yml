  claims:
    Intervention transfers the right to propose: Supervisory intervention transfers the right to propose on named
      actuator channels from the policy to an authenticated person, committed on a control tick and bounded by a
      lease, while every human command still passes the permission check.
    Takeover delay in the stopping budget: Takeover latency (sensory, cognitive, motor, console) is long-tailed
      and must be budgeted at a design percentile as a delay before braking, which sets the speed a supervised machine
      may run.
    Clearance-derived fallback deadline: Fixing the current speed and solving the stopping inequality for the wait
      gives the latest fallback deadline, so a handover timeout is a function of state, and any configured ceiling
      is clipped to it.
    Authority leases and physical presence: Autonomous chunks and manual sessions hold separate leases on the safety
      MCU's clock, so a silent policy, a dropped link, or an incapacitated operator loses authority to a state-matched
      local fallback.
    Single-writer handover handshake: Per channel, authority resolves every tick to exactly one state with the enforcer
      the sole actuator writer, and a four-phase request-acknowledge-commit-release handshake moves it.
    Bumpless transfer: A setpoint swap at commit demands an unbounded command derivative, so the enforcer blends
      between latched endpoints with a quintic smoothstep whose duration is set by the rate limit and paid from
      stopping reserve.
    Mode confusion and per-channel annunciation: Single-writer gating resolves arbitration faults but not mode confusion,
      the gap between the mode a supervisor believes and the actual one, which only per-channel masks and annunciation
      fix.
    Authority record: The authority record binds a sealed static authority manifest to a per-tick evidence tuple
      of time, authority state, measured state, proposed and admitted commands, so every handover is reconstructable
      and attributable.
    Authenticating interventions: Protective stops never wait for verification while motion commands, which inject
      energy, must be authenticated, attributable, and fresh, and the verifier's availability must itself be protected.
    Causal intervention masking: A takeover log is split into intervals by commit, blend-end, and stabilization
      timestamps, and only the stabilized human interval trains as demonstration.
    Trustworthy operational logs: Reconstruction needs a log that survives physical failure and records both sides
      of the causal boundary on synchronized clocks, because dispatched commands alone cannot prove delivered torque.
    Ironies of automation: Automation leaves the human the hardest, least-time cases with degraded skill and a stale
      forward model, so oversight degrades exactly when it is needed.
    Shared autonomy blending: Blending human and policy commands works only when goals are unimodal and every intermediate
      blend is admissible; across modes a convex combination is a new, unchecked command.
    Remote-assistance session admission: A remote assistant is admitted only if reaction budget, handshake latency,
      manual lease, and blend window fit the remaining clearance, and remote assistance is never a safety layer.
