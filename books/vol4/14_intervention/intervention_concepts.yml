  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.intervention.delay
      label: Takeover delay
      teaches: Takeover delay in the stopping budget
      summary: Time consumed while a person perceives, decides, and transfers an intervention into the machine's
        admitted control path.
      section: sec-intervention-reaction-drift
    - id: vol4.intervention.handoff
      label: Single-writer handoff
      teaches: Single-writer handover handshake
      summary: An authority-transfer protocol that prevents concurrent writers and requires fresh admission
        before the new proposer controls motion.
      section: sec-intervention-handshake-protocol
    relationships:
    - id: vol4.field.intervention-delay--stopping-distance
      source: vol4.intervention.delay
      predicate: adds pre-brake travel to
      target: vol4.stopping.distance
      explanation: Human waiting adds travel before braking and therefore increases the full stopping-clearance
        requirement. It is charged separately from the fixed local pre-brake delay term.
      conditions: Charge observation, cognition, communication, handoff, and admission delays according
        to the intervention mode; keep independent local fallback available.
      status: draft
      evidence:
        section: sec-intervention-reaction-drift
        quote: Waiting consumes distance before the selected stop begins. The finished stopping budget from
          @sec-enforcement-composite-budget supplies the machine delay, resident stop, and fixed allowances.
          Adding the human waiting interval exposes whether remote rescue can fit at the current speed;
          it does not authorize waiting when the local stop is already required.
    - id: vol4.field.intervention-handoff--authority-actuation
      source: vol4.intervention.handoff
      predicate: transfers proposer access beneath
      target: vol4.authority.actuation
      explanation: The handoff changes which source may propose without creating a second writer or bypassing
        local permission.
      conditions: The new writer is admitted only after the old authority is revoked and the state and freshness
        checks pass.
      status: draft
      evidence:
        section: sec-intervention-handshake-protocol
        quote: 'If a single network packet could switch a channel directly from `Autonomous` to `Human-Manual`,
          a delayed request could hand the actuators to an operator whose view of the aisle is already stale.
          With the same single packet, a dropped reply could leave the operator and the machine disagreeing
          on who is driving. Moving a channel between states instead takes a deterministic **four-phase
          takeover protocol**\index{Four-phase takeover protocol}\index{Handover!four-phase protocol} (`Request`
          $\to$ `Acknowledge` $\to$ `Commit` $\to$ `Confirm`) run by the safety microcontroller. This four-stage
          exchange separates the local hardware commit from the physical blend and from the final release
          of manual proposal rights, checks cryptographic freshness so replayed frames cannot trigger a
          switch, and changes ownership on a single tick boundary:'
    - id: vol4.field.intervention-handoff--motion-feasibility
      source: vol4.intervention.handoff
      predicate: must respect
      target: vol4.motion.feasibility
      explanation: A smooth command transfer avoids reference steps, but actuator tracking and qualified
        plant limits still decide whether the motion is physically feasible.
      conditions: Any blend time also consumes stopping clearance; use qualified initial-condition matching
        and a bounded handoff.
      status: draft
      evidence:
        section: sec-intervention-bumpless-transfer
        quote: '1.  **Significance**: A setpoint step has an unbounded ideal derivative. A $\Glyph{C}^2$
          command profile removes that discontinuity; measured actuator tracking and plant limits still
          decide physical feasibility.

          2.  **Distinction**: Unlike a linear interpolation ramp whose derivative jumps at both endpoints,
          a $\Glyph{C}^2$ quintic spline enforces vanishing first and second derivatives ($\BumplessTransferBlendRate
          = \BumplessTransferBlendAcceleration = 0$) at entry and exit, making the interpolated command
          and its first two derivatives continuous for stationary endpoint derivatives. The physical meaning
          of those derivatives depends on the command channel.

          3.  **Common pitfall**: Choosing a window shorter than the rate limit allows for a fixed acceleration-command
          change (the bound @eq-intervention-blend-window derives below) breaches the stated command-jerk
          limit even though the profile is smooth. Resonance, slip, and stopping distance require plant
          tests.'
