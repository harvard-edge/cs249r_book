<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#FFFFFF"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): FOUR-PHASE HANDSHAKE PROTOCOL                             -->
  <!-- ==================================================================== -->
  <text x="480" y="32" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">(a) Handshake Protocol</text>

  <!-- Step 1: Request -->
  <rect x="60" y="52" width="160" height="46" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="140" y="80" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">1. Request</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="220" y1="75" x2="280" y2="75" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <!-- Step 2: Acknowledge -->
  <rect x="280" y="52" width="160" height="46" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="360" y="80" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">2. Acknowledge</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="440" y1="75" x2="500" y2="75" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <!-- Step 3: Commit & Blend -->
  <rect x="500" y="52" width="180" height="46" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="590" y="80" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3. Commit &amp; Blend</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="680" y1="75" x2="740" y2="75" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <!-- Step 4: Active Manual -->
  <rect x="740" y="52" width="160" height="46" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="820" y="80" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">4. Active Manual</text>

  <!-- Section Divider -->
  <line x1="50" y1="126" x2="910" y2="126" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (b): STATE ARBITER                                             -->
  <!-- ==================================================================== -->
  <text x="480" y="156" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">(b) State Arbiter</text>

  <!-- Transitions -->
  <!-- Autonomous -> Handover Pending -->
  <line x1="250" y1="215" x2="390" y2="215" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <text x="320" y="206" font-size="10.5" font-weight="600" fill="#2563EB" text-anchor="middle">Request</text>

  <!-- Handover Pending -> Bumpless Blend -->
  <line x1="565" y1="215" x2="705" y2="215" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="635" y="206" font-size="10.5" font-weight="600" fill="#059669" text-anchor="middle">ACK</text>

  <!-- Bumpless Blend -> Human Manual -->
  <line x1="795" y1="242" x2="795" y2="330" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <text x="807" y="290" font-size="10.5" font-weight="600" fill="#2563EB">Commit</text>

  <!-- Handover Pending -> Degraded Fallback (Timeout) -->
  <line x1="480" y1="242" x2="480" y2="330" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="492" y="290" font-size="10.5" font-weight="600" fill="#DC2626">Timeout</text>

  <!-- Human Manual -> Degraded Fallback (Lease Expire) -->
  <line x1="710" y1="362" x2="570" y2="362" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="640" y="353" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">Lease Expire</text>

  <!-- Autonomous -> Degraded Fallback (Fault) -->
  <line x1="225" y1="242" x2="410" y2="332" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="310" y="295" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="end">Fault</text>

  <!-- Degraded Fallback -> Autonomous (Reset loop) -->
  <path d="M 395 370 L 165 370 L 165 247" fill="none" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-dark)"/>
  <text x="155" y="315" font-size="10.5" font-weight="600" fill="#475569" text-anchor="end">Reset</text>

  <!-- State Nodes -->
  <!-- State 1: Autonomous -->
  <rect x="80" y="188" width="170" height="54" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="165" y="220" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Autonomous</text>

  <!-- State 2: Handover Pending -->
  <rect x="395" y="188" width="170" height="54" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="480" y="220" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">Handover Pending</text>

  <!-- State 3: Bumpless Blend -->
  <rect x="710" y="188" width="170" height="54" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="795" y="220" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Bumpless Blend</text>

  <!-- State 4: Human Manual -->
  <rect x="710" y="335" width="170" height="54" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="795" y="367" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Human Manual</text>

  <!-- State 5: Degraded Fallback -->
  <rect x="395" y="335" width="170" height="54" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="480" y="367" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle">Degraded Fallback</text>
</svg>
