2" width="200" x="460.0" y="50" /><text fill="#1F407A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="560.0" y="80">3. Commit &amp; Blend</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" x="560.0" y="105">Atomic register swap</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" x="560.0" y="125">C² quintic blending α(t)</text><line stroke="#2D3748" stroke-width="2" x1="660.0" x2="676.0" y1="100.0" y2="100.0" /><polygon fill="#2D3748" points="680.0,100.0 674.0,96.0 674.0,104.0" /><rect fill="#F7FAFC" height="100" rx="4" stroke="#1F407A" stroke-width="2" width="200" x="680.0" y="50" /><text fill="#1F407A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="780.0" y="80">4. Confirm &amp; Active</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" x="780.0" y="105">α = 1.0 active human cmd</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" x="780.0" y="125">Lease T_lease ≤ 100ms</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="450.0" y="35">Synchronous Four-Phase Handshake Pipeline</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="250.0" y="240">Discrete Authority State Machine</text><line stroke="#1F407A" stroke-width="2" x1="155.0" x2="375.0" y1="310.0" y2="310.0" /><polygon fill="#1F407A" points="375.0,310.0 367.97933950487703,313.83540430883363 367.97933950487703,306.16459569116637" /><text fill="#1F407A" filter="url(#solid_bg)" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" x="265.0" y="302.0">Request</text><line stroke="#1F407A" stroke-width="2" x1="375.0" x2="375.0" y1="310.0" y2="410.0" /><polygon fill="#1F407A" points="375.0,410.0 371.16459569116637,402.97933950487703 378.83540430883363,402.97933950487703" /><text fill="#1F407A" filter="url(#solid_bg)" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" x="405.0" y="360.0">ACK + Auth</text><line stroke="#1F407A" stroke-width="2" x1="375.0" x2="375.0" y1="410.0" y2="510.0" /><polygon fill="#1F407A" points="375.0,510.0 371.16459569116637,502.97933950487703 378.83540430883363,502.97933950487703" /><text fill="#1F407A" filter="url(#solid_bg)" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" x="405.0" y="455.0">Commit</text><text fill="#1F407A" filter="url(#solid_bg)" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" x="405.0" y="470.0">α=1.0</text><line stroke="#A51C30" stroke-width="2" x1="310" x2="155.0" y1="310.0" y2="480" /><polygon fill="#A51C30" points="155.0,480 156.89600266430762,472.2279234501365 162.56439151987357,477.39616034785837" /><text fill="#A51C30" filter="url(#solid_bg)" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" x="252.5" y="385.0">Timeout</text><text fill="#A51C30" filter="url(#solid_bg)" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" x="252.5" y="400.0">500ms</text><line stroke="#A51C30" stroke-width="2" x1="310" x2="220" y1="510.0" y2="510.0" /><polygon fill="#A51C30" points="220,510.0 227.02066049512297,506.16459569116637 227.02066049512297,513.8354043088336" /><text fill="#A51C30" filter="url(#solid_bg)" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" x="265.0" y="502.0">Lease Expire</text><line stroke="#A51C30" stroke-width="2" x1="155.0" x2="155.0" y1="340" y2="480" /><polygon fill="#A51C30" points="155.0,480 151.16459569116637,472.97933950487703 158.83540430883363,472.97933950487703" /><text fill="#A51C30" filter="url(#solid_bg)" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" x="125.0" y="400.0">Critical</text><text fill="#A51C30" filter="url(#solid_bg)" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" x="125.0" y="415.0">Fault</text><rect fill="#F7FAFC" height="60" rx="4" stroke="#1F407A" stroke-width="2" width="130" x="90" y="280" /><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="155.0" y="315">Autonomous</text><rect fill="#F7FAFC" height="60" rx="4" stroke="#1F407A" stroke-width="2" width="130" x="310" y="280" /><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="375.0" y="315">Handover-Pending</text><rect fill="#F7FAFC" height="60" rx="4" stroke="#1F407A" stroke-width="2" width="130" x="310" y="380" /><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="375.0" y="415">Bumpless-Blend</text><rect fill="#F7FAFC" height="60" rx="4" stroke="#1F407A" stroke-width="2" width="130" x="310" y="480" /><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="375.0" y="515">Human-Manual</text><rect fill="#F7FAFC" height="60" rx="4" stroke="#A51C30" stroke-width="2" width="130" x="90" y="480" /><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="155.0" y="515">Degraded-Fallback</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="155.0" y="530">(Safe Stop)</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="690.0" y="240">Real-Time Arbitration Hierarchy</text><rect fill="#F7FAFC" height="60" rx="4" stroke="#A51C30" stroke-width="2" width="280" x="550.0" y="280" /><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" x="560.0" y="305">Tier 1: Safety Enforcer</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" x="560.0" y="325">h(x) ≥ 0, Kinematic Bounds</text><rect fill="#F7FAFC" height="60" rx="4" stroke="#1F407A" stroke-width="2" width="280" x="550.0" y="355" /><line stroke="#2D3748" stroke-width="2" x1="690.0" x2="690.0" y1="340" y2="353" /><polygon fill="#2D3748" points="690.0,355 686.0,349 694.0,349" /><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" x="560.0" y="380">Tier 2: Human Manual</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" x="560.0" y="400">α = 1.0, Lease active</text><rect fill="#F7FAFC" height="60" rx="4" stroke="#CBD5E1" stroke-width="2" width="280" x="550.0" y="430" /><line stroke="#2D3748" stroke-width="2" x1="690.0" x2="690.0" y1="415" y2="428" /><polygon fill="#2D3748" points="690.0,430 686.0,424 694.0,424" /><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" x="560.0" y="455">Tier 3: Learned Policy</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" x="560.0" y="475">Nominal Autonomous</text><rect fill="#EDF2F7" height="50" rx="4" stroke="#2D3748" stroke-dasharray="4,4" stroke-width="1" width="280" x="550.0" y="515" /><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="690.0" y="535">Evidence Audit Tuple (64-byte)</text><text fill="#2D3748" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" x="690.0" y="555">IEEE 1588 ts | S_auth | x | u_act | SHA-256 HMAC</text></svg>