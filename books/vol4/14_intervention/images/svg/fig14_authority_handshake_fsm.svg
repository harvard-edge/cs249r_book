<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .section-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .card-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e3a8a; }
      .card-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; line-height: 1.4; }
      .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 600; fill: #0f172a; }
      .trans-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #2563eb; }
      .trans-label-alert { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #dc2626; }
      .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .mono-text { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; fill: #475569; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#ffffff"/>

  <!-- Top Title -->
  <text x="450" y="32" class="title" text-anchor="middle">Synchronous Four-Phase Handshake Pipeline</text>

  <!-- Pipeline Phase Cards -->
  <!-- Phase 1 -->
  <g transform="translate(20, 48)">
    <rect width="200" height="96" rx="4" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="200" height="28" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="200" height="8" y="20" fill="#eff6ff"/>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="19" class="card-title" text-anchor="middle">1. Request</text>
    <text x="100" y="52" class="card-text" text-anchor="middle">Override torque |τ| &gt; 4.0 Nm</text>
    <text x="100" y="74" class="card-text" text-anchor="middle">or policy ODD departure</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="220" y1="96" x2="238" y2="96" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Phase 2 -->
  <g transform="translate(240, 48)">
    <rect width="200" height="96" rx="4" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="200" height="28" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="200" height="8" y="20" fill="#eff6ff"/>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="19" class="card-title" text-anchor="middle">2. Intercept &amp; Auth</text>
    <text x="100" y="52" class="card-text" text-anchor="middle">1 kHz hardware token</text>
    <text x="100" y="74" class="card-text" text-anchor="middle">Freshness Δt ≤ 100 ms</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="440" y1="96" x2="458" y2="96" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Phase 3 -->
  <g transform="translate(460, 48)">
    <rect width="200" height="96" rx="4" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="200" height="28" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="200" height="8" y="20" fill="#eff6ff"/>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="19" class="card-title" text-anchor="middle">3. Commit &amp; Blend</text>
    <text x="100" y="52" class="card-text" text-anchor="middle">Atomic register swap</text>
    <text x="100" y="74" class="card-text" text-anchor="middle">C² quintic blending α(t)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="660" y1="96" x2="678" y2="96" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Phase 4 -->
  <g transform="translate(680, 48)">
    <rect width="200" height="96" rx="4" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="200" height="28" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="200" height="8" y="20" fill="#eff6ff"/>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="19" class="card-title" text-anchor="middle">4. Confirm &amp; Active</text>
    <text x="100" y="52" class="card-text" text-anchor="middle">α = 1.0 active human cmd</text>
    <text x="100" y="74" class="card-text" text-anchor="middle">Lease T_lease ≤ 100 ms</text>
  </g>

  <!-- Divider Line -->
  <line x1="20" y1="172" x2="880" y2="172" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Lower Section Titles -->
  <text x="260" y="210" class="section-title" text-anchor="middle">Discrete Authority State Machine</text>
  <text x="700" y="210" class="section-title" text-anchor="middle">Real-Time Arbitration Hierarchy</text>

  <!-- State Machine Nodes & Transitions -->
  <!-- Transitions rendered first with proper endpoint clipping -->
  
  <!-- Transition: Autonomous -> Handover-Pending -->
  <line x1="190" y1="275" x2="298" y2="275" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="220" y="263" width="50" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="245" y="276" class="trans-label" text-anchor="middle">Request</text>

  <!-- Transition: Handover-Pending -> Bumpless-Blend -->
  <line x1="365" y1="305" x2="365" y2="359" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="375" y="323" width="75" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="412" y="336" class="trans-label" text-anchor="middle">ACK + Auth</text>

  <!-- Transition: Bumpless-Blend -> Human-Manual -->
  <line x1="365" y1="419" x2="365" y2="473" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="375" y="437" width="90" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="420" y="450" class="trans-label" text-anchor="middle">Commit (α=1.0)</text>

  <!-- Transition: Human-Manual -> Degraded-Fallback (Lease Expire) -->
  <line x1="300" y1="504" x2="198" y2="504" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="215" y="492" width="72" height="18" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="251" y="505" class="trans-label-alert" text-anchor="middle">Lease Expire</text>

  <!-- Transition: Autonomous -> Degraded-Fallback (Critical Fault) -->
  <line x1="125" y1="305" x2="125" y2="473" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="80" y="380" width="74" height="22" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="117" y="395" class="trans-label-alert" text-anchor="middle">Critical Fault</text>

  <!-- Transition: Handover-Pending -> Degraded-Fallback (Timeout 500ms) -->
  <path d="M 300 290 Q 235 340 183 473" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="200" y="345" width="84" height="22" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="242" y="360" class="trans-label-alert" text-anchor="middle">Timeout 500 ms</text>

  <!-- Node: Autonomous -->
  <g transform="translate(60, 245)">
    <rect width="130" height="60" rx="3" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="65" y="35" class="node-title" text-anchor="middle">Autonomous</text>
  </g>

  <!-- Node: Handover-Pending -->
  <g transform="translate(300, 245)">
    <rect width="130" height="60" rx="3" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="65" y="35" class="node-title" text-anchor="middle">Handover-Pending</text>
  </g>

  <!-- Node: Bumpless-Blend -->
  <g transform="translate(300, 359)">
    <rect width="130" height="60" rx="3" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="65" y="35" class="node-title" text-anchor="middle">Bumpless-Blend</text>
  </g>

  <!-- Node: Human-Manual -->
  <g transform="translate(300, 473)">
    <rect width="130" height="60" rx="3" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="65" y="35" class="node-title" text-anchor="middle">Human-Manual</text>
  </g>

  <!-- Node: Degraded-Fallback (Safe Stop) -->
  <g transform="translate(60, 473)">
    <rect width="130" height="62" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="65" y="27" class="node-title" fill="#dc2626" font-weight="700" text-anchor="middle">Degraded-Fallback</text>
    <text x="65" y="47" class="badge-text" fill="#991b1b" font-weight="600" text-anchor="middle">(Safe Stop)</text>
  </g>

  <!-- Right Column: Real-Time Arbitration Hierarchy -->
  <!-- Tier 1: Safety Enforcer -->
  <g transform="translate(530, 235)">
    <rect width="340" height="62" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="16" y="26" font-family="'Inter', system-ui, sans-serif" font-size="13.5px" font-weight="700" fill="#991b1b">Tier 1: Safety Enforcer</text>
    <text x="16" y="48" font-family="'Inter', system-ui, sans-serif" font-size="12px" fill="#b91c1c">h(x) ≥ 0, Kinematic Bounds</text>
  </g>

  <!-- Arrow Tier 1 -> Tier 2 -->
  <line x1="700" y1="297" x2="700" y2="319" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- Tier 2: Human Manual -->
  <g transform="translate(530, 323)">
    <rect width="340" height="62" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="16" y="26" font-family="'Inter', system-ui, sans-serif" font-size="13.5px" font-weight="700" fill="#1e3a8a">Tier 2: Human Manual</text>
    <text x="16" y="48" font-family="'Inter', system-ui, sans-serif" font-size="12px" fill="#1d4ed8">α = 1.0, Lease active</text>
  </g>

  <!-- Arrow Tier 2 -> Tier 3 -->
  <line x1="700" y1="385" x2="700" y2="407" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- Tier 3: Learned Policy -->
  <g transform="translate(530, 411)">
    <rect width="340" height="62" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="16" y="26" font-family="'Inter', system-ui, sans-serif" font-size="13.5px" font-weight="700" fill="#334155">Tier 3: Learned Policy</text>
    <text x="16" y="48" font-family="'Inter', system-ui, sans-serif" font-size="12px" fill="#475569">Nominal Autonomous</text>
  </g>

  <!-- Audit Tuple Box -->
  <g transform="translate(530, 497)">
    <rect width="340" height="52" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.5"/>
    <text x="170" y="22" font-family="'Inter', system-ui, sans-serif" font-size="12px" font-weight="700" fill="#1e293b" text-anchor="middle">Evidence Audit Tuple (64-byte)</text>
    <text x="170" y="40" class="mono-text" text-anchor="middle">IEEE 1588 ts | S_auth | x | u_act | SHA-256 HMAC</text>
  </g>
</svg>