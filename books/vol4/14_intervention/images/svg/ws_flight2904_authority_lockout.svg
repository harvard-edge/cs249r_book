<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>
  <rect width="680" height="245" fill="#fff" rx="4"/>
  <text x="24" y="27" font-size="13" font-weight="700" fill="#333">Crew requests deceleration</text>
  <rect x="22" y="42" width="190" height="72" rx="4" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="33" y="68" font-size="11" font-weight="700" fill="#333">Brake pedals</text>
  <text x="33" y="88" font-size="10" fill="#555">Thrust reverser levers</text>
  <text x="33" y="104" font-size="9" fill="#555">Right gear contacts first</text>
  <line x1="213" y1="80" x2="239" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="244" y="42" width="205" height="127" rx="4" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="256" y="64" font-size="11" font-weight="700" fill="#333">Distinct ground gates</text>
  <text x="256" y="86" font-size="9.5" fill="#333">Spoilers: both struts OR</text>
  <text x="256" y="102" font-size="9.5" fill="#333">both wheels &gt; 72 kt</text>
  <text x="256" y="123" font-size="9.5" fill="#333">Reversers: both struts</text>
  <text x="256" y="145" font-size="9.5" fill="#333">Wheel brakes: separate gate</text>
  <line x1="450" y1="80" x2="476" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="481" y="42" width="178" height="127" rx="4" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/>
  <text x="493" y="64" font-size="11" font-weight="700" fill="#333">Delayed response</text>
  <text x="493" y="88" font-size="9.5" fill="#333">Left gear contacts ~9 s later</text>
  <text x="493" y="107" font-size="9.5" fill="#333">Wheel braking begins ~4 s</text>
  <text x="493" y="123" font-size="9.5" fill="#333">after left contact</text>
  <text x="493" y="146" font-size="9.5" fill="#333">Runway overrun</text>
  <text x="340" y="208" font-size="10" fill="#555" text-anchor="middle">A crew input and each actuator effect require separate state and timing evidence.</text>
</svg>
