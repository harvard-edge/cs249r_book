<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0.5 L 6 3 L 0 5.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Header -->
  <text x="16" y="23" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.2">SUPERVISORY STATE MACHINE LOCKOUT (FLIGHT 2904 ARCHITECTURE)</text>
  <text x="16" y="35" font-size="8" font-weight="400" fill="#64748b">Sensor misclassification locks state arbiter, suppressing human emergency intervention</text>

  <!-- ================= CARD 1: HUMAN EMERGENCY COMMAND ================= -->
  <rect x="16" y="44" width="140" height="114" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="24" y="58" font-size="8.5" font-weight="700" fill="#1e293b">1. Crew Intervention</text>
  <text x="24" y="68" font-size="7" font-weight="400" fill="#64748b">Manual emergency inputs</text>

  <!-- Brake Pedal Action Block -->
  <rect x="22" y="74" width="128" height="23" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="28" y="84" font-size="7.5" font-weight="700" fill="#14532d">Brake Pedals Depressed</text>
  <text x="28" y="93" font-size="6.5" font-weight="500" fill="#14532d">F_pedal &gt; 100% (Full manual effort)</text>

  <!-- Thrust Reverser Action Block -->
  <rect x="22" y="101" width="128" height="23" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="28" y="111" font-size="7.5" font-weight="700" fill="#14532d">Thrust Reversers Pulled</text>
  <text x="28" y="120" font-size="6.5" font-weight="500" fill="#14532d">Command: Full Reverse Power</text>

  <!-- Intent summary -->
  <rect x="22" y="128" width="128" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="86" y="139" font-size="7" font-weight="700" fill="#334155" text-anchor="middle">Operator Intent: Safe Stop</text>
  <text x="86" y="147" font-size="6.5" font-weight="500" fill="#64748b" text-anchor="middle">Demands immediate deceleration</text>

  <!-- Connector 1 -> 2: Overrides submitted -->
  <line x1="156" y1="95" x2="178" y2="95" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>
  <text x="168" y="90" font-size="6.5" font-weight="700" fill="#475569" text-anchor="middle">Signal</text>

  <!-- ================= CARD 2: SOFTWARE STATE ARBITER ================= -->
  <rect x="180" y="44" width="164" height="114" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
  <text x="188" y="58" font-size="8.5" font-weight="700" fill="#78350f">2. Software State Arbiter</text>
  <text x="188" y="68" font-size="7" font-weight="400" fill="#78350f">Sensor logic &amp; interlock gating</text>

  <!-- Erroneous Sensor Ingress -->
  <rect x="186" y="74" width="152" height="23" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="192" y="84" font-size="7" font-weight="700" fill="#1e3a8a">Sensor: Hydroplane Defect</text>
  <text x="192" y="93" font-size="6.5" font-weight="500" fill="#1e3a8a">Squat &lt; 6.3 t  |  Wheel spd &lt; 72 kt</text>

  <!-- State Register -->
  <rect x="186" y="101" width="152" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="262" y="113" font-size="7" font-weight="700" fill="#c44" text-anchor="middle">State Reg: S_ground = 0 (AIRBORNE)</text>

  <!-- Authority Lockout Interlock -->
  <rect x="186" y="123" width="152" height="27" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="262" y="134" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="middle">INTERLOCK LOCKOUT ACTIVE</text>
  <text x="262" y="145" font-size="6.5" font-weight="600" fill="#7f1d1d" text-anchor="middle">Inhibits manual reverse &amp; brakes</text>

  <!-- Connector 2 -> 3: BLOCKED GATE -->
  <line x1="344" y1="95" x2="366" y2="95" stroke="#c44" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="356" cy="95" r="7" fill="#ffffff" stroke="#c44" stroke-width="1.2"/>
  <line x1="352" y1="91" x2="360" y2="99" stroke="#c44" stroke-width="1.4"/>
  <line x1="360" y1="91" x2="352" y2="99" stroke="#c44" stroke-width="1.4"/>
  <text x="356" y="84" font-size="6.5" font-weight="700" fill="#c44" text-anchor="middle">BLOCK</text>

  <!-- ================= CARD 3: ACTUATOR & RUNWAY COLLISION ================= -->
  <rect x="368" y="44" width="156" height="114" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="376" y="58" font-size="8.5" font-weight="700" fill="#7f1d1d">3. Actuators &amp; Plant</text>
  <text x="376" y="68" font-size="7" font-weight="400" fill="#7f1d1d">Physical execution decoupled</text>

  <!-- Brake Valve Locked Out -->
  <rect x="374" y="74" width="144" height="23" rx="2" fill="#ffffff" stroke="#c44" stroke-width="0.75"/>
  <text x="380" y="84" font-size="7.5" font-weight="700" fill="#7f1d1d">Wheel Brakes: 0 bar</text>
  <text x="380" y="93" font-size="6.5" font-weight="500" fill="#64748b">Hydraulic lines depressurized</text>

  <!-- Reverser Latched -->
  <rect x="374" y="101" width="144" height="23" rx="2" fill="#ffffff" stroke="#c44" stroke-width="0.75"/>
  <text x="380" y="111" font-size="7.5" font-weight="700" fill="#7f1d1d">Thrust Reversers: LOCKED</text>
  <text x="380" y="120" font-size="6.5" font-weight="500" fill="#64748b">Mechanical blocker doors locked</text>

  <!-- Collision Pill Badge (Two lines) -->
  <rect x="374" y="128" width="144" height="22" rx="2" fill="#c44" stroke="#7f1d1d" stroke-width="0.75"/>
  <text x="446" y="137.5" font-size="6.5" font-weight="700" fill="#ffffff" text-anchor="middle">9 s UNBRAKED RUNWAY FLOAT</text>
  <text x="446" y="146.5" font-size="6.5" font-weight="700" fill="#ffffff" text-anchor="middle">Embankment Impact @ 133 km/h</text>

  <!-- Bottom Systems Takeaway Footer -->
  <text x="270" y="171" font-size="7.5" font-weight="500" fill="#64748b" text-anchor="middle">Core Flaw: Sensor misclassification overrides human emergency safety reflexes, inverting preemption priority.</text>
</svg>
