<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <style>
      .panel-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .axis-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
      .tick-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
      .legend-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; }
      .callout-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="#ffffff"/>

  <!-- ================= PANEL A ================= -->
  <g transform="translate(25, 20)">
    <!-- Container Card -->
    <rect width="410" height="405" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="205" y="30" class="panel-title" text-anchor="middle">Panel A: Unblended Step (0 ms Transfer)</text>

    <!-- Grid lines -->
    <g stroke="#f1f5f9" stroke-width="1">
      <line x1="50" y1="70" x2="380" y2="70"/>
      <line x1="50" y1="140" x2="380" y2="140"/>
      <line x1="50" y1="210" x2="380" y2="210"/>
      <line x1="50" y1="280" x2="380" y2="280"/>
      <line x1="50" y1="350" x2="380" y2="350"/>

      <line x1="130" y1="70" x2="130" y2="350"/>
      <line x1="210" y1="70" x2="210" y2="350"/>
      <line x1="290" y1="70" x2="290" y2="350"/>
      <line x1="370" y1="70" x2="370" y2="350"/>
    </g>

    <!-- Axes -->
    <line x1="50" y1="70" x2="50" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="50" y1="350" x2="380" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="215" y="375" class="axis-label" text-anchor="middle">Time (ms)</text>
    <text x="42" y="66" class="tick-label" text-anchor="end">High</text>
    <text x="42" y="335" class="tick-label" text-anchor="end">Low</text>
    <text x="42" y="354" class="tick-label" text-anchor="end">0</text>

    <!-- Waveforms -->
    <!-- Commanded Torque Step: Blue -->
    <path d="M 50, 330 L 120, 330 L 120, 100 L 380, 100" fill="none" stroke="#2563eb" stroke-width="2.5"/>

    <!-- Infinite Jerk Spike: Red -->
    <line x1="120" y1="350" x2="120" y2="70" stroke="#dc2626" stroke-width="2.5"/>

    <!-- Drivetrain Ringing (25 Hz): Dotted Charcoal -->
    <path d="M 120,100 L 120,62.0 L 123,72.4 L 126,92.8 L 129,110.1 L 132,114.9 L 135,106.1 L 138,90.2 L 141,77.4 L 144,74.5 L 147,82.0 L 150,94.2 L 153,103.7 L 156,105.3 L 159,99.1 L 162,89.6 L 165,82.7 L 168,82.0 L 171,87.1 L 174,94.3 L 177,99.4 L 180,99.6 L 183,95.4 L 186,89.8 L 189,86.2 L 192,86.3 L 195,89.7 L 198,94.0 L 201,96.6 L 204,96.3 L 207,93.5 L 210,90.3 L 213,88.4 L 216,88.8 L 219,91.0 L 222,93.5 L 225,94.8 L 228,94.4 L 231,92.6 L 234,90.7 L 237,89.8 L 240,90.3 L 243,91.6 L 246,93.0 L 249,93.7 L 252,93.3 L 255,92.2 L 258,91.1 L 261,90.7 L 264,91.1 L 267,91.9 L 270,92.7 L 273,93.0 L 276,92.7 L 279,92.0 L 282,91.4 L 285,91.2 L 288,91.5 L 291,92.0 L 294,92.5 L 297,92.6 L 300,92.2 L 303,91.8 L 306,91.6 L 309,91.8 L 312,92.0 L 315,92.0" fill="none" stroke="#334155" stroke-dasharray="3,3" stroke-width="1.5"/>

    <!-- Callouts with crisp badges -->
    <!-- Commanded Torque Label Badge at plateau -->
    <rect x="235" y="55" width="140" height="22" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="305" y="70" class="legend-text" fill="#1e40af" text-anchor="middle">Commanded Torque τ(t)</text>

    <!-- Infinite Jerk Spike Callout Badge -->
    <rect x="135" y="195" width="118" height="24" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="194" y="211" class="callout-text" fill="#dc2626" text-anchor="middle">Infinite Jerk Spike</text>
    <line x1="120" y1="207" x2="135" y2="207" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Drivetrain Ringing Callout Badge -->
    <rect x="190" y="125" width="145" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="262.5" y="140" class="callout-text" fill="#475569" text-anchor="middle">25 Hz Drivetrain Ringing</text>
    <line x1="180" y1="110" x2="190" y2="125" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- ================= PANEL B ================= -->
  <g transform="translate(465, 20)">
    <!-- Container Card -->
    <rect width="410" height="405" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="205" y="30" class="panel-title" text-anchor="middle">Panel B: C² Quintic Blending (750 ms Transfer)</text>

    <!-- Grid lines -->
    <g stroke="#f1f5f9" stroke-width="1">
      <line x1="50" y1="70" x2="380" y2="70"/>
      <line x1="50" y1="140" x2="380" y2="140"/>
      <line x1="50" y1="210" x2="380" y2="210"/>
      <line x1="50" y1="280" x2="380" y2="280"/>
      <line x1="50" y1="350" x2="380" y2="350"/>

      <line x1="130" y1="70" x2="130" y2="350"/>
      <line x1="210" y1="70" x2="210" y2="350"/>
      <line x1="290" y1="70" x2="290" y2="350"/>
      <line x1="370" y1="70" x2="370" y2="350"/>
    </g>

    <!-- Axes -->
    <line x1="50" y1="70" x2="50" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="50" y1="350" x2="380" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="215" y="375" class="axis-label" text-anchor="middle">Time (ms)</text>
    <text x="42" y="66" class="tick-label" text-anchor="end">High</text>
    <text x="42" y="335" class="tick-label" text-anchor="end">Low</text>
    <text x="42" y="354" class="tick-label" text-anchor="end">0</text>

    <!-- Waveforms -->
    <!-- Quintic Blended Torque: Blue -->
    <path d="M 50, 330 L 110, 330 
             L 110.0,330.0 L 112.7,329.98 L 115.4,329.85 L 118.1,329.51 L 120.8,328.87 L 123.5,327.86 
             L 126.2,326.42 L 128.9,324.50 L 131.6,322.06 L 134.3,319.07 L 137.0,315.52 L 139.7,311.39 
             L 142.4,306.69 L 145.1,301.41 L 147.8,295.59 L 150.5,289.23 L 153.2,282.37 L 155.9,275.04 
             L 158.6,267.28 L 161.3,259.13 L 164.0,250.64 L 166.7,241.86 L 169.4,232.86 L 172.1,223.67 
             L 174.8,214.37 L 177.5,205.00 L 180.2,195.63 L 182.9,186.33 L 185.6,177.14 L 188.3,168.14 
             L 191.0,159.36 L 193.7,150.87 L 196.4,142.72 L 199.1,134.96 L 201.8,127.63 L 204.5,120.77 
             L 207.2,114.41 L 209.9,108.59 L 212.6,103.31 L 215.3,98.61  L 218.0,94.48  L 220.7,90.93 
             L 223.4,87.94  L 226.1,85.50  L 228.8,83.58  L 231.5,82.14  L 234.2,81.13  L 236.9,80.49 
             L 239.6,80.15  L 242.3,80.02  L 245.0,80.00 L 380, 80" 
          fill="none" stroke="#2563eb" stroke-width="2.5"/>

    <!-- Bounded Jerk: Red Bell Curve -->
    <path d="M 50, 350 L 110, 350 
             L 110.0,350.0 L 112.7,349.42 L 115.4,347.79 L 118.1,345.23 L 120.8,341.87 L 123.5,337.85 
             L 126.2,333.27 L 128.9,328.26 L 131.6,322.90 L 134.3,317.32 L 137.0,311.60 L 139.7,305.83 
             L 142.4,300.10 L 145.1,294.47 L 147.8,289.04 L 150.5,283.85 L 153.2,278.98 L 155.9,274.47 
             L 158.6,270.37 L 161.3,266.74 L 164.0,263.60 L 166.7,260.99 L 169.4,258.93 L 172.1,257.45 
             L 174.8,256.55 L 177.5,256.25 L 180.2,256.55 L 182.9,257.45 L 185.6,258.93 L 188.3,260.99 
             L 191.0,263.60 L 193.7,266.74 L 196.4,270.37 L 199.1,274.47 L 201.8,278.98 L 204.5,283.85 
             L 207.2,289.04 L 209.9,294.47 L 212.6,300.10 L 215.3,305.83 L 218.0,311.60 L 220.7,317.32 
             L 223.4,322.90 L 226.1,328.26 L 228.8,333.27 L 231.5,337.85 L 234.2,341.87 L 236.9,345.23 
             L 239.6,347.79 L 242.3,349.42 L 245.0,350.00 L 380, 350" 
          fill="none" stroke="#dc2626" stroke-width="2"/>

    <!-- Callouts with crisp badges -->
    <!-- Commanded Torque Label Badge at plateau -->
    <rect x="250" y="55" width="140" height="22" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="320" y="70" class="legend-text" fill="#1e40af" text-anchor="middle">Commanded Torque τ(t)</text>

    <!-- Bounded Jerk Callout Badge -->
    <rect x="220" y="275" width="130" height="24" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="285" y="291" class="callout-text" fill="#dc2626" text-anchor="middle">Bounded Jerk j(t)</text>
    <line x1="200" y1="287" x2="220" y2="287" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
</svg>