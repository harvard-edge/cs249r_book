  <g stroke="#F1F5F9" stroke-width="1">
    <line x1="530" y1="110" x2="890" y2="110"/>
    <line x1="530" y1="180" x2="890" y2="180"/>
    <line x1="530" y1="250" x2="890" y2="250"/>
  </g>

  <!-- Panel B Axes -->
  <line x1="530" y1="320" x2="890" y2="320" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
  <line x1="530" y1="320" x2="530" y2="60" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
  <text x="895" y="324" font-size="11" font-weight="600" fill="#334155">Time t</text>
  <text x="525" y="55" font-size="11" font-weight="600" fill="#334155" text-anchor="end">u, du/dt</text>

  <!-- t0 and t0 + tau_blend guidelines & ticks -->
  <line x1="600" y1="60" x2="600" y2="355" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="320" x2="600" y2="326" stroke="#334155" stroke-width="1.2"/>
  <text x="600" y="340" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">t₀</text>

  <line x1="780" y1="60" x2="780" y2="355" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="780" y1="320" x2="780" y2="326" stroke="#334155" stroke-width="1.2"/>
  <text x="780" y="340" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">t₀ + τ<tspan baseline-shift="sub" font-size="78%">blend</tspan></text>

