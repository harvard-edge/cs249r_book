<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-48.0" y="-21.0" width="1056.0" height="462.0" fill="#ffffff"/>
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" fill="#FFFFFF"/>

  <!-- Panel Divider -->
  <line x1="480" y1="20" x2="480" y2="395" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): UNBLENDED STEP TRANSFER                                  -->
  <!-- ==================================================================== -->
  <text x="240" y="32" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">(a) Unblended Step Transfer</text>

  <!-- Panel A Grid Lines -->
