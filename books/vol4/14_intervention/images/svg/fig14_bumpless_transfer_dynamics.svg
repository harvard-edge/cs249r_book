  <line x1="605" y1="365" x2="775" y2="365" stroke="#64748B" stroke-width="1.2"/>
  <polygon points="600,365 607,362 607,368" fill="#64748B"/>
  <polygon points="780,365 773,362 773,368" fill="#64748B"/>
  <text x="690" y="380" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Window τ<tspan baseline-shift="sub" font-size="78%">blend</tspan></text>

