  <path d="M 600 320 L 600.0 320.0 L 603.6 319.4 L 607.2 317.5 L 610.8 314.7 L 614.4 310.9 L 618.0 306.4 L 621.6 301.3 L 625.2 295.6 L 628.8 289.7 L 632.4 283.4 L 636.0 277.0 L 639.6 270.5 L 643.2 264.1 L 646.8 257.8 L 650.4 251.7 L 654.0 245.9 L 657.6 240.5 L 661.2 235.4 L 664.8 230.8 L 668.4 226.7 L 672.0 223.2 L 675.6 220.3 L 679.2 218.0 L 682.8 216.3 L 686.4 215.3 L 690.0 215.0 L 693.6 215.3 L 697.2 216.3 L 700.8 218.0 L 704.4 220.3 L 708.0 223.2 L 711.6 226.7 L 715.2 230.8 L 718.8 235.4 L 722.4 240.5 L 726.0 245.9 L 729.6 251.7 L 733.2 257.8 L 736.8 264.1 L 740.4 270.5 L 744.0 277.0 L 747.6 283.4 L 751.2 289.7 L 754.8 295.6 L 758.4 301.3 L 762.0 306.4 L 765.6 310.9 L 769.2 314.7 L 772.8 317.5 L 776.4 319.4 L 780.0 320.0 L 780 320" fill="none" stroke="#DC2626" stroke-width="2"/>

  <!-- Direct Labels (No Pills/Badges) -->
  <text x="815" y="95" font-size="11.5" font-weight="700" fill="#2563EB">Command u(t)</text>
  <text x="745" y="240" font-size="11.5" font-weight="700" fill="#DC2626">Bounded du/dt</text>
  <line x1="740" y1="236" x2="710" y2="225" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="2,2"/>
</svg>