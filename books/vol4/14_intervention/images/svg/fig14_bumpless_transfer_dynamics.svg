  <!-- Quintic Blended Torque -->
  <path d="M 530 300 L 600 300 L 600.0 300.0 L 603.6 300.0 L 607.2 299.9 L 610.8 299.6 L 614.4 299.1 L 618.0 298.4 L 621.6 297.3 L 625.2 295.8 L 628.8 294.0 L 632.4 291.7 L 636.0 289.0 L 639.6 285.9 L 643.2 282.3 L 646.8 278.3 L 650.4 273.8 L 654.0 269.0 L 657.6 263.8 L 661.2 258.2 L 664.8 252.3 L 668.4 246.1 L 672.0 239.7 L 675.6 233.0 L 679.2 226.2 L 682.8 219.2 L 686.4 212.1 L 690.0 205.0 L 693.6 197.9 L 697.2 190.8 L 700.8 183.8 L 704.4 177.0 L 708.0 170.3 L 711.6 163.9 L 715.2 157.7 L 718.8 151.8 L 722.4 146.2 L 726.0 141.0 L 729.6 136.2 L 733.2 131.7 L 736.8 127.7 L 740.4 124.1 L 744.0 121.0 L 747.6 118.3 L 751.2 116.0 L 754.8 114.2 L 758.4 112.7 L 762.0 111.6 L 765.6 110.9 L 769.2 110.4 L 772.8 110.1 L 776.4 110.0 L 780.0 110.0 L 890 110" fill="none" stroke="#2563EB" stroke-width="2.5"/>

