<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 670" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Base (clean white, no outer border stroke) -->
  <rect width="980" height="670" fill="#FFFFFF"/>

  <defs>
    <style>
      .txt-halo {
        paint-order: stroke fill;
        stroke: #FFFFFF;
        stroke-width: 3.5px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ==================== TIME AXIS (LEFT) ==================== -->
  <line x1="42" y1="75" x2="42" y2="645" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="42" y="65" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">Time (t)</text>

  <!-- Time Ticks -->
  <line x1="37" y1="108" x2="47" y2="108" stroke="#94A3B8" stroke-width="1"/>
  <text x="33" y="111" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B" text-anchor="end">t₀</text>

  <line x1="37" y1="190" x2="47" y2="190" stroke="#94A3B8" stroke-width="1"/>
  <text x="33" y="193" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B" text-anchor="end">t₁</text>

  <line x1="37" y1="272" x2="47" y2="272" stroke="#94A3B8" stroke-width="1"/>
  <text x="33" y="275" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B" text-anchor="end">t₂</text>

  <line x1="37" y1="365" x2="47" y2="365" stroke="#94A3B8" stroke-width="1"/>
  <text x="33" y="368" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B" text-anchor="end">t₃</text>

  <line x1="37" y1="472" x2="47" y2="472" stroke="#94A3B8" stroke-width="1"/>
  <text x="33" y="475" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B" text-anchor="end">t₄</text>

  <line x1="37" y1="545" x2="47" y2="545" stroke="#94A3B8" stroke-width="1"/>
  <text x="33" y="548" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B" text-anchor="end">t₅</text>

  <!-- ==================== PARTICIPANT LIFELINES (VERTICAL) ==================== -->
  <!-- LIFELINE 1: Human Supervisor (x=140) -->
  <line x1="140" y1="72" x2="140" y2="640" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- LIFELINE 2: Cognitive Policy (x=380) -->
  <line x1="380" y1="72" x2="380" y2="585" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- LIFELINE 3: Intervention Arbiter (x=650) -->
  <line x1="650" y1="72" x2="650" y2="640" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- LIFELINE 4: Real-Time Actuator (x=885) -->
  <line x1="885" y1="72" x2="885" y2="640" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================== PARTICIPANT HEADERS ==================== -->
  <!-- Header 1: Human Supervisor -->
  <rect x="65" y="22" width="150" height="46" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="140" y="40" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Human Supervisor</text>
  <text x="140" y="55" font-size="8.5" fill="#475569" text-anchor="middle">Teleoperation Console</text>

  <!-- Header 2: Cognitive Policy -->
  <rect x="300" y="22" width="160" height="46" rx="4" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1.3"/>
  <text x="380" y="40" font-size="10.5" font-weight="700" fill="#1E40AF" text-anchor="middle">Cognitive Policy</text>
  <text x="380" y="55" font-size="8.5" fill="#2563EB" text-anchor="middle">Linux MPU (10–50 Hz VLA)</text>

  <!-- Header 3: Intervention Arbiter -->
  <rect x="560" y="22" width="180" height="46" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
  <text x="650" y="40" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">Intervention Arbiter</text>
  <text x="650" y="55" font-size="8.5" fill="#059669" text-anchor="middle">Safety MCU (1 kHz RTOS)</text>

  <!-- Header 4: Real-Time Actuator -->
  <rect x="820" y="22" width="130" height="46" rx="0" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.3"/>
  <text x="885" y="40" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Real-Time Actuator</text>
  <text x="885" y="55" font-size="8.5" fill="#475569" text-anchor="middle">Inverter / Motor Drive</text>

  <!-- ==================== ACTIVATION BARS ==================== -->
  <!-- Cognitive Policy: Active from y=80 to y=385 -->
  <rect x="374" y="80" width="12" height="305" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <!-- Cognitive Policy: Muted / Shadow from y=385 to y=575 -->
  <rect x="374" y="385" width="12" height="190" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Intervention Arbiter: Active continuously to y=575 -->
  <rect x="644" y="80" width="12" height="495" rx="2" fill="#DCFCE7" stroke="#059669" stroke-width="1"/>

  <!-- Human Supervisor: Active from handover request y=175 to y=575 -->
  <rect x="134" y="175" width="12" height="400" rx="2" fill="#E2E8F0" stroke="#475569" stroke-width="1"/>

  <!-- Real-Time Actuator: Continuous execution to y=575 -->
  <rect x="879" y="80" width="12" height="495" rx="0" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>

  <!-- ==================== INITIAL STEADY STATE (AUTONOMOUS) ==================== -->
  <!-- Policy to Arbiter -->
  <line x1="386" y1="102" x2="638" y2="102" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="515" y="96" class="txt-halo" font-size="8.5" font-weight="600" fill="#1E40AF" text-anchor="middle">Candidate action chunk û_t:t+H (10–50 Hz unprivileged)</text>

  <!-- Arbiter to Actuator -->
  <line x1="656" y1="124" x2="873" y2="124" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="765" y="118" class="txt-halo" font-size="8.5" font-weight="600" fill="#047857" text-anchor="middle">Admitted setpoint u*(t) (1 kHz PWM, h(x) ≥ 0)</text>

  <!-- ==================== STAGE 1 DIVIDER BANNER ==================== -->
  <g transform="translate(60, 145)">
    <rect width="895" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
    <rect x="0" y="0" width="145" height="22" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8"/>
    <text x="72" y="15" font-size="8.5" font-weight="700" fill="#1E40AF" text-anchor="middle">PHASE 1: NOTICE / REQ</text>
    <text x="155" y="15" font-size="8.5" fill="#334155">Supervisor detects drift / OOD condition and asserts request; Arbiter arms physical timeout</text>
  </g>

  <!-- Supervisor -> Arbiter: REQ_HANDOVER -->
  <line x1="146" y1="188" x2="638" y2="188" stroke="#1F407A" stroke-width="1.3" marker-end="url(#arr-navy)"/>
  <text x="260" y="182" class="txt-halo" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">1. REQ_HANDOVER (reason=OOD, target_state, t_req)</text>

  <!-- Arbiter Timeout Badge -->
  <rect x="665" y="180" width="195" height="18" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="0.8"/>
  <text x="762" y="192.5" font-size="8" font-weight="600" fill="#92400E" text-anchor="middle">Start T_timeout = min(T_cfg, T_latest)</text>

  <!-- ==================== STAGE 2 DIVIDER BANNER ==================== -->
  <g transform="translate(60, 215)">
    <rect width="895" height="22" rx="3" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8"/>
    <rect x="0" y="0" width="155" height="22" rx="3" fill="#FEF3C7" stroke="#FCD34D" stroke-width="0.8"/>
    <text x="77" y="15" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">PHASE 2: DECLUTCH / ACK</text>
    <text x="165" y="15" font-size="8.5" fill="#78350F">Arbiter queries and latches current plant state and endpoint; acknowledges supervisor</text>
  </g>

  <!-- Arbiter -> Policy: GET_STATE_SNAPSHOT -->
  <line x1="644" y1="250" x2="392" y2="250" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="515" y="244" class="txt-halo" font-size="8.5" font-weight="600" fill="#334155" text-anchor="middle">GET_STATE_SNAPSHOT()</text>

  <!-- Policy -> Arbiter: Return Snapshot -->
  <line x1="386" y1="272" x2="638" y2="272" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="515" y="266" class="txt-halo" font-size="8.5" fill="#475569" text-anchor="middle">Snapshot payload: latched u_auto(t₁), state x(t₁)</text>

  <!-- Arbiter -> Supervisor: ACK_HANDOVER -->
  <line x1="644" y1="298" x2="152" y2="298" stroke="#D97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
  <text x="260" y="292" class="txt-halo" font-size="8.5" font-weight="700" fill="#B45309" text-anchor="middle">2. ACK_HANDOVER (x(t₁), u_latched, ack_token)</text>

  <!-- ==================== STAGE 3 DIVIDER BANNER ==================== -->
  <g transform="translate(60, 325)">
    <rect width="895" height="22" rx="3" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="0.8"/>
    <rect x="0" y="0" width="165" height="22" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="82" y="15" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">PHASE 3: COMMIT &amp; BLEND</text>
    <text x="175" y="15" font-size="8.5" fill="#14532D">Atomic revocation of policy write authority; Arbiter executes C² quintic bumpless blend</text>
  </g>

  <!-- Supervisor -> Arbiter: COMMIT_TRANSFER -->
  <line x1="146" y1="360" x2="638" y2="360" stroke="#1F407A" stroke-width="1.3" marker-end="url(#arr-navy)"/>
  <text x="260" y="354" class="txt-halo" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">3. COMMIT_TRANSFER (operator_auth_sig)</text>

  <!-- Arbiter -> Policy: REVOKE_WRITE_TOKEN -->
  <line x1="644" y1="384" x2="388" y2="384" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="515" y="378" class="txt-halo" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">REVOKE_WRITE_TOKEN() [Atomic Cutoff]</text>

  <!-- Policy Muted Pill -->
  <rect x="235" y="394" width="130" height="18" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
  <text x="300" y="406.5" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">Policy Muted (Shadow)</text>

  <!-- Blend Processing Box at Arbiter -->
  <rect x="535" y="406" width="230" height="38" rx="3" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>
  <text x="650" y="420" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">Enforcer C² Quintic Blend (τ_blend)</text>
  <text x="650" y="434" font-size="8" font-family="'Menlo', monospace" fill="#166534" text-anchor="middle">u(t) = (1-β(t))u_auto + β(t)u_man</text>

  <!-- Arbiter -> Actuator: Blended Setpoint -->
  <line x1="656" y1="456" x2="873" y2="456" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="765" y="450" class="txt-halo" font-size="8.5" font-weight="600" fill="#047857" text-anchor="middle">Blended transition trajectory u(t) (1 kHz, zero jerk)</text>

  <!-- ==================== STAGE 4 DIVIDER BANNER ==================== -->
  <g transform="translate(60, 480)">
    <rect width="895" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
    <rect x="0" y="0" width="165" height="22" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8"/>
    <text x="82" y="15" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">PHASE 4: ACTIVE LEASE</text>
    <text x="175" y="15" font-size="8.5" fill="#334155">Human supervisor exercises direct manual control guarded by periodic heartbeat lease</text>
  </g>

  <!-- Arbiter -> Supervisor: CONFIRM_TRANSFER -->
  <line x1="644" y1="518" x2="152" y2="518" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="260" y="512" class="txt-halo" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">4. CONFIRM_TRANSFER (lease_id, T_lease,man = 150 ms)</text>

  <!-- Supervisor -> Arbiter: Manual Command -->
  <line x1="146" y1="540" x2="638" y2="540" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="260" y="534" class="txt-halo" font-size="8.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">Manual command u_man (teleoperation setpoint)</text>

  <!-- Arbiter -> Actuator: Actuation Output -->
  <line x1="656" y1="548" x2="873" y2="548" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="765" y="542" class="txt-halo" font-size="8.5" font-weight="600" fill="#047857" text-anchor="middle">Gated actuation u_man (1 kHz, barrier checked)</text>

  <!-- Supervisor -> Arbiter: Periodic Heartbeat -->
  <line x1="146" y1="570" x2="638" y2="570" stroke="#475569" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-slate)"/>
  <text x="260" y="564" class="txt-halo" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">Periodic HEARTBEAT (Δt = 20 ms &lt; T_lease,man)</text>

  <!-- ==================== SAFETY INVARIANT CALLOUT BOX (BOTTOM) ==================== -->
  <g transform="translate(60, 598)">
    <rect width="895" height="54" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="16" y="19" font-size="9" font-weight="700" fill="#991B1B">Safety Invariant: Lease Expiry or Stalled Handshake Timeout (t &gt; T_timeout)</text>
    <text x="16" y="33" font-size="8.5" fill="#7F1D1D">If heartbeat lapses or handover stalls past clearance budget, Arbiter immediately trips</text>
    <text x="16" y="45" font-size="8.5" fill="#7F1D1D">autonomous FALLBACK_STOP to Actuator in ≤ 1 tick, without waiting for remote recovery.</text>

    <!-- Emergency Stop Arrow from Arbiter (x=650-60=590) into Actuator (x=885-60=825) -->
    <line x1="590" y1="32" x2="815" y2="32" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="702" y="26" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">FALLBACK_STOP</text>
  </g>
</svg>
