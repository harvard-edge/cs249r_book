<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Base (clean white, no outer border stroke) -->
  <rect width="880" height="430" fill="#FFFFFF"/>

  <defs>
    <style>
      .hdr-title { font-size: 11px; font-weight: 700; }
      .hdr-sub { font-size: 8.5px; }
      .msg-text { font-size: 8.5px; font-weight: 600; }
      .phase-tag { font-size: 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
      .code-token { font-family: 'Menlo', monospace; font-size: 8px; }
      .txt-halo {
        paint-order: stroke fill;
        stroke: #FFFFFF;
        stroke-width: 3px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ==================== PARTICIPANT LIFELINES (VERTICAL) ==================== -->
  <!-- Lifeline 1: Human Supervisor (x=150) -->
  <line x1="150" y1="58" x2="150" y2="415" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- Lifeline 2: Cognitive Policy (x=365) -->
  <line x1="365" y1="58" x2="365" y2="390" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- Lifeline 3: Intervention Arbiter (x=600) -->
  <line x1="600" y1="58" x2="600" y2="415" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- Lifeline 4: Real-Time Actuator (x=800) -->
  <line x1="800" y1="58" x2="800" y2="415" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================== PARTICIPANT HEADERS ==================== -->
  <!-- Header 1: Human Supervisor -->
  <rect x="80" y="16" width="140" height="42" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <text x="150" y="33" class="hdr-title" fill="#0F172A" text-anchor="middle">Human Supervisor</text>
  <text x="150" y="47" class="hdr-sub" fill="#475569" text-anchor="middle">Teleoperation Console</text>

  <!-- Header 2: Cognitive Policy -->
  <rect x="290" y="16" width="150" height="42" rx="4" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1.2"/>
  <text x="365" y="33" class="hdr-title" fill="#1E40AF" text-anchor="middle">Cognitive Policy</text>
  <text x="365" y="47" class="hdr-sub" fill="#2563EB" text-anchor="middle">Linux MPU (10–50 Hz)</text>

  <!-- Header 3: Intervention Arbiter -->
  <rect x="520" y="16" width="160" height="42" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
  <text x="600" y="33" class="hdr-title" fill="#047857" text-anchor="middle">Intervention Arbiter</text>
  <text x="600" y="47" class="hdr-sub" fill="#059669" text-anchor="middle">Safety MCU (1 kHz RTOS)</text>

  <!-- Header 4: Real-Time Actuator -->
  <rect x="735" y="16" width="130" height="42" rx="0" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
  <text x="800" y="33" class="hdr-title" fill="#0F172A" text-anchor="middle">Real-Time Actuator</text>
  <text x="800" y="47" class="hdr-sub" fill="#475569" text-anchor="middle">Motor Inverter / Plant</text>

  <!-- ==================== ACTIVATION BARS ==================== -->
  <!-- Policy: Active during autonomous proposals (y=68 to y=235) -->
  <rect x="359" y="68" width="12" height="167" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <!-- Policy: Muted / Shadow mode (y=235 to y=370) -->
  <rect x="359" y="235" width="12" height="135" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Arbiter: Continuous active enforcer loop -->
  <rect x="594" y="68" width="12" height="325" rx="2" fill="#DCFCE7" stroke="#059669" stroke-width="1"/>

  <!-- Supervisor: Active upon handover request (y=105 to y=370) -->
  <rect x="144" y="105" width="12" height="265" rx="2" fill="#E2E8F0" stroke="#475569" stroke-width="1"/>

  <!-- Actuator: Continuous plant control -->
  <rect x="794" y="68" width="12" height="325" rx="0" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>

  <!-- ==================== INITIAL AUTONOMOUS STEADY STATE ==================== -->
  <!-- Policy to Arbiter -->
  <line x1="371" y1="78" x2="588" y2="78" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="480" y="73" class="msg-text txt-halo" fill="#1E40AF" text-anchor="middle">Candidate chunk û_t:t+H (10–50 Hz)</text>

  <!-- Arbiter to Actuator -->
  <line x1="606" y1="88" x2="788" y2="88" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="697" y="83" class="msg-text txt-halo" fill="#047857" text-anchor="middle">Certified setpoint u*(t) (1 kHz, h(x) ≥ 0)</text>

  <!-- ==================== PHASE 1: NOTICE / REQUEST ==================== -->
  <g transform="translate(14, 108)">
    <line x1="0" y1="0" x2="852" y2="0" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <rect x="0" y="-8" width="85" height="16" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
    <text x="42" y="3.5" class="phase-tag" fill="#1E40AF" text-anchor="middle">1. Request</text>
  </g>

  <!-- Supervisor -> Arbiter: REQ_HANDOVER -->
  <line x1="156" y1="124" x2="588" y2="124" stroke="#1F407A" stroke-width="1.3" marker-end="url(#arr-navy)"/>
  <text x="250" y="119" class="msg-text txt-halo" fill="#1F407A" text-anchor="middle">REQ_HANDOVER (target_state, reason=OOD)</text>

  <!-- Arbiter Timeout Badge -->
  <rect x="615" y="116" width="165" height="17" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="0.8"/>
  <text x="697" y="128" class="code-token" font-weight="600" fill="#92400E" text-anchor="middle">Arm T_timeout = min(T_cfg, T_latest)</text>

  <!-- ==================== PHASE 2: DECLUTCH / ACK ==================== -->
  <g transform="translate(14, 150)">
    <line x1="0" y1="0" x2="852" y2="0" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <rect x="0" y="-8" width="98" height="16" rx="3" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.8"/>
    <text x="49" y="3.5" class="phase-tag" fill="#92400E" text-anchor="middle">2. Acknowledge</text>
  </g>

  <!-- Arbiter -> Policy: GET_STATE_SNAPSHOT -->
  <line x1="594" y1="166" x2="377" y2="166" stroke="#475569" stroke-width="1.1" marker-end="url(#arr-slate)"/>
  <text x="482" y="161" class="msg-text txt-halo" fill="#475569" text-anchor="middle">GET_STATE_SNAPSHOT()</text>

  <!-- Policy -> Arbiter: Snapshot Payload -->
  <line x1="371" y1="182" x2="588" y2="182" stroke="#475569" stroke-width="1.1" marker-end="url(#arr-slate)"/>
  <text x="482" y="177" class="msg-text txt-halo" fill="#475569" text-anchor="middle">State snapshot: latched u_auto(t₁), x(t₁)</text>

  <!-- Arbiter -> Supervisor: ACK_HANDOVER -->
  <line x1="594" y1="200" x2="162" y2="200" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="250" y="195" class="msg-text txt-halo" fill="#B45309" text-anchor="middle">ACK_HANDOVER (x(t₁), u_latched, ack_token)</text>

  <!-- ==================== PHASE 3: COMMIT & BLEND ==================== -->
  <g transform="translate(14, 222)">
    <line x1="0" y1="0" x2="852" y2="0" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <rect x="0" y="-8" width="112" height="16" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="56" y="3.5" class="phase-tag" fill="#166534" text-anchor="middle">3. Commit &amp; Blend</text>
  </g>

  <!-- Supervisor -> Arbiter: COMMIT_TRANSFER -->
  <line x1="156" y1="238" x2="588" y2="238" stroke="#1F407A" stroke-width="1.3" marker-end="url(#arr-navy)"/>
  <text x="250" y="233" class="msg-text txt-halo" fill="#1F407A" text-anchor="middle">COMMIT_TRANSFER (operator_auth_sig)</text>

  <!-- Arbiter -> Policy: REVOKE_WRITE_TOKEN -->
  <line x1="594" y1="254" x2="377" y2="254" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="482" y="249" class="msg-text txt-halo" fill="#DC2626" text-anchor="middle">REVOKE_WRITE_TOKEN() [Policy Muted]</text>

  <!-- Arbiter local blend computation -->
  <rect x="530" y="268" width="140" height="22" rx="3" fill="#F0FDF4" stroke="#059669" stroke-width="0.8"/>
  <text x="600" y="282" class="code-token" font-weight="600" fill="#047857" text-anchor="middle">C² Quintic Blend (τ_blend)</text>

  <!-- Arbiter -> Actuator: Blended profile -->
  <line x1="606" y1="304" x2="788" y2="304" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="697" y="299" class="msg-text txt-halo" fill="#047857" text-anchor="middle">Blended setpoints u(t) (1 kHz, zero jerk)</text>

  <!-- ==================== PHASE 4: ACTIVE LEASE ==================== -->
  <g transform="translate(14, 322)">
    <line x1="0" y1="0" x2="852" y2="0" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <rect x="0" y="-8" width="102" height="16" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="51" y="3.5" class="phase-tag" fill="#334155" text-anchor="middle">4. Active Lease</text>
  </g>

  <!-- Arbiter -> Supervisor: CONFIRM_TRANSFER -->
  <line x1="594" y1="338" x2="162" y2="338" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="250" y="333" class="msg-text txt-halo" fill="#047857" text-anchor="middle">CONFIRM_TRANSFER (T_lease,man = 150 ms)</text>

  <!-- Supervisor -> Arbiter: Manual Command -->
  <line x1="156" y1="354" x2="588" y2="354" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="250" y="349" class="msg-text txt-halo" fill="#1D4ED8" text-anchor="middle">Manual command u_man (teleop)</text>

  <!-- Arbiter -> Actuator: Gated Actuation -->
  <line x1="606" y1="358" x2="788" y2="358" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="697" y="352" class="msg-text txt-halo" fill="#047857" text-anchor="middle">Gated actuation u_man (1 kHz)</text>

  <!-- Supervisor -> Arbiter: Heartbeat -->
  <line x1="156" y1="372" x2="588" y2="372" stroke="#64748B" stroke-width="1.1" stroke-dasharray="2,2" marker-end="url(#arr-slate)"/>
  <text x="250" y="367" class="msg-text txt-halo" fill="#64748B" text-anchor="middle">HEARTBEAT (Δt = 20 ms &lt; T_lease,man)</text>

  <!-- ==================== TIMEOUT / FAIL-SAFE BOTTOM BRANCH ==================== -->
  <g transform="translate(14, 396)">
    <line x1="0" y1="0" x2="852" y2="0" stroke="#FEE2E2" stroke-width="0.8" stroke-dasharray="2,2"/>
    <rect x="0" y="-8" width="80" height="16" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="40" y="3.5" class="phase-tag" fill="#991B1B" text-anchor="middle">Fail-Safe</text>

    <!-- Fail-safe text -->
    <text x="95" y="4" font-size="8.5" fill="#7F1D1D">Lease expiry or handshake timeout (t &gt; T_timeout)</text>

    <!-- Direct emergency stop vector from Arbiter to Actuator -->
    <line x1="590" y1="0" x2="780" y2="0" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
    <text x="685" y="-4" class="msg-text txt-halo" fill="#DC2626" text-anchor="middle">FALLBACK_STOP (≤ 1 ms)</text>
  </g>
</svg>
