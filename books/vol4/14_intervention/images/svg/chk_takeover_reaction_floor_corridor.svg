<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0.5 L 6 3 L 0 5.5 z" fill="#64748b"/>
    </marker>
    <pattern id="hatch-red" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#fca5a5" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Outer Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Header -->
  <text x="18" y="23" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.2">SUPERVISORY TAKEOVER REACTION GAP &amp; SPATIAL STOPPING ENVELOPE</text>
  <text x="18" y="35" font-size="8" font-weight="400" fill="#64748b">Kinematic drift at v₀ = 22 m/s (80 km/h) vs 65 m forward obstacle detection horizon</text>

  <!-- Sensing Horizon / Obstacle Zone (d >= 65m at x = 348) -->
  <rect x="348" y="44" width="174" height="106" fill="url(#hatch-red)" rx="2" opacity="0.35"/>
  <line x1="348" y1="42" x2="348" y2="152" stroke="#c44" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="316" y="42" width="64" height="13" rx="6.5" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="348" y="51.5" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="middle">OBSTACLE (65 m)</text>

  <!-- ================= LANE 1: MODE 1 IN-THE-LOOP ================= -->
  <!-- Sub-card Lane 1 -->
  <rect x="18" y="58" width="504" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  
  <!-- Lane 1 Tag -->
  <text x="24" y="73" font-size="8.5" font-weight="700" fill="#14532d">Mode 1: Direct Teleop</text>
  <text x="24" y="84" font-size="7.5" font-weight="400" fill="#64748b">T_Σ = 0.30 s (In-loop reflex)</text>
  <text x="24" y="93" font-size="7" font-weight="500" fill="#3d9e5a">Nominal stopping envelope</text>

  <!-- Origin d=0 at x=120. Scale: 3.5 px/m -->
  <!-- Drift Bar: 6.6m -> 23.1 px (x=120 to 143) -->
  <rect x="120" y="66" width="23" height="16" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="131.5" y="77" font-size="6.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">6.6m</text>

  <!-- Braking Bar: 35.0m -> 122.5 px (x=143 to 265.5) -->
  <rect x="143" y="66" width="122.5" height="16" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="204" y="77" font-size="7.5" font-weight="600" fill="#14532d" text-anchor="middle">Braking: 35.0 m (a = -6.9 m/s²)</text>

  <!-- Safe Margin Remaining Pill: 23.4m (x=265.5 to 348 is 82.5px gap) -->
  <rect x="271" y="67" width="72" height="14" rx="7" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="307" y="77" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">CLEAR: +23.4 m</text>

  <!-- ================= LANE 2: MODE 2 SUPERVISORY ================= -->
  <!-- Sub-card Lane 2 -->
  <rect x="18" y="103" width="504" height="44" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

  <!-- Lane 2 Tag -->
  <text x="24" y="118" font-size="8.5" font-weight="700" fill="#7f1d1d">Mode 2: Supervisory</text>
  <text x="24" y="129" font-size="7.5" font-weight="400" fill="#64748b">T_Σ = 2.50 s (Gaze decay)</text>
  <text x="24" y="139" font-size="7" font-weight="600" fill="#c87b2a">Unbraked drift @ 22 m/s</text>

  <!-- Drift Bar: 55.0m -> 192.5 px (x=120 to 312.5) -->
  <!-- Sub-segment 1: Gaze & Cognitive Decay 48.4m (169.4px, x=120 to 289.4) -->
  <rect x="120" y="109" width="169" height="18" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
  <text x="204.5" y="121" font-size="7.5" font-weight="600" fill="#78350f" text-anchor="middle">Gaze &amp; Situational Decay: 48.4 m (2.2 s)</text>

  <!-- Sub-segment 2: Motor Twitch + CAN-FD 6.6m (23px, x=289 to 312) -->
  <rect x="289" y="109" width="23" height="18" rx="2" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75"/>
  <text x="300.5" y="121" font-size="6.5" font-weight="700" fill="#581c87" text-anchor="middle">6.6m</text>

  <!-- Braking Segment before Impact: x=312 to 348 (36px, 10.3m) -->
  <rect x="312" y="109" width="36" height="18" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="330" y="121" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="middle">Brake</text>

  <!-- Collision Zone Bar: x=348 to 435 (87px, 24.7m overrun) -->
  <rect x="348" y="109" width="87" height="18" rx="2" fill="#c44" stroke="#7f1d1d" stroke-width="0.75"/>
  <text x="391.5" y="121" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">IMPACT @ 17.5 m/s</text>

  <!-- Collision Deficit Callout Pill -->
  <rect x="441" y="111" width="75" height="14" rx="7" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="478.5" y="121" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="middle">DEFICIT: -25.0 m</text>

  <!-- ================= COMMON DISTANCE AXIS ================= -->
  <!-- Axis line at y = 158 -->
  <line x1="120" y1="158" x2="480" y2="158" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
  
  <!-- Ticks and labels -->
  <!-- 0m (x=120) -->
  <line x1="120" y1="155" x2="120" y2="161" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="169" font-size="7.5" font-weight="500" fill="#64748b" text-anchor="middle">0 m</text>

  <!-- 25m (x=207.5) -->
  <line x1="207.5" y1="155" x2="207.5" y2="161" stroke="#94a3b8" stroke-width="1"/>
  <text x="207.5" y="169" font-size="7.5" font-weight="500" fill="#64748b" text-anchor="middle">25 m</text>

  <!-- 50m (x=295) -->
  <line x1="295" y1="155" x2="295" y2="161" stroke="#94a3b8" stroke-width="1"/>
  <text x="295" y="169" font-size="7.5" font-weight="500" fill="#64748b" text-anchor="middle">50 m</text>

  <!-- 65m Obstacle (x=348) -->
  <line x1="348" y1="154" x2="348" y2="162" stroke="#c44" stroke-width="1.5"/>
  <text x="348" y="169" font-size="7.5" font-weight="700" fill="#c44" text-anchor="middle">65 m (Obstacle)</text>

  <!-- 90m Stop (x=435) -->
  <line x1="435" y1="155" x2="435" y2="161" stroke="#7f1d1d" stroke-width="1"/>
  <text x="435" y="169" font-size="7.5" font-weight="600" fill="#7f1d1d" text-anchor="middle">90 m (Stop)</text>

  <!-- Distance Axis Label -->
  <text x="486" y="160" font-size="7.5" font-weight="600" fill="#64748b">Distance</text>
</svg>
