<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5">
  <rect width="180" height="120" fill="#ffffff"/>
  <!-- scale: 80 px per m from x=8 -->
  <rect x="96" y="4" width="80" height="112" fill="#f2d7d5" opacity="0.34"/>
  <rect x="8" y="54" width="129.5" height="14" fill="#5e6b73" stroke="#ffffff" stroke-width="0.7"/>
  <rect x="8" y="92" width="24.6" height="14" fill="#5e6b73" stroke="#ffffff" stroke-width="0.7"/>
  <line x1="96" y1="4" x2="96" y2="116" stroke="#cb202d" stroke-width="1.4" stroke-dasharray="5.1,2.2"/>
  <g fill="#333333">
    <text x="8" y="50">1.3 m/s</text>
    <text x="8" y="88">0.15 m/s</text>
    <text x="37" y="103.5">0.31 m</text>
  </g>
  <text x="52" y="65.5" text-anchor="middle" fill="#ffffff">1.62 m</text>
  <g fill="#cb202d">
    <text x="100" y="17">1.10 m</text>
    <text x="100" y="31">clearance</text>
  </g>
</svg>
