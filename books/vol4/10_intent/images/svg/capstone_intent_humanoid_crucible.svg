<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <marker id="arr-red" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 Z" fill="#cc4444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 Z" fill="#3d9e5a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================== SUB-CARD 1: NAIVE ARM-ONLY INTENT ==================== -->
  <g transform="translate(14, 12)">
    <rect width="250" height="156" fill="#f8fafc" rx="3" stroke="#cbd5e1" stroke-width="0.75"/>

    <!-- Header & Badge -->
    <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b">
      NAIVE ARM-ONLY LEASE
    </text>
    <rect x="156" y="5" width="84" height="14" rx="7" fill="#f9d6d5" stroke="#cc4444" stroke-width="0.75"/>
    <text x="198" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#7f1d1d" text-anchor="middle">
      MARGIN FAILS
    </text>

    <text x="12" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#64748b">
      Isolated Cartesian grasp goal x*
    </text>

    <!-- Ground baseline: y = 118 -->
    <line x1="20" y1="118" x2="230" y2="118" stroke="#94a3b8" stroke-width="1"/>

    <!-- Foot Support Polygon S: from x = 60 to x = 110 (width 50) -->
    <rect x="60" y="115" width="50" height="4" rx="1" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>
    <text x="85" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#334155" text-anchor="middle">
      Support Base
    </text>

    <!-- Kinematic Links: Naive Posture -->
    <!-- Head & Neck -->
    <circle cx="84" cy="40" r="5.5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
    <line x1="84" y1="45.5" x2="84" y2="50" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Torso: Hip (76, 80) to Shoulder (84, 50) -->
    <line x1="76" y1="80" x2="84" y2="50" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Leg: Ankle (75, 115) to Knee (78, 98) to Hip (76, 80) -->
    <polyline points="75,115 78,98 76,80" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arm: Shoulder (84, 50) to Elbow (110, 64) to Hand (136, 78) -->
    <polyline points="84,50 110,64 136,78" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Target Payload: 8 kg battery -->
    <rect x="136" y="70" width="26" height="16" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
    <text x="149" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
      8 kg
    </text>

    <!-- Center of Mass (CoM) shifted forward to x = 122, y = 68 -->
    <circle cx="122" cy="68" r="5" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/>
    <circle cx="122" cy="68" r="2" fill="#c87b2a"/>
    <text x="122" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#78350f" text-anchor="middle">
      CoM
    </text>

    <!-- CoM Vertical Projection Line (Red Dashed) down to ground -->
    <line x1="122" y1="74" x2="122" y2="118" stroke="#cc4444" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    
    <!-- Red warning marker at projection landing: x = 122, y = 118 -->
    <circle cx="122" cy="118" r="2.5" fill="#cc4444"/>
    
    <!-- Schematic shift, without a physical length scale -->
    <line x1="85" y1="102" x2="120" y2="102" stroke="#cc4444" stroke-width="0.75" marker-end="url(#arr-red)"/>
    <text x="102" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#cc4444" text-anchor="middle">
      CoM shift
    </text>

    <!-- Forward Tipping Torque -->
    <path d="M 124 114 A 8 8 0 0 1 130 123" fill="none" stroke="#cc4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="138" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#7f1d1d">
      τ_tip &gt; 0
    </text>

    <!-- Bottom Status Callout Strip -->
    <rect x="8" y="134" width="234" height="16" rx="2" fill="#fee2e2" stroke="#f87171" stroke-width="0.5"/>
    <text x="125" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#7f1d1d" text-anchor="middle">
      ✗ Static support check fails; refuse proposal
    </text>
  </g>

  <!-- ==================== SUB-CARD 2: GROUNDED WHOLE-BODY INTENT ==================== -->
  <g transform="translate(276, 12)">
    <rect width="250" height="156" fill="#f8fafc" rx="3" stroke="#cbd5e1" stroke-width="0.75"/>

    <!-- Header & Badge -->
    <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b">
      WHOLE-BODY LEASE
    </text>
    <rect x="156" y="5" width="84" height="14" rx="7" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="198" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14532d" text-anchor="middle">
      CANDIDATE
    </text>

    <text x="12" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#64748b">
      Whole-body posture for checking
    </text>

    <!-- Ground baseline: y = 118 -->
    <line x1="20" y1="118" x2="230" y2="118" stroke="#94a3b8" stroke-width="1"/>

    <!-- Foot Support Polygon S: from x = 60 to x = 110 (width 50) -->
    <rect x="60" y="115" width="50" height="4" rx="1" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>
    <text x="85" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#334155" text-anchor="middle">
      Support Base
    </text>

    <!-- Kinematic Links: Balanced Posture with Pelvis shift backward -->
    <!-- Head & Neck -->
    <circle cx="78" cy="40" r="5.5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
    <line x1="78" y1="45.5" x2="80" y2="50" stroke="#475569" stroke-width="1.5"/>

    <!-- Pelvis counter-shifted backward to (54, 80) -->
    <!-- Leg: Ankle (75, 115) to Knee (66, 98) to Hip (54, 80) -->
    <polyline points="75,115 66,98 54,80" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Torso: Hip (54, 80) to Shoulder (80, 50) -->
    <line x1="54" y1="80" x2="80" y2="50" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arm: Shoulder (80, 50) to Elbow (108, 64) to Hand (136, 78) -->
    <polyline points="80,50 108,64 136,78" fill="none" stroke="#3d9e5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pelvis Shift Annotation -->
    <line x1="74" y1="80" x2="56" y2="80" stroke="#2563eb" stroke-width="1" marker-end="url(#arr-blue)"/>
    <text x="44" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#1e40af">
      pelvis shift
    </text>

    <!-- Target Payload: 8 kg battery (same absolute reach target) -->
    <rect x="136" y="70" width="26" height="16" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
    <text x="149" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
      8 kg
    </text>

    <!-- Center of Mass (CoM) stays at x = 84, y = 70 -->
    <circle cx="84" cy="70" r="5" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/>
    <circle cx="84" cy="70" r="2" fill="#3d9e5a"/>
    <text x="84" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14532d" text-anchor="middle">
      CoM
    </text>

    <!-- CoM Vertical Projection Line (Green Dashed) down to ground -->
    <line x1="84" y1="76" x2="84" y2="115" stroke="#3d9e5a" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="84" cy="115" r="2.5" fill="#3d9e5a"/>

    <!-- Ankle Pre-load Torque Indicator -->
    <path d="M 68 111 A 7 7 0 0 1 76 107" fill="none" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <text x="60" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6" font-weight="bold" fill="#14532d">
      τ_ankle
    </text>

    <!-- Safe CoM margin annotation on the right -->
    <text x="138" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#14532d">
      CoM inside base
    </text>
    <text x="138" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6" fill="#334155">
      Dynamic margin must be checked
    </text>

    <!-- Bottom Status Callout Strip -->
    <rect x="8" y="134" width="234" height="16" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.5"/>
    <text x="125" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14532d" text-anchor="middle">
      Static CoM check passes; validate dynamics
    </text>
  </g>
</svg>
