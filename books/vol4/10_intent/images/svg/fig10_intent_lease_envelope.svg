<?xml version="1.0" encoding="UTF-8"?>
<!-- Target uncertainty against grasp tolerance (a) and lease expiry, drive onset,
     and jerk-limited stop (b). Rebuilt 2026-09-29 at the 680 px house canvas.
     Panel (a) is drawn to scale at 3 px/mm from calc-intent-handle-ellipsoid;
     panel (b)'s time axis is schematic. Hand-drawn numbers (11.2, 33.5, 15 mm; 22 ms)
     are guarded by calc-intent-envelope-figure in 10_intent.qmd. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A51C30"/>
    </marker>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M5,0 L5,10" stroke="#4A5568" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="680" height="320" fill="#ffffff"/>

  <!-- ===== Panel (a): 95 percent region against the grasp tolerance (3 px/mm) ===== -->
  <text x="30" y="24" font-size="10" font-weight="700" fill="#1A202C">(a)</text>

  <!-- wrist camera and its ray -->
  <rect x="150" y="30" width="40" height="18" rx="0" fill="#E0F0F2" stroke="#007A87" stroke-width="1.2"/>
  <text x="200" y="43" font-size="8.5" fill="#4A5568">wrist camera</text>
  <line x1="170" y1="48" x2="170" y2="296" stroke="#A0AEC0" stroke-width="0.8" stroke-dasharray="2,3"/>

  <!-- grasp tolerance: +/-15 mm square -->
  <rect x="125" y="130" width="90" height="90" rx="0" fill="#E6EEEB" stroke="#1A4D3E" stroke-width="1.3" stroke-dasharray="5,3"/>
  <!-- 95 percent region: lateral 11 mm, depth 34 mm -->
  <ellipse cx="170" cy="175" rx="33.5" ry="100.6" fill="#007A87" fill-opacity="0.08" stroke="#007A87" stroke-width="1.5"/>
  <circle cx="170" cy="175" r="2.6" fill="#1A202C"/>
  <text x="178" y="172" font-size="8.5" fill="#1A202C">p<tspan baseline-shift="sub" font-size="75%">0</tspan></text>

  <!-- depth semi-axis dimension -->
  <line x1="250" y1="74.4" x2="250" y2="175" stroke="#007A87" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <line x1="204" y1="74.4" x2="254" y2="74.4" stroke="#007A87" stroke-width="0.6" stroke-dasharray="2,2"/>
  <line x1="174" y1="175" x2="254" y2="175" stroke="#007A87" stroke-width="0.6" stroke-dasharray="2,2"/>
  <text x="256" y="122" font-size="8.5" fill="#007A87">depth</text>
  <text x="256" y="134" font-size="8.5" font-weight="700" fill="#007A87">33.5 mm</text>

  <!-- tolerance dimension -->
  <line x1="100" y1="130" x2="100" y2="175" stroke="#1A4D3E" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <line x1="96" y1="130" x2="125" y2="130" stroke="#1A4D3E" stroke-width="0.6" stroke-dasharray="2,2"/>
  <text x="94" y="150" font-size="8.5" fill="#1A4D3E" text-anchor="end">tolerance</text>
  <text x="94" y="162" font-size="8.5" font-weight="700" fill="#1A4D3E" text-anchor="end">15 mm</text>

  <!-- lateral semi-axis dimension -->
  <line x1="170" y1="290" x2="203.5" y2="290" stroke="#007A87" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <line x1="203.5" y1="175" x2="203.5" y2="294" stroke="#007A87" stroke-width="0.6" stroke-dasharray="2,2"/>
  <text x="210" y="293" font-size="8.5" fill="#007A87">lateral <tspan font-weight="700">11.2 mm</tspan></text>

  <text x="30" y="250" font-size="8.5" fill="#007A87">95 % region</text>
  <line x1="80" y1="246" x2="147" y2="246" stroke="#007A87" stroke-width="0.6"/>

  <!-- ===== Panel (b): lease expiry, drive onset, jerk-limited stop (schematic time) ===== -->
  <text x="350" y="24" font-size="10" font-weight="700" fill="#1A202C">(b)</text>

  <!-- stopping area under v(t) -->
  <path d="M 490 262 L 490 120 L 512 120 C 552 120 572 262 612 262 Z" fill="#A51C30" fill-opacity="0.10" stroke="none"/>
  <!-- drive-onset band -->
  <rect x="490" y="60" width="22" height="202" fill="#D97706" fill-opacity="0.14" stroke="none"/>

  <!-- axes -->
  <line x1="380" y1="262" x2="655" y2="262" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="380" y1="262" x2="380" y2="52" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="385" y="50" font-size="8.5" fill="#4A5568">speed v(t)</text>
  <text x="650" y="278" font-size="8.5" fill="#4A5568" text-anchor="end">time</text>
  <text x="374" y="123" font-size="8.5" fill="#4A5568" text-anchor="end">v<tspan baseline-shift="sub" font-size="75%">max</tspan></text>

  <!-- no-lease trace -->
  <line x1="512" y1="120" x2="640" y2="120" stroke="#A51C30" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="640" y="112" font-size="8.5" fill="#A51C30" text-anchor="end">no lease: no stop</text>

  <!-- leased trace: renewals, expiry, onset, jerk-limited stop -->
  <path d="M 380 120 L 512 120 C 552 120 572 262 612 262" fill="none" stroke="#1A4D3E" stroke-width="2"/>
  <circle cx="410" cy="120" r="3.2" fill="#1A4D3E"/>
  <circle cx="440" cy="120" r="3.2" fill="#1A4D3E"/>
  <circle cx="470" cy="120" r="3.2" fill="#1A4D3E"/>
  <text x="440" y="110" font-size="8.5" fill="#1A4D3E" text-anchor="middle">renewals</text>
  <line x1="490" y1="70" x2="490" y2="262" stroke="#A51C30" stroke-width="1.2"/>
  <text x="486" y="78" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="end">lease expiry</text>
  <text x="516" y="78" font-size="8.5" fill="#B45309">drive onset 22 ms</text>
  <circle cx="612" cy="262" r="3.2" fill="#1A4D3E"/>
  <text x="548" y="238" font-size="8.5" fill="#A51C30" text-anchor="middle">d<tspan baseline-shift="sub" font-size="75%">stop</tspan> = ∫ v dt</text>
  <text x="548" y="251" font-size="8.5" fill="#A51C30" text-anchor="middle">≤ clearance left</text>

  <!-- phase brackets under the axis -->
  <path d="M 381 284 L 381 290 L 489 290 L 489 284" fill="none" stroke="#4A5568" stroke-width="0.8"/>
  <text x="435" y="302" font-size="8.5" fill="#4A5568" text-anchor="middle">admitted lease</text>
  <path d="M 513 284 L 513 290 L 612 290 L 612 284" fill="none" stroke="#4A5568" stroke-width="0.8"/>
  <text x="562" y="302" font-size="8.5" fill="#4A5568" text-anchor="middle">jerk-limited stop</text>
</svg>
