<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-49.0" y="-21.5" width="1078.0" height="473.0" fill="#ffffff"/>
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Hatch pattern for physical collision barrier -->
    <pattern id="barrier-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#FCA5A5" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="980" height="430" fill="#FFFFFF"/>

  <!-- Sub-Figure Headers -->
  <text x="230" y="36" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(a) Target Uncertainty Ellipsoid</text>
  <text x="730" y="36" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(b) Authority Expiry and Braking</text>

  <!-- Divider between panels -->
  <line x1="470" y1="25" x2="470" y2="405" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): 3D SPATIAL TOLERANCE MANIFOLD                             -->
  <!-- ==================================================================== -->
  <g id="panel-a">
    <!-- Robot Base Frame F_base -->
    <g transform="translate(60, 95)">
      <line x1="0" y1="20" x2="42" y2="20" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dark)"/>
      <line x1="0" y1="20" x2="0" y2="-22" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dark)"/>
      <line x1="0" y1="20" x2="-20" y2="38" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dark)"/>
      <text x="47" y="24" font-size="9" font-weight="600" fill="#475569">X<tspan baseline-shift="sub" font-size="78%">b</tspan></text>
      <text x="-4" y="-27" font-size="9" font-weight="600" fill="#475569">Z<tspan baseline-shift="sub" font-size="78%">b</tspan></text>
      <text x="-32" y="48" font-size="9" font-weight="600" fill="#475569">Y<tspan baseline-shift="sub" font-size="78%">b</tspan></text>
      <text x="-28" y="14" font-size="9.5" font-weight="600" fill="#64748B">F<tspan baseline-shift="sub" font-size="78%">base</tspan></text>
    </g>

    <!-- Nominal Standoff Vector p_0 -->
    <path d="M 60 115 Q 160 145 265 210" fill="none" stroke="#64748B" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr-dark)"/>
    <text x="165" y="145" font-size="11" font-weight="700" fill="#334155">p₀</text>

    <!-- Ground plane shadow / projection stalk -->
    <g transform="translate(275, 215)">
      <!-- Projection stalk down -->
      <line x1="0" y1="0" x2="0" y2="155" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>
      <ellipse cx="0" cy="155" rx="35" ry="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="0" cy="155" r="2.5" fill="#94A3B8"/>

      <!-- Tolerance Ellipsoid rotated to approach angle (25 deg) -->
      <g transform="rotate(25)">
        <!-- Outer Ellipsoid Body -->
        <ellipse cx="0" cy="0" rx="52" ry="98" fill="#EFF6FF" fill-opacity="0.55" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,3"/>
        <ellipse cx="0" cy="0" rx="52" ry="22" fill="none" stroke="#93C5FD" stroke-width="1.2"/>

        <!-- Longitudinal Depth Axis a_z -->
        <line x1="0" y1="0" x2="0" y2="-98" stroke="#1D4ED8" stroke-width="1.4" marker-end="url(#arr-blue)"/>
        <text x="8" y="-50" font-size="9" font-weight="700" fill="#1D4ED8">a<tspan baseline-shift="sub" font-size="78%">z</tspan> (Depth)</text>

        <!-- Lateral Axis a_x -->
        <line x1="0" y1="0" x2="52" y2="0" stroke="#1D4ED8" stroke-width="1.4" marker-end="url(#arr-blue)"/>
        <text x="22" y="16" font-size="9" font-weight="700" fill="#1D4ED8">a<tspan baseline-shift="sub" font-size="78%">x</tspan></text>

        <!-- Gripper capture envelope (Cylinder) -->
        <rect x="-22" y="-40" width="44" height="80" rx="3" fill="#FFFBEB" fill-opacity="0.6" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3,2"/>
        <text x="0" y="52" font-size="8.5" font-weight="600" fill="#B45309" text-anchor="middle">r<tspan baseline-shift="sub" font-size="78%">grip</tspan></text>
      </g>

      <!-- Center Target Point p_0 -->
      <circle cx="0" cy="0" r="3.5" fill="#1E293B"/>
    </g>

    <!-- Mathematical Invariant Callout -->
    <rect x="40" y="345" width="185" height="42" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="132" y="362" font-size="9.5" font-family="'Menlo', 'Courier New', monospace" font-weight="700" fill="#1E40AF" text-anchor="middle">(p − p₀)ᵀ Σ⁻¹ (p − p₀) ≤ χ²</text>
    <text x="132" y="377" font-size="8.5" font-weight="500" fill="#64748B" text-anchor="middle">v ≤ v<tspan baseline-shift="sub" font-size="78%">max</tspan> · F ≤ F<tspan baseline-shift="sub" font-size="78%">max</tspan></text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): CARTESIAN VELOCITY-TIME DECAY PROFILE                     -->
  <!-- ==================================================================== -->
  <g id="panel-b" transform="translate(515, 0)">
    <!-- Axes -->
    <!-- X-axis: Time -->
    <line x1="30" y1="310" x2="425" y2="310" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>
    <text x="430" y="314" font-size="10" font-weight="700" fill="#334155">Time t</text>

    <!-- Y-axis: Velocity -->
    <line x1="45" y1="325" x2="45" y2="70" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>
    <text x="45" y="58" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Velocity v(t)</text>

    <text x="36" y="324" font-size="9" font-weight="600" fill="#64748B" text-anchor="end">0</text>
    <text x="36" y="144" font-size="9" font-weight="600" fill="#64748B" text-anchor="end">v<tspan baseline-shift="sub" font-size="78%">max</tspan></text>

    <!-- Dashed gridline at v_max -->
    <line x1="45" y1="140" x2="390" y2="140" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Shaded Stopping Area (Deceleration distance d_stop) -->
    <polygon points="180,140 270,310 180,310" fill="#DBEAFE" fill-opacity="0.5"/>
    <text x="200" y="270" font-size="9" font-weight="600" fill="#1D4ED8">d<tspan baseline-shift="sub" font-size="78%">stop</tspan> = ∫ v dt</text>

    <!-- Lease Expiry Marker -->
    <line x1="180" y1="80" x2="180" y2="310" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,3"/>
    <rect x="135" y="78" width="90" height="22" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="180" y="93" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">Authority Expires</text>

    <!-- Curve 1: Nominal Continuous Renewals (Green line extending right) -->
    <line x1="180" y1="140" x2="360" y2="140" stroke="#059669" stroke-width="2"/>
    <circle cx="90" cy="140" r="3" fill="#059669"/>
    <circle cx="135" cy="140" r="3" fill="#059669"/>
    <circle cx="180" cy="140" r="3" fill="#059669"/>
    <circle cx="240" cy="140" r="3" fill="#059669"/>
    <circle cx="300" cy="140" r="3" fill="#059669"/>
    <text x="255" y="125" font-size="9" font-weight="700" fill="#059669">Fresh renewals (alternative)</text>

    <!-- Curve 2: Watchdog Timeout & Autonomous Deceleration (Blue) -->
    <line x1="45" y1="140" x2="180" y2="140" stroke="#2563EB" stroke-width="2.2"/>
    <line x1="180" y1="140" x2="270" y2="310" stroke="#2563EB" stroke-width="2.2"/>
    <circle cx="180" cy="140" r="4" fill="#2563EB"/>
    <circle cx="270" cy="310" r="4" fill="#2563EB"/>

    <!-- Rest Point Label -->
    <text x="270" y="328" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">Rest if feasible</text>

    <!-- Curve 3: Unbounded Goal Runaway (Red dashed) -->
    <line x1="180" y1="140" x2="385" y2="140" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="240" y="156" font-size="8.5" font-weight="600" fill="#DC2626">Unbounded Runaway (No Lease)</text>

    <!-- Physical Collision Barrier at x=385 -->
    <rect x="385" y="105" width="14" height="205" fill="url(#barrier-hatch)" stroke="#DC2626" stroke-width="1.2"/>
    <text x="392" y="97" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">Obstacle</text>

    <!-- Time Brackets below X-axis -->
    <!-- Lease Horizon tau -->
    <line x1="45" y1="355" x2="180" y2="355" stroke="#64748B" stroke-width="1.2"/>
    <line x1="45" y1="350" x2="45" y2="360" stroke="#64748B" stroke-width="1.2"/>
    <line x1="180" y1="350" x2="180" y2="360" stroke="#64748B" stroke-width="1.2"/>
    <text x="112" y="370" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Admitted authority</text>

    <!-- Deceleration Time t_decel -->
    <line x1="180" y1="355" x2="270" y2="355" stroke="#64748B" stroke-width="1.2"/>
    <line x1="270" y1="350" x2="270" y2="360" stroke="#64748B" stroke-width="1.2"/>
    <text x="225" y="370" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">t<tspan baseline-shift="sub" font-size="78%">decel</tspan></text>
  </g>
</svg>
