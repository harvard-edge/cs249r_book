<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-49.0" y="-21.5" width="1078.0" height="473.0" fill="#ffffff"/>
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="980" height="430" fill="#FFFFFF"/>

  <!-- Sub-Figure Headers -->
  <text x="252" y="34" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(a) Target-Evidence Horizon</text>
  <text x="737" y="34" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(b) Early Rejection Filter</text>

  <!-- Divider between panels -->
  <line x1="480" y1="20" x2="480" y2="410" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): PHYSICAL LEASE DURATION BOUND                             -->
  <!-- ==================================================================== -->
  <g id="panel-a">
    <!-- Shaded Regions -->
    <path d="M 87.5,70.0 L 440,70 L 440,314.4 L 440.0,314.4 L 434.0,314.1 L 428.1,313.9 L 422.1,313.6 L 416.1,313.3 L 410.1,313.0 L 404.2,312.8 L 398.2,312.4 L 392.2,312.1 L 386.2,311.8 L 380.3,311.4 L 374.3,311.1 L 368.3,310.7 L 362.3,310.3 L 356.4,309.9 L 350.4,309.5 L 344.4,309.1 L 338.4,308.6 L 332.5,308.1 L 326.5,307.6 L 320.5,307.1 L 314.5,306.6 L 308.6,306.0 L 302.6,305.4 L 296.6,304.7 L 290.6,304.1 L 284.7,303.4 L 278.7,302.6 L 272.7,301.8 L 266.7,301.0 L 260.8,300.1 L 254.8,299.2 L 248.8,298.2 L 242.8,297.1 L 236.9,296.0 L 230.9,294.7 L 224.9,293.4 L 218.9,292.0 L 213.0,290.5 L 207.0,288.8 L 201.0,287.0 L 195.0,285.0 L 189.1,282.8 L 183.1,280.5 L 177.1,277.8 L 171.1,274.9 L 165.2,271.6 L 159.2,267.9 L 153.2,263.7 L 147.2,258.9 L 141.3,253.3 L 135.3,246.8 L 129.3,239.1 L 123.3,229.7 L 117.4,218.3 L 111.4,203.9 L 105.4,185.3 L 99.4,160.2 L 93.5,124.6 L 87.5,70.0 Z" fill="#FEF2F2" fill-opacity="0.8"/>
    <path d="M 65,330 L 65,70 L 87.5,70.0 L 93.5,124.6 L 99.4,160.2 L 105.4,185.3 L 111.4,203.9 L 117.4,218.3 L 123.3,229.7 L 129.3,239.1 L 135.3,246.8 L 141.3,253.3 L 147.2,258.9 L 153.2,263.7 L 159.2,267.9 L 165.2,271.6 L 171.1,274.9 L 177.1,277.8 L 183.1,280.5 L 189.1,282.8 L 195.0,285.0 L 201.0,287.0 L 207.0,288.8 L 213.0,290.5 L 218.9,292.0 L 224.9,293.4 L 230.9,294.7 L 236.9,296.0 L 242.8,297.1 L 248.8,298.2 L 254.8,299.2 L 260.8,300.1 L 266.7,301.0 L 272.7,301.8 L 278.7,302.6 L 284.7,303.4 L 290.6,304.1 L 296.6,304.7 L 302.6,305.4 L 308.6,306.0 L 314.5,306.6 L 320.5,307.1 L 326.5,307.6 L 332.5,308.1 L 338.4,308.6 L 344.4,309.1 L 350.4,309.5 L 356.4,309.9 L 362.3,310.3 L 368.3,310.7 L 374.3,311.1 L 380.3,311.4 L 386.2,311.8 L 392.2,312.1 L 398.2,312.4 L 404.2,312.8 L 410.1,313.0 L 416.1,313.3 L 422.1,313.6 L 428.1,313.9 L 434.0,314.1 L 440.0,314.4 L 440,330 Z" fill="#F0FDF4" fill-opacity="0.85"/>

    <!-- Grid Lines (Subtle) -->
    <line x1="65" y1="200" x2="440" y2="200" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="65" y1="70" x2="440" y2="70" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="215" y1="70" x2="215" y2="330" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="365" y1="70" x2="365" y2="330" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Region Labels -->
    <text x="340" y="90" font-size="11" font-weight="700" fill="#B91C1C">Target Error Exceeds Tolerance</text>
    <text x="135" y="318" font-size="11" font-weight="700" fill="#15803D">Target Evidence Valid</text>

    <!-- P99 Inference Latency Line -->
    <line x1="65" y1="118.8" x2="440" y2="118.8" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="4,3"/>
    <text x="435" y="112.8" font-size="9" font-weight="600" fill="#DC2626" text-anchor="end">Illustrative 650 ms model tail</text>

    <!-- Safe Horizon Hyperbolic Curve (r_tol = 15 mm) -->
    <path d="M 87.5,70.0 L 93.5,124.6 L 99.4,160.2 L 105.4,185.3 L 111.4,203.9 L 117.4,218.3 L 123.3,229.7 L 129.3,239.1 L 135.3,246.8 L 141.3,253.3 L 147.2,258.9 L 153.2,263.7 L 159.2,267.9 L 165.2,271.6 L 171.1,274.9 L 177.1,277.8 L 183.1,280.5 L 189.1,282.8 L 195.0,285.0 L 201.0,287.0 L 207.0,288.8 L 213.0,290.5 L 218.9,292.0 L 224.9,293.4 L 230.9,294.7 L 236.9,296.0 L 242.8,297.1 L 248.8,298.2 L 254.8,299.2 L 260.8,300.1 L 266.7,301.0 L 272.7,301.8 L 278.7,302.6 L 284.7,303.4 L 290.6,304.1 L 296.6,304.7 L 302.6,305.4 L 308.6,306.0 L 314.5,306.6 L 320.5,307.1 L 326.5,307.6 L 332.5,308.1 L 338.4,308.6 L 344.4,309.1 L 350.4,309.5 L 356.4,309.9 L 362.3,310.3 L 368.3,310.7 L 374.3,311.1 L 380.3,311.4 L 386.2,311.8 L 392.2,312.1 L 398.2,312.4 L 404.2,312.8 L 410.1,313.0 L 416.1,313.3 L 422.1,313.6 L 428.1,313.9 L 434.0,314.1 L 440.0,314.4" fill="none" stroke="#2563EB" stroke-width="2.2"/>
    <text x="210" y="270" font-size="9.5" font-weight="700" fill="#1D4ED8">r<tspan baseline-shift="sub" font-size="78%">tol</tspan> = 15 mm</text>

    <!-- Operating Points -->
    <!-- Settling Point (20 mm/s, 600 ms) -->
    <circle cx="95.0" cy="135.0" r="3.5" fill="#059669"/>
    <line x1="95.0" y1="135.0" x2="95.0" y2="330" stroke="#059669" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="103.0" y="149.0" font-size="8.5" font-weight="600" fill="#059669">Settling</text>

    <!-- Conveyor Point (200 mm/s, 60 ms) -->
    <circle cx="365.0" cy="310.5" r="3.5" fill="#2563EB"/>
    <line x1="365.0" y1="310.5" x2="365.0" y2="330" stroke="#2563EB" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="357.0" y="302.5" font-size="8.5" font-weight="600" fill="#1D4ED8" text-anchor="end">Conveyor</text>

    <!-- Axes -->
    <line x1="65" y1="330" x2="448" y2="330" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>
    <line x1="65" y1="330" x2="65" y2="60" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>

    <!-- Axis Titles -->
    <text x="252" y="365" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Drift Velocity v<tspan baseline-shift="sub" font-size="78%">drift</tspan> (mm/s)</text>
    <text x="-200" y="22" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90)">Evidence Age τ (ms)</text>

    <!-- X Ticks -->
    <text x="65" y="344" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">0</text>
    <text x="215" y="344" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">100</text>
    <text x="365" y="344" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">200</text>

    <!-- Y Ticks -->
    <text x="58" y="333" font-size="9" font-weight="500" fill="#64748B" text-anchor="end">0</text>
    <text x="58" y="203" font-size="9" font-weight="500" fill="#64748B" text-anchor="end">400</text>
    <text x="58" y="73" font-size="9" font-weight="500" fill="#64748B" text-anchor="end">800</text>

    <!-- Mathematical Formula Callout -->
    <rect x="157" y="382" width="190" height="26" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="252" y="399" font-size="9.5" font-family="'Menlo', 'Courier New', monospace" font-weight="700" fill="#1E40AF" text-anchor="middle">τ_evidence ≤ (r_tol − e₀) / v_drift</text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): INGESTION FILTER PIPELINE                                 -->
  <!-- ==================================================================== -->
  <g id="panel-b">
    <!-- Intent Proposal Capsule -->
    <rect x="525" y="56" width="205" height="30" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="627" y="75" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Intent Proposal</text>

    <!-- Down arrow to Stage 1 -->
    <line x1="627" y1="86" x2="627" y2="104" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>

    <!-- Stage 1 -->
    <rect x="525" y="104" width="205" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="627" y="125" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">1. Sequence &amp; Evidence</text>
    <line x1="627" y1="138" x2="627" y2="156" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>

    <!-- Stage 2 -->
    <rect x="525" y="156" width="205" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="627" y="177" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">2. Workspace Prefilter</text>
    <line x1="627" y1="190" x2="627" y2="208" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>

    <!-- Stage 3 -->
    <rect x="525" y="208" width="205" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="627" y="229" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">3. Transit Lower Bound</text>
    <line x1="627" y1="242" x2="627" y2="260" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>

    <!-- Stage 4 -->
    <rect x="525" y="260" width="205" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="627" y="281" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">4. Ambiguity Gate</text>

    <!-- Rejection Bus (Red) -->
    <line x1="730" y1="121" x2="760" y2="121" stroke="#DC2626" stroke-width="1.2"/>
    <line x1="730" y1="173" x2="760" y2="173" stroke="#DC2626" stroke-width="1.2"/>
    <line x1="730" y1="225" x2="760" y2="225" stroke="#DC2626" stroke-width="1.2"/>
    <line x1="730" y1="277" x2="760" y2="277" stroke="#DC2626" stroke-width="1.2"/>
    <line x1="760" y1="121" x2="760" y2="277" stroke="#DC2626" stroke-width="1.2"/>
    <line x1="760" y1="199" x2="790" y2="199" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
    <text x="775" y="193" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">Fail</text>

    <!-- Early Rejection Box -->
    <rect x="790" y="175" width="160" height="48" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.4"/>
    <text x="870" y="196" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">Early Rejection</text>
    <text x="870" y="213" font-size="9.5" font-weight="600" fill="#DC2626" text-anchor="middle">Measured per design</text>

    <!-- Pass Arrow down to Planner -->
    <line x1="627" y1="294" x2="627" y2="330" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <text x="637" y="316" font-size="9" font-weight="700" fill="#059669">Pass</text>

    <!-- Trajectory Planner Box -->
    <rect x="525" y="330" width="205" height="50" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.4"/>
    <text x="627" y="352" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Trajectory Planner</text>
    <text x="627" y="369" font-size="9.5" font-weight="600" fill="#059669" text-anchor="middle">Then path + stop checks</text>
  </g>
</svg>
