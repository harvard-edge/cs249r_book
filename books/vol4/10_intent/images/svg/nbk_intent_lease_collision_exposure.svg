<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="breach-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fee2e2"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="2" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="720" height="240" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="15" y="14" width="690" height="101" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="15" y="125" width="690" height="101" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="28" y="37" font-size="14" font-weight="700" fill="#0f172a">Total pre-brake delay: 60 ms</text>
  <text x="28" y="54" font-size="10" fill="#475569">Evidence horizon is separately 60 ms; lease must reserve post-expiry response.</text>
  <rect x="560" y="25" width="132" height="27" rx="13" fill="#dcfce7" stroke="#3d9e5a"/>
  <text x="626" y="43" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">35 mm remains</text>
  <rect x="40" y="68" width="68" height="20" fill="#cfe2f3" stroke="#4a90c4"/>
  <rect x="108" y="68" width="281" height="20" fill="#d4edda" stroke="#3d9e5a"/>
  <rect x="389" y="68" width="26" height="20" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3 2"/>
  <text x="74" y="82" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">90 mm</text>
  <text x="248" y="82" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">375 mm braking</text>
  <line x1="389" y1="64" x2="389" y2="99" stroke="#15803d" stroke-width="1.5"/>
  <line x1="415" y1="64" x2="415" y2="99" stroke="#991b1b" stroke-width="1.5"/>
  <text x="384" y="105" font-size="9" fill="#166534" text-anchor="end">stop 465 mm</text>
  <text x="421" y="105" font-size="9" fill="#991b1b">boundary 500 mm</text>
  <text x="560" y="76" font-size="10" fill="#334155">1.5 m/s; 3.0 m/s² braking</text>
  <text x="560" y="92" font-size="10" fill="#334155">Clearance before other margins</text>

  <text x="28" y="148" font-size="14" font-weight="700" fill="#0f172a">Total pre-brake delay: 200 ms</text>
  <text x="28" y="165" font-size="10" fill="#475569">The slower response starts braking after 300 mm of travel.</text>
  <rect x="560" y="136" width="132" height="27" rx="13" fill="#fee2e2" stroke="#dc2626"/>
  <text x="626" y="154" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">175 mm breach</text>
  <rect x="40" y="178" width="225" height="20" fill="#fdebd0" stroke="#c87b2a"/>
  <rect x="265" y="178" width="150" height="20" fill="#d4edda" stroke="#3d9e5a"/>
  <rect x="415" y="178" width="131" height="20" fill="url(#breach-hatch)" stroke="#dc2626"/>
  <text x="152" y="192" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">300 mm before braking</text>
  <text x="340" y="192" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">braking</text>
  <text x="480" y="192" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">beyond boundary</text>
  <line x1="415" y1="174" x2="415" y2="211" stroke="#991b1b" stroke-width="1.5"/>
  <line x1="546" y1="174" x2="546" y2="211" stroke="#991b1b" stroke-width="1.5"/>
  <text x="409" y="216" font-size="9" fill="#991b1b" text-anchor="end">boundary 500 mm</text>
  <text x="550" y="216" font-size="9" fill="#991b1b">stop 675 mm</text>
  <text x="560" y="186" font-size="10" fill="#334155">Stops differ by 210 mm.</text>
  <text x="560" y="201" font-size="10" fill="#334155">That is not separation margin.</text>
</svg>
