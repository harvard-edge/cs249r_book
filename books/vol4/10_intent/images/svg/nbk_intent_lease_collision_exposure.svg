<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <pattern id="hatch-red" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#cc4444" stroke-width="1.2" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================== SUB-CARD 1: BOUNDED INTENT LEASE ==================== -->
  <g transform="translate(14, 12)">
    <!-- Sub-card background -->
    <rect width="512" height="72" fill="#f8fafc" rx="3" stroke="#cbd5e1" stroke-width="0.75"/>
    
    <!-- Header & Meta -->
    <text x="12" y="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b">
      BOUNDED INTENT LEASE (τ = 60 ms)
    </text>
    <text x="198" y="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#64748b">
      AMR: v = 1.5 m/s, a_max = 3.0 m/s²
    </text>
    
    <!-- Pill Badge -->
    <rect x="388" y="5" width="112" height="15" rx="7.5" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="444" y="15.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#14532d" text-anchor="middle">
      SAFE ARREST: 465 mm
    </text>

    <!-- Scale: origin x=20. Factor: 0.40 px/mm
         0 mm: 20
         90 mm: 20 + 36 = 56 (width 36)
         465 mm: 20 + 186 = 206 (width 150)
         Corridor buffer: 206 to 290 (width 84 = 210 mm)
    -->
    <!-- Segment 1: Reaction Run 90 mm -->
    <rect x="20" y="24" width="36" height="20" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75" rx="2"/>
    <text x="38" y="37" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
      90 mm
    </text>

    <!-- Segment 2: Controlled Braking 375 mm -->
    <rect x="56" y="24" width="150" height="20" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75" rx="2"/>
    <text x="131" y="37" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#14532d" text-anchor="middle">
      Braking: 375 mm (-3.0 m/s²)
    </text>

    <!-- Separation Buffer (Remaining clearance) -->
    <rect x="206" y="24" width="84" height="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,2"/>
    <text x="248" y="33" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#64748b" text-anchor="middle">
      Separation Buffer
    </text>
    <text x="248" y="41" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" fill="#94a3b8" text-anchor="middle">
      (+210 mm margin)
    </text>

    <!-- Boundary Line at 465 mm -->
    <line x1="206" y1="21" x2="206" y2="47" stroke="#3d9e5a" stroke-width="1.5"/>

    <!-- Right Side Outcome Text -->
    <g transform="translate(306, 26)">
      <text x="0" y="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#14532d">
        ✓ Arrested Before Separation Limit
      </text>
      <text x="0" y="19" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#334155">
        Watchdog timer trips SS1 stop at τ = 60 ms
      </text>
    </g>

    <!-- Bottom Ticks & Annotations -->
    <!-- Tick 0 mm -->
    <line x1="20" y1="44" x2="20" y2="49" stroke="#94a3b8" stroke-width="0.75"/>
    <text x="20" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">0 mm</text>

    <!-- Tick 90 mm (Expiry) -->
    <line x1="56" y1="44" x2="56" y2="49" stroke="#4a90c4" stroke-width="0.75"/>
    <text x="56" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e3a8a" text-anchor="middle">τ expiry</text>

    <!-- Tick 465 mm (Stop) -->
    <line x1="206" y1="44" x2="206" y2="49" stroke="#3d9e5a" stroke-width="1"/>
    <text x="206" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#14532d" text-anchor="middle">465 mm stop</text>

    <!-- Tick Corridor Limit at 675 mm -->
    <line x1="290" y1="44" x2="290" y2="49" stroke="#94a3b8" stroke-width="0.75"/>
    <text x="290" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">675 mm max</text>
  </g>

  <!-- ==================== SUB-CARD 2: UNBOUNDED COMPUTE STALL ==================== -->
  <g transform="translate(14, 92)">
    <!-- Sub-card background -->
    <rect width="512" height="76" fill="#f8fafc" rx="3" stroke="#cbd5e1" stroke-width="0.75"/>

    <!-- Header & Meta -->
    <text x="12" y="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b">
      UNBOUNDED GOAL (200 ms Host Compute Stall)
    </text>
    <text x="246" y="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#64748b">
      t_exp = ∞ (No active watchdog timer)
    </text>

    <!-- Pill Badge -->
    <rect x="388" y="5" width="112" height="15" rx="7.5" fill="#f9d6d5" stroke="#cc4444" stroke-width="0.75"/>
    <text x="444" y="15.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">
      OVERRUN: +210 mm
    </text>

    <!-- Scale: origin x=20. Factor: 0.40 px/mm
         0 mm: 20
         300 mm: 20 + 120 = 140 (width 120)
         465 mm: 20 + 186 = 206 (envelope limit)
         Braking segment before 465 mm: 140 to 206 (width 66 = 165 mm)
         Overrun segment after 465 mm: 206 to 290 (width 84 = 210 mm)
         Total stop at 675 mm: x = 290
    -->
    <!-- Segment 1: Unmonitored Coast 300 mm -->
    <rect x="20" y="24" width="120" height="20" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75" rx="2"/>
    <text x="80" y="33" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#78350f" text-anchor="middle">
      Blind Coasting: 300 mm
    </text>
    <text x="80" y="41" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" fill="#78350f" text-anchor="middle">
      (200 ms inference stall @ 1.5 m/s)
    </text>

    <!-- Segment 2a: Braking before envelope bound (66 px) -->
    <rect x="140" y="24" width="66" height="20" fill="#fee2e2" stroke="#f87171" stroke-width="0.75"/>
    <text x="173" y="37" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#7f1d1d" text-anchor="middle">
      Braking (165 mm)
    </text>

    <!-- Envelope Boundary Line at 465 mm -->
    <line x1="206" y1="20" x2="206" y2="48" stroke="#cc4444" stroke-width="1.5" stroke-dasharray="2.5,2"/>

    <!-- Segment 2b: Overrun Hazard Zone (84 px = 210 mm) -->
    <rect x="206" y="24" width="84" height="20" fill="url(#hatch-red)" stroke="#cc4444" stroke-width="1"/>
    <rect x="206" y="24" width="84" height="20" fill="#f9d6d5" opacity="0.4"/>
    <text x="248" y="37" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">
      +210 mm Overrun
    </text>

    <!-- Final Stop Marker -->
    <line x1="290" y1="21" x2="290" y2="47" stroke="#cc4444" stroke-width="1.5"/>

    <!-- Right Side Outcome Text -->
    <g transform="translate(306, 25)">
      <text x="0" y="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#7f1d1d">
        ✗ Corridor Clearance Breach
      </text>
      <text x="0" y="19" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#334155">
        675 mm stop violates pedestrian separation
      </text>
    </g>

    <!-- Bottom Ticks & Annotations -->
    <!-- Tick 0 mm -->
    <line x1="20" y1="44" x2="20" y2="49" stroke="#94a3b8" stroke-width="0.75"/>
    <text x="20" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">0 mm</text>

    <!-- Tick 300 mm (Timeout) -->
    <line x1="140" y1="44" x2="140" y2="49" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="140" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#78350f" text-anchor="middle">300 mm (abort)</text>

    <!-- Tick 465 mm (Limit) -->
    <line x1="206" y1="44" x2="206" y2="49" stroke="#cc4444" stroke-width="1"/>
    <text x="206" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#cc4444" text-anchor="middle">465 mm limit</text>

    <!-- Tick 675 mm (Breach) -->
    <line x1="290" y1="44" x2="290" y2="49" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="290" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">675 mm breach</text>
    <text x="290" y="67" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#cc4444" text-anchor="middle">(+210 mm)</text>
  </g>
</svg>
