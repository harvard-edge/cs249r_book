<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#004B87"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E793C"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>

    <!-- Conflict hatch pattern -->
    <pattern id="conflict-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#FCA5A5" stroke-width="2.5"/>
    </pattern>
  </defs>

  <!-- Clean Background -->
  <rect width="1000" height="460" fill="#FFFFFF"/>

  <!-- Sub-Figure Headers -->
  <text x="245" y="32" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">(a) Dynamic Reachability Cones &amp; Exclusion Zones (BEV)</text>
  <text x="745" y="32" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">(b) Multi-Object Tracking (MOT) State Lifecycle</text>

  <!-- Panel Divider -->
  <line x1="495" y1="20" x2="495" y2="445" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): DYNAMIC REACHABILITY & EXCLUSION ZONES                     -->
  <!-- ==================================================================== -->
  <g id="panel-a">
    <!-- Grid lines representing warehouse coordinate frame -->
    <g stroke="#F1F5F9" stroke-width="1">
      <line x1="40" y1="90" x2="470" y2="90"/>
      <line x1="40" y1="160" x2="470" y2="160"/>
      <line x1="40" y1="230" x2="470" y2="230"/>
      <line x1="40" y1="300" x2="470" y2="300"/>
      <line x1="40" y1="370" x2="470" y2="370"/>
      <line x1="110" y1="60" x2="110" y2="420"/>
      <line x1="190" y1="60" x2="190" y2="420"/>
      <line x1="270" y1="60" x2="270" y2="420"/>
      <line x1="350" y1="60" x2="350" y2="420"/>
      <line x1="430" y1="60" x2="430" y2="420"/>
    </g>

    <!-- Moving Coworker (Track ID 42) -->
    <!-- Time t_0: initial position -->
    <circle cx="390" cy="360" r="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <circle cx="390" cy="360" r="5" fill="#D97706"/>
    <text x="390" y="388" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">Coworker (t₀)</text>
    <text x="390" y="401" font-size="9" fill="#B45309" text-anchor="middle">Track #42: v̂ = 1.2 m/s</text>

    <!-- Velocity vector -->
    <line x1="390" y1="360" x2="340" y2="285" stroke="#D97706" stroke-width="2.5" marker-end="url(#arr-amber)"/>

    <!-- Forward Reachability Cones: R(t_1), R(t_2), R(t_3) -->
    <!-- Cone at t_1 -->
    <ellipse cx="330" cy="275" rx="36" ry="32" fill="#FEF9C3" fill-opacity="0.5" stroke="#CA8A04" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="330" y="278" font-size="9" font-weight="700" fill="#854D0E" text-anchor="middle">R(t₁)</text>

    <!-- Cone at t_2 (Intersection / Conflict Zone) -->
    <ellipse cx="265" cy="195" rx="58" ry="50" fill="#FEE2E2" fill-opacity="0.6" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="305" y="175" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">R(t₂): Conflict!</text>

    <!-- Conflict hatch over intersection -->
    <ellipse cx="230" cy="195" rx="26" ry="22" fill="url(#conflict-hatch)" stroke="#DC2626" stroke-width="1.5"/>

    <!-- Cone at t_3 -->
    <ellipse cx="195" cy="120" rx="75" ry="62" fill="#F8FAFC" fill-opacity="0.35" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5,4"/>
    <text x="140" y="115" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">R(t₃): Horizon</text>

    <!-- Robot Base and Trajectory -->
    <!-- Robot at t_0 -->
    <rect x="75" y="340" width="34" height="42" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <circle cx="92" cy="361" r="6" fill="#0284C7"/>
    <text x="92" y="398" font-size="10" font-weight="700" fill="#0369A1" text-anchor="middle">Robot (t₀)</text>

    <!-- Target Goal (offset rightward for clean clearance) -->
    <circle cx="260" cy="72" r="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <circle cx="260" cy="72" r="4" fill="#16A34A"/>
    <text x="280" y="76" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="start">Goal: p_target</text>

    <!-- Nominal Proposer Trajectory (Blocked / Intersecting) -->
    <path d="M 92 340 C 95 260, 155 210, 220 195" fill="none" stroke="#DC2626" stroke-width="2.8" marker-end="url(#arr-red)"/>
    <path d="M 220 195 C 235 190, 245 130, 260 72" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="5,4"/>
    <text x="130" y="270" font-size="9.5" font-weight="700" fill="#DC2626" transform="rotate(-48 130 270)">Candidate Path</text>

    <!-- Admitted Reroute / Wait Strategy -->
    <path d="M 92 340 Q 60 210 100 135 T 260 72" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <text x="62" y="175" font-size="9.5" font-weight="700" fill="#15803D" transform="rotate(-68 62 175)">Admitted Path (Yield / Detour)</text>

    <!-- Callout Box for Refusal -->
    <g transform="translate(195, 235)">
      <rect x="0" y="0" width="180" height="52" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="1.2"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#991B1B">INTENT REFUSAL GATE:</text>
      <text x="10" y="30" font-size="8.5" font-family="monospace" fill="#B91C1C">ERR_DYNAMIC_OCCUPANCY</text>
      <text x="10" y="44" font-size="8" fill="#7F1D1D">T_robot(t₂) ∩ R_42(t₂) ≠ ∅</text>
    </g>

    <!-- Legend -->
    <g transform="translate(45, 420)">
      <circle cx="5" cy="5" r="4" fill="#D97706"/>
      <text x="14" y="8" font-size="8.5" fill="#475569">Tracked Actor</text>
      <line x1="85" y1="5" x2="105" y2="5" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="110" y="8" font-size="8.5" fill="#475569">Reachability Cone R(τ)</text>
      <line x1="225" y1="5" x2="245" y2="5" stroke="#16A34A" stroke-width="2"/>
      <text x="250" y="8" font-size="8.5" fill="#475569">Certified Free Corridor</text>
    </g>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): MULTI-OBJECT TRACKING STATE LIFECYCLE                     -->
  <!-- ==================================================================== -->
  <g id="panel-b" transform="translate(500, 55)">
    <!-- Stage 1: Ingestion & Gating -->
    <rect x="15" y="15" width="130" height="50" rx="5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
    <text x="80" y="34" font-size="10.5" font-weight="700" fill="#1E293B" text-anchor="middle">Sensor Ingress</text>
    <text x="80" y="49" font-size="8.5" fill="#475569" text-anchor="middle">3D Detections {z_j}</text>

    <!-- Arrow to Gating -->
    <line x1="145" y1="40" x2="175" y2="40" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>

    <!-- Gating Block -->
    <rect x="180" y="15" width="140" height="50" rx="5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="250" y="34" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Validation Gate</text>
    <text x="250" y="49" font-size="8.5" fill="#1E40AF" text-anchor="middle">d_M² ≤ γ_gate (χ₃² bound)</text>

    <!-- Arrow to Association -->
    <line x1="320" y1="40" x2="355" y2="40" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>

    <!-- Association Block -->
    <rect x="360" y="15" width="105" height="50" rx="5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="412" y="34" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Hungarian</text>
    <text x="412" y="49" font-size="8.5" fill="#1E40AF" text-anchor="middle">Bipartite Match</text>

    <!-- Routing from Hungarian -->
    <!-- Unmatched detection -> Tentative -->
    <path d="M 390 65 L 390 95 L 80 95 L 80 135" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <text x="180" y="90" font-size="8" fill="#475569">Unmatched Detection (New Spawn)</text>

    <!-- Matched detection -> Confirmed track update -->
    <path d="M 430 65 L 430 115 L 290 115 L 290 135" fill="none" stroke="#047857" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <text x="360" y="110" font-size="8" font-weight="600" fill="#047857">Matched Update</text>

    <!-- FSM States: Tentative, Confirmed, Coasting, Terminated -->
    <!-- 1. Tentative State -->
    <rect x="20" y="140" width="125" height="60" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="82" y="162" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">TENTATIVE</text>
    <text x="82" y="177" font-size="8.5" fill="#92400E" text-anchor="middle">Unconfirmed spawn</text>
    <text x="82" y="190" font-size="8" fill="#B45309" text-anchor="middle">(Hidden from Safety)</text>

    <!-- Arrow Tentative -> Confirmed -->
    <line x1="145" y1="170" x2="210" y2="170" stroke="#047857" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="178" y="163" font-size="8" font-weight="600" fill="#047857" text-anchor="middle">M-of-N</text>

    <!-- 2. Confirmed State -->
    <rect x="215" y="140" width="145" height="60" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="287" y="162" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">CONFIRMED</text>
    <text x="287" y="177" font-size="8.5" fill="#047857" text-anchor="middle">Active Track (x̂, P, v̂)</text>
    <text x="287" y="190" font-size="8" fill="#065F46" text-anchor="middle">Kalman Gain Updates</text>

    <!-- Arrow Confirmed -> Coasting on Miss -->
    <path d="M 360 158 L 380 158" fill="none" stroke="#D97706" stroke-width="1.4" marker-end="url(#arr-amber)"/>
    <text x="370" y="150" font-size="7.5" font-weight="600" fill="#D97706" text-anchor="middle">Miss</text>

    <!-- Arrow Coasting -> Confirmed on Re-detection -->
    <path d="M 380 182 L 360 182" fill="none" stroke="#047857" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <text x="370" y="194" font-size="7.5" font-weight="600" fill="#047857" text-anchor="middle">Re-hit</text>

    <!-- 3. Coasting State -->
    <rect x="385" y="140" width="82" height="60" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="426" y="162" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">COASTING</text>
    <text x="426" y="176" font-size="8" fill="#92400E" text-anchor="middle">Occluded</text>
    <text x="426" y="189" font-size="7.5" fill="#B45309" text-anchor="middle">P_t+1 = FP Fᵀ+Q</text>

    <!-- Arrow Coasting -> Terminated -->
    <line x1="426" y1="200" x2="426" y2="235" stroke="#A51C30" stroke-width="1.4" marker-end="url(#arr-red)"/>
    <text x="418" y="221" font-size="7.5" font-weight="600" fill="#A51C30" text-anchor="end">Age &gt; T_lost</text>

    <!-- 4. Terminated State -->
    <rect x="385" y="240" width="82" height="42" rx="5" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
    <text x="426" y="258" font-size="9" font-weight="700" fill="#991B1B" text-anchor="middle">TERMINATED</text>
    <text x="426" y="271" font-size="7.5" fill="#B91C1C" text-anchor="middle">Purge Track ID</text>

    <!-- Arrow from Confirmed down to Output Record Schema -->
    <line x1="287" y1="200" x2="287" y2="250" stroke="#004B87" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="297" y="228" font-size="8.5" font-weight="600" fill="#004B87">Publish Manifest</text>

    <!-- Informational Contract Box -->
    <g transform="translate(15, 255)">
      <rect x="0" y="0" width="350" height="120" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#0369A1">DYNAMIC TRACK MANIFEST SCHEMA (Handoff Contract)</text>
      
      <g font-family="monospace" font-size="8.5" fill="#0C4A6E" transform="translate(12, 38)">
        <text x="0" y="0">track_id:       uint32          // Unique persistent actor ID</text>
        <text x="0" y="15">state_vector:   [x, y, z, vx, vy, vz]  // SE(3) pose + velocity</text>
        <text x="0" y="30">covariance:     Matrix6x6       // Kinematic error bounds</text>
        <text x="0" y="45">lifecycle:      {CONFIRMED | COASTING}</text>
        <text x="0" y="60">evidence_epoch: MonotonicTimestamp // Mid-exposure capture</text>
        <text x="0" y="75">reach_cone:     Radius + GrowthRate(a_max, σ_track)</text>
      </g>
    </g>
  </g>
</svg>
