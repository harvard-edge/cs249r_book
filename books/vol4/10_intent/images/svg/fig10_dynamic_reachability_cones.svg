<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-50.0" y="-21.5" width="1100.0" height="473.0" fill="#ffffff"/>
  
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#004B87"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>

    <!-- Conflict hatch pattern -->
    <pattern id="conflict-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#F87171" stroke-width="2"/>
    </pattern>

    <!-- Floor shelf hatch pattern -->
    <pattern id="shelf-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#E2E8F0" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Clean Background -->
  <rect width="1000" height="430" fill="#FFFFFF"/>

  <!-- Sub-Figure Headers -->
  <text x="245" y="27" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">(a) Forward Occupancy Sets &amp; Exclusion Zones (BEV)</text>
  <text x="745" y="27" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">(b) Multi-Object Tracking (MOT) State Lifecycle</text>

  <!-- Panel Divider -->
  <line x1="495" y1="16" x2="495" y2="416" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): DYNAMIC REACHABILITY & EXCLUSION ZONES (BEV)               -->
  <!-- ==================================================================== -->
  <g id="panel-a">
    <!-- Top & Bottom Warehouse Storage Racks (Physical Context) -->
    <g transform="translate(30, 36)">
      <rect x="0" y="0" width="435" height="22" rx="2" fill="url(#shelf-hatch)" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="15" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B">STORAGE ARRAY NORTH (RACK A-01)</text>
    </g>
    <g transform="translate(30, 362)">
      <rect x="0" y="0" width="435" height="24" rx="2" fill="url(#shelf-hatch)" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B">STORAGE ARRAY SOUTH (RACK A-02)</text>
    </g>

    <!-- Faint Aisle Grid Lines -->
    <g stroke="#F1F5F9" stroke-width="1">
      <line x1="30" y1="110" x2="465" y2="110"/>
      <line x1="30" y1="170" x2="465" y2="170"/>
      <line x1="30" y1="230" x2="465" y2="230"/>
      <line x1="30" y1="290" x2="465" y2="290"/>
      <line x1="30" y1="350" x2="465" y2="350"/>
      <line x1="90" y1="66" x2="90" y2="362"/>
      <line x1="160" y1="66" x2="160" y2="362"/>
      <line x1="230" y1="66" x2="230" y2="362"/>
      <line x1="300" y1="66" x2="300" y2="362"/>
      <line x1="370" y1="66" x2="370" y2="362"/>
      <line x1="440" y1="66" x2="440" y2="362"/>
    </g>

    <!-- Coordinate Frame Axes -->
    <g transform="translate(42, 335)">
      <line x1="0" y1="0" x2="26" y2="0" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-dark)"/>
      <line x1="0" y1="0" x2="0" y2="-26" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-dark)"/>
      <text x="28" y="4" font-size="8" font-family="'Menlo', monospace" fill="#64748B">X<tspan baseline-shift="sub" font-size="75%">W</tspan></text>
      <text x="-4" y="-30" font-size="8" font-family="'Menlo', monospace" fill="#64748B">Y<tspan baseline-shift="sub" font-size="75%">W</tspan></text>
    </g>

    <!-- Moving Coworker (Track ID 42) -->
    <!-- Initial position at t_0 -->
    <g transform="translate(385, 310)">
      <!-- Shoulders ellipse -->
      <ellipse cx="0" cy="0" rx="14" ry="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" transform="rotate(-40)"/>
      <!-- Head circle -->
      <circle cx="0" cy="0" r="5" fill="#FDE68A" stroke="#B45309" stroke-width="1.2"/>
      <!-- Velocity vector -->
      <line x1="0" y1="0" x2="-45" y2="-45" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>
      <text x="18" y="-4" font-size="8.5" font-weight="700" fill="#92400E">Coworker (t₀)</text>
      <text x="18" y="8" font-size="7.5" font-family="'Menlo', monospace" fill="#B45309">#42: v̂=1.2 m/s</text>
    </g>

    <!-- Forward Occupancy Sets: R(t_1), R(t_2), R(t_3) -->
    <!-- Cone 1: t_1 (0.5s) -->
    <ellipse cx="325" cy="245" rx="34" ry="30" fill="#FEF9C3" fill-opacity="0.45" stroke="#CA8A04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="325" y="249" font-size="8" font-weight="700" fill="#854D0E" text-anchor="middle">R(t₁)</text>

    <!-- Cone 2: t_2 (1.2s) - Intersection / Conflict Zone -->
    <ellipse cx="265" cy="180" rx="55" ry="46" fill="#FEE2E2" fill-opacity="0.55" stroke="#EF4444" stroke-width="1.6" stroke-dasharray="4,3"/>
    
    <!-- Protective pill for R(t_2) label -->
    <rect x="252" y="148" width="90" height="17" rx="3" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="297" y="160" font-size="8" font-weight="700" fill="#B91C1C" text-anchor="middle">R(t₂): Conflict</text>

    <!-- Conflict hatch zone (where candidate path penetrates R(t_2)) -->
    <ellipse cx="228" cy="185" rx="24" ry="20" fill="url(#conflict-hatch)" stroke="#DC2626" stroke-width="1.5"/>

    <!-- Reticle crosshair on conflict point -->
    <circle cx="228" cy="185" r="7" fill="none" stroke="#DC2626" stroke-width="1.3"/>
    <line x1="228" y1="174" x2="228" y2="196" stroke="#DC2626" stroke-width="1.2"/>
    <line x1="217" y1="185" x2="239" y2="185" stroke="#DC2626" stroke-width="1.2"/>

    <!-- Cone 3: t_3 (2.0s) - Outer Planning Horizon -->
    <ellipse cx="205" cy="120" rx="72" ry="58" fill="#F8FAFC" fill-opacity="0.35" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5,3"/>
    
    <!-- Protective pill for R(t_3) label -->
    <rect x="118" y="103" width="86" height="17" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="161" y="115" font-size="7.5" font-weight="600" fill="#64748B" text-anchor="middle">R(t₃): Horizon</text>

    <!-- Mobile Robot (AMR) at t_0 -->
    <g transform="translate(100, 305)">
      <!-- AMR Chassis -->
      <rect x="-16" y="-20" width="32" height="40" rx="3" fill="#EFF6FF" stroke="#004B87" stroke-width="1.6"/>
      <!-- Left wheel -->
      <rect x="-19" y="-12" width="3" height="15" rx="1" fill="#1E293B"/>
      <!-- Right wheel -->
      <rect x="16" y="-12" width="3" height="15" rx="1" fill="#1E293B"/>
      <!-- LiDAR scanner puck -->
      <circle cx="0" cy="0" r="5.5" fill="#DBEAFE" stroke="#004B87" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="1.5" fill="#1F407A"/>
      <!-- Heading arrow -->
      <line x1="0" y1="-8" x2="0" y2="-22" stroke="#004B87" stroke-width="1.4" marker-end="url(#arr-navy)"/>
      <text x="0" y="31" font-size="8.5" font-weight="700" fill="#004B87" text-anchor="middle">AMR (t₀)</text>
    </g>

    <!-- Goal Target Position -->
    <g transform="translate(255, 80)">
      <circle cx="0" cy="0" r="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="4" fill="#16A34A"/>
      <line x1="-13" y1="0" x2="13" y2="0" stroke="#16A34A" stroke-width="1"/>
      <line x1="0" y1="-13" x2="0" y2="13" stroke="#16A34A" stroke-width="1"/>
      <text x="16" y="4" font-size="9" font-weight="700" fill="#15803D">Goal: p<tspan baseline-shift="sub" font-size="80%">target</tspan></text>
    </g>

    <!-- Nominal Proposer Trajectory (Blocked / Intersecting R(t_2)) -->
    <path d="M 100 285 C 105 235, 160 200, 224 186" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
    <path d="M 228 185 C 238 180, 248 120, 255 80" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="3,3"/>
    
    <!-- Protective card on Candidate Path -->
    <g transform="translate(138, 240) rotate(-42)">
      <rect x="-44" y="-9" width="88" height="16" rx="2" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.7"/>
      <text x="0" y="3" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">Candidate Path</text>
    </g>

    <!-- Admitted Reroute / Yield Trajectory -->
    <path d="M 100 285 Q 60 200 95 130 T 255 80" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-green)"/>
    
    <!-- Protective horizontal card on Admitted Detour along trajectory -->
    <g transform="translate(79, 188)">
      <rect x="-44" y="-9" width="88" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8"/>
      <text x="0" y="3.5" font-size="8" font-weight="700" fill="#047857" text-anchor="middle">Admitted Detour</text>
    </g>

    <!-- Refusal Verdict Callout Box -->
    <g transform="translate(178, 230)">
      <rect x="0" y="0" width="158" height="46" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#991B1B">INTENT ADMISSION GATE</text>
      <text x="8" y="27" font-size="7.5" font-family="'Menlo', monospace" fill="#B91C1C">ERR_DYNAMIC_OCCUPANCY</text>
      <text x="8" y="39" font-size="7.5" font-family="'Menlo', monospace" fill="#7F1D1D">T_robot(t₂) ∩ R₄₂(t₂) ≠ ∅</text>
    </g>

    <!-- Bottom Legend Chips -->
    <g transform="translate(42, 398)">
      <circle cx="5" cy="5" r="4" fill="#D97706"/>
      <text x="13" y="8" font-size="7.5" fill="#475569">Tracked Actor</text>

      <line x1="80" y1="5" x2="100" y2="5" stroke="#EF4444" stroke-width="1.4" stroke-dasharray="3,2"/>
      <text x="105" y="8" font-size="7.5" fill="#475569">Occupancy R(τ)</text>

      <line x1="180" y1="5" x2="200" y2="5" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4,2"/>
      <text x="205" y="8" font-size="7.5" fill="#DC2626">Refused Path</text>

      <line x1="270" y1="5" x2="290" y2="5" stroke="#059669" stroke-width="2"/>
      <text x="295" y="8" font-size="7.5" fill="#047857">Admitted Corridor</text>
    </g>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): MULTI-OBJECT TRACKING STATE LIFECYCLE                     -->
  <!-- ==================================================================== -->
  <g id="panel-b" transform="translate(515, 0)">
    <!-- Stage 1: Ingestion & Gating Pipeline (Top Row) -->
    <!-- Ingress -->
    <g transform="translate(10, 42)">
      <rect width="118" height="46" rx="3" fill="#F8FAFC" stroke="#64748B" stroke-width="1.1"/>
      <text x="59" y="18" font-size="9" font-weight="700" fill="#1E293B" text-anchor="middle">Sensor Ingress</text>
      <text x="59" y="32" font-size="7.5" font-family="'Menlo', monospace" fill="#475569" text-anchor="middle">3D Detections {z_j}</text>
    </g>

    <!-- Arrow Ingress -> Validation -->
    <line x1="128" y1="65" x2="152" y2="65" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>

    <!-- Validation Gating Block -->
    <g transform="translate(152, 42)">
      <rect width="140" height="46" rx="3" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.1"/>
      <text x="70" y="18" font-size="9" font-weight="700" fill="#1F407A" text-anchor="middle">Validation Gate</text>
      <text x="70" y="32" font-size="7.5" font-family="'Menlo', monospace" fill="#1E40AF" text-anchor="middle">d_M² ≤ γ_gate (χ₃²)</text>
    </g>

    <!-- Arrow Validation -> Hungarian -->
    <line x1="292" y1="65" x2="316" y2="65" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>

    <!-- Hungarian Association Block -->
    <g transform="translate(316, 42)">
      <rect width="134" height="46" rx="3" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.1"/>
      <text x="67" y="18" font-size="9" font-weight="700" fill="#1F407A" text-anchor="middle">Hungarian Match</text>
      <text x="67" y="32" font-size="7.5" font-family="'Menlo', monospace" fill="#1E40AF" text-anchor="middle">Bipartite Min-Cost</text>
    </g>

    <!-- Association Routing Paths -->
    <!-- Unmatched detection -> Tentative -->
    <path d="M 345 88 L 345 106 L 68 106 L 68 126" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <rect x="145" y="99" width="125" height="14" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.7"/>
    <text x="207" y="109" font-size="7" fill="#475569" text-anchor="middle">Unmatched Detection (New Spawn)</text>

    <!-- Matched detection -> Confirmed track update -->
    <path d="M 390 88 L 390 114 L 235 114 L 235 126" fill="none" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <rect x="270" y="108" width="90" height="14" rx="2" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.7"/>
    <text x="315" y="118" font-size="7" font-weight="600" fill="#047857" text-anchor="middle">Matched Update</text>

    <!-- FSM State Machine: Tentative, Confirmed, Coasting, Terminated -->
    <!-- 1. Tentative State -->
    <g transform="translate(10, 128)">
      <rect width="118" height="64" rx="3" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.3"/>
      <text x="59" y="18" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle">TENTATIVE</text>
      <text x="59" y="31" font-size="7.5" fill="#B45309" text-anchor="middle">Unconfirmed spawn</text>
      <rect x="10" y="40" width="98" height="16" rx="2" fill="#FEF3C7" stroke="#FCD34D" stroke-width="0.7"/>
      <text x="59" y="51" font-size="7" font-weight="600" fill="#92400E" text-anchor="middle">Masked from Intent</text>
    </g>

    <!-- Arrow Tentative -> Confirmed -->
    <line x1="128" y1="160" x2="168" y2="160" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <rect x="133" y="148" width="30" height="13" rx="2" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.7"/>
    <text x="148" y="157" font-size="6.5" font-weight="700" fill="#047857" text-anchor="middle">M-of-N</text>

    <!-- 2. Confirmed State -->
    <g transform="translate(170, 128)">
      <rect width="138" height="64" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
      <text x="69" y="18" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">CONFIRMED</text>
      <text x="69" y="31" font-size="7.5" font-family="'Menlo', monospace" fill="#047857" text-anchor="middle">State [x̂, v̂], Cov P</text>
      <rect x="12" y="40" width="114" height="16" rx="2" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.7"/>
      <text x="69" y="51" font-size="7" font-weight="600" fill="#15803D" text-anchor="middle">Active Intent Lease</text>
    </g>

    <!-- Arrows Confirmed <-> Coasting -->
    <!-- Confirmed -> Coasting on Miss -->
    <path d="M 308 148 L 338 148" fill="none" stroke="#D97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
    <text x="323" y="143" font-size="6.5" font-weight="700" fill="#D97706" text-anchor="middle">Miss</text>

    <!-- Coasting -> Confirmed on Re-hit -->
    <path d="M 338 172 L 308 172" fill="none" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <text x="323" y="182" font-size="6.5" font-weight="700" fill="#047857" text-anchor="middle">Re-hit</text>

    <!-- 3. Coasting State -->
    <g transform="translate(340, 128)">
      <rect width="110" height="64" rx="3" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.3"/>
      <text x="55" y="18" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle">COASTING</text>
      <text x="55" y="31" font-size="7.5" fill="#B45309" text-anchor="middle">Occluded Actor</text>
      <text x="55" y="45" font-size="7" font-family="'Menlo', monospace" fill="#78350F" text-anchor="middle">P<tspan baseline-shift="sub" font-size="75%">k+1</tspan> = FP<tspan baseline-shift="sub" font-size="75%">k</tspan>Fᵀ+Q</text>
      <text x="55" y="56" font-size="6.5" fill="#92400E" text-anchor="middle">(Set Expands)</text>
    </g>

    <!-- Arrow Coasting -> Terminated -->
    <line x1="395" y1="192" x2="395" y2="230" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
    <rect x="365" y="206" width="60" height="13" rx="2" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.7"/>
    <text x="395" y="215" font-size="6.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Age &gt; T_lost</text>

    <!-- 4. Terminated State -->
    <g transform="translate(345, 232)">
      <rect width="105" height="40" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
      <text x="52" y="16" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">TERMINATED</text>
      <text x="52" y="29" font-size="7.5" font-family="'Menlo', monospace" fill="#B91C1C" text-anchor="middle">Purge Track ID</text>
    </g>

    <!-- Arrow from Confirmed down to Output Record Schema -->
    <line x1="239" y1="192" x2="239" y2="236" stroke="#004B87" stroke-width="1.8" marker-end="url(#arr-navy)"/>
    <rect x="180" y="206" width="118" height="15" rx="2" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="0.8"/>
    <text x="239" y="217" font-size="7" font-weight="700" fill="#004B87" text-anchor="middle">Publish Verified Manifest</text>

    <!-- Informational Contract: Dynamic Track Manifest Schema -->
    <g transform="translate(10, 240)">
      <rect width="325" height="146" rx="3" fill="#F8FAFC" stroke="#004B87" stroke-width="1.3"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#004B87">DYNAMIC TRACK MANIFEST (Handoff Contract)</text>
      <line x1="12" y1="24" x2="313" y2="24" stroke="#CBD5E1" stroke-width="0.8"/>

      <g font-family="'Menlo', monospace" font-size="7.5" fill="#334155" transform="translate(12, 38)">
        <text x="0" y="0" font-weight="700" fill="#1E40AF">track_id:</text>
        <text x="100" y="0">uint32</text>
        <text x="200" y="0" fill="#64748B">// Persistent ID</text>

        <text x="0" y="18" font-weight="700" fill="#1E40AF">state_vector:</text>
        <text x="100" y="18">SE(3) [x, v]</text>
        <text x="200" y="18" fill="#64748B">// Pose + velocity</text>

        <text x="0" y="36" font-weight="700" fill="#1E40AF">covariance:</text>
        <text x="100" y="36">Matrix6x6</text>
        <text x="200" y="36" fill="#64748B">// Error bounds P</text>

        <text x="0" y="54" font-weight="700" fill="#1E40AF">lifecycle:</text>
        <text x="100" y="54">LifecycleEnum</text>
        <text x="200" y="54" fill="#64748B">// CONFIRMED|COAST</text>

        <text x="0" y="72" font-weight="700" fill="#1E40AF">occ_set:</text>
        <text x="100" y="72">Radius(t, v_h)</text>
        <text x="200" y="72" fill="#64748B">// Expansion r(τ)</text>

        <text x="0" y="90" font-weight="700" fill="#1E40AF">evidence_epoch:</text>
        <text x="100" y="90">Timestamp</text>
        <text x="200" y="90" fill="#64748B">// Mid-exposure</text>
      </g>
    </g>
  </g>
</svg>
