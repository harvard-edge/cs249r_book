<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="#FFFFFF"/>

  <!-- ==================================================================== -->
  <!-- DOMAIN LABELS                                                        -->
  <!-- ==================================================================== -->
  <text x="350" y="45" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1" text-anchor="middle">APPLICATION PROCESSOR (MPU · LINUX)</text>
  <text x="860" y="45" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1" text-anchor="middle">REAL-TIME CONTROLLER (MCU)</text>

  <!-- ==================================================================== -->
  <!-- DOMAIN 1: MPU COGNITIVE PIPELINE                                     -->
  <!-- ==================================================================== -->

  <!-- Inputs (Left Column Capsules) -->
  <!-- Input 1: Vision -->
  <rect x="35" y="100" width="105" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="87" y="121" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Vision I_t</text>

  <!-- Input 2: Instruction -->
  <rect x="35" y="183" width="105" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="87" y="204" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Prompt ℒ</text>

  <!-- Input 3: Proprioception -->
  <rect x="35" y="266" width="105" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="87" y="287" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">State q, q̇</text>

  <!-- Arrows from Inputs to VLA Backbone -->
  <line x1="140" y1="117" x2="190" y2="185" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-dark)"/>
  <line x1="140" y1="200" x2="190" y2="200" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-dark)"/>
  <line x1="140" y1="283" x2="190" y2="215" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <!-- Multimodal VLA Backbone (Soft Blue Box) -->
  <rect x="190" y="162" width="135" height="76" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="257" y="196" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Vision-Language</text>
  <text x="257" y="215" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Backbone</text>

  <!-- Pretrained Weights Pin (Ma et al. Style) -->
  <g transform="translate(257, 162)">
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="0" cy="-2" r="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <rect x="-65" y="-66" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Padlock icon -->
    <g transform="translate(-50, -56)">
      <rect x="0" y="4" width="8" height="6" rx="1" fill="#64748B"/>
      <path d="M 2 4 L 2 2.5 C 2 1.4 2.9 0.5 4 0.5 C 5.1 0.5 6 1.4 6 2.5 L 6 4" fill="none" stroke="#64748B" stroke-width="1"/>
    </g>
    <text x="5" y="-48" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Pretrained VLA</text>
  </g>

  <!-- Arrow to 3D Affordance Field -->
  <line x1="325" y1="200" x2="368" y2="200" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <!-- 3D Affordance & Repulsion Field (Soft Green Box) -->
  <rect x="368" y="162" width="135" height="76" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="435" y="196" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3D Affordance</text>
  <text x="435" y="215" font-size="11.5" font-weight="600" fill="#15803D" text-anchor="middle">Cost Field U(x)</text>

  <!-- Arrow to Ambiguity Gate -->
  <line x1="503" y1="200" x2="540" y2="200" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <!-- Ambiguity Refusal Gate (Diamond) -->
  <g transform="translate(580, 200)">
    <polygon points="0,-36 40,0 0,36 -40,0" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
    <text x="0" y="-4" font-size="10" font-weight="700" fill="#9F1239" text-anchor="middle">Entropy</text>
    <text x="0" y="11" font-size="9.5" font-family="monospace" font-weight="700" fill="#BE123C" text-anchor="middle">H(z) ≤ H₀?</text>

    <!-- Downward Refusal Branch -->
    <line x1="0" y1="36" x2="0" y2="88" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
    <text x="12" y="60" font-size="9.5" font-weight="700" fill="#DC2626">No</text>
    <rect x="-65" y="88" width="130" height="34" rx="17" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="0" y="109" font-size="10.5" font-weight="700" fill="#991B1B" text-anchor="middle">Grounding Refusal</text>

    <!-- Forward Pass Branch -->
    <line x1="40" y1="0" x2="88" y2="0" stroke="#059669" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <text x="58" y="-7" font-size="9.5" font-weight="700" fill="#059669">Yes</text>
  </g>

  <!-- ==================================================================== -->
  <!-- SILICON PRIVILEGE BOUNDARY & SHARED SRAM                             -->
  <!-- ==================================================================== -->
  <!-- Dashed Vertical Barrier Line -->
  <line x1="728" y1="65" x2="728" y2="365" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5,4"/>
  <rect x="686" y="372" width="84" height="20" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
  <text x="728" y="386" font-size="8.5" font-weight="800" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">SILICON BARRIER</text>

  <!-- Shared SRAM Interconnect Capsule (Straddles the Barrier) -->
  <g transform="translate(728, 200)">
    <rect x="-55" y="-22" width="110" height="44" rx="22" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="0" y="-4" font-size="10.5" font-weight="700" fill="#1E40AF" text-anchor="middle">Shared SRAM</text>
    <text x="0" y="12" font-size="9" font-family="monospace" font-weight="600" fill="#2563EB" text-anchor="middle">Lease (p₀, Σ, τ)</text>
  </g>

  <!-- Arrow from SRAM into MCU Controller -->
  <line x1="783" y1="200" x2="818" y2="200" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <!-- ==================================================================== -->
  <!-- DOMAIN 2: REAL-TIME CONTROLLER (MCU)                                 -->
  <!-- ==================================================================== -->

  <!-- Hardware Watchdog Timer (Soft Amber Box above) -->
  <g transform="translate(818, 92)">
    <rect x="0" y="0" width="140" height="48" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.3"/>
    <text x="70" y="21" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">Hardware Watchdog</text>
    <text x="70" y="37" font-size="9.5" font-family="monospace" font-weight="600" fill="#B45309" text-anchor="middle">Timer Countdown τ</text>

    <!-- Downward Control Pin into Controller -->
    <line x1="70" y1="48" x2="70" y2="70" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-dark)"/>
  </g>

  <!-- Real-Time Safety Enforcer (Soft Green Box) -->
  <rect x="818" y="162" width="140" height="76" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="888" y="196" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Real-Time Safety</text>
  <text x="888" y="215" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">Enforcer (1 kHz)</text>

  <!-- Arrow to Actuators -->
  <line x1="888" y1="238" x2="888" y2="288" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <!-- Actuators (Gray Capsule) -->
  <rect x="828" y="288" width="120" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="888" y="309" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Actuator Inverters</text>

  <!-- Timeout Expiration Path (Watchdog to Actuators) -->
  <path d="M 958 116 L 978 116 L 978 305 L 948 305" fill="none" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="974" y="210" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle" transform="rotate(90, 974, 210)">Timeout Clamp</text>

</svg>
