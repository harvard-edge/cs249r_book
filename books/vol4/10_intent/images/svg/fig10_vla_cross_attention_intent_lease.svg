<?xml version="1.0" encoding="UTF-8"?>
<!-- Grounded intent pipeline across the AP / safety-MCU boundary (M1: discrete MCU,
     board link, no shared memory). Rebuilt 2026-09-29 at the 680 px house canvas.
     Hand-drawn numbers (336 ms, 2 Hz, 1 kHz) are guarded by calc-intent-vla-figure
     in 10_intent.qmd. Colors: vol4 theme-colors.tex roles. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 415" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B87333"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B4B8A"/>
    </marker>
  </defs>
  <rect width="680" height="415" fill="#ffffff"/>

  <!-- Domain headers and the processor boundary -->
  <text x="230" y="24" font-size="10" font-weight="700" fill="#4A5568" text-anchor="middle" letter-spacing="0.6">APPLICATION PROCESSOR</text>
  <text x="554" y="24" font-size="10" font-weight="700" fill="#4A5568" text-anchor="middle" letter-spacing="0.6">SAFETY MCU</text>
  <line x1="458" y1="34" x2="458" y2="405" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- Inputs (measured) -->
  <rect x="20" y="40" width="80" height="30" rx="3" fill="#E0F0F2" stroke="#007A87" stroke-width="1.2"/>
  <text x="60" y="59" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">image I<tspan baseline-shift="sub" font-size="75%">t</tspan></text>
  <rect x="115" y="40" width="80" height="30" rx="3" fill="#E0F0F2" stroke="#007A87" stroke-width="1.2"/>
  <text x="155" y="59" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">instruction</text>
  <rect x="210" y="40" width="80" height="30" rx="3" fill="#E0F0F2" stroke="#007A87" stroke-width="1.2"/>
  <text x="250" y="59" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">state q, q̇</text>
  <line x1="60" y1="70" x2="60" y2="98" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="155" y1="70" x2="155" y2="98" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="250" y1="70" x2="250" y2="98" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Intent model (proposal) -->
  <rect x="20" y="100" width="270" height="46" rx="3" fill="#F6EDE4" stroke="#B87333" stroke-width="1.3"/>
  <text x="155" y="119" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">intent model (VLA)</text>
  <text x="155" y="136" font-size="8.5" fill="#4A5568" text-anchor="middle">inference 336 ms · runs at 2 Hz</text>
  <line x1="155" y1="146" x2="155" y2="170" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-bronze)"/>

  <!-- 3D cost field -->
  <rect x="20" y="172" width="270" height="34" rx="3" fill="#F6EDE4" stroke="#B87333" stroke-width="1.3"/>
  <text x="155" y="193" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">3D cost field U(x), candidate goal</text>
  <line x1="290" y1="189" x2="310" y2="189" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-bronze)"/>

  <!-- Ambiguity gate -->
  <path d="M 360 159 L 408 189 L 360 219 L 312 189 Z" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="360" y="186" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle">ambiguity</text>
  <text x="360" y="199" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle">|&#8201;𝒞&#8201;| = 1 ?</text>

  <!-- No: refusal -->
  <line x1="360" y1="219" x2="360" y2="242" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="367" y="235" font-size="8.5" fill="#4A5568">no</text>
  <rect x="305" y="244" width="110" height="28" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="360" y="262" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">grounding refusal</text>

  <!-- Yes: proposal record over the board link -->
  <line x1="408" y1="189" x2="490" y2="189" stroke="#B87333" stroke-width="1.4" marker-end="url(#arr-bronze)"/>
  <text x="418" y="203" font-size="8.5" fill="#4A5568">yes</text>
  <rect x="386" y="136" width="104" height="34" rx="3" fill="#ffffff" stroke="none"/>
  <text x="438" y="150" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle">board link (SPI, DMA)</text>
  <text x="438" y="164" font-size="8" fill="#4A5568" text-anchor="middle">CRC · seq · expiry</text>

  <!-- AP-side trajectory planner (plans against latched lease) -->
  <rect x="20" y="290" width="240" height="72" rx="3" fill="#F6EDE4" stroke="#B87333" stroke-width="1.3"/>
  <text x="140" y="320" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">trajectory planner</text>
  <text x="140" y="337" font-size="8.5" fill="#4A5568" text-anchor="middle">plans continuous path against lease</text>

  <!-- MCU: mailbox, permission path, latched lease, trajectory admission, drives -->
  <rect x="492" y="172" width="124" height="34" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="554" y="186" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">mailbox</text>
  <text x="554" y="199" font-size="8" fill="#4A5568" text-anchor="middle">MCU SRAM, double buffer</text>
  <line x1="554" y1="206" x2="554" y2="220" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <rect x="492" y="222" width="124" height="36" rx="3" fill="#E6EEEB" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="554" y="237" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">permission path</text>
  <text x="554" y="251" font-size="8" fill="#1A4D3E" text-anchor="middle">1 kHz tick · intent gates</text>
  <line x1="554" y1="258" x2="554" y2="274" stroke="#1A4D3E" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <rect x="492" y="276" width="124" height="36" rx="3" fill="#E6EEEB" stroke="#1A4D3E" stroke-width="1.3"/>
  <text x="554" y="291" font-size="9" font-weight="700" fill="#1A202C" text-anchor="middle">latched intent lease</text>
  <text x="554" y="305" font-size="7.8" fill="#1A4D3E" text-anchor="middle">MCU SRAM · digest · ceilings</text>
  <line x1="554" y1="312" x2="554" y2="328" stroke="#1A4D3E" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="560" y="323" font-size="7.5" fill="#1A4D3E">bounds</text>

  <!-- Echoed lease digest & ceilings back to AP trajectory planner -->
  <line x1="492" y1="302" x2="262" y2="302" stroke="#1A4D3E" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <rect x="304" y="286" width="136" height="13" rx="2" fill="#ffffff" stroke="none"/>
  <text x="372" y="296" font-size="8" font-weight="700" fill="#1A4D3E" text-anchor="middle">echoed digest, ceilings</text>

  <!-- Trajectory proposal from AP planner to MCU trajectory admission -->
  <line x1="260" y1="347" x2="490" y2="347" stroke="#B87333" stroke-width="1.3" marker-end="url(#arr-bronze)"/>
  <rect x="316" y="331" width="112" height="13" rx="2" fill="#ffffff" stroke="none"/>
  <text x="372" y="341" font-size="8" font-weight="700" fill="#B87333" text-anchor="middle">trajectory proposal</text>

  <rect x="492" y="330" width="124" height="34" rx="3" fill="#E6EEEB" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="554" y="344" font-size="9" font-weight="700" fill="#1A202C" text-anchor="middle">trajectory admission</text>
  <text x="554" y="358" font-size="8" fill="#1A4D3E" text-anchor="middle">separate path check</text>
  <line x1="554" y1="364" x2="554" y2="378" stroke="#1A4D3E" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <rect x="509" y="380" width="90" height="26" rx="0" fill="#ffffff" stroke="#2D3748" stroke-width="1.3"/>
  <text x="554" y="397" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">joint drives</text>

  <!-- Lease timer (authority), armed by admission -->
  <rect x="492" y="80" width="124" height="46" rx="3" fill="#ECE9F3" stroke="#5B4B8A" stroke-width="1.3"/>
  <text x="554" y="99" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">lease timer</text>
  <text x="554" y="115" font-size="8.5" fill="#5B4B8A" text-anchor="middle">counts to t<tspan baseline-shift="sub" font-size="75%">intent_exp</tspan></text>
  <path d="M 616 240 L 630 240 L 630 110 L 620 110" fill="none" stroke="#5B4B8A" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="625" y="156" font-size="8" fill="#5B4B8A" text-anchor="end">arms</text>
  <path d="M 616 94 L 650 94 L 650 393 L 603 393" fill="none" stroke="#A51C30" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="662" y="244" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="middle" transform="rotate(90, 662, 244)">lease expiry → stop</text>
</svg>
