<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background-color: white;">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .sec-hdr { font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .box-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 3; }
      .box-blue { fill: #f0fdfa; stroke: #0d9488; stroke-width: 1.2; rx: 3; }
      .box-active { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.2; rx: 3; }
      .text-node { font-size: 12.5px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .text-sub { font-size: 10.5px; fill: #64748b; text-anchor: middle; }
      .text-left-sm { font-size: 11px; fill: #334155; }
      .line { stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
      .boundary { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6 5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#FFFFFF"/>
  <g transform="translate(0, -10)">

  <!-- Section 1: Multimodal Tokenization -->
  <rect x="50" y="60" width="220" height="480" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="160" y="88" class="sec-hdr" fill="#0f172a">(1) Multimodal Tokenization</text>
  
  <rect x="70" y="110" width="180" height="52" class="box-card"/>
  <text x="160" y="141" class="text-node">Vision Transformer (ViT)</text>
  
  <rect x="70" y="180" width="180" height="52" class="box-card"/>
  <text x="160" y="211" class="text-node">Language Tokenizer</text>
  
  <rect x="70" y="250" width="180" height="52" class="box-card"/>
  <text x="160" y="281" class="text-node">Proprioception Encoder</text>

  <line x1="250" y1="136" x2="330" y2="136" class="line"/>
  <line x1="250" y1="206" x2="330" y2="206" class="line"/>
  <line x1="250" y1="276" x2="330" y2="276" class="line"/>

  <!-- Section 2: Cross-attention reasoning -->
  <rect x="330" y="60" width="240" height="480" rx="4" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="450" y="88" class="sec-hdr" fill="#0f766e">(2) Cross-Attention &amp; 3D</text>
  <text x="450" y="104" class="sec-hdr" fill="#0f766e">Affordance Synthesis</text>
  
  <rect x="350" y="120" width="200" height="60" class="box-active"/>
  <text x="450" y="146" class="text-node" fill="#1d4ed8">Large VLA Backbone</text>
  <text x="450" y="164" class="text-sub">(Cross-Attention Layers)</text>
  
  <line x1="450" y1="180" x2="450" y2="210" class="line" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  
  <rect x="350" y="210" width="200" height="60" class="box-active"/>
  <text x="450" y="236" class="text-node" fill="#1d4ed8">3D Value Map Gen.</text>
  <text x="450" y="254" class="text-sub">(Affordance + Repulsion)</text>

  <line x1="450" y1="270" x2="450" y2="300" class="line" stroke="#2563eb" marker-end="url(#arrow-blue)"/>

  <rect x="350" y="300" width="200" height="60" class="box-active"/>
  <text x="450" y="326" class="text-node" fill="#1d4ed8">Intent Geometry Extractor</text>
  <text x="450" y="344" class="text-sub">(Pose + Covariance)</text>

  <line x1="550" y1="330" x2="630" y2="330" class="line" stroke="#2563eb" marker-end="url(#arrow-blue)"/>

  <!-- Section 3: Ambiguity Refusal Gate -->
  <rect x="630" y="60" width="160" height="480" rx="4" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="710" y="88" class="sec-hdr" fill="#991b1b">(3) Ambiguity</text>
  <text x="710" y="104" class="sec-hdr" fill="#991b1b">Refusal Gate</text>
  
  <rect x="640" y="290" width="140" height="76" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="710" y="318" class="text-node" fill="#991b1b">Posterior Entropy</text>
  <text x="710" y="338" class="text-node" fill="#991b1b" font-size="11.5px">H(z) &gt; H_thresh ?</text>
  
  <!-- Path Yes -->
  <line x1="710" y1="366" x2="710" y2="415" class="line" stroke="#dc2626"/>
  <text x="725" y="392" font-size="11px" font-weight="700" fill="#dc2626">Yes</text>
  <rect x="640" y="415" width="140" height="42" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="710" y="441" font-size="11.5px" font-weight="700" fill="#991b1b" text-anchor="middle">ERR_GROUNDING</text>
  
  <!-- Path No -->
  <line x1="780" y1="328" x2="860" y2="328" class="line"/>
  <text x="820" y="318" font-size="11px" font-weight="700" fill="#15803d">No</text>

  <!-- Boundary -->
  <line x1="845" y1="40" x2="845" y2="560" class="boundary"/>
  <text x="845" y="30" font-size="12px" font-weight="700" fill="#dc2626" text-anchor="middle">MPU | MCU Boundary</text>
  
  <!-- Section 4: Expiring Intent Lease -->
  <text x="925" y="88" class="sec-hdr" fill="#0f172a">(4) Expiring</text>
  <text x="925" y="104" class="sec-hdr" fill="#0f172a">Intent Lease</text>
  
  <rect x="860" y="255" width="130" height="145" rx="3" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.4"/>
  <rect x="860" y="255" width="130" height="26" rx="3" fill="#eff6ff"/>
  <text x="925" y="273" font-size="12px" font-weight="700" fill="#1e3a8a" text-anchor="middle">Lease Packet</text>
  <line x1="860" y1="281" x2="990" y2="281" stroke="#93c5fd" stroke-width="1"/>
  <g transform="translate(868, 290)">
    <text x="0" y="14" class="text-left-sm">• target: p₀, R₀</text>
    <text x="0" y="32" class="text-left-sm">• bounds: Σ, v_max</text>
    <text x="0" y="50" class="text-left-sm">• force: F_max</text>
    <text x="0" y="68" class="text-left-sm">• TTL: τ (ms)</text>
    <text x="0" y="86" class="text-left-sm">• evidence: attn_map</text>
  </g>

  <line x1="925" y1="400" x2="925" y2="440" class="line"/>
  <rect x="860" y="440" width="130" height="52" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <text x="925" y="462" class="text-node" font-size="11.5px">Deterministic</text>
  <text x="925" y="478" class="text-node" font-size="11.5px">Safety Enforcer</text>
  </g>
</svg>
