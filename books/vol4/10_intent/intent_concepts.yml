  claims:
    Grounded affordance: A request names an outcome, not a motion, and a target becomes checkable only as a feature
      pose in the base frame with approach direction, jaw aperture, and contact-wrench ceiling, each tied to dated
      sensor evidence.
    Goal set is a specification: The admissible goal set is fixed by the verified task profile from what the grasp
      can physically absorb, not estimated by the proposer, and the proposal's error envelope plus tracking reserve
      must fit inside it.
    Operators discharged by motion predicates: A symbolic operator asserts preconditions and effects it cannot verify,
      so each fact must map to a measurable motion predicate before any step that depends on it is admitted.
    Calibrated referent refusal: A detector score measures prompt match, not uniqueness, so the producer forms a
      conformal prediction set over referents and refuses with a typed reason unless exactly one candidate remains.
    Admission checks physics not meaning: Metric precision does not establish identity, so a confident wrong object
      yields a collision-free, torque-limited proposal that passes every check the safety MCU can make, and semantic
      errors need their own defense.
    Expiring intent lease: The permission side grants a target, never a path, as a lease binding goal set, affordance
      frame, predicates, ceilings, and an MCU-selected fallback to a hardware deadline at the earliest of the evidence
      horizon, the administrative lease, and the stopping deadline.
    Dynamic reachability: A target inside the static workspace is still inadmissible if the transit time at the
      speed ceiling exceeds the remaining evidence window (a handle 300 mm away needs 300 ms against a 219 ms horizon).
    Forward occupancy screening: A corridor is screened early against each tracked person's forward occupancy set,
      growing from the last measurement at the walking-speed bound, and the screening horizon decides when the planner
      should stop waiting.
    Conformal prediction: A conformal predictor returns a set of candidate answers whose threshold is calibrated
      on held-out labeled cases, keeping every candidate it cannot exclude and giving a chosen coverage rate under
      exchangeability.
    Force closure: A grasp has force closure when its contacts can resist any external wrench within the friction
      cones, which bounds stability, not the magnitude of the squeeze.
    Four handoff invariants: An intent handoff must keep spatial containment, temporal freshness, dynamic effort,
      and a certified fallback, and the admission gates check them in cost order.
    Task and motion planning: Task and motion planning certifies symbolic facts with geometric samplers, whether
      a classical planner or a language model wrote the plan.
    Grounding failure modes: Phantom, stale, ambiguous, misclassified, and dynamically unreachable targets all arrive
      in the same well-formed wire format, so each needs its own detector.
