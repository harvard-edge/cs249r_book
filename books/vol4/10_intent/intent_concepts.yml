  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.intent.affordance
      label: Grounded affordance
      teaches: Grounded affordance
      summary: An action possibility tied to a physical object, the machine's capabilities, and the conditions
        required to execute it.
      section: sec-intent-grounded-affordances
    - id: vol4.intent.goal
      label: Goal set
      teaches: Goal set is a specification
      summary: A checkable set of acceptable physical outcomes and constraints that gives the planner a
        specification to satisfy.
      section: sec-intent-grounded-affordances
    - id: vol4.intent.lease
      label: Intent lease
      teaches: Expiring intent lease
      summary: A goal proposal with an expiry and validity conditions that must still hold when motion is
        planned and admitted.
      section: sec-intent-lease
    relationships:
    - id: vol4.field.intent-affordance--intent-goal
      source: vol4.intent.affordance
      predicate: grounds
      target: vol4.intent.goal
      explanation: A task goal must be tied to a physically possible interaction for this machine rather
        than only an object label.
      conditions: Grounding remains a semantic and physical claim; downstream motion admission does not
        certify the intended meaning.
      status: draft
      evidence:
        section: sec-intent-grounded-affordances
        quote: The reach does not stay inside the arm. On the running machine a slow intent model sits above
          a fast chunk policy that proposes base velocity and arm targets together in one whole-body stream
          (@sec-brain-two-proposers). A wrong or stale mug target can steer the base as well as the wrist.
          What the permission path grants in answer to the request is therefore deliberately narrower than
          motion. It grants an intent lease (@sec-intent-lease), a record that names a target and effort
          ceilings but never a path. For the mug, the lease binds the parent belief record's digest and
          evidence epoch to a target pose in the handle's affordance frame, a goal region of spatial and
          angular tolerances around that pose, and ceilings on tool speed, acceleration, and contact wrench.
          Alongside those geometric and dynamic bounds, it records the motion predicates already validated,
          an expiration deadline on the safety controller's own clock, and the fallback that controller
          engages when the deadline passes.
    - id: vol4.field.intent-goal--motion-trajectory
      source: vol4.intent.goal
      predicate: specifies outcomes for
      target: vol4.motion.trajectory
      explanation: An acceptable physical-outcome set supplies checkable predicates for continuous motion
        planning.
      conditions: The goal specification must contain the relevant geometry, force, timing, and object-state
        constraints; planner feasibility does not prove semantic correctness.
      status: draft
      evidence:
        section: sec-intent-lease
        quote: This stage emits the **intent lease**, the eighth record in the book's sixteen-record chain.
          Authority divides cleanly between the two processors. The high-performance Application Processor
          generates an untrusted intent proposal (@tbl-10-intent-proposal-fields), while the independent,
          real-time Safety MCU validates and latches the admitted lease. By binding the admitted target
          to a verified goal set, an affordance frame, and a collection of active safety predicates, this
          latched lease strictly constrains the downstream trajectory planner before the hardware admits
          any joint motion.
    - id: vol4.field.intent-lease--intent-goal
      source: vol4.intent.lease
      predicate: expires the authority of
      target: vol4.intent.goal
      explanation: The goal proposal carries expiry and validity conditions, so a once-correct intent cannot
        silently persist after the scene changes.
      conditions: Intent validity is distinct from a low-level chunk lease; both must remain valid at their
        own handoff.
      status: draft
      evidence:
        section: sec-intent-lease
        quote: 'If a target region, an actuator effort ceiling, and an expiration deadline travel as separate
          messages across the inter-core bus, a dropped or delayed packet can leave the trajectory planner
          tracking a new pose under an old force limit or an expired evidence timestamp. For the red mug,
          upstream perception and belief filtering distill raw sensor telemetry into those three quantities:
          a target region bounded by empirical evidence, an effort ceiling on actuator output, and an explicit
          deadline after which tracking must cease. The intent lease binds them into a single, immutable
          record for downstream control. Its lineage anchors to the belief record through a SHA-256 digest,
          while its evidence timestamp maps that record''s sensor transduction epoch directly into the Safety
          MCU''s monotonic clock domain. This admitted target establishes a verified envelope for downstream
          planning, leaving trajectory generation and execution permission to subsequent safety stages.'
