  - file: fig10_real_open_vocab_grounding.jpg
    record: "Open-vocabulary zero-shot object detection and 3D bounding box prediction."
  - file: fig11_real_action_chunking_trace.png
    record: "Telemetry comparison of raw discrete predicted action chunks vs temporally ensembled smooth trajectory."
  - file: fig11_real_manipulator_trajectory.png
    record: "Measured joint position, velocity, and torque traces on industrial manipulator."
  - file: fig12_real_laser_scanner.jpg
    record: "Photograph of a SICK planar 2D laser scanner (not identified as a safety-rated model; it shows no fields). Björn Heller, Wikimedia Commons, CC BY-SA 3.0 DE; credit carried in the caption."
  - file: fig13_real_jetson_orin.jpg
    record: "Photograph of a Jetson AGX Orin Developer Kit retail box and closed vented enclosure; internal components are not visible. Auledas, CC BY 4.0, via Wikimedia Commons (local JPG re-encoded from the Commons PNG)."
  - file: fig13_real_fsd_board.jpg
    record: "Unannotated automotive controller board photograph showing two Tesla SoC packages and surrounding circuitry. Photograph by Votpuske, CC BY 4.0, via Wikimedia Commons (re-encoded copy of the Commons original). Independent rails, clocks, and failover behavior require separate evidence. The annotated variant is legacy and unreferenced."
  - file: fig14_real_teach_pendant.jpg
    record: "Front view of ABB teach pendant; rear enabling grip and wiring are not visible. Auledas, [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Teach_Pendant_ABB.JPG), CC BY-SA 4.0; local copy re-encoded. The annotated derivative is legacy and is not used in this chapter."
  - file: fig15_real_hil_avionics_testbed.jpg
    record: "Unannotated NASA Marshall avionics integration-ring photograph showing mounted electronics and harnesses. Timing and fault-injection capabilities are not established by the image; the annotated derivative is legacy and unreferenced."
  - file: fig15_real_crash_test_instrumentation.jpg
    record: "NHTSA/MGA post-test photograph of a 2018 Honda Odyssey in moving-deformable-barrier test 10132, with visible body targets and fixtures. See the [NHTSA photo record](https://www-nrd.nhtsa.dot.gov/database/VSR/SearchMedia.aspx?database=v&tstno=10132&mediatype=p&p_tstno=10132); sensor roles and sample rates are not inferred from the image."
  - file: fig16_real_autonomous_haul_truck.jpg
    record: "Roy Luck's loaded Caterpillar 785C at Kosse Mine illustrates vehicle scale and clearance, not autonomous operation or sensor/brake function. [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Caterpillar_haul_truck,_Luminant_Energy_Kosse_lignite_mine_(5556779421).jpg) records the [CC BY 2.0](https://creativecommons.org/licenses/by/2.0/) license and links the [original Flickr photograph](https://www.flickr.com/photos/royluck/5556779421/)."
  - file: fig16_real_robot_safety_cell.jpg
    record: "Industrial arm behind yellow mesh fencing; interlock rating and stopping behavior are not visible."
  - file: fig17_real_perseverance_mars_drill.jpg
    record: "NASA/JPL-Caltech/MSSS rover image showing the contact setting; protective response claims come from separate JPL documentation, not visible telemetry."
  - file: fig17_real_humanoid_disaster_rubble.jpg
    record: "Unannotated U.S. Navy public-domain image of a DARPA Robotics Challenge humanoid on a cinderblock course; no timing, torque, or foot-support guarantee inferred from pixels."
