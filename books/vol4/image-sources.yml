# Provenance of the sourced (non-schematic) images in Volume IV.
# One entry per image file: what it shows and where it came from, with its
# credit and license as recorded when the image was added. Moved here from
# the retired art manifest so attribution survives; keep it current when
# images change.
images:
  - file: fig01_real_lidar_sensor_rack.jpg
    record: "Autonomous vehicle roof sensor pod showing optical, radar, and solid-state LiDAR geometry (Steve Jurvetson, CC BY 2.0)."
  - file: fig01_three_archetypes.jpg
    record: "Photographic plate of the 3 reference machine classes: (a) Mobility (Spot), (b) Contact Manipulation (Franka Panda), (c) Cybernetic Process (Tesvolt BESS) (Wikimedia Commons, CC BY-SA 4.0)."
  - file: fig01_real_ntsb_tempe_vehicle.jpg
    record: "Official NTSB forensic crash investigation photo of the test vehicle."
  - file: fig02_real_strain_wave_gear.jpg
    record: "Authentic teardown micrograph of harmonic drive flexspline, wave generator, and circular spline."
  - file: fig02_real_broken_gear_tooth.jpg
    record: "High-magnification scanning electron micrograph of mechanical fatigue fracture in gear teeth."
  - file: fig02_real_burnt_motor_stator.jpg
    record: "Micrograph of thermal runaway and charred magnet wire insulation from sustained $I^2 R$ stall current."
  - file: fig02_real_motor_dyno_bench.jpg
    record: "Authentic motor dynamometer test fixture for measuring torque-speed and back-EMF envelopes."
  - file: fig03_real_industrial_welding.jpg
    record: "BMW Leipzig plant spot-welding workcell (KUKA 6-DoF arms, submillimeter fixtures, safety interlock cages) demonstrating the preprogrammed classical robotics paradigm (BMW Group / Wikimedia Commons, CC BY-SA 2.0 de)."
  - file: fig03_real_aloha_manipulator.png
    record: "Authentic Stanford ALOHA bimanual teleoperation and autonomous rollout setup (Zhao et al., 2023)."
  - file: fig04_real_industrial_ethercat_controller.jpg
    record: "Authentic Beckhoff/Omron industrial deterministic bus slice with sub-microsecond jitter specs."
  - file: fig04_real_motor_drive_controller.jpg
    record: "Authentic real-time motor inverter drive board showing gate driver isolation and shunt resistors."
  - file: fig04_real_teach_pendant.jpg
    record: "Authentic industrial teach pendant with 3-position deadman switch."
  - file: fig05_real_gello_teleop.png
    record: "Authentic 3D-printed GELLO passive arm teleoperation interface (Wu et al., 2023)."
  - file: fig05_real_camera_calibration.jpg
    record: "Authentic Zhang checkerboard / ChArUco multi-camera extrinsic calibration fixture."
  - file: fig06_real_diffusion_policy_architecture.png
    record: "Authentic Diffusion Policy neural network architecture diagram (Chi et al., 2023)."
  - file: fig06_real_sim2real_dactyl.jpg
    record: "Authentic OpenAI Dactyl Shadow Hand manipulating Rubik's Cube under physical domain randomization."
  - file: fig07_real_nist_test_arena.jpg
    record: "Authentic NIST ASTM E2521 standard test arena for emergency response robot mobility evaluation."
  - file: fig07_real_crash_barrier_test.jpg
    record: "Industrial mobile robot crash barrier compliance test setup."
  - file: fig08_real_sensor_suite.jpg
    record: "Authentic autonomous vehicle sensor cluster with co-located LiDAR, stereo cameras, and thermal imager."
  - file: fig08_real_lidar_pointcloud.jpg
    record: "High-density LiDAR point cloud colored by reflectance intensity and return distance."
  - file: fig08_real_rolling_shutter_skew.jpg
    record: "Authentic rolling shutter sensor distortion on high-speed rotating mechanism."
  - file: fig08_real_ntsb_williston_crash.png
