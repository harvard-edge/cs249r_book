<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="sans-serif">
    <!-- Definitions -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D3748"/>
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F407A"/>
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#A51C30"/>
        </marker>
        <!-- Gradients -->
        <linearGradient id="bg-brain" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#EBF4FF"/>
            <stop offset="100%" stop-color="#D1E3F8"/>
        </linearGradient>
        <linearGradient id="bg-nervous" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F7FAFC"/>
            <stop offset="100%" stop-color="#EDF2F7"/>
        </linearGradient>
        <linearGradient id="bg-body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFF5F5"/>
            <stop offset="100%" stop-color="#FED7D7"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="1000" height="600" fill="#FFFFFF" />
    <text x="500" y="40" font-size="24" font-weight="bold" fill="#2D3748" text-anchor="middle">The Closed Causal Loop and Epistemic Boundary Synthesis</text>

    <!-- The 3 Pillars -->
    <!-- Brain -->
    <g transform="translate(50, 100)">
        <rect width="250" height="400" fill="url(#bg-brain)" stroke="#1F407A" stroke-width="2" rx="4"/>
        <rect x="0" y="0" width="250" height="40" fill="#1F407A" rx="4"/>
        <rect x="0" y="30" width="250" height="10" fill="#1F407A"/>
        <text x="125" y="25" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BRAIN (Policy)</text>
        
        <rect x="25" y="80" width="200" height="60" fill="#FFFFFF" stroke="#1F407A" stroke-width="1" rx="2"/>
        <text x="125" y="105" font-size="14" font-weight="bold" fill="#1F407A" text-anchor="middle">Learned Perception</text>
        <text x="125" y="125" font-size="12" fill="#2D3748" text-anchor="middle">z = Φ(x)</text>

        <rect x="25" y="200" width="200" height="60" fill="#FFFFFF" stroke="#1F407A" stroke-width="1" rx="2"/>
        <text x="125" y="225" font-size="14" font-weight="bold" fill="#1F407A" text-anchor="middle">Action Planning</text>
        <text x="125" y="245" font-size="12" fill="#2D3748" text-anchor="middle">π(a|z) → u_hat</text>

        <path d="M 125 140 L 125 200" stroke="#1F407A" stroke-width="2" marker-end="url(#arrow-blue)"/>
    </g>

    <!-- Nervous System -->
    <g transform="translate(375, 100)">
        <rect width="250" height="400" fill="url(#bg-nervous)" stroke="#2D3748" stroke-width="2" rx="4"/>
        <rect x="0" y="0" width="250" height="40" fill="#2D3748" rx="4"/>
        <rect x="0" y="30" width="250" height="10" fill="#2D3748"/>
        <text x="125" y="25" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NERVOUS SYSTEM</text>
        
        <rect x="25" y="140" width="200" height="120" fill="#FFFFFF" stroke="#2D3748" stroke-width="2" rx="2" stroke-dasharray="4,2"/>
        <text x="125" y="165" font-size="14" font-weight="bold" fill="#2D3748" text-anchor="middle">Barrier Constraints</text>
        <text x="125" y="185" font-size="12" fill="#A51C30" text-anchor="middle">h(x) ≥ 0</text>
        <text x="125" y="205" font-size="12" fill="#2D3748" text-anchor="middle">d_stop(v) ≤ d_gap</text>
        <text x="125" y="225" font-size="12" fill="#2D3748" text-anchor="middle">1000 Hz Projection</text>

        <rect x="25" y="300" width="200" height="60" fill="#FFFFFF" stroke="#2D3748" stroke-width="1" rx="2"/>
        <text x="125" y="325" font-size="14" font-weight="bold" fill="#2D3748" text-anchor="middle">Current &amp; Reflexes</text>
        <text x="125" y="345" font-size="12" fill="#2D3748" text-anchor="middle">u_cmd</text>

        <path d="M 125 260 L 125 300" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <!-- Body (Physical Plant) -->
    <g transform="translate(700, 100)">
        <rect width="250" height="400" fill="url(#bg-body)" stroke="#A51C30" stroke-width="2" rx="4"/>
        <rect x="0" y="0" width="250" height="40" fill="#A51C30" rx="4"/>
        <rect x="0" y="30" width="250" height="10" fill="#A51C30"/>
        <text x="125" y="25" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BODY (Plant)</text>
        
        <rect x="25" y="80" width="200" height="60" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" rx="2"/>
        <text x="125" y="105" font-size="14" font-weight="bold" fill="#A51C30" text-anchor="middle">Actuators</text>
        <text x="125" y="125" font-size="12" fill="#2D3748" text-anchor="middle">Joule Heating</text>

        <rect x="25" y="200" width="200" height="60" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" rx="2"/>
        <text x="125" y="225" font-size="14" font-weight="bold" fill="#A51C30" text-anchor="middle">Dynamics &amp; Contact</text>
        <text x="125" y="245" font-size="12" fill="#2D3748" text-anchor="middle">F ≤ μN (Friction)</text>

        <rect x="25" y="320" width="200" height="60" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" rx="2"/>
        <text x="125" y="345" font-size="14" font-weight="bold" fill="#A51C30" text-anchor="middle">Transduction</text>
        <text x="125" y="365" font-size="12" fill="#2D3748" text-anchor="middle">Sensors → y(t)</text>

        <path d="M 125 140 L 125 200" stroke="#A51C30" stroke-width="2" marker-end="url(#arrow-red)"/>
        <path d="M 125 260 L 125 320" stroke="#A51C30" stroke-width="2" marker-end="url(#arrow-red)"/>
    </g>

    <!-- Connectors -->
    <!-- Brain to Nervous System (Proposal) -->
    <path d="M 300 230 L 375 230" stroke="#1F407A" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="337" y="220" font-size="12" font-weight="bold" fill="#1F407A" text-anchor="middle">Proposal</text>
    <text x="337" y="245" font-size="10" fill="#2D3748" text-anchor="middle">u_hat</text>
    
    <text x="337" y="160" font-size="12" font-weight="bold" fill="#A51C30" text-anchor="middle" transform="rotate(-90, 337, 160)">Causal Boundary</text>
    <line x1="337" y1="180" x2="337" y2="400" stroke="#A51C30" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Nervous System to Body (Current) -->
    <path d="M 625 330 L 700 330" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="662" y="320" font-size="12" font-weight="bold" fill="#2D3748" text-anchor="middle">Command</text>

    <!-- Body to Brain/Nervous System (Feedback) -->
    <path d="M 825 380 L 825 540 L 150 540 L 150 500" stroke="#A51C30" stroke-width="2" marker-end="url(#arrow-red)"/>
    <path d="M 150 540 L 500 540 L 500 500" stroke="#A51C30" stroke-width="2" marker-end="url(#arrow-red)"/>
    
    <text x="500" y="530" font-size="12" font-weight="bold" fill="#A51C30" text-anchor="middle">Sensor DMA Ring Buffers (y(t))</text>

</svg>
