<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Linear time scale: 1.5 px per ms. Silent proposer = 60 lease + 2 tick/bus + 20 onset = 82 ms; monitored = 2 + 20 = 22 ms. -->
  <rect x="0" y="0" width="180" height="106" fill="#ffffff"/>
  <g stroke="#ffffff" stroke-width="0.9">
    <rect x="4" y="22" width="90" height="18" fill="#5e6b73"/>
    <rect x="94" y="22" width="3" height="18" fill="#cccccc"/>
    <rect x="97" y="22" width="30" height="18" fill="#cccccc"/>
    <rect x="4" y="84" width="3" height="18" fill="#cccccc"/>
    <rect x="7" y="84" width="30" height="18" fill="#cccccc"/>
  </g>
  <text x="4" y="15" font-size="13" fill="#333333">Silent proposer</text>
  <text x="49" y="35.6" font-size="13" fill="#ffffff" text-anchor="middle">60</text>
  <text x="112" y="35.6" font-size="13" fill="#333333" text-anchor="middle">20</text>
  <text x="132" y="36" font-size="14" font-weight="bold" fill="#5e6b73">82 ms</text>
  <text x="49" y="55" font-size="12" fill="#333333" text-anchor="middle">Lease</text>
  <text x="112" y="55" font-size="12" fill="#333333" text-anchor="middle">Onset</text>
  <text x="4" y="77" font-size="13" fill="#333333">Monitored premise</text>
  <text x="22" y="97.6" font-size="13" fill="#333333" text-anchor="middle">20</text>
  <text x="42" y="98" font-size="14" font-weight="bold" fill="#5e6b73">22 ms</text>
</svg>
