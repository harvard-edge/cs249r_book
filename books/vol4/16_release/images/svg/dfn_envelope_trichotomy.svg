<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 196" role="img" aria-label="Three envelope-membership states. Known-true permits tracking. Evidence loss leads to unknown; a measured breach leads to known-false. Unknown and known-false both set permit to zero and select a validated stop or hold." font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tri-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9Z" fill="#4A5568"/></marker>
    <marker id="tri-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9Z" fill="#A51C30"/></marker>
  </defs>
  <rect width="680" height="196" fill="#ffffff"/>

  <!-- Known-true -> known-false over the top -->
  <path d="M115 50 V28 H565 V48" fill="none" stroke="#A51C30" stroke-width="1.3" marker-end="url(#tri-red)"/>
  <rect x="270" y="20" width="140" height="16" fill="#ffffff"/>
  <text x="340" y="32" text-anchor="middle" font-size="9" fill="#A51C30">boundary breach measured</text>

  <!-- KNOWN-TRUE -->
  <rect x="30" y="50" width="170" height="80" rx="3" fill="#EEF7F8" stroke="#007A87" stroke-width="1.3"/>
  <text x="115" y="70" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#007A87">KNOWN-TRUE</text>
  <text x="115" y="90" text-anchor="middle" font-size="9" fill="#1A202C">qualified uncertainty set</text>
  <text x="115" y="103" text-anchor="middle" font-size="9" fill="#1A202C">inside the envelope</text>
  <text x="115" y="120" text-anchor="middle" font-size="9" fill="#4A5568">fresh, verified evidence</text>

  <!-- Known-true -> unknown -->
  <line x1="200" y1="90" x2="253" y2="90" stroke="#4A5568" stroke-width="1.3" marker-end="url(#tri-ink)"/>
  <text x="227" y="80" text-anchor="middle" font-size="9" fill="#4A5568">evidence</text>
  <text x="227" y="106" text-anchor="middle" font-size="9" fill="#4A5568">lost</text>

  <!-- UNKNOWN -->
  <rect x="255" y="50" width="170" height="80" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.3" stroke-dasharray="2,2.5"/>
  <text x="340" y="70" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4A5568">UNKNOWN</text>
  <text x="340" y="90" text-anchor="middle" font-size="9" fill="#1A202C">epistemic gap</text>
  <text x="340" y="107" text-anchor="middle" font-size="9" fill="#4A5568">dropout · CRC mismatch ·</text>
  <text x="340" y="120" text-anchor="middle" font-size="9" fill="#4A5568">estimator divergence</text>

  <!-- KNOWN-FALSE -->
  <rect x="480" y="50" width="170" height="80" rx="3" fill="#FBEEF0" stroke="#A51C30" stroke-width="1.3"/>
  <text x="565" y="70" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#A51C30">KNOWN-FALSE</text>
  <text x="565" y="90" text-anchor="middle" font-size="9" fill="#1A202C">measured boundary breach</text>
  <text x="565" y="112" text-anchor="middle" font-size="9" fill="#4A5568">e.g., |<tspan font-style="italic">e</tspan>| &gt; <tspan font-style="italic">ε</tspan><tspan font-size="7" dy="2.5">track</tspan></text>

  <!-- Brackets -->
  <path d="M30 140 V148 H200 V140" fill="none" stroke="#007A87" stroke-width="1.2"/>
  <text x="115" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1A202C">permit = 1</text>
  <text x="115" y="180" text-anchor="middle" font-size="9" fill="#4A5568">tracking may continue</text>

  <path d="M255 140 V148 H650 V140" fill="none" stroke="#A51C30" stroke-width="1.2"/>
  <text x="452" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1A202C">permit = 0 · validated stop or hold</text>
  <text x="452" y="180" text-anchor="middle" font-size="9" fill="#4A5568">logged causes stay distinct</text>
</svg>
