<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-hazard" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#c44"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Header -->
  <text x="20" y="19" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10px" font-weight="bold" fill="#1e293b" letter-spacing="0.2">RUNTIME ENVELOPE TRICHOTOMY &amp; EPISTEMIC COLLAPSE</text>
  <text x="20" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8px" fill="#64748b">In Physical AI, unobserved momentum makes epistemic uncertainty strictly equivalent to a boundary breach</text>

  <!-- State 1: KNOWN-TRUE -->
  <g transform="translate(20, 38)">
    <rect width="132" height="74" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <rect x="8" y="8" width="76" height="16" rx="8" fill="#3d9e5a"/>
    <text x="46" y="19" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8px" font-weight="bold" fill="#ffffff" text-anchor="middle">KNOWN-TRUE</text>
    
    <text x="8" y="35" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8px" font-weight="bold" fill="#14532d">Verified Nominal Set C</text>
    <text x="8" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" fill="#14532d">σ² ≤ σ²_max · Fresh data</text>
    
    <rect x="8" y="53" width="116" height="14" rx="2" fill="#ffffff" stroke="#3d9e5a" stroke-width="0.5"/>
    <text x="66" y="63.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#14532d" text-anchor="middle">Permit_gate = 1 · OPERATE</text>
  </g>

  <!-- Arrow 1: Normal to Unknown -->
  <path d="M 152 71 H 198" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arrow-neutral)"/>
  <text x="175" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7px" fill="#64748b" text-anchor="middle">Sensor loss</text>
  <text x="175" y="83" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7px" fill="#64748b" text-anchor="middle">or bus jitter</text>

  <!-- State 2: UNKNOWN -->
  <g transform="translate(200, 38)">
    <rect width="140" height="74" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <rect x="8" y="8" width="68" height="16" rx="8" fill="#c87b2a"/>
    <text x="42" y="19" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8px" font-weight="bold" fill="#ffffff" text-anchor="middle">UNKNOWN</text>
    
    <text x="8" y="35" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8px" font-weight="bold" fill="#78350f">Epistemic Gap (Blind)</text>
    <text x="8" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" fill="#78350f">Covariance σ² &gt; σ²_max</text>
    
    <rect x="8" y="53" width="124" height="14" rx="2" fill="#ffffff" stroke="#c87b2a" stroke-width="0.5"/>
    <text x="70" y="63.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#78350f" text-anchor="middle">Mass moves unmonitored</text>
  </g>

  <!-- Arrow 2: Unknown to Known-False (Strict Epistemic Collapse) -->
  <path d="M 340 71 H 386" stroke="#c44" stroke-width="1.5" fill="none" marker-end="url(#arrow-hazard)"/>
  <text x="363" y="61" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7px" font-weight="bold" fill="#c44" text-anchor="middle">Strict</text>
  <text x="363" y="83" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7px" font-weight="bold" fill="#c44" text-anchor="middle">Collapse</text>

  <!-- State 3: KNOWN-FALSE -->
  <g transform="translate(388, 38)">
    <rect width="132" height="74" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <rect x="8" y="8" width="80" height="16" rx="8" fill="#c44"/>
    <text x="48" y="19" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8px" font-weight="bold" fill="#ffffff" text-anchor="middle">KNOWN-FALSE</text>
    
    <text x="8" y="35" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8px" font-weight="bold" fill="#7f1d1d">Hardware Refusal</text>
    <text x="8" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" fill="#7f1d1d">Breach OR Epistemic gap</text>
    
    <rect x="8" y="53" width="116" height="14" rx="2" fill="#7f1d1d"/>
    <text x="66" y="63.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">Permit_gate = 0 · STOP</text>
  </g>

  <!-- Bottom Comparison Card -->
  <g transform="translate(20, 120)">
    <rect width="500" height="44" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    
    <circle cx="12" cy="15" r="3" fill="#94a3b8"/>
    <text x="20" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#64748b">Software Fallacy:</text>
    <text x="135" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" fill="#475569">is_safe == (!fault) treats telemetry drops as benign → frozen commands risk collision</text>
    
    <circle cx="12" cy="30" r="3" fill="#c44"/>
    <text x="20" y="33" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#c44">Physical Invariant:</text>
    <text x="135" y="33" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#1e293b">UNKNOWN ≡ KNOWN-FALSE → Hardware interlock instantly cuts inverter power and drops brakes</text>
  </g>
</svg>