<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 490" width="1060" height="490">
  <defs>
    <style>
      .card-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .manifest-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .label-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #475569; }
      .mono-val { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; fill: #0f172a; }
      .subcard-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .subcard-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .interlock-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .interlock-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #fef2f2; }
      .conn-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #2563eb; }
      .red-alert { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; fill: #dc2626; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="490" fill="#ffffff"/>

  <!-- Connecting Arrows Between Main Cards with 75px clean gaps -->
  <!-- Card 1 -> Card 2 -->
  <line x1="315" y1="235" x2="383" y2="235" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="325" y="210" width="54" height="20" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="352" y="224" class="conn-label" text-anchor="middle">Verifies</text>

  <!-- Card 2 -> Card 3 -->
  <line x1="675" y1="235" x2="743" y2="235" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="686" y="210" width="52" height="20" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="712" y="224" class="conn-label" text-anchor="middle">Permits</text>

  <!-- ================= CARD 1: Cryptographic Release Record ================= -->
  <g transform="translate(30, 45)">
    <rect width="285" height="395" rx="4" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="285" height="28" rx="4" fill="#1e3a8a"/>
    <rect width="285" height="6" y="22" fill="#1e3a8a"/>
    <text x="14" y="19" class="card-title">1. Cryptographic Release Record</text>

    <!-- Inner Manifest Details -->
    <text x="14" y="52" class="manifest-title">Immutable Engineering Manifest</text>

    <!-- Key-Value Table -->
    <g transform="translate(14, 62)">
      <text x="0" y="18" class="label-text">Claim ID:</text>
      <text x="135" y="18" class="mono-val">req-tactile-09</text>

      <text x="0" y="42" class="label-text">GSN Topology Hash:</text>
      <text x="135" y="42" class="mono-val">0x8F4A...D21C</text>

      <text x="0" y="66" class="label-text">Evidence Pointers:</text>
      <text x="135" y="66" class="mono-val">verified_trace_12</text>

      <text x="0" y="90" class="label-text">Policy Weights:</text>
      <text x="135" y="90" class="mono-val">0x3B9C...11EF</text>

      <text x="0" y="114" class="label-text">FPGA Bitstream:</text>
      <text x="135" y="114" class="mono-val">0xA11F...402B</text>

      <text x="0" y="138" class="label-text">RTOS Kernel:</text>
      <text x="135" y="138" class="mono-val">0x77C1...99AA</text>
    </g>

    <!-- Adjudicator Signature Box -->
    <g transform="translate(14, 235)">
      <rect width="257" height="42" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="128.5" y="26" class="subcard-title" fill="#0f172a" text-anchor="middle">Adjudicator Signature: VALID</text>
    </g>
  </g>

  <!-- ================= CARD 2: Hardware Root of Trust ================= -->
  <g transform="translate(390, 45)">
    <rect width="285" height="395" rx="4" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="285" height="28" rx="4" fill="#1e3a8a"/>
    <rect width="285" height="6" y="22" fill="#1e3a8a"/>
    <text x="14" y="19" class="card-title">2. Hardware Root of Trust</text>

    <!-- Subcard 1: Silicon OTP eFuses -->
    <g transform="translate(14, 45)">
      <rect width="257" height="42" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="128.5" y="26" class="subcard-title" text-anchor="middle">Silicon OTP eFuses (Keys)</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="142.5" y1="87" x2="142.5" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Subcard 2: Bootloader Verification -->
    <g transform="translate(14, 115)">
      <rect width="257" height="64" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="128.5" y="22" class="subcard-title" text-anchor="middle">Bootloader Verification</text>
      <text x="128.5" y="40" class="subcard-text" text-anchor="middle">Validates hashes &amp; signatures</text>
      <text x="128.5" y="54" class="subcard-text" text-anchor="middle">against eFuse public keys</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="142.5" y1="179" x2="142.5" y2="202" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Subcard 3: Energize Motor Inverters -->
    <g transform="translate(14, 207)">
      <rect width="257" height="52" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
      <text x="128.5" y="22" class="subcard-title" fill="#065f46" text-anchor="middle">Energize Motor Inverters</text>
      <text x="128.5" y="40" class="subcard-text" fill="#047857" font-weight="600" text-anchor="middle">(Hardware Permit Asserted)</text>
    </g>
  </g>

  <!-- ================= CARD 3: Runtime Nervous System ================= -->
  <g transform="translate(750, 45)">
    <rect width="285" height="395" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="285" height="28" rx="4" fill="#dc2626"/>
    <rect width="285" height="6" y="22" fill="#dc2626"/>
    <text x="14" y="19" class="card-title">3. Runtime Nervous System</text>

    <!-- Monitor Header -->
    <text x="14" y="52" class="manifest-title" fill="#991b1b">Continuous Envelope Monitor</text>
    <text x="14" y="70" class="label-text" fill="#7f1d1d">1000 Hz Hard Real-Time Loop</text>

    <!-- Subcard 1: Envelope Trichotomy Eval -->
    <g transform="translate(14, 85)">
      <rect width="257" height="74" rx="3" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
      <text x="14" y="22" class="subcard-title">Envelope Trichotomy Eval</text>
      <text x="14" y="44" class="subcard-text" fill="#16a34a" font-weight="600">✓ Known-True (Permitted)</text>
      <text x="14" y="62" class="subcard-text" fill="#dc2626" font-weight="600">✗ Known-False / Unknown</text>
    </g>

    <!-- Connector with Centered Badge: ZERO BLEEDING -->
    <line x1="142.5" y1="159" x2="142.5" y2="197" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <rect x="47.5" y="171" width="190" height="20" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
    <text x="142.5" y="185" class="red-alert" text-anchor="middle">Violation / Epistemic Gap</text>

    <!-- Subcard 2: LATCH INTERLOCKS -->
    <g transform="translate(14, 202)">
      <rect width="257" height="64" rx="3" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <text x="128.5" y="27" class="interlock-title" text-anchor="middle">LATCH INTERLOCKS</text>
      <text x="128.5" y="47" class="interlock-sub" text-anchor="middle">Revoke Operating Authority</text>
    </g>
  </g>
</svg>