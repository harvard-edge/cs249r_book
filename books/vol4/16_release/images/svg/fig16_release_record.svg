<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" role="img" aria-label="Fail-closed release gate: a signed release case is authenticated, then its physical standing is checked. Failures lead to REFUSE; valid cases lead to UNCOND or COND; stale calibration needs a separately signed COND case." font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="rr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9Z" fill="#4A5568"/></marker>
    <marker id="rr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9Z" fill="#A51C30"/></marker>
  </defs>
  <rect width="680" height="356" fill="#ffffff"/>

  <!-- Row 1: signed case, authentication, physical standing -->
  <rect x="20" y="20" width="190" height="58" rx="3" fill="#F5F3FA" stroke="#5B4B8A" stroke-width="1.3"/>
  <text x="115" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Signed release case</text>
  <text x="115" y="62" text-anchor="middle" font-size="9.5" fill="#4A5568">verdict · limits · evidence root · expiry</text>

  <rect x="245" y="20" width="190" height="58" rx="3" fill="#F8FAFC" stroke="#1A4D3E" stroke-width="1.3"/>
  <text x="340" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Authenticate</text>
  <text x="340" y="62" text-anchor="middle" font-size="9.5" fill="#4A5568">key chain · images · fault records</text>

  <rect x="470" y="20" width="190" height="58" rx="3" fill="#EEF7F8" stroke="#007A87" stroke-width="1.3"/>
  <text x="565" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A202C">Check physical standing</text>
  <text x="565" y="62" text-anchor="middle" font-size="9.5" fill="#4A5568">calibration · brakes · envelope · age</text>

  <line x1="210" y1="49" x2="243" y2="49" stroke="#4A5568" stroke-width="1.3" marker-end="url(#rr-ink)"/>
  <line x1="435" y1="49" x2="468" y2="49" stroke="#4A5568" stroke-width="1.3" marker-end="url(#rr-ink)"/>

  <!-- Authentication fails: straight down to REFUSE -->
  <line x1="265" y1="78" x2="265" y2="288" stroke="#A51C30" stroke-width="1.3" marker-end="url(#rr-red)"/>
  <text x="257" y="176" text-anchor="end" font-size="9" fill="#A51C30">authentication fails</text>
  <text x="257" y="188" text-anchor="end" font-size="9" fill="#4A5568">key, image, or fault-record</text>
  <text x="257" y="199" text-anchor="end" font-size="9" fill="#4A5568">mismatch, or expired case</text>

  <!-- Stale-calibration branch -->
  <path d="M490 78 V145 H437" fill="none" stroke="#4A5568" stroke-width="1.3" marker-end="url(#rr-ink)"/>
  <text x="462" y="126" text-anchor="middle" font-size="9" fill="#4A5568">calibration</text>
  <text x="462" y="137" text-anchor="middle" font-size="9" fill="#4A5568">stale</text>

  <rect x="290" y="120" width="145" height="50" rx="3" fill="#F8FAFC" stroke="#1A4D3E" stroke-width="1.3"/>
  <text x="362" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1A202C">Separately signed</text>
  <text x="362" y="156" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1A202C">COND covers it?</text>

  <!-- D: no -> REFUSE, yes -> COND -->
  <line x1="300" y1="170" x2="300" y2="288" stroke="#A51C30" stroke-width="1.3" marker-end="url(#rr-red)"/>
  <text x="305" y="238" font-size="9" fill="#A51C30">no</text>
  <line x1="370" y1="170" x2="370" y2="203" stroke="#4A5568" stroke-width="1.3" marker-end="url(#rr-ink)"/>
  <text x="364" y="193" text-anchor="end" font-size="9" fill="#4A5568">yes</text>

  <!-- All valid: to UNCOND or COND by the signed case -->
  <line x1="565" y1="78" x2="565" y2="203" stroke="#4A5568" stroke-width="1.3" marker-end="url(#rr-ink)"/>
  <path d="M565 185 H400 V203" fill="none" stroke="#4A5568" stroke-width="1.3" marker-end="url(#rr-ink)"/>
  <text x="560" y="104" text-anchor="end" font-size="9" fill="#4A5568">all valid</text>
  <text x="560" y="115" text-anchor="end" font-size="9" fill="#4A5568">and current</text>
  <text x="482" y="180" text-anchor="middle" font-size="9" fill="#4A5568">COND signed</text>
  <text x="572" y="198" font-size="9" fill="#4A5568">UNCOND</text>

  <!-- Premise false or unknown: down to REFUSE -->
  <line x1="640" y1="78" x2="640" y2="288" stroke="#A51C30" stroke-width="1.3" marker-end="url(#rr-red)"/>
  <text x="634" y="140" text-anchor="end" font-size="9" fill="#A51C30">premise false</text>
  <text x="634" y="151" text-anchor="end" font-size="9" fill="#A51C30">or unknown</text>

  <!-- Outcomes -->
  <rect x="330" y="205" width="130" height="54" rx="3" fill="#EEF4F2" stroke="#1A4D3E" stroke-width="1.3"/>
  <text x="395" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A4D3E">COND</text>
  <text x="395" y="242" text-anchor="middle" font-size="9" fill="#4A5568">signed restricted</text>
  <text x="395" y="253" text-anchor="middle" font-size="9" fill="#4A5568">envelope</text>

  <rect x="490" y="205" width="130" height="54" rx="3" fill="#EEF4F2" stroke="#1A4D3E" stroke-width="1.3"/>
  <text x="555" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A4D3E">UNCOND</text>
  <text x="555" y="242" text-anchor="middle" font-size="9" fill="#4A5568">full envelope</text>

  <text x="475" y="276" text-anchor="middle" font-size="9" fill="#4A5568">each proposed action still checked by the permission path</text>

  <!-- REFUSE bar -->
  <rect x="20" y="290" width="640" height="46" rx="3" fill="#FBEEF0" stroke="#A51C30" stroke-width="1.3"/>
  <text x="130" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#A51C30">REFUSE · permit off</text>
  <text x="130" y="326" text-anchor="middle" font-size="9.5" fill="#4A5568">assessed stop or hold</text>
</svg>
