<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="920" height="320" fill="#ffffff"/>

  <!-- ================= STAGE 1: RELEASE MANIFEST ================= -->
  <rect x="45" y="45" width="220" height="76" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Release Manifest</text>
  <text x="155" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Signed Hashes &amp; Evidence</text>

  <!-- Connector: Stage 1 -> Stage 2 -->
  <line x1="265" y1="83" x2="342" y2="83" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="303" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b">Boot Audit</text>

  <!-- ================= STAGE 2: HARDWARE ROOT OF TRUST ================= -->
  <rect x="350" y="45" width="220" height="76" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="460" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065f46">Hardware Root of Trust</text>
  <text x="460" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#047857">OTP eFuse Verification</text>

  <!-- Connector: Stage 2 -> Stage 3 -->
  <line x1="570" y1="83" x2="647" y2="83" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="608" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b">Active Permit</text>

  <!-- ================= STAGE 3: RUNTIME SAFETY ENFORCER ================= -->
  <rect x="655" y="45" width="220" height="76" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="765" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400e">Runtime Safety Enforcer</text>
  <text x="765" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#b45309">Envelope Trichotomy Loop</text>

  <!-- ================= LOWER LEVEL: GATING & INTERLOCK ================= -->
  <!-- Connector: Stage 2 -> Energize Inverters -->
  <line x1="460" y1="121" x2="460" y2="202" stroke="#10b981" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="475" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#059669">Valid</text>

  <!-- Energize Inverters Capsule -->
  <rect x="360" y="208" width="200" height="56" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="460" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Energize Inverters</text>

  <!-- Connector: Stage 3 -> Trip Interlock Relay -->
  <line x1="765" y1="121" x2="765" y2="202" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="780" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">Violation</text>

  <!-- Trip Interlock Relay Capsule -->
  <rect x="665" y="208" width="200" height="56" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="765" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Trip Interlock Relay</text>

  <!-- Inhibit / Revoke Power Line -->
  <line x1="665" y1="236" x2="568" y2="236" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  <text x="616" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#dc2626">Revoke Power</text>
</svg>