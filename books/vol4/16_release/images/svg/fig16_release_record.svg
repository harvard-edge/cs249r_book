<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 238" role="img" aria-label="Signed release manifest passes key and ledger authentication, then standing-condition checks, before a limited permit. Failed authentication or standing checks lead to refusal and a validated fallback." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-46.0" y="-11.9" width="1012.0" height="261.8" fill="#ffffff"/>
  <defs><marker id="arrow16" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9Z" fill="#475569"/></marker></defs>
  <rect width="920" height="238" fill="#ffffff"/>
  <g transform="translate(0,-30)">
  <rect x="25" y="52" width="245" height="79" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="147" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Signed release case</text>
  <text x="147" y="105" text-anchor="middle" font-size="11" fill="#334155">Verdict · limits · evidence root · expiry</text>
  <line x1="270" y1="91" x2="332" y2="91" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow16)"/>
  <rect x="338" y="52" width="245" height="79" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="460" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Authenticate</text>
  <text x="460" y="105" text-anchor="middle" font-size="11" fill="#334155">Key chain · images · full fault ledger</text>
  <line x1="583" y1="91" x2="645" y2="91" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow16)"/>
  <rect x="652" y="52" width="245" height="79" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="774" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Check physical standing</text>
  <text x="774" y="105" text-anchor="middle" font-size="11" fill="#334155">Calibration · brakes · ODD · age</text>
  <line x1="774" y1="131" x2="774" y2="178" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow16)"/>
  <text x="787" y="158" font-size="11" fill="#166534">All valid</text>
  <rect x="652" y="184" width="245" height="65" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="774" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">UNCOND or COND</text>
  <text x="774" y="231" text-anchor="middle" font-size="11" fill="#334155">Signed envelope; per-action enforcer</text>
  <rect x="338" y="184" width="245" height="65" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="460" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">REFUSE · permit off</text>
  <text x="460" y="231" text-anchor="middle" font-size="11" fill="#334155">Use assessed stop or hold</text>
  <path d="M460 131 V178" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow16)"/>
  <text x="474" y="158" font-size="11" fill="#991b1b">Auth fails</text>
  <path d="M652 118 H610 V216 H590" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow16)"/>
  <text x="616" y="174" font-size="10" fill="#991b1b" text-anchor="start">Premise false/unknown</text>
  </g>
</svg>
