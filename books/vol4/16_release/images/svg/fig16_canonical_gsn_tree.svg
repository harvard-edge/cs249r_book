<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 680" width="100%" height="100%">
  <defs>
    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arr-navy" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Background -->
  <rect width="1140" height="680" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header & Attribution -->
  <text x="28" y="32" class="font-sans" font-size="16" font-weight="700" fill="#0f172a">Goal Structuring Notation (GSN) Safety Assurance Argument Tree</text>
  <text x="1112" y="32" text-anchor="end" class="font-sans" font-size="12" font-weight="500" fill="#64748b">Tactile Workstation Case Study; adapted from Kelly (1998) &amp; Toulmin (1958)</text>
  <line x1="28" y1="46" x2="1112" y2="46" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ================================================================================= -->
  <!-- LEVEL 1: TOP-LEVEL GOAL G1 & CONTEXT C1 -->
  <!-- ================================================================================= -->
  <!-- Context C1 (Rounded rectangle, top left) -->
  <g transform="translate(110, 64)">
    <rect width="210" height="64" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="12" y="20" class="font-mono" font-size="10" font-weight="700" fill="#475569">CONTEXT C1</text>
    <text x="12" y="36" class="font-sans" font-size="9" fill="#334155">ISO/TS 15066 Biomechanical</text>
    <text x="12" y="50" class="font-sans" font-size="9" fill="#334155">Transient Contact Pain Limits</text>
  </g>
  <line x1="320" y1="96" x2="360" y2="96" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Goal G1 (Rectangle, center) -->
  <g transform="translate(360, 56)">
    <rect width="460" height="78" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="460" height="24" rx="6" fill="#1e40af"/>
    <rect y="16" width="460" height="8" fill="#1e40af"/>
    <text x="14" y="16" class="font-mono" font-size="11" font-weight="700" fill="#ffffff">GOAL G1: TOP-LEVEL OPERATIONAL SAFETY</text>
    
    <text x="14" y="44" class="font-sans" font-size="10.5" font-weight="700" fill="#1e3a8a">
      Normal contact force F_norm ≤ 50 N and shear force F_shear ≤ 20 N
    </text>
    <text x="14" y="62" class="font-sans" font-size="9.5" fill="#334155">
      Maintained across all operational states, model misclassifications, and single-point faults.
    </text>
  </g>

  <!-- Branching Lines from G1 to Strategies -->
  <path d="M 590 134 L 590 152" stroke="#1e3a8a" stroke-width="1.5"/>
  <path d="M 215 152 L 955 152" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="215" y1="152" x2="215" y2="170" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arr-navy)"/>
  <line x1="590" y1="152" x2="590" y2="170" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arr-navy)"/>
  <line x1="955" y1="152" x2="955" y2="170" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arr-navy)"/>

  <!-- ================================================================================= -->
  <!-- LEVEL 2: STRATEGIES S1.1, S1.2, S1.3 (PARALLELOGRAMS) -->
  <!-- ================================================================================= -->

  <!-- Strategy S1.1 -->
  <g transform="translate(65, 172)">
    <polygon points="20,0 310,0 290,66 0,66" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="28" y="20" class="font-mono" font-size="10" font-weight="700" fill="#6d28d9">STRATEGY S1.1</text>
    <text x="24" y="38" class="font-sans" font-size="9.5" fill="#4c1d95">Argue via soft optical-tactile</text>
    <text x="20" y="52" class="font-sans" font-size="9.5" fill="#4c1d95">slip detection &amp; reactive reflex braking</text>
  </g>

  <!-- Strategy S1.2 -->
  <g transform="translate(440, 172)">
    <polygon points="20,0 310,0 290,66 0,66" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="28" y="20" class="font-mono" font-size="10" font-weight="700" fill="#6d28d9">STRATEGY S1.2</text>
    <text x="24" y="38" class="font-sans" font-size="9.5" fill="#4c1d95">Argue via secondary motor current</text>
    <text x="20" y="52" class="font-sans" font-size="9.5" fill="#4c1d95">over-torque tripwire in servo drives</text>
  </g>

  <!-- Strategy S1.3 -->
  <g transform="translate(815, 172)">
    <polygon points="20,0 300,0 280,66 0,66" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="28" y="20" class="font-mono" font-size="10" font-weight="700" fill="#6d28d9">STRATEGY S1.3</text>
    <text x="24" y="38" class="font-sans" font-size="9.5" fill="#4c1d95">Argue via deterministic bare-metal</text>
    <text x="20" y="52" class="font-sans" font-size="9.5" fill="#4c1d95">safety enforcer loop WCET latency</text>
  </g>

  <!-- Lines from Strategies to Goals -->
  <line x1="210" y1="238" x2="210" y2="260" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arr-navy)"/>
  <line x1="590" y1="238" x2="590" y2="260" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arr-navy)"/>
  <line x1="960" y1="238" x2="960" y2="260" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arr-navy)"/>

  <!-- ================================================================================= -->
  <!-- LEVEL 3: SUB-GOALS G1.1, G1.2, G1.3 (RECTANGLES) -->
  <!-- ================================================================================= -->

  <!-- Goal G1.1 -->
  <g transform="translate(55, 262)">
    <rect width="310" height="88" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="310" height="22" rx="6" fill="#dbeafe"/>
    <rect y="16" width="310" height="6" fill="#dbeafe"/>
    <text x="12" y="16" class="font-mono" font-size="10" font-weight="700" fill="#1e40af">GOAL G1.1: TACTILE REFLEX HALT</text>
    <text x="12" y="40" class="font-sans" font-size="9.5" fill="#334155">Elastomer compression + 12 ms inference</text>
    <text x="12" y="54" class="font-sans" font-size="9.5" fill="#334155">+ 13 ms braking halts arm in 9 mm stroke.</text>
    <text x="12" y="72" class="font-mono" font-size="9.5" font-weight="700" fill="#059669">Nominal Peak Force: 36 N ≤ 50 N</text>
  </g>

  <!-- Goal G1.2 -->
  <g transform="translate(435, 262)">
    <rect width="310" height="88" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="310" height="22" rx="6" fill="#dbeafe"/>
    <rect y="16" width="310" height="6" fill="#dbeafe"/>
    <text x="12" y="16" class="font-mono" font-size="10" font-weight="700" fill="#1e40af">GOAL G1.2: SECONDARY TORQUE TRIPWIRE</text>
    <text x="12" y="40" class="font-sans" font-size="9.5" fill="#334155">Servo drive trips at F_trip = 35 N.</text>
    <text x="12" y="54" class="font-sans" font-size="9.5" fill="#334155">Braking deceleration arrests moving mass</text>
    <text x="12" y="72" class="font-mono" font-size="9.5" font-weight="700" fill="#dc2626">Unmitigated Peak: 88 N &gt; 50 N (FAIL!)</text>
  </g>

  <!-- Goal G1.3 -->
  <g transform="translate(805, 262)">
    <rect width="300" height="88" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="300" height="22" rx="6" fill="#dbeafe"/>
    <rect y="16" width="300" height="6" fill="#dbeafe"/>
    <text x="12" y="16" class="font-mono" font-size="10" font-weight="700" fill="#1e40af">GOAL G1.3: DETERMINISTIC EXECUTION</text>
    <text x="12" y="40" class="font-sans" font-size="9.5" fill="#334155">Nervous system runs at 1000 Hz on MCU.</text>
    <text x="12" y="54" class="font-sans" font-size="9.5" fill="#334155">Worst-case loop time bounded at &lt; 2.0 ms.</text>
    <text x="12" y="72" class="font-mono" font-size="9.5" font-weight="700" fill="#059669">Verified P99.9 WCET: 175 μs</text>
  </g>

  <!-- Lines to Evidence / Solutions / Defeater -->
  <line x1="210" y1="392" x2="210" y2="352" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="590" y1="350" x2="590" y2="390" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arr-navy)"/>
  <line x1="955" y1="350" x2="955" y2="390" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arr-navy)"/>

  <!-- ================================================================================= -->
  <!-- LEVEL 4: DEFEATER D1 & EVIDENCE SOLUTIONS -->
  <!-- ================================================================================= -->

  <!-- Defeater D1 (Hazard Card under G1.1) -->
  <g transform="translate(45, 394)">
    <rect width="330" height="118" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#cardShadow)"/>
    
    <rect x="12" y="8" width="18" height="18" rx="3" fill="#dc2626"/>
    <text x="21" y="21" text-anchor="middle" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">!</text>
    <text x="36" y="22" class="font-mono" font-size="11" font-weight="700" fill="#991b1b">DEFEATER D1: ADVERSARIAL AUDIT</text>

    <text x="12" y="44" class="font-sans" font-size="9.5" font-weight="700" fill="#b91c1c">Residual Cutting Fluid Lubrication:</text>
    <text x="12" y="58" class="font-sans" font-size="9" fill="#334155">
      Machined spline carries cutting oil: friction drops
    </text>
    <text x="12" y="70" class="font-mono" font-size="9" font-weight="600" fill="#991b1b">
      from μ = 0.85 to μ = 0.12 (86% reduction).
    </text>
    <text x="12" y="86" class="font-sans" font-size="9" fill="#334155">
      Workpiece slides over silicone pad without marker shear strain.
    </text>
    <text x="12" y="100" class="font-sans" font-size="9" font-weight="700" fill="#dc2626">
      Tactile model blind → Primary reflex fails silently!
    </text>
  </g>

  <!-- Evidence E1.2 (Solution under G1.2) -->
  <g transform="translate(425, 394)">
    <rect width="330" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="12" y="22" class="font-mono" font-size="10.5" font-weight="700" fill="#475569">SOLUTION E1.2: UNMITIGATED TEST</text>

    <text x="12" y="42" class="font-sans" font-size="9" fill="#334155">Coupled 1-DOF Indentation Dynamics:</text>
    <text x="12" y="56" class="font-sans" font-size="9" fill="#334155">• Latency drift (10 ms): F_lat = 51.0 N &gt; 50 N</text>
    <text x="12" y="70" class="font-sans" font-size="9" fill="#334155">• Idealized braking (a = 2.5 m/s²): F_peak = 71 N</text>
    <text x="12" y="84" class="font-sans" font-size="9" fill="#334155">• Rotor inertia worst-case: F_peak = 88.0 N</text>
    <text x="12" y="102" class="font-sans" font-size="9.5" font-weight="700" fill="#dc2626">Breaches 50 N ceiling by 76% → Unsafe!</text>
  </g>

  <!-- Evidence E1.3 (Solution under G1.3) -->
  <g transform="translate(795, 394)">
    <rect width="315" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="12" y="22" class="font-mono" font-size="10.5" font-weight="700" fill="#047857">SOLUTION E1.3: TIMING TRACE LOGS</text>

    <text x="12" y="42" class="font-sans" font-size="9" fill="#334155">Logic Analyzer &amp; In-Circuit Emulation:</text>
    <text x="12" y="56" class="font-sans" font-size="9" fill="#334155">• 100,000 recorded execution cycles</text>
    <text x="12" y="70" class="font-sans" font-size="9" fill="#334155">• P50 cycle duration: 112 μs</text>
    <text x="12" y="84" class="font-sans" font-size="9" fill="#334155">• P99.9 maximum latency: 175 μs</text>
    <text x="12" y="102" class="font-sans" font-size="9.5" font-weight="700" fill="#059669">Strictly bounded within 2.0 ms budget</text>
  </g>

  <!-- ================================================================================= -->
  <!-- LEVEL 5: FORMAL ADJUDICATION VERDICT BANNER -->
  <!-- ================================================================================= -->
  <g transform="translate(28, 532)">
    <rect width="1084" height="132" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="1084" height="26" rx="10" fill="#f1f5f9"/>
    <rect y="18" width="1084" height="8" fill="#f1f5f9"/>
    <line x1="0" y1="26" x2="1084" y2="26" stroke="#cbd5e1" stroke-width="1"/>

    <text x="14" y="18" class="font-sans" font-size="11" font-weight="700" fill="#334155">FORMAL SAFETY ADJUDICATION VERDICT</text>

    <!-- Refusal Card -->
    <g transform="translate(12, 34)">
      <rect width="420" height="88" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <rect x="10" y="10" width="190" height="20" rx="4" fill="#dc2626"/>
      <text x="105" y="24" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#ffffff">UNCONDITIONAL: REFUSED</text>
      <text x="10" y="48" class="font-sans" font-size="9" fill="#7f1d1d">
        • Primary tactile reflex defeated by cutting fluid (D1)
      </text>
      <text x="10" y="62" class="font-sans" font-size="9" fill="#7f1d1d">
        • Unmitigated secondary tripwire yields 88 N &gt; 50 N
      </text>
      <text x="10" y="76" class="font-sans" font-size="9" font-weight="700" fill="#b91c1c">
        Single unexamined physical premise breaks release claim!
      </text>
    </g>

    <!-- Approval With Conditions Card -->
    <g transform="translate(446, 34)">
      <rect width="624" height="88" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <rect x="10" y="10" width="220" height="20" rx="4" fill="#16a34a"/>
      <text x="120" y="24" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#ffffff">OPERATE WITH CONDITIONS: GRANTED</text>
      
      <text x="10" y="46" class="font-sans" font-size="8.8" fill="#166534">
        <tspan font-weight="700">Contract 1:</tspan> Payload mass capped at m ≤ 1.5 kg (limits moving kinetic energy)
      </text>
      <text x="10" y="60" class="font-sans" font-size="8.8" fill="#166534">
        <tspan font-weight="700">Contract 2:</tspan> Automated optical surface-dryness inspection rejects oily components at feeder
      </text>
      <text x="10" y="74" class="font-sans" font-size="8.8" fill="#166534">
        <tspan font-weight="700">Contract 3:</tspan> Real-time torque observer tripwire tightened to F_trip' = 18.0 N (t_lat' = 2 ms, a_brake' = 8 m/s²)
      </text>
      <text x="10" y="88" class="font-mono" font-size="9" font-weight="700" fill="#15803d">
        Restores bounded impact force F_peak' = 38.0 N ≤ 50.0 N | Contact impulse I = 1.10 N·s
      </text>
    </g>
  </g>
</svg>
