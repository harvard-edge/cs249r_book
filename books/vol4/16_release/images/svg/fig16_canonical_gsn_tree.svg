<svg xmlns="http://www.w3.org/2000/svg" viewBox="34.6 12.7 825.8 388.7" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-6.7" y="-6.7" width="908.4" height="427.6" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="900" height="410" fill="#ffffff"/>

  <!-- ================= LEVEL 1: GOAL G1 & CONTEXT C1 ================= -->
  <!-- Context C1 (GSN Oblong / Rounded Rectangle) -->
  <rect x="50" y="32" width="190" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="145" y="63" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">C1: Assessed contact case</text>

  <!-- Connector C1 to G1 -->
  <line x1="240" y1="58" x2="310" y2="58" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Goal G1 (GSN Rectangle) -->
  <rect x="310" y="28" width="280" height="60" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">G1: Proposed Contact Limit</text>
  <text x="450" y="71" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">F<tspan baseline-shift="sub" font-size="78%">norm</tspan> ≤ 50 N, F<tspan baseline-shift="sub" font-size="78%">shear</tspan> ≤ 20 N</text>

  <!-- Connector G1 to Strategy S1 -->
  <line x1="450" y1="88" x2="450" y2="120" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ================= LEVEL 2: STRATEGY S1 ================= -->
  <!-- Strategy S1 (GSN Parallelogram) -->
  <polygon points="325,120 605,120 575,168 295,168" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="450" y="149" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5b21b6">S1: Protection Layers</text>

  <!-- Branching Connector from S1 to Sub-Goals -->
  <line x1="450" y1="168" x2="450" y2="195" stroke="#334155" stroke-width="1.2"/>
  <line x1="150" y1="195" x2="750" y2="195" stroke="#334155" stroke-width="1.2"/>
  <line x1="150" y1="195" x2="150" y2="220" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="450" y1="195" x2="450" y2="220" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="750" y1="195" x2="750" y2="220" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ================= LEVEL 3: SUB-GOALS ================= -->
  <!-- Goal G1.1 (Tactile Reflex) -->
  <rect x="55" y="220" width="190" height="50" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="150" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">G1.1: Tactile Reflex</text>

  <!-- Goal G1.2 (Torque Tripwire) -->
  <rect x="355" y="220" width="190" height="50" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="450" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">G1.2: Torque Tripwire</text>

  <!-- Goal G1.3 (Enforcer WCET) -->
  <rect x="655" y="220" width="190" height="50" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="750" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">G1.3: Enforcer WCET</text>

  <!-- ================= LEVEL 4: DEFEATER & EVIDENCE ================= -->
  <!-- Defeater D1 (Counter-Goal / Red Card) -->
  <rect x="50" y="325" width="200" height="52" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="150" y="347" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#991b1b">D1: Lubricant Defeater</text>
  <text x="150" y="364" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#b91c1c">Friction Collapse (μ = 0.12)</text>

  <!-- Connector: Defeater D1 defeats Goal G1.1 (Upward dashed red arrow) -->
  <line x1="150" y1="325" x2="150" y2="276" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="162" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#dc2626">Defeats</text>

  <!-- Connector G1.2 to Evidence E1.2 -->
  <line x1="450" y1="270" x2="450" y2="313" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Solution E1.2 (GSN Circle) -->
  <circle cx="450" cy="351" r="35" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="450" y="346" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e">E1.2?</text>
  <text x="450" y="362" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#92400e">Force data</text>

  <!-- Connector G1.3 to Evidence E1.3 -->
  <line x1="750" y1="270" x2="750" y2="313" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Solution E1.3 (GSN Circle) -->
  <circle cx="750" cy="351" r="35" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="750" y="346" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e">E1.3?</text>
  <text x="750" y="362" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#92400e">Timing data</text>
</svg>
