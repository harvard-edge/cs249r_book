<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <!-- Outer Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Header -->
  <text x="20" y="19" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10px" font-weight="bold" fill="#1e293b" letter-spacing="0.2">KINEMATIC STOPPING ENVELOPE BUDGET</text>
  <text x="20" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8px" fill="#64748b">Derated speed v_trip = 0.90 m/s (E_k ≤ 15 J)</text>

  <!-- Certified Boundary Shading (Hazard Zone > 50 mm, global x > 315) -->
  <rect x="315" y="36" width="95" height="66" fill="#f9d6d5" fill-opacity="0.22"/>

  <!-- Boundary Wall Pill & Dashed Line at 50.0 mm (global x = 315) -->
  <line x1="315" y1="33" x2="315" y2="102" stroke="#c44" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="277" y="18" width="76" height="15" rx="7.5" fill="#c44"/>
  <text x="315" y="28.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7px" font-weight="bold" fill="#ffffff" text-anchor="middle">50 mm BOUNDARY</text>

  <!-- Track 1: Nominal State -->
  <g transform="translate(20, 40)">
    <text x="0" y="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5px" font-weight="bold" fill="#1e293b">Nominal Brakes</text>
    <text x="0" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#14532d">d_stop = 45.0 mm</text>
    <text x="0" y="27" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" fill="#64748b">20 ms lag · 15 m/s²</text>

    <!-- Drift Bar: 18.0 mm (72 px) -->
    <rect x="95" y="2" width="72" height="22" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="131" y="12.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#78350f" text-anchor="middle">Reaction Drift</text>
    <text x="131" y="21" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7px" fill="#78350f" text-anchor="middle">18.0 mm (20 ms)</text>

    <!-- Decel Bar: 27.0 mm (108 px) -->
    <rect x="167" y="2" width="108" height="22" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="221" y="12.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#14532d" text-anchor="middle">Active Deceleration</text>
    <text x="221" y="21" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7px" fill="#14532d" text-anchor="middle">27.0 mm (38 ms)</text>

    <!-- Margin: +5.0 mm (20 px) -->
    <rect x="275" y="2" width="20" height="22" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75" stroke-dasharray="2,2"/>
    <text x="285" y="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" font-weight="bold" fill="#14532d" text-anchor="middle">+5</text>
    <text x="285" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.5px" fill="#14532d" text-anchor="middle">clear</text>

    <!-- Verdict Badge: OPERATE -->
    <rect x="425" y="5" width="68" height="16" rx="8" fill="#3d9e5a"/>
    <text x="459" y="16.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">OPERATE</text>
  </g>

  <!-- Track 2: Worn State -->
  <g transform="translate(20, 72)">
    <text x="0" y="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5px" font-weight="bold" fill="#7f1d1d">Worn (250k cyc)</text>
    <text x="0" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#c44">d_stop&apos; = 67.5 mm</text>
    <text x="0" y="27" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" fill="#7f1d1d">30 ms lag · 10 m/s²</text>

    <!-- Expanded Drift: 27.0 mm (108 px) -->
    <rect x="95" y="2" width="108" height="22" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="149" y="12.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#78350f" text-anchor="middle">Lag Drift: 27.0 mm</text>
    <text x="149" y="21" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7px" fill="#78350f" text-anchor="middle">+9.0 mm caliper wear</text>

    <!-- Braking in budget: 23.0 mm (92 px) -->
    <rect x="203" y="2" width="92" height="22" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="249" y="12.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#14532d" text-anchor="middle">Braking</text>
    <text x="249" y="21" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7px" fill="#14532d" text-anchor="middle">23.0 mm</text>

    <!-- Breach: 17.5 mm (70 px) -->
    <rect x="295" y="2" width="70" height="22" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="1"/>
    <text x="330" y="12.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#7f1d1d" text-anchor="middle">BREACH</text>
    <text x="330" y="21" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7px" font-weight="bold" fill="#c44" text-anchor="middle">+17.5 mm</text>

    <!-- Verdict Badge: REVOKED -->
    <rect x="425" y="5" width="68" height="16" rx="8" fill="#c44"/>
    <text x="459" y="16.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#ffffff" text-anchor="middle">REVOKED</text>
  </g>

  <!-- Axis Line & Ticks (0 mm = 115 px, 70 mm = 395 px) -->
  <line x1="115" y1="102" x2="405" y2="102" stroke="#94a3b8" stroke-width="0.75"/>

  <!-- Ticks every 10 mm (40 px) -->
  <line x1="115" y1="102" x2="115" y2="106" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="115" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" fill="#64748b" text-anchor="middle">0 mm</text>

  <line x1="155" y1="102" x2="155" y2="105" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="155" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" fill="#64748b" text-anchor="middle">10</text>

  <line x1="195" y1="102" x2="195" y2="105" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="195" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" fill="#64748b" text-anchor="middle">20</text>

  <line x1="235" y1="102" x2="235" y2="105" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="235" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" fill="#64748b" text-anchor="middle">30</text>

  <line x1="275" y1="102" x2="275" y2="105" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="275" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" fill="#64748b" text-anchor="middle">40</text>

  <line x1="315" y1="102" x2="315" y2="107" stroke="#c44" stroke-width="1.2"/>
  <text x="315" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" font-weight="bold" fill="#c44" text-anchor="middle">50 mm</text>

  <line x1="355" y1="102" x2="355" y2="105" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="355" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" fill="#64748b" text-anchor="middle">60</text>

  <line x1="395" y1="102" x2="395" y2="105" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="395" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5px" fill="#64748b" text-anchor="middle">70 mm</text>

  <!-- Bottom Container Card -->
  <g transform="translate(20, 120)">
    <rect width="500" height="44" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    
    <circle cx="12" cy="15" r="3" fill="#c44"/>
    <text x="20" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#7f1d1d">Friction Wear Invalidation:</text>
    <text x="140" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" fill="#334155">Brake wear degrades decel (15 → 10 m/s²) and caliper lag (18 → 28 ms), expanding d_stop by 50%</text>

    <circle cx="12" cy="30" r="3" fill="#1e3a8a"/>
    <text x="20" y="33" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#1e3a8a">Telemetry Lease Guard:</text>
    <text x="140" y="33" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5px" font-weight="bold" fill="#1e293b">Nervous system detects t_stop = 120 ms &gt; 80 ms nominal → Revokes lease &amp; locks gate drivers</text>
  </g>
</svg>