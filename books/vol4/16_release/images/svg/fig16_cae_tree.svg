<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="100%" height="100%">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D3748" />
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#A51C30" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F407A" />
        </marker>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="#FFFFFF" />
    
    <style>
        .claim-title { font-family: sans-serif; font-weight: bold; font-size: 14px; fill: #FFFFFF; }
        .claim-text { font-family: sans-serif; font-size: 13px; fill: #2D3748; }
        .box-title { font-family: sans-serif; font-weight: bold; font-size: 14px; fill: #2D3748; }
        .box-text { font-family: sans-serif; font-size: 13px; fill: #2D3748; }
        .white-text { font-family: sans-serif; font-size: 13px; fill: #FFFFFF; }
        .bold-text { font-family: sans-serif; font-weight: bold; font-size: 13px; fill: #2D3748; }
        .red-text { font-family: sans-serif; font-weight: bold; font-size: 13px; fill: #A51C30; }
        .blue-text { font-family: sans-serif; font-weight: bold; font-size: 13px; fill: #1F407A; }
    </style>
<line x1="450" y1="120" x2="160" y2="170" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)" /><line x1="450" y1="120" x2="450" y2="170" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)" /><line x1="450" y1="120" x2="740" y2="170" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)" /><line x1="160" y1="310" x2="160" y2="260" stroke="#A51C30" stroke-width="2" marker-end="url(#arrow-red)" /><line x1="160" y1="400" x2="310" y2="400" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/><line x1="450" y1="250" x2="450" y2="350" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)" /><line x1="450" y1="450" x2="450" y2="500" stroke="#1F407A" stroke-width="2" marker-end="url(#arrow-blue)" />
    <rect x="250" y="40" width="400" height="80" rx="4" fill="#E2E8F0" stroke="#2D3748" stroke-width="2"/>
    <rect x="250" y="40" width="400" height="24" rx="4" fill="#1F407A" />
    <path d="M 250 60 L 650 60 L 650 64 L 250 64 Z" fill="#1F407A" />
    <text x="260" y="56" class="claim-title">Claim C1: Operational Safety</text>
    <text x="260" y="82" class="box-text">Normal force ≤ 50 N, Shear force ≤ 20 N</text>
    <text x="260" y="100" class="box-text">Maintained across all operational states and faults</text>

    <rect x="50" y="170" width="220" height="90" rx="4" fill="#E2E8F0" stroke="#2D3748" stroke-width="2"/>
    <rect x="50" y="170" width="220" height="24" rx="4" fill="#1F407A" />
    <path d="M 50 190 L 270 190 L 270 194 L 50 194 Z" fill="#1F407A" />
    <text x="60" y="186" class="claim-title">Sub-Claim C1.1: Tactile Reflex</text>
    <text x="60" y="212" class="box-text">Soft tactile slip detector</text>
    <text x="60" y="230" class="box-text">halts arm before normal</text>
    <text x="60" y="248" class="box-text">force reaches 14 N</text>

    <rect x="340" y="170" width="220" height="90" rx="4" fill="#E2E8F0" stroke="#2D3748" stroke-width="2"/>
    <rect x="340" y="170" width="220" height="24" rx="4" fill="#1F407A" />
    <path d="M 340 190 L 560 190 L 560 194 L 340 194 Z" fill="#1F407A" />
    <text x="350" y="186" class="claim-title">Sub-Claim C1.2: Torque Tripwire</text>
    <text x="350" y="212" class="box-text">Secondary torque tripwire</text>
    <text x="350" y="230" class="box-text">halts arm at F_trip = 35 N</text>

    <rect x="630" y="170" width="220" height="90" rx="4" fill="#E2E8F0" stroke="#2D3748" stroke-width="2"/>
    <rect x="630" y="170" width="220" height="24" rx="4" fill="#1F407A" />
    <path d="M 630 190 L 850 190 L 850 194 L 630 194 Z" fill="#1F407A" />
    <text x="640" y="186" class="claim-title">Sub-Claim C1.3: Deterministic Exec</text>
    <text x="640" y="212" class="box-text">Nervous system hardware</text>
    <text x="640" y="230" class="box-text">guarantees loop latency</text>
    <text x="640" y="248" class="box-text">≤ 25 ms (worst-case)</text>

    <rect x="50" y="310" width="220" height="110" rx="4" fill="#E2E8F0" stroke="#A51C30" stroke-width="2"/>
    <rect x="50" y="310" width="220" height="24" rx="4" fill="#A51C30" />
    <path d="M 50 330 L 270 330 L 270 334 L 50 334 Z" fill="#A51C30" />
    <text x="60" y="326" class="claim-title">Defeater D1: Adversarial Audit</text>
    <text x="60" y="352" class="box-text">Residual cutting oil drops</text>
    <text x="60" y="370" class="box-text">friction (μ = 0.85 → 0.12).</text>
    <text x="60" y="388" class="box-text">Workpiece slips silently</text>
    <text x="60" y="406" class="box-text">without elastomer strain.</text>
    <text x="60" y="424" class="box-text">Reflex fails!</text>

    <rect x="310" y="350" width="280" height="100" rx="4" fill="#E2E8F0" stroke="#A51C30" stroke-width="2"/>
    <rect x="310" y="350" width="280" height="24" rx="4" fill="#2D3748" />
    <path d="M 310 370 L 590 370 L 590 374 L 310 374 Z" fill="#2D3748" />
    <text x="320" y="366" class="claim-title">Unconditional Release REFUSED</text>
    <text x="320" y="392" class="box-text">Primary reflex disabled.</text>
    <text x="320" y="410" class="box-text">Unmitigated secondary tripwire</text>
    <text x="320" y="428" class="box-text">allows peak force = 88 N.</text>
    <text x="320" y="446" class="box-text">88 N > 50 N (Claim Violation)</text>

    <rect x="250" y="500" width="400" height="130" rx="4" fill="#F0F4F8" stroke="#1F407A" stroke-width="2"/>
    <rect x="250" y="500" width="400" height="24" rx="4" fill="#1F407A" />
    <path d="M 250 520 L 650 520 L 650 524 L 250 524 Z" fill="#1F407A" />
    <text x="260" y="516" class="claim-title">Adjudication: Operate with Conditions</text>
    <text x="260" y="542" class="box-text">Binding Runtime Contracts:</text>
    <text x="260" y="560" class="box-text">1. Restrict payload mass: m ≤ 1.5 kg</text>
    <text x="260" y="578" class="box-text">2. Automated optical surface-dryness check</text>
    <text x="260" y="596" class="box-text">3. Tighten torque tripwire: F_trip = 18 N</text>
    <text x="260" y="614" class="box-text">Result: Peak impact F_peak = 38 N ≤ 50 N</text>
<text x="110" y="295" class="red-text" transform="rotate(-90 150 295)">DEFEATS</text>
<text x="210" y="390" class="bold-text">Fallback evaluates</text>
</svg>