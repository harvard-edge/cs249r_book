<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660">
  <defs>
    <style>
      .claim-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .box-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .box-text-bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .red-bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; }
      .green-bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #16a34a; }
      .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="660" fill="#ffffff"/>

  <!-- Connecting Lines from C1 to Level 2 -->
  <line x1="450" y1="115" x2="160" y2="163" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="115" x2="450" y2="163" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="115" x2="740" y2="163" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Level 1: Claim C1: Operational Safety -->
  <g transform="translate(250, 30)">
    <rect width="400" height="85" rx="4" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="400" height="26" rx="4" fill="#1e3a8a"/>
    <rect width="400" height="6" y="20" fill="#1e3a8a"/>
    <text x="16" y="18" class="claim-title">Claim C1: Operational Safety</text>
    <text x="16" y="48" class="box-text">Normal force ≤ 50 N, Shear force ≤ 20 N</text>
    <text x="16" y="68" class="box-text">Maintained across all operational states and faults</text>
  </g>

  <!-- Level 2: Subclaims -->
  <!-- C1.1: Tactile Reflex -->
  <g transform="translate(40, 165)">
    <rect width="240" height="96" rx="4" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="240" height="26" rx="4" fill="#1e3a8a"/>
    <rect width="240" height="6" y="20" fill="#1e3a8a"/>
    <text x="14" y="18" class="claim-title">C1.1: Tactile Reflex</text>
    <text x="14" y="47" class="box-text">Soft tactile slip detector halts</text>
    <text x="14" y="66" class="box-text">arm before normal force</text>
    <text x="14" y="85" class="box-text">reaches 14 N</text>
  </g>

  <!-- C1.2: Torque Tripwire -->
  <g transform="translate(330, 165)">
    <rect width="240" height="96" rx="4" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="240" height="26" rx="4" fill="#1e3a8a"/>
    <rect width="240" height="6" y="20" fill="#1e3a8a"/>
    <text x="14" y="18" class="claim-title">C1.2: Torque Tripwire</text>
    <text x="14" y="47" class="box-text">Secondary torque tripwire halts</text>
    <text x="14" y="66" class="box-text">arm at F_trip = 35 N</text>
  </g>

  <!-- C1.3: Deterministic Exec -->
  <g transform="translate(620, 165)">
    <rect width="240" height="96" rx="4" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="240" height="26" rx="4" fill="#1e3a8a"/>
    <rect width="240" height="6" y="20" fill="#1e3a8a"/>
    <text x="14" y="18" class="claim-title">C1.3: Deterministic Exec</text>
    <text x="14" y="47" class="box-text">Nervous system hardware</text>
    <text x="14" y="66" class="box-text">guarantees loop latency</text>
    <text x="14" y="85" class="box-text">≤ 25 ms (worst-case)</text>
  </g>

  <!-- DEFEATS Arrow: from D1 top (160, 330) up to C1.1 bottom (160, 263) -->
  <line x1="160" y1="330" x2="160" y2="265" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <!-- Horizontal DEFEATS badge -->
  <rect x="115" y="285" width="90" height="22" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="160" y="300" class="red-bold" text-anchor="middle">⚡ DEFEATS</text>

  <!-- Defeater D1: Adversarial Audit -->
  <g transform="translate(40, 330)">
    <rect width="240" height="130" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="240" height="26" rx="4" fill="#dc2626"/>
    <rect width="240" height="6" y="20" fill="#dc2626"/>
    <text x="14" y="18" class="claim-title">Defeater D1: Adversarial Audit</text>
    <text x="14" y="47" class="box-text" fill="#991b1b">Residual cutting oil drops</text>
    <text x="14" y="65" class="box-text" fill="#991b1b">friction (μ = 0.85 → 0.12).</text>
    <text x="14" y="83" class="box-text" fill="#991b1b">Workpiece slips silently</text>
    <text x="14" y="101" class="box-text" fill="#991b1b">without elastomer strain.</text>
    <text x="14" y="119" class="red-bold">Reflex fails!</text>
  </g>

  <!-- Fallback Arrow from D1 to Unconditional Release REFUSED -->
  <line x1="280" y1="395" x2="344" y2="395" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="286" y="372" width="58" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="315" y="385" class="badge-text" text-anchor="middle">Fallback</text>

  <!-- Unconditional Release REFUSED -->
  <g transform="translate(350, 330)">
    <rect width="280" height="120" rx="4" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
    <rect width="280" height="26" rx="4" fill="#0f172a"/>
    <rect width="280" height="6" y="20" fill="#0f172a"/>
    <text x="14" y="18" class="claim-title">Unconditional Release REFUSED</text>
    <text x="14" y="47" class="box-text">Primary reflex disabled.</text>
    <text x="14" y="66" class="box-text">Unmitigated secondary tripwire</text>
    <text x="14" y="85" class="box-text">allows peak force = 88 N.</text>
    <text x="14" y="104" class="red-bold">88 N &gt; 50 N (Claim Violation)</text>
  </g>

  <!-- Arrow from REFUSED to Adjudication -->
  <line x1="490" y1="450" x2="490" y2="493" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Level 4: Adjudication: Operate with Conditions -->
  <g transform="translate(250, 498)">
    <rect width="480" height="135" rx="4" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="480" height="26" rx="4" fill="#1e3a8a"/>
    <rect width="480" height="6" y="20" fill="#1e3a8a"/>
    <text x="16" y="18" class="claim-title">Adjudication: Operate with Conditions</text>
    <text x="16" y="48" class="box-text-bold">Binding Runtime Contracts:</text>
    <text x="16" y="67" class="box-text">1. Restrict payload mass: m ≤ 1.5 kg</text>
    <text x="16" y="86" class="box-text">2. Automated optical surface-dryness check</text>
    <text x="16" y="105" class="box-text">3. Tighten torque tripwire: F_trip = 18 N</text>
    <text x="16" y="124" class="green-bold">Result: Peak impact F_peak = 38 N ≤ 50 N</text>
  </g>
</svg>