  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.assurance.case
      label: Safety case
      teaches: Safety case
      summary: An inspectable argument connecting physical safety claims to evidence, assumptions, warrants,
        and possible defeaters.
      section: sec-release-assurance-grammar
    - id: vol4.assurance.manifest
      label: Release manifest
      teaches: Release manifest
      summary: A signed binding of the release verdict to configuration identities, limits, evidence records,
        and conditions enforced at startup and operation.
      section: sec-release-manifest
    - id: vol4.assurance.conditions
      label: Standing conditions
      teaches: Standing conditions
      summary: Ongoing physical and organizational premises whose lapse withdraws a release verdict even
        without a software change.
      section: sec-release-standing-conditions
    relationships:
    - id: vol4.field.assurance-case--assurance-conditions
      source: vol4.assurance.case
      predicate: binds evidence to
      target: vol4.assurance.conditions
      explanation: Every physical claim depends on stated conditions, so evidence cannot justify operation
        after those conditions change unnoticed.
      conditions: Conjunctive premises must all hold; extra confidence in one evidence leg cannot replace
        missing evidence in another.
      status: draft
      evidence:
        section: sec-release-contextual-assumptions
        quote: A stopping test passed on clean, dry concrete under bright warehouse lamps can fail the first
          time the robot enters a dim aisle if the safety case never stated the lighting assumption behind
          its camera exposure time. Every physical measurement rests on ambient conditions, and moving the
          machine into a dimly lit aisle can lengthen camera exposure and observation age even when the
          mechanical brakes and tires behave identically. An assurance argument must state these contextual
          assumptions explicitly so that measurements gathered under one set of conditions are never credited
          outside their verified operating envelope.
    - id: vol4.field.assurance-manifest--assurance-case
      source: vol4.assurance.manifest
      predicate: enforces the configuration of
      target: vol4.assurance.case
      explanation: The signed manifest binds an approved configuration to the verdict so startup cannot
        silently substitute a new checkpoint or calibration.
      conditions: Binding configuration identities does not measure physical standing conditions; those
        need their own verification and revocation mechanism.
      status: draft
      evidence:
        section: sec-release-manifest
        quote: A safety case that lives only in static documents or procedural sign-off sheets cannot stop
          a robot from booting with an unverified policy checkpoint or stale sensor calibrations. To make
          the verdict enforceable on hardware, the adjudicator's decision is recorded in the **release manifest**\index{Release
          manifest!definition}\index{Release contract!release manifest}, the fourteenth record in the book's
          record chain. This signed, tamper-evident data structure binds every upstream engineering contract,
          the Goal Structuring Notation argument graph, the operating envelope limits, and live standing
          conditions to the adjudicator's verdict by cryptographic digest. The target platform refuses physical
          motion whenever runtime binary images, silicon attestation measurements, or underlying qualification
          data diverge from these signed digests.[^fn-hw-crypto-manifest]
    - id: vol4.field.assurance-conditions--assurance-manifest
      source: vol4.assurance.conditions
      predicate: can withdraw
      target: vol4.assurance.manifest
      explanation: Wear, calibration drift, or changed operating conditions can invalidate the signed release
        without any software update.
      conditions: Standing-condition cadence and revocation rules must be enforced; a signature is not perpetual
        permission.
      status: draft
      evidence:
        section: sec-release-standing-conditions
        quote: A signed release can lapse without any change to the underlying software. Brake linings wear
          down, camera brackets shift under continuous vibration, or warehouse traffic polishes concrete
          lanes until traction drops. When these physical premises drift, the stopping claim certified by
          the adjudicator no longer holds. Standing conditions bind the operational verdict to these physical
          baselines by defining an explicit observation cadence for each premise alongside deterministic
          fallback responses when a check fails. Because failure modes originate in hardware and environment,
          their observation schedules must follow physical degradation mechanisms rather than software sprint
          schedules. An assurance case maintained this way, its validity updated throughout operating life
          as monitored evidence shifts, is what the safety literature calls a *dynamic safety case*\index{Safety
          case!dynamic} [@denney2015dynamic].
    - id: vol4.field.learning-checkpoint--assurance-case
      source: vol4.learning.checkpoint
      predicate: can reopen
      target: vol4.assurance.case
      explanation: A policy update can change execution and contact behavior and therefore reopen the claims
        supporting deployment.
      conditions: Only evidence justified by a documented unchanged-claim argument can transfer; the updated
        candidate still needs a new bound configuration and verdict.
      status: draft
      evidence:
        section: sec-release-deployment-lifecycle
        quote: Continuing the stipulated warehouse branch, suppose the mobile manipulator's restricted mug-delivery
          policy is retrained to reduce hesitation at the controlled pick station. Pushing that updated
          checkpoint directly to the fleet would invalidate the signed manifest and expose the machine to
          unverified bus loads and contact trajectories. Before the candidate neural policy can issue commands
          to physical actuators, it must pass back through the release decision. A signed safety case establishes
          which historical evidence remains valid, which hardware-in-the-loop tests must run again, and
          how the machine maintains physical containment throughout the update.
    - id: vol4.field.assurance-case--plant-braking
      source: vol4.assurance.case
      predicate: requires evidence of
      target: vol4.plant.braking
      explanation: A stopping assurance claim depends on measured braking authority under its declared plant
        and operating conditions.
      conditions: A stipulated or calculated braking value is not a completed loaded qualification; evidence
        must match the configuration and fault response being authorized.
      status: draft
      evidence:
        section: sec-release-three-verdicts
        quote: 'Treating a release sign-off as an informal paper memo forces teams either to ground a useful
          machine over an unmeasured corner case or to wave it onto the floor with unproven assumptions.
          Every row of @tbl-16-cae-scorecard ends in an adjudication, and the release decision resolves
          the entire assertion DAG into one of three verdicts: **unconditional operation**\index{Verdicts!unconditional
          operation}, **conditional operation**\index{Verdicts!conditional operation}, or **refusal to operate**\index{Verdicts!refusal
          to operate}. In this book''s architecture, these verdicts are cryptographically signed capability
          descriptors loaded into the real-time safety microcontroller before motor power stages are energized,
          not advisory certificates or administrative paperwork. A valid descriptor is the machine''s **operating
          permit**\index{Operating permit!definition}: while it holds, the permission path may admit the
          policy''s tracking commands inside the envelope the descriptor names, and when it is revoked or
          absent, the permission path admits none. Although safety standards do not mandate this specific
          mechanism (@sec-release-standards-map), the qualified gate and permission path enforce the authenticated
          descriptor''s limits on physical operation. The first verdict, unconditional operation (`UNCOND`),
          authorizes tracking proposals across the full operating envelope specified in a signed release
          manifest, provided its standing conditions remain continuously verified. Each hazard claim in
          that safety case requires qualified measurements, justified analysis, or validated operating restrictions
          applicable to the specified physical plant, payload distribution, operational design domain, and
          fault set. Brake thermal capacity, stopping clearance, and tracking-error bounds must all be qualified
          for that envelope, and independent permission checks must stand wherever learned policy proposals
          can reach physical actuators. The verdict does not eliminate residual or newly emergent hazards;
          it authorizes operation solely under the assessed claims and requires detection and safe withdrawal
          within the qualified response budget whenever a physical premise fails.'
