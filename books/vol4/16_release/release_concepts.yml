    - Shadow mode deployment
    - Canary non-inferiority
  claims:
    Safety case: Release adjudicates physical inequalities (stop inside the clear distance, contact force under
      the assessed limit, WCET inside its deadline) through a claim-argument-evidence case whose warrants say why
      each piece of evidence supports its claim.
    Conjunctive premises and diverse legs: When every child claim is required the case is conjunctive and its confidence
      falls below every premise, so an assessor looks for the least-supported premise, and only genuinely independent
      sufficient legs add confidence.
    Three signed verdicts: The argument resolves into a signed verdict loaded as the machine's operating permit
      (UNCOND for the assessed envelope, COND for a separately evidenced restricted limit set, REFUSE naming the
      next measurement).
    Standing conditions: A verdict lives only while its premises hold, so each premise is bound to a detector or
      site procedure at a cadence set by its degradation mechanism, and an unknown premise refuses like a breach.
    Release manifest: The release manifest binds every upstream record, the argument digest, binary hashes, calibration,
      standing conditions, wear budget, expiry, and the adjudicator's signature to one configuration and gates motion
      fail-closed.
    Updates reopen claims: An update reopens the claims whose evidence it touches, an unchanged enforcer binary
      does not imply an unchanged containment argument, and shadow mode filters candidates while contained canaries
      qualify them.
    Certification authorizes a configuration: Certification follows the machinery route (risk reduction, rated functions,
      drive stops, mobile-manipulator standards) and authorizes a configuration with its evidence, not a capability.
    Adversarial review and defeaters: Before signing, an independent reviewer hunts defeaters with probes at the
      envelope extremes, domain transfer, structural independence, and unmonitored wear, and the review recurs against
      normalization of deviance.
    Fleet evidence one outcome at a time: Fleet exposure narrows intervals for common outcomes but leaves rare severe
      outcomes wide, so each outcome's claim is licensed separately and disclosed.
    Shadow mode deployment: Shadow mode runs a release candidate beside the incumbent with no actuator authority,
      logging divergence as action and barrier-rate discrepancies, which filters candidates but cannot qualify them.
    Canary non-inferiority: A contained canary qualifies an update by a non-inferiority test on the intervention-rate
      ratio against a margin declared in advance, with sequential stopping.
