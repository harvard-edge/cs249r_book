<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="800" height="372" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="arr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#DC2626"/></marker>
  </defs>

  <!-- Column heads -->
  <text x="90" y="24" font-size="11" font-weight="700" fill="#1A4D3E" text-anchor="middle">At one tick</text>
  <text x="330" y="24" font-size="11" font-weight="700" fill="#1A4D3E" text-anchor="middle">Decision, and who made it</text>
  <text x="535" y="24" font-size="11" font-weight="700" fill="#1A4D3E" text-anchor="middle">Record that holds it</text>
  <text x="705" y="24" font-size="11" font-weight="700" fill="#1A4D3E" text-anchor="middle">Owner on record</text>

  <!-- Admitted command -->
  <rect x="20" y="156" width="140" height="62" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="90" y="179" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">admitted aisle</text>
  <text x="90" y="193" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">command</text>
  <text x="90" y="209" font-size="10.5" fill="#4A5568" text-anchor="middle">1.3 m/s, one tick</text>

  <!-- Fan from the command to six decisions -->
  <path d="M160,187 L200,187 L200,61 L234,61" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M200,113 L234,113" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M200,165 L234,165" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M200,217 L234,217" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M200,187 L200,321 L234,321" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M200,269 L234,269" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Six decisions (x 235..425), rows centered at 61, 113, 165, 217, 269, 321 -->
  <rect x="235" y="40" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="57" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">policy weights</text>
  <text x="330" y="72" font-size="10.5" fill="#4A5568" text-anchor="middle">learning team</text>

  <rect x="235" y="92" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="109" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">enforcer build and thresholds</text>
  <text x="330" y="124" font-size="10.5" fill="#4A5568" text-anchor="middle">safety engineering</text>

  <rect x="235" y="144" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="161" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">authority state</text>
  <text x="330" y="176" font-size="10.5" fill="#4A5568" text-anchor="middle">intervention design, assistant</text>

  <rect x="235" y="196" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="213" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">operating envelope</text>
  <text x="330" y="228" font-size="10.5" fill="#4A5568" text-anchor="middle">lead systems adjudicator</text>

  <rect x="235" y="248" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="265" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">crossing rule</text>
  <text x="330" y="280" font-size="10.5" fill="#4A5568" text-anchor="middle">facility management</text>

  <rect x="235" y="300" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="317" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">staffing ratio</text>
  <text x="330" y="332" font-size="10.5" fill="#4A5568" text-anchor="middle">operations</text>

  <!-- Decision to record -->
  <path d="M425,61 L469,61" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M425,113 L469,113" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M425,165 L469,165" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M425,217 L469,217" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M425,269 L469,269" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <path d="M425,321 L469,321" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- Records (x 470..600) -->
  <rect x="470" y="44" width="130" height="34" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="535" y="65" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">policy manifest</text>
  <rect x="470" y="96" width="130" height="34" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="535" y="117" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">enforcement record</text>
  <rect x="470" y="148" width="130" height="34" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="535" y="169" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">authority record</text>
  <rect x="470" y="200" width="130" height="34" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="535" y="221" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">release manifest</text>
  <rect x="470" y="252" width="130" height="34" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="535" y="273" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">no record</text>
  <rect x="470" y="304" width="130" height="34" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="535" y="325" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">no record</text>

  <!-- Into the approval record -->
  <path d="M600,61 L626,61" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600,113 L626,113" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600,165 L626,165" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600,217 L626,217" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600,269 L626,269" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600,321 L626,321" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="627" y="40" width="156" height="302" rx="4" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.6"/>
  <text x="705" y="160" font-size="12" font-weight="700" fill="#1A4D3E" text-anchor="middle">approval</text>
  <text x="705" y="175" font-size="12" font-weight="700" fill="#1A4D3E" text-anchor="middle">record</text>
  <text x="705" y="200" font-size="10.5" fill="#1A202C" text-anchor="middle">decision + owner</text>
  <text x="705" y="216" font-size="10.5" fill="#991B1B" text-anchor="middle">no owner: refuse</text>
</svg>
