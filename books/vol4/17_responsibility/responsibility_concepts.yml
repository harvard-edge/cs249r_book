  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.accountability.approval
      label: Approval record
      teaches: Approval record
      summary: A record of who accepted operational and organizational decisions, their evidence, conditions,
        and revocation responsibilities.
      section: sec-responsibility-approval-record
    - id: vol4.accountability.oversight
      label: Human oversight
      teaches: Oversight a person can perform
      summary: An assigned human role that has enough time, information, and effective authority to intervene
        as the claim requires.
      section: sec-responsibility-meaningful-oversight
    - id: vol4.accountability.detection-gap
      label: Subgroup detection gap
      teaches: Detection gaps become stopping gaps
      summary: A difference in detection performance across exposed groups that can delay response and consume
        their stopping clearance unequally.
      section: sec-responsibility-perception-disparity
    relationships:
    - id: vol4.field.accountability-approval--assurance-manifest
      source: vol4.accountability.approval
      predicate: records decisions beyond
      target: vol4.assurance.manifest
      explanation: The approval record makes staffing, exposure, and accepted operational decisions attributable
        alongside technical release records.
      conditions: A record establishes responsibility and conditions, not consent or safety by itself; lapses
        must affect the release gate.
      status: draft
      evidence:
        section: sec-responsibility-approval-record
        quote: 'Left scattered across emails, slide decks, and meeting notes, the human and organizational
          premises behind a machine can lapse without blocking release: a staffing ratio changes on the
          night shift, a subgroup detection test is deferred, or a data-retention declaration expires while
          the robot keeps running. The **approval record**\index{Approval record!definition} collects these
          premises in a single gate-checked artifact: it binds by digest the authority record, the enforcement
          record, the fault records, and the release manifest, and it adds the decisions behind them, each
          with a named owner.'
    - id: vol4.field.accountability-oversight--intervention-delay
      source: vol4.accountability.oversight
      predicate: requires budgeted
      target: vol4.intervention.delay
      explanation: An assigned person can protect the machine only if the available response window covers
        attention, decision, queueing, and takeover.
      conditions: Human backup is not a hard real-time safety path when the credited response cannot fit
        the physical deadline.
      status: draft
      evidence:
        section: sec-responsibility-oversight-time
        quote: Time is the condition most often violated, and it is the easiest to check. At the `{python}
          OversightTime.v_str` aisle speed, a person who steps out `{python} OversightTime.d_clear_str`
          ahead of the machine leaves `{python} OversightTime.t_window_str` before the rack end. A remote
          assistant who has been monitoring rather than driving needs about `{python} OversightTime.t_ool_str`
          to take over, the design out-of-loop takeover time, during which the machine travels `{python}
          OversightTime.travel_str`. The person needs about `{python} OversightTime.ratio_mult_str` the
          time the hazard leaves. No training, attention, or diligence closes a gap of that size, so a design
          that names the remote assistant as the countermeasure for a person stepping out at a rack end
          has not added a layer of protection. It has recorded in advance who will be blamed.
    - id: vol4.field.accountability-detection-gap--stopping-distance
      source: vol4.accountability.detection-gap
      predicate: can increase
      target: vol4.stopping.distance
      explanation: Later or missed detection for an exposed group consumes more clearance before the same
        braking response can begin.
      conditions: Use deployment-relevant detection timing and per-group uncertainty; classification disparity
        in an unrelated task is not a measured stopping-gap estimate.
      status: draft
      evidence:
        section: sec-responsibility-perception-disparity
        quote: 'A warehouse has its own groups. A detector trained mostly on people walking upright may
          see a kneeling worker, a person carrying a carton that hides the torso, a wheelchair user, or
          a worker without a high-visibility vest later or less often. Where the machine relies only on
          its certified safety scanner, which stops for any object above its resolution without deciding
          what it is, these differences do not matter. They matter wherever the design relies on a learned
          detector to recognize a person: to slow down when a person is near, to keep a wider separation
          from people than from pallets, or to predict where a person will walk. In those places, a difference
          in detection becomes a difference in how close the machine comes to each group before it begins
          to brake.'
