concept_map:
  schema_version: 2
  source: 17_responsibility.qmd
  generated_date: '2026-10-13'
  primary_concepts:
    - Approval record
    - Decisions behind an admitted action
    - Oversight a person can perform
    - Staged permission
    - Detection gaps become stopping gaps
    - Recorded people
    - Worker burden
  secondary_concepts:
    - Unconsented risk
    - Legible intent
    - Incident disclosure duty
  claims:
    Approval record: The approval record names, for each decision behind an admitted action, the person
      who approved it and answers for it, together with the human roles, permit stage, exposed groups, records about
      people, and shifted labor, and the release gate reads it as a standing condition so that a decision with no
      named owner refuses operation the way an unknown premise does.
    Decisions behind an admitted action: One admitted command rests on decisions made earlier by different parties
      (policy, enforcer, authority state, envelope, crossing rule, staffing), so each party can point to another,
      most of those decisions never appear in a runtime log, and a chain of k separately kept links is complete only
      with the product of their probabilities, so the links must be recorded on purpose.
    Oversight a person can perform: A human role counts as a countermeasure only if its holder has the time, information,
      and authority to act within the time the hazard leaves, including the queue one person serves, and a role that
      fails any of the three moves blame onto that person without adding protection.
    Staged permission: Permission to operate is granted in stages (testing with a safety driver or spotter, driverless
      or unattended testing, open deployment), each for a named configuration, domain, evidence, and reporting duties,
      left on evidence gathered at that stage and withdrawn for a configuration change, an incident, or a withheld record.
    Detection gaps become stopping gaps: A group of people a detector sees less often needs more frames before detection
      can be relied on, so a stop sized for the best-detected group loses distance before braking and strikes the other
      group with speed and energy that follow from the distance lost, and each group's sample must be large enough for
      its interval to resolve the gap.
    Recorded people: Records that reconstruct an admitted action also record operators, bystanders, demonstrators,
      and coworkers, so each identifying record declares its purpose, retention period, what is removed before storage,
      and its readers, and an access and retention audit enforces the declaration as a standing condition.
    Worker burden: Automation moves a task's labor into rescue, sweeping, monitoring, and data collection, and creates
      records that could be used to score workers, so a deployment counts the labor it moves and bars uses of its safety
      records that were never declared.
    Unconsented risk: The people a machine puts at risk are often not the people who chose it, so an aggregate risk
      figure can improve while risk concentrates on them, and exposure is reported per group and per location with
      whether each group chose it.
    Legible intent: People protect themselves by predicting where a machine will go, so motion that reveals its goal
      early and explicit signals let them yield sooner, and signals are shown only where measured detection supports
      the trust they invite.
    Incident disclosure duty: An operating permit carries a duty to report incidents completely and on time, so a
      permit can be withdrawn for a withheld or incomplete record as well as for the motion it describes.
