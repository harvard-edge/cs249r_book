  claims:
    Closed-loop estimand: A physical success rate is the expectation of a frozen outcome predicate over a declared
      distribution of trial conditions (initial state, environment, unit, frozen policy and permission parameters),
      so it belongs to that population and to no other.
    Outcome channels and censored trials: Task completion, proposer autonomy, and supervisory burden are separate
      channels, and an intervened run is an autonomy failure, never a success that was cut short (the censored trial
      fallacy).
    Offline evaluation illusion: Replay resets the input to the recorded state each step, so a heading bias with
      a tiny angular MSE can spend a 15 cm aisle clearance in seconds once the loop closes.
    Four evidence regimes: Replay, closed-loop simulation, shadow operation, and constrained physical testing sit
      on two axes (causal feedback, physical realism) and each trades one distortion for another, so they are not
      a fidelity ladder.
    Predeclared trial protocol: A finite record supports a claim only if the target ODD, its weights, approximately
      independent draws, a frozen predicate, and the full denominator are fixed before the first run.
    Zero-failure bound: At zero failures the Wald interval collapses, so a clean record is inverted exactly (failure
      bound about 3/n), which makes twenty clean runs consistent with a one-in-seven failure rate and makes every
      added nine cost about ten times the trials.
    Exposure wall: Hazards are rates per operating hour, and bounding a rate lambda with zero events needs about
      3/lambda failure-free hours, so rare hazards cannot be demonstrated by sampling the proposer.
    Evaluation record: The evaluation record binds a bounded claim to its target ODD, configuration digests, sampling
      protocol, complete outcome log, exact statistics, and the catalog of unsupported gaps, which become runtime
      obligations.
    Simulator screening validity: A simulator earns authority to screen candidates only through a paired sim-and-real
      benchmark scored for rank inversions, and even then it filters, never certifies.
    Sequential and comparative tests: Early acceptance is valid only under a boundary declared in advance (Wald's
      SPRT), and comparing two checkpoints needs interleaved, randomized, blinded runs on one unit.
    Trajectory confinement: Shadow operation runs the candidate on the real machine while the baseline keeps authority,
      so the candidate's inputs stay confined to the baseline's state distribution and its recovery is never tested.
    Runtime monitor channels: Coverage gaps the record cannot close become five runtime monitor channels (input
      support, latency and freshness, constraint margin, intervention rate, environmental assumption).
