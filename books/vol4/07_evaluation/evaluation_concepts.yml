    concepts:
    - id: vol4.evaluation.trial
      label: Closed-loop trial
      teaches: Closed-loop estimand
      summary: A trial of the complete controller and plant in which actions determine later observations
        and the declared outcome is scored.
      section: sec-evaluation-what-measured
    - id: vol4.evaluation.confidence
      label: Failure-rate bound
      teaches: Zero-failure bound
      summary: A statistical limit supported by a finite campaign under its sampling and outcome assumptions;
        no observed failures is not proof of zero risk.
      section: sec-evaluation-closed-loop-survival
    relationships:
    - id: vol4.field.evaluation-trial--learning-shift
      source: vol4.evaluation.trial
      predicate: tests effects of
      target: vol4.learning.shift
      explanation: Closed-loop evaluation observes the states induced by executing the policy, which offline
        action-error tests omit.
      conditions: Fix controller, plant, scenario distribution, outcome channels, interventions, and trial
        rules before interpreting the result.
      status: draft
      evidence:
        section: sec-evaluation-closed-loop-dynamics
        quote: 'A policy checkpoint that achieves the lowest validation loss on held-out teleoperation logs
          can drive the mobile base into a warehouse rack or jam the door latch on its first physical trial.
          Offline scoring resets the robot''s state to the demonstrator''s recording at every step, erasing
          the cumulative consequences of the policy''s own actions. In standard deep learning workflows,
          model evaluation centers on empirical risk minimization over a static, held-out validation dataset
          $\ValidationDataset = \{(\ModelInput_i, \ExampleLabel_i)\}_{i=1}^\EvaluationSampleCount$:

          $$\ValidationLoss(\ModelParameters) = \frac{1}{\EvaluationSampleCount} \sum_{i=1}^\EvaluationSampleCount
          \LossFunction(\ParameterizedPredictor(\ModelInput_i), \ExampleLabel_i)$$

          Whether the target metric is Top-1 classification accuracy, next-token perplexity, an F1 score,
          or coordinate regression loss, the evaluation pipeline remains passive and decoupled. The underlying
          data-generating process is feedforward and memoryless with respect to the model''s outputs: mispredicting
          sample $\ExampleIndex$ exerts zero causal influence on sample $\ExampleIndex+1$ ($\partial \ModelInput_{i+1}
          / \partial \ModelPrediction_i = 0$).'
    - id: vol4.field.evaluation-trial--evaluation-confidence
      source: vol4.evaluation.trial
      predicate: supports a conditional
      target: vol4.evaluation.confidence
      explanation: A finite no-failure campaign supports a bounded rate under its statistical assumptions,
        rather than a claim of zero failures in operation.
      conditions: The stated outcome population, independence or sampling assumptions, and predeclared trial
        protocol must hold; untested conditions remain unqualified.
      status: draft
      evidence:
        section: sec-evaluation-closed-loop-survival
        quote: 'With the operational outcome, target population, evaluation regime, and trial denominator
          fixed, the twenty clean nominal runs pose an immediate statistical problem: determining what degree
          of reliability the campaign has actually demonstrated. A confidence bound quantifies the uncertainty
          that remains under the declared sampling model. Systems engineers must treat this bound as a measure
          of statistical evidence rather than an assessment of physical failure severity or an automatic
          deployment permit.'
