<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: bold; fill: #1e293b; }
      .subhdr { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: bold; fill: #1e293b; }
      .lbl { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #334155; }
      .lbl-bold { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: bold; }
      .dim { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7px; fill: #64748b; }
      .badge-txt { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 6.5px; font-weight: bold; }
    </style>
    <marker id="arrow" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Container: Dynamic Contact Force Timeline -->
  <rect x="16" y="16" width="310" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="26" y="31" class="hdr">CONTACT IMPACT SHOCK: RIGID VS COMPLIANT</text>

  <!-- Plot Axes -->
  <!-- Y-axis: 0 to 2400 N. Origin at y=126. 420N at y=112. 1800N at y=64. 2350N at y=46. -->
  <line x1="52" y1="126" x2="52" y2="40" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="46" y="44" class="dim" text-anchor="end" font-weight="bold">F_N (N)</text>
  <!-- X-axis: 0 to 30 ms. 0: x=52, 10: x=128, 20: x=204, 30: x=280. -->
  <line x1="52" y1="126" x2="298" y2="126" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="166" y="153" class="dim" text-anchor="middle" font-weight="bold">Contact Duration (ms)</text>

  <!-- Ticks on X-axis -->
  <line x1="52" y1="126" x2="52" y2="129" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="137" class="dim" text-anchor="middle">0</text>
  <line x1="128" y1="126" x2="128" y2="129" stroke="#94a3b8" stroke-width="1"/>
  <text x="128" y="137" class="dim" text-anchor="middle">10</text>
  <line x1="204" y1="126" x2="204" y2="129" stroke="#94a3b8" stroke-width="1"/>
  <text x="204" y="137" class="dim" text-anchor="middle">20</text>
  <line x1="280" y1="126" x2="280" y2="129" stroke="#94a3b8" stroke-width="1"/>
  <text x="280" y="137" class="dim" text-anchor="middle">30</text>

  <!-- Mean Walking Baseline (420 N) -->
  <line x1="52" y1="112" x2="290" y2="112" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="46" y="114.5" class="dim" text-anchor="end">420</text>
  <text x="288" y="109" class="dim" text-anchor="end" fill="#94a3b8">μ = 420 N (nominal)</text>

  <!-- Yield Limit (1800 N) -->
  <line x1="52" y1="64" x2="175" y2="64" stroke="#c44" stroke-width="1.25" stroke-dasharray="4,2"/>
  <text x="46" y="66.5" class="dim" text-anchor="end" font-weight="bold" fill="#7f1d1d">1800</text>
  <!-- Yield Badge -->
  <rect x="180" y="56" width="112" height="15" rx="7.5" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="236" y="66.5" class="badge-txt" fill="#7f1d1d" text-anchor="middle">SHEAR PIN YIELD (1800 N)</text>

  <!-- Compliant Pulse Area & Path (Green, SEA + Elastomer) -->
  <!-- Starts at x=52, rises to peak ~920N (y=94) at t=9ms (x=120), falls to 0 at t=22ms (x=219) -->
  <path d="M 52 126 C 75 126, 95 94, 120 94 C 145 94, 185 126, 219 126 Z" fill="#d4edda" fill-opacity="0.6"/>
  <path d="M 52 126 C 75 126, 95 94, 120 94 C 145 94, 185 126, 219 126" fill="none" stroke="#3d9e5a" stroke-width="1.75"/>
  <text x="142" y="90" class="dim" font-weight="bold" fill="#14532d">Compliant (SEA)</text>
  <text x="142" y="99" class="dim" fill="#14532d">Δt=22ms, peak 920 N</text>

  <!-- Rigid Impact Spike Area & Path (Red, Unmitigated Contact) -->
  <!-- Starts at x=52, sharp spike to 2350N (y=46) at t=1.5ms (x=63), drops back to 0 at t=4ms (x=82) -->
  <path d="M 52 126 L 63 46 L 82 126 Z" fill="#f9d6d5" fill-opacity="0.6"/>
  <path d="M 52 126 L 63 46 L 82 126" fill="none" stroke="#c44" stroke-width="1.75"/>
  <circle cx="63" cy="46" r="2.5" fill="#c44"/>
  <text x="68" y="44" class="dim" font-weight="bold" fill="#7f1d1d">Rigid Spike: 2350 N</text>
  <text x="68" y="52" class="dim" fill="#7f1d1d">Δt=1.5ms (Fracture!)</text>

  <!-- Right Container: Two-Tier Hardware Interceptor -->
  <rect x="334" y="16" width="190" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="344" y="31" class="subhdr">TWO-TIER HARDWARE DEFENSE</text>

  <!-- Tier 1 Sub-block: Passive Compliance -->
  <rect x="342" y="38" width="174" height="42" rx="3" fill="#ffffff" stroke="#3d9e5a" stroke-width="0.75"/>
  <rect x="348" y="43" width="98" height="11" rx="5.5" fill="#d4edda"/>
  <text x="397" y="51.5" class="badge-txt" fill="#14532d" text-anchor="middle">TIER 1: PASSIVE COMPLIANCE</text>
  <text x="348" y="64" class="lbl">• SEA sole pad: Δt 1.5 → 22 ms</text>
  <text x="348" y="74" class="lbl-bold" fill="#14532d">• Peak force damped: 2.35 → 0.92 kN</text>

  <!-- Tier 2 Sub-block: Real-Time Active Clamp -->
  <rect x="342" y="85" width="174" height="52" rx="3" fill="#ffffff" stroke="#4a90c4" stroke-width="0.75"/>
  <rect x="348" y="90" width="98" height="11" rx="5.5" fill="#cfe2f3"/>
  <text x="397" y="98.5" class="badge-txt" fill="#1e3a8a" text-anchor="middle">TIER 2: 1 kHz MCU CLAMP</text>
  <text x="348" y="111" class="lbl">• Tripwire: dF/dt ≥ 1.2×10⁴ N/s</text>
  <text x="348" y="121" class="lbl-bold" fill="#1e3a8a">• Active knee flexion in 1.0 ms</text>
  <text x="348" y="131" class="dim" fill="#64748b">• Absorbs residual kinetic energy</text>

  <!-- Footnote -->
  <text x="344" y="153" class="dim" fill="#334155"><tspan font-weight="bold" fill="#c44">!</tspan> Fréchet tail: strikes once every 3.8 min</text>
</svg>