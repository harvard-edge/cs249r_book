<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 9px; font-weight: bold; fill: #1e293b; }
      .subhdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: bold; fill: #1e293b; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #334155; }
      .lbl-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: bold; }
      .dim { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7px; fill: #64748b; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7px; font-weight: bold; }
    </style>
    <marker id="arrow" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Container: SPRT Decision Space -->
  <rect x="16" y="16" width="344" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="26" y="31" class="hdr">ILLUSTRATIVE SEQUENTIAL DECISION PATHS</text>

  <!-- Plot Axes -->
  <!-- Y-axis: Z_m from -3 to +3.5. Baseline 0 at y=85. +A at y=53. -B at y=112. -->
  <line x1="52" y1="126" x2="52" y2="40" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="46" y="44" class="dim" text-anchor="end" font-weight="bold">Z_m</text>
  <!-- X-axis: 0 to 100 trials. 0: x=52, 25: x=107, 50: x=162, 75: x=217, 100: x=272 -->
  <line x1="52" y1="126" x2="336" y2="126" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="162" y="153" class="dim" text-anchor="middle" font-weight="bold">Physical Rollout Trials (m)</text>

  <!-- Ticks on X-axis -->
  <line x1="52" y1="126" x2="52" y2="129" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="137" class="dim" text-anchor="middle">0</text>
  <line x1="107" y1="126" x2="107" y2="129" stroke="#94a3b8" stroke-width="1"/>
  <text x="107" y="137" class="dim" text-anchor="middle">25</text>
  <line x1="162" y1="126" x2="162" y2="129" stroke="#94a3b8" stroke-width="1"/>
  <text x="162" y="137" class="dim" text-anchor="middle">50</text>
  <line x1="217" y1="126" x2="217" y2="129" stroke="#94a3b8" stroke-width="1"/>
  <text x="217" y="137" class="dim" text-anchor="middle">75</text>
  <line x1="272" y1="126" x2="272" y2="129" stroke="#94a3b8" stroke-width="1"/>
  <text x="272" y="137" class="dim" text-anchor="middle">100</text>

  <!-- Baseline Z=0 -->
  <line x1="52" y1="85" x2="330" y2="85" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="46" y="87.5" class="dim" text-anchor="end">0</text>

  <!-- Upper Absorbing Boundary A: Accept H1 -->
  <line x1="52" y1="53" x2="215" y2="53" stroke="#3d9e5a" stroke-width="1.25" stroke-dasharray="4,2"/>
  <text x="46" y="55.5" class="dim" text-anchor="end" font-weight="bold" fill="#14532d">A</text>
  <!-- Pill badge Upper: placed at x=222 to x=334 (width 112) -->
  <rect x="222" y="45" width="112" height="16" rx="8" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="278" y="56" class="badge-txt" fill="#14532d" text-anchor="middle">ACCEPT H₁ (PASS)</text>

  <!-- Lower Absorbing Boundary B: Reject H1 / Abort -->
  <line x1="52" y1="112" x2="215" y2="112" stroke="#c44" stroke-width="1.25" stroke-dasharray="4,2"/>
  <text x="46" y="114.5" class="dim" text-anchor="end" font-weight="bold" fill="#7f1d1d">B</text>
  <!-- Pill badge Lower: placed at x=222 to x=334 (width 112) -->
  <rect x="222" y="104" width="112" height="16" rx="8" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="278" y="115" class="badge-txt" fill="#7f1d1d" text-anchor="middle">REJECT H₁ (ABORT)</text>

  <!-- Zone Label -->
  <text x="58" y="76" class="dim" fill="#94a3b8">Continue testing (rollouts proceed)</text>

  <!-- Wasteful Fixed Sample Line at m=100 (x=272), clipped between y=65 and y=99 so it never intersects badges -->
  <line x1="272" y1="65" x2="272" y2="99" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="272" y1="123" x2="272" y2="126" stroke="#94a3b8" stroke-width="1"/>
  <text x="272" y="38" class="dim" text-anchor="middle" fill="#64748b">Fixed N=100</text>
  <line x1="272" y1="40" x2="272" y2="44" stroke="#94a3b8" stroke-width="0.75"/>

  <!-- Passing Trajectory: reaches A at m=48 (x = 52 + 48*2.2 = 157.6, y = 53) -->
  <path d="M 52 85 L 66 81 L 80 77 L 92 80 L 105 72 L 118 66 L 132 68 L 145 59 L 154 55 L 158 53" fill="none" stroke="#3d9e5a" stroke-width="1.75"/>
  <circle cx="158" cy="53" r="3" fill="#3d9e5a"/>
  <!-- Vertical Drop Marker for Pass -->
  <line x1="158" y1="53" x2="158" y2="126" stroke="#3d9e5a" stroke-width="0.75" stroke-dasharray="2,2"/>
  <text x="145" y="44" class="dim" font-weight="bold" fill="#14532d" text-anchor="middle">Pass @ m=48</text>

  <!-- Failing Trajectory: reaches B at m=24 (x = 52 + 24*2.2 = 104.8, y = 112) -->
  <path d="M 52 85 L 64 89 L 75 96 L 86 94 L 96 104 L 105 112" fill="none" stroke="#c44" stroke-width="1.75"/>
  <circle cx="105" cy="112" r="3" fill="#c44"/>
  <!-- Vertical Drop Marker for Abort -->
  <line x1="105" y1="112" x2="105" y2="126" stroke="#c44" stroke-width="0.75" stroke-dasharray="2,2"/>
  <text x="96" y="104" class="dim" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Abort @ m=24</text>

  <!-- Right Container: Physical Impact & Hardware Savings -->
  <rect x="368" y="16" width="156" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="378" y="31" class="subhdr">SAMPLE COUNT: EXAMPLE PATHS</text>

  <!-- Sub-block 1: Fixed Horizon -->
  <rect x="376" y="38" width="140" height="42" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>
  <rect x="382" y="43" width="58" height="11" rx="5.5" fill="#f1f5f9"/>
  <text x="411" y="51.5" class="badge-txt" fill="#475569" text-anchor="middle">FIXED N=100</text>
  <text x="382" y="64" class="lbl">• 100 trials × 260 s ≈ 7.2 h</text>
  <text x="382" y="74" class="lbl" fill="#7f1d1d">• Baseline trial count only</text>

  <!-- Sub-block 2: Wald SPRT -->
  <rect x="376" y="85" width="140" height="56" rx="3" fill="#ffffff" stroke="#3d9e5a" stroke-width="0.75"/>
  <rect x="382" y="90" width="58" height="11" rx="5.5" fill="#d4edda"/>
  <text x="411" y="98.5" class="badge-txt" fill="#14532d" text-anchor="middle">WALD SPRT</text>
  <text x="382" y="111" class="lbl-bold" fill="#14532d">• Paths stop at 48 or 24 trials</text>
  <text x="382" y="122" class="lbl">• Calibrate α, β incl. overshoot</text>
  <text x="382" y="133" class="dim" fill="#14532d">• Savings depend on observed path</text>

  <!-- Footnote -->
  <text x="378" y="153" class="dim" fill="#334155"><tspan font-weight="bold" fill="#3d9e5a">✓</tspan> No universal wear saving</text>
</svg>