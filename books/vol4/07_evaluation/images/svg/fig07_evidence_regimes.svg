<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 670" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 21px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #475569; }
      .panel-title { font-family: Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .badge-text { font-family: Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: bold; letter-spacing: 0.4px; }
      .node-text { font-family: Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .node-subtext { font-family: Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #64748b; text-anchor: middle; }
      .flow-label { font-family: Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #334155; }
      .bullet-label { font-family: Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; }
      .bullet-desc { font-family: Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; }
      .arrow { stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    
    <!-- Arrow Markers -->
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-crimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="670" fill="#ffffff"/>

  <!-- Master Header -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" class="title">The Four Evidence Regimes in Physical AI Evaluation</text>
    <text x="0" y="20" class="subtitle">Causality, State Distribution, and State Censorship Across Experimental Environments</text>
  </g>

  <!-- ==================== QUADRANT 1: RECORDED REPLAY ==================== -->
  <g transform="translate(40, 72)">
    <rect width="485" height="280" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="485" height="34" rx="6" fill="#f1f5f9"/>
    <line x1="0" y1="34" x2="485" y2="34" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <text x="14" y="22" class="panel-title">1. Recorded Replay</text>
    <rect x="300" y="8" width="173" height="18" rx="9" fill="#e2e8f0"/>
    <text x="386" y="21" class="badge-text" fill="#334155" text-anchor="middle">FEEDFORWARD • OPEN LOOP</text>

    <!-- Flow Diagram -->
    <g transform="translate(14, 46)">
      <!-- Disk Log -->
      <rect x="0" y="4" width="100" height="42" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
      <text x="50" y="22" class="node-text">Logged Buffer</text>
      <text x="50" y="36" class="node-subtext">Static frames z₀…z_T</text>

      <!-- Arrow to Policy -->
      <line x1="100" y1="25" x2="142" y2="25" class="arrow" stroke="#475569" marker-end="url(#arrow-slate)"/>
      <text x="121" y="18" class="flow-label" text-anchor="middle">z_t</text>

      <!-- Policy Node -->
      <rect x="144" y="4" width="120" height="42" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="204" y="22" class="node-text" fill="#1d4ed8">Candidate Policy</text>
      <text x="204" y="36" class="node-subtext">Model weights π_θ</text>

      <!-- Arrow to Output -->
      <line x1="264" y1="25" x2="306" y2="25" class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
      <text x="285" y="18" class="flow-label" text-anchor="middle">â_t</text>

      <!-- Output Metric Node -->
      <rect x="308" y="4" width="148" height="42" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
      <text x="382" y="22" class="node-text">Benchmark Metrics</text>
      <text x="382" y="36" class="node-subtext">Loss ||â_t - a*_t||, Latency τ_inf</text>

      <!-- Callout badge masking line -->
      <rect x="70" y="58" width="320" height="24" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
      <circle cx="86" cy="70" r="6" fill="#dc2626"/>
      <line x1="83" y1="67" x2="89" y2="73" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="89" y1="67" x2="83" y2="73" stroke="#ffffff" stroke-width="1.5"/>
      <text x="98" y="74" class="bullet-desc" fill="#991b1b" font-weight="bold">No feedback loop: â_t cannot alter next frame z_t+1</text>

      <!-- Broken Feedback Line below -->
      <path d="M 382 46 L 382 92 L 50 92 L 50 48" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,4"/>
    </g>

    <!-- Key Takeaway Bullets -->
    <g transform="translate(14, 168)">
      <rect x="0" y="0" width="457" height="48" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="17" class="bullet-label" fill="#15803D">VALID EVIDENCE:</text>
      <text x="112" y="17" class="bullet-desc">Inference throughput, DRAM footprint, numerical accuracy.</text>
      <text x="8" y="36" class="bullet-desc" fill="#166534">Confirms whether model satisfies nominal hardware latency &amp; memory budgets.</text>

      <rect x="0" y="54" width="457" height="48" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="8" y="71" class="bullet-label" fill="#B91C1C">MASKED FAILURE:</text>
      <text x="116" y="71" class="bullet-desc">Covariate shift, error accumulation, closed-loop divergence.</text>
      <text x="8" y="90" class="bullet-desc" fill="#991b1b">A catastrophic steering command never manifests as an off-course trajectory in replay.</text>
    </g>
  </g>

  <!-- ==================== QUADRANT 2: CLOSED-LOOP SIMULATION ==================== -->
  <g transform="translate(555, 72)">
    <rect width="485" height="280" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="485" height="34" rx="6" fill="#f0fdfa"/>
    <line x1="0" y1="34" x2="485" y2="34" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <text x="14" y="22" class="panel-title">2. Closed-Loop Simulation</text>
    <rect x="290" y="8" width="183" height="18" rx="9" fill="#ccfbf1"/>
    <text x="381" y="21" class="badge-text" fill="#0f766e" text-anchor="middle">SYNTHETIC PHYSICS • CLOSED LOOP</text>

    <!-- Diagram Area -->
    <g transform="translate(14, 46)">
      <!-- Policy Node -->
      <rect x="6" y="8" width="115" height="42" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="63" y="26" class="node-text" fill="#1d4ed8">Candidate Policy</text>
      <text x="63" y="40" class="node-subtext">Action chunking â_t</text>

      <!-- Action Arrow Top -->
      <path d="M 121 29 L 178 29" class="arrow" stroke="#0d9488" marker-end="url(#arrow-teal)"/>
      <text x="150" y="21" class="flow-label" text-anchor="middle">â_t</text>

      <!-- Simulator Node -->
      <rect x="180" y="0" width="145" height="58" rx="4" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
      <text x="252" y="20" class="node-text" fill="#0f766e">Simulator Engine</text>
      <text x="252" y="34" class="node-subtext">Integrate f_sim(s_t, â_t)</text>
      <text x="252" y="47" class="node-subtext">Rigid body ODEs / MuJoCo</text>

      <!-- Arrow to ISP -->
      <path d="M 325 29 L 360 29" class="arrow" stroke="#0d9488" marker-end="url(#arrow-teal)"/>

      <!-- Sensory Render Node -->
      <rect x="362" y="8" width="94" height="42" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
      <text x="409" y="26" class="node-text">Synthetic ISP</text>
      <text x="409" y="40" class="node-subtext">Raytrace ô_t+1</text>

      <!-- Feedback Label ABOVE return line -->
      <rect x="80" y="64" width="300" height="20" rx="3" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
      <text x="230" y="78" class="flow-label" fill="#0f766e" text-anchor="middle">Synthetic observations ô_t+1 (Causal Loop Closed)</text>

      <!-- Loop Feedback Bottom Line -->
      <path d="M 409 50 L 409 94 L 63 94 L 63 52" fill="none" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
    </g>

    <!-- Key Takeaways -->
    <g transform="translate(14, 168)">
      <rect x="0" y="0" width="457" height="48" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="17" class="bullet-label" fill="#15803D">VALID EVIDENCE:</text>
      <text x="112" y="17" class="bullet-desc">Kinematic boundary reachability, algorithmic stability recovery.</text>
      <text x="8" y="36" class="bullet-desc" fill="#166534">Enables 10⁶ parallel Monte Carlo boundary stress runs without hardware wear.</text>

      <rect x="0" y="54" width="457" height="48" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="8" y="71" class="bullet-label" fill="#B91C1C">MASKED FAILURE:</text>
      <text x="116" y="71" class="bullet-desc">Reality Gap: contact friction, gear backlash, motor thermal fade.</text>
      <text x="8" y="90" class="bullet-desc" fill="#991b1b">Unmodeled tire slip and actuator phase delay make sim-stable paths fail on real iron.</text>
    </g>
  </g>

  <!-- ==================== QUADRANT 3: SHADOW OPERATION ==================== -->
  <g transform="translate(40, 365)">
    <rect width="485" height="280" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="485" height="34" rx="6" fill="#fffbeb"/>
    <line x1="0" y1="34" x2="485" y2="34" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <text x="14" y="22" class="panel-title">3. Shadow Mode Operation</text>
    <rect x="290" y="8" width="183" height="18" rx="9" fill="#fef3c7"/>
    <text x="381" y="21" class="badge-text" fill="#b45309" text-anchor="middle">PHYSICAL SENSORS • MUTED ACTUATION</text>

    <!-- Diagram Area -->
    <g transform="translate(14, 46)">
      <!-- Real Physical Plant -->
      <rect x="0" y="12" width="85" height="46" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
      <text x="42" y="31" class="node-text">Physical Plant</text>
      <text x="42" y="45" class="node-subtext">Real Iron f_real</text>

      <!-- Sensor split arrow -->
      <path d="M 85 35 L 108 35 L 108 16 L 130 16" class="arrow" stroke="#334155" marker-end="url(#arrow-slate)"/>
      <path d="M 108 35 L 108 56 L 130 56" class="arrow" stroke="#d97706" marker-end="url(#arrow-amber)"/>

      <!-- Path A: Validated Controller -->
      <rect x="132" y="4" width="135" height="26" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="199" y="21" class="node-text" font-size="10">Active Baseline Control</text>

      <!-- Path B: Candidate Policy (Shadow) -->
      <rect x="132" y="44" width="135" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="199" y="61" class="node-text" fill="#b45309" font-size="10">Candidate Policy (Shadow)</text>

      <!-- Path A to Motors -->
      <path d="M 267 17 L 310 17" class="arrow" stroke="#15803d" marker-end="url(#arrow-green)"/>
      <rect x="312" y="4" width="112" height="26" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
      <text x="368" y="21" class="node-text" fill="#15803d" font-size="10">Motors (ACTIVE)</text>

      <!-- Path B to Muted Logger -->
      <path d="M 267 57 L 310 57" class="arrow" stroke="#d97706" stroke-dasharray="3,3" marker-end="url(#arrow-amber)"/>
      <rect x="312" y="44" width="112" height="26" rx="3" fill="#fff1f2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="368" y="61" class="node-text" fill="#dc2626" font-size="10">MUTED (Log to Flash)</text>

      <!-- Label ABOVE feedback line -->
      <rect x="100" y="74" width="280" height="18" rx="3" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="240" y="87" class="flow-label" fill="#15803d" text-anchor="middle">Physical feedback locked to baseline trajectory</text>
      
      <!-- Path A feedback loop back to plant -->
      <path d="M 424 17 L 448 17 L 448 98 L 42 98 L 42 60" fill="none" stroke="#15803d" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
    </g>

    <!-- Key Takeaways -->
    <g transform="translate(14, 168)">
      <rect x="0" y="0" width="457" height="48" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="17" class="bullet-label" fill="#15803D">VALID EVIDENCE:</text>
      <text x="112" y="17" class="bullet-desc">Onboard bus contention, thermal throttling, real sensor noise.</text>
      <text x="8" y="36" class="bullet-desc" fill="#166534">Tests 50 Hz pipeline survival amidst real mechanical vibration and PCIe DMA bursts.</text>

      <rect x="0" y="54" width="457" height="48" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="8" y="71" class="bullet-label" fill="#B91C1C">MASKED FAILURE:</text>
      <text x="116" y="71" class="bullet-desc">State distribution locked to baseline; divergence never compounds.</text>
      <text x="8" y="90" class="bullet-desc" fill="#991b1b">If shadow policy proposes off-cliff action, baseline safely ignores it and stays in lane.</text>
    </g>
  </g>

  <!-- ==================== QUADRANT 4: CONSTRAINED PHYSICAL TESTING ==================== -->
  <g transform="translate(555, 365)">
    <rect width="485" height="280" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="485" height="34" rx="6" fill="#fef2f2"/>
    <line x1="0" y1="34" x2="485" y2="34" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <text x="14" y="22" class="panel-title">4. Constrained Physical Testing</text>
    <rect x="290" y="8" width="183" height="18" rx="9" fill="#fee2e2"/>
    <text x="381" y="21" class="badge-text" fill="#b91c1c" text-anchor="middle">REAL PHYSICS • STATE CENSORED</text>

    <!-- Diagram Area -->
    <g transform="translate(14, 46)">
      <!-- Policy Node -->
      <rect x="0" y="8" width="95" height="42" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="47" y="26" class="node-text" fill="#1d4ed8">Candidate Policy</text>
      <text x="47" y="40" class="node-subtext">Proposes u_t</text>

      <!-- Proposal Arrow -->
      <path d="M 95 29 L 128 29" class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
      <text x="112" y="21" class="flow-label" text-anchor="middle">u_t</text>

      <!-- Nervous Enforcer with Shield -->
      <rect x="130" y="0" width="148" height="56" rx="4" fill="#fff1f2" stroke="#dc2626" stroke-width="1.4"/>
      <text x="204" y="19" class="node-text" fill="#991b1b">Nervous Enforcer</text>
      <text x="204" y="32" class="node-subtext">CBF Filter / 1 kHz Shield</text>
      <rect x="142" y="37" width="124" height="14" rx="2" fill="#fee2e2"/>
      <text x="204" y="48" class="bullet-label" fill="#dc2626" font-size="8.5" text-anchor="middle">SUPERVISOR VETO GATE</text>

      <!-- Command Arrow to Actuators -->
      <path d="M 278 29 L 314 29" class="arrow" stroke="#059669" marker-end="url(#arrow-slate)"/>
      <text x="296" y="21" class="flow-label" fill="#059669" text-anchor="middle">u_safe</text>

      <!-- Physical Plant -->
      <rect x="316" y="8" width="138" height="42" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
      <text x="385" y="26" class="node-text">Physical Plant</text>
      <text x="385" y="40" class="node-subtext">Traction &amp; Thermal Limits</text>

      <!-- Label ABOVE feedback line -->
      <rect x="50" y="74" width="370" height="18" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="235" y="87" class="flow-label" fill="#dc2626" text-anchor="middle">Real closed loop (TRUNCATED at safety envelope boundary)</text>

      <!-- Feedback loop to policy -->
      <path d="M 434 50 L 434 98 L 47 98 L 47 52" fill="none" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
    </g>

    <!-- Key Takeaways -->
    <g transform="translate(14, 168)">
      <rect x="0" y="0" width="457" height="48" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="17" class="bullet-label" fill="#15803D">VALID EVIDENCE:</text>
      <text x="112" y="17" class="bullet-desc">True contact dynamics, compliance, backlash, continuous physical friction.</text>
      <text x="8" y="36" class="bullet-desc" fill="#166534">Verifies nominal execution dynamics inside the tested safe corridor envelope.</text>

      <rect x="0" y="54" width="457" height="48" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="8" y="71" class="bullet-label" fill="#B91C1C">MASKED FAILURE:</text>
      <text x="116" y="71" class="bullet-desc">State Censorship: E-stops &amp; tethers truncate catastrophic failure tails.</text>
      <text x="8" y="90" class="bullet-desc" fill="#991b1b">Zero crashes in a caged cell does not prove safe autonomous policy in the wild.</text>
    </g>
  </g>
</svg>
