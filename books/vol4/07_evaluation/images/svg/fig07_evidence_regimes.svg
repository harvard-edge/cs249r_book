<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- Subtle Coordinate Quadrant Grid Lines -->
  <line x1="95" y1="275" x2="950" y2="275" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="525" y1="45" x2="525" y2="515" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- COORDINATE SYSTEM AXES                                               -->
  <!-- ==================================================================== -->
  <!-- Y-Axis (Physical Realism) -->
  <line x1="85" y1="520" x2="85" y2="45" stroke="#64748B" stroke-width="1.4" marker-end="url(#arr-dark)"/>
  <text x="85" y="32" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Hardware</text>
  <text x="85" y="535" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">Synthetic / Logged</text>
  <text x="26" y="280" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="0.5px" transform="rotate(-90 26 280)">Physical Realism</text>

  <!-- X-Axis (Causal Feedback) -->
  <line x1="90" y1="552" x2="950" y2="552" stroke="#64748B" stroke-width="1.4" marker-end="url(#arr-dark)"/>
  <text x="120" y="572" font-size="11" font-weight="600" fill="#64748B" text-anchor="start">Open Loop</text>
  <text x="930" y="572" font-size="11" font-weight="700" fill="#334155" text-anchor="end">Closed Loop</text>
  <text x="525" y="574" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="0.5px">Causal Feedback</text>

  <!-- ==================================================================== -->
  <!-- QUADRANT 1: TOP-LEFT — SHADOW MODE                                   -->
  <!-- ==================================================================== -->
  <g id="quadrant-shadow">
    <rect x="115" y="55" width="390" height="200" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
    <line x1="115" y1="88" x2="505" y2="88" stroke="#FEF3C7" stroke-width="1"/>
    <text x="133" y="78" font-size="13" font-weight="700" fill="#78350F">Shadow Mode</text>
    <text x="490" y="78" font-size="10.5" font-weight="600" fill="#B45309" text-anchor="end">Bus Timing</text>

    <!-- Physical Plant -->
    <rect x="135" y="118" width="68" height="52" rx="5" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
    <text x="169" y="142" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">f<tspan baseline-shift="sub" font-size="7.5">real</tspan></text>
    <text x="169" y="157" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">z<tspan baseline-shift="sub" font-size="7">t</tspan></text>

    <!-- Branch A: Active Baseline Loop -->
    <path d="M 203 135 L 222 135 L 222 115 L 242 115" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <rect x="245" y="100" width="75" height="30" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="282" y="119" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">π<tspan baseline-shift="sub" font-size="7.5">base</tspan></text>

    <line x1="320" y1="115" x2="355" y2="115" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <text x="337" y="110" font-size="8.5" font-weight="600" fill="#059669" text-anchor="middle">a<tspan baseline-shift="sub" font-size="6.5">base</tspan></text>

    <rect x="358" y="100" width="70" height="30" rx="4" fill="#F0FDF4" stroke="#15803D" stroke-width="1.2"/>
    <text x="393" y="119" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Motors</text>

    <!-- Active feedback loop from motors to f_real -->
    <path d="M 428 115 L 452 115 L 452 185 L 169 185 L 169 170" fill="none" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>

    <!-- Branch B: Candidate Policy (Shadow / Muted) -->
    <path d="M 203 150 L 222 150 L 222 158 L 242 158" fill="none" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
    <rect x="245" y="143" width="75" height="30" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="282" y="162" font-size="10.5" font-weight="700" fill="#92400E" text-anchor="middle">π<tspan baseline-shift="sub" font-size="7.5">θ</tspan></text>

    <line x1="320" y1="158" x2="355" y2="158" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-amber)"/>
    <text x="337" y="153" font-size="8.5" font-weight="600" fill="#B45309" text-anchor="middle">a<tspan baseline-shift="sub" font-size="6.5">cand</tspan></text>

    <rect x="358" y="143" width="70" height="30" rx="4" fill="#FFF1F2" stroke="#FCA5A5" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="393" y="162" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Muted</text>

    <!-- Bottom State Notation -->
    <rect x="225" y="222" width="170" height="20" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="0.9"/>
    <text x="310" y="236" font-size="9.5" font-weight="600" fill="#B45309" text-anchor="middle">s<tspan baseline-shift="sub" font-size="7">t</tspan> ∼ d(π<tspan baseline-shift="sub" font-size="7">base</tspan>)</text>
  </g>

  <!-- ==================================================================== -->
  <!-- QUADRANT 2: TOP-RIGHT — CONSTRAINED TESTING                          -->
  <!-- ==================================================================== -->
  <g id="quadrant-constrained">
    <rect x="545" y="55" width="390" height="200" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <line x1="545" y1="88" x2="935" y2="88" stroke="#FEE2E2" stroke-width="1"/>
    <text x="563" y="78" font-size="13" font-weight="700" fill="#7F1D1D">Constrained Testing</text>
    <text x="920" y="78" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="end">Contact Dynamics</text>

    <!-- Candidate Policy -->
    <rect x="555" y="125" width="58" height="34" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="584" y="146" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">π<tspan baseline-shift="sub" font-size="7.5">θ</tspan></text>

    <line x1="613" y1="142" x2="643" y2="142" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>
    <text x="628" y="136" font-size="8.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">a<tspan baseline-shift="sub" font-size="6.5">t</tspan></text>

    <!-- CBF Filter Veto Gate -->
    <rect x="645" y="123" width="64" height="38" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3"/>
    <text x="677" y="146" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">CBF</text>

    <line x1="709" y1="142" x2="739" y2="142" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <text x="724" y="136" font-size="8.5" font-weight="600" fill="#059669" text-anchor="middle">u<tspan baseline-shift="sub" font-size="6.5">safe</tspan></text>

    <!-- Real Plant -->
    <rect x="741" y="125" width="58" height="34" rx="4" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
    <text x="770" y="146" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">f<tspan baseline-shift="sub" font-size="7.5">real</tspan></text>

    <!-- Feedback return loop -->
    <path d="M 770 159 L 770 185 L 584 185 L 584 159" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <text x="677" y="181" font-size="8.5" font-weight="600" fill="#334155" text-anchor="middle">s<tspan baseline-shift="sub" font-size="6.5">t+1</tspan></text>

    <!-- Safety Boundary Arc and Open Deployment Target -->
    <path d="M 825 106 Q 835 142 825 182" fill="none" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="3,3"/>
    <text x="825" y="100" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">∂𝒮</text>

    <rect x="850" y="122" width="68" height="40" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="884" y="138" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle">Open</text>
    <text x="884" y="151" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle">Deploy</text>

    <!-- Bottom State Notation -->
    <rect x="660" y="222" width="160" height="20" rx="4" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.9"/>
    <text x="740" y="236" font-size="9.5" font-weight="700" fill="#991B1B" text-anchor="middle">s<tspan baseline-shift="sub" font-size="7">t</tspan> ∈ 𝒮<tspan baseline-shift="sub" font-size="7">safe</tspan></text>
  </g>

  <!-- ==================================================================== -->
  <!-- QUADRANT 3: BOTTOM-LEFT — RECORDED REPLAY                            -->
  <!-- ==================================================================== -->
  <g id="quadrant-replay">
    <rect x="115" y="295" width="390" height="200" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
    <line x1="115" y1="328" x2="505" y2="328" stroke="#DBEAFE" stroke-width="1"/>
    <text x="133" y="318" font-size="13" font-weight="700" fill="#1E3A8A">Recorded Replay</text>
    <text x="490" y="318" font-size="10.5" font-weight="600" fill="#2563EB" text-anchor="end">Compute Bounds</text>

    <!-- Stored Buffer -->
    <rect x="135" y="368" width="70" height="38" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>
    <text x="170" y="386" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">𝒟<tspan baseline-shift="sub" font-size="7.5">demo</tspan></text>
    <text x="170" y="399" font-size="8.5" font-weight="500" fill="#64748B" text-anchor="middle">z₀ … z<tspan baseline-shift="sub" font-size="6.5">T</tspan></text>

    <line x1="205" y1="387" x2="245" y2="387" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <text x="225" y="381" font-size="8.5" font-weight="600" fill="#334155" text-anchor="middle">z<tspan baseline-shift="sub" font-size="6.5">t</tspan></text>

    <!-- Policy Inference -->
    <rect x="248" y="368" width="75" height="38" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
    <text x="285" y="392" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">π<tspan baseline-shift="sub" font-size="7.5">θ</tspan></text>

    <line x1="323" y1="387" x2="363" y2="387" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>
    <text x="343" y="381" font-size="8.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">â<tspan baseline-shift="sub" font-size="6.5">t</tspan></text>

    <!-- Offline Metric -->
    <rect x="366" y="368" width="85" height="38" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>
    <text x="408" y="392" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">|â − a*|</text>

    <!-- Open Loop Broken Path -->
    <path d="M 408 406 L 408 438 L 170 438 L 170 406" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>

    <rect x="245" y="428" width="130" height="20" rx="4" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.9"/>
    <text x="310" y="442" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">∂s / ∂â = 0</text>
  </g>

  <!-- ==================================================================== -->
  <!-- QUADRANT 4: BOTTOM-RIGHT — SIMULATION                                -->
  <!-- ==================================================================== -->
  <g id="quadrant-sim">
    <rect x="545" y="295" width="390" height="200" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
    <line x1="545" y1="328" x2="935" y2="328" stroke="#DCFCE7" stroke-width="1"/>
    <text x="563" y="318" font-size="13" font-weight="700" fill="#14532D">Simulation</text>
    <text x="920" y="318" font-size="10.5" font-weight="600" fill="#16A34A" text-anchor="end">Stability Bounds</text>

    <!-- Policy -->
    <rect x="562" y="368" width="65" height="38" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
    <text x="594" y="392" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">π<tspan baseline-shift="sub" font-size="7.5">θ</tspan></text>

    <line x1="627" y1="387" x2="667" y2="387" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <text x="647" y="381" font-size="8.5" font-weight="600" fill="#047857" text-anchor="middle">a<tspan baseline-shift="sub" font-size="6.5">t</tspan></text>

    <!-- Synthetic Physics -->
    <rect x="669" y="368" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.3"/>
    <text x="709" y="392" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">f<tspan baseline-shift="sub" font-size="7.5">sim</tspan></text>

    <line x1="749" y1="387" x2="789" y2="387" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <text x="769" y="381" font-size="8.5" font-weight="600" fill="#047857" text-anchor="middle">s<tspan baseline-shift="sub" font-size="6.5">t+1</tspan></text>

    <!-- Sensor Output -->
    <rect x="791" y="368" width="75" height="38" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>
    <text x="828" y="392" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">ô<tspan baseline-shift="sub" font-size="6.5">t+1</tspan></text>

    <!-- Closed feedback return loop -->
    <path d="M 828 406 L 828 438 L 594 438 L 594 406" fill="none" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-green)"/>

    <!-- Simulation Gap Note -->
    <rect x="645" y="428" width="140" height="20" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.9"/>
    <text x="715" y="442" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">f<tspan baseline-shift="sub" font-size="7.5">sim</tspan> ≠ f<tspan baseline-shift="sub" font-size="7.5">real</tspan></text>
  </g>
</svg>
