<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 428" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Volume IV stack, mirrors \mlphysicalstackfull in tex/physical-stack.tex:
       five tiers, all active; the wider gap under the Brain is the proposal boundary. -->
  <rect width="300" height="428" fill="#ffffff"/>

  <!-- Brain -->
  <rect x="12" y="14" width="12" height="62" fill="#1A4D3E"/>
  <text x="36" y="32" font-size="14" font-weight="700" fill="#1A4D3E">Brain</text>
  <text x="36" y="50" font-size="11" fill="#1A4D3E">1–50 Hz</text>
  <text x="36" y="66" font-size="10.5" fill="#4A5568">perception, memory, intent, planning</text>

  <!-- proposal boundary -->
  <line x1="12" y1="92" x2="288" y2="92" stroke="#9AA5A0" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="12" y="108" font-size="10" font-style="italic" fill="#5A6560">proposal boundary: above may only propose,</text>
  <text x="12" y="121" font-size="10" font-style="italic" fill="#5A6560">below may command</text>

  <!-- Nervous System -->
  <rect x="12" y="136" width="12" height="62" fill="#1A4D3E"/>
  <text x="36" y="154" font-size="14" font-weight="700" fill="#1A4D3E">Nervous System</text>
  <text x="36" y="172" font-size="11" fill="#1A4D3E">1 kHz (one implementation)</text>
  <text x="36" y="188" font-size="10.5" fill="#4A5568">permission path, lease, fallback</text>

  <!-- Body -->
  <rect x="12" y="210" width="12" height="62" fill="#1A4D3E"/>
  <text x="36" y="228" font-size="14" font-weight="700" fill="#1A4D3E">Body</text>
  <text x="36" y="246" font-size="11" fill="#1A4D3E">10–25 kHz current loop</text>
  <text x="36" y="262" font-size="10.5" fill="#4A5568">drives, transmission, windings</text>

  <!-- Boundary -->
  <rect x="12" y="284" width="12" height="62" fill="#1A4D3E"/>
  <text x="36" y="302" font-size="14" font-weight="700" fill="#1A4D3E">Boundary</text>
  <text x="36" y="320" font-size="11" fill="#1A4D3E">event-timed</text>
  <text x="36" y="336" font-size="10.5" fill="#4A5568">register write, sensor capture</text>

  <!-- Physical World -->
  <rect x="12" y="358" width="12" height="62" fill="#1A4D3E"/>
  <text x="36" y="376" font-size="14" font-weight="700" fill="#1A4D3E">Physical World</text>
  <text x="36" y="394" font-size="11" fill="#1A4D3E">continuous</text>
  <text x="36" y="410" font-size="10.5" fill="#4A5568">contact, friction, payload, people</text>
</svg>
