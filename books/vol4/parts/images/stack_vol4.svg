<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1F407A" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#A51C30" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="570" height="580" fill="#FFFFFF" rx="4"/>

  <!-- Title & Subtitle -->
  <text x="285" y="32" font-size="16" font-weight="bold" fill="#1F407A" text-anchor="middle" letter-spacing="0.04em">THE PHYSICAL AI SYSTEMS STACK</text>
  <text x="285" y="50" font-size="10.5" fill="#64748B" text-anchor="middle">Bridging High-Latency Foundation Models to Deterministic Physics</text>

  <!-- ==================== 1. THE BRAIN ==================== -->
  <g transform="translate(60, 68)">
    <rect x="0" y="0" width="450" height="74" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="2"/>
    <rect x="12" y="10" width="68" height="18" rx="3" fill="#1F407A"/>
    <text x="46" y="22.5" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1–50 Hz</text>
    <text x="90" y="24" font-size="12.5" font-weight="bold" fill="#1F407A">The Brain · Cognitive Deliberation</text>
    <text x="438" y="23" font-size="9.5" font-weight="bold" fill="#64748B" text-anchor="end">Linux MPU / NPU</text>
    
    <text x="14" y="48" font-size="10" font-weight="600" fill="#334155">Foundation Models · Spatial Perception · Latent World Belief · Planning</text>
    <text x="14" y="62" font-size="9" fill="#64748B">Stochastic deliberation · Unprivileged action chunk proposals (û)</text>
  </g>

  <!-- ==================== 2. THE NERVOUS SYSTEM ==================== -->
  <g transform="translate(60, 154)">
    <rect x="0" y="0" width="450" height="72" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="10" width="76" height="18" rx="3" fill="#E2E8F0"/>
    <text x="50" y="22.5" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Deterministic</text>
    <text x="98" y="24" font-size="12.5" font-weight="bold" fill="#2D3748">The Nervous System · Timing &amp; Safety</text>
    <text x="438" y="23" font-size="9.5" fill="#64748B" text-anchor="end">Real-Time Control</text>
    
    <text x="14" y="47" font-size="10" font-weight="600" fill="#334155">Timestamped Proposals · Independent Permission · Safety Checks</text>
    <text x="14" y="61" font-size="9" fill="#64748B">Accepts, modifies, or vetoes commands before actuation</text>
  </g>

  <!-- ==================== CAUSAL BOUNDARY ==================== -->
  <g transform="translate(60, 238)">
    <line x1="10" y1="12" x2="60" y2="12" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="390" y1="12" x2="440" y2="12" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="60" y="0" width="330" height="24" rx="12" fill="#FFFFFF" stroke="#A51C30" stroke-width="2"/>
    <text x="225" y="16" font-size="9.5" font-weight="bold" fill="#A51C30" text-anchor="middle" letter-spacing="0.03em">
      CAUSAL BOUNDARY · COMMAND → FORCE
    </text>
  </g>

  <!-- ==================== 3. THE BODY ==================== -->
  <g transform="translate(60, 274)">
    <rect x="0" y="0" width="450" height="74" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="2"/>
    <rect x="12" y="10" width="68" height="18" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="46" y="22.5" font-size="9" font-weight="bold" fill="#A51C30" text-anchor="middle">1000 Hz</text>
    <text x="90" y="24" font-size="12.5" font-weight="bold" fill="#A51C30">The Body · Actuation &amp; Mechanics</text>
    <text x="438" y="23" font-size="9.5" font-weight="bold" fill="#A51C30" text-anchor="end">Motors / Drives</text>
    
    <text x="14" y="48" font-size="10" font-weight="600" fill="#334155">Inverters · Gearboxes · Force · Momentum · Heat</text>
    <text x="14" y="62" font-size="9" fill="#64748B">Delivers bounded motion after permission; physical limits remain</text>
  </g>

  <!-- ==================== 4. THE PHYSICAL PLANT ==================== -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="450" height="74" rx="4" fill="#2D3748" stroke="#1F407A" stroke-width="2"/>
    <rect x="12" y="10" width="76" height="18" rx="3" fill="#1F407A"/>
    <text x="50" y="22.5" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Continuous</text>
    <text x="98" y="24" font-size="12.5" font-weight="bold" fill="#FFFFFF">The Physical Plant · Current into Motion</text>
    <text x="438" y="23" font-size="9.5" fill="#94A3B8" text-anchor="end">Dynamical Plant</text>
    
    <text x="14" y="48" font-size="10" font-weight="600" fill="#E2E8F0">Inverters · Phase Current · Lorentz Force · Torque (τ) · Momentum (mv)</text>
    <text x="14" y="62" font-size="9" fill="#94A3B8">Stopping distance envelope d_stop ≤ d_clear · Friction &amp; thermal limits</text>
  </g>

  <!-- ==================== 5. THE PHYSICAL WORLD ==================== -->
  <g transform="translate(60, 446)">
    <rect x="0" y="0" width="450" height="68" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4"/>
    <rect x="12" y="10" width="68" height="18" rx="3" fill="#E2E8F0"/>
    <text x="46" y="22.5" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Environment</text>
    <text x="90" y="24" font-size="12.5" font-weight="bold" fill="#2D3748">The Physical World · Continuous Reality</text>
    <text x="438" y="23" font-size="9.5" fill="#64748B" text-anchor="end">Irreversible State</text>
    
    <text x="14" y="46" font-size="10" font-weight="600" fill="#334155">Contact Mechanics · Kinetic Energy · Elastic Collisions · External Disturbances</text>
    <text x="14" y="59" font-size="9" fill="#64748B">Execution ends in physical contact — reality cannot be rolled back or caught by try/catch</text>
  </g>

  <!-- Proposal reaches the nervous system for permission. -->
  <path fill="none" d="M 525 105 L 525 185" stroke="#1F407A" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-navy)"/>
  <text x="536" y="145" font-size="9" font-weight="bold" fill="#1F407A" transform="rotate(90, 536, 145)" text-anchor="middle">Proposal û</text>

  <!-- Permission precedes actuation; the body then produces physical work. -->
  <path fill="none" d="M 525 212 L 525 315" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="536" y="264" font-size="9" font-weight="bold" fill="#A51C30" transform="rotate(90, 536, 264)" text-anchor="middle">Permitted u*</text>
  <path fill="none" d="M 525 315 L 525 395" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="536" y="355" font-size="9" font-weight="bold" fill="#A51C30" transform="rotate(90, 536, 355)" text-anchor="middle">Force / Torque</text>

  <!-- Left Upward Sensory Feedback Loop (Plant -> Brain) -->
  <path fill="none" d="M 60 400 L 32 400 L 32 105 L 53 105" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="20" y="250" font-size="9" font-weight="bold" fill="#475569" transform="rotate(-90, 20, 250)" text-anchor="middle">Sensory Feedback (o_t+1)</text>

  <!-- Bottom Axiom Banner -->
  <g transform="translate(60, 526)">
    <rect x="0" y="0" width="450" height="28" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="225" y="18" font-size="9.5" font-style="italic" fill="#2D3748" text-anchor="middle">
      "Everything upstream proposes, nothing upstream commands; only the safety filter commands."
    </text>
  </g>
</svg>
