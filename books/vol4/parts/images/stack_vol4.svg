<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8f9fa; }
      .box { rx: 8; ry: 8; stroke-width: 2; }
      .box-brain { fill: #e3f2fd; stroke: #1976d2; }
      .box-nervous { fill: #f3e5f5; stroke: #7b1fa2; }
      .box-body { fill: #e8f5e9; stroke: #388e3c; }
      .box-boundary { fill: #fff3e0; stroke: #f57c00; }
      .box-world { fill: #ffebee; stroke: #d32f2f; stroke-dasharray: 4; }
      
      .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #212121; }
      .subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; fill: #616161; }
      .header { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #212121; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" class="bg" rx="12" ry="12"/>
  
  <!-- Header -->
  <text x="200" y="40" class="header">The Physical AI Stack</text>
  
  <!-- The Brain -->
  <rect x="40" y="70" width="320" height="70" class="box box-brain"/>
  <text x="200" y="100" class="title" text-anchor="middle">The Brain</text>
  <text x="200" y="120" class="subtitle" text-anchor="middle">Foundation Models, SLAM, Planning</text>

  <!-- The Nervous System -->
  <rect x="40" y="150" width="320" height="70" class="box box-nervous"/>
  <text x="200" y="180" class="title" text-anchor="middle">The Nervous System</text>
  <text x="200" y="200" class="subtitle" text-anchor="middle">TSN, Intent Leases, Lock-Free IPC</text>

  <!-- The Body -->
  <rect x="40" y="230" width="320" height="70" class="box box-body"/>
  <text x="200" y="260" class="title" text-anchor="middle">The Body</text>
  <text x="200" y="280" class="subtitle" text-anchor="middle">Real-Time MCU, Safety Filters, CBFs</text>

  <!-- The Boundary -->
  <rect x="40" y="310" width="320" height="70" class="box box-boundary"/>
  <text x="200" y="340" class="title" text-anchor="middle">The Boundary</text>
  <text x="200" y="360" class="subtitle" text-anchor="middle">Sensors, Actuators, Kinematics</text>

  <!-- The Physical World -->
  <rect x="40" y="390" width="320" height="70" class="box box-world"/>
  <text x="200" y="420" class="title" text-anchor="middle">The Physical World</text>
  <text x="200" y="440" class="subtitle" text-anchor="middle">Contact Mechanics, Friction, Mass</text>
</svg>
