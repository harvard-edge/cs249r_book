<?xml version="1.0" encoding="UTF-8"?>
<!-- Part III opener: the runtime record chain and where each stage runs.
     Numbers drawn (51.6 ms, 60 ms, 1 kHz) are guarded in the Ch12 cell
     calc-enforcement-lease-stop (EnforcementLeaseStop: t_age, lease, tick).
     Placement follows decision M1: discrete safety MCU on a board-level link,
     no memory shared with the application processor.
     Colors: theme-colors.tex roles (measured #007A87, proposal #B87333, structural #1A4D3E). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="680" height="262" fill="#ffffff"/>

  <!-- Proposal boundary (drawn first) -->
  <line x1="534" y1="22" x2="534" y2="150" stroke="#334155" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="534" y="16" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">proposal boundary</text>

  <!-- Stage labels -->
  <text x="72" y="40" font-size="9" fill="#475569" text-anchor="middle">perception</text>
  <text x="183" y="40" font-size="9" fill="#475569" text-anchor="middle">memory</text>
  <text x="294" y="40" font-size="9" fill="#475569" text-anchor="middle">intent</text>
  <text x="405" y="40" font-size="9" fill="#475569" text-anchor="middle">planning</text>
  <text x="604" y="40" font-size="9" fill="#475569" text-anchor="middle">enforcement</text>

  <!-- Record cards -->
  <rect x="24" y="48" width="96" height="62" rx="3" fill="#E6F2F3" stroke="#007A87" stroke-width="1.2"/>
  <text x="72" y="68" font-size="9.5" font-weight="700" fill="#005A63" text-anchor="middle">observation</text>
  <text x="72" y="81" font-size="9.5" font-weight="700" fill="#005A63" text-anchor="middle">contract</text>
  <text x="72" y="99" font-size="8.5" fill="#334155" text-anchor="middle">age 51.6 ms</text>

  <rect x="135" y="48" width="96" height="62" rx="3" fill="#E6F2F3" stroke="#007A87" stroke-width="1.2"/>
  <text x="183" y="68" font-size="9.5" font-weight="700" fill="#005A63" text-anchor="middle">belief</text>
  <text x="183" y="81" font-size="9.5" font-weight="700" fill="#005A63" text-anchor="middle">record</text>
  <text x="183" y="99" font-size="8.5" fill="#334155" text-anchor="middle">evidence epoch</text>

  <rect x="246" y="48" width="96" height="62" rx="3" fill="#F7EEE6" stroke="#B87333" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="294" y="68" font-size="9.5" font-weight="700" fill="#8A5626" text-anchor="middle">intent</text>
  <text x="294" y="81" font-size="9.5" font-weight="700" fill="#8A5626" text-anchor="middle">lease</text>
  <text x="294" y="99" font-size="8.5" fill="#334155" text-anchor="middle">target, expiry</text>

  <rect x="357" y="48" width="96" height="62" rx="3" fill="#F7EEE6" stroke="#B87333" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="405" y="68" font-size="9.5" font-weight="700" fill="#8A5626" text-anchor="middle">trajectory</text>
  <text x="405" y="81" font-size="9.5" font-weight="700" fill="#8A5626" text-anchor="middle">record</text>
  <text x="405" y="99" font-size="8.5" fill="#334155" text-anchor="middle">stop suffix</text>

  <rect x="553" y="48" width="96" height="62" rx="3" fill="#E8F0ED" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="604" y="68" font-size="9.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">enforcement</text>
  <text x="604" y="81" font-size="9.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">record</text>
  <text x="604" y="99" font-size="8.5" fill="#334155" text-anchor="middle">1 kHz, lease 60 ms</text>

  <!-- Chain arrows -->
  <line x1="120" y1="79" x2="133" y2="79" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="231" y1="79" x2="244" y2="79" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="342" y1="79" x2="355" y2="79" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="453" y1="79" x2="551" y2="79" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="493" y="72" font-size="8.5" fill="#475569" text-anchor="middle">proposal</text>

  <!-- Placement record: where each stage runs -->
  <text x="24" y="252" font-size="9.5" font-weight="700" fill="#334155">placement record</text>
  <rect x="24" y="180" width="435" height="54" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="241" y="203" font-size="9.5" font-weight="700" fill="#1E293B" text-anchor="middle">application processor and accelerator</text>
  <text x="241" y="220" font-size="8.5" fill="#475569" text-anchor="middle">shared caches, memory, and clocks</text>

  <rect x="553" y="180" width="102" height="54" rx="0" fill="#F8FAFC" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="604" y="203" font-size="9.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">safety MCU</text>
  <text x="604" y="220" font-size="8.5" fill="#475569" text-anchor="middle">own memory</text>

  <!-- Board-level link -->
  <line x1="459" y1="207" x2="551" y2="207" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>
  <text x="505" y="200" font-size="8.5" fill="#475569" text-anchor="middle">board link</text>
  <text x="505" y="224" font-size="8.5" fill="#475569" text-anchor="middle">no shared memory</text>

  <!-- Stage-to-substrate ties -->
  <line x1="72" y1="110" x2="72" y2="178" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="183" y1="110" x2="183" y2="178" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="294" y1="110" x2="294" y2="178" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="405" y1="110" x2="405" y2="178" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="604" y1="110" x2="604" y2="178" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3"/>
</svg>
