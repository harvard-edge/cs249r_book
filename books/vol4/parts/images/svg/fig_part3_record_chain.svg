<?xml version="1.0" encoding="UTF-8"?>
<!-- Part III opener: the runtime record chain and where each stage runs.
     Numbers drawn (51.6 ms, 60 ms, 1 kHz) are guarded in the Ch12 cell
     calc-enforcement-lease-stop (EnforcementLeaseStop: t_age, lease, tick).
     Intent admission follows @sec-intent-lease: the application processor
     emits an untrusted intent proposal that the safety MCU validates, latches
     in protected memory, and echoes back to planning across the bidirectional
     board link. Placement follows decision M1: discrete safety MCU on a
     board-level link, no memory shared with the application processor.
     Colors: theme-colors.tex roles (measured #007A87, proposal #B87333, structural #1A4D3E). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
  </defs>

  <rect width="680" height="318" fill="#ffffff"/>

  <!-- Proposal boundary (drawn first) -->
  <line x1="494" y1="22" x2="494" y2="212" stroke="#334155" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="494" y="15" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle">proposal boundary</text>

  <!-- Upper MCU card: authoritative intent lease latched on Safety MCU -->
  <rect x="540" y="32" width="124" height="66" rx="3" fill="#E8F0ED" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="602" y="45" font-size="8.5" fill="#475569" text-anchor="middle">intent admission</text>
  <text x="602" y="61" font-size="10" font-weight="700" fill="#1A4D3E" text-anchor="middle">intent lease</text>
  <text x="602" y="76" font-size="8.5" fill="#334155" text-anchor="middle">target, expiry</text>
  <text x="602" y="89" font-size="8.5" fill="#1A4D3E" text-anchor="middle">authoritative copy</text>

  <!-- Main row record cards -->
  <!-- 1. Perception: observation contract -->
  <rect x="16" y="124" width="97" height="68" rx="3" fill="#E6F2F3" stroke="#007A87" stroke-width="1.2"/>
  <text x="64.5" y="137" font-size="8.5" fill="#475569" text-anchor="middle">perception</text>
  <text x="64.5" y="153" font-size="10" font-weight="700" fill="#005A63" text-anchor="middle">observation</text>
  <text x="64.5" y="165" font-size="10" font-weight="700" fill="#005A63" text-anchor="middle">contract</text>
  <text x="64.5" y="182" font-size="8.5" fill="#334155" text-anchor="middle">age 51.6 ms</text>

  <!-- 2. Memory: belief record -->
  <rect x="127" y="124" width="97" height="68" rx="3" fill="#E6F2F3" stroke="#007A87" stroke-width="1.2"/>
  <text x="175.5" y="137" font-size="8.5" fill="#475569" text-anchor="middle">memory</text>
  <text x="175.5" y="153" font-size="10" font-weight="700" fill="#005A63" text-anchor="middle">belief</text>
  <text x="175.5" y="165" font-size="10" font-weight="700" fill="#005A63" text-anchor="middle">record</text>
  <text x="175.5" y="182" font-size="8.5" fill="#334155" text-anchor="middle">evidence epoch</text>

  <!-- 3. Intent (AP): untrusted intent proposal -->
  <rect x="238" y="124" width="97" height="68" rx="3" fill="#F7EEE6" stroke="#B87333" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="286.5" y="137" font-size="8.5" fill="#475569" text-anchor="middle">intent</text>
  <text x="286.5" y="153" font-size="10" font-weight="700" fill="#8A5626" text-anchor="middle">intent</text>
  <text x="286.5" y="165" font-size="10" font-weight="700" fill="#8A5626" text-anchor="middle">proposal</text>
  <text x="286.5" y="182" font-size="8.5" fill="#334155" text-anchor="middle">target request</text>

  <!-- 4. Planning (AP): trajectory record -->
  <rect x="351" y="124" width="97" height="68" rx="3" fill="#F7EEE6" stroke="#B87333" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="399.5" y="137" font-size="8.5" fill="#475569" text-anchor="middle">planning</text>
  <text x="399.5" y="153" font-size="10" font-weight="700" fill="#8A5626" text-anchor="middle">trajectory</text>
  <text x="399.5" y="165" font-size="10" font-weight="700" fill="#8A5626" text-anchor="middle">record</text>
  <text x="399.5" y="182" font-size="8.5" fill="#334155" text-anchor="middle">stop suffix</text>

  <!-- 5. Enforcement (MCU): enforcement record -->
  <rect x="540" y="124" width="124" height="68" rx="3" fill="#E8F0ED" stroke="#1A4D3E" stroke-width="1.5"/>
  <text x="602" y="137" font-size="8.5" fill="#475569" text-anchor="middle">enforcement</text>
  <text x="602" y="153" font-size="10" font-weight="700" fill="#1A4D3E" text-anchor="middle">enforcement</text>
  <text x="602" y="165" font-size="10" font-weight="700" fill="#1A4D3E" text-anchor="middle">record</text>
  <text x="602" y="182" font-size="8.5" fill="#334155" text-anchor="middle">1 kHz, lease 60 ms</text>

  <!-- Chain arrows -->
  <line x1="113" y1="158" x2="125" y2="158" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="224" y1="158" x2="236" y2="158" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Intent proposal across proposal boundary to Safety MCU -->
  <path d="M 286.5 124 L 286.5 52 L 537 52" fill="none" stroke="#B87333" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-bronze)"/>
  <text x="411" y="45" font-size="8.5" font-weight="700" fill="#8A5626" text-anchor="middle">intent proposal</text>

  <!-- Echoed admitted intent lease back across boundary to planning -->
  <path d="M 540 82 L 399.5 82 L 399.5 121" fill="none" stroke="#1A4D3E" stroke-width="1.3" marker-end="url(#arr-pine)"/>
  <text x="444" y="75" font-size="8.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">echoed intent lease</text>

  <!-- Local MCU authoritative bounds from intent lease to enforcement -->
  <line x1="602" y1="98" x2="602" y2="121" stroke="#1A4D3E" stroke-width="1.3" marker-end="url(#arr-pine)"/>
  <text x="610" y="113" font-size="8.5" fill="#1A4D3E" text-anchor="start">bounds</text>

  <!-- Trajectory proposal across proposal boundary to enforcement -->
  <line x1="448" y1="158" x2="537" y2="158" stroke="#B87333" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-bronze)"/>
  <rect x="468" y="137" width="52" height="16" fill="#ffffff"/>
  <rect x="468" y="162" width="52" height="15" fill="#ffffff"/>
  <text x="494" y="148" font-size="8.5" font-weight="700" fill="#8A5626" text-anchor="middle">trajectory</text>
  <text x="494" y="172" font-size="8.5" font-weight="700" fill="#8A5626" text-anchor="middle">proposal</text>

  <!-- Placement record: framed hardware split -->
  <rect x="10" y="216" width="660" height="94" rx="4" fill="#FAFBFD" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="18" y="301" font-size="9.5" font-weight="700" fill="#334155">placement record</text>

  <rect x="16" y="226" width="432" height="56" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
  <text x="232" y="249" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">application processor and accelerator</text>
  <text x="232" y="266" font-size="8.5" fill="#475569" text-anchor="middle">shared caches, memory, and clocks</text>

  <rect x="540" y="226" width="124" height="56" rx="0" fill="#FFFFFF" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="602" y="249" font-size="10" font-weight="700" fill="#1A4D3E" text-anchor="middle">safety MCU</text>
  <text x="602" y="266" font-size="8.5" fill="#475569" text-anchor="middle">own memory</text>

  <!-- Bidirectional board-level link -->
  <line x1="452" y1="254" x2="536" y2="254" stroke="#475569" stroke-width="1.4" marker-start="url(#arr-slate)" marker-end="url(#arr-slate)"/>
  <text x="494" y="245" font-size="8.5" fill="#475569" text-anchor="middle">board link</text>
  <text x="494" y="269" font-size="8.5" fill="#475569" text-anchor="middle">no shared memory</text>

  <!-- Stage-to-substrate ties -->
  <line x1="64.5" y1="192" x2="64.5" y2="225" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="175.5" y1="192" x2="175.5" y2="225" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="286.5" y1="192" x2="286.5" y2="225" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="399.5" y1="192" x2="399.5" y2="225" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="602" y1="192" x2="602" y2="225" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3"/>
</svg>
