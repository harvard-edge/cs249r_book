parts:
  - key: "frontmatter"
    division: "frontmatter"
    type: "division"
    numbered: false
    title: "Frontmatter"
    description: >
      Introductory material framing the foundational systems principles of Physical AI.

  - key: "mainmatter"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Main Text"
    description: >
      The core curriculum of physical AI systems engineering: an introduction, four parts
      each led by one of the book's four laws, and a conclusion.

  # =============================================================================
  # VOLUME IV: PHYSICAL AI: MACHINE LEARNING SYSTEMS THAT SENSE AND ACT
  # =============================================================================

  - key: "volume_4"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Volume IV: Physical AI"
    description: >
      Turning learned capabilities into continuous, measurable, dependable, and accountable
      systems that sense and act in the physical world.

  - key: "vol4_anatomy"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Machine Anatomy"
    description: >
      The first law, irreversibility, turned into budgets. This part measures what the plant
      can do before damage, states what the learned proposer can supply and how fast its
      evidence ages, and derives the permission path's rates and lease from the stopping
      budget. It hands forward the limit record and the handoff record.

  - key: "vol4_learning"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Teaching the Machine"
    description: >
      The second law, endogenous data. This part asks what a learned proposer's competence
      rests on: demonstrations with their absences recorded, training choices with their
      declared domain, and closed-loop evaluation with finite-sample bounds. It hands forward
      an evaluation record and its catalog of uncovered conditions.

  - key: "vol4_runtime"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Running the Machine"
    description: >
      The third law, proposal is not permission. This part follows one chunk stream from a
      timestamped observation through belief, intent, and trajectory to the permission path
      that admits it and the silicon that keeps that path on time.

  - key: "vol4_governance"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Governing the Machine"
    description: >
      The fourth law, evidence bounds authority. This part decides who may command the
      machine, what fault tests establish, and which conditions the machine may enter, and it
      hands its open premises to the conclusion.

  # =============================================================================
  # CONCLUSION & BACKMATTER
  # =============================================================================

  - key: "synthesis"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Conclusion"
    description: >
      The book's opening question answered on the evidence the records support.

  - key: "backmatter"
    division: "backmatter"
    type: "division"
    numbered: false
    title: "Back Matter"
    description: >
      Appendices on control, machine learning, and systems and hardware, a failure-diagnosis
      playbook, the glossary, and the bibliography.

  - key: "references"
    division: "backmatter"
    type: "lab"
    numbered: false
    title: "Bibliography"
    description: >
      Complete bibliography and standards citations.
