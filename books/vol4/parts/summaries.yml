parts:
  - key: "frontmatter"
    division: "frontmatter"
    type: "division"
    numbered: false
    title: "Frontmatter"
    description: >
      Introductory material framing the foundational systems principles of Physical AI.

  - key: "mainmatter"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Main Text"
    description: >
      The core curriculum of physical AI systems engineering organized into four thematic parts.

  # =============================================================================
  # VOLUME IV: PHYSICAL AI: MACHINE LEARNING SYSTEMS THAT SENSE AND ACT
  # =============================================================================

  - key: "volume_4"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Volume IV: Physical AI"
    description: >
      Turning learned capabilities into continuous, measurable, dependable, and accountable
      systems that sense and act in the physical world.

  - key: "vol4_anatomy"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Machine Anatomy"
    description: >
      This part establishes the physical container and structural triad of every embodied
      machine: the physical Body governed by classical mechanics and thermodynamics, the
      deterministic Nervous System enforcing real-time multi-rate transport and safety boundaries,
      and the learned Brain operating as an unprivileged proposal engine.

  - key: "vol4_learning"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Teaching the Machine"
    description: >
      This part investigates the closed causal feedback loop where actions reshape future
      sensory distributions. It covers physical data acquisition and teleoperation metrology,
      continuous action policy formulation across Behavioral Cloning, ACT, and Diffusion,
      and non-asymptotic closed-loop evaluation bounds that supersede static test sets.

  - key: "vol4_runtime"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Running the Machine"
    description: >
      This part details the living organism: the end-to-end millisecond runtime pipeline
      transforming raw sensor photons into physical motor currents. It spans sensor ingestion
      under rolling shutter skew, metric spatial memory, semantic intent leasing, continuous
      trajectory generation, bare-metal Simplex CBF safety shields, and heterogeneous SoC placement.

  - key: "vol4_governance"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Governing the Machine"
    description: >
      This part addresses accountability and survival in the wild. It covers latency-bounded
      shared human-machine authority, the four-stage qualification ladder under physical fault
      injection, auditable Claim-Argument-Evidence safety cases for production release,
      and the foundational epistemic limits of embodied intelligence.

  # =============================================================================
  # SYNTHESIS & BACKMATTER
  # =============================================================================

  - key: "synthesis"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Synthesis"
    description: >
      The concluding synthesis of physical AI systems engineering.

  - key: "backmatter"
    division: "backmatter"
    type: "division"
    numbered: false
    title: "Back Matter"
    description: >
      Appendices, hardware references, mathematical reference cards, standards, and bibliography.

  - key: "references"
    division: "backmatter"
    type: "lab"
    numbered: false
    title: "Bibliography"
    description: >
      Complete bibliography and standards citations.
