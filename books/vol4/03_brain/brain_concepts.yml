  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.inference.bandwidth
      label: Weight bandwidth
      teaches: Memory-wall renewal ceiling
      summary: Memory-transfer capacity available for the model weights needed by a fresh policy evaluation.
      section: sec-brain-memory-wall
    - id: vol4.proposal.chunk
      label: Action chunk
      teaches: Chunking is a supply lever
      summary: A sequence of future setpoints proposed together so one model evaluation supplies several
        control steps.
      section: sec-brain-action-chunking
    - id: vol4.proposal.horizon
      label: Evidence horizon
      teaches: Evidence horizon
      summary: The interval over which observations and assumptions still justify using a proposal; longer
        output does not extend it.
      section: sec-brain-two-proposers
    relationships:
    - id: vol4.field.inference-bandwidth--proposal-chunk
      source: vol4.inference.bandwidth
      predicate: limits renewal of
      target: vol4.proposal.chunk
      explanation: A policy evaluation cannot renew proposals faster than its required weight transfers
        and other dependent computation permit.
      conditions: This is the memory-bound regime for fresh evaluations whose weights do not fit on chip;
        effective shared bandwidth is workload dependent.
      status: draft
      evidence:
        section: sec-brain-memory-wall
        quote: A multi-billion-parameter model takes hundreds of milliseconds on a processor rated at tens
          of tera-operations per second. Its weights do not fit in on-chip static RAM (SRAM) or cache, so
          every fresh evaluation must stream them from off-chip low-power DRAM (LPDDR5) across a narrower
          shared bus. On-chip SRAM and caches can reuse weights and intermediate state without another external
          transfer only while the working set fits the memory allocated to that workload. Nominal chip-wide
          capacity does not guarantee that even a small action head stays resident when competing tasks
          share the processor. When operands cannot reach the arithmetic units as fast as those units can
          multiply them, memory bandwidth, not arithmetic speed, limits the update rate. That ceiling is
          the memory wall\index{Memory wall!physical inference}, and on a moving robot its cost is a delayed
          proposal while the body keeps traveling.
    - id: vol4.field.proposal-chunk--proposal-horizon
      source: vol4.proposal.chunk
      predicate: does not extend
      target: vol4.proposal.horizon
      explanation: Predicting more setpoints supplies motion for longer, while the world continues changing
        and the original evidence keeps aging.
      conditions: Usable execution must remain within independently justified evidence validity and chunk-lease
        limits.
      status: draft
      evidence:
        section: sec-brain-chunk-supply
        quote: 'One INT4 evaluation of the intent model takes `{python} IntentModelLatency.total_int4_str`.
          Over that interval the mug keeps riding the conveyor, and an arm tracking a new setpoint every
          few tens of milliseconds would have nothing to track if each proposal named a single setpoint.
          Predicting a sequence of setpoints per evaluation solves the supply problem but raises a second
          one that the memory wall never touched. Every setpoint in such a sequence descends from one observation,
          so the sequence can outlast the evidence behind it. Sizing those sequences for the machine''s
          two proposers leads to three further questions: how long the supply stays true, what the slow
          proposer should hand the fast one, and what a proposal must carry for the permission path to refuse
          it.'
    - id: vol4.field.proposal-horizon--authority-chunk-lease
      source: vol4.proposal.horizon
      predicate: limits useful duration of
      target: vol4.authority.chunk-lease
      explanation: A renewal mechanism must not grant execution authority beyond the interval for which
        its observation and intent remain justified.
      conditions: The bound also depends on stopping clearance and hard response assumptions; evidence horizon
        and lease are distinct quantities.
      status: draft
      evidence:
        section: sec-brain-two-proposers
        quote: On one clock, the schedule looks like @fig-03-chunk-supply-horizon. With direct replacement,
          each chunk is in force for only `{python} ConveyorChunkSizing.chunk_period_str` before its successor
          replaces it, so motion computed from that capture ends when the capture is `{python} ConveyorChunkSizing.open_loop_str`
          old, inside the `{python} ConveyorChunkSizing.tau_ev_str` evidence horizon. Temporal ensembling
          instead retains contributions from older chunks. A blend must exclude contributions whose evidence
          has expired and carry the oldest capture time among the contributions it retains; the direct-replacement
          timing strip does not bound the age of that blend. If the chunk policy overruns its inference
          target, the notebook's assumption no longer holds, and if renewal stops altogether, a further
          setpoint remains eligible only while both its evidence and the active chunk lease remain valid.
          If the implementation uses temporal ensembling, it must filter expired contributions before blending
          and date the result from the oldest retained evidence; seam continuity and feasibility still require
          independent checks.
