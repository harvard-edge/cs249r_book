<svg xmlns="http://www.w3.org/2000/svg" viewBox="12.8 5.5 954.4 301.4" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-34.9" y="-9.6" width="1049.8" height="331.5" fill="#ffffff"/>
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #0F172A; }
      .signal-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; }
      .gate-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #B91C1C; }
      .warning-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #DC2626; }
    </style>
    <marker id="arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563EB" />
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="980" height="400" fill="#FFFFFF" />

  <!-- ==================== PANEL A: MODULAR PIPELINE ==================== -->
  <g transform="translate(20, 16)">
    <text x="10" y="16" class="panel-title">(a) Modular Pipeline</text>

    <!-- Stage 1: Observe -->
    <g transform="translate(10, 32)">
      <rect width="138" height="48" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
      <text x="69" y="29" class="box-title" text-anchor="middle">1. Observe</text>
      <!-- Rejection Gate RG-1 -->
      <line x1="69" y1="48" x2="69" y2="72" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-red)" />
      <rect x="16" y="76" width="106" height="22" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="69" y="91" class="gate-label" text-anchor="middle">RG-1 Drop</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="148" y1="56" x2="198" y2="56" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-slate)" />

    <!-- Stage 2: Estimate -->
    <g transform="translate(200, 32)">
      <rect width="138" height="48" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
      <text x="69" y="29" class="box-title" text-anchor="middle">2. Estimate</text>
      <!-- Rejection Gate RG-2 -->
      <line x1="69" y1="48" x2="69" y2="72" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-red)" />
      <rect x="16" y="76" width="106" height="22" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="69" y="91" class="gate-label" text-anchor="middle">RG-2 Drift</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="338" y1="56" x2="388" y2="56" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-slate)" />

    <!-- Stage 3: Intend -->
    <g transform="translate(390, 32)">
      <rect width="138" height="48" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
      <text x="69" y="29" class="box-title" text-anchor="middle">3. Intend</text>
      <!-- Rejection Gate RG-3 -->
      <line x1="69" y1="48" x2="69" y2="72" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-red)" />
      <rect x="16" y="76" width="106" height="22" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="69" y="91" class="gate-label" text-anchor="middle">RG-3 Expire</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="528" y1="56" x2="578" y2="56" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-slate)" />

    <!-- Stage 4: Plan -->
    <g transform="translate(580, 32)">
      <rect width="138" height="48" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
      <text x="69" y="29" class="box-title" text-anchor="middle">4. Plan</text>
      <!-- Rejection Gate RG-4 -->
      <line x1="69" y1="48" x2="69" y2="72" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-red)" />
      <rect x="16" y="76" width="106" height="22" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="69" y="91" class="gate-label" text-anchor="middle">RG-4 Infeasible</text>
    </g>

    <!-- Proposal Arrow 4 -> 5 -->
    <line x1="718" y1="56" x2="788" y2="56" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-blue)" />
    <rect x="736" y="38" width="34" height="18" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" />
    <text x="753" y="51" class="signal-label" fill="#1D4ED8" text-anchor="middle">û</text>

    <!-- Stage 5: Enforce -->
    <g transform="translate(790, 32)">
      <rect width="138" height="48" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
      <text x="69" y="29" class="box-title" fill="#166534" text-anchor="middle">5. Enforce</text>
      <!-- Rejection Gate RG-5 -->
      <line x1="69" y1="48" x2="69" y2="72" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-red)" />
      <rect x="16" y="76" width="106" height="22" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="69" y="91" class="gate-label" text-anchor="middle">RG-5 Safe Stop ⊥</text>
    </g>
  </g>

  <!-- Clean Subtle Divider -->
  <line x1="30" y1="175" x2="950" y2="175" stroke="#E2E8F0" stroke-width="1" />

  <!-- ==================== PANEL B: COLLAPSED END-TO-END POLICY ==================== -->
  <g transform="translate(20, 205)">
    <text x="10" y="16" class="panel-title">(b) Collapsed Policy</text>

    <!-- Sensory Ingestion -->
    <g transform="translate(10, 32)">
      <rect width="138" height="52" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="69" y="32" class="box-title" text-anchor="middle">Sensory Ingest</text>
    </g>

    <!-- Arrow Ingest -> Policy -->
    <line x1="148" y1="58" x2="218" y2="58" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-slate)" />

    <!-- Black-Box Policy -->
    <g transform="translate(220, 32)">
      <rect width="478" height="52" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4" />
      <text x="239" y="24" class="box-title" text-anchor="middle">Black-Box Policy</text>
      <text x="239" y="42" class="warning-text" text-anchor="middle">No Rejection Gates</text>
    </g>

    <!-- Unaudited Proposal Arrow -->
    <line x1="698" y1="58" x2="788" y2="58" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-red)" />
    <rect x="736" y="40" width="34" height="18" rx="3" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1" />
    <text x="753" y="53" class="signal-label" fill="#DC2626" text-anchor="middle">û</text>

    <!-- Safety Enforcer -->
    <g transform="translate(790, 32)">
      <rect width="138" height="52" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
      <text x="69" y="32" class="box-title" fill="#166534" text-anchor="middle">Safety Enforcer</text>
    </g>
  </g>
</svg>
