<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
  </defs>

  <rect width="940" height="520" fill="#FFFFFF" rx="4"/>
  <g transform="translate(0, -40)">

  <!-- ==================== PANEL A: CANONICAL MODULAR CHAIN ==================== -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="900" height="240" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="900" height="24" rx="4" fill="#1F407A" fill-opacity="0.08"/>
    <text x="14" y="16.5" font-size="9.5" font-weight="bold" fill="#1F407A">
      PANEL A: CANONICAL MODULAR CHAIN · EXPLICIT INTERFACE CONTRACTS &amp; REJECTION GATES
    </text>
    <text x="886" y="16.5" font-size="9" font-weight="bold" fill="#1F407A" text-anchor="end">
      PROPOSALS û (DASHED) → CERTIFIED COMMANDS u* (SOLID)
    </text>

    <!-- CARD 1: OBSERVE -->
    <g transform="translate(14, 34)">
      <rect x="0" y="0" width="160" height="194" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="0" width="160" height="22" rx="4" fill="#1F407A" fill-opacity="0.10"/>
      <text x="80" y="15" font-size="8.5" font-weight="bold" fill="#1F407A" text-anchor="middle">1. OBSERVE</text>
      <text x="80" y="36" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">Sensory Evidence</text>
      <text x="10" y="54" font-size="8.5" fill="#475569">• Photons, IMU, Encoders</text>
      <text x="10" y="70" font-size="8.5" fill="#475569">• Timestamped O_t + CRC</text>
      <text x="10" y="86" font-size="8.5" fill="#475569">• Hardware error flags</text>
      
      <!-- Rejection Gate -->
      <rect x="8" y="104" width="144" height="80" rx="3" fill="#FEF2F2" stroke="#A51C30" stroke-width="1"/>
      <text x="72" y="120" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">REJECTION GATE</text>
      <text x="72" y="136" font-size="8.5" font-weight="600" fill="#1E293B" text-anchor="middle">RG-1: Desync / Stale</text>
      <text x="72" y="154" font-size="8.5" fill="#A51C30" text-anchor="middle">Drop if delay &gt; 15 ms</text>
      <text x="72" y="172" font-size="8" fill="#64748B" text-anchor="middle">CRC checksum failure</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="174" y1="130" x2="192" y2="130" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-navy)"/>

    <!-- CARD 2: ESTIMATE -->
    <g transform="translate(192, 34)">
      <rect x="0" y="0" width="160" height="194" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="0" width="160" height="22" rx="4" fill="#1F407A" fill-opacity="0.10"/>
      <text x="80" y="15" font-size="8.5" font-weight="bold" fill="#1F407A" text-anchor="middle">2. ESTIMATE</text>
      <text x="80" y="36" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">Metric State Belief</text>
      <text x="10" y="54" font-size="8.5" fill="#475569">• Spatial x̂_t ∈ SE(3)</text>
      <text x="10" y="70" font-size="8.5" fill="#475569">• Velocity v_t, Covariance Σ_t</text>
      <text x="10" y="86" font-size="8.5" fill="#475569">• Tracked frame tree</text>
      
      <!-- Rejection Gate -->
      <rect x="8" y="104" width="144" height="80" rx="3" fill="#FEF2F2" stroke="#A51C30" stroke-width="1"/>
      <text x="72" y="120" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">REJECTION GATE</text>
      <text x="72" y="136" font-size="8.5" font-weight="600" fill="#1E293B" text-anchor="middle">RG-2: Drift / Age</text>
      <text x="72" y="154" font-size="8.5" fill="#A51C30" text-anchor="middle">Reject if age &gt; 50 ms</text>
      <text x="72" y="172" font-size="8" fill="#64748B" text-anchor="middle">Covariance det(Σ) &gt; σ_max</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="352" y1="130" x2="370" y2="130" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-navy)"/>

    <!-- CARD 3: INTEND -->
    <g transform="translate(370, 34)">
      <rect x="0" y="0" width="160" height="194" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="0" width="160" height="22" rx="4" fill="#1F407A" fill-opacity="0.10"/>
      <text x="80" y="15" font-size="8.5" font-weight="bold" fill="#1F407A" text-anchor="middle">3. INTEND</text>
      <text x="80" y="36" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">Semantic Goal Lease</text>
      <text x="10" y="54" font-size="8.5" fill="#475569">• Target goal state G</text>
      <text x="10" y="70" font-size="8.5" fill="#475569">• Bounding volume V_scope</text>
      <text x="10" y="86" font-size="8.5" fill="#475569">• Expiring lease t_expire</text>
      
      <!-- Rejection Gate -->
      <rect x="8" y="104" width="144" height="80" rx="3" fill="#FEF2F2" stroke="#A51C30" stroke-width="1"/>
      <text x="72" y="120" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">REJECTION GATE</text>
      <text x="72" y="136" font-size="8.5" font-weight="600" fill="#1E293B" text-anchor="middle">RG-3: Expired Lease</text>
      <text x="72" y="154" font-size="8.5" fill="#A51C30" text-anchor="middle">Expire if t &gt; t_expire</text>
      <text x="72" y="172" font-size="8" fill="#64748B" text-anchor="middle">Goal outside safe geofence</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="530" y1="130" x2="548" y2="130" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-navy)"/>

    <!-- CARD 4: PLAN (PROPOSES û) -->
    <g transform="translate(548, 34)">
      <rect x="0" y="0" width="160" height="194" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="0" width="160" height="22" rx="4" fill="#1F407A" fill-opacity="0.10"/>
      <text x="80" y="15" font-size="8.5" font-weight="bold" fill="#1F407A" text-anchor="middle">4. PLAN (PROPOSES û)</text>
      <text x="80" y="36" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">Trajectory Chunk</text>
      <text x="10" y="54" font-size="8.5" fill="#475569">• Action chunk A_{t:t+H}</text>
      <text x="10" y="70" font-size="8.5" fill="#475569">• 16 waypoints, C² spline</text>
      <text x="10" y="86" font-size="8.5" fill="#475569">• Smooth jerk envelope</text>
      
      <!-- Rejection Gate -->
      <rect x="8" y="104" width="144" height="80" rx="3" fill="#FEF2F2" stroke="#A51C30" stroke-width="1"/>
      <text x="72" y="120" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">REJECTION GATE</text>
      <text x="72" y="136" font-size="8.5" font-weight="600" fill="#1E293B" text-anchor="middle">RG-4: Infeasibility</text>
      <text x="72" y="154" font-size="8.5" fill="#A51C30" text-anchor="middle">Reject if q̈ &gt; a_max</text>
      <text x="72" y="172" font-size="8" fill="#64748B" text-anchor="middle">Singularity or torque spike</text>
    </g>

    <!-- Proposal Arrow 4 -> 5 (Dashed û crossing Causal Boundary) -->
    <line x1="708" y1="130" x2="726" y2="130" stroke="#1F407A" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-navy)"/>
    <text x="717" y="122" font-size="8.5" font-weight="bold" fill="#1F407A" text-anchor="middle">û</text>

    <!-- CARD 5: ENFORCE (REAL-TIME CAUSAL GATE) -->
    <g transform="translate(726, 34)">
      <rect x="0" y="0" width="160" height="194" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="2"/>
      <rect x="0" y="0" width="160" height="22" rx="4" fill="#FEF2F2"/>
      <text x="80" y="15" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">5. ENFORCE (GATES u*)</text>
      <text x="80" y="36" font-size="10" font-weight="bold" fill="#A51C30" text-anchor="middle">Real-Time Barrier (1 kHz)</text>
      <text x="10" y="54" font-size="8.5" fill="#475569">• 1 kHz QP Solver h(x) ≥ 0</text>
      <text x="10" y="70" font-size="8.5" fill="#475569">• Stopping check d_stop</text>
      <text x="10" y="86" font-size="8.5" fill="#475569">• Sole permission gate</text>
      
      <!-- Rejection Gate -->
      <rect x="8" y="104" width="144" height="80" rx="3" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.5"/>
      <text x="72" y="120" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">FINAL REJECTION GATE</text>
      <text x="72" y="136" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">RG-5: Barrier Breach</text>
      <text x="72" y="154" font-size="9" font-weight="bold" fill="#A51C30" text-anchor="middle">VETO → Safe-Stop ⊥</text>
      <text x="72" y="172" font-size="8" fill="#64748B" text-anchor="middle">Override uncertified û</text>
    </g>
  </g>

  <!-- ==================== PANEL B: COLLAPSED END-TO-END POLICY ==================== -->
  <g transform="translate(20, 316)">
    <rect x="0" y="0" width="900" height="150" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <rect x="0" y="0" width="900" height="24" rx="4" fill="#A51C30" fill-opacity="0.08"/>
    <text x="14" y="16.5" font-size="9.5" font-weight="bold" fill="#A51C30">
      PANEL B: COLLAPSED END-TO-END POLICY · OPAQUE LATENT STATE &amp; LOST INSPECTION INTERFACES
    </text>
    <text x="886" y="16.5" font-size="9" font-weight="bold" fill="#A51C30" text-anchor="end">
      HIGH RISK: ZERO INTERMEDIATE REJECTION GATES
    </text>

    <!-- Raw Sensory Ingest -->
    <g transform="translate(14, 36)">
      <rect x="0" y="0" width="150" height="98" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2"/>
      <text x="75" y="32" font-size="10" font-weight="bold" fill="#1F407A" text-anchor="middle">RAW SENSORY INGEST</text>
      <text x="75" y="54" font-size="9" fill="#475569" text-anchor="middle">Camera RGB Pixels</text>
      <text x="75" y="70" font-size="9" fill="#475569" text-anchor="middle">&amp; Natural Language</text>
      <text x="75" y="88" font-size="8.5" fill="#64748B" text-anchor="middle">Input Tensor O_t</text>
    </g>

    <!-- Arrow Ingest -> Black Box -->
    <line x1="164" y1="85" x2="190" y2="85" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

    <!-- Black-Box Policy Container -->
    <g transform="translate(190, 36)">
      <rect x="0" y="0" width="510" height="98" rx="4" fill="#FFFFFF" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="255" y="20" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">
        BLACK-BOX END-TO-END VLA / DIFFUSION POLICY (OPAQUE LATENT MAP)
      </text>
      
      <!-- Four Lost Gates -->
      <g transform="translate(14, 30)">
        <rect x="0" y="0" width="112" height="56" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
        <text x="56" y="22" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">⚠ Lost Sensory Check</text>
        <text x="56" y="42" font-size="8" fill="#64748B" text-anchor="middle">No CRC / desync gate</text>

        <rect x="124" y="0" width="112" height="56" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
        <text x="180" y="22" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">⚠ Lost State Audit</text>
        <text x="180" y="42" font-size="8" fill="#64748B" text-anchor="middle">No SE(3) covariance Σ_t</text>

        <rect x="248" y="0" width="112" height="56" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
        <text x="304" y="22" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">⚠ Lost Lease Expiry</text>
        <text x="304" y="42" font-size="8" fill="#64748B" text-anchor="middle">No timeout t_expire</text>

        <rect x="372" y="0" width="110" height="56" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
        <text x="427" y="22" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">⚠ Lost Kinematic Gate</text>
        <text x="427" y="42" font-size="8" fill="#64748B" text-anchor="middle">No jerk / singular check</text>
      </g>
    </g>

    <!-- Arrow Black Box -> Unaudited Proposal -->
    <line x1="700" y1="85" x2="726" y2="85" stroke="#A51C30" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>

    <!-- Unaudited Motor Proposal -->
    <g transform="translate(726, 36)">
      <rect x="0" y="0" width="160" height="98" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.8"/>
      <text x="80" y="24" font-size="9.5" font-weight="bold" fill="#A51C30" text-anchor="middle">UNAUDITED PROPOSAL</text>
      <text x="80" y="42" font-size="8.5" fill="#475569" text-anchor="middle">Direct Joint Torques / PWM</text>
      <text x="80" y="62" font-size="9" font-weight="bold" fill="#A51C30" text-anchor="middle">Enforcer Must Catch ALL</text>
      <text x="80" y="82" font-size="8" fill="#64748B" text-anchor="middle">At 1 kHz without context</text>
    </g>
  </g>

  <!-- ==================== ARCHITECTURAL TAKEAWAY ==================== -->
  <g transform="translate(20, 480)">
    <rect x="0" y="0" width="900" height="60" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="450" y="24" font-size="11" font-weight="bold" fill="#1F407A" text-anchor="middle">
      ARCHITECTURAL TAKEAWAY: COLLAPSING STAGES CONCEALS BUT DOES NOT ELIMINATE HAZARDS
    </text>
    <text x="450" y="44" font-size="9.5" fill="#475569" text-anchor="middle">
      Modular contracts allow each boundary to refuse invalid inputs before they consume compute or threaten physical safety.
    </text>
  </g>
</g>
</svg>
