<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Vol IV roles (tex/theme-colors.tex): measured = petrol #007A87,
       proposal = bronze #B87333, structural = pine #1A4D3E; hardware in slate
       with sharp corners. No red: nothing here is a consequence.
       The 1 kHz tick is guarded by the brain-two-speed-rates cell
       (TwoSpeedRates.f_tick) in 03_brain.qmd. -->
  <rect width="680" height="262" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- ===== Application processor region (learned stages) ===== -->
  <path d="M 184 20 L 660 20 L 660 112 L 332 112 L 332 236 L 14 236 L 14 128 L 184 128 Z"
        fill="#FCF8F4" stroke="#B87333" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="196" y="34" font-size="9.5" font-weight="700" fill="#1A202C">Application processor: learned stages</text>

  <!-- ===== Row 1: sensing to belief ===== -->
  <rect x="24" y="48" width="130" height="46" rx="0" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="89" y="67" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Sensors</text>
  <text x="89" y="82" font-size="8.5" fill="#4A5568" text-anchor="middle">cameras, IMU, encoders</text>

  <rect x="196" y="48" width="130" height="46" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="261" y="67" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Ingestion</text>
  <text x="261" y="82" font-size="8.5" fill="#4A5568" text-anchor="middle">hands on: tokens</text>

  <rect x="360" y="48" width="130" height="46" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="425" y="67" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Perception</text>
  <text x="425" y="82" font-size="8.5" fill="#4A5568" text-anchor="middle">hands on: pose + age</text>

  <rect x="522" y="48" width="130" height="46" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="587" y="67" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Memory</text>
  <text x="587" y="82" font-size="8.5" fill="#4A5568" text-anchor="middle">hands on: belief + epoch</text>

  <line x1="154" y1="71" x2="194" y2="71" stroke="#007A87" stroke-width="1.2" marker-end="url(#arr-petrol)"/>
  <line x1="326" y1="71" x2="358" y2="71" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="490" y1="71" x2="520" y2="71" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- wrap from Memory down to Intent, routed through the gap between rows -->
  <path d="M 587 94 L 587 120 L 89 120 L 89 144" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- ===== Row 2: intent and planning, then the proposal boundary ===== -->
  <rect x="24" y="146" width="130" height="46" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="89" y="165" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Intent</text>
  <text x="89" y="180" font-size="8.5" fill="#4A5568" text-anchor="middle">hands on: intent lease</text>

  <rect x="186" y="146" width="130" height="46" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="251" y="165" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Planning</text>
  <text x="251" y="180" font-size="8.5" fill="#4A5568" text-anchor="middle">hands on: candidate setpoints</text>

  <line x1="154" y1="169" x2="184" y2="169" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-bronze)"/>

  <!-- proposal boundary: neutral partition of authority -->
  <line x1="372" y1="130" x2="372" y2="248" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="380" y="248" font-size="9" font-weight="700" font-style="italic" fill="#4A5568">proposal boundary</text>

  <line x1="316" y1="169" x2="410" y2="169" stroke="#B87333" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-bronze)"/>
  <text x="391" y="162" font-size="8.5" fill="#B87333" text-anchor="middle">proposal</text>

  <rect x="412" y="146" width="126" height="46" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="475" y="165" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Permission path</text>
  <text x="475" y="180" font-size="8.5" fill="#4A5568" text-anchor="middle">safety MCU · 1 kHz tick</text>

  <line x1="538" y1="169" x2="580" y2="169" stroke="#1A4D3E" stroke-width="1.2" marker-end="url(#arr-pine)"/>
  <text x="559" y="151" font-size="8.5" fill="#1A4D3E" text-anchor="middle">admitted</text>
  <text x="559" y="161" font-size="8.5" fill="#1A4D3E" text-anchor="middle">command</text>

  <rect x="582" y="146" width="80" height="46" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
  <text x="622" y="165" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Drives</text>
  <text x="622" y="180" font-size="8.5" fill="#4A5568" text-anchor="middle">and plant</text>
</svg>
