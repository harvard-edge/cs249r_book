<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 200" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-56.0" y="-10.0" width="1232.0" height="220.0" fill="#ffffff"/>
  <defs>
    <style>
      .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0F172A; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748B; }
      .signal-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #1D4ED8; }
      .boundary-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #B91C1C; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
    <marker id="arrow-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569" />
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1120" height="200" fill="#FFFFFF" />

  <!-- 0. Sensors -->
  <rect x="24" y="65" width="105" height="66" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="76" y="94" text-anchor="middle" class="box-title">Sensors</text>
  <text x="76" y="112" text-anchor="middle" class="box-sub">Photons &amp; IMU</text>

  <!-- Arrow -->
  <line x1="129" y1="98" x2="149" y2="98" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-slate)" />

  <!-- 1. Ingestion -->
  <rect x="151" y="65" width="115" height="66" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="208" y="94" text-anchor="middle" class="box-title">Ingestion</text>
  <text x="208" y="112" text-anchor="middle" class="box-sub">Tokenization</text>

  <!-- Arrow -->
  <line x1="266" y1="98" x2="286" y2="98" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-slate)" />

  <!-- 2. Perception -->
  <rect x="288" y="65" width="115" height="66" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="345" y="94" text-anchor="middle" class="box-title">Perception</text>
  <text x="345" y="112" text-anchor="middle" class="box-sub">Spatial State</text>

  <!-- Arrow -->
  <line x1="403" y1="98" x2="423" y2="98" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-slate)" />

  <!-- 3. Memory -->
  <rect x="425" y="65" width="115" height="66" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="482" y="94" text-anchor="middle" class="box-title">Memory</text>
  <text x="482" y="112" text-anchor="middle" class="box-sub">World Belief</text>

  <!-- Arrow -->
  <line x1="540" y1="98" x2="560" y2="98" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-slate)" />

  <!-- 4. Intent -->
  <rect x="562" y="65" width="115" height="66" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="619" y="94" text-anchor="middle" class="box-title">Intent</text>
  <text x="619" y="112" text-anchor="middle" class="box-sub">Goal Leases</text>

  <!-- Arrow -->
  <line x1="677" y1="98" x2="697" y2="98" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-slate)" />

  <!-- 5. Planning -->
  <rect x="699" y="65" width="115" height="66" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="756" y="94" text-anchor="middle" class="box-title">Planning</text>
  <text x="756" y="112" text-anchor="middle" class="box-sub">Action Chunks</text>

  <!-- Boundary Line -->
  <line x1="875" y1="44" x2="875" y2="165" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3" />
  <rect x="805" y="24" width="140" height="20" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="875" y="38" text-anchor="middle" class="boundary-text">Privilege Boundary</text>

  <!-- Proposal Flow across Boundary -->
  <line x1="814" y1="98" x2="930" y2="98" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <rect x="840" y="87" width="70" height="20" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
  <text x="875" y="101" text-anchor="middle" class="signal-label">Proposal û</text>

  <!-- 6. Real-Time Reflexes -->
  <rect x="938" y="65" width="155" height="66" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="1015" y="93" text-anchor="middle" class="box-title" fill="#166534">Reflexes (1 kHz)</text>
  <text x="1015" y="111" text-anchor="middle" class="box-sub" fill="#15803D">Certified u*</text>
</svg>
