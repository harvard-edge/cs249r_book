<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 285" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1F407A; }
      .box-title { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; }
      .box-sub { font-family: Helvetica, Arial, sans-serif; font-size: 10.5px; }
      .badge-text { font-family: Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; }
    </style>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A51C30" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="285" fill="#FFFFFF" />
  <g transform="translate(0, -35)">
  
  <!-- ==================== FLOW BLOCKS ==================== -->

  <!-- 1. Physical Sensors -->
  <rect x="30" y="115" width="115" height="75" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="87" y="146" text-anchor="middle" class="box-title" fill="#1E293B">Sensors</text>
  <text x="87" y="164" text-anchor="middle" class="box-sub" fill="#64748B">Cameras, LiDAR</text>
  <text x="87" y="177" text-anchor="middle" class="box-sub" fill="#64748B">IMU, Encoders</text>

  <!-- Arrow -->
  <line x1="145" y1="152" x2="167" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 2. Ingestion (Ch 4) -->
  <rect x="175" y="115" width="125" height="75" rx="4" fill="#1F407A" stroke="#1F407A" stroke-width="1.5"/>
  <text x="237" y="143" text-anchor="middle" class="box-title" fill="#FFFFFF">Ingestion</text>
  <text x="237" y="160" text-anchor="middle" class="box-sub" fill="#93C5FD">Tokenization</text>
  <text x="237" y="175" text-anchor="middle" class="box-sub" fill="#BFDBFE">Chapter 4</text>

  <!-- Arrow -->
  <line x1="300" y1="152" x2="322" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 3. Perception (Ch 8) -->
  <rect x="330" y="115" width="125" height="75" rx="4" fill="#1F407A" stroke="#1F407A" stroke-width="1.5"/>
  <text x="392" y="143" text-anchor="middle" class="box-title" fill="#FFFFFF">Perception</text>
  <text x="392" y="160" text-anchor="middle" class="box-sub" fill="#93C5FD">Spatial &amp; Affordance</text>
  <text x="392" y="175" text-anchor="middle" class="box-sub" fill="#BFDBFE">Chapter 8</text>

  <!-- Arrow -->
  <line x1="455" y1="152" x2="477" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 4. Memory (Ch 9) -->
  <rect x="485" y="115" width="125" height="75" rx="4" fill="#1F407A" stroke="#1F407A" stroke-width="1.5"/>
  <text x="547" y="143" text-anchor="middle" class="box-title" fill="#FFFFFF">Memory</text>
  <text x="547" y="160" text-anchor="middle" class="box-sub" fill="#93C5FD">World Model Belief</text>
  <text x="547" y="175" text-anchor="middle" class="box-sub" fill="#BFDBFE">Chapter 9</text>

  <!-- Arrow -->
  <line x1="610" y1="152" x2="632" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 5. Intent (Ch 10) -->
  <rect x="640" y="115" width="125" height="75" rx="4" fill="#1F407A" stroke="#1F407A" stroke-width="1.5"/>
  <text x="702" y="143" text-anchor="middle" class="box-title" fill="#FFFFFF">Intent</text>
  <text x="702" y="160" text-anchor="middle" class="box-sub" fill="#93C5FD">Goal Leases</text>
  <text x="702" y="175" text-anchor="middle" class="box-sub" fill="#BFDBFE">Chapter 10</text>

  <!-- Arrow -->
  <line x1="765" y1="152" x2="787" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)" />

  <!-- 6. Planning (Ch 11) -->
  <rect x="795" y="115" width="130" height="75" rx="4" fill="#1F407A" stroke="#1F407A" stroke-width="1.5"/>
  <text x="860" y="143" text-anchor="middle" class="box-title" fill="#FFFFFF">Planning</text>
  <text x="860" y="160" text-anchor="middle" class="box-sub" fill="#93C5FD">Action Chunks (H)</text>
  <text x="860" y="175" text-anchor="middle" class="box-sub" fill="#BFDBFE">Chapter 11</text>

  <!-- Proposal Flow Across Boundary -->
  <line x1="925" y1="152" x2="1035" y2="152" stroke="#1F407A" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <rect x="940" y="132" width="75" height="20" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1" />
  <text x="977" y="146" text-anchor="middle" class="badge-text" fill="#1F407A" font-size="10.5px">Proposal û</text>

  <!-- Boundary Line -->
  <line x1="977" y1="65" x2="977" y2="128" stroke="#A51C30" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="977" y1="156" x2="977" y2="240" stroke="#A51C30" stroke-width="2" stroke-dasharray="4,4" />
  
  <rect x="895" y="65" width="165" height="22" rx="3" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" />
  <text x="977" y="80" text-anchor="middle" class="badge-text" fill="#A51C30" font-size="10.5px">Proposal / Permission</text>
  <text x="977" y="255" text-anchor="middle" class="badge-text" fill="#A51C30" font-size="11px">Privilege Boundary</text>

  <!-- 7. Real-Time Reflexes / Enforcer (Ch 12-14) -->
  <rect x="1045" y="115" width="130" height="75" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="2"/>
  <text x="1110" y="142" text-anchor="middle" class="box-title" fill="#A51C30">Reflexes (u*)</text>
  <text x="1110" y="159" text-anchor="middle" class="box-sub" fill="#0F172A">Deterministic 1 kHz</text>
  <text x="1110" y="174" text-anchor="middle" class="box-sub" fill="#64748B">Chapters 12–14</text>

  <!-- Subtitle Takeaway -->
  <rect x="30" y="268" width="1145" height="34" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="600" y="289" text-anchor="middle" class="box-sub" fill="#475569" font-size="11px">Pipeline Stages: Unchecked semantic generation upstream (Ch 4–11) is certified against physical safety constraints before actuation (Ch 12–14).</text>
</g>
</svg>
