<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Vol IV roles (tex/theme-colors.tex): measured = petrol #007A87 for
       sensed inputs, proposal = bronze #B87333 for everything the learned
       model computes, structural = pine #1A4D3E for the permission path,
       hardware in slate with sharp corners. No red: nothing drawn here is a
       consequence. Rebuilt at the 680 px house canvas (was 980 px). -->
  <rect width="680" height="404" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- ===== proposal boundary (drawn first so everything sits over it) ===== -->
  <line x1="20" y1="312" x2="660" y2="312" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="232" y="302" width="96" height="16" fill="#ffffff"/>
  <text x="280" y="314" font-size="9" font-weight="700" font-style="italic" fill="#4A5568" text-anchor="middle">proposal boundary</text>

  <!-- ==================== 1. Ingestion ==================== -->
  <rect x="20" y="16" width="200" height="274" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="32" y="34" font-size="10.5" font-weight="700" fill="#1A202C">1. Ingestion</text>

  <!-- image patches -->
  <rect x="30" y="44" width="180" height="58" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1"/>
  <rect x="40" y="52" width="42" height="42" fill="#ffffff" stroke="#007A87" stroke-width="0.8"/>
  <line x1="54" y1="52" x2="54" y2="94" stroke="#9CCDD3" stroke-width="0.7"/>
  <line x1="68" y1="52" x2="68" y2="94" stroke="#9CCDD3" stroke-width="0.7"/>
  <line x1="40" y1="66" x2="82" y2="66" stroke="#9CCDD3" stroke-width="0.7"/>
  <line x1="40" y1="80" x2="82" y2="80" stroke="#9CCDD3" stroke-width="0.7"/>
  <rect x="54" y="66" width="14" height="14" fill="#007A87" fill-opacity="0.35" stroke="#007A87" stroke-width="1"/>
  <text x="94" y="66" font-size="9.5" font-weight="700" fill="#1A202C">Image patches</text>
  <text x="94" y="80" font-size="8.5" fill="#4A5568"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="6.5">patch</tspan> × <tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="6.5">patch</tspan>,</text>
  <text x="94" y="92" font-size="8.5" fill="#4A5568">position, camera</text>

  <!-- language prompt -->
  <rect x="30" y="110" width="180" height="52" rx="3" fill="#F8FAFC" stroke="#A0AEC0" stroke-width="1"/>
  <text x="40" y="127" font-size="9.5" font-weight="700" fill="#1A202C">Language prompt</text>
  <rect x="40" y="136" width="40" height="16" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="60" y="148" font-size="8.5" fill="#1A202C" text-anchor="middle">grasp</text>
  <rect x="86" y="136" width="36" height="16" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="104" y="148" font-size="8.5" fill="#1A202C" text-anchor="middle">mug</text>
  <rect x="128" y="136" width="46" height="16" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1"/>
  <text x="151" y="148" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle">handle</text>

  <!-- robot state -->
  <rect x="30" y="170" width="180" height="34" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1"/>
  <text x="40" y="191" font-size="9.5" font-weight="700" fill="#1A202C">Robot state</text>
  <text x="200" y="191" font-size="8.5" fill="#4A5568" text-anchor="end">joint encoders</text>

  <!-- token sequence Z -->
  <rect x="30" y="224" width="180" height="56" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="40" y="241" font-size="9.5" font-weight="700" fill="#1A202C">Token sequence <tspan font-style="italic">Z</tspan></text>
  <rect x="40" y="250" width="72" height="20" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="0.8"/>
  <text x="76" y="263.5" font-size="8.5" fill="#1A202C" text-anchor="middle">visual</text>
  <rect x="116" y="250" width="40" height="20" rx="3" fill="#F8FAFC" stroke="#A0AEC0" stroke-width="0.8"/>
  <text x="136" y="263.5" font-size="8.5" fill="#1A202C" text-anchor="middle">text</text>
  <rect x="160" y="250" width="40" height="20" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="0.8"/>
  <text x="180" y="263.5" font-size="8.5" fill="#1A202C" text-anchor="middle">state</text>

  <!-- Z to backbone -->
  <text x="229" y="246" font-size="9" font-style="italic" fill="#1A202C" text-anchor="middle">Z</text>

  <!-- ==================== 2. Transformer ==================== -->
  <rect x="240" y="16" width="200" height="274" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="252" y="34" font-size="10.5" font-weight="700" fill="#1A202C">2. Transformer</text>

  <rect x="250" y="44" width="180" height="156" rx="3" fill="#FCF8F4" stroke="#B87333" stroke-width="1"/>
  <text x="260" y="61" font-size="9.5" font-weight="700" fill="#1A202C">Self-attention</text>
  <!-- illustrative attention weights: darker = larger weight -->
  <g transform="translate(270, 74)">
    <rect x="0" y="0" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="22" y="0" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="44" y="0" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="66" y="0" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="0" y="22" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="22" y="22" width="20" height="20" fill="#EBCFB3" stroke="#D9AE85"/>
    <rect x="44" y="22" width="20" height="20" fill="#D19A63" stroke="#B87333"/>
    <rect x="66" y="22" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="0" y="44" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="22" y="44" width="20" height="20" fill="#D19A63" stroke="#B87333"/>
    <rect x="44" y="44" width="20" height="20" fill="#8A5424" stroke="#6B401A"/>
    <rect x="66" y="44" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="0" y="66" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="22" y="66" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="44" y="66" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
    <rect x="66" y="66" width="20" height="20" fill="#ffffff" stroke="#E8D5C2"/>
  </g>
  <text x="366" y="112" font-size="8.5" fill="#4A5568">attention</text>
  <text x="366" y="124" font-size="8.5" fill="#4A5568">weights</text>
  <text x="340" y="186" font-size="8.5" fill="#4A5568" text-anchor="middle">tokens × tokens, illustrative</text>

  <line x1="340" y1="200" x2="340" y2="222" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <rect x="250" y="224" width="180" height="56" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="340" y="248" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Conditioning latent <tspan font-style="italic">h</tspan></text>
  <text x="340" y="264" font-size="8.5" fill="#4A5568" text-anchor="middle">one context per observation</text>

  <!-- h to the decoders: one bus, three branches -->
  <path d="M 430 252 L 450 252 L 450 78" fill="none" stroke="#B87333" stroke-width="1.5"/>

  <!-- ==================== 3. Action decoders ==================== -->
  <rect x="460" y="16" width="200" height="274" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="472" y="34" font-size="10.5" font-weight="700" fill="#1A202C">3. Action decoders</text>

  <!-- autoregressive tokens: one evaluation per token -->
  <rect x="470" y="44" width="180" height="62" rx="3" fill="#FCF8F4" stroke="#B87333" stroke-width="1"/>
  <text x="480" y="60" font-size="9.5" font-weight="700" fill="#1A202C">Autoregressive tokens</text>
  <polyline points="484,94 514,94 514,82 546,82 546,74 582,74 582,88 612,88 612,78 638,78" fill="none" stroke="#B87333" stroke-width="1.5"/>

  <!-- one-pass chunk head -->
  <rect x="470" y="114" width="180" height="62" rx="3" fill="#FCF8F4" stroke="#B87333" stroke-width="1"/>
  <text x="480" y="130" font-size="9.5" font-weight="700" fill="#1A202C">One-pass chunk head</text>
  <path d="M 484 162 C 510 142, 536 170, 562 152 S 614 140, 638 150" fill="none" stroke="#B87333" stroke-width="1.5"/>
  <circle cx="484" cy="162" r="2.4" fill="#B87333"/>
  <circle cx="523" cy="154" r="2.4" fill="#B87333"/>
  <circle cx="562" cy="152" r="2.4" fill="#B87333"/>
  <circle cx="600" cy="145" r="2.4" fill="#B87333"/>
  <circle cx="638" cy="150" r="2.4" fill="#B87333"/>

  <!-- iterative action expert: several refinement passes -->
  <rect x="470" y="184" width="180" height="62" rx="3" fill="#FCF8F4" stroke="#B87333" stroke-width="1"/>
  <text x="480" y="200" font-size="9.5" font-weight="700" fill="#1A202C">Iterative action expert</text>
  <polyline points="484,226 494,216 504,232 514,214 524,230 534,218 544,234 554,220" fill="none" stroke="#D9AE85" stroke-width="1" stroke-dasharray="2,1.5"/>
  <line x1="560" y1="224" x2="574" y2="224" stroke="#A0AEC0" stroke-width="1" marker-end="url(#arr-slate)"/>
  <path d="M 580 232 C 596 214, 614 236, 638 220" fill="none" stroke="#B87333" stroke-width="1.5"/>

  <text x="560" y="272" font-size="9" fill="#1A202C" text-anchor="middle">candidate chunk <tspan font-weight="700">A</tspan><tspan baseline-shift="sub" font-size="7" font-style="italic">t:t+H−1</tspan></text>

  <!-- ==================== 4. Across the proposal boundary ==================== -->
  <!-- proposal: dashed, it carries no authority -->
  <line x1="470" y1="290" x2="470" y2="330" stroke="#B87333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-bronze)"/>
  <text x="478" y="304" font-size="8.5" font-weight="700" fill="#B87333">proposal</text>

  <rect x="360" y="332" width="140" height="44" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.5"/>
  <text x="430" y="351" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Permission path</text>
  <text x="430" y="366" font-size="8.5" fill="#4A5568" text-anchor="middle">1 kHz tick</text>

  <line x1="500" y1="354" x2="558" y2="354" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-pine)"/>
  <text x="529" y="347" font-size="8.5" fill="#1A4D3E" text-anchor="middle">admitted</text>

  <rect x="560" y="332" width="100" height="44" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="610" y="358" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Actuators</text>

  <!-- measured state returns to ingestion (bottom perimeter) -->
  <path d="M 610 376 L 610 392 L 120 392 L 120 292" fill="none" stroke="#007A87" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-petrol)"/>
  <rect x="160" y="384" width="90" height="16" rx="3" fill="#ffffff" stroke="#9CCDD3" stroke-width="1"/>
  <text x="205" y="395.5" font-size="8.5" fill="#007A87" text-anchor="middle">state feedback</text>
  <!-- connectors drawn last so their arrowheads sit over the panel frames -->
  <line x1="210" y1="252" x2="248" y2="252" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <line x1="450" y1="78" x2="468" y2="78" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-bronze)"/>
  <line x1="450" y1="148" x2="468" y2="148" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-bronze)"/>
  <line x1="450" y1="218" x2="468" y2="218" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-bronze)"/>
</svg>
