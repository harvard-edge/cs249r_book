<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="100%" height="100%">
  <defs>
    <style>
      .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1E293B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #0F172A; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #64748B; }
      .signal-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; }
      .boundary-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; fill: #B91C1C; text-transform: uppercase; letter-spacing: 0.5px; }
      .token-chip { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; fill: #334155; }
    </style>
    <marker id="arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563EB" />
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16A34A" />
    </marker>
    <marker id="arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#0D9488" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="980" height="430" fill="#FFFFFF" />

  <!-- ==================== COLUMN 1: SENSORY INGESTION ==================== -->
  <g transform="translate(20, 16)">
    <rect width="260" height="388" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="16" y="24" class="col-header">1. Ingestion</text>

    <!-- Image Patches -->
    <g transform="translate(14, 36)">
      <rect width="232" height="66" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <!-- Mini Patch Grid -->
      <g transform="translate(10, 10)">
        <rect width="44" height="44" fill="#FFFFFF" stroke="#93C5FD" stroke-width="0.8" />
        <line x1="14.6" y1="0" x2="14.6" y2="44" stroke="#BFDBFE" stroke-width="0.7" stroke-dasharray="2 2" />
        <line x1="29.3" y1="0" x2="29.3" y2="44" stroke="#BFDBFE" stroke-width="0.7" stroke-dasharray="2 2" />
        <line x1="0" y1="14.6" x2="44" y2="14.6" stroke="#BFDBFE" stroke-width="0.7" stroke-dasharray="2 2" />
        <line x1="0" y1="29.3" x2="44" y2="29.3" stroke="#BFDBFE" stroke-width="0.7" stroke-dasharray="2 2" />
        <rect x="14.6" y="14.6" width="14.6" height="14.6" fill="#DC2626" fill-opacity="0.25" stroke="#DC2626" stroke-width="1" />
      </g>
      <text x="66" y="37" class="box-title">Image Patches</text>
    </g>

    <!-- Language Prompt -->
    <g transform="translate(14, 112)">
      <rect width="232" height="52" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="14" y="20" class="box-title">Language Prompt</text>
      <!-- Tokens -->
      <g transform="translate(14, 28)">
        <rect x="0" y="0" width="44" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="22" y="12" class="token-chip" text-anchor="middle">Grasp</text>
        <rect x="48" y="0" width="38" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="67" y="12" class="token-chip" text-anchor="middle">mug</text>
        <rect x="90" y="0" width="50" height="16" rx="3" fill="#FEF2F2" stroke="#FCA5A5" />
        <text x="115" y="12" class="token-chip" fill="#B91C1C" font-weight="600" text-anchor="middle">handle</text>
      </g>
    </g>

    <!-- Robot State -->
    <g transform="translate(14, 174)">
      <rect width="232" height="48" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="14" y="29" class="box-title">Robot State</text>
    </g>

    <!-- Downward Arrows to Token Sequence Z -->
    <line x1="130" y1="222" x2="130" y2="242" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-slate)" />

    <!-- Unified Token Sequence Z -->
    <g transform="translate(14, 246)">
      <rect width="232" height="66" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2" />
      <text x="14" y="22" class="box-title" fill="#1D4ED8">Token Sequence Z</text>
      <!-- Segmented Bar -->
      <g transform="translate(12, 32)">
        <rect x="0" y="0" width="96" height="20" rx="3" fill="#DBEAFE" stroke="#93C5FD" />
        <text x="48" y="13" class="token-chip" fill="#1E40AF" text-anchor="middle">Visual</text>
        <rect x="100" y="0" width="52" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="126" y="13" class="token-chip" text-anchor="middle">Text</text>
        <rect x="156" y="0" width="50" height="20" rx="3" fill="#DCFCE7" stroke="#86EFAC" />
        <text x="181" y="13" class="token-chip" fill="#166534" text-anchor="middle">State</text>
      </g>
    </g>
  </g>

  <!-- Arrow from Column 1 to Column 2 -->
  <line x1="280" y1="295" x2="312" y2="295" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />
  <rect x="286" y="284" width="20" height="16" rx="2" fill="#FFFFFF" />
  <text x="296" y="296" class="signal-label" fill="#1D4ED8" text-anchor="middle">Z</text>

  <!-- ==================== COLUMN 2: MULTIMODAL TRANSFORMER ==================== -->
  <g transform="translate(315, 16)">
    <rect width="265" height="388" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="16" y="24" class="col-header">2. Transformer</text>

    <!-- Cross-Attention Card -->
    <g transform="translate(14, 36)">
      <rect width="237" height="196" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="14" y="24" class="box-title" fill="#1D4ED8">Cross-Attention</text>

      <!-- 4x4 Affordance Heatmap -->
      <g transform="translate(38, 46)">
        <!-- Row 0 -->
        <rect x="0" y="0" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <rect x="24" y="0" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <rect x="48" y="0" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <rect x="72" y="0" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <!-- Row 1 -->
        <rect x="0" y="24" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <rect x="24" y="24" width="22" height="22" fill="#FCA5A5" stroke="#F87171" />
        <rect x="48" y="24" width="22" height="22" fill="#EF4444" stroke="#DC2626" />
        <rect x="72" y="24" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <!-- Row 2 -->
        <rect x="0" y="48" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <rect x="24" y="48" width="22" height="22" fill="#EF4444" stroke="#DC2626" />
        <rect x="48" y="48" width="22" height="22" fill="#991B1B" stroke="#7F1D1D" />
        <rect x="72" y="48" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <!-- Row 3 -->
        <rect x="0" y="72" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <rect x="24" y="72" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <rect x="48" y="72" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <rect x="72" y="72" width="22" height="22" fill="#FEE2E2" stroke="#FECACA" />
        <circle cx="59" cy="59" r="3.5" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.2" />
      </g>
      <text x="146" y="104" class="signal-label" fill="#991B1B">Peak Target</text>
    </g>

    <!-- Downward Arrow to Latent -->
    <line x1="132" y1="232" x2="132" y2="252" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-slate)" />

    <!-- Conditioning Latent h -->
    <g transform="translate(14, 256)">
      <rect width="237" height="56" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
      <text x="118" y="33" class="box-title" fill="#15803D" text-anchor="middle">Conditioning Latent h</text>
    </g>
  </g>

  <!-- Connectors from Backbone to Column 3 -->
  <path d="M 580 284 L 600 284 L 600 71 L 618 71" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-slate)" />
  <path d="M 580 284 L 600 284 L 600 164 L 618 164" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)" />

  <!-- ==================== COLUMN 3: ACTION DECODERS & ENFORCEMENT ==================== -->
  <g transform="translate(620, 16)">
    <rect width="340" height="388" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="16" y="24" class="col-header">3. Action Decoders</text>

    <!-- Discrete Autoregressive Tokens -->
    <g transform="translate(14, 34)">
      <rect width="312" height="74" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" />
      <text x="14" y="24" class="box-title" fill="#92400E">Discrete Autoregressive</text>
      <!-- Stepped Staircase Curve -->
      <path d="M 14 54 L 60 54 L 60 42 L 120 42 L 120 30 L 190 30 L 190 46 L 250 46 L 250 36 L 298 36" fill="none" stroke="#D97706" stroke-width="1.8" />
    </g>

    <!-- Continuous Action Chunking -->
    <g transform="translate(14, 120)">
      <rect width="312" height="88" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
      <text x="14" y="24" class="box-title" fill="#166534">Action Chunking</text>
      <!-- Smooth Spline Curve -->
      <path d="M 16 56 C 55 28, 95 66, 145 40 C 190 18, 230 52, 296 32" fill="none" stroke="#059669" stroke-width="2.2" />
      <circle cx="16" cy="56" r="2.8" fill="#059669" />
      <circle cx="80" cy="44" r="2.8" fill="#059669" />
      <circle cx="145" cy="40" r="2.8" fill="#059669" />
      <circle cx="210" cy="34" r="2.8" fill="#059669" />
      <circle cx="296" cy="32" r="2.8" fill="#059669" />
    </g>

    <!-- Downward Proposal Flow crossing Boundary -->
    <line x1="90" y1="208" x2="90" y2="260" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-blue)" />
    <rect x="100" y="222" width="66" height="18" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" />
    <text x="133" y="235" class="signal-label" fill="#1D4ED8" text-anchor="middle">Proposal û</text>

    <!-- Privilege Boundary Line -->
    <g transform="translate(0, 240)">
      <line x1="6" y1="0" x2="334" y2="0" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3" />
      <rect x="180" y="-10" width="145" height="20" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="252" y="4" class="boundary-lbl" text-anchor="middle">Privilege Boundary</text>
    </g>

    <!-- Safety Shield & Actuators Tier -->
    <g transform="translate(14, 265)">
      <!-- Safety Shield -->
      <rect width="180" height="56" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
      <text x="90" y="33" class="box-title" fill="#166534" text-anchor="middle">Safety Shield (1 kHz)</text>

      <!-- Arrow to Actuators -->
      <line x1="180" y1="28" x2="204" y2="28" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arr-green)" />
      <text x="192" y="20" class="signal-label" fill="#166534" text-anchor="middle">u*</text>

      <!-- Actuators -->
      <rect x="206" y="0" width="106" height="56" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="259" y="33" class="box-title" text-anchor="middle">Actuators</text>
    </g>
  </g>

  <!-- Physical Plant Feedback Loop (Perimeter) -->
  <path d="M 885 390 L 885 415 L 150 415 L 150 388" fill="none" stroke="#0D9488" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-teal)" />
  <rect x="440" y="405" width="100" height="18" rx="3" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1" />
  <text x="490" y="418" class="signal-label" fill="#0D9488" text-anchor="middle">State Feedback</text>
</svg>
