<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: bold; fill: #1e293b; }
      .subcard-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: bold; }
      .data-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.8px; font-weight: 500; }
      .sub-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.2px; fill: #64748b; }
      .pill-text-white { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.2px; font-weight: bold; fill: #ffffff; }
      .pill-text-blue { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: bold; fill: #1e3a8a; }
      .axis-tick { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #475569; font-weight: 500; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.8px; fill: #334155; font-weight: bold; }
    </style>
    <marker id="arr-axis" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Header -->
  <text x="18" y="24" class="card-title">Action Chunk Horizon Budget: Starvation vs. Dynamic Drift</text>
  
  <!-- Invariant Pill Badge (Top Right) -->
  <rect x="372" y="13" width="150" height="16" rx="8" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="447" y="24.5" class="pill-text-blue" text-anchor="middle">Δt = 20 ms · t_infer = 160 ms</text>

  <!-- ==================== SUB-CARD 1: STARVATION CLIFF (LEFT) ==================== -->
  <rect x="18" y="36" width="234" height="88" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <rect x="24" y="42" width="104" height="13" rx="6.5" fill="#c44"/>
  <text x="76" y="51.5" class="pill-text-white" text-anchor="middle">BUFFER STARVATION</text>
  
  <text x="24" y="67" class="subcard-header" fill="#7f1d1d">H &lt; H_min (Underflow Cliff &lt; 8 steps · 160 ms)</text>
  <text x="24" y="79" class="data-label" fill="#7f1d1d">• Buffer empties before next NPU inference completes</text>
  <text x="24" y="90" class="data-label" fill="#7f1d1d">• Actuator queue underflow forces open-loop zero hold</text>
  <text x="24" y="101" class="data-label" fill="#7f1d1d">• Induces joint halt, motion shudder &amp; torque chatter</text>
  <text x="24" y="114" class="sub-label" fill="#991b1b">Lower bound: H_min = t_infer / Δt = 160 ms / 20 ms = 8 steps</text>

  <!-- ==================== SUB-CARD 2: FEASIBLE WINDOW (CENTER) ==================== -->
  <rect x="258" y="36" width="116" height="88" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <rect x="264" y="42" width="94" height="13" rx="6.5" fill="#3d9e5a"/>
  <text x="311" y="51.5" class="pill-text-white" text-anchor="middle">FEASIBLE WINDOW</text>
  
  <text x="264" y="67" class="subcard-header" fill="#14532d">H ∈ [8, 12] (160–240 ms)</text>
  <text x="264" y="79" class="data-label" fill="#14532d">• H_exec = 10 (nominal)</text>
  <text x="264" y="90" class="data-label" fill="#14532d">• +40 ms compute margin</text>
  <text x="264" y="101" class="data-label" fill="#14532d">• Drift: Δx = 10 &lt; 15 mm</text>
  <text x="264" y="114" class="sub-label" fill="#166534">5 Hz receded horizon</text>

  <!-- ==================== SUB-CARD 3: DYNAMIC DRIFT CLIFF (RIGHT) ==================== -->
  <rect x="380" y="36" width="142" height="88" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <rect x="386" y="42" width="106" height="13" rx="6.5" fill="#c44"/>
  <text x="439" y="51.5" class="pill-text-white" text-anchor="middle">DYNAMIC DRIFT CLIFF</text>
  
  <text x="386" y="67" class="subcard-header" fill="#7f1d1d">H &gt; H_max (&gt; 12 steps · 240 ms)</text>
  <text x="386" y="79" class="data-label" fill="#7f1d1d">• Open-loop drift: Δx = ½ a t²</text>
  <text x="386" y="90" class="data-label" fill="#7f1d1d">• Breaches clearance (&gt;15 mm)</text>
  <text x="386" y="101" class="data-label" fill="#7f1d1d">• H=64 → Δx = 410 mm (27×!)</text>
  <text x="386" y="114" class="sub-label" fill="#991b1b">Upper bound: H_max = 12 steps</text>

  <!-- Projection Lines down to timeline -->
  <line x1="258" y1="124" x2="258" y2="148" stroke="#c44" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="316" y1="124" x2="316" y2="148" stroke="#3d9e5a" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="374" y1="124" x2="374" y2="148" stroke="#c44" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- ==================== HORIZONTAL TIMELINE AXIS ==================== -->
  <!-- Axis Title Label (Placed cleanly on left above line) -->
  <text x="24" y="141" class="axis-title">Execution Timeline &amp; Horizon Steps H:</text>

  <!-- Axis line -->
  <line x1="24" y1="148" x2="518" y2="148" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-axis)"/>

  <!-- Ticks & Markers -->
  <!-- H = 0 -->
  <line x1="34" y1="144" x2="34" y2="152" stroke="#64748b" stroke-width="1"/>
  <text x="34" y="161" class="axis-tick" text-anchor="middle">H = 0</text>
  <text x="34" y="171" class="sub-label" text-anchor="middle">0 ms</text>

  <!-- H = 4 -->
  <line x1="146" y1="145" x2="146" y2="151" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="146" y="161" class="axis-tick" text-anchor="middle">H = 4</text>
  <text x="146" y="171" class="sub-label" text-anchor="middle">80 ms</text>

  <!-- H_min = 8 (Threshold) -->
  <line x1="258" y1="141" x2="258" y2="155" stroke="#c44" stroke-width="1.5"/>
  <polygon points="258,141 254,134 262,134" fill="#c44"/>
  <text x="258" y="161" class="axis-tick" fill="#c44" font-weight="bold" text-anchor="middle">H_min = 8</text>
  <text x="258" y="171" class="sub-label" fill="#c44" text-anchor="middle">160 ms</text>

  <!-- H_exec = 10 (Optimal Operating Setpoint) -->
  <line x1="316" y1="142" x2="316" y2="154" stroke="#3d9e5a" stroke-width="1.5"/>
  <circle cx="316" cy="148" r="3" fill="#3d9e5a" stroke="#ffffff" stroke-width="1"/>
  <text x="316" y="161" class="axis-tick" fill="#14532d" font-weight="bold" text-anchor="middle">H_exec = 10</text>
  <text x="316" y="171" class="sub-label" fill="#14532d" text-anchor="middle">200 ms (nominal)</text>

  <!-- H_max = 12 (Threshold) -->
  <line x1="374" y1="141" x2="374" y2="155" stroke="#c44" stroke-width="1.5"/>
  <polygon points="374,141 370,134 378,134" fill="#c44"/>
  <text x="374" y="161" class="axis-tick" fill="#c44" font-weight="bold" text-anchor="middle">H_max = 12</text>
  <text x="374" y="171" class="sub-label" fill="#c44" text-anchor="middle">240 ms</text>

  <!-- H = 16 -->
  <line x1="486" y1="145" x2="486" y2="151" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="486" y="161" class="axis-tick" text-anchor="middle">H = 16</text>
  <text x="486" y="171" class="sub-label" text-anchor="middle">320 ms</text>
</svg>
