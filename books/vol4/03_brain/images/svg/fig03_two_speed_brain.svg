<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="100%">
  <defs>
    <style>
      .realm-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #0F172A; }
      .signal-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; }
      .boundary-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #B91C1C; text-transform: uppercase; letter-spacing: 0.5px; }
      .loop-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #475569; }
    </style>
    <marker id="arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563EB" />
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#DC2626" />
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="410" fill="#FFFFFF" />

  <!-- ==================== REALM 1: DELIBERATIVE REALM (LEFT) ==================== -->
  <g transform="translate(30, 32)">
    <rect width="415" height="350" rx="8" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.2" stroke-dasharray="5 4" />
    <text x="20" y="26" class="realm-title" fill="#1D4ED8">Deliberative Realm (1–50 Hz)</text>

    <!-- Ingestion & Belief -->
    <g transform="translate(20, 42)">
      <rect width="375" height="48" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
      <text x="187" y="29" class="box-title" text-anchor="middle">Sensory Ingestion</text>
    </g>

    <!-- Downward Arrow to Policy -->
    <line x1="207" y1="90" x2="207" y2="116" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-slate)" />

    <!-- Deliberative Policy -->
    <g transform="translate(20, 118)">
      <rect width="375" height="56" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2" />
      <text x="187" y="33" class="box-title" text-anchor="middle">Deliberative Policy</text>
    </g>

    <!-- Upward Arrow from Re-sync to Policy -->
    <line x1="207" y1="250" x2="207" y2="184" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-slate)" />

    <!-- State Re-synchronization -->
    <g transform="translate(20, 252)">
      <rect width="375" height="48" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" />
      <text x="187" y="29" class="box-title" fill="#B45309" text-anchor="middle">State Re-synchronization</text>
    </g>
  </g>

  <!-- ==================== CENTRAL PRIVILEGE BOUNDARY ==================== -->
  <line x1="480" y1="32" x2="480" y2="385" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 4" />
  <rect x="375" y="14" width="210" height="24" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
  <text x="480" y="30" class="boundary-lbl" text-anchor="middle">Proposal–Permission Boundary</text>

  <!-- ==================== REALM 2: REAL-TIME REALM (RIGHT) ==================== -->
  <g transform="translate(515, 32)">
    <rect width="415" height="350" rx="8" fill="#F8FAFC" stroke="#86EFAC" stroke-width="1.2" />
    <text x="20" y="26" class="realm-title" fill="#15803D">Real-Time Realm (1000 Hz)</text>

    <!-- Reflex Ingress -->
    <g transform="translate(20, 42)">
      <rect width="335" height="48" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
      <text x="167" y="29" class="box-title" fill="#166534" text-anchor="middle">Reflex Sensors &amp; Encoders (1000 Hz)</text>
    </g>

    <!-- Downward Arrow from Reflex Sensors to Safety Enforcer -->
    <line x1="187" y1="90" x2="187" y2="116" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)" />

    <!-- Safety Enforcer -->
    <g transform="translate(20, 118)">
      <rect width="335" height="56" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
      <text x="167" y="33" class="box-title" fill="#166534" text-anchor="middle">Safety Enforcer</text>
    </g>

    <!-- Downward Arrow to Actuators -->
    <line x1="187" y1="174" x2="187" y2="244" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arr-green)" />
    <rect x="195" y="202" width="82" height="20" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
    <text x="236" y="216" class="signal-label" fill="#15803D" text-anchor="middle">Certified <tspan font-style="italic" font-weight="700">u</tspan><tspan dy="-3" font-size="8.5px" font-weight="700">*</tspan></text>

    <!-- Actuators -->
    <g transform="translate(20, 252)">
      <rect width="335" height="48" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="167" y="29" class="box-title" text-anchor="middle">Actuators</text>
    </g>

    <!-- 1 kHz State Feedback Loop (Perimeter) -->
    <path d="M 355 276 L 385 276 L 385 146 L 363 146" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-slate)" />
    <text x="395" y="211" class="loop-label" text-anchor="middle" transform="rotate(-90 395 211)">1 kHz State Loop</text>
  </g>

  <!-- ==================== CROSS-BOUNDARY SIGNALS ==================== -->
  <!-- Signal 1: Proposal û (Left to Right) -->
  <line x1="425" y1="178" x2="527" y2="178" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-blue)" />
  <rect x="445" y="167" width="70" height="22" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" />
  <text x="480" y="182" class="signal-label" fill="#1D4ED8" text-anchor="middle">Proposal <tspan font-style="italic" font-weight="700">û</tspan></text>

  <!-- Signal 2: Refusal Event (Right to Left feedback) -->
  <path d="M 535 198 L 505 198 L 505 308 L 433 308" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arr-red)" />
  <rect x="447" y="297" width="66" height="22" rx="3" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" />
  <text x="480" y="312" class="signal-label" fill="#DC2626" text-anchor="middle">Refusal</text>
</svg>