<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 605" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1F407A; }
      .realm-title { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; }
      .realm-sub { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .card-title { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; }
      .card-body { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #2D3748; }
      .card-body-muted { font-family: Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #64748B; }
      .badge-text { font-family: Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; }
      .footer-text { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    
    <marker id="arrow-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F407A" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A51C30" />
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2D3748" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="605" fill="#FFFFFF" />
  <g transform="translate(0, -45)">

  <!-- ==================== REALM 1: UNTRUSTED DELIBERATIVE REALM ==================== -->
  <rect x="40" y="70" width="420" height="490" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="2" stroke-dasharray="6,4" />
  <text x="65" y="98" class="realm-title" fill="#1F407A">Untrusted Deliberative Realm</text>
  <text x="65" y="116" class="realm-sub">Cadence: 1 – 50 Hz • Stochastic • Rich Semantics</text>

  <!-- Ingestion / Perception Ingress Card -->
  <rect x="65" y="132" width="370" height="66" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="80" y="154" class="card-title" fill="#1F407A">Perceptual Ingestion &amp; Tokenization</text>
  <text x="80" y="172" class="card-body">Multimodal Sensory Streams (Cameras, LiDAR, Proprioception)</text>
  <text x="80" y="186" class="card-body-muted">Asynchronous frame ingestion at sensor native rate (10–30 Hz)</text>

  <!-- Arrow down from Ingestion to Models -->
  <line x1="250" y1="198" x2="250" y2="222" stroke="#1F407A" stroke-width="2" marker-end="url(#arrow-navy)" />

  <!-- Deliberative Models Card -->
  <rect x="65" y="222" width="370" height="150" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.5" />
  <rect x="65" y="222" width="370" height="28" rx="3" fill="#1F407A" />
  <text x="80" y="241" class="badge-text" fill="#FFFFFF">Deliberative Policies &amp; World Models (Ch 10–11)</text>
  
  <text x="80" y="270" class="card-body" font-weight="bold">• Vision-Language-Action (VLA) Foundation Models</text>
  <text x="95" y="286" class="card-body-muted">Autoregressive token generation / Diffusion trajectory synthesis</text>
  
  <text x="80" y="306" class="card-body" font-weight="bold">• Semantic Intent Leases &amp; Waypoint Horizons</text>
  <text x="95" y="322" class="card-body-muted">Emits multi-step action chunks {a_t, ..., a_t+H} (H = 8–32 waypoints)</text>

  <text x="80" y="342" class="card-body" font-weight="bold">• Candidate Action Proposal Formation</text>
  <text x="95" y="358" class="card-body-muted">Payload: û = {τ_cmd, ω_target, t_lease, signature}</text>

  <!-- State Resync / Re-plan Card (Bottom Left) -->
  <rect x="65" y="415" width="370" height="75" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="80" y="438" class="card-title" fill="#1E40AF">State Re-synchronization &amp; Rollout Re-anchor</text>
  <text x="80" y="456" class="card-body">Triggered whenever safety enforcer rejects or clamps an action chunk.</text>
  <text x="80" y="472" class="card-body-muted">Re-aligns internal latent belief with verified physical state x_t.</text>

  <!-- Re-sync feedback up to deliberative models -->
  <line x1="250" y1="415" x2="250" y2="378" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-navy)" />


  <!-- ==================== REALM 2: TRUSTED REAL-TIME REALM ==================== -->
  <rect x="560" y="70" width="420" height="490" rx="4" fill="#F8FAFC" stroke="#A51C30" stroke-width="2" />
  <text x="645" y="98" class="realm-title" fill="#A51C30">Trusted Real-time Realm</text>
  <text x="645" y="116" class="realm-sub">Cadence: 1000 Hz Deterministic • Provably Safe Logic</text>

  <!-- Real-Time Enforcer Card -->
  <rect x="585" y="222" width="370" height="150" rx="3" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.5" />
  <rect x="585" y="222" width="370" height="28" rx="3" fill="#A51C30" />
  <text x="600" y="241" class="badge-text" fill="#FFFFFF">1 kHz Deterministic Safety Enforcer (Ch 12–14)</text>

  <text x="600" y="270" class="card-body" font-weight="bold">• Control Barrier Function (CBF) Invariance Check</text>
  <text x="615" y="286" class="card-body-muted">h(x) ≥ 0 evaluated every 1 ms against obstacle field</text>

  <text x="600" y="306" class="card-body" font-weight="bold">• Kinematic Stopping Envelope Verification</text>
  <text x="615" y="322" class="card-body-muted">Confirms remaining clearance &gt; d_stop(v) before grant</text>

  <text x="600" y="342" class="card-body" font-weight="bold">• Safe Fallback Clamping / Interlocking</text>
  <text x="615" y="358" class="card-body-muted">Smoothly projects unsafe û to verified safe boundary u*</text>

  <!-- Actuator Interface Card (rx=0 for hardware registers) -->
  <rect x="585" y="415" width="370" height="75" rx="0" fill="#2D3748" stroke="#1E293B" stroke-width="1.5" />
  <text x="600" y="438" class="badge-text" fill="#F8FAFC">Actuator Drive Subsystem (Registers &amp; PWM)</text>
  <text x="600" y="458" class="card-body" fill="#E2E8F0">Certified Execution: Inverter Current / Joint Torque Applied (u*)</text>
  <text x="600" y="474" class="card-body-muted" fill="#94A3B8">Hardware interlocking drops power if heartbeat deadline expires.</text>


  <!-- ==================== CENTRAL PRIVILEGE BOUNDARY (Rendered above realms) ==================== -->
  <line x1="510" y1="60" x2="510" y2="565" stroke="#2D3748" stroke-width="2" stroke-dasharray="6,4" />
  
  <rect x="395" y="68" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#2D3748" stroke-width="1.5" />
  <text x="510" y="86" text-anchor="middle" class="badge-text" fill="#2D3748">Proposal–Permission Boundary</text>


  <!-- ==================== CROSS-BOUNDARY SIGNALS ==================== -->
  <!-- Signal 1: Action Proposal û from Deliberative Models to Enforcer (Straight Horizontal at y=275) -->
  <line x1="435" y1="275" x2="577" y2="275" stroke="#1F407A" stroke-width="2.5" marker-end="url(#arrow-navy)" />
  <rect x="460" y="264" width="100" height="22" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1" />
  <text x="510" y="279" text-anchor="middle" class="badge-text" fill="#1F407A">Proposal û</text>

  <!-- Signal 2: Clamp / Rejection Feedback from Enforcer to State Re-sync (Step routed cleanly at x=480, away from boundary at x=510) -->
  <path d="M 585 340 L 480 340 L 480 445 L 443 445" fill="none" stroke="#A51C30" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-red)" />
  <rect x="435" y="329" width="90" height="22" rx="3" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" />
  <text x="480" y="344" text-anchor="middle" class="badge-text" fill="#A51C30">Clamp Event</text>

  <!-- Vertical Permission Grant inside Trusted Realm (y=372 to 415) -->
  <line x1="770" y1="372" x2="770" y2="407" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-slate)" />
  <rect x="780" y="380" width="150" height="22" rx="3" fill="#F0FDF4" stroke="#16A34A" stroke-width="1" />
  <text x="855" y="395" text-anchor="middle" class="badge-text" fill="#15803D">Certified Command u*</text>

  <!-- 1000 Hz State Feedback Loop (Perimeter) -->
  <path d="M 955 452 L 990 452 L 990 275 L 963 275" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow-slate)" />
  <rect x="965" y="348" width="90" height="20" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" transform="rotate(-90 1010 358)" />
  <text x="1010" y="362" text-anchor="middle" class="card-body" font-size="10px" font-weight="bold" fill="#2D3748" transform="rotate(-90 1010 358)">1 kHz State Loop</text>


  <!-- ==================== FOOTER TAKEAWAY ==================== -->
  <rect x="40" y="580" width="940" height="48" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="510" y="600" text-anchor="middle" class="footer-text" font-weight="bold">Architectural Principle: Untrusted deliberative models propose actions; trusted real-time enforcers certify safety.</text>
  <text x="510" y="618" text-anchor="middle" class="footer-text">Physical actuators are only energized by certified commands u* that strictly maintain the kinematic stopping invariant.</text>
</g>
</svg>