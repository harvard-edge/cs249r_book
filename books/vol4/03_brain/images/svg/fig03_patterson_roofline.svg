<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1E293B; }
      .tick-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748B; font-weight: 500; }
      .regime-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
      .point-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #0F172A; }
      .point-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #64748B; }
      .roof-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="480" fill="#FFFFFF"/>

  <!-- Plot Canvas -->
  <rect x="90" y="60" width="820" height="355" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Shaded Regimes -->
  <polygon points="90,415 640,105 90,105" fill="#EFF6FF" fill-opacity="0.8"/>
  <polygon points="640,105 910,105 910,415 640,415" fill="#F0FDF4" fill-opacity="0.7"/>

  <!-- Grid Lines (Vertical X) -->
  <line x1="90" y1="60" x2="90" y2="415" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="226" y1="60" x2="226" y2="415" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="363" y1="60" x2="363" y2="415" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="500" y1="60" x2="500" y2="415" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="636" y1="60" x2="636" y2="415" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="773" y1="60" x2="773" y2="415" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="910" y1="60" x2="910" y2="415" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Grid Lines (Horizontal Y) -->
  <line x1="90" y1="415" x2="910" y2="415" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="90" y1="337" x2="910" y2="337" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="90" y1="259" x2="910" y2="259" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="90" y1="181" x2="910" y2="181" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="90" y1="105" x2="910" y2="105" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Regime Labels -->
  <text x="280" y="84" class="regime-label" fill="#1D4ED8" text-anchor="middle">Memory-Bound</text>
  <text x="775" y="84" class="regime-label" fill="#15803D" text-anchor="middle">Compute-Bound</text>

  <!-- Ceiling Dashed Extension -->
  <line x1="90" y1="105" x2="640" y2="105" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Patterson Roofline: Sloped Memory Bound + Horizontal Compute Ceiling -->
  <line x1="90" y1="415" x2="640" y2="105" stroke="#D97706" stroke-width="2.5"/>
  <line x1="640" y1="105" x2="910" y2="105" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Roofline Ceiling Labels -->
  <text x="260" y="250" class="roof-label" fill="#B45309" transform="rotate(-29.5 260 250)">Memory Bandwidth (205 GB/s)</text>
  <text x="895" y="96" class="roof-label" fill="#1E293B" text-anchor="end">Peak Compute (275 TFLOP/s)</text>

  <!-- Ridge Point (Knee) -->
  <line x1="640" y1="105" x2="640" y2="415" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="640" cy="105" r="4.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="630" y="95" class="point-label" fill="#DC2626" text-anchor="end">Ridge Point</text>

  <!-- Operating Points -->
  <!-- 1. Autoregressive VLA -->
  <circle cx="105" cy="406" r="4.5" fill="#DC2626"/>
  <line x1="105" y1="406" x2="105" y2="350" stroke="#CBD5E1" stroke-width="1"/>
  <text x="112" y="340" class="point-label" fill="#B91C1C">Autoregressive VLA</text>
  <text x="112" y="353" class="point-sub">(Single-token)</text>

  <!-- 2. Action Chunking -->
  <circle cx="363" cy="259" r="4.5" fill="#2563EB"/>
  <text x="380" y="285" class="point-label" fill="#1D4ED8">Action Chunking</text>
  <text x="380" y="298" class="point-sub">(Amortized reads)</text>

  <!-- 3. Diffusion Policy -->
  <circle cx="500" cy="181" r="4.5" fill="#0284C7"/>
  <line x1="500" y1="181" x2="500" y2="152" stroke="#CBD5E1" stroke-width="1"/>
  <text x="500" y="136" class="point-label" fill="#0369A1" text-anchor="middle">Diffusion Policy</text>
  <text x="500" y="148" class="point-sub" text-anchor="middle">(Denoising)</text>

  <!-- 4. Vision Transformer -->
  <circle cx="773" cy="105" r="4.5" fill="#1E293B"/>
  <text x="773" y="125" class="point-label" text-anchor="middle">Vision Transformer</text>
  <text x="773" y="138" class="point-sub" text-anchor="middle">(Batch compute)</text>

  <!-- X-Axis Labels -->
  <text x="90" y="434" class="tick-label" text-anchor="middle">0.1</text>
  <text x="226" y="434" class="tick-label" text-anchor="middle">1.0</text>
  <text x="363" y="434" class="tick-label" text-anchor="middle">10</text>
  <text x="500" y="434" class="tick-label" text-anchor="middle">100</text>
  <text x="636" y="434" class="tick-label" text-anchor="middle">10³</text>
  <text x="773" y="434" class="tick-label" text-anchor="middle">10⁴</text>
  <text x="910" y="434" class="tick-label" text-anchor="middle">10⁵</text>
  <text x="500" y="460" class="axis-title" text-anchor="middle">Arithmetic Intensity (FLOP / Byte)</text>

  <!-- Y-Axis Labels -->
  <text x="80" y="418" class="tick-label" text-anchor="end">0.1</text>
  <text x="80" y="340" class="tick-label" text-anchor="end">1.0</text>
  <text x="80" y="262" class="tick-label" text-anchor="end">10</text>
  <text x="80" y="184" class="tick-label" text-anchor="end">100</text>
  <text x="80" y="108" class="tick-label" text-anchor="end">275</text>
  <text x="35" y="237" class="axis-title" text-anchor="middle" transform="rotate(-90 35 237)">Attainable Throughput (TFLOP / s)</text>
</svg>
