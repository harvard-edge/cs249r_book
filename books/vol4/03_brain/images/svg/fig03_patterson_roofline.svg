<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 518" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-weight: bold; font-size: 17px; fill: #1F407A; text-anchor: middle; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .axis-title { font-family: Helvetica, Arial, sans-serif; font-weight: bold; font-size: 11px; fill: #2D3748; }
      .tick-label { font-family: Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748B; font-weight: bold; }
      .region-label { font-family: Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .card-title { font-family: Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: bold; }
      .card-sub { font-family: Helvetica, Arial, sans-serif; font-size: 9px; fill: #475569; }
      .badge-text { font-family: Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="518" fill="#FFFFFF"/>
  <g transform="translate(0, -42)">
  
  <!-- Graph Canvas: x=90..910 (width=820), y=70..450 (height=380) -->
  <rect x="90" y="70" width="820" height="380" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Shaded Regimes -->
  <polygon points="90,450 640,115 90,115" fill="#EFF6FF" fill-opacity="0.8"/>
  <polygon points="640,115 910,115 910,450 640,450" fill="#F0FDF4" fill-opacity="0.7"/>

  <!-- Grid Lines (Log Scale) -->
  <line x1="90" y1="70" x2="90" y2="450" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="226" y1="70" x2="226" y2="450" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="363" y1="70" x2="363" y2="450" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="500" y1="70" x2="500" y2="450" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="636" y1="70" x2="636" y2="450" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="773" y1="70" x2="773" y2="450" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="910" y1="70" x2="910" y2="450" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Y Grid -->
  <line x1="90" y1="450" x2="910" y2="450" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="366" x2="910" y2="366" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="282" x2="910" y2="282" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="198" x2="910" y2="198" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="115" x2="910" y2="115" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Regime Labels -->
  <text x="320" y="94" class="region-label" fill="#1F407A">MEMORY-BOUND REGIME (DRAM BANDWIDTH BOTTLENECK)</text>
  <text x="770" y="94" class="region-label" fill="#15803D">COMPUTE-BOUND REGIME</text>

  <!-- Compute Ceiling Line -->
  <line x1="90" y1="115" x2="910" y2="115" stroke="#1F407A" stroke-width="1.8" stroke-dasharray="5,3"/>
  <!-- Peak Compute Badge placed cleanly at top right above line -->
  <rect x="695" y="76" width="205" height="22" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1"/>
  <text x="797" y="91" class="badge-text" fill="#1F407A" text-anchor="middle">PEAK COMPUTE: 275 TFLOP/s (FP16/INT8)</text>

  <!-- Memory Bandwidth Slope Line -->
  <line x1="90" y1="450" x2="640" y2="115" stroke="#B45309" stroke-width="2.5"/>
  
  <!-- Memory Wall Ceiling Label -->
  <g transform="translate(230, 240) rotate(-31)">
    <rect x="-10" y="-14" width="230" height="22" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <text x="105" y="1" class="badge-text" fill="#B45309" text-anchor="middle">Memory Bandwidth: 204.8 GB/s (LPDDR5)</text>
  </g>

  <!-- Ridge Point (Knee) Indicator -->
  <circle cx="640" cy="115" r="5" fill="#A51C30" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Dashed vertical line segmented around the callout card -->
  <line x1="640" y1="115" x2="640" y2="128" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="640" y1="166" x2="640" y2="450" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <rect x="525" y="128" width="150" height="36" rx="3" fill="#FFFFFF" stroke="#A51C30" stroke-width="1"/>
  <text x="600" y="143" class="badge-text" fill="#A51C30" text-anchor="middle">Ridge Point (Knee)</text>
  <text x="600" y="157" class="card-sub" fill="#475569" text-anchor="middle">I_knee = 1,342.8 FLOP/B</text>

  <!-- Operating Points & Callouts -->
  <!-- Point 1: Autoregressive VLA Single-Token -->
  <circle cx="105" cy="440" r="5" fill="#A51C30"/>
  <rect x="118" y="408" width="205" height="38" rx="3" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
  <text x="126" y="422" class="card-title" fill="#A51C30">Autoregressive VLA (1 Token / step)</text>
  <text x="126" y="437" class="card-sub">I ≈ 1.0 FLOP/Byte · P ≈ 0.20 TFLOP/s (0.07% peak)</text>

  <!-- Point 2: Action Chunking Transformer (H=16) -->
  <circle cx="363" cy="282" r="5" fill="#1F407A"/>
  <rect x="235" y="296" width="225" height="38" rx="3" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
  <text x="243" y="310" class="card-title" fill="#1F407A">Action Chunking ACT (Horizon H=16)</text>
  <text x="243" y="325" class="card-sub">I ≈ 16.0 FLOP/Byte · P ≈ 3.28 TFLOP/s (1.2% peak)</text>

  <!-- Point 3: Diffusion Policy Denoising (K=10 Steps) -->
  <circle cx="500" cy="198" r="5" fill="#2563EB"/>
  <rect x="365" y="174" width="215" height="38" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="373" y="188" class="card-title" fill="#2563EB">Diffusion Policy (10 Denoise Steps)</text>
  <text x="373" y="203" class="card-sub">I ≈ 100.0 FLOP/Byte · P ≈ 20.5 TFLOP/s (7.5% peak)</text>

  <!-- Point 4: Vision Transformer Backbone (ViT-L/14) -->
  <circle cx="773" cy="115" r="5" fill="#334155"/>
  <line x1="773" y1="120" x2="773" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="690" y="140" width="210" height="38" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="698" y="154" class="card-title" fill="#1E293B">ViT-L/14 Image Encoder (224×224)</text>
  <text x="698" y="169" class="card-sub">I ≈ 2200 FLOP/Byte · P = 275 TFLOP/s (100% peak)</text>

  <!-- X-Axis Labels -->
  <text x="90" y="470" class="tick-label" text-anchor="middle">0.1</text>
  <text x="226" y="470" class="tick-label" text-anchor="middle">1.0</text>
  <text x="363" y="470" class="tick-label" text-anchor="middle">10</text>
  <text x="500" y="470" class="tick-label" text-anchor="middle">100</text>
  <text x="636" y="470" class="tick-label" text-anchor="middle">1000</text>
  <text x="773" y="470" class="tick-label" text-anchor="middle">10⁴</text>
  <text x="910" y="470" class="tick-label" text-anchor="middle">10⁵</text>
  <text x="480" y="495" class="axis-title" text-anchor="middle">Arithmetic Intensity I (FLOP / Byte)</text>

  <!-- Y-Axis Labels -->
  <text x="80" y="454" class="tick-label" text-anchor="end">0.1</text>
  <text x="80" y="370" class="tick-label" text-anchor="end">1.0</text>
  <text x="80" y="286" class="tick-label" text-anchor="end">10</text>
  <text x="80" y="202" class="tick-label" text-anchor="end">100</text>
  <text x="80" y="119" class="tick-label" text-anchor="end">275</text>
  <text x="40" y="260" class="axis-title" text-anchor="middle" transform="rotate(-90 40 260)">Attainable Performance P (TFLOP/s)</text>

  <!-- Bottom Synthesis Box -->
  <rect x="90" y="512" width="820" height="36" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="526" class="card-title" fill="#1F407A" text-anchor="middle">Architectural Takeaway: Memory bandwidth B_mem (not compute TFLOP/s) bounds autoregressive policy rate (f_max = B_mem / M_weights).</text>
  <text x="480" y="540" class="card-sub" text-anchor="middle">Action chunking H waypoints amortizes full-model weight reads, shifting operational intensity from 1.0 to 16.0+ FLOP/Byte.</text>
</g>
</svg>
