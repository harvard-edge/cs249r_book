<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #1e293b; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: bold; fill: #475569; text-transform: uppercase; letter-spacing: 0.3px; }
      .subcard-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; font-weight: bold; }
      .data-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.2px; font-weight: 500; }
      .pill-text-white { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 6.8px; font-weight: bold; fill: #ffffff; }
      .pill-text-blue { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.2px; font-weight: bold; fill: #1e3a8a; }
      .cliff-badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 6.8px; font-weight: bold; fill: #ffffff; }
      .timeline-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7px; font-weight: bold; }
    </style>
  </defs>

  <!-- Outer Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Header -->
  <text x="18" y="20" class="card-title">Humanoid Tipping Deadline vs. Deliberative Latency Mismatch</text>
  
  <!-- Invariant Pill Badge (Top Right) -->
  <rect x="336" y="9" width="186" height="16" rx="8" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="429" y="20.5" class="pill-text-blue" text-anchor="middle">τ_fall = √(z_c / g) ≈ 303 ms (z_c = 0.9 m)</text>

  <!-- ==================== VERTICAL CLIFF GUIDELINE ==================== -->
  <line x1="170" y1="28" x2="170" y2="172" stroke="#c44" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- ==================== TRACK 1: PHYSICAL DYNAMICS ==================== -->
  <text x="18" y="33" class="section-label">Physical Balance Set</text>
  <text x="176" y="33" class="section-label" fill="#991b1b">Gravitational Collapse Zone</text>

  <!-- Zone 1A: Recoverable Set (Green) -->
  <rect x="18" y="37" width="148" height="46" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <rect x="24" y="41" width="82" height="11" rx="5.5" fill="#3d9e5a"/>
  <text x="65" y="49.5" class="pill-text-white" text-anchor="middle">RECOVERABLE SET</text>
  <text x="24" y="62" class="subcard-header" fill="#14532d">t &lt; 200 ms (Dynamic Margin)</text>
  <text x="24" y="71" class="data-label" fill="#14532d">• CoP contained within support polygon</text>
  <text x="24" y="79" class="data-label" fill="#14532d">• Ankle/hip torque restores vertical posture</text>

  <!-- Zone 1B: Irreversible Collapse (Red) -->
  <rect x="174" y="37" width="348" height="46" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <rect x="180" y="41" width="108" height="11" rx="5.5" fill="#c44"/>
  <text x="234" y="49.5" class="pill-text-white" text-anchor="middle">IRREVERSIBLE COLLAPSE</text>
  <text x="180" y="62" class="subcard-header" fill="#7f1d1d">t ≥ 200 ms (Gravity Overcomes Actuators · Point of No Return)</text>
  <text x="180" y="71" class="data-label" fill="#7f1d1d">• Center of pressure escapes base polygon; tipping moment exceeds joint torque</text>
  <text x="180" y="79" class="data-label" fill="#7f1d1d">• High-velocity ground impact fractures titanium limbs and blows hydraulic lines (DRC 2015)</text>

  <!-- ==================== MIDDLE TIMELINE BAR & CLIFF BADGE ==================== -->
  <!-- Timeline Background Strips -->
  <rect x="18" y="87" width="148" height="17" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.6"/>
  <text x="74" y="98.5" class="timeline-label" fill="#14532d" text-anchor="middle">Stable Set C (&lt;200 ms)</text>

  <rect x="174" y="87" width="348" height="17" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.6"/>
  <text x="348" y="98.5" class="timeline-label" fill="#7f1d1d" text-anchor="middle">Catastrophic Fall Phase Space (200–800 ms)</text>

  <!-- Center Cliff Badge (Centered exactly on vertical line at x = 170) -->
  <rect x="134" y="88.5" width="72" height="14" rx="7" fill="#c44" stroke="#ffffff" stroke-width="1"/>
  <text x="170" y="98.5" class="cliff-badge-text" text-anchor="middle">200 ms CLIFF</text>

  <!-- ==================== TRACK 2: CONTROLLER CADENCE ==================== -->
  <text x="18" y="117" class="section-label">Deterministic Reflex Realm</text>
  <text x="176" y="117" class="section-label" fill="#78350f">Stochastic Deliberative Realm</text>

  <!-- System 1: 1000 Hz Reflex (Green) -->
  <rect x="18" y="121" width="148" height="48" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <rect x="24" y="125" width="82" height="11" rx="5.5" fill="#3d9e5a"/>
  <text x="65" y="133.5" class="pill-text-white" text-anchor="middle">SYSTEM 1: REFLEX</text>
  <text x="24" y="146" class="subcard-header" fill="#14532d">1000 Hz MCU (Δt = 1 ms)</text>
  <text x="24" y="155" class="data-label" fill="#14532d">• Deterministic 1 ms floating-base balance</text>
  <text x="24" y="163" class="data-label" fill="#14532d">• Auto-holds stable double-support stance</text>

  <!-- System 2: Neural Deliberation (Orange) -->
  <rect x="174" y="121" width="348" height="48" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
  <rect x="180" y="125" width="128" height="11" rx="5.5" fill="#c87b2a"/>
  <text x="244" y="133.5" class="pill-text-white" text-anchor="middle">SYSTEM 2: VLA DELIBERATION</text>
  <text x="180" y="146" class="subcard-header" fill="#78350f">1–5 Hz Inference (t_delib = 200–800 ms on MPU / NPU)</text>
  <text x="180" y="155" class="data-label" fill="#78350f">• Tokenization + DRAM weight sweeps inherently overrun the 200 ms tipping cliff</text>
  <text x="180" y="163" class="data-label" fill="#78350f">• Synchronously coupling balance to neural inference guarantees catastrophic falls</text>
</svg>
