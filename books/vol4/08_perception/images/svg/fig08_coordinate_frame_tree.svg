<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 210" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .frame-title { font-weight: 700; font-size: 15px; }
      .frame-sub { font-size: 11.5px; font-weight: 500; }
      .edge-tag { font-size: 10px; font-weight: 600; }
      .math-title { font-size: 10.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.6px; text-transform: uppercase; }
      .math-formula { font-family: "STIX Two Text", "Times New Roman", Georgia, serif; font-size: 15px; fill: #1e293b; }
      .math-var { font-style: italic; font-weight: 600; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#64748b" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#d97706" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ================= EDGES ================= -->
  <!-- Edge 1: earth -> map -->
  <line x1="180" y1="58" x2="248" y2="58" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-slate)"/>
  <text x="215" y="47" class="edge-tag" fill="#64748b" text-anchor="middle">Piecewise C⁰</text>

  <!-- Edge 2: map -> odom -->
  <line x1="390" y1="58" x2="458" y2="58" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#arr-amber)"/>
  <text x="425" y="47" class="edge-tag" fill="#b45309" text-anchor="middle">Discontinuous</text>

  <!-- Edge 3: odom -> body -->
  <line x1="600" y1="58" x2="668" y2="58" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="635" y="47" class="edge-tag" fill="#1d4ed8" text-anchor="middle">Continuous C¹</text>

  <!-- Edge 4: body -> sensor -->
  <line x1="810" y1="58" x2="878" y2="58" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <text x="845" y="47" class="edge-tag" fill="#475569" text-anchor="middle">Rigid SE(3)</text>

  <!-- ================= NODES ================= -->
  <!-- Node 1: F_earth (Root Datum) -->
  <rect x="40" y="30" width="140" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="54" class="frame-title" fill="#334155" text-anchor="middle"><tspan font-family="'Times New Roman', serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="10.5">earth</tspan></text>
  <text x="110" y="73" class="frame-sub" fill="#64748b" text-anchor="middle">Root Datum</text>

  <!-- Node 2: F_map (Global Map) -->
  <rect x="250" y="30" width="140" height="56" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="320" y="54" class="frame-title" fill="#92400e" text-anchor="middle"><tspan font-family="'Times New Roman', serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="10.5">map</tspan></text>
  <text x="320" y="73" class="frame-sub" fill="#b45309" text-anchor="middle">Global Map</text>

  <!-- Node 3: F_odom (Local Odometry) -->
  <rect x="460" y="30" width="140" height="56" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="530" y="54" class="frame-title" fill="#1e40af" text-anchor="middle"><tspan font-family="'Times New Roman', serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="10.5">odom</tspan></text>
  <text x="530" y="73" class="frame-sub" fill="#2563eb" text-anchor="middle">Local Odometry</text>

  <!-- Node 4: F_body (Base Link) -->
  <rect x="670" y="30" width="140" height="56" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="740" y="54" class="frame-title" fill="#166534" text-anchor="middle"><tspan font-family="'Times New Roman', serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="10.5">body</tspan></text>
  <text x="740" y="73" class="frame-sub" fill="#15803d" text-anchor="middle">base_link</text>

  <!-- Node 5: F_sensor (Sensor Link) -->
  <rect x="880" y="30" width="140" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="950" y="54" class="frame-title" fill="#334155" text-anchor="middle"><tspan font-family="'Times New Roman', serif" font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="10.5">sensor</tspan></text>
  <text x="950" y="73" class="frame-sub" fill="#64748b" text-anchor="middle">sensor_link</text>

  <!-- ================= BOTTOM CARD: COVARIANCE PROPAGATION ================= -->
  <rect x="180" y="122" width="700" height="58" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="530" y="142" class="math-title" text-anchor="middle">Spatial Covariance Propagation</text>
  <text x="530" y="165" class="math-formula" text-anchor="middle">
    <tspan class="math-var">Σ</tspan><tspan baseline-shift="sub" font-size="10.5">map</tspan> &#8776; 
    <tspan class="math-var">J</tspan><tspan baseline-shift="sub" font-size="10">odom</tspan>&#8201;<tspan class="math-var">Σ</tspan><tspan baseline-shift="sub" font-size="10">drift</tspan>&#8201;<tspan class="math-var">J</tspan><tspan baseline-shift="sub" font-size="10">odom</tspan><tspan baseline-shift="super" font-size="9.5">&#8868;</tspan>
    &#160;+&#160;
    <tspan class="math-var">R</tspan><tspan baseline-shift="sub" font-size="10">body</tspan>&#8201;<tspan class="math-var">Σ</tspan><tspan baseline-shift="sub" font-size="10">ext</tspan>&#8201;<tspan class="math-var">R</tspan><tspan baseline-shift="sub" font-size="10">body</tspan><tspan baseline-shift="super" font-size="9.5">&#8868;</tspan>
    &#160;+&#160;
    <tspan class="math-var">R</tspan><tspan baseline-shift="sub" font-size="10">tot</tspan>&#8201;<tspan class="math-var">Σ</tspan><tspan baseline-shift="sub" font-size="10">z</tspan>&#8201;<tspan class="math-var">R</tspan><tspan baseline-shift="sub" font-size="10">tot</tspan><tspan baseline-shift="super" font-size="9.5">&#8868;</tspan>
  </text>
</svg>
