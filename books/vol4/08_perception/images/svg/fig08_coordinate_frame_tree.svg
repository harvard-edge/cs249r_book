<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .frame-title { font-weight: 700; font-size: 15px; fill: #1e293b; }
      .frame-sub { font-size: 11px; fill: #475569; }
      .edge-title { font-weight: 700; font-size: 11px; }
      .edge-sub { font-size: 10.5px; }
      .math-eq { font-family: "STIX Two Text", "Times New Roman", serif; font-style: italic; font-size: 15px; fill: #1e293b; }
    </style>
    <marker id="arrow_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow_slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Edge 1: F_earth to F_map (Piecewise C0) -->
  <line x1="170" y1="76" x2="270" y2="76" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow_slate)"/>
  <text x="220" y="61" class="edge-sub" fill="#64748b" text-anchor="middle">Piecewise C0</text>

  <!-- Edge 2: F_map to F_odom (Discontinuous Map Corrections) -->
  <line x1="390" y1="76" x2="490" y2="76" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow_red)"/>
  <text x="440" y="51" class="edge-title" fill="#dc2626" text-anchor="middle">Discontinuous</text>
  <text x="440" y="66" class="edge-sub" fill="#dc2626" text-anchor="middle">Map Corrections</text>

  <!-- Edge 3: F_odom to F_body (Continuous C1 Dead Reckoning) -->
  <line x1="610" y1="76" x2="710" y2="76" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow_blue)"/>
  <text x="660" y="51" class="edge-title" fill="#2563eb" text-anchor="middle">Continuous (C1)</text>
  <text x="660" y="66" class="edge-sub" fill="#2563eb" text-anchor="middle">Dead Reckoning</text>

  <!-- Edge 4: F_body to F_sensor (Rigid Extrinsic Mounting) -->
  <line x1="830" y1="76" x2="930" y2="76" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow_slate)"/>
  <text x="880" y="51" class="edge-title" fill="#334155" text-anchor="middle">Rigid Extrinsic</text>
  <text x="880" y="66" class="edge-sub" fill="#475569" text-anchor="middle">Mounting</text>

  <!-- Node 1: F_earth -->
  <rect x="50" y="46" width="120" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="110" y="73" class="frame-title" text-anchor="middle">F<tspan baseline-shift="sub" font-size="10">earth</tspan></text>
  <text x="110" y="92" class="frame-sub" text-anchor="middle">Root Datum</text>

  <!-- Node 2: F_map -->
  <rect x="270" y="46" width="120" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="330" y="73" class="frame-title" text-anchor="middle">F<tspan baseline-shift="sub" font-size="10">map</tspan></text>
  <text x="330" y="92" class="frame-sub" text-anchor="middle">Global Map</text>

  <!-- Node 3: F_odom -->
  <rect x="490" y="46" width="120" height="60" rx="4" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="73" class="frame-title" fill="#1d4ed8" text-anchor="middle">F<tspan baseline-shift="sub" font-size="10">odom</tspan></text>
  <text x="550" y="92" class="frame-sub" text-anchor="middle">Local Odometry</text>

  <!-- Node 4: F_body -->
  <rect x="710" y="46" width="120" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="770" y="73" class="frame-title" fill="#1d4ed8" text-anchor="middle">F<tspan baseline-shift="sub" font-size="10">body</tspan></text>
  <text x="770" y="92" class="frame-sub" fill="#2563eb" text-anchor="middle">base_link</text>

  <!-- Node 5: F_sensor -->
  <rect x="930" y="46" width="120" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="990" y="73" class="frame-title" text-anchor="middle">F<tspan baseline-shift="sub" font-size="10">sensor</tspan></text>
  <text x="990" y="92" class="frame-sub" text-anchor="middle">sensor_link</text>

  <!-- Bottom Card: Spatial Covariance Composition -->
  <rect x="150" y="160" width="800" height="78" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="550" y="186" font-size="12.5px" font-weight="700" fill="#1e293b" text-anchor="middle">Spatial Covariance Composition</text>
  <text x="550" y="216" class="math-eq" text-anchor="middle">Σ<tspan baseline-shift="sub" font-size="10">map</tspan> ≈ J<tspan baseline-shift="sub" font-size="10">odom</tspan> Σ<tspan baseline-shift="sub" font-size="10">drift</tspan> J<tspan baseline-shift="sub" font-size="10">odom</tspan><tspan baseline-shift="super" font-size="10">T</tspan> + R<tspan baseline-shift="sub" font-size="10">body</tspan> Σ<tspan baseline-shift="sub" font-size="10">ext</tspan> R<tspan baseline-shift="sub" font-size="10">body</tspan><tspan baseline-shift="super" font-size="10">T</tspan> + R<tspan baseline-shift="sub" font-size="10">tot</tspan> Σ<tspan baseline-shift="sub" font-size="10">z</tspan> R<tspan baseline-shift="sub" font-size="10">tot</tspan><tspan baseline-shift="super" font-size="10">T</tspan></text>
</svg>
