<?xml version="1.0" encoding="utf-8"?>
<!-- Lateral-slip ladder, linear scale: x = 4 + 0.6565 px per mm (262 mm at x = 176).
     Neutral gray bars are lateral position errors; dotted slate = delta_loc 50 mm allowance,
     dashed red = 150 mm side-clearance wall. Only the 1-degree mount error at 15 m crosses the wall. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="288" fill="#ffffff"/>
  <!-- reference-line labels -->
  <text x="36.8" y="22" font-size="13" fill="#5e6b73" text-anchor="middle">&#948;<tspan font-size="12" dy="3">loc</tspan><tspan dx="3.5" dy="-3">50</tspan></text>
  <text x="102.5" y="22" font-size="13" fill="#cb202d" text-anchor="middle">side 150</text>
  <!-- error bars -->
  <rect x="4" y="44" width="172" height="34" fill="#666666" opacity="0.92"/>
  <rect x="4" y="94" width="50.81" height="34" fill="#666666" opacity="0.92"/>
  <rect x="4" y="144" width="26.19" height="34" fill="#666666" opacity="0.92"/>
  <rect x="4" y="194" width="16.35" height="34" fill="#666666" opacity="0.92"/>
  <rect x="4" y="244" width="7.88" height="34" fill="#666666" opacity="0.92"/>
  <!-- axis -->
  <line x1="4" y1="281" x2="176" y2="281" stroke="#cccccc" stroke-width="1.4"/>
  <!-- reference lines -->
  <line x1="36.8" y1="30" x2="36.8" y2="281" stroke="#5e6b73" stroke-width="1.9" stroke-dasharray="1.9,3.2"/>
  <line x1="102.5" y1="30" x2="102.5" y2="281" stroke="#cb202d" stroke-width="1.9" stroke-dasharray="6.9,3"/>
  <!-- in-bar label, top rung -->
  <text x="172" y="58" font-size="13" fill="#ffffff" text-anchor="end">1&#176; at 15 m</text>
  <text x="172" y="73" font-size="13" fill="#ffffff" text-anchor="end">262 mm</text>
  <!-- label backings: break the reference lines where labels cross them -->
  <rect x="56.8" y="95" width="80.6" height="32" fill="#ffffff"/>
  <rect x="32.2" y="145" width="80.3" height="32" fill="#ffffff"/>
  <rect x="22.3" y="195" width="63.9" height="32" fill="#ffffff"/>
  <rect x="13.9" y="245" width="83.7" height="32" fill="#ffffff"/>
  <!-- outside labels -->
  <text x="58.8" y="108" font-size="13" fill="#333333">Dispatch age</text>
  <text x="58.8" y="123" font-size="13" fill="#333333">77.4 mm</text>
  <text x="34.2" y="158" font-size="13" fill="#333333">Arrival stamp</text>
  <text x="34.2" y="173" font-size="13" fill="#333333">39.9 mm</text>
  <text x="24.3" y="208" font-size="13" fill="#333333">Row skew</text>
  <text x="24.3" y="223" font-size="13" fill="#333333">24.9 mm</text>
  <text x="15.9" y="258" font-size="13" fill="#333333">Trigger stamp</text>
  <text x="15.9" y="273" font-size="13" fill="#333333">12 mm</text>
</svg>
