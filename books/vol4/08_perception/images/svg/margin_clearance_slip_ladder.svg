<?xml version="1.0" encoding="utf-8"?>
<!-- Spatial error ladder on a shared linear scale: x = 4 + 0.6565 px per mm (262 mm at x = 176).
     Separated by physical axis so lateral errors and along-track timing slips are each compared only
     against their own clearance budget:
       Upper group (lateral): 1-deg mount error at 15 m (262 mm) vs. 150 mm rack side clearance (dashed red).
       Lower group (along-track at 1.5 m/s): dispatch age (77.4 mm), arrival stamp (39.9 mm),
         row skew (24.9 mm), and trigger stamp (12 mm) vs. delta_loc = 50 mm localization allowance (dotted slate). -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="332" fill="#ffffff"/>

  <!-- Upper group: Lateral mount error vs. 150 mm side clearance -->
  <text x="4" y="15" font-size="11.5" font-weight="600" fill="#4a5568">Lateral mount error</text>
  <text x="102.5" y="32" font-size="12" fill="#cb202d" text-anchor="middle">side 150 mm</text>
  <rect x="4" y="40" width="172" height="34" fill="#666666" opacity="0.92"/>
  <line x1="102.5" y1="36" x2="102.5" y2="80" stroke="#cb202d" stroke-width="1.9" stroke-dasharray="6.9,3"/>
  <text x="172" y="54" font-size="12.5" fill="#ffffff" text-anchor="end">1&#176; at 15 m</text>
  <text x="172" y="69" font-size="12.5" fill="#ffffff" text-anchor="end">262 mm</text>

  <!-- Regime separator -->
  <line x1="4" y1="90" x2="176" y2="90" stroke="#cbd5e0" stroke-width="1.2"/>

  <!-- Lower group: Along-track timing slips at 1.5 m/s vs. delta_loc = 50 mm -->
  <text x="4" y="108" font-size="11.5" font-weight="600" fill="#4a5568">Along-track at 1.5 m/s</text>
  <text x="36.8" y="126" font-size="12" fill="#5e6b73" text-anchor="middle">&#948;<tspan font-size="10.5" dy="2.5">loc</tspan><tspan dx="3" dy="-2.5">50 mm</tspan></text>

  <rect x="4" y="135" width="50.81" height="34" fill="#666666" opacity="0.92"/>
  <rect x="4" y="183" width="26.19" height="34" fill="#666666" opacity="0.92"/>
  <rect x="4" y="231" width="16.35" height="34" fill="#666666" opacity="0.92"/>
  <rect x="4" y="279" width="7.88" height="34" fill="#666666" opacity="0.92"/>

  <!-- Shared millimeter baseline -->
  <line x1="4" y1="321" x2="176" y2="321" stroke="#cccccc" stroke-width="1.4"/>

  <!-- Along-track localization reference line (confined to lower group) -->
  <line x1="36.8" y1="130" x2="36.8" y2="321" stroke="#5e6b73" stroke-width="1.9" stroke-dasharray="1.9,3.2"/>

  <!-- White label backings where text crosses delta_loc = 50 mm -->
  <rect x="32.2" y="184" width="84" height="32" fill="#ffffff"/>
  <rect x="22.3" y="232" width="66" height="32" fill="#ffffff"/>
  <rect x="13.9" y="280" width="86" height="32" fill="#ffffff"/>

  <!-- Outside bar labels -->
  <text x="58.8" y="149" font-size="12.5" fill="#333333">Dispatch age</text>
  <text x="58.8" y="164" font-size="12.5" fill="#333333">77.4 mm</text>
  <text x="34.2" y="197" font-size="12.5" fill="#333333">Arrival stamp</text>
  <text x="34.2" y="212" font-size="12.5" fill="#333333">39.9 mm</text>
  <text x="24.3" y="245" font-size="12.5" fill="#333333">Row skew</text>
  <text x="24.3" y="260" font-size="12.5" fill="#333333">24.9 mm</text>
  <text x="15.9" y="293" font-size="12.5" fill="#333333">Trigger stamp</text>
  <text x="15.9" y="308" font-size="12.5" fill="#333333">12 mm</text>
</svg>
