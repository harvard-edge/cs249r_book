<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <marker id="arr2" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#334155"/>
    </marker>
    <marker id="arr2-red" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr2-purple" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#8e44ad"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Sub-card 1: Ingress Burst (Left) -->
  <rect x="16" y="16" width="162" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="24" y="31" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#1e293b">1. SENSORY INGRESS BURST</text>

  <!-- Camera group -->
  <rect x="24" y="39" width="146" height="34" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="30" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#1e3a8a">4× Synchronized 4K Cameras</text>
  <text x="30" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#1e3a8a">Strobe trigger: 16 ms simultaneous readout</text>
  <text x="30" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e3a8a">Burst: Vburst = 49.8 MB (3.1 GB/s)</text>

  <!-- CSI-2 RX & FIFO -->
  <rect x="24" y="78" width="146" height="32" rx="2" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75"/>
  <text x="30" y="89" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#581c87">MIPI CSI-2 &amp; Scatter-Gather DMA</text>
  <text x="30" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#581c87">16 KB On-die SRAM FIFO buffer</text>
  <text x="30" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" fill="#b91c1c">Backpressure: FIFO_OVERRUN / Drop</text>

  <!-- Ingress status box -->
  <rect x="24" y="116" width="146" height="38" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="28" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#1e293b">Resolution is Safety Budget:</text>
  <text x="28" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#475569">1080p: 12.4 MB burst (622 µs)</text>
  <text x="28" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#b91c1c">4K: 49.8 MB burst (2488 µs)</text>

  <!-- Arrow from Sub-card 1 to Sub-card 2 -->
  <line x1="178" y1="94" x2="190" y2="94" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arr2-purple)"/>

  <!-- Sub-card 2: Memory Contention (Center) -->
  <rect x="190" y="16" width="160" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="198" y="31" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#1e293b">2. UMA INTERCONNECT &amp; DRAM</text>

  <!-- Crossbar box -->
  <rect x="198" y="39" width="144" height="24" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="270" y="49" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#334155" text-anchor="middle">Unified AXI Crossbar</text>
  <text x="270" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" fill="#64748b" text-anchor="middle">Shared CPU / GPU / DMA Interconnect</text>

  <!-- DRAM Controller Queue -->
  <rect x="198" y="68" width="144" height="42" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
  <text x="204" y="79" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#78350f">LPDDR5 Controller (20 GB/s)</text>
  <!-- Write queue bar -->
  <rect x="204" y="83" width="132" height="11" fill="#f9d6d5" stroke="#c44" stroke-width="0.5"/>
  <text x="270" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Saturated Write Queue: 49.8 MB</text>
  <text x="204" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" fill="#78350f">Read/Write turnaround lockup</text>

  <!-- Contention stall equation box -->
  <rect x="198" y="116" width="144" height="38" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="204" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e293b">Memory Contention Stall:</text>
  <text x="204" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#475569">Δt_stall = Vburst / Rarb</text>
  <text x="204" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#b91c1c">= 49.8 MB / 20 GB/s = 2488 µs</text>

  <!-- Arrow from Sub-card 2 to Sub-card 3 -->
  <line x1="350" y1="94" x2="362" y2="94" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr2-red)"/>

  <!-- Sub-card 3: Safety Enforcement Failure (Right) -->
  <rect x="362" y="16" width="162" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="370" y="31" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#1e293b">3. SAFETY REFUSAL COLLISION</text>

  <!-- Safety Loop specs -->
  <rect x="370" y="39" width="146" height="32" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="376" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#14532d">1 kHz Safety Enforcement Loop</text>
  <text x="376" y="59" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#14532d">Tenforce = 1000 µs | Idle: texec = 150 µs</text>
  <text x="376" y="67" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14532d">Timing Slack S = 1000 - 150 = 850 µs</text>

  <!-- Timing slack vs Stall comparison -->
  <rect x="370" y="76" width="146" height="35" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
  <!-- Slack marker bar -->
  <rect x="374" y="80" width="46" height="7" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.5"/>
  <text x="424" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#14532d">Timing Slack S = 850 µs</text>
  <!-- Stall bar (2488us) spanning full width -->
  <rect x="374" y="91" width="138" height="10" fill="#f9d6d5" stroke="#c44" stroke-width="0.5"/>
  <text x="443" y="99" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Contention Stall: 2488 µs</text>
  <!-- Overrun indicator line -->
  <line x1="420" y1="78" x2="420" y2="103" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 1"/>
  <text x="443" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" font-weight="bold" fill="#b91c1c" text-anchor="middle">▲ Overrun: +1638 µs</text>

  <!-- Overrun pill badge -->
  <rect x="370" y="117" width="146" height="19" rx="9.5" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="443" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#7f1d1d" text-anchor="middle">DEADLINE OVERRUN (2 DROPPED)</text>

  <!-- Bottom fix annotation -->
  <rect x="370" y="140" width="146" height="17" rx="3" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75"/>
  <text x="443" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.8" font-weight="bold" fill="#581c87" text-anchor="middle">Requires AXI QoS / ARM MPAM</text>
</svg>
