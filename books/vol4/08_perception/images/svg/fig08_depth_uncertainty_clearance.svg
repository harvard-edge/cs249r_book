<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .main-title { font-weight: 800; font-size: 15px; fill: #1F407A; letter-spacing: 0.5px; }
      .main-subtitle { font-size: 11px; fill: #475569; }
      .panel-header { font-weight: 700; font-size: 11.5px; letter-spacing: 0.3px; }
      .axis-lbl { font-size: 10px; fill: #475569; font-weight: 600; }
      .tick-lbl { font-size: 9px; fill: #64748B; }
      .curve-lbl { font-weight: 700; font-size: 10px; }
      .badge-txt { font-weight: 700; font-size: 8.5px; }
      .body-txt { font-size: 9.5px; fill: #334155; line-height: 1.35; }
      .bold-txt { font-weight: 700; font-size: 9.5px; }
      .math-txt { font-family: "STIX Two Text", "Times New Roman", serif; font-style: italic; font-size: 11px; }
      .code-sm { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8.5px; font-weight: 600; }
    </style>

    <marker id="arr-navy2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-petrol2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-dim2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>

    <filter id="card-shadow2" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Canvas Container -->
  <rect width="960" height="480" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Top Title Banner -->
  <rect x="20" y="14" width="920" height="42" fill="#F8FAFC" rx="6" stroke="#E2E8F0" stroke-width="1"/>
  <text x="36" y="32" class="main-title">METRIC GROUNDING, DEPTH ERROR SCALING &amp; CLEARANCE INSETS</text>
  <text x="36" y="47" class="main-subtitle">Quadratic Stereo Divergence vs Constant LiDAR ToF Error and Its Direct Subtraction from Physical Stopping Clearance</text>

  <!-- ================= LEFT PANEL: MATHEMATICAL ERROR SCALING ================= -->
  <rect x="20" y="64" width="450" height="402" fill="#F8FAFC" rx="6" stroke="#E2E8F0" stroke-width="1"/>
  <text x="34" y="82" class="panel-header" fill="#1F407A">A. DEPTH UNCERTAINTY DIVERGENCE (δz vs RANGE z)</text>
  
  <!-- Graph Plot Box (x: 75 to 445, y: 98 to 330) -->
  <rect x="75" y="98" width="375" height="232" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Grid Lines -->
  <!-- Horizontal Grid (δz: 0, 200, 400, 600, 800, 1000, 1200 mm) -->
  <line x1="75" y1="330" x2="450" y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="75" y1="291" x2="450" y2="291" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="75" y1="253" x2="450" y2="253" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="75" y1="214" x2="450" y2="214" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="75" y1="175" x2="450" y2="175" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="75" y1="137" x2="450" y2="137" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="75" y1="98" x2="450" y2="98" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Vertical Grid (z: 0, 4, 8, 12, 16, 20 m) -->
  <line x1="75" y1="98" x2="75" y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="150" y1="98" x2="150" y2="330" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="225" y1="98" x2="225" y2="330" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="300" y1="98" x2="300" y2="330" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="375" y1="98" x2="375" y2="330" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="450" y1="98" x2="450" y2="330" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Y-Axis Labels (δz in mm) -->
  <text x="68" y="333" class="tick-lbl" text-anchor="end">0</text>
  <text x="68" y="294" class="tick-lbl" text-anchor="end">200</text>
  <text x="68" y="256" class="tick-lbl" text-anchor="end">400</text>
  <text x="68" y="217" class="tick-lbl" text-anchor="end">600</text>
  <text x="68" y="178" class="tick-lbl" text-anchor="end">800</text>
  <text x="68" y="140" class="tick-lbl" text-anchor="end">1000</text>
  <text x="68" y="102" class="tick-lbl" text-anchor="end">1200</text>
  <text x="35" y="214" class="axis-lbl" transform="rotate(-90 35 214)" text-anchor="middle">Depth Uncertainty δz (mm)</text>

  <!-- X-Axis Labels (Range z in meters) -->
  <text x="75" y="344" class="tick-lbl" text-anchor="middle">0 m</text>
  <text x="150" y="344" class="tick-lbl" text-anchor="middle">4 m</text>
  <text x="225" y="344" class="tick-lbl" text-anchor="middle">8 m</text>
  <text x="300" y="344" class="tick-lbl" text-anchor="middle">12 m</text>
  <text x="375" y="344" class="tick-lbl" text-anchor="middle">16 m</text>
  <text x="445" y="344" class="tick-lbl" text-anchor="middle">20 m</text>
  <text x="262" y="358" class="axis-lbl" text-anchor="middle">Target Distance z (meters)</text>

  <!-- LiDAR Curve (Constant ~20mm, Petrol #007A87) -->
  <line x1="75" y1="326" x2="450" y2="326" stroke="#007A87" stroke-width="2.5"/>
  <rect x="290" y="310" width="150" height="13" rx="2" fill="#007A87" fill-opacity="0.12"/>
  <text x="365" y="320" font-size="8.5px" font-weight="700" fill="#007A87" text-anchor="middle">LiDAR ToF: δz ≈ 20 mm (Constant)</text>

  <!-- Stereo Vision Curve (Quadratic, Crimson #A51C30) -->
  <path d="M 75 330 Q 220 326 312 243 T 442 98" fill="none" stroke="#A51C30" stroke-width="2.5"/>
  
  <!-- Highlight Points on Stereo Curve -->
  <!-- Point 1: z=2m -->
  <circle cx="112.5" cy="327.5" r="3.5" fill="#A51C30"/>
  <!-- Point 2: z=10m -->
  <circle cx="262.5" cy="269.5" r="4.5" fill="#A51C30"/>
  <line x1="262.5" y1="269.5" x2="262.5" y2="330" stroke="#A51C30" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="215" y="246" width="125" height="18" rx="3" fill="#FFFFFF" stroke="#A51C30" stroke-width="1"/>
  <text x="277" y="258" font-size="8.5px" font-weight="700" fill="#A51C30" text-anchor="middle">z = 10m → δz = 312.5 mm</text>

  <!-- Point 3: z=16m -->
  <circle cx="375" cy="175.3" r="4.5" fill="#A51C30"/>
  <rect x="295" y="152" width="145" height="18" rx="3" fill="#FFFFFF" stroke="#A51C30" stroke-width="1"/>
  <text x="367" y="164" font-size="8.5px" font-weight="700" fill="#A51C30" text-anchor="middle">Stereo: δz ≈ (z² / fb) · δd</text>

  <!-- Bottom Formulas and Notes in Panel A -->
  <g transform="translate(34, 372)">
    <rect width="422" height="84" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="16" class="bold-txt" fill="#1F407A">Nonlinear Unprojection &amp; Inverse Depth Formulation:</text>
    <text x="10" y="32" class="body-txt">• Standard stereo mapping <tspan class="math-txt">z = fb/d</tspan> maps Gaussian disparity noise into a heavy-tailed distribution in 3D.</text>
    <text x="10" y="47" class="body-txt">• Doubling range quadruples depth uncertainty (<tspan font-weight="700" fill="#A51C30">quadratic divergence</tspan>).</text>
    <text x="10" y="63" class="body-txt">• State estimators use <tspan font-weight="700" fill="#007A87">inverse depth ρ = 1/z</tspan> coordinates to preserve linear Kalman updates as <tspan class="math-txt">d → 0</tspan>.</text>
  </g>


  <!-- ================= RIGHT PANEL: PHYSICAL CLEARANCE INSET GEOMETRY ================= -->
  <rect x="485" y="64" width="455" height="402" fill="#F8FAFC" rx="6" stroke="#E2E8F0" stroke-width="1"/>
  <text x="499" y="82" class="panel-header" fill="#1F407A">B. PROPAGATED ERROR &amp; CLEARANCE INSET GEOMETRY</text>

  <!-- Overhead Physical Geometry Diagram Box -->
  <g transform="translate(499, 96)">
    <rect width="427" height="234" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Safe Clearance Boundary (Green/Teal Dash) -->
    <rect x="250" y="24" width="165" height="186" rx="4" fill="#10B981" fill-opacity="0.05" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="408" y="38" font-size="8.5px" font-weight="700" fill="#047857" text-anchor="end">C_safe (Physical Hard Barrier)</text>

    <!-- Nominal Margin (Blue Dash) -->
    <rect x="220" y="14" width="195" height="206" rx="4" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="408" y="214" font-size="8.5px" font-weight="700" fill="#1D4ED8" text-anchor="end">C_nominal (Uncompensated Plan)</text>

    <!-- Mobile Robot Chassis (Left side) -->
    <g transform="translate(18, 70)">
      <!-- Wheels -->
      <rect x="6" y="-6" width="18" height="10" rx="2" fill="#334155"/>
      <rect x="6" y="90" width="18" height="10" rx="2" fill="#334155"/>
      <rect x="56" y="-6" width="18" height="10" rx="2" fill="#334155"/>
      <rect x="56" y="90" width="18" height="10" rx="2" fill="#334155"/>
      
      <!-- Body Chassis -->
      <rect width="80" height="94" rx="6" fill="#1F407A" stroke="#0F172A" stroke-width="1.5"/>
      <text x="40" y="44" font-size="9.5px" font-weight="700" fill="#FFFFFF" text-anchor="middle">ROBOT</text>
      <text x="40" y="58" class="code-sm" fill="#93C5FD" text-anchor="middle">base_link</text>

      <!-- Velocity Vector -->
      <line x1="80" y1="47" x2="114" y2="47" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-crimson2)"/>
      <text x="96" y="38" font-size="9px" font-weight="700" fill="#A51C30">v</text>

      <!-- Front Camera Sensor -->
      <rect x="76" y="38" width="10" height="18" rx="2" fill="#B87333"/>
      
      <!-- Optical Frustum Rays -->
      <path d="M 86 47 L 290 5" stroke="#B87333" stroke-width="0.8" stroke-dasharray="2,2"/>
      <path d="M 86 47 L 290 89" stroke="#B87333" stroke-width="0.8" stroke-dasharray="2,2"/>
    </g>

    <!-- Detected Obstacle (Right side) -->
    <g transform="translate(290, 85)">
      <!-- 3D Spatial Uncertainty Ellipsoid (P99) -->
      <ellipse cx="40" cy="32" rx="42" ry="24" fill="#A51C30" fill-opacity="0.12" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="40" y="4" font-size="8.5px" font-weight="700" fill="#A51C30" text-anchor="middle">||ε_spatial||_P99 Ellipsoid</text>

      <!-- True Physical Obstacle -->
      <rect x="22" y="16" width="36" height="32" rx="3" fill="#DC2626" stroke="#991B1B" stroke-width="1.2"/>
      <text x="40" y="35" font-size="8.5px" font-weight="700" fill="#FFFFFF" text-anchor="middle">TRUE</text>
      
      <!-- Spatial error axes -->
      <line x1="-2" y1="32" x2="82" y2="32" stroke="#A51C30" stroke-width="1"/>
      <text x="86" y="35" class="code-sm" fill="#A51C30">δz</text>
      <line x1="40" y1="8" x2="40" y2="56" stroke="#A51C30" stroke-width="1"/>
      <text x="44" y="66" class="code-sm" fill="#A51C30">δx ≈ z·θ</text>
    </g>

    <!-- Clearance Dimensions and Arrows at Bottom -->
    <g transform="translate(104, 182)">
      <!-- True Clearance Dimension -->
      <line x1="0" y1="0" x2="208" y2="0" stroke="#475569" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="2.5" fill="#475569"/>
      <circle cx="208" cy="0" r="2.5" fill="#475569"/>
      <text x="104" y="-5" font-size="8.5px" font-weight="700" fill="#0F172A" text-anchor="middle">C_true = C_nominal - ||ε_spatial||</text>

      <!-- Inset Clearance Dimension -->
      <line x1="0" y1="20" x2="146" y2="20" stroke="#007A87" stroke-width="1.5"/>
      <circle cx="0" cy="20" r="2.5" fill="#007A87"/>
      <circle cx="146" cy="20" r="2.5" fill="#007A87"/>
      <text x="73" y="33" font-size="8.5px" font-weight="700" fill="#007A87" text-anchor="middle">C_inset = C_safe + ||ε_spatial||_P99</text>
    </g>
  </g>

  <!-- Bottom Invariant Summary Card -->
  <g transform="translate(499, 340)">
    <rect width="427" height="116" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="0" y="0" width="427" height="24" rx="4" fill="#A51C30"/>
    <rect x="0" y="16" width="427" height="8" fill="#A51C30"/>
    <text x="12" y="16" font-size="10px" font-weight="700" fill="#FFFFFF">BEDROCK INVARIANT: UNINSET CLEARANCE MARGINS ARE A FICTION</text>

    <g transform="translate(10, 32)">
      <text x="0" y="12" class="body-txt"><tspan font-weight="700" fill="#A51C30">The Mathematical Inset Rule:</tspan> To guarantee physical separation <tspan class="math-txt">C_safe</tspan>, the safety enforcer</text>
      <text x="0" y="26" class="body-txt">must enforce <tspan class="bold-txt" fill="#1F407A">C_inset = C_safe + ||ε_spatial||_P99</tspan> where <tspan class="math-txt">ε_spatial</tspan> includes sensor depth noise and extrinsics.</text>
      
      <rect x="0" y="36" width="407" height="38" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
      <text x="8" y="50" font-size="8.5px" font-weight="700" fill="#991B1B">Collision Inevitability without Insetting:</text>
      <text x="8" y="64" font-size="8px" fill="#7F1D1D">If nominal margin is 100mm but perception carries 150mm uncertainty (P99), the physical mass</text>
      <text x="8" y="74" font-size="8px" fill="#7F1D1D">will strike the obstacle while the software monitor asserts nominal clearance is safe.</text>
    </g>
  </g>

</svg>