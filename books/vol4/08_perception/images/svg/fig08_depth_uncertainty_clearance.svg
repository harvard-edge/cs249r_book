<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-48.0" y="-17.5" width="1056.0" height="385.0" fill="#ffffff"/>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .panel-title { font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.2px; }
      .axis-label { font-size: 10px; font-weight: 600; fill: #475569; }
      .tick-text { font-size: 9px; fill: #64748b; }
      .curve-tag { font-size: 10px; font-weight: 600; }
      .bound-label { font-size: 9.5px; font-weight: 600; }
      .code-font { font-family: 'Menlo', 'Courier New', monospace; font-size: 8.5px; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#64748b" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#dc2626" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#0d9488" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- LEFT PANEL: DEPTH UNCERTAINTY DIVERGENCE -->
  <!-- ========================================================================= -->
  <g transform="translate(20, 16)">
    <rect width="445" height="318" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="30" class="panel-title">(a) Illustrative Depth Error Scale</text>

    <!-- Plot Area Background -->
    <rect x="68" y="50" width="352" height="200" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Horizontal Grid Lines (0, 400, 800, 1200 mm) -->
    <line x1="68" y1="250" x2="420" y2="250" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="68" y1="183" x2="420" y2="183" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="68" y1="117" x2="420" y2="117" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="68" y1="50" x2="420" y2="50" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Vertical Grid Lines (0, 5, 10, 15, 20 m) -->
    <line x1="68" y1="50" x2="68" y2="250" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="156" y1="50" x2="156" y2="250" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="244" y1="50" x2="244" y2="250" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="332" y1="50" x2="332" y2="250" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="420" y1="50" x2="420" y2="250" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Y-Axis Ticks & Label -->
    <text x="60" y="253" class="tick-text" text-anchor="end">0</text>
    <text x="60" y="186" class="tick-text" text-anchor="end">400</text>
    <text x="60" y="120" class="tick-text" text-anchor="end">800</text>
    <text x="60" y="54" class="tick-text" text-anchor="end">1200</text>
    <text x="24" y="150" class="axis-label" transform="rotate(-90 24 150)" text-anchor="middle">Depth Standard Deviation σz (mm)</text>

    <!-- X-Axis Ticks & Label -->
    <text x="68" y="266" class="tick-text" text-anchor="middle">0</text>
    <text x="156" y="266" class="tick-text" text-anchor="middle">5</text>
    <text x="244" y="266" class="tick-text" text-anchor="middle">10</text>
    <text x="332" y="266" class="tick-text" text-anchor="middle">15</text>
    <text x="420" y="266" class="tick-text" text-anchor="middle">20</text>
    <text x="244" y="286" class="axis-label" text-anchor="middle">Target Distance z (meters)</text>

    <!-- LiDAR ToF Constant Error Line (~20mm) -->
    <line x1="68" y1="246" x2="420" y2="246" stroke="#0d9488" stroke-width="2"/>
    <rect x="274" y="226" width="138" height="17" rx="3" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="343" y="238" class="curve-tag" fill="#0f766e" text-anchor="middle">LiDAR: assumed ~20 mm</text>

    <!-- Stereo Vision Curve (Quadratic Divergence) -->
    <path d="M 68 250 Q 244 250 420 50" fill="none" stroke="#dc2626" stroke-width="2.2"/>

    <!-- Point at z = 10m -->
    <line x1="244" y1="200" x2="244" y2="250" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="244" cy="200" r="3.5" fill="#dc2626"/>
    <rect x="162" y="180" width="124" height="17" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="224" y="192" font-size="8.5px" font-weight="600" fill="#be123c" text-anchor="middle">z = 10 m → σz ≈ 313 mm</text>

    <!-- Stereo Curve Pill -->
    <rect x="250" y="80" width="128" height="20" rx="4" fill="#fef2f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="314" y="94" class="curve-tag" fill="#be123c" text-anchor="middle">Stereo: σz ∝ z²</text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT PANEL: CLEARANCE INSET GEOMETRY -->
  <!-- ========================================================================= -->
  <g transform="translate(495, 16)">
    <rect width="445" height="318" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="30" class="panel-title">(b) Validated Quantile Inset</text>

    <!-- Workspace Container -->
    <rect x="18" y="50" width="409" height="252" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Uncompensated Nominal Boundary C_nominal (Dashed Blue) -->
    <rect x="170" y="58" width="242" height="170" rx="4" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="180" y="71" class="bound-label" fill="#2563eb">C<tspan baseline-shift="sub" font-size="8">nominal</tspan> (Uncompensated)</text>

    <!-- Enforced Inset Boundary C_inset (Solid Teal / Soft Green fill) -->
    <rect x="205" y="78" width="195" height="130" rx="3" fill="#f0fdf4" fill-opacity="0.45" stroke="#0d9488" stroke-width="1.5"/>
    <text x="215" y="91" class="bound-label" fill="#0f766e">C<tspan baseline-shift="sub" font-size="8">inset</tspan> = C<tspan baseline-shift="sub" font-size="8">safe</tspan> + ‖ε‖<tspan baseline-shift="sub" font-size="8">P99</tspan></text>

    <!-- Physical Hard Barrier C_safe (Dashed Emerald) -->
    <rect x="248" y="98" width="140" height="92" rx="4" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="256" y="184" class="bound-label" fill="#166534">C<tspan baseline-shift="sub" font-size="8">safe</tspan> (clearance target)</text>

    <!-- Robot Platform (Left) -->
    <g transform="translate(24, 115)">
      <!-- Wheels -->
      <rect x="4" y="-5" width="10" height="5" rx="1" fill="#475569"/>
      <rect x="4" y="54" width="10" height="5" rx="1" fill="#475569"/>
      <rect x="44" y="-5" width="10" height="5" rx="1" fill="#475569"/>
      <rect x="44" y="54" width="10" height="5" rx="1" fill="#475569"/>

      <!-- Chassis -->
      <rect x="0" y="0" width="58" height="54" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
      <text x="29" y="31" class="code-font" fill="#94a3b8" text-anchor="middle">base_link</text>

      <!-- Front Camera Sensor -->
      <rect x="55" y="21" width="5" height="12" rx="1" fill="#0d9488"/>

      <!-- Forward Velocity Arrow -->
      <line x1="60" y1="27" x2="84" y2="27" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
      <text x="72" y="20" font-size="10px" font-weight="700" fill="#dc2626" font-style="italic">v</text>

      <!-- Sightline Frustum Rays (Dashed, targeting obstacle) -->
      <line x1="60" y1="27" x2="286" y2="10" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,2"/>
      <line x1="60" y1="27" x2="286" y2="44" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,2"/>
    </g>

    <!-- Detected Obstacle & Covariance Ellipsoid (Right) -->
    <g transform="translate(318, 142)">
      <!-- Illustrative validated spatial-error region; not covariance alone -->
      <ellipse cx="0" cy="0" rx="36" ry="20" fill="#fef2f2" stroke="#f87171" stroke-width="1.2" stroke-dasharray="3,2"/>

      <!-- Ellipsoid Axis Markers -->
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#f87171" stroke-width="0.8"/>
      <text x="39" y="3" font-size="8px" fill="#dc2626">δz</text>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#f87171" stroke-width="0.8"/>
      <text x="3" y="28" font-size="8px" fill="#dc2626">δx</text>

      <!-- Physical Obstacle Box -->
      <rect x="-14" y="-12" width="28" height="24" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
      <text x="0" y="3" font-size="8.5px" font-weight="600" fill="#1e293b" text-anchor="middle">Obstacle</text>

      <!-- Ellipsoid Label cleanly placed above ellipse -->
      <text x="0" y="-23" font-size="8.5px" font-weight="600" fill="#dc2626" text-anchor="middle">Validated P<tspan baseline-shift="sub" font-size="8">99</tspan> region</text>
    </g>

    <text x="225" y="300" font-size="9px" fill="#475569" text-anchor="middle">One-percent test-distribution tail remains</text>

    <!-- Bottom Dimension: Inset Margin Definition -->
    <g transform="translate(84, 246)">
      <!-- Line representing defended clearance buffer to C_inset -->
      <line x1="0" y1="0" x2="121" y2="0" stroke="#0d9488" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="2" fill="#0d9488"/>
      <circle cx="121" cy="0" r="2" fill="#0d9488"/>
      <text x="60" y="15" class="bound-label" fill="#0f766e" text-anchor="middle">Defended Margin C<tspan baseline-shift="sub" font-size="8">inset</tspan></text>
    </g>

    <g transform="translate(84, 274)">
      <!-- Line representing uncompensated nominal plan to C_nominal -->
      <line x1="0" y1="0" x2="164" y2="0" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
      <circle cx="0" cy="0" r="2" fill="#64748b"/>
      <circle cx="164" cy="0" r="2" fill="#64748b"/>
      <text x="82" y="14" font-size="9px" font-weight="500" fill="#64748b" text-anchor="middle">Nominal Clearance (Uncompensated)</text>
    </g>
  </g>
</svg>