<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#007A87"/></marker>
  </defs>

  <!-- ===== inter-column flow arrows (in gutters) ===== -->
  <line x1="165" y1="140" x2="178" y2="140" stroke="#4A5568" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <line x1="333" y1="140" x2="346" y2="140" stroke="#4A5568" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <line x1="501" y1="140" x2="514" y2="140" stroke="#4A5568" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <!-- ===== 1. feature extraction ===== -->
  <g transform="translate(12,12)">
    <rect width="152" height="276" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="20" font-size="10" font-weight="700" fill="#1A202C">1. Feature extraction</text>
    <!-- image grid -->
    <g transform="translate(22,50)">
      <rect x="0" y="0" width="116" height="84" rx="0" fill="#ffffff" stroke="#4A5568" stroke-width="1.1"/>
      <line x1="0" y1="28" x2="116" y2="28" stroke="#E2E8F0"/>
      <line x1="0" y1="56" x2="116" y2="56" stroke="#E2E8F0"/>
      <line x1="29" y1="0" x2="29" y2="84" stroke="#E2E8F0"/>
      <line x1="58" y1="0" x2="58" y2="84" stroke="#E2E8F0"/>
      <line x1="87" y1="0" x2="87" y2="84" stroke="#E2E8F0"/>
      <rect x="44" y="28" width="29" height="28" fill="#E6F4F5" stroke="#007A87" stroke-width="1.4"/>
      <circle cx="58.5" cy="42" r="2.6" fill="#007A87"/>
      <!-- axes -->
      <line x1="0" y1="-8" x2="26" y2="-8" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-slate)"/>
      <text x="31" y="-5" font-size="8.5" fill="#4A5568" font-style="italic">u</text>
      <line x1="-8" y1="0" x2="-8" y2="24" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-slate)"/>
      <text x="-8" y="36" font-size="8.5" fill="#4A5568" font-style="italic" text-anchor="middle">v</text>
    </g>
    <text x="76" y="150" font-size="8.5" fill="#4A5568" text-anchor="middle">image <tspan font-weight="700">I</tspan>, pixel (<tspan font-style="italic">u</tspan>, <tspan font-style="italic">v</tspan>)</text>
    <line x1="76" y1="156" x2="76" y2="178" stroke="#007A87" stroke-width="1.3" marker-end="url(#arr-petrol)"/>
    <rect x="16" y="182" width="120" height="26" rx="3" fill="#E6F4F5" stroke="#007A87" stroke-width="1"/>
    <text x="76" y="199" font-size="9" font-weight="700" fill="#1A202C" text-anchor="middle">feature <tspan font-style="italic">f</tspan><tspan font-size="8" dy="2">uv</tspan><tspan dy="-2" dx="2">∈ ℝ</tspan><tspan font-size="8" dy="-4">C</tspan></text>
    <rect x="10" y="230" width="132" height="34" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="76" y="251" font-size="9" fill="#1A202C" text-anchor="middle"><tspan font-style="italic">f</tspan><tspan font-size="8" dy="2">uv</tspan><tspan dy="-2" dx="2">= Backbone(</tspan><tspan font-weight="700">I</tspan>)[<tspan font-style="italic">u</tspan>, <tspan font-style="italic">v</tspan>]</text>
  </g>

  <!-- ===== 2. lift ===== -->
  <g transform="translate(180,12)">
    <rect width="152" height="276" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="20" font-size="10" font-weight="700" fill="#1A202C">2. Lift</text>
    <!-- depth distribution sits above the frustum -->
    <path d="M 40 104 C 70 98, 72 40, 86 40 C 100 40, 104 84, 128 70" fill="none" stroke="#B87333" stroke-width="1.6" stroke-dasharray="3,2"/>
    <text x="94" y="38" font-size="8.5" font-weight="700" fill="#B87333" text-anchor="start">p(d | u, v)</text>
    <!-- frustum -->
    <polygon points="16,120 136,74 136,166" fill="#E6F4F5" fill-opacity="0.6" stroke="#007A87" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="16" y1="120" x2="136" y2="120" stroke="#007A87" stroke-width="1.5"/>
    <line x1="48" y1="110" x2="48" y2="130" stroke="#007A87" stroke-width="1"/>
    <line x1="86" y1="96" x2="86" y2="144" stroke="#B87333" stroke-width="2"/>
    <line x1="124" y1="80" x2="124" y2="160" stroke="#007A87" stroke-width="1"/>
    <circle cx="86" cy="120" r="3.5" fill="#B87333"/>
    <circle cx="16" cy="120" r="3.2" fill="#1A202C"/>
    <text x="16" y="138" font-size="8.5" fill="#4A5568" text-anchor="middle">O<tspan font-size="8" dy="2">cam</tspan></text>
    <text x="48" y="144" font-size="8.5" fill="#4A5568" text-anchor="middle">d<tspan font-size="8" dy="2">1</tspan></text>
    <text x="86" y="158" font-size="8.5" font-weight="700" fill="#B87333" text-anchor="middle">d<tspan font-size="8" dy="2">k</tspan></text>
    <text x="124" y="174" font-size="8.5" fill="#4A5568" text-anchor="middle">d<tspan font-size="8" dy="2">D</tspan></text>
    <text x="16" y="186" font-size="8.5" fill="#007A87" font-style="italic">ray r(u, v)</text>
    <rect x="16" y="196" width="120" height="24" rx="3" fill="#FBF3EC" stroke="#B87333" stroke-width="1"/>
    <text x="76" y="212" font-size="9" font-weight="700" fill="#1A202C" text-anchor="middle">point feature <tspan font-style="italic">c</tspan><tspan font-size="8" dy="2">uvk</tspan></text>
    <rect x="10" y="230" width="132" height="34" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="76" y="251" font-size="9" fill="#1A202C" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="8" dy="2">uvk</tspan><tspan dy="-2" dx="3">=</tspan><tspan font-style="italic" dx="3">p</tspan><tspan font-size="8" dy="2">uv</tspan><tspan dy="-2">(k)</tspan><tspan dx="3">·</tspan><tspan font-style="italic" dx="3">f</tspan><tspan font-size="8" dy="2">uv</tspan></text>
  </g>

  <!-- ===== 3. splat ===== -->
  <g transform="translate(348,12)">
    <rect width="152" height="276" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="20" font-size="10" font-weight="700" fill="#1A202C">3. Splat</text>
    <g transform="translate(18,40)">
      <rect x="0" y="0" width="116" height="120" rx="0" fill="#ffffff" stroke="#4A5568" stroke-width="1"/>
      <line x1="0" y1="30" x2="116" y2="30" stroke="#E2E8F0"/>
      <line x1="0" y1="60" x2="116" y2="60" stroke="#E2E8F0"/>
      <line x1="0" y1="90" x2="116" y2="90" stroke="#E2E8F0"/>
      <line x1="29" y1="0" x2="29" y2="120" stroke="#E2E8F0"/>
      <line x1="58" y1="0" x2="58" y2="120" stroke="#E2E8F0"/>
      <line x1="87" y1="0" x2="87" y2="120" stroke="#E2E8F0"/>
      <path d="M 58 98 L 14 10 L 102 10 Z" fill="#E6F4F5" fill-opacity="0.7" stroke="#007A87" stroke-width="0.9" stroke-dasharray="2,2"/>
      <rect x="44" y="30" width="29" height="30" fill="#FBF3EC" stroke="#B87333" stroke-width="1.4"/>
      <text x="58.5" y="50" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">Σ</text>
      <rect x="48" y="98" width="20" height="14" rx="0" fill="#334155"/>
    </g>
    <text x="76" y="176" font-size="8.5" fill="#4A5568" text-anchor="middle">pillar (X, Y); base below</text>
    <rect x="16" y="196" width="120" height="24" rx="3" fill="#ffffff" stroke="#4A5568" stroke-width="1"/>
    <text x="76" y="212" font-size="9" font-weight="700" fill="#1A202C" text-anchor="middle">extrinsic <tspan font-weight="700">T</tspan><tspan font-size="8" dy="2">base←cam</tspan></text>
    <rect x="10" y="230" width="132" height="34" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="76" y="251" font-size="9" fill="#1A202C" text-anchor="middle"><tspan font-weight="700">V</tspan><tspan font-size="8" dy="2">BEV</tspan><tspan dy="-2" dx="2">(X, Y) = Σ</tspan><tspan font-style="italic" dx="3">c</tspan><tspan font-size="8" dy="2">uvk</tspan></text>
  </g>

  <!-- ===== 4. clearance check ===== -->
  <g transform="translate(516,12)">
    <rect width="152" height="276" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="20" font-size="10" font-weight="700" fill="#1A202C">4. Clearance check</text>
    <!-- depth axis -->
    <line x1="14" y1="70" x2="130" y2="70" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-slate)"/>
    <text x="136" y="73" font-size="8.5" fill="#4A5568" font-style="italic">Z</text>
    <circle cx="36" cy="70" r="4.5" fill="#E6F4F5" stroke="#007A87" stroke-width="1.2"/>
    <text x="36" y="90" font-size="8.5" fill="#4A5568" text-anchor="middle">near</text>
    <ellipse cx="96" cy="70" rx="22" ry="7" fill="#E6F4F5" stroke="#007A87" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="96" cy="70" r="2" fill="#007A87"/>
    <text x="96" y="90" font-size="8.5" fill="#4A5568" text-anchor="middle">far</text>
    <text x="76" y="48" font-size="8.5" font-weight="700" fill="#007A87" text-anchor="middle">depth estimated</text>
    <!-- obstacle and boundaries -->
    <rect x="30" y="112" width="92" height="16" rx="0" fill="#334155"/>
    <text x="76" y="123" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">obstacle</text>
    <line x1="20" y1="148" x2="132" y2="148" stroke="#A51C30" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="76" y="142" font-size="8.5" fill="#A51C30" text-anchor="middle">C<tspan font-size="8" dy="2">safe</tspan><tspan dy="-2" dx="3">(target)</tspan></text>
    <line x1="12" y1="176" x2="140" y2="176" stroke="#1A4D3E" stroke-width="1.6"/>
    <text x="76" y="170" font-size="8.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">C<tspan font-size="8" dy="2">inset</tspan><tspan dy="-2" dx="3">(checked)</tspan></text>
    <rect x="10" y="230" width="132" height="34" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="76" y="251" font-size="9" fill="#1A202C" text-anchor="middle">C<tspan font-size="8" dy="2">inset</tspan><tspan dy="-2" dx="2">= C</tspan><tspan font-size="8" dy="2">safe</tspan><tspan dy="-2" dx="3">+ ‖&#8201;ε&#8201;‖</tspan><tspan font-size="8" dy="2">P99</tspan></text>
  </g>
</svg>
