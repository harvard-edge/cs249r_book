<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .col-header { font-weight: 700; font-size: 13.5px; fill: #0f172a; }
      .lbl-text { font-size: 11px; fill: #475569; }
      .lbl-red { font-weight: 600; font-size: 11px; fill: #dc2626; }
      .contract-hdr { font-weight: 700; font-size: 12.5px; fill: #0f172a; }
      .contract-body { font-size: 13px; fill: #1e293b; }
    </style>
    <marker id="arrow_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow_slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Column Headers -->
  <text x="100" y="32" class="col-header" text-anchor="middle">(1) Hardware Ingress &amp; Patch</text>
  <text x="440" y="32" class="col-header" text-anchor="middle">(2) 2D-to-3D Ray Lifting</text>
  <text x="700" y="32" class="col-header" text-anchor="middle">(3) Metric Voxel Splatting</text>
  <text x="890" y="32" class="col-header" text-anchor="middle">(4) Propagated Uncertainty</text>

  <!-- (1) 2D Pixel Array -->
  <rect x="50" y="60" width="100" height="100" fill="#ffffff" stroke="#334155" stroke-width="1.4" rx="0"/>
  <line x1="50" y1="85" x2="150" y2="85" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="50" y1="110" x2="150" y2="110" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="50" y1="135" x2="150" y2="135" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="75" y1="60" x2="75" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="100" y1="60" x2="100" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="125" y1="60" x2="125" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  
  <rect x="75" y="85" width="25" height="25" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="0"/>
  <text x="100" y="180" class="lbl-text" text-anchor="middle">2D Pixel Array</text>

  <!-- Transition (1) -> (2) -->
  <line x1="160" y1="110" x2="260" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow_slate)"/>
  <circle cx="278" cy="110" r="4" fill="#334155"/>
  <text x="278" y="130" class="lbl-text" text-anchor="middle">Camera Center</text>

  <!-- (2) Ray Frustum -->
  <line x1="278" y1="110" x2="540" y2="48" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="278" y1="110" x2="545" y2="110" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="278" y1="110" x2="540" y2="172" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>

  <line x1="370" y1="90" x2="370" y2="130" stroke="#2563eb" stroke-width="2"/>
  <line x1="420" y1="85" x2="420" y2="135" stroke="#2563eb" stroke-width="2"/>
  <line x1="470" y1="80" x2="470" y2="140" stroke="#2563eb" stroke-width="2"/>
  <line x1="520" y1="75" x2="520" y2="145" stroke="#2563eb" stroke-width="2"/>
  <text x="445" y="164" class="lbl-text" fill="#1d4ed8" font-weight="600" text-anchor="middle">Discrete Depth Bins</text>

  <!-- Transition (2) -> (3) -->
  <line x1="550" y1="110" x2="600" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow_slate)"/>

  <!-- (3) Metric Voxel Grid -->
  <rect x="615" y="60" width="170" height="100" fill="#ffffff" stroke="#334155" stroke-width="1.4" rx="0"/>
  <line x1="615" y1="85" x2="785" y2="85" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="615" y1="110" x2="785" y2="110" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="615" y1="135" x2="785" y2="135" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="649" y1="60" x2="649" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="683" y1="60" x2="683" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="717" y1="60" x2="717" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="751" y1="60" x2="751" y2="160" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="650" y="110" width="33" height="25" fill="#93c5fd" fill-opacity="0.7" stroke="#2563eb" stroke-width="1" rx="0"/>
  <rect x="684" y="110" width="33" height="25" fill="#60a5fa" fill-opacity="0.7" stroke="#2563eb" stroke-width="1" rx="0"/>
  <rect x="718" y="110" width="33" height="25" fill="#3b82f6" fill-opacity="0.7" stroke="#2563eb" stroke-width="1" rx="0"/>
  <text x="700" y="180" class="lbl-text" text-anchor="middle">Metric Voxel Grid</text>

  <!-- Transition (3) -> (4) -->
  <line x1="795" y1="110" x2="835" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow_slate)"/>

  <!-- (4) Propagated Uncertainty -->
  <rect x="884" y="104" width="12" height="12" fill="#0f172a" rx="0"/>
  <ellipse cx="890" cy="110" rx="44" ry="16" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3,3"/>
  <text x="890" y="146" class="lbl-red" text-anchor="middle">Elongated Covariance</text>
  <text x="890" y="160" class="lbl-red" text-anchor="middle">at Range (δz ∝ z²)</text>

  <!-- Bottom Card: Clearance Contract -->
  <rect x="150" y="220" width="700" height="78" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="500" y="246" class="contract-hdr" text-anchor="middle">Perception-Safety Clearance Contract</text>
  <text x="500" y="274" class="contract-body" text-anchor="middle">Every spatial measurement must include: (1) Ingress Timestamp t<tspan baseline-shift="sub" font-size="10">0</tspan>, (2) Sensor Frame F<tspan baseline-shift="sub" font-size="10">sensor</tspan>, (3) Spatial Covariance Σ<tspan baseline-shift="sub" font-size="10">z</tspan></text>
</svg>
