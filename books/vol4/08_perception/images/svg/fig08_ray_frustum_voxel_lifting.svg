<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .col-header { font-size: 12px; font-weight: 700; }
      .math-font { font-family: "STIX Two Text", "Times New Roman", Georgia, serif; font-size: 13.5px; fill: #1e293b; }
      .math-sym { font-style: italic; font-weight: 600; }
      .code-tag { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8.5px; }
      .annot-text { font-size: 9px; font-weight: 600; }
    </style>

    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#64748b" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#dc2626" />
    </marker>

    <linearGradient id="grad-frustum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- INTER-COLUMN FLOW ARROWS -->
  <!-- ========================================================================= -->
  <!-- Flow 1 -> 2 -->
  <line x1="242" y1="155" x2="260" y2="155" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <!-- Flow 2 -> 3 -->
  <line x1="488" y1="155" x2="506" y2="155" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <!-- Flow 3 -> 4 -->
  <line x1="734" y1="155" x2="752" y2="155" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-slate)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: 2D IMAGE PLANE & FEATURE EXTRACTION -->
  <!-- ========================================================================= -->
  <g transform="translate(16, 14)">
    <rect width="224" height="312" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Header -->
    <rect width="224" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="112" y="21" class="col-header" fill="#1e40af" text-anchor="middle">1. Image Features</text>

    <!-- Visual Container -->
    <rect x="12" y="44" width="200" height="198" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Sensor Pixel Array Grid -->
    <g transform="translate(32, 54)">
      <rect x="0" y="0" width="160" height="114" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
      
      <!-- Subdivisions -->
      <line x1="0" y1="28" x2="160" y2="28" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="57" x2="160" y2="57" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="85" x2="160" y2="85" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="114" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="80" y1="0" x2="80" y2="114" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="114" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Axes -->
      <line x1="0" y1="-7" x2="30" y2="-7" stroke="#64748b" stroke-width="1" marker-end="url(#arr-slate)"/>
      <text x="35" y="-4" class="code-tag" fill="#64748b">+u</text>
      <line x1="-7" y1="0" x2="-7" y2="26" stroke="#64748b" stroke-width="1" marker-end="url(#arr-slate)"/>
      <text x="-7" y="36" class="code-tag" fill="#64748b" text-anchor="middle">+v</text>

      <!-- Center (cx, cy) -->
      <circle cx="80" cy="57" r="2.5" fill="#94a3b8"/>

      <!-- Centered Highlighted Patch at (u, v) -->
      <rect x="60" y="42" width="40" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
      <circle cx="80" cy="57" r="3" fill="#1d4ed8"/>
      <text x="80" y="52" font-size="8.5px" font-weight="600" fill="#1e40af" text-anchor="middle">(u, v)</text>
    </g>

    <!-- Feature Vector Projection (Aligned with patch) -->
    <g transform="translate(32, 184)">
      <line x1="80" y1="-16" x2="80" y2="14" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arr-blue)"/>
      <rect x="8" y="16" width="144" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text x="80" y="32" class="annot-text" fill="#1e40af" text-anchor="middle">Feature Vector <tspan class="math-sym">f</tspan><tspan baseline-shift="sub" font-size="7.5">uv</tspan> &#8712; &#8477;<tspan baseline-shift="super" font-size="7">C</tspan></text>
    </g>

    <!-- Bottom Math Capsule -->
    <rect x="12" y="252" width="200" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="112" y="281" class="math-font" text-anchor="middle">
      <tspan class="math-sym">f</tspan><tspan baseline-shift="sub" font-size="9">uv</tspan> = Backbone(<tspan class="math-sym">I</tspan>)[<tspan class="math-sym">u</tspan>,&#8201;<tspan class="math-sym">v</tspan>]
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: FRUSTUM LIFT & DEPTH PROBABILITY -->
  <!-- ========================================================================= -->
  <g transform="translate(262, 14)">
    <rect width="224" height="312" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Header -->
    <rect width="224" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="112" y="21" class="col-header" fill="#0f172a" text-anchor="middle">2. Frustum Lift</text>

    <!-- Visual Container -->
    <rect x="12" y="44" width="200" height="198" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Frustum Geometry Diagram -->
    <g transform="translate(18, 52)">
      <!-- Camera Origin O_cam -->
      <circle cx="16" cy="98" r="3.5" fill="#0f172a"/>
      <text x="16" y="115" class="code-tag" fill="#475569" text-anchor="middle">O<tspan baseline-shift="sub">cam</tspan></text>

      <!-- Frustum Volume Boundary -->
      <polygon points="16,98 174,42 174,154" fill="url(#grad-frustum)" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Optical Bearing Ray r(u, v) -->
      <line x1="16" y1="98" x2="174" y2="98" stroke="#2563eb" stroke-width="1.6"/>
      <text x="142" y="92" class="code-tag" fill="#1e40af" font-weight="600">r(u,v)</text>

      <!-- Discretized Depth Slices d_1, d*, d_D -->
      <line x1="60" y1="88" x2="60" y2="108" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="60" y="120" class="code-tag" fill="#64748b" text-anchor="middle">d<tspan baseline-shift="sub">1</tspan></text>

      <line x1="108" y1="70" x2="108" y2="126" stroke="#2563eb" stroke-width="2"/>
      <text x="108" y="138" class="code-tag" fill="#1d4ed8" font-weight="700" text-anchor="middle">d<tspan baseline-shift="sub">*</tspan></text>

      <line x1="156" y1="52" x2="156" y2="144" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="156" y="156" class="code-tag" fill="#64748b" text-anchor="middle">d<tspan baseline-shift="sub">D</tspan></text>

      <!-- Softmax Depth Probability Distribution Curve p(d | u, v) -->
      <path d="M 52,98 Q 80,94 108,44 T 162,98" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3,2"/>
      <text x="110" y="38" class="code-tag" fill="#b45309" font-weight="700" text-anchor="middle">p(d|u,v)</text>

      <!-- 3D Frustum Point Feature at peak -->
      <circle cx="108" cy="98" r="4" fill="#1d4ed8"/>
      
      <!-- Label below -->
      <rect x="26" y="160" width="144" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text x="98" y="175" class="annot-text" fill="#1e40af" text-anchor="middle">Point Feature <tspan class="math-sym">c</tspan><tspan baseline-shift="sub" font-size="7.5">uvk</tspan></text>
    </g>

    <!-- Bottom Math Capsule -->
    <rect x="12" y="252" width="200" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="112" y="281" class="math-font" text-anchor="middle">
      <tspan class="math-sym">c</tspan><tspan baseline-shift="sub" font-size="9">uvk</tspan> = <tspan class="math-sym">p</tspan><tspan baseline-shift="sub" font-size="9">k</tspan> · <tspan class="math-sym">f</tspan><tspan baseline-shift="sub" font-size="9">uv</tspan>
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: BEV SPLAT & PILLAR POOLING -->
  <!-- ========================================================================= -->
  <g transform="translate(508, 14)">
    <rect width="224" height="312" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Header -->
    <rect width="224" height="32" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="112" y="21" class="col-header" fill="#166534" text-anchor="middle">3. BEV Splat</text>

    <!-- Visual Container -->
    <rect x="12" y="44" width="200" height="198" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- BEV Metric Grid Diagram -->
    <g transform="translate(32, 54)">
      <!-- Metric Grid Area -->
      <rect x="0" y="0" width="160" height="114" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
      
      <!-- Grid Subdivisions -->
      <line x1="0" y1="28" x2="160" y2="28" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="57" x2="160" y2="57" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="85" x2="160" y2="85" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="114" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="80" y1="0" x2="80" y2="114" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="114" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Camera Sightline Cone -->
      <path d="M 80,94 L 20,12 L 140,12 Z" fill="#3b82f6" fill-opacity="0.1" stroke="#2563eb" stroke-width="0.9" stroke-dasharray="2,2"/>

      <!-- Robot Base Link at bottom center -->
      <rect x="68" y="94" width="24" height="16" rx="2" fill="#0f172a"/>
      <circle cx="80" cy="102" r="2" fill="#10b981"/>
      <text x="80" y="122" class="code-tag" fill="#475569" text-anchor="middle">Base</text>

      <!-- Pooled Pillar Cell (X, Y) -->
      <rect x="60" y="28" width="40" height="29" fill="#86efac" fill-opacity="0.75" stroke="#16a34a" stroke-width="1.4"/>
      <text x="80" y="48" font-size="12px" font-weight="700" fill="#14532d" text-anchor="middle">&#8721;</text>
      <text x="80" y="23" class="code-tag" fill="#166534" font-weight="600" text-anchor="middle">(X, Y)</text>
    </g>

    <!-- Extrinsics Annotation -->
    <g transform="translate(32, 184)">
      <rect x="8" y="16" width="144" height="24" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="80" y="32" class="annot-text" fill="#166534" text-anchor="middle">Extrinsic Transform <tspan class="math-sym">T</tspan><tspan baseline-shift="sub" font-size="7.5">base</tspan><tspan baseline-shift="super" font-size="7">cam</tspan></text>
    </g>

    <!-- Bottom Math Capsule -->
    <rect x="12" y="252" width="200" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="112" y="281" class="math-font" text-anchor="middle">
      <tspan class="math-sym">V</tspan><tspan baseline-shift="sub" font-size="9">BEV</tspan>(<tspan class="math-sym">X</tspan>,&#8201;<tspan class="math-sym">Y</tspan>) = &#8721; <tspan class="math-sym">c</tspan><tspan baseline-shift="sub" font-size="9">uvk</tspan>
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 4: COVARIANCE PROPAGATION & CLEARANCE INSET -->
  <!-- ========================================================================= -->
  <g transform="translate(754, 14)">
    <rect width="224" height="312" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    
    <!-- Header -->
    <rect width="224" height="32" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="112" y="21" class="col-header" fill="#991b1b" text-anchor="middle">4. Clearance Inset</text>

    <!-- Visual Container -->
    <rect x="12" y="44" width="200" height="198" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Covariance Growth & Clearance Diagram -->
    <g transform="translate(18, 52)">
      <!-- Sightline Z axis -->
      <line x1="10" y1="36" x2="166" y2="36" stroke="#64748b" stroke-width="1" marker-end="url(#arr-slate)"/>
      <text x="170" y="39" class="code-tag" fill="#64748b">Z</text>

      <!-- Near Covariance (Z = 1m) -->
      <circle cx="40" cy="36" r="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="40" y="52" class="code-tag" fill="#2563eb" text-anchor="middle">Z=1m</text>

      <!-- Far Covariance (Z = 8m, Elongated) -->
      <g transform="translate(126, 36) rotate(-10)">
        <ellipse cx="0" cy="0" rx="24" ry="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
        <circle cx="0" cy="0" r="2" fill="#dc2626"/>
      </g>
      <text x="126" y="20" class="code-tag" fill="#dc2626" font-weight="700" text-anchor="middle">&#948;Z &#8733; Z&#178;</text>
      <text x="126" y="52" class="code-tag" fill="#dc2626" text-anchor="middle">Z=8m</text>

      <!-- Defended Obstacle & Clearance Boundaries -->
      <g transform="translate(6, 82)">
        <!-- Obstacle Block -->
        <rect x="30" y="14" width="94" height="16" rx="2" fill="#334155"/>
        <text x="77" y="25" font-size="8px" font-weight="600" fill="#ffffff" text-anchor="middle">Obstacle</text>

        <!-- Physical Barrier C_safe -->
        <line x1="16" y1="46" x2="138" y2="46" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
        <text x="77" y="39" class="code-tag" fill="#dc2626" text-anchor="middle">C<tspan baseline-shift="sub">safe</tspan> (Barrier)</text>

        <!-- Defended Inset Margin C_inset -->
        <line x1="4" y1="66" x2="150" y2="66" stroke="#16a34a" stroke-width="1.6"/>
        <text x="77" y="59" class="code-tag" fill="#15803d" font-weight="700" text-anchor="middle">C<tspan baseline-shift="sub">inset</tspan> (Shield)</text>
      </g>
    </g>

    <!-- Bottom Math Capsule -->
    <rect x="12" y="252" width="200" height="48" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="112" y="281" class="math-font" fill="#991b1b" text-anchor="middle">
      <tspan class="math-sym">C</tspan><tspan baseline-shift="sub" font-size="9">inset</tspan> = <tspan class="math-sym">C</tspan><tspan baseline-shift="sub" font-size="9">safe</tspan> + &#8214;<tspan class="math-sym">&#949;</tspan>&#8214;<tspan baseline-shift="sub" font-size="8">P99</tspan>
    </text>
  </g>
</svg>
