<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#2563eb"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Outer Card Background -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Sub-card: Latency Waterfall -->
  <rect x="16" y="16" width="246" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="26" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b">PIPELINE LATENCY WATERFALL (τ_age)</text>

  <!-- Stacked Waterfall Segments -->
  <!-- Segment 1: Transduction (t_exp/2 + readout) -->
  <rect x="26" y="39" width="104" height="23" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="32" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#1e3a8a">Sensor Transduction</text>
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#1e3a8a">texp/2 (8.0ms) + tread (16.6ms)</text>

  <!-- Segment 2: Ingress & ISP -->
  <rect x="133" y="39" width="34" height="23" rx="2" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75"/>
  <text x="150" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#581c87" text-anchor="middle">Ingress</text>
  <text x="150" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#581c87" text-anchor="middle">4.5 ms</text>

  <!-- Segment 3: ViT + IPC -->
  <rect x="170" y="39" width="82" height="23" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
  <text x="175" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#78350f">NPU Backbone + IPC</text>
  <text x="175" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#78350f">ViT (22ms) + IPC (0.5ms)</text>

  <!-- Timeline axis -->
  <line x1="26" y1="70" x2="252" y2="70" stroke="#94a3b8" stroke-width="1"/>
  <line x1="26" y1="67" x2="26" y2="73" stroke="#94a3b8" stroke-width="1"/>
  <line x1="130" y1="67" x2="130" y2="73" stroke="#94a3b8" stroke-width="1"/>
  <line x1="167" y1="67" x2="167" y2="73" stroke="#94a3b8" stroke-width="1"/>
  <line x1="252" y1="67" x2="252" y2="73" stroke="#94a3b8" stroke-width="1"/>
  <text x="26" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b" text-anchor="start">t0: Exposure Midpoint (0 ms)</text>
  <text x="252" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e293b" text-anchor="end">trecv = 51.6 ms</text>

  <!-- Total Age Callout Box -->
  <rect x="26" y="88" width="226" height="43" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="32" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#1e293b">Total Spatial Information Age: τ_age = 51.6 ms</text>
  <text x="32" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#475569">Chassis forward travel at v = 2.5 m/s:</text>
  <text x="32" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#b91c1c">Δx_forward = 2.5 m/s × 51.6 ms = 129 mm</text>

  <!-- Status pill badge -->
  <rect x="26" y="137" width="226" height="18" rx="9" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
  <text x="139" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#78350f" text-anchor="middle">Capture pose must be advanced to decision time</text>

  <!-- Right Sub-card: Physical Corridor Depletion -->
  <rect x="272" y="16" width="252" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="282" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b">FORWARD PRE-BRAKE RESERVE (TOP-DOWN)</text>

  <!-- Aisle Corridor Graphic -->
  <!-- Top wall -->
  <rect x="282" y="36" width="232" height="5" fill="url(#hatch)" stroke="#94a3b8" stroke-width="0.5"/>
  <!-- Bottom wall -->
  <rect x="282" y="105" width="232" height="5" fill="url(#hatch)" stroke="#94a3b8" stroke-width="0.5"/>

  <!-- Ghost robot at t0 (exposure midpoint) -->
  <rect x="286" y="47" width="38" height="26" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"/>
  <text x="305" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14532d" text-anchor="middle">AMR (t0)</text>
  <text x="305" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6" fill="#14532d" text-anchor="middle">x = 0 mm</text>

  <!-- Solid robot at trecv (perception ready) -->
  <rect x="346" y="47" width="38" height="26" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/>
  <text x="365" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14532d" text-anchor="middle">AMR (trecv)</text>
  <text x="365" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6" fill="#14532d" text-anchor="middle">+129 mm</text>

  <!-- Displacement Vector Arrow -->
  <line x1="326" y1="56" x2="344" y2="56" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="335" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Δx = 129mm</text>

  <!-- Obstacle boundary ahead -->
  <rect x="474" y="44" width="40" height="58" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="494" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#334155" text-anchor="middle">Obstacle</text>
  <text x="494" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#64748b" text-anchor="middle">Boundary</text>

  <!-- Odometric back-projection annotation -->
  <path d="M 365 75 L 365 85 L 305 85 L 305 75" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 1.5" marker-end="url(#arr-blue)"/>
  <text x="335" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Odometric back-projection to t0</text>

  <!-- Forward pre-brake reserve after braking distance and safety clearance -->
  <rect x="282" y="116" width="232" height="15" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
  <!-- Depleted segment: 129mm / 200mm = 64.5% of 232 = 150px -->
  <rect x="282" y="116" width="150" height="15" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="357" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Age travel: 129 mm (64.5%)</text>
  <!-- Residual segment: 35.5% = 82px -->
  <rect x="432" y="116" width="82" height="15" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="473" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#14532d" text-anchor="middle">Residual: 71 mm</text>

  <!-- Bottom takeaway badge -->
  <rect x="282" y="137" width="232" height="18" rx="9" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="398" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.2" font-weight="bold" fill="#7f1d1d" text-anchor="middle">71 mm LEFT FOR PERMISSION + ACTUATOR DELAY</text>
</svg>
