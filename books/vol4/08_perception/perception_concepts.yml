      source: vol4.sensing.capture
      predicate: starts the clock for
      target: vol4.sensing.age
      explanation: Observation age starts at physical capture and includes the time spent acquiring, processing,
        transporting, and waiting to use the evidence.
      conditions: Clock conversion and exposure semantics must be qualified; a host receipt timestamp is
        not a capture timestamp.
      status: draft
      evidence:
        section: sec-perception-age-budget
        quote: Even when a rack-end observation is dated at capture and placed in a calibrated coordinate
          frame, the scene it describes belongs to the past. Delivering that measurement across an embodied
          runtime adds acquisition, bus transport, queueing, and neural inference delay while the robot
          continues to move. Any delivery deadline for perception must therefore track the full physical
          interval from energy integration at the detector through dispatch, bounding the observation's
          age before downstream actuators act.
