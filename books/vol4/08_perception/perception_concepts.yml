    - id: vol4.field.sensing-spatial-error--enforcement-envelope
      source: vol4.sensing.spatial-error
      predicate: reduces credited clearance in
      target: vol4.enforcement.envelope
      explanation: Qualified measurement and calibration residuals are charged as an inset, reducing the
        clearance a stopping calculation may credit.
      conditions: Use the residual qualification and coverage conditions in the observation contract; a
        neural confidence score is not a spatial error bound.
      status: draft
      evidence:
        section: sec-perception-error-clearance
        quote: If perception places a warehouse rack upright just a few centimeters farther from the base's
          trajectory than it actually stands, the motion planner consumes those missing centimeters directly
          from its `{python} RollingShutterSkew.side_clearance_str` side clearance, although no stage of
          the pipeline decided to spend them. Once downstream control logic uses an estimated coordinate
          to authorize motion, every spatial error becomes a physical displacement drawn from the clearance
          that protects the robot from collision. Transforming a raw sensor observation into a trustworthy
          clearance claim requires **metric grounding**\index{Metric grounding!definition}, which maps detector
          measurements into Euclidean space. This grounding relies on unprojecting two-dimensional sensor
          measurements into three dimensions, an inverse problem that assumes calibrated optics, rigid structural
          mountings, and predictable surface properties.
