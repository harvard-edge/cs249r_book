  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.learning.shift
      label: Endogenous covariate shift
      teaches: Endogenous covariate shift
      summary: The change in visited states and subsequent observations caused by the learned policy executing
        its own actions.
      section: sec-data-covariate-shift
    - id: vol4.learning.compounding-error
      label: Compounding error
      teaches: Compounding error and recoverability
      summary: Growth of closed-loop consequences as early policy errors change later states and expose
        further errors; recovery behavior can limit that growth.
      section: sec-data-curse-dimensionality-recoverability
    - id: vol4.learning.recovery
      label: Recovery demonstrations
      teaches: Compounding error and recoverability
      summary: Examples of corrective actions from off-nominal states, rather than only successful progress
        along an expert path.
      section: sec-data-curse-dimensionality-recoverability
    - id: vol4.deployment.odd
      label: Operational design domain
      teaches: Operational design domain
      summary: Declared external conditions in which the policy is intended to operate and for which its
        data and evaluation need coverage.
      section: sec-data-policy-coverage
    relationships:
    - id: vol4.field.learning-shift--learning-recovery
      source: vol4.learning.shift
      predicate: creates need for
      target: vol4.learning.recovery
      explanation: The policy visits states its expert did not, and those states need corrective actions
        if the learner is to recover.
      conditions: Recovery examples must cover the actual off-nominal state and action semantics; low held-out
        imitation loss does not show this coverage.
      status: draft
      evidence:
        section: sec-data-covariate-shift
        quote: Together, the policy's closed-loop actions and the plant's response induce an *endogenous
          state visitation distribution* $\LearnerStateVisitationDistribution(\DecisionProcessState)$, the
          expected fraction of time steps that a rollout of policy $\pi$ spends in state $\DecisionProcessState$.
          When an agent is trained by offline behavioral cloning on demonstrations from an expert policy
          $\pi^*$, empirical risk minimization fits the imitation objective only over the expert's occupancy
          distribution $\ExpertStateVisitationDistribution(\DecisionProcessState)$. During autonomous execution,
          the learned policy instead acts under its own induced distribution $\LearnerStateVisitationDistribution(\DecisionProcessState)$.
          Wherever $\LearnerStateVisitationDistribution$ departs from $\ExpertStateVisitationDistribution$,
          the policy encounters states that hold no demonstrated corrective action.
    - id: vol4.field.learning-recovery--learning-compounding-error
      source: vol4.learning.recovery
      predicate: can limit
      target: vol4.learning.compounding-error
      explanation: Corrective actions from off-nominal states can keep an initial policy error from driving
        further closed-loop divergence.
      conditions: Recoverability depends on the plant and task dynamics; demonstrations must teach the actual
        corrective action and physical evaluation must test it.
      status: draft
      evidence:
        section: sec-data-curse-dimensionality-recoverability
        quote: Whether this missing return action leads to task failure depends on the closed-loop dynamics
          of the complete physical plant. Because the robot's physical state encompasses joint coordinates,
          joint velocities, motor drive currents, contact wrenches (combined three-axis contact forces and
          torques), and raw camera streams, a nominal demonstration traces an infinitesimally thin manifold
          through a high-dimensional state space. Almost any unmodeled disturbance displaces the system
          off this path. If the physical plant and its low-level joint controllers inherently restore small
          lateral displacements toward the centerline through compliant passive dynamics, an imperfect policy
          output near the corridor boundary will naturally attenuate. If the system dynamics lack this self-centering
          stability, the tracking error will persist or compound until a learned recovery policy, the safety
          permission path, or a human supervisor intervenes. While production demonstration archives often
          contain occasional human corrections, their coverage cannot be assumed; it must be audited against
          an explicit scenario table (@sec-data-policy-coverage).
    - id: vol4.field.learning-shift--learning-compounding-error
      source: vol4.learning.shift
      predicate: drives
      target: vol4.learning.compounding-error
      explanation: An early action error changes later observations, taking the policy into states where
        imitation training did not constrain its behavior.
      conditions: The rate of growth depends on dynamics and recoverability; a quadratic worst-case bound
        is not a universal observed growth law.
      status: draft
      evidence:
        section: sec-data-covariate-shift
        quote: Because behavioral cloning weights its loss solely by the demonstrator's occupancy $\ExpertStateVisitationDistribution$,
          a single step off the demonstrated path places the policy in states where training never penalized
          an error. How fast that first departure compounds over an episode depends on whether the archive
          holds any actions that steer the machine back (@sec-data-curse-dimensionality-recoverability).
    - id: vol4.field.deployment-odd--learning-checkpoint
      source: vol4.deployment.odd
      predicate: defines required coverage for
      target: vol4.learning.checkpoint
      explanation: A policy candidate needs provenance and coverage matched to the external conditions in
        which it is intended to operate.
      conditions: The ODD covers external conditions; internal thermal, compute, and power state are additionally
        covered by the operating envelope.
      status: draft
      evidence:
        section: sec-data-policy-coverage
        quote: 'Before evaluating policy coverage across an operational design domain, audit dataset occupancy
          and scenario-table counts against these criteria:'
