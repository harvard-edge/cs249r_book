    - Kinematic topology mismatch
    - Rig-to-rig divergence
  claims:
    Endogenous covariate shift: Because a physical machine's own executed actions choose its next states and observations,
      the learner visits a distribution its demonstrations never sampled, so more nominal demonstrations only densify
      the region the expert already covered.
    Compounding error and recoverability: Behavioral cloning's worst-case excess cost grows as T^2*eps because training
      error is weighted by the expert's occupancy, and labeling learner-visited states makes it linear only while
      a recovering action still exists.
    Action-label semantics: One command exists as four signals (requested, mapped, enforced, measured) and every
      pair must be dated at the exposure midpoint, because the tap chosen and the pairing lag decide what behavior
      the label teaches.
    Demonstration yield and wear: Physical data is bought in cell time and component life, so less than a quarter
      of a scheduled hour survives as retained demonstration and failed attempts wear parts like successful ones.
    Operational design domain: The operational design domain is declared before collection, and an archive's coverage
      is a join between its state-action occupancy and a scenario table derived from that domain, never a property
      the archive can measure alone.
    Intervention curation: A zero-count cell can mean unvisited, intercepted, cut short by takeover, or censored,
      and takeover logs are failure-conditioned, so curation locates the divergence point in a pre-trigger buffer
      and admits only verified recovery.
    Embodiment contract: Every trajectory encodes the sensor geometry, timing, kinematic and torque limits, and
      compliance of the machine that produced it, so range normalization is cosmetic and borrowed data must pass
      an embodiment gate.
    Provenance record: Schema-valid arrays can silently encode a shifted camera, a worn pad, a drifted operator,
      or a mismatched unit, so every archive is bound to an immutable provenance record of plant, calibration, wear,
      taps, timing, and denominators.
    Behavioral cloning: Behavioral cloning fits actions to observations under the expert's occupancy, so a low held-out
      loss says nothing about closed-loop competence.
    Scenario coverage table: A scenario table enumerates the cells the declared domain requires over low-dimensional
      task invariants, because a brute-force state grid is defeated by dimensionality.
    Effective sample size of telemetry: Autocorrelated telemetry carries about N(1-rho)/(1+rho) independent samples,
      so a higher logger rate cannot populate an unvisited cell.
    Causal confusion: A policy can learn a consequence of the action as its cause (a joint current, a brake light),
      which is a different failure from contamination by the learner's own actions.
    Teleoperation loop latency: Teleoperation loop latency is display plus human plus command plus mechanics time,
      dominated by operator reaction, and it leaves step-and-wait artifacts in the labels.
    Kinematic topology mismatch: Cartesian labels recorded on one arm can force a different arm through a singularity
      or drop a redundant degree of freedom, so action spaces transfer only through the embodiment contract.
    Rig-to-rig divergence: Nominally identical units differ in transmission, mounts, and motor constants, so a failed
      attempt and a failed recording must be told apart per unit.
