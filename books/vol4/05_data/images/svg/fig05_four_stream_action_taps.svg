<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1A202C"/>
    </marker>
    <marker id="arr-soft" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A5568"/>
    </marker>
  </defs>

  <rect width="680" height="340" fill="#ffffff"/>

  <!-- Processing domains -->
  <rect x="16" y="36" width="284" height="106" rx="4" fill="#FBF6F1" stroke="#B87333" stroke-width="1"/>
  <text x="28" y="54" font-size="10" font-weight="700" fill="#1A202C">Application processor</text>
  <rect x="352" y="36" width="144" height="106" rx="4" fill="#F3F7F5" stroke="#1A4D3E" stroke-width="1"/>
  <text x="364" y="54" font-size="10" font-weight="700" fill="#1A202C">Discrete safety MCU</text>

  <!-- Proposal boundary -->
  <line x1="326" y1="30" x2="326" y2="146" stroke="#4A5568" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="326" y="22" font-size="9" font-weight="700" font-style="italic" fill="#4A5568" text-anchor="middle">proposal boundary</text>
  <text x="326" y="162" font-size="8.5" fill="#4A5568" text-anchor="middle">black-channel link</text>
  <text x="326" y="173" font-size="8.5" fill="#4A5568" text-anchor="middle">no shared memory</text>

  <!-- Boxes, top row -->
  <rect x="28" y="72" width="84" height="46" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1"/>
  <text x="70" y="92" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Policy or</text>
  <text x="70" y="104" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">operator</text>

  <rect x="152" y="72" width="92" height="46" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1"/>
  <text x="198" y="92" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Kinematic</text>
  <text x="198" y="104" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">mapping</text>

  <rect x="364" y="72" width="120" height="46" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1"/>
  <text x="424" y="92" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Permission path</text>
  <text x="424" y="105" font-size="8.5" fill="#4A5568" text-anchor="middle">1 kHz tick</text>

  <rect x="528" y="72" width="132" height="46" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="594" y="92" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Drives</text>
  <text x="594" y="105" font-size="8.5" fill="#4A5568" text-anchor="middle">current loops, torque limit</text>

  <!-- Right column: plant and encoders -->
  <rect x="528" y="160" width="132" height="40" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="594" y="178" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Plant</text>
  <text x="594" y="191" font-size="8.5" fill="#4A5568" text-anchor="middle">joints, links, contact</text>

  <rect x="528" y="222" width="132" height="40" rx="0" fill="#E3F3F5" stroke="#007A87" stroke-width="1"/>
  <text x="594" y="240" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Joint encoders</text>
  <text x="594" y="253" font-size="8.5" fill="#4A5568" text-anchor="middle">motion over interval Δt</text>

  <!-- Command flow -->
  <line x1="112" y1="95" x2="150" y2="95" stroke="#1A202C" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <line x1="244" y1="95" x2="362" y2="95" stroke="#1A202C" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <line x1="484" y1="95" x2="526" y2="95" stroke="#1A202C" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <line x1="594" y1="118" x2="594" y2="158" stroke="#1A202C" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <line x1="594" y1="200" x2="594" y2="220" stroke="#1A202C" stroke-width="1.2" marker-end="url(#arr-ink)"/>

  <!-- Tap points -->
  <circle cx="131" cy="95" r="3" fill="#1A202C"/>
  <circle cx="272" cy="95" r="3" fill="#1A202C"/>
  <circle cx="506" cy="95" r="3" fill="#1A202C"/>
  <circle cx="594" cy="262" r="3" fill="#1A202C"/>

  <text x="131" y="86" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">a<tspan dy="3" font-size="8">req</tspan></text>
  <text x="272" y="86" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">a<tspan dy="3" font-size="8">cmd</tspan></text>
  <text x="506" y="86" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">a<tspan dy="3" font-size="8">enf</tspan></text>
  <text x="610" y="282" font-size="10" font-weight="700" fill="#1A202C">a<tspan dy="3" font-size="8">meas</tspan></text>

  <!-- Tap lines to the log -->
  <g stroke="#4A5568" stroke-width="1" stroke-dasharray="3,3" fill="none">
    <line x1="131" y1="98" x2="131" y2="298" marker-end="url(#arr-soft)"/>
    <line x1="272" y1="98" x2="272" y2="298" marker-end="url(#arr-soft)"/>
    <line x1="506" y1="98" x2="506" y2="298" marker-end="url(#arr-soft)"/>
    <line x1="594" y1="265" x2="594" y2="298" marker-end="url(#arr-soft)"/>
  </g>
  <g font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle">
    <circle cx="131" cy="232" r="8" fill="#ffffff" stroke="#4A5568" stroke-width="1"/>
    <text x="131" y="235">1</text>
    <circle cx="272" cy="232" r="8" fill="#ffffff" stroke="#4A5568" stroke-width="1"/>
    <text x="272" y="235">2</text>
    <circle cx="506" cy="232" r="8" fill="#ffffff" stroke="#4A5568" stroke-width="1"/>
    <text x="506" y="235">3</text>
    <circle cx="594" cy="281" r="8" fill="#ffffff" stroke="#4A5568" stroke-width="1"/>
    <text x="594" y="284">4</text>
  </g>

  <!-- Synchronized log -->
  <rect x="16" y="300" width="644" height="28" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="338" y="318" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Synchronized telemetry log (hardware timestamps)</text>
</svg>
