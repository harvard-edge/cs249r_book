<svg xmlns="http://www.w3.org/2000/svg" viewBox="22.7 -1.7 960.2 402.1" width="1000" height="418.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-25.3" y="-21.8" width="1056.2" height="442.3" fill="#ffffff"/>
  <defs>
    <style>
      .domain-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.8px; }
      .boundary-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; text-anchor: middle; }
      .block-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .math-label { font-family: 'Menlo', 'Courier New', monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .tap-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #2563EB; text-anchor: middle; }
      .buffer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1E293B; letter-spacing: 0.6px; text-anchor: middle; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrow-tap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <marker id="dot-tap" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="4" markerHeight="4">
      <circle cx="4" cy="4" r="3" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="#FFFFFF" />

  <!-- Hardware Boundary Separator -->
  <line x1="500" y1="42" x2="500" y2="295" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,5" />

  <!-- Hardware Boundary Pill Badge -->
  <rect x="420" y="16" width="160" height="24" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
  <text x="500" y="32" class="boundary-text">HARDWARE BOUNDARY</text>

  <!-- ==================== COMPUTE DOMAINS ==================== -->
  <!-- Linux MPU Domain -->
  <rect x="40" y="52" width="445" height="243" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="60" y="78" class="domain-label">LINUX HOST (MPU)</text>

  <!-- Real-Time MCU Domain -->
  <rect x="515" y="52" width="445" height="243" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="535" y="78" class="domain-label">REAL-TIME MCU</text>

  <!-- ==================== CONTROL STREAM BLOCKS ==================== -->
  <!-- Block 1: Intent Generation -->
  <rect x="60" y="135" width="155" height="58" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
  <text x="137.5" y="169" class="block-title" fill="#1E3A8A">Policy Intent</text>

  <!-- Signal 1 Path: a_req -->
  <line x1="215" y1="164" x2="275" y2="164" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow-slate)" />
  <rect x="227" y="138" width="46" height="20" rx="4" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
  <text x="250" y="152" class="math-label" fill="#1E40AF">a<tspan baseline-shift="sub" font-size="9">req</tspan></text>

  <!-- Block 2: Kinematic Mapping -->
  <rect x="275" y="135" width="160" height="58" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
  <text x="355" y="169" class="block-title" fill="#1E3A8A">Kinematic Mapping</text>

  <!-- Signal 2 Path: a_cmd across Boundary -->
  <line x1="435" y1="164" x2="550" y2="164" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow-slate)" />
  <rect x="506" y="138" width="48" height="20" rx="4" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
  <text x="530" y="152" class="math-label" fill="#1E40AF">a<tspan baseline-shift="sub" font-size="9">cmd</tspan></text>

  <!-- Block 3: Safety Barrier -->
  <rect x="550" y="135" width="160" height="58" rx="3" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
  <text x="630" y="169" class="block-title" fill="#14532D">Safety Barrier</text>

  <!-- Signal 3 Path: a_enf -->
  <line x1="710" y1="164" x2="775" y2="164" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow-slate)" />
  <rect x="724" y="138" width="46" height="20" rx="4" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
  <text x="747" y="152" class="math-label" fill="#15803D">a<tspan baseline-shift="sub" font-size="9">enf</tspan></text>

  <!-- Block 4: Physical Plant -->
  <rect x="775" y="135" width="165" height="58" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="857.5" y="169" class="block-title" fill="#0F172A">Physical Plant</text>

  <!-- Feedback Path: a_meas -->
  <path d="M 940 164 L 965 164 L 965 230 L 857.5 230 L 857.5 200" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow-slate)" />
  <rect x="888" y="220" width="52" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="914" y="234" class="math-label" fill="#0F172A">a<tspan baseline-shift="sub" font-size="9">meas</tspan></text>

  <!-- ==================== ACTION TAPS (1-4) ==================== -->
  <!-- Tap 1: a_req -->
  <line x1="250" y1="164" x2="250" y2="330" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3" marker-start="url(#dot-tap)" marker-end="url(#arrow-tap)" />
  <rect x="237.5" y="240" width="25" height="20" rx="3" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
  <text x="250" y="254" class="tap-pill">(1)</text>

  <!-- Tap 2: a_cmd -->
  <line x1="530" y1="164" x2="530" y2="330" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3" marker-start="url(#dot-tap)" marker-end="url(#arrow-tap)" />
  <rect x="517.5" y="240" width="25" height="20" rx="3" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
  <text x="530" y="254" class="tap-pill">(2)</text>

  <!-- Tap 3: a_enf -->
  <line x1="747" y1="164" x2="747" y2="330" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3" marker-start="url(#dot-tap)" marker-end="url(#arrow-tap)" />
  <rect x="734.5" y="240" width="25" height="20" rx="3" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
  <text x="747" y="254" class="tap-pill">(3)</text>

  <!-- Tap 4: a_meas -->
  <line x1="914" y1="240" x2="914" y2="330" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,3" marker-start="url(#dot-tap)" marker-end="url(#arrow-tap)" />
  <rect x="901.5" y="270" width="25" height="20" rx="3" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
  <text x="914" y="284" class="tap-pill">(4)</text>

  <!-- ==================== TELEMETRY RING-BUFFER ==================== -->
  <rect x="40" y="335" width="920" height="48" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" />
  <text x="500" y="364" class="buffer-title">SYNCHRONIZED TELEMETRY BUFFER</text>
</svg>
