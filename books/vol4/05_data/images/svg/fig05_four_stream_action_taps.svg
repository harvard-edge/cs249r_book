<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
    <defs>
        <!-- Arrowhead marker -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D3748" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F407A" />
        </marker>
        <!-- Data Tap Marker -->
        <marker id="circle-tap" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
            <circle cx="5" cy="5" r="4" fill="#A51C30" />
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#A51C30" />
        </marker>
    </defs>

    <style>
        .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1F407A; }
        .subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #2D3748; }
        .box-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #2D3748; text-anchor: middle; }
        .box-subtext { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; fill: #4A5568; text-anchor: middle; }
        .signal-text { font-family: monospace; font-size: 14px; font-weight: bold; fill: #1F407A; text-anchor: middle; }
        .tap-text { font-family: monospace; font-size: 14px; font-weight: bold; fill: #A51C30; text-anchor: middle; }
        .domain-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #718096; letter-spacing: 1px; }
    </style>

    <!-- Background / Domain areas -->
    <!-- MPU Domain -->
    <rect x="50" y="50" width="450" height="300" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="2" rx="8" />
    <text x="70" y="80" class="domain-title">LINUX APPLICATION PROCESSOR (MPU)</text>
    
    <!-- MCU Domain -->
    <rect x="500" y="50" width="450" height="300" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="2" rx="8" />
    <text x="520" y="80" class="domain-title">REAL-TIME MICROCONTROLLER (MCU)</text>
    
    <!-- Boundary Line -->
    <line x1="500" y1="50" x2="500" y2="450" stroke="#718096" stroke-width="3" stroke-dasharray="8 8" />
    <rect x="420" y="32" width="160" height="26" fill="#FFFFFF" stroke="#718096" stroke-width="1" rx="13" />
    <text x="500" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#718096" text-anchor="middle">HARDWARE BOUNDARY</text>

    <!-- Blocks -->
    <!-- Block 1: Intent -->
    <rect x="80" y="150" width="160" height="70" fill="#FFFFFF" stroke="#1F407A" stroke-width="2" rx="4" />
    <text x="160" y="185" class="box-text">Operator / Policy</text>
    <text x="160" y="205" class="box-subtext">Intent Generation</text>

    <!-- Block 2: Kinematics -->
    <rect x="330" y="150" width="150" height="70" fill="#FFFFFF" stroke="#1F407A" stroke-width="2" rx="4" />
    <text x="405" y="185" class="box-text">Kinematic Mapping</text>
    <text x="405" y="205" class="box-subtext">&amp; Retargeting</text>

    <!-- Block 3: CBF / Safety -->
    <rect x="560" y="150" width="150" height="70" fill="#FFFFFF" stroke="#1F407A" stroke-width="2" rx="4" />
    <text x="635" y="185" class="box-text">Safety Barrier (CBF)</text>
    <text x="635" y="205" class="box-subtext">&amp; Current Limits</text>

    <!-- Block 4: Actuator -->
    <rect x="790" y="150" width="140" height="70" fill="#FFFFFF" stroke="#1F407A" stroke-width="2" rx="4" />
    <text x="860" y="185" class="box-text">Physical Plant</text>
    <text x="860" y="205" class="box-subtext">Actuators / Sensors</text>

    <!-- Main Signal Path -->
    <!-- Signal 1: areq -->
    <line x1="240" y1="185" x2="325" y2="185" stroke="#1F407A" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="285" y="175" class="signal-text">a_req</text>
    
    <!-- Signal 2: acmd -->
    <line x1="480" y1="185" x2="555" y2="185" stroke="#1F407A" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="517.5" y="175" class="signal-text">a_cmd</text>

    <!-- Signal 3: aenf -->
    <line x1="710" y1="185" x2="785" y2="185" stroke="#1F407A" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="747.5" y="175" class="signal-text">a_enf</text>
    
    <!-- Signal 4: ameas -->
    <path d="M 930 185 L 960 185 L 960 260 L 860 260 L 860 220" fill="none" stroke="#1F407A" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="915" y="275" class="signal-text">a_meas</text>

    <!-- Logging / Telemetry Bus -->
    <rect x="50" y="400" width="900" height="50" fill="#FFF5F5" stroke="#A51C30" stroke-width="2" rx="4" />
    <text x="500" y="430" class="box-text" style="fill: #A51C30; font-weight: bold;">SYNCHRONIZED TELEMETRY RING-BUFFER (DATA LOGGING)</text>

    <!-- Taps down to logging -->
    <!-- Tap 1: areq -->
    <line x1="285" y1="185" x2="285" y2="395" stroke="#A51C30" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#circle-tap)" marker-end="url(#arrow-red)" />
    <rect x="260" y="295" width="50" height="24" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" rx="4" />
    <text x="285" y="312" class="tap-text">(1)</text>

    <!-- Tap 2: acmd -->
    <line x1="517.5" y1="185" x2="517.5" y2="395" stroke="#A51C30" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#circle-tap)" marker-end="url(#arrow-red)" />
    <rect x="492.5" y="295" width="50" height="24" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" rx="4" />
    <text x="517.5" y="312" class="tap-text">(2)</text>

    <!-- Tap 3: aenf -->
    <line x1="747.5" y1="185" x2="747.5" y2="395" stroke="#A51C30" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#circle-tap)" marker-end="url(#arrow-red)" />
    <rect x="722.5" y="295" width="50" height="24" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" rx="4" />
    <text x="747.5" y="312" class="tap-text">(3)</text>

    <!-- Tap 4: ameas -->
    <line x1="910" y1="260" x2="910" y2="395" stroke="#A51C30" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#circle-tap)" marker-end="url(#arrow-red)" />
    <rect x="885" y="295" width="50" height="24" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" rx="4" />
    <text x="910" y="312" class="tap-text">(4)</text>

</svg>
