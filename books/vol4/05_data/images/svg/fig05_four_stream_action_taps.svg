<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .domain-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.8px; }
      .boundary-pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .box-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .box-subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .signal-text { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #1F407A; text-anchor: middle; }
      .tap-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #A51C30; text-anchor: middle; }
      .buffer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #A51C30; letter-spacing: 0.5px; text-anchor: middle; }
      .buffer-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #7F1D1D; text-anchor: middle; }

      .box-card { fill: #FFFFFF; stroke: #1F407A; stroke-width: 1.5; }
      .box-plant { fill: #F8FAFC; stroke: #1E293B; stroke-width: 1.5; }
      .line-signal { stroke: #1F407A; stroke-width: 2; fill: none; }
      .line-tap { stroke: #A51C30; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F407A" />
    </marker>
    <marker id="circle-tap" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="4" fill="#A51C30" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A51C30" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#FFFFFF" />

  <!-- ==================== COMPUTE REALMS ==================== -->
  <!-- Linux MPU Domain -->
  <rect x="35" y="45" width="455" height="310" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" rx="4" />
  <text x="55" y="75" class="domain-title">LINUX APPLICATION PROCESSOR (MPU)</text>
  
  <!-- Real-Time MCU Domain -->
  <rect x="510" y="45" width="455" height="310" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" rx="4" />
  <text x="530" y="75" class="domain-title">REAL-TIME MICROCONTROLLER (MCU)</text>
  
  <!-- Hardware Privilege Boundary (Dashed Separator stopped above buffer) -->
  <line x1="500" y1="45" x2="500" y2="355" stroke="#64748B" stroke-width="2" stroke-dasharray="6,5" />

  <!-- Hardware Boundary Floating Badge -->
  <rect x="420" y="32" width="160" height="26" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" rx="13" />
  <text x="500" y="49" class="boundary-pill-text" text-anchor="middle">HARDWARE BOUNDARY</text>

  <!-- ==================== PIPELINE BLOCKS ==================== -->
  <!-- Block 1: Intent Generation -->
  <rect x="55" y="145" width="165" height="75" class="box-card" rx="3" />
  <text x="137" y="177" class="box-text">Operator / Policy</text>
  <text x="137" y="198" class="box-subtext">Intent Generation (VLA)</text>

  <!-- Signal 1 Path: a_req -->
  <path d="M 220 182 L 295 182" class="line-signal" marker-end="url(#arrow-blue)" />
  <rect x="238" y="156" width="46" height="20" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="261" y="170" class="signal-text">a_req</text>

  <!-- Block 2: Kinematic Mapping -->
  <rect x="295" y="145" width="165" height="75" class="box-card" rx="3" />
  <text x="377" y="177" class="box-text">Kinematic Mapping</text>
  <text x="377" y="198" class="box-subtext">&amp; Retargeting</text>

  <!-- Signal 2 Path: a_cmd across Boundary -->
  <path d="M 460 182 L 565 182" class="line-signal" marker-end="url(#arrow-blue)" />
  <!-- a_cmd Badge placed cleanly right of the boundary line (x=500) -->
  <rect x="510" y="156" width="48" height="20" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="534" y="170" class="signal-text">a_cmd</text>

  <!-- Block 3: Safety Barrier (CBF) -->
  <rect x="565" y="145" width="165" height="75" class="box-card" rx="3" />
  <text x="647" y="177" class="box-text">Safety Barrier (CBF)</text>
  <text x="647" y="198" class="box-subtext">&amp; Current Limits</text>

  <!-- Signal 3 Path: a_enf -->
  <path d="M 730 182 L 805 182" class="line-signal" marker-end="url(#arrow-blue)" />
  <rect x="748" y="156" width="46" height="20" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="771" y="170" class="signal-text">a_enf</text>

  <!-- Block 4: Physical Plant (Hardware Actuators & Sensors - rx="0") -->
  <rect x="805" y="145" width="145" height="75" class="box-plant" rx="0" />
  <text x="877" y="177" class="box-text">Physical Plant</text>
  <text x="877" y="198" class="box-subtext">Actuators &amp; Encoders</text>

  <!-- Signal 4 Feedback Loop: a_meas -->
  <path d="M 950 182 L 975 182 L 975 255 L 877 255 L 877 225" class="line-signal" marker-end="url(#arrow-blue)" />
  <!-- a_meas Badge placed with comfortable clearance -->
  <rect x="900" y="243" width="56" height="22" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="928" y="258" class="signal-text">a_meas</text>


  <!-- ==================== TELEMETRY BUFFER ==================== -->
  <rect x="35" y="390" width="930" height="65" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" rx="4" />
  <text x="500" y="416" class="buffer-title">SYNCHRONIZED TELEMETRY RING-BUFFER (ZERO-COPY LOGGING POOL)</text>
  <text x="500" y="437" class="buffer-sub">Synchronously logs Intent a_req (1), Commanded a_cmd (2), Barrier-Enforced a_enf (3), and Measured a_meas (4)</text>

  <!-- ==================== LOGGING TAPS (1 to 4) ==================== -->
  <!-- Tap 1: a_req -->
  <path d="M 261 182 L 261 385" class="line-tap" marker-start="url(#circle-tap)" marker-end="url(#arrow-red)" />
  <rect x="243" y="285" width="36" height="24" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" rx="3" />
  <text x="261" y="302" class="tap-text">(1)</text>

  <!-- Tap 2: a_cmd (Safely placed at x=534, cleanly right of boundary line x=500) -->
  <path d="M 534 182 L 534 385" class="line-tap" marker-start="url(#circle-tap)" marker-end="url(#arrow-red)" />
  <rect x="516" y="285" width="36" height="24" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" rx="3" />
  <text x="534" y="302" class="tap-text">(2)</text>

  <!-- Tap 3: a_enf -->
  <path d="M 771 182 L 771 385" class="line-tap" marker-start="url(#circle-tap)" marker-end="url(#arrow-red)" />
  <rect x="753" y="285" width="36" height="24" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" rx="3" />
  <text x="771" y="302" class="tap-text">(3)</text>

  <!-- Tap 4: a_meas (Tapping from horizontal feedback line at x=928) -->
  <path d="M 928 265 L 928 385" class="line-tap" marker-start="url(#circle-tap)" marker-end="url(#arrow-red)" />
  <rect x="910" y="285" width="36" height="24" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" rx="3" />
  <text x="928" y="302" class="tap-text">(4)</text>

</svg>
