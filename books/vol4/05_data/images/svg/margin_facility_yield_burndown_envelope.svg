<?xml version="1.0" encoding="utf-8"?>
<!-- Session burn-down on a shared linear minute scale: x = 70 + 1.7333 px per minute (60 min = 104 px).
     The Scheduled bar is the envelope; no separate limit line. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="84" fill="#ffffff"/>
  <!-- bars -->
  <rect x="70" y="4" width="104" height="22" fill="#5e6b73"/>
  <rect x="70" y="30" width="60.67" height="22" fill="#5e6b73"/>
  <rect x="70" y="56" width="25.48" height="22" fill="#008f45"/>
  <!-- row labels -->
  <text x="64" y="19.5" text-anchor="end" font-size="12.5" fill="#333333">Scheduled</text>
  <text x="64" y="45.5" text-anchor="end" font-size="12.5" fill="#333333">Motion</text>
  <text x="64" y="71.5" text-anchor="end" font-size="12.5" fill="#333333">Retained</text>
  <!-- values -->
  <text x="122" y="19.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">60 min</text>
  <text x="100.3" y="45.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">35</text>
  <text x="101" y="71.5" font-size="12.5" fill="#333333">14.73</text>
</svg>
