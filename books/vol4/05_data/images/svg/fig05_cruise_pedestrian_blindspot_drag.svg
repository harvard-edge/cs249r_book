<svg xmlns="http://www.w3.org/2000/svg" viewBox="22.8 12.8 954.4 374.4" width="954.4" height="374.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-24.9" y="-5.9" width="1049.8" height="411.8" fill="#ffffff"/>
  <defs>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .diagram-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .branch-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="#FFFFFF" />

  <!-- ==================== PANEL A: CHASSIS SENSOR COVERAGE ==================== -->
  <rect x="40" y="30" width="445" height="340" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="262.5" y="65" class="card-title">Chassis Sensor Coverage</text>

  <!-- Ground Plane -->
  <line x1="70" y1="280" x2="455" y2="280" stroke="#94A3B8" stroke-width="1.5" />
  <text x="415" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#64748B" text-anchor="middle">Ground Plane</text>

  <!-- Sensor Visibility Cone from Roof Pod -->
  <polygon points="262.5,142 80,280 445,280" fill="#EFF6FF" opacity="0.6" stroke="#BFDBFE" stroke-width="1" stroke-dasharray="4,3" />

  <!-- Vehicle Silhouette -->
  <!-- Underside Floorpan / Blind Spot Region -->
  <rect x="185" y="255" width="155" height="25" rx="3" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3,3" />
  <circle cx="262.5" cy="267" r="4.5" fill="#DC2626" />

  <!-- Cabin and Body -->
  <path d="M 125 255 L 125 215 L 180 160 L 330 160 L 380 215 L 405 225 L 405 255 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" />

  <!-- Wheels -->
  <circle cx="165" cy="265" r="18" fill="#334155" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="165" cy="265" r="7" fill="#CBD5E1" />
  <circle cx="360" cy="265" r="18" fill="#334155" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="360" cy="265" r="7" fill="#CBD5E1" />

  <!-- Roof Sensor Pod -->
  <rect x="237.5" y="132" width="50" height="15" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" />
  <text x="262.5" y="122" class="diagram-label" fill="#1E40AF">Roof Sensor Pod</text>

  <!-- Blind Spot Drop Pointer & Label -->
  <line x1="262.5" y1="272" x2="262.5" y2="320" stroke="#DC2626" stroke-width="1.2" />
  <text x="262.5" y="336" class="diagram-label" fill="#DC2626">Undercarriage Blind Spot</text>

  <!-- ==================== PANEL B: FAILURE CASCADE DYNAMICS ==================== -->
  <rect x="515" y="30" width="445" height="340" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="737.5" y="65" class="card-title">Failure Cascade Dynamics</text>

  <!-- Stage 1: Emergency Stop -->
  <rect x="637.5" y="95" width="200" height="44" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
  <text x="737.5" y="114" class="box-title" fill="#1E3A8A">Emergency Stop</text>
  <text x="737.5" y="129" class="box-sub" fill="#3B82F6">Hard Braking (1.4g)</text>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <line x1="737.5" y1="139" x2="737.5" y2="160" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-slate)" />

  <!-- Stage 2: State Misclassification -->
  <rect x="637.5" y="160" width="200" height="44" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" />
  <text x="737.5" y="179" class="box-title" fill="#92400E">State Misclassification</text>
  <text x="737.5" y="194" class="box-sub" fill="#B45309">Occluded Undercarriage</text>

  <!-- Branching Arrows from Stage 2 -->
  <!-- Left Branch to Secondary Dragging (Fault) -->
  <path d="M 687.5 204 L 687.5 218 L 625 218 L 625 238" fill="none" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arrow-red)" />

  <!-- Right Branch to Safety Refusal (Correct Invariant) -->
  <path d="M 787.5 204 L 787.5 218 L 845 218 L 845 238" fill="none" stroke="#16A34A" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-green)" />

  <!-- Stage 3A: Secondary Dragging (Observed Failure) -->
  <rect x="535" y="242" width="180" height="46" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2" />
  <text x="625" y="262" class="box-title" fill="#991B1B">Secondary Dragging</text>
  <text x="625" y="277" class="box-sub" fill="#DC2626">Unverified Pull-Over</text>

  <!-- Stage 3B: Safety Refusal (Required Governor) -->
  <rect x="755" y="242" width="180" height="46" rx="3" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
  <text x="845" y="262" class="box-title" fill="#14532D">Safety Refusal</text>
  <text x="845" y="277" class="box-sub" fill="#15803D">Mandatory Interlock</text>
</svg>
