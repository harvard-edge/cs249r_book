<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" width="680" height="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1A202C"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#007A87"/>
    </marker>
  </defs>

  <rect width="680" height="256" fill="#ffffff"/>

  <!-- ===== Operator ===== -->
  <rect x="20" y="70" width="84" height="44" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="62" y="90" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Operator</text>
  <text x="62" y="103" font-size="8.5" fill="#4A5568" text-anchor="middle">see, decide, move</text>

  <!-- ===== Leader arm (small replica) ===== -->
  <text x="200" y="28" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Leader</text>
  <rect x="164" y="136" width="36" height="8" rx="0" fill="#4A5568"/>
  <path d="M182,136 V104 L214,84 L236,100" fill="none" stroke="#1A202C" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#1A202C" stroke-width="1.5">
    <circle cx="182" cy="136" r="4"/>
    <circle cx="182" cy="104" r="4"/>
    <circle cx="214" cy="84" r="4"/>
  </g>
  <text x="174" y="127" font-size="8.5" fill="#4A5568" text-anchor="end">q<tspan dy="2.5" font-size="8">1</tspan></text>
  <text x="172" y="106" font-size="8.5" fill="#4A5568" text-anchor="end">q<tspan dy="2.5" font-size="8">2</tspan></text>
  <text x="214" y="74" font-size="8.5" fill="#4A5568" text-anchor="middle">q<tspan dy="2.5" font-size="8">3</tspan></text>

  <!-- operator moves leader -->
  <line x1="104" y1="92" x2="160" y2="92" stroke="#1A202C" stroke-width="1.3" marker-end="url(#arr-ink)"/>
  <text x="132" y="84" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">hum</tspan></text>

  <!-- ===== Host joint copy ===== -->
  <rect x="270" y="70" width="130" height="44" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1"/>
  <text x="335" y="89" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Joint copy</text>
  <text x="335" y="103" font-size="9" fill="#1A202C" text-anchor="middle">q<tspan dy="2.5" font-size="8">follower</tspan><tspan dy="-2.5"> </tspan>=<tspan> q</tspan><tspan dy="2.5" font-size="8">leader</tspan></text>
  <text x="335" y="128" font-size="8.5" fill="#4A5568" text-anchor="middle">no inverse kinematics</text>

  <line x1="240" y1="92" x2="268" y2="92" stroke="#1A202C" stroke-width="1.3" marker-end="url(#arr-ink)"/>
  <line x1="400" y1="92" x2="452" y2="92" stroke="#1A202C" stroke-width="1.3" marker-end="url(#arr-ink)"/>
  <text x="426" y="84" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">cmd</tspan></text>

  <!-- ===== Follower arm (full size, same joint structure) ===== -->
  <text x="508" y="28" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Follower</text>
  <rect x="470" y="140" width="52" height="10" rx="0" fill="#4A5568"/>
  <path d="M496,140 V96 L540,68 L570,90" fill="none" stroke="#1A202C" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#1A202C" stroke-width="1.5">
    <circle cx="496" cy="140" r="5"/>
    <circle cx="496" cy="96" r="5"/>
    <circle cx="540" cy="68" r="5"/>
  </g>
  <text x="486" y="129" font-size="8.5" fill="#4A5568" text-anchor="end">q<tspan dy="2.5" font-size="8">1</tspan></text>
  <text x="484" y="98" font-size="8.5" fill="#4A5568" text-anchor="end">q<tspan dy="2.5" font-size="8">2</tspan></text>
  <text x="540" y="54" font-size="8.5" fill="#4A5568" text-anchor="middle">q<tspan dy="2.5" font-size="8">3</tspan></text>
  <text x="560" y="124" font-size="9" fill="#1A202C">t<tspan dy="2.5" font-size="7.5">mech</tspan></text>

  <!-- ===== Task (latch) ===== -->
  <rect x="584" y="82" width="12" height="68" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="604" y="120" font-size="8.5" fill="#4A5568">latch</text>

  <!-- ===== Visual return path ===== -->
  <rect x="470" y="196" width="130" height="34" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1"/>
  <text x="535" y="217" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Workspace camera</text>
  <rect x="20" y="196" width="84" height="34" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="62" y="217" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Display</text>

  <line x1="535" y1="160" x2="535" y2="194" stroke="#007A87" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-petrol)"/>
  <line x1="470" y1="213" x2="106" y2="213" stroke="#007A87" stroke-width="1.3" marker-end="url(#arr-petrol)"/>
  <line x1="62" y1="196" x2="62" y2="116" stroke="#007A87" stroke-width="1.3" marker-end="url(#arr-petrol)"/>
  <text x="288" y="205" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">disp</tspan></text>
</svg>
