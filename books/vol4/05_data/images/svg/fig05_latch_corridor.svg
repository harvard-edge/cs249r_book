<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 196" width="648" height="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" viewBox="0 0 6 4" refX="6" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 6 4" refX="6" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 6 4" refX="6" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="648" height="196" fill="#ffffff"/>

  <!-- Shaded regions first (below all lines and text) -->
  <rect x="40" y="24" width="516" height="20" rx="0" fill="#FEE2E2"/>
  <rect x="40" y="112" width="516" height="40" rx="0" fill="#F0FDF4"/>

  <!-- Fixture hazard edge -->
  <line x1="40" y1="44" x2="556" y2="44" stroke="#DC2626" stroke-width="1.2"/>
  <text x="48" y="38" font-size="8.5" font-weight="bold" fill="#991B1B">Door frame and fixture (contact hazard)</text>

  <!-- Demonstrated corridor edges -->
  <line x1="40" y1="112" x2="556" y2="112" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="40" y1="152" x2="556" y2="152" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Strike plate (physical plant, sharp corners) -->
  <rect x="556" y="96" width="22" height="72" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
  <text x="586" y="128" font-size="8.5" font-weight="bold" fill="#0F172A">Strike</text>
  <text x="586" y="139" font-size="8.5" font-weight="bold" fill="#0F172A">plate</text>

  <!-- Retained demonstrations: forward progress along the centerline -->
  <line x1="60" y1="132" x2="136" y2="132" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-navy)"/>
  <line x1="156" y1="132" x2="232" y2="132" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-navy)"/>
  <line x1="252" y1="132" x2="328" y2="132" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-navy)"/>
  <line x1="348" y1="132" x2="424" y2="132" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-navy)"/>
  <line x1="444" y1="132" x2="540" y2="132" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-navy)"/>
  <text x="48" y="168" font-size="8.5" font-weight="bold" fill="#047857">Demonstrated corridor: dense forward-progress actions</text>

  <!-- Displaced gripper state (no support) -->
  <rect x="300" y="66" width="16" height="12" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
  <text x="292" y="71" font-size="8.5" font-weight="bold" fill="#0F172A" text-anchor="end">Displaced gripper</text>
  <text x="292" y="82" font-size="8" fill="#475569" text-anchor="end">after a slip or plate offset: no demonstrations</text>

  <!-- Unconstrained output drifting toward the fixture -->
  <line x1="318" y1="66" x2="350" y2="50" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>
  <text x="358" y="60" font-size="8" fill="#991B1B">Unconstrained output can drift into contact</text>

  <!-- Missing return action -->
  <path d="M 310 80 C 312 98, 326 110, 344 124" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>
  <text x="352" y="96" font-size="8.5" font-weight="bold" fill="#B45309">Missing: the return action</text>
  <text x="352" y="106" font-size="8" fill="#B45309">none in the archive</text>
</svg>
