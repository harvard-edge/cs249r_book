<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <defs>
    <style>
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1px; rx: 4px; }
      .subcard-bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 0.75px; rx: 3px; }
      .title-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: bold; fill: #1e293b; }
      .sub-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #64748b; }
      .label-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; fill: #334155; }
      .bold-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; font-weight: bold; }
    </style>
    <marker id="arr-red" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#c44" />
    </marker>
    <marker id="arr-green" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#3d9e5a" />
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="540" height="180" class="card-bg" />

  <!-- ==================== SUB-CARD 1: DELAY & PHASE EROSION ==================== -->
  <rect x="16" y="14" width="248" height="152" class="subcard-bg" />
  
  <text x="28" y="29" class="title-text">TRANSPORT DELAY &amp; PHASE EROSION</text>
  <text x="28" y="40" class="sub-text">Peg-in-hole 1.0 Hz control loop (round-trip τ = 320 ms)</text>

  <!-- Segmented Latency Bar -->
  <g transform="translate(28, 47)">
    <rect x="0" y="0" width="46" height="17" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75" />
    <text x="23" y="11.5" class="bold-text" fill="#1e3a8a" text-anchor="middle" font-size="7px">Net 60ms</text>

    <rect x="49" y="0" width="134" height="17" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75" />
    <text x="116" y="11.5" class="bold-text" fill="#78350f" text-anchor="middle" font-size="7px">Human Reflex 210 ms (66%)</text>

    <rect x="186" y="0" width="38" height="17" rx="2" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75" />
    <text x="205" y="11.5" class="bold-text" fill="#581c87" text-anchor="middle" font-size="7px">Mot 50ms</text>
  </g>

  <!-- Latency Total Label -->
  <text x="28" y="74" class="label-text">Total loop dead time:</text>
  <text x="252" y="74" class="bold-text" fill="#1e293b" text-anchor="end">τ = 60 + 210 + 50 = 320 ms</text>

  <!-- Phase Calculation Box -->
  <rect x="28" y="80" width="224" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75" />
  
  <text x="35" y="93" class="label-text">Nominal Plant Phase Margin:</text>
  <text x="245" y="93" class="bold-text" fill="#14532d" text-anchor="end">PM_plant = +60.0°</text>

  <text x="35" y="106" class="label-text">Delay Phase Lag (Δφ = ω·τ):</text>
  <text x="245" y="106" class="bold-text" fill="#7f1d1d" text-anchor="end">−115.2° (Lag)</text>

  <line x1="35" y1="111" x2="245" y2="111" stroke="#e2e8f0" stroke-width="0.75" />

  <text x="35" y="121" class="bold-text" fill="#1e293b">Net Phase Margin (PM_net):</text>
  <text x="245" y="121" class="bold-text" fill="#7f1d1d" text-anchor="end">−55.2° (Unstable)</text>

  <!-- Status Pill Badge -->
  <rect x="28" y="133" width="224" height="22" rx="11" fill="#f9d6d5" stroke="#c44" stroke-width="0.75" />
  <text x="140" y="147" class="bold-text" fill="#7f1d1d" text-anchor="middle" font-size="7.5px">PM &lt; 0° → Non-Passive Limit Cycle: Arm Chatter</text>


  <!-- ==================== SUB-CARD 2: VELOCITY CEILING & STEP-AND-WAIT ==================== -->
  <rect x="276" y="14" width="248" height="152" class="subcard-bg" />

  <text x="288" y="29" class="title-text">STEP-AND-WAIT VELOCITY CEILING</text>
  <text x="288" y="40" class="sub-text">Chamfer w = 2.0 mm | Unguided drift in dead time τ</text>

  <!-- Chamfer Diagram (Left: 288-360) -->
  <g transform="translate(288, 45)">
    <!-- Chamfer blocks -->
    <path d="M 2 30 L 18 30 L 28 44 L 28 48 L 2 48 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.75" />
    <path d="M 72 30 L 56 30 L 46 44 L 46 48 L 72 48 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.75" />
    
    <!-- Chamfer width marker on right slope -->
    <line x1="46" y1="26" x2="56" y2="26" stroke="#64748b" stroke-width="0.75" />
    <line x1="46" y1="24" x2="46" y2="28" stroke="#64748b" stroke-width="0.75" />
    <line x1="56" y1="24" x2="56" y2="28" stroke="#64748b" stroke-width="0.75" />
    <text x="51" y="21" class="bold-text" fill="#475569" text-anchor="middle" font-size="5.5px">w=2mm</text>

    <!-- Centerline -->
    <line x1="37" y1="2" x2="37" y2="48" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2,2" />

    <!-- Peg Body positioned higher -->
    <rect x="30" y="2" width="14" height="11" rx="1.5" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75" />
    <text x="37" y="10" class="bold-text" fill="#1e3a8a" text-anchor="middle" font-size="6px">Peg</text>

    <!-- Fast drift path (red) -->
    <path d="M 30 13 L 12 29" fill="none" stroke="#c44" stroke-width="1.2" marker-end="url(#arr-red)" />
    <text x="7" y="28" class="bold-text" fill="#c44" font-size="7px">×</text>
    <text x="10" y="20" class="bold-text" fill="#7f1d1d" font-size="5.5px">Jam</text>

    <!-- Step & wait path (green) -->
    <path d="M 37 13 L 37 38" fill="none" stroke="#3d9e5a" stroke-width="1.4" marker-end="url(#arr-green)" />
  </g>

  <!-- Formula box (Right of chamfer: 366-512) -->
  <g transform="translate(366, 47)">
    <rect x="0" y="0" width="146" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75" />
    <text x="73" y="14" class="bold-text" fill="#1e293b" text-anchor="middle" font-size="8.5px">v_max = w / τ</text>
    <text x="73" y="26" class="bold-text" fill="#334155" text-anchor="middle" font-size="7.5px">= 2.0 mm / 0.32 s = 6.25 mm/s</text>
    <text x="73" y="37" class="sub-text" fill="#64748b" text-anchor="middle" font-size="6.5px">Dead-time drift limit before jam</text>
  </g>

  <!-- Two comparison rows below -->
  <g transform="translate(288, 97)">
    <!-- Row 1: Fast approach -->
    <rect x="0" y="0" width="224" height="15" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.5" />
    <text x="6" y="11" class="bold-text" fill="#7f1d1d" font-size="7px">v &gt; 6.25 mm/s:</text>
    <text x="64" y="11" class="label-text" fill="#7f1d1d" font-size="7px">Drift &gt; 2 mm during τ → Collision / Jam</text>

    <!-- Row 2: Step-and-wait -->
    <rect x="0" y="17" width="224" height="15" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.5" />
    <text x="6" y="28" class="bold-text" fill="#78350f" font-size="7px">v ≤ 6.25 mm/s:</text>
    <text x="64" y="28" class="label-text" fill="#78350f" font-size="7px">Operator pulses 1 mm, pauses 300 ms</text>
  </g>

  <!-- Bottom Pill Badge -->
  <rect x="288" y="133" width="224" height="22" rx="11" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75" />
  <text x="400" y="147" class="bold-text" fill="#78350f" text-anchor="middle" font-size="7.5px">Policy Bias: Imitates Human Hesitation Pauses</text>

</svg>