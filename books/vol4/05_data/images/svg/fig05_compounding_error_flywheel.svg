<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1A202C"/>
    </marker>
    <marker id="arr-soft" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A5568"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#F1F3F6"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#A0AEC0" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="680" height="250" fill="#ffffff"/>

  <!-- ===== Left panel: closed loop and bound orders ===== -->
  <text x="170" y="20" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">(a) Learner in the loop</text>

  <rect x="110" y="34" width="120" height="32" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1"/>
  <text x="170" y="54" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Learned policy</text>

  <rect x="110" y="150" width="120" height="32" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="170" y="170" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Plant</text>

  <rect x="110" y="212" width="120" height="26" rx="0" fill="#ffffff" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="170" y="229" font-size="8.5" fill="#4A5568" text-anchor="middle">disturbance</text>

  <!-- loop: policy -> action -> plant -> state -> policy -->
  <path d="M230,50 H290 V166 H232" fill="none" stroke="#1A202C" stroke-width="1.3" marker-end="url(#arr-ink)"/>
  <path d="M110,166 H50 V50 H108" fill="none" stroke="#1A202C" stroke-width="1.3" marker-end="url(#arr-ink)"/>
  <line x1="170" y1="212" x2="170" y2="184" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-soft)"/>
  <text x="298" y="112" font-size="9" fill="#4A5568">action</text>
  <text x="42" y="112" font-size="9" fill="#4A5568" text-anchor="end">state</text>

  <!-- bound orders -->
  <text x="170" y="94" font-size="8.5" fill="#4A5568" text-anchor="middle">behavioral cloning, worst case</text>
  <text x="170" y="108" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">O(T²ε)</text>
  <text x="170" y="126" font-size="8.5" fill="#4A5568" text-anchor="middle">aggregation, recoverable task</text>
  <text x="170" y="140" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">O(uTε)</text>

  <!-- ===== Right panel: curation timeline ===== -->
  <text x="505" y="20" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">(b) Curating one takeover</text>

  <!-- lookback bracket -->
  <path d="M389,52 V46 H534 V52" fill="none" stroke="#4A5568" stroke-width="1"/>
  <text x="416" y="40" font-size="9" fill="#1A202C">Δt<tspan dy="2.5" font-size="7.5">lookback</tspan></text>
  <text x="461" y="40" font-size="9" fill="#1A202C">= 5 s</text>

  <!-- event markers -->
  <g stroke="#A0AEC0" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="447" y1="58" x2="447" y2="150"/>
    <line x1="534" y1="58" x2="534" y2="150"/>
    <line x1="621" y1="58" x2="621" y2="150"/>
  </g>

  <!-- axes -->
  <line x1="360" y1="150" x2="656" y2="150" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-soft)"/>
  <line x1="360" y1="150" x2="360" y2="60" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-soft)"/>
  <text x="366" y="66" font-size="8.5" fill="#4A5568">tracking error</text>
  <text x="656" y="140" font-size="8.5" fill="#4A5568" text-anchor="end">time</text>

  <!-- trajectory: nominal, learner drift, expert recovery -->
  <path d="M360,149 H447 C480,148 510,120 534,74" fill="none" stroke="#B87333" stroke-width="2"/>
  <path d="M534,74 C560,110 590,146 621,149 H646" fill="none" stroke="#1A202C" stroke-width="2"/>
  <circle cx="534" cy="74" r="3" fill="#1A202C"/>
  <text x="498" y="100" font-size="8.5" fill="#B87333" text-anchor="end">learner</text>
  <text x="582" y="100" font-size="8.5" fill="#1A202C">expert</text>

  <text x="447" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">div</tspan></text>
  <text x="534" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">takeover</tspan></text>
  <text x="621" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">rec</tspan></text>

  <!-- curation bands -->
  <text x="440" y="190" font-size="8.5" fill="#4A5568" text-anchor="end">states</text>
  <rect x="447" y="178" width="87" height="18" rx="0" fill="#E3F3F5" stroke="#007A87" stroke-width="1"/>
  <text x="490.5" y="190" font-size="8.5" fill="#1A202C" text-anchor="middle">relabel-eligible</text>
  <rect x="534" y="178" width="87" height="18" rx="0" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1"/>
  <text x="577.5" y="190" font-size="8.5" fill="#1A202C" text-anchor="middle">expert recovery</text>

  <text x="440" y="214" font-size="8.5" fill="#4A5568" text-anchor="end">commands</text>
  <rect x="447" y="202" width="87" height="18" rx="0" fill="url(#hatch)" stroke="#4A5568" stroke-width="1"/>
  <rect x="467" y="205" width="47" height="12" rx="2" fill="#ffffff"/>
  <text x="490.5" y="214" font-size="8.5" fill="#1A202C" text-anchor="middle">masked</text>
  <rect x="534" y="202" width="87" height="18" rx="0" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1"/>
  <text x="577.5" y="214" font-size="8.5" fill="#1A202C" text-anchor="middle">expert labels</text>
</svg>
