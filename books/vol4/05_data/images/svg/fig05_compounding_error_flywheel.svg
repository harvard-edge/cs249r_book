<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="680" height="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1A202C"/>
    </marker>
    <marker id="arr-soft" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A5568"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#F1F3F6"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#A0AEC0" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="680" height="262" fill="#ffffff"/>

  <!-- ===== Left panel: closed loop and bound orders ===== -->
  <text x="130" y="20" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">(a) Learner in the loop</text>

  <rect x="70" y="34" width="120" height="32" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1"/>
  <text x="130" y="54" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Learned policy</text>

  <rect x="70" y="150" width="120" height="32" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="130" y="170" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Plant</text>

  <rect x="70" y="212" width="120" height="26" rx="0" fill="#ffffff" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="130" y="229" font-size="8.5" fill="#4A5568" text-anchor="middle">disturbance</text>

  <!-- loop: policy -> action -> plant -> state -> policy -->
  <path d="M190,50 H222 V166 H192" fill="none" stroke="#1A202C" stroke-width="1.3" marker-end="url(#arr-ink)"/>
  <path d="M70,166 H40 V50 H68" fill="none" stroke="#1A202C" stroke-width="1.3" marker-end="url(#arr-ink)"/>
  <line x1="130" y1="212" x2="130" y2="184" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-soft)"/>
  <text x="228" y="112" font-size="9" fill="#4A5568">action</text>
  <text x="34" y="112" font-size="9" fill="#4A5568" text-anchor="end">state</text>

  <!-- bound orders -->
  <text x="130" y="94" font-size="8.5" fill="#4A5568" text-anchor="middle">behavioral cloning, worst case</text>
  <text x="130" y="108" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">O(T²ε)</text>
  <text x="130" y="126" font-size="8.5" fill="#4A5568" text-anchor="middle">aggregation, recoverable task</text>
  <text x="130" y="140" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">O(uTε)</text>

  <!-- ===== Right panel: curation timeline ===== -->
  <text x="478" y="20" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">(b) Curating one takeover</text>

  <!-- lookback bracket: 5 s back from takeover, past t_div -->
  <path d="M330,52 V46 H430 V52" fill="none" stroke="#4A5568" stroke-width="1"/>
  <text x="346" y="40" font-size="9" fill="#1A202C">Δt<tspan dy="2.5" font-size="7.5">lookback</tspan></text>
  <text x="390" y="40" font-size="9" fill="#1A202C">= 5 s</text>

  <!-- event markers: t_div 350, t_takeover 430, blend end 470, t_stabilize 550, t_rec 630 -->
  <g stroke="#A0AEC0" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="350" y1="58" x2="350" y2="150"/>
    <line x1="430" y1="58" x2="430" y2="150"/>
    <line x1="470" y1="58" x2="470" y2="150"/>
    <line x1="550" y1="58" x2="550" y2="150"/>
    <line x1="630" y1="58" x2="630" y2="150"/>
  </g>

  <!-- axes -->
  <line x1="296" y1="150" x2="668" y2="150" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-soft)"/>
  <line x1="296" y1="150" x2="296" y2="60" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-soft)"/>
  <text x="0" y="0" font-size="8.5" fill="#4A5568" text-anchor="end" transform="translate(290,62) rotate(-90)">tracking error</text>
  <text x="668" y="140" font-size="8.5" fill="#4A5568" text-anchor="end">time</text>

  <!-- trajectory: nominal, learner drift, enforcer blend, operator hunting, stabilized recovery -->
  <path d="M296,149 H350 C380,148 410,118 430,76" fill="none" stroke="#B87333" stroke-width="2"/>
  <path d="M430,76 C443,70 457,72 470,80" fill="none" stroke="#718096" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M470,80 C478,112 486,112 494,92 C502,72 510,86 518,106 C526,124 534,112 542,104 C546,101 548,104 550,108" fill="none" stroke="#718096" stroke-width="1.6"/>
  <path d="M550,108 C572,130 600,147 630,149 H658" fill="none" stroke="#1A202C" stroke-width="2"/>
  <circle cx="430" cy="76" r="3" fill="#1A202C"/>
  <text x="404" y="104" font-size="8.5" fill="#B87333" text-anchor="end">learner</text>
  <text x="592" y="124" font-size="8.5" fill="#1A202C">expert</text>

  <text x="350" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">div</tspan></text>
  <text x="430" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">takeover</tspan></text>
  <text x="550" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">stabilize</tspan></text>
  <text x="630" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">rec</tspan></text>

  <!-- interval names (the four intervals of the authority record) -->
  <text x="343" y="190" font-size="8.5" fill="#4A5568" text-anchor="end">interval</text>
  <text x="390" y="190" font-size="8.5" fill="#1A202C" text-anchor="middle">drift</text>
  <text x="450" y="190" font-size="8.5" fill="#1A202C" text-anchor="middle">blend</text>
  <text x="510" y="190" font-size="8.5" fill="#1A202C" text-anchor="middle">re-orient</text>
  <text x="590" y="190" font-size="8.5" fill="#1A202C" text-anchor="middle">stabilized</text>

  <!-- states row -->
  <text x="343" y="210" font-size="8.5" fill="#4A5568" text-anchor="end">states</text>
  <rect x="350" y="198" width="80" height="18" rx="0" fill="#E3F3F5" stroke="#007A87" stroke-width="1"/>
  <text x="390" y="210" font-size="8.5" fill="#1A202C" text-anchor="middle">relabel-eligible</text>
  <rect x="430" y="198" width="120" height="18" rx="0" fill="url(#hatch)" stroke="#4A5568" stroke-width="1"/>
  <line x1="470" y1="198" x2="470" y2="216" stroke="#4A5568" stroke-width="0.8"/>
  <rect x="484" y="201" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="510" y="210" font-size="8.5" fill="#1A202C" text-anchor="middle">excluded</text>
  <rect x="550" y="198" width="80" height="18" rx="0" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1"/>
  <text x="590" y="210" font-size="8.5" fill="#1A202C" text-anchor="middle">expert recovery</text>

  <!-- commands row -->
  <text x="343" y="234" font-size="8.5" fill="#4A5568" text-anchor="end">commands</text>
  <rect x="350" y="222" width="200" height="18" rx="0" fill="url(#hatch)" stroke="#4A5568" stroke-width="1"/>
  <line x1="430" y1="222" x2="430" y2="240" stroke="#4A5568" stroke-width="0.8"/>
  <line x1="470" y1="222" x2="470" y2="240" stroke="#4A5568" stroke-width="0.8"/>
  <rect x="366" y="225" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="390" y="234" font-size="8.5" fill="#1A202C" text-anchor="middle">masked</text>
  <rect x="486" y="225" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="510" y="234" font-size="8.5" fill="#1A202C" text-anchor="middle">masked</text>
  <rect x="550" y="222" width="80" height="18" rx="0" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1"/>
  <text x="590" y="234" font-size="8.5" fill="#1A202C" text-anchor="middle">expert labels</text>
</svg>
