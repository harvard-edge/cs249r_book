<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
    <defs>
        <!-- Arrowhead markers -->
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F407A" />
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#A51C30" />
        </marker>
        <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
        </marker>
        <marker id="dot-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
            <circle cx="5" cy="5" r="4" fill="#1F407A" />
        </marker>
        <marker id="dot-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
            <circle cx="5" cy="5" r="4" fill="#A51C30" />
        </marker>
    </defs>

    <style>
        .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1F407A; text-anchor: middle; }
        .box-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #2D3748; text-anchor: middle; }
        .math { font-family: 'Georgia', serif; font-size: 16px; font-style: italic; fill: #1F407A; }
        .math-red { font-family: 'Georgia', serif; font-size: 16px; font-style: italic; fill: #A51C30; }
        .axis-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; fill: #718096; }
        .label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; fill: #2D3748; text-anchor: middle; }
        .small-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; fill: #4A5568; text-anchor: middle; }
        .red-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #A51C30; text-anchor: middle; }
    </style>

    <!-- LEFT SIDE: Compounding Error Flywheel -->
    <rect x="20" y="20" width="450" height="460" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="2" rx="8" />
    <text x="245" y="50" class="title">BEHAVIORAL CLONING FLYWHEEL</text>
    
    <!-- Flywheel circle path -->
    <path d="M 245 100 A 100 100 0 1 1 244.9 100" fill="none" stroke="#E2E8F0" stroke-width="20" />
    <path d="M 145 200 A 100 100 0 0 1 245 100" fill="none" stroke="#A51C30" stroke-width="8" marker-end="url(#arrow-red)" />
    <path d="M 345 200 A 100 100 0 0 1 245 300" fill="none" stroke="#A51C30" stroke-width="8" marker-end="url(#arrow-red)" />
    
    <text x="245" y="195" class="math-red" style="font-weight: bold; font-size: 20px;" text-anchor="middle">O(T² ε)</text>
    <text x="245" y="220" class="small-label" style="fill:#A51C30;">Quadratic Compounding</text>
    
    <rect x="185" y="80" width="120" height="40" fill="#FFFFFF" stroke="#1F407A" stroke-width="2" rx="4" />
    <text x="245" y="105" class="box-text">Learned Policy</text>
    
    <rect x="185" y="280" width="120" height="40" fill="#FFFFFF" stroke="#1F407A" stroke-width="2" rx="4" />
    <text x="245" y="305" class="box-text">Environment</text>
    
    <!-- Annotations for flywheel -->
    <text x="100" y="150" class="small-label">Unobserved</text>
    <text x="100" y="165" class="small-label">Perturbation</text>
    <line x1="120" y1="170" x2="160" y2="170" stroke="#718096" stroke-width="2" marker-end="url(#arrow-grey)" />
    
    <text x="400" y="150" class="small-label">OOD State</text>
    <text x="400" y="165" class="small-label">s_t</text>
    
    <text x="100" y="250" class="small-label">Erroneous</text>
    <text x="100" y="265" class="small-label">Action a_t</text>
    
    <rect x="80" y="360" width="330" height="90" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1" rx="4" />
    <text x="245" y="385" class="box-text" style="fill:#1F407A">DAgger / Corrective Aggregation</text>
    <text x="245" y="410" class="small-label">Expands dataset support to perturbed states</text>
    <text x="245" y="430" class="math" text-anchor="middle">Bounds error to O(T ε)</text>

    <!-- RIGHT SIDE: Intervention Phase Space -->
    <rect x="490" y="20" width="490" height="460" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="2" rx="8" />
    <text x="735" y="50" class="title">INTERVENTION EPISODE CURATION</text>
    
    <!-- Axes -->
    <line x1="530" y1="350" x2="940" y2="350" stroke="#718096" stroke-width="2" marker-end="url(#arrow-grey)" />
    <text x="945" y="355" class="axis-label">Time (t)</text>
    
    <line x1="530" y1="350" x2="530" y2="80" stroke="#718096" stroke-width="2" marker-end="url(#arrow-grey)" />
    <text x="525" y="70" class="axis-label" text-anchor="end">State Dev</text>
    
    <!-- Nominal Tube -->
    <rect x="530" y="335" width="410" height="30" fill="#E2E8F0" opacity="0.5" />
    <line x1="530" y1="350" x2="940" y2="350" stroke="#1F407A" stroke-width="2" stroke-dasharray="4 4" />
    <text x="940" y="340" class="math" text-anchor="end">π* (Nominal)</text>

    <!-- Drift Trajectory -->
    <path d="M 530 350 C 600 350, 620 350, 650 330 C 680 300, 700 240, 750 150" fill="none" stroke="#A51C30" stroke-width="3" />
    <text x="660" y="320" class="math-red">π̂ (Autonomous Drift)</text>
    
    <!-- Corrupted Data Window (Shaded) -->
    <rect x="625" y="100" width="125" height="250" fill="#FED7D7" opacity="0.4" />
    
    <!-- t_div -->
    <line x1="625" y1="350" x2="625" y2="100" stroke="#4A5568" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="625" cy="350" r="4" fill="#A51C30" />
    <text x="625" y="375" class="label">t_div</text>
    
    <!-- t_takeover -->
    <line x1="750" y1="350" x2="750" y2="100" stroke="#4A5568" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="750" cy="150" r="4" fill="#A51C30" />
    <text x="750" y="375" class="label">t_takeover</text>
    
    <!-- Corrupted data label -->
    <path d="M 625 105 L 750 105" fill="none" stroke="#A51C30" stroke-width="1" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
    <text x="687" y="95" class="red-label">300-800 ms Delay</text>
    <text x="687" y="125" class="red-label">False Logging</text>
    <text x="687" y="140" class="small-label" style="fill:#A51C30">(Truncate Here!)</text>
    
    <!-- Expert Recovery Trajectory -->
    <path d="M 750 150 C 780 150, 800 350, 860 350" fill="none" stroke="#2B6CB0" stroke-width="3" />
    <text x="820" y="240" class="math" style="fill:#2B6CB0">Expert Recovery</text>
    
    <!-- t_rec -->
    <line x1="860" y1="350" x2="860" y2="150" stroke="#4A5568" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="860" cy="350" r="4" fill="#2B6CB0" />
    <text x="860" y="375" class="label">t_rec</text>
    
    <!-- Ingest box -->
    <rect x="750" y="390" width="110" height="30" fill="#C6F6D5" stroke="#38A169" stroke-width="1" rx="4" />
    <text x="805" y="410" class="small-label" style="fill:#276749; font-weight:bold;">Ingest to CA</text>
    <path d="M 805 355 L 805 385" fill="none" stroke="#38A169" stroke-width="2" marker-end="url(#arrow-grey)" />
    
    <!-- Truncate Box -->
    <rect x="585" y="390" width="80" height="30" fill="#FED7D7" stroke="#E53E3E" stroke-width="1" rx="4" />
    <text x="625" y="410" class="small-label" style="fill:#C53030; font-weight:bold;">Truncate</text>
    <path d="M 625 355 L 625 385" fill="none" stroke="#E53E3E" stroke-width="2" marker-end="url(#arrow-red)" />

</svg>
