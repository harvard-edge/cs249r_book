<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1E293B; letter-spacing: 0.3px; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748B; text-anchor: middle; }
      .math-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #A51C30; text-anchor: middle; }
      .math-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1F407A; }
      .math-red { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #A51C30; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #64748B; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#1F407A" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#A51C30" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#64748B" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#059669" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="500" fill="#FFFFFF" />

  <!-- ===================================================================== -->
  <!-- LEFT PANEL: BEHAVIORAL CLONING FLYWHEEL                               -->
  <!-- ===================================================================== -->
  <rect x="30" y="25" width="455" height="450" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" rx="4" />
  <text x="257" y="55" class="panel-title">BEHAVIORAL CLONING FLYWHEEL</text>

  <!-- Flywheel Circular Track -->
  <circle cx="257" cy="205" r="95" fill="none" stroke="#E2E8F0" stroke-width="16" />
  
  <!-- Right Arc (Cascading Error) -->
  <path d="M 257 110 A 95 95 0 0 1 352 205" fill="none" stroke="#A51C30" stroke-width="4" marker-end="url(#arrow-red)" />
  <path d="M 352 205 A 95 95 0 0 1 257 300" fill="none" stroke="#A51C30" stroke-width="4" />

  <!-- Left Arc (Compounding) -->
  <path d="M 257 300 A 95 95 0 0 1 162 205" fill="none" stroke="#64748B" stroke-width="3" />
  <path d="M 162 205 A 95 95 0 0 1 257 110" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow-slate)" />

  <!-- Center Compounding Error Metric -->
  <text x="257" y="198" class="math-title">O(T&#178; &#949;)</text>
  <text x="257" y="220" class="tag-text" fill="#A51C30">Quadratic Compounding</text>

  <!-- Top Block: Learned Policy -->
  <rect x="182" y="78" width="150" height="52" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.5" rx="3" />
  <text x="257" y="100" class="box-title" fill="#1F407A">Learned Policy &#960;&#770;</text>
  <text x="257" y="118" class="box-sub">Trained on expert demos</text>

  <!-- Bottom Block: Environment -->
  <rect x="182" y="274" width="150" height="52" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" rx="3" />
  <text x="257" y="296" class="box-title">Physical Robot Plant</text>
  <text x="257" y="314" class="box-sub">Real-world physics &amp; noise</text>

  <!-- External Perturbation Callout (Left) -->
  <rect x="52" y="175" width="95" height="40" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
  <text x="99" y="192" class="tag-text">Perturbation</text>
  <text x="99" y="206" class="box-sub">&#948;x (Slip / Contact)</text>
  <path d="M 147 195 L 175 195" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)" />

  <!-- Out-of-Distribution State Badge (Right) -->
  <rect x="365" y="142" width="105" height="46" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" />
  <text x="417" y="161" class="math-red" text-anchor="middle">s<tspan baseline-shift="sub" font-size="10">t</tspan> &#8713; D<tspan baseline-shift="sub" font-size="10">train</tspan></text>
  <text x="417" y="177" class="box-sub" fill="#A51C30">OOD State Drift</text>

  <!-- Erroneous Action Badge (Bottom-Right) -->
  <rect x="365" y="232" width="105" height="46" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" />
  <text x="417" y="251" class="math-red" text-anchor="middle">a<tspan baseline-shift="sub" font-size="10">t</tspan> &#8764; &#960;&#770;(s<tspan baseline-shift="sub" font-size="10">t</tspan>)</text>
  <text x="417" y="267" class="box-sub" fill="#A51C30">Compounding Error</text>

  <!-- DAgger Bottom Solution Card -->
  <rect x="55" y="360" width="405" height="90" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2" rx="3" />
  <text x="257" y="386" class="box-title" fill="#1F407A">DAgger / Corrective Aggregation Solution</text>
  <text x="257" y="408" class="tag-text">Intervention policies sample recovery trajectories on perturbed states</text>
  <text x="257" y="432" class="math-title" font-size="16" fill="#1F407A">Bounds cumulative error to O(T &#949;)</text>


  <!-- ===================================================================== -->
  <!-- RIGHT PANEL: INTERVENTION EPISODE CURATION                           -->
  <!-- ===================================================================== -->
  <rect x="515" y="25" width="455" height="450" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" rx="4" />
  <text x="742" y="55" class="panel-title">INTERVENTION EPISODE CURATION</text>

  <!-- Coordinate Axes -->
  <line x1="555" y1="350" x2="930" y2="350" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)" />
  <text x="935" y="354" class="axis-label">Time (t)</text>
  
  <line x1="555" y1="350" x2="555" y2="95" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)" />
  <text x="555" y="82" class="axis-label">Tracking Error &#124;&#8201;&#124;&#8201;s &#8722; s*&#8201;&#124;&#8201;&#124;</text>

  <!-- Nominal Safe Tube -->
  <rect x="555" y="338" width="370" height="24" fill="#E2E8F0" opacity="0.6" />
  <line x1="555" y1="350" x2="925" y2="350" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Corrupted Data Window (False Logging Window) -->
  <rect x="645" y="115" width="115" height="235" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Reaction Delay Dimension Line -->
  <path d="M 648 125 L 757 125" fill="none" stroke="#DC2626" stroke-width="1.2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
  <text x="702" y="117" class="btn-text" fill="#DC2626">300–800 ms Delay</text>

  <!-- False Logging Badge -->
  <rect x="655" y="135" width="95" height="34" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="1" />
  <text x="702" y="150" class="btn-text" fill="#DC2626">False Logging</text>
  <text x="702" y="162" class="box-sub" fill="#B91C1C">Human Latency</text>

  <!-- Autonomous Drift Curve: from t_div (x=645) to takeover (x=760) -->
  <path d="M 555 350 C 600 350, 625 348, 645 335 C 675 315, 710 240, 760 160" fill="none" stroke="#DC2626" stroke-width="3" />

  <!-- Autonomous Drift Label: Placed cleanly left of t_div (x=645) and above curve -->
  <rect x="545" y="275" width="95" height="34" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" />
  <text x="592" y="291" class="math-red" text-anchor="middle">&#960;&#770;</text>
  <text x="592" y="303" class="box-sub" fill="#A51C30">Autonomous Drift</text>

  <!-- Nominal Tube Label: Placed cleanly right of t_rec (x=870) -->
  <rect x="880" y="315" width="90" height="22" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
  <text x="925" y="329" class="math-text" text-anchor="middle" font-size="10">&#960;* (Nominal)</text>

  <!-- Expert Recovery Trajectory: from takeover (x=760) down to t_rec (x=870) -->
  <path d="M 760 160 C 785 160, 815 320, 870 350" fill="none" stroke="#1F407A" stroke-width="3" />
  
  <!-- Expert Recovery Label -->
  <rect x="795" y="205" width="105" height="22" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="847" y="220" class="math-text" text-anchor="middle" font-size="11">Expert Recovery</text>

  <!-- Time Marker 1: t_div -->
  <line x1="645" y1="350" x2="645" y2="105" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2" />
  <circle cx="645" cy="350" r="4" fill="#DC2626" />
  <text x="645" y="372" class="tag-text">t<tspan baseline-shift="sub" font-size="9">div</tspan></text>

  <!-- Time Marker 2: t_takeover -->
  <line x1="760" y1="350" x2="760" y2="105" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2" />
  <circle cx="760" cy="160" r="5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="760" y="372" class="tag-text">t<tspan baseline-shift="sub" font-size="9">takeover</tspan></text>

  <!-- Time Marker 3: t_rec -->
  <line x1="870" y1="350" x2="870" y2="160" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2" />
  <circle cx="870" cy="350" r="4" fill="#1F407A" />
  <text x="870" y="372" class="tag-text">t<tspan baseline-shift="sub" font-size="9">rec</tspan></text>

  <!-- Action Decision 1: Truncate Contaminated Data -->
  <path d="M 645 378 L 645 400" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <rect x="585" y="402" width="120" height="32" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" />
  <text x="645" y="422" class="btn-text" fill="#DC2626">Truncate False Data</text>

  <!-- Action Decision 2: Ingest Recovery to DAgger -->
  <path d="M 815 378 L 815 400" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <rect x="755" y="402" width="120" height="32" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1.2" />
  <text x="815" y="422" class="btn-text" fill="#047857">Ingest to DAgger</text>

</svg>
