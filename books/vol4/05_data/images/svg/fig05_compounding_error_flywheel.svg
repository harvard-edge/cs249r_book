<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="22.8 12.8 954.4 374.4" width="954.4" height="374.4">
  <rect data-bgcover="1" x="-24.9" y="-5.9" width="1049.8" height="411.8" fill="#ffffff"/>
  <defs>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748B; }
      .tick-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .math-bound { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .curve-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="#FFFFFF" />

  <!-- ==================== PANEL 1: COMPOUNDING ERROR FLYWHEEL ==================== -->
  <rect x="40" y="30" width="445" height="340" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="262.5" y="65" class="card-title">Compounding Error Flywheel</text>

  <!-- Circular Flywheel Paths (R=90, Center=262.5, 210) -->
  <circle cx="262.5" cy="210" r="90" fill="none" stroke="#E2E8F0" stroke-width="2" />
  <!-- Arc 1: Top to Right -->
  <path d="M 262.5 120 A 90 90 0 0 1 352.5 210" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-slate)" />
  <!-- Arc 2: Right to Bottom -->
  <path d="M 352.5 210 A 90 90 0 0 1 262.5 300" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <!-- Arc 3: Bottom to Left -->
  <path d="M 262.5 300 A 90 90 0 0 1 172.5 210" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-slate)" />
  <!-- Arc 4: Left to Top -->
  <path d="M 172.5 210 A 90 90 0 0 1 262.5 120" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-slate)" />

  <!-- Center Bounds -->
  <text x="262.5" y="181" class="math-bound" fill="#DC2626">BC worst case</text>
  <text x="262.5" y="197" class="math-bound" fill="#DC2626">O(T² ε)</text>
  <text x="262.5" y="226" class="math-bound" fill="#15803D" font-size="10">DAgger conditional</text>
  <text x="262.5" y="242" class="math-bound" fill="#15803D">O(T ε)</text>

  <!-- Node: Learned Policy -->
  <rect x="197.5" y="98" width="130" height="32" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
  <text x="262.5" y="118" class="node-text" fill="#1E40AF">Learned Policy</text>

  <!-- Node: Action -->
  <rect x="335" y="196" width="75" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="372.5" y="214" class="node-text" fill="#334155">Action</text>

  <!-- Node: Physical Plant -->
  <rect x="197.5" y="288" width="130" height="32" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="262.5" y="308" class="node-text" fill="#0F172A">Physical Plant</text>

  <!-- Node: Disturbance -->
  <rect x="110" y="196" width="85" height="28" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
  <text x="152.5" y="214" class="node-text" fill="#DC2626">Perturbation</text>

  <!-- ==================== PANEL 2: INTERVENTION CURATION ==================== -->
  <rect x="515" y="30" width="445" height="340" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="737.5" y="65" class="card-title">Intervention Curation</text>

  <!-- Coordinate Grid & Nominal Corridor -->
  <rect x="570" y="274" width="300" height="12" fill="#F0FDF4" />
  <line x1="570" y1="280" x2="870" y2="280" stroke="#22C55E" stroke-width="1.2" stroke-dasharray="4,3" />
  <text x="880" y="283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" fill="#15803D">Nominal</text>

  <!-- Axes -->
  <line x1="570" y1="280" x2="870" y2="280" stroke="#CBD5E1" stroke-width="1" />
  <line x1="570" y1="100" x2="570" y2="280" stroke="#CBD5E1" stroke-width="1" />
  <text x="570" y="92" class="axis-label">Tracking Error</text>
  <text x="870" y="302" class="axis-label">Time</text>

  <!-- Dotted guide lines for timestamps -->
  <line x1="635" y1="120" x2="635" y2="280" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="735" y1="120" x2="735" y2="280" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="825" y1="120" x2="825" y2="280" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Shaded delay region (t_div to t_takeover) -->
  <path d="M 635 280 Q 705 270 735 135 L 735 280 Z" fill="#FEF2F2" />

  <!-- Trajectory curve -->
  <!-- Autonomous drift -->
  <path d="M 570 280 L 635 280 Q 705 270 735 135" fill="none" stroke="#DC2626" stroke-width="2" />
  <!-- Expert recovery -->
  <path d="M 735 135 Q 775 160 825 280" fill="none" stroke="#2563EB" stroke-width="2" />

  <!-- Key event points -->
  <circle cx="635" cy="280" r="3.5" fill="#DC2626" />
  <circle cx="735" cy="135" r="3.5" fill="#DC2626" />
  <circle cx="825" cy="280" r="3.5" fill="#2563EB" />

  <!-- Timestamps -->
  <text x="635" y="298" class="tick-text">t<tspan baseline-shift="sub" font-size="8">div</tspan></text>
  <text x="735" y="298" class="tick-text">t<tspan baseline-shift="sub" font-size="8">takeover</tspan></text>
  <text x="825" y="298" class="tick-text">t<tspan baseline-shift="sub" font-size="8">rec</tspan></text>

  <!-- Labels on curves -->
  <text x="685" y="120" class="curve-label" fill="#DC2626">Relabel Eligible States</text>
  <text x="795" y="190" class="curve-label" fill="#1E40AF">Retain Recovery</text>
  <text x="737.5" y="340" class="curve-label" fill="#475569">Keep states; exclude unsafe learner commands as labels</text>
</svg>
