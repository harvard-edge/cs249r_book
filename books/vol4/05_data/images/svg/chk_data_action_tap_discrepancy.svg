<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <defs>
    <style>
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1px; rx: 4px; }
      .subcard-bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 0.75px; rx: 3px; }
      .title-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: bold; fill: #1e293b; }
      .sub-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #64748b; }
      .label-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; fill: #334155; }
      .bold-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; font-weight: bold; }
    </style>
    <marker id="arr-red-2" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#c44" />
    </marker>
    <marker id="arr-green-2" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#3d9e5a" />
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="540" height="180" class="card-bg" />

  <!-- ==================== SUB-CARD 1: PHYSICAL BRAKING & CBF CLAMP ==================== -->
  <rect x="16" y="14" width="248" height="152" class="subcard-bg" />
  
  <text x="28" y="29" class="title-text">CBF BARRIER BRAKING &amp; CLAMPING</text>
  <text x="28" y="40" class="sub-text">Workbench approach: d₀ = 15 mm, a_decel = 2.0 m/s²</text>

  <!-- Spatial Diagram -->
  <g transform="translate(28, 44)">
    <!-- Baseline Axis -->
    <line x1="0" y1="38" x2="224" y2="38" stroke="#94a3b8" stroke-width="1" />

    <!-- Workbench Block (Right: z=0) -->
    <rect x="196" y="12" width="28" height="34" fill="#e2e8f0" stroke="#64748b" stroke-width="0.75" />
    <text x="210" y="27" class="bold-text" fill="#475569" text-anchor="middle" font-size="6.5px">Bench</text>
    <text x="210" y="36" class="sub-text" fill="#64748b" text-anchor="middle" font-size="6px">z = 0</text>

    <!-- Safety Buffer Zone: 2 mm (x = 172 to 196) -->
    <rect x="172" y="12" width="24" height="34" fill="#f9d6d5" stroke="#c44" stroke-width="0.75" stroke-dasharray="2,2" />
    <text x="184" y="9" class="bold-text" fill="#7f1d1d" text-anchor="middle" font-size="5.5px">d_safe=2mm</text>

    <!-- Tool / Gripper Indicator (x = 4 to 22) -->
    <rect x="4" y="16" width="18" height="14" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75" />
    <text x="13" y="25" class="bold-text" fill="#1e3a8a" text-anchor="middle" font-size="5.5px">Tool</text>
    <line x1="13" y1="38" x2="13" y2="44" stroke="#4a90c4" stroke-width="0.75" />
    <text x="13" y="50" class="bold-text" fill="#1e3a8a" text-anchor="middle" font-size="6px">d₀=15mm</text>

    <!-- Available Distance bracket -->
    <line x1="13" y1="5" x2="172" y2="5" stroke="#64748b" stroke-width="0.5" />
    <line x1="13" y1="3" x2="13" y2="7" stroke="#64748b" stroke-width="0.5" />
    <line x1="172" y1="3" x2="172" y2="7" stroke="#64748b" stroke-width="0.5" />
    <text x="92" y="4.5" class="bold-text" fill="#334155" text-anchor="middle" font-size="6.5px">d_avail = 13.0 mm</text>

    <!-- Trajectory 1: Requested a_req (Red overshoot) -->
    <path d="M 22 19 L 206 19" fill="none" stroke="#c44" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-red-2)" />
    <text x="45" y="16" class="bold-text" fill="#7f1d1d" font-size="6.5px">a_req = −0.40 m/s</text>
    <text x="214" y="21" class="bold-text" fill="#c44" font-size="7.5px">💥</text>

    <!-- Trajectory 2: Enforced a_enf (Green curve halting at buffer) -->
    <path d="M 22 28 Q 110 28 170 28" fill="none" stroke="#3d9e5a" stroke-width="1.4" marker-end="url(#arr-green-2)" />
    <text x="45" y="36" class="bold-text" fill="#14532d" font-size="6.5px">a_enf = −0.228 m/s (clamped at d_safe)</text>
  </g>

  <!-- Numerical Verification Box -->
  <g transform="translate(28, 97)">
    <rect x="0" y="0" width="224" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75" />
    <text x="6" y="11" class="label-text">d_stop for a_req:</text>
    <text x="218" y="11" class="bold-text" fill="#7f1d1d" text-anchor="end">40.0 mm &gt; 13 mm (Crash)</text>
    <line x1="6" y1="15" x2="218" y2="15" stroke="#e2e8f0" stroke-width="0.5" />
    <text x="6" y="24" class="label-text">CBF limit |a_enf|:</text>
    <text x="218" y="24" class="bold-text" fill="#14532d" text-anchor="end">√(2 · a · d) = 0.228 m/s (Safe)</text>
  </g>

  <!-- Status Pill Badge -->
  <rect x="28" y="133" width="224" height="22" rx="11" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75" />
  <text x="140" y="147" class="bold-text" fill="#78350f" text-anchor="middle" font-size="7.5px">CBF Governor Clamps Velocity: Intent ≠ Actuation</text>


  <!-- ==================== SUB-CARD 2: CAUSAL LOGGING & TRAINING DILEMMA ==================== -->
  <rect x="276" y="14" width="248" height="152" class="subcard-bg" />

  <text x="288" y="29" class="title-text">TRAINING TARGET CONTAMINATION</text>
  <text x="288" y="40" class="sub-text">Causal failure modes when logging across safety governor</text>

  <!-- 3 Stacked Target Comparison Rows -->
  <g transform="translate(288, 47)">
    <!-- Row 1: Log only a_req -->
    <rect x="0" y="0" width="224" height="24" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.5" />
    <rect x="4" y="4" width="46" height="16" rx="8" fill="#c44" />
    <text x="27" y="15" class="bold-text" fill="#ffffff" text-anchor="middle" font-size="6.5px">Log a_req</text>
    <text x="56" y="11" class="bold-text" fill="#7f1d1d" font-size="7px">Unexecutable crash policy</text>
    <text x="56" y="20" class="sub-text" fill="#7f1d1d" font-size="6.5px">Commands −0.40 m/s → trips CBF e-stop</text>

    <!-- Row 2: Log only a_enf without flag -->
    <rect x="0" y="27" width="224" height="24" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.5" />
    <rect x="4" y="31" width="46" height="16" rx="8" fill="#c87b2a" />
    <text x="27" y="42" class="bold-text" fill="#ffffff" text-anchor="middle" font-size="6.5px">Log a_enf</text>
    <text x="56" y="38" class="bold-text" fill="#78350f" font-size="7px">Governor masking fallacy</text>
    <text x="56" y="47" class="sub-text" fill="#78350f" font-size="6.5px">Policy mimics √(2ad) brake as human skill</text>

    <!-- Row 3: Log 4-Stream Tuple -->
    <rect x="0" y="54" width="224" height="25" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.5" />
    <rect x="4" y="58" width="46" height="17" rx="8" fill="#3d9e5a" />
    <text x="27" y="70" class="bold-text" fill="#ffffff" text-anchor="middle" font-size="6.5px">4-Stream</text>
    <text x="56" y="66" class="bold-text" fill="#14532d" font-size="7px">Preserves causal boundary</text>
    <text x="56" y="75" class="sub-text" fill="#14532d" font-size="6.5px">Flags b_clamped; separates intent from governor</text>
  </g>

  <!-- Bottom Pill Badge -->
  <rect x="288" y="133" width="224" height="22" rx="11" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75" />
  <text x="400" y="147" class="bold-text" fill="#14532d" text-anchor="middle" font-size="7.5px">Mandatory: Log 4-Stream Tuple with Override Flags</text>

</svg>