<rect width="1000" height="540" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
<text x="500.0" y="28" class="title">COLLECTOR EMPIRICAL OCCUPANCY VS SCENARIO LEDGER SUPPORT</text>
<text x="500.0" y="46" class="subtitle">Why Low Validation Loss on Held-Out Demonstrations Conceals Critical Operational Blind Spots</text>

<!-- ==================== PANEL 1: COLLECTOR A ==================== -->
