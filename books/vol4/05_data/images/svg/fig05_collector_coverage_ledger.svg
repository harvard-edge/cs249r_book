<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #64748B; text-anchor: middle; }
      .plot-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .join-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="#FFFFFF" />

  <!-- ==================== PANEL 1: CAUTIOUS TELEOP ==================== -->
  <rect x="40" y="30" width="285" height="340" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="182.5" y="65" class="card-title">Cautious Teleoperation</text>

  <!-- Envelope S_req -->
  <rect x="100" y="105" width="175" height="175" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2" stroke-dasharray="4,4" />

  <!-- Concentrated cluster at center -->
  <rect x="175" y="180" width="25" height="25" rx="3" fill="#EF4444" opacity="0.9" />
  <text x="187.5" y="240" class="plot-label" fill="#DC2626">Sparse Support</text>

  <!-- Axes -->
  <line x1="100" y1="280" x2="275" y2="280" stroke="#CBD5E1" stroke-width="1" />
  <line x1="100" y1="105" x2="100" y2="280" stroke="#CBD5E1" stroke-width="1" />
  <text x="187.5" y="306" class="axis-label">Angle θ</text>
  <text transform="rotate(-90 75 192)" x="75" y="192" class="axis-label">Force F<tspan baseline-shift="sub" font-size="9">N</tspan></text>

  <!-- ==================== PANEL 2: EXPLORATORY POLICY ==================== -->
  <rect x="355" y="30" width="285" height="340" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="497.5" y="65" class="card-title">Exploratory Policy</text>

  <!-- Envelope S_req -->
  <rect x="415" y="105" width="175" height="175" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4" />

  <!-- Broad Coverage Region -->
  <rect x="428" y="128" width="149" height="132" rx="4" fill="#BBF7D0" stroke="#86EFAC" stroke-width="1.2" opacity="0.6" />
  <rect x="445" y="145" width="115" height="98" rx="3" fill="#22C55E" opacity="0.25" />
  <text x="502.5" y="198" class="plot-label" fill="#15803D">Dense Support</text>

  <!-- Axes -->
  <line x1="415" y1="280" x2="590" y2="280" stroke="#CBD5E1" stroke-width="1" />
  <line x1="415" y1="105" x2="415" y2="280" stroke="#CBD5E1" stroke-width="1" />
  <text x="502.5" y="306" class="axis-label">Angle θ</text>
  <text transform="rotate(-90 390 192)" x="390" y="192" class="axis-label">Force F<tspan baseline-shift="sub" font-size="9">N</tspan></text>

  <!-- ==================== PANEL 3: RELATIONAL JOIN ==================== -->
  <rect x="670" y="30" width="290" height="340" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="815" y="65" class="card-title">Scenario Ledger Join</text>

  <!-- Input 1: Target Envelope -->
  <rect x="700" y="95" width="230" height="34" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
  <text x="815" y="117" class="join-text" fill="#1E40AF">Target Envelope</text>

  <!-- Join symbol -->
  <text x="815" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14px" font-weight="700" fill="#64748B" text-anchor="middle">⋈</text>

  <!-- Input 2: Empirical Support -->
  <rect x="700" y="158" width="230" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="815" y="180" class="join-text" fill="#334155">Empirical Support</text>

  <!-- Down arrow -->
  <line x1="815" y1="192" x2="815" y2="216" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-slate)" />

  <!-- Partition 1: Supported -->
  <rect x="700" y="224" width="230" height="36" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
  <text x="815" y="247" class="join-text" fill="#14532D">Supported Regime</text>

  <!-- Partition 2: High Variance -->
  <rect x="700" y="268" width="230" height="36" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" />
  <text x="815" y="291" class="join-text" fill="#B45309">High-Variance Zone</text>

  <!-- Partition 3: Blind Spot -->
  <rect x="700" y="312" width="230" height="36" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2" />
  <text x="815" y="335" class="join-text" fill="#991B1B">Blind Spot</text>
</svg>
