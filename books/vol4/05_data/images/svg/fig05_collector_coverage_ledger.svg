<!-- Point concentration badge -->
<rect x="153.0" y="171.0" width="36" height="26" rx="3" fill="#DC2626" fill-opacity="0.9" stroke="#A51C30" stroke-width="1.2"/>
<text x="171.0" y="187.0" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">10⁶ pts</text>

<!-- Axis labels -->
<text x="66" y="274" font-size="8" fill="#64748B" text-anchor="middle">-15°</text>
<text x="171.0" y="274" font-size="8" fill="#64748B" text-anchor="middle">0°</text>
<text x="276" y="274" font-size="8" fill="#64748B" text-anchor="middle">+15°</text>
<text x="171.0" y="287" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Contact Angle θ (deg)</text>
<text x="60" y="115" font-size="8" fill="#64748B" text-anchor="end">20N</text>
<text x="60" y="188.0" font-size="8" fill="#64748B" text-anchor="end">10N</text>
<text x="60" y="260" font-size="8" fill="#64748B" text-anchor="end">0N</text>
<text x="40" y="185.0" font-size="9" font-weight="600" fill="#475569" transform="rotate(-90 40 185.0)" text-anchor="middle">Normal Force F_N (N)</text>

<!-- Stats Card -->
<rect x="36" y="296" width="271" height="205" rx="3" fill="#DC2626" fill-opacity="0.04" stroke="#DC2626" stroke-width="0.8"/>
<text x="46" y="315" font-size="9" font-weight="700" fill="#1A202C">Total Recorded Transitions:</text>
<text x="46" y="328" font-size="8.5" font-weight="600" fill="#475569">1,000,000 samples @ 100 Hz</text>

<text x="46" y="347" font-size="9" font-weight="700" fill="#1A202C">Scenario Grid Coverage:</text>
<text x="46" y="360" font-size="8.5" font-weight="600" fill="#475569">8 / 600 cells (1.3%)</text>

<text x="46" y="379" font-size="9" font-weight="700" fill="#1A202C">Zero-Count Blind Spots:</text>
<text x="46" y="392" font-size="8.5" font-weight="700" fill="#A51C30">592 / 600 cells (98.7%!)</text>

<text x="46" y="411" font-size="9" font-weight="700" fill="#1A202C">Held-Out Validation Loss:</text>
<text x="46" y="424" font-size="8.5" font-weight="600" fill="#475569">L_val = 0.001 rad (Deceptive)</text>

<text x="46" y="443" font-size="9" font-weight="700" fill="#1A202C">Compounding Drift Risk:</text>
<text x="46" y="456" font-size="8.5" font-weight="700" fill="#A51C30">CATASTROPHIC at ±2.5°</text>

<text x="46" y="475" font-size="9" font-weight="700" fill="#1A202C">Ingestion Policy Decision:</text>
<text x="46" y="488" font-size="8.5" font-weight="700" fill="#A51C30">REFUSE / REQUIRE DAgger</text>


