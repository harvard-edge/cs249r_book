<text x="368" y="185.0" font-size="9" font-weight="600" fill="#475569" transform="rotate(-90 368 185.0)" text-anchor="middle">Normal Force F_N (N)</text>

<!-- Stats Card -->
<rect x="364" y="296" width="271" height="205" rx="3" fill="#10B981" fill-opacity="0.04" stroke="#10B981" stroke-width="0.8"/>
<text x="374" y="315" font-size="9" font-weight="700" fill="#1A202C">Total Recorded Transitions:</text>
