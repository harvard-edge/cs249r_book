<text x="704" y="204" font-size="8.5" fill="#475569">Sample counts logged per discretized scenario bin</text>

<!-- Arrow 2 to Join -->
<line x1="827.5" y1="216" x2="827.5" y2="230" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-navy)"/>

