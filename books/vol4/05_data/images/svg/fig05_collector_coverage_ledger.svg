<text x="704" y="123" font-size="9" font-weight="700" fill="#1F407A">External Specification S_req:</text>
<text x="704" y="139" font-size="8.5" fill="#475569">Grid: 600 Bins [θ: ±15°, F_N: 0–20N, μ: 0.1–0.4]</text>

<!-- Arrow 1 to Join -->
<line x1="827.5" y1="151" x2="827.5" y2="168" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-navy)"/>

<!-- Input 2: Dataset Counts -->
<rect x="694" y="170" width="267" height="46" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
