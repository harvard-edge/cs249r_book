<text x="827.5" y="249" font-size="10" font-weight="700" fill="#1F407A" text-anchor="middle">Audit Join: S_req ⋈ N_cell</text>

<!-- Output Arrow to Classification Rules -->
<line x1="827.5" y1="258" x2="827.5" y2="272" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-navy)"/>

<!-- Support Classification Rules Box -->
<rect x="694" y="274" width="267" height="227" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="706" y="294" font-size="9.5" font-weight="700" fill="#1A202C">Support Classification Rules:</text>

<!-- Rule 1: Supported -->
<circle cx="712" cy="312" r="4" fill="#10B981"/>
<text x="724" y="315" font-size="9" font-weight="700" fill="#10B981">N_cell ≥ 500: Supported Regime</text>
<text x="724" y="329" font-size="8" fill="#475569">Policy trained under dense empirical support.</text>
<text x="724" y="341" font-size="8" font-weight="600" fill="#047857">Admit directly into training cluster.</text>

<!-- Rule 2: High-Variance -->
<circle cx="712" cy="372" r="4" fill="#D97706"/>
<text x="724" y="375" font-size="9" font-weight="700" fill="#D97706">0 &lt; N_cell &lt; 50: High-Variance Regime</text>
<text x="724" y="389" font-size="8" fill="#475569">Insufficient sample count; wide epistemic variance.</text>
<text x="724" y="401" font-size="8" font-weight="600" fill="#B45309">Condition: require targeted recollection.</text>

<!-- Rule 3: Zero-Support -->
<circle cx="712" cy="432" r="4" fill="#DC2626"/>
<text x="724" y="435" font-size="9" font-weight="700" fill="#DC2626">N_cell = 0: Zero-Support Blind Spot</text>
<text x="724" y="449" font-size="8" fill="#475569">Zero empirical constraints from training data.</text>
<text x="724" y="461" font-size="8" font-weight="600" fill="#B91C1C">Refuse: trigger autonomous safety gate.</text>
