<?xml version="1.0" encoding="utf-8"?>
<!-- Write-bandwidth ladder, linear scale: x = 4 + 0.024 px per MB/s (7,000 MB/s at x = 172).
     Violet bars are session demands; dashed verticals are drive ceilings (red SATA wall, slate NVMe). -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="186" fill="#ffffff"/>
  <!-- ceiling labels -->
  <text x="15.2" y="14" font-size="13" fill="#cb202d">SATA SSD</text>
  <text x="15.2" y="29" font-size="13" fill="#cb202d">550 MB/s</text>
  <text x="174" y="14" font-size="13" fill="#5e6b73" text-anchor="end">NVMe Gen4</text>
  <text x="174" y="29" font-size="13" fill="#5e6b73" text-anchor="end">7,000 MB/s</text>
  <!-- demand bars -->
  <rect x="4" y="44" width="74.93" height="34" fill="#7e317b" opacity="0.92"/>
  <rect x="4" y="94" width="53.26" height="34" fill="#7e317b" opacity="0.92"/>
  <rect x="4" y="144" width="9.36" height="34" fill="#7e317b" opacity="0.92"/>
  <!-- axis -->
  <line x1="4" y1="181" x2="176" y2="181" stroke="#cccccc" stroke-width="1.4"/>
  <!-- ceilings -->
  <line x1="17.2" y1="36" x2="17.2" y2="181" stroke="#cb202d" stroke-width="1.9" stroke-dasharray="6.9,3"/>
  <line x1="172" y1="36" x2="172" y2="181" stroke="#5e6b73" stroke-width="1.9" stroke-dasharray="6.9,3"/>
  <!-- bar labels -->
  <text x="84" y="58" font-size="13" fill="#333333">All streams</text>
  <text x="84" y="73" font-size="13" fill="#333333">3,122 MB/s</text>
  <text x="63" y="108" font-size="13" fill="#333333">Nav camera</text>
  <text x="63" y="123" font-size="13" fill="#333333">2,219 MB/s</text>
  <text x="24" y="158" font-size="13" fill="#333333">Compressed</text>
  <text x="24" y="173" font-size="13" fill="#333333">390 MB/s</text>
</svg>
