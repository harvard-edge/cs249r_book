<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
<defs>
    <style>
        .box { fill: #f8fafc; stroke: #2D3748; stroke-width: 2; }
        .box-blue { fill: #ebf4ff; stroke: #1F407A; stroke-width: 2; }
        .box-red { fill: #fff5f5; stroke: #A51C30; stroke-width: 2; }
        .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #1a202c; }
        .text { font-family: sans-serif; font-size: 14px; fill: #2d3748; }
        .text-small { font-family: sans-serif; font-size: 12px; fill: #4a5568; }
        .line { stroke: #2D3748; stroke-width: 2; fill: none; }
        .line-dashed { stroke: #2D3748; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
        .line-blue { stroke: #1F407A; stroke-width: 2; fill: none; }
        .line-red { stroke: #A51C30; stroke-width: 2; fill: none; }
        .line-red-dashed { stroke: #A51C30; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
        .arrow { fill: #2D3748; }
        .arrow-blue { fill: #1F407A; }
        .arrow-red { fill: #A51C30; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-blue" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-red" />
    </marker>
</defs>

<!-- Background -->
<rect width="1000" height="620" fill="#ffffff" />

<!-- Panel A: Strict physical isolation architecture -->
<text x="30" y="40" class="title">Panel A: Strict Physical Isolation Architecture</text>

<!-- Application Processor -->
<rect x="50" y="80" width="220" height="150" rx="8" class="box" />
<text x="160" y="105" class="title" text-anchor="middle">Application Processor</text>
<text x="160" y="130" class="text" text-anchor="middle">Untrusted User Space</text>
<rect x="70" y="150" width="180" height="60" class="box" stroke-dasharray="4" />
<text x="160" y="175" class="text" text-anchor="middle">Vision-Language-Action</text>
<text x="160" y="195" class="text" text-anchor="middle">Policy Proposals (pt)</text>

<!-- Shared-Memory Link -->
<rect x="330" y="140" width="100" height="40" class="box" />
<text x="380" y="165" class="text-small" text-anchor="middle">Isolated SHM</text>

<path fill="none" d="M 270 160 L 320 160" class="line-dashed" marker-end="url(#arrowhead)" />
<path fill="none" d="M 430 160 L 480 160" class="line-dashed" marker-end="url(#arrowhead)" />

<!-- Real-Time Microcontroller -->
<rect x="490" y="80" width="220" height="160" rx="8" class="box-blue" />
<text x="600" y="105" class="title" text-anchor="middle" fill="#1F407A">Real-Time MCU</text>
<text x="600" y="130" class="text" text-anchor="middle">Privileged Space</text>
<rect x="510" y="145" width="180" height="80" class="box" />
<text x="600" y="165" class="text" text-anchor="middle">Control Barrier Functions</text>
<text x="600" y="185" class="text" text-anchor="middle">&amp; Stopping Invariants</text>
<text x="600" y="210" class="text-small" text-anchor="middle">Evaluates safety of pt</text>

<!-- Motor Drive Registers -->
<rect x="770" y="140" width="180" height="60" class="box-blue" />
<text x="860" y="165" class="title" text-anchor="middle">Motor Registers</text>
<text x="860" y="185" class="text-small" text-anchor="middle">Hardware Drive Config</text>

<path fill="none" d="M 710 160 L 760 160" class="line-blue" marker-end="url(#arrowhead-blue)" />
<text x="735" y="150" class="text-small" text-anchor="middle" fill="#1F407A">Verified (ut)</text>

<path fill="none" d="M 860 200 L 860 230" class="line-blue" marker-end="url(#arrowhead-blue)" />
<rect x="770" y="240" width="180" height="40" class="box" />
<text x="860" y="265" class="text" text-anchor="middle">Gate Drivers / Hardware</text>

<!-- Dynamic braking -->
<path fill="none" d="M 600 225 L 600 260 L 760 260" class="line-red" marker-end="url(#arrowhead-red)" />
<text x="680" y="255" class="text-small" text-anchor="middle" fill="#A51C30">Violation -&gt; Brake (bot)</text>

<!-- Divider -->
<line x1="30" y1="330" x2="970" y2="330" stroke="#E2E8F0" stroke-width="2" />

<!-- Panel B: Unsafe collapsed architecture -->
<text x="30" y="370" class="title">Panel B: Unsafe Collapsed Architecture</text>

<!-- Application Processor (Collapsed) -->
<rect x="50" y="410" width="220" height="150" rx="8" class="box-red" />
<text x="160" y="435" class="title" text-anchor="middle" fill="#A51C30">App Processor</text>
<text x="160" y="460" class="text" text-anchor="middle">Unverified VLA Policy</text>
<rect x="70" y="480" width="180" height="60" class="box" stroke-dasharray="4" />
<text x="160" y="505" class="text" text-anchor="middle">Hallucinations /</text>
<text x="160" y="525" class="text" text-anchor="middle">Memory Corruption</text>

<!-- Motor Drive Registers directly attached -->
<rect x="400" y="450" width="180" height="60" class="box-red" />
<text x="490" y="475" class="title" text-anchor="middle">Motor Registers</text>
<text x="490" y="495" class="text-small" text-anchor="middle">Unrestricted Write Access</text>

<path fill="none" d="M 270 480 L 390 480" class="line-red-dashed" marker-end="url(#arrowhead-red)" />
<text x="330" y="470" class="text" text-anchor="middle" fill="#A51C30">Direct Write</text>
<text x="330" y="500" class="text-small" text-anchor="middle" fill="#A51C30">Dangerous Action</text>

<path fill="none" d="M 490 510 L 490 540" class="line-red" marker-end="url(#arrowhead-red)" />
<rect x="400" y="550" width="180" height="40" class="box" />
<text x="490" y="575" class="text" text-anchor="middle">Gate Drivers / Hardware</text>

</svg>
