<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-sharp" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#475569"/>
    </marker>
    <marker id="arr-axis" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#64748b"/>
    </marker>
    <marker id="arr-dim-top" viewBox="0 0 6 4" refX="1" refY="2" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 6 0 L 0 2 L 6 4 z" fill="#7f1d1d"/>
    </marker>
    <marker id="arr-dim-bot" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#7f1d1d"/>
    </marker>
  </defs>

  <!-- Outer Card Canvas -->
  <rect width="540" height="180" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================================================================== -->
  <!-- LEFT PANEL: ACTUATOR CAUSAL SEAM (OMITTED BY SIMULATION)              -->
  <!-- ==================================================================== -->
  <g id="panel-actuator-seam">
    <rect x="16" y="16" width="190" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    
    <!-- Header -->
    <text x="26" y="32" font-size="9.5" font-weight="700" fill="#1e293b">ACTUATOR SEAM</text>
    <rect x="150" y="21" width="46" height="15" rx="7.5" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="173" y="31.5" font-size="7.5" font-weight="700" fill="#78350f" text-anchor="middle">HIL RIG</text>

    <!-- Block 1: Commanded Torque Step -->
    <rect x="24" y="42" width="62" height="30" rx="3" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
    <text x="55" y="54" font-size="8.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">τ_cmd Step</text>
    <text x="55" y="65.5" font-size="7.5" font-weight="500" fill="#1e3a8a" text-anchor="middle">6.0 N·m</text>

    <!-- Arrow 1 to Stator Lag -->
    <line x1="86" y1="57" x2="98" y2="57" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-sharp)"/>

    <!-- Block 2: assumed effective torque lag -->
    <rect x="102" y="42" width="94" height="30" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="149" y="54" font-size="8.5" font-weight="700" fill="#78350f" text-anchor="middle">Torque Lag τ_lag</text>
    <text x="149" y="65.5" font-size="7.5" font-weight="500" fill="#78350f" text-anchor="middle">5.0 ms buildup</text>

    <!-- Downward Orthogonal Arrow from Stator Lag to Coulomb Stiction Block -->
    <path d="M 149 72 L 149 82 L 115 82 L 115 88" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-sharp)"/>

    <!-- Block 3: Coulomb Stiction Barrier -->
    <rect x="24" y="90" width="172" height="42" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="110" y="102.5" font-size="8.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Coulomb Stiction: τ_c = 4.5 N·m</text>
    <line x1="30" y1="107" x2="190" y2="107" stroke="#fca5a5" stroke-width="0.5"/>
    <text x="110" y="117.5" font-size="7.5" font-weight="600" fill="#7f1d1d" text-anchor="middle">t &lt; 6.9 ms: Joint Locked (θ = 0)</text>
    <text x="110" y="126.5" font-size="7.5" fill="#7f1d1d" text-anchor="middle">t ≥ 6.9 ms: Net τ approaches 1.5 N·m</text>

    <!-- Bottom Caption -->
    <text x="110" y="151.5" font-size="7.5" fill="#64748b" text-anchor="middle">SIL assumes τ_c = 0 &amp; instantaneous torque</text>
  </g>

  <!-- Connective link between panels -->
  <line x1="206" y1="90" x2="216" y2="90" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- ==================================================================== -->
  <!-- RIGHT PANEL: SIM-TO-REAL TRAJECTORY DIVERGENCE                       -->
  <!-- ==================================================================== -->
  <g id="panel-divergence">
    <rect x="216" y="16" width="308" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

    <!-- Header -->
    <text x="226" y="32" font-size="9.5" font-weight="700" fill="#1e293b">SIM-TO-REAL TRACKING DIVERGENCE</text>
    
    <!-- Legend Badges -->
    <rect x="408" y="21" width="48" height="15" rx="7.5" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="432" y="31.5" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">SIM (SIL)</text>

    <rect x="460" y="21" width="54" height="15" rx="7.5" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="487" y="31.5" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="middle">REAL (HIL)</text>

    <!-- Shaded Deadband Zone (0 to 6.9 ms -> x=252 to x=283) -->
    <rect x="252" y="46" width="31" height="82" fill="#fee2e2" fill-opacity="0.65"/>
    <line x1="283" y1="46" x2="283" y2="128" stroke="#c44" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Axes -->
    <line x1="252" y1="128" x2="496" y2="128" stroke="#64748b" stroke-width="1" marker-end="url(#arr-axis)"/>
    <line x1="252" y1="128" x2="252" y2="42" stroke="#64748b" stroke-width="1" marker-end="url(#arr-axis)"/>

    <!-- Axis Labels -->
    <text x="248" y="45" font-size="7.5" font-weight="600" fill="#334155" text-anchor="end">θ (°)</text>
    <text x="496" y="124" font-size="7.5" font-weight="600" fill="#334155" text-anchor="end">t (ms)</text>

    <!-- Ticks & Time Values -->
    <line x1="252" y1="128" x2="252" y2="132" stroke="#64748b" stroke-width="1"/>
    <text x="252" y="140" font-size="7.5" fill="#64748b" text-anchor="middle">0</text>

    <line x1="283" y1="128" x2="283" y2="132" stroke="#c44" stroke-width="1"/>
    <text x="283" y="140" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">6.9</text>

    <line x1="364" y1="128" x2="364" y2="132" stroke="#64748b" stroke-width="1"/>
    <text x="364" y="140" font-size="7.5" fill="#64748b" text-anchor="middle">25</text>

    <line x1="476" y1="128" x2="476" y2="132" stroke="#64748b" stroke-width="1"/>
    <text x="476" y="140" font-size="7.5" fill="#64748b" text-anchor="middle">50</text>

    <!-- Deadband Text in Shaded Region -->
    <text x="267.5" y="58" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">t_dead</text>
    <text x="267.5" y="67" font-size="7" font-weight="600" fill="#7f1d1d" text-anchor="middle">6.9 ms</text>
    <text x="267.5" y="78" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="middle">θ = 0</text>
    <text x="267.5" y="93" font-size="6.5" fill="#7f1d1d" text-anchor="middle">No joint</text>
    <text x="267.5" y="101" font-size="6.5" fill="#7f1d1d" text-anchor="middle">motion</text>

    <!-- Curve 1: Simulation SIL (Green smooth parabolic curve) -->
    <path d="M 252 128 Q 364 123, 476 50" fill="none" stroke="#3d9e5a" stroke-width="2"/>
    <circle cx="476" cy="50" r="2.5" fill="#3d9e5a"/>
    <text x="468" y="45" font-size="8" font-weight="700" fill="#14532d" text-anchor="end">θ_sim = 8.6°</text>

    <!-- Curve 2: Real Hardware HIL (Red curve: flat then slow rise) -->
    <path d="M 252 128 L 283 128 Q 380 128, 476 116.5" fill="none" stroke="#c44" stroke-width="2"/>
    <circle cx="476" cy="116.5" r="2.5" fill="#c44"/>
    <text x="450" y="112" font-size="8" font-weight="700" fill="#7f1d1d" text-anchor="end">θ_real = 1.267°</text>

    <!-- Reality Gap Dimension Line & Label -->
    <line x1="476" y1="54" x2="476" y2="112.5" stroke="#7f1d1d" stroke-width="1.2"
          marker-start="url(#arr-dim-top)" marker-end="url(#arr-dim-bot)"/>

    <rect x="336" y="68" width="118" height="25" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="395" y="79" font-size="8" font-weight="700" fill="#7f1d1d" text-anchor="middle">MODELED GAP: Δθ = 7.327°</text>
    <text x="395" y="88.5" font-size="7" fill="#64748b" text-anchor="middle">rising torque after breakaway</text>

    <!-- Post-deadband Breakaway Warning Tag -->
    <text x="375" y="153" font-size="7.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Overshoot requires a specified feedback controller</text>
  </g>
</svg>
