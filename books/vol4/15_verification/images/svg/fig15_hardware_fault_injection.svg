<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.2 10.1 908.4 427.2" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-42.2" y="-11.3" width="999.2" height="469.9" fill="#ffffff"/>
  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" fill="#FFFFFF"/>

  <!-- Milestone Vertical Guide Lines -->
  <line x1="360" y1="56" x2="360" y2="415" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="460" y1="40" x2="460" y2="415" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="540" y1="56" x2="540" y2="415" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="730" y1="56" x2="730" y2="415" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="790" y1="40" x2="790" y2="415" stroke="#FCA5A5" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Milestone Header Labels (Staggered to prevent horizontal crowding) -->
  <text x="360" y="50" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">Fault + Revoke (20 ms)</text>
  <text x="460" y="34" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">Detect (24 ms)</text>
  <text x="540" y="50" font-size="10.5" font-weight="600" fill="#15803D" text-anchor="middle">Drive Check (26 ms)</text>
  <text x="730" y="50" font-size="10.5" font-weight="600" fill="#15803D" text-anchor="middle">Safe (43 ms)</text>
  <text x="790" y="34" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">Deadline (45 ms)</text>

  <!-- ==================================================================== -->
  <!-- TRACK 1: ADC SENSOR                                                  -->
  <!-- ==================================================================== -->
  <g id="track-adc">
    <rect x="20" y="88" width="135" height="28" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="87" y="106" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">ADC Sensor</text>

    <!-- Nominal oscillating sensor signal -->
    <path d="M 175 102 Q 200 96, 225 102 T 275 102 T 325 102 L 360 102" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="360" cy="102" r="3.5" fill="#DC2626"/>
    <!-- Frozen / Latched stall signal -->
    <line x1="360" y1="102" x2="820" y2="102" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <!-- ==================================================================== -->
  <!-- TRACK 2: INTENT LEASE                                                -->
  <!-- ==================================================================== -->
  <g id="track-lease">
    <rect x="20" y="143" width="135" height="28" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
    <text x="87" y="161" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">Intent Lease</text>

    <!-- Valid lease (High) -->
    <line x1="175" y1="150" x2="360" y2="150" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="360" cy="150" r="3.5" fill="#DC2626"/>
    <!-- Step down to expired -->
    <line x1="360" y1="150" x2="360" y2="166" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Expired lease (Low) -->
    <line x1="360" y1="166" x2="820" y2="166" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- ==================================================================== -->
  <!-- TRACK 3: SAFETY NMI                                                  -->
  <!-- ==================================================================== -->
  <g id="track-nmi">
    <rect x="20" y="198" width="135" height="28" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
    <text x="87" y="216" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">Safety NMI</text>

    <!-- Normal (Low) -->
    <line x1="175" y1="221" x2="460" y2="221" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Step up to asserted -->
    <line x1="460" y1="221" x2="460" y2="205" stroke="#DC2626" stroke-width="1.5"/>
    <circle cx="460" cy="205" r="3.5" fill="#DC2626"/>
    <!-- NMI asserted (High) -->
    <line x1="460" y1="205" x2="820" y2="205" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <!-- ==================================================================== -->
  <!-- TRACK 4: GATE MUX                                                    -->
  <!-- ==================================================================== -->
  <g id="track-mux">
    <rect x="20" y="253" width="135" height="28" rx="3" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
    <text x="87" y="271" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">Permission / Drive</text>

    <!-- Nominal proposal path (Low) -->
    <line x1="175" y1="276" x2="360" y2="276" stroke="#2563EB" stroke-width="1.5"/>
    <!-- Lease expiry revokes the proposal path and selects MCU fallback. -->
    <line x1="360" y1="276" x2="360" y2="268" stroke="#D97706" stroke-width="1.5"/>
    <circle cx="360" cy="268" r="3.5" fill="#D97706"/>
    <line x1="360" y1="268" x2="540" y2="268" stroke="#D97706" stroke-width="1.5"/>
    <!-- The later NMI confirms the independent drive override. -->
    <line x1="540" y1="268" x2="540" y2="260" stroke="#15803D" stroke-width="1.5"/>
    <circle cx="540" cy="260" r="3.5" fill="#15803D"/>
    <!-- Safety takeover path (High) -->
    <line x1="540" y1="260" x2="820" y2="260" stroke="#15803D" stroke-width="1.5"/>
  </g>

  <!-- ==================================================================== -->
  <!-- TRACK 5: MANIFOLD PRESSURE                                           -->
  <!-- ==================================================================== -->
  <g id="track-pressure">
    <rect x="20" y="325" width="135" height="28" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
    <text x="87" y="343" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">Manifold Pressure</text>

    <!-- Containment limit reference line -->
    <line x1="175" y1="295" x2="820" y2="295" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="825" y="299" font-size="10" font-weight="600" fill="#DC2626">16.5 bar (Limit)</text>

    <!-- Nominal pressure baseline -->
    <line x1="175" y1="375" x2="360" y2="375" stroke="#334155" stroke-width="1.5"/>

    <!-- Peak Annotation above curve -->
    <text x="560" y="316" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">16.2 bar (Illustrative Peak)</text>

    <!-- Pressure surge curve up to peak -->
    <path d="M 360 375 C 390 375, 510 325, 560 325" fill="none" stroke="#2563EB" stroke-width="2"/>
    <circle cx="560" cy="325" r="3.5" fill="#2563EB"/>

    <!-- Recovery curve to safe bounded rest -->
    <path d="M 560 325 C 610 325, 670 375, 730 375" fill="none" stroke="#2563EB" stroke-width="2"/>
    <line x1="730" y1="375" x2="820" y2="375" stroke="#15803D" stroke-width="1.5"/>
    <circle cx="730" cy="375" r="3.5" fill="#15803D"/>
  </g>

  <!-- ==================================================================== -->
  <!-- TIME AXIS                                                            -->
  <!-- ==================================================================== -->
  <line x1="175" y1="415" x2="820" y2="415" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="828" y="419" font-size="11" font-weight="700" fill="#334155">Time (ms)</text>

  <!-- Axis tick marks -->
  <line x1="175" y1="415" x2="175" y2="420" stroke="#334155" stroke-width="1.2"/>
  <line x1="360" y1="415" x2="360" y2="420" stroke="#334155" stroke-width="1.2"/>
  <line x1="460" y1="415" x2="460" y2="420" stroke="#334155" stroke-width="1.2"/>
  <line x1="540" y1="415" x2="540" y2="420" stroke="#334155" stroke-width="1.2"/>
  <line x1="730" y1="415" x2="730" y2="420" stroke="#334155" stroke-width="1.2"/>
  <line x1="790" y1="415" x2="790" y2="420" stroke="#DC2626" stroke-width="1.2"/>
</svg>
