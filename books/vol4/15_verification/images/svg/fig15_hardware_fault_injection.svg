<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <style>
      .trace-name { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .trace-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #64748b; }
      .time-label { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; font-weight: 600; fill: #475569; }
      .time-label-red { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #dc2626; }
      .time-label-blue { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #2563eb; }
      .sig-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .sig-label-bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; }
      .delta-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-style: italic; fill: #334155; }
      .legend-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="0.75"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="620" fill="#ffffff"/>
  <rect width="1000" height="620" fill="url(#grid)"/>
  <g transform="translate(0, -35)">

  <!-- Timeline Vertical Reference Lines -->
  <g stroke-width="1.2">
    <line x1="200" y1="75" x2="200" y2="595" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="480" y1="75" x2="480" y2="595" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="536" y1="75" x2="536" y2="595" stroke="#dc2626" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="564" y1="75" x2="564" y2="595" stroke="#2563eb" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="799.2" y1="75" x2="799.2" y2="595" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <line x1="830" y1="75" x2="830" y2="595" stroke="#dc2626" stroke-dasharray="4,4" opacity="0.8"/>
  </g>

  <!-- Time Labels -->
  <text x="200" y="68" class="time-label" text-anchor="middle">t0=0.0</text>
  <text x="480" y="68" class="time-label" text-anchor="middle">t1=20.0</text>
  <text x="536" y="55" class="time-label-red" text-anchor="middle">t2=24.0</text>
  <text x="564" y="68" class="time-label-blue" text-anchor="middle">t3=26.0</text>
  <text x="799" y="68" class="time-label" text-anchor="middle">t4=42.8</text>
  <text x="830" y="55" class="time-label-red" text-anchor="middle">t_limit=45.0</text>

  <!-- TRACE 1: ADC Register -->
  <text x="40" y="115" class="trace-name">ADC Register</text>
  <text x="40" y="130" class="trace-sub">Sensor Output</text>
  <path d="M 120 140 L 195 140 L 200 120 L 920 120" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="155" y="134" class="sig-label" text-anchor="middle">Dynamic</text>
  <circle cx="200" cy="120" r="4" fill="#dc2626"/>
  <text x="210" y="115" class="sig-label-bold" fill="#dc2626">Latched (Stall Injected) @ 4.2 kg/s</text>

  <!-- TRACE 2: Intent Lease -->
  <text x="40" y="185" class="trace-name">Intent Lease</text>
  <text x="40" y="200" class="trace-sub">MPU Authority</text>
  <path d="M 120 180 L 480 180 L 480 210 L 920 210" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="174" class="sig-label-bold" fill="#2563eb" text-anchor="middle">Valid (High)</text>
  <circle cx="480" cy="180" r="4" fill="#dc2626"/>
  <!-- Relocated to x=580 to clear t2/t3 vertical lines completely -->
  <text x="580" y="204" class="sig-label">Expired (Low)</text>

  <!-- Delta t_det -->
  <line x1="480" y1="230" x2="536" y2="230" stroke="#334155" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="508" y="224" class="delta-label" text-anchor="middle">Δt_det = 4.0 ms</text>

  <!-- TRACE 3: Diagnostic Monitor (MCU NMI) -->
  <text x="40" y="255" class="trace-name">MCU NMI</text>
  <text x="40" y="270" class="trace-sub">Stale Detection</text>
  <path d="M 120 280 L 536 280 L 536 250 L 920 250" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="155" y="274" class="sig-label" text-anchor="middle">Low</text>
  <!-- Relocated to x=580 to clear t3 vertical line completely -->
  <text x="580" y="244" class="sig-label-bold" fill="#dc2626">NMI Asserted</text>

  <!-- Delta t_takeover -->
  <line x1="536" y1="305" x2="564" y2="305" stroke="#334155" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="550" y="299" class="delta-label" text-anchor="middle">Δt_tk = 2.0 ms</text>

  <!-- TRACE 4: Gate Driver Mux -->
  <text x="40" y="325" class="trace-name">HW Mux</text>
  <text x="40" y="340" class="trace-sub">Gate Drivers</text>
  <path d="M 120 350 L 564 350 L 564 320 L 920 320" fill="none" stroke="#2563eb" stroke-width="2"/>
  <!-- Centered at x=155, completely clear of x=200 -->
  <text x="155" y="344" class="sig-label" text-anchor="middle">MPU Proposal</text>
  <text x="580" y="314" class="sig-label-bold" fill="#2563eb">Preempted (Safety Mode)</text>

  <!-- TRACE 5: Motor Current -->
  <text x="40" y="395" class="trace-name">Motor Current</text>
  <text x="40" y="410" class="trace-sub">I_phase (A)</text>
  <path d="M 120 400 L 250 395 L 350 405 L 564 400 L 564 450 L 700 450 L 799.2 410 L 920 410" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- Centered at x=155, completely clear of x=200 -->
  <text x="155" y="389" class="sig-label" text-anchor="middle">Nominal Load</text>
  <text x="580" y="444" class="sig-label-bold" fill="#dc2626">Regen Braking (-12.0 A)</text>

  <!-- TRACE 6: Manifold Pressure -->
  <text x="40" y="495" class="trace-name">Manifold Pres.</text>
  <text x="40" y="510" class="trace-sub">P(t) (bar)</text>

  <!-- Limits with protective background badges -->
  <line x1="120" y1="470" x2="920" y2="470" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="765" y="457" width="155" height="18" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="842" y="470" class="sig-label-bold" fill="#b91c1c" text-anchor="middle">22.0 bar (Burst Limit)</text>

  <line x1="120" y1="490" x2="920" y2="490" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="765" y="479" width="155" height="18" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="842" y="492" class="sig-label" fill="#dc2626" font-weight="600" text-anchor="middle">16.5 bar (Containment)</text>

  <!-- Pressure Waveform -->
  <path d="M 120 510 L 200 510 L 564 499.5 L 585 499 L 799.2 555 L 920 555" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Pressure Annotations -->
  <text x="350" y="525" class="sig-label" fill="#2563eb">Surge @ 80.0 bar/s</text>
  <line x1="330" y1="505" x2="500" y2="500" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Peak Pressure Badge -->
  <circle cx="585" cy="499" r="4" fill="#dc2626"/>
  <rect x="592" y="484" width="94" height="20" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="639" y="498" class="sig-label-bold" fill="#dc2626" text-anchor="middle">Peak: 16.2 bar</text>

  <!-- Safe State Badge -->
  <circle cx="799.2" cy="555" r="4" fill="#2563eb"/>
  <rect x="808" y="545" width="128" height="20" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="872" y="559" class="sig-label-bold" fill="#1e40af" text-anchor="middle">Safe State (Bounded)</text>

  <!-- Deadline Margin Arrow -->
  <line x1="799.2" y1="580" x2="830" y2="580" stroke="#334155" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="814.6" y="593" class="delta-label" text-anchor="middle">Safe margin</text>

  <!-- Legend Card -->
  <g transform="translate(40, 608)">
    <rect width="920" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="20" font-family="'Inter', system-ui, sans-serif" font-size="11px" font-weight="700" fill="#0f172a">LEGEND:</text>

    <line x1="85" y1="16" x2="115" y2="16" stroke="#dc2626" stroke-width="2"/>
    <text x="122" y="20" class="legend-text">Fault / Safety NMI</text>

    <line x1="260" y1="16" x2="290" y2="16" stroke="#2563eb" stroke-width="2"/>
    <text x="297" y="20" class="legend-text">Controller Authority / Pressure</text>

    <line x1="510" y1="16" x2="540" y2="16" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="547" y="20" class="legend-text">Containment Limits</text>
  </g>
  </g>
</svg>
