<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-sharp" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#c44"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#3d9e5a"/>
    </marker>
  </defs>

  <!-- Outer Card Canvas -->
  <rect width="540" height="180" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================================================================== -->
  <!-- SUB-CARD 1: FIELDBUS FAULT INJECTION                                 -->
  <!-- ==================================================================== -->
  <g id="card-bus-injection">
    <rect x="16" y="16" width="160" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    
    <!-- Title -->
    <text x="24" y="31" font-size="9" font-weight="700" fill="#1e293b">1. FIELDBUS INJECTION</text>
    
    <!-- Badge and Disturbance -->
    <rect x="24" y="37" width="58" height="13" rx="6.5" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75"/>
    <text x="53" y="46.5" font-size="6.5" font-weight="700" fill="#581c87" text-anchor="middle">TSN ETHERNET</text>
    <text x="88" y="47" font-size="7" font-weight="600" fill="#7f1d1d">Babbling Idiot</text>

    <!-- PTP Sync Packet Sequence (100 ms cadence) -->
    <!-- Packet 0: Valid Sync -->
    <rect x="24" y="55" width="24" height="23" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="36" y="65" font-size="6" font-weight="700" fill="#14532d" text-anchor="middle">PTP 0</text>
    <text x="36" y="74" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">✓</text>

    <!-- Packet 1: Dropped -->
    <rect x="53" y="55" width="24" height="23" rx="2" fill="#fee2e2" stroke="#c44" stroke-width="0.75" stroke-dasharray="2,2"/>
    <text x="65" y="65" font-size="6" font-weight="700" fill="#7f1d1d" text-anchor="middle">PTP 1</text>
    <text x="65" y="74" font-size="7" font-weight="700" fill="#c44" text-anchor="middle">✕</text>

    <!-- Packet 2: Dropped -->
    <rect x="82" y="55" width="24" height="23" rx="2" fill="#fee2e2" stroke="#c44" stroke-width="0.75" stroke-dasharray="2,2"/>
    <text x="94" y="65" font-size="6" font-weight="700" fill="#7f1d1d" text-anchor="middle">PTP 2</text>
    <text x="94" y="74" font-size="7" font-weight="700" fill="#c44" text-anchor="middle">✕</text>

    <!-- Packet 3: Dropped -->
    <rect x="111" y="55" width="24" height="23" rx="2" fill="#fee2e2" stroke="#c44" stroke-width="0.75" stroke-dasharray="2,2"/>
    <text x="123" y="65" font-size="6" font-weight="700" fill="#7f1d1d" text-anchor="middle">PTP 3</text>
    <text x="123" y="74" font-size="7" font-weight="700" fill="#c44" text-anchor="middle">✕</text>

    <!-- Packet 4: Restored -->
    <rect x="140" y="55" width="24" height="23" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="152" y="65" font-size="6" font-weight="700" fill="#14532d" text-anchor="middle">PTP 4</text>
    <text x="152" y="74" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">✓</text>

    <!-- Bracket across dropped window -->
    <path d="M 24 83 L 24 87 L 94 87 L 94 91 L 94 87 L 164 87 L 164 83" stroke="#7f1d1d" stroke-width="1" fill="none"/>
    <text x="94" y="102" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">ΔT_blackout = 400 ms</text>
    <text x="94" y="113" font-size="6.5" fill="#64748b" text-anchor="middle">3 consecutive frames dropped</text>

    <!-- Bottom summary -->
    <text x="96" y="148" font-size="7.5" fill="#64748b" text-anchor="middle">Open-loop oscillator drift window</text>
  </g>

  <!-- Orthogonal connector to card 2 -->
  <line x1="176" y1="90" x2="184" y2="90" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-sharp)"/>

  <!-- ==================================================================== -->
  <!-- SUB-CARD 2: SILICON CLOCK SKEW BUDGET                                -->
  <!-- ==================================================================== -->
  <g id="card-skew-budget">
    <rect x="184" y="16" width="164" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    
    <!-- Title -->
    <text x="192" y="31" font-size="9" font-weight="700" fill="#1e293b">2. SILICON CLOCK SKEW</text>

    <!-- Skew breakdown text -->
    <text x="192" y="45" font-size="7" font-weight="600" fill="#334155">δ_skew = 200 ppm (0.200 μs/ms)</text>
    <text x="192" y="55" font-size="6.5" fill="#64748b">Drift: 200 ppm × 0.40 s = 80.0 μs</text>
    <text x="192" y="65" font-size="6.5" fill="#64748b">Jitter: σ_jitter = 15.0 μs</text>
    <text x="192" y="77" font-size="7.5" font-weight="700" fill="#7f1d1d">Peak Skew: Δt_peak = 95.0 μs</text>

    <!-- Synchrony Budget Bar (100 μs full width = 146px from x=192 to x=338) -->
    <!-- Base bar -->
    <rect x="192" y="85" width="146" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.75"/>

    <!-- Segment 1: Drift (80 μs -> 116.8px) -->
    <rect x="192" y="85" width="116.8" height="22" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="250" y="99" font-size="7" font-weight="700" fill="#78350f" text-anchor="middle">Drift: 80 μs</text>

    <!-- Segment 2: Jitter (15 μs -> 21.9px) -->
    <rect x="308.8" y="85" width="21.9" height="22" fill="#fed7aa" stroke="#ea580c" stroke-width="0.75"/>
    <text x="320" y="99" font-size="6" font-weight="700" fill="#9a3412" text-anchor="middle">15</text>

    <!-- Segment 3: Margin (5 μs -> 7.3px) -->
    <rect x="330.7" y="85" width="7.3" height="22" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>

    <!-- Deadline Line at 100 μs (x = 338) -->
    <line x1="338" y1="80" x2="338" y2="113" stroke="#c44" stroke-width="1.5"/>
    <text x="338" y="76" font-size="6.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">100 μs Limit</text>

    <!-- Budget bar status labels -->
    <text x="192" y="118" font-size="7" font-weight="700" fill="#7f1d1d">95% Consumed</text>
    <text x="338" y="118" font-size="7" font-weight="700" fill="#14532d" text-anchor="end">Margin: 5 μs</text>

    <!-- Bottom Warning -->
    <text x="266" y="148" font-size="7" font-weight="600" fill="#b91c1c" text-anchor="middle">+1 drop (500 ms) → 115 μs (BREACH)</text>
  </g>

  <!-- Orthogonal connector to card 3 -->
  <line x1="348" y1="90" x2="356" y2="90" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-sharp)"/>

  <!-- ==================================================================== -->
  <!-- SUB-CARD 3: PHYSICAL DYNAMIC MANIFESTATION                           -->
  <!-- ==================================================================== -->
  <g id="card-physical-divergence">
    <rect x="356" y="16" width="168" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    
    <!-- Title -->
    <text x="364" y="31" font-size="9" font-weight="700" fill="#1e293b">3. ASYMMETRIC BRAKING</text>

    <!-- Physical Caliper Diagram -->
    <!-- Axle bar -->
    <line x1="376" y1="64" x2="504" y2="64" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="440" cy="64" r="3.5" fill="#334155"/>

    <!-- Left Caliper (Clamping on time) -->
    <rect x="372" y="52" width="22" height="24" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/>
    <text x="383" y="47" font-size="6.5" font-weight="700" fill="#14532d" text-anchor="middle">FL Caliper</text>
    
    <!-- Braking Force Vector (Down) -->
    <line x1="383" y1="76" x2="383" y2="98" stroke="#3d9e5a" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <text x="383" y="110" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">F_L = F_max</text>

    <!-- Right Caliper (Delayed by 95 μs) -->
    <rect x="486" y="52" width="22" height="24" rx="2" fill="#fee2e2" stroke="#c44" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="497" y="47" font-size="6.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">FR Caliper</text>
    <text x="497" y="88" font-size="6.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Δt = 95 μs</text>
    <text x="497" y="98" font-size="6" fill="#7f1d1d" text-anchor="middle">LAGGING</text>
    <text x="497" y="110" font-size="7.5" font-weight="700" fill="#64748b" text-anchor="middle">F_R ≈ 0</text>

    <!-- Yaw Moment Arc Arrow (Curved above pivot with clearance) -->
    <path d="M 454 53 A 14 14 0 0 0 426 53" fill="none" stroke="#c44" stroke-width="2" marker-end="url(#arr-red)"/>
    <text x="440" y="82" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="middle">τ_yaw = ΔF · (w/2)</text>

    <!-- Bottom Failure Mode Summary -->
    <text x="440" y="132" font-size="7" font-weight="600" fill="#7f1d1d" text-anchor="middle">Differential Braking Force ΔF</text>
    <text x="440" y="148" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">⚠ Destabilizing Vehicle Yaw Spin</text>
  </g>
</svg>
