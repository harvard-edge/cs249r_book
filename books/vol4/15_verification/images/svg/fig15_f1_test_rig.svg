<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arr-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#007A87"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#ffffff"/>

  <!-- machine under test frame -->
  <rect x="14" y="16" width="410" height="410" rx="4" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="26" y="34" font-size="10.5" font-weight="bold" fill="#1A202C">machine under test</text>

  <!-- witness frame -->
  <rect x="440" y="16" width="226" height="410" rx="4" fill="#ffffff" stroke="#007A87" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="452" y="34" font-size="10.5" font-weight="bold" fill="#007A87">independent witnesses</text>
  <text x="452" y="47" font-size="8" fill="#4A5568">own clock, own supply</text>

  <!-- power rail (vertical) -->
  <path d="M30 80 V282" fill="none" stroke="#4A5568" stroke-width="1.6"/>
  <path d="M30 80 H45 M30 182 H45 M30 282 H45" fill="none" stroke="#4A5568" stroke-width="1.6"/>

  <!-- power column -->
  <rect x="45" y="58" width="100" height="44" rx="0" fill="#ffffff" stroke="#4A5568" stroke-width="1.2"/>
  <text x="95" y="76" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">converter</text>
  <text x="95" y="90" font-size="8" fill="#4A5568" text-anchor="middle">lockout 33 V</text>

  <rect x="45" y="160" width="100" height="44" rx="0" fill="#ffffff" stroke="#4A5568" stroke-width="1.2"/>
  <text x="95" y="178" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">isolated converter</text>
  <text x="95" y="192" font-size="8" fill="#4A5568" text-anchor="middle">held-up rail, 2.0 s</text>
  <text x="95" y="220" font-size="8" fill="#A51C30" text-anchor="middle">feed opened: 1,313 ms</text>
  <text x="95" y="232" font-size="8" fill="#A51C30" text-anchor="middle">flag to brakes set</text>

  <rect x="45" y="260" width="100" height="44" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="95" y="278" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">drive bus, 47.7 V</text>
  <text x="95" y="292" font-size="8" fill="#4A5568" text-anchor="middle">pack or test supply</text>
  <text x="95" y="320" font-size="8" fill="#A51C30" text-anchor="middle">sag to 37.8 V,</text>
  <text x="95" y="332" font-size="8" fill="#A51C30" text-anchor="middle">4.8 V above lockout;</text>
  <text x="95" y="344" font-size="8" fill="#A51C30" text-anchor="middle">150 A step to cross</text>

  <!-- power feeds -->
  <path d="M145 80 H188" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#arr-soft)"/>
  <path d="M145 182 H188" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#arr-soft)"/>
  <path d="M145 282 H188" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#arr-soft)"/>

  <!-- signal column -->
  <rect x="190" y="56" width="120" height="48" rx="3" fill="#FBF3EC" stroke="#B87333" stroke-width="1.4"/>
  <text x="250" y="76" font-size="9.5" font-weight="bold" fill="#1A202C" text-anchor="middle">application SoC</text>
  <text x="250" y="91" font-size="8" fill="#4A5568" text-anchor="middle">chunk policy</text>

  <rect x="190" y="158" width="120" height="48" rx="3" fill="#EEF4F1" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="250" y="178" font-size="9.5" font-weight="bold" fill="#1A202C" text-anchor="middle">safety MCU</text>
  <text x="250" y="193" font-size="8" fill="#4A5568" text-anchor="middle">permission path, 1 kHz</text>

  <rect x="190" y="260" width="120" height="44" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="250" y="279" font-size="9.5" font-weight="bold" fill="#1A202C" text-anchor="middle">base drives</text>
  <text x="250" y="293" font-size="8" fill="#4A5568" text-anchor="middle">STO inputs</text>

  <rect x="190" y="346" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="250" y="364" font-size="9.5" font-weight="bold" fill="#1A202C" text-anchor="middle">loaded base</text>
  <text x="250" y="378" font-size="8" fill="#4A5568" text-anchor="middle">test floor, rack end</text>

  <rect x="344" y="58" width="66" height="44" rx="0" fill="#ffffff" stroke="#007A87" stroke-width="1.2"/>
  <text x="377" y="84" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">camera</text>

  <!-- signal flow -->
  <path d="M344 80 H312" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <path d="M250 104 V156" fill="none" stroke="#B87333" stroke-width="1.4" stroke-dasharray="4" marker-end="url(#arr-ink)"/>
  <text x="258" y="126" font-size="8" fill="#4A5568">board link</text>
  <text x="258" y="137" font-size="8" fill="#4A5568">(proposals)</text>
  <path d="M250 206 V258" fill="none" stroke="#1A4D3E" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <text x="258" y="228" font-size="8" fill="#4A5568">fieldbus</text>
  <path d="M250 304 V344" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <text x="258" y="328" font-size="8" fill="#4A5568">torque</text>

  <!-- fault injection badges -->
  <g font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="190" cy="56" r="10" fill="#A51C30"/><text x="190" y="59">F1</text>
    <circle cx="328" cy="62" r="10" fill="#A51C30"/><text x="328" y="65">F2</text>
    <circle cx="232" cy="232" r="10" fill="#A51C30"/><text x="232" y="235">F3</text>
    <circle cx="145" cy="260" r="11" fill="#A51C30"/><text x="145" y="263">F4a</text>
    <circle cx="145" cy="160" r="11" fill="#A51C30"/><text x="145" y="163">F4b</text>
  </g>

  <!-- witness instruments -->
  <g font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">
    <rect x="455" y="62" width="196" height="38" rx="3" fill="#EFF8F9" stroke="#007A87" stroke-width="1.2"/>
    <text x="553" y="78">reference clock</text>
    <rect x="455" y="163" width="196" height="38" rx="3" fill="#ffffff" stroke="#007A87" stroke-width="1.2"/>
    <text x="553" y="179">logic analyzer</text>
    <rect x="455" y="214" width="196" height="38" rx="3" fill="#ffffff" stroke="#007A87" stroke-width="1.2"/>
    <text x="553" y="230">fieldbus sniffer</text>
    <rect x="455" y="263" width="196" height="38" rx="3" fill="#ffffff" stroke="#007A87" stroke-width="1.2"/>
    <text x="553" y="279">current probes</text>
    <rect x="455" y="344" width="196" height="38" rx="3" fill="#ffffff" stroke="#007A87" stroke-width="1.2"/>
    <text x="553" y="360">encoders, high-speed camera</text>
    <rect x="455" y="392" width="196" height="28" rx="3" fill="#ffffff" stroke="#007A87" stroke-width="1.2"/>
    <text x="553" y="410">rail digitizer</text>
  </g>
  <g font-size="8" fill="#4A5568" text-anchor="middle">
    <text x="553" y="92">trigger line stamps each injection</text>
    <text x="553" y="193">lease expiry, stop command</text>
    <text x="553" y="244">frame loss and timing</text>
    <text x="553" y="293">powered deceleration onset</text>
    <text x="553" y="374">position to standstill</text>
  </g>

  <!-- taps -->
  <g fill="none" stroke="#007A87" stroke-width="1.1" stroke-dasharray="3,3">
    <path d="M310 182 H453" marker-end="url(#arr-petrol)"/>
    <path d="M250 245 H390 V233 H453" marker-end="url(#arr-petrol)"/>
    <path d="M310 282 H453" marker-end="url(#arr-petrol)"/>
    <path d="M310 364 H453" marker-end="url(#arr-petrol)"/>
    <path d="M30 282 V406 H453" marker-end="url(#arr-petrol)"/>
  </g>
  <path d="M651 81 H659 V406 H651 M659 182 H651 M659 233 H651 M659 282 H651 M659 363 H651" fill="none" stroke="#007A87" stroke-width="1.1"/>
</svg>
