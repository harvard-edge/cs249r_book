<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-step" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Coordinate Projection Lines -->
  <!-- Horizontal projection lines to Y-axis -->
  <line x1="130" y1="110" x2="165" y2="110" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="130" y1="190" x2="335" y2="190" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="130" y1="270" x2="505" y2="270" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="130" y1="350" x2="675" y2="350" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Vertical projection lines to X-axis -->
  <line x1="240" y1="140" x2="240" y2="420" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="410" y1="220" x2="410" y2="420" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="580" y1="300" x2="580" y2="420" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="750" y1="380" x2="750" y2="420" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Diagonal Transition Arrows between Stages -->
  <line x1="315" y1="140" x2="332" y2="165" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-step)"/>
  <line x1="485" y1="220" x2="502" y2="245" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-step)"/>
  <line x1="655" y1="300" x2="672" y2="325" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-step)"/>

  <!-- Axes -->
  <!-- Y-axis: Throughput -->
  <line x1="130" y1="420" x2="130" y2="60" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="80" y="240" font-size="12" font-weight="700" fill="#334155" transform="rotate(-90 80 240)" text-anchor="middle">Throughput (runs/day)</text>

  <!-- Y-axis Ticks -->
  <line x1="124" y1="110" x2="130" y2="110" stroke="#334155" stroke-width="1.2"/>
  <text x="118" y="114" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">10⁶</text>

  <line x1="124" y1="190" x2="130" y2="190" stroke="#334155" stroke-width="1.2"/>
  <text x="118" y="194" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">10⁴</text>

  <line x1="124" y1="270" x2="130" y2="270" stroke="#334155" stroke-width="1.2"/>
  <text x="118" y="274" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">10²</text>

  <line x1="124" y1="350" x2="130" y2="350" stroke="#334155" stroke-width="1.2"/>
  <text x="118" y="354" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">10⁰</text>

  <!-- X-axis: Hardware Fidelity -->
  <line x1="130" y1="420" x2="855" y2="420" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="495" y="460" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Hardware Fidelity (%)</text>

  <!-- X-axis Ticks aligned with stage projections -->
  <line x1="240" y1="420" x2="240" y2="426" stroke="#334155" stroke-width="1.2"/>
  <text x="240" y="440" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">0%</text>

  <line x1="750" y1="420" x2="750" y2="426" stroke="#334155" stroke-width="1.2"/>
  <text x="750" y="440" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">100%</text>

  <!-- ==================================================================== -->
  <!-- STAGE CAPSULES                                                       -->
  <!-- ==================================================================== -->

  <!-- Stage 1: SIL -->
  <g id="stage-sil" transform="translate(165, 80)">
    <rect width="150" height="60" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="75" y="22" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">SIL</text>
    <text x="75" y="38" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">Software-in-the-Loop</text>
    <text x="75" y="51" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">Cloud Cluster</text>
  </g>

  <!-- Stage 2: PIL -->
  <g id="stage-pil" transform="translate(335, 160)">
    <rect width="150" height="60" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="75" y="22" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">PIL</text>
    <text x="75" y="38" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">Processor-in-the-Loop</text>
    <text x="75" y="51" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">Target Silicon</text>
  </g>

  <!-- Stage 3: HIL -->
  <g id="stage-hil" transform="translate(505, 240)">
    <rect width="150" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="75" y="22" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">HIL</text>
    <text x="75" y="38" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">Hardware-in-the-Loop</text>
    <text x="75" y="51" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">Dyno Testbed</text>
  </g>

  <!-- Stage 4: In-Situ -->
  <g id="stage-insitu" transform="translate(675, 320)">
    <rect width="150" height="60" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="75" y="22" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">In-Situ</text>
    <text x="75" y="38" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">Physical Fault Rig</text>
    <text x="75" y="51" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">Field Plant</text>
  </g>
</svg>
