<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <style>
      .axis-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #334155; }
      .axis-tick { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #64748b; }
      .stage-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .stage-name { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; }
      .stage-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10.5px; }
      .spot-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #1e40af; }
      .spot-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #334155; }
      .note-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-style: italic; fill: #475569; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="0.75"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="620" fill="#ffffff"/>
  <rect width="1000" height="620" fill="url(#grid)"/>
  <g transform="translate(0, -45)">

  <!-- Axes -->
  <!-- X-axis: Hardware Fidelity -->
  <line x1="230" y1="570" x2="955" y2="570" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="592" y="602" class="axis-title" text-anchor="middle">Hardware &amp; Physical Fidelity (%)</text>
  <text x="240" y="588" class="axis-tick">0%</text>
  <text x="930" y="588" class="axis-tick">100%</text>

  <!-- Y-axis: Throughput -->
  <line x1="230" y1="570" x2="230" y2="95" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="-332" y="150" class="axis-title" transform="rotate(-90)" text-anchor="middle">Throughput (runs / day)</text>
  <text x="215" y="550" class="axis-tick" text-anchor="end">10⁰</text>
  <text x="215" y="430" class="axis-tick" text-anchor="end">10²</text>
  <text x="215" y="310" class="axis-tick" text-anchor="end">10⁴</text>
  <text x="215" y="190" class="axis-tick" text-anchor="end">10⁶</text>

  <!-- Connecting dashed ladder lines -->
  <line x1="340" y1="212" x2="400" y2="265" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <line x1="495" y1="327" x2="550" y2="380" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <line x1="655" y1="442" x2="700" y2="495" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Stage 1: SIL -->
  <g transform="translate(250, 140)">
    <rect width="180" height="72" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="14" y="24" class="stage-title" fill="#1e3a8a">1. SIL</text>
    <text x="14" y="44" class="stage-name" fill="#0f172a">Software-in-the-Loop</text>
    <text x="14" y="61" class="stage-desc" fill="#475569">ODE Dynamics, Param Sweeps</text>
  </g>

  <!-- Blind Spot 1: SIL -->
  <g transform="translate(470, 146)">
    <rect width="365" height="58" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="14" y="22" class="spot-title">SIL Blind Spots:</text>
    <text x="14" y="42" class="spot-desc">Abstracts clock drift, target silicon timing, &amp; DMA lockups.</text>
  </g>

  <!-- Stage 2: PIL -->
  <g transform="translate(400, 255)">
    <rect width="195" height="72" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="14" y="24" class="stage-title" fill="#1e3a8a">2. PIL</text>
    <text x="14" y="44" class="stage-name" fill="#0f172a">Processor-in-the-Loop</text>
    <text x="14" y="61" class="stage-desc" fill="#475569">Target SoC, Interrupt Latency</text>
  </g>

  <!-- Blind Spot 2: PIL -->
  <g transform="translate(635, 261)">
    <rect width="320" height="58" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="14" y="22" class="spot-title">PIL Blind Spots:</text>
    <text x="14" y="42" class="spot-desc">Ignores real bus contention &amp; electrical noise.</text>
  </g>

  <!-- Blind Spot 3: HIL (Placed to the left of HIL for visual balance) -->
  <g transform="translate(245, 376)">
    <rect width="285" height="58" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="14" y="22" class="spot-title">HIL Blind Spots:</text>
    <text x="14" y="42" class="spot-desc">Synthesized plant cannot wear or break structurally.</text>
  </g>

  <!-- Stage 3: HIL -->
  <g transform="translate(550, 370)">
    <rect width="210" height="72" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="14" y="24" class="stage-title" fill="#1e3a8a">3. HIL</text>
    <text x="14" y="44" class="stage-name" fill="#0f172a">Hardware-in-the-Loop</text>
    <text x="14" y="61" class="stage-desc" fill="#475569">Power Rail Droop, Motor Back-EMF</text>
  </g>

  <!-- Stage 4: In-Situ -->
  <g transform="translate(700, 485)">
    <rect width="220" height="72" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <text x="14" y="24" class="stage-title" fill="#ffffff">4. In-Situ</text>
    <text x="14" y="44" class="stage-name" fill="#ffffff">Physical Fault Injection</text>
    <text x="14" y="61" class="stage-desc" fill="#fecaca">Destructive Water Hammer, Jams</text>
  </g>

  <!-- Bottom Note Card -->
  <g transform="translate(240, 618)">
    <rect width="715" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="16" class="note-text">Note: Each stage establishes evidence only within its own causal loop, revealing entirely different fault classes.</text>
  </g>
  </g>
</svg>
