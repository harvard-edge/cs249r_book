    - Digital twin delusion
    - Probe effect
  claims:
    Operating envelope and coupled corners: A protective claim holds only over a declared operating envelope that
      couples the external ODD with internal execution state (load, bus voltage, saturation, temperature), and its
      danger lives at the coupled corners, not the nominal center.
    Precommitted oracle: A fault trial counts as evidence only against an oracle fixed before the run that returns
      signed margins, scored from the event the fault disrupts rather than from the start of the trial.
    Fault-list derivation: Faults come from inverting each recorded design guarantee at its handoff and from working
      forward from the physical machine, each built as a five-element chain from cause to violated claim.
    Transduction and proposer attacks: A transduction attack delivers a checksum-valid packet whose measurement
      is false, so packet integrity is never an oracle for perception, and a wrong action inside the envelope after
      prompt injection or a patch is a coverage deficit, never a pass.
    Qualification ladder: Software-, processor-, and hardware-in-the-loop rigs and the physical fault rig each make
      a different part of the loop real while throughput falls by orders of magnitude, so a mechanism can fail only
      on a rung that contains it.
    Falsification by signed robustness: Signed temporal-logic robustness turns testing into an optimization that
      searches for the smallest margin, and a simulated margin counts only after its sim-to-real transfer discount.
    Rare-event rates and tails: Failure probability cannot be read from falsification runs or naive Monte Carlo,
      so rates need importance sampling with a tuned proposal and tail magnitudes need weighted extreme value fits.
    Fault-record set: Each fault record binds a signed header (trial, claim, envelope point, injection, oracle digest,
      latencies, margins, verdict) to the independently retained trace, carrying evidence and its gaps to release.
    Four verdicts and independent witnesses: Every trial returns pass, fail, invalid, or unobservable, unmeasured
      fields are recorded as unavailable rather than zero, and an independent witness keeps a pass from resting
      on the system under test.
    Extreme value theory: Extreme value theory fits the distribution of block maxima or threshold exceedances, so
      a tail estimate needs many independent extremes and a justified tail family.
    Importance-sampling weight diagnostic: Kish's effective sample size of the importance weights and a tail-coverage
      check reveal when a few heavy weights carry the estimate.
    Digital twin delusion: A simulator never compared with a measured stop of this machine is a model, not a twin,
      and earns no evidential weight.
    Probe effect: Timing the enforcer with on-target logging changes its timing, so verification uses non-intrusive
      hardware trace.
