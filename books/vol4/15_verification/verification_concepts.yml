  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.verification.fault
      label: Fault injection
      teaches: Fault-list derivation
      summary: A deliberate disturbance at a specified interface used to challenge a declared protection
        claim.
      section: sec-verification-fault-injection
    - id: vol4.verification.envelope
      label: Operating envelope
      teaches: Operating envelope and coupled corners
      summary: The coupled external conditions and internal compute, power, thermal, and actuation states
        over which a claim is qualified.
      section: sec-verification-operating-envelope
    - id: vol4.verification.oracle
      label: Test oracle
      teaches: Precommitted oracle
      summary: A criterion fixed before a trial that distinguishes a valid pass, failure, or invalid test
        against the stated claim.
      section: sec-verification-oracles-acceptance
    relationships:
    - id: vol4.field.verification-envelope--deployment-odd
      source: vol4.verification.envelope
      predicate: extends
      target: vol4.deployment.odd
      explanation: The operating envelope adds the machine's internal execution, power, and thermal state
        to external operating conditions.
      conditions: Qualification must include coupled corners; independent sweeps of external conditions
        or single internal parameters can miss failures.
      status: draft
      evidence:
        section: sec-verification-operating-envelope
        quote: A mobile robot carrying a full payload down a warehouse aisle stops in a different distance
          when memory-bus contention delays its perception pipeline, when battery supply rails sag under
          acceleration, or when drive inverters heat up under sustained torque. Specifying the external
          operational design domain (ODD) alone therefore leaves the test conditions half-defined; an **operating
          envelope** couples those external conditions with the internal execution state of the computing,
          power, and actuation hardware. Every protective claim must declare both dimensions, the environmental
          bounds and the internal computational and electrical loads, under which it is guaranteed to hold.
    - id: vol4.field.verification-fault--enforcement-filter
      source: vol4.verification.fault
      predicate: challenges premises of
      target: vol4.enforcement.filter
      explanation: Injected proposer stalls and other declared faults test whether the protection actually
        acts within the claimed limits.
      conditions: Inject at the specified interface and independently witness the response; a nominal success
        trace does not exercise an absent fault.
      status: draft
      evidence:
        section: sec-verification-fault-injection
        quote: 'The authority record at the close of @sec-intervention can log weeks of clean handovers
          and still say nothing about what the machine does when a duplicate writer appears on the bus,
          a stale packet replays, or a heartbeat drops. None of those faults occurred during normal service.
          Every preceding chapter of this book rests on protective claims of the same kind: a chunk lease
          that expires within its declared deadline, a permission path that halts the mobile base within
          its clear distance, or a safety microcontroller that outlasts a voltage brownout on the shared
          electrical supply. Because those fallback paths stay dormant until a subsystem breaks, an unexpected
          fault discovered in service has already crossed the causal boundary into the room, releasing kinetic
          energy that no software update can undo. Verification turns these design assertions into auditable
          evidence by provoking each fault deliberately before release, under the physical loads that make
          the protective response hardest to execute.'
    - id: vol4.field.verification-oracle--verification-fault
      source: vol4.verification.oracle
      predicate: scores
      target: vol4.verification.fault
      explanation: The trial needs precommitted limits for braking onset and stopping distance rather than
        a post-hoc judgment that it eventually stopped.
      conditions: Validate that injection and envelope preconditions held before crediting a pass; invalid
        trials are not successes.
      status: draft
      evidence:
        section: sec-verification-oracles-acceptance
        quote: 'A valid verification trace for the F1 safety claim must establish both timely deceleration
          onset and bounded stopping distance; observing that the robot base eventually stopped establishes
          neither guarantee. Without an oracle fixed in advance, post-hoc inspection takes over: engineers
          eyeball time-series plots after the run, seizing on gross symptoms such as whether Joule heating\index{Joule
          heating!component failure} melted a motor phase wire or a controller threw an unhandled exception.
          The trial degenerates into an anecdote.'
    - id: vol4.field.verification-envelope--assurance-case
      source: vol4.verification.envelope
      predicate: bounds evidence credited to
      target: vol4.assurance.case
      explanation: A release argument must identify which claim and envelope point each fault record actually
        supports.
      conditions: A passed point does not cover untested corners or configurations, and adversarial search
        frequencies are not operational failure rates.
      status: draft
      evidence:
        section: sec-verification-contract-matrix
        quote: A pile of individual pass verdicts leaves a release review unable to tell which top-level
          safety claims have been substantiated across the envelope and which operating conditions remain
          untested. Every record in the fault-record set therefore exists to support one named assurance
          claim $\AssuranceClaim$ within the release safety case, and its header names that claim explicitly.
          In the safety case structure developed in @sec-release-assurance-grammar, the top-level assurance
          claim $\AssuranceClaim_0$ states a core physical invariant, such as halting within the clearance
          corridor ($\StoppingDistance \le \ClearDistance$), and splits into sub-claims $\AssuranceClaim_i$
          covering specific operating envelopes, hardware fault classes, and fallback behaviors. The F1,
          F2, and F3 records support that stopping bound across communication and timing faults, showing
          that the safety permission path halts the loaded mobile base within its travel bound once proposal
          renewals cease (F1), when sensor observations arrive stale (F2), or when fieldbus frames drop
          in transit (F3). Where F1–F3 test information and timing loss, the F4 and actuator-jam records
          test electrical and mechanical survival. F4 shows that the held-up auxiliary power rail keeps
          the permission path alive through a primary supply collapse long enough to complete an emergency
          stop and set all mechanical holding brakes. The actuator-jam records show that the chassis stays
          within its lateral clearance corridor during a wheel-lock fault without driving the stator windings
          into thermal runaway. At the control boundary, the A1–A4 records support the claims that motion
          authority keeps a single writer, blocks control bypass, runs a deterministic fallback when supervisory
          handovers stall, and rejects forged command tokens. Alongside them, the proposer-injection records
          show whether tested adversarial proposals were caught by the runtime permission checks. Extending
          that result to every possible proposal still requires an architectural or formal argument that
          no source can bypass the permission path.
