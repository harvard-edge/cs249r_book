    - Record chain
  claims:
    Causal boundary: The causal boundary is the interface where an admitted digital command begins to drive current,
      force, or flow in the plant; upstream a tensor is a proposal that can be discarded for free, and downstream
      changing the command costs physical work against inertia over finite time.
    Irreversibility and recovery: Work delivered across the causal boundary has no checkpoint to restore, so recovery
      is a new constrained motion limited by torque, friction, and drive limits, and the permission path must confirm
      that a feasible recovery still exists before it admits an action.
    Elementary stopping budget: Stopping distance v*tau_delay + v^2/(2*a_brake) must fit the clear distance, where
      the delay sums observation age, the unexpired chunk lease, a permission tick, a bus cycle, and brake onset,
      so every millisecond of latency is travel (1.5 mm per ms at the running machine's 1.5 m/s).
    Physical AI scope test: A system is physical AI only when it has a learned statistical model, consequential
      physical feedback, and delegated authority at once; an independent deterministic veto does not remove delegated
      authority, while per-command human approval does.
    Digital privileges lost to embodiment: Moving from advisory prediction through software agency to physical embodiment
      removes elastic virtual time, transactional rollback, and batchable execution, so data, compute, evaluation,
      and deployment each acquire physical stakes.
    Five-level machine: The machine is ordered as Brain (learned proposers), Nervous System (buses, schedulers,
      permission path), Body (plant), Boundary (register writes and sensor captures), and World, with governance
      as a lifecycle envelope rather than a sixth level, so a failure is diagnosed by the level that failed.
    Proposal boundary: A learned model may only propose; an independent permission path with bounded latency, which
      the model cannot delay or corrupt, alone admits an action after checking fresh evidence, the stopping envelope,
      and a feasible fallback, and it acts on its own when the proposer stalls.
    Safety convergence at the permission path: 'Because physical authority is state-dependent, environmental change,
      sensor spoofing, and post-incident reconstruction all reduce to three demands on the permission path: fresh
      authenticated physical state, deterministic authority to intervene with a feasible fallback, and synchronized
      causal telemetry.'
    Three machine classes: Embodied operation divides by the margin it spends (stopping clearance for mass-dominated
      mobility, force and deformation for contact-dominated manipulation, heat and supply for energy- and thermal-dominated
      operation), and one task can cross all three.
    Crossover speed: Delay travel equals braking travel at v* = 2*a_brake*tau_delay, so below it latency dominates
      the stop and above it speed does, and lowering speed shrinks both terms, braking quadratically.
    Command-to-motion chain: A setpoint becomes torque through the position loop, current controller, PWM compare
      register, inverter, and stator, and the causal boundary sits where that chain first energizes a winding.
    Machine card: The running machine is specified once by a card of registry parameters, each tagged with its evidence
      category, which later chapters read rather than restate.
    Record chain: Each chapter contributes one machine-checkable record of an assumption with its evidence, producer,
      consumers, and invalidating conditions, and the chain of records meets at the permission decision.
