    relationships:
    - id: vol4.field.boundary-irreversibility--boundary-causal
      source: vol4.boundary.irreversibility
      predicate: precludes rollback beyond
      target: vol4.boundary.causal
      explanation: Once a command has deformed an object or degraded insulation, restoring controller state
        cannot undo that physical consequence.
      conditions: The claim concerns delivered physical consequences; recovery can mitigate harm but cannot
        recall the work already delivered.
      status: draft
      evidence:
        section: sec-boundary-thermodynamic-irreversibility
        quote: The stopping budget prices one consequence of irreversibility. The other is what recovery
          becomes. A database transaction that aborts restores the state it started from, but a gripper
          that has permanently deformed a workholding fixture, or a winding whose insulation has degraded
          from overheating, has no earlier state to return to. Recovery on a physical machine is therefore
          a new trajectory, not a reversal.
    - id: vol4.field.stopping-delay--stopping-distance
      source: vol4.stopping.delay
      predicate: increases
      target: vol4.stopping.distance
      explanation: A longer delay allows additional unbraked travel before the same braking response begins.
      conditions: Compare the same detection speed, clearance reference, and credible braking model; pre-brake
        motion is not itself braking distance.
      status: draft
      evidence:
        section: sec-boundary-kinematic-roofline
        quote: 'When the loaded warehouse base cruises down an aisle at speed $\SpeedAtDetection$ and a
          worker steps out from behind a rack, stopping requires clearance across two distinct phases. The
          first is the distance the base travels before braking forces engage. The second is the distance
          it travels while mechanical braking brings its momentum to zero. Assuming steady initial velocity
          $\SpeedAtDetection$, uniform deceleration $\CredibleBrakingDeceleration$ once brakes engage, and
          a stationary obstacle, the elementary stopping distance satisfies the kinematic budget:

          $$\StoppingDistance = \underbrace{\SpeedAtDetection \PrebrakeDelay}_{\text{travel during response
          delay}} + \underbrace{\frac{\SpeedAtDetection^2}{2 \CredibleBrakingDeceleration}}_{\text{mechanical
          dissipation}} \le \ClearDistance$$ {#eq-boundary-stopping-budget}

          Here $\SpeedAtDetection$ denotes initial forward speed, $\PrebrakeDelay$ represents total pre-brake
          response latency, $\CredibleBrakingDeceleration$ is the sustained braking deceleration, and $\ClearDistance$
          is the usable line-of-sight clearance. The pre-brake delay $\PrebrakeDelay$ spans the time from
          when an obstacle first appears in a sensor exposure to the physical onset of retarding force.
          Specifically, it sums the age of the sensor observation upon handoff and the unexpired lease duration
          of any currently executing motion chunk (the lease is the longest an admitted chunk may drive
          before the permission path must act again). It also adds one discrete permission-path evaluation
          tick (the period at which the permission path re-checks the motion it has admitted), one bus communication
          cycle (the time to carry a command to the motor drives), and mechanical brake onset latency.'
    - id: vol4.field.boundary-proposal--authority-actuation
      source: vol4.boundary.proposal
      predicate: separates learned output from
      target: vol4.authority.actuation
      explanation: The model proposes motion while a distinct permission path can refuse it and retain stopping
        authority.
      conditions: Architectural separation must include all physical write paths, not only a software API
        boundary.
      status: draft
      evidence:
        section: sec-boundary-machine-model
        quote: When the running machine's chunk policy stalls mid-aisle, something other than the policy
          must still be able to stop the base. When the policy emits a chunk that would carry the arm through
          a coworker's hand, something other than the policy must refuse it. An embodied machine therefore
          needs an architecture that prevents learned models from writing directly to the actuators they
          could damage, while still letting those models guide physical behavior.
