<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <style>
      .axis-hdr { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0F172A; }
      .tick-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; }
      .time-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #334155; }
      .curve-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 600; }
      .tag-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; }
      .math { font-family: 'Menlo', 'Courier New', monospace; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="450" fill="#FFFFFF"/>

  <!-- Inevitable Collision Shaded Region across Track 2 -->
  <rect x="537" y="135" width="283" height="115" fill="#FEF2F2" fill-opacity="0.55"/>
  <line x1="537" y1="50" x2="537" y2="400" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- ==================== TRACK 1: PERCEPTION ==================== -->
  <g transform="translate(30, 75)">
    <text x="0" y="0" class="axis-hdr">Perception</text>
  </g>

  <!-- Baseline -->
  <line x1="160" y1="72" x2="820" y2="72" stroke="#E2E8F0" stroke-width="1.2"/>
  <circle cx="160" cy="72" r="3.5" fill="#1E293B"/>

  <!-- Classification Toggles -->
  <g transform="translate(205, 59)">
    <rect width="50" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="25" y="16.5" class="tag-lbl" font-size="8px" fill="#334155" text-anchor="middle">Vehicle</text>
    <rect x="60" y="0" width="50" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="85" y="16.5" class="tag-lbl" font-size="8px" fill="#334155" text-anchor="middle">Bicycle</text>
    <rect x="120" y="0" width="50" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="145" y="16.5" class="tag-lbl" font-size="8px" fill="#334155" text-anchor="middle">Other</text>
    <rect x="180" y="0" width="50" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="205" y="16.5" class="tag-lbl" font-size="8px" fill="#334155" text-anchor="middle">Bicycle</text>
    <text x="115" y="39" class="tag-lbl" fill="#64748B" text-anchor="middle">Classification Toggles</text>
  </g>

  <!-- 1.2s Delay Window -->
  <g transform="translate(679, 59)">
    <rect width="141" height="26" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="70.5" y="17" class="tag-lbl" fill="#B45309" text-anchor="middle">1.2s Delay</text>
  </g>

  <!-- Marker at T-0.2s -->
  <circle cx="796" cy="72" r="3.5" fill="#DC2626"/>

  <!-- ==================== TRACK 2: CLEARANCE ==================== -->
  <g transform="translate(30, 195)">
    <text x="0" y="0" class="axis-hdr">Clearance (m)</text>
  </g>

  <!-- Y-Axis -->
  <line x1="160" y1="135" x2="160" y2="250" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="160" y1="250" x2="820" y2="250" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="152" y="140" class="tick-lbl" text-anchor="end">80</text>
  <text x="152" y="190" class="tick-lbl" text-anchor="end">46</text>
  <text x="152" y="253" class="tick-lbl" text-anchor="end">0</text>

  <!-- Stopping Envelope Threshold (46m) -->
  <line x1="160" y1="186" x2="820" y2="186" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="170" y="180" class="math" fill="#DC2626">d_stop = 46m</text>

  <!-- Actual Clearance Trajectory d(t) -->
  <path d="M 160 135 Q 350 160 537 186 L 796 245 L 820 250" fill="none" stroke="#1E293B" stroke-width="2"/>
  <text x="310" y="152" class="math" fill="#1E293B">d(t)</text>

  <!-- Intersection Marker at T-2.4s (537, 186) -->
  <circle cx="537" cy="186" r="4" fill="#DC2626"/>
  <text x="745" y="152" class="tag-lbl" fill="#B91C1C" text-anchor="middle">Inevitable Impact</text>

  <!-- Marker at T-0.2s -->
  <circle cx="796" cy="245" r="3" fill="#DC2626"/>

  <!-- ==================== TRACK 3: DECELERATION ==================== -->
  <g transform="translate(30, 345)">
    <text x="0" y="0" class="axis-hdr">Deceleration (m/s²)</text>
  </g>

  <!-- Y-Axis -->
  <line x1="160" y1="305" x2="160" y2="365" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="160" y1="365" x2="820" y2="365" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="152" y="318" class="tick-lbl" text-anchor="end">8</text>
  <text x="152" y="368" class="tick-lbl" text-anchor="end">0</text>

  <!-- Actual Command Trace -->
  <polyline points="160,365 796,365 820,350" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="750" y="380" class="curve-lbl" fill="#DC2626">Actual</text>

  <!-- 1 kHz Safety Reflex -->
  <polyline points="160,365 537,365 537,315 790,315 790,365 820,365" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="600" y="308" class="curve-lbl" fill="#2563EB">1 kHz Reflex</text>

  <!-- ==================== TIME AXIS (BOTTOM) ==================== -->
  <line x1="160" y1="405" x2="820" y2="405" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Tick 1: T-5.6s -->
  <line x1="160" y1="405" x2="160" y2="411" stroke="#334155" stroke-width="1.2"/>
  <text x="160" y="424" class="time-lbl" text-anchor="middle">T-5.6s</text>

  <!-- Tick 2: T-2.4s -->
  <line x1="537" y1="405" x2="537" y2="411" stroke="#DC2626" stroke-width="1.5"/>
  <text x="537" y="424" class="time-lbl" fill="#DC2626" text-anchor="middle">T-2.4s</text>

  <!-- Tick 3: T-1.2s -->
  <line x1="679" y1="405" x2="679" y2="411" stroke="#334155" stroke-width="1.2"/>
  <text x="679" y="424" class="time-lbl" text-anchor="middle">T-1.2s</text>

  <!-- Tick 4: T-0.2s -->
  <line x1="796" y1="405" x2="796" y2="411" stroke="#DC2626" stroke-width="1.2"/>
  <text x="790" y="424" class="time-lbl" fill="#DC2626" text-anchor="end">T-0.2s</text>

  <!-- Tick 5: Impact -->
  <line x1="820" y1="405" x2="820" y2="411" stroke="#DC2626" stroke-width="1.5"/>
  <text x="826" y="424" class="time-lbl" fill="#DC2626" text-anchor="start">Impact</text>
</svg>
