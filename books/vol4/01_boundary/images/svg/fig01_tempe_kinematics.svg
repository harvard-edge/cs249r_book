<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="32.9 19.4 855.5 417.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-9.9" y="-1.5" width="941.0" height="459.7" fill="#ffffff"/>
  <rect width="900" height="440" fill="#fff"/>
  <text x="48" y="44" font-size="13" font-weight="700" fill="#17352e">Recorded ADS sequence</text>
  <text x="48" y="68" font-size="10" fill="#475569">Events and speeds from NTSB/HAR-19/03, table on page 16; event spacing is schematic</text>
  <line x1="95" y1="174" x2="830" y2="174" stroke="#475569" stroke-width="2"/>
  <g stroke="#475569" stroke-width="1.5" fill="#17352e">
    <circle cx="115" cy="174" r="5"/><circle cx="470" cy="174" r="5"/><circle cx="690" cy="174" r="5"/><circle cx="825" cy="174" r="5"/>
  </g>
  <text x="115" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#17352e">T − 5.6 s</text>
  <text x="470" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#17352e">T − 1.2 s</text>
  <text x="690" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#17352e">T − 0.2 s</text>
  <text x="825" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#17352e">Impact</text>
  <rect x="57" y="97" width="130" height="50" rx="4" fill="#e7f2ee" stroke="#377d65"/>
  <text x="122" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#17352e">First detection</text>
  <text x="122" y="135" text-anchor="middle" font-size="10" fill="#475569">Path not predicted</text>
  <rect x="390" y="97" width="160" height="50" rx="4" fill="#fff0db" stroke="#ae7330"/>
  <text x="470" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#613c19">Emergency recognized</text>
  <text x="470" y="135" text-anchor="middle" font-size="10" fill="#613c19">43.2 mph; suppression starts</text>
  <rect x="608" y="97" width="164" height="50" rx="4" fill="#fff0db" stroke="#ae7330"/>
  <text x="690" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#613c19">Suppression ends</text>
  <text x="690" y="135" text-anchor="middle" font-size="10" fill="#613c19">40.5 mph; slowdown plan</text>
  <rect x="800" y="97" width="73" height="50" rx="4" fill="#f8deda" stroke="#b84b43"/>
  <text x="836" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#8d2722">Collision</text>
  <text x="836" y="135" text-anchor="middle" font-size="10" fill="#8d2722">39 mph</text>
  <line x1="470" y1="224" x2="690" y2="224" stroke="#ae7330" stroke-width="6" stroke-linecap="round"/>
  <text x="580" y="246" text-anchor="middle" font-size="11" fill="#613c19">One second of action suppression</text>
  <text x="48" y="296" font-size="13" font-weight="700" fill="#17352e">Conditional braking comparison at T − 0.2 s</text>
  <text x="48" y="316" font-size="10" fill="#475569">Assume 18.1 m/s and constant 8 m/s² deceleration; distances are illustrative, not recorded.</text>
  <text x="48" y="350" font-size="11" fill="#17352e">Distance needed to stop</text>
  <rect x="247" y="337" width="548" height="16" rx="2" fill="#b84b43"/>
  <text x="805" y="350" font-size="11" font-weight="700" fill="#8d2722">20.5 m</text>
  <text x="48" y="385" font-size="11" fill="#17352e">Travel to impact at same speed</text>
  <rect x="247" y="372" width="97" height="16" rx="2" fill="#377d65"/>
  <text x="354" y="385" font-size="11" font-weight="700" fill="#17352e">3.6 m</text>
  <text x="48" y="420" font-size="10" fill="#475569">No counterfactual stop time is inferred from this comparison.</text>
</svg>
