<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #1F407A; text-anchor: middle; }
      .subtitle { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 9px; fill: #64748B; text-anchor: middle; }
      .header-title { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; text-anchor: middle; }
      .header-sub { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 8.5px; fill: rgba(255,255,255,0.85); text-anchor: middle; }
      .math-box-text { font-family: 'Menlo', 'Courier New', monospace; font-size: 9.5px; font-weight: 600; text-anchor: middle; }
      .row-label { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 8.5px; fill: #1E293B; }
      .row-val { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 8.5px; fill: #475569; }
      .bottom-takeaway { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 8.5px; text-anchor: middle; }
      .tech-label { font-family: 'Menlo', 'Courier New', monospace; font-size: 7.5px; font-weight: 600; fill: #1E293B; }
    </style>
    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-3%" width="110%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="370" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Top Title Banner -->
  <text x="450" y="24" class="title" letter-spacing="0.5">THE THREE CANONICAL MACHINE ARCHETYPES OF PHYSICAL AI</text>
  <text x="450" y="38" class="subtitle">Distilling Physical Systems by Governing Conservation Laws, First-Binding Budgets, and Critical Failure Modes</text>

  <!-- ========================================================================= -->
  <!-- PANEL 1: MASS-DOMINATED MOBILITY -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 50)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="265" height="305" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Card Header -->
    <path d="M 0 6 Q 0 0 6 0 L 259 0 Q 265 0 265 6 L 265 38 L 0 38 Z" fill="#1F407A"/>
    <text x="132.5" y="17" class="header-title">1. MASS-DOMINATED</text>
    <text x="132.5" y="30" class="header-sub">Mobility &amp; Navigation</text>

    <!-- Technical Schematic Box -->
    <rect x="12" y="48" width="241" height="88" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Detailed AMR Chassis Schematic -->
    <g transform="translate(25, 62)">
      <!-- Ground plane -->
      <line x1="0" y1="58" x2="215" y2="58" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="10" y1="62" x2="25" y2="58" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="40" y1="62" x2="55" y2="58" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="70" y1="62" x2="85" y2="58" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="100" y1="62" x2="115" y2="58" stroke="#CBD5E1" stroke-width="1"/>

      <!-- AMR Main Body -->
      <rect x="12" y="24" width="58" height="24" rx="3" fill="#1E293B" stroke="#0F172A" stroke-width="1.2"/>
      <!-- AMR Top Deck / Sensor Tier -->
      <rect x="18" y="16" width="46" height="8" rx="2" fill="#334155"/>
      <!-- LiDAR Puck -->
      <rect x="34" y="8" width="14" height="8" rx="1.5" fill="#0284C7"/>
      <!-- LiDAR Scan Beam (translucent) -->
      <path d="M 41 12 L 140 0 L 140 58 Z" fill="#0284C7" fill-opacity="0.12"/>
      <line x1="41" y1="12" x2="140" y2="0" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="2,2"/>
      <line x1="41" y1="12" x2="140" y2="58" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="2,2"/>

      <!-- AMR Wheels -->
      <circle cx="24" cy="52" r="7" fill="#475569" stroke="#0F172A" stroke-width="1.5"/>
      <circle cx="24" cy="52" r="2.5" fill="#94A3B8"/>
      <circle cx="58" cy="52" r="7" fill="#475569" stroke="#0F172A" stroke-width="1.5"/>
      <circle cx="58" cy="52" r="2.5" fill="#94A3B8"/>

      <!-- Velocity & Momentum Vector -->
      <line x1="76" y1="36" x2="130" y2="36" stroke="#1F407A" stroke-width="2" marker-end="url(#arrow-blue)"/>
      <text x="103" y="28" class="tech-label" fill="#1F407A" text-anchor="middle">v(t), p=mv</text>

      <!-- Obstacle / Barrier -->
      <rect x="160" y="15" width="8" height="43" rx="1" fill="#DC2626" fill-opacity="0.2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,2"/>
      <text x="164" y="10" class="tech-label" fill="#DC2626" text-anchor="middle">d_clear</text>
      <line x1="70" y1="46" x2="160" y2="46" stroke="#DC2626" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Formula Box -->
    <rect x="12" y="142" width="241" height="24" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="132.5" y="158" class="math-box-text" fill="#1E40AF">d_stop = v₀·Δt + v₀² / (2·a_max)</text>

    <!-- Technical Specs Table -->
    <g transform="translate(14, 178)">
      <text x="0" y="0" class="row-label">Exemplars:</text>
      <text x="64" y="0" class="row-val">AMRs, AVs, Drones, Mobile Bases</text>

      <text x="0" y="18" class="row-label">First Budget:</text>
      <text x="64" y="18" class="row-val">Stopping Distance &amp; Freshness (Δt)</text>

      <text x="0" y="36" class="row-label">Failure Mode:</text>
      <text x="64" y="36" class="row-val">Kinetic collision; momentum breach</text>

      <text x="0" y="54" class="row-label">Safety Gate:</text>
      <text x="64" y="54" class="row-val">MCU dynamic braking referee (1 kHz)</text>
    </g>

    <!-- Bottom Takeaway Strip -->
    <rect x="12" y="272" width="241" height="22" rx="3" fill="#F1F5F9"/>
    <text x="132.5" y="286" class="bottom-takeaway" fill="#1F407A">Delay converts directly to spatial drift (Δx)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: CONTACT-DOMINATED MANIPULATION -->
  <!-- ========================================================================= -->
  <g transform="translate(317.5, 50)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="265" height="305" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Card Header -->
    <path d="M 0 6 Q 0 0 6 0 L 259 0 Q 265 0 265 6 L 265 38 L 0 38 Z" fill="#A51C30"/>
    <text x="132.5" y="17" class="header-title">2. CONTACT-DOMINATED</text>
    <text x="132.5" y="30" class="header-sub">Manipulation &amp; Assembly</text>

    <!-- Technical Schematic Box -->
    <rect x="12" y="48" width="241" height="88" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Detailed Articulated Manipulator Schematic -->
    <g transform="translate(20, 62)">
      <!-- Robot Base Mounting -->
      <rect x="5" y="48" width="24" height="10" rx="1.5" fill="#475569" stroke="#0F172A" stroke-width="1.2"/>
      <line x1="0" y1="58" x2="34" y2="58" stroke="#334155" stroke-width="2"/>

      <!-- Joint 1 Base Pivot -->
      <circle cx="17" cy="46" r="5.5" fill="#1E293B" stroke="#0F172A" stroke-width="1.2"/>
      <circle cx="17" cy="46" r="2" fill="#CBD5E1"/>

      <!-- Link 1 -->
      <line x1="17" y1="46" x2="44" y2="18" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
      <line x1="17" y1="46" x2="44" y2="18" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Joint 2 Elbow -->
      <circle cx="44" cy="18" r="4.5" fill="#1E293B" stroke="#0F172A" stroke-width="1.2"/>
      <circle cx="44" cy="18" r="1.8" fill="#CBD5E1"/>

      <!-- Link 2 Forearm -->
      <line x1="44" y1="18" x2="84" y2="28" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="44" y1="18" x2="84" y2="28" stroke="#64748B" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Wrist & Force Sensor -->
      <rect x="84" y="24" width="7" height="8" rx="1" fill="#DC2626"/>

      <!-- End Effector Tool Tip -->
      <polygon points="91,25 102,28 91,31" fill="#0F172A"/>

      <!-- Normal Contact Point & Force Vector -->
      <circle cx="102" cy="28" r="2.5" fill="#DC2626"/>
      <line x1="102" y1="28" x2="128" y2="28" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
      <line x1="128" y1="28" x2="104" y2="28" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>

      <!-- Rigid Environment Wall & Spring Compliance Model -->
      <rect x="134" y="10" width="10" height="48" rx="1.5" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
      <!-- Hatching on wall -->
      <line x1="144" y1="14" x2="152" y2="22" stroke="#64748B" stroke-width="1"/>
      <line x1="144" y1="26" x2="152" y2="34" stroke="#64748B" stroke-width="1"/>
      <line x1="144" y1="38" x2="152" y2="46" stroke="#64748B" stroke-width="1"/>

      <text x="160" y="24" class="tech-label" fill="#DC2626">F = k_c·Δx</text>
      <text x="160" y="38" class="tech-label" fill="#334155">J_ref = N²·J_r</text>
    </g>

    <!-- Formula Box -->
    <rect x="12" y="142" width="241" height="24" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="132.5" y="158" class="math-box-text" fill="#B91C1C">F_contact = k_c·Δx,  J_ref = N²·J_rotor</text>

    <!-- Technical Specs Table -->
    <g transform="translate(14, 178)">
      <text x="0" y="0" class="row-label">Exemplars:</text>
      <text x="64" y="0" class="row-val">Manipulators, Grippers, Humanoids</text>

      <text x="0" y="18" class="row-label">First Budget:</text>
      <text x="64" y="18" class="row-val">Actuator Current &amp; Gearbox Stress</text>

      <text x="0" y="36" class="row-label">Failure Mode:</text>
      <text x="64" y="36" class="row-val">Gear tooth shear; workpiece damage</text>

      <text x="0" y="54" class="row-label">Safety Gate:</text>
      <text x="64" y="54" class="row-val">Torque-derivative clamp &amp; C² profiler</text>
    </g>

    <!-- Bottom Takeaway Strip -->
    <rect x="12" y="272" width="241" height="22" rx="3" fill="#F1F5F9"/>
    <text x="132.5" y="286" class="bottom-takeaway" fill="#A51C30">Position errors convert to massive forces (k_c)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 3: FLOW-DOMINATED THERMAL & PROCESS -->
  <!-- ========================================================================= -->
  <g transform="translate(610, 50)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="265" height="305" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Card Header -->
    <path d="M 0 6 Q 0 0 6 0 L 259 0 Q 265 0 265 6 L 265 38 L 0 38 Z" fill="#B87333"/>
    <text x="132.5" y="17" class="header-title">3. FLOW-DOMINATED</text>
    <text x="132.5" y="30" class="header-sub">Process, Thermal &amp; Energy</text>

    <!-- Technical Schematic Box -->
    <rect x="12" y="48" width="241" height="88" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Detailed Thermal Plant Schematic -->
    <g transform="translate(25, 62)">
      <!-- Fluid Flow Pipe / Conduit -->
      <rect x="10" y="22" width="195" height="20" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
      
      <!-- Flow Direction Arrows -->
      <line x1="20" y1="32" x2="45" y2="32" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)"/>
      <line x1="165" y1="32" x2="190" y2="32" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>

      <!-- Heat Source / Stator Core / Battery Cell Stack -->
      <rect x="65" y="12" width="75" height="40" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
      
      <!-- Internal Heating Coil -->
      <path d="M 75 32 Q 80 18 85 32 Q 90 46 95 32 Q 100 18 105 32 Q 110 46 115 32 Q 120 18 125 32 Q 130 46 135 32" fill="none" stroke="#DC2626" stroke-width="2.2"/>

      <!-- Heat Dissipation Vectors (convective arrows) -->
      <path d="M 85 8 Q 87 2 92 4" fill="none" stroke="#D97706" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
      <path d="M 102 8 Q 104 2 109 4" fill="none" stroke="#D97706" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
      <path d="M 119 8 Q 121 2 126 4" fill="none" stroke="#D97706" stroke-width="1.2" marker-end="url(#arrow-amber)"/>

      <!-- Thermal Labels -->
      <text x="102.5" y="60" class="tech-label" fill="#B45309" text-anchor="middle">ΔQ = I²R·Δt</text>
      
      <!-- Thermocouple Sensor & Trip Threshold -->
      <circle cx="145" cy="18" r="3.5" fill="#DC2626"/>
      <line x1="145" y1="18" x2="160" y2="10" stroke="#DC2626" stroke-width="1"/>
      <text x="165" y="12" class="tech-label" fill="#DC2626">T_max</text>
    </g>

    <!-- Formula Box -->
    <rect x="12" y="142" width="241" height="24" rx="3" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="132.5" y="158" class="math-box-text" fill="#B45309">dT/dt = (P_in - P_out) / C_th</text>

    <!-- Technical Specs Table -->
    <g transform="translate(14, 178)">
      <text x="0" y="0" class="row-label">Exemplars:</text>
      <text x="64" y="0" class="row-val">Thermal loops, Inverters, Bioreactors</text>

      <text x="0" y="18" class="row-label">First Budget:</text>
      <text x="64" y="18" class="row-val">Thermal Capacity &amp; Phase Timing</text>

      <text x="0" y="36" class="row-label">Failure Mode:</text>
      <text x="64" y="36" class="row-val">Thermal runaway; insulation blowout</text>

      <text x="0" y="54" class="row-label">Safety Gate:</text>
      <text x="64" y="54" class="row-val">Hardware thermal observer &amp; interlock</text>
    </g>

    <!-- Bottom Takeaway Strip -->
    <rect x="12" y="272" width="241" height="22" rx="3" fill="#F1F5F9"/>
    <text x="132.5" y="286" class="bottom-takeaway" fill="#B87333">Joule heating accumulates across duty cycles</text>
  </g>

</svg>
