<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1100" height="700" fill="#FFFFFF" rx="4"/>

  <!-- ==================== PANEL A: OPEN-LOOP DIGITAL COMPUTATION ==================== -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#1F407A" letter-spacing="0.02em">
      A) Open-Loop Digital Computation (Disembodied AI)
    </text>
    <text x="0" y="24" font-size="12" fill="#64748B">
      Exogenous data flows to prediction behind a glass barrier. Execution is idempotent; errors do not alter input reality.
    </text>

    <!-- Content Group -->
    <g transform="translate(40, 50)">
      <!-- 1. Exogenous Data -->
      <rect x="0" y="0" width="200" height="100" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="100" y="44" font-size="14" font-weight="bold" fill="#1F407A" text-anchor="middle">Exogenous Data</text>
      <text x="100" y="68" font-size="11" fill="#64748B" text-anchor="middle">Static Benchmark / Token Stream</text>

      <!-- Arrow 1 -> 2 -->
      <line x1="200" y1="50" x2="270" y2="50" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-navy)"/>

      <!-- 2. ML Model -->
      <rect x="270" y="0" width="220" height="100" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="2" filter="url(#shadow)"/>
      <text x="380" y="44" font-size="14" font-weight="bold" fill="#1F407A" text-anchor="middle">Neural Deliberation</text>
      <text x="380" y="68" font-size="11" fill="#64748B" text-anchor="middle">Digital Transformer Inference</text>

      <!-- Arrow 2 -> 3 across glass barrier -->
      <line x1="490" y1="50" x2="630" y2="50" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-navy)"/>

      <!-- Glass Barrier Divider -->
      <line x1="560" y1="-15" x2="560" y2="115" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
      <rect x="505" y="-30" width="110" height="20" rx="3" fill="#E2E8F0"/>
      <text x="560" y="-16" font-size="9" font-weight="bold" fill="#2D3748" text-anchor="middle" letter-spacing="0.05em">GLASS BARRIER</text>

      <!-- 3. Prediction Output -->
      <rect x="630" y="0" width="220" height="100" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="740" y="44" font-size="14" font-weight="bold" fill="#2D3748" text-anchor="middle">Text / Logit Prediction</text>
      <text x="740" y="68" font-size="11" fill="#64748B" text-anchor="middle">Zero Consequential Plant State</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="260" x2="1040" y2="260" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- ==================== PANEL B: CLOSED CAUSAL LOOP OF PHYSICAL AI ==================== -->
  <g transform="translate(60, 290)">
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#1F407A" letter-spacing="0.02em">
      B) Closed Causal Loop of Physical AI
    </text>
    <text x="0" y="24" font-size="12" fill="#64748B">
      Endogenous feedback: Model actions alter the continuous physical environment, fundamentally changing the next sensory input.
    </text>

    <!-- Content Group -->
    <g transform="translate(0, 50)">
      <!-- 1. Sensors -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="100" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.8" filter="url(#shadow)"/>
        <text x="90" y="42" font-size="13.5" font-weight="bold" fill="#1F407A" text-anchor="middle">Sensors</text>
        <text x="90" y="62" font-size="10.5" fill="#475569" text-anchor="middle">Cameras, IMU, Joint State</text>
        <text x="90" y="78" font-size="9.5" fill="#64748B" text-anchor="middle">Endogenous Evidence o_t</text>
      </g>

      <!-- Arrow Sensors -> Deliberation -->
      <line x1="180" y1="50" x2="240" y2="50" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

      <!-- 2. Neural Deliberation -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="220" height="100" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="2" filter="url(#shadow)"/>
        <text x="110" y="42" font-size="13.5" font-weight="bold" fill="#1F407A" text-anchor="middle">Neural Deliberation</text>
        <text x="110" y="62" font-size="10.5" fill="#475569" text-anchor="middle">VLA / Diffusion Policy (1–50 Hz)</text>
        <text x="110" y="78" font-size="9.5" font-weight="bold" fill="#1F407A" text-anchor="middle">Proposes Action Chunk (û)</text>
      </g>

      <!-- Proposal Arrow Deliberation -> Safety Gate -->
      <line x1="460" y1="50" x2="520" y2="50" stroke="#1F407A" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-navy)"/>
      <text x="490" y="40" font-size="10" font-weight="bold" fill="#1F407A" text-anchor="middle">Proposal û</text>

      <!-- 3. Safety Gate -->
      <g transform="translate(520, 0)">
        <rect x="0" y="0" width="210" height="100" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="2.2" filter="url(#shadow)"/>
        <rect x="0" y="0" width="210" height="20" rx="4" fill="#FEF2F2"/>
        <text x="105" y="14.5" font-size="8.5" font-weight="bold" fill="#A51C30" text-anchor="middle">CAUSAL PERMISSION GATE</text>
        <text x="105" y="46" font-size="13.5" font-weight="bold" fill="#A51C30" text-anchor="middle">Safety Monitor (1 kHz)</text>
        <text x="105" y="66" font-size="10.5" fill="#475569" text-anchor="middle">Control Barrier Filter h(x) ≥ 0</text>
        <text x="105" y="82" font-size="9.5" font-weight="bold" fill="#A51C30" text-anchor="middle">Veto or Certify Command</text>
      </g>

      <!-- Certified Command Arrow Safety Gate -> Motors -->
      <line x1="730" y1="50" x2="790" y2="50" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-red)"/>
      <text x="760" y="40" font-size="10" font-weight="bold" fill="#A51C30" text-anchor="middle">Certified u*</text>

      <!-- 4. Motors -->
      <g transform="translate(790, 0)">
        <rect x="0" y="0" width="190" height="100" rx="4" fill="#2D3748" stroke="#1F407A" stroke-width="2" filter="url(#shadow)"/>
        <text x="95" y="42" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Motor Actuators</text>
        <text x="95" y="62" font-size="10.5" fill="#E2E8F0" text-anchor="middle">Inverters &amp; PWM</text>
        <text x="95" y="78" font-size="9.5" fill="#94A3B8" text-anchor="middle">Torque τ = k_t · I_phase</text>
      </g>

      <!-- Arrow Motors -> Environment -->
      <!-- Starts at (885, 100) -> goes down to (885, 160) -> turns left to (750, 160) -->
      <path fill="none" d="M 885 100 L 885 170 L 752 170" stroke="#A51C30" stroke-width="2" marker-end="url(#arr-red)"/>
      <text x="895" y="142" font-size="9.5" font-weight="bold" fill="#A51C30">Actuation</text>

      <!-- 5. Physical Environment & Continuous Plant -->
      <g transform="translate(240, 125)">
        <rect x="0" y="0" width="510" height="90" rx="4" fill="#F8FAFC" stroke="#2D3748" stroke-width="1.8" filter="url(#shadow)"/>
        <text x="255" y="32" font-size="13.5" font-weight="bold" fill="#2D3748" text-anchor="middle">
          Continuous Plant &amp; Physical Environment
        </text>
        <text x="255" y="52" font-size="10.5" fill="#475569" text-anchor="middle">
          Dynamical State ẋ = f(x) + g(x)u* · Momentum p = mv · Contact Mechanics &amp; Friction
        </text>
        <text x="255" y="70" font-size="9.5" font-style="italic" fill="#64748B" text-anchor="middle">
          Physical actions irreversibly alter reality — execution cannot be rolled back
        </text>
      </g>

      <!-- Feedback Loop from Environment -> Sensors -->
      <!-- Starts at left of Environment (240, 170) -> goes left to (90, 170) -> goes up to (90, 102) -->
      <path fill="none" d="M 240 170 L 90 170 L 90 103" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
      <text x="165" y="162" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">
        Endogenous Sensory Shift (o_{t+1})
      </text>
    </g>
  </g>
</svg>