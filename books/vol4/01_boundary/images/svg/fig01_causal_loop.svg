<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; letter-spacing: 0.02em; }
      .lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
      .sublbl { font-family: 'Menlo', 'Courier New', monospace; font-size: 10px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .tag { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 700; text-anchor: middle; letter-spacing: 0.05em; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="400" fill="#FFFFFF"/>

  <!-- ==================== PANEL A: OPEN-LOOP DIGITAL COMPUTATION ==================== -->
  <g transform="translate(50, 24)">
    <text x="0" y="16" class="hdr">a  Open-Loop AI</text>

    <!-- Node 1: Input -->
    <g transform="translate(60, 36)">
      <rect width="160" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="80" y="28" class="lbl">Input</text>
      <text x="80" y="44" class="sublbl">x</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="220" y1="65" x2="310" y2="65" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <!-- Node 2: Neural Model -->
    <g transform="translate(310, 36)">
      <rect width="180" height="58" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
      <text x="90" y="28" class="lbl" fill="#1E40AF">Neural Model</text>
      <text x="90" y="44" class="sublbl" fill="#2563EB">f(x)</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="490" y1="65" x2="600" y2="65" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <!-- Glass Barrier -->
    <line x1="545" y1="24" x2="545" y2="106" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="545" y="16" class="tag" fill="#64748B">GLASS BARRIER</text>

    <!-- Node 3: Prediction -->
    <g transform="translate(600, 36)">
      <rect width="160" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="80" y="28" class="lbl">Prediction</text>
      <text x="80" y="44" class="sublbl">ŷ</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="160" x2="870" y2="160" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== PANEL B: CLOSED CAUSAL LOOP OF PHYSICAL AI ==================== -->
  <g transform="translate(50, 184)">
    <text x="0" y="16" class="hdr">b  Physical AI (Closed Loop)</text>

    <!-- Node 1: Sensors -->
    <g transform="translate(0, 36)">
      <rect width="125" height="58" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
      <text x="62.5" y="28" class="lbl" fill="#1E40AF">Sensors</text>
      <text x="62.5" y="44" class="sublbl" fill="#2563EB">o<tspan baseline-shift="sub" font-size="8px">t</tspan></text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="125" y1="65" x2="175" y2="65" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <!-- Node 2: Policy -->
    <g transform="translate(175, 36)">
      <rect width="130" height="58" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
      <text x="65" y="28" class="lbl" fill="#1E40AF">Policy</text>
      <text x="65" y="44" class="sublbl" fill="#2563EB">û</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="305" y1="65" x2="355" y2="65" stroke="#334155" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-slate)"/>

    <!-- Node 3: Safety Referee -->
    <g transform="translate(355, 36)">
      <rect width="140" height="58" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
      <text x="70" y="36" class="lbl" fill="#166534">Safety Referee</text>
    </g>

    <!-- Causal Boundary Line -->
    <line x1="527" y1="24" x2="527" y2="106" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="527" y="16" class="tag" fill="#DC2626">CAUSAL BOUNDARY</text>

    <!-- Arrow 3 -> 4 -->
    <line x1="495" y1="65" x2="560" y2="65" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-rose)"/>

    <!-- Node 4: Actuators -->
    <g transform="translate(560, 36)">
      <rect width="125" height="58" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
      <text x="62.5" y="28" class="lbl" fill="#991B1B">Actuators</text>
      <text x="62.5" y="44" class="sublbl" fill="#DC2626">u*</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <line x1="685" y1="65" x2="735" y2="65" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <!-- Node 5: Physical Plant -->
    <g transform="translate(735, 36)">
      <rect width="135" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="67.5" y="36" class="lbl">Physical Plant</text>
    </g>

    <!-- Feedback Loop: Plant -> Sensors -->
    <path d="M 802 94 L 802 148 L 62.5 148 L 62.5 102" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <rect x="365" y="137" width="130" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="430" y="152" class="lbl" font-size="10.5px" fill="#475569">Sensory Feedback</text>
  </g>
</svg>