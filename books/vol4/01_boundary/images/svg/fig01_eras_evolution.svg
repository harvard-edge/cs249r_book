<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">THE THREE ERAS OF AUTONOMOUS COMPUTING</text>
<text x="440.0" y="44" class="subtitle">From Structured Industrial Determinism to Cloud AI and Embodied Physical Agents</text>
<rect x="45.0" y="70" width="250" height="330" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="45.0" y="70" width="250" height="24" rx="8" fill="#475569" fill-opacity="0.12"/>
<text x="170.0" y="86" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">ERA 1: CLASSICAL AUTOMATION</text>
<text x="170.0" y="112" font-size="12" font-weight="700" fill="#1A202C" text-anchor="middle">1970s – 2010s</text>
<text x="170.0" y="128" font-size="9" fill="#64748B" text-anchor="middle">Rigid, Deterministic Execution</text>
<text x="57.0" y="150" font-size="8.5" fill="#475569">• Structured factory workcells &amp; caged robots</text>
<text x="57.0" y="174" font-size="8.5" fill="#475569">• Hard-coded ladder logic &amp; PID controllers</text>
<text x="57.0" y="198" font-size="8.5" fill="#475569">• Zero open-world generalization capability</text>
<text x="57.0" y="222" font-size="8.5" fill="#475569">• Safe only through physical human exclusion</text>
<line x1="296.0" y1="235.0" x2="314.0" y2="235.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<rect x="315.0" y="70" width="250" height="330" rx="8" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="315.0" y="70" width="250" height="24" rx="8" fill="#215CAF" fill-opacity="0.12"/>
<text x="440.0" y="86" font-size="8.5" font-weight="700" fill="#215CAF" text-anchor="middle">ERA 2: CLOUD &amp; DIGITAL AI</text>
<text x="440.0" y="112" font-size="12" font-weight="700" fill="#1A202C" text-anchor="middle">2012 – 2024</text>
<text x="440.0" y="128" font-size="9" fill="#64748B" text-anchor="middle">Disembodied Statistical Scaling</text>
<text x="327.0" y="150" font-size="8.5" fill="#475569">• Large Language Models &amp; Generative Diffusion</text>
<text x="327.0" y="174" font-size="8.5" fill="#475569">• Pure software sandbox · Infinite undo &amp; idempotent APIs</text>
<text x="327.0" y="198" font-size="8.5" fill="#475569">• Unbounded tail latencies (> 500 ms acceptable)</text>
<text x="327.0" y="222" font-size="8.5" fill="#475569">• Zero awareness of momentum, mass, or heating</text>
<line x1="566.0" y1="235.0" x2="584.0" y2="235.0" stroke="#215CAF" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<rect x="585.0" y="70" width="250" height="330" rx="8" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="585.0" y="70" width="250" height="24" rx="8" fill="#1F407A" fill-opacity="0.12"/>
<text x="710.0" y="86" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">ERA 3: PHYSICAL AI</text>
<text x="710.0" y="112" font-size="12" font-weight="700" fill="#1A202C" text-anchor="middle">2024 – Present</text>
<text x="710.0" y="128" font-size="9" fill="#64748B" text-anchor="middle">Embodied Real-Time Agency</text>
<text x="597.0" y="150" font-size="8.5" fill="#475569">• Multi-rate dual-brain architecture (MPU ⟷ MCU)</text>
<text x="597.0" y="174" font-size="8.5" fill="#475569">• Foundation world models with real-time CBF filters</text>
<text x="597.0" y="198" font-size="8.5" fill="#475569">• Hard latency freshness deadlines (d_stop ≤ d_gap)</text>
<text x="597.0" y="222" font-size="8.5" fill="#475569">• Irreversible physical consequence &amp; zero software undo</text>
</svg>
