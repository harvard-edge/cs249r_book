<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E40AF"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="940" height="430" fill="#FFFFFF" rx="4"/>
  <rect x="1" y="1" width="938" height="428" fill="none" stroke="#E2E8F0" stroke-width="1.5" rx="4"/>

  <!-- Top Header -->
  <g transform="translate(470, 24)" text-anchor="middle">
    <text y="16" font-size="16" font-weight="800" fill="#1E3A8A" letter-spacing="0.04em">THE THREE ERAS OF AUTONOMOUS COMPUTING</text>
    <text y="34" font-size="12" fill="#64748B">From Structured Industrial Determinism to Cloud AI and Embodied Physical Agents</text>
  </g>

  <!-- ==================== ERA 1: CLASSICAL AUTOMATION ==================== -->
  <g transform="translate(30, 72)">
    <rect width="272" height="328" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3" filter="url(#soft-shadow)"/>
    <rect width="272" height="4" rx="1" fill="#475569"/>
    
    <!-- Era Badge & Dates -->
    <rect x="16" y="16" width="240" height="22" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="136" y="31" font-size="10" font-weight="800" fill="#334155" text-anchor="middle" letter-spacing="0.04em">ERA 1: CLASSICAL AUTOMATION</text>
    <text x="136" y="58" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">1970s – 2010s</text>
    <text x="136" y="73" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Rigid, Deterministic Execution</text>
    
    <!-- Characteristics -->
    <text x="16" y="98" font-size="10.5" fill="#334155">• Structured factory workcells &amp; cages</text>
    <text x="16" y="116" font-size="10.5" fill="#334155">• Hard-coded ladder logic &amp; PID loops</text>
    <text x="16" y="134" font-size="10.5" fill="#334155">• Zero open-world semantic adaptation</text>
    <text x="16" y="152" font-size="10.5" fill="#334155">• Safety enforced by human exclusion</text>

    <!-- Bottom Specs Card -->
    <g transform="translate(14, 172)">
      <rect width="244" height="142" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="12" y="20" font-size="10" font-weight="700" fill="#475569">Execution Paradigm:</text>
      <text x="12" y="36" font-size="9.5" fill="#0F172A">Deterministic Transfer Functions (PLC)</text>
      
      <text x="12" y="58" font-size="10" font-weight="700" fill="#475569">Failure Containment:</text>
      <text x="12" y="74" font-size="9.5" fill="#0F172A">Physical Cages &amp; Interlock E-Stops</text>
      
      <text x="12" y="96" font-size="10" font-weight="700" fill="#475569">Limiting Constraints:</text>
      <text x="12" y="112" font-size="9.5" fill="#0F172A">Kinematic Range &amp; Tool Wear</text>
      <text x="12" y="128" font-size="9" fill="#64748B">Zero runtime cognitive autonomy</text>
    </g>
  </g>

  <!-- Transition Arrow 1 -> 2 -->
  <line x1="305" y1="236" x2="331" y2="236" stroke="#1E40AF" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- ==================== ERA 2: CLOUD & DIGITAL AI ==================== -->
  <g transform="translate(334, 72)">
    <rect width="272" height="328" rx="4" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.3" filter="url(#soft-shadow)"/>
    <rect width="272" height="4" rx="1" fill="#2563EB"/>
    
    <!-- Era Badge & Dates -->
    <rect x="16" y="16" width="240" height="22" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="136" y="31" font-size="10" font-weight="800" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.04em">ERA 2: CLOUD &amp; DIGITAL AI</text>
    <text x="136" y="58" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">2012 – 2024</text>
    <text x="136" y="73" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">Disembodied Statistical Scaling</text>
    
    <!-- Characteristics -->
    <text x="16" y="98" font-size="10.5" fill="#334155">• Large language models &amp; diffusion</text>
    <text x="16" y="116" font-size="10.5" fill="#334155">• Pure software sandbox &amp; cloud APIs</text>
    <text x="16" y="134" font-size="10.5" fill="#334155">• Unbounded tail latency (>500 ms OK)</text>
    <text x="16" y="152" font-size="10.5" fill="#334155">• Idempotent execution &amp; database rollback</text>

    <!-- Bottom Specs Card -->
    <g transform="translate(14, 172)">
      <rect width="244" height="142" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="12" y="20" font-size="10" font-weight="700" fill="#2563EB">Execution Paradigm:</text>
      <text x="12" y="36" font-size="9.5" fill="#0F172A">Stochastic Foundation Models (GPU)</text>
      
      <text x="12" y="58" font-size="10" font-weight="700" fill="#2563EB">Failure Containment:</text>
      <text x="12" y="74" font-size="9.5" fill="#0F172A">Guardrails, Retry Logic &amp; Undo Logs</text>
      
      <text x="12" y="96" font-size="10" font-weight="700" fill="#2563EB">Limiting Constraints:</text>
      <text x="12" y="112" font-size="9.5" fill="#0F172A">Compute FLOPS &amp; Datacenter Power</text>
      <text x="12" y="128" font-size="9" fill="#64748B">Zero awareness of real momentum or heat</text>
    </g>
  </g>

  <!-- Transition Arrow 2 -> 3 -->
  <line x1="609" y1="236" x2="635" y2="236" stroke="#1E40AF" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- ==================== ERA 3: PHYSICAL AI ==================== -->
  <g transform="translate(638, 72)">
    <rect width="272" height="328" rx="4" fill="#F8FAFC" stroke="#38BDF8" stroke-width="1.8" filter="url(#soft-shadow)"/>
    <rect width="272" height="4" rx="1" fill="#0284C7"/>
    
    <!-- Era Badge & Dates -->
    <rect x="16" y="16" width="240" height="22" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="136" y="31" font-size="10" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="0.06em">ERA 3: PHYSICAL AI</text>
    <text x="136" y="58" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">2024 – Present</text>
    <text x="136" y="73" font-size="11" font-weight="600" fill="#0284C7" text-anchor="middle">Embodied Real-Time Agency</text>
    
    <!-- Characteristics -->
    <text x="16" y="98" font-size="10.5" fill="#334155">• Dual-brain MPU ↔ MCU co-design</text>
    <text x="16" y="116" font-size="10.5" fill="#334155">• Stochastic policy + 1 kHz safety filters</text>
    <text x="16" y="134" font-size="10.5" fill="#334155">• Hard freshness deadlines (d<tspan baseline-shift="sub" font-size="7.5">stop</tspan> ≤ d<tspan baseline-shift="sub" font-size="7.5">clear</tspan>)</text>
    <text x="16" y="152" font-size="10.5" fill="#334155">• Irreversible physical consequences</text>

    <!-- Bottom Specs Card -->
    <g transform="translate(14, 172)">
      <rect width="244" height="142" rx="3" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
      
      <text x="12" y="20" font-size="10" font-weight="700" fill="#0369A1">Execution Paradigm:</text>
      <text x="12" y="36" font-size="9.5" fill="#0F172A">Hybrid Stochastic + CBF Reflex Latches</text>
      
      <text x="12" y="58" font-size="10" font-weight="700" fill="#0369A1">Failure Containment:</text>
      <text x="12" y="74" font-size="9.5" fill="#0F172A">Hardware Watchdogs &amp; Dynamic Braking</text>
      
      <text x="12" y="96" font-size="10" font-weight="700" fill="#0369A1">Limiting Constraints:</text>
      <text x="12" y="112" font-size="9.5" fill="#0F172A">Kinetic Inertia &amp; Thermal Junctions</text>
      <text x="12" y="128" font-size="9" fill="#0369A1" font-weight="600">Zero rollback: actions mutate reality</text>
    </g>
  </g>
</svg>
