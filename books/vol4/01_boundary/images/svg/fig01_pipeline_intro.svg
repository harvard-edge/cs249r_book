<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="960" height="480" fill="#FFFFFF" rx="4"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="16" font-weight="bold" fill="#1F407A" text-anchor="middle" letter-spacing="0.03em">THE COMPLETE PHYSICAL AI SENSORY-MOTOR PIPELINE</text>
  <text x="480" y="50" font-size="11" fill="#64748B" text-anchor="middle">Asynchronous Multi-Rate Flow: From Physical Transduction to Real-Time Safety-Filtered Actuation</text>

  <!-- ==================== ROW 1: SENSORY & COGNITION ==================== -->
  <!-- STAGE 1: TRANSDUCTION -->
  <g transform="translate(48, 68)">
    <rect x="0" y="0" width="268" height="135" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="268" height="24" rx="4" fill="#1F407A" fill-opacity="0.10"/>
    <text x="12" y="16.5" font-size="9" font-weight="bold" fill="#1F407A">STAGE 1: TRANSDUCTION</text>
    <text x="12" y="44" font-size="12" font-weight="bold" fill="#1E293B">Sensory Ingestion</text>
    <text x="12" y="66" font-size="9.5" fill="#475569">• MIPI CSI-2 Cameras · IMU · Encoders</text>
    <text x="12" y="86" font-size="9.5" fill="#475569">• DMA zero-copy ring buffers (malloc=0)</text>
    <text x="12" y="106" font-size="9.5" fill="#475569">• Hardware PTP nanosecond timestamping</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="316" y1="135" x2="346" y2="135" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <!-- STAGE 2: PERCEPTION -->
  <g transform="translate(346, 68)">
    <rect x="0" y="0" width="268" height="135" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="268" height="24" rx="4" fill="#1F407A" fill-opacity="0.10"/>
    <text x="12" y="16.5" font-size="9" font-weight="bold" fill="#1F407A">STAGE 2: PERCEPTION</text>
    <text x="12" y="44" font-size="12" font-weight="bold" fill="#1E293B">Spatial Tokenization</text>
    <text x="12" y="66" font-size="9.5" fill="#475569">• Metric depth &amp; 3D bounding primitives</text>
    <text x="12" y="86" font-size="9.5" fill="#475569">• Patch embeddings → Spatial affordances</text>
    <text x="12" y="106" font-size="9.5" fill="#475569">• Zero-copy tensor views into shared SRAM</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="614" y1="135" x2="644" y2="135" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <!-- STAGE 3: MEMORY -->
  <g transform="translate(644, 68)">
    <rect x="0" y="0" width="268" height="135" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="268" height="24" rx="4" fill="#1F407A" fill-opacity="0.10"/>
    <text x="12" y="16.5" font-size="9" font-weight="bold" fill="#1F407A">STAGE 3: MEMORY</text>
    <text x="12" y="44" font-size="12" font-weight="bold" fill="#1E293B">World Model &amp; Frame Tree</text>
    <text x="12" y="66" font-size="9.5" fill="#475569">• Dynamic SE(3) kinematic coordinate tree</text>
    <text x="12" y="86" font-size="9.5" fill="#475569">• Proprioceptive innovation updates</text>
    <text x="12" y="106" font-size="9.5" fill="#475569">• Latent JEPA physics state prediction</text>
  </g>

  <!-- Downward Arrow 3 -> 4 -->
  <path fill="none" d="M 778 203 L 778 231" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <!-- ==================== ROW 2: DELIBERATION & REFLEX ==================== -->
  <!-- STAGE 4: REASONING -->
  <g transform="translate(644, 233)">
    <rect x="0" y="0" width="268" height="135" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="268" height="24" rx="4" fill="#1F407A" fill-opacity="0.10"/>
    <text x="12" y="16.5" font-size="9" font-weight="bold" fill="#1F407A">STAGE 4: REASONING</text>
    <text x="12" y="44" font-size="12" font-weight="bold" fill="#1E293B">Semantic Intent Leases</text>
    <text x="12" y="66" font-size="9.5" fill="#475569">• Edge VLM deliberate task grounding</text>
    <text x="12" y="86" font-size="9.5" fill="#475569">• Emits coarse 3D target + expiring lease</text>
    <text x="12" y="106" font-size="9.5" fill="#475569">• t_expire lease bounds execution window</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="644" y1="300" x2="614" y2="300" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <!-- STAGE 5: PLANNING -->
  <g transform="translate(346, 233)">
    <rect x="0" y="0" width="268" height="135" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="268" height="24" rx="4" fill="#1F407A" fill-opacity="0.10"/>
    <text x="12" y="16.5" font-size="9" font-weight="bold" fill="#1F407A">STAGE 5: PLANNING (PROPOSES û)</text>
    <text x="12" y="44" font-size="12" font-weight="bold" fill="#1E293B">Action Chunking (H=16)</text>
    <text x="12" y="66" font-size="9.5" fill="#475569">• Diffusion / ACT action trajectory chunks</text>
    <text x="12" y="86" font-size="9.5" fill="#475569">• C² continuous quintic spline fitting</text>
    <text x="12" y="106" font-size="9.5" fill="#475569">• Temporal ensembling over overlapping plans</text>
  </g>

  <!-- Proposal Arrow across boundary 5 -> 6 -->
  <line x1="346" y1="300" x2="316" y2="300" stroke="#1F407A" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-navy)"/>
  <text x="331" y="292" font-size="8.5" font-weight="bold" fill="#1F407A" text-anchor="middle">û</text>

  <!-- STAGE 6: REFLEX (SAFETY MONITORS) -->
  <g transform="translate(48, 233)">
    <rect x="0" y="0" width="268" height="135" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="2.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="268" height="24" rx="4" fill="#FEF2F2"/>
    <text x="12" y="16.5" font-size="9" font-weight="bold" fill="#A51C30">STAGE 6: REFLEX · SAFETY ENFORCER</text>
    <text x="12" y="44" font-size="12" font-weight="bold" fill="#A51C30">Real-Time MCU Enforcer (1000 Hz)</text>
    <text x="12" y="66" font-size="9.5" fill="#475569">• 1000 Hz zero-allocation QP solver (CBF)</text>
    <text x="12" y="86" font-size="9.5" fill="#475569">• Control Barrier Function: h(x) ≥ 0</text>
    <text x="12" y="106" font-size="9.5" fill="#475569">• Dynamic stopping clearance check &amp; veto</text>
  </g>

  <!-- ==================== PHYSICAL WORLD ==================== -->
  <g transform="translate(48, 395)">
    <rect x="0" y="0" width="864" height="52" rx="4" fill="#2D3748" stroke="#1F407A" stroke-width="1.8"/>
    <text x="432" y="23" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.03em">
      THE PHYSICAL WORLD &amp; ACTUATION DYNAMICS (W_t → W_t+1)
    </text>
    <text x="432" y="40" font-size="9.5" fill="#CBD5E1" text-anchor="middle">
      Kinetic Momentum · Friction Limits · Thermal Constraints · Motor Torque Saturation · Irreversible Physics
    </text>
  </g>

  <!-- Command Arrow Stage 6 -> Physical World -->
  <line x1="182" y1="368" x2="182" y2="393" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="195" y="384" font-size="9" font-weight="bold" fill="#A51C30">Certified u*</text>

  <!-- Left Upward Feedback Loop: Physical World -> Stage 1 -->
  <!-- Perimeter routing around the left: starts at (48, 421) -> (24, 421) -> (24, 135) -> (46, 135) -->
  <path fill="none" d="M 48 421 L 24 421 L 24 135 L 46 135" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="14" y="278" font-size="9" font-weight="bold" fill="#475569" transform="rotate(-90, 14, 278)" text-anchor="middle">Sensory Feedback (o_t+1)</text>
</svg>
