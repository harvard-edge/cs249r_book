<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1D4ED8"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0E7490"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="480" fill="#FFFFFF"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <text y="16" font-size="16" font-weight="800" fill="#1E3A8A" letter-spacing="0.04em">THE THREE TRADITIONS OF EMBODIED INTELLIGENCE</text>
    <text y="34" font-size="12" fill="#64748B">Synthesizing Machine Learning (Brain), Real-Time Embedded (Nervous System), and Robotics (Body)</text>
  </g>

  <!-- ==================== TOP THREE PILLAR CARDS ==================== -->
  <!-- Card 1: Machine Learning (x=30, w=286, h=300) -->
  <g transform="translate(30, 74)">
    <rect width="286" height="300" rx="4" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.5"/>
    <rect width="286" height="4" rx="1" fill="#2563EB"/>
    
    <!-- Title & Domain -->
    <text x="18" y="32" font-size="16" font-weight="800" fill="#1E3A8A">1. Machine Learning</text>
    <text x="18" y="50" font-size="11" font-weight="600" fill="#2563EB">Computer Science · The Brain</text>
    
    <!-- Superpower -->
    <text x="18" y="78" font-size="11.5" font-weight="700" fill="#1E293B">Core Superpower:</text>
    <text x="18" y="96" font-size="10.5" fill="#475569">Open-world semantic competence,</text>
    <text x="18" y="112" font-size="10.5" fill="#475569">visual foundation models, high-dimensional</text>
    <text x="18" y="128" font-size="10.5" fill="#475569">representation learning.</text>
    
    <!-- Blindspot -->
    <text x="18" y="160" font-size="11.5" font-weight="700" fill="#DC2626">Critical Blindspot:</text>
    <text x="18" y="178" font-size="10.5" fill="#475569">Stochastic outputs, unbounded tail latency,</text>
    <text x="18" y="194" font-size="10.5" fill="#475569">zero deterministic physical safety</text>
    <text x="18" y="210" font-size="10.5" fill="#475569">guarantees.</text>
    
    <!-- Primitives Divider & Content -->
    <line x1="18" y1="234" x2="268" y2="234" stroke="#E2E8F0" stroke-width="1"/>
    <text x="18" y="254" font-size="11" font-weight="700" fill="#1E293B">Key Primitives:</text>
    <text x="18" y="274" font-size="10" font-weight="500" fill="#64748B">Transformers · Diffusion · Statistical Loss</text>
  </g>

  <!-- Card 2: Embedded Systems (x=336, w=288, h=300) -->
  <g transform="translate(336, 74)">
    <rect width="288" height="300" rx="4" fill="#F8FAFC" stroke="#67E8F9" stroke-width="1.5"/>
    <rect width="288" height="4" rx="1" fill="#0891B2"/>
    
    <!-- Title & Domain -->
    <text x="18" y="32" font-size="16" font-weight="800" fill="#0E7490">2. Embedded Systems</text>
    <text x="18" y="50" font-size="11" font-weight="600" fill="#0891B2">ECE / Systems · Nervous System</text>
    
    <!-- Superpower -->
    <text x="18" y="78" font-size="11.5" font-weight="700" fill="#1E293B">Core Superpower:</text>
    <text x="18" y="96" font-size="10.5" fill="#475569">Microsecond clock determinism, bare-metal</text>
    <text x="18" y="112" font-size="10.5" fill="#475569">register control, zero-allocation SRAM,</text>
    <text x="18" y="128" font-size="10.5" fill="#475569">hardware watchdog fault tolerance.</text>
    
    <!-- Blindspot -->
    <text x="18" y="160" font-size="11.5" font-weight="700" fill="#DC2626">Critical Blindspot:</text>
    <text x="18" y="178" font-size="10.5" fill="#475569">Minimal semantic capacity, cannot</text>
    <text x="18" y="194" font-size="10.5" fill="#475569">generalize to unstructured, dynamic</text>
    <text x="18" y="210" font-size="10.5" fill="#475569">open worlds.</text>
    
    <!-- Primitives Divider & Content -->
    <line x1="18" y1="234" x2="270" y2="234" stroke="#E2E8F0" stroke-width="1"/>
    <text x="18" y="254" font-size="11" font-weight="700" fill="#1E293B">Key Primitives:</text>
    <text x="18" y="274" font-size="10" font-weight="500" fill="#64748B">1 kHz Timers · DMA Seqlocks · Watchdogs</text>
  </g>

  <!-- Card 3: Robotics Dynamics (x=644, w=286, h=300) -->
  <g transform="translate(644, 74)">
    <rect width="286" height="300" rx="4" fill="#F8FAFC" stroke="#FCA5A5" stroke-width="1.5"/>
    <rect width="286" height="4" rx="1" fill="#DC2626"/>
    
    <!-- Title & Domain -->
    <text x="18" y="32" font-size="16" font-weight="800" fill="#991B1B">3. Robotics Dynamics</text>
    <text x="18" y="50" font-size="11" font-weight="600" fill="#DC2626">Mechanical Eng · The Body</text>
    
    <!-- Superpower -->
    <text x="18" y="78" font-size="11.5" font-weight="700" fill="#1E293B">Core Superpower:</text>
    <text x="18" y="96" font-size="10.5" fill="#475569">Analytical differential equations,</text>
    <text x="18" y="112" font-size="10.5" fill="#475569">Lyapunov stability envelopes, contact</text>
    <text x="18" y="128" font-size="10.5" fill="#475569">mechanics, conservation laws.</text>
    
    <!-- Blindspot -->
    <text x="18" y="160" font-size="11.5" font-weight="700" fill="#DC2626">Critical Blindspot:</text>
    <text x="18" y="178" font-size="10.5" fill="#475569">Requires precise analytical models;</text>
    <text x="18" y="194" font-size="10.5" fill="#475569">brittle under unmodeled real-world</text>
    <text x="18" y="210" font-size="10.5" fill="#475569">visual and physical shifts.</text>
    
    <!-- Primitives Divider & Content -->
    <line x1="18" y1="234" x2="268" y2="234" stroke="#E2E8F0" stroke-width="1"/>
    <text x="18" y="254" font-size="11" font-weight="700" fill="#1E293B">Key Primitives:</text>
    <text x="18" y="274" font-size="10" font-weight="500" fill="#64748B">Momentum p = mv · Inertia · Heat Capacity</text>
  </g>

  <!-- ==================== DOWNWARD ARROWS ==================== -->
  <line x1="173" y1="374" x2="173" y2="398" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="480" y1="374" x2="480" y2="398" stroke="#0E7490" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <line x1="787" y1="374" x2="787" y2="398" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#arr-crimson)"/>

  <!-- ==================== BOTTOM SYNTHESIS CARD ==================== -->
  <g transform="translate(30, 404)">
    <rect width="900" height="56" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="24" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.04em">
      PHYSICAL ARTIFICIAL INTELLIGENCE · The Systems Engineering Synthesis
    </text>
    <text x="450" y="42" font-size="11" fill="#94A3B8" text-anchor="middle">
      High-Capacity Stochastic Deliberation <tspan font-weight="700" fill="#60A5FA">(Brain)</tspan> Gated by Bare-Metal Safety Invariants <tspan font-weight="700" fill="#22D3EE">(Nervous System)</tspan> over Dynamical Physics <tspan font-weight="700" fill="#F87171">(Body)</tspan>
    </text>
  </g>
</svg>
