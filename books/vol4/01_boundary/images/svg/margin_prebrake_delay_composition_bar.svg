  <g fill="none" stroke="#5e6b73" stroke-width="1.4" stroke-linecap="square">
    <line x1="4" y1="27" x2="176" y2="27"/>
    <line x1="4" y1="22.5" x2="4" y2="31.5"/>
    <line x1="176" y1="22.5" x2="176" y2="31.5"/>
