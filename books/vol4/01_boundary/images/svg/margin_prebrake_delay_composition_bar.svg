    <rect x="150.25" y="36" width="25.75" height="26" fill="#cccccc"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="18.16" y="53.6" fill="#ffffff">22</text>
    <text x="51.38" y="53.6" fill="#333333">29.6</text>
    <text x="109.05" y="53.6" fill="#ffffff">60</text>
    <text x="163.13" y="53.6" fill="#333333">20</text>
