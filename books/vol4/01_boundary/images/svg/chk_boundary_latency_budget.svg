<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Header -->
  <g transform="translate(16, 16)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e293b" letter-spacing="0.2">
      THE INELASTIC LATENCY BUDGET: TIME-TO-SPACE TRANSLATION
    </text>
    <!-- Parameters Badge -->
    <rect x="368" y="-9" width="140" height="16" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="438" y="2.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#475569">
      v₀ = 1.8 m/s  |  a_max = 2.0 m/s²
    </text>
  </g>

  <!-- Section 1: Cybernetic Pipeline Latency (Temporal Domain) -->
  <g transform="translate(16, 30)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#64748b">
      CYBERNETIC PIPELINE LATENCY (t_lag = 168.3 ms)
    </text>

    <!-- Pipeline Bar (Total width 508px) -->
    <g transform="translate(0, 7)">
      <!-- Camera Ingress: 33.3 ms (98px) -->
      <rect x="0" y="0" width="98" height="21" rx="3" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
      <text x="49" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#1e3a8a">
        Camera (33.3 ms)
      </text>
      <text x="49" y="17.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#1e3a8a">
        30 Hz CSI-2 Readout
      </text>

      <!-- VLA Inference: 120.0 ms (358px) -->
      <rect x="102" y="0" width="356" height="21" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
      <text x="280" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#78350f">
        VLA Neural Policy Inference (120.0 ms)
      </text>
      <text x="280" y="17.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#78350f">
        Deliberation Window on Edge NPU (Unprivileged Ring 3 Proposal)
      </text>

      <!-- CAN Bus: 15.0 ms (46px) -->
      <rect x="462" y="0" width="46" height="21" rx="3" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75"/>
      <text x="485" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#581c87">
        CAN Bus
      </text>
      <text x="485" y="17.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#581c87">
        15 ms
      </text>
    </g>
  </g>

  <!-- Transfer / Conversion Indicator -->
  <g transform="translate(16, 68)">
    <line x1="0" y1="6" x2="135" y2="6" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,2"/>
    <rect x="140" y="0" width="228" height="13" rx="6.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="254" y="9" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#334155">
      × Velocity v₀ (1.8 m/s)  →  Unguided Coast d_lag = v₀ · t_lag
    </text>
    <line x1="373" y1="6" x2="508" y2="6" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,2"/>
  </g>

  <!-- Section 2: Physical Clearance (Spatial Domain) -->
  <g transform="translate(16, 88)">
    <!-- Baseline Model Row -->
    <g transform="translate(0, 0)">
      <text x="0" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#334155">
        Baseline (120 ms):
      </text>

      <g transform="translate(85, 0)">
        <!-- Coasting bar: 30.3 cm -> 49 px -->
        <rect x="0" y="0" width="49" height="16" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
        <text x="24.5" y="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#7f1d1d">
          30.3 cm
        </text>

        <!-- Braking bar: 81.0 cm -> 130 px -->
        <rect x="51" y="0" width="130" height="16" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
        <text x="116" y="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14532d">
          Active Braking: 81.0 cm
        </text>
      </g>

      <!-- Right-aligned total -->
      <text x="508" y="11.5" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8">
        <tspan font-weight="bold" fill="#1e293b">d_stop = 1.11 m</tspan>
        <tspan font-size="7" fill="#64748b"> (coasts 30.3 cm / 27% of stop)</tspan>
      </text>
    </g>

    <!-- Upgraded Model Row (+200 ms latency) -->
    <g transform="translate(0, 22)">
      <text x="0" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#b91c1c">
        +200 ms VLA:
      </text>

      <g transform="translate(85, 0)">
        <!-- Coasting bar: 66.3 cm -> 106 px -->
        <rect x="0" y="0" width="106" height="16" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
        <text x="53" y="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#7f1d1d">
          Coasting: 66.3 cm (+36 cm)
        </text>

        <!-- Braking bar: 81.0 cm -> 130 px -->
        <rect x="108" y="0" width="130" height="16" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
        <text x="173" y="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14532d">
          Active Braking: 81.0 cm
        </text>
      </g>

      <!-- Right-aligned total -->
      <text x="508" y="11.5" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8">
        <tspan font-weight="bold" fill="#b91c1c">d_stop = 1.47 m</tspan>
        <tspan font-size="7" font-weight="bold" fill="#c44"> (+36.0 cm / +32.3% clearance)</tspan>
      </text>
    </g>

    <!-- Bottom Takeaway Sub-card -->
    <g transform="translate(0, 47)">
      <rect x="0" y="0" width="508" height="17" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
      <circle cx="9" cy="8.5" r="3.5" fill="#c44"/>
      <text x="18" y="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#1e293b">
        PHYSICAL LAW:
      </text>
      <text x="82" y="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#334155">
        Every 100 ms of unguided deliberation directly consumes 18.0 cm of safety margin before braking begins.
      </text>
    </g>
  </g>
</svg>
