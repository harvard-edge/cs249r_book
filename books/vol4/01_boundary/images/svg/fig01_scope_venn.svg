<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: bold; fill: #1F407A; text-anchor: middle; }
    .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; fill: #1F407A; text-anchor: middle; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #2D3748; text-anchor: middle; }
    .center-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: bold; fill: #000000; text-anchor: middle; }
  </style>

  <rect width="800" height="800" fill="#ffffff" />

  <g style="mix-blend-mode: multiply;">
    <!-- Top Circle -->
    <circle cx="400" cy="320" r="250" fill="#E2E8F0" stroke="#1F407A" stroke-width="2" />
    <!-- Bottom Left Circle -->
    <circle cx="280" cy="500" r="250" fill="#FFF0F0" stroke="#A51C30" stroke-width="2" />
    <!-- Bottom Right Circle -->
    <circle cx="520" cy="500" r="250" fill="#F0FDF4" stroke="#15803D" stroke-width="2" />
  </g>

  <g>
    <!-- Top Circle Label -->
    <text x="400" y="150" class="title-text">Learned Statistical Model</text>
    <text x="400" y="170" class="desc-text">(Unspecifiable Policy)</text>

    <!-- Bottom Left Label -->
    <text x="180" y="650" class="title-text" fill="#A51C30">Consequential</text>
    <text x="180" y="675" class="title-text" fill="#A51C30">Physical Feedback</text>

    <!-- Bottom Right Label -->
    <text x="620" y="650" class="title-text" fill="#15803D">Delegated</text>
    <text x="620" y="675" class="title-text" fill="#15803D">Physical Authority</text>

    <!-- Intersections -->
    <!-- Top + Bottom Left -->
    <text x="210" y="410" class="label-text">Advisory</text>
    <text x="210" y="430" class="label-text">Decision Support</text>
    <text x="210" y="450" class="desc-text">(No Authority)</text>

    <!-- Top + Bottom Right -->
    <text x="590" y="410" class="label-text">Digital</text>
    <text x="590" y="430" class="label-text">Autonomous Systems</text>
    <text x="590" y="450" class="desc-text">(No Phys. Feedback)</text>

    <!-- Bottom Left + Bottom Right -->
    <text x="400" y="650" class="label-text">Classical</text>
    <text x="400" y="670" class="label-text">Control Theory</text>
    <text x="400" y="690" class="desc-text">(Analytical Transfer Fn)</text>

    <!-- Center -->
    <rect x="330" y="445" width="140" height="36" rx="18" fill="#ffffff" stroke="#CBD5E0" stroke-width="2"/>
    <text x="400" y="470" class="center-text" fill="#1A202C">Physical AI</text>
  </g>
</svg>
