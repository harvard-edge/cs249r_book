<svg xmlns="http://www.w3.org/2000/svg" viewBox="129.0 9.0 542.0 507.0" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="101.9" y="-16.4" width="596.2" height="557.7" fill="#ffffff"/>
  <defs>
    <style>
      .primary-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 700; text-anchor: middle; letter-spacing: 0.01em; }
      .primary-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; text-anchor: middle; }
      .inter-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
      .hero-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; letter-spacing: 0.05em; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" fill="#FFFFFF"/>

  <!-- ==================== VENN CIRCLES ==================== -->
  <!-- Circle 1: Learned Model (Top) -->
  <circle cx="400" cy="190" r="170" fill="#EFF6FF" fill-opacity="0.55" stroke="#93C5FD" stroke-width="1.5"/>

  <!-- Circle 2: Physical Feedback (Bottom-Left) -->
  <circle cx="310" cy="335" r="170" fill="#F0FDF4" fill-opacity="0.55" stroke="#86EFAC" stroke-width="1.5"/>

  <!-- Circle 3: Physical Authority (Bottom-Right) -->
  <circle cx="490" cy="335" r="170" fill="#FEF2F2" fill-opacity="0.55" stroke="#FECACA" stroke-width="1.5"/>

  <!-- ==================== PRIMARY REGION LABELS ==================== -->
  <!-- Top: Learned Model -->
  <g transform="translate(400, 95)">
    <text y="0" class="primary-lbl" fill="#1E40AF">Learned Model</text>
    <text y="18" class="primary-sub">Unspecifiable Policy</text>
  </g>

  <!-- Bottom-Left: Physical Feedback -->
  <g transform="translate(245, 380)">
    <text y="0" class="primary-lbl" fill="#166534">Physical Feedback</text>
    <text y="18" class="primary-sub">Continuous Dynamics</text>
  </g>

  <!-- Bottom-Right: Physical Authority -->
  <g transform="translate(555, 380)">
    <text y="0" class="primary-lbl" fill="#991B1B">Physical Authority</text>
    <text y="18" class="primary-sub">Automated Actuation</text>
  </g>

  <!-- ==================== TWO-WAY INTERSECTIONS ==================== -->
  <!-- Top-Left: Advisory Systems -->
  <g transform="translate(305, 230)">
    <rect x="-58" y="-13" width="116" height="26" rx="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#CBD5E1" stroke-width="1"/>
    <text y="4" class="inter-lbl">Advisory Systems</text>
  </g>

  <!-- Top-Right: Digital Autonomy -->
  <g transform="translate(495, 230)">
    <rect x="-58" y="-13" width="116" height="26" rx="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#CBD5E1" stroke-width="1"/>
    <text y="4" class="inter-lbl">Digital Autonomy</text>
  </g>

  <!-- Bottom: Classical Control -->
  <g transform="translate(400, 425)">
    <rect x="-58" y="-13" width="116" height="26" rx="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#CBD5E1" stroke-width="1"/>
    <text y="4" class="inter-lbl">Classical Control</text>
  </g>

  <!-- ==================== THREE-WAY INTERSECTION ==================== -->
  <!-- Center at (400, 286) -->
  <g transform="translate(400, 286)">
    <rect x="-54" y="-16" width="108" height="32" rx="3" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text y="4.5" class="hero-title">Physical AI</text>
  </g>
</svg>
