<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1000" width="1040" height="1000"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Card and badge drop shadow -->
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="hero-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1040" height="1000" fill="#FFFFFF" rx="4"/>
  <rect x="1" y="1" width="1038" height="998" fill="none" stroke="#E2E8F0" stroke-width="1.5" rx="4"/>

  <!-- Top Title Header -->
  <g transform="translate(520, 34)" text-anchor="middle">
    <rect x="-115" y="-14" width="230" height="22" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text y="1" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.08em">SYSTEM SCOPE BOUNDARY</text>
    <text y="34" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="-0.01em">The Three Pillars of Physical AI</text>
    <text y="56" font-size="13" fill="#64748B">Physical AI exists strictly at the simultaneous three-way intersection of all three engineering criteria</text>
  </g>

  <!-- Divider Rule -->
  <line x1="40" y1="102" x2="1000" y2="102" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== VENN CIRCLES ==================== -->
  <!-- Center: (520, 500), d=145, R=245 -->
  <!-- Top Center C1: (520, 355) -->
  <!-- Bottom-Left Center C2: (394.4, 572.5) -->
  <!-- Bottom-Right Center C3: (645.6, 572.5) -->

  <g id="venn-fills">
    <!-- Top Circle Fill: Learned Statistical Models (Cobalt tint) -->
    <circle cx="520" cy="355" r="245" fill="#2563EB" fill-opacity="0.06"/>
    <!-- Bottom-Left Circle Fill: Consequential Physical Feedback (Emerald tint) -->
    <circle cx="394.4" cy="572.5" r="245" fill="#059669" fill-opacity="0.06"/>
    <!-- Bottom-Right Circle Fill: Delegated Physical Authority (Crimson tint) -->
    <circle cx="645.6" cy="572.5" r="245" fill="#DC2626" fill-opacity="0.06"/>
  </g>

  <g id="venn-strokes">
    <!-- Circle Outlines with rich textbook colors -->
    <circle cx="520" cy="355" r="245" fill="none" stroke="#1D4ED8" stroke-width="2.5"/>
    <circle cx="394.4" cy="572.5" r="245" fill="none" stroke="#047857" stroke-width="2.5"/>
    <circle cx="645.6" cy="572.5" r="245" fill="none" stroke="#B91C1C" stroke-width="2.5"/>
  </g>

  <!-- ==================== EXCLUSIVE REGIONS (THE THREE PILLARS) ==================== -->
  
  <!-- Pillar 1: Top Exclusive Lobe (Learned Statistical Model) -->
  <g transform="translate(520, 202)" text-anchor="middle">
    <rect x="-65" y="-12" width="130" height="22" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text y="3" font-size="10.5" font-weight="700" fill="#1D4ED8" letter-spacing="0.06em">CRITERION 1</text>
    <text y="32" font-size="18" font-weight="800" fill="#1E3A8A">Learned Statistical Model</text>
    <text y="52" font-size="13" font-weight="600" fill="#2563EB">Unspecifiable Policy &amp; Latent World Model</text>
    <text y="71" font-size="12" fill="#475569">Transfer function not expressible in closed analytical form</text>
    <text y="88" font-size="11" fill="#64748B">(VLA Foundation Models · Diffusion Policies · Neural Latents)</text>
  </g>

  <!-- Pillar 2: Bottom-Left Exclusive Lobe (Consequential Physical Feedback) -->
  <g transform="translate(295, 595)" text-anchor="middle">
    <rect x="-60" y="-11" width="120" height="21" rx="3" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text y="3" font-size="10" font-weight="700" fill="#047857" letter-spacing="0.06em">CRITERION 2</text>
    <text y="27" font-size="15.5" font-weight="800" fill="#065F46">Consequential</text>
    <text y="46" font-size="15.5" font-weight="800" fill="#065F46">Physical Feedback</text>
    <text y="66" font-size="12" font-weight="600" fill="#059669">Coupled Plant Kinetics</text>
    <text y="83" font-size="11" fill="#475569">Actuator actions alter material state;</text>
    <text y="98" font-size="11" fill="#475569">future observations obey physics</text>
    <text y="115" font-size="10" fill="#64748B">(Kinematics · Contact · Thermodynamics)</text>
  </g>

  <!-- Pillar 3: Bottom-Right Exclusive Lobe (Delegated Physical Authority) -->
  <g transform="translate(745, 595)" text-anchor="middle">
    <rect x="-60" y="-11" width="120" height="21" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text y="3" font-size="10" font-weight="700" fill="#B91C1C" letter-spacing="0.06em">CRITERION 3</text>
    <text y="27" font-size="15.5" font-weight="800" fill="#991B1B">Delegated</text>
    <text y="46" font-size="15.5" font-weight="800" fill="#991B1B">Physical Authority</text>
    <text y="66" font-size="12" font-weight="600" fill="#DC2626">Direct Actuator Writes</text>
    <text y="83" font-size="11" fill="#475569">Software writes hardware registers;</text>
    <text y="98" font-size="11" fill="#475569">no synchronous human veto in loop</text>
    <text y="115" font-size="10" fill="#64748B">(Direct PWM · Motor Current u*)</text>
  </g>

  <!-- ==================== TWO-SET INTERSECTIONS (ADJACENT DISCIPLINES) ==================== -->

  <!-- Top + Bottom-Left: Advisory Decision Support (x=368, y=412) -->
  <g transform="translate(368, 412)">
    <rect x="-62" y="-22" width="124" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <rect x="-62" y="-22" width="3.5" height="44" rx="1" fill="#3B82F6"/>
    <text x="-1" y="-6" font-size="11" font-weight="700" fill="#1E3A8A" text-anchor="middle">Advisory Systems</text>
    <text x="-1" y="8" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Human-in-the-Loop</text>
    <text x="-1" y="17.5" font-size="7.5" fill="#64748B" text-anchor="middle">Zero Direct Authority</text>
  </g>

  <!-- Top + Bottom-Right: Digital Autonomous Systems (x=672, y=412) -->
  <g transform="translate(672, 412)">
    <rect x="-62" y="-22" width="124" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <rect x="58.5" y="-22" width="3.5" height="44" rx="1" fill="#EF4444"/>
    <text x="-1" y="-6" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">Digital Autonomy</text>
    <text x="-1" y="8" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Algorithmic Agents</text>
    <text x="-1" y="17.5" font-size="7.5" fill="#64748B" text-anchor="middle">No Physical Coupling</text>
  </g>

  <!-- Bottom-Left + Bottom-Right: Classical Control Theory (x=520, y=675) -->
  <g transform="translate(520, 675)">
    <rect x="-68" y="-22" width="136" height="44" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <rect x="-68" y="19" width="136" height="3" rx="1" fill="#10B981"/>
    <text y="-6" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">Classical Control</text>
    <text y="8" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">PID · LQR · MPC</text>
    <text y="17.5" font-size="7.5" fill="#64748B" text-anchor="middle">Lyapunov Stability Certificates</text>
  </g>

  <!-- ==================== THREE-WAY CENTER HERO (PHYSICAL AI) ==================== -->
  <!-- Centered at (520, 500) -->
  <g transform="translate(520, 500)">
    <!-- Hero Box -->
    <rect x="-78" y="-27" width="156" height="54" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="url(#hero-shadow)"/>
    <!-- Top accent border -->
    <rect x="-78" y="-27" width="156" height="3.5" rx="1" fill="#38BDF8"/>
    <text y="-6" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.08em">PHYSICAL AI</text>
    <text y="9" font-size="8.5" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="0.04em">THE COMPLETE SYNTHESIS</text>
    <text y="20.5" font-size="7.5" fill="#94A3B8" text-anchor="middle">Learned · Coupled · Delegated</text>
  </g>

  <!-- ==================== BOTTOM SYSTEM RUBRIC & REFLEX GAP CARDS ==================== -->
  
  <!-- Left Card: The Shared Autonomy Reflex Gap -->
  <g transform="translate(40, 850)">
    <rect width="465" height="106" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="465" height="26" rx="4" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="0" y="22" width="465" height="4" fill="#EFF6FF"/>
    <text x="14" y="17" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="0.02em">THE SHARED AUTONOMY REFLEX GAP (Δt &lt; 200 ms)</text>
    
    <text x="14" y="44" font-size="10.5" fill="#334155">
      <tspan font-weight="700" fill="#0F172A">Operational Boundary:</tspan> In shared autonomy (e.g. driver-assist, surgical robotics),
    </text>
    <text x="14" y="60" font-size="10.5" fill="#334155">
      authority is divided between human and model. If a learned policy injects
    </text>
    <text x="14" y="76" font-size="10.5" fill="#334155">
      actuator torques without synchronous human confirmation within the
    </text>
    <text x="14" y="92" font-size="10.5" fill="#334155">
      <tspan font-weight="700" fill="#B91C1C">150–250 ms neuromuscular reflex window</tspan>, authority is fully delegated.
    </text>
  </g>

  <!-- Right Card: The Scope Decision Rule -->
  <g transform="translate(535, 850)">
    <rect width="465" height="106" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="465" height="26" rx="4" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="0" y="22" width="465" height="4" fill="#FEF2F2"/>
    <text x="14" y="17" font-size="10.5" font-weight="700" fill="#991B1B" letter-spacing="0.02em">THE ADJACENT DISCIPLINE FALLBACK RUBRIC</text>
    
    <text x="14" y="44" font-size="10.5" fill="#334155">
      <tspan font-weight="700" fill="#047857">• No Learned Model</tspan> → <tspan font-weight="600" fill="#0F172A">Classical Control Theory</tspan> (Lyapunov bounds, PID/MPC)
    </text>
    <text x="14" y="62" font-size="10.5" fill="#334155">
      <tspan font-weight="700" fill="#B91C1C">• No Physical Feedback</tspan> → <tspan font-weight="600" fill="#0F172A">Digital Autonomy</tspan> (Algorithmic trading, web agents)
    </text>
    <text x="14" y="80" font-size="10.5" fill="#334155">
      <tspan font-weight="700" fill="#1D4ED8">• No Physical Authority</tspan> → <tspan font-weight="600" fill="#0F172A">Advisory Systems</tspan> (Driver fatigue chime, diagnostics)
    </text>
    <text x="14" y="97" font-size="10" font-weight="700" fill="#64748B">
      Physical AI demands all three criteria simultaneously.
    </text>
  </g>

  <!-- Bottom Copyright / Metadata Footer -->
  <g transform="translate(520, 982)" text-anchor="middle">
    <text font-size="10" fill="#94A3B8">Machine Learning Systems for Physical AI · Foundations, Architectures, and System Realization</text>
  </g>
</svg>
