<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" width="860" height="760"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="860" height="760" fill="#FFFFFF" rx="4"/>

  <!-- Main Title -->
  <text x="430" y="38" font-size="18" font-weight="bold" fill="#1F407A" text-anchor="middle" letter-spacing="0.03em">
    THE THREE PILLARS OF PHYSICAL AI
  </text>
  <text x="430" y="60" font-size="12" fill="#64748B" text-anchor="middle">
    Physical AI exists strictly at the intersection of statistical learning, physical feedback, and delegated authority
  </text>

  <!-- Venn Circles (Radius 220, Centers: Top=(430, 280), BL=(310, 480), BR=(550, 480)) -->
  <g style="mix-blend-mode: multiply;">
    <!-- Top Circle: Learned Statistical Models (Navy) -->
    <circle cx="430" cy="280" r="220" fill="#F0F4FA" stroke="#1F407A" stroke-width="2.5" />
    
    <!-- Bottom Left Circle: Consequential Physical Feedback (Slate) -->
    <circle cx="310" cy="480" r="220" fill="#F8FAFC" stroke="#2D3748" stroke-width="2.5" />
    
    <!-- Bottom Right Circle: Delegated Physical Authority (Crimson) -->
    <circle cx="550" cy="480" r="220" fill="#FEF2F2" stroke="#A51C30" stroke-width="2.5" />
  </g>

  <!-- ==================== EXCLUSIVE REGIONS ==================== -->
  <!-- 1. Top Exclusive Lobe: Learned Statistical Models -->
  <text x="430" y="135" font-size="15" font-weight="bold" fill="#1F407A" text-anchor="middle">Learned Statistical Model</text>
  <text x="430" y="155" font-size="11" fill="#475569" text-anchor="middle">Unspecifiable Neural Policy</text>
  <text x="430" y="171" font-size="10" fill="#64748B" text-anchor="middle">(High Latency Deliberation · VLA / LLM)</text>

  <!-- 2. Bottom-Left Exclusive Lobe: Consequential Physical Feedback -->
  <text x="205" y="480" font-size="14.5" font-weight="bold" fill="#2D3748" text-anchor="middle">Consequential</text>
  <text x="205" y="500" font-size="14.5" font-weight="bold" fill="#2D3748" text-anchor="middle">Physical Feedback</text>
  <text x="205" y="522" font-size="10.5" fill="#64748B" text-anchor="middle">Continuous Dynamics &amp; Plant</text>
  <text x="205" y="538" font-size="9.5" fill="#64748B" text-anchor="middle">(Kinematic Inertia · Transduction)</text>

  <!-- 3. Bottom-Right Exclusive Lobe: Delegated Physical Authority -->
  <text x="655" y="480" font-size="14.5" font-weight="bold" fill="#A51C30" text-anchor="middle">Delegated</text>
  <text x="655" y="500" font-size="14.5" font-weight="bold" fill="#A51C30" text-anchor="middle">Physical Authority</text>
  <text x="655" y="522" font-size="10.5" fill="#A51C30" text-anchor="middle">Hard Real-Time Actuation</text>
  <text x="655" y="538" font-size="9.5" fill="#64748B" text-anchor="middle">(Certified Voltage / PWM u*)</text>

  <!-- ==================== TWO-SET INTERSECTIONS ==================== -->
  <!-- Top + Bottom-Left: Advisory Systems -->
  <text x="250" y="320" font-size="12" font-weight="bold" fill="#1F407A" text-anchor="middle">Advisory Systems</text>
  <text x="250" y="337" font-size="10" fill="#475569" text-anchor="middle">Human-in-the-Loop</text>
  <text x="250" y="351" font-size="9" fill="#64748B" text-anchor="middle">(Zero Direct Authority)</text>

  <!-- Top + Bottom-Right: Digital Autonomy -->
  <text x="610" y="320" font-size="12" font-weight="bold" fill="#1F407A" text-anchor="middle">Digital Autonomy</text>
  <text x="610" y="337" font-size="10" fill="#475569" text-anchor="middle">Software Agents / Web APIs</text>
  <text x="610" y="351" font-size="9" fill="#64748B" text-anchor="middle">(No Physical Contact)</text>

  <!-- Bottom-Left + Bottom-Right: Classical Control Theory -->
  <text x="430" y="505" font-size="12" font-weight="bold" fill="#2D3748" text-anchor="middle">Classical Control</text>
  <text x="430" y="523" font-size="10" fill="#475569" text-anchor="middle">PID · LQR · MPC</text>
  <text x="430" y="538" font-size="9" fill="#64748B" text-anchor="middle">(Analytic Models)</text>

  <!-- ==================== THREE-WAY CENTER INTERSECTION ==================== -->
  <rect x="340" y="388" width="180" height="42" rx="21" fill="#FFFFFF" stroke="#1F407A" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="430" y="414" font-size="15" font-weight="bold" fill="#1F407A" text-anchor="middle" letter-spacing="0.04em">PHYSICAL AI</text>
</svg>
