<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 574" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E40AF"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0E7490"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B45309"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B91C1C"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1060" height="574" fill="#FFFFFF"/>
  <g transform="translate(0, -46)">

  <!-- ==================== TIER 1: THE BRAIN (MPU / NPU) ==================== -->
  <g transform="translate(60, 72)">
    <rect width="880" height="154" rx="4" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.5"/>
    <rect width="880" height="4" rx="1" fill="#2563EB"/>
    
    <text x="20" y="26" font-size="15" font-weight="800" fill="#1E3A8A">1. THE BRAIN · Cognitive Deliberation Tier (MPU / NPU)</text>
    <text x="20" y="44" font-size="11" fill="#475569">High-capacity stochastic neural foundation models, spatial perception, and action chunking running under Linux / POSIX.</text>
    
    <!-- Subcard 1: Transduction & Sensing -->
    <g transform="translate(20, 58)">
      <rect width="260" height="82" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="24" font-size="12.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Transduction &amp; Sensing</text>
      <text x="130" y="44" font-size="10" fill="#475569" text-anchor="middle">Photons → MIPI CSI-2 Ring Buffers</text>
      <text x="130" y="62" font-size="9.5" fill="#64748B" text-anchor="middle">IMU · Encoders · Telemetry</text>
    </g>

    <line x1="280" y1="99" x2="308" y2="99" stroke="#1E40AF" stroke-width="1.8" marker-end="url(#arr-navy)"/>

    <!-- Subcard 2: Spatial World Model -->
    <g transform="translate(310, 58)">
      <rect width="260" height="82" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="24" font-size="12.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Spatial World Model</text>
      <text x="130" y="44" font-size="10" fill="#475569" text-anchor="middle">ViT Tokens → SE(3) Transform Trees</text>
      <text x="130" y="62" font-size="9.5" fill="#64748B" text-anchor="middle">3D Affordance · Latent Belief b<tspan baseline-shift="sub" font-size="7.5">t</tspan></text>
    </g>

    <line x1="570" y1="99" x2="598" y2="99" stroke="#1E40AF" stroke-width="1.8" marker-end="url(#arr-navy)"/>

    <!-- Subcard 3: Trajectory Deliberation -->
    <g transform="translate(600, 58)">
      <rect width="260" height="82" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="24" font-size="12.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Trajectory Deliberation</text>
      <text x="130" y="44" font-size="10" fill="#475569" text-anchor="middle">Diffusion Policy · ACT Action Chunks</text>
      <text x="130" y="62" font-size="9.5" fill="#2563EB" font-weight="600" text-anchor="middle">Proposes Candidate Trajectory û<tspan baseline-shift="sub" font-size="7.5">t:t+H</tspan></text>
    </g>
  </g>

  <!-- ==================== PRIVILEGE BOUNDARY RIBBON ==================== -->
  <g transform="translate(60, 240)">
    <line x1="0" y1="12" x2="880" y2="12" stroke="#B91C1C" stroke-width="1.8" stroke-dasharray="6,4"/>
    <!-- Center Pill -->
    <rect x="140" y="0" width="600" height="24" rx="3" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2"/>
    <text x="440" y="16" font-size="10" font-weight="800" fill="#991B1B" text-anchor="middle" letter-spacing="0.04em">
      PROPOSAL–PERMISSION PRIVILEGE BOUNDARY (Shared SRAM Mailbox · Untrusted û<tspan baseline-shift="sub" font-size="8">t</tspan> → Verified u*)
    </text>
  </g>

  <!-- Downward Arrow from Brain to Privilege Boundary -->
  <!-- Starts at right edge of Brain (940, 150) -> goes right to 980 -> goes down to 280 -> goes left into Nervous System -->
  <path d="M 940 149 L 980 149 L 980 270 L 943 270" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-amber)"/>
  <!-- Label above the arrow with white backing to prevent line clash -->
  <rect x="948" y="196" width="102" height="34" rx="3" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
  <text x="999" y="210" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">Candidate Proposal</text>
  <text x="999" y="222" font-size="9" font-weight="700" fill="#B45309" text-anchor="middle">û<tspan baseline-shift="sub" font-size="7.5">t:t+H</tspan></text>

  <!-- ==================== TIER 2: THE NERVOUS SYSTEM (MCU) ==================== -->
  <g transform="translate(60, 276)">
    <rect width="880" height="154" rx="4" fill="#F8FAFC" stroke="#67E8F9" stroke-width="1.5"/>
    <rect width="880" height="4" rx="1" fill="#0891B2"/>
    
    <text x="20" y="26" font-size="15" font-weight="800" fill="#0E7490">2. THE NERVOUS SYSTEM · Real-Time Safety &amp; Timing Tier (MCU)</text>
    <text x="20" y="44" font-size="11" fill="#475569">Isolated bare-metal / RTOS microcontroller executing deterministic 1 kHz safety filters with exclusive actuator authority.</text>
    
    <!-- Subcard 1: Information Freshness -->
    <g transform="translate(20, 58)">
      <rect width="260" height="82" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="24" font-size="12.5" font-weight="700" fill="#0E7490" text-anchor="middle">Information Freshness</text>
      <text x="130" y="44" font-size="10" fill="#475569" text-anchor="middle">Hardware Timer Capture</text>
      <text x="130" y="62" font-size="9.5" fill="#64748B" text-anchor="middle">Age Bound Δt ≤ τ<tspan baseline-shift="sub" font-size="7.5">max</tspan> · Freshness Check</text>
    </g>

    <line x1="280" y1="99" x2="308" y2="99" stroke="#0891B2" stroke-width="1.8" marker-end="url(#arr-teal)"/>

    <!-- Subcard 2: Reflex Enforcer (CBF-QP) -->
    <g transform="translate(310, 58)">
      <rect width="260" height="82" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="24" font-size="12.5" font-weight="700" fill="#0E7490" text-anchor="middle">Reflex Enforcer (CBF-QP)</text>
      <text x="130" y="44" font-size="10" fill="#475569" text-anchor="middle">Control Barrier Filter h(x) ≥ 0</text>
      <text x="130" y="62" font-size="9.5" fill="#64748B" text-anchor="middle">Stopping Envelope d<tspan baseline-shift="sub" font-size="7.5">stop</tspan> ≤ d<tspan baseline-shift="sub" font-size="7.5">clear</tspan></text>
    </g>

    <line x1="570" y1="99" x2="598" y2="99" stroke="#0891B2" stroke-width="1.8" marker-end="url(#arr-teal)"/>

    <!-- Subcard 3: Actuator Gate Latch -->
    <g transform="translate(600, 58)">
      <rect width="260" height="82" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="24" font-size="12.5" font-weight="700" fill="#0E7490" text-anchor="middle">Actuator Gate Latch</text>
      <text x="130" y="44" font-size="10" fill="#475569" text-anchor="middle">Vetoes Unsafe Proposals û<tspan baseline-shift="sub" font-size="7.5">t</tspan></text>
      <text x="130" y="62" font-size="9.5" fill="#0891B2" font-weight="600" text-anchor="middle">Latches Certified u* to PWM Registers</text>
    </g>
  </g>

  <!-- Downward Arrow from Nervous System to Body -->
  <path d="M 940 353 L 980 353 L 980 474 L 943 474" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="948" y="398" width="102" height="34" rx="3" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
  <text x="999" y="412" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">Certified Actuation</text>
  <text x="999" y="424" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">u*</text>

  <!-- ==================== TIER 3: THE BODY (CLASSICAL PHYSICS) ==================== -->
  <g transform="translate(60, 444)">
    <rect width="880" height="154" rx="4" fill="#F8FAFC" stroke="#FCA5A5" stroke-width="1.5"/>
    <rect width="880" height="4" rx="1" fill="#DC2626"/>
    
    <text x="20" y="26" font-size="15" font-weight="800" fill="#991B1B">3. THE BODY · Continuous Dynamical Plant (Classical Physics)</text>
    <text x="20" y="44" font-size="11" fill="#475569">Physical linkages, power inverters, and motor windings governed by mechanics, electromagnetism, and thermodynamics.</text>
    
    <!-- Subcard 1: Power Electronics -->
    <g transform="translate(20, 58)">
      <rect width="260" height="82" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="24" font-size="12.5" font-weight="700" fill="#991B1B" text-anchor="middle">Power Electronics</text>
      <text x="130" y="44" font-size="10" fill="#475569" text-anchor="middle">Gate Drivers · H-Bridge MOSFETs</text>
      <text x="130" y="62" font-size="9.5" fill="#64748B" text-anchor="middle">Phase Currents I<tspan baseline-shift="sub" font-size="7.5">phase</tspan> → Lorentz Torque τ</text>
    </g>

    <line x1="280" y1="99" x2="308" y2="99" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arr-red)"/>

    <!-- Subcard 2: Kinematics & Dynamics -->
    <g transform="translate(310, 58)">
      <rect width="260" height="82" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="24" font-size="12.5" font-weight="700" fill="#991B1B" text-anchor="middle">Kinematics &amp; Dynamics</text>
      <text x="130" y="44" font-size="10" fill="#475569" text-anchor="middle">Momentum p = mv · Contact Stress F = kΔx</text>
      <text x="130" y="62" font-size="9.5" fill="#64748B" text-anchor="middle">Thermodynamic Joule Heat ΔQ = I²RΔt</text>
    </g>

    <line x1="570" y1="99" x2="598" y2="99" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arr-red)"/>

    <!-- Subcard 3: Environment State Mutation -->
    <g transform="translate(600, 58)">
      <rect width="260" height="82" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="24" font-size="12.5" font-weight="700" fill="#991B1B" text-anchor="middle">Environment State Mutation</text>
      <text x="130" y="44" font-size="10" fill="#475569" text-anchor="middle">Material World Mutates W<tspan baseline-shift="sub" font-size="7.5">t</tspan> → W<tspan baseline-shift="sub" font-size="7.5">t+1</tspan></text>
      <text x="130" y="62" font-size="9.5" fill="#991B1B" font-weight="600" text-anchor="middle">Irreversible Work · No Rollback</text>
    </g>
  </g>

  <!-- ==================== UPWARD FEEDBACK LOOP FROM BODY TO BRAIN ==================== -->
  <!-- Left Side: From Body (60, 520) -> goes left to 28 -> goes up to 149 -> goes right to Brain (57, 149) -->
  <path d="M 60 520 L 44 520 L 44 149 L 57 149" fill="none" stroke="#B91C1C" stroke-width="2" marker-end="url(#arr-red)"/>
  
  <!-- Rotated Badge along Left Feedback Path -->
  <g transform="translate(20, 335) rotate(-90)">
    <rect x="-90" y="-11" width="180" height="22" rx="3" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="0" y="4" font-size="9.5" font-weight="700" fill="#991B1B" text-anchor="middle">
      Endogenous Sensory Shift (o<tspan baseline-shift="sub" font-size="7.5">t+1</tspan>)
    </text>
  </g>
</g>
</svg>
