<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#cbd5e1" stroke-width="0.75"/>
    </pattern>
    <pattern id="danger-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#fca5a5" stroke-width="1.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#4a90c4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#c44" />
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Header -->
  <g transform="translate(16, 16)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b" letter-spacing="0.2">
      CONTACT STIFFNESS &amp; THE SUB-30 MS DESTRUCTION CLIFF
    </text>
    <!-- Parameters Badge -->
    <rect x="362" y="-9" width="146" height="16" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="435" y="2.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#475569">
      k = 2.5×10⁵ N/m  |  v = 0.20 m/s
    </text>
  </g>

  <!-- Left Container: Physical Contact Interface (0 to 195px) -->
  <g transform="translate(16, 30)">
    <rect x="0" y="0" width="195" height="108" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="8" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#334155">
      PHYSICAL CONTACT PLANE (F = k·Δx)
    </text>

    <!-- Contact Plane label above wall -->
    <text x="68" y="21" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#475569">
      x = 0
    </text>

    <!-- Rigid Wall Fixture (Surface at x = 70) -->
    <!-- Elastic Safe Zone (0 to 6mm -> x = 70 to 106, width 36px) -->
    <rect x="70" y="24" width="36" height="60" fill="url(#hatch)" stroke="#94a3b8" stroke-width="0.75"/>
    
    <!-- Plastic / Failure Zone (>6mm -> x = 106 to 186, width 80px) -->
    <rect x="106" y="24" width="80" height="60" fill="url(#danger-hatch)" stroke="#f87171" stroke-width="0.75"/>

    <!-- Contact Boundary Line (x = 70) -->
    <line x1="70" y1="22" x2="70" y2="86" stroke="#334155" stroke-width="1.5"/>

    <!-- Robot Tool -->
    <path d="M 8 46 L 48 46 L 68 54 L 48 62 L 8 62 Z" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/>
    <text x="32" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e3a8a">
      Tool (v)
    </text>
    <line x1="18" y1="40" x2="42" y2="40" stroke="#4a90c4" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Yield threshold mark at 6mm (x = 106) -->
    <line x1="106" y1="24" x2="106" y2="86" stroke="#c44" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="106" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#c44">
      Δx_max = 6 mm
    </text>
    <text x="106" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6" fill="#7f1d1d">
      (F_yield = 1500 N)
    </text>

    <!-- 75ms OS stall penetration arrow to 15mm (x = 160) -->
    <line x1="70" y1="34" x2="156" y2="34" stroke="#c44" stroke-width="1.2" marker-end="url(#arrow-red)"/>
    <rect x="114" y="38" width="68" height="12" rx="2" fill="#fee2e2" stroke="#f87171" stroke-width="0.5"/>
    <text x="148" y="46.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#b91c1c">
      75ms stall: 15 mm
    </text>
  </g>

  <!-- Right Container: Control Cadence vs. 30 ms Deadline (218 to 524px) -->
  <g transform="translate(220, 30)">
    <rect x="0" y="0" width="304" height="108" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="8" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#334155">
      CONTROL CADENCE VS. DESTRUCTION DEADLINE (t_deadline = 30 ms)
    </text>

    <!-- Row 1: Bare-Metal Current Loop (1 kHz / 1 ms) -->
    <g transform="translate(10, 29)">
      <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14532d">
        1 kHz MCU Reflex (1 ms)
      </text>
      <text x="96" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#14532d">
        → Δx = 0.2 mm, F = 50 N
      </text>
      <!-- Bar: 1 ms -> 6 px -->
      <rect x="0" y="10" width="6" height="8" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
      <!-- Status Badge -->
      <rect x="210" y="5" width="76" height="13" rx="6.5" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
      <text x="248" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#14532d">
        SAFE (3% yield)
      </text>
    </g>

    <!-- Row 2: Neural Motion Policy (20 Hz / 50 ms) -->
    <g transform="translate(10, 50)">
      <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#78350f">
        20 Hz Neural Policy (50 ms)
      </text>
      <text x="110" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#78350f">
        → Δx = 10 mm, F = 2.5 kN
      </text>
      <!-- Bar: 50 ms -> 125 px -->
      <rect x="0" y="10" width="125" height="8" rx="1" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
      <!-- Status Badge -->
      <rect x="210" y="5" width="76" height="13" rx="6.5" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
      <text x="248" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#78350f">
        LATE (1.7× yield)
      </text>
    </g>

    <!-- Row 3: Linux OS Scheduling Jitter (75 ms) -->
    <g transform="translate(10, 71)">
      <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#b91c1c">
        Linux OS Stall / GC Jitter (75 ms)
      </text>
      <text x="122" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#b91c1c">
        → Δx = 15 mm, F = 3.75 kN
      </text>
      <!-- Bar: 75 ms -> 187 px -->
      <rect x="0" y="10" width="187" height="8" rx="1" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
      <!-- Status Badge -->
      <rect x="210" y="5" width="76" height="13" rx="6.5" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
      <text x="248" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#7f1d1d">
        TOOTH SHEAR (2.5×)
      </text>
    </g>

    <!-- Time Scale Reference & Vertical 30ms Destruction Deadline Line (drawn ON TOP of bars) -->
    <line x1="85" y1="20" x2="85" y2="92" stroke="#c44" stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="63" y="15" width="44" height="11" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="0.75"/>
    <text x="85" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#b91c1c">
      t = 30 ms
    </text>

    <!-- Footnote under bars -->
    <text x="10" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#64748b">
      Destruction cliff at 30 ms: shock force exceeds transmission yield rating before neural cycle completes.
    </text>
  </g>

  <!-- Bottom Takeaway Sub-card (Across 508px) -->
  <g transform="translate(16, 144)">
    <rect x="0" y="0" width="508" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <circle cx="10" cy="11" r="3.5" fill="#c44"/>
    <text x="20" y="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e293b">
      SYSTEM INVARIANT:
    </text>
    <text x="102" y="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#334155">
      Stiff contact (k ≥ 10⁵ N/m) compresses physical destruction deadlines below high-level planner cycle times.
    </text>
    <text x="20" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.8" fill="#64748b">
      Safety invariant enforcement must reside in a 1 kHz bare-metal reflex loop; neural policies cannot prevent contact shock loads.
    </text>
  </g>
</svg>
