<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="58.8 13.8 562.3 462.4"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="30.7" y="-9.3" width="618.5" height="508.6" fill="#ffffff"/>
  <rect width="680" height="490" fill="#ffffff"/>
  <g transform="translate(0 15)">

  <!-- Three coupled decisions; transparent fills preserve the set intersections. -->
  <circle cx="340" cy="165" r="155" fill="#F0FDFA" fill-opacity="0.08" stroke="#007A87" stroke-width="2"/>
  <circle cx="225" cy="295" r="155" fill="#EFF6FF" fill-opacity="0.08" stroke="#1F407A" stroke-width="2"/>
  <circle cx="455" cy="295" r="155" fill="#F8FAFC" fill-opacity="0.08" stroke="#334155" stroke-width="2"/>

  <!-- Each label sits in a protective card so circle arcs cannot cross text. -->
  <rect x="281" y="49" width="118" height="43" rx="3" fill="#ffffff" stroke="#007A87"/>
  <text x="340" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E">Sense</text>
  <text x="340" y="83" text-anchor="middle" font-size="10" fill="#475569">age + location</text>

  <rect x="92" y="278" width="130" height="43" rx="3" fill="#ffffff" stroke="#1F407A"/>
  <text x="157" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#1F407A">Plan</text>
  <text x="157" y="312" text-anchor="middle" font-size="10" fill="#475569">proposed path</text>

  <rect x="458" y="278" width="130" height="43" rx="3" fill="#ffffff" stroke="#334155"/>
  <text x="523" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Act</text>
  <text x="523" y="312" text-anchor="middle" font-size="10" fill="#475569">force + motion</text>

  <rect x="164" y="167" width="134" height="42" rx="3" fill="#ffffff" stroke="#475569"/>
  <text x="231" y="184" text-anchor="middle" font-size="10" font-weight="700" fill="#1E293B">Sense ∩ Plan</text>
  <text x="231" y="200" text-anchor="middle" font-size="10" fill="#475569">Where is it now?</text>

  <rect x="382" y="167" width="134" height="42" rx="3" fill="#ffffff" stroke="#475569"/>
  <text x="449" y="184" text-anchor="middle" font-size="10" font-weight="700" fill="#1E293B">Act ∩ Sense</text>
  <text x="449" y="200" text-anchor="middle" font-size="10" fill="#475569">What changed?</text>

  <rect x="268" y="365" width="144" height="42" rx="3" fill="#ffffff" stroke="#475569"/>
  <text x="340" y="382" text-anchor="middle" font-size="10" font-weight="700" fill="#1E293B">Plan ∩ Act</text>
  <text x="340" y="398" text-anchor="middle" font-size="10" fill="#475569">Can motion fit limits?</text>

  <rect x="263" y="252" width="154" height="38" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="340" y="275" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">Permission decision</text>
  </g>
</svg>
