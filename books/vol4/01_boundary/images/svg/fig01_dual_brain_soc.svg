<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 550" width="100%" height="100%">
  <defs>
    <style>
      .tier-hdr { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .cadence { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .box-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .flow-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 600; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="840" height="550" fill="#FFFFFF"/>

  <!-- ==================== TIER 1: PROPOSAL ENGINE (MPU) ==================== -->
  <g transform="translate(40, 25)">
    <rect width="760" height="105" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="24" y="24" class="tier-hdr" fill="#1E40AF">Proposal Engine (Linux MPU)</text>
    <text x="736" y="24" class="cadence" fill="#2563EB" text-anchor="end">10–50 Hz</text>

    <!-- Subcard: Perception -->
    <g transform="translate(60, 36)">
      <rect width="260" height="54" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="130" y="32" class="box-lbl" fill="#1E40AF">Perception</text>
    </g>

    <!-- Arrow Perception -> Policy -->
    <line x1="320" y1="63" x2="440" y2="63" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <!-- Subcard: Policy -->
    <g transform="translate(440, 36)">
      <rect width="260" height="54" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="130" y="32" class="box-lbl" fill="#1E40AF">Policy</text>
    </g>
  </g>

  <!-- ==================== TIER 2: SHARED SRAM MAILBOX ==================== -->
  <g transform="translate(40, 175)">
    <rect width="760" height="90" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="380" y="22" class="tier-hdr" fill="#334155" text-anchor="middle">Shared SRAM Mailbox</text>

    <!-- Slot 1: Telemetry Buffer (Left) -->
    <g transform="translate(60, 34)">
      <rect width="260" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="26" class="box-lbl" fill="#334155">Telemetry Buffer</text>
    </g>

    <!-- Slot 2: Action Buffer (Right) -->
    <g transform="translate(440, 34)">
      <rect width="260" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="26" class="box-lbl" fill="#334155">Action Buffer</text>
    </g>
  </g>

  <!-- Flow: Policy -> Action Buffer -->
  <line x1="570" y1="115" x2="570" y2="209" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <text x="582" y="155" class="flow-lbl" fill="#2563EB">Proposal û</text>

  <!-- Flow: Telemetry Buffer -> Perception -->
  <line x1="190" y1="209" x2="190" y2="115" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="178" y="155" class="flow-lbl" fill="#475569" text-anchor="end">Telemetry</text>

  <!-- ==================== TIER 3: PERMISSION AUTHORITY (MCU) ==================== -->
  <g transform="translate(40, 310)">
    <rect width="760" height="105" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="24" y="24" class="tier-hdr" fill="#166534">Permission Authority (MCU)</text>
    <text x="736" y="24" class="cadence" fill="#16A34A" text-anchor="end">1000 Hz</text>

    <!-- Subcard 1: Actuator Reflex (Left-Center) -->
    <g transform="translate(180, 36)">
      <rect width="220" height="54" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
      <text x="110" y="32" class="box-lbl" fill="#166534">Actuator Reflex</text>
    </g>

    <!-- Arrow Safety Filter -> Actuator Reflex -->
    <line x1="480" y1="63" x2="400" y2="63" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <!-- Subcard 2: Safety Filter (Right) -->
    <g transform="translate(480, 36)">
      <rect width="220" height="54" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
      <text x="110" y="32" class="box-lbl" fill="#166534">Safety Filter</text>
    </g>
  </g>

  <!-- Flow: Action Buffer -> Safety Filter -->
  <line x1="570" y1="251" x2="570" y2="346" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>

  <!-- Flow: Telemetry from MCU / Plant up to Telemetry Buffer -->
  <line x1="190" y1="346" x2="190" y2="251" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- ==================== TIER 4: ACTUATORS & PLANT ==================== -->
  <g transform="translate(40, 460)">
    <rect width="760" height="55" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
    <text x="380" y="33" class="box-lbl" font-size="13px" fill="#991B1B">Actuators &amp; Plant</text>
  </g>

  <!-- Flow: Actuator Reflex -> Actuators & Plant -->
  <line x1="290" y1="400" x2="290" y2="460" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-rose)"/>
  <text x="302" y="435" class="flow-lbl" fill="#DC2626">Command u*</text>

  <!-- Flow: Actuators Telemetry up into MCU -->
  <line x1="190" y1="460" x2="190" y2="415" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>
</svg>
