<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
  </defs>

  <rect width="800" height="880" fill="#FFFFFF" rx="4"/>

  <!-- Main Title -->
  <text x="400" y="30" font-size="16" font-weight="bold" fill="#1F407A" text-anchor="middle" letter-spacing="0.03em">
    DUAL-BRAIN HARDWARE SOC ARCHITECTURE
  </text>
  <text x="400" y="48" font-size="11" fill="#64748B" text-anchor="middle">
    Asymmetric Privilege Separation Between Deliberation (NPU) and Deterministic Safety (MCU)
  </text>

  <!-- Ingest Arrow from top -->
  <line x1="400" y1="58" x2="400" y2="76" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="415" y="70" font-size="10" font-weight="bold" fill="#475569">Sensor Ingestion (MIPI CSI-2 / IMU)</text>

  <!-- ==================== 1. UNTRUSTED PROPOSAL ENGINE ==================== -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="680" height="175" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="2"/>
    <rect x="0" y="0" width="680" height="26" rx="4" fill="#1F407A"/>
    <rect x="14" y="4" width="76" height="18" rx="3" fill="#FFFFFF" opacity="0.2"/>
    <text x="52" y="17" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1–50 Hz</text>
    <text x="102" y="18" font-size="12" font-weight="bold" fill="#FFFFFF">UNTRUSTED PROPOSAL ENGINE · APPLICATION PROCESSOR</text>
    <text x="666" y="18" font-size="10" font-weight="bold" fill="#93C5FD" text-anchor="end">Linux MPU / Edge NPU</text>

    <!-- Subcard 1: Neural Perception & World Model -->
    <g transform="translate(24, 42)">
      <rect x="0" y="0" width="300" height="115" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="150" y="24" font-size="12" font-weight="bold" fill="#1F407A" text-anchor="middle">Neural Encoders &amp; Belief</text>
      <text x="14" y="48" font-size="10" fill="#334155">• Multi-camera ViT tokenization</text>
      <text x="14" y="68" font-size="10" fill="#334155">• 3D depth &amp; SE(3) spatial state estimation</text>
      <text x="14" y="88" font-size="10" fill="#334155">• Latent predictive world belief (JEPA)</text>
    </g>

    <!-- Subcard 2: AI Planning & Action Chunking -->
    <g transform="translate(356, 42)">
      <rect x="0" y="0" width="300" height="115" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="150" y="24" font-size="12" font-weight="bold" fill="#1F407A" text-anchor="middle">Stochastic Policy &amp; Planner</text>
      <text x="14" y="48" font-size="10" fill="#334155">• VLA cross-attention deliberate task grounding</text>
      <text x="14" y="68" font-size="10" fill="#334155">• Action chunking generator (H=16 waypoints)</text>
      <text x="14" y="88" font-size="10" font-weight="bold" fill="#1F407A">• Emits unprivileged action proposal (û)</text>
    </g>
  </g>

  <!-- ==================== FLOWS: NPU <-> MAILBOX ==================== -->
  <!-- Action Proposals (NPU -> Mailbox) -->
  <line x1="230" y1="255" x2="230" y2="295" stroke="#1F407A" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-navy)"/>
  <text x="215" y="278" font-size="10" font-weight="bold" fill="#1F407A" text-anchor="end">Action Proposals (û)</text>

  <!-- Telemetry / State (Mailbox -> NPU) -->
  <line x1="570" y1="295" x2="570" y2="255" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="585" y="278" font-size="10" font-weight="bold" fill="#475569" text-anchor="start">Telemetry &amp; Odometry (o_t)</text>

  <!-- ==================== 2. SHARED MEMORY MAILBOX (IPC) ==================== -->
  <g transform="translate(60, 300)">
    <rect x="0" y="0" width="680" height="120" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.8" stroke-dasharray="6,4"/>
    <text x="340" y="24" font-size="12.5" font-weight="bold" fill="#2D3748" text-anchor="middle">
      SHARED SRAM MAILBOX · HARDWARE PRIVILEGE ISOLATION BOUNDARY
    </text>
    <text x="340" y="42" font-size="10" fill="#64748B" text-anchor="middle">
      Lock-Free Single-Producer Single-Consumer (SPSC) Seqlock · Zero-Copy Ring Buffers
    </text>

    <!-- Command Regs (Strict rx="0") -->
    <g transform="translate(50, 54)">
      <rect x="0" y="0" width="260" height="52" rx="0" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.5"/>
      <text x="130" y="22" font-size="11" font-weight="bold" fill="#1F407A" text-anchor="middle">Proposal Mailbox: Command Regs</text>
      <text x="130" y="40" font-size="9" fill="#64748B" text-anchor="middle">Chunk waypoints û_{t:t+H} · CRC · TTL Lease</text>
    </g>

    <!-- Status Regs (Strict rx="0") -->
    <g transform="translate(370, 54)">
      <rect x="0" y="0" width="260" height="52" rx="0" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
      <text x="130" y="22" font-size="11" font-weight="bold" fill="#2D3748" text-anchor="middle">Telemetry Mailbox: Status Regs</text>
      <text x="130" y="40" font-size="9" fill="#64748B" text-anchor="middle">Joint encoders q, q̇ · Inverter temperature · Faults</text>
    </g>
  </g>

  <!-- ==================== FLOWS: MAILBOX <-> MCU ==================== -->
  <!-- Read Proposals (Mailbox -> MCU) -->
  <line x1="230" y1="420" x2="230" y2="460" stroke="#1F407A" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-navy)"/>
  <text x="215" y="443" font-size="10" font-weight="bold" fill="#1F407A" text-anchor="end">Read Proposals (û)</text>

  <!-- Write Status (MCU -> Mailbox) -->
  <line x1="570" y1="460" x2="570" y2="420" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="585" y="443" font-size="10" font-weight="bold" fill="#475569" text-anchor="start">Write Telemetry (cseq)</text>

  <!-- ==================== 3. TRUSTED PERMISSION AUTHORITY ==================== -->
  <g transform="translate(60, 465)">
    <rect x="0" y="0" width="680" height="175" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="2.5"/>
    <rect x="0" y="0" width="680" height="26" rx="4" fill="#FEF2F2"/>
    <rect x="14" y="4" width="76" height="18" rx="3" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="52" y="17" font-size="9.5" font-weight="bold" fill="#A51C30" text-anchor="middle">1000 Hz</text>
    <text x="102" y="18" font-size="12" font-weight="bold" fill="#A51C30">TRUSTED PERMISSION AUTHORITY · SAFETY ENFORCER</text>
    <text x="666" y="18" font-size="10" font-weight="bold" fill="#A51C30" text-anchor="end">Bare-Metal Real-Time MCU</text>

    <!-- Subcard 1: Secure Boot -->
    <g transform="translate(24, 42)">
      <rect x="0" y="0" width="198" height="115" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="99" y="24" font-size="11" font-weight="bold" fill="#2D3748" text-anchor="middle">Hardware Trust</text>
      <text x="10" y="48" font-size="9.5" fill="#475569">• Immutable secure boot</text>
      <text x="10" y="68" font-size="9.5" fill="#475569">• Watchdog timer reset</text>
      <text x="10" y="88" font-size="9.5" fill="#475569">• Memory isolation MPUs</text>
      <text x="10" y="104" font-size="8" fill="#64748B">Zero dynamic allocation</text>
    </g>

    <!-- Subcard 2: Safety Filter CBF -->
    <g transform="translate(241, 42)">
      <rect x="0" y="0" width="198" height="115" rx="3" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.5"/>
      <text x="99" y="24" font-size="11" font-weight="bold" fill="#A51C30" text-anchor="middle">Control Barrier Filter</text>
      <text x="10" y="48" font-size="9.5" font-weight="600" fill="#A51C30">• Barrier h(x) ≥ 0 solver</text>
      <text x="10" y="68" font-size="9.5" fill="#475569">• Kinematic limit checks</text>
      <text x="10" y="88" font-size="9.5" fill="#475569">• Stopping envelope guard</text>
      <text x="10" y="104" font-size="8" font-weight="bold" fill="#A51C30">Instant veto on violation</text>
    </g>

    <!-- Subcard 3: Reflex Loop -->
    <g transform="translate(458, 42)">
      <rect x="0" y="0" width="198" height="115" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="99" y="24" font-size="11" font-weight="bold" fill="#2D3748" text-anchor="middle">Deterministic Reflex</text>
      <text x="10" y="48" font-size="9.5" fill="#475569">• 1000 Hz RTOS cycle</text>
      <text x="10" y="68" font-size="9.5" fill="#475569">• Jitter &lt; 5 microseconds</text>
      <text x="10" y="88" font-size="9.5" fill="#475569">• Latches certified cmd u*</text>
      <text x="10" y="104" font-size="8" fill="#64748B">PWM compare registers</text>
    </g>
  </g>

  <!-- ==================== CERTIFIED COMMAND FLOW ==================== -->
  <line x1="400" y1="640" x2="400" y2="685" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="415" y="666" font-size="10.5" font-weight="bold" fill="#A51C30">Certified Control Signals (u*)</text>

  <!-- ==================== 4. PHYSICAL MOTOR ACTUATORS ==================== -->
  <g transform="translate(60, 690)">
    <rect x="0" y="0" width="680" height="90" rx="4" fill="#2D3748" stroke="#1F407A" stroke-width="2"/>
    <text x="340" y="32" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.03em">
      PHYSICAL MOTOR ACTUATORS &amp; CONTINUOUS PLANT
    </text>
    <text x="340" y="52" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      PWM Gate Inverters · Phase Currents · Lorentz Force → Mechanical Torque (τ) → Momentum (mv)
    </text>
    <text x="340" y="72" font-size="9.5" fill="#94A3B8" text-anchor="middle">
      Stopping distance envelope d_stop ≤ d_clear · Irreversible physical contact and dissipation
    </text>
  </g>

  <!-- Bottom Principle Quote -->
  <g transform="translate(60, 796)">
    <rect x="0" y="0" width="680" height="30" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="340" y="19" font-size="10" font-style="italic" fill="#2D3748" text-anchor="middle">
      "Everything upstream proposes, nothing upstream commands; only the safety filter commands."
    </text>
  </g>
</svg>
