  <text x="483" y="354" font-size="10" font-weight="400" fill="#4A5568" text-anchor="middle">Ch. 15</text>
  <rect x="538" y="310" width="82" height="50" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
