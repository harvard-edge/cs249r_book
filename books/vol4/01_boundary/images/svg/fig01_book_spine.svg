  <text x="38" y="57" font-size="11.5" font-weight="700" fill="#1A4D3E">I · Irreversibility</text>
  <text x="248" y="57" font-size="11.5" font-weight="700" fill="#1A4D3E">II · Endogenous data</text>
  <text x="248" y="249" font-size="11.5" font-weight="700" fill="#1A4D3E">III · Proposal is not permission</text>
  <text x="344" y="391" font-size="11.5" font-weight="700" fill="#1A4D3E">IV · Evidence bounds authority</text>
  <!-- ===== Chapter 1 question ===== -->
  <text x="30" y="26" font-size="11.5" font-weight="700" fill="#1A202C">Ch. 1<tspan dx="6" font-weight="400" font-style="italic" fill="#4A5568">What must be guaranteed?</tspan></text>
  <!-- ===== Part I: limit record, handoff record (Ch3 supplies proposer limits) ===== -->
