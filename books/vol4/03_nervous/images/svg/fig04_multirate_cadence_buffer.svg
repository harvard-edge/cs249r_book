<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">\n<defs>\n<style>\n.title { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1F407A; }\n.label { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; fill: #2D3748; }\n.small-label { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #2D3748; }\n.tiny-label { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 10px; fill: #2D3748; }\n.box-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #FFFFFF; font-weight: bold; }\n.line { stroke: #2D3748; stroke-width: 2; fill: none; }\n.arrow { stroke: #1F407A; stroke-width: 2; fill: none; }\n.arrow-red { stroke: #A51C30; stroke-width: 2; fill: none; }\n</style>\n<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">\n  <polygon points="0 0, 10 3.5, 0 7" fill="#1F407A" />\n</marker>\n<marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">\n  <polygon points="0 0, 10 3.5, 0 7" fill="#A51C30" />\n</marker>\n</defs>\n<rect width="900" height="650" fill="#FFFFFF"/>\n<text x="30" y="30" class="title">Panel A: Multi-Rate Execution Cadence</text>\n<line x1="120" y1="70" x2="850" y2="70" class="line"/>\n<polygon points="850,66 858,70 850,74" fill="#2D3748"/>\n<line x1="120" y1="140" x2="850" y2="140" class="line"/>\n<polygon points="850,136 858,140 850,144" fill="#2D3748"/>\n<line x1="120" y1="210" x2="850" y2="210" class="line"/>\n<polygon points="850,206 858,210 850,214" fill="#2D3748"/>\n<text x="110" y="55" class="label" text-anchor="end">Perception</text>\n<text x="110" y="75" class="small-label" text-anchor="end">(50-100 Hz)</text>\n<text x="110" y="125" class="label" text-anchor="end">Policy</text>\n<text x="110" y="145" class="small-label" text-anchor="end">(50 Hz)</text>\n<text x="110" y="195" class="label" text-anchor="end">Reflex Control</text>\n<text x="110" y="215" class="small-label" text-anchor="end">(1000 Hz)</text>\n<rect x="120" y="55" width="120" height="30" fill="#4A5568" stroke="#2D3748" stroke-width="1.5"/>\n<text x="180.0" y="74.0" class="box-text" text-anchor="middle">Exposure</text>\n<rect x="360" y="55" width="120" height="30" fill="#4A5568" stroke="#2D3748" stroke-width="1.5"/>\n<text x="420.0" y="74.0" class="box-text" text-anchor="middle">Exposure</text>\n<rect x="600" y="55" width="120" height="30" fill="#4A5568" stroke="#2D3748" stroke-width="1.5"/>\n<text x="660.0" y="74.0" class="box-text" text-anchor="middle">Exposure</text>\n<rect x="240" y="120" width="240" height="40" fill="#1F407A" stroke="#1a365d" stroke-width="1.5"/>\n<text x="360.0" y="144.0" class="box-text" text-anchor="middle">Policy Deliberation (20 ms)</text>\n<rect x="480" y="120" width="264" height="40" fill="#A51C30" stroke="#7b1523" stroke-width="1.5"/>\n<text x="612.0" y="144.0" class="box-text" text-anchor="middle">Tail Overrun (22 ms)</text>\n<rect x="744" y="120" width="96" height="40" fill="#1F407A" stroke="#1a365d" stroke-width="1.5"/>\n<text x="792.0" y="144.0" class="box-text" text-anchor="middle">Policy</text>\n<line x1="120" y1="202" x2="120" y2="218" class="line"/>\n<text x="120" y="230" class="small-label" text-anchor="middle">0 ms</text>\n<line x1="132" y1="206" x2="132" y2="214" class="line"/>\n<line x1="144" y1="206" x2="144" y2="214" class="line"/>\n<line x1="156" y1="206" x2="156" y2="214" class="line"/>\n<line x1="168" y1="206" x2="168" y2="214" class="line"/>\n<line x1="180" y1="206" x2="180" y2="214" class="line"/>\n<line x1="192" y1="206" x2="192" y2="214" class="line"/>\n<line x1="204" y1="206" x2="204" y2="214" class="line"/>\n<line x1="216" y1="206" x2="216" y2="214" class="line"/>\n<line x1="228" y1="206" x2="228" y2="214" class="line"/>\n<line x1="240" y1="202" x2="240" y2="218" class="line"/>\n<text x="240" y="230" class="small-label" text-anchor="middle">10 ms</text>\n<line x1="252" y1="206" x2="252" y2="214" class="line"/>\n<line x1="264" y1="206" x2="264" y2="214" class="line"/>\n<line x1="276" y1="206" x2="276" y2="214" class="line"/>\n<line x1="288" y1="206" x2="288" y2="214" class="line"/>\n<line x1="300" y1="206" x2="300" y2="214" class="line"/>\n<line x1="312" y1="206" x2="312" y2="214" class="line"/>\n<line x1="324" y1="206" x2="324" y2="214" class="line"/>\n<line x1="336" y1="206" x2="336" y2="214" class="line"/>\n<line x1="348" y1="206" x2="348" y2="214" class="line"/>\n<line x1="360" y1="202" x2="360" y2="218" class="line"/>\n<text x="360" y="230" class="small-label" text-anchor="middle">20 ms</text>\n<line x1="372" y1="206" x2="372" y2="214" class="line"/>\n<line x1="384" y1="206" x2="384" y2="214" class="line"/>\n<line x1="396" y1="206" x2="396" y2="214" class="line"/>\n<line x1="408" y1="206" x2="408" y2="214" class="line"/>\n<line x1="420" y1="206" x2="420" y2="214" class="line"/>\n<line x1="432" y1="206" x2="432" y2="214" class="line"/>\n<line x1="444" y1="206" x2="444" y2="214" class="line"/>\n<line x1="456" y1="206" x2="456" y2="214" class="line"/>\n<line x1="468" y1="206" x2="468" y2="214" class="line"/>\n<line x1="480" y1="202" x2="480" y2="218" class="line"/>\n<text x="480" y="230" class="small-label" text-anchor="middle">30 ms</text>\n<line x1="492" y1="206" x2="492" y2="214" class="line"/>\n<line x1="504" y1="206" x2="504" y2="214" class="line"/>\n<line x1="516" y1="206" x2="516" y2="214" class="line"/>\n<line x1="528" y1="206" x2="528" y2="214" class="line"/>\n<line x1="540" y1="206" x2="540" y2="214" class="line"/>\n<line x1="552" y1="206" x2="552" y2="214" class="line"/>\n<line x1="564" y1="206" x2="564" y2="214" class="line"/>\n<line x1="576" y1="206" x2="576" y2="214" class="line"/>\n<line x1="588" y1="206" x2="588" y2="214" class="line"/>\n<line x1="600" y1="202" x2="600" y2="218" class="line"/>\n<text x="600" y="230" class="small-label" text-anchor="middle">40 ms</text>