dle">C≤240μs</text>\n<line x1="632.4" y1="290" x2="830" y2="290" stroke="#A51C30" stroke-width="2" stroke-dasharray="2,2"/>\n<text x="731.1999999999999" y="285" class="tiny-label" fill="#A51C30" text-anchor="middle">760 μs margin</text>\n<line x1="744" y1="220" x2="550" y2="250" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4,4"/>\n<line x1="756" y1="220" x2="850" y2="250" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4,4"/>\n<path fill="none" d="M 240 85 L 240 120" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>\n<path fill="none" d="M 480 85 L 480 120" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>\n<path fill="none" d="M 480 160 L 480 190" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-red)"/>\n<path fill="none" d="M 744 160 L 744 190" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-red)"/>\n<text x="485" y="180" class="tiny-label" fill="#A51C30">Write to Buffer</text>\n<line x1="30" y1="350" x2="870" y2="350" stroke="#E2E8F0" stroke-width="2"/>\n<text x="30" y="380" class="title">Panel B: SPSC Seqlock Triple-Buffer Architecture</text>\n<rect x="80" y="440" width="160" height="120" fill="#F7FAFC" stroke="#2D3748" stroke-width="2"/>\n<text x="160" y="465" class="label" font-weight="bold" text-anchor="middle">Application Processor</text>\n<text x="160" y="485" class="small-label" text-anchor="middle">(Producer, 50 Hz)</text>\n<rect x="100" y="500" width="120" height="40" fill="#1F407A" stroke="#1a365d" stroke-width="1.5"/>\n<text x="160" y="524" class="box-text" text-anchor="middle">Write Chunk</text>\n<rect x="660" y="440" width="160" height="120" fill="#F7FAFC" stroke="#2D3748" stroke-width="2"/>\n<text x="740" y="465" class="label" font-weight="bold" text-anchor="middle">Real-Time MCU</text>\n<text x="740" y="485" class="small-label" text-anchor="middle">(Consumer, 1000 Hz)</text>\n<rect x="680" y="500" width="120" height="40" fill="#A51C30" stroke="#7b1523" stroke-width="1.5"/>\n<text x="740" y="524" class="box-text" text-anchor="middle">Latch Latest</text>\n<rect x="340" y="420" width="220" height="170" fill="#EDF2F7" stroke="#4A5568" stroke-width="2"/>\n<text x="450" y="445" class="label" font-weight="bold" text-anchor="middle">Shared Memory (Triple Buffer)</text>\n<rect x="360" y="460" width="180" height="30" fill="#FFFFFF" stroke="#2D3748" stroke-width="1.5"/>\n<text x="370" y="480" class="small-label">Buffer 0:</text>\n<text x="440" y="480" class="small-label" fill="#A51C30" font-style="italic">Inactive (Write)</text>\n<rect x="360" y="500" width="180" height="30" fill="#E2E8F0" stroke="#2D3748" stroke-width="1.5"/>\n<text x="370" y="520" class="small-label">Buffer 1:</text>\n<text x="440" y="520" class="small-label" fill="#1F407A" font-weight="bold">Newest Committed</text>\n<rect x="360" y="540" width="180" height="30" fill="#FFFFFF" stroke="#2D3748" stroke-width="1.5"/>\n<text x="370" y="560" class="small-label">Buffer 2:</text>\n<text x="440" y="560" class="small-label" font-style="italic">Active (Read)</text>\n<rect x="390" y="605" width="120" height="30" fill="#F7FAFC" stroke="#2D3748" stroke-width="1.5"/>\n<text x="450" y="625" class="small-label" font-weight="bold" text-anchor="middle">seqlock: cseq</text>\n<path fill="none" d="M 220 520 L 290 520 L 290 475 L 350 475" class="arrow" marker-end="url(#arrowhead)"/>\n<text x="290" y="470" class="tiny-label" text-anchor="middle">Write Data</text>\n<path d="M 160 540 L 160 620 L 380 620" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowhead)"/>\n<rect x="180" y="585" width="130" height="24" fill="#FFFFFF" stroke="#CBD5E0"/>\n<text x="245" y="601" class="tiny-label" text-anchor="middle">1. atomic_store(odd)</text>\n<rect x="180" y="625" width="130" height="24" fill="#FFFFFF" stroke="#CBD5E0"/>\n<text x="245" y="641" class="tiny-label" text-anchor="middle">2. atomic_store(even)</text>\n<path fill="none" d="M 540 555 L 610 555 L 610 520 L 670 520" class="arrow-red" marker-end="url(#arrowhead-red)"/>\n<text x="610" y="515" class="tiny-label" text-anchor="middle">Read Data</text>\n<path d="M 740 540 L 740 620 L 520 620" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowhead-red)"/>\n<rect x="580" y="605" width="130" height="30" fill="#FFFFFF" stroke="#CBD5E0"/>\n<text x="645" y="618" class="tiny-label" text-anchor="middle">Check cseq (even)</text>\n<text x="645" y="630" class="tiny-label" text-anchor="middle">Verify no tearing</text>\n</svg>