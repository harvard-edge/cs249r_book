    relationships:
    - id: vol4.field.timing-feedback-delay--control-phase-margin
      source: vol4.timing.feedback-delay
      predicate: consumes
      target: vol4.control.phase-margin
      explanation: Delay adds phase lag and can erode the stability reserve of a feedback loop.
      conditions: Evaluate delay at the relevant loop crossover frequency; phase margin is not the capture-to-brake
        clearance budget.
      status: draft
      evidence:
        section: sec-nervous-time-constants-phase-lag
        quote: The current-loop rate follows directly from the winding's electrical time constant $\PhaseInductance/\PhaseResistance$,
          and the loop closes within the drive's local inverter. The harder timing question arises one level
          up, at the joint. There, inertia and structural compliance set the required closed-loop bandwidth,
          and every digital stage between sensor and actuator (sampling, computation, bus transport) exacts
          a penalty in phase lag. The crossover frequency $\CrossoverFrequency$ marks the point where open-loop
          gain equals unity. At this frequency, the phase margin[^fn-phase-margin-bode] defines the maximum
          additional phase lag the system can absorb before feedback transitions from stabilizing attenuation
          to self-reinforcing oscillation.
    - id: vol4.field.timing-response-bound--authority-chunk-lease
      source: vol4.timing.response-bound
      predicate: bounds overhead around
      target: vol4.authority.chunk-lease
      explanation: Lease sizing must leave time for the permission path and stopping response rather than
        treating lease duration as the entire delay budget.
      conditions: Include the exact timing events charged by the stopping claim and the declared worst-case
        response; empirical latency percentiles cannot substitute.
      status: draft
      evidence:
        section: sec-nervous-coupled-budget
        quote: 'These constraints dictate the **lease rule**\index{Chunk lease!lease rule} for the machine.
          For continuous, uninterrupted trajectory tracking, the lease duration must exceed the proposer''s
          renewal interval plus an allowance for tail jitter. Simultaneously, to guarantee physical safety,
          the lease must fit within the pre-brake ceiling of @eq-nervous-prebrake once detection latency,
          bus transport, actuator brake onset, and sensor evidence age at admission are deducted:

          $$\ChunkRenewalPeriod + \RenewalJitterAllowance < \ChunkLease \le \frac{\ClearDistance - \LocalizationBound
          - \ProtectiveClearanceMargin - \SpeedAtDetection^2/2\CredibleBrakingDeceleration}{\SpeedAtDetection}
          - \PermissionLoopPeriod - \CommandTransportTime - \ActuatorResponseTime - \ObservationAge$$ {#eq-nervous-lease-rule}

          where $\ChunkRenewalPeriod$ is the chunk policy''s nominal renewal period, $\RenewalJitterAllowance$
          is the margin allocated for interarrival timing variations, and $\ObservationAge$ is charged as
          the evidence''s age at admission, rows 1 and 2 of @tbl-04-event-timing together, not its age at
          dispatch alone. This inequality captures the coupled cyber-physical budget in a single mathematical
          relation. The left side reflects compute supply, bounded by the neural proposer. The first term
          on the right reflects physical mechanics, governed by vehicle speed, workspace clearance, and
          braking deceleration. The remaining subtractive terms account for detection and communication
          delays, actuator brake onset, and the observation age accumulated across the perception pipeline.
          A faster vehicle, a less aggressive brake, or a tighter workspace lowers the upper bound; a slower
          or more jitter-prone neural network raises the lower bound. If the two bounds cross, no lease
          can preserve both uninterrupted proposal tracking and the stopping guarantee at that velocity;
          the permission path must interrupt tracking before authority expires.'
    - id: vol4.field.authority-chunk-lease--proposal-chunk
      source: vol4.authority.chunk-lease
      predicate: bounds stale execution of
      target: vol4.proposal.chunk
      explanation: The permission processor expires an admitted chunk even when a stalled proposer leaves
        old setpoints available.
      conditions: Expiry must be enforced independently of the failed host and lead to a state-matched,
        qualified fallback.
      status: draft
      evidence:
        section: sec-nervous-lease-sizing
        quote: '***Chunk lease***\index{Chunk lease!definition}\index{Lease!stopping budget} is the interval,
          counted on the permission path''s own clock from a chunk''s admission, during which that admitted
          chunk may keep driving the actuators without a successful replacement; when it expires, the permission
          path ends the chunk''s authority and commands the state-matched fallback, a stop profile chosen
          from the machine''s measured speed and pose.'
    - id: vol4.field.authority-actuation--intervention-handoff
      source: vol4.authority.actuation
      predicate: is exclusive across
      target: vol4.intervention.handoff
      explanation: All energizing routes must obey the same exclusive writer, including diagnostics and
        auxiliary bus masters.
      conditions: A handoff protocol alone does not establish exclusivity if an unmediated hardware route
        remains.
      status: draft
      evidence:
        section: sec-nervous-actuation-authority
        quote: A shared mailbox cannot protect a mobile manipulator if the host processor retains a diagnostic
          route, an auxiliary bus master, or a JTAG debug port that writes directly to a drive. The silicon
          partition established in @sec-nervous-silicon-partitioning therefore requires exclusive physical
          control over every electrical path capable of energizing the motor windings. Actuation authority
          is this exclusive physical ability to modify drive states, encompassing PWM configuration registers,
          current references, gate-driver outputs, and bridge-enable lines. Under this architecture, the
          host publishes candidate proposals $\CandidateProposal_t$ and the safety microcontroller's permission
          path alone turns them into admitted commands $\AdmittedCommand_t$. The difference between holding
          that authority and merely appearing to is a question of wiring (@fig-04-privilege-enforcer-registers).
          When the permission path is the sole writer of the drive registers and can trip a drive inhibit,
          every motion passes its checks. When the host can also write those registers, one unchecked write
          reaches the motors, and proposer and drives share a single failure domain.
    - id: vol4.field.authority-actuation--boundary-causal
      source: vol4.authority.actuation
      predicate: controls commands crossing the
      target: vol4.boundary.causal
      explanation: The exclusive actuator writer controls the electrical routes by which an admitted command
        becomes physical work.
      conditions: The claim requires exclusive control of every energizing route, including debug and diagnostic
        paths; a logical mailbox alone is insufficient.
      status: draft
      evidence:
        section: sec-nervous-actuation-authority
        quote: A shared mailbox cannot protect a mobile manipulator if the host processor retains a diagnostic
          route, an auxiliary bus master, or a JTAG debug port that writes directly to a drive. The silicon
          partition established in @sec-nervous-silicon-partitioning therefore requires exclusive physical
          control over every electrical path capable of energizing the motor windings. Actuation authority
          is this exclusive physical ability to modify drive states, encompassing PWM configuration registers,
          current references, gate-driver outputs, and bridge-enable lines. Under this architecture, the
          host publishes candidate proposals $\CandidateProposal_t$ and the safety microcontroller's permission
          path alone turns them into admitted commands $\AdmittedCommand_t$. The difference between holding
          that authority and merely appearing to is a question of wiring (@fig-04-privilege-enforcer-registers).
          When the permission path is the sole writer of the drive registers and can trip a drive inhibit,
          every motion passes its checks. When the host can also write those registers, one unchecked write
          reaches the motors, and proposer and drives share a single failure domain.
    - id: vol4.field.timing-response-bound--timing-feedback-delay
      source: vol4.timing.response-bound
      predicate: limits worst-case
      target: vol4.timing.feedback-delay
      explanation: A response-time analysis bounds the delay of the analyzed path, protecting phase margin
        when the feedback loop closes through that path.
      conditions: This link applies only to a feedback loop containing the analyzed computation and transfer
        stages; feedforward reference lag is a different quantity.
      status: draft
      evidence:
        section: sec-nervous-deterministic-fieldbuses
        quote: 'A profiling campaign can run the permission tick for days without a missed deadline and
          still not establish the tick''s worst case. An empirical percentile says how often sampled executions
          stayed under a threshold. It says nothing about executions that meet a combination of competing
          tasks, memory contention, or peripheral delay the campaign never produced. The lease budget needs
          the other kind of number: a response-time bound that accounts for every unit of permitted computation
          and queuing delay along the critical path under defined operating conditions. In an embodied system,
          timing determinism protects both stability and safety, because delayed feedback erodes the controller''s
          phase margin and delayed actuation consumes stopping clearance before the chassis can decelerate.
          Bounding the tick on the microcontroller comes first; bounding the drive network that carries
          its admitted setpoints to the motors follows the same logic [@kopetz2011real].'
