<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-nominal" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#3d9e5a"/>
    </marker>
    <marker id="arrow-hazard" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#c44"/>
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Top Banner -->
  <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b">LOCK-FREE SEQLOCK: ATOMIC SEQUENCE PARITY &amp; COLLISION BOUNDS</text>
  <text x="524" y="20" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#64748b">SPSC Mailbox Dynamics</text>

  <!-- Sub-card (a): Atomic Parity Validation -->
  <g id="subcard-a">
    <rect x="16" y="28" width="246" height="136" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="26" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b">(a) Atomic Parity Check (Zero Locks)</text>
    <text x="26" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#64748b">Sequence counter parity detects torn writes</text>

    <!-- Writer Atomic Sequence Box -->
    <rect x="26" y="58" width="226" height="32" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="31" y="68.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#78350f">WRITER PROTOCOL (20 Hz Host, 1.4 kB):</text>
    
    <!-- State 1: 12 [EVEN] -->
    <rect x="31" y="72.5" width="46" height="13" rx="6.5" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.5"/>
    <text x="54" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" fill="#14532d">12 [EVEN]</text>
    
    <path d="M 79 79 H 85" stroke="#64748b" stroke-width="1" marker-end="url(#arrow-neutral)"/>

    <!-- State 2: 13 [ODD] -->
    <rect x="88" y="72.5" width="54" height="13" rx="6.5" fill="#f9d6d5" stroke="#c44" stroke-width="0.5"/>
    <text x="115" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" fill="#7f1d1d">13 [WRITE]</text>
    
    <path d="M 144 79 H 150" stroke="#64748b" stroke-width="1" marker-end="url(#arrow-neutral)"/>

    <!-- State 3: 14 [EVEN] -->
    <rect x="153" y="72.5" width="52" height="13" rx="6.5" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.5"/>
    <text x="179" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" fill="#14532d">14 [VALID]</text>

    <text x="212" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" fill="#78350f">1.5 µs</text>

    <!-- Reader Detection Box -->
    <rect x="26" y="94" width="226" height="34" rx="3" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
    <text x="31" y="104.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#1e3a8a">READER VALIDATION (1 kHz MCU, 1.0 ms):</text>
    <text x="31" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#1e3a8a">Check: (c_start == c_end) &amp;&amp; !(c_start &amp; 1)</text>
    <text x="31" y="123.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" fill="#c44">Odd/mismatch detected in &lt; 150 ns &#x2192; Discard torn frame</text>

    <!-- Bottom Outcome Pill Subcard A -->
    <rect x="26" y="134" width="226" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
    <rect x="31" y="137.5" width="56" height="15" rx="7.5" fill="#3d9e5a"/>
    <text x="59" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff">LOCK-FREE</text>
    <text x="94" y="148.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#14532d">Zero mutex · Zero priority inversion</text>
  </g>

  <!-- Sub-card (b): Consecutive Collision Invariance -->
  <g id="subcard-b">
    <rect x="278" y="28" width="246" height="136" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="288" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b">(b) Consecutive Collision Invariance</text>
    <text x="288" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#64748b">Write (1.5 µs) &lt;&lt; Reader period (1000 µs)</text>

    <!-- Timeline Container -->
    <rect x="288" y="58" width="226" height="70" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
    
    <!-- Timeline Axis -->
    <line x1="298" y1="77" x2="504" y2="77" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Tick k (Torn Read) -->
    <line x1="312" y1="71" x2="312" y2="83" stroke="#c44" stroke-width="1.5"/>
    <text x="312" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#c44">Tick k</text>
    
    <!-- Write window: 1.5 µs -->
    <rect x="309" y="74" width="14" height="6" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="312" y="89" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#c44">Torn (1.5µs)</text>

    <!-- Idle Gap Indicator -->
    <path d="M 326 77 H 472" stroke="#3d9e5a" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="400" y="73" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="600" fill="#3d9e5a">Stable Window: 998.5 µs (No Writes)</text>

    <!-- Tick k+1 (Guaranteed Clean Read) -->
    <line x1="484" y1="71" x2="484" y2="83" stroke="#3d9e5a" stroke-width="1.5"/>
    <text x="484" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#3d9e5a">Tick k+1</text>
    <text x="484" y="89" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#14532d">Clean Read</text>

    <!-- Degradation / Spline Extrapolation callout -->
    <rect x="294" y="97" width="214" height="25" rx="2.5" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.5"/>
    <text x="298" y="107.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" fill="#1e3a8a">Torn Read Fallback (1.0 ms Hold):</text>
    <text x="298" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#1e3a8a">Extrapolate latched cubic spline: C² smooth (&#x394;x &lt; 0.05 mm)</text>

    <!-- Bottom Outcome Pill Subcard B -->
    <rect x="288" y="134" width="226" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
    <rect x="293" y="137.5" width="62" height="15" rx="7.5" fill="#3d9e5a"/>
    <text x="324" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff">P(CONSEC)=0</text>
    <text x="362" y="148.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#14532d">P(collision) = 0.006% · Zero spin-locks</text>
  </g>
</svg>