<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="380" fill="#FFFFFF"/>

  <!-- ==================================================================== -->
  <!-- STAGE 1: DUAL-CHANNEL E-STOP                                         -->
  <!-- ==================================================================== -->
  <g id="stage-estop" transform="translate(40, 50)">
    <!-- Container capsule -->
    <rect x="0" y="0" width="180" height="230" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
    <text x="90" y="30" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">Dual-Channel E-Stop</text>
    <text x="90" y="48" font-size="9.5" font-weight="600" fill="#991B1B" text-anchor="middle">Positive Break</text>

    <!-- Mushroom switch schematic -->
    <!-- Red button cap -->
    <path d="M 60 76 C 60 62, 120 62, 120 76 Z" fill="#DC2626" stroke="#B91C1C" stroke-width="1.2"/>
    <rect x="84" y="76" width="12" height="14" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>

    <!-- Mechanical Linkage -->
    <line x1="90" y1="90" x2="90" y2="200" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Contact S1 (NC) -->
    <circle cx="45" cy="125" r="3" fill="#334155"/>
    <circle cx="135" cy="125" r="3" fill="#334155"/>
    <line x1="48" y1="125" x2="132" y2="125" stroke="#059669" stroke-width="1.8"/>

    <!-- Contact S2 (NC) -->
    <circle cx="45" cy="175" r="3" fill="#334155"/>
    <circle cx="135" cy="175" r="3" fill="#334155"/>
    <line x1="48" y1="175" x2="132" y2="175" stroke="#059669" stroke-width="1.8"/>
  </g>

  <!-- Dual Channel Wire Runs from Stage 1 to Stage 2 -->
  <line x1="220" y1="175" x2="270" y2="175" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>
  <line x1="220" y1="225" x2="270" y2="225" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>

  <!-- ==================================================================== -->
  <!-- STAGE 2: SAFETY RELAYS (K1, K2) WITH EDM                             -->
  <!-- ==================================================================== -->
  <g id="stage-relays" transform="translate(270, 50)">
    <!-- Container capsule -->
    <rect x="0" y="0" width="200" height="230" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="100" y="30" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">Safety Relays K1, K2</text>

    <!-- Relay K1 Coil & Contact -->
    <rect x="35" y="65" width="50" height="40" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
    <text x="60" y="89" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">K1</text>

    <!-- Relay K2 Coil & Contact -->
    <rect x="115" y="65" width="50" height="40" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
    <text x="140" y="89" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">K2</text>

    <!-- Force-Guided Mechanical Link -->
    <line x1="60" y1="105" x2="60" y2="175" stroke="#D97706" stroke-width="1.2" stroke-dasharray="2,2"/>
    <line x1="140" y1="105" x2="140" y2="175" stroke="#D97706" stroke-width="1.2" stroke-dasharray="2,2"/>

    <!-- Force-Guided Contacts -->
    <circle cx="45" cy="145" r="3" fill="#334155"/>
    <circle cx="75" cy="145" r="3" fill="#334155"/>
    <line x1="47" y1="143" x2="73" y2="137" stroke="#DC2626" stroke-width="1.8"/>

    <circle cx="125" cy="145" r="3" fill="#334155"/>
    <circle cx="155" cy="145" r="3" fill="#334155"/>
    <line x1="127" y1="143" x2="153" y2="137" stroke="#DC2626" stroke-width="1.8"/>

    <!-- EDM feedback line indicator -->
    <path d="M 60 195 L 140 195" stroke="#B45309" stroke-width="1.2"/>
  </g>

  <!-- EDM Feedback Loop (Curved underneath from Stage 2 back to Stage 1) -->
  <path d="M 370 280 C 370 330, 130 330, 130 280" fill="none" stroke="#D97706" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-amber)"/>
  <rect x="200" y="315" width="100" height="24" rx="4" fill="#FFFBEB" stroke="#FCD34D" stroke-width="0.8"/>
  <text x="250" y="331" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">EDM Feedback</text>

  <!-- Lines from Relays to Stage 3 (Upper: STO Cutoff, Lower: Brake) -->
  <line x1="470" y1="110" x2="520" y2="110" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <line x1="470" y1="220" x2="520" y2="220" stroke="#D97706" stroke-width="1.4" marker-end="url(#arr-amber)"/>

  <!-- ==================================================================== -->
  <!-- STAGE 3: GATE BIAS CUTOFF & HOLDING BRAKE                            -->
  <!-- ==================================================================== -->
  <!-- Upper: Gate Bias Cutoff (< 5 µs) -->
  <g id="stage-cutoff" transform="translate(520, 50)">
    <rect x="0" y="0" width="180" height="105" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="90" y="28" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Gate Bias Cutoff</text>

    <!-- Disconnect switch schematic -->
    <circle cx="50" cy="55" r="3" fill="#334155"/>
    <circle cx="130" cy="55" r="3" fill="#334155"/>
    <line x1="52" y1="55" x2="115" y2="40" stroke="#DC2626" stroke-width="1.8"/>

    <!-- Voltage label clamped to 0V -->
    <rect x="35" y="72" width="110" height="22" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
    <text x="90" y="87" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">V_gate = 0 V</text>
  </g>

  <!-- Lower: Holding Brake (15–40 ms) -->
  <g id="stage-brake" transform="translate(520, 175)">
    <rect x="0" y="0" width="180" height="105" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="90" y="32" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Holding Brake</text>

    <!-- Mechanical brake caliper icon -->
    <path d="M 60 55 L 75 55 L 75 80 L 60 80" fill="none" stroke="#D97706" stroke-width="2"/>
    <path d="M 120 55 L 105 55 L 105 80 L 120 80" fill="none" stroke="#D97706" stroke-width="2"/>
    <rect x="85" y="50" width="10" height="35" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  </g>

  <!-- Connectors to Stage 4 (Inverter & Motor) -->
  <line x1="700" y1="102" x2="745" y2="102" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <line x1="700" y1="228" x2="745" y2="228" stroke="#D97706" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>

  <!-- ==================================================================== -->
  <!-- STAGE 4: INVERTER BRIDGE & MOTOR                                     -->
  <!-- ==================================================================== -->
  <g id="stage-actuator" transform="translate(745, 50)">
    <!-- Container capsule -->
    <rect x="0" y="0" width="170" height="230" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2"/>

    <!-- Inverter Bridge Box -->
    <rect x="20" y="20" width="130" height="50" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
    <text x="85" y="49" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Inverter Bridge</text>

    <!-- Connection down to motor -->
    <line x1="85" y1="70" x2="85" y2="98" stroke="#059669" stroke-width="1.4" marker-end="url(#arr-green)"/>

    <!-- Motor Plant Circle -->
    <circle cx="85" cy="135" r="32" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
    <circle cx="85" cy="135" r="24" fill="#DCFCE7" stroke="#10B981" stroke-width="1"/>
    <text x="85" y="141" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">M</text>

    <!-- Motor label & Zero torque state -->
    <text x="85" y="186" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">Motor Plant</text>
    <rect x="15" y="196" width="140" height="22" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="0.8"/>
    <text x="85" y="211" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">Zero Torque (τ = 0)</text>
  </g>
</svg>
