<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" fill="#FFFFFF"/>

  <!-- Divider between panels -->
  <line x1="480" y1="20" x2="480" y2="400" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): DECOUPLED ENFORCER                                        -->
  <!-- ==================================================================== -->
  <g id="panel-a">
    <text x="240" y="32" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">(a) Decoupled Enforcer</text>

    <!-- Host Processor -->
    <rect x="140" y="60" width="200" height="55" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="240" y="93" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Host Processor</text>

    <!-- Proposal Arrow -->
    <line x1="240" y1="115" x2="240" y2="160" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arr-blue)"/>
    <text x="252" y="142" font-size="10" font-weight="600" fill="#2563EB">Proposal p_t</text>

    <!-- Real-Time Enforcer -->
    <rect x="130" y="160" width="220" height="60" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2"/>
    <text x="240" y="195" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Real-Time Enforcer</text>

    <!-- Valid Command Arrow -->
    <line x1="240" y1="220" x2="240" y2="280" stroke="#059669" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <text x="252" y="254" font-size="10" font-weight="600" fill="#059669">Command u_t</text>

    <!-- Trip Stop Branch -->
    <line x1="350" y1="190" x2="385" y2="190" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-rose)"/>
    <rect x="385" y="173" width="75" height="34" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
    <text x="422" y="194" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Trip Stop</text>

    <!-- Motor Registers -->
    <rect x="160" y="280" width="160" height="46" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
    <text x="240" y="308" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">Motor Registers</text>

    <!-- Actuator Arrow -->
    <line x1="240" y1="326" x2="240" y2="355" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>

    <!-- Actuator -->
    <rect x="180" y="355" width="120" height="36" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="1"/>
    <text x="240" y="378" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Actuator</text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): COLLAPSED ARCHITECTURE (UNSAFE)                           -->
  <!-- ==================================================================== -->
  <g id="panel-b">
    <text x="720" y="32" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">(b) Collapsed (Unsafe)</text>

    <!-- Host Processor (Unprotected) -->
    <rect x="620" y="60" width="200" height="55" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
    <text x="720" y="93" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">Host Processor</text>

    <!-- Direct Unchecked Write Arrow -->
    <line x1="720" y1="115" x2="720" y2="280" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr-rose)"/>

    <!-- Callout Box -->
    <rect x="735" y="175" width="130" height="42" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="800" y="193" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Direct Write</text>
    <text x="800" y="207" font-size="9" font-weight="600" fill="#991B1B" text-anchor="middle">Unchecked Access</text>

    <!-- Motor Registers -->
    <rect x="640" y="280" width="160" height="46" rx="0" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
    <text x="720" y="308" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">Motor Registers</text>

    <!-- Actuator Arrow -->
    <line x1="720" y1="326" x2="720" y2="355" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-rose)"/>

    <!-- Actuator -->
    <rect x="660" y="355" width="120" height="36" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="720" y="378" font-size="11" font-weight="600" fill="#991B1B" text-anchor="middle">Actuator</text>
  </g>
</svg>
