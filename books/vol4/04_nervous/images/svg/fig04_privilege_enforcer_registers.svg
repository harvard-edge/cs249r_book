<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <style>
      .title-panel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; letter-spacing: 0.2px; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #64748B; }
      .card-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .card-text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .hw-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .hw-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .consequence-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #991B1B; }
      .consequence-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #7F1D1D; }

      .box-white { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .box-app { fill: #F8FAFC; stroke: #64748B; stroke-width: 1.5; }
      .box-mcu { fill: #EFF6FF; stroke: #1F407A; stroke-width: 1.5; }
      .box-danger { fill: #FEF2F2; stroke: #DC2626; stroke-width: 1.5; }
      .box-hw { fill: #F8FAFC; stroke: #334155; stroke-width: 1.5; }
      
      .line-dark { stroke: #334155; stroke-width: 1.5; fill: none; }
      .line-dashed { stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; }
      .line-blue { stroke: #1F407A; stroke-width: 1.5; fill: none; }
      .line-red { stroke: #DC2626; stroke-width: 1.5; fill: none; }
      .line-red-dashed { stroke: #DC2626; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; }
    </style>

    <marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#334155" />
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F407A" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="620" fill="#FFFFFF" />

  <!-- ===================================================================== -->
  <!-- PANEL A: STRICT PHYSICAL ISOLATION ARCHITECTURE                       -->
  <!-- ===================================================================== -->
  <text x="35" y="35" class="title-panel">Panel A: Strict Physical Isolation Architecture (Hardware Privilege Boundary)</text>

  <!-- Application Processor (Untrusted Host) -->
  <rect x="35" y="55" width="240" height="225" rx="4" class="box-app" />
  <text x="155" y="80" class="header-title" text-anchor="middle">Application Processor</text>
  <text x="155" y="98" class="header-sub" text-anchor="middle">Untrusted Host / User Space (Linux / ROS2)</text>
  
  <rect x="48" y="112" width="214" height="152" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3" />
  <text x="155" y="136" class="card-text-bold" text-anchor="middle">Vision-Language-Action Policy</text>
  <text x="155" y="160" class="card-text" text-anchor="middle">• Neural inference (50–100 ms)</text>
  <text x="155" y="182" class="card-text" text-anchor="middle">• Complex multi-modal models</text>
  <text x="155" y="204" class="card-text" text-anchor="middle">• Subject to hallucinations/crashes</text>
  <text x="155" y="235" class="card-text-bold" text-anchor="middle" fill="#475569">Action Proposals (p&#770;<tspan baseline-shift="sub" font-size="9">t</tspan>)</text>

  <!-- Communication Link: Isolated Shared Memory -->
  <path d="M 275 167 L 315 167" class="line-dashed" marker-end="url(#arrow-dark)" />

  <rect x="315" y="137" width="120" height="60" rx="4" class="box-white" />
  <text x="375" y="162" class="header-title" text-anchor="middle" font-size="12">Isolated SHM</text>
  <text x="375" y="180" class="header-sub" text-anchor="middle" font-size="11">Lockless Ring Buffer</text>

  <path d="M 435 167 L 475 167" class="line-dashed" marker-end="url(#arrow-dark)" />

  <!-- Real-Time Microcontroller (Privileged Safety Core) -->
  <rect x="475" y="55" width="250" height="225" rx="4" class="box-mcu" />
  <text x="600" y="80" class="header-title" text-anchor="middle" fill="#1F407A">Real-Time MCU</text>
  <text x="600" y="98" class="header-sub" text-anchor="middle" fill="#1F407A">Privileged Safety Domain (RTOS / Bare-Metal)</text>

  <rect x="490" y="112" width="220" height="152" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1" />
  <text x="600" y="136" class="card-text-bold" text-anchor="middle" fill="#1F407A">Control Barrier Functions (CBF)</text>
  <text x="600" y="160" class="card-text" text-anchor="middle">• Deterministic safety envelope (≤1 ms)</text>
  <text x="600" y="182" class="card-text" text-anchor="middle">• Evaluates kinematic feasibility</text>
  <text x="600" y="204" class="card-text" text-anchor="middle">• Stops out-of-bounds trajectory</text>
  <text x="600" y="235" class="card-text-bold" text-anchor="middle" fill="#15803D">Certified Safe Command (u*<tspan baseline-shift="sub" font-size="9">t</tspan>)</text>

  <!-- Output Path 1: Safe Actuation Command -->
  <path d="M 725 155 L 830 155" class="line-blue" marker-end="url(#arrow-blue)" />
  <rect x="742" y="143" width="68" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" />
  <text x="776" y="159" class="badge-text" text-anchor="middle" fill="#047857">Verified u*</text>

  <!-- Output Path 2: Safety Violation Dynamic Braking -->
  <path d="M 725 240 L 830 240" class="line-red" marker-end="url(#arrow-red)" />
  <rect x="742" y="228" width="68" height="24" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" />
  <text x="776" y="244" class="badge-text" text-anchor="middle" fill="#B91C1C">Trip &#8594; Brake</text>

  <!-- Motor Drive Registers (Hardware MMIO) - STRICTLY rx="0" -->
  <rect x="830" y="125" width="135" height="60" rx="0" class="box-hw" />
  <text x="897" y="150" class="hw-title" text-anchor="middle">Motor Registers</text>
  <text x="897" y="168" class="hw-sub" text-anchor="middle">Privileged HW MMIO</text>

  <!-- Downward Arrow from Registers to Gate Drivers -->
  <path d="M 897 185 L 897 213" class="line-blue" marker-end="url(#arrow-blue)" />

  <!-- Gate Drivers / Inverters - STRICTLY rx="0" -->
  <rect x="830" y="215" width="135" height="50" rx="0" class="box-hw" />
  <text x="897" y="236" class="hw-title" text-anchor="middle">Gate Drivers</text>
  <text x="897" y="252" class="hw-sub" text-anchor="middle">Inverter / Actuator</text>


  <!-- ===================================================================== -->
  <!-- SEPARATION DIVIDER                                                    -->
  <!-- ===================================================================== -->
  <line x1="35" y1="310" x2="965" y2="310" stroke="#E2E8F0" stroke-width="1.5" />


  <!-- ===================================================================== -->
  <!-- PANEL B: UNSAFE COLLAPSED ARCHITECTURE                                -->
  <!-- ===================================================================== -->
  <text x="35" y="340" class="title-panel">Panel B: Unsafe Collapsed Architecture (Direct MMIO / Single Failure Domain)</text>

  <!-- Application Processor (Collapsed / Unprotected) -->
  <rect x="35" y="360" width="240" height="225" rx="4" class="box-danger" />
  <text x="155" y="385" class="header-title" text-anchor="middle" fill="#991B1B">App Processor (Collapsed)</text>
  <text x="155" y="403" class="header-sub" text-anchor="middle" fill="#991B1B">No Hardware Privilege Separation</text>

  <rect x="48" y="417" width="214" height="152" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="1" stroke-dasharray="4,3" />
  <text x="155" y="441" class="card-text-bold" text-anchor="middle" fill="#991B1B">Unverified VLA Policy</text>
  <text x="155" y="465" class="card-text" text-anchor="middle">• Memory leak or crash dumps</text>
  <text x="155" y="487" class="card-text" text-anchor="middle">• Hallucinatory torque targets</text>
  <text x="155" y="509" class="card-text" text-anchor="middle">• OS kernel scheduler jitter</text>
  <text x="155" y="540" class="card-text-bold" text-anchor="middle" fill="#DC2626">Unchecked MMIO Writes</text>

  <!-- Direct Unchecked Write Arrow -->
  <path d="M 275 472 L 530 472" class="line-red-dashed" marker-end="url(#arrow-red)" />

  <!-- Badge for Dangerous Direct Write -->
  <rect x="315" y="442" width="180" height="60" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" />
  <text x="405" y="466" class="card-text-bold" text-anchor="middle" fill="#991B1B">Direct MMIO Write</text>
  <text x="405" y="485" class="consequence-text" text-anchor="middle">No Barrier / Filter Verification</text>

  <!-- Motor Drive Registers in Panel B - STRICTLY rx="0" -->
  <rect x="535" y="442" width="165" height="60" rx="0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" />
  <text x="617" y="467" class="hw-title" text-anchor="middle" fill="#991B1B">Motor Registers</text>
  <text x="617" y="485" class="hw-sub" text-anchor="middle" fill="#991B1B">Unrestricted Write Access</text>

  <!-- Downward Arrow from Registers to Gate Drivers -->
  <path d="M 617 502 L 617 530" class="line-red" marker-end="url(#arrow-red)" />

  <!-- Gate Drivers / Inverters in Panel B - STRICTLY rx="0" -->
  <rect x="535" y="532" width="165" height="50" rx="0" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" />
  <text x="617" y="553" class="hw-title" text-anchor="middle" fill="#991B1B">Gate Drivers</text>
  <text x="617" y="569" class="hw-sub" text-anchor="middle" fill="#991B1B">Immediate Hard Crash / Damage</text>

  <!-- Consequence Summary Card on Right of Panel B -->
  <rect x="745" y="360" width="220" height="225" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="1" />
  <text x="855" y="390" class="consequence-title" text-anchor="middle">Catastrophic Hazards</text>
  
  <text x="760" y="420" class="consequence-text" font-weight="600">1. Wild PWM Saturation:</text>
  <text x="770" y="438" class="consequence-text">Pointer corruption drives 100%</text>
  <text x="770" y="454" class="consequence-text">inverter duty cycle directly.</text>

  <text x="760" y="480" class="consequence-text" font-weight="600">2. Deadlock Persistence:</text>
  <text x="770" y="498" class="consequence-text">Host OS panic holds last motor</text>
  <text x="770" y="514" class="consequence-text">register state indefinitely.</text>

  <text x="760" y="540" class="consequence-text" font-weight="600">3. Physical Breach:</text>
  <text x="770" y="558" class="consequence-text">Zero stopping distance safety;</text>
  <text x="770" y="574" class="consequence-text">destroys actuator gearbox.</text>

</svg>
