<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Vol IV roles (tex/theme-colors.tex): proposal = bronze #B87333,
       structural/permission = pine #1A4D3E, measured = petrol #007A87,
       hardware in slate with sharp corners. No red: nothing here is a
       consequence. Rates are guarded by the calc-nervous-two-processor-rates
       cell in 04_nervous.qmd (M1: discrete MCU, no shared memory; M2/M5). -->
  <rect width="680" height="444" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- ===== Application processor (proposes) ===== -->
  <rect x="20" y="16" width="640" height="104" rx="4" fill="#FCF8F4" stroke="#B87333" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="34" y="35" font-size="10.5" font-weight="700" fill="#1A202C">Application processor</text>
  <text x="160" y="35" font-size="8.5" fill="#4A5568">learned proposers, no access to drive registers</text>

  <rect x="40" y="52" width="150" height="50" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1"/>
  <text x="115" y="73" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Perception</text>
  <text x="115" y="89" font-size="8.5" fill="#4A5568" text-anchor="middle">camera frames, state</text>

  <rect x="240" y="52" width="170" height="50" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1"/>
  <text x="325" y="73" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Intent model</text>
  <text x="325" y="89" font-size="8.5" fill="#4A5568" text-anchor="middle">2 Hz</text>

  <rect x="460" y="52" width="180" height="50" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1"/>
  <text x="550" y="73" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Chunk policy</text>
  <text x="550" y="89" font-size="8.5" fill="#4A5568" text-anchor="middle">20 Hz renewal</text>

  <!-- ===== Board link (drawn before the arrows that cross it) ===== -->
  <rect x="20" y="138" width="640" height="34" rx="0" fill="#F4F6F9" stroke="#4A5568" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="330" y="152" font-size="9" font-weight="700" fill="#1A202C" text-anchor="middle">black-channel board link (SPI or CAN FD)</text>
  <text x="330" y="165" font-size="8.5" fill="#4A5568" text-anchor="middle">framed packets with CRC and sequence number; no shared memory</text>

  <!-- ===== Safety MCU (permission path) ===== -->
  <rect x="20" y="190" width="640" height="118" rx="4" fill="#F3F7F5" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="98" y="209" font-size="10.5" font-weight="700" fill="#1A202C">Safety MCU</text>
  <text x="166" y="209" font-size="8.5" fill="#4A5568">permission path, its own memory, sole writer of drive commands</text>

  <rect x="460" y="226" width="180" height="62" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1"/>
  <text x="550" y="248" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Double buffer + seqlock</text>
  <text x="550" y="264" font-size="8.5" fill="#4A5568" text-anchor="middle">filled by receive DMA</text>
  <text x="550" y="278" font-size="8.5" fill="#4A5568" text-anchor="middle">in MCU-local SRAM</text>

  <rect x="240" y="226" width="170" height="62" rx="3" fill="#E6EFEC" stroke="#1A4D3E" stroke-width="1.6"/>
  <text x="325" y="248" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Permission tick, 1 kHz</text>
  <text x="325" y="264" font-size="8.5" fill="#4A5568" text-anchor="middle">freshness, lease, limits</text>
  <text x="325" y="278" font-size="8.5" fill="#4A5568" text-anchor="middle">fallback on expiry</text>

  <!-- ===== Body ===== -->
  <rect x="40" y="340" width="150" height="50" rx="0" fill="#E3F3F5" stroke="#007A87" stroke-width="1"/>
  <text x="115" y="361" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Encoders, scanner</text>
  <text x="115" y="377" font-size="8.5" fill="#4A5568" text-anchor="middle">measured state</text>

  <rect x="240" y="340" width="170" height="50" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="325" y="361" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Drives</text>
  <text x="325" y="377" font-size="8.5" fill="#4A5568" text-anchor="middle">current and velocity loops</text>

  <rect x="460" y="340" width="180" height="50" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="550" y="361" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Physical plant</text>
  <text x="550" y="377" font-size="8.5" fill="#4A5568" text-anchor="middle">base, arm, payload</text>

  <!-- ===== Flows ===== -->
  <line x1="190" y1="77" x2="238" y2="77" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="410" y1="77" x2="458" y2="77" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-bronze)"/>
  <text x="434" y="70" font-size="8.5" fill="#4A5568" text-anchor="middle">goal</text>

  <!-- proposal: chunk policy down across the link into the MCU buffer -->
  <line x1="600" y1="102" x2="600" y2="224" stroke="#B87333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-bronze)"/>
  <rect x="606" y="123" width="48" height="13" fill="#ffffff"/>
  <text x="630" y="133" font-size="8.5" font-weight="700" fill="#B87333" text-anchor="middle">proposal</text>

  <!-- buffer to tick -->
  <line x1="460" y1="257" x2="412" y2="257" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="436" y="250" font-size="8.5" fill="#4A5568" text-anchor="middle">read</text>

  <!-- admitted command -->
  <line x1="325" y1="288" x2="325" y2="338" stroke="#1A4D3E" stroke-width="1.8" marker-end="url(#arr-pine)"/>
  <text x="333" y="325" font-size="8.5" font-weight="700" fill="#1A4D3E">admitted command</text>

  <line x1="410" y1="365" x2="458" y2="365" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- feedback: plant to sensors along the bottom perimeter -->
  <path d="M 550 390 L 550 418 L 115 418 L 115 392" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- sensors to the tick -->
  <path d="M 150 340 L 150 257 L 238 257" fill="none" stroke="#007A87" stroke-width="1.2" marker-end="url(#arr-petrol)"/>

  <!-- telemetry: MCU forwards measured state up across the link -->
  <line x1="80" y1="340" x2="80" y2="104" stroke="#007A87" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-petrol)"/>
  <rect x="86" y="123" width="54" height="13" fill="#ffffff"/>
  <text x="113" y="133" font-size="8.5" font-weight="700" fill="#007A87" text-anchor="middle">telemetry</text>
</svg>
