<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-nominal" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#3d9e5a"/>
    </marker>
    <marker id="arrow-compute" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#c87b2a"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Top Banner -->
  <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b">SILICON CONTENTION: PREEMPT_RT vs. HARDWARE BUS SATURATION</text>
  <text x="524" y="20" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#64748b">Shared-SoC Bottleneck</text>

  <!-- (a) OS Scheduling Model Sub-card -->
  <g id="subcard-a">
    <rect x="16" y="28" width="246" height="136" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="26" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b">(a) OS Scheduling Layer (Logical Model)</text>
    <text x="26" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#64748b">PREEMPT_RT kernel prioritizes real-time thread</text>

    <!-- RT Control Thread -->
    <rect x="26" y="58" width="226" height="26" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <rect x="31" y="63.5" width="76" height="15" rx="7.5" fill="#3d9e5a"/>
    <text x="69" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff">SCHED_FIFO [P99]</text>
    <text x="113" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#14532d">1 kHz Motor Loop</text>
    <text x="113" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#14532d">Deadline: 1.0 ms | Jitter &lt; 25 µs</text>

    <!-- Preemption Connector -->
    <path d="M 69 84 V 101" stroke="#3d9e5a" stroke-width="1.2" stroke-dasharray="2 1" marker-end="url(#arrow-nominal)"/>
    <text x="81" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600" fill="#3d9e5a">Preempts unprivileged CPU thread</text>

    <!-- Policy Thread -->
    <rect x="26" y="102" width="226" height="26" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <rect x="31" y="107.5" width="82" height="15" rx="7.5" fill="#c87b2a"/>
    <text x="72" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff">SCHED_OTHER [P0]</text>
    <text x="119" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#78350f">VLA Policy Inference</text>
    <text x="119" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#78350f">Cadence: 20 Hz | Yields CPU cleanly</text>

    <!-- Bottom Outcome Pill Subcard A -->
    <rect x="26" y="134" width="226" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
    <rect x="31" y="137.5" width="50" height="15" rx="7.5" fill="#3d9e5a"/>
    <text x="56" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff">PASS (OS)</text>
    <text x="88" y="148.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#14532d">Context switch: 18 µs (Software OK)</text>
  </g>

  <!-- (b) Silicon Fabric Layer Sub-card -->
  <g id="subcard-b">
    <rect x="278" y="28" width="246" height="136" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="288" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b">(b) Silicon Fabric Layer (Physical Reality)</text>
    <text x="288" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" fill="#64748b">Shared AXI crossbar &amp; DRAM controller saturation</text>

    <!-- Top Cores -->
    <!-- RT CPU Core -->
    <rect x="288" y="58" width="106" height="26" rx="3" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
    <text x="341" y="69.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1e3a8a">RT CPU Core</text>
    <text x="341" y="78.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#1e3a8a">L3 Evicted · DRAM Miss</text>

    <!-- NPU / Accelerator -->
    <rect x="408" y="58" width="106" height="26" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="461" y="69.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#78350f">NPU Accelerator</text>
    <text x="461" y="78.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#78350f">DMA Burst: 50 GB/s</text>

    <!-- Connectors to Bus -->
    <!-- RT Core Stalled by Arbiter -->
    <path d="M 341 84 V 87" stroke="#c44" stroke-width="1.2"/>
    <rect x="323" y="87" width="36" height="12" rx="6" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="341" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" fill="#c44">STALL</text>
    <path d="M 341 99 V 102" stroke="#c44" stroke-width="1.2"/>

    <!-- NPU Flooding Bus -->
    <path d="M 461 84 V 101" stroke="#c87b2a" stroke-width="1.5" marker-end="url(#arrow-compute)"/>
    <text x="467" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="600" fill="#78350f">DMA</text>

    <!-- Shared Interconnect / Crossbar -->
    <rect x="288" y="102" width="226" height="26" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <rect x="293" y="107.5" width="76" height="15" rx="7.5" fill="#c44"/>
    <text x="331" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff">AXI CROSSBAR</text>
    <text x="375" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#7f1d1d">Hardware Wait States!</text>
    <text x="375" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" fill="#7f1d1d">Bus saturated: T_stall &gt; 2.5 ms</text>

    <!-- Bottom Outcome Pill Subcard B -->
    <rect x="288" y="134" width="226" height="22" rx="3" fill="#ffffff" stroke="#c44" stroke-width="0.75"/>
    <rect x="293" y="137.5" width="46" height="15" rx="7.5" fill="#c44"/>
    <text x="316" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff">FAULT</text>
    <text x="345" y="148.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#7f1d1d">Deadline Miss: Jitter 2500 µs &gt; 1000 µs</text>
  </g>
</svg>