<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Crisp Vol 4 Standard Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D3748" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F407A" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A51C30" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#FFFFFF" rx="4"/>

  <!-- ============================================================ -->
  <!-- PANEL A: Multi-Rate Execution Cadence                        -->
  <!-- ============================================================ -->
  <g id="panel-a" transform="translate(40, 25)">
    <text x="0" y="20" font-size="16" font-weight="bold" fill="#1F407A">Panel A: Multi-Rate Execution Cadence</text>

    <!-- Row 1: Perception -->
    <text x="140" y="55" font-size="13" font-weight="bold" fill="#2D3748" text-anchor="end">Perception</text>
    <text x="140" y="72" font-size="11" fill="#4A5568" text-anchor="end">(50–100 Hz)</text>
    <line x1="155" y1="62" x2="910" y2="62" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)"/>
    
    <!-- Perception Exposure Blocks (10ms each, scaled: 1ms = 12px) -->
    <rect x="155" y="47" width="120" height="30" rx="3" fill="#E2E8F0" stroke="#2D3748" stroke-width="1.5"/>
    <text x="215" y="67" font-size="12" font-weight="bold" fill="#1F407A" text-anchor="middle">Exposure (10 ms)</text>

    <rect x="395" y="47" width="120" height="30" rx="3" fill="#E2E8F0" stroke="#2D3748" stroke-width="1.5"/>
    <text x="455" y="67" font-size="12" font-weight="bold" fill="#1F407A" text-anchor="middle">Exposure (10 ms)</text>

    <rect x="635" y="47" width="120" height="30" rx="3" fill="#E2E8F0" stroke="#2D3748" stroke-width="1.5"/>
    <text x="695" y="67" font-size="12" font-weight="bold" fill="#1F407A" text-anchor="middle">Exposure (10 ms)</text>

    <!-- Row 2: Policy -->
    <text x="140" y="125" font-size="13" font-weight="bold" fill="#2D3748" text-anchor="end">Policy</text>
    <text x="140" y="142" font-size="11" fill="#4A5568" text-anchor="end">(50 Hz)</text>
    <line x1="155" y1="130" x2="910" y2="130" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Policy Deliberation (20ms: x=275, w=240) -->
    <rect x="275" y="112" width="240" height="36" rx="3" fill="#1F407A" stroke="#2D3748" stroke-width="1.5"/>
    <text x="395" y="135" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Policy Deliberation (20 ms)</text>

    <!-- Tail Overrun (22ms: x=515, w=264) -->
    <rect x="515" y="112" width="264" height="36" rx="3" fill="#A51C30" stroke="#7B1523" stroke-width="1.5"/>
    <text x="647" y="135" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tail Overrun (22 ms)</text>

    <!-- Next Policy (x=779, w=120) -->
    <rect x="779" y="112" width="120" height="36" rx="3" fill="#1F407A" stroke="#2D3748" stroke-width="1.5"/>
    <text x="839" y="135" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Next Policy</text>

    <!-- Row 3: Reflex Control Timeline -->
    <text x="140" y="195" font-size="13" font-weight="bold" fill="#2D3748" text-anchor="end">Reflex Control</text>
    <text x="140" y="212" font-size="11" fill="#4A5568" text-anchor="end">(1000 Hz)</text>
    <line x1="155" y1="200" x2="910" y2="200" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Axis ticks: 0ms to 60ms (step 12px per ms) -->
    <!-- 0 ms -->
    <line x1="155" y1="192" x2="155" y2="208" stroke="#2D3748" stroke-width="1.5"/>
    <text x="155" y="222" font-size="11" fill="#4A5568" text-anchor="middle">0 ms</text>
    <!-- 10 ms -->
    <line x1="275" y1="192" x2="275" y2="208" stroke="#2D3748" stroke-width="1.5"/>
    <text x="275" y="222" font-size="11" fill="#4A5568" text-anchor="middle">10 ms</text>
    <!-- 20 ms -->
    <line x1="395" y1="192" x2="395" y2="208" stroke="#2D3748" stroke-width="1.5"/>
    <text x="395" y="222" font-size="11" fill="#4A5568" text-anchor="middle">20 ms</text>
    <!-- 30 ms -->
    <line x1="515" y1="192" x2="515" y2="208" stroke="#2D3748" stroke-width="1.5"/>
    <text x="515" y="222" font-size="11" fill="#4A5568" text-anchor="middle">30 ms</text>
    <!-- 40 ms -->
    <line x1="635" y1="192" x2="635" y2="208" stroke="#2D3748" stroke-width="1.5"/>
    <text x="635" y="222" font-size="11" fill="#4A5568" text-anchor="middle">40 ms</text>
    <!-- 50 ms -->
    <line x1="755" y1="192" x2="755" y2="208" stroke="#2D3748" stroke-width="1.5"/>
    <text x="755" y="222" font-size="11" fill="#4A5568" text-anchor="middle">50 ms</text>
    <!-- 60 ms -->
    <line x1="875" y1="192" x2="875" y2="208" stroke="#2D3748" stroke-width="1.5"/>
    <text x="875" y="222" font-size="11" fill="#4A5568" text-anchor="middle">60 ms</text>

    <!-- Intermediate ticks -->
    <path d="M 167 197 v 6 M 179 197 v 6 M 191 197 v 6 M 203 197 v 6 M 215 197 v 6 M 227 197 v 6 M 239 197 v 6 M 251 197 v 6 M 263 197 v 6 
             M 287 197 v 6 M 299 197 v 6 M 311 197 v 6 M 323 197 v 6 M 335 197 v 6 M 347 197 v 6 M 359 197 v 6 M 371 197 v 6 M 383 197 v 6 
             M 407 197 v 6 M 419 197 v 6 M 431 197 v 6 M 443 197 v 6 M 455 197 v 6 M 467 197 v 6 M 479 197 v 6 M 491 197 v 6 M 503 197 v 6 
             M 527 197 v 6 M 539 197 v 6 M 551 197 v 6 M 563 197 v 6 M 575 197 v 6 M 587 197 v 6 M 599 197 v 6 M 611 197 v 6 M 623 197 v 6 
             M 647 197 v 6 M 659 197 v 6 M 671 197 v 6 M 683 197 v 6 M 695 197 v 6 M 707 197 v 6 M 719 197 v 6 M 731 197 v 6 M 743 197 v 6 
             M 767 197 v 6 M 779 197 v 6 M 791 197 v 6 M 803 197 v 6 M 815 197 v 6 M 827 197 v 6 M 839 197 v 6 M 851 197 v 6 M 863 197 v 6" 
          stroke="#A0AEC0" stroke-width="1"/>

    <!-- Buffer Commit Trigger Markers -->
    <path fill="none" d="M 515 148 L 515 188" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-blue)"/>
    <text x="515" y="166" font-size="10" font-weight="bold" fill="#1F407A" text-anchor="end" dx="-4">Commit</text>

    <path fill="none" d="M 779 148 L 779 188" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-red)"/>
    <text x="779" y="166" font-size="10" font-weight="bold" fill="#A51C30" text-anchor="start" dx="4">Delayed Commit</text>

    <!-- Inset Box: 1 ms Slot Budgeting -->
    <g transform="translate(615, 230)">
      <rect x="0" y="0" width="295" height="60" rx="4" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1"/>
      <text x="12" y="18" font-size="11" font-weight="bold" fill="#2D3748">1 ms Slot Budgeting (Inset)</text>
      
      <!-- Inset timeline -->
      <line x1="20" y1="36" x2="275" y2="36" stroke="#2D3748" stroke-width="1.5"/>
      <line x1="20" y1="30" x2="20" y2="42" stroke="#2D3748" stroke-width="1.5"/>
      <line x1="275" y1="30" x2="275" y2="42" stroke="#2D3748" stroke-width="1.5"/>
      <text x="20" y="52" font-size="9" fill="#4A5568" text-anchor="middle">0 μs</text>
      <text x="275" y="52" font-size="9" fill="#4A5568" text-anchor="middle">1000 μs (D)</text>
      
      <!-- Computation Block (240us / 1000us * 255px = 61.2px) -->
      <rect x="20" y="27" width="61.2" height="18" rx="2" fill="#1F407A" stroke="#2D3748" stroke-width="1"/>
      <text x="50.6" y="40" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C ≤ 240 μs</text>
      
      <!-- Jitter Margin -->
      <line x1="81.2" y1="36" x2="275" y2="36" stroke="#A51C30" stroke-width="2" stroke-dasharray="3,2"/>
      <text x="178" y="32" font-size="9" font-weight="bold" fill="#A51C30" text-anchor="middle">760 μs safety margin</text>
    </g>

    <!-- Inset zoom callout lines from 1 ms tick (e.g. 50-51ms) -->
    <line x1="755" y1="208" x2="615" y2="230" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="767" y1="208" x2="910" y2="230" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Divider between Panel A and Panel B -->
  <line x1="40" y1="330" x2="960" y2="330" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ============================================================ -->
  <!-- PANEL B: SPSC Seqlock Triple-Buffer Architecture             -->
  <!-- ============================================================ -->
  <g id="panel-b" transform="translate(40, 350)">
    <text x="0" y="20" font-size="16" font-weight="bold" fill="#1F407A">Panel B: SPSC Seqlock Triple-Buffer Architecture</text>

    <!-- Column 1: Application Processor (Producer) -->
    <g transform="translate(10, 45)">
      <!-- Outer Card -->
      <rect x="0" y="0" width="220" height="215" rx="4" fill="#F7FAFC" stroke="#2D3748" stroke-width="2"/>
      <text x="110" y="28" font-size="15" font-weight="bold" fill="#1F407A" text-anchor="middle">Application Processor</text>
      <text x="110" y="48" font-size="12" fill="#4A5568" text-anchor="middle">Producer (50 Hz, Asynchronous)</text>

      <!-- Sub-box: Write Chunk (Centered at y=84, h=48: y=60..108) -->
      <rect x="25" y="60" width="170" height="48" rx="4" fill="#1F407A" stroke="#2D3748" stroke-width="2"/>
      <text x="110" y="84" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Write Action Chunk</text>
      <text x="110" y="99" font-size="11" fill="#E2E8F0" text-anchor="middle">(Unprivileged Proposals)</text>

      <!-- Producer Synchronization steps -->
      <rect x="20" y="135" width="180" height="28" rx="3" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1"/>
      <text x="110" y="153" font-size="11" font-weight="bold" fill="#1F407A" text-anchor="middle">1. atomic_store(odd: 2k+1)</text>

      <rect x="20" y="172" width="180" height="28" rx="3" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1"/>
      <text x="110" y="190" font-size="11" font-weight="bold" fill="#1F407A" text-anchor="middle">2. atomic_store(even: 2k+2)</text>
    </g>

    <!-- Column 2: Shared Memory (Triple Buffer) -->
    <g transform="translate(320, 45)">
      <!-- Outer Card -->
      <rect x="0" y="0" width="280" height="215" rx="4" fill="#E2E8F0" stroke="#2D3748" stroke-width="2"/>
      <text x="140" y="28" font-size="15" font-weight="bold" fill="#1F407A" text-anchor="middle">Shared Memory (Triple Buffer)</text>
      <text x="140" y="46" font-size="11" fill="#4A5568" text-anchor="middle">Zero-Copy Lock-Free Exchange</text>

      <!-- Buffer 0: Inactive (Write) - Centered at y=84, h=38: y=65..103 -->
      <rect x="15" y="65" width="250" height="38" rx="4" fill="#FFFFFF" stroke="#2D3748" stroke-width="1.5"/>
      <text x="28" y="89" font-size="12" font-weight="bold" fill="#2D3748">Buffer 0:</text>
      <text x="95" y="89" font-size="12" font-weight="bold" fill="#A51C30">Inactive (Write Target)</text>

      <!-- Buffer 1: Newest Committed - Centered at y=131, h=38: y=112..150 -->
      <rect x="15" y="112" width="250" height="38" rx="4" fill="#1F407A" stroke="#2D3748" stroke-width="1.5"/>
      <text x="28" y="136" font-size="12" font-weight="bold" fill="#FFFFFF">Buffer 1:</text>
      <text x="95" y="136" font-size="12" font-weight="bold" fill="#FFFFFF">Newest Committed Chunk</text>

      <!-- Buffer 2: Active (Read) - Centered at y=178, h=38: y=159..197 -->
      <rect x="15" y="159" width="250" height="38" rx="4" fill="#FFFFFF" stroke="#2D3748" stroke-width="1.5"/>
      <text x="28" y="183" font-size="12" font-weight="bold" fill="#2D3748">Buffer 2:</text>
      <text x="95" y="183" font-size="12" font-weight="bold" fill="#1F407A">Active (Consumer Latched)</text>
    </g>

    <!-- Column 3: Real-Time MCU (Consumer) -->
    <g transform="translate(690, 45)">
      <!-- Outer Card: Consequence / Real-Time Boundary (Crimson Accent) -->
      <rect x="0" y="0" width="220" height="215" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="3"/>
      <text x="110" y="28" font-size="15" font-weight="bold" fill="#A51C30" text-anchor="middle">Real-Time MCU</text>
      <text x="110" y="48" font-size="12" fill="#4A5568" text-anchor="middle">Consumer (1000 Hz, Deterministic)</text>

      <!-- Verification Step Box -->
      <rect x="20" y="70" width="180" height="48" rx="3" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1"/>
      <text x="110" y="90" font-size="11" font-weight="bold" fill="#A51C30" text-anchor="middle">Check cseq (even: 2k+2)</text>
      <text x="110" y="106" font-size="11" fill="#4A5568" text-anchor="middle">Verify No Tearing (Retry-Free)</text>

      <!-- Sub-box: Latch Latest - Centered at y=178, h=48: y=154..202 -->
      <rect x="25" y="154" width="170" height="48" rx="4" fill="#2D3748" stroke="#1F407A" stroke-width="2"/>
      <text x="110" y="178" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Latch Latest</text>
      <text x="110" y="193" font-size="11" fill="#E2E8F0" text-anchor="middle">(Reflex Spline Extrapolation)</text>
    </g>

    <!-- Central Coordination Box: Seqlock State -->
    <g transform="translate(380, 275)">
      <rect x="0" y="0" width="160" height="36" rx="4" fill="#F7FAFC" stroke="#2D3748" stroke-width="1.5"/>
      <text x="80" y="22" font-size="13" font-weight="bold" fill="#1F407A" text-anchor="middle">seqlock: cseq</text>
    </g>

    <!-- ==================== ARROW ROUTING ==================== -->

    <!-- 1. Perfectly Straight Horizontal Data Write: Write Action Chunk -> Buffer 0 -->
    <!-- Write Chunk right edge is at (10 + 25 + 170, 45 + 84) = (205, 129) -->
    <!-- Buffer 0 left edge is at (320 + 15, 45 + 84) = (335, 129) -->
    <path fill="none" d="M 205 129 L 330 129" stroke="#1F407A" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="268" y="118" font-size="11" font-weight="bold" fill="#1F407A" text-anchor="middle">Write Data</text>

    <!-- 2. Perfectly Straight Horizontal Data Read: Buffer 2 -> Latch Latest -->
    <!-- Buffer 2 right edge is at (320 + 15 + 250, 45 + 178) = (585, 223) -->
    <!-- Latch Latest left edge is at (690 + 25, 45 + 178) = (715, 223) -->
    <path fill="none" d="M 585 223 L 710 223" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <text x="648" y="206" font-size="11" font-weight="bold" fill="#A51C30" text-anchor="middle">Read Data (&lt; 1.5 μs)</text>

    <!-- 3. Producer Sequence Update to Seqlock -->
    <!-- Leaves Application Processor bottom at (x=120, y=260), drops to y=293, enters Seqlock left (x=375, y=293) -->
    <path fill="none" d="M 120 260 L 120 293 L 375 293" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>

    <!-- 4. Consumer Sequence Check from MCU to Seqlock -->
    <!-- Leaves MCU bottom at (x=800, y=260), drops to y=293, enters Seqlock right (x=545, y=293) -->
    <!-- Completely avoids crossing the Read Data line! -->
    <path fill="none" d="M 800 260 L 800 293 L 545 293" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>

  </g>

</svg>