<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="460" fill="#FFFFFF"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): MULTI-RATE EXECUTION CADENCE                              -->
  <!-- ==================================================================== -->
  <g id="panel-a">
    <!-- Header -->
    <text x="40" y="28" font-size="13" font-weight="700" fill="#1E293B">(a) Multi-Rate Cadence</text>

    <!-- Time axis -->
    <line x1="180" y1="185" x2="900" y2="185" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <text x="912" y="189" font-size="11" font-style="italic" font-weight="600" fill="#64748B">t</text>

    <!-- Row 1: Perception -->
    <text x="165" y="66" font-size="11" font-weight="600" fill="#475569" text-anchor="end">Perception</text>
    <line x1="180" y1="62" x2="880" y2="62" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="200" y="49" width="80" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="340" y="49" width="80" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="480" y="49" width="80" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="620" y="49" width="80" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Row 2: Policy -->
    <text x="165" y="115" font-size="11" font-weight="600" fill="#2563EB" text-anchor="end">Policy</text>
    <line x1="180" y1="111" x2="880" y2="111" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- Nominal Chunk -->
    <rect x="200" y="98" width="180" height="26" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="290" y="115" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">Plan</text>

    <!-- Overrun Chunk -->
    <rect x="400" y="98" width="170" height="26" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <rect x="570" y="98" width="120" height="26" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
    <text x="630" y="115" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Overrun</text>

    <!-- Chunk Commit Handoff to Reflex -->
    <line x1="380" y1="124" x2="380" y2="148" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
    <line x1="690" y1="124" x2="690" y2="148" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr-rose)"/>

    <!-- Row 3: Reflex Loop -->
    <text x="165" y="160" font-size="11" font-weight="600" fill="#059669" text-anchor="end">Reflex (1 kHz)</text>
    <line x1="180" y1="156" x2="880" y2="156" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- Nominal 1ms reflex ticks -->
    <g fill="#10B981">
      <rect x="200" y="150" width="5" height="12" rx="1"/>
      <rect x="218" y="150" width="5" height="12" rx="1"/>
      <rect x="236" y="150" width="5" height="12" rx="1"/>
      <rect x="254" y="150" width="5" height="12" rx="1"/>
      <rect x="272" y="150" width="5" height="12" rx="1"/>
      <rect x="290" y="150" width="5" height="12" rx="1"/>
      <rect x="308" y="150" width="5" height="12" rx="1"/>
      <rect x="326" y="150" width="5" height="12" rx="1"/>
      <rect x="344" y="150" width="5" height="12" rx="1"/>
      <rect x="362" y="150" width="5" height="12" rx="1"/>
      <rect x="380" y="150" width="5" height="12" rx="1"/>
      <rect x="398" y="150" width="5" height="12" rx="1"/>
      <rect x="416" y="150" width="5" height="12" rx="1"/>
      <rect x="434" y="150" width="5" height="12" rx="1"/>
      <rect x="452" y="150" width="5" height="12" rx="1"/>
      <rect x="470" y="150" width="5" height="12" rx="1"/>
      <rect x="488" y="150" width="5" height="12" rx="1"/>
      <rect x="506" y="150" width="5" height="12" rx="1"/>
      <rect x="524" y="150" width="5" height="12" rx="1"/>
      <rect x="542" y="150" width="5" height="12" rx="1"/>
      <rect x="560" y="150" width="5" height="12" rx="1"/>
    </g>

    <!-- Spline Hold Capsule during Overrun -->
    <rect x="570" y="146" width="120" height="20" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="630" y="160" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">Spline Hold</text>

    <!-- Resumed reflex ticks -->
    <g fill="#10B981">
      <rect x="700" y="150" width="5" height="12" rx="1"/>
      <rect x="718" y="150" width="5" height="12" rx="1"/>
      <rect x="736" y="150" width="5" height="12" rx="1"/>
      <rect x="754" y="150" width="5" height="12" rx="1"/>
      <rect x="772" y="150" width="5" height="12" rx="1"/>
    </g>
  </g>

  <!-- Divider -->
  <line x1="40" y1="215" x2="920" y2="215" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (b): LOCK-FREE SEQLOCK BUFFER EXCHANGE                         -->
  <!-- ==================================================================== -->
  <g id="panel-b" transform="translate(0, 225)">
    <!-- Header -->
    <text x="40" y="24" font-size="13" font-weight="700" fill="#1E293B">(b) Seqlock Buffer</text>

    <!-- Producer: Host Processor -->
    <g transform="translate(60, 48)">
      <rect x="0" y="0" width="190" height="140" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="95" y="75" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">Host Processor</text>
    </g>

    <!-- Write Arrow with Label -->
    <text x="295" y="72" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">Write</text>
    <line x1="250" y1="80" x2="340" y2="80" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arr-blue)"/>

    <!-- Shared SRAM Mailbox -->
    <g transform="translate(350, 40)">
      <rect x="0" y="0" width="260" height="156" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
      <text x="130" y="24" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Shared SRAM</text>

      <!-- Triple Buffers -->
      <rect x="15" y="36" width="230" height="24" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
      <text x="130" y="52" font-size="9.5" font-weight="600" fill="#991B1B" text-anchor="middle">Slot 0</text>

      <rect x="15" y="66" width="230" height="24" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
      <text x="130" y="82" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">Slot 1</text>

      <rect x="15" y="96" width="230" height="24" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
      <text x="130" y="112" font-size="9.5" font-weight="600" fill="#166534" text-anchor="middle">Slot 2</text>

      <!-- Monotonic Counter -->
      <rect x="15" y="126" width="230" height="20" rx="4" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
      <text x="130" y="140" font-size="9" font-family="monospace" font-weight="700" fill="#92400E" text-anchor="middle">c_seq</text>
    </g>

    <!-- Read Arrow with Label -->
    <text x="660" y="132" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">Read</text>
    <line x1="610" y1="140" x2="700" y2="140" stroke="#059669" stroke-width="1.4" marker-end="url(#arr-green)"/>

    <!-- Consumer: Real-Time MCU -->
    <g transform="translate(710, 48)">
      <rect x="0" y="0" width="190" height="140" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2"/>
      <text x="95" y="75" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">Real-Time MCU</text>
    </g>
  </g>
</svg>