  claims:
    Per-resource independence inventory: A separate core or chip is not independent by construction, because memory
      protection governs where a transaction may go, not when it is served, so independence is argued row by row
      over every shared resource, including supply, clock, and reset.
    Memory contention and miss handling: Memory arbiters schedule bursts, not averages, so a safety read waits on
      the backlog ahead of it and the controller's policy, and shared-cache miss handling, not bandwidth, threatens
      the declared bound.
    Thermal throttling hangover: On a shared die sustained inference drives the junction past the trip point, the
      governor cuts the clock so every tick overruns its bound, and hysteresis holds the clock down for seconds
      after the burst ends.
    Declared WCET as falsification threshold: Loaded execution is isolated execution plus shared-hardware interference,
      and the placement claims that interference is zero, so any loaded tick above the declared WCET refutes the
      placement's timing premise even when it still meets the deadline.
    Boundary contract and windowed watchdog: The exchange has two separately timed obligations (board-link transport,
      then one bounded local publication read inside the WCET), and liveness needs a windowed watchdog that catches
      early feeds as well as late ones.
    Priced remediation ladder: A refuted placement forces a remedy matched to the coupling (static reservation,
      spatial partitioning, separate silicon), each paid in a different currency and leaving a named residual.
    Dispatch-to-admission allocation: The selected placement must allocate the interval from perception dispatch
      to admission (residual inference, serialization, validation, activation, up to one tick) and fit it under
      the stopping spare.
    Placement record: The placement record binds the declared WCET and deadline to the execution domain, privilege,
      period, unloaded and loaded maxima, bus QoS, droop and thermal limits, mitigations, and the conditions left
      untested.
    Supply, clock, and reset domains: Privilege checks govern digital access while the shared rail powers the gates
      that perform them, so droop, clock faults, and shared resets are failure domains beneath privilege.
    Offload timing screen: An off-board result counts only if its tail network time plus remote processing fits
      the transaction window and the full dispatch-to-admission ceiling, so wireless tails disqualify offload for
      anything that renews the lease.
    Mixed-criticality scheduling: Execution budgets depend on the assurance level, so when a high-criticality task
      exhausts its lower budget the scheduler withdraws service from low-criticality work to keep the enforcer's
      tick.
    Static-partitioning hypervisor: A static-partitioning hypervisor binds cores, memory, and peripherals to isolated
      partitions at boot and colors caches, the standard pattern for a real-time enclave on a shared die.
    WCET analysis families: WCET comes from static analysis, measurement plus margin, hybrid methods, or probabilistic
      tail models, and local worst cases do not compose to a global one on modern microarchitectures.
    Coupling-timescale ladder: Couplings act on different timescales (nanosecond droop, microsecond queueing, millisecond
      ticks, second-scale throttling, hour-scale chassis heat), which tells a rail-correlated fault from a temperature-correlated
      one.
