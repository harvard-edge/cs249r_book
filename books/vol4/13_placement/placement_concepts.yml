  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.placement.isolation
      label: Resource isolation
      teaches: Per-resource independence inventory
      summary: Separation or bounded sharing of memory, supply, clock, reset, and compute resources between
        proposal and permission paths.
      section: sec-placement-isolation-decisions
    - id: vol4.placement.throttling
      label: Thermal throttling
      teaches: Thermal throttling hangover
      summary: Clock or performance reduction induced by a shared thermal state, which can persist after
        the workload that caused it stops.
      section: sec-placement-thermal-timing-coupling
    - id: vol4.timing.wcet
      label: Worst-case execution time
      teaches: Declared WCET as falsification threshold
      summary: A declared upper execution-time bound for a specified binary and platform; observed maxima
        can falsify it but do not establish it.
      section: sec-placement-testing-separation
    relationships:
    - id: vol4.field.placement-isolation--timing-response-bound
      source: vol4.placement.isolation
      predicate: protects assumptions of
      target: vol4.timing.response-bound
      explanation: Proposal workloads may not create unbounded interference in the permission path through
        shared compute or physical resources.
      conditions: Inventory each shared resource and either isolate it or establish a bounded interference
        argument; separate processes alone are insufficient.
      status: draft
      evidence:
        section: sec-placement-isolation-decisions
        quote: 'A **static-partitioning hypervisor**\index{Hypervisor!static partitioning} combines these
          mechanisms across one SoC. At boot, it statically binds CPU cores, physical memory ranges, and
          memory-mapped peripherals to isolated guest partitions, runs without a dynamic runtime scheduler,
          and colors cache sets across partitions, as in microkernels such as Bao [@martins2020bao]. This
          is the standard way to host a hard real-time safety enclave beside a Linux stack on one die. The
          scheduling model behind the asymmetry between proposal overruns and enforcer guarantees is **mixed-criticality
          scheduling**\index{Mixed-criticality scheduling!definition} [@vestal2007preemptive; @burns2017survey].
          In the standard mixed-criticality model, execution budgets depend on the assurance level: if a
          high-criticality task overruns its lower-assurance budget, the scheduler drops low-criticality
          work so the high-criticality task keeps its larger budget. On the running machine, the safety
          enforcer is the high-criticality task and the generative proposer is the low-criticality workload.
          The lease protocol enforces the same priority: a proposer that misses its inference window forfeits
          lease renewal, while qualified hardware isolation protects the enforcer''s periodic permission
          tick.'
    - id: vol4.field.placement-throttling--timing-wcet
      source: vol4.placement.throttling
      predicate: can increase
      target: vol4.timing.wcet
      explanation: A hot shared substrate may lower clocks and lengthen execution after the neural burst
        has stopped.
      conditions: The qualified execution bound must cover thermal history and competing load; a quiet test
        immediately after throttling is not an independent baseline.
      status: draft
      evidence:
        section: sec-placement-thermal-timing-coupling
        quote: A permission core can suffer execution delays long after a heavy proposal workload has terminated,
          because thermal capacitance traps heat inside the package. While electrical droop and interconnect
          contention manifest over nanoseconds and microseconds, thermal coupling operates over seconds.
          When an accelerator and a real-time permission core share a silicon die, a cooling path, and an
          on-chip power management governor, sustained neural network inference can lower the clock frequency
          available to safety enforcement, and keep it lowered after the inference stops.
    - id: vol4.field.timing-wcet--timing-response-bound
      source: vol4.timing.wcet
      predicate: is one component of
      target: vol4.timing.response-bound
      explanation: Execution time contributes to a total response bound, which must also include permitted
        blocking, preemption, and transfer delays.
      conditions: A stress test can falsify a declared WCET but cannot establish a sound worst-case bound
        by taking an observed maximum.
      status: draft
      evidence:
        section: sec-placement-testing-separation
        quote: An ideal isolated placement claims that proposal-side execution introduces zero cross-workload
          interference ($\SharedHardwareInterferenceDelay = 0$), making the declared bound $\PermissionTickWcet$
          the **falsification threshold**\index{Falsification threshold!definition}. Because isolated execution
          cannot exceed $\PermissionTickWcet$ by definition, any measured cycle under load that exceeds
          $\PermissionTickWcet$ demonstrates that either the declared baseline WCET was underestimated or
          the shared hardware introduced an interference penalty that the architecture failed to eliminate.
          Either outcome refutes the timing contract of the placement, even if the cycle completes before
          $\EnforcerDeadline$, because every downstream margin, from the deadline itself to the stopping
          distance budgeted for each tick, depends on that premise. Conversely, observing a loaded execution
          cycle below $\PermissionTickWcet$ does not establish that $\SharedHardwareInterferenceDelay$ is
          zero. Empirical testing can decisively falsify a declared bound, but measurements alone cannot
          prove its universal validity. Any test campaign samples only the microarchitectural states it
          reaches, and microarchitectural timing anomalies can push the true worst-case latency beyond every
          observed cycle.[^fn-math-wcet-anomalies]
