<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <style>
            .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
            .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; }
            .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #334155; }
            .text-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
            .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #475569; }
            .small-white { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #ffffff; }
            .warn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #dc2626; }
            .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 4; ry: 4; }
            .box-blue { fill: #1e40af; stroke: #1e40af; stroke-width: 1.2; rx: 3; ry: 3; }
            .box-red { fill: #b91c1c; stroke: #b91c1c; stroke-width: 1.2; rx: 3; ry: 3; }
            .box-light-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 4; ry: 4; }
            .box-light-red { fill: #fff1f2; stroke: #dc2626; stroke-width: 1.5; rx: 4; ry: 4; }
            .arrow { stroke: #2563eb; stroke-width: 1.5; fill: none; }
            .arrow-red { stroke: #dc2626; stroke-width: 1.5; fill: none; }
        </style>
        <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
            <polygon points="0 0, 8 3.5, 0 7" fill="#2563eb" />
        </marker>
        <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
            <polygon points="0 0, 8 3.5, 0 7" fill="#dc2626" />
        </marker>
    </defs>

    <rect width="1000" height="550" fill="#ffffff" />

    <!-- (a) Top Architecture -->
    <text x="25" y="34" class="title">(a) Inter-Core Lock-Free State Exchange (Seqlock)</text>

    <!-- Proposal Writer -->
    <rect x="25" y="60" width="225" height="175" class="box-light-blue" />
    <text x="137" y="88" class="card-title" fill="#1e40af" text-anchor="middle">Proposal Writer</text>
    <text x="137" y="106" class="small" fill="#2563eb" text-anchor="middle">(Untrusted NPU/MPU)</text>
    <text x="137" y="142" class="text" text-anchor="middle">1. S = S + 1 (odd)</text>
    <text x="137" y="166" class="text" text-anchor="middle">2. Write Payload</text>
    <text x="137" y="190" class="text" text-anchor="middle">3. S = S + 1 (even)</text>

    <!-- Store-Release arrow -->
    <line x1="250" y1="147" x2="338" y2="147" class="arrow" marker-end="url(#arrow-blue)" />
    <text x="294" y="138" class="small" fill="#2563eb" font-weight="600" text-anchor="middle">Store-Release</text>

    <!-- Shared SRAM -->
    <rect x="345" y="60" width="290" height="235" class="box" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="490" y="88" class="card-title" fill="#0f172a" text-anchor="middle">Shared SRAM (Zero-Copy)</text>
    <text x="490" y="106" class="small" text-anchor="middle">No mutex, no allocation</text>
    
    <rect x="365" y="120" width="250" height="30" class="box-blue" rx="3" />
    <text x="490" y="140" class="small-white" text-anchor="middle">Monotonic Sequence Counter (S)</text>
    
    <rect x="365" y="160" width="250" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3" />
    <text x="490" y="182" class="text-bold" text-anchor="middle">Self-Contained Payload (256 B)</text>
    <text x="375" y="206" class="small">• Cmd Mass Flow (m_dot_cmd)</text>
    <text x="375" y="226" class="small">• Sequence Index (k)</text>
    <text x="375" y="246" class="small">• Hardware Timestamp (t_prod)</text>
    <text x="375" y="266" class="small">• Lease Validity (Δt_valid), CRC-32</text>

    <!-- Load-Acquire arrow -->
    <line x1="635" y1="147" x2="723" y2="147" class="arrow-red" marker-end="url(#arrow-red)" />
    <text x="679" y="138" class="small" fill="#dc2626" font-weight="600" text-anchor="middle">Load-Acquire</text>

    <!-- Safety Reader -->
    <rect x="730" y="60" width="245" height="175" class="box-light-red" />
    <text x="852" y="88" class="card-title" fill="#dc2626" text-anchor="middle">Safety Reader</text>
    <text x="852" y="106" class="small" fill="#dc2626" text-anchor="middle">(Deterministic MCU)</text>
    <text x="852" y="142" class="text" text-anchor="middle">1. S1 = Read(S)</text>
    <text x="852" y="166" class="text" text-anchor="middle">2. Read Payload</text>
    <text x="852" y="190" class="text" text-anchor="middle">3. S2 = Read(S)</text>

    <!-- (b) Bottom Table -->
    <text x="25" y="335" class="title">(b) Writer Preemption Matrix &amp; Deterministic Fallbacks</text>

    <g transform="translate(25, 350)">
        <!-- Table container with micro-radius -->
        <rect x="0" y="0" width="950" height="148" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

        <!-- Header Row -->
        <path d="M 0 4 Q 0 0 4 0 L 590 0 L 590 28 L 0 28 Z" fill="#1e40af" />
        <path d="M 590 0 L 946 0 Q 950 0 950 4 L 950 28 L 590 28 Z" fill="#991b1b" />
        
        <text x="110" y="19" class="small-white" text-anchor="middle">Failure Class</text>
        <text x="400" y="19" class="small-white" text-anchor="middle">Detection Condition (Safety Reader)</text>
        <text x="770" y="19" class="small-white" text-anchor="middle">Bounded Real-Time Fallback (&lt; 5 µs)</text>

        <!-- Vertical Column Separators -->
        <line x1="220" y1="28" x2="220" y2="148" stroke="#cbd5e1" stroke-width="1" />
        <line x1="590" y1="28" x2="590" y2="148" stroke="#cbd5e1" stroke-width="1" />

        <!-- Row 1: Torn / In-Flight -->
        <line x1="0" y1="58" x2="950" y2="58" stroke="#e2e8f0" stroke-width="1" />
        <text x="110" y="47" class="text-bold" text-anchor="middle">Torn / In-Flight</text>
        <text x="405" y="47" class="text" text-anchor="middle">S1 % 2 != 0  OR  S1 != S2</text>
        <rect x="591" y="29" width="358" height="28" fill="#fff1f2" />
        <text x="770" y="47" class="small" fill="#991b1b" text-anchor="middle">Trap: Discard snapshot, use previous safe state</text>

        <!-- Row 2: Malformed -->
        <line x1="0" y1="88" x2="950" y2="88" stroke="#e2e8f0" stroke-width="1" />
        <text x="110" y="77" class="text-bold" text-anchor="middle">Malformed</text>
        <text x="405" y="77" class="text" text-anchor="middle">CRC-32 fails  OR  m_dot_cmd out of bounds</text>
        <rect x="591" y="59" width="358" height="28" fill="#fff1f2" />
        <text x="770" y="77" class="small" fill="#991b1b" text-anchor="middle">Trap: Reject command, clamp valve</text>

        <!-- Row 3: Stale -->
        <line x1="0" y1="118" x2="950" y2="118" stroke="#e2e8f0" stroke-width="1" />
        <text x="110" y="107" class="text-bold" text-anchor="middle">Stale</text>
        <text x="405" y="107" class="text" text-anchor="middle">t_now &gt; t_prod + Δt_valid</text>
        <rect x="591" y="89" width="358" height="28" fill="#fff1f2" />
        <text x="770" y="107" class="small" fill="#991b1b" text-anchor="middle">Timeout: Clamp valve (transient), ramp down if &gt; 10ms</text>

        <!-- Row 4: Missing -->
        <text x="110" y="137" class="text-bold" text-anchor="middle">Missing</text>
        <text x="405" y="137" class="text" text-anchor="middle">k_new &gt; k_prev + 1</text>
        <path d="M 591 119 L 950 119 L 950 144 Q 950 148 946 148 L 591 148 Z" fill="#fff1f2" />
        <text x="770" y="137" class="small" fill="#991b1b" text-anchor="middle">Skip detected: Log fault, hold state</text>
    </g>

    <!-- Bottom summary banner -->
    <text x="500" y="525" class="warn" text-anchor="middle">Guarantees continuous 1000 Hz actuator regulation even during host crashes</text>
</svg>