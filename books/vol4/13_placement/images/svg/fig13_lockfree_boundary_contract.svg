<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.0 4.4 883.9 387.1" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-42.2" y="-15.0" width="972.3" height="425.8" fill="#ffffff"/>
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#FFFFFF"/>

  <!-- Sub-Figure Headers -->
  <text x="240" y="30" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(a) Seqlock Architecture</text>
  <text x="720" y="30" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(b) Validation Flow</text>

  <!-- Panel Divider -->
  <line x1="480" y1="20" x2="480" y2="380" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): SEQLOCK ARCHITECTURE                                      -->
  <!-- ==================================================================== -->
  <g id="panel-a">
    <!-- Proposal Writer -->
    <rect x="18" y="135" width="98" height="85" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="67" y="181" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Proposal</text>
    <text x="67" y="197" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Writer</text>

    <!-- Store-Release Arrow -->
    <line x1="116" y1="177" x2="192" y2="177" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>
    <text x="154" y="165" font-size="8.5" font-weight="600" fill="#2563EB" text-anchor="middle">Store-Release</text>

    <!-- Shared Mailbox Container -->
    <rect x="194" y="75" width="126" height="205" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="257" y="101" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Shared Mailbox</text>

    <!-- Sequence Counter S -->
    <rect x="206" y="118" width="102" height="42" rx="4" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
    <text x="257" y="143" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">Sequence S</text>

    <!-- Payload Box -->
    <rect x="206" y="174" width="102" height="92" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="257" y="224" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">Payload</text>

    <!-- Load-Acquire Arrow -->
    <line x1="320" y1="177" x2="394" y2="177" stroke="#16A34A" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <text x="357" y="165" font-size="8.5" font-weight="600" fill="#16A34A" text-anchor="middle">Load-Acquire</text>

    <!-- Safety Reader -->
    <rect x="396" y="135" width="76" height="85" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="434" y="181" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">Safety</text>
    <text x="434" y="197" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">Reader</text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): VALIDATION FLOW                                           -->
  <!-- ==================================================================== -->
  <g id="panel-b">
    <!-- Step 1: Sample S1 -->
    <rect x="535" y="55" width="130" height="34" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="600" y="77" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Sample S1</text>

    <!-- Arrow down to Decision 1 -->
    <line x1="600" y1="89" x2="600" y2="115" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>

    <!-- Decision 1: S1 Odd? -->
    <rect x="535" y="118" width="130" height="36" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="600" y="141" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">S1 Odd?</text>

    <!-- Branch 1: Yes -> In-Flight -->
    <line x1="665" y1="136" x2="738" y2="136" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
    <text x="702" y="129" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">Yes</text>

    <rect x="744" y="118" width="126" height="36" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="807" y="141" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle">In-Flight</text>

    <!-- Branch 2: No -> Read Payload -->
    <line x1="600" y1="154" x2="600" y2="185" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <text x="575" y="172" font-size="9" font-weight="700" fill="#16A34A" text-anchor="middle">No</text>

    <!-- Step 2: Read Payload -->
    <rect x="535" y="188" width="130" height="34" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="600" y="210" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">Read Payload</text>

    <!-- Arrow down to Decision 2 -->
    <line x1="600" y1="222" x2="600" y2="248" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>
    <text x="655" y="239" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">Sample S2</text>

    <!-- Decision 2: S1 == S2? -->
    <rect x="535" y="251" width="130" height="36" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="600" y="274" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">S1 == S2?</text>

    <!-- Branch 3: No -> Torn Read -->
    <line x1="665" y1="269" x2="738" y2="269" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
    <text x="702" y="262" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">No</text>

    <rect x="744" y="251" width="126" height="36" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="807" y="274" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle">Torn Read</text>

    <!-- Branch 4: Yes -> Valid Update -->
    <line x1="600" y1="287" x2="600" y2="320" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <text x="575" y="306" font-size="9" font-weight="700" fill="#16A34A" text-anchor="middle">Yes</text>

    <!-- Step 3: Valid Update -->
    <rect x="535" y="323" width="130" height="36" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="600" y="346" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">Consistent Snapshot</text>
  </g>
</svg>
