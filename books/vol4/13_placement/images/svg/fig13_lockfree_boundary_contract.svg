<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%"><style>
        .bg { fill: #FFFFFF; }
        .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #1F407A; }
        .text { font-family: sans-serif; font-size: 14px; fill: #2D3748; }
        .text-bold { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #2D3748; }
        .small { font-family: sans-serif; font-size: 12px; fill: #2D3748; }
        .small-white { font-family: sans-serif; font-size: 12px; fill: #FFFFFF; }
        .warn { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #A51C30; }
        .box { fill: #E2E8F0; stroke: #2D3748; stroke-width: 1.5; }
        .box-blue { fill: #1F407A; stroke: #1F407A; stroke-width: 1.5; }
        .box-red { fill: #A51C30; stroke: #A51C30; stroke-width: 1.5; }
        .box-light-blue { fill: #EBF8FF; stroke: #1F407A; stroke-width: 1.5; }
        .box-light-red { fill: #FDE8E8; stroke: #A51C30; stroke-width: 1.5; }
        .line { stroke: #2D3748; stroke-width: 1.5; fill: none; }
        .line-thick { stroke: #2D3748; stroke-width: 2.5; fill: none; }
        .line-dashed { stroke: #2D3748; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
        .arrow { stroke: #1F407A; stroke-width: 2; fill: none; }
        .arrow-red { stroke: #A51C30; stroke-width: 2; fill: none; }
    </style><rect width="1000" height="550" class="bg" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2D3748" /></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1F407A" /></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A51C30" /></marker></defs><text x="20" y="30" class="title">(a) Inter-Core Lock-Free State Exchange (Seqlock)</text><rect x="20" y="60" width="220" height="160" class="box-light-blue" /><text x="130" y="90" class="title" text-anchor="middle">Proposal Writer</text><text x="130" y="110" class="small" text-anchor="middle">(Untrusted NPU/MPU)</text><text x="130" y="150" class="text" text-anchor="middle">1. S = S + 1 (odd)</text><text x="130" y="170" class="text" text-anchor="middle">2. Write Payload</text><text x="130" y="190" class="text" text-anchor="middle">3. S = S + 1 (even)</text><rect x="350" y="60" width="280" height="240" class="box" /><text x="490" y="90" class="title" text-anchor="middle">Shared SRAM (Zero-Copy)</text><text x="490" y="110" class="small" text-anchor="middle">No mutex, no allocation</text><rect x="370" y="125" width="240" height="30" class="box-blue" /><text x="490" y="145" class="small-white" text-anchor="middle">Monotonic Sequence Counter (S)</text><rect x="370" y="165" width="240" height="120" class="box" /><text x="490" y="185" class="text-bold" text-anchor="middle">Self-Contained Payload (256 B)</text><text x="380" y="210" class="small">• Cmd Mass Flow (m_dot_cmd)</text><text x="380" y="230" class="small">• Sequence Index (k)</text><text x="380" y="250" class="small">• Hardware Timestamp (t_prod)</text><text x="380" y="270" class="small">• Lease Validity (Δt_valid), CRC-32</text><rect x="740" y="60" width="240" height="160" class="box-light-red" /><text x="860" y="90" class="title" text-anchor="middle">Safety Reader</text><text x="860" y="110" class="small" text-anchor="middle">(Deterministic MCU)</text><text x="860" y="150" class="text" text-anchor="middle">1. S1 = Read(S)</text><text x="860" y="170" class="text" text-anchor="middle">2. Read Payload</text><text x="860" y="190" class="text" text-anchor="middle">3. S2 = Read(S)</text><path d="M240 140 L340 140" class="arrow" marker-end="url(#arrow-blue)" /><text x="290" y="130" class="small" text-anchor="middle">Store-Release</text><path d="M630 140 L730 140" class="arrow-red" marker-end="url(#arrow-red)" /><text x="680" y="130" class="small" text-anchor="middle">Load-Acquire</text><text x="20" y="340" class="title">(b) Writer Preemption Matrix &amp; Deterministic Fallbacks</text><rect x="20" y="360" width="220" height="30" class="box-blue" /><text x="130" y="380" class="small-white" text-anchor="middle">Failure Class</text><rect x="240" y="360" width="380" height="30" class="box-blue" /><text x="430" y="380" class="small-white" text-anchor="middle">Detection Condition (Safety Reader)</text><rect x="620" y="360" width="360" height="30" class="box-red" /><text x="800" y="380" class="small-white" text-anchor="middle">Bounded Real-Time Fallback (&lt;5 µs)</text><rect x="20" y="390" width="220" height="30" class="box" /><text x="130" y="410" class="text-bold" text-anchor="middle">Torn / In-Flight</text><rect x="240" y="390" width="380" height="30" class="box" /><text x="430" y="410" class="text" text-anchor="middle">S1 % 2 != 0  OR  S1 != S2</text><rect x="620" y="390" width="360" height="30" class="box-light-red" /><text x="800" y="410" class="small" text-anchor="middle">Trap: Discard snapshot, use previous safe state</text><rect x="20" y="420" width="220" height="30" class="box" /><text x="130" y="440" class="text-bold" text-anchor="middle">Malformed</text><rect x="240" y="420" width="380" height="30" class="box" /><text x="430" y="440" class="text" text-anchor="middle">CRC-32 fails  OR  m_dot_cmd out of bounds</text><rect x="620" y="420" width="360" height="30" class="box-light-red" /><text x="800" y="440" class="small" text-anchor="middle">Trap: Reject command, clamp valve</text><rect x="20" y="450" width="220" height="30" class="box" /><text x="130" y="470" class="text-bold" text-anchor="middle">Stale</text><rect x="240" y="450" width="380" height="30" class="box" /><text x="430" y="470" class="text" text-anchor="middle">t_now &gt; t_prod + Δt_valid</text><rect x="620" y="450" width="360" height="30" class="box-light-red" /><text x="800" y="470" class="small" text-anchor="middle">Timeout: Clamp valve (transient), ramp down if &gt; 10ms</text><rect x="20" y="480" width="220" height="30" class="box" /><text x="130" y="500" class="text-bold" text-anchor="middle">Missing</text><rect x="240" y="480" width="380" height="30" class="box" /><text x="430" y="500" class="text" text-anchor="middle">k_new &gt; k_prev + 1</text><rect x="620" y="480" width="360" height="30" class="box-light-red" /><text x="800" y="500" class="small" text-anchor="middle">Skip detected: Log fault, hold state</text><text x="500" y="530" class="warn" text-anchor="middle">Guarantees continuous 1000 Hz actuator regulation even during host crashes</text></svg>