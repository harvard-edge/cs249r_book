<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 670" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Base (clean white, no outer border stroke) -->
  <rect width="980" height="670" fill="#FFFFFF"/>

  <defs>
    <style>
      .txt-halo {
        paint-order: stroke fill;
        stroke: #FFFFFF;
        stroke-width: 3.5px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ==================== TIME AXIS (LEFT) ==================== -->
  <line x1="42" y1="75" x2="42" y2="645" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="42" y="65" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">Time (t)</text>

  <!-- Time Ticks -->
  <line x1="37" y1="135" x2="47" y2="135" stroke="#94A3B8" stroke-width="1"/>
  <text x="33" y="138" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B" text-anchor="end">t₀</text>

  <line x1="37" y1="240" x2="47" y2="240" stroke="#94A3B8" stroke-width="1"/>
  <text x="33" y="243" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B" text-anchor="end">t₁</text>

  <line x1="37" y1="425" x2="47" y2="425" stroke="#94A3B8" stroke-width="1"/>
  <text x="33" y="428" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B" text-anchor="end">t₂</text>

  <line x1="37" y1="495" x2="47" y2="495" stroke="#94A3B8" stroke-width="1"/>
  <text x="33" y="498" font-size="8.5" font-family="'Menlo', monospace" fill="#64748B" text-anchor="end">t₃</text>

  <!-- ==================== PARTICIPANT LIFELINES (VERTICAL) ==================== -->
  <!-- LIFELINE 1: Cognitive Policy Writer (x=175) -->
  <line x1="175" y1="72" x2="175" y2="585" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- LIFELINE 2: Shared SRAM Mailbox (x=500) -->
  <line x1="500" y1="72" x2="500" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- LIFELINE 3: RTOS MCU Safety Reader (x=825) -->
  <line x1="825" y1="72" x2="825" y2="585" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================== PARTICIPANT HEADERS ==================== -->
  <!-- Header 1: Proposal Writer (Linux MPU) -->
  <rect x="85" y="22" width="180" height="46" rx="4" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1.3"/>
  <text x="175" y="40" font-size="10.5" font-weight="700" fill="#1E40AF" text-anchor="middle">Proposal Writer (Brain)</text>
  <text x="175" y="55" font-size="8.5" fill="#2563EB" text-anchor="middle">Linux MPU (10–50 Hz Proposer)</text>

  <!-- Header 2: Shared SRAM Mailbox -->
  <rect x="400" y="22" width="200" height="46" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="500" y="40" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Shared SRAM Mailbox</text>
  <text x="500" y="55" font-size="8.5" fill="#475569" text-anchor="middle">Atomic Sequence S &amp; Payload Buffer</text>

  <!-- Header 3: Safety Reader (RTOS MCU) -->
  <rect x="725" y="22" width="200" height="46" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
  <text x="825" y="40" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">Safety Enforcer (Nervous)</text>
  <text x="825" y="55" font-size="8.5" fill="#059669" text-anchor="middle">RTOS MCU (1 kHz Enforcer Loop)</text>

  <!-- ==================== ACTIVATION BARS ==================== -->
  <!-- Scenario A: Writer active during publish (y=125 to y=205) -->
  <rect x="169" y="125" width="12" height="80" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>

  <!-- SRAM Mailbox state bar: continuous storage -->
  <rect x="492" y="80" width="16" height="500" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="1"/>

  <!-- Scenario A: Reader active during 1 kHz tick sample (y=230 to y=310) -->
  <rect x="819" y="230" width="12" height="80" rx="2" fill="#DCFCE7" stroke="#059669" stroke-width="1"/>

  <!-- Scenario B: Writer active during write collision (y=415 to y=520) -->
  <rect x="169" y="415" width="12" height="105" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>

  <!-- Scenario B: Reader active during 1 kHz tick sample (y=440 to y=490) -->
  <rect x="819" y="440" width="12" height="50" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>

  <!-- ==================== SCENARIO A DIVIDER BANNER ==================== -->
  <g transform="translate(60, 85)">
    <rect width="895" height="22" rx="3" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="0.8"/>
    <rect x="0" y="0" width="220" height="22" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="110" y="15" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">SCENARIO A: CONSISTENT READ</text>
    <text x="230" y="15" font-size="8.5" fill="#14532D">Writer completes publish before Reader tick; Seqlock verifies S₁ == S₂ (even) → Chunk Admitted</text>
  </g>

  <!-- Step A1: Writer sets S = odd -->
  <line x1="181" y1="135" x2="484" y2="135" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <text x="332" y="129" class="txt-halo" font-size="8.5" font-weight="700" fill="#1E40AF" text-anchor="middle">1. atomic_store_release(&amp;S, S + 1)  [S = 2k + 1 (odd)]</text>
  <!-- S state pill on mailbox -->
  <rect x="466" y="138" width="68" height="16" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8"/>
  <text x="500" y="150" font-size="8" font-family="'Menlo', monospace" font-weight="700" fill="#1D4ED8" text-anchor="middle">S = 2k + 1</text>

  <!-- Step A2: Writer copies payload -->
  <line x1="181" y1="168" x2="484" y2="168" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <text x="332" y="162" class="txt-halo" font-size="8.5" font-weight="600" fill="#1E40AF" text-anchor="middle">2. memcpy(&amp;mailbox.payload, &amp;chunk, sizeof(chunk))</text>

  <!-- Step A3: Writer commits S = even with store-release -->
  <line x1="181" y1="198" x2="484" y2="198" stroke="#166534" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="332" y="192" class="txt-halo" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">3. atomic_store_release(&amp;S, S + 1)  [S = 2k + 2 (even)]</text>
  <!-- S state pill on mailbox -->
  <rect x="466" y="202" width="68" height="16" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="500" y="214" font-size="8" font-family="'Menlo', monospace" font-weight="700" fill="#166534" text-anchor="middle">S = 2k + 2</text>

  <!-- Step A4: Reader 1 kHz Tick starts: samples S1 -->
  <line x1="819" y1="242" x2="516" y2="242" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="665" y="236" class="txt-halo" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">4. S₁ = atomic_load_acquire(&amp;S)  →  2k + 2 (even: idle)</text>

  <!-- Step A5: Reader copies payload -->
  <line x1="516" y1="268" x2="813" y2="268" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="665" y="262" class="txt-halo" font-size="8.5" font-weight="600" fill="#047857" text-anchor="middle">5. memcpy(&amp;local_chunk, &amp;mailbox.payload, sizeof(chunk))</text>

  <!-- Step A6: Reader samples S2 -->
  <line x1="819" y1="292" x2="516" y2="292" stroke="#059669" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="665" y="286" class="txt-halo" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">6. S₂ = atomic_load_acquire(&amp;S)  →  2k + 2 (match!)</text>

  <!-- Step A7: Result pill -->
  <rect x="655" y="306" width="260" height="20" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="785" y="320" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">VERIFIED: (S₁ == S₂) &amp;&amp; !(S₁ &amp; 1) → ADMIT CHUNK</text>

  <!-- ==================== SCENARIO B DIVIDER BANNER ==================== -->
  <g transform="translate(60, 345)">
    <rect width="895" height="22" rx="3" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8"/>
    <rect x="0" y="0" width="220" height="22" rx="3" fill="#FEF3C7" stroke="#FCD34D" stroke-width="0.8"/>
    <text x="110" y="15" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">SCENARIO B: TORN READ COLLISION</text>
    <text x="230" y="15" font-size="8.5" fill="#78350F">Writer mid-update during 1 kHz Tick; Reader detects odd S₁ or S₁ ≠ S₂ → O(1) Immediate Discard</text>
  </g>

  <!-- Step B1: Writer starts update S = odd -->
  <line x1="181" y1="422" x2="484" y2="422" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <text x="332" y="416" class="txt-halo" font-size="8.5" font-weight="700" fill="#1E40AF" text-anchor="middle">1. atomic_store_release(&amp;S, S + 1)  [S = 2k + 3 (odd)]</text>
  <!-- S state pill on mailbox -->
  <rect x="466" y="426" width="68" height="16" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8"/>
  <text x="500" y="438" font-size="8" font-family="'Menlo', monospace" font-weight="700" fill="#1D4ED8" text-anchor="middle">S = 2k + 3</text>

  <!-- Step B2: Writer mid-payload write -->
  <line x1="181" y1="452" x2="484" y2="452" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <text x="332" y="446" class="txt-halo" font-size="8.5" font-weight="600" fill="#1E40AF" text-anchor="middle">Writer streaming payload bytes to SRAM (asynchronous)...</text>

  <!-- Step B3: Reader 1 kHz Tick arrives during write -->
  <line x1="819" y1="456" x2="516" y2="456" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="665" y="450" class="txt-halo" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">2. S₁ = atomic_load_acquire(&amp;S)  →  2k + 3 (ODD DETECTED)</text>

  <!-- Step B4: Reader fast-rejects without blocking -->
  <rect x="665" y="468" width="250" height="38" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="790" y="482" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">TORN WRITE DETECTED: (S₁ &amp; 1) != 0</text>
  <text x="790" y="496" font-size="8" font-family="'Menlo', monospace" fill="#B91C1C" text-anchor="middle">Discard in O(1); Retain previous chunk / fallback</text>

  <!-- Step B5: Writer finally completes later -->
  <line x1="181" y1="518" x2="484" y2="518" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-slate)"/>
  <text x="332" y="512" class="txt-halo" font-size="8.5" fill="#475569" text-anchor="middle">Writer commits S = 2k + 4 (available on next 1 kHz tick)</text>
  <!-- S state pill on mailbox -->
  <rect x="466" y="522" width="68" height="16" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="500" y="534" font-size="8" font-family="'Menlo', monospace" font-weight="700" fill="#166534" text-anchor="middle">S = 2k + 4</text>

  <!-- Non-blocking guarantee annotation -->
  <g transform="translate(665, 520)">
    <rect width="250" height="24" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="125" y="16" font-size="8.5" font-weight="600" fill="#334155" text-anchor="middle">Zero Mutex Contention / Zero Blocking</text>
  </g>

  <!-- ==================== CALLOUT / ARCHITECTURAL INVARIANT ==================== -->
  <g transform="translate(60, 595)">
    <rect width="895" height="54" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="16" y="19" font-size="9" font-weight="700" fill="#1E40AF">Boundary Invariant: Non-Blocking Spatial and Temporal Decoupling</text>
    <text x="16" y="33" font-size="8.5" fill="#1E3A8A">The 1 kHz real-time enforcer never spins, waits on locks, or blocks on unprivileged neural network inference.</text>
    <text x="16" y="45" font-size="8.5" fill="#1E3A8A">Torn reads and dropped proposals are rejected in bounded O(1) time, preserving deterministic control cadence.</text>
    <rect x="750" y="16" width="130" height="22" rx="3" fill="#1E40AF"/>
    <text x="815" y="31" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Hard RT Cadence Intact</text>
  </g>
</svg>
