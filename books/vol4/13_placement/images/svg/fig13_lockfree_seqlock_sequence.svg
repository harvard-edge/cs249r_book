<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 415" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Base (clean white, no outer border stroke) -->
  <rect width="880" height="415" fill="#FFFFFF"/>

  <defs>
    <style>
      .hdr-title { font-size: 11px; font-weight: 700; }
      .hdr-sub { font-size: 8.5px; }
      .msg-text { font-size: 8.5px; font-weight: 600; }
      .phase-tag { font-size: 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
      .code-token { font-family: 'Menlo', monospace; font-size: 8px; }
      .txt-halo {
        paint-order: stroke fill;
        stroke: #FFFFFF;
        stroke-width: 3px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ==================== PARTICIPANT LIFELINES (VERTICAL) ==================== -->
  <!-- Lifeline 1: Proposal Writer (x=160) -->
  <line x1="160" y1="58" x2="160" y2="368" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- Lifeline 2: Shared SRAM Mailbox (x=480) -->
  <line x1="480" y1="58" x2="480" y2="368" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Lifeline 3: Safety Enforcer (x=760) -->
  <line x1="760" y1="58" x2="760" y2="368" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================== PARTICIPANT HEADERS ==================== -->
  <!-- Header 1: Proposal Writer (Linux MPU) -->
  <rect x="85" y="16" width="150" height="42" rx="4" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1.2"/>
  <text x="160" y="33" class="hdr-title" fill="#1E40AF" text-anchor="middle">Proposal Writer (Brain)</text>
  <text x="160" y="47" class="hdr-sub" fill="#2563EB" text-anchor="middle">Linux MPU (10–50 Hz Proposer)</text>

  <!-- Header 2: Shared SRAM Mailbox -->
  <rect x="385" y="16" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="480" y="33" class="hdr-title" fill="#0F172A" text-anchor="middle">Shared SRAM Mailbox</text>
  <text x="480" y="47" class="hdr-sub" fill="#475569" text-anchor="middle">Atomic Sequence S &amp; Payload</text>

  <!-- Header 3: Safety Enforcer (RTOS MCU) -->
  <rect x="670" y="16" width="180" height="42" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
  <text x="760" y="33" class="hdr-title" fill="#047857" text-anchor="middle">Safety Enforcer (Nervous)</text>
  <text x="760" y="47" class="hdr-sub" fill="#059669" text-anchor="middle">RTOS MCU (1 kHz Enforcer Loop)</text>

  <!-- ==================== ACTIVATION BARS ==================== -->
  <!-- Scenario A: Writer active during publish (y=88 to y=148) -->
  <rect x="154" y="88" width="12" height="60" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>

  <!-- Mailbox state bar: continuous storage -->
  <rect x="474" y="68" width="12" height="295" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>

  <!-- Scenario A: Enforcer active during 1 kHz sample (y=162 to y=225) -->
  <rect x="754" y="162" width="12" height="63" rx="2" fill="#DCFCE7" stroke="#059669" stroke-width="1"/>

  <!-- Scenario B: Writer active during write collision (y=275 to y=355) -->
  <rect x="154" y="275" width="12" height="80" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>

  <!-- Scenario B: Enforcer active during 1 kHz collision sample (y=300 to y=345) -->
  <rect x="754" y="300" width="12" height="45" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>

  <!-- ==================== SCENARIO A: CONSISTENT READ ==================== -->
  <g transform="translate(14, 75)">
    <line x1="0" y1="0" x2="852" y2="0" stroke="#DCFCE7" stroke-width="0.8" stroke-dasharray="3,3"/>
    <rect x="0" y="-8" width="120" height="16" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="60" y="3.5" class="phase-tag" fill="#166534" text-anchor="middle">A. Consistent Read</text>
  </g>

  <!-- Step A1: Writer sets S = odd -->
  <line x1="166" y1="96" x2="468" y2="96" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="315" y="91" class="msg-text txt-halo" fill="#1E40AF" text-anchor="middle">1. atomic_store_release(&amp;S, 2k + 1)  [write in-flight]</text>

  <!-- Step A2: Writer copies payload -->
  <line x1="166" y1="118" x2="468" y2="118" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="315" y="113" class="msg-text txt-halo" fill="#1E40AF" text-anchor="middle">2. Write candidate chunk payload û_t:t+H</text>

  <!-- Step A3: Writer commits S = even with store-release -->
  <line x1="166" y1="140" x2="468" y2="140" stroke="#166534" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="315" y="135" class="msg-text txt-halo" fill="#166534" text-anchor="middle">3. atomic_store_release(&amp;S, 2k + 2)  [commit-release]</text>

  <!-- Step A4: Reader samples S1 -->
  <line x1="754" y1="172" x2="492" y2="172" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="625" y="167" class="msg-text txt-halo" fill="#047857" text-anchor="middle">4. S₁ = load_acquire(&amp;S)  →  2k + 2 (even: writer idle)</text>

  <!-- Step A5: Reader copies payload -->
  <line x1="492" y1="192" x2="748" y2="192" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="625" y="187" class="msg-text txt-halo" fill="#047857" text-anchor="middle">5. Read payload chunk û_t:t+H into local stack</text>

  <!-- Step A6: Reader samples S2 -->
  <line x1="754" y1="212" x2="492" y2="212" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="625" y="207" class="msg-text txt-halo" fill="#047857" text-anchor="middle">6. S₂ = load_acquire(&amp;S)  →  2k + 2 (match: S₁ == S₂)</text>

  <!-- Step A7: Result pill -->
  <rect x="620" y="224" width="220" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="730" y="236.5" class="code-token" font-weight="700" fill="#166534" text-anchor="middle">Verified Consistent → Chunk Admitted</text>

  <!-- ==================== SCENARIO B: TORN READ COLLISION ==================== -->
  <g transform="translate(14, 258)">
    <line x1="0" y1="0" x2="852" y2="0" stroke="#FDE68A" stroke-width="0.8" stroke-dasharray="3,3"/>
    <rect x="0" y="-8" width="120" height="16" rx="3" fill="#FEF3C7" stroke="#FCD34D" stroke-width="0.8"/>
    <text x="60" y="3.5" class="phase-tag" fill="#92400E" text-anchor="middle">B. Torn Collision</text>
  </g>

  <!-- Step B1: Writer starts update S = odd -->
  <line x1="166" y1="282" x2="468" y2="282" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="315" y="277" class="msg-text txt-halo" fill="#1E40AF" text-anchor="middle">1. atomic_store_release(&amp;S, 2k + 3)  [odd: writing]</text>

  <!-- Step B2: Writer mid-payload write -->
  <line x1="166" y1="304" x2="468" y2="304" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <text x="315" y="299" class="msg-text txt-halo" fill="#1E40AF" text-anchor="middle">Writer streaming payload bytes to SRAM...</text>

  <!-- Step B3: Reader 1 kHz Tick arrives during write -->
  <line x1="754" y1="312" x2="492" y2="312" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="625" y="307" class="msg-text txt-halo" fill="#DC2626" text-anchor="middle">2. S₁ = load_acquire(&amp;S)  →  2k + 3 (odd detected!)</text>

  <!-- Step B4: Reader fast-rejects without blocking -->
  <rect x="620" y="324" width="220" height="28" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
  <text x="730" y="336" class="code-token" font-weight="700" fill="#991B1B" text-anchor="middle">Torn Read ((S₁ &amp; 1) ≠ 0) → Discard in O(1)</text>
  <text x="730" y="347" font-size="8" fill="#7F1D1D" text-anchor="middle">Zero lock wait; retain prior chunk or fallback</text>

  <!-- Step B5: Writer finally commits later -->
  <line x1="166" y1="350" x2="468" y2="350" stroke="#64748B" stroke-width="1.1" stroke-dasharray="3,3" marker-end="url(#arr-slate)"/>
  <text x="315" y="345" class="msg-text txt-halo" fill="#64748B" text-anchor="middle">Writer commits S = 2k + 4 (available next tick)</text>

  <!-- ==================== BOTTOM ARCHITECTURAL INVARIANT NOTE ==================== -->
  <g transform="translate(14, 390)">
    <line x1="0" y1="0" x2="852" y2="0" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2,2"/>
    <rect x="0" y="-8" width="80" height="16" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
    <text x="40" y="3.5" class="phase-tag" fill="#1E40AF" text-anchor="middle">Invariant</text>
    <text x="95" y="4" font-size="8.5" fill="#1E3A8A">Lock-free boundary guarantees zero priority inversion: enforcer never spins, blocks, or yields hard real-time cadence.</text>
  </g>
</svg>
