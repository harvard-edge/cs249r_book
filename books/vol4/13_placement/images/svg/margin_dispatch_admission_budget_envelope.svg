<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="180" height="116" fill="#ffffff"/>
  <!-- one stacked bar of the dispatch-to-admission allocation (63.3 ms), to scale on 0..100.8 ms -->
  <rect x="8.00" y="40" width="63.51" height="32" fill="#e67817" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="71.51" y="40" width="2.08" height="32" fill="#7e317b"/>
  <rect x="73.59" y="40" width="28.58" height="32" fill="#5e6b73" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="102.17" y="40" width="6.35" height="32" fill="#cccccc" stroke="#ffffff" stroke-width="0.8"/>
  <!-- reserve up to the ceiling the stopping spare can pay for -->
  <rect x="109.12" y="40.7" width="57.88" height="30.6" fill="none" stroke="#4a5568" stroke-width="1.3" stroke-dasharray="2.6 1.6"/>
  <line x1="168.8" y1="20" x2="168.8" y2="98" stroke="#cb202d" stroke-width="2"/>
  <text x="178" y="14" font-size="12.5" font-weight="bold" fill="#cb202d" text-anchor="end">100.8 ms ceiling</text>
  <!-- in-bar values -->
  <text x="39.76" y="60.5" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">40</text>
  <text x="87.88" y="60.5" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">18</text>
  <text x="138.26" y="60.5" font-size="12.5" font-weight="bold" fill="#4a5568" text-anchor="middle">37.5</text>
  <!-- the one called-out sliver -->
  <text x="72.55" y="30" font-size="12.5" font-weight="bold" fill="#7e317b" text-anchor="middle">link 1.31 ms</text>
  <line x1="72.55" y1="33" x2="72.55" y2="40" stroke="#7e317b" stroke-width="1.2"/>
  <!-- segment names -->
  <text x="39.76" y="90" font-size="12.5" fill="#333333" text-anchor="middle">inference</text>
  <text x="87.88" y="107" font-size="12.5" fill="#333333" text-anchor="middle">validation</text>
  <text x="138.26" y="90" font-size="12.5" font-weight="bold" fill="#4a5568" text-anchor="middle">reserve</text>
</svg>
