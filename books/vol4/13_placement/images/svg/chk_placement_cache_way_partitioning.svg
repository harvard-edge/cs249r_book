<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-compute" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#c87b2a"/>
    </marker>
    <marker id="arr-safe" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#3d9e5a"/>
    </marker>
    <marker id="arr-hazard" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#c44"/>
    </marker>
  </defs>

  <!-- Outer Card Container -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================================================================== -->
  <!-- LEFT PANEL: UNPARTITIONED SHARED LLC (THRASHING CLIFF)                -->
  <!-- ==================================================================== -->
  <g id="panel-unpartitioned">
    <rect x="16" y="16" width="246" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="139" y="32" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">UNPARTITIONED LLC (THRASHING CLIFF)</text>

    <!-- Cores -->
    <rect x="28" y="42" width="126" height="22" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="1"/>
    <text x="91" y="56.5" font-size="8.5" font-weight="600" fill="#78350f" text-anchor="middle">Cores 0–2 (Vision VLA)</text>

    <rect x="160" y="42" width="90" height="22" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/>
    <text x="205" y="56.5" font-size="8.5" font-weight="600" fill="#14532d" text-anchor="middle">Core 3 (Enforcer)</text>

    <!-- Connectors -->
    <path d="M 91 64 V 74" fill="none" stroke="#c87b2a" stroke-width="1.2" marker-end="url(#arr-compute)"/>
    <path d="M 205 64 V 74" fill="none" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arr-safe)"/>

    <!-- Shared L3 Cache -->
    <rect x="28" y="74" width="222" height="40" rx="3" fill="#ffffff" stroke="#4a90c4" stroke-width="1"/>
    <text x="34" y="84" font-size="7.5" font-weight="700" fill="#1e3a8a">Shared 16-Way L3 Cache</text>

    <!-- Cache Way Distribution -->
    <rect x="34" y="88" width="144" height="20" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="106" y="101" font-size="8" font-weight="600" fill="#78350f" text-anchor="middle">Vision Streaming Lines (Tensors)</text>

    <rect x="182" y="88" width="62" height="20" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.75" stroke-dasharray="2,2"/>
    <text x="213" y="101" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">LUT Evicted</text>

    <!-- Eviction Arrow -->
    <path d="M 213 108 V 122" fill="none" stroke="#c44" stroke-width="1.2" marker-end="url(#arr-hazard)"/>

    <!-- Failure Metric Capsule -->
    <rect x="28" y="124" width="222" height="28" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="139" y="137" font-size="8.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">DRAM MISS PENALTY: 20 ns → 350 ns</text>
    <text x="139" y="147" font-size="7.5" fill="#7f1d1d" text-anchor="middle">Safety tables evicted · 17.5× latency tail breach</text>
  </g>

  <!-- ==================================================================== -->
  <!-- RIGHT PANEL: WAY-PARTITIONED LLC (ARM MPAM / CAT)                     -->
  <!-- ==================================================================== -->
  <g id="panel-partitioned">
    <rect x="278" y="16" width="246" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="401" y="32" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">WAY-PARTITIONED LLC (ARM MPAM)</text>

    <!-- Cores -->
    <rect x="290" y="42" width="126" height="22" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="1"/>
    <text x="353" y="56.5" font-size="8.5" font-weight="600" fill="#78350f" text-anchor="middle">Cores 0–2 (Vision VLA)</text>

    <rect x="422" y="42" width="90" height="22" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/>
    <text x="467" y="56.5" font-size="8.5" font-weight="600" fill="#14532d" text-anchor="middle">Core 3 (Enforcer)</text>

    <!-- Connectors -->
    <path d="M 353 64 V 74" fill="none" stroke="#c87b2a" stroke-width="1.2" marker-end="url(#arr-compute)"/>
    <path d="M 467 64 V 74" fill="none" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arr-safe)"/>

    <!-- Shared L3 Cache with MPAM Boundary -->
    <rect x="290" y="74" width="222" height="40" rx="3" fill="#ffffff" stroke="#4a90c4" stroke-width="1"/>
    <text x="296" y="84" font-size="7.5" font-weight="700" fill="#1e3a8a">Partitioned 16-Way L3 Cache</text>

    <!-- Partitioned Ways -->
    <rect x="296" y="88" width="140" height="20" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="366" y="101" font-size="8" font-weight="600" fill="#78350f" text-anchor="middle">Ways 0–11: Vision Quota (75%)</text>

    <!-- Hardware Partition Barrier -->
    <line x1="440" y1="86" x2="440" y2="112" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3,2"/>

    <rect x="444" y="88" width="62" height="20" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="475" y="101" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">Ways 12–15</text>

    <!-- Success Metric Capsule -->
    <rect x="290" y="124" width="222" height="28" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="401" y="137" font-size="8.5" font-weight="700" fill="#14532d" text-anchor="middle">GUARANTEED L3 HIT: ≤ 20 ns LATENCY</text>
    <text x="401" y="147" font-size="7.5" fill="#14532d" text-anchor="middle">Hardware FFI · Real-time tables locked against eviction</text>
  </g>
</svg>
