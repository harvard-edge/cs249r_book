<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-axis" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#64748b"/>
    </marker>
    <marker id="arr-dim-left" viewBox="0 0 6 4" refX="1" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="6 0, 0 2, 6 4" fill="#334155"/>
    </marker>
    <marker id="arr-dim-right" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#334155"/>
    </marker>
  </defs>

  <!-- Outer Card Container -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================================================================== -->
  <!-- LEFT PANEL: JUNCTION TEMPERATURE COOLING TRAJECTORY                  -->
  <!-- ==================================================================== -->
  <g id="panel-thermal-cooling">
    <rect x="16" y="16" width="278" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="155" y="32" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">THERMAL MASS COOLING HYSTERESIS</text>

    <!-- Throttled Band (Hysteresis Window) -->
    <rect x="52" y="46" width="138" height="34" fill="#f9d6d5" opacity="0.45"/>
    <text x="95" y="73" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">600 MHz while hot</text>

    <!-- Threshold Reference Lines -->
    <!-- T_trip = 95°C -->
    <line x1="52" y1="46" x2="278" y2="46" stroke="#c44" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="48" y="49" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="end">95°C</text>
    <text x="274" y="43" font-size="7" font-weight="600" fill="#7f1d1d" text-anchor="end">T_trip (Throttle Trigger)</text>

    <!-- T_clear = 85°C -->
    <line x1="52" y1="80" x2="278" y2="80" stroke="#3d9e5a" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="48" y="83" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="end">85°C</text>
    <text x="274" y="77" font-size="7" font-weight="600" fill="#14532d" text-anchor="end">T_clear (Nominal Restored)</text>

    <!-- Baseline T_target = 53°C -->
    <line x1="52" y1="126" x2="278" y2="126" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="2,2"/>
    <text x="48" y="129" font-size="7.5" fill="#64748b" text-anchor="end">53°C</text>
    <text x="274" y="123" font-size="7" fill="#64748b" text-anchor="end">T_target (Idle Baseline)</text>

    <!-- Cooling Curve: Starts at (52, 46), crosses (190, 80), decays toward 126 -->
    <path d="M 52 46 C 105 50, 150 68, 190 80 C 228 91, 255 110, 276 117" fill="none" stroke="#1e3a8a" stroke-width="2"/>

    <!-- Clearance Point Marker -->
    <circle cx="190" cy="80" r="3" fill="#3d9e5a" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Vertical Drop Line at Clearance Time -->
    <line x1="190" y1="80" x2="190" y2="132" stroke="#3d9e5a" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Time Axis -->
    <line x1="52" y1="132" x2="280" y2="132" stroke="#64748b" stroke-width="1" marker-end="url(#arr-axis)"/>
    <text x="52" y="142" font-size="7.5" font-weight="600" fill="#334155">t = 0 (VLA Halt)</text>
    <text x="190" y="142" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">t = 2.18 s</text>

    <!-- Recovery Delta Dimension Line -->
    <line x1="56" y1="152" x2="186" y2="152" stroke="#334155" stroke-width="0.8" marker-start="url(#arr-dim-left)" marker-end="url(#arr-dim-right)"/>
    <text x="121" y="150" font-size="7.5" font-weight="700" fill="#1e293b" text-anchor="middle">Δt_recov = 2.18 s (2,175 Ticks in Hysteresis)</text>
  </g>

  <!-- ==================================================================== -->
  <!-- RIGHT PANEL: 1 kHz TICK DEADLINE IMPACT                               -->
  <!-- ==================================================================== -->
  <g id="panel-tick-budget">
    <rect x="306" y="16" width="218" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="415" y="32" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">1 kHz CONTROL TICK BUDGET</text>

    <!-- Time scale: 180 px per ms from x = 316. Deadline 400 us at x = 388; tick 1 ms at x = 496 -->
    <!-- 400 us Deadline Guide -->
    <!-- Drawn only through the two bar rows so it does not cross the row labels -->
    <line x1="388" y1="54" x2="388" y2="76" stroke="#c44" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="388" y1="92" x2="388" y2="114" stroke="#c44" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="388" y="40" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">400 µs Deadline</text>

    <!-- 1 ms Tick Guide -->
    <line x1="496" y1="42" x2="496" y2="116" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="496" y="40" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">1 ms Tick</text>

    <!-- Case 1: Nominal Clock -->
    <text x="316" y="52" font-size="8" font-weight="700" fill="#14532d">Nominal Clock (1.2 GHz)</text>

    <!-- Nominal Execution Bar: 250 us (width 45px) -->
    <rect x="316" y="56" width="45" height="18" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="338.5" y="68" font-size="7.5" font-weight="600" fill="#14532d" text-anchor="middle">250 µs</text>

    <!-- Slack Bar: 150 us (width 27px) -->
    <rect x="361" y="56" width="27" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="374.5" y="68" font-size="7" fill="#64748b" text-anchor="middle">Slack</text>

    <!-- Nominal Margin Badge -->
    <rect x="396" y="57" width="74" height="16" rx="8" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="433" y="68" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">+150 µs SLACK</text>

    <!-- Case 2: Throttled Clock -->
    <text x="316" y="90" font-size="8" font-weight="700" fill="#7f1d1d">Throttled Clock (600 MHz)</text>

    <!-- Throttled Execution Bar: 500 us = 400 us to the deadline (72px) + 100 us overrun (18px) -->
    <rect x="316" y="94" width="72" height="18" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="352" y="106" font-size="7.5" font-weight="600" fill="#78350f" text-anchor="middle">400 µs Budget</text>

    <rect x="388" y="94" width="18" height="18" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="410" y="106" font-size="7" font-weight="700" fill="#7f1d1d">+100 µs (500 µs total)</text>

    <!-- Overrun Alert Capsule -->
    <rect x="316" y="122" width="198" height="30" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="415" y="135" font-size="8" font-weight="700" fill="#7f1d1d" text-anchor="middle">DEADLINE VIOLATION: +25% OVERRUN</text>
    <text x="415" y="145" font-size="7" fill="#7f1d1d" text-anchor="middle">2,175 ticks exposed; fallback required</text>
  </g>
</svg>
