<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%"><style>
        .bg { fill: #FFFFFF; }
        .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #1F407A; }
        .text { font-family: sans-serif; font-size: 14px; fill: #2D3748; }
        .small { font-family: sans-serif; font-size: 12px; fill: #2D3748; }
        .small-white { font-family: sans-serif; font-size: 12px; fill: #FFFFFF; }
        .warn { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #A51C30; }
        .box { fill: #E2E8F0; stroke: #2D3748; stroke-width: 1.5; }
        .box-blue { fill: #1F407A; stroke: #1F407A; stroke-width: 1.5; }
        .box-red { fill: #A51C30; stroke: #A51C30; stroke-width: 1.5; }
        .box-light-blue { fill: #EBF8FF; stroke: #1F407A; stroke-width: 1.5; }
        .box-light-red { fill: #FDE8E8; stroke: #A51C30; stroke-width: 1.5; }
        .line { stroke: #2D3748; stroke-width: 1.5; fill: none; }
        .line-dashed { stroke: #2D3748; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
        .line-red { stroke: #A51C30; stroke-width: 2; fill: none; }
        .line-blue { stroke: #1F407A; stroke-width: 2; fill: none; }
    </style><rect width="1000" height="450" class="bg" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2D3748" /></marker></defs><text x="20" y="30" class="title">(a) On-Chip Memory Bus &amp; Cache Contention</text><rect x="20" y="60" width="160" height="60" class="box-light-blue" /><text x="100" y="85" class="title" text-anchor="middle">Proposal NPU</text><text x="100" y="105" class="small" text-anchor="middle">Streams 256 kB bursts</text><rect x="20" y="150" width="160" height="60" class="box-light-red" /><text x="100" y="175" class="title" text-anchor="middle">Real-Time MCU</text><text x="100" y="195" class="small" text-anchor="middle">Sensor read (5.0 µs)</text><path d="M180 90 L230 90" class="line" marker-end="url(#arrow)" /><path d="M180 180 L230 180" class="line" marker-end="url(#arrow)" /><rect x="240" y="50" width="160" height="170" class="box" /><text x="320" y="75" class="title" text-anchor="middle">DRAM Queue</text><rect x="250" y="90" width="140" height="25" class="box-blue" /><text x="320" y="107" class="small-white" text-anchor="middle">NPU Burst (256 kB)</text><rect x="250" y="120" width="140" height="25" class="box-blue" /><text x="320" y="137" class="small-white" text-anchor="middle">NPU Burst (256 kB)</text><rect x="250" y="180" width="140" height="25" class="box-red" /><text x="320" y="197" class="small-white" text-anchor="middle">MCU Read (64 kB)</text><text x="410" y="215" class="warn">Wait: 27.6 µs</text><text x="20" y="270" class="title">Timing Waterfall (1.0 ms control loop)</text><path d="M 20 290 L 480 290" class="line" /><text x="20" y="305" class="small">0</text><text x="370" y="305" class="small">120 µs Budget</text><path d="M 360 285 L 360 350" class="line-dashed" /><text x="20" y="325" class="text">Nominal:</text><rect x="80" y="310" width="250" height="20" class="box-light-red" /><text x="205" y="325" class="small" text-anchor="middle">Execution (Includes 5.0 µs read)</text><text x="20" y="355" class="text">Contended:</text><rect x="80" y="340" width="80" height="20" class="box" /><text x="120" y="355" class="small" text-anchor="middle">Stall: 27.6 µs</text><rect x="160" y="340" width="250" height="20" class="box-light-red" /><text x="285" y="355" class="small" text-anchor="middle">Execution shifted</text><text x="415" y="355" class="warn">+7.6 µs Overrun</text><path d="M 500 20 L 500 430" class="line-dashed" /><text x="520" y="30" class="title">(b) Power Distribution Network &amp; Voltage Droop</text><text x="520" y="80" class="text">Current (A)</text><path d="M 580 140 L 640 140 L 650 60 L 920 60" class="line-red" /><text x="700" y="80" class="warn">ΔI = 6.0 A, dI/dt = 3.0 A/ns</text><text x="700" y="100" class="text">(NPU Array Activation)</text><text x="520" y="210" class="text">Voltage (V)</text><path d="M 580 180 L 640 180 L 655 260 L 680 190 L 710 200 L 740 185 L 920 185" class="line-blue" /><path d="M 580 250 L 920 250" class="line-dashed" /><text x="920" y="245" class="warn" text-anchor="end">Vmin = 0.78 V</text><text x="520" y="185" class="text">0.85 V</text><text x="660" y="295" class="warn">ΔV = 138 mV Droop (16.2% collapse)</text><rect x="580" y="310" width="340" height="70" class="box-light-red" /><text x="750" y="340" class="warn" text-anchor="middle">Gate Delay Stretch: +38%</text><text x="750" y="360" class="warn" text-anchor="middle">Emergency Clock Halving (1.2 GHz → 600 MHz)</text></svg>