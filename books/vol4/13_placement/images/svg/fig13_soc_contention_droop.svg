<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%"><style>
        .bg { fill: #FFFFFF; }
        .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #1F407A; }
        .text { font-family: sans-serif; font-size: 14px; fill: #2D3748; }
        .small { font-family: sans-serif; font-size: 12px; fill: #2D3748; }
        .small-white { font-family: sans-serif; font-size: 12px; fill: #FFFFFF; }
        .warn { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #A51C30; }
        .box { fill: #E2E8F0; stroke: #2D3748; stroke-width: 1.5; }
        .box-blue { fill: #1F407A; stroke: #1F407A; stroke-width: 1.5; }
        .box-red { fill: #A51C30; stroke: #A51C30; stroke-width: 1.5; }
        .box-light-blue { fill: #EBF8FF; stroke: #1F407A; stroke-width: 1.5; }
        .box-light-red { fill: #FDE8E8; stroke: #A51C30; stroke-width: 1.5; }
        .line { stroke: #2D3748; stroke-width: 1.5; fill: none; }
        .line-dashed { stroke: #2D3748; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
        .line-red { stroke: #A51C30; stroke-width: 2; fill: none; }
        .line-blue { stroke: #1F407A; stroke-width: 2; fill: none; }
    </style><rect width="1000" height="450" class_="bg" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2D3748" /></marker></defs><text x="20" y="30" class_="title">(a) On-Chip Memory Bus &amp; Cache Contention</text><rect x="20" y="60" width="160" height="60" rx="4" class_="box-light-blue" /><text x="100" y="85" class_="title" text_anchor="middle">Proposal NPU</text><text x="100" y="105" class_="small" text_anchor="middle">Streams 256 kB bursts</text><rect x="20" y="150" width="160" height="60" rx="4" class_="box-light-red" /><text x="100" y="175" class_="title" text_anchor="middle">Real-Time MCU</text><text x="100" y="195" class_="small" text_anchor="middle">Sensor read (5.0 µs)</text><path d="M180 90 L230 90" class_="line" marker_end="url(#arrow)" /><path d="M180 180 L230 180" class_="line" marker_end="url(#arrow)" /><rect x="240" y="50" width="160" height="170" rx="4" class_="box" /><text x="320" y="75" class_="title" text_anchor="middle">DRAM Queue</text><rect x="250" y="90" width="140" height="25" class_="box-blue" /><text x="320" y="107" class_="small-white" text_anchor="middle">NPU Burst (256 kB)</text><rect x="250" y="120" width="140" height="25" class_="box-blue" /><text x="320" y="137" class_="small-white" text_anchor="middle">NPU Burst (256 kB)</text><rect x="250" y="180" width="140" height="25" class_="box-red" /><text x="320" y="197" class_="small-white" text_anchor="middle">MCU Read (64 kB)</text><text x="410" y="180" class_="warn">Wait: 27.6 µs</text><text x="20" y="270" class_="title">Timing Waterfall (1.0 ms control loop)</text><path d="M20 290 L480 290" class_="line" /><text x="20" y="305" class_="small">0</text><text x="360" y="305" class_="small" text_anchor="middle">120 µs Budget</text><path d="M360 285 L360 350" class_="line-dashed" /><text x="20" y="325" class_="text">Nominal:</text><rect x="80" y="310" width="250" height="20" class_="box-light-red" /><text x="205" y="325" class_="small" text_anchor="middle">Execution (Includes 5.0 µs read)</text><text x="20" y="355" class_="text">Contended:</text><rect x="80" y="340" width="80" height="20" class_="box" /><text x="120" y="355" class_="small" text_anchor="middle">Stall: 27.6 µs</text><rect x="160" y="340" width="250" height="20" class_="box-light-red" /><text x="285" y="355" class_="small" text_anchor="middle">Execution shifted</text><text x="415" y="355" class_="warn">+7.6 µs Overrun</text><path d="M500 20 L500 430" class_="line-dashed" /><text x="520" y="30" class_="title">(b) Power Distribution Network &amp; Voltage Droop</text><text x="520" y="80" class_="text">Current (A)</text><path d="M580 140 L640 140 L650 60 L920 60" class_="line-red" /><text x="700" y="80" class_="warn">ΔI = 6.0 A, dI/dt = 3.0 A/ns</text><text x="700" y="100" class_="text">(NPU Array Activation)</text><text x="520" y="210" class_="text">Voltage (V)</text><path d="M580 180 L640 180 L655 260 L680 190 L710 200 L740 185 L920 185" class_="line-blue" /><path d="M580 250 L920 250" class_="line-dashed" /><text x="930" y="255" class_="warn">Vmin = 0.78 V</text><text x="520" y="185" class_="text">0.85 V</text><text x="660" y="280" class_="warn">ΔV = 138 mV Droop (16.2% collapse)</text><rect x="580" y="310" width="340" height="70" rx="4" class_="box-light-red" /><text x="750" y="340" class_="warn" text_anchor="middle">Gate Delay Stretch: +38%</text><text x="750" y="360" class_="warn" text_anchor="middle">Emergency Clock Halving (1.2 GHz → 600 MHz)</text></svg>