<svg xmlns="http://www.w3.org/2000/svg" viewBox="18.3 3.9 913.8 388.2" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-27.4" y="-15.5" width="1005.2" height="427.0" fill="#ffffff"/>
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A"/>
    </marker>

    <!-- Stall hatch pattern -->
    <pattern id="stall-hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#FFFFFF"/>

  <!-- Sub-Figure Headers -->
  <text x="240" y="30" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(a) Memory Bus Contention</text>
  <text x="720" y="30" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(b) Power Rail Droop</text>

  <!-- Panel Divider -->
  <line x1="480" y1="20" x2="480" y2="380" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): MEMORY BUS CONTENTION                                     -->
  <!-- ==================================================================== -->
  <g id="panel-a">
    <!-- Proposal NPU -->
    <rect x="35" y="60" width="120" height="44" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="95" y="87" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">Proposal NPU</text>

    <!-- Real-Time MCU -->
    <rect x="35" y="130" width="120" height="44" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="95" y="157" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">Real-Time MCU</text>

    <!-- Request Arrows to Queue -->
    <line x1="155" y1="82" x2="205" y2="82" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>
    <line x1="155" y1="152" x2="205" y2="152" stroke="#16A34A" stroke-width="1.3" marker-end="url(#arr-green)"/>

    <!-- Shared DRAM Queue -->
    <rect x="210" y="52" width="235" height="130" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="327" y="73" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Assumed FIFO Queue</text>

    <!-- Queue Slots -->
    <rect x="225" y="83" width="205" height="22" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="327" y="98" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">64 tile transactions</text>

    <rect x="225" y="110" width="205" height="22" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="327" y="125" font-size="9" font-weight="600" fill="#1D4ED8" text-anchor="middle">24 camera/telemetry transactions</text>

    <rect x="225" y="146" width="205" height="22" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="327" y="161" font-size="9.5" font-weight="600" fill="#15803D" text-anchor="middle">16 safety-read transactions</text>

    <!-- Timing Waterfall Subplot -->
    <!-- Timeline Axis -->
    <line x1="95" y1="242" x2="435" y2="242" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>
    <text x="440" y="246" font-size="9" font-weight="600" fill="#64748B">Time</text>

    <!-- Deadline Line -->
    <line x1="325" y1="226" x2="325" y2="368" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="325" y="218" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">120 µs subdeadline</text>

    <!-- Nominal Row -->
    <text x="35" y="275" font-size="10.5" font-weight="600" fill="#334155">Nominal</text>
    <rect x="95" y="260" width="190" height="24" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="190" y="276" font-size="9.5" font-weight="600" fill="#15803D" text-anchor="middle">Read + compute</text>

    <!-- Contended Row -->
    <text x="35" y="333" font-size="10.5" font-weight="600" fill="#334155">Contended</text>

    <!-- Stall block -->
    <rect x="95" y="318" width="65" height="24" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
    <rect x="95" y="318" width="65" height="24" rx="4" fill="url(#stall-hatch)"/>
    <text x="127" y="334" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">28.244 µs</text>

    <!-- Shifted execution block -->
    <rect x="160" y="318" width="190" height="24" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="255" y="334" font-size="9.5" font-weight="600" fill="#991B1B" text-anchor="middle">Read + compute</text>

    <!-- Overrun indicator tag -->
    <rect x="360" y="318" width="68" height="24" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
    <text x="394" y="334" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">+8.364 µs</text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): POWER RAIL DROOP                                          -->
  <!-- ==================================================================== -->
  <g id="panel-b">
    <!-- Subplot b1: Current Surge -->
    <line x1="540" y1="145" x2="915" y2="145" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>
    <line x1="540" y1="145" x2="540" y2="60" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>
    <text x="540" y="52" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle">Current I</text>

    <!-- Current Step Trace -->
    <path d="M 540 130 L 625 130 L 635 78 L 900 78" fill="none" stroke="#DC2626" stroke-width="2"/>
    <text x="680" y="70" font-size="9.5" font-weight="700" fill="#DC2626">Surge ΔI</text>

    <!-- Subplot b2: Voltage Droop -->
    <line x1="540" y1="285" x2="915" y2="285" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>
    <line x1="540" y1="285" x2="540" y2="175" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>
    <text x="540" y="167" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle">Voltage V</text>

    <!-- VDD Reference -->
    <line x1="540" y1="195" x2="900" y2="195" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="532" y="198" font-size="9" font-weight="600" fill="#64748B" text-anchor="end">VDD</text>

    <!-- Vmin Threshold Reference -->
    <line x1="540" y1="235" x2="900" y2="235" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="532" y="238" font-size="9" font-weight="700" fill="#DC2626" text-anchor="end">Vmin?</text>

    <!-- Voltage Droop Waveform -->
    <path d="M 540 195 L 625 195 C 632 195, 634 265, 642 265 C 655 265, 665 210, 678 210 C 690 210, 700 220, 715 205 L 900 205"
          fill="none" stroke="#2563EB" stroke-width="2"/>

    <!-- Droop Callout Bracket and Text -->
    <line x1="642" y1="197" x2="642" y2="263" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="2,2"/>
    <rect x="580" y="270" width="70" height="20" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8"/>
    <text x="615" y="284" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">Droop ΔV</text>

    <!-- Summary Consequence Capsule -->
    <rect x="585" y="322" width="270" height="34" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="720" y="343" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle">Modeled Gate Delay Stretch</text>
  </g>
</svg>