<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <style>
            .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
            .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
            .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #334155; }
            .text-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
            .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #475569; }
            .small-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }
            .small-white { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
            .warn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #dc2626; }
            .box-queue { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 4; ry: 4; }
            .box-blue { fill: #1e40af; stroke: #1e40af; stroke-width: 1; rx: 3; ry: 3; }
            .box-red { fill: #b91c1c; stroke: #b91c1c; stroke-width: 1; rx: 3; ry: 3; }
            .box-light-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 4; ry: 4; }
            .box-light-red { fill: #fff1f2; stroke: #dc2626; stroke-width: 1.5; rx: 4; ry: 4; }
            .line { stroke: #334155; stroke-width: 1.5; fill: none; }
            .line-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
            .line-red { stroke: #dc2626; stroke-width: 2.2; fill: none; }
            .line-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
            <polygon points="0 0, 8 3.5, 0 7" fill="#334155" />
        </marker>
    </defs>

    <rect width="1000" height="450" fill="#ffffff" />

    <!-- (a) Left Panel -->
    <text x="25" y="32" class="title">(a) On-Chip Memory Bus &amp; Cache Contention</text>

    <!-- Proposal NPU -->
    <rect x="25" y="56" width="155" height="58" class="box-light-blue" />
    <text x="102" y="80" class="card-title" fill="#1e40af" text-anchor="middle">Proposal NPU</text>
    <text x="102" y="98" class="small" fill="#2563eb" text-anchor="middle">Streams 256 kB bursts</text>

    <!-- Real-Time MCU -->
    <rect x="25" y="142" width="155" height="58" class="box-light-red" />
    <text x="102" y="166" class="card-title" fill="#dc2626" text-anchor="middle">Real-Time MCU</text>
    <text x="102" y="184" class="small" fill="#dc2626" text-anchor="middle">Sensor read (5.0 µs)</text>

    <!-- Flow Arrows -->
    <line x1="180" y1="85" x2="225" y2="85" class="line" marker-end="url(#arrow)" />
    <line x1="180" y1="171" x2="225" y2="171" class="line" marker-end="url(#arrow)" />

    <!-- DRAM Queue -->
    <rect x="230" y="48" width="150" height="162" class="box-queue" />
    <text x="305" y="70" class="card-title" fill="#0f172a" text-anchor="middle">DRAM Queue</text>
    
    <rect x="240" y="82" width="130" height="24" class="box-blue" />
    <text x="305" y="98" class="small-white" text-anchor="middle">NPU Burst (256 kB)</text>
    
    <rect x="240" y="112" width="130" height="24" class="box-blue" />
    <text x="305" y="128" class="small-white" text-anchor="middle">NPU Burst (256 kB)</text>
    
    <rect x="240" y="168" width="130" height="24" class="box-red" />
    <text x="305" y="184" class="small-white" text-anchor="middle">MCU Read (64 kB)</text>

    <text x="390" y="196" class="warn">Wait: 27.6 µs</text>

    <!-- Timing Waterfall -->
    <text x="25" y="260" class="title">Timing Waterfall (1.0 ms control loop)</text>
    
    <!-- Timeline Axis -->
    <line x1="95" y1="285" x2="420" y2="285" class="line" />
    <line x1="95" y1="281" x2="95" y2="289" class="line" />
    <text x="95" y="278" class="small" text-anchor="middle">0</text>
    
    <line x1="315" y1="281" x2="315" y2="385" class="line-dashed" />
    <text x="315" y="278" class="small-bold" text-anchor="middle">120 µs Budget</text>

    <!-- Nominal Row -->
    <text x="25" y="316" class="text-bold">Nominal:</text>
    <rect x="95" y="302" width="200" height="22" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" />
    <text x="195" y="317" class="small" fill="#1e40af" text-anchor="middle">Execution (Includes 5.0 µs read)</text>

    <!-- Contended Row -->
    <text x="25" y="352" class="text-bold">Contended:</text>
    <!-- Stall box -->
    <rect x="95" y="338" width="46" height="22" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" />
    <text x="118" y="353" class="small" text-anchor="middle" font-size="10">Stall</text>
    <!-- Shifted execution box -->
    <rect x="141" y="338" width="200" height="22" rx="3" fill="#fff1f2" stroke="#dc2626" stroke-width="1.2" />
    <text x="241" y="353" class="small" fill="#991b1b" text-anchor="middle">Execution shifted</text>
    <!-- Overrun alert -->
    <text x="348" y="353" class="warn">+7.6 µs Overrun</text>

    <!-- Center Divider Line -->
    <line x1="495" y1="20" x2="495" y2="430" class="line-dashed" />

    <!-- (b) Right Panel -->
    <text x="520" y="32" class="title">(b) Power Distribution Network &amp; Voltage Droop</text>
    
    <!-- Current waveform -->
    <text x="520" y="75" class="text-bold">Current (A)</text>
    <path d="M 580 135 L 640 135 L 650 65 L 940 65" class="line-red" />
    <text x="690" y="85" class="warn">ΔI = 6.0 A, dI/dt = 3.0 A/ns</text>
    <text x="690" y="103" class="text">(NPU Array Activation)</text>

    <!-- Voltage waveform -->
    <text x="520" y="195" class="text-bold">Voltage (V)</text>
    <text x="530" y="172" class="small">0.85 V</text>
    <path d="M 580 170 L 640 170 L 655 245 L 680 180 L 710 190 L 740 175 L 940 175" class="line-blue" />
    
    <line x1="580" y1="235" x2="940" y2="235" class="line-dashed" />
    <text x="940" y="230" class="warn" text-anchor="end">Vmin = 0.78 V</text>
    <text x="670" y="278" class="warn" text-anchor="middle">ΔV = 138 mV Droop (16.2% collapse)</text>

    <!-- Card Callout -->
    <rect x="560" y="300" width="380" height="74" class="box-light-red" rx="4" />
    <text x="750" y="328" class="card-title" fill="#dc2626" text-anchor="middle">Gate Delay Stretch: +38%</text>
    <text x="750" y="352" class="text-bold" fill="#991b1b" text-anchor="middle">Emergency Clock Halving (1.2 GHz → 600 MHz)</text>
</svg>