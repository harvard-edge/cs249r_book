<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e74c3c" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: 800; fill: #1a202c; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 500; fill: #4a5568; }
    
    .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #e2e8f0; text-anchor: middle; }
    
    .path-line { fill: none; stroke: #2d3748; stroke-width: 4; marker-end: url(#arrow); }
    .path-line-feedback { fill: none; stroke: #e53e3e; stroke-width: 6; marker-end: url(#arrow-red); stroke-dasharray: 8,6; }
    
    .glass-text { font-family: monospace; font-size: 16px; fill: #718096; font-weight: bold; }
  </style>

  <rect width="100%" height="100%" fill="#f7fafc" />

  <!-- (A) Open-Loop Digital Computation -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" class="title">A) Open-Loop Digital Computation</text>
    <text x="0" y="30" class="subtitle">Exogenous data flows to prediction behind a glass barrier. Errors are idempotent.</text>
    
    <!-- Flat 2.5D Isometric Transform for Flow A -->
    <g transform="translate(300, -100)">
      <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, 150)">
        
        <!-- Exogenous Data -->
        <g transform="translate(0, 0)" filter="url(#shadow)">
          <rect x="0" y="0" width="180" height="120" rx="8" fill="#3182ce" />
          <text x="90" y="55" class="node-text">Exogenous Data</text>
          <text x="90" y="80" class="node-desc">Benchmark dataset</text>
        </g>
        
        <!-- Arrow -->
        <path d="M 180 60 L 280 60" class="path-line" />
        
        <!-- ML Model -->
        <g transform="translate(280, 0)" filter="url(#shadow)">
          <rect x="0" y="0" width="180" height="120" rx="8" fill="#805ad5" />
          <text x="90" y="55" class="node-text">ML Model</text>
          <text x="90" y="80" class="node-desc">Digital Inference</text>
        </g>
        
        <!-- Arrow -->
        <path d="M 460 60 L 560 60" class="path-line" />
        
        <!-- Glass Barrier -->
        <line x1="510" y1="-40" x2="510" y2="160" stroke="#a0aec0" stroke-width="4" stroke-dasharray="10,5" />
        <text x="510" y="-55" class="glass-text" text-anchor="middle" transform="rotate(-30, 510, -55)">GLASS BARRIER</text>
        
        <!-- Prediction -->
        <g transform="translate(560, 0)" filter="url(#shadow)">
          <rect x="0" y="0" width="180" height="120" rx="8" fill="#38a169" />
          <text x="90" y="55" class="node-text">Prediction</text>
          <text x="90" y="80" class="node-desc">No Physical Effect</text>
        </g>
        
      </g>
    </g>
  </g>

  <!-- (B) Closed Causal Loop of Physical AI -->
  <g transform="translate(60, 420)">
    <text x="0" y="0" class="title">B) Closed Causal Loop of Physical AI</text>
    <text x="0" y="30" class="subtitle">Endogenous feedback: Model actions change physical environment, directly altering next sensor input.</text>
    
    <!-- Isometric Transform for Flow B -->
    <g transform="translate(300, -80)">
      <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, 150)">
        
        <!-- Sensors -->
        <g transform="translate(0, 150)" filter="url(#shadow)">
          <rect x="0" y="0" width="160" height="120" rx="8" fill="#2b6cb0" />
          <text x="80" y="55" class="node-text">Sensors</text>
          <text x="80" y="80" class="node-desc">Endogenous Input</text>
        </g>
        
        <!-- Arrow to Deliberation -->
        <path d="M 160 210 L 240 210" class="path-line" />
        
        <!-- Neural Deliberation -->
        <g transform="translate(240, 150)" filter="url(#shadow)">
          <rect x="0" y="0" width="180" height="120" rx="8" fill="#6b46c1" />
          <text x="90" y="55" class="node-text">Neural Deliberation</text>
          <text x="90" y="80" class="node-desc">Action Proposal</text>
        </g>
        
        <!-- Arrow to Safety Gate -->
        <path d="M 420 210 L 480 210" class="path-line" />
        
        <!-- Safety Gate -->
        <g transform="translate(480, 150)" filter="url(#shadow)">
          <rect x="0" y="0" width="160" height="120" rx="8" fill="#dd6b20" />
          <text x="80" y="55" class="node-text">Safety Gate</text>
          <text x="80" y="80" class="node-desc">Deterministic Filter</text>
        </g>
        
        <!-- Arrow to Motors -->
        <path d="M 640 210 L 700 210" class="path-line" />
        
        <!-- Motors/Actuators -->
        <g transform="translate(700, 150)" filter="url(#shadow)">
          <rect x="0" y="0" width="160" height="120" rx="8" fill="#c53030" />
          <text x="80" y="55" class="node-text">Motors</text>
          <text x="80" y="80" class="node-desc">Hardware Actuation</text>
        </g>
        
        <!-- Arrow to Environment -->
        <path d="M 780 270 L 780 360" class="path-line" />
        
        <!-- Physical Environment -->
        <g transform="translate(350, 360)" filter="url(#shadow)">
          <rect x="0" y="0" width="510" height="100" rx="8" fill="#2f855a" />
          <text x="255" y="45" class="node-text">Physical Environment</text>
          <text x="255" y="70" class="node-desc">State altered by physical actuation</text>
        </g>
        
        <!-- Feedback Arrow from Environment to Sensors -->
        <path d="M 350 410 L 80 410 L 80 270" class="path-line-feedback" />
        
      </g>
    </g>
  </g>
</svg>