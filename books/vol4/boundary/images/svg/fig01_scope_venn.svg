<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Drop Shadow for Glassmorphism -->
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Gradients -->
    <!-- Neural Blue for Top Circle (Learned Statistical Model) -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8AFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1A56DB" stop-opacity="0.6" />
    </linearGradient>

    <!-- Physics Green for Bottom Left (Consequential Physical Feedback) -->
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.6" />
    </linearGradient>

    <!-- Authority Red for Bottom Right (Delegated Physical Authority) -->
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#F8FAFC" />

  <!-- Circles -->
  <g transform="translate(400, 420)" style="mix-blend-mode: multiply;">
    <!-- Top Circle -->
    <circle cx="0" cy="-120" r="220" fill="url(#grad-blue)" filter="url(#glass-shadow)" />
    <!-- Bottom Left Circle -->
    <circle cx="-130" cy="105" r="220" fill="url(#grad-green)" filter="url(#glass-shadow)" />
    <!-- Bottom Right Circle -->
    <circle cx="130" cy="105" r="220" fill="url(#grad-red)" filter="url(#glass-shadow)" />
  </g>

  <!-- Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-weight="600">
    
    <!-- Top Circle Label -->
    <text x="400" y="150" font-size="24" fill="#1E3A8A">Learned</text>
    <text x="400" y="180" font-size="24" fill="#1E3A8A">Statistical Model</text>

    <!-- Bottom Left Label -->
    <text x="170" y="580" font-size="24" fill="#064E3B">Consequential</text>
    <text x="170" y="610" font-size="24" fill="#064E3B">Physical Feedback</text>

    <!-- Bottom Right Label -->
    <text x="630" y="580" font-size="24" fill="#881337">Delegated</text>
    <text x="630" y="610" font-size="24" fill="#881337">Physical Authority</text>

    <!-- Intersections -->
    
    <!-- Top + Bottom Left -->
    <text x="250" y="310" font-size="18" fill="#FFFFFF">Advisory</text>
    <text x="250" y="335" font-size="18" fill="#FFFFFF">Decision Support</text>

    <!-- Top + Bottom Right -->
    <text x="550" y="310" font-size="18" fill="#FFFFFF">Digital</text>
    <text x="550" y="335" font-size="18" fill="#FFFFFF">Autonomous Systems</text>

    <!-- Bottom Left + Bottom Right -->
    <text x="400" y="570" font-size="18" fill="#FFFFFF">Classical</text>
    <text x="400" y="595" font-size="18" fill="#FFFFFF">Control Theory</text>

    <!-- Center -->
    <text x="400" y="425" font-size="32" fill="#FFFFFF" font-weight="800" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.4))">Physical AI</text>
  </g>
</svg>
