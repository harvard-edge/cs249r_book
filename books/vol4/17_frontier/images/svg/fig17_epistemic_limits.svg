<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .panel-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1e3a8a; }
      .axis-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #64748b; }
      .tick-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .state-label-safe { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1e40af; }
      .state-label-hazard { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #dc2626; }
      .telemetry-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .deadline-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .detect-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; }
      .mono-sub { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; }
      .alert-tag { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; fill: #dc2626; }
      .tbl-header { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .tbl-cell { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; }
      .tbl-cell-alert { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; fill: #dc2626; }
      .pill-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="38" class="title" text-anchor="middle">The Dual Epistemic Boundaries and Residual-Claims Register</text>

  <!-- ================= PANEL 1: Observational Indistinguishability ================= -->
  <g transform="translate(45, 65)">
    <rect width="435" height="235" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="217.5" y="28" class="panel-title" text-anchor="middle">1. Observational Indistinguishability</text>

    <!-- Timeline Axis -->
    <line x1="40" y1="95" x2="390" y2="95" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="390" y="85" class="axis-label" text-anchor="end">Time (t)</text>

    <!-- States Labels & Horizontal Curves -->
    <text x="35" y="132" class="state-label-safe">SA (Safe)</text>
    <text x="35" y="152" class="state-label-hazard">SB (Hazard)</text>

    <line x1="125" y1="128" x2="205" y2="128" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="125" y1="148" x2="205" y2="148" stroke="#dc2626" stroke-width="2.5"/>

    <!-- Identical Telemetry Callout Badge -->
    <rect x="90" y="165" width="115" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="147.5" y="180" class="telemetry-text" text-anchor="middle">yA(t) ≡ yB(t)</text>
    <text x="147.5" y="193" class="axis-label" font-size="9.5px" text-anchor="middle">(Identical Telemetry)</text>

    <!-- Action Deadline vs Detection -->
    <line x1="250" y1="75" x2="250" y2="170" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="245" y="66" class="deadline-label" text-anchor="end">Action Deadline</text>
    <text x="250" y="185" class="mono-sub" fill="#334155" text-anchor="middle">t_deadline</text>

    <line x1="330" y1="75" x2="330" y2="170" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="335" y="66" class="detect-label" text-anchor="start">Detection</text>
    <text x="330" y="185" class="mono-sub" fill="#dc2626" text-anchor="middle">t_detect</text>

    <!-- Highlight Region: Too Late -->
    <rect x="250" y="100" width="80" height="24" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="290" y="116" class="alert-tag" text-anchor="middle">Too Late</text>
  </g>

  <!-- ================= PANEL 2: Astronomical Exposure Wall ================= -->
  <g transform="translate(520, 65)">
    <rect width="435" height="235" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="217.5" y="28" class="panel-title" text-anchor="middle">2. Astronomical Exposure Wall</text>

    <!-- Axes -->
    <line x1="65" y1="185" x2="390" y2="185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="65" y1="185" x2="65" y2="60" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="227" y="215" class="axis-label" font-weight="600" text-anchor="middle">Target Failure Rate (p) [log scale]</text>
    <text x="-122" y="22" class="axis-label" font-weight="600" transform="rotate(-90)" text-anchor="middle">Required Hours (n)</text>

    <!-- Ticks -->
    <text x="340" y="200" class="tick-label" text-anchor="middle">10⁻³</text>
    <text x="110" y="200" class="tick-label" text-anchor="middle">10⁻⁹</text>

    <text x="55" y="165" class="tick-label" text-anchor="end">10³</text>
    <text x="55" y="85" class="tick-label" text-anchor="end">10⁹</text>

    <!-- Exponential Wall Curve -->
    <path d="M 340 165 C 260 165, 160 145, 110 80" fill="none" stroke="#2563eb" stroke-width="2.5"/>

    <!-- Highlight Wall Point -->
    <circle cx="110" cy="80" r="4" fill="#dc2626"/>
    <line x1="110" y1="80" x2="175" y2="80" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Wall Callout Badge -->
    <rect x="180" y="65" width="180" height="34" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
    <text x="270" y="79" class="alert-tag" text-anchor="middle">Wall: ~3.0 × 10⁹ h</text>
    <text x="270" y="93" class="axis-label" font-size="10px" text-anchor="middle">(342,000 machine-years)</text>
  </g>

  <!-- ================= PANEL 3: The Residual-Claims Register ================= -->
  <g transform="translate(45, 320)">
    <rect width="910" height="255" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="455" y="28" class="panel-title" text-anchor="middle">3. The Residual-Claims Register</text>

    <!-- Inner Table Card -->
    <g transform="translate(25, 45)">
      <rect width="860" height="190" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Table Header -->
      <rect width="860" height="36" rx="4" fill="#f1f5f9"/>
      <rect width="860" height="10" y="26" fill="#f1f5f9"/>
      <line x1="0" y1="36" x2="860" y2="36" stroke="#e2e8f0" stroke-width="1"/>

      <text x="110" y="23" class="tbl-header" text-anchor="middle">Missing Observable</text>
      <text x="320" y="23" class="tbl-header" text-anchor="middle">Detectorless Hazard</text>
      <text x="560" y="23" class="tbl-header" text-anchor="middle">Operational Containment</text>
      <text x="765" y="23" class="tbl-header" text-anchor="middle">Accountable Owner</text>

      <!-- Row 1 -->
      <text x="110" y="68" class="tbl-cell" text-anchor="middle">Friction coeff μ</text>
      <text x="320" y="68" class="tbl-cell-alert" text-anchor="middle">Kinematic brake distance &gt; buffer</text>
      <rect x="445" y="53" width="230" height="26" rx="3" fill="#1e3a8a"/>
      <text x="560" y="70" class="pill-text" text-anchor="middle">Velocity Clamp (v ≤ 0.9 m/s)</text>
      <text x="765" y="68" class="tbl-cell" text-anchor="middle">Drivetrain Lead</text>

      <line x1="0" y1="88" x2="860" y2="88" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Row 2 -->
      <text x="110" y="118" class="tbl-cell" text-anchor="middle">Ceramic void vol</text>
      <text x="320" y="118" class="tbl-cell-alert" text-anchor="middle">Brittle fracture &lt; 38 ms</text>
      <rect x="445" y="103" width="230" height="26" rx="3" fill="#1e3a8a"/>
      <text x="560" y="120" class="pill-text" text-anchor="middle">Mechanical Compliance Interface</text>
      <text x="765" y="118" class="tbl-cell" text-anchor="middle">Tooling Lead</text>

      <line x1="0" y1="138" x2="860" y2="138" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Row 3 -->
      <text x="110" y="168" class="tbl-cell" text-anchor="middle">Pressure drift</text>
      <text x="320" y="168" class="tbl-cell-alert" text-anchor="middle">Line overpressure rupture</text>
      <rect x="445" y="153" width="230" height="26" rx="3" fill="#1e3a8a"/>
      <text x="560" y="170" class="pill-text" text-anchor="middle">Hardware Burst-Disc (215 kPa)</text>
      <text x="765" y="168" class="tbl-cell" text-anchor="middle">Process Safety Lead</text>
    </g>
  </g>
</svg>
