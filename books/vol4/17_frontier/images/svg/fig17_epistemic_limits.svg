<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="sans-serif">
    <!-- Definitions -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D3748"/>
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F407A"/>
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#A51C30"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="1000" height="600" fill="#FFFFFF" />

    <!-- Title -->
    <text x="500" y="40" font-size="24" font-weight="bold" fill="#2D3748" text-anchor="middle">The Dual Epistemic Boundaries and Residual-Claims Register</text>

    <!-- Panel 1: Observational Indistinguishability -->
    <g transform="translate(50, 80)">
        <rect width="420" height="220" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="2"/>
        <text x="210" y="30" font-size="16" font-weight="bold" fill="#1F407A" text-anchor="middle">1. Observational Indistinguishability</text>
        
        <!-- Timeline -->
        <line x1="40" y1="90" x2="380" y2="90" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="380" y="80" font-size="12" fill="#2D3748" text-anchor="end">Time (t)</text>
        
        <!-- States -->
        <text x="40" y="130" font-size="14" font-weight="bold" fill="#1F407A">SA (Safe)</text>
        <text x="40" y="150" font-size="14" font-weight="bold" fill="#A51C30">SB (Hazard)</text>
        
        <path d="M 120 125 C 150 125, 170 125, 200 125" stroke="#1F407A" stroke-width="2" fill="none"/>
        <path d="M 120 145 C 150 145, 170 145, 200 145" stroke="#A51C30" stroke-width="2" fill="none"/>
        
        <!-- Identical Telemetry -->
        <rect x="110" y="115" width="80" height="40" fill="#E2E8F0" opacity="0.5"/>
        <text x="150" y="180" font-size="12" fill="#2D3748" text-anchor="middle">yA(t) ≡ yB(t)</text>
        <text x="150" y="195" font-size="12" fill="#2D3748" text-anchor="middle">(Identical Telemetry)</text>

        <!-- Deadline vs Detection -->
        <line x1="240" y1="70" x2="240" y2="160" stroke="#2D3748" stroke-width="2" stroke-dasharray="4,4"/>
        <text x="235" y="60" font-size="12" font-weight="bold" fill="#2D3748" text-anchor="end">Action Deadline</text>
        <text x="240" y="175" font-size="12" fill="#2D3748" text-anchor="middle">t_deadline</text>

        <line x1="310" y1="70" x2="310" y2="160" stroke="#A51C30" stroke-width="2" stroke-dasharray="4,4"/>
        <text x="315" y="60" font-size="12" font-weight="bold" fill="#A51C30" text-anchor="start">Detection</text>
        <text x="310" y="175" font-size="12" fill="#A51C30" text-anchor="middle">t_detect</text>

        <!-- Highlight region -->
        <rect x="240" y="95" width="70" height="20" fill="#A51C30" opacity="0.2"/>
        <text x="275" y="110" font-size="10" fill="#A51C30" text-anchor="middle">Too Late</text>
    </g>

    <!-- Panel 2: Astronomical Exposure Wall -->
    <g transform="translate(530, 80)">
        <rect width="420" height="220" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="2"/>
        <text x="210" y="30" font-size="16" font-weight="bold" fill="#1F407A" text-anchor="middle">2. Astronomical Exposure Wall</text>
        
        <!-- Axes -->
        <line x1="60" y1="180" x2="380" y2="180" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="60" y1="180" x2="60" y2="60" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow)"/>
        
        <text x="220" y="210" font-size="12" fill="#2D3748" text-anchor="middle">Target Failure Rate (p) [log scale]</text>
        <text x="20" y="120" font-size="12" fill="#2D3748" text-anchor="middle" transform="rotate(-90, 20, 120)">Required Hours (n)</text>
        
        <!-- Ticks -->
        <text x="330" y="195" font-size="10" fill="#2D3748" text-anchor="middle">10^-3</text>
        <text x="100" y="195" font-size="10" fill="#2D3748" text-anchor="middle">10^-9</text>
        
        <text x="50" y="160" font-size="10" fill="#2D3748" text-anchor="end">10^3</text>
        <text x="50" y="80" font-size="10" fill="#2D3748" text-anchor="end">10^9</text>
        
        <!-- Curve -->
        <path d="M 330 160 C 250 160, 150 140, 100 80" stroke="#1F407A" stroke-width="3" fill="none"/>
        
        <!-- Highlight point -->
        <circle cx="100" cy="80" r="4" fill="#A51C30"/>
        <line x1="100" y1="80" x2="180" y2="80" stroke="#A51C30" stroke-width="1" stroke-dasharray="2,2"/>
        <text x="185" y="84" font-size="12" font-weight="bold" fill="#A51C30">Wall: ~3.0 x 10^9 h</text>
        <text x="185" y="100" font-size="10" fill="#A51C30">(342,000 machine-years)</text>
    </g>

    <!-- Panel 3: Residual-Claims Register -->
    <g transform="translate(50, 320)">
        <rect width="900" height="240" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="2"/>
        <text x="450" y="30" font-size="16" font-weight="bold" fill="#1F407A" text-anchor="middle">3. The Residual-Claims Register</text>
        
        <rect x="50" y="60" width="800" height="140" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        
        <!-- Headers -->
        <rect x="50" y="60" width="800" height="30" fill="#E2E8F0"/>
        <text x="150" y="80" font-size="12" font-weight="bold" fill="#2D3748" text-anchor="middle">Missing Observable</text>
        <text x="350" y="80" font-size="12" font-weight="bold" fill="#2D3748" text-anchor="middle">Detectorless Hazard</text>
        <text x="580" y="80" font-size="12" font-weight="bold" fill="#2D3748" text-anchor="middle">Operational Containment</text>
        <text x="780" y="80" font-size="12" font-weight="bold" fill="#2D3748" text-anchor="middle">Accountable Owner</text>
        
        <!-- Row 1 -->
        <text x="150" y="115" font-size="12" fill="#2D3748" text-anchor="middle">Friction coeff μ</text>
        <text x="350" y="115" font-size="12" fill="#A51C30" text-anchor="middle">Kinematic brake distance > buffer</text>
        <rect x="470" y="100" width="220" height="22" fill="#1F407A"/>
        <text x="580" y="115" font-size="11" fill="#FFFFFF" text-anchor="middle">Velocity Clamp (v ≤ 0.9 m/s)</text>
        <text x="780" y="115" font-size="12" fill="#2D3748" text-anchor="middle">Drivetrain Lead</text>
        
        <line x1="50" y1="130" x2="850" y2="130" stroke="#E2E8F0" stroke-width="1"/>
        
        <!-- Row 2 -->
        <text x="150" y="150" font-size="12" fill="#2D3748" text-anchor="middle">Ceramic void vol</text>
        <text x="350" y="150" font-size="12" fill="#A51C30" text-anchor="middle">Brittle fracture &lt; 38 ms</text>
        <rect x="470" y="135" width="220" height="22" fill="#1F407A"/>
        <text x="580" y="150" font-size="11" fill="#FFFFFF" text-anchor="middle">Mechanical Compliance Interface</text>
        <text x="780" y="150" font-size="12" fill="#2D3748" text-anchor="middle">Tooling Lead</text>
        
        <line x1="50" y1="165" x2="850" y2="165" stroke="#E2E8F0" stroke-width="1"/>
        
        <!-- Row 3 -->
        <text x="150" y="185" font-size="12" fill="#2D3748" text-anchor="middle">Pressure drift</text>
        <text x="350" y="185" font-size="12" fill="#A51C30" text-anchor="middle">Line overpressure rupture</text>
        <rect x="470" y="170" width="220" height="22" fill="#1F407A"/>
        <text x="580" y="185" font-size="11" fill="#FFFFFF" text-anchor="middle">Hardware Burst-Disc (215 kPa)</text>
        <text x="780" y="185" font-size="12" fill="#2D3748" text-anchor="middle">Process Safety Lead</text>
        
    </g>
</svg>
