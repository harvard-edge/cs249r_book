<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="100%">
  <defs>
    <style>
      .panel-hdr { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; }
      .axis-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #64748B; }
      .tick-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #94A3B8; }
      .state-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .deadline-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .math-txt { font-family: 'Menlo', 'Courier New', monospace; font-size: 11px; font-weight: 600; }
      .box-hdr { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .box-math { font-family: 'Menlo', 'Courier New', monospace; font-size: 12px; font-weight: 600; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="960" height="410" fill="#FFFFFF"/>

  <!-- ==================== PANEL A: OBSERVATIONAL INDISTINGUISHABILITY ==================== -->
  <g transform="translate(40, 24)">
    <!-- Container Card -->
    <rect width="425" height="360" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="24" y="32" class="panel-hdr">a  Observational Boundary</text>

    <!-- Plot Area -->
    <!-- Time Axis -->
    <line x1="50" y1="185" x2="375" y2="185" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <text x="382" y="189" class="axis-lbl">t</text>

    <!-- State Trajectories -->
    <!-- Safe State SA (Blue) -->
    <text x="45" y="118" class="state-lbl" fill="#1D4ED8" text-anchor="end">S_safe</text>
    <line x1="55" y1="114" x2="190" y2="114" stroke="#2563EB" stroke-width="2"/>
    <line x1="190" y1="114" x2="355" y2="114" stroke="#2563EB" stroke-width="2"/>

    <!-- Hazard State SB (Red/Rose) -->
    <text x="45" y="146" class="state-lbl" fill="#DC2626" text-anchor="end">S_hazard</text>
    <line x1="55" y1="142" x2="190" y2="142" stroke="#DC2626" stroke-width="2"/>
    <!-- Divergence after deadline -->
    <path d="M 190 142 C 240 142, 265 170, 355 170" fill="none" stroke="#DC2626" stroke-width="2"/>

    <!-- Identical Telemetry Shaded Zone -->
    <rect x="70" y="94" width="120" height="68" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="130" y="132" class="math-txt" fill="#92400E" text-anchor="middle">y_A ≡ y_B</text>

    <!-- Deadlines -->
    <!-- Action Deadline t_deadline -->
    <line x1="190" y1="80" x2="190" y2="215" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="190" y="72" class="deadline-lbl" fill="#0F172A" text-anchor="middle">t_deadline</text>

    <!-- Detection t_detect -->
    <line x1="285" y1="80" x2="285" y2="215" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="285" y="72" class="deadline-lbl" fill="#DC2626" text-anchor="middle">t_detect</text>

    <!-- Unrecoverable Lag Interval -->
    <rect x="195" y="196" width="85" height="22" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="237.5" y="211" class="deadline-lbl" fill="#991B1B" text-anchor="middle">Unrecoverable</text>

    <!-- Resolution Capsule: Structural Containment -->
    <g transform="translate(24, 252)">
      <rect width="377" height="84" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
      <text x="188.5" y="34" class="box-hdr" fill="#166534" text-anchor="middle">Structural Containment</text>
      <text x="188.5" y="60" class="box-math" fill="#15803D" text-anchor="middle">v ≤ v_clamp</text>
    </g>
  </g>

  <!-- ==================== PANEL B: ASTRONOMICAL EXPOSURE WALL ==================== -->
  <g transform="translate(495, 24)">
    <!-- Container Card -->
    <rect width="425" height="360" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="24" y="32" class="panel-hdr">b  Exposure Wall</text>

    <!-- Plot Area -->
    <!-- Axes -->
    <line x1="60" y1="215" x2="375" y2="215" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <line x1="60" y1="215" x2="60" y2="70" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <text x="375" y="205" class="axis-lbl" text-anchor="end">Rate p</text>
    <text x="60" y="60" class="axis-lbl" text-anchor="start">Hours n</text>

    <!-- Ticks X -->
    <text x="110" y="230" class="tick-lbl" text-anchor="middle">10⁻⁹</text>
    <text x="220" y="230" class="tick-lbl" text-anchor="middle">10⁻⁶</text>
    <text x="330" y="230" class="tick-lbl" text-anchor="middle">10⁻³</text>

    <!-- Ticks Y -->
    <text x="50" y="200" class="tick-lbl" text-anchor="end">10³</text>
    <text x="50" y="145" class="tick-lbl" text-anchor="end">10⁶</text>
    <text x="50" y="90" class="tick-lbl" text-anchor="end">10⁹</text>

    <!-- Asymptotic Exposure Curve -->
    <path d="M 330 198 C 240 195, 150 170, 110 90" fill="none" stroke="#2563EB" stroke-width="2"/>
    <text x="240" y="150" class="math-txt" fill="#1D4ED8">n ≥ 3/p</text>

    <!-- Critical Wall Point at 10^-9 -->
    <line x1="60" y1="90" x2="110" y2="90" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="110" cy="90" r="4" fill="#DC2626"/>
    <text x="122" y="94" class="deadline-lbl" fill="#DC2626">10⁹ h</text>

    <!-- Resolution Capsule: Barrier Invariants -->
    <g transform="translate(24, 252)">
      <rect width="377" height="84" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
      <text x="188.5" y="34" class="box-hdr" fill="#166534" text-anchor="middle">Barrier Invariant</text>
      <text x="188.5" y="60" class="box-math" fill="#15803D" text-anchor="middle">h(x) ≥ 0</text>
    </g>
  </g>
</svg>
