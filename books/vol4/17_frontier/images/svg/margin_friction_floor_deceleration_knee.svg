<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 141" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="141" fill="#ffffff"/>
  <!-- floor-binds region: mu below 0.204 (x scale 443 px per unit mu, axis broken between 0.28 and 0.57) -->
  <rect x="6" y="4" width="90.4" height="114" fill="#f2d7d5" opacity="0.3"/>
  <!-- x axis with break marks -->
  <line x1="6" y1="118" x2="131" y2="118" stroke="#cccccc" stroke-width="1.4"/>
  <line x1="139" y1="118" x2="176" y2="118" stroke="#cccccc" stroke-width="1.4"/>
  <line x1="129" y1="123" x2="133" y2="113" stroke="#999999" stroke-width="1.2"/>
  <line x1="137" y1="123" x2="141" y2="113" stroke="#999999" stroke-width="1.2"/>
  <!-- knee at mu 0.204 -->
  <line x1="96.4" y1="118" x2="96.4" y2="36" stroke="#4a5568" stroke-width="1.3" stroke-dasharray="3,2"/>
  <!-- credible deceleration: min(2 m/s^2, mu g), y scale 42 px per m/s^2 -->
  <polyline points="6,118 96.4,34 131,34" fill="none" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
  <line x1="139" y1="34" x2="176" y2="34" stroke="#d97706" stroke-width="3"/>
  <line x1="129" y1="39" x2="133" y2="29" stroke="#999999" stroke-width="1.2"/>
  <line x1="137" y1="39" x2="141" y2="29" stroke="#999999" stroke-width="1.2"/>
  <!-- marks -->
  <circle cx="153.3" cy="34" r="4.5" fill="#d97706"/>
  <circle cx="28.2" cy="97.4" r="4.5" fill="#cb202d"/>
  <!-- labels -->
  <text x="9" y="17" font-size="12" fill="#cb202d">floor binds</text>
  <text x="101" y="17" font-size="12" fill="#333333">brake binds</text>
  <text x="101" y="51" font-size="12" fill="#333333">2 m/s²</text>
  <text x="176" y="65" font-size="12" fill="#333333" text-anchor="end">dry μ 0.60</text>
  <text x="35" y="99" font-size="12" fill="#cb202d">film</text>
  <text x="31" y="113" font-size="12" fill="#cb202d">0.49 m/s²</text>
  <text x="96.4" y="135" font-size="12" fill="#4a5568" text-anchor="middle">μ 0.204</text>
</svg>
