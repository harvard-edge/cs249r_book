<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; }
      .lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .math { font-family: 'Menlo', 'Courier New', monospace; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .conn-lbl { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
      .tag { font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 700; text-anchor: middle; letter-spacing: 0.05em; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#166534"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="410" fill="#FFFFFF"/>

  <!-- ==================== CAUSAL BOUNDARY ==================== -->
  <line x1="322.5" y1="36" x2="322.5" y2="315" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="322.5" y="26" class="tag" fill="#DC2626">CAUSAL BOUNDARY</text>

  <!-- ==================== PILLAR 1: BRAIN (POLICY) ==================== -->
  <g transform="translate(40, 45)">
    <!-- Container Capsule -->
    <rect width="240" height="260" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="120" y="28" class="hdr" fill="#1E40AF" text-anchor="middle">Brain (Policy)</text>

    <!-- Top Node: Planning -->
    <g transform="translate(20, 44)">
      <rect width="200" height="66" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="100" y="28" class="lbl" fill="#1E40AF">Planning</text>
      <text x="100" y="48" class="math" fill="#1D4ED8">π(a|z) → û</text>
    </g>

    <!-- Upward Internal Arrow: Perception -> Planning -->
    <line x1="120" y1="158" x2="120" y2="118" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- Bottom Node: Perception -->
    <g transform="translate(20, 166)">
      <rect width="200" height="66" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="100" y="28" class="lbl" fill="#1E40AF">Perception</text>
      <text x="100" y="48" class="math" fill="#1D4ED8">z = Φ(x)</text>
    </g>
  </g>

  <!-- Proposal Connector: Brain -> Nervous System -->
  <line x1="280" y1="122" x2="357" y2="122" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="290" y="99" width="65" height="18" rx="3" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="322.5" y="112" class="conn-lbl" fill="#1D4ED8">Proposal û</text>

  <!-- ==================== PILLAR 2: NERVOUS SYSTEM ==================== -->
  <g transform="translate(365, 45)">
    <!-- Container Capsule -->
    <rect width="240" height="260" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="120" y="28" class="hdr" fill="#166534" text-anchor="middle">Nervous System</text>

    <!-- Top Node: Barrier Shield -->
    <g transform="translate(20, 44)">
      <rect width="200" height="66" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
      <text x="100" y="28" class="lbl" fill="#166534">Barrier Shield</text>
      <text x="100" y="48" class="math" fill="#15803D">h(x) ≥ 0</text>
    </g>

    <!-- Internal Connector: Reflex -> Barrier -->
    <line x1="120" y1="158" x2="120" y2="118" stroke="#166534" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- Bottom Node: Reflexes -->
    <g transform="translate(20, 166)">
      <rect width="200" height="66" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
      <text x="100" y="28" class="lbl" fill="#166534">Reflexes</text>
      <text x="100" y="48" class="math" fill="#15803D">u_cmd</text>
    </g>
  </g>

  <!-- Command Connector: Nervous System -> Body -->
  <line x1="605" y1="122" x2="682" y2="122" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <rect x="617" y="99" width="61" height="18" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="647.5" y="112" class="conn-lbl" fill="#0F172A">Command u</text>

  <!-- ==================== PILLAR 3: BODY (PLANT) ==================== -->
  <g transform="translate(690, 45)">
    <!-- Container Capsule -->
    <rect width="230" height="260" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="115" y="28" class="hdr" fill="#991B1B" text-anchor="middle">Body (Plant)</text>

    <!-- Top Node: Actuation -->
    <g transform="translate(15, 44)">
      <rect width="200" height="66" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text x="100" y="28" class="lbl" fill="#991B1B">Actuation</text>
      <text x="100" y="48" class="math" fill="#DC2626">F ≤ μN</text>
    </g>

    <!-- Downward Internal Arrow: Actuation -> Transduction -->
    <line x1="115" y1="118" x2="115" y2="158" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arr-rose)"/>

    <!-- Bottom Node: Transduction -->
    <g transform="translate(15, 166)">
      <rect width="200" height="66" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text x="100" y="28" class="lbl" fill="#991B1B">Transduction</text>
      <text x="100" y="48" class="math" fill="#DC2626">y(t)</text>
    </g>
  </g>

  <!-- ==================== SENSOR FEEDBACK BUS ==================== -->
  <!-- Output from Body Transduction -->
  <path d="M 805 305 L 805 360 L 160 360 L 160 313" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <!-- Branch to Nervous System Reflexes -->
  <line x1="485" y1="360" x2="485" y2="313" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- Feedback Bus Label Badge -->
  <rect x="272" y="349" width="101" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="322.5" y="364" class="conn-lbl" fill="#475569">Sensor DMA</text>
</svg>
