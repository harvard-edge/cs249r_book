<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <style>
      .col-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .node-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .node-sub-alert { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; }
      .conn-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #1e40af; }
      .boundary-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #dc2626; }
      .red-bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; }
      .mono-text { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="540" fill="#ffffff"/>
  <g transform="translate(0, -45)">

  <!-- Causal Boundary (segmented with clean 2-line badge in 100px gap) -->
  <line x1="330" y1="85" x2="330" y2="205" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="330" y1="265" x2="330" y2="335" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="330" y1="380" x2="330" y2="505" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <rect x="296" y="340" width="68" height="34" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="330" y="354" class="boundary-text" text-anchor="middle">Causal</text>
  <text x="330" y="367" class="boundary-text" text-anchor="middle">Boundary</text>

  <!-- Proposal Arrow: Brain to Nervous System -->
  <line x1="280" y1="235" x2="373" y2="235" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="298" y="210" width="64" height="20" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="330" y="224" class="conn-text" text-anchor="middle">Proposal</text>
  <text x="330" y="250" class="mono-text" text-anchor="middle">û</text>

  <!-- Command Arrow: Nervous System to Body -->
  <line x1="620" y1="365" x2="713" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="638" y="340" width="64" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="354" class="conn-text" fill="#0f172a" text-anchor="middle">Command</text>

  <!-- Sensor Feedback Loop (Bottom) -->
  <path d="M 840 505 L 840 545 L 160 545 L 160 512" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="500" y1="545" x2="500" y2="512" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="570" y="534" width="200" height="22" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="670" y="549" class="red-bold" text-anchor="middle">Sensor DMA Ring Buffers (y(t))</text>

  <!-- ================= PILLAR 1: BRAIN (Policy) ================= -->
  <g transform="translate(40, 85)">
    <rect width="240" height="420" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="240" height="34" rx="4" fill="#1e3a8a"/>
    <rect width="240" height="8" y="26" fill="#1e3a8a"/>
    <text x="120" y="22" class="col-title" text-anchor="middle">BRAIN (Policy)</text>

    <!-- Node 1: Learned Perception -->
    <g transform="translate(15, 55)">
      <rect width="210" height="65" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <text x="105" y="26" class="node-title" fill="#1e40af" text-anchor="middle">Learned Perception</text>
      <text x="105" y="47" class="mono-text" text-anchor="middle">z = Φ(x)</text>
    </g>

    <!-- Internal Connector -->
    <line x1="120" y1="120" x2="120" y2="153" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

    <!-- Node 2: Action Planning -->
    <g transform="translate(15, 155)">
      <rect width="210" height="65" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <text x="105" y="26" class="node-title" fill="#1e40af" text-anchor="middle">Action Planning</text>
      <text x="105" y="47" class="mono-text" text-anchor="middle">π(a|z) → û</text>
    </g>
  </g>

  <!-- ================= PILLAR 2: NERVOUS SYSTEM ================= -->
  <g transform="translate(380, 85)">
    <rect width="240" height="420" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="34" rx="4" fill="#0f172a"/>
    <rect width="240" height="8" y="26" fill="#0f172a"/>
    <text x="120" y="22" class="col-title" text-anchor="middle">NERVOUS SYSTEM</text>

    <!-- Node 1: Barrier Constraints -->
    <g transform="translate(15, 60)">
      <rect width="210" height="110" rx="3" fill="#ffffff" stroke="#64748b" stroke-dasharray="4,3" stroke-width="1.5"/>
      <text x="105" y="24" class="node-title" fill="#0f172a" text-anchor="middle">Barrier Constraints</text>
      <text x="105" y="46" class="node-sub-alert" text-anchor="middle">h(x) ≥ 0</text>
      <text x="105" y="68" class="node-sub" text-anchor="middle">d_stop(v) ≤ d_gap</text>
      <text x="105" y="90" class="node-sub" text-anchor="middle">1000 Hz Projection</text>
    </g>

    <!-- Internal Connector -->
    <line x1="120" y1="170" x2="120" y2="208" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Node 2: Current & Reflexes -->
    <g transform="translate(15, 210)">
      <rect width="210" height="65" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="105" y="26" class="node-title" fill="#0f172a" text-anchor="middle">Current &amp; Reflexes</text>
      <text x="105" y="47" class="mono-text" text-anchor="middle">u_cmd</text>
    </g>
  </g>

  <!-- ================= PILLAR 3: BODY (Plant) ================= -->
  <g transform="translate(720, 85)">
    <rect width="240" height="420" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="240" height="34" rx="4" fill="#991b1b"/>
    <rect width="240" height="8" y="26" fill="#991b1b"/>
    <text x="120" y="22" class="col-title" text-anchor="middle">BODY (Plant)</text>

    <!-- Node 1: Actuators -->
    <g transform="translate(15, 50)">
      <rect width="210" height="62" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="105" y="24" class="node-title" fill="#991b1b" text-anchor="middle">Actuators</text>
      <text x="105" y="44" class="node-sub" text-anchor="middle">Joule Heating</text>
    </g>

    <!-- Internal Connector 1 -> 2 -->
    <line x1="120" y1="112" x2="120" y2="138" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <!-- Node 2: Dynamics & Contact -->
    <g transform="translate(15, 140)">
      <rect width="210" height="62" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="105" y="24" class="node-title" fill="#991b1b" text-anchor="middle">Dynamics &amp; Contact</text>
      <text x="105" y="44" class="node-sub" text-anchor="middle">F ≤ μN (Friction)</text>
    </g>

    <!-- Internal Connector 2 -> 3 -->
    <line x1="120" y1="202" x2="120" y2="228" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <!-- Node 3: Transduction -->
    <g transform="translate(15, 230)">
      <rect width="210" height="62" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="105" y="24" class="node-title" fill="#991b1b" text-anchor="middle">Transduction</text>
      <text x="105" y="44" class="node-sub" text-anchor="middle">Sensors → y(t)</text>
    </g>
  </g>
  </g>
</svg>
