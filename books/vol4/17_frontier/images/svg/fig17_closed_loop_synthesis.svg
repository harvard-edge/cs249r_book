<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .hdr { font-size: 13.5px; font-weight: 700; }
      .rate-tag { font-size: 9.5px; font-weight: 600; }
      .lbl { font-size: 11px; font-weight: 600; text-anchor: middle; }
      .sublbl { font-size: 9.5px; font-weight: 500; text-anchor: middle; fill: #64748B; }
      .math { font-family: 'Menlo', 'Courier New', monospace; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .conn-lbl { font-size: 10px; font-weight: 600; text-anchor: middle; }
      .tag { font-size: 8.5px; font-weight: 700; text-anchor: middle; letter-spacing: 0.04em; }
      .step-num { font-size: 11px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#166534"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="450" fill="#FFFFFF"/>

  <!-- ==================== SUPERVISORY GOVERNANCE LAYER (PART IV) ==================== -->
  <rect x="40" y="10" width="880" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="56" y="31" font-size="11" font-weight="700" fill="#334155">Part IV Governance Shell</text>
  <rect x="220" y="17" width="200" height="20" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="320" y="31" font-size="9.5" font-weight="600" fill="#92400E" text-anchor="middle">Supervisory State Machine (Ch 14)</text>
  
  <rect x="435" y="17" width="190" height="20" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="530" y="31" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">HIL Stress Qualification (Ch 15)</text>

  <rect x="640" y="17" width="180" height="20" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="730" y="31" font-size="9.5" font-weight="600" fill="#166534" text-anchor="middle">CAE Release Verdict (Ch 16)</text>

  <!-- Galvanic Interlock Line to Causal Boundary -->
  <line x1="330" y1="37" x2="330" y2="52" stroke="#DC2626" stroke-width="1.5"/>

  <!-- ==================== CAUSAL BOUNDARY ==================== -->
  <line x1="330" y1="52" x2="330" y2="350" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="281" y="56" width="98" height="20" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="330" y="70" class="tag" fill="#DC2626">CAUSAL BOUNDARY</text>

  <!-- ==================== PILLAR 1: BRAIN (POLICY) ==================== -->
  <g transform="translate(40, 60)">
    <!-- Container Capsule -->
    <rect width="230" height="280" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="115" y="24" class="hdr" fill="#1E40AF" text-anchor="middle">Brain (Policy)</text>
    <text x="115" y="38" class="rate-tag" fill="#3B82F6" text-anchor="middle">1–20 Hz · MPU / Edge GPU</text>

    <!-- Top Node: Planning (Step 4) -->
    <g transform="translate(15, 52)">
      <rect width="200" height="88" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
      <!-- Step Badge ④ -->
      <circle cx="16" cy="18" r="10" fill="#2563EB"/>
      <text x="16" y="22" class="step-num">4</text>
      <text x="110" y="22" class="lbl" fill="#1E40AF">VLA Intent &amp; Planning</text>
      <text x="110" y="42" class="math" fill="#1D4ED8">π(a | z) → û_proposal</text>
      <text x="110" y="62" class="sublbl">Continuous chunking / Diffusion</text>
      <text x="110" y="76" class="sublbl">Non-deterministic inference</text>
    </g>

    <!-- Upward Internal Arrow: Perception -> Planning -->
    <line x1="115" y1="182" x2="115" y2="146" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arr-blue)"/>

    <!-- Bottom Node: Perception -->
    <g transform="translate(15, 182)">
      <rect width="200" height="82" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="100" y="24" class="lbl" fill="#1E40AF">Perception &amp; Belief</text>
      <text x="100" y="44" class="math" fill="#1D4ED8">z = Φ(x) ∈ SE(3)</text>
      <text x="100" y="64" class="sublbl">TSDF Voxel / Scene Graph / BEV</text>
    </g>
  </g>

  <!-- Proposal Connector: Brain -> Nervous System -->
  <line x1="270" y1="145" x2="390" y2="145" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="296" y="122" width="68" height="18" rx="3" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="330" y="135" class="conn-lbl" fill="#1D4ED8">Proposal û</text>

  <!-- ==================== PILLAR 2: NERVOUS SYSTEM ==================== -->
  <g transform="translate(390, 60)">
    <!-- Container Capsule -->
    <rect width="230" height="280" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="115" y="24" class="hdr" fill="#166534" text-anchor="middle">Nervous System</text>
    <text x="115" y="38" class="rate-tag" fill="#10B981" text-anchor="middle">1000 Hz · Lockstep MCU (ASIL D)</text>

    <!-- Top Node: Barrier Shield (Step 5) -->
    <g transform="translate(15, 52)">
      <rect width="200" height="88" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
      <!-- Step Badge ⑤ -->
      <circle cx="16" cy="18" r="10" fill="#059669"/>
      <text x="16" y="22" class="step-num">5</text>
      <text x="110" y="22" class="lbl" fill="#166534">CBF Safety Shield</text>
      <text x="110" y="42" class="math" fill="#15803D">min ||u - û||² s.t. h(x) ≥ 0</text>
      <text x="110" y="62" class="sublbl">Sub-millisecond QP Projection</text>
      <text x="110" y="76" class="sublbl">Asymmetric Hardware Veto</text>
    </g>

    <!-- Upward Internal Arrow: Reflexes -> Shield -->
    <line x1="115" y1="182" x2="115" y2="146" stroke="#166534" stroke-width="1.3" marker-end="url(#arr-green)"/>

    <!-- Bottom Node: Reflexes (Step 3) -->
    <g transform="translate(15, 182)">
      <rect width="200" height="82" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
      <!-- Step Badge ③ -->
      <circle cx="16" cy="18" r="10" fill="#166534"/>
      <text x="16" y="22" class="step-num">3</text>
      <text x="110" y="24" class="lbl" fill="#166534">Deterministic Reflexes</text>
      <text x="110" y="44" class="math" fill="#15803D">u_cmd (1000 Hz)</text>
      <text x="110" y="64" class="sublbl">Stopping Envelopes &amp; Safe Fallback</text>
    </g>
  </g>

  <!-- Command Connector: Nervous System -> Body -->
  <line x1="620" y1="145" x2="694" y2="145" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <rect x="626" y="122" width="62" height="18" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="657" y="135" class="conn-lbl" fill="#0F172A">Command u</text>

  <!-- ==================== PILLAR 3: BODY (PLANT) ==================== -->
  <g transform="translate(694, 60)">
    <!-- Container Capsule -->
    <rect width="226" height="280" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="113" y="24" class="hdr" fill="#991B1B" text-anchor="middle">Body (Plant)</text>
    <text x="113" y="38" class="rate-tag" fill="#EF4444" text-anchor="middle">Newtonian Continuous Dynamics</text>

    <!-- Top Node: Actuation (Step 6) -->
    <g transform="translate(14, 52)">
      <rect width="198" height="88" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <!-- Step Badge ⑥ -->
      <circle cx="16" cy="18" r="10" fill="#DC2626"/>
      <text x="16" y="22" class="step-num">6</text>
      <text x="108" y="22" class="lbl" fill="#991B1B">Actuation &amp; Power</text>
      <text x="108" y="42" class="math" fill="#DC2626">T ≤ T_stall, F ≤ μN</text>
      <text x="108" y="62" class="sublbl">PWM Inverter / Winding I²R</text>
      <text x="108" y="76" class="sublbl">Irreversible Energy Dissipation</text>
    </g>

    <!-- Downward Internal Arrow: Actuation -> Transduction -->
    <line x1="113" y1="146" x2="113" y2="182" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-rose)"/>

    <!-- Bottom Node: Transduction (Step 1) -->
    <g transform="translate(14, 182)">
      <rect width="198" height="82" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <!-- Step Badge ① -->
      <circle cx="16" cy="18" r="10" fill="#991B1B"/>
      <text x="16" y="22" class="step-num">1</text>
      <text x="108" y="24" class="lbl" fill="#991B1B">Physical Transduction</text>
      <text x="108" y="44" class="math" fill="#DC2626">y(t) = h_sensor(x, w)</text>
      <text x="108" y="64" class="sublbl">Photons, Encoders, IMU, Force</text>
    </g>
  </g>

  <!-- ==================== SENSOR FEEDBACK BUS (STEP 2) ==================== -->
  <!-- Output from Body Transduction -->
  <path d="M 807 340 L 807 395 L 155 395 L 155 348" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Branch to Nervous System Reflexes -->
  <line x1="505" y1="395" x2="505" y2="348" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Step Badge ② on Feedback Bus -->
  <circle cx="430" cy="395" r="10" fill="#475569"/>
  <text x="430" y="399" class="step-num">2</text>

  <!-- Feedback Bus Label Badge -->
  <rect x="250" y="384" width="165" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="332" y="399" class="conn-lbl" fill="#334155">CSI-2 / PCIe DMA Ingress Bus</text>

  <!-- Epistemic Frontier Callout Banner -->
  <rect x="580" y="384" width="210" height="22" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="685" y="399" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle">Epistemic Limit: y_A ≡ y_B (Ch 17)</text>

  <!-- Flow Legend -->
  <text x="40" y="435" font-size="9.5" font-weight="600" fill="#64748B">Closed Causal Flow: ① Sensor Transduction → ② DMA Ring Buffer Ingress → ③ 1000 Hz Reflex Loop → ④ Deliberative VLA Planning → ⑤ CBF-QP Shield → ⑥ Physical Actuation</text>
</svg>
