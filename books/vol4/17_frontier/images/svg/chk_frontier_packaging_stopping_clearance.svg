<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <marker id="arr-sub2" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================== TOP SUB-CARD: INFORMATION AGE BUDGET ==================== -->
  <rect x="14" y="10" width="512" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="24" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#1e293b">SENSORIMOTOR INFORMATION AGE PIPELINE (τ_info = 64.0 ms)</text>

  <!-- Stage 1: Optical Exposure -->
  <rect x="24" y="25" width="98" height="18" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="73" y="33.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Exposure &amp; Shutter</text>
  <text x="73" y="40.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="5.5" fill="#1e3a8a" text-anchor="middle">t_exp = 16.0 ms</text>

  <!-- Arrow 1 -->
  <line x1="122" y1="34" x2="128" y2="34" stroke="#64748b" stroke-width="1" marker-end="url(#arr-sub2)"/>

  <!-- Stage 2: NPU Inference -->
  <rect x="130" y="25" width="112" height="18" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
  <text x="186" y="33.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#78350f" text-anchor="middle">DMA &amp; NPU Inference</text>
  <text x="186" y="40.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="5.5" fill="#78350f" text-anchor="middle">t_inf = 36.0 ms</text>

  <!-- Arrow 2 -->
  <line x1="242" y1="34" x2="248" y2="34" stroke="#64748b" stroke-width="1" marker-end="url(#arr-sub2)"/>

  <!-- Stage 3: CAN-FD Bus -->
  <rect x="250" y="25" width="96" height="18" rx="2" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75"/>
  <text x="298" y="33.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#581c87" text-anchor="middle">CAN-FD Safety Bus</text>
  <text x="298" y="40.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="5.5" fill="#581c87" text-anchor="middle">t_bus = 2.0 ms</text>

  <!-- Arrow 3 -->
  <line x1="346" y1="34" x2="352" y2="34" stroke="#64748b" stroke-width="1" marker-end="url(#arr-sub2)"/>

  <!-- Stage 4: Solenoid Rise -->
  <rect x="354" y="25" width="98" height="18" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="403" y="33.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#334155" text-anchor="middle">Solenoid Flux Rise</text>
  <text x="403" y="40.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="5.5" fill="#64748b" text-anchor="middle">t_sol = 10.0 ms</text>

  <!-- Total Sum Badge -->
  <rect x="460" y="25" width="60" height="18" rx="2" fill="#1e293b"/>
  <text x="490" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6" font-weight="bold" fill="#94a3b8" text-anchor="middle">TOTAL LAG</text>
  <text x="490" y="40.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">τ = 64.0 ms</text>


  <!-- ==================== BOTTOM SUB-CARD: CLEARANCE BUDGET COMPARISON ==================== -->
  <rect x="14" y="54" width="512" height="118" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

  <!-- Section Header -->
  <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#1e293b">KINEMATIC CLEARANCE BUDGET: d_stop = v·τ_info + v²/(2·a_brake) vs. GATE STOP (60 mm)</text>

  <!-- Rigid Gate Barrier Vertical Marker across both lanes -->
  <!-- 0 mm at x=82, 60 mm at x=211.0 -->
  <line x1="211" y1="70" x2="211" y2="146" stroke="#c44" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="176" y="68" width="70" height="11" rx="2" fill="#c44"/>
  <text x="211" y="76.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.2" font-weight="bold" fill="#ffffff" text-anchor="middle">GATE: d_clear = 60 mm</text>


  <!-- LANE 1: Nominal Speed v = 1.50 m/s -->
  <text x="22" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#7f1d1d">v = 1.50 m/s</text>
  <text x="22" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.2" fill="#64748b">Ek = 13.5 J</text>

  <!-- Unbraked Lag Travel Bar: 0 to 96 mm (x: 82 to 288.4, width 206.4) -->
  <rect x="82" y="81" width="206.4" height="17" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="135" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.8" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Unbraked Drift: d_lag = 96.0 mm</text>

  <!-- Impact Callout Badge inside bar at 60 mm -->
  <rect x="187" y="82.5" width="48" height="14" rx="2" fill="#7f1d1d"/>
  <text x="211" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="5.8" font-weight="bold" fill="#ffffff" text-anchor="middle">💥 CRASH 40ms</text>

  <!-- Braking zone after crash (never reached!) -->
  <rect x="288.4" y="81" width="161.2" height="17" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,2"/>
  <text x="369" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.2" fill="#64748b" text-anchor="middle">Braking: d_brake = 75 mm (Total 171 mm)</text>

  <!-- Deficit badge -->
  <rect x="454" y="81" width="66" height="17" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="487" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.2" font-weight="bold" fill="#7f1d1d" text-anchor="middle">+111 mm DEFICIT</text>


  <!-- LANE 2: Firmware Clamped Velocity v = 0.50 m/s -->
  <text x="22" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#14532d">v ≤ 0.50 m/s</text>
  <text x="22" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.2" fill="#14532d">Ek = 1.5 J (-89%)</text>

  <!-- Bar 1: Unbraked Lag Travel: 0 to 32 mm (x: 82 to 150.8, width 68.8) -->
  <rect x="82" y="112" width="68.8" height="17" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="116.4" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Lag: 32 mm</text>

  <!-- Bar 2: Mechanical Braking: 32 to 40.3 mm (x: 150.8 to 168.6, width 17.8) -->
  <rect x="150.8" y="112" width="17.8" height="17" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="159.7" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="5.8" font-weight="bold" fill="#14532d" text-anchor="middle">8.3</text>

  <!-- Stopping distance indicator -->
  <line x1="168.6" y1="108" x2="168.6" y2="133" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="168.6" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.2" font-weight="bold" fill="#14532d" text-anchor="middle">Stop: 40.3 mm</text>

  <!-- Clearance Margin Bracket: 40.3 to 60 mm (x: 168.6 to 211.0, width 42.4) -->
  <rect x="168.6" y="112" width="42.4" height="17" fill="#ecfdf5" stroke="#3d9e5a" stroke-width="0.75" stroke-dasharray="2,2"/>
  <text x="189.8" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.2" font-weight="bold" fill="#14532d" text-anchor="middle">+19.7 mm</text>

  <!-- Safe status badge -->
  <rect x="420" y="112" width="100" height="17" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="470" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.2" font-weight="bold" fill="#14532d" text-anchor="middle">MODELED: +19.7 mm</text>

  <!-- Bottom Synthesis Banner -->
  <rect x="22" y="150" width="496" height="15" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>
  <text x="270" y="160.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" fill="#334155" text-anchor="middle">Firmware kinetic derating: 3× speed reduction linearly contracts lag 3× and quadratically compresses braking 9×.</text>

</svg>