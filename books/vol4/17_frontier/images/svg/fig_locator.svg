    <rect x="230" y="225" width="540" height="20" fill="#FFFFFF" rx="10" stroke="#CBD5E0"/>
    <text x="500" y="239" class="bound-text">PROPOSAL–PERMISSION PRIVILEGE BOUNDARY (Shared SRAM Mailbox · Untrusted u_hat → Verified u*)</text>
  </g>

