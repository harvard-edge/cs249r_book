    <text x="470" y="190" class="box-title" fill="#1F407A">3. Memory (Ch 09)</text><text x="470" y="203" class="box-sub">z_t → b_t · SE(3) Belief</text></g>
    <path d="M 550 192 L 556 192" class="arrow" stroke="#1F407A"/>
    
