    <path d="M 720 192 L 726 192" class="arrow" stroke="#1F407A"/>
    
    <g opacity="0.3"><rect x="730" y="175" width="160" height="35" class="box " stroke="#1F407A"/>
    <text x="810" y="190" class="box-title" fill="#1F407A">5. Planner (Ch 11)</text><text x="810" y="203" class="box-sub">L_t → u_hat · ACT/Chunk</text></g>
  </g>

