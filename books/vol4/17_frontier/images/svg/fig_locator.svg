    <text x="300" y="190" class="box-title" fill="#1F407A">2. Perception (Ch 08)</text><text x="300" y="203" class="box-sub">o_t → z_t · ViT Encoders</text></g>
    <path d="M 380 192 L 386 192" class="arrow" stroke="#1F407A"/>
    
