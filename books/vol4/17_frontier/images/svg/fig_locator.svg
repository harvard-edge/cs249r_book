<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 16px; font-weight: bold; fill: #1F407A; }
      .badge-bg { fill: #1F407A; opacity: 0.1; }
      .badge-text { font-size: 11px; font-weight: bold; fill: #1F407A; letter-spacing: 1px; }
      .layer-title { font-size: 13px; font-weight: bold; }
      .layer-sub { font-size: 11px; fill: #718096; }
      .box { fill: #FFFFFF; stroke-width: 1.5; rx: 4; }
      .box-active { stroke-width: 3; }
      .box-title { font-size: 12px; font-weight: bold; text-anchor: middle; }
      .box-sub { font-size: 9px; text-anchor: middle; fill: #4A5568; }
      .arrow { stroke-width: 1.5; fill: none; }
      .bound-line { stroke: #718096; stroke-width: 2; stroke-dasharray: 6,4; }
      .bound-text { font-size: 11px; font-weight: bold; fill: #718096; text-anchor: middle; }
    </style>
  </defs>

  <!-- Header -->
  <text x="40" y="30" class="title">PHYSICAL AI SYSTEMS ARCHITECTURE STACK</text>
  <rect x="680" y="15" width="280" height="20" rx="4" class="badge-bg"/>
  <text x="820" y="29" class="badge-text" text-anchor="middle">ACTIVE FOCUS: CHAPTER 17 · FRONTIER</text>

  <!-- LAYER 4 -->
  <g opacity="1.0">
    <rect x="40" y="50" width="920" height="70" class="box" stroke="#4A5568" fill="#F7FAFC"/>
    <text x="50" y="70" class="layer-title" fill="#4A5568">LAYER 4 · SYSTEM GOVERNANCE &amp; ASSURANCE TIER [0.1–1 Hz]</text>
    <text x="730" y="70" class="layer-sub" text-anchor="end">Policy Supervision &amp; Safety Cases (Ch 14-17)</text>
    
    <g opacity="0.3"><rect x="50" y="80" width="210" height="30" class="box " stroke="#4A5568"/>
    <text x="155" y="94" class="box-title" fill="#4A5568">Ch 14 Shared Autonomy</text><text x="155" y="105" class="box-sub">Policy Blending · Takeover</text></g>
    
    <g opacity="0.3"><rect x="275" y="80" width="210" height="30" class="box " stroke="#4A5568"/>
    <text x="380" y="94" class="box-title" fill="#4A5568">Ch 15 Verification</text><text x="380" y="105" class="box-sub">Sim → PIL → HIL → In-Situ</text></g>
    
    <g opacity="0.3"><rect x="500" y="80" width="210" height="30" class="box " stroke="#4A5568"/>
    <text x="605" y="94" class="box-title" fill="#4A5568">Ch 16 Safety Cases</text><text x="605" y="105" class="box-sub">Goal Structuring · UL 4600</text></g>
    
    <g opacity="1.0"><rect x="725" y="80" width="225" height="30" class="box box-active" stroke="#4A5568"/>
    <text x="837" y="94" class="box-title" fill="#4A5568">Ch 17 Frontier Limits</text><text x="837" y="105" class="box-sub">Observational Limits</text></g>
  </g>

