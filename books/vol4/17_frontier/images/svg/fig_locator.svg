    <path d="M 630 309 L 645 309" class="arrow" stroke="#285E61"/>
    
    <g opacity="0.3"><rect x="650" y="295" width="300" height="28" class="box " stroke="#285E61"/>
    <text x="800" y="309" class="box-title" fill="#285E61">Certified Actuator Latch</text><text x="800" y="319" class="box-sub">Latches u* into PWM Compare Registers</text></g>
  </g>

  <!-- LAYER 1 -->
  <g opacity="0.3">
    <rect x="40" y="340" width="920" height="80" class="box" stroke="#A51C30" fill="#FFF5F5"/>
    <text x="50" y="360" class="layer-title" fill="#A51C30">LAYER 1 · THE PHYSICAL BODY &amp; CONTINUOUS PLANT [Continuous Dynamical Mechanics]</text>
    <text x="50" y="375" class="layer-sub">Matter, Inertia, Transduction, Friction, and Thermal Limits (Ch 01 Boundary · Ch 02 Body · Ch 06/07 Reality Gap)</text>
    
    <g opacity="0.3"><rect x="50" y="385" width="280" height="28" class="box " stroke="#A51C30"/>
    <text x="190" y="399" class="box-title" fill="#A51C30">Power Inverters &amp; Gate Drivers</text><text x="190" y="409" class="box-sub">PWM Switching → Phase Current I_phase</text></g>
    <path d="M 330 399 L 345 399" class="arrow" stroke="#A51C30"/>
    
    <g opacity="0.3"><rect x="350" y="385" width="280" height="28" class="box " stroke="#A51C30"/>
    <text x="490" y="399" class="box-title" fill="#A51C30">Mechanics, Torque &amp; Momentum</text><text x="490" y="409" class="box-sub">Lorentz Force → Torque τ → Momentum p = mv</text></g>
    <path d="M 630 399 L 645 399" class="arrow" stroke="#A51C30"/>
    
    <g opacity="0.3"><rect x="650" y="385" width="300" height="28" class="box " stroke="#A51C30"/>
    <text x="800" y="399" class="box-title" fill="#A51C30">Causal Boundary &amp; Dissipation</text><text x="800" y="409" class="box-sub">Stopping Envelope d_stop ≤ d_clear · Heat</text></g>
  </g>

  <!-- Connective Feedback Loops -->
  <path d="M 950 330 L 950 340" class="arrow" stroke="#285E61"/>
  <path d="M 950 220 L 950 250" class="arrow" stroke="#1F407A"/>
  <path d="M 20 400 L 10 400 L 10 190 L 40 190" class="arrow" stroke="#A51C30" opacity="0.3"/>
  <text x="-90" y="295" class="box-title" fill="#A51C30" transform="rotate(-90 15 295)" opacity="0.3">Endogenous Sensory Shift (O_t+1)</text>

