<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <marker id="arr-gray" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#c44"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#3d9e5a"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================== LEFT SUB-CARD: TIMING DEFICIT ==================== -->
  <rect x="14" y="12" width="250" height="156" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="24" y="27" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b">A. REACTION DELAY vs. TIME-TO-HARM</text>

  <!-- Track 1: Brittle Fracture Deadline -->
  <rect x="22" y="34" width="234" height="40" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>
  <text x="28" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.8" font-weight="bold" fill="#7f1d1d">Workpiece Fracture Deadline</text>
  <text x="148" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.8" fill="#64748b">(Ramp: 400 N/s | Yield: 15 N)</text>

  <!-- Force Ramp Bar: 0 to 37.5 ms (scale: 3.4 px/ms, 0 ms at x=28, 37.5 ms at x=155.5) -->
  <rect x="28" y="52" width="127.5" height="14" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="91" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.8" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Force Ramp → 15.0 N</text>

  <!-- Vertical Deadline Marker at 37.5 ms (x = 155.5) -->
  <line x1="155.5" y1="48" x2="155.5" y2="70" stroke="#c44" stroke-width="1.5"/>
  <rect x="158" y="52" width="92" height="14" rx="3" fill="#c44"/>
  <text x="204" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.8" font-weight="bold" fill="#ffffff" text-anchor="middle">t_harm = 37.5 ms</text>


  <!-- Track 2: Closed-Loop Reaction Delay -->
  <rect x="22" y="78" width="234" height="48" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>
  <text x="28" y="89" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.8" font-weight="bold" fill="#1e3a8a">Closed-Loop Software Reaction Delay</text>

  <!-- Pipeline Stages from x=28 -->
  <!-- Filter 15 ms: 51 px (x: 28 to 79) -->
  <rect x="28" y="94" width="51" height="18" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="53.5" y="103" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Filter</text>
  <text x="53.5" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.8" fill="#1e3a8a" text-anchor="middle">15.0 ms</text>

  <!-- Bus 2 ms: 14 px (x: 81 to 95) -->
  <rect x="81" y="94" width="14" height="18" rx="2" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75"/>
  <text x="88" y="103" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" font-weight="bold" fill="#581c87" text-anchor="middle">Bus</text>
  <text x="88" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.5" fill="#581c87" text-anchor="middle">2ms</text>

  <!-- MCU 1 ms: 14 px (x: 97 to 111) -->
  <rect x="97" y="94" width="14" height="18" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
  <text x="104" y="103" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" font-weight="bold" fill="#78350f" text-anchor="middle">MCU</text>
  <text x="104" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.5" fill="#78350f" text-anchor="middle">1ms</text>

  <!-- Stator Decay 24 ms: 59.8 px (x: 113 to 170.8) -> 42.0 ms total -->
  <rect x="113" y="94" width="57.8" height="18" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="142" y="103" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#334155" text-anchor="middle">L/R Decay</text>
  <text x="142" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.8" fill="#64748b" text-anchor="middle">24.0 ms</text>

  <!-- Reaction Finish Marker at 42.0 ms (x = 170.8) -->
  <line x1="170.8" y1="90" x2="170.8" y2="116" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="173" y="94" width="79" height="18" rx="3" fill="#1e3a8a"/>
  <text x="212.5" y="103" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#ffffff" text-anchor="middle">τ_react = 42.0 ms</text>
  <text x="212.5" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.8" fill="#93c5fd" text-anchor="middle">Current Cutoff</text>

  <!-- Deficit Banner -->
  <rect x="22" y="130" width="234" height="30" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="139" y="141.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">NEGATIVE MARGIN: Δt_deficit = +4.5 ms</text>
  <text x="139" y="151.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.8" fill="#7f1d1d" text-anchor="middle">Workpiece shatters 4.5 ms before motor current can decay</text>


  <!-- ==================== RIGHT SUB-CARD: COMPLIANCE CONTAINMENT ==================== -->
  <rect x="276" y="12" width="250" height="156" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="286" y="27" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b">B. PASSIVE CONTINUUM MECHANICS</text>

  <!-- Case 1: Rigid Gripper -->
  <rect x="284" y="34" width="234" height="60" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>
  <rect x="290" y="40" width="76" height="14" rx="7" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="328" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#7f1d1d" text-anchor="middle">RIGID GRIPPER</text>
  <text x="372" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b">k_rigid = 500 N/mm</text>

  <text x="292" y="65" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#334155">Unbraked stroke Δx = 0.084 mm</text>
  <text x="435" y="65" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#c44">Peak: 42.0 N</text>

  <rect x="290" y="71" width="222" height="17" rx="2" fill="#f9d6d5"/>
  <text x="401" y="82.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#7f1d1d" text-anchor="middle">SHATTERS WORKPIECE (Yield Limit: 15.0 N)</text>

  <!-- Case 2: Series-Elastic Compliance -->
  <rect x="284" y="98" width="234" height="62" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>
  <rect x="290" y="104" width="82" height="14" rx="7" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="331" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" fill="#14532d" text-anchor="middle">SERIES-ELASTIC</text>
  <text x="378" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b">k_spring ≤ 2.5 N/mm</text>

  <text x="292" y="127" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#334155">Preload F_0 = 6 N | Stroke Δx = 3 mm</text>
  <text x="440" y="127" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#14532d">Peak: 13.5 N</text>

  <rect x="290" y="133" width="222" height="21" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="401" y="143" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" font-weight="bold" fill="#14532d" text-anchor="middle">BOUNDED PEAK FORCE: 13.5 N &lt; 15.0 N</text>
  <text x="401" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.2" fill="#14532d" text-anchor="middle">Passive Mechanics: Workpiece Intact Under Full Motor Stall</text>

</svg>