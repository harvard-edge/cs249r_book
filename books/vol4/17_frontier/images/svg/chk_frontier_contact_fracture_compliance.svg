<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 226" role="img" aria-label="Constructed gripper timing and passive-force comparison">
  <rect width="600" height="226" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <rect x="12" y="12" width="282" height="202" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="306" y="12" width="282" height="202" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1e293b">
    <text x="24" y="32" font-size="11" font-weight="bold">(a) Rigid-jaw reaction deadline</text>
    <text x="318" y="32" font-size="11" font-weight="bold">(b) Passive force path</text>
    <text x="24" y="53" font-size="9">500 N/mm × 2 mm/s = 1000 N/s</text>
    <text x="318" y="53" font-size="9">Preload 6 N; spring 2.5 N/mm</text>
    <line x1="29" y1="94" x2="275" y2="94" stroke="#64748b" stroke-width="1.5"/>
    <line x1="29" y1="90" x2="29" y2="99" stroke="#64748b"/>
    <line x1="118" y1="80" x2="118" y2="107" stroke="#b22222" stroke-width="2"/>
    <line x1="136" y1="80" x2="136" y2="107" stroke="#1e4f82" stroke-width="2"/>
    <line x1="270" y1="90" x2="270" y2="99" stroke="#64748b"/>
    <text x="29" y="113" font-size="8">0</text>
    <text x="102" y="75" font-size="8" fill="#991b1b">15 ms</text>
    <text x="125" y="124" font-size="8" fill="#1e4f82">18 ms</text>
    <text x="250" y="113" font-size="8">42 ms</text>
    <text x="24" y="145" font-size="9" fill="#991b1b">15 N fracture threshold at 15 ms</text>
    <text x="24" y="161" font-size="9" fill="#1e4f82">First command change at 18 ms</text>
    <text x="24" y="177" font-size="9">24 ms L/R = one current time constant</text>
    <text x="24" y="194" font-size="8" fill="#475569">42 N at 42 ms only if closure continues</text>
    <rect x="320" y="70" width="254" height="52" rx="4" fill="#fee2e2" stroke="#b22222"/>
    <text x="332" y="91" font-size="10" font-weight="bold" fill="#991b1b">Rigid path: 15 N reached at 15 ms</text>
    <text x="332" y="108" font-size="8" fill="#7f1d1d">Reactive path is late for this workpiece.</text>
    <rect x="320" y="132" width="254" height="65" rx="4" fill="#dcfce7" stroke="#16803d"/>
    <text x="332" y="153" font-size="10" font-weight="bold" fill="#14532d">6 + 2.5 × 3 = 13.5 N</text>
    <text x="332" y="170" font-size="8" fill="#14532d">Requires ≤3 mm stroke and full load path</text>
    <text x="332" y="185" font-size="8" fill="#14532d">through the validated compliant element.</text>
  </g>
</svg>
