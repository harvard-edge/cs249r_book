  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.estimation.belief
      label: Belief state
      teaches: Recursive estimation on dated measurements
      summary: A dated estimate of physical state formed from prior dynamics and measurements, rather than
        a replacement for current observation.
      section: sec-perception-state-estimation
    - id: vol4.estimation.covariance
      label: Estimator covariance
      teaches: Covariance is a claim
      summary: The estimator's stated uncertainty under its model and noise assumptions; consistency must
        be tested against physical residuals.
      section: sec-memory-estimator-consistency
    - id: vol4.estimation.expiry
      label: Belief expiry
      teaches: Belief expiry
      summary: The point when propagated uncertainty or elapsed time exhausts the margin permitting a cached
        belief to support action.
      section: sec-memory-invalidation-horizon
    relationships:
    - id: vol4.field.sensing-capture--estimation-belief
      source: vol4.sensing.capture
      predicate: dates updates to
      target: vol4.estimation.belief
      explanation: Recursive estimation must interpret measurements at their acquisition times rather than
        treating late arrival as current physical state.
      conditions: This relies on calibrated clock, dynamics, and observation models; delayed-measurement
        handling must preserve the state epoch.
      status: draft
      evidence:
        section: sec-perception-state-estimation
        quote: 'A single LiDAR return or stereo match localizes the rack-end upright at one isolated instant.
          A physical safety permission path, however, requires a continuous range estimate that stays current
          between sweeps, fuses observations across heterogeneous sensors, and produces an uncertainty metric
          whose statistical confidence matches physical reality. A recursive **state estimator**\index{State
          estimation!recursive estimator} satisfies all three demands by alternating two complementary operations:
          a prediction step that projects the state forward through a dynamic motion model, and an update
          step that incorporates each newly arrived, dated measurement. The discrete Kalman filter[^fn-kalman-filter-apollo]
          [@kalman1960new] provides the classical formulation of this recursion, establishing the mathematical
          foundation for this chapter [@thrun2005probabilistic, ch. 3; @barshalom2001estimation]. Multi-object
          tracking and delayed-observation handling apply these two steps directly. The belief decay under
          occlusion examined in @sec-memory-belief-through-occlusion corresponds to the prediction step
          executing without measurement updates, while the observability limits of @sec-memory-state-estimation-bounds
          define the state dimensions that no update stream can reconstruct. The mechanics are clearest
          on a scalar, the remaining distance $\RemainingUprightDistance$ from the mobile base to the rack-end
          upright, so the two operations are worked through on it before the notation extends to full state
          vectors.'
    - id: vol4.field.estimation-covariance--estimation-belief
      source: vol4.estimation.covariance
      predicate: qualifies uncertainty in
      target: vol4.estimation.belief
      explanation: Covariance is the estimator's uncertainty claim, not an independently measured guarantee
        of where the physical plant lies.
      conditions: Physical residuals and model consistency must support its use; unmodeled bias and correlated
        noise can invalidate the claim.
      status: draft
      evidence:
        section: sec-memory-estimator-consistency
        quote: 'Catching an overconfident covariance like the misdated stereo filter''s requires two complementary
          statistical tests: an offline qualification metric evaluated against ground truth before deployment,
          and an online runtime monitor evaluated directly against incoming measurement streams during operation.
          Both formulations use a zero-mean Gaussian error model with the correct nonsingular covariance.
          Whitening the error under these assumptions produces independent standard normal coordinates;
          their squared norm, rather than the error vector itself, follows a chi-squared distribution. Matching
          covariance alone does not establish Gaussian tails.'
    - id: vol4.field.estimation-expiry--estimation-belief
      source: vol4.estimation.expiry
      predicate: withdraws action support from
      target: vol4.estimation.belief
      explanation: A cached belief cannot justify action after its propagated uncertainty consumes the available
        physical margin.
      conditions: Expiry is query and motion dependent; an object identity may remain useful after the metric
        clearance belief has expired.
      status: draft
      evidence:
        section: sec-memory-invalidation-horizon
        quote: 'The two rack-end deadlines, for the aisle ahead and for the space abreast of the rack end,
          are instances of one physical quantity: the elapsed time at which a belief''s growing error bound
          reaches the tolerance of the task it supports. Beyond that point, an extrapolated belief can no
          longer prevent a collision or a mechanical jam.'
    - id: vol4.field.estimation-covariance--estimation-expiry
      source: vol4.estimation.covariance
      predicate: can advance
      target: vol4.estimation.expiry
      explanation: Uncertainty propagation can exhaust the remaining clearance or contact margin before
        a nominal time-to-live elapses.
      conditions: Use a consistent model and a margin matched to the current query; covariance alone cannot
        cover arbitrary hidden hazards.
      status: draft
      evidence:
        section: sec-memory-covariance-growth
        quote: Both frameworks converge on one engineering invariant. The invalidation horizon (definition
          \ref{dfn-memory-belief-invalidation-horizon}) marks the precise instant at which the propagated
          error bound intersects the allowable task tolerance, regardless of whether that bound stems from
          worst-case physics or calibrated statistical quantiles. Belief expiration is physical rather than
          computational. It is neither a generic network socket timeout nor an arbitrary 100 ms polling
          heuristic selected for scheduling convenience. Rather, $\BeliefInvalidationHorizon$ is a deadline
          dictated by spatial clearance, machine kinematics, and disturbance dynamics. Beyond $\EvidenceEpoch
          + \BeliefInvalidationHorizon$, downstream controllers cannot assume the estimated pose satisfies
          the task's safety envelope.
