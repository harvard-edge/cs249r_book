  claims:
    Recursive estimation on dated measurements: A state estimator alternates a prediction that widens uncertainty
      with elapsed time and updates that narrow it below every input by inverse-variance fusion, applying each measurement
      at its capture epoch and replaying out-of-sequence ones.
    Covariance is a claim: A filter's reported covariance is a hypothesis tested offline by NEES against ground
      truth and online by NIS on innovations, and an above-band mean flags the safety-critical overconfident filter.
    Occupancy before identity: Tracking adds identity and velocity for planners, but a tentative track's occupied
      region must reach clearance consumers before confirmation and stays occupied while it coasts.
    Belief record: Every spatial claim carries evidence, estimate, and publication epochs, and only a physical measurement
      advances the evidence epoch, so prediction and republishing must preserve it.
    Frames age: A transform is a belief with its own epoch, so composing a stale camera-to-slot edge with current
      kinematics yields a pose the arm never occupied, and the lever arm, not clock resolution, sets the error.
    Representation follows the query: The map is chosen by the query it answers inside the permission tick's read
      budget, so the local snapshot is a dense distance field with four cell states and explicit negative evidence.
    Belief expiry: A belief stops supporting motion when its validated error bound, growing from the evidence epoch,
      first reaches the task tolerance, and free space erodes inward from the unobserved boundary at a hidden agent's
      speed bound.
    Observability ceiling: When distinct state histories give identical measurements no estimator can separate them,
      and innovations stay near zero while the true state drifts, so observability must be designed in by excitation
      or added sensing.
    Out-of-sequence replay: A ring buffer sized to the delay horizon lets the filter rewind to a late measurement's
      capture epoch, correct, and replay, and measurements older than the buffer are rejected.
    Occlusion and free-space erosion: Space last seen free stays free only until an unseen agent could have entered
      it, so occluded free space shrinks at that agent's speed bound and blind crossings need site controls, not
      memory.
    Multi-rate semantic mapping: A metric loop at camera rate keeps geometry current while foundation backbones
      update semantics on keyframes, and semantics never certify clearance.
    Observational indistinguishability: When two states that need different responses produce identical observations
      until the action deadline, no model on that channel can separate them, and the latest useful observation is
      set by braking distance over speed.
