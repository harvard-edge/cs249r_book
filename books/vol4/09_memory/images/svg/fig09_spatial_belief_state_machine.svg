<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="760" height="330" fill="#FFFFFF"/>

  <!-- ==================================================================== -->
  <!-- TOP RETURN RAIL: FRESH OBSERVATION BACK TO VALID                     -->
  <!-- ==================================================================== -->
  <!-- Top rail from EXPIRED and DEGRADED back to VALID -->
  <path d="M 660 120 L 660 50 L 160 50 L 160 112" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- Branch from DEGRADED up to top rail -->
  <path d="M 435 120 L 435 50" fill="none" stroke="#16A34A" stroke-width="1.8"/>

  <!-- Top Badge Label -->
  <rect x="235" y="38" width="330" height="24" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="400" y="54" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Fresh Sensor Observation (t₀ renewed &amp; gated)</text>

  <!-- Return from UNOBSERVABLE up to VALID -->
  <path d="M 180 220 L 180 178" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="188" y="200" font-size="8.5" font-weight="600" fill="#15803D">Fresh fix</text>

  <!-- ==================================================================== -->
  <!-- STATE 1: VALID                                                       -->
  <!-- ==================================================================== -->
  <g id="state-valid">
    <rect x="90" y="120" width="140" height="50" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="160" y="142" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">VALID</text>
    <text x="160" y="158" font-size="10" font-weight="500" fill="#166534" text-anchor="middle">Direct measurement active</text>
  </g>

  <!-- Forward arrow: VALID -> DEGRADED -->
  <line x1="230" y1="145" x2="348" y2="145" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="290" y="132" font-size="10" font-weight="600" fill="#B45309" text-anchor="middle">Sensor Occlusion</text>
  <text x="290" y="160" font-size="9.5" fill="#78350F" text-anchor="middle">E(Δt) ≤ E_max</text>

  <!-- Downward arrow: VALID -> UNOBSERVABLE -->
  <line x1="130" y1="170" x2="130" y2="212" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="122" y="193" font-size="8.5" font-weight="600" fill="#475569" text-anchor="end">Observability</text>
  <text x="122" y="204" font-size="8.5" font-weight="600" fill="#475569" text-anchor="end">collapse</text>

  <!-- ==================================================================== -->
  <!-- STATE 2: DEGRADED                                                    -->
  <!-- ==================================================================== -->
  <g id="state-degraded">
    <rect x="355" y="120" width="160" height="50" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="435" y="142" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">DEGRADED</text>
    <text x="435" y="158" font-size="10" font-weight="500" fill="#92400E" text-anchor="middle">Bounded dead-reckoning</text>
  </g>

  <!-- Forward arrow: DEGRADED -> EXPIRED -->
  <line x1="515" y1="145" x2="593" y2="145" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="555" y="130" font-size="9.5" font-weight="600" fill="#DC2626" text-anchor="middle">Timeout /</text>
  <text x="555" y="141" font-size="9" font-weight="500" fill="#DC2626" text-anchor="middle">breach</text>
  <text x="555" y="160" font-size="9" fill="#991B1B" text-anchor="middle">E(Δt) &gt; E_max</text>

  <!-- ==================================================================== -->
  <!-- STATE 3: EXPIRED                                                     -->
  <!-- ==================================================================== -->
  <g id="state-expired">
    <rect x="600" y="120" width="125" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="662" y="142" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">EXPIRED</text>
    <text x="662" y="158" font-size="10" font-weight="500" fill="#991B1B" text-anchor="middle">Refuse &amp; fallback</text>
  </g>

  <!-- ==================================================================== -->
  <!-- STATE 4: UNOBSERVABLE                                                -->
  <!-- ==================================================================== -->
  <g id="state-unobservable">
    <rect x="90" y="220" width="140" height="50" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <text x="160" y="242" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">UNOBSERVABLE</text>
    <text x="160" y="258" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Rank collapse / slip</text>
  </g>

  <!-- Transition from DEGRADED down and left to UNOBSERVABLE -->
  <path d="M 390 170 L 390 245 L 238 245" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="314" y="238" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Observability loss</text>

  <!-- Legend / Physical Invariant note at bottom -->
  <rect x="70" y="292" width="620" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="380" y="308" font-size="9.5" font-weight="500" fill="#475569" text-anchor="middle"><tspan font-weight="700" fill="#0F172A">Physical Invariant:</tspan> Belief records transition to VALID strictly via fresh physical measurements, never by software extrapolation.</text>

</svg>
