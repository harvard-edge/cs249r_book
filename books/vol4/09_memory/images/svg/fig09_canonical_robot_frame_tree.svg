<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4A5568"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="tick" viewBox="0 0 2 10" refX="1" refY="5" markerWidth="2" markerHeight="8" orient="auto">
      <rect x="0" y="0" width="1.2" height="10" fill="#1A202C"/>
    </marker>
  </defs>

  <!-- ===== Panel tags ===== -->
  <text x="20" y="26" font-size="11" font-weight="700" fill="#1A202C">(a) Manipulator geometry</text>
  <text x="360" y="26" font-size="11" font-weight="700" fill="#1A202C">(b) Transform tree</text>
  <line x1="340" y1="20" x2="340" y2="400" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== Panel (a): seven-joint arm ===== -->
  <!-- base -->
  <rect x="40" y="370" width="120" height="16" rx="0" fill="#4A5568"/>
  <text x="100" y="382" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">base_link</text>
  <!-- links -->
  <path d="M 100 370 L 100 290 L 160 210 L 130 160 L 180 120 L 210 120" fill="none" stroke="#A0AEC0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100 370 L 100 290 L 160 210 L 130 160 L 180 120 L 210 120" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- joints 1-7 -->
  <g fill="#1A4D3E" stroke="#ffffff" stroke-width="1.5">
    <circle cx="100" cy="350" r="6"/>
    <circle cx="100" cy="290" r="6"/>
    <circle cx="130" cy="250" r="6"/>
    <circle cx="160" cy="210" r="6"/>
    <circle cx="130" cy="160" r="6"/>
    <circle cx="180" cy="120" r="6"/>
    <circle cx="210" cy="120" r="6"/>
  </g>
  <g font-size="8.5" fill="#4A5568">
    <text x="86" y="354" text-anchor="end">1</text>
    <text x="86" y="294" text-anchor="end">2</text>
    <text x="116" y="254" text-anchor="end">3</text>
    <text x="174" y="214">4</text>
    <text x="116" y="164" text-anchor="end">5</text>
    <text x="180" y="142" text-anchor="middle">6</text>
    <text x="206" y="142" text-anchor="middle">7</text>
  </g>
  <text x="193" y="156" text-anchor="middle" font-size="8.5" fill="#4A5568">wrist</text>
  <!-- gripper -->
  <rect x="216" y="112" width="14" height="16" rx="0" fill="#4A5568"/>
  <rect x="230" y="110" width="30" height="4" rx="0" fill="#4A5568"/>
  <rect x="230" y="126" width="30" height="4" rx="0" fill="#4A5568"/>
  <circle cx="268" cy="120" r="3.5" fill="#1A202C"/>
  <text x="278" y="124" font-size="9" font-weight="700" fill="#1A202C">tool0</text>
  <!-- wrist camera on the flange -->
  <rect x="218" y="98" width="12" height="10" rx="0" fill="#007A87"/>
  <path d="M 230 103 L 258 92 L 252 80 Z" fill="#007A87" fill-opacity="0.18"/>
  <text x="212" y="92" text-anchor="end" font-size="9" font-weight="700" fill="#007A87">wrist_cam</text>
  <!-- lever arm dimension: wrist joint to tool center point -->
  <line x1="210" y1="64" x2="268" y2="64" stroke="#1A202C" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <line x1="210" y1="68" x2="210" y2="110" stroke="#A0AEC0" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="268" y1="68" x2="268" y2="112" stroke="#A0AEC0" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="239" y="56" text-anchor="middle" font-size="11" font-style="italic" fill="#1A202C">r<tspan baseline-shift="sub" font-size="8" font-style="normal">arm</tspan></text>
  <!-- tool error: the wrist turns by delta-theta during the stale interval -->
  <line x1="210" y1="120" x2="262.6" y2="144.5" stroke="#A51C30" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 268 120 A 58 58 0 0 1 263.5 142.5" fill="none" stroke="#A51C30" stroke-width="1.3" marker-end="url(#arr-crimson)"/>
  <text x="276" y="142" font-size="9" fill="#A51C30">Δθ<tspan baseline-shift="sub" font-size="7">joint</tspan></text>
  <text x="250" y="176" text-anchor="middle" font-size="9" fill="#A51C30">e<tspan baseline-shift="sub" font-size="7.5">tool</tspan> ≈ r<tspan baseline-shift="sub" font-size="7.5">arm</tspan> Δθ<tspan baseline-shift="sub" font-size="7.5">joint</tspan></text>

  <!-- ===== Panel (b): tf2 tree, one parent per frame ===== -->
  <!-- world -->
  <rect x="400" y="40" width="110" height="30" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="455" y="59" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1A202C">world</text>
  <line x1="455" y1="70" x2="455" y2="98" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <!-- base_link -->
  <rect x="400" y="100" width="110" height="30" rx="3" fill="#F8FAFC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="455" y="119" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1A202C">base_link</text>
  <line x1="455" y1="130" x2="455" y2="168" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <text x="463" y="153" font-size="8.5" fill="#4A5568">q<tspan baseline-shift="sub" font-size="7">1</tspan>…q<tspan baseline-shift="sub" font-size="7">7</tspan> at t</text>
  <!-- link chain -->
  <rect x="400" y="170" width="110" height="30" rx="3" fill="#F8FAFC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="455" y="189" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1A202C">link1 → link7</text>
  <!-- children of link7 -->
  <path d="M 430 200 L 430 220 L 405 220 L 405 248" fill="none" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <path d="M 480 200 L 480 220 L 505 220 L 505 248" fill="none" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <rect x="360" y="250" width="90" height="30" rx="3" fill="#F0FAFB" stroke="#007A87" stroke-width="1.2"/>
  <text x="405" y="269" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1A202C">wrist_cam</text>
  <rect x="460" y="250" width="90" height="30" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="505" y="269" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1A202C">tool0</text>
  <!-- target_object: single parent base_link, pose stamped at capture epoch t0 -->
  <rect x="560" y="100" width="95" height="30" rx="3" fill="#F8FAFC" stroke="#A51C30" stroke-width="1.2"/>
  <text x="607" y="119" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1A202C">target_object</text>
  <line x1="510" y1="115" x2="558" y2="115" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-crimson)"/>
  <text x="534" y="94" text-anchor="middle" font-size="8.5" fill="#A51C30">stamped t<tspan baseline-shift="sub" font-size="7">0</tspan></text>
  <!-- measurement: wrist_cam observed the target at t0 (not a tree edge) -->
  <path d="M 405 280 L 405 310 L 607 310 L 607 132" fill="none" stroke="#007A87" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arr-petrol)"/>
  <text x="506" y="326" text-anchor="middle" font-size="8.5" fill="#007A87">camera measurement at t<tspan baseline-shift="sub" font-size="7">0</tspan> (not a tree edge)</text>

  <!-- ===== Legend ===== -->
  <line x1="360" y1="360" x2="390" y2="360" stroke="#4A5568" stroke-width="1.2"/>
  <text x="396" y="363" font-size="8.5" fill="#4A5568">tf2 edge (one parent per frame)</text>
  <line x1="360" y1="380" x2="390" y2="380" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="396" y="383" font-size="8.5" fill="#4A5568">edge dated at an older epoch</text>
  <line x1="360" y1="400" x2="390" y2="400" stroke="#007A87" stroke-width="1.2" stroke-dasharray="2,3"/>
  <text x="396" y="403" font-size="8.5" fill="#4A5568">measurement that produced it</text>
</svg>
