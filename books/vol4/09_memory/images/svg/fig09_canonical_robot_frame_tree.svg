<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; text-transform: uppercase; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #0f172a; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; line-height: 1.4; }
    .math-text { font-family: "STIX Two Text", "Cambria Math", Georgia, serif; font-size: 11.5px; font-style: italic; fill: #0f172a; }
    .code-pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 600; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="435" fill="#ffffff" rx="12"/>
  <rect x="8" y="8" width="944" height="419" fill="#fafafa" rx="10" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <text x="30" y="32" class="header-text" fill="#0f172a">Manipulator Kinematic Frame Tree &amp; Temporal Lever-Arm Dynamics</text>
  <text x="930" y="32" text-anchor="end" font-family="ui-monospace, monospace" font-size="10.5px" fill="#64748b">Adapted from Craig (2005) &amp; Foote (REP-105)</text>
  <line x1="30" y1="42" x2="930" y2="42" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- ==================== PANEL A: PHYSICAL ARTICULATED KINEMATICS ==================== -->
  <g transform="translate(30, 54)">
    <rect width="410" height="358" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="10" width="220" height="20" rx="4" fill="#dbeafe"/>
    <text x="20" y="24" class="code-pill" fill="#1e40af">PANEL A: PHYSICAL MANIPULATOR GEOMETRY</text>

    <!-- Robot Base Mount -->
    <rect x="120" y="310" width="100" height="24" rx="4" fill="#64748b"/>
    <rect x="90" y="334" width="160" height="10" rx="2" fill="#334155"/>
    <text x="170" y="326" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5px" fill="#ffffff" font-weight="600">base_link</text>

    <!-- Articulated Links & Arm Graphic -->
    <!-- Link 1 & 2 -->
    <path d="M 170 310 L 170 235 L 230 160 L 210 95 L 260 80" fill="none" stroke="#94a3b8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 170 310 L 170 235 L 230 160 L 210 95 L 260 80" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Joint Axis Nodes -->
    <circle cx="170" cy="310" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="170" cy="235" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="230" cy="160" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="210" cy="95" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="260" cy="80" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

    <!-- End-Effector Gripper -->
    <rect x="260" y="72" width="22" height="16" rx="2" fill="#334155"/>
    <rect x="282" y="66" width="18" height="6" rx="1" fill="#475569"/>
    <rect x="282" y="88" width="18" height="6" rx="1" fill="#475569"/>
    <circle cx="300" cy="80" r="4" fill="#dc2626"/>
    <text x="310" y="84" font-family="ui-monospace, monospace" font-size="9px" fill="#b91c1c" font-weight="700">tool0 (TCP)</text>

    <!-- Wrist Camera Mount -->
    <rect x="235" y="62" width="16" height="14" rx="2" fill="#2563eb"/>
    <path d="M 235 69 L 215 55 L 215 83 z" fill="#93c5fd" opacity="0.3"/>
    <text x="210" y="50" font-family="ui-monospace, monospace" font-size="8.5px" fill="#1d4ed8" font-weight="600">wrist_camera</text>

    <!-- Lever-Arm Dimension Annotation -->
    <path d="M 160 305 C 120 220, 150 120, 255 75" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="110" y="195" font-family="-apple-system, sans-serif" font-size="10px" fill="#6d28d9" font-weight="600">Lever Arm ℓ = 0.85 m</text>

    <!-- Lever-Arm Error Callout Card -->
    <g transform="translate(18, 220)">
      <rect width="210" height="80" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="10" y="18" class="card-title" fill="#991b1b">Lever-Arm Error Magnification</text>
      <text x="10" y="34" class="card-desc">Joint encoder staleness <tspan class="math-text">Δt = 40 ms</tspan></text>
      <text x="10" y="48" class="card-desc">Angular deflection: <tspan class="math-text">Δθ = 4.6° (0.080 rad)</tspan></text>
      <rect x="10" y="55" width="188" height="18" rx="3" fill="#fee2e2"/>
      <text x="16" y="68" class="code-pill" fill="#b91c1c">etool ≈ ℓ · Δθ = 6.8 cm drift!</text>
    </g>
  </g>

  <!-- ==================== PANEL B: DIRECTED ACYCLIC FRAME TREE (DAG) ==================== -->
  <g transform="translate(460, 54)">
    <rect width="470" height="358" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="10" width="240" height="20" rx="4" fill="#d1fae5"/>
    <text x="20" y="24" class="code-pill" fill="#065f46">PANEL B: SPATIAL TRANSFORMATION TREE (tf2)</text>

    <!-- Node 1: World Origin -->
    <g transform="translate(30, 48)">
      <rect width="105" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="10" y="18" class="code-pill" fill="#334155">world</text>
      <text x="10" y="32" class="sub-text">Inertial Reference</text>
    </g>

    <!-- Edge: World -> Base -->
    <line x1="135" y1="69" x2="168" y2="69" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
    <text x="142" y="62" class="code-pill" fill="#64748b" font-size="8px">T_w_b</text>

    <!-- Node 2: Robot Base Link -->
    <g transform="translate(172, 48)">
      <rect width="115" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3" filter="url(#card-shadow)"/>
      <text x="10" y="18" class="code-pill" fill="#1e40af">base_link</text>
      <text x="10" y="32" class="sub-text">Rigid Pedestal [0 Hz]</text>
    </g>

    <!-- Branch Down: Joint Kinematics Chain -->
    <line x1="229" y1="90" x2="229" y2="114" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="235" y="106" class="code-pill" fill="#059669" font-size="8.5px">1 kHz Encoders</text>

    <!-- Node 3: panda_link1..link6 -->
    <g transform="translate(162, 118)">
      <rect width="135" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="10" y="18" class="code-pill" fill="#166534">link1 → link6</text>
      <text x="10" y="32" class="sub-text">Kinematic Transforms</text>
    </g>

    <!-- Edge: link6 -> link7 -->
    <line x1="229" y1="160" x2="229" y2="184" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

    <!-- Node 4: panda_link7 (Wrist Hub) -->
    <g transform="translate(162, 188)">
      <rect width="135" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3" filter="url(#card-shadow)"/>
      <text x="10" y="18" class="code-pill" fill="#166534">link7 (Wrist)</text>
      <text x="10" y="32" class="sub-text">Epoch: t0 = 1000 Hz</text>
    </g>

    <!-- Branch to Wrist Camera (Left Branch) -->
    <path d="M 162 209 L 115 209 L 115 240" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
    <g transform="translate(50, 244)">
      <rect width="125" height="48" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="8" y="18" class="code-pill" fill="#1d4ed8">wrist_camera</text>
      <text x="8" y="31" class="sub-text">Extrinsic Calibration</text>
      <text x="8" y="42" class="code-pill" fill="#3b82f6" font-size="8px">Rate: 30 Hz (t_cam)</text>
    </g>

    <!-- Branch to Flange & Tool Tip (Right Branch) -->
    <path d="M 297 209 L 340 209 L 340 240" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
    <g transform="translate(280, 244)">
      <rect width="125" height="48" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3" filter="url(#card-shadow)"/>
      <text x="8" y="18" class="code-pill" fill="#92400e">tool0 / TCP</text>
      <text x="8" y="31" class="sub-text">End-Effector Gripper</text>
      <text x="8" y="42" class="code-pill" fill="#b45309" font-size="8px">Command Target</text>
    </g>

    <!-- Target Workpiece Node (Bottom) -->
    <g transform="translate(162, 290)">
      <rect width="135" height="48" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="10" y="18" class="code-pill" fill="#6d28d9">target_object</text>
      <text x="10" y="32" class="sub-text">Estimated Pose</text>
      <text x="10" y="43" class="code-pill" fill="#7c3aed" font-size="8px">Vision Ingest: 10 Hz</text>
    </g>

    <!-- Vision Observation Line: Camera -> Object -->
    <line x1="112" y1="292" x2="162" y2="310" stroke="#8b5cf6" stroke-width="1.3" stroke-dasharray="3 2"/>

    <!-- CRITICAL WARNING: Stale Transform Edge across epochs -->
    <path d="M 340 292 C 340 330, 310 330, 300 320" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
    <rect x="312" y="324" width="138" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="318" y="337" class="code-pill" fill="#991b1b" font-size="8px">FROZEN EDGE: Δt = 40 ms</text>
    <text x="318" y="345" font-family="-apple-system, sans-serif" font-size="7.5px" fill="#b91c1c">Guides arm to phantom coords</text>
  </g>

</svg>
