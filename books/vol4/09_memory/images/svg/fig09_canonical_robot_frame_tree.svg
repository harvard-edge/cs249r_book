<svg xmlns="http://www.w3.org/2000/svg" viewBox="106.6 5.8 803.1 398.1" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="66.4" y="-14.1" width="883.4" height="437.9" fill="#ffffff"/>
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="960" height="410" fill="#FFFFFF"/>

  <!-- Panel Sub-Headers -->
  <text x="230" y="32" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(a) Manipulator Geometry &amp; Lever Arm</text>
  <text x="710" y="32" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(b) Coordinate Transform Tree (DAG)</text>

  <!-- Panel Divider -->
  <line x1="460" y1="20" x2="460" y2="390" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): PHYSICAL MANIPULATOR GEOMETRY                             -->
  <!-- ==================================================================== -->
  <g id="panel-a" transform="translate(15, 10)">
    <!-- Base Platform -->
    <rect x="150" y="340" width="120" height="18" rx="3" fill="#64748B"/>
    <rect x="130" y="358" width="160" height="8" rx="2" fill="#334155"/>
    <text x="210" y="353" font-family="'Menlo', 'Courier New', monospace" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">base_link</text>

    <!-- Articulated Links -->
    <path d="M 210 340 L 210 260 L 275 175 L 255 110 L 310 95" fill="none" stroke="#94A3B8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 210 340 L 210 260 L 275 175 L 255 110 L 310 95" fill="none" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Joint Axis Hubs -->
    <circle cx="210" cy="340" r="7" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="210" cy="260" r="7" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="275" cy="175" r="7" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="255" cy="110" r="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="310" cy="95" r="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>

    <!-- Wrist Camera Mount & Sensor Cone -->
    <rect x="280" y="74" width="16" height="14" rx="2" fill="#2563EB"/>
    <path d="M 296 81 L 325 60 L 325 102 z" fill="#93C5FD" opacity="0.3"/>
    <text x="288" y="65" font-family="'Menlo', 'Courier New', monospace" font-size="9" font-weight="600" fill="#1D4ED8" text-anchor="middle">wrist_cam</text>

    <!-- Gripper and Tool Center Point (TCP) -->
    <rect x="310" y="87" width="20" height="16" rx="2" fill="#334155"/>
    <rect x="330" y="82" width="14" height="5" rx="1" fill="#475569"/>
    <rect x="330" y="103" width="14" height="5" rx="1" fill="#475569"/>
    <circle cx="348" cy="95" r="4" fill="#DC2626"/>
    <text x="360" y="99" font-family="'Menlo', 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#DC2626">tool0 (TCP)</text>

    <!-- Lever Arm Dimension Arc -->
    <path d="M 200 335 C 145 245, 180 140, 305 90" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="135" y="210" font-size="10" font-weight="600" fill="#7C3AED">Lever arm ℓ</text>

    <!-- Angular deflection and tool error annotation -->
    <path d="M 348 95 C 370 105, 380 125, 375 145" fill="none" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <text x="382" y="130" font-size="9.5" font-weight="600" fill="#DC2626">e<tspan baseline-shift="sub" font-size="78%">tool</tspan> ≈ ℓ · Δθ</text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): COORDINATE TRANSFORM TREE (tf2 DAG)                       -->
  <!-- ==================================================================== -->
  <g id="panel-b" transform="translate(485, 20)">
    <!-- Root: world -->
    <rect x="25" y="45" width="90" height="34" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="70" y="66" font-family="'Menlo', 'Courier New', monospace" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">world</text>

    <!-- Edge: world -> base_link -->
    <line x1="115" y1="62" x2="168" y2="62" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-slate)"/>
    <text x="142" y="55" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">T_w_b</text>

    <!-- Node: base_link -->
    <rect x="170" y="45" width="105" height="34" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="222" y="66" font-family="'Menlo', 'Courier New', monospace" font-size="10" font-weight="600" fill="#1E40AF" text-anchor="middle">base_link</text>

    <!-- Edge: base_link -> link1..6 -->
    <line x1="222" y1="79" x2="222" y2="118" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-slate)"/>

    <!-- Node: link1..6 -->
    <rect x="170" y="120" width="105" height="34" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="222" y="141" font-family="'Menlo', 'Courier New', monospace" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">link1 → link6</text>

    <!-- Edge: link1..6 -> wrist -->
    <line x1="222" y1="154" x2="222" y2="193" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-slate)"/>

    <!-- Node: wrist -->
    <rect x="170" y="195" width="105" height="34" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="222" y="216" font-family="'Menlo', 'Courier New', monospace" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">wrist</text>

    <!-- Branch Left: wrist -> wrist_cam -->
    <path d="M 170 212 L 80 212 L 80 260" fill="none" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <rect x="30" y="262" width="100" height="34" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="80" y="283" font-family="'Menlo', 'Courier New', monospace" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">wrist_cam</text>

    <!-- Branch Right: wrist -> tool0 -->
    <path d="M 275 212 L 360 212 L 360 260" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <rect x="310" y="262" width="100" height="34" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="360" y="283" font-family="'Menlo', 'Courier New', monospace" font-size="9.5" font-weight="600" fill="#92400E" text-anchor="middle">tool0 (TCP)</text>

    <!-- Target Object Node -->
    <rect x="170" y="325" width="105" height="34" rx="3" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.2"/>
    <text x="222" y="346" font-family="'Menlo', 'Courier New', monospace" font-size="9.5" font-weight="600" fill="#6B21A8" text-anchor="middle">target_object</text>

    <!-- Observation edge: camera -> target -->
    <line x1="80" y1="296" x2="168" y2="335" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-purple)"/>

    <!-- Asynchronous Stale Edge: target -> tool0 -->
    <path d="M 360 296 C 360 342, 310 342, 278 342" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
    <text x="350" y="360" font-size="8.5" font-weight="600" fill="#DC2626" text-anchor="middle">Asynchronous (Stale)</text>
  </g>
</svg>
