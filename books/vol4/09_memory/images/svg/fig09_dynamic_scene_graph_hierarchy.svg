<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.3 9.3 858.4 419.6" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-28.6" y="-11.7" width="944.2" height="461.6" fill="#ffffff"/>
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="900" height="450" fill="#FFFFFF"/>

  <!-- ==================================================================== -->
  <!-- 5-LAYER DYNAMIC SCENE GRAPH HIERARCHY                                 -->
  <!-- ==================================================================== -->

  <!-- Inter-layer dashed vertical connector lines -->
  <line x1="330" y1="65" x2="310" y2="135" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="510" y1="65" x2="520" y2="135" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="310" y1="150" x2="310" y2="215" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="520" y1="150" x2="490" y2="215" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="370" y1="225" x2="350" y2="290" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="490" y1="225" x2="520" y2="290" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="350" y1="315" x2="350" y2="370" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="520" y1="315" x2="520" y2="370" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- LAYER 5: BUILDINGS -->
  <g id="layer-5" transform="translate(30, 25)">
    <rect x="0" y="0" width="630" height="68" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="38" font-size="11" font-weight="700" fill="#1E3A8A">Layer 5: Buildings</text>

    <!-- Node 1: Wing A -->
    <rect x="250" y="16" width="100" height="36" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <circle cx="265" cy="34" r="4" fill="#2563EB"/>
    <text x="278" y="38" font-size="10" font-weight="600" fill="#1E40AF">Wing A</text>

    <!-- Topological Edge -->
    <line x1="350" y1="34" x2="430" y2="34" stroke="#3B82F6" stroke-width="1.4"/>

    <!-- Node 2: Depot -->
    <rect x="430" y="16" width="100" height="36" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <circle cx="445" cy="34" r="4" fill="#2563EB"/>
    <text x="458" y="38" font-size="10" font-weight="600" fill="#1E40AF">Depot</text>
  </g>

  <!-- LAYER 4: ROOMS -->
  <g id="layer-4" transform="translate(30, 105)">
    <rect x="0" y="0" width="630" height="68" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="38" font-size="11" font-weight="700" fill="#312E81">Layer 4: Rooms</text>

    <!-- Room 1: Kitchen -->
    <rect x="230" y="16" width="85" height="36" rx="3" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.2"/>
    <text x="272" y="38" font-size="9.5" font-weight="600" fill="#3730A3" text-anchor="middle">Kitchen</text>

    <!-- Door Edge 1 -->
    <line x1="315" y1="34" x2="355" y2="34" stroke="#6366F1" stroke-width="1.4"/>

    <!-- Room 2: Corridor -->
    <rect x="355" y="16" width="85" height="36" rx="3" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.2"/>
    <text x="397" y="38" font-size="9.5" font-weight="600" fill="#3730A3" text-anchor="middle">Corridor</text>

    <!-- Door Edge 2 -->
    <line x1="440" y1="34" x2="480" y2="34" stroke="#6366F1" stroke-width="1.4"/>

    <!-- Room 3: Lab -->
    <rect x="480" y="16" width="85" height="36" rx="3" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.2"/>
    <text x="522" y="38" font-size="9.5" font-weight="600" fill="#3730A3" text-anchor="middle">Lab</text>
  </g>

  <!-- LAYER 3: PLACES -->
  <g id="layer-3" transform="translate(30, 185)">
    <rect x="0" y="0" width="630" height="68" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="38" font-size="11" font-weight="700" fill="#0F766E">Layer 3: Places</text>

    <!-- Voronoi Freespace Spheres and Edges -->
    <g transform="translate(230, 14)">
      <!-- Sphere 1 -->
      <circle cx="30" cy="20" r="18" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="30" cy="20" r="3.5" fill="#0F766E"/>
      <text x="30" y="32" font-family="'Menlo', 'Courier New', monospace" font-size="8" fill="#0F766E" text-anchor="middle">p₁</text>

      <line x1="30" y1="20" x2="110" y2="20" stroke="#0D9488" stroke-width="1.5"/>

      <!-- Sphere 2 -->
      <circle cx="110" cy="20" r="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="110" cy="20" r="3.5" fill="#0F766E"/>
      <text x="110" y="32" font-family="'Menlo', 'Courier New', monospace" font-size="8" fill="#0F766E" text-anchor="middle">p₂</text>

      <line x1="110" y1="20" x2="190" y2="20" stroke="#0D9488" stroke-width="1.5"/>

      <!-- Sphere 3 -->
      <circle cx="190" cy="20" r="20" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="190" cy="20" r="3.5" fill="#0F766E"/>
      <text x="190" y="32" font-family="'Menlo', 'Courier New', monospace" font-size="8" fill="#0F766E" text-anchor="middle">p₃</text>

      <line x1="190" y1="20" x2="260" y2="20" stroke="#0D9488" stroke-width="1.5"/>

      <!-- Sphere 4 -->
      <circle cx="260" cy="20" r="13" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="260" cy="20" r="3.5" fill="#0F766E"/>
      <text x="260" y="32" font-family="'Menlo', 'Courier New', monospace" font-size="8" fill="#0F766E" text-anchor="middle">p₄</text>
    </g>
  </g>

  <!-- LAYER 2: OBJECTS & AGENTS -->
  <g id="layer-2" transform="translate(30, 265)">
    <rect x="0" y="0" width="630" height="68" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="38" font-size="11" font-weight="700" fill="#B45309">Layer 2: Objects &amp; Agents</text>

    <!-- Object 1: Mug -->
    <rect x="230" y="16" width="80" height="36" rx="3" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="270" y="38" font-size="9.5" font-weight="600" fill="#92400E" text-anchor="middle">Object</text>

    <!-- Relation Edge -->
    <line x1="310" y1="34" x2="350" y2="34" stroke="#D97706" stroke-width="1.2" stroke-dasharray="2,2"/>

    <!-- Object 2: Table -->
    <rect x="350" y="16" width="80" height="36" rx="3" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="390" y="38" font-size="9.5" font-weight="600" fill="#92400E" text-anchor="middle">Table</text>

    <!-- Dynamic Agent -->
    <rect x="470" y="16" width="95" height="36" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <circle cx="486" cy="34" r="4" fill="#DC2626"/>
    <text x="520" y="38" font-size="9.5" font-weight="700" fill="#991B1B" text-anchor="middle">Agent</text>
  </g>

  <!-- LAYER 1: METRIC MESH -->
  <g id="layer-1" transform="translate(30, 345)">
    <rect x="0" y="0" width="630" height="68" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="38" font-size="11" font-weight="700" fill="#334155">Layer 1: Metric Mesh</text>

    <!-- Triangular Mesh Wireframe -->
    <g transform="translate(240, 16)">
      <polygon points="10,34 38,8 66,34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
      <polygon points="38,8 66,34 94,8" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
      <polygon points="66,34 94,8 122,34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
      <polygon points="94,8 122,34 150,8" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
      <polygon points="122,34 150,8 178,34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
      <polygon points="150,8 178,34 206,8" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
      <polygon points="178,34 206,8 234,34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
      <polygon points="206,8 234,34 262,8" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
      <polygon points="234,34 262,8 290,34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    </g>
  </g>

  <!-- ==================================================================== -->
  <!-- RIGHT: BIDIRECTIONAL ABSTRACTION & GROUNDING FLOW                    -->
  <!-- ==================================================================== -->
  <g id="flow-panel" transform="translate(685, 25)">
    <!-- Upward Abstraction Flow -->
    <line x1="45" y1="365" x2="45" y2="40" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="45" y="25" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">Abstraction</text>

    <!-- Downward Grounding Flow -->
    <line x1="145" y1="40" x2="145" y2="365" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="145" y="382" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">Grounding</text>
  </g>
</svg>
