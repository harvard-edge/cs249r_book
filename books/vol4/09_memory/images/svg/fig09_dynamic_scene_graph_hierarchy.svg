<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .hdr { font-weight: 700; font-size: 12px; fill: #0f172a; }
      .subhdr { font-size: 9.5px; fill: #64748b; font-weight: 500; }
      .lbl { font-size: 9px; fill: #334155; }
      .lbl-bold { font-weight: 600; font-size: 9.5px; fill: #0f172a; }
      .lbl-muted { font-size: 8px; fill: #64748b; }
      .code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8px; fill: #0f172a; }
      .math { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8px; font-weight: 600; fill: #1e3a8a; }
      .badge-txt { font-size: 7.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
      .node-lbl { font-weight: 700; font-size: 8.5px; }
    </style>

    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr_slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arr_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- LEFT: 5-TIER SCENE GRAPH HIERARCHY                                       -->
  <!-- ========================================================================= -->
  <g transform="translate(12, 12)">
    <!-- Container -->
    <rect x="0" y="0" width="636" height="446" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Top Header Strip -->
    <rect x="0" y="0" width="636" height="34" rx="6" fill="#f1f5f9"/>
    <text x="14" y="16" class="hdr">Hierarchical 3D Dynamic Scene Graph (DSG)</text>
    <text x="14" y="28" class="subhdr">Metric-to-Symbolic Spatial Memory Stack (Kimera / Hydra)</text>

    <!-- TIER 5: GLOBAL MISSION TOPOLOGY -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="616" height="66" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Tier Badge -->
      <rect x="8" y="8" width="56" height="18" rx="2" fill="#1e3a8a"/>
      <text x="36" y="20" class="badge-txt" text-anchor="middle">TIER 5</text>
      <text x="70" y="20" class="lbl-bold">Global Mission Topology</text>
      <text x="495" y="20" class="code" fill="#64748b">Scale: ~100 m | ~15 KB</text>

      <!-- Graph Nodes -->
      <g transform="translate(115, 25)">
        <!-- Node 1: Wing B -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="130" height="32" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
          <circle cx="12" cy="16" r="3.5" fill="#1e3a8a"/>
          <text x="22" y="14" class="node-lbl" fill="#1e3a8a">Floor 2 (Wing B)</text>
          <text x="22" y="25" class="code" font-size="6.8px">ID: bld_02 · 4 Rooms</text>
        </g>

        <!-- Edge -->
        <line x1="130" y1="16" x2="245" y2="16" stroke="#3b82f6" stroke-width="1.5"/>
        <rect x="151" y="8" width="74" height="16" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="0.8"/>
        <text x="188" y="19" class="code" font-size="6.5px" text-anchor="middle">Elevator / Stair</text>

        <!-- Node 2: Logistics Bay -->
        <g transform="translate(245, 0)">
          <rect x="0" y="0" width="130" height="32" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
          <circle cx="12" cy="16" r="3.5" fill="#1e3a8a"/>
          <text x="22" y="14" class="node-lbl" fill="#1e3a8a">Logistics Depot</text>
          <text x="22" y="25" class="code" font-size="6.8px">ID: bld_01 · AMR Dock</text>
        </g>
      </g>
    </g>

    <!-- TIER 4: ROOMS & STRUCTURAL ENCLOSURES -->
    <g transform="translate(10, 112)">
      <rect x="0" y="0" width="616" height="74" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Tier Badge -->
      <rect x="8" y="8" width="56" height="18" rx="2" fill="#4338ca"/>
      <text x="36" y="20" class="badge-txt" text-anchor="middle">TIER 4</text>
      <text x="70" y="20" class="lbl-bold">Structural Rooms &amp; Portals</text>
      <text x="495" y="20" class="code" fill="#64748b">Scale: 5–20 m | ~60 KB</text>

      <!-- Graph Nodes -->
      <g transform="translate(90, 28)">
        <!-- Room 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="105" height="36" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
          <text x="10" y="15" class="node-lbl" fill="#3730a3">Office Kitchen</text>
          <text x="10" y="27" class="code" font-size="7px">Area: 32 m²</text>
        </g>

        <!-- Portal Edge 1-2 -->
        <line x1="105" y1="18" x2="155" y2="18" stroke="#6366f1" stroke-width="1.5"/>
        <rect x="117" y="11" width="26" height="14" rx="2" fill="#ffffff" stroke="#a5b4fc" stroke-width="0.8"/>
        <text x="130" y="21" class="code" font-size="6.5px" text-anchor="middle">Door</text>

        <!-- Room 2 -->
        <g transform="translate(155, 0)">
          <rect x="0" y="0" width="110" height="36" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
          <text x="10" y="15" class="node-lbl" fill="#3730a3">Main Corridor</text>
          <text x="10" y="27" class="code" font-size="7px">Length: 24 m</text>
        </g>

        <!-- Portal Edge 2-3 -->
        <line x1="265" y1="18" x2="315" y2="18" stroke="#6366f1" stroke-width="1.5"/>
        <rect x="277" y="11" width="26" height="14" rx="2" fill="#ffffff" stroke="#a5b4fc" stroke-width="0.8"/>
        <text x="290" y="21" class="code" font-size="6.5px" text-anchor="middle">Door</text>

        <!-- Room 3 -->
        <g transform="translate(315, 0)">
          <rect x="0" y="0" width="105" height="36" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
          <text x="10" y="15" class="node-lbl" fill="#3730a3">Robotics Lab</text>
          <text x="10" y="27" class="code" font-size="7px">Area: 65 m²</text>
        </g>
      </g>
    </g>

    <!-- TIER 3: PLACES & FREESPACE TOPOLOGY -->
    <g transform="translate(10, 192)">
      <rect x="0" y="0" width="616" height="74" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Tier Badge -->
      <rect x="8" y="8" width="56" height="18" rx="2" fill="#0d9488"/>
      <text x="36" y="20" class="badge-txt" text-anchor="middle">TIER 3</text>
      <text x="70" y="20" class="lbl-bold">Places &amp; Voronoi Clearance Spheres</text>
      <text x="495" y="20" class="code" fill="#64748b">Scale: 1–3 m | &lt; 50 μs Query</text>

      <!-- Freespace Path & Spheres -->
      <g transform="translate(105, 24)">
        <!-- Sphere 1 -->
        <circle cx="30" cy="20" r="18" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1" stroke-dasharray="2,2"/>
        <circle cx="30" cy="20" r="3" fill="#0f766e"/>
        <text x="30" y="32" class="code" font-size="6.5px" text-anchor="middle">p_1 (r=0.9m)</text>

        <!-- Navigable Edge -->
        <line x1="30" y1="20" x2="100" y2="20" stroke="#0d9488" stroke-width="1.8"/>

        <!-- Sphere 2 -->
        <circle cx="100" cy="20" r="14" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1" stroke-dasharray="2,2"/>
        <circle cx="100" cy="20" r="3" fill="#0f766e"/>
        <text x="100" y="32" class="code" font-size="6.5px" text-anchor="middle">p_2 (r=0.6m)</text>

        <!-- Navigable Edge -->
        <line x1="100" y1="20" x2="180" y2="20" stroke="#0d9488" stroke-width="1.8"/>

        <!-- Sphere 3 -->
        <circle cx="180" cy="20" r="22" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1" stroke-dasharray="2,2"/>
        <circle cx="180" cy="20" r="3" fill="#0f766e"/>
        <text x="180" y="32" class="code" font-size="6.5px" text-anchor="middle">p_3 (r=1.2m)</text>

        <!-- Navigable Edge -->
        <line x1="180" y1="20" x2="250" y2="20" stroke="#0d9488" stroke-width="1.8"/>

        <!-- Sphere 4 -->
        <circle cx="250" cy="20" r="12" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1" stroke-dasharray="2,2"/>
        <circle cx="250" cy="20" r="3" fill="#0f766e"/>
        <text x="250" y="32" class="code" font-size="6.5px" text-anchor="middle">p_4 (r=0.5m)</text>

        <rect x="285" y="10" width="140" height="22" rx="2" fill="#f0fdfa" stroke="#99f6e4"/>
        <text x="355" y="24" class="code" font-size="7.5px" fill="#0f766e" text-anchor="middle">Freespace Clearance Graph</text>
      </g>
    </g>

    <!-- TIER 2: OBJECT & AGENT NODES -->
    <g transform="translate(10, 272)">
      <rect x="0" y="0" width="616" height="82" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Tier Badge -->
      <rect x="8" y="8" width="56" height="18" rx="2" fill="#d97706"/>
      <text x="36" y="20" class="badge-txt" text-anchor="middle">TIER 2</text>
      <text x="70" y="20" class="lbl-bold">3D Oriented Objects &amp; Agents</text>
      <text x="495" y="20" class="code" fill="#64748b">Scale: 0.1–2 m | 512-D CLIP</text>

      <!-- Object & Agent Cards -->
      <g transform="translate(85, 28)">
        <!-- Object 1: Coffee Mug -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="125" height="46" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
          <text x="8" y="14" class="node-lbl" fill="#b45309">Mug (ID #104)</text>
          <text x="8" y="25" class="code" font-size="7px">[1.42, -0.85, 0.92] m</text>
          <text x="8" y="36" class="code" font-size="7px" fill="#92400e">Affordance: Top Grasp</text>
        </g>

        <!-- Affordance Relation Edge -->
        <line x1="125" y1="23" x2="165" y2="23" stroke="#d97706" stroke-width="1.2" stroke-dasharray="2,2"/>
        <rect x="135" y="14" width="20" height="15" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="0.8"/>
        <text x="145" y="25" class="code" font-size="6.5px" text-anchor="middle">ON</text>

        <!-- Object 2: Table -->
        <g transform="translate(165, 0)">
          <rect x="0" y="0" width="125" height="46" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
          <text x="8" y="14" class="node-lbl" fill="#b45309">Table (ID #88)</text>
          <text x="8" y="25" class="code" font-size="7px">[1.50, -0.80, 0.45] m</text>
          <text x="8" y="36" class="code" font-size="7px" fill="#92400e">Support Surface Plane</text>
        </g>

        <!-- Dynamic Agent: Human -->
        <g transform="translate(310, 0)">
          <rect x="0" y="0" width="140" height="46" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
          <circle cx="16" cy="14" r="3.5" fill="#dc2626"/>
          <text x="24" y="14" class="node-lbl" fill="#b91c1c">Human Agent (ID #3)</text>
          <text x="8" y="27" class="code" font-size="7px">Pos: [2.8, -0.1, 0.0] m</text>
          <text x="8" y="38" class="code" font-size="7px" fill="#b91c1c">Tracked Dynamic Trajectory</text>
        </g>
      </g>
    </g>

    <!-- TIER 1: METRIC-SEMANTIC MESH & TSDF VOXELS -->
    <g transform="translate(10, 360)">
      <rect x="0" y="0" width="616" height="74" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Tier Badge -->
      <rect x="8" y="8" width="56" height="18" rx="2" fill="#475569"/>
      <text x="36" y="20" class="badge-txt" text-anchor="middle">TIER 1</text>
      <text x="70" y="20" class="lbl-bold">Metric Mesh &amp; TSDF Voxel Blocks</text>
      <text x="495" y="20" class="code" fill="#64748b">Scale: 1–5 mm | 45–180 MB</text>

      <g transform="translate(90, 26)">
        <!-- Surface Triangles -->
        <polygon points="10,36 38,10 66,36" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
        <polygon points="38,10 66,36 94,10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8"/>
        <polygon points="66,36 94,10 122,36" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
        <polygon points="94,10 122,36 150,10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8"/>
        
        <text x="160" y="18" class="code" font-size="7.5px">Surface Vertices (x,y,z)</text>
        <text x="160" y="30" class="code" font-size="7.5px">Normals ∇d(x) &amp; Classes</text>

        <!-- TSDF Voxel Hashing Box -->
        <rect x="270" y="4" width="160" height="34" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
        <text x="278" y="16" class="code" font-size="7.5px" font-weight="700">TSDF Voxel Hashing (8³)</text>
        <text x="278" y="28" class="code" font-size="7px">d(x) Distance | w(x) Ray Weight</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: BIDIRECTIONAL SYSTEMS FLOW & STORAGE/LATENCY CONTRACT              -->
  <!-- ========================================================================= -->
  <g transform="translate(658, 12)">
    <rect x="0" y="0" width="250" height="446" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Header Strip -->
    <rect x="0" y="0" width="250" height="32" rx="6" fill="#f1f5f9"/>
    <text x="14" y="21" class="hdr">Spatio-Semantic Flow</text>

    <!-- Upward Abstraction Card -->
    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="230" height="96" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="16" class="lbl-bold" fill="#1e40af">▲ Upward Abstraction</text>
      <text x="10" y="28" class="lbl-muted">Geometry compression for VLA / LLM</text>

      <rect x="8" y="36" width="214" height="20" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="0.8"/>
      <text x="115" y="49" class="code" font-size="7.5px" fill="#1e3a8a" text-anchor="middle">V_mesh → O_bbox → z_sym</text>

      <text x="10" y="70" class="code" font-size="7.5px">85 MB Mesh → 15 KB Graph</text>
      <text x="10" y="82" class="code" font-size="7px" fill="#1e40af">Prevents Edge DRAM bus saturation</text>
    </g>

    <!-- Downward Grounding Card -->
    <g transform="translate(10, 146)">
      <rect x="0" y="0" width="230" height="96" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="16" class="lbl-bold" fill="#166534">▼ Downward Grounding</text>
      <text x="10" y="28" class="lbl-muted">Token realization to physical plant</text>

      <rect x="8" y="36" width="214" height="20" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
      <text x="115" y="49" class="code" font-size="7.5px" fill="#166534" text-anchor="middle">"Grasp mug" → p_target → ∇d(x)</text>

      <text x="10" y="70" class="code" font-size="7.5px">Traverses hierarchy to TSDF</text>
      <text x="10" y="82" class="code" font-size="7px" fill="#15803d">Sub-millimeter Grasp Realization</text>
    </g>

    <!-- Storage & Latency Hierarchy -->
    <g transform="translate(10, 250)">
      <rect x="0" y="0" width="230" height="186" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" class="lbl-bold">Storage &amp; Latency Scaling</text>

      <!-- Tier Breakdown -->
      <g transform="translate(8, 26)">
        <text x="0" y="12" class="code" font-size="7.5px" fill="#1e3a8a">Tier 5: 15 KB  |  2 μs Hash</text>
        <text x="0" y="24" class="code" font-size="7.5px" fill="#4338ca">Tier 4: 60 KB  |  8 μs Portal</text>
        <text x="0" y="36" class="code" font-size="7.5px" fill="#0d9488">Tier 3: 250 KB | 45 μs Voronoi</text>
        <text x="0" y="48" class="code" font-size="7.5px" fill="#d97706">Tier 2: 1.8 MB | 120 μs CLIP</text>
        <text x="0" y="60" class="code" font-size="7.5px" fill="#475569">Tier 1: 85 MB  |  2.5 ms Raycast</text>

        <line x1="0" y1="70" x2="214" y2="70" stroke="#e2e8f0" stroke-width="1"/>

        <!-- Invariants -->
        <text x="0" y="84" class="lbl-bold" font-size="8.5px">Memory Architecture Invariants:</text>
        <text x="4" y="98" class="code" font-size="7.5px">1. Seqlock Shared Memory Ingress</text>
        <text x="4" y="110" class="code" font-size="7.5px">2. Zero-Copy DMA Pointer Passing</text>
        <text x="4" y="122" class="code" font-size="7.5px">3. Epistemic Staleness Decay (τ_age)</text>

        <rect x="0" y="132" width="214" height="18" rx="2" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="107" y="144" class="code" font-size="7px" fill="#059669" text-anchor="middle">Guarantees Edge SoC Real-Time Loop</text>
      </g>
    </g>
  </g>
</svg>
