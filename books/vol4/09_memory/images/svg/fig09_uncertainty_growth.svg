<svg width="800" height="390" viewBox="0 0 800 390" xmlns="http://www.w3.org/2000/svg" style="background-color: #FFFFFF;">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .axis-label { font-size: 12px; font-weight: 600; fill: #334155; }
      .tick-lbl { font-size: 11px; fill: #64748b; }
      .curve-math { font-size: 12.5px; font-weight: 700; fill: #1d4ed8; }
      .limit-math { font-size: 12px; font-weight: 700; fill: #dc2626; }
      .badge-txt { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="800" height="390" fill="#FFFFFF"/>
  <g transform="translate(0, -55)">

  <!-- Grid lines -->
  <line x1="80" y1="295" x2="730" y2="295" stroke="#f1f5f9" stroke-width="1"/>
  <text x="70" y="299" class="tick-lbl" text-anchor="end">0.5</text>
  <line x1="80" y1="225" x2="730" y2="225" stroke="#f1f5f9" stroke-width="1"/>
  <text x="70" y="229" class="tick-lbl" text-anchor="end">1.0</text>
  <line x1="80" y1="155" x2="730" y2="155" stroke="#f1f5f9" stroke-width="1"/>
  <text x="70" y="159" class="tick-lbl" text-anchor="end">1.5</text>
  <line x1="80" y1="85" x2="730" y2="85" stroke="#f1f5f9" stroke-width="1"/>
  <text x="70" y="89" class="tick-lbl" text-anchor="end">2.0</text>

  <!-- Vertical Grid -->
  <line x1="188.33" y1="365" x2="188.33" y2="85" stroke="#f1f5f9" stroke-width="1"/>
  <text x="188.33" y="382" class="tick-lbl" text-anchor="middle">20</text>
  <line x1="296.67" y1="365" x2="296.67" y2="85" stroke="#f1f5f9" stroke-width="1"/>
  <text x="296.67" y="382" class="tick-lbl" text-anchor="middle">40</text>
  <line x1="405.00" y1="365" x2="405.00" y2="85" stroke="#f1f5f9" stroke-width="1"/>
  <text x="405.00" y="382" class="tick-lbl" text-anchor="middle">60</text>
  <line x1="513.33" y1="365" x2="513.33" y2="85" stroke="#f1f5f9" stroke-width="1"/>
  <text x="513.33" y="382" class="tick-lbl" text-anchor="middle">80</text>
  <line x1="621.67" y1="365" x2="621.67" y2="85" stroke="#f1f5f9" stroke-width="1"/>
  <text x="621.67" y="382" class="tick-lbl" text-anchor="middle">100</text>
  <line x1="730.00" y1="365" x2="730.00" y2="85" stroke="#f1f5f9" stroke-width="1"/>
  <text x="730.00" y="382" class="tick-lbl" text-anchor="middle">120</text>

  <!-- Axes -->
  <line x1="80" y1="365" x2="730" y2="365" stroke="#334155" stroke-width="1.4"/>
  <line x1="80" y1="365" x2="80" y2="85" stroke="#334155" stroke-width="1.4"/>
  <text x="405" y="398" class="axis-label" text-anchor="middle">Time Since Last Measurement (ms)</text>
  <text x="24" y="225" class="axis-label" text-anchor="middle" transform="rotate(-90 24 225)">Spatial Error Bound E(t) (mm)</text>

  <!-- Task Clearance Threshold Line -->
  <line x1="80" y1="225" x2="730" y2="225" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="720" y="216" class="limit-math" text-anchor="end">Task Clearance (E_max = 1.0 mm)</text>

  <!-- Error Area and Curve -->
  <polygon points="80,365 80,351 188.33,316 296.67,278 405,238 437.5,225 513.33,194 621.67,148 730,99 730,365" fill="#dbeafe" fill-opacity="0.4"/>
  <polyline points="80,351 188.33,316 296.67,278 405,238 437.5,225 513.33,194 621.67,148 730,99" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="110" y="190" class="curve-math">E(t) = E(0) + 3σ_v t + ½ a_dist t²</text>

  <!-- Invalidation Horizon Marker at 66 ms -->
  <line x1="437.5" y1="365" x2="437.5" y2="225" stroke="#dc2626" stroke-width="2"/>
  <circle cx="437.5" cy="225" r="5.5" fill="#dc2626"/>
  <rect x="445" y="315" width="135" height="32" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="452" y="329" class="limit-math">t_exp = 66 ms</text>
  <text x="452" y="341" font-size="9.5px" fill="#991b1b">(Invalidation Horizon)</text>

  <!-- Bottom Safety Regime Bar -->
  <g transform="translate(80, 408)">
    <rect x="0" y="0" width="178.75" height="22" rx="3" fill="#16a34a"/>
    <text x="89.37" y="15" class="badge-txt" text-anchor="middle">VALID</text>

    <rect x="182.75" y="0" width="170.75" height="22" rx="3" fill="#d97706"/>
    <text x="268.12" y="15" class="badge-txt" text-anchor="middle">DEGRADED</text>

    <rect x="357.5" y="0" width="292.5" height="22" rx="3" fill="#dc2626"/>
    <text x="503.75" y="15" class="badge-txt" text-anchor="middle">EXPIRED (SAFE STOP TRIGGERED)</text>
  </g>
  </g>
</svg>
