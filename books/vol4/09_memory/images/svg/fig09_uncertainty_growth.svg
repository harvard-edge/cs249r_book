<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="760" height="380" fill="#FFFFFF"/>

  <!-- Error Area Fill (Drawn in background so it never obscures labels or lines) -->
  <path d="M 80 290 L 80 278 Q 230 240 410 170 Q 550 110 680 62 L 680 290 Z" fill="#EFF6FF" fill-opacity="0.5"/>

  <!-- Grid Lines -->
  <!-- Horizontal Grid -->
  <line x1="80" y1="230" x2="680" y2="230" stroke="#F1F5F9" stroke-width="1"/>
  <text x="70" y="234" font-size="10" fill="#64748B" text-anchor="end">0.5</text>

  <line x1="80" y1="170" x2="680" y2="170" stroke="#F1F5F9" stroke-width="1"/>
  <text x="70" y="174" font-size="10" fill="#64748B" text-anchor="end">1.0</text>

  <line x1="80" y1="110" x2="680" y2="110" stroke="#F1F5F9" stroke-width="1"/>
  <text x="70" y="114" font-size="10" fill="#64748B" text-anchor="end">1.5</text>

  <line x1="80" y1="50" x2="680" y2="50" stroke="#F1F5F9" stroke-width="1"/>
  <text x="70" y="54" font-size="10" fill="#64748B" text-anchor="end">2.0</text>

  <!-- Vertical Grid -->
  <line x1="180" y1="290" x2="180" y2="50" stroke="#F1F5F9" stroke-width="1"/>
  <text x="180" y="306" font-size="10" fill="#64748B" text-anchor="middle">20</text>

  <line x1="280" y1="290" x2="280" y2="50" stroke="#F1F5F9" stroke-width="1"/>
  <text x="280" y="306" font-size="10" fill="#64748B" text-anchor="middle">40</text>

  <line x1="380" y1="290" x2="380" y2="50" stroke="#F1F5F9" stroke-width="1"/>
  <text x="380" y="306" font-size="10" fill="#64748B" text-anchor="middle">60</text>

  <line x1="480" y1="290" x2="480" y2="50" stroke="#F1F5F9" stroke-width="1"/>
  <text x="480" y="306" font-size="10" fill="#64748B" text-anchor="middle">80</text>

  <line x1="580" y1="290" x2="580" y2="50" stroke="#F1F5F9" stroke-width="1"/>
  <text x="580" y="306" font-size="10" fill="#64748B" text-anchor="middle">100</text>

  <line x1="680" y1="290" x2="680" y2="50" stroke="#F1F5F9" stroke-width="1"/>
  <text x="680" y="306" font-size="10" fill="#64748B" text-anchor="middle">120</text>

  <!-- Coordinate Axes -->
  <line x1="80" y1="290" x2="690" y2="290" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <line x1="80" y1="290" x2="80" y2="40" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  
  <!-- Axis Labels -->
  <text x="380" y="322" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Elapsed Time Δt (ms)</text>
  <text x="24" y="170" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 24 170)">Spatial Error Bound E(Δt) (mm)</text>

  <!-- Task Clearance Threshold Line -->
  <line x1="80" y1="170" x2="680" y2="170" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="670" y="158" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="end">Clearance E_max</text>

  <!-- Error Growth Curve -->
  <path d="M 80 278 Q 230 240 410 170 Q 550 110 680 62" fill="none" stroke="#2563EB" stroke-width="2.2"/>
  <text x="240" y="210" font-size="11" font-weight="700" fill="#2563EB">E(Δt)</text>

  <!-- Invalidation Horizon Intersection -->
  <line x1="410" y1="290" x2="410" y2="170" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="410" cy="170" r="4.5" fill="#DC2626"/>

  <!-- Horizon Callout -->
  <text x="410" y="142" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">t_exp = 66 ms</text>

  <!-- Operational Regime Timeline Bar -->
  <g id="regime-bar" transform="translate(80, 338)">
    <!-- Valid Interval (0 to 40 ms) -->
    <rect x="0" y="0" width="200" height="20" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="100" y="14" font-size="9.5" font-weight="600" fill="#166534" text-anchor="middle">Valid</text>

    <!-- Degraded Interval (40 to 66 ms) -->
    <rect x="200" y="0" width="130" height="20" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
    <text x="265" y="14" font-size="9.5" font-weight="600" fill="#92400E" text-anchor="middle">Degraded</text>

    <!-- Expired Interval (66 to 120 ms) -->
    <rect x="330" y="0" width="270" height="20" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="465" y="14" font-size="9.5" font-weight="600" fill="#991B1B" text-anchor="middle">Expired</text>
  </g>
</svg>
