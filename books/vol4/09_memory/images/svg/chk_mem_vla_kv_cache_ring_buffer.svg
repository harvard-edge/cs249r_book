<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-green2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3d9e5a"/>
    </marker>
    <marker id="arr-gray2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header Banner -->
  <text x="18" y="19" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.3">VLA STREAMING RING-BUFFER ATTENTION ARCHITECTURE</text>
  <rect x="372" y="7" width="150" height="16" rx="8" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="447" y="18" font-size="8" font-weight="700" fill="#1e3a8a" text-anchor="middle">CAPPED: M_KV,max = 258 MB</text>

  <!-- Upper Container: KV-Cache Token Register Partitioning -->
  <rect x="18" y="26" width="504" height="78" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="26" y="37" font-size="7.5" font-weight="700" fill="#64748b" letter-spacing="0.4">KV-CACHE PARTITIONING (BOUNDED CEILING: L_max = N_sink + W = 516 TOKENS)</text>

  <!-- Compartment 1: Attention Sinks -->
  <rect x="26" y="44" width="92" height="36" rx="3" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
  <rect x="30" y="47" width="84" height="11" rx="5.5" fill="#4a90c4"/>
  <text x="72" y="55.5" font-size="6.8" font-weight="700" fill="#ffffff" text-anchor="middle">PINNED SINKS (N_sink = 4)</text>
  
  <rect x="32" y="61" width="17" height="14" rx="2" fill="#ffffff" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="40.5" y="71" font-size="7" font-weight="700" fill="#1e3a8a" text-anchor="middle">t₁</text>
  <rect x="52" y="61" width="17" height="14" rx="2" fill="#ffffff" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="60.5" y="71" font-size="7" font-weight="700" fill="#1e3a8a" text-anchor="middle">t₂</text>
  <rect x="72" y="61" width="17" height="14" rx="2" fill="#ffffff" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="80.5" y="71" font-size="7" font-weight="700" fill="#1e3a8a" text-anchor="middle">t₃</text>
  <rect x="92" y="61" width="17" height="14" rx="2" fill="#ffffff" stroke="#4a90c4" stroke-width="0.75"/>
  <text x="100.5" y="71" font-size="7" font-weight="700" fill="#1e3a8a" text-anchor="middle">t₄</text>
  <text x="72" y="93" font-size="7" font-weight="700" fill="#1e3a8a" text-anchor="middle">Anchors Softmax</text>

  <!-- Compartment 2: Evicted History -->
  <rect x="124" y="44" width="94" height="36" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="3,3"/>
  <rect x="128" y="47" width="86" height="11" rx="5.5" fill="#94a3b8"/>
  <text x="171" y="55.5" font-size="6.8" font-weight="700" fill="#ffffff" text-anchor="middle">EVICTION ZONE (FIFO)</text>
  
  <rect x="130" y="61" width="18" height="14" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,2"/>
  <text x="139" y="71" font-size="6.5" fill="#94a3b8" text-anchor="middle">t₅</text>
  <text x="156" y="71" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">•••</text>
  <rect x="164" y="61" width="22" height="14" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,2"/>
  <text x="175" y="71" font-size="6.5" fill="#94a3b8" text-anchor="middle">t_old</text>
  <line x1="198" y1="62" x2="198" y2="74" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray2)"/>
  <text x="171" y="93" font-size="7" font-weight="600" fill="#64748b" text-anchor="middle">Evicts Stale History</text>

  <!-- Compartment 3: Rolling Observation Window -->
  <rect x="224" y="44" width="290" height="36" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <rect x="230" y="47" width="138" height="11" rx="5.5" fill="#3d9e5a"/>
  <text x="299" y="55.5" font-size="6.8" font-weight="700" fill="#ffffff" text-anchor="middle">ROLLING BUFFER (W = 512 TOKENS)</text>
  <text x="506" y="55.5" font-size="6.8" font-weight="700" fill="#14532d" text-anchor="end">20 Hz Sensor Stream</text>

  <!-- Rolling Tokens Queue -->
  <rect x="232" y="61" width="34" height="14" rx="2" fill="#ffffff" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="249" y="71" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">t_k-511</text>
  <text x="274" y="71" font-size="7" font-weight="700" fill="#3d9e5a" text-anchor="middle">•••</text>
  <rect x="282" y="61" width="26" height="14" rx="2" fill="#ffffff" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="295" y="71" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">t_k-2</text>
  <rect x="312" y="61" width="26" height="14" rx="2" fill="#ffffff" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="325" y="71" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">t_k-1</text>
  <rect x="342" y="61" width="36" height="14" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="360" y="71" font-size="6.5" font-weight="700" fill="#14532d" text-anchor="middle">t_k (now)</text>
  
  <line x1="486" y1="68" x2="386" y2="68" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arr-green2)"/>
  <text x="436" y="64" font-size="6.8" font-weight="700" fill="#14532d" text-anchor="middle">Fresh Ingress (100 tok/s)</text>
  <text x="369" y="93" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">Rolling Observation Horizon (~15 s Sensory-Motor Execution Window)</text>

  <!-- Lower Split Cards -->
  <!-- Left: Naive Unconstrained -->
  <rect x="18" y="110" width="246" height="62" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="28" y="123" font-size="8.5" font-weight="700" fill="#7f1d1d">UNCONSTRAINED KV-CACHE</text>
  <rect x="194" y="113" width="62" height="13" rx="6.5" fill="#c44"/>
  <text x="225" y="122.5" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">OOM CLIFF</text>
  <text x="28" y="136" font-size="8" font-weight="700" fill="#7f1d1d">• Ingestion: 100 tok/s  ⟹  ΔM = 51.2 MB/s DRAM leak</text>
  <text x="28" y="148" font-size="8" fill="#7f1d1d">• 4 GB cache budget exhausted in t_OOM = 80.0 s (1.3 min)</text>
  <text x="28" y="160" font-size="7.5" font-weight="700" fill="#7f1d1d">• O(L²) attention latency starves 1 kHz motor control loops</text>

  <!-- Right: Streaming Ring Buffer -->
  <rect x="276" y="110" width="246" height="62" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="286" y="123" font-size="8.5" font-weight="700" fill="#14532d">STREAMING RING BUFFER</text>
  <rect x="444" y="113" width="70" height="13" rx="6.5" fill="#3d9e5a"/>
  <text x="479" y="122.5" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">STABLE 258 MB</text>
  <text x="286" y="136" font-size="8" font-weight="700" fill="#14532d">• Pinned sinks (N_sink = 4) prevent softmax score collapse</text>
  <text x="286" y="148" font-size="8" fill="#14532d">• Memory ceiling: 258 MB (&lt;6.5% of DRAM, 15.9× reduction)</text>
  <text x="286" y="160" font-size="7.5" font-weight="700" fill="#14532d">• Guaranteed runtime: O(L · W) bounded latency indefinitely</text>
</svg>