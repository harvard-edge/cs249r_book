<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="540" height="190" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="18" y="22" font-size="12" font-weight="700" fill="#0f172a">KV cache: capacity and evidence horizon</text>
  <rect x="18" y="34" width="114" height="50" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="75" y="55" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">4 sink tokens</text>
  <text x="75" y="70" font-size="8" fill="#1e3a8a" text-anchor="middle">attention anchor</text>
  <rect x="141" y="34" width="100" height="50" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="191" y="55" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Evicted</text>
  <text x="191" y="70" font-size="8" fill="#475569" text-anchor="middle">older tokens</text>
  <rect x="250" y="34" width="272" height="50" rx="5" fill="#dcfce7" stroke="#4ade80"/>
  <text x="386" y="54" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">512 recent tokens</text>
  <text x="386" y="71" font-size="8.5" fill="#14532d" text-anchor="middle">5.12 s at 100 tokens/s</text>
  <rect x="18" y="96" width="246" height="65" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="28" y="114" font-size="9.5" font-weight="700" fill="#991b1b">Uncapped cache</text>
  <text x="28" y="132" font-size="8.5" fill="#7f1d1d">52.4 MB/s at the assumed token rate</text>
  <text x="28" y="148" font-size="8.5" fill="#7f1d1d">4.29 GB budget fills in 81.92 s</text>
  <rect x="276" y="96" width="246" height="65" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="286" y="114" font-size="9.5" font-weight="700" fill="#166534">Bounded cache</text>
  <text x="286" y="132" font-size="8.5" fill="#14532d">516 tokens use about 270.5 MB</text>
  <text x="286" y="148" font-size="8.5" fill="#14532d">Per-token attention: O(516)</text>
  <text x="18" y="180" font-size="9" fill="#334155">Sink tokens do not preserve task meaning; keep spatial and task state separately.</text>
</svg>
