<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -6 710 336" width="710" height="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="-10" y="-6" width="710" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#007A87"/></marker>
  </defs>

  <!-- ===== (a) sensing and tracking ===== -->
  <g transform="translate(12,12)">
    <text x="0" y="12" font-size="10.5" font-weight="700" fill="#1A202C">(a) Sensing and tracking</text>
    <rect x="0" y="28" width="150" height="104" rx="3" fill="#E6F4F5" stroke="#007A87" stroke-width="1.2"/>
    <text x="75" y="46" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">RGB-D stream</text>
    <!-- RGB frame -->
    <rect x="12" y="56" width="58" height="62" rx="0" fill="#ffffff" stroke="#007A87" stroke-width="1"/>
    <path d="M 14 114 L 30 92 L 44 104 L 56 88 L 68 114 Z" fill="#B3DCE0"/>
    <circle cx="26" cy="72" r="5" fill="#B3DCE0"/>
    <!-- depth frame -->
    <rect x="80" y="56" width="58" height="62" rx="0" fill="#4A5568" stroke="#1A202C" stroke-width="1"/>
    <circle cx="109" cy="87" r="16" fill="#718096"/>
    <circle cx="109" cy="87" r="7" fill="#A0AEC0"/>
    <line x1="75" y1="132" x2="75" y2="170" stroke="#4A5568" stroke-width="1.3" marker-end="url(#arr-slate)"/>
    <rect x="0" y="174" width="150" height="64" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
    <text x="75" y="198" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">pose tracking</text>
    <text x="75" y="222" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">T<tspan font-size="7.5" dy="3">WC</tspan></text>
  </g>

  <!-- a -> b -->
  <path d="M 162 218 L 174 218 L 174 160 L 188 160" fill="none" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-petrol)"/>

  <!-- ===== (b) Gaussian scene ===== -->
  <g transform="translate(190,12)">
    <text x="0" y="12" font-size="10.5" font-weight="700" fill="#1A202C">(b) Gaussian scene memory</text>
    <rect x="0" y="28" width="280" height="276" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="12" y="40" width="256" height="30" rx="3" fill="#ffffff" stroke="#007A87" stroke-width="1"/>
    <text x="140" y="59" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">3D Gaussians G(x):  μ, Σ, α, SH</text>
    <!-- splat field -->
    <rect x="12" y="80" width="256" height="160" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="28" y1="216" x2="252" y2="216" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(76,160) rotate(-20)">
      <ellipse cx="0" cy="0" rx="38" ry="17" fill="#007A87" fill-opacity="0.18" stroke="#007A87" stroke-width="1"/>
      <line x1="-38" y1="0" x2="38" y2="0" stroke="#007A87" stroke-width="0.7"/>
      <line x1="0" y1="-17" x2="0" y2="17" stroke="#007A87" stroke-width="0.7"/>
    </g>
    <circle cx="76" cy="160" r="2.5" fill="#1A202C"/>
    <text x="62" y="196" font-size="9" font-weight="700" fill="#1A202C">μ<tspan font-size="7" dy="2">1</tspan></text>
    <g transform="translate(152,128) rotate(35)">
      <ellipse cx="0" cy="0" rx="40" ry="18" fill="#007A87" fill-opacity="0.26" stroke="#007A87" stroke-width="1"/>
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#007A87" stroke-width="0.7"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#007A87" stroke-width="0.7"/>
    </g>
    <circle cx="152" cy="128" r="2.5" fill="#1A202C"/>
    <text x="170" y="104" font-size="9" font-weight="700" fill="#1A202C">μ<tspan font-size="7" dy="2">2</tspan></text>
    <text x="118" y="150" font-size="9" fill="#4A5568">Σ<tspan font-size="7" dy="2">1</tspan></text>
    <g transform="translate(222,176) rotate(-12)">
      <ellipse cx="0" cy="0" rx="30" ry="13" fill="#007A87" fill-opacity="0.12" stroke="#007A87" stroke-width="1"/>
    </g>
    <circle cx="222" cy="176" r="2.5" fill="#1A202C"/>
    <rect x="12" y="250" width="256" height="42" rx="3" fill="#ffffff" stroke="#4A5568" stroke-width="1"/>
    <text x="140" y="268" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">adaptive density control</text>
    <text x="140" y="283" font-size="8.5" fill="#4A5568" text-anchor="middle">split, clone, prune</text>
  </g>

  <!-- b -> c branches -->
  <line x1="470" y1="100" x2="508" y2="100" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-petrol)"/>
  <text x="489" y="92" font-size="8.5" font-weight="700" fill="#007A87" text-anchor="middle">rasterize</text>
  <line x1="470" y1="236" x2="508" y2="236" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="489" y="228" font-size="8.5" font-weight="700" fill="#4A5568" text-anchor="middle">convert</text>

  <!-- ===== (c) two uses ===== -->
  <g transform="translate(510,12)">
    <text x="0" y="12" font-size="10.5" font-weight="700" fill="#1A202C">(c) Two different uses</text>
    <rect x="0" y="58" width="158" height="60" rx="3" fill="#E6F4F5" stroke="#007A87" stroke-width="1.2"/>
    <text x="79" y="84" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">novel-view rendering</text>
    <text x="79" y="101" font-size="8.5" fill="#4A5568" text-anchor="middle">visual output</text>

    <rect x="0" y="194" width="158" height="60" rx="3" fill="#ffffff" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="79" y="216" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">candidate occupancy</text>
    <text x="79" y="231" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">or distance field</text>
    <text x="79" y="246" font-size="8.5" fill="#4A5568" text-anchor="middle">not yet validated</text>

    <line x1="79" y1="254" x2="79" y2="274" stroke="#1A4D3E" stroke-width="1.4" stroke-dasharray="3,2"/>
    <rect x="10" y="274" width="138" height="30" rx="0" fill="#EEF4F2" stroke="#1A4D3E" stroke-width="1.2"/>
    <text x="79" y="293" font-size="9" font-weight="700" fill="#1A4D3E" text-anchor="middle">error bound, then clearance</text>
  </g>
</svg>
