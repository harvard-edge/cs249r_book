<svg xmlns="http://www.w3.org/2000/svg" viewBox="22.9 3.7 929.3 372.5" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-23.6" y="-14.9" width="1022.2" height="409.8" fill="#ffffff"/>
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>

    <!-- Gaussian Splat Gradients -->
    <radialGradient id="splat-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="splat-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="splat-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean Background -->
  <rect width="960" height="380" fill="#FFFFFF"/>

  <!-- Sub-Figure Headers -->
  <text x="135" y="32" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(a) Ingestion &amp; Tracking</text>
  <text x="470" y="32" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(b) 3DGS Spatial Memory</text>
  <text x="825" y="32" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(c) Distinct Uses</text>

  <!-- Vertical Divider Guidelines -->
  <line x1="250" y1="20" x2="250" y2="360" stroke="#F1F5F9" stroke-width="1.2"/>
  <line x1="690" y1="20" x2="690" y2="360" stroke="#F1F5F9" stroke-width="1.2"/>

  <!-- ==================================================================== -->
  <!-- (a) INGESTION & TRACKING                                              -->
  <!-- ==================================================================== -->
  <g id="stage-a" transform="translate(25, 55)">
    <!-- Sensor Feed Capsule -->
    <rect x="15" y="15" width="180" height="105" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="105" y="38" font-size="11" font-weight="700" fill="#1E40AF" text-anchor="middle">Sensor Stream</text>
    
    <!-- Mini RGB & Depth Frames -->
    <rect x="27" y="48" width="70" height="52" rx="3" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1"/>
    <circle cx="45" cy="65" r="5" fill="#FBBF24"/>
    <path d="M 28 92 L 48 74 L 64 86 L 82 70 L 96 92 Z" fill="#93C5FD"/>

    <rect x="113" y="48" width="70" height="52" rx="3" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <circle cx="148" cy="74" r="14" fill="#334155"/>
    <circle cx="148" cy="74" r="6" fill="#64748B"/>

    <!-- Downward arrow to Odometry -->
    <line x1="105" y1="120" x2="105" y2="165" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-slate)"/>

    <!-- Pose Tracking Capsule -->
    <rect x="15" y="168" width="180" height="75" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="105" y="198" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Pose Tracking</text>
    <text x="105" y="222" font-family="'Menlo', 'Courier New', monospace" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">T_W_C</text>
  </g>

  <!-- Flow Arrow from (a) to (b) -->
  <path d="M 230 205 L 275 205" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ==================================================================== -->
  <!-- (b) CONTINUOUS 3D GAUSSIAN MEMORY                                    -->
  <!-- ==================================================================== -->
  <g id="stage-b" transform="translate(285, 55)">
    <!-- Outer Stage Capsule -->
    <rect x="0" y="15" width="370" height="275" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Formulation Capsule -->
    <rect x="12" y="27" width="346" height="34" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="185" y="49" font-family="'Menlo', 'Courier New', monospace" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">
      Surfels G(x)
    </text>

    <!-- Visual Splats Field (Dark Canvas) -->
    <rect x="12" y="70" width="346" height="155" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    
    <!-- Grid Reference Lines -->
    <line x1="30" y1="190" x2="335" y2="190" stroke="#1E293B" stroke-width="1"/>
    <line x1="80" y1="210" x2="180" y2="95" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="180" y1="95" x2="330" y2="95" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Splat 1: Blue -->
    <g transform="translate(95, 140) rotate(-20)">
      <ellipse cx="0" cy="0" rx="42" ry="20" fill="url(#splat-blue)"/>
      <line x1="-42" y1="0" x2="42" y2="0" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.8"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.8"/>
    </g>
    <circle cx="95" cy="140" r="2.5" fill="#FFFFFF"/>
    <text x="75" y="172" font-family="'Menlo', 'Courier New', monospace" font-size="9" font-weight="600" fill="#93C5FD">μ₁</text>

    <!-- Splat 2: Green -->
    <g transform="translate(195, 125) rotate(35)">
      <ellipse cx="0" cy="0" rx="48" ry="22" fill="url(#splat-green)"/>
      <line x1="-48" y1="0" x2="48" y2="0" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.8"/>
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.8"/>
    </g>
    <circle cx="195" cy="125" r="2.5" fill="#FFFFFF"/>
    <text x="212" y="105" font-family="'Menlo', 'Courier New', monospace" font-size="9" font-weight="600" fill="#6EE7B7">μ₂</text>

    <!-- Splat 3: Amber -->
    <g transform="translate(290, 150) rotate(-15)">
      <ellipse cx="0" cy="0" rx="36" ry="16" fill="url(#splat-amber)"/>
    </g>
    <circle cx="290" cy="150" r="2.5" fill="#FFFFFF"/>

    <!-- Adaptive Density Control Pill -->
    <rect x="12" y="235" width="346" height="42" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="185" y="261" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Adaptive Density Control</text>
  </g>

  <!-- Flow Arrows from (b) to (c) -->
  <!-- Upper Branch: Rasterize -->
  <path d="M 655 125 L 705 125" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="680" y="117" font-size="8.5" font-weight="600" fill="#D97706" text-anchor="middle">Rasterize</text>

  <!-- Lower Branch: checked geometry conversion -->
  <path d="M 655 260 L 705 260" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-rose)"/>
  <text x="680" y="252" font-family="'Menlo', 'Courier New', monospace" font-size="8.5" font-weight="600" fill="#DC2626" text-anchor="middle">Convert</text>

  <!-- ==================================================================== -->
  <!-- (c) EMBODIED DUAL HANDOFF                                            -->
  <!-- ==================================================================== -->
  <g id="stage-c" transform="translate(715, 55)">
    <!-- Path A: Deliberative Planning -->
    <rect x="0" y="75" width="220" height="75" rx="4" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="110" y="104" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">Deliberative Planning</text>
    <text x="110" y="126" font-size="9.5" font-weight="600" fill="#B45309" text-anchor="middle">Novel Views</text>

    <!-- Path B: clearance requires separate validation -->
    <rect x="0" y="210" width="220" height="75" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="110" y="239" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">Validated Geometry</text>
    <text x="110" y="261" font-size="9.5" font-weight="600" fill="#DC2626" text-anchor="middle">Occupancy / ESDF → Permission</text>
  </g>
</svg>
