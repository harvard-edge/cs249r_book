<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3d9e5a"/>
    </marker>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header Banner -->
  <text x="18" y="19" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.3">HARDWARE ACQUISITION EPOCH VS. PUBLICATION TIMESTAMP</text>
  <rect x="366" y="7" width="156" height="16" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="444" y="18" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">v = 0.60 m/s  |  PTP δt = ±1.5 ms</text>

  <!-- Upper Container: Pipeline Execution Timeline -->
  <rect x="18" y="26" width="504" height="78" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="26" y="37" font-size="7.5" font-weight="700" fill="#64748b" letter-spacing="0.4">SENSOR TRANSDUCTION TO ACTUATION TIMELINE</text>

  <!-- Time axis line -->
  <line x1="36" y1="60" x2="492" y2="60" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-dark)"/>
  <text x="496" y="63" font-size="8.5" font-weight="600" font-style="italic" fill="#64748b">t</text>

  <!-- Epoch t0 -->
  <rect x="26" y="42" width="52" height="13" rx="6.5" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="52" y="51.5" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">t₀ = 0 ms</text>
  <line x1="52" y1="56" x2="52" y2="64" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="52" y="72" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">Sensor PHY</text>
  <text x="52" y="80" font-size="6.8" fill="#64748b" text-anchor="middle">Photons Latch</text>

  <!-- Pipeline Block 1: NPU Compute -->
  <rect x="88" y="49" width="140" height="22" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
  <text x="158" y="59.5" font-size="7.8" font-weight="700" fill="#78350f" text-anchor="middle">NPU Inference (45 ms)</text>
  <text x="158" y="67.5" font-size="6.8" fill="#78350f" text-anchor="middle">Compute runs; physical world drifts</text>

  <!-- Epoch test -->
  <rect x="236" y="42" width="56" height="13" rx="6.5" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
  <text x="264" y="51.5" font-size="7.5" font-weight="700" fill="#78350f" text-anchor="middle">t_est = 45 ms</text>
  <line x1="264" y1="56" x2="264" y2="64" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="264" y="72" font-size="7.5" font-weight="600" fill="#78350f" text-anchor="middle">Inference End</text>
  <text x="264" y="80" font-size="6.8" fill="#64748b" text-anchor="middle">State Resolved</text>

  <!-- Pipeline Block 2: Transport -->
  <rect x="298" y="49" width="62" height="22" rx="3" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75"/>
  <text x="329" y="59.5" font-size="7.5" font-weight="700" fill="#581c87" text-anchor="middle">Transport (5 ms)</text>
  <text x="329" y="67.5" font-size="6.8" fill="#581c87" text-anchor="middle">OS &amp; Bus</text>

  <!-- Epoch tpub -->
  <rect x="366" y="42" width="56" height="13" rx="6.5" fill="#e8daf8" stroke="#8e44ad" stroke-width="0.75"/>
  <text x="394" y="51.5" font-size="7.5" font-weight="700" fill="#581c87" text-anchor="middle">t_pub = 50 ms</text>
  <line x1="394" y1="56" x2="394" y2="64" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="394" y="72" font-size="7.5" font-weight="600" fill="#581c87" text-anchor="middle">Bus Commit</text>
  <text x="394" y="80" font-size="6.8" fill="#64748b" text-anchor="middle">Msg Dispatched</text>

  <!-- Epoch tact -->
  <rect x="432" y="42" width="56" height="13" rx="6.5" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="460" y="51.5" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">t_now = 52 ms</text>
  <line x1="460" y1="56" x2="460" y2="64" stroke="#c44" stroke-width="1.5"/>
  <text x="460" y="72" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Actuation</text>
  <text x="460" y="80" font-size="6.8" fill="#c44" text-anchor="middle">Reads State</text>

  <!-- Software Delta Bracket -->
  <path d="M 394 38 L 394 35 L 460 35 L 460 38" fill="none" stroke="#3d9e5a" stroke-width="1"/>
  <text x="427" y="32" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">Δt_sw = 2 ms</text>

  <!-- Physical Age Bracket -->
  <path d="M 52 85 L 52 88 L 460 88 L 460 85" fill="none" stroke="#c44" stroke-width="1"/>
  <text x="256" y="97" font-size="7.2" font-weight="700" fill="#c44" text-anchor="middle">True Physical Age: Δt_phys = 52 ms  |  Hidden Displacement Δx = v · Δt = 31.2 mm</text>

  <!-- Lower Split Cards -->
  <!-- Left: Software View -->
  <rect x="18" y="110" width="246" height="62" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
  <text x="28" y="123" font-size="8.5" font-weight="700" fill="#334155">SOFTWARE VIEW (STAMPED AT t_pub)</text>
  <rect x="194" y="113" width="62" height="13" rx="6.5" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="225" y="122.5" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">APPARENT: 2 ms</text>
  <text x="28" y="136" font-size="8" fill="#334155">• Evaluates data age: Δt = t_now - t_pub = 2.0 ms</text>
  <text x="28" y="148" font-size="8" fill="#334155">• Controller assumes target at x₀ (reported 0.0 mm)</text>
  <text x="28" y="160" font-size="7.5" font-weight="600" fill="#b45309">• Passes freshness gate (τ &lt; 5 ms) despite massive drift</text>

  <!-- Right: Physical Reality -->
  <rect x="276" y="110" width="246" height="62" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="286" y="123" font-size="8.5" font-weight="700" fill="#7f1d1d">PHYSICAL GROUND TRUTH (t₀)</text>
  <rect x="444" y="113" width="70" height="13" rx="6.5" fill="#c44"/>
  <text x="479" y="122.5" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">DRIFT: 31.2 mm</text>
  <text x="286" y="136" font-size="8" font-weight="700" fill="#7f1d1d">• True physical age: Δt_phys = t_now - t₀ = 52.0 ms</text>
  <text x="286" y="148" font-size="8" fill="#7f1d1d">• Displacement: Δx = v · Δt = (0.6 m/s)(52 ms) = 31.2 mm</text>
  <text x="286" y="160" font-size="7.5" font-weight="700" fill="#7f1d1d">• PTP jitter (±1.5 ms) adds ±1.8 mm (vs ±0.5 mm budget)</text>
</svg>