<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="760" height="440" fill="#FFFFFF"/>

  <!-- Ground Plane Guideline -->
  <line x1="120" y1="360" x2="660" y2="360" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- ==================================================================== -->
  <!-- 1. GHOST ARM: REPORTED STATE (t0)                                     -->
  <!-- ==================================================================== -->
  <g id="reported-state">
    <!-- Ghost Link -->
    <line x1="220" y1="360" x2="220" y2="90" stroke="#CBD5E1" stroke-width="6" stroke-dasharray="6,4"/>
    <!-- Base Pivot -->
    <circle cx="220" cy="360" r="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <!-- Tool Point -->
    <circle cx="220" cy="90" r="6" fill="#94A3B8"/>
    <!-- Label -->
    <text x="220" y="392" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">Reported State (t₀)</text>
  </g>

  <!-- ==================================================================== -->
  <!-- 2. TRANSLATION-ONLY REFERENCE LINE                                    -->
  <!-- ==================================================================== -->
  <line x1="330" y1="360" x2="330" y2="90" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="330" cy="90" r="4" fill="#CBD5E1"/>

  <!-- Base Translation Vector (e_trans) -->
  <line x1="225" y1="360" x2="322" y2="360" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="275" y="348" font-size="9.5" font-weight="600" fill="#2563EB" text-anchor="middle">e_trans = v · Δt</text>

  <!-- ==================================================================== -->
  <!-- 3. TRUE PHYSICAL ARM: TRANSLATED + ROTATED (t0 + Δt)                 -->
  <!-- ==================================================================== -->
  <g id="physical-state">
    <!-- True Link (Length l = 270 px, Angle ~ 18 deg from vertical) -->
    <!-- cos(18°) = 0.951 -> 257 px dy, sin(18°) = 0.309 -> 83 px dx -->
    <!-- Tool point at (330 + 85, 360 - 257) = (415, 103) -->
    <line x1="330" y1="360" x2="415" y2="103" stroke="#1E3A8A" stroke-width="7"/>
    <!-- Base Pivot -->
    <circle cx="330" cy="360" r="10" fill="#1E3A8A" stroke="#38BDF8" stroke-width="2"/>
    <!-- Tool Center Point -->
    <circle cx="415" cy="103" r="6" fill="#DC2626"/>
    <text x="330" y="392" font-size="10" font-weight="700" fill="#1E3A8A" text-anchor="middle">Physical State (t₀ + Δt)</text>

    <!-- Link Length ℓ Annotation -->
    <text x="390" y="235" font-size="10" font-weight="600" fill="#1E3A8A">ℓ</text>
  </g>

  <!-- ==================================================================== -->
  <!-- 4. ANGULAR DEFLECTION & DISPLACEMENT ARCS                             -->
  <!-- ==================================================================== -->
  <!-- Angular Arc at Joint -->
  <path d="M 330 280 A 80 80 0 0 1 355 284" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="365" y="278" font-size="9.5" font-weight="600" fill="#2563EB">Δθ = ω · Δt</text>

  <!-- Rotational Displacement Arc at Tool Level -->
  <path d="M 330 90 A 270 270 0 0 1 411 101" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-slate)"/>
  <text x="375" y="80" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">e_rot ≈ ℓ · Δθ</text>

  <!-- Total Tool Displacement Vector (e_tool) -->
  <line x1="224" y1="90" x2="407" y2="102" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="315" y="115" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">e_tool ≈ e_trans + ℓ · Δθ</text>

  <!-- ==================================================================== -->
  <!-- 5. TASK CLEARANCE ENVELOPE                                           -->
  <!-- ==================================================================== -->
  <!-- Target Center Reference -->
  <circle cx="220" cy="90" r="18" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="188" y="70" font-size="8.5" font-weight="600" fill="#059669" text-anchor="end">Clearance ±ε_tol</text>
</svg>
