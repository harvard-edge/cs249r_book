<svg width="800" height="520" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" style="background-color: #FFFFFF;">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 13.5px; fill: #0f172a; }
      .subtext { font-size: 11px; fill: #475569; }
      .math-lbl { font-size: 11.5px; font-weight: 600; fill: #1e293b; }
      .state-lbl { font-size: 12px; font-weight: 700; }
      .danger-lbl { font-size: 11.5px; font-weight: 700; fill: #dc2626; }
    </style>
    <marker id="arrow_slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Parameter Card Top-Left -->
  <rect x="30" y="24" width="210" height="74" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="42" y="45" class="title">Kinematic Parameters</text>
  <text x="42" y="63" class="subtext">Linear velocity v = 0.80 m/s</text>
  <text x="42" y="79" class="subtext">Angular rate ω = 1.50 rad/s, Δt = 40 ms</text>

  <!-- Ghost Arm at t = 0 (Reported State) -->
  <line x1="280" y1="410" x2="280" y2="110" stroke="#e2e8f0" stroke-width="8" stroke-dasharray="8,5"/>
  <circle cx="280" cy="410" r="12" fill="#e2e8f0"/>
  <circle cx="280" cy="110" r="8" fill="#e2e8f0"/>

  <!-- Translation-only Intermediate Pose -->
  <line x1="380" y1="410" x2="380" y2="110" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="4,4"/>
  <circle cx="380" cy="110" r="7" fill="#e2e8f0"/>

  <!-- True Arm at t = 40 ms -->
  <line x1="380" y1="410" x2="468.66" y2="123.40" stroke="#1e3a8a" stroke-width="8"/>
  <circle cx="380" cy="410" r="12" fill="#1e3a8a"/>
  <circle cx="468.66" cy="123.40" r="8" fill="#1e3a8a"/>
  <text x="445" y="265" class="math-lbl" fill="#1e3a8a">ℓ = 0.60 m</text>

  <!-- Angular Drift Arc -->
  <path d="M 380 330 A 80 80 0 0 1 403.64 333.57" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow_blue)"/>
  <text x="412" y="322" class="math-lbl" fill="#2563eb">Δθ = ω Δt (3.44°)</text>

  <!-- Workpiece Target -->
  <rect x="250" y="82" width="60" height="16" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="280" y="94" font-size="9.5px" font-weight="600" fill="#334155" text-anchor="middle">Target</text>

  <!-- Translational Error Dimension (Bottom) -->
  <line x1="280" y1="440" x2="372" y2="440" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow_blue)"/>
  <text x="330" y="460" class="math-lbl" fill="#2563eb" text-anchor="middle">e_trans = v Δt = 3.20 cm</text>

  <!-- Rotational Error Dimension Arc (Top) -->
  <path d="M 380 90 A 320 320 0 0 1 464 103" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow_slate)"/>
  <text x="490" y="94" class="math-lbl" fill="#334155">e_rot ≈ ℓ Δθ = 3.60 cm</text>

  <!-- Total Error Red Line -->
  <line x1="280" y1="110" x2="440" y2="118" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow_red)"/>

  <!-- Total Error Callout Card -->
  <rect x="245" y="128" width="185" height="24" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="337" y="144" class="danger-lbl" text-anchor="middle">Total Error: e_tool = 6.80 cm</text>

  <!-- Collision Circle Zone -->
  <circle cx="468.66" cy="123.40" r="26" fill="#fee2e2" fill-opacity="0.6" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="505" y="128" class="danger-lbl">Collision Breach</text>

  <!-- Bottom State Labels -->
  <text x="280" y="485" class="state-lbl" fill="#64748b" text-anchor="middle">t = 0 (Reported State)</text>
  <text x="380" y="505" class="state-lbl" fill="#1e3a8a" text-anchor="middle">t = 40 ms (True Physical State)</text>
</svg>
