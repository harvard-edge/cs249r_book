    - Insulation aging
  claims:
    Five-budget admission: Before torque reaches a winding the permission path must find non-negative margin in
      all five physical budgets at once (observation age, stopping distance, deliverable torque, winding temperature,
      supply), because one budget's slack never pays another's deficit.
    Measurement freshness deadline: An observation's age runs from physical transduction to actuator torque onset
      and must stay under the freshness deadline E_max / v_max set by the target's speed and the spatial tolerance,
      with inference only one of many stages.
    Velocity ceiling: The defended stopping distance v*tau + v^2/(2a) + localization and margin allowances must
      fit the clear distance, solved on the permission path as a clearance-dependent speed ceiling whose credible
      deceleration is the minimum of independently owned ceilings.
    Delivered torque ceiling: A torque command is a current that winding inductance and voltage headroom pace and
      the inverter current limit caps, and a drive can clamp current silently while acknowledging packets, so the
      safety path must read measured current.
    Gear ratio trade: A reduction N multiplies torque by N but reflects rotor inertia by N^2, so acceleration peaks
      at the inertia-matching ratio and, for a fixed motor and gear, holding heat times reflected inertia does not
      depend on N.
    Thermal duty limits: Copper loss grows with torque squared, so continuous torque is set by installed heat rejection
      rather than catalog peak, and a burst spends a stock of heat margin that thermal history has already drawn
      down.
    Shared-rail power integrity: Compute and drives share one DC bus whose impedance turns a coincident current
      step into droop toward converter lockout while a regenerative stop pumps energy back, so the permission rail
      is isolated and held up and every unpowered state is specified.
    Limit record: A physical limit governs an admission decision only as a six-element record (value, conditions,
      uncertainty, margin, runtime detector, provenance with evidence category), and uncertainty about the measurement
      is distinct from margin held in reserve.
    Reflected rotor inertia: Rotor inertia appears at the joint output multiplied by the square of the gear ratio,
      which dominates the effective inertia of a highly geared joint and its impact mass.
    Credible deceleration: The deceleration a stop may assume is the minimum of the brake's capability, the traction
      limit mu*g, and the drive's torque limit, each owned and evidenced separately.
    Virtual spring-damper: Impedance control makes a joint answer position error with the restoring force of a programmed
      spring and damper, which bounds contact force through stiffness rather than through position accuracy.
    Four boundary events: Capture, dispatch, admission, and onset are the four timestamped events that divide every
      capture-to-torque interval into budgetable stages.
    Evidence categories: Every physical value carries one of five evidence categories (measured, derived, datasheet,
      illustrative, chosen), which decides how far an admission decision may rely on it.
    Transmission compliance and backlash: Gear compliance and backlash put lost motion and limit cycles between
      motor and load, so measured motor position is not the load's position.
    Insulation aging: Winding insulation ages as an Arrhenius exchange of time at temperature, so the engineering
      thermal ceiling sits below the insulation class and depends on duty history, not only on peak.
