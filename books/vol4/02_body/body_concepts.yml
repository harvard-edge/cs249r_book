    - id: vol4.field.plant-supply--authority-actuation
      source: vol4.plant.supply
      predicate: supports independent
      target: vol4.authority.actuation
      explanation: A reset or gate-driver loss can turn a supply fault into uncontrolled mechanical behavior,
        so a permission processor needs a qualified power path.
      conditions: The energized plant response depends on gate-driver states, stored energy, braking hardware,
        and the qualified unpowered-state design.
      status: draft
      evidence:
        section: sec-body-unpowered-states
        quote: A brownout reset turns the electrical fault into a mechanical one. Voltage supervisors pull
          the reset line on microcontrollers and gate drivers, clocks halt, register configurations vanish,
          and communication buses float. An acceleration command issued just before the reset stays physically
          active until the gate-driver stage collapses. If the driver then floats, phase current ceases,
          torque falls to zero, and the body coasts under gravity and inertia into workpieces or hardstops.
          If it instead shorts the low-side switches for dynamic braking, back-EMF ($\BackEmfVoltage = \MotorBackEmfConstant
          \RotorAngularSpeed$) produces an immediate, abrupt counter-torque that jerks the mechanics at
          the joint limits.
