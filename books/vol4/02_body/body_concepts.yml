  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.plant.braking
      label: Braking authority
      teaches: Credible deceleration
      summary: The credible deceleration the loaded plant can deliver under declared traction, actuator,
        supply, and thermal conditions.
      section: sec-body-kinetic-momentum
    - id: vol4.plant.thermal
      label: Thermal headroom
      teaches: Thermal duty limits
      summary: Remaining temperature margin before an actuator or brake must reduce its qualified output
        or duty; the relevant heat path depends on the mechanism.
      section: sec-body-thermal-capacity
    - id: vol4.plant.supply
      label: Supply integrity
      teaches: Shared-rail power integrity
      summary: The ability of the electrical supply to maintain valid operating voltage during coupled load
        transients.
      section: sec-body-power-integrity
    relationships:
    - id: vol4.field.plant-braking--stopping-distance
      source: vol4.plant.braking
      predicate: limits achievable
      target: vol4.stopping.distance
      explanation: Credible deceleration and pre-brake age jointly determine how much clearance a loaded
        base needs.
      conditions: Use the qualified payload, speed, floor, actuator, and thermal state; commanded deceleration
        is not a delivered bound.
      status: draft
      evidence:
        section: sec-body-kinetic-momentum
        quote: Once the selected braking mechanism engages, the system enters the active braking phase.
          Mechanical work done by the retarding braking force $\BrakingForce$ over the physical braking
          distance\index{Braking distance} $\BrakingDistance$ must dissipate the machine's stored kinetic
          energy, $\MechanicalWork = \FiniteChange \KineticEnergy$. How that retarding force arises depends
          on the physical hardware. A powered motor stop requires functioning drive inverters, sufficient
          bus-voltage headroom, and a circuit capable of absorbing or dissipating returned electrical power.
          A mechanical brake, by contrast, operates independently of electrical power but carries distinct
          engagement latencies and thermal dissipation limits. In any safety certification, the credible
          deceleration must reflect the specific mechanism available during the fault scenario under analysis.
    - id: vol4.field.plant-thermal--plant-braking
      source: vol4.plant.thermal
      predicate: constrains delivered
      target: vol4.plant.braking
      explanation: The selected brake must dissipate energy within its thermal limits; available braking
        is a property of that qualified mechanism and state.
      conditions: The link is a plant-limit dependency, not a universal numerical braking derating law;
        measure available braking across the declared thermal envelope.
      status: draft
      evidence:
        section: sec-body-kinetic-momentum
        quote: Once the selected braking mechanism engages, the system enters the active braking phase.
          Mechanical work done by the retarding braking force $\BrakingForce$ over the physical braking
          distance\index{Braking distance} $\BrakingDistance$ must dissipate the machine's stored kinetic
          energy, $\MechanicalWork = \FiniteChange \KineticEnergy$. How that retarding force arises depends
          on the physical hardware. A powered motor stop requires functioning drive inverters, sufficient
