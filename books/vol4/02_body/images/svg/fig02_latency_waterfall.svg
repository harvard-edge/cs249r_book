<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #1F407A; }
      .label { font-family: sans-serif; font-size: 14px; fill: #2D3748; }
      .axis { stroke: #2D3748; stroke-width: 2; }
      .bar { fill: #1F407A; }
      .bar-red { fill: #A51C30; }
      .bar-bg { fill: #E2E8F0; }
      .grid { stroke: #E2E8F0; stroke-width: 1; }
      .annotation { font-family: sans-serif; font-size: 12px; fill: #A51C30; font-weight: bold; }
    </style>
  </defs>

  <!-- Title -->
  <text x="50" y="40" class="title">Sense-to-Actuation Latency Waterfall</text>

  <!-- Axes -->
  <line x1="150" y1="80" x2="150" y2="480" class="axis" />
  <line x1="150" y1="480" x2="900" y2="480" class="axis" />

  <!-- Grid lines -->
  <line x1="300" y1="80" x2="300" y2="480" class="grid" />
  <line x1="450" y1="80" x2="450" y2="480" class="grid" />
  <line x1="600" y1="80" x2="600" y2="480" class="grid" />
  <line x1="750" y1="80" x2="750" y2="480" class="grid" />
  <line x1="900" y1="80" x2="900" y2="480" class="grid" />

  <!-- X-Axis Labels -->
  <text x="150" y="500" class="label" text-anchor="middle">0 ms</text>
  <text x="300" y="500" class="label" text-anchor="middle">20 ms</text>
  <text x="450" y="500" class="label" text-anchor="middle">40 ms</text>
  <text x="600" y="500" class="label" text-anchor="middle">60 ms</text>
  <text x="750" y="500" class="label" text-anchor="middle">80 ms</text>

  <!-- Freshness Deadline -->
  <line x1="450" y1="80" x2="450" y2="480" stroke="#A51C30" stroke-width="2" stroke-dasharray="5,5" />
  <text x="455" y="75" class="annotation">Freshness Deadline (40.0 ms)</text>

  <!-- Waterfall Bars -->
  <!-- 1. Photonic Exposure (0 - 11.2) -->
  <text x="140" y="115" class="label" text-anchor="end">1. Photonic Exposure</text>
  <rect x="150" y="100" width="84" height="20" class="bar" />
  <text x="240" y="115" class="label">11.2 ms</text>

  <!-- 2. DMA Transport (11.2 - 12.6) -->
  <text x="140" y="155" class="label" text-anchor="end">2. DMA Transport</text>
  <rect x="234" y="140" width="10.5" height="20" class="bar" />
  <text x="250" y="155" class="label">1.4 ms</text>

  <!-- 3. Policy Inference (12.6 - 31.1) -->
  <text x="140" y="195" class="label" text-anchor="end">3. Policy Inference</text>
  <rect x="244.5" y="180" width="138.75" height="20" class="bar" />
  <text x="390" y="195" class="label">18.5 ms</text>

  <!-- 4. OS Scheduling (31.1 - 31.7) -->
  <text x="140" y="235" class="label" text-anchor="end">4. OS Scheduling</text>
  <rect x="383.25" y="220" width="4.5" height="20" class="bar" />
  <text x="393" y="235" class="label">0.6 ms</text>

  <!-- 5. Fieldbus Trans. (31.7 - 32.7) -->
  <text x="140" y="275" class="label" text-anchor="end">5. Fieldbus Trans.</text>
  <rect x="387.75" y="260" width="7.5" height="20" class="bar" />
  <text x="400" y="275" class="label">1.0 ms</text>

  <!-- 6. Stator Current (32.7 - 35.0) -->
  <text x="140" y="315" class="label" text-anchor="end">6. Stator Current Rise</text>
  <rect x="395.25" y="300" width="17.25" height="20" class="bar" />
  <text x="420" y="315" class="label">2.3 ms</text>

  <!-- Cumulative P50 -->
  <text x="140" y="375" class="label" text-anchor="end" font-weight="bold">Nominal (P50)</text>
  <rect x="150" y="360" width="262.5" height="20" class="bar-bg" />
  <rect x="150" y="360" width="262.5" height="20" fill="none" stroke="#1F407A" stroke-width="2" />
  <text x="420" y="375" class="label" font-weight="bold">35.0 ms (Pass)</text>

  <!-- Cumulative P99.9 -->
  <text x="140" y="415" class="label" text-anchor="end" font-weight="bold">Tail Spike (P99.9)</text>
  <rect x="150" y="400" width="513" height="20" class="bar-red" fill-opacity="0.2" />
  <rect x="150" y="400" width="513" height="20" fill="none" stroke="#A51C30" stroke-width="2" />
  <text x="670" y="415" class="annotation">68.4 ms (Fail)</text>

</svg>
