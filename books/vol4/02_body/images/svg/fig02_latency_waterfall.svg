<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1F407A; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #2D3748; }
      .label-bold { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #2D3748; }
      .axis { stroke: #2D3748; stroke-width: 1.5; }
      .bar { fill: #1F407A; }
      .grid { stroke: #E2E8F0; stroke-width: 1; }
      .annotation { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #A51C30; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#FFFFFF"/>
  <g transform="translate(0, -40)">

  <!-- Axes -->
  <line x1="150" y1="80" x2="150" y2="470" class="axis" />
  <line x1="150" y1="470" x2="900" y2="470" class="axis" />

  <!-- Grid lines -->
  <line x1="300" y1="80" x2="300" y2="470" class="grid" />
  <line x1="450" y1="80" x2="450" y2="470" class="grid" />
  <line x1="600" y1="80" x2="600" y2="470" class="grid" />
  <line x1="750" y1="80" x2="750" y2="470" class="grid" />
  <line x1="900" y1="80" x2="900" y2="470" class="grid" />

  <!-- X-Axis Ticks & Labels -->
  <line x1="150" y1="470" x2="150" y2="476" stroke="#2D3748" stroke-width="1.5" />
  <text x="150" y="495" class="label" text-anchor="middle">0 ms</text>
  
  <line x1="300" y1="470" x2="300" y2="476" stroke="#2D3748" stroke-width="1.5" />
  <text x="300" y="495" class="label" text-anchor="middle">20 ms</text>
  
  <line x1="450" y1="470" x2="450" y2="476" stroke="#A51C30" stroke-width="1.5" />
  <text x="450" y="495" class="annotation" text-anchor="middle">40 ms</text>
  
  <line x1="600" y1="470" x2="600" y2="476" stroke="#2D3748" stroke-width="1.5" />
  <text x="600" y="495" class="label" text-anchor="middle">60 ms</text>
  
  <line x1="750" y1="470" x2="750" y2="476" stroke="#2D3748" stroke-width="1.5" />
  <text x="750" y="495" class="label" text-anchor="middle">80 ms</text>

  <line x1="900" y1="470" x2="900" y2="476" stroke="#2D3748" stroke-width="1.5" />
  <text x="900" y="495" class="label" text-anchor="middle">100 ms</text>

  <!-- Freshness Deadline -->
  <line x1="450" y1="80" x2="450" y2="470" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="450" y="70" class="annotation" text-anchor="middle">Freshness Deadline (40.0 ms)</text>

  <!-- Waterfall Bars -->
  <!-- 1. Photonic Exposure (0 - 11.2) -->
  <text x="140" y="115" class="label" text-anchor="end">1. Photonic Exposure</text>
  <rect x="150" y="100" width="84" height="20" rx="2" class="bar" />
  <text x="242" y="115" class="label">11.2 ms</text>

  <!-- 2. DMA Transport (11.2 - 12.6) -->
  <text x="140" y="155" class="label" text-anchor="end">2. DMA Transport</text>
  <rect x="234" y="140" width="10.5" height="20" rx="1" class="bar" />
  <text x="252" y="155" class="label">1.4 ms</text>

  <!-- 3. Policy Inference (12.6 - 31.1) -->
  <text x="140" y="195" class="label" text-anchor="end">3. Policy Inference</text>
  <rect x="244.5" y="180" width="138.75" height="20" rx="2" class="bar" />
  <text x="391" y="195" class="label">18.5 ms</text>

  <!-- 4. OS Scheduling (31.1 - 31.7) -->
  <text x="140" y="235" class="label" text-anchor="end">4. OS Scheduling</text>
  <rect x="383.25" y="220" width="4.5" height="20" rx="1" class="bar" />
  <text x="395" y="235" class="label">0.6 ms</text>

  <!-- 5. Fieldbus Trans. (31.7 - 32.7) -->
  <text x="140" y="275" class="label" text-anchor="end">5. Fieldbus Trans.</text>
  <rect x="387.75" y="260" width="7.5" height="20" rx="1" class="bar" />
  <text x="402" y="275" class="label">1.0 ms</text>

  <!-- 6. Stator Current (32.7 - 35.0) -->
  <text x="140" y="315" class="label" text-anchor="end">6. Stator Current Rise</text>
  <rect x="395.25" y="300" width="17.25" height="20" rx="2" class="bar" />
  <text x="387" y="315" class="label" text-anchor="end">2.3 ms</text>

  <!-- Cumulative P50 -->
  <text x="140" y="375" class="label-bold" text-anchor="end">Nominal (P50)</text>
  <rect x="150" y="358" width="262.5" height="24" rx="3" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.5" />
  <text x="402" y="375" class="label-bold" fill="#1F407A" text-anchor="end">35.0 ms (Pass)</text>

  <!-- Cumulative P99.9 -->
  <text x="140" y="420" class="label-bold" text-anchor="end">Tail Spike (P99.9)</text>
  <rect x="150" y="403" width="513" height="24" rx="3" fill="#FEE2E2" fill-opacity="0.5" stroke="#A51C30" stroke-width="1.5" />
  <text x="672" y="420" class="annotation">68.4 ms (Fail)</text>
</g>
</svg>
