<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 176" width="160" height="176"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="160" height="176" fill="#FFFFFF"/>
  <!-- Sustained resistive screen only; no transient minimum is inferred. -->
  <text x="80" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Sustained-load screen</text>
  <text x="80" y="29" text-anchor="middle" font-size="8.5" fill="#475569">Resistive drop: 4.2 V in both cases</text>

  <!-- Shared voltage scale: x = 18 + 14 (V - 16). -->
  <line x1="46" y1="54" x2="46" y2="124" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="12" y="49" font-size="9" font-weight="600" fill="#334155">Full charge: 24 → 19.8 V</text>
  <rect x="71.2" y="58" width="58.8" height="10" fill="#F8FAFC" stroke="#334155" stroke-width="1"/>

  <rect x="10" y="80" width="140" height="17" fill="#FFFFFF"/>
  <text x="12" y="93" font-size="9" font-weight="600" fill="#334155">Depleted: 21.5 → 17.3 V</text>
  <rect x="36.2" y="102" width="58.8" height="10" fill="#F8FAFC" stroke="#334155" stroke-width="1"/>
  <rect x="36.2" y="102" width="9.8" height="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>

  <!-- Dropout divides the sustained rail-voltage intervals. -->
  <line x1="18" y1="124" x2="130" y2="124" stroke="#475569" stroke-width="0.8"/>
  <line x1="18" y1="121" x2="18" y2="127" stroke="#475569" stroke-width="0.8"/>
  <line x1="130" y1="121" x2="130" y2="127" stroke="#475569" stroke-width="0.8"/>
  <text x="18" y="137" text-anchor="middle" font-size="8" fill="#475569">16 V</text>
  <text x="46" y="137" text-anchor="middle" font-size="8" fill="#991B1B">18 V</text>
  <text x="46" y="148" text-anchor="middle" font-size="8" fill="#991B1B">dropout</text>
  <text x="130" y="137" text-anchor="middle" font-size="8" fill="#475569">24 V</text>
  <text x="80" y="168" text-anchor="middle" font-size="8" fill="#475569">Transient minimum unqualified</text>
</svg>
