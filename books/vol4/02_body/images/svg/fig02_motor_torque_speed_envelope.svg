<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1F407A; }
      .axis-title { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #2D3748; }
      .axis-label { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .data-label { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #2D3748; }
      .callout-navy { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1F407A; }
      .callout-red { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #A51C30; }
      .axis-line { stroke: #2D3748; stroke-width: 1.5; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; }
      .limit-navy { stroke: #1F407A; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .limit-red { stroke: #A51C30; stroke-width: 1.5; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="#FFFFFF"/>

  <!-- ==================== PANEL A: TORQUE-SPEED ENVELOPE ==================== -->
  <text x="60" y="42" class="title">(A) Torque-Speed Operating Envelope</text>
  
  <!-- Axes -->
  <line x1="140" y1="90" x2="140" y2="470" class="axis-line" />
  <line x1="140" y1="470" x2="540" y2="470" class="axis-line" />
  <text x="65" y="280" class="axis-title" text-anchor="middle" transform="rotate(-90 65,280)">Torque (N·m)</text>
  <text x="340" y="525" class="axis-title" text-anchor="middle">Speed (rad/s)</text>

  <!-- S1 Continuous Region -->
  <path d="M 140 470 L 140 330 L 320 330 L 480 470 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
  
  <!-- S3 Intermittent Region -->
  <path d="M 140 330 L 140 150 L 320 150 C 370 150 400 230 420 330 Z" fill="#FEE2E2" fill-opacity="0.4" stroke="#A51C30" stroke-width="1.2" stroke-dasharray="4,4" />

  <!-- Torque Limit Horizontal Lines -->
  <!-- Peak Inverter Limit -->
  <line x1="140" y1="150" x2="320" y2="150" stroke="#1F407A" stroke-width="2" />
  <line x1="320" y1="150" x2="500" y2="150" class="limit-navy" />
  <rect x="145" y="125" width="168" height="20" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
  <text x="148" y="139" class="callout-navy" font-size="10.5px">Peak Torque (Inverter Limit)</text>

  <!-- Continuous Thermal Limit -->
  <line x1="140" y1="330" x2="320" y2="330" stroke="#1F407A" stroke-width="2" />
  <line x1="320" y1="330" x2="420" y2="330" class="limit-navy" />
  <rect x="145" y="305" width="168" height="20" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
  <text x="148" y="319" class="callout-navy" font-size="10.5px">Continuous Torque (Thermal)</text>

  <!-- Base Speed Vertical Line -->
  <line x1="320" y1="150" x2="320" y2="470" class="limit-navy" stroke="#475569" />
  <line x1="320" y1="470" x2="320" y2="477" stroke="#2D3748" stroke-width="1.5" />
  <text x="320" y="492" class="axis-label" text-anchor="middle" font-weight="bold">Base Speed (ω_base)</text>

  <!-- Clean Floating Callout Cards (positioned left of x=320 to guarantee zero collision with vertical line) -->
  <!-- S3 Intermittent Card -->
  <rect x="160" y="215" width="135" height="46" rx="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#FCA5A5" stroke-width="1"/>
  <text x="227" y="233" class="callout-red" text-anchor="middle">S3 Intermittent</text>
  <text x="227" y="249" class="data-label" text-anchor="middle">Peak Acceleration Duty</text>

  <!-- S1 Continuous Card -->
  <rect x="160" y="380" width="135" height="46" rx="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#CBD5E1" stroke-width="1"/>
  <text x="227" y="398" class="callout-navy" text-anchor="middle">S1 Continuous</text>
  <text x="227" y="414" class="data-label" text-anchor="middle">Thermal Equilibrium</text>


  <!-- ==================== PANEL B: CYCLIC THERMAL DUTY DYNAMICS ==================== -->
  <text x="640" y="42" class="title">(B) Cyclic Thermal Duty Dynamics (Temperature vs Time)</text>
  
  <!-- Axes -->
  <line x1="720" y1="90" x2="720" y2="470" class="axis-line" />
  <line x1="720" y1="470" x2="1160" y2="470" class="axis-line" />
  <text x="600" y="280" class="axis-title" text-anchor="middle" transform="rotate(-90 600,280)">Winding Temp (°C)</text>
  <text x="940" y="555" class="axis-title" text-anchor="middle">Time (s)</text>
  
  <!-- Ambient temp grid & label outside plot to the left -->
  <line x1="720" y1="420" x2="1150" y2="420" class="grid-line" />
  <line x1="714" y1="420" x2="720" y2="420" stroke="#94A3B8" stroke-width="1.5" />
  <text x="708" y="424" class="axis-label" text-anchor="end">Ambient (T_amb)</text>
  
  <!-- Max Insulation Limit line & label outside plot to the left -->
  <line x1="720" y1="150" x2="1150" y2="150" class="limit-red" />
  <line x1="714" y1="150" x2="720" y2="150" stroke="#A51C30" stroke-width="1.5" />
  <text x="708" y="154" class="callout-red" text-anchor="end">Insulation Limit (T_max)</text>

  <!-- Cycle 1 Curve: Burst Heat Up then Cool Down -->
  <!-- Heat up: starts at (720, 420), rises steep to (800, 130) exceeding T_max -->
  <path d="M 720 420 Q 770 420 785 240 T 800 130" fill="none" stroke="#A51C30" stroke-width="2.5" />
  <!-- Cool down: recovers from (800, 130) exponentially down to (950, 400) -->
  <path d="M 800 130 Q 840 360 950 400" fill="none" stroke="#1F407A" stroke-width="2" />
  
  <!-- Cycle 2 Curve -->
  <path d="M 950 400 Q 1000 400 1015 220 T 1030 120" fill="none" stroke="#A51C30" stroke-width="2.5" />
  <path d="M 1030 120 Q 1070 360 1150 395" fill="none" stroke="#1F407A" stroke-width="2" />

  <!-- Thermal Excursion Badges -->
  <rect x="765" y="100" width="70" height="20" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
  <text x="800" y="114" class="callout-red" font-size="10px" text-anchor="middle">Excursion 1</text>

  <rect x="995" y="90" width="70" height="20" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
  <text x="1030" y="104" class="callout-red" font-size="10px" text-anchor="middle">Excursion 2</text>

  <!-- Time Brackets below x-axis -->
  <!-- Burst Bracket: 720 to 800 -->
  <path d="M 720 480 L 720 490 L 800 490 L 800 480" fill="none" stroke="#2D3748" stroke-width="1.5" />
  <text x="760" y="506" class="data-label" font-weight="bold" text-anchor="middle">Burst (t_on)</text>
  <text x="760" y="520" class="axis-label" text-anchor="middle">High I²R Heating</text>

  <!-- Recovery Bracket: 800 to 950 -->
  <path d="M 800 480 L 800 490 L 950 490 L 950 480" fill="none" stroke="#2D3748" stroke-width="1.5" />
  <text x="875" y="506" class="data-label" font-weight="bold" text-anchor="middle">Recovery (t_off)</text>
  <text x="875" y="520" class="axis-label" text-anchor="middle">Thermal Dissipation</text>

  <!-- Legend for Panel B Curves -->
  <line x1="970" y1="486" x2="990" y2="486" stroke="#A51C30" stroke-width="2.5" />
  <text x="996" y="490" class="axis-label">Active Heating Phase</text>
  <line x1="970" y1="506" x2="990" y2="506" stroke="#1F407A" stroke-width="2" />
  <text x="996" y="510" class="axis-label">Cooling Dissipation Phase</text>
</svg>
