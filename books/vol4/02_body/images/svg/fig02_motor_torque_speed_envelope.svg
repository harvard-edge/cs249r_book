<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .tick-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .tick-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; }
      .region-s1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1D4ED8; }
      .region-s3 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #B91C1C; }
      .limit-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #DC2626; }
      .bracket-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #475569; }
      .axis-line { stroke: #334155; stroke-width: 1.5; stroke-linecap: round; }
      .guideline { stroke: #94A3B8; stroke-width: 1; stroke-dasharray: 4,4; }
      .guideline-red { stroke: #DC2626; stroke-width: 1.2; stroke-dasharray: 4,4; }
      .subtle-line { stroke: #CBD5E1; stroke-width: 1; stroke-dasharray: 3,3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="520" fill="#FFFFFF"/>

  <!-- ==================== PANEL A: TORQUE-SPEED OPERATING ENVELOPE ==================== -->
  <text x="110" y="55" class="panel-title">(a) Torque-Speed Operating Envelope</text>

  <!-- Shaded Operating Regions -->
  <!-- S1 Continuous Region -->
  <path d="M 110 430 L 110 300 L 310 300 C 370 320 425 375 470 430 Z"
        fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- S3 Intermittent Region (between Continuous curve and Peak curve) -->
  <path d="M 110 300 L 110 170 L 270 170 C 335 175 395 240 440 330 C 455 365 465 398 470 430 C 425 375 370 320 310 300 Z"
        fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,4" stroke-linejoin="round"/>

  <!-- Region Text Labels -->
  <text x="210" y="375" class="region-s1" text-anchor="middle">S1 Continuous</text>
  <text x="210" y="245" class="region-s3" text-anchor="middle">S3 Intermittent</text>

  <!-- Dashed Guidelines & Ticks for Key Thresholds -->
  <!-- Peak Torque Guideline -->
  <line x1="110" y1="170" x2="270" y2="170" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="105" y1="170" x2="110" y2="170" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="174" class="tick-bold" text-anchor="end" fill="#DC2626">τ<tspan font-size="9.5" dy="2">peak</tspan></text>

  <!-- Continuous Torque Guideline -->
  <line x1="110" y1="300" x2="310" y2="300" class="guideline"/>
  <line x1="105" y1="300" x2="110" y2="300" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="304" class="tick-bold" text-anchor="end" fill="#1D4ED8">τ<tspan font-size="9.5" dy="2">cont</tspan></text>

  <!-- Base Speed Guideline -->
  <line x1="310" y1="300" x2="310" y2="430" class="guideline"/>
  <line x1="310" y1="430" x2="310" y2="436" stroke="#334155" stroke-width="1.5"/>
  <text x="310" y="454" class="tick-label" text-anchor="middle">ω<tspan font-size="9.5" dy="2">base</tspan></text>

  <!-- Max Speed Tick -->
  <line x1="470" y1="430" x2="470" y2="436" stroke="#334155" stroke-width="1.5"/>
  <text x="470" y="454" class="tick-label" text-anchor="middle">ω<tspan font-size="9.5" dy="2">max</tspan></text>

  <!-- Axes -->
  <line x1="110" y1="430" x2="110" y2="110" class="axis-line" marker-end="url(#arrow)"/>
  <line x1="110" y1="430" x2="520" y2="430" class="axis-line" marker-end="url(#arrow)"/>

  <!-- Axis Titles -->
  <text x="45" y="270" class="axis-label" text-anchor="middle" transform="rotate(-90 45,270)">Torque, τ</text>
  <text x="310" y="488" class="axis-label" text-anchor="middle">Speed, ω</text>


  <!-- ==================== PANEL B: CYCLIC THERMAL DYNAMICS ==================== -->
  <text x="690" y="55" class="panel-title">(b) Cyclic Thermal Dynamics</text>

  <!-- Reference Threshold Lines -->
  <!-- T_max (Insulation limit) -->
  <line x1="690" y1="170" x2="1110" y2="170" class="guideline-red"/>
  <line x1="685" y1="170" x2="690" y2="170" stroke="#DC2626" stroke-width="1.5"/>
  <text x="680" y="174" class="limit-label" text-anchor="end">T<tspan font-size="9.5" dy="2">max</tspan></text>
  <text x="1115" y="174" class="limit-label" text-anchor="start">T<tspan font-size="9.5" dy="2">max</tspan><tspan font-size="12" dy="-2" dx="5">(Limit)</tspan></text>

  <!-- T_amb (Ambient baseline) -->
  <line x1="690" y1="390" x2="1110" y2="390" class="subtle-line"/>
  <line x1="685" y1="390" x2="690" y2="390" stroke="#334155" stroke-width="1.5"/>
  <text x="680" y="394" class="tick-label" text-anchor="end">T<tspan font-size="9.5" dy="2">amb</tspan></text>

  <!-- Temperature Trajectory Curves (2 Cycles) -->
  <!-- Cycle 1: Burst heating -->
  <path d="M 690 390 C 720 380, 755 240, 770 172" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Cycle 1: Conductive cooling recovery -->
  <path d="M 770 172 C 805 285, 855 365, 910 380" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Cycle 2: Burst heating -->
  <path d="M 910 380 C 935 370, 970 240, 985 172" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Cycle 2: Conductive cooling recovery -->
  <path d="M 985 172 C 1020 285, 1070 365, 1110 380" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Time Brackets below X-Axis -->
  <!-- t_on (Burst): 690 to 770 -->
  <path d="M 690 442 v 6 h 80 v -6" fill="none" stroke="#64748B" stroke-width="1.2"/>
  <text x="730" y="464" class="bracket-label" text-anchor="middle">t<tspan font-size="8.5" dy="2">on</tspan><tspan font-size="11.5" dy="-2" dx="4">(Burst)</tspan></text>

  <!-- t_off (Recovery): 770 to 910 -->
  <path d="M 770 442 v 6 h 140 v -6" fill="none" stroke="#64748B" stroke-width="1.2"/>
  <text x="840" y="464" class="bracket-label" text-anchor="middle">t<tspan font-size="8.5" dy="2">off</tspan><tspan font-size="11.5" dy="-2" dx="4">(Recovery)</tspan></text>

  <!-- Axes -->
  <line x1="690" y1="430" x2="690" y2="110" class="axis-line" marker-end="url(#arrow)"/>
  <line x1="690" y1="430" x2="1130" y2="430" class="axis-line" marker-end="url(#arrow)"/>

  <!-- Axis Titles -->
  <text x="625" y="270" class="axis-label" text-anchor="middle" transform="rotate(-90 625,270)">Temperature, T</text>
  <text x="910" y="495" class="axis-label" text-anchor="middle">Time, t</text>

</svg>
