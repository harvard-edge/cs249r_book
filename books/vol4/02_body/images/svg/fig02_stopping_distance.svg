<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1F407A; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #2D3748; }
      .label-bold { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #2D3748; }
      .axis { stroke: #2D3748; stroke-width: 1.5; }
      .grid { stroke: #E2E8F0; stroke-width: 1; }
      .annotation-navy { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1F407A; }
      .annotation-red { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #A51C30; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <g transform="translate(0, -25)">

  <!-- Legend -->
  <rect x="50" y="48" width="16" height="12" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="74" y="58" class="label">Reaction Lag</text>
  
  <rect x="180" y="48" width="16" height="12" rx="2" fill="#1F407A"/>
  <text x="204" y="58" class="label">Kinetic Braking</text>
  
  <rect x="320" y="48" width="16" height="12" rx="2" fill="#334155"/>
  <text x="344" y="58" class="label">Actuator Overhead</text>
  
  <rect x="480" y="48" width="16" height="12" rx="2" fill="#A51C30" fill-opacity="0.8"/>
  <text x="504" y="58" class="label">Collision Penetration</text>

  <!-- Axes -->
  <line x1="150" y1="80" x2="150" y2="470" class="axis" />
  <line x1="150" y1="470" x2="1160" y2="470" class="axis" />

  <!-- Grid lines -->
  <line x1="350" y1="80" x2="350" y2="470" class="grid" />
  <line x1="550" y1="80" x2="550" y2="470" class="grid" />
  <line x1="950" y1="80" x2="950" y2="470" class="grid" />

  <!-- Obstacle Clearance Boundary (60.0 cm) -->
  <line x1="750" y1="75" x2="750" y2="470" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="750" y="68" class="annotation-red" text-anchor="middle">Obstacle Clearance (60.0 cm)</text>

  <!-- X-Axis Ticks & Labels -->
  <line x1="150" y1="470" x2="150" y2="476" stroke="#2D3748" stroke-width="1.5" />
  <text x="150" y="495" class="label" text-anchor="middle">0 cm</text>
  
  <line x1="350" y1="470" x2="350" y2="476" stroke="#2D3748" stroke-width="1.5" />
  <text x="350" y="495" class="label" text-anchor="middle">20 cm</text>
  
  <line x1="550" y1="470" x2="550" y2="476" stroke="#2D3748" stroke-width="1.5" />
  <text x="550" y="495" class="label" text-anchor="middle">40 cm</text>
  
  <line x1="750" y1="470" x2="750" y2="476" stroke="#A51C30" stroke-width="1.5" />
  <text x="750" y="495" class="annotation-red" text-anchor="middle">60 cm</text>
  
  <line x1="950" y1="470" x2="950" y2="476" stroke="#2D3748" stroke-width="1.5" />
  <text x="950" y="495" class="label" text-anchor="middle">80 cm</text>

  <!-- ==================== CASE 1 ==================== -->
  <text x="140" y="145" class="label-bold" text-anchor="end">Case 1</text>
  <text x="140" y="163" class="label" text-anchor="end">v = 1.0 m/s</text>
  <text x="140" y="179" class="label" text-anchor="end">t = 50 ms</text>
  
  <!-- react=5cm (50px), brake=25cm (250px), overhead=10cm (100px) => total 40cm (400px, ends at 550) -->
  <rect x="150" y="135" width="50" height="42" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
  <rect x="200" y="135" width="250" height="42" rx="2" fill="#1F407A" stroke="#1F407A" stroke-width="1" />
  <rect x="450" y="135" width="100" height="42" rx="2" fill="#334155" stroke="#334155" stroke-width="1" />
  
  <!-- Safe Margin Dimension Bracket & Badge -->
  <line x1="550" y1="156" x2="750" y2="156" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="550" y1="148" x2="550" y2="164" stroke="#1F407A" stroke-width="1.5" />
  <line x1="750" y1="148" x2="750" y2="164" stroke="#A51C30" stroke-width="1.5" />
  <rect x="580" y="144" width="140" height="24" rx="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#CBD5E1" stroke-width="1"/>
  <text x="650" y="160" class="annotation-navy" text-anchor="middle">+20.0 cm safe margin</text>

  <!-- ==================== CASE 2 ==================== -->
  <text x="140" y="260" class="label-bold" text-anchor="end">Case 2</text>
  <text x="140" y="278" class="label" text-anchor="end">v = 1.0 m/s</text>
  <text x="140" y="294" class="label" text-anchor="end">t = 200 ms</text>
  
  <!-- react=20cm (200px), brake=25cm (250px), overhead=10cm (100px) => total 55cm (550px, ends at 700) -->
  <rect x="150" y="250" width="200" height="42" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
  <rect x="350" y="250" width="250" height="42" rx="2" fill="#1F407A" stroke="#1F407A" stroke-width="1" />
  <rect x="600" y="250" width="100" height="42" rx="2" fill="#334155" stroke="#334155" stroke-width="1" />
  
  <!-- Safe Margin Gap (700 to 750) with overhead bracket and badge -->
  <line x1="700" y1="271" x2="750" y2="271" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="700" y1="264" x2="700" y2="278" stroke="#1F407A" stroke-width="1.5" />
  <line x1="750" y1="264" x2="750" y2="278" stroke="#A51C30" stroke-width="1.5" />
  <rect x="670" y="218" width="110" height="22" rx="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#1F407A" stroke-width="1"/>
  <text x="725" y="233" class="annotation-navy" font-size="11px" text-anchor="middle">+5.0 cm margin</text>
  <line x1="725" y1="240" x2="725" y2="262" stroke="#1F407A" stroke-width="1.2" />

  <!-- ==================== CASE 3 ==================== -->
  <text x="140" y="375" class="label-bold" text-anchor="end">Case 3</text>
  <text x="140" y="393" class="label" text-anchor="end">v = 1.2 m/s</text>
  <text x="140" y="409" class="label" text-anchor="end">t = 200 ms</text>
  
  <!-- react=28cm (280px), brake=48.3cm (483px), overhead=10cm (100px) => total 86.3cm (ends at 1013) -->
  <rect x="150" y="365" width="280" height="42" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
  <rect x="430" y="365" width="483" height="42" rx="2" fill="#1F407A" stroke="#1F407A" stroke-width="1" />
  <rect x="913" y="365" width="100" height="42" rx="2" fill="#334155" stroke="#334155" stroke-width="1" />
  
  <!-- Collision Overlap past 750px (60cm) -->
  <rect x="750" y="365" width="263" height="42" rx="2" fill="#A51C30" fill-opacity="0.75" stroke="#A51C30" stroke-width="1.5" />
  
  <rect x="1025" y="374" width="145" height="24" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
  <text x="1097" y="390" class="annotation-red" text-anchor="middle">+26.3 cm collision!</text>
</g>
</svg>
