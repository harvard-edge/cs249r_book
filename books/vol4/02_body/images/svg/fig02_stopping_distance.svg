<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 22px; font-weight: bold; fill: #1F407A; }
      .label { font-family: sans-serif; font-size: 14px; fill: #2D3748; }
      .axis { stroke: #2D3748; stroke-width: 2; }
      .bar-react { fill: #E2E8F0; stroke: #2D3748; stroke-width: 1;}
      .bar-brake { fill: #1F407A; stroke: #2D3748; stroke-width: 1;}
      .bar-margin { fill: #2D3748; stroke: #2D3748; stroke-width: 1;}
      .bar-collide { fill: #A51C30; }
      .grid { stroke: #E2E8F0; stroke-width: 1; }
      .annotation { font-family: sans-serif; font-size: 12px; fill: #1F407A; font-weight: bold; }
      .annotation-red { font-family: sans-serif; font-size: 12px; fill: #A51C30; font-weight: bold; }
    </style>
  </defs>

  <text x="50" y="40" class="title">Defended Dynamic Stopping Envelope: Case Comparison</text>

  <!-- Axes -->
  <line x1="150" y1="80" x2="150" y2="480" class="axis" />
  <line x1="150" y1="480" x2="950" y2="480" class="axis" />

  <!-- Grid lines -->
  <line x1="350" y1="80" x2="350" y2="480" class="grid" />
  <line x1="550" y1="80" x2="550" y2="480" class="grid" />
  <line x1="750" y1="80" x2="750" y2="480" stroke="#A51C30" stroke-width="2" stroke-dasharray="5,5" />
  <text x="755" y="75" class="annotation-red">Obstacle Clearance (60.0 cm)</text>

  <text x="150" y="500" class="label" text-anchor="middle">0 cm</text>
  <text x="350" y="500" class="label" text-anchor="middle">20 cm</text>
  <text x="550" y="500" class="label" text-anchor="middle">40 cm</text>
  <text x="750" y="500" class="label" text-anchor="middle">60 cm</text>
  <text x="950" y="500" class="label" text-anchor="middle">80 cm</text>

  <!-- Legend -->
  <rect x="150" y="50" width="20" height="10" class="bar-react" />
  <text x="180" y="60" class="label">Reaction Lag</text>
  <rect x="280" y="50" width="20" height="10" class="bar-brake" />
  <text x="310" y="60" class="label">Kinetic Braking</text>
  <rect x="420" y="50" width="20" height="10" class="bar-margin" />
  <text x="450" y="60" class="label">Overhead</text>

  <!-- Case 1 -->
  <text x="140" y="150" class="label" text-anchor="end" font-weight="bold">Case 1</text>
  <text x="140" y="170" class="label" text-anchor="end">v = 1.0 m/s</text>
  <text x="140" y="190" class="label" text-anchor="end">t = 50 ms</text>
  
  <!-- react=5cm, brake=25cm, overhead=10cm => total 40cm. Scale: 10cm = 100px. -->
  <rect x="150" y="140" width="50" height="40" class="bar-react" />
  <rect x="200" y="140" width="250" height="40" class="bar-brake" />
  <rect x="450" y="140" width="100" height="40" class="bar-margin" />
  <text x="560" y="165" class="annotation">+20.0 cm safe margin</text>

  <!-- Case 2 -->
  <text x="140" y="270" class="label" text-anchor="end" font-weight="bold">Case 2</text>
  <text x="140" y="290" class="label" text-anchor="end">v = 1.0 m/s</text>
  <text x="140" y="310" class="label" text-anchor="end">t = 200 ms</text>
  
  <!-- react=20cm, brake=25cm, overhead=10cm => total 55cm. -->
  <rect x="150" y="260" width="200" height="40" class="bar-react" />
  <rect x="350" y="260" width="250" height="40" class="bar-brake" />
  <rect x="600" y="260" width="100" height="40" class="bar-margin" />
  <text x="710" y="285" class="annotation">+5.0 cm safe margin</text>

  <!-- Case 3 -->
  <text x="140" y="390" class="label" text-anchor="end" font-weight="bold">Case 3</text>
  <text x="140" y="410" class="label" text-anchor="end">v = 1.2 m/s</text>
  <text x="140" y="430" class="label" text-anchor="end">t = 200 ms</text>
  
  <!-- react=24cm, brake=36cm, overhead=10cm => total 70cm, wait, collision = +26.3 -->
  <!-- Let's adjust to match collision +26.3. So total = 86.3cm. react + brake + 10 = 86.3 => react+brake = 76.3. -->
  <!-- If v = 1.4 m/s, t=200ms -> react=28cm, brake=1.4^2 / 4 = 1.96 / 4 = 0.49m (49cm). Total = 28+49+10 = 87cm. (close) -->
  <!-- Actually text says "+26.3 cm collision" which means total is 60+26.3 = 86.3cm. 
       Let's use rect dimensions to equal 863 width (86.3cm) in scale. Scale is 10px per 1cm. -->
  
  <rect x="150" y="380" width="280" height="40" class="bar-react" />
  <rect x="430" y="380" width="483" height="40" class="bar-brake" />
  <rect x="913" y="380" width="100" height="40" class="bar-margin" />
  <!-- Overlap past 750px (60cm) is the collision -->
  <rect x="750" y="380" width="263" height="40" class="bar-collide" fill-opacity="0.6"/>
  <text x="1023" y="405" class="annotation-red">+26.3 cm collision!</text>

</svg>
