<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <style>
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .tick-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .tick-red { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #DC2626; }
      .case-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .case-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748B; }
      .traj-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; }
      .seg-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #334155; }
      .boundary-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #DC2626; }
      .axis-line { stroke: #334155; stroke-width: 1.5; stroke-linecap: round; }
      .grid-line { stroke: #F1F5F9; stroke-width: 1; }
      .obstacle-line { stroke: #DC2626; stroke-width: 1.5; stroke-dasharray: 5,4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="520" fill="#FFFFFF"/>

  <!-- ==================== TOP LEGEND ==================== -->
  <g transform="translate(180, 28)">
    <!-- Reaction swatch -->
    <rect x="0" y="0" width="16" height="11" rx="2" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="22" y="10" class="legend-text">Reaction</text>

    <!-- Braking swatch -->
    <rect x="95" y="0" width="16" height="11" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="117" y="10" class="legend-text">Braking</text>

    <!-- Margin swatch -->
    <rect x="185" y="0" width="16" height="11" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="207" y="10" class="legend-text">Margin</text>

    <!-- Breach swatch -->
    <rect x="270" y="0" width="16" height="11" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="292" y="10" class="legend-text">Breach</text>
  </g>

  <!-- ==================== VERTICAL OBSTACLE CLEARANCE PLANE ==================== -->
  <!-- Obstacle boundary at x = 60 cm (X = 780) -->
  <line x1="780" y1="25" x2="780" y2="455" class="obstacle-line"/>
  <text x="780" y="18" class="boundary-title" text-anchor="middle">D<tspan font-size="9" dy="2">clear</tspan><tspan font-size="12" dy="-2" dx="4">(Obstacle)</tspan></text>

  <!-- Vertical Grid lines -->
  <line x1="380" y1="50" x2="380" y2="455" class="grid-line"/>
  <line x1="580" y1="50" x2="580" y2="455" class="grid-line"/>
  <line x1="980" y1="50" x2="980" y2="455" class="grid-line"/>

  <!-- ==================== CARTESIAN VELOCITY TRAJECTORY PLOT ==================== -->
  <!-- Horizontal grid lines at v = 1.0 m/s (Y = 130) and v = 0.5 m/s (Y = 185) -->
  <line x1="180" y1="130" x2="1050" y2="130" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="180" y1="185" x2="1050" y2="185" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Trajectory 1: Nominal (v0 = 1.0 m/s, delta_t = 50 ms => coast to 5 cm, brake to 30 cm) -->
  <path d="M 180 130 L 230 130 C 290 130, 420 180, 480 240" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
  <text x="245" y="122" class="traj-label" fill="#2563EB">Case 1</text>

  <!-- Trajectory 2: Tail Latency (v0 = 1.0 m/s, delta_t = 200 ms => coast to 20 cm, brake to 45 cm) -->
  <path d="M 180 130 L 380 130 C 440 130, 570 180, 630 240" fill="none" stroke="#0D9488" stroke-width="2.2" stroke-dasharray="6,3" stroke-linecap="round"/>
  <text x="395" y="122" class="traj-label" fill="#0D9488">Case 2</text>

  <!-- Trajectory 3: Velocity Spike (v0 = 1.2 m/s, delta_t = 200 ms => coast to 24 cm, brake to 72 cm, crosses 60 cm at v > 0) -->
  <path d="M 180 108 L 420 108 C 500 108, 700 150, 900 240" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4,4" stroke-linecap="round"/>
  <text x="435" y="100" class="traj-label" fill="#DC2626">Case 3</text>

  <!-- Velocity Axes -->
  <line x1="180" y1="240" x2="180" y2="70" class="axis-line" marker-end="url(#arrow)"/>
  <line x1="180" y1="240" x2="1050" y2="240" class="axis-line" marker-end="url(#arrow)"/>

  <!-- Velocity Y-Axis Ticks & Labels -->
  <line x1="175" y1="108" x2="180" y2="108" stroke="#334155" stroke-width="1.5"/>
  <text x="170" y="112" class="tick-label" text-anchor="end">1.2</text>

  <line x1="175" y1="130" x2="180" y2="130" stroke="#334155" stroke-width="1.5"/>
  <text x="170" y="134" class="tick-label" text-anchor="end">1.0</text>

  <line x1="175" y1="185" x2="180" y2="185" stroke="#334155" stroke-width="1.5"/>
  <text x="170" y="189" class="tick-label" text-anchor="end">0.5</text>

  <line x1="175" y1="240" x2="180" y2="240" stroke="#334155" stroke-width="1.5"/>
  <text x="170" y="244" class="tick-label" text-anchor="end">0</text>

  <text x="105" y="155" class="axis-title" text-anchor="middle" transform="rotate(-90 105,155)">Velocity, v (m/s)</text>


  <!-- ==================== STOPPING RUNWAY DECOMPOSITION ==================== -->

  <!-- Case 1 -->
  <text x="168" y="295" class="case-title" text-anchor="end">Case 1</text>
  <text x="168" y="310" class="case-sub" text-anchor="end">Nominal</text>

  <!-- Runway 1: React 5cm (50px), Brake 25cm (250px), Margin 30cm (300px) -->
  <rect x="180" y="284" width="50" height="28" rx="2" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="205" y="302" class="seg-label" fill="#1D4ED8" text-anchor="middle">d<tspan font-size="8.5" dy="2">react</tspan></text>

  <rect x="230" y="284" width="250" height="28" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="355" y="302" class="seg-label" fill="#1E40AF" text-anchor="middle">d<tspan font-size="8.5" dy="2">brake</tspan></text>

  <rect x="480" y="284" width="300" height="28" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="630" y="302" class="seg-label" fill="#15803D" text-anchor="middle">Margin</text>


  <!-- Case 2 -->
  <text x="168" y="351" class="case-title" text-anchor="end">Case 2</text>
  <text x="168" y="366" class="case-sub" text-anchor="end">Tail latency</text>

  <!-- Runway 2: React 20cm (200px), Brake 25cm (250px), Margin 15cm (150px) -->
  <rect x="180" y="340" width="200" height="28" rx="2" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="280" y="358" class="seg-label" fill="#1D4ED8" text-anchor="middle">d<tspan font-size="8.5" dy="2">react</tspan></text>

  <rect x="380" y="340" width="250" height="28" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="505" y="358" class="seg-label" fill="#1E40AF" text-anchor="middle">d<tspan font-size="8.5" dy="2">brake</tspan></text>

  <rect x="630" y="340" width="150" height="28" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="705" y="358" class="seg-label" fill="#15803D" text-anchor="middle">Margin</text>


  <!-- Case 3 -->
  <text x="168" y="407" class="case-title" text-anchor="end">Case 3</text>
  <text x="168" y="422" class="case-sub" text-anchor="end">Coupled spike</text>

  <!-- Runway 3: React 24cm (240px), Brake 36cm to obstacle (360px), Breach past obstacle to 72cm (120px) -->
  <rect x="180" y="396" width="240" height="28" rx="2" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="300" y="414" class="seg-label" fill="#1D4ED8" text-anchor="middle">d<tspan font-size="8.5" dy="2">react</tspan></text>

  <rect x="420" y="396" width="360" height="28" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="600" y="414" class="seg-label" fill="#1E40AF" text-anchor="middle">d<tspan font-size="8.5" dy="2">brake</tspan></text>

  <rect x="780" y="396" width="120" height="28" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="840" y="414" class="seg-label" fill="#B91C1C" text-anchor="middle">Breach</text>


  <!-- ==================== BOTTOM DISTANCE SCALE ==================== -->
  <line x1="180" y1="455" x2="1050" y2="455" class="axis-line" marker-end="url(#arrow)"/>

  <!-- Distance Ticks -->
  <line x1="180" y1="455" x2="180" y2="461" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="478" class="tick-label" text-anchor="middle">0 cm</text>

  <line x1="380" y1="455" x2="380" y2="461" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="478" class="tick-label" text-anchor="middle">20 cm</text>

  <line x1="580" y1="455" x2="580" y2="461" stroke="#334155" stroke-width="1.5"/>
  <text x="580" y="478" class="tick-label" text-anchor="middle">40 cm</text>

  <line x1="780" y1="455" x2="780" y2="461" stroke="#DC2626" stroke-width="2"/>
  <text x="780" y="478" class="tick-red" text-anchor="middle">60 cm</text>

  <line x1="980" y1="455" x2="980" y2="461" stroke="#334155" stroke-width="1.5"/>
  <text x="980" y="478" class="tick-label" text-anchor="middle">80 cm</text>

  <!-- Distance Axis Title -->
  <text x="580" y="504" class="axis-title" text-anchor="middle">Distance, x (cm)</text>

</svg>
