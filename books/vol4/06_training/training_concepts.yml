  claims:
    Training-regime hidden dependency: A policy's weights keep what its experience rewarded but not which experience
      it was, so each regime (demonstrations, logged rewards, simulation, trial on the machine, a pretrained base)
      leaves a characteristic dependency no training score shows.
    Mode averaging: The squared-error optimum of a point-regression policy is the conditional mean of the action,
      so two valid evasions average to an action no demonstrator chose, and more data or capacity cannot fix it.
    Decoder renewal slack: A decoder chosen for multimodality must fit the proposal deadline, since latency is encoding
      plus every dependent decoder evaluation, so the head and evaluation count that training picks decide schedulability.
    Offline RL support limit: Fitting values over a fixed log and acting greedily inflates values at actions the
      log never executed, and conservative objectives reduce that error but cannot create support the log lacks.
    Physical RL exploration cost: A trial campaign's wall clock is trials times rollout plus reset over rigs (about
      93 days of execution for 10^6 latch trials before resets), and every trial spends heat and drivetrain life.
    Reality gap as a vector: Sim-to-real mismatch decomposes into dynamics, sensing, appearance, and timing channels,
      each sized by paired probing, and randomization covers modeled parameters but never omitted mechanisms.
    Update is a new checkpoint: On-machine fine-tuning absorbs a measurable local mismatch but produces new weights
      whose earlier evaluations no longer apply, and a gated residual bounds where adaptation may act.
    Policy manifest: The policy manifest records how a checkpoint was produced (regime sequence, base digest, inference
      contract, data support, omission log, wear log) and computes the declared ODD as support minus omissions.
    Reward as specification: Posing the task as an MDP makes the engineer-written reward and discount the whole
      objective, so the optimizer exploits any omitted or mismeasured term.
    Pretrained borrowed competence: Post-training a pretrained generalist can cut task-data needs, but no pretraining
      episode joins this machine's scenario table, so it supplies competence, not evidence.
    Simulator contact exploit: A simulator's contact model decides what the optimizer learns, and a soft penalty
      spring lets a policy pass through contacts the real plate would resist.
    Privileged information limits: Asymmetric critics and teacher-student distillation speed training under partial
      observability, but the student cannot recover a state its sensors never observe.
    Paired probing: Identical open-loop excitations on the robot and its simulated twin, scored against error budgets
      per channel, size each component of the reality gap.
    Velocity versus torque drift: A velocity-commanded policy has a disturbance-rejecting loop beneath it and its
      error integrates once, while a torque-commanded policy's error integrates twice.
    Chunk imitation objective: Chunked imitation fits a horizon of actions with a Huber penalty on normalized residuals,
      which buys outlier robustness, not smoothness or feasibility.
    RL value functions: State value, action value, advantage, and the Bellman relation express value as negated
      cost-to-go, with LQR as the closed-form linear-quadratic case.
