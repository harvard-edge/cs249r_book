  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.learning.mode-averaging
      label: Mode averaging
      teaches: Mode averaging
      summary: A point predictor averages distinct valid action modes into a motion that may belong to none
        of them.
      section: sec-training-multimodality-breakdown
    - id: vol4.learning.reality-gap
      label: Reality gap
      teaches: Reality gap as a vector
      summary: Mismatch between training simulation and the physical plant, including contact, sensing,
        timing, and actuation.
      section: sec-training-simulator-component
    - id: vol4.learning.checkpoint
      label: Policy checkpoint
      teaches: Update is a new checkpoint
      summary: A versioned learned policy whose training provenance, decoder, interface, and evidence must
        be bound before evaluation and release.
      section: sec-training-policy-manifest
    relationships:
    - id: vol4.field.learning-mode-averaging--motion-trajectory
      source: vol4.learning.mode-averaging
      predicate: can invalidate
      target: vol4.motion.trajectory
      explanation: A point-regression policy can average two collision-free demonstrated routes into a colliding
        route.
      conditions: This concerns multimodal actions under point regression; it is distinct from compounding
        error caused by later visited states.
      status: draft
      evidence:
        section: sec-training-multimodality-breakdown
        quote: A mobile manipulator trained with least-squares regression on demonstrations that pass left
          of a central structural column half the time and right of it the other half will steer straight
          down the center line into the column. Each human teleoperator trajectory in the recorded archive
          $\DemonstrationDataset$ is dynamically valid and collision-free, and not a single demonstration
          drives into the obstacle, yet a deterministic point-regression policy proposes the one path that
          every demonstrator avoided.
    - id: vol4.field.learning-reality-gap--learning-checkpoint
      source: vol4.learning.reality-gap
      predicate: limits transfer evidence for
      target: vol4.learning.checkpoint
      explanation: The checkpoint inherits the simulator dynamics that shaped its training experience; removing
        the simulator does not remove those learned exploits.
      conditions: Transfer claims must be qualified separately for the relevant contact, sensing, timing,
        and actuation mismatch.
      status: draft
      evidence:
        section: sec-training-simulator-component
        quote: A reinforcement learning policy trained on door latching learned an aggressive, unbraked
          plunge because its simulated strike plate yielded far more than the physical mechanism. Stripping
          away the simulator during physical deployment does nothing to unlearn that behavior. The physics
          simulator is not an external sandbox; it is an active component of the training pipeline whose
          equations, contact approximations, and timing assumptions dictate the exact experience supplied
          to the optimizer. Accepting simulated task success as evidence of hardware readiness requires
          measurable, verifiable error bounds on every one of those assumptions.
    - id: vol4.field.learning-checkpoint--evaluation-trial
      source: vol4.learning.checkpoint
      predicate: requires renewed
      target: vol4.evaluation.trial
      explanation: A weight file alone does not identify what recovery or contact behavior its training
        supplied, so a candidate needs bound provenance and evaluation.
      conditions: A checkpoint update is a new candidate; previous evidence transfers only through an explicit
        unchanged-claim argument.
      status: draft
      evidence:
        section: sec-training-policy-manifest
        quote: Handing a candidate checkpoint to an evaluation team with only its weight file and a training
          curve hides whether its behavior on a displaced plate comes from human recovery demonstrations,
          uncalibrated simulator rollouts, or pure network extrapolation. The candidate selection must distinguish
          nominal behavior supported by demonstrations, newly taught recovery, and contact behavior that
          still depends on unverified simulation. The failure chains of @sec-training-failure-modes make
          that distinction concrete for each checkpoint; the record accompanying the candidate into evaluation
          preserves the reasoning, including the assumptions that remain open.
