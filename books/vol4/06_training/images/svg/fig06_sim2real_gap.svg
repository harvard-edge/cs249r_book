<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; text-anchor: middle; letter-spacing: 0.3px; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #64748B; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; text-anchor: middle; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#1F407A" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="400" fill="#FFFFFF" />
  <text x="450" y="28" class="main-title">The Multidimensional Sim-to-Real Reality Gap Vector</text>

  <!-- ===================================================================== -->
  <!-- PANEL (a): Dynamics & Contact Mismatch                                -->
  <!-- ===================================================================== -->
  <g transform="translate(45, 48)">
    <rect width="395" height="155" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="4" />
    <text x="197" y="22" class="panel-title">(a) Dynamics &amp; Contact Mismatch</text>
    
    <rect x="18" y="32" width="359" height="108" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="3" />
    <!-- Baseline -->
    <path d="M 30 115 L 360 115" stroke="#94A3B8" stroke-width="1" />
    
    <!-- Simulated Trajectory (Ideal Step Response) -->
    <path d="M 30 115 L 85 115 L 125 55 L 230 55" stroke="#1F407A" stroke-width="2" stroke-dasharray="4,3" fill="none" />
    
    <!-- Physical Trajectory (Overshoot & Contact Compliance) -->
    <path d="M 30 115 L 95 115 L 145 42 L 180 75 L 230 75" stroke="#DC2626" stroke-width="2" fill="none" />

    <!-- Clean Badges in whitespace right of curves -->
    <rect x="245" y="44" width="118" height="22" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
    <text x="304" y="59" class="badge-text" fill="#1F407A">Simulated (Ideal)</text>

    <rect x="245" y="72" width="118" height="22" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" />
    <text x="304" y="87" class="badge-text" fill="#991B1B">Physical (Overshoot)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL (b): Actuator & Pipeline Latency                                -->
  <!-- ===================================================================== -->
  <g transform="translate(460, 48)">
    <rect width="395" height="155" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="4" />
    <text x="197" y="22" class="panel-title">(b) Actuator &amp; Pipeline Latency</text>
    
    <rect x="18" y="32" width="359" height="108" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="3" />
    <!-- Baseline -->
    <path d="M 30 110 L 360 110" stroke="#94A3B8" stroke-width="1" />
    
    <!-- Simulated Sinusoid (Wave peak at x=90, y=55) -->
    <path d="M 30 90 Q 90 40 150 90 T 270 90 T 360 90" stroke="#1F407A" stroke-width="2" stroke-dasharray="4,3" fill="none" />
    
    <!-- Physical Sinusoid (Delayed wave peak at x=140, y=55) -->
    <path d="M 80 90 Q 140 40 200 90 T 320 90" stroke="#DC2626" stroke-width="2" fill="none" />
    
    <!-- Latency Dimension Line Between Crests (Completely clear of curves at y=42) -->
    <line x1="90" y1="42" x2="140" y2="42" stroke="#475569" stroke-width="1.2" />
    <line x1="90" y1="38" x2="90" y2="46" stroke="#475569" stroke-width="1.2" />
    <line x1="140" y1="38" x2="140" y2="46" stroke="#475569" stroke-width="1.2" />
    
    <!-- Badge for Latency (Cleanly placed at x=165, y=36) -->
    <rect x="150" y="34" width="115" height="20" rx="3" fill="#F1F5F9" stroke="#64748B" stroke-width="1" />
    <text x="207" y="48" class="badge-text" fill="#334155">&#916;t: 35–50 ms Delay</text>
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL (c): Sensing & Transduction                                     -->
  <!-- ===================================================================== -->
  <g transform="translate(45, 218)">
    <rect width="395" height="155" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="4" />
    <text x="197" y="22" class="panel-title">(c) Sensing &amp; Transduction</text>
    
    <rect x="18" y="32" width="359" height="108" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="3" />
    <!-- Ground Truth Zero Line -->
    <path d="M 30 105 L 360 105" stroke="#94A3B8" stroke-width="1" />
    
    <!-- Simulated Constant Track -->
    <path d="M 30 80 L 220 80" stroke="#1F407A" stroke-width="2" stroke-dasharray="4,3" fill="none" />
    
    <!-- Physical Signal with Calibration Bias & Sensor Dropout Notch -->
    <path d="M 30 65 L 115 65 L 125 118 L 135 118 L 145 65 L 220 65" stroke="#DC2626" stroke-width="2" fill="none" />
    
    <!-- Dropout Callout Badge -->
    <rect x="90" y="122" width="70" height="16" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="0.8" />
    <text x="125" y="134" class="badge-text" fill="#991B1B">Dropout</text>

    <!-- Bias Dimension Arrow between y=80 and y=65 -->
    <line x1="235" y1="80" x2="235" y2="65" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arrow-red)" />
    <rect x="245" y="62" width="115" height="22" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" />
    <text x="302" y="77" class="badge-text" fill="#991B1B">Bias (+3.2 mm)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL (d): Perceptual Feature Shift                                   -->
  <!-- ===================================================================== -->
  <g transform="translate(460, 218)">
    <rect width="395" height="155" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="4" />
    <text x="197" y="22" class="panel-title">(d) Perceptual Feature Shift</text>
    
    <rect x="18" y="32" width="359" height="108" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="3" />
    
    <!-- Simulated Latent Distribution Sphere -->
    <circle cx="105" cy="85" r="32" fill="#1F407A" fill-opacity="0.15" stroke="#1F407A" stroke-width="1.8" stroke-dasharray="4,3"/>
    
    <!-- Physical Latent Distribution Sphere -->
    <circle cx="148" cy="85" r="32" fill="#DC2626" fill-opacity="0.15" stroke="#DC2626" stroke-width="1.8"/>
    
    <!-- Shift Vector Arrow -->
    <line x1="105" y1="85" x2="148" y2="85" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow-slate)"/>
    
    <!-- Shift Badge: Cleanly placed above circles (zero collision) -->
    <rect x="85" y="38" width="85" height="20" rx="3" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
    <text x="127" y="52" class="badge-text" fill="#1E293B">6.0 mm Shift</text>

    <!-- Legend Badges on Right -->
    <rect x="245" y="60" width="110" height="22" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
    <text x="300" y="75" class="badge-text" fill="#1F407A">Simulated</text>

    <rect x="245" y="88" width="110" height="22" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" />
    <text x="300" y="103" class="badge-text" fill="#991B1B">Physical</text>
  </g>
</svg>
