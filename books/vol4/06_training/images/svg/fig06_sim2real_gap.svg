<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390">
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1E293B; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #475569; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .math-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #DC2626; }
      .math-slate { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #334155; }
    </style>

    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="390" fill="#FFFFFF" />

  <!-- Global Legend (Top Center) -->
  <g transform="translate(320, 16)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#1E40AF" stroke-width="2" stroke-dasharray="4,3" />
    <text x="38" y="14" class="legend-text">Simulated</text>

    <line x1="140" y1="10" x2="170" y2="10" stroke="#DC2626" stroke-width="2.2" />
    <text x="178" y="14" class="legend-text">Physical Hardware</text>
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL (a): Dynamics Mismatch                                          -->
  <!-- ===================================================================== -->
  <g transform="translate(25, 45)">
    <rect width="425" height="155" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="20" y="24" class="panel-title">(a) Dynamics Mismatch</text>

    <!-- Axes -->
    <path d="M 55 135 L 390 135" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />
    <text x="390" y="148" class="axis-label" text-anchor="end">Time t</text>
    
    <path d="M 55 135 L 55 45" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />
    <text x="50" y="40" class="axis-label" text-anchor="start">Force F</text>

    <!-- Simulated Step Response -->
    <path d="M 55 125 L 105 125 L 140 88 L 365 88" fill="none" stroke="#1E40AF" stroke-width="1.8" stroke-dasharray="4,3" />

    <!-- Physical Response (Compliance & Peak Overshoot) -->
    <path d="M 55 125 L 115 125 L 160 62 L 195 98 L 365 98" fill="none" stroke="#DC2626" stroke-width="2.2" />

    <!-- Overshoot Annotation -->
    <line x1="160" y1="62" x2="225" y2="62" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="220" y1="88" x2="220" y2="64" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arr-red)" />
    <text x="230" y="78" class="math-label">Overshoot F<tspan baseline-shift="sub" font-size="7.5px">peak</tspan></text>
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL (b): Pipeline Latency                                           -->
  <!-- ===================================================================== -->
  <g transform="translate(470, 45)">
    <rect width="425" height="155" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="20" y="24" class="panel-title">(b) Pipeline Latency</text>

    <!-- Axes -->
    <path d="M 55 135 L 390 135" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />
    <text x="390" y="148" class="axis-label" text-anchor="end">Time t</text>
    
    <path d="M 55 135 L 55 45" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />
    <text x="50" y="40" class="axis-label" text-anchor="start">Command u</text>

    <!-- Simulated Wave (shifted slightly lower so crest is at y=76) -->
    <path d="M 65 106 Q 115 72 165 106 T 265 106 T 365 106" fill="none" stroke="#1E40AF" stroke-width="1.8" stroke-dasharray="4,3" />

    <!-- Delayed Physical Wave -->
    <path d="M 100 106 Q 150 72 200 106 T 300 106 T 380 106" fill="none" stroke="#DC2626" stroke-width="2.2" />

    <!-- Latency Dimension Indicator (positioned cleanly at y=58) -->
    <line x1="115" y1="58" x2="150" y2="58" stroke="#475569" stroke-width="1.2" />
    <line x1="115" y1="54" x2="115" y2="62" stroke="#475569" stroke-width="1.2" />
    <line x1="150" y1="54" x2="150" y2="62" stroke="#475569" stroke-width="1.2" />
    <text x="132" y="50" class="math-slate" text-anchor="middle">Delay &#964;<tspan baseline-shift="sub" font-size="7.5px">lag</tspan></text>
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL (c): Sensing Artifacts                                          -->
  <!-- ===================================================================== -->
  <g transform="translate(25, 215)">
    <rect width="425" height="155" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="20" y="24" class="panel-title">(c) Sensing Artifacts</text>

    <!-- Axes -->
    <path d="M 55 135 L 390 135" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />
    <text x="390" y="148" class="axis-label" text-anchor="end">Time t</text>
    
    <path d="M 55 135 L 55 45" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />
    <text x="50" y="40" class="axis-label" text-anchor="start">Sensor y</text>

    <!-- Simulated Constant Track -->
    <path d="M 55 105 L 365 105" fill="none" stroke="#1E40AF" stroke-width="1.8" stroke-dasharray="4,3" />

    <!-- Physical Track with Bias and Dropout Notch (notch at y=124, well above axis at y=135) -->
    <path d="M 55 86 L 140 86 L 150 124 L 165 124 L 175 86 L 365 86" fill="none" stroke="#DC2626" stroke-width="2.2" />

    <!-- Dropout callout placed cleanly above notch -->
    <text x="158" y="74" class="math-label" text-anchor="middle">Dropout &#8709;</text>

    <!-- Bias Dimension Arrow -->
    <line x1="250" y1="105" x2="250" y2="88" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arr-red)" />
    <text x="260" y="99" class="math-label">Bias &#916;y</text>
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL (d): Perceptual Feature Shift                                   -->
  <!-- ===================================================================== -->
  <g transform="translate(470, 215)">
    <rect width="425" height="155" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="20" y="24" class="panel-title">(d) Perceptual Feature Shift</text>

    <!-- Axes -->
    <path d="M 55 135 L 390 135" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />
    <text x="390" y="148" class="axis-label" text-anchor="end">z<tspan baseline-shift="sub" font-size="7.5px">1</tspan></text>
    
    <path d="M 55 135 L 55 45" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />
    <text x="50" y="40" class="axis-label" text-anchor="start">z<tspan baseline-shift="sub" font-size="7.5px">2</tspan></text>

    <!-- Simulated Latent Distribution (lowered slightly so top is at y=95) -->
    <ellipse cx="145" cy="116" rx="38" ry="20" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="4,3" />
    <circle cx="145" cy="116" r="3" fill="#1E40AF" />

    <!-- Physical Latent Distribution -->
    <ellipse cx="255" cy="116" rx="38" ry="20" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" />
    <circle cx="255" cy="116" r="3" fill="#DC2626" />

    <!-- Shift Vector Arrow -->
    <line x1="145" y1="116" x2="246" y2="116" stroke="#1E293B" stroke-width="2" marker-end="url(#arr-slate)" />
    <!-- Label placed safely above ellipses -->
    <text x="200" y="86" class="math-slate" text-anchor="middle">Shift &#916;z</text>
  </g>
</svg>
