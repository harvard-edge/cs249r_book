<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 275" width="900" height="275">
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #64748B; }
      .card-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #334155; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="275" fill="#FFFFFF" />
  <g transform="translate(0, -25)">

  <!-- ===================================================================== -->
  <!-- PANEL A: State-Space Trajectory                                       -->
  <!-- ===================================================================== -->
  <g transform="translate(45, 45)">
    <rect width="395" height="235" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="4" />
    <text x="197" y="24" class="panel-title">(a) State-Space Trajectory</text>
    
    <!-- Coordinate Axes -->
    <path fill="none" d="M 35 185 L 320 185" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="325" y="189" class="axis-label">Time (t)</text>
    
    <path fill="none" d="M 35 185 L 35 45" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="35" y="38" class="axis-label">State Space (x)</text>
    
    <!-- Nominal Support Tube -->
    <rect x="35" y="132" width="265" height="20" fill="#E2E8F0" opacity="0.6" />
    <line x1="35" y1="142" x2="300" y2="142" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="4,3" />
    <!-- Demonstration Support Label: Placed on top-left of tube in clear space -->
    <text x="42" y="124" class="axis-label" fill="#1F407A" text-anchor="start">Nominal Support S_demo</text>
    
    <!-- Quadratic Drift Trajectory Curve -->
    <path d="M 35 142 L 150 142 Q 210 140 255 105 Q 285 80 305 68" stroke="#DC2626" stroke-width="2.5" fill="none" />
    
    <!-- Error Point at t=tau -->
    <circle cx="150" cy="142" r="4" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="110" y="154" width="80" height="20" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <text x="150" y="168" class="axis-label" fill="#1E293B" text-anchor="middle">Error at t = &#964;</text>
    
    <!-- Quadratic Drift Badge: Placed in open whitespace above curve lift-off -->
    <rect x="135" y="55" width="105" height="24" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" />
    <text x="187" y="71" class="badge-text" fill="#991B1B">Quadratic Drift</text>
    <path d="M 215 79 L 245 105" fill="none" stroke="#DC2626" stroke-width="1" stroke-dasharray="2,2" />
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL B: Cumulative Error Scaling                                     -->
  <!-- ===================================================================== -->
  <g transform="translate(460, 45)">
    <rect width="395" height="235" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" rx="4" />
    <text x="197" y="24" class="panel-title">(b) Cumulative Error Scaling</text>
    
    <!-- Coordinate Axes -->
    <path fill="none" d="M 35 185 L 305 185" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="312" y="189" class="axis-label">Horizon (T)</text>
    
    <path fill="none" d="M 35 185 L 35 45" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="35" y="38" class="axis-label">Cumulative Loss E[L]</text>
    
    <!-- Curve 1: Behavior Cloning O(T^2 epsilon) -->
    <path d="M 35 185 Q 165 185 295 65" stroke="#DC2626" stroke-width="2.5" fill="none" />
    
    <!-- Curve 2: DAgger / Recovery O(T epsilon) -->
    <path d="M 35 185 L 295 140" stroke="#1F407A" stroke-width="2" fill="none" />
    
    <!-- Legend Badges placed safely in upper-left quadrant (100% collision-free) -->
    <rect x="50" y="55" width="145" height="26" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" />
    <text x="122" y="72" class="badge-text" fill="#991B1B">Cloning: O(T&#178; &#949;)</text>

    <rect x="50" y="90" width="145" height="26" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
    <text x="122" y="107" class="badge-text" fill="#1F407A">DAgger / Interv.: O(T &#949;)</text>
  </g>
  </g>
</svg>
