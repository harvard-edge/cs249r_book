<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-45.0" y="-14.0" width="990.0" height="308.0" fill="#ffffff"/>
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .curve-label-red { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #DC2626; }
      .curve-label-green { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #15803D; }
      .legend-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .tube-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #1D4ED8; }
      .annotation { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748B; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="280" fill="#FFFFFF" />

  <!-- ===================================================================== -->
  <!-- PANEL A: State-Space Trajectory                                       -->
  <!-- ===================================================================== -->
  <g transform="translate(30, 20)">
    <rect width="405" height="240" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" rx="4" />
    <text x="25" y="32" class="panel-title">(a) State-Space Example</text>
    
    <!-- Coordinate Axes -->
    <path d="M 50 195 L 375 195" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
    <text x="375" y="212" class="axis-label" text-anchor="end">Time t</text>
    
    <path d="M 50 195 L 50 55" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
    <text x="45" y="48" class="axis-label" text-anchor="start">State x</text>
    
    <!-- Nominal Support Tube -->
    <rect x="50" y="140" width="310" height="24" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" stroke-dasharray="3,3" rx="2" />
    <text x="56" y="133" class="tube-label">Support S<tspan baseline-shift="sub" font-size="78%">demo</tspan></text>
    <line x1="50" y1="152" x2="360" y2="152" stroke="#93C5FD" stroke-width="1.2" stroke-dasharray="4,3" />

    <!-- Trajectory before perturbation -->
    <line x1="50" y1="152" x2="160" y2="152" stroke="#1E293B" stroke-width="2.2" />

    <!-- Perturbation Point at tau -->
    <circle cx="160" cy="152" r="4" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="160" y1="152" x2="160" y2="195" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2" />
    <text x="160" y="210" class="annotation" text-anchor="middle">Perturbation &#964;</text>

    <!-- Illustrative cloning state path -->
    <path d="M 160 152 Q 225 150 280 110 Q 325 75 355 60" fill="none" stroke="#DC2626" stroke-width="2.2" />
    <text x="355" y="50" class="curve-label-red" text-anchor="end">Cloning Drift</text>

    <!-- Interactive Recovery Curve returning to tube -->
    <path d="M 160 152 Q 190 172 230 160 Q 260 152 355 152" fill="none" stroke="#15803D" stroke-width="2.2" stroke-dasharray="5,3" />
    <text x="355" y="176" class="curve-label-green" text-anchor="end">Recovery</text>
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL B: Cumulative Error Scaling                                     -->
  <!-- ===================================================================== -->
  <g transform="translate(465, 20)">
    <rect width="405" height="240" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" rx="4" />
    <text x="25" y="32" class="panel-title">(b) Expected Cost Bounds</text>
    
    <!-- Coordinate Axes -->
    <path d="M 50 195 L 375 195" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
    <text x="375" y="212" class="axis-label" text-anchor="end">Horizon T</text>
    
    <path d="M 50 195 L 50 55" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
    <text x="45" y="48" class="axis-label" text-anchor="start">Loss J</text>
    
    <!-- Legend placed cleanly in open upper-left quadrant -->
    <line x1="75" y1="80" x2="105" y2="80" stroke="#DC2626" stroke-width="2.2" />
    <text x="115" y="84" class="legend-label">BC worst-case: <tspan fill="#DC2626" font-weight="700">O(T&#178; &#949;)</tspan></text>

    <line x1="75" y1="102" x2="105" y2="102" stroke="#15803D" stroke-width="2.2" stroke-dasharray="5,3" />
    <text x="115" y="106" class="legend-label">Interactive: <tspan fill="#15803D" font-weight="700">O(T &#949;)</tspan></text>

    <!-- Quadratic Scaling Curve (Cloning) -->
    <path d="M 50 195 Q 200 192 345 65" fill="none" stroke="#DC2626" stroke-width="2.2" />

    <!-- Linear Scaling Curve (Recovery / DAgger) -->
    <path d="M 50 195 L 345 130" fill="none" stroke="#15803D" stroke-width="2.2" stroke-dasharray="5,3" />
  </g>
</svg>
