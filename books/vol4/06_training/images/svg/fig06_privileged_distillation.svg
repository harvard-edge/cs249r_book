<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-10" y="-10" width="1020" height="480" fill="#ffffff"/>
  
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#004B87"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E793C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Main Background -->
  <rect width="1000" height="460" fill="#FFFFFF"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): PHASE 1 - PRIVILEGED TEACHER (SIMULATION)                 -->
  <!-- ==================================================================== -->
  <rect x="25" y="20" width="455" height="420" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="25" y="20" width="455" height="42" rx="8" fill="#EFF6FF"/>
  <rect x="25" y="54" width="455" height="8" fill="#EFF6FF"/>
  <line x1="25" y1="62" x2="480" y2="62" stroke="#BFDBFE" stroke-width="1.2"/>
  
  <text x="45" y="46" font-size="14" font-weight="700" fill="#004B87">Phase 1: Privileged Oracle (Simulation RL)</text>
  <rect x="375" y="31" width="90" height="22" rx="4" fill="#DBEAFE"/>
  <text x="420" y="46" font-size="10.5" font-weight="700" fill="#1E40AF" text-anchor="middle">OFFLINE SIM</text>

  <!-- Physics Simulator Box -->
  <rect x="45" y="80" width="415" height="105" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="60" y="104" font-size="12" font-weight="700" fill="#1E293B">Physics Simulation Engine (Massively Parallel GPU)</text>
  
  <rect x="60" y="116" width="385" height="56" rx="4" fill="#F1F5F9"/>
  <text x="75" y="136" font-size="11" font-weight="600" fill="#475569">Privileged Latent State <tspan font-style="italic" fill="#004B87">s<tspan baseline-shift="sub" font-size="8.5">priv</tspan></tspan> (Unobservable on physical robot):</text>
  <text x="75" y="156" font-size="10.5" fill="#334155">• True friction μ  • Contact force F<tspan baseline-shift="sub" font-size="8">n</tspan>  • Terrain elevation z(x,y)  • Payload mass m</text>

  <!-- Teacher Policy Box -->
  <rect x="120" y="235" width="265" height="75" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="252" y="262" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">Teacher Policy π<tspan baseline-shift="sub" font-size="9.5">teacher</tspan>(a | s<tspan baseline-shift="sub" font-size="9.5">priv</tspan>)</text>
  <text x="252" y="282" font-size="11" fill="#475569" text-anchor="middle">Actor-Critic RL (PPO / Model-Based)</text>
  <text x="252" y="298" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">✓ Fast Convergence (No Credit Bottleneck)</text>

  <!-- Arrows in Panel A -->
  <line x1="252" y1="185" x2="252" y2="233" stroke="#004B87" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="262" y="214" font-size="11" font-weight="600" fill="#004B87">s<tspan baseline-shift="sub" font-size="8.5">priv</tspan></text>

  <!-- Action Arrow back to sim -->
  <path d="M 120 272 L 80 272 L 80 187" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="86" y="228" font-size="10.5" font-weight="600" fill="#64748B">Torque a<tspan baseline-shift="sub" font-size="8">t</tspan></text>

  <!-- Teacher Output Banner -->
  <rect x="65" y="355" width="375" height="65" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="80" y="380" font-size="11.5" font-weight="700" fill="#166534">Optimal Teacher Actions Generated:</text>
  <text x="80" y="402" font-size="10.5" fill="#15803D">Produces verified, dynamic action targets a* across millions</text>
  <text x="80" y="415" font-size="10.5" fill="#15803D">of randomized simulation iterations without hardware risk.</text>


  <!-- ==================================================================== -->
  <!-- PANEL (b): PHASE 2 - SENSORIMOTOR STUDENT (DEPLOYMENT)               -->
  <!-- ==================================================================== -->
  <rect x="520" y="20" width="455" height="420" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="520" y="20" width="455" height="42" rx="8" fill="#ECFDF5"/>
  <rect x="520" y="54" width="455" height="8" fill="#ECFDF5"/>
  <line x1="520" y1="62" x2="975" y2="62" stroke="#A7F3D0" stroke-width="1.2"/>

  <text x="540" y="46" font-size="14" font-weight="700" fill="#166534">Phase 2: Sensorimotor Student Distillation</text>
  <rect x="865" y="31" width="95" height="22" rx="4" fill="#D1FAE5"/>
  <text x="912" y="46" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle">EDGE ROBOT</text>

  <!-- Real Onboard Sensors Box -->
  <rect x="540" y="80" width="415" height="95" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="555" y="104" font-size="12" font-weight="700" fill="#1E293B">Real Onboard Sensory Stream (Physical AI Sensors)</text>
  
  <rect x="555" y="114" width="185" height="48" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="565" y="132" font-size="10" font-weight="700" fill="#475569">Proprioception &amp; IMU</text>
  <text x="565" y="148" font-size="9.5" fill="#64748B">Joint angles q, velocities q̇, IMU</text>

  <rect x="755" y="114" width="185" height="48" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="765" y="132" font-size="10" font-weight="700" fill="#475569">Exteroception (Vision / Depth)</text>
  <text x="765" y="148" font-size="9.5" fill="#64748B">RGB-D frames, tactile arrays</text>

  <!-- Temporal History Window -->
  <rect x="575" y="205" width="345" height="52" rx="5" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="747" y="226" font-size="11.5" font-weight="700" fill="#92400E" text-anchor="middle">Sliding Temporal History Buffer o<tspan baseline-shift="sub" font-size="8.5">t-H:t</tspan></text>
  <text x="747" y="244" font-size="10" fill="#78350F" text-anchor="middle">Implicit System Identification: dynamics encoded in past action-response lag</text>

  <!-- Arrow from Sensors to History -->
  <line x1="747" y1="175" x2="747" y2="203" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- Student Policy Box -->
  <rect x="615" y="285" width="265" height="68" rx="6" fill="#F0FDF4" stroke="#1E793C" stroke-width="1.5"/>
  <text x="747" y="310" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">Student Policy π<tspan baseline-shift="sub" font-size="9.5">student</tspan>(a | o<tspan baseline-shift="sub" font-size="9.5">t-H:t</tspan>)</text>
  <text x="747" y="328" font-size="10.5" fill="#475569" text-anchor="middle">Temporal Convolution / Transformer / MLP</text>
  <text x="747" y="342" font-size="9.5" font-weight="600" fill="#15803D" text-anchor="middle">Runs in real-time on edge NPU/SoC</text>

  <!-- Arrow from History to Student -->
  <line x1="747" y1="257" x2="747" y2="283" stroke="#1E793C" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Output Action Arrow -->
  <line x1="747" y1="353" x2="747" y2="390" stroke="#1E793C" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="757" y="380" font-size="10.5" font-weight="700" fill="#1E793C">Motor Action a<tspan baseline-shift="sub" font-size="8">t</tspan></text>

  <!-- Inter-Panel Distillation Arcs (Connecting Teacher to Student) -->
  <path d="M 385 272 C 450 272, 500 315, 613 315" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-purple)"/>
  
  <rect x="445" y="278" width="115" height="34" rx="4" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.2"/>
  <text x="502" y="293" font-size="10" font-weight="700" fill="#6B21A8" text-anchor="middle">Supervised Distillation</text>
  <text x="502" y="306" font-size="8.5" fill="#7E22CE" text-anchor="middle">min ||π<tspan baseline-shift="sub" font-size="7">stu</tspan> - a*||² (DAgger)</text>

</svg>
