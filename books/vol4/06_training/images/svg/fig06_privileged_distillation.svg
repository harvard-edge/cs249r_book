<text x="570" y="128" font-size="9" font-weight="700" fill="#1A202C" text-anchor="middle">history o<tspan font-size="8" dy="2">t−H:t</tspan><tspan dy="-2"></tspan></text>
<line x1="570" y1="142" x2="570" y2="170" stroke="#007A87" stroke-width="1.3" marker-end="url(#arr-petrol)"/>
<rect x="478" y="172" width="184" height="54" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
<text x="570" y="194" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">student π<tspan font-size="8" dy="2">S</tspan><tspan dy="-2"></tspan>, frozen</text>
<text x="570" y="211" font-size="8.5" font-weight="400" fill="#4A5568" text-anchor="middle">renews every 50 ms</text>
<line x1="432" y1="233" x2="476" y2="199" stroke="#4A5568" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arr-slate)"/>
<text x="470" y="246" font-size="8.5" font-weight="400" fill="#4A5568" text-anchor="start">same weights</text>
<line x1="570" y1="226" x2="570" y2="300" stroke="#B87333" stroke-width="1.3" marker-end="url(#arr-bronze)"/>
<text x="578" y="250" font-size="8.5" font-weight="700" fill="#B87333" text-anchor="start">proposal â</text>
<text x="578" y="264" font-size="8.5" font-weight="400" fill="#B87333" text-anchor="start">25 ms setpoints</text>
<line x1="478" y1="282" x2="662" y2="282" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="6,4"/>
