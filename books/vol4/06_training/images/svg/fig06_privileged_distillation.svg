<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-51.0" y="-21.5" width="1122.0" height="473.0" fill="#ffffff"/>
  
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0D9488"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1020" height="430" fill="#FFFFFF"/>

  <!-- Sub-Panel Headers -->
  <text x="255" y="27" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">(a) Privileged Oracle (Simulation RL)</text>
  <text x="755" y="27" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">(b) Sensorimotor Student (Edge Inference)</text>

  <!-- Panel Divider -->
  <line x1="510" y1="16" x2="510" y2="416" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): PRIVILEGED TEACHER IN SIMULATION                          -->
  <!-- ==================================================================== -->
  <g id="panel-a">
    <!-- Top Container: Physics Simulator -->
    <rect x="35" y="42" width="440" height="142" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="50" y="62" font-size="11" font-weight="700" fill="#1E293B">Physics Simulation Environment (GPU Vectorized)</text>
    
    <!-- Environment badge -->
    <rect x="375" y="50" width="90" height="17" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
    <text x="420" y="62" font-size="8" font-weight="700" fill="#1E40AF" text-anchor="middle">OFFLINE ORACLE</text>

    <!-- Sub-card: Privileged Latent State Vector -->
    <g transform="translate(47, 72)">
      <rect width="416" height="50" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.9"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#1F407A">Privileged State s<tspan baseline-shift="sub" font-size="80%">priv</tspan> (Unobservable on physical robot)</text>
      
      <!-- Parameter chips -->
      <g transform="translate(10, 24)">
        <rect x="0" y="0" width="88" height="19" rx="2" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
        <text x="44" y="13" font-size="8" font-family="'Menlo', monospace" fill="#1E40AF" text-anchor="middle">Friction μ</text>

        <rect x="96" y="0" width="94" height="19" rx="2" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
        <text x="143" y="13" font-size="8" font-family="'Menlo', monospace" fill="#1E40AF" text-anchor="middle">Terrain z(x,y)</text>

        <rect x="198" y="0" width="102" height="19" rx="2" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
        <text x="249" y="13" font-size="8" font-family="'Menlo', monospace" fill="#1E40AF" text-anchor="middle">Mass &amp; Inertia m</text>

        <rect x="308" y="0" width="88" height="19" rx="2" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
        <text x="352" y="13" font-size="8" font-family="'Menlo', monospace" fill="#1E40AF" text-anchor="middle">Wrench F<tspan baseline-shift="sub" font-size="80%">ext</tspan></text>
      </g>
    </g>

    <!-- Sub-card: Observable Proprioception -->
    <g transform="translate(47, 128)">
      <rect width="416" height="46" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#475569">Observable Proprioception o<tspan baseline-shift="sub" font-size="80%">t</tspan> (Simulated Encoders)</text>
      
      <g transform="translate(10, 22)">
        <rect x="0" y="0" width="194" height="18" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
        <text x="97" y="12" font-size="8" font-family="'Menlo', monospace" fill="#334155" text-anchor="middle">Joint Encoders [q, q̇]</text>

        <rect x="202" y="0" width="194" height="18" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
        <text x="299" y="12" font-size="8" font-family="'Menlo', monospace" fill="#334155" text-anchor="middle">Base IMU Telemetry [ω, a]</text>
      </g>
    </g>

    <!-- Arrow down to Teacher Policy -->
    <line x1="255" y1="184" x2="255" y2="226" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-navy)"/>
    <rect x="215" y="196" width="80" height="16" rx="2" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="0.7"/>
    <text x="255" y="208" font-size="8.5" font-family="'Menlo', monospace" fill="#1F407A" text-anchor="middle">(s<tspan baseline-shift="sub" font-size="80%">priv</tspan>, o<tspan baseline-shift="sub" font-size="80%">t</tspan>)</text>

    <!-- Middle Box: Teacher Policy -->
    <g transform="translate(102, 228)">
      <rect width="306" height="76" rx="4" fill="#EFF6FF" stroke="#1F407A" stroke-width="1.4"/>
      <text x="153" y="24" font-size="11.5" font-weight="700" fill="#1F407A" text-anchor="middle">Teacher Policy π<tspan baseline-shift="sub" font-size="80%">teacher</tspan>(a | s<tspan baseline-shift="sub" font-size="80%">priv</tspan>, o<tspan baseline-shift="sub" font-size="80%">t</tspan>)</text>
      <text x="153" y="42" font-size="9" fill="#475569" text-anchor="middle">Teacher optimization with privileged state</text>

      <rect x="25" y="51" width="256" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/>
      <text x="153" y="63" font-size="8" font-weight="600" fill="#15803D" text-anchor="middle">Privileged feedback during training</text>
    </g>

    <!-- Feedback Arrow from Teacher back to Simulator -->
    <path d="M 102 266 L 50 266 L 50 188" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arr-slate)"/>
    <rect x="35" y="220" width="60" height="15" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.7"/>
    <text x="65" y="231" font-size="7.5" font-weight="600" fill="#475569" text-anchor="middle">Sim Action a*</text>

    <!-- Bottom Box: Domain Randomization Summary -->
    <g transform="translate(35, 332)">
      <rect width="440" height="76" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="20" font-size="10" font-weight="700" fill="#334155">Simulation Domain Randomization (Illustrative Ranges)</text>
      
      <g transform="translate(10, 29)">
        <rect x="0" y="0" width="92" height="18" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.7"/>
        <text x="46" y="12" font-size="8" font-family="'Menlo', monospace" fill="#475569" text-anchor="middle">Mass m ± 30%</text>

        <rect x="100" y="0" width="118" height="18" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.7"/>
        <text x="159" y="12" font-size="8" font-family="'Menlo', monospace" fill="#475569" text-anchor="middle">Friction μ ∈ [0.2, 1.2]</text>

        <rect x="226" y="0" width="100" height="18" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.7"/>
        <text x="276" y="12" font-size="8" font-family="'Menlo', monospace" fill="#475569" text-anchor="middle">Delay τ<tspan baseline-shift="sub" font-size="80%">lag</tspan> ± 15ms</text>

        <rect x="334" y="0" width="88" height="18" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.7"/>
        <text x="378" y="12" font-size="8" font-family="'Menlo', monospace" fill="#475569" text-anchor="middle">Noise σ<tspan baseline-shift="sub" font-size="80%">sensor</tspan></text>
      </g>
      <text x="14" y="64" font-size="8" fill="#64748B">Explores millions of randomized dynamical transitions without physical hardware risk.</text>
    </g>
  </g>

  <!-- ==================================================================== -->
  <!-- DISTILLATION BRIDGE (INTER-PANEL)                                    -->
  <!-- ==================================================================== -->
  <path d="M 408 280 L 600 280" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  
  <g transform="translate(426, 262)">
    <rect width="116" height="36" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="58" y="15" font-size="8.5" font-weight="700" fill="#6D28D9" text-anchor="middle">Imitation / DAgger</text>
    <text x="58" y="28" font-size="7.5" font-family="'Menlo', monospace" fill="#7C3AED" text-anchor="middle">min ||&#8201;π<tspan baseline-shift="sub" font-size="75%">stu</tspan> − a*&#8201;||²</text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): SENSORIMOTOR STUDENT INFERENCE                            -->
  <!-- ==================================================================== -->
  <g id="panel-b">
    <!-- Top Container: Real-World Ingress -->
    <rect x="535" y="42" width="415" height="114" rx="4" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
    <text x="550" y="62" font-size="11" font-weight="700" fill="#0F766E">Physical Sensor Transduction (Real Machine)</text>
    
    <!-- Edge Hardware badge -->
    <rect x="845" y="50" width="95" height="17" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="892" y="62" font-size="8" font-weight="700" fill="#065F46" text-anchor="middle">DEPLOYED PLANT</text>

    <!-- Proprioceptive stream card -->
    <g transform="translate(547, 72)">
      <rect width="190" height="74" rx="3" fill="#FFFFFF" stroke="#99F6E4" stroke-width="0.9"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0F766E">Proprioceptive Stream</text>
      <rect x="10" y="24" width="170" height="18" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.7"/>
      <text x="95" y="36" font-size="7.5" font-family="'Menlo', monospace" fill="#334155" text-anchor="middle">Joint Encoders [q, q̇]</text>
      <rect x="10" y="47" width="170" height="18" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.7"/>
      <text x="95" y="59" font-size="7.5" font-family="'Menlo', monospace" fill="#334155" text-anchor="middle">Motor Currents &amp; IMU</text>
    </g>

    <!-- Exteroceptive stream card -->
    <g transform="translate(747, 72)">
      <rect width="190" height="74" rx="3" fill="#FFFFFF" stroke="#99F6E4" stroke-width="0.9"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0F766E">Exteroceptive Stream</text>
      <rect x="10" y="24" width="170" height="18" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.7"/>
      <text x="95" y="36" font-size="7.5" font-family="'Menlo', monospace" fill="#334155" text-anchor="middle">RGB-D Vision Frames I<tspan baseline-shift="sub" font-size="80%">t</tspan></text>
      <rect x="10" y="47" width="170" height="18" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.7"/>
      <text x="95" y="59" font-size="7.5" font-family="'Menlo', monospace" fill="#334155" text-anchor="middle">Wrist Depth &amp; Tactile</text>
    </g>

    <!-- Arrow from Sensors to History Window -->
    <line x1="742" y1="156" x2="742" y2="175" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arr-teal)"/>

    <!-- Middle Container: Sliding History Window -->
    <g transform="translate(545, 176)">
      <rect width="395" height="64" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="197" y="17" font-size="10.5" font-weight="700" fill="#92400E" text-anchor="middle">Sliding Temporal Observation Buffer o<tspan baseline-shift="sub" font-size="80%">t−H:t</tspan></text>

      <!-- History Buffer Register Tape -->
      <g transform="translate(18, 24)">
        <rect x="0" y="0" width="65" height="19" rx="2" fill="#FFFFFF" stroke="#FCD34D" stroke-width="0.8"/>
        <text x="32" y="13" font-size="7.5" font-family="'Menlo', monospace" fill="#92400E" text-anchor="middle">o<tspan baseline-shift="sub" font-size="75%">t−H</tspan></text>

        <rect x="72" y="0" width="45" height="19" rx="2" fill="#FFFFFF" stroke="#FCD34D" stroke-width="0.8"/>
        <text x="94" y="13" font-size="7.5" font-family="'Menlo', monospace" fill="#92400E" text-anchor="middle">···</text>

        <rect x="124" y="0" width="68" height="19" rx="2" fill="#FFFFFF" stroke="#FCD34D" stroke-width="0.8"/>
        <text x="158" y="13" font-size="7.5" font-family="'Menlo', monospace" fill="#92400E" text-anchor="middle">o<tspan baseline-shift="sub" font-size="75%">t−2</tspan></text>

        <rect x="199" y="0" width="68" height="19" rx="2" fill="#FFFFFF" stroke="#FCD34D" stroke-width="0.8"/>
        <text x="233" y="13" font-size="7.5" font-family="'Menlo', monospace" fill="#92400E" text-anchor="middle">o<tspan baseline-shift="sub" font-size="75%">t−1</tspan></text>

        <rect x="274" y="0" width="85" height="19" rx="2" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
        <text x="316" y="13" font-size="7.5" font-family="'Menlo', monospace" font-weight="700" fill="#B45309" text-anchor="middle">o<tspan baseline-shift="sub" font-size="75%">t</tspan> (Current)</text>
      </g>
      <text x="197" y="56" font-size="8" fill="#78350F" text-anchor="middle">Learned state estimate: validate identifiability from sensor history</text>
    </g>

    <!-- Arrow down from History to Student -->
    <line x1="742" y1="240" x2="742" y2="265" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Lower-Middle Container: Student Policy -->
    <g transform="translate(600, 267)">
      <rect width="285" height="66" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
      <text x="142" y="22" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">Student Policy π<tspan baseline-shift="sub" font-size="80%">student</tspan>(a | o<tspan baseline-shift="sub" font-size="80%">t−H:t</tspan>)</text>
      <text x="142" y="39" font-size="9" fill="#475569" text-anchor="middle">Causal Transformer / Temporal 1D-CNN</text>

      <rect x="25" y="46" width="235" height="15" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/>
      <text x="142" y="57" font-size="7.5" font-weight="600" fill="#15803D" text-anchor="middle">Edge SoC / NPU Inference (Illustrative: 50–100 Hz)</text>
    </g>

    <!-- Student proposal enters permission decision before actuation -->
    <line x1="742" y1="333" x2="742" y2="353" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="752" y="347" font-size="8.5" font-family="'Menlo', monospace" font-weight="700" fill="#059669">a<tspan baseline-shift="sub" font-size="80%">t</tspan> proposal</text>

    <!-- Bottom Container: Physical Hardware Plant -->
    <g transform="translate(545, 355)">
      <rect width="395" height="53" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
      <text x="14" y="18" font-size="10" font-weight="700" fill="#0F172A">Permission Decision → Low-Level Actuation → Plant</text>
      
      <g transform="translate(14, 27)">
        <rect x="0" y="0" width="112" height="18" rx="0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="56" y="12" font-size="8" font-family="'Menlo', monospace" fill="#334155" text-anchor="middle">Inverter Gate Drivers</text>

        <rect x="120" y="0" width="116" height="18" rx="0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="178" y="12" font-size="8" font-family="'Menlo', monospace" fill="#334155" text-anchor="middle">BLDC Joint Motors</text>

        <rect x="244" y="0" width="124" height="18" rx="0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="306" y="12" font-size="8" font-family="'Menlo', monospace" fill="#334155" text-anchor="middle">Contact Friction &amp; Wear</text>
      </g>
    </g>

    <!-- Physical Perimeter Feedback Loop -->
    <path d="M 940 381 L 968 381 L 968 99 L 950 99" fill="none" stroke="#0D9488" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-teal)"/>
    <g transform="translate(945, 226)">
      <rect width="46" height="28" rx="2" fill="#FFFFFF" stroke="#99F6E4" stroke-width="0.8"/>
      <text x="23" y="12" font-size="7.5" font-family="'Menlo', monospace" font-weight="700" fill="#0D9488" text-anchor="middle">o<tspan baseline-shift="sub" font-size="75%">t+1</tspan></text>
      <text x="23" y="23" font-size="6.5" fill="#0F766E" text-anchor="middle">Feedback</text>
    </g>
  </g>
</svg>
