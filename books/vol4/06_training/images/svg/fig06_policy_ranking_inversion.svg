<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 275" width="900" height="275">
  <defs>
    <style>
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
      .group-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748B; text-anchor: middle; }
      .card-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .card-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #E2E8F0; text-anchor: middle; }
      .status-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#1F407A" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#A51C30" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="275" fill="#FFFFFF" />
  <g transform="translate(0, -25)">

  <!-- ==================== GROUP 1: Flow Regulation ==================== -->
  <g transform="translate(40, 50)">
    <rect width="260" height="225" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="130" y="26" class="group-title">1. Flow Regulation</text>
    <text x="130" y="44" class="group-sub">Sanitize Recovery Runs</text>
    
    <!-- Train Metric Card (Navy) -->
    <rect x="14" y="65" width="112" height="48" rx="3" fill="#1F407A" stroke="#1F407A" stroke-width="1" />
    <text x="70" y="84" class="card-hdr">Train Metric</text>
    <text x="70" y="100" class="card-val">Val Loss: 0.011 (4&#215; drop)</text>
    
    <!-- Hardware Reality Card (Crimson) -->
    <rect x="134" y="65" width="112" height="48" rx="3" fill="#A51C30" stroke="#A51C30" stroke-width="1" />
    <text x="190" y="84" class="card-hdr">Hardware Reality</text>
    <text x="190" y="100" class="card-val">Recovery: 0%</text>
    
    <!-- Down Arrows -->
    <path fill="none" d="M 70 113 L 70 152" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)" />
    <path fill="none" d="M 190 113 L 190 152" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arrow-red)" />

    <!-- Status Badges -->
    <rect x="36" y="155" width="68" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" />
    <text x="70" y="171" class="status-text" fill="#047857">Success</text>

    <rect x="156" y="155" width="68" height="24" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" />
    <text x="190" y="171" class="status-text" fill="#B91C1C">Failure</text>

    <text x="130" y="205" font-size="10" fill="#64748B" text-anchor="middle">Offline loss fails to predict</text>
    <text x="130" y="217" font-size="10" fill="#64748B" text-anchor="middle">closed-loop recovery failure</text>
  </g>

  <!-- ==================== GROUP 2: Surface Touchdown ==================== -->
  <g transform="translate(320, 50)">
    <rect width="260" height="225" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="130" y="26" class="group-title">2. Surface Touchdown</text>
    <text x="130" y="44" class="group-sub">Unbraked Plunge</text>
    
    <!-- Train Metric Card (Navy) -->
    <rect x="14" y="65" width="112" height="48" rx="3" fill="#1F407A" stroke="#1F407A" stroke-width="1" />
    <text x="70" y="84" class="card-hdr">Train Metric</text>
    <text x="70" y="100" class="card-val">Sim Return: +28%</text>
    
    <!-- Hardware Reality Card (Crimson) -->
    <rect x="134" y="65" width="112" height="48" rx="3" fill="#A51C30" stroke="#A51C30" stroke-width="1" />
    <text x="190" y="84" class="card-hdr">Hardware Reality</text>
    <text x="190" y="100" class="card-val">Force: 68 N (Break)</text>
    
    <!-- Down Arrows -->
    <path fill="none" d="M 70 113 L 70 152" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)" />
    <path fill="none" d="M 190 113 L 190 152" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arrow-red)" />

    <!-- Status Badges -->
    <rect x="36" y="155" width="68" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" />
    <text x="70" y="171" class="status-text" fill="#047857">Success</text>

    <rect x="156" y="155" width="68" height="24" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" />
    <text x="190" y="171" class="status-text" fill="#B91C1C">Failure</text>

    <text x="130" y="205" font-size="10" fill="#64748B" text-anchor="middle">Rigid sim rewards speed;</text>
    <text x="130" y="217" font-size="10" fill="#64748B" text-anchor="middle">real hardware breaks end-effector</text>
  </g>
  
  <!-- ==================== GROUP 3: Regime Transition ==================== -->
  <g transform="translate(600, 50)">
    <rect width="260" height="225" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="130" y="26" class="group-title">3. Regime Transition</text>
    <text x="130" y="44" class="group-sub">Simulation RL</text>
    
    <!-- Train Metric Card (Navy) -->
    <rect x="14" y="65" width="112" height="48" rx="3" fill="#1F407A" stroke="#1F407A" stroke-width="1" />
    <text x="70" y="84" class="card-hdr">Train Metric</text>
    <text x="70" y="100" class="card-val">Sim Task: 100%</text>
    
    <!-- Hardware Reality Card (Crimson) -->
    <rect x="134" y="65" width="112" height="48" rx="3" fill="#A51C30" stroke="#A51C30" stroke-width="1" />
    <text x="190" y="84" class="card-hdr">Hardware Reality</text>
    <text x="190" y="100" class="card-val">Chatter / Trip: 12%</text>
    
    <!-- Down Arrows -->
    <path fill="none" d="M 70 113 L 70 152" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arrow-blue)" />
    <path fill="none" d="M 190 113 L 190 152" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arrow-red)" />

    <!-- Status Badges -->
    <rect x="36" y="155" width="68" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" />
    <text x="70" y="171" class="status-text" fill="#047857">Success</text>

    <rect x="156" y="155" width="68" height="24" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" />
    <text x="190" y="171" class="status-text" fill="#B91C1C">Failure</text>

    <text x="130" y="205" font-size="10" fill="#64748B" text-anchor="middle">Sim policy excites high-freq</text>
    <text x="130" y="217" font-size="10" fill="#64748B" text-anchor="middle">resonances tripping MCU barrier</text>
  </g>
  </g>
</svg>
