<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-46.0" y="-14.0" width="1012.0" height="308.0" fill="#ffffff"/>
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; }
      .axis-hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .policy-red { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #DC2626; }
      .policy-green { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #16A34A; }
      .inversion-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #64748B; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
      .math-code { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #DC2626; }
    </style>

    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="280" fill="#FFFFFF" />

  <!-- ===================================================================== -->
  <!-- PANEL A: Ranking Inversion Slope Graph                                -->
  <!-- ===================================================================== -->
  <g transform="translate(25, 18)">
    <rect width="465" height="244" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="20" y="28" class="panel-title">(a) Ranking Inversion</text>

    <!-- Left Axis: Simulated Benchmark -->
    <path d="M 125 210 L 125 55" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)" />
    <text x="125" y="46" class="axis-hdr">Simulation</text>

    <!-- Right Axis: Physical Hardware Yield -->
    <path d="M 355 210 L 355 55" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)" />
    <text x="355" y="46" class="axis-hdr">Hardware</text>

    <!-- Crossover Lines -->
    <!-- Policy Exploit (Red line) -->
    <line x1="125" y1="80" x2="355" y2="195" stroke="#DC2626" stroke-width="2.5" />

    <!-- Policy Robust (Green line) -->
    <line x1="125" y1="195" x2="355" y2="80" stroke="#16A34A" stroke-width="2.5" />

    <!-- Policy Nominal (Muted dashed line) -->
    <line x1="125" y1="138" x2="355" y2="138" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" />

    <!-- Policy Dots Left -->
    <circle cx="125" cy="80" r="4.5" fill="#DC2626" />
    <text x="115" y="84" class="policy-red" text-anchor="end">&#960;<tspan baseline-shift="sub" font-size="8px">exploit</tspan></text>

    <circle cx="125" cy="195" r="4.5" fill="#16A34A" />
    <text x="115" y="199" class="policy-green" text-anchor="end">&#960;<tspan baseline-shift="sub" font-size="8px">robust</tspan></text>

    <!-- Policy Dots Right -->
    <circle cx="355" cy="80" r="4.5" fill="#16A34A" />
    <text x="365" y="84" class="policy-green" text-anchor="start">&#960;<tspan baseline-shift="sub" font-size="8px">robust</tspan></text>

    <circle cx="355" cy="195" r="4.5" fill="#DC2626" />
    <text x="365" y="199" class="policy-red" text-anchor="start">&#960;<tspan baseline-shift="sub" font-size="8px">exploit</tspan></text>

    <!-- Inversion Annotation at crossover -->
    <circle cx="240" cy="138" r="3" fill="#64748B" />
    <text x="240" y="116" class="inversion-label">Ranking Flip</text>
    <line x1="240" y1="120" x2="240" y2="132" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2" />
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL B: Causal Mechanisms                                            -->
  <!-- ===================================================================== -->
  <g transform="translate(510, 18)">
    <rect width="385" height="244" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="20" y="28" class="panel-title">(b) Causal Mechanisms</text>

    <!-- Case 1: Data Sanitization -->
    <rect x="20" y="44" width="345" height="54" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="20" y1="44" x2="20" y2="98" stroke="#DC2626" stroke-width="4" />
    <text x="35" y="66" class="card-title">1. Sanitization: Drift</text>
    <text x="35" y="85" class="math-code">s &#8713; S<tspan baseline-shift="sub" font-size="8">demo</tspan> (OOD Extrapolation)</text>

    <!-- Case 2: Contact Mechanics -->
    <rect x="20" y="106" width="345" height="54" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="20" y1="106" x2="20" y2="160" stroke="#DC2626" stroke-width="4" />
    <text x="35" y="128" class="card-title">2. Rigid Contact: Spike</text>
    <text x="35" y="147" class="math-code">F<tspan baseline-shift="sub" font-size="8">peak</tspan> &gt; F<tspan baseline-shift="sub" font-size="8">limit</tspan> (Flexure Failure)</text>

    <!-- Case 3: Resonant Chatter -->
    <rect x="20" y="168" width="345" height="54" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="20" y1="168" x2="20" y2="222" stroke="#DC2626" stroke-width="4" />
    <text x="35" y="190" class="card-title">3. Ideal Drive: Chatter</text>
    <text x="35" y="209" class="math-code">f<tspan baseline-shift="sub" font-size="8">act</tspan> &#8776; &#969;<tspan baseline-shift="sub" font-size="8">res</tspan> (Thermal Trip)</text>
  </g>
</svg>
