<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007A87"/></marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87333"/></marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A4D3E"/></marker>
  </defs>

  <!-- ===== 1. observation conditioning (measured) ===== -->
  <g transform="translate(14,14)">
    <rect width="180" height="262" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="22" font-size="10.5" font-weight="700" fill="#1A202C">Observation</text>
    <rect x="14" y="40" width="152" height="54" rx="3" fill="#ffffff" stroke="#007A87" stroke-width="1.2"/>
    <text x="90" y="62" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">camera images,</text>
    <text x="90" y="78" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">robot state</text>
    <line x1="90" y1="94" x2="90" y2="128" stroke="#007A87" stroke-width="1.4" marker-end="url(#arr-petrol)"/>
    <text x="98" y="115" font-size="8.5" fill="#4A5568">encoder</text>
    <rect x="14" y="132" width="152" height="54" rx="3" fill="#E6F4F5" stroke="#007A87" stroke-width="1.2"/>
    <text x="90" y="154" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">conditioning</text>
    <text x="90" y="172" font-size="9.5" fill="#1A202C" text-anchor="middle">history <tspan font-weight="700">O</tspan><tspan font-size="7" dy="2">t</tspan></text>
  </g>

  <!-- ===== 2. denoising (proposal) ===== -->
  <g transform="translate(250,14)">
    <rect width="190" height="262" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="22" font-size="10.5" font-weight="700" fill="#1A202C">Denoising</text>
    <rect x="14" y="40" width="162" height="40" rx="3" fill="#ffffff" stroke="#A0AEC0" stroke-width="1"/>
    <text x="95" y="64" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">noise <tspan font-weight="700">A</tspan><tspan font-size="7" dy="-4">N</tspan></text>
    <line x1="95" y1="80" x2="95" y2="104" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <rect x="14" y="108" width="162" height="56" rx="3" fill="#ffffff" stroke="#B87333" stroke-width="1.2"/>
    <text x="95" y="131" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">noise network ε<tspan font-size="7" dy="2">θ</tspan></text>
    <text x="95" y="151" font-size="8.5" fill="#4A5568" text-anchor="middle">N<tspan font-size="6.5" dy="2">eval</tspan><tspan dy="-2" dx="3">sequential steps</tspan></text>
    <line x1="95" y1="164" x2="95" y2="188" stroke="#B87333" stroke-width="1.4" marker-end="url(#arr-bronze)"/>
    <rect x="14" y="192" width="162" height="44" rx="3" fill="#FBF3EC" stroke="#B87333" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="95" y="212" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">candidate chunk <tspan font-weight="700">A</tspan><tspan font-size="7" dy="-4">0</tspan></text>
    <text x="95" y="228" font-size="8.5" fill="#4A5568" text-anchor="middle">H<tspan font-size="6.5" dy="2">a</tspan><tspan dy="-2" dx="3">steps × D</tspan><tspan font-size="6.5" dy="2">a</tspan></text>
  </g>

  <!-- ===== 3. dispatch and permission ===== -->
  <g transform="translate(486,14)">
    <rect width="180" height="262" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="22" font-size="10.5" font-weight="700" fill="#1A202C">Dispatch</text>
    <!-- horizon bracket -->
    <line x1="14" y1="44" x2="166" y2="44" stroke="#4A5568" stroke-width="1"/>
    <line x1="14" y1="40" x2="14" y2="48" stroke="#4A5568" stroke-width="1"/>
    <line x1="166" y1="40" x2="166" y2="48" stroke="#4A5568" stroke-width="1"/>
    <text x="90" y="38" font-size="8.5" fill="#4A5568" text-anchor="middle">prediction horizon H<tspan font-size="6.5" dy="2">a</tspan></text>
    <rect x="14" y="52" width="72" height="34" rx="3" fill="#FBF3EC" stroke="#B87333" stroke-width="1.2"/>
    <text x="50" y="67" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle">prefix H<tspan font-size="6.5" dy="2">e</tspan></text>
    <text x="50" y="79" font-size="8" fill="#4A5568" text-anchor="middle">sent</text>
    <rect x="94" y="52" width="72" height="34" rx="3" fill="#ffffff" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="130" y="73" font-size="8.5" fill="#4A5568" text-anchor="middle">discarded</text>

    <line x1="50" y1="86" x2="50" y2="126" stroke="#B87333" stroke-width="1.4" marker-end="url(#arr-bronze)"/>
    <text x="58" y="110" font-size="8.5" fill="#4A5568">proposal boundary</text>
    <line x1="10" y1="100" x2="170" y2="100" stroke="#4A5568" stroke-width="1" stroke-dasharray="6,4"/>

    <rect x="14" y="130" width="152" height="54" rx="0" fill="#EEF4F2" stroke="#1A4D3E" stroke-width="1.4"/>
    <text x="90" y="152" font-size="9.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">permission path</text>
    <text x="90" y="170" font-size="8.5" fill="#4A5568" text-anchor="middle">1 kHz tick</text>

    <line x1="90" y1="184" x2="90" y2="222" stroke="#1A4D3E" stroke-width="1.4" marker-end="url(#arr-pine)"/>
    <text x="98" y="200" font-size="8.5" font-weight="700" fill="#1A4D3E">admitted</text>
    <text x="98" y="212" font-size="8.5" font-weight="700" fill="#1A4D3E">command</text>

    <rect x="34" y="226" width="112" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <text x="90" y="245" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">drives</text>
  </g>

  <!-- inter-block arrows -->
  <path d="M 180 173 L 222 173 L 222 150 L 262 150" fill="none" stroke="#007A87" stroke-width="1.4" marker-end="url(#arr-petrol)"/>
  <path d="M 426 228 L 462 228 L 462 83 L 498 83" fill="none" stroke="#B87333" stroke-width="1.4" marker-end="url(#arr-bronze)"/>
</svg>
