<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; text-transform: uppercase; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; line-height: 1.4; }
    .math-text { font-family: "STIX Two Text", "Cambria Math", Georgia, serif; font-size: 12px; font-style: italic; fill: #0f172a; }
    .code-pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 600; fill: #334155; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="435" fill="#ffffff" rx="12"/>
  <rect x="8" y="8" width="944" height="419" fill="#fafafa" rx="10" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <text x="30" y="32" class="header-text" fill="#0f172a">Diffusion Policy Architecture</text>
  <text x="265" y="32" font-family="-apple-system, sans-serif" font-size="11.5px" fill="#64748b">Continuous Trajectory Denoising &amp; Receding-Horizon Decoupling</text>
  <text x="930" y="32" text-anchor="end" font-family="ui-monospace, monospace" font-size="10.5px" fill="#64748b">Adapted from Chi et al. (2024)</text>
  <line x1="30" y1="42" x2="930" y2="42" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- ==================== COLUMN 1: OBSERVATION INGRESS ==================== -->
  <g transform="translate(30, 56)">
    <!-- Column Frame -->
    <rect width="250" height="355" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="10" width="165" height="20" rx="4" fill="#dbeafe"/>
    <text x="20" y="24" class="code-pill" fill="#1e40af">1. SENSORY OBSERVATIONS (Ot)</text>

    <!-- Multi-View Camera Card -->
    <g transform="translate(12, 38)">
      <rect width="226" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" filter="url(#card-shadow)"/>
      <circle cx="20" cy="18" r="4" fill="#3b82f6"/>
      <text x="32" y="22" class="card-title">Multi-View Visual Streams</text>
      <text x="14" y="42" class="card-desc">Third-person overhead + in-hand wrist</text>
      <text x="14" y="58" class="card-desc">Observation Horizon: <tspan class="math-text">To = 2</tspan> steps (t-1, t)</text>
      <rect x="14" y="68" width="86" height="14" rx="3" fill="#bfdbfe"/>
      <text x="18" y="79" class="code-pill" fill="#1e3a8a">RGB (3×H×W)</text>
      <rect x="106" y="68" width="105" height="14" rx="3" fill="#dbeafe"/>
      <text x="110" y="79" class="code-pill" fill="#1e40af">ResNet / ViT Base</text>
    </g>

    <!-- Visual Feature Arrow -->
    <line x1="125" y1="126" x2="125" y2="148" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="132" y="141" class="sub-text" fill="#2563eb" font-size="9.5px">visual tokens</text>

    <!-- Proprioception & State Card -->
    <g transform="translate(12, 152)">
      <rect width="226" height="74" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" filter="url(#card-shadow)"/>
      <circle cx="20" cy="18" r="4" fill="#3b82f6"/>
      <text x="32" y="22" class="card-title">Proprioceptive Telemetry</text>
      <text x="14" y="42" class="card-desc">Joint angles <tspan class="math-text">qt</tspan>, velocities <tspan class="math-text">q̇t</tspan>, gripper state</text>
      <text x="14" y="58" class="card-desc">Linear projection to feature dim <tspan class="math-text">Dobs</tspan></text>
    </g>

    <!-- Combined Conditioning Vector Card -->
    <g transform="translate(12, 244)">
      <rect width="226" height="96" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#card-shadow)"/>
      <rect x="10" y="10" width="105" height="16" rx="3" fill="#ede9fe"/>
      <text x="15" y="22" class="code-pill" fill="#6d28d9">FiLM CONDITIONING</text>
      <text x="14" y="46" class="card-desc">Concatenated Observation Feature:</text>
      <text x="14" y="64" class="math-text" font-size="12px">Ot = [fvis,wrist, fvis,base, qprop] ∈ ℝDobs</text>
      <text x="14" y="82" class="sub-text">Injected into every denoising layer</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: DIFFUSION BACKBONE ==================== -->
  <g transform="translate(305, 56)">
    <!-- Column Frame -->
    <rect width="330" height="355" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="14" y="10" width="190" height="20" rx="4" fill="#d1fae5"/>
    <text x="22" y="24" class="code-pill" fill="#065f46">2. DENOISING BACKBONE (εθ)</text>

    <!-- Pure Noise Injection (Top) -->
    <g transform="translate(14, 38)">
      <rect width="302" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#card-shadow)"/>
      <text x="14" y="20" class="card-title">Initial Pure Gaussian Noise</text>
      <text x="14" y="38" class="math-text">Ak ~ 𝒩(0, I)  where  k = Ndiff (16 DDIM steps)</text>
    </g>

    <line x1="165" y1="86" x2="165" y2="102" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

    <!-- Neural Denoiser Architecture Block -->
    <g transform="translate(14, 104)">
      <rect width="302" height="172" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4" filter="url(#card-shadow)"/>
      <text x="14" y="20" class="card-title">Noise-Prediction Network εθ(Ak, Ot, k)</text>
      <text x="14" y="35" class="sub-text">1D Temporal Convolutional U-Net or Time-Transformer</text>

      <!-- Internal U-Net Flow Visual -->
      <g transform="translate(14, 60)">
        <rect x="0" y="6" width="80" height="40" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
        <text x="8" y="24" class="code-pill" fill="#15803d">Down-Conv</text>
        <text x="8" y="38" font-size="9px" fill="#475569">Temporal 1D</text>

        <rect x="97" y="16" width="80" height="42" rx="5" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.2"/>
        <text x="105" y="32" class="code-pill" fill="#166534">Mid-Blocks</text>
        <text x="105" y="46" font-size="9px" fill="#14532d">FiLM Residuals</text>

        <rect x="194" y="6" width="80" height="40" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
        <text x="202" y="24" class="code-pill" fill="#15803d">Up-Conv</text>
        <text x="202" y="38" font-size="9px" fill="#475569">Skip Connect</text>

        <!-- Skip connection arc -->
        <path d="M 40 6 C 40 -10, 234 -10, 234 6" fill="none" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="2 2"/>
        <text x="137" y="-12" text-anchor="middle" font-size="8.5px" fill="#15803d" font-weight="600">Skip Highway</text>

        <line x1="80" y1="32" x2="97" y2="32" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrow-green)"/>
        <line x1="177" y1="32" x2="194" y2="32" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrow-green)"/>
      </g>

      <!-- Timestep injection -->
      <rect x="14" y="132" width="274" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="22" y="150" class="sub-text">Diffusion Timestep Embedding: <tspan class="math-text">e(k) = [sin(ωk), cos(ωk)]</tspan></text>
    </g>

    <line x1="165" y1="276" x2="165" y2="292" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

    <!-- Reverse Diffusion Output -->
    <g transform="translate(14, 294)">
      <rect width="302" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="14" y="20" class="card-title">Iterative Denoised Action Chunk (A0)</text>
      <text x="14" y="38" class="math-text">At0 = [at, at+1, ..., at+Tp-1] ∈ ℝTp × Da</text>
    </g>
  </g>

  <!-- FiLM Conditioning Connector Bus (Col 1 -> Col 2) -->
  <path d="M 268 335 C 288 335, 288 200, 319 200" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="4 3"/>
  <circle cx="268" cy="335" r="3.5" fill="#7c3aed"/>
  <circle cx="319" cy="200" r="3.5" fill="#7c3aed"/>
  <rect x="274" y="255" width="32" height="16" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="277" y="266" class="code-pill" fill="#5b21b6" font-size="8.5px">FiLM</text>

  <!-- ==================== COLUMN 3: ACTION DISPATCH & SAFETY ==================== -->
  <g transform="translate(660, 56)">
    <!-- Column Frame -->
    <rect width="270" height="355" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="14" y="10" width="180" height="20" rx="4" fill="#fef3c7"/>
    <text x="22" y="24" class="code-pill" fill="#92400e">3. EXECUTION &amp; RE-PLANNING</text>

    <!-- Prediction vs Execution Horizon Card -->
    <g transform="translate(14, 38)">
      <rect width="242" height="108" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="12" y="22" class="card-title">Receding-Horizon Chunking</text>
      <text x="12" y="39" class="card-desc">Prediction Horizon: <tspan class="math-text">Tp = 16</tspan> steps ahead</text>
      <text x="12" y="54" class="card-desc">Execution Horizon: <tspan class="math-text">Ta = 8</tspan> steps committed</text>

      <!-- Visual horizon bar -->
      <g transform="translate(12, 64)">
        <rect x="0" y="0" width="105" height="18" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
        <text x="12" y="13" class="code-pill" fill="#78350f">Ta = 8 Executed</text>

        <rect x="109" y="0" width="105" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 2"/>
        <text x="120" y="13" class="code-pill" fill="#92400e">Tp-Ta Discarded</text>
      </g>
      <text x="12" y="98" class="sub-text" font-size="9px">Re-plans fresh chunk at step t+Ta (Receding Horizon)</text>
    </g>

    <!-- Arrow down to lockfree ring buffer -->
    <line x1="135" y1="146" x2="135" y2="168" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

    <!-- Lock-Free Ring Buffer Transfer -->
    <g transform="translate(14, 170)">
      <rect width="242" height="66" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" filter="url(#card-shadow)"/>
      <rect x="10" y="8" width="130" height="15" rx="3" fill="#e2e8f0"/>
      <text x="14" y="19" class="code-pill" fill="#334155">LOCK-FREE RING BUFFER</text>
      <text x="12" y="39" class="card-desc">Single-Producer Single-Consumer (SPSC)</text>
      <text x="12" y="55" class="card-desc">Unlinks 10-50 Hz MPU from 1 kHz MCU</text>
    </g>

    <!-- Proposal-Permission Boundary Line -->
    <line x1="6" y1="248" x2="264" y2="248" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="52" y="240" width="166" height="16" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="60" y="252" class="code-pill" fill="#991b1b" font-size="8.5px">PROPOSAL-PERMISSION BOUNDARY</text>

    <!-- Real-Time 1000 Hz Reflex Shield -->
    <g transform="translate(14, 268)">
      <rect width="242" height="74" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3" filter="url(#card-shadow)"/>
      <circle cx="18" cy="18" r="4" fill="#dc2626"/>
      <text x="28" y="22" class="card-title" fill="#991b1b">1000 Hz Deterministic Reflex</text>
      <text x="12" y="44" class="card-desc">• Control Barrier Function (CBF-QP) filter</text>
      <text x="12" y="60" class="card-desc">• Slew-rate limiter &amp; stopping envelope clamp</text>
    </g>
  </g>

  <!-- Main Chunk Flow Arrow (Col 2 -> Col 3) -->
  <path d="M 621 318 C 642 318, 642 92, 674 92" fill="none" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="621" cy="318" r="3.5" fill="#b45309"/>
  <circle cx="674" cy="92" r="3.5" fill="#b45309"/>
  <rect x="631" y="200" width="34" height="16" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="635" y="211" class="code-pill" fill="#78350f" font-size="8.5px">CHUNK</text>

</svg>
