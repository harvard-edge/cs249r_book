<svg xmlns="http://www.w3.org/2000/svg" viewBox="28.7 5.3 902.6 275.0" width="902.6" height="275.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-16.4" y="-8.4" width="992.9" height="302.5" fill="#ffffff"/>
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; }
      .block-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
      .math-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #334155; text-anchor: middle; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748B; text-anchor: middle; }
      .bracket-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>

    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#2563EB" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="288" fill="#FFFFFF" />

  <!-- ===================================================================== -->
  <!-- 1. OBSERVATION CONDITIONING (Soft Blue)                               -->
  <!-- ===================================================================== -->
  <g transform="translate(45, 22)">
    <rect width="245" height="242" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="20" y="26" class="block-title" fill="#1E40AF">1. Observation</text>

    <!-- Raw Observation -->
    <rect x="20" y="46" width="205" height="46" rx="4" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1" />
    <text x="122" y="73" class="node-text">Telemetry o<tspan baseline-shift="sub" font-size="8.5px">t</tspan></text>

    <!-- Down arrow -->
    <path d="M 122 92 L 122 128" fill="none" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-blue)" />

    <!-- Conditioning Vector Ot -->
    <rect x="20" y="128" width="205" height="54" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2" />
    <text x="122" y="159" class="node-text" fill="#1E3A8A">Conditioning Vector O<tspan baseline-shift="sub" font-size="8.5px">t</tspan></text>
  </g>

  <!-- ===================================================================== -->
  <!-- 2. DENOISING BACKBONE (Soft Green)                                    -->
  <!-- ===================================================================== -->
  <g transform="translate(345, 22)">
    <rect width="280" height="242" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
    <text x="20" y="26" class="block-title" fill="#166534">2. Denoising Core</text>

    <!-- Gaussian Noise Input -->
    <rect x="20" y="46" width="240" height="38" rx="4" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="1" />
    <text x="140" y="70" class="node-text">Gaussian Noise A<tspan baseline-shift="super" font-size="8.5px">K</tspan></text>

    <!-- Down arrow -->
    <path d="M 140 84 L 140 104" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)" />

    <!-- Denoising Network Box -->
    <rect x="20" y="104" width="240" height="54" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2" />
    <text x="140" y="127" class="node-text">Noise Network &#949;<tspan baseline-shift="sub" font-size="8.5px">&#952;</tspan></text>
    <text x="140" y="145" class="math-text" fill="#15803D">Reverse Step k = K &#8594; 0</text>

    <!-- Down arrow -->
    <path d="M 140 158 L 140 178" fill="none" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arr-green)" />

    <!-- Trajectory Chunk Output -->
    <rect x="20" y="178" width="240" height="42" rx="4" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.2" />
    <text x="140" y="204" class="node-text" fill="#14532D">Action Chunk A<tspan baseline-shift="super" font-size="8.5px">0</tspan></text>
  </g>

  <!-- ===================================================================== -->
  <!-- 3. RECEDING-HORIZON DISPATCH (Soft Amber)                             -->
  <!-- ===================================================================== -->
  <g transform="translate(685, 22)">
    <rect width="230" height="242" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" />
    <text x="16" y="26" class="block-title" fill="#92400E">3. Action Dispatch</text>

    <!-- Chunk Horizon Visualization -->
    <g transform="translate(16, 40)">
      <!-- Bracket line over total Prediction Horizon -->
      <line x1="0" y1="12" x2="198" y2="12" stroke="#94A3B8" stroke-width="1.2" />
      <line x1="0" y1="8" x2="0" y2="16" stroke="#94A3B8" stroke-width="1.2" />
      <line x1="198" y1="8" x2="198" y2="16" stroke="#94A3B8" stroke-width="1.2" />
      <text x="99" y="7" class="bracket-text" fill="#475569">Horizon T<tspan baseline-shift="sub" font-size="8">p</tspan></text>
      
      <!-- Executed segment -->
      <rect x="0" y="20" width="96" height="28" rx="3" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.2" />
      <text x="48" y="38" class="bracket-text" fill="#14532D">Executed T<tspan baseline-shift="sub" font-size="8">a</tspan></text>

      <!-- Discarded segment -->
      <rect x="102" y="20" width="96" height="28" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,2" />
      <text x="150" y="38" class="bracket-text" fill="#64748B">Discarded</text>

      <!-- Down arrow to controller -->
      <path d="M 48 54 L 48 94" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />
    </g>

    <!-- Real-Time Motor Controller -->
    <rect x="16" y="146" width="198" height="54" rx="4" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2" />
    <text x="115" y="177" class="node-text" fill="#78350F">Motor Controller</text>
  </g>

  <!-- ===================================================================== -->
  <!-- INTER-BLOCK CONNECTING ARROWS (Rendered on top)                       -->
  <!-- ===================================================================== -->
  <!-- Conditioning to Denoising Backbone -->
  <path d="M 270 176 L 315 176 L 315 153 L 360 153" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr-blue)" />

  <!-- Action Chunk to Executed Ta -->
  <path d="M 605 221 L 655 221 L 655 96 L 696 96" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)" />
</svg>
