<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-48.0" y="-18.0" width="1056.0" height="396.0" fill="#ffffff"/>
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; }
      .sub-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
      .math-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
      .annotation { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; text-anchor: middle; }
    </style>

    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#DC2626" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#2563EB" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3.5, 0 7" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="#FFFFFF" />

  <!-- ===================================================================== -->
  <!-- PANEL A: Multimodal Resolution                                        -->
  <!-- ===================================================================== -->
  <g transform="translate(25, 18)">
    <rect width="285" height="324" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="20" y="28" class="panel-title">(a) Multimodal Resolution</text>

    <!-- Sub-panel 1: Direct Regression -->
    <rect x="15" y="44" width="255" height="126" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="24" y="62" class="sub-header" fill="#64748B">Direct Regression</text>

    <!-- Start state -->
    <circle cx="45" cy="115" r="4" fill="#1E293B" />
    <text x="45" y="132" class="annotation">s<tspan baseline-shift="sub" font-size="8">t</tspan></text>

    <!-- Mode A and Mode B paths -->
    <path d="M 45 115 Q 110 50 225 62" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="4,3" />
    <text x="225" y="56" class="annotation" fill="#16A34A" text-anchor="end">Mode A</text>

    <path d="M 45 115 Q 110 168 225 155" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="4,3" />
    <text x="225" y="168" class="annotation" fill="#16A34A" text-anchor="end">Mode B</text>

    <!-- Obstacle -->
    <circle cx="180" cy="115" r="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2" />
    <text x="180" y="93" class="annotation" fill="#B91C1C">Obstacle</text>

    <!-- Mean Collision Vector -->
    <text x="96" y="104" class="math-label" fill="#DC2626">Mean Collision</text>
    <path d="M 45 115 L 148 115" fill="none" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr-red)" />

    <!-- Sub-panel 2: Diffusion Policy -->
    <rect x="15" y="180" width="255" height="134" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="24" y="198" class="sub-header" fill="#64748B">Diffusion Resolution</text>

    <!-- Mode A basin -->
    <ellipse cx="190" cy="225" rx="45" ry="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
    <circle cx="190" cy="225" r="3" fill="#16A34A" />
    <text x="190" y="218" class="annotation" fill="#166534">Mode A</text>

    <!-- Mode B basin -->
    <ellipse cx="190" cy="282" rx="45" ry="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
    <circle cx="190" cy="282" r="3" fill="#16A34A" />
    <text x="190" y="295" class="annotation" fill="#166534">Mode B</text>

    <!-- Separatrix -->
    <line x1="110" y1="254" x2="235" y2="254" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Noise sample resolving to Mode A -->
    <circle cx="60" cy="254" r="3.5" fill="#2563EB" />
    <text x="60" y="270" class="annotation" fill="#2563EB">Noise</text>

    <!-- Curve to Mode A -->
    <text x="100" y="222" class="math-label" fill="#1D4ED8">Selection</text>
    <path d="M 60 254 Q 100 248 140 230" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)" />
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL B: Iterative Trajectory Denoising                                -->
  <!-- ===================================================================== -->
  <g transform="translate(335, 18)">
    <rect width="285" height="324" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="20" y="28" class="panel-title">(b) Iterative Denoising</text>

    <!-- Stage 1: k = K (Gaussian Noise) -->
    <rect x="15" y="44" width="255" height="74" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="25" y="60" class="sub-header" fill="#64748B">Step K: Noise</text>
    <path d="M 30 92 L 55 72 L 80 104 L 110 75 L 140 98 L 175 70 L 205 100 L 240 78" fill="none" stroke="#94A3B8" stroke-width="1.5" />

    <!-- Down arrow -->
    <path d="M 142 122 L 142 138" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />

    <!-- Stage 2: k = K/2 (Coarse Trajectory) -->
    <rect x="15" y="142" width="255" height="74" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="25" y="158" class="sub-header" fill="#2563EB">Step K/2: Coarse</text>
    <path d="M 30 190 Q 80 165 135 195 T 240 170" fill="none" stroke="#3B82F6" stroke-width="2" />

    <!-- Down arrow -->
    <path d="M 142 220 L 142 236" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)" />

    <!-- Stage 3: k = 0 (Smooth Action Chunk) -->
    <rect x="15" y="240" width="255" height="74" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
    <text x="25" y="256" class="sub-header" fill="#15803D">Step 0: Action Chunk A<tspan baseline-shift="super" font-size="8px">0</tspan></text>
    <path d="M 30 285 Q 55 268 80 268 Q 107 268 135 280 Q 162 292 190 268 Q 215 245 240 250" fill="none" stroke="#16A34A" stroke-width="2.2" />
    <circle cx="30" cy="285" r="3" fill="#16A34A" />
    <circle cx="80" cy="268" r="3" fill="#16A34A" />
    <circle cx="135" cy="280" r="3" fill="#16A34A" />
    <circle cx="190" cy="268" r="3" fill="#16A34A" />
    <circle cx="240" cy="250" r="3" fill="#16A34A" />
  </g>

  <!-- ===================================================================== -->
  <!-- PANEL C: Dual-Rate Decoupling                                         -->
  <!-- ===================================================================== -->
  <g transform="translate(645, 18)">
    <rect width="290" height="324" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="20" y="28" class="panel-title">(c) Dual-Rate Decoupling</text>

    <!-- Host MPU -->
    <rect x="20" y="44" width="250" height="56" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
    <text x="145" y="76" class="node-text" fill="#1E40AF">Host MPU (15 Hz)</text>

    <!-- Down arrow with Action Chunk Label -->
    <path d="M 145 100 L 145 128" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arr-blue)" />
    <text x="195" y="118" class="math-label" fill="#1D4ED8" text-anchor="start">Chunk A<tspan baseline-shift="super" font-size="8px">0</tspan></text>

    <!-- Lock-free SPSC Ring Buffer -->
    <rect x="20" y="132" width="250" height="52" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="145" y="152" class="sub-header">Ring Buffer</text>
    <!-- Buffer slots -->
    <g transform="translate(55, 160)">
      <rect x="0" y="0" width="35" height="14" rx="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
      <rect x="40" y="0" width="35" height="14" rx="2" fill="#BBF7D0" stroke="#16A34A" stroke-width="1" />
      <rect x="80" y="0" width="35" height="14" rx="2" fill="#BBF7D0" stroke="#16A34A" stroke-width="1" />
      <rect x="120" y="0" width="35" height="14" rx="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
    </g>

    <!-- Down arrow -->
    <path d="M 145 184 L 145 210" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)" />

    <!-- Real-Time MCU -->
    <rect x="20" y="212" width="250" height="56" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
    <text x="145" y="244" class="node-text" fill="#166534">MCU (1 kHz)</text>

    <!-- Down arrow to Actuators -->
    <path d="M 145 268 L 145 292" fill="none" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arr-green)" />
    <text x="145" y="308" class="node-text" fill="#0F172A">Actuators</text>
  </g>
</svg>
