<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .section-hdr { font-size: 11px; font-weight: 700; fill: #1F407A; text-transform: uppercase; letter-spacing: 0.5px; }
      .box-hdr { font-size: 10px; font-weight: 700; fill: #1E293B; }
      .label-main { font-size: 9px; font-weight: 600; fill: #334155; }
      .label-sub { font-size: 8.5px; fill: #64748B; }
      .math-sym { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Times New Roman", serif; font-style: italic; font-size: 9px; fill: #0F172A; }
      .token-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8.5px; fill: #1E293B; }
      .rate-tag { font-size: 8px; font-weight: 700; fill: #475569; }
      .tag-fail { font-size: 8px; font-weight: 700; fill: #DC2626; }
      .tag-win { font-size: 8px; font-weight: 700; fill: #059669; }
    </style>

    <!-- Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="920" height="460" fill="#FFFFFF" />

  <!-- ========================================================================= -->
  <!-- COLUMN 1: MULTIMODAL SYMMETRY BREAKING                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 20)">
    <rect width="265" height="420" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <rect width="265" height="26" rx="4" fill="#F1F5F9" />
    <path d="M 0 20 L 0 26 L 265 26 L 265 20 Z" fill="#F1F5F9" />
    <text x="12" y="17" class="section-hdr">1. Multimodal Symmetry</text>

    <!-- Sub-panel A: Naive MSE Mode Collapse -->
    <g transform="translate(10, 36)">
      <rect width="245" height="175" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect width="245" height="22" rx="3" fill="#FEF2F2" />
      <path d="M 0 16 L 0 22 L 245 22 L 245 16 Z" fill="#FEF2F2" />
      <text x="10" y="15" class="box-hdr" fill="#991B1B">Standard BC (Naive MSE)</text>
      <text x="235" y="15" class="tag-fail" text-anchor="end">Centroid Collision</text>

      <!-- Geometry: Robot, Obstacle, Two Modes, Fatal Mean -->
      <g transform="translate(12, 28)">
        <!-- Axes -->
        <line x1="10" y1="95" x2="215" y2="95" stroke="#E2E8F0" stroke-width="0.8" />
        <line x1="10" y1="15" x2="10" y2="95" stroke="#E2E8F0" stroke-width="0.8" />

        <!-- Robot Start -->
        <circle cx="25" cy="55" r="4.5" fill="#1F407A" />
        <text x="25" y="70" class="token-text" font-size="7.5px" text-anchor="middle">s_t</text>

        <!-- Obstacle Cylinder -->
        <circle cx="125" cy="55" r="15" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.2" />
        <text x="125" y="34" class="label-main" font-size="8px" fill="#991B1B" text-anchor="middle">Obstacle</text>

        <!-- Mode A (Left path) -->
        <path d="M 25 55 Q 70 20, 190 22" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="3 2" />
        <text x="195" y="25" class="label-sub" font-size="8px" fill="#047857">Mode A</text>

        <!-- Mode B (Right path) -->
        <path d="M 25 55 Q 70 90, 190 88" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="3 2" />
        <text x="195" y="91" class="label-sub" font-size="8px" fill="#047857">Mode B</text>

        <!-- Fatal Mean Vector (Straight into Obstacle) -->
        <line x1="25" y1="55" x2="108" y2="55" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr-red)" />
        <text x="65" y="49" class="math-sym" font-size="8.5px" fill="#DC2626" text-anchor="middle">a_mean</text>
      </g>

      <!-- Explanation note -->
      <g transform="translate(10, 140)">
        <rect width="225" height="26" rx="2" fill="#FEF2F2" stroke="#FECACA" />
        <text x="8" y="16" class="label-sub" fill="#991B1B">L_MSE forces mean: predicts unobserved fatal centroid</text>
      </g>
    </g>

    <!-- Sub-panel B: Diffusion Score Matching -->
    <g transform="translate(10, 222)">
      <rect width="245" height="186" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect width="245" height="22" rx="3" fill="#ECFDF5" />
      <path d="M 0 16 L 0 22 L 245 22 L 245 16 Z" fill="#ECFDF5" />
      <text x="10" y="15" class="box-hdr" fill="#065F46">Diffusion Policy</text>
      <text x="235" y="15" class="tag-win" text-anchor="end">Symmetry Breaking</text>

      <!-- Geometry: Two mode basins and Separatrix -->
      <g transform="translate(12, 28)">
        <!-- Mode A Basin -->
        <ellipse cx="55" cy="45" rx="36" ry="24" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
        <circle cx="55" cy="45" r="3" fill="#059669" />
        <text x="55" y="40" class="label-main" font-size="8px" fill="#065F46" text-anchor="middle">Mode A</text>

        <!-- Mode B Basin -->
        <ellipse cx="165" cy="45" rx="36" ry="24" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
        <circle cx="165" cy="45" r="3" fill="#059669" />
        <text x="165" y="40" class="label-main" font-size="8px" fill="#065F46" text-anchor="middle">Mode B</text>

        <!-- Separatrix Line -->
        <line x1="110" y1="10" x2="110" y2="85" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 2" />
        <text x="110" y="96" class="label-sub" font-size="7.5px" text-anchor="middle">Separatrix</text>

        <!-- Gaussian Noise Sample drifting to Mode A -->
        <circle cx="95" cy="72" r="3.5" fill="#1F407A" />
        <text x="70" y="85" class="math-sym" font-size="7.5px">A^K ~ N(0,I)</text>
        
        <!-- Score Vector Drift -->
        <path d="M 95 72 Q 80 62, 60 48" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arr-blue)" />
        <text x="96" y="58" class="math-sym" font-size="8px" fill="#1D4ED8">ε_θ drift</text>
      </g>

      <!-- Explanation note -->
      <g transform="translate(10, 150)">
        <rect width="225" height="26" rx="2" fill="#F0FDF4" stroke="#BBF7D0" />
        <text x="8" y="16" class="label-sub" fill="#14532D">Unimodal noise prediction settles into one coherent mode</text>
      </g>
    </g>
  </g>

  <!-- Connective Arrow from Column 1 to Column 2 -->
  <path d="M 290 230 L 310 230" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-blue)" />

  <!-- ========================================================================= -->
  <!-- COLUMN 2: REVERSE DIFFUSION DENOISING (K -> 0)                            -->
  <!-- ========================================================================= -->
  <g transform="translate(315, 20)">
    <rect width="285" height="420" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <rect width="285" height="26" rx="4" fill="#F1F5F9" />
    <path d="M 0 20 L 0 26 L 285 26 L 285 20 Z" fill="#F1F5F9" />
    <text x="12" y="17" class="section-hdr">2. Trajectory Denoising (K → 0)</text>
    <text x="273" y="17" class="rate-tag" text-anchor="end">DDIM Solver</text>

    <!-- Stage 1: k = 16 (Pure Noise) -->
    <g transform="translate(10, 36)">
      <rect width="265" height="74" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="8" y="14" class="box-hdr">Step k = 16: Pure Gaussian Noise</text>
      <text x="257" y="14" class="math-sym" font-size="8px" text-anchor="end" fill="#64748B">A^16 ~ N(0, I)</text>
      <!-- Jagged Noise Waveform -->
      <path d="M 12 40 L 32 24 L 50 52 L 72 25 L 94 55 L 115 26 L 138 48 L 160 22 L 182 50 L 204 26 L 225 45 L 250 30" fill="none" stroke="#94A3B8" stroke-width="1.4" />
      <text x="8" y="66" class="label-sub" font-size="7.5px">Zero spatial coherence</text>
    </g>

    <!-- Arrow down -->
    <g transform="translate(142, 112)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)" />
      <text x="10" y="7" class="math-sym" font-size="7.5px" fill="#1F407A">ε_θ(A^16, O_t)</text>
    </g>

    <!-- Stage 2: k = 10 (Macro Heading Emergence) -->
    <g transform="translate(10, 126)">
      <rect width="265" height="74" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="8" y="14" class="box-hdr">Step k = 10: Macro Direction Emergence</text>
      <!-- Coarse Waveform -->
      <path d="M 12 48 L 45 38 L 80 44 L 120 32 L 160 36 L 200 25 L 250 22" fill="none" stroke="#3B82F6" stroke-width="1.8" />
      <text x="8" y="66" class="label-sub" font-size="7.5px">Mode A chosen (low-frequency coherence)</text>
    </g>

    <!-- Arrow down -->
    <g transform="translate(142, 202)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1F407A" stroke-width="1.2" marker-end="url(#arr-blue)" />
      <text x="10" y="7" class="math-sym" font-size="7.5px" fill="#1F407A">DDIM Step</text>
    </g>

    <!-- Stage 3: k = 4 (Kinematic Smoothing) -->
    <g transform="translate(10, 216)">
      <rect width="265" height="74" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="8" y="14" class="box-hdr">Step k = 4: Kinematic Trajectory Smoothing</text>
      <!-- Smooth Arc -->
      <path d="M 12 50 C 70 24, 150 42, 250 20" fill="none" stroke="#2563EB" stroke-width="2" />
      <text x="8" y="66" class="label-sub" font-size="7.5px">Inter-joint alignment (continuous velocity)</text>
    </g>

    <!-- Arrow down -->
    <g transform="translate(142, 292)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-green)" />
      <text x="10" y="7" class="math-sym" font-size="7.5px" fill="#065F46">Final Step</text>
    </g>

    <!-- Stage 4: k = 0 (Certified Action Chunk) -->
    <g transform="translate(10, 306)">
      <rect width="265" height="98" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
      <text x="8" y="14" class="box-hdr" fill="#065F46">Step k = 0: Certified Action Chunk</text>
      <text x="257" y="14" class="math-sym" font-size="8px" text-anchor="end" fill="#047857">A ∈ ℝ^(H × D_a)</text>
      
      <!-- Waypoint Spline -->
      <path d="M 15 58 C 60 26, 130 46, 248 18" fill="none" stroke="#059669" stroke-width="2.4" />
      <circle cx="15" cy="58" r="2.8" fill="#059669" />
      <circle cx="62" cy="40" r="2.8" fill="#059669" />
      <circle cx="110" cy="38" r="2.8" fill="#059669" />
      <circle cx="158" cy="32" r="2.8" fill="#059669" />
      <circle cx="205" cy="24" r="2.8" fill="#059669" />
      <circle cx="248" cy="18" r="2.8" fill="#059669" />

      <text x="8" y="86" class="label-sub" font-size="8px" fill="#065F46">H = 16 Joint Setpoints (320 ms), C² Continuous</text>
    </g>
  </g>

  <!-- Connective Arrow from Column 2 to Column 3 -->
  <path d="M 600 230 L 625 230" stroke="#1F407A" stroke-width="1.8" marker-end="url(#arr-blue)" />

  <!-- ========================================================================= -->
  <!-- COLUMN 3: REAL-TIME DUAL-RATE DECOUPLING                                  -->
  <!-- ========================================================================= -->
  <g transform="translate(630, 20)">
    <rect width="265" height="420" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <rect width="265" height="26" rx="4" fill="#F1F5F9" />
    <path d="M 0 20 L 0 26 L 265 26 L 265 20 Z" fill="#F1F5F9" />
    <text x="12" y="17" class="section-hdr">3. Dual-Rate Decoupling</text>

    <!-- Top: SoC Compute Timeline -->
    <g transform="translate(10, 36)">
      <rect width="245" height="85" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="8" y="14" class="box-hdr">SoC Inference Budget (Jetson AGX Orin)</text>
      
      <!-- Segmented Timing Bar -->
      <g transform="translate(8, 24)">
        <rect x="0" y="0" width="85" height="22" rx="2" fill="#DBEAFE" stroke="#93C5FD" />
        <text x="42" y="14" class="label-sub" font-size="8px" text-anchor="middle" fill="#1E40AF">Vision: 14.0 ms</text>

        <rect x="88" y="0" width="141" height="22" rx="2" fill="#EDE9FE" stroke="#C4B5FD" />
        <text x="158" y="14" class="label-sub" font-size="8px" text-anchor="middle" fill="#6B21A8">16× DDIM: 26.4 ms</text>
      </g>

      <text x="8" y="60" class="math-sym" font-size="8.5px">Total Inference: τ_inf = 40.4 ms (24.7 Hz)</text>
      <text x="8" y="73" class="label-sub" font-size="8px">Weights Stream: 96 MB @ 204.8 GB/s</text>
    </g>

    <!-- Middle: Receding Horizon Execution -->
    <g transform="translate(10, 130)">
      <rect width="245" height="115" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="8" y="14" class="box-hdr">Receding Horizon (H_p vs H_a)</text>
      <text x="8" y="27" class="label-sub">Prediction Horizon H_p = 16 steps (320 ms)</text>

      <!-- Horizon Bar -->
      <g transform="translate(8, 36)">
        <rect x="0" y="0" width="115" height="24" rx="2" fill="#DCFCE7" stroke="#86EFAC" />
        <text x="57" y="15" class="label-sub" font-size="8px" text-anchor="middle" fill="#14532D">H_a = 8 steps (160 ms)</text>

        <rect x="118" y="0" width="111" height="24" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="2 2" />
        <text x="173" y="15" class="label-sub" font-size="8px" text-anchor="middle" fill="#64748B">Discarded Tail</text>

        <!-- Re-plan Trigger Mark -->
        <line x1="115" y1="-4" x2="115" y2="28" stroke="#DC2626" stroke-width="1.8" />
        <text x="115" y="40" class="tag-fail" font-size="7.5px" text-anchor="middle">Trigger Next Re-plan</text>
      </g>

      <g transform="translate(8, 86)">
        <text x="0" y="12" class="math-sym" font-size="8px">t_plan = 40.4 ms &lt; 160 ms (Slack: 119.6 ms)</text>
        <text x="0" y="24" class="label-sub" font-size="7.5px" fill="#047857">Zero latency starvation: motor buffer never starves</text>
      </g>
    </g>

    <!-- Bottom: Asynchronous Real-Time Handshake -->
    <g transform="translate(10, 254)">
      <rect width="245" height="154" rx="3" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="8" y="15" class="box-hdr">Asynchronous Proposal Handshake</text>

      <!-- Linux MPU Box -->
      <g transform="translate(8, 24)">
        <rect width="229" height="34" rx="2" fill="#EFF6FF" stroke="#93C5FD" />
        <text x="8" y="14" class="box-hdr" fill="#1E40AF">Application Processor (Linux MPU)</text>
        <text x="8" y="26" class="label-sub">Generates action chunk at 15–25 Hz</text>
      </g>

      <!-- Downward SPSC Queue Arrow -->
      <g transform="translate(122, 60)">
        <line x1="0" y1="0" x2="0" y2="16" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="2 2" marker-end="url(#arr-navy)" />
        <text x="8" y="11" class="token-text" font-size="7.5px" fill="#1F407A">SPSC Ring Buffer</text>
      </g>

      <!-- Real-Time MCU Box -->
      <g transform="translate(8, 80)">
        <rect width="229" height="38" rx="2" fill="#FEF2F2" stroke="#F87171" />
        <text x="8" y="14" class="box-hdr" fill="#991B1B">Real-Time Safety MCU (1000 Hz)</text>
        <text x="8" y="27" class="label-sub" fill="#7F1D1D">Cubic spline interpolation, Kinematic clamp</text>
      </g>

      <!-- Arrow down to plant -->
      <g transform="translate(122, 120)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)" />
      </g>

      <!-- Actuator Registers -->
      <g transform="translate(8, 134)">
        <rect width="229" height="16" rx="0" fill="#F0FDF4" stroke="#059669" />
        <text x="114" y="12" class="box-hdr" font-size="8px" fill="#065F46" text-anchor="middle">Deterministic Plant Actuation (PWM @ 20 kHz)</text>
      </g>
    </g>
  </g>
</svg>
