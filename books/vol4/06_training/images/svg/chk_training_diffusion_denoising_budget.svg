<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <style>
      .card-title { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #1e293b; }
      .data-label { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; font-weight: 500; fill: #334155; }
      .data-bold { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; font-weight: 700; }
      .badge-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .sub-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: 400; fill: #64748b; }
      .math-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .node-sub { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .timeline-label { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: 600; fill: #475569; }
      .legend-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7px; font-weight: 500; fill: #475569; }
    </style>
    <marker id="arr-green" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#3d9e5a" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#c87b2a" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================================================================= -->
  <!-- LEFT SUB-CARD: Continuous Flow Matching                          -->
  <!-- ================================================================= -->
  <g transform="translate(16, 12)">
    <rect width="248" height="108" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    
    <!-- Title & Status Badge -->
    <text x="10" y="16" class="card-title">Flow Matching (ODE)</text>
    <rect x="156" y="6" width="82" height="14" rx="7" fill="#3d9e5a"/>
    <text x="197" y="16.5" class="badge-text">SAFE: 17.3 ms</text>

    <!-- Schematic: Straight probability path -->
    <rect x="10" y="24" width="228" height="42" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    
    <!-- Noise x0 and Target x1 -->
    <circle cx="28" cy="41" r="4.5" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/>
    <text x="28" y="32" class="node-sub">x₀ ∼ 𝒩</text>
    
    <circle cx="218" cy="41" r="4.5" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/>
    <text x="218" y="32" class="node-sub">x₁ ∈ 𝒟</text>

    <!-- Straight ray path with vector arrows -->
    <line x1="33" y1="41" x2="213" y2="41" stroke="#3d9e5a" stroke-width="1.5"/>
    <!-- Step 1 midpoint -->
    <circle cx="123" cy="41" r="2.5" fill="#3d9e5a"/>
    <path d="M 85 41 L 105 41" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <path d="M 175 41 L 195 41" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="123" y="56" class="math-text" fill="#14532d">Straight ray: N = 2 midpoint steps (3.3 ms)</text>

    <!-- Breakdown metrics -->
    <text x="10" y="79" class="data-label">Perception: <tspan font-weight="600">14.0 ms</tspan> | ODE Solver: <tspan font-weight="600">3.3 ms</tspan></text>
    <text x="10" y="90" class="data-label">Total Inference: <tspan class="data-bold" fill="#14532d">17.3 ms</tspan> (positive timing slack)</text>
    <text x="10" y="101" class="sub-text" fill="#14532d" font-weight="600">✓ +2.7 ms margin vs 20.0 ms line-rate deadline</text>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT SUB-CARD: Standard DDIM Diffusion                           -->
  <!-- ================================================================= -->
  <g transform="translate(276, 12)">
    <rect width="248" height="108" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    
    <!-- Title & Status Badge -->
    <text x="10" y="16" class="card-title">DDIM Diffusion (SDE)</text>
    <rect x="146" y="6" width="92" height="14" rx="7" fill="#c44"/>
    <text x="192" y="16.5" class="badge-text">OVERRUN: 40.4 ms</text>

    <!-- Schematic: Curved meandering path -->
    <rect x="10" y="24" width="228" height="42" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    
    <!-- Noise xK and Target x0 -->
    <circle cx="28" cy="45" r="4.5" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/>
    <text x="28" y="34" class="node-sub">x<tspan font-size="5.5px" dy="1.5">K</tspan><tspan font-size="7px" dy="-1.5"> ∼ 𝒩</tspan></text>
    
    <circle cx="218" cy="38" r="4.5" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/>
    <text x="218" y="28" class="node-sub">x₀ (chunk)</text>

    <!-- Meandering path with 16 steps -->
    <path d="M 33 45 C 65 24, 80 54, 120 32 S 175 50, 213 38" fill="none" stroke="#c87b2a" stroke-width="1.2" stroke-dasharray="2,2"/>
    <!-- Small step points along path -->
    <circle cx="50" cy="36" r="1.5" fill="#c87b2a"/>
    <circle cx="70" cy="34" r="1.5" fill="#c87b2a"/>
    <circle cx="95" cy="46" r="1.5" fill="#c87b2a"/>
    <circle cx="120" cy="32" r="1.5" fill="#c87b2a"/>
    <circle cx="145" cy="36" r="1.5" fill="#c87b2a"/>
    <circle cx="170" cy="47" r="1.5" fill="#c87b2a"/>
    <circle cx="195" cy="42" r="1.5" fill="#c87b2a"/>
    <text x="123" y="56" class="math-text" fill="#78350f">Brownian drift: K = 16 iterations (26.4 ms)</text>

    <!-- Breakdown metrics -->
    <text x="10" y="79" class="data-label">Perception: <tspan font-weight="600">14.0 ms</tspan> | DDIM Denoise: <tspan font-weight="600">26.4 ms</tspan></text>
    <text x="10" y="90" class="data-label">Total Inference: <tspan class="data-bold" fill="#7f1d1d">40.4 ms</tspan> (deadline failure)</text>
    <text x="10" y="101" class="sub-text" fill="#7f1d1d" font-weight="600">✗ Overruns 20 ms by +102%; starves motor loop</text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM COMPARATIVE TIMELINE BAR                                   -->
  <!-- ================================================================= -->
  <g transform="translate(16, 126)">
    <rect width="508" height="42" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

    <!-- Track 1: Flow Matching -->
    <text x="8" y="15" class="timeline-label">Flow Matching</text>
    <!-- 0 to 14 ms perception: x=72 to 142 (width 70, scale 5px/ms) -->
    <rect x="72" y="7" width="70" height="9" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.5" rx="1"/>
    <!-- 14 to 17.3 ms solver: width 16.5 -->
    <rect x="142" y="7" width="16.5" height="9" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.5" rx="1"/>
    <!-- Slack gap: 17.3 to 20 ms (width 13.5) -->
    <rect x="158.5" y="7" width="13.5" height="9" fill="#ffffff" stroke="#3d9e5a" stroke-width="0.5" stroke-dasharray="2,1" rx="1"/>
    <text x="176" y="14.5" class="sub-text" fill="#14532d" font-weight="700">17.3 ms (+2.7 ms slack)</text>

    <!-- Track 2: DDIM -->
    <text x="8" y="31" class="timeline-label">DDIM Diffusion</text>
    <!-- 0 to 14 ms perception -->
    <rect x="72" y="23" width="70" height="9" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.5" rx="1"/>
    <!-- 14 to 40.4 ms denoise: width 132 -->
    <rect x="142" y="23" width="132" height="9" fill="#f9d6d5" stroke="#c44" stroke-width="0.5" rx="1"/>
    <text x="278" y="30.5" class="sub-text" fill="#7f1d1d" font-weight="700">40.4 ms (+20.4 ms overrun)</text>

    <!-- 20.0 ms Real-Time Deadline Line -->
    <!-- Position: 0 ms is at x=72. 20 ms is at 72 + 20*5 = 172 -->
    <line x1="172" y1="3" x2="172" y2="39" stroke="#c44" stroke-width="1.2" stroke-dasharray="2,2"/>
    <polygon points="169,3 175,3 172,6" fill="#c44"/>
    <polygon points="169,39 175,39 172,36" fill="#c44"/>

    <!-- Legend and deadline text on right side (cleanly positioned) -->
    <g transform="translate(382, 5)">
      <!-- Deadline label -->
      <line x1="0" y1="6" x2="12" y2="6" stroke="#c44" stroke-width="1.2" stroke-dasharray="2,2"/>
      <text x="16" y="8.5" class="legend-text" font-weight="700" fill="#c44">20 ms Deadline (50 Hz)</text>
      
      <!-- Vis legend -->
      <rect x="0" y="14" width="7" height="6" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.5"/>
      <text x="10" y="19" class="legend-text">Vis (14 ms)</text>

      <!-- Solver legends -->
      <rect x="58" y="14" width="7" height="6" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.5"/>
      <text x="68" y="19" class="legend-text">ODE (3.3 ms)</text>

      <rect x="0" y="23" width="7" height="6" fill="#f9d6d5" stroke="#c44" stroke-width="0.5"/>
      <text x="10" y="28" class="legend-text">DDIM (26.4 ms)</text>
    </g>
  </g>
</svg>