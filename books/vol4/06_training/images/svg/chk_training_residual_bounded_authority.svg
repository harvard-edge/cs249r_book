<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <style>
      .card-title { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 700; fill: #1e293b; }
      .badge-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .data-label { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; font-weight: 500; fill: #334155; }
      .sub-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.2px; font-weight: 400; fill: #64748b; }
      .math-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 8px; font-weight: 700; fill: #1e293b; }
      .footer-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: 500; fill: #1e293b; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#4a90c4" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#c87b2a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#c44" />
    </marker>
    <marker id="arr-green" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#3d9e5a" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================================================================= -->
  <!-- INPUT NODE: State Observation s_t                                -->
  <!-- ================================================================= -->
  <g transform="translate(16, 60)">
    <rect width="52" height="38" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="26" y="16" class="card-title" text-anchor="middle">State s<tspan font-size="6.5px" baseline-shift="sub">t</tspan></text>
    <text x="26" y="29" class="sub-text" text-anchor="middle">Telemetry</text>
  </g>

  <!-- Connectors from s_t splitting into upper and lower branches -->
  <path d="M 68 79 H 80 V 42 H 90" fill="none" stroke="#4a90c4" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <path d="M 68 79 H 80 V 114 H 90" fill="none" stroke="#c87b2a" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <!-- ================================================================= -->
  <!-- UPPER BRANCH: Frozen Base Policy                                  -->
  <!-- ================================================================= -->
  <g transform="translate(92, 16)">
    <rect width="240" height="52" rx="3" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
    <text x="10" y="16" class="card-title" fill="#1e3a8a">Frozen Base Policy π<tspan font-size="6.5px" baseline-shift="sub">base</tspan>(s)</text>
    <rect x="180" y="6" width="52" height="12" rx="6" fill="#3d9e5a"/>
    <text x="206" y="14.5" class="badge-text">QUALIFIED</text>
    
    <text x="10" y="30" class="data-label" fill="#1e3a8a">Pre-verified global stability &amp; ISO/TS safety envelope</text>
    <text x="10" y="43" class="sub-text" fill="#1e3a8a">Free space: Δπ ≈ 0 → Zero catastrophic forgetting</text>
  </g>

  <!-- Upper connector to Summing Junction -->
  <path d="M 332 42 H 378" fill="none" stroke="#4a90c4" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <text x="355" y="35" class="math-text" fill="#1e3a8a" text-anchor="middle">a<tspan font-size="6.5px" baseline-shift="sub">base</tspan></text>

  <!-- ================================================================= -->
  <!-- LOWER BRANCH: Learned Residual Policy                             -->
  <!-- ================================================================= -->
  <g transform="translate(92, 88)">
    <rect width="130" height="52" rx="3" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="8" y="16" class="card-title" fill="#78350f">Residual Δπ<tspan font-size="6.5px" baseline-shift="sub">θ</tspan>(s)</text>
    <rect x="94" y="6" width="28" height="12" rx="6" fill="#c87b2a"/>
    <text x="108" y="14.5" class="badge-text">RL</text>
    
    <text x="8" y="30" class="data-label" fill="#78350f">Contact compensation</text>
    <text x="8" y="43" class="sub-text" fill="#78350f">Latch stick-slip &amp; snap</text>
  </g>

  <!-- Connector from Residual to Limiter -->
  <path d="M 222 114 H 234" fill="none" stroke="#c87b2a" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <!-- ================================================================= -->
  <!-- HARD HARDWARE AUTHORITY LIMITER                                   -->
  <!-- ================================================================= -->
  <g transform="translate(236, 88)">
    <rect width="124" height="52" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="8" y="16" class="card-title" fill="#7f1d1d">Authority Clamp</text>
    
    <!-- Saturation icon -->
    <path d="M 12 34 H 18 L 26 23 H 32" fill="none" stroke="#7f1d1d" stroke-width="1.2"/>
    <text x="36" y="30" class="math-text" fill="#7f1d1d">‖Δπ‖ ≤ Δ<tspan font-size="6.5px" baseline-shift="sub">max</tspan></text>
    <text x="8" y="44" class="sub-text" fill="#7f1d1d">Clamps: ‖Δτ‖ ≤ 2.5 N·m (wear cap)</text>
  </g>

  <!-- Connector from Limiter to Summing Junction: H then V up into summer -->
  <path d="M 360 114 H 388 V 53" fill="none" stroke="#c44" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <!-- Label Δa_clip positioned with generous clearance to the right of the vertical line -->
  <text x="403" y="88" class="math-text" fill="#7f1d1d" text-anchor="middle">Δa<tspan font-size="6.5px" baseline-shift="sub">clip</tspan></text>

  <!-- ================================================================= -->
  <!-- SUMMING JUNCTION                                                  -->
  <!-- ================================================================= -->
  <circle cx="388" cy="42" r="9" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="388" y="45.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12px" font-weight="700" fill="#475569" text-anchor="middle">+</text>

  <!-- Connector from Summing Junction to Plant -->
  <path d="M 397 42 H 416" fill="none" stroke="#3d9e5a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <text x="406.5" y="35" class="math-text" fill="#14532d" text-anchor="middle">a<tspan font-size="6.5px" baseline-shift="sub">t</tspan></text>

  <!-- ================================================================= -->
  <!-- PHYSICAL PLANT / ACTUATOR SUB-CARD                                -->
  <!-- ================================================================= -->
  <g transform="translate(418, 16)">
    <rect width="106" height="124" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="8" y="16" class="card-title" fill="#14532d">Physical Plant</text>
    <rect x="52" y="24" width="46" height="11" rx="5.5" fill="#3d9e5a"/>
    <text x="75" y="32" class="badge-text">PROTECTED</text>
    
    <text x="8" y="46" class="math-text" fill="#14532d">a<tspan font-size="6.5px" baseline-shift="sub">t</tspan><tspan dx="3">=</tspan><tspan dx="3">a<tspan font-size="6.5px" baseline-shift="sub">base</tspan></tspan><tspan dx="3">+</tspan><tspan dx="3">Δa<tspan font-size="6.5px" baseline-shift="sub">clip</tspan></tspan></text>
    
    <line x1="8" y1="53" x2="98" y2="53" stroke="#3d9e5a" stroke-width="0.5" stroke-dasharray="2,1"/>

    <text x="8" y="67" class="data-label" font-weight="700" fill="#14532d">Hardware Invariants:</text>
    <text x="8" y="79" class="sub-text" fill="#14532d">✓ Gearbox shock capped</text>
    <text x="8" y="90" class="sub-text" fill="#14532d">✓ Motor Joule heat safe</text>
    <text x="8" y="101" class="sub-text" fill="#14532d">✓ Pre-verified stability</text>
    <text x="8" y="115" class="sub-text" font-weight="700" fill="#14532d">Zero destabilization</text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM TAKEAWAY STRIP                                             -->
  <!-- ================================================================= -->
  <g transform="translate(16, 149)">
    <rect width="508" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="254" y="13" class="footer-text">
      <tspan fill="#1e3a8a" font-weight="700">Free Space:</tspan> Δπ ≈ 0 (prevents catastrophic forgetting)&#160;&#160;|&#160;&#160;<tspan fill="#7f1d1d" font-weight="700">Exploration Wear:</tspan> ‖Δπ‖ ≤ Δ<tspan font-size="6.5px" baseline-shift="sub">max</tspan><tspan dx="4">strictly confines shock &amp; thermal runaway</tspan>
    </text>
  </g>
</svg>