  claims:
    Trajectory record: The planner hands over an immutable record naming frame, evidence epoch, seam state, parent
      intent-lease digest, and four MCU-clock deadlines in two tiers (high-rate chunk lease, hardware commitment
      cutoff) together with its latched stop.
    Replacement latency and handoff tail: Replacement latency runs from capture to MCU admission (about 115 ms against
      a 50 ms renewal and a 60 ms lease), so renewal is sustainable only by overlapping requests and every record
      must carry its own handoff tail.
    Manipulator Jacobian: Clearance and tool limits live in tool space but drives enforce joint limits, so tool-space
      quantities pass through the configuration-dependent Jacobian, whose weak direction near a singularity demands
      unbounded joint rates unless damped least squares trades accuracy for bounded rates.
    Kinodynamic feasibility: A collision-free path is executable only if every joint's position, velocity, acceleration,
      jerk, torque, and current stay within limits along the continuous interpolant, its seams, and its stop, which
      time parameterization must check.
    C2 seam: Splicing chunks that match only position or velocity leaves an acceleration step that reflected inertia
      turns into a torque step, so seams must be C2 and the replacement is planned from the projected seam state.
    Jerk-limited stopping suffix: A stop that keeps acceleration continuous must ramp deceleration up and down,
      so constant-deceleration braking is unexecutable and understates distance, and every admitted trajectory carries
      a jerk-limited S-curve stop.
    Inevitable collision states: A moving mass enters a state from which every admissible control collides long
      before contact, so every record names a commitment instant at which its latched stop must begin, and admission
      closes earlier by the decision-to-onset delay.
    Generators are proposers: Sampling planners, trajectory optimization and MPC, and learned chunks differ in the
      work they do, not in what they must prove, and a solver's deadline, not its convergence, decides admission.
    Future-state conditioning: Because the arm keeps moving during inference, a replacement is planned from the
      state projected to the seam and admitted against the measured state.
    Model predictive control: Receding-horizon MPC handles constraints explicitly and gains recursive feasibility
      only through a terminal invariant set, and its solve time against the period decides whether its output can
      be admitted.
    Time parameterization: Phase-plane time parameterization finds the fastest timing of a fixed path under velocity,
      acceleration, and torque bounds, and online generators compute jerk-limited profiles from arbitrary states.
    Nonholonomic base planning: A differential-drive base reaches the same configurations as a holonomic one but
      through a restricted velocity space, so it plans over controls.
    Configuration space: Planning searches the configuration space and its collision-free subset, and collision
      queries dominate a sampling planner's run time.
