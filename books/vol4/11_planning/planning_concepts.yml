    relationships:
    - id: vol4.field.motion-feasibility--motion-trajectory
      source: vol4.motion.feasibility
      predicate: constrains
      target: vol4.motion.trajectory
      explanation: A collision-free geometric path can still demand acceleration or torque the physical
        plant cannot deliver.
      conditions: Check path and time parameterization against the qualified plant, payload, and actuator
        envelope.
      status: draft
      evidence:
        section: sec-planning-kinodynamic-feasibility
        quote: A candidate trajectory that clears every obstacle in workspace and arrives before its deadline
          will still fault on the hardware if it asks a joint for more speed, torque, or current slew than
          the drive can supply. What an embodied model generates is a geometric and timed proposal, not
          permission to move. While high-level motion planners and learned policies navigate free configuration
          space $\FreeConfigurationSpace$, physical actuators operate under fixed electromotive, thermal,
          and structural limits. Kinodynamic feasibility bridges geometric intent and mechanical reality,
          ensuring that reference trajectories respect actuator torque limits, velocity boundaries, and
          transmission dynamics before the low-level controller dispatches setpoints to motor drives.
    - id: vol4.field.motion-trajectory--motion-stopping-continuation
      source: vol4.motion.trajectory
      predicate: must retain a qualified
      target: vol4.motion.stopping-continuation
      explanation: The admitted trajectory needs a smoothly joined stopping suffix so loss of renewal does
        not leave the plant without a feasible continuation.
      conditions: The suffix must match the state reached at handoff and honor jerk, traction, and drive
        limits; a stop command alone is insufficient.
      status: draft
      evidence:
        section: sec-planning-trajectory-contract
        quote: On this machine, the chunk policy generates only the nominal motion profile, which the planning
          runtime then packages into a self-contained record by appending the seam state, the four operational
          deadlines, and a matched stopping suffix. Inside the fixed header, lineage fields record a monotonic
          sequence number, the evidence timestamp $\EvidenceEpoch$, and the digest of the parent intent
          lease, while timing fields encode the four deadlines from @sec-planning-handoff-record. Seam fields
          then define the reference frame, each joint's initial state $(\JointPosition,\JointVelocity,\JointAcceleration)$
          at handoff, and the representation of an admission-checked stopping profile satisfying $\StoppingDistance
          \le \ClearDistance$. Content fields specify the payload format, byte length, and an integrity
          digest spanning both the setpoint payload and the sidecar.
    - id: vol4.field.motion-stopping-continuation--enforcement-envelope
      source: vol4.motion.stopping-continuation
      predicate: provides braking motion within
      target: vol4.enforcement.envelope
      explanation: A qualified stopping continuation supplies the actual braking profile whose travel the
        envelope must reserve.
      conditions: Use the same initial state, timing allowances, jerk limits, and credible plant bounds
        in planning and enforcement.
      status: draft
      evidence:
        section: sec-planning-base-stopping-budget
        quote: On the mobile base approaching the rack end at its `{python} PlanningC2Stop.v_drive_str`
          drive limit, the loaded tote rack tolerates the machine's credible `{python} PlanningC2Stop.a_brake_str`
          deceleration only when that deceleration is ramped gradually rather than applied as an abrupt
          step. The base's stop is therefore the S-curve of @eq-plan-c2-stopping-suffix with $\ProfileAccelerationBound$
          at `{python} PlanningC2Stop.a_brake_str` and a jerk bound of `{python} PlanningC2Stop.j_base_str`.
          That jerk bound is the peak jerk of the polynomial stop from the `{python} PlanningC2Stop.v_drive_str`
          drive limit and the stop jerk bound already listed on the machine card (@tbl-01-machine-card).
          Under it, every speed above `{python} PlanningC2Stop.v_plateau_str` reaches the deceleration plateau.
          At the drive limit, this suffix lasts `{python} PlanningC2Stop.s_drive_time_str` and travels `{python}
          PlanningC2Stop.s_drive_dist_str`, compared with `{python} PlanningC2Stop.brake_const_str` for
          constant-deceleration braking in @eq-body-stopping-distance and `{python} PlanningC2Stop.poly_drive_dist_str`
          for the polynomial with the same peaks. Because the jerk ramps cost the equivalent of `{python}
          PlanningC2Stop.ramp_delay_str` of cruise, the suffix adds `{python} PlanningC2Stop.c2_increment_str`
          to the budget that @sec-perception-latency-waterfall left at `{python} PlanningC2Stop.total_prev_str`.
          This raises the running total to `{python} PlanningC2Stop.total_new_str` and exceeds the `{python}
          PlanningC2Stop.d_clear_str` rack-end clear distance by `{python} PlanningC2Stop.excess_str`. Because
          this partial total still omits the unqualified dispatch-to-admission interval, which can only
          add travel, the `{python} PlanningC2Stop.excess_str` overrun is a conditional design deficit rather
          than a complete measured response bound.
    - id: vol4.field.proposal-chunk--proposal-horizon-3
      source: vol4.proposal.chunk
      predicate: trades renewal slack against
      target: vol4.proposal.horizon
      explanation: Longer proposed horizons provide more replacement time while letting the supporting scene
        evidence age.
      conditions: The usable horizon is limited jointly by renewal, evidence validity, and stopping clearance;
        more predicted waypoints create no fresh observations.
      status: draft
      evidence:
        section: sec-planning-horizon-tradeoff
        quote: If a replacement chunk takes longer from camera capture to MCU admission than the active
          chunk's lease allows, the arm drops into its stopping fallback before the new plan arrives. If
          the executed prefix is stretched to hide that latency, the arm reacts too slowly when the mug
          or an obstacle shifts. Sizing the prediction horizon $\ActionChunkHorizon$ therefore starts from
          an end-to-end latency budget for replacement, one that spans host accelerator memory, the inter-processor
          link, and real-time microcontroller firmware.
