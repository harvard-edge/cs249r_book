<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c44"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3d9e5a"/>
    </marker>

    <!-- Hatch pattern for barrier wall -->
    <pattern id="barrier-hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================================================================== -->
  <!-- TRACK 1 (TOP): TIMELY COMMITMENT AT t_commit                         -->
  <!-- ==================================================================== -->
  <g id="track-timely" transform="translate(16, 12)">
    <!-- Sub-card container -->
    <rect width="508" height="72" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

    <!-- Header & Pill Badge -->
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1e293b">Timely Fallback at t_commit (360 ms)</text>
    <rect x="372" y="6" width="124" height="15" rx="7.5" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="434" y="17" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">Safe Halt: +85 mm Margin</text>

    <!-- Sub-label -->
    <text x="12" y="27" font-size="7.5" fill="#64748b">Branches to precomputed suffix at t_commit; d_total = 315 mm ≤ d_clear</text>

    <!-- Runway: Drift segment (0 to 90 mm) -->
    <rect x="42" y="33" width="76" height="18" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="80" y="45" font-size="7" font-weight="600" fill="#78350f" text-anchor="middle">d_late = 90 mm (drift)</text>

    <!-- Runway: Braking segment (90 to 315 mm) -->
    <rect x="118" y="33" width="190" height="18" rx="2" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
    <text x="213" y="45" font-size="7" font-weight="600" fill="#1e3a8a" text-anchor="middle">d_brake = 225 mm (C² braking at -a_max)</text>

    <!-- Rest point indicator -->
    <circle cx="308" cy="42" r="3.5" fill="#3d9e5a"/>

    <!-- Positive Safety Margin Zone (315 to 400 mm) -->
    <rect x="308" y="33" width="72" height="18" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75" stroke-dasharray="2,2"/>
    <text x="344" y="45" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">+85 mm Margin</text>

    <!-- Obstacle barrier wall at 400 mm -->
    <line x1="380" y1="28" x2="380" y2="58" stroke="#c44" stroke-width="1.5"/>
    <rect x="380" y="28" width="8" height="30" fill="url(#barrier-hatch)"/>
    <text x="394" y="45" font-size="7.5" font-weight="700" fill="#7f1d1d">d_clear = 400 mm</text>

    <!-- Distance metric ticks & labels -->
    <text x="42" y="63" font-size="7" fill="#64748b" text-anchor="middle">0 mm</text>
    <text x="118" y="63" font-size="7" fill="#78350f" text-anchor="middle">90 mm</text>
    <text x="308" y="63" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">315 mm (Rest)</text>
    <text x="380" y="63" font-size="7" font-weight="700" fill="#c44" text-anchor="middle">400 mm</text>
  </g>

  <!-- ==================================================================== -->
  <!-- TRACK 2 (BOTTOM): DELAYED FALLBACK (WAITING TO t_exp)                -->
  <!-- ==================================================================== -->
  <g id="track-delayed" transform="translate(16, 92)">
    <!-- Sub-card container -->
    <rect width="508" height="76" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

    <!-- Header & Pill Badge -->
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1e293b">Delayed Fallback: Waiting until t_exp (500 ms)</text>
    <rect x="372" y="6" width="124" height="15" rx="7.5" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="434" y="17" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Runway Breach: Collision</text>

    <!-- Sub-label -->
    <text x="12" y="27" font-size="7.5" fill="#64748b">Delays fallback past t_commit; stalled drift consumes runway, causing crash</text>

    <!-- Runway: Stalled drift segment (0 to 300 mm) -->
    <rect x="42" y="33" width="253" height="18" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="168" y="45" font-size="7" font-weight="600" fill="#78350f" text-anchor="middle">d_late,delayed = 300 mm (stalled drift at 1.5 m/s)</text>

    <!-- Runway: Available braking segment before barrier (300 to 400 mm) -->
    <rect x="295" y="33" width="85" height="18" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.75"/>
    <text x="337" y="45" font-size="7" font-weight="600" fill="#1e3a8a" text-anchor="middle">Braking</text>

    <!-- Obstacle barrier wall at 400 mm -->
    <line x1="380" y1="28" x2="380" y2="58" stroke="#c44" stroke-width="1.5"/>
    <rect x="380" y="28" width="8" height="30" fill="url(#barrier-hatch)"/>

    <!-- Impact indicator on barrier -->
    <circle cx="380" cy="42" r="3.5" fill="#c44"/>

    <!-- Runway: Barrier breach zone (400 to 485 mm) -->
    <rect x="388" y="33" width="102" height="18" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="439" y="45" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="middle">125 mm Breach (1.12 m/s)</text>

    <!-- Distance metric ticks & labels -->
    <text x="42" y="63" font-size="7" fill="#64748b" text-anchor="middle">0 mm</text>
    <text x="295" y="63" font-size="7" fill="#78350f" text-anchor="middle">300 mm (t_exp)</text>
    <text x="380" y="63" font-size="7" font-weight="700" fill="#c44" text-anchor="middle">400 mm (Barrier)</text>
    <text x="490" y="63" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="middle">525 mm (Needed)</text>
  </g>
</svg>
