<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E293B"/>
    </marker>
    <marker id="arr-rev-navy" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#1E293B"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-rev-rose" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="760" fill="#FFFFFF"/>

  <!-- Main Title & Provenance -->
  <text x="24" y="28" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="-0.2">Deterministic Seam Timeline &amp; Clearance Budgeting Architecture</text>
  <text x="1036" y="28" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">Synthesized from Chi et al. (2024), Zhao et al. (2023), and ISO 10218-1 / TS 15066 Safety Envelopes</text>

  <!-- ==================================================================== -->
  <!-- PANEL A: MULTI-REGIME TIMELINES & CLEARANCE BUDGET (TOP)             -->
  <!-- ==================================================================== -->
  <g id="panel-a" transform="translate(24, 44)">
    <rect x="0" y="0" width="1012" height="376" rx="8" fill="url(#panel-grad)" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header Strip -->
    <rect x="0" y="0" width="1012" height="34" rx="8" fill="#F1F5F9"/>
    <path d="M 0 26 L 0 34 L 1012 34 L 1012 26 Z" fill="#F1F5F9"/>
    <line x1="0" y1="34" x2="1012" y2="34" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="22" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.5">PANEL A: TEMPORAL MILESTONES, REPLANNING REGIMES &amp; STOPPING RUNWAY</text>
    <text x="996" y="22" font-size="10" font-weight="600" fill="#64748B" text-anchor="end">Active Chunk T_chunk = 500 ms · Available Clearance d_clear = 300 mm</text>

    <!-- Scale: 0 to 600 ms across x=130 to x=910 (width 780px => 1.30 px/ms) -->
    <!-- Milestone Vertical Grid Lines -->
    <!-- t_req = 0 (x=130) -->
    <line x1="130" y1="56" x2="130" y2="300" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="130" y="48" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">t_req = 0</text>

    <!-- t_blend = 300 (x=130 + 390 = 520) -->
    <line x1="520" y1="56" x2="520" y2="300" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="514" y="48" font-size="9.5" font-weight="700" fill="#059669" text-anchor="end">t_blend = 300 ms</text>

    <!-- t_commit = 360 (x=130 + 468 = 598) HARD COMMIT LINE -->
    <line x1="598" y1="56" x2="598" y2="350" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3"/>
    <rect x="552" y="34" width="92" height="18" rx="3" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
    <text x="598" y="46.5" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">t_commit = 360 ms</text>

    <!-- t_exp = 400 (x=130 + 520 = 650) -->
    <line x1="650" y1="56" x2="650" y2="300" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="656" y="48" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="start">t_exp = 400 ms</text>

    <!-- T_chunk = 500 (x=130 + 650 = 780) -->
    <line x1="780" y1="56" x2="780" y2="300" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="772" y="48" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">T_chunk = 500 ms</text>

    <!-- t_term = 560 (x=130 + 728 = 858) SAFE REST BADGE -->
    <line x1="858" y1="56" x2="858" y2="350" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="812" y="34" width="92" height="18" rx="3" fill="#DCFCE7" stroke="#10B981" stroke-width="1"/>
    <text x="858" y="46.5" font-size="8.5" font-weight="700" fill="#065F46" text-anchor="middle">t_term = 560 ms</text>

    <!-- REGIME 1: On-Time Arrival -->
    <g transform="translate(16, 68)">
      <text x="100" y="22" font-size="10.5" font-weight="700" fill="#1E293B" text-anchor="end">Regime 1: On-Time</text>
      <text x="100" y="36" font-size="9" fill="#2563EB" text-anchor="end">P₅₀ = 180 ms ≤ t_blend</text>

      <!-- Active Chunk A (x=114 to 504 => w=390) -->
      <rect x="114" y="6" width="390" height="38" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="309" y="30" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">Active Chunk A (Nominal Waypoints 1..N)</text>

      <!-- Full Quintic Blend Window (x=504 to 634 => w=130) -->
      <rect x="504" y="6" width="130" height="38" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
      <text x="569" y="22" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Full 100 ms Blend</text>
      <text x="569" y="34" font-size="8" font-weight="600" fill="#15803D" text-anchor="middle">Zero velocity penalty</text>

      <!-- Incoming Chunk B Execution (x=634 to 842 => w=208) -->
      <rect x="634" y="6" width="208" height="38" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="738" y="22" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">Incoming Chunk B</text>
      <text x="738" y="34" font-size="8.5" fill="#2563EB" text-anchor="middle">(Arrived 180 ms · Full Overlap)</text>
    </g>

    <!-- REGIME 2: Late-but-Blendable -->
    <g transform="translate(16, 142)">
      <text x="100" y="22" font-size="10.5" font-weight="700" fill="#1E293B" text-anchor="end">Regime 2: Late Blend</text>
      <text x="100" y="36" font-size="9" fill="#D97706" text-anchor="end">P₉₉ = 340 ms ≤ t_commit</text>

      <!-- Active Chunk A (x=114 to 556 => w=442) -->
      <rect x="114" y="6" width="442" height="38" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="335" y="30" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">Active Chunk A (Continuing Velocity across Unreplaced Gap)</text>

      <!-- Compressed Blend Window (x=556 to 634 => w=78) -->
      <rect x="556" y="6" width="78" height="38" rx="4" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
      <text x="595" y="21" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">60 ms Blend</text>
      <text x="595" y="33" font-size="7.5" font-weight="600" fill="#B45309" text-anchor="middle">a_peak ≈ 6Δq/T²</text>

      <!-- Incoming Chunk B Execution (x=634 to 842 => w=208) -->
      <rect x="634" y="6" width="208" height="38" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="738" y="22" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">Incoming Chunk B</text>
      <text x="738" y="34" font-size="8.5" fill="#2563EB" text-anchor="middle">(Arrived 340 ms · Compressed)</text>
    </g>

    <!-- REGIME 3: Missing Replacement / Fallback Engagement -->
    <g transform="translate(16, 216)">
      <text x="100" y="22" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="end">Regime 3: Fallback</text>
      <text x="100" y="36" font-size="9" fill="#991B1B" text-anchor="end">clock ≥ t_commit (360 ms)</text>

      <!-- Active Chunk A up to t_commit (x=114 to 582 => w=468) -->
      <rect x="114" y="6" width="468" height="38" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="348" y="30" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">Active Chunk A (Nominal Drift until Fallback Point)</text>

      <!-- Precomputed Deceleration Fallback Suffix (x=582 to 842 => w=260) -->
      <rect x="582" y="6" width="260" height="38" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
      <text x="712" y="22" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle">Precomputed Deceleration Suffix (C²)</text>
      <text x="712" y="34" font-size="8.5" font-weight="600" fill="#B91C1C" text-anchor="middle">a_max = 6.0 m/s² · Safe Rest at t_term = 560 ms</text>

      <!-- Clearance Dimensioning Lines (below Regime 3) -->
      <g transform="translate(0, 50)">
        <!-- Late Drift Distance: x=504 to 582 -->
        <line x1="504" y1="12" x2="578" y2="12" stroke="#334155" stroke-width="1.2" marker-start="url(#arr-rev-navy)" marker-end="url(#arr-navy)"/>
        <rect x="508" y="18" width="66" height="15" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.75"/>
        <text x="541" y="29" font-size="8.5" font-weight="700" fill="#1E293B" text-anchor="middle">d_late = 72 mm</text>

        <!-- Active Braking Distance: x=586 to 838 -->
        <line x1="586" y1="12" x2="838" y2="12" stroke="#DC2626" stroke-width="1.2" marker-start="url(#arr-rev-rose)" marker-end="url(#arr-rose)"/>
        <rect x="664" y="18" width="112" height="15" rx="3" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.75"/>
        <text x="720" y="29" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">d_brake = 120 mm (Braking)</text>

        <!-- Total Stopping Distance Bar -->
        <rect x="504" y="42" width="338" height="20" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
        <text x="673" y="56" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">d_total = d_late + d_brake = 192 mm &lt; d_clear (300 mm) ✓ SAFE HALT</text>
      </g>
    </g>

    <!-- Delayed Commitment Hazard Warning Strip -->
    <g transform="translate(16, 336)">
      <rect x="114" y="0" width="876" height="28" rx="4" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
      <text x="124" y="18" font-size="9.5" font-weight="700" fill="#92400E">Commitment Invariant:</text>
      <text x="250" y="18" font-size="9" fill="#78350F">Waiting until chunk expiry t_exp (400 ms) expands drift to 120 mm, pushing d_total to 240 mm and destroying physical clearance margins.</text>
    </g>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL B: REAL-TIME FSM & TECHNICAL SPECIFICATION MATRIX (BOTTOM)     -->
  <!-- ==================================================================== -->
  <g id="panel-b" transform="translate(24, 432)">
    <rect x="0" y="0" width="1012" height="308" rx="8" fill="url(#panel-grad)" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header Strip -->
    <rect x="0" y="0" width="1012" height="34" rx="8" fill="#F1F5F9"/>
    <path d="M 0 26 L 0 34 L 1012 34 L 1012 26 Z" fill="#F1F5F9"/>
    <line x1="0" y1="34" x2="1012" y2="34" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="22" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.5">PANEL B: REAL-TIME SEAM STATE MACHINE &amp; FALLBACK STRATEGY SPECIFICATION</text>
    <text x="996" y="22" font-size="10" font-weight="600" fill="#64748B" text-anchor="end">Deterministic Escalation vs. Naive Holding Hazards</text>

    <!-- Left Subpanel: Seam Ingestion State Machine -->
    <g transform="translate(16, 46)">
      <rect x="0" y="0" width="374" height="248" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <rect x="0" y="0" width="374" height="26" rx="6" fill="#F8FAFC"/>
      <path d="M 0 20 L 0 26 L 374 26 L 374 20 Z" fill="#F8FAFC"/>
      <line x1="0" y1="26" x2="374" y2="26" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="17" font-size="10.5" font-weight="700" fill="#1E293B">Real-Time Ingestion Finite State Machine</text>

      <!-- FSM States Flow -->
      <g transform="translate(12, 34)">
        <!-- State 1: BUFFER_ACTIVE -->
        <rect x="0" y="0" width="144" height="40" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
        <text x="10" y="17" font-size="10" font-weight="700" fill="#1D4ED8">1. BUFFER_ACTIVE</text>
        <text x="10" y="30" font-size="8.5" fill="#1E40AF">Executing chunk A (1 kHz)</text>

        <!-- Arrow 1 to 2 -->
        <path d="M 72 40 L 72 56" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr-navy)"/>
        <text x="78" y="50" font-size="8" font-weight="600" fill="#64748B">clock ≥ t_req</text>

        <!-- State 2: REPLAN_SENT -->
        <g transform="translate(0, 58)">
          <rect x="0" y="0" width="144" height="40" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
          <text x="10" y="17" font-size="10" font-weight="700" fill="#334155">2. REPLAN_SENT</text>
          <text x="10" y="30" font-size="8.5" fill="#475569">Awaiting policy chunk B</text>
        </g>

        <!-- Branch 1: On-time (t <= t_blend) -> State 3A -->
        <path d="M 144 78 L 186 78 L 186 20 L 202 20" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
        <text x="150" y="15" font-size="7.5" font-weight="700" fill="#059669">t ≤ t_blend</text>

        <rect x="206" y="0" width="144" height="40" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.2"/>
        <text x="216" y="17" font-size="9.5" font-weight="700" fill="#166534">3A. FULL_BLEND</text>
        <text x="216" y="30" font-size="8" fill="#15803D">100 ms quintic C² bridge</text>

        <!-- Branch 2: Late-but-blendable -> State 3B -->
        <path d="M 144 78 L 202 78" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
        <text x="148" y="73" font-size="7.5" font-weight="700" fill="#D97706">t ≤ t_commit</text>

        <rect x="206" y="58" width="144" height="40" rx="4" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
        <text x="216" y="75" font-size="9.5" font-weight="700" fill="#92400E">3B. COMPRESSED</text>
        <text x="216" y="88" font-size="8" fill="#78350F">Algebraic a_peak check</text>

        <!-- Branch 3: Fallback commitment (clock >= t_commit) -> State 4 -->
        <path d="M 72 98 L 72 126" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-rose)"/>
        <text x="78" y="116" font-size="8" font-weight="700" fill="#DC2626">clock ≥ t_commit</text>

        <!-- State 4: COMMIT_FALLBACK -->
        <g transform="translate(0, 128)">
          <rect x="0" y="0" width="350" height="72" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
          <text x="12" y="17" font-size="10.5" font-weight="700" fill="#991B1B">4. COMMIT_FALLBACK (Unconditional Branch)</text>
          <text x="12" y="31" font-size="8.5" fill="#B91C1C">• Reject all subsequent late chunks unconditionally</text>
          <text x="12" y="44" font-size="8.5" fill="#B91C1C">• Engage precomputed C² deceleration profile to rest</text>
          <text x="12" y="58" font-size="8.5" font-weight="700" fill="#15803D">✓ Terminal state at t_term: Clamp spring holding brakes</text>
        </g>
      </g>
    </g>

    <!-- Right Subpanel: Strategy Specification & Hazard Comparison Matrix -->
    <g transform="translate(406, 46)">
      <rect x="0" y="0" width="590" height="248" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <rect x="0" y="0" width="590" height="26" rx="6" fill="#F8FAFC"/>
      <path d="M 0 20 L 0 26 L 590 26 L 590 20 Z" fill="#F8FAFC"/>
      <line x1="0" y1="26" x2="590" y2="26" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="17" font-size="10.5" font-weight="700" fill="#1E293B">Terminal Fallback Strategies vs. Naive Hold Anti-Patterns</text>

      <!-- Matrix Rows -->
      <g transform="translate(10, 32)">
        <!-- Row 1: Holding Torque -->
        <rect x="0" y="0" width="570" height="48" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
        <text x="10" y="16" font-size="10" font-weight="700" fill="#991B1B">Holding Torque (τ_cmd = const)</text>
        <rect x="474" y="6" width="86" height="18" rx="3" fill="#FEE2E2"/>
        <text x="517" y="18" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">UNSTABLE DRIFT</text>
        <text x="10" y="30" font-size="8.5" fill="#475569">Actuator maintains constant current. Shifting gravitational moments or friction loss allows mechanism</text>
        <text x="10" y="41" font-size="8.5" fill="#475569">to accelerate freely into workspace boundaries. Zero stopping guarantee.</text>

        <!-- Row 2: Holding Position -->
        <g transform="translate(0, 52)">
          <rect x="0" y="0" width="570" height="48" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
          <text x="10" y="16" font-size="10" font-weight="700" fill="#991B1B">Holding Position (q_cmd = const, v_cmd = 0)</text>
          <rect x="474" y="6" width="86" height="18" rx="3" fill="#FEE2E2"/>
          <text x="517" y="18" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">INVERTER SHOCK</text>
          <text x="10" y="30" font-size="8.5" fill="#475569">Commands step change in velocity (infinite commanded acceleration). High-gain PID demands</text>
          <text x="10" y="41" font-size="8.5" fill="#475569">maximum coil current, instantly tripping overcurrent gates and exciting destructive driveline resonance.</text>
        </g>

        <!-- Row 3: Continuing Velocity -->
        <g transform="translate(0, 104)">
          <rect x="0" y="0" width="570" height="48" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
          <text x="10" y="16" font-size="10" font-weight="700" fill="#991B1B">Continuing Velocity (v_cmd = const)</text>
          <rect x="474" y="6" width="86" height="18" rx="3" fill="#FEE2E2"/>
          <text x="517" y="18" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">COLLISION TRIP</text>
          <text x="10" y="30" font-size="8.5" fill="#475569">Avoids current spike but drives robot blind at cruise velocity. Consumes remaining 108 mm clearance</text>
          <text x="10" y="41" font-size="8.5" fill="#475569">in 90 ms, breaching envelope and producing hard kinetic impact at 1.2 m/s.</text>
        </g>

        <!-- Row 4: Structured Fallback Deceleration (The Gold Standard) -->
        <g transform="translate(0, 156)">
          <rect x="0" y="0" width="570" height="52" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
          <text x="10" y="16" font-size="10" font-weight="700" fill="#065F46">Structured Fallback Deceleration (Precomputed C² Suffix)</text>
          <rect x="474" y="6" width="86" height="18" rx="3" fill="#DCFCE7"/>
          <text x="517" y="18" font-size="8.5" font-weight="700" fill="#15803D" text-anchor="middle">CERTIFIED SAFE</text>
          <text x="10" y="30" font-size="8.5" fill="#166534">Precomputed 5th-order polynomial brings v to 0 at a_max = 6.0 m/s². Guarantees stopping within</text>
          <text x="10" y="42" font-size="8.5" font-weight="700" fill="#047857">d_total = 192 mm &lt; 300 mm clearance; clamps holding brakes at t_term to zero thermal I²R heating.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
