<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <style>
            .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
            .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #334155; }
            .label-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
            .milestone-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
            .axis-line { stroke: #334155; stroke-width: 1.5; }
            .chunk-a { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; rx: 3; ry: 3; }
            .chunk-b { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; rx: 3; ry: 3; }
            .fallback-zone { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; rx: 3; ry: 3; }
            .blend-window { fill: #bbf7d0; opacity: 0.75; rx: 3; ry: 3; }
            .callout-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 4; ry: 4; }
            .callout-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #475569; }
            .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
            .card-error { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; }
            .card-success { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #16a34a; }
        </style>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
        </marker>
        <marker id="arrowhead-rev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
            <polygon points="10 0, 0 3.5, 10 7" fill="#334155" />
        </marker>
        <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
        </marker>
        <marker id="arrowhead-red-rev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
            <polygon points="10 0, 0 3.5, 10 7" fill="#dc2626" />
        </marker>
    </defs>

    <rect width="1000" height="710" fill="#ffffff" />
    <g transform="translate(0, -45)">
    
    <!-- Time Axis scale: 0 to 600 ms, map 0->100px, 600->900px, scale = (900-100)/600 = 1.33 px/ms -->
    <!-- X offsets:
         t_req = 0 -> 100
         P50 = 180 -> 340
         t_blend = 300 -> 500
         P99 = 340 -> 553.3
         t_commit = 360 -> 580
         t_exp = 400 -> 633.3
         T_chunk = 500 -> 766.6
         t_term = 560 -> 846.6
    -->
    
    <g transform="translate(0, 75)">
        <text x="50" y="4" class="subtitle">Timeline Milestones</text>
        <line x1="90" y1="42" x2="905" y2="42" class="axis-line" marker-end="url(#arrowhead)" />
        
        <!-- Milestones (staggered to prevent horizontal collisions, all safely above axis line at y=42) -->
        <!-- t_req -->
        <line x1="100" y1="36" x2="100" y2="505" class="milestone-line" />
        <text x="100" y="26" class="label-bold" text-anchor="middle">t_req = 0</text>
        
        <!-- t_blend -->
        <line x1="500" y1="18" x2="500" y2="505" class="milestone-line" />
        <text x="500" y="10" class="label-bold" text-anchor="middle">t_blend = 300</text>
        
        <!-- t_commit (alert pill seated above axis line) -->
        <line x1="580" y1="28" x2="580" y2="505" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" />
        <rect x="528" y="18" width="104" height="18" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
        <text x="580" y="31" class="label-bold" text-anchor="middle" font-size="11" fill="#dc2626">t_commit = 360</text>
        
        <!-- t_exp -->
        <line x1="633" y1="18" x2="633" y2="505" class="milestone-line" />
        <text x="645" y="10" class="label-bold" text-anchor="middle">t_exp = 400</text>
        
        <!-- T_chunk -->
        <line x1="766" y1="36" x2="766" y2="505" class="milestone-line" />
        <text x="766" y="26" class="label-bold" text-anchor="middle">T_chunk = 500</text>
        
        <!-- t_term (staggered up to give T_chunk breathing room) -->
        <line x1="846" y1="18" x2="846" y2="505" class="milestone-line" />
        <text x="846" y="10" class="label-bold" text-anchor="middle">t_term = 560</text>
    </g>

    <!-- Regime 1 -->
    <g transform="translate(0, 160)">
        <text x="50" y="0" class="subtitle">Regime 1: On-Time Arrival (P50 = 180 ms)</text>
        
        <rect x="100" y="10" width="533" height="42" class="chunk-a" />
        <text x="215" y="36" class="label-bold">Active Chunk A</text>
        
        <rect x="340" y="26" width="400" height="42" class="chunk-b" />
        <text x="685" y="44" class="label-bold" text-anchor="middle" fill="#1e40af">Incoming Chunk B</text>
        <text x="685" y="58" class="callout-text" text-anchor="middle" fill="#1e40af">(Arrived 180 ms)</text>
        
        <rect x="500" y="10" width="133" height="58" class="blend-window" />
        <text x="566" y="35" class="label-bold" text-anchor="middle" fill="#166534">Full 100ms Blend</text>
        <text x="566" y="51" class="callout-text" text-anchor="middle" fill="#166534">Zero velocity penalty</text>
    </g>

    <!-- Regime 2 -->
    <g transform="translate(0, 275)">
        <text x="50" y="0" class="subtitle">Regime 2: Late-but-Blendable (P99 = 340 ms)</text>
        
        <rect x="100" y="10" width="533" height="42" class="chunk-a" />
        <text x="320" y="36" class="label-bold">Active Chunk A</text>
        
        <rect x="553" y="26" width="280" height="42" class="chunk-b" />
        <text x="730" y="44" class="label-bold" text-anchor="middle" fill="#1e40af">Incoming Chunk B</text>
        <text x="730" y="58" class="callout-text" text-anchor="middle" fill="#1e40af">(Arrived 340 ms)</text>
        
        <rect x="553" y="10" width="80" height="58" class="blend-window" />
        <text x="593" y="28" class="label-bold" text-anchor="middle" font-size="11" fill="#166534">60ms Blend</text>
        <text x="593" y="42" class="callout-text" text-anchor="middle" font-size="10" fill="#166534">High peak</text>
        <text x="593" y="54" class="callout-text" text-anchor="middle" font-size="10" fill="#166534">accel</text>
    </g>

    <!-- Regime 3 -->
    <g transform="translate(0, 390)">
        <text x="50" y="0" class="subtitle">Regime 3: Missing Replacement (Fallback triggered at t_commit)</text>
        
        <rect x="100" y="10" width="480" height="42" class="chunk-a" />
        <text x="320" y="36" class="label-bold">Active Chunk A</text>
        
        <!-- Fallback zone -->
        <rect x="580" y="10" width="266" height="42" class="fallback-zone" />
        <text x="713" y="36" class="label-bold" text-anchor="middle" fill="#991b1b">Precomputed Deceleration</text>
        
        <!-- Distances with clean arrows -->
        <line x1="506" y1="70" x2="574" y2="70" stroke="#334155" stroke-width="1.5" marker-start="url(#arrowhead-rev)" marker-end="url(#arrowhead)" />
        <rect x="510" y="78" width="60" height="16" rx="2" fill="#ffffff" />
        <text x="540" y="90" class="callout-text" text-anchor="middle">d_late (72mm)</text>
        
        <line x1="586" y1="70" x2="840" y2="70" stroke="#dc2626" stroke-width="1.5" marker-start="url(#arrowhead-red-rev)" marker-end="url(#arrowhead-red)" />
        <rect x="625" y="78" width="176" height="16" rx="2" fill="#ffffff" />
        <text x="713" y="90" class="callout-text" text-anchor="middle" fill="#dc2626">d_brake (120mm) at a_max=6.0 m/s²</text>
        
        <!-- Clearance total with masked background card to prevent line overlap -->
        <line x1="500" y1="112" x2="846" y2="112" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,4" />
        <rect x="515" y="103" width="316" height="18" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <text x="673" y="116" class="label-bold" text-anchor="middle" fill="#1e40af">d_total = 192mm &lt; d_clear (300mm) → Safe Halt</text>
    </g>

    <!-- Bottom Cards: Failure Modes of Naive Hold Strategies vs Structured Fallback -->
    <g transform="translate(50, 580)">
        <text x="0" y="0" class="subtitle">Failure Modes of Naive Hold Strategies vs Structured Fallback</text>
        
        <rect x="0" y="20" width="210" height="125" class="callout-box" rx="4" />
        <text x="14" y="42" class="card-title">Holding Torque</text>
        <text x="14" y="64" class="callout-text">Constant actuator effort.</text>
        <text x="14" y="82" class="callout-text">Allows mechanism to</text>
        <text x="14" y="100" class="callout-text">accelerate uncontrollably.</text>
        <text x="14" y="124" class="card-error">Result: Unstable drift</text>

        <rect x="230" y="20" width="210" height="125" class="callout-box" rx="4" />
        <text x="244" y="42" class="card-title">Holding Position</text>
        <text x="244" y="64" class="callout-text">Instantaneous zero velocity.</text>
        <text x="244" y="82" class="callout-text">Step change in command</text>
        <text x="244" y="100" class="callout-text">draws peak spike current.</text>
        <text x="244" y="124" class="card-error">Result: Inverter trip &amp; shock</text>

        <rect x="460" y="20" width="210" height="125" class="callout-box" rx="4" />
        <text x="474" y="42" class="card-title">Continuing Velocity</text>
        <text x="474" y="64" class="callout-text">Maintains current speed.</text>
        <text x="474" y="82" class="callout-text">Expends remaining clearance</text>
        <text x="474" y="100" class="callout-text">until impact occurs.</text>
        <text x="474" y="124" class="card-error">Result: Workspace collision</text>

        <rect x="690" y="20" width="210" height="125" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
        <text x="704" y="42" class="card-title" fill="#166534">Structured Fallback</text>
        <text x="704" y="64" class="callout-text" fill="#166534">Precomputed C² deceleration.</text>
        <text x="704" y="82" class="callout-text" fill="#166534">Stops within clearance</text>
        <text x="704" y="100" class="callout-text" fill="#166534">using valid torque bounds.</text>
        <text x="704" y="124" class="card-success">Result: Safe controlled halt</text>
    </g>
    </g>

</svg>
