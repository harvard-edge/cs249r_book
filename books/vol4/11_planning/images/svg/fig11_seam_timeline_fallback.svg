<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>

    <!-- Hatch pattern for stopping clearance boundary -->
    <pattern id="clear-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#E2E8F0" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" fill="#FFFFFF"/>

  <!-- Sub-Figure Headers -->
  <text x="240" y="32" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(a) Seam Timeline &amp; Stopping Clearance</text>
  <text x="730" y="32" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(b) Seam Ingestion State Machine</text>

  <!-- Divider between panels -->
  <line x1="480" y1="20" x2="480" y2="400" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): SEAM TIMELINE & STOPPING CLEARANCE                        -->
  <!-- ==================================================================== -->
  <g id="panel-a" transform="translate(30, 0)">
    <!-- Milestone Ticks along the Top -->
    <!-- t_req -->
    <line x1="40" y1="55" x2="40" y2="290" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="40" y="50" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle">t_req</text>

    <!-- t_blend -->
    <line x1="220" y1="55" x2="220" y2="290" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="220" y="50" font-size="8.5" font-weight="700" fill="#15803D" text-anchor="middle">t_blend</text>

    <!-- t_commit (Red Vertical Boundary) -->
    <line x1="260" y1="55" x2="260" y2="290" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="260" y="50" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">t_commit</text>

    <!-- t_exp -->
    <line x1="330" y1="55" x2="330" y2="290" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="330" y="50" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">t_exp</text>

    <!-- t_term -->
    <line x1="400" y1="55" x2="400" y2="290" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="400" y="50" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">t_term</text>

    <!-- Track 1: Nominal Chunk Splicing -->
    <text x="40" y="80" font-size="9" font-weight="700" fill="#334155">Nominal Splicing (Chunk Received On-Time)</text>

    <!-- Chunk A -->
    <rect x="40" y="90" width="180" height="34" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="130" y="111" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">Active Chunk A</text>

    <!-- Spline Blend -->
    <rect x="220" y="90" width="60" height="34" rx="0" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="250" y="111" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">Blend</text>

    <!-- Chunk B -->
    <rect x="280" y="90" width="120" height="34" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="340" y="111" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Chunk B</text>

    <!-- Track 2: Fallback Deceleration upon Timeout -->
    <text x="40" y="165" font-size="9" font-weight="700" fill="#991B1B">Fallback Execution (Clock ≥ t_commit)</text>

    <!-- Chunk A (Running through drift) -->
    <rect x="40" y="175" width="220" height="34" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="130" y="196" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">Active Chunk A</text>

    <!-- Precomputed Deceleration Suffix -->
    <rect x="260" y="175" width="140" height="34" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="330" y="196" font-size="9" font-weight="700" fill="#991B1B" text-anchor="middle">C² Deceleration Suffix</text>

    <!-- Clearance Distance Brackets -->
    <!-- d_late -->
    <line x1="220" y1="230" x2="260" y2="230" stroke="#64748B" stroke-width="1.2"/>
    <line x1="220" y1="226" x2="220" y2="234" stroke="#64748B" stroke-width="1.2"/>
    <line x1="260" y1="226" x2="260" y2="234" stroke="#64748B" stroke-width="1.2"/>
    <text x="240" y="244" font-size="8.5" font-weight="600" fill="#475569" text-anchor="middle">d_late</text>

    <!-- d_brake -->
    <line x1="260" y1="230" x2="400" y2="230" stroke="#64748B" stroke-width="1.2"/>
    <line x1="400" y1="226" x2="400" y2="234" stroke="#64748B" stroke-width="1.2"/>
    <text x="330" y="244" font-size="8.5" font-weight="600" fill="#475569" text-anchor="middle">d_brake</text>

    <!-- Total Stopping Distance & Clearance Bound -->
    <rect x="90" y="280" width="310" height="46" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="245" y="300" font-size="9.5" font-family="monospace" font-weight="700" fill="#1E40AF" text-anchor="middle">d_total = d_late + d_brake ≤ d_clear</text>
    <text x="245" y="316" font-size="8.5" font-weight="600" fill="#059669" text-anchor="middle">Autonomous Safe Rest at t_term</text>

    <!-- Time Axis at Bottom -->
    <line x1="40" y1="365" x2="410" y2="365" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <text x="415" y="369" font-size="9" font-weight="700" fill="#334155">Time t</text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): SEAM INGESTION FINITE STATE MACHINE                       -->
  <!-- ==================================================================== -->
  <g id="panel-b" transform="translate(520, 0)">
    <!-- State 1: ACTIVE_CHUNK -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="160" height="50" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
      <text x="80" y="23" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">ACTIVE_CHUNK</text>
      <text x="80" y="38" font-size="9" font-weight="500" fill="#3B82F6" text-anchor="middle">Tracking at 1 kHz</text>
    </g>

    <!-- Transition down: t >= t_req -->
    <line x1="120" y1="110" x2="120" y2="160" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <text x="130" y="138" font-size="9" font-weight="600" fill="#475569">t ≥ t_req</text>

    <!-- State 2: REPLAN_PENDING -->
    <g transform="translate(40, 160)">
      <rect x="0" y="0" width="160" height="50" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
      <text x="80" y="23" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">REPLAN_PENDING</text>
      <text x="80" y="38" font-size="9" font-weight="500" fill="#B45309" text-anchor="middle">Awaiting Policy Chunk</text>
    </g>

    <!-- Branch 1: On-Time Chunk Arrival -> SPLINE_BLEND -->
    <path d="M 200 185 L 260 185" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <text x="230" y="175" font-size="8.5" font-weight="700" fill="#059669" text-anchor="middle">t &lt; t_commit</text>

    <!-- State 3: SPLINE_BLEND -->
    <g transform="translate(260, 160)">
      <rect x="0" y="0" width="135" height="50" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
      <text x="67" y="23" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">SPLINE_BLEND</text>
      <text x="67" y="38" font-size="9" font-weight="500" fill="#15803D" text-anchor="middle">C² Quintic Synthesis</text>
    </g>

    <!-- Return to ACTIVE_CHUNK from SPLINE_BLEND -->
    <path d="M 327 160 L 327 85 L 205 85" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <text x="335" y="115" font-size="8.5" font-weight="600" fill="#15803D">Handoff</text>

    <!-- Branch 2: Timeout t >= t_commit -> STRUCTURED_FALLBACK -->
    <line x1="120" y1="210" x2="120" y2="280" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
    <text x="130" y="248" font-size="9" font-weight="700" fill="#DC2626">t ≥ t_commit</text>

    <!-- State 4: STRUCTURED_FALLBACK -->
    <g transform="translate(30, 280)">
      <rect x="0" y="0" width="180" height="54" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
      <text x="90" y="23" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">STRUCTURED_FALLBACK</text>
      <text x="90" y="38" font-size="8.5" font-weight="500" fill="#B91C1C" text-anchor="middle">C² Deceleration to Rest</text>
    </g>

    <!-- Holding Brake Engagement Arrow -->
    <line x1="120" y1="334" x2="120" y2="370" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-dark)"/>
    <rect x="55" y="370" width="130" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="120" y="387" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">Mechanical Brakes Clamped</text>
  </g>
</svg>
