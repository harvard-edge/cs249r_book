<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c44"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3d9e5a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c87b2a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================================================================== -->
  <!-- SUB-CARD 1 (LEFT): NAIVE STALE-STATE CONDITIONING                     -->
  <!-- ==================================================================== -->
  <g id="subcard-left" transform="translate(16, 16)">
    <!-- Container -->
    <rect width="246" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

    <!-- Header & Badge -->
    <text x="12" y="18" font-size="10" font-weight="700" fill="#1e293b">Naive Stale Conditioning</text>
    <rect x="156" y="8" width="78" height="16" rx="8" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="195" y="19" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Δq Step Jump</text>

    <!-- Sub-label -->
    <text x="12" y="30" font-size="7.5" fill="#64748b">Conditions rollout on stale measurement q(t₀)</text>

    <!-- Axes -->
    <line x1="32" y1="108" x2="234" y2="108" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-dark)"/>
    <text x="232" y="118" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="end">Time t</text>

    <line x1="32" y1="108" x2="32" y2="44" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-dark)"/>
    <text x="32" y="40" font-size="7.5" font-weight="600" fill="#334155" text-anchor="middle">Joint q</text>

    <!-- Latency duration bracket Δt_plan -->
    <line x1="56" y1="46" x2="140" y2="46" stroke="#c87b2a" stroke-width="1"/>
    <line x1="56" y1="43" x2="56" y2="49" stroke="#c87b2a" stroke-width="1"/>
    <line x1="140" y1="43" x2="140" y2="49" stroke="#c87b2a" stroke-width="1"/>
    <text x="98" y="42" font-size="7.5" font-weight="600" fill="#78350f" text-anchor="middle">Δt_plan = 80 ms</text>

    <!-- Vertical Guides -->
    <!-- t_0 -->
    <line x1="56" y1="48" x2="56" y2="108" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,2"/>
    <line x1="56" y1="108" x2="56" y2="112" stroke="#94a3b8" stroke-width="1"/>
    <text x="56" y="120" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">t₀</text>

    <!-- t_admit -->
    <line x1="140" y1="48" x2="140" y2="108" stroke="#fca5a5" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="140" y1="108" x2="140" y2="112" stroke="#c44" stroke-width="1"/>
    <text x="140" y="120" font-size="8" font-weight="700" fill="#c44" text-anchor="middle">t_admit</text>

    <!-- Executing Chunk A -->
    <path d="M 56 92 Q 98 86 140 60" fill="none" stroke="#4a90c4" stroke-width="2"/>
    <text x="82" y="80" font-size="7.5" font-weight="600" fill="#1e3a8a">Chunk A</text>

    <!-- Actual state at t_admit -->
    <circle cx="140" cy="60" r="3" fill="#4a90c4"/>
    <text x="134" y="56" font-size="7" font-weight="600" fill="#1e3a8a" text-anchor="end">q_A(t_admit)</text>

    <!-- Stale measured state q(t0) -->
    <circle cx="56" cy="92" r="2.5" fill="#64748b"/>
    <text x="50" y="95" font-size="7" font-weight="600" fill="#64748b" text-anchor="end">q(t₀)</text>
    <line x1="56" y1="92" x2="140" y2="92" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="2,2"/>

    <!-- Incoming Chunk B arriving at stale level q(t0) -->
    <path d="M 140 92 Q 180 88 220 72" fill="none" stroke="#c44" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="140" cy="92" r="3" fill="#c44"/>
    <text x="182" y="70" font-size="7.5" font-weight="600" fill="#c44">Chunk B</text>

    <!-- Execution delay gap Δq_gap -->
    <line x1="140" y1="60" x2="140" y2="92" stroke="#c44" stroke-width="1.5"/>
    <line x1="136" y1="60" x2="144" y2="60" stroke="#c44" stroke-width="1.5"/>
    <line x1="136" y1="92" x2="144" y2="92" stroke="#c44" stroke-width="1.5"/>
    <text x="146" y="78" font-size="7.5" font-weight="700" fill="#7f1d1d">Δq_gap</text>

    <!-- Bottom Hazard Badge -->
    <rect x="12" y="127" width="222" height="15" rx="3" fill="#f9d6d5" stroke="#c44" stroke-width="0.5"/>
    <text x="123" y="138" font-size="7.5" font-weight="600" fill="#7f1d1d" text-anchor="middle">τ_step = K_p · Δq_gap → Inverter Overcurrent Trip</text>
  </g>

  <!-- ==================================================================== -->
  <!-- SUB-CARD 2 (RIGHT): FORWARD FUTURE-STATE CONDITIONING                 -->
  <!-- ==================================================================== -->
  <g id="subcard-right" transform="translate(278, 16)">
    <!-- Container -->
    <rect width="246" height="148" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

    <!-- Header & Badge -->
    <text x="12" y="18" font-size="10" font-weight="700" fill="#1e293b">Future-State Conditioning</text>
    <rect x="154" y="8" width="80" height="16" rx="8" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="194" y="19" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">C² Smooth Seam</text>

    <!-- Sub-label -->
    <text x="12" y="30" font-size="7.5" fill="#64748b">Rollout conditioned on predicted state q̂_A(t_admit)</text>

    <!-- Axes -->
    <line x1="32" y1="108" x2="234" y2="108" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-dark)"/>
    <text x="232" y="118" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="end">Time t</text>

    <line x1="32" y1="108" x2="32" y2="44" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-dark)"/>
    <text x="32" y="40" font-size="7.5" font-weight="600" fill="#334155" text-anchor="middle">Joint q</text>

    <!-- Forward Sim Planning Span -->
    <line x1="56" y1="46" x2="140" y2="46" stroke="#c87b2a" stroke-width="1"/>
    <line x1="56" y1="43" x2="56" y2="49" stroke="#c87b2a" stroke-width="1"/>
    <line x1="140" y1="43" x2="140" y2="49" stroke="#c87b2a" stroke-width="1"/>
    <text x="98" y="42" font-size="7.5" font-weight="600" fill="#78350f" text-anchor="middle">Forward sim Δt_plan</text>

    <!-- Vertical Guides -->
    <!-- t_0 -->
    <line x1="56" y1="48" x2="56" y2="108" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,2"/>
    <line x1="56" y1="108" x2="56" y2="112" stroke="#94a3b8" stroke-width="1"/>
    <text x="56" y="120" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">t₀</text>

    <!-- t_admit -->
    <line x1="140" y1="48" x2="140" y2="108" stroke="#86efac" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="140" y1="108" x2="140" y2="112" stroke="#3d9e5a" stroke-width="1"/>
    <text x="140" y="120" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">t_admit</text>

    <!-- Executing Chunk A -->
    <path d="M 56 92 Q 98 86 140 60" fill="none" stroke="#4a90c4" stroke-width="2"/>
    <text x="76" y="80" font-size="7.5" font-weight="600" fill="#1e3a8a">Chunk A</text>

    <!-- Forward Simulation Projection Ray -->
    <path d="M 56 92 L 136 62" fill="none" stroke="#c87b2a" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>

    <!-- Seam handoff label on left -->
    <text x="134" y="54" font-size="7" font-weight="700" fill="#14532d" text-anchor="end">q_B(0) = q̂_A(t_admit)</text>

    <!-- Seam point -->
    <circle cx="140" cy="60" r="3.5" fill="#3d9e5a"/>

    <!-- Seamless Chunk B -->
    <path d="M 140 60 Q 180 38 220 32" fill="none" stroke="#3d9e5a" stroke-width="2"/>
    <text x="185" y="52" font-size="7.5" font-weight="600" fill="#14532d">Chunk B</text>

    <!-- Zero Gap Stamp -->
    <rect x="74" y="96" width="56" height="12" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.5"/>
    <text x="102" y="105" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">Δq_gap = 0</text>

    <!-- Bottom Nominal Badge -->
    <rect x="12" y="127" width="222" height="15" rx="3" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.5"/>
    <text x="123" y="138" font-size="7.5" font-weight="600" fill="#14532d" text-anchor="middle">Continuous Momentum (C²) · Zero Torque Shock</text>
  </g>
</svg>
