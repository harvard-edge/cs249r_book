<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 555" width="1120" height="555" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <!-- Textbook palette: Slate #0f172a, Cobalt #2563eb, Emerald #16a34a, Crimson #dc2626 -->
        <style>
            .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
            .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #475569; }
            .label-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
            .axis-line { stroke: #334155; stroke-width: 1.5; }
            .grid-line { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4,4; }
            .chunk-a { stroke: #1e3a8a; stroke-width: 3; fill: none; }
            .chunk-b { stroke: #2563eb; stroke-width: 3; fill: none; stroke-dasharray: 6,4; }
            .error-line { stroke: #dc2626; stroke-width: 3; fill: none; }
            .bridge-line { stroke: #16a34a; stroke-width: 3; fill: none; }
            .callout-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 3; ry: 3; }
            .callout-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #475569; }
            .alert-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; }
            .success-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #16a34a; }
        </style>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
        </marker>
        <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="1120" height="555" fill="#ffffff" />
    <g transform="translate(0, -45)">
    
    <!-- LEFT PANEL: Case A: Unchecked C0 Concatenation -->
    <g transform="translate(45, 80)">
        <text x="200" y="0" class="subtitle" text-anchor="middle">Case A: Unchecked C⁰ Concatenation</text>
        
        <!-- Axes for Velocity -->
        <text x="-32" y="70" class="label-bold" text-anchor="middle" transform="rotate(-90, -32, 70)">Velocity (rad/s)</text>
        <line x1="0" y1="120" x2="400" y2="120" class="axis-line" marker-end="url(#arrowhead)" />
        <line x1="0" y1="120" x2="0" y2="20" class="axis-line" marker-end="url(#arrowhead)" />
        
        <text x="200" y="155" class="label" text-anchor="middle">Time (ms)</text>
        <text x="200" y="136" class="label-bold" text-anchor="middle">t_seam = 50ms</text>
        <line x1="200" y1="20" x2="200" y2="120" class="grid-line" />
        
        <!-- Velocity Plot -->
        <!-- Chunk A ends at (200, 80) with slope. Chunk B starts at (200, 40) -->
        <path fill="none" d="M 0 100 Q 100 90 200 80" class="chunk-a" />
        <path fill="none" d="M 200 40 Q 300 50 400 60" class="chunk-b" />
        <line x1="200" y1="80" x2="200" y2="40" class="error-line" />
        <circle cx="200" cy="80" r="4" fill="#1e3a8a" />
        <circle cx="200" cy="40" r="4" fill="#dc2626" />
        
        <!-- Velocity callout positioned above curve in open space -->
        <rect x="225" y="6" width="165" height="38" class="callout-box" rx="3" />
        <text x="235" y="21" class="alert-text">Δv = +0.60 rad/s step</text>
        <text x="235" y="34" class="callout-text">over single 1.0 ms period</text>

        <!-- Axes for Torque -->
        <text x="-32" y="240" class="label-bold" text-anchor="middle" transform="rotate(-90, -32, 240)">Torque (N·m)</text>
        <line x1="0" y1="320" x2="400" y2="320" class="axis-line" marker-end="url(#arrowhead)" />
        <line x1="0" y1="320" x2="0" y2="160" class="axis-line" marker-end="url(#arrowhead)" />
        
        <text x="200" y="355" class="label" text-anchor="middle">Time (ms)</text>
        <line x1="200" y1="160" x2="200" y2="320" class="grid-line" />
        
        <!-- Limits -->
        <line x1="0" y1="280" x2="400" y2="280" class="grid-line" />
        
        <line x1="0" y1="240" x2="400" y2="240" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,4" />
        
        <line x1="0" y1="180" x2="400" y2="180" stroke="#dc2626" stroke-width="2" />
        
        <!-- Torque Plot -->
        <path fill="none" d="M 0 300 Q 100 295 199 290" class="chunk-a" />
        <path fill="none" d="M 201 290 Q 300 295 400 300" class="chunk-b" />
        <path fill="none" d="M 199 290 L 200 170 L 201 290" class="error-line" />
        
        <!-- Torque callout in clear zone between y=186 and y=236 -->
        <rect x="225" y="188" width="165" height="46" class="callout-box" rx="3" />
        <text x="235" y="202" class="alert-text">τ = 324 N·m impulse</text>
        <text x="235" y="215" class="callout-text">Exceeds yield limit (285 N·m)!</text>
        <text x="235" y="227" class="callout-text" font-weight="600" fill="#dc2626">Result: Drive pin fracture</text>
    </g>

    <!-- RIGHT PANEL: Case B: C2 Jerk-Continuous Spline Synthesis -->
    <g transform="translate(515, 80)">
        <text x="200" y="0" class="subtitle" text-anchor="middle">Case B: C² Jerk-Continuous Spline Synthesis</text>
        
        <!-- Axes for Velocity -->
        <text x="-32" y="70" class="label-bold" text-anchor="middle" transform="rotate(-90, -32, 70)">Velocity (rad/s)</text>
        <line x1="0" y1="120" x2="400" y2="120" class="axis-line" marker-end="url(#arrowhead)" />
        <line x1="0" y1="120" x2="0" y2="20" class="axis-line" marker-end="url(#arrowhead)" />
        
        <text x="200" y="155" class="label" text-anchor="middle">Time (ms)</text>
        <line x1="150" y1="20" x2="150" y2="120" class="grid-line" />
        <line x1="250" y1="20" x2="250" y2="120" class="grid-line" />
        
        <!-- Velocity Plot -->
        <path fill="none" d="M 0 100 Q 75 92 150 85" class="chunk-a" />
        <!-- 5th order spline bridge from (150, 85) to (250, 45) -->
        <path fill="none" d="M 150 85 C 190 80, 210 50, 250 45" class="bridge-line" />
        <path fill="none" d="M 250 45 Q 325 55 400 65" class="chunk-b" />
        
        <circle cx="150" cy="85" r="4" fill="#1e3a8a" />
        <circle cx="250" cy="45" r="4" fill="#1e3a8a" />
        
        <!-- Bridge callout positioned in upper left quadrant of plot (clear of curve) -->
        <rect x="25" y="24" width="165" height="38" class="callout-box" rx="3" />
        <line x1="190" y1="43" x2="198" y2="60" stroke="#16a34a" stroke-width="1.5" />
        <text x="107" y="40" class="success-text" text-anchor="middle">T_blend = 20 ms Bridge</text>
        <text x="107" y="53" class="callout-text" text-anchor="middle">5th-order polynomial (C²)</text>
        
        <!-- Axes for Torque -->
        <text x="-32" y="240" class="label-bold" text-anchor="middle" transform="rotate(-90, -32, 240)">Torque (N·m)</text>
        <line x1="0" y1="320" x2="400" y2="320" class="axis-line" marker-end="url(#arrowhead)" />
        <line x1="0" y1="320" x2="0" y2="160" class="axis-line" marker-end="url(#arrowhead)" />
        
        <text x="200" y="355" class="label" text-anchor="middle">Time (ms)</text>
        <line x1="150" y1="160" x2="150" y2="320" class="grid-line" />
        <line x1="250" y1="160" x2="250" y2="320" class="grid-line" />
        
        <!-- Limits -->
        <line x1="0" y1="280" x2="400" y2="280" class="grid-line" />
        <text x="408" y="284" class="label">Continuous (45 N·m)</text>
        
        <line x1="0" y1="240" x2="400" y2="240" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,4" />
        <text x="408" y="244" class="label" fill="#dc2626" font-weight="600">Transient Peak (110 N·m)</text>
        
        <line x1="0" y1="180" x2="400" y2="180" stroke="#dc2626" stroke-width="2" />
        <text x="408" y="184" class="alert-text">Shear Yield (285 N·m)</text>
        
        <!-- Torque Plot -->
        <path fill="none" d="M 0 300 Q 75 296 150 292" class="chunk-a" />
        <path fill="none" d="M 150 292 C 180 310, 220 270, 250 298" class="bridge-line" />
        <path fill="none" d="M 250 298 Q 325 301 400 304" class="chunk-b" />
        
        <!-- Torque callout in clear zone between y=186 and y=236 -->
        <rect x="125" y="192" width="150" height="38" class="callout-box" rx="3" />
        <line x1="200" y1="230" x2="200" y2="270" stroke="#16a34a" stroke-width="1" stroke-dasharray="2,2" />
        <text x="200" y="208" class="success-text" text-anchor="middle">τ ≤ 38 N·m</text>
        <text x="200" y="222" class="callout-text" text-anchor="middle">Within continuous limit</text>
    </g>
    
    <!-- Legend -->
    <g transform="translate(385, 485)">
        <rect x="0" y="0" width="350" height="85" class="callout-box" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <text x="175" y="20" class="label-bold" text-anchor="middle">Legend</text>
        
        <line x1="25" y1="42" x2="65" y2="42" class="chunk-a" />
        <text x="75" y="46" class="label">Active Chunk A</text>
        
        <line x1="25" y1="67" x2="65" y2="67" class="chunk-b" />
        <text x="75" y="71" class="label">Incoming Chunk B</text>
        
        <line x1="190" y1="42" x2="230" y2="42" class="bridge-line" />
        <text x="240" y="46" class="label">C² Spline Bridge</text>
        
        <line x1="190" y1="67" x2="230" y2="67" class="error-line" />
        <text x="240" y="71" class="label">Discontinuity Step</text>
    </g>
    </g>

</svg>
