<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E293B"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="720" fill="#FFFFFF"/>

  <!-- Main Title & Provenance -->
  <text x="24" y="28" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="-0.2">Action Chunk Seam Dynamics: Unchecked C⁰ Step vs. C² Quintic Spline Synthesis</text>
  <text x="1096" y="28" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">Synthesized from Flash &amp; Hogan (1985), Craig (2005), and ISO 10218 Drivetrain Dynamics</text>

  <!-- ==================================================================== -->
  <!-- PANEL A: UNCHECKED C0 CONCATENATION (LEFT)                           -->
  <!-- ==================================================================== -->
  <g id="panel-a" transform="translate(24, 44)">
    <rect x="0" y="0" width="526" height="520" rx="8" fill="url(#panel-grad)" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header Strip -->
    <rect x="0" y="0" width="526" height="34" rx="8" fill="#FEF2F2"/>
    <path d="M 0 26 L 0 34 L 526 34 L 526 26 Z" fill="#FEF2F2"/>
    <line x1="0" y1="34" x2="526" y2="34" stroke="#FECACA" stroke-width="1"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#991B1B" letter-spacing="0.5">PANEL A: UNCHECKED C⁰ CONCATENATION (POSITION-ONLY)</text>
    <rect x="426" y="7" width="86" height="20" rx="10" fill="#FEE2E2"/>
    <text x="469" y="21" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">IMPULSE TRIP</text>

    <!-- Subplot 1: Velocity Jump -->
    <g transform="translate(48, 54)">
      <text x="-32" y="44" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90, -32, 44)">Velocity (rad/s)</text>
      <line x1="0" y1="80" x2="446" y2="80" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-navy)"/>
      <line x1="0" y1="80" x2="0" y2="10" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-navy)"/>

      <!-- Grid lines -->
      <line x1="220" y1="10" x2="220" y2="80" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="220" y="94" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">t_seam = 50 ms</text>
      <text x="446" y="94" font-size="9" fill="#64748B" text-anchor="end">Time (ms)</text>

      <!-- Velocity traces -->
      <path d="M 0 65 Q 110 58 219 50" fill="none" stroke="#1E40AF" stroke-width="2.5"/>
      <circle cx="219" cy="50" r="4" fill="#1E40AF"/>

      <!-- Velocity Step Discontinuity -->
      <line x1="220" y1="50" x2="220" y2="20" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="2,2"/>
      <circle cx="220" cy="20" r="4" fill="#DC2626"/>

      <!-- Chunk B -->
      <path d="M 221 20 Q 320 28 420 38" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5,3"/>

      <!-- Velocity callout chip (top right) -->
      <rect x="236" y="8" width="180" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="244" y="22" font-size="9.5" font-weight="700" fill="#DC2626">Δv = +0.60 rad/s step</text>
      <text x="244" y="34" font-size="8.5" fill="#64748B">Across single 1.0 ms servo period</text>
    </g>

    <!-- Subplot 2: Impulsive Torque Shock -->
    <g transform="translate(48, 180)">
      <text x="-32" y="55" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90, -32, 55)">Torque (N·m)</text>
      <line x1="0" y1="105" x2="446" y2="105" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-navy)"/>
      <line x1="0" y1="105" x2="0" y2="0" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-navy)"/>

      <!-- Limit Lines -->
      <!-- Continuous rating 45 N*m (y=80) -->
      <line x1="0" y1="80" x2="446" y2="80" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="442" y="76" font-size="8.5" fill="#64748B" text-anchor="end">Continuous Rating (45 N·m)</text>

      <!-- Transient peak limit 110 N*m (y=55) -->
      <line x1="0" y1="55" x2="446" y2="55" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="442" y="51" font-size="8.5" font-weight="600" fill="#D97706" text-anchor="end">Transient Peak Ceiling (110 N·m)</text>

      <!-- Shear yield limit 285 N*m (y=20) -->
      <line x1="0" y1="20" x2="446" y2="20" stroke="#DC2626" stroke-width="1.5"/>
      <text x="442" y="16" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="end">Shear Yield Limit (285 N·m)</text>

      <!-- Torque curve: baseline ~ 25 N*m (y=92) -->
      <path d="M 0 92 L 219 92" fill="none" stroke="#1E40AF" stroke-width="2"/>
      <path d="M 221 92 L 420 94" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5,3"/>

      <!-- Violent Impulse Spike: rises to 324 N*m (y=5) -->
      <path d="M 218 92 L 220 5 L 222 92" fill="none" stroke="#DC2626" stroke-width="3"/>

      <!-- Torque callout chip (placed on the LEFT side x=18 to avoid colliding with right threshold text) -->
      <rect x="18" y="6" width="186" height="44" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
      <text x="26" y="20" font-size="9.5" font-weight="700" fill="#991B1B">τ_seam = 324 N·m Impulse</text>
      <text x="26" y="33" font-size="8.5" font-weight="600" fill="#DC2626">Exceeds Shear Ceiling (285 N·m)</text>
      <text x="26" y="44" font-size="8" fill="#B91C1C">Demand = 720% of continuous rating</text>
    </g>

    <!-- Structural Consequence Matrix (Bottom of Panel A) -->
    <g transform="translate(14, 322)">
      <rect x="0" y="0" width="498" height="182" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/>

      <!-- Row 1: Mechanical Destruction -->
      <g transform="translate(12, 12)">
        <rect x="0" y="0" width="474" height="74" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="#991B1B">MECHANICAL IMPACT: GEARBOX &amp; TRANSMISSION</text>
        <text x="10" y="34" font-size="9" font-weight="600" fill="#B91C1C">• Flexspline Tooth Fracture:</text>
        <text x="156" y="34" font-size="9" fill="#475569">Instantaneous shear stress exceeds titanium-alloy yield</text>
        <text x="10" y="48" font-size="9" font-weight="600" fill="#B91C1C">• Bearing Brinelling:</text>
        <text x="156" y="48" font-size="9" fill="#475569">Permanent microscopic indentation of outer race cups</text>
        <text x="10" y="62" font-size="9" font-weight="600" fill="#B91C1C">• Angular Deflection:</text>
        <text x="156" y="62" font-size="9" fill="#475569">θ_deflect = τ / k_θ = 324 / 20000 = 0.0162 rad (0.93° shock)</text>
      </g>

      <!-- Row 2: Electrical Shutdown -->
      <g transform="translate(12, 94)">
        <rect x="0" y="0" width="474" height="74" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="#334155">ELECTRICAL IMPACT: POWER STAGE &amp; INVERTER</text>
        <text x="10" y="34" font-size="9" font-weight="600" fill="#B91C1C">• Current Saturation:</text>
        <text x="156" y="34" font-size="9" fill="#475569">Requested phase current spikes to I_cmd &gt; 85 A</text>
        <text x="10" y="48" font-size="9" font-weight="600" fill="#B91C1C">• Inverter Desaturation:</text>
        <text x="156" y="48" font-size="9" fill="#475569">V_CE(sat) &gt; 7 V trips hardware protection within 2.0 µs</text>
        <text x="10" y="62" font-size="9" font-weight="600" fill="#B91C1C">• Catastrophic Result:</text>
        <text x="156" y="62" font-size="9" font-weight="700" fill="#DC2626">Gate driver clamps High-Z; robot collapses under gravity</text>
      </g>
    </g>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL B: C2 QUINTIC SPLINE SYNTHESIS (RIGHT)                         -->
  <!-- ==================================================================== -->
  <g id="panel-b" transform="translate(570, 44)">
    <rect x="0" y="0" width="526" height="520" rx="8" fill="url(#panel-grad)" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header Strip -->
    <rect x="0" y="0" width="526" height="34" rx="8" fill="#F0FDF4"/>
    <path d="M 0 26 L 0 34 L 526 34 L 526 26 Z" fill="#F0FDF4"/>
    <line x1="0" y1="34" x2="526" y2="34" stroke="#BBF7D0" stroke-width="1"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#065F46" letter-spacing="0.5">PANEL B: C² JERK-CONTINUOUS QUINTIC SPLINE SYNTHESIS</text>
    <rect x="420" y="7" width="92" height="20" rx="10" fill="#DCFCE7"/>
    <text x="466" y="21" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">CERTIFIED C²</text>

    <!-- Subplot 1: Quintic Velocity Bridge -->
    <g transform="translate(48, 54)">
      <text x="-32" y="44" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90, -32, 44)">Velocity (rad/s)</text>
      <line x1="0" y1="80" x2="446" y2="80" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-navy)"/>
      <line x1="0" y1="80" x2="0" y2="10" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-navy)"/>

      <!-- Blending Zone Shading -->
      <rect x="170" y="10" width="100" height="70" fill="#F0FDF4" stroke="none"/>
      <line x1="170" y1="10" x2="170" y2="80" stroke="#86EFAC" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="270" y1="10" x2="270" y2="80" stroke="#86EFAC" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="220" y="94" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">T_blend = 20 ms</text>
      <text x="446" y="94" font-size="9" fill="#64748B" text-anchor="end">Time (ms)</text>

      <!-- Velocity traces -->
      <path d="M 0 65 Q 85 60 170 56" fill="none" stroke="#1E40AF" stroke-width="2.5"/>
      <circle cx="170" cy="56" r="3.5" fill="#1E40AF"/>

      <!-- Quintic polynomial C^2 bridge: smooth S-curve from (170, 56) to (270, 26) -->
      <path d="M 170 56 C 205 56, 235 26, 270 26" fill="none" stroke="#059669" stroke-width="3"/>
      <circle cx="270" cy="26" r="3.5" fill="#059669"/>

      <!-- Chunk B continuing from x=270 -->
      <path d="M 270 26 Q 345 32 420 38" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5,3"/>

      <!-- Callout chip -->
      <rect x="18" y="12" width="144" height="34" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
      <text x="90" y="25" font-size="9.5" font-weight="700" fill="#065F46" text-anchor="middle">5th-Order Spline</text>
      <text x="90" y="37" font-size="8.5" fill="#047857" text-anchor="middle">Zero acceleration jump (C²)</text>
    </g>

    <!-- Subplot 2: Attenuated Dynamic Torque -->
    <g transform="translate(48, 180)">
      <text x="-32" y="55" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90, -32, 55)">Torque (N·m)</text>
      <line x1="0" y1="105" x2="446" y2="105" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-navy)"/>
      <line x1="0" y1="105" x2="0" y2="0" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-navy)"/>

      <!-- Limit Lines -->
      <line x1="0" y1="80" x2="446" y2="80" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="442" y="76" font-size="8.5" fill="#64748B" text-anchor="end">Continuous Rating (45 N·m)</text>

      <line x1="0" y1="55" x2="446" y2="55" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="442" y="51" font-size="8.5" font-weight="600" fill="#D97706" text-anchor="end">Transient Peak Ceiling (110 N·m)</text>

      <line x1="0" y1="20" x2="446" y2="20" stroke="#DC2626" stroke-width="1.5"/>
      <text x="442" y="16" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="end">Shear Yield Limit (285 N·m)</text>

      <!-- Shaded Blending Window -->
      <rect x="170" y="0" width="100" height="105" fill="#F0FDF4" opacity="0.6"/>

      <!-- Baseline torque and gentle dynamic hump -->
      <path d="M 0 92 L 170 92" fill="none" stroke="#1E40AF" stroke-width="2"/>
      <!-- Smooth hump: peaks at y=84 (approx 38 N*m) -->
      <path d="M 170 92 C 195 92, 205 84, 220 84 C 235 84, 245 92, 270 92" fill="none" stroke="#059669" stroke-width="3"/>
      <path d="M 270 92 L 420 94" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5,3"/>

      <!-- Safe callout chip (placed at left x=18) -->
      <rect x="18" y="16" width="144" height="42" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2"/>
      <text x="90" y="30" font-size="9.5" font-weight="700" fill="#065F46" text-anchor="middle">τ_blend ≤ 38 N·m</text>
      <text x="90" y="42" font-size="8.5" font-weight="600" fill="#047857" text-anchor="middle">Within Continuous Limit</text>
      <text x="90" y="52" font-size="8" fill="#15803D" text-anchor="middle">8.5× Dynamic Attenuation</text>
    </g>

    <!-- Certified Safety & Dynamics Matrix (Bottom of Panel B) -->
    <g transform="translate(14, 322)">
      <rect x="0" y="0" width="498" height="182" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2"/>

      <!-- Row 1: Mechanical Integrity -->
      <g transform="translate(12, 12)">
        <rect x="0" y="0" width="474" height="74" rx="4" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="#065F46">MECHANICAL INTEGRITY: SMOOTH DRIVELINE ENGAGEMENT</text>
        <text x="10" y="34" font-size="9" font-weight="600" fill="#047857">• Continuous Jerk Bound:</text>
        <text x="156" y="34" font-size="9" fill="#475569">Peak jerk |d³q/dt³| ≤ 4500 rad/s³ prevents driveline resonance</text>
        <text x="10" y="48" font-size="9" font-weight="600" fill="#047857">• Anti-Resonance Margin:</text>
        <text x="156" y="48" font-size="9" fill="#475569">Spectral energy stays far below 18 Hz driveline mode</text>
        <text x="10" y="62" font-size="9" font-weight="600" fill="#047857">• Zero Contact Chatter:</text>
        <text x="156" y="62" font-size="9" fill="#475569">Backlash deadband never crossed; bearing preloads preserved</text>
      </g>

      <!-- Row 2: Electrical Stability -->
      <g transform="translate(12, 94)">
        <rect x="0" y="0" width="474" height="74" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="#334155">ELECTRICAL COMPLIANCE: POWER INVERTER STABILITY</text>
        <text x="10" y="34" font-size="9" font-weight="600" fill="#047857">• Linear PWM Duty Cycle:</text>
        <text x="156" y="34" font-size="9" fill="#475569">Current loop operates at &lt; 78% duty cycle with full headroom</text>
        <text x="10" y="48" font-size="9" font-weight="600" fill="#047857">• Bus Voltage Pumping:</text>
        <text x="156" y="48" font-size="9" fill="#475569">ΔV_bus &lt; 1.2 V; internal DC chopper resistors remain cool</text>
        <text x="10" y="62" font-size="9" font-weight="600" fill="#047857">• Operational Authority:</text>
        <text x="156" y="62" font-size="9" font-weight="700" fill="#059669">Continuous trajectory tracking without micro-stalls or resets</text>
      </g>
    </g>
  </g>

  <!-- ==================================================================== -->
  <!-- BOTTOM STRIP: PHYSICAL DRIVETRAIN PARAMETER FORMULATION             -->
  <!-- ==================================================================== -->
  <g id="bottom-strip" transform="translate(24, 576)">
    <rect x="0" y="0" width="1072" height="124" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Left Box: Drivetrain Mechanical Cutaway Specification -->
    <g transform="translate(16, 14)">
      <rect x="0" y="0" width="510" height="96" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-size="10.5" font-weight="700" fill="#0F172A">Reflected Drivetrain Inertia Formulation</text>
      <text x="12" y="33" font-size="9.5" font-weight="600" fill="#1D4ED8">J_eff = J_L + N_g² · J_m = 1.2 kg·m² + (100)² · (1.5 × 10⁻⁴ kg·m²) = 2.70 kg·m²</text>
      <text x="12" y="52" font-size="9" fill="#475569">Motor rotor inertia (J_m) is amplified by N_g² = 10,000× through the harmonic speed reducer.</text>
      <text x="12" y="67" font-size="9" fill="#475569">Across a single T_c = 1.0 ms tick, an unchecked Δv = 0.60 rad/s step demands:</text>
      <text x="12" y="82" font-size="9" font-weight="700" fill="#991B1B">τ_seam = J_eff · (Δv / T_c) = (2.70 kg·m²) · (600 rad/s²) = 324 N·m (Violates 285 N·m yield)</text>
    </g>

    <!-- Right Box: Quintic Polynomial Algebraic Boundary Conditions -->
    <g transform="translate(542, 14)">
      <rect x="0" y="0" width="514" height="96" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-size="10.5" font-weight="700" fill="#065F46">C² Quintic Polynomial Boundary Value Solution</text>
      <text x="12" y="33" font-size="9.5" font-weight="600" fill="#047857">s(t) = a₀ + a₁·t + a₂·t² + a₃·t³ + a₄·t⁴ + a₅·t⁵,  t ∈ [0, T_blend]</text>
      <text x="12" y="52" font-size="9" fill="#475569">Boundary Conditions: s(0)=q_A, s'(0)=q'_A, s''(0)=q''_A | s(T)=q_B, s'(T)=q'_B, s''(T)=q''_B</text>
      <text x="12" y="67" font-size="9" fill="#475569">Closed-form peak acceleration: q''_peak ≈ 1.5 · (Δv / T_blend) = 1.5 · (0.60 / 0.020) = 45 rad/s²</text>
      <text x="12" y="82" font-size="9" font-weight="700" fill="#059669">τ_blend = J_eff · q''_peak = (2.70 kg·m²) · (45 rad/s²) = 38 N·m ≤ 45 N·m Continuous Limit</text>
    </g>
  </g>
</svg>
