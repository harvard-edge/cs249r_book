<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#FFFFFF"/>

  <!-- Sub-Figure Headers -->
  <text x="240" y="32" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(a) Unchecked C⁰ Step (Position-Only)</text>
  <text x="720" y="32" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">(b) C² Quintic Spline Synthesis</text>

  <!-- Divider between panels -->
  <line x1="480" y1="20" x2="480" y2="380" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): UNCHECKED C0 STEP JUMP                                    -->
  <!-- ==================================================================== -->
  <g id="panel-a" transform="translate(30, 0)">
    <!-- Subplot a1: Velocity Discontinuity -->
    <!-- Axes -->
    <line x1="45" y1="180" x2="420" y2="180" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <line x1="45" y1="185" x2="45" y2="55" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <text x="45" y="47" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Velocity q̇(t)</text>
    <text x="425" y="184" font-size="9.5" font-weight="600" fill="#64748B">Time t</text>

    <!-- Seam vertical gridline -->
    <line x1="230" y1="55" x2="230" y2="180" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="230" y="195" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">t_seam</text>

    <!-- Chunk A curve -->
    <path d="M 45 155 Q 140 145 230 135" fill="none" stroke="#2563EB" stroke-width="2"/>
    <circle cx="230" cy="135" r="3.5" fill="#2563EB"/>
    <text x="130" y="138" font-size="9.5" font-weight="600" fill="#2563EB">Chunk A</text>

    <!-- Step jump at seam -->
    <line x1="230" y1="135" x2="230" y2="80" stroke="#DC2626" stroke-width="2" stroke-dasharray="2,2"/>
    <circle cx="230" cy="80" r="3.5" fill="#DC2626"/>

    <!-- Chunk B curve -->
    <path d="M 230 80 Q 320 90 400 105" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="320" y="85" font-size="9.5" font-weight="600" fill="#2563EB">Chunk B</text>

    <!-- Jump Callout -->
    <rect x="245" y="65" width="135" height="24" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="312" y="81" font-size="9" font-weight="700" fill="#991B1B" text-anchor="middle">Δq̇ Step (Discontinuity)</text>

    <!-- Subplot a2: Commanded Torque Impulse -->
    <!-- Axes -->
    <line x1="45" y1="350" x2="420" y2="350" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <line x1="45" y1="355" x2="45" y2="225" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <text x="45" y="217" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Torque τ(t)</text>
    <text x="425" y="354" font-size="9.5" font-weight="600" fill="#64748B">Time t</text>

    <!-- Limit Lines -->
    <!-- Shear limit tau_shear -->
    <line x1="45" y1="260" x2="405" y2="260" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="405" y="255" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="end">Shear Limit τ_shear</text>

    <!-- Continuous rating tau_cont -->
    <line x1="45" y1="315" x2="405" y2="315" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="405" y="310" font-size="8.5" font-weight="600" fill="#D97706" text-anchor="end">Continuous Rating τ_cont</text>

    <!-- Seam alignment line -->
    <line x1="230" y1="225" x2="230" y2="350" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Nominal torque trace -->
    <line x1="45" y1="335" x2="228" y2="335" stroke="#2563EB" stroke-width="1.8"/>
    <line x1="232" y1="335" x2="400" y2="335" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="4,3"/>

    <!-- Sharp Impulse Spike at Seam -->
    <path d="M 227 335 L 230 230 L 233 335" fill="none" stroke="#DC2626" stroke-width="2.5"/>

    <!-- Impulse Annotation -->
    <rect x="70" y="235" width="145" height="24" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="142" y="251" font-size="9" font-family="monospace" font-weight="700" fill="#991B1B" text-anchor="middle">τ_seam = J_eff · (Δq̇ / T_c)</text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): C2 QUINTIC SPLINE SYNTHESIS                               -->
  <!-- ==================================================================== -->
  <g id="panel-b" transform="translate(510, 0)">
    <!-- Subplot b1: Smooth Velocity Bridge -->
    <!-- Axes -->
    <line x1="45" y1="180" x2="420" y2="180" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <line x1="45" y1="185" x2="45" y2="55" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <text x="45" y="47" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Velocity q̇(t)</text>
    <text x="425" y="184" font-size="9.5" font-weight="600" fill="#64748B">Time t</text>

    <!-- Blend Interval Shading -->
    <rect x="190" y="55" width="80" height="125" fill="#F0FDF4" fill-opacity="0.7"/>
    <line x1="190" y1="55" x2="190" y2="180" stroke="#86EFAC" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="270" y1="55" x2="270" y2="180" stroke="#86EFAC" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="230" y="195" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">T_blend</text>

    <!-- Chunk A curve -->
    <path d="M 45 155 Q 120 148 190 140" fill="none" stroke="#2563EB" stroke-width="2"/>
    <circle cx="190" cy="140" r="3.5" fill="#2563EB"/>

    <!-- Smooth Quintic S-Curve Bridge -->
    <path d="M 190 140 C 220 135 240 85 270 80" fill="none" stroke="#059669" stroke-width="2.5"/>
    <circle cx="270" cy="80" r="3.5" fill="#059669"/>

    <!-- Chunk B curve -->
    <path d="M 270 80 Q 340 88 400 95" fill="none" stroke="#2563EB" stroke-width="2"/>

    <!-- Bridge Callout -->
    <rect x="280" y="65" width="125" height="24" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="342" y="81" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">C² Quintic Bridge</text>

    <!-- Subplot b2: Continuous Bounded Torque -->
    <!-- Axes -->
    <line x1="45" y1="350" x2="420" y2="350" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <line x1="45" y1="355" x2="45" y2="225" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-dark)"/>
    <text x="45" y="217" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Torque τ(t)</text>
    <text x="425" y="354" font-size="9.5" font-weight="600" fill="#64748B">Time t</text>

    <!-- Limit Lines -->
    <line x1="45" y1="260" x2="405" y2="260" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="405" y="255" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="end">Shear Limit τ_shear</text>

    <line x1="45" y1="315" x2="405" y2="315" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="405" y="310" font-size="8.5" font-weight="600" fill="#D97706" text-anchor="end">Continuous Rating τ_cont</text>

    <!-- Blend Interval Shading -->
    <rect x="190" y="225" width="80" height="125" fill="#F0FDF4" fill-opacity="0.7"/>
    <line x1="190" y1="225" x2="190" y2="350" stroke="#86EFAC" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="270" y1="225" x2="270" y2="350" stroke="#86EFAC" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Nominal torque trace -->
    <line x1="45" y1="335" x2="190" y2="335" stroke="#2563EB" stroke-width="1.8"/>

    <!-- Smooth continuous torque bell curve during blend -->
    <path d="M 190 335 C 210 335 215 320 230 320 C 245 320 250 335 270 335" fill="none" stroke="#059669" stroke-width="2.5"/>

    <line x1="270" y1="335" x2="400" y2="335" stroke="#2563EB" stroke-width="1.8"/>

    <!-- Bounded Annotation -->
    <rect x="80" y="295" width="105" height="24" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="132" y="311" font-size="9" font-family="monospace" font-weight="700" fill="#166534" text-anchor="middle">τ_blend ≤ τ_cont</text>
  </g>
</svg>
