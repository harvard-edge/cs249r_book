<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="#FFFFFF"/>

  <!-- ========================================================================= -->
  <!-- STAGE 1: DUAL-CHANNEL E-STOP INGRESS                                      -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="250" height="310" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="125" y="28" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">1. Dual-Channel E-Stop</text>

    <!-- Mushroom Pushbutton -->
    <path d="M 75 62 C 75 48, 175 48, 175 62 C 175 70, 160 74, 150 76 L 100 76 C 90 74, 75 70, 75 62 Z" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
    <rect x="115" y="76" width="20" height="14" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>

    <!-- Mechanical Linkage -->
    <line x1="125" y1="90" x2="125" y2="270" stroke="#64748B" stroke-width="1.8" stroke-dasharray="3,2"/>

    <!-- Contact S1 -->
    <rect x="25" y="120" width="200" height="55" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="38" y="152" font-size="11" font-weight="600" fill="#1E293B">Contact S1</text>
    <circle cx="145" cy="148" r="3" fill="#1E3A8A"/>
    <circle cx="205" cy="148" r="3" fill="#1E3A8A"/>
    <line x1="148" y1="148" x2="202" y2="148" stroke="#059669" stroke-width="2"/>
    <line x1="175" y1="141" x2="175" y2="155" stroke="#DC2626" stroke-width="1.5"/>

    <!-- Contact S2 -->
    <rect x="25" y="205" width="200" height="55" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="38" y="237" font-size="11" font-weight="600" fill="#1E293B">Contact S2</text>
    <circle cx="145" cy="233" r="3" fill="#1E3A8A"/>
    <circle cx="205" cy="233" r="3" fill="#1E3A8A"/>
    <line x1="148" y1="233" x2="202" y2="233" stroke="#059669" stroke-width="2"/>
    <line x1="175" y1="226" x2="175" y2="240" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="285" y1="175" x2="325" y2="175" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>

  <!-- ========================================================================= -->
  <!-- STAGE 2: REDUNDANT SAFETY RELAYS                                          -->
  <!-- ========================================================================= -->
  <g transform="translate(330, 20)">
    <rect x="0" y="0" width="280" height="310" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
    <text x="140" y="28" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">2. Redundant Safety Relays</text>

    <!-- Relay K1 Capsule -->
    <rect x="20" y="50" width="240" height="110" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
    <text x="32" y="72" font-size="11" font-weight="700" fill="#1E3A8A">Relay K1</text>
    <!-- Coil -->
    <rect x="35" y="88" width="36" height="20" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1"/>
    <line x1="53" y1="88" x2="53" y2="108" stroke="#1E3A8A" stroke-width="1"/>
    <!-- Linkage -->
    <line x1="90" y1="75" x2="90" y2="145" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2,2"/>
    <!-- NO contact -->
    <circle cx="140" cy="98" r="3" fill="#059669"/>
    <circle cx="210" cy="98" r="3" fill="#059669"/>
    <line x1="143" y1="98" x2="207" y2="98" stroke="#059669" stroke-width="2"/>
    <!-- EDM NC contact -->
    <circle cx="140" cy="135" r="2.5" fill="#DC2626"/>
    <circle cx="210" cy="135" r="2.5" fill="#DC2626"/>
    <line x1="143" y1="138" x2="207" y2="130" stroke="#DC2626" stroke-width="1.5"/>

    <!-- Relay K2 Capsule -->
    <rect x="20" y="180" width="240" height="110" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
    <text x="32" y="202" font-size="11" font-weight="700" fill="#065F46">Relay K2</text>
    <!-- Coil -->
    <rect x="35" y="218" width="36" height="20" fill="#DCFCE7" stroke="#059669" stroke-width="1"/>
    <line x1="53" y1="218" x2="53" y2="238" stroke="#059669" stroke-width="1"/>
    <!-- Linkage -->
    <line x1="90" y1="205" x2="90" y2="275" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2,2"/>
    <!-- NO contact -->
    <circle cx="140" cy="228" r="3" fill="#059669"/>
    <circle cx="210" cy="228" r="3" fill="#059669"/>
    <line x1="143" y1="228" x2="207" y2="228" stroke="#059669" stroke-width="2"/>
    <!-- EDM NC contact -->
    <circle cx="140" cy="265" r="2.5" fill="#DC2626"/>
    <circle cx="210" cy="265" r="2.5" fill="#DC2626"/>
    <line x1="143" y1="268" x2="207" y2="260" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="615" y1="175" x2="655" y2="175" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>

  <!-- ========================================================================= -->
  <!-- STAGE 3: POWER CUTOFF & STO                                               -->
  <!-- ========================================================================= -->
  <g transform="translate(660, 20)">
    <rect x="0" y="0" width="270" height="310" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="135" y="28" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">3. Power Cutoff &amp; STO</text>

    <!-- Gate Bias Cutoff Card -->
    <rect x="15" y="45" width="240" height="52" rx="4" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="25" y="75" font-size="10.5" font-weight="700" fill="#DC2626">Gate Bias (0 V)</text>
    <circle cx="170" cy="71" r="3" fill="#DC2626"/>
    <circle cx="220" cy="71" r="3" fill="#DC2626"/>
    <line x1="173" y1="74" x2="215" y2="65" stroke="#DC2626" stroke-width="1.8"/>

    <!-- Inverter Bridge Card -->
    <rect x="15" y="108" width="240" height="125" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="25" y="126" font-size="10" font-weight="700" fill="#1E293B">Inverter (High-Z)</text>

    <!-- 3-phase Bridge schematic -->
    <line x1="30" y1="140" x2="170" y2="140" stroke="#DC2626" stroke-width="1.5"/>
    <line x1="30" y1="215" x2="170" y2="215" stroke="#334155" stroke-width="1.5"/>

    <!-- Phase U -->
    <rect x="45" y="148" width="18" height="24" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <rect x="45" y="182" width="18" height="24" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <line x1="54" y1="140" x2="54" y2="148" stroke="#64748B" stroke-width="1"/>
    <line x1="54" y1="172" x2="54" y2="182" stroke="#64748B" stroke-width="1"/>
    <line x1="54" y1="206" x2="54" y2="215" stroke="#64748B" stroke-width="1"/>
    <line x1="54" y1="177" x2="185" y2="177" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- Phase V -->
    <rect x="85" y="148" width="18" height="24" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <rect x="85" y="182" width="18" height="24" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <line x1="94" y1="140" x2="94" y2="148" stroke="#64748B" stroke-width="1"/>
    <line x1="94" y1="172" x2="94" y2="182" stroke="#64748B" stroke-width="1"/>
    <line x1="94" y1="206" x2="94" y2="215" stroke="#64748B" stroke-width="1"/>
    <line x1="94" y1="185" x2="185" y2="185" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- Phase W -->
    <rect x="125" y="148" width="18" height="24" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <rect x="125" y="182" width="18" height="24" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
    <line x1="134" y1="140" x2="134" y2="148" stroke="#64748B" stroke-width="1"/>
    <line x1="134" y1="172" x2="134" y2="182" stroke="#64748B" stroke-width="1"/>
    <line x1="134" y1="206" x2="134" y2="215" stroke="#64748B" stroke-width="1"/>
    <line x1="134" y1="193" x2="185" y2="193" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- Motor Circle -->
    <circle cx="215" cy="185" r="20" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.8"/>
    <text x="215" y="190" font-size="11" font-weight="700" fill="#1E3A8A" text-anchor="middle">M</text>
    <text x="215" y="222" font-size="9.5" font-weight="600" fill="#DC2626" text-anchor="middle">τ = 0</text>

    <!-- Spring Brake Card -->
    <rect x="15" y="245" width="240" height="52" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="135" y="276" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">Spring Brake</text>
  </g>
</svg>