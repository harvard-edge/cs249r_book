<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" width="100%" height="100%">
  <defs>
    <!-- Card Drop Shadows -->
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Background -->
  <rect width="1140" height="640" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Canvas Header & Attribution -->
  <text x="28" y="32" class="font-sans" font-size="16" font-weight="700" fill="#0f172a">Deterministic Fallback Escalation Ladder &amp; Safety Substrates</text>
  <text x="1112" y="32" text-anchor="end" class="font-sans" font-size="12" font-weight="500" fill="#64748b">Synthesized from IEC 60204-1, ISO 13849-1, IEC 61800-5-2, and Sha et al. (2001)</text>
  <line x1="28" y1="46" x2="1112" y2="46" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ================================================================================= -->
  <!-- LEFT FLANK: LATENCY & TRUST SPINE -->
  <!-- ================================================================================= -->
  <g transform="translate(30, 70)">
    <rect width="90" height="540" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
    <line x1="45" y1="50" x2="45" y2="490" stroke="#3b82f6" stroke-width="2.5"/>
    <polygon points="39,488 45,502 51,488" fill="#3b82f6"/>
    
    <text x="45" y="30" text-anchor="middle" class="font-sans" font-size="9.5" font-weight="700" fill="#1e40af">REACTION</text>
    <text x="45" y="42" text-anchor="middle" class="font-sans" font-size="9" font-weight="700" fill="#1e40af">LATENCY</text>

    <text x="32" y="270" text-anchor="middle" transform="rotate(-90 32 270)" class="font-sans" font-size="9.5" font-weight="600" fill="#475569">
      Decreasing Decision Delay (175 μs → &lt; 5 μs)
    </text>
    <text x="58" y="270" text-anchor="middle" transform="rotate(-90 58 270)" class="font-sans" font-size="9" font-weight="700" fill="#dc2626">
      Progressive Loss of Trust
    </text>

    <text x="45" y="518" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#dc2626">&lt; 5 μs</text>
    <text x="45" y="530" text-anchor="middle" class="font-sans" font-size="8" fill="#64748b">Hardware</text>
  </g>

  <!-- ================================================================================= -->
  <!-- RIGHT FLANK: COST & DEGRADATION SPINE -->
  <!-- ================================================================================= -->
  <g transform="translate(1020, 70)">
    <rect width="90" height="540" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
    <line x1="45" y1="50" x2="45" y2="490" stroke="#ef4444" stroke-width="2.5"/>
    <polygon points="39,488 45,502 51,488" fill="#ef4444"/>

    <text x="45" y="30" text-anchor="middle" class="font-sans" font-size="9.5" font-weight="700" fill="#991b1b">PHYSICAL</text>
    <text x="45" y="42" text-anchor="middle" class="font-sans" font-size="9" font-weight="700" fill="#991b1b">PENALTY</text>

    <text x="32" y="270" text-anchor="middle" transform="rotate(90 32 270)" class="font-sans" font-size="9.5" font-weight="600" fill="#475569">
      Escalating Mechanical Stress &amp; Wear
    </text>
    <text x="58" y="270" text-anchor="middle" transform="rotate(90 58 270)" class="font-sans" font-size="9" font-weight="700" fill="#dc2626">
      Loss of Mission Context
    </text>

    <text x="45" y="518" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#dc2626">Ablation</text>
    <text x="45" y="530" text-anchor="middle" class="font-sans" font-size="8" fill="#64748b">Manual Reset</text>
  </g>

  <!-- ================================================================================= -->
  <!-- CENTER: 4 DEFENSIVE ESCALATION RUNGS -->
  <!-- ================================================================================= -->

  <!-- RUNG 1: ACTIVE QP PROJECTION SHIELD -->
  <g transform="translate(138, 70)">
    <rect width="864" height="96" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Header row -->
    <rect x="14" y="10" width="22" height="18" rx="4" fill="#3b82f6"/>
    <text x="25" y="23" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#ffffff">R1</text>
    <text x="44" y="23" class="font-sans" font-size="12" font-weight="700" fill="#1e40af">ACTIVE QP PROJECTION SHIELD (Safely-Limited Speed / Force — SLS/SLF)</text>
    
    <!-- Substrate Badge -->
    <rect x="626" y="10" width="224" height="20" rx="4" fill="#1e40af"/>
    <text x="738" y="24" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#ffffff">Bare-Metal Cortex-M7 DTCM</text>

    <!-- Content -->
    <text x="16" y="48" class="font-sans" font-size="10.5" fill="#1e293b">
      <tspan font-weight="700" fill="#1e40af">Action:</tspan> Real-time orthogonal QP projection: <tspan class="font-mono" font-weight="600">u* = argmin ½||u - u_nom||²</tspan> subject to safety barrier constraints <tspan class="font-mono" font-weight="600">a(x)ᵀ u ≤ b</tspan>.
    </text>
    <text x="16" y="66" class="font-sans" font-size="10" fill="#334155">
      <tspan font-weight="700">Latency:</tspan> &lt; 175 μs per cycle  |  <tspan font-weight="700">Mechanical Wear:</tspan> Zero degradation (nominal inverter switching)  |  <tspan font-weight="700">SIL/PL:</tspan> SIL 2 / PL d
    </text>
    
    <g transform="translate(16, 75)">
      <circle cx="5" cy="5" r="5" fill="#10b981"/>
      <path d="M 2.5 5 L 4.5 7 L 7.5 3" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <text x="16" y="9" class="font-sans" font-size="9.5" font-weight="700" fill="#059669">
        Mission Status: Continuous execution; 100% mission progress; transparent to learned planner.
      </text>
    </g>
  </g>

  <!-- TRIP CONNECTOR 1 -> 2 -->
  <g transform="translate(138, 166)">
    <line x1="432" y1="0" x2="432" y2="44" stroke="#475569" stroke-width="1.8"/>
    <polygon points="428,42 432,50 436,42" fill="#475569"/>
    <rect x="192" y="14" width="480" height="20" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="432" y="28" text-anchor="middle" class="font-sans" font-size="9.5" font-weight="600" fill="#334155">
      Trip: Invariant divergence |e(t)| &gt; 4.2 mm  OR  Solver latency overrun T_solve &gt; 650 μs
    </text>
  </g>

  <!-- RUNG 2: ACTIVE CLOSED-LOOP POSITION HOLD -->
  <g transform="translate(138, 214)">
    <rect width="864" height="96" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header row -->
    <rect x="14" y="10" width="22" height="18" rx="4" fill="#64748b"/>
    <text x="25" y="23" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#ffffff">R2</text>
    <text x="44" y="23" class="font-sans" font-size="12" font-weight="700" fill="#334155">ACTIVE CLOSED-LOOP POSITION HOLD (IEC 60204-1 Category 2 / Safe Stop 2 — SS2)</text>

    <!-- Substrate Badge -->
    <rect x="626" y="10" width="224" height="20" rx="4" fill="#334155"/>
    <text x="738" y="24" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#ffffff">Dedicated Real-Time RTOS Core</text>

    <!-- Content -->
    <text x="16" y="48" class="font-sans" font-size="10.5" fill="#1e293b">
      <tspan font-weight="700" fill="#334155">Action:</tspan> Autonomous zero-velocity quintic spline hold; active PWM inverter modulation holds position against gravity.
    </text>
    <text x="16" y="66" class="font-sans" font-size="10" fill="#334155">
      <tspan font-weight="700">Latency:</tspan> 1.0–3.0 ms  |  <tspan font-weight="700">Mechanical Wear:</tspan> Electrical Joule heating (I²R stator dissipation)  |  <tspan font-weight="700">SIL/PL:</tspan> SIL 2 / PL d
    </text>
    
    <g transform="translate(16, 75)">
      <circle cx="5" cy="5" r="5" fill="#0284c7"/>
      <text x="5" y="8" text-anchor="middle" class="font-sans" font-size="7" font-weight="700" fill="#ffffff">i</text>
      <text x="16" y="9" class="font-sans" font-size="9.5" font-weight="700" fill="#0284c7">
        Mission Status: Preserved Kinematic State; auto-resumes when policy refreshes valid intent lease within 200 ms.
      </text>
    </g>
  </g>

  <!-- TRIP CONNECTOR 2 -> 3 -->
  <g transform="translate(138, 310)">
    <line x1="432" y1="0" x2="432" y2="44" stroke="#d97706" stroke-width="1.8"/>
    <polygon points="428,42 432,50 436,42" fill="#d97706"/>
    <rect x="192" y="14" width="480" height="20" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="432" y="28" text-anchor="middle" class="font-sans" font-size="9.5" font-weight="600" fill="#92400e">
      Trip: Intent lease timeout τ_lease &gt; 40 ms  OR  Tracking error breach |e(t)| &gt; 8.0 mm
    </text>
  </g>

  <!-- RUNG 3: CONTROLLED DYNAMIC STOP -->
  <g transform="translate(138, 358)">
    <rect width="864" height="96" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header row -->
    <rect x="14" y="10" width="22" height="18" rx="4" fill="#f59e0b"/>
    <text x="25" y="23" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#ffffff">R3</text>
    <text x="44" y="23" class="font-sans" font-size="12" font-weight="700" fill="#92400e">CONTROLLED DYNAMIC STOP (IEC 60204-1 Category 1 / Safe Stop 1 — SS1)</text>

    <!-- Substrate Badge -->
    <rect x="626" y="10" width="224" height="20" rx="4" fill="#b45309"/>
    <text x="738" y="24" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#ffffff">Isolated Safety Supervisor MCU</text>

    <!-- Content -->
    <text x="16" y="48" class="font-sans" font-size="10.5" fill="#1e293b">
      <tspan font-weight="700" fill="#92400e">Action:</tspan> Maximum counter-electromotive dynamic braking (a_max); regenerative current dumped into DC-bus chopper shunts.
    </text>
    <text x="16" y="66" class="font-sans" font-size="10" fill="#334155">
      <tspan font-weight="700">Latency:</tspan> 10–20 ms  |  <tspan font-weight="700">Mechanical Wear:</tspan> Peak gear-tooth torque stress; DC-bus chopper resistor thermal surge  |  <tspan font-weight="700">SIL/PL:</tspan> SIL 3 / PL e
    </text>
    
    <g transform="translate(16, 75)">
      <polygon points="5,0 10,9 0,9" fill="#d97706"/>
      <text x="5" y="8" text-anchor="middle" class="font-sans" font-size="6.5" font-weight="700" fill="#ffffff">!</text>
      <text x="16" y="9" class="font-sans" font-size="9.5" font-weight="700" fill="#b45309">
        Mission Status: Mission Aborted; trajectory context discarded; supervisor state-machine re-homing required.
      </text>
    </g>
  </g>

  <!-- TRIP CONNECTOR 3 -> 4 -->
  <g transform="translate(138, 454)">
    <line x1="432" y1="0" x2="432" y2="44" stroke="#dc2626" stroke-width="1.8"/>
    <polygon points="428,42 432,50 436,42" fill="#dc2626"/>
    <rect x="182" y="14" width="500" height="20" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="432" y="28" text-anchor="middle" class="font-sans" font-size="9.5" font-weight="700" fill="#b91c1c">
      Trip: Hardware windowed watchdog timeout t_silent ≥ 3.0 ms  OR  Overtravel limit switch
    </text>
  </g>

  <!-- RUNG 4: GALVANIC SAFE TORQUE OFF -->
  <g transform="translate(138, 502)">
    <rect width="864" height="96" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header row -->
    <rect x="14" y="10" width="22" height="18" rx="4" fill="#dc2626"/>
    <text x="25" y="23" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#ffffff">R4</text>
    <text x="44" y="23" class="font-sans" font-size="12" font-weight="700" fill="#991b1b">GALVANIC SAFE TORQUE OFF (IEC 60204-1 Category 0 / STO / ISO 13849-1 PL e)</text>

    <!-- Substrate Badge -->
    <rect x="626" y="10" width="224" height="20" rx="4" fill="#991b1b"/>
    <text x="738" y="24" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#ffffff">Dual Force-Guided Relays &amp; Opto</text>

    <!-- Content -->
    <text x="16" y="48" class="font-sans" font-size="10.5" fill="#1e293b">
      <tspan font-weight="700" fill="#991b1b">Action:</tspan> Gate-driver bias dropped in &lt; 5 μs (high-Z MOSFETs); electromechanical spring friction brakes clamp shafts.
    </text>
    <text x="16" y="66" class="font-sans" font-size="10" fill="#334155">
      <tspan font-weight="700">Latency:</tspan> &lt; 5 μs (electrical cutoff), &lt; 30 ms (brake seat)  |  <tspan font-weight="700">Mechanical Wear:</tspan> Friction pad ablation; gear tooth shock  |  <tspan font-weight="700">SIL/PL:</tspan> SIL 3 / PL e
    </text>

    <g transform="translate(16, 75)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#dc2626"/>
      <rect x="2" y="4" width="6" height="2" fill="#ffffff"/>
      <text x="16" y="9" class="font-sans" font-size="9.5" font-weight="700" fill="#991b1b">
        Mission Status: Catastrophic Safety Lockout; rapid friction pad ablation; structural shock; manual physical reset required.
      </text>
    </g>
  </g>
</svg>
