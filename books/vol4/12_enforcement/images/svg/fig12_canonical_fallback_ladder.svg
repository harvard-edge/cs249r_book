<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="980" height="440" fill="#FFFFFF"/>

  <!-- Left Column: Inputs & Plant State Sensing -->
  <!-- Header: Inputs -->
  <text x="105" y="28" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">UNPRIVILEGED INPUT</text>
  <rect x="20" y="42" width="170" height="58" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="105" y="66" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="middle">Upstream Policy</text>
  <text x="105" y="85" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">u<tspan baseline-shift="sub" font-size="78%">nom</tspan> (Proposal)</text>

  <!-- Header: Deterministic State Context -->
  <text x="105" y="138" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">STATE &amp; FAULT CONTEXT</text>
  <rect x="20" y="150" width="170" height="260" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" filter="url(#card-shadow)"/>
  
  <!-- Trigger 1 -->
  <circle cx="42" cy="180" r="5.5" fill="#10B981"/>
  <text x="56" y="177" font-size="11" font-weight="700" fill="#0F172A">Nominal Motion</text>
  <text x="56" y="193" font-size="9.5" fill="#64748B">h(x) ≥ 0, lease valid</text>
  <line x1="35" y1="210" x2="175" y2="210" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Trigger 2 -->
  <circle cx="42" cy="240" r="5.5" fill="#64748B"/>
  <text x="56" y="237" font-size="11" font-weight="700" fill="#0F172A">Standstill Fault</text>
  <text x="56" y="253" font-size="9.5" fill="#64748B">v ≈ 0, lease expired</text>
  <line x1="35" y1="270" x2="175" y2="270" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Trigger 3 -->
  <circle cx="42" cy="300" r="5.5" fill="#F59E0B"/>
  <text x="56" y="297" font-size="11" font-weight="700" fill="#0F172A">In-Motion Breach</text>
  <text x="56" y="313" font-size="9.5" fill="#64748B">v &gt; 0, barrier tripwire</text>
  <line x1="35" y1="330" x2="175" y2="330" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Trigger 4 -->
  <circle cx="42" cy="360" r="5.5" fill="#EF4444"/>
  <text x="56" y="357" font-size="11" font-weight="700" fill="#0F172A">Hardware / Clock Loss</text>
  <text x="56" y="373" font-size="9.5" fill="#64748B">MCU stall, watchdog reset</text>

  <!-- Middle Column: The 4 Independent Rungs -->
  <text x="445" y="28" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">STATE-MATCHED FALLBACK RUNGS</text>

  <!-- Connectors from Input to Rung 1 -->
  <line x1="190" y1="71" x2="235" y2="71" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Rung 1: Safety Filter -->
  <rect x="240" y="42" width="410" height="72" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.4" filter="url(#card-shadow)"/>
  <text x="260" y="66" font-size="12.5" font-weight="700" fill="#065F46">Rung 1: Active Safety Shield (CBF-QP)</text>
  <text x="260" y="84" font-size="11" font-weight="600" fill="#059669">u* = argmin ½||u - u<tspan baseline-shift="sub" font-size="78%">nom</tspan>||² s.t. ḣ + γh ≥ 0</text>
  <text x="260" y="101" font-size="10" fill="#047857">Feasible projection; preserves task intent without stopping</text>

  <!-- Rung 2: Position Hold -->
  <rect x="240" y="134" width="410" height="72" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4" filter="url(#card-shadow)"/>
  <text x="260" y="158" font-size="12.5" font-weight="700" fill="#1E293B">Rung 2: Powered Position Hold (Cat 2 / SS2)</text>
  <text x="260" y="176" font-size="11" font-weight="600" fill="#475569">u<tspan baseline-shift="sub" font-size="78%">hold</tspan> = Closed-loop zero-velocity torque</text>
  <text x="260" y="193" font-size="10" fill="#64748B">Maintains standstill position against gravity; drive remains powered</text>

  <!-- Rung 3: Dynamic Stop -->
  <rect x="240" y="226" width="410" height="72" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.4" filter="url(#card-shadow)"/>
  <text x="260" y="250" font-size="12.5" font-weight="700" fill="#92400E">Rung 3: Controlled Dynamic Stop (Cat 1 / SS1)</text>
  <text x="260" y="268" font-size="11" font-weight="600" fill="#B45309">u<tspan baseline-shift="sub" font-size="78%">stop</tspan> = Verified resident C² braking spline</text>
  <text x="260" y="285" font-size="10" fill="#B45309">Controlled motor deceleration to rest; avoids uncontrolled tumbling</text>

  <!-- Rung 4: Drive Inhibit / STO -->
  <rect x="240" y="318" width="410" height="92" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.4" filter="url(#card-shadow)"/>
  <text x="260" y="342" font-size="12.5" font-weight="700" fill="#991B1B">Rung 4: Drive Torque Inhibit (Cat 0 / STO)</text>
  <text x="260" y="360" font-size="11" font-weight="600" fill="#DC2626">STO: Inverter gate PWM clamped + spring brake released</text>
  <text x="260" y="377" font-size="10" fill="#7F1D1D">Last resort for loss of MCU clock; mechanical brake engagement delay</text>
  <!-- Warning badge -->
  <rect x="260" y="384" width="370" height="18" rx="3" fill="#FEE2E2"/>
  <text x="445" y="397" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">⚠️ STO Trap: Removes motor braking! Incurs unbraked coasting if moving</text>

  <!-- Right Column: The Arbiter Multiplexer -->
  <text x="760" y="28" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">DETERMINISTIC ARBITER</text>

  <!-- MUX Trapezoid Symbol -->
  <polygon points="720,60 770,110 770,320 720,370" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8" filter="url(#card-shadow)"/>
  <text x="745" y="210" font-size="11.5" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">MUX</text>
  <text x="745" y="225" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">1 kHz</text>
  <text x="745" y="238" font-size="8.5" fill="#64748B" text-anchor="middle">Arbiter</text>

  <!-- Straight Horizontal Routing Lines from Rungs into MUX -->
  <!-- Rung 1 into MUX (Active Path) -->
  <line x1="650" y1="78" x2="720" y2="78" stroke="#059669" stroke-width="2.4"/>
  <circle cx="720" cy="78" r="3.5" fill="#059669"/>

  <!-- Rung 2 into MUX -->
  <line x1="650" y1="170" x2="720" y2="170" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4,4"/>
  <circle cx="720" cy="170" r="3" fill="#94A3B8"/>

  <!-- Rung 3 into MUX -->
  <line x1="650" y1="262" x2="720" y2="262" stroke="#D97706" stroke-width="1.4" stroke-dasharray="4,4"/>
  <circle cx="720" cy="262" r="3" fill="#D97706"/>

  <!-- Rung 4 into MUX -->
  <line x1="650" y1="354" x2="720" y2="354" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4,4"/>
  <circle cx="720" cy="354" r="3" fill="#DC2626"/>

  <!-- Internal Active Switch Indicator inside MUX -->
  <line x1="720" y1="78" x2="770" y2="215" stroke="#059669" stroke-width="2.2"/>

  <!-- Output Arrow to Physical Drives -->
  <line x1="770" y1="215" x2="845" y2="215" stroke="#0F172A" stroke-width="2.4" marker-end="url(#arr-dark)"/>

  <!-- Output Capsule -->
  <rect x="855" y="191" width="70" height="48" rx="6" fill="#0F172A" filter="url(#card-shadow)"/>
  <text x="890" y="212" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">u<tspan baseline-shift="sub" font-size="78%">act</tspan></text>
  <text x="890" y="228" font-size="9.5" font-weight="600" fill="#94A3B8" text-anchor="middle">Drives</text>
</svg>