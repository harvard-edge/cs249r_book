<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" width="100%" height="100%">
  <defs>
    <!-- Card Drop Shadows -->
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1160" height="650" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Canvas Header & Attribution -->
  <text x="28" y="32" class="font-sans" font-size="16" font-weight="700" fill="#0f172a">Deterministic Fallback Escalation Architecture &amp; Execution Substrates</text>
  <text x="1132" y="32" text-anchor="end" class="font-sans" font-size="12" font-weight="500" fill="#64748b">Synthesized from IEC 60204-1, ISO 13849-1, IEC 61800-5-2, and Sha et al. (2001)</text>
  <line x1="28" y1="46" x2="1132" y2="46" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ================================================================================= -->
  <!-- LEFT HALF: HARDWARE ENFORCER SIGNAL-FLOW SCHEMATIC (Width: ~670px) -->
  <!-- ================================================================================= -->
  <g transform="translate(24, 60)">
    <!-- Container Card for Enforcer -->
    <rect width="670" height="566" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="670" height="30" rx="10" fill="#f1f5f9"/>
    <rect y="22" width="670" height="8" fill="#f1f5f9"/>
    <line x1="0" y1="30" x2="670" y2="30" stroke="#cbd5e1" stroke-width="1"/>

    <text x="14" y="20" class="font-sans" font-size="11" font-weight="700" fill="#334155">
      PANEL A: DETERMINISTIC REAL-TIME ARBITER &amp; CASCADE SIGNAL FLOW
    </text>

    <!-- Upstream Policy Box (Top-Left Ingress) -->
    <g transform="translate(16, 42)">
      <rect width="170" height="54" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
      <text x="10" y="17" class="font-mono" font-size="8.5" font-weight="700" fill="#6d28d9">UPSTREAM POLICY (Linux)</text>
      <text x="10" y="31" class="font-sans" font-size="8.5" fill="#4c1d95">Learned Foundation Model / VLA</text>
      <text x="10" y="46" class="font-mono" font-size="9.5" font-weight="700" fill="#7c3aed">u_nom(t) ∈ ℝ^m</text>
    </g>

    <!-- Ingress Arrow into Enforcer -->
    <path d="M 186 69 L 220 69" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- ========================================== -->
    <!-- CASCADE TIER 1: QP BARRIER PROJECTION -->
    <!-- ========================================== -->
    <g transform="translate(224, 42)">
      <rect width="256" height="106" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect width="256" height="22" rx="6" fill="#dbeafe"/>
      <rect y="16" width="256" height="6" fill="#dbeafe"/>
      <text x="10" y="16" class="font-mono" font-size="9.5" font-weight="700" fill="#1e40af">TIER 1: QP BARRIER PROJECTION</text>
      <text x="246" y="16" text-anchor="end" class="font-mono" font-size="8.5" font-weight="700" fill="#2563eb">&lt; 175 μs</text>

      <text x="10" y="38" class="font-mono" font-size="9.5" font-weight="600" fill="#0f172a">u* = argmin ½||u - u_nom||²</text>
      <text x="10" y="52" class="font-mono" font-size="8.5" fill="#1e40af">s.t. ∇h(x)ᵀ u + α(h(x)) ≥ 0</text>

      <rect x="8" y="62" width="240" height="36" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="14" y="76" class="font-mono" font-size="8.5" font-weight="600" fill="#334155">Trip Monitor:</text>
      <text x="14" y="90" class="font-mono" font-size="8" fill="#dc2626">h(x) &lt; 0  ∨  T_solve &gt; 650 μs</text>
    </g>

    <!-- Output Arrow from Tier 1 to Switch Terminal 1 -->
    <path d="M 480 84 L 540 84" fill="none" stroke="#2563eb" stroke-width="2"/>
    <circle cx="540" cy="84" r="4" fill="#2563eb"/>
    <text x="548" y="87" class="font-mono" font-size="9" font-weight="700" fill="#1e40af">1 (Nominal)</text>

    <!-- Trip Line 1 -> 2 -->
    <line x1="352" y1="148" x2="352" y2="166" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="348,164 352,171 356,164" fill="#dc2626"/>

    <!-- ========================================== -->
    <!-- CASCADE TIER 2: ACTIVE POSITION HOLD -->
    <!-- ========================================== -->
    <g transform="translate(224, 172)">
      <rect width="256" height="106" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect width="256" height="22" rx="6" fill="#e2e8f0"/>
      <rect y="16" width="256" height="6" fill="#e2e8f0"/>
      <text x="10" y="16" class="font-mono" font-size="9.5" font-weight="700" fill="#334155">TIER 2: ACTIVE CLOSED-LOOP HOLD</text>
      <text x="246" y="16" text-anchor="end" class="font-mono" font-size="8.5" font-weight="700" fill="#475569">1–3 ms</text>

      <text x="10" y="38" class="font-mono" font-size="9.5" font-weight="600" fill="#0f172a">u_hold = Kp(xref - x) - Kd·v</text>
      <text x="10" y="52" class="font-sans" font-size="8.5" fill="#475569">Zero-velocity quintic spline; holds gravity</text>

      <rect x="8" y="62" width="240" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="76" class="font-mono" font-size="8.5" font-weight="600" fill="#334155">Trip Monitor:</text>
      <text x="14" y="90" class="font-mono" font-size="8" fill="#dc2626">τ_lease &gt; 40 ms  ∨  |e(t)| &gt; 8 mm</text>
    </g>

    <!-- Output Arrow from Tier 2 to Switch Terminal 2 -->
    <path d="M 480 214 L 540 214" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="540" cy="214" r="4" fill="#64748b"/>
    <text x="548" y="217" class="font-mono" font-size="9" font-weight="700" fill="#475569">2 (Hold)</text>

    <!-- Trip Line 2 -> 3 -->
    <line x1="352" y1="278" x2="352" y2="296" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="348,294 352,301 356,294" fill="#dc2626"/>

    <!-- ========================================== -->
    <!-- CASCADE TIER 3: CONTROLLED DYNAMIC STOP -->
    <!-- ========================================== -->
    <g transform="translate(224, 302)">
      <rect width="256" height="106" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
      <rect width="256" height="22" rx="6" fill="#fef3c7"/>
      <rect y="16" width="256" height="6" fill="#fef3c7"/>
      <text x="10" y="16" class="font-mono" font-size="9.5" font-weight="700" fill="#92400e">TIER 3: CONTROLLED DYNAMIC STOP</text>
      <text x="246" y="16" text-anchor="end" class="font-mono" font-size="8.5" font-weight="700" fill="#b45309">10–20 ms</text>

      <text x="10" y="38" class="font-mono" font-size="9.5" font-weight="600" fill="#0f172a">u_stop = -amax · sgn(v)</text>
      <text x="10" y="52" class="font-sans" font-size="8.5" fill="#78350f">Maximum counter-EMF; DC-bus chopper dump</text>

      <rect x="8" y="62" width="240" height="36" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="14" y="76" class="font-mono" font-size="8.5" font-weight="600" fill="#334155">Trip Monitor:</text>
      <text x="14" y="90" class="font-mono" font-size="8" fill="#dc2626">t_silent ≥ 3.0 ms  ∨  Overtravel Limit</text>
    </g>

    <!-- Output Arrow from Tier 3 to Switch Terminal 3 -->
    <path d="M 480 344 L 540 344" fill="none" stroke="#d97706" stroke-width="2"/>
    <circle cx="540" cy="344" r="4" fill="#d97706"/>
    <text x="548" y="347" class="font-mono" font-size="9" font-weight="700" fill="#b45309">3 (Dynamic)</text>

    <!-- Trip Line 3 -> 4 -->
    <line x1="352" y1="408" x2="352" y2="426" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="348,424 352,431 356,424" fill="#dc2626"/>

    <!-- ========================================== -->
    <!-- CASCADE TIER 4: GALVANIC SAFE TORQUE OFF -->
    <!-- ========================================== -->
    <g transform="translate(224, 432)">
      <rect width="256" height="106" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <rect width="256" height="22" rx="6" fill="#fee2e2"/>
      <rect y="16" width="256" height="6" fill="#fee2e2"/>
      <text x="10" y="16" class="font-mono" font-size="9.5" font-weight="700" fill="#991b1b">TIER 4: SAFE TORQUE OFF (STO)</text>
      <text x="246" y="16" text-anchor="end" class="font-mono" font-size="8.5" font-weight="700" fill="#dc2626">&lt; 5 μs</text>

      <text x="10" y="38" class="font-mono" font-size="9.5" font-weight="600" fill="#7f1d1d">Vgate = 0 V  (High-Z Cutoff)</text>
      <text x="10" y="52" class="font-sans" font-size="8.5" fill="#7f1d1d">Dual force-guided relays; spring brake clamp</text>

      <rect x="8" y="62" width="240" height="36" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="14" y="76" class="font-mono" font-size="8.5" font-weight="600" fill="#334155">Hardware Trigger:</text>
      <text x="14" y="90" class="font-mono" font-size="8" fill="#dc2626">Direct E-Stop / Relay Coil De-energize</text>
    </g>

    <!-- Output Arrow from Tier 4 to Switch Terminal 4 -->
    <path d="M 480 474 L 540 474" fill="none" stroke="#dc2626" stroke-width="2"/>
    <circle cx="540" cy="474" r="4" fill="#dc2626"/>
    <text x="548" y="477" class="font-mono" font-size="9" font-weight="700" fill="#991b1b">4 (STO)</text>

    <!-- ========================================== -->
    <!-- ARBITER ROTARY / CASCADE SWITCH SYMBOL -->
    <!-- ========================================== -->
    <g transform="translate(540, 0)">
      <!-- Common Output Terminal -->
      <circle cx="70" cy="279" r="5" fill="#0f172a"/>
      
      <!-- Switch Blade (Connected to Terminal 1 by default, dashed lines to 2, 3, 4) -->
      <line x1="70" y1="279" x2="0" y2="84" stroke="#2563eb" stroke-width="3"/>
      <line x1="70" y1="279" x2="0" y2="214" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="70" y1="279" x2="0" y2="344" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="70" y1="279" x2="0" y2="474" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Output bus line to Actuator -->
      <path d="M 75 279 L 100 279" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arr-slate)"/>
      <text x="86" y="270" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#0f172a">u_act</text>
    </g>
  </g>

  <!-- ================================================================================= -->
  <!-- RIGHT HALF: TECHNICAL SPECIFICATION MATRIX (Width: ~420px) -->
  <!-- ================================================================================= -->
  <g transform="translate(714, 60)">
    <!-- Container Card for Matrix -->
    <rect width="422" height="566" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="422" height="30" rx="10" fill="#f1f5f9"/>
    <rect y="22" width="422" height="8" fill="#f1f5f9"/>
    <line x1="0" y1="30" x2="422" y2="30" stroke="#cbd5e1" stroke-width="1"/>

    <text x="14" y="20" class="font-sans" font-size="11" font-weight="700" fill="#334155">
      PANEL B: DEFENSIVE TIER SPECIFICATIONS &amp; TRADE-OFFS
    </text>

    <!-- TIER 1 CHIP CARD -->
    <g transform="translate(14, 42)">
      <rect width="394" height="106" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="10" font-weight="700" fill="#1e40af">RUNG 1: SLS / SLF (Safely-Limited Speed)</text>
      
      <!-- Metrics Grid -->
      <g transform="translate(10, 26)">
        <rect width="180" height="32" rx="3" fill="#ffffff" stroke="#dbeafe" stroke-width="1"/>
        <text x="6" y="13" class="font-sans" font-size="7.5" fill="#64748b">SUBSTRATE</text>
        <text x="6" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#1e3a8a">Bare-Metal Cortex-M7 DTCM</text>

        <rect x="190" y="0" width="184" height="32" rx="3" fill="#ffffff" stroke="#dbeafe" stroke-width="1"/>
        <text x="196" y="13" class="font-sans" font-size="7.5" fill="#64748b">REACTION LATENCY</text>
        <text x="196" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#0284c7">&lt; 175 μs (Deterministic)</text>
      </g>

      <g transform="translate(10, 64)">
        <rect width="180" height="32" rx="3" fill="#ffffff" stroke="#dbeafe" stroke-width="1"/>
        <text x="6" y="13" class="font-sans" font-size="7.5" fill="#64748b">MECHANICAL WEAR</text>
        <text x="6" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#15803d">Zero (Nominal switching)</text>

        <rect x="190" y="0" width="184" height="32" rx="3" fill="#ffffff" stroke="#dbeafe" stroke-width="1"/>
        <text x="196" y="13" class="font-sans" font-size="7.5" fill="#64748b">MISSION RECOVERY</text>
        <text x="196" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#15803d">100% Transparent</text>
      </g>
    </g>

    <!-- TIER 2 CHIP CARD -->
    <g transform="translate(14, 156)">
      <rect width="394" height="106" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="10" font-weight="700" fill="#334155">RUNG 2: SS2 (Safe Stop 2 / Category 2)</text>

      <!-- Metrics Grid -->
      <g transform="translate(10, 26)">
        <rect width="180" height="32" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="6" y="13" class="font-sans" font-size="7.5" fill="#64748b">SUBSTRATE</text>
        <text x="6" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#334155">Dedicated RTOS Kernel Core</text>

        <rect x="190" y="0" width="184" height="32" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="196" y="13" class="font-sans" font-size="7.5" fill="#64748b">REACTION LATENCY</text>
        <text x="196" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#0284c7">1.0 – 3.0 ms</text>
      </g>

      <g transform="translate(10, 64)">
        <rect width="180" height="32" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="6" y="13" class="font-sans" font-size="7.5" fill="#64748b">MECHANICAL WEAR</text>
        <text x="6" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#d97706">Stator Joule Heat (I²R)</text>

        <rect x="190" y="0" width="184" height="32" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="196" y="13" class="font-sans" font-size="7.5" fill="#64748b">MISSION RECOVERY</text>
        <text x="196" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#0284c7">Auto-Resume (&lt; 200 ms)</text>
      </g>
    </g>

    <!-- TIER 3 CHIP CARD -->
    <g transform="translate(14, 270)">
      <rect width="394" height="106" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="10" font-weight="700" fill="#92400e">RUNG 3: SS1 (Safe Stop 1 / Category 1)</text>

      <!-- Metrics Grid -->
      <g transform="translate(10, 26)">
        <rect width="180" height="32" rx="3" fill="#ffffff" stroke="#fef3c7" stroke-width="1"/>
        <text x="6" y="13" class="font-sans" font-size="7.5" fill="#64748b">SUBSTRATE</text>
        <text x="6" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#92400e">Safety Supervisor MCU</text>

        <rect x="190" y="0" width="184" height="32" rx="3" fill="#ffffff" stroke="#fef3c7" stroke-width="1"/>
        <text x="196" y="13" class="font-sans" font-size="7.5" fill="#64748b">REACTION LATENCY</text>
        <text x="196" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#b45309">10 – 20 ms</text>
      </g>

      <g transform="translate(10, 64)">
        <rect width="180" height="32" rx="3" fill="#ffffff" stroke="#fef3c7" stroke-width="1"/>
        <text x="6" y="13" class="font-sans" font-size="7.5" fill="#64748b">MECHANICAL WEAR</text>
        <text x="6" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#dc2626">Torque Shock &amp; Regen Dump</text>

        <rect x="190" y="0" width="184" height="32" rx="3" fill="#ffffff" stroke="#fef3c7" stroke-width="1"/>
        <text x="196" y="13" class="font-sans" font-size="7.5" fill="#64748b">MISSION RECOVERY</text>
        <text x="196" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#b45309">Aborted (Re-home required)</text>
      </g>
    </g>

    <!-- TIER 4 CHIP CARD -->
    <g transform="translate(14, 384)">
      <rect width="394" height="106" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="10" font-weight="700" fill="#991b1b">RUNG 4: STO (Safe Torque Off / Category 0)</text>

      <!-- Metrics Grid -->
      <g transform="translate(10, 26)">
        <rect width="180" height="32" rx="3" fill="#ffffff" stroke="#fee2e2" stroke-width="1"/>
        <text x="6" y="13" class="font-sans" font-size="7.5" fill="#64748b">SUBSTRATE</text>
        <text x="6" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#991b1b">Dual Relays &amp; Optos</text>

        <rect x="190" y="0" width="184" height="32" rx="3" fill="#ffffff" stroke="#fee2e2" stroke-width="1"/>
        <text x="196" y="13" class="font-sans" font-size="7.5" fill="#64748b">REACTION LATENCY</text>
        <text x="196" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#dc2626">&lt; 5 μs (Elec) / 30 ms (Mech)</text>
      </g>

      <g transform="translate(10, 64)">
        <rect width="180" height="32" rx="3" fill="#ffffff" stroke="#fee2e2" stroke-width="1"/>
        <text x="6" y="13" class="font-sans" font-size="7.5" fill="#64748b">MECHANICAL WEAR</text>
        <text x="6" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#dc2626">Friction Pad Ablation</text>

        <rect x="190" y="0" width="184" height="32" rx="3" fill="#ffffff" stroke="#fee2e2" stroke-width="1"/>
        <text x="196" y="13" class="font-sans" font-size="7.5" fill="#64748b">MISSION RECOVERY</text>
        <text x="196" y="25" class="font-mono" font-size="8.5" font-weight="700" fill="#991b1b">Lockout (Manual Reset)</text>
      </g>
    </g>

    <!-- Bottom Trade-off Summary Vector -->
    <g transform="translate(14, 500)">
      <rect width="394" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M 20 26 L 374 26" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
      <text x="14" y="16" class="font-sans" font-size="8.5" font-weight="700" fill="#334155">ESCALATION GRADIENT (R1 → R4):</text>
      <text x="24" y="42" class="font-mono" font-size="8" font-weight="700" fill="#2563eb">Decr. Latency (&lt; 5 μs)</text>
      <text x="370" y="42" text-anchor="end" class="font-mono" font-size="8" font-weight="700" fill="#dc2626">Incr. Irreversibility</text>
    </g>
  </g>
</svg>
