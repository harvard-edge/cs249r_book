<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="440" fill="#FFFFFF"/>

  <!-- Escalation Gradient Indicator on Left -->
  <line x1="65" y1="65" x2="65" y2="370" stroke="#64748B" stroke-width="1.4" marker-end="url(#arr-dark)"/>
  <text x="52" y="218" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" transform="rotate(-90 52 218)">Escalation: Increasing Invariance</text>

  <!-- Upstream Policy Input Capsule -->
  <rect x="110" y="42" width="150" height="52" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="185" y="63" font-size="11.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Upstream Policy</text>
  <text x="185" y="81" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">u_nom</text>

  <!-- Flow to Rung 1 -->
  <line x1="260" y1="68" x2="315" y2="68" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>

  <!-- ==================== THE FOUR RUNGS ==================== -->
  <!-- Rung 1: Safety Filter -->
  <g id="rung1">
    <rect x="320" y="42" width="250" height="52" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="340" y="66" font-size="12" font-weight="700" fill="#065F46">Rung 1: Safety Filter</text>
    <text x="340" y="83" font-size="11" font-weight="600" fill="#059669">u*</text>
  </g>

  <!-- Escalation Arrow Rung 1 -> Rung 2 -->
  <line x1="445" y1="94" x2="445" y2="136" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <!-- Rung 2: Position Hold -->
  <g id="rung2">
    <rect x="320" y="142" width="250" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="340" y="166" font-size="12" font-weight="700" fill="#334155">Rung 2: Position Hold</text>
    <text x="340" y="183" font-size="11" font-weight="600" fill="#64748B">u_hold</text>
  </g>

  <!-- Escalation Arrow Rung 2 -> Rung 3 -->
  <line x1="445" y1="194" x2="445" y2="236" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <!-- Rung 3: Dynamic Stop -->
  <g id="rung3">
    <rect x="320" y="242" width="250" height="52" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
    <text x="340" y="266" font-size="12" font-weight="700" fill="#92400E">Rung 3: Dynamic Stop</text>
    <text x="340" y="283" font-size="11" font-weight="600" fill="#B45309">u_stop</text>
  </g>

  <!-- Escalation Arrow Rung 3 -> Rung 4 -->
  <line x1="445" y1="294" x2="445" y2="336" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <!-- Rung 4: Safe Torque Off -->
  <g id="rung4">
    <rect x="320" y="342" width="250" height="52" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="340" y="366" font-size="12" font-weight="700" fill="#991B1B">Rung 4: Safe Torque Off</text>
    <text x="340" y="383" font-size="11" font-weight="600" fill="#DC2626">0 V</text>
  </g>

  <!-- ==================== ARBITER / SELECTOR ==================== -->
  <!-- Switch Lines from Rungs to Arbiter Node -->
  <!-- Rung 1 active path -->
  <path d="M 570 68 L 640 68 L 695 213" fill="none" stroke="#059669" stroke-width="2"/>
  <!-- Rung 2 path -->
  <path d="M 570 168 L 640 168 L 695 213" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- Rung 3 path -->
  <path d="M 570 268 L 640 268 L 695 213" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- Rung 4 path -->
  <path d="M 570 368 L 640 368 L 695 213" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Arbiter Node -->
  <circle cx="695" cy="213" r="5" fill="#0F172A"/>
  <line x1="695" y1="213" x2="745" y2="213" stroke="#0F172A" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- Output Label -->
  <text x="755" y="217" font-size="12" font-weight="700" fill="#0F172A">u_act</text>

  <!-- Arbiter Label -->
  <text x="718" y="202" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Arbiter</text>
</svg>