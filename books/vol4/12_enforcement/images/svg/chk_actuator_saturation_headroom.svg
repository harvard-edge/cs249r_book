<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#14532d"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#7f1d1d"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Top Header -->
  <text x="16" y="15" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.2">TORQUE HEADROOM LOSS &amp; STOPPING DISTANCE EXPANSION</text>
  <text x="524" y="15" font-size="8" font-weight="500" fill="#64748b" text-anchor="end">Datasheet Rating: τ_max = 120 N·m</text>

  <!-- ==================================================================== -->
  <!-- SUB-CARD 1: NOMINAL / UNLOADED (LEFT)                                -->
  <!-- ==================================================================== -->
  <rect x="16" y="22" width="248" height="146" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

  <!-- Sub-card Header & State Pill -->
  <text x="26" y="37" font-size="9" font-weight="700" fill="#1e293b">(a) Horizontal Free Space</text>
  <rect x="180" y="27" width="74" height="14" rx="7" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="217" y="37.5" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">NOMINAL · τ_b = 0</text>

  <!-- Torque Allocation Bar Title -->
  <text x="26" y="52" font-size="8" font-weight="600" fill="#334155">Available Dynamic Braking Headroom:</text>

  <!-- Torque Stacked Bar (Nominal: 100% Green Headroom) -->
  <rect x="26" y="56" width="228" height="13" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="140" y="65.5" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">120 N·m Dynamic Braking Headroom (100%)</text>

  <!-- Physical Motion Space Label -->
  <text x="26" y="81" font-size="8" font-weight="600" fill="#334155">Stopping Displacement (Scale: 1 mm = 3 px):</text>

  <!-- Motion Track Graphic -->
  <g transform="translate(26, 85)">
    <!-- Track background (length 228, height 36) -->
    <rect x="0" y="0" width="228" height="36" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>

    <!-- Nominal Stopping Bar (0 to 14.4mm = 43.2px, say 44px) -->
    <rect x="0" y="3" width="44" height="18" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="22" y="15" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">14.4 mm</text>

    <!-- Nominal Certified Boundary Tick -->
    <line x1="44" y1="0" x2="44" y2="24" stroke="#3d9e5a" stroke-width="1.5"/>

    <!-- Free Space Clearance Zone (44px to 228px) -->
    <rect x="44" y="3" width="180" height="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2,2"/>
    <text x="134" y="15" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">Free Space Clearance Buffer</text>

    <!-- Annotations below track bar -->
    <text x="22" y="31" font-size="7" font-weight="600" fill="#14532d" text-anchor="middle">d_stop = 14.4 mm</text>
    <text x="134" y="31" font-size="7" font-weight="600" fill="#3d9e5a" text-anchor="middle">Requires ≥14.4 mm clearance</text>
  </g>

  <!-- Sub-card Bottom Result Note -->
  <rect x="26" y="126" width="228" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="32" y="138" font-size="7.5" font-weight="600" fill="#1e293b">Decel: <tspan font-weight="700" fill="#14532d">α_nom = 40.0 rad/s²</tspan> · Arrest Angle: <tspan font-weight="700">1.03°</tspan></text>
  <text x="32" y="150" font-size="7.5" font-weight="500" fill="#14532d">Nominal stop: 14.4 mm under stated assumptions.</text>

  <!-- ==================================================================== -->
  <!-- SUB-CARD 2: VERTICAL DESCENT / LOADED (RIGHT)                        -->
  <!-- ==================================================================== -->
  <rect x="276" y="22" width="248" height="146" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

  <!-- Sub-card Header & State Pill -->
  <text x="286" y="37" font-size="9" font-weight="700" fill="#1e293b">(b) Vertical Descent (Loaded)</text>
  <rect x="444" y="27" width="70" height="14" rx="7" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="479" y="37.5" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">LOAD · τ_b = 90</text>

  <!-- Torque Allocation Bar Title -->
  <text x="286" y="52" font-size="8" font-weight="600" fill="#334155">Torque Allocation (75% Steady-State Gravity):</text>

  <!-- Torque Stacked Bar (Gravity 90 N·m = 75%, Headroom 30 N·m = 25%) -->
  <g transform="translate(286, 56)">
    <!-- 75% Gravity holding bias (171px) -->
    <rect x="0" y="0" width="171" height="13" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="85" y="9.5" font-size="7" font-weight="700" fill="#78350f" text-anchor="middle">Gravity Holding: 90 N·m (75%)</text>

    <!-- 25% Net dynamic headroom (57px) -->
    <rect x="171" y="0" width="57" height="13" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
    <text x="199" y="9.5" font-size="7" font-weight="700" fill="#14532d" text-anchor="middle">30 N·m (25%)</text>
  </g>

  <!-- Physical Motion Space Label -->
  <text x="286" y="81" font-size="8" font-weight="600" fill="#334155">Stopping Displacement (4× under Load Bias):</text>

  <!-- Motion Track Graphic -->
  <g transform="translate(286, 85)">
    <!-- Track background (length 228, height 36) -->
    <rect x="0" y="0" width="228" height="36" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>

    <!-- Nominal Budgeted Zone (0 to 44px = 14.4mm) -->
    <rect x="0" y="3" width="44" height="18" rx="2" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.75"/>
    <text x="22" y="15" font-size="7" font-weight="700" fill="#78350f" text-anchor="middle">14.4 mm</text>

    <!-- Unbudgeted Overrun Zone (44px to 173px = 129px = 43.2mm) -->
    <rect x="44" y="3" width="129" height="18" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
    <text x="108" y="15" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="middle">+43.2 mm beyond budget</text>

    <!-- Boundary Ticks (only down to y=24, not into text below) -->
    <line x1="44" y1="0" x2="44" y2="24" stroke="#c44" stroke-width="1.5" stroke-dasharray="2,1"/>
    <line x1="173" y1="0" x2="173" y2="24" stroke="#7f1d1d" stroke-width="1.5"/>

    <!-- Remaining space beyond 173px -->
    <rect x="173" y="3" width="51" height="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>

    <!-- Dimension labels below track bar -->
    <text x="44" y="31" font-size="6.5" font-weight="700" fill="#c44" text-anchor="middle">Nominal stop</text>
    <text x="173" y="31" font-size="6.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Loaded stop: 57.6 mm</text>
  </g>

  <!-- Sub-card Bottom Result Note -->
  <rect x="286" y="126" width="228" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="292" y="138" font-size="7.5" font-weight="600" fill="#1e293b">Decel: <tspan font-weight="700" fill="#7f1d1d">α_eff = 10.0 rad/s² (1/4th)</tspan> · Arrest Angle: <tspan font-weight="700">4.13°</tspan></text>
  <text x="292" y="150" font-size="7.5" font-weight="700" fill="#7f1d1d">Contact if clearance &lt; 57.6 mm; recheck the margin.</text>

</svg>
