<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="340" fill="#FFFFFF"/>

  <!-- Track 1: Continuous Detection -->
  <rect x="80" y="32" width="800" height="36" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="480" y="55" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="middle">Continuous Sensing</text>

  <!-- Track 2: Classification Toggles -->
  <!-- Capsule 1: Unknown -->
  <rect x="80" y="88" width="160" height="42" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="160" y="114" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Unknown</text>

  <!-- Reset 1 Arrow -->
  <line x1="240" y1="109" x2="250" y2="109" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Capsule 2: Vehicle -->
  <rect x="255" y="88" width="240" height="42" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="375" y="114" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle">Vehicle</text>

  <!-- Reset 2 Arrow -->
  <line x1="495" y1="109" x2="505" y2="109" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Capsule 3: Static -->
  <rect x="510" y="88" width="185" height="42" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="602" y="114" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle">Static</text>

  <!-- Reset 3 Arrow -->
  <line x1="695" y1="109" x2="705" y2="109" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Capsule 4: Bicycle -->
  <rect x="710" y="88" width="170" height="42" rx="5" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <text x="795" y="114" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">Bicycle</text>

  <!-- Track 3: Suppression Delay -->
  <rect x="708" y="150" width="172" height="34" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="794" y="172" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">Suppression Delay</text>

  <!-- Impact Marker -->
  <circle cx="880" cy="167" r="6" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Track 4: Geometric Safety Floor -->
  <rect x="80" y="205" width="440" height="36" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="300" y="228" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">Enforcer: Safe Stop</text>
  <circle cx="520" cy="223" r="5" fill="#059669"/>

  <!-- ==================== TIMELINE AXIS ==================== -->
  <line x1="80" y1="270" x2="900" y2="270" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>
  <line x1="80" y1="265" x2="80" y2="275" stroke="#334155" stroke-width="1.3"/>
  <text x="80" y="294" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">-5.6 s (82 m)</text>
  <line x1="251" y1="265" x2="251" y2="275" stroke="#334155" stroke-width="1.3"/>
  <text x="251" y="294" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">-4.4 s (65 m)</text>
  <line x1="508" y1="265" x2="508" y2="275" stroke="#334155" stroke-width="1.3"/>
  <text x="508" y="294" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">-2.6 s (38 m)</text>
  <line x1="708" y1="265" x2="708" y2="275" stroke="#334155" stroke-width="1.3"/>
  <text x="708" y="294" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">-1.2 s (18 m)</text>
  <line x1="880" y1="265" x2="880" y2="275" stroke="#334155" stroke-width="1.3"/>
  <text x="880" y="294" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">0 s (Impact)</text>
</svg>