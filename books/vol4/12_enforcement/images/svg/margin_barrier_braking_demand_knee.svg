<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 210 172" width="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Braking torque the kinetic barrier demands vs tool clearance (linear x: 60-120 mm; linear y: 93 N·m at top, 6 px per N·m, truncated). -->
  <rect x="-10" y="0" width="210" height="172" fill="#ffffff"/>
  <!-- infeasible region: clearance below the 79.45 mm zero set -->
  <rect x="10" y="14" width="58.35" height="151" fill="#f2d7d5" opacity="0.35"/>
  <!-- joint peak torque, 87 N·m -->
  <line x1="10" y1="66" x2="190" y2="66" stroke="#cb202d" stroke-width="1.8" stroke-dasharray="6.8,2.9"/>
  <!-- demand line: red where it exceeds the peak, orange where feasible -->
  <line x1="10" y1="39.5" x2="68.35" y2="66" stroke="#cb202d" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="68.35" y1="66" x2="190" y2="121.1" stroke="#d97706" stroke-width="3.4" stroke-linecap="square"/>
  <!-- points -->
  <circle cx="40" cy="53.2" r="5" fill="#cb202d"/>
  <circle cx="68.35" cy="66" r="5.5" fill="#cb202d"/>
  <circle cx="160" cy="107.5" r="5" fill="#d97706"/>
  <!-- baseline -->
  <line x1="8" y1="166" x2="192" y2="166" stroke="#cccccc" stroke-width="1.6"/>
  <!-- labels -->
  <text x="48" y="38" font-size="14" fill="#cb202d">70 mm: 89.1 N·m</text>
  <text x="190" y="60" font-size="14" fill="#cb202d" text-anchor="end">peak 87 N·m</text>
  <text x="64" y="86" font-size="14" fill="#cb202d" text-anchor="end">h = 0</text>
  <text x="64" y="102" font-size="14" fill="#cb202d" text-anchor="end">79.45 mm</text>
  <text x="152" y="131" font-size="14" fill="#333333" text-anchor="end">110 mm: 80.1 N·m</text>
  <text x="104" y="157" font-size="14" fill="#333333" text-anchor="middle">tool clearance (mm)</text>
</svg>
