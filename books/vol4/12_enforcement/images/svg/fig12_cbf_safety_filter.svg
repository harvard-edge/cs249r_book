<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#A51C30"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#008080"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D3748"/>
    </marker>
    
    <!-- Patterns -->
    <pattern id="hatch-red" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#A51C30" stroke-width="2" opacity="0.2"/>
    </pattern>
    <pattern id="hatch-blue" width="10" height="10" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1F407A" stroke-width="2" opacity="0.1"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #2D3748; }
    .label { font-family: sans-serif; font-size: 14px; fill: #2D3748; }
    .math { font-family: serif; font-size: 16px; font-style: italic; fill: #2D3748; }
    .math-bold { font-family: serif; font-size: 16px; font-weight: bold; font-style: italic; fill: #2D3748; }
    
    .axis { stroke: #2D3748; stroke-width: 1.5; }
    .grid { stroke: #E2E8F0; stroke-width: 1; }
    
    .boundary-physical { stroke: #A51C30; stroke-width: 3; fill: none; }
    .boundary-inset { stroke: #1F407A; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
    
    .vec-nom { stroke: #A51C30; stroke-width: 3; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-red); }
    .vec-safe { stroke: #008080; stroke-width: 3; fill: none; marker-end: url(#arrow-teal); }
    .vec-clip { stroke: #2D3748; stroke-width: 2; stroke-dasharray: 2,2; fill: none; marker-end: url(#arrow-dark); }
    .vec-proj { stroke: #1F407A; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-blue); }
  </style>

  <!-- Panel A: State Space Invariance -->
  <text x="250" y="40" text-anchor="middle" class="title">(a) State Space Invariance (X)</text>
  
  <g transform="translate(50, 70)">
    <!-- Safe / Unsafe Regions -->
    <!-- Unsafe region (bottom right) -->
    <path d="M 0 350 Q 200 200 350 0 L 400 0 L 400 400 L 0 400 Z" fill="url(#hatch-red)"/>
    <text x="320" y="320" class="label" fill="#A51C30" font-weight="bold">Forbidden Set</text>
    <text x="320" y="340" class="math" fill="#A51C30">h(x) &lt; 0</text>
    
    <!-- Physical Boundary -->
    <path fill="none" d="M -50 380 Q 200 200 380 -50" class="boundary-physical"/>
    <text x="330" y="25" class="math" fill="#A51C30">&#x2202;C</text>
    
    <!-- Inset Boundary -->
    <!-- Offset by roughly 50px normal -->
    <path fill="none" d="M -90 340 Q 150 150 340 -90" class="boundary-inset"/>
    <text x="210" y="40" class="math" fill="#1F407A">Inset Boundary</text>
    
    <!-- Margin notation -->
    <line x1="220" y1="120" x2="260" y2="160" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow-dark)" marker-start="url(#arrow-dark)"/>
    <text x="260" y="130" class="math">&#x03B4;<tspan font-size="10" dy="5">margin</tspan></text>
    
    <!-- State Point x -->
    <!-- Let's say x is at (150, 150) on the inset boundary -->
    <circle cx="150" cy="150" r="5" fill="#2D3748"/>
    <text x="135" y="145" class="math">x</text>
    
    <!-- Nominal Vector -->
    <!-- Pointing into forbidden set -->
    <line x1="150" y1="150" x2="250" y2="250" class="vec-nom"/>
    <text x="265" y="260" class="math" fill="#A51C30">f(x, u<tspan font-size="10" dy="5">nom</tspan>)</text>
    
    <!-- Tangent Filtered Vector -->
    <!-- Parallel to the inset boundary at (150, 150) -->
    <!-- Q curve tangent at (150, 150) is roughly 45 degrees, so vector goes up-right: (150+120, 150-120) = (270, 30) -->
    <line x1="150" y1="150" x2="260" y2="40" class="vec-safe"/>
    <text x="275" y="45" class="math" fill="#008080">f(x, u<tspan font-size="10" dy="-5">&#x22C6;</tspan>)</text>
    
    <!-- Safe Set label -->
    <text x="60" y="300" class="label" fill="#1F407A" font-weight="bold">Safe Set C</text>
    <text x="60" y="320" class="math" fill="#1F407A">h(x) &#x2265; 0</text>
  </g>

  <!-- Divider Line -->
  <line x1="500" y1="20" x2="500" y2="480" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Panel B: Control Input Space (U) -->
  <text x="750" y="40" text-anchor="middle" class="title">(b) Control Input Space (U)</text>
  
  <g transform="translate(550, 70)">
    <!-- Origin at (50, 330) -> u1, u2 space -->
    <!-- Scale: 1 unit = 60 px -->
    <!-- u1 + 2 u2 = 5 -->
    <!-- u2 = 2.5 - 0.5 u1 -->
    <!-- Intercepts: (5, 0) and (0, 2.5) -->
    <!-- In px: (5*60, 0) = (300, 0) rel to origin -->
    <!-- (0, 2.5*60) = (0, -150) rel to origin -->
    <!-- Let's draw grid -->
    <g class="grid">
      <line x1="50" y1="30" x2="50" y2="330"/>
      <line x1="110" y1="30" x2="110" y2="330"/>
      <line x1="170" y1="30" x2="170" y2="330"/>
      <line x1="230" y1="30" x2="230" y2="330"/>
      <line x1="290" y1="30" x2="290" y2="330"/>
      <line x1="350" y1="30" x2="350" y2="330"/>
      <line x1="50" y1="330" x2="400" y2="330"/>
      <line x1="50" y1="270" x2="400" y2="270"/>
      <line x1="50" y1="210" x2="400" y2="210"/>
      <line x1="50" y1="150" x2="400" y2="150"/>
      <line x1="50" y1="90" x2="400" y2="90"/>
      <line x1="50" y1="30" x2="400" y2="30"/>
    </g>
    
    <!-- Admissible region (shaded) -->
    <!-- The line is u1 + 2 u2 = 5. Point (0, 2.5) is (50, 180). Point (5, 0) is (350, 330). -->
    <!-- Valid region is u1 + 2 u2 <= 5, so below/left of the line -->
    <polygon points="50,330 350,330 50,180" fill="url(#hatch-blue)"/>
    
    <!-- Axes -->
    <line x1="50" y1="330" x2="400" y2="330" class="axis" marker-end="url(#arrow-dark)"/>
    <text x="390" y="350" class="math">u<tspan font-size="10" dy="5">1</tspan></text>
    
    <line x1="50" y1="330" x2="50" y2="30" class="axis" marker-end="url(#arrow-dark)"/>
    <text x="30" y="40" class="math">u<tspan font-size="10" dy="5">2</tspan></text>
    
    <!-- CBF Boundary Line -->
    <!-- Passes through (0, 2.5) -> (50, 180) and (5, 0) -> (350, 330) -->
    <!-- Extended: u1=-1, u2=3 -> x=50-60=-10, y=330-180=150 -->
    <line x1="10" y1="160" x2="390" y2="350" stroke="#1F407A" stroke-width="3"/>
    <text x="310" y="290" class="math" fill="#1F407A">a<tspan font-size="10" dy="-5">T</tspan><tspan dy="5">u = b</tspan></text>
    
    <!-- Vectors -->
    <!-- Origin: (50, 330) -->
    <!-- u_nom = [4.0, 3.0] -> x=50+240=290, y=330-180=150 -->
    <line x1="50" y1="330" x2="290" y2="150" class="vec-nom"/>
    <circle cx="290" cy="150" r="4" fill="#A51C30"/>
    <text x="300" y="145" class="math" fill="#A51C30">u<tspan font-size="10" dy="5">nom</tspan></text>
    
    <!-- u_star = [3.0, 1.0] -> x=50+180=230, y=330-60=270 -->
    <line x1="50" y1="330" x2="230" y2="270" class="vec-safe"/>
    <circle cx="230" cy="270" r="4" fill="#008080"/>
    <text x="240" y="275" class="math" fill="#008080">u<tspan font-size="10" dy="-5">&#x22C6;</tspan></text>
    
    <!-- Projection line (u_nom to u_star) -->
    <line x1="290" y1="150" x2="230" y2="270" class="vec-proj"/>
    <text x="265" y="215" class="math" fill="#1F407A">&#x0394;u</text>
    
    <!-- u_clip = [3.5, 2.0] -> x=50+210=260, y=330-120=210 -->
    <!-- Wait, caption says u_clip = [3.5, 2.0]^T N*m -->
    <line x1="50" y1="330" x2="260" y2="210" class="vec-clip"/>
    <circle cx="260" cy="210" r="4" fill="#2D3748"/>
    <text x="270" y="215" class="math" fill="#2D3748">u<tspan font-size="10" dy="5">clip</tspan></text>
    
    <!-- Clipping lines from u_nom to u_clip -->
    <!-- Heuristic scalar clipping cuts u1 from 4.0 to 3.5, u2 from 3.0 to 2.0 -->
    <line x1="290" y1="150" x2="260" y2="150" stroke="#2D3748" stroke-dasharray="2,2" stroke-width="1"/>
    <line x1="260" y1="150" x2="260" y2="210" stroke="#2D3748" stroke-dasharray="2,2" stroke-width="1"/>
    
    <!-- Orthogonal angle symbol -->
    <!-- vector a = [1, 2] -> angle of line is dx=2, dy=-1 (in screen space dx=60*2=120, dy=60*1=60... wait. -->
    <!-- line passes through (230, 270) and (230-60*2, 270-60*(-1)) = (110, 330). -->
    <!-- vector along line is (120, -60) -> (2, -1) -->
    <!-- normal vector is (1, 2) -> (60, -120) -->
    <!-- Yes, from (230, 270) to (290, 150) is exactly dx=60, dy=-120! -->
    <!-- Let's draw a right angle at u_star (230, 270) -->
    <!-- L1 goes along line towards bottom-right: dx=10, dy=5 -->
    <!-- L2 goes along normal towards top-right: dx=5, dy=-10 -->
    <path d="M 235 260 L 245 265 L 240 275" fill="none" stroke="#1F407A" stroke-width="1.5"/>
  </g>
</svg>
