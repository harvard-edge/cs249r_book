<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-dark-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 Z" fill="#334155"/>
    </marker>
    
    <!-- Patterns -->
    <pattern id="hatch-red" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#dc2626" stroke-width="2" opacity="0.15"/>
    </pattern>
    <pattern id="hatch-blue" width="10" height="10" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2563eb" stroke-width="2" opacity="0.1"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #334155; }
    .label-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .math { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-style: italic; fill: #1e293b; }
    
    .axis { stroke: #334155; stroke-width: 1.5; }
    .grid { stroke: #f1f5f9; stroke-width: 1; }
    
    .boundary-physical { stroke: #dc2626; stroke-width: 2.5; fill: none; }
    .boundary-inset { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
    
    .vec-nom { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-red); }
    .vec-safe { stroke: #16a34a; stroke-width: 2.5; fill: none; marker-end: url(#arrow-emerald); }
    .vec-clip { stroke: #475569; stroke-width: 2; stroke-dasharray: 2,2; fill: none; marker-end: url(#arrow-dark); }
    .vec-proj { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-blue); }
  </style>

  <rect width="1000" height="500" fill="#ffffff" />

  <!-- Panel A: State Space Invariance -->
  <text x="250" y="36" text-anchor="middle" class="title">(a) State Space Invariance (X)</text>
  
  <g transform="translate(50, 70)">
    <!-- Safe / Unsafe Regions -->
    <!-- Unsafe region (bottom right) -->
    <path d="M 0 350 Q 200 200 350 0 L 400 0 L 400 400 L 0 400 Z" fill="url(#hatch-red)"/>
    <text x="320" y="320" class="label-bold" fill="#dc2626">Forbidden Set</text>
    <text x="320" y="340" class="math" fill="#dc2626" font-style="normal">h(x) &lt; 0</text>
    
    <!-- Physical Boundary clipped cleanly within panel -->
    <path fill="none" d="M 0 350 Q 185 185 340 30" class="boundary-physical"/>
    <rect x="330" y="20" width="30" height="20" rx="3" fill="#ffffff" />
    <text x="335" y="35" class="math" fill="#dc2626" font-weight="700">∂C</text>
    
    <!-- Inset Boundary clipped cleanly within panel -->
    <path fill="none" d="M -20 290 Q 140 140 290 -10" class="boundary-inset"/>
    <rect x="190" y="2" width="100" height="18" rx="3" fill="#ffffff" />
    <text x="240" y="15" class="math" fill="#2563eb" font-size="12" font-style="normal" text-anchor="middle">Inset Boundary</text>
    
    <!-- Margin notation with clean double-arrow -->
    <line x1="222" y1="122" x2="258" y2="158" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-dark)" marker-start="url(#arrow-dark-rev)"/>
    <rect x="268" y="120" width="56" height="18" rx="2" fill="#ffffff" />
    <text x="270" y="134" class="math" fill="#334155" font-size="12">δ<tspan font-size="10" dy="3">margin</tspan></text>
    
    <!-- State Point x (with background mask) -->
    <circle cx="150" cy="150" r="5" fill="#0f172a"/>
    <rect x="126" y="128" width="18" height="18" rx="2" fill="#ffffff" opacity="0.95"/>
    <text x="135" y="142" class="label-bold" text-anchor="middle">x</text>
    
    <!-- Nominal Vector Pointing into forbidden set -->
    <line x1="150" y1="150" x2="250" y2="250" class="vec-nom"/>
    <rect x="260" y="250" width="70" height="20" rx="2" fill="#ffffff" />
    <text x="262" y="265" class="math" fill="#dc2626">f(x, u<tspan font-size="10" dy="3">nom</tspan>)</text>
    
    <!-- Tangent Filtered Vector -->
    <line x1="150" y1="150" x2="260" y2="40" class="vec-safe"/>
    <rect x="268" y="32" width="60" height="20" rx="2" fill="#ffffff" />
    <text x="270" y="47" class="math" fill="#16a34a">f(x, u*)</text>
    
    <!-- Safe Set label -->
    <text x="60" y="300" class="label-bold" fill="#2563eb">Safe Set C</text>
    <text x="60" y="320" class="math" fill="#2563eb" font-style="normal">h(x) ≥ 0</text>
  </g>

  <!-- Divider Line -->
  <line x1="500" y1="20" x2="500" y2="480" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Panel B: Control Input Space (U) -->
  <text x="750" y="36" text-anchor="middle" class="title">(b) Control Input Space (U)</text>
  
  <g transform="translate(550, 70)">
    <!-- Grid -->
    <g class="grid">
      <line x1="50" y1="30" x2="50" y2="330"/>
      <line x1="110" y1="30" x2="110" y2="330"/>
      <line x1="170" y1="30" x2="170" y2="330"/>
      <line x1="230" y1="30" x2="230" y2="330"/>
      <line x1="290" y1="30" x2="290" y2="330"/>
      <line x1="350" y1="30" x2="350" y2="330"/>
      <line x1="50" y1="330" x2="400" y2="330"/>
      <line x1="50" y1="270" x2="400" y2="270"/>
      <line x1="50" y1="210" x2="400" y2="210"/>
      <line x1="50" y1="150" x2="400" y2="150"/>
      <line x1="50" y1="90" x2="400" y2="90"/>
      <line x1="50" y1="30" x2="400" y2="30"/>
    </g>
    
    <!-- Admissible region (shaded) -->
    <polygon points="50,330 350,330 50,180" fill="url(#hatch-blue)"/>
    
    <!-- Axes with clear labels -->
    <line x1="50" y1="330" x2="405" y2="330" class="axis" marker-end="url(#arrow-dark)"/>
    <text x="415" y="334" class="label-bold">u₁</text>
    
    <line x1="50" y1="330" x2="50" y2="25" class="axis" marker-end="url(#arrow-dark)"/>
    <text x="32" y="25" class="label-bold">u₂</text>
    
    <!-- CBF Boundary Line (extended to 370, 340 so it terminates before u1 axis label) -->
    <line x1="10" y1="160" x2="370" y2="340" stroke="#1e3a8a" stroke-width="2.5"/>
    <rect x="305" y="278" width="65" height="18" rx="2" fill="#ffffff" />
    <text x="310" y="291" class="label-bold" fill="#1e3a8a" font-size="12">aᵀu = b</text>
    
    <!-- Vectors -->
    <!-- Origin: (50, 330) -->
    <!-- u_nom = [4.0, 3.0] -> x=290, y=150 -->
    <line x1="50" y1="330" x2="290" y2="150" class="vec-nom"/>
    <circle cx="290" cy="150" r="4" fill="#dc2626"/>
    <rect x="300" y="138" width="45" height="18" rx="2" fill="#ffffff" />
    <text x="302" y="152" class="math" fill="#dc2626" font-weight="700">u<tspan font-size="10" dy="3">nom</tspan></text>
    
    <!-- u_star = [3.0, 1.0] -> x=230, y=270 -->
    <line x1="50" y1="330" x2="230" y2="270" class="vec-safe"/>
    <circle cx="230" cy="270" r="4" fill="#16a34a"/>
    <rect x="236" y="278" width="30" height="18" rx="2" fill="#ffffff" />
    <text x="238" y="291" class="math" fill="#16a34a" font-weight="700">u*</text>
    
    <!-- Projection line (u_nom to u_star) with clean masked label -->
    <line x1="290" y1="150" x2="230" y2="270" class="vec-proj"/>
    <rect x="248" y="196" width="30" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="263" y="210" class="label-bold" fill="#2563eb" font-size="12" text-anchor="middle">Δu</text>
    
    <!-- u_clip = [3.5, 2.0] -> x=260, y=210 -->
    <line x1="50" y1="330" x2="260" y2="210" class="vec-clip"/>
    <circle cx="260" cy="210" r="4" fill="#475569"/>
    <rect x="272" y="214" width="40" height="18" rx="2" fill="#ffffff" />
    <text x="274" y="227" class="math" fill="#475569">u<tspan font-size="10" dy="3">clip</tspan></text>
    
    <!-- Clipping lines from u_nom to u_clip -->
    <line x1="290" y1="150" x2="260" y2="150" stroke="#64748b" stroke-dasharray="2,2" stroke-width="1"/>
    <line x1="260" y1="150" x2="260" y2="210" stroke="#64748b" stroke-dasharray="2,2" stroke-width="1"/>
    
    <!-- Orthogonal angle symbol placed neatly outside arrowhead -->
    <path d="M 239 252 L 247 256 L 243 266" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  </g>
</svg>
