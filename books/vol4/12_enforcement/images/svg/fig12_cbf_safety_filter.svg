<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect data-bgcover="1" x="-50.0" y="-24.0" width="1100.0" height="528.0" fill="#ffffff"/>
  <defs>
    <!-- Arrowheads -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-dark-rev" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" fill="#FFFFFF"/>

  <!-- Panel Titles -->
  <text x="250" y="32" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">(a) Schematic Viable Boundary</text>
  <text x="750" y="32" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">(b) Control Space Projection</text>

  <!-- Panel Divider -->
  <line x1="500" y1="20" x2="500" y2="460" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ==================================================================== -->
  <!-- PANEL (a): STATE SPACE INVARIANCE                                    -->
  <!-- ==================================================================== -->
  <g transform="translate(50, 60)">
    <!-- Safe Set polygon (top-left) -->
    <path d="M 0 0 L 400 0 L 400 400 L 0 400 Z" fill="#F0FDF4" opacity="0.6"/>
    <!-- Forbidden Set polygon (bottom-right of boundary) -->
    <path d="M 0 350 Q 185 185 350 0 L 400 0 L 400 400 L 0 400 Z" fill="#FEF2F2" opacity="0.9"/>

    <!-- Safe Set Label -->
    <text x="50" y="80" font-size="12" font-weight="700" fill="#059669">Viable Set C</text>

    <!-- Forbidden Set Label -->
    <text x="320" y="340" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">Forbidden Set</text>

    <!-- Physical Boundary ∂C -->
    <path d="M 0 350 Q 185 185 350 0" fill="none" stroke="#DC2626" stroke-width="2"/>
    <rect x="332" y="20" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="346" y="33" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">∂C</text>

    <!-- Inset Boundary -->
    <path d="M -15 285 Q 140 140 285 -15" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="6,4"/>
    <rect x="175" y="6" width="95" height="18" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
    <text x="222" y="19" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">Inset Boundary</text>

    <!-- Margin Indicator -->
    <line x1="220" y1="120" x2="256" y2="156" stroke="#334155" stroke-width="1.3" marker-start="url(#arr-dark-rev)" marker-end="url(#arr-dark)"/>
    <rect x="264" y="128" width="22" height="18" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.7"/>
    <text x="275" y="141" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">δ</text>

    <!-- State Point x -->
    <circle cx="150" cy="150" r="4.5" fill="#0F172A"/>
    <rect x="126" y="132" width="18" height="18" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.7"/>
    <text x="135" y="145" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">x</text>

    <!-- Nominal Unsafe Vector f(x, u_nom) -->
    <line x1="150" y1="150" x2="248" y2="248" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
    <rect x="254" y="250" width="75" height="18" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="291" y="263" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">f(x, u<tspan baseline-shift="sub" font-size="78%">nom</tspan>)</text>

    <!-- Deflected Tangent Vector f(x, u*) -->
    <line x1="150" y1="150" x2="258" y2="42" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-green)"/>
    <rect x="264" y="32" width="52" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="290" y="45" font-size="10.5" font-weight="600" fill="#059669" text-anchor="middle">f(x, u*)</text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL (b): CONTROL INPUT SPACE                                       -->
  <!-- ==================================================================== -->
  <g transform="translate(550, 60)">
    <!-- Grid -->
    <g stroke="#F1F5F9" stroke-width="1">
      <line x1="50" y1="30" x2="50" y2="330"/>
      <line x1="110" y1="30" x2="110" y2="330"/>
      <line x1="170" y1="30" x2="170" y2="330"/>
      <line x1="230" y1="30" x2="230" y2="330"/>
      <line x1="290" y1="30" x2="290" y2="330"/>
      <line x1="350" y1="30" x2="350" y2="330"/>
      <line x1="50" y1="330" x2="400" y2="330"/>
      <line x1="50" y1="270" x2="400" y2="270"/>
      <line x1="50" y1="210" x2="400" y2="210"/>
      <line x1="50" y1="150" x2="400" y2="150"/>
      <line x1="50" y1="90" x2="400" y2="90"/>
      <line x1="50" y1="30" x2="400" y2="30"/>
    </g>

    <!-- Admissible Control Half-Space polygon: 2*u1 + u2 <= 5 -->
    <polygon points="50,330 200,330 50,30" fill="#EFF6FF" opacity="0.75"/>

    <!-- Axes -->
    <line x1="50" y1="330" x2="405" y2="330" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>
    <text x="416" y="334" font-size="11" font-weight="700" fill="#334155">u₁</text>

    <line x1="50" y1="330" x2="50" y2="25" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-dark)"/>
    <text x="32" y="25" font-size="11" font-weight="700" fill="#334155">u₂</text>

    <!-- Hyperplane aᵀu = b (2*u1 + u2 = 5) -->
    <line x1="38" y1="6" x2="218" y2="366" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="70" y="55" width="62" height="18" rx="3" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="0.8"/>
    <text x="101" y="68" font-size="10.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">aᵀu = b</text>

    <!-- Vector: u_nom (3.5, 3.0) -->
    <line x1="50" y1="330" x2="260" y2="150" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
    <circle cx="260" cy="150" r="4" fill="#DC2626"/>
    <rect x="270" y="140" width="48" height="18" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="294" y="153" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="middle">u<tspan baseline-shift="sub" font-size="78%">nom</tspan></text>

    <!-- Vector: u* (QP Projection: 1.5, 2.0) -->
    <line x1="50" y1="330" x2="140" y2="210" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-green)"/>
    <circle cx="140" cy="210" r="4" fill="#059669"/>
    <rect x="94" y="222" width="28" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="108" y="235" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">u*</text>

    <!-- Minimal Intervention Projection Line Δu -->
    <line x1="260" y1="150" x2="140" y2="210" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="4,4"/>
    <rect x="204" y="165" width="26" height="18" rx="2" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8"/>
    <text x="217" y="178" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Δu</text>

    <!-- Heuristic Clipped Vector u_clip (2.0, 3.0) -->
    <line x1="50" y1="330" x2="170" y2="150" stroke="#475569" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arr-dark)"/>
    <circle cx="170" cy="150" r="3.5" fill="#475569"/>
    <rect x="150" y="122" width="40" height="18" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="170" y="135" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">u<tspan baseline-shift="sub" font-size="78%">clip</tspan></text>

    <!-- Component Clamping Guide from u_nom to u_clip -->
    <line x1="260" y1="150" x2="170" y2="150" stroke="#94A3B8" stroke-dasharray="2,2" stroke-width="1.2"/>

    <!-- Orthogonal symbol at u* -->
    <path d="M 144 219 L 153 214 L 149 206" fill="none" stroke="#2563EB" stroke-width="1.4"/>
  </g>
</svg>