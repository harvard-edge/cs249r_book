<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-down-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .rung-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
    .rung-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #334155; }
    .rung-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
  </style>

  <!-- Background -->
  <rect width="1000" height="490" fill="#ffffff" />
  <g transform="translate(0, -50)">

  <!-- Axes/Arrows -->
  <!-- Left downward arrow -->
  <line x1="130" y1="90" x2="130" y2="510" stroke="#334155" stroke-width="2" marker-end="url(#arrow-down)"/>
  <text x="110" y="300" text-anchor="middle" transform="rotate(-90 110 300)" class="axis-label">Failure Severity / Loss of Trust</text>
  <text x="148" y="300" text-anchor="middle" transform="rotate(-90 148 300)" class="axis-label" fill="#dc2626">Decreasing Reaction Latency (μs)</text>

  <!-- Right downward arrow -->
  <line x1="870" y1="90" x2="870" y2="510" stroke="#334155" stroke-width="2" marker-end="url(#arrow-down)"/>
  <text x="890" y="300" text-anchor="middle" transform="rotate(90 890 300)" class="axis-label">Increasing Mechanical Wear &amp; Stress</text>
  <text x="852" y="300" text-anchor="middle" transform="rotate(90 852 300)" class="axis-label" fill="#dc2626">Loss of Mission Context</text>

  <!-- Rung 1 -->
  <g transform="translate(225, 75)">
    <rect x="0" y="0" width="550" height="88" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="20" y="28" class="rung-title" fill="#1e40af">Rung 1: Active QP Projection (SLS/SLF)</text>
    <text x="20" y="52" class="rung-text">Sub-millisecond constraint projection. Keeps mission running.</text>
    <text x="20" y="72" class="rung-sub" fill="#1e40af">Substrate: Static MCU SRAM | Latency: &lt; 175 μs | Wear: Zero</text>
  </g>

  <!-- Rung 2 -->
  <g transform="translate(225, 185)">
    <rect x="0" y="0" width="550" height="88" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="20" y="28" class="rung-title" fill="#1e40af">Rung 2: Active Closed-Loop Hold (Category 2 / SS2)</text>
    <text x="20" y="52" class="rung-text">Dissipates energy as Joule heating. Preserves context.</text>
    <text x="20" y="72" class="rung-sub" fill="#475569">Substrate: Real-time RTOS | Latency: 2–5 ms | Wear: Electrical</text>
  </g>

  <!-- Rung 3 -->
  <g transform="translate(225, 295)">
    <rect x="0" y="0" width="550" height="88" rx="4" fill="#fff1f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="20" y="28" class="rung-title" fill="#dc2626">Rung 3: Controlled Dynamic Stop (Category 1 / SS1)</text>
    <text x="20" y="52" class="rung-text">Absorbs regenerative DC-bus energy. Task abort &amp; re-homing.</text>
    <text x="20" y="72" class="rung-sub" fill="#b91c1c">Substrate: Safety MCU Firmware | Latency: 10–20 ms | Wear: Regen load</text>
  </g>

  <!-- Rung 4 -->
  <g transform="translate(225, 405)">
    <rect x="0" y="0" width="550" height="88" rx="4" fill="#b91c1c" stroke="#991b1b" stroke-width="1.5"/>
    <text x="20" y="28" class="rung-title" fill="#ffffff" style="fill: #ffffff;">Rung 4: Hardware Safe Torque Off (Category 0 / STO)</text>
    <text x="20" y="52" class="rung-text" fill="#ffffff" style="fill: #ffffff;">Galvanic isolation &amp; mechanical friction brakes. Manual reset.</text>
    <text x="20" y="72" class="rung-sub" fill="#fee2e2" style="fill: #fee2e2;">Substrate: Hardware/Optical | Latency: &lt; 5 μs | Wear: Lining ablation</text>
  </g>

  <!-- Connecting Arrows Between Rungs -->
  <line x1="500" y1="163" x2="500" y2="183" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <line x1="500" y1="273" x2="500" y2="293" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <line x1="500" y1="383" x2="500" y2="403" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-down-red)"/>
  </g>
</svg>
