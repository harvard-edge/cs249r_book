<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#7f1d1d"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 6 4" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M 0 0 L 6 2 L 0 4 z" fill="#14532d"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="540" height="180" fill="#ffffff" rx="4" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Card Top Header -->
  <text x="16" y="15" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.2">DISTANCE AND KINETIC STOPPING BARRIERS</text>
  <text x="524" y="15" font-size="8" font-weight="500" fill="#64748b" text-anchor="end">Dynamics: mẍ = u (Relative Degree r = 2)</text>

  <!-- ==================================================================== -->
  <!-- SUB-CARD 1: NAIVE POSITION BARRIER r=1 (LEFT)                        -->
  <!-- ==================================================================== -->
  <rect x="16" y="22" width="248" height="146" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

  <!-- Sub-card Header & State Pill -->
  <text x="26" y="37" font-size="9" font-weight="700" fill="#1e293b">(a) Raw distance: relative degree 2</text>
  <rect x="180" y="27" width="74" height="14" rx="7" fill="#f9d6d5" stroke="#c44" stroke-width="0.75"/>
  <text x="217" y="37.5" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">NO TORQUE IN ḋ</text>

  <!-- Barrier Equation Subtitle -->
  <text x="26" y="52" font-size="7.5" font-weight="600" fill="#334155">Evaluates Spatial Clearance: h(x) = x_wall - x ≥ 0</text>

  <!-- Trajectory Diagram Canvas -->
  <g transform="translate(26, 56)">
    <rect x="0" y="0" width="228" height="66" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>

    <!-- Forbidden Set (Wall onwards: x=140 to 228) -->
    <rect x="140" y="0" width="88" height="66" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.5"/>
    <line x1="140" y1="0" x2="140" y2="66" stroke="#c44" stroke-width="1.5"/>

    <!-- Labels above track -->
    <text x="70" y="12" font-size="7.5" font-weight="700" fill="#059669" text-anchor="middle">Safe Set C_geom</text>
    <text x="184" y="12" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Forbidden Set (Wall)</text>

    <!-- Moving mass approaching wall -->
    <circle cx="16" cy="30" r="5" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/>
    <text x="16" y="32.5" font-size="6.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">m</text>

    <!-- Velocity vector v0 -->
    <line x1="23" y1="30" x2="55" y2="30" stroke="#1e3a8a" stroke-width="1.3" marker-end="url(#arr-blue)"/>
    <text x="39" y="23" font-size="6.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">v₀ (Cruise)</text>

    <!-- Coasting path to wall -->
    <line x1="55" y1="30" x2="140" y2="30" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Late Braking Trigger Marker at Wall -->
    <circle cx="140" cy="30" r="2.5" fill="#c44"/>
    <text x="136" y="42" font-size="6.5" font-weight="700" fill="#c44" text-anchor="end">Brakes at h = 0</text>

    <!-- Penetration Overshoot Trajectory into Wall -->
    <line x1="140" y1="30" x2="200" y2="30" stroke="#7f1d1d" stroke-width="1.8" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>
    <circle cx="202" cy="30" r="2.5" fill="#7f1d1d"/>
    <text x="171" y="24" font-size="6.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">+Δd Overshoot</text>

    <!-- Impact banner at bottom -->
    <rect x="144" y="46" width="80" height="15" rx="2" fill="#f9d6d5" stroke="#c44" stroke-width="0.5"/>
    <text x="184" y="56.5" font-size="6.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">CRASH: Δd = v₀²/2a</text>

    <!-- Boundary coordinate label -->
    <text x="136" y="60" font-size="6.5" font-weight="700" fill="#64748b" text-anchor="end">x_wall (∂C)</text>
  </g>

  <!-- Sub-card 1 Bottom Result Note -->
  <rect x="26" y="126" width="228" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="32" y="138" font-size="7.5" font-weight="600" fill="#1e293b">Failure: <tspan font-weight="700" fill="#7f1d1d">Torque commands acceleration, not velocity (r = 2).</tspan></text>
  <text x="32" y="150" font-size="7.5" font-weight="500" fill="#7f1d1d">Braking at boundary overshoots by kinetic stopping distance Δd.</text>

  <!-- ==================================================================== -->
  <!-- SUB-CARD 2: KINETIC INSET BARRIER r=2 (RIGHT)                       -->
  <!-- ==================================================================== -->
  <rect x="276" y="22" width="248" height="146" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/>

  <!-- Sub-card Header & State Pill -->
  <text x="286" y="37" font-size="9" font-weight="700" fill="#1e293b">(b) Kinetic h: relative degree 1</text>
  <rect x="436" y="27" width="78" height="14" rx="7" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.75"/>
  <text x="475" y="37.5" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">CONDITIONAL</text>

  <!-- Barrier Equation Subtitle -->
  <text x="286" y="52" font-size="7.5" font-weight="600" fill="#334155">Embeds Stopping Distance: h₂(x, v) = (x_wall - x) - v²/(2a) ≥ 0</text>

  <!-- Trajectory Diagram Canvas -->
  <g transform="translate(286, 56)">
    <rect x="0" y="0" width="228" height="66" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>

    <!-- Kinetic Inset Braking Zone (x=115 to 180 = 65px = Δd) -->
    <rect x="115" y="0" width="65" height="66" fill="#f0fdf4" stroke="#86efac" stroke-width="0.5"/>

    <!-- Forbidden Set (Wall onwards: x=180 to 228) -->
    <rect x="180" y="0" width="48" height="66" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="66" stroke="#c44" stroke-width="1.5"/>

    <!-- Viability Boundary Line (x=115) -->
    <line x1="115" y1="0" x2="115" y2="66" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Labels above track -->
    <text x="58" y="12" font-size="7.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Viability Kernel C_v</text>
    <text x="147" y="12" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">Kinetic Inset Δd</text>
    <text x="204" y="12" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Wall</text>

    <!-- Moving mass approaching viability boundary -->
    <circle cx="16" cy="30" r="5" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/>
    <text x="16" y="32.5" font-size="6.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">m</text>

    <!-- Velocity vector v0 -->
    <line x1="23" y1="30" x2="55" y2="30" stroke="#1e3a8a" stroke-width="1.3" marker-end="url(#arr-blue)"/>
    <text x="39" y="23" font-size="6.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">v₀ (Cruise)</text>

    <!-- Coasting path to viability boundary -->
    <line x1="55" y1="30" x2="115" y2="30" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Early Braking Trigger Marker at Viability Boundary -->
    <circle cx="115" cy="30" r="2.5" fill="#1e3a8a"/>
    <text x="111" y="42" font-size="6.5" font-weight="700" fill="#1e3a8a" text-anchor="end">Brakes at ∂C_v</text>

    <!-- Controlled Deceleration Trajectory through Inset Buffer -->
    <line x1="115" y1="30" x2="178" y2="30" stroke="#14532d" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <circle cx="180" cy="30" r="2.5" fill="#14532d"/>
    <text x="147" y="24" font-size="6.5" font-weight="700" fill="#14532d" text-anchor="middle">u* = -u_max</text>

    <!-- Safe tangent arrest banner at bottom (inside inset zone) -->
    <rect x="119" y="46" width="58" height="15" rx="2" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.5"/>
    <text x="148" y="56.5" font-size="6.5" font-weight="700" fill="#14532d" text-anchor="middle">v = 0 (Safe)</text>

    <!-- Coordinate labels at bottom -->
    <text x="111" y="60" font-size="6.5" font-weight="700" fill="#1e3a8a" text-anchor="end">x_viable</text>
    <text x="184" y="60" font-size="6.5" font-weight="700" fill="#64748b" text-anchor="start">x_wall (∂C)</text>
  </g>

  <!-- Sub-card 2 Bottom Result Note -->
  <rect x="286" y="126" width="228" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="292" y="138" font-size="7.5" font-weight="600" fill="#1e293b">Condition: <tspan font-weight="700" fill="#14532d">Safe set contracted to viability kernel: C_v ⊂ C_geom.</tspan></text>
  <text x="292" y="150" font-size="7.5" font-weight="500" fill="#14532d">Brake before the wall if model, delay, and torque bounds hold.</text>

</svg>
