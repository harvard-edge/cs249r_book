  claims:
    Stopping envelope: The stopping envelope is the set of states from which the resident stop, after every worst-case
      delay, halts before the obstacle with localization, protective, and tracking margins intact, and its seven
      priced rows run as a per-tick speed governor.
    Kinetic barrier: A control barrier function makes its safe set forward invariant only if every admitted input
      keeps hdot >= -alpha(h), and a barrier on raw distance has relative degree two in torque, so the barrier must
      carry the cost to stop.
    Minimal-intervention filter: A least-change projection passes a safe proposal untouched and projects a violating
      one onto the barrier boundary, keeping learned competence, while a structurally invalid proposal is vetoed
      rather than corrected.
    Contact margins: When contact is the task the kinetic barrier admits only zero speed, so an energy-tank passivity
      barrier and a separately qualified force channel replace clearance as the margin.
    Invariance premises and timing: A barrier guarantee holds only under model fidelity, bounded disturbance, actuation
      within a qualified effort error and delay, solver completion inside its budget, and a sample period short
      enough for inter-sample drift, each watched at runtime.
    State-matched fallback ladder: An arbiter selects directly among project, hold, controlled stop, and torque
      inhibit by the check that failed and the measured plant state, before the admissible set empties, so one trigger
      can select different rungs in motion and at standstill.
    Certified floor beneath an unrated layer: The formal protective claim rests on certified drive, scanner, and
      arm safety functions beneath the permission path, which is an unrated performance layer, with only the lease
      and heartbeat watchdog selected for a rating.
    Enforcement record: The enforcement record joins a signed enforcement contract (tracking bound, barrier coefficients,
      deadlines, effort-error bounds, routing) to a per-tick admitted command with its margin, detector, and rung.
    Recoverable set: The stopping envelope is the machine's recoverable set, the states from which the resident
      stop still succeeds, and the viable set and barrier safe set are drawings of it.
    Tracking bound: The feedback tracker guarantees a worst-case tracking tube only inside its qualified envelope,
      so the enforcer insets every clearance by it and watches the premises that keep it true.
    Net braking authority: Available deceleration is net of gravity and bias in the worst direction, and integrator
      unwinding and saturation spend it before the stop begins.
    Speed and separation monitoring: Speed and separation monitoring keeps a protective separation distance (the
      person's travel, the robot's reaction and stopping travel, intrusion distance, and position uncertainties)
      between a moving arm and a person as a certified function.
    Human separation distance: The pedestrian intrusion distance v_h(tau + T_stop) sets how much clearance a walking
      person consumes during the stop, which bounds the walking-person speed ceiling.
    Functional-safety integrity grading: Safety functions, not components, are graded by SIL or by a Performance
      Level that combines category, MTTFd, diagnostic coverage, and common-cause defenses; the standards set the
      required level for each function of this machine, and only the functions selected for a rating carry the formal
      claim.
    Passive-compliance stiffness: A series compliance, whose stiffness falls below that of its softer element because
      compliances add, slows the force rise and bounds impact force passively when the enforcer cannot stop in time,
      so its stiffness is part of the contact margin.
