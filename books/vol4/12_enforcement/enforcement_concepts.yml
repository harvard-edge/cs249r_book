    relationships:
    - id: vol4.field.enforcement-filter--motion-trajectory
      source: vol4.enforcement.filter
      predicate: restricts proposed
      target: vol4.motion.trajectory
      explanation: The runtime filter projects or refuses proposed controls that violate its modeled admissible
        constraints.
      conditions: Containment is conditional on feasible constraints, plant and sensing bounds, tracking,
        and bounded sample-and-actuation timing.
      status: draft
      evidence:
        section: sec-enforcement-minimal-intervention
        quote: 'The rows of @tbl-12-safety-filter-architectures belong to one unified family rather than
          rival techniques [@hsu2024safetyfilter]: each filter monitors a candidate against a **fallback
          policy**\index{Fallback policy!safety filter} known to keep the machine safe and intervenes whenever
          the candidate would leave the set from which that fallback still works, differing only in how
          the intervention occurs. Whereas a **least-restrictive**\index{Safety filter!least-restrictive}
          filter passes the proposal untouched up to the boundary and then switches abruptly to the fallback
          (which is simple to implement but chatters along the boundary), a smooth filter such as the CBF-QP
          blends in a correction before the boundary is reached. This chapter''s enforcer combines both
          mechanisms: admitting a trajectory only with a matched stop suffix and holding a state-matched
          fallback for every reachable state forms a **backup-set filter**\index{Backup-set filter} that
          checks safety by rolling the fallback forward from the proposed state [@gurriet2018online; @chen2021backup].
          The per-tick CBF-QP acts as the smooth local filter layered on top of it, and HJ reachability
          [@fisac2019general] supplies the value function when a precomputed surface replaces a closed-form
          barrier.'
    - id: vol4.field.enforcement-filter--enforcement-envelope
      source: vol4.enforcement.filter
      predicate: conditionally preserves
      target: vol4.enforcement.envelope
      explanation: A barrier-based filter can support forward invariance only while its feasibility, model,
        sensing, and timing premises hold.
      conditions: The listed premises are necessary for this design, not a universal sufficient safety theorem;
        an empty feasible set ends the modeled guarantee.
      status: draft
      evidence:
        section: sec-enforcement-invariance-conditions
        quote: 'Unmodeled friction loss, actuator saturation, solver overruns, or inter-sample drift under
          a held torque command can each push a physical plant across a barrier boundary even when the continuous-time
          inequality is satisfied at the sample instant. The containment claim provided by both spatial
          and energetic barrier calculations is therefore strictly conditional. A forward-invariance claim
          requires a feasible barrier and the following bounded conditions; the list is necessary for this
          design, not an exhaustive if-and-only-if test:'
    - id: vol4.field.enforcement-contact--stopping-distance
      source: vol4.enforcement.contact
      predicate: requires more than free-space
      target: vol4.stopping.distance
      explanation: Intentional contact needs qualified force and energy margins in addition to the free-space
        separation and stopping calculation.
      conditions: This link distinguishes contact from free motion; a base stopping-distance check alone
        cannot qualify a gripper pressing a stiff fixture.
      status: draft
      evidence:
        section: sec-enforcement-intentional-contact
        quote: Once the manipulator arm reaches the cage-door strike plate ($\AngularClearance = 0$), the
          spatial kinetic barrier (@eq-enforce-kinetic-barrier) reduces to $\BarrierFunction(0, \JointAngularSpeed)
          = -\JointAngularSpeed^2 / (2\NetAngularBrakingDeceleration) \ge 0$, which admits only zero speed
          ($\JointAngularSpeed = 0$) and freezes the gripper before it can depress the latch. A spatial
          kinetic barrier operates under the premise that the robot's objective is to avoid collision ($\AngularClearance
          > 0$), whereas manipulation, grasping, and assembly require intentional physical contact ($\AngularClearance
          = 0$). While the spatial barrier can admit arrival at contact with zero approach speed, it does
          not govern the subsequent force-controlled interaction where geometric separation no longer supplies
          the relevant margin. Once the warehouse mobile manipulator's gripper meets the strike plate at
          the guarded approach, the arm must push against the latch spring, and the margin that matters
          is the energy and force it delivers there.
    - id: vol4.field.enforcement-certified-floor--enforcement-filter
      source: vol4.enforcement.certified-floor
      predicate: does not certify the
      target: vol4.enforcement.filter
      explanation: A separately rated protective function may sit below an unrated numerical layer without
        conferring its integrity rating on that layer.
      conditions: Each protective claim must match the hardware, diagnostics, tool qualification, and scope
        actually assessed; no system-wide certification is implied.
      status: draft
      evidence:
        section: sec-enforcement-certified-functions
        quote: 'Citing an unrated numerical QP solver or software evidence-age check as the primary hazard
          control in a safety case fails certification audit immediately, because complex solver code without
          formal tool qualification and hardware diagnostic coverage cannot carry a safety integrity claim.
          In an embodied deployment, not all firmware executing the fallback ladder carries formal functional
          safety certification, so a certification engineer partitions software claims by the integrity
          of the underlying hardware substrate. On a production machine, formal guarantees rest primarily
          on a second, lower layer: dedicated safety functions in the motor drives, the optical safety scanner,
          and the arm''s safety controller, each architected and validated to a Performance Level (PL) under
          ISO 13849-1 [@iso13849part1]. A Performance Level grades a safety function rather than a component,
          by the architecture category of its channels, their mean time to dangerous failure, their diagnostic
          coverage, and their defenses against common-cause failure (@sec-nervous-silicon-partitioning);
          IEC 61508 grades the same functions by Safety Integrity Level (SIL) [@iec61508]. These hardened
          functions substantiate the certified protective envelope. Above them, the MCU permission path
          operates primarily as an unrated performance layer designed to keep the learned policy inside
          the admissible set, preventing unnecessary trips of the hard safety floor. Only one narrow component
          of this MCU layer carries a safety rating, the watchdog that revokes authority when the chunk
          lease expires or the host heartbeat falls silent.'
    - id: vol4.field.enforcement-envelope--plant-braking
      source: vol4.enforcement.envelope
      predicate: depends on credible
      target: vol4.plant.braking
      explanation: The stopping claim can fail if the physical plant cannot deliver the deceleration assumed
        by the barrier.
      conditions: Traction, actuator saturation, sensing error, and sample timing remain explicit premises
        rather than properties proved by the filter.
      status: draft
      evidence:
        section: sec-enforcement-invariance-conditions
        quote: 'Unmodeled friction loss, actuator saturation, solver overruns, or inter-sample drift under
          a held torque command can each push a physical plant across a barrier boundary even when the continuous-time
          inequality is satisfied at the sample instant. The containment claim provided by both spatial
          and energetic barrier calculations is therefore strictly conditional. A forward-invariance claim
          requires a feasible barrier and the following bounded conditions; the list is necessary for this
          design, not an exhaustive if-and-only-if test:'
    - id: vol4.field.authority-chunk-lease--enforcement-envelope
      source: vol4.authority.chunk-lease
      predicate: spends clearance within
      target: vol4.enforcement.envelope
      explanation: A stalled proposer can retain execution for the active lease, so the envelope must reserve
        the travel that occurs before expiry and the subsequent stop.
      conditions: Use the admitted evidence age and exact event chain, adding a lease only on paths that
        can continue execution until expiry; avoid double charging overlapping intervals.
      status: draft
      evidence:
        section: sec-enforcement-composite-budget
        quote: The observation-age term ends at dispatch, and the chunk lease begins at admission, so the
          interval between them, $\DispatchAdmissionInterval$, belongs to neither. The complete operational
          delay therefore expands to $\AdmissionInclusivePrebrakeDelay = \PrebrakeDelay + \DispatchAdmissionInterval$,
          requiring an additional spatial reservation of $\SpeedAtDetection\DispatchAdmissionInterval$.
          This phase encompasses any remaining neural inference, safety envelope projection, and inter-process
          communication; pipelined or overlapping stages must be budgeted carefully to avoid double-counting.
          A newly arrived sensor observation updates this budget only when the hardware pipeline delivers
          and validates it prior to actuation. Laid out on one time axis (@fig-12-capture-to-onset), the
          observation age ends at dispatch, the dispatch-to-admission interval follows, and the lease, one
          tick, one bus cycle, and drive onset bring the base to brake onset. A travel row beneath converts
          each interval into millimeters at the candidate aisle speed.
