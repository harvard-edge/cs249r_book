# Physical AI — a backward-designed systems book.
# The concept track is complete before its end-of-chapter lab.
#   quarto render            # both formats
#   quarto preview           # live HTML
#   quarto render --to pdf   # PDF only

project:
  type: book
  output-dir: _build

bibliography: references.bib
link-citations: true

# Numbers in the book come from code (see rules/inline-computation.md). Chapters
# use pure-Python cells, so they execute with the python3 on PATH, no extra deps.
jupyter: python3

website:
  site-url: "https://mlsysbook.ai/physical/"
  announcement:
    icon: exclamation-triangle
    dismissable: false
    content: "**Written in the open, and in progress.** Live, evolving working draft planned for release in early 2027. Chapters and lab contracts are under active development."
    type: warning
    position: above-navbar

book:
  title: "Physical AI"
  subtitle: "Machine Learning Systems That Sense and Act"
  author:
    name: Vijay Janapa Reddi
    affiliations:
      - name: Harvard University
      - name: ETH Zurich
  date: today
  date-format: long
  cover-image: assets/cover.png
  cover-image-alt: "Cover of Physical AI: Machine Learning Systems That Sense and Act"
  image: assets/cover.png
  description: >
    A systems-first book about turning learned capabilities into continuous,
    measurable, dependable, and accountable systems that sense and act in the
    real world.
  repo-url: "https://github.com/harvard-edge/physical-ai"
  repo-subdir: book
  repo-branch: dev
  repo-actions: [source, issue]
  open-graph: true
  twitter-card: true
  page-navigation: true
  reader-mode: true
  search: true
  sidebar:
    style: docked
    search: false
    collapse-level: 2
    logo: assets/cover.png
  page-footer:
    left: "Physical AI · **Working Draft** (Planned Release Early 2027)"
    center: "Part of the [mlsysbook.ai](https://mlsysbook.ai) family"
    right: "Harvard University · ETH Zurich"
  chapters:
    - index.qmd
    - front-matter/syllabus.qmd
    - front-matter/notation.qmd
    - chapters/01-boundary/01-boundary.qmd
    - part: parts/part-i.qmd
      chapters:
        - chapters/02-body/02-body.qmd
        - chapters/04-nervous/04-nervous.qmd
        - chapters/03-brain/03-brain.qmd
    - part: parts/part-ii.qmd
      chapters:
        - chapters/05-data/05-data.qmd
        - chapters/06-training/06-training.qmd
        - chapters/07-evaluation/07-evaluation.qmd
    - part: parts/part-iii.qmd
      chapters:
        - chapters/08-perception/08-perception.qmd
        - chapters/09-memory/09-memory.qmd
        - chapters/10-intent/10-intent.qmd
        - chapters/11-planning/11-planning.qmd
        - chapters/12-enforcement/12-enforcement.qmd
        - chapters/13-placement/13-placement.qmd
    - part: parts/part-iv.qmd
      chapters:
        - chapters/14-intervention/14-intervention.qmd
        - chapters/15-verification/15-verification.qmd
        - chapters/16-release/16-release.qmd
    - chapters/17-frontier/17-frontier.qmd

  # appendices:
  #   - appendix/math-reference.qmd
  #   - appendix/glossary.qmd
  #   - appendix/cross-disciplinary-lexicon.qmd
  #   - appendix/hardware-reference.qmd
  #   - appendix/standards-and-incidents.qmd
  #   - appendix/heterogeneous-soc-reference.qmd
  #   - references.qmd

# Custom callouts (vendored pae-ext/custom-numbered-blocks Quarto extension).
# One Lua filter renders <details> in HTML and a tcolorbox in PDF.
# This block mirrors the shared taxonomy in
# publishing/quarto/config/shared/base/custom-numbered-blocks.yml so the
# standalone dev build and the publishing build render the same classes.
# Only the classes Volume IV actually uses are declared here; adding a new one
# means adding it to the shared base first.
# colors = [PDF title-bar fill, accent].
filters:
  - pae-ext/custom-numbered-blocks

filter-metadata:
  pae-ext/custom-numbered-blocks:
    icon-path: "assets/images/icons/callouts"
    icon-format: "svg"
    groups:
      learning-objectives:
        colors: ["E8F2EA", "4A7C59"]
        collapse: false
        numbered: false
      definition:
        colors: ["F2F7FA", "4F7396"]
        collapse: false
        numbered: true
      engineers-notebook:
        colors: ["F4F7FA", "3F6077"]
        collapse: false
        numbered: true
        scope: local
      example:
        colors: ["F0F8F6", "148F77"]
        collapse: false
        numbered: true
      perspective:
        colors: ["F7F8FA", "4A5568"]
        collapse: false
        numbered: true
      principle:
        colors: ["F3F2FA", "3D3B8E"]
        collapse: false
        numbered: true
        scope: global
      war-story:
        colors: ["FEF2F2", "C53030"]
        collapse: false
        numbered: true
      takeaways:
        colors: ["FCF4F8", "9D3C72"]
        collapse: false
        numbered: false
    classes:
      callout-learning-objectives:
        group: learning-objectives
        label: "Learning Objectives"
      callout-definition:
        group: definition
        label: "Definition"
        prefix: dfn
      callout-notebook:
        group: engineers-notebook
        label: "Napkin Math"
        reflabel: "napkin math"
        prefix: nbk
      callout-example:
        group: example
        label: "Example"
        prefix: exmp
      callout-perspective:
        group: perspective
        label: "Systems Perspective"
        prefix: psp
      callout-principle:
        group: principle
        label: "Principle"
        prefix: pri
      callout-war-story:
        group: war-story
        label: "War Story"
        prefix: ws
      callout-takeaways:
        group: takeaways
        label: "Key Takeaways"

format:
  html:
    theme:
      light: [default, theme.scss]
      dark: [darkly, theme.scss]
    toc: true
    link-citations: true
    # Default Quarto article measure, centered as a block (see theme.scss).
    grid:
      sidebar-width: 250px
      body-width: 800px
      margin-width: 250px
      gutter-width: 1.5rem
    include-in-header:
      - text: |
          <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
          <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  pdf:
    keep-tex: true
    pdf-engine: lualatex
    documentclass: scrbook
    fontsize: 9pt
    colorlinks: true
    link-citations: true
    linkcolor: structural
    urlcolor: measured
    citecolor: measured
    toc: true
    toc-depth: 2
    number-depth: 3
    reference-location: margin
    fig-pos: "t"
    tbl-pos: "htbp"
    tbl-cap-location: top
    classoption:
      - open=right
      - numbers=noenddot
      - captions=tableheading
    geometry:
      - paperwidth=8in
      - paperheight=10in
      - top=0.5in
      - bottom=0.625in
      - inner=0.875in
      - outer=1.75in
      - marginparwidth=1.25in
      - marginparsep=0.25in
      - headheight=14pt
      - headsep=18pt
      - includehead
      - footskip=24pt
      - heightrounded
    include-in-header:
      - file: "tex/theme-colors-physical.tex"
      - file: "tex/header-includes.tex"
      - file: "tex/cover.tex"
      - text: |
          \usepackage{needspace}
          \let\Needspace\needspace

metadata-files:
  - ../../publishing/quarto/config/shared/base/custom-numbered-blocks.yml
  - ../../publishing/quarto/config/shared/base/crossref-labels.yml
  - ../../shared/config/navbar-common.yml
  - ../../shared/config/footer-common.yml





