<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4A5568"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#A0AEC0" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- ===== (a) The cell: three machine classes on one track ===== -->
  <text x="40" y="30" font-size="10" font-weight="700" fill="#1A202C">(a)</text>

  <!-- Drive: thermal dissipation -->
  <rect x="60" y="110" width="80" height="50" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="100" y="131" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1A202C">drive</text>
  <text x="100" y="146" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">windings</text>
  <text x="100" y="180" text-anchor="middle" font-size="9" font-weight="700" fill="#1A202C">thermal dissipation</text>
  <text x="100" y="193" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">insulation ages</text>

  <!-- Track -->
  <line x1="140" y1="150" x2="560" y2="150" stroke="#4A5568" stroke-width="3"/>

  <!-- Carriage with container: moving mass -->
  <rect x="250" y="116" width="100" height="30" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="300" y="135" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1A202C">carriage</text>
  <rect x="270" y="90" width="60" height="26" rx="0" fill="#ffffff" stroke="#4A5568" stroke-width="1"/>
  <text x="300" y="107" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">carton</text>
  <line x1="352" y1="131" x2="392" y2="131" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <text x="372" y="124" text-anchor="middle" font-size="8.5" font-weight="400" font-style="italic" fill="#4A5568">v</text>
  <text x="300" y="180" text-anchor="middle" font-size="9" font-weight="700" fill="#1A202C">moving mass</text>
  <text x="300" y="193" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">impact deforms carton and frame</text>

  <!-- Insertion head: contact force -->
  <rect x="280" y="40" width="40" height="26" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <line x1="300" y1="66" x2="300" y2="88" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <text x="330" y="52" font-size="9.5" font-weight="700" fill="#1A202C">insertion head</text>
  <text x="330" y="66" font-size="9" font-weight="700" fill="#1A202C">contact force</text>
  <text x="330" y="79" font-size="8.5" font-weight="400" fill="#4A5568">carton wall buckles</text>

  <!-- Gate with its fixed stop line -->
  <line x1="520" y1="40" x2="520" y2="170" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="524" y="96" width="14" height="50" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="546" y="116" font-size="9" font-weight="700" fill="#1A202C">gate</text>
  <text x="546" y="130" font-size="8.5" font-weight="400" fill="#A51C30">stop line</text>

  <!-- ===== (b) Delay chain from closure to full braking: 1 ms = 6.875 px ===== -->
  <text x="40" y="226" font-size="10" font-weight="700" fill="#1A202C">(b)</text>
  <text x="150" y="252" text-anchor="end" font-size="9" font-weight="700" fill="#1A202C">delay chain</text>
  <rect x="160" y="238" width="110" height="22" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <rect x="270" y="238" width="247.5" height="22" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <rect x="517.5" y="238" width="13.75" height="22" rx="0" fill="#E2E8F0" stroke="#4A5568" stroke-width="1"/>
  <rect x="531.25" y="238" width="68.75" height="22" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="215" y="252.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1A202C">image 16 ms</text>
  <text x="393.75" y="252.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1A202C">transfer, inference, admission 36 ms</text>
  <text x="565.6" y="252.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1A202C">onset 10 ms</text>
  <line x1="524.4" y1="260" x2="524.4" y2="274" stroke="#4A5568" stroke-width="0.8"/>
  <text x="524.4" y="284" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">bus 2 ms</text>
  <text x="160" y="284" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">closure</text>
  <line x1="160" y1="260" x2="160" y2="274" stroke="#4A5568" stroke-width="0.8"/>
  <text x="608" y="252.5" font-size="9" font-weight="700" fill="#1A202C">64 ms</text>

  <!-- ===== (c) Stopping distance against the clearance: 1 mm = 2.444 px ===== -->
  <text x="40" y="310" font-size="10" font-weight="700" fill="#1A202C">(c)</text>
  <!-- reserve band 45 to 60 mm (drawn first, under the bars) -->
  <rect x="270" y="316" width="36.7" height="78" rx="0" fill="url(#hatch)"/>
  <text x="288.4" y="310" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">reserve</text>

  <!-- nominal speed: stop 171 mm = 96 mm delay travel + 75 mm braking -->
  <text x="150" y="340" text-anchor="end" font-size="9" font-weight="700" fill="#1A202C">1.5 m/s</text>
  <rect x="160" y="326" width="234.7" height="22" rx="0" fill="#E2E8F0" stroke="#4A5568" stroke-width="1"/>
  <rect x="394.7" y="326" width="183.3" height="22" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <!-- travel beyond the stop line: consequence -->
  <rect x="306.7" y="326" width="271.3" height="22" rx="0" fill="#A51C30" fill-opacity="0.14" stroke="#A51C30" stroke-width="1.2"/>
  <text x="233.4" y="340.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1A202C">delay 96 mm</text>
  <text x="486.4" y="340.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1A202C">braking 75 mm</text>
  <text x="584" y="340.5" font-size="8.5" font-weight="700" fill="#A51C30">171 mm</text>

  <!-- restricted speed: stop 40.3 mm = 32 mm delay travel + 8.3 mm braking -->
  <text x="150" y="376" text-anchor="end" font-size="9" font-weight="700" fill="#1A202C">0.5 m/s</text>
  <rect x="160" y="362" width="78.2" height="22" rx="0" fill="#E2E8F0" stroke="#4A5568" stroke-width="1"/>
  <rect x="238.2" y="362" width="20.4" height="22" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="199.1" y="376.5" text-anchor="middle" font-size="8.5" font-weight="400" fill="#1A202C">delay 32 mm</text>
  <text x="316" y="376.5" font-size="8.5" font-weight="400" fill="#1A202C">stop 40.3 mm · 19.7 mm to spare</text>

  <!-- stop line at 60 mm clearance -->
  <line x1="306.7" y1="316" x2="306.7" y2="398" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- distance axis -->
  <line x1="160" y1="398" x2="600" y2="398" stroke="#4A5568" stroke-width="0.8"/>
  <line x1="160" y1="398" x2="160" y2="403" stroke="#4A5568" stroke-width="0.8"/>
  <line x1="306.7" y1="398" x2="306.7" y2="403" stroke="#4A5568" stroke-width="0.8"/>
  <line x1="453.3" y1="398" x2="453.3" y2="403" stroke="#4A5568" stroke-width="0.8"/>
  <line x1="600" y1="398" x2="600" y2="403" stroke="#4A5568" stroke-width="0.8"/>
  <text x="160" y="414" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">0</text>
  <text x="306.7" y="414" text-anchor="middle" font-size="8.5" font-weight="400" fill="#A51C30">60 mm clearance</text>
  <text x="453.3" y="414" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">120</text>
  <text x="600" y="414" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">180 mm</text>
</svg>
