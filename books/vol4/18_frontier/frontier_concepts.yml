  secondary_concepts:
    - Observational indistinguishability
    - Shield dilution
  claims:
    Four-law audit of a new machine: The method transfers to an unfamiliar machine as four ordered questions (what
      the task cannot undo and which measured bound excludes it, whether closed-loop evidence covers the enforced
      envelope, which independent path admits each proposal, and what evidence bounds the authority granted), not
      as the warehouse machine's numbers.
    Residual-claims register: A premise no onboard sensor reports is not the envelope's monitored unknown, so it
      is bound to a standing restriction, an accountable owner, and a predeclared closure test, chosen among responses
      (probe, restrict, add sensing, accept by judgment) by the claim each can support.
    Next capability by missing evidence: Open register entries fall into classes by the evidence they lack (an unmeasured
      observable, an evaluation deficit, a theoretical deficit) or by a scope mismatch that no evidence inside the present
      architecture repairs, and the class, not the urgency, selects the next experiment, with each restriction priced
      against the campaign that would retire it.
    Observational indistinguishability: When two states that need different responses produce identical observations
      until the action deadline, no model on that channel can separate them, and the latest useful observation is
      set by braking distance over speed.
    Shield dilution: A shield's per-command guarantee becomes a hazard-rate claim only conditionally, lambda_sys
      <= lambda_h(1 - c) + lambda_cc, and observed fleet rates already include the shield, so multiplying them by
      an interception factor double-counts.
