  learner_graph:
    schema_version: 1
    concepts:
    - id: vol4.limits.indistinguishability
      label: Observational indistinguishability
      teaches: Observational indistinguishability
      summary: Different physical states require different responses but produce identical available observations
        through the action deadline.
      section: sec-frontier-observational-indistinguishability-sub
    - id: vol4.limits.assumption
      label: Residual assumption
      teaches: Residual-claims register
      summary: An unresolved premise that remains explicit, with its operating restriction, owner, and missing
        evidence; recording it does not measure it.
      section: sec-frontier-residual-claims-register
    relationships:
    - id: vol4.field.limits-indistinguishability--enforcement-filter
      source: vol4.limits.indistinguishability
      predicate: limits what can be justified by
      target: vol4.enforcement.filter
      explanation: A runtime filter cannot select a state-specific safe response before the deadline when
        its available observations do not distinguish the relevant physical states.
      conditions: The impossibility applies to the stated channels, admissible probes, and deadline; new
        timely sensing or a response qualified for both states can change the conclusion.
      status: draft
      evidence:
        section: sec-frontier-observational-indistinguishability-sub
        quote: 'When an oil film and dry concrete produce identical camera and lidar readings until the
          robot is already inside its dry-floor stopping distance, no classifier running on those sensors
          can trigger a stop in time. That limit is observational indistinguishability. Consider two physical
          world states, $\SafeWorldState$ and $\HazardousWorldState$. In state $\SafeWorldState$, a commanded
          actuator trajectory $\ControlInput(\TimeInstant)$ runs safely. In state $\HazardousWorldState$,
          that same command $\ControlInput(\TimeInstant)$ causes structural damage or human injury, requiring
          the permission path to trigger an emergency stop. The constraint governing this stop is distance
          rather than elapsed time: because braking changes the robot''s speed along its path, the point
          of harm is a place in the room. Let $\RemainingHarmDistance$ denote the remaining distance to
          that boundary when the distinguishing observation arrives. An emergency stop finishes short of
          the hazard only if:

          $$\RemainingHarmDistance \ge \SpeedAtDetection\,(\EnforcerComputeTime + \ActuatorResponseTime)
          + \BrakingDistance(\SpeedAtDetection),$$ {#eq-frontier-action-deadline}

          matching the physical stopping relation used throughout this book. The enforcer''s compute time
          and the actuator''s response time together act as the pre-brake delay $\PrebrakeDelay$, counted
          from the arrival of the distinguishing observation rather than from a fixed capture event, and
          $\BrakingDistance(\SpeedAtDetection)$ is the braking distance of the chosen stop. Dividing this
          distance constraint by the approach speed gives an equivalent observation deadline: $\DeadlineInstant
          = \HarmInstant - \EnforcerComputeTime - \ActuatorResponseTime - \BrakingDistance(\SpeedAtDetection)/\SpeedAtDetection$,
          where $\HarmInstant$ is the instant the unbraked trajectory would reach impact. Because $\HarmInstant$
          marks when the robot would reach the hazard at constant cruising speed $\SpeedAtDetection$, the
          quantity $\HarmInstant - \DeadlineInstant$ expresses the required spatial clearance $\RemainingHarmDistance$
          in units of cruising-speed travel time. Once braking begins, the decelerating robot takes longer
          than $\BrakingDistance(\SpeedAtDetection)/\SpeedAtDetection$ to cover the remaining distance,
          so it safely comes to rest just short of the spatial boundary at a clock instant later than $\HarmInstant$.
          A common mistake subtracts the full stopping duration $\StoppingDuration$ instead of the speed-normalized
          distance $\BrakingDistance/\SpeedAtDetection$, treating the robot as if it kept moving at full
          cruising speed until the instant it came to rest. For the jerk-limited profile from `{python}
          OilFilm.v_aisle_str`, braking lasts `{python} OilFilm.t_brake_aisle_str` but covers a distance
          equal to only `{python} OilFilm.t_brake_equiv_str` of constant-speed travel. Writing the deadline
          purely in time over-reserves `{python} OilFilm.t_overreserve_str`, or `{python} OilFilm.d_overreserve_str`
          of clearance, an error larger than the entire `{python} OilFilm.spare_aisle_str` spare. The time
          form errs on the safe side, but it refuses operating modes that the distance form rightly admits.
          Manipulator contact follows the same logic: once an end-effector touches a stiff surface, contact
          force rather than position sets the observation deadline (@sec-enforcement-intentional-contact).'
    - id: vol4.field.limits-assumption--assurance-manifest
      source: vol4.limits.assumption
      predicate: restricts permitted
      target: vol4.assurance.manifest
      explanation: A residual assumption must attach to enforceable operating restrictions and human work
        rather than being treated as a measured fact.
      conditions: Recording an unresolved premise neither closes its evidence gap nor authorizes the unsupported
        operating mode.
      status: draft
      evidence:
        section: sec-frontier-operationalizing-claims
        quote: Writing an open assumption into a machine-readable register file does not turn it into a
          measured physical state. If the signed speed limits and site procedures are not wired into the
          release gate and daily floor work, the restriction exists only on paper. Operating restrictions
          in the register must therefore attach directly to the runtime enforcers and site workflows that
          govern daily operation. Cryptographically signed speed envelopes constrain the onboard permission
          path, while scheduled maintenance intervals bind facility operations. Release pipelines check
          that both controls are active in the authorized configuration, while runtime monitors enforce
          only the physical bounds that onboard sensors can read.
    - id: vol4.field.limits-assumption--verification-envelope
      source: vol4.limits.assumption
      predicate: can require narrowing the
      target: vol4.verification.envelope
      explanation: An unresolved scope mismatch can require a changed architecture or a narrower operating
        domain rather than another test of the same unsupported mode.
      conditions: The restriction must be enforced and the resulting envelope qualified; other gap classes
        need sensing, evaluation, or analytical evidence instead.
      status: draft
      evidence:
        section: sec-frontier-four-gap-classes
        quote: '- *Unmeasured observables* require dedicated sensors that can tell the relevant physical
          states apart before the action deadline passes.

          - *Evaluation deficits* require randomized field trials or statistical estimators that represent
          the actual operating population while accounting for correlated samples and rare tail events.

          - *Theoretical deficits* require bounded analytical arguments whose physical premises can be proved
          mathematically or tested on the actual hardware plant.

          - *Scope mismatches* require changing the system architecture or narrowing the operational design
          domain.'
