<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.2px; }
      .subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .realm-tag { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; }
      .card-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .card-body { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #334155; }
      .math-expr { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 600; }
      .card-sub { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #64748B; font-style: italic; }
      .pill-text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; text-anchor: middle; }
      .axis-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; fill: #475569; font-weight: 600; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E40AF"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="570" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="28" class="title">DYNAMIC STOPPING ENVELOPE: LINEAR REACTION LAG VS. QUADRATIC BRAKING</text>
  <text x="480" y="45" class="subtitle">Stopping Distance d_stop = v · T_lag + v² / (2 · a_max) across Forward Speed v and Actuator Deceleration Capacity a_max</text>

  <!-- TOP CONTAINER: Physical Decomposition Cards -->
  <rect x="36" y="64" width="888" height="130" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Phase 1 Card: Linear Reaction Lag -->
  <g transform="translate(50, 76)">
    <rect width="410" height="106" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="14" y="20" class="card-title" fill="#1E3A8A">Phase 1: Linear Reaction Travel (Lag-Bound)</text>
    <text x="14" y="38" class="math-expr" fill="#1E40AF">d_react = v_0 · T_lag = v_0 · (t_sense + t_inf + t_bus + t_elec)</text>
    <text x="14" y="56" class="card-body">Constant-velocity unguided displacement while policy evaluates</text>
    <text x="14" y="74" class="card-sub">At v = 2.0 m/s and T_lag = 120 ms: d_react = 24.0 cm (Linear scaling: ∝ v)</text>
    <rect x="330" y="76" width="66" height="18" rx="9" fill="#EFF6FF"/>
    <text x="363" y="89" class="pill-text" fill="#1D4ED8">Linear ∝ v</text>
  </g>

  <!-- Phase 2 Card: Quadratic Kinetic Braking -->
  <g transform="translate(490, 76)">
    <rect width="420" height="106" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2"/>
    <text x="14" y="20" class="card-title" fill="#991B1B">Phase 2: Quadratic Braking Travel (Physics-Bound)</text>
    <text x="14" y="38" class="math-expr" fill="#991B1B">d_brake = v_0² / (2 · a_max) · (1 + k_fudge)</text>
    <text x="14" y="56" class="card-body">Kinetic energy dissipation: ΔE_k = ½ m v² converted to Joule heat</text>
    <text x="14" y="74" class="card-sub">At v = 2.0 m/s and a_max = 3.0 m/s²: d_brake = 66.7 cm (Quadratic: ∝ v²)</text>
    <rect x="330" y="76" width="76" height="18" rx="9" fill="#FEF2F2"/>
    <text x="368" y="89" class="pill-text" fill="#991B1B">Quadratic ∝ v²</text>
  </g>

  <!-- BOTTOM CONTAINER: Analytical Curve Graph (y=206..495) -->
  <rect x="36" y="206" width="888" height="280" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- Graph Grid -->
  <line x1="120" y1="240" x2="120" y2="445" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="120" y1="445" x2="880" y2="445" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Speed Axis Ticks (X: 0 to 4.0 m/s, x=120..880, width=760 => 190 px / m/s) -->
  <line x1="120" y1="445" x2="120" y2="450" stroke="#475569" stroke-width="1"/>
  <text x="120" y="465" class="axis-label" text-anchor="middle">0.0 m/s</text>

  <line x1="310" y1="445" x2="310" y2="450" stroke="#475569" stroke-width="1"/>
  <text x="310" y="465" class="axis-label" text-anchor="middle">1.0 m/s</text>

  <line x1="500" y1="445" x2="500" y2="450" stroke="#475569" stroke-width="1"/>
  <text x="500" y="465" class="axis-label" text-anchor="middle">2.0 m/s</text>

  <line x1="690" y1="445" x2="690" y2="450" stroke="#475569" stroke-width="1"/>
  <text x="690" y="465" class="axis-label" text-anchor="middle">3.0 m/s</text>

  <line x1="880" y1="445" x2="880" y2="450" stroke="#475569" stroke-width="1"/>
  <text x="880" y="465" class="axis-label" text-anchor="middle">4.0 m/s</text>
  <text x="500" y="480" font-family="'IBM Plex Sans', sans-serif" font-size="11px" font-weight="700" fill="#1E293B" text-anchor="middle">Platform Forward Operating Speed v (m/s)</text>

  <!-- Distance Axis Ticks (Y: 0 to 3.0 m, y=445..240, height=205 => 68.3 px / m) -->
  <text x="110" y="448" class="axis-label" text-anchor="end">0.0 m</text>
  <text x="110" y="377" class="axis-label" text-anchor="end">1.0 m</text>
  <text x="110" y="309" class="axis-label" text-anchor="end">2.0 m</text>
  <text x="110" y="244" class="axis-label" text-anchor="end">3.0 m</text>
  <text x="50" y="340" font-family="'IBM Plex Sans', sans-serif" font-size="11px" font-weight="700" fill="#1E293B" text-anchor="middle" transform="rotate(-90 50 340)">Total Stopping Distance d_stop (m)</text>

  <!-- Curves -->
  <!-- Linear Reaction Curve (Blue dashed): d_react = v * 0.10 -->
  <path d="M 120 445 L 310 438 L 500 431 L 690 424 L 880 417" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="885" y="415" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#1E40AF">d_react (T_lag=100ms)</text>

  <!-- High Decel Curve a_max = 4.0 m/s² (Green): d = 0.10 v + v² / 8.0 -->
  <path d="M 120 445 Q 500 410 880 285" fill="none" stroke="#059669" stroke-width="2.2"/>
  <text x="810" y="275" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#065F46">a_max = 4.0 m/s²</text>

  <!-- Medium Decel Curve a_max = 2.5 m/s² (Amber): d = 0.10 v + v² / 5.0 -->
  <path d="M 120 445 Q 500 395 880 230" fill="none" stroke="#D97706" stroke-width="2.2"/>
  <text x="810" y="222" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#B45309">a_max = 2.5 m/s²</text>

  <!-- Low Decel Curve a_max = 1.5 m/s² (Red): d = 0.10 v + v² / 3.0 -->
  <path d="M 120 445 Q 450 375 750 170" fill="none" stroke="#EF4444" stroke-width="2.5"/>
  <text x="660" y="165" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#991B1B">a_max = 1.5 m/s² (Wet / Low Friction)</text>

  <!-- Dynamic Velocity Ceiling Governor Formula Banner -->
  <g transform="translate(130, 215)">
    <rect width="450" height="28" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="225" y="18" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5px" font-weight="700" fill="#B45309" text-anchor="middle">GOVERNOR: v_max = -a_max T_lag + √(a_max² T_lag² + 2 a_max D_clear)</text>
  </g>

  <!-- Bottom Synthesis Subtitle -->
  <text x="480" y="555" class="subtitle">As speed increases, quadratic kinetic braking dominates total stopping distance, requiring non-linear velocity clamps as obstacle clearance shrinks.</text>
</svg>
