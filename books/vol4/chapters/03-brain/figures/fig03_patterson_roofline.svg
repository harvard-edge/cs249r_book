<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.2px; }
      .subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .axis-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #1E293B; }
      .tick-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; fill: #64748B; font-weight: 600; }
      .region-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; text-anchor: middle; }
      .point-label { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; }
      .point-sub { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; fill: #475569; }
      .knee-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9px; font-weight: 700; fill: #991B1B; text-anchor: middle; }
    </style>

    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E40AF"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="560" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="480" y="28" class="title">THE PATTERSON ROOFLINE MODEL &amp; EMBODIED MEMORY WALL</text>
  <text x="480" y="45" class="subtitle">Operational Arithmetic Intensity (FLOP/Byte) vs. Attainable Throughput on Embedded Edge Silicon (NVIDIA Jetson AGX Orin, 204.8 GB/s LPDDR5)</text>

  <!-- Graph Canvas: x=90..910 (width=820), y=75..455 (height=380) -->
  <rect x="90" y="75" width="820" height="380" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Shaded Regimes -->
  <polygon points="90,455 640,120 90,120" fill="#EFF6FF" fill-opacity="0.8"/>
  <polygon points="640,120 910,120 910,455 640,455" fill="#F0FDF4" fill-opacity="0.7"/>

  <!-- Grid Lines (Log Scale) -->
  <line x1="90" y1="75" x2="90" y2="455" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="226" y1="75" x2="226" y2="455" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="363" y1="75" x2="363" y2="455" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="500" y1="75" x2="500" y2="455" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="636" y1="75" x2="636" y2="455" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="773" y1="75" x2="773" y2="455" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="910" y1="75" x2="910" y2="455" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Y Grid -->
  <line x1="90" y1="455" x2="910" y2="455" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="371" x2="910" y2="371" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="287" x2="910" y2="287" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="203" x2="910" y2="203" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="120" x2="910" y2="120" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Compute Ceiling Line -->
  <line x1="90" y1="120" x2="910" y2="120" stroke="#1E40AF" stroke-width="1.8" stroke-dasharray="5,3"/>
  <rect x="700" y="104" width="200" height="22" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="800" y="119" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#1E40AF" text-anchor="middle">PEAK COMPUTE: 275 TFLOP/s (FP16/INT8)</text>

  <!-- Memory Bandwidth Slope Line -->
  <line x1="90" y1="455" x2="640" y2="120" stroke="#B45309" stroke-width="2.5"/>
  
  <!-- Memory Wall Ceiling Label -->
  <g transform="translate(230, 240) rotate(-31)">
    <rect x="-10" y="-14" width="240" height="20" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="110" y="0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#B45309" text-anchor="middle">MEMORY BANDWIDTH: 204.8 GB/s (LPDDR5)</text>
  </g>

  <!-- Ridge Point (Knee) Indicator -->
  <circle cx="640" cy="120" r="5" fill="#991B1B" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="640" y1="120" x2="640" y2="455" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="560" y="132" width="160" height="34" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="1"/>
  <text x="640" y="146" class="knee-label">HARDWARE RIDGE POINT (KNEE)</text>
  <text x="640" y="160" class="knee-label" fill="#475569">I_knee = 1342.8 FLOP/Byte</text>

  <!-- Regime Labels -->
  <text x="320" y="100" class="region-label" fill="#1E40AF">MEMORY-BOUND REGIME (DRAM BANDWIDTH BOTTLENECK)</text>
  <text x="770" y="100" class="region-label" fill="#065F46">COMPUTE-BOUND REGIME</text>

  <!-- Operating Points -->
  <!-- Point 1: Autoregressive VLA Single-Token -->
  <circle cx="105" cy="445" r="5" fill="#DC2626"/>
  <rect x="115" y="415" width="205" height="38" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1"/>
  <text x="122" y="429" class="point-label" fill="#991B1B">Autoregressive VLA (1 Token / step)</text>
  <text x="122" y="444" class="point-sub">I ≈ 1.0 FLOP/Byte · P ≈ 0.20 TFLOP/s (0.07% peak)</text>

  <!-- Point 2: Action Chunking Transformer (H=16) -->
  <circle cx="363" cy="287" r="5" fill="#0284C7"/>
  <rect x="235" y="300" width="230" height="38" rx="4" fill="#FFFFFF" stroke="#0284C7" stroke-width="1"/>
  <text x="242" y="314" class="point-label" fill="#0369A1">Action Chunking ACT (Horizon H=16)</text>
  <text x="242" y="329" class="point-sub">I ≈ 16.0 FLOP/Byte · P ≈ 3.28 TFLOP/s (1.2% peak)</text>

  <!-- Point 3: Diffusion Policy Denoising (K=10 Steps) -->
  <circle cx="500" cy="203" r="5" fill="#059669"/>
  <rect x="365" y="180" width="225" height="38" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1"/>
  <text x="372" y="194" class="point-label" fill="#065F46">Diffusion Policy (10 Denoise Steps)</text>
  <text x="372" y="209" class="point-sub">I ≈ 100.0 FLOP/Byte · P ≈ 20.5 TFLOP/s (7.5% peak)</text>

  <!-- Point 4: Vision Transformer Backbone (ViT-L/14) -->
  <circle cx="773" cy="120" r="5" fill="#7C3AED"/>
  <rect x="670" y="190" width="225" height="38" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="678" y="204" class="point-label" fill="#5B4B8A">ViT-L/14 Image Encoder (224×224)</text>
  <text x="678" y="219" class="point-sub">I ≈ 2200 FLOP/Byte · P = 275 TFLOP/s (100% peak)</text>

  <!-- X-Axis Labels -->
  <text x="90" y="475" class="tick-label" text-anchor="middle">0.1</text>
  <text x="226" y="475" class="tick-label" text-anchor="middle">1.0</text>
  <text x="363" y="475" class="tick-label" text-anchor="middle">10</text>
  <text x="500" y="475" class="tick-label" text-anchor="middle">100</text>
  <text x="636" y="475" class="tick-label" text-anchor="middle">1000</text>
  <text x="773" y="475" class="tick-label" text-anchor="middle">10⁴</text>
  <text x="910" y="475" class="tick-label" text-anchor="middle">10⁵</text>
  <text x="480" y="500" class="axis-title" text-anchor="middle">Arithmetic Intensity I (FLOP / Byte)</text>

  <!-- Y-Axis Labels -->
  <text x="80" y="459" class="tick-label" text-anchor="end">0.1</text>
  <text x="80" y="375" class="tick-label" text-anchor="end">1.0</text>
  <text x="80" y="291" class="tick-label" text-anchor="end">10</text>
  <text x="80" y="207" class="tick-label" text-anchor="end">100</text>
  <text x="80" y="124" class="tick-label" text-anchor="end">275</text>
  <text x="40" y="265" class="axis-title" text-anchor="middle" transform="rotate(-90 40 265)">Attainable Performance P (TFLOP/s)</text>

  <!-- Bottom Synthesis Box -->
  <rect x="90" y="515" width="820" height="34" rx="4" fill="#FFFDF8" stroke="#FDE68A" stroke-width="1"/>
  <text x="480" y="530" class="subtitle" font-weight="600" fill="#92400E">Architectural Takeaway: Memory bandwidth B_mem (not compute TFLOP/s) bounds autoregressive policy rate (f_max = B_mem / M_weights).</text>
  <text x="480" y="542" class="point-sub" text-anchor="middle">Action chunking H waypoints amortizes full-model weight reads, shifting operational intensity from 1.0 to 16.0+ FLOP/Byte.</text>
</svg>
