<rect width="940" height="560" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="470.0" y="28" class="title">THE FIVE HANDOFFS: ARCHITECTURAL CHAIN &amp; REJECTION GATES</text>
<text x="470.0" y="44" class="subtitle">Modular Functional Contracts with Interface Rejection Tests vs. Collapsed End-to-End Policy</text>
<rect x="20" y="62" width="900" height="240" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="20" y="62" width="900" height="22" rx="8" fill="#1F407A" fill-opacity="0.10"/>
<text x="32" y="77" font-size="9" font-weight="700" fill="#1F407A">PANEL A: CANONICAL MODULAR CHAIN · EXPLICIT INTERFACE CONTRACTS &amp; REJECTION GATES</text>
<text x="908" y="77" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="end">PROPOSALS (DASHED) → PERMITTED ACTUATION (SOLID)</text>
<rect x="34.0" y="94" width="160" height="194" rx="6" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2"/>
<rect x="34.0" y="94" width="160" height="20" rx="6" fill="#1F407A" fill-opacity="0.12"/>
<text x="114.0" y="108" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">1. OBSERVE</text>
<text x="114.0" y="126" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Sensory Evidence</text>
<text x="42.0" y="142" font-size="7.8" fill="#475569">• Photons, IMU, Encoders</text>
<text x="42.0" y="156" font-size="7.8" fill="#475569">• Timestamped O_t + CRC</text>
<text x="42.0" y="170" font-size="7.8" fill="#475569">• Hardware error flags</text>
<line x1="40.0" y1="192" x2="188.0" y2="192" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="40.0" y="200" width="148" height="76" rx="4" fill="#A51C30" fill-opacity="0.06" stroke="#A51C30" stroke-width="0.9"/>
<text x="114.0" y="213" font-size="7.5" font-weight="700" fill="#A51C30" text-anchor="middle">REJECTION GATE</text>
<text x="44.0" y="228" font-size="7.5" font-weight="600" fill="#1A202C">RG-1: Desync / Stale</text>
<text x="44.0" y="242" font-size="7.5" font-weight="600" fill="#A51C30">Drop if delay &gt; 15 ms</text>
<line x1="195.0" y1="148" x2="211.0" y2="148" stroke="#215CAF" stroke-width="1.6" marker-end="url(#arr-blue)"/>
<rect x="212.0" y="94" width="160" height="194" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2"/>
<rect x="212.0" y="94" width="160" height="20" rx="6" fill="#215CAF" fill-opacity="0.12"/>
<text x="292.0" y="108" font-size="8.5" font-weight="700" fill="#215CAF" text-anchor="middle">2. ESTIMATE</text>
<text x="292.0" y="126" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Metric State Belief</text>
<text x="220.0" y="142" font-size="7.8" fill="#475569">• Spatial x̂_t ∈ SE(3)</text>
<text x="220.0" y="156" font-size="7.8" fill="#475569">• Velocity v_t, Covariance Σ_t</text>
<text x="220.0" y="170" font-size="7.8" fill="#475569">• Tracked frame tree</text>
<line x1="218.0" y1="192" x2="366.0" y2="192" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="218.0" y="200" width="148" height="76" rx="4" fill="#A51C30" fill-opacity="0.06" stroke="#A51C30" stroke-width="0.9"/>
<text x="292.0" y="213" font-size="7.5" font-weight="700" fill="#A51C30" text-anchor="middle">REJECTION GATE</text>
<text x="222.0" y="228" font-size="7.5" font-weight="600" fill="#1A202C">RG-2: Drift / Age</text>
<text x="222.0" y="242" font-size="7.5" font-weight="600" fill="#A51C30">Reject if age &gt; 50 ms</text>
<line x1="373.0" y1="148" x2="389.0" y2="148" stroke="#215CAF" stroke-width="1.6" marker-end="url(#arr-blue)"/>
<rect x="390.0" y="94" width="160" height="194" rx="6" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.2"/>
<rect x="390.0" y="94" width="160" height="20" rx="6" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="470.0" y="108" font-size="8.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">3. INTEND</text>
<text x="470.0" y="126" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Semantic Goal Lease</text>
<text x="398.0" y="142" font-size="7.8" fill="#475569">• Target goal state G</text>
<text x="398.0" y="156" font-size="7.8" fill="#475569">• Bounding volume V_scope</text>
<text x="398.0" y="170" font-size="7.8" fill="#475569">• Expiring lease t_expire</text>
<line x1="396.0" y1="192" x2="544.0" y2="192" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="396.0" y="200" width="148" height="76" rx="4" fill="#A51C30" fill-opacity="0.06" stroke="#A51C30" stroke-width="0.9"/>
<text x="470.0" y="213" font-size="7.5" font-weight="700" fill="#A51C30" text-anchor="middle">REJECTION GATE</text>
<text x="400.0" y="228" font-size="7.5" font-weight="600" fill="#1A202C">RG-3: Expired Lease</text>
<text x="400.0" y="242" font-size="7.5" font-weight="600" fill="#A51C30">Expire if t &gt; t_expire</text>
<line x1="551.0" y1="148" x2="567.0" y2="148" stroke="#B87333" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-bronze)"/>
<rect x="568.0" y="94" width="160" height="194" rx="6" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2"/>
<rect x="568.0" y="94" width="160" height="20" rx="6" fill="#B87333" fill-opacity="0.12"/>
<text x="648.0" y="108" font-size="8.5" font-weight="700" fill="#B87333" text-anchor="middle">4. PLAN</text>
<text x="648.0" y="126" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Trajectory Chunk</text>
<text x="576.0" y="142" font-size="7.8" fill="#475569">• Action chunk A_{t:t+H}</text>
<text x="576.0" y="156" font-size="7.8" fill="#475569">• 16 waypoints, C² spline</text>
<text x="576.0" y="170" font-size="7.8" fill="#475569">• Smooth jerk envelope</text>
<line x1="574.0" y1="192" x2="722.0" y2="192" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="574.0" y="200" width="148" height="76" rx="4" fill="#A51C30" fill-opacity="0.06" stroke="#A51C30" stroke-width="0.9"/>
<text x="648.0" y="213" font-size="7.5" font-weight="700" fill="#A51C30" text-anchor="middle">REJECTION GATE</text>
<text x="578.0" y="228" font-size="7.5" font-weight="600" fill="#1A202C">RG-4: Infeasibility</text>
<text x="578.0" y="242" font-size="7.5" font-weight="600" fill="#A51C30">Reject if q̈ &gt; a_max</text>
<line x1="729.0" y1="148" x2="745.0" y2="148" stroke="#B87333" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-bronze)"/>
<rect x="746.0" y="94" width="160" height="194" rx="6" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2"/>
<rect x="746.0" y="94" width="160" height="20" rx="6" fill="#007A87" fill-opacity="0.12"/>
<text x="826.0" y="108" font-size="8.5" font-weight="700" fill="#007A87" text-anchor="middle">5. ENFORCE</text>
<text x="826.0" y="126" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Real-Time Barrier</text>
<text x="754.0" y="142" font-size="7.8" fill="#475569">• 1 kHz QP Solver h(x)≥0</text>
<text x="754.0" y="156" font-size="7.8" fill="#475569">• Stopping check d_stop</text>
<text x="754.0" y="170" font-size="7.8" fill="#475569">• Sole permission gate</text>
<line x1="752.0" y1="192" x2="900.0" y2="192" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="752.0" y="200" width="148" height="76" rx="4" fill="#A51C30" fill-opacity="0.06" stroke="#A51C30" stroke-width="0.9"/>
<text x="826.0" y="213" font-size="7.5" font-weight="700" fill="#A51C30" text-anchor="middle">REJECTION GATE</text>
<text x="756.0" y="228" font-size="7.5" font-weight="600" fill="#1A202C">RG-5: Barrier Breach</text>
<text x="756.0" y="242" font-size="7.5" font-weight="600" fill="#A51C30">VETO → Safe-Stop ⊥</text>
<text x="826.0" y="294" font-size="8" font-weight="700" fill="#10B981" text-anchor="middle">✓ ONLY ENFORCE COMMANDS ACTUATORS</text>
<rect x="20" y="316" width="900" height="160" rx="8" fill="#F8FAFC" stroke="#D97706" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="20" y="316" width="900" height="22" rx="8" fill="#D97706" fill-opacity="0.15"/>
<text x="32" y="331" font-size="9" font-weight="700" fill="#D97706">PANEL B: COLLAPSED END-TO-END POLICY · OPAQUE LATENT STATE &amp; LOST INSPECTION INTERFACES</text>
<text x="908" y="331" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="end">HIGH RISK: ZERO INTERMEDIATE REJECTION GATES</text>
<rect x="38" y="348" width="864" height="116" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
<rect x="48" y="364" width="140" height="84" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1"/>
<text x="118" y="382" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">RAW SENSORY INGEST</text>
<text x="118" y="400" font-size="8" fill="#475569" text-anchor="middle">Camera RGB Pixels</text>
<text x="118" y="416" font-size="8" fill="#475569" text-anchor="middle">&amp; Natural Language</text>
<text x="118" y="434" font-size="7.5" font-weight="600" fill="#64748B" text-anchor="middle">Input Tensor O_t</text>
<line x1="190" y1="406" x2="218" y2="406" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-navy)"/>
<rect x="222" y="360" width="490" height="92" rx="5" fill="#1A202C" fill-opacity="0.04" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
<text x="467.0" y="378" font-size="9" font-weight="700" fill="#1A202C" text-anchor="middle">BLACK-BOX END-TO-END VLA / DIFFUSION POLICY (OPAQUE LATENT MAP)</text>
<rect x="232.0" y="390" width="110" height="42" rx="4" fill="#DC2626" fill-opacity="0.08" stroke="#DC2626" stroke-width="0.9"/>
<text x="287.0" y="406" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">⚠ Lost Sensory Check</text>
<text x="287.0" y="420" font-size="7" fill="#475569" text-anchor="middle">No CRC / desync gate</text>
<rect x="352.0" y="390" width="110" height="42" rx="4" fill="#DC2626" fill-opacity="0.08" stroke="#DC2626" stroke-width="0.9"/>
<text x="407.0" y="406" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">⚠ Lost State Audit</text>
<text x="407.0" y="420" font-size="7" fill="#475569" text-anchor="middle">No SE(3) covariance Σ_t</text>
<rect x="472.0" y="390" width="110" height="42" rx="4" fill="#DC2626" fill-opacity="0.08" stroke="#DC2626" stroke-width="0.9"/>
<text x="527.0" y="406" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">⚠ Lost Lease Expiry</text>
<text x="527.0" y="420" font-size="7" fill="#475569" text-anchor="middle">No timeout t_expire</text>
<rect x="592.0" y="390" width="110" height="42" rx="4" fill="#DC2626" fill-opacity="0.08" stroke="#DC2626" stroke-width="0.9"/>
<text x="647.0" y="406" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">⚠ Lost Kinematic Gate</text>
<text x="647.0" y="420" font-size="7" fill="#475569" text-anchor="middle">No jerk / singular check</text>
<line x1="714" y1="406" x2="738" y2="406" stroke="#A51C30" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-crimson)"/>
<rect x="742" y="364" width="150" height="84" rx="4" fill="#A51C30" fill-opacity="0.08" stroke="#A51C30" stroke-width="1"/>
<text x="817.0" y="382" font-size="8" font-weight="700" fill="#A51C30" text-anchor="middle">UNAUDITED MOTOR PROPOSAL</text>
<text x="817.0" y="398" font-size="7.5" fill="#475569" text-anchor="middle">Direct Joint Torques / Voltages</text>
<text x="817.0" y="414" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">Enforcer Must Catch ALL Errors</text>
<text x="817.0" y="430" font-size="7" fill="#64748B" text-anchor="middle">At 1 kHz without context</text>
<rect x="20" y="488" width="900" height="56" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="470.0" y="506" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">ARCHITECTURAL TAKEAWAY: COLLAPSING STAGES CONCEALS BUT DOES NOT ELIMINATE HAZARDS</text>
<text x="470.0" y="522" font-size="8.5" fill="#475569" text-anchor="middle">Modular contracts allow each boundary to refuse invalid inputs before they consume compute or threaten physical safety.</text>
<text x="470.0" y="534" font-size="8.5" fill="#475569" text-anchor="middle">An end-to-end model transfers the entire burden of sensory validation, state estimation, and lease audit onto low-level reflex filters.</text>
</svg>
