<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <style>
      .title-left { font-family: "Avenir Next", "Source Sans 3", sans-serif; font-weight: 700; font-size: 14.5px; fill: #FFFFFF; }
      .title-right { font-family: "Avenir Next", "Source Sans 3", sans-serif; font-weight: 600; font-size: 12px; fill: #D0E0FF; }
      .title-right-mcu { font-family: "Avenir Next", "Source Sans 3", sans-serif; font-weight: 600; font-size: 12px; fill: #FFE0E0; }
      .box-title { font-family: "Avenir Next", "Source Sans 3", sans-serif; font-weight: 600; font-size: 13px; fill: #1F407A; }
      .text-main { font-family: "STIX Two Text", serif; font-size: 13.5px; fill: #222222; }
      .text-sub { font-family: "STIX Two Text", serif; font-size: 12px; fill: #555555; }
      .badge-text { font-family: "Menlo", "IBM Plex Mono", monospace; font-weight: 700; font-size: 12.5px; fill: #FFFFFF; }
      .bus-text { font-family: "Avenir Next", "Source Sans 3", sans-serif; font-weight: 600; font-size: 13px; fill: #B87333; }
      .desc-title { font-family: "Avenir Next", "Source Sans 3", sans-serif; font-weight: 700; font-size: 12.5px; }
      .desc-text { font-family: "STIX Two Text", serif; font-size: 12px; fill: #333333; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F407A"/>
    </marker>
    <marker id="arrow-copper" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B87333"/>
    </marker>
    <marker id="arrow-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A51C30"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#007A87"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="640" fill="#FFFFFF"/>

  <!-- Top Ingestion Source -->
  <g transform="translate(180, 18)">
    <rect x="0" y="0" width="400" height="38" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.5"/>
    <text x="200" y="24" text-anchor="middle" class="box-title">Human Demonstrator / Teleoperation Master / Neural Policy</text>
  </g>

  <line x1="380" y1="56" x2="380" y2="78" stroke="#1F407A" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ================= LINUX MPU TIER ================= -->
  <g transform="translate(30, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="700" height="195" rx="8" fill="#F8FAFD" stroke="#1F407A" stroke-width="1.8"/>
    <path d="M 0 8 Q 0 0 8 0 L 692 0 Q 700 0 700 8 L 700 36 L 0 36 Z" fill="#1F407A"/>
    <text x="20" y="23" class="title-left">LINUX MPU (Application Processor · 50 Hz Cadence)</text>
    <text x="680" y="23" text-anchor="end" class="title-right">System 2 Deliberation</text>

    <!-- Pipeline Rows -->
    <g transform="translate(20, 52)">
      <circle cx="6" cy="10" r="3.5" fill="#1F407A"/>
      <text x="20" y="14" class="text-main">Multi-Camera Frame Ingestion &amp; Time-Sync</text>
      <text x="310" y="14" class="text-sub">(USB 3.0 / MIPI CSI-2 Ring Buffers @ 30–60 Hz)</text>
    </g>

    <g transform="translate(20, 86)">
      <circle cx="6" cy="10" r="3.5" fill="#1F407A"/>
      <text x="20" y="14" class="text-main">Operator Master Input / Policy Action Proposal</text>
      <line x1="345" y1="10" x2="435" y2="10" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
      <rect x="445" y="-3" width="75" height="26" rx="5" fill="#1F407A"/>
      <text x="482" y="14" text-anchor="middle" class="badge-text">a_req</text>
      <text x="535" y="14" class="text-sub">Raw Operator Intent</text>
    </g>

    <g transform="translate(20, 120)">
      <circle cx="6" cy="10" r="3.5" fill="#1F407A"/>
      <text x="20" y="14" class="text-main">Kinematic Retargeting &amp; Cartesian Limit Filter</text>
      <line x1="345" y1="10" x2="435" y2="10" stroke="#5B4B8A" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
      <rect x="445" y="-3" width="75" height="26" rx="5" fill="#5B4B8A"/>
      <text x="482" y="14" text-anchor="middle" class="badge-text">a_cmd</text>
      <text x="535" y="14" class="text-sub">Mapped Setpoint</text>
    </g>

    <g transform="translate(20, 154)">
      <circle cx="6" cy="10" r="3.5" fill="#1F407A"/>
      <text x="20" y="14" class="text-main">RPMSG Intent Packetization with Expiring Lease</text>
      <text x="350" y="14" class="text-sub">(Payload: a_cmd, timestamp, lease_ttl = 20 ms, CRC32)</text>
    </g>
  </g>

  <!-- ================= INTER-PROCESSOR BUS ================= -->
  <g transform="translate(30, 285)">
    <rect x="200" y="5" width="360" height="34" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="380" y="27" text-anchor="middle" class="bus-text">RPMSG Zero-Copy Mailbox over Shared SRAM</text>
    <line x1="380" y1="-10" x2="380" y2="5" stroke="#B87333" stroke-width="2.5" marker-end="url(#arrow-copper)"/>
    <line x1="380" y1="39" x2="380" y2="54" stroke="#B87333" stroke-width="2.5" marker-end="url(#arrow-copper)"/>
  </g>

  <!-- ================= REAL-TIME MCU TIER ================= -->
  <g transform="translate(30, 350)" filter="url(#shadow)">
    <rect x="0" y="0" width="700" height="195" rx="8" fill="#FDF8F8" stroke="#A51C30" stroke-width="1.8"/>
    <path d="M 0 8 Q 0 0 8 0 L 692 0 Q 700 0 700 8 L 700 36 L 0 36 Z" fill="#A51C30"/>
    <text x="20" y="23" class="title-left">REAL-TIME MCU (Bare-Metal RTOS · 1000 Hz Cadence)</text>
    <text x="680" y="23" text-anchor="end" class="title-right-mcu">System 1 Safety Referee</text>

    <!-- Pipeline Rows -->
    <g transform="translate(20, 52)">
      <circle cx="6" cy="10" r="3.5" fill="#A51C30"/>
      <text x="20" y="14" class="text-main">Safety Barrier Enforcement (CBF-QP) &amp; Torque Clamps</text>
      <line x1="345" y1="10" x2="435" y2="10" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arrow-crimson)"/>
      <rect x="445" y="-3" width="75" height="26" rx="5" fill="#A51C30"/>
      <text x="482" y="14" text-anchor="middle" class="badge-text">a_enf</text>
      <text x="535" y="14" class="text-sub">Governed Command</text>
    </g>

    <g transform="translate(20, 86)">
      <circle cx="6" cy="10" r="3.5" fill="#A51C30"/>
      <text x="20" y="14" class="text-main">Hardware Watchdog &amp; Intent Lease Expiration Check</text>
      <text x="370" y="14" class="text-sub">(Trips Safe Stop if delta_t &gt; lease_ttl)</text>
    </g>

    <g transform="translate(20, 120)">
      <circle cx="6" cy="10" r="3.5" fill="#A51C30"/>
      <text x="20" y="14" class="text-main">Field-Oriented Current Control &amp; Inverter PWM Gate Drives</text>
      <text x="400" y="14" class="text-sub">(SVPWM @ 20 kHz, Phase Currents I_u,v,w)</text>
    </g>

    <g transform="translate(20, 154)">
      <circle cx="6" cy="10" r="3.5" fill="#1B6B48"/>
      <text x="20" y="14" class="text-main">Optical Encoder &amp; Shunt Telemetry Feedback Ingestion</text>
      <line x1="345" y1="10" x2="435" y2="10" stroke="#1B6B48" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
      <rect x="445" y="-3" width="75" height="26" rx="5" fill="#1B6B48"/>
      <text x="482" y="14" text-anchor="middle" class="badge-text">a_meas</text>
      <text x="535" y="14" class="text-sub">Delivered Dynamics</text>
    </g>
  </g>

  <!-- Output Arrow to Plant -->
  <line x1="380" y1="545" x2="380" y2="570" stroke="#007A87" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Physical Plant Base -->
  <g transform="translate(130, 572)">
    <rect x="0" y="0" width="500" height="42" rx="6" fill="#EDF7F7" stroke="#007A87" stroke-width="1.8"/>
    <text x="250" y="26" text-anchor="middle" class="box-title" fill="#007A87">PHYSICAL PLANT &amp; SENSORS (Motors, Harmonic Drives, Workpiece Contacts)</text>
  </g>

  <!-- ================= RIGHT-SIDE LEGEND & ANNOTATIONS ================= -->
  <g transform="translate(755, 80)">
    <rect x="0" y="0" width="215" height="465" rx="8" fill="#FAFAFA" stroke="#D5D5D5" stroke-width="1"/>
    <text x="107.5" y="26" text-anchor="middle" class="box-title" font-size="13px">THE 4-STREAM TUPLE</text>
    <line x1="15" y1="36" x2="200" y2="36" stroke="#E0E0E0" stroke-width="1"/>

    <!-- Tap 1 -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#1F407A"/>
      <text x="27.5" y="15" text-anchor="middle" class="badge-text" font-size="11.5px">a_req</text>
      <text x="62" y="15" class="desc-title" fill="#1F407A">Requested</text>
      <text x="0" y="32" class="desc-text">Raw operator / policy intent</text>
      <text x="0" y="46" class="desc-text">prior to software checks.</text>
    </g>

    <!-- Tap 2 -->
    <g transform="translate(15, 122)">
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#5B4B8A"/>
      <text x="27.5" y="15" text-anchor="middle" class="badge-text" font-size="11.5px">a_cmd</text>
      <text x="62" y="15" class="desc-title" fill="#5B4B8A">Mapped</text>
      <text x="0" y="32" class="desc-text">Cartesian/joint setpoint</text>
      <text x="0" y="46" class="desc-text">after kinematic retargeting.</text>
    </g>

    <!-- Tap 3 -->
    <g transform="translate(15, 194)">
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#A51C30"/>
      <text x="27.5" y="15" text-anchor="middle" class="badge-text" font-size="11.5px">a_enf</text>
      <text x="62" y="15" class="desc-title" fill="#A51C30">Enforced</text>
      <text x="0" y="32" class="desc-text">Safety-governed command</text>
      <text x="0" y="46" class="desc-text">after barrier/current clamps.</text>
    </g>

    <!-- Tap 4 -->
    <g transform="translate(15, 266)">
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#1B6B48"/>
      <text x="27.5" y="15" text-anchor="middle" class="badge-text" font-size="11.5px">a_meas</text>
      <text x="62" y="15" class="desc-title" fill="#1B6B48">Measured</text>
      <text x="0" y="32" class="desc-text">Actual delivered response</text>
      <text x="0" y="46" class="desc-text">(encoders, current shunts).</text>
    </g>

    <line x1="15" y1="332" x2="200" y2="332" stroke="#E0E0E0" stroke-width="1"/>

    <!-- Key Invariant Note -->
    <g transform="translate(15, 348)">
      <text x="0" y="16" class="desc-title" fill="#A51C30" font-size="11.5px">LOGGING INVARIANT:</text>
      <text x="0" y="32" class="desc-text" font-size="11px">Logging only a_req bakes</text>
      <text x="0" y="46" class="desc-text" font-size="11px">unexecutable drift into loss.</text>
      <text x="0" y="64" class="desc-text" font-size="11px">Logging only a_meas bakes</text>
      <text x="0" y="78" class="desc-text" font-size="11px">mechanical compliance and</text>
      <text x="0" y="92" class="desc-text" font-size="11px">backlash as human skill.</text>
    </g>
  </g>
</svg>