<rect width="1000" height="580" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="500.0" y="28" class="title">COVARIATE SHIFT COMPOUNDING ERROR FLYWHEEL &amp; RECOVERY DYNAMICS</text>
<text x="500.0" y="45" class="subtitle">Quadratic Divergence O(T²ε) in Naive Behavioral Cloning vs Linear Bounded Tube O(Tε) in DAgger Corrective Aggregation</text>
<rect x="24" y="68" width="460" height="240" rx="8" fill="#DC2626" fill-opacity="0.03" stroke="#DC2626" stroke-width="1.2"/>
<rect x="24" y="68" width="460" height="26" rx="8" fill="#DC2626" fill-opacity="0.12"/>
<text x="38" y="86" font-size="10" font-weight="700" fill="#DC2626">✕ NAIVE BEHAVIORAL CLONING (OPEN-LOOP DRIFT FLYWHEEL)</text>
<text x="470" y="86" font-size="9.5" font-weight="700" fill="#A51C30" text-anchor="end">Error: O(T²ε)</text>
<rect x="40" y="106" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="122" font-size="8.5" font-weight="700" fill="#1A202C">1. Single-Step Perturbation ε</text>
<text x="48" y="136" font-size="7.5" fill="#475569">Friction / torque / sensor noise</text>
<line x1="235" y1="127" x2="265" y2="127" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-coral)"/>
<rect x="269" y="106" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="277" y="122" font-size="8.5" font-weight="700" fill="#DC2626">2. State Exits Support</text>
<text x="277" y="136" font-size="7.5" fill="#475569">s_(t+1) ∉ supp(d^π*)</text>
<line x1="366.5" y1="148" x2="366.5" y2="170" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-coral)"/>
<rect x="269" y="170" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="277" y="186" font-size="8.5" font-weight="700" fill="#DC2626">3. Arbitrary Action â</text>
<text x="277" y="200" font-size="7.5" fill="#475569">Zero constraint from ERM loss</text>
<line x1="269" y1="191" x2="239" y2="191" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-coral)"/>
<rect x="40" y="170" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2"/>
<text x="48" y="186" font-size="8.5" font-weight="700" fill="#A51C30">4. Amplified Deviation</text>
<text x="48" y="200" font-size="7.5" fill="#475569">Pushed further off-manifold</text>
<line x1="137.5" y1="170" x2="137.5" y2="148" stroke="#A51C30" stroke-width="1.3" marker-end="url(#arr-crimson)"/>
<rect x="40" y="224" width="428" height="72" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="242" font-size="8.5" font-weight="700" fill="#A51C30">Mathematical Compounding Mechanism:</text>
<text x="48" y="261" font-size="8" font-family="monospace" fill="#1A202C">E[Error_BC] ≤ ∑ t·ε = [T(T+1)/2]·ε = O(T²ε)</text>
<text x="48" y="279" font-size="7.5" fill="#475569">Example (T = 500 steps, ε = 0.01) ⇒ Cumulative Error Factor = 2,500×</text>
<rect x="24" y="320" width="460" height="240" rx="8" fill="#10B981" fill-opacity="0.03" stroke="#10B981" stroke-width="1.2"/>
<rect x="24" y="320" width="460" height="26" rx="8" fill="#10B981" fill-opacity="0.12"/>
<text x="38" y="338" font-size="10" font-weight="700" fill="#007A87">✓ CORRECTIVE AGGREGATION / DAgger (STABILIZING FLYWHEEL)</text>
<text x="470" y="338" font-size="9.5" font-weight="700" fill="#10B981" text-anchor="end">Error: O(Tε)</text>
<rect x="40" y="358" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="374" font-size="8.5" font-weight="700" fill="#1A202C">1. Policy Visits s ~ d_policy</text>
<text x="48" y="388" font-size="7.5" fill="#475569">Learner visits perturbed state</text>
<line x1="235" y1="379" x2="265" y2="379" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-teal)"/>
<rect x="269" y="358" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2"/>
<text x="277" y="374" font-size="8.5" font-weight="700" fill="#007A87">2. Expert Labels π*(s)</text>
<text x="277" y="388" font-size="7.5" fill="#475569">Recovery action demonstrated</text>
<line x1="366.5" y1="400" x2="366.5" y2="422" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-teal)"/>
<rect x="269" y="422" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
<text x="277" y="438" font-size="8.5" font-weight="700" fill="#10B981">3. Aggregate to Dataset D</text>
<text x="277" y="452" font-size="7.5" fill="#475569">supp(D) ⊇ recovery corridor</text>
<line x1="269" y1="443" x2="239" y2="443" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-teal)"/>
<rect x="40" y="422" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2"/>
<text x="48" y="438" font-size="8.5" font-weight="700" fill="#007A87">4. Closed-Loop Recovery</text>
<text x="48" y="452" font-size="7.5" fill="#475569">Restoring torque restores state</text>
<line x1="137.5" y1="422" x2="137.5" y2="400" stroke="#007A87" stroke-width="1.3" marker-end="url(#arr-petrol)"/>
<rect x="40" y="476" width="428" height="72" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="494" font-size="8.5" font-weight="700" fill="#007A87">Mathematical Linear Bounded Corridor:</text>
<text x="48" y="513" font-size="8" font-family="monospace" fill="#1A202C">E[Error_CA] ≤ T·ε = O(Tε)  [Ross &amp; Bagnell 2011]</text>
<text x="48" y="531" font-size="7.5" fill="#475569">Example (T = 500 steps, ε = 0.01) ⇒ Cumulative Error Factor = 5.0× (500× reduction!)</text>
<rect x="504" y="68" width="472" height="492" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="504" y="68" width="472" height="26" rx="8" fill="#1F407A" fill-opacity="0.08"/>
<text x="518" y="86" font-size="10" font-weight="700" fill="#1F407A">TRAJECTORY DIVERGENCE &amp; INTERVENTION CUT BOUNDARY</text>
<rect x="559" y="118" width="390" height="26" fill="#DC2626" fill-opacity="0.1"/>
<line x1="559" y1="144" x2="949" y2="144" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,2"/>
<text x="567" y="134" font-size="7.5" font-weight="700" fill="#DC2626">HARDWARE HAZARD / E-STOP BOUNDARY (+12.0 mm)</text>
<rect x="559" y="217" width="390" height="32" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="0.8" stroke-dasharray="3,2"/>
<text x="941" y="227" font-size="7" font-weight="700" fill="#10B981" text-anchor="end">Nominal Operating Corridor [±1.5 mm]</text>
<line x1="559" y1="233" x2="964" y2="233" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
<text x="964" y="247" font-size="7.5" font-weight="600" fill="#475569" text-anchor="end">Time t (s) →</text>
<line x1="559" y1="278" x2="559" y2="118" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
<text x="524" y="193" font-size="8" font-weight="600" fill="#475569" transform="rotate(-90 524 193)" text-anchor="middle">Tracking Error e(t) (mm) →</text>
<line x1="559" y1="233" x2="949" y2="233" stroke="#007A87" stroke-width="2"/>
<text x="569" y="229" font-size="7.5" font-weight="700" fill="#007A87">π* Nominal Target</text>
<rect x="644" y="144" width="85" height="124" fill="#DC2626" fill-opacity="0.12"/>
<line x1="644" y1="144" x2="644" y2="273" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="729" y1="144" x2="729" y2="273" stroke="#5B4B8A" stroke-width="1.2" stroke-dasharray="3,3"/>
<path d="M 559 233 L 644 233 Q 719 191 784 144" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="5,2"/>
<text x="789" y="157" font-size="7.5" font-weight="700" fill="#DC2626">Naive BC: O(T²) Runaway</text>
<path d="M 644 233 Q 724 187 729 185 Q 779 181 839 233" fill="none" stroke="#10B981" stroke-width="2.5"/>
<circle cx="644" cy="233" r="4.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="644" y="261" font-size="8" font-weight="700" fill="#DC2626" text-anchor="middle">t_div</text>
<text x="644" y="271" font-size="6.5" fill="#64748B" text-anchor="middle">(Divergence)</text>
<circle cx="729" cy="185" r="5" fill="#5B4B8A" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="729" y="175" font-size="7.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">t_takeover (Override)</text>
<text x="729" y="261" font-size="8" font-weight="700" fill="#5B4B8A" text-anchor="middle">t_take</text>
<text x="729" y="271" font-size="6.5" fill="#64748B" text-anchor="middle">(Intervention)</text>
<circle cx="839" cy="233" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="839" y="261" font-size="8" font-weight="700" fill="#10B981" text-anchor="middle">t_rec</text>
<text x="839" y="271" font-size="6.5" fill="#64748B" text-anchor="middle">(Recovered)</text>
<line x1="646" y1="287" x2="727" y2="287" stroke="#DC2626" stroke-width="1.2"/>
<polyline points="646,284 646,290" fill="none" stroke="#DC2626" stroke-width="1.2"/>
<polyline points="727,284 727,290" fill="none" stroke="#DC2626" stroke-width="1.2"/>
<text x="686.5" y="299" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">Reaction Delay (300-800 ms)</text>
<rect x="516" y="343" width="448" height="195" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="526" y="361" font-size="9" font-weight="700" fill="#1F407A">THE 3 DATA CURATION LAWS FOR PHYSICAL INTERVENTIONS:</text>
<circle cx="530" cy="376" r="3.5" fill="#DC2626"/>
<text x="540" y="379" font-size="8" font-weight="700" fill="#1A202C">1. Truncate Autonomous Rollout at t_div (NOT t_takeover):</text>
<text x="540" y="392" font-size="7.2" fill="#475569">Cut rollout where policy drifted. Prevents neural networks from</text>
<text x="540" y="403" font-size="7.2" fill="#475569">learning that approaching a hazard precedes goal completion.</text>
<circle cx="530" cy="428" r="3.5" fill="#A51C30"/>
<text x="540" y="431" font-size="8" font-weight="700" fill="#1A202C">2. Discard Corrupted Drift Interval [t_div, t_takeover]:</text>
<text x="540" y="444" font-size="7.2" fill="#475569">Purge 30-80 frames logged during human reaction delay. These</text>
<text x="540" y="455" font-size="7.2" fill="#475569">transitions contain divergent commands falsely logged as nominal.</text>
<circle cx="530" cy="480" r="3.5" fill="#10B981"/>
<text x="540" y="483" font-size="8" font-weight="700" fill="#1A202C">3. Ingest Recovery Demonstration [t_takeover, t_rec] into DAgger Buffer:</text>
<text x="540" y="496" font-size="7.2" fill="#475569">Treat rescue as expert feedback on policy distribution d_policy,</text>
<text x="540" y="507" font-size="7.2" fill="#475569">expanding support to recovery corridor and bounding error to O(Tε).</text>
</svg>
