<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="920" height="460" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="460.0" y="28" class="title">THE FIVE COGNITIVE STAGES OF PHYSICAL AGENTS</text>
<text x="460.0" y="44" class="subtitle">From Continuous Physical Transduction to Real-Time Discrete Action Invariant Enforcement</text>
<rect x="12.0" y="70" width="168" height="320" rx="6" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="12.0" y="70" width="168" height="22" rx="6" fill="#1F407A" fill-opacity="0.12"/>
<text x="96.0" y="85" font-size="8" font-weight="700" fill="#1F407A" text-anchor="middle">STAGE 1: TRANSDUCTION</text>
<text x="96.0" y="108" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Physical Photons →</text>
<text x="96.0" y="121" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Metric Tensors</text>
<text x="20.0" y="144" font-size="8" fill="#475569">• CMOS exposure · IMU sense</text>
<text x="20.0" y="160" font-size="8" fill="#475569">• MIPI zero-copy DMA views</text>
<line x1="181.0" y1="230.0" x2="193.0" y2="230.0" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="194.0" y="70" width="168" height="320" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="194.0" y="70" width="168" height="22" rx="6" fill="#215CAF" fill-opacity="0.12"/>
<text x="278.0" y="85" font-size="8" font-weight="700" fill="#215CAF" text-anchor="middle">STAGE 2: WORLD MODELING</text>
<text x="278.0" y="108" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Latent Belief &amp;</text>
<text x="278.0" y="121" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">SE(3) Frame Tree</text>
<text x="202.0" y="144" font-size="8" fill="#475569">• Dynamic transforms · Spatial map</text>
<text x="202.0" y="160" font-size="8" fill="#475569">• JEPA physics &amp; occlusion tracking</text>
<line x1="363.0" y1="230.0" x2="375.0" y2="230.0" stroke="#215CAF" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="376.0" y="70" width="168" height="320" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="376.0" y="70" width="168" height="22" rx="6" fill="#215CAF" fill-opacity="0.12"/>
<text x="460.0" y="85" font-size="8" font-weight="700" fill="#215CAF" text-anchor="middle">STAGE 3: REASONING &amp; INTENT</text>
<text x="460.0" y="108" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Goal Grounding &amp;</text>
<text x="460.0" y="121" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Expiring Leases</text>
<text x="384.0" y="144" font-size="8" fill="#475569">• Edge VLM semantic spatial deliberation</text>
<text x="384.0" y="160" font-size="8" fill="#475569">• Coarse 3D target box + lease t_expire</text>
<line x1="545.0" y1="230.0" x2="557.0" y2="230.0" stroke="#215CAF" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="558.0" y="70" width="168" height="320" rx="6" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="558.0" y="70" width="168" height="22" rx="6" fill="#B87333" fill-opacity="0.12"/>
<text x="642.0" y="85" font-size="8" font-weight="700" fill="#B87333" text-anchor="middle">STAGE 4: ACTION PLANNING</text>
<text x="642.0" y="108" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Generative Action</text>
<text x="642.0" y="121" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Chunking (H=16)</text>
<text x="566.0" y="144" font-size="8" fill="#475569">• Diffusion / ACT trajectory synthesis</text>
<text x="566.0" y="160" font-size="8" fill="#475569">• C² continuous quintic spline ensembling</text>
<line x1="727.0" y1="230.0" x2="739.0" y2="230.0" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="740.0" y="70" width="168" height="320" rx="6" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="740.0" y="70" width="168" height="22" rx="6" fill="#007A87" fill-opacity="0.12"/>
<text x="824.0" y="85" font-size="8" font-weight="700" fill="#007A87" text-anchor="middle">STAGE 5: REAL-TIME REFLEX</text>
<text x="824.0" y="108" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Deterministic</text>
<text x="824.0" y="121" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Barrier Enforcement</text>
<text x="748.0" y="144" font-size="8" fill="#475569">• 1 kHz FreeRTOS QP solver: h(x) ≥ 0</text>
<text x="748.0" y="160" font-size="8" fill="#475569">• Dynamic stopping check · Fallback FSM</text>
<rect x="12.0" y="402" width="896" height="42" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="460.0" y="420" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">THE COGNITIVE PIPELINE PRINCIPLE</text>
<text x="460.0" y="434" font-size="8.5" fill="#475569" text-anchor="middle">High-level cognitive models propose intentions over long horizons; low-level reflex circuits guarantee physical safety over microsecond steps.</text>
</svg>
