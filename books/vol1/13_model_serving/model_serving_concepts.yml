  formulas:
    - 'System efficiency: sum(T_compute) / (wall clock time * resource count)'
    - 'Little''s Law: N_req = lambda * T_lat'
    - 'Count-triggered batch latency: W_total ~= (B - 1) / (2 * lambda) + T_inf(B)'
    - 'Traffic-adaptive batching window: T_window ~= min(L_lat,SLO - S, sqrt(S / lambda))'
    - 'M/M/1 time in system: W = 1 / (mu - lambda) = service time / (1 - rho)'
    - 'p99 latency: W_p99 ~= 4.6 * service time / (1 - rho)'
    - 'Poisson expected batch size: E[batch size] = lambda * T'
    - 'Precision-throughput upper bound for memory-bound kernels: Throughput_INT8 / Throughput_FP32 <= 32 / 8'
    - 'Speculative decoding: E[tokens per target pass] = (1 - alpha^(k+1)) / (1 - alpha)'
    - 'KV cache per token: 2 * layers * KV heads * head dim * bytes per element'
    - 'Token generation time: T_token ~= model size bytes / memory bandwidth bytes per second'
    - \frac{X(r_2)}{X(r_1)} = \left(\frac{r_1}{r_2}\right)^2
    - \text{System Efficiency} = \frac{\sum T_{\text{compute}}}{\text{Wall Clock Time} \times \text{Resource Count}}
    - N_{\text{req}} = \lambda \cdot T_{\text{lat}}
    - W_{\text{total}} \approx \underbrace{ \frac{B-1}{2\lambda} }_{\text{Formation Delay}} + \underbrace{ T_{\text{inf}}(B)
      }_{\text{Inference Time}}
    - W = \frac{1}{\mu - \lambda} = \frac{\text{service time}}{1 - \rho}
