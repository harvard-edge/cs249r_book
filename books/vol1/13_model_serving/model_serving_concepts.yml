concept_map:
  schema_version: 2
  source: 13_model_serving.qmd
  generated_date: '2026-10-13'
  primary_concepts:
    - Serving inverts training
    - Latency budget
    - Queueing sets headroom
    - Batching trades latency for throughput
    - LLM serving phases
    - KV cache budget bounds concurrency
  secondary_concepts:
    - Static vs dynamic inference
    - Cold start and model loading
    - Runtime and precision selection
    - Host-path optimization
    - Serving economics
    - Speculative decoding
  claims:
    Serving inverts training: Once a model answers live requests the objective flips from long-run throughput to
      per-request latency at an SLO percentile, batch-one execution exposes weight traffic and launch overhead,
      and the machine target shifts from maximum utilization to headroom.
    Latency budget: End-to-end latency is a zero-sum budget spent serially on ingress, deserialization, preprocessing,
      transfer, queueing, inference, postprocessing, and egress and met at a stated quantile, so a faster model
      yields far less end-to-end gain when host stages dominate.
    Queueing sets headroom: Little's law sizes the in-flight population and the M/M/1 model shows time in system
      rising nonlinearly with utilization, so capacity is sized as the utilization a percentile SLO permits, and
      under overload only admission control or graceful degradation preserve latency.
    Batching trades latency for throughput: Batching amortizes fixed per-batch costs so saturated capacity grows
      almost linearly while fixed cost dominates, but every request pays formation delay, dynamic batching bounds
      it with a size-or-timeout trigger, and latency, memory, or the engine cap, not throughput, sets the largest
      useful batch.
    LLM serving phases: Token streaming splits latency into time to first token (prefill) and time per output token
      (decode), batching decode shares the weight stream but not cache reads, continuous batching reclaims slots
      as sequences end, and chunked prefill bounds the stall a long prompt imposes on active decodes.
    KV cache budget bounds concurrency: After weights, remaining device memory divided by per-conversation cache
      bytes sets how many conversations one accelerator holds, so context length and batch trade against each other,
      and paged allocation, prefix caching, and offloading change that budget.
    Static vs dynamic inference: Static (offline, batch) inference precomputes predictions into a store and runs
      throughput-first, while dynamic (online, real-time) inference evaluates inputs on demand inside the request
      path under the latency budget its SLO sets.
    Cold start and model loading: A new replica pays weight transfer, context creation, graph compilation, allocation,
      and warmup before its first useful request, so autoscaled capacity arrives late, and precompiled engines,
      memory-mapped formats, and warm pools shorten it.
    Runtime and precision selection: The deployment target narrows the runtime family and export coverage decides
      feasibility, and at batch one most of the speedup over eager execution comes from removing per-operation dispatch,
      while lower precision pays at large batch subject to calibration.
    Host-path optimization: Between socket and silicon a request crosses graph-to-kernel, host-to-accelerator, CPU,
      and storage boundaries, and timeline profiling locates which binds (idle bubbles, launch trains, synchronous
      copies, OS noise).
    Serving economics: Cost per inference is allocated hourly cost over completed inferences that meet the SLO,
      so the cheapest hardware at saturation wins only above a breakeven sustained load and capacity is sized from
      SLO-qualified throughput.
    Speculative decoding: A small draft model proposes several tokens that the target model verifies in one pass,
      yielding more than one token per target weight stream at batch one when the acceptance rate is high.
