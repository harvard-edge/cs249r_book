  learner_graph:
    schema_version: 1
    concepts:
    - id: vol1.serving.latency
      label: Request latency
      teaches: Latency budget
      summary: The elapsed time from arrival to response includes waiting, host work, and model execution.
        The target applies to the complete request.
      section: sec-model-serving-request-lifecycle-d9c6
    - id: vol1.serving.queue
      label: Queueing delay
      teaches: Queueing sets headroom
      summary: Requests wait when arrivals compete for busy resources. Near saturation, small increases
        in utilization can produce large increases in waiting.
      section: sec-model-serving-utilizationlatency-relationship-a2f0
    - id: vol1.serving.formation
      label: Batch formation delay
      teaches: Batching trades latency for throughput
      summary: A request may wait while the server collects a batch. This delay spends latency allowance
        before the model runs.
      section: sec-model-serving-batching-tax
    - id: vol1.serving.execution
      label: Model execution time
      teaches: Latency budget
      summary: Execution includes arithmetic and moving operands. A resource bound gives a lower limit;
        profiling explains additional overhead.
      section: sec-model-serving-latency-budget-ef40
    - id: vol1.serving.host
      label: Host-path overhead
      teaches: Host-path optimization
      summary: Serialization, preprocessing, transfers, and runtime dispatch can dominate the request path
        even when accelerator kernels are fast.
      section: sec-model-serving-serving-tax-bill-dc6c
    - id: vol1.serving.utilization
      label: Utilization
      teaches: Queueing sets headroom
      summary: Utilization compares offered work with available service capacity. High utilization leaves
        little room for variation in arrivals and execution.
      section: sec-model-serving-utilizationlatency-relationship-a2f0
    - id: vol1.serving.batching
      label: Batching
      teaches: Batching trades latency for throughput
      summary: Grouping requests shares fixed work and can reuse weights. It can improve capacity while
        adding formation delay; the useful batch is constrained by latency and memory.
      section: sec-model-serving-batching-helps-f1dc
    - id: vol1.serving.arrivals
      label: Arrival rate
      teaches: Queueing sets headroom
      summary: At fixed service capacity, a higher request arrival rate raises utilization. Burstiness also
        matters for waiting.
      section: sec-model-serving-utilizationlatency-relationship-a2f0
    - id: vol1.serving.capacity
      label: Serving capacity
      teaches: Queueing sets headroom
      summary: Service capacity is the rate at which the system can complete work under a specified workload.
        The latency target constrains how much of that capacity can be used.
      section: sec-model-serving-capacity-planning-96a3
    - id: vol1.serving.bytes
      label: Weight bytes moved
      teaches: LLM serving phases
      summary: At small decode batches, repeatedly reading model weights can dominate execution. Sharing
        a weight stream across requests amortizes that traffic.
      section: sec-model-serving-decode-floor-7d3a
    - id: vol1.serving.concurrency
      label: Resident conversations
      teaches: KV cache budget bounds concurrency
      summary: Memory remaining after model weights must hold the attention state of every resident conversation.
      section: sec-model-serving-kv-budget-e81c
    - id: vol1.serving.kv
      label: KV cache per conversation
      teaches: KV cache budget bounds concurrency
      summary: Attention keys and values retained for one conversation grow with its token count and model
        geometry.
      section: sec-model-serving-memory-kv-cache-d1ea
    - id: vol1.serving.context
      label: Context length
      teaches: KV cache budget bounds concurrency
      summary: Longer histories retain more token state. At fixed cache format and model geometry, the per-conversation
        KV footprint grows linearly.
      section: sec-model-serving-memory-kv-cache-d1ea
    - id: vol1.serving.pool
      label: Available KV memory
      teaches: KV cache budget bounds concurrency
      summary: The device memory left after weights and other resident state bounds the cache pool.
      section: sec-model-serving-kv-budget-e81c
    - id: vol1.serving.weights
      label: Model weight memory
      teaches: KV cache budget bounds concurrency
      summary: Resident weights compete with KV state for device memory. Reducing weight storage can free
        cache capacity, subject to runtime allocations.
      section: sec-model-serving-kv-budget-e81c
    - id: vol1.serving.prefill
      label: Prefill
      teaches: LLM serving phases
      summary: Processing the prompt creates attention state before the first output token is generated.
      section: sec-model-serving-performance-metrics-ttft-tpot-b009
    - id: vol1.serving.decode
      label: Decode
      teaches: LLM serving phases
      summary: Each generation step reads retained attention state and appends state for a new token.
      section: sec-model-serving-memory-kv-cache-d1ea
    - id: vol1.serving.ttft
      label: Time to first token
      teaches: LLM serving phases
      summary: The time before the first output token includes queueing and prompt processing, so it captures
        a different part of the interaction than output-token cadence.
      section: sec-model-serving-performance-metrics-ttft-tpot-b009
    - id: vol1.serving.tpot
      label: Time per output token
      teaches: LLM serving phases
      summary: The average interval between a request’s output tokens measures generation cadence.
      section: sec-model-serving-performance-metrics-ttft-tpot-b009
    - id: vol1.serving.paging
      label: Paged KV allocation
      teaches: KV cache budget bounds concurrency
      summary: Mapping fixed-size physical blocks to logical sequences reduces the waste of contiguous maximum-length
        reservation.
      section: sec-model-serving-pagedattention-b8d4
    - id: vol1.serving.prefix
      label: Prefix caching
      teaches: KV cache budget bounds concurrency
      summary: Compatible identical prefixes can reuse previously computed KV entries and avoid repeating
        prompt work.
      section: sec-model-serving-prefix-caching-offloading
    - id: vol1.serving.continuous
      label: Continuous batching
      teaches: LLM serving phases
      summary: Admitting work at generation boundaries lets the engine reclaim slots as sequences finish.
      section: sec-model-serving-continuous-batching-8bb6
