<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="69.8pt" height="35pt" viewBox="0 0 69.8 35" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="69.8" height="35" fill="#ffffff"/>
  <!-- ===== Linear ms scale: origin x=8.1, 0.1607 units/ms (ModelSwapCalc) =====
       50 ms SLO -> x=16.2 ; 312.5 ms model swap -> x=58.4 -->
  <!-- ── Beyond-the-SLO zone ── -->
  <rect x="16.2" y="1.4" width="44.2" height="32.2" fill="#f2d7d5" fill-opacity="0.36"/>
  <!-- ── Time axis ── -->
  <path d="M 8.1 18.2 L 58.4 18.2" fill="none" stroke="#cccccc" stroke-width="0.75" stroke-linecap="square"/>
  <!-- ── SLO wall ── -->
  <path d="M 16.2 33.6 L 16.2 1.4" fill="none" stroke="#cb202d" stroke-width="0.7" stroke-dasharray="2.6,1.1"/>
  <!-- ── Model load point ── -->
  <circle cx="58.4" cy="18.2" r="1.9" fill="#cb202d"/>
  <!-- ===== Labels ===== -->
  <text x="21.6" y="6.6" font-size="5" fill="#333333">model swap</text>
  <text x="14.6" y="10.1" text-anchor="end" font-size="4.8" fill="#cb202d">50 ms</text>
  <text x="14.6" y="15" text-anchor="end" font-size="4.8" fill="#cb202d">SLO</text>
  <text x="58.6" y="25.3" text-anchor="end" font-size="4.8" fill="#cb202d">load</text>
  <text x="58.6" y="30.2" text-anchor="end" font-size="4.8" fill="#cb202d">312.5 ms</text>
</svg>
