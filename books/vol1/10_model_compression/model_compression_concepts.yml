  claims:
    Accuracy-efficiency frontier: Structure-preserving changes can move a dominated model toward the accuracy-efficiency
      frontier at little quality cost while structure-altering ones trade along it, so the engineer stops at an
      operating point that meets explicit quality and resource thresholds rather than at a visual knee.
    Compression fits a deployment budget: A deployment budget grants memory, time, and energy per result, and compression
      works three tiers (what the model computes, how many bits each value takes, how the result executes) after
      identifying the binding term, since a phone vision model spends its frame on arithmetic and LLM decode spends
      its token on weight bytes.
    Structured vs unstructured pruning: Pruning removes the weights or structures with the smallest loss impact,
      but only structured removal (channels, heads, layers, or 2:4 groups) yields smaller dense or hardware-supported
      tensors, and scattered zeros saved in a dense tensor save nothing.
    Quantization regimes and the cliff: Accuracy holds on a plateau down to some bit width and then falls off a
      model-dependent cliff, so post-training quantization over a calibration set comes first and quantization-aware
      training is spent only when it misses the quality target.
    When fewer bits run faster: Fewer bits speed a compute-bound layer only through a faster integer datapath but
      speed a bandwidth-bound decode in proportion to bytes removed, and only when dequantization is fused into
      the matmul, so the same precision change gives different gains in different regimes.
    Combined techniques do not multiply: Compression techniques interact through shared distributions, shapes, and
      kernels, so the default order is structure first, distillation as recovery, quantization last, with profiling
      after each step, and a 2x prune times a 4x INT8 gives an 8x ratio on paper but a fraction of that measured.
    Measured deployment evidence: Parameter, FLOP, and bit-width reductions are upper bounds, so a compressed artifact
      is accepted only on a measured profile on the target (accuracy, calibration, latency, throughput, size, energy),
      and model-only speedups are capped by the non-model share of end-to-end latency.
    Affine quantization mechanics: Quantization maps a clipping range onto integer levels with a scale and zero-point,
      range calibration trades clipping against resolution, per-channel scales beat per-tensor when ranges differ,
      and integer matmuls accumulate in INT32 and requantize.
    Sparse storage break-even: Unstructured sparsity pays only past a break-even, since an index beside each value
      doubles per-element bytes and irregular gathers keep sparse kernels slower than dense until high sparsity,
      whereas 2:4 structured sparsity halves the payload with fixed metadata.
    Compression-specific fusion: 'Some fusions exist only once a graph is compressed: batch normalization folds
      into the preceding convolution''s weights and bias after structure stops changing, and weight-only kernels
      must dequantize in registers or a separate dequantize kernel restores the traffic quantization removed.'
    Knowledge distillation: A compact dense student trained on a teacher's temperature-softened outputs moves cost
      from repeated inference to one extra training phase, runs on ordinary dense kernels, and is bounded by student
      capacity and teacher calibration.
    Low-rank factorization: Truncated SVD replaces a matrix with two thin factors, but the saving becomes speed
      only if the two factor kernels and the staged intermediate cost less than the original dense kernel.
    Input-dependent computation and NAS: Early exit, conditional layers, and mixture-of-experts spend less work
      on easy inputs but fragment batched execution and keep all experts resident, while hardware-aware architecture
      search is justified only by unusual targets or deployment scale (awareness).
