    concepts:
    - id: vol1.compression.precision
      label: Weight precision
      teaches: When fewer bits run faster
      summary: Lower precision reduces the bytes needed for weights. It improves runtime only when the execution
        regime and kernel support let those saved bytes matter.
      section: sec-model-compression-performance-gains-0656
    - id: vol1.compression.quantization
      label: Quantization
      teaches: Quantization regimes and the cliff
      summary: Representing tensors at lower precision to reduce storage and traffic, subject to quality
        and runtime support.
      section: sec-model-compression-quantization-precision-cd46
    - id: vol1.compression.sparsity
      label: Weight sparsity
      teaches: Structured vs unstructured pruning
      summary: Zero-valued or removed weights whose storage and execution benefit depends on pattern, metadata,
        and sparse kernels.
      section: sec-model-compression-pruning-d1cb
    relationships:
    - id: vol1.compression.relation-14
      source: vol1.compression.precision
      target: vol1.serving.bytes
      predicate: sets byte width in
      explanation: The stored representation sets weight byte width; lower precision moves fewer bytes for
        a fixed weight stream.
      conditions: Fixed parameter count and representation overhead; runtime gains depend on kernel support
        and the binding resource.
      status: draft
      evidence:
        section: sec-model-compression-performance-gains-0656
        quote: Shrinking weights from 16 bits to 8 bits fails to speed up a compute-bound matrix multiplication
          if the processor lacks a faster 8-bit datapath, just as faster integer ALUs fail to speed up autoregressive
          decoding when latency is stalled on memory-bus transfers.
    - id: vol1.field.relation-28
      source: vol1.compression.quantization
      predicate: reduces
      target: vol1.compression.precision
      explanation: Quantization represents weights using fewer bits, reducing their storage and transfer
        volume.
      conditions: The precision scheme, metadata, and supported kernels determine the realized footprint.
      status: draft
      evidence:
        section: sec-model-compression-optimization-framework-9e21
        quote: Quantization maps floating-point values to 8-bit or 4-bit integers, which shrinks weight
          memory and bus traffic
    - id: vol1.field.relation-29
      source: vol1.compression.sparsity
      predicate: needs execution support to reduce
      target: vol1.system.execution
      explanation: Zeros alone do not provide speedup; storage and kernels must skip them efficiently.
      conditions: Pattern and metadata overhead matter; irregular sparse execution may be slower than dense.
      status: draft
      evidence:
        section: sec-model-compression-pruning-d1cb
        quote: A speedup requires a storage format and a kernel that skip the zeros, not merely a faster
          processor.
    maps: []

