  formulas:
    - 'Training time: O / (R_peak * eta_hw)'
    - 'Model FLOPs Utilization: C_model / (R_peak * T_step)'
    - 'Arithmetic intensity: FLOPs / bytes moved'
    - 'Training memory: weights + gradients + optimizer state + activations'
    - 'Activation memory per batch: B * sum_l(s_l + a_l)'
    - 'System throughput: min(R_pipeline, R_compute)'
    - 'Overlapped iteration time: max(t_fetch, t_process, t_transfer)'
    - 'Effective batch size: micro-batch * accumulation steps * devices'
    - 'Attention: softmax(QK^T / sqrt(d_k))V'
    - 'Checkpoint memory: kA + (L/k)A with k_opt = sqrt(L)'
    - 'Communication-overhead speedup: N / (1 + (N - 1)r)'
    - 'Training energy: E = P_device * T'
    - 'Ring AllReduce time: 2(N - 1)/N * V / B'
    - T_{\text{train}} = \frac{O}{R_{\text{peak}} \times \eta_{\text{hw}}}
    - \mathbf{A}^{(l)} = f\left(\mathbf{A}^{(l-1)}\mathbf{W}^{(l)} + \mathbf{b}^{(l)}\right)
    - \text{GELU}(x) = x \cdot \Phi(x) = x \cdot \frac{1}{2}\left[1 + \text{erf}\left(\frac{x}{\sqrt{2}}\right)\right]
