  claims:
    Training-time law: In the macroscopic D·A·M product form of the iron law, training work is about 6PD FLOPs (D tokens times 6P FLOPs per token) and run time is that work over peak rate times utilization,
      so every point of utilization recovered at constant power removes time, energy, and dollars in the same proportion,
      while memory sits outside the law as a feasibility gate.
    Model FLOPs utilization: MFU is useful model FLOPs per step over peak times measured step time and is the honest
      estimate of utilization, whereas the busy time a device monitor reports is only an upper bound, high for a
      memory-stalled job and low for a data-starved one.
    Training memory at scale: Mixed-precision Adam holds 16 bytes per parameter of static state (eight times the
      FP16 inference weights) before any activation, and only the activation term grows with batch and sequence
      length, which is what pushes a large model past one accelerator's memory.
    Mixed precision: Running eligible matrix products in FP16 or BF16 raises the attainable peak and halves activation
      bytes but leaves the 16 B/param static state unchanged, FP16 needs dynamic loss scaling to keep gradients
      above its normal floor while BF16 usually does not, and the speedup is bounded by the work that stays off
      the matrix units.
    Checkpointing and accumulation: Activation checkpointing recomputes segment interiors to cut activation memory
      from O(L) to O(sqrt L) for about one extra forward pass, and gradient accumulation builds a large effective
      batch from micro-batches that fit, reproducing the large-batch gradient only when losses are normalized consistently.
    Profile to find the binding term: Which technique helps depends on which resource is saturated, so the workflow
      is timeline first, then hardware counters, then one targeted fix and a re-profile, feasibility comes before
      speed, and a fix on a non-binding stage buys nothing.
    Fine-tuning scope: 'Training scope decides which memory terms exist: full fine-tuning of an 8B model needs about
      128 GB of static state, while adapters such as LoRA shrink gradients and optimizer state to well under one
      percent of parameters, and activations still follow the backward path through every frozen layer.'
    Training input pipeline: Training throughput is the minimum of host preparation rate, host-link rate, and compute
      rate, and overlap makes the step cost the maximum of the stage times but cannot raise the slowest stage, so
      workers, prefetch depth, and pinned memory are sized against measured demand.
    IO-aware attention: FlashAttention computes exact attention tile by tile in on-chip memory with online-softmax
      statistics and recomputes tiles in backward, dropping stored attention state from quadratic to linear in sequence
      length and cutting memory traffic without changing model FLOPs.
    Single-node data parallelism: Data parallelism replicates the model and averages gradients with AllReduce, whose
      per-device traffic depends on parameter count rather than batch, so splitting a fixed batch across one node's
      accelerators raises the share of unhidden synchronization unless it overlaps with backward.
    Sharding within one node: When per-replica state does not fit, ZeRO stages shard optimizer state, then gradients,
      then parameters across one node's accelerators, trading memory for communication, and layerwise model parallelism
      pays a pipeline bubble unless micro-batches are pipelined.
    Training checkpoints: A training checkpoint saves persistent state (weights, master copy, optimizer moments)
      plus scheduler, RNG, data position, and scaler state for exact resume, and checkpoint cadence trades save
      stalls against replayed work, so fault tolerance is a throughput decision.
