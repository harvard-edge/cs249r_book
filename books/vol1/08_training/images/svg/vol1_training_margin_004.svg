<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Linear decimal-GB scale: 172 px = 140 GB (1.2286 px/GB), origin x=2.
       Values from GPT2SummaryScalingRecap: batch 4 = 33.0 GB, batch 32 = 95.7 GB,
       V100 = 32 GiB = 34.4 GB; 70B FP16 weights = 140 GB (prose). -->
  <rect x="0" y="0" width="180" height="142" fill="#ffffff"/>
  <line x1="2" y1="18" x2="2" y2="138" stroke="#cccccc" stroke-width="1.5"/>
  <g fill="#006395" fill-opacity="0.92">
    <rect x="2" y="36" width="40.5" height="20"/>
    <rect x="2" y="76" width="117.6" height="20"/>
    <rect x="2" y="116" width="172" height="20"/>
  </g>
  <!-- Rows are GPT-2 (named in caption); the label line has no room for "GPT-2" plus the value. -->
  <g font-size="13" fill="#333333">
    <text x="49" y="31">batch 4 · <tspan font-weight="bold">33.0 GB</tspan></text>
    <text x="49" y="71">batch 32</text>
    <text x="49" y="111">70B FP16 weights</text>
  </g>
  <g font-size="13" fill="#ffffff" font-weight="bold" text-anchor="end">
    <text x="115" y="90.5">95.7 GB</text>
    <text x="170" y="130.5">140 GB</text>
  </g>
  <line x1="44.2" y1="17" x2="44.2" y2="139" stroke="#cb202d" stroke-width="2.2"/>
  <text x="49" y="13" font-size="13" font-weight="bold" fill="#cb202d">V100 · 34.4 GB</text>
</svg>
