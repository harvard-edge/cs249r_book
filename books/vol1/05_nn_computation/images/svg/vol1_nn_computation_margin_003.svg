<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="72.6pt" height="99.9pt" viewBox="0 0 72.6 99.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Transistor tax (illustrative ActivationLogic model): ReLU 50 vs sigmoid 2,500
       transistor-equivalents, ratio 50x. Log-scale bar lengths, 28.6 units per decade
       from a baseline of 20: ReLU 11.4, sigmoid 60.0. -->
  <rect x="0" y="0" width="72.6" height="99.9" fill="#ffffff"/>
  <!-- ===== Sigmoid bar (2,500) ===== -->
  <rect x="1.4" y="14.5" width="60.0" height="32.0" fill="#e67817" fill-opacity="0.92"/>
  <text x="59.4" y="32.4" text-anchor="end" font-size="5.2" fill="#ffffff">Sigmoid 2,500</text>
  <!-- ===== 50x dimension bracket spanning the two bar ends ===== -->
  <g stroke="#333333" stroke-width="0.55" fill="none">
    <line x1="12.8" y1="52.6" x2="61.4" y2="52.6"/>
    <line x1="12.8" y1="50.4" x2="12.8" y2="54.8"/>
    <line x1="61.4" y1="50.4" x2="61.4" y2="54.8"/>
  </g>
  <text x="37.1" y="60.2" text-anchor="middle" font-size="5.2" font-weight="700" fill="#333333">50×</text>
  <!-- ===== ReLU bar (50) ===== -->
  <rect x="1.4" y="63.0" width="11.4" height="32.0" fill="#e67817" fill-opacity="0.92"/>
  <text x="18.3" y="80.4" font-size="5.2" fill="#333333">ReLU 50</text>
  <text x="71.2" y="93.7" text-anchor="end" font-size="4.9" fill="#777777">log scale</text>
  <line x1="1.4" y1="98.5" x2="71.2" y2="98.5" stroke="#cccccc" stroke-width="0.55"/>
</svg>
