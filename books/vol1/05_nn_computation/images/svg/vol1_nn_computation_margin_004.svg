<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="75.4pt" height="66.6pt" viewBox="0 0 75.4 66.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Schematic roofline (unscaled axes): memory-bound slope rising to a dashed ridge,
       flat compute roof to the right. The MNIST dot sits on the slope, left of but near
       the ridge, matching the prose's conditional (bandwidth-bound only if the matching
       ridge point exceeds about 12 FLOP/byte). -->
  <rect x="0" y="0" width="75.4" height="66.6" fill="#ffffff"/>
  <!-- ===== Axes and ridge ===== -->
  <polyline points="1.4,1.4 1.4,65.2 74.0,65.2" fill="none" stroke="#cccccc" stroke-width="0.55" stroke-linejoin="miter"/>
  <line x1="60.9" y1="65.2" x2="60.9" y2="1.4" stroke="#cccccc" stroke-width="0.55" stroke-dasharray="2.035,0.88"/>
  <!-- ===== Memory-bound slope and compute roof ===== -->
  <line x1="1.4" y1="57.5" x2="60.9" y2="6.3" stroke="#006395" stroke-width="1.45" stroke-linecap="square"/>
  <line x1="61.2" y1="6.3" x2="74.0" y2="6.3" stroke="#e67817" stroke-width="1.45" stroke-linecap="square"/>
  <!-- ===== MNIST workload on the slope ===== -->
  <circle cx="44.0" cy="20.9" r="1.7" fill="#006395"/>
  <text x="40.6" y="16.2" text-anchor="end" font-size="5.2" fill="#006395">MNIST</text>
</svg>
