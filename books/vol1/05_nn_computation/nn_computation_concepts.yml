        concept: Iron law of ML systems
        quote: Across Data, Algorithm, and Machine, execution time factors as samples per task times FLOPs per
          sample times seconds per FLOP (where the first two multiply to total operations O), and unpacks on
          hardware into bytes moved over bandwidth plus operations over peak rate times utilization plus fixed
          overhead, with ideal overlap giving the larger of the first two plus overhead, so a faster component
          helps only through the share of time it changes.
