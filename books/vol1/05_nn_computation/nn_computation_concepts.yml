        concept: Training-time law
        quote: In the macroscopic D·A·M product form of the iron law, training work is about 6PD FLOPs (D tokens
          times 6P FLOPs per token) and run time is that work over peak rate times utilization, so every point
          of utilization recovered at constant power removes time, energy, and dollars in the same proportion,
          while memory sits outside the law as a feasibility gate.

