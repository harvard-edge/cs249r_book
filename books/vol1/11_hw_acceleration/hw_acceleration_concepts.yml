    concepts:
    - id: vol1.hardware.transfer
      label: Operand transfer time
      teaches: Roofline and ridge point
      summary: Supplying operands takes time. For a fixed memory level, the transfer lower bound is bytes
        moved divided by bandwidth.
      section: sec-hardware-acceleration-roofline-model-3e1a
    - id: vol1.hardware.compute
      label: Arithmetic time
      teaches: Roofline and ridge point
      summary: The arithmetic lower bound is the required operations divided by the available compute rate.
        Faster operand delivery cannot remove this bound.
      section: sec-hardware-acceleration-roofline-model-3e1a
    - id: vol1.hardware.bandwidth
      label: Memory bandwidth
      teaches: Operand-supply hierarchy
      summary: Bandwidth limits the rate at which an accelerator receives operands from a given memory level.
        The relevant level depends on data placement and reuse.
      section: sec-hardware-acceleration-calculating-memory-bandwidth-bounds-7fc0
    - id: vol1.hardware.intensity
      label: Arithmetic intensity
      teaches: Roofline and ridge point
      summary: Operations per byte moved identifies the compute-versus-bandwidth regime. A suitable batch
        can reuse weights and raise this ratio.
      section: sec-hardware-acceleration-roofline-model-3e1a
    - id: vol1.hardware.tiling
      label: Tiling
      teaches: Tiling
      summary: Partitioning operations so operand blocks can be reused in local memory rather than repeatedly
        fetched from off-chip memory.
      section: sec-hardware-acceleration-tiling-fundamentals-e9e6
    - id: vol1.hardware.reuse
      label: Operand reuse
      teaches: Stationary dataflows
      summary: Using a locally retained operand for multiple arithmetic operations before fetching it again.
      section: sec-hardware-acceleration-matrix-operations-neural-networks-527a
    - id: vol1.hardware.amdahl
      label: Accelerated fraction
      teaches: Amdahl's law
      summary: The fraction of baseline end-to-end time that an optimization can accelerate; the remaining
        time limits total gain.
      section: sec-hardware-acceleration-ai-hardware-acceleration-fundamentals-9b28
