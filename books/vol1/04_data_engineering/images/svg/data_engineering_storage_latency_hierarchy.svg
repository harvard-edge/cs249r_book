<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Storage point-lookup latency against a 1 ms budget (log scale)</title>
  <rect x="0" y="0" width="180" height="238" fill="#ffffff"/>
  <!-- log scale from 1 ns at x=4, 23 px per decade -->
  <rect x="4" y="24" width="167.9" height="34" fill="#5e6b73"/>
  <rect x="4" y="74" width="144.9" height="34" fill="#5e6b73"/>
  <rect x="4" y="124" width="115" height="34" fill="#5e6b73"/>
  <rect x="4" y="174" width="46" height="34" fill="#5e6b73"/>
  <line x1="2" y1="214" x2="178" y2="214" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="142" y1="18" x2="142" y2="214" stroke="#cb202d" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="142" y="13" font-size="12" font-weight="bold" fill="#cb202d" text-anchor="middle">1 ms</text>
  <g font-size="12" fill="#ffffff">
    <text x="9" y="45.5">Object store 20 ms</text>
    <text x="9" y="95.5">Remote SSD 2 ms</text>
    <text x="9" y="145.5">NVMe 100 µs</text>
  </g>
  <text x="55" y="195.5" font-size="12" fill="#333333">DRAM 100 ns</text>
  <text x="178" y="231" font-size="12" fill="#777777" text-anchor="end">log scale</text>
</svg>
