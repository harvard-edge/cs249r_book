  claims:
    Proxy misalignment: 'A model can pass verification while failing validation because harm enters through an incomplete
      specification: proxy features carry protected signal, proxy targets encode the inequity they measure, and
      an optimized proxy decouples from the goal while every health check stays green.'
    Fairness criteria as release gates: Disaggregated evaluation turns fairness into a release gate with per-slice
      demographic parity, equal opportunity, or equalized odds, criteria that cannot all hold under unequal base
      rates, so the criterion is a justified policy choice and each slice test returns pass, fail, or insufficient
      evidence.
    Fairness mitigation and its price: A disparity is closed before training (reweighting), during training (adversarial
      debiasing), or after training (group thresholds), and each choice is a point on a fairness-accuracy frontier
      whose cost must be stated as a number.
    Bias feedback loops: When decisions censor future labels, disparity evolves geometrically across retraining
      intervals, so a gate passed at launch is a statement about the first interval, the feedback factor fitted
      from audits projects the breach, and randomized exploration is the serving cost that keeps it below one.
    Lifecycle TCO: A lifecycle total cost of ownership sums every training cycle, recurring inference, and operations,
      and for a high-traffic service the recurring inference term can exceed all training cycles many times over,
      so the dominant term is measured rather than assumed.
    Energy to carbon: Operational carbon is IT energy times PUE times grid carbon intensity, embodied carbon is
      a separate and sometimes majority term, and an optimization is responsible only if measured lifecycle energy
      and emissions fall for the same workload and quality target.
    Specify before training: Specification fixes the target, the named populations, and the human-oversight boundary
      before training forecloses them, and naming a subgroup fixes a per-group data budget, so stratified recruitment
      costs far less than random sampling for a rare group.
    Explanation cost on the serving path: An explainability requirement is an architecture choice, either an interpretable
      model that gives up capacity or a post-hoc attributor whose cost sits on the serving path and whose fidelity
      and stability must be measured.
    Model cards and datasheets: A model card records intended use, performance factors, and disaggregated metrics
      and a datasheet records the data's provenance and composition, together stating the envelope the model was
      validated in so that reuse outside it is detectable.
    Privacy and governance as architecture: Each regulatory obligation maps to a capability with a machine cost
      (staffed review, lineage-driven deletion, audit-log bytes), and differential privacy adds a second layer beyond
      access control at a measurable compute and memory price.
    Federated learning: Federated learning trains on clients that keep their raw data and send model updates to a
      coordinator, trading centralization risk for uplink traffic, client dropout, and divergent local updates, and
      it bounds what leaks only when combined with secure aggregation and differential privacy.
