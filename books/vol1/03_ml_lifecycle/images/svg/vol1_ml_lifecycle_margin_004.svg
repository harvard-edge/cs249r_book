<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="75.4pt" height="56pt" viewBox="0 0 75.4 56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Cumulative cost vs years (DeploymentEconomics LEGO cell), linear axes, t = 0..4 yr, $0..545k.
       Cloud: $136.25k/yr from $0. Edge: $250k capex + $34.125k/yr. Crossover (payback) 2.45 yr at $333.5k.
       x = 3 + 17.25 t ; y = 46 - 0.0734 * k$ -->
  <rect width="75.4" height="56" fill="#ffffff"/>
  <line x1="3" y1="4" x2="3" y2="46" stroke="#cccccc" stroke-width="0.6"/>
  <line x1="3" y1="46" x2="72" y2="46" stroke="#cccccc" stroke-width="0.6"/>
  <line x1="45.2" y1="23.6" x2="45.2" y2="46" stroke="#999999" stroke-width="0.5" stroke-dasharray="1 1"/>
  <line x1="3" y1="46" x2="72" y2="6.0" stroke="#666666" stroke-width="1.4"/>
  <line x1="3" y1="27.6" x2="72" y2="17.6" stroke="#333333" stroke-width="1.4"/>
  <circle cx="45.2" cy="21.5" r="1.6" fill="#333333"/>
  <text x="57" y="8.5" font-size="5.8" font-weight="bold" fill="#666666" text-anchor="end">Cloud</text>
  <text x="4.4" y="22.0" font-size="5.8" font-weight="bold" fill="#333333">Edge</text>
  <text x="72" y="36.5" font-size="5.2" fill="#777777" text-anchor="end">cumulative</text>
  <text x="72" y="42.3" font-size="5.2" fill="#777777" text-anchor="end">cost</text>
  <text x="45.2" y="52.8" font-size="5.8" fill="#333333" text-anchor="middle">≈2.4 yr</text>
</svg>
