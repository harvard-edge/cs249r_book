<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24.2444mm" height="18.857mm" viewBox="0 0 180 140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Illustrative doubling rule 2^(s-1) over six lifecycle stages, LINEAR y: y = 128 - 2.6 * cost.
       Costs 1, 2, 4, 8, 16, 32 at stages 1..6. -->
  <rect width="180" height="140" fill="#ffffff"/>
  <polygon points="128,86.4 128,128 155,128 155,44.8" fill="#cb202d" fill-opacity="0.1" stroke="#cb202d" stroke-opacity="0.1" stroke-width="2.6"/>
  <line x1="12" y1="128" x2="166" y2="128" stroke="#cccccc" stroke-width="1.8" stroke-linecap="square"/>
  <polyline points="20,125.4 47,122.8 74,117.6 101,107.2 128,86.4 155,44.8" fill="none" stroke="#333333" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="square"/>
  <circle cx="20" cy="125.4" r="5.6" fill="#e67817"/>
  <circle cx="47" cy="122.8" r="5.6" fill="#e67817"/>
  <circle cx="74" cy="117.6" r="5.6" fill="#e67817"/>
  <circle cx="101" cy="107.2" r="5.6" fill="#e67817"/>
  <circle cx="128" cy="86.4" r="5.6" fill="#e67817"/>
  <circle cx="155" cy="44.8" r="6.5" fill="#cb202d"/>
  <text x="4" y="100" font-size="13" fill="#333333">Define</text>
  <text x="4" y="114" font-size="13" fill="#333333">1×</text>
  <text x="152" y="20" font-size="13" fill="#cb202d" text-anchor="middle">Monitor</text>
  <text x="152" y="34" font-size="13" fill="#cb202d" text-anchor="middle">32×</text>
  <text x="141.5" y="122" font-size="13" fill="#cb202d" text-anchor="middle">late</text>
</svg>
