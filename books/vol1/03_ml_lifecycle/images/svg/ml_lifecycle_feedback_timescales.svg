<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72.6pt" height="84pt" viewBox="0 0 72.6 84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Feedback cadences on a log scale (minutes): x_end = 1.44 + 11.92 * (log10(min) + 0.398).
       Minute 1, Day 1,440, Week 10,080, Month 43,200, Quarter 129,600. -->
  <rect width="72.6" height="84" fill="#ffffff"/>
  <rect x="1.4" y="5.8" width="65.7" height="10.7" fill="#5e6b73" opacity="0.9"/>
  <text x="66.5" y="13.1" font-size="5.8" fill="#ffffff" text-anchor="end">Quarter</text>
  <rect x="1.4" y="22" width="60" height="10.7" fill="#5e6b73" opacity="0.9"/>
  <text x="60.8" y="29.3" font-size="5.8" fill="#ffffff" text-anchor="end">Month</text>
  <rect x="1.4" y="38.1" width="52.5" height="10.7" fill="#5e6b73" opacity="0.9"/>
  <text x="53.3" y="45.5" font-size="5.8" fill="#ffffff" text-anchor="end">Week</text>
  <rect x="1.4" y="54.3" width="42.4" height="10.7" fill="#5e6b73" opacity="0.9"/>
  <text x="43.2" y="61.6" font-size="5.8" fill="#ffffff" text-anchor="end">Day</text>
  <rect x="1.4" y="70.5" width="4.7" height="10.7" fill="#5e6b73" opacity="0.9"/>
  <text x="8.6" y="77.8" font-size="5.8" fill="#333333">Minute</text>
  <line x1="1.4" y1="82.3" x2="71.2" y2="82.3" stroke="#cccccc" stroke-width="0.6"/>
  <text x="71.2" y="79.6" font-size="5.8" fill="#777777" text-anchor="end">log scale</text>
</svg>
