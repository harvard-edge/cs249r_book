<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72.6pt" height="63pt" viewBox="0 0 72.6 63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clinic uplink per day (BandwidthCompute LEGO cell): raw 100 patients x 4 photos x 5 MB = 2,000 MB vs summaries 100 x 10 KB = 1 MB; ratio 2,000x.
       Log scale: x = 1.44 + 13.5 * (log10(MB) + 1). -->
  <rect width="72.6" height="63" fill="#ffffff"/>
  <text x="1.4" y="7.2" font-size="5.8" fill="#333333">Raw</text>
  <rect x="1.4" y="9" width="58.1" height="10.7" fill="#7e317b" opacity="0.9"/>
  <text x="58.6" y="16.4" font-size="5.8" font-weight="bold" fill="#ffffff" text-anchor="end">2 GB/day</text>
  <text x="1.4" y="28.2" font-size="5.8" fill="#333333">Summary</text>
  <rect x="1.4" y="30" width="13.5" height="10.7" fill="#7e317b" opacity="0.9"/>
  <text x="16.9" y="37.4" font-size="5.8" font-weight="bold" fill="#333333">1 MB/day</text>
  <!-- dimension leader between the two bar ends (log distance = ratio) -->
  <line x1="59.5" y1="20.2" x2="59.5" y2="47.6" stroke="#999999" stroke-width="0.4" stroke-dasharray="0.9 0.9"/>
  <line x1="14.9" y1="41.2" x2="14.9" y2="47.6" stroke="#999999" stroke-width="0.4" stroke-dasharray="0.9 0.9"/>
  <line x1="14.9" y1="46.2" x2="59.5" y2="46.2" stroke="#333333" stroke-width="0.5"/>
  <path d="M 14.9 46.2 l 2.2 -1.1 v 2.2 z M 59.5 46.2 l -2.2 -1.1 v 2.2 z" fill="#333333"/>
  <rect x="26.9" y="42.2" width="20.6" height="6.6" fill="#ffffff"/>
  <text x="37.2" y="48.3" font-size="5.8" font-weight="bold" fill="#333333" text-anchor="middle">2,000×</text>
  <line x1="1.4" y1="54" x2="71.2" y2="54" stroke="#cccccc" stroke-width="0.6"/>
  <text x="71.2" y="61" font-size="5.8" fill="#777777" text-anchor="end">log scale</text>
</svg>
