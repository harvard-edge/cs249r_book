  claims:
    The lifecycle is a loop: An ML system moves through problem definition, data, training, evaluation, deployment,
      and monitoring, each handing the next a concrete artifact, and because learned behavior changes when the world
      changes, monitoring evidence must flow back to earlier stages, so deployment starts an operational phase rather
      than ending the project.
    Constraint propagation: A constraint discovered late forces rework in every upstream artifact that relied on
      its absence (the 4 GB model against a 500 MB device reservation), so rework is estimated by tracing the revise,
      retrain, and revalidate chain, and propagation runs both backward and forward.
    Problem framing: A request becomes a requirement only when stated as a measurable improvement over a named baseline
      and decomposed into statistical, physical, and operational constraints bound before development, because a
      metric that diverges from the goal defeats the system before training starts.
    Stage interface contracts: Each stage has an input contract, an output contract, and a quality invariant, and
      enforcing them at the boundaries turns the feedback loop into an audit that names which upstream stage owns
      a defect.
    Validation as a release gate: 'Evaluation measures and validation decides: a release needs evidence on latency,
      subgroup performance, calibration, robustness across sites and time, and operational readiness, recorded in
      an immutable manifest, and a failed threshold routes the fix to the stage that owns it.'
    Iteration tax: Cycle time bounds how many hypotheses a team can test in a fixed calendar, so iteration velocity
      buys search breadth rather than guaranteed accuracy, and late discoveries multiply the tax.
    Lab-to-field gap: Accuracy on a curated test set is not deployment readiness, because field captures differ
      from curated research images (the Thai screening deployment's ungradable images), so validation must sample
      the conditions the system will meet.
