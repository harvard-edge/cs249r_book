    - id: vol1.field.relation-6
      source: vol1.lifecycle.gate
      predicate: checks evidence against
      target: vol1.lifecycle.requirements
      explanation: Deployment is blocked when the evaluated artifact fails a declared threshold.
      conditions: Valid only for the artifact, intended use, and conditions represented by the release evidence.
      status: draft
      evidence:
        section: sec-ml-workflow-validation-deployment-readiness-207c
        quote: If a model fails to clear an established threshold, such as p99 serving latency (the latency
          that 99 percent of requests stay under) exceeding the service level agreement (SLA) budget or
          sensitivity on low-light fundus images falling below the safety floor, the release gate halts
          deployment.
    - id: vol1.field.relation-7
      source: vol1.lifecycle.gate
      predicate: can send work back to
      target: vol1.data.dataset
      explanation: A failed validation can require targeted collection or curation instead of runtime tuning.
      conditions: The diagnosis determines the corrective stage; not every validation failure is a data
        problem.
      status: draft
      evidence:
        section: sec-ml-workflow-validation-deployment-readiness-207c
        quote: 'Diagnostics then route backward to the responsible lifecycle stage: data curation for targeted
