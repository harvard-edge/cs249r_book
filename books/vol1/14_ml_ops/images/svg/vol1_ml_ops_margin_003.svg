<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 248" role="img" aria-label="Log-scale ladder of edge power budgets: sensor about 1 mW, gateway about 1 W, automotive tens of watts." font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="248" fill="#ffffff"/>
  <g fill="#e67817" opacity="0.92">
    <rect x="3.6" y="25.2" width="161.5" height="52.9"/>
    <rect x="3.6" y="105.4" width="112.6" height="52.9"/>
    <rect x="3.6" y="185.5" width="13.2" height="52.9"/>
  </g>
  <path d="M3.6 244 H176.4" stroke="#cccccc" stroke-width="1.4" stroke-linecap="square"/>
  <g font-size="14">
    <text x="158" y="48" fill="#ffffff" text-anchor="end">Automotive</text>
    <text x="158" y="66" fill="#ffffff" text-anchor="end">10s of W</text>
    <text x="109" y="128" fill="#ffffff" text-anchor="end">Gateway</text>
    <text x="109" y="146" fill="#ffffff" text-anchor="end">1 W</text>
    <text x="26" y="208" fill="#333333">Sensor</text>
    <text x="26" y="226" fill="#333333">1 mW</text>
  </g>
  <text x="176" y="236" font-size="12" fill="#777777" text-anchor="end">log scale</text>
</svg>
