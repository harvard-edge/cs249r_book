  formulas:
    - 'Light Barrier Latency: Latency_min = 2 * Distance / c_fiber'
    - 'Power Scaling: Power proportional to C * V^2 * f, with V proportional to f, so Power proportional to f^3'
    - 'Memory Wall Ratio: Compute Growth Rate / Memory Bandwidth Growth Rate approx 1.33'
    - 'Iron Law: T = D_vol / BW + O / (R_peak * eta_hw) + L_lat'
    - 'Bottleneck Principle: T_bottleneck = max(D_vol / BW, O / (R_peak * eta_hw), T_network) + L_lat'
    - 'Data Locality Invariant: D_vol / BW_net > L_net + O / R_peak_remote'
    - 'Energy Budget: Energy = Power * T'
    - 'Amdahl Speedup: 1 / ((1 - p) + p / s)'
    - 'Break-even utilization: Edge Fixed Costs / (Cloud Variable Cost per Unit * Capacity)'
    - \text{Latency}_{\min} = \frac{2 \times \text{Distance}}{c_{\text{fiber}}} \approx \frac{2 \times \text{Distance}}{200{,}000
      \text{ km/s}}
    - \text{Power} \propto C \times V^2 \times f \quad \text{where } V \propto f \implies \text{Power} \propto f^3
    - \frac{\text{Compute Growth Rate}}{\text{Memory Bandwidth Growth Rate}} \approx \frac{1.6}{1.2} \approx 1.33
    - T = \frac{D_{\text{vol}}}{\text{BW}} + \frac{O}{R_{\text{peak}} \cdot \eta_{\text{hw}}} + L_{\text{lat}}
    - T_{\text{pipelined}} \ge \max\left(\frac{D_{\text{vol}}}{\text{BW}}, \frac{O}{R_{\text{peak}} \cdot \eta_{\text{hw}}},
      T_{\text{IO}}\right) + L_{\text{lat}}
    - T = \max\left( \frac{O}{R_{\text{peak}} \cdot \eta_{\text{hw}}}, \frac{D_{\text{vol}}}{\text{BW}}, \frac{D_{\text{vol}}}{\text{BW}_{\text{IO}}}
      \right) + L_{\text{lat}}
  methodologies:
    - Bottleneck diagnosis with iron-law terms
    - Workload archetype mapping
    - Deployment decision framework (privacy, latency, compute, cost)
    - Total cost of ownership and break-even analysis
    - Hybrid pattern selection (Train-Serve Split, Hierarchical Processing, Progressive Deployment)
