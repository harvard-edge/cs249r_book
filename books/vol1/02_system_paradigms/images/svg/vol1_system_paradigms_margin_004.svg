<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="57pt" viewBox="0 0 90 57" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Bottleneck principle on camera pipeline (AmdahlCameraCalc, Scenarios.PhoneCameraPipeline):
       Overlapped stages: ISP 100 ms, ML 60 ms -> 6 ms (10x faster), Post 40 ms.
       Linear scale 0.66 units per ms from x=16 (100 ms -> x=82). Bottleneck max = 100 ms unchanged. -->
  <rect x="0" y="0" width="90" height="57" fill="#ffffff"/>
  <text x="88" y="7.5" text-anchor="end" font-size="5.8" font-weight="700" fill="#333333">max = 100 ms</text>
  <!-- Stage labels -->
  <text x="14" y="19.5" text-anchor="end" font-size="5.8" font-weight="700" fill="#333333">ISP</text>
  <text x="14" y="32.5" text-anchor="end" font-size="5.8" font-weight="700" fill="#c45d08">ML</text>
  <text x="14" y="45.5" text-anchor="end" font-size="5.8" fill="#555555">Post</text>
  <!-- Stage bars (scale: 0.66 units/ms from x=16) -->
  <!-- ISP: 100 ms = 66.0 (16..82) -->
  <rect x="16" y="13" width="66" height="8.5" fill="#b8b8b8"/>
  <text x="49" y="19.2" text-anchor="middle" font-size="5.5" font-weight="700" fill="#ffffff">100 ms</text>
  <!-- ML: before 60 ms = 39.6 (16..55.6), after 6 ms = 3.96 (16..20.0) -->
  <rect x="16.3" y="26.3" width="39.3" height="7.9" fill="#fae2cc" stroke="#e67817" stroke-width="0.6" stroke-dasharray="1.8,1.2"/>
  <rect x="16" y="26" width="4.0" height="8.5" fill="#e67817"/>
  <text x="57.6" y="32.2" font-size="5.1" font-weight="700" fill="#c45d08">60→6 ms</text>
  <!-- Post: 40 ms = 26.4 (16..42.4) -->
  <rect x="16" y="39" width="26.4" height="8.5" fill="#cccccc"/>
  <text x="44.6" y="45.2" font-size="5.3" fill="#555555">40 ms</text>
  <!-- Bottleneck pacing line at 100 ms (x=82) -->
  <line x1="82" y1="10" x2="82" y2="50" stroke="#333333" stroke-width="0.85" stroke-dasharray="2,1.4"/>
  <!-- Bottom summary -->
  <text x="45" y="55" text-anchor="middle" font-size="5.2" fill="#555555">10× ML → 10 FPS unchanged</text>
</svg>
