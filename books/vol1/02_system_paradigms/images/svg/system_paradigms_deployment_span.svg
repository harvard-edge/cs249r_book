<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72.6pt" height="99.9pt" viewBox="0 0 72.6 99.9" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Deployment power ladder on a log scale: 6.84 units per decade, origin 0.5 mW.
       Cloud 3 MW (TPU v4 pod), Edge 200 W (DGX Spark), Mobile 5 W (top of
       Platforms.Mobile.tdp_range_w), TinyML 1 mW (duty-cycled average target, as in the
       chapter's paradigm tables). -->
  <rect x="0" y="0" width="72.6" height="99.9" fill="#ffffff"/>
  <g fill="#e67817" fill-opacity="0.92">
    <rect x="1.4" y="8.0" width="66.9" height="16.0"/>
    <rect x="1.4" y="32.2" width="38.3" height="16.0"/>
    <rect x="1.4" y="56.5" width="27.4" height="16.0"/>
    <rect x="1.4" y="80.8" width="2.1" height="16.0"/>
  </g>
  <line x1="1.4" y1="98.5" x2="71.2" y2="98.5" stroke="#cccccc" stroke-width="0.55"/>
  <text x="67.0" y="17.9" text-anchor="end" font-size="5.2" fill="#ffffff">Cloud 3 MW</text>
  <text x="41.3" y="42.1" font-size="5.2" fill="#333333">Edge 200 W</text>
  <text x="30.4" y="66.4" font-size="5.2" fill="#333333">Mobile 5 W</text>
  <text x="5.1" y="90.6" font-size="5.2" fill="#333333">TinyML 1 mW</text>
  <text x="71.0" y="95.9" text-anchor="end" font-size="4.9" fill="#777777">log scale</text>
</svg>
