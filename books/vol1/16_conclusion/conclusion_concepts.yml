  formulas:
    - 'Data-as-code heuristic: Behavior ~= f(data, labels, sampling, and preprocessing)'
    - 'Data gravity: C_move(D) >> C_move(compute) when datasets are large and networks are constrained'
    - 'Sequential iron-law decomposition: T = D_vol / BW + O / (R_peak * eta_hw) + L_lat; overlap instead uses the
      critical path'
    - 'Roofline bound: R <= min(R_peak, I * BW)'
    - 'Workload energy: E_move,total = sum_i N_i E_i; E_compute,total = sum_j N_j E_j'
    - 'Amdahl''s Law: Speedup = 1 / ((1 - p) + p / s)'
    - 'Verification requirement: Pr_(x,y)~P_deploy,d[d(f(x),y) <= tau] >= 1 - epsilon, with finite-sample confidence
      stated'
    - 'Locally fitted drift model: A(t) ~= A_0 - lambda D(P_t || P_0), only after fitting outcomes in the observed
      range'
    - 'Training-serving skew indicator: E[|f_serve(x) - f_train(x)|]; not a universal accuracy-loss equation'
    - 'Scenario-specific bias recurrence: Delta_g(k) ~= Delta_g(0) alpha^k under an approximately constant measured
      alpha and no intervention'
    - 'Selected tail ratio: L_q / mean latency for the product-specified quantile q'
    - 'Independent-component approximation: cluster MTTF ~= component MTTF / N under equal independent hazards'
  methodologies:
    - Trace how data, architecture, compression, hardware, serving, and monitoring decisions constrain one another
    - Diagnose bottlenecks with the iron law, roofline reasoning, and arithmetic intensity
    - Evaluate optimization proposals across the full Pareto frontier
    - Validate quantized and optimized artifacts on the actual serving path
    - Monitor drift, skew, tail latency, and subgroup performance in production
    - Diagnose monitoring signals before choosing rollback, fallback, or retraining
    - Profile end-to-end pipelines before optimizing individual stages
    - Design robust systems with redundancy, ensembles, uncertainty estimates, and fallback policies
    - Use single-system reasoning to recognize when scale changes the resource boundary
  applications:
