parts:
  - key: "frontmatter"
    division: "frontmatter"
    type: "division"
    numbered: false
    title: "Frontmatter"
    description: >
      This part welcomes readers to the textbook and provides the introductory material
      that frames the journey ahead.

  - key: "mainmatter"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Main Text"
    description: >
      The main content of the textbook organized into thematic parts.

  # =============================================================================
  # VOLUME I: INTRODUCTION TO MACHINE LEARNING SYSTEMS
  # =============================================================================
  # Note: "volume_1" division page removed to save pages (MIT Press, Feb 2026).
  # The book now goes directly from frontmatter to Part I: Foundations.

  - key: "vol1_foundations"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Foundations of ML Systems"
    description: >
      This part establishes where an ML system can run, when its constraints must be known,
      and how its data is delivered. It derives the deployment spectrum from cloud to tiny
      devices from physical limits, follows those constraints through the ML lifecycle and the
      rising cost of discovering them late, and treats data engineering as building versioned,
      tested pipelines, because data is both the program and a physical anchor of the system.

  - key: "vol1_build"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Development and Training"
    description: >
      This part co-designs models with the hardware that must execute them, organized by the
      iron law and the silicon contract. It counts the operations, activations, and gradients a
      neural network commits the machine to, shows how architectures set arithmetic intensity,
      follows frameworks as they translate model operations into hardware execution, and
      trains a model on a single machine until memory, time, and utilization become the limits.

  - key: "vol1_optimize"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Optimization and Acceleration"
    description: >
      This part makes ML systems efficient enough for real-world time, memory, and energy
      budgets by first diagnosing which resource limits the workload. It asks whether the work
      is necessary (data selection), whether it can be simplified (model compression), and how
      to execute it faster (hardware acceleration), then uses benchmarking to test whether the
      predicted savings survive end-to-end measurement.

  - key: "vol1_deploy"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Deployment and Operations"
    description: >
      This part moves from controlled benchmarks to production, where a system can fail
      silently while still returning confident outputs. It builds serving infrastructure that
      meets latency deadlines under variable traffic, operations practices that detect drift and
      training-serving skew over a model's lifetime, and responsible engineering that treats
      fairness and feedback loops as measurable deployment dynamics.

  # =============================================================================
  # SYNTHESIS (closes the main matter; clean division before the Conclusion)
  # =============================================================================

  - key: "synthesis"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Synthesis"
    description: >
      The concluding synthesis of the volume, drawing the parts together.

  # =============================================================================
  # BACKMATTER
  # =============================================================================

  - key: "backmatter"
    division: "backmatter"
    type: "division"
    numbered: false
    title: "Back Matter"
    description: >
      References, appendices, and supplementary material.

  - key: "references"
    division: "backmatter"
    type: "lab"
    numbered: false
    title: "Bibliography"
    description: >
      Complete bibliography.
