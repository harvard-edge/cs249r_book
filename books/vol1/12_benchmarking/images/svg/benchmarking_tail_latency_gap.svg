<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Production p99 of 150 to 200 ms against a 15 ms benchmark mean, a 10 to 13.3 times gap.">
  <rect x="0" y="0" width="180" height="124" fill="#ffffff"/>
  <!-- linear scale: 0.84 px per ms from x = 4 ; 15 ms = 16.6, 150 ms = 130, 200 ms = 172 -->
  <rect x="4" y="4" width="126" height="36" fill="#5e6b73"/>
  <rect x="130" y="4" width="42" height="36" fill="#5e6b73" fill-opacity="0.4"/>
  <text x="10" y="19" font-size="12" font-weight="bold" fill="#ffffff">Production p99</text>
  <text x="10" y="34" font-size="12" fill="#ffffff">150–200 ms</text>
  <!-- dimension: from benchmark mean to the 150-200 ms range -->
  <path d="M17 60 H130" stroke="#777777" stroke-width="1.2" fill="none"/>
  <path d="M22 56.5 L16.5 60 L22 63.5" stroke="#777777" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M130 52 V60 H172 V52" stroke="#777777" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <rect x="44" y="52" width="58" height="16" fill="#ffffff"/>
  <text x="73" y="64.5" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">10–13.3×</text>
  <rect x="4" y="80" width="12.6" height="36" fill="#5e6b73"/>
  <text x="22" y="95" font-size="12" font-weight="bold" fill="#333333">Benchmark mean</text>
  <text x="22" y="110" font-size="12" fill="#333333">15 ms</text>
</svg>
