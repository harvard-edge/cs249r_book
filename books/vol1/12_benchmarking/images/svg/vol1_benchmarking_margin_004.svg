<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Pareto frontier of accuracy against latency with one dominated model below it.">
  <rect x="0" y="0" width="180" height="140" fill="#ffffff"/>
  <!-- axes: accuracy up, latency right -->
  <path d="M26 118 V8" stroke="#aaaaaa" stroke-width="2" fill="none"/>
  <path d="M22 14 L26 7 L30 14" stroke="#aaaaaa" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path d="M26 118 H174" stroke="#aaaaaa" stroke-width="2" fill="none"/>
  <path d="M168 114 L175 118 L168 122" stroke="#aaaaaa" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <text x="0" y="0" transform="translate(17 63) rotate(-90)" font-size="12" fill="#555555" text-anchor="middle">accuracy</text>
  <text x="100" y="134" font-size="12" fill="#555555" text-anchor="middle">latency</text>
  <!-- frontier -->
  <path d="M35.9 105.9 L72.9 66.9 L111.7 36.4 L159.5 18.7" stroke="#008f45" stroke-width="3.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="35.9" cy="105.9" r="5.2" fill="#008f45"/>
  <circle cx="72.9" cy="66.9" r="5.2" fill="#008f45"/>
  <circle cx="111.7" cy="36.4" r="5.2" fill="#008f45"/>
  <circle cx="159.5" cy="18.7" r="5.2" fill="#008f45"/>
  <!-- dominated model -->
  <circle cx="103" cy="86" r="5.2" fill="#777777"/>
  <text x="103" y="104" font-size="12" fill="#555555" text-anchor="middle">dominated</text>
</svg>
