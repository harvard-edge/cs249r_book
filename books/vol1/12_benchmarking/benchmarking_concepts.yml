  formulas:
    - 'Hardware efficiency: eta_hw = R_sustained / R_peak'
    - 'Time-to-accuracy: T_train = argmin_t {Accuracy(t) >= target accuracy}'
    - 'Training throughput: Throughput = N_samples / T_train'
    - 'Scaling efficiency: eta_scaling = T(1) / (N * T(N)) * 100%'
    - 'Per-query energy: E_total = Power * T'
    - 'Duty-cycle average power: P_avg = d * P_active + (1 - d) * P_standby'
    - 'Paired comparison: McNemar statistic (b - c)^2 / (b + c)'
    - 'Amdahl optimization ceiling: maximum speedup = 1 / nonoptimized fraction'
    - 'Coefficient of variation: CV = sigma / mu'
    - 'Effective bandwidth: bytes transferred / kernel duration'
    - 'Binomial uncertainty: sigma = sqrt(N * p * (1 - p))'
    - 'GPU utilization: achieved FLOPS / peak FLOPS'
  methodologies:
