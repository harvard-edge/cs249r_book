<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="81pt" viewBox="0 0 180 162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- DataLoader path, schematic: 4 workers (num_workers=4) fill a prefetch queue of
       4 x prefetch_factor 2 = 8 batches, which drains into a pinned host buffer, then DMA to the GPU.
       Both host buffers share the memory color; the queue is slotted, the pinned buffer is one solid block. -->
  <defs>
    <marker id="dl-gray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
    </marker>
    <marker id="dl-violet" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7E317B"/>
    </marker>
  </defs>
  <rect width="180" height="162" fill="#FFFFFF"/>
  <text x="4" y="24" font-size="13" fill="#333333">4 workers</text>
  <g fill="#E67817">
    <rect x="76" y="8" width="20" height="22"/>
    <rect x="102" y="8" width="20" height="22"/>
    <rect x="128" y="8" width="20" height="22"/>
    <rect x="154" y="8" width="20" height="22"/>
  </g>
  <line x1="125" y1="33" x2="125" y2="44" stroke="#666666" stroke-width="1.5" marker-end="url(#dl-gray)"/>
  <text x="4" y="66" font-size="13" fill="#333333">8 batches</text>
  <rect x="76" y="50" width="98" height="22" fill="#006395"/>
  <g stroke="#FFFFFF" stroke-width="1.5">
    <line x1="88.25" y1="50" x2="88.25" y2="72"/>
    <line x1="100.5" y1="50" x2="100.5" y2="72"/>
    <line x1="112.75" y1="50" x2="112.75" y2="72"/>
    <line x1="125" y1="50" x2="125" y2="72"/>
    <line x1="137.25" y1="50" x2="137.25" y2="72"/>
    <line x1="149.5" y1="50" x2="149.5" y2="72"/>
    <line x1="161.75" y1="50" x2="161.75" y2="72"/>
  </g>
  <line x1="125" y1="75" x2="125" y2="86" stroke="#666666" stroke-width="1.5" marker-end="url(#dl-gray)"/>
  <text x="4" y="108" font-size="13" fill="#333333">Pinned</text>
  <rect x="76" y="92" width="98" height="22" fill="#006395"/>
  <line x1="125" y1="117" x2="125" y2="128" stroke="#7E317B" stroke-width="2" marker-end="url(#dl-violet)"/>
  <rect x="76.6" y="134.6" width="96.8" height="20.8" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="125" y="149.5" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">GPU</text>
</svg>
