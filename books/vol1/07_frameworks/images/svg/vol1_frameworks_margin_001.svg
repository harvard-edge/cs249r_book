<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="85pt" viewBox="0 0 180 170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- ResNetMemory: training sum 8.4-12.4 GB vs FP32 weights 102.2 MB; ratio 82.3-121.4x.
       Log axis: origin 10 MB at x=4, 55 px per decade. Light extension = range from 8.4 to 12.4 GB. -->
  <rect width="180" height="170" fill="#FFFFFF"/>
  <rect x="4" y="6" width="160.8" height="50" fill="#006395" fill-opacity="0.92"/>
  <rect x="164.8" y="6" width="9.3" height="50" fill="#006395" fill-opacity="0.4"/>
  <text x="158" y="27" font-size="13" fill="#FFFFFF" text-anchor="end">Training</text>
  <text x="158" y="45" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">8.4–12.4 GB</text>
  <g stroke="#333333" stroke-width="1">
    <line x1="59.6" y1="76" x2="174.1" y2="76"/>
    <line x1="59.6" y1="71" x2="59.6" y2="81"/>
    <line x1="174.1" y1="71" x2="174.1" y2="81"/>
  </g>
  <rect x="73" y="67" width="84" height="18" fill="#FFFFFF"/>
  <text x="115" y="80.5" font-size="13" fill="#333333" text-anchor="middle">82.3–121.4×</text>
  <rect x="4" y="96" width="55.6" height="50" fill="#006395" fill-opacity="0.92"/>
  <text x="66" y="117" font-size="13" fill="#333333">Weights</text>
  <text x="66" y="135" font-size="13" font-weight="bold" fill="#333333">102.2 MB</text>
  <line x1="4" y1="150" x2="176" y2="150" stroke="#CCCCCC" stroke-width="1.2"/>
  <text x="176" y="166" font-size="12" fill="#777777" text-anchor="end">log scale</text>
</svg>
