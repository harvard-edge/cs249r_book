<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="70pt" viewBox="0 0 180 140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Stream overlap, schematic (copy:compute = 1:2). Serial pays copy + compute;
       overlap pays only the longer stage, with the next batch's copy running beneath it. -->
  <rect width="180" height="140" fill="#FFFFFF"/>
  <text x="4" y="15" font-size="13" fill="#333333">Serial</text>
  <rect x="4" y="21" width="57.3" height="26" fill="#7E317B"/>
  <rect x="61.3" y="21" width="114.7" height="26" fill="#E67817"/>
  <line x1="61.3" y1="21" x2="61.3" y2="47" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="32.7" y="38.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Copy</text>
  <text x="118.7" y="38.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Compute</text>
  <text x="4" y="73" font-size="13" fill="#333333">Overlap</text>
  <rect x="4" y="79" width="114.7" height="26" fill="#E67817"/>
  <text x="61.3" y="96.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Compute</text>
  <rect x="4" y="108" width="57.3" height="26" fill="#7E317B"/>
  <text x="32.7" y="125.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Copy</text>
  <text x="66" y="125.5" font-size="13" fill="#333333">Next batch</text>
</svg>
