<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="85pt" viewBox="0 0 180 170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- DeviceBandwidthHierarchy: HBM2e 2.04 TB/s (2039 GB/s) vs PCIe 4.0 32 GB/s; gap 63.7x.
       Log axis: origin 1 GB/s at x=4, 50 px per decade. -->
  <rect width="180" height="170" fill="#FFFFFF"/>
  <rect x="4" y="6" width="165.5" height="50" fill="#7E317B" fill-opacity="0.92"/>
  <text x="163" y="27" font-size="13" fill="#FFFFFF" text-anchor="end">HBM</text>
  <text x="163" y="45" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">2.04 TB/s</text>
  <g stroke="#333333" stroke-width="1">
    <line x1="79.3" y1="76" x2="169.5" y2="76"/>
    <line x1="79.3" y1="71" x2="79.3" y2="81"/>
    <line x1="169.5" y1="71" x2="169.5" y2="81"/>
  </g>
  <rect x="103" y="67" width="42" height="18" fill="#FFFFFF"/>
  <text x="124.4" y="80.5" font-size="13" fill="#333333" text-anchor="middle">63.7×</text>
  <rect x="4" y="96" width="75.3" height="50" fill="#7E317B" fill-opacity="0.92"/>
  <text x="86" y="117" font-size="13" fill="#333333">PCIe 4.0</text>
  <text x="86" y="135" font-size="13" font-weight="bold" fill="#333333">32 GB/s</text>
  <line x1="4" y1="150" x2="176" y2="150" stroke="#CCCCCC" stroke-width="1.2"/>
  <text x="176" y="166" font-size="12" fill="#777777" text-anchor="end">log scale</text>
</svg>
