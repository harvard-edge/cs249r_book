<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72.6pt" height="63pt" viewBox="0 0 72.6 63" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clinic uplink per day (BandwidthCompute LEGO cell): raw 7,500 MB vs summaries 150 x 10 KB = 1.5 MB; ratio 5,000x.
       Log scale: x = 1.44 + 13.5 * (log10(MB) + 1). -->
  <rect width="72.6" height="63" fill="#ffffff"/>
  <text x="1.4" y="7.2" font-size="5.8" fill="#333333">Raw</text>
  <rect x="1.4" y="9" width="65.8" height="10.7" fill="#7e317b" opacity="0.9"/>
  <text x="66.4" y="16.4" font-size="5.8" font-weight="bold" fill="#ffffff" text-anchor="end">7.5 GB/day</text>
  <text x="1.4" y="28.2" font-size="5.8" fill="#333333">Summary</text>
  <rect x="1.4" y="30" width="15.9" height="10.7" fill="#7e317b" opacity="0.9"/>
  <text x="19.3" y="37.4" font-size="5.8" font-weight="bold" fill="#333333">1.5 MB/day</text>
  <!-- dimension leader between the two bar ends (log distance = ratio) -->
  <line x1="67.3" y1="20.2" x2="67.3" y2="47.6" stroke="#999999" stroke-width="0.4" stroke-dasharray="0.9 0.9"/>
  <line x1="17.3" y1="41.2" x2="17.3" y2="47.6" stroke="#999999" stroke-width="0.4" stroke-dasharray="0.9 0.9"/>
  <line x1="17.3" y1="46.2" x2="67.3" y2="46.2" stroke="#333333" stroke-width="0.5"/>
  <path d="M 17.3 46.2 l 2.2 -1.1 v 2.2 z M 67.3 46.2 l -2.2 -1.1 v 2.2 z" fill="#333333"/>
  <rect x="32" y="42.2" width="20.6" height="6.6" fill="#ffffff"/>
  <text x="42.3" y="48.3" font-size="5.8" font-weight="bold" fill="#333333" text-anchor="middle">5,000×</text>
  <line x1="1.4" y1="54" x2="71.2" y2="54" stroke="#cccccc" stroke-width="0.6"/>
  <text x="71.2" y="61" font-size="5.8" fill="#777777" text-anchor="end">log scale</text>
</svg>
