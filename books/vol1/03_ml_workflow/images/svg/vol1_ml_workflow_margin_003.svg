<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="77pt" viewBox="0 0 180 154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Two-threshold evaluation gate for the DR scenario: sensitivity > 90%, specificity > 80%.
       Thresholds to scale over 50-100%: x = 14 + 3.16 * (spec - 50), y = 132 - 2.2 * (sens - 50).
       The operating curve is schematic (illustrative only, no measured operating point). -->
  <rect width="180" height="154" fill="#ffffff"/>
  <rect x="108.8" y="22" width="63.2" height="22" fill="#e3e6e8"/>
  <line x1="14" y1="22" x2="14" y2="132" stroke="#cccccc" stroke-width="1.4"/>
  <line x1="14" y1="132" x2="172" y2="132" stroke="#cccccc" stroke-width="1.4"/>
  <line x1="14" y1="44" x2="172" y2="44" stroke="#cb202d" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="108.8" y1="22" x2="108.8" y2="132" stroke="#cb202d" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M14 26 C 90 26, 150 30, 172 124" fill="none" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
  <text x="150" y="38" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">Pass</text>
  <text x="14" y="14" font-size="12.5" fill="#333333">Sensitivity</text>
  <text x="18" y="59" font-size="12.5" fill="#cb202d">&gt; 90%</text>
  <text x="113" y="126" font-size="12.5" fill="#cb202d">&gt; 80%</text>
  <text x="172" y="148" font-size="12.5" fill="#333333" text-anchor="end">Specificity →</text>
</svg>
