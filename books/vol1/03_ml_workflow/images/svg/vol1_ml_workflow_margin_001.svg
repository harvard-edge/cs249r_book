<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72.6pt" height="52pt" viewBox="0 0 72.6 52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Iteration tax: effective experiments in 26 weeks (IterationTax LEGO cell). Linear scale: 100 vs 26, ratio 3.8x. -->
  <rect width="72.6" height="52" fill="#ffffff"/>
  <text x="1.4" y="7.2" font-size="5.8" fill="#333333">Hourly cycle</text>
  <rect x="1.4" y="9" width="66" height="10.7" fill="#5e6b73" opacity="0.9"/>
  <text x="66.6" y="16.4" font-size="5.8" font-weight="bold" fill="#ffffff" text-anchor="end">100</text>
  <text x="1.4" y="28.2" font-size="5.8" fill="#333333">Weekly cycle</text>
  <rect x="1.4" y="30" width="17.2" height="10.7" fill="#5e6b73" opacity="0.9"/>
  <text x="17.8" y="37.4" font-size="5.8" font-weight="bold" fill="#ffffff" text-anchor="end">26</text>
  <!-- ratio bracket joining the two bar ends -->
  <line x1="19.4" y1="35.3" x2="68.4" y2="35.3" stroke="#999999" stroke-width="0.4" stroke-dasharray="0.9 0.9"/>
  <path d="M 68.2 14.3 H 70.6 V 35.3 H 68.2" fill="none" stroke="#333333" stroke-width="0.5"/>
  <text x="67.4" y="32.9" font-size="5.8" font-weight="bold" fill="#333333" text-anchor="end">≈3.8×</text>
  <line x1="1.4" y1="43.2" x2="71.2" y2="43.2" stroke="#cccccc" stroke-width="0.6"/>
  <text x="71.2" y="50.2" font-size="5.8" fill="#777777" text-anchor="end">experiments</text>
</svg>
