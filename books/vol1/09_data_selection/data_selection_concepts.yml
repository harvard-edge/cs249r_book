  claims:
    Selection inequality: A training-time claim for data selection holds only if selection time plus subset training
      time is less than full training time at matched quality and coverage, so scorer size and refresh rate, not
      the retained fraction, decide whether selection is a net saving.
    Measuring data value: Sample value is learning per unit of training compute (the information-compute ratio),
      learning-curve metrics show whether a reduction held quality, and a gain in data value becomes a throughput
      gain only when the run is compute-bound and the saved work is on the critical path.
    Compute-optimal frontier: Controlled sweeps fit a compute-optimal balance of about 20 tokens per parameter,
      so a run whose unique tokens per parameter sit well below it is data-starved and repeats its corpus, which
      is the regime where selection rather than more compute moves the run toward the frontier.
    Selection engineering on the data path: Selection removes accelerator work but adds host hashing, scoring passes,
      scattered reads, and shard coordination, so a retained subset saves reads only if materialized into its own
      shards, and data echoing recovers idle accelerator cycles when host preparation is the slow stage.
    Static pruning with coverage floors: Deduplication, quality pruning, and coreset selection shrink training work
      before training, but a score ranking must be constrained by per-class or per-slice coverage floors, which
      carry an explicit opportunity cost and can make a budget infeasible.
    Dynamic selection: Because sample value changes as the model learns, curriculum learning reorders data by difficulty
      and pacing, and active learning turns labeling into a query loop whose label saving must be measured against
      a budget-matched random baseline after pool-scoring cost.
    Synthetic data as a lever: When the pool lacks the needed cases, augmentation and generative synthesis replace
      curation at a per-sample cost against realism, the domain gap needs randomization, adaptation, and a real-data
      anchor, and recursive training risks model collapse.
    Learning from unlabeled data: Semi-supervised and self-supervised learning trade extra training compute for
      fewer task labels, valid only when the unlabeled pool matches the target distribution, and a foundation model
      pays off only when pretraining is amortized across enough downstream tasks.
    Data cost and amortized ROI: Total data cost is acquisition plus labeling plus storage plus processing, and
      a selection investment is judged by amortized return across all the runs it serves, so a pipeline that loses
      money on one run can pay across a campaign.
