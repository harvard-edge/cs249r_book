  claims:
    Dual mandate: Every ML system must show both that its learned behavior is trustworthy and that the machine delivers
      it within time, memory, energy, and cost budgets, so an accurate but slow model and a fast model trained on
      unrepresentative data are both failures.
    Data defines behavior: Training data plus the optimization procedure produce the program, so changing the dataset
      changes system behavior as surely as changing source code, and debugging, versioning, and review must extend
      to the data.
    D·A·M diagnosis: Attributing a symptom to Data, Algorithm, or Machine chooses the evidence and the class of
      fix, and relieving the binding constraint moves the bottleneck across the triad, so diagnosis is a loop of
      diagnose, intervene, and re-measure.
    Iron law of ML systems: Across Data, Algorithm, and Machine, execution time factors as samples per task times
      FLOPs per sample times seconds per FLOP (where the first two multiply to total operations O), and unpacks on
      hardware into bytes moved over bandwidth plus operations over peak rate times utilization plus fixed overhead,
      with ideal overlap giving the larger of the first two plus overhead, so a faster component helps only through
      the share of time it changes.
    Three efficiency levers: Data selection cuts samples per task, algorithmic efficiency lowers FLOPs per sample,
      and compute efficiency lowers realized seconds per FLOP by raising utilization and reducing stalls, while
      return on compute (accuracy gained per added cost) tests whether an added investment is worth its price.
    Silent degradation: ML adds a failure route in which code, runtime, and health checks stay green while predictive
      quality falls as the operating population shifts or training and serving transforms diverge, and locally accuracy
      falls by a fitted sensitivity times the divergence (eq-degradation), where divergence prompts investigation
      and labeled outcomes establish loss.
    Bitter lesson and bottleneck migration: 'General methods that turn computation into capability have repeatedly
      overtaken encoded human knowledge, so each AI era traded one binding limit for the next and today''s limit
      is the infrastructure: memory, bandwidth, power, and orchestration.'
    The system is the model: User-visible behavior is produced by the data pipeline, weights, execution stack, serving
      path, and monitoring loop together, so most of the engineering burden and the costliest failures sit outside
      the learned parameters, at interfaces no component test exercises.
