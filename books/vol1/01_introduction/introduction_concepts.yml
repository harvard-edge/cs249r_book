    - T = \left(\frac{\text{Samples}}{\text{Task}}\right) \times \left(\frac{\text{FLOPs}}{\text{Sample}}\right) \times \left(\frac{\text{Seconds}}{\text{FLOP}}\right)
    - T \approx \frac{D_{\text{vol}}}{\text{BW}} + \frac{O}{R_{\text{peak}} \cdot \eta_{\text{hw}}} + L_{\text{lat}}
