<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: CLUSTER RESOURCE POOLS                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="340" height="442" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1e293b">CLUSTER RESOURCE POOLS (Coupled Dimensions)</text>

    <!-- Resource 1: GPU Compute -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="310" height="120" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="10" y="10" width="24" height="18" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="22" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">R1</text>
      <text x="40" y="23" font-size="9" font-weight="700" fill="#0369a1">GPU Compute (Tensor Cores)</text>

      <text x="10" y="44" font-size="8" fill="#475569">• Total Capacity: <tspan font-weight="700" fill="#0f172a">C_compute = 4.0 PFLOPs</tspan></text>
      <text x="10" y="60" font-size="8" fill="#475569">• Consumed by: GEMM prompt prefills &amp; decode</text>
      <text x="10" y="76" font-size="8" fill="#475569">• Characteristic: Space-time multiplexed via batching</text>
      <text x="10" y="96" font-size="8" font-weight="700" fill="#0369a1">Dominant for: Speculative search &amp; MCTS agents</text>
    </g>

    <!-- Resource 2: Device Memory -->
    <g transform="translate(15, 164)">
      <rect x="0" y="0" width="310" height="120" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="10" y="10" width="24" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="22" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">R2</text>
      <text x="40" y="23" font-size="9" font-weight="700" fill="#15803d">Device Memory (HBM KV Blocks)</text>

      <text x="10" y="44" font-size="8" fill="#475569">• Total Capacity: <tspan font-weight="700" fill="#0f172a">C_mem = 640 GB (8x H100)</tspan></text>
      <text x="10" y="60" font-size="8" fill="#475569">• Consumed by: PagedAttention physical blocks</text>
      <text x="10" y="76" font-size="8" fill="#475569">• Characteristic: Non-compressible, hard limits</text>
      <text x="10" y="96" font-size="8" font-weight="700" fill="#15803d">Dominant for: Long-context coding &amp; repo agents</text>
    </g>

    <!-- Resource 3: External Tool Concurrency -->
    <g transform="translate(15, 294)">
      <rect x="0" y="0" width="310" height="135" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <rect x="10" y="10" width="24" height="18" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="22" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">R3</text>
      <text x="40" y="23" font-size="9" font-weight="700" fill="#b45309">External Tool API Leases</text>

      <text x="10" y="44" font-size="8" fill="#475569">• Total Capacity: <tspan font-weight="700" fill="#0f172a">C_tool = 100 concurrent leases</tspan></text>
      <text x="10" y="60" font-size="8" fill="#475569">• Consumed by: Sandbox containers, API rate limits</text>
      <text x="10" y="76" font-size="8" fill="#475569">• Characteristic: Governed by third-party quotas</text>
      <text x="10" y="96" font-size="8" font-weight="700" fill="#b45309">Dominant for: Web research &amp; scraping agents</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: MULTI-TENANT ALLOCATION PROFILES                        -->
  <!-- ================================================================= -->
  <g transform="translate(395, 75)">
    <rect x="0" y="0" width="420" height="442" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">HETEROGENEOUS AGENT TENANT PROFILES (Resource Share Vectors)</text>

    <!-- Tenant A Card -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="390" height="120" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#0369a1">Tenant A: Speculative Search Agent (MCTS)</text>
      <text x="12" y="32" font-size="8.0" fill="#64748b">Demands heavy parallel token generation; small contexts.</text>

      <!-- Bars -->
      <text x="12" y="48" font-size="8.0" fill="#334155">Compute: 60%</text>
      <rect x="80" y="40" width="180" height="9" rx="1" fill="#e2e8f0"/>
      <rect x="80" y="40" width="108" height="9" rx="1" fill="#0284c7"/>

      <text x="12" y="64" font-size="8.0" fill="#334155">Memory: 15%</text>
      <rect x="80" y="56" width="180" height="9" rx="1" fill="#e2e8f0"/>
      <rect x="80" y="56" width="27" height="9" rx="1" fill="#16a34a"/>

      <text x="12" y="80" font-size="8.0" fill="#334155">Tools: 5%</text>
      <rect x="80" y="72" width="180" height="9" rx="1" fill="#e2e8f0"/>
      <rect x="80" y="72" width="9" height="9" rx="1" fill="#d97706"/>

      <text x="275" y="55" font-size="8.5" font-weight="700" fill="#0369a1">Dominant Share: 60%</text>
      <text x="275" y="69" font-size="8.0" fill="#64748b">(GPU Compute)</text>
    </g>

    <!-- Tenant B Card -->
    <g transform="translate(15, 164)">
      <rect x="0" y="0" width="390" height="120" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#15803d">Tenant B: Software Engineering Agent (SWE)</text>
      <text x="12" y="32" font-size="8.0" fill="#64748b">Demands massive 128k context buffers; modest compute.</text>

      <!-- Bars -->
      <text x="12" y="48" font-size="8.0" fill="#334155">Compute: 20%</text>
      <rect x="80" y="40" width="180" height="9" rx="1" fill="#e2e8f0"/>
      <rect x="80" y="40" width="36" height="9" rx="1" fill="#0284c7"/>

      <text x="12" y="64" font-size="8.0" fill="#334155">Memory: 60%</text>
      <rect x="80" y="56" width="180" height="9" rx="1" fill="#e2e8f0"/>
      <rect x="80" y="56" width="108" height="9" rx="1" fill="#16a34a"/>

      <text x="12" y="80" font-size="8.0" fill="#334155">Tools: 25%</text>
      <rect x="80" y="72" width="180" height="9" rx="1" fill="#e2e8f0"/>
      <rect x="80" y="72" width="45" height="9" rx="1" fill="#d97706"/>

      <text x="275" y="55" font-size="8.5" font-weight="700" fill="#15803d">Dominant Share: 60%</text>
      <text x="275" y="69" font-size="8.0" fill="#64748b">(HBM KV Blocks)</text>
    </g>

    <!-- Tenant C Card -->
    <g transform="translate(15, 294)">
      <rect x="0" y="0" width="390" height="135" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#b45309">Tenant C: Web Research Orchestrator</text>
      <text x="12" y="32" font-size="8.0" fill="#64748b">Demands high concurrent browser sandboxes &amp; API leases.</text>

      <!-- Bars -->
      <text x="12" y="48" font-size="8.0" fill="#334155">Compute: 15%</text>
      <rect x="80" y="40" width="180" height="9" rx="1" fill="#e2e8f0"/>
      <rect x="80" y="40" width="27" height="9" rx="1" fill="#0284c7"/>

      <text x="12" y="64" font-size="8.0" fill="#334155">Memory: 20%</text>
      <rect x="80" y="56" width="180" height="9" rx="1" fill="#e2e8f0"/>
      <rect x="80" y="56" width="36" height="9" rx="1" fill="#16a34a"/>

      <text x="12" y="80" font-size="8.0" fill="#334155">Tools: 60%</text>
      <rect x="80" y="72" width="180" height="9" rx="1" fill="#e2e8f0"/>
      <rect x="80" y="72" width="108" height="9" rx="1" fill="#d97706"/>

      <text x="275" y="55" font-size="8.5" font-weight="700" fill="#b45309">Dominant Share: 60%</text>
      <text x="275" y="69" font-size="8.0" fill="#64748b">(Tool API Leases)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: DRF FORMULATION & INVARIANTS                            -->
  <!-- ================================================================= -->
  <g transform="translate(830, 75)">
    <rect x="0" y="0" width="330" height="442" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="330" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">DRF MAX-MIN OPTIMIZATION &amp; GUARANTEES</text>

    <!-- Formulation Card -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="300" height="152" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Dominant Share Definition</text>
      <text x="10" y="32" font-size="8.0" fill="#475569">For tenant i consuming vector U_i across resources R:</text>

      <rect x="10" y="40" width="280" height="26" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="150" y="57" text-anchor="middle" font-family="Courier, monospace" font-size="9.5" font-weight="700" fill="#0f172a">s_i = max_{r ∈ R} { U_{i,r} / C_r }</text>

      <text x="10" y="80" font-size="8.0" fill="#475569">DRF scheduler equalizes dominant shares:</text>

      <rect x="10" y="88" width="280" height="26" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="150" y="105" text-anchor="middle" font-family="Courier, monospace" font-size="9.5" font-weight="700" fill="#0369a1">max min_{i} { s_i }</text>

      <text x="10" y="132" font-size="8" font-weight="700" fill="#15803d">Allocates next chunk to tenant with smallest s_i</text>
    </g>

    <!-- Systems Invariants Card -->
    <g transform="translate(15, 196)">
      <rect x="0" y="0" width="300" height="233" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0369a1">Classical Systems Properties (Ghodsi et al.)</text>

      <text x="10" y="36" font-size="8.0" fill="#334155">• <tspan font-weight="700">Sharing Incentive:</tspan> Each of n tenants is guaranteed</text>
      <text x="18" y="48" font-size="8.0" fill="#475569">at least 1/n share of their dominant resource.</text>

      <text x="10" y="66" font-size="8.0" fill="#334155">• <tspan font-weight="700">Strategy-Proofness:</tspan> Tenants cannot game the</text>
      <text x="18" y="78" font-size="8.0" fill="#475569">scheduler by inflating unused resource demands.</text>

      <text x="10" y="96" font-size="8.0" fill="#334155">• <tspan font-weight="700">Envy-Freeness:</tspan> No tenant prefers another's bundle.</text>

      <text x="10" y="114" font-size="8.0" fill="#334155">• <tspan font-weight="700">Pareto Efficiency:</tspan> Unused FLOPs are consumed by</text>
      <text x="18" y="126" font-size="8.0" fill="#475569">compute agents without reducing memory shares.</text>

      <rect x="10" y="142" width="280" height="38" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="150" y="158" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Multi-Resource Packing Gains</text>
      <text x="150" y="172" text-anchor="middle" font-size="8.0" fill="#15803d">Increases aggregate cluster utilization by 40%–65%</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- SYSTEMS PRINCIPLE CALLOUT BANNER                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 530)">
    <rect width="1120" height="92" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="15" y="12" width="85" height="68" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="57" y="44" text-anchor="middle" font-size="9" font-weight="800" fill="#6d28d9">SYSTEMS</text>
    <text x="57" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#7c3aed">PRINCIPLE</text>

    <text x="115" y="34" font-size="10.5" font-weight="700" fill="#0f172a">Multi-Resource Heterogeneity Precludes Single-Metric Agent Scheduling</text>
    <text x="115" y="52" font-size="8" fill="#475569">Agent workloads consume coupled, orthogonal resources: Tensor Core FLOPs, HBM KV blocks, and external API leases.</text>
    <text x="115" y="68" font-size="8" fill="#475569">Dominant Resource Fairness guarantees sharing incentives and envy-freeness, packing complementary agent types efficiently.</text>
  </g>
</g>
</svg>