<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: AGENT TRAJECTORY INGESTION                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="330" height="442" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="330" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">AGENT TRAJECTORY INGESTION &amp; WORKLOADS</text>

    <!-- Workload Characteristic 1: Heavy-Tailed Pareto -->
    <g transform="translate(15, 34)">
      <rect width="300" height="120" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Heavy-Tailed Pareto Service Times</text>
      <text x="10" y="34" font-size="8.0" fill="#475569">• Step distribution: <tspan font-weight="700" fill="#6d28d9">P(N &gt; x) ~ x^(-α)</tspan> (α ≈ 1.1)</text>
      <text x="10" y="48" font-size="8.0" fill="#475569">• 80% tasks finish in &lt; 5 steps; 5% run &gt; 100 steps</text>
      <text x="10" y="62" font-size="8.0" fill="#475569">• Unpredictable horizons break classical FIFO/M/M/k</text>
      <text x="10" y="80" font-size="8.0" font-weight="700" fill="#b45309">High-variance service time collapses naive queues</text>
      <text x="10" y="94" font-size="8.0" fill="#64748b">Demands proactive horizon estimation at ingress</text>
    </g>

    <!-- Workload Characteristic 2: Bimodal Execution -->
    <g transform="translate(15, 162)">
      <rect width="300" height="118" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Bimodal Compute vs. Tool I/O</text>
      <text x="10" y="34" font-size="8.0" fill="#475569">• GPU Burst: 100 – 400 ms token decode</text>
      <text x="10" y="48" font-size="8.0" fill="#475569">• Tool Idle Gap: 1 – 60 s (Bash, Pytest, Web)</text>
      <text x="10" y="62" font-size="8.0" fill="#475569">• Human Wait: Minutes to hours for approval</text>
      <text x="10" y="80" font-size="8.0" font-weight="700" fill="#15803d">Demands dynamic context suspension</text>
      <text x="10" y="94" font-size="8.0" fill="#64748b">Swapping to Host RAM eliminates stranding penalty</text>
    </g>

    <!-- Workload Characteristic 3: Prefix Sharing -->
    <g transform="translate(15, 288)">
      <rect width="300" height="140" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#6d28d9">Multi-Turn Prefix Redundancy</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Turn t+1 shares 90%+ tokens with Turn t</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• Routing Turn t+1 to a new worker forces</text>
      <text x="18" y="62" font-size="8.0" font-weight="700" fill="#dc2626">100% redundant prefill recomputation!</text>
      <text x="10" y="78" font-size="8.0" fill="#334155">• Cost penalty: ~9.2 seconds per turn on 70B</text>
      <text x="10" y="98" font-size="8" font-weight="700" fill="#6d28d9">Requires Session-Affinity Routing</text>
      <text x="10" y="112" font-size="8.0" fill="#64748b">Pins session context to warm GPU workers</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: TRAJECTORY SCHEDULING CONTROLLER                        -->
  <!-- ================================================================= -->
  <g transform="translate(385, 75)">
    <rect x="0" y="0" width="430" height="442" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">TRAJECTORY SCHEDULING CONTROLLER (Coordinator)</text>

    <!-- Component 1: Horizon & Memory Predictor -->
    <g transform="translate(15, 34)">
      <rect width="400" height="88" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="8" width="20" height="16" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">1</text>
      <text x="36" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Predictive Horizon &amp; Memory Sizing</text>
      <text x="10" y="38" font-size="8.0" fill="#475569">Estimates task horizon H(X_0) and peak KV-cache footprint:</text>

      <rect x="10" y="46" width="380" height="24" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="200" y="62" text-anchor="middle" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#6d28d9">S_peak = S_token · (L_initial + E[N] · ΔL_step)</text>
    </g>

    <!-- Component 2: Capacity-Aware Admission Control -->
    <g transform="translate(15, 130)">
      <rect width="400" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="8" width="20" height="16" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">2</text>
      <text x="36" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Capacity-Aware Admission Gate</text>

      <text x="10" y="38" font-size="8.0" fill="#475569">• Checks cluster HBM safety margin: <tspan font-weight="700">M_free &gt; θ_reserve + S_peak</tspan></text>
      <text x="10" y="52" font-size="8.0" fill="#475569">• Rejects or queues new sessions before memory oversubscription</text>
      <text x="10" y="70" font-size="8.0" font-weight="700" fill="#b45309">Prevents Coffman deadlocks and cascading GPU OOM crashes</text>
    </g>

    <!-- Component 3: Cache-Affinity Session Router -->
    <g transform="translate(15, 230)">
      <rect width="400" height="98" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="8" width="20" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">3</text>
      <text x="36" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Cache-Affinity Session Routing</text>

      <text x="10" y="38" font-size="8.0" fill="#475569">• Hashes Session ID and checks Radix cache locality across fleet</text>
      <text x="10" y="52" font-size="8.0" fill="#475569">• Steers step t+1 directly to the GPU holding warm prefix blocks</text>
      <text x="10" y="66" font-size="8.0" fill="#475569">• Fallback: RDMA transfer if target worker is compute-saturated</text>
      <text x="10" y="84" font-size="8.0" font-weight="700" fill="#15803d">Achieves &gt; 90% prefix cache hit rate across fleet</text>
    </g>

    <!-- Component 4: Preemption & Suspension Coordinator -->
    <g transform="translate(15, 336)">
      <rect width="400" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="8" width="20" height="16" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="20" y="20" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0369a1">4</text>
      <text x="36" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Preemption and Suspension Coordinator</text>

      <text x="10" y="38" font-size="8.0" fill="#475569">• Detects external tool waits; initiates async DMA swap: <tspan font-weight="700">HBM → DRAM</tspan></text>
      <text x="10" y="52" font-size="8.0" fill="#475569">• Respects <tspan font-weight="700" fill="#dc2626">Reversibility Boundary</tspan>: never aborts mutated workflows</text>
      <text x="10" y="70" font-size="8.0" font-weight="700" fill="#0369a1">Frees physical HBM page frames during long tool stalls</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: TARGET GPU SERVING FLEET                                -->
  <!-- ================================================================= -->
  <g transform="translate(830, 75)">
    <rect x="0" y="0" width="330" height="442" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="330" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">TARGET GPU SERVING FLEET</text>

    <!-- Worker 1: Active Decoding -->
    <g transform="translate(15, 34)">
      <rect width="300" height="120" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#15803d">GPU Worker #1 (Active Session)</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Session A: Turn 12 (Active decode)</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• Radix Tree: 48k tokens cached</text>
      <text x="10" y="62" font-size="8.0" fill="#334155">• Suffix prefill: 240 tokens</text>
      <text x="10" y="80" font-size="8.0" font-weight="700" fill="#15803d">✓ 100% Affinity Match (Zero recompute)</text>
      <text x="10" y="96" font-size="8.0" fill="#64748b">TTFT: 110 ms | GPU HBM: 72% utilized</text>
    </g>

    <!-- Worker 2: Tool-Wait Swapped -->
    <g transform="translate(15, 162)">
      <rect width="300" height="118" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#b45309">GPU Worker #2 (Swapped Session)</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Session B: Awaiting Pytest (45 s wait)</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• KV Cache swapped to Host DRAM</text>
      <text x="10" y="62" font-size="8.0" fill="#334155">• HBM blocks yielded to active batch</text>
      <text x="10" y="80" font-size="8.0" font-weight="700" fill="#b45309">⚡ Suspended: 0 GB HBM pinned</text>
      <text x="10" y="96" font-size="8.0" fill="#64748b">Ready for prefetch on tool completion</text>
    </g>

    <!-- Worker 3: Multi-Resource Balanced -->
    <g transform="translate(15, 288)">
      <rect width="300" height="140" rx="1" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#1e293b">GPU Worker #3 (DRF Balanced)</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Co-locates compute &amp; memory jobs</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• Dominant Resource Fairness pacing</text>
      <text x="10" y="62" font-size="8.0" fill="#334155">• Enforces QoS P99 &lt; 25 ms ITL</text>
      <text x="10" y="82" font-size="8.0" font-weight="700" fill="#15803d">✓ Goodput optimized under strict SLOs</text>
      <text x="10" y="98" font-size="8.0" fill="#64748b">Cluster goodput: 3.4x higher than FIFO</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- SYSTEMS PRINCIPLE CALLOUT BANNER                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 530)">
    <rect width="1120" height="92" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="15" y="12" width="85" height="68" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="57" y="44" text-anchor="middle" font-size="9" font-weight="800" fill="#6d28d9">SYSTEMS</text>
    <text x="57" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#7c3aed">PRINCIPLE</text>

    <text x="115" y="34" font-size="10.5" font-weight="700" fill="#0f172a">The Session Trajectory, Not the Isolated Request, is the Schedulable Entity</text>
    <text x="115" y="52" font-size="8" fill="#475569">Treating multi-turn agent turns as independent requests destroys prefix cache locality and induces fatal memory fragmentation.</text>
    <text x="115" y="68" font-size="8" fill="#475569">Schedulers must route with session affinity, predict trajectory horizons, and suspend idle KV blocks during tool execution.</text>
  </g>
</g>
</svg>