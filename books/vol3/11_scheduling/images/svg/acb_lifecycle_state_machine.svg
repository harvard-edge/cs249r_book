<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="900" height="490" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- ROW 1: FORWARD EXECUTION PATH (y = 85 to 149)                     -->
  <!-- ================================================================= -->
  <!-- 1. INITIALIZED -->
  <g transform="translate(45, 85)">
    <rect x="0" y="0" width="150" height="64" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">INITIALIZED</text>
    <text x="10" y="40" font-size="7.5" fill="#475569">• Alloc ACB &amp; UUIDv7</text>
    <text x="10" y="54" font-size="7.5" fill="#475569">• Verify Leases / TTL</text>
  </g>

  <!-- Arrow: INITIALIZED -> ACTIVE_PREFILL -->
  <path d="M195,117 L245,117" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="220" y="110" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#0369a1">dispatch()</text>

  <!-- 2. ACTIVE_PREFILL -->
  <g transform="translate(245, 85)">
    <rect x="0" y="0" width="165" height="64" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="82" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0369a1">ACTIVE_PREFILL</text>
    <text x="10" y="40" font-size="7.5" fill="#0c4a6e">• Ingest Prompt Context</text>
    <text x="10" y="54" font-size="7.5" fill="#0c4a6e">• Compute-Bound GEMM</text>
  </g>

  <!-- Arrow: ACTIVE_PREFILL -> ACTIVE_DECODE -->
  <path d="M410,117 L460,117" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="435" y="110" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#0369a1">first_token</text>

  <!-- 3. ACTIVE_DECODE -->
  <g transform="translate(460, 85)">
    <rect x="0" y="0" width="165" height="64" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="82" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0369a1">ACTIVE_DECODE</text>
    <text x="10" y="40" font-size="7.5" fill="#0c4a6e">• Autoregressive Step</text>
    <text x="10" y="54" font-size="7.5" fill="#0c4a6e">• Grammar Mask (DFA)</text>
  </g>

  <!-- Self-loop on ACTIVE_DECODE (Thought Generation) -->
  <path d="M525,85 C525,57 570,57 570,85" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="547" y="54" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#0369a1">emit_thought</text>

  <!-- Arrow: ACTIVE_DECODE -> TERMINATED (Success) -->
  <path d="M625,117 L675,117" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="650" y="110" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#15803d">goal_done</text>

  <!-- 4. TERMINATED (Terminal State) -->
  <g transform="translate(675, 85)">
    <rect x="0" y="0" width="165" height="64" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="82" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">TERMINATED</text>
    <text x="10" y="40" font-size="7.5" font-weight="700" fill="#16a34a">SUCCESS: Goal Verified</text>
    <text x="10" y="54" font-size="7.5" font-weight="700" fill="#b91c1c">ABORT: Fatal Quota / Invariant</text>
  </g>

  <!-- ================================================================= -->
  <!-- ROW 2: SUSPENSION & RECOVERY (y = 215 to 283)                     -->
  <!-- ================================================================= -->
  <!-- 5. COMPENSATING_ROLLBACK -->
  <g transform="translate(45, 215)">
    <rect x="0" y="0" width="150" height="68" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="75" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">COMPENSATING_ROLLBACK</text>
    <text x="10" y="38" font-size="7.5" fill="#7f1d1d">• Unwind Sagas LIFO</text>
    <text x="10" y="50" font-size="7.5" fill="#7f1d1d">• Execute Inverses C_k(s)</text>
    <text x="10" y="62" font-size="7.5" fill="#dc2626">• Restore Safe Snapshot</text>
  </g>

  <!-- Arrow: COMPENSATING_ROLLBACK -> ACTIVE_PREFILL (Rollback Succeeded) -->
  <path d="M150,215 L150,165 L255,165 L255,149" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="200" y="160" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#15803d">rollback_ok</text>

  <!-- 6. SUSPENDED_TOOL_WAIT -->
  <g transform="translate(245, 215)">
    <rect x="0" y="0" width="165" height="68" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="82" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">SUSPENDED_TOOL_WAIT</text>
    <text x="10" y="38" font-size="7.5" fill="#78350f">• MicroVM / Sandbox Run</text>
    <text x="10" y="50" font-size="7.5" fill="#78350f">• If T_wait &lt; tau_swap: Pin HBM</text>
    <text x="10" y="62" font-size="7.5" fill="#b91c1c">• If T_wait &gt;= tau_swap: Evict</text>
  </g>

  <!-- Arrow: ACTIVE_DECODE -> SUSPENDED_TOOL_WAIT -->
  <path d="M485,149 L485,182 L375,182 L375,215" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="430" y="176" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#b45309">tool_call()</text>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> ACTIVE_PREFILL (Tool Return) -->
  <path d="M310,215 L310,149" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="302" y="182" text-anchor="end" font-family="Courier, monospace" font-size="7" fill="#15803d">tool_return(obs)</text>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> COMPENSATING_ROLLBACK (Invariant Failed) -->
  <path d="M245,247 L195,247" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="220" y="240" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" fill="#b91c1c">invariant_failed</text>

  <!-- 7. SUSPENDED_SWAPPED -->
  <g transform="translate(460, 215)">
    <rect x="0" y="0" width="165" height="68" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="82" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">SUSPENDED_SWAPPED</text>
    <text x="10" y="38" font-size="7.5" fill="#78350f">• KV Evicted to Host RAM</text>
    <text x="10" y="50" font-size="7.5" fill="#78350f">• HBM Freed for Other Jobs</text>
    <text x="10" y="62" font-size="7.5" fill="#64748b">• DMA Prefetch on Wake</text>
  </g>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> SUSPENDED_SWAPPED -->
  <path d="M410,247 L460,247" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-orange)"/>
  <text x="435" y="240" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#b45309">dma_evict</text>

  <!-- Arrow: SUSPENDED_SWAPPED -> ACTIVE_PREFILL (DMA Prefetch) -->
  <path d="M525,215 L525,165 L395,165 L395,149" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="460" y="160" text-anchor="middle" font-family="Courier, monospace" font-size="6.8" fill="#15803d">dma_prefetch(KV)</text>

  <!-- 8. SUSPENDED_HUMAN_GATE -->
  <g transform="translate(675, 215)">
    <rect x="0" y="0" width="165" height="68" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="82" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">SUSPENDED_HUMAN_GATE</text>
    <text x="10" y="38" font-size="7.5" fill="#78350f">• Reversibility Barrier Trap</text>
    <text x="10" y="50" font-size="7.5" fill="#78350f">• 100% KV Paged to NVMe</text>
    <text x="10" y="62" font-size="7.5" fill="#78350f">• Awaiting Signature / Token</text>
  </g>

  <!-- Arrow: ACTIVE_DECODE -> SUSPENDED_HUMAN_GATE -->
  <path d="M600,149 L600,182 L740,182 L740,215" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="670" y="177" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#b45309">escalate_privilege()</text>

  <!-- Arrow: SUSPENDED_HUMAN_GATE -> ACTIVE_PREFILL (Approval via Upper Corridor) -->
  <path d="M710,215 L710,197 L425,197 L425,125 L410,125" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="570" y="192" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#15803d">approved()</text>

  <!-- ================================================================= -->
  <!-- ROW 3: PERSISTENCE (y = 350 to 418)                               -->
  <!-- ================================================================= -->
  <!-- 9. CHECKPOINTING -->
  <g transform="translate(245, 350)">
    <rect x="0" y="0" width="165" height="68" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="82" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">CHECKPOINTING</text>
    <text x="10" y="38" font-size="7.5" fill="#581c87">• WAL Fsync &amp; CoW Snapshot</text>
    <text x="10" y="50" font-size="7.5" fill="#581c87">• Vector Clock &amp; Burn Update</text>
    <text x="10" y="62" font-size="7.5" fill="#581c87">• Flush KV Delta to Staging</text>
  </g>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> CHECKPOINTING (Committed Step) -->
  <path d="M327,283 L327,350" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="335" y="318" font-family="Courier, monospace" font-size="7" fill="#6d28d9">step_commit</text>

  <!-- Arrow: CHECKPOINTING -> ACTIVE_PREFILL (Resume Next Step) -->
  <path d="M245,384 L215,384 L215,182 L280,182 L280,149" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="208" y="300" text-anchor="end" font-family="Courier, monospace" font-size="7" fill="#15803d">committed</text>

  <!-- Arrow: SUSPENDED_HUMAN_GATE -> COMPENSATING_ROLLBACK (Rejection via Lower Channel) -->
  <path d="M757,283 L757,445 L120,445 L120,283" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="460" y="440" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#b91c1c">rejected()</text>

  <!-- Arrow: COMPENSATING_ROLLBACK -> TERMINATED (Fatal Abort via Outer Perimeter) -->
  <path d="M85,283 L85,475 L855,475 L855,117 L840,117" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="470" y="470" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#b91c1c">rollback_exhausted (Fatal ABORT)</text>

</g>
</svg>