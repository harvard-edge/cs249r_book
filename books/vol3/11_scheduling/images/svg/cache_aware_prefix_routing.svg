<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- Outer Architecture Boundary Framing Card -->
  <rect x="20" y="20" width="1160" height="620" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">CACHE-AWARE LOAD BALANCING AND PREFIX ROUTING ARCHITECTURE</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Hash-based Radix tree matching and joint affinity-load objective function across cluster worker fleet</text>

  <!-- ================================================================= -->
  <!-- COLUMN 1: PROMPT CHUNK FINGERPRINTING                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="340" height="545" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">1. PROMPT CHUNK FINGERPRINTING</text>

    <!-- Prompt Anatomy Card -->
    <g transform="translate(15, 34)">
      <rect width="310" height="142" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Incoming Request Prompt (S = 40,000 tokens)</text>

      <!-- Token Segments -->
      <g transform="translate(12, 28)">
        <rect x="0" y="0" width="118" height="22" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="59" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">System (16k)</text>

        <rect x="122" y="0" width="58" height="22" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="151" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">Tools (8k)</text>

        <rect x="184" y="0" width="70" height="22" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="219" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Repo (12k)</text>

        <rect x="258" y="0" width="28" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="272" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">Turn</text>
      </g>

      <text x="12" y="68" font-size="8" fill="#334155">• Shared Prefix: <tspan font-weight="700" fill="#6d28d9">36,000 tokens (90%)</tspan></text>
      <text x="12" y="84" font-size="8" fill="#334155">• New Turn Suffix: 4,000 tokens (10%)</text>
      <text x="12" y="100" font-size="8" fill="#334155">• Invariant: Chunk size <tspan font-weight="700" fill="#0f172a">B_chunk = 16 tokens</tspan></text>
      <text x="12" y="122" font-size="8" font-weight="700" fill="#15803d">Identical prefix across 40 swarm agents</text>
    </g>

    <!-- Rolling Merkle Hash Card -->
    <g transform="translate(15, 188)">
      <rect width="310" height="170" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#6d28d9">Rolling Merkle Chunk Hashing</text>
      <text x="12" y="32" font-size="8" fill="#64748b">Recursive chunk hash function:</text>

      <rect x="12" y="40" width="286" height="26" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="155" y="57" text-anchor="middle" font-family="Courier, monospace" font-size="9.5" font-weight="700" fill="#6d28d9">h_k = Hash(h_{k-1} || c_k)</text>

      <text x="12" y="82" font-size="8" fill="#334155">• Initial Vector: <tspan font-family="Courier, monospace" fill="#0f172a">h_0 = IV</tspan></text>
      <text x="12" y="98" font-size="8" fill="#334155">• Merkle chain captures strict token ordering</text>
      <text x="12" y="114" font-size="8" fill="#334155">• Produces 64-bit integer stream: <tspan font-family="Courier, monospace" fill="#6d28d9">[h_1 ... h_m]</tspan></text>
      <text x="12" y="130" font-size="8" fill="#64748b">O(1) incremental hashing at cluster ingress</text>
      <rect x="12" y="138" width="286" height="22" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="155" y="153" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Compact Fixed-Size Fingerprint</text>
    </g>

    <!-- Router Action Notice -->
    <g transform="translate(15, 370)">
      <rect width="310" height="160" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Hash Forwarding Invariant</text>
      <text x="12" y="36" font-size="8" fill="#475569">• Ingress router hashes prompt token stream</text>
      <text x="12" y="52" font-size="8" fill="#475569">• Omits raw token text from router query</text>
      <text x="12" y="68" font-size="8" fill="#475569">• Transmits compact 64-bit hash keys</text>
      <text x="12" y="84" font-size="8" fill="#475569">• Prevents router memory bandwidth exhaustion</text>

      <rect x="12" y="104" width="286" height="42" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="155" y="122" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Zero String Comparison in Ingress Router</text>
      <text x="155" y="135" text-anchor="middle" font-size="7.5" fill="#581c87">Pure 64-bit integer lookup in Radix trie</text>
    </g>
  </g>

  <!-- Arrow: Col 1 -> Col 2 -->
  <path d="M385,345 L410,345" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-purple)"/>
  <text x="397" y="338" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">h_k keys</text>

  <!-- ================================================================= -->
  <!-- COLUMN 2: GLOBAL PREFIX DIRECTORY (RADIX INDEX)                   -->
  <!-- ================================================================= -->
  <g transform="translate(415, 75)">
    <rect x="0" y="0" width="400" height="545" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">2. GLOBAL PREFIX DIRECTORY (CLUSTER RADIX INDEX)</text>

    <!-- Global Trie Structure Visualization -->
    <g transform="translate(15, 34)">
      <rect width="370" height="245" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Distributed Radix Prefix Trie</text>

      <!-- Root Node -->
      <rect x="95" y="28" width="180" height="32" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="185" y="42" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">Root [h_0: Empty]</text>
      <text x="185" y="54" text-anchor="middle" font-size="7.5" fill="#64748b">Active Nodes: {W1, W2, W3, W4}</text>

      <!-- Edge 1 -->
      <line x1="185" y1="60" x2="185" y2="76" stroke="#0284c7" stroke-width="1.5"/>

      <!-- Level 1: System Prompt -->
      <rect x="75" y="76" width="220" height="32" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="185" y="90" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">System Prompt [h_1...h_1000]</text>
      <text x="185" y="102" text-anchor="middle" font-size="7.5" fill="#0c4a6e">Cached in HBM: {W1, W2, W3}</text>

      <!-- Edge 2 -->
      <line x1="185" y1="108" x2="185" y2="124" stroke="#0284c7" stroke-width="1.5"/>

      <!-- Level 2: Tool Schemas -->
      <rect x="85" y="124" width="200" height="32" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="185" y="138" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">Tool Schemas [h_1001...h_1500]</text>
      <text x="185" y="150" text-anchor="middle" font-size="7.5" fill="#0c4a6e">Cached in HBM: {W1, W2}</text>

      <!-- Edge 3 Split -->
      <line x1="140" y1="156" x2="95" y2="174" stroke="#0284c7" stroke-width="1.5"/>
      <line x1="230" y1="156" x2="275" y2="174" stroke="#0284c7" stroke-width="1.5"/>

      <!-- Level 3 Left: Repo Context A -->
      <rect x="15" y="174" width="160" height="42" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="95" y="190" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Repo A [h_1501...h_2250]</text>
      <text x="95" y="206" text-anchor="middle" font-size="7.5" font-weight="700" fill="#16a34a">Node W1 ONLY (Warm Hit)</text>

      <!-- Level 3 Right: Repo Context B -->
      <rect x="195" y="174" width="160" height="42" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="275" y="190" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Repo B [h_1501...h_2250]</text>
      <text x="275" y="206" text-anchor="middle" font-size="7.5" fill="#64748b">Node W2 ONLY (Warm Hit)</text>
    </g>

    <!-- Joint Optimization Equation Card -->
    <g transform="translate(15, 290)">
      <rect width="370" height="240" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#0f172a">Joint Affinity vs. Load Objective Function</text>

      <rect x="12" y="28" width="346" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="185" y="49" text-anchor="middle" font-family="Courier, monospace" font-size="9" font-weight="700" fill="#0f172a">w* = argmax [ μ · (Match/S) - (1-μ) · (L_j / L_max)^γ ]</text>

      <text x="12" y="78" font-size="8" fill="#475569">• <tspan font-weight="700" fill="#6d28d9">μ ∈ [0, 1]</tspan>: Cache affinity coefficient (default 0.7)</text>
      <text x="12" y="94" font-size="8" fill="#475569">• <tspan font-weight="700" fill="#16a34a">Match/S</tspan>: Fraction of prompt tokens cached in node's HBM</text>
      <text x="12" y="110" font-size="8" fill="#475569">• <tspan font-weight="700" fill="#d97706">L_j / L_max</tspan>: Queue load ratio (blocks or queued tokens)</text>
      <text x="12" y="126" font-size="8" fill="#475569">• <tspan font-weight="700" fill="#dc2626">γ ≥ 1</tspan>: Non-linear penalty preventing queue saturation</text>
      <text x="12" y="146" font-size="8" font-weight="700" fill="#0369a1">Guarantees high cache reuse without hot-spotting popular prefixes</text>

      <rect x="12" y="160" width="346" height="26" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="185" y="177" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">Consistent Hashing with Bounded Loads (1 + ε)</text>
    </g>
  </g>

  <!-- Arrow: Col 2 -> Col 3 -->
  <path d="M820,345 L845,345" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="832" y="338" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">dispatch</text>

  <!-- ================================================================= -->
  <!-- COLUMN 3: WORKER NODE DISPATCH & HIT RATES                        -->
  <!-- ================================================================= -->
  <g transform="translate(850, 75)">
    <rect x="0" y="0" width="310" height="545" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">3. WORKER NODE DISPATCH &amp; HIT RATES</text>

    <!-- Worker 1: Selected Target (Warm Hit) -->
    <g transform="translate(15, 34)">
      <rect width="280" height="152" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="10" y="10" width="62" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="41" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">SELECTED</text>
      <text x="80" y="23" font-size="9" font-weight="700" fill="#15803d">Worker Node 1 (w*)</text>

      <text x="10" y="42" font-size="8" fill="#15803d">• Cache Match: <tspan font-weight="700">36,000 tokens (90% hit)</tspan></text>
      <text x="10" y="56" font-size="8" fill="#15803d">• Queue Load: <tspan font-weight="700">L_1 = 42% (Normal)</tspan></text>
      <text x="10" y="70" font-size="8" fill="#15803d">• Joint Score: <tspan font-weight="700">0.7·(0.9) - 0.3·(0.42)^2 = +0.577</tspan></text>

      <rect x="10" y="80" width="260" height="38" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="140" y="96" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Prefill Skipped for 36k Tokens</text>
      <text x="140" y="110" text-anchor="middle" font-size="7.5" fill="#15803d">TTFT &lt; 15 ms • Zero Duplicate Compute</text>
    </g>

    <!-- Worker 2: Rejected (Queue Overloaded) -->
    <g transform="translate(15, 198)">
      <rect width="280" height="152" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <rect x="10" y="10" width="65" height="18" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="42" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">PENALIZED</text>
      <text x="82" y="23" font-size="9" font-weight="700" fill="#b45309">Worker Node 2</text>

      <text x="10" y="42" font-size="8" fill="#78350f">• Cache Match: 24,000 tokens (60% hit)</text>
      <text x="10" y="56" font-size="8" fill="#78350f">• Queue Load: <tspan font-weight="700">L_2 = 91% (Near Saturation)</tspan></text>
      <text x="10" y="70" font-size="8" fill="#78350f">• Joint Score: <tspan font-weight="700">0.7·(0.6) - 0.3·(0.91)^2 = +0.171</tspan></text>

      <rect x="10" y="80" width="260" height="38" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="140" y="96" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Shed to Avoid SLA Violations</text>
      <text x="140" y="110" text-anchor="middle" font-size="7.5" fill="#b45309">Prevents Head-of-Line Queue Delays</text>
    </g>

    <!-- Worker 3: Cold Fallback -->
    <g transform="translate(15, 362)">
      <rect width="280" height="152" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <rect x="10" y="10" width="65" height="18" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="42" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">COLD POOL</text>
      <text x="82" y="23" font-size="9" font-weight="700" fill="#334155">Worker Nodes 3 &amp; 4</text>

      <text x="10" y="42" font-size="8" fill="#475569">• Cache Match: 0 tokens (Cold Miss)</text>
      <text x="10" y="56" font-size="8" fill="#475569">• Queue Load: L_3 = 12% (Idle)</text>
      <text x="10" y="70" font-size="8" fill="#475569">• Joint Score: 0.7·(0.0) - 0.3·(0.12)^2 = -0.004</text>

      <rect x="10" y="80" width="260" height="38" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="140" y="96" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Reserved for Uncached Requests</text>
      <text x="140" y="110" text-anchor="middle" font-size="7.5" fill="#64748b">Isolated from Swarm Cache Footprint</text>
    </g>
  </g>
</svg>
