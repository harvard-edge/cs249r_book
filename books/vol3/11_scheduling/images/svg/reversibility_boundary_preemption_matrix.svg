<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- Outer Architecture Boundary Framing Card -->
  <rect x="20" y="20" width="1160" height="620" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE REVERSIBILITY BOUNDARY AND PREEMPTION DECISION MATRIX</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Action reversibility spectrum and preemption feasibility across compute, idempotent reads, reversible writes, and physical side effects</text>

  <!-- ================================================================= -->
  <!-- SPECTRUM CONTAINER                                                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="1120" height="442" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="1120" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1e293b">ACTION REVERSIBILITY SPECTRUM AND PREEMPTION FEASIBILITY</text>
    <text x="1108" y="16" text-anchor="end" font-size="8" fill="#64748b">From Ephemeral Compute to Physical Side Effects</text>

    <!-- Zone 1: Pure LLM Compute -->
    <g transform="translate(15, 34)">
      <rect width="256" height="396" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="10" y="10" width="55" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="37" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">ZONE 1</text>
      <text x="10" y="44" font-size="10.5" font-weight="700" fill="#15803d">Pure Compute</text>
      <text x="10" y="58" font-size="8" fill="#16a34a">Prompt Prefill &amp; Token Decode</text>

      <rect x="10" y="70" width="236" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="18" y="86" font-size="8" font-weight="700" fill="#0f172a">State Residency:</text>
      <text x="18" y="102" font-size="7.5" fill="#475569">• Ephemeral activations in HBM</text>
      <text x="18" y="118" font-size="7.5" fill="#475569">• Transient KV cache tensors</text>

      <rect x="10" y="146" width="236" height="74" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="18" y="164" font-size="8" font-weight="700" fill="#0f172a">Reversibility Degree:</text>
      <text x="18" y="182" font-size="10" font-weight="700" fill="#15803d">100% Fully Reversible</text>
      <text x="18" y="200" font-size="7.5" fill="#16a34a">Pure functional forward pass</text>

      <rect x="10" y="230" width="236" height="152" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="18" y="248" font-size="8" font-weight="700" fill="#15803d">Preemption Policy:</text>
      <text x="18" y="266" font-size="9" font-weight="700" fill="#15803d">Instant Preemption / Kill</text>
      <text x="18" y="284" font-size="7.5" fill="#475569">• Discard or swap KV cache</text>
      <text x="18" y="300" font-size="7.5" fill="#475569">• Zero external corruption</text>
      <text x="18" y="316" font-size="7.5" fill="#475569">• Restart at any iteration</text>
      <text x="18" y="340" font-size="7.5" font-weight="700" fill="#15803d">✓ Safest schedulable tier</text>
    </g>

    <!-- Zone 2: Idempotent Tool Reads -->
    <g transform="translate(283, 34)">
      <rect width="256" height="396" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="10" y="10" width="55" height="18" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="37" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">ZONE 2</text>
      <text x="10" y="44" font-size="10.5" font-weight="700" fill="#0369a1">Idempotent Reads</text>
      <text x="10" y="58" font-size="8" fill="#0284c7">File &amp; Web Observations</text>

      <rect x="10" y="70" width="236" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="18" y="86" font-size="8" font-weight="700" fill="#0f172a">State Residency:</text>
      <text x="18" y="102" font-size="7.5" fill="#475569">• read_file, grep, web_search</text>
      <text x="18" y="118" font-size="7.5" fill="#475569">• Read-only DB SELECT queries</text>

      <rect x="10" y="146" width="236" height="74" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="18" y="164" font-size="8" font-weight="700" fill="#0f172a">Reversibility Degree:</text>
      <text x="18" y="182" font-size="10" font-weight="700" fill="#0369a1">Idempotent Read f(x)</text>
      <text x="18" y="200" font-size="7.5" fill="#0284c7">Zero external state mutation</text>

      <rect x="10" y="230" width="236" height="152" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="18" y="248" font-size="8" font-weight="700" fill="#0369a1">Preemption Policy:</text>
      <text x="18" y="266" font-size="9" font-weight="700" fill="#0369a1">Safe Suspend &amp; Preempt</text>
      <text x="18" y="284" font-size="7.5" fill="#475569">• Abort running network call</text>
      <text x="18" y="300" font-size="7.5" fill="#475569">• Release GPU HBM to pool</text>
      <text x="18" y="316" font-size="7.5" fill="#475569">• Re-run tool upon resumption</text>
      <text x="18" y="340" font-size="7.5" font-weight="700" fill="#0369a1">✓ Bounded delay overhead</text>
    </g>

    <!-- The Reversibility Boundary Barrier Line -->
    <line x1="565" y1="34" x2="565" y2="430" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
    <g transform="translate(553, 195)">
      <rect width="24" height="74" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="12" y="41" text-anchor="middle" font-size="7.5" font-weight="800" fill="#991b1b" transform="rotate(90 12 41)">BOUNDARY</text>
    </g>

    <!-- Zone 3: Reversible Writes (Compensating Sagas) -->
    <g transform="translate(581, 34)">
      <rect width="256" height="396" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect x="10" y="10" width="55" height="18" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="37" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">ZONE 3</text>
      <text x="10" y="44" font-size="10.5" font-weight="700" fill="#b45309">Reversible Writes</text>
      <text x="10" y="58" font-size="8" fill="#d97706">Compensating Sagas (C_i)</text>

      <rect x="10" y="70" width="236" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="18" y="86" font-size="8" font-weight="700" fill="#0f172a">State Residency:</text>
      <text x="18" y="102" font-size="7.5" fill="#475569">• Git branch commits, temp files</text>
      <text x="18" y="118" font-size="7.5" fill="#475569">• SQL transaction with rollback log</text>

      <rect x="10" y="146" width="236" height="74" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="18" y="164" font-size="8" font-weight="700" fill="#0f172a">Reversibility Degree:</text>
      <text x="18" y="182" font-size="10" font-weight="700" fill="#b45309">Semi-Reversible (Undoable)</text>
      <text x="18" y="200" font-size="7.5" fill="#d97706">Has formal compensating action</text>

      <rect x="10" y="230" width="236" height="152" rx="1" fill="#f8fafc" stroke="#d97706" stroke-width="1"/>
      <text x="18" y="248" font-size="8" font-weight="700" fill="#b45309">Preemption Policy:</text>
      <text x="18" y="266" font-size="9" font-weight="700" fill="#b45309">Conditional Preemption</text>
      <text x="18" y="284" font-size="7.5" fill="#475569">• Must run compensating workflow</text>
      <text x="18" y="300" font-size="7.5" fill="#475569">• Execute git reset --hard</text>
      <text x="18" y="316" font-size="7.5" fill="#475569">• Reverts dirty workspace state</text>
      <text x="18" y="340" font-size="7.5" font-weight="700" fill="#b45309">⚠ High preemption rollback cost</text>
    </g>

    <!-- Zone 4: Irreversible Real-World Side Effects -->
    <g transform="translate(849, 34)">
      <rect width="256" height="396" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="10" y="10" width="55" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="37" y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">ZONE 4</text>
      <text x="10" y="44" font-size="10.5" font-weight="700" fill="#991b1b">Irreversible Action</text>
      <text x="10" y="58" font-size="8" fill="#dc2626">Real-World Side Effects</text>

      <rect x="10" y="70" width="236" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="18" y="86" font-size="8" font-weight="700" fill="#0f172a">State Residency:</text>
      <text x="18" y="102" font-size="7.5" fill="#475569">• External financial wire transfers</text>
      <text x="18" y="118" font-size="7.5" fill="#475569">• Email / Slack send, robot arm</text>

      <rect x="10" y="146" width="236" height="74" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="18" y="164" font-size="8" font-weight="700" fill="#0f172a">Reversibility Degree:</text>
      <text x="18" y="182" font-size="10" font-weight="700" fill="#991b1b">0% Non-Reversible</text>
      <text x="18" y="200" font-size="7.5" fill="#dc2626">Permanent external side effect</text>

      <rect x="10" y="230" width="236" height="152" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="1"/>
      <text x="18" y="248" font-size="8" font-weight="700" fill="#991b1b">Preemption Policy:</text>
      <text x="18" y="266" font-size="9" font-weight="700" fill="#991b1b">Strictly Non-Preemptible</text>
      <text x="18" y="284" font-size="7.5" fill="#475569">• Preemption is ILLEGAL</text>
      <text x="18" y="300" font-size="7.5" fill="#475569">• Must run to terminal completion</text>
      <text x="18" y="316" font-size="7.5" fill="#475569">• Resources pinned until finished</text>
      <text x="18" y="340" font-size="7.5" font-weight="700" fill="#991b1b">🛑 Crash requires human recovery</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- SYSTEMS PRINCIPLE CALLOUT BANNER                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 530)">
    <rect width="1120" height="92" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="15" y="12" width="85" height="68" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="57" y="44" text-anchor="middle" font-size="9" font-weight="800" fill="#6d28d9">SYSTEMS</text>
    <text x="57" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#7c3aed">PRINCIPLE</text>

    <text x="115" y="34" font-size="10.5" font-weight="700" fill="#0f172a">Physical Side Effects Break Arbitrary Operating System Preemption Invariants</text>
    <text x="115" y="52" font-size="8" fill="#475569">Classic OS schedulers preempt processes arbitrarily because memory pages can be restored. When an agent acts on external</text>
    <text x="115" y="68" font-size="8" fill="#475569">environments, preemption is governed by the Reversibility Boundary, requiring compensating Sagas or non-preemptible pinning.</text>
  </g>
</svg>
