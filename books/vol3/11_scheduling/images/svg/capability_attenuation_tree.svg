<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="580" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="460" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Monotonic Capability Attenuation across Agent Delegation Trees</text>
  <text x="460" y="46" text-anchor="middle" font-size="9.5" fill="#64748B">Enforcing the Principle of Least Privilege: Child subagents receive strictly attenuated subsets of parent authority</text>

  <!-- LEVEL 0: ROOT SUPERVISOR (Top Center) -->
  <g filter="url(#shadow)" transform="translate(240, 70)">
    <rect width="440" height="95" rx="8" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
    <rect width="440" height="24" rx="8" fill="#581C87"/>
    <rect y="16" width="440" height="8" fill="#581C87"/>
    <text x="220" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Root Supervisor Agent (Principal: System Administrator)</text>
    <text x="20" y="40" font-size="9" font-weight="700" fill="#3B0764">Full Capability Set (C_0):</text>
    <text x="140" y="40" font-size="8.5" font-family="monospace" fill="#581C87">{ ReadFS, WriteFS, ExecBash, NetHTTP, GitCommit, CloudDeploy }</text>
    <text x="20" y="58" font-size="8.5" fill="#475569">Budget Quota: $50.00 • 500,000 Tokens • Time-To-Live (TTL): 24 Hours</text>
    <text x="20" y="74" font-size="8" fill="#64748B">Authoritative Lease Token: HMAC_SHA256(principal_id, C_0, TTL, k_system)</text>
    <rect x="20" y="80" width="400" height="4" rx="2" fill="#581C87"/>
  </g>

  <!-- Delegation Line 1: Root -> Child 1A (Left) -->
  <path d="M 350,165 L 350,205 L 210,205 L 210,230" fill="none" stroke="#581C87" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="280" y="198" text-anchor="middle" font-size="8" font-weight="600" fill="#581C87">delegate_research()</text>

  <!-- Delegation Line 2: Root -> Child 1B (Right) -->
  <path d="M 570,165 L 570,205 L 710,205 L 710,230" fill="none" stroke="#581C87" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="640" y="198" text-anchor="middle" font-size="8" font-weight="600" fill="#581C87">delegate_implement()</text>

  <!-- LEVEL 1: CHILD SUBAGENT 1A (Left) -->
  <g filter="url(#shadow)" transform="translate(40, 235)">
    <rect width="360" height="110" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.6"/>
    <rect width="360" height="22" rx="8" fill="#2563EB"/>
    <rect y="14" width="360" height="8" fill="#2563EB"/>
    <text x="180" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Child Subagent 1A: Repository Research Agent</text>
    <text x="15" y="38" font-size="8.5" font-weight="700" fill="#1E40AF">Attenuated Capabilities (C_1A subset C_0):</text>
    <text x="15" y="52" font-size="8" font-family="monospace" fill="#1E3A8A">{ ReadFS, NetHTTP(allowlist: [docs.python.org, github.com]) }</text>
    <text x="15" y="68" font-size="8" font-weight="600" fill="#DC2626">STRIPPED: { WriteFS, ExecBash, GitCommit, CloudDeploy }</text>
    <text x="15" y="82" font-size="8" fill="#475569">Budget Quota: $5.00 • 50,000 Tokens • TTL: 30 Minutes</text>
    <text x="15" y="96" font-size="7.5" fill="#64748B">Cryptographic Lease: Cannot escalate; network locked to read-only docs</text>
  </g>

  <!-- LEVEL 1: CHILD SUBAGENT 1B (Right) -->
  <g filter="url(#shadow)" transform="translate(520, 235)">
    <rect width="360" height="110" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.6"/>
    <rect width="360" height="22" rx="8" fill="#059669"/>
    <rect y="14" width="360" height="8" fill="#059669"/>
    <text x="180" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Child Subagent 1B: Code Implementation Agent</text>
    <text x="15" y="38" font-size="8.5" font-weight="700" fill="#065F46">Attenuated Capabilities (C_1B subset C_0):</text>
    <text x="15" y="52" font-size="8" font-family="monospace" fill="#047857">{ ReadFS, WriteFS(path: "/src/*"), ExecBash(sandbox: gVisor) }</text>
    <text x="15" y="68" font-size="8" font-weight="600" fill="#DC2626">STRIPPED: { NetHTTP, GitCommit, CloudDeploy }</text>
    <text x="15" y="82" font-size="8" fill="#475569">Budget Quota: $20.00 • 200,000 Tokens • TTL: 2 Hours</text>
    <text x="15" y="96" font-size="7.5" fill="#64748B">Isolation: Ephemeral container, zero external network ingress/egress</text>
  </g>

  <!-- Delegation Line 3: Child 1B -> Grandchild 2A -->
  <path d="M 700,345 L 700,390" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="705" y="372" font-size="8" font-weight="600" fill="#047857">spawn_tester()</text>

  <!-- LEVEL 2: GRANDCHILD SUBAGENT 2A (Bottom Right) -->
  <g filter="url(#shadow)" transform="translate(520, 395)">
    <rect width="360" height="95" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.6"/>
    <rect width="360" height="20" rx="8" fill="#047857"/>
    <rect y="12" width="360" height="8" fill="#047857"/>
    <text x="180" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Grandchild Subagent 2A: Unit Test Runner</text>
    <text x="15" y="36" font-size="8.5" font-weight="700" fill="#065F46">Attenuated Capabilities (C_2A subset C_1B):</text>
    <text x="15" y="50" font-size="8" font-family="monospace" fill="#047857">{ ReadFS(path: "/src/*"), ExecBash(cmd: "pytest tests/") }</text>
    <text x="15" y="65" font-size="8" font-weight="600" fill="#DC2626">STRIPPED: { WriteFS }</text>
    <text x="15" y="80" font-size="8" fill="#475569">Budget Quota: $2.00 • 20,000 Tokens • TTL: 5 Minutes</text>
  </g>

  <!-- MATHEMATICAL INVARIANT SIDEBAR (Bottom Left) -->
  <g filter="url(#shadow)" transform="translate(40, 395)">
    <rect width="440" height="95" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.4"/>
    <text x="20" y="24" font-size="10.5" font-weight="700" fill="#581C87">Formal Attenuation Invariants</text>
    <text x="20" y="44" font-size="9" fill="#3B0764">1. Monotonicity: <tspan font-family="monospace">C_{child} subseteq C_{parent}</tspan> (Privilege Escalation Impossible)</text>
    <text x="20" y="60" font-size="9" fill="#3B0764">2. Budget Subordination: <tspan font-family="monospace">sum(Quota_{child}) &lt;= RemainingQuota_{parent}</tspan></text>
    <text x="20" y="76" font-size="9" fill="#3B0764">3. Temporal Bound: <tspan font-family="monospace">TTL_{child} &lt;= TTL_{parent}</tspan> (No Orphaned Runaway Nodes)</text>
    <text x="20" y="88" font-size="7.5" fill="#7E22CE">Enforced cryptographically at kernel boundary outside neural weights</text>
  </g>

  <!-- FOOTER INVARIANT -->
  <text x="460" y="535" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Saltzer &amp; Schroeder (1975) Principle of Least Privilege applied to autonomous subagent execution trees</text>
</svg>
