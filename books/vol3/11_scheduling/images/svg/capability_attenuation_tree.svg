<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="580" fill="#ffffff"/>

  <!-- Outer Architecture Boundary Framing Card -->
  <rect x="20" y="20" width="880" height="540" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">MONOTONIC CAPABILITY ATTENUATION ACROSS AGENT DELEGATION TREES</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Enforcing the Principle of Least Privilege: Child subagents receive strictly attenuated subsets of parent authority</text>

  <!-- ================================================================= -->
  <!-- LEVEL 0: ROOT SUPERVISOR AGENT                                    -->
  <!-- ================================================================= -->
  <g transform="translate(220, 75)">
    <rect x="0" y="0" width="480" height="102" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="480" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">ROOT SUPERVISOR AGENT (Principal: System Administrator)</text>

    <text x="14" y="42" font-size="8.5" font-weight="700" fill="#0f172a">Full Capability Set (C_0):</text>
    <text x="135" y="42" font-size="8" font-family="Courier, monospace" font-weight="700" fill="#6d28d9">{ ReadFS, WriteFS, ExecBash, NetHTTP, GitCommit, CloudDeploy }</text>
    <text x="14" y="60" font-size="8" fill="#475569">Budget Quota: $50.00 • 500,000 Tokens • Time-To-Live (TTL): 24 Hours</text>
    <text x="14" y="76" font-size="7.5" fill="#64748b">Authoritative Lease Token: HMAC_SHA256(principal_id, C_0, TTL, k_system)</text>
    <rect x="14" y="86" width="452" height="4" rx="1" fill="#7c3aed"/>
  </g>

  <!-- Delegation Line 1: Root -> Child 1A (Left) -->
  <path d="M340,177 L340,205 L235,205 L235,225" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="285" y="198" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#6d28d9">delegate_research()</text>

  <!-- Delegation Line 2: Root -> Child 1B (Right) -->
  <path d="M580,177 L580,205 L685,205 L685,225" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="635" y="198" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#6d28d9">delegate_implement()</text>

  <!-- ================================================================= -->
  <!-- LEVEL 1: CHILD SUBAGENT 1A (LEFT)                                 -->
  <!-- ================================================================= -->
  <g transform="translate(40, 225)">
    <rect x="0" y="0" width="390" height="120" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">CHILD SUBAGENT 1A: REPOSITORY RESEARCH AGENT</text>

    <text x="14" y="42" font-size="8.5" font-weight="700" fill="#0369a1">Attenuated Capabilities (C_1A ⊆ C_0):</text>
    <text x="14" y="56" font-size="8" font-family="Courier, monospace" font-weight="700" fill="#0c4a6e">{ ReadFS, NetHTTP(allowlist: [docs.python.org, github.com]) }</text>
    <text x="14" y="74" font-size="8" font-weight="700" fill="#dc2626">STRIPPED: { WriteFS, ExecBash, GitCommit, CloudDeploy }</text>
    <text x="14" y="90" font-size="8" fill="#475569">Budget Quota: $5.00 • 50,000 Tokens • TTL: 30 Minutes</text>
    <text x="14" y="106" font-size="7.5" fill="#64748b">Cryptographic Lease: Cannot escalate; network egress locked to allowlist</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEVEL 1: CHILD SUBAGENT 1B (RIGHT)                                -->
  <!-- ================================================================= -->
  <g transform="translate(490, 225)">
    <rect x="0" y="0" width="390" height="120" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">CHILD SUBAGENT 1B: CODE IMPLEMENTATION AGENT</text>

    <text x="14" y="42" font-size="8.5" font-weight="700" fill="#15803d">Attenuated Capabilities (C_1B ⊆ C_0):</text>
    <text x="14" y="56" font-size="8" font-family="Courier, monospace" font-weight="700" fill="#14532d">{ ReadFS, WriteFS(path: "/src/*"), ExecBash(sandbox: gVisor) }</text>
    <text x="14" y="74" font-size="8" font-weight="700" fill="#dc2626">STRIPPED: { NetHTTP, GitCommit, CloudDeploy }</text>
    <text x="14" y="90" font-size="8" fill="#475569">Budget Quota: $20.00 • 200,000 Tokens • TTL: 2 Hours</text>
    <text x="14" y="106" font-size="7.5" fill="#64748b">Isolation: Ephemeral container, zero external network ingress/egress</text>
  </g>

  <!-- Delegation Line 3: Child 1B -> Grandchild 2A -->
  <path d="M685,345 L685,385" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="695" y="368" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#15803d">spawn_tester()</text>

  <!-- ================================================================= -->
  <!-- MATHEMATICAL INVARIANTS SIDEBAR (BOTTOM LEFT)                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 385)">
    <rect x="0" y="0" width="430" height="120" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">FORMAL ATTENUATION INVARIANTS</text>

    <text x="14" y="44" font-size="8" fill="#334155">1. Monotonicity: <tspan font-family="Courier, monospace" font-weight="700" fill="#6d28d9">C_{child} ⊆ C_{parent}</tspan> (Privilege Escalation Impossible)</text>
    <text x="14" y="62" font-size="8" fill="#334155">2. Budget Subordination: <tspan font-family="Courier, monospace" font-weight="700" fill="#6d28d9">∑ Quota_{child} ≤ RemainingQuota_{parent}</tspan></text>
    <text x="14" y="80" font-size="8" fill="#334155">3. Temporal Bound: <tspan font-family="Courier, monospace" font-weight="700" fill="#6d28d9">TTL_{child} ≤ TTL_{parent}</tspan> (No Orphaned Runaway Nodes)</text>
    <text x="14" y="104" font-size="7.5" font-weight="700" fill="#7c3aed">Enforced cryptographically at kernel boundary outside neural weights</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEVEL 2: GRANDCHILD SUBAGENT 2A (BOTTOM RIGHT)                    -->
  <!-- ================================================================= -->
  <g transform="translate(490, 385)">
    <rect x="0" y="0" width="390" height="120" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">GRANDCHILD SUBAGENT 2A: UNIT TEST RUNNER</text>

    <text x="14" y="42" font-size="8.5" font-weight="700" fill="#15803d">Attenuated Capabilities (C_2A ⊆ C_1B):</text>
    <text x="14" y="56" font-size="8" font-family="Courier, monospace" font-weight="700" fill="#14532d">{ ReadFS(path: "/src/*"), ExecBash(cmd: "pytest tests/") }</text>
    <text x="14" y="74" font-size="8" font-weight="700" fill="#dc2626">STRIPPED: { WriteFS }</text>
    <text x="14" y="90" font-size="8" fill="#475569">Budget Quota: $2.00 • 20,000 Tokens • TTL: 5 Minutes</text>
    <text x="14" y="106" font-size="7.5" fill="#64748b">Least privilege: ephemeral process execution without modification rights</text>
  </g>

  <!-- Footer Invariant Reference -->
  <text x="460" y="534" text-anchor="middle" font-size="8" font-weight="600" fill="#64748b">Saltzer &amp; Schroeder (1975) Principle of Least Privilege applied to autonomous subagent execution trees</text>
</svg>
