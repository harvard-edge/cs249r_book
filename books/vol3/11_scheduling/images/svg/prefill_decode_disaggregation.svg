<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: PREFILL NODE POOL (COMPUTE-BOUND)                       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="345" height="442" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">PREFILL NODE POOL (Compute-Bound Engine)</text>

    <!-- Operational Profile Card -->
    <g transform="translate(15, 34)">
      <rect width="315" height="82" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#0f172a">Operational Profile</text>
      <text x="12" y="34" font-size="8" fill="#475569">• Workload: Full-prompt context ingestion</text>
      <text x="12" y="49" font-size="8" fill="#475569">• Arithmetic Intensity: <tspan font-weight="700" fill="#0369a1">AI &gt;&gt; 100 FLOPs/byte</tspan></text>
      <text x="12" y="64" font-size="8" fill="#475569">• Primary Metric: <tspan font-weight="700" fill="#0f172a">Time to First Token (TTFT)</tspan></text>
    </g>

    <!-- Hardware & Execution Characteristics -->
    <g transform="translate(15, 124)">
      <rect width="315" height="156" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#0369a1">Hardware &amp; Execution Characteristics</text>
      <text x="12" y="34" font-size="7.8" fill="#334155">• High-TFLOPS Tensor Cores (H100 SXM5 / B200)</text>
      <text x="12" y="49" font-size="7.8" fill="#334155">• Large matrix-matrix multiplications (GEMM)</text>
      <text x="12" y="64" font-size="7.8" fill="#334155">• FlashAttention-2 / Chunked prefill tiling</text>
      <text x="12" y="79" font-size="7.8" fill="#334155">• Temporary KV cache generation:</text>

      <rect x="12" y="88" width="291" height="56" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="22" y="106" font-size="8" font-weight="700" fill="#0369a1">Generates K, V tensor blocks across all layers</text>
      <text x="22" y="122" font-size="7.5" fill="#64748b">Ready for immediate RDMA handoff; no local decode execution</text>
      <text x="22" y="135" font-size="7.5" fill="#15803d">Saves compute cycles for next incoming prompt</text>
    </g>

    <!-- Traditional Failure Mode -->
    <g transform="translate(15, 288)">
      <rect width="315" height="138" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#991b1b">Traditional Co-located Failure Mode</text>
      <text x="12" y="35" font-size="8" font-weight="700" fill="#dc2626">⚠ Head-of-Line (HoL) Blocking:</text>
      <text x="12" y="52" font-size="7.5" fill="#7f1d1d">A 64k agent prefill monopolizes Tensor Cores for</text>
      <text x="12" y="66" font-size="7.5" fill="#7f1d1d">seconds, freezing all concurrent decode tokens and</text>
      <text x="12" y="80" font-size="7.5" font-weight="700" fill="#dc2626">spiking Inter-Token Latency (ITL) by 20x–50x.</text>
      <text x="12" y="100" font-size="7.5" fill="#7f1d1d">Degrades real-time interactive agent experience.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: DISAGGREGATED RDMA KV TRANSFER FABRIC                   -->
  <!-- ================================================================= -->
  <g transform="translate(400, 75)">
    <rect x="0" y="0" width="400" height="442" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1e293b">DISAGGREGATED RDMA KV TRANSFER FABRIC</text>

    <!-- Visual Stream Graphic -->
    <g transform="translate(15, 34)">
      <rect width="370" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#0f172a">RoCEv2 / InfiniBand Transport (400 – 800 Gbps)</text>

      <rect x="12" y="28" width="346" height="12" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <line x1="16" y1="34" x2="350" y2="34" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
      <polygon points="352,34 344,30 344,38" fill="#0284c7"/>

      <text x="185" y="56" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">Zero-Copy Kernel-Bypass RDMA Write (GPU HBM → GPU HBM)</text>
    </g>

    <!-- Systems Mechanisms Box -->
    <g transform="translate(15, 112)">
      <rect width="370" height="196" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#0f172a">Disaggregated Systems Mechanisms</text>

      <!-- DistServe / Splitwise Card -->
      <g transform="translate(10, 26)">
        <rect width="350" height="74" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#6d28d9">Phase Splitting (Splitwise &amp; DistServe)</text>
        <text x="10" y="32" font-size="7.5" fill="#334155">• Prefill nodes execute layer forward passes.</text>
        <text x="10" y="46" font-size="7.5" fill="#334155">• As each layer completes, KV tensors stream over RDMA.</text>
        <text x="10" y="60" font-size="7.5" font-weight="700" fill="#15803d">Pipelined transfer overlaps network delay with compute.</text>
      </g>

      <!-- Mooncake Card -->
      <g transform="translate(10, 108)">
        <rect width="350" height="78" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0369a1">KVCache-Centric Datacenter (Mooncake)</text>
        <text x="10" y="32" font-size="7.5" fill="#334155">• Disaggregated cluster-wide memory pool for KV caches.</text>
        <text x="10" y="46" font-size="7.5" fill="#334155">• Radix tree lookup matches prefix across entire datacenter.</text>
        <text x="10" y="60" font-size="7.5" font-weight="700" fill="#0369a1">Reuses cached agent prefixes across different physical nodes.</text>
      </g>
    </g>

    <!-- Network Bandwidth Invariant -->
    <g transform="translate(15, 316)">
      <rect width="370" height="110" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#15803d">Network Bandwidth Invariant</text>
      <text x="12" y="34" font-size="7.8" fill="#334155">RDMA transfer time must remain strictly lower than prefill:</text>

      <rect x="12" y="42" width="346" height="26" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="185" y="59" text-anchor="middle" font-family="Courier, monospace" font-size="9" font-weight="700" fill="#15803d">T_transfer = S_kv / B_net  &lt;  T_prefill</text>

      <text x="12" y="84" font-size="7.5" fill="#14532d">400 Gbps (50 GB/s) streams 2.1 GB in ~42 ms (vs ~9s prefill)</text>
      <text x="12" y="98" font-size="7.5" font-weight="700" fill="#15803d">Network transmission is never the scheduling bottleneck.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: DECODE NODE POOL (BANDWIDTH-BOUND)                      -->
  <!-- ================================================================= -->
  <g transform="translate(815, 75)">
    <rect x="0" y="0" width="345" height="442" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">DECODE NODE POOL (Bandwidth-Bound Engine)</text>

    <!-- Operational Profile Card -->
    <g transform="translate(15, 34)">
      <rect width="315" height="82" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#0f172a">Operational Profile</text>
      <text x="12" y="34" font-size="8" fill="#475569">• Workload: Autoregressive single-token decoding</text>
      <text x="12" y="49" font-size="8" fill="#475569">• Arithmetic Intensity: <tspan font-weight="700" fill="#15803d">AI ≈ 1 – 2 FLOPs/byte</tspan></text>
      <text x="12" y="64" font-size="8" fill="#475569">• Primary Metric: <tspan font-weight="700" fill="#0f172a">Inter-Token Latency (ITL &lt; 25 ms)</tspan></text>
    </g>

    <!-- Hardware & Execution Characteristics -->
    <g transform="translate(15, 124)">
      <rect width="315" height="156" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#15803d">Hardware &amp; Execution Characteristics</text>
      <text x="12" y="34" font-size="7.8" fill="#334155">• High-Memory Bandwidth (HBM3e @ 4.8 TB/s)</text>
      <text x="12" y="49" font-size="7.8" fill="#334155">• Matrix-vector multiplications (GEMV)</text>
      <text x="12" y="64" font-size="7.8" fill="#334155">• PagedAttention block manager allocates pages</text>
      <text x="12" y="79" font-size="7.8" fill="#334155">• Streams generated tokens directly to agent:</text>

      <rect x="12" y="88" width="291" height="56" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="22" y="106" font-size="8" font-weight="700" fill="#15803d">Stable, jitter-free autoregressive stream</text>
      <text x="22" y="122" font-size="7.5" fill="#64748b">Guarantees interactive human &amp; tool latency SLOs</text>
      <text x="22" y="135" font-size="7.5" fill="#15803d">Zero HoL prefill interruptions</text>
    </g>

    <!-- Systems Benefits -->
    <g transform="translate(15, 288)">
      <rect width="315" height="138" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#15803d">Systems &amp; Goodput Benefits</text>
      <text x="12" y="35" font-size="8" font-weight="700" fill="#15803d">✓ Strict SLO Isolation:</text>
      <text x="12" y="52" font-size="7.5" fill="#475569">Decode iterations never interrupted by large prefills.</text>
      <text x="12" y="70" font-size="8" font-weight="700" fill="#15803d">✓ 2.5× to 4.2× higher cluster goodput</text>
      <text x="12" y="86" font-size="7.5" fill="#475569">under tight TTFT and ITL service level objectives.</text>
      <text x="12" y="106" font-size="7.5" fill="#14532d">Enables dense batch packing for decode engines.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- SYSTEMS PRINCIPLE CALLOUT BANNER                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 530)">
    <rect width="1120" height="92" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="15" y="12" width="85" height="68" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="57" y="44" text-anchor="middle" font-size="9" font-weight="800" fill="#6d28d9">SYSTEMS</text>
    <text x="57" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#7c3aed">PRINCIPLE</text>

    <text x="115" y="34" font-size="10.5" font-weight="700" fill="#0f172a">Decouple Compute-Bound Prefill from Bandwidth-Bound Decode via RDMA</text>
    <text x="115" y="52" font-size="8" fill="#475569">Co-locating prompt prefill and token decoding causes catastrophic head-of-line blocking for multi-turn agent workloads.</text>
    <text x="115" y="68" font-size="8" fill="#475569">Physical disaggregation over RoCEv2/InfiniBand isolates latency SLOs, yielding up to 4x higher serving goodput.</text>
  </g>
</g>
</svg>