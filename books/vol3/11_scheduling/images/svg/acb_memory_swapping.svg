<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- TIER 1: ACCELERATOR HIGH-BANDWIDTH MEMORY (HBM3e)                 -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="800" height="105" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="800" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">TIER 1: ACCELERATOR HIGH-BANDWIDTH MEMORY (HBM3e)</text>
    <text x="788" y="16" text-anchor="end" font-size="8" fill="#0369a1">Capacity: 80–141 GB | Bandwidth: 3.35 TB/s | Latency: ~100 ns</text>

    <!-- Sub-blocks -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="130" height="58" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="65" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Active Prefill Frame</text>
      <text x="65" y="31" text-anchor="middle" font-family="Courier, monospace" font-size="8" fill="#14532d">Prompt Tokens S_0</text>
      <text x="65" y="46" text-anchor="middle" font-size="7" fill="#16a34a">Tensor Core Saturated</text>
    </g>

    <g transform="translate(155, 34)">
      <rect x="0" y="0" width="130" height="58" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="65" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Active Decode Frame</text>
      <text x="65" y="31" text-anchor="middle" font-family="Courier, monospace" font-size="8" fill="#14532d">KV Blocks #0..#128</text>
      <text x="65" y="46" text-anchor="middle" font-size="7" fill="#16a34a">Memory-Bound GEMV</text>
    </g>

    <g transform="translate(295, 34)">
      <rect x="0" y="0" width="145" height="58" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="72" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Free Block Allocator</text>
      <text x="72" y="31" text-anchor="middle" font-family="Courier, monospace" font-size="8" fill="#64748b">PagedAttention Pool</text>
      <text x="72" y="46" text-anchor="middle" font-size="7" fill="#64748b">16-Token Physical Pages</text>
    </g>

    <!-- Tool Wait Hazard Block -->
    <g transform="translate(450, 34)">
      <rect x="0" y="0" width="335" height="58" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="167" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">TOOL-WAIT MEMORY STRANDING HAZARD</text>
      <text x="167" y="31" text-anchor="middle" font-family="Courier, monospace" font-size="8" fill="#7f1d1d">Agent A: Suspended on Bash / API (T_wait &gt; 15s)</text>
      <text x="167" y="46" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">Strands 15.7 GB HBM at 0% Compute Utilization</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- INTERCONNECT 1: PCIE GEN5 X16 DMA BUS                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 190)">
    <rect x="0" y="0" width="800" height="36" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="15" y="16" font-size="8.5" font-weight="700" fill="#0f172a">PCIe Gen5 x16 INTERCONNECT (64 GB/s Bidirectional DMA)</text>
    <text x="15" y="28" font-size="7.5" fill="#64748b">Breakeven Threshold: τ_swap = 2 · S_kv / B_pcie ≈ 0.7s (Offload if T_wait &gt; τ_swap)</text>

    <!-- Downward DMA Evict Arrow -->
    <path d="M520,-9 L520,44" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
    <rect x="530" y="9" width="95" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="577" y="21" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">DMA Evict (Flush)</text>

    <!-- Upward DMA Prefetch Arrow -->
    <path d="M680,44 L680,-9" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
    <rect x="690" y="9" width="105" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="742" y="21" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">DMA Prefetch (Restore)</text>
  </g>

  <!-- ================================================================= -->
  <!-- TIER 2: HOST SYSTEM MEMORY (DDR5 DRAM / CXL)                      -->
  <!-- ================================================================= -->
  <g transform="translate(40, 236)">
    <rect x="0" y="0" width="800" height="100" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="800" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">TIER 2: HOST SYSTEM MEMORY (DDR5 DRAM / CXL Memory Pool)</text>
    <text x="788" y="16" text-anchor="end" font-size="8" fill="#15803d">Capacity: 512 GB–2 TB | Bandwidth: ~300 GB/s | 10x–20x Lower Cost/GB</text>

    <!-- Swapped Staging Buffers -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="235" height="54" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#334155">Host OS Page Cache / Staging</text>
      <text x="10" y="32" font-family="Courier, monospace" font-size="8" fill="#64748b">Direct Memory Access Ring</text>
      <text x="10" y="44" font-size="7" fill="#16a34a">Pinned Non-Paged Buffer Pool</text>
    </g>

    <g transform="translate(260, 34)">
      <rect x="0" y="0" width="250" height="54" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#b45309">Swapped Agent A (Tool-Wait)</text>
      <text x="10" y="32" font-family="Courier, monospace" font-size="8" fill="#78350f">KV Blocks: L1_pages[] offloaded</text>
      <text x="10" y="44" font-size="7" fill="#b45309">Awaiting Bash Execution (30s)</text>
    </g>

    <g transform="translate(520, 34)">
      <rect x="0" y="0" width="265" height="54" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#b45309">Swapped Agent B (Human Approval)</text>
      <text x="10" y="32" font-family="Courier, monospace" font-size="8" fill="#78350f">KV Blocks: Radix trie frozen</text>
      <text x="10" y="44" font-size="7" fill="#b45309">Awaiting Admin Signature (T_wait &gt; 60s)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- INTERCONNECT 2: NVMe STORAGE BUS                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 346)">
    <rect x="0" y="0" width="800" height="32" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="15" y="20" font-size="8.5" font-weight="700" fill="#0f172a">NVMe PCIe Gen5 x4 STORAGE INTERCONNECT (14 GB/s)</text>
    <text x="785" y="20" text-anchor="end" font-size="7.5" fill="#64748b">Cold Swapping &amp; Durable Event-Sourced Crash Hydration</text>

    <!-- Downward NVMe Flush Arrow -->
    <path d="M410,-9 L410,40" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  </g>

  <!-- ================================================================= -->
  <!-- TIER 3: NON-VOLATILE SECONDARY STORAGE                            -->
  <!-- ================================================================= -->
  <g transform="translate(40, 388)">
    <rect x="0" y="0" width="800" height="98" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="800" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">TIER 3: LOCAL NVMe SSD &amp; DISTRIBUTED OBJECT STORE</text>
    <text x="788" y="16" text-anchor="end" font-size="8" fill="#6d28d9">Capacity: 4–30 TB | Latency: 10–100 µs | Non-Volatile Persistence</text>

    <!-- Storage Partitions -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="235" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="17" font-size="8.5" font-weight="700" fill="#334155">Write-Ahead Log (WAL)</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8" fill="#64748b">Append-only turn ledger</text>
      <text x="10" y="42" font-size="7" fill="#64748b">Synchronous crash hydration</text>
    </g>

    <g transform="translate(260, 34)">
      <rect x="0" y="0" width="250" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="17" font-size="8.5" font-weight="700" fill="#334155">Cold Trajectory Snapshots</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8" fill="#64748b">Dormant ACB serialization</text>
      <text x="10" y="42" font-size="7" fill="#64748b">Survives node preemptions</text>
    </g>

    <g transform="translate(520, 34)">
      <rect x="0" y="0" width="265" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="17" font-size="8.5" font-weight="700" fill="#334155">Episodic &amp; Vector Indexes</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8" fill="#64748b">IVF-PQ partitions &amp; AST graphs</text>
      <text x="10" y="42" font-size="7" fill="#64748b">MIPS semantic similarity search</text>
    </g>
  </g>
</g>
</svg>