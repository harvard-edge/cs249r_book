<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="500" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      
      /* Panels */
      .panel-border { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4; }
      .panel-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      
      /* States */
      .state-closed { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; rx: 4; }
      .state-open { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 4; }
      .state-half { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; rx: 4; }
      
      .hdr-closed { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; rx: 3; }
      .hdr-open { fill: #fee2e2; stroke: #dc2626; stroke-width: 1; rx: 3; }
      .hdr-half { fill: #fef3c7; stroke: #d97706; stroke-width: 1; rx: 3; }
      
      .title-closed { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #166534; }
      .title-open { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #991b1b; }
      .title-half { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #b45309; }
      
      .state-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #334155; }
      .state-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; }
      
      /* Connectors and Pills */
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .edge-green { stroke: #16a34a; stroke-width: 1.6; fill: none; }
      .edge-red { stroke: #dc2626; stroke-width: 1.6; fill: none; }
      .edge-amber { stroke: #d97706; stroke-width: 1.6; fill: none; }
      
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 3; }
      .pill-red { fill: #ffffff; stroke: #fca5a5; stroke-width: 1; rx: 3; }
      .pill-green { fill: #ffffff; stroke: #86efac; stroke-width: 1; rx: 3; }
      .pill-amber { fill: #ffffff; stroke: #fde68a; stroke-width: 1; rx: 3; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; text-anchor: middle; }
      
      /* Plot styles */
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid-line { stroke: #f1f5f9; stroke-width: 1; stroke-dasharray: 3,3; }
      .cap-line { stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #334155; }
      .axis-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; fill: #64748b; }
      .plot-annotation { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #1e293b; }
    </style>

    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- ================================================================= -->
  <!-- PANEL A: TRI-STATE CIRCUIT BREAKER FSM                            -->
  <!-- ================================================================= -->
  <g transform="translate(20, 15)">
    <rect width="515" height="465" class="panel-border" />
    <text x="18" y="25" class="panel-hdr">(a) Tri-State Circuit Breaker Finite State Machine</text>

    <!-- State: CLOSED -->
    <g transform="translate(25, 95)">
      <rect width="205" height="145" class="state-closed" />
      <rect x="1" y="1" width="203" height="22" class="hdr-closed" />
      <text x="10" y="16" class="title-closed">STATE: CLOSED</text>
      
      <text x="10" y="40" class="state-body">Normal tool RPC dispatch</text>
      <text x="10" y="55" class="state-body">Invocations routed to external API</text>
      <text x="10" y="70" class="state-body">Sliding window: W outcomes</text>
      <text x="10" y="85" class="state-body">Error fraction: ℰ = ∑ e_i / |W|</text>
      <text x="10" y="100" class="state-body">Health threshold: ℰ &lt; τ_fail</text>
      
      <rect x="8" y="114" width="189" height="23" rx="2" fill="#ffffff" stroke="#86efac" />
      <text x="102" y="129" class="state-code" text-anchor="middle" fill="#166534">pass_through() = True</text>
    </g>

    <!-- State: OPEN -->
    <g transform="translate(285, 95)">
      <rect width="205" height="145" class="state-open" />
      <rect x="1" y="1" width="203" height="22" class="hdr-open" />
      <text x="10" y="16" class="title-open">STATE: OPEN</text>
      
      <text x="10" y="40" class="state-body">Fast-fail containment active</text>
      <text x="10" y="55" class="state-body">Calls rejected locally (≈0 ms)</text>
      <text x="10" y="70" class="state-body">Zero socket or token waste</text>
      <text x="10" y="85" class="state-body">Halts retry storms at boundary</text>
      <text x="10" y="100" class="state-body">Sleep timer: T_cooldown active</text>
      
      <rect x="8" y="114" width="189" height="23" rx="2" fill="#ffffff" stroke="#fca5a5" />
      <text x="102" y="129" class="state-code" text-anchor="middle" fill="#991b1b">raise ERR_CIRCUIT_OPEN</text>
    </g>

    <!-- State: HALF-OPEN -->
    <g transform="translate(155, 305)">
      <rect width="205" height="145" class="state-half" />
      <rect x="1" y="1" width="203" height="22" class="hdr-half" />
      <text x="10" y="16" class="title-half">STATE: HALF-OPEN</text>
      
      <text x="10" y="40" class="state-body">Trial canary probe phase</text>
      <text x="10" y="55" class="state-body">Single request released (K=1)</text>
      <text x="10" y="70" class="state-body">Concurrent peers still fail fast</text>
      <text x="10" y="85" class="state-body">Verifies upstream recovery</text>
      <text x="10" y="100" class="state-body">If fail: double T_cooldown</text>
      
      <rect x="8" y="114" width="189" height="23" rx="2" fill="#ffffff" stroke="#fde68a" />
      <text x="102" y="129" class="state-code" text-anchor="middle" fill="#b45309">canary_in_flight = 1</text>
    </g>

    <!-- Transitions -->
    <!-- 1. Self-loop CLOSED: Success -->
    <path d="M 60 95 C 60 55 130 55 130 90" class="edge-green" marker-end="url(#arr-green)" />
    <g transform="translate(48, 48)">
      <rect x="0" y="0" width="105" height="18" class="pill-green" />
      <text x="52" y="12" class="pill-text" fill="#15803d">Success: Reset W</text>
    </g>

    <!-- 2. CLOSED -> OPEN: Error threshold exceeded -->
    <line x1="230" y1="165" x2="280" y2="165" class="edge-red" marker-end="url(#arr-red)" />
    <g transform="translate(225, 142)">
      <rect x="0" y="0" width="65" height="18" class="pill-red" />
      <text x="32" y="12" class="pill-text" fill="#b91c1c">ℰ ≥ τ_fail</text>
    </g>

    <!-- 3. OPEN -> HALF-OPEN: Cooldown Elapsed -->
    <path d="M 390 240 C 390 280 375 300 365 315" class="edge" marker-end="url(#arr)" />
    <g transform="translate(385, 260)">
      <rect x="0" y="0" width="100" height="18" class="pill" />
      <text x="50" y="12" class="pill-text">t ≥ T_cooldown</text>
    </g>

    <!-- 4. HALF-OPEN -> CLOSED: Canary Succeeded -->
    <path d="M 155 365 C 95 365 95 285 115 245" class="edge-green" marker-end="url(#arr-green)" />
    <g transform="translate(28, 280)">
      <rect x="0" y="0" width="100" height="18" class="pill-green" />
      <text x="50" y="12" class="pill-text" fill="#15803d">Probe Succeeds</text>
    </g>

    <!-- 5. HALF-OPEN -> OPEN: Canary Failed -->
    <path d="M 290 305 C 320 270 330 260 330 245" class="edge-red" marker-end="url(#arr-red)" />
    <g transform="translate(250, 262)">
      <rect x="0" y="0" width="95" height="18" class="pill-red" />
      <text x="47" y="12" class="pill-text" fill="#b91c1c">Probe Fails (2× T)</text>
    </g>

  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: TRAFFIC SHAPING: FULL JITTER VS DETERMINISTIC            -->
  <!-- ================================================================= -->
  <g transform="translate(550, 15)">
    <rect width="530" height="465" class="panel-border" />
    <text x="18" y="25" class="panel-hdr">(b) Traffic Shaping: Full Jitter vs. Deterministic Resonance</text>

    <!-- Formula Header Box -->
    <g transform="translate(20, 36)">
      <rect width="490" height="30" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="14" y="19" font-family="SFMono-Regular, monospace" font-size="9.5px" font-weight="700" fill="#0f172a">
        t_wait(k) = 𝒰(0, min(T_max, 2^k · T_0))  ⇒  1000× Peak Load Dampening
      </text>
    </g>

    <!-- Plot Area -->
    <!-- Origin: x = 65, y = 380 -->
    <!-- X-axis: width = 430 (x = 65 to 495) -->
    <!-- Y-axis: height = 260 (y = 380 to 120) -->

    <!-- Grid lines -->
    <line x1="65" y1="320" x2="495" y2="320" class="grid-line" />
    <line x1="65" y1="260" x2="495" y2="260" class="grid-line" />
    <line x1="65" y1="180" x2="495" y2="180" class="grid-line" />

    <!-- Upstream Capacity Ceiling C -->
    <line x1="65" y1="285" x2="495" y2="285" class="cap-line" />
    <text x="490" y="278" font-family="SFMono-Regular, monospace" font-size="8.5px" font-weight="700" fill="#dc2626" text-anchor="end">
      Server Capacity Limit: C = 200 req/s
    </text>

    <!-- Axes -->
    <line x1="65" y1="380" x2="495" y2="380" class="axis" />
    <line x1="65" y1="380" x2="65" y2="120" class="axis" />

    <!-- Y-axis Ticks and Labels -->
    <text x="56" y="383" class="axis-mono" text-anchor="end">0</text>
    <text x="56" y="323" class="axis-mono" text-anchor="end">100</text>
    <text x="56" y="288" class="axis-mono" text-anchor="end" fill="#dc2626">200</text>
    <text x="56" y="183" class="axis-mono" text-anchor="end">500</text>
    <text x="56" y="135" class="axis-mono" font-weight="700" text-anchor="end" fill="#dc2626">64k</text>
    
    <!-- Y-axis rotated title -->
    <text x="-250" y="20" class="axis-label" font-weight="700" transform="rotate(-90)" text-anchor="middle">
      Arrival Rate λ(t) [requests / second]
    </text>

    <!-- X-axis Ticks and Labels -->
    <line x1="80" y1="380" x2="80" y2="385" class="axis" />
    <text x="80" y="398" class="axis-mono" text-anchor="middle">t₀ (Outage)</text>

    <line x1="180" y1="380" x2="180" y2="385" class="axis" />
    <text x="180" y="398" class="axis-mono" text-anchor="middle">+1.0 s</text>

    <line x1="300" y1="380" x2="300" y2="385" class="axis" />
    <text x="300" y="398" class="axis-mono" text-anchor="middle" font-weight="700">+2.0 s (Retry k=1)</text>

    <line x1="420" y1="380" x2="420" y2="385" class="axis" />
    <text x="420" y="398" class="axis-mono" text-anchor="middle">+3.0 s</text>

    <text x="250" y="425" class="axis-label" font-weight="700" text-anchor="middle">
      Elapsed Time Following Outage [seconds]
    </text>

    <!-- CURVE 1: Full Jitter (Blue shaded uniform distribution) -->
    <rect x="80" y="345" width="220" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <text x="190" y="366" font-family="SFMono-Regular, monospace" font-size="8.5px" font-weight="700" fill="#1e40af" text-anchor="middle">
      Full Jitter: λ_expected = 64 req/s (≪ C)
    </text>

    <!-- Annotation for Full Jitter (Cleanly on Left) -->
    <path d="M 140 345 L 140 215 L 155 215" class="edge" />
    <g transform="translate(120, 198)">
      <rect width="130" height="36" rx="2" fill="#ffffff" stroke="#93c5fd" />
      <text x="10" y="15" class="plot-annotation" font-weight="700" font-size="8.5px" fill="#1e40af">Uniform Dispersion</text>
      <text x="10" y="28" class="plot-annotation" font-size="7.5px" fill="#475569">Smooth load absorption</text>
    </g>

    <!-- CURVE 2: Deterministic Backoff (Red thundering herd impulse spike at x=300) -->
    <rect x="297" y="125" width="6" height="255" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" />
    
    <!-- Spike Cap -->
    <polygon points="295,125 300,115 305,125" fill="#dc2626" />
    
    <!-- Annotation for Deterministic Spike (Cleanly on Right) -->
    <g transform="translate(315, 115)">
      <rect width="185" height="66" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
      <text x="8" y="15" class="plot-annotation" font-weight="700" fill="#991b1b">
        Thundering Herd Spike (N=128)
      </text>
      <text x="8" y="30" font-family="SFMono-Regular, monospace" font-size="8.5px" font-weight="700" fill="#dc2626">
        λ_peak = 64,000 req/s (320× C)
      </text>
      <text x="8" y="44" class="plot-annotation" font-size="8px" fill="#334155">
        Lockstep wake-up in 2 ms window
      </text>
      <text x="8" y="57" class="plot-annotation" font-size="8px" fill="#dc2626">
        ⇒ Socket queue buffer overflow
      </text>
    </g>

    <!-- Dampening Factor Callout placed neatly under Thundering Herd Spike card -->
    <g transform="translate(315, 195)">
      <rect width="185" height="30" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.2" />
      <text x="92" y="19" font-family="SFMono-Regular, monospace" font-size="9px" font-weight="700" fill="#0f172a" text-anchor="middle">
        λ_peak / λ_jitter = 1000× Gain
      </text>
    </g>

  </g>

</svg>
