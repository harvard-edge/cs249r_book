<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="820" height="460" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LEFT DOMAIN: POSIX OPERATING SYSTEM (KERNEL / CPU)                -->
  <!-- ================================================================= -->
  <g id="posix-domain">
    <!-- Domain Boundary Box -->
    <rect x="20" y="20" width="370" height="420" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="35" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">POSIX KERNEL EXECUTION DOMAIN</text>
    <text x="35" y="58" font-size="8.5" fill="#64748b">Hardware-managed, bit-exact CPU context switching</text>

    <!-- PCB Struct (Memory Layout) -->
    <g transform="translate(35, 75)">
      <!-- Struct Container -->
      <rect x="0" y="0" width="200" height="260" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <!-- Struct Header -->
      <rect x="0" y="0" width="200" height="26" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
      <text x="100" y="17" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">struct task_struct (PCB)</text>

      <!-- Field 1: PID & Creds -->
      <line x1="0" y1="26" x2="200" y2="26" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="27" width="198" height="38" fill="#ffffff"/>
      <text x="10" y="42" font-size="8" font-weight="700" fill="#475569">IDENTIFIERS &amp; CREDS</text>
      <text x="10" y="55" font-family="Courier, monospace" font-size="8.5" fill="#0f172a">pid_t pid; uid_t uid;</text>

      <!-- Field 2: Registers (thread_struct) -->
      <line x1="0" y1="65" x2="200" y2="65" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="66" width="198" height="40" fill="#e0f2fe"/>
      <text x="10" y="80" font-size="8" font-weight="700" fill="#0369a1">HARDWARE REGISTERS</text>
      <text x="10" y="93" font-family="Courier, monospace" font-size="8.5" fill="#0c4a6e">RIP, RSP, RAX, CR3</text>
      <text x="10" y="103" font-size="7" fill="#0284c7">thread_struct (bit-exact)</text>

      <!-- Field 3: Memory Address Space -->
      <line x1="0" y1="106" x2="200" y2="106" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="107" width="198" height="40" fill="#dcfce7"/>
      <text x="10" y="121" font-size="8" font-weight="700" fill="#15803d">VIRTUAL ADDRESS SPACE</text>
      <text x="10" y="134" font-family="Courier, monospace" font-size="8.5" fill="#14532d">struct mm_struct *mm;</text>
      <text x="10" y="144" font-size="7" fill="#16a34a">pgd_t *pgd (CR3 target)</text>

      <!-- Field 4: File Descriptors -->
      <line x1="0" y1="147" x2="200" y2="147" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="148" width="198" height="36" fill="#ffffff"/>
      <text x="10" y="162" font-size="8" font-weight="700" fill="#475569">FILE DESCRIPTORS</text>
      <text x="10" y="175" font-family="Courier, monospace" font-size="8.5" fill="#0f172a">struct files_struct *files;</text>

      <!-- Field 5: Execution State -->
      <line x1="0" y1="184" x2="200" y2="184" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="185" width="198" height="38" fill="#fef3c7"/>
      <text x="10" y="199" font-size="8" font-weight="700" fill="#b45309">SCHEDULER STATE</text>
      <text x="10" y="212" font-family="Courier, monospace" font-size="8.5" fill="#78350f">long state (TASK_RUNNING)</text>

      <!-- Field 6: Resource Accounting -->
      <line x1="0" y1="223" x2="200" y2="223" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="224" width="198" height="35" fill="#ffffff"/>
      <text x="10" y="238" font-size="8" font-weight="700" fill="#475569">ACCOUNTING</text>
      <text x="10" y="251" font-family="Courier, monospace" font-size="8.5" fill="#0f172a">u64 utime, stime, rss;</text>
    </g>

    <!-- Pointers to OS / HW Subsystems -->
    <!-- 1. CPU Core Context -->
    <g transform="translate(255, 138)">
      <rect x="0" y="0" width="120" height="42" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="60" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">CPU Registers</text>
      <text x="60" y="30" text-anchor="middle" font-size="7.5" fill="#64748b">RIP / RSP Stack Frame</text>
    </g>
    <!-- Arrow from struct to CPU Registers -->
    <path d="M235,159 L255,159" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- 2. MMU Page Table -->
    <g transform="translate(255, 196)">
      <rect x="0" y="0" width="120" height="44" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="60" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">MMU Page Tables</text>
      <text x="60" y="27" text-anchor="middle" font-size="7.5" fill="#64748b">4 KB Physical Pages</text>
      <text x="60" y="38" text-anchor="middle" font-size="7.5" fill="#16a34a">Host DRAM (CR3)</text>
    </g>
    <!-- Arrow from struct to MMU Page Table -->
    <path d="M235,218 L255,218" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- 3. CFS Scheduler Queue -->
    <g transform="translate(255, 258)">
      <rect x="0" y="0" width="120" height="42" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <text x="60" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">CFS Runqueue</text>
      <text x="60" y="30" text-anchor="middle" font-size="7.5" fill="#64748b">Red-Black Tree (vruntime)</text>
    </g>
    <!-- Arrow from struct to CFS Queue -->
    <path d="M235,279 L255,279" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)"/>

    <!-- Bottom Metric Panels -->
    <g transform="translate(35, 350)">
      <rect x="0" y="0" width="340" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="19" font-size="8.5" font-weight="700" fill="#334155">Context Switch Cost:</text>
      <text x="112" y="19" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#0284c7">1 to 10 µs</text>
      <text x="180" y="19" font-size="8" fill="#64748b">(Bit-exact hardware swap)</text>
    </g>
    <g transform="translate(35, 390)">
      <rect x="0" y="0" width="340" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="19" font-size="8.5" font-weight="700" fill="#334155">Failure Boundary:</text>
      <text x="105" y="19" font-size="8" fill="#475569">Fail-stop; SIGSEGV / Core Dump</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT DOMAIN: AGENT RUNTIME (ACCELERATOR / CLOUD)                 -->
  <!-- ================================================================= -->
  <g id="agent-domain">
    <!-- Domain Boundary Box -->
    <rect x="430" y="20" width="370" height="420" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="445" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">AGENT RUNTIME CONTROL PLANE</text>
    <text x="445" y="58" font-size="8.5" fill="#64748b">Software-orchestrated, non-stationary distributed state</text>

    <!-- ACB Struct (Memory Layout) -->
    <g transform="translate(445, 75)">
      <!-- Struct Container -->
      <rect x="0" y="0" width="200" height="260" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <!-- Struct Header -->
      <rect x="0" y="0" width="200" height="26" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
      <text x="100" y="17" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">struct agent_control_block (ACB)</text>

      <!-- Field 1: Identity & Goal -->
      <line x1="0" y1="26" x2="200" y2="26" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="27" width="198" height="38" fill="#ffffff"/>
      <text x="10" y="42" font-size="8" font-weight="700" fill="#475569">IDENTITY &amp; GOAL ENVELOPE</text>
      <text x="10" y="55" font-family="Courier, monospace" font-size="8.5" fill="#0f172a">uuid_t aid; goal_t g;</text>

      <!-- Field 2: Capabilities (Leases) -->
      <line x1="0" y1="65" x2="200" y2="65" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="66" width="198" height="40" fill="#fee2e2"/>
      <text x="10" y="80" font-size="8" font-weight="700" fill="#b91c1c">CAPABILITY LEASES</text>
      <text x="10" y="93" font-family="Courier, monospace" font-size="8.5" fill="#7f1d1d">lease_t leases[] (HMAC)</text>
      <text x="10" y="103" font-size="7" fill="#dc2626">Attenuating permissions / TTL</text>

      <!-- Field 3: KV Cache Descriptors -->
      <line x1="0" y1="106" x2="200" y2="106" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="107" width="198" height="40" fill="#dcfce7"/>
      <text x="10" y="121" font-size="8" font-weight="700" fill="#15803d">CONTEXT WORKING SET</text>
      <text x="10" y="134" font-family="Courier, monospace" font-size="8.5" fill="#14532d">paged_kv_table_t *kv_tbl;</text>
      <text x="10" y="144" font-size="7" fill="#16a34a">PagedAttention L1/L2 handles</text>

      <!-- Field 4: Vector Clock & Lineage -->
      <line x1="0" y1="147" x2="200" y2="147" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="148" width="198" height="36" fill="#ffffff"/>
      <text x="10" y="162" font-size="8" font-weight="700" fill="#475569">CAUSAL CLOCKS &amp; LINEAGE</text>
      <text x="10" y="175" font-family="Courier, monospace" font-size="8.5" fill="#0f172a">vclock_t vc; parent_id_t p;</text>

      <!-- Field 5: Lifecycle & Sagas State -->
      <line x1="0" y1="184" x2="200" y2="184" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="185" width="198" height="38" fill="#fef3c7"/>
      <text x="10" y="199" font-size="8" font-weight="700" fill="#b45309">LIFECYCLE FSM &amp; SAGAS</text>
      <text x="10" y="212" font-family="Courier, monospace" font-size="8.5" fill="#78350f">state_t (PREFILL, WAIT, ...)</text>

      <!-- Field 6: Token Quotas & Velocity -->
      <line x1="0" y1="223" x2="200" y2="223" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="224" width="198" height="35" fill="#ffffff"/>
      <text x="10" y="238" font-size="8" font-weight="700" fill="#475569">TOKENOMICS &amp; BUDGETS</text>
      <text x="10" y="251" font-family="Courier, monospace" font-size="8.5" fill="#0f172a">token_budget_t; float v_burn;</text>
    </g>

    <!-- Pointers to Agent Runtime Subsystems -->
    <!-- 1. Capability Sandbox Filter -->
    <g transform="translate(665, 138)">
      <rect x="0" y="0" width="120" height="42" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text x="60" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">Tool Sandbox</text>
      <text x="60" y="30" text-anchor="middle" font-size="7.5" fill="#64748b">eBPF / MicroVM Filter</text>
    </g>
    <!-- Arrow from struct to Tool Sandbox -->
    <path d="M645,159 L665,159" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-orange)"/>

    <!-- 2. PagedAttention KV Cache Table -->
    <g transform="translate(665, 196)">
      <rect x="0" y="0" width="120" height="44" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="60" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Paged KV Blocks</text>
      <text x="60" y="27" text-anchor="middle" font-size="7.5" fill="#64748b">16-Token Page Tables</text>
      <text x="60" y="38" text-anchor="middle" font-size="7.5" fill="#16a34a">Accelerator HBM</text>
    </g>
    <!-- Arrow from struct to KV Cache Table -->
    <path d="M645,218 L665,218" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- 3. MLFQ / Disaggregated Scheduler -->
    <g transform="translate(665, 258)">
      <rect x="0" y="0" width="120" height="42" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <text x="60" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">MLFQ Scheduler</text>
      <text x="60" y="30" text-anchor="middle" font-size="7.5" fill="#64748b">Priority Queue / Prefill</text>
    </g>
    <!-- Arrow from struct to MLFQ Scheduler -->
    <path d="M645,279 L665,279" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)"/>

    <!-- Bottom Metric Panels -->
    <g transform="translate(445, 350)">
      <rect x="0" y="0" width="340" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="19" font-size="8.5" font-weight="700" fill="#334155">Context Switch Cost:</text>
      <text x="112" y="19" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#d97706">50 to 1,000 ms</text>
      <text x="200" y="19" font-size="8" fill="#64748b">(PCIe DMA KV swapping)</text>
    </g>
    <g transform="translate(445, 390)">
      <rect x="0" y="0" width="340" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="19" font-size="8.5" font-weight="700" fill="#334155">Failure Boundary:</text>
      <text x="105" y="19" font-size="8" fill="#475569">Fail-plausible; Sagas Compensating Rollback</text>
    </g>
  </g>
</svg>