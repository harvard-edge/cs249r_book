<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- Outer Architecture Boundary Framing Card -->
  <rect x="20" y="20" width="860" height="480" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">PROCESS CONTROL BLOCK (PCB) VS. AGENT CONTROL BLOCK (ACB)</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Comparison of operating system thread control blocks versus autonomous agent runtime state envelopes</text>

  <!-- ================================================================= -->
  <!-- LEFT DOMAIN: POSIX OPERATING SYSTEM (KERNEL / CPU)                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <!-- Subsystem Container Card -->
    <rect x="0" y="0" width="400" height="405" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1e293b">POSIX KERNEL EXECUTION DOMAIN (CPU)</text>
    <text x="388" y="16" text-anchor="end" font-size="8" fill="#64748b">Hardware-managed, bit-exact CPU context switching</text>

    <!-- PCB Struct (Memory Layout) -->
    <g transform="translate(15, 34)">
      <!-- Struct Container -->
      <rect x="0" y="0" width="225" height="268" rx="1" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
      <!-- Struct Header -->
      <rect x="0" y="0" width="225" height="22" rx="1" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
      <text x="112" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">struct task_struct (PCB)</text>

      <!-- Field 1: PID & Creds -->
      <rect x="1" y="23" width="223" height="38" fill="#ffffff"/>
      <text x="8" y="37" font-size="7.5" font-weight="700" fill="#475569">IDENTIFIERS &amp; CREDS</text>
      <text x="8" y="50" font-family="Courier, monospace" font-size="8" fill="#0f172a">pid_t pid; uid_t uid;</text>
      <line x1="0" y1="62" x2="225" y2="62" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 2: Registers (thread_struct) -->
      <rect x="1" y="63" width="223" height="42" fill="#e0f2fe"/>
      <text x="8" y="77" font-size="7.5" font-weight="700" fill="#0369a1">HARDWARE REGISTERS</text>
      <text x="8" y="89" font-family="Courier, monospace" font-size="8" fill="#0c4a6e">RIP, RSP, RAX, CR3</text>
      <text x="8" y="100" font-size="6.8" fill="#0284c7">thread_struct (bit-exact)</text>
      <line x1="0" y1="105" x2="225" y2="105" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 3: Memory Address Space -->
      <rect x="1" y="106" width="223" height="42" fill="#dcfce7"/>
      <text x="8" y="120" font-size="7.5" font-weight="700" fill="#15803d">VIRTUAL ADDRESS SPACE</text>
      <text x="8" y="132" font-family="Courier, monospace" font-size="8" fill="#14532d">struct mm_struct *mm;</text>
      <text x="8" y="143" font-size="6.8" fill="#16a34a">pgd_t *pgd (CR3 target)</text>
      <line x1="0" y1="148" x2="225" y2="148" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 4: File Descriptors -->
      <rect x="1" y="149" width="223" height="38" fill="#ffffff"/>
      <text x="8" y="163" font-size="7.5" font-weight="700" fill="#475569">FILE DESCRIPTORS</text>
      <text x="8" y="176" font-family="Courier, monospace" font-size="8" fill="#0f172a">struct files_struct *files;</text>
      <line x1="0" y1="187" x2="225" y2="187" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 5: Execution State -->
      <rect x="1" y="188" width="223" height="40" fill="#fef3c7"/>
      <text x="8" y="202" font-size="7.5" font-weight="700" fill="#b45309">SCHEDULER STATE</text>
      <text x="8" y="215" font-family="Courier, monospace" font-size="8" fill="#78350f">long state (TASK_RUNNING)</text>
      <line x1="0" y1="228" x2="225" y2="228" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 6: Resource Accounting -->
      <rect x="1" y="229" width="223" height="38" fill="#ffffff"/>
      <text x="8" y="243" font-size="7.5" font-weight="700" fill="#475569">ACCOUNTING</text>
      <text x="8" y="256" font-family="Courier, monospace" font-size="8" fill="#0f172a">u64 utime, stime, rss;</text>
    </g>

    <!-- Side Indicators (Pointers to OS / HW Subsystems) -->
    <!-- 1. CPU Core Context -->
    <g transform="translate(255, 100)">
      <rect x="0" y="0" width="130" height="42" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="65" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">CPU Registers</text>
      <text x="65" y="30" text-anchor="middle" font-size="7" fill="#64748b">RIP / RSP Stack Frame</text>
    </g>
    <path d="M240,121 L255,121" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- 2. MMU Page Table -->
    <g transform="translate(255, 150)">
      <rect x="0" y="0" width="130" height="44" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="65" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">MMU Page Tables</text>
      <text x="65" y="27" text-anchor="middle" font-size="7" fill="#64748b">4 KB Physical Pages</text>
      <text x="65" y="38" text-anchor="middle" font-size="7" fill="#16a34a">Host DRAM (CR3)</text>
    </g>
    <path d="M240,172 L255,172" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- 3. CFS Scheduler Queue -->
    <g transform="translate(255, 226)">
      <rect x="0" y="0" width="130" height="42" rx="1" fill="#f8fafc" stroke="#d97706" stroke-width="1"/>
      <text x="65" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">CFS Runqueue</text>
      <text x="65" y="30" text-anchor="middle" font-size="7" fill="#64748b">Red-Black Tree (vruntime)</text>
    </g>
    <path d="M240,247 L255,247" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)"/>

    <!-- Bottom Metric Panels -->
    <g transform="translate(15, 314)">
      <rect x="0" y="0" width="370" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="21" font-size="8" font-weight="700" fill="#334155">Context Switch Cost:</text>
      <text x="110" y="21" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#0284c7">1 to 10 µs</text>
      <text x="175" y="21" font-size="7.5" fill="#64748b">(Bit-exact hardware swap)</text>
    </g>

    <g transform="translate(15, 356)">
      <rect x="0" y="0" width="370" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="21" font-size="8" font-weight="700" fill="#334155">Failure Boundary:</text>
      <text x="105" y="21" font-size="7.5" fill="#475569">Fail-stop; SIGSEGV / Core Dump</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT DOMAIN: AGENT RUNTIME (ACCELERATOR / CLOUD)                 -->
  <!-- ================================================================= -->
  <g transform="translate(460, 75)">
    <!-- Subsystem Container Card -->
    <rect x="0" y="0" width="400" height="405" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">AGENT RUNTIME CONTROL PLANE</text>
    <text x="388" y="16" text-anchor="end" font-size="8" fill="#6d28d9">Software-orchestrated, non-stationary distributed state</text>

    <!-- ACB Struct (Memory Layout) -->
    <g transform="translate(15, 34)">
      <!-- Struct Container -->
      <rect x="0" y="0" width="225" height="268" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
      <!-- Struct Header -->
      <rect x="0" y="0" width="225" height="22" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="112" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">struct agent_control_block (ACB)</text>

      <!-- Field 1: Identity & Goal -->
      <rect x="1" y="23" width="223" height="38" fill="#ffffff"/>
      <text x="8" y="37" font-size="7.5" font-weight="700" fill="#475569">IDENTITY &amp; GOAL ENVELOPE</text>
      <text x="8" y="50" font-family="Courier, monospace" font-size="8" fill="#0f172a">uuid_t aid; goal_t g;</text>
      <line x1="0" y1="62" x2="225" y2="62" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 2: Capabilities (Leases) -->
      <rect x="1" y="63" width="223" height="42" fill="#fee2e2"/>
      <text x="8" y="77" font-size="7.5" font-weight="700" fill="#991b1b">CAPABILITY LEASES</text>
      <text x="8" y="89" font-family="Courier, monospace" font-size="8" fill="#7f1d1d">lease_t leases[] (HMAC)</text>
      <text x="8" y="100" font-size="6.8" fill="#dc2626">Attenuating permissions / TTL</text>
      <line x1="0" y1="105" x2="225" y2="105" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 3: KV Cache Descriptors -->
      <rect x="1" y="106" width="223" height="42" fill="#dcfce7"/>
      <text x="8" y="120" font-size="7.5" font-weight="700" fill="#15803d">CONTEXT WORKING SET</text>
      <text x="8" y="132" font-family="Courier, monospace" font-size="8" fill="#14532d">paged_kv_table_t *kv_tbl;</text>
      <text x="8" y="143" font-size="6.8" fill="#16a34a">PagedAttention L1/L2 handles</text>
      <line x1="0" y1="148" x2="225" y2="148" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 4: Vector Clock & Lineage -->
      <rect x="1" y="149" width="223" height="38" fill="#ffffff"/>
      <text x="8" y="163" font-size="7.5" font-weight="700" fill="#475569">CAUSAL CLOCKS &amp; LINEAGE</text>
      <text x="8" y="176" font-family="Courier, monospace" font-size="8" fill="#0f172a">vclock_t vc; parent_id_t p;</text>
      <line x1="0" y1="187" x2="225" y2="187" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 5: Lifecycle & Sagas State -->
      <rect x="1" y="188" width="223" height="40" fill="#fef3c7"/>
      <text x="8" y="202" font-size="7.5" font-weight="700" fill="#b45309">LIFECYCLE FSM &amp; SAGAS</text>
      <text x="8" y="215" font-family="Courier, monospace" font-size="8" fill="#78350f">state_t (PREFILL, WAIT, ...)</text>
      <line x1="0" y1="228" x2="225" y2="228" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 6: Token Quotas & Velocity -->
      <rect x="1" y="229" width="223" height="38" fill="#ffffff"/>
      <text x="8" y="243" font-size="7.5" font-weight="700" fill="#475569">TOKENOMICS &amp; BUDGETS</text>
      <text x="8" y="256" font-family="Courier, monospace" font-size="8" fill="#0f172a">token_budget_t; float v_burn;</text>
    </g>

    <!-- Side Indicators (Pointers to Agent Runtime Subsystems) -->
    <!-- 1. Capability Sandbox Filter -->
    <g transform="translate(255, 100)">
      <rect x="0" y="0" width="130" height="42" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="1"/>
      <text x="65" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">Tool Sandbox</text>
      <text x="65" y="30" text-anchor="middle" font-size="7" fill="#64748b">eBPF / MicroVM Filter</text>
    </g>
    <path d="M240,121 L255,121" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <!-- 2. PagedAttention KV Cache Table -->
    <g transform="translate(255, 150)">
      <rect x="0" y="0" width="130" height="44" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="65" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Paged KV Blocks</text>
      <text x="65" y="27" text-anchor="middle" font-size="7" fill="#64748b">16-Token Page Tables</text>
      <text x="65" y="38" text-anchor="middle" font-size="7" fill="#16a34a">Accelerator HBM</text>
    </g>
    <path d="M240,172 L255,172" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- 3. MLFQ / Disaggregated Scheduler -->
    <g transform="translate(255, 226)">
      <rect x="0" y="0" width="130" height="42" rx="1" fill="#f8fafc" stroke="#d97706" stroke-width="1"/>
      <text x="65" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">MLFQ Scheduler</text>
      <text x="65" y="30" text-anchor="middle" font-size="7" fill="#64748b">Priority Queue / Prefill</text>
    </g>
    <path d="M240,247 L255,247" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)"/>

    <!-- Bottom Metric Panels -->
    <g transform="translate(15, 314)">
      <rect x="0" y="0" width="370" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="21" font-size="8" font-weight="700" fill="#334155">Context Switch Cost:</text>
      <text x="110" y="21" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#d97706">50 to 1,000 ms</text>
      <text x="195" y="21" font-size="7.5" fill="#64748b">(PCIe DMA KV swapping)</text>
    </g>

    <g transform="translate(15, 356)">
      <rect x="0" y="0" width="370" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="21" font-size="8" font-weight="700" fill="#334155">Failure Boundary:</text>
      <text x="105" y="21" font-size="7.5" fill="#475569">Fail-plausible; Sagas Compensating Rollback</text>
    </g>
  </g>
</svg>