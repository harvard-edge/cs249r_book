<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-amethyst" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#581C87"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#92400E"/>
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1150" height="560" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- HEADER & METRIC STRIP                                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 20)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#0F172A" letter-spacing="-0.3">DOMINANT RESOURCE FAIRNESS (DRF) MULTI-RESOURCE SCHEDULER</text>
    <text x="0" y="38" font-size="11" fill="#475569">Max-Min Equalization of Normalized Dominant Shares Across Coupled Physical Tiers (Ghodsi et al., NSDI 2011)</text>

    <!-- Top Invariant Badge -->
    <rect x="730" y="4" width="380" height="38" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="742" y="20" font-size="10" font-weight="700" fill="#581C87">Invariant:</text>
    <text x="800" y="20" font-size="9.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1E293B">s_i* = max_r ( U_{i,r} / C_r ) = s_j*</text>
    <text x="742" y="34" font-size="8.5" fill="#6B21A8">Guarantees Pareto efficiency, sharing incentive, and envy-freeness</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: 2D GEOMETRIC DRF ALLOCATION SPACE                    -->
  <!-- ================================================================= -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="570" height="455" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="570" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#334155">DRF 2D RESOURCE ALLOCATION GEOMETRY</text>
    <text x="350" y="20" font-size="9.5" fill="#64748B" font-family="'SF Mono', monospace">Capacity C = [C_comp, C_mem]</text>

    <!-- Coordinate Plot Area: Origin at (90, 360), Width 380, Height 270 -->
    <!-- X-axis: 90 to 470 (380px = 1.0 Normalized Compute) -->
    <!-- Y-axis: 360 to 90 (270px = 1.0 Normalized Memory) -->
    <g transform="translate(10, 0)">
      <!-- Grid Lines & Feasible Area Fill -->
      <rect x="90" y="90" width="380" height="270" fill="url(#grid-grad)"/>

      <!-- Capacity Boundary Box -->
      <rect x="90" y="90" width="380" height="270" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- Grid Vertical Lines (0.2, 0.4, 0.6, 0.8) -->
      <line x1="166" y1="90" x2="166" y2="360" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="242" y1="90" x2="242" y2="360" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="318" y1="90" x2="318" y2="360" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="394" y1="90" x2="394" y2="360" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Grid Horizontal Lines (0.2, 0.4, 0.6, 0.8) -->
      <line x1="90" y1="306" x2="470" y2="306" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="90" y1="252" x2="470" y2="252" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="90" y1="198" x2="470" y2="198" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="90" y1="144" x2="470" y2="144" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Axes Lines with slate arrows -->
      <line x1="90" y1="360" x2="495" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arr-slate)"/>
      <line x1="90" y1="360" x2="90" y2="65" stroke="#334155" stroke-width="2" marker-end="url(#arr-slate)"/>

      <!-- Rotated Y-axis label -->
      <text x="-225" y="45" font-size="10.5" font-weight="700" fill="#334155" transform="rotate(-90)" text-anchor="middle">Device HBM Memory (Normalized)</text>

      <!-- Centered X-axis label -->
      <text x="280" y="402" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">GPU Compute (Normalized)</text>

      <!-- Tick Labels X-axis -->
      <text x="90" y="376" font-size="9" fill="#64748B" text-anchor="middle">0.0</text>
      <text x="166" y="376" font-size="9" fill="#64748B" text-anchor="middle">0.2</text>
      <text x="242" y="376" font-size="9" fill="#64748B" text-anchor="middle">0.4</text>
      <text x="318" y="376" font-size="9" fill="#64748B" text-anchor="middle">0.6</text>
      <text x="394" y="376" font-size="9" fill="#64748B" text-anchor="middle">0.8</text>
      <text x="470" y="376" font-size="9" font-weight="700" fill="#0F172A" text-anchor="middle">1.0</text>

      <!-- Tick Labels Y-axis -->
      <text x="80" y="364" font-size="9" fill="#64748B" text-anchor="end">0.0</text>
      <text x="80" y="310" font-size="9" fill="#64748B" text-anchor="end">0.2</text>
      <text x="80" y="256" font-size="9" fill="#64748B" text-anchor="end">0.4</text>
      <text x="80" y="202" font-size="9" fill="#64748B" text-anchor="end">0.6</text>
      <text x="80" y="148" font-size="9" fill="#64748B" text-anchor="end">0.8</text>
      <text x="80" y="94" font-size="9" font-weight="700" fill="#0F172A" text-anchor="end">1.0</text>

      <!-- Total Capacity Point C = (1.0, 1.0) -> (470, 90) -->
      <circle cx="470" cy="90" r="4.5" fill="#991B1B"/>
      <text x="465" y="80" font-size="9" font-weight="700" fill="#991B1B" text-anchor="end">Total Capacity C = (1.0, 1.0)</text>

      <!-- Tenant Demand Ray A (MCTS): slope = 0.15 / 0.60 = 0.25 -->
      <!-- From (90, 360) to (470, 265) -->
      <line x1="90" y1="360" x2="470" y2="265" stroke="#581C87" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="375" y="255" font-size="9" font-weight="700" fill="#581C87">Demand Ray d_A (MCTS)</text>
      <text x="375" y="266" font-size="8" fill="#6B21A8">c_A = [60% Comp, 15% Mem]</text>

      <!-- Tenant Demand Ray B (SWE): slope = 0.80 / 0.20 = 4.0 -->
      <!-- From (90, 360) to (157.5, 90) -->
      <line x1="90" y1="360" x2="157.5" y2="90" stroke="#0F766E" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="165" y="105" font-size="9" font-weight="700" fill="#0F766E">Demand Ray d_B (SWE)</text>
      <text x="165" y="117" font-size="8" fill="#0F766E">c_B = [20% Comp, 80% Mem]</text>

      <!-- Allocated Share A*: dominant = 80% compute -> x = 90 + 0.80*380 = 394, y = 360 - 0.20*270 = 306 -->
      <line x1="90" y1="360" x2="394" y2="306" stroke="#581C87" stroke-width="3" marker-end="url(#arr-amethyst)"/>
      <circle cx="394" cy="306" r="5" fill="#581C87"/>
      <rect x="300" y="318" width="135" height="32" rx="3" fill="#FAF5FF" stroke="#581C87" stroke-width="1"/>
      <text x="306" y="330" font-size="8.5" font-weight="700" fill="#581C87">Allocation A* (Dominant 80%)</text>
      <text x="306" y="342" font-size="8" fill="#475569">U_A = [80% Comp, 20% Mem]</text>

      <!-- Allocated Share B*: dominant = 80% memory -> x = 90 + 0.20*380 = 166, y = 360 - 0.80*270 = 144 -->
      <line x1="90" y1="360" x2="166" y2="144" stroke="#0F766E" stroke-width="3" marker-end="url(#arr-teal)"/>
      <circle cx="166" cy="144" r="5" fill="#0F766E"/>
      <rect x="95" y="152" width="135" height="32" rx="3" fill="#F0FDFA" stroke="#0F766E" stroke-width="1"/>
      <text x="101" y="164" font-size="8.5" font-weight="700" fill="#0F766E">Allocation B* (Dominant 80%)</text>
      <text x="101" y="176" font-size="8" fill="#475569">U_B = [20% Comp, 80% Mem]</text>

      <!-- Pareto-Optimal Saturation Vector Sum: A* + B* -> (470, 90) -->
      <path d="M 394 306 L 470 90" stroke="#92400E" stroke-width="1.6" stroke-dasharray="4,4"/>
      <path d="M 166 144 L 470 90" stroke="#92400E" stroke-width="1.6" stroke-dasharray="4,4"/>
      <circle cx="470" cy="90" r="5.5" fill="#166534" stroke="#FFFFFF" stroke-width="1.5"/>

      <!-- Pareto Label Box -->
      <rect x="295" y="98" width="165" height="30" rx="3" fill="#F0FDF4" stroke="#166534" stroke-width="1"/>
      <text x="302" y="111" font-size="8.5" font-weight="700" fill="#166534">Pareto Frontier: s_A* = s_B*</text>
      <text x="302" y="122" font-size="8" fill="#15803D">U_A + U_B = (1.0, 1.0) 100% Saturation</text>

      <!-- Equal-split deadweight point -->
      <circle cx="280" cy="225" r="3.5" fill="#94A3B8"/>
      <text x="290" y="228" font-size="8" font-style="italic" fill="#64748B">Equal-split deadweight loss (30% idle)</text>
    </g>

    <!-- Bottom Legend -->
    <g transform="translate(25, 424)">
      <circle cx="10" cy="10" r="4" fill="#581C87"/>
      <text x="20" y="13" font-size="9" fill="#1E293B">Tenant A Dominant (Compute)</text>
      <circle cx="205" cy="10" r="4" fill="#0F766E"/>
      <text x="215" y="13" font-size="9" fill="#1E293B">Tenant B Dominant (Memory)</text>
      <circle cx="395" cy="10" r="4" fill="#166534"/>
      <text x="405" y="13" font-size="9" fill="#1E293B">Pareto Optimal (Max-Min Equalized)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: SCHEDULING ARBITER & WATER-FILLING PIPELINE          -->
  <!-- ================================================================= -->
  <g transform="translate(630, 80)">
    <rect x="0" y="0" width="480" height="455" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="480" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#334155">DRF MAX-MIN ARBITRATION DATAPATH</text>
    <text x="330" y="20" font-size="9.5" fill="#64748B" font-family="'SF Mono', monospace">Discrete Step Engine</text>

    <!-- Step 1: Ingestion of Agent Demands -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="410" height="60" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#581C87">1. Tenant Demand Registration</text>
      <text x="12" y="34" font-size="9" fill="#334155">Agent tasks specify coupled multidimensional resource vectors:</text>
      <text x="12" y="48" font-size="9" font-family="'SF Mono', monospace" fill="#581C87">c_i = [ c_{i,comp} (TFLOPs),  c_{i,mem} (HBM GB),  c_{i,lease} (Tools) ]</text>
    </g>

    <!-- Down Arrow 1 -->
    <line x1="225" y1="105" x2="225" y2="123" stroke="#581C87" stroke-width="1.8" marker-end="url(#arr-amethyst)"/>

    <!-- Step 2: Dominant Share Extraction -->
    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="410" height="74" rx="4" fill="#F8FAFC" stroke="#0F766E" stroke-width="1.2"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0F766E">2. Dominant Resource Computation</text>
      <text x="12" y="34" font-size="9" fill="#334155">For each active tenant i, compute peak consumption ratio:</text>
      <rect x="12" y="42" width="386" height="22" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="0.8"/>
      <text x="20" y="57" font-size="9.5" font-family="'SF Mono', monospace" fill="#0F766E">s_i = max_{r in {comp,mem,tool}} ( U_{i,r} / C_r )</text>
    </g>

    <!-- Down Arrow 2 -->
    <line x1="225" y1="199" x2="225" y2="217" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arr-teal)"/>

    <!-- Step 3: Progressive Water-Filling Arbiter -->
    <g transform="translate(20, 219)">
      <rect x="0" y="0" width="410" height="85" rx="4" fill="#FFFBEB" stroke="#92400E" stroke-width="1.2"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#92400E">3. Max-Min Task Admission Arbiter</text>
      <text x="12" y="34" font-size="9" fill="#334155">Pick tenant with lowest dominant share whose task fits remaining headroom:</text>
      <rect x="12" y="42" width="386" height="32" rx="2" fill="#FFFFFF" stroke="#92400E" stroke-width="0.8"/>
      <text x="20" y="55" font-size="9.5" font-family="'SF Mono', monospace" fill="#92400E">i* = argmin_{i in Active} ( s_i )</text>
      <text x="20" y="67" font-size="8.5" fill="#B45309">Check capacity: U_r + c_{i*,r} &lt;= C_r for all resources r</text>
    </g>

    <!-- Down Arrow 3 -->
    <line x1="225" y1="304" x2="225" y2="322" stroke="#92400E" stroke-width="1.8" marker-end="url(#arr-ochre)"/>

    <!-- Step 4: Execution Dispatch & State Ledger Update -->
    <g transform="translate(20, 324)">
      <rect x="0" y="0" width="410" height="70" rx="4" fill="#F0FDF4" stroke="#166534" stroke-width="1.2"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#166534">4. Cluster Dispatch &amp; State Accounting</text>
      <text x="12" y="34" font-size="9" fill="#334155">Allocate resources to task tau_{i*}; update physical consumption vectors:</text>
      <text x="12" y="50" font-size="9" font-family="'SF Mono', monospace" fill="#166534">U_{i*,r} &lt;- U_{i*,r} + c_{i*,r} ;  U_r &lt;- U_r + c_{i*,r}</text>
    </g>

    <!-- Internal Feedback Bus Loop -->
    <path d="M 435 359 L 452 359 L 452 162 L 435 162" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-slate)"/>
    <text x="466" y="260" font-size="8" font-weight="700" fill="#475569" transform="rotate(90, 466, 260)" text-anchor="middle">Continuous Feedback Loop</text>
  </g>
</svg>
