<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      
      /* Participant boxes */
      .part-cp { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 4; }
      .part-wal { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; rx: 4; }
      .part-saga { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; rx: 4; }
      .part-box { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 4; }
      
      .part-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .part-sub { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9.5px; fill: #475569; text-anchor: middle; }
      
      .lifeline { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4,4; }
      
      /* Phase banners */
      .phase-bar { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; rx: 3; }
      .phase-bar-red { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1; rx: 3; }
      .phase-bar-blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 3; }
      .phase-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #334155; }
      
      /* Connectors */
      .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
      .edge-green { stroke: #16a34a; stroke-width: 1.6; fill: none; }
      .edge-red { stroke: #dc2626; stroke-width: 1.6; fill: none; }
      .edge-red-dash { stroke: #dc2626; stroke-width: 1.6; stroke-dasharray: 4,3; fill: none; }
      .edge-amber { stroke: #d97706; stroke-width: 1.6; fill: none; }
      .edge-blue { stroke: #2563eb; stroke-width: 1.6; fill: none; }
      
      /* Message text */
      .msg-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8.5px; fill: #0f172a; }
      .msg-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8.5px; font-weight: 700; }
      .msg-annot { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8px; fill: #64748b; }
      
      /* Crash strip */
      .crash-box { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4,3; rx: 4; }
      .crash-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #991b1b; text-anchor: middle; }
      
      /* Summary strip */
      .sum-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 4; }
      .sum-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sum-sub { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9px; fill: #334155; text-anchor: middle; }
    </style>

    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- ================================================================= -->
  <!-- PARTICIPANT HEADERS                                               -->
  <!-- ================================================================= -->

  <!-- Participant 1: Control Plane -->
  <g transform="translate(30, 15)">
    <rect width="180" height="42" class="part-cp" />
    <text x="90" y="24" class="part-hdr" fill="#1e40af">Control Plane</text>
    <text x="90" y="37" class="part-sub">𝒦_sched (Supervisor)</text>
  </g>
  <line x1="120" y1="57" x2="120" y2="780" class="lifeline" />

  <!-- Participant 2: Write-Ahead Log -->
  <g transform="translate(280, 15)">
    <rect width="180" height="42" class="part-wal" />
    <text x="90" y="24" class="part-hdr" fill="#0f172a">Write-Ahead Log</text>
    <text x="90" y="37" class="part-sub">ℒ_wal (NVMe Storage)</text>
  </g>
  <line x1="370" y1="57" x2="370" y2="780" class="lifeline" />

  <!-- Participant 3: Saga Engine -->
  <g transform="translate(530, 15)">
    <rect width="180" height="42" class="part-saga" />
    <text x="90" y="24" class="part-hdr" fill="#b45309">Saga Coordinator</text>
    <text x="90" y="37" class="part-sub">𝒮_saga (Recovery Stack)</text>
  </g>
  <line x1="620" y1="57" x2="620" y2="780" class="lifeline" />

  <!-- Participant 4: Sandbox & External APIs -->
  <g transform="translate(780, 15)">
    <rect width="180" height="42" class="part-box" />
    <text x="90" y="24" class="part-hdr" fill="#15803d">Execution Sandbox</text>
    <text x="90" y="37" class="part-sub">Cloud APIs &amp; Docker</text>
  </g>
  <line x1="870" y1="57" x2="870" y2="780" class="lifeline" />

  <!-- ================================================================= -->
  <!-- PHASE 1: TURNS 1 & 2: FORWARD PROGRESSION & BASELINE              -->
  <!-- ================================================================= -->
  <g transform="translate(30, 68)">
    <rect width="930" height="18" class="phase-bar" />
    <text x="12" y="13" class="phase-text">TURNS 1–2: FORWARD PROGRESSION &amp; DURABLE WAL CHECKPOINTING</text>
  </g>

  <!-- Step 1: Clone repository -->
  <path d="M 120 98 L 362 98" class="edge" marker-end="url(#arr)" />
  <text x="245" y="93" class="msg-mono" text-anchor="middle">append_wal(Turn 1, a₁: git_clone, fsync)</text>

  <path d="M 120 115 L 862 115" class="edge" marker-end="url(#arr)" />
  <text x="495" y="110" class="msg-mono" text-anchor="middle">dispatch_tool("git clone repo") ⇒ Exit 0</text>

  <path d="M 120 132 L 612 132" class="edge" marker-end="url(#arr)" />
  <text x="370" y="128" class="msg-mono" text-anchor="middle">register_compensator(C₁ = noop)</text>

  <!-- Step 2: Base snapshot at Turn 2 -->
  <path d="M 120 150 L 362 150" class="edge-blue" marker-end="url(#arr-blue)" />
  <text x="245" y="146" class="msg-bold" fill="#1e40af" text-anchor="middle">commit_base_snapshot(S₂, L₂ = 12k tokens, 48 MB)</text>

  <!-- ================================================================= -->
  <!-- PHASE 2: TURN 3: TRANSIENT TIMEOUT & IDEMPOTENT PROBE             -->
  <!-- ================================================================= -->
  <g transform="translate(30, 168)">
    <rect width="930" height="18" class="phase-bar-red" />
    <text x="12" y="13" class="phase-text" fill="#b91c1c">TURN 3 (FAILURE 1): TRANSIENT NETWORK TIMEOUT &amp; IDEMPOTENT RECONCILIATION PROBE</text>
  </g>

  <!-- Step 5: Intent logged -->
  <path d="M 120 198 L 362 198" class="edge" marker-end="url(#arr)" />
  <text x="245" y="193" class="msg-mono" text-anchor="middle">log_intent(a₃: provision_staging_db, key=κ₃)</text>

  <!-- Step 6: Dispatch tool -> Timeout -->
  <path d="M 120 220 L 862 220" class="edge-red-dash" />
  <text x="495" y="215" class="msg-mono" text-anchor="middle" fill="#dc2626">dispatch_tool(POST /v1/instances, key=κ₃)  [DROPPED IN TRANSIT: L_net &gt; T_timeout]</text>
  <!-- Timeout marker -->
  <circle cx="580" cy="220" r="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="580" y="223" font-family="sans-serif" font-size="9px" font-weight="700" fill="#dc2626" text-anchor="middle">✗</text>

  <!-- Step 7: Out-of-band probe -->
  <path d="M 120 245 L 862 245" class="edge-green" marker-end="url(#arr-green)" />
  <text x="495" y="240" class="msg-bold" fill="#15803d" text-anchor="middle">reconcile_probe(idempotency_key=κ₃) ⇒ 200 OK: Instance db-stage-01 Active</text>

  <!-- Step 8: Commit to WAL & Register C3 -->
  <path d="M 120 268 L 362 268" class="edge" marker-end="url(#arr)" />
  <text x="245" y="263" class="msg-mono" text-anchor="middle">log_commit(synthetic o₃: db_ready)</text>

  <path d="M 120 286 L 612 286" class="edge-amber" marker-end="url(#arr-amber)" />
  <text x="370" y="282" class="msg-bold" fill="#b45309" text-anchor="middle">register_compensator(C₃: ec2.TerminateInstances(db-stage-01))</text>

  <!-- ================================================================= -->
  <!-- PHASE 3: TURN 4: SQL SYNTAX ERROR & FORWARD SELF-HEALING          -->
  <!-- ================================================================= -->
  <g transform="translate(30, 305)">
    <rect width="930" height="18" class="phase-bar-red" />
    <text x="12" y="13" class="phase-text" fill="#b91c1c">TURN 4 (FAILURE 2): SQL SYNTAX ERROR &amp; BOUNDED FORWARD SELF-HEALING (K_repair ≤ 2)</text>
  </g>

  <!-- Step 10: Dispatch migration script -->
  <path d="M 120 335 L 862 335" class="edge" marker-end="url(#arr)" />
  <text x="495" y="330" class="msg-mono" text-anchor="middle">dispatch_tool("psql -f migration_v2.sql")</text>

  <!-- Step 11: SQL error returned -->
  <path d="M 870 355 L 128 355" class="edge-red" marker-end="url(#arr-red)" />
  <text x="495" y="350" class="msg-bold" fill="#dc2626" text-anchor="middle">ERROR: Exit 1 · PostgreSQL: syntax error at or near "INDEX_CONCURRENT" (o₄^err)</text>

  <!-- Step 12: Forward self-healing pass -->
  <path d="M 120 378 L 160 378 L 160 395 L 128 395" class="edge-green" marker-end="url(#arr-green)" />
  <text x="170" y="388" class="msg-annot" fill="#15803d">Forward self-healing: Ingest o₄^err diagnostic frame; generate patch a_repair</text>

  <!-- Step 13: Corrected SQL dispatched -->
  <path d="M 120 412 L 862 412" class="edge-green" marker-end="url(#arr-green)" />
  <text x="495" y="407" class="msg-bold" fill="#15803d" text-anchor="middle">dispatch_tool(a_repair: "psql -f migration_v2_patch.sql") ⇒ Exit 0 (Tables Created)</text>

  <path d="M 120 430 L 362 430" class="edge" marker-end="url(#arr)" />
  <text x="245" y="426" class="msg-mono" text-anchor="middle">append_wal(Turn 4 Commit, a_repair, schema_v2_ok)</text>

  <!-- ================================================================= -->
  <!-- PHASE 4: TURN 5: CATASTROPHIC HOST CRASH & WAL REPLAY             -->
  <!-- ================================================================= -->
  <g transform="translate(30, 448)">
    <rect width="930" height="26" class="crash-box" />
    <text x="465" y="17" class="crash-text">TURN 5 (FAILURE 3): HOST CRASH / POWER LOSS</text>
  </g>

  <!-- Step 14: Crash Recovery on reboot -->
  <g transform="translate(30, 482)">
    <rect width="930" height="18" class="phase-bar-blue" />
    <text x="12" y="13" class="phase-text" fill="#1e40af">POST-CRASH RECOVERY: NVMe SNAPSHOT DESERIALIZATION + WAL REPLAY (RPO = 0, RTO = 570.8 ms)</text>
  </g>

  <path d="M 120 512 L 362 512" class="edge-blue" marker-end="url(#arr-blue)" />
  <text x="245" y="507" class="msg-bold" fill="#1e40af" text-anchor="middle">read_snapshot(S₂) from NVMe (48 MB / 3.5 GB/s ⇒ 13.7 ms)</text>

  <path d="M 120 532 L 362 532" class="edge-blue" marker-end="url(#arr-blue)" />
  <text x="245" y="527" class="msg-bold" fill="#1e40af" text-anchor="middle">replay_wal_delta(Turns 3 &amp; 4: 128 KB ⇒ 0.06 ms) · Rebuild s₄</text>

  <path d="M 120 552 L 612 552" class="edge-amber" marker-end="url(#arr-amber)" />
  <text x="370" y="547" class="msg-bold" fill="#b45309" text-anchor="middle">restore_saga_ledger(ℒ_comp = [C₁, C₂, C₃, C₄])</text>

  <path d="M 120 572 L 160 572 L 160 588 L 128 588" class="edge-blue" marker-end="url(#arr-blue)" />
  <text x="170" y="582" class="msg-annot" fill="#1e40af">Prefill GPU KV Cache: ΔL = 4,096 tokens / 8,000 tok/s ⇒ 512 ms · Total RTO = 570.8 ms</text>

  <!-- ================================================================= -->
  <!-- PHASE 5: TURN 6: PRE-PIVOT VERIFICATION & PRODUCTION DEPLOY       -->
  <!-- ================================================================= -->
  <g transform="translate(30, 602)">
    <rect width="930" height="18" class="phase-bar-blue" />
    <text x="12" y="13" class="phase-text" fill="#1e40af">TURN 6 (FAILURE 4 BOUNDARY): IRREVERSIBLE PIVOT ACTION &amp; VERIFICATION GATE (𝒢_gate)</text>
  </g>

  <!-- Step 17: Model proposes irreversible action -->
  <path d="M 120 632 L 160 632 L 160 648 L 128 648" class="edge-red" marker-end="url(#arr-red)" />
  <text x="170" y="642" class="msg-mono" fill="#991b1b">Model proposes a₆: deploy_production() [PIVOT: C_pivot = ∅, Compensation Impossible]</text>

  <!-- Step 18: Verification Gate intercepts -->
  <path d="M 120 665 L 862 665" class="edge-blue" marker-end="url(#arr-blue)" />
  <text x="495" y="660" class="msg-bold" fill="#1e40af" text-anchor="middle">𝒢_gate intercepts: run_integration_suite(staging_endpoint, schema_invariants)</text>

  <!-- Step 19: Sandbox confirms pass -->
  <path d="M 870 688 L 128 688" class="edge-green" marker-end="url(#arr-green)" />
  <text x="495" y="683" class="msg-bold" fill="#15803d" text-anchor="middle">18. Deterministic gate passes: 142/142 tests green · Hash digest validated</text>

  <!-- Step 20: Production Deploy released -->
  <path d="M 120 712 L 862 712" class="edge-green" marker-end="url(#arr-green)" />
  <text x="495" y="707" class="msg-bold" fill="#15803d" text-anchor="middle">Release pivot action: deploy_production_cluster() ⇒ Exit 0 (Live Traffic Active)</text>

  <!-- Step 21: Terminal WAL Commit -->
  <path d="M 120 735 L 362 735" class="edge" marker-end="url(#arr)" />
  <text x="245" y="730" class="msg-mono" text-anchor="middle">append_wal([TRAJECTORY_COMMITTED_SUCCESS], fsync)</text>

  <!-- ================================================================= -->
  <!-- SUMMARY FOOTER STRIP                                              -->
  <!-- ================================================================= -->
  <g transform="translate(30, 755)">
    <rect width="930" height="42" class="sum-box" />
    <text x="465" y="18" class="sum-text">
      SYNTHESIZED FAULT-TOLERANT RUNTIME: END-TO-END EXECUTION METRICS
    </text>
    <text x="465" y="32" class="sum-sub">
      MTBF = 42.4 h  |  MTTR = 570.8 ms  |  RPO = 0 Turns (Zero Data Loss)  |  RTO &lt; 5.0 s  |  Completion Rate: 94.8% (vs. 14.2% Baseline)
    </text>
  </g>

</svg>
