<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box-state { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 4; }
      .box-hash { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 3; }
      
      .box-state-alert { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 4; }
      .box-hash-alert { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.8; rx: 3; }
      
      .box-arch { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 4; }
      .box-arbiter { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; rx: 4; }
      .box-inject { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 4; }
      .box-arrest { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; rx: 4; }
      
      .hdr-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1; rx: 3; }
      .hdr-blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; rx: 3; }
      .hdr-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; rx: 3; }
      .hdr-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 1; rx: 3; }
      
      .turn-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .turn-hdr-alert { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
      
      .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #0f172a; }
      .item-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #334155; }
      
      .mono-hash { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #0f172a; text-anchor: middle; }
      .mono-hash-alert { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
      
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; }
      
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .edge-alert { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
      .edge-green { stroke: #16a34a; stroke-width: 1.5; fill: none; }
      .edge-red { stroke: #dc2626; stroke-width: 1.5; fill: none; }
      
      .action-label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .pill-alert { fill: #ffffff; stroke: #fca5a5; stroke-width: 1.2; rx: 3; }
      .pill-alert-title { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .pill-alert-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; fill: #991b1b; text-anchor: middle; }
    </style>

    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- ================================================================= -->
  <!-- UPPER SECTION: SLIDING HISTORY WINDOW TRAJECTORY TURNS            -->
  <!-- ================================================================= -->

  <!-- Column 1: Turn t-3 -->
  <g transform="translate(40, 15)">
    <text x="95" y="14" class="turn-hdr">Step t - 3</text>
    
    <rect y="22" width="190" height="58" class="box-state" />
    <text x="10" y="40" class="item-title">State s_{t-3}</text>
    <text x="10" y="55" class="item-body">• Clean git tree; tests fail</text>
    <text x="10" y="69" class="item-body">• Diagnostic: SyntaxError line 42</text>
    
    <!-- Down arrow to hash -->
    <line x1="95" y1="80" x2="95" y2="100" class="edge" marker-end="url(#arr)" />
    <text x="102" y="93" font-size="8px" fill="#64748b">SHA-256</text>
    
    <rect y="102" width="190" height="34" class="box-hash" />
    <text x="95" y="123" class="mono-hash">ℋ_{t-3} = 0x8F4A21D7</text>
  </g>

  <!-- Transition t-3 -> t-2 -->
  <g transform="translate(232, 15)">
    <line x1="0" y1="51" x2="40" y2="51" class="edge" marker-end="url(#arr)" />
    <text x="20" y="44" class="action-label">a_{t-2}</text>
    <text x="20" y="64" font-size="8px" fill="#64748b" text-anchor="middle">edit(42)</text>
  </g>

  <!-- Column 2: Turn t-2 (Cycle Origin) -->
  <g transform="translate(275, 15)">
    <text x="95" y="14" class="turn-hdr-alert">Step t - 2 (Cycle Origin)</text>
    
    <rect y="22" width="190" height="58" class="box-state-alert" />
    <text x="10" y="40" class="item-title" fill="#991b1b">State s_{t-2}</text>
    <text x="10" y="55" class="item-body">• Modified config at line 42</text>
    <text x="10" y="69" class="item-body">• Diagnostic: Test fails (assert 0)</text>
    
    <!-- Down arrow to hash -->
    <line x1="95" y1="80" x2="95" y2="100" class="edge" marker-end="url(#arr)" />
    <text x="102" y="93" font-size="8px" fill="#64748b">SHA-256</text>
    
    <rect y="102" width="190" height="34" class="box-hash-alert" />
    <text x="95" y="123" class="mono-hash-alert">ℋ_{t-2} = 0xA19CB74E</text>
  </g>

  <!-- Transition t-2 -> t-1 -->
  <g transform="translate(467, 15)">
    <line x1="0" y1="51" x2="40" y2="51" class="edge" marker-end="url(#arr)" />
    <text x="20" y="44" class="action-label">a_{t-1}</text>
    <text x="20" y="64" font-size="8px" fill="#64748b" text-anchor="middle">revert(42)</text>
  </g>

  <!-- Column 3: Turn t-1 -->
  <g transform="translate(510, 15)">
    <text x="95" y="14" class="turn-hdr">Step t - 1</text>
    
    <rect y="22" width="190" height="58" class="box-state" />
    <text x="10" y="40" class="item-title">State s_{t-1}</text>
    <text x="10" y="55" class="item-body">• Reverted edit on line 42</text>
    <text x="10" y="69" class="item-body">• Diagnostic: SyntaxError line 42</text>
    
    <!-- Down arrow to hash -->
    <line x1="95" y1="80" x2="95" y2="100" class="edge" marker-end="url(#arr)" />
    <text x="102" y="93" font-size="8px" fill="#64748b">SHA-256</text>
    
    <rect y="102" width="190" height="34" class="box-hash" />
    <text x="95" y="123" class="mono-hash">ℋ_{t-1} = 0xC3E290BA</text>
  </g>

  <!-- Transition t-1 -> t -->
  <g transform="translate(702, 15)">
    <line x1="0" y1="51" x2="40" y2="51" class="edge" marker-end="url(#arr)" />
    <text x="20" y="44" class="action-label">a_{t}</text>
    <text x="20" y="64" font-size="8px" fill="#64748b" text-anchor="middle">edit(42)</text>
  </g>

  <!-- Column 4: Turn t (Current / Cycle Duplicate) -->
  <g transform="translate(745, 15)">
    <text x="95" y="14" class="turn-hdr-alert">Step t (Cycle Duplicate)</text>
    
    <rect y="22" width="190" height="58" class="box-state-alert" />
    <text x="10" y="40" class="item-title" fill="#991b1b">State s_{t}</text>
    <text x="10" y="55" class="item-body">• Re-applied identical edit</text>
    <text x="10" y="69" class="item-body">• Diagnostic: Test fails (assert 0)</text>
    
    <!-- Down arrow to hash -->
    <line x1="95" y1="80" x2="95" y2="100" class="edge" marker-end="url(#arr)" />
    <text x="102" y="93" font-size="8px" fill="#64748b">SHA-256</text>
    
    <rect y="102" width="190" height="34" class="box-hash-alert" />
    <text x="95" y="123" class="mono-hash-alert">ℋ_{t} = 0xA19CB74E</text>
  </g>

  <!-- Hash Collision Comparison Arc -->
  <path d="M 840 138 C 840 215 780 215 745 215" class="edge-alert" />
  <path d="M 465 215 C 400 215 370 185 370 144" class="edge-alert" marker-end="url(#arr-red)" />
  
  <g transform="translate(465, 195)">
    <rect x="0" y="0" width="280" height="40" class="pill-alert" />
    <text x="140" y="17" class="pill-alert-title">HASH COLLISION: ℋ_t == ℋ_{t-2}</text>
    <text x="140" y="31" class="pill-alert-sub">Period k = 2 Orbit Detected · Net Progress Δs = 0</text>
  </g>

  <!-- ================================================================= -->
  <!-- LOWER SECTION: SUPERVISORY INTERPOSITION ARCHITECTURE             -->
  <!-- ================================================================= -->

  <!-- Panel 1: Sliding Window Set -->
  <g transform="translate(40, 265)">
    <rect width="270" height="195" class="box-arch" />
    <rect x="1" y="1" width="268" height="22" class="hdr-slate" />
    <text x="10" y="16" class="panel-title" fill="#334155">1. Sliding Window Buffer (W)</text>
    <text x="12" y="38" class="item-body">• History Ring Buffer: W = [ℋ_{t-K}, ..., ℋ_t]</text>
    <text x="12" y="55" class="item-body">• Set Lookup: ∃ k ∈ [1, K] : ℋ_t == ℋ_{t-k}</text>
    <text x="12" y="72" class="item-body">• Complexity: O(1) in-memory hash set</text>
    <text x="12" y="89" class="item-body">• Birthday bound: P(collision) &lt; 2^-128</text>
    <text x="12" y="106" class="item-body">• Canonicalize: Strips transient timestamps</text>
    <text x="12" y="123" class="item-body">• Whitelist: Ignores /tmp and build caches</text>
    <rect x="10" y="145" width="250" height="38" rx="2" fill="#ffffff" stroke="#cbd5e1" />
    <text x="135" y="160" font-family="SFMono-Regular, monospace" font-size="9px" text-anchor="middle" fill="#0f172a">hash_table.contains(ℋ_t)</text>
    <text x="135" y="174" font-family="SFMono-Regular, monospace" font-size="9px" font-weight="700" text-anchor="middle" fill="#dc2626">⇒ TRUE (Cycle Period k = 2)</text>
  </g>

  <!-- Connector from Panel 1 to Panel 2 -->
  <line x1="310" y1="362" x2="348" y2="362" class="edge" marker-end="url(#arr)" />

  <!-- Panel 2: Supervisor Arbiter -->
  <g transform="translate(350, 265)">
    <rect width="280" height="195" class="box-arbiter" />
    <rect x="1" y="1" width="278" height="22" class="hdr-blue" />
    <text x="10" y="16" class="panel-title" fill="#1e40af">2. Supervisor Semantic Arbiter</text>
    <text x="12" y="38" class="item-body">• Traps non-advancing excess activity</text>
    <text x="12" y="55" class="item-body">• Process liveness probes (/healthz) pass</text>
    <text x="12" y="72" class="item-body">• GPU GEMV saturates HBM bus normally</text>
    <text x="12" y="89" class="item-body">• Epistemic gap: Attention sees new tokens</text>
    <text x="12" y="106" class="item-body">• Arbiter increments orbit counter: c_orbit</text>
    <text x="12" y="123" class="item-body">• Evaluates intervention policy threshold</text>
    <rect x="10" y="145" width="260" height="38" rx="2" fill="#ffffff" stroke="#93c5fd" />
    <text x="140" y="160" font-family="SFMono-Regular, monospace" font-size="9px" text-anchor="middle" fill="#1e40af">if c_orbit &lt;= 2: inject_prompt()</text>
    <text x="140" y="174" font-family="SFMono-Regular, monospace" font-size="9px" text-anchor="middle" fill="#991b1b">else: abort_and_rollback()</text>
  </g>

  <!-- Connectors from Panel 2 to Panel 3A & 3B -->
  <path d="M 630 330 L 668 330" class="edge-green" marker-end="url(#arr-green)" />
  <path d="M 630 405 L 668 405" class="edge-red" marker-end="url(#arr-red)" />

  <!-- Panel 3A: Intervention Prompt -->
  <g transform="translate(670, 275)">
    <rect width="250" height="85" class="box-inject" />
    <rect x="1" y="1" width="248" height="20" class="hdr-green" />
    <text x="8" y="15" class="panel-title" font-size="9.5px" fill="#15803d">3A. Iteration ≤ 2: Synthetic Prompt</text>
    <text x="8" y="34" class="item-body">• Inject diagnostic prompt into context frame:</text>
    <rect x="8" y="40" width="234" height="24" rx="2" fill="#ffffff" stroke="#86efac" />
    <text x="125" y="55" font-family="SFMono-Regular, monospace" font-size="8px" text-anchor="middle" fill="#15803d">[STATE_OSCILLATION_TRAPPED: k=2]</text>
    <text x="8" y="76" class="item-body">• Forces sampler to explore alternative tool branch</text>
  </g>

  <!-- Panel 3B: Execution Arrest -->
  <g transform="translate(670, 375)">
    <rect width="250" height="85" class="box-arrest" />
    <rect x="1" y="1" width="248" height="20" class="hdr-red" />
    <text x="8" y="15" class="panel-title" font-size="9.5px" fill="#b91c1c">3B. Iteration &gt; 2: Execution Arrest</text>
    <text x="8" y="34" class="item-body">• Halt forward autoregressive decode pass</text>
    <text x="8" y="50" class="item-body">• Revoke sandbox authority leases (A = 0)</text>
    <text x="8" y="66" class="item-body">• Trip circuit breaker; initiate Saga rollback</text>
    <text x="8" y="79" font-family="SFMono-Regular, monospace" font-size="8px" fill="#b91c1c">• Status: ESCALATED_FREEZE</text>
  </g>

</svg>
