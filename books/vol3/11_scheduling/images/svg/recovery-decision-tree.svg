<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box-root { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 4; }
      .box-gate { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; rx: 4; }
      
      .box-term-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; rx: 4; }
      .box-term-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; rx: 4; }
      .box-term-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 4; }
      
      .root-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .root-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #475569; text-anchor: middle; }
      
      .gate-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1e40af; text-anchor: middle; }
      .gate-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #334155; text-anchor: middle; }
      
      .term-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .term-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #334155; }
      .term-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; }
      
      .edge { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .edge-red { stroke: #dc2626; stroke-width: 1.6; fill: none; }
      .edge-green { stroke: #16a34a; stroke-width: 1.6; fill: none; }
      .edge-amber { stroke: #d97706; stroke-width: 1.6; fill: none; }
      
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 3; }
      .pill-red { fill: #ffffff; stroke: #fca5a5; stroke-width: 1; rx: 3; }
      .pill-green { fill: #ffffff; stroke: #86efac; stroke-width: 1; rx: 3; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #1e293b; text-anchor: middle; }
    </style>
    
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- ================================================================= -->
  <!-- ROOT: FAULT INTERCEPTED                                           -->
  <!-- ================================================================= -->
  <g transform="translate(350, 15)">
    <rect width="260" height="46" class="box-root" />
    <text x="130" y="20" class="root-title">Execution Fault Intercepted: Ω_t</text>
    <text x="130" y="36" class="root-mono">⟨ s_t, T_t, o_t^err, B_t, Σ_t ⟩</text>
  </g>

  <!-- Line Root -> Gate 1 -->
  <line x1="480" y1="61" x2="480" y2="83" class="edge" marker-end="url(#arr)" />

  <!-- ================================================================= -->
  <!-- GATE 1: ERROR TAXONOMY SIGNATURE                                  -->
  <!-- ================================================================= -->
  <g transform="translate(340, 85)">
    <rect width="280" height="52" class="box-gate" />
    <text x="140" y="22" class="gate-title">Gate 1: Error Taxonomy Signature</text>
    <text x="140" y="38" class="gate-sub">Classify o_t^err: Transient vs. Semantic vs. Fatal</text>
  </g>

  <!-- Branch 1A: Transient -> Terminal 1 (TRANSIENT_RETRY) -->
  <path d="M 340 111 L 130 111 L 130 368" class="edge-green" marker-end="url(#arr-green)" />
  <g transform="translate(160, 101)">
    <rect x="0" y="0" width="150" height="20" class="pill-green" />
    <text x="75" y="14" class="pill-text" fill="#15803d">Transient (429, Timeout, Lock)</text>
  </g>

  <!-- Branch 1B: Fatal Invariant -> Direct to Escalate Trunk at x=825 -->
  <path d="M 620 111 L 825 111" class="edge-red" />
  <g transform="translate(645, 101)">
    <rect x="0" y="0" width="155" height="20" class="pill-red" />
    <text x="77" y="14" class="pill-text" fill="#b91c1c">Fatal (Auth, OOM, Security)</text>
  </g>

  <!-- Branch 1C: Deterministic Semantic -> Gate 2 -->
  <line x1="480" y1="137" x2="480" y2="173" class="edge" marker-end="url(#arr)" />
  <g transform="translate(405, 145)">
    <rect x="0" y="0" width="150" height="18" class="pill" />
    <text x="75" y="13" class="pill-text">Deterministic (Syntax, Schema)</text>
  </g>

  <!-- ================================================================= -->
  <!-- GATE 2: RESOURCE BUDGET HEADROOM                                  -->
  <!-- ================================================================= -->
  <g transform="translate(340, 175)">
    <rect width="280" height="52" class="box-gate" />
    <text x="140" y="22" class="gate-title">Gate 2: Resource Budget Headroom</text>
    <text x="140" y="38" class="gate-sub">Evaluate limits: B_t = ⟨ T_rem, S_rem, $_rem ⟩</text>
  </g>

  <!-- Branch 2A: Budget Exhausted -> Escalate Trunk at x=825 -->
  <path d="M 620 201 L 825 201" class="edge-red" />
  <g transform="translate(655, 191)">
    <rect x="0" y="0" width="135" height="20" class="pill-red" />
    <text x="67" y="14" class="pill-text" fill="#b91c1c">Budget Limit Exhausted</text>
  </g>

  <!-- Branch 2B: Budget OK -> Gate 3 -->
  <line x1="480" y1="227" x2="480" y2="263" class="edge" marker-end="url(#arr)" />
  <g transform="translate(405, 235)">
    <rect x="0" y="0" width="150" height="18" class="pill" />
    <text x="75" y="13" class="pill-text">Budget OK (T_rem &gt; E[T_rep])</text>
  </g>

  <!-- ================================================================= -->
  <!-- GATE 3: ECONOMIC AMORTIZATION & SAFETY                            -->
  <!-- ================================================================= -->
  <g transform="translate(340, 265)">
    <rect width="280" height="52" class="box-gate" />
    <text x="140" y="22" class="gate-title">Gate 3: Economic Amortization &amp; Safety</text>
    <text x="140" y="38" class="gate-sub">E[Cost(Repair)] vs. Unwind Penalty U(Σ_t)</text>
  </g>

  <!-- Branch 3A: Repair Viable -> Terminal 2 (FORWARD_REPAIR) -->
  <line x1="380" y1="317" x2="380" y2="368" class="edge-green" marker-end="url(#arr-green)" />
  <g transform="translate(325, 332)">
    <rect x="0" y="0" width="110" height="20" class="pill-green" />
    <text x="55" y="14" class="pill-text" fill="#15803d">E[Cost] ≪ U(Σ_t)</text>
  </g>

  <!-- Branch 3B: Unwind Viable -> Terminal 3 (BACKWARD_ROLLBACK) -->
  <line x1="580" y1="317" x2="580" y2="368" class="edge-amber" marker-end="url(#arr-amber)" />
  <g transform="translate(525, 332)">
    <rect x="0" y="0" width="110" height="20" class="pill" />
    <text x="55" y="14" class="pill-text">Unwind Viable</text>
  </g>

  <!-- Branch 3C: Irreversible / Compensator Failed -> Escalate Trunk -->
  <path d="M 620 291 L 825 291" class="edge-red" />
  <g transform="translate(650, 281)">
    <rect x="0" y="0" width="145" height="20" class="pill-red" />
    <text x="72" y="14" class="pill-text" fill="#b91c1c">Pivot Crossed / C_i Failed</text>
  </g>

  <!-- Escalation Trunk Line down to Terminal 4 -->
  <path d="M 825 111 L 825 368" class="edge-red" marker-end="url(#arr-red)" />

  <!-- ================================================================= -->
  <!-- TERMINAL OUTCOMES                                                 -->
  <!-- ================================================================= -->

  <!-- Terminal 1: TRANSIENT_RETRY -->
  <g transform="translate(30, 370)">
    <rect width="200" height="95" class="box-term-green" />
    <text x="100" y="22" class="term-hdr" fill="#166534">TRANSIENT_RETRY</text>
    <text x="12" y="42" class="term-body">• Exponential backoff + full jitter</text>
    <text x="12" y="58" class="term-body">• Preserves context window state</text>
    <text x="12" y="74" class="term-body">• In-flight attempts: k &lt; K_max</text>
    <text x="12" y="88" class="term-code" fill="#15803d">t_wait = U(0, min(T_max, 2^k*T_0))</text>
  </g>

  <!-- Terminal 2: FORWARD_REPAIR -->
  <g transform="translate(260, 370)">
    <rect width="200" height="95" class="box-term-green" />
    <text x="100" y="22" class="term-hdr" fill="#166534">FORWARD_REPAIR</text>
    <text x="12" y="42" class="term-body">• Synthesize self-healing prompt</text>
    <text x="12" y="58" class="term-body">• Append o_t^err diagnostic frame</text>
    <text x="12" y="74" class="term-body">• Bounded horizon: K_repair ≤ 2</text>
    <text x="12" y="88" class="term-code" fill="#15803d">a_repair ~ P(• | s_t, o_t^err)</text>
  </g>

  <!-- Terminal 3: BACKWARD_ROLLBACK -->
  <g transform="translate(490, 370)">
    <rect width="200" height="95" class="box-term-amber" />
    <text x="100" y="22" class="term-hdr" fill="#b45309">BACKWARD_ROLLBACK</text>
    <text x="12" y="42" class="term-body">• Execute compensating ledger</text>
    <text x="12" y="58" class="term-body">• Reverse LIFO unwinding: C_k → C_1</text>
    <text x="12" y="74" class="term-body">• Deterministic code handlers</text>
    <text x="12" y="88" class="term-code" fill="#b45309">for c in reversed(Σ): c()</text>
  </g>

  <!-- Terminal 4: OPERATOR_ESCALATE -->
  <g transform="translate(720, 370)">
    <rect width="210" height="95" class="box-term-red" />
    <text x="105" y="22" class="term-hdr" fill="#991b1b">OPERATOR_ESCALATE</text>
    <text x="12" y="42" class="term-body">• Irreversible pivot boundary hit</text>
    <text x="12" y="58" class="term-body">• Freeze ACB &amp; revoke credentials</text>
    <text x="12" y="74" class="term-body">• Snapshot WAL offset &amp; context</text>
    <text x="12" y="88" class="term-code" fill="#991b1b">acb.freeze(); alert_oncall()</text>
  </g>

</svg>
