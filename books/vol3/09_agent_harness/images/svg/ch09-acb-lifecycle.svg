<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <defs>
    <style>
      .region { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
      .st { font-size: 9.5px; font-weight: 700; }
      .sb { font-size: 8.5px; fill: #334155; }
      .tl { font-size: 8px; font-weight: 700; }
      .note { font-size: 8.5px; fill: #475569; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== Region: live states ===== -->
  <rect x="20" y="20" width="570" height="460" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="34" y="38" class="region" fill="#475569">LIVE STATES</text>

  <!-- ===== Region: exit ===== -->
  <rect x="610" y="20" width="330" height="460" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="624" y="38" class="region" fill="#475569">EXIT</text>

  <!-- ── PAUSED ── -->
  <rect x="60" y="50" width="180" height="60" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <rect x="60" y="50" width="180" height="22" rx="3" fill="#f1f5f9"/>
  <text x="70" y="65" class="st" fill="#334155">PAUSED</text>
  <text x="70" y="94" class="sb">Record kept; no model calls</text>

  <!-- ── READY ── -->
  <rect x="50" y="150" width="200" height="90" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="50" y="150" width="200" height="22" rx="3" fill="#e0f2fe"/>
  <text x="60" y="165" class="st" fill="#0369a1">READY</text>
  <text x="60" y="194" class="sb">Queued for its next model call</text>
  <text x="60" y="210" class="sb">Budget and pending control</text>
  <text x="60" y="224" class="sb">checked before each call</text>

  <!-- ── CALLING_MODEL ── -->
  <rect x="360" y="150" width="200" height="90" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="360" y="150" width="200" height="22" rx="3" fill="#e0f2fe"/>
  <text x="370" y="165" class="st" fill="#0369a1">CALLING_MODEL</text>
  <text x="370" y="194" class="sb">One call in flight</text>
  <text x="370" y="210" class="sb">Max output tokens, deadline</text>
  <text x="370" y="224" class="sb">Stream can be canceled</text>

  <!-- ── WAITING_TOOL ── -->
  <rect x="50" y="340" width="200" height="90" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <rect x="50" y="340" width="200" height="22" rx="3" fill="#fef3c7"/>
  <text x="60" y="355" class="st" fill="#b45309">WAITING_TOOL</text>
  <text x="60" y="384" class="sb">Pending call IDs and deadlines</text>
  <text x="60" y="400" class="sb">Job handles for long tools</text>
  <text x="60" y="414" class="sb">Holds no worker</text>

  <!-- ── AWAITING_APPROVAL ── -->
  <rect x="360" y="340" width="200" height="90" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="360" y="340" width="200" height="22" rx="3" fill="#fee2e2"/>
  <text x="370" y="355" class="st" fill="#b91c1c">AWAITING_APPROVAL</text>
  <text x="370" y="384" class="sb">Irreversible call held</text>
  <text x="370" y="400" class="sb">Request expires</text>
  <text x="370" y="414" class="sb">Preconditions re-checked</text>

  <!-- ── FINALIZING ── -->
  <rect x="650" y="150" width="250" height="90" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="650" y="150" width="250" height="22" rx="3" fill="#f3e8ff"/>
  <text x="660" y="165" class="st" fill="#6d28d9">FINALIZING</text>
  <text x="660" y="194" class="sb">Cancel open jobs, release leases</text>
  <text x="660" y="210" class="sb">Run the completion check</text>
  <text x="660" y="224" class="sb">Record the exit reason</text>

  <!-- ── Terminal states ── -->
  <rect x="630" y="330" width="90" height="60" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="630" y="330" width="90" height="22" rx="3" fill="#dcfce7"/>
  <text x="675" y="345" text-anchor="middle" class="st" fill="#15803d">COMPLETED</text>
  <text x="675" y="374" text-anchor="middle" class="sb">check passed</text>

  <rect x="730" y="330" width="90" height="60" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="730" y="330" width="90" height="22" rx="3" fill="#fee2e2"/>
  <text x="775" y="345" text-anchor="middle" class="st" fill="#b91c1c">FAILED</text>
  <text x="775" y="374" text-anchor="middle" class="sb">error or budget</text>

  <rect x="830" y="330" width="90" height="60" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <rect x="830" y="330" width="90" height="22" rx="3" fill="#f1f5f9"/>
  <text x="875" y="345" text-anchor="middle" class="st" fill="#334155">CANCELED</text>
  <text x="875" y="374" text-anchor="middle" class="sb">operator stop</text>

  <text x="775" y="420" text-anchor="middle" class="note">Terminal states are absorbing.</text>
  <text x="775" y="434" text-anchor="middle" class="note">A retry is a new trajectory.</text>

  <!-- ===== Transitions ===== -->

  <!-- READY -> PAUSED (pause) -->
  <path d="M 120 150 V 110" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="112" y="134" text-anchor="end" class="tl" fill="#475569">pause</text>
  <!-- PAUSED -> READY (resume) -->
  <path d="M 180 110 V 150" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="188" y="134" class="tl" fill="#475569">resume</text>

  <!-- READY -> CALLING_MODEL -->
  <path d="M 250 180 H 360" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="305" y="173" text-anchor="middle" class="tl" fill="#0369a1">call model</text>

  <!-- CALLING_MODEL -> READY (text reply or truncation) -->
  <path d="M 360 214 H 250" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="305" y="228" text-anchor="middle" class="tl" fill="#0369a1">no call to run</text>

  <!-- CALLING_MODEL -> WAITING_TOOL (granted call) -->
  <path d="M 410 240 V 290 H 200 V 340" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="305" y="284" text-anchor="middle" class="tl" fill="#b45309">granted tool call</text>

  <!-- CALLING_MODEL -> AWAITING_APPROVAL (irreversible call) -->
  <path d="M 520 240 V 340" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="528" y="286" class="tl" fill="#b91c1c">irreversible</text>
  <text x="528" y="297" class="tl" fill="#b91c1c">call</text>

  <!-- AWAITING_APPROVAL -> WAITING_TOOL (approved and re-checked) -->
  <path d="M 360 380 H 250" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="305" y="373" text-anchor="middle" class="tl" fill="#15803d">approved</text>

  <!-- WAITING_TOOL -> READY (matching result or timeout) -->
  <path d="M 100 340 V 240" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="108" y="282" class="tl" fill="#15803d">matching result</text>
  <text x="108" y="293" class="tl" fill="#15803d">or timeout</text>

  <!-- AWAITING_APPROVAL -> READY (denied or expired: REFUSED observation) -->
  <path d="M 460 430 V 454 H 34 V 196 H 50" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="250" y="470" text-anchor="middle" class="tl" fill="#b91c1c">denied, expired, or stale: REFUSED observation</text>

  <!-- CALLING_MODEL -> FINALIZING (end of turn) -->
  <path d="M 560 180 H 650" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="605" y="173" text-anchor="middle" class="tl" fill="#6d28d9">end_turn</text>

  <!-- Any live state -> FINALIZING (cancel, kill, budget exhausted) -->
  <path d="M 590 90 H 775 V 150" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="780" y="80" text-anchor="middle" class="tl" fill="#6d28d9">from any live state: cancel, kill, budget exhausted</text>

  <!-- FINALIZING -> terminals -->
  <path d="M 675 240 V 330" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M 775 240 V 330" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <path d="M 875 240 V 330" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
</svg>
