<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
  <defs>
    <style>
      .title { font-size: 12px; font-weight: 700; }
      .heading { font-size: 10px; font-weight: 700; }
      .label { font-size: 9.5px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 8.5px; fill: #475569; }
      .arrow-label { font-size: 8.5px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ===== Panel A: prototype loop ===== -->
  <g transform="translate(20, 14)">
    <rect x="0" y="0" width="920" height="172" rx="4" fill="#fff1f2" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="920" height="26" rx="4" fill="#fee2e2"/>
    <text x="14" y="17" class="title" fill="#b91c1c">(a) Prototype agent loop</text>

    <!-- ── Loop code ── -->
    <g transform="translate(16, 36)">
      <rect x="0" y="0" width="460" height="122" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="14" y="22" font-family="Courier New, monospace" font-size="9.5" font-weight="700" fill="#0f172a">while True:</text>
      <text x="30" y="42" font-family="Courier New, monospace" font-size="9.5" fill="#1e293b">reply = model.call(messages, tools)</text>
      <text x="30" y="62" font-family="Courier New, monospace" font-size="9.5" fill="#1e293b">if reply.stop_reason == "end_turn": break</text>
      <text x="30" y="82" font-family="Courier New, monospace" font-size="9.5" fill="#1e293b">result = run_tool(reply.tool_call)</text>
      <text x="30" y="102" font-family="Courier New, monospace" font-size="9.5" fill="#1e293b">messages.append(result)</text>
      <text x="300" y="82" font-family="Courier New, monospace" font-size="9.5" font-weight="700" fill="#dc2626"># no gate, no deadline</text>
      <text x="300" y="102" font-family="Courier New, monospace" font-size="9.5" font-weight="700" fill="#dc2626"># state lives only here</text>
    </g>

    <!-- ── What the loop cannot do ── -->
    <g transform="translate(490, 36)">
      <rect x="0" y="0" width="414" height="36" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="15" class="label" fill="#b91c1c">Cannot be stopped from outside</text>
      <text x="12" y="28" class="sub">Cancel and pause have nowhere to land</text>
      <rect x="0" y="43" width="414" height="36" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="58" class="label" fill="#b91c1c">No ceiling on turns, tokens, or dollars</text>
      <text x="12" y="71" class="sub">A loop that never converges keeps spending</text>
      <rect x="0" y="86" width="414" height="36" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="101" class="label" fill="#b91c1c">Irreversible calls run at once</text>
      <text x="12" y="114" class="sub">No approval step; progress dies with the process</text>
    </g>
  </g>

  <!-- ===== Panel B: harness ===== -->
  <g transform="translate(20, 198)">
    <rect x="0" y="0" width="920" height="226" rx="4" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="0" y="0" width="920" height="26" rx="4" fill="#f3e8ff"/>
    <text x="14" y="17" class="title" fill="#6d28d9">(b) The same loop inside a harness</text>

    <!-- ── Model ── -->
    <g transform="translate(16, 36)">
      <rect x="0" y="0" width="220" height="174" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="24" rx="3" fill="#e0f2fe"/>
      <text x="10" y="16" class="heading" fill="#0369a1">MODEL</text>
      <text x="10" y="46" class="label">Reads the assembled context</text>
      <text x="10" y="58" class="sub">Messages, tool definitions</text>
      <line x1="10" y1="68" x2="210" y2="68" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="10" y="84" class="label">Emits a proposal</text>
      <text x="10" y="96" class="sub">Text or tool calls, plus a stop reason</text>
      <rect x="10" y="114" width="200" height="44" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
      <text x="18" y="131" class="label" fill="#b91c1c">Proposes only</text>
      <text x="18" y="146" class="sub">Cannot dispatch, grant, or change status</text>
    </g>

    <!-- ── Model to harness ── -->
    <g transform="translate(242, 108)">
      <line x1="0" y1="0" x2="68" y2="0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <line x1="68" y1="20" x2="0" y2="20" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <text x="34" y="-6" class="arrow-label" fill="#0369a1">Proposal</text>
      <text x="34" y="34" class="arrow-label" fill="#0369a1">Context</text>
    </g>

    <!-- ── Harness ── -->
    <g transform="translate(318, 36)">
      <rect x="0" y="0" width="320" height="174" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
      <rect x="0" y="0" width="320" height="24" rx="3" fill="#f3e8ff"/>
      <text x="12" y="16" class="heading" fill="#6d28d9">HARNESS</text>
      <rect x="10" y="32" width="300" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="18" y="45" class="label">Trajectory record</text>
      <text x="18" y="56" class="sub">Status, budgets, grants, pending calls</text>
      <rect x="10" y="66" width="300" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="18" y="79" class="label">Guarded state transitions</text>
      <text x="18" y="90" class="sub">Late results and illegal resumes rejected</text>
      <rect x="10" y="100" width="300" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="18" y="113" class="label">Control actions and approval gates</text>
      <text x="18" y="124" class="sub">Cancel, pause, kill; irreversible calls held</text>
      <rect x="10" y="134" width="300" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="18" y="147" class="label">Budgets and ceilings</text>
      <text x="18" y="158" class="sub">Turns, tokens, wall-clock time, dollars</text>
    </g>

    <!-- ── Harness to tools ── -->
    <g transform="translate(644, 108)">
      <line x1="0" y1="0" x2="68" y2="0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
      <line x1="68" y1="20" x2="0" y2="20" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
      <text x="34" y="-6" class="arrow-label" fill="#b45309">Granted call</text>
      <text x="34" y="34" class="arrow-label" fill="#b45309">Observation</text>
    </g>

    <!-- ── Tools and sandbox ── -->
    <g transform="translate(720, 36)">
      <rect x="0" y="0" width="184" height="174" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
      <rect x="0" y="0" width="184" height="24" rx="3" fill="#fef3c7"/>
      <text x="10" y="16" class="heading" fill="#b45309">TOOLS AND SANDBOX</text>
      <rect x="8" y="32" width="168" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="16" y="47" class="label">Validated tool call</text>
      <text x="16" y="60" class="sub">Settled exactly once</text>
      <rect x="8" y="74" width="168" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="16" y="89" class="label">Isolation envelope</text>
      <text x="16" y="102" class="sub">Workspace leased per trajectory</text>
      <rect x="8" y="116" width="168" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="16" y="131" class="label">Egress policy</text>
      <text x="16" y="144" class="sub">Allowlisted destinations only</text>
    </g>
  </g>
</svg>
