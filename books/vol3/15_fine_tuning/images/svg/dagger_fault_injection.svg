<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="680" height="384" fill="#ffffff"/>

  <!-- ============================================================ -->
  <!-- Panel (a): errors measured on reference-policy states         -->
  <!-- ============================================================ -->
  <rect x="40" y="20" width="600" height="144" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="40" y="20" width="600" height="24" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="36" font-size="10" font-weight="700" fill="#0f172a">(a) Training on recorded reference-policy states</text>

  <!-- corpus coverage band -->
  <rect x="60" y="56" width="340" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="68" y="67" font-size="8" fill="#6d28d9">states in the corpus</text>

  <!-- reference path -->
  <g font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="80" y="72" width="50" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="105" y="89" font-style="italic">s<tspan font-size="7" dy="2">1</tspan></text>
    <rect x="160" y="72" width="50" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="185" y="89" font-style="italic">s<tspan font-size="7" dy="2">2</tspan></text>
    <rect x="240" y="72" width="50" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="265" y="89" font-style="italic">s<tspan font-size="7" dy="2">3</tspan></text>
    <text x="310" y="89" font-weight="400" fill="#64748b">&#183; &#183; &#183;</text>
    <rect x="330" y="72" width="50" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="355" y="89" font-style="italic">s<tspan font-size="7" dy="2">H</tspan></text>
  </g>
  <line x1="130" y1="85" x2="158" y2="85" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="210" y1="85" x2="238" y2="85" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- learner deviation into an uncovered state -->
  <path d="M185,98 V130 H218" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="179" y="122" text-anchor="end" font-size="8" fill="#b91c1c">learner deviates</text>
  <rect x="220" y="118" width="110" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="275" y="134" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">uncovered state</text>
  <line x1="330" y1="131" x2="348" y2="131" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-gray)"/>
  <rect x="350" y="118" width="110" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="1 2"/>
  <text x="405" y="134" text-anchor="middle" font-size="8.5" fill="#475569">no recorded correction</text>

  <!-- bound (a) -->
  <rect x="480" y="60" width="140" height="84" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="78" text-anchor="middle" font-size="8" fill="#475569">error measured on</text>
  <text x="550" y="89" text-anchor="middle" font-size="8" fill="#475569">reference states</text>
  <text x="550" y="112" text-anchor="middle" font-size="9.5" fill="#0f172a"><tspan font-style="italic">J</tspan>(<tspan font-style="italic">&#960;</tspan>) &#8722; <tspan font-style="italic">J</tspan>(<tspan font-style="italic">&#960;</tspan>*) &#8804;</text>
  <text x="550" y="130" text-anchor="middle" font-size="9.5" fill="#0f172a">min{<tspan font-style="italic">H</tspan>, <tspan font-style="italic">H</tspan><tspan font-size="7" dy="-4">2</tspan><tspan font-style="italic" dy="4">&#949;</tspan><tspan font-size="7" dy="2">E</tspan><tspan dy="-2">}</tspan></text>

  <!-- ============================================================ -->
  <!-- Panel (b): label states the learner visits                    -->
  <!-- ============================================================ -->
  <rect x="40" y="180" width="600" height="184" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="40" y="180" width="600" height="24" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="196" font-size="10" font-weight="700" fill="#0f172a">(b) Labeling learner-visited states, with fault injection</text>

  <!-- next-round feedback channel -->
  <path d="M571,236 V220 H101 V234" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <rect x="306" y="214" width="68" height="12" fill="#ffffff"/>
  <text x="340" y="223" text-anchor="middle" font-size="8" fill="#6d28d9">next round</text>

  <!-- loop boxes: x = 60 + 94 k, width 82 -->
  <g text-anchor="middle">
    <rect x="60" y="236" width="82" height="48" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="101" y="252" font-size="8.5" font-weight="700" fill="#0f172a">Run policy <tspan font-style="italic">&#960;</tspan><tspan font-size="6.5" dy="2">k</tspan></text>
    <text x="101" y="264" font-size="8.5" font-weight="700" fill="#0f172a">in sandbox</text>
    <text x="101" y="277" font-size="8" fill="#b45309">reference w.p. <tspan font-style="italic">&#946;</tspan><tspan font-size="6.5" dy="2">k</tspan></text>

    <rect x="154" y="236" width="82" height="48" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="195" y="252" font-size="8.5" font-weight="700" fill="#0f172a">Learner-visited</text>
    <text x="195" y="264" font-size="8.5" font-weight="700" fill="#0f172a">states</text>
    <text x="195" y="277" font-size="8" fill="#475569">plus injected faults</text>

    <rect x="248" y="236" width="82" height="48" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="289" y="252" font-size="8.5" font-weight="700" fill="#0f172a">Labeler</text>
    <text x="289" y="264" font-size="8.5" font-weight="700" fill="#0f172a">proposes</text>
    <text x="289" y="277" font-size="8" fill="#0369a1">corrective action</text>

    <rect x="342" y="236" width="82" height="48" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="383" y="252" font-size="8.5" font-weight="700" fill="#0f172a">Continue in</text>
    <text x="383" y="264" font-size="8.5" font-weight="700" fill="#0f172a">sandbox</text>
    <text x="383" y="277" font-size="8" fill="#b45309">verifier accepts?</text>

    <rect x="436" y="236" width="82" height="48" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="477" y="252" font-size="8.5" font-weight="700" fill="#0f172a">Aggregate</text>
    <text x="477" y="264" font-size="8.5" font-weight="700" fill="#0f172a">admitted labels</text>
    <text x="477" y="277" font-size="8" fill="#6d28d9"><tspan font-style="italic">D</tspan><tspan font-size="6.5" dy="2">k+1</tspan><tspan dx="2" dy="-2">=</tspan><tspan dx="2" font-style="italic">D</tspan><tspan font-size="6.5" dy="2">k</tspan><tspan dx="2" dy="-2">&#8746;</tspan><tspan dx="2">new</tspan></text>

    <rect x="530" y="236" width="82" height="48" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="571" y="258" font-size="8.5" font-weight="700" fill="#0f172a">Retrain</text>
    <text x="571" y="271" font-size="8.5" font-weight="700" fill="#0f172a"><tspan font-style="italic">&#960;</tspan><tspan font-size="6.5" dy="2">k+1</tspan></text>
  </g>
  <g stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)">
    <line x1="142" y1="260" x2="152" y2="260"/>
    <line x1="236" y1="260" x2="246" y2="260"/>
    <line x1="330" y1="260" x2="340" y2="260"/>
    <line x1="424" y1="260" x2="434" y2="260"/>
    <line x1="518" y1="260" x2="528" y2="260"/>
  </g>

  <!-- fault-injected record -->
  <line x1="195" y1="284" x2="195" y2="306" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-gray)"/>
  <text x="146" y="322" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">Fault-injected</text>
  <text x="146" y="333" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">record</text>
  <g text-anchor="middle">
    <rect x="154" y="308" width="82" height="36" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="195" y="322" font-size="8.5" font-weight="700" fill="#0f172a">injected error</text>
    <text x="195" y="336" font-size="8" fill="#b45309"><tspan font-style="italic">m</tspan><tspan font-size="6.5" dy="2">t</tspan><tspan dx="2" dy="-2">= 0</tspan></text>
    <rect x="240" y="308" width="82" height="36" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="281" y="322" font-size="8.5" font-weight="700" fill="#0f172a">diagnosis</text>
    <text x="281" y="336" font-size="8" fill="#0369a1"><tspan font-style="italic">m</tspan><tspan font-size="6.5" dy="2">t</tspan><tspan dx="2" dy="-2">= 1</tspan></text>
    <rect x="326" y="308" width="82" height="36" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="367" y="322" font-size="8.5" font-weight="700" fill="#0f172a">corrective call</text>
    <text x="367" y="336" font-size="8" fill="#0369a1"><tspan font-style="italic">m</tspan><tspan font-size="6.5" dy="2">t</tspan><tspan dx="2" dy="-2">= 1</tspan></text>
  </g>

  <!-- bound (b) -->
  <rect x="436" y="300" width="184" height="52" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="528" y="314" text-anchor="middle" font-size="8" fill="#475569">error on learner states; deviation cost &#8804; <tspan font-style="italic">u</tspan></text>
  <text x="528" y="338" text-anchor="middle" font-size="9.5" fill="#0f172a"><tspan font-style="italic">J</tspan>(<tspan font-style="italic">&#960;</tspan>) &#8722; <tspan font-style="italic">J</tspan>(<tspan font-style="italic">&#960;</tspan>*) &#8804; min{<tspan font-style="italic">H</tspan>, <tspan font-style="italic">uH&#949;</tspan><tspan font-size="7" dy="2">&#960;</tspan><tspan dy="-2">}</tspan></text>
</svg>
