<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="262" fill="#ffffff"/>

  <!-- ============================================================ -->
  <!-- Row labels                                                   -->
  <!-- ============================================================ -->
  <g font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="end">
    <text x="124" y="44">Serialized segment</text>
    <text x="124" y="99">Loss mask</text>
    <text x="124" y="129">Direct loss term</text>
    <text x="124" y="159">Context for later</text>
    <text x="124" y="169">selected targets</text>
  </g>

  <!-- ============================================================ -->
  <!-- Segment boxes (x = 136 + 86 i, width 82)                     -->
  <!-- ============================================================ -->
  <!-- 1 prompt and contracts: supplied -->
  <g transform="translate(136,20)">
    <rect width="82" height="54" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="41" y="18" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Prompt and</text>
    <text x="41" y="30" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">tool contracts</text>
    <text x="41" y="45" font-size="8" fill="#64748b" text-anchor="middle">supplied</text>
  </g>
  <!-- 2 task: supplied -->
  <g transform="translate(222,20)">
    <rect width="82" height="54" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="41" y="18" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Task</text>
    <text x="41" y="30" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">statement</text>
    <text x="41" y="45" font-size="8" fill="#64748b" text-anchor="middle">supplied</text>
  </g>
  <!-- 3 refused proposal: policy, unselected -->
  <g transform="translate(308,20)">
    <rect width="82" height="54" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="41" y="18" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Refused</text>
    <text x="41" y="30" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">proposal</text>
    <text x="41" y="45" font-size="8" fill="#64748b" text-anchor="middle">policy, unselected</text>
  </g>
  <!-- 4 rejection: observation -->
  <g transform="translate(394,20)">
    <rect width="82" height="54" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="41" y="18" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Rejection</text>
    <text x="41" y="30" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">message</text>
    <text x="41" y="45" font-size="8" fill="#b45309" text-anchor="middle">observation</text>
  </g>
  <!-- 5 corrected call: policy, selected -->
  <g transform="translate(480,20)">
    <rect width="82" height="54" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="41" y="18" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Corrected</text>
    <text x="41" y="30" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">tool call</text>
    <text x="41" y="45" font-size="8" fill="#0369a1" text-anchor="middle">policy, selected</text>
  </g>
  <!-- 6 tool result: observation -->
  <g transform="translate(566,20)">
    <rect width="82" height="54" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="41" y="18" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Tool</text>
    <text x="41" y="30" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">result</text>
    <text x="41" y="45" font-size="8" fill="#b45309" text-anchor="middle">observation</text>
  </g>
  <!-- 7 final response: policy, selected -->
  <g transform="translate(652,20)">
    <rect width="82" height="54" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="41" y="18" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Final response</text>
    <text x="41" y="30" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">and end token</text>
    <text x="41" y="45" font-size="8" fill="#0369a1" text-anchor="middle">policy, selected</text>
  </g>

  <!-- ============================================================ -->
  <!-- Mask row                                                     -->
  <!-- ============================================================ -->
  <g font-size="9.5" font-weight="700" text-anchor="middle">
    <rect x="136" y="84" width="82" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="177" y="99" fill="#64748b"><tspan font-style="italic">m</tspan><tspan font-size="7" dy="2">t</tspan><tspan dx="3" dy="-2">= 0</tspan></text>
    <rect x="222" y="84" width="82" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="263" y="99" fill="#64748b"><tspan font-style="italic">m</tspan><tspan font-size="7" dy="2">t</tspan><tspan dx="3" dy="-2">= 0</tspan></text>
    <rect x="308" y="84" width="82" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="349" y="99" fill="#64748b"><tspan font-style="italic">m</tspan><tspan font-size="7" dy="2">t</tspan><tspan dx="3" dy="-2">= 0</tspan></text>
    <rect x="394" y="84" width="82" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="435" y="99" fill="#64748b"><tspan font-style="italic">m</tspan><tspan font-size="7" dy="2">t</tspan><tspan dx="3" dy="-2">= 0</tspan></text>
    <rect x="480" y="84" width="82" height="22" rx="2" fill="#0369a1" stroke="#0369a1"/>
    <text x="521" y="99" fill="#ffffff"><tspan font-style="italic">m</tspan><tspan font-size="7" dy="2">t</tspan><tspan dx="3" dy="-2">= 1</tspan></text>
    <rect x="566" y="84" width="82" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="607" y="99" fill="#64748b"><tspan font-style="italic">m</tspan><tspan font-size="7" dy="2">t</tspan><tspan dx="3" dy="-2">= 0</tspan></text>
    <rect x="652" y="84" width="82" height="22" rx="2" fill="#0369a1" stroke="#0369a1"/>
    <text x="693" y="99" fill="#ffffff"><tspan font-style="italic">m</tspan><tspan font-size="7" dy="2">t</tspan><tspan dx="3" dy="-2">= 1</tspan></text>
  </g>

  <!-- ============================================================ -->
  <!-- Direct loss row                                              -->
  <!-- ============================================================ -->
  <g font-size="8.5" text-anchor="middle">
    <text x="177" y="129" fill="#94a3b8">none</text>
    <text x="263" y="129" fill="#94a3b8">none</text>
    <text x="349" y="129" fill="#94a3b8">none</text>
    <text x="435" y="129" fill="#94a3b8">none</text>
    <rect x="480" y="114" width="82" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="521" y="129" fill="#0369a1" font-weight="700">imitated</text>
    <text x="607" y="129" fill="#94a3b8">none</text>
    <rect x="652" y="114" width="82" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="693" y="129" fill="#0369a1" font-weight="700">imitated</text>
  </g>

  <!-- ============================================================ -->
  <!-- Context row: every segment is read; gradients of later       -->
  <!-- selected losses reach it through attention                   -->
  <!-- ============================================================ -->
  <g font-size="8.5" text-anchor="middle" fill="#15803d">
    <rect x="136" y="148" width="512" height="22" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <text x="392" y="163">read through attention; updated by gradients of later selected targets</text>
    <rect x="652" y="148" width="82" height="22" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <text x="693" y="163">within response</text>
  </g>

  <!-- ============================================================ -->
  <!-- Two authors                                                  -->
  <!-- ============================================================ -->
  <line x1="20" y1="188" x2="740" y2="188" stroke="#cbd5e1" stroke-width="1"/>

  <g transform="translate(136,200)">
    <rect width="290" height="44" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect width="290" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="10" y="13" font-size="9" font-weight="700" fill="#0369a1">Selected targets fit the policy</text>
    <text x="145" y="35" font-size="10" fill="#0f172a" text-anchor="middle" font-style="italic">π<tspan font-size="7.5" dy="2">θ</tspan><tspan dy="-2">(a</tspan><tspan font-size="7.5" dy="2">t</tspan><tspan dx="3" dy="-2">| s</tspan><tspan font-size="7.5" dy="2">t</tspan><tspan dy="-2">)</tspan></text>
  </g>
  <g transform="translate(444,200)">
    <rect width="290" height="44" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect width="290" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="10" y="13" font-size="9" font-weight="700" fill="#b45309">Unmasked observations would fit the environment</text>
    <text x="145" y="35" font-size="10" fill="#0f172a" text-anchor="middle" font-style="italic">p(s<tspan font-size="7.5" dy="2">t+1</tspan><tspan dx="3" dy="-2">| s</tspan><tspan font-size="7.5" dy="2">t</tspan><tspan dy="-2">, a</tspan><tspan font-size="7.5" dy="2">t</tspan><tspan dy="-2">)</tspan></text>
  </g>
  <text x="124" y="226" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="end">Two authors</text>
</svg>
