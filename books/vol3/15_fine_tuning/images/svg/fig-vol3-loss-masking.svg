<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="720" height="336" fill="#ffffff"/>

  <!-- ===== Author lanes: one row per author, columns in serialized order ===== -->
  <!-- columns: x = 136 + 80 i, width 74 -->
  <g stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3">
    <line x1="20" y1="82" x2="700" y2="82"/>
    <line x1="20" y1="148" x2="700" y2="148"/>
    <line x1="20" y1="214" x2="700" y2="214"/>
  </g>

  <!-- lane labels -->
  <g fill="#0f172a">
    <text x="20" y="54" font-size="13" font-weight="700">Supplied</text>
    <text x="20" y="110" font-size="13" font-weight="700" fill="#0369a1">Policy</text>
    <text x="20" y="128" font-size="14"><tspan font-style="italic">&#960;</tspan><tspan font-size="11.5" dy="3">&#952;</tspan><tspan dy="-3">(</tspan><tspan font-style="italic">a</tspan><tspan font-size="11.5" font-style="italic" dy="3">t</tspan><tspan dy="-3">&#8201;|&#8201;</tspan><tspan font-style="italic">s</tspan><tspan font-size="11.5" font-style="italic" dy="3">t</tspan><tspan dy="-3">)</tspan></text>
    <text x="20" y="176" font-size="13" font-weight="700" fill="#b45309">Environment</text>
    <text x="20" y="196" font-size="14"><tspan font-style="italic">p</tspan>(<tspan font-style="italic">s</tspan><tspan font-size="11.5" font-style="italic" dy="3">t</tspan><tspan font-size="11.5" dy="0">+1</tspan><tspan dy="-3">&#8201;|&#8201;</tspan><tspan font-style="italic">s</tspan><tspan font-size="11.5" font-style="italic" dy="3">t</tspan><tspan dy="-3">,&#8201;</tspan><tspan font-style="italic">a</tspan><tspan font-size="11.5" font-style="italic" dy="3">t</tspan><tspan dy="-3">)</tspan></text>
  </g>

  <!-- ===== Segments ===== -->
  <g font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    <!-- 0 prompt and contracts: supplied -->
    <rect x="136" y="26" width="74" height="44" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="173" y="44">Prompt and</text>
    <text x="173" y="60">contracts</text>
    <!-- 1 task statement: supplied -->
    <rect x="216" y="26" width="74" height="44" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="253" y="44">Task</text>
    <text x="253" y="60">statement</text>
    <!-- 2 refused proposal: policy, not selected -->
    <rect x="296" y="92" width="74" height="44" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="333" y="110" font-weight="400" fill="#0369a1">Refused</text>
    <text x="333" y="126" font-weight="400" fill="#0369a1">proposal</text>
    <!-- 3 rejection message: environment -->
    <rect x="376" y="158" width="74" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="413" y="176">Rejection</text>
    <text x="413" y="192">message</text>
    <!-- 4 corrected tool call: policy, selected -->
    <rect x="456" y="92" width="74" height="44" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="493" y="110">Corrected</text>
    <text x="493" y="126">tool call</text>
    <!-- 5 tool result: environment -->
    <rect x="536" y="158" width="74" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="573" y="176">Tool</text>
    <text x="573" y="192">result</text>
    <!-- 6 final response: policy, selected -->
    <rect x="616" y="92" width="74" height="44" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="653" y="110">Final</text>
    <text x="653" y="126">response</text>
  </g>

  <!-- ===== Loss mask strip ===== -->
  <text x="20" y="245" font-size="13" font-weight="700" fill="#0f172a">Loss mask <tspan font-weight="400" font-style="italic">m</tspan><tspan font-weight="400" font-size="11.5" font-style="italic" dy="3">t</tspan></text>
  <g stroke-width="1.2">
    <rect x="136" y="226" width="74" height="28" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="216" y="226" width="74" height="28" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="296" y="226" width="74" height="28" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="376" y="226" width="74" height="28" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="456" y="226" width="74" height="28" fill="#0284c7" stroke="#0284c7"/>
    <rect x="536" y="226" width="74" height="28" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="616" y="226" width="74" height="28" fill="#0284c7" stroke="#0284c7"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="173" y="245" fill="#64748b">0</text>
    <text x="253" y="245" fill="#64748b">0</text>
    <text x="333" y="245" fill="#64748b">0</text>
    <text x="413" y="245" fill="#64748b">0</text>
    <text x="493" y="245" fill="#ffffff">1</text>
    <text x="573" y="245" fill="#64748b">0</text>
    <text x="653" y="245" fill="#ffffff">1</text>
  </g>

  <!-- ===== Gradient path back through attention ===== -->
  <text x="20" y="289" font-size="13" font-weight="700" fill="#0f172a">Attention</text>
  <g stroke="#16a34a" stroke-width="1.5" fill="none">
    <path d="M493,254 V284"/>
    <path d="M653,254 V284 H140" marker-end="url(#arr-green)"/>
  </g>
  <g fill="#ffffff" stroke="#16a34a" stroke-width="1.2">
    <circle cx="173" cy="284" r="3.5"/>
    <circle cx="253" cy="284" r="3.5"/>
    <circle cx="333" cy="284" r="3.5"/>
    <circle cx="413" cy="284" r="3.5"/>
    <circle cx="573" cy="284" r="3.5"/>
  </g>
  <text x="413" y="310" font-size="12" fill="#15803d" text-anchor="middle">gradients from selected targets reach every earlier segment</text>
</svg>
