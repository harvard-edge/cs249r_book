<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #475569; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9.5px; fill: #1e293b; }
      .text-mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #0f172a; }
      .text-arrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="440" class="bg"/>

  <!-- ================================================================= -->
  <!-- PANEL A: UNMANAGED MONOLITHIC SCRIPTING LOOP                      -->
  <!-- ================================================================= -->
  <g transform="translate(20, 14)">
    <rect x="0" y="0" width="920" height="172" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="0" y="0" width="920" height="26" rx="4" fill="#ffe4e6"/>
    <text x="14" y="17" class="text-title" fill="#9f1239">(a) Unmanaged Monolithic Scripting Loop (Anti-Pattern)</text>

    <!-- Loop Code Block -->
    <g transform="translate(16, 36)">
      <rect x="0" y="0" width="460" height="122" rx="3" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
      <text x="14" y="24" class="text-mono-bold">while True:</text>
      <text x="30" y="46" class="text-mono">1. response = model.generate(prompt, history)</text>
      <text x="30" y="68" class="text-mono">2. tool_call = parse_json(response)</text>
      <text x="30" y="90" class="text-mono">3. result = exec_system_cmd(tool_call)  <tspan fill="#dc2626" font-weight="600"># Direct host access</tspan></text>
      <text x="30" y="112" class="text-mono">4. history.append(result)               <tspan fill="#dc2626" font-weight="600"># Volatile heap only</tspan></text>
    </g>

    <!-- Vulnerability Annotations -->
    <g transform="translate(490, 36)">
      <!-- Box 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="414" height="36" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <text x="12" y="15" class="text-label" fill="#b91c1c">Unmonitored Model Stalls &amp; Rate Limits</text>
        <text x="12" y="28" class="text-sub">HTTP 429/503 or dropped network sockets block the entire host process indefinitely.</text>
      </g>
      <!-- Box 2 -->
      <g transform="translate(0, 43)">
        <rect x="0" y="0" width="414" height="36" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <text x="12" y="15" class="text-label" fill="#b91c1c">Ambient Authority &amp; Unconfined Side-Effects</text>
        <text x="12" y="28" class="text-sub">Tool code executes directly in host user-space with inherited filesystem and network credentials.</text>
      </g>
      <!-- Box 3 -->
      <g transform="translate(0, 86)">
        <rect x="0" y="0" width="414" height="36" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <text x="12" y="15" class="text-label" fill="#b91c1c">Volatile Trajectory State &amp; Process Leaks</text>
        <text x="12" y="28" class="text-sub">Interpreter crash destroys all execution context; child processes are orphaned without cleanup.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: LAYERED AGENT OS SUPERVISORY CONTROL PLANE               -->
  <!-- ================================================================= -->
  <g transform="translate(20, 198)">
    <rect x="0" y="0" width="920" height="226" rx="4" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="920" height="26" rx="4" fill="#e0f2fe"/>
    <text x="14" y="17" class="text-title" fill="#0369a1">(b) Agent OS Supervisory Control Plane (Managed Invariant Architecture)</text>

    <!-- Subsystem 1: Stochastic Model Core (Unprivileged) -->
    <g transform="translate(16, 36)">
      <rect x="0" y="0" width="220" height="174" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="24" rx="3" fill="#eff6ff"/>
      <text x="10" y="16" class="text-heading" fill="#1d4ed8">STOCHASTIC CORE (A = 0)</text>

      <g transform="translate(10, 36)">
        <text x="0" y="10" class="text-label">Autoregressive Generator</text>
        <text x="0" y="22" class="text-sub">Samples next action token-by-token</text>
        
        <line x1="0" y1="32" x2="200" y2="32" stroke="#e2e8f0" stroke-width="0.8"/>
        
        <text x="0" y="48" class="text-label">Grammar Masking Engine</text>
        <text x="0" y="60" class="text-sub">Enforces FSM schema constraints</text>

        <line x1="0" y1="70" x2="200" y2="70" stroke="#e2e8f0" stroke-width="0.8"/>

        <rect x="0" y="78" width="200" height="38" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
        <text x="8" y="93" class="text-label" fill="#b91c1c">Zero Direct Host Access</text>
        <text x="8" y="106" class="text-sub" fill="#7f1d1d">No raw sockets, no local file descriptors</text>
      </g>
    </g>

    <!-- IPC Channel 1: Core <-> Supervisor -->
    <g transform="translate(242, 108)">
      <line x1="0" y1="0" x2="68" y2="0" stroke="#0284c7" stroke-width="1.6" marker-end="url(#arr-blue)"/>
      <line x1="68" y1="20" x2="0" y2="20" stroke="#0284c7" stroke-width="1.6" marker-end="url(#arr-blue)"/>
      <text x="34" y="-5" class="text-arrow" fill="#0284c7">Proposal a_k</text>
      <text x="34" y="32" class="text-arrow" fill="#0284c7">Context c_k</text>
    </g>

    <!-- Subsystem 2: Supervisory Runtime Kernel -->
    <g transform="translate(318, 36)">
      <rect x="0" y="0" width="320" height="174" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="320" height="24" rx="3" fill="#e0f2fe"/>
      <text x="12" y="16" class="text-heading" fill="#0369a1">SUPERVISORY RUNTIME KERNEL</text>

      <!-- 4 Pillars -->
      <g transform="translate(10, 32)">
        <rect x="0" y="0" width="300" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" class="text-label">1. Agent Control Block (ACB) &amp; Lifecycle</text>
        <text x="8" y="24" class="text-sub">Formal statechart: RUNNABLE, WAITING_IO, WAITING_ESCROW</text>
      </g>
      <g transform="translate(10, 66)">
        <rect x="0" y="0" width="300" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" class="text-label">2. Transactional Write-Ahead Log (WAL)</text>
        <text x="8" y="24" class="text-sub">Fsync action snapshot to durable store prior to side effects</text>
      </g>
      <g transform="translate(10, 100)">
        <rect x="0" y="0" width="300" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" class="text-label">3. Multi-Dimensional Metering &amp; Watchdogs</text>
        <text x="8" y="24" class="text-sub">Hardware timers, token rate limiters, financial cost ceilings</text>
      </g>
      <g transform="translate(10, 134)">
        <rect x="0" y="0" width="300" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" class="text-label">4. Signal Traps &amp; Complete Mediation</text>
        <text x="8" y="24" class="text-sub">Intercept SIGINT, SIGPAUSE, SIGBUDGET at turn boundaries</text>
      </g>
    </g>

    <!-- IPC Channel 2: Supervisor <-> Sandbox -->
    <g transform="translate(644, 108)">
      <line x1="0" y1="0" x2="68" y2="0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
      <line x1="68" y1="20" x2="0" y2="20" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
      <text x="34" y="-5" class="text-arrow" fill="#15803d">Capability RPC</text>
      <text x="34" y="32" class="text-arrow" fill="#15803d">Observation o_k</text>
    </g>

    <!-- Subsystem 3: Sandboxed Execution Ring -->
    <g transform="translate(720, 36)">
      <rect x="0" y="0" width="184" height="174" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect x="0" y="0" width="184" height="24" rx="3" fill="#f0fdf4"/>
      <text x="10" y="16" class="text-heading" fill="#15803d">SANDBOX EXECUTION RING</text>

      <g transform="translate(8, 32)">
        <rect x="0" y="0" width="168" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="15" class="text-label">MicroVM / Container</text>
        <text x="8" y="28" class="text-sub">Seccomp + Jailer isolation</text>
      </g>
      <g transform="translate(8, 74)">
        <rect x="0" y="0" width="168" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="15" class="text-label">Ephemeral Scratchpad</text>
        <text x="8" y="28" class="text-sub">Copy-on-write rootfs snapshot</text>
      </g>
      <g transform="translate(8, 116)">
        <rect x="0" y="0" width="168" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="15" class="text-label">Network Egress Filter</text>
        <text x="8" y="28" class="text-sub">Strict DNS &amp; IP allowlist</text>
      </g>
    </g>
  </g>
</svg>
