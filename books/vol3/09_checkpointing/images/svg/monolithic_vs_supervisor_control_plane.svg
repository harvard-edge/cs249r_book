<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e40af"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="940" height="480" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: UNMANAGED MONOLITHIC SCRIPTING LOOP                      -->
  <!-- ================================================================= -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="860" height="180" rx="3" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="0" y="0" width="860" height="28" rx="3" fill="#ffe4e6"/>
    <text x="14" y="19" font-size="11" font-weight="700" fill="#9f1239">(a) Unmanaged Monolithic Scripting Loop (Anti-Pattern)</text>

    <!-- Loop Code Block -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="480" height="118" rx="2" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
      <text x="14" y="24" font-family="Courier, monospace" font-size="10.5" font-weight="700" fill="#0f172a">while True:</text>
      <text x="28" y="46" font-family="Courier, monospace" font-size="9.5" fill="#334155">response = model.generate(prompt, history)</text>
      <text x="28" y="68" font-family="Courier, monospace" font-size="9.5" fill="#334155">tool_call = parse_json(response)</text>
      <text x="28" y="90" font-family="Courier, monospace" font-size="9.5" fill="#334155">result = exec_system_cmd(tool_call)</text>
      <text x="28" y="110" font-family="Courier, monospace" font-size="9.5" fill="#334155">history.append(result)</text>
    </g>

    <!-- Vulnerability Annotations -->
    <g transform="translate(520, 42)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="320" height="34" rx="2" fill="#ffffff" stroke="#f87171" stroke-width="0.8"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#b91c1c">Unmonitored Model Stalls</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">HTTP 429/503 or dropped connection stalls entire process</text>

      <!-- Box 2 -->
      <rect x="0" y="42" width="320" height="34" rx="2" fill="#ffffff" stroke="#f87171" stroke-width="0.8"/>
      <text x="10" y="57" font-size="8.5" font-weight="700" fill="#b91c1c">Blocking Side-Effects &amp; Ambience</text>
      <text x="10" y="69" font-size="7.5" fill="#475569">Tool execution runs unconfined with direct host privileges</text>

      <!-- Box 3 -->
      <rect x="0" y="84" width="320" height="34" rx="2" fill="#ffffff" stroke="#f87171" stroke-width="0.8"/>
      <text x="10" y="99" font-size="8.5" font-weight="700" fill="#b91c1c">Volatile Trajectory State</text>
      <text x="10" y="111" font-size="7.5" fill="#475569">Process crash destroys complete execution history (No WAL)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: LAYERED AGENT OS SUPERVISORY RUNTIME                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 226)">
    <rect x="0" y="0" width="860" height="230" rx="3" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="860" height="28" rx="3" fill="#e0f2fe"/>
    <text x="14" y="19" font-size="11" font-weight="700" fill="#0369a1">(b) Agent OS Supervisory Control Plane (Managed Invariant Architecture)</text>

    <!-- Subsystem 1: Stochastic Core -->
    <g transform="translate(20, 46)">
      <rect x="0" y="0" width="230" height="162" rx="2" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
      <rect x="0" y="0" width="230" height="24" fill="#f0f9ff"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#0284c7">STOCHASTIC CORE (UNPRIVILEGED)</text>
      
      <text x="12" y="44" font-size="8.5" font-weight="600" fill="#1e293b">Autoregressive Generator</text>
      <text x="12" y="58" font-size="7.5" fill="#64748b">Proposes action candidate (a_prop)</text>
      
      <line x1="12" y1="72" x2="218" y2="72" stroke="#e2e8f0" stroke-width="0.8"/>
      
      <text x="12" y="92" font-size="8.5" font-weight="600" fill="#1e293b">Grammar Masking Engine</text>
      <text x="12" y="106" font-size="7.5" fill="#64748b">FSM dynamic logit constraint</text>

      <line x1="12" y1="120" x2="218" y2="120" stroke="#e2e8f0" stroke-width="0.8"/>

      <text x="12" y="140" font-size="8" font-weight="700" fill="#b91c1c">Zero Direct Host Access</text>
      <text x="12" y="152" font-size="7.5" fill="#475569">No sockets, no file handles</text>
    </g>

    <!-- IPC Bus Arrows -->
    <g transform="translate(255, 110)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <line x1="40" y1="18" x2="0" y2="18" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <text x="20" y="-6" font-size="7.5" font-weight="700" fill="#0284c7" text-anchor="middle">Proposal</text>
      <text x="20" y="32" font-size="7.5" font-weight="700" fill="#0284c7" text-anchor="middle">Observation</text>
    </g>

    <!-- Subsystem 2: Supervisory Kernel Control Plane -->
    <g transform="translate(300, 46)">
      <rect x="0" y="0" width="310" height="162" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <rect x="0" y="0" width="310" height="24" fill="#e0f2fe"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#0369a1">SUPERVISORY RUNTIME KERNEL</text>

      <!-- 4 Pillars -->
      <g transform="translate(10, 32)">
        <rect x="0" y="0" width="290" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="17" font-size="8" font-weight="700" fill="#1e293b">1. Resource Metering: <tspan font-weight="400" fill="#64748b">Enforce cost, token, wall-clock limits</tspan></text>
      </g>
      <g transform="translate(10, 62)">
        <rect x="0" y="0" width="290" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="17" font-size="8" font-weight="700" fill="#1e293b">2. Heartbeat Watchdogs: <tspan font-weight="400" fill="#64748b">Detect infinite loops, stall traps</tspan></text>
      </g>
      <g transform="translate(10, 92)">
        <rect x="0" y="0" width="290" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="17" font-size="8" font-weight="700" fill="#1e293b">3. Transactional WAL: <tspan font-weight="400" fill="#64748b">fsync authorization before side effects</tspan></text>
      </g>
      <g transform="translate(10, 122)">
        <rect x="0" y="0" width="290" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="17" font-size="8" font-weight="700" fill="#1e293b">4. Signal Intercept: <tspan font-weight="400" fill="#64748b">Trap SIGINT, SIGTERM, ESCROW pause</tspan></text>
      </g>
    </g>

    <!-- Capability Dispatch Arrows -->
    <g transform="translate(615, 110)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-gray)"/>
      <line x1="35" y1="18" x2="0" y2="18" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-gray)"/>
      <text x="17" y="-6" font-size="7.5" font-weight="700" fill="#16a34a" text-anchor="middle">Capability RPC</text>
      <text x="17" y="32" font-size="7.5" font-weight="700" fill="#16a34a" text-anchor="middle">Verified Result</text>
    </g>

    <!-- Subsystem 3: Sandboxed Execution Ring -->
    <g transform="translate(655, 46)">
      <rect x="0" y="0" width="185" height="162" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <rect x="0" y="0" width="185" height="24" fill="#dcfce7"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#15803d">SANDBOX EXECUTION RING</text>

      <g transform="translate(10, 34)">
        <rect x="0" y="0" width="165" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="15" font-size="8" font-weight="700" fill="#1e293b">Firecracker MicroVM</text>
        <text x="8" y="27" font-size="7.5" fill="#64748b">Seccomp + Jailer isolation</text>
      </g>

      <g transform="translate(10, 74)">
        <rect x="0" y="0" width="165" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="15" font-size="8" font-weight="700" fill="#1e293b">Ephemeral Scratchpad</text>
        <text x="8" y="27" font-size="7.5" fill="#64748b">Copy-on-write rootfs</text>
      </g>

      <g transform="translate(10, 114)">
        <rect x="0" y="0" width="165" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="15" font-size="8" font-weight="700" fill="#1e293b">Network Firewall</text>
        <text x="8" y="27" font-size="7.5" fill="#64748b">Strict egress allowlist</text>
      </g>
    </g>
  </g>
</svg>
