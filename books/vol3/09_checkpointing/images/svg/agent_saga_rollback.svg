<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- TOP: FORWARD TRAJECTORY EXECUTION                                 -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="880" height="150" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">FORWARD TRAJECTORY EXECUTION: T₁ → T₂ → T₃ → T₄ (FAILED)</text>
    
    <!-- Badge -->
    <rect x="768" y="4" width="102" height="16" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="819" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">FORWARD SAGA</text>

    <!-- Step T1 -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="180" height="104" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="8" width="56" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="36" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">STEP T₁</text>
      <text x="70" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Git Scratch Branch</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">Creates git worktree branch</text>
      <text x="10" y="58" font-size="8.0" fill="#334155">Registers compensating C₁</text>
      <rect x="8" y="74" width="164" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="90" y="88" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">✓ CHECKPOINT SAVED</text>
    </g>

    <!-- Arrow T1 -> T2 -->
    <line x1="196" y1="86" x2="224" y2="86" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Step T2 -->
    <g transform="translate(228, 34)">
      <rect x="0" y="0" width="180" height="104" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="8" width="56" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="36" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">STEP T₂</text>
      <text x="70" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Reserve Cloud VM</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">Provisions AWS EC2 instance</text>
      <text x="10" y="58" font-size="8.0" fill="#334155">Registers compensating C₂</text>
      <rect x="8" y="74" width="164" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="90" y="88" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">✓ CHECKPOINT SAVED</text>
    </g>

    <!-- Arrow T2 -> T3 -->
    <line x1="412" y1="86" x2="440" y2="86" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Step T3 -->
    <g transform="translate(444, 34)">
      <rect x="0" y="0" width="180" height="104" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="8" width="56" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="36" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">STEP T₃</text>
      <text x="70" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Stripe Auth Hold</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">Authorizes $50 compute fee</text>
      <text x="10" y="58" font-size="8.0" fill="#334155">Registers compensating C₃</text>
      <rect x="8" y="74" width="164" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="90" y="88" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">✓ CHECKPOINT SAVED</text>
    </g>

    <!-- Arrow T3 -> T4 -->
    <line x1="628" y1="86" x2="656" y2="86" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

    <!-- Step T4 (Failed) -->
    <g transform="translate(660, 34)">
      <rect x="0" y="0" width="208" height="104" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="8" y="8" width="56" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="36" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">STEP T₄</text>
      <text x="70" y="20" font-size="8.5" font-weight="700" fill="#991b1b">Deploy &amp; Execute</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">Docker run fails in microVM</text>
      <text x="10" y="58" font-size="8.0" fill="#b91c1c">Exit Code: 137 (OOM killed)</text>
      <rect x="8" y="74" width="192" height="22" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="104" y="88" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">✗ VERIFICATION FAILED</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CENTER: SAGA COORDINATOR BAND                                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 234)">
    <rect x="0" y="0" width="880" height="38" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="160" height="38" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="23" font-size="8.5" font-weight="700" fill="#0f172a">SAGA COORDINATOR</text>

    <text x="175" y="23" font-size="8" fill="#334155">Traps failure on T₄. Halts forward progress. Invokes reverse compensating sequence: C₃ → C₂ → C₁</text>

    <!-- Initiate Rollback Badge -->
    <rect x="740" y="8" width="130" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="805" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">INITIATE ROLLBACK</text>
  </g>

  <!-- Flow Connectors: T4 Failure down to Coordinator -->
  <line x1="804" y1="212" x2="804" y2="234" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Coordinator down to C3 Compensating Action -->
  <path d="M 804,272 L 804,360 L 656,360" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- ================================================================= -->
  <!-- BOTTOM: BACKWARD COMPENSATING ACTIONS                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 282)">
    <rect x="0" y="0" width="880" height="150" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">BACKWARD COMPENSATING ACTIONS: C₃ → C₂ → C₁ (DETERMINISTIC CODE HANDLERS)</text>

    <!-- Badge -->
    <rect x="756" y="4" width="114" height="16" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="813" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">REVERSE RECOVERY</text>

    <!-- Action C1 -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="180" height="104" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="8" width="62" height="16" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="39" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">ACTION C₁</text>
      <text x="76" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Clean Git Scratch</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">git worktree remove -f</text>
      <text x="10" y="58" font-size="8.0" fill="#334155">Prunes dangling branches</text>
      <rect x="8" y="74" width="164" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="90" y="88" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">✓ WORKTREE PURGED</text>
    </g>

    <!-- Arrow C2 -> C1 (pointing left) -->
    <line x1="228" y1="86" x2="200" y2="86" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>

    <!-- Action C2 -->
    <g transform="translate(232, 34)">
      <rect x="0" y="0" width="180" height="104" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="8" width="62" height="16" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="39" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">ACTION C₂</text>
      <text x="76" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Terminate Cloud VM</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">Invokes: ec2.Terminate()</text>
      <text x="10" y="58" font-size="8.0" fill="#334155">Releases IP &amp; EBS storage</text>
      <rect x="8" y="74" width="164" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="90" y="88" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">✓ INSTANCE TERMINATED</text>
    </g>

    <!-- Arrow C3 -> C2 (pointing left) -->
    <line x1="448" y1="86" x2="420" y2="86" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>

    <!-- Action C3 -->
    <g transform="translate(452, 34)">
      <rect x="0" y="0" width="196" height="104" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="8" width="62" height="16" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="39" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">ACTION C₃</text>
      <text x="76" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Release Stripe Auth</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">Invokes: stripe.Refund()</text>
      <text x="10" y="58" font-size="8.0" fill="#334155">Idempotency key verified</text>
      <rect x="8" y="74" width="180" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="88" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">✓ HOLD RELEASED ($0)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- FOOTER: KEY ARCHITECTURAL INVARIANT                               -->
  <!-- ================================================================= -->
  <g transform="translate(40, 444)">
    <rect x="0" y="0" width="880" height="66" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0f172a">KEY ARCHITECTURAL INVARIANT: COMPENSATING ACTIONS MUST BE DETERMINISTIC CODE, NEVER PROMPTED LLM TEXT</text>
    <text x="12" y="38" font-size="8" fill="#334155">Prompting a failing model to "undo" an action triggers hallucination compounding. Compensating actions (A⁻¹) must be pre-compiled,</text>
    <text x="12" y="52" font-size="8" fill="#334155">idempotent API handlers registered in advance at forward action dispatch.</text>
  </g>
</g>
</svg>