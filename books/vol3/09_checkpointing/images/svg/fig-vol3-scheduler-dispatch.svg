<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 45 880 425" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .box-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; }
      .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #0f172a; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-green { stroke: #059669; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green-m); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red-m); }
      .line-green { stroke: #059669; stroke-width: 1.5; fill: none; }
      .line-red { stroke: #dc2626; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-green-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-red-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect y="45" width="880" height="425" class="bg" />


  <!-- Level 1: Scheduler Run Queue -->
  <g transform="translate(240, 75)">
    <rect x="0" y="0" width="400" height="75" rx="5" class="box" />
    <text x="200" y="24" class="label" text-anchor="middle">Scheduler Run Queue (Host DRAM)</text>
    <line x1="0" y1="34" x2="400" y2="34" stroke="#cbd5e1" stroke-width="1" />

    <!-- ACB elements -->
    <g transform="translate(45, 44)">
      <rect x="0" y="0" width="90" height="22" rx="3" fill="#f1f5f9" stroke="#64748b" />
      <text x="45" y="15" class="mono" text-anchor="middle" font-size="11">ACB_1 (p1)</text>

      <rect x="110" y="0" width="90" height="22" rx="3" fill="#f1f5f9" stroke="#64748b" />
      <text x="155" y="15" class="mono" text-anchor="middle" font-size="11">ACB_4 (p2)</text>

      <rect x="220" y="0" width="90" height="22" rx="3" fill="#f1f5f9" stroke="#64748b" />
      <text x="265" y="15" class="mono" text-anchor="middle" font-size="11">ACB_7 (p1)</text>
    </g>
  </g>

  <!-- Connector 1 -->
  <line x1="440" y1="150" x2="440" y2="185" class="arrow" />
  <rect x="448" y="158" width="165" height="18" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="454" y="171" class="mono" font-size="10" fill="#475569">filter(phase == RUNNABLE)</text>

  <!-- Level 2: Priority Scoring Engine -->
  <g transform="translate(240, 185)">
    <rect x="0" y="0" width="400" height="75" rx="5" class="box-blue" />
    <text x="200" y="24" class="label" fill="#0369a1" text-anchor="middle">Priority Scoring Engine</text>
    <line x1="0" y1="34" x2="400" y2="34" stroke="#bae6fd" stroke-width="1" />
    <text x="200" y="52" class="mono" text-anchor="middle">P_i = f(tokens, cost, wall_clock, SLO)</text>
    <text x="200" y="66" class="subtext" text-anchor="middle">Promotes trajectories furthest from SLO deficit</text>
  </g>

  <!-- Split lines from Scoring Engine -->
  <path d="M 440 260 L 440 288 L 220 288 L 220 308" class="line-green" />
  <path d="M 440 260 L 440 288 L 660 288 L 660 308" class="line-red" />

  <!-- Decision badges -->
  <rect x="110" y="308" width="220" height="24" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
  <text x="220" y="324" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">Passes Caps: tokens &lt; T_max</text>

  <rect x="550" y="308" width="220" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1" />
  <text x="660" y="324" class="mono" font-size="10.5" fill="#991b1b" text-anchor="middle">Violates Limit: tokens ≥ T_max</text>

  <!-- Final descent arrows into Level 3 -->
  <line x1="220" y1="332" x2="220" y2="355" class="arrow-green" />
  <line x1="660" y1="332" x2="660" y2="355" class="arrow-red" />

  <!-- Level 3 Left: Dispatch to Worker -->
  <g transform="translate(100, 355)">
    <rect x="0" y="0" width="240" height="85" rx="5" class="box-green" />
    <text x="120" y="24" class="label" fill="#065f46" text-anchor="middle">Dispatch to Worker</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#a7f3d0" stroke-width="1" />
    <text x="120" y="52" class="mono" font-size="11" text-anchor="middle">Inference Pipeline</text>
    <text x="120" y="68" class="subtext" text-anchor="middle">• Acquire PagedAttention slot</text>
    <text x="120" y="80" class="subtext" text-anchor="middle">• Transition phase: RUNNING</text>
  </g>

  <!-- Level 3 Right: Termination -->
  <g transform="translate(540, 355)">
    <rect x="0" y="0" width="240" height="85" rx="5" class="box-red" />
    <text x="120" y="24" class="label" fill="#991b1b" text-anchor="middle">Resource Cap Rejection</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#fecaca" stroke-width="1" />
    <text x="120" y="52" class="mono" font-size="11" text-anchor="middle">Transition: TERMINATED</text>
    <text x="120" y="68" class="subtext" text-anchor="middle">• exit_code: BUDGET_EXHAUSTED</text>
    <text x="120" y="80" class="subtext" text-anchor="middle">• Reclaim memory &amp; skip neural call</text>
  </g>

</svg>
