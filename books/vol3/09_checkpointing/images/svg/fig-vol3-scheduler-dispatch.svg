<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: #475569; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9.5px; fill: #1e293b; }
      .text-mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #0f172a; }
      .arrow-dark { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arr-dark); }
      .arrow-green { stroke: #059669; stroke-width: 1.5; fill: none; marker-end: url(#arr-green); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#arr-red); }
    </style>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="395" class="bg"/>

  <!-- ================================================================= -->
  <!-- LEVEL 1: SCHEDULER RUN QUEUE (HOST DRAM)                          -->
  <!-- ================================================================= -->
  <g transform="translate(180, 14)">
    <rect x="0" y="0" width="540" height="74" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <rect x="0" y="0" width="540" height="24" rx="4" fill="#f1f5f9"/>
    <text x="14" y="16" class="text-heading" fill="#334155">SCHEDULER RUN QUEUE (HOST DRAM ARRAY)</text>

    <!-- ACB Elements -->
    <g transform="translate(18, 34)">
      <!-- ACB 1 -->
      <rect x="0" y="0" width="112" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="56" y="14" class="text-mono-bold" text-anchor="middle">ACB-1</text>
      <text x="56" y="24" class="text-sub" text-anchor="middle">phase: RUNNABLE</text>

      <!-- ACB 2 -->
      <rect x="130" y="0" width="112" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="186" y="14" class="text-mono-bold" text-anchor="middle">ACB-2</text>
      <text x="186" y="24" class="text-sub" text-anchor="middle" fill="#d97706">phase: WAIT_IO</text>

      <!-- ACB 3 -->
      <rect x="260" y="0" width="112" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="316" y="14" class="text-mono-bold" text-anchor="middle">ACB-3</text>
      <text x="316" y="24" class="text-sub" text-anchor="middle">phase: RUNNABLE</text>

      <!-- ACB 4 -->
      <rect x="390" y="0" width="112" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="446" y="14" class="text-mono-bold" text-anchor="middle">ACB-4</text>
      <text x="446" y="24" class="text-sub" text-anchor="middle" fill="#7c3aed">WAIT_ESCROW</text>
    </g>
  </g>

  <!-- Filter Connector -->
  <g transform="translate(450, 88)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#334155" stroke-width="1.5"/>
    <rect x="-105" y="16" width="210" height="24" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <text x="0" y="32" class="text-mono-bold" text-anchor="middle" fill="#334155">filter(phase == RUNNABLE)</text>
    <line x1="0" y1="40" x2="0" y2="58" class="arrow-dark"/>
  </g>

  <!-- ================================================================= -->
  <!-- LEVEL 2: MULTI-ATTRIBUTE PRIORITY SCORING ENGINE                  -->
  <!-- ================================================================= -->
  <g transform="translate(180, 148)">
    <rect x="0" y="0" width="540" height="74" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="540" height="24" rx="4" fill="#e0f2fe"/>
    <text x="14" y="16" class="text-heading" fill="#0369a1">FAIR-SHARE PRIORITY SCORING ENGINE</text>

    <text x="270" y="44" class="text-mono-bold" text-anchor="middle" fill="#0369a1">P_i = f(tokens_prompt, tokens_decode, wall_clock_us, accrued_cost_uc)</text>
    <text x="270" y="62" class="text-sub" text-anchor="middle">Ranks runnable trajectories; promotes tasks furthest from SLO target or lowest accumulated compute</text>
  </g>

  <!-- Pre-Dispatch Gate Fork Lines -->
  <path d="M 450 222 L 450 238 L 245 238 L 245 252" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <path d="M 450 222 L 450 238 L 655 238 L 655 252" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>

  <!-- Decision Badges -->
  <!-- Left Badge: Passes -->
  <g transform="translate(95, 254)">
    <rect x="0" y="0" width="300" height="40" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="150" y="16" class="text-heading" text-anchor="middle" fill="#065f46">CAPS SATISFIED</text>
    <text x="150" y="31" class="text-mono" text-anchor="middle" fill="#065f46">tokens &lt; T_max  ∧  steps &lt; S_max</text>
  </g>
  <line x1="245" y1="294" x2="245" y2="312" class="arrow-green"/>

  <!-- Right Badge: Breached -->
  <g transform="translate(505, 254)">
    <rect x="0" y="0" width="300" height="40" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="150" y="16" class="text-heading" text-anchor="middle" fill="#991b1b">RESOURCE CAP EXCEEDED</text>
    <text x="150" y="31" class="text-mono" text-anchor="middle" fill="#991b1b">tokens ≥ T_max  ∨  steps ≥ S_max</text>
  </g>
  <line x1="655" y1="294" x2="655" y2="312" class="arrow-red"/>

  <!-- ================================================================= -->
  <!-- LEVEL 3: DISPATCH PIPELINE vs RESOURCE CAP REJECTION              -->
  <!-- ================================================================= -->
  <!-- Left Box: Dispatch Pipeline -->
  <g transform="translate(85, 314)">
    <rect x="0" y="0" width="320" height="66" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <rect x="0" y="0" width="320" height="22" rx="4" fill="#ecfdf5"/>
    <text x="12" y="15" class="text-heading" fill="#065f46">DISPATCH TO INFERENCE WORKER</text>
    
    <g transform="translate(12, 32)">
      <text x="0" y="10" class="text-label">Phase Advance: <tspan font-family="SFMono-Regular, Menlo, monospace" font-weight="700" fill="#0284c7">RUNNING</tspan></text>
      <text x="0" y="22" class="text-sub">Allocates PagedAttention slot in GPU HBM; binds to worker thread</text>
    </g>
  </g>

  <!-- Right Box: Resource Cap Rejection -->
  <g transform="translate(495, 314)">
    <rect x="0" y="0" width="320" height="66" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="320" height="22" rx="4" fill="#fef2f2"/>
    <text x="12" y="15" class="text-heading" fill="#991b1b">PREEMPTIVE RESOURCE REJECTION</text>
    
    <g transform="translate(12, 32)">
      <text x="0" y="10" class="text-label">Phase Advance: <tspan font-family="SFMono-Regular, Menlo, monospace" font-weight="700" fill="#dc2626">TERMINATED</tspan> (BUDGET_EXHAUSTED)</text>
      <text x="0" y="22" class="text-sub">Bypasses neural call; reclaims memory and emits failure diagnostic</text>
    </g>
  </g>
</svg>
