<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="440" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8px; fill: #475569; }
      .text-sub-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #64748b; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8.5px; fill: #1e293b; }
      .text-mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9.5px; font-weight: 700; }
      .arrow-dark { stroke: #334155; stroke-width: 1.4; fill: none; marker-end: url(#arr-dark); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#arr-red); }
      .arrow-dashed-red { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 1.6; fill: none; marker-end: url(#arr-green); }
    </style>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="440" class="bg"/>

  <!-- ================================================================= -->
  <!-- NODE 1: STOCHASTIC ACTION DECODE (Top Left, x=50, y=16)           -->
  <!-- ================================================================= -->
  <g transform="translate(50, 16)">
    <rect x="0" y="0" width="240" height="96" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="22" rx="4" fill="#fef3c7"/>
    <text x="10" y="15" class="text-heading" fill="#b45309">STOCHASTIC ACTION PROPOSAL</text>
    <g transform="translate(10, 30)">
      <text x="0" y="12" class="text-mono-bold" fill="#78350f">a_k ~ π(a | c_k)  (τ &gt; 0)</text>
      <text x="0" y="26" class="text-sub">Unprivileged autoregressive token decode</text>
      <text x="0" y="38" class="text-sub">Zero physical visibility into host resource limits</text>
      <text x="0" y="50" class="text-mono" font-size="8px" fill="#b45309">Proposes tool invocation or shell command</text>
    </g>
  </g>

  <!-- Transition 1 -> 2 (Top Horizontal Segment) -->
  <line x1="290" y1="64" x2="355" y2="64" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="355" y="51" width="230" height="26" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="470" y="67" class="text-mono-bold" fill="#991b1b" text-anchor="middle">Tool Fault: Non-Zero Exit / Stderr</text>
  <line x1="585" y1="64" x2="650" y2="64" class="arrow-red"/>

  <!-- ================================================================= -->
  <!-- NODE 2: ERROR CONTEXT INJECTION (Top Right, x=650, y=16)          -->
  <!-- ================================================================= -->
  <g transform="translate(650, 16)">
    <rect x="0" y="0" width="260" height="96" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="260" height="22" rx="4" fill="#fee2e2"/>
    <text x="10" y="15" class="text-heading" fill="#991b1b">ERROR CONTEXT SATURATION</text>
    <g transform="translate(10, 30)">
      <text x="0" y="12" class="text-mono-bold" fill="#991b1b">c_k+1 = c_k ∥ a_k ∥ o_k (Traceback)</text>
      <text x="0" y="26" class="text-sub">Compiler stack traces appended to context</text>
      <text x="0" y="38" class="text-sub">Displaces attention weight on initial system prompt</text>
      <text x="0" y="50" class="text-mono" font-size="8px" fill="#dc2626">Tokens bias model toward prior failure modes</text>
    </g>
  </g>

  <!-- Transition 2 -> 3 (Right Vertical Descent) -->
  <path d="M 780 112 L 780 160" class="arrow-red"/>

  <!-- ================================================================= -->
  <!-- NODE 3: TERMINAL DECAY & ATTRACTOR (Bottom Right, x=650, y=160)   -->
  <!-- ================================================================= -->
  <g transform="translate(650, 160)">
    <rect x="0" y="0" width="260" height="110" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="0" y="0" width="260" height="22" rx="4" fill="#ede9fe"/>
    <text x="10" y="15" class="text-heading" fill="#6d28d9">TERMINAL PROBABILITY COLLAPSE</text>
    <g transform="translate(12, 28)">
      <text x="0" y="14" class="text-mono-bold" fill="#6d28d9">P(EOS | c_k+1) → 0</text>
      <text x="0" y="28" class="text-sub">Probability mass shifts away from halting</text>
      <text x="0" y="42" class="text-sub">Trapped in localized epistemic attractor basin</text>
      <text x="0" y="56" class="text-mono" font-size="8px" fill="#5b21b6">Workload cannot self-observe failure</text>
    </g>
  </g>

  <!-- Transition 3 -> 4 (Bottom Horizontal Left Segment) -->
  <line x1="650" y1="215" x2="570" y2="215" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="350" y="202" width="220" height="26" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="460" y="218" class="text-mono-bold" fill="#991b1b" text-anchor="middle">Hallucinated Retry Loop a_k+1</text>
  <line x1="350" y1="215" x2="290" y2="215" class="arrow-red"/>

  <!-- ================================================================= -->
  <!-- NODE 4: NON-HALTING RECOVERY BASIN (Bottom Left, x=50, y=160)     -->
  <!-- ================================================================= -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="240" height="110" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="22" rx="4" fill="#fee2e2"/>
    <text x="10" y="15" class="text-heading" fill="#991b1b">SPECULATIVE RECOVERY BASIN</text>
    <g transform="translate(12, 28)">
      <text x="0" y="14" class="text-mono-bold" fill="#991b1b">Unconstrained Spinning Loop</text>
      <text x="0" y="28" class="text-sub">Repeated identical invocations with mutated args</text>
      <text x="0" y="42" class="text-sub">Consumes tokens and compute without progress</text>
      <text x="0" y="56" class="text-mono" font-size="8px" fill="#b91c1c">Model lacks internal termination clock</text>
    </g>
  </g>

  <!-- Non-halting Feedback Loop: Node 4 -> Node 1 (Vertical at x=170) -->
  <line x1="170" y1="160" x2="170" y2="147" stroke="#dc2626" stroke-width="1.5"/>
  
  <!-- Red X / Severing indicator on feedback path -->
  <line x1="162" y1="129" x2="178" y2="145" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="162" y1="145" x2="178" y2="129" stroke="#dc2626" stroke-width="2.2"/>
  
  <line x1="170" y1="129" x2="170" y2="112" class="arrow-dashed-red"/>

  <!-- Severed Loop Label (Left of the X) -->
  <rect x="62" y="128" width="92" height="18" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
  <text x="108" y="140" class="text-mono-bold" fill="#dc2626" text-anchor="middle">LOOP SEVERED</text>

  <!-- ================================================================= -->
  <!-- SUPERVISORY OUT-OF-BAND PREEMPTION (Bottom Span, x=50..910)       -->
  <!-- ================================================================= -->
  <g transform="translate(50, 305)">
    <rect x="0" y="0" width="860" height="115" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="0" y="0" width="860" height="24" rx="4" fill="#dcfce7"/>
    <text x="14" y="16" class="text-heading" fill="#15803d">SUPERVISORY OUT-OF-BAND BUDGET BREAKER</text>

    <!-- Left: Ceilings Evaluated -->
    <g transform="translate(16, 34)">
      <rect x="0" y="0" width="480" height="68" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <text x="12" y="16" class="text-heading" fill="#166534">Deterministic Hardware &amp; Fiscal Invariant Checks</text>
      <text x="12" y="34" class="text-mono-bold" fill="#0f172a">tokens ≥ T_max  ∨  steps ≥ H_max  ∨  cost ≥ C_max  ∨  wall_clock ≥ T_wall</text>
      <text x="12" y="52" class="text-sub">Host timers and meters, outside context</text>
    </g>

    <!-- Preemption Action Arrow -->
    <line x1="504" y1="68" x2="540" y2="68" class="arrow-green"/>

    <!-- Right: Termination State -->
    <g transform="translate(548, 34)">
      <rect x="0" y="0" width="296" height="68" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text x="12" y="16" class="text-heading" fill="#991b1b">HARD PREEMPTIVE TERMINATION</text>
      <text x="12" y="34" class="text-mono-bold" fill="#b91c1c">ACB: → TERMINATED_FAILURE (BUDGET_EXHAUST)</text>
      <text x="12" y="52" class="text-sub">Kill sandbox · commit WAL</text>
    </g>
  </g>

  <!-- Severing Arrow from Supervisor to Loop Break -->
  <path d="M 310 305 L 310 137 L 182 137" class="arrow-green" stroke-width="1.8"/>
  <rect x="210" y="125" width="92" height="24" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
  <text x="256" y="136" class="text-mono-bold" fill="#15803d" text-anchor="middle">Preemptive Trip</text>
  <text x="256" y="145" class="text-sub" fill="#166534" text-anchor="middle">Sever retry loop</text>

</svg>
