<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
      .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
      .box-purple { fill: #faf5ff; stroke: #7c3aed; stroke-width: 1.5; }
      .box-supervisor { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #0f172a; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red-m); }
      .arrow-amber { stroke: #d97706; stroke-width: 1.5; fill: none; marker-end: url(#arrow-amber-m); }
      .arrow-green { stroke: #16a34a; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green-m); }
      .line-red { stroke: #dc2626; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-red-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-amber-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-green-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="480" class="bg" />

  <!-- Diagram Header -->
  <text x="40" y="32" class="title">The Divergent Epistemic Attractor Cycle</text>
  <text x="40" y="50" class="subtext">How uncontained environment errors shift probability mass away from termination into non-halting recovery basins</text>

  <!-- Node 1: Stochastic Decode (Top Left) -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="240" height="95" rx="5" class="box-amber" />
    <text x="120" y="24" class="label" fill="#b45309" text-anchor="middle">1. Stochastic Action Decode</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#fde68a" stroke-width="1" />
    <text x="120" y="52" class="mono" font-size="11.5" text-anchor="middle">P(a_k | c_k)</text>
    <text x="120" y="70" class="subtext" text-anchor="middle">• Unprivileged model proposal</text>
    <text x="120" y="84" class="subtext" text-anchor="middle">• Nonzero temperature (τ &gt; 0)</text>
  </g>

  <!-- Top Segment: 1 -> 2 -->
  <line x1="300" y1="142" x2="355" y2="142" class="line-red" />
  <rect x="355" y="130" width="210" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1" />
  <text x="460" y="146" class="mono" font-size="10.5" fill="#991b1b" text-anchor="middle">Tool Fault: Non-Zero Exit</text>
  <line x1="565" y1="142" x2="615" y2="142" class="arrow-red" />

  <!-- Node 2: Context Injection (Top Right) -->
  <g transform="translate(620, 95)">
    <rect x="0" y="0" width="240" height="95" rx="5" class="box-red" />
    <text x="120" y="24" class="label" fill="#991b1b" text-anchor="middle">2. Error Context Injection</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#fecaca" stroke-width="1" />
    <text x="120" y="52" class="mono" font-size="11.5" text-anchor="middle">o_k = Error Trace / Stderr</text>
    <text x="120" y="70" class="subtext" text-anchor="middle">• Appends stack trace to prompt</text>
    <text x="120" y="84" class="subtext" text-anchor="middle">• Displaces system instruction weight</text>
  </g>

  <!-- Right Segment: 2 -> 3 -->
  <path d="M 740 190 L 740 272 L 625 272" class="arrow-red" />
  <!-- Right Badge (Placed neatly beside the vertical line, zero overlap) -->
  <rect x="752" y="215" width="150" height="34" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <text x="827" y="230" class="mono" font-size="9.5" fill="#991b1b" text-anchor="middle">Terminal Decay</text>
  <text x="827" y="243" class="mono" font-size="9.5" fill="#991b1b" text-anchor="middle">P(&lt;|im_end|&gt;) → 0</text>

  <!-- Node 3: Speculative Recovery Basin (Bottom Center) -->
  <g transform="translate(340, 225)">
    <rect x="0" y="0" width="280" height="95" rx="5" class="box-purple" />
    <text x="140" y="24" class="label" fill="#6d28d9" text-anchor="middle">3. Speculative Recovery Basin</text>
    <line x1="0" y1="34" x2="280" y2="34" stroke="#ddd6fe" stroke-width="1" />
    <text x="140" y="52" class="mono" font-size="11.5" text-anchor="middle">Distribution Shift</text>
    <text x="140" y="70" class="subtext" text-anchor="middle">• Incoherent trial-and-error mutations</text>
    <text x="140" y="84" class="subtext" text-anchor="middle">• Model cannot self-terminate or count</text>
  </g>

  <!-- Left Segment: 3 -> 1 -->
  <path d="M 340 272 L 180 272 L 180 195" class="arrow-red" />
  <!-- Left Badge (Placed neatly beside the vertical line, zero overlap) -->
  <rect x="18" y="215" width="150" height="34" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <text x="93" y="230" class="mono" font-size="9.5" fill="#991b1b" text-anchor="middle">Retry Storm</text>
  <text x="93" y="243" class="mono" font-size="9.5" fill="#991b1b" text-anchor="middle">Action a_{k+1}</text>

  <!-- Out-of-band Supervisory Intervention (Bottom Box) -->
  <g transform="translate(180, 365)">
    <rect x="0" y="0" width="560" height="80" rx="5" class="box-supervisor" />
    <text x="280" y="24" class="label" fill="#15803d" text-anchor="middle">Supervisory Out-of-Band Termination (Zero Ambient Authority: A = 0)</text>
    <line x1="0" y1="34" x2="560" y2="34" stroke="#bbf7d0" stroke-width="1" />
    <text x="280" y="52" class="mono" font-size="11.5" text-anchor="middle">Enforce Ceilings: tokens ≥ T_max  ∨  steps ≥ S_max  ∨  cost ≥ C_max</text>
    <text x="280" y="68" class="subtext" text-anchor="middle">Supervisor severs execution out-of-band, preventing unbounded economic and compute drain</text>
  </g>

  <!-- Arrow from Supervisor severing the attractor loop -->
  <line x1="480" y1="365" x2="480" y2="325" class="arrow-green" stroke-width="2" />

</svg>
