<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .super-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; letter-spacing: 0.5px; }
      .state-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 700; }
      .state-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8px; fill: #334155; }
      .state-body-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #64748b; }
      .trans-label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8px; font-weight: 600; }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.4; fill: none; marker-end: url(#arr-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 1.4; fill: none; marker-end: url(#arr-green); }
      .arrow-amber { stroke: #d97706; stroke-width: 1.4; fill: none; marker-end: url(#arr-amber); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.4; fill: none; marker-end: url(#arr-red); }
      .arrow-slate { stroke: #64748b; stroke-width: 1.4; fill: none; marker-end: url(#arr-slate); }
      .arrow-dashed-green { stroke: #16a34a; stroke-width: 1.4; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr-green); }
      .arrow-dashed-red { stroke: #dc2626; stroke-width: 1.4; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr-red); }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="480" class="bg"/>

  <!-- ================================================================= -->
  <!-- SUPERSTATE 1: PROVISIONING (x=16, width=156)                      -->
  <!-- ================================================================= -->
  <rect x="16" y="24" width="156" height="436" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="26" y="42" class="super-label" fill="#475569">SUPERSTATE: PROVISIONING</text>

  <!-- State: INITIALIZING -->
  <g transform="translate(28, 60)">
    <rect x="0" y="0" width="132" height="92" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <rect x="0" y="0" width="132" height="22" rx="3" fill="#f1f5f9"/>
    <text x="10" y="15" class="state-title" fill="#334155">INITIALIZING (INIT)</text>
    <text x="10" y="38" class="state-body">• Alloc ACB &amp; UUIDv7</text>
    <text x="10" y="52" class="state-body">• Mount sandbox rootfs</text>
    <text x="10" y="66" class="state-body">• Mint capability tokens</text>
    <text x="10" y="80" class="state-body-muted">• Stage system prompt</text>
  </g>

  <!-- ================================================================= -->
  <!-- SUPERSTATE 2: ACTIVE PROCESSING (x=196, width=496, y=24..246)    -->
  <!-- ================================================================= -->
  <rect x="196" y="24" width="496" height="224" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="208" y="42" class="super-label" fill="#0369a1">SUPERSTATE: ACTIVE PROCESSING</text>

  <!-- State: RUNNABLE -->
  <g transform="translate(208, 60)">
    <rect x="0" y="0" width="130" height="92" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="130" height="22" rx="3" fill="#e0f2fe"/>
    <text x="10" y="15" class="state-title" fill="#0369a1">RUNNABLE</text>
    <text x="10" y="38" class="state-body">• In host runqueue</text>
    <text x="10" y="52" class="state-body">• Context synchronized</text>
    <text x="10" y="66" class="state-body">• Awaiting decode slot</text>
    <text x="10" y="80" class="state-body-muted">• No GPU HBM allocated</text>
  </g>

  <!-- State: RUNNING -->
  <g transform="translate(378, 60)">
    <rect x="0" y="0" width="144" height="92" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
    <rect x="0" y="0" width="144" height="22" rx="3" fill="#e0f2fe"/>
    <text x="10" y="15" class="state-title" fill="#0369a1">RUNNING</text>
    <text x="10" y="38" class="state-body">• Occupies batch slot</text>
    <text x="10" y="52" class="state-body">• Autoregressive GEMV</text>
    <text x="10" y="66" class="state-body">• Grammar masking (DFA)</text>
    <text x="10" y="80" class="state-body-muted">• Checkpoint polling C_post</text>
  </g>

  <!-- State: PREEMPTED -->
  <g transform="translate(560, 60)">
    <rect x="0" y="0" width="122" height="92" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="122" height="22" rx="3" fill="#e0f2fe"/>
    <text x="8" y="15" class="state-title" fill="#0369a1">PREEMPTED</text>
    <text x="8" y="38" class="state-body">• Batch slot yielded</text>
    <text x="8" y="52" class="state-body">• State saved in host RAM</text>
    <text x="8" y="66" class="state-body">• Fair-share timeslice</text>
    <text x="8" y="80" class="state-body-muted">• Memory pressure tier</text>
  </g>

  <!-- ================================================================= -->
  <!-- SUPERSTATE 3: SUSPENDED QUORUM (x=196, width=496, y=260..460)   -->
  <!-- ================================================================= -->
  <rect x="196" y="260" width="496" height="200" rx="5" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="208" y="278" class="super-label" fill="#b45309">SUPERSTATE: SUSPENDED QUORUM</text>

  <!-- State: WAITING_IO -->
  <g transform="translate(208, 292)">
    <rect x="0" y="0" width="216" height="96" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <rect x="0" y="0" width="216" height="22" rx="3" fill="#fef3c7"/>
    <text x="10" y="15" class="state-title" fill="#b45309">WAITING_IO (WAIT_IO)</text>
    <text x="10" y="38" class="state-body">• Unbound from host worker thread</text>
    <text x="10" y="52" class="state-body">• Registered sandbox fd with epoll</text>
    <text x="10" y="66" class="state-body">• GPU batch slot released / idle hint</text>
    <text x="10" y="80" class="state-body">• WAL step snapshot fsynced</text>
  </g>

  <!-- State: WAITING_ESCROW -->
  <g transform="translate(460, 292)">
    <rect x="0" y="0" width="220" height="96" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <rect x="0" y="0" width="220" height="22" rx="3" fill="#fef3c7"/>
    <text x="10" y="15" class="state-title" fill="#b45309">WAITING_ESCROW (WAIT_ESCROW)</text>
    <text x="10" y="38" class="state-body">• High-blast-radius quarantine (A=0)</text>
    <text x="10" y="52" class="state-body">• 100% KV cache paged to NVMe/DRAM</text>
    <text x="10" y="66" class="state-body">• Escrow manifest M signed by agent</text>
    <text x="10" y="80" class="state-body">• Awaiting human crypto signature</text>
  </g>

  <!-- ================================================================= -->
  <!-- SUPERSTATE 4: TEARDOWN & TERMINAL (x=704, width=240)             -->
  <!-- ================================================================= -->
  <rect x="704" y="24" width="240" height="436" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="716" y="42" class="super-label" fill="#475569">SUPERSTATE: TEARDOWN &amp; TERMINAL</text>

  <!-- State: TERMINATING -->
  <g transform="translate(718, 60)">
    <rect x="0" y="0" width="212" height="92" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <rect x="0" y="0" width="212" height="22" rx="3" fill="#f1f5f9"/>
    <text x="10" y="15" class="state-title" fill="#334155">TERMINATING (TERM_PENDING)</text>
    <text x="10" y="38" class="state-body">• Kill sandbox child processes</text>
    <text x="10" y="52" class="state-body">• Unmount overlayfs scratchpad</text>
    <text x="10" y="66" class="state-body">• Flush telemetry and event audit</text>
    <text x="10" y="80" class="state-body-muted">• Release memory &amp; network leases</text>
  </g>

  <!-- State: TERMINATED_SUCCESS (Side-by-Side Left) -->
  <g transform="translate(718, 196)">
    <rect x="0" y="0" width="102" height="96" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="0" y="0" width="102" height="22" rx="3" fill="#dcfce7"/>
    <text x="8" y="15" class="state-title" fill="#15803d">TERM_OK</text>
    <text x="8" y="38" class="state-body" font-weight="600">• Goal verified</text>
    <text x="8" y="52" class="state-body">• Diffs merged</text>
    <text x="8" y="66" class="state-body">• Output committed</text>
    <text x="8" y="80" class="state-body-muted">• exit_code = 0</text>
  </g>

  <!-- State: TERMINATED_FAILURE (Side-by-Side Right) -->
  <g transform="translate(828, 196)">
    <rect x="0" y="0" width="102" height="96" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
    <rect x="0" y="0" width="102" height="22" rx="3" fill="#fee2e2"/>
    <text x="8" y="15" class="state-title" fill="#991b1b">TERM_FAIL</text>
    <text x="8" y="38" class="state-body" font-weight="600">• Cap exceeded</text>
    <text x="8" y="52" class="state-body">• Fatal exception</text>
    <text x="8" y="66" class="state-body">• Tool crash / SIGINT</text>
    <text x="8" y="80" class="state-body-muted">• exit_code ≠ 0</text>
  </g>

  <!-- ================================================================= -->
  <!-- TRANSITIONS & ARROWS (Carefully routed with zero collisions)      -->
  <!-- ================================================================= -->

  <!-- 1. INIT -> RUNNABLE (Horizontal) -->
  <line x1="160" y1="106" x2="208" y2="106" class="arrow-blue"/>
  <rect x="168" y="93" width="34" height="13" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="185" y="102" class="trans-label" fill="#0284c7" text-anchor="middle">ready</text>

  <!-- 2. RUNNABLE -> RUNNING (Horizontal) -->
  <line x1="338" y1="106" x2="378" y2="106" class="arrow-blue"/>
  <rect x="342" y="93" width="32" height="13" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="358" y="102" class="trans-label" fill="#0284c7" text-anchor="middle">sched</text>

  <!-- 3. RUNNING -> PREEMPTED (Horizontal) -->
  <line x1="522" y1="106" x2="560" y2="106" class="arrow-blue"/>
  <rect x="526" y="93" width="30" height="13" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="0.8"/>
  <text x="541" y="102" class="trans-label" fill="#0284c7" text-anchor="middle">evict</text>

  <!-- 4. PREEMPTED -> RUNNABLE (Top Loopback corridor at y=46) -->
  <path d="M 621 60 L 621 46 L 273 46 L 273 60" class="arrow-blue"/>
  <rect x="395" y="39" width="104" height="14" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="0.8"/>
  <text x="447" y="49" class="trans-label" fill="#0284c7" text-anchor="middle">re-enqueue (RAM)</text>

  <!-- 5. PREEMPTED -> TERMINATING (Forward exit on budget or abort) -->
  <line x1="682" y1="106" x2="718" y2="106" class="arrow-slate"/>
  <rect x="686" y="87" width="28" height="13" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="700" y="96" class="trans-label" fill="#475569" text-anchor="middle">exit</text>

  <!-- 6. RUNNING -> WAITING_IO (Tool Call Dispatch) -->
  <!-- Exits RUNNING at (400, 152) -> down to y=235 -> left to x=340 -> down into WAITING_IO at (340, 292) -->
  <path d="M 400 152 L 400 235 L 340 235 L 340 292" class="arrow-amber"/>
  <rect x="345" y="228" width="76" height="14" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="0.8"/>
  <text x="383" y="238" class="trans-label" fill="#b45309" text-anchor="middle">tool_call(id)</text>

  <!-- 7. WAITING_IO -> RUNNABLE (Tool Return) -->
  <!-- Straight vertical arrow from WAITING_IO at x=250 up to RUNNABLE at (250, 152) -->
  <path d="M 250 292 L 250 152" class="arrow-green"/>
  <rect x="204" y="200" width="92" height="14" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="250" y="210" class="trans-label" fill="#15803d" text-anchor="middle">tool_return [g_match]</text>

  <!-- 8. RUNNING -> WAITING_ESCROW (High Blast Radius Escalate) -->
  <!-- Straight vertical down from RUNNING at x=495 to WAITING_ESCROW at (495, 292) -->
  <path d="M 495 152 L 495 292" class="arrow-amber"/>
  <rect x="455" y="200" width="80" height="14" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="0.8"/>
  <text x="495" y="210" class="trans-label" fill="#b45309" text-anchor="middle">high_blast (A=0)</text>

  <!-- 9. WAITING_ESCROW -> RUNNABLE (Approved via Under-Corridor) -->
  <!-- Exits WAITING_ESCROW at (520, 388) -> down to y=412 -> left to x=186 -> up to y=120 -> right into RUNNABLE at (208, 120) -->
  <path d="M 520 388 L 520 412 L 186 412 L 186 120 L 208 120" class="arrow-dashed-green"/>
  <rect x="280" y="405" width="130" height="14" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="345" y="415" class="trans-label" fill="#15803d" text-anchor="middle">sig_approved (τ &lt; τ_expire)</text>

  <!-- 10. WAITING_ESCROW -> TERMINATING (Rejection / Timeout) -->
  <!-- Exits WAITING_ESCROW at (680, 340) -> right to x=700 -> up to y=126 -> right into TERMINATING at (718, 126) -->
  <path d="M 680 340 L 700 340 L 700 126 L 718 126" class="arrow-dashed-red"/>
  <rect x="635" y="348" width="124" height="14" rx="2" fill="#ffffff" stroke="#fecaca" stroke-width="0.8"/>
  <text x="697" y="358" class="trans-label" fill="#991b1b" text-anchor="middle">sig_rejected ∨ timeout</text>

  <!-- 11. TERMINATING -> TERM_OK (Left Downward Arrow) -->
  <line x1="769" y1="152" x2="769" y2="196" class="arrow-green"/>
  <rect x="739" y="165" width="60" height="14" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="769" y="175" class="trans-label" fill="#15803d" text-anchor="middle">verified_ok</text>

  <!-- 12. TERMINATING -> TERM_FAIL (Right Downward Arrow) -->
  <line x1="879" y1="152" x2="879" y2="196" class="arrow-red"/>
  <rect x="846" y="165" width="66" height="14" rx="2" fill="#ffffff" stroke="#fecaca" stroke-width="0.8"/>
  <text x="879" y="175" class="trans-label" fill="#991b1b" text-anchor="middle">fault ∨ abort</text>

</svg>
