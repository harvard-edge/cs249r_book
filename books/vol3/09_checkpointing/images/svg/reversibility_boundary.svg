<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT DOMAIN: REVERSIBLE INTERNAL STATE (BLUE)                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="395" height="366" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="395" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">REVERSIBLE INTERNAL STATE DOMAIN</text>

    <!-- Badge -->
    <rect x="285" y="4" width="100" height="16" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="335" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">100% INVERTIBLE</text>

    <!-- Card 1: Context Window -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="375" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Context Working Set &amp; Attention KV Cache</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">• Ephemeral transformer activations stored in GPU HBM / Host RAM</text>
      <text x="10" y="46" font-size="8.0" fill="#334155">• Zero-copy tree branching via Radix prefix trees (SGLang/vLLM)</text>
      <text x="10" y="60" font-size="8.0" font-weight="600" fill="#0284c7">Rollback Mechanism: Pop context turn, trim KV cache tree (Latency: &lt; 1 ms)</text>
    </g>

    <!-- Card 2: Git Worktrees -->
    <g transform="translate(10, 110)">
      <rect x="0" y="0" width="375" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Git Worktrees &amp; Detached HEAD Sandboxes</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">• Local filesystem workspace branched off integration HEAD</text>
      <text x="10" y="46" font-size="8.0" fill="#334155">Unchecked AST mutations, speculative refactorings, test runs</text>
      <text x="10" y="60" font-size="8.0" font-weight="600" fill="#0284c7">Rollback Mechanism: git checkout . ; git clean -fd (Latency: 2–5 ms)</text>
    </g>

    <!-- Card 3: MicroVM CoW -->
    <g transform="translate(10, 188)">
      <rect x="0" y="0" width="375" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">MicroVM Copy-on-Write Filesystems (OverlayFS)</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">• Ephemeral UpperDir capturing mutations atop immutable LowerDir</text>
      <text x="10" y="46" font-size="8.0" fill="#334155">Arbitrary package installs, compiler builds, intermediate files</text>
      <text x="10" y="60" font-size="8.0" font-weight="600" fill="#0284c7">Rollback Mechanism: rm -rf UpperDir / Discard microVM (Latency: &lt; 2 ms)</text>
    </g>

    <!-- Card 4: Speculative Search -->
    <g transform="translate(10, 266)">
      <rect x="0" y="0" width="375" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Speculative Trajectory Search (Best-of-N, MCTS)</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">Parallel candidate trajectories explored concurrently</text>
      <text x="10" y="46" font-size="8.0" fill="#334155">• Evaluated by deterministic oracles before external commit</text>
      <text x="10" y="60" font-size="8.0" font-weight="600" fill="#0284c7">Rollback Mechanism: Discard losing branches; zero side-effects</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CENTER: THE REVERSIBILITY BOUNDARY LINE & GATEKEEPER CARD          -->
  <!-- ================================================================= -->
  <!-- Boundary Line -->
  <line x1="480" y1="74" x2="480" y2="440" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Gateway Badge -->
  <rect x="445" y="80" width="70" height="20" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="480" y="93" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">GATEWAY</text>

  <!-- Forward Flow Commit Arrow -->
  <line x1="415" y1="140" x2="545" y2="140" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>
  <rect x="450" y="131" width="60" height="16" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
  <text x="480" y="142" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">COMMIT</text>

  <!-- Oversight Gate Card -->
  <g transform="translate(444, 172)">
    <rect x="0" y="0" width="72" height="188" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="72" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="36" y="15" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">OVERSIGHT</text>

    <!-- Sub-chip 1: Human Approval -->
    <rect x="4" y="28" width="64" height="38" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="36" y="44" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0f172a">Human</text>
    <text x="36" y="56" text-anchor="middle" font-size="8.0" fill="#64748b">Review</text>

    <!-- Sub-chip 2: State Suspend -->
    <rect x="4" y="72" width="64" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="36" y="88" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0f172a">State</text>
    <text x="36" y="99" text-anchor="middle" font-size="8.0" fill="#64748b">Suspend</text>
    <text x="36" y="110" text-anchor="middle" font-size="8.0" fill="#64748b">(Free HBM)</text>

    <!-- Sub-chip 3: Latency Disparity -->
    <rect x="4" y="124" width="64" height="38" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="36" y="140" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0f172a">10⁶× Latency</text>
    <text x="36" y="152" text-anchor="middle" font-size="8.0" fill="#64748b">Disparity</text>

    <text x="36" y="176" text-anchor="middle" font-size="8.0" font-weight="600" fill="#dc2626">STOP / GO</text>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT DOMAIN: IRREVERSIBLE EXTERNAL ACTUATION (RED)               -->
  <!-- ================================================================= -->
  <g transform="translate(525, 74)">
    <rect x="0" y="0" width="395" height="366" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="395" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">IRREVERSIBLE EXTERNAL ACTUATION DOMAIN</text>

    <!-- Badge -->
    <rect x="275" y="4" width="110" height="16" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="330" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">NON-INVERTIBLE</text>

    <!-- Card 1: Production Databases -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="375" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Production Relational &amp; Document Stores</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">Direct SQL mutations: UPDATE balances, DELETE FROM users</text>
      <text x="10" y="46" font-size="8.0" fill="#334155">No 2-phase commit (2PC) possible across heterogeneous services</text>
      <text x="10" y="60" font-size="8.0" font-weight="600" fill="#dc2626">Recovery: Compensating transaction handler (A⁻¹) or point-in-time recovery</text>
    </g>

    <!-- Card 2: Cloud Infrastructure -->
    <g transform="translate(10, 110)">
      <rect x="0" y="0" width="375" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Cloud Infrastructure &amp; Fleet Provisioning</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">AWS API: ec2:TerminateInstances, terraform apply, Route53 updates</text>
      <text x="10" y="46" font-size="8.0" fill="#334155">Physical storage deletion, IAM permission mutations</text>
      <text x="10" y="60" font-size="8.0" font-weight="600" fill="#dc2626">Recovery: Complex redeployment saga; data loss may be unrecoverable</text>
    </g>

    <!-- Card 3: External Communications -->
    <g transform="translate(10, 188)">
      <rect x="0" y="0" width="375" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">External Communications &amp; Customer Notifications</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">SMTP email dispatch, Slack messages, Twilio SMS alerts, Webhooks</text>
      <text x="10" y="46" font-size="8.0" fill="#334155">• Once dispatched over internet, packets cannot be recalled</text>
      <text x="10" y="60" font-size="8.0" font-weight="600" fill="#dc2626">Recovery: Send apology / retraction email (compensating semantic action)</text>
    </g>

    <!-- Card 4: Financial & Physical APIs -->
    <g transform="translate(10, 266)">
      <rect x="0" y="0" width="375" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Financial Transactions &amp; Cyber-Physical Actuators</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">• Stripe credit card charge, banking ACH transfer, crypto asset swap</text>
      <text x="10" y="46" font-size="8.0" fill="#334155">Robotic arm motion, physical warehouse sorter, CNC cutting</text>
      <text x="10" y="60" font-size="8.0" font-weight="600" fill="#dc2626">Recovery: Refund API (fees lost); physical actions are final</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- FOOTER: CORE SYSTEMS INVARIANT                                    -->
  <!-- ================================================================= -->
  <g transform="translate(40, 448)">
    <rect x="0" y="0" width="880" height="62" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0f172a">CORE SYSTEMS INVARIANT: THE REVERSIBILITY BOUNDARY REQUIRES ASYMMETRIC ARCHITECTURE</text>
    <text x="12" y="36" font-size="8" fill="#334155">Internal errors are cheap and resolved by speculative rollbacks. External actions have no mathematical inverse:</text>
    <text x="12" y="49" font-size="8" fill="#334155">they require typed deterministic Sagas (A⁻¹) or runtime state suspension behind human approval gates.</text>
  </g>
</g>
</svg>