<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="rb-arr-amethyst" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#581C87"/>
    </marker>
    <marker id="rb-arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#991B1B"/>
    </marker>
    <marker id="rb-arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0F766E"/>
    </marker>
    <marker id="rb-arr-ochre" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#92400E"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1040" height="540" fill="#FFFFFF"/>

  <!-- Diagram Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="0.2">THE REVERSIBILITY BOUNDARY: INTERNAL SPECULATION VS. EXTERNAL MUTATION</text>
    <text x="0" y="15" font-size="10" font-weight="400" fill="#475569">Partitioning State Space into Zero-Liability Invertible Domains and Irreversible Side-Effect Planes</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT DOMAIN: REVERSIBLE INTERNAL STATE (S_internal)                       -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 62)">
    <rect width="440" height="424" rx="3" fill="#FFFFFF" stroke="#581C87" stroke-width="1.4"/>
    <rect width="440" height="28" rx="3" fill="#FAF5FF" stroke="#581C87" stroke-width="1.4"/>
    <text x="14" y="18" font-size="9.5" font-weight="700" fill="#581C87">REVERSIBLE INTERNAL STATE DOMAIN (S_internal)</text>
    <text x="426" y="18" text-anchor="end" font-size="8" font-family="ui-monospace, monospace" font-weight="700" fill="#0F766E">INVERTIBLE: C_liability = $0</text>

    <!-- Substrates & Datapaths -->
    <g transform="translate(16, 38)">
      <!-- Substrate 1: KV Cache & Working Set -->
      <g transform="translate(0, 0)">
        <rect width="408" height="66" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#581C87">Attention KV Cache &amp; Context Working Set</text>
        <text x="12" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Substrate: Accelerator HBM3e / RadixAttention Tree</text>
        <text x="12" y="46" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">Inversion: Decrement C_ref → Zero-cost LRU eviction (&lt; 1 ms)</text>
        <rect x="320" y="8" width="76" height="18" rx="1" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
        <text x="358" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#581C87">HBM RADIX</text>
      </g>

      <!-- Substrate 2: Ephemeral Filesystem / OverlayFS -->
      <g transform="translate(0, 74)">
        <rect width="408" height="66" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#0F172A">Ephemeral Filesystem &amp; Git Worktrees</text>
        <text x="12" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Substrate: Host DRAM UpperDir / Detached Git HEAD</text>
        <text x="12" y="46" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">Inversion: rm -rf upperdir / git clean -fd (2 - 5 ms)</text>
        <rect x="320" y="8" width="76" height="18" rx="1" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
        <text x="358" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">OVERLAYFS</text>
      </g>

      <!-- Substrate 3: MicroVM Process Memory -->
      <g transform="translate(0, 148)">
        <rect width="408" height="66" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#0F172A">Isolated Sandbox POSIX Processes</text>
        <text x="12" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Substrate: Firecracker microVM / gVisor sandbox enclave</text>
        <text x="12" y="46" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">Inversion: SIGKILL + snapshot restore (5 - 15 ms)</text>
        <rect x="320" y="8" width="76" height="18" rx="1" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
        <text x="358" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">SNAPSHOT</text>
      </g>
    </g>

    <!-- Domain Metrics Table -->
    <g transform="translate(16, 270)">
      <rect width="408" height="138" rx="2" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text x="0" y="0" font-size="8.5" font-weight="700" fill="#581C87">INVERSION PRIMITIVE:</text>
        <text x="160" y="0" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">Strict Deterministic Inverse: f⁻¹(f(s)) = s</text>

        <text x="0" y="22" font-size="8.5" font-weight="700" fill="#581C87">EXTERNAL LIABILITY:</text>
        <text x="160" y="22" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">C_liability = $0 (Zero Blast Radius)</text>

        <text x="0" y="44" font-size="8.5" font-weight="700" fill="#581C87">SEARCH FREEDOM:</text>
        <text x="160" y="44" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">Unconstrained Speculative MCTS / Rollouts</text>

        <text x="0" y="66" font-size="8.5" font-weight="700" fill="#581C87">RECOVERY OVERHEAD:</text>
        <text x="160" y="66" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">Sub-millisecond to 15 ms</text>

        <text x="0" y="90" font-size="8" font-style="italic" fill="#581C87">Mathematical impunity: state mutations can be abandoned at will.</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTRAL BARRIER: THE REVERSIBILITY BOUNDARY (2PC & WAL GATE)              -->
  <!-- ========================================================================= -->
  <g transform="translate(488, 62)">
    <!-- Vertical Barrier Line -->
    <line x1="32" y1="0" x2="32" y2="424" stroke="#991B1B" stroke-width="2.5" stroke-dasharray="6 3"/>

    <!-- Central Gateway Box -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="64" height="110" rx="3" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.6"/>
      <text x="32" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">THE</text>
      <text x="32" y="34" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">GATE</text>
      
      <!-- Icons / Rules -->
      <line x1="8" y1="42" x2="56" y2="42" stroke="#991B1B" stroke-width="1"/>
      <text x="32" y="56" text-anchor="middle" font-size="7" font-weight="700" fill="#0F172A">2PC Gate</text>
      <text x="32" y="68" text-anchor="middle" font-size="6.5" font-family="ui-monospace, monospace" fill="#475569">WAL Log</text>
      <text x="32" y="80" text-anchor="middle" font-size="6.5" font-family="ui-monospace, monospace" fill="#475569">Idemp-Key</text>
      <text x="32" y="96" text-anchor="middle" font-size="7" font-weight="700" fill="#991B1B">∂S_rev</text>
    </g>

    <!-- Boundary Crossing Arrows -->
    <path d="M-8,195 L-2,195" stroke="#991B1B" stroke-width="1.6" marker-end="url(#rb-arr-red)"/>
    <path d="M66,195 L72,195" stroke="#991B1B" stroke-width="1.6" marker-end="url(#rb-arr-red)"/>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT DOMAIN: IRREVERSIBLE EXTERNAL ACTUATION (S_external)                -->
  <!-- ========================================================================= -->
  <g transform="translate(560, 62)">
    <rect width="440" height="424" rx="3" fill="#FFFFFF" stroke="#991B1B" stroke-width="1.4"/>
    <rect width="440" height="28" rx="3" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.4"/>
    <text x="14" y="18" font-size="9.5" font-weight="700" fill="#991B1B">IRREVERSIBLE EXTERNAL ACTUATION DOMAIN</text>
    <text x="426" y="18" text-anchor="end" font-size="8" font-family="ui-monospace, monospace" font-weight="700" fill="#991B1B">NON-INVERTIBLE: C_liability &gt; $0</text>

    <!-- Substrates & Datapaths -->
    <g transform="translate(16, 38)">
      <!-- Substrate 1: Cloud APIs -->
      <g transform="translate(0, 0)">
        <rect width="408" height="66" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#991B1B">Cloud Infrastructure &amp; Kubernetes APIs</text>
        <text x="12" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Target: AWS / GCP / Azure Control Planes</text>
        <text x="12" y="46" font-size="8" font-family="ui-monospace, monospace" fill="#991B1B">Failure: VM termination, cluster reconfiguration</text>
        <rect x="310" y="8" width="86" height="18" rx="1" fill="#FFFFFF" stroke="#991B1B" stroke-width="1"/>
        <text x="353" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991B1B">CLOUD CONTROL</text>
      </g>

      <!-- Substrate 2: Production Databases -->
      <g transform="translate(0, 74)">
        <rect width="408" height="66" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#0F172A">Production Relational &amp; Vector Databases</text>
        <text x="12" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Target: PostgreSQL / Spanner / DynamoDB</text>
        <text x="12" y="46" font-size="8" font-family="ui-monospace, monospace" fill="#991B1B">Failure: Committed SQL UPDATE / DELETE drops</text>
        <rect x="310" y="8" width="86" height="18" rx="1" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
        <text x="353" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">DATA STORE</text>
      </g>

      <!-- Substrate 3: External Comms & Payment -->
      <g transform="translate(0, 148)">
        <rect width="408" height="66" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#0F172A">Network Sockets, Webhooks &amp; Payments</text>
        <text x="12" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Target: Stripe / Slack / Email / Customer Webhooks</text>
        <text x="12" y="46" font-size="8" font-family="ui-monospace, monospace" fill="#991B1B">Failure: Packets transmitted on physical wire (No undo)</text>
        <rect x="310" y="8" width="86" height="18" rx="1" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
        <text x="353" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">NETWORK WIRE</text>
      </g>
    </g>

    <!-- Domain Metrics Table -->
    <g transform="translate(16, 270)">
      <rect width="408" height="138" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text x="0" y="0" font-size="8.5" font-weight="700" fill="#991B1B">INVERSION PRIMITIVE:</text>
        <text x="160" y="0" font-size="8.5" font-family="ui-monospace, monospace" fill="#991B1B">Non-Invertible: No f⁻¹ (No Physical Undo)</text>

        <text x="0" y="22" font-size="8.5" font-weight="700" fill="#991B1B">COMPENSATION PROTOCOL:</text>
        <text x="160" y="22" font-size="8.5" font-family="ui-monospace, monospace" fill="#92400E">Saga Compensating Action: T_comp</text>

        <text x="0" y="44" font-size="8.5" font-weight="700" fill="#991B1B">EXTERNAL LIABILITY:</text>
        <text x="160" y="44" font-size="8.5" font-family="ui-monospace, monospace" fill="#991B1B">C_liability &gt;&gt; $0 ($10,000+ Potential)</text>

        <text x="0" y="66" font-size="8.5" font-weight="700" fill="#991B1B">EXECUTION GATE:</text>
        <text x="160" y="66" font-size="8.5" font-family="ui-monospace, monospace" fill="#991B1B">Two-Phase Approval / Idempotent Key</text>

        <text x="0" y="90" font-size="8" font-style="italic" fill="#991B1B">Commits cannot be undone: once packet leaves the NIC, state is permanently altered.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Principle Invariant -->
  <g transform="translate(40, 498)">
    <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0F172A">THE REVERSIBILITY INVARIANT:</text>
    <text x="180" y="12" font-size="8.5" font-style="italic" fill="#334155">"Speculative agent trajectories must execute strictly within the reversible domain. Crossing the boundary requires write-ahead logging and idempotent 2PC commit."</text>
  </g>

</svg>
