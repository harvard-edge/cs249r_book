<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="940" height="500" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- TOP CONTAINER: AGENT PROCESS CONTROL PLANE                         -->
  <!-- ================================================================= -->
  <g transform="translate(60, 24)">
    <rect x="0" y="0" width="820" height="280" rx="3" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="820" height="30" rx="3" fill="#e0f2fe"/>
    <text x="16" y="20" font-size="11" font-weight="700" fill="#0369a1">AGENT PROCESS CONTROL PLANE (SUPERVISORY KERNEL)</text>

    <!-- Layer 1: Policy & Security Guard -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="780" height="48" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
      <rect x="0" y="0" width="780" height="18" fill="#f1f5f9"/>
      <text x="10" y="13" font-size="8.5" font-weight="700" fill="#334155">LAYER 1: POLICY &amp; SECURITY GUARD</text>
      <text x="24" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Capability Verification (Macaroons / Token Scopes)</text>
      <text x="360" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Content Safety &amp; Prompt Injection Filtering</text>
      <text x="650" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Invariant Enforcement</text>
    </g>

    <!-- Layer 2: Resource & Execution Manager -->
    <g transform="translate(20, 98)">
      <rect x="0" y="0" width="780" height="48" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
      <rect x="0" y="0" width="780" height="18" fill="#f1f5f9"/>
      <text x="10" y="13" font-size="8.5" font-weight="700" fill="#334155">LAYER 2: RESOURCE &amp; EXECUTION MANAGER</text>
      <text x="24" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Wall-Clock Deadlines &amp; Timeouts (T_wall)</text>
      <text x="360" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Monetary ($) &amp; Token Budget Accounting</text>
      <text x="650" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Concurrency / Rate Bounds</text>
    </g>

    <!-- Layer 3: Lifecycle & Signal Supervisor -->
    <g transform="translate(20, 154)">
      <rect x="0" y="0" width="780" height="48" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
      <rect x="0" y="0" width="780" height="18" fill="#f1f5f9"/>
      <text x="10" y="13" font-size="8.5" font-weight="700" fill="#334155">LAYER 3: LIFECYCLE &amp; SIGNAL SUPERVISOR</text>
      <text x="24" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Heartbeat &amp; Watchdog Monitoring</text>
      <text x="360" y="36" font-size="8.5" font-weight="600" fill="#0f172a">POSIX Signal Trapping (SIGINT, SIGTERM)</text>
      <text x="650" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Cooperative Yield Points</text>
    </g>

    <!-- Layer 4: Transactional State Journal -->
    <g transform="translate(20, 210)">
      <rect x="0" y="0" width="780" height="48" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
      <rect x="0" y="0" width="780" height="18" fill="#f1f5f9"/>
      <text x="10" y="13" font-size="8.5" font-weight="700" fill="#334155">LAYER 4: TRANSACTIONAL STATE JOURNAL (WAL)</text>
      <text x="24" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Durable Checkpointing (ACB State Serialization)</text>
      <text x="360" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Append-Only Action-Observation Ledger</text>
      <text x="650" y="36" font-size="8.5" font-weight="600" fill="#0f172a">Replay &amp; Crash Recovery</text>
    </g>
  </g>

  <!-- Bus Interconnect Signals -->
  <!-- Left Side: Control Plane to Host OS -->
  <g transform="translate(220, 310)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <line x1="20" y1="45" x2="20" y2="0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="-8" y="26" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="end">Dispatches Sandboxed RPC</text>
    <text x="28" y="26" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="start">Returns Exit Code &amp; I/O</text>
  </g>

  <!-- Right Side: Control Plane to Model Core -->
  <g transform="translate(700, 310)">
    <line x1="0" y1="45" x2="0" y2="0" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <line x1="20" y1="0" x2="20" y2="45" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text x="-8" y="26" font-size="7.5" font-weight="700" fill="#0284c7" text-anchor="end">Submits Action Proposal</text>
    <text x="28" y="26" font-size="7.5" font-weight="700" fill="#0284c7" text-anchor="start">Stages Context &amp; Observs</text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM LEFT: HOST OS INFRASTRUCTURE                               -->
  <!-- ================================================================= -->
  <g transform="translate(60, 365)">
    <rect x="0" y="0" width="380" height="100" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="0" y="0" width="380" height="24" fill="#dcfce7"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">HOST OS INFRASTRUCTURE (POSIX / KERNEL)</text>
    
    <text x="14" y="44" font-size="8.5" font-weight="600" fill="#1e293b">Sandboxed Subprocesses (seccomp, cgroups v2)</text>
    <text x="14" y="62" font-size="8.5" font-weight="600" fill="#1e293b">Firecracker MicroVMs &amp; Container Namespaces</text>
    <text x="14" y="80" font-size="8.5" font-weight="600" fill="#1e293b">Storage Subsystems (NVMe Page Cache, Durable WAL)</text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM RIGHT: STOCHASTIC FOUNDATION CORE                          -->
  <!-- ================================================================= -->
  <g transform="translate(500, 365)">
    <rect x="0" y="0" width="380" height="100" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="380" height="24" fill="#e0f2fe"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0369a1">STOCHASTIC FOUNDATION CORE</text>
    
    <text x="14" y="44" font-size="8.5" font-weight="600" fill="#1e293b">Remote Model Inference Endpoints (vLLM, TGI, APIs)</text>
    <text x="14" y="62" font-size="8.5" font-weight="600" fill="#1e293b">Unprivileged Proposal Generator (Token Sampling)</text>
    <text x="14" y="80" font-size="8.5" font-weight="600" fill="#1e293b">Logit Bias / Dynamic Vocabulary Grammar Masks</text>
  </g>
</svg>
