<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 600; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8px; fill: #475569; }
      .text-sub-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #64748b; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8.5px; fill: #1e293b; }
      .text-mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; font-weight: 700; }
      .arrow-dark { stroke: #334155; stroke-width: 1.4; fill: none; marker-end: url(#arr-dark); }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.4; fill: none; marker-end: url(#arr-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 1.4; fill: none; marker-end: url(#arr-green); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.4; fill: none; marker-end: url(#arr-red); }
      .arrow-amber { stroke: #d97706; stroke-width: 1.4; fill: none; marker-end: url(#arr-amber); }
    </style>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="980" height="500" class="bg"/>

  <!-- ================================================================= -->
  <!-- PANEL A: CANONICAL ESCROW MANIFEST SCHEMA (M)                     -->
  <!-- ================================================================= -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="440" height="468" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="0" y="0" width="440" height="26" rx="5" fill="#ede9fe"/>
    <text x="14" y="17" class="panel-title" fill="#6d28d9">(a) Cryptographic Escrow Manifest Schema (M)</text>

    <!-- Schema Card -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="412" height="416" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
      <rect x="0" y="0" width="412" height="22" rx="4" fill="#faf5ff"/>
      <text x="12" y="15" class="text-heading" fill="#6d28d9">STRUCT EscrowManifest (Canonical Format)</text>

      <!-- Field 1: Manifest ID -->
      <g transform="translate(12, 30)">
        <rect x="0" y="0" width="388" height="34" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="10" y="14" class="text-mono-bold" fill="#334155">id: UUIDv4</text>
        <text x="10" y="26" class="text-sub" fill="#64748b">Immutable index: 4b29f0e1-7c91-49b8-a87f-d31e50692ec1</text>
      </g>

      <!-- Field 2: Temporal Lease -->
      <g transform="translate(12, 69)">
        <rect x="0" y="0" width="388" height="34" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="10" y="14" class="text-mono-bold" fill="#334155">lease_window: (τ_issued, τ_expire)</text>
        <text x="10" y="26" class="text-sub" fill="#64748b">Epoch bounds: [1758367200, 1758367800] (Valid for 600s)</text>
      </g>

      <!-- Field 3: Target Resource -->
      <g transform="translate(12, 108)">
        <rect x="0" y="0" width="388" height="34" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="10" y="14" class="text-mono-bold" fill="#334155">target_resource: URI / ARN</text>
        <text x="10" y="26" class="text-sub" fill="#64748b">Destination: postgres://production-cluster-01.internal/orders</text>
      </g>

      <!-- Field 4: Action Payload -->
      <g transform="translate(12, 147)">
        <rect x="0" y="0" width="388" height="46" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="10" y="14" class="text-mono-bold" fill="#15803d">action_payload: JSON-Canonical a_k</text>
        <text x="10" y="26" class="text-mono" fill="#166534">{"cmd": "TRUNCATE orders_staging", "vacuum": true}</text>
        <text x="10" y="38" class="text-sub" fill="#15803d">Whitespace-normalized deterministic serialization</text>
      </g>

      <!-- Field 5: Blast Radius -->
      <g transform="translate(12, 198)">
        <rect x="0" y="0" width="388" height="46" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
        <text x="10" y="14" class="text-mono-bold" fill="#b45309">blast_radius: Struct R_blast</text>
        <text x="10" y="26" class="text-mono" fill="#78350f">Mutation: Irreversible · Rows: ~45,000 · Tier: 1 (Critical)</text>
        <text x="10" y="38" class="text-sub" fill="#b45309">Populated by static SQL/shell security analyzers</text>
      </g>

      <!-- Field 6: Context Digest -->
      <g transform="translate(12, 249)">
        <rect x="0" y="0" width="388" height="46" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
        <text x="10" y="14" class="text-mono-bold" fill="#0284c7">causal_context_digest: H(c_k ∥ S_k)</text>
        <text x="10" y="26" class="text-mono" fill="#0369a1">SHA256: 7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1f... </text>
        <text x="10" y="38" class="text-sub" fill="#0284c7">Cryptographic binding to exact conversational prompt and FSM state</text>
      </g>

      <!-- Field 7: Agent Signature -->
      <g transform="translate(12, 300)">
        <rect x="0" y="0" width="388" height="46" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="10" y="14" class="text-mono-bold" fill="#334155">agent_signature: σ_agent</text>
        <text x="10" y="26" class="text-mono" fill="#475569">Ed25519(H(M), SK_supervisor)</text>
        <text x="10" y="38" class="text-sub" fill="#64748b">Proves manifest originated from an untampered supervisory kernel</text>
      </g>

      <!-- Bottom verification rule note -->
      <g transform="translate(12, 354)">
        <rect x="0" y="0" width="388" height="50" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="15" class="text-label" fill="#475569">Invariant: Strict Causal Non-Malleability</text>
        <text x="10" y="28" class="text-sub">Any alteration of prompt history, tool arguments, or resource targets breaks</text>
        <text x="10" y="40" class="text-sub">the digest H(c_k ∥ S_k), immediately invalidating pending authorization.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: ATOMIC ESCROW VERIFICATION & COMMIT DATAPATH             -->
  <!-- ================================================================= -->
  <g transform="translate(476, 16)">
    <rect x="0" y="0" width="488" height="468" rx="5" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="488" height="26" rx="5" fill="#e0f2fe"/>
    <text x="14" y="17" class="panel-title" fill="#0369a1">(b) Atomic Escrow Verification &amp; Commit Protocol</text>

    <!-- Step 1: Model Proposal Interception -->
    <g transform="translate(18, 38)">
      <rect x="0" y="0" width="452" height="56" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <text x="12" y="16" class="text-heading" fill="#0284c7">Action Interception &amp; Blast Policy Evaluation</text>
      <text x="12" y="30" class="text-sub">Model emits candidate action a_k · Policy engine checks: a_k ∈ A_escrow (Blast ≥ θ)</text>
      <text x="12" y="44" class="text-mono-bold" fill="#b45309">ACB: RUNNING → WAITING_ESCROW  |  Yield OS worker thread &amp; flush KV cache</text>
    </g>

    <line x1="244" y1="94" x2="244" y2="112" class="arrow-blue"/>

    <!-- Step 2: Manifest Generation & Signing -->
    <g transform="translate(18, 112)">
      <rect x="0" y="0" width="452" height="56" rx="3" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
      <text x="12" y="16" class="text-heading" fill="#7c3aed">Compile &amp; Sign Canonical Manifest (M)</text>
      <text x="12" y="30" class="text-sub">Kernel seals parameters into canonical manifest; signs with supervisor private key</text>
      <text x="12" y="44" class="text-mono-bold" fill="#6d28d9">Transmit M to External Authorization Gateway (PagerDuty / Slack / HSM)</text>
    </g>

    <line x1="244" y1="168" x2="244" y2="186" class="arrow-blue"/>

    <!-- Step 3: Human Review & Cryptographic Sign -->
    <g transform="translate(18, 186)">
      <rect x="0" y="0" width="452" height="56" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" class="text-heading" fill="#334155">Quorum Review &amp; Operator Cryptographic Signature</text>
      <text x="12" y="30" class="text-sub">Operator verifies action diff against target URI · Signs digest H(M) with private key</text>
      <text x="12" y="44" class="text-mono" fill="#1e293b">AuthToken = {signer: sec_officer, sig: Ed25519(H(M), SK_human), ts: τ_now}</text>
    </g>

    <line x1="244" y1="242" x2="244" y2="260" class="arrow-dark"/>

    <!-- Step 4: Verification Predicate Gate (Split Box) -->
    <g transform="translate(18, 260)">
      <rect x="0" y="0" width="452" height="52" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="226" y="16" class="text-heading" fill="#0369a1" text-anchor="middle">SUPERVISOR VERIFICATION PREDICATE</text>
      <text x="226" y="32" class="text-mono-bold" fill="#0f172a" text-anchor="middle">Verify(M) ≡ (τ_now ≤ τ_expire) ∧ CryptoVerify(PK_human, H(M), σ) ∧ RoleCheck</text>
      <text x="226" y="44" class="text-sub" text-anchor="middle">Atomic evaluation: zero reentrancy; zero partial execution</text>
    </g>

    <!-- Branch Fork Lines -->
    <path d="M 120 312 L 120 334" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
    <path d="M 368 312 L 368 334" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>

    <!-- Step 5 Left: Atomic Commit -->
    <g transform="translate(18, 334)">
      <rect x="0" y="0" width="216" height="120" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="216" height="22" rx="3" fill="#dcfce7"/>
      <text x="10" y="15" class="text-heading" fill="#15803d">BRANCH A: ATOMIC COMMIT</text>
      
      <g transform="translate(10, 32)">
        <text x="0" y="12" class="text-label" fill="#166534">Predicate Evaluates TRUE</text>
        <text x="0" y="24" class="text-sub">Lease active: τ_now &lt; τ_expire</text>
        <text x="0" y="36" class="text-sub">Signature valid &amp; role authorized</text>
        <line x1="0" y1="44" x2="196" y2="44" stroke="#dcfce7" stroke-width="0.8"/>
        <text x="0" y="58" class="text-mono-bold" fill="#15803d">ACB: WAITING_ESCROW → RUNNING</text>
        <text x="0" y="70" class="text-sub">Bind worker thread; dispatch a_k to driver</text>
        <text x="0" y="80" class="text-sub-muted">Fsync commit token to state WAL</text>
      </g>
    </g>

    <!-- Step 5 Right: Atomic Abort -->
    <g transform="translate(254, 334)">
      <rect x="0" y="0" width="216" height="120" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <rect x="0" y="0" width="216" height="22" rx="3" fill="#fee2e2"/>
      <text x="10" y="15" class="text-heading" fill="#991b1b">BRANCH B: ATOMIC ABORT</text>
      
      <g transform="translate(10, 32)">
        <text x="0" y="12" class="text-label" fill="#991b1b">Predicate Evaluates FALSE</text>
        <text x="0" y="24" class="text-sub">Lease expired (τ_now &gt; τ_expire)</text>
        <text x="0" y="36" class="text-sub">Rejected or signature forged</text>
        <line x1="0" y1="44" x2="196" y2="44" stroke="#fee2e2" stroke-width="0.8"/>
        <text x="0" y="58" class="text-mono-bold" fill="#991b1b">o_k = SynthErr("REFUSED / TIMEOUT")</text>
        <text x="0" y="70" class="text-sub">Invalidate manifest M; purge buffer</text>
        <text x="0" y="80" class="text-sub-muted">Trigger compensating rollback or replan</text>
      </g>
    </g>
  </g>
</svg>
