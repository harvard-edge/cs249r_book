<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 45 960 375" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .box-highlight { fill: #f8fafc; stroke: #0284c7; stroke-width: 1.5; }
      .box-gate { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #0f172a; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-dashed { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <rect y="45" width="960" height="375" class="bg" />


  <!-- Left Column: Priority Queues -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="220" height="300" rx="4" class="box" />
    <text x="16" y="24" class="label">Trajectory Ready Queues</text>
    <line x1="0" y1="36" x2="220" y2="36" stroke="#cbd5e1" stroke-width="1" />

    <!-- Interactive Class (w=4) -->
    <text x="16" y="58" class="subtext" font-weight="600">Interactive Class (weight = 4)</text>
    <rect x="16" y="68" width="85" height="40" rx="3" fill="#f1f5f9" stroke="#64748b" />
    <text x="58" y="92" class="mono" text-anchor="middle">ACB-1</text>

    <line x1="101" y1="88" x2="119" y2="88" class="arrow" />

    <rect x="119" y="68" width="85" height="40" rx="3" fill="#f1f5f9" stroke="#64748b" />
    <text x="161" y="92" class="mono" text-anchor="middle">ACB-2</text>

    <!-- Batch Class (w=1) -->
    <text x="16" y="140" class="subtext" font-weight="600">Batch Processing Class (weight = 1)</text>
    <rect x="16" y="150" width="85" height="40" rx="3" fill="#f1f5f9" stroke="#64748b" />
    <text x="58" y="174" class="mono" text-anchor="middle">ACB-3</text>

    <line x1="101" y1="170" x2="119" y2="170" class="arrow" />

    <rect x="119" y="150" width="85" height="40" rx="3" fill="#f1f5f9" stroke="#64748b" />
    <text x="161" y="174" class="mono" text-anchor="middle">ACB-4</text>

    <!-- Background Maintenance (w=0.5) -->
    <text x="16" y="222" class="subtext" font-weight="600">Background Class (weight = 0.5)</text>
    <rect x="16" y="232" width="85" height="35" rx="3" fill="#f8fafc" stroke="#94a3b8" />
    <text x="58" y="254" class="mono" text-anchor="middle">ACB-5</text>
  </g>

  <!-- Connection from Queues to Arbiter -->
  <line x1="260" y1="225" x2="310" y2="225" class="arrow" />

  <!-- Center: WDRR Arbiter Engine -->
  <g transform="translate(310, 75)">
    <rect x="0" y="0" width="340" height="300" rx="4" class="box-highlight" />
    <text x="20" y="24" class="label" fill="#0369a1">WDRR Dispatch Arbiter</text>
    <line x1="0" y1="36" x2="340" y2="36" stroke="#bae6fd" stroke-width="1" />

    <g transform="translate(20, 50)">
      <text x="0" y="14" class="subtext" font-weight="700">1. Deficit Replenishment</text>
      <text x="12" y="32" class="mono">D_i ← D_i + (w_i × Q_base)</text>

      <text x="0" y="62" class="subtext" font-weight="700">2. Dispatch Admission Check</text>
      <text x="12" y="80" class="mono">if Cost(turn_k) ≤ D_i:</text>
      <text x="28" y="98" class="mono">D_i ← D_i - Cost(turn_k)</text>
      <text x="28" y="116" class="mono">acquire_resources()</text>
      <text x="28" y="134" class="mono">dispatch(turn_k)</text>
      
      <text x="12" y="156" class="mono">else:</text>
      <text x="28" y="174" class="mono">retain D_i; yield_thread()</text>

      <text x="0" y="202" class="subtext" font-weight="700">3. Invariant Closure</text>
      <text x="12" y="218" class="subtext">Prevents head-of-line blocking while preserving</text>
      <text x="12" y="232" class="subtext">strict weighted proportional fairness across tasks.</text>
    </g>
  </g>

  <!-- Connectors from Arbiter to Resource Gates -->
  <line x1="650" y1="150" x2="700" y2="150" class="arrow" />
  <line x1="650" y1="290" x2="700" y2="290" class="arrow" />

  <!-- Right Column: Resource Admission Gates -->
  <g transform="translate(700, 75)">
    <!-- Gate 1: Token Bucket -->
    <rect x="0" y="15" width="220" height="120" rx="4" class="box-gate" />
    <text x="16" y="38" class="label">Inference Token Bucket</text>
    <line x1="0" y1="48" x2="220" y2="48" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="70" class="mono">TPM Rate Limiter</text>
    <text x="16" y="90" class="subtext">• Upstream quota throttle</text>
    <text x="16" y="106" class="subtext">• Prefill &amp; decode capacity</text>
    <text x="16" y="122" class="subtext">• Prevents 429 status cascades</text>

    <!-- Gate 2: Sandbox Pool -->
    <rect x="0" y="165" width="220" height="120" rx="4" class="box-gate" />
    <text x="16" y="188" class="label">Warm Sandbox Pool</text>
    <line x1="0" y1="198" x2="220" y2="198" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="220" class="mono">Worker Concurrency Slots</text>
    <text x="16" y="240" class="subtext">• Ephemeral microVM leases</text>
    <text x="16" y="256" class="subtext">• Memory &amp; CPU cgroup caps</text>
    <text x="16" y="272" class="subtext">• Non-blocking slot allocation</text>
  </g>

  <!-- Bottom boundary annotation -->
  <line x1="40" y1="390" x2="920" y2="390" stroke="#e2e8f0" stroke-width="1" />
</svg>
