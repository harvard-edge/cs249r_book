<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 224" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="800" height="224" fill="#ffffff"/>
  <!-- Entry record -->
  <rect x="20" y="30" width="90" height="54" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="65" y="54" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Collection</text>
  <text x="65" y="68" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">record</text>
  <line x1="110" y1="57" x2="129" y2="57" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <!-- Predicates in execution order -->
  <rect x="130" y="30" width="92" height="54" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="176" y="54" font-size="11" font-weight="700" font-style="italic" fill="#b45309" text-anchor="middle">R</text>
  <text x="176" y="70" font-size="8.5" fill="#475569" text-anchor="middle">record adequacy</text>
  <line x1="222" y1="57" x2="239" y2="57" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="176" y1="84" x2="176" y2="124" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="240" y="30" width="92" height="54" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="286" y="54" font-size="11" font-weight="700" font-style="italic" fill="#b45309" text-anchor="middle">U</text>
  <text x="286" y="70" font-size="8.5" fill="#475569" text-anchor="middle">permitted use</text>
  <line x1="332" y1="57" x2="349" y2="57" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="286" y1="84" x2="286" y2="124" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="350" y="30" width="92" height="54" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="396" y="54" font-size="11" font-weight="700" font-style="italic" fill="#b45309" text-anchor="middle">P</text>
  <text x="396" y="70" font-size="8.5" fill="#475569" text-anchor="middle">process</text>
  <line x1="442" y1="57" x2="459" y2="57" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="396" y1="84" x2="396" y2="124" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="460" y="30" width="92" height="54" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="506" y="54" font-size="11" font-weight="700" font-style="italic" fill="#b45309" text-anchor="middle">O</text>
  <text x="506" y="70" font-size="8.5" fill="#475569" text-anchor="middle">outcome</text>
  <line x1="552" y1="57" x2="569" y2="57" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="506" y1="84" x2="506" y2="124" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="570" y="30" width="92" height="54" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="616" y="54" font-size="11" font-weight="700" font-style="italic" fill="#b45309" text-anchor="middle">T</text>
  <text x="616" y="70" font-size="8.5" fill="#475569" text-anchor="middle">target suitability</text>
  <line x1="662" y1="57" x2="680" y2="57" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="616" y1="84" x2="616" y2="124" stroke="#dc2626" stroke-width="1.2"/>
  <text x="182" y="102" font-size="8.5" fill="#64748b">not pass</text>
  <!-- Admitted -->
  <rect x="682" y="30" width="98" height="54" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="731" y="54" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Admitted</text>
  <text x="731" y="68" font-size="8.5" fill="#475569" text-anchor="middle">for this route</text>
  <!-- Short-circuit collector -->
  <line x1="176" y1="124" x2="616" y2="124" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="300" y1="124" x2="300" y2="159" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="308" y="146" font-size="8.5" fill="#64748b">fail</text>
  <line x1="530" y1="124" x2="530" y2="159" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="538" y="146" font-size="8.5" fill="#64748b">pending or unknown</text>
  <rect x="190" y="160" width="220" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="300" y="178" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Rejected for this route</text>
  <text x="300" y="193" font-size="8.5" fill="#475569" text-anchor="middle">record kept for diagnosis or another route</text>
  <rect x="420" y="160" width="220" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="1,2"/>
  <text x="530" y="178" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Unresolved hold</text>
  <text x="530" y="193" font-size="8.5" fill="#475569" text-anchor="middle">reason and missing evidence recorded</text>
</svg>
