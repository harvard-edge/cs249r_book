<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 330" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="710" height="330" fill="#ffffff"/>

  <!-- ===== Column heads: the five predicates in execution order ===== -->
  <g text-anchor="middle">
    <text x="165" y="28" font-size="14" font-weight="700" fill="#0f172a">R</text>
    <text x="165" y="45" font-size="11.5" fill="#475569">record</text>
    <text x="165" y="58" font-size="11.5" fill="#475569">adequacy</text>
    <text x="249" y="28" font-size="14" font-weight="700" fill="#0f172a">U</text>
    <text x="249" y="45" font-size="11.5" fill="#475569">permitted</text>
    <text x="249" y="58" font-size="11.5" fill="#475569">use</text>
    <text x="333" y="28" font-size="14" font-weight="700" fill="#0f172a">P</text>
    <text x="333" y="45" font-size="11.5" fill="#475569">process</text>
    <text x="417" y="28" font-size="14" font-weight="700" fill="#0f172a">O</text>
    <text x="417" y="45" font-size="11.5" fill="#475569">outcome</text>
    <text x="501" y="28" font-size="14" font-weight="700" fill="#0f172a">T</text>
    <text x="501" y="45" font-size="11.5" fill="#475569">target</text>
    <text x="501" y="58" font-size="11.5" fill="#475569">suitability</text>
  </g>

  <!-- ===== Row A: every predicate passes ===== -->
  <line x1="100" y1="102" x2="536" y2="102" stroke="#64748b" stroke-width="1.5"/>
  <rect x="20" y="80" width="80" height="44" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="60" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">record A</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="130" y="80" width="70" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="165" y="106">pass</text>
    <rect x="214" y="80" width="70" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="249" y="106">pass</text>
    <rect x="298" y="80" width="70" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="333" y="106">pass</text>
    <rect x="382" y="80" width="70" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="417" y="106">pass</text>
    <rect x="466" y="80" width="70" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="501" y="106">pass</text>
  </g>
  <line x1="536" y1="102" x2="559" y2="102" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <rect x="560" y="80" width="130" height="44" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="625" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Admitted</text>
  <text x="625" y="114" text-anchor="middle" font-size="11.5" fill="#475569">for this route</text>

  <!-- ===== Row B: outcome fails; target is never evaluated ===== -->
  <line x1="100" y1="182" x2="382" y2="182" stroke="#64748b" stroke-width="1.5"/>
  <rect x="20" y="160" width="80" height="44" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="60" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">record B</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="130" y="160" width="70" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="165" y="186">pass</text>
    <rect x="214" y="160" width="70" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="249" y="186">pass</text>
    <rect x="298" y="160" width="70" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="333" y="186">pass</text>
    <rect x="382" y="160" width="70" height="44" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="417" y="186" font-weight="700">fail</text>
  </g>
  <rect x="466" y="160" width="70" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="501" y="186" text-anchor="middle" font-size="11.5" fill="#64748b">not run</text>
  <path d="M417,204 V220 H546 V182 H559" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="560" y="160" width="130" height="44" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="625" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Rejected</text>
  <text x="625" y="194" text-anchor="middle" font-size="11.5" fill="#475569">record kept</text>

  <!-- ===== Row C: permitted use is pending; checks stop, record is held ===== -->
  <line x1="100" y1="262" x2="214" y2="262" stroke="#64748b" stroke-width="1.5"/>
  <rect x="20" y="240" width="80" height="44" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="60" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">record C</text>
  <rect x="130" y="240" width="70" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="165" y="266" text-anchor="middle" font-size="12" fill="#0f172a">pass</text>
  <rect x="214" y="240" width="70" height="44" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="1,2"/>
  <text x="249" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">pending</text>
  <g font-size="11.5" text-anchor="middle" fill="#64748b">
    <rect x="298" y="240" width="70" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="333" y="266">not run</text>
    <rect x="382" y="240" width="70" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="417" y="266">not run</text>
    <rect x="466" y="240" width="70" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="501" y="266">not run</text>
  </g>
  <path d="M249,284 V300 H546 V262 H559" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="560" y="240" width="130" height="44" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="1,2"/>
  <text x="625" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Unresolved hold</text>
  <text x="625" y="274" text-anchor="middle" font-size="11.5" fill="#475569">evidence missing</text>
</svg>
