<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="800" height="372" fill="#ffffff"/>

  <!-- Credit span bracket -->
  <path d="M105,50 V40 H710 V50" fill="none" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="407" y="32" font-size="8.5" fill="#6d28d9" text-anchor="middle">one credit per run, held while running, staged, and assessed</text>

  <!-- A: Collection admission -->
  <rect x="20" y="60" width="170" height="150" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="20" y="60" width="170" height="24" rx="3" fill="#e2e8f0"/>
  <text x="105" y="76" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Collection admission</text>
  <text x="105" y="100" font-size="8.5" fill="#475569" text-anchor="middle">fixture, split group, budget</text>
  <rect x="32" y="112" width="146" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="105" y="128" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">credit pool: runs and bytes</text>
  <rect x="32" y="144" width="146" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="105" y="160" font-size="8.5" fill="#0f172a" text-anchor="middle">high watermark: slow dispatch</text>
  <rect x="32" y="176" width="146" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="105" y="192" font-size="8.5" fill="#0f172a" text-anchor="middle">hard limit: stop admission</text>

  <!-- B: Rollout and capture -->
  <rect x="220" y="60" width="170" height="150" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="220" y="60" width="170" height="24" rx="3" fill="#bae6fd"/>
  <text x="305" y="76" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Rollout and capture</text>
  <text x="305" y="100" font-size="8.5" fill="#475569" text-anchor="middle">trusted harness executes the run</text>
  <text x="305" y="116" font-size="8.5" fill="#475569" text-anchor="middle">records history, candidate,</text>
  <text x="305" y="130" font-size="8.5" fill="#475569" text-anchor="middle">and capture gaps</text>
  <rect x="232" y="148" width="146" height="50" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="305" y="168" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">persist candidate bytes</text>
  <text x="305" y="184" font-size="8.5" fill="#475569" text-anchor="middle">before releasing the sandbox</text>

  <!-- C: Staging and assessment -->
  <rect x="420" y="60" width="190" height="150" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <rect x="420" y="60" width="190" height="24" rx="3" fill="#fde68a"/>
  <text x="515" y="76" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Staging and assessment</text>
  <text x="515" y="100" font-size="8.5" fill="#475569" text-anchor="middle">bounded record, per-record ceiling</text>
  <rect x="433" y="112" width="28" height="24" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="447" y="128" font-size="9.5" font-weight="700" font-style="italic" fill="#b45309" text-anchor="middle">R</text>
  <rect x="467" y="112" width="28" height="24" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="481" y="128" font-size="9.5" font-weight="700" font-style="italic" fill="#b45309" text-anchor="middle">U</text>
  <rect x="501" y="112" width="28" height="24" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="515" y="128" font-size="9.5" font-weight="700" font-style="italic" fill="#b45309" text-anchor="middle">P</text>
  <rect x="535" y="112" width="28" height="24" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="549" y="128" font-size="9.5" font-weight="700" font-style="italic" fill="#b45309" text-anchor="middle">O</text>
  <rect x="569" y="112" width="28" height="24" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="583" y="128" font-size="9.5" font-weight="700" font-style="italic" fill="#b45309" text-anchor="middle">T</text>
  <text x="515" y="156" font-size="8.5" fill="#475569" text-anchor="middle">route-specific cascade</text>
  <text x="515" y="172" font-size="8.5" fill="#475569" text-anchor="middle">pass, fail, pending, or unknown</text>
  <text x="515" y="188" font-size="8.5" fill="#475569" text-anchor="middle">per criterion</text>

  <!-- D: Dataset publication -->
  <rect x="640" y="60" width="140" height="150" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="640" y="60" width="140" height="24" rx="3" fill="#e9d5ff"/>
  <text x="710" y="76" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Dataset publication</text>
  <text x="710" y="100" font-size="8.5" fill="#475569" text-anchor="middle">use, permission, split,</text>
  <text x="710" y="114" font-size="8.5" fill="#475569" text-anchor="middle">and transformation policy</text>
  <rect x="652" y="148" width="116" height="50" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="710" y="168" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">derived version</text>
  <text x="710" y="184" font-size="8.5" fill="#475569" text-anchor="middle">with provenance</text>

  <!-- Forward flow -->
  <line x1="190" y1="135" x2="219" y2="135" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="390" y1="135" x2="419" y2="135" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="610" y1="135" x2="639" y2="135" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="624" y="128" font-size="8" fill="#64748b" text-anchor="middle">eligible</text>

  <!-- Other dispositions -->
  <line x1="448" y1="210" x2="448" y2="239" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="590" y1="210" x2="590" y2="239" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="388" y="240" width="120" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="448" y="257" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Diagnostic or</text>
  <text x="448" y="271" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">comparison pool</text>
  <rect x="530" y="240" width="120" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="257" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Unresolved hold</text>
  <text x="590" y="271" font-size="8.5" fill="#475569" text-anchor="middle">bounded review queue</text>

  <!-- Credit return -->
  <path d="M710,210 V320" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3"/>
  <path d="M448,280 V320" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3"/>
  <path d="M590,280 V320" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3"/>
  <path d="M710,320 H105 V211" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="407" y="340" font-size="8.5" fill="#6d28d9" text-anchor="middle">credit released only on durable disposition or acknowledged transfer</text>
</svg>
