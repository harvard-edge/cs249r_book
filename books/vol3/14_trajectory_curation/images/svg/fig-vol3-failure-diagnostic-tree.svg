<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="720" height="520" fill="#ffffff"/>

  <!-- Cost and reversibility axis -->
  <line x1="30" y1="104" x2="30" y2="498" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="22" y="300" font-size="8.5" fill="#64748b" text-anchor="middle" transform="rotate(90 22 300)">cost rises, reversibility falls</text>

  <!-- Measured failure -->
  <rect x="60" y="16" width="270" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="195" y="34" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Measured failure</text>
  <text x="195" y="50" font-size="8.5" fill="#475569" text-anchor="middle">recorded trajectory with a failing criterion</text>
  <line x1="195" y1="60" x2="195" y2="103" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- Probe column -->
  <rect x="60" y="104" width="270" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="195" y="124" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Context probe</text>
  <text x="195" y="140" font-size="8.5" fill="#475569" text-anchor="middle">rerun with the missing fact supplied</text>

  <line x1="195" y1="154" x2="195" y2="183" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="203" y="172" font-size="8.5" fill="#64748b">persists</text>

  <rect x="60" y="184" width="270" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="195" y="204" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Schema probe</text>
  <text x="195" y="220" font-size="8.5" fill="#475569" text-anchor="middle">rerun with corrected tool description</text>

  <line x1="195" y1="234" x2="195" y2="263" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="203" y="252" font-size="8.5" fill="#64748b">persists</text>

  <rect x="60" y="264" width="270" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="195" y="284" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Runtime probe</text>
  <text x="195" y="300" font-size="8.5" fill="#475569" text-anchor="middle">same payload, clean sandbox, raised limits</text>

  <line x1="195" y1="314" x2="195" y2="382" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="203" y="352" font-size="8.5" fill="#64748b">survives every probe</text>

  <rect x="60" y="383" width="270" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="195" y="403" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Residual failure</text>
  <text x="195" y="419" font-size="8.5" fill="#475569" text-anchor="middle">plausibly behavioral</text>

  <!-- Container A: repairs below the weights -->
  <rect x="400" y="74" width="300" height="258" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="400" y="74" width="300" height="22" rx="3" fill="#e2e8f0"/>
  <text x="410" y="89" font-size="9.5" font-weight="700" fill="#0f172a">Repair below the weights</text>
  <text x="690" y="89" font-size="8" fill="#475569" text-anchor="end">versioned, reverts as configuration</text>

  <rect x="416" y="104" width="268" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="550" y="124" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Repair context</text>
  <text x="550" y="140" font-size="8.5" fill="#475569" text-anchor="middle">retrieval or assembly, with omission status</text>

  <rect x="416" y="184" width="268" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="550" y="204" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Repair tool or schema</text>
  <text x="550" y="220" font-size="8.5" fill="#475569" text-anchor="middle">schema, documentation, or observation adapter</text>

  <rect x="416" y="264" width="268" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="550" y="284" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Repair runtime</text>
  <text x="550" y="300" font-size="8.5" fill="#475569" text-anchor="middle">resource bounds, sandbox pool, recovery owner</text>

  <!-- Probe to repair arrows -->
  <line x1="330" y1="129" x2="415" y2="129" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="364" y="123" font-size="8.5" fill="#64748b" text-anchor="middle">disappears</text>
  <line x1="330" y1="209" x2="415" y2="209" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="364" y="203" font-size="8.5" fill="#64748b" text-anchor="middle">disappears</text>
  <line x1="330" y1="289" x2="415" y2="289" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="364" y="283" font-size="8.5" fill="#64748b" text-anchor="middle">disappears</text>

  <!-- Container B: weight changes -->
  <rect x="400" y="352" width="300" height="156" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="400" y="352" width="300" height="22" rx="3" fill="#e2e8f0"/>
  <text x="410" y="367" font-size="9.5" font-weight="700" fill="#0f172a">Change the weights</text>
  <text x="690" y="367" font-size="8" fill="#475569" text-anchor="end">affects every task at once</text>

  <rect x="416" y="386" width="268" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="550" y="404" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Supervised fine-tuning</text>
  <text x="550" y="419" font-size="8.5" fill="#475569" text-anchor="middle">curated corpus for the residual behavior</text>

  <line x1="550" y1="430" x2="550" y2="451" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <rect x="416" y="452" width="268" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="550" y="470" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Reinforcement learning</text>
  <text x="550" y="485" font-size="8.5" fill="#475569" text-anchor="middle">adds rollouts and a protected reward check</text>

  <line x1="330" y1="408" x2="415" y2="408" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="364" y="402" font-size="8.5" fill="#64748b" text-anchor="middle">on evidence</text>
</svg>
