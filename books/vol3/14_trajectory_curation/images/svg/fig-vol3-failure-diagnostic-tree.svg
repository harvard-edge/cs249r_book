<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="680" height="570" fill="#ffffff"/>

  <!-- ===== Cost / reversibility wedge: narrow and cheap at top, wide and costly at bottom ===== -->
  <text x="50" y="76" text-anchor="middle" font-size="11" fill="#475569">cheap,</text>
  <text x="50" y="90" text-anchor="middle" font-size="11" fill="#475569">reversible</text>
  <polygon points="47,100 53,100 68,504 32,504" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="50" y="524" text-anchor="middle" font-size="11" fill="#475569">costly,</text>
  <text x="50" y="538" text-anchor="middle" font-size="11" fill="#475569">global</text>

  <!-- ===== Column header: below the weights ===== -->
  <text x="420" y="86" font-size="12" font-weight="700" fill="#0f172a">Repair below the weights</text>

  <!-- ===== Measured failure ===== -->
  <rect x="110" y="20" width="200" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="39" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Measured failure</text>
  <text x="210" y="55" text-anchor="middle" font-size="11" fill="#475569">recorded failing trace</text>
  <line x1="210" y1="64" x2="210" y2="99" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ===== Rung 1: context ===== -->
  <rect x="110" y="100" width="200" height="44" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="210" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Context probe</text>
  <text x="210" y="135" text-anchor="middle" font-size="11" fill="#475569">missing fact supplied</text>
  <line x1="310" y1="122" x2="419" y2="122" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="364" y="115" text-anchor="middle" font-size="11" fill="#475569">disappears</text>
  <rect x="420" y="100" width="240" height="44" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="540" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Repair context</text>
  <text x="540" y="135" text-anchor="middle" font-size="11" fill="#475569">retrieval or assembly</text>

  <line x1="210" y1="144" x2="210" y2="179" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="218" y="166" font-size="11" fill="#475569">persists</text>

  <!-- ===== Rung 2: tool or schema ===== -->
  <rect x="110" y="180" width="200" height="44" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="210" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Schema probe</text>
  <text x="210" y="215" text-anchor="middle" font-size="11" fill="#475569">rerun with corrected tool description</text>
  <line x1="310" y1="202" x2="419" y2="202" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="364" y="195" text-anchor="middle" font-size="11" fill="#475569">disappears</text>
  <rect x="420" y="180" width="240" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="540" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Repair tool or schema</text>
  <text x="540" y="215" text-anchor="middle" font-size="11" fill="#475569">schema, docs, or adapter</text>

  <line x1="210" y1="224" x2="210" y2="259" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="218" y="246" font-size="11" fill="#475569">persists</text>

  <!-- ===== Rung 3: runtime ===== -->
  <rect x="110" y="260" width="200" height="44" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="210" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Runtime probe</text>
  <text x="210" y="295" text-anchor="middle" font-size="11" fill="#475569">clean sandbox, raised limits</text>
  <line x1="310" y1="282" x2="419" y2="282" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="364" y="275" text-anchor="middle" font-size="11" fill="#475569">disappears</text>
  <rect x="420" y="260" width="240" height="44" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="540" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Repair runtime</text>
  <text x="540" y="295" text-anchor="middle" font-size="11" fill="#475569">bounds, sandbox pool, recovery</text>

  <!-- ===== Weights boundary ===== -->
  <line x1="84" y1="342" x2="660" y2="342" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="420" y="366" font-size="12" font-weight="700" fill="#0f172a">Change the weights</text>

  <line x1="210" y1="304" x2="210" y2="379" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="218" y="328" font-size="11" fill="#475569">survives every probe</text>

  <!-- ===== Residual failure and weight updates ===== -->
  <rect x="110" y="380" width="200" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="399" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Residual failure</text>
  <text x="210" y="415" text-anchor="middle" font-size="11" fill="#475569">plausibly behavioral</text>
  <line x1="310" y1="402" x2="419" y2="402" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="364" y="395" text-anchor="middle" font-size="11" fill="#475569">on evidence</text>
  <rect x="420" y="380" width="240" height="44" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="540" y="399" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Supervised fine-tuning</text>
  <text x="540" y="415" text-anchor="middle" font-size="11" fill="#475569">curated residual corpus</text>
  <line x1="540" y1="424" x2="540" y2="459" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="420" y="460" width="240" height="44" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="540" y="479" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Reinforcement learning</text>
  <text x="540" y="495" text-anchor="middle" font-size="11" fill="#475569">rollouts, protected reward check</text>
</svg>
