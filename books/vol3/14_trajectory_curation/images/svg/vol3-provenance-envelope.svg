<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 272" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="800" height="272" fill="#ffffff"/>
  <!-- Source record and its lineage envelope -->
  <rect x="20" y="20" width="200" height="190" rx="3" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="20" y="20" width="200" height="24" rx="3" fill="#f3e8ff"/>
  <text x="120" y="36" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Source record</text>
  <text x="120" y="60" font-size="8.5" font-family="Courier New, monospace" fill="#6d28d9" text-anchor="middle">trace_r19_01</text>
  <rect x="32" y="72" width="176" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="86" font-size="8.5" fill="#0f172a" text-anchor="middle">collection identity</text>
  <rect x="32" y="100" width="176" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="114" font-size="8.5" fill="#0f172a" text-anchor="middle">generation configuration</text>
  <rect x="32" y="128" width="176" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="142" font-size="8.5" fill="#0f172a" text-anchor="middle">environment and capture</text>
  <rect x="32" y="156" width="176" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="170" font-size="8.5" fill="#0f172a" text-anchor="middle">assessment</text>
  <rect x="32" y="184" width="176" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="198" font-size="8.5" fill="#0f172a" text-anchor="middle">use and partition</text>
  <!-- Transformation -->
  <rect x="250" y="85" width="140" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="320" y="106" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Transformation</text>
  <text x="320" y="121" font-size="8.5" fill="#475569" text-anchor="middle">versioned policy</text>
  <text x="320" y="134" font-size="8.5" fill="#475569" text-anchor="middle">and implementation</text>
  <line x1="220" y1="115" x2="249" y2="115" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="390" y1="115" x2="419" y2="115" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <!-- Derived record -->
  <rect x="420" y="20" width="200" height="190" rx="3" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="420" y="20" width="200" height="24" rx="3" fill="#f3e8ff"/>
  <text x="520" y="36" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Derived record</text>
  <text x="520" y="60" font-size="8.5" font-family="Courier New, monospace" fill="#6d28d9" text-anchor="middle">trace_r19_01_redacted_v1</text>
  <rect x="432" y="72" width="176" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="520" y="86" font-size="8.5" fill="#0f172a" text-anchor="middle">parent reference</text>
  <rect x="432" y="100" width="176" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="520" y="114" font-size="8.5" fill="#0f172a" text-anchor="middle">changed fields and omissions</text>
  <rect x="432" y="128" width="176" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="520" y="142" font-size="8.5" fill="#0f172a" text-anchor="middle">same split group</text>
  <rect x="432" y="156" width="176" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="520" y="170" font-size="8.5" fill="#0f172a" text-anchor="middle">assessment pending recheck</text>
  <!-- Revalidation and admission -->
  <rect x="650" y="20" width="130" height="90" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="715" y="42" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Revalidate</text>
  <text x="715" y="62" font-size="8.5" fill="#475569" text-anchor="middle">record structure</text>
  <text x="715" y="77" font-size="8.5" fill="#475569" text-anchor="middle">context supports target</text>
  <text x="715" y="92" font-size="8.5" fill="#475569" text-anchor="middle">affected criteria</text>
  <line x1="620" y1="65" x2="649" y2="65" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <line x1="715" y1="110" x2="715" y2="139" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="650" y="140" width="130" height="70" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="715" y="164" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Admission for a</text>
  <text x="715" y="178" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">declared use</text>
  <text x="715" y="196" font-size="8.5" fill="#475569" text-anchor="middle">or withheld</text>
  <!-- Reverse reference -->
  <path d="M120,210 V240 H520 V211" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="320" y="258" font-size="8.5" fill="#6d28d9" text-anchor="middle">reverse reference: a correction or withdrawal at the source reaches the derived version</text>
</svg>
