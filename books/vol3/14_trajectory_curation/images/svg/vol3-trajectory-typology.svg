<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="446" fill="#ffffff"/>
  <!-- Direct-success demonstration -->
  <rect x="20" y="12" width="226" height="378" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="12" width="226" height="24" rx="3" fill="#e2e8f0"/>
  <text x="133.0" y="28" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Direct-success demonstration</text>
  <rect x="38.0" y="50" width="190" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="133.0" y="68.0" font-size="8.5" fill="#0f172a" text-anchor="middle">task and delivered context</text>
  <line x1="133.0" y1="80" x2="133.0" y2="93" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="38.0" y="94" width="190" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="133.0" y="112.0" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">inspect the failing check</text>
  <line x1="133.0" y1="124" x2="133.0" y2="137" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="38.0" y="138" width="190" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="133.0" y="156.0" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">edit the pool wakeup</text>
  <line x1="133.0" y1="168" x2="133.0" y2="181" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="38.0" y="182" width="190" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="133.0" y="200.0" font-size="8.5" fill="#0f172a" text-anchor="middle">required checks pass</text>
  <line x1="133.0" y1="212" x2="133.0" y2="225" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="38.0" y="226" width="190" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="133.0" y="244.0" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">report the supported result</text>
  <rect x="38.0" y="330" width="190" height="46" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="133.0" y="349" font-size="8.5" fill="#0f172a" text-anchor="middle">select responses worth imitating;</text>
  <text x="133.0" y="363" font-size="8.5" fill="#0f172a" text-anchor="middle">shortest is not the criterion</text>
  <!-- Recovery demonstration -->
  <rect x="267" y="12" width="226" height="378" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="267" y="12" width="226" height="24" rx="3" fill="#e2e8f0"/>
  <text x="380.0" y="28" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Recovery demonstration</text>
