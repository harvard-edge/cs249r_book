  <text x="380.0" y="68.0" font-size="8.5" fill="#0f172a" text-anchor="middle">earlier context and observations</text>
  <line x1="380.0" y1="80" x2="380.0" y2="93" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="285.0" y="94" width="190" height="30" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="380.0" y="112.0" font-size="8.5" fill="#0f172a" text-anchor="middle"><tspan font-family="Courier New, monospace" fill="#475569">e2</tspan>  malformed edit, refused</text>
  <line x1="380.0" y1="124" x2="380.0" y2="137" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="285.0" y="138" width="190" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="380.0" y="156.0" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-family="Courier New, monospace" fill="#475569">e3</tspan>  inspect the schema</text>
  <line x1="380.0" y1="168" x2="380.0" y2="181" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="285.0" y="182" width="190" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="380.0" y="200.0" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-family="Courier New, monospace" fill="#475569">e4</tspan>  corrected, permitted edit</text>
  <line x1="380.0" y1="212" x2="380.0" y2="225" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="285.0" y="226" width="190" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="380.0" y="244.0" font-size="8.5" fill="#0f172a" text-anchor="middle"><tspan font-family="Courier New, monospace" fill="#475569">e5</tspan>  check summary</text>
  <line x1="380.0" y1="256" x2="380.0" y2="269" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="285.0" y="270" width="190" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="380.0" y="288.0" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-family="Courier New, monospace" fill="#475569">e6</tspan>  report result and scope</text>
  <rect x="285.0" y="330" width="190" height="46" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="380.0" y="349" font-size="8.5" fill="#0f172a" text-anchor="middle">select the correction;</text>
  <text x="380.0" y="363" font-size="8.5" fill="#0f172a" text-anchor="middle">keep the mistake as context</text>
  <!-- Hard-negative candidate -->
  <rect x="514" y="12" width="226" height="378" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="514" y="12" width="226" height="24" rx="3" fill="#e2e8f0"/>
  <text x="627.0" y="28" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Hard-negative candidate</text>
  <rect x="532.0" y="50" width="190" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="627.0" y="68.0" font-size="8.5" fill="#0f172a" text-anchor="middle">task and delivered context</text>
  <line x1="627.0" y1="80" x2="627.0" y2="93" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="532.0" y="94" width="190" height="30" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="627.0" y="112.0" font-size="8.5" fill="#0f172a" text-anchor="middle">plausible edit</text>
  <line x1="627.0" y1="124" x2="627.0" y2="137" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="532.0" y="138" width="190" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="627.0" y="156.0" font-size="8.5" fill="#0f172a" text-anchor="middle">targeted check passes</text>
  <line x1="627.0" y1="168" x2="627.0" y2="181" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="532.0" y="182" width="190" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="627.0" y="200.0" font-size="8.5" fill="#0f172a" text-anchor="middle">required check fails</text>
  <text x="627.0" y="230" font-size="8.5" font-style="italic" fill="#64748b" text-anchor="middle">first causal step uncertain:</text>
  <text x="627.0" y="244" font-size="8.5" font-style="italic" fill="#64748b" text-anchor="middle">record the basis, not an exact point</text>
  <rect x="532.0" y="330" width="190" height="46" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="627.0" y="349" font-size="8.5" fill="#0f172a" text-anchor="middle">diagnosis, scoped segment, or</text>
  <text x="627.0" y="363" font-size="8.5" fill="#0f172a" text-anchor="middle">compatible comparison only</text>
  <rect x="90" y="408" width="22" height="14" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="120" y="419" font-size="8.5" fill="#475569">selected target response</text>
  <rect x="290" y="408" width="22" height="14" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="320" y="419" font-size="8.5" fill="#475569">context or observation, not a target</text>
  <rect x="530" y="408" width="22" height="14" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="560" y="419" font-size="8.5" fill="#475569">deficient response, never imitated</text>
</svg>
