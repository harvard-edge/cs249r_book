<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel-hdr { font-size: 11.5px; font-weight: 700; }
      .node-lbl { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-size: 9.5px; text-anchor: middle; }
      .tag-lbl { font-size: 8.5px; font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="1080" height="400" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: Precondition Invalidation Cascade                        -->
  <!-- ================================================================= -->
  <g transform="translate(20, 16)">
    <!-- Panel Container -->
    <rect width="510" height="368" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="510" height="30" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
    <text x="16" y="20" class="panel-hdr" fill="#991b1b">Panel A: Precondition Invalidation Cascade</text>
    <text x="494" y="20" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#dc2626" text-anchor="end">Desc(v₂) Invalidation</text>

    <!-- Node v0 (Init) -->
    <g transform="translate(30, 150)">
      <rect width="72" height="52" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
      <text x="36" y="26" class="node-lbl" fill="#15803d">v₀</text>
      <text x="36" y="42" class="node-sub" fill="#166534">Init Plan</text>
    </g>

    <!-- Node v1 (Fetch Deps) -->
    <g transform="translate(150, 90)">
      <rect width="78" height="52" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
      <text x="39" y="26" class="node-lbl" fill="#15803d">v₁</text>
      <text x="39" y="42" class="node-sub" fill="#166534">Fetch Deps</text>
    </g>

    <!-- Node v5 (Setup DB - Concurrent Branch) -->
    <g transform="translate(150, 220)">
      <rect width="78" height="52" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
      <text x="39" y="26" class="node-lbl" fill="#15803d">v₅</text>
      <text x="39" y="42" class="node-sub" fill="#166534">Setup DB</text>
    </g>

    <!-- Node v2 (Link Lib - FAILING NODE) -->
    <g transform="translate(280, 90)">
      <rect width="84" height="52" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="42" y="26" class="node-lbl" fill="#b91c1c">v₂</text>
      <text x="42" y="42" class="node-sub" font-weight="700" fill="#991b1b">Link Lib (Fail)</text>
    </g>

    <!-- Node v3 (Compile Unit - INVALIDATED) -->
    <g transform="translate(410, 90)">
      <rect width="78" height="52" rx="4" fill="#f8fafc" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3"/>
      <text x="39" y="26" class="node-lbl" fill="#991b1b">v₃</text>
      <text x="39" y="42" class="node-sub" fill="#b91c1c">Compile Unit</text>
    </g>

    <!-- Node v4 (Run Binary - INVALIDATED) -->
    <g transform="translate(410, 220)">
      <rect width="78" height="52" rx="4" fill="#f8fafc" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3"/>
      <text x="39" y="26" class="node-lbl" fill="#991b1b">v₄</text>
      <text x="39" y="42" class="node-sub" fill="#b91c1c">Run Binary</text>
    </g>

    <!-- Edges Panel A -->
    <!-- v0 -> v1 -->
    <path d="M 102,165 L 142,125" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <!-- v0 -> v5 -->
    <path d="M 102,185 L 142,235" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <!-- v1 -> v2 -->
    <line x1="228" y1="116" x2="272" y2="116" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <!-- v2 -> v3 (Invalidation propagation) -->
    <line x1="364" y1="116" x2="402" y2="116" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <!-- v3 -> v4 (Invalidation propagation) -->
    <path d="M 449,142 L 449,212" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <!-- v5 -> v4 (Unaffected edge) -->
    <line x1="228" y1="246" x2="402" y2="246" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>

    <!-- Status Callouts inside Panel A -->
    <g transform="translate(20, 298)">
      <rect width="470" height="54" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#991b1b">Fault Localization &amp; Reachability Pruning</text>
      <text x="12" y="32" font-size="8.5" fill="#334155">v₂ fails: missing liburing headers</text>
      <text x="12" y="45" font-size="8.5" fill="#7f1d1d">BFS computes Desc(v₂) = {v₃, v₄} → Invalidated. Disjoint branch v₅ preserved.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: Targeted Branch Pruning & Resynthesis                    -->
  <!-- ================================================================= -->
  <g transform="translate(550, 16)">
    <!-- Panel Container -->
    <rect width="510" height="368" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="510" height="30" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="20" class="panel-hdr" fill="#0369a1">Panel B: Targeted Branch Pruning &amp; Resynthesis</text>
    <text x="494" y="20" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#0284c7" text-anchor="end">Compensated Subgraph</text>

    <!-- Memory Escrow Enclosure (Preserved Ancestors) -->
    <rect x="20" y="52" width="220" height="236" rx="4" fill="#f0fdf4" fill-opacity="0.5" stroke="#86efac" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="30" y="70" font-size="9" font-weight="700" fill="#15803d">Memory Escrow (Preserved)</text>

    <!-- Node v0 (Preserved) -->
    <g transform="translate(30, 150)">
      <rect width="72" height="52" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
      <text x="36" y="26" class="node-lbl" fill="#15803d">v₀</text>
      <text x="36" y="42" class="node-sub" fill="#166534">Preserved</text>
    </g>

    <!-- Node v1 (Preserved) -->
    <g transform="translate(150, 90)">
      <rect width="78" height="52" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
      <text x="39" y="26" class="node-lbl" fill="#15803d">v₁</text>
      <text x="39" y="42" class="node-sub" fill="#166534">Preserved</text>
    </g>

    <!-- Node v5 (Preserved) -->
    <g transform="translate(150, 220)">
      <rect width="78" height="52" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
      <text x="39" y="26" class="node-lbl" fill="#15803d">v₅</text>
      <text x="39" y="42" class="node-sub" fill="#166534">Preserved</text>
    </g>

    <!-- Resynthesized Subgraph Enclosure -->
    <rect x="270" y="52" width="224" height="110" rx="4" fill="#f0f9ff" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="280" y="70" font-size="9" font-weight="700" fill="#0284c7">Resynthesized Path {v₂', v₃'}</text>

    <!-- Node v2' (Resynthesized - Build Static) -->
    <g transform="translate(280, 90)">
      <rect width="84" height="52" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
      <text x="42" y="26" class="node-lbl" fill="#0369a1">v₂'</text>
      <text x="42" y="42" class="node-sub" font-weight="600" fill="#0284c7">Build Static</text>
    </g>

    <!-- Node v3' (Resynthesized - Compile Unit) -->
    <g transform="translate(400, 90)">
      <rect width="84" height="52" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
      <text x="42" y="26" class="node-lbl" fill="#0369a1">v₃'</text>
      <text x="42" y="42" class="node-sub" font-weight="600" fill="#0284c7">Compile Unit</text>
    </g>

    <!-- Node v4 (Reconnected) -->
    <g transform="translate(400, 220)">
      <rect width="84" height="52" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <text x="42" y="26" class="node-lbl" fill="#15803d">v₄</text>
      <text x="42" y="42" class="node-sub" fill="#166534">Reconnected</text>
    </g>

    <!-- Edges Panel B -->
    <!-- v0 -> v1 -->
    <path d="M 102,165 L 142,125" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <!-- v0 -> v5 -->
    <path d="M 102,185 L 142,235" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
    <!-- v1 -> v2' (Resynthesis splice) -->
    <line x1="228" y1="116" x2="272" y2="116" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <!-- v2' -> v3' -->
    <line x1="364" y1="116" x2="392" y2="116" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <!-- v3' -> v4 (Reconnection) -->
    <path d="M 442,142 L 442,212" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <!-- v5 -> v4 (Preserved edge) -->
    <line x1="228" y1="246" x2="392" y2="246" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>

    <!-- Status Callouts inside Panel B -->
    <g transform="translate(20, 298)">
      <rect width="470" height="54" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#15803d">Localized Resynthesis &amp; State Escrow</text>
      <text x="12" y="32" font-size="8.5" fill="#334155">Only subgraph {v₂, v₃} regenerated; ancestor state {v₀, v₁} retained in escrow.</text>
      <text x="12" y="45" font-size="8.5" fill="#0f172a">Bridge(F_verified → C_downstream) re-satisfies v₄ preconditions; 4.0× compute saved.</text>
    </g>
  </g>
</svg>
