<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="as-arr-amethyst" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#581C87"/>
    </marker>
    <marker id="as-arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#991B1B"/>
    </marker>
    <marker id="as-arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0F766E"/>
    </marker>
    <marker id="as-arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1040" height="540" fill="#FFFFFF"/>

  <!-- Diagram Title Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="0.2">THE ANTI-SWARM PRINCIPLE: MESH CHAOS VS. HIERARCHICAL SUPERVISION</text>
    <text x="0" y="15" font-size="10" font-weight="400" fill="#475569">Contrasting Quadratic Communication Dilution O(N²) with Unidirectional Authority and Context Isolation</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT PANEL: UNCONSTRAINED PEER-TO-PEER MESH (FAILURE MODE)               -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 62)">
    <!-- Panel Outer Container -->
    <rect width="460" height="424" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="460" height="28" rx="3" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="18" font-size="9.5" font-weight="700" fill="#991B1B">PANEL A: UNCONSTRAINED PEER-TO-PEER MESH (PATHOLOGICAL SWARM)</text>

    <!-- Mesh Graph Visualization Canvas -->
    <g transform="translate(18, 40)">
      <rect width="424" height="210" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Center Warning Badge: O(N^2) Channels -->
      <circle cx="212" cy="105" r="32" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.4"/>
      <text x="212" y="101" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" font-weight="700" fill="#991B1B">O(N²)</text>
      <text x="212" y="115" text-anchor="middle" font-size="8" font-weight="600" fill="#991B1B">C = N(N-1)/2</text>

      <!-- Mesh Edges: All pairs connected (10 bidirectional channels) -->
      <!-- Node coordinates: Top(212, 28), TopLeft(100, 75), TopRight(324, 75), BotLeft(135, 175), BotRight(289, 175) -->
      <!-- Pathological Livelock Loop Highlighted in Red Solid -->
      <path d="M212,28 L100,75" stroke="#991B1B" stroke-width="1.6" marker-end="url(#as-arr-red)"/>
      <path d="M100,75 L135,175" stroke="#991B1B" stroke-width="1.6" marker-end="url(#as-arr-red)"/>
      <path d="M135,175 L289,175" stroke="#991B1B" stroke-width="1.6" marker-end="url(#as-arr-red)"/>
      <path d="M289,175 L324,75" stroke="#991B1B" stroke-width="1.6" marker-end="url(#as-arr-red)"/>
      <path d="M324,75 L212,28" stroke="#991B1B" stroke-width="1.6" marker-end="url(#as-arr-red)"/>

      <!-- Internal cross-mesh chatter (dashed red) -->
      <line x1="212" y1="28" x2="135" y2="175" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 3"/>
      <line x1="212" y1="28" x2="289" y2="175" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 3"/>
      <line x1="100" y1="75" x2="324" y2="75" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 3"/>
      <line x1="100" y1="75" x2="289" y2="175" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 3"/>
      <line x1="324" y1="75" x2="135" y2="175" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 3"/>

      <!-- Annotations for livelocks and noise -->
      <rect x="14" y="10" width="112" height="22" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="70" y="24" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#991B1B">Livelock: ΔS = ∅</text>

      <rect x="298" y="10" width="112" height="22" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="354" y="24" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#991B1B">Attention Dilution</text>

      <!-- 5 Agent Nodes -->
      <!-- Agent A1 (Top) -->
      <circle cx="212" cy="28" r="18" fill="#FFFFFF" stroke="#991B1B" stroke-width="1.5"/>
      <text x="212" y="32" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#0F172A">A₁</text>

      <!-- Agent A2 (Top Left) -->
      <circle cx="100" cy="75" r="18" fill="#FFFFFF" stroke="#991B1B" stroke-width="1.5"/>
      <text x="100" y="79" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#0F172A">A₂</text>

      <!-- Agent A3 (Top Right) -->
      <circle cx="324" cy="75" r="18" fill="#FFFFFF" stroke="#991B1B" stroke-width="1.5"/>
      <text x="324" y="79" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#0F172A">A₃</text>

      <!-- Agent A4 (Bottom Left) -->
      <circle cx="135" cy="175" r="18" fill="#FFFFFF" stroke="#991B1B" stroke-width="1.5"/>
      <text x="135" y="179" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#0F172A">A₄</text>

      <!-- Agent A5 (Bottom Right) -->
      <circle cx="289" cy="175" r="18" fill="#FFFFFF" stroke="#991B1B" stroke-width="1.5"/>
      <text x="289" y="179" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#0F172A">A₅</text>
    </g>

    <!-- Systems Failure Metrics Table -->
    <g transform="translate(18, 260)">
      <rect width="424" height="148" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- Metrics Grid -->
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-size="8.5" font-weight="700" fill="#991B1B">COMMUNICATION TOPOLOGY:</text>
        <text x="175" y="0" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">Unbounded K_N Complete Graph</text>

        <text x="0" y="22" font-size="8.5" font-weight="700" fill="#991B1B">CHANNEL SCALING:</text>
        <text x="175" y="22" font-size="8.5" font-family="ui-monospace, monospace" fill="#991B1B">C = N(N - 1) / 2 = O(N²)</text>

        <text x="0" y="44" font-size="8.5" font-weight="700" fill="#991B1B">TOKEN INGESTION RATE:</text>
        <text x="175" y="44" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">O(N² · T_avg) Token Explosion</text>

        <text x="0" y="66" font-size="8.5" font-weight="700" fill="#991B1B">CONTEXT RESIDENCY:</text>
        <text x="175" y="66" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">Shared Flat Context (Polluted)</text>

        <text x="0" y="88" font-size="8.5" font-weight="700" fill="#991B1B">FAILURE MODE:</text>
        <text x="175" y="88" font-size="8.5" font-family="ui-monospace, monospace" fill="#991B1B">Mutual Hallucination &amp; Livelock</text>

        <text x="0" y="110" font-size="8" font-style="italic" fill="#64748B">Diffuse accountability; no node possesses ground-truth verification authority.</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT PANEL: HIERARCHICAL SUPERVISION TREE (PRODUCTION ARCHITECTURE)     -->
  <!-- ========================================================================= -->
  <g transform="translate(540, 62)">
    <!-- Panel Outer Container -->
    <rect width="460" height="424" rx="3" fill="#FFFFFF" stroke="#581C87" stroke-width="1.4"/>
    <rect width="460" height="28" rx="3" fill="#FAF5FF" stroke="#581C87" stroke-width="1.4"/>
    <text x="14" y="18" font-size="9.5" font-weight="700" fill="#581C87">PANEL B: HIERARCHICAL SUPERVISOR TREE (ERLANG/OTP PRINCIPLE)</text>

    <!-- Supervised Hierarchy Visualization Canvas -->
    <g transform="translate(18, 40)">
      <rect width="424" height="210" rx="2" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>

      <!-- Root Supervisor S0 -->
      <g transform="translate(112, 12)">
        <rect width="200" height="40" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1.6"/>
        <text x="100" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#581C87">Supervisor S₀ (Orchestrator)</text>
        <text x="100" y="32" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Lease Manager | Invariant Gate ϕ_spec</text>
      </g>

      <!-- Downward Delegation Paths (Unidirectional Leased Tasks) -->
      <path d="M162,52 L162,74 L78,74 L78,110" fill="none" stroke="#581C87" stroke-width="1.4" marker-end="url(#as-arr-amethyst)"/>
      <path d="M212,52 L212,110" fill="none" stroke="#581C87" stroke-width="1.4" marker-end="url(#as-arr-amethyst)"/>
      <path d="M262,52 L262,74 L346,74 L346,110" fill="none" stroke="#581C87" stroke-width="1.4" marker-end="url(#as-arr-amethyst)"/>

      <text x="100" y="68" font-size="7.5" font-family="ui-monospace, monospace" fill="#581C87">Task T₁</text>
      <text x="180" y="80" font-size="7.5" font-family="ui-monospace, monospace" fill="#581C87">Task T₂</text>
      <text x="304" y="68" font-size="7.5" font-family="ui-monospace, monospace" fill="#581C87">Task T₃</text>

      <!-- CONTEXT ISOLATION BARRIER -->
      <line x1="12" y1="94" x2="412" y2="94" stroke="#0F766E" stroke-width="1.2" stroke-dasharray="4 2"/>
      <text x="410" y="90" text-anchor="end" font-size="7" font-weight="700" fill="#0F766E">Context Isolation Plane (Isolated KV Pools)</text>

      <!-- 3 Isolated Worker Enclaves -->
      <!-- Worker W1 -->
      <g transform="translate(24, 114)">
        <rect width="108" height="42" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
        <text x="54" y="16" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#0F172A">Worker W₁</text>
        <text x="54" y="30" text-anchor="middle" font-size="7.5" fill="#475569">Ephemeral Sandbox</text>
      </g>

      <!-- Worker W2 -->
      <g transform="translate(158, 114)">
        <rect width="108" height="42" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
        <text x="54" y="16" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#0F172A">Worker W₂</text>
        <text x="54" y="30" text-anchor="middle" font-size="7.5" fill="#475569">Ephemeral Sandbox</text>
      </g>

      <!-- Worker W3 -->
      <g transform="translate(292, 114)">
        <rect width="108" height="42" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
        <text x="54" y="16" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#0F172A">Worker W₃</text>
        <text x="54" y="30" text-anchor="middle" font-size="7.5" fill="#475569">Ephemeral Sandbox</text>
      </g>

      <!-- Schema Validation Gate on Upward Return -->
      <path d="M78,156 L78,180 L140,180" fill="none" stroke="#0F766E" stroke-width="1.2"/>
      <path d="M212,156 L212,172" fill="none" stroke="#0F766E" stroke-width="1.2"/>
      <path d="M346,156 L346,180 L284,180" fill="none" stroke="#0F766E" stroke-width="1.2"/>

      <g transform="translate(142, 168)">
        <rect width="140" height="26" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
        <text x="70" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#0F766E">Schema Diff Gate V_schema</text>
      </g>
    </g>

    <!-- Systems Architecture Metrics Table -->
    <g transform="translate(18, 260)">
      <rect width="424" height="148" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Metrics Grid -->
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-size="8.5" font-weight="700" fill="#581C87">COMMUNICATION TOPOLOGY:</text>
        <text x="175" y="0" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">Unidirectional Tree (Depth D)</text>

        <text x="0" y="22" font-size="8.5" font-weight="700" fill="#581C87">CHANNEL SCALING:</text>
        <text x="175" y="22" font-size="8.5" font-family="ui-monospace, monospace" fill="#581C87">C = N - 1 = O(N) Linear Bounded</text>

        <text x="0" y="44" font-size="8.5" font-weight="700" fill="#581C87">TOKEN INGESTION RATE:</text>
        <text x="175" y="44" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">O(N · T_task) Bounded Budget</text>

        <text x="0" y="66" font-size="8.5" font-weight="700" fill="#581C87">CONTEXT RESIDENCY:</text>
        <text x="175" y="66" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">100% Isolated Ephemeral Enclaves</text>

        <text x="0" y="88" font-size="8.5" font-weight="700" fill="#581C87">FAILURE ISOLATION:</text>
        <text x="175" y="88" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">Blast Radius Bounded to Worker Lease</text>

        <text x="0" y="110" font-size="8" font-style="italic" fill="#64748B">Supervisor retains sole commit authority; workers emit typed diffs, never conversational chatter.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Principle Invariant -->
  <g transform="translate(40, 498)">
    <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0F172A">THE ANTI-SWARM INVARIANT:</text>
    <text x="160" y="12" font-size="8.5" font-style="italic" fill="#334155">"Restricting inter-agent communication to unidirectional delegation and typed artifact returns eliminates O(N²) message livelocks and attention dilution."</text>
  </g>

</svg>
