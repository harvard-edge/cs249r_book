<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#FFFFFF"/>

  <!-- Plot Area: x from 90 to 780 (width 690), y from 40 to 340 (height 300) -->
  <!-- Axes -->
  <line x1="90" y1="340" x2="820" y2="340" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-axis)"/>
  <line x1="90" y1="340" x2="90" y2="25" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-axis)"/>

  <!-- Y-Axis Labels -->
  <text x="75" y="344" text-anchor="end" font-size="8.5" fill="#64748B">0%</text>
  <line x1="86" y1="280" x2="780" y2="280" stroke="#F1F5F9" stroke-width="1"/>
  <text x="75" y="284" text-anchor="end" font-size="8.5" fill="#64748B">20%</text>
  <line x1="86" y1="220" x2="780" y2="220" stroke="#F1F5F9" stroke-width="1"/>
  <text x="75" y="224" text-anchor="end" font-size="8.5" fill="#64748B">40%</text>
  <line x1="86" y1="160" x2="780" y2="160" stroke="#F1F5F9" stroke-width="1"/>
  <text x="75" y="164" text-anchor="end" font-size="8.5" fill="#64748B">60%</text>
  <line x1="86" y1="100" x2="780" y2="100" stroke="#F1F5F9" stroke-width="1"/>
  <text x="75" y="104" text-anchor="end" font-size="8.5" fill="#64748B">80%</text>
  <line x1="86" y1="40" x2="780" y2="40" stroke="#F1F5F9" stroke-width="1"/>
  <text x="75" y="44" text-anchor="end" font-size="8.5" fill="#64748B">100%</text>

  <text x="25" y="180" transform="rotate(-90 25 180)" text-anchor="middle" font-size="10" font-weight="700" fill="#1E293B">Task Success Probability P(success)</text>

  <!-- X-Axis Labels (0k to 8k tokens) -->
  <!-- 0k at 90, 8k at 770 => 85 px per 1k tokens -->
  <text x="90" y="358" text-anchor="middle" font-size="8.5" fill="#64748B">0</text>
  <line x1="175" y1="340" x2="175" y2="40" stroke="#F1F5F9" stroke-width="1"/>
  <text x="175" y="358" text-anchor="middle" font-size="8.5" fill="#64748B">1k</text>
  <line x1="260" y1="340" x2="260" y2="40" stroke="#F1F5F9" stroke-width="1"/>
  <text x="260" y="358" text-anchor="middle" font-size="8.5" fill="#64748B">2k</text>
  <line x1="345" y1="340" x2="345" y2="40" stroke="#F1F5F9" stroke-width="1"/>
  <text x="345" y="358" text-anchor="middle" font-size="8.5" fill="#64748B">3k</text>
  <line x1="430" y1="340" x2="430" y2="40" stroke="#F1F5F9" stroke-width="1"/>
  <text x="430" y="358" text-anchor="middle" font-size="8.5" fill="#64748B">4k</text>
  <line x1="515" y1="340" x2="515" y2="40" stroke="#F1F5F9" stroke-width="1"/>
  <text x="515" y="358" text-anchor="middle" font-size="8.5" fill="#64748B">5k</text>
  <line x1="600" y1="340" x2="600" y2="40" stroke="#F1F5F9" stroke-width="1"/>
  <text x="600" y="358" text-anchor="middle" font-size="8.5" fill="#64748B">6k</text>
  <line x1="685" y1="340" x2="685" y2="40" stroke="#F1F5F9" stroke-width="1"/>
  <text x="685" y="358" text-anchor="middle" font-size="8.5" fill="#64748B">7k</text>
  <line x1="770" y1="340" x2="770" y2="40" stroke="#F1F5F9" stroke-width="1"/>
  <text x="770" y="358" text-anchor="middle" font-size="8.5" fill="#64748B">8k</text>

  <text x="440" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#1E293B">Inference Compute (Total Generated &amp; Evaluated Tokens)</text>

  <!-- Shaded Region: Infeasible Zone (Upper left) -->
  <path d="M 90,340 Q 140,240 243,196 T 438,136 T 557,94 T 702,58 L 780,58 L 780,40 L 90,40 Z" fill="#F8FAFC" opacity="0.6"/>
  <text x="320" y="75" font-size="9" font-style="italic" fill="#94A3B8">Infeasible without ground-truth environmental feedback</text>

  <!-- Pareto Frontier Curve -->
  <!-- Points:
       (1) Greedy Baseline: x = 90 + 0.512*85 = 133.5, y = 340 - 0.32*300 = 244
       (2) Self-Refine (Depth): x = 90 + 1.8*85 = 243, y = 340 - 0.48*300 = 196
       (3) Parallel Best-of-8 (Breadth): x = 90 + 4.096*85 = 438, y = 340 - 0.68*300 = 136
       (4) MCTS + PRM: x = 90 + 5.5*85 = 557.5, y = 340 - 0.82*300 = 94
       (5) ReAct + Feedback: x = 90 + 7.2*85 = 702, y = 340 - 0.94*300 = 58
  -->
  <path d="M 133.5,244 C 180,215 210,205 243,196 C 310,175 380,150 438,136 C 490,120 520,105 557.5,94 C 610,78 660,65 702,58"
        fill="none" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Sub-optimal Points (scattered below frontier) -->
  <circle cx="280" cy="235" r="3.5" fill="#94A3B8"/>
  <text x="290" y="239" font-size="7.5" fill="#64748B">Unguided Re-sampling</text>
  
  <circle cx="480" cy="180" r="3.5" fill="#94A3B8"/>
  <text x="490" y="184" font-size="7.5" fill="#64748B">Adversarial Exploits (N &gt; N*)</text>

  <!-- Point 1: Greedy Baseline -->
  <circle cx="133.5" cy="244" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
  <g transform="translate(145, 240)">
    <rect width="125" height="32" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="8" y="14" font-size="8" font-weight="700" fill="#1E40AF">Greedy Baseline</text>
    <text x="8" y="26" font-size="7.5" fill="#475569">512 tok | P = 32%</text>
  </g>

  <!-- Point 2: Self-Refine -->
  <circle cx="243" cy="196" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
  <g transform="translate(255, 185)">
    <rect width="135" height="32" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="8" y="14" font-size="8" font-weight="700" fill="#1E40AF">Self-Refine (Depth)</text>
    <text x="8" y="26" font-size="7.5" fill="#475569">1.8k tok | P = 48%</text>
  </g>

  <!-- Point 3: Best-of-8 -->
  <circle cx="438" cy="136" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
  <g transform="translate(450, 125)">
    <rect width="145" height="32" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="8" y="14" font-size="8" font-weight="700" fill="#92400E">Parallel Best-of-8 (Breadth)</text>
    <text x="8" y="26" font-size="7.5" fill="#475569">4.1k tok | P = 68% (9% FAR)</text>
  </g>

  <!-- Point 4: MCTS + PRM -->
  <circle cx="557.5" cy="94" r="5.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
  <g transform="translate(570, 85)">
    <rect width="140" height="32" rx="3" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1"/>
    <text x="8" y="14" font-size="8" font-weight="700" fill="#5B21B6">MCTS + Step PRM</text>
    <text x="8" y="26" font-size="7.5" fill="#475569">5.5k tok | P = 82%</text>
  </g>

  <!-- Point 5: ReAct + Feedback -->
  <circle cx="702" cy="58" r="6" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <g transform="translate(620, 20)">
    <rect width="185" height="32" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <text x="8" y="14" font-size="8" font-weight="700" fill="#14532D">ReAct + Tool Feedback (Oracle)</text>
    <text x="8" y="26" font-size="7.5" fill="#15803D">7.2k tok | P = 94% ★ Optimal</text>
  </g>
</svg>
