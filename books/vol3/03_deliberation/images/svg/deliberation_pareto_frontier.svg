<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .axis-lbl { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .tick-txt { font-size: 9px; fill: #475569; }
      .point-title { font-size: 8.5px; font-weight: 700; }
      .point-sub { font-size: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; }
      .callout-txt { font-size: 8px; fill: #64748b; }
      .curve-lbl { font-size: 8.5px; font-weight: 700; fill: #0284c7; }
    </style>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="940" height="410" fill="#ffffff"/>

  <!-- Plot Area: x from 80 to 860, y from 30 to 330 -->
  <!-- Shaded Infeasible Region (Upper Left) -->
  <path d="M 80,330 Q 140,190 260,130 T 455,81 T 840,45 L 840,30 L 80,30 Z" fill="#f8fafc" opacity="0.8"/>
  <text x="110" y="52" font-size="8.5" font-style="italic" fill="#94a3b8">Infeasible Region (requires ground-truth execution feedback)</text>

  <!-- Horizontal Grid Lines & Y Ticks -->
  <line x1="80" y1="330" x2="860" y2="330" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="270" x2="840" y2="270" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="210" x2="840" y2="210" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="150" x2="840" y2="150" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="90"  x2="840" y2="90"  stroke="#f1f5f9" stroke-width="1"/>
  <line x1="80" y1="30"  x2="840" y2="30"  stroke="#f1f5f9" stroke-width="1"/>

  <text x="70" y="334" class="tick-txt" text-anchor="end">0%</text>
  <text x="70" y="274" class="tick-txt" text-anchor="end">20%</text>
  <text x="70" y="214" class="tick-txt" text-anchor="end">40%</text>
  <text x="70" y="154" class="tick-txt" text-anchor="end">60%</text>
  <text x="70" y="94"  class="tick-txt" text-anchor="end">80%</text>
  <text x="70" y="34"  class="tick-txt" text-anchor="end">100%</text>

  <!-- Vertical Grid Lines & X Ticks (1k = 76px) -->
  <line x1="156" y1="330" x2="156" y2="30" stroke="#f1f5f9" stroke-width="1"/>
  <text x="156" y="348" class="tick-txt" text-anchor="middle">1k</text>

  <line x1="232" y1="330" x2="232" y2="30" stroke="#f1f5f9" stroke-width="1"/>
  <text x="232" y="348" class="tick-txt" text-anchor="middle">2k</text>

  <line x1="308" y1="330" x2="308" y2="30" stroke="#f1f5f9" stroke-width="1"/>
  <text x="308" y="348" class="tick-txt" text-anchor="middle">3k</text>

  <line x1="384" y1="330" x2="384" y2="30" stroke="#f1f5f9" stroke-width="1"/>
  <text x="384" y="348" class="tick-txt" text-anchor="middle">4k</text>

  <line x1="460" y1="330" x2="460" y2="30" stroke="#f1f5f9" stroke-width="1"/>
  <text x="460" y="348" class="tick-txt" text-anchor="middle">5k</text>

  <line x1="536" y1="330" x2="536" y2="30" stroke="#f1f5f9" stroke-width="1"/>
  <text x="536" y="348" class="tick-txt" text-anchor="middle">6k</text>

  <line x1="612" y1="330" x2="612" y2="30" stroke="#f1f5f9" stroke-width="1"/>
  <text x="612" y="348" class="tick-txt" text-anchor="middle">7k</text>

  <line x1="688" y1="330" x2="688" y2="30" stroke="#f1f5f9" stroke-width="1"/>
  <text x="688" y="348" class="tick-txt" text-anchor="middle">8k</text>

  <line x1="764" y1="330" x2="764" y2="30" stroke="#f1f5f9" stroke-width="1"/>
  <text x="764" y="348" class="tick-txt" text-anchor="middle">9k</text>

  <line x1="840" y1="330" x2="840" y2="30" stroke="#f1f5f9" stroke-width="1"/>
  <text x="840" y="348" class="tick-txt" text-anchor="middle">10k</text>

  <text x="80" y="348" class="tick-txt" text-anchor="middle">0</text>

  <!-- Axes Lines -->
  <line x1="80" y1="330" x2="875" y2="330" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-axis)"/>
  <line x1="80" y1="330" x2="80"  y2="20"  stroke="#475569" stroke-width="1.4" marker-end="url(#arr-axis)"/>

  <text x="-180" y="24" class="axis-lbl" transform="rotate(-90)" text-anchor="middle">Task Success Probability P(success)</text>
  <text x="470" y="375" class="axis-lbl" text-anchor="middle">Inference Compute Cost C_eff (Tokens / Successful Task)</text>

  <!-- Pareto Frontier Curve -->
  <path d="M 168,198 C 240,160 360,105 455,81 C 560,60 690,52 840,48"
        fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <text x="570" y="44" class="curve-lbl">Empirical Pareto Frontier (with Tool Grounding)</text>

  <!-- Sub-optimal / Off-Frontier Points -->
  <circle cx="280" cy="240" r="4" fill="#94a3b8"/>
  <text x="290" y="244" class="callout-txt">Unguided Re-sampling (Basin Collapse)</text>

  <circle cx="670" cy="200" r="4" fill="#94a3b8"/>
  <text x="680" y="204" class="callout-txt">Adversarial Exploits (Verifier Goodharting, N &gt; N*)</text>

  <!-- Point 1: Greedy Baseline (168, 198) -->
  <circle cx="168" cy="198" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="168" y1="198" x2="168" y2="225" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <g transform="translate(100, 225)">
    <rect width="136" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="8" y="14" class="point-title" fill="#0369a1">Greedy Single-Shot</text>
    <text x="8" y="27" class="point-sub" fill="#475569">1,163 tok | P = 44%</text>
  </g>

  <!-- Point 2: Self-Refine (Depth 4) (421, 156) -->
  <circle cx="421" cy="156" r="5.5" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="421" y1="156" x2="390" y2="175" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <g transform="translate(230, 175)">
    <rect width="160" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="8" y="14" class="point-title" fill="#334155">Self-Refine (Depth 4)</text>
    <text x="8" y="27" class="point-sub" fill="#64748b">4,482 tok | P = 58% (4% FAR)</text>
  </g>

  <!-- Point 3: Best-of-8 (Breadth) (518, 117) -->
  <circle cx="518" cy="117" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="518" y1="117" x2="518" y2="140" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
  <g transform="translate(435, 140)">
    <rect width="165" height="34" rx="3" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="8" y="14" class="point-title" fill="#92400e">Best-of-8 Sampling</text>
    <text x="8" y="27" class="point-sub" fill="#b45309">5,769 tok | P = 71% (8% FAR)</text>
  </g>

  <!-- Point 4: MCTS + Learned PRM (740, 102) -->
  <circle cx="740" cy="102" r="5.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="740" y1="102" x2="740" y2="125" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2,2"/>
  <g transform="translate(650, 125)">
    <rect width="170" height="34" rx="3" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/>
    <text x="8" y="14" class="point-title" fill="#5b21b6">MCTS + Learned PRM</text>
    <text x="8" y="27" class="point-sub" fill="#7c3aed">8,684 tok | P = 76% (11% FAR)</text>
  </g>

  <!-- Point 5: ReAct + Execution Feedback (Dominant Frontier Point: 455, 81) -->
  <circle cx="455" cy="81" r="6.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.8"/>
  <line x1="455" y1="62" x2="455" y2="81" stroke="#16a34a" stroke-width="1.2"/>
  <g transform="translate(365, 26)">
    <rect width="180" height="36" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="8" y="15" class="point-title" fill="#15803d">ReAct + Tool Feedback</text>
    <text x="8" y="29" class="point-sub" fill="#166534">4,939 tok | P = 83% (3% FAR)</text>
  </g>
</svg>
