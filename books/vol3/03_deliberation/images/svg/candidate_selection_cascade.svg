<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#334155"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#16A34A"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#FFFFFF"/>

  <!-- Top Pool -->
  <g transform="translate(190, 16)">
    <rect width="500" height="42" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
    <text x="250" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">CANDIDATE GENERATION POOL:  <tspan font-family="'SFMono-Regular', Consolas, monospace" fill="#2563EB">C = {y⁽¹⁾, y⁽²⁾, ..., y⁽ᴺ⁾}</tspan></text>
  </g>

  <!-- Line to Tier 1 -->
  <line x1="440" y1="58" x2="440" y2="82" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-slate)"/>

  <!-- Tier 1: Deterministic Filtering -->
  <g transform="translate(190, 84)">
    <rect width="500" height="66" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.4"/>
    <rect width="500" height="24" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#1E40AF">TIER 1: DETERMINISTIC FILTERING</text>
    <text x="486" y="16" text-anchor="end" font-size="8.5" font-weight="600" fill="#2563EB">Cost: 0 FLOPs (CPU / Tree-sitter)</text>
    <text x="14" y="42" font-size="9" font-weight="600" fill="#1E293B">• AST Syntax Validation, Strict Type Checks, Static Lints</text>
    <text x="14" y="56" font-size="8.5" fill="#475569">• Immediate discard of malformed JSON, unclosed quotes, and forbidden imports</text>
  </g>
  
  <!-- Tier 1 Reject Branch -->
  <line x1="690" y1="117" x2="770" y2="117" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <rect x="772" y="103" width="94" height="28" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
  <text x="819" y="121" text-anchor="middle" font-size="8" font-weight="700" fill="#991B1B">Prune Syntax Errors</text>

  <!-- Line to Tier 2 -->
  <line x1="440" y1="150" x2="440" y2="174" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-slate)"/>
  <text x="450" y="166" font-size="8" font-style="italic" fill="#64748B">Surviving Pool C_filt</text>

  <!-- Tier 2: Equivalence Clustering -->
  <g transform="translate(190, 176)">
    <rect width="500" height="66" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.4"/>
    <rect width="500" height="24" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#92400E">TIER 2: EQUIVALENCE CLUSTERING &amp; SELF-CONSISTENCY</text>
    <text x="486" y="16" text-anchor="end" font-size="8.5" font-weight="600" fill="#D97706">Cost: Low CPU (Canonicalization)</text>
    <text x="14" y="42" font-size="9" font-weight="600" fill="#1E293B">• Partitions candidates into semantic equivalence classes: [y]~</text>
    <text x="14" y="56" font-size="8.5" fill="#475569">• Resolves surface syntactic variance; identifies dominant consensus modes</text>
  </g>

  <!-- Line to Tier 3 -->
  <line x1="440" y1="242" x2="440" y2="266" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-slate)"/>
  <text x="450" y="258" font-size="8" font-style="italic" fill="#64748B">Clustered Modes [y]~</text>

  <!-- Tier 3: Learned Verification -->
  <g transform="translate(190, 268)">
    <rect width="500" height="66" rx="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.4"/>
    <rect width="500" height="24" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.4"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#5B21B6">TIER 3: PROCESS &amp; OUTCOME VERIFICATION (PRM / ORM)</text>
    <text x="486" y="16" text-anchor="end" font-size="8.5" font-weight="600" fill="#7C3AED">Cost: Model Scoring Forward Passes</text>
    <text x="14" y="42" font-size="9" font-weight="600" fill="#1E293B">• Step-level progress verification; detects hallucinated intermediate leaps</text>
    <text x="14" y="56" font-size="8.5" fill="#475569">• Evaluates invariant closure against problem specification before physical execution</text>
  </g>
  
  <!-- Tier 3 Reject Branch -->
  <line x1="690" y1="301" x2="770" y2="301" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <rect x="772" y="287" width="94" height="28" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
  <text x="819" y="305" text-anchor="middle" font-size="8" font-weight="700" fill="#991B1B">Prune Low Score</text>

  <!-- Final Line to Certified Trajectory -->
  <line x1="440" y1="334" x2="440" y2="352" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <g transform="translate(300, 352)">
    <rect width="280" height="24" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/>
    <text x="140" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532D">CERTIFIED OPTIMAL TRAJECTORY  y*</text>
  </g>
</svg>
