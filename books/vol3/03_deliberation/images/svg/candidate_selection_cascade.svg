<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#475569"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#ffffff"/>

  <!-- Top: Candidate Generation Pool -->
  <g transform="translate(180, 14)">
    <rect width="500" height="46" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="250" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Staged Candidate Pool</text>
    <text x="250" y="38" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#0284c7">C = {y⁽¹⁾, y⁽²⁾, ..., y⁽ᴺ⁾}  (N independent decodes)</text>
  </g>

  <!-- Down arrow to Tier 1 -->
  <line x1="430" y1="60" x2="430" y2="82" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>

  <!-- TIER 1: Deterministic Filtering -->
  <g transform="translate(140, 84)">
    <rect width="580" height="74" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="580" height="26" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="17" font-size="10" font-weight="700" fill="#0369a1">Tier 1: Deterministic Structural Filtering</text>
    <text x="566" y="17" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#0284c7">Cost: 0 FLOPs (CPU / AST, &lt;2 ms)</text>
    
    <text x="14" y="44" font-size="9.5" font-weight="600" fill="#334155">Operations:</text>
    <text x="88" y="44" font-size="9" fill="#0f172a">AST parse · schema · types · linters</text>

    <text x="14" y="62" font-size="9.5" font-weight="600" fill="#334155">Drop Rule:</text>
    <text x="88" y="62" font-size="9" fill="#b91c1c">Discards malformed JSON-RPC payloads, unclosed tokens, unauthorized imports</text>
  </g>

  <!-- Tier 1 Rejection Path -->
  <line x1="720" y1="121" x2="790" y2="121" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <rect x="792" y="105" width="148" height="32" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="866" y="120" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Syntax Error Drop</text>
  <text x="866" y="131" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#7f1d1d">R_syntax (Zero GPU FLOPs)</text>

  <!-- Down arrow to Tier 2 -->
  <line x1="430" y1="158" x2="430" y2="180" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>
  <text x="440" y="172" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">C_filt (valid syntax)</text>

  <!-- TIER 2: Semantic Equivalence & Consensus -->
  <g transform="translate(140, 182)">
    <rect width="580" height="74" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="580" height="26" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="14" y="17" font-size="10" font-weight="700" fill="#92400e">Tier 2: Equivalence Clustering &amp; Self-Consistency</text>
    <text x="566" y="17" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#d97706">Cost: Low CPU (Canonical Hashing)</text>

    <text x="14" y="44" font-size="9.5" font-weight="600" fill="#334155">Operations:</text>
    <text x="88" y="44" font-size="9" fill="#0f172a">Partitions candidates into semantic equivalence classes [y]~ via AST canonicalization</text>

    <text x="14" y="62" font-size="9.5" font-weight="600" fill="#334155">Selection:</text>
    <text x="88" y="62" font-size="9" fill="#0f172a">Plurality consensus · filter outliers</text>
  </g>

  <!-- Tier 2 Rejection Path -->
  <line x1="720" y1="219" x2="790" y2="219" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <rect x="792" y="203" width="148" height="32" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="866" y="218" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Prune Divergent Modes</text>
  <text x="866" y="229" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#7f1d1d">R_divergent (Low consensus)</text>

  <!-- Down arrow to Tier 3 -->
  <line x1="430" y1="256" x2="430" y2="278" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>
  <text x="440" y="270" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">Modes [y]~ (plurality)</text>

  <!-- TIER 3: Process & Outcome Verification -->
  <g transform="translate(140, 280)">
    <rect width="580" height="74" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="580" height="26" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="14" y="17" font-size="10" font-weight="700" fill="#5b21b6">Tier 3: Process Reward &amp; Invariant Verification</text>
    <text x="566" y="17" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#7c3aed">Cost: PRM Forward Passes &amp; Sandbox</text>

    <text x="14" y="44" font-size="9.5" font-weight="600" fill="#334155">Operations:</text>
    <text x="88" y="44" font-size="9" fill="#0f172a">PRM scoring · sandbox tests · assertions</text>

    <text x="14" y="62" font-size="9.5" font-weight="600" fill="#334155">Drop Rule:</text>
    <text x="88" y="62" font-size="9" fill="#b91c1c">Prunes hallucinated reasoning leaps, failing assertions, or candidates below threshold τ_accept</text>
  </g>

  <!-- Tier 3 Rejection Path -->
  <line x1="720" y1="317" x2="790" y2="317" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <rect x="792" y="301" width="148" height="32" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="866" y="316" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Prune Low-Utility / Exploit</text>
  <text x="866" y="327" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#7f1d1d">R_score (Score &lt; τ_accept)</text>

  <!-- Down arrow to Output -->
  <line x1="430" y1="354" x2="430" y2="368" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- Output: Certified Optimal Trajectory -->
  <g transform="translate(250, 368)">
    <rect width="360" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="180" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">Certified Action Trajectory: y*  (Committed to Environment)</text>
  </g>
</svg>
