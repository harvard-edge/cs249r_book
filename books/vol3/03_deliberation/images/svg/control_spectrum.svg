<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="spectrum-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="25%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="75%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="560" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="520" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE ARCHITECTURAL SPECTRUM OF AGENTIC CONTROL</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Progression from deterministic pipelines to open-ended autonomous execution loops</text>

  <!-- Spectrum Arrow Bar -->
  <g transform="translate(40, 68)">
    <rect width="880" height="6" rx="1" fill="url(#spectrum-grad)"/>
    <text x="0" y="-4" font-size="7.5" font-weight="700" fill="#0284c7">DETERMINISTIC CONTROL</text>
    <text x="880" y="-4" text-anchor="end" font-size="7.5" font-weight="700" fill="#9333ea">AUTONOMOUS SEARCH</text>
  </g>

  <!-- ================================================================= -->
  <!-- 5 ARCHITECTURAL COLUMNS                                           -->
  <!-- ================================================================= -->

  <!-- Column 1: Prompt Chaining -->
  <g transform="translate(40, 84)">
    <rect width="168" height="318" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="168" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="84" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">1. Prompt Chaining</text>

    <!-- Visual Diagram -->
    <g transform="translate(14, 34)">
      <rect x="15" y="0" width="110" height="26" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="70" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Step A (LLM)</text>

      <line x1="70" y1="26" x2="70" y2="44" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

      <rect x="15" y="46" width="110" height="26" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="70" y="62" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Step B (LLM)</text>

      <line x1="70" y1="72" x2="70" y2="90" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

      <rect x="15" y="92" width="110" height="26" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="70" y="108" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Step C (LLM)</text>
    </g>

    <!-- Properties -->
    <g transform="translate(10, 168)">
      <rect width="148" height="140" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Characteristics:</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">• Fixed sequential pipeline</text>
      <text x="8" y="46" font-size="7.5" fill="#334155">• Static hardcoded edges</text>
      <text x="8" y="60" font-size="7.5" fill="#334155">• Zero dynamic branching</text>
      <text x="8" y="74" font-size="7.5" fill="#334155">• Trivial verification</text>
      <text x="8" y="88" font-size="7.5" fill="#334155">• Stateless transitions</text>
      <rect x="6" y="102" width="136" height="26" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="74" y="118" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">Latency: O(1) Bounded</text>
    </g>
  </g>

  <!-- Column 2: Routing -->
  <g transform="translate(218, 84)">
    <rect width="168" height="318" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="168" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="84" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e40af">2. Routing &amp; Dispatch</text>

    <!-- Visual Diagram -->
    <g transform="translate(14, 34)">
      <polygon points="70,0 125,18 70,36 15,18" fill="#f8fafc" stroke="#2563eb" stroke-width="1.2"/>
      <text x="70" y="21" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">Router LLM</text>

      <path d="M 38 29 L 22 56" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <path d="M 70 36 L 70 56" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <path d="M 102 29 L 118 56" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

      <rect x="0" y="60" width="42" height="24" rx="1" fill="#f8fafc" stroke="#2563eb" stroke-width="1"/>
      <text x="21" y="75" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0f172a">Path A</text>

      <rect x="49" y="60" width="42" height="24" rx="1" fill="#f8fafc" stroke="#2563eb" stroke-width="1"/>
      <text x="70" y="75" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0f172a">Path B</text>

      <rect x="98" y="60" width="42" height="24" rx="1" fill="#f8fafc" stroke="#2563eb" stroke-width="1"/>
      <text x="119" y="75" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0f172a">Path C</text>
    </g>

    <!-- Properties -->
    <g transform="translate(10, 168)">
      <rect width="148" height="140" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Characteristics:</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">• Dynamic single branch</text>
      <text x="8" y="46" font-size="7.5" fill="#334155">• Domain specialization</text>
      <text x="8" y="60" font-size="7.5" fill="#334155">• Small blast radius</text>
      <text x="8" y="74" font-size="7.5" fill="#334155">• Deterministic schema</text>
      <text x="8" y="88" font-size="7.5" fill="#334155">• Semantic intent gate</text>
      <rect x="6" y="102" width="136" height="26" rx="1" fill="#dbeafe" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="74" y="118" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1e40af">Dispatch: 1-of-K Branch</text>
    </g>
  </g>

  <!-- Column 3: Parallel Fan-Out -->
  <g transform="translate(396, 84)">
    <rect width="168" height="318" rx="2" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <rect width="168" height="24" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="84" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#3730a3">3. Parallel Fan-Out</text>

    <!-- Visual Diagram -->
    <g transform="translate(14, 34)">
      <rect x="25" y="0" width="90" height="20" rx="1" fill="#f8fafc" stroke="#4f46e5" stroke-width="1"/>
      <text x="70" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#3730a3">Dispatch Task</text>

      <path d="M 40 20 L 21 38" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <path d="M 70 20 L 70 38" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <path d="M 100 20 L 119 38" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

      <rect x="0" y="42" width="42" height="22" rx="1" fill="#f8fafc" stroke="#4f46e5" stroke-width="1"/>
      <text x="21" y="56" text-anchor="middle" font-size="7" font-weight="600" fill="#0f172a">Worker 1</text>

      <rect x="49" y="42" width="42" height="22" rx="1" fill="#f8fafc" stroke="#4f46e5" stroke-width="1"/>
      <text x="70" y="56" text-anchor="middle" font-size="7" font-weight="600" fill="#0f172a">Worker 2</text>

      <rect x="98" y="42" width="42" height="22" rx="1" fill="#f8fafc" stroke="#4f46e5" stroke-width="1"/>
      <text x="119" y="56" text-anchor="middle" font-size="7" font-weight="600" fill="#0f172a">Worker 3</text>

      <path d="M 21 64 L 42 82" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <path d="M 70 64 L 70 82" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <path d="M 119 64 L 98 82" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

      <rect x="25" y="86" width="90" height="20" rx="1" fill="#f8fafc" stroke="#4f46e5" stroke-width="1"/>
      <text x="70" y="100" text-anchor="middle" font-size="8" font-weight="700" fill="#3730a3">Aggregator</text>
    </g>

    <!-- Properties -->
    <g transform="translate(10, 168)">
      <rect width="148" height="140" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Characteristics:</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">• Concurrent execution</text>
      <text x="8" y="46" font-size="7.5" fill="#334155">• Sectioning &amp; voting</text>
      <text x="8" y="60" font-size="7.5" fill="#334155">• High GPU throughput</text>
      <text x="8" y="74" font-size="7.5" fill="#334155">• Barrier join barrier</text>
      <text x="8" y="88" font-size="7.5" fill="#334155">• Map-Reduce paradigm</text>
      <rect x="6" y="102" width="136" height="26" rx="1" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="0.8"/>
      <text x="74" y="118" text-anchor="middle" font-size="7.5" font-weight="700" fill="#3730a3">Execution: Concurrent Batch</text>
    </g>
  </g>

  <!-- Column 4: Supervisor-Workers -->
  <g transform="translate(574, 84)">
    <rect width="168" height="318" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="168" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="84" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">4. Supervisor-Workers</text>

    <!-- Visual Diagram -->
    <g transform="translate(14, 34)">
      <rect x="15" y="0" width="110" height="24" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="70" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Supervisor DAG</text>

      <line x1="45" y1="24" x2="30" y2="48" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <line x1="30" y1="48" x2="45" y2="24" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="2 2"/>

      <line x1="95" y1="24" x2="110" y2="48" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <line x1="110" y1="48" x2="95" y2="24" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="2 2"/>

      <rect x="0" y="52" width="60" height="24" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/>
      <text x="30" y="67" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0f172a">Worker 1</text>

      <rect x="80" y="52" width="60" height="24" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/>
      <text x="110" y="67" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0f172a">Worker 2</text>

      <rect x="10" y="86" width="120" height="20" rx="1" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.8"/>
      <text x="70" y="100" text-anchor="middle" font-size="7" font-weight="700" fill="#6d28d9">Context Isolation Barrier</text>
    </g>

    <!-- Properties -->
    <g transform="translate(10, 168)">
      <rect width="148" height="140" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Characteristics:</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">• Dynamic task breakdown</text>
      <text x="8" y="46" font-size="7.5" fill="#334155">• Unidirectional control</text>
      <text x="8" y="60" font-size="7.5" fill="#334155">• Isolated worker contexts</text>
      <text x="8" y="74" font-size="7.5" fill="#334155">• The Anti-Swarm core</text>
      <text x="8" y="88" font-size="7.5" fill="#334155">• Enforces invariants</text>
      <rect x="6" y="102" width="136" height="26" rx="1" fill="#ede9fe" stroke="#ddd6fe" stroke-width="0.8"/>
      <text x="74" y="118" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Standard: Production Scale</text>
    </g>
  </g>

  <!-- Column 5: Autonomous Loops -->
  <g transform="translate(752, 84)">
    <rect width="168" height="318" rx="2" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
    <rect width="168" height="24" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="84" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7e22ce">5. Autonomous Loops</text>

    <!-- Visual Diagram -->
    <g transform="translate(14, 34)">
      <circle cx="70" cy="54" r="42" fill="none" stroke="#e9d5ff" stroke-width="2"/>
      
      <rect x="25" y="2" width="90" height="20" rx="1" fill="#f8fafc" stroke="#9333ea" stroke-width="1"/>
      <text x="70" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Thought (LLM)</text>

      <rect x="82" y="42" width="56" height="20" rx="1" fill="#f8fafc" stroke="#9333ea" stroke-width="1"/>
      <text x="110" y="56" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Action</text>

      <rect x="2" y="42" width="56" height="20" rx="1" fill="#f8fafc" stroke="#9333ea" stroke-width="1"/>
      <text x="30" y="56" text-anchor="middle" font-size="7" font-weight="700" fill="#6d28d9">Observation</text>

      <rect x="25" y="86" width="90" height="20" rx="1" fill="#fdf2f8" stroke="#db2777" stroke-width="0.8"/>
      <text x="70" y="100" text-anchor="middle" font-size="7" font-weight="700" fill="#9d174d">Env / Sandbox</text>

      <path d="M 70 22 C 95 22 110 32 110 42" fill="none" stroke="#9333ea" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <path d="M 110 62 C 100 80 85 86 70 86" fill="none" stroke="#9333ea" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <path d="M 70 86 C 50 86 30 80 30 62" fill="none" stroke="#9333ea" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <path d="M 30 42 C 30 32 45 22 70 22" fill="none" stroke="#9333ea" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    </g>

    <!-- Properties -->
    <g transform="translate(10, 168)">
      <rect width="148" height="140" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Characteristics:</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">• Cyclic feedback loops</text>
      <text x="8" y="46" font-size="7.5" fill="#334155">• ReAct &amp; Reflexion</text>
      <text x="8" y="60" font-size="7.5" fill="#334155">• Risk: semantic livelock</text>
      <text x="8" y="74" font-size="7.5" fill="#334155">• Requires watchdog FSM</text>
      <text x="8" y="88" font-size="7.5" fill="#334155">• Heavy-tailed token spend</text>
      <rect x="6" y="102" width="136" height="26" rx="1" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="0.8"/>
      <text x="74" y="118" text-anchor="middle" font-size="7.5" font-weight="700" fill="#7e22ce">Budget: Dynamic O(T)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM COMPARATIVE AXES                                           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 412)">
    <rect width="880" height="114" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="880" height="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#0f172a">ARCHITECTURAL TRADE-OFF TRAJECTORIES</text>

    <!-- Dimension 1: Autonomy vs Determinism -->
    <g transform="translate(16, 26)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#0f172a">Model Autonomy</text>
      <rect x="130" y="6" width="715" height="6" rx="1" fill="#e2e8f0"/>
      <rect x="130" y="6" width="715" height="6" rx="1" fill="url(#spectrum-grad)"/>
      <text x="130" y="22" font-size="7" fill="#64748b">Strictly Hardcoded Flow</text>
      <text x="487" y="22" text-anchor="middle" font-size="7" fill="#64748b">Supervised Delegation</text>
      <text x="845" y="22" text-anchor="end" font-size="7" fill="#64748b">Self-Directed Search</text>
    </g>

    <!-- Dimension 2: Verification Complexity -->
    <g transform="translate(16, 56)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#0f172a">Verification Burden</text>
      <rect x="130" y="6" width="715" height="6" rx="1" fill="#e2e8f0"/>
      <path d="M 130 9 Q 487 9 845 6" stroke="#dc2626" stroke-width="3" fill="none"/>
      <text x="130" y="22" font-size="7" fill="#64748b">Unit Tests &amp; JSON Schema</text>
      <text x="487" y="22" text-anchor="middle" font-size="7" fill="#64748b">Contract Invariants &amp; PRM</text>
      <text x="845" y="22" text-anchor="end" font-size="7" font-weight="700" fill="#dc2626">Watchdogs, Breakers &amp; State Hashing</text>
    </g>

    <!-- Dimension 3: Cost & Latency Risk -->
    <g transform="translate(16, 84)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#0f172a">Cost &amp; Latency Risk</text>
      <rect x="130" y="6" width="715" height="6" rx="1" fill="#e2e8f0"/>
      <line x1="130" y1="9" x2="845" y2="9" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="150" cy="9" r="3.5" fill="#0284c7"/>
      <circle cx="300" cy="9" r="3.5" fill="#2563eb"/>
      <circle cx="487" cy="9" r="3.5" fill="#4f46e5"/>
      <circle cx="670" cy="9" r="3.5" fill="#7c3aed"/>
      <circle cx="830" cy="9" r="3.5" fill="#9333ea"/>
      <text x="130" y="22" font-size="7" fill="#64748b">Deterministic O(1) Tokens</text>
      <text x="487" y="22" text-anchor="middle" font-size="7" fill="#64748b">Predictable Workload Bounds</text>
      <text x="845" y="22" text-anchor="end" font-size="7" font-weight="700" fill="#7c3aed">Heavy-Tailed Dynamic Variance</text>
    </g>
  </g>
</svg>
