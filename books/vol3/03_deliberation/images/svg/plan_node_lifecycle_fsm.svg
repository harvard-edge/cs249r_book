<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .state-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; text-anchor: middle; }
      .state-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle; fill: #475569; }
      .trans-lbl { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1080" height="390" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- States -->
  <!-- State 1: PENDING -->
  <g transform="translate(45, 55)">
    <rect width="130" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="65" y="28" class="state-lbl" fill="#334155">PENDING</text>
    <text x="65" y="48" class="state-desc">Awaiting Ancestors</text>
  </g>

  <!-- State 2: READY -->
  <g transform="translate(265, 55)">
    <rect width="130" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="65" y="28" class="state-lbl" fill="#1d4ed8">READY</text>
    <text x="65" y="48" class="state-desc">Preds OK, P_i(S)=1</text>
  </g>

  <!-- State 3: EXECUTING -->
  <g transform="translate(485, 55)">
    <rect width="130" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="65" y="28" class="state-lbl" fill="#b45309">EXECUTING</text>
    <text x="65" y="48" class="state-desc">Sandbox In-Flight</text>
  </g>

  <!-- State 4: VERIFIED (Terminal Success) -->
  <g transform="translate(805, 55)">
    <rect width="165" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="82" y="28" class="state-lbl" fill="#047857">VERIFIED ★</text>
    <text x="82" y="48" class="state-desc">O_i ≈ O_i* (Committed)</text>
  </g>

  <!-- State 5: FAILED -->
  <g transform="translate(485, 185)">
    <rect width="130" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="65" y="28" class="state-lbl" fill="#b91c1c">FAILED</text>
    <text x="65" y="48" class="state-desc">P_i=0 or O_i≠O_i*</text>
  </g>

  <!-- State 6: INVALIDATED -->
  <g transform="translate(805, 185)">
    <rect width="165" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="82" y="28" class="state-lbl" fill="#475569">INVALIDATED</text>
    <text x="82" y="48" class="state-desc">Desc(v_fail) Pruned</text>
  </g>

  <!-- Transitions with clean labels -->
  <!-- Pending -> Ready -->
  <path d="M 175 135 L 263 135" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="180" y="62" width="78" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="219" y="75" class="trans-lbl" fill="#1d4ed8">Preds Done</text>

  <!-- Ready -> Executing -->
  <path d="M 395 135 L 483 135" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <rect x="400" y="62" width="80" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="440" y="75" class="trans-lbl" fill="#b45309">P_i(S) == 1</text>

  <!-- Executing -> Verified -->
  <path d="M 615 135 L 803 135" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="635" y="65" width="148" height="18" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="709" y="78" class="trans-lbl" fill="#047857">Checks Pass &amp; O_i ≈ O_i*</text>

  <!-- Executing -> Failed -->
  <path d="M 550 165 L 550 233" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="560" y="140" width="140" height="18" rx="3" fill="#ffffff" stroke="#fecaca"/>
  <text x="630" y="153" class="trans-lbl" fill="#b91c1c" text-anchor="middle">Postcondition Mismatch</text>

  <!-- Failed -> Invalidated -->
  <path d="M 615 265 L 803 265" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <rect x="635" y="200" width="148" height="18" rx="3" fill="#ffffff" stroke="#fecaca"/>
  <text x="709" y="213" class="trans-lbl" fill="#b91c1c">Cascade to Desc(v_fail)</text>

  <!-- Bottom Explanatory Card -->
  <rect x="20" y="290" width="1040" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="315" class="card-text" font-weight="700" fill="#1e293b">Invariant Dispatch Rule:</text>
  <text x="35" y="335" class="card-text">A node cannot enter Ready until all predecessors reach VERIFIED. Preconditions P_i(S) are evaluated against physical environment S</text>
  <text x="35" y="353" class="card-text">immediately prior to dispatch. Failure triggers immediate BFS invalidation of all causal descendants while preserving disjoint branches in Memory Escrow.</text>
</svg>