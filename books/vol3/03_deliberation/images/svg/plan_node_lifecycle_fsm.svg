<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .state-title { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .state-sub { font-size: 10px; text-anchor: middle; fill: #475569; }
      .edge-label { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-slate" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="980" height="340" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- STATE NODES                                                       -->
  <!-- ================================================================= -->

  <!-- State 1: PENDING -->
  <g transform="translate(30, 60)">
    <rect width="130" height="64" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="65" y="28" class="state-title" fill="#334155">Pending</text>
    <text x="65" y="46" class="state-sub">Awaiting Ancestors</text>
  </g>

  <!-- State 2: READY -->
  <g transform="translate(260, 60)">
    <rect width="130" height="64" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.3"/>
    <text x="65" y="28" class="state-title" fill="#0369a1">Ready</text>
    <text x="65" y="46" class="state-sub">Preds Verified</text>
  </g>

  <!-- State 3: EXECUTING -->
  <g transform="translate(490, 60)">
    <rect width="130" height="64" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
    <text x="65" y="28" class="state-title" fill="#92400e">Executing</text>
    <text x="65" y="46" class="state-sub">Sandbox In-Flight</text>
  </g>

  <!-- State 4: VERIFIED (Terminal Success) -->
  <g transform="translate(770, 60)">
    <rect width="160" height="64" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="80" y="28" class="state-title" fill="#15803d">Verified</text>
    <text x="80" y="46" class="state-sub">o_i ≈ O_i* (Committed)</text>
  </g>

  <!-- State 5: FAILED -->
  <g transform="translate(490, 210)">
    <rect width="130" height="64" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="65" y="28" class="state-title" fill="#b91c1c">Failed</text>
    <text x="65" y="46" class="state-sub">o_i ≠ O_i* or Crash</text>
  </g>

  <!-- State 6: INVALIDATED -->
  <g transform="translate(770, 210)">
    <rect width="160" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,4"/>
    <text x="80" y="28" class="state-title" fill="#475569">Invalidated</text>
    <text x="80" y="46" class="state-sub">Desc(v_fail) Pruned</text>
  </g>

  <!-- ================================================================= -->
  <!-- TRANSITION EDGES & GUARDS                                         -->
  <!-- ================================================================= -->

  <!-- Pending -> Ready -->
  <line x1="160" y1="92" x2="258" y2="92" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <rect x="170" y="72" width="78" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="209" y="84" class="edge-label" fill="#0369a1">Preds Done</text>

  <!-- Ready -> Executing -->
  <line x1="390" y1="92" x2="488" y2="92" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-amber)"/>
  <rect x="400" y="72" width="80" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="440" y="84" class="edge-label" fill="#92400e">P_i(S) == 1</text>

  <!-- Executing -> Verified -->
  <line x1="620" y1="92" x2="768" y2="92" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <rect x="638" y="72" width="112" height="18" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
  <text x="694" y="84" class="edge-label" fill="#15803d">o_i ≈ O_i* (Pass)</text>

  <!-- Executing -> Failed -->
  <line x1="555" y1="124" x2="555" y2="208" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="566" y="156" width="130" height="18" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="631" y="168" class="edge-label" fill="#b91c1c" text-anchor="middle">Postcondition Error</text>

  <!-- Ready -> Failed (Precondition failure) -->
  <path d="M 310,124 L 310,250 L 488,250" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <rect x="330" y="241" width="88" height="18" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="374" y="253" class="edge-label" fill="#b91c1c">P_i(S) == 0</text>

  <!-- Failed -> Invalidated (Cascade to descendants) -->
  <line x1="620" y1="242" x2="768" y2="242" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <rect x="632" y="222" width="124" height="18" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="694" y="235" class="edge-label" fill="#b91c1c">BFS Desc(v_fail)</text>

  <!-- Failed -> Ready (Local Repair / Node Retrial) -->
  <path d="M 490,225 L 360,225 L 360,126" fill="none" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <rect x="368" y="172" width="104" height="18" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="420" y="184" class="edge-label" fill="#0369a1">Local Repair: a_i'</text>
</svg>