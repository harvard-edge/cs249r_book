<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%"
     font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .axis-title { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .tick-lbl { font-size: 11px; fill: #64748b; }
      .legend-txt { font-size: 11px; font-weight: 600; fill: #1e293b; }
      .badge-txt { font-size: 10px; font-weight: 700; }
      .card-hdr { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .card-body { font-size: 10.5px; fill: #334155; }
      .math-txt { font-family: 'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#047857"/>
    </marker>
    <pattern id="hatch-red" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#fca5a5" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="490" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Zone Badges in Top Header Strip (y=16 to 38) -->
  <rect x="90" y="16" width="373" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="276" y="31" class="badge-txt" fill="#047857" text-anchor="middle">BENIGN OPTIMIZATION ZONE (ΔU &gt; 0)</text>

  <rect x="463" y="16" width="447" height="22" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="686" y="31" class="badge-txt" fill="#b91c1c" text-anchor="middle">ADVERSARIAL EXPLOITATION ZONE (Goodhart Collapse)</text>

  <!-- Plot Area: x=90 to 910 (width 820), y=48 to 368 (height 320) -->
  <!-- Zone Shading -->
  <rect x="90" y="48" width="373" height="320" fill="#ecfdf5" fill-opacity="0.35"/>
  <rect x="463" y="48" width="447" height="320" fill="#fef2f2" fill-opacity="0.35"/>

  <!-- Horizontal Grid Lines & Y-ticks (y: 368=0.0, 304=0.2, 240=0.4, 176=0.6, 112=0.8, 48=1.0) -->
  <line x1="90" y1="368" x2="910" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="304" x2="910" y2="304" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="240" x2="910" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="176" x2="910" y2="176" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="112" x2="910" y2="112" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="48"  x2="910" y2="48"  stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="80" y="372" class="tick-lbl" text-anchor="end">0.0</text>
  <text x="80" y="308" class="tick-lbl" text-anchor="end">0.2</text>
  <text x="80" y="244" class="tick-lbl" text-anchor="end">0.4</text>
  <text x="80" y="180" class="tick-lbl" text-anchor="end">0.6</text>
  <text x="80" y="116" class="tick-lbl" text-anchor="end">0.8</text>
  <text x="80" y="52"  class="tick-lbl" text-anchor="end">1.0</text>

  <!-- Vertical Grid Lines & X-ticks -->
  <!-- N=1 (x=90), N=8 (x=314), N=32 (x=463), N=128 (x=612), N=512 (x=761), N=2048 (x=910) -->
  <line x1="314" y1="48" x2="314" y2="368" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="463" y1="48" x2="463" y2="368" stroke="#047857" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="612" y1="48" x2="612" y2="368" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="761" y1="48" x2="761" y2="368" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="90"  y="385" class="tick-lbl" text-anchor="middle">1 (Greedy)</text>
  <text x="314" y="385" class="tick-lbl" text-anchor="middle">8</text>
  <text x="463" y="385" class="tick-lbl" font-weight="700" fill="#047857" text-anchor="middle">N* = 32</text>
  <text x="612" y="385" class="tick-lbl" text-anchor="middle">128</text>
  <text x="761" y="385" class="tick-lbl" text-anchor="middle">512</text>
  <text x="910" y="385" class="tick-lbl" text-anchor="middle">2,048</text>

  <!-- Axes Lines -->
  <line x1="90" y1="368" x2="925" y2="368" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <line x1="90" y1="368" x2="90"  y2="35"  stroke="#334155" stroke-width="1.5" marker-end="url(#arr-slate)"/>

  <!-- Axis Titles -->
  <text x="-208" y="32" class="axis-title" transform="rotate(-90)" text-anchor="middle">Normalized Utility / Verifier Score</text>
  <text x="500" y="406" class="axis-title" text-anchor="middle">Candidate Search Intensity N (Sampled Rollout Trajectories, log scale)</text>

  <!-- Hatched Area between curves beyond N*=32 (x=463) -->
  <!-- Cross point is (463, 100) where U=0.84 and U_hat=0.76... wait, curves cross around x=500 (y=115) -->
  <!-- Proxy: (463, 125) -> (612, 83) -> (761, 64) -> (910, 54) -->
  <!-- True: (910, 328) <- (761, 268) <- (612, 172) <- (463, 100) -->
  <path d="M 463 100 C 490 108, 550 140, 612 172 C 680 220, 715 258, 761 268 C 810 279, 860 313, 910 328 L 910 54 C 860 59, 810 61, 761 64 C 710 68, 660 75, 612 83 C 560 92, 510 108, 463 125 Z"
        fill="url(#hatch-red)" opacity="0.55"/>

  <!-- Curve 1: Proxy Verifier Score U_hat(tau*) (Blue Dashed) -->
  <!-- Starts at (90, 256: 0.35) -> (314, 192: 0.55) -> (463, 125: 0.76) -> (612, 83: 0.89) -> (761, 64: 0.95) -> (910, 54: 0.98) -->
  <path d="M 90 256 C 200 233, 260 208, 314 192 C 390 169, 420 141, 463 125 C 520 105, 560 89, 612 83 C 680 75, 720 67, 761 64 C 820 60, 860 56, 910 54"
        fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Curve 2: True System Utility U(tau*) (Solid Harvard Crimson) -->
  <!-- (90, 256: 0.35) -> (314, 192: 0.55) -> (463, 100: 0.84 Peak!) -> (612, 172: 0.61) -> (761, 268: 0.31) -> (910, 328: 0.12) -->
  <path d="M 90 256 C 200 233, 260 208, 314 192 C 380 170, 425 100, 463 100 C 505 100, 565 138, 612 172 C 680 221, 715 258, 761 268 C 810 279, 860 313, 910 328"
        fill="none" stroke="#A51C30" stroke-width="3.5"/>

  <!-- Peak Point N* -->
  <circle cx="463" cy="100" r="6" fill="#047857" stroke="#ffffff" stroke-width="2"/>

  <!-- Callout 1: Optimal Ceiling N* (placed top-left of peak, clean and unobscured) -->
  <g transform="translate(250, 55)">
    <rect width="195" height="44" rx="5" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="12" y="18" font-size="10.5" font-weight="700" fill="#047857">Optimal Search Frontier N* = 32</text>
    <text x="12" y="33" font-size="9.5" fill="#065f46">Peak True Utility: U(τ*) = 84%</text>
    <!-- Connector line -->
    <path d="M 195 28 L 208 40 L 211 44" fill="none" stroke="#047857" stroke-width="1.2" marker-end="url(#arr-emerald)"/>
  </g>

  <!-- Legend in Open White Space (Lower Left, x=110, y=275) -->
  <g transform="translate(110, 275)">
    <rect width="215" height="54" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Proxy item -->
    <line x1="12" y1="18" x2="38" y2="18" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,3"/>
    <text x="46" y="22" class="legend-txt">Proxy Verifier Û(τ*) [Saturation]</text>
    <!-- True item -->
    <line x1="12" y1="38" x2="38" y2="38" stroke="#A51C30" stroke-width="3"/>
    <text x="46" y="42" class="legend-txt">True Utility U(τ*) [Collapse]</text>
  </g>

  <!-- Callout 2: Goodhart Divergence Gap (x=530, y=105) -->
  <g transform="translate(530, 105)">
    <rect width="200" height="44" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
    <text x="10" y="18" font-size="10.5" font-weight="700" fill="#b91c1c">Goodhart Divergence ΔU</text>
    <text x="10" y="33" font-size="9.5" fill="#7f1d1d">ΔU = Û(τ*) - U(τ*) &gt; 0</text>
  </g>
  <path d="M 630 149 L 630 168" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-crimson)"/>

  <!-- Callout 3: Exploit Formula Box (x=595, y=280) -->
  <g transform="translate(595, 280)">
    <rect width="285" height="52" rx="5" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="12" y="20" class="math-txt" font-weight="700" fill="#991b1b">E[N_exploits] = N(1-θ)·ε_FP &gt; Nθ</text>
    <text x="12" y="38" font-size="9.5" fill="#7f1d1d">Adversarial distractors outnumber valid paths</text>
  </g>

  <!-- Bottom Explanatory Card (y=425) -->
  <g transform="translate(20, 422)">
    <rect width="920" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="16" y="21" class="card-hdr">Goodhart Invariant:</text>
    <text x="145" y="21" class="card-body">Scaling candidate search N against an imperfect verifier (ε_FP &gt; 0) guarantees distractor exploitation beyond N*.</text>
    <text x="16" y="39" class="card-body">Systems defense demands multi-oracle verification gates (AST linter + dynamic sandbox + policy checker) and step-level PRM scoring.</text>
  </g>
</svg>
