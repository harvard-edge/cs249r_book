<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="curve-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bg-grad)" rx="2" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- Top Title Banner -->
  <path d="M 0 0 L 800 0 L 800 44 L 0 44 Z" fill="#1E293B" rx="2" />
  <rect y="34" width="800" height="10" fill="#1E293B" />
  <text x="24" y="27" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.4">
    THE VERIFICATION CADENCE U-CURVE
  </text>
  <text x="776" y="27" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="end">
    T(m) = (N/m) · (m·T_step + T_ver) / p^m
  </text>

  <!-- Regions Highlighting -->
  <!-- Left: Over-verification zone -->
  <rect x="90" y="75" width="53.87755102040816" height="340" fill="#FEF2F2" fill-opacity="0.5" />
