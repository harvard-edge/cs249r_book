  <text x="78" y="176.14285714285714" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="end">600s</text>
  <text x="78" y="79.0" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="end">800s</text>

  <!-- Y-Axis Title -->
