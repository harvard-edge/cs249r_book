<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <linearGradient id="curve-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="800" height="480" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="760" height="440" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="42" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE VERIFICATION CADENCE U-CURVE</text>
  <text x="40" y="55" font-size="8.5" fill="#64748b">Analytical trade-off: verification overhead vs. rollback cost penalty</text>
  <text x="760" y="42" text-anchor="end" font-size="8.5" font-family="monospace" fill="#0284c7" font-weight="700">T(m) = (N/m) · (m·T_step + T_ver) / p^m</text>

  <!-- Regions Highlighting -->
  <!-- Left: Over-verification zone -->
  <rect x="90" y="75" width="53.88" height="340" fill="#fee2e2" fill-opacity="0.4"/>
  <!-- Center: Optimal zone -->
  <rect x="143.88" y="75" width="148.16" height="340" fill="#dcfce7" fill-opacity="0.5"/>
  <!-- Right: Under-verification zone -->
  <rect x="292.04" y="75" width="457.96" height="340" fill="#fee2e2" fill-opacity="0.4"/>

  <!-- Region Boundary Dividers -->
  <line x1="143.88" y1="75" x2="143.88" y2="415" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="292.04" y1="75" x2="292.04" y2="415" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Horizontal Grid Lines -->
  <g stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1">
    <line x1="90" y1="366.43" x2="750" y2="366.43"/>
    <line x1="90" y1="269.29" x2="750" y2="269.29"/>
    <line x1="90" y1="172.14" x2="750" y2="172.14"/>
    <line x1="90" y1="75.0"   x2="750" y2="75.0"/>
  </g>

  <!-- Vertical Grid Lines -->
  <g stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1">
    <line x1="211.22" y1="75" x2="211.22" y2="415"/>
    <line x1="345.92" y1="75" x2="345.92" y2="415"/>
    <line x1="480.61" y1="75" x2="480.61" y2="415"/>
    <line x1="615.31" y1="75" x2="615.31" y2="415"/>
    <line x1="750.0"  y1="75" x2="750.0"  y2="415"/>
  </g>

  <!-- Axes -->
  <line x1="90" y1="415" x2="765" y2="415" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="90" y1="415" x2="90" y2="65" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- Y-Axis Labels -->
  <text x="80" y="369.43" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">200s</text>
  <text x="80" y="272.29" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">400s</text>
  <text x="80" y="175.14" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">600s</text>
  <text x="80" y="78.0"   font-size="8" font-weight="600" fill="#64748b" text-anchor="end">800s</text>

  <!-- Y-Axis Title -->
  <text transform="rotate(-90 34 245)" x="34" y="245" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    Expected Wall-Clock Latency T(m) [Seconds]
  </text>

  <!-- X-Axis Labels -->
  <text x="90.0"   y="428" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">m=1</text>
  <text x="211.22" y="428" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">10</text>
  <text x="345.92" y="428" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">20</text>
  <text x="480.61" y="428" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">30</text>
  <text x="615.31" y="428" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">40</text>
  <text x="750.0"  y="428" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">m=50</text>

  <!-- X-Axis Title -->
  <text x="420.0" y="448" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    Verification Cadence m (Action Steps Between Gates)
  </text>

  <!-- Area under main curve -->
  <path d="M 90.0,182.4 L 96.7,262.0 L 103.3,301.5 L 110.0,325.0 L 116.7,340.3 L 123.3,351.0 L 130.0,358.8 L 136.7,364.6 L 143.3,369.1 L 150.0,372.5 L 156.7,375.2 L 163.3,377.3 L 170.0,378.9 L 176.7,380.2 L 183.3,381.1 L 190.0,381.7 L 196.7,382.2 L 203.3,382.4 L 210.0,382.5 L 216.7,382.4 L 223.3,382.1 L 230.0,381.8 L 236.7,381.3 L 243.3,380.7 L 250.0,380.0 L 256.7,379.3 L 263.3,378.4 L 270.0,377.5 L 276.7,376.5 L 283.3,375.4 L 290.0,374.3 L 296.7,373.0 L 303.3,371.8 L 310.0,370.4 L 316.7,369.0 L 323.3,367.5 L 330.0,365.9 L 336.7,364.3 L 343.3,362.6 L 350.0,360.9 L 356.7,359.1 L 363.3,357.2 L 370.0,355.2 L 376.7,353.2 L 383.3,351.2 L 390.0,349.0 L 396.7,346.8 L 403.3,344.5 L 410.0,342.2 L 416.7,339.8 L 423.3,337.3 L 430.0,334.7 L 436.7,332.1 L 443.3,329.3 L 450.0,326.6 L 456.7,323.7 L 463.3,320.7 L 470.0,317.7 L 476.7,314.6 L 483.3,311.4 L 490.0,308.1 L 496.7,304.7 L 503.3,301.3 L 510.0,297.7 L 516.7,294.1 L 523.3,290.3 L 530.0,286.4 L 536.7,282.5 L 543.3,278.4 L 550.0,274.3 L 556.7,270.0 L 563.3,265.6 L 570.0,261.1 L 576.7,256.5 L 583.3,251.8 L 590.0,246.9 L 596.7,242.0 L 603.3,236.9 L 610.0,231.6 L 616.7,226.2 L 623.3,220.7 L 630.0,215.1 L 636.7,209.3 L 643.3,203.3 L 650.0,197.2 L 656.7,191.0 L 663.3,184.6 L 670.0,178.0 L 676.7,171.3 L 683.3,164.4 L 690.0,157.3 L 696.7,150.0 L 703.3,142.6 L 710.0,134.9 L 716.7,127.1 L 723.3,119.0 L 730.0,110.8 L 736.7,102.4 L 743.3,93.7 L 750.0,84.8 L 750.0 415 L 90.0 415 Z" fill="url(#curve-area)"/>

  <!-- Main Curve T(m) -->
  <path d="M 90.0,182.4 L 96.7,262.0 L 103.3,301.5 L 110.0,325.0 L 116.7,340.3 L 123.3,351.0 L 130.0,358.8 L 136.7,364.6 L 143.3,369.1 L 150.0,372.5 L 156.7,375.2 L 163.3,377.3 L 170.0,378.9 L 176.7,380.2 L 183.3,381.1 L 190.0,381.7 L 196.7,382.2 L 203.3,382.4 L 210.0,382.5 L 216.7,382.4 L 223.3,382.1 L 230.0,381.8 L 236.7,381.3 L 243.3,380.7 L 250.0,380.0 L 256.7,379.3 L 263.3,378.4 L 270.0,377.5 L 276.7,376.5 L 283.3,375.4 L 290.0,374.3 L 296.7,373.0 L 303.3,371.8 L 310.0,370.4 L 316.7,369.0 L 323.3,367.5 L 330.0,365.9 L 336.7,364.3 L 343.3,362.6 L 350.0,360.9 L 356.7,359.1 L 363.3,357.2 L 370.0,355.2 L 376.7,353.2 L 383.3,351.2 L 390.0,349.0 L 396.7,346.8 L 403.3,344.5 L 410.0,342.2 L 416.7,339.8 L 423.3,337.3 L 430.0,334.7 L 436.7,332.1 L 443.3,329.3 L 450.0,326.6 L 456.7,323.7 L 463.3,320.7 L 470.0,317.7 L 476.7,314.6 L 483.3,311.4 L 490.0,308.1 L 496.7,304.7 L 503.3,301.3 L 510.0,297.7 L 516.7,294.1 L 523.3,290.3 L 530.0,286.4 L 536.7,282.5 L 543.3,278.4 L 550.0,274.3 L 556.7,270.0 L 563.3,265.6 L 570.0,261.1 L 576.7,256.5 L 583.3,251.8 L 590.0,246.9 L 596.7,242.0 L 603.3,236.9 L 610.0,231.6 L 616.7,226.2 L 623.3,220.7 L 630.0,215.1 L 636.7,209.3 L 643.3,203.3 L 650.0,197.2 L 656.7,191.0 L 663.3,184.6 L 670.0,178.0 L 676.7,171.3 L 683.3,164.4 L 690.0,157.3 L 696.7,150.0 L 703.3,142.6 L 710.0,134.9 L 716.7,127.1 L 723.3,119.0 L 730.0,110.8 L 736.7,102.4 L 743.3,93.7 L 750.0,84.8" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Annotations & Cards -->
  <!-- Left Side: Over-Verification Card -->
  <g transform="translate(100, 92)">
    <rect width="180" height="74" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect width="180" height="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="8" y="13" font-size="8" font-weight="700" fill="#991b1b">OVER-VERIFICATION (m &lt; 5)</text>
    <text x="8" y="32" font-size="7.5" fill="#334155">• Excessive Verifier Tax</text>
    <text x="8" y="46" font-size="7.5" fill="#334155">• High latency per micro-step</text>
    <text x="8" y="60" font-size="7.5" font-weight="700" fill="#dc2626">T(1) = 579s (Gate after every step)</text>
  </g>

  <!-- Right Side: Under-Verification Card -->
  <g transform="translate(545, 92)">
    <rect width="195" height="74" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect width="195" height="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="8" y="13" font-size="8" font-weight="700" fill="#991b1b">UNDER-VERIFICATION (m &gt; 20)</text>
    <text x="8" y="32" font-size="7.5" fill="#334155">• Compounding Error Collapse</text>
    <text x="8" y="46" font-size="7.5" fill="#334155">• Massive 50-step rollbacks</text>
    <text x="8" y="60" font-size="7.5" font-weight="700" fill="#dc2626">T(50) = 780s (Gate only at finish)</text>
  </g>

  <!-- Optimal Cadence Callout & Dot -->
  <line x1="204.49" y1="382.42" x2="204.49" y2="415" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="204.49" cy="382.42" r="5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Optimal Badge -->
  <g transform="translate(100, 275)">
    <rect width="200" height="66" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="200" height="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="8" y="13" font-size="8" font-weight="700" fill="#15803d">OPTIMAL CADENCE m* ≈ 8–10</text>
    <text x="8" y="32" font-size="7.5" fill="#334155">Minimizes Total Execution Latency</text>
    <text x="8" y="46" font-size="7.5" fill="#64748b">Balances check cost vs. rollback waste</text>
    <text x="8" y="58" font-size="7.5" font-weight="700" fill="#15803d">T(m*) = 167s (71% Latency Reduction)</text>
    <!-- Little arrow pointing down to the dot -->
    <path d="M 98 66 L 103 72 L 108 66 Z" fill="#16a34a"/>
  </g>
</svg>