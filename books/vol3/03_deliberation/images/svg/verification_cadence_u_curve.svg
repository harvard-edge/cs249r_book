  <rect x="143.87755102040816" y="75" width="148.16326530612244" height="340" fill="#ECFDF5" fill-opacity="0.6" />
  <!-- Right: Under-verification zone -->
  <rect x="292.0408163265306" y="75" width="457.9591836734694" height="340" fill="#FEF2F2" fill-opacity="0.5" />

  <!-- Grid Lines -->
  <!-- Horizontal grid lines -->
