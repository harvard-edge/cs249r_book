    Expected Wall-Clock Latency T(m) [Seconds]
  </text>

  <!-- X-Axis Labels -->
  <text x="90.0" y="435" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">m=1</text>
  <text x="211.22448979591837" y="435" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">10</text>
  <text x="345.9183673469388" y="435" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">20</text>
  <text x="480.61224489795916" y="435" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">30</text>
  <text x="615.3061224489796" y="435" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">40</text>
  <text x="750.0" y="435" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">m=50</text>

  <!-- X-Axis Title -->
  <text x="420.0" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">
    Verification Cadence m (Action Steps Between Gates)
  </text>

