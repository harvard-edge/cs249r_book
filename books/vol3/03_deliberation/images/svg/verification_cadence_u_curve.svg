    <line x1="345.9183673469388" y1="75" x2="345.9183673469388" y2="415" />
    <line x1="480.61224489795916" y1="75" x2="480.61224489795916" y2="415" />
    <line x1="615.3061224489796" y1="75" x2="615.3061224489796" y2="415" />
    <line x1="750.0" y1="75" x2="750.0" y2="415" />
  </g>

  <!-- Axes -->
  <line x1="90" y1="415" x2="770" y2="415" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="90" y1="415" x2="90" y2="60" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Y-Axis Labels -->
  <text x="78" y="370.42857142857144" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="end">200s</text>
