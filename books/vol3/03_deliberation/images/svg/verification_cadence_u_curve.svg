  <!-- Annotations & Cards -->
  <!-- Left Side: Over-Verification Card -->
  <g transform="translate(105, 105)" filter="url(#card-shadow)">
    <rect width="180" height="74" rx="2" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2" />
    <rect x="8" y="8" width="10" height="10" rx="5" fill="#DC2626" />
    <text x="24" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991B1B">OVER-VERIFICATION</text>
    <text x="10" y="36" font-family="system-ui, sans-serif" font-size="10" fill="#475569">• Excessive Verifier Tax</text>
    <text x="10" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#475569">• High latency per micro-step</text>
    <text x="10" y="64" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#DC2626">T(1) = 579s (Gate after every step)</text>
  </g>

  <!-- Right Side: Under-Verification Card -->
  <g transform="translate(550, 105)" filter="url(#card-shadow)">
    <rect width="190" height="74" rx="2" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2" />
    <rect x="8" y="8" width="10" height="10" rx="5" fill="#DC2626" />
    <text x="24" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991B1B">UNDER-VERIFICATION</text>
    <text x="10" y="36" font-family="system-ui, sans-serif" font-size="10" fill="#475569">• Compounding Error Collapse</text>
    <text x="10" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#475569">• Massive 50-step rollbacks</text>
    <text x="10" y="64" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#DC2626">T(50) = 780s (Gate only at finish)</text>
  </g>

  <!-- Optimal Cadence Callout & Dot -->
  <line x1="204.48979591836735" y1="382.42159430558536" x2="204.48979591836735" y2="415" stroke="#059669" stroke-width="1.8" stroke-dasharray="3,3" />
  <circle cx="204.48979591836735" cy="382.42159430558536" r="6" fill="#059669" stroke="#FFFFFF" stroke-width="2" />

  <!-- Optimal Badge -->
  <g transform="translate(104.48979591836735, 297.42159430558536)" filter="url(#card-shadow)">
    <rect width="200" height="66" rx="2" fill="#FFFFFF" stroke="#059669" stroke-width="1.4" />
    <rect x="8" y="8" width="10" height="10" rx="5" fill="#059669" />
    <text x="24" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065F46">OPTIMAL CADENCE m* ≈ 8-10</text>
    <text x="10" y="36" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Minimizes Total Execution Latency</text>
    <text x="10" y="52" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#059669">T(m*) = 167s (71% Latency Reduction)</text>
    <!-- Little arrow pointing down -->
    <path d="M 95 66 L 100 72 L 105 66 Z" fill="#059669" />
  </g>
