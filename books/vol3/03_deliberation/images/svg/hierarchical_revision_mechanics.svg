<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; text-anchor: middle; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle; fill: #475569; }
      .decision-txt { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #1e293b; text-anchor: middle; }
      .edge-lbl { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1080" height="430" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Title -->
  <rect x="20" y="16" width="1040" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="41" class="title">THREE-TIER HIERARCHICAL PLAN REVISION MECHANICS</text>
  <text x="1045" y="41" class="sub-note" text-anchor="end">Modular Error Containment (Saltzer &amp; Kaashoek)</text>

  <!-- Root Invalidation Trigger -->
  <rect x="365" y="70" width="350" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="96" class="box-lbl" fill="#991b1b">Precondition or Postcondition Failure</text>

  <!-- Flow to Decision 1 -->
  <path d="M 540 112 L 540 138" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Decision 1: Contract-preserving? -->
  <polygon points="540,140 680,175 540,210 400,175" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="171" class="decision-txt">Contract-preserving?</text>
  <text x="540" y="188" class="box-sub">Can O_i* be met locally?</text>

  <!-- Decision 1 -> Tier 1 (Left branch: Yes) -->
  <path d="M 400 175 C 220 175, 185 200, 185 248" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="270" y="165" width="55" height="20" rx="3" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="297" y="179" class="edge-lbl" fill="#047857" text-anchor="middle">Yes</text>

  <!-- Tier 1: Local Repair Box -->
  <g transform="translate(45, 250)">
    <rect width="280" height="75" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="140" y="28" class="box-lbl" fill="#047857">1. Local Repair (Node Retrial)</text>
    <text x="140" y="47" class="box-sub">Tune flags, fix typos, adjust timeout</text>
    <text x="140" y="63" class="box-sub" font-weight="600" fill="#065f46">Topology Unchanged · 0 Re-execution</text>
  </g>

  <!-- Decision 1 -> Decision 2 (Right branch: No) -->
  <path d="M 680 175 L 758 175" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="698" y="165" width="45" height="20" rx="3" fill="#ffffff" stroke="#fecaca"/>
  <text x="720" y="179" class="edge-lbl" fill="#b91c1c" text-anchor="middle">No</text>

  <!-- Decision 2: Root objectives viable? -->
  <polygon points="850,140 980,175 850,210 760,175" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="860" y="171" class="decision-txt">Objectives viable?</text>
  <text x="860" y="188" class="box-sub">Alternative path exists?</text>

  <!-- Decision 2 -> Tier 2: Subgraph Resynthesis (Yes) -->
  <path d="M 850 210 C 850 230, 540 230, 540 248" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="680" y="220" width="45" height="20" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="702" y="234" class="edge-lbl" fill="#1d4ed8" text-anchor="middle">Yes</text>

  <!-- Tier 2: Subgraph Resynthesis Box -->
  <g transform="translate(400, 250)">
    <rect width="280" height="75" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140" y="28" class="box-lbl" fill="#1d4ed8">2. Subgraph Resynthesis</text>
    <text x="140" y="47" class="box-sub">Prune Desc(v_fail), synthesize path</text>
    <text x="140" y="63" class="box-sub" font-weight="600" fill="#1e40af">Verified Ancestor State Preserved</text>
  </g>

  <!-- Decision 2 -> Tier 3: Global Escalation (No) -->
  <path d="M 980 175 C 1010 175, 895 210, 895 248" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="965" y="200" width="45" height="20" rx="3" fill="#ffffff" stroke="#fecaca"/>
  <text x="987" y="214" class="edge-lbl" fill="#b91c1c" text-anchor="middle">No</text>

  <!-- Tier 3: Global Escalation Box -->
  <g transform="translate(755, 250)">
    <rect width="280" height="75" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="140" y="28" class="box-lbl" fill="#b91c1c">3. Global Escalation</text>
    <text x="140" y="47" class="box-sub">Halt loop, yield state to supervisor</text>
    <text x="140" y="63" class="box-sub" font-weight="600" fill="#991b1b">Trigger Human / Safe Abort</text>
  </g>

  <!-- Bottom Invariant -->
  <rect x="20" y="345" width="1040" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="372" class="card-text" font-weight="700" fill="#0f172a">Modular Escalation Rule:</text>
  <text x="35" y="392" class="card-text">Contain failures at the lowest viable tier. Never trigger global replanning when local retrial or branch resynthesis suffices.</text>
</svg>