<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="cs-arr-amethyst" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#581C87"/>
    </marker>
    <marker id="cs-arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
    <marker id="cs-arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0F766E"/>
    </marker>
    <marker id="cs-arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#991B1B"/>
    </marker>

    <!-- Spectrum gradient -->
    <linearGradient id="cs-spectrum-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="75%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1040" height="540" fill="#FFFFFF"/>

  <!-- Diagram Header -->
  <g transform="translate(40, 28)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="0.2">ARCHITECTURAL SPECTRUM OF AGENTIC CONTROL TOPOLOGIES</text>
    <text x="0" y="15" font-size="10" font-weight="400" fill="#475569">Trade-offs Across Graph Topology, Execution Complexity, Latency Variance, and Invariant Verification</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 5 ARCHITECTURAL COLUMNS                                                   -->
  <!-- ========================================================================= -->

  <!-- Column 1: Prompt Chaining -->
  <g transform="translate(40, 65)">
    <!-- Column Card Frame -->
    <rect width="184" height="340" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="184" height="28" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="92" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">1. Prompt Chaining</text>

    <!-- Schematic: Linear Pipeline -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="152" height="136" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- Nodes S0 -> S1 -> S2 -->
      <rect x="16" y="12" width="120" height="26" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
      <text x="76" y="29" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="600" fill="#0F172A">S₀: Prompt(x)</text>

      <line x1="76" y1="38" x2="76" y2="52" stroke="#475569" stroke-width="1.2" marker-end="url(#cs-arr-slate)"/>

      <rect x="16" y="54" width="120" height="26" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
      <text x="76" y="71" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="600" fill="#0F172A">S₁: Transform</text>

      <line x1="76" y1="80" x2="76" y2="94" stroke="#475569" stroke-width="1.2" marker-end="url(#cs-arr-slate)"/>

      <rect x="16" y="96" width="120" height="26" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
      <text x="76" y="113" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="600" fill="#0F172A">S₂: Emit(y)</text>
    </g>

    <!-- Formal Architecture Metrics -->
    <g transform="translate(16, 190)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#475569">GRAPH TOPOLOGY</text>
      <text x="0" y="25" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">Static Linear DAG</text>

      <text x="0" y="45" font-size="8.5" font-weight="700" fill="#475569">LATENCY COMPLEXITY</text>
      <text x="0" y="58" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">𝒪(1) Deterministic</text>

      <text x="0" y="78" font-size="8.5" font-weight="700" fill="#475569">TOKEN VARIANCE (σ²)</text>
      <text x="0" y="91" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">σ² ≈ 0 (Zero Variance)</text>

      <text x="0" y="111" font-size="8.5" font-weight="700" fill="#475569">VERIFICATION GATE</text>
      <text x="0" y="124" font-size="9" font-family="ui-monospace, monospace" fill="#0F766E">JSON Schema / Regex</text>

      <text x="0" y="139" font-size="8" font-style="italic" fill="#64748B">Zero dynamic branching</text>
    </g>
  </g>

  <!-- Column 2: Routing & Dispatch -->
  <g transform="translate(236, 65)">
    <rect width="184" height="340" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="184" height="28" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="92" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">2. Routing &amp; Dispatch</text>

    <!-- Schematic: Classifier Router -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="152" height="136" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Router Node -->
      <polygon points="76,12 136,30 76,48 16,30" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
      <text x="76" y="33" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">Classifier P(y|x)</text>

      <!-- Branches -->
      <path d="M36,44 L36,88 L36,94" fill="none" stroke="#2563EB" stroke-width="1.2" marker-end="url(#cs-arr-slate)"/>
      <path d="M76,48 L76,94" fill="none" stroke="#2563EB" stroke-width="1.2" marker-end="url(#cs-arr-slate)"/>
      <path d="M116,44 L116,88 L116,94" fill="none" stroke="#2563EB" stroke-width="1.2" marker-end="url(#cs-arr-slate)"/>

      <rect x="14" y="96" width="38" height="24" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
      <text x="33" y="111" text-anchor="middle" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">B₁</text>

      <rect x="57" y="96" width="38" height="24" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
      <text x="76" y="111" text-anchor="middle" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">B₂</text>

      <rect x="100" y="96" width="38" height="24" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
      <text x="119" y="111" text-anchor="middle" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">B₃</text>
    </g>

    <!-- Formal Architecture Metrics -->
    <g transform="translate(16, 190)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#475569">GRAPH TOPOLOGY</text>
      <text x="0" y="25" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">Conditional Tree (b≥2)</text>

      <text x="0" y="45" font-size="8.5" font-weight="700" fill="#475569">LATENCY COMPLEXITY</text>
      <text x="0" y="58" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">𝒪(1) Bounded (t_route + t_B)</text>

      <text x="0" y="78" font-size="8.5" font-weight="700" fill="#475569">TOKEN VARIANCE (σ²)</text>
      <text x="0" y="91" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">σ² ≤ σ²_route</text>

      <text x="0" y="111" font-size="8.5" font-weight="700" fill="#475569">VERIFICATION GATE</text>
      <text x="0" y="124" font-size="9" font-family="ui-monospace, monospace" fill="#0F766E">Confidence Gate (τ ≥ θ)</text>

      <text x="0" y="139" font-size="8" font-style="italic" fill="#64748B">Single-stage dispatch</text>
    </g>
  </g>

  <!-- Column 3: Parallel Fan-Out -->
  <g transform="translate(432, 65)">
    <rect width="184" height="340" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="184" height="28" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="92" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">3. Parallel Fan-Out</text>

    <!-- Schematic: Map-Reduce DAG -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="152" height="136" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Scatter Node -->
      <rect x="36" y="10" width="80" height="20" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
      <text x="76" y="23" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">Scatter / Partition</text>

      <!-- Fan-out lines -->
      <path d="M50,30 L26,50 L26,54" fill="none" stroke="#0F766E" stroke-width="1.2" marker-end="url(#cs-arr-teal)"/>
      <path d="M76,30 L76,54" fill="none" stroke="#0F766E" stroke-width="1.2" marker-end="url(#cs-arr-teal)"/>
      <path d="M102,30 L126,50 L126,54" fill="none" stroke="#0F766E" stroke-width="1.2" marker-end="url(#cs-arr-teal)"/>

      <!-- Worker Enclaves -->
      <rect x="10" y="56" width="34" height="24" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
      <text x="27" y="71" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#0F172A">W₁</text>

      <rect x="59" y="56" width="34" height="24" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
      <text x="76" y="71" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#0F172A">W₂</text>

      <rect x="108" y="56" width="34" height="24" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
      <text x="125" y="71" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#0F172A">W₃</text>

      <!-- Sync Barrier Line -->
      <line x1="8" y1="86" x2="144" y2="86" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="146" y="88" font-size="7" font-weight="700" fill="#991B1B">B_sync</text>

      <!-- Gather / Aggregate -->
      <path d="M27,80 L27,94 L50,104" fill="none" stroke="#0F766E" stroke-width="1.2"/>
      <path d="M76,80 L76,104" fill="none" stroke="#0F766E" stroke-width="1.2"/>
      <path d="M125,80 L125,94 L102,104" fill="none" stroke="#0F766E" stroke-width="1.2"/>

      <rect x="26" y="106" width="100" height="22" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
      <text x="76" y="121" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">Aggregate / Reduce</text>
    </g>

    <!-- Formal Architecture Metrics -->
    <g transform="translate(16, 190)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#475569">GRAPH TOPOLOGY</text>
      <text x="0" y="25" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">Map-Reduce DAG</text>

      <text x="0" y="45" font-size="8.5" font-weight="700" fill="#475569">LATENCY COMPLEXITY</text>
      <text x="0" y="58" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">O(max t_i) Parallel Sync</text>

      <text x="0" y="78" font-size="8.5" font-weight="700" fill="#475569">TOKEN VARIANCE (σ²)</text>
      <text x="0" y="91" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">Additive (∑ σ²_i)</text>

      <text x="0" y="111" font-size="8.5" font-weight="700" fill="#475569">VERIFICATION GATE</text>
      <text x="0" y="124" font-size="9" font-family="ui-monospace, monospace" fill="#0F766E">Barrier Quorum / Voting</text>

      <text x="0" y="139" font-size="8" font-style="italic" fill="#64748B">Isolated worker contexts</text>
    </g>
  </g>

  <!-- Column 4: Supervisor-Workers -->
  <g transform="translate(628, 65)">
    <rect width="184" height="340" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="184" height="28" rx="3" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="92" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#581C87">4. Supervisor-Workers</text>

    <!-- Schematic: Hierarchical Supervision -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="152" height="136" rx="2" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>

      <!-- Supervisor Root S0 -->
      <rect x="26" y="10" width="100" height="24" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1.4"/>
      <text x="76" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">Supervisor S₀</text>

      <!-- Delegation Bus (Bidirectional: Lease Down, Diff Up) -->
      <path d="M48,34 L48,60 L34,60 L34,68" fill="none" stroke="#581C87" stroke-width="1.2" marker-end="url(#cs-arr-amethyst)"/>
      <path d="M104,34 L104,60 L118,60 L118,68" fill="none" stroke="#581C87" stroke-width="1.2" marker-end="url(#cs-arr-amethyst)"/>

      <!-- Subordinate Workers -->
      <rect x="12" y="70" width="58" height="22" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
      <text x="41" y="84" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#0F172A">Worker A</text>

      <rect x="82" y="70" width="58" height="22" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
      <text x="111" y="84" text-anchor="middle" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">Worker B</text>

      <!-- Return Validation Gate -->
      <path d="M41,92 L41,102 L64,106" fill="none" stroke="#0F766E" stroke-width="1.2"/>
      <path d="M111,92 L111,102 L88,106" fill="none" stroke="#0F766E" stroke-width="1.2"/>

      <rect x="30" y="106" width="92" height="22" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
      <text x="76" y="120" text-anchor="middle" font-size="8" font-weight="700" fill="#0F766E">Schema Diff Gate V</text>
    </g>

    <!-- Formal Architecture Metrics -->
    <g transform="translate(16, 190)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#475569">GRAPH TOPOLOGY</text>
      <text x="0" y="25" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">Hierarchical Tree (Depth D)</text>

      <text x="0" y="45" font-size="8.5" font-weight="700" fill="#475569">LATENCY COMPLEXITY</text>
      <text x="0" y="58" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">O(D) Bounded Tree</text>

      <text x="0" y="78" font-size="8.5" font-weight="700" fill="#475569">TOKEN VARIANCE (σ²)</text>
      <text x="0" y="91" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">Controlled Dynamic</text>

      <text x="0" y="111" font-size="8.5" font-weight="700" fill="#475569">VERIFICATION GATE</text>
      <text x="0" y="124" font-size="9" font-family="ui-monospace, monospace" fill="#0F766E">Leased Token Diff Gate</text>

      <text x="0" y="139" font-size="8" font-style="italic" fill="#64748B">Unidirectional authority</text>
    </g>
  </g>

  <!-- Column 5: Autonomous Loops -->
  <g transform="translate(824, 65)">
    <rect width="176" height="340" rx="3" fill="#FFFFFF" stroke="#581C87" stroke-width="1.5"/>
    <rect width="176" height="28" rx="3" fill="#581C87" stroke="#581C87" stroke-width="1.5"/>
    <text x="88" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">5. Autonomous Loops</text>

    <!-- Schematic: Cyclic FSM with Watchdog -->
    <g transform="translate(12, 42)">
      <rect x="0" y="0" width="152" height="136" rx="2" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1"/>

      <!-- State Node -->
      <circle cx="44" cy="38" r="16" fill="#FFFFFF" stroke="#581C87" stroke-width="1.4"/>
      <text x="44" y="42" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#581C87">s_t</text>

      <!-- Action Proposal -->
      <path d="M60,38 L94,38" fill="none" stroke="#581C87" stroke-width="1.2" marker-end="url(#cs-arr-amethyst)"/>
      <text x="77" y="32" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#581C87">a_t ~ pi</text>

      <!-- Env Node -->
      <rect x="96" y="26" width="44" height="24" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
      <text x="118" y="41" text-anchor="middle" font-size="8.5" font-family="ui-monospace, monospace" font-weight="600" fill="#0F172A">Env (E)</text>

      <!-- Feedback Loop with Guard -->
      <path d="M118,50 L118,92 L44,92 L44,56" fill="none" stroke="#581C87" stroke-width="1.2" marker-end="url(#cs-arr-amethyst)"/>
      <text x="81" y="86" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">o_t, r_t (s_t+1)</text>

      <!-- Circuit Breaker Guard -->
      <rect x="18" y="106" width="116" height="22" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="1"/>
      <text x="76" y="120" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991B1B">Guard: N_iter &lt; K_limit</text>
    </g>

    <!-- Formal Architecture Metrics -->
    <g transform="translate(12, 190)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#581C87">GRAPH TOPOLOGY</text>
      <text x="0" y="25" font-size="9" font-family="ui-monospace, monospace" fill="#0F172A">Cyclic Statechart / FSM</text>

      <text x="0" y="45" font-size="8.5" font-weight="700" fill="#581C87">LATENCY COMPLEXITY</text>
      <text x="0" y="58" font-size="9" font-family="ui-monospace, monospace" fill="#991B1B">O(K) Heavy-Tailed</text>

      <text x="0" y="78" font-size="8.5" font-weight="700" fill="#581C87">TOKEN VARIANCE (σ²)</text>
      <text x="0" y="91" font-size="9" font-family="ui-monospace, monospace" fill="#991B1B">Unbounded Worst-Case</text>

      <text x="0" y="111" font-size="8.5" font-weight="700" fill="#581C87">VERIFICATION GATE</text>
      <text x="0" y="124" font-size="9" font-family="ui-monospace, monospace" fill="#991B1B">Circuit Breaker &amp; Invariants</text>

      <text x="0" y="139" font-size="8" font-style="italic" fill="#581C87">Open-ended self-direction</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CONTINUUM METERS (PROGRESSION AXES SPANNING ALL 5 COLUMNS)                -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 422)">
    <!-- Spectrum Gradient Bar -->
    <rect x="0" y="0" width="960" height="6" rx="2" fill="url(#cs-spectrum-bar)"/>

    <!-- Row 1: Decision Autonomy -->
    <g transform="translate(0, 24)">
      <text x="0" y="0" font-size="9" font-weight="700" fill="#0F172A">DECISION AUTONOMY:</text>
      <text x="140" y="0" font-size="8.5" font-weight="600" fill="#475569">Deterministic Execution (Zero Authority)</text>
      <line x1="370" y1="-3" x2="680" y2="-3" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#cs-arr-slate)"/>
      <text x="700" y="0" font-size="8.5" font-weight="700" fill="#581C87">Open-Ended Stochastic Self-Direction</text>
    </g>

    <!-- Row 2: Verification Burden -->
    <g transform="translate(0, 46)">
      <text x="0" y="0" font-size="9" font-weight="700" fill="#0F172A">VERIFICATION BURDEN:</text>
      <text x="140" y="0" font-size="8.5" font-weight="600" fill="#0F766E">Static Input/Output Schemas</text>
      <line x1="310" y1="-3" x2="630" y2="-3" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#cs-arr-slate)"/>
      <text x="650" y="0" font-size="8.5" font-weight="700" fill="#991B1B">Runtime Invariant Watchdogs &amp; Formal Barriers</text>
    </g>

    <!-- Row 3: Operational Risk & Invariant -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" font-size="9" font-weight="700" fill="#0F172A">MINIMUM AUTONOMY INVARIANT:</text>
      <text x="180" y="0" font-size="8.5" font-style="italic" fill="#334155">"Failure blast radius, token variance, and latency scale monotonically with control autonomy. Never deploy more autonomy than required."</text>
    </g>
  </g>

</svg>
