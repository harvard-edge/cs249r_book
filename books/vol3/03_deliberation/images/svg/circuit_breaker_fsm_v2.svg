<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers calibrated for academic systems schematics -->
    <marker id="arr-navy" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#1E3A5F"/>
    </marker>
    <marker id="arr-slate" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#0F766E"/>
    </marker>
    <marker id="arr-ochre" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#92400E"/>
    </marker>
    <marker id="arr-crimson" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#991B1B"/>
    </marker>
    <marker id="arr-sage" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- 1. TOP TELEMETRY SENSOR BUS (INVARIANT MONITORING)                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 20)">
    <rect width="880" height="52" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
    <!-- Header -->
    <rect width="880" height="18" rx="2" fill="#F1F5F9" stroke="#334155" stroke-width="1.2"/>
    <text x="12" y="13" font-size="7.5" font-weight="700" fill="#0F172A">OUT-OF-BAND WATCHDOG TELEMETRY INGEST (Evaluated at step boundary t)</text>

    <!-- 4 Sensors -->
    <g transform="translate(10, 23)">
      <!-- Sensor 1: Progress Delta -->
      <g transform="translate(0, 0)">
        <rect width="205" height="22" rx="1" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="8" y="15" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#0F766E">ΔS_env ≥ δ_min</text>
        <text x="195" y="15" text-anchor="end" font-size="6.2" fill="#475569">[Livelock Filter]</text>
      </g>
      <!-- Sensor 2: Step Ceiling -->
      <g transform="translate(218, 0)">
        <rect width="205" height="22" rx="1" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="8" y="15" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#1E3A5F">k ≤ K_max</text>
        <text x="195" y="15" text-anchor="end" font-size="6.2" fill="#475569">[Horizon Ceiling]</text>
      </g>
      <!-- Sensor 3: Token Meter -->
      <g transform="translate(436, 0)">
        <rect width="205" height="22" rx="1" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="8" y="15" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#92400E">T_used ≤ T_budget</text>
        <text x="195" y="15" text-anchor="end" font-size="6.2" fill="#475569">[Cost Guardrail]</text>
      </g>
      <!-- Sensor 4: Error Burst -->
      <g transform="translate(654, 0)">
        <rect width="205" height="22" rx="1" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="8" y="15" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#991B1B">e_burst &lt; E_thresh</text>
        <text x="195" y="15" text-anchor="end" font-size="6.2" fill="#475569">[Fault Window]</text>
      </g>
    </g>
  </g>

  <!-- Feed Downward Arrows from Monitor into States -->
  <path d="M 165,72 L 165,108" stroke="#334155" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-slate)"/>
  <path d="M 480,72 L 480,108" stroke="#334155" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-slate)"/>
  <path d="M 795,72 L 795,108" stroke="#334155" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-slate)"/>

  <!-- ================================================================= -->
  <!-- 2. THREE FORMAL FSM STATES                                        -->
  <!-- ================================================================= -->

  <!-- STATE 1: CLOSED (Normal Execution) -->
  <g transform="translate(40, 110)">
    <rect width="250" height="230" rx="3" fill="#F8FAFC" stroke="#166534" stroke-width="1.5"/>
    <!-- Header -->
    <rect width="250" height="26" rx="3" fill="#F0FDF4" stroke="#166534" stroke-width="1.5"/>
    <circle cx="16" cy="13" r="5" fill="#166534"/>
    <text x="28" y="17" font-size="8.2" font-weight="700" fill="#166534">STATE: CLOSED (Normal)</text>

    <!-- Statechart Internals: entry / invariant / do -->
    <g transform="translate(10, 34)">
      <!-- Entry Action -->
      <rect width="230" height="42" rx="1" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
      <text x="8" y="14" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#0F172A">entry /</text>
      <text x="16" y="26" font-size="6.2" font-family="Courier New, monospace" fill="#334155">reset_error_counter(e_burst ← 0)</text>
      <text x="16" y="36" font-size="6.2" font-family="Courier New, monospace" fill="#334155">grant_full_tool_capabilities()</text>

      <!-- Invariant -->
      <g transform="translate(0, 48)">
        <rect width="230" height="42" rx="1" fill="#ffffff" stroke="#166534" stroke-width="0.8"/>
        <text x="8" y="14" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#166534">invariant /</text>
        <text x="16" y="26" font-size="6.2" font-family="Courier New, monospace" fill="#334155">ΔS_env ≥ δ_min  (Progress)</text>
        <text x="16" y="36" font-size="6.2" font-family="Courier New, monospace" fill="#334155">e_burst &lt; E_thresh  (Ceiling)</text>
      </g>

      <!-- Do / Execution -->
      <g transform="translate(0, 96)">
        <rect width="230" height="44" rx="1" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="8" y="14" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#0F172A">do /</text>
        <text x="16" y="26" font-size="6.2" font-family="Courier New, monospace" fill="#475569">dispatch_neural_forward_pass()</text>
        <text x="16" y="37" font-size="6.2" font-family="Courier New, monospace" fill="#166534">commit_step_delta_to_WAL(S_t)</text>
      </g>
    </g>
  </g>

  <!-- STATE 2: HALF-OPEN (Degraded Remediation Canary) -->
  <g transform="translate(355, 110)">
    <rect width="250" height="230" rx="3" fill="#F8FAFC" stroke="#92400E" stroke-width="1.5"/>
    <!-- Header -->
    <rect width="250" height="26" rx="3" fill="#FEF9F3" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="16" cy="13" r="5" fill="#92400E"/>
    <text x="28" y="17" font-size="8.2" font-weight="700" fill="#92400E">STATE: HALF-OPEN (Remediation)</text>

    <!-- Statechart Internals: entry / invariant / do -->
    <g transform="translate(10, 34)">
      <!-- Entry Action -->
      <rect width="230" height="42" rx="1" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
      <text x="8" y="14" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#0F172A">entry /</text>
      <text x="16" y="26" font-size="6.2" font-family="Courier New, monospace" fill="#92400E">k_remed ← 0; max_steps ← 2</text>
      <text x="16" y="36" font-size="6.2" font-family="Courier New, monospace" fill="#92400E">inject_remediation_warning()</text>

      <!-- Invariant -->
      <g transform="translate(0, 48)">
        <rect width="230" height="42" rx="1" fill="#ffffff" stroke="#92400E" stroke-width="0.8"/>
        <text x="8" y="14" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#92400E">invariant /</text>
        <text x="16" y="26" font-size="6.2" font-family="Courier New, monospace" fill="#334155">k_remed ≤ 2  (Bounded Leash)</text>
        <text x="16" y="36" font-size="6.2" font-family="Courier New, monospace" fill="#334155">attenuate_high_cost_tools()</text>
      </g>

      <!-- Do / Execution -->
      <g transform="translate(0, 96)">
        <rect width="230" height="44" rx="1" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="8" y="14" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#0F172A">do /</text>
        <text x="16" y="26" font-size="6.2" font-family="Courier New, monospace" fill="#475569">execute_canary_probe_turn()</text>
        <text x="16" y="37" font-size="6.2" font-family="Courier New, monospace" fill="#92400E">audit_isolated_progress_delta()</text>
      </g>
    </g>
  </g>

  <!-- STATE 3: OPEN (Tripped & Safe Abort) -->
  <g transform="translate(670, 110)">
    <rect width="250" height="230" rx="3" fill="#F8FAFC" stroke="#991B1B" stroke-width="1.5"/>
    <!-- Header -->
    <rect width="250" height="26" rx="3" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="16" cy="13" r="5" fill="#991B1B"/>
    <text x="28" y="17" font-size="8.2" font-weight="700" fill="#991B1B">STATE: OPEN (Quarantined)</text>

    <!-- Statechart Internals: entry / invariant / do -->
    <g transform="translate(10, 34)">
      <!-- Entry Action -->
      <rect width="230" height="42" rx="1" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
      <text x="8" y="14" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#0F172A">entry /</text>
      <text x="16" y="26" font-size="6.2" font-family="Courier New, monospace" fill="#991B1B">sever_token_grant(); halt_LLM()</text>
      <text x="16" y="36" font-size="6.2" font-family="Courier New, monospace" fill="#991B1B">trigger_saga_rollback(T_i → C_i)</text>

      <!-- Invariant -->
      <g transform="translate(0, 48)">
        <rect width="230" height="42" rx="1" fill="#ffffff" stroke="#991B1B" stroke-width="0.8"/>
        <text x="8" y="14" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#991B1B">invariant /</text>
        <text x="16" y="26" font-size="6.2" font-family="Courier New, monospace" fill="#334155">Zero mutations permitted</text>
        <text x="16" y="36" font-size="6.2" font-family="Courier New, monospace" fill="#334155">State isolation locked (Air-gap)</text>
      </g>

      <!-- Do / Execution -->
      <g transform="translate(0, 96)">
        <rect width="230" height="44" rx="1" fill="#ffffff" stroke="#CBD5E1" stroke-width="0.8"/>
        <text x="8" y="14" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#0F172A">do /</text>
        <text x="16" y="26" font-size="6.2" font-family="Courier New, monospace" fill="#475569">flush_diagnostics_to_OTel()</text>
        <text x="16" y="37" font-size="6.2" font-family="Courier New, monospace" fill="#991B1B">escalate_to_human_queue(ACB)</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- 3. FORMAL TRANSITIONS & EDGE GUARDS                               -->
  <!-- ================================================================= -->

  <!-- Transition 1: CLOSED -> HALF-OPEN (Soft fault detected) -->
  <path d="M 290,175 L 352,175" stroke="#92400E" stroke-width="1.6" marker-end="url(#arr-ochre)"/>
  <rect x="294" y="157" width="57" height="14" rx="1" fill="#ffffff" stroke="#92400E" stroke-width="0.6"/>
  <text x="322" y="167" text-anchor="middle" font-size="6" font-family="Courier New, monospace" font-weight="700" fill="#92400E">[e_burst ≥ 2]</text>

  <!-- Transition 2: HALF-OPEN -> CLOSED (Remediation succeeded) -->
  <path d="M 355,260 L 293,260" stroke="#166534" stroke-width="1.6" marker-end="url(#arr-sage)"/>
  <rect x="294" y="264" width="57" height="14" rx="1" fill="#ffffff" stroke="#166534" stroke-width="0.6"/>
  <text x="322" y="274" text-anchor="middle" font-size="6" font-family="Courier New, monospace" font-weight="700" fill="#166534">[ΔS_env ≥ δ]</text>

  <!-- Transition 3: HALF-OPEN -> OPEN (Remediation exhausted) -->
  <path d="M 605,195 L 667,195" stroke="#991B1B" stroke-width="1.6" marker-end="url(#arr-crimson)"/>
  <rect x="609" y="179" width="57" height="14" rx="1" fill="#ffffff" stroke="#991B1B" stroke-width="0.6"/>
  <text x="637" y="189" text-anchor="middle" font-size="6" font-family="Courier New, monospace" font-weight="700" fill="#991B1B">[k_remed &gt; 2]</text>

  <!-- Transition 4: CLOSED -> OPEN (Hard catastrophe / Budget breach) -->
  <path d="M 150,340 L 150,366 L 780,366 L 780,342" fill="none" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-crimson)"/>
  <rect x="390" y="358" width="180" height="16" rx="1" fill="#ffffff" stroke="#991B1B" stroke-width="0.8"/>
  <text x="480" y="369" text-anchor="middle" font-size="6.2" font-family="Courier New, monospace" font-weight="700" fill="#991B1B">[T_used &gt; T_budget || Fatal Crash]</text>

  <!-- Transition 5: OPEN -> CLOSED (Human Approval & Cold Restart) -->
  <path d="M 810,340 L 810,400 L 180,400 L 180,342" fill="none" stroke="#1E3A5F" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-navy)"/>
  <rect x="400" y="392" width="160" height="16" rx="1" fill="#ffffff" stroke="#1E3A5F" stroke-width="0.8"/>
  <text x="480" y="403" text-anchor="middle" font-size="6.2" font-family="Courier New, monospace" font-weight="700" fill="#1E3A5F">[Human Operator Resume]</text>

  <!-- ================================================================= -->
  <!-- 4. BOTTOM ARCHITECTURAL INVARIANT SUMMARY                         -->
  <!-- ================================================================= -->
  <g transform="translate(40, 428)">
    <rect width="880" height="40" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="14" y="16" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#0F172A">SRE Invariant Guarantee:</text>
    <text x="14" y="30" font-size="6.2" font-family="Courier New, monospace" fill="#475569">Autonomous loops terminate within bounded budget T_budget and turns K_max. Compensations (C_i) guarantee zero zombie writes.</text>
    <text x="866" y="24" text-anchor="end" font-size="6.5" font-family="Courier New, monospace" font-weight="700" fill="#991B1B">Fail-Safe Isolation Barrier</text>
  </g>
</svg>
