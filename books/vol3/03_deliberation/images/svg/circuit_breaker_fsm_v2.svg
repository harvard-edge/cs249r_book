<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
      .panel-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }
      .node-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; text-anchor: middle; }
      .node-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 10px; text-anchor: middle; fill: #475569; }
      .badge { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1120" height="450" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- PANEL A -->
  <rect x="20" y="20" width="525" height="360" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="30" y="30" width="505" height="32" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="45" y="51" class="panel-title" fill="#991b1b">Panel A: Precondition Invalidation Cascade</text>
  <text x="525" y="51" class="badge" fill="#dc2626" text-anchor="end">Desc(v₂) Invalidated</text>

  <!-- Left Nodes -->
  <g transform="translate(50, 135)">
    <rect width="68" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="24" class="node-lbl" fill="#065f46">v₀</text>
    <text x="34" y="38" class="node-sub">Init Plan</text>
  </g>
  <g transform="translate(160, 85)">
    <rect width="68" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="24" class="node-lbl" fill="#065f46">v₁</text>
    <text x="34" y="38" class="node-sub">Fetch Deps</text>
  </g>
  <g transform="translate(160, 190)">
    <rect width="68" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="24" class="node-lbl" fill="#065f46">v₅</text>
    <text x="34" y="38" class="node-sub">Setup DB</text>
  </g>
  <g transform="translate(275, 85)">
    <rect width="78" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="39" y="24" class="node-lbl" fill="#991b1b">v₂</text>
    <text x="39" y="38" class="node-sub">Link Lib (Fail)</text>
  </g>
  <g transform="translate(400, 85)">
    <rect width="72" height="48" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.5"/>
    <text x="36" y="24" class="node-lbl" fill="#64748b">v₃</text>
    <text x="36" y="38" class="node-sub">Compile Unit</text>
  </g>
  <g transform="translate(440, 190)">
    <rect width="72" height="48" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.5"/>
    <text x="36" y="24" class="node-lbl" fill="#64748b">v₄</text>
    <text x="36" y="38" class="node-sub">Run Binary</text>
  </g>

  <!-- Left Arrows -->
  <path d="M 118 205 L 158 163" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 118 215 L 158 255" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 228 159 L 273 159" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 353 159 L 398 159" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-red)"/>
  <path d="M 436 183 L 460 238" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-red)"/>
  <path d="M 228 264 L 438 264" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Left Explanatory Box -->
  <rect x="35" y="275" width="495" height="85" rx="6" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="50" y="298" class="card-text" font-weight="700" fill="#9f1239">Fault Localization:</text>
  <text x="50" y="316" class="card-text">1. v₂ fails: missing liburing headers (P₂(S) = 0). State transitions to Failed.</text>
  <text x="50" y="333" class="card-text">2. BFS Traversal computes Desc(v₂) = {v₃, v₄}. Both transitioned to Invalidated.</text>
  <text x="50" y="350" class="card-text">3. Independent branch v₅ is unaffected and safely preserved in Memory Escrow.</text>

  <!-- PANEL B -->
  <rect x="575" y="20" width="525" height="360" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="585" y="30" width="505" height="32" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="600" y="51" class="panel-title" fill="#1e40af">Panel B: Targeted Branch Pruning &amp; Resynthesis</text>
  <text x="1080" y="51" class="badge" fill="#2563eb" text-anchor="end">Resynthesized Path</text>

  <!-- Right Nodes -->
  <g transform="translate(605, 135)">
    <rect width="65" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="32" y="24" class="node-lbl" fill="#065f46">v₀</text>
    <text x="32" y="38" class="node-sub">Preserved</text>
  </g>
  <g transform="translate(705, 85)">
    <rect width="65" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="32" y="24" class="node-lbl" fill="#065f46">v₁</text>
    <text x="32" y="38" class="node-sub">Preserved</text>
  </g>
  <g transform="translate(705, 190)">
    <rect width="65" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="32" y="24" class="node-lbl" fill="#065f46">v₅</text>
    <text x="32" y="38" class="node-sub">Preserved</text>
  </g>
  <g transform="translate(805, 85)">
    <rect width="78" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="39" y="24" class="node-lbl" fill="#1e40af">v₂'</text>
    <text x="39" y="38" class="node-sub">Build Static</text>
  </g>
  <g transform="translate(920, 85)">
    <rect width="78" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="39" y="24" class="node-lbl" fill="#1e40af">v₃'</text>
    <text x="39" y="38" class="node-sub">Compile Unit</text>
  </g>
  <g transform="translate(980, 190)">
    <rect width="68" height="48" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="34" y="24" class="node-lbl" fill="#15803d">v₄</text>
    <text x="34" y="38" class="node-sub">Reconnected</text>
  </g>

  <!-- Right Arrows -->
  <path d="M 670 205 L 703 163" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 670 215 L 703 255" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 770 159 L 803 159" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 883 159 L 918 159" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 960 183 L 990 238" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 770 264 L 978 264" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Right Explanatory Box -->
  <rect x="590" y="275" width="495" height="85" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="605" y="298" class="card-text" font-weight="700" fill="#166534">Preserved State &amp; Resynthesis:</text>
  <text x="605" y="316" class="card-text">1. Only subgraph {v₂, v₃} is regenerated; ancestor state {v₀, v₁} retained.</text>
  <text x="605" y="333" class="card-text">2. Replacement nodes {v₂', v₃'} satisfy postcondition profile O* linking to v₄.</text>
  <text x="605" y="350" class="card-text">3. Compute saved: 4.0× latency reduction vs full prompt regeneration.</text>

  <!-- Bottom Footer Invariant -->
  <rect x="20" y="395" width="1080" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="420" class="card-text" font-weight="600" fill="#0f172a">Architectural Invariant:</text>
  <text x="195" y="420" class="card-text" fill="#334155">Never discard verified computational state upon local failure. Target plan revisions strictly to the invalidated subgraph Desc(v_fail).</text>
</svg>