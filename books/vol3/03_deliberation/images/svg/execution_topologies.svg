<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- PANEL A: ReAct Interleaving Loop                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 78)">
    <rect width="286" height="442" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="286" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">(A) REACT INTERLEAVING LOOP</text>

    <!-- Context Growth Container -->
    <g transform="translate(12, 34)">
      <rect width="262" height="326" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#0369a1">Monotonically Accumulating Context</text>

      <!-- Step t -->
      <g transform="translate(10, 24)">
        <rect width="242" height="78" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="8.0" font-weight="700" fill="#0284c7">Step t</text>
        
        <!-- Thought -->
        <rect x="8" y="18" width="226" height="16" rx="1" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="12" y="30" font-size="8.0" fill="#0369a1"><tspan font-weight="700">Thought:</tspan> Query API for customer order ID</text>

        <!-- Action -->
        <rect x="8" y="37" width="226" height="16" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
        <text x="12" y="49" font-size="8.0" fill="#0369a1"><tspan font-weight="700">Action:</tspan> db_lookup(cust_id="9021")</text>

        <!-- Observation -->
        <rect x="8" y="56" width="226" height="16" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.8"/>
        <text x="12" y="68" font-size="8.0" fill="#15803d"><tspan font-weight="700">Obs:</tspan> {order_id: "ORD-881", status: "open"}</text>
      </g>

      <!-- Transition Arrow -->
      <line x1="131" y1="106" x2="131" y2="118" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

      <!-- Step t+1 -->
      <g transform="translate(10, 122)">
        <rect width="242" height="78" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="8.0" font-weight="700" fill="#0284c7">Step t + 1</text>
        
        <!-- Thought -->
        <rect x="8" y="18" width="226" height="16" rx="1" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="12" y="30" font-size="8.0" fill="#0369a1"><tspan font-weight="700">Thought:</tspan> Check carrier delivery status</text>

        <!-- Action -->
        <rect x="8" y="37" width="226" height="16" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
        <text x="12" y="49" font-size="8.0" fill="#0369a1"><tspan font-weight="700">Action:</tspan> carrier_track(ord="ORD-881")</text>

        <!-- Observation -->
        <rect x="8" y="56" width="226" height="16" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.8"/>
        <text x="12" y="68" font-size="8.0" fill="#15803d"><tspan font-weight="700">Obs:</tspan> {carrier: "FedEx", est: "2026-09-08"}</text>
      </g>

      <!-- Transition Arrow -->
      <line x1="131" y1="204" x2="131" y2="216" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

      <!-- Step t+2 -->
      <g transform="translate(10, 220)">
        <rect width="242" height="96" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="8.0" font-weight="700" fill="#0284c7">Step t + 2 (Termination)</text>
        
        <!-- Thought -->
        <rect x="8" y="18" width="226" height="16" rx="1" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="12" y="30" font-size="8.0" fill="#0369a1"><tspan font-weight="700">Thought:</tspan> Sufficient data to satisfy goal</text>

        <!-- Final Answer -->
        <rect x="8" y="38" width="226" height="24" rx="1" fill="#fef3c7" stroke="#fde047" stroke-width="0.8"/>
        <text x="12" y="53" font-size="8.0" font-weight="700" fill="#b45309">Final: Package arrives Sep 8 via FedEx</text>

        <!-- Context Watermark -->
        <rect x="8" y="68" width="226" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="121" y="80" text-anchor="middle" font-size="8.0" fill="#64748b">Context: Linear growth Σ len(turn_i)</text>
      </g>
    </g>

    <!-- Bottom Metric Card -->
    <g transform="translate(12, 368)">
      <rect width="262" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0369a1">Performance Trade-offs:</text>
      <text x="10" y="32" font-size="8.0" fill="#15803d">✓ Dynamic adaptability to runtime tool returns</text>
      <text x="10" y="46" font-size="8.0" fill="#dc2626">✗ High latency: O(N) sequential forward passes</text>
      <text x="10" y="58" font-size="8.0" fill="#64748b">• KV-cache: Linear append, no branching</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: Plan-and-Solve (Hierarchical Deliberative Planning)       -->
  <!-- ================================================================= -->
  <g transform="translate(337, 78)">
    <rect width="286" height="442" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="286" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">(B) PLAN-AND-SOLVE DAG</text>

    <!-- DAG Visualization Container -->
    <g transform="translate(12, 34)">
      <rect width="262" height="326" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Planner Box -->
      <g transform="translate(16, 12)">
        <rect width="230" height="42" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="115" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">1. Deliberative Planner LLM</text>
        <text x="115" y="32" text-anchor="middle" font-size="8.0" fill="#64748b">Decomposes goal into static DAG: G = (V, E)</text>
      </g>

      <!-- Edges from Planner to Tasks -->
      <path d="M 75 54 L 60 84" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <path d="M 187 54 L 202 84" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

      <!-- Parallel Sub-tasks -->
      <g transform="translate(16, 88)">
        <!-- Task 1 -->
        <rect x="0" y="0" width="105" height="52" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
        <text x="52" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Task 1 (Async)</text>
        <text x="52" y="28" text-anchor="middle" font-size="8.0" fill="#64748b">Fetch order specs</text>
        <rect x="10" y="34" width="85" height="14" rx="1" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.8"/>
        <text x="52" y="44" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Worker Call 1</text>

        <!-- Task 2 -->
        <rect x="125" y="0" width="105" height="52" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
        <text x="177" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Task 2 (Async)</text>
        <text x="177" y="28" text-anchor="middle" font-size="8.0" fill="#64748b">Check inventory</text>
        <rect x="135" y="34" width="85" height="14" rx="1" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.8"/>
        <text x="177" y="44" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Worker Call 2</text>
      </g>

      <!-- Edges to Task 3 (Barrier Sync) -->
      <path d="M 70 140 L 105 170" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <path d="M 190 140 L 155 170" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

      <!-- Dependent Task 3 -->
      <g transform="translate(16, 174)">
        <rect x="25" y="0" width="180" height="46" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
        <text x="115" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Task 3: Barrier Join &amp; Merge</text>
        <text x="115" y="28" text-anchor="middle" font-size="8.0" fill="#64748b">Validates preconditions &amp; joins results</text>
        <text x="115" y="39" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Dependencies: {Task 1, Task 2}</text>
      </g>

      <!-- Edge to Synthesizer -->
      <line x1="131" y1="220" x2="131" y2="242" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

      <!-- Synthesizer Output -->
      <g transform="translate(16, 246)">
        <rect width="230" height="44" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="115" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Synthesizer / Resolution</text>
        <text x="115" y="32" text-anchor="middle" font-size="8.0" fill="#64748b">Combines verified branch outputs into final state</text>
      </g>
    </g>

    <!-- Bottom Metric Card -->
    <g transform="translate(12, 368)">
      <rect width="262" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#6d28d9">Performance Trade-offs:</text>
      <text x="10" y="32" font-size="8.0" fill="#15803d">✓ High GPU batch saturation via concurrency</text>
      <text x="10" y="46" font-size="8.0" fill="#dc2626">✗ Fragile if early worker output invalidates DAG</text>
      <text x="10" y="58" font-size="8.0" fill="#64748b">• Latency: O(DAG depth) critical path</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL C: Tree-of-Thoughts / Search Topology                       -->
  <!-- ================================================================= -->
  <g transform="translate(634, 78)">
    <rect width="286" height="442" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="286" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">(C) DELIBERATE SEARCH &amp; BACKTRACKING</text>

    <!-- Tree Structure Container -->
    <g transform="translate(12, 34)">
      <rect width="262" height="326" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Root Node S0 -->
      <circle cx="131" cy="18" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="131" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">S₀</text>

      <!-- Edges Level 1 -->
      <line x1="122" y1="26" x2="52" y2="60" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="131" y1="30" x2="131" y2="60" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="140" y1="26" x2="210" y2="60" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Level 1 Nodes -->
      <!-- Node A1 (Pruned) -->
      <circle cx="48" cy="72" r="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="48" y="75" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">A₁</text>
      <text x="48" y="92" text-anchor="middle" font-size="8.0" fill="#dc2626">PRM: 0.12 (Pruned)</text>

      <!-- Node A2 (Backtracked) -->
      <circle cx="131" cy="72" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="131" y="75" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">A₂</text>
      <text x="131" y="92" text-anchor="middle" font-size="8.0" fill="#b45309">PRM: 0.54</text>

      <!-- Node A3 (Promising) -->
      <circle cx="214" cy="72" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="214" y="75" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">A₃</text>
      <text x="214" y="92" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">PRM: 0.91 ★</text>

      <!-- Level 2 from A2: Dead End -->
      <line x1="131" y1="98" x2="131" y2="124" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <circle cx="131" cy="136" r="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="131" y="139" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">Dead End</text>

      <!-- Backtrack Arc from A2 Dead End to A3 -->
      <path d="M 118 136 C 85 136 90 98 116 76" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
      <rect x="74" y="104" width="46" height="14" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
      <text x="97" y="114" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">Backtrack</text>

      <!-- Level 2 from A3 -->
      <line x1="206" y1="98" x2="182" y2="124" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="222" y1="98" x2="242" y2="124" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <circle cx="178" cy="136" r="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="178" y="139" text-anchor="middle" font-size="8.0" fill="#64748b">B₁ (0.88)</text>

      <circle cx="244" cy="136" r="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="244" y="139" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">B₂ (0.96)</text>

      <!-- Solution Path to S* -->
      <line x1="244" y1="148" x2="244" y2="182" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
      <rect x="150" y="186" width="102" height="38" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="201" y="201" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Optimal Goal S*</text>
      <text x="201" y="214" text-anchor="middle" font-size="8.0" fill="#166534">Verifier: 1.0 (Passed)</text>

      <!-- Explanation Box -->
      <g transform="translate(10, 246)">
        <rect width="242" height="44" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="15" font-size="8.0" font-weight="700" fill="#15803d">Test-Time Compute Search:</text>
        <text x="8" y="28" font-size="8.0" fill="#475569">• PRM evaluates value of intermediate state nodes</text>
        <text x="8" y="38" font-size="8.0" fill="#475569">• Rollback &amp; branch exploration recovers errors</text>
      </g>
    </g>

    <!-- Bottom Metric Card -->
    <g transform="translate(12, 368)">
      <rect width="262" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Performance Trade-offs:</text>
      <text x="10" y="32" font-size="8.0" fill="#15803d">✓ Solves complex reasoning beyond base model</text>
      <text x="10" y="46" font-size="8.0" fill="#dc2626">✗ Exponential worst-case token budget tax: O(b^d)</text>
      <text x="10" y="58" font-size="8.0" fill="#64748b">• Requires RadixTree KV-cache for prefix reuse</text>
    </g>
  </g>
</g>
</svg>