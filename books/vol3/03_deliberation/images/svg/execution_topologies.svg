<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7E22CE"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Comparative Execution Graph Topologies</text>
  <text x="480" y="50" text-anchor="middle" font-size="10.5" fill="#64748B">Structural contrast between Reactive Interleaving, Hierarchical Planning, and Deliberate Search</text>

  <!-- PANEL A: ReAct (Reactive Step-by-Step Interleaving) -->
  <g transform="translate(30, 75)" >
    <rect width="280" height="460" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="280" height="34" rx="2" fill="#1E40AF"/>
    <rect y="26" width="280" height="8" fill="#1E40AF"/>
    <text x="140" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">(a) ReAct Interleaving Loop</text>

    <!-- Context Growth Container -->
    <g transform="translate(15, 48)">
      <rect width="250" height="345" rx="2" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#1E40AF">Monotonically Accumulating Context</text>

      <!-- Step t -->
      <g transform="translate(12, 28)">
        <rect width="226" height="88" rx="4" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#0369A1">Step t</text>
        
        <!-- Thought -->
        <rect x="10" y="20" width="206" height="18" rx="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="0.8"/>
        <text x="16" y="33" font-size="7.5" fill="#0369A1"><tspan font-weight="700">Thought:</tspan> Query API for customer order ID</text>

        <!-- Action -->
        <rect x="10" y="42" width="206" height="18" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/>
        <text x="16" y="55" font-size="7.5" fill="#1E40AF"><tspan font-weight="700">Action:</tspan> db_lookup(cust_id="9021")</text>

        <!-- Observation -->
        <rect x="10" y="64" width="206" height="18" rx="3" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
        <text x="16" y="77" font-size="7.5" fill="#166534"><tspan font-weight="700">Obs:</tspan> {order_id: "ORD-881", status: "open"}</text>
      </g>

      <!-- Transition Arrow -->
      <path d="M 125 120 L 125 138" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <!-- Step t+1 -->
      <g transform="translate(12, 142)">
        <rect width="226" height="88" rx="4" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#0369A1">Step t + 1</text>
        
        <!-- Thought -->
        <rect x="10" y="20" width="206" height="18" rx="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="0.8"/>
        <text x="16" y="33" font-size="7.5" fill="#0369A1"><tspan font-weight="700">Thought:</tspan> Check shipping tracking status</text>

        <!-- Action -->
        <rect x="10" y="42" width="206" height="18" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/>
        <text x="16" y="55" font-size="7.5" fill="#1E40AF"><tspan font-weight="700">Action:</tspan> carrier_track(ord="ORD-881")</text>

        <!-- Observation -->
        <rect x="10" y="64" width="206" height="18" rx="3" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
        <text x="16" y="77" font-size="7.5" fill="#166534"><tspan font-weight="700">Obs:</tspan> {carrier: "FedEx", est: "2026-09-08"}</text>
      </g>

      <!-- Transition Arrow -->
      <path d="M 125 234 L 125 252" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <!-- Step t+2 -->
      <g transform="translate(12, 256)">
        <rect width="226" height="74" rx="4" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#0369A1">Step t + 2 (Termination)</text>
        
        <!-- Thought -->
        <rect x="10" y="20" width="206" height="18" rx="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="0.8"/>
        <text x="16" y="33" font-size="7.5" fill="#0369A1"><tspan font-weight="700">Thought:</tspan> Sufficient data to answer user</text>

        <!-- Final Answer -->
        <rect x="10" y="42" width="206" height="24" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
        <text x="16" y="58" font-size="7.5" font-weight="700" fill="#92400E">Final Answer: Order arriving Sep 8</text>
      </g>
    </g>

    <!-- Bottom Metric Card -->
    <g transform="translate(15, 400)">
      <rect width="250" height="50" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#1E40AF">Performance Trade-offs:</text>
      <text x="10" y="30" font-size="7.5" fill="#475569">• Dynamic adaptability to tool returns</text>
      <text x="10" y="42" font-size="7.5" fill="#DC2626">• High latency: O(N) sequential LLM forward passes</text>
    </g>
  </g>

  <!-- PANEL B: Plan-and-Solve (Hierarchical Deliberative Planning) -->
  <g transform="translate(340, 75)" >
    <rect width="280" height="460" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="280" height="34" rx="2" fill="#581C87"/>
    <rect y="26" width="280" height="8" fill="#581C87"/>
    <text x="140" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">(b) Plan-and-Solve DAG</text>

    <!-- Planner Box -->
    <g transform="translate(20, 50)">
      <rect width="240" height="52" rx="5" fill="#F3E8FF" stroke="#7E22CE" stroke-width="1.2"/>
      <text x="120" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">1. Deliberative Planner LLM</text>
      <text x="120" y="36" text-anchor="middle" font-size="8" fill="#6B21A8">Decomposes goal into static Task DAG: G = (V, E)</text>
    </g>

    <!-- Edges from Planner to Tasks -->
    <path d="M 80 102 L 65 140" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <path d="M 200 102 L 215 140" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

    <!-- Parallel Sub-tasks -->
    <g transform="translate(20, 142)">
      <!-- Task 1 -->
      <rect x="5" y="0" width="105" height="60" rx="4" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1"/>
      <text x="57" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#0F172A">Task 1 (Async)</text>
      <text x="57" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Fetch order specs</text>
      <rect x="15" y="40" width="85" height="14" rx="2" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="0.8"/>
      <text x="57" y="50" text-anchor="middle" font-size="7" fill="#6B21A8">Model Call 1</text>

      <!-- Task 2 -->
      <rect x="130" y="0" width="105" height="60" rx="4" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1"/>
      <text x="182" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#0F172A">Task 2 (Async)</text>
      <text x="182" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Check inventory</text>
      <rect x="140" y="40" width="85" height="14" rx="2" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="0.8"/>
      <text x="182" y="50" text-anchor="middle" font-size="7" fill="#6B21A8">Model Call 2</text>
    </g>

    <!-- Edges from Tasks to Task 3 (Barrier Sync) -->
    <path d="M 75 204 L 115 240" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <path d="M 205 204 L 165 240" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

    <!-- Dependent Task 3 -->
    <g transform="translate(20, 244)">
      <rect x="40" y="0" width="160" height="52" rx="4" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1"/>
      <text x="120" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Task 3: Barrier Join &amp; Merge</text>
      <text x="120" y="32" text-anchor="middle" font-size="7.5" fill="#475569">Validates preconditions &amp; compute</text>
      <text x="120" y="44" text-anchor="middle" font-size="7" fill="#6B21A8">Dependencies: {Task 1, Task 2}</text>
    </g>

    <!-- Edge to Synthesizer -->
    <path d="M 140 298 L 140 328" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

    <!-- Synthesizer Output -->
    <g transform="translate(20, 332)">
      <rect width="240" height="50" rx="5" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.2"/>
      <text x="120" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#581C87">Synthesizer / Resolution</text>
      <text x="120" y="34" text-anchor="middle" font-size="7.5" fill="#475569">Combines verified branch outputs into final state</text>
    </g>

    <!-- Bottom Metric Card -->
    <g transform="translate(15, 400)">
      <rect width="250" height="50" rx="4" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#581C87">Performance Trade-offs:</text>
      <text x="10" y="30" font-size="7.5" fill="#059669">• High GPU throughput via parallel execution</text>
      <text x="10" y="42" font-size="7.5" fill="#DC2626">• Fragile if early sub-task output invalidates plan</text>
    </g>
  </g>

  <!-- PANEL C: Tree-of-Thoughts / Search Topology -->
  <g transform="translate(650, 75)" >
    <rect width="280" height="460" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="280" height="34" rx="2" fill="#047857"/>
    <rect y="26" width="280" height="8" fill="#047857"/>
    <text x="140" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">(c) Deliberate Search &amp; Backtracking</text>

    <!-- Tree Structure Diagram -->
    <g transform="translate(20, 48)">
      <!-- Root Node S0 -->
      <circle cx="120" cy="18" r="14" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
      <text x="120" y="22" text-anchor="middle" font-size="8.5" font-weight="700" fill="#047857">S₀</text>

      <!-- Edges Level 1 -->
      <path d="M 108 26 L 50 68" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
      <path d="M 115 30 L 110 68" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
      <path d="M 132 26 L 195 68" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>

      <!-- Level 1 Nodes -->
      <!-- Node A1 (Pruned) -->
      <circle cx="45" cy="85" r="13" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
      <text x="45" y="88" text-anchor="middle" font-size="7.5" font-weight="700" fill="#DC2626">A₁</text>
      <text x="45" y="106" text-anchor="middle" font-size="6.5" fill="#DC2626">PRM: 0.12 (Pruned)</text>

      <!-- Node A2 (Backtracked) -->
      <circle cx="110" cy="85" r="13" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
      <text x="110" y="88" text-anchor="middle" font-size="7.5" font-weight="700" fill="#D97706">A₂</text>
      <text x="110" y="106" text-anchor="middle" font-size="6.5" fill="#D97706">PRM: 0.54</text>

      <!-- Node A3 (Promising) -->
      <circle cx="205" cy="85" r="13" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
      <text x="205" y="88" text-anchor="middle" font-size="7.5" font-weight="700" fill="#047857">A₃</text>
      <text x="205" y="106" text-anchor="middle" font-size="6.5" fill="#047857">PRM: 0.91</text>

      <!-- Level 2 from A2: Dead End & Backtrack -->
      <path d="M 110 115 L 110 148" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
      <circle cx="110" cy="162" r="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
      <text x="110" y="165" text-anchor="middle" font-size="6.5" font-weight="700" fill="#DC2626">Dead End</text>

      <!-- Backtrack Arc from A2 Dead End to A3 -->
      <path d="M 95 162 C 65 162 75 118 96 95" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
      <rect x="52" y="125" width="46" height="14" rx="2" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8"/>
      <text x="75" y="135" text-anchor="middle" font-size="6.5" font-weight="700" fill="#DC2626">Backtrack</text>

      <!-- Level 2 from A3 -->
      <path d="M 195 115 L 168 148" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
      <path d="M 215 115 L 235 148" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>

      <circle cx="162" cy="162" r="12" fill="#ECFDF5" stroke="#047857" stroke-width="1.2"/>
      <text x="162" y="165" text-anchor="middle" font-size="6.5" fill="#047857">B₁ (0.88)</text>

      <circle cx="240" cy="162" r="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
      <text x="240" y="165" text-anchor="middle" font-size="6.5" font-weight="700" fill="#059669">B₂ (0.96)</text>

      <!-- Solution Path -->
      <path d="M 240 176 L 240 215" stroke="#047857" stroke-width="2" marker-end="url(#arrow-emerald)"/>
      <rect x="155" y="220" width="120" height="42" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
      <text x="215" y="236" text-anchor="middle" font-size="8" font-weight="700" fill="#064E3B">Optimal Goal State S*</text>
      <text x="215" y="250" text-anchor="middle" font-size="7" fill="#047857">Verifier Score: 1.0 (Passed)</text>
    </g>

    <!-- Explanation Box -->
    <g transform="translate(15, 335)">
      <rect width="250" height="52" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#064E3B">Test-Time Compute Search:</text>
      <text x="10" y="30" font-size="7.5" fill="#475569">• PRM evaluates value of intermediate states</text>
      <text x="10" y="42" font-size="7.5" fill="#475569">• Rollback &amp; branch exploration recovers errors</text>
    </g>

    <!-- Bottom Metric Card -->
    <g transform="translate(15, 400)">
      <rect width="250" height="50" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#047857">Performance Trade-offs:</text>
      <text x="10" y="30" font-size="7.5" fill="#059669">• Solves complex reasoning beyond base model</text>
      <text x="10" y="42" font-size="7.5" fill="#DC2626">• High token budget tax: O(b^d) exponential worst-case</text>
    </g>
  </g>
</svg>
