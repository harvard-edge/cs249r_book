<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- 4 COMPARATIVE TOPOLOGY COLUMNS                                    -->
  <!-- ================================================================= -->

  <!-- PANE 1: Best-of-N -->
  <g transform="translate(41, 74)">
    <rect width="212" height="380" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="212" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="106" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">1. Best-of-N Sampling</text>

    <!-- Mini Diagram -->
    <g transform="translate(8, 32)">
      <rect width="196" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Root -->
      <circle cx="28" cy="46" r="9" fill="#0284c7"/>
      <text x="28" y="49" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">s₀</text>

      <!-- Branches -->
      <line x1="37" y1="46" x2="140" y2="18" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="37" y1="46" x2="140" y2="36" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="37" y1="46" x2="140" y2="56" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <line x1="37" y1="46" x2="140" y2="74" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>

      <!-- Leaves -->
      <rect x="145" y="12" width="44" height="12" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="167" y="21" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">r = 0.1</text>

      <rect x="145" y="30" width="44" height="12" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="167" y="39" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">r = 0.4</text>

      <rect x="145" y="50" width="44" height="12" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <text x="167" y="59" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">r = 0.95 ★</text>

      <rect x="145" y="68" width="44" height="12" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="167" y="77" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">r = 0.2</text>
    </g>

    <!-- Text Details -->
    <g transform="translate(8, 132)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#0f172a">Execution Topology:</text>
      <text x="0" y="24" font-size="7.5" fill="#64748b">• Independent 1D rollouts</text>
      <text x="0" y="36" font-size="7.5" fill="#64748b">• Zero inter-branch communication</text>

      <text x="0" y="54" font-size="8" font-weight="700" fill="#0f172a">Evaluation Mechanism:</text>
      <text x="0" y="66" font-size="7.5" fill="#64748b">• Sparse terminal ORM / voting</text>
      <text x="0" y="78" font-size="7.5" fill="#64748b">• Argmax selection at horizon</text>

      <!-- Trade-off Box -->
      <rect x="0" y="90" width="196" height="38" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="104" font-size="7.5" font-weight="700" fill="#15803d">✓ High GPU batch saturation</text>
      <text x="8" y="118" font-size="7.5" font-weight="700" fill="#dc2626">✗ Massive redundant prefix waste</text>

      <!-- Serving Profile -->
      <rect x="0" y="136" width="196" height="36" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="98" y="150" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">Serving: Embarrassingly Parallel</text>
      <text x="98" y="162" font-size="7" fill="#0284c7" text-anchor="middle">Prefix reused via Radix Attention</text>
    </g>
  </g>

  <!-- PANE 2: Beam Search -->
  <g transform="translate(263, 74)">
    <rect width="212" height="380" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect width="212" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="106" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">2. Beam Search</text>

    <!-- Mini Diagram -->
    <g transform="translate(8, 32)">
      <rect width="196" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Root -->
      <circle cx="24" cy="46" r="7" fill="#d97706"/>
      <!-- Ply 1 -->
      <line x1="31" y1="46" x2="68" y2="28" stroke="#d97706" stroke-width="1.2"/>
      <line x1="31" y1="46" x2="68" y2="64" stroke="#d97706" stroke-width="1.2"/>
      <circle cx="72" cy="28" r="5" fill="#d97706"/>
      <circle cx="72" cy="64" r="5" fill="#d97706"/>

      <!-- Ply 2: Pruning low branch -->
      <line x1="77" y1="28" x2="116" y2="18" stroke="#d97706" stroke-width="1.2"/>
      <line x1="77" y1="28" x2="116" y2="38" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="77" y1="64" x2="116" y2="54" stroke="#d97706" stroke-width="1.2"/>
      <line x1="77" y1="64" x2="116" y2="74" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>

      <circle cx="120" cy="18" r="5" fill="#d97706"/>
      <circle cx="120" cy="38" r="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <circle cx="120" cy="54" r="5" fill="#d97706"/>
      <circle cx="120" cy="74" r="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>

      <!-- Ply 3 -->
      <line x1="125" y1="18" x2="158" y2="26" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <line x1="125" y1="54" x2="158" y2="50" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <rect x="162" y="20" width="28" height="12" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="176" y="29" font-size="6.5" font-weight="700" fill="#15803d" text-anchor="middle">Top 1</text>
    </g>

    <!-- Text Details -->
    <g transform="translate(8, 132)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#0f172a">Execution Topology:</text>
      <text x="0" y="24" font-size="7.5" fill="#64748b">• Synchronous width-bounded tree</text>
      <text x="0" y="36" font-size="7.5" fill="#64748b">• Retains top-B hypotheses per step</text>

      <text x="0" y="54" font-size="8" font-weight="700" fill="#0f172a">Evaluation Mechanism:</text>
      <text x="0" y="66" font-size="7.5" fill="#64748b">• Step-level PRM scoring / log-prob</text>
      <text x="0" y="78" font-size="7.5" fill="#64748b">• Hard pruning at step frontier</text>

      <!-- Trade-off Box -->
      <rect x="0" y="90" width="196" height="38" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="104" font-size="7.5" font-weight="700" fill="#15803d">✓ Strict linear memory footprint</text>
      <text x="8" y="118" font-size="7.5" font-weight="700" fill="#dc2626">✗ Myopic pruning loses global optima</text>

      <!-- Serving Profile -->
      <rect x="0" y="136" width="196" height="36" rx="1" fill="#fef3c7" stroke="#fde047" stroke-width="0.8"/>
      <text x="98" y="150" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">Serving: Lock-Step Barrier</text>
      <text x="98" y="162" font-size="7" fill="#92400e" text-anchor="middle">Step synchronization barrier</text>
    </g>
  </g>

  <!-- PANE 3: MCTS -->
  <g transform="translate(485, 74)">
    <rect width="212" height="380" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="212" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="106" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">3. Monte Carlo Tree Search</text>

    <!-- Mini Diagram -->
    <g transform="translate(8, 32)">
      <rect width="196" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Root -->
      <circle cx="98" cy="16" r="7" fill="#16a34a"/>
      <!-- Tree nodes -->
      <line x1="94" y1="21" x2="68" y2="40" stroke="#16a34a" stroke-width="1.5"/>
      <line x1="102" y1="21" x2="128" y2="40" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="66" cy="42" r="6" fill="#16a34a"/>
      <circle cx="130" cy="42" r="5" fill="#cbd5e1"/>

      <!-- Selected Child -->
      <line x1="66" y1="48" x2="52" y2="68" stroke="#16a34a" stroke-width="1.5"/>
      <line x1="66" y1="48" x2="80" y2="68" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="50" cy="72" r="6" fill="#16a34a" stroke="#15803d" stroke-width="1.2"/>
      <circle cx="82" cy="70" r="4" fill="#cbd5e1"/>

      <!-- Rollout / Backup curve -->
      <path d="M 56 72 Q 115 75 145 60" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#arr-gray)"/>
      <path d="M 145 58 Q 125 26 106 18" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#arr-gray)"/>

      <rect x="6" y="8" width="50" height="12" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="31" y="17" font-size="6.5" font-weight="700" fill="#15803d" text-anchor="middle">1. Selection</text>

      <rect x="136" y="70" width="46" height="12" rx="1" fill="#fef3c7" stroke="#fde047" stroke-width="0.8"/>
      <text x="159" y="79" font-size="6.5" font-weight="700" fill="#b45309" text-anchor="middle">3. Rollout</text>
    </g>

    <!-- Text Details -->
    <g transform="translate(8, 132)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#0f172a">Execution Topology:</text>
      <text x="0" y="24" font-size="7.5" fill="#64748b">• Asymmetric exploratory tree (UCT)</text>
      <text x="0" y="36" font-size="7.5" fill="#64748b">• Balances explore vs. exploit</text>

      <text x="0" y="54" font-size="8" font-weight="700" fill="#0f172a">Evaluation Mechanism:</text>
      <text x="0" y="66" font-size="7.5" fill="#64748b">• Value Network + Rollout simulation</text>
      <text x="0" y="78" font-size="7.5" fill="#64748b">• Recursive value backup to root</text>

      <!-- Trade-off Box -->
      <rect x="0" y="90" width="196" height="38" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="104" font-size="7.5" font-weight="700" fill="#15803d">✓ Asymptotically optimal search</text>
      <text x="8" y="118" font-size="7.5" font-weight="700" fill="#dc2626">✗ High inference latency &amp; tree state</text>

      <!-- Serving Profile -->
      <rect x="0" y="136" width="196" height="36" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="98" y="150" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Serving: Asynchronous Tree</text>
      <text x="98" y="162" font-size="7" fill="#166534" text-anchor="middle">Demands Radix KV-cache reuse</text>
    </g>
  </g>

  <!-- PANE 4: Graph of Thoughts -->
  <g transform="translate(707, 74)">
    <rect width="212" height="380" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="212" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="106" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">4. Graph of Thoughts (GoT)</text>

    <!-- Mini Diagram -->
    <g transform="translate(8, 32)">
      <rect width="196" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- DAG Nodes -->
      <circle cx="25" cy="46" r="7" fill="#7c3aed"/>
      <circle cx="65" cy="24" r="6" fill="#7c3aed"/>
      <circle cx="65" cy="68" r="6" fill="#7c3aed"/>
      <circle cx="120" cy="46" r="7" fill="#16a34a" stroke="#15803d" stroke-width="1.2"/>
      <circle cx="170" cy="46" r="6" fill="#7c3aed"/>

      <!-- Directed edges (splitting and merging) -->
      <line x1="32" y1="42" x2="58" y2="28" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <line x1="32" y1="50" x2="58" y2="64" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <!-- Merge edges into Node 4 -->
      <line x1="71" y1="28" x2="112" y2="42" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <line x1="71" y1="64" x2="112" y2="50" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <!-- Terminal edge -->
      <line x1="127" y1="46" x2="162" y2="46" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

      <rect x="98" y="10" width="44" height="12" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="120" y="19" font-size="6.5" font-weight="700" fill="#15803d" text-anchor="middle">Merge</text>
    </g>

    <!-- Text Details -->
    <g transform="translate(8, 132)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#0f172a">Execution Topology:</text>
      <text x="0" y="24" font-size="7.5" fill="#64748b">• Arbitrary Directed Acyclic Graph</text>
      <text x="0" y="36" font-size="7.5" fill="#64748b">• Branching, merging, and synthesis</text>

      <text x="0" y="54" font-size="8" font-weight="700" fill="#0f172a">Evaluation Mechanism:</text>
      <text x="0" y="66" font-size="7.5" fill="#64748b">• Multi-edge relational verification</text>
      <text x="0" y="78" font-size="7.5" fill="#64748b">• Cross-branch thought distillation</text>

      <!-- Trade-off Box -->
      <rect x="0" y="90" width="196" height="38" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="104" font-size="7.5" font-weight="700" fill="#15803d">✓ Expresses thought aggregation</text>
      <text x="8" y="118" font-size="7.5" font-weight="700" fill="#dc2626">✗ Complex dependency scheduling</text>

      <!-- Serving Profile -->
      <rect x="0" y="136" width="196" height="36" rx="1" fill="#ede9fe" stroke="#ddd6fe" stroke-width="0.8"/>
      <text x="98" y="150" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Serving: Graph Scheduler</text>
      <text x="98" y="162" font-size="7" fill="#7c3aed" text-anchor="middle">Requires multi-parent KV joins</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM BANNER: SYSTEMS TRADE-OFF                                  -->
  <!-- ================================================================= -->
  <g transform="translate(41, 464)">
    <rect width="878" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Systems Trade-off: Parallel Batch Throughput vs. Deliberate Lookahead</text>
    <text x="14" y="32" font-size="7.5" fill="#64748b">Best-of-N maximizes GPU batch saturation and compute efficiency; MCTS and GoT maximize solution accuracy on intractable problem manifolds.</text>
  </g>
</g>
</svg>