<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#16a34a"/>
    </marker>
    <marker id="arr-slate" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="410" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL 1: DEPTH (Sequential Extension)                             -->
  <!-- ================================================================= -->
  <g transform="translate(20, 16)">
    <!-- Container Card -->
    <rect width="294" height="376" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="294" height="32" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="147" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">Sequential Depth (Token Extension)</text>

    <!-- Topological Flow Schematic -->
    <g transform="translate(14, 46)">
      <rect width="266" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="18" width="56" height="30" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="38" y="37" text-anchor="middle" font-size="9" font-weight="600" fill="#0f172a">Prompt P</text>

      <line x1="66" y1="33" x2="88" y2="33" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>

      <rect x="90" y="18" width="46" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="113" y="37" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="#0369a1">y₁</text>

      <line x1="136" y1="33" x2="158" y2="33" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>

      <rect x="160" y="18" width="46" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="183" y="37" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="#0369a1">y₂</text>

      <line x1="206" y1="33" x2="218" y2="33" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="2,2"/>

      <rect x="220" y="18" width="38" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="239" y="37" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="#0369a1">y_K</text>
    </g>

    <!-- Systems Equations & Quantitative Bounds -->
    <g transform="translate(14, 122)">
      <!-- Critical Path Latency -->
      <rect width="266" height="52" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#334155">Critical-Path Latency</text>
      <text x="10" y="38" font-size="9" font-family="ui-monospace, monospace" fill="#0284c7">T_wall = t_prefill(P) + K · t_decode</text>

      <!-- Accelerator Memory Footprint -->
      <g transform="translate(0, 58)">
        <rect width="266" height="52" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="18" font-size="9.5" font-weight="700" fill="#334155">Accelerator Memory Footprint</text>
        <text x="10" y="38" font-size="9" font-family="ui-monospace, monospace" fill="#0f172a">M_KV ∝ 2·L·d_h·n_kv · (P + K)</text>
      </g>

      <!-- Systems Execution Characteristics -->
      <g transform="translate(0, 116)">
        <rect width="266" height="126" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="18" font-size="9.5" font-weight="700" fill="#334155">Execution Model</text>
        
        <text x="10" y="38" font-size="9" font-weight="600" fill="#475569">Dependency:</text>
        <text x="82" y="38" font-size="9" fill="#0f172a">Serial autoregressive chain</text>

        <text x="10" y="58" font-size="9" font-weight="600" fill="#475569">Serving Mode:</text>
        <text x="82" y="58" font-size="9" fill="#0f172a">Single continuous decode stream</text>

        <text x="10" y="78" font-size="9" font-weight="600" fill="#475569">Memory Class:</text>
        <text x="82" y="78" font-size="9" fill="#0f172a">Linear cache allocation: O(P+K)</text>

        <text x="10" y="98" font-size="9" font-weight="600" fill="#475569">Systems Limit:</text>
        <text x="82" y="98" font-size="9" fill="#b91c1c">Memory-bandwidth bounded (HBM)</text>

        <text x="10" y="116" font-size="9" font-weight="600" fill="#475569">Feedback:</text>
        <text x="82" y="116" font-size="9" fill="#475569">Open-loop (zero runtime oracle)</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 2: BREADTH (Parallel Exploration)                           -->
  <!-- ================================================================= -->
  <g transform="translate(333, 16)">
    <!-- Container Card -->
    <rect width="294" height="376" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="294" height="32" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="147" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Parallel Breadth (Candidate Sampling)</text>

    <!-- Topological Flow Schematic -->
    <g transform="translate(14, 46)">
      <rect width="266" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="18" width="52" height="30" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="34" y="37" text-anchor="middle" font-size="9" font-weight="600" fill="#0f172a">Prompt P</text>

      <!-- Fork lines -->
      <path d="M 60,26 L 82,14" fill="none" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
      <path d="M 60,33 L 82,33" fill="none" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>
      <path d="M 60,40 L 82,52" fill="none" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>

      <!-- Candidates -->
      <rect x="84" y="6" width="70" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.9"/>
      <text x="119" y="18" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#92400e">Cand 1 (K₁)</text>

      <rect x="84" y="25" width="70" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.9"/>
      <text x="119" y="37" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#92400e">Cand 2 (K₂)</text>

      <rect x="84" y="44" width="70" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.9"/>
      <text x="119" y="56" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#92400e">Cand N (K_N)</text>

      <!-- Merge lines to Selector -->
      <path d="M 154,14 L 180,26" fill="none" stroke="#d97706" stroke-width="1.3"/>
      <path d="M 154,33 L 180,33" fill="none" stroke="#d97706" stroke-width="1.3"/>
      <path d="M 154,52 L 180,40" fill="none" stroke="#d97706" stroke-width="1.3"/>

      <!-- Selector Box -->
      <rect x="182" y="18" width="74" height="30" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
      <text x="219" y="37" text-anchor="middle" font-size="8.5" font-weight="700" fill="#854d0e">Selector / V(τ)</text>
    </g>

    <!-- Systems Equations & Quantitative Bounds -->
    <g transform="translate(14, 122)">
      <!-- Critical Path Latency -->
      <rect width="266" height="52" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#334155">Critical-Path Latency</text>
      <text x="10" y="38" font-size="9" font-family="ui-monospace, monospace" fill="#d97706">T_wall = t_prefill(P) + max_n t_dec(K_n)</text>

      <!-- Accelerator Memory Footprint -->
      <g transform="translate(0, 58)">
        <rect width="266" height="52" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="18" font-size="9.5" font-weight="700" fill="#334155">Accelerator Memory Footprint</text>
        <text x="10" y="38" font-size="9" font-family="ui-monospace, monospace" fill="#0f172a">M_KV ∝ P + Σ_{n=1}^N K_n  (N streams)</text>
      </g>

      <!-- Systems Execution Characteristics -->
      <g transform="translate(0, 116)">
        <rect width="266" height="126" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="18" font-size="9.5" font-weight="700" fill="#334155">Execution Model</text>

        <text x="10" y="38" font-size="9" font-weight="600" fill="#475569">Dependency:</text>
        <text x="82" y="38" font-size="9" fill="#0f172a">Embarrassingly parallel batch</text>

        <text x="10" y="58" font-size="9" font-weight="600" fill="#475569">Prefix Cache:</text>
        <text x="82" y="58" font-size="9" fill="#0f172a">Prompt P shared via Radix tree</text>

        <text x="10" y="78" font-size="9" font-weight="600" fill="#475569">Throughput:</text>
        <text x="82" y="78" font-size="9" fill="#0f172a">Maximizes GPU arithmetic intensity</text>

        <text x="10" y="98" font-size="9" font-weight="600" fill="#475569">Systems Limit:</text>
        <text x="82" y="98" font-size="9" fill="#b91c1c">HBM capacity ceiling (KV bloat)</text>

        <text x="10" y="116" font-size="9" font-weight="600" fill="#475569">Pruning:</text>
        <text x="82" y="116" font-size="9" fill="#475569">Zero intermediate step pruning</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 3: FEEDBACK (Closed-Loop Revision)                          -->
  <!-- ================================================================= -->
  <g transform="translate(646, 16)">
    <!-- Container Card -->
    <rect width="294" height="376" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="294" height="32" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
    <text x="147" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Closed-Loop Feedback (Revision)</text>

    <!-- Topological Flow Schematic -->
    <g transform="translate(14, 46)">
      <rect width="266" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      
      <rect x="8" y="10" width="44" height="24" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="0.9"/>
      <text x="30" y="25" text-anchor="middle" font-size="8" font-weight="600" fill="#0f172a">P₁</text>

      <line x1="52" y1="22" x2="68" y2="22" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>

      <rect x="70" y="10" width="48" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
      <text x="94" y="25" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#166534">Gen Y₁</text>

      <line x1="118" y1="22" x2="134" y2="22" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>

      <rect x="136" y="10" width="58" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.9"/>
      <text x="165" y="25" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#991b1b">Oracle (O₁)</text>

      <line x1="194" y1="22" x2="208" y2="22" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>

      <rect x="210" y="10" width="48" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
      <text x="234" y="25" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#166534">Gen Y₂</text>

      <!-- Feedback Arc -->
      <path d="M 234,34 L 234,54 L 94,54 L 94,36" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="2.5,2" marker-end="url(#arr-green)"/>
      <text x="164" y="50" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">Iterative Repair Loop</text>
    </g>

    <!-- Systems Equations & Quantitative Bounds -->
    <g transform="translate(14, 122)">
      <!-- Critical Path Latency -->
      <rect width="266" height="52" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#334155">Critical-Path Latency</text>
      <text x="10" y="38" font-size="8.5" font-family="ui-monospace, monospace" fill="#16a34a">T_wall = Σ_r [t_gen(P_r) + t_tool(Y_r)]</text>

      <!-- Accelerator Memory Footprint -->
      <g transform="translate(0, 58)">
        <rect width="266" height="52" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="18" font-size="9.5" font-weight="700" fill="#334155">Accumulated Context History</text>
        <text x="10" y="38" font-size="9" font-family="ui-monospace, monospace" fill="#0f172a">P_{r+1} = P_1 + Σ_{j=1}^r (K_j + |O_j|)</text>
      </g>

      <!-- Systems Execution Characteristics -->
      <g transform="translate(0, 116)">
        <rect width="266" height="126" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="18" font-size="9.5" font-weight="700" fill="#334155">Execution Model</text>

        <text x="10" y="38" font-size="9" font-weight="600" fill="#475569">Dependency:</text>
        <text x="82" y="38" font-size="9" fill="#0f172a">Closed-loop state feedback</text>

        <text x="10" y="58" font-size="9" font-weight="600" fill="#475569">Grounding:</text>
        <text x="82" y="58" font-size="9" fill="#0f172a">Deterministic runtime environment</text>

        <text x="10" y="78" font-size="9" font-weight="600" fill="#475569">Falsification:</text>
        <text x="82" y="78" font-size="9" fill="#0f172a">Definitively falsifies invalid states</text>

        <text x="10" y="98" font-size="9" font-weight="600" fill="#475569">Systems Limit:</text>
        <text x="82" y="98" font-size="9" fill="#b91c1c">Context bloat &amp; tool latency</text>

        <text x="10" y="116" font-size="9" font-weight="600" fill="#475569">Requirement:</text>
        <text x="82" y="116" font-size="9" fill="#475569">KV cache prefix compaction</text>
      </g>
    </g>
  </g>
</svg>
