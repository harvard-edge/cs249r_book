<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#2563EB"/>
    </marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#D97706"/>
    </marker>
    <marker id="arr-emerald" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#059669"/>
    </marker>
  </defs>
  <rect width="920" height="360" fill="#FFFFFF"/>

  <!-- Panel 1: Depth -->
  <g transform="translate(20, 20)">
    <rect width="275" height="320" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
    <rect width="275" height="32" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="137" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">1. DEPTH (SEQUENTIAL EXTENSION)</text>
    
    <!-- Flow diagram -->
    <rect x="25" y="52" width="60" height="28" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/>
    <text x="55" y="70" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">Prompt P</text>
    <line x1="85" y1="66" x2="115" y2="66" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    
    <rect x="117" y="52" width="45" height="28" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
    <text x="139" y="70" text-anchor="middle" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" fill="#1E40AF">y₁</text>
    <line x1="162" y1="66" x2="190" y2="66" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    
    <rect x="192" y="52" width="60" height="28" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
    <text x="222" y="70" text-anchor="middle" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" fill="#1E40AF">... y_K</text>
    
    <!-- Critical path box -->
    <rect x="15" y="95" width="245" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="25" y="111" font-size="8.5" font-weight="700" fill="#475569">Critical-Path Latency:</text>
    <text x="25" y="127" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#1E40AF">T_wall = t_prefill(P) + K · t_decode</text>
    
    <!-- Memory box -->
    <rect x="15" y="145" width="245" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="25" y="161" font-size="8.5" font-weight="700" fill="#475569">Accelerator Memory Footprint:</text>
    <text x="25" y="177" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#0F172A">M_KV ∝ (P + K)  [Single linear cache]</text>
    
    <!-- Properties -->
    <line x1="15" y1="200" x2="260" y2="200" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="222" font-size="8.5" fill="#15803D">✓ Minimal memory overhead</text>
    <text x="20" y="240" font-size="8.5" fill="#15803D">✓ Enables deep multi-step reasoning</text>
    <text x="20" y="260" font-size="8.5" fill="#DC2626">✗ Strictly serialized latency: O(K)</text>
    <text x="20" y="278" font-size="8.5" fill="#DC2626">✗ Open-loop: errors compound irreversibly</text>
    <text x="20" y="298" font-size="8.5" font-style="italic" fill="#64748B">Zero external feedback during decode</text>
  </g>

  <!-- Panel 2: Breadth -->
  <g transform="translate(322, 20)">
    <rect width="275" height="320" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.2"/>
    <rect width="275" height="32" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="137" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">2. BREADTH (PARALLEL EXPLORATION)</text>
    
    <!-- Flow diagram -->
    <rect x="15" y="52" width="55" height="28" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/>
    <text x="42" y="70" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">Prompt P</text>
    
    <!-- Fork lines -->
    <path d="M 70,66 L 95,46 L 105,46" fill="none" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
    <path d="M 70,66 L 105,66" fill="none" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
    <path d="M 70,66 L 95,86 L 105,86" fill="none" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
    
    <rect x="107" y="38" width="75" height="18" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="144" y="51" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#92400E">Cand 1 (K₁)</text>
    
    <rect x="107" y="58" width="75" height="18" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="144" y="71" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#92400E">Cand 2 (K₂)</text>
    
    <rect x="107" y="78" width="75" height="18" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="144" y="91" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#92400E">Cand N (K_N)</text>
    
    <path d="M 182,46 L 195,66 L 205,66" fill="none" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
    <path d="M 182,66 L 205,66" fill="none" stroke="#D97706" stroke-width="1.2"/>
    <path d="M 182,86 L 195,66 L 205,66" fill="none" stroke="#D97706" stroke-width="1.2"/>
    
    <rect x="207" y="54" width="55" height="24" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="234" y="69" text-anchor="middle" font-size="8" font-weight="700" fill="#92400E">Selector</text>
    
    <!-- Critical path box -->
    <rect x="15" y="105" width="245" height="32" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="25" y="118" font-size="8" font-weight="700" fill="#475569">Critical Path:</text>
    <text x="25" y="130" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#B45309">T_wall = t_prefill(P) + max_n t_dec(K_n)</text>
    
    <!-- Memory box -->
    <rect x="15" y="145" width="245" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="25" y="161" font-size="8.5" font-weight="700" fill="#475569">Accelerator Memory Footprint:</text>
    <text x="25" y="177" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#0F172A">M_KV ∝ P + Σ K_n  [N concurrent caches]</text>
    
    <!-- Properties -->
    <line x1="15" y1="200" x2="260" y2="200" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="222" font-size="8.5" fill="#15803D">✓ Embarrassingly parallel across batch</text>
    <text x="20" y="240" font-size="8.5" fill="#15803D">✓ Reuses shared prefix KV cache</text>
    <text x="20" y="260" font-size="8.5" fill="#DC2626">✗ Severe GPU memory capacity pressure</text>
    <text x="20" y="278" font-size="8.5" fill="#DC2626">✗ Zero information sharing across branches</text>
    <text x="20" y="298" font-size="8.5" font-style="italic" fill="#64748B">Redundant failure modes if prior is flawed</text>
  </g>

  <!-- Panel 3: Feedback -->
  <g transform="translate(625, 20)">
    <rect width="275" height="320" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
    <rect width="275" height="32" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
    <text x="137" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">3. FEEDBACK (CLOSED-LOOP REVISION)</text>
    
    <!-- Flow diagram -->
    <rect x="15" y="44" width="48" height="22" rx="3" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/>
    <text x="39" y="58" text-anchor="middle" font-size="8" font-weight="600" fill="#0F172A">P</text>
    <line x1="63" y1="55" x2="78" y2="55" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-emerald)"/>
    
    <rect x="80" y="44" width="48" height="22" rx="3" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
    <text x="104" y="58" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#065F46">Gen Y₁</text>
    <line x1="128" y1="55" x2="143" y2="55" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-emerald)"/>
    
    <rect x="145" y="44" width="58" height="22" rx="3" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
    <text x="174" y="58" text-anchor="middle" font-size="7.5" font-weight="600" fill="#991B1B">Oracle (Err O₁)</text>
    <line x1="203" y1="55" x2="218" y2="55" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-emerald)"/>
    
    <rect x="220" y="44" width="42" height="22" rx="3" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
    <text x="241" y="58" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#065F46">Gen Y₂</text>
    
    <!-- Feedback arrow -->
    <path d="M 241,66 L 241,86 L 104,86 L 104,70" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-emerald)"/>
    <text x="172" y="82" text-anchor="middle" font-size="7.5" font-weight="600" fill="#059669">Iterative Repair Loop</text>
    
    <!-- Critical path box -->
    <rect x="15" y="98" width="245" height="36" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="25" y="111" font-size="7.5" font-weight="700" fill="#475569">Critical Path:</text>
    <text x="25" y="125" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#065F46">T_wall = Σ_r [t_gen(P_r, K_r) + t_oracle(Y_r)]</text>
    
    <!-- Memory box -->
    <rect x="15" y="145" width="245" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="25" y="161" font-size="8.5" font-weight="700" fill="#475569">Accumulated Context History:</text>
    <text x="25" y="177" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#0F172A">P_{r+1} = P_1 + Σ (K_j + |O_j|)</text>
    
    <!-- Properties -->
    <line x1="15" y1="200" x2="260" y2="200" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="222" font-size="8.5" fill="#15803D">✓ Ground-truth signal bridges epistemic gap</text>
    <text x="20" y="240" font-size="8.5" fill="#15803D">✓ Definitively falsifies invalid hypotheses</text>
    <text x="20" y="260" font-size="8.5" fill="#DC2626">✗ Monotonically compounding context bloat</text>
    <text x="20" y="278" font-size="8.5" fill="#DC2626">✗ Latency includes tool compile &amp; test runtimes</text>
    <text x="20" y="298" font-size="8.5" font-style="italic" fill="#64748B">Demands prefix caching &amp; context compaction</text>
  </g>
</svg>
