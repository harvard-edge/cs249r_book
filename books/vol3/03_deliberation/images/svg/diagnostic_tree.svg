<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="880" height="430" fill="#ffffff"/>

  <!-- ROOT: Ambiguous Telemetry Observation -->
  <g transform="translate(230, 16)">
    <rect width="420" height="58" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="210" y="24" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Input Telemetry Observation: x_telemetry</text>
    <text x="210" y="42" font-size="10" font-family="ui-monospace, monospace" fill="#475569" text-anchor="middle">log_trace: [WARN] replica_sync_lag &gt; 120ms (ambiguous root cause)</text>
  </g>

  <!-- Split paths -->
  <path d="M 370,74 L 370,96 L 220,96 L 220,118" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <path d="M 510,74 L 510,96 L 660,96 L 660,118" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <!-- Branch Label Badges -->
  <rect x="145" y="86" width="150" height="22" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="220" y="101" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">Open-Loop Generation</text>

  <rect x="585" y="86" width="150" height="22" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="660" y="101" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">Deliberative Tree Search</text>

  <!-- LEFT COLUMN: Open-Loop Irreversible Commitment -->
  <g transform="translate(50, 126)">
    <rect width="340" height="284" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Stage 1: Single High-Logit Hypothesis -->
    <g transform="translate(16, 16)">
      <rect width="308" height="62" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="10.5" font-weight="700" fill="#0f172a">Premature Hypothesis Selection (H₁)</text>
      <text x="12" y="34" font-size="9.5" fill="#475569">Prior bias: socket heartbeat timeout</text>
      <text x="12" y="50" font-size="9" font-family="ui-monospace, monospace" fill="#b91c1c">P(H₁ | prompt) = 0.72 (unverified mode)</text>
    </g>

    <path d="M 170,78 L 170,98" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>

    <!-- Stage 2: KV Cache Entrenchment -->
    <g transform="translate(16, 98)">
      <rect width="308" height="64" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="18" font-size="10.5" font-weight="700" fill="#991b1b">KV Cache Context Entrenchment</text>
      <text x="12" y="34" font-size="9.5" fill="#475569">Causal self-attention attends to emitted tokens y_&lt;t</text>
      <text x="12" y="50" font-size="9" font-style="italic" fill="#7f1d1d">Tokens rationalize H₁; cannot rewind accelerator memory</text>
    </g>

    <path d="M 170,162 L 170,182" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>

    <!-- Stage 3: Flawed Actuation Commit -->
    <g transform="translate(16, 182)">
      <rect width="308" height="84" rx="3" fill="#fff5f5" stroke="#f87171" stroke-width="1"/>
      <text x="12" y="18" font-size="10.5" font-weight="700" fill="#991b1b">Unverified Actuation &amp; Failure</text>
      <text x="12" y="34" font-size="9" font-family="ui-monospace, monospace" fill="#475569">patch: set socket_timeout_ms = 5000</text>
      <rect x="10" y="44" width="288" height="28" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="154" y="62" font-size="9.5" font-weight="600" fill="#991b1b" text-anchor="middle">Environment Defect Persists (Race Unresolved)</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Evidence-Grounded Deliberative Search -->
  <g transform="translate(490, 126)">
    <rect width="340" height="284" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Stage 1: Hypothesis Fork -->
    <g transform="translate(16, 16)">
      <rect width="308" height="62" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="10.5" font-weight="700" fill="#0f172a">Hypothesis Space Fork: {H₁, H₂}</text>
      <text x="12" y="34" font-size="9.5" fill="#475569">H₁: Socket timeout vs. H₂: Lease race condition</text>
      <text x="12" y="50" font-size="9" font-style="italic" fill="#0284c7">Acknowledge epistemic ambiguity prior to mutation</text>
    </g>

    <path d="M 170,78 L 170,98" fill="none" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>

    <!-- Stage 2: Discriminatory Tool Probe -->
    <g transform="translate(16, 98)">
      <rect width="308" height="64" rx="3" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
      <text x="12" y="18" font-size="10.5" font-weight="700" fill="#92400e">Discriminatory Probe Execution</text>
      <text x="12" y="34" font-size="9" font-family="ui-monospace, monospace" fill="#475569">exec: run_concurrency_fuzzer --keys=1000</text>
      <text x="12" y="50" font-size="9" font-weight="600" fill="#b45309">Evidence: Sockets intact; lease lock released early</text>
    </g>

    <path d="M 170,162 L 170,182" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>

    <!-- Stage 3: Grounded Actuation -->
    <g transform="translate(16, 182)">
      <rect width="308" height="84" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="12" y="18" font-size="10.5" font-weight="700" fill="#166534">Verified Actuation &amp; Resolution</text>
      <text x="12" y="34" font-size="9" font-family="ui-monospace, monospace" fill="#475569">patch: acquire_write_barrier(&amp;lease_seq)</text>
      <rect x="10" y="44" width="288" height="28" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="154" y="62" font-size="9.5" font-weight="600" fill="#15803d" text-anchor="middle">Environment Invariant Restored (0 Stale Reads)</text>
    </g>
  </g>

  <!-- Cross-Link: Discriminator Pruning -->
  <g transform="translate(390, 232)">
    <path d="M 100,12 L 8,12" fill="none" stroke="#d97706" stroke-dasharray="3,3" stroke-width="1.3" marker-end="url(#arr-amber)"/>
    <rect x="10" y="-3" width="80" height="30" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="0.9"/>
    <text x="50" y="10" font-size="8.5" font-weight="700" fill="#92400e" text-anchor="middle">Discriminator</text>
    <text x="50" y="21" font-size="7.5" fill="#b45309" text-anchor="middle">Prunes H₁</text>
  </g>
</svg>
