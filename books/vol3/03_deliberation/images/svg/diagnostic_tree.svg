<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas (No outer canvas border stroke) -->
  <rect width="840" height="440" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- ROOT: Initial Diagnostic Telemetry                               -->
  <!-- ================================================================= -->
  <g transform="translate(210, 18)">
    <rect width="420" height="68" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="420" height="22" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="15" font-size="9.5" font-weight="700" fill="#0f172a">OBSERVATION: CLUSTER ANOMALY TELEMETRY</text>
    <text x="14" y="38" font-size="8.5" font-weight="700" fill="#334155">Symptom: Intermittent stale read anomalies under write load</text>
    <text x="14" y="53" font-size="8.0" font-family="Courier New, monospace" fill="#64748b">log_trace: [WARN] replica_sync_lag &gt; 120ms (ambiguous root cause)</text>
  </g>

  <!-- Route from Root (Center bottom at x=420, y=86) -->
  <!-- Left Branch Path: down to y=104, left to x=190, down to y=148 -->
  <path d="M 360,86 L 360,104 L 200,104 L 200,146" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  
  <!-- Right Branch Path: down to y=104, right to x=640, down to y=148 -->
  <path d="M 480,86 L 480,104 L 640,104 L 640,146" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Branch badges positioned centered above their respective columns -->
  <rect x="135" y="112" width="130" height="20" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="200" y="125" font-size="8.0" font-weight="700" fill="#b91c1c" text-anchor="middle">Branch 1: Open-Loop</text>

  <rect x="575" y="112" width="130" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
  <text x="640" y="125" font-size="8.0" font-weight="700" fill="#0369a1" text-anchor="middle">Branch 2: Probed Search</text>

  <!-- ================================================================= -->
  <!-- LEFT COLUMN: Single-Pass Autoregressive Commitment (Failure)     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 148)">
    <!-- Main Card Container -->
    <rect width="320" height="264" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect width="320" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b91c1c">UNVERIFIED CANDIDATE COMMITMENT</text>

    <!-- Step 1: Plausible Hypothesis -->
    <g transform="translate(12, 34)">
      <rect width="296" height="54" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Hypothesis H1: Heartbeat Dropped</text>
      <text x="10" y="30" font-size="8.0" fill="#64748b">Common pretraining prior: network socket timeout</text>
      <text x="10" y="44" font-size="8.0" font-family="Courier New, monospace" fill="#b91c1c">P(H1 | prompt) = 0.72 (High local logit)</text>
    </g>

    <!-- Arrow down -->
    <path d="M 160,88 L 160,108" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <!-- Step 2: KV Cache Poisoning -->
    <g transform="translate(12, 110)">
      <rect width="296" height="54" rx="2" fill="#fff5f5" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Autoregressive Commitment (KV Cache)</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">Self-attention conditions on emitted tokens y&lt;t</text>
      <text x="10" y="44" font-size="8.0" font-style="italic" fill="#7f1d1d">Decode loop rationalizes H1 without verification</text>
    </g>

    <!-- Arrow down -->
    <path d="M 160,164 L 160,184" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <!-- Step 3: Fault Injection / Invariant Failure -->
    <g transform="translate(12, 186)">
      <rect width="296" height="66" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Flawed Actuation: Increase Heartbeat</text>
      <text x="10" y="29" font-size="8.0" font-family="Courier New, monospace" fill="#7f1d1d">patch: set socket_timeout_ms = 5000</text>
      <rect x="8" y="36" width="280" height="22" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
      <text x="148" y="51" font-size="8.0" font-weight="700" fill="#dc2626" text-anchor="middle">FAILURE: Invalidation race persists in production</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT COLUMN: Discriminatory Verification & Recovery             -->
  <!-- ================================================================= -->
  <g transform="translate(480, 148)">
    <!-- Main Card Container -->
    <rect width="320" height="264" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect width="320" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">EVIDENCE-GROUNDED DELIBERATION</text>

    <!-- Step 1: Multiple Competing Hypotheses -->
    <g transform="translate(12, 34)">
      <rect width="296" height="54" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Fork Hypotheses: H1 vs H2</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">H1: Heartbeat timeout | H2: Lease race condition</text>
      <text x="10" y="44" font-size="8.0" font-style="italic" fill="#0369a1">Acknowledge epistemic ambiguity before actuation</text>
    </g>

    <!-- Arrow down -->
    <path d="M 160,88 L 160,108" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>

    <!-- Step 2: Discriminatory Probe (External Tool / Test) -->
    <g transform="translate(12, 110)">
      <rect width="296" height="54" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#92400e">Discriminatory Probe (Tool Execution)</text>
      <text x="10" y="29" font-size="8.0" font-family="Courier New, monospace" fill="#78350f">exec: run_concurrency_fuzzer --keys=1000</text>
      <text x="10" y="44" font-size="8.0" font-weight="700" fill="#b45309">Evidence: Socket intact; Lease lock released early</text>
    </g>

    <!-- Arrow down -->
    <path d="M 160,164 L 160,184" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- Step 3: Grounded Resolution -->
    <g transform="translate(12, 186)">
      <rect width="296" height="66" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#166534">Verified Actuation: Fix Lease Barrier</text>
      <text x="10" y="29" font-size="8.0" font-family="Courier New, monospace" fill="#14532d">patch: acquire_write_barrier(&amp;lease_seq)</text>
      <rect x="8" y="36" width="280" height="22" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
      <text x="148" y="51" font-size="8.0" font-weight="700" fill="#15803d" text-anchor="middle">SUCCESS: Fuzzer verifies zero stale reads</text>
    </g>
  </g>

  <!-- Horizontal Evidence Exchange Link between columns -->
  <g transform="translate(360, 266)">
    <path d="M 120,20 L 2,20" fill="none" stroke="#d97706" stroke-dasharray="3,3" stroke-width="1.2" marker-end="url(#arr-amber)"/>
    <rect x="15" y="6" width="90" height="28" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
    <text x="60" y="18" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">Discriminator</text>
    <text x="60" y="28" font-size="7.0" fill="#78350f" text-anchor="middle">Prunes H1</text>
  </g>

</svg>
