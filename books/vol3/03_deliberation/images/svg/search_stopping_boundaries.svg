<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; text-anchor: middle; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .code-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1080" height="440" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title banner -->
  <rect x="20" y="16" width="1040" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="41" class="title">TEST-TIME SEARCH STOPPING BOUNDARIES AND BUDGET ALLOCATION</text>
  <text x="1045" y="41" class="box-sub" text-anchor="end">Multi-Dimensional Resource Gate &amp; Early Commit Logic</text>

  <!-- Flow layout: 3 Check Pillars -->
  <!-- Pillar 1: Hard Ceilings -->
  <g transform="translate(35, 75)">
    <rect width="315" height="245" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="157" y="28" class="box-lbl" fill="#991b1b">1. HARD CEILINGS</text>
    <text x="157" y="46" class="box-sub" text-anchor="middle">Non-Negotiable System Safety</text>

    <rect x="18" y="60" width="280" height="40" rx="4" fill="#ffffff" stroke="#fecaca"/>
    <text x="30" y="78" class="code-badge">Tokens ≥ K_max</text>
    <text x="30" y="93" class="box-sub">Exhausted token quota</text>

    <rect x="18" y="110" width="280" height="40" rx="4" fill="#ffffff" stroke="#fecaca"/>
    <text x="30" y="128" class="code-badge">Wall-Clock ≥ T_max</text>
    <text x="30" y="143" class="box-sub">SLA deadline timeout</text>

    <rect x="18" y="160" width="280" height="40" rx="4" fill="#ffffff" stroke="#fecaca"/>
    <text x="30" y="178" class="code-badge">Branch Depth ≥ D_max</text>
    <text x="30" y="193" class="box-sub">Anti-drift step barrier</text>

    <text x="157" y="226" class="card-text" font-weight="700" fill="#dc2626" text-anchor="middle">ANY HIT: Force Halt &amp; Yield</text>
  </g>

  <!-- Pillar 2: Threshold Satisfaction -->
  <g transform="translate(380, 75)">
    <rect width="315" height="245" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="157" y="28" class="box-lbl" fill="#065f46">2. THRESHOLD SATISFACTION</text>
    <text x="157" y="46" class="box-sub" text-anchor="middle">Opportunistic Early Exit</text>

    <rect x="18" y="60" width="280" height="40" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="30" y="78" class="code-badge">Certified V(τ) == 1.0</text>
    <text x="30" y="93" class="box-sub">Deterministic oracle pass</text>

    <rect x="18" y="110" width="280" height="40" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="30" y="128" class="code-badge">Unit Test Suite: 100% OK</text>
    <text x="30" y="143" class="box-sub">Clean exit code 0</text>

    <rect x="18" y="160" width="280" height="40" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="30" y="178" class="code-badge">Schema Validated</text>
    <text x="30" y="193" class="box-sub">JSON/AST grammar confirmed</text>

    <text x="157" y="226" class="card-text" font-weight="700" fill="#059669" text-anchor="middle">MET: Immediate Commit</text>
  </g>

  <!-- Pillar 3: Marginal Utility -->
  <g transform="translate(725, 75)">
    <rect width="315" height="245" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="157" y="28" class="box-lbl" fill="#1e40af">3. MARGINAL UTILITY</text>
    <text x="157" y="46" class="box-sub" text-anchor="middle">Economic Efficiency Gate</text>

    <rect x="18" y="60" width="280" height="40" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="30" y="78" class="code-badge">ΔP(succ) / ΔC &lt; ε_stop</text>
    <text x="30" y="93" class="box-sub">Marginal gain saturates</text>

    <rect x="18" y="110" width="280" height="40" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="30" y="128" class="code-badge">Rolling Window Decay</text>
    <text x="30" y="143" class="box-sub">Search frontier plateaued</text>

    <rect x="18" y="160" width="280" height="40" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="30" y="178" class="code-badge">Action-Risk Cap</text>
    <text x="30" y="193" class="box-sub">Irreversible mutation gate</text>

    <text x="157" y="226" class="card-text" font-weight="700" fill="#2563eb" text-anchor="middle">SUB-EPSILON: Terminate</text>
  </g>

  <!-- Bottom Invariant Rule -->
  <rect x="20" y="340" width="1040" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="365" class="card-text" font-weight="700" fill="#0f172a">Stopping Rule Hierarchy:</text>
  <text x="35" y="383" class="card-text">1. Hard ceilings unconditionally bound latency and budget. 2. Certified deterministic verification triggers instant early exit.</text>
  <text x="35" y="400" class="card-text">3. Marginal utility monitoring halts exploration when expected success gains no longer justify incremental token inference costs.</text>
</svg>