<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel-hdr { font-size: 11px; font-weight: 700; }
      .axis-lbl { font-size: 10px; font-weight: 700; fill: #0f172a; }
      .tick-txt { font-size: 9px; fill: #64748b; }
      .traj-lbl { font-size: 8.5px; font-weight: 700; }
      .step-hdr { font-size: 9.5px; font-weight: 700; }
      .step-body { font-size: 8px; fill: #334155; }
      .mono-txt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 8px; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1020" height="420" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: State-Space Stopping Envelopes                           -->
  <!-- ================================================================= -->
  <g transform="translate(20, 16)">
    <rect width="530" height="388" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="530" height="28" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="18" class="panel-hdr" fill="#0369a1">A. Multidimensional Stopping State-Space</text>

    <!-- Coordinate Plot Area: x=60 to 490 (width 430), y=54 to 330 (height 276) -->
    <!-- Grid lines -->
    <line x1="60" y1="330" x2="490" y2="330" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="60" y1="261" x2="490" y2="261" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="60" y1="192" x2="490" y2="192" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="60" y1="123" x2="490" y2="123" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="60" y1="54"  x2="490" y2="54"  stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Axis ticks -->
    <text x="50" y="334" class="tick-txt" text-anchor="end">0.0</text>
    <text x="50" y="265" class="tick-txt" text-anchor="end">0.25</text>
    <text x="50" y="196" class="tick-txt" text-anchor="end">0.50</text>
    <text x="50" y="127" class="tick-txt" text-anchor="end">0.75</text>
    <text x="50" y="58"  class="tick-txt" text-anchor="end">1.0</text>

    <text x="60"  y="346" class="tick-txt" text-anchor="middle">0</text>
    <text x="167" y="346" class="tick-txt" text-anchor="middle">0.25 K_max</text>
    <text x="275" y="346" class="tick-txt" text-anchor="middle">0.50 K_max</text>
    <text x="382" y="346" class="tick-txt" text-anchor="middle">0.75 K_max</text>
    <text x="470" y="346" class="tick-txt" font-weight="700" fill="#b91c1c" text-anchor="middle">K_max (Ceiling)</text>

    <!-- Axes -->
    <line x1="60" y1="330" x2="505" y2="330" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>
    <line x1="60" y1="330" x2="60"  y2="42"  stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>

    <text x="-192" y="18" class="axis-lbl" transform="rotate(-90)" text-anchor="middle">Verification Score V(τ)</text>
    <text x="280" y="365" class="axis-lbl" text-anchor="middle">Search Compute / Token Expenditure K</text>

    <!-- BOUNDARY 1: Certified Verification Hyperplane V=1.0 (Top Green Line) -->
    <line x1="60" y1="54" x2="470" y2="54" stroke="#16a34a" stroke-width="2.2"/>
    <rect x="230" y="42" width="168" height="18" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <text x="314" y="54" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Certified Pass: V(τ) = 1.0 (Early Exit)</text>

    <!-- BOUNDARY 2: Hard Resource Ceiling (Right Red Line) -->
    <line x1="470" y1="54" x2="470" y2="330" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,3"/>
    <rect x="400" y="170" width="65" height="34" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="432" y="183" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Hard Ceiling</text>
    <text x="432" y="196" font-size="7" font-family="ui-monospace, monospace" fill="#7f1d1d" text-anchor="middle">K ≥ K_max</text>

    <!-- BOUNDARY 3: Marginal Utility Plateau Region (Amber shaded curve) -->
    <path d="M 180,110 C 240,110 320,115 470,118 L 470,140 C 320,135 240,130 180,130 Z" fill="#fef3c7" opacity="0.6"/>
    <text x="290" y="125" font-size="7.5" font-weight="700" fill="#92400e" text-anchor="middle">Diminishing Returns: ΔP/ΔC &lt; ε_stop</text>

    <!-- SEARCH TRAJECTORIES -->
    <!-- Trajectory 1: Fast deterministic exit (Green) -->
    <path d="M 60,320 C 90,300 120,200 160,54" fill="none" stroke="#16a34a" stroke-width="2.2"/>
    <circle cx="160" cy="54" r="5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
    <text x="110" y="130" class="traj-lbl" fill="#15803d">τ_fast (Exit: V=1)</text>

    <!-- Trajectory 2: Marginal utility stopping (Blue) -->
    <path d="M 60,320 C 100,280 160,150 250,118 C 290,112 330,111 360,110" fill="none" stroke="#0284c7" stroke-width="2.2"/>
    <circle cx="360" cy="110" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <text x="285" y="96" class="traj-lbl" fill="#0369a1">τ_plateau (Marginal Exit)</text>

    <!-- Trajectory 3: Hard limit timeout (Red) -->
    <path d="M 60,320 C 120,310 200,290 280,270 C 360,250 420,255 470,250" fill="none" stroke="#dc2626" stroke-width="2.2"/>
    <circle cx="470" cy="250" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <text x="400" y="270" class="traj-lbl" fill="#991b1b">τ_timeout (Halt)</text>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: Multicriteria Stopping Decision Hierarchy                -->
  <!-- ================================================================= -->
  <g transform="translate(570, 16)">
    <rect width="430" height="388" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="430" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="14" y="18" class="panel-hdr" fill="#5b21b6">B. Hierarchical Evaluation Precedence</text>

    <!-- Step 1: Hard Ceilings -->
    <g transform="translate(16, 40)">
      <rect width="398" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="398" height="22" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
      <text x="12" y="15" class="step-hdr" fill="#991b1b">Priority 1: Hard Resource Ceilings (Safety Barrier)</text>

      <text x="12" y="38" class="step-body"><tspan font-weight="700" fill="#0f172a">Metrics:</tspan> Cumulative tokens Σ K_b ≥ K_max, wall-clock T ≥ T_max, depth D ≥ D_max</text>
      <text x="12" y="52" class="step-body"><tspan font-weight="700" fill="#0f172a">Action:</tspan> Unconditionally halt search loop; interrupt running decodes</text>
      
      <rect x="10" y="62" width="378" height="20" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="199" y="76" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">Force Halt: Yield highest-scoring candidate in memory escrow</text>
    </g>

    <!-- Down arrow -->
    <line x1="215" y1="130" x2="215" y2="148" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>
    <text x="225" y="142" font-size="7.5" fill="#64748b">Within budget</text>

    <!-- Step 2: Threshold Satisfaction -->
    <g transform="translate(16, 150)">
      <rect width="398" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="398" height="22" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
      <text x="12" y="15" class="step-hdr" fill="#166534">Priority 2: Threshold Satisfaction (Opportunistic Commit)</text>

      <text x="12" y="38" class="step-body"><tspan font-weight="700" fill="#0f172a">Metrics:</tspan> Certified pass V(τ) = 1.0 (compiler pass, unit test suite 100% OK, schema valid)</text>
      <text x="12" y="52" class="step-body"><tspan font-weight="700" fill="#0f172a">Action:</tspan> Abort competing branches; deallocate pending GPU batches</text>
      
      <rect x="10" y="62" width="378" height="20" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="199" y="76" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Commit τ* · zero added spend</text>
    </g>

    <!-- Down arrow -->
    <line x1="215" y1="240" x2="215" y2="258" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>
    <text x="225" y="252" font-size="7.5" fill="#64748b">Uncertified</text>

    <!-- Step 3: Marginal Utility Stopping -->
    <g transform="translate(16, 260)">
      <rect width="398" height="106" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="398" height="22" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
      <text x="12" y="15" class="step-hdr" fill="#92400e">Priority 3: Marginal Utility Stopping (Economic Efficiency)</text>

      <text x="12" y="38" class="step-body"><tspan font-weight="700" fill="#0f172a">Derivative:</tspan> Evaluate rolling window ΔP(success) / ΔC &lt; ε_stop</text>
      <text x="12" y="52" class="step-body">Marginal gain below ε</text>
      <text x="12" y="66" class="step-body"><tspan font-weight="700" fill="#0f172a">Action:</tspan> Graceful termination; commit consensus mode or escalate plan</text>

      <rect x="10" y="76" width="378" height="22" rx="2" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.8"/>
      <text x="199" y="91" font-size="8" font-weight="700" fill="#92400e" text-anchor="middle">Yield best before exhaustion</text>
    </g>
  </g>
</svg>