<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="490" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT PANEL: Naive Independent Serving                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect width="432" height="370" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="432" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">A. NAIVE INDEPENDENT SERVING (REDUNDANT DUPLICATION)</text>

    <!-- Memory Rows -->
    <g transform="translate(14, 34)">
      <!-- Branch 1 -->
      <text x="0" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Branch 1:</text>
      <rect x="60" y="2" width="124" height="18" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="122" y="14" font-size="7.5" font-weight="600" fill="#334155" text-anchor="middle">System Prompt (2k)</text>
      <rect x="188" y="2" width="112" height="18" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="244" y="14" font-size="7.5" font-weight="600" fill="#334155" text-anchor="middle">Step 1 Trace (1.5k)</text>
      <rect x="304" y="2" width="100" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="354" y="14" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Step 2 (A) (0.5k)</text>

      <!-- Branch 2 -->
      <text x="0" y="42" font-size="8.5" font-weight="700" fill="#0f172a">Branch 2:</text>
      <rect x="60" y="30" width="124" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="122" y="42" font-size="7.5" font-weight="600" fill="#991b1b" text-anchor="middle">Prompt (2k) [DUP]</text>
      <rect x="188" y="30" width="112" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="244" y="42" font-size="7.5" font-weight="600" fill="#991b1b" text-anchor="middle">Step 1 [DUP]</text>
      <rect x="304" y="30" width="100" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="354" y="42" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Step 2 (B) (0.5k)</text>

      <!-- Branch 3 -->
      <text x="0" y="70" font-size="8.5" font-weight="700" fill="#0f172a">Branch 3:</text>
      <rect x="60" y="58" width="124" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="122" y="70" font-size="7.5" font-weight="600" fill="#991b1b" text-anchor="middle">Prompt (2k) [DUP]</text>
      <rect x="188" y="58" width="112" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="244" y="70" font-size="7.5" font-weight="600" fill="#991b1b" text-anchor="middle">Step 1 [DUP]</text>
      <rect x="304" y="58" width="100" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="354" y="70" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Step 2 (C) (0.5k)</text>

      <!-- Branch 4 -->
      <text x="0" y="98" font-size="8.5" font-weight="700" fill="#0f172a">Branch 4:</text>
      <rect x="60" y="86" width="124" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="122" y="98" font-size="7.5" font-weight="600" fill="#991b1b" text-anchor="middle">Prompt (2k) [DUP]</text>
      <rect x="188" y="86" width="112" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="244" y="98" font-size="7.5" font-weight="600" fill="#991b1b" text-anchor="middle">Step 1 [DUP]</text>
      <rect x="304" y="86" width="100" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="354" y="98" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Step 2 (D) (0.5k)</text>
    </g>

    <!-- Stats Card -->
    <g transform="translate(14, 154)">
      <rect width="404" height="112" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Memory Footprint &amp; Prefill Overhead:</text>
      <text x="10" y="34" font-size="8" fill="#334155">• Total HBM Allocation: <tspan font-weight="700" fill="#dc2626">4 × 4,000 = 16,000 tokens</tspan></text>
      <text x="10" y="50" font-size="8" fill="#334155">• Redundant Duplicate Tokens: <tspan font-weight="700" fill="#dc2626">10,500 tokens (65.6% pure waste)</tspan></text>
      <text x="10" y="66" font-size="8" fill="#334155">• Prefill Thrashing: Redundant re-computation of 3.5k tokens 4× times</text>
      <text x="10" y="82" font-size="8" fill="#334155">• Latency Tax: Serialization of quadratic attention prefill passes</text>
      <text x="10" y="98" font-size="8" font-weight="700" fill="#991b1b">• Consequence: Rapid HBM OOM when scaling search width B &gt; 8</text>
    </g>

    <!-- Status Alert Box -->
    <g transform="translate(14, 276)">
      <rect width="404" height="48" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="202" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">HBM Status: Severe Memory Fragmentation &amp; Low Concurrency</text>
      <text x="202" y="34" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Independent inference contexts cannot share physical KV-cache page blocks</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: Radix Tree Cache                                     -->
  <!-- ================================================================= -->
  <g transform="translate(488, 74)">
    <rect width="432" height="370" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="432" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">B. RADIX TREE KV-CACHE WITH COPY-ON-WRITE (RADIXATTENTION)</text>

    <!-- Tree Graph Diagram -->
    <g transform="translate(14, 34)">
      <!-- Root Node -->
      <rect x="0" y="32" width="105" height="42" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
      <text x="52" y="48" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Root Node</text>
      <text x="52" y="62" font-size="7.5" fill="#15803d" text-anchor="middle">Prompt: 2k tok [rc=4]</text>

      <!-- Step 1 Node -->
      <rect x="135" y="32" width="105" height="42" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
      <text x="187" y="48" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Step 1 Node</text>
      <text x="187" y="62" font-size="7.5" fill="#15803d" text-anchor="middle">Trace: 1.5k tok [rc=4]</text>

      <line x1="105" y1="53" x2="135" y2="53" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

      <!-- 4 Delta Leaf Nodes -->
      <line x1="240" y1="44" x2="280" y2="14" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
      <line x1="240" y1="50" x2="280" y2="40" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
      <line x1="240" y1="56" x2="280" y2="66" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
      <line x1="240" y1="62" x2="280" y2="92" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

      <rect x="284" y="4" width="120" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="344" y="17" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Leaf A: Δ 0.5k [rc=1]</text>

      <rect x="284" y="30" width="120" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="344" y="43" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Leaf B: Δ 0.5k [rc=1]</text>

      <rect x="284" y="56" width="120" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="344" y="69" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Leaf C: Δ 0.5k [rc=1]</text>

      <rect x="284" y="82" width="120" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="344" y="95" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Leaf D: Δ 0.5k [rc=1]</text>
    </g>

    <!-- Stats Card -->
    <g transform="translate(14, 154)">
      <rect width="404" height="112" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Radix Tree Memory &amp; Prefill Savings:</text>
      <text x="10" y="34" font-size="8" fill="#334155">• Shared Root &amp; Step 1: <tspan font-weight="700" fill="#16a34a">2,000 + 1,500 = 3,500 tokens</tspan> (allocated ONCE)</text>
      <text x="10" y="50" font-size="8" fill="#334155">• Delta Leaves Allocation: <tspan font-weight="700" fill="#16a34a">4 × 500 = 2,000 tokens</tspan></text>
      <text x="10" y="66" font-size="8" fill="#334155">• Total HBM Allocation: <tspan font-weight="700" fill="#15803d">5,500 tokens vs. 16,000 tokens (65.6% saved!)</tspan></text>
      <text x="10" y="82" font-size="8" fill="#334155">• Zero Prefill Overhead: Child branches branch instantly without prefill</text>
      <text x="10" y="98" font-size="8" font-weight="700" fill="#15803d">• Consequence: Scales gracefully to width B = 32+ and deep lookaheads</text>
    </g>

    <!-- Status Alert Box -->
    <g transform="translate(14, 276)">
      <rect width="404" height="48" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <text x="202" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">HBM Status: High Concurrency &amp; Reference Counting</text>
      <text x="202" y="34" text-anchor="middle" font-size="7.5" fill="#166534">PagedAttention physical blocks freed automatically when refcount (rc) drops to 0</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM BANNER: SYSTEMS INVARIANT                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 454)">
    <rect width="880" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Systems Invariant: The Prefix-Tree Memory Law</text>
    <text x="14" y="32" font-size="7.5" fill="#64748b">When serving branching search trees, memory scales with tree frontier width rather than total token count: M_tree = M_prefix + Σ M_Δ(leaf) ≪ Σ M_total(path).</text>
  </g>
</g>
</svg>