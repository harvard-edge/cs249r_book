<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE ANTI-SWARM PRINCIPLE: MESH SWARMS VS. HIERARCHICAL SUPERVISOR TREES</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Why production engineering rejects peer-to-peer agent swarms in favor of unidirectional supervisor topologies</text>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: Peer-to-Peer Mesh Swarm (Anti-Pattern)                 -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="425" height="425" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="425" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">ANTI-PATTERN: PEER-TO-PEER MESH SWARM (QUADRATIC DILUTION)</text>

    <!-- Mesh Graph Visualization -->
    <g transform="translate(0, 30)">
      <!-- Central Warning Badge -->
      <circle cx="212" cy="105" r="28" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="212" y="102" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">O(N²)</text>
      <text x="212" y="113" text-anchor="middle" font-size="7" fill="#b91c1c">Message Chaos</text>

      <!-- Mesh Edges (Bidirectional Cross-talk) -->
      <!-- A <-> B -->
      <line x1="192" y1="38" x2="108" y2="92" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <line x1="108" y1="92" x2="192" y2="38" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <!-- A <-> C -->
      <line x1="232" y1="38" x2="316" y2="92" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <line x1="316" y1="92" x2="232" y2="38" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <!-- A <-> D (vertical dashed) -->
      <line x1="212" y1="52" x2="212" y2="158" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 3"/>
      <!-- B <-> D -->
      <line x1="108" y1="118" x2="192" y2="172" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <line x1="192" y1="172" x2="108" y2="118" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <!-- C <-> D -->
      <line x1="316" y1="118" x2="232" y2="172" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <line x1="232" y1="172" x2="316" y2="118" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <!-- B <-> C (horizontal dashed) -->
      <line x1="118" y1="105" x2="306" y2="105" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 3"/>

      <!-- Nodes -->
      <!-- Agent A (Top) -->
      <circle cx="212" cy="30" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="212" y="34" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Agent A</text>

      <!-- Agent B (Left) -->
      <circle cx="95" cy="105" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="95" y="109" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Agent B</text>

      <!-- Agent C (Right) -->
      <circle cx="330" cy="105" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="330" y="109" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Agent C</text>

      <!-- Agent D (Bottom) -->
      <circle cx="212" cy="180" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="212" y="184" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Agent D</text>
    </g>

    <!-- Failure Mechanisms Card -->
    <g transform="translate(15, 250)">
      <rect x="0" y="0" width="395" height="155" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#991b1b">PRODUCTION FAILURE MODES</text>
      
      <g transform="translate(12, 28)">
        <text x="0" y="10" font-size="8" fill="#334155"><tspan font-weight="700" fill="#991b1b">• Context Dilution:</tspan> Everyone sees everything; quadratic token waste</text>
        <text x="0" y="24" font-size="8" fill="#334155"><tspan font-weight="700" fill="#991b1b">• Echo Chambers:</tspan> Hallucinated facts circulate and gain false consensus</text>
        <text x="0" y="38" font-size="8" fill="#334155"><tspan font-weight="700" fill="#991b1b">• Diffused Responsibility:</tspan> No single root entity owns the terminal state</text>
        <text x="0" y="52" font-size="8" fill="#334155"><tspan font-weight="700" fill="#991b1b">• Infinite Banter:</tspan> Agents thank and validate each other without acting</text>
        <text x="0" y="66" font-size="8" fill="#334155"><tspan font-weight="700" fill="#991b1b">• Context Pollution:</tspan> Unbounded memory thrashing with zero checkpointing</text>
      </g>

      <rect x="12" y="112" width="371" height="28" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="197" y="129" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">System Consequence: Heavy token burn &amp; nondeterministic livelock</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: Hierarchical Supervisor Tree (Production Standard)   -->
  <!-- ================================================================= -->
  <g transform="translate(495, 75)">
    <rect x="0" y="0" width="425" height="425" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="425" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">PRODUCTION STANDARD: HIERARCHICAL SUPERVISOR TREE</text>

    <!-- Tree Visualization -->
    <g transform="translate(0, 30)">
      <!-- Root Supervisor -->
      <g transform="translate(82, 0)">
        <rect x="0" y="0" width="260" height="46" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="130" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">Supervisor Agent (Orchestrator ACB)</text>
        <text x="130" y="28" text-anchor="middle" font-size="7.5" fill="#64748b">Owns Global State, Plan DAG, &amp; Task Budget</text>
        <text x="130" y="39" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">Root Accountability &amp; Termination Invariant</text>
      </g>

      <!-- Downward Delegation Edges -->
      <path d="M 130 46 L 70 85" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <text x="82" y="62" font-size="7.5" font-weight="700" fill="#6d28d9">Task A</text>

      <path d="M 212 46 L 190 85" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <text x="205" y="65" font-size="7.5" font-weight="700" fill="#6d28d9">Task B</text>

      <path d="M 294 46 L 310 85" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <text x="315" y="62" font-size="7.5" font-weight="700" fill="#6d28d9">Task C</text>

      <!-- Context Isolation Boundary Line -->
      <line x1="15" y1="78" x2="375" y2="78" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3"/>
      <text x="375" y="74" text-anchor="end" font-size="7" font-weight="700" fill="#64748b">Context Isolation Boundary</text>

      <!-- Worker 1: Code Search -->
      <g transform="translate(15, 90)">
        <rect x="0" y="0" width="110" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="55" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Search Worker</text>
        <text x="55" y="26" text-anchor="middle" font-size="7.5" fill="#64748b">Tool: Ripgrep / AST</text>
        <rect x="8" y="32" width="94" height="15" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
        <text x="55" y="43" text-anchor="middle" font-size="7" font-weight="700" fill="#6d28d9">Scoped Context Only</text>
      </g>

      <!-- Worker 2: Code Gen -->
      <g transform="translate(135, 90)">
        <rect x="0" y="0" width="110" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="55" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">CodeGen Worker</text>
        <text x="55" y="26" text-anchor="middle" font-size="7.5" fill="#64748b">Tool: File Editor</text>
        <rect x="8" y="32" width="94" height="15" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
        <text x="55" y="43" text-anchor="middle" font-size="7" font-weight="700" fill="#6d28d9">Scoped Context Only</text>
      </g>

      <!-- Worker 3: Sandbox Exec -->
      <g transform="translate(255, 90)">
        <rect x="0" y="0" width="110" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="55" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Sandbox Worker</text>
        <text x="55" y="26" text-anchor="middle" font-size="7.5" fill="#64748b">Tool: Bash / Docker</text>
        <rect x="8" y="32" width="94" height="15" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
        <text x="55" y="43" text-anchor="middle" font-size="7" font-weight="700" fill="#6d28d9">Scoped Context Only</text>
      </g>

      <!-- Verifier Gatekeeper Intercept -->
      <g transform="translate(82, 160)">
        <!-- Upward Return Edges to Gatekeeper -->
        <path d="M -12 -18 L 30 0" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 2"/>
        <path d="M 108 -18 L 130 0" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 2"/>
        <path d="M 228 -18 L 230 0" stroke="#16a34a" stroke-width="1" stroke-dasharray="2 2"/>

        <rect x="0" y="0" width="260" height="38" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="130" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Schema Verifier &amp; Test Oracle</text>
        <text x="130" y="27" text-anchor="middle" font-size="7.5" fill="#166534">Validates JSON Schema &amp; Invariants before State Commit</text>
      </g>

      <!-- Verified Upward Return to Supervisor -->
      <path d="M 342 178 C 400 178 400 23 342 23" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arr-green)"/>
      <rect x="380" y="94" width="38" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="399" y="105" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">Verified</text>
    </g>

    <!-- Architectural Invariants Card -->
    <g transform="translate(15, 250)">
      <rect x="0" y="0" width="395" height="155" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#6d28d9">ARCHITECTURAL INVARIANTS GUARANTEED</text>
      
      <g transform="translate(12, 28)">
        <text x="0" y="10" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Strict Hierarchy:</tspan> Workers cannot communicate with peers; zero chatter</text>
        <text x="0" y="24" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Context Isolation:</tspan> Workers receive only strict sub-prompts, saving tokens</text>
        <text x="0" y="38" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Schema Gating:</tspan> Unstructured babble rejected before reaching supervisor</text>
        <text x="0" y="52" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Monotonic Convergence:</tspan> Supervisor enforces progress invariants or aborts</text>
        <text x="0" y="66" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Deterministic Ownership:</tspan> Explicit fault domain and unambiguous accountability</text>
      </g>

      <rect x="12" y="112" width="371" height="28" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="197" y="129" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">System Benefit: Deterministic reliability, bounded cost, and auditability</text>
    </g>
  </g>
</svg>
