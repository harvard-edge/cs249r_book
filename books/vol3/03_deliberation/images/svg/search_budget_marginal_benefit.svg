<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 410" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel-hdr { font-size: 11px; font-weight: 700; }
      .axis-lbl { font-size: 9.5px; font-weight: 700; fill: #0f172a; }
      .tick-txt { font-size: 8.5px; fill: #64748b; }
      .mono-txt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 8px; }
      .sub-title { font-size: 9px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1020" height="410" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: Compute vs. Parameter Scale (Pareto Inversion)           -->
  <!-- ================================================================= -->
  <g transform="translate(20, 16)">
    <rect width="470" height="378" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="470" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="14" y="18" class="panel-hdr" fill="#5b21b6">A. Test-Time Scaling: Compute vs. Model Size</text>

    <!-- Plot Area: x=55 to 440 (width 385), y=48 to 300 (height 252) -->
    <!-- Grid -->
    <line x1="55" y1="300" x2="440" y2="300" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="55" y1="240" x2="440" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="55" y1="180" x2="440" y2="180" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="55" y1="120" x2="440" y2="120" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="55" y1="60"  x2="440" y2="60"  stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Y Ticks -->
    <text x="46" y="303" class="tick-txt" text-anchor="end">20%</text>
    <text x="46" y="243" class="tick-txt" text-anchor="end">40%</text>
    <text x="46" y="183" class="tick-txt" text-anchor="end">60%</text>
    <text x="46" y="123" class="tick-txt" text-anchor="end">80%</text>
    <text x="46" y="63"  class="tick-txt" text-anchor="end">100%</text>

    <!-- Axes -->
    <line x1="55" y1="300" x2="450" y2="300" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-gray)"/>
    <line x1="55" y1="300" x2="55"  y2="42"  stroke="#475569" stroke-width="1.3" marker-end="url(#arr-gray)"/>

    <text x="-174" y="18" class="axis-lbl" transform="rotate(-90)" text-anchor="middle">Task Accuracy / Success Rate</text>
    <text x="245" y="336" class="axis-lbl" text-anchor="middle">Inference Test-Time Compute (Search Tokens, log scale)</text>

    <!-- X Ticks -->
    <text x="65"  y="314" class="tick-txt">1× (Greedy)</text>
    <text x="180" y="314" class="tick-txt">10×</text>
    <text x="300" y="314" class="tick-txt">100×</text>
    <text x="410" y="314" class="tick-txt">1000×</text>

    <!-- Baseline 1: 70B Static Greedy Model (64% -> y=168) -->
    <line x1="55" y1="168" x2="440" y2="168" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="4,3"/>
    <rect x="290" y="154" width="144" height="18" rx="2" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="362" y="166" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">70B Dense Model (Greedy: 64%)</text>

    <!-- Baseline 2: 7B Static Greedy Model (32% -> y=264) -->
    <line x1="55" y1="264" x2="440" y2="264" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <rect x="310" y="252" width="124" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="372" y="263" font-size="7.5" font-weight="600" fill="#64748b" text-anchor="middle">7B Small Model (Greedy: 32%)</text>

    <!-- 7B + Deliberation Scaling Curve (Purple) -->
    <path d="M 55,264 Q 130,250 195,195 T 310,130 T 430,96" fill="none" stroke="#7c3aed" stroke-width="2.8"/>

    <!-- Markers on Curve -->
    <circle cx="55"  cy="264" r="4" fill="#7c3aed"/>
    <circle cx="195" cy="195" r="4" fill="#7c3aed"/>
    <circle cx="310" cy="130" r="4.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="430" cy="96"  r="4.5" fill="#5b21b6" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Callout: Pareto Frontier Inversion at 14x -->
    <g transform="translate(145, 68)">
      <rect width="180" height="38" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="90" y="16" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Pareto Inversion Crossover</text>
      <text x="90" y="30" font-size="8" fill="#7c3aed" text-anchor="middle">7B + Search matches 70B Greedy at 14×</text>
      <line x1="90" y1="38" x2="72" y2="92" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-purple)"/>
    </g>

    <!-- Footer specification note -->
    <rect x="14" y="348" width="442" height="20" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="235" y="361" font-size="8" fill="#475569" text-anchor="middle">Test-time compute, not weights</text>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: The Verification Tax: Pruning vs. Generation              -->
  <!-- ================================================================= -->
  <g transform="translate(510, 16)">
    <rect width="490" height="378" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="490" height="28" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="18" class="panel-hdr" fill="#0369a1">B. The Verification Tax: Pruning vs. Generation</text>

    <!-- Sub-Panel 1: Unverified Search (Left Tree) -->
    <g transform="translate(16, 36)">
      <rect width="216" height="236" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <rect width="216" height="22" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="108" y="15" class="sub-title" fill="#991b1b">Unverified Search (Blind DFS / Fanout)</text>

      <!-- Tree Diagram: b=5, depth=4 explosion -->
      <g transform="translate(10, 30)">
        <!-- Root -->
        <circle cx="20" cy="85" r="7" fill="#dc2626"/>
        
        <!-- Step 1 Branches (5 fan-out) -->
        <path d="M 27,80 L 60,30" stroke="#dc2626" stroke-width="1.2"/>
        <path d="M 27,82 L 60,58" stroke="#dc2626" stroke-width="1.2"/>
        <path d="M 27,85 L 60,85" stroke="#dc2626" stroke-width="1.2"/>
        <path d="M 27,88 L 60,112" stroke="#dc2626" stroke-width="1.2"/>
        <path d="M 27,90 L 60,140" stroke="#dc2626" stroke-width="1.2"/>

        <circle cx="60" cy="30" r="5" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
        <circle cx="60" cy="58" r="5" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
        <circle cx="60" cy="85" r="5" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
        <circle cx="60" cy="112" r="5" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
        <circle cx="60" cy="140" r="5" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>

        <!-- Step 2 Fanout (dense lines showing explosion) -->
        <path d="M 65,30 L 110,15" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,30 L 110,25" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,30 L 110,35" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,30 L 110,45" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,58 L 110,55" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,58 L 110,65" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,85 L 110,75" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,85 L 110,85" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,85 L 110,95" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,112 L 110,105" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,112 L 110,115" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,140 L 110,135" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,140 L 110,145" stroke="#f87171" stroke-width="0.9"/>
        <path d="M 65,140 L 110,155" stroke="#f87171" stroke-width="0.9"/>

        <!-- Explosion Fanout Zone (shaded polygon) -->
        <polygon points="115,10 185,2 185,168 115,160" fill="#fee2e2" opacity="0.6"/>
        <text x="150" y="80" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">5⁴ = 625 Paths</text>
        <text x="150" y="94" font-size="7" fill="#b91c1c" text-anchor="middle">1.28M Tokens</text>
      </g>

      <!-- Failure Annotation -->
      <rect x="8" y="206" width="200" height="22" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="108" y="220" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">92% of paths fail (unpruned errors)</text>
    </g>

    <!-- Sub-Panel 2: Verifier-Pruned Search (Right Tree) -->
    <g transform="translate(254, 36)">
      <rect width="220" height="236" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect width="220" height="22" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <text x="110" y="15" class="sub-title" fill="#15803d">Verifier-Pruned Search (PRM / Oracles)</text>

      <!-- Tree Diagram: Early Step Pruning -->
      <g transform="translate(10, 30)">
        <!-- Root -->
        <circle cx="20" cy="85" r="7" fill="#16a34a"/>

        <!-- Step 1 Branches (5 proposed, 3 pruned immediately!) -->
        <path d="M 27,80 L 60,30" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
        <text x="66" y="32" font-size="8" font-weight="700" fill="#dc2626">✗</text>

        <path d="M 27,82 L 60,58" stroke="#16a34a" stroke-width="1.8"/>
        <circle cx="60" cy="58" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>

        <path d="M 27,85 L 60,85" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
        <text x="66" y="87" font-size="8" font-weight="700" fill="#dc2626">✗</text>

        <path d="M 27,88 L 60,112" stroke="#16a34a" stroke-width="1.8"/>
        <circle cx="60" cy="112" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>

        <path d="M 27,90 L 60,140" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
        <text x="66" y="142" font-size="8" font-weight="700" fill="#dc2626">✗</text>

        <!-- PRM Gate 1 Label -->
        <rect x="74" y="14" width="46" height="14" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.7"/>
        <text x="97" y="24" font-size="6.5" font-weight="700" fill="#15803d" text-anchor="middle">PRM Gate 1</text>

        <!-- Step 2: only 2 branches continue, 1 pruned -->
        <path d="M 66,58 L 120,44" stroke="#16a34a" stroke-width="1.8"/>
        <circle cx="120" cy="44" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>

        <path d="M 66,58 L 120,68" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
        <text x="126" y="70" font-size="8" font-weight="700" fill="#dc2626">✗</text>

        <path d="M 66,112 L 120,112" stroke="#16a34a" stroke-width="1.8"/>
        <circle cx="120" cy="112" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>

        <!-- Step 3 & 4 Converge to Verified Winner -->
        <path d="M 126,44 L 175,70" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
        <circle cx="180" cy="72" r="8" fill="#16a34a"/>
        <text x="180" y="75" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">★</text>

        <text x="150" y="138" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">b_eff ≈ 1.6</text>
        <text x="150" y="150" font-size="7" fill="#166534" text-anchor="middle">~6.5 Paths (98.9% pruned)</text>
      </g>

      <!-- Success Annotation -->
      <rect x="8" y="206" width="204" height="22" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="110" y="220" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Spending 5% on checks saves &gt;90% FLOPs</text>
    </g>

    <!-- Quantitative Summary Comparison Strip at Bottom -->
    <g transform="translate(16, 282)">
      <rect width="458" height="86" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#0f172a">Systems Trade-off: Search Space Pruning Economics</text>
      
      <text x="12" y="36" font-size="8.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">Unverified FLOP Waste:</tspan> 625 trajectories × 2,048 tokens = 1.28M tokens generated blindly</text>
      <text x="12" y="52" font-size="8.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">PRM Pruned Compute:</tspan> Intermediate verifiers cost C_ver ≈ 0.05 × C_gen per reasoning step</text>
      
      <rect x="10" y="60" width="438" height="20" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="229" y="74" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Verification bounds the search</text>
    </g>
  </g>
</svg>
