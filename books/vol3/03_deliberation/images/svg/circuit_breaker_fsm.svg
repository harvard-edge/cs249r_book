<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="550" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Dynamic Circuit Breaker &amp; Semantic Cycle Detection FSM</text>
  <text x="480" y="48" text-anchor="middle" font-size="10.5" fill="#64748B">Runtime safety invariants preventing infinite loops, token bleed, and cascading tool failures</text>

  <!-- SENSORS / MONITORS BAR (Top) -->
  <g transform="translate(40, 68)" >
    <rect width="880" height="58" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="16" y="20" font-size="9.5" font-weight="700" fill="#0F172A">Continuous Invariant Monitors (Evaluated on every ACB turn):</text>

    <!-- Sensor 1: Semantic Delta -->
    <g transform="translate(16, 28)">
      <rect width="210" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="8" y="15" font-size="7.5" font-weight="600" fill="#475569">State Delta: <tspan font-family="monospace" fill="#0284C7">Δs = 1 - cos(e_k, e_{k-1}) ≥ ε</tspan></text>
    </g>

    <!-- Sensor 2: Step Ceiling -->
    <g transform="translate(236, 28)">
      <rect width="185" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="8" y="15" font-size="7.5" font-weight="600" fill="#475569">Step Ceiling: <tspan font-family="monospace" fill="#7E22CE">k ≤ K_max</tspan></text>
    </g>

    <!-- Sensor 3: Token Burn -->
    <g transform="translate(431, 28)">
      <rect width="210" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="8" y="15" font-size="7.5" font-weight="600" fill="#475569">Token Budget: <tspan font-family="monospace" fill="#D97706">T_used ≤ T_budget</tspan></text>
    </g>

    <!-- Sensor 4: Error Burst -->
    <g transform="translate(651, 28)">
      <rect width="215" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="8" y="15" font-size="7.5" font-weight="600" fill="#475569">Tool Errors: <tspan font-family="monospace" fill="#DC2626">e_burst &lt; E_thresh</tspan></text>
    </g>
  </g>

  <!-- 3 PRIMARY FSM STATES -->

  <!-- State 1: CLOSED (Normal Execution) -->
  <g transform="translate(40, 150)" >
    <rect width="260" height="265" rx="2" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect width="260" height="34" rx="2" fill="#059669"/>
    <rect y="26" width="260" height="8" fill="#059669"/>
    <text x="130" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">STATE: CLOSED (Normal)</text>

    <!-- Body -->
    <g transform="translate(15, 46)">
      <rect width="230" height="202" rx="5" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#065F46">Autonomous Loop Permitted</text>

      <text x="12" y="38" font-size="8" fill="#334155">• Agent executes ReAct/DAG loop</text>
      <text x="12" y="54" font-size="8" fill="#334155">• Model calls tools without gatekeeper delay</text>
      <text x="12" y="70" font-size="8" fill="#334155">• Context advances normally</text>
      <text x="12" y="86" font-size="8" fill="#334155">• All liveness invariants satisfied</text>

      <rect x="10" y="105" width="210" height="82" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
      <text x="18" y="122" font-size="8" font-weight="700" fill="#166534">Pass Criteria:</text>
      <text x="18" y="138" font-size="7.5" fill="#15803D">1. Environment state mutating (Δs &gt; ε)</text>
      <text x="18" y="153" font-size="7.5" fill="#15803D">2. Tool error rate &lt; threshold</text>
      <text x="18" y="168" font-size="7.5" fill="#15803D">3. Wall-clock &amp; token budget healthy</text>
    </g>
  </g>

  <!-- Transition: CLOSED -> HALF-OPEN -->
  <path d="M 300 230 L 350 230" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="306" y="210" width="38" height="16" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8"/>
  <text x="325" y="222" text-anchor="middle" font-size="7.5" font-weight="700" fill="#D97706">Δs &lt; ε</text>

  <!-- Transition: HALF-OPEN -> CLOSED (Recovery) -->
  <path d="M 350 280 L 300 280" stroke="#059669" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-emerald)"/>
  <rect x="303" y="286" width="44" height="16" rx="2" fill="#FFFFFF" stroke="#059669" stroke-width="0.8"/>
  <text x="325" y="298" text-anchor="middle" font-size="7.5" font-weight="700" fill="#059669">Recover</text>

  <!-- State 2: HALF-OPEN (Degraded / Warning) -->
  <g transform="translate(350, 150)" >
    <rect width="260" height="265" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect width="260" height="34" rx="2" fill="#D97706"/>
    <rect y="26" width="260" height="8" fill="#D97706"/>
    <text x="130" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">STATE: HALF-OPEN (Degraded)</text>

    <!-- Body -->
    <g transform="translate(15, 46)">
      <rect width="230" height="202" rx="5" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#92400E">Intervention &amp; Self-Correction</text>

      <text x="12" y="38" font-size="8" fill="#334155">• Semantic livelock / loop detected</text>
      <text x="12" y="54" font-size="8" fill="#334155">• Runtime injects prompt mutation</text>
      <text x="12" y="70" font-size="8" fill="#334155">• Forces verbal self-critique scratchpad</text>
      <text x="12" y="86" font-size="8" fill="#334155">• Disables failing tool; tests fallback</text>

      <rect x="10" y="105" width="210" height="82" rx="4" fill="#FEFCE8" stroke="#FDE047" stroke-width="1"/>
      <text x="18" y="122" font-size="8" font-weight="700" fill="#854D0E">Remediation Budget:</text>
      <text x="18" y="138" font-size="7.5" fill="#A16207">• Max 2 corrective retry cycles</text>
      <text x="18" y="153" font-size="7.5" fill="#047857">• If retry succeeds → return to CLOSED</text>
      <text x="18" y="168" font-size="7.5" fill="#DC2626">• If retry stalls → TRIP to OPEN</text>
    </g>
  </g>

  <!-- Transition: HALF-OPEN -> OPEN -->
  <path d="M 610 230 L 660 230" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="615" y="210" width="40" height="16" rx="2" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8"/>
  <text x="635" y="222" text-anchor="middle" font-size="7.5" font-weight="700" fill="#DC2626">Failed</text>

  <!-- State 3: OPEN (Tripped / Fail-Safe) -->
  <g transform="translate(660, 150)" >
    <rect width="260" height="265" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect width="260" height="34" rx="2" fill="#DC2626"/>
    <rect y="26" width="260" height="8" fill="#DC2626"/>
    <text x="130" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">STATE: OPEN (Tripped / Aborted)</text>

    <!-- Body -->
    <g transform="translate(15, 46)">
      <rect width="230" height="202" rx="5" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#991B1B">Execution Aborted &amp; Safe Halt</text>

      <text x="12" y="38" font-size="8" fill="#334155">• Immediate SIGKILL to running ACB</text>
      <text x="12" y="54" font-size="8" fill="#334155">• Rollback dirty writes via Saga/WAL</text>
      <text x="12" y="70" font-size="8" fill="#334155">• Snapshot ACB state &amp; trajectory log</text>
      <text x="12" y="86" font-size="8" fill="#334155">• Emit OpenTelemetry incident trace</text>

      <rect x="10" y="105" width="210" height="82" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
      <text x="18" y="122" font-size="8" font-weight="700" fill="#991B1B">Resolution Paths:</text>
      <text x="18" y="138" font-size="7.5" fill="#B91C1C">1. Escalate to Human-in-the-Loop (HITL)</text>
      <text x="18" y="153" font-size="7.5" fill="#B91C1C">2. Return typed error descriptor</text>
      <text x="18" y="168" font-size="7.5" fill="#B91C1C">3. Zero zombie token consumption</text>
    </g>
  </g>

  <!-- Direct Transition: CLOSED -> OPEN (Hard Invariant Breach) -->
  <path d="M 170 415 C 170 455 790 455 790 415" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-red)" fill="none"/>
  <rect x="300" y="445" width="360" height="20" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="1"/>
  <text x="480" y="459" text-anchor="middle" font-size="7.5" font-weight="700" fill="#DC2626">Hard Ceiling Breached (T &gt; T_budget) or Critical Sandbox Security Fault</text>

  <!-- BOTTOM FOOTER NOTE -->
  <g transform="translate(40, 485)">
    <rect width="880" height="38" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="16" y="23" font-size="8.5" fill="#475569">
      <tspan font-weight="700" fill="#0F172A">Systems Invariant:</tspan> The circuit breaker operates as an out-of-band kernel watchdog. It cannot be overridden, bypassed, or silenced by the model's generated tokens.
    </text>
  </g>
</svg>
