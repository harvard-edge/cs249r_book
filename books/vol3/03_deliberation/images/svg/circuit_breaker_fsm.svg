<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="550" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="510" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">DYNAMIC CIRCUIT BREAKER &amp; SEMANTIC CYCLE DETECTION FSM</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Runtime safety invariants preventing infinite loops, token bleed, and cascading tool failures</text>

  <!-- ================================================================= -->
  <!-- SENSORS / CONTINUOUS INVARIANT MONITORS BAR                       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="880" height="50" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#0f172a">CONTINUOUS INVARIANT MONITORS (Evaluated on every ACB turn)</text>

    <!-- Sensor 1: Semantic Delta -->
    <g transform="translate(10, 25)">
      <rect x="0" y="0" width="206" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-weight="600" fill="#475569">State Delta: <tspan font-family="monospace" font-weight="700" fill="#0284c7">Δs = 1 - cos(e_k, e_{k-1}) ≥ ε</tspan></text>
    </g>

    <!-- Sensor 2: Step Ceiling -->
    <g transform="translate(226, 25)">
      <rect x="0" y="0" width="206" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-weight="600" fill="#475569">Step Ceiling: <tspan font-family="monospace" font-weight="700" fill="#7c3aed">k ≤ K_max</tspan></text>
    </g>

    <!-- Sensor 3: Token Burn -->
    <g transform="translate(442, 25)">
      <rect x="0" y="0" width="206" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-weight="600" fill="#475569">Token Budget: <tspan font-family="monospace" font-weight="700" fill="#d97706">T_used ≤ T_budget</tspan></text>
    </g>

    <!-- Sensor 4: Error Burst -->
    <g transform="translate(658, 25)">
      <rect x="0" y="0" width="212" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-weight="600" fill="#475569">Tool Errors: <tspan font-family="monospace" font-weight="700" fill="#dc2626">e_burst &lt; E_thresh</tspan></text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- 3 PRIMARY FSM STATES                                              -->
  <!-- ================================================================= -->

  <!-- State 1: CLOSED (Normal Execution) -->
  <g transform="translate(40, 134)">
    <rect x="0" y="0" width="265" height="278" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">STATE: CLOSED (Normal Execution)</text>

    <!-- Body -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="241" height="142" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Autonomous Loop Permitted</text>

      <text x="10" y="34" font-size="8" fill="#334155">• Agent executes ReAct/DAG loop</text>
      <text x="10" y="48" font-size="8" fill="#334155">• Model calls tools without delay</text>
      <text x="10" y="62" font-size="8" fill="#334155">• Context advances normally</text>
      <text x="10" y="76" font-size="8" fill="#334155">• All liveness invariants satisfied</text>
      <text x="10" y="90" font-size="8" fill="#334155">• Full tool actuation scope granted</text>
      <text x="10" y="104" font-size="8" fill="#334155">• Speculative prefill pipelined</text>
      <text x="10" y="118" font-size="8" fill="#334155">• Nonce tokens monotonically increment</text>
      <text x="10" y="132" font-size="8" fill="#15803d">• Checkpoint delta committed to WAL</text>

      <!-- Pass Criteria sub-card -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="241" height="82" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Pass Criteria:</text>
        <text x="10" y="32" font-size="7.5" fill="#166534">1. Environment state mutating (Δs ≥ ε)</text>
        <text x="10" y="48" font-size="7.5" fill="#166534">2. Tool error rate &lt; threshold</text>
        <text x="10" y="64" font-size="7.5" fill="#166534">3. Wall-clock &amp; token budget healthy</text>
      </g>
    </g>
  </g>

  <!-- Transition: CLOSED -> HALF-OPEN -->
  <path d="M 305 210 L 348 210" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <rect x="309" y="195" width="36" height="14" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
  <text x="327" y="205" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">Δs &lt; ε</text>

  <!-- Transition: HALF-OPEN -> CLOSED (Recovery) -->
  <path d="M 348 260 L 305 260" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arr-green)"/>
  <rect x="307" y="266" width="40" height="14" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
  <text x="327" y="276" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">Recover</text>

  <!-- State 2: HALF-OPEN (Degraded / Warning) -->
  <g transform="translate(348, 134)">
    <rect x="0" y="0" width="265" height="278" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">STATE: HALF-OPEN (Degraded / Warning)</text>

    <!-- Body -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="241" height="142" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">Intervention &amp; Self-Correction</text>

      <text x="10" y="34" font-size="8" fill="#334155">• Semantic livelock / loop detected</text>
      <text x="10" y="48" font-size="8" fill="#334155">• Runtime injects prompt mutation</text>
      <text x="10" y="62" font-size="8" fill="#334155">• Forces verbal self-critique scratchpad</text>
      <text x="10" y="76" font-size="8" fill="#334155">• Disables failing tool; tests fallback</text>
      <text x="10" y="90" font-size="8" fill="#334155">• Enforces synthetic jitter on sampling</text>
      <text x="10" y="104" font-size="8" fill="#334155">• Ephemeral context window pruned</text>
      <text x="10" y="118" font-size="8" fill="#334155">• Attenuates capability permissions</text>
      <text x="10" y="132" font-size="8" fill="#b45309">• Injects step-back reflection token</text>

      <!-- Remediation Budget sub-card -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="241" height="82" rx="1" fill="#fef3c7" stroke="#fde047" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#b45309">Remediation Budget:</text>
        <text x="10" y="32" font-size="7.5" fill="#92400e">• Max 2 corrective retry cycles</text>
        <text x="10" y="48" font-size="7.5" fill="#15803d">• If retry succeeds → return to CLOSED</text>
        <text x="10" y="64" font-size="7.5" fill="#dc2626">• If retry stalls → TRIP to OPEN</text>
      </g>
    </g>
  </g>

  <!-- Transition: HALF-OPEN -> OPEN -->
  <path d="M 613 210 L 655 210" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <rect x="618" y="195" width="34" height="14" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
  <text x="635" y="205" text-anchor="middle" font-size="7" font-weight="700" fill="#991b1b">Failed</text>

  <!-- State 3: OPEN (Tripped / Safe Halt) -->
  <g transform="translate(655, 134)">
    <rect x="0" y="0" width="265" height="278" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">STATE: OPEN (Tripped / Safe Halt)</text>

    <!-- Body -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="241" height="142" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Execution Aborted &amp; Safe Halt</text>

      <text x="10" y="34" font-size="8" fill="#334155">• Immediate SIGKILL to running ACB</text>
      <text x="10" y="48" font-size="8" fill="#334155">• Rollback dirty writes via Saga/WAL</text>
      <text x="10" y="62" font-size="8" fill="#334155">• Snapshot ACB state &amp; trajectory log</text>
      <text x="10" y="76" font-size="8" fill="#334155">• Emit OpenTelemetry incident trace</text>
      <text x="10" y="90" font-size="8" fill="#334155">• Revoke all attenuated tool leases</text>
      <text x="10" y="104" font-size="8" fill="#334155">• Flush volatile KV-cache pages</text>
      <text x="10" y="118" font-size="8" fill="#334155">• Quarantine untrusted environment</text>
      <text x="10" y="132" font-size="8" fill="#991b1b">• Persist crash dump for post-mortem</text>

      <!-- Resolution Paths sub-card -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="241" height="82" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#991b1b">Resolution Paths:</text>
        <text x="10" y="32" font-size="7.5" fill="#991b1b">1. Escalate to Human-in-the-Loop (HITL)</text>
        <text x="10" y="48" font-size="7.5" fill="#991b1b">2. Return typed error descriptor</text>
        <text x="10" y="64" font-size="7.5" fill="#991b1b">3. Zero zombie token consumption</text>
      </g>
    </g>
  </g>

  <!-- Direct Transition: CLOSED -> OPEN (Hard Invariant Breach) -->
  <path d="M 172 412 C 172 446 787 446 787 412" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-red)" fill="none"/>
  <rect x="300" y="434" width="360" height="18" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
  <text x="480" y="446" text-anchor="middle" font-size="7" font-weight="700" fill="#991b1b">Hard Ceiling Breached (T &gt; T_budget) or Critical Sandbox Security Fault</text>

  <!-- ================================================================= -->
  <!-- BOTTOM FOOTER NOTE                                                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 470)">
    <rect x="0" y="0" width="880" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" font-size="8" fill="#334155">
      <tspan font-weight="700" fill="#0f172a">Systems Invariant:</tspan> The circuit breaker operates as an out-of-band kernel watchdog. It cannot be overridden, bypassed, or silenced by the model's generated tokens.
    </text>
  </g>
</svg>
