<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; text-anchor: middle; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle; fill: #475569; }
      .box-lbl-left { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; text-anchor: start; fill: #15803d; }
      .box-sub-left { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: start; fill: #334155; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .badge { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; }
    </style>
    <marker id="arr-red-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1080" height="390" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- Left: The Thrashing Loop -->
  <g transform="translate(45, 25)">
    <rect width="450" height="250" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="225" y="28" class="box-lbl" fill="#991b1b">UNCONSTRAINED THRASHING LOOP (Plan Churn χ &gt; 2.0)</text>

    <!-- Step 1: Execute Subgoal -->
    <rect x="30" y="50" width="170" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="115" y="20" class="box-lbl" fill="#1e293b">1. Execute Action</text>
    <text x="115" y="35" class="box-sub">Dispatch to Sandbox</text>

    <!-- Step 2: Non-fatal Warning -->
    <rect x="250" y="50" width="170" height="45" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="335" y="20" class="box-lbl" fill="#9a3412">2. Non-Fatal Noise</text>
    <text x="335" y="35" class="box-sub">stderr / dep warning</text>

    <!-- Step 3: Trigger Resynthesis -->
    <rect x="250" y="95" width="170" height="45" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="335" y="115" class="box-lbl" fill="#b91c1c">3. Trigger Resynthesis</text>
    <text x="335" y="130" class="box-sub">Over-sensitive predicate</text>

    <!-- Step 4: Mutate Topology -->
    <rect x="30" y="95" width="170" height="45" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="115" y="115" class="box-lbl" fill="#b91c1c">4. Mutate Topology</text>
    <text x="115" y="130" class="box-sub">Wasteful re-generation</text>

    <!-- Arrows in loop -->
    <path d="M 200 72 L 248 72" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red-loop)"/>
    <path d="M 335 95 L 335 143" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red-loop)"/>
    <path d="M 250 167 L 202 167" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red-loop)"/>
    <path d="M 115 145 L 115 97" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red-loop)"/>

    <rect x="105" y="158" width="240" height="24" rx="4" fill="#fee2e2"/>
    <text x="225" y="174" class="badge" fill="#991b1b" text-anchor="middle">Result: Infinite Livelock, 0 Progress</text>
  </g>

  <!-- Right: Damping Invariants -->
  <g transform="translate(535, 25)">
    <rect width="500" height="250" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="250" y="28" class="box-lbl" fill="#166534">THREE STRUCTURAL DAMPING INVARIANTS</text>

    <!-- Guard 1 -->
    <rect x="25" y="45" width="450" height="52" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="40" y="16" class="box-lbl-left">1. Observation Partitioning</text>
    <text x="40" y="34" class="box-sub-left">Separate stderr informational warnings from semantic failures (exit codes, schema).</text>

    <!-- Guard 2 -->
    <rect x="25" y="58" width="450" height="52" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="40" y="79" class="box-lbl-left">2. Bounded Replanning Budget (R_budget)</text>
    <text x="40" y="97" class="box-sub-left">Decrement R_budget per mutation; lock topology when budget reaches zero.</text>

    <!-- Guard 3 -->
    <rect x="25" y="121" width="450" height="52" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="40" y="142" class="box-lbl-left">3. Quarantine Ledger &amp; Hysteresis</text>
    <text x="40" y="160" class="box-sub-left">Reject cyclic replacement subgraphs matching previously quarantined action signatures.</text>
  </g>

  <!-- Bottom Invariant Banner -->
  <rect x="20" y="295" width="1040" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="320" class="sub-note" font-weight="700" fill="#0f172a">Systems Stability Criterion:</text>
  <text x="35" y="340" class="sub-note">Plan Churn Ratio χ = |V_mutated| / |V_initial| must satisfy χ ≤ 2.0. If thrashing is detected, the runtime</text>
  <text x="35" y="357" class="sub-note">locks the graph topology and escalates directly to human operators or deterministic rollback handlers.</text>
</svg>