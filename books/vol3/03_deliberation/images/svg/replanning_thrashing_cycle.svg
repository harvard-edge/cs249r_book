<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 380" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel-title { font-size: 11px; font-weight: 700; }
      .box-title { font-size: 10px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-size: 8.5px; text-anchor: middle; fill: #475569; }
      .mono-txt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 8.5px; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1020" height="380" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: Unconstrained Thrashing Loop (Livelock Failure)          -->
  <!-- ================================================================= -->
  <g transform="translate(20, 16)">
    <rect width="450" height="348" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="450" height="28" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
    <text x="14" y="18" class="panel-title" fill="#991b1b">Unconstrained Livelock Thrashing (χ &gt; 2.0)</text>

    <!-- Cycle Node 1: Dispatch Action -->
    <g transform="translate(30, 52)">
      <rect width="160" height="48" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="80" y="22" class="box-title" fill="#0f172a">1. Dispatch Action</text>
      <text x="80" y="38" class="box-desc">Execute tool in sandbox</text>
    </g>

    <!-- Cycle Node 2: Non-Fatal Noise -->
    <g transform="translate(260, 52)">
      <rect width="160" height="48" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
      <text x="80" y="22" class="box-title" fill="#92400e">2. Telemetry Noise</text>
      <text x="80" y="38" class="box-desc">stderr / deprecation warning</text>
    </g>

    <!-- Cycle Node 3: Over-Sensitive Trigger -->
    <g transform="translate(260, 150)">
      <rect width="160" height="48" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="80" y="22" class="box-title" fill="#b91c1c">3. Trigger Resynthesis</text>
      <text x="80" y="38" class="box-desc">Over-sensitive predicate</text>
    </g>

    <!-- Cycle Node 4: Discard & Mutate -->
    <g transform="translate(30, 150)">
      <rect width="160" height="48" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="80" y="22" class="box-title" fill="#b91c1c">4. Mutate Topology</text>
      <text x="80" y="38" class="box-desc">Regenerate entire plan</text>
    </g>

    <!-- Arrows forming loop -->
    <line x1="190" y1="76" x2="252" y2="76" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <line x1="340" y1="100" x2="340" y2="142" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <line x1="260" y1="174" x2="198" y2="174" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <line x1="110" y1="150" x2="110" y2="108" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <!-- Livelock State Box -->
    <g transform="translate(30, 222)">
      <rect width="390" height="106" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="14" y="20" font-size="9.5" font-weight="700" fill="#991b1b">Dynamic Thrashing Failure Characteristics:</text>
      <text x="14" y="38" font-size="8.5" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Plan Churn Ratio:</tspan> χ = |V_mutated| / |V_initial| &gt; 2.0</text>
      <text x="14" y="54" font-size="8.5" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Token Burn:</tspan> Continuous autoregressive decoding without progress</text>
      <text x="14" y="70" font-size="8.5" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Physical Progress:</tspan> Δ_state = 0 (infinite livelock)</text>
      <text x="14" y="88" font-size="8.5" font-weight="600" fill="#b91c1c">Result: Runaway inference spend prior to interactive SLA timeout</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: Structural Damping Architecture                          -->
  <!-- ================================================================= -->
  <g transform="translate(490, 16)">
    <rect width="510" height="348" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="510" height="28" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
    <text x="14" y="18" class="panel-title" fill="#166534">Three Structural Damping Invariants</text>

    <!-- Component 1: Observation Partitioning -->
    <g transform="translate(20, 44)">
      <rect width="470" height="78" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="470" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#0f172a">1. Observation Partitioning (Semantic Error Filtering)</text>
      
      <rect x="12" y="28" width="190" height="42" rx="2" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.8"/>
      <text x="18" y="42" font-size="8" font-weight="600" fill="#92400e">Informational Stream (stderr / warnings)</text>
      <text x="18" y="58" font-size="7.5" fill="#78350f">Route to accumulator; zero graph churn</text>

      <line x1="202" y1="49" x2="230" y2="49" stroke="#64748b" stroke-width="1.2"/>

      <rect x="240" y="28" width="218" height="42" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="246" y="42" font-size="8" font-weight="600" fill="#991b1b">Structural Exit-Code Fault (status ≠ 0)</text>
      <text x="246" y="58" font-size="7.5" fill="#7f1d1d">Demands formal invalidation handler</text>
    </g>

    <!-- Component 2: Bounded Replanning Budget -->
    <g transform="translate(20, 134)">
      <rect width="470" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="470" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#0f172a">2. Bounded Replanning Budget (R_budget Quota)</text>

      <text x="12" y="38" font-size="8.5" fill="#334155"><tspan font-weight="600" fill="#0f172a">Mutation Decrement:</tspan> Each branch resynthesis decrements: R_budget ← R_budget - 1</text>
      <text x="12" y="52" font-size="8.5" fill="#334155"><tspan font-weight="600" fill="#0f172a">Topology Lock Ceiling:</tspan> When R_budget = 0, graph topology is permanently locked</text>
      
      <rect x="12" y="62" width="446" height="22" rx="2" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="0.8"/>
      <text x="235" y="76" text-anchor="middle" font-size="8" font-weight="600" fill="#0369a1">Subsequent faults restricted to Tier 1 local repair or immediate human escalation</text>
    </g>

    <!-- Component 3: Step Quarantine Ledger -->
    <g transform="translate(20, 238)">
      <rect width="470" height="92" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="470" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#0f172a">3. Step Quarantine Ledger &amp; Hysteresis Ring Buffer</text>

      <text x="12" y="38" font-size="8.5" fill="#334155"><tspan font-weight="600" fill="#0f172a">Failed Signature Store:</tspan> K_quarantine records action hashes Sig(a_fail) in sliding window</text>
      <text x="12" y="52" font-size="8.5" fill="#334155"><tspan font-weight="600" fill="#0f172a">Anti-Oscillation Guard:</tspan> If resynthesized Sig(a_k') in K_quarantine → reject proposed branch</text>

      <rect x="12" y="62" width="446" height="22" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="235" y="76" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Eliminates cyclic ping-pong oscillation (A ↔ B) across successive turns</text>
    </g>
  </g>
</svg>