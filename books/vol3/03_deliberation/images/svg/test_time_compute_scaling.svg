<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="480" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT PANEL: Scaling Laws Curve                                    -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect width="432" height="358" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="432" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">A. TEST-TIME SCALING: COMPUTE VS. PARAMETER SIZE</text>

    <!-- Coordinate System -->
    <!-- Y-Axis Grid & Labels -->
    <line x1="55" y1="280" x2="405" y2="280" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="55" y1="230" x2="405" y2="230" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="55" y1="180" x2="405" y2="180" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="55" y1="130" x2="405" y2="130" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="55" y1="80"  x2="405" y2="80"  stroke="#f1f5f9" stroke-width="1"/>

    <text x="48" y="83" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">100%</text>
    <text x="48" y="133" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">80%</text>
    <text x="48" y="183" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">60%</text>
    <text x="48" y="233" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">40%</text>
    <text x="48" y="283" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">20%</text>

    <!-- Axes -->
    <line x1="55" y1="280" x2="55" y2="55" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
    <line x1="55" y1="280" x2="415" y2="280" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Y-Axis Title -->
    <text x="-168" y="16" font-size="8" font-weight="700" fill="#475569" transform="rotate(-90)" text-anchor="middle">Task Accuracy / Success Rate (%)</text>

    <!-- X-Axis Labels -->
    <text x="65" y="296" font-size="8.0" fill="#64748b">1× (Greedy)</text>
    <text x="160" y="296" font-size="8.0" fill="#64748b">10×</text>
    <text x="270" y="296" font-size="8.0" fill="#64748b">100×</text>
    <text x="380" y="296" font-size="8.0" fill="#64748b">1000×</text>
    <text x="235" y="318" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">Inference Test-Time Compute (Search Tokens, log scale)</text>

    <!-- Baseline: 70B Static Greedy Model (64%) -->
    <line x1="55" y1="170" x2="405" y2="170" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="270" y="156" width="132" height="16" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="336" y="168" font-size="8.0" font-weight="700" fill="#0369a1" text-anchor="middle">70B Dense Model (Greedy: 64%)</text>

    <!-- Baseline: 7B Static Greedy Model (32%) -->
    <line x1="55" y1="250" x2="405" y2="250" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="280" y="238" width="122" height="15" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="341" y="249" font-size="8.0" font-weight="600" fill="#64748b" text-anchor="middle">7B Model (Greedy: 32%)</text>

    <!-- Dynamic Test-Time Search Scaling Curve (Purple) -->
    <path d="M 55 250 Q 120 240, 175 195 T 285 135 T 400 115" fill="none" stroke="#7c3aed" stroke-width="2.5"/>

    <!-- Markers on Curve -->
    <circle cx="55" cy="250" r="3.5" fill="#7c3aed"/>
    <circle cx="175" cy="195" r="3.5" fill="#7c3aed"/>
    <circle cx="285" cy="135" r="4" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="400" cy="115" r="4" fill="#6d28d9" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Callout: Pareto Frontier Inversion -->
    <rect x="155" y="70" width="170" height="38" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="240" y="84" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">Pareto Frontier Inversion</text>
    <text x="240" y="97" font-size="8.0" fill="#7c3aed" text-anchor="middle">7B + Search matches 70B Greedy at 14×</text>
    <line x1="240" y1="108" x2="215" y2="158" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arr-purple)"/>

    <!-- Bottom summary tag -->
    <rect x="12" y="332" width="408" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="216" y="344" text-anchor="middle" font-size="8.0" fill="#64748b">Search scaling parameterizes test-time compute independently from model weights</text>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: Verification Tax & Search Pruning                    -->
  <!-- ================================================================= -->
  <g transform="translate(488, 74)">
    <rect width="432" height="358" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="432" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">B. THE VERIFICATION TAX: PRUNING VS. GENERATION</text>

    <!-- Box 1: Unverified Search Explosion -->
    <g transform="translate(14, 34)">
      <rect width="404" height="142" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="1"/>
      <rect width="404" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#991b1b">Unverified Search (Best-of-N / Blind DFS)</text>

      <g transform="translate(10, 26)">
        <text x="0" y="14" font-size="8" fill="#334155">• Branching factor: <tspan font-weight="700" fill="#dc2626">b = 5</tspan> | Horizon depth: <tspan font-weight="700" fill="#dc2626">d = 4 steps</tspan></text>
        <text x="0" y="28" font-size="8" fill="#334155">• Total Rollout Paths: <tspan font-weight="700" font-family="monospace">5⁴ = 625 full trajectories</tspan></text>
        <text x="0" y="42" font-size="8" fill="#334155">• Token Expenditure: <tspan font-weight="700" fill="#991b1b">625 × 2,048 tokens = 1.28M tokens</tspan></text>
        <text x="0" y="56" font-size="8" fill="#334155">• Error Propagation: Hallucinations branch without check</text>
      </g>

      <rect x="10" y="94" width="384" height="24" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="202" y="110" font-size="8.0" font-weight="700" fill="#991b1b" text-anchor="middle">Severe Waste: 92% of paths fail due to unpruned early errors</text>
      <text x="202" y="130" font-size="8.0" fill="#64748b" text-anchor="middle">Exponential FLOP blowup on fruitless reasoning branches</text>
    </g>

    <!-- Box 2: Verifier-Guided Search -->
    <g transform="translate(14, 190)">
      <rect width="404" height="154" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <rect width="404" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">Verifier-Pruned Search (PRM / Test Oracles)</text>

      <g transform="translate(10, 26)">
        <text x="0" y="14" font-size="8" fill="#334155">• Intermediate Verification: Step check costs <tspan font-weight="700" fill="#15803d">C_ver ≈ 0.05 × C_gen</tspan></text>
        <text x="0" y="28" font-size="8" fill="#334155">• Effective Branching Factor: <tspan font-weight="700" fill="#16a34a">b_eff = 1.6</tspan> (faults pruned immediately)</text>
        <text x="0" y="42" font-size="8" fill="#334155">• Explored Nodes: <tspan font-weight="700" font-family="monospace">1.6⁴ ≈ 6.5 effective paths (98.9% pruned!)</tspan></text>
        <text x="0" y="56" font-size="8" fill="#334155">• Total Net Compute: <tspan font-weight="700" fill="#15803d">C_total = Σ N_k · (C_gen + C_ver) ≪ C_blind</tspan></text>
        <text x="0" y="70" font-size="8" fill="#334155">• Recovery Mode: Rollbacks preserve correct prefix states</text>
      </g>

      <rect x="10" y="108" width="384" height="24" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="202" y="124" font-size="8.0" font-weight="700" fill="#15803d" text-anchor="middle">Verification Tax Paradox: Spending 5% on checks saves 90%+ total FLOPs</text>
      <text x="202" y="144" font-size="8.0" fill="#64748b" text-anchor="middle">Process supervision converts exponential search into bounded exploration</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM BANNER: INVARIANT STATEMENT                                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 444)">
    <rect width="880" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Fundamental Invariant: The Test-Time Compute Pareto Frontier</text>
    <text x="14" y="32" font-size="8.0" fill="#64748b">Scaling test-time search with process verification expands reasoning capacity at constant parameter count, breaking pre-training parameter scaling bottlenecks.</text>
  </g>
</g>
</svg>