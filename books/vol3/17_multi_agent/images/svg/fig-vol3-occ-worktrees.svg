  <circle cx="596" cy="146" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="174" text-anchor="middle" font-size="10" font-style="italic" font-weight="700" fill="#0f172a">h<tspan font-size="8" font-style="normal" dy="2">worker</tspan></text>
  <text x="480" y="186" text-anchor="middle" font-size="8" fill="#475569">worker candidate</text>
  <text x="596" y="174" text-anchor="middle" font-size="10" font-style="italic" font-weight="700" fill="#0f172a">h<tspan font-size="8" font-style="normal" dy="2">candidate</tspan></text>
  <text x="596" y="186" text-anchor="middle" font-size="8" fill="#475569">integration candidate</text>
