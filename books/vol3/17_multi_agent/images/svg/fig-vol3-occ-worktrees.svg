  <text x="425.0" y="140" text-anchor="middle" font-size="8" fill="#0369a1">caller edits</text>
  <text x="425.0" y="112" text-anchor="middle" font-size="8" fill="#b91c1c" font-weight="700">relies on the old interface</text>
  <path d="M492,146 H583" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="538.0" y="140" text-anchor="middle" font-size="8" fill="#475569">staged merge</text>
  <path d="M492,78 H596 V133" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
