<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="680" height="370" fill="#ffffff"/>
  <!-- ===== (a) Private workspaces ===== -->
  <rect x="20" y="10" width="290" height="190" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="10" width="290" height="24" rx="2" fill="#e2e8f0"/>
  <text x="32" y="26" font-size="10" font-weight="700" fill="#0f172a">(a) Private workspaces</text>
  <rect x="50" y="46" width="230" height="34" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="165.0" y="62.0" text-anchor="middle" font-size="9" fill="#0f172a" font-weight="700">shared repository storage</text>
  <text x="165.0" y="73.0" text-anchor="middle" font-size="8" fill="#475569">objects and references</text>
  <rect x="44" y="108" width="116" height="66" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="50" y="116" width="104" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="102.0" y="132.0" text-anchor="middle" font-size="9" fill="#0f172a" font-weight="700">interface worktree</text>
  <text x="102.0" y="143.0" text-anchor="middle" font-size="8" fill="#475569">files, index, HEAD</text>
  <line x1="102" y1="80" x2="102" y2="107" stroke="#64748b" stroke-width="1.2"/>
  <text x="102" y="166" text-anchor="middle" font-size="8" fill="#b45309">sandbox, scoped writes</text>
  <rect x="172" y="108" width="116" height="66" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="178" y="116" width="104" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="230.0" y="132.0" text-anchor="middle" font-size="9" fill="#0f172a" font-weight="700">caller worktree</text>
  <text x="230.0" y="143.0" text-anchor="middle" font-size="8" fill="#475569">files, index, HEAD</text>
  <line x1="230" y1="80" x2="230" y2="107" stroke="#64748b" stroke-width="1.2"/>
  <text x="230" y="166" text-anchor="middle" font-size="8" fill="#b45309">sandbox, scoped writes</text>
  <text x="165" y="192" text-anchor="middle" font-size="8" fill="#475569">separate files, shared storage; not a security boundary</text>
  <!-- ===== (b) Clean merge, stale dependency ===== -->
  <rect x="330" y="10" width="330" height="190" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="330" y="10" width="330" height="24" rx="2" fill="#e2e8f0"/>
  <text x="342" y="26" font-size="10" font-weight="700" fill="#0f172a">(b) A clean merge with a stale dependency</text>
  <text x="370" y="48" text-anchor="middle" font-size="10" font-style="italic" font-weight="700" fill="#0f172a">h<tspan font-size="8" font-style="normal" dy="2">base</tspan></text>
  <text x="370" y="60" text-anchor="middle" font-size="8" fill="#475569" font-family="Courier New, monospace">repo_base_01</text>
  <text x="480" y="48" text-anchor="middle" font-size="10" font-style="italic" font-weight="700" fill="#0f172a">h<tspan font-size="8" font-style="normal" dy="2">head</tspan></text>
  <text x="480" y="60" text-anchor="middle" font-size="8" fill="#475569" font-family="Courier New, monospace">repo_head_02</text>
  <path d="M382,78 H467" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="425.0" y="72" text-anchor="middle" font-size="8" fill="#475569">interface change</text>
