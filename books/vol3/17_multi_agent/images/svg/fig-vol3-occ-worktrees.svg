  <rect x="20" y="214" width="640" height="146" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="214" width="640" height="24" rx="2" fill="#e2e8f0"/>
  <text x="32" y="230" font-size="10" font-weight="700" fill="#0f172a">(c) Guarded publication</text>
  <rect x="36" y="262" width="104" height="36" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="88.0" y="279.0" text-anchor="middle" font-size="9" fill="#0f172a" font-weight="700">revalidate</text>
  <text x="88.0" y="290.0" text-anchor="middle" font-size="8" fill="#475569">dependencies at head</text>
  <rect x="160" y="262" width="104" height="36" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="212.0" y="279.0" text-anchor="middle" font-size="9" fill="#0f172a" font-weight="700">build candidate</text>
  <text x="212.0" y="290.0" text-anchor="middle" font-size="8" fill="#475569">fast-forward or merge</text>
  <rect x="284" y="262" width="104" height="36" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="336.0" y="279.0" text-anchor="middle" font-size="9" fill="#0f172a" font-weight="700">protected checks</text>
  <text x="336.0" y="290.0" text-anchor="middle" font-size="8" fill="#475569">on the exact candidate</text>
  <rect x="408" y="262" width="104" height="36" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="460.0" y="279.0" text-anchor="middle" font-size="9" fill="#0f172a" font-weight="700">atomic update</text>
  <text x="460.0" y="290.0" text-anchor="middle" font-size="8" fill="#475569">expected head, guard held</text>
  <rect x="532" y="262" width="104" height="36" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="584.0" y="279.0" text-anchor="middle" font-size="9" fill="#0f172a" font-weight="700">published</text>
  <text x="584.0" y="290.0" text-anchor="middle" font-size="8" fill="#475569">candidate + evidence</text>
  <path d="M140,280 H159" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M264,280 H283" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M388,280 H407" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M512,280 H531" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M460,262 V248 H88 V261" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="276" y="244" text-anchor="middle" font-size="8" fill="#6d28d9">head moved: return to validation</text>
  <path d="M88,298 V315" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <rect x="36" y="316" width="104" height="18" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="88.0" y="328" text-anchor="middle" font-size="8" fill="#b91c1c">request revision</text>
  <path d="M212,298 V315" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <rect x="160" y="316" width="104" height="18" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="212.0" y="328" text-anchor="middle" font-size="8" fill="#b91c1c">request reconciliation</text>
  <path d="M336,298 V315" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <rect x="284" y="316" width="104" height="18" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="336.0" y="328" text-anchor="middle" font-size="8" fill="#b91c1c">reject</text>
  <path d="M460,298 V315" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <rect x="408" y="316" width="104" height="18" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="460.0" y="328" text-anchor="middle" font-size="8" fill="#b91c1c">reconcile outcome</text>
  <text x="88" y="348" text-anchor="middle" font-size="8" fill="#475569">stale dependency</text>
  <text x="212" y="348" text-anchor="middle" font-size="8" fill="#475569">merge conflict</text>
  <text x="336" y="348" text-anchor="middle" font-size="8" fill="#475569">check failed</text>
  <text x="460" y="348" text-anchor="middle" font-size="8" fill="#475569">uncertain response</text>
</svg>
