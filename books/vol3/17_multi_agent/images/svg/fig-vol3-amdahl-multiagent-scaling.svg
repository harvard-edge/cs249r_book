<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1160" height="520" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL (a): GUNTHER USL & AMDAHL SCALING CURVES                     -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <!-- Container Card -->
    <rect width="640" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Header Tab -->
    <path d="M 0 4 Q 0 0 4 0 L 636 0 Q 640 0 640 4 L 640 30 L 0 30 Z" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#1e40af">(a) Multi-Agent Scalability &amp; Retrograde Collapse (Gunther USL)</text>
    <text x="624" y="20" font-size="10.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#2563eb" text-anchor="end">σ = 0.05, κ = 0.03</text>

    <!-- Plot Area Background -->
    <g transform="translate(60, 50)">
      <rect width="550" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2"/>

      <!-- Retrograde Collapse Shaded Region (C < 1.0x -> y from 250 to 330) -->
      <rect x="0" y="250" width="550" height="80" fill="#fee2e2" opacity="0.35"/>
      <line x1="0" y1="250" x2="550" y2="250" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
      <rect x="360" y="255" width="180" height="20" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="450" y="269" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626" text-anchor="middle">Retrograde Zone: C(N) &lt; 1.0×</text>

      <!-- Y Grid Lines: 0x, 1x, 2x, 3x -->
      <!-- 3.0x -> y = 90 -->
      <line x1="0" y1="90" x2="550" y2="90" stroke="#f1f5f9" stroke-width="1"/>
      <text x="-10" y="94" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">3.0×</text>

      <!-- 2.0x -> y = 170 -->
      <line x1="0" y1="170" x2="550" y2="170" stroke="#f1f5f9" stroke-width="1"/>
      <text x="-10" y="174" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">2.0×</text>

      <!-- 1.0x -> y = 250 -->
      <text x="-10" y="254" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#1e293b" text-anchor="end">1.0×</text>

      <!-- 0x -> y = 330 -->
      <line x1="0" y1="330" x2="550" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="-10" y="334" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">0.0×</text>

      <!-- Amdahl Asymptote: 1 / (1 - f) = 1 / 0.30 = 3.33x -> y = 63.3 -->
      <line x1="0" y1="63.3" x2="550" y2="63.3" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="540" y="58" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#1d4ed8" text-anchor="end">Amdahl Ceiling: 1/(1-f) = 3.33×</text>

      <!-- X Grid and Ticks: N = 1, 4, 8, 12, 16, 20, 24, 28, 32 -->
      <g fill="#64748b" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" text-anchor="middle">
        <text x="30" y="348">1</text>
        <text x="78" y="348">4</text>
        <text x="143" y="348">8</text>
        <text x="207" y="348">12</text>
        <text x="272" y="348">16</text>
        <text x="336" y="348">20</text>
        <text x="401" y="348">24</text>
        <text x="466" y="348">28</text>
        <text x="530" y="348">32</text>
      </g>
      <text x="280" y="372" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Concurrent Worker Fleet Concurrency (N Agents)</text>

      <!-- ================= CURVE 1: AMDAHL IDEAL (BLUE) ================= -->
      <path d="M 30.0 250.0 L 46.1 206.9 L 62.3 180.0 L 78.4 161.6 L 94.5 148.2 L 110.6 138.0 L 126.8 130.0 L 142.9 123.5 L 159.0 118.2 L 175.2 113.8 L 191.3 110.0 L 207.4 106.7 L 223.5 103.9 L 239.7 101.4 L 255.8 99.2 L 271.9 97.3 L 288.1 95.5 L 304.2 93.9 L 320.3 92.5 L 336.5 91.2 L 352.6 90.0 L 368.7 88.9 L 384.8 87.9 L 401.0 87.0 L 417.1 86.1 L 433.2 85.3 L 449.4 84.5 L 465.5 83.8 L 481.6 83.2 L 497.7 82.6 L 513.9 82.0 L 530.0 81.5"
            fill="none" stroke="#2563eb" stroke-width="2"/>
      <text x="535" y="75" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#1e40af" text-anchor="end">Amdahl (f=0.70, κ=0)</text>

      <!-- ================= CURVE 2: FULL GUNTHER USL (RED) ================= -->
      <path d="M 30.0 250.0 L 46.1 185.9 L 62.3 142.5 L 78.4 118.1 L 94.5 107.8 L 110.6 106.7 L 126.8 111.2 L 142.9 118.8 L 159.0 127.8 L 175.2 137.2 L 191.3 146.7 L 207.4 155.8 L 223.5 164.4 L 239.7 172.5 L 255.8 180.0 L 271.9 187.0 L 288.1 193.5 L 304.2 199.4 L 320.3 205.0 L 336.5 210.1 L 352.6 214.9 L 368.7 219.4 L 384.8 223.5 L 401.0 227.4 L 417.1 231.0 L 433.2 234.4 L 449.4 237.5 L 465.5 240.5 L 481.6 243.3 L 497.7 245.9 L 513.9 248.4 L 530.0 250.8"
            fill="none" stroke="#dc2626" stroke-width="2.5"/>

      <!-- Data Dots on Full USL Curve -->
      <circle cx="30" cy="250" r="4" fill="#dc2626"/>
      <!-- N=4 callout point -->
      <circle cx="78.4" cy="118.1" r="4.5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
      <!-- N* optimal callout point -->
      <circle cx="104.7" cy="106.3" r="4.5" fill="#15803d"/>
      <!-- N=8 callout point -->
      <circle cx="142.9" cy="118.8" r="4.5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
      <!-- N=16 callout point -->
      <circle cx="271.9" cy="187.0" r="3.5" fill="#dc2626"/>
      <!-- N=32 callout point -->
      <circle cx="530.0" cy="250.8" r="4.5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>

      <!-- Clean Badge N=4 -->
      <g transform="translate(15, 140)">
        <rect width="125" height="24" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="1"/>
        <text x="62" y="16" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626" text-anchor="middle">N=4: 2.65× (T₄=226s)</text>
      </g>
      <path d="M 78 140 L 78.4 123" stroke="#dc2626" stroke-width="1.2"/>

      <!-- Clean Badge N=8 -->
      <g transform="translate(145, 135)">
        <rect width="125" height="24" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="1"/>
        <text x="62" y="16" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626" text-anchor="middle">N=8: 2.64× (T₈=227s)</text>
      </g>
      <path d="M 155 135 L 145 123" stroke="#dc2626" stroke-width="1.2"/>

      <!-- Clean Badge N=32 (Retrograde Collapse) -->
      <g transform="translate(390, 280)">
        <rect width="135" height="24" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
        <text x="67" y="16" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#991b1b" text-anchor="middle">N=32: 0.99× (T₃₂=606s)</text>
      </g>
      <path d="M 520 280 L 528 255" stroke="#dc2626" stroke-width="1.2"/>

      <!-- Stationary Point N* Callout (Peak) -->
      <g transform="translate(50, 42)">
        <rect width="175" height="26" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="87" y="17" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#15803d" text-anchor="middle">Optimal N* ≈ 5.63 (C* ≈ 2.80×)</text>
      </g>
      <path d="M 104.7 68 L 104.7 101" stroke="#15803d" stroke-width="1.2" stroke-dasharray="2 2"/>

      <!-- Top Left Legend -->
      <g transform="translate(15, 12)">
        <rect width="280" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <!-- Line 1: USL Full -->
        <line x1="10" y1="14" x2="26" y2="14" stroke="#dc2626" stroke-width="2.5"/>
        <circle cx="18" cy="14" r="2.5" fill="#dc2626"/>
        <text x="32" y="17" font-size="7.5" font-weight="600" fill="#991b1b">Gunther USL (σ=0.05, κ=0.03)</text>

        <!-- Line 2: Amdahl -->
        <line x1="165" y1="14" x2="181" y2="14" stroke="#2563eb" stroke-width="2"/>
        <text x="187" y="17" font-size="7.5" font-weight="600" fill="#1e40af">Amdahl (f=0.70)</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL (b): GUNTHER USL FORMULATION & COHERENCY MECHANICS          -->
  <!-- ================================================================= -->
  <g transform="translate(680, 20)">
    <!-- Container Card -->
    <rect width="460" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Header Tab -->
    <path d="M 0 4 Q 0 0 4 0 L 456 0 Q 460 0 460 4 L 460 30 L 0 30 Z" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#1e40af">(b) Universal Scalability Law Decomposition</text>
    <text x="444" y="20" font-size="10.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#2563eb" text-anchor="end">after Gunther (1993)</text>

    <!-- Card 1: Governing Formula Box -->
    <g transform="translate(15, 42)">
      <rect width="430" height="110" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <rect width="430" height="20" rx="3" fill="#eff6ff"/>
      <text x="10" y="14" font-size="9" font-weight="700" fill="#1e40af">Gunther Universal Scalability Law (Speedup / Capacity)</text>

      <!-- Formula Line -->
      <rect x="15" y="28" width="400" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="200" y="49" font-size="9.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#0f172a" text-anchor="middle">C(N) = N / [ 1 + σ(N - 1) + κ N(N - 1) ]</text>

      <!-- Optimal Scaling Point -->
      <text x="15" y="80" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#15803d">Optimal Concurrency: N* = sqrt( (1 - σ) / κ )</text>
      <text x="15" y="98" font-size="7.5" fill="#475569">For σ = 0.05, κ = 0.03: N* ≈ 5.63 agents, peak speedup ≈ 2.80×; retrograde at N ≥ 32</text>
    </g>

    <!-- Card 2: The Physical Pillars of Coordination Tax -->
    <g transform="translate(15, 162)">
      <rect width="430" height="155" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="430" height="20" rx="3" fill="#f8fafc"/>
      <text x="10" y="14" font-size="9" font-weight="700" fill="#0f172a">Physical Systems Decomposition of USL Terms</text>

      <g transform="translate(12, 28)">
        <!-- Term 1 -->
        <text x="0" y="12" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#2563eb">Linear Concurrency Scaling [ N ]:</text>
        <text x="12" y="24" font-size="7.5" fill="#475569">Ideal parallel throughput across independent agent worker processes.</text>

        <!-- Term 2 -->
        <text x="0" y="50" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#d97706">Contention Overhead [ σ (N - 1) ]:</text>
        <text x="12" y="62" font-size="7.5" fill="#475569">Queuing delays on central supervisor dispatch, worktree checkouts, and shared locks.</text>

        <!-- Term 3 -->
        <text x="0" y="88" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626">Pairwise Coherency Overhead [ κ N(N - 1) ]:</text>
        <text x="12" y="100" font-size="7.5" fill="#991b1b">Quadratic AST merge conflicts, state reconciliation, and multi-turn debate rounds.</text>
      </g>
    </g>

    <!-- Card 3: Quantitative Telemetry (Worked Example Profile) -->
    <g transform="translate(15, 327)">
      <rect width="430" height="135" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="430" height="20" rx="3" fill="#f8fafc"/>
      <text x="10" y="14" font-size="9" font-weight="700" fill="#0f172a">Illustrative Refactoring Fleet (Worked Example Telemetry)</text>

      <g transform="translate(12, 28)">
        <text x="0" y="12" font-size="8" font-weight="700" fill="#1e40af">Baseline Single Agent (T₁ = 600s):</text>
        <text x="180" y="12" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">120,000 total tokens (100k in, 20k out)</text>

        <text x="0" y="32" font-size="8" font-weight="700" fill="#15803d">4-Worker Fleet (N = 4, T₄ = 226s):</text>
        <text x="180" y="32" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803d">390,000 tokens (3.25× amplification)</text>
        <text x="12" y="46" font-size="7.5" fill="#475569">Speedup is 2.65×; wall-clock saved: 374s (62.3% makespan reduction).</text>

        <text x="0" y="66" font-size="8" font-weight="700" fill="#15803d">Peak Fleet (N = 6, T₆ = 215s):</text>
        <text x="180" y="66" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803d">Speedup = 2.79× (Peak integer capacity)</text>
        <text x="12" y="80" font-size="7.5" fill="#475569">Optimal analytic N* = sqrt((1 - 0.05) / 0.03) ≈ 5.63 agents.</text>

        <text x="0" y="98" font-size="8" font-weight="700" fill="#dc2626">32-Worker Fleet (N = 32, T₃₂ = 606s):</text>
        <text x="180" y="98" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626">Speedup = 0.99× (Retrograde Collapse)</text>
        <text x="12" y="112" font-size="7.5" fill="#dc2626">Pairwise coherency overhead dominates; fleet runs slower than single agent.</text>
      </g>
    </g>
  </g>
</svg>