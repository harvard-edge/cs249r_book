parts:
  - key: "frontmatter"
    division: "frontmatter"
    type: "division"
    numbered: false
    title: "Frontmatter"
    description: >
      Opening material that establishes the scope, audience, and design of the volume.

  - key: "mainmatter"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Main Text"
    description: >
      The main content of the textbook, beginning with the introduction and
      continuing through seven thematic parts of the Stochastic Computer.

  - key: "vol3_processor"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Stochastic Processor"
    description: >
      This part establishes the foundation model as the core compute engine of the Stochastic Computer,
      analyzing autoregressive decoding rooflines, non-deterministic contracts, and test-time deliberation.

  - key: "vol3_memory"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Context Memory and Storage"
    description: >
      This part analyzes the context memory hierarchy, covering L1 active attention working sets,
      L2 virtual context memory with PagedAttention and prefix sharing, and L3 episodic trajectory storage.

  - key: "vol3_io"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Tool Actuation and I/O Peripherals"
    description: >
      This part investigates the peripheral execution boundary, detailing typed tool protocols (MCP),
      grammar-constrained transceivers, and zero-trust hardware sandboxing (Firecracker microVMs).

  - key: "vol3_os"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Agent Operating System"
    description: >
      This part develops the runtime operating system, covering trajectory checkpointing with distributed Sagas,
      asynchronous interrupts and watchdog timers, and continuous batching schedulers.

  - key: "vol3_compiler"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Policy Compiler"
    description: >
      This part examines how empirical execution traces are compiled into neural weights,
      spanning synthetic data flywheels, masked trajectory SFT, and verifiable reinforcement learning (RLVR/GRPO).

  - key: "vol3_fleet"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Distributed Fleet"
    description: >
      This part scales agent systems across distributed clusters, covering Actor-based coordination topologies,
      OpenTelemetry causal tracing, and accelerator fleet tokenomics.

  - key: "vol3_synthesis"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "System Synthesis"
    description: >
      The concluding synthesis draws together the volume's durable systems invariants
      and charts the grand challenges at the frontier of autonomous physical AI.

  - key: "backmatter"
    division: "backmatter"
    type: "division"
    numbered: false
    title: "Back Matter"
    description: >
      Appendices, glossary, and index.
