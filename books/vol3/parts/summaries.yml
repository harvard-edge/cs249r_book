parts:
  - key: "frontmatter"
    division: "frontmatter"
    type: "division"
    numbered: false
    title: "Frontmatter"
    description: >
      Opening material that establishes the scope, audience, and design of the volume.

  - key: "mainmatter"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Main Text"
    description: >
      The main content of the textbook, beginning with the introduction and
      continuing through seven thematic parts of the Stochastic Computer.

  - key: "vol3_processor"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Stochastic Processor"
    description: >
      This part treats the foundation model as the processor of the Stochastic Computer, pricing each
      proposal by memory bandwidth and bounding what test-time deliberation can buy by the soundness of its checks.

  - key: "vol3_memory"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Context Memory and Storage"
    description: >
      This part builds closure for trajectory state, covering the working context each invocation sees,
      paged attention memory derived from the token prefix, and persistent storage read through retrieval contracts.

  - key: "vol3_io"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Tool Actuation and I/O Peripherals"
    description: >
      This part builds closure for authority, covering typed and authorized tool calls, settlement of
      uncertain dispatches, and containment of executed code beneath the model.

  - key: "vol3_os"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Agent Operating System"
    description: >
      This part builds closure for long horizons, covering the supervisory control plane, trajectory persistence
      through an append-only log, and fault recovery with compensating Sagas and the pivot boundary.

  - key: "vol3_compiler"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Policy Compiler"
    description: >
      This part changes the model itself as the last rung of repair, spanning trajectory harvesting,
      supervised adaptation with masked loss, and reinforcement learning against isolated verifiers.

  - key: "vol3_fleet"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Distributed Fleets and Operations"
    description: >
      This part scales agent systems to fleets, covering multi-agent coordination and delegation,
      observability and release evidence, and the serving economics of the accepted task.

  - key: "vol3_synthesis"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "System Synthesis"
    description: >
      The concluding synthesis runs every subsystem together on one trajectory and marks the
      specification boundary, the work that stays with the engineer.

  - key: "backmatter"
    division: "backmatter"
    type: "division"
    numbered: false
    title: "Back Matter"
    description: >
      Appendices, glossary, and index.
