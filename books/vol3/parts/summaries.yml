parts:
  - key: "frontmatter"
    division: "frontmatter"
    type: "division"
    numbered: false
    title: "Frontmatter"
    description: >
      Opening material that establishes the scope, audience, and design of the volume.

  - key: "mainmatter"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Main Text"
    description: >
      The main content of the textbook, beginning with the introduction and
      continuing through five thematic parts.

  - key: "vol3_foundations"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Foundations of Agency"
    description: >
      This part establishes the architectural and theoretical foundations of agentic machine
      learning systems, including the stochastic processor, deliberation, and finite control topologies.

  - key: "vol3_serving"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Memory Systems and Runtimes"
    description: >
      This part analyzes the systems infrastructure required to serve long-running trajectories,
      including context working sets, Radix prefix caching, episodic storage, checkpointing, and bimodal scheduling.

  - key: "vol3_security"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Actuation, Interrupts, and Virtualization"
    description: >
      This part addresses the execution boundary where non-deterministic neural policies meet
      the external world, detailing tool actuation, human-in-the-loop interrupts, and microVM sandboxing.

  - key: "vol3_training"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Policy Adaptation and Training"
    description: >
      This part examines how models are trained and adapted for autonomous trajectories,
      spanning synthetic data flywheels, trajectory fine-tuning (SFT), and reinforcement learning with verifiable rewards (RLVR).

  - key: "vol3_scale"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Distributed Scale, Observability, and Tokenomics"
    description: >
      This part scales agency to multi-agent distributed systems and operational deployment,
      covering multi-agent coordination, trajectory observability, and system tokenomics.

  - key: "synthesis"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Synthesis"
    description: >
      The concluding synthesis draws together the volume's durable principles
      and identifies the open challenges at the frontier of autonomous agency.

  - key: "backmatter"
    division: "backmatter"
    type: "division"
    numbered: false
    title: "References"
    description: >
      Reference materials and bibliography.
