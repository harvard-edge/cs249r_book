parts:
  - key: "frontmatter"
    division: "frontmatter"
    type: "division"
    numbered: false
    title: "Frontmatter"
    description: >
      Opening material that establishes the scope, audience, and design of the volume.

  - key: "mainmatter"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Main Text"
    description: >
      The main content of the textbook, beginning with the introduction and
      continuing through five thematic parts.

  - key: "vol3_foundations"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Foundations of Agency"
    description: >
      This part establishes the architectural and theoretical foundations of agentic machine
      learning systems, including the Agent Control Block (ACB) and finite control topologies.

  - key: "vol3_training"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Agent Training and Test-Time Compute"
    description: >
      This part examines how models are trained and adapted for autonomous trajectories,
      spanning trajectory fine-tuning, active environment RL, and test-time search.

  - key: "vol3_serving"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Serving Runtimes and Memory Systems"
    description: >
      This part analyzes the systems infrastructure required to serve long-running trajectories,
      including context working sets, Radix prefix caching, PagedAttention, and scheduling.

  - key: "vol3_security"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Security, Isolation, and Red Teaming"
    description: >
      This part addresses the execution boundary where non-deterministic neural policies meet
      the external world, detailing tool ABIs (MCP), sandboxing (microVMs), and fault recovery.

  - key: "vol3_scale"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Scale, Evaluation, and Operations"
    description: >
      This part scales agency to multi-agent distributed systems and operational deployment,
      covering coordination topologies, telemetry, and empirical trajectory benchmarking.

  - key: "synthesis"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Synthesis"
    description: >
      The concluding synthesis draws together the volume's durable principles
      and identifies the open challenges at the frontier of autonomous agency.

  - key: "backmatter"
    division: "backmatter"
    type: "division"
    numbered: false
    title: "References"
    description: >
      Reference materials and bibliography.
