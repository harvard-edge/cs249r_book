parts:
  - key: "frontmatter"
    division: "frontmatter"
    type: "division"
    numbered: false
    title: "Frontmatter"
    description: >
      Opening material that establishes the scope, audience, and design of the volume.

  - key: "mainmatter"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Main Text"
    description: >
      The main content of the textbook, beginning with the introduction and continuing
      through seven parts that build an agentic system in order, from the model through
      memory, tools, and the runtime to evaluation, learning, and scale.

  - key: "vol3_model"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Model"
    description: >
      This part studies the foundation model at the center of every agent through a single call, what it
      reads, returns, and costs, and asks when spending more inference on one decision raises the evidence
      behind the proposal the runtime admits.

  - key: "vol3_memory"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Agent Memory"
    description: >
      This part closes the state exposure, deciding what each model call sees under a fixed budget, what
      holding that context costs in the serving system, and what persists across sessions and returns
      only through retrieval.

  - key: "vol3_tools"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Tool Use"
    description: >
      This part closes the authority exposure, turning a model's tool call into a validated, authorized
      effect whose outcome is settled before any retry, containing the code behind it inside a sandbox
      enforced below the model, and defending that access against untrusted input that tries to steer it.

  - key: "vol3_runtime"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Agent Runtime"
    description: >
      This part closes the horizon exposure with a harness that runs the loop under budgets and approvals,
      a durable log that lets a trajectory survive a crash, and recovery from bad actions, and it ends by
      measuring the whole single-agent system before anything is trained.

  - key: "vol3_learning"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Learning from Trajectories"
    description: >
      This part changes the model itself, the costliest and least reversible rungs of the intervention
      ladder, by curating the trajectories evaluation assessed, fine-tuning the model on responses selected
      from them, and optimizing it against verifiers isolated from the policy, while moving none of the
      three exposures.

  - key: "vol3_scale"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Agents at Scale"
    description: >
      This part multiplies all three exposures, splitting a task across agents only when the coordination
      tax pays for itself and pricing and provisioning agents per accepted task.

  - key: "vol3_synthesis"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "Synthesis"
    description: >
      This part runs every subsystem the book built together on one trajectory and ends at the specification
      boundary, where adopting the contract that defines success and answering for the result stay with
      the engineer.

  - key: "backmatter"
    division: "backmatter"
    type: "division"
    numbered: false
    title: "Back Matter"
    description: >
      Appendices, glossary, and index.
