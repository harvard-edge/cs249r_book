parts:
  - key: "frontmatter"
    division: "frontmatter"
    type: "division"
    numbered: false
    title: "Frontmatter"
    description: >
      Opening material that establishes the scope, audience, and design of the volume.

  - key: "mainmatter"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Main Text"
    description: >
      The main content of the textbook, beginning with the introduction and
      continuing through five thematic parts.

  - key: "vol3_foundations"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Stochastic Processor"
    description: >
      This part establishes the architectural and theoretical foundations of agentic machine
      learning systems, analyzing the stochastic execution core, prompt instruction decoding,
      and test-time deliberation.

  - key: "vol3_serving"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Context Memory Hierarchy"
    description: >
      This part analyzes the systems infrastructure required to serve stateful, long-running trajectories,
      including attention working sets, paged virtual context memory, episodic stores, and state checkpointing.

  - key: "vol3_security"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Actuation Boundary"
    description: >
      This part addresses the execution boundary where non-deterministic neural policies meet
      the external world, detailing typed tool peripherals, asynchronous interrupts, and microVM sandboxing.

  - key: "vol3_training"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Policy Compiler"
    description: >
      This part examines how models are compiled and adapted for autonomous trajectories,
      spanning synthetic data flywheels, trajectory fine-tuning (SFT), and reinforcement learning with verifiable rewards (RLVR).

  - key: "vol3_scale"
    division: "mainmatter"
    type: "part"
    numbered: true
    title: "The Distributed Fleet"
    description: >
      This part scales agency to multi-agent distributed systems and operational deployment,
      covering coordination topologies, trajectory observability, and system tokenomics.

  - key: "synthesis"
    division: "mainmatter"
    type: "division"
    numbered: false
    title: "Synthesis"
    description: >
      The concluding synthesis draws together the volume's durable principles
      and identifies the open challenges at the frontier of autonomous agency.

  - key: "backmatter"
    division: "backmatter"
    type: "division"
    numbered: false
    title: "References"
    description: >
      Reference materials and bibliography.
