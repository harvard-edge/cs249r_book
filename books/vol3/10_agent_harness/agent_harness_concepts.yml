  learner_graph:
    schema_version: 1
    concepts:
    - id: vol3.guard
      label: Transition guard
      teaches: Guarded transitions
      summary: Runtime-owned predicates determine whether a trajectory may advance, wait, dispatch work,
        or finalize under current conditions.
      section: sec-vol3-agent-harness-transition-guards
    - id: vol3.budget
      label: Trajectory budget
      teaches: Trajectory budget vector
      summary: A runtime account bounds turns, tokens, time, and monetary liability, including work already
        reserved or outstanding.
      section: sec-vol3-harness-multidim-budgets
    - id: vol3.waiting
      label: Supervised waiting
      teaches: Supervised waiting
      summary: The harness suspends model continuation while named external work remains supervised, retaining
        ownership and wakeup conditions.
      section: sec-vol3-controlplane-yielding
    relationships:
    - id: vol3.field.guard.trajectory
      source: vol3.guard
      predicate: controls continuation of
      target: vol3.trajectory
      explanation: The harness owns state transitions and checks current authority, dependencies, capacity,
        and liability.
      conditions: The model proposes; runtime-owned state determines whether work is admitted.
      status: draft
      evidence:
        section: sec-vol3-agent-harness-transition-guards
        quote: 'A trajectory sitting in `READY` can still be unsafe to advance if an operator pause arrived
          a millisecond earlier, a credential expired while the trajectory waited in the queue, or an unresolved
          prior operation still blocks a dependent mutation. Navigating a legal edge in the state machine
          is therefore only a necessary condition for progress, not an unconditional right to execute. Before
          the runtime admits new work, whether invoking a model or dispatching a tool, it evaluates a set
          of predicates known as the *admission check*: no pending control hold may be active, the context,
          credentials, and any required action approvals must remain valid, upstream data dependencies must
          be resolved, and both deadline slack and downstream service capacity must be confirmed. The runtime
          must also reserve the operation''s bounded financial liability from the task budget without encroaching
          on the dedicated finalization reserve (@sec-vol3-controlplane-accounting), and for tool calls
          it must verify that arguments are structurally complete. Because system state changes continuously,
          this evaluation holds only at the instant it executes; an approval granted seconds earlier or
          a scheduling decision made on a previous tick does not carry forward.'
    - id: vol3.field.guard.budget
      source: vol3.guard
      predicate: checks available
      target: vol3.budget
      explanation: Admission reserves bounded liability alongside actual consumption and outstanding work.
      conditions: The reservation must cover a defensible maximum; an estimate with no enforceable ceiling
        is insufficient.
      status: draft
      evidence:
        section: sec-vol3-agent-harness-reservation-settlement
        quote: '***Bounded-liability admission***\index{Bounded-liability admission!definition} is the harness
          rule that admits a new operation only when, in every cumulative budget dimension, actual consumption
          plus outstanding reservations plus the operation''s maximum additional charge plus the protected
          finalization reserve fits within the allowance.'
    - id: vol3.field.waiting.trajectory
      source: vol3.waiting
      predicate: suspends continuation of
      target: vol3.trajectory
      explanation: A wait has an owner and wakeup condition rather than repeatedly asking the model whether
        a job has finished.
      conditions: Outstanding jobs remain supervised even when no model invocation is active.
      status: draft
      evidence:
        section: sec-vol3-controlplane-yielding
        quote: 'When the agent dispatches the integration test for candidate `r18`, the model generates
          nothing for as long as the test runs, which is tens of seconds for the integration test priced
          in @sec-vol3-kv-workload-dynamics, and minutes for a broader suite. If the worker thread that
          dispatched the job blocks until the result returns, it cannot service any other trajectory in
          the interim, and the runtime becomes unresponsive to operator pauses or high-priority interactive
          requests. The repair trajectory requires no token generation while the test executes. What it
          requires instead is an external supervisor: a control entity that tracks the in-flight job, holds
          the execution continuation, and buffers incoming evidence without tying up a worker thread in
          a synchronous wait.'
    - id: vol3.field.waiting.settlement
      source: vol3.waiting
      predicate: retains obligations for
      target: vol3.settlement
      explanation: Pausing or stopping model continuation does not establish whether already dispatched
        work took effect.
      conditions: Settlement and administrative cleanup may outlive the active reasoning loop.
      status: draft
      evidence:
        section: sec-vol3-agent-harness-finalization-duties
        quote: During finalization, the control plane may block to await pending results, report verification
          failures, or hand off outstanding cancellation, billing reconciliation, and resource reclamation
          tasks to an external supervisor. The transition guard into any terminal state requires that every
          outstanding obligation be either definitively settled or explicitly transferred to an accepting
          upstream owner. Clearing an unresolved task from a local tracking set violates the guard. To effect
          a legitimate transfer, the runtime must transmit complete metadata (operation IDs, recorded evidence,
          and budget reservations), allowing the recipient service to assume supervisory responsibility.
