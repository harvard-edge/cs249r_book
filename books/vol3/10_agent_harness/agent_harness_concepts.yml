    - Budget ceiling selection
    - Budget reservation
    - Streaming cancellation
  claims:
    Harness owns continuation: A model that honors a pause or allowance with probability p per turn holds it over
      H turns only p^H of the time, so the decision to take another step belongs to a harness that treats every
      reply as an untrusted proposal.
    Trajectory record: Supervision needs one authoritative per-trajectory control record, written only by the harness,
      holding contract, lifecycle state, accounting, grants, current invocations, the operation table, and a live
      plan.
    Guarded transitions: The trajectory advances only along legal state-machine edges whose guards pass on a current
      record version, and admission commits atomically under the record lock before any request leaves the host
      (register before send).
    Settlement rule: Withdrawing a result's eligibility to inform the model never clears the operation's obligation,
      and no trajectory reaches a terminal state until every obligation is settled or explicitly transferred.
    Turn-boundary control: Operator control takes effect at turn boundaries, so a harness that checks only when
      a reply ends lets one call postpone a pause by K_max x t_dec, and pause, interrupt, cancel, kill, and budget
      stop change admission differently.
    Approval escrow: A proposal that requires review is held undispatched, bound by digest and expiry, and a favorable
      decision is one precondition rather than an order, so dispatch re-runs the full admission check and silence
      expires rather than denies.
    Bounded-liability admission: A budget is an enforceable ceiling only if each operation is admitted when actual
      consumption plus outstanding reservations plus its worst-case liability plus a protected finalization reserve
      fits the allowance in every dimension.
    Trajectory budget vector: A runaway retry loop is locally compliant at every step, so the harness bounds turns,
      tokens, wall time, and dollars as one vector, reads the largest used fraction, and escalates through steer,
      restrict, and finalize.
    Supervised waiting: An asynchronous wait frees the worker thread but not the workspace lease, KV residency,
      reservations, or deadline, and a wait deadline ends the harness's wait, never the remote operation.
    Fair model-call scheduling: Weighted deficit round-robin charged by each call's full input plus maximum output
      fixes a class's share of charge, not of calls, and fairness, provider quotas, and budgets are independent
      gates.
    Budget ceiling selection: A budget ceiling is chosen by evaluating the complete control policy on representative
      tasks and minimizing cost per accepted task, counting failed and budget-halted attempts.
    Budget reservation: An operation's maximum additional charge is withheld at admission and released only when
      evidence settles the operation, so ambiguous dispatches stay reserved.
    Streaming cancellation: Cancelling a stream removes the dependence of control latency on output length, and
      partial or canceled output is quarantined and never dispatched.
