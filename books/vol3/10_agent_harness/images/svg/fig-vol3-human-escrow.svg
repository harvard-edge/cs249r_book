<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="500" fill="#ffffff"/>
  <defs>
    <style>
      .title { font-size: 12px; font-weight: 700; }
      .label { font-size: 9.5px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 8.5px; fill: #475569; }
      .step { font-size: 8px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== Panel A: the held proposal the reviewer sees ===== -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="430" height="460" rx="4" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="0" y="0" width="430" height="26" rx="4" fill="#f3e8ff"/>
    <text x="14" y="17" class="title" fill="#6d28d9">(a) What the reviewer is asked to approve</text>

    <rect x="20" y="40" width="390" height="60" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="30" y="57" class="label">Exact proposal</text>
    <text x="30" y="74" font-family="Courier New, monospace" font-size="9" fill="#b45309">submit_review(target=&lt;review target&gt;, revision="r18",</text>
    <text x="44" y="88" font-family="Courier New, monospace" font-size="9" fill="#b45309">patch=&lt;immutable r18 patch&gt;, checks=[&lt;named records&gt;])</text>

    <rect x="20" y="110" width="390" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="127" class="label">Destination and data scope</text>
    <text x="30" y="144" class="sub">Internal review service; private fixture contents excluded</text>

    <rect x="20" y="166" width="390" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="183" class="label">Selected evidence and its scope</text>
    <text x="30" y="200" class="sub">Named check records on r18; a targeted pass is not full acceptance</text>

    <rect x="20" y="222" width="390" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="239" class="label">Preconditions</text>
    <text x="30" y="256" class="sub">Expected base version of the review target</text>

    <rect x="20" y="278" width="390" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="295" class="label">Approval digest</text>
    <text x="30" y="312" class="sub">Hash of operation, arguments, target, and artifact versions</text>

    <rect x="20" y="334" width="390" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="351" class="label">Expiry</text>
    <text x="30" y="368" class="sub">Expiry is recorded as expiry, not denial</text>

    <rect x="20" y="390" width="390" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="407" class="label">Requesting trajectory</text>
    <text x="30" y="424" class="sub">Task, requester, approval-request ID, held-proposal version</text>
  </g>

  <!-- ===== Panel B: the gate protocol ===== -->
  <g transform="translate(490, 20)">
    <rect x="0" y="0" width="530" height="460" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <rect x="0" y="0" width="530" height="26" rx="4" fill="#f1f5f9"/>
    <text x="14" y="17" class="title" fill="#334155">(b) The gate</text>

    <!-- ── 1. Hold ── -->
    <rect x="20" y="40" width="490" height="50" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2"/>
    <rect x="30" y="50" width="16" height="16" rx="3" fill="#b45309"/>
    <text x="38" y="61" text-anchor="middle" class="step">1</text>
    <text x="56" y="62" class="label">Hold the proposal</text>
    <text x="56" y="78" class="sub">Record it and its digest; enter AWAITING_APPROVAL without sending</text>
    <path d="M 265 90 V 110" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>

    <!-- ── 2. Request ── -->
    <rect x="20" y="110" width="490" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="30" y="120" width="16" height="16" rx="3" fill="#334155"/>
    <text x="38" y="131" text-anchor="middle" class="step">2</text>
    <text x="56" y="132" class="label">Send the request to an authorized reviewer</text>
    <text x="56" y="148" class="sub">Reviewer sees panel (a), not the transcript</text>
    <path d="M 265 160 V 180" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>

    <!-- ── 3. Decide ── -->
    <rect x="20" y="180" width="490" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="30" y="190" width="16" height="16" rx="3" fill="#334155"/>
    <text x="38" y="201" text-anchor="middle" class="step">3</text>
    <text x="56" y="202" class="label">Decision: approve, deny, or expire</text>
    <text x="56" y="218" class="sub">The model is not consulted; decision and digest checked against the record</text>
    <path d="M 265 230 V 250" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-dark)"/>

    <!-- ── 4. Re-check ── -->
    <rect x="20" y="250" width="490" height="50" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="30" y="260" width="16" height="16" rx="3" fill="#7c3aed"/>
    <text x="38" y="271" text-anchor="middle" class="step">4</text>
    <text x="56" y="272" class="label">Re-check at the dispatch boundary</text>
    <text x="56" y="288" class="sub">Expiry, grants, preconditions, pending controls, budget, capacity</text>

    <path d="M 95 300 V 330" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <path d="M 265 300 V 330" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <path d="M 435 300 V 330" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <!-- ── Dispatch ── -->
    <rect x="20" y="330" width="150" height="110" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="20" y="330" width="150" height="22" rx="3" fill="#dcfce7"/>
    <text x="30" y="345" class="label" fill="#15803d">Approved and current</text>
    <text x="30" y="372" class="sub">Reserve, register operation</text>
    <text x="30" y="386" class="sub">and attempt IDs, then</text>
    <text x="30" y="400" class="sub">dispatch</text>
    <text x="30" y="422" class="sub">Enters WAITING_TOOL</text>

    <!-- ── Held for capacity ── -->
    <rect x="190" y="330" width="150" height="110" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2"/>
    <rect x="190" y="330" width="150" height="22" rx="3" fill="#fef3c7"/>
    <text x="200" y="345" class="label" fill="#b45309">Approved, no capacity</text>
    <text x="200" y="372" class="sub">Decision recorded;</text>
    <text x="200" y="386" class="sub">proposal stays held</text>
    <text x="200" y="408" class="sub">Remains in</text>
    <text x="200" y="422" class="sub">AWAITING_APPROVAL</text>

    <!-- ── Refuse ── -->
    <rect x="360" y="330" width="150" height="110" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="360" y="330" width="150" height="22" rx="3" fill="#fee2e2"/>
    <text x="370" y="345" class="label" fill="#b91c1c">Denied, expired, or stale</text>
    <text x="370" y="372" class="sub">REFUSED observation;</text>
    <text x="370" y="386" class="sub">the call was not sent</text>
    <text x="370" y="408" class="sub">Returns to READY if</text>
    <text x="370" y="422" class="sub">continuation is permitted</text>
  </g>
</svg>
