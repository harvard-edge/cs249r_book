<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>
  <g transform="translate(0,4)">
  <defs>
    <style>
      .panel { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .field { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .val { font-size: 12.5px; fill: #475569; }
      .name { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 12.5px; fill: #475569; text-anchor: middle; }
      .edge { font-size: 12.5px; fill: #334155; }
      .code { font-size: 12.5px; fill: #b45309; }
    </style>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f172a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ================= (a) The approval record ================= -->
  <text x="20" y="28" class="panel">(a) What the reviewer approves</text>

  <!-- exact proposal -->
  <rect x="20" y="44" width="720" height="52" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="36" y="65" class="field">Exact proposal</text>
  <text x="36" y="85" class="code" font-family="Courier New, monospace">submit_review(r18 patch, named check records)</text>

  <!-- field cells -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1">
    <rect x="20" y="96" width="144" height="56" rx="0"/>
    <rect x="164" y="96" width="144" height="56" rx="0"/>
    <rect x="308" y="96" width="144" height="56" rx="0"/>
    <rect x="452" y="96" width="144" height="56" rx="0"/>
    <rect x="596" y="96" width="144" height="56" rx="0"/>
  </g>
  <text x="32" y="118" class="field">Destination</text>
  <text x="32" y="138" class="val">internal, data scoped</text>
  <text x="176" y="118" class="field">Evidence</text>
  <text x="176" y="138" class="val">named checks only</text>
  <text x="320" y="118" class="field">Preconditions</text>
  <text x="320" y="138" class="val">base version</text>
  <text x="464" y="118" class="field">Expiry</text>
  <text x="464" y="138" class="val">recorded as expiry</text>
  <text x="608" y="118" class="field">Trajectory</text>
  <text x="608" y="138" class="val">requesting task</text>

  <!-- binding ticks: every field feeds the digest -->
  <g stroke="#7c3aed" stroke-width="1.2">
    <line x1="92" y1="152" x2="92" y2="170"/>
    <line x1="236" y1="152" x2="236" y2="170"/>
    <line x1="380" y1="152" x2="380" y2="170"/>
    <line x1="524" y1="152" x2="524" y2="170"/>
    <line x1="668" y1="152" x2="668" y2="170"/>
  </g>
  <rect x="20" y="170" width="720" height="32" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="191" class="name" fill="#6d28d9">Approval digest: binds the proposal and every field</text>

  <line x1="20" y1="218" x2="740" y2="218" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ================= (b) The gate ================= -->
  <text x="20" y="242" class="panel">(b) The gate</text>

  <!-- steps -->
  <rect x="20" y="290" width="170" height="50" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="105" y="311" class="name" fill="#0f172a">1  Hold</text>
  <text x="105" y="328" class="sub" style="fill:#b45309">AWAITING_APPROVAL</text>

  <rect x="210" y="290" width="110" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="265" y="311" class="name" fill="#0f172a">2  Reviewer</text>
  <text x="265" y="328" class="sub">sees (a) only</text>

  <rect x="340" y="290" width="130" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="405" y="311" class="name" fill="#0f172a">3  Decision</text>
  <text x="405" y="328" class="sub">model not asked</text>

  <line x1="190" y1="315" x2="208" y2="315" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="320" y1="315" x2="338" y2="315" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- dispatch boundary: a wall with one opening -->
  <rect x="510" y="270" width="8" height="35" rx="0" fill="#7c3aed"/>
  <rect x="510" y="325" width="8" height="125" rx="0" fill="#7c3aed"/>
  <text x="514" y="472" class="name" fill="#6d28d9">4  Recheck at the</text>
  <text x="514" y="489" class="name" fill="#6d28d9">dispatch boundary</text>

  <!-- approved and current: the only path through -->
  <line x1="470" y1="315" x2="588" y2="315" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <text x="554" y="288" class="edge" text-anchor="middle">approved,</text>
  <text x="554" y="303" class="edge" text-anchor="middle">current</text>
  <rect x="590" y="290" width="150" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="665" y="311" class="name" fill="#b45309">WAITING_TOOL</text>
  <text x="665" y="328" class="sub">reserved, sent</text>

  <!-- approved, no capacity: stays held -->
  <polyline points="514,270 514,262 105,262 105,288" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="310" y="280" class="edge" text-anchor="middle">approved, no capacity: stays held</text>

  <!-- refusals -->
  <line x1="405" y1="340" x2="405" y2="398" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="397" y="366" class="edge" text-anchor="end">denied,</text>
  <text x="397" y="381" class="edge" text-anchor="end">expired</text>
  <line x1="510" y1="423" x2="472" y2="423" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="490" y="413" class="edge" text-anchor="middle">stale</text>
  <rect x="340" y="400" width="130" height="50" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="405" y="421" class="name" fill="#334155">REFUSED</text>
  <text x="405" y="438" class="sub">back to READY</text>
  </g>
</svg>
