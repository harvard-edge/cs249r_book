<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="540" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .header-box { rx: 4px; stroke-width: 1.2px; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8px; fill: #64748b; text-anchor: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.2px; stroke-dasharray: 4,4; }
      .msg-label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8.5px; font-weight: 600; }
      .msg-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #64748b; }
      .box-label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8px; font-weight: 600; text-anchor: middle; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #475569; text-anchor: middle; }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.4; fill: none; marker-end: url(#arr-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.4; fill: none; marker-end: url(#arr-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 1.4; fill: none; marker-end: url(#arr-green); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 1.4; fill: none; marker-end: url(#arr-purple); }
      .arrow-slate { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arr-slate); }
      .arrow-dma { stroke: #d97706; stroke-width: 2.0; fill: none; marker-end: url(#arr-amber); stroke-dasharray: 5,3; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="980" height="540" class="bg"/>

  <!-- ================================================================= -->
  <!-- COLUMN HEADERS & LIFELINES                                        -->
  <!-- ================================================================= -->

  <!-- Column 1: Operator -->
  <g transform="translate(40, 16)">
    <rect x="0" y="0" width="160" height="36" class="header-box" fill="#f8fafc" stroke="#64748b"/>
    <text x="80" y="16" class="header-title" fill="#1e293b">OPERATOR / CLI</text>
    <text x="80" y="28" class="header-sub">Interactive Control Terminal</text>
  </g>
  <line x1="120" y1="52" x2="120" y2="520" class="lifeline"/>

  <!-- Column 2: Supervisor Control Plane -->
  <g transform="translate(290, 16)">
    <rect x="0" y="0" width="180" height="36" class="header-box" fill="#f0f9ff" stroke="#0284c7"/>
    <text x="90" y="16" class="header-title" fill="#0369a1">SUPERVISOR KERNEL</text>
    <text x="90" y="28" class="header-sub">ACB State &amp; Signal Bitmask</text>
  </g>
  <line x1="380" y1="52" x2="380" y2="520" class="lifeline"/>

  <!-- Column 3: Inference Engine (GPU) -->
  <g transform="translate(560, 16)">
    <rect x="0" y="0" width="180" height="36" class="header-box" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="90" y="16" class="header-title" fill="#1d4ed8">INFERENCE ACCELERATOR</text>
    <text x="90" y="28" class="header-sub">PagedAttention / GPU HBM</text>
  </g>
  <line x1="650" y1="52" x2="650" y2="520" class="lifeline"/>

  <!-- Column 4: Storage / Host DRAM -->
  <g transform="translate(800, 16)">
    <rect x="0" y="0" width="150" height="36" class="header-box" fill="#faf5ff" stroke="#7c3aed"/>
    <text x="75" y="16" class="header-title" fill="#6d28d9">HOST DRAM &amp; NVMe</text>
    <text x="75" y="28" class="header-sub">Transactional WAL &amp; Staging</text>
  </g>
  <line x1="875" y1="52" x2="875" y2="520" class="lifeline"/>

  <!-- ================================================================= -->
  <!-- PHASE 1: ACTIVE AUTOREGRESSIVE DECODING (t0)                      -->
  <!-- ================================================================= -->

  <!-- Active Execution Bar on GPU -->
  <rect x="643" y="68" width="14" height="110" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="668" y="86" class="msg-label" fill="#1d4ed8">Autoregressive Decode (GEMV)</text>
  <text x="668" y="98" class="msg-sub">Generating tokens t_1, t_2, ...; KV cache active in HBM (2.50 GiB)</text>

  <!-- ================================================================= -->
  <!-- PHASE 2: ASYNCHRONOUS SIGNAL ARRIVAL (t1)                         -->
  <!-- ================================================================= -->

  <!-- Signal Arrow: Operator -> Supervisor -->
  <line x1="120" y1="120" x2="378" y2="120" class="arrow-red"/>
  <rect x="155" y="106" width="185" height="26" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="247" y="119" class="msg-label" fill="#dc2626" text-anchor="middle">SIGPAUSE (Async Request)</text>
  <text x="247" y="128" class="msg-sub" fill="#991b1b" text-anchor="middle">Operator requests trajectory pause</text>

  <!-- Supervisor State Mutation Box -->
  <g transform="translate(300, 134)">
    <rect x="0" y="0" width="160" height="34" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="80" y="14" class="box-label" fill="#0284c7">acb.pending_signals |= SIGPAUSE</text>
    <text x="80" y="26" class="box-sub">Do not kill mid-token; wait for C_post</text>
  </g>

  <!-- ================================================================= -->
  <!-- PHASE 3: TURN-BOUNDARY CHECKPOINT INTERCEPTION (t2)               -->
  <!-- ================================================================= -->

  <!-- Sub-checkpoint boundary line on GPU -->
  <line x1="620" y1="178" x2="680" y2="178" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="174" class="msg-label" fill="#15803d">Checkpoint C_post (K = 16 tokens)</text>
  <text x="690" y="184" class="msg-sub">Bounded polling latency Δt ≤ 533 ms</text>

  <!-- Notification: GPU -> Supervisor -->
  <line x1="643" y1="192" x2="382" y2="192" class="arrow-green"/>
  <rect x="420" y="181" width="180" height="20" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
  <text x="510" y="194" class="msg-label" fill="#15803d" text-anchor="middle">Poll Check: Interrupt Pending</text>

  <!-- Supervisor Interrupt Acknowledgment -> GPU -->
  <line x1="380" y1="210" x2="643" y2="210" class="arrow-blue"/>
  <rect x="430" y="202" width="160" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="510" y="214" class="msg-label" fill="#0284c7" text-anchor="middle">PAUSE_DECODE_ACK (Consistent)</text>

  <!-- ================================================================= -->
  <!-- PHASE 4: STATE PERSISTENCE & MEMORY EVICTION (t3)                 -->
  <!-- ================================================================= -->

  <!-- Supervisor -> Storage WAL snapshot -->
  <line x1="380" y1="240" x2="873" y2="240" class="arrow-purple"/>
  <rect x="520" y="230" width="220" height="20" rx="3" fill="#ffffff" stroke="#c084fc" stroke-width="0.8"/>
  <text x="630" y="243" class="msg-label" fill="#7c3aed" text-anchor="middle">fsync(wal_fd): Snapshot ACB Descriptor</text>

  <!-- GPU -> Storage PCIe DMA Eviction -->
  <line x1="650" y1="272" x2="873" y2="272" class="arrow-dma"/>
  <rect x="670" y="261" width="185" height="22" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
  <text x="762" y="273" class="msg-label" fill="#b45309" text-anchor="middle">PCIe Gen5 DMA Evict KV Cache</text>
  <text x="762" y="281" class="msg-sub" fill="#92400e" text-anchor="middle">2.50 GiB @ 64 GB/s (~40 ms) → Host RAM</text>

  <!-- GPU slot freed annotation -->
  <rect x="620" y="296" width="60" height="18" rx="2" fill="#ecfdf5" stroke="#86efac" stroke-width="0.8"/>
  <text x="650" y="308" class="box-label" fill="#15803d">SLOT FREE</text>

  <!-- Supervisor state transition box -->
  <g transform="translate(290, 304)">
    <rect x="0" y="0" width="180" height="34" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <text x="90" y="14" class="box-label" fill="#b45309">ACB: RUNNING → SUSPENDED</text>
    <text x="90" y="26" class="box-sub">Worker thread released back to pool</text>
  </g>

  <!-- ================================================================= -->
  <!-- PHASE 5: QUIESCENT OPERATOR REVIEW WINDOW (t4)                    -->
  <!-- ================================================================= -->
  <g transform="translate(60, 350)">
    <rect x="0" y="0" width="860" height="42" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="430" y="18" class="box-label" fill="#334155">QUIESCENT: no GPU HBM, no worker threads</text>
    <text x="430" y="32" class="box-sub" fill="#64748b">Audit call, blast radius, context diff</text>
  </g>

  <!-- ================================================================= -->
  <!-- PHASE 6: STATE RESTORATION & RESUMPTION (t5)                      -->
  <!-- ================================================================= -->

  <!-- Resume Command: Operator -> Supervisor -->
  <line x1="120" y1="416" x2="378" y2="416" class="arrow-green"/>
  <rect x="175" y="405" width="145" height="20" rx="3" fill="#ecfdf5" stroke="#86efac" stroke-width="0.8"/>
  <text x="247" y="418" class="msg-label" fill="#15803d" text-anchor="middle">SIGRESUME (Authorize)</text>

  <!-- Supervisor Restores State -->
  <g transform="translate(295, 430)">
    <rect x="0" y="0" width="170" height="32" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="85" y="13" class="box-label" fill="#0284c7">acb.pending_signals &amp;= ~SIGPAUSE</text>
    <text x="85" y="25" class="box-sub">Acquire GPU batch slot &amp; bind thread</text>
  </g>

  <!-- Storage -> GPU DMA Prefetch -->
  <line x1="875" y1="466" x2="652" y2="466" class="arrow-dma"/>
  <rect x="680" y="455" width="170" height="20" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
  <text x="765" y="468" class="msg-label" fill="#b45309" text-anchor="middle">DMA Prefetch KV Cache to HBM</text>

  <!-- Final State Resumed -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="160" height="28" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="80" y="13" class="box-label" fill="#065f46">ACB: SUSPENDED → RUNNING</text>
    <text x="80" y="23" class="box-sub">Proceeds to validated tool execution</text>
  </g>

</svg>
