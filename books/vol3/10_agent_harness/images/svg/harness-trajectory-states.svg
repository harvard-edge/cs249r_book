<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 482"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="800" height="482" fill="#ffffff"/>
  <defs>
    <style>
      .state { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 12.5px; fill: #475569; text-anchor: middle; }
      .edge { font-size: 12.5px; fill: #334155; }
      .region { font-size: 13px; fill: #64748b; }
    </style>
    <marker id="arr-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f172a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== Live-state region ===== -->
  <rect x="20" y="20" width="500" height="410" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="36" y="42" class="region">live states</text>

  <!-- ── states ── -->
  <rect x="70" y="60" width="160" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="150" y="81" class="state" fill="#334155">PAUSED</text>
  <text x="150" y="99" class="sub">no new work</text>

  <rect x="70" y="180" width="160" height="50" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="150" y="201" class="state" fill="#0f172a">READY</text>
  <text x="150" y="219" class="sub">admission checks</text>

  <rect x="330" y="180" width="160" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="410" y="201" class="state" fill="#0369a1">CALLING_MODEL</text>
  <text x="410" y="219" class="sub">call reserved</text>

  <rect x="70" y="310" width="160" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="331" class="state" fill="#b45309">WAITING_TOOL</text>
  <text x="150" y="349" class="sub">tool work running</text>

  <rect x="330" y="310" width="160" height="50" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="410" y="331" class="state" fill="#b45309">AWAITING_APPROVAL</text>
  <text x="410" y="349" class="sub">proposal held</text>

  <!-- ── pause / resume (only from READY) ── -->
  <line x1="130" y1="180" x2="130" y2="112" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="170" y1="110" x2="170" y2="178" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="122" y="150" class="edge" text-anchor="end">pause</text>
  <text x="178" y="150" class="edge">resume</text>

  <!-- ── ordinary cycle (focal) ── -->
  <line x1="230" y1="197" x2="328" y2="197" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="280" y="189" class="edge" text-anchor="middle">call admitted</text>
  <polyline points="370,230 370,280 200,280 200,308" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="285" y="274" class="edge" text-anchor="middle">tool call admitted</text>
  <line x1="110" y1="310" x2="110" y2="232" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="120" y="266" class="edge">wait policy</text>
  <text x="120" y="281" class="edge">met</text>

  <!-- ── no admissible action ── -->
  <line x1="330" y1="217" x2="232" y2="217" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="280" y="236" class="edge" text-anchor="middle">no admissible</text>
  <text x="280" y="250" class="edge" text-anchor="middle">action</text>

  <!-- ── approval path ── -->
  <line x1="450" y1="230" x2="450" y2="308" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-amber)"/>
  <text x="442" y="262" class="edge" text-anchor="end">approval</text>
  <text x="442" y="276" class="edge" text-anchor="end">required</text>
  <line x1="330" y1="350" x2="232" y2="350" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="280" y="324" class="edge" text-anchor="middle">approved,</text>
  <text x="280" y="339" class="edge" text-anchor="middle">guards pass</text>

  <!-- ── refusal returns to READY ── -->
  <polyline points="410,360 410,390 40,390 40,207 68,207" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="225" y="410" class="edge" text-anchor="middle">denied, expired, or stale: refused observation</text>

  <!-- ===== Exit ===== -->
  <!-- any live state to FINALIZING -->
  <polyline points="520,60 660,60 660,178" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="540" y="34" class="edge">from any live state:</text>
  <text x="540" y="50" class="edge">cancel, kill, budget, deadline</text>

  <!-- completion request -->
  <line x1="490" y1="197" x2="578" y2="197" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="534" y="158" class="edge" text-anchor="middle">completion</text>
  <text x="534" y="173" class="edge" text-anchor="middle">request</text>

  <rect x="580" y="180" width="160" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="660" y="201" class="state" fill="#6d28d9">FINALIZING</text>
  <text x="660" y="219" class="sub">admission stopped</text>

  <!-- spine to terminal states -->
  <polyline points="600,230 600,415" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <line x1="600" y1="295" x2="623" y2="295" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="600" y1="355" x2="623" y2="355" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="600" y1="415" x2="623" y2="415" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- terminal (absorbing) states: double border -->
  <rect x="625" y="270" width="150" height="50" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="629" y="274" width="142" height="42" rx="2" fill="none" stroke="#0f172a" stroke-width="0.8"/>
  <text x="700" y="292" class="state" fill="#0f172a">COMPLETED</text>
  <text x="700" y="309" class="sub">check passed</text>

  <rect x="625" y="330" width="150" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="629" y="334" width="142" height="42" rx="2" fill="none" stroke="#dc2626" stroke-width="0.8"/>
  <text x="700" y="352" class="state" fill="#b91c1c">FAILED</text>
  <text x="700" y="369" class="sub">error, budget, deadline</text>

  <rect x="625" y="390" width="150" height="50" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <rect x="629" y="394" width="142" height="42" rx="2" fill="none" stroke="#64748b" stroke-width="0.8"/>
  <text x="700" y="412" class="state" fill="#334155">CANCELED</text>
  <text x="700" y="429" class="sub">operator stop</text>

  <text x="700" y="458" class="region" text-anchor="middle">absorbing</text>
</svg>
