<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 760 420"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="26" width="760" height="420" fill="#ffffff"/>
  <defs>
    <style>
      .lbl { font-size: 13px; fill: #0f172a; }
      .sub { font-size: 12.5px; fill: #475569; }
      .head { font-size: 13px; font-weight: 700; fill: #334155; }
      .name { font-size: 13px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== The runaway loop ===== -->
  <g fill="none" stroke="#dc2626" stroke-width="1.8">
    <path d="M208.7,87 A90,90 0 0 1 278,156.3" marker-end="url(#arr-red)"/>
    <path d="M278,193.7 A90,90 0 0 1 208.7,263" marker-end="url(#arr-red)"/>
    <path d="M171.3,263 A90,90 0 0 1 102,193.7" marker-end="url(#arr-red)"/>
    <path d="M102,156.3 A90,90 0 0 1 171.3,87" marker-end="url(#arr-red)"/>
  </g>
  <!-- stations on the loop -->
  <circle cx="190" cy="85" r="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="280" cy="175" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="190" cy="265" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="190" y="66" class="lbl" text-anchor="middle">model proposes a variant</text>
  <text x="294" y="180" class="lbl">test fails</text>
  <text x="190" y="290" class="lbl" text-anchor="middle">error appended</text>
  <text x="96" y="106" class="lbl" text-anchor="end">retry</text>
  <text x="190" y="171" class="sub" text-anchor="middle">each call well formed,</text>
  <text x="190" y="187" class="sub" text-anchor="middle">within per-call limits</text>

  <!-- rare exit: ending the turn -->
  <line x1="254" y1="111" x2="282" y2="83" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="288" y="82" class="sub">end turn: rare</text>

  <!-- admission gate on the loop, and the refusal -->
  <rect x="94" y="163" width="12" height="24" rx="0" fill="#7c3aed"/>
  <g stroke="#dc2626" stroke-width="2.4" stroke-linecap="round">
    <line x1="108" y1="115" x2="124" y2="131"/><line x1="124" y1="115" x2="108" y2="131"/>
  </g>
  <polyline points="94,175 50,175 50,318" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="58" y="310" class="sub" fill="#6d28d9" style="fill:#6d28d9">admission test</text>

  <!-- ===== Context per turn: errors dilute the task ===== -->
  <text x="400" y="60" class="head">context, turn after turn</text>
  <text x="400" y="98" class="sub">early</text>
  <text x="400" y="136" class="sub">later</text>
  <text x="400" y="174" class="sub">much later</text>
  <!-- task blocks -->
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="1">
    <rect x="480" y="80" width="60" height="26" rx="0"/>
    <rect x="480" y="118" width="60" height="26" rx="0"/>
    <rect x="480" y="156" width="60" height="26" rx="0"/>
  </g>
  <g class="sub" text-anchor="middle" style="fill:#15803d">
    <text x="510" y="98">task</text>
    <text x="510" y="136">task</text>
    <text x="510" y="174">task</text>
  </g>
  <!-- error observations -->
  <g fill="#fee2e2" stroke="#dc2626" stroke-width="0.8">
    <rect x="542" y="80" width="20" height="26" rx="0"/>

    <rect x="542" y="118" width="20" height="26" rx="0"/>
    <rect x="564" y="118" width="20" height="26" rx="0"/>
    <rect x="586" y="118" width="20" height="26" rx="0"/>
    <rect x="608" y="118" width="20" height="26" rx="0"/>

    <rect x="542" y="156" width="20" height="26" rx="0"/>
    <rect x="564" y="156" width="20" height="26" rx="0"/>
    <rect x="586" y="156" width="20" height="26" rx="0"/>
    <rect x="608" y="156" width="20" height="26" rx="0"/>
    <rect x="630" y="156" width="20" height="26" rx="0"/>
    <rect x="652" y="156" width="20" height="26" rx="0"/>
    <rect x="674" y="156" width="20" height="26" rx="0"/>
    <rect x="696" y="156" width="20" height="26" rx="0"/>
    <rect x="718" y="156" width="20" height="26" rx="0"/>
  </g>
  <polyline points="542,190 542,196 738,196 738,190" fill="none" stroke="#b91c1c" stroke-width="1"/>
  <text x="640" y="214" class="sub" text-anchor="middle" style="fill:#b91c1c">error observations</text>

  <!-- ===== Harness budget, outside the context ===== -->
  <rect x="20" y="320" width="720" height="104" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="36" y="342" class="head" style="fill:#6d28d9">Harness budget, kept outside the context</text>

  <!-- the reservation test as a stacked bar -->
  <rect x="40" y="360" width="120" height="30" rx="0" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <rect x="160" y="360" width="80" height="30" rx="0" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1"/>
  <rect x="240" y="360" width="80" height="30" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="320" y="360" width="116" height="30" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="412" class="sub" text-anchor="middle">actual +</text>
  <text x="200" y="412" class="sub" text-anchor="middle">reserved +</text>
  <text x="280" y="412" class="sub" text-anchor="middle">proposed +</text>
  <text x="378" y="412" class="sub" text-anchor="middle">finalization reserve</text>

  <!-- allowance: the limit -->
  <line x1="396" y1="350" x2="396" y2="398" stroke="#dc2626" stroke-width="2"/>
  <text x="390" y="354" class="sub" text-anchor="end" style="fill:#b91c1c">≤ allowance</text>

  <!-- does not fit or deadline passed: refused, finalize -->
  <line x1="442" y1="378" x2="612" y2="378" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="523" y="352" class="sub" text-anchor="middle" style="fill:#6d28d9">refused:</text>
  <text x="523" y="369" class="sub" text-anchor="middle">over budget or past deadline</text>
  <rect x="616" y="355" width="116" height="46" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="674" y="374" class="name" fill="#6d28d9">FINALIZING</text>
  <text x="674" y="391" class="sub" text-anchor="middle">settle or transfer</text>
</svg>
