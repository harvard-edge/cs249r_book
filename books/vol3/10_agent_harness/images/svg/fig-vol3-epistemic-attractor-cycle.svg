<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
  <defs>
    <style>
      .head { font-size: 10px; font-weight: 700; }
      .label { font-size: 9.5px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 8.5px; fill: #475569; }
      .edge { font-size: 9px; font-weight: 700; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== Node 1: model proposes (top left) ===== -->
  <g transform="translate(50, 20)">
    <rect x="0" y="0" width="240" height="92" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="22" rx="3" fill="#e0f2fe"/>
    <text x="10" y="15" class="head" fill="#0369a1">MODEL PROPOSES AN ACTION</text>
    <text x="10" y="42" class="label">A tool call from its context</text>
    <text x="10" y="58" class="sub">A variant, then another, then a diagnostic</text>
    <text x="10" y="74" class="sub">May see a budget notice; cannot enforce it</text>
  </g>

  <!-- ── Edge 1 -> 2: the tool fails ── -->
  <line x1="290" y1="66" x2="370" y2="66" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="370" y="54" width="180" height="24" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="460" y="69" text-anchor="middle" class="edge" fill="#b91c1c">Targeted test fails</text>
  <line x1="550" y1="66" x2="650" y2="66" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ===== Node 2: error observations accumulate (top right) ===== -->
  <g transform="translate(650, 20)">
    <rect x="0" y="0" width="260" height="92" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="260" height="22" rx="3" fill="#fee2e2"/>
    <text x="10" y="15" class="head" fill="#b91c1c">ERROR OBSERVATIONS ACCUMULATE</text>
    <text x="10" y="42" class="label">Each failure is appended to the context</text>
    <text x="10" y="58" class="sub">Task instructions are diluted</text>
    <text x="10" y="74" class="sub">History is dominated by failed attempts</text>
  </g>

  <!-- ── Edge 2 -> 3 ── -->
  <path d="M 780 112 V 160" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ===== Node 3: ending the turn becomes rare (bottom right) ===== -->
  <g transform="translate(650, 160)">
    <rect x="0" y="0" width="260" height="110" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="260" height="22" rx="3" fill="#e0f2fe"/>
    <text x="10" y="15" class="head" fill="#0369a1">ENDING THE TURN BECOMES RARE</text>
    <text x="10" y="42" class="label">Completion is rarely requested</text>
    <text x="10" y="58" class="sub">Each call is well formed</text>
    <text x="10" y="74" class="sub">and inside every per-call limit</text>
    <text x="10" y="90" class="sub">Nothing inside the loop says stop</text>
  </g>

  <!-- ── Edge 3 -> 4: another retry ── -->
  <line x1="650" y1="215" x2="560" y2="215" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="380" y="203" width="180" height="24" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="470" y="218" text-anchor="middle" class="edge" fill="#b91c1c">Another retry</text>
  <line x1="380" y1="215" x2="290" y2="215" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ===== Node 4: runaway loop (bottom left) ===== -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="240" height="110" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="22" rx="3" fill="#fee2e2"/>
    <text x="10" y="15" class="head" fill="#b91c1c">RUNAWAY LOOP</text>
    <text x="10" y="42" class="label">Retries without progress</text>
    <text x="10" y="58" class="sub">Same call, or small argument variations</text>
    <text x="10" y="74" class="sub">Consumes tokens, time, and dollars</text>
    <text x="10" y="90" class="sub">Repair moves no closer to acceptance</text>
  </g>

  <!-- ── Feedback 4 -> 1, severed by the harness ── -->
  <line x1="170" y1="160" x2="170" y2="146" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="162" y1="129" x2="178" y2="145" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="162" y1="145" x2="178" y2="129" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="170" y1="128" x2="170" y2="112" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <rect x="190" y="128" width="90" height="18" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
  <text x="235" y="140" text-anchor="middle" class="edge" fill="#b91c1c">LOOP STOPPED</text>

  <!-- ===== Harness budget, outside the context (bottom span) ===== -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="860" height="120" rx="4" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="0" y="0" width="860" height="24" rx="4" fill="#f3e8ff"/>
    <text x="14" y="16" class="head" fill="#6d28d9">HARNESS BUDGET, KEPT OUTSIDE THE CONTEXT</text>

    <!-- ── Admission test ── -->
    <rect x="16" y="36" width="490" height="70" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="54" class="label">Checked at every admission</text>
    <text x="28" y="72" font-family="Courier New, monospace" font-size="9.5" font-weight="700" fill="#0f172a">actual + reserved + proposed + finalization reserve ≤ allowance</text>
    <text x="28" y="92" class="sub">Per dimension (turns, tokens, dollars); the deadline is checked separately</text>

    <line x1="506" y1="71" x2="548" y2="71" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- ── Finalize ── -->
    <rect x="548" y="36" width="296" height="70" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="560" y="54" class="label" fill="#6d28d9">FINALIZING (budget or deadline stop)</text>
    <text x="560" y="72" class="sub">Stop admission</text>
    <text x="560" y="92" class="sub">Settle or transfer outstanding work</text>
  </g>

  <!-- ── Harness severs the loop ── -->
  <path d="M 50 340 H 30 V 137 H 158" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <rect x="44" y="124" width="100" height="26" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="94" y="135" text-anchor="middle" class="edge" fill="#6d28d9">Admission refused</text>
  <text x="94" y="145" text-anchor="middle" class="sub" font-size="8">budget or deadline</text>
</svg>
