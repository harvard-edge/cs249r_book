<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="is-arr-amethyst" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#581C87"/>
    </marker>
    <marker id="is-arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#991B1B"/>
    </marker>
    <marker id="is-arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0F766E"/>
    </marker>
    <marker id="is-arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1040" height="540" fill="#FFFFFF"/>

  <!-- Diagram Title Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="0.2">THE OPERATING SYSTEMS ISOLATION SPECTRUM FOR AGENT RUNTIMES</text>
    <text x="0" y="15" font-size="10" font-weight="400" fill="#475569">Architectural Boundaries, CPU Privilege Rings, Syscall Surfaces, and Virtualization Trade-Offs</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 4 COMPARATIVE ARCHITECTURAL STACKS                                        -->
  <!-- ========================================================================= -->

  <!-- Column 1: Linux Containers (Docker / cgroups) -->
  <g transform="translate(40, 62)">
    <rect width="224" height="340" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="224" height="28" rx="3" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="112" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">1. Linux Containers (Docker)</text>

    <!-- Microarchitecture Layers -->
    <g transform="translate(14, 38)">
      <!-- App Process -->
      <rect width="196" height="32" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
      <text x="98" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Untrusted Agent Code</text>

      <line x1="98" y1="32" x2="98" y2="46" stroke="#991B1B" stroke-width="1.4" marker-end="url(#is-arr-red)"/>
      <text x="104" y="42" font-size="7" font-family="ui-monospace, monospace" fill="#991B1B">450+ Syscalls</text>

      <!-- Namespace Barrier (Soft) -->
      <rect y="48" width="196" height="24" rx="1" fill="#FEF2F2" stroke="#991B1B" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="98" y="64" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#991B1B">Namespaces + cgroups v2</text>

      <line x1="98" y1="72" x2="98" y2="84" stroke="#991B1B" stroke-width="1.4" marker-end="url(#is-arr-red)"/>

      <!-- Shared Host Kernel -->
      <rect y="86" width="196" height="42" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.4"/>
      <text x="98" y="103" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">Shared Host Linux Kernel</text>
      <text x="98" y="117" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Ring 0 (Direct Host Exposure)</text>

      <line x1="98" y1="128" x2="98" y2="140" stroke="#475569" stroke-width="1.2" marker-end="url(#is-arr-slate)"/>

      <!-- Bare Metal Hardware -->
      <rect y="142" width="196" height="28" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
      <text x="98" y="160" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#334155">Bare-Metal Hardware</text>
    </g>

    <!-- Formal Systems Metrics -->
    <g transform="translate(14, 218)">
      <rect width="196" height="110" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#475569">CONTAINMENT BOUNDARY:</text>
        <text x="0" y="12" font-size="8" font-family="ui-monospace, monospace" fill="#991B1B">Process-Level (Shared Kernel)</text>

        <text x="0" y="28" font-size="7.5" font-weight="700" fill="#475569">COLD BOOT (T_boot):</text>
        <text x="0" y="40" font-size="8" font-family="ui-monospace, monospace" fill="#0F172A">150 - 400 ms</text>

        <text x="0" y="56" font-size="7.5" font-weight="700" fill="#475569">HOST ATTACK SURFACE:</text>
        <text x="0" y="68" font-size="8" font-family="ui-monospace, monospace" fill="#991B1B">450+ Host Syscalls (Critical)</text>

        <text x="0" y="86" font-size="7" font-weight="700" fill="#991B1B">VERDICT: Unsafe for Agents</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Userspace Kernel (gVisor) -->
  <g transform="translate(288, 62)">
    <rect width="224" height="340" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="224" height="28" rx="3" fill="#FEF3C7" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="112" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400E">2. Userspace Kernel (gVisor)</text>

    <!-- Microarchitecture Layers -->
    <g transform="translate(14, 38)">
      <rect width="196" height="32" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
      <text x="98" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Untrusted Agent Code</text>

      <line x1="98" y1="32" x2="98" y2="46" stroke="#92400E" stroke-width="1.4" marker-end="url(#is-arr-ochre)"/>
      <text x="104" y="42" font-size="7" font-family="ui-monospace, monospace" fill="#92400E">Syscall Intercept</text>

      <!-- gVisor Sentry -->
      <rect y="48" width="196" height="36" rx="2" fill="#FEF3C7" stroke="#92400E" stroke-width="1.2"/>
      <text x="98" y="64" text-anchor="middle" font-size="8" font-weight="700" fill="#92400E">gVisor Sentry (Go Runtime)</text>
      <text x="98" y="76" text-anchor="middle" font-size="7" font-family="ui-monospace, monospace" fill="#475569">Ring 3 Userspace Emulation</text>

      <line x1="98" y1="84" x2="98" y2="96" stroke="#0F766E" stroke-width="1.2" marker-end="url(#is-arr-teal)"/>
      <text x="104" y="93" font-size="7" font-family="ui-monospace, monospace" fill="#0F766E">~50 Safe Calls</text>

      <!-- Host Linux Kernel -->
      <rect y="98" width="196" height="32" rx="2" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
      <text x="98" y="114" text-anchor="middle" font-size="8" font-weight="700" fill="#0F172A">Host Linux Kernel (Filtered)</text>
      <text x="98" y="124" text-anchor="middle" font-size="7" font-family="ui-monospace, monospace" fill="#475569">KVM / seccomp Filter</text>

      <line x1="98" y1="130" x2="98" y2="140" stroke="#475569" stroke-width="1.2" marker-end="url(#is-arr-slate)"/>

      <!-- Bare Metal Hardware -->
      <rect y="142" width="196" height="28" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
      <text x="98" y="160" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#334155">Bare-Metal Hardware</text>
    </g>

    <!-- Formal Systems Metrics -->
    <g transform="translate(14, 218)">
      <rect width="196" height="110" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#475569">CONTAINMENT BOUNDARY:</text>
        <text x="0" y="12" font-size="8" font-family="ui-monospace, monospace" fill="#92400E">Application-Level Syscall Proxy</text>

        <text x="0" y="28" font-size="7.5" font-weight="700" fill="#475569">COLD BOOT (T_boot):</text>
        <text x="0" y="40" font-size="8" font-family="ui-monospace, monospace" fill="#0F172A">15 - 35 ms</text>

        <text x="0" y="56" font-size="7.5" font-weight="700" fill="#475569">STEADY-STATE I/O TAX:</text>
        <text x="0" y="68" font-size="8" font-family="ui-monospace, monospace" fill="#92400E">15% - 35% VFS Penalty</text>

        <text x="0" y="86" font-size="7" font-weight="700" fill="#92400E">VERDICT: Slow on Compilation</text>
      </g>
    </g>
  </g>

  <!-- Column 3: WebAssembly SFI (Wasm / WASI) -->
  <g transform="translate(536, 62)">
    <rect width="224" height="340" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="224" height="28" rx="3" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="112" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F766E">3. Software Fault Isolation (Wasm)</text>

    <!-- Microarchitecture Layers -->
    <g transform="translate(14, 38)">
      <rect width="196" height="32" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
      <text x="98" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Wasm-Targeted Binary</text>

      <line x1="98" y1="32" x2="98" y2="46" stroke="#0F766E" stroke-width="1.4" marker-end="url(#is-arr-teal)"/>
      <text x="104" y="42" font-size="7" font-family="ui-monospace, monospace" fill="#0F766E">Linear Bounds</text>

      <!-- Wasm VM SFI -->
      <rect y="48" width="196" height="36" rx="2" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.2"/>
      <text x="98" y="64" text-anchor="middle" font-size="8" font-weight="700" fill="#0F766E">Wasm SFI Engine (Wasmtime)</text>
      <text x="98" y="76" text-anchor="middle" font-size="7" font-family="ui-monospace, monospace" fill="#475569">Capability-Based Sandbox</text>

      <line x1="98" y1="84" x2="98" y2="96" stroke="#0F766E" stroke-width="1.2" marker-end="url(#is-arr-teal)"/>
      <text x="104" y="93" font-size="7" font-family="ui-monospace, monospace" fill="#0F766E">WASI Imports</text>

      <!-- Host Linux Kernel -->
      <rect y="98" width="196" height="32" rx="2" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
      <text x="98" y="114" text-anchor="middle" font-size="8" font-weight="700" fill="#0F172A">Host Operating System</text>
      <text x="98" y="124" text-anchor="middle" font-size="7" font-family="ui-monospace, monospace" fill="#475569">Standard Host Process</text>

      <line x1="98" y1="130" x2="98" y2="140" stroke="#475569" stroke-width="1.2" marker-end="url(#is-arr-slate)"/>

      <!-- Bare Metal Hardware -->
      <rect y="142" width="196" height="28" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
      <text x="98" y="160" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#334155">Bare-Metal Hardware</text>
    </g>

    <!-- Formal Systems Metrics -->
    <g transform="translate(14, 218)">
      <rect width="196" height="110" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#475569">CONTAINMENT BOUNDARY:</text>
        <text x="0" y="12" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">Memory-Bounds SFI Array</text>

        <text x="0" y="28" font-size="7.5" font-weight="700" fill="#475569">COLD BOOT (T_boot):</text>
        <text x="0" y="40" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">&lt; 5 ms (Ultra-Fast)</text>

        <text x="0" y="56" font-size="7.5" font-weight="700" fill="#475569">POSIX COMPATIBILITY:</text>
        <text x="0" y="68" font-size="8" font-family="ui-monospace, monospace" fill="#991B1B">Low (Requires Wasm compilation)</text>

        <text x="0" y="86" font-size="7" font-weight="700" fill="#92400E">VERDICT: Incompatible with C/Bash</text>
      </g>
    </g>
  </g>

  <!-- Column 4: Hardware MicroVMs (Firecracker / E2B) -->
  <g transform="translate(784, 62)">
    <rect width="216" height="340" rx="3" fill="#FFFFFF" stroke="#581C87" stroke-width="1.5"/>
    <rect width="216" height="28" rx="3" fill="#581C87" stroke="#581C87" stroke-width="1.5"/>
    <text x="108" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">4. Hardware MicroVM (Firecracker)</text>

    <!-- Microarchitecture Layers -->
    <g transform="translate(10, 38)">
      <rect width="196" height="32" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
      <text x="98" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#581C87">Untrusted Code + Full POSIX</text>

      <line x1="98" y1="32" x2="98" y2="44" stroke="#581C87" stroke-width="1.4" marker-end="url(#is-arr-amethyst)"/>

      <!-- Independent Guest Linux Kernel -->
      <rect y="46" width="196" height="32" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.4"/>
      <text x="98" y="62" text-anchor="middle" font-size="8" font-weight="700" fill="#581C87">Guest Linux Kernel (Ring 0)</text>
      <text x="98" y="73" text-anchor="middle" font-size="6.5" font-family="ui-monospace, monospace" fill="#475569">Independent VM Address Space</text>

      <line x1="98" y1="78" x2="98" y2="90" stroke="#581C87" stroke-width="1.4" marker-end="url(#is-arr-amethyst)"/>
      <text x="104" y="86" font-size="6.5" font-family="ui-monospace, monospace" font-weight="700" fill="#581C87">Intel VT-x / EPT Traps</text>

      <!-- KVM Hypervisor Boundary -->
      <rect y="92" width="196" height="36" rx="2" fill="#581C87" stroke="#581C87" stroke-width="1.4"/>
      <text x="98" y="108" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">KVM Hypervisor (Ring -1)</text>
      <text x="98" y="120" text-anchor="middle" font-size="7" font-family="ui-monospace, monospace" fill="#FAF5FF">~35 Minimal KVM ioctl Calls</text>

      <line x1="98" y1="128" x2="98" y2="138" stroke="#334155" stroke-width="1.2" marker-end="url(#is-arr-slate)"/>

      <!-- Bare Metal Hardware -->
      <rect y="140" width="196" height="28" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
      <text x="98" y="158" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#334155">Bare-Metal Hardware (VT-x)</text>
    </g>

    <!-- Formal Systems Metrics -->
    <g transform="translate(10, 218)">
      <rect width="196" height="110" rx="2" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#581C87">CONTAINMENT BOUNDARY:</text>
        <text x="0" y="12" font-size="8" font-family="ui-monospace, monospace" fill="#581C87">Hardware Hypervisor (Ring -1)</text>

        <text x="0" y="28" font-size="7.5" font-weight="700" fill="#581C87">COLD BOOT (T_boot):</text>
        <text x="0" y="40" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">&lt; 50 ms (Sub-50ms Agility)</text>

        <text x="0" y="56" font-size="7.5" font-weight="700" fill="#581C87">MEMORY FOOTPRINT:</text>
        <text x="0" y="68" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">~5 MB Base per Sandbox</text>

        <text x="0" y="86" font-size="7" font-weight="700" fill="#581C87">VERDICT: Production Agent Standard</text>
      </g>
    </g>
  </g>

  <!-- Bottom Principle Invariant -->
  <g transform="translate(40, 420)">
    <rect width="960" height="88" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <text x="0" y="0" font-size="9" font-weight="700" fill="#0F172A">THE HARDWARE-ENFORCED ISOLATION INVARIANT:</text>
      <text x="0" y="15" font-size="8.5" font-style="italic" fill="#334155">"Because autonomous agent loops execute untrusted stochastic code at scale, shared-kernel container boundaries are fundamentally unsafe.</text>
      <text x="0" y="27" font-size="8.5" font-style="italic" fill="#334155">Production agent architectures must enforce hardware-assisted Ring -1 hypervisor containment (Firecracker / KVM) combining sub-50 ms boot with full POSIX fidelity."</text>

      <!-- Key Comparative Metric Strip -->
      <g transform="translate(0, 42)">
        <text x="0" y="14" font-size="8" font-weight="700" fill="#475569">SUMMARY COMPARISON:</text>
        <text x="130" y="14" font-size="8" font-family="ui-monospace, monospace" fill="#991B1B">Docker: 450+ Syscalls (High Risk)</text>
        <text x="350" y="14" font-size="8" font-family="ui-monospace, monospace" fill="#92400E">gVisor: 15–35% I/O Tax</text>
        <text x="530" y="14" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">Wasm: Low POSIX</text>
        <text x="680" y="14" font-size="8" font-family="ui-monospace, monospace" font-weight="700" fill="#581C87">Firecracker: &lt;50ms, 5MB, Hardware Ring -1</text>
      </g>
    </g>
  </g>

</svg>
