<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-burgundy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-ochre" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#92400e"/>
    </marker>
    <marker id="arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-navy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="450" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- 4 COMPARATIVE ARCHITECTURAL STACKS (w=216, gap=16, total width=912)       -->
  <!-- ========================================================================= -->

  <!-- ========================================================================= -->
  <!-- COLUMN 1: SHARED-KERNEL CONTAINERS (x=24)                                 -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 20)">
    <rect width="216" height="410" rx="4" fill="#f8fafc" stroke="#991b1b" stroke-width="1.5"/>
    <rect width="216" height="28" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="108" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">OS CONTAINERS (runC)</text>

    <!-- Stack Pane -->
    <g transform="translate(10, 36)">
      <!-- Layer 1: App -->
      <rect width="196" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Untrusted Agent Process</text>
      <text x="98" y="30" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">Ring 3 (Host User Space)</text>

      <!-- Syscall Flow -->
      <line x1="98" y1="40" x2="98" y2="58" stroke="#991b1b" stroke-width="1.4" marker-end="url(#arr-burgundy)"/>
      <text x="104" y="52" font-size="6.5" font-family="monospace" font-weight="700" fill="#991b1b">450+ syscalls</text>

      <!-- Layer 2: Namespaces & cgroups -->
      <rect y="60" width="196" height="42" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="98" y="76" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">Linux Namespaces &amp; cgroups</text>
      <text x="98" y="90" text-anchor="middle" font-size="6.8" fill="#7f1d1d">Logical labels • Shared kernel tables</text>

      <!-- Transition to Ring 0 -->
      <line x1="98" y1="102" x2="98" y2="120" stroke="#991b1b" stroke-width="1.4" marker-end="url(#arr-burgundy)"/>
      <text x="104" y="114" font-size="6.5" font-family="monospace" font-weight="700" fill="#991b1b">syscall trap</text>

      <!-- Layer 3: Shared Host Kernel -->
      <rect y="122" width="196" height="54" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
      <text x="98" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Shared Host Kernel (Ring 0)</text>
      <text x="98" y="153" text-anchor="middle" font-size="7" fill="#7f1d1d">Single kernel memory address space</text>
      <text x="98" y="165" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#991b1b">CR3 points to host page tables</text>

      <!-- Hardware Layer -->
      <line x1="98" y1="176" x2="98" y2="192" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <rect y="194" width="196" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">Physical CPU &amp; Host DRAM</text>
      <text x="98" y="221" text-anchor="middle" font-size="6.8" fill="#64748b">Shared page cache &amp; MMU</text>
    </g>

    <!-- Systems Characteristics Footer -->
    <g transform="translate(10, 276)">
      <rect width="196" height="124" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(8, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#1e293b">Isolation Properties:</text>

        <text x="0" y="16" font-size="7" font-weight="600" fill="#475569">Boundary:</text>
        <text x="65" y="16" font-size="7" fill="#991b1b">Process-level (Soft)</text>

        <text x="0" y="30" font-size="7" font-weight="600" fill="#475569">Host Syscalls:</text>
        <text x="65" y="30" font-size="7" font-family="monospace" fill="#991b1b">≈ 450 (Full kernel)</text>

        <text x="0" y="44" font-size="7" font-weight="600" fill="#475569">Boot Latency:</text>
        <text x="65" y="44" font-size="7" font-family="monospace" fill="#1e293b">150 – 400 ms</text>

        <text x="0" y="58" font-size="7" font-weight="600" fill="#475569">Failure Mode:</text>
        <text x="65" y="58" font-size="7" fill="#991b1b">Kernel CVE → Host Root</text>

        <rect y="68" width="180" height="24" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="90" y="80" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">HIGH VULNERABILITY</text>
        <text x="90" y="90" font-size="6.5" fill="#7f1d1d" text-anchor="middle">Zero isolation against kernel zero-days</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: USERSPACE KERNELS (gVisor) (x=256)                               -->
  <!-- ========================================================================= -->
  <g transform="translate(256, 20)">
    <rect width="216" height="410" rx="4" fill="#f8fafc" stroke="#92400e" stroke-width="1.5"/>
    <rect width="216" height="28" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <text x="108" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">USERSPACE KERNEL (gVisor)</text>

    <!-- Stack Pane -->
    <g transform="translate(10, 36)">
      <!-- Layer 1: App -->
      <rect width="196" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Untrusted Agent Process</text>
      <text x="98" y="30" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">Ring 3 (Application)</text>

      <!-- Interception Flow -->
      <line x1="98" y1="40" x2="98" y2="58" stroke="#92400e" stroke-width="1.4" marker-end="url(#arr-ochre)"/>
      <text x="104" y="52" font-size="6.5" font-family="monospace" font-weight="700" fill="#92400e">ptrace / KVM trap</text>

      <!-- Layer 2: gVisor Sentry -->
      <rect y="60" width="196" height="42" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      <text x="98" y="76" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">gVisor Sentry (Go Engine)</text>
      <text x="98" y="88" text-anchor="middle" font-size="6.8" fill="#78350f">Emulates 300+ Linux syscalls in Ring 3</text>

      <!-- Syscall Filter Flow -->
      <line x1="98" y1="102" x2="98" y2="120" stroke="#92400e" stroke-width="1.4" marker-end="url(#arr-ochre)"/>
      <text x="104" y="114" font-size="6.5" font-family="monospace" font-weight="700" fill="#92400e">~50 host syscalls</text>

      <!-- Layer 3: Host Kernel Filtered -->
      <rect y="122" width="196" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">Host Kernel (seccomp-bpf)</text>
      <text x="98" y="153" text-anchor="middle" font-size="7" fill="#475569">Restricted syscall surface filter</text>
      <text x="98" y="165" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#0f766e">Ring 0 shielded from untrusted code</text>

      <!-- Hardware Layer -->
      <line x1="98" y1="176" x2="98" y2="192" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <rect y="194" width="196" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">Physical CPU &amp; Host DRAM</text>
      <text x="98" y="221" text-anchor="middle" font-size="6.8" fill="#64748b">Mediated by Go runtime</text>
    </g>

    <!-- Systems Characteristics Footer -->
    <g transform="translate(10, 276)">
      <rect width="196" height="124" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(8, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#1e293b">Isolation Properties:</text>

        <text x="0" y="16" font-size="7" font-weight="600" fill="#475569">Boundary:</text>
        <text x="65" y="16" font-size="7" fill="#92400e">Userspace Kernel Proxy</text>

        <text x="0" y="30" font-size="7" font-weight="600" fill="#475569">Host Syscalls:</text>
        <text x="65" y="30" font-size="7" font-family="monospace" fill="#92400e">≈ 50 safe calls</text>

        <text x="0" y="44" font-size="7" font-weight="600" fill="#475569">Boot Latency:</text>
        <text x="65" y="44" font-size="7" font-family="monospace" fill="#1e293b">15 – 35 ms</text>

        <text x="0" y="58" font-size="7" font-weight="600" fill="#475569">I/O Overhead:</text>
        <text x="65" y="58" font-size="7" fill="#92400e">15% – 35% VFS Penalty</text>

        <rect y="68" width="180" height="24" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
        <text x="90" y="80" font-size="7" font-weight="700" fill="#92400e" text-anchor="middle">GOOD CONTAINMENT</text>
        <text x="90" y="90" font-size="6.5" fill="#78350f" text-anchor="middle">High context-switch tax on compilation</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: SOFTWARE FAULT ISOLATION (Wasm/Wasmtime) (x=488)                -->
  <!-- ========================================================================= -->
  <g transform="translate(488, 20)">
    <rect width="216" height="410" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="216" height="28" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="108" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#0f766e">SOFTWARE FAULT ISOLATION (Wasm)</text>

    <!-- Stack Pane -->
    <g transform="translate(10, 36)">
      <!-- Layer 1: App -->
      <rect width="196" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Wasm Module (Sandboxed)</text>
      <text x="98" y="30" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">4 GiB linear memory space</text>

      <!-- Bounds Check Flow -->
      <line x1="98" y1="40" x2="98" y2="58" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arr-teal)"/>
      <text x="104" y="52" font-size="6.5" font-family="monospace" font-weight="700" fill="#0f766e">Linear bounds check</text>

      <!-- Layer 2: Wasm SFI Engine -->
      <rect y="60" width="196" height="42" rx="2" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
      <text x="98" y="76" text-anchor="middle" font-size="8" font-weight="700" fill="#0f766e">Wasm Engine (Wasmtime)</text>
      <text x="98" y="88" text-anchor="middle" font-size="6.8" fill="#134e4a">PROT_NONE guard pages • SIGSEGV trap</text>

      <!-- WASI Flow -->
      <line x1="98" y1="102" x2="98" y2="120" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arr-teal)"/>
      <text x="104" y="114" font-size="6.5" font-family="monospace" font-weight="700" fill="#0f766e">WASI capability imports</text>

      <!-- Layer 3: Host OS -->
      <rect y="122" width="196" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">Host OS (Standard Process)</text>
      <text x="98" y="153" text-anchor="middle" font-size="7" fill="#475569">Explicit file descriptor capability passing</text>
      <text x="98" y="165" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#0f766e">Zero ambient syscalls</text>

      <!-- Hardware Layer -->
      <line x1="98" y1="176" x2="98" y2="192" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <rect y="194" width="196" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">Physical CPU &amp; Host DRAM</text>
      <text x="98" y="221" text-anchor="middle" font-size="6.8" fill="#64748b">MMU hardware guard pages</text>
    </g>

    <!-- Systems Characteristics Footer -->
    <g transform="translate(10, 276)">
      <rect width="196" height="124" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(8, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#1e293b">Isolation Properties:</text>

        <text x="0" y="16" font-size="7" font-weight="600" fill="#475569">Boundary:</text>
        <text x="65" y="16" font-size="7" fill="#0f766e">Linear Memory SFI</text>

        <text x="0" y="30" font-size="7" font-weight="600" fill="#475569">Host Syscalls:</text>
        <text x="65" y="30" font-size="7" font-family="monospace" fill="#0f766e">0 (Explicit WASI)</text>

        <text x="0" y="44" font-size="7" font-weight="600" fill="#475569">Boot Latency:</text>
        <text x="65" y="44" font-size="7" font-family="monospace" fill="#1e293b">&lt; 1 ms (Ultra-fast)</text>

        <text x="0" y="58" font-size="7" font-weight="600" fill="#475569">Compatibility:</text>
        <text x="65" y="58" font-size="7" fill="#92400e">Low POSIX / No C FFI</text>

        <rect y="68" width="180" height="24" rx="2" fill="#ccfbf1" stroke="#99f6e4" stroke-width="0.8"/>
        <text x="90" y="80" font-size="7" font-weight="700" fill="#0f766e" text-anchor="middle">LIGHTWEIGHT SANDBOX</text>
        <text x="90" y="90" font-size="6.5" fill="#134e4a" text-anchor="middle">Ideal for pure algorithms; lacks full POSIX</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 4: HARDWARE MICROVM (Firecracker/KVM) (x=720)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(720, 20)">
    <rect width="216" height="410" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <rect width="216" height="28" rx="4" fill="#1e293b" stroke="#1e293b" stroke-width="1.8"/>
    <text x="108" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">HARDWARE MICROVM (Firecracker)</text>

    <!-- Stack Pane -->
    <g transform="translate(10, 36)">
      <!-- Layer 1: App -->
      <rect width="196" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Untrusted Code + Full POSIX</text>
      <text x="98" y="30" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">VMX Non-Root (Guest Ring 3)</text>

      <!-- Guest Syscall Flow -->
      <line x1="98" y1="40" x2="98" y2="58" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr-navy)"/>
      <text x="104" y="52" font-size="6.5" font-family="monospace" font-weight="700" fill="#1e293b">Guest syscall</text>

      <!-- Layer 2: Independent Guest Kernel -->
      <rect y="60" width="196" height="42" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="98" y="76" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">Guest Linux Kernel (Ring 0)</text>
      <text x="98" y="88" text-anchor="middle" font-size="6.8" fill="#475569">Independent VM address space (GVA → GPA)</text>

      <!-- Hardware VM-Exit Flow -->
      <line x1="98" y1="102" x2="98" y2="120" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr-navy)"/>
      <text x="104" y="114" font-size="6.5" font-family="monospace" font-weight="700" fill="#0f766e">VM-Exit / EPT Trap</text>

      <!-- Layer 3: KVM Hypervisor -->
      <rect y="122" width="196" height="54" rx="3" fill="#1e293b" stroke="#1e293b" stroke-width="1.3"/>
      <text x="98" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">KVM Hypervisor (VMX Root)</text>
      <text x="98" y="153" text-anchor="middle" font-size="7" fill="#cbd5e1">Two-dimensional EPT (GPA → HPA)</text>
      <text x="98" y="165" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#93c5fd">≈ 35 minimal KVM ioctls</text>

      <!-- Hardware Layer -->
      <line x1="98" y1="176" x2="98" y2="192" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <rect y="194" width="196" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">Bare-Metal Hardware (VT-x)</text>
      <text x="98" y="221" text-anchor="middle" font-size="6.8" fill="#64748b">Hardware-enforced CPU VMCS state</text>
    </g>

    <!-- Systems Characteristics Footer -->
    <g transform="translate(10, 276)">
      <rect width="196" height="124" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(8, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#1e293b">Isolation Properties:</text>

        <text x="0" y="16" font-size="7" font-weight="600" fill="#475569">Boundary:</text>
        <text x="65" y="16" font-size="7" fill="#1e293b">Hardware Hypervisor</text>

        <text x="0" y="30" font-size="7" font-weight="600" fill="#475569">Host Syscalls:</text>
        <text x="65" y="30" font-size="7" font-family="monospace" fill="#0f766e">≈ 35 ioctl interfaces</text>

        <text x="0" y="44" font-size="7" font-weight="600" fill="#475569">Boot Latency:</text>
        <text x="65" y="44" font-size="7" font-family="monospace" fill="#1e293b">&lt; 15 ms (MicroVM)</text>

        <text x="0" y="58" font-size="7" font-weight="600" fill="#475569">Compatibility:</text>
        <text x="65" y="58" font-size="7" fill="#0f766e">100% Native Linux POSIX</text>

        <rect y="68" width="180" height="24" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="90" y="80" font-size="7" font-weight="700" fill="#166534" text-anchor="middle">PRODUCTION AGENT STANDARD</text>
        <text x="90" y="90" font-size="6.5" fill="#15803d" text-anchor="middle">Full POSIX fidelity + hardware traps</text>
      </g>
    </g>
  </g>
</svg>
