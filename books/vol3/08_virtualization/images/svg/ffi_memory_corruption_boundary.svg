<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .header-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .card-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; }
      .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .node-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; fill: #64748b; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #1e293b; }
      .danger-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #b91c1c; }
      .footer-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #b91c1c; text-transform: uppercase; letter-spacing: 0.5px; }
      .footer-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #0f172a; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.8; fill: none; stroke-dasharray: 4,4; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(35, 25)">
    <text x="0" y="20" class="header-title">The Foreign Function Interface (FFI) Memory Boundary Collapse</text>
    <text x="0" y="38" class="header-sub">How native C/C++ libraries bypass Python object sandboxing and grant arbitrary host access</text>
  </g>

  <!-- LEFT: Process Address Space -->
  <g transform="translate(35, 80)">
    <rect width="660" height="325" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 652 0 Q 660 0 660 8 L 660 36 L 0 36 Z" fill="#f1f5f9" />
    
    <text x="16" y="24" class="card-title" fill="#334155">Host Agent Process Virtual Address Space (User Ring 3)</text>
    <text x="644" y="24" class="card-subtitle" fill="#64748b" text-anchor="end">Single Process Boundary (PID: 2841)</text>

    <!-- Sub-Box 1: Python VM -->
    <g transform="translate(20, 50)">
      <rect width="295" height="115" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" />
      <text x="14" y="22" class="node-text" fill="#1e40af">Python Virtual Machine (Scoped)</text>
      <text x="14" y="44" class="node-desc">• Restricted Globals (__builtins__ restricted)</text>
      <text x="14" y="64" class="node-desc">• AST Whitelist (Disallow eval, exec, import)</text>
      <text x="14" y="84" class="node-desc">• Isolated Frame Evaluation</text>
      <text x="14" y="104" class="danger-text">Apparent Safety (Language Object Model)</text>
    </g>

    <!-- Sub-Box 2: Native Extensions -->
    <g transform="translate(345, 50)">
      <rect width="295" height="115" rx="6" fill="#fef2f2" stroke="#fecdd3" stroke-width="1.2" />
      <text x="14" y="22" class="node-text" fill="#991b1b">Native C/C++ Extensions (FFI)</text>
      <text x="14" y="44" class="node-desc">• NumPy (C BLAS / LAPACK pointer offsets)</text>
      <text x="14" y="64" class="node-desc">• Pillow / libpng (Image parsing heap buffers)</text>
      <text x="14" y="84" class="node-desc">• PyTorch / CUDA (Native tensor mallocs)</text>
      <text x="14" y="104" class="danger-text">Zero Memory Safety (Raw C Pointer Access)</text>
    </g>

    <!-- FFI arrow -->
    <line x1="315" y1="105" x2="343" y2="105" class="arrow" />

    <!-- Sub-Box 3: Shared Process Heap & Stack -->
    <g transform="translate(20, 185)">
      <rect width="620" height="120" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.2" />
      <text x="16" y="22" class="card-title" fill="#991b1b">Shared Physical Heap, BSS &amp; Thread Stack</text>

      <!-- Memory slots -->
      <g transform="translate(16, 36)">
        <rect x="0" y="0" width="180" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="90" y="18" class="code-text" text-anchor="middle">PyTypeObject</text>
        <text x="90" y="32" class="danger-text" text-anchor="middle">Vtable Overwrite</text>

        <rect x="200" y="0" width="180" height="42" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
        <text x="290" y="18" class="code-text" text-anchor="middle">Heap Buffer</text>
        <text x="290" y="32" class="danger-text" text-anchor="middle">Buffer Overflow</text>

        <rect x="400" y="0" width="188" height="42" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
        <text x="494" y="18" class="code-text" text-anchor="middle">Process Environ</text>
        <text x="494" y="32" class="danger-text" text-anchor="middle">AWS_SECRET_KEY Leaked</text>
      </g>
      
      <text x="16" y="105" class="node-desc" fill="#7f1d1d">Exploiting a buffer overflow in Pillow/NumPy overwrites adjacent memory pages, hijacking execution flow.</text>
    </g>
  </g>

  <!-- RIGHT: Host Kernel & Exploitation -->
  <g transform="translate(725, 80)">
    <rect width="320" height="325" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 312 0 Q 320 0 320 8 L 320 36 L 0 36 Z" fill="#fee2e2" />
    
    <text x="16" y="24" class="card-title" fill="#991b1b">Shared Host Kernel (Ring 0)</text>

    <g transform="translate(16, 52)">
      <rect width="288" height="68" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="22" class="node-text" fill="#0f172a">Ambient Authority (euid=1000)</text>
      <text x="12" y="42" class="node-desc">• Inherits host user file access</text>
      <text x="12" y="58" class="node-desc">• Full socket creation rights</text>
    </g>

    <g transform="translate(16, 134)">
      <rect width="288" height="78" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
      <text x="12" y="22" class="danger-text">Direct Syscall Invocation</text>
      <text x="12" y="42" class="code-text">• execve("/bin/sh")</text>
      <text x="12" y="58" class="code-text">• sendto(exfil_ip, stolen_keys)</text>
      <text x="12" y="74" class="code-text">• unlinkat("/workspace/...")</text>
    </g>

    <g transform="translate(16, 226)">
      <rect width="288" height="82" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" />
      <text x="12" y="20" class="node-text" fill="#9f1239">System Consequence:</text>
      <text x="12" y="38" class="node-desc" fill="#881337">Language sandboxes collapse.</text>
      <text x="12" y="56" class="node-desc" fill="#881337">Adversary achieves Arbitrary Code</text>
      <text x="12" y="72" class="node-desc" fill="#881337">Execution (ACE) with host authority.</text>
    </g>
  </g>

  <!-- Connectors -->
  <line x1="695" y1="245" x2="723" y2="245" class="arrow-red" />

  <!-- Bottom Principle Box -->
  <g transform="translate(35, 422)">
    <rect width="1010" height="58" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2" />
    <text x="20" y="25" class="footer-label">Saltzer-Schroeder Principle of Complete Mediation</text>
    <text x="20" y="44" class="footer-desc">In-process language sandboxes cannot contain native compiled code; execution safety requires OS-level and hardware hypervisor isolation.</text>
  </g>
</svg>
