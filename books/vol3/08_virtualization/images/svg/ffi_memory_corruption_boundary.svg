<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- LEFT: HOST PROCESS VIRTUAL ADDRESS SPACE (USER RING 3: x=24 to 670)   -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 20)">
    <rect width="646" height="420" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect width="646" height="28" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="14" y="19" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">PROCESS VIRTUAL ADDRESS SPACE (USER RING 3)</text>
    <text x="632" y="19" font-family="monospace" font-size="8" font-weight="600" fill="#475569" text-anchor="end">PID: 2841 • euid: 1000 • 64-bit VMA</text>

    <!-- Sub-Pane 1: Python Virtual Machine Sandbox (Left: x=14, w=200) -->
    <g transform="translate(14, 38)">
      <rect width="194" height="152" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="194" height="22" rx="3" fill="#f1f5f9"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Python Interpreter (CPython)</text>

      <g transform="translate(8, 28)">
        <rect width="178" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="600" fill="#334155">Bytecode Evaluation Loop</text>
        <text x="6" y="22" font-family="monospace" font-size="7" fill="#64748b">ceval.c • PyEval_EvalFrame</text>

        <rect y="32" width="178" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="44" font-size="7.5" font-weight="600" fill="#334155">AST Security Policy</text>
        <text x="6" y="54" font-family="monospace" font-size="7" fill="#64748b">Restricted __builtins__</text>

        <rect y="64" width="178" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="76" font-size="7.5" font-weight="600" fill="#334155">Object Model Isolation</text>
        <text x="6" y="86" font-family="monospace" font-size="7" fill="#64748b">PyObject refcount &amp; types</text>

        <rect y="96" width="178" height="20" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="89" y="110" font-size="7.5" font-weight="600" fill="#166534" text-anchor="middle">Apparent Object Safety</text>
      </g>
    </g>

    <!-- Sub-Pane 2: FFI Interface Boundary (Middle: x=218, w=150) -->
    <g transform="translate(218, 38)">
      <rect width="144" height="152" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="144" height="22" rx="3" fill="#f1f5f9"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#92400e">FFI Bridge (dlopen)</text>

      <g transform="translate(8, 28)">
        <rect width="128" height="26" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="600" fill="#92400e">Native C Extensions</text>
        <text x="6" y="22" font-family="monospace" font-size="7" fill="#78350f">NumPy, Pillow, libvips</text>

        <rect y="32" width="128" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="44" font-size="7.5" font-weight="600" fill="#334155">Direct C Invocation</text>
        <text x="6" y="54" font-family="monospace" font-size="7" fill="#475569">PyArg_ParseTuple()</text>
        <text x="6" y="63" font-family="monospace" font-size="7" fill="#475569">Raw pointer passing</text>

        <rect y="72" width="128" height="44" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="64" y="86" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Unsafe Native C Code</text>
        <text x="64" y="98" font-size="7" fill="#7f1d1d" text-anchor="middle">No memory bounds check</text>
        <text x="64" y="108" font-size="7" fill="#7f1d1d" text-anchor="middle">Direct raw memory pointers</text>
      </g>
    </g>

    <!-- FFI Dispatch Arrow -->
    <line x1="208" y1="110" x2="216" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>

    <!-- Sub-Pane 3: Stevens-Style Process Address Space Map (Right: x=372, w=260) -->
    <g transform="translate(372, 38)">
      <rect width="260" height="368" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="260" height="22" rx="3" fill="#f1f5f9"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Process Address Space Layout</text>
      <text x="252" y="15" font-family="monospace" font-size="7" fill="#64748b" text-anchor="end">0x7FFF_FFFF_FFFF</text>

      <!-- Segment Stack -->
      <g transform="translate(8, 28)">
        <!-- Stack Frame -->
        <rect y="0" width="244" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#1e293b">Thread Call Stack (↓ grows down)</text>
        <text x="8" y="26" font-family="monospace" font-size="7" fill="#475569">Saved Frame Pointer %rbp | Return Addr %rip</text>
        <text x="236" y="26" font-family="monospace" font-size="7" fill="#64748b" text-anchor="end">%rsp</text>

        <!-- Guard Page / Hole -->
        <rect y="42" width="244" height="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 2"/>
        <text x="122" y="52" font-size="6.5" fill="#64748b" text-anchor="middle">Unmapped Virtual Memory Space</text>

        <!-- Shared Libraries & Mappings -->
        <rect y="60" width="244" height="32" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="73" font-size="7.5" font-weight="700" fill="#1e293b">Memory Mapping Segment (mmap)</text>
        <text x="8" y="85" font-family="monospace" font-size="7" fill="#475569">libpillow.so • libnumpy.so • libc.so.6</text>

        <!-- Native C Heap -->
        <rect y="96" width="244" height="48" rx="2" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
        <text x="8" y="110" font-size="7.5" font-weight="700" fill="#991b1b">Native C Heap (malloc / libpng buffer)</text>
        <text x="8" y="122" font-family="monospace" font-size="7" fill="#b91c1c">char buf[1024] → Heap Buffer Overflow</text>
        <text x="8" y="135" font-size="7" font-weight="600" fill="#dc2626">Overwrites adjacent physical heap frames!</text>

        <!-- Managed Python Heap -->
        <rect y="148" width="244" height="52" rx="2" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
        <text x="8" y="162" font-size="7.5" font-weight="700" fill="#991b1b">CPython Managed Heap (Corrupted)</text>
        <text x="8" y="174" font-family="monospace" font-size="7" fill="#991b1b">PyTypeObject vtable: tp_call overwritten</text>
        <text x="8" y="186" font-family="monospace" font-size="7" fill="#991b1b">Function pointer hijacked to shellcode</text>

        <!-- Process Environment -->
        <rect y="204" width="244" height="42" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="8" y="217" font-size="7.5" font-weight="700" fill="#991b1b">Process Environment Block (environ)</text>
        <text x="8" y="229" font-family="monospace" font-size="7" fill="#7f1d1d">AWS_SECRET_ACCESS_KEY, DB_PASS, API_KEY</text>
        <text x="8" y="239" font-size="7" fill="#b91c1c">Directly readable via arbitrary memory read</text>

        <!-- BSS & Data -->
        <rect y="250" width="244" height="28" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="262" font-size="7.5" font-weight="700" fill="#1e293b">BSS &amp; Initialized Data Segments</text>
        <text x="8" y="272" font-family="monospace" font-size="7" fill="#475569">Global function pointers • PLT / GOT tables</text>

        <!-- Text Segment -->
        <rect y="282" width="244" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="295" font-size="7.5" font-weight="700" fill="#1e293b">Text Segment (.text)</text>
        <text x="8" y="307" font-family="monospace" font-size="7" fill="#475569">Executable machine instructions (RX)</text>
        <text x="236" y="307" font-family="monospace" font-size="7" fill="#64748b" text-anchor="end">0x0040_0000</text>
      </g>
    </g>

    <!-- Sub-Pane 4: Exploit Mechanics Walkthrough (Bottom-Left: x=14, w=348) -->
    <g transform="translate(14, 198)">
      <rect width="348" height="208" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="348" height="22" rx="3" fill="#f1f5f9"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#1e293b">In-Process Sandboxing Collapse Mechanics</text>

      <g transform="translate(8, 28)">
        <text x="0" y="12" font-size="7.5" font-weight="700" fill="#0f172a">Shared Flat Address Space:</text>
        <text x="12" y="24" font-size="7.2" fill="#475569">Python bytecode and native C libraries execute inside the identical VMA.</text>
        <text x="12" y="35" font-size="7.2" fill="#475569">No hardware MMU protection exists between Python objects and C pointers.</text>

        <text x="0" y="52" font-size="7.5" font-weight="700" fill="#991b1b">Heap Corruption via Unsafe C Code:</text>
        <text x="12" y="64" font-size="7.2" fill="#475569">Model triggers buffer overflow in libpng/NumPy via crafted input data.</text>
        <text x="12" y="75" font-size="7.2" fill="#475569">Out-of-bounds write overwrites adjacent PyTypeObject vtable in heap.</text>

        <text x="0" y="92" font-size="7.5" font-weight="700" fill="#991b1b">Arbitrary Code Execution (ACE):</text>
        <text x="12" y="104" font-size="7.2" fill="#475569">Next invocation of object method jumps to attacker-controlled shellcode.</text>
        <text x="12" y="115" font-size="7.2" fill="#475569">Attacker completely escapes Python language interpreter sandbox.</text>

        <text x="0" y="132" font-size="7.5" font-weight="700" fill="#1e293b">Direct Transition to Host Kernel:</text>
        <text x="12" y="144" font-size="7.2" fill="#475569">Shellcode invokes syscall directly, inheriting host process UID/GID.</text>

        <rect y="154" width="332" height="20" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="166" y="168" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Language Sandboxing Cannot Survive Unsafe FFI Code</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector: Virtual Space to Kernel (Ring 3 to Ring 0) -->
  <line x1="670" y1="200" x2="688" y2="200" stroke="#991b1b" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arr-burgundy)"/>
  <rect x="671" y="190" width="18" height="18" rx="2" fill="#ffffff" stroke="#f87171" stroke-width="0.8"/>
  <text x="680" y="202" font-family="monospace" font-size="6.5" font-weight="700" fill="#991b1b" text-anchor="middle">LPE</text>

  <!-- ===================================================================== -->
  <!-- RIGHT: SHARED HOST LINUX KERNEL (RING 0: x=690 to 936)                -->
  <!-- ===================================================================== -->
  <g transform="translate(690, 20)">
    <rect width="246" height="420" rx="4" fill="#f8fafc" stroke="#991b1b" stroke-width="1.5"/>
    <rect width="246" height="28" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="123" y="19" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle" letter-spacing="0.5">HOST KERNEL (RING 0)</text>

    <!-- Block 1: Ambient Authority Credentials -->
    <g transform="translate(12, 38)">
      <rect width="222" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="222" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Ambient Identity (euid = 1000)</text>
      <text x="8" y="32" font-size="7.5" fill="#475569">• Full access to host user home dir</text>
      <text x="8" y="44" font-size="7.5" fill="#475569">Inherits open file descriptors</text>
      <text x="8" y="56" font-size="7.5" fill="#475569">Permitted outbound network sockets</text>
      <text x="8" y="68" font-family="monospace" font-size="7" fill="#991b1b">Zero privilege separation at kernel</text>
    </g>

    <!-- Block 2: Direct Syscall Exploitation -->
    <g transform="translate(12, 120)">
      <rect width="222" height="136" rx="3" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
      <rect width="222" height="20" rx="3" fill="#fee2e2"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#991b1b">Direct Syscall Execution</text>

      <g transform="translate(8, 28)">
        <rect width="206" height="28" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-family="monospace" font-size="7.5" font-weight="700" fill="#991b1b">sys_execve("/bin/sh")</text>
        <text x="6" y="22" font-size="7" fill="#7f1d1d">Spawns shell with user privileges</text>

        <rect y="34" width="206" height="28" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="46" font-family="monospace" font-size="7.5" font-weight="700" fill="#991b1b">sys_socket() + sys_connect()</text>
        <text x="6" y="56" font-size="7" fill="#7f1d1d">Exfiltrates secrets to remote C2</text>

        <rect y="68" width="206" height="28" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="80" font-family="monospace" font-size="7.5" font-weight="700" fill="#991b1b">sys_unlinkat("/repos/...")</text>
        <text x="6" y="90" font-size="7" fill="#7f1d1d">Deletes ground-truth repositories</text>
      </g>
    </g>

    <!-- Block 3: Architectural Takeaway -->
    <g transform="translate(12, 264)">
      <rect width="222" height="142" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#1e293b">Complete Mediation Requirement</text>
      <text x="8" y="32" font-size="7.5" fill="#475569">Saltzer &amp; Kaashoek tenet:</text>
      <text x="8" y="46" font-size="7.2" font-style="italic" fill="#334155">"An isolation mechanism must be</text>
      <text x="8" y="58" font-style="italic" font-size="7.2" fill="#334155">implemented by a layer lower</text>
      <text x="8" y="70" font-style="italic" font-size="7.2" fill="#334155">than the code it seeks to control."</text>
      <text x="8" y="90" font-size="7.5" fill="#475569">In-process sandboxes violate this.</text>
      <text x="8" y="104" font-size="7.5" fill="#475569">Containment requires hardware</text>
      <text x="8" y="116" font-size="7.5" fill="#475569">hypervisors (KVM) or eBPF.</text>
      <rect x="6" y="122" width="210" height="16" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="111" y="134" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">Hardware Isolation Mandatory</text>
    </g>
  </g>
</svg>
