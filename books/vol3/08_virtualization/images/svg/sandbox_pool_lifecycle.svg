<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-ochre" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#92400e"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- INFLOW: ASYNC COLD-BOOT INITIALIZATION (TOP LEFT)                         -->
  <!-- ========================================================================= -->
  <path d="M 180 10 V 38" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#arr-slate)"/>
  <rect x="90" y="8" width="180" height="18" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="180" y="20" font-family="monospace" font-size="7" font-weight="600" fill="#475569" text-anchor="middle">async_boot() template init</text>

  <!-- ========================================================================= -->
  <!-- STATE 1: WARM_STANDBY (TOP LEFT: x=40, y=40, w=280, h=130)                -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 40)">
    <rect width="280" height="130" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="280" height="26" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <circle cx="16" cy="13" r="7" fill="#0f766e"/>
    <text x="16" y="16.5" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="30" y="17" font-size="9" font-weight="700" fill="#0f766e">WARM_STANDBY</text>
    <text x="270" y="17" font-size="7.5" font-weight="600" fill="#0f766e" text-anchor="end">Ready / Suspended</text>

    <g transform="translate(12, 34)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#334155">vCPUs:</text>
      <text x="56" y="12" font-size="7.5" fill="#475569">Paused via ioctl(KVM_RUN) freeze</text>

      <text x="0" y="26" font-size="7.5" font-weight="700" fill="#334155">Memory:</text>
      <text x="56" y="26" font-size="7.5" fill="#475569">Pre-faulted DRAM / Golden snapshot</text>

      <text x="0" y="40" font-size="7.5" font-weight="700" fill="#334155">Network:</text>
      <text x="56" y="40" font-size="7.5" fill="#475569">TAP interface detached (0 net egress)</text>

      <text x="0" y="54" font-size="7.5" font-weight="700" fill="#334155">Storage:</text>
      <text x="56" y="54" font-size="7.5" fill="#475569">LowerDir rootfs mounted; UpperDir null</text>

      <rect y="64" width="256" height="22" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="128" y="78" font-size="7.2" font-weight="600" fill="#166534" text-anchor="middle">Zero CPU Consumption • O(1) Queue Pop</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- TRANSITION 1 -> 2: LEASE REQUEST                                          -->
  <!-- ========================================================================= -->
  <path d="M 320 100 H 638" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal)"/>
  <rect x="360" y="74" width="238" height="34" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1"/>
  <text x="479" y="87" font-size="7.5" font-weight="700" fill="#0f766e" text-anchor="middle">LeaseRequest [queue &gt; 0] / pop_ring_buffer()</text>
  <text x="479" y="99" font-family="monospace" font-size="6.8" fill="#475569" text-anchor="middle">mount_upper(tmpfs), bind_tap(netns), unpause_vcpu()</text>

  <!-- ========================================================================= -->
  <!-- STATE 2: LEASED (TOP RIGHT: x=640, y=40, w=280, h=130)                    -->
  <!-- ========================================================================= -->
  <g transform="translate(640, 40)">
    <rect width="280" height="130" rx="4" fill="#f8fafc" stroke="#166534" stroke-width="1.5"/>
    <rect width="280" height="26" rx="4" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <circle cx="16" cy="13" r="7" fill="#166534"/>
    <text x="16" y="16.5" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="30" y="17" font-size="9" font-weight="700" fill="#166534">LEASED</text>
    <text x="270" y="17" font-size="7.5" font-weight="600" fill="#166534" text-anchor="end">Active Tool Execution</text>

    <g transform="translate(12, 34)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#334155">Execution:</text>
      <text x="60" y="12" font-size="7.5" fill="#475569">vCPUs active; VSOCK payload streaming</text>

      <text x="0" y="26" font-size="7.5" font-weight="700" fill="#334155">Storage:</text>
      <text x="60" y="26" font-size="7.5" fill="#475569">UpperDir on volatile tmpfs (RW branch)</text>

      <text x="0" y="40" font-size="7.5" font-weight="700" fill="#334155">Network:</text>
      <text x="60" y="40" font-size="7.5" fill="#475569">Mediated egress via dedicated proxy IP</text>

      <text x="0" y="54" font-size="7.5" font-weight="700" fill="#334155">Boundary:</text>
      <text x="60" y="54" font-size="7.5" fill="#475569">Single-tenant lease with hard deadline T_exp</text>

      <rect y="64" width="256" height="22" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="128" y="78" font-size="7.2" font-weight="600" fill="#166534" text-anchor="middle">Complete Mediation • Acquisition Latency &lt; 5 ms</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- TRANSITION 2 -> 3: TOOL EXIT / TIMEOUT                                    -->
  <!-- ========================================================================= -->
  <path d="M 780 170 V 228" fill="none" stroke="#92400e" stroke-width="2" marker-end="url(#arr-ochre)"/>
  <rect x="670" y="186" width="220" height="30" rx="2" fill="#ffffff" stroke="#92400e" stroke-width="1"/>
  <text x="780" y="198" font-size="7.5" font-weight="700" fill="#92400e" text-anchor="middle">ToolExit ∨ Timeout [t ≥ T_expire] /</text>
  <text x="780" y="209" font-family="monospace" font-size="6.8" fill="#475569" text-anchor="middle">freeze_vcpu(), sever_tap(), trap_output()</text>

  <!-- ========================================================================= -->
  <!-- STATE 3: TAINTED (BOTTOM RIGHT: x=640, y=230, w=280, h=130)               -->
  <!-- ========================================================================= -->
  <g transform="translate(640, 230)">
    <rect width="280" height="130" rx="4" fill="#f8fafc" stroke="#92400e" stroke-width="1.5"/>
    <rect width="280" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="16" cy="13" r="7" fill="#92400e"/>
    <text x="16" y="16.5" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="30" y="17" font-size="9" font-weight="700" fill="#92400e">TAINTED</text>
    <text x="270" y="17" font-size="7.5" font-weight="600" fill="#92400e" text-anchor="end">Dirty / Quarantine</text>

    <g transform="translate(12, 34)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#334155">Status:</text>
      <text x="60" y="12" font-size="7.5" fill="#475569">Dirty DRAM pages; modified UpperDir diff</text>

      <text x="0" y="26" font-size="7.5" font-weight="700" fill="#334155">Containment:</text>
      <text x="60" y="26" font-size="7.5" fill="#475569">vCPUs frozen; TAP detached from host</text>

      <text x="0" y="40" font-size="7.5" font-weight="700" fill="#334155">Safety Gate:</text>
      <text x="60" y="40" font-size="7.5" fill="#991b1b">Forbidden from serving subsequent leases</text>

      <text x="0" y="54" font-size="7.5" font-weight="700" fill="#334155">Teardown:</text>
      <text x="60" y="54" font-size="7.5" fill="#475569">Queued for rollback scrub or destruction</text>

      <rect y="64" width="256" height="22" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="128" y="78" font-size="7.2" font-weight="600" fill="#92400e" text-anchor="middle">Quarantined • In-Place Reuse Strictly Prohibited</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- TRANSITION 3 -> 4: SCRUB INITIATION                                       -->
  <!-- ========================================================================= -->
  <path d="M 640 295 H 322" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
  <rect x="360" y="278" width="238" height="34" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="479" y="291" font-size="7.5" font-weight="700" fill="#1e293b" text-anchor="middle">ScrubCommand / unmount_overlay(UpperDir)</text>
  <text x="479" y="303" font-family="monospace" font-size="6.8" fill="#475569" text-anchor="middle">madvise(MADV_DONTNEED), reset_userfaultfd()</text>

  <!-- ========================================================================= -->
  <!-- STATE 4: RECLAIMING (BOTTOM LEFT: x=40, y=230, w=280, h=130)              -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 230)">
    <rect width="280" height="130" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect width="280" height="26" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="16" cy="13" r="7" fill="#334155"/>
    <text x="16" y="16.5" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="30" y="17" font-size="9" font-weight="700" fill="#1e293b">RECLAIMING</text>
    <text x="270" y="17" font-size="7.5" font-weight="600" fill="#475569" text-anchor="end">Scrub &amp; Audit</text>

    <g transform="translate(12, 34)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#334155">Storage Scrub:</text>
      <text x="70" y="12" font-size="7.5" fill="#475569">Unlink UpperDir tmpfs; restore lowerdir</text>

      <text x="0" y="26" font-size="7.5" font-weight="700" fill="#334155">Memory Scrub:</text>
      <text x="70" y="26" font-size="7.5" fill="#475569">MADV_DONTNEED / userfaultfd page re-zero</text>

      <text x="0" y="40" font-size="7.5" font-weight="700" fill="#334155">Integrity Audit:</text>
      <text x="70" y="40" font-size="7.5" fill="#475569">Cryptographic hash check of guest memory</text>

      <text x="0" y="54" font-size="7.5" font-weight="700" fill="#334155">Decision Gate:</text>
      <text x="70" y="54" font-size="7.5" fill="#0f766e">Clean → Standby | Mismatch/Fault → Destroy</text>

      <rect y="64" width="256" height="22" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="128" y="78" font-size="7.2" font-weight="600" fill="#334155" text-anchor="middle">Guaranteed Baseline Restoration or Disposal</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- TRANSITION 4 -> 1: ROLLBACK VERIFIED                                      -->
  <!-- ========================================================================= -->
  <path d="M 180 230 V 172" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal)"/>
  <rect x="70" y="186" width="220" height="30" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1"/>
  <text x="180" y="198" font-size="7.5" font-weight="700" fill="#0f766e" text-anchor="middle">AuditPassed [dirty_pages == 0] /</text>
  <text x="180" y="209" font-family="monospace" font-size="6.8" fill="#166534" text-anchor="middle">push_standby_queue(vm_id) (Latency &lt; 2ms)</text>

  <!-- ========================================================================= -->
  <!-- STATE 5: DESTROYED (TERMINAL STATE: CENTER BOTTOM: x=340, y=380, w=280)    -->
  <!-- ========================================================================= -->
  <g transform="translate(340, 380)">
    <!-- Double boundary for terminal state -->
    <rect width="280" height="70" rx="4" fill="#f8fafc" stroke="#991b1b" stroke-width="1.8"/>
    <rect x="3" y="3" width="274" height="64" rx="3" fill="#ffffff" stroke="#991b1b" stroke-width="0.8"/>
    <rect x="3" y="3" width="274" height="20" rx="3" fill="#fee2e2"/>
    <circle cx="16" cy="13" r="6" fill="#991b1b"/>
    <text x="16" y="16" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="28" y="16.5" font-size="8.5" font-weight="700" fill="#991b1b">DESTROYED (Terminal State)</text>
    <text x="268" y="16.5" font-size="7" font-weight="600" fill="#991b1b" text-anchor="end">Full Resource Reclaim</text>

    <g transform="translate(10, 28)">
      <text x="0" y="11" font-size="7.5" font-weight="700" fill="#334155">Action:</text>
      <text x="45" y="11" font-family="monospace" font-size="7.2" fill="#991b1b">SIGKILL VMM process; unmap KVM VMCS structures</text>

      <text x="0" y="25" font-size="7.5" font-weight="700" fill="#334155">Reclaim:</text>
      <text x="45" y="25" font-size="7.2" fill="#475569">Release DRAM frames to host kernel allocator; close FDs</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- TRANSITIONS TO DESTROYED                                                  -->
  <!-- ========================================================================= -->
  <!-- Transition from 4 (RECLAIMING) to 5 (DESTROYED) -->
  <path d="M 240 360 V 415 H 338" fill="none" stroke="#991b1b" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-burgundy)"/>
  <rect x="236" y="380" width="96" height="26" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="284" y="392" font-size="6.8" font-weight="700" fill="#991b1b" text-anchor="middle">AuditFailed ∨</text>
  <text x="284" y="401" font-family="monospace" font-size="6.5" fill="#7f1d1d" text-anchor="middle">ScrubTimeout</text>

  <!-- Transition from 3 (TAINTED) to 5 (DESTROYED) -->
  <path d="M 720 360 V 415 H 622" fill="none" stroke="#991b1b" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-burgundy)"/>
  <rect x="628" y="380" width="96" height="26" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="676" y="392" font-size="6.8" font-weight="700" fill="#991b1b" text-anchor="middle">HardTimeout ∨</text>
  <text x="676" y="401" font-family="monospace" font-size="6.5" fill="#7f1d1d" text-anchor="middle">KernelCrash</text>
</svg>
