<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>

    <!-- Filters for subtle card depth -->
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Top Title Block -->
  <g transform="translate(50, 32)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="-0.2">SANDBOX POOL LIFECYCLE STATE MACHINE</text>
    <text x="0" y="18" font-size="10.5" fill="#64748b">Pre-warmed instance leasing, ephemeral CoW containment, and verified memory rollback</text>
  </g>

  <!-- Inflow: Background Cold Provisioning -->
  <g transform="translate(210, 30)">
    <path d="M0,25 L0,58" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-slate)"/>
    <rect x="-85" y="24" width="170" height="18" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="36.5" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Async Cold-Boot Reserve</text>
  </g>

  <!-- ================================================================= -->
  <!-- 1. WARM_STANDBY CARD                                              -->
  <!-- ================================================================= -->
  <g transform="translate(60, 95)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="300" height="150" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="28" rx="6" fill="#f0f9ff"/>
    <path d="M0,28 L300,28" stroke="#bae6fd" stroke-width="1"/>
    
    <!-- State Badge -->
    <rect x="12" y="6" width="16" height="16" rx="8" fill="#0284c7"/>
    <text x="20" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">1</text>
    <text x="36" y="18" font-size="10.5" font-weight="700" fill="#0369a1">WARM_STANDBY</text>
    <text x="288" y="18" text-anchor="end" font-size="8.5" font-weight="600" fill="#0284c7">READY / IDLE</text>

    <!-- Content Items -->
    <text x="16" y="48" font-size="9" font-weight="700" fill="#334155">Memory:</text>
    <text x="80" y="48" font-size="9" fill="#475569">Suspended in DRAM / Golden snapshot cache</text>

    <text x="16" y="68" font-size="9" font-weight="700" fill="#334155">vCPUs:</text>
    <text x="80" y="68" font-size="9" fill="#475569">Paused via ioctl(KVM_RUN) freeze</text>

    <text x="16" y="88" font-size="9" font-weight="700" fill="#334155">Network:</text>
    <text x="80" y="88" font-size="9" fill="#475569">VirtIO-Net tap detached (zero egress routed)</text>

    <text x="16" y="108" font-size="9" font-weight="700" fill="#334155">Storage:</text>
    <text x="80" y="108" font-size="9" fill="#475569">Lowerdir rootfs bound; zero CoW upperdir</text>

    <rect x="12" y="122" width="276" height="18" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
    <text x="150" y="134.5" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Invariant: Zero mutable state • Zero CPU consumption</text>
  </g>

  <!-- ================================================================= -->
  <!-- TRANSITION: STANDBY -> LEASED                                      -->
  <!-- ================================================================= -->
  <g transform="translate(360, 150)">
    <path d="M10,20 L260,20" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
    <rect x="40" y="0" width="190" height="18" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="135" y="12.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">Lease Request (Tool Proposed)</text>
    <text x="135" y="32" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="8" fill="#0284c7">Acquisition Latency: &lt; 5 ms</text>
    <text x="135" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">Ring buffer pop • Tap bind • Overlay mount</text>
  </g>

  <!-- ================================================================= -->
  <!-- 2. LEASED CARD                                                    -->
  <!-- ================================================================= -->
  <g transform="translate(640, 95)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="300" height="150" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="28" rx="6" fill="#f0fdf4"/>
    <path d="M0,28 L300,28" stroke="#bbf7d0" stroke-width="1"/>
    
    <!-- State Badge -->
    <rect x="12" y="6" width="16" height="16" rx="8" fill="#16a34a"/>
    <text x="20" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">2</text>
    <text x="36" y="18" font-size="10.5" font-weight="700" fill="#15803d">LEASED</text>
    <text x="288" y="18" text-anchor="end" font-size="8.5" font-weight="600" fill="#16a34a">ACTIVE CONTEXT</text>

    <!-- Content Items -->
    <text x="16" y="48" font-size="9" font-weight="700" fill="#334155">Execution:</text>
    <text x="80" y="48" font-size="9" fill="#475569">Guest vCPUs unpaused; VSOCK streaming</text>

    <text x="16" y="68" font-size="9" font-weight="700" fill="#334155">Storage:</text>
    <text x="80" y="68" font-size="9" fill="#475569">Copy-on-Write overlay branch (ephemeral)</text>

    <text x="16" y="88" font-size="9" font-weight="700" fill="#334155">Network:</text>
    <text x="80" y="88" font-size="9" fill="#475569">Mediated egress via dedicated proxy IP</text>

    <text x="16" y="108" font-size="9" font-weight="700" fill="#334155">Boundary:</text>
    <text x="80" y="108" font-size="9" fill="#475569">Single-tenant lease descriptor with hard TTL</text>

    <rect x="12" y="122" width="276" height="18" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
    <text x="150" y="134.5" text-anchor="middle" font-size="8" font-weight="600" fill="#b91c1c">Invariant: Complete mediation • Wall-clock deadline</text>
  </g>

  <!-- ================================================================= -->
  <!-- TRANSITION: LEASED -> TAINTED                                     -->
  <!-- ================================================================= -->
  <g transform="translate(790, 245)">
    <path d="M0,5 L0,70" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
    <rect x="12" y="24" width="145" height="28" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="84" y="37" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Tool Exit / Lease Expiry</text>
    <text x="84" y="48" text-anchor="middle" font-size="7.5" fill="#78350f">Process exit • Output trapped</text>
  </g>

  <!-- ================================================================= -->
  <!-- 3. TAINTED CARD                                                   -->
  <!-- ================================================================= -->
  <g transform="translate(640, 325)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="300" height="150" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="28" rx="6" fill="#fffbeb"/>
    <path d="M0,28 L300,28" stroke="#fde68a" stroke-width="1"/>
    
    <!-- State Badge -->
    <rect x="12" y="6" width="16" height="16" rx="8" fill="#d97706"/>
    <text x="20" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">3</text>
    <text x="36" y="18" font-size="10.5" font-weight="700" fill="#b45309">TAINTED</text>
    <text x="288" y="18" text-anchor="end" font-size="8.5" font-weight="600" fill="#d97706">DIRTY / QUARANTINE</text>

    <!-- Content Items -->
    <text x="16" y="48" font-size="9" font-weight="700" fill="#334155">Status:</text>
    <text x="80" y="48" font-size="9" fill="#475569">Dirty filesystem state; mutated memory</text>

    <text x="16" y="68" font-size="9" font-weight="700" fill="#334155">Containment:</text>
    <text x="80" y="68" font-size="9" fill="#475569">Network egress severed; vCPUs suspended</text>

    <text x="16" y="88" font-size="9" font-weight="700" fill="#334155">Sanitization:</text>
    <text x="80" y="88" font-size="9" fill="#475569">Awaiting CoW overlay &amp; memory teardown</text>

    <text x="16" y="108" font-size="9" font-weight="700" fill="#334155">Safety:</text>
    <text x="80" y="108" font-size="9" fill="#475569">Forbidden from serving subsequent leases</text>

    <rect x="12" y="122" width="276" height="18" rx="3" fill="#fff7ed" stroke="#fed7aa" stroke-width="0.8"/>
    <text x="150" y="134.5" text-anchor="middle" font-size="8" font-weight="600" fill="#c2410c">Invariant: No in-place execution reuse without rollback</text>
  </g>

  <!-- ================================================================= -->
  <!-- TRANSITION: TAINTED -> RECLAIMING                                 -->
  <!-- ================================================================= -->
  <g transform="translate(360, 380)">
    <path d="M270,20 L20,20" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
    <rect x="40" y="0" width="200" height="18" rx="3" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="140" y="12.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Scrub Initiation &amp; CoW Unmount</text>
    <text x="140" y="32" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="8" fill="#7c3aed">Discard upperdir / workdir</text>
    <text x="140" y="44" text-anchor="middle" font-size="7.5" fill="#64748b">Structural rollback evaluation</text>
  </g>

  <!-- ================================================================= -->
  <!-- 4. RECLAIMING CARD                                                -->
  <!-- ================================================================= -->
  <g transform="translate(60, 325)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="300" height="150" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="28" rx="6" fill="#faf5ff"/>
    <path d="M0,28 L300,28" stroke="#ddd6fe" stroke-width="1"/>
    
    <!-- State Badge -->
    <rect x="12" y="6" width="16" height="16" rx="8" fill="#7c3aed"/>
    <text x="20" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">4</text>
    <text x="36" y="18" font-size="10.5" font-weight="700" fill="#6d28d9">RECLAIMING</text>
    <text x="288" y="18" text-anchor="end" font-size="8.5" font-weight="600" fill="#7c3aed">TEARDOWN &amp; SCRUB</text>

    <!-- Content Items -->
    <text x="16" y="48" font-size="9" font-weight="700" fill="#334155">Storage:</text>
    <text x="80" y="48" font-size="9" fill="#475569">Unlink CoW upperdir; restore lowerdir base</text>

    <text x="16" y="68" font-size="9" font-weight="700" fill="#334155">Memory:</text>
    <text x="80" y="68" font-size="9" fill="#475569">Page re-zero / MADV_DONTNEED / userfaultfd</text>

    <text x="16" y="88" font-size="9" font-weight="700" fill="#334155">Audit:</text>
    <text x="80" y="88" font-size="9" fill="#475569">Cryptographic verification of memory cleanliness</text>

    <text x="16" y="108" font-size="9" font-weight="700" fill="#334155">Decision:</text>
    <text x="80" y="108" font-size="9" fill="#475569">Clean state -&gt; Standby | Dirty/Fault -&gt; Destroy</text>

    <rect x="12" y="122" width="276" height="18" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="150" y="134.5" text-anchor="middle" font-size="8" font-weight="600" fill="#5b21b6">Invariant: Guaranteed baseline restoration or destruction</text>
  </g>

  <!-- ================================================================= -->
  <!-- TRANSITION: RECLAIMING -> WARM_STANDBY (ROLLBACK VERIFIED)        -->
  <!-- ================================================================= -->
  <g transform="translate(210, 245)">
    <path d="M0,75 L0,10" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-teal)"/>
    <rect x="-160" y="24" width="150" height="28" rx="3" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
    <text x="-85" y="37" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f766e">Rollback Verified</text>
    <text x="-85" y="48" text-anchor="middle" font-size="7.5" fill="#115e59">Re-enqueue to standby pool</text>
  </g>

  <!-- ================================================================= -->
  <!-- 5. DESTROYED (TERMINAL FAILURE)                                   -->
  <!-- ================================================================= -->
  <g transform="translate(370, 500)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="260" height="95" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" rx="6" fill="#fef2f2"/>
    <path d="M0,24 L260,24" stroke="#fca5a5" stroke-width="1"/>

    <!-- State Badge -->
    <rect x="10" y="5" width="14" height="14" rx="7" fill="#dc2626"/>
    <text x="17" y="15.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">5</text>
    <text x="30" y="15.5" font-size="9.5" font-weight="700" fill="#b91c1c">DESTROYED (Terminal State)</text>

    <!-- Details -->
    <text x="14" y="42" font-size="8.5" font-weight="700" fill="#334155">Action:</text>
    <text x="60" y="42" font-size="8.5" fill="#475569">SIGKILL VMM process; unmap GPA frames</text>

    <text x="14" y="60" font-size="8.5" font-weight="700" fill="#334155">Reclaim:</text>
    <text x="60" y="60" font-size="8.5" fill="#475569">Release KVM VMCS, file descriptors, DRAM</text>

    <text x="14" y="78" font-size="8.5" font-weight="700" fill="#334155">Trigger:</text>
    <text x="60" y="78" font-size="8.5" fill="#b91c1c">Scrub failure • Kernel panic • Expired lease</text>
  </g>

  <!-- Transition: RECLAIMING -> DESTROYED -->
  <path d="M210,475 L210,545 L360,545" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <rect x="220" y="525" width="130" height="16" rx="2" fill="#fff1f2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="285" y="536.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#991b1b">Scrub / Audit Failure</text>

  <!-- Transition: TAINTED -> DESTROYED -->
  <path d="M790,475 L790,545 L640,545" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <rect x="650" y="525" width="130" height="16" rx="2" fill="#fff1f2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="715" y="536.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#991b1b">Hard Timeout / Crash</text>

</svg>
