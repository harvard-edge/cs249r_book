<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Standard Arrowhead Markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">AUTOREGRESSIVE COVARIATE SHIFT AND TRAJECTORY RECOVERY DYNAMICS</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Comparison of unmitigated compounding quadratic error drift versus active recovery training under distribution shift</text>

  <!-- ================================================================= -->
  <!-- TOP CONTAINER: GOLDEN PATH MANIFOLD                               -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="880" height="88" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">TRAINING SUPPORT: GOLDEN PATHS d_π*</text>
    <text x="270" y="16" font-size="8" fill="#0284c7">Pristine expert demonstrations with deterministic assertion pass (R=1)</text>

    <!-- State Sequence Nodes -->
    <!-- s0 -->
    <g transform="translate(16, 32)">
      <rect x="0" y="0" width="86" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="43" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">s₀</text>
      <text x="43" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Task Seed</text>
    </g>

    <!-- Arrow s0 -> s1* -->
    <line x1="102" y1="54" x2="138" y2="54" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="120" y="47" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0284c7">a₀*</text>

    <!-- s1* -->
    <g transform="translate(140, 32)">
      <rect x="0" y="0" width="94" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="47" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">s₁*</text>
      <text x="47" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Inspect Repo</text>
    </g>

    <!-- Arrow s1* -> s2* -->
    <line x1="234" y1="54" x2="280" y2="54" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="257" y="47" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0284c7">a₁*</text>

    <!-- s2* -->
    <g transform="translate(282, 32)">
      <rect x="0" y="0" width="94" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="47" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">s₂*</text>
      <text x="47" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Isolate Bug</text>
    </g>

    <!-- Arrow s2* -> s3* -->
    <line x1="376" y1="54" x2="422" y2="54" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="399" y="47" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0284c7">a₂*</text>

    <!-- s3* -->
    <g transform="translate(424, 32)">
      <rect x="0" y="0" width="94" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="47" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">s₃*</text>
      <text x="47" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Apply Patch</text>
    </g>

    <!-- Arrow s3* -> s_H* -->
    <line x1="518" y1="54" x2="598" y2="54" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="558" y="47" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0284c7">a₃* (pytest)</text>

    <!-- s_H* (Goal Pass) -->
    <g transform="translate(600, 32)">
      <rect x="0" y="0" width="264" height="44" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="132" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">s_H* (Goal Pass State)</text>
      <text x="132" y="32" text-anchor="middle" font-size="7.5" fill="#166534">Deterministic Return Code 0 (Reward R = 1.0)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- FAULT DIVERGENCE & PIVOT STATE NODE                               -->
  <!-- ================================================================= -->
  <!-- Downward Arrow from s1* -->
  <line x1="227" y1="162" x2="227" y2="192" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Fault injection callout badge -->
  <g transform="translate(242, 166)">
    <rect x="0" y="0" width="240" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="8" y="14" font-size="8" font-weight="700" fill="#991b1b">FAULT INJECTION (t=1): Suboptimal tool action / timeout / exit 1</text>
  </g>

  <!-- Error Pivot State Node s2_err -->
  <g transform="translate(132, 194)">
    <rect x="0" y="0" width="190" height="40" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="95" y="17" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991b1b">s₂_err (Out-of-Distribution Pivot)</text>
    <text x="95" y="30" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Outside supp(d_π*) | State diverges from oracle support</text>
  </g>

  <!-- Branching Arrows from s2_err -->
  <!-- Branch A Arrow (down-left) -->
  <path d="M 160 234 C 160 248, 100 248, 100 258" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 2" fill="none" marker-end="url(#arr-red)"/>

  <!-- Branch B Arrow (down-right) -->
  <path d="M 290 234 C 290 248, 545 248, 545 258" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>

  <!-- ================================================================= -->
  <!-- BOTTOM LEFT: PATH A (UNMITIGATED DRIFT)                           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="425" height="152" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="425" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">PATH A: UNMITIGATED DRIFT [ O(ε²H²) ]</text>

    <!-- s3_halluc -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="105" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="52" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">s₃_halluc</text>
      <text x="52" y="30" text-anchor="middle" font-size="7.5" fill="#dc2626">High-Entropy Action</text>
    </g>

    <!-- Arrow -->
    <line x1="117" y1="55" x2="147" y2="55" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <!-- s4_loop -->
    <g transform="translate(149, 34)">
      <rect x="0" y="0" width="105" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="52" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">s₄_loop</text>
      <text x="52" y="30" text-anchor="middle" font-size="7.5" fill="#dc2626">CLI Syntax Panic</text>
    </g>

    <!-- Arrow -->
    <line x1="254" y1="55" x2="284" y2="55" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <!-- Catastrophic Loop Failure -->
    <g transform="translate(286, 34)">
      <rect x="0" y="0" width="127" height="42" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="63" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Catastrophic Loop</text>
      <text x="63" y="30" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Context Exhaustion (R=0)</text>
    </g>

    <!-- Narrative -->
    <text x="12" y="98" font-size="8" fill="#475569">Policy never observed error tokens in training; unmitigated divergence cascades quadratically.</text>
    <rect x="12" y="108" width="401" height="32" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="122" font-size="7.5" font-weight="700" fill="#991b1b">Result: 0% Recovery | Hallucinated command spam | Production outage</text>
    <text x="20" y="133" font-size="7" fill="#64748b">Cumulative error bound scales quadratically: ε_total = O(ε²H²)</text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM RIGHT: PATH B (FLYWHEEL RECOVERY)                          -->
  <!-- ================================================================= -->
  <g transform="translate(495, 260)">
    <rect x="0" y="0" width="425" height="152" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="425" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">PATH B: FLYWHEEL RECOVERY [ O(εH) ]</text>

    <!-- s3_diag -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="105" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="52" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">s₃_diag</text>
      <text x="52" y="30" text-anchor="middle" font-size="7.5" fill="#16a34a">Inspect stderr / logs</text>
    </g>

    <!-- Arrow with repair label -->
    <line x1="117" y1="55" x2="147" y2="55" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
    <text x="132" y="47" text-anchor="middle" font-size="7" font-weight="700" fill="#16a34a">a_repair</text>

    <!-- s4_recon -->
    <g transform="translate(149, 34)">
      <rect x="0" y="0" width="115" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="57" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">s₄_reconverge</text>
      <text x="57" y="30" text-anchor="middle" font-size="7.5" fill="#16a34a">Fix env / retry test</text>
    </g>

    <!-- Arrow -->
    <line x1="264" y1="55" x2="294" y2="55" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- Reconnect to Goal -->
    <g transform="translate(296, 34)">
      <rect x="0" y="0" width="117" height="42" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="58" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">s_H* (Success)</text>
      <text x="58" y="30" text-anchor="middle" font-size="7.5" fill="#166534">Re-entry to d_π* (R=1)</text>
    </g>

    <!-- Narrative -->
    <text x="12" y="98" font-size="8" fill="#475569">Trained on 30% error-recovery traces; agent internalizes causal self-diagnosis and repair.</text>
    <rect x="12" y="108" width="401" height="32" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="122" font-size="7.5" font-weight="700" fill="#15803d">Result: Linear Error Bound O(εH) | Autonomous self-correction | Robust execution</text>
    <text x="20" y="133" font-size="7" fill="#64748b">Causal self-correction resets drift: ε_total = O(εH)</text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM FOOTER: COMPARISON & CURATION INVARIANTS                   -->
  <!-- ================================================================= -->
  <g transform="translate(40, 424)">
    <!-- Card 1: Golden Path Illusion -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="84" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="84" rx="1" fill="#dc2626"/>
      <text x="14" y="18" font-size="8.5" font-weight="700" fill="#0f172a">The Golden Path Illusion</text>
      <text x="14" y="32" font-size="7.5" fill="#475569">Pruning all runtime errors generates brittle policies.</text>
      <text x="14" y="44" font-size="7.5" fill="#475569">The first unexpected environment fault triggers quadratic</text>
      <text x="14" y="56" font-size="7.5" fill="#475569">drift explosion across task horizon H:</text>
      <text x="14" y="70" font-size="8" font-weight="700" fill="#991b1b">Compounding Drift: O(ε²H²)</text>
    </g>

    <!-- Card 2: Negative Mining & DAgger -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="280" height="84" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="84" rx="1" fill="#d97706"/>
      <text x="14" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Negative Trajectory Mining</text>
      <text x="14" y="32" font-size="7.5" fill="#475569">Pinpoints pivot step t_pivot = argmax ΔV(s).</text>
      <text x="14" y="44" font-size="7.5" fill="#475569">DAgger rollback queries teacher from s_err to</text>
      <text x="14" y="56" font-size="7.5" fill="#475569">synthesize verified corrective repair branches:</text>
      <text x="14" y="70" font-size="8" font-weight="700" fill="#b45309">Pivot Step Recovery Synthesis</text>
    </g>

    <!-- Card 3: Bifurcated Curation -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="280" height="84" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="84" rx="1" fill="#16a34a"/>
      <text x="14" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Bifurcated Curation Invariant</text>
      <text x="14" y="32" font-size="7.5" fill="#475569">D_train = 0.70 D_golden + 0.30 D_recovery.</text>
      <text x="14" y="44" font-size="7.5" fill="#475569">Teaches concise direct paths while bounding error</text>
      <text x="14" y="56" font-size="7.5" fill="#475569">propagation linearly via self-repair actions:</text>
      <text x="14" y="70" font-size="8" font-weight="700" fill="#15803d">Linear Bound: O(εH)</text>
    </g>
  </g>
</svg>
