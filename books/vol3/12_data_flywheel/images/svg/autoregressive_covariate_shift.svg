<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#FFFFFF" rx="2" />
  <rect x="8" y="8" width="944" height="504" fill="#FAFAFC" rx="2" stroke="#E2E8F0" stroke-width="1" />

  <!-- Figure Badge & Title -->
  <!-- Top Title Header -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="912" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">AUTOREGRESSIVE COVARIATE SHIFT AND TRAJECTORY RECOVERY DYNAMICS</text>
  </g>

  <!-- TOP CONTAINER: Golden Path Manifold -->
  <g transform="translate(24, 66)">
    <rect x="0" y="0" width="912" height="114" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#shadow-sm)" />
    
    <!-- Manifold Header Tag -->
    <rect x="14" y="10" width="220" height="20" rx="4" fill="#DBEAFE" />
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1D4ED8">TRAINING SUPPORT: GOLDEN PATHS d_π*</text>
    <text x="245" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#4B5563">Pristine expert demonstrations with 100% deterministic assertion pass (R=1)</text>

    <!-- State Nodes Sequence -->
    <!-- s0 -->
    <g transform="translate(40, 44)">
      <rect x="0" y="0" width="90" height="48" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow-sm)" />
      <text x="45" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">s₀</text>
      <text x="45" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">Task Seed</text>
    </g>

    <!-- Arrow s0 -> s1* -->
    <line x1="130" y1="68" x2="178" y2="68" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="154" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#2563EB" text-anchor="middle">a₀*</text>

    <!-- s1* -->
    <g transform="translate(180, 44)">
      <rect x="0" y="0" width="90" height="48" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow-sm)" />
      <text x="45" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">s₁*</text>
      <text x="45" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">Inspect Repo</text>
    </g>

    <!-- Arrow s1* -> s2* -->
    <line x1="270" y1="68" x2="338" y2="68" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="304" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#2563EB" text-anchor="middle">a₁*</text>

    <!-- s2* -->
    <g transform="translate(340, 44)">
      <rect x="0" y="0" width="90" height="48" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow-sm)" />
      <text x="45" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">s₂*</text>
      <text x="45" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">Isolate Bug</text>
    </g>

    <!-- Arrow s2* -> s3* -->
    <line x1="430" y1="68" x2="498" y2="68" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="464" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#2563EB" text-anchor="middle">a₂*</text>

    <!-- s3* -->
    <g transform="translate(500, 44)">
      <rect x="0" y="0" width="90" height="48" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow-sm)" />
      <text x="45" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">s₃*</text>
      <text x="45" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">Apply Patch</text>
    </g>

    <!-- Arrow s3* -> sH* -->
    <line x1="590" y1="68" x2="688" y2="68" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="639" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#2563EB" text-anchor="middle">a₃* (pytest)</text>

    <!-- sH* (Success) -->
    <g transform="translate(690, 44)">
      <rect x="0" y="0" width="180" height="48" rx="2" fill="#10B981" stroke="#059669" stroke-width="1.5"  />
      <text x="90" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">s_H* (Goal Pass)</text>
      <text x="90" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#ECFDF5" text-anchor="middle">Oracle Return Code 0 (R=1)</text>
    </g>
  </g>

  <!-- FAULT DIVERGENCE ARROW (Down from s1*) -->
  <g transform="translate(249, 158)">
    <path d="M 0 0 L 0 54" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arr-red)" />
    <rect x="8" y="14" width="200" height="30" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
    <text x="14" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#991B1B">RUNTIME FAULT INJECTION (t=1)</text>
    <text x="14" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#B91C1C">Suboptimal action / Network timeout / exit 1</text>
  </g>

  <!-- ERROR PIVOT STATE NODE s2_err -->
  <g transform="translate(175, 218)">
    <rect x="0" y="0" width="150" height="46" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"  />
    <text x="75" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#991B1B" text-anchor="middle">s₂_err (Out-of-Distribution)</text>
    <text x="75" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#B91C1C" text-anchor="middle">Pivot Step: Outside supp(d_π*)</text>
  </g>

  <!-- GLOBAL BRANCHING ARROWS FROM s2_err -->
  <!-- Left branch down into Path A -->
  <path d="M 210 264 C 210 295, 96 280, 96 320" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arr-red)" fill="none" />
  
  <!-- Right branch down into Path B -->
  <path d="M 290 264 C 290 295, 545 280, 545 320" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)" fill="none" />

  <!-- BRANCH A: Naive Policy Drift (Left Container) -->
  <g transform="translate(24, 276)">
    <rect x="0" y="0" width="440" height="136" rx="2" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow-sm)" />
    
    <!-- Title tag positioned on the right to keep left entry clear -->
    <rect x="180" y="10" width="248" height="20" rx="4" fill="#FEE2E2" />
    <text x="186" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#991B1B">PATH A: UNMITIGATED DRIFT [ O(ε²H²) ]</text>

    <!-- s3_halluc (centered under entry arrow at x=72) -->
    <g transform="translate(16, 44)">
      <rect x="0" y="0" width="112" height="44" rx="2" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2" />
      <text x="56" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B" text-anchor="middle">s₃_halluc</text>
      <text x="56" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#7F1D1D" text-anchor="middle">High-Entropy Action</text>
    </g>

    <!-- Arrow -->
    <line x1="128" y1="66" x2="156" y2="66" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)" />

    <!-- s4_loop -->
    <g transform="translate(158, 44)">
      <rect x="0" y="0" width="118" height="44" rx="2" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2" />
      <text x="59" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B" text-anchor="middle">s₄_loop</text>
      <text x="59" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#7F1D1D" text-anchor="middle">CLI Syntax Panic</text>
    </g>

    <!-- Arrow -->
    <line x1="276" y1="66" x2="304" y2="66" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)" />

    <!-- Failure Box -->
    <g transform="translate(306, 44)">
      <rect x="0" y="0" width="120" height="44" rx="2" fill="#DC2626" stroke="#B91C1C" stroke-width="1.2" filter="url(#shadow-sm)" />
      <text x="60" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Catastrophic Loop</text>
      <text x="60" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#FEE2E2" text-anchor="middle">Context Exhaustion (R=0)</text>
    </g>

    <!-- Caption -->
    <text x="14" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#991B1B">Policy never observed error tokens in training; errors compound quadratically across horizon H.</text>
    <text x="14" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#7F1D1D">Result: 0% Recovery | Hallucinated command spam | Production outage</text>
  </g>

  <!-- BRANCH B: Flywheel Recovery Policy (Right Container) -->
  <g transform="translate(480, 276)">
    <rect x="0" y="0" width="456" height="136" rx="2" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow-sm)" />
    
    <!-- Title tag positioned on the right to keep left entry clear -->
    <rect x="180" y="10" width="262" height="20" rx="4" fill="#D1FAE5" />
    <text x="186" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#065F46">PATH B: FLYWHEEL RECOVERY [ O(εH) ]</text>

    <!-- s3_diag (centered under entry arrow at x=65 -> global 545) -->
    <g transform="translate(14, 44)">
      <rect x="0" y="0" width="112" height="44" rx="2" fill="#FFFFFF" stroke="#059669" stroke-width="1.2" />
      <text x="56" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle">s₃_diag</text>
      <text x="56" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#047857" text-anchor="middle">Inspect stderr / logs</text>
    </g>

    <!-- Arrow with Repair Action -->
    <line x1="126" y1="66" x2="168" y2="66" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)" />
    <text x="147" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">a_repair</text>

    <!-- s4_recon -->
    <g transform="translate(170, 44)">
      <rect x="0" y="0" width="120" height="44" rx="2" fill="#FFFFFF" stroke="#059669" stroke-width="1.2" />
      <text x="60" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle">s₄_reconverge</text>
      <text x="60" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#047857" text-anchor="middle">Fix env / retry test</text>
    </g>

    <!-- Arrow -->
    <line x1="290" y1="66" x2="330" y2="66" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)" />

    <!-- Reconnect to Goal -->
    <g transform="translate(332, 44)">
      <rect x="0" y="0" width="112" height="44" rx="2" fill="#10B981" stroke="#047857" stroke-width="1.2" filter="url(#shadow-sm)" />
      <text x="56" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">s_H* (Success)</text>
      <text x="56" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#ECFDF5" text-anchor="middle">Re-entry to d_π* (R=1)</text>
    </g>

    <!-- Caption -->
    <text x="14" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#065F46">Trained on 30% error-recovery traces; agent internalizes causal self-diagnosis and repair.</text>
    <text x="14" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#047857">Result: Linear Error Bound O(εH) | Autonomous self-correction | Robust execution</text>
  </g>

  <!-- BOTTOM COMPARISON FOOTER BARS -->
  <g transform="translate(24, 426)">
    <!-- Pill 1: Golden Path Bias -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="290" height="74" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-sm)" />
      <rect x="8" y="8" width="6" height="58" rx="3" fill="#EF4444" />
      <text x="22" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">The Golden Path Illusion</text>
      <text x="22" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">Pruning all errors creates brittle policies.</text>
      <text x="22" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">First runtime fault triggers quadratic</text>
      <text x="22" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#DC2626">drift explosion: O(ε²H²).</text>
    </g>

    <!-- Pill 2: Negative Mining & DAgger -->
    <g transform="translate(306, 0)">
      <rect x="0" y="0" width="295" height="74" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-sm)" />
      <rect x="8" y="8" width="6" height="58" rx="3" fill="#D97706" />
      <text x="22" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Negative Trajectory Mining</text>
      <text x="22" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">Pinpoints pivot step t_pivot = argmax ΔV(s).</text>
      <text x="22" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">DAgger rollback prompts teacher from s_err</text>
      <text x="22" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#D97706">to generate verified repair branches.</text>
    </g>

    <!-- Pill 3: Bifurcated Curation -->
    <g transform="translate(617, 0)">
      <rect x="0" y="0" width="295" height="74" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-sm)" />
      <rect x="8" y="8" width="6" height="58" rx="3" fill="#059669" />
      <text x="22" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Bifurcated Curation Invariant</text>
      <text x="22" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">D_train = 0.70 D_golden + 0.30 D_recovery.</text>
      <text x="22" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">Teaches concise direct paths while bounding</text>
      <text x="22" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#059669">compounding error linearly: O(εH).</text>
    </g>
  </g>
</svg>
