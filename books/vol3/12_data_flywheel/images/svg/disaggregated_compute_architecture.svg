<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="490" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- TIER 1: GPU ROLLOUT INFERENCE FLEET (Left: w=265, h=280)          -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="265" height="280" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">GPU INFERENCE FLEET (Rollout Engine)</text>

    <!-- Node 1 -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="241" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Worker Node 1: 8× H100 SXM5 (80 GB)</text>
      <text x="8" y="28" font-size="8.0" fill="#334155">• vLLM / SGLang Continuous Batching</text>
      <text x="8" y="42" font-size="8.0" fill="#334155">• RadixAttention Prefix Caching (L1 HBM)</text>
      <text x="8" y="56" font-size="8.0" font-weight="700" fill="#0284c7">Tensor Core Saturation: &gt;85% (No tool waits)</text>
    </g>

    <!-- Node 2 -->
    <g transform="translate(12, 108)">
      <rect x="0" y="0" width="241" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Worker Node 2: 8× H100 SXM5 (80 GB)</text>
      <text x="8" y="28" font-size="8.0" fill="#334155">• Independent Action Sampling (T = 0.7)</text>
      <text x="8" y="42" font-size="8.0" fill="#334155">• Emits token streams &amp; tool call envelopes</text>
      <text x="8" y="56" font-size="8.0" font-weight="700" fill="#0284c7">Batch Capacity: 128 concurrent rollouts</text>
    </g>

    <!-- Node 3 ... M -->
    <g transform="translate(12, 182)">
      <rect x="0" y="0" width="241" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2" stroke-width="1"/>
      <text x="120" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b">Worker Nodes 3 ... M</text>
      <text x="120" y="32" text-anchor="middle" font-size="8.0" fill="#64748b">Horizontal GPU Scaling Pool</text>
    </g>

    <!-- Invariant Tag -->
    <rect x="12" y="236" width="241" height="32" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="120" y="249" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">Core Architecture Invariant</text>
    <text x="120" y="260" text-anchor="middle" font-size="8.0" fill="#78350f">Zero sandbox binaries execute on GPU nodes</text>
  </g>

  <!-- Connection: GPU Fleet -> Message Bus -->
  <line x1="305" y1="205" x2="338" y2="205" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="322" y="197" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#b45309">stream(τ)</text>

  <!-- ================================================================= -->
  <!-- TIER 2: ASYNCHRONOUS STREAMING MESSAGE BUS (Center: w=240, h=220)  -->
  <!-- ================================================================= -->
  <g transform="translate(340, 104)">
    <rect x="0" y="0" width="240" height="220" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">STREAMING MESSAGE BUS</text>

    <!-- Queue 1: Pending Verification -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="216" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#0f172a">Topic: raw_rollouts (Kafka / Pulsar)</text>
      <text x="8" y="30" font-family="Courier, monospace" font-size="8.0" fill="#b45309">Sharded Partition: P0 ... P127</text>
    </g>

    <!-- Queue 2: In-Flight Observations -->
    <g transform="translate(12, 84)">
      <rect x="0" y="0" width="216" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#0f172a">Topic: tool_feedback</text>
      <text x="8" y="30" font-family="Courier, monospace" font-size="8.0" fill="#15803d">Async Observations (Return to GPU)</text>
    </g>

    <!-- Interconnect Specs Card -->
    <g transform="translate(12, 134)">
      <rect x="0" y="0" width="216" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8.0" font-weight="700" fill="#475569">Interconnect:</text>
      <text x="82" y="16" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">200 Gbps RoCE / InfiniBand</text>

      <text x="8" y="34" font-size="8.0" font-weight="700" fill="#475569">Buffer Latency:</text>
      <text x="82" y="34" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">&lt; 1.5 ms p99 publish</text>

      <text x="8" y="52" font-size="8.0" font-weight="700" fill="#475569">Isolation:</text>
      <text x="82" y="52" font-size="8.0" fill="#334155">Decouples GPU FLOPs from stalls</text>

      <text x="8" y="66" font-size="8.0" font-weight="700" fill="#b45309">Zero GPU idle time during sandbox execution</text>
    </g>
  </g>

  <!-- Connection: Message Bus -> CPU Fleet -->
  <line x1="580" y1="205" x2="613" y2="205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-gray)"/>
  <text x="597" y="197" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#64748b">pull_job</text>

  <!-- ================================================================= -->
  <!-- TIER 3: CPU MICROVM VERIFICATION FLEET (Right: w=265, h=280)       -->
  <!-- ================================================================= -->
  <g transform="translate(615, 74)">
    <rect x="0" y="0" width="265" height="280" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1e293b">CPU VERIFICATION FLEET (Sandboxes)</text>

    <!-- Host 1 -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="241" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">CPU Host 1: AMD EPYC 9654 (128 Cores)</text>
      <text x="8" y="28" font-size="8.0" fill="#334155">• Firecracker MicroVM Pool (sub-5ms boot)</text>
      <text x="8" y="42" font-size="8.0" fill="#334155">• Isolated rootfs snapshot per rollout</text>
      <text x="8" y="56" font-size="8.0" font-weight="700" fill="#15803d">Executes bash, git, python, gcc sandboxes</text>
    </g>

    <!-- Oracle Cluster -->
    <g transform="translate(12, 108)">
      <rect x="0" y="0" width="241" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Verification Oracle Cluster</text>
      <text x="8" y="28" font-size="8.0" fill="#334155">• Deterministic State Diff Validator (git diff)</text>
      <text x="8" y="42" font-size="8.0" fill="#334155">• Hermetic Unit Test Suite (pytest, ctest)</text>
      <text x="8" y="56" font-size="8.0" font-weight="700" fill="#b91c1c">Binary Gate: R(τ) ∈ {0.0, 1.0}</text>
    </g>

    <!-- Host Pool 3 ... K -->
    <g transform="translate(12, 182)">
      <rect x="0" y="0" width="241" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2" stroke-width="1"/>
      <text x="120" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b">CPU Host Pool 3 ... K</text>
      <text x="120" y="32" text-anchor="middle" font-size="8.0" fill="#64748b">Dense Horizontal Verification Pool</text>
    </g>

    <!-- Cost Efficiency Tag -->
    <rect x="12" y="236" width="241" height="32" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="120" y="249" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">Hardware Economic Invariant</text>
    <text x="120" y="260" text-anchor="middle" font-size="8.0" fill="#166534">Cost Efficiency: CPU core-hours 15× cheaper than H100</text>
  </g>

  <!-- ================================================================= -->
  <!-- TIER 4: STORAGE & INGESTION STAGING TIER                          -->
  <!-- ================================================================= -->
  <!-- Arrow from CPU Fleet down to Hot Tier (Pass R=1.0) -->
  <path d="M 680 354 L 680 372 L 282 372 L 282 388" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="480" y="367" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">PASSED: R = 1.0 (Golden Path τ*)</text>

  <!-- Arrow from CPU Fleet down to Cold Tier (Fail R=0.0) -->
  <path d="M 780 354 L 780 388" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="790" y="372" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#dc2626">FAILED: R = 0.0</text>

  <!-- Hot Storage Card: SFT & RLVR Staging -->
  <g transform="translate(40, 390)">
    <rect x="0" y="0" width="485" height="106" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="485" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">HOT TIER: Memory-Mapped NVMe Array (SFT &amp; RLVR Staging)</text>

    <text x="12" y="44" font-size="8" font-weight="700" fill="#166534">Format &amp; Ingestion:</text>
    <text x="118" y="44" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">Apache Arrow / Parquet, zero-copy mmap reader</text>

    <text x="12" y="64" font-size="8" font-weight="700" fill="#166534">Data Pipeline:</text>
    <text x="118" y="64" font-size="8.0" fill="#334155">Min-step deduplication, token-masking index, group advantage pools</text>

    <text x="12" y="84" font-size="8" font-weight="700" fill="#166534">Consumer Nodes:</text>
    <text x="118" y="84" font-size="8.0" font-weight="700" fill="#0284c7">Direct InfiniBand RDMA to Distributed Training Nodes (Megatron / DeepSpeed)</text>
    <text x="12" y="98" font-size="8.0" fill="#64748b">Zero-copy shared memory staging enables sustained saturation of training accelerators</text>
  </g>

  <!-- Cold Storage Card: Failure Mining -->
  <g transform="translate(545, 390)">
    <rect x="0" y="0" width="335" height="106" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="335" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">COLD TIER: Distributed Object Store (Failure Telemetry)</text>

    <text x="12" y="44" font-size="8" font-weight="700" fill="#5b21b6">Target Store:</text>
    <text x="96" y="44" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">S3 / GCS Compressed Parquet Bucket</text>

    <text x="12" y="64" font-size="8" font-weight="700" fill="#5b21b6">Failure Analysis:</text>
    <text x="96" y="64" font-size="8.0" fill="#334155">Error step mining t*, syntax breakdown, clustering</text>

    <text x="12" y="84" font-size="8" font-weight="700" fill="#5b21b6">Curriculum Loop:</text>
    <text x="96" y="84" font-size="8.0" font-weight="700" fill="#7c3aed">Synthesizes targeted recovery seeds (DAgger / RLVR)</text>
    <text x="12" y="98" font-size="8.0" fill="#64748b">Asynchronously extracts negative traces for bifurcated curation</text>
  </g>

</g>
</svg>