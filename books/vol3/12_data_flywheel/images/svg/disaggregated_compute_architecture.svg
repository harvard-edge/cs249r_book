<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="460" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- TIER 1: GPU ROLLOUT INFERENCE FLEET (x: 35, y: 30, w: 260, h: 260) -->
  <!-- ================================================================= -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="260" height="265" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="130" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0369a1">GPU INFERENCE FLEET (Rollout Engine)</text>

    <!-- Node 1 -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="236" height="64" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="0" y="0" width="236" height="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="8" y="13" font-size="8" font-weight="700" fill="#334155">Worker Node 1: 8× H100 SXM5 (80 GB)</text>
      <text x="8" y="32" font-size="7.5" fill="#0c4a6e">• vLLM / SGLang Continuous Batching</text>
      <text x="8" y="44" font-size="7.5" fill="#0c4a6e">• RadixAttention Prefix Caching (L1 HBM)</text>
      <text x="8" y="56" font-size="7" font-weight="700" fill="#0284c7">Tensor Core Saturation: &gt;85% (No tool waits)</text>
    </g>

    <!-- Node 2 -->
    <g transform="translate(12, 110)">
      <rect x="0" y="0" width="236" height="64" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="0" y="0" width="236" height="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="8" y="13" font-size="8" font-weight="700" fill="#334155">Worker Node 2: 8× H100 SXM5 (80 GB)</text>
      <text x="8" y="32" font-size="7.5" fill="#0c4a6e">• Independent Action Sampling (T = 0.7)</text>
      <text x="8" y="44" font-size="7.5" fill="#0c4a6e">• Emits token streams &amp; tool call envelopes</text>
      <text x="8" y="56" font-size="7" font-weight="700" fill="#0284c7">Batch Capacity: 128 concurrent rollouts</text>
    </g>

    <!-- Node N (ellipsis) -->
    <g transform="translate(12, 184)">
      <rect x="0" y="0" width="236" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2" stroke-width="1"/>
      <text x="118" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b">Worker Nodes 3 ... M</text>
      <text x="118" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Horizontal GPU Scaling Pool</text>
    </g>

    <!-- Invariant Tag -->
    <text x="12" y="252" font-size="7.2" font-weight="700" fill="#b45309">Invariant: Zero sandbox binaries execute on GPU nodes</text>
  </g>

  <!-- Arrow: GPU Fleet -> Message Broker -->
  <path d="M295,162 L355,162" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <text x="325" y="154" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#b45309">stream(τ)</text>

  <!-- ================================================================= -->
  <!-- TIER 2: ASYNCHRONOUS MESSAGE BROKER (x: 355, y: 80, w: 210, h: 165) -->
  <!-- ================================================================= -->
  <g transform="translate(355, 80)">
    <rect x="0" y="0" width="210" height="165" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="105" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">STREAMING MESSAGE BUS</text>

    <!-- Queue 1: Pending Verification -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="190" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-weight="700" fill="#334155">Topic: raw_rollouts (Kafka / Pulsar)</text>
      <text x="8" y="26" font-family="Courier, monospace" font-size="7" fill="#78350f">Sharded Partition: P0 ... P127</text>
    </g>

    <!-- Queue 2: In-Flight Observations -->
    <g transform="translate(10, 74)">
      <rect x="0" y="0" width="190" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-weight="700" fill="#334155">Topic: tool_feedback</text>
      <text x="8" y="26" font-family="Courier, monospace" font-size="7" fill="#15803d">Async Observations (Return to GPU)</text>
    </g>

    <!-- Interconnect Specs -->
    <text x="10" y="125" font-size="7.2" font-weight="700" fill="#475569">Interconnect:</text>
    <text x="70" y="125" font-family="Courier, monospace" font-size="7" fill="#0f172a">200 Gbps RoCE / InfiniBand</text>
    <text x="10" y="138" font-size="7.2" font-weight="700" fill="#475569">Buffer Latency:</text>
    <text x="80" y="138" font-family="Courier, monospace" font-size="7" fill="#0f172a">&lt; 1.5 ms p99 publish</text>
    <text x="10" y="152" font-size="7" fill="#64748b">Decouples GPU FLOPs from tool stalls</text>
  </g>

  <!-- Arrow: Message Broker -> CPU Fleet -->
  <path d="M565,162 L625,162" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <text x="595" y="154" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#475569">pull_job</text>

  <!-- ================================================================= -->
  <!-- TIER 3: CPU MICROVM VERIFICATION FLEET (x: 625, y: 30, w: 260, h: 265) -->
  <!-- ================================================================= -->
  <g transform="translate(625, 30)">
    <rect x="0" y="0" width="260" height="265" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="130" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b">CPU VERIFICATION FLEET (Sandboxes)</text>

    <!-- MicroVM Pool 1 -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="236" height="64" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="0" y="0" width="236" height="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="8" y="13" font-size="8" font-weight="700" fill="#334155">CPU Host 1: AMD EPYC 9654 (128 Cores)</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">• Firecracker MicroVM Pool (sub-5ms boot)</text>
      <text x="8" y="44" font-size="7.5" fill="#334155">• Isolated rootfs snapshot per rollout</text>
      <text x="8" y="56" font-size="7" font-weight="700" fill="#15803d">Executes bash, git, python, gcc sandboxes</text>
    </g>

    <!-- MicroVM Pool 2 -->
    <g transform="translate(12, 110)">
      <rect x="0" y="0" width="236" height="64" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="0" y="0" width="236" height="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="8" y="13" font-size="8" font-weight="700" fill="#334155">Verification Oracle Cluster</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">• Deterministic State Diff Validator (git diff)</text>
      <text x="8" y="44" font-size="7.5" fill="#334155">• Hermetic Unit Test Suite (pytest, ctest)</text>
      <text x="8" y="56" font-size="7" font-weight="700" fill="#b91c1c">Binary Gate: R(τ) ∈ {0.0, 1.0}</text>
    </g>

    <!-- CPU Nodes Ellipsis -->
    <g transform="translate(12, 184)">
      <rect x="0" y="0" width="236" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2" stroke-width="1"/>
      <text x="118" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b">CPU Host Pool 3 ... K</text>
      <text x="118" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Dense Horizontal Verification Pool</text>
    </g>

    <text x="12" y="252" font-size="7.2" font-weight="700" fill="#15803d">Cost Efficiency: CPU core-hours 15× cheaper than H100</text>
  </g>

  <!-- ================================================================= -->
  <!-- TIER 4: STORAGE & INGESTION TIER (y = 330 to 425)                 -->
  <!-- ================================================================= -->
  <!-- Arrow from CPU Fleet down to Golden Storage (Pass R=1) -->
  <path d="M690,295 L690,335 L380,335 L380,350" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="510" y="330" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">PASSED: R=1.0 (Golden Path τ*)</text>

  <!-- Arrow from CPU Fleet down to Cold Storage (Fail R=0) -->
  <path d="M820,295 L820,350" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="825" y="325" font-family="Courier, monospace" font-size="7" fill="#b91c1c">FAILED: R=0</text>

  <!-- Hot Storage: SFT / RLVR Training Buffer (x: 35, y: 350, w: 450, h: 85) -->
  <g transform="translate(35, 350)">
    <rect x="0" y="0" width="450" height="85" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="450" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="225" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">HOT TIER: Memory-Mapped NVMe Array (SFT &amp; RLVR Staging)</text>

    <text x="12" y="38" font-size="8" font-weight="700" fill="#14532d">Format &amp; Ingestion:</text>
    <text x="115" y="38" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">Apache Arrow / Parquet, zero-copy mmap reader</text>

    <text x="12" y="55" font-size="8" font-weight="700" fill="#14532d">Data Pipeline:</text>
    <text x="115" y="55" font-size="7.5" fill="#334155">Min-step deduplication, token-masking index, group advantage pools</text>

    <text x="12" y="72" font-size="8" font-weight="700" fill="#14532d">Consumer Nodes:</text>
    <text x="115" y="72" font-size="7.5" font-weight="700" fill="#0284c7">Direct InfiniBand RDMA to Distributed Training Nodes (Megatron / DeepSpeed)</text>
  </g>

  <!-- Cold Storage: Telemetry & Failure Mining (x: 520, y: 350, w: 365, h: 85) -->
  <g transform="translate(520, 350)">
    <rect x="0" y="0" width="365" height="85" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="365" height="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="182" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">COLD TIER: Distributed Object Store (Failure Telemetry)</text>

    <text x="12" y="38" font-size="8" font-weight="700" fill="#475569">Target Store:</text>
    <text x="90" y="38" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">S3 / GCS Compressed Parquet Bucket</text>

    <text x="12" y="55" font-size="8" font-weight="700" fill="#475569">Failure Analysis:</text>
    <text x="90" y="55" font-size="7.5" fill="#334155">Error step mining t*, syntax breakdown, hallucination clustering</text>

    <text x="12" y="72" font-size="8" font-weight="700" fill="#475569">Curriculum Loop:</text>
    <text x="90" y="72" font-size="7.5" fill="#7c3aed">Synthesizes targeted recovery seeds (DAgger / RLVR negs)</text>
  </g>

</svg>
