<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .stage-block { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; rx: 4; }
      .stage-final { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.6; rx: 4; }
      
      .hdr-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .hdr-final { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #065f46; text-anchor: middle; }
      .txt-stage-sub { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8px; font-weight: 600; fill: #2563eb; text-anchor: middle; }
      .txt-stage-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; fill: #334155; text-anchor: middle; }
      
      .edge { stroke: #475569; stroke-width: 1.4; fill: none; }
      .edge-flywheel { stroke: #059669; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      
      /* Chart Styles */
      .chart-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .grid { stroke: #f1f5f9; stroke-width: 1.2; }
      .axis { stroke: #64748b; stroke-width: 1.4; }
      .axis-tick { stroke: #64748b; stroke-width: 1.2; }
      .axis-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
      .axis-lbl-l { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 9.5px; font-weight: 600; fill: #d97706; text-anchor: end; }
      .axis-lbl-r { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 9.5px; font-weight: 600; fill: #2563eb; text-anchor: start; }
      .axis-title-l { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #b45309; text-anchor: middle; }
      .axis-title-r { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
      
      .curve-yield { stroke: #d97706; stroke-width: 2.8; fill: none; stroke-linecap: round; }
      .curve-pass { stroke: #2563eb; stroke-width: 2.8; fill: none; stroke-linecap: round; }
      
      .dot-yield { fill: #d97706; stroke: #ffffff; stroke-width: 2; }
      .dot-pass { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
      
      .callout-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.2; rx: 3; }
      .callout-danger { fill: #fff1f2; stroke: #fda4af; stroke-width: 1.2; rx: 3; }
      .callout-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #1e40af; }
      .callout-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; fill: #1e3a8a; }
      
      .legend-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #1e293b; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- ==================== TOP PANEL: 6 ARCHITECTURAL STAGES ==================== -->
  <!-- Stage 1 -->
  <g transform="translate(15, 20)">
    <rect width="155" height="92" class="stage-block" />
    <text x="77" y="20" class="hdr-stage">Runtime Capture</text>
    <text x="77" y="34" class="txt-stage-sub">WAL / ACB Hooks</text>
    <line x1="10" y1="42" x2="145" y2="42" stroke="#cbd5e1" />
    <text x="77" y="58" class="txt-stage-desc">Mediated RPC traces</text>
    <text x="77" y="72" class="txt-stage-desc">CoW fs snapshot Δ_fs</text>
    <text x="77" y="84" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#475569" text-anchor="middle">Output: τ_raw</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 170 66 L 188 66" class="edge" marker-end="url(#arr)" />

  <!-- Stage 2 -->
  <g transform="translate(190, 20)">
    <rect width="155" height="92" class="stage-block" />
    <text x="77" y="20" class="hdr-stage">Verifier Cascade</text>
    <text x="77" y="34" class="txt-stage-sub">V₁ ⟹ V₂ ⟹ V₃</text>
    <line x1="10" y1="42" x2="145" y2="42" stroke="#cbd5e1" />
    <text x="77" y="58" class="txt-stage-desc">Static AST &amp; schema</text>
    <text x="77" y="72" class="txt-stage-desc">Hermetic test suite</text>
    <text x="77" y="84" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#475569" text-anchor="middle">Prunes test cheaters</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 345 66 L 363 66" class="edge" marker-end="url(#arr)" />

  <!-- Stage 3 -->
  <g transform="translate(365, 20)">
    <rect width="155" height="92" class="stage-block" />
    <text x="77" y="20" class="hdr-stage">Role Labeling</text>
    <text x="77" y="34" class="txt-stage-sub">Archetype Partition</text>
    <line x1="10" y1="42" x2="145" y2="42" stroke="#cbd5e1" />
    <text x="77" y="58" class="txt-stage-desc">Pristine paths (70%)</text>
    <text x="77" y="72" class="txt-stage-desc">Recovery paths (30%)</text>
    <text x="77" y="84" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#475569" text-anchor="middle">Hard negative mining</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 520 66 L 538 66" class="edge" marker-end="url(#arr)" />

  <!-- Stage 4 -->
  <g transform="translate(540, 20)">
    <rect width="155" height="92" class="stage-block" />
    <text x="77" y="20" class="hdr-stage">3-Pass Redaction</text>
    <text x="77" y="34" class="txt-stage-sub">Syntactic Integrity</text>
    <line x1="10" y1="42" x2="145" y2="42" stroke="#cbd5e1" />
    <text x="77" y="58" class="txt-stage-desc">DFA regex + entropy</text>
    <text x="77" y="72" class="txt-stage-desc">NER employee / IP</text>
    <text x="77" y="84" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#475569" text-anchor="middle">AST token masking</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 695 66 L 713 66" class="edge" marker-end="url(#arr)" />

  <!-- Stage 5 -->
  <g transform="translate(715, 20)">
    <rect width="155" height="92" class="stage-block" />
    <text x="77" y="20" class="hdr-stage">Provenance Seal</text>
    <text x="77" y="34" class="txt-stage-sub">Merkle Lineage</text>
    <line x1="10" y1="42" x2="145" y2="42" stroke="#cbd5e1" />
    <text x="77" y="58" class="txt-stage-desc">SHA-256 Merkle root</text>
    <text x="77" y="72" class="txt-stage-desc">Checkpoint / tool digest</text>
    <text x="77" y="84" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#475569" text-anchor="middle">H_lineage HMAC key</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 870 66 L 888 66" class="edge" marker-end="url(#arr)" />

  <!-- Stage 6 -->
  <g transform="translate(890, 20)">
    <rect width="155" height="92" class="stage-final" />
    <text x="77" y="20" class="hdr-final">Split Partition</text>
    <text x="77" y="34" class="txt-stage-sub" fill="#047857">AST Deduplication</text>
    <line x1="10" y1="42" x2="145" y2="42" stroke="#a7f3d0" />
    <text x="77" y="58" class="txt-stage-desc">Repo-family disjoint</text>
    <text x="77" y="72" class="txt-stage-desc">Action seq dedup</text>
    <text x="77" y="84" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" font-weight="700" fill="#047857" text-anchor="middle">Corpus: D_train / D_eval</text>
  </g>

  <!-- Closed-Loop Flywheel Retraining Return Arc (Stage 6 -> Stage 1) -->
  <path d="M 967 112 C 967 146, 92 146, 92 114" class="edge-flywheel" marker-end="url(#arr-green)" />
  <rect x="360" y="134" width="340" height="22" fill="#ffffff" stroke="#10b981" stroke-width="1.2" rx="3" />
  <text x="530" y="149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#047857" text-anchor="middle">Closed-Loop Data Flywheel: Policy Adaptation Retraining</text>

  <!-- ==================== BOTTOM PANEL: QUANTITATIVE SYSTEMS CURVE ==================== -->
  <rect x="50" y="165" width="960" height="375" class="chart-bg" />

  <!-- Horizontal Gridlines -->
  <line x1="120" y1="480" x2="940" y2="480" class="grid" />
  <line x1="120" y1="410" x2="940" y2="410" class="grid" />
  <line x1="120" y1="340" x2="940" y2="340" class="grid" />
  <line x1="120" y1="270" x2="940" y2="270" class="grid" />
  <line x1="120" y1="200" x2="940" y2="200" class="grid" />

  <!-- Y1 Axis (Left): Accepted Trajectory Yield (η) -->
  <line x1="120" y1="190" x2="120" y2="480" class="axis" stroke="#d97706" />
  <text x="110" y="484" class="axis-lbl-l">0%</text>
  <text x="110" y="414" class="axis-lbl-l">25%</text>
  <text x="110" y="344" class="axis-lbl-l">50%</text>
  <text x="110" y="274" class="axis-lbl-l">75%</text>
  <text x="110" y="204" class="axis-lbl-l">100%</text>
  <text x="68" y="335" class="axis-title-l" transform="rotate(-90 68 335)">Accepted Yield η (%)</text>

  <!-- Y2 Axis (Right): Downstream Task Pass Rate (P_task) -->
  <line x1="940" y1="190" x2="940" y2="480" class="axis" stroke="#2563eb" />
  <text x="950" y="484" class="axis-lbl-r">0%</text>
  <text x="950" y="414" class="axis-lbl-r">12.5%</text>
  <text x="950" y="344" class="axis-lbl-r">25.0%</text>
  <text x="950" y="274" class="axis-lbl-r">37.5%</text>
  <text x="950" y="204" class="axis-lbl-r">50.0%</text>
  <text x="992" y="335" class="axis-title-r" transform="rotate(90 992 335)">Downstream Pass Rate P_task (%)</text>

  <!-- X-Axis Baseline & Ticks -->
  <line x1="120" y1="480" x2="940" y2="480" class="axis" />
  
  <line x1="170" y1="480" x2="170" y2="485" class="axis-tick" />
  <line x1="360" y1="480" x2="360" y2="485" class="axis-tick" />
  <line x1="550" y1="480" x2="550" y2="485" class="axis-tick" />
  <line x1="740" y1="480" x2="740" y2="485" class="axis-tick" />
  <line x1="910" y1="480" x2="910" y2="485" class="axis-tick" />

  <text x="170" y="500" class="axis-lbl" font-weight="600">Unfiltered Logs</text>
  <text x="170" y="512" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#64748b" text-anchor="middle">Baseline (Raw)</text>

  <text x="360" y="500" class="axis-lbl" font-weight="600">Static Filter (V₁)</text>
  <text x="360" y="512" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#64748b" text-anchor="middle">AST &amp; Syntax</text>

  <text x="550" y="500" class="axis-lbl" font-weight="600">Cascade (V₁→V₂)</text>
  <text x="550" y="512" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#64748b" text-anchor="middle">MicroVM Sandbox</text>

  <text x="740" y="500" class="axis-lbl" font-weight="600">Cascade + Recovery (V₃)</text>
  <text x="740" y="512" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#64748b" text-anchor="middle">Self-Healing Traces</text>

  <text x="910" y="500" class="axis-lbl" font-weight="700" fill="#047857">Full Harvester</text>
  <text x="910" y="512" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" font-weight="700" fill="#047857" text-anchor="middle">Lineage &amp; Splits</text>

  <!-- Curve 1: Accepted Trajectory Retention Yield (η) in Orange -->
  <path d="M 170 200 C 260 270, 310 300, 360 317 C 430 340, 490 415, 550 431 C 630 440, 680 439, 740 440.5 C 810 442, 860 443, 910 444" class="curve-yield" />

  <!-- Curve 2: Downstream Task Pass Rate (P_task) in Blue -->
  <path d="M 170 417.3 C 250 405, 300 385, 360 375.8 C 430 360, 490 340, 550 326.6 C 630 305, 680 285, 740 273.9 C 810 260, 860 248, 910 242.0" class="curve-pass" />

  <!-- Dots & Labels for Yield Curve -->
  <circle cx="170" cy="200" r="4.5" class="dot-yield" />
  <text x="170" y="190" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" font-weight="700" fill="#d97706" text-anchor="middle">100.0%</text>

  <circle cx="360" cy="317" r="4.5" class="dot-yield" />
  <text x="360" y="309" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" font-weight="700" fill="#d97706" text-anchor="middle">58.2%</text>

  <circle cx="550" cy="431" r="4.5" class="dot-yield" />
  <text x="550" y="423" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" font-weight="700" fill="#d97706" text-anchor="middle">17.4%</text>

  <circle cx="740" cy="440.5" r="4.5" class="dot-yield" />
  <text x="740" y="432" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" font-weight="700" fill="#d97706" text-anchor="middle">14.1%</text>

  <circle cx="910" cy="444" r="4.5" class="dot-yield" />
  <text x="910" y="436" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" font-weight="700" fill="#d97706" text-anchor="middle">12.8%</text>

  <!-- Dots & Labels for Pass Rate Curve -->
  <circle cx="170" cy="417.3" r="4.5" class="dot-pass" />
  <text x="170" y="434" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" font-weight="700" fill="#2563eb" text-anchor="middle">11.2%</text>

  <circle cx="360" cy="375.8" r="4.5" class="dot-pass" />
  <text x="360" y="392" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" font-weight="700" fill="#2563eb" text-anchor="middle">18.6%</text>

  <circle cx="550" cy="326.6" r="4.5" class="dot-pass" />
  <text x="550" y="318" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" font-weight="700" fill="#2563eb" text-anchor="middle">27.4%</text>

  <circle cx="740" cy="273.9" r="4.5" class="dot-pass" />
  <text x="740" y="265" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" font-weight="700" fill="#2563eb" text-anchor="middle">36.8%</text>

  <circle cx="910" cy="242.0" r="4.5" class="dot-pass" />
  <text x="910" y="233" font-family="SFMono-Regular, Consolas, monospace" font-size="9px" font-weight="700" fill="#1d4ed8" text-anchor="middle">42.5% (Peak)</text>

  <!-- Architectural Callout 1: Mode collapse (clean pink callout at x=145, y=310) -->
  <g transform="translate(145, 310)">
    <rect width="145" height="34" class="callout-danger" />
    <text x="72" y="14" class="callout-title" fill="#be123c" text-anchor="middle">Unfiltered Log Hazard</text>
    <text x="72" y="26" class="callout-desc" fill="#9f1239" text-anchor="middle">Raw loops degrade policy to 11.2%</text>
  </g>

  <!-- Architectural Callout 2: Recovery boost -->
  <g transform="translate(635, 335)">
    <rect width="180" height="34" class="callout-box" />
    <text x="90" y="14" class="callout-title" text-anchor="middle">Recovery Mining Inflection</text>
    <text x="90" y="26" class="callout-desc" text-anchor="middle">+9.4% task transfer via self-healing</text>
  </g>

  <!-- Legend in Chart -->
  <g transform="translate(380, 175)">
    <rect width="320" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3" />
    <line x1="14" y1="13" x2="38" y2="13" class="curve-yield" />
    <text x="46" y="17" class="legend-txt" fill="#b45309">Accepted Corpus Yield (η)</text>
    <line x1="175" y1="13" x2="199" y2="13" class="curve-pass" />
    <text x="207" y="17" class="legend-txt" fill="#1d4ed8">Downstream Task Pass Rate (P_task)</text>
  </g>

</svg>
