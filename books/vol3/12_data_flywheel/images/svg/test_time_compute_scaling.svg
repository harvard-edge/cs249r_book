<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="480" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT PANEL: TEST-TIME SCALING LAWS (Compute vs. Parameters)       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="430" height="348" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">A. TEST-TIME SCALING LAW: COMPUTE VS. PARAMETERS</text>

    <!-- Coordinate Axes -->
    <line x1="60" y1="300" x2="60" y2="44" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <line x1="60" y1="300" x2="410" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Y-Axis Grid & Ticks (20%, 40%, 60%, 80%, 100%) -->
    <line x1="60" y1="248" x2="400" y2="248" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="196" x2="400" y2="196" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="144" x2="400" y2="144" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="92" x2="400" y2="92" stroke="#e2e8f0" stroke-width="1"/>

    <text x="52" y="304" text-anchor="end" font-size="8" fill="#64748b">20%</text>
    <text x="52" y="252" text-anchor="end" font-size="8" fill="#64748b">40%</text>
    <text x="52" y="200" text-anchor="end" font-size="8" fill="#64748b">60%</text>
    <text x="52" y="148" text-anchor="end" font-size="8" fill="#64748b">80%</text>
    <text x="52" y="96" text-anchor="end" font-size="8" font-weight="700" fill="#0f172a">100%</text>

    <text x="18" y="196" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155" transform="rotate(-90 18 196)">Task Accuracy (%)</text>

    <!-- X-Axis Labels -->
    <text x="80" y="316" font-size="7.5" fill="#64748b">1× (Greedy)</text>
    <text x="180" y="316" font-size="7.5" fill="#64748b">10×</text>
    <text x="280" y="316" font-size="7.5" fill="#64748b">100×</text>
    <text x="375" y="316" font-size="7.5" fill="#64748b">1000×</text>
    <text x="235" y="336" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Inference Test-Time Compute (Search Tokens, log scale)</text>

    <!-- 70B Static Greedy Baseline (64%) -->
    <line x1="60" y1="186" x2="400" y2="186" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5 4"/>
    <rect x="250" y="173" width="145" height="18" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="322" y="186" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">70B Dense Model (Greedy: 64%)</text>

    <!-- 7B Static Greedy Baseline (32%) -->
    <line x1="60" y1="269" x2="400" y2="269" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="265" y="258" width="130" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="330" y="271" text-anchor="middle" font-size="7.5" font-weight="600" fill="#64748b">7B Model (Greedy: 32%)</text>

    <!-- 7B + Test-Time Search Scaling Curve (Purple) -->
    <path d="M 60 269 Q 130 260, 190 208 T 300 148 T 400 128" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="60" cy="269" r="3.5" fill="#7c3aed"/>
    <circle cx="190" cy="208" r="4" fill="#7c3aed"/>
    <circle cx="300" cy="148" r="4.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="400" cy="128" r="4.5" fill="#6d28d9" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Callout: Pareto Frontier Inversion -->
    <g transform="translate(145, 60)">
      <rect x="0" y="0" width="168" height="42" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="84" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Pareto Frontier Inversion</text>
      <text x="84" y="32" text-anchor="middle" font-size="7" fill="#475569">7B + Search matches 70B at 14× tokens</text>
      <line x1="84" y1="42" x2="84" y2="82" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#arr-purple)"/>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: VERIFICATION TAX & PRUNING ECONOMICS                 -->
  <!-- ================================================================= -->
  <g transform="translate(490, 74)">
    <rect x="0" y="0" width="430" height="348" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">B. THE VERIFICATION TAX: PRUNING VS. GENERATION</text>

    <!-- Box 1: Unverified Search Explosion -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="406" height="116" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="8" width="220" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="16" y="21" font-size="8" font-weight="700" fill="#991b1b">Unverified Search (Best-of-N / Blind DFS)</text>

      <text x="10" y="44" font-size="7.5" fill="#334155">• Branching factor: <tspan font-weight="700" fill="#dc2626">b = 5</tspan> | Horizon depth: <tspan font-weight="700" fill="#dc2626">d = 4 steps</tspan></text>
      <text x="10" y="58" font-size="7.5" fill="#334155">• Total Rollout Paths: <tspan font-weight="700" font-family="Courier, monospace">5⁴ = 625 full trajectories</tspan></text>
      <text x="10" y="72" font-size="7.5" fill="#334155">• Token Expenditure: <tspan font-weight="700" fill="#991b1b">625 × 2,048 tokens = 1.28M tokens</tspan></text>

      <rect x="10" y="82" width="386" height="24" rx="1" fill="#fee2e2"/>
      <text x="203" y="98" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">Severe Compute Waste: 92% of paths fail due to unpruned early faults</text>
    </g>

    <!-- Box 2: Verifier-Pruned Search -->
    <g transform="translate(12, 160)">
      <rect x="0" y="0" width="406" height="136" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="10" y="8" width="240" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="16" y="21" font-size="8" font-weight="700" fill="#15803d">Verifier-Pruned Search (PRM / Unit Test Oracles)</text>

      <text x="10" y="44" font-size="7.5" fill="#334155">• Intermediate Verification: Step check costs <tspan font-weight="700" fill="#15803d">C_ver ≈ 0.05 × C_gen</tspan></text>
      <text x="10" y="58" font-size="7.5" fill="#334155">• Effective Branching Factor: <tspan font-weight="700" fill="#16a34a">b_eff = 1.6</tspan> (faulty branches pruned early)</text>
      <text x="10" y="72" font-size="7.5" fill="#334155">• Explored Nodes: <tspan font-weight="700" font-family="Courier, monospace">1.6⁴ ≈ 6.5 effective paths (98.9% pruned!)</tspan></text>
      <text x="10" y="86" font-size="7.5" fill="#334155">• Total Net Compute: <tspan font-weight="700" fill="#15803d">C_total = Σ N_k · (C_gen + C_ver) ≪ C_blind</tspan></text>

      <rect x="10" y="96" width="386" height="28" rx="1" fill="#dcfce7"/>
      <text x="203" y="109" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Verification Tax Paradox:</text>
      <text x="203" y="119" text-anchor="middle" font-size="7" fill="#166534">Spending 5% compute on validation saves 90%+ total generation FLOPs</text>
    </g>

    <!-- Summary Note -->
    <g transform="translate(12, 306)">
      <rect x="0" y="0" width="406" height="32" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="7.5" font-weight="700" fill="#0f172a">Computational Dynamic:</text>
      <text x="10" y="25" font-size="7" fill="#475569">Process supervision bounds search width, shifting budget from width to depth.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM BANNER: FUNDAMENTAL INVARIANT                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 434)">
    <rect x="0" y="0" width="880" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="52" rx="1" fill="#7c3aed"/>
    <text x="14" y="18" font-size="8.5" font-weight="700" fill="#0f172a">FUNDAMENTAL INVARIANT: THE TEST-TIME COMPUTE PARETO FRONTIER</text>
    <text x="14" y="34" font-size="7.5" fill="#475569">Scaling test-time search with process verification expands reasoning capacity at constant parameter count, breaking pre-training</text>
    <text x="14" y="45" font-size="7.5" fill="#475569">parameter scaling bottlenecks and establishing a dual axis of machine learning systems efficiency.</text>
  </g>

</g>
</svg>