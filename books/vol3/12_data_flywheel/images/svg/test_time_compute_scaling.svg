<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7E22CE"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" fill="#F8FAFC" rx="2"/>

  <!-- Top Header Banner -->
  <rect x="16" y="16" width="928" height="58" rx="2" fill="url(#headerGrad)"/>
  <text x="36" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Test-Time Compute Scaling &amp; The Verification Tax</text>
  <text x="36" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E9D5FF">Inference Search Topologies vs. Parameter Scaling Laws (Snell et al. 2024, OpenAI o1)</text>

  <!-- LEFT PANEL: Scaling Laws Curve -->
  <rect x="16" y="86" width="456" height="320" rx="2" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
  
  <rect x="28" y="98" width="432" height="26" rx="4" fill="#F1F5F9"/>
  <text x="38" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E293B">A. Test-Time Scaling Law: Compute vs. Parameter Size</text>

  <!-- Coordinate System -->
  <!-- Y-Axis -->
  <line x1="70" y1="345" x2="70" y2="140" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- X-Axis -->
  <line x1="70" y1="345" x2="445" y2="345" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ticks and Labels -->
  <text x="60" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="end">100%</text>
  <text x="60" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="end">80%</text>
  <text x="60" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="end">60%</text>
  <text x="60" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="end">40%</text>
  <text x="60" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="end">20%</text>

  <!-- Grid lines -->
  <line x1="70" y1="195" x2="440" y2="195" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="70" y1="245" x2="440" y2="245" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="70" y1="295" x2="440" y2="295" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Axis Titles -->
  <text x="24" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#475569" transform="rotate(-90 24 245)" text-anchor="middle">Task Accuracy / Success Rate (%)</text>
  
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">1× (Greedy)</text>
  <text x="180" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">10×</text>
  <text x="290" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">100×</text>
  <text x="400" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">1000×</text>
  <text x="260" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Inference Test-Time Compute (Search Tokens, log scale)</text>

  <!-- Baseline Curve: 70B Static Greedy Model -->
  <line x1="70" y1="235" x2="435" y2="235" stroke="#0284C7" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="295" y="220" width="135" height="18" rx="3" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1"/>
  <text x="362" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0369A1" text-anchor="middle">70B Dense Model (Greedy: 64%)</text>

  <!-- Baseline Curve: 7B Static Greedy Model -->
  <line x1="70" y1="315" x2="435" y2="315" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="305" y="302" width="125" height="16" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="367" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">7B Model (Greedy: 32%)</text>

  <!-- Dynamic Test-Time Search Scaling Curve (Purple) -->
  <path d="M 70 315 Q 140 305, 200 255 T 320 190 T 435 170" fill="none" stroke="#7E22CE" stroke-width="3.5"/>

  <!-- Markers on Curve -->
  <circle cx="70" cy="315" r="4" fill="#7E22CE"/>
  <circle cx="200" cy="255" r="4.5" fill="#7E22CE"/>
  <circle cx="320" cy="190" r="5" fill="#9333EA" stroke="#FAF5FF" stroke-width="2"/>
  <circle cx="435" cy="170" r="5" fill="#581C87" stroke="#FAF5FF" stroke-width="2"/>

  <!-- Callout annotation: Pareto Inversion -->
  <rect x="180" y="135" width="180" height="44" rx="4" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.2"/>
  <text x="270" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#581C87" text-anchor="middle">Pareto Frontier Inversion</text>
  <text x="270" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#6B21A8" text-anchor="middle">7B + Search matches 70B Greedy at 14×</text>
  <line x1="270" y1="179" x2="245" y2="222" stroke="#7E22CE" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#purpleArrow)"/>


  <!-- RIGHT PANEL: Verification Tax & Search Pruning -->
  <rect x="488" y="86" width="456" height="320" rx="2" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
  
  <rect x="500" y="98" width="432" height="26" rx="4" fill="#F1F5F9"/>
  <text x="510" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E293B">B. The Verification Tax: Pruning vs. Generation</text>

  <!-- Box 1: Unverified Search Explosion -->
  <rect x="504" y="132" width="424" height="105" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
  <rect x="514" y="140" width="215" height="18" rx="3" fill="#FEE2E2"/>
  <text x="520" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#991B1B">Unverified Search (Best-of-N / Blind DFS)</text>

  <text x="516" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">• Branching factor: <tspan font-weight="700" fill="#DC2626">b = 5</tspan> | Horizon depth: <tspan font-weight="700" fill="#DC2626">d = 4 steps</tspan></text>
  <text x="516" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">• Total Rollout Paths: <tspan font-weight="700" font-family="monospace">5⁴ = 625 full trajectories</tspan></text>
  <text x="516" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">• Token Expenditure: <tspan font-weight="700" fill="#B91C1C">625 × 2,048 tokens = 1.28M tokens</tspan></text>

  <rect x="514" y="214" width="404" height="16" rx="3" fill="#F87171" fill-opacity="0.2"/>
  <text x="716" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">Severe HBM &amp; Token Waste: 92% of paths fail due to unpruned early errors</text>

  <!-- Box 2: Verifier-Guided Search (PRM / Unit Tests) -->
  <rect x="504" y="246" width="424" height="150" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <rect x="514" y="254" width="215" height="18" rx="3" fill="#DCFCE7"/>
  <text x="520" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#166534">Verifier-Pruned Search (PRM / Test Oracles)</text>

  <text x="516" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">• Intermediate Verification: Step-level check costs <tspan font-weight="700" fill="#15803D">C_ver ≈ 0.05 × C_gen</tspan></text>
  <text x="516" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">• Effective Branching Factor: <tspan font-weight="700" fill="#16A34A">b_eff = 1.6</tspan> (faulty steps pruned early)</text>
  <text x="516" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">• Explored Nodes: <tspan font-weight="700" font-family="monospace">1.6⁴ ≈ 6.5 effective paths (98.9% pruned!)</tspan></text>
  <text x="516" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">• Total Net Compute: <tspan font-weight="700" fill="#15803D">C_total = Σ N_k · (C_gen + C_ver) ≪ C_blind</tspan></text>

  <rect x="514" y="346" width="404" height="20" rx="3" fill="#22C55E" fill-opacity="0.15"/>
  <text x="716" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Verification Tax Paradox: Spending 5% compute on validation saves 90%+ total FLOPs</text>


  <!-- BOTTOM BANNER: Invariant Statement -->
  <rect x="16" y="416" width="928" height="48" rx="2" fill="url(#purpleGrad)" stroke="#D8B4FE" stroke-width="1.2"/>
  <text x="36" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#581C87">Fundamental Invariant: The Test-Time Compute Pareto Frontier</text>
  <text x="36" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#4C1D95">Scaling test-time search with process verification expands reasoning capacity at constant parameter count, breaking pre-training parameter scaling bottlenecks.</text>
</svg>