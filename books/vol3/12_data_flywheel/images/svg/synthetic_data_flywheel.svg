<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="440" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- TOP ROW: FORWARD EXECUTION PIPELINE (STAGES 1, 2, 3)              -->
  <!-- ================================================================= -->

  <!-- Stage 1: Task & Seed Synthesis -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="245" height="150" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#1e293b">1. TASK &amp; SEED SYNTHESIS</text>

    <text x="10" y="42" font-size="8.0" fill="#334155">• Evol-Instruct / AST Mutation engines</text>
    <text x="10" y="56" font-size="8.0" fill="#334155">• Seed Environment Specs (Git repo, DB schema)</text>
    <text x="10" y="70" font-size="8.0" fill="#334155">• Invariant rules &amp; unit test harnesses</text>

    <g transform="translate(10, 84)">
      <rect x="0" y="0" width="225" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8.0" font-weight="700" fill="#0f172a">Seed Generation Primitive:</text>
      <text x="8" y="29" font-family="Courier, monospace" font-size="8.0" fill="#64748b">seed_task(id, env_cfg, assert_suite)</text>
      <text x="8" y="43" font-size="8.0" fill="#0284c7">Generates diverse OOD reasoning boundaries</text>
    </g>
  </g>

  <!-- Arrow: Stage 1 -> Stage 2 -->
  <line x1="285" y1="149" x2="322" y2="149" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="303" y="141" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0284c7">batch_tasks</text>

  <!-- Stage 2: GPU Rollout Inference Fleet -->
  <g transform="translate(325, 74)">
    <rect x="0" y="0" width="270" height="150" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#0369a1">2. GPU ROLLOUT FLEET (Policy π_k)</text>

    <text x="10" y="42" font-size="8.0" fill="#0c4a6e">• Continuous Batching (vLLM / SGLang)</text>
    <text x="10" y="56" font-size="8.0" fill="#0c4a6e">• Stochastic sampling: T ∈ [0.6, 0.8]</text>
    <text x="10" y="70" font-size="8.0" fill="#0c4a6e">• N rollouts per task: τ_1 ... τ_N ~ π_k</text>

    <g transform="translate(10, 84)">
      <rect x="0" y="0" width="250" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8.0" font-weight="700" fill="#0284c7">Accelerator Optimization:</text>
      <text x="8" y="29" font-size="8.0" fill="#334155">RadixAttention prefix caching maximizes HBM reuse</text>
      <text x="8" y="43" font-size="8.0" font-weight="700" fill="#0369a1">High Arithmetic Intensity GEMM saturation</text>
    </g>
  </g>

  <!-- Arrow: Stage 2 -> Stage 3 -->
  <line x1="595" y1="149" x2="632" y2="149" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="613" y="141" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#b45309">stream(τ_i)</text>

  <!-- Stage 3: Asynchronous Dispatch Broker -->
  <g transform="translate(635, 74)">
    <rect x="0" y="0" width="245" height="150" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#b45309">3. ASYNCHRONOUS DISPATCH BROKER</text>

    <text x="10" y="42" font-size="8.0" fill="#78350f">• Decouples GPU FLOPs from sandbox stalls</text>
    <text x="10" y="56" font-size="8.0" fill="#78350f">• Sharded priority ingestion buffer</text>
    <text x="10" y="70" font-size="8.0" fill="#78350f">• In-flight tool observations routing</text>

    <g transform="translate(10, 84)">
      <rect x="0" y="0" width="225" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8.0" font-weight="700" fill="#b45309">Streaming Bus Primitive:</text>
      <text x="8" y="29" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">kafka_topic: raw_trajectories</text>
      <text x="8" y="43" font-size="8.0" fill="#64748b">Round-robin partitioning across CPU hosts</text>
    </g>
  </g>

  <!-- Connector: Stage 3 -> Stage 4 (Downwards) -->
  <line x1="757" y1="224" x2="757" y2="261" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="765" y="246" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#b45309">dispatch()</text>

  <!-- ================================================================= -->
  <!-- BOTTOM ROW: BACKWARD VERIFICATION & CURATION (STAGES 4, 5, 6)     -->
  <!-- ================================================================= -->

  <!-- Stage 4: CPU MicroVM Verification Oracles -->
  <g transform="translate(635, 264)">
    <rect x="0" y="0" width="245" height="176" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#1e293b">4. CPU MICROVM ORACLES</text>

    <text x="10" y="42" font-size="8.0" fill="#334155">• Ephemeral sandboxes (Firecracker / gVisor)</text>
    <text x="10" y="56" font-size="8.0" fill="#334155">• Step invariant validation &amp; schema check</text>
    <text x="10" y="70" font-size="8.0" fill="#334155">• Hermetic test suites (pytest, ctest, gcc)</text>
    <text x="10" y="84" font-size="8.0" fill="#334155">• Deterministic state diff audits (git diff)</text>

    <g transform="translate(10, 96)">
      <rect x="0" y="0" width="225" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8.0" font-weight="700" fill="#15803d">Deterministic Verification Signal:</text>
      <text x="8" y="30" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0f172a">Verdict: R(τ) ∈ {0.0, 1.0}</text>
      <text x="8" y="45" font-size="8.0" fill="#475569">Pass: Oracle Exit Code 0 | Zero leak</text>
      <text x="8" y="57" font-size="8.0" fill="#dc2626">Fail: Immediate short-circuit isolation</text>
    </g>
  </g>

  <!-- Arrow: Stage 4 -> Stage 5 -->
  <line x1="635" y1="352" x2="598" y2="352" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="616" y="344" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">evaluated</text>

  <!-- Stage 5: Bifurcated Curation -->
  <g transform="translate(325, 264)">
    <rect x="0" y="0" width="270" height="176" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#15803d">5. BIFURCATED CURATION</text>

    <!-- Pass Pool -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="250" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#15803d">Pass Pool (R = 1.0):</text>
      <text x="96" y="14" font-size="8.0" fill="#334155">Min-step golden paths (SFT)</text>
      <text x="8" y="24" font-size="8.0" fill="#64748b">Prunes redundant retries: τ* = argmin |τ|</text>
    </g>

    <!-- Fail Pool -->
    <g transform="translate(10, 66)">
      <rect x="0" y="0" width="250" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#dc2626">Fail Pool (R = 0.0):</text>
      <text x="96" y="14" font-size="8.0" fill="#334155">Error step mining t* (DAgger/RL)</text>
      <text x="8" y="24" font-size="8.0" fill="#64748b">Identifies divergence pivot for repair</text>
    </g>

    <g transform="translate(10, 102)">
      <rect x="0" y="0" width="250" height="60" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#0f172a">Dataset Partitions:</text>
      <text x="8" y="28" font-family="Courier, monospace" font-size="8.0" fill="#16a34a">D_sft = {τ*}, D_rlvr = {τ_pos, τ_neg}</text>
      <text x="8" y="42" font-size="8.0" fill="#475569">Invariant: 70% Golden Paths + 30% Recovery</text>
      <text x="8" y="53" font-size="8.0" font-weight="700" fill="#15803d">Bounds compounding covariate shift</text>
    </g>
  </g>

  <!-- Arrow: Stage 5 -> Stage 6 -->
  <line x1="325" y1="352" x2="288" y2="352" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="306" y="344" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#6d28d9">curated</text>

  <!-- Stage 6: Policy Compilation & Training -->
  <g transform="translate(40, 264)">
    <rect x="0" y="0" width="245" height="176" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#6d28d9">6. POLICY COMPILATION (SFT / RLVR)</text>

    <text x="10" y="42" font-size="8.0" fill="#4c1d95">• Selective loss masking: (M_t ⊙ ∇L_CE)</text>
    <text x="10" y="56" font-size="8.0" fill="#4c1d95">• Environment returns strictly masked</text>
    <text x="10" y="70" font-size="8.0" fill="#4c1d95">• GRPO / PPO Group Relative Advantage</text>
    <text x="10" y="84" font-size="8.0" fill="#4c1d95">• Weight checkpointing &amp; eval benchmarks</text>

    <g transform="translate(10, 96)">
      <rect x="0" y="0" width="225" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8.0" font-weight="700" fill="#6d28d9">Flywheel Evolution Step:</text>
      <text x="8" y="30" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0f172a">π_{k+1} = argmin E[L_flywheel(π_k)]</text>
      <text x="8" y="45" font-size="8.0" fill="#475569">Compiled model artifacts serialized to NVMe</text>
      <text x="8" y="57" font-size="8.0" font-weight="700" fill="#6d28d9">Deploys to GPU rollout inference cluster</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- FLYWHEEL CLOSING LOOP: Stage 6 -> Stage 2                         -->
  <!-- ================================================================= -->
  <path d="M 162 264 L 162 238 L 460 238 L 460 227" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arr-purple)"/>
  <rect x="220" y="230" width="180" height="16" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="310" y="241" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#6d28d9">deploy(π_{k+1}) [CLOSED LOOP]</text>

</g>
</svg>