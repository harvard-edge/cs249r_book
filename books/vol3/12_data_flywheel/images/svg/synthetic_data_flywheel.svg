<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="400" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- 1. TASK SEED SYNTHESIS (x: 40, y: 35, w: 220, h: 85)              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="220" height="85" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">1. TASK &amp; SEED SYNTHESIS</text>
    <text x="10" y="34" font-size="7.5" fill="#334155">• Evol-Instruct / AST Mutation</text>
    <text x="10" y="48" font-size="7.5" fill="#334155">• Seed Environment Specs (Repo, DB)</text>
    <text x="10" y="62" font-size="7.5" fill="#334155">• Invariant &amp; Test Oracle Rules</text>
    <text x="10" y="76" font-family="Courier, monospace" font-size="7" fill="#64748b">seed_task(id, env_cfg, assert_suite)</text>
  </g>

  <!-- Arrow: Task Synthesis -> GPU Rollout Fleet -->
  <path d="M260,77 L320,77" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="290" y="70" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#0369a1">batch_tasks</text>

  <!-- ================================================================= -->
  <!-- 2. GPU ROLLOUT INFERENCE FLEET (x: 320, y: 35, w: 260, h: 85)      -->
  <!-- ================================================================= -->
  <g transform="translate(320, 35)">
    <rect x="0" y="0" width="260" height="85" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="130" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">2. GPU ROLLOUT FLEET (Policy π_k)</text>
    <text x="10" y="34" font-size="7.5" fill="#0c4a6e">• Continuous Batching (vLLM / SGLang)</text>
    <text x="10" y="48" font-size="7.5" fill="#0c4a6e">• Stochastic Sampling: T ∈ [0.6, 0.8]</text>
    <text x="10" y="62" font-size="7.5" fill="#0c4a6e">• N Rollouts per Task: τ_1 ... τ_N ~ π_k</text>
    <text x="10" y="76" font-family="Courier, monospace" font-size="7" fill="#0284c7">High Arithmetic Intensity GEMM saturation</text>
  </g>

  <!-- Arrow: Rollout Fleet -> Message Broker -->
  <path d="M580,77 L650,77 L650,140" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="630" y="70" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#b45309">stream(τ_i)</text>

  <!-- ================================================================= -->
  <!-- 3. ASYNCHRONOUS BROKER / QUEUE (x: 570, y: 140, w: 290, h: 75)   -->
  <!-- ================================================================= -->
  <g transform="translate(570, 140)">
    <rect x="0" y="0" width="290" height="75" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="145" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">3. ASYNCHRONOUS DISPATCH BROKER</text>
    <text x="10" y="34" font-size="7.5" fill="#78350f">• Decouples GPU inference from tool/sandbox stalls</text>
    <text x="10" y="48" font-size="7.5" fill="#78350f">• Sharded Priority Queue / Ingestion Buffer</text>
    <text x="10" y="64" font-family="Courier, monospace" font-size="7" fill="#b45309">kafka_topic: raw_trajectories (round-robin)</text>
  </g>

  <!-- Arrow: Broker -> CPU Verification Cluster -->
  <path d="M715,215 L715,260" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="725" y="240" font-family="Courier, monospace" font-size="7" fill="#b45309">dispatch()</text>

  <!-- ================================================================= -->
  <!-- 4. CPU VERIFICATION ORACLE FLEET (x: 570, y: 260, w: 290, h: 95)  -->
  <!-- ================================================================= -->
  <g transform="translate(570, 260)">
    <rect x="0" y="0" width="290" height="95" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="145" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">4. CPU MICROVM VERIFICATION ORACLES</text>
    <text x="10" y="34" font-size="7.5" fill="#334155">• Ephemeral Sandboxes (Firecracker / gVisor)</text>
    <text x="10" y="48" font-size="7.5" fill="#334155">• Step Invariant Validation &amp; Schema Gate</text>
    <text x="10" y="62" font-size="7.5" fill="#334155">• Hermetic Unit Test Execution (pytest, compiler)</text>
    <text x="10" y="80" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">Verdict: R(τ) ∈ {0.0, 1.0} Deterministic Signal</text>
  </g>

  <!-- Arrow: Verification -> Curation -->
  <path d="M570,307 L510,307" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="540" y="300" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#15803d">evaluated</text>

  <!-- ================================================================= -->
  <!-- 5. BIFURCATED CURATION & RECOVERY (x: 270, y: 260, w: 240, h: 95)  -->
  <!-- ================================================================= -->
  <g transform="translate(270, 260)">
    <rect x="0" y="0" width="240" height="95" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="120" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">5. BIFURCATED CURATION</text>
    <text x="10" y="34" font-size="7.5" font-weight="700" fill="#15803d">Pass Pool (R=1):</text>
    <text x="85" y="34" font-size="7.5" fill="#334155">Min-step golden paths (SFT)</text>
    <text x="10" y="52" font-size="7.5" font-weight="700" fill="#b91c1c">Fail Pool (R=0):</text>
    <text x="85" y="52" font-size="7.5" fill="#334155">Error step mining t* (DAgger/RLVR)</text>
    <text x="10" y="70" font-size="7.5" fill="#475569">• Trajectory Deduplication &amp; Length Filtering</text>
    <text x="10" y="84" font-family="Courier, monospace" font-size="7" fill="#16a34a">D_sft = {τ*}, D_rlvr = {τ_pos, τ_neg}</text>
  </g>

  <!-- Arrow: Curation -> Policy Optimization -->
  <path d="M270,307 L190,307 L190,245" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="182" y="280" text-anchor="end" font-family="Courier, monospace" font-size="7" fill="#6d28d9">curated_data</text>

  <!-- ================================================================= -->
  <!-- 6. POLICY TRAINING & COMPILATION (x: 40, y: 160, w: 220, h: 85)   -->
  <!-- ================================================================= -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="220" height="85" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="20" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="110" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">6. POLICY COMPILATION (SFT / RLVR)</text>
    <text x="10" y="34" font-size="7.5" fill="#4c1d95">• Selective Loss Masking (M_t ⊙ ∇L)</text>
    <text x="10" y="48" font-size="7.5" fill="#4c1d95">• GRPO / PPO Group Relative Advantage</text>
    <text x="10" y="62" font-size="7.5" fill="#4c1d95">• Weight Checkpoint &amp; Eval Benchmark</text>
    <text x="10" y="76" font-family="Courier, monospace" font-size="7" fill="#7c3aed">Policy Evolution: π_k → π_{k+1}</text>
  </g>

  <!-- Arrow: Policy Optimization -> GPU Rollout Fleet (CLOSING THE FLYWHEEL LOOP) -->
  <path d="M260,195 L290,195 L290,100 L320,100" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="296" y="152" font-family="Courier, monospace" font-size="7.2" font-weight="700" fill="#6d28d9">deploy(π_{k+1})</text>

</svg>
