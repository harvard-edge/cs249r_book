<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: BEST-OF-N SAMPLING (Blue)                               -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="210" height="360" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#0369a1">1. BEST-OF-N SAMPLING</text>

    <!-- Mini Topology Diagram -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="190" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Root Node -->
      <circle cx="28" cy="48" r="8" fill="#0284c7"/>
      <text x="28" y="51" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">s₀</text>

      <!-- Diverging Branches -->
      <line x1="36" y1="44" x2="132" y2="18" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="36" y1="46" x2="132" y2="38" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="36" y1="50" x2="132" y2="58" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <line x1="36" y1="52" x2="132" y2="78" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>

      <!-- Leaf Nodes -->
      <rect x="136" y="12" width="46" height="13" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="159" y="21" font-size="7" font-weight="600" fill="#991b1b" text-anchor="middle">r = 0.1</text>

      <rect x="136" y="32" width="46" height="13" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="159" y="41" font-size="7" font-weight="600" fill="#991b1b" text-anchor="middle">r = 0.4</text>

      <rect x="136" y="52" width="48" height="13" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="160" y="61" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">r = 0.95 ★</text>

      <rect x="136" y="72" width="46" height="13" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="159" y="81" font-size="7" font-weight="600" fill="#991b1b" text-anchor="middle">r = 0.2</text>
    </g>

    <!-- Details -->
    <g transform="translate(10, 136)">
      <text x="0" y="10" font-size="8" font-weight="700" fill="#0f172a">Execution Topology:</text>
      <text x="0" y="23" font-size="7.5" fill="#475569">• Independent parallel 1D rollouts</text>
      <text x="0" y="35" font-size="7.5" fill="#475569">• Zero inter-branch communication</text>

      <text x="0" y="54" font-size="8" font-weight="700" fill="#0f172a">Evaluation Mechanism:</text>
      <text x="0" y="67" font-size="7.5" fill="#475569">• Sparse terminal reward / ORM</text>
      <text x="0" y="79" font-size="7.5" fill="#475569">• Majority vote or argmax at horizon H</text>

      <!-- Pros / Cons -->
      <rect x="0" y="91" width="190" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="106" font-size="7.5" font-weight="700" fill="#15803d">✓ High GPU batch saturation</text>
      <text x="8" y="122" font-size="7.5" font-weight="700" fill="#dc2626">✗ Redundant prefix prefill waste</text>

      <!-- Serving Profile -->
      <rect x="0" y="140" width="190" height="38" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="95" y="154" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">Profile: Embarrassingly Parallel</text>
      <text x="95" y="167" font-size="7" fill="#0284c7" text-anchor="middle">Static prefix cached via RadixAttention</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: BEAM SEARCH (Amber)                                     -->
  <!-- ================================================================= -->
  <g transform="translate(263, 74)">
    <rect x="0" y="0" width="210" height="360" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#b45309">2. BEAM SEARCH</text>

    <!-- Mini Topology Diagram -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="190" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Root -->
      <circle cx="24" cy="48" r="7" fill="#d97706"/>
      <!-- Ply 1 -->
      <line x1="31" y1="48" x2="68" y2="30" stroke="#d97706" stroke-width="1.5"/>
      <line x1="31" y1="48" x2="68" y2="66" stroke="#d97706" stroke-width="1.5"/>
      <circle cx="72" cy="30" r="5" fill="#d97706"/>
      <circle cx="72" cy="66" r="5" fill="#d97706"/>

      <!-- Ply 2: Pruning -->
      <line x1="77" y1="30" x2="118" y2="20" stroke="#d97706" stroke-width="1.5"/>
      <line x1="77" y1="30" x2="118" y2="38" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="77" y1="66" x2="118" y2="58" stroke="#d97706" stroke-width="1.5"/>
      <line x1="77" y1="66" x2="118" y2="76" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>

      <circle cx="122" cy="20" r="5" fill="#d97706"/>
      <circle cx="122" cy="38" r="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <circle cx="122" cy="58" r="5" fill="#d97706"/>
      <circle cx="122" cy="76" r="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>

      <!-- Ply 3: Top 1 -->
      <line x1="127" y1="20" x2="152" y2="34" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
      <line x1="127" y1="58" x2="152" y2="50" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)"/>
      <rect x="154" y="28" width="30" height="14" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="169" y="38" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">Top 1</text>
    </g>

    <!-- Details -->
    <g transform="translate(10, 136)">
      <text x="0" y="10" font-size="8" font-weight="700" fill="#0f172a">Execution Topology:</text>
      <text x="0" y="23" font-size="7.5" fill="#475569">• Synchronous width-bounded tree</text>
      <text x="0" y="35" font-size="7.5" fill="#475569">• Retains top-B hypotheses per step</text>

      <text x="0" y="54" font-size="8" font-weight="700" fill="#0f172a">Evaluation Mechanism:</text>
      <text x="0" y="67" font-size="7.5" fill="#475569">• Step-level PRM scoring / log-prob</text>
      <text x="0" y="79" font-size="7.5" fill="#475569">• Hard pruning at step frontier</text>

      <!-- Pros / Cons -->
      <rect x="0" y="91" width="190" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="106" font-size="7.5" font-weight="700" fill="#15803d">✓ Strict bounded memory usage</text>
      <text x="8" y="122" font-size="7.5" font-weight="700" fill="#dc2626">✗ Myopic pruning misses global optima</text>

      <!-- Serving Profile -->
      <rect x="0" y="140" width="190" height="38" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="95" y="154" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">Profile: Lock-Step Barrier</text>
      <text x="95" y="167" font-size="7" fill="#b45309" text-anchor="middle">Synchronous frontier batch sync</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: MONTE CARLO TREE SEARCH (Purple)                        -->
  <!-- ================================================================= -->
  <g transform="translate(486, 74)">
    <rect x="0" y="0" width="210" height="360" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#6d28d9">3. MONTE CARLO TREE (MCTS)</text>

    <!-- Mini Topology Diagram -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="190" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Root -->
      <circle cx="95" cy="18" r="7" fill="#7c3aed"/>

      <!-- Tree Nodes -->
      <line x1="91" y1="23" x2="62" y2="44" stroke="#7c3aed" stroke-width="1.5"/>
      <line x1="99" y1="23" x2="128" y2="44" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="60" cy="46" r="6" fill="#7c3aed"/>
      <circle cx="130" cy="46" r="5" fill="#cbd5e1"/>

      <!-- Selected Child -->
      <line x1="58" y1="52" x2="42" y2="74" stroke="#7c3aed" stroke-width="1.5"/>
      <line x1="62" y1="52" x2="78" y2="74" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="40" cy="76" r="6" fill="#16a34a" stroke="#15803d" stroke-width="1.2"/>
      <circle cx="80" cy="76" r="4" fill="#cbd5e1"/>

      <!-- Rollout / Backup curve -->
      <path d="M 46 76 Q 110 84, 150 72" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-orange)"/>
      <path d="M 150 70 Q 130 35, 105 20" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-gray)"/>

      <!-- Step Labels -->
      <rect x="8" y="8" width="46" height="12" rx="1" fill="#ede9fe"/>
      <text x="31" y="17" font-size="6.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Select/Expand</text>

      <rect x="138" y="78" width="44" height="12" rx="1" fill="#fef3c7"/>
      <text x="160" y="87" font-size="6.5" font-weight="700" fill="#b45309" text-anchor="middle">Sim &amp; Backup</text>
    </g>

    <!-- Details -->
    <g transform="translate(10, 136)">
      <text x="0" y="10" font-size="8" font-weight="700" fill="#0f172a">Execution Topology:</text>
      <text x="0" y="23" font-size="7.5" fill="#475569">• Asymmetric exploratory tree (UCT)</text>
      <text x="0" y="35" font-size="7.5" fill="#475569">• Balances exploration vs. exploitation</text>

      <text x="0" y="54" font-size="8" font-weight="700" fill="#0f172a">Evaluation Mechanism:</text>
      <text x="0" y="67" font-size="7.5" fill="#475569">• Value network + rollout simulation</text>
      <text x="0" y="79" font-size="7.5" fill="#475569">• Recursive value backup to tree root</text>

      <!-- Pros / Cons -->
      <rect x="0" y="91" width="190" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="106" font-size="7.5" font-weight="700" fill="#15803d">✓ Asymptotically optimal lookahead</text>
      <text x="8" y="122" font-size="7.5" font-weight="700" fill="#dc2626">✗ High latency &amp; tree state overhead</text>

      <!-- Serving Profile -->
      <rect x="0" y="140" width="190" height="38" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="95" y="154" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Profile: Asynchronous Tree</text>
      <text x="95" y="167" font-size="7" fill="#6d28d9" text-anchor="middle">Demands RadixTree KV-cache reuse</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 4: GRAPH OF THOUGHTS (Green)                               -->
  <!-- ================================================================= -->
  <g transform="translate(709, 74)">
    <rect x="0" y="0" width="211" height="360" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="211" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#15803d">4. GRAPH OF THOUGHTS (GoT)</text>

    <!-- Mini Topology Diagram -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="191" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- DAG Nodes -->
      <circle cx="24" cy="48" r="7" fill="#16a34a"/>
      <circle cx="68" cy="24" r="6" fill="#16a34a"/>
      <circle cx="68" cy="72" r="6" fill="#16a34a"/>
      <circle cx="124" cy="48" r="7" fill="#0284c7" stroke="#0369a1" stroke-width="1.2"/>
      <circle cx="168" cy="48" r="7" fill="#16a34a"/>

      <!-- Directed Edges -->
      <line x1="31" y1="44" x2="62" y2="28" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
      <line x1="31" y1="52" x2="62" y2="68" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
      <!-- Merging Edges -->
      <line x1="74" y1="28" x2="116" y2="44" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <line x1="74" y1="68" x2="116" y2="52" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <!-- Final Edge -->
      <line x1="131" y1="48" x2="160" y2="48" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <rect x="104" y="12" width="40" height="12" rx="1" fill="#e0f2fe"/>
      <text x="124" y="21" font-size="6.5" font-weight="700" fill="#0369a1" text-anchor="middle">Merge</text>
    </g>

    <!-- Details -->
    <g transform="translate(10, 136)">
      <text x="0" y="10" font-size="8" font-weight="700" fill="#0f172a">Execution Topology:</text>
      <text x="0" y="23" font-size="7.5" fill="#475569">• Arbitrary Directed Acyclic Graph</text>
      <text x="0" y="35" font-size="7.5" fill="#475569">• Branching, merging, and synthesis</text>

      <text x="0" y="54" font-size="8" font-weight="700" fill="#0f172a">Evaluation Mechanism:</text>
      <text x="0" y="67" font-size="7.5" fill="#475569">• Multi-edge relational verification</text>
      <text x="0" y="79" font-size="7.5" fill="#475569">• Cross-branch distillation &amp; consensus</text>

      <!-- Pros / Cons -->
      <rect x="0" y="91" width="191" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="106" font-size="7.5" font-weight="700" fill="#15803d">✓ Expresses thought aggregation</text>
      <text x="8" y="122" font-size="7.5" font-weight="700" fill="#dc2626">✗ Complex DAG dependency scheduler</text>

      <!-- Serving Profile -->
      <rect x="0" y="140" width="191" height="38" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="95" y="154" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Profile: Graph Scheduler</text>
      <text x="95" y="167" font-size="7" fill="#15803d" text-anchor="middle">Requires multi-parent KV-cache merges</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM COMPARISON FOOTER BANNER                                   -->
  <!-- ================================================================= -->
  <g transform="translate(40, 444)">
    <rect x="0" y="0" width="880" height="60" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="60" rx="1" fill="#0284c7"/>
    <text x="14" y="18" font-size="8.5" font-weight="700" fill="#0f172a">SYSTEMS TRADE-OFF: PARALLEL BATCH THROUGHPUT VS. DELIBERATE LOOKAHEAD</text>
    <text x="14" y="34" font-size="7.5" fill="#475569">Best-of-N maximizes GPU batch saturation, KV prefix reuse, and arithmetic intensity; MCTS and GoT trade serving throughput</text>
    <text x="14" y="47" font-size="7.5" fill="#475569">for reasoning accuracy on combinatorial problem manifolds by maintaining stateful search trees and multi-parent KV cache dependencies.</text>
  </g>

</g>
</svg>