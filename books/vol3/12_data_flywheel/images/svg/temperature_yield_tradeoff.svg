<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="450" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- Legend Bar -->
  <g transform="translate(40, 74)">
    <!-- Usable Yield -->
    <line x1="0" y1="8" x2="24" y2="8" stroke="#16a34a" stroke-width="3"/>
    <circle cx="12" cy="8" r="3.5" fill="#16a34a"/>
    <text x="32" y="11" font-size="8.5" font-weight="700" fill="#15803d">Usable Trajectory Yield (Verified &amp; Non-Redundant)</text>

    <!-- Exploration Diversity -->
    <line x1="260" y1="8" x2="284" y2="8" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 3"/>
    <text x="292" y="11" font-size="8.5" font-weight="700" fill="#6d28d9">Exploration Diversity (Distinct Action Sequences)</text>

    <!-- Syntax / Schema Errors -->
    <line x1="535" y1="8" x2="559" y2="8" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4 3"/>
    <text x="567" y="11" font-size="8.5" font-weight="700" fill="#991b1b">Syntax &amp; Schema Error Rate (Verifier Rejection)</text>
  </g>

  <!-- ================================================================= -->
  <!-- PLOT AREA: x ∈ [90, 890] (width 800), y ∈ [110, 410] (height 300) -->
  <!-- ================================================================= -->

  <!-- Shaded Zones -->
  <!-- Zone 1: Mode Collapse [0.0, 0.4] -> x ∈ [90, 356] -->
  <rect x="90" y="110" width="266" height="300" fill="#f1f5f9" fill-opacity="0.7"/>
  <line x1="356" y1="110" x2="356" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <g transform="translate(133, 118)">
    <rect x="0" y="0" width="180" height="28" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="90" y="12" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">Deterministic Mode Collapse</text>
    <text x="90" y="22" text-anchor="middle" font-size="7" fill="#64748b">Identical greedy paths, zero diversity</text>
  </g>

  <!-- Zone 2: Optimal Synthesis Regime [0.6, 0.8] -> x ∈ [490, 623] -->
  <rect x="490" y="110" width="133" height="300" fill="#dcfce7" fill-opacity="0.4"/>
  <line x1="490" y1="110" x2="490" y2="410" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="623" y1="110" x2="623" y2="410" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <g transform="translate(492, 118)">
    <rect x="0" y="0" width="129" height="28" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="64" y="12" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Optimal Synthesis Regime</text>
    <text x="64" y="22" text-anchor="middle" font-size="7" font-weight="700" fill="#166534">Peak Yield (T ≈ 0.7)</text>
  </g>

  <!-- Zone 3: Entropy Explosion [0.95, 1.2] -> x ∈ [723, 890] -->
  <rect x="723" y="110" width="167" height="300" fill="#fee2e2" fill-opacity="0.4"/>
  <line x1="723" y1="110" x2="723" y2="410" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4"/>
  <g transform="translate(732, 118)">
    <rect x="0" y="0" width="149" height="28" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="74" y="12" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">Entropy Explosion</text>
    <text x="74" y="22" text-anchor="middle" font-size="7" fill="#7f1d1d">Malformed calls &amp; verifier reject</text>
  </g>

  <!-- Horizontal Grid Lines (0%, 25%, 50%, 75%, 100%) -->
  <line x1="90" y1="410" x2="890" y2="410" stroke="#64748b" stroke-width="1.5"/>
  <line x1="90" y1="347" x2="890" y2="347" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="285" x2="890" y2="285" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="222" x2="890" y2="222" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="160" x2="890" y2="160" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Y-Axis Vertical Line -->
  <line x1="90" y1="160" x2="90" y2="410" stroke="#64748b" stroke-width="1.5"/>

  <!-- Y-Axis Tick Labels -->
  <text x="80" y="414" text-anchor="end" font-size="8" fill="#64748b">0%</text>
  <text x="80" y="351" text-anchor="end" font-size="8" fill="#64748b">25%</text>
  <text x="80" y="289" text-anchor="end" font-size="8" fill="#64748b">50%</text>
  <text x="80" y="226" text-anchor="end" font-size="8" fill="#64748b">75%</text>
  <text x="80" y="164" text-anchor="end" font-size="8" font-weight="700" fill="#0f172a">100%</text>
  <text x="36" y="285" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155" transform="rotate(-90 36 285)">Relative Rate (%)</text>

  <!-- X-Axis Tick Labels -->
  <text x="90" y="426" text-anchor="middle" font-size="8" fill="#64748b">0.0</text>
  <text x="223" y="426" text-anchor="middle" font-size="8" fill="#64748b">0.2</text>
  <text x="356" y="426" text-anchor="middle" font-size="8" fill="#64748b">0.4</text>
  <text x="490" y="426" text-anchor="middle" font-size="8" fill="#64748b">0.6</text>
  <text x="556" y="426" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">0.7</text>
  <text x="623" y="426" text-anchor="middle" font-size="8" fill="#64748b">0.8</text>
  <text x="756" y="426" text-anchor="middle" font-size="8" fill="#64748b">1.0</text>
  <text x="890" y="426" text-anchor="middle" font-size="8" fill="#64748b">1.2</text>
  <text x="490" y="448" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Softmax Sampling Temperature (T)</text>

  <!-- ================================================================= -->
  <!-- CURVES                                                            -->
  <!-- ================================================================= -->
  <!-- 1. Exploration Diversity Curve (Purple) -->
  <path d="M 90 397 C 223 390, 356 350, 490 270 C 556 230, 623 195, 756 170 C 823 165, 890 165, 890 165"
        fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 3"/>

  <!-- 2. Syntax / Schema Error Rate Curve (Red) -->
  <path d="M 90 407 C 280 407, 420 405, 490 397 C 556 387, 623 355, 723 272 C 790 215, 840 182, 890 172"
        fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>

  <!-- 3. Usable Trajectory Yield Curve (Green) -->
  <path d="M 90 372 C 223 352, 356 295, 490 197 C 525 155, 585 155, 623 215 C 680 280, 756 335, 890 402"
        fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>

  <!-- Peak Marker Dot & Callout -->
  <circle cx="556" cy="170" r="5" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <g transform="translate(568, 158)">
    <rect x="0" y="0" width="136" height="22" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="68" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Peak Yield: 96% @ T = 0.7</text>
  </g>

</g>
</svg>