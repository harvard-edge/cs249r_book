<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 370" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1250" height="370" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .stage-card { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 4; }
      .final-card { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; rx: 4; }
      .sink-card { fill: #fef2f2; stroke: #f87171; stroke-width: 1.2; rx: 3; }
      .neg-card { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.2; rx: 3; }
      .corpus-card { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 5; }
      
      .hdr-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .hdr-final { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #15803d; text-anchor: middle; }
      .hdr-corpus { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #065f46; text-anchor: middle; }
      
      .txt-meta { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8.8px; font-weight: 600; fill: #2563eb; text-anchor: middle; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #334155; }
      .txt-sink { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 600; fill: #991b1b; text-anchor: middle; }
      .txt-neg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 600; fill: #9a3412; text-anchor: middle; }
      
      .pill-surv { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1; rx: 3; }
      .pill-final { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; rx: 3; }
      .txt-surv { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 9.8px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
      .txt-final-surv { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 10px; font-weight: 700; fill: #15803d; text-anchor: middle; }
      
      .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
      .edge-green { stroke: #059669; stroke-width: 2; fill: none; }
      .edge-discard { stroke: #ef4444; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
      .edge-lbl-discard { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; font-weight: 600; fill: #b91c1c; text-anchor: middle; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Ingress Label -->
  <g transform="translate(15, 105)">
    <rect width="70" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" rx="3" />
    <text x="35" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="700" fill="#0f172a" text-anchor="middle">Raw Rollouts</text>
    <text x="35" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5px" font-weight="700" fill="#3b82f6" text-anchor="middle">100.0%</text>
  </g>
  <path d="M 85 126 L 108 126" class="edge" marker-end="url(#arr)" />

  <!-- Stage 1: Syntactic -->
  <g transform="translate(110, 25)">
    <rect width="165" height="195" class="stage-card" />
    <text x="82" y="24" class="hdr-stage">Stage 1: Syntactic &amp; AST</text>
    <text x="82" y="38" class="txt-meta">In-Memory • c₁ = 50 µs</text>
    <line x1="12" y1="46" x2="153" y2="46" stroke="#cbd5e1" />
    
    <text x="14" y="66" class="txt-body">JSON schema validity</text>
    <text x="14" y="82" class="txt-body">Well-formed AST parse</text>
    <text x="14" y="98" class="txt-body">Balanced token quotes</text>
    <text x="14" y="114" class="txt-body">Zero execution cost</text>
    
    <rect x="12" y="132" width="141" height="24" class="pill-surv" />
    <text x="82" y="148" class="txt-surv">Survival: 65.0%</text>
    <text x="82" y="170" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" fill="#64748b" text-anchor="middle">p₁ = 0.65 (drop 35.0%)</text>
  </g>

  <!-- Discard 1 Arrow & Sink -->
  <path d="M 192 220 L 192 275" class="edge-discard" marker-end="url(#arr-red)" />
  <text x="197" y="250" class="edge-lbl-discard" text-anchor="start">Discard 35%</text>
  <g transform="translate(122, 275)">
    <rect width="140" height="42" class="sink-card" />
    <text x="70" y="18" class="txt-sink">Syntax Reject Sink</text>
    <text x="70" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#b91c1c" text-anchor="middle">Malformed payloads</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 275 126 L 298 126" class="edge" marker-end="url(#arr)" />

  <!-- Stage 2: Static Invariants -->
  <g transform="translate(300, 25)">
    <rect width="165" height="195" class="stage-card" />
    <text x="82" y="24" class="hdr-stage">Stage 2: Static Invariants</text>
    <text x="82" y="38" class="txt-meta">Host Daemon • c₂ = 120 ms</text>
    <line x1="12" y1="46" x2="153" y2="46" stroke="#cbd5e1" />
    
    <text x="14" y="66" class="txt-body">Type safety (mypy)</text>
    <text x="14" y="82" class="txt-body">Linter invariants (ruff)</text>
    <text x="14" y="98" class="txt-body">Static security (bandit)</text>
    <text x="14" y="114" class="txt-body">Unresolved symbol scan</text>
    
    <rect x="12" y="132" width="141" height="24" class="pill-surv" />
    <text x="82" y="148" class="txt-surv">Survival: 26.0%</text>
    <text x="82" y="170" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" fill="#64748b" text-anchor="middle">p₂ = 0.40 (drop 39.0%)</text>
  </g>

  <!-- Discard 2 Arrow & Sink -->
  <path d="M 382 220 L 382 275" class="edge-discard" marker-end="url(#arr-red)" />
  <text x="387" y="250" class="edge-lbl-discard" text-anchor="start">Discard 39%</text>
  <g transform="translate(312, 275)">
    <rect width="140" height="42" class="sink-card" />
    <text x="70" y="18" class="txt-sink">Static Violation Sink</text>
    <text x="70" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#b91c1c" text-anchor="middle">Lint &amp; type failures</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 465 126 L 488 126" class="edge" marker-end="url(#arr)" />

  <!-- Stage 3: Dynamic Sandbox -->
  <g transform="translate(490, 25)">
    <rect width="165" height="195" class="stage-card" />
    <text x="82" y="24" class="hdr-stage">Stage 3: Dynamic Sandbox</text>
    <text x="82" y="38" class="txt-meta">MicroVM • c₃ = 8.5 s</text>
    <line x1="12" y1="46" x2="153" y2="46" stroke="#cbd5e1" />
    
    <text x="14" y="66" class="txt-body">Hermetic pytest runner</text>
    <text x="14" y="82" class="txt-body">Subprocess exit code 0</text>
    <text x="14" y="98" class="txt-body">Timeout guard (T &lt; 120s)</text>
    <text x="14" y="114" class="txt-body">Memory ceiling check</text>
    
    <rect x="12" y="132" width="141" height="24" class="pill-surv" />
    <text x="82" y="148" class="txt-surv">Survival: 6.5%</text>
    <text x="82" y="170" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" fill="#64748b" text-anchor="middle">p₃ = 0.25 (drop 19.5%)</text>
  </g>

  <!-- Discard 3 Arrow & Sink -->
  <path d="M 572 220 L 572 275" class="edge-discard" marker-end="url(#arr-red)" />
  <text x="577" y="250" class="edge-lbl-discard" text-anchor="start">Discard 19.5%</text>
  <g transform="translate(502, 275)">
    <rect width="140" height="42" class="neg-card" />
    <text x="70" y="18" class="txt-neg">Hard Negative Sink (τ⁻)</text>
    <text x="70" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#ea580c" text-anchor="middle">Mined for DPO / RLVR</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 655 126 L 678 126" class="edge" marker-end="url(#arr)" />

  <!-- Stage 4: State Delta Audit -->
  <g transform="translate(680, 25)">
    <rect width="165" height="195" class="stage-card" />
    <text x="82" y="24" class="hdr-stage">Stage 4: State Delta Audit</text>
    <text x="82" y="38" class="txt-meta">CoW Snapshot • c₄ = 450 ms</text>
    <line x1="12" y1="46" x2="153" y2="46" stroke="#cbd5e1" />
    
    <text x="14" y="66" class="txt-body">Out-of-tree test diff</text>
    <text x="14" y="82" class="txt-body">Anti-tampering validator</text>
    <text x="14" y="98" class="txt-body">Orphan process &amp; lock audit</text>
    <text x="14" y="114" class="txt-body">Foreign key state delta</text>
    
    <rect x="12" y="132" width="141" height="24" class="pill-surv" />
    <text x="82" y="148" class="txt-surv">Survival: 5.5%</text>
    <text x="82" y="170" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" fill="#64748b" text-anchor="middle">p₄ = 0.85 (drop 0.98%)</text>
  </g>

  <!-- Discard 4 Arrow & Sink -->
  <path d="M 762 220 L 762 275" class="edge-discard" marker-end="url(#arr-red)" />
  <text x="767" y="250" class="edge-lbl-discard" text-anchor="start">Discard 0.98%</text>
  <g transform="translate(692, 275)">
    <rect width="140" height="42" class="sink-card" />
    <text x="70" y="18" class="txt-sink">Tamper Quarantine Sink</text>
    <text x="70" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#b91c1c" text-anchor="middle">Test mutation / side-effects</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 845 126 L 868 126" class="edge" marker-end="url(#arr)" />

  <!-- Stage 5: Semantic Triage -->
  <g transform="translate(870, 25)">
    <rect width="165" height="195" class="stage-card" />
    <text x="82" y="24" class="hdr-stage">Stage 5: Semantic Triage</text>
    <text x="82" y="38" class="txt-meta">Advisory Queue • c₅ = 15.0 s</text>
    <line x1="12" y1="46" x2="153" y2="46" stroke="#cbd5e1" />
    
    <text x="14" y="66" class="txt-body">Advisory code triage</text>
    <text x="14" y="82" class="txt-body">Tautology suppression</text>
    <text x="14" y="98" class="txt-body">Role tag: τ_prist / τ_rec</text>
    <text x="14" y="114" class="txt-body">Non-gating human audit</text>
    
    <rect x="12" y="132" width="141" height="24" class="pill-surv" />
    <text x="82" y="148" class="txt-surv">Survival: 3.87%</text>
    <text x="82" y="170" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" fill="#64748b" text-anchor="middle">p₅ = 0.70 (drop 1.65%)</text>
  </g>

  <!-- Discard 5 Arrow & Sink -->
  <path d="M 952 220 L 952 275" class="edge-discard" marker-end="url(#arr-red)" />
  <text x="957" y="250" class="edge-lbl-discard" text-anchor="start">Discard 1.65%</text>
  <g transform="translate(882, 275)">
    <rect width="140" height="42" class="sink-card" />
    <text x="70" y="18" class="txt-sink">Advisory Reject Sink</text>
    <text x="70" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#b91c1c" text-anchor="middle">Tautologies &amp; flukes</text>
  </g>

  <!-- Pass Arrow from Stage 5 to Corpus Card -->
  <path d="M 1035 126 L 1068 126" class="edge-green" marker-end="url(#arr-green)" />

  <!-- Final Golden Training Corpus -->
  <g transform="translate(1070, 25)">
    <rect width="165" height="195" class="corpus-card" />
    <text x="82" y="24" class="hdr-corpus">Golden Training Corpus</text>
    <text x="82" y="38" font-family="SFMono-Regular, Consolas, monospace" font-size="9px" font-weight="700" fill="#047857" text-anchor="middle">τ ∈ D_train</text>
    <line x1="12" y1="46" x2="153" y2="46" stroke="#a7f3d0" />
    
    <text x="14" y="68" class="txt-body">Cryptographic lineage</text>
    <text x="14" y="84" class="txt-body">Role-annotated splits</text>
    <text x="14" y="100" class="txt-body">AST-sanitized tokens</text>
    <text x="14" y="116" class="txt-body">Zero leakage holdout</text>
    
    <rect x="12" y="132" width="141" height="26" class="pill-final" />
    <text x="82" y="149" class="txt-final-surv">Final Yield: 3.9%</text>
    <text x="82" y="172" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" font-weight="700" fill="#047857" text-anchor="middle">N = 3,867 of 100,000</text>
    <text x="82" y="186" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#065f46" text-anchor="middle">Cost: 3.15 s/attempt</text>
  </g>

</svg>
