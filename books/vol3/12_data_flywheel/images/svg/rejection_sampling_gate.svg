<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="380" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- INPUT: PROPOSED ROLLOUT (x: 25, y: 100, w: 135, h: 80)           -->
  <!-- ================================================================= -->
  <g transform="translate(25, 100)">
    <rect x="0" y="0" width="135" height="80" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="135" height="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="67" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">CANDIDATE ROLLOUT</text>
    <text x="10" y="34" font-family="Courier, monospace" font-size="7.5" fill="#0c4a6e">τ ~ π_θ(· | x)</text>
    <text x="10" y="48" font-size="7.2" fill="#475569">• Multi-turn actions</text>
    <text x="10" y="60" font-size="7.2" fill="#475569">• Emitted tool calls</text>
    <text x="10" y="72" font-family="Courier, monospace" font-size="6.8" fill="#0284c7">Raw token stream</text>
  </g>

  <!-- Arrow: Input -> Gate 1 -->
  <path d="M160,140 L185,140" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================================================================= -->
  <!-- GATE 1: AST SYNTAX (x: 185, y: 85, w: 155, h: 110)                -->
  <!-- ================================================================= -->
  <g transform="translate(185, 85)">
    <rect x="0" y="0" width="155" height="110" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="77" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">1. AST SYNTAX GATE</text>
    <text x="8" y="34" font-family="Courier, monospace" font-size="7.2" font-weight="700" fill="#0f172a">I_syntax(τ) ∈ {0, 1}</text>
    <text x="8" y="48" font-size="7" fill="#475569">• Tree-sitter parsers</text>
    <text x="8" y="60" font-size="7" fill="#475569">• Language grammar check</text>
    <text x="8" y="72" font-size="7" fill="#475569">• In-process thread</text>
    <rect x="8" y="80" width="139" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="92" font-size="6.8" font-weight="700" fill="#0284c7">Latency: &lt; 1 ms</text>
  </g>

  <!-- Arrow: Gate 1 Pass -> Gate 2 -->
  <path d="M340,140 L365,140" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="352" y="133" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" fill="#15803d">PASS</text>

  <!-- Arrow: Gate 1 Fail -> Bottom Rejection Bus -->
  <path d="M262,195 L262,260" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="256" y="235" text-anchor="end" font-family="Courier, monospace" font-size="6.5" fill="#b91c1c">FAIL</text>

  <!-- ================================================================= -->
  <!-- GATE 2: SCHEMA CONTRACT (x: 365, y: 85, w: 155, h: 110)           -->
  <!-- ================================================================= -->
  <g transform="translate(365, 85)">
    <rect x="0" y="0" width="155" height="110" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="77" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">2. SCHEMA CONTRACT</text>
    <text x="8" y="34" font-family="Courier, monospace" font-size="7.2" font-weight="700" fill="#0f172a">I_schema(τ) ∈ {0, 1}</text>
    <text x="8" y="48" font-size="7" fill="#475569">• JSON Schema / OpenAPI</text>
    <text x="8" y="60" font-size="7" fill="#475569">• Strict argument typing</text>
    <text x="8" y="72" font-size="7" fill="#475569">• Pydantic / fast-json</text>
    <rect x="8" y="80" width="139" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="92" font-size="6.8" font-weight="700" fill="#0284c7">Latency: &lt; 5 ms</text>
  </g>

  <!-- Arrow: Gate 2 Pass -> Gate 3 -->
  <path d="M520,140 L545,140" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="532" y="133" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" fill="#15803d">PASS</text>

  <!-- Arrow: Gate 2 Fail -> Bottom Rejection Bus -->
  <path d="M442,195 L442,260" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="436" y="235" text-anchor="end" font-family="Courier, monospace" font-size="6.5" fill="#b91c1c">FAIL</text>

  <!-- ================================================================= -->
  <!-- GATE 3: STATE INVARIANT (x: 545, y: 85, w: 155, h: 110)           -->
  <!-- ================================================================= -->
  <g transform="translate(545, 85)">
    <rect x="0" y="0" width="155" height="110" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="77" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">3. STATE INVARIANTS</text>
    <text x="8" y="34" font-family="Courier, monospace" font-size="7.2" font-weight="700" fill="#0f172a">I_state(τ) ∈ {0, 1}</text>
    <text x="8" y="48" font-size="7" fill="#475569">• Workspace diff bounds</text>
    <text x="8" y="60" font-size="7" fill="#475569">• Zero orphaned procs</text>
    <text x="8" y="72" font-size="7" fill="#475569">• Memory / leak isolation</text>
    <rect x="8" y="80" width="139" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="92" font-size="6.8" font-weight="700" fill="#d97706">Latency: 10 to 50 ms</text>
  </g>

  <!-- Arrow: Gate 3 Pass -> Gate 4 -->
  <path d="M700,140 L725,140" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="712" y="133" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" fill="#15803d">PASS</text>

  <!-- Arrow: Gate 3 Fail -> Bottom Rejection Bus -->
  <path d="M622,195 L622,260" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="616" y="235" text-anchor="end" font-family="Courier, monospace" font-size="6.5" fill="#b91c1c">FAIL</text>

  <!-- ================================================================= -->
  <!-- GATE 4: HERMETIC UNIT TESTS (x: 725, y: 85, w: 170, h: 110)       -->
  <!-- ================================================================= -->
  <g transform="translate(725, 85)">
    <rect x="0" y="0" width="170" height="110" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="85" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">4. HERMETIC TEST SUITE</text>
    <text x="8" y="34" font-family="Courier, monospace" font-size="7.2" font-weight="700" fill="#0f172a">∏ I(Test_m == PASS)</text>
    <text x="8" y="48" font-size="7" fill="#475569">• Ephemeral Firecracker VM</text>
    <text x="8" y="60" font-size="7" fill="#475569">• Full test suite execution</text>
    <text x="8" y="72" font-size="7" fill="#475569">• Return code == 0 check</text>
    <rect x="8" y="80" width="154" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="92" font-size="6.8" font-weight="700" fill="#b91c1c">Latency: 1 to 30 s</text>
  </g>

  <!-- Arrow: Gate 4 Fail -> Bottom Rejection Bus -->
  <path d="M810,195 L810,260" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="804" y="235" text-anchor="end" font-family="Courier, monospace" font-size="6.5" fill="#b91c1c">FAIL</text>

  <!-- Arrow: Gate 4 ALL PASS -> Golden Pool (Top Right loop up and over) -->
  <path d="M810,85 L810,40 L460,40" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="640" y="33" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">ALL GATES PASS: R(τ, x) = 1.0</text>

  <!-- ================================================================= -->
  <!-- GOLDEN TRAINING POOL (Top Center: x: 185, y: 15, w: 275, h: 50)  -->
  <!-- ================================================================= -->
  <g transform="translate(185, 15)">
    <rect x="0" y="0" width="275" height="50" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="275" height="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="137" y="13" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">GOLDEN SFT DATASET POOL (Accepted)</text>
    <text x="8" y="31" font-family="Courier, monospace" font-size="7.5" fill="#14532d">D_sft = { τ* | R(τ) = 1.0 ∧ min|τ| }</text>
    <text x="8" y="43" font-size="7" fill="#16a34a">Min-step golden trajectories; zero hallucinated tokens</text>
  </g>

  <!-- ================================================================= -->
  <!-- REJECTION RECOVERY TIER (Bottom: x: 185, y: 260, w: 710, h: 90)   -->
  <!-- ================================================================= -->
  <!-- Horizontal Rejection Bus Line -->
  <path d="M262,260 L810,260" stroke="#dc2626" stroke-width="1.5"/>

  <g transform="translate(185, 275)">
    <rect x="0" y="0" width="710" height="85" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="710" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="355" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">NEGATIVE TRAJECTORY MINING &amp; ERROR RECOVERY POOL (R = 0.0)</text>

    <!-- Error Classification Columns -->
    <g transform="translate(15, 30)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#334155">Short-Circuit Rejection Logic:</text>
      <text x="0" y="26" font-size="7" fill="#475569">Failure at Gate k aborts immediately without running Gate k+1.</text>
      <text x="0" y="38" font-size="7" fill="#b91c1c">Saves &gt;90% of verification compute on malformed traces.</text>
    </g>

    <g transform="translate(280, 30)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#334155">Failure Step Localization:</text>
      <text x="0" y="26" font-family="Courier, monospace" font-size="7" fill="#0f172a">t* = argfirst_t (Gate(a_t) == FAIL)</text>
      <text x="0" y="38" font-size="7" fill="#475569">Isolates exact pivot token causing divergence.</text>
    </g>

    <g transform="translate(510, 30)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#334155">Downstream Training Target:</text>
      <text x="0" y="26" font-size="7" fill="#7c3aed">• DAgger error-injection branches</text>
      <text x="0" y="38" font-size="7" fill="#7c3aed">• RLVR unchosen negative rollouts (τ_neg)</text>
    </g>
  </g>

</svg>
