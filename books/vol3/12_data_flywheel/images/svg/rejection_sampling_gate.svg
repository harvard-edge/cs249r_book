<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="450" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- TOP: GOLDEN SFT TRAINING POOL                                     -->
  <!-- ================================================================= -->
  <g transform="translate(420, 72)">
    <rect x="0" y="0" width="500" height="56" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="15" font-size="9" font-weight="700" fill="#15803d">GOLDEN SFT DATASET POOL (Accepted Traces)</text>
    <text x="12" y="36" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#14532d">D_sft = { τ* | R(τ) = 1.0 ∧ min|τ| }</text>
    <text x="12" y="48" font-size="8.0" fill="#16a34a">Min-step golden trajectories; zero hallucinated tokens; 100% deterministic assertion pass</text>
  </g>

  <!-- Loop Arrow from Gate 4 to Golden Pool -->
  <path d="M 842 148 L 842 100 L 920 100" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="880" y="93" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">ALL PASS</text>

  <!-- ================================================================= -->
  <!-- MIDDLE ROW: CASCADED VERIFICATION PIPELINE                        -->
  <!-- ================================================================= -->

  <!-- Input: Candidate Rollout -->
  <g transform="translate(40, 148)">
    <rect x="0" y="0" width="145" height="142" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="145" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#0369a1">CANDIDATE ROLLOUT</text>
    <text x="10" y="38" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0c4a6e">τ ~ π_θ(· | x)</text>
    <text x="10" y="52" font-size="8.0" fill="#475569">• Multi-turn actions</text>
    <text x="10" y="66" font-size="8.0" fill="#475569">• Emitted tool calls</text>
    <text x="10" y="80" font-size="8.0" fill="#475569">• Stored observations</text>
    <g transform="translate(10, 94)">
      <rect x="0" y="0" width="125" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#0284c7">Raw Token Stream</text>
      <text x="8" y="26" font-size="8.0" fill="#64748b">Batch Rollout Queue</text>
    </g>
  </g>

  <!-- Arrow: Candidate -> Gate 1 -->
  <line x1="185" y1="219" x2="208" y2="219" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Gate 1: AST Syntax -->
  <g transform="translate(210, 148)">
    <rect x="0" y="0" width="160" height="142" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#1e293b">1. AST SYNTAX GATE</text>
    <text x="10" y="38" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0f172a">I_syntax(τ) ∈ {0, 1}</text>
    <text x="10" y="52" font-size="8.0" fill="#475569">• Tree-sitter parsers</text>
    <text x="10" y="66" font-size="8.0" fill="#475569">• Language grammar rules</text>
    <text x="10" y="80" font-size="8.0" fill="#475569">• In-process worker thread</text>
    <g transform="translate(10, 94)">
      <rect x="0" y="0" width="140" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#0284c7">Latency: &lt; 1 ms</text>
      <text x="8" y="26" font-size="8.0" fill="#64748b">Fast zero-cost filter</text>
    </g>
  </g>

  <!-- Arrow: Gate 1 -> Gate 2 -->
  <line x1="370" y1="219" x2="393" y2="219" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="382" y="211" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">PASS</text>

  <!-- Gate 2: Schema Contract -->
  <g transform="translate(395, 148)">
    <rect x="0" y="0" width="160" height="142" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#1e293b">2. SCHEMA CONTRACT</text>
    <text x="10" y="38" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0f172a">I_schema(τ) ∈ {0, 1}</text>
    <text x="10" y="52" font-size="8.0" fill="#475569">• JSON Schema / OpenAPI</text>
    <text x="10" y="66" font-size="8.0" fill="#475569">• Strict argument typing</text>
    <text x="10" y="80" font-size="8.0" fill="#475569">• Fast deserialization</text>
    <g transform="translate(10, 94)">
      <rect x="0" y="0" width="140" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#0284c7">Latency: &lt; 5 ms</text>
      <text x="8" y="26" font-size="8.0" fill="#64748b">Validates payload wire type</text>
    </g>
  </g>

  <!-- Arrow: Gate 2 -> Gate 3 -->
  <line x1="555" y1="219" x2="578" y2="219" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="567" y="211" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">PASS</text>

  <!-- Gate 3: State Invariants -->
  <g transform="translate(580, 148)">
    <rect x="0" y="0" width="160" height="142" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#1e293b">3. STATE INVARIANTS</text>
    <text x="10" y="38" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0f172a">I_state(τ) ∈ {0, 1}</text>
    <text x="10" y="52" font-size="8.0" fill="#475569">• Workspace diff bounds</text>
    <text x="10" y="66" font-size="8.0" fill="#475569">• Zero orphaned procs</text>
    <text x="10" y="80" font-size="8.0" fill="#475569">• Memory &amp; leak containment</text>
    <g transform="translate(10, 94)">
      <rect x="0" y="0" width="140" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#d97706">Latency: 10 to 50 ms</text>
      <text x="8" y="26" font-size="8.0" fill="#64748b">Filesystem diff audit</text>
    </g>
  </g>

  <!-- Arrow: Gate 3 -> Gate 4 -->
  <line x1="740" y1="219" x2="763" y2="219" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="752" y="211" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">PASS</text>

  <!-- Gate 4: Hermetic Tests -->
  <g transform="translate(765, 148)">
    <rect x="0" y="0" width="155" height="142" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#1e293b">4. HERMETIC TESTS</text>
    <text x="10" y="38" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0f172a">∏ I(Test_m == PASS)</text>
    <text x="10" y="52" font-size="8.0" fill="#475569">• Firecracker microVM</text>
    <text x="10" y="66" font-size="8.0" fill="#475569">• Hermetic test execution</text>
    <text x="10" y="80" font-size="8.0" fill="#475569">• Return code == 0 check</text>
    <g transform="translate(10, 94)">
      <rect x="0" y="0" width="135" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#dc2626">Latency: 1 to 30 s</text>
      <text x="8" y="26" font-size="8.0" fill="#64748b">Definitive oracle check</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- REJECTION BUS LINES & BOTTOM MINING TIER                          -->
  <!-- ================================================================= -->
  <!-- Drop lines from each gate down to rejection bus -->
  <line x1="290" y1="290" x2="290" y2="316" stroke="#dc2626" stroke-width="1.5"/>
  <text x="284" y="306" text-anchor="end" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#dc2626">FAIL</text>

  <line x1="475" y1="290" x2="475" y2="316" stroke="#dc2626" stroke-width="1.5"/>
  <text x="469" y="306" text-anchor="end" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#dc2626">FAIL</text>

  <line x1="660" y1="290" x2="660" y2="316" stroke="#dc2626" stroke-width="1.5"/>
  <text x="654" y="306" text-anchor="end" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#dc2626">FAIL</text>

  <line x1="842" y1="290" x2="842" y2="316" stroke="#dc2626" stroke-width="1.5"/>
  <text x="836" y="306" text-anchor="end" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#dc2626">FAIL</text>

  <!-- Horizontal Rejection Bus -->
  <line x1="290" y1="316" x2="842" y2="316" stroke="#dc2626" stroke-width="2"/>
  <line x1="566" y1="316" x2="566" y2="332" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Negative Trajectory Mining Container -->
  <g transform="translate(40, 336)">
    <rect x="0" y="0" width="880" height="114" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">NEGATIVE TRAJECTORY MINING &amp; ERROR RECOVERY POOL (Rejected Traces: R = 0.0)</text>

    <!-- Column 1 -->
    <g transform="translate(14, 32)">
      <rect x="0" y="0" width="270" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Short-Circuit Rejection Logic</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">Failure at Gate k aborts immediately without</text>
      <text x="10" y="44" font-size="8.0" fill="#475569">triggering downstream verification gates.</text>
      <text x="10" y="60" font-size="8.0" font-weight="700" fill="#dc2626">Saves &gt;90% of verification compute on malformed traces</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(298, 32)">
      <rect x="0" y="0" width="284" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Failure Step Localization</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">t* = argfirst_t (Gate(a_t) == FAIL)</text>
      <text x="10" y="46" font-size="8.0" fill="#475569">Pinpoints the exact pivot token causing environment divergence</text>
      <text x="10" y="60" font-size="8.0" font-weight="700" fill="#b45309">Counterfactual rollback anchor for teacher queries</text>
    </g>

    <!-- Column 3 -->
    <g transform="translate(596, 32)">
      <rect x="0" y="0" width="270" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Downstream Curriculum Targets</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">• DAgger error-injection branches for self-repair</text>
      <text x="10" y="44" font-size="8.0" fill="#475569">• RLVR unchosen negative rollouts (τ_neg)</text>
      <text x="10" y="60" font-size="8.0" font-weight="700" fill="#7c3aed">Group advantage normalization pairs for RL</text>
    </g>
  </g>

</g>
</svg>