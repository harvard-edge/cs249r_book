<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .stage-card { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 4; }
      .sandbox-card { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; rx: 4; }
      .sink-card { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 4; }
      
      .hdr-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .hdr-sink { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #065f46; }
      .txt-meta { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8.8px; font-weight: 600; fill: #2563eb; }
      .txt-detail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #334155; }
      .txt-mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8.5px; fill: #475569; }
      
      .inner-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 3; }
      .queue-buf { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.2; rx: 3; }
      .bp-pill { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.2; rx: 3; }
      
      .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
      .edge-rpc { stroke: #0284c7; stroke-width: 1.4; stroke-dasharray: 4 2; fill: none; }
      .edge-bp { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .txt-edge { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8.5px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .txt-bp { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-bp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- ==================== STAGE 1: TASK DISPATCHER ==================== -->
  <g transform="translate(20, 20)">
    <rect width="180" height="230" class="stage-card" />
    <text x="14" y="24" class="hdr-stage">1. Task Dispatcher</text>
    <text x="14" y="38" class="txt-meta">State Store • P₅₀ = 2 ms</text>
    <line x1="12" y1="46" x2="168" y2="46" stroke="#cbd5e1" />
    
    <!-- Inner Box: Fixture Store -->
    <g transform="translate(10, 54)">
      <rect width="160" height="46" class="inner-box" />
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#0f172a">Repo Fixture Store (S₀)</text>
      <text x="8" y="29" class="txt-mono">Pinned digests, specs P_task</text>
      <text x="8" y="40" class="txt-mono">Tool manifests M_tool</text>
    </g>
    
    <!-- Inner Box: Priority FIFO & Leasing -->
    <g transform="translate(10, 108)">
      <rect width="160" height="58" class="inner-box" />
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#0f172a">Priority Lease Engine</text>
      <text x="8" y="29" class="txt-mono">Pull-based token leases</text>
      <text x="8" y="41" class="txt-mono">T_lease = 2 × T_max</text>
      <text x="8" y="52" class="txt-mono">Re-enqueue on timeout</text>
    </g>
    
    <g transform="translate(10, 174)">
      <rect width="160" height="44" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" rx="3" />
      <text x="80" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#1e40af" text-anchor="middle">Lease Rate Governor</text>
      <text x="80" y="32" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" fill="#2563eb" text-anchor="middle">Throttle: λ_rollout</text>
    </g>
  </g>

  <!-- Edge: Dispatcher -> Rollout Fleet -->
  <path d="M 200 110 L 238 110" class="edge" marker-end="url(#arr)" />
  <text x="219" y="102" class="txt-edge">Task</text>

  <!-- ==================== STAGE 2: ROLLOUT FLEET ==================== -->
  <g transform="translate(240, 20)">
    <rect width="210" height="170" class="stage-card" />
    <text x="14" y="24" class="hdr-stage">2. Rollout Fleet (vLLM)</text>
    <text x="14" y="38" class="txt-meta">GPU Inference • P₅₀ = 8 s</text>
    <line x1="12" y1="46" x2="198" y2="46" stroke="#cbd5e1" />
    
    <!-- Inner: Model Supervisor -->
    <g transform="translate(10, 54)">
      <rect width="190" height="50" class="inner-box" />
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#0f172a">Stateless Host Supervisor</text>
      <text x="8" y="29" class="txt-detail">• Continuous batching decode</text>
      <text x="8" y="42" class="txt-detail">• Radix tree prefix caching</text>
    </g>
    
    <g transform="translate(10, 112)">
      <rect width="190" height="46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="3" />
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#0f172a">Authority Boundary (A=0)</text>
      <text x="8" y="30" class="txt-mono">Zero ambient host access</text>
      <text x="8" y="41" class="txt-mono">Mediated tool RPCs only</text>
    </g>
  </g>

  <!-- Dual Edges: Rollout <-> Sandbox Pool -->
  <path d="M 310 190 L 310 238" class="edge-rpc" marker-end="url(#arr-blue)" />
  <rect x="235" y="206" width="65" height="18" fill="#ffffff" stroke="#bae6fd" stroke-width="1" rx="2" />
  <text x="267" y="218" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#0284c7" text-anchor="middle">Tool RPC</text>

  <path d="M 375 238 L 375 190" class="edge-rpc" marker-end="url(#arr-blue)" />
  <rect x="385" y="206" width="60" height="18" fill="#ffffff" stroke="#bae6fd" stroke-width="1" rx="2" />
  <text x="415" y="218" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#0284c7" text-anchor="middle">Obs / Δ_fs</text>

  <!-- ==================== STAGE 3: SANDBOX POOL ==================== -->
  <g transform="translate(240, 240)">
    <rect width="210" height="135" class="sandbox-card" />
    <text x="14" y="22" class="hdr-stage">3. Ephemeral Sandbox Pool</text>
    <text x="14" y="36" class="txt-meta">Firecracker CoW • P₅₀ = 8 ms</text>
    <line x1="12" y1="44" x2="198" y2="44" stroke="#cbd5e1" />
    
    <g transform="translate(10, 50)">
      <rect width="190" height="40" class="inner-box" />
      <text x="8" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#0f172a">Warm MicroVM Snapshots</text>
      <text x="8" y="28" class="txt-mono">CoW memory / disk overlays</text>
      <text x="8" y="37" class="txt-mono">Sub-10ms resume from S₀</text>
    </g>
    
    <text x="14" y="105" class="txt-detail">• Isolated veth network namespace</text>
    <text x="14" y="118" class="txt-detail">• Async teardown &amp; cgroup cleanup</text>
  </g>

  <!-- Edge: Rollout Fleet -> Staging Bus -->
  <path d="M 450 105 L 488 105" class="edge" marker-end="url(#arr)" />
  <text x="470" y="98" class="txt-edge">τ_raw</text>

  <!-- ==================== STAGE 4: STAGING BUS & VERIFIERS ==================== -->
  <g transform="translate(490, 20)">
    <rect width="240" height="230" class="stage-card" />
    <text x="14" y="24" class="hdr-stage">4. Staging Bus &amp; Verifiers</text>
    <text x="14" y="38" class="txt-meta">Kafka / CPU Fleet • P₅₀ = 120 ms</text>
    <line x1="12" y1="46" x2="228" y2="46" stroke="#cbd5e1" />
    
    <!-- Queue Buffer -->
    <g transform="translate(10, 54)">
      <rect width="220" height="52" class="queue-buf" />
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#1e40af">Kafka / NATS Trace Ring Buffer</text>
      <text x="8" y="30" class="txt-mono">Payload: S_traj ≈ 8.5 MB (max 64 MB)</text>
      <text x="8" y="44" class="txt-mono">Monitors queue backlog depth: L_q</text>
    </g>
    
    <!-- Multi-Tier Verifier Pool -->
    <g transform="translate(10, 114)">
      <rect width="220" height="60" class="inner-box" />
      <text x="8" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#0f172a">Multi-Tier Verifier Cascade</text>
      <text x="8" y="28" class="txt-detail">• V₁: Schema / AST parse (&lt; 1 ms)</text>
      <text x="8" y="41" class="txt-detail">• V₂: Hermetic test runner (pytest)</text>
      <text x="8" y="54" class="txt-detail">• V₃: Mutation &amp; flakiness audit</text>
    </g>
    
    <g transform="translate(10, 182)">
      <rect width="220" height="38" class="bp-pill" />
      <text x="110" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#b91c1c" text-anchor="middle">Traffic Intensity: ρ = λ / μ</text>
      <text x="110" y="30" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" fill="#dc2626" text-anchor="middle">Backpressure Monitor (L_q &gt; Q_max)</text>
    </g>
  </g>

  <!-- Edge: Staging & Verifiers -> Storage Sink -->
  <path d="M 730 110 L 768 110" class="edge" marker-end="url(#arr)" />
  <text x="750" y="102" class="txt-edge">τ_ver</text>

  <!-- ==================== STAGE 5: STORAGE SINK & SPREAD ==================== -->
  <g transform="translate(770, 20)">
    <rect width="250" height="230" class="sink-card" />
    <text x="14" y="24" class="hdr-sink">5. Storage Sink &amp; Splits</text>
    <text x="14" y="38" class="txt-meta" fill="#059669">Parquet / S3 • P₅₀ = 50 ms</text>
    <line x1="12" y1="46" x2="238" y2="46" stroke="#a7f3d0" />
    
    <!-- Columnar Appender -->
    <g transform="translate(10, 54)">
      <rect width="230" height="46" class="inner-box" />
      <text x="8" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#0f172a">Columnar Arrow / Parquet Sink</text>
      <text x="8" y="28" class="txt-detail">• Aligned byte vectors for training I/O</text>
      <text x="8" y="40" class="txt-detail">• AST-normalized action deduplication</text>
    </g>
    
    <!-- Provenance & Lineage -->
    <g transform="translate(10, 108)">
      <rect width="230" height="42" class="inner-box" />
      <text x="8" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" font-weight="700" fill="#0f172a">Lineage Stamping Engine</text>
      <text x="8" y="28" class="txt-mono">H_lineage = HMAC(K_pipe, H_model ∥ ...)</text>
      <text x="8" y="39" class="txt-mono">Content-addressable trajectory index</text>
    </g>
    
    <!-- Destination Split Badges -->
    <g transform="translate(10, 158)">
      <rect width="110" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="3" />
      <text x="55" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5px" font-weight="700" fill="#15803d" text-anchor="middle">Object Store Sink</text>
      <text x="55" y="26" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#166534" text-anchor="middle">τ ∈ D_train (Clean)</text>
      
      <rect x="120" y="0" width="110" height="34" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" rx="3" />
      <text x="175" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5px" font-weight="700" fill="#b91c1c" text-anchor="middle">Quarantine Sink</text>
      <text x="175" y="26" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#991b1b" text-anchor="middle">Hard Negatives (τ⁻)</text>
    </g>
    
    <text x="14" y="214" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5px" fill="#047857">• Repo-Family Disjoint Partitions</text>
  </g>

  <!-- ==================== BACKPRESSURE BUS ==================== -->
  <path d="M 610 250 L 610 400 L 110 400 L 110 252" class="edge-bp" marker-end="url(#arr-bp)" />
  
  <rect x="260" y="388" width="290" height="24" fill="#ffffff" stroke="#ef4444" stroke-width="1.2" rx="3" />
  <text x="405" y="404" class="txt-bp">Closed-Loop Backpressure Feedback (Throttle λ_rollout)</text>

</svg>
