<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="490" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- TOP ROW: ROLLOUT, VERIFICATION & CURATION                         -->
  <!-- ================================================================= -->

  <!-- Step 1: Task Seed Corpus -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="155" height="194" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#1e293b">1. TASK SEED CORPUS</text>

    <text x="10" y="42" font-size="7.5" fill="#334155">• Task prompts: x ~ D_tasks</text>
    <text x="10" y="58" font-size="7.5" fill="#334155">• Tool schemas &amp; mocks</text>
    <text x="10" y="74" font-size="7.5" fill="#334155">• Sandbox ground truth</text>
    <text x="10" y="90" font-size="7.5" fill="#334155">• Unit test harnesses</text>
    <text x="10" y="106" font-size="7.5" fill="#334155">• Initial state fixtures</text>

    <g transform="translate(10, 150)">
      <rect x="0" y="0" width="135" height="32" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="67" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f172a">Synthetic Seeds</text>
      <text x="67" y="25" text-anchor="middle" font-size="6.8" fill="#64748b">Task prompt bank</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="195" y1="171" x2="222" y2="171" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- Step 2: Teacher Policy Rollouts -->
  <g transform="translate(225, 74)">
    <rect x="0" y="0" width="165" height="194" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#6d28d9">2. TEACHER ROLLOUT</text>

    <text x="10" y="42" font-size="7.5" fill="#4c1d95">• Frontier teacher: π_θ</text>
    <text x="10" y="58" font-size="7.5" fill="#4c1d95">• Multi-turn execution loop</text>
    <text x="10" y="74" font-size="7.5" fill="#4c1d95">• Tool call generation</text>
    <text x="10" y="90" font-size="7.5" fill="#4c1d95">• Sandboxed runtime</text>
    <text x="10" y="106" font-family="Courier, monospace" font-size="7" fill="#6d28d9">• Trace: τ = (s, a, o)</text>

    <g transform="translate(10, 150)">
      <rect x="0" y="0" width="145" height="32" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="72" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Candidate Traces</text>
      <text x="72" y="25" text-anchor="middle" font-size="6.8" fill="#64748b">Raw trajectory pool</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="390" y1="171" x2="417" y2="171" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- Step 3: Execution Verifier -->
  <g transform="translate(420, 74)">
    <rect x="0" y="0" width="170" height="194" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#0369a1">3. EXECUTION VERIFIER</text>

    <text x="10" y="42" font-size="7.5" fill="#0c4a6e">• Unit tests &amp; assertions</text>
    <text x="10" y="58" font-size="7.5" fill="#0c4a6e">• Syntax &amp; schema checks</text>
    <text x="10" y="74" font-size="7.5" fill="#0c4a6e">• Workspace state diff audits</text>
    <text x="10" y="90" font-size="7.5" fill="#0c4a6e">• Trajectory step bounds</text>
    <text x="10" y="106" font-family="Courier, monospace" font-size="7" fill="#0284c7">• Reward: R(τ) ∈ {0, 1}</text>

    <g transform="translate(10, 150)">
      <rect x="0" y="0" width="150" height="32" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="75" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0284c7">Rejection Gate</text>
      <text x="75" y="25" text-anchor="middle" font-size="6.8" fill="#64748b">Binary pass / fail verdict</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4A (Pass: Upward slant) -->
  <path d="M 590 130 L 638 114" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="592" y="108" width="38" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="611" y="119" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">Pass</text>

  <!-- Arrow 3 -> 4B (Fail: Downward slant) -->
  <path d="M 590 212 L 638 226" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>
  <rect x="592" y="222" width="38" height="16" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="611" y="233" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">Fail</text>

  <!-- Step 4A: Golden Path Extraction (Top Right) -->
  <g transform="translate(645, 74)">
    <rect x="0" y="0" width="275" height="92" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="275" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#15803d">4A. GOLDEN PATH EXTRACTION</text>
    <rect x="205" y="5" width="60" height="14" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="235" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">Optimal</text>

    <text x="10" y="44" font-size="7.5" fill="#334155">• Prune redundant tool retries, loops, and dead-ends</text>
    <text x="10" y="60" font-size="7.5" fill="#334155">• Minimal step count filter: <tspan font-weight="700" font-family="Courier, monospace">τ* = argmin |τ|</tspan></text>
    <text x="10" y="76" font-size="7.5" font-weight="700" fill="#15803d">• Ingests pristine traces into golden dataset D_golden</text>
  </g>

  <!-- Step 4B: Error Recovery Synthesis (Bottom Right) -->
  <g transform="translate(645, 178)">
    <rect x="0" y="0" width="275" height="90" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="275" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#b45309">4B. ERROR RECOVERY SYNTHESIS</text>
    <rect x="205" y="5" width="60" height="14" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="235" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">Recovery</text>

    <text x="10" y="44" font-size="7.5" fill="#334155">• Inject tool exception or timeout at pivot step t*</text>
    <text x="10" y="58" font-size="7.5" fill="#334155">• Prompt teacher from s_err for counterfactual repair</text>
    <text x="10" y="72" font-size="7.5" font-weight="700" fill="#b45309">• Retain trace if recovery passes verifier (D_recovery)</text>
  </g>

  <!-- Feedback Discard Loop from 4B -->
  <path d="M 782 268 L 782 284 L 505 284 L 505 271" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-red)"/>
  <rect x="585" y="276" width="120" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="645" y="287" text-anchor="middle" font-size="7" font-weight="700" fill="#991b1b">Discard if Unrecovered</text>

  <!-- Downward Bus to Step 5 -->
  <path d="M 920 120 L 935 120 L 935 320 L 910 320 L 910 336" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 920 223 L 935 223" stroke="#d97706" stroke-width="1.5"/>

  <!-- ================================================================= -->
  <!-- STEP 5: MULTI-TURN LOSS MASKING & SFT FORMATTING ENGINE           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="880" height="150" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">5. MULTI-TURN FORMATTING &amp; SELECTIVE LOSS MASKING ENGINE</text>

    <!-- Visual Token Sequence Blocks -->
    <g transform="translate(14, 34)">
      <!-- System Prompt -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="120" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="60" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">System Prompt</text>
        <text x="60" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Loss Mask = 0</text>
      </g>

      <!-- User Instruction -->
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="120" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="60" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">User Instruction</text>
        <text x="60" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Loss Mask = 0</text>
      </g>

      <!-- Agent Thought & Tool Call -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="150" height="42" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="75" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Thought + Tool Call</text>
        <text x="75" y="32" text-anchor="middle" font-size="7.5" font-weight="700" fill="#7c3aed">Loss Mask = 1 (Active)</text>
      </g>

      <!-- Tool Observation (Masked) -->
      <g transform="translate(420, 0)">
        <rect x="0" y="0" width="140" height="42" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="70" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">Tool Observation</text>
        <text x="70" y="32" text-anchor="middle" font-size="7.5" fill="#dc2626">Loss Mask = 0 (Masked)</text>
      </g>

      <!-- Agent Recovery / Final Output -->
      <g transform="translate(570, 0)">
        <rect x="0" y="0" width="160" height="42" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="80" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Recovery + Final Output</text>
        <text x="80" y="32" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">Loss Mask = 1 (Active)</text>
      </g>

      <!-- Curated Batch Output -->
      <g transform="translate(740, 0)">
        <rect x="0" y="0" width="112" height="42" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="56" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">SFT Batch</text>
        <text x="56" y="32" text-anchor="middle" font-size="7.5" font-weight="700" fill="#4c1d95">D_train (Packed)</text>
      </g>
    </g>

    <!-- Narrative & Invariant -->
    <g transform="translate(14, 88)">
      <rect x="0" y="0" width="852" height="50" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="7.5" font-weight="700" fill="#0f172a">Core Systems Invariant:</text>
      <text x="120" y="18" font-size="7.5" fill="#334155">Backpropagation updates model weights exclusively over generated thoughts and tool call arguments (L_CE).</text>
      <text x="12" y="34" font-size="7.5" fill="#475569">Environment returns (sandbox stdout, database outputs) are strictly masked to prevent hallucinated environment simulation and error propagation.</text>
    </g>
  </g>

</g>
</svg>